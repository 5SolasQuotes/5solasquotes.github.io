<main class="wrap"><figure class="quote" id="q-fcf204bac6" data-kw="">
<blockquote><p>The broken bread representing the broken and crucified body, — the wine poured out, the shed blood,–the eating and drinking of them, participation in Christ’s blessings to nourish the soul and make it glad…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ffa696fb07" data-kw="">
<blockquote><p>Mr. Sprint [an opponent] himself lays down one ground which proves the refusing of inconvenient ceremonies to be a greater duty than the preaching of the Word: for he holds that the substantials of the Second Table do overrule the ceremonials of the First Table, according to that which God says, ‘I will have mercy and not sacrifice,’ (Mt. 12:7). And elsewhere he teaches that to tend a sick person ready to die is a greater duty than the hearing of the Word. Now to practice inconvenient and scandalous ceremonies is to commit soul-murder, and so to break one of the most substantial duties of the Second Table. Therefore, according to Mr. Sprint’s own ground, the refusing of inconvenient and scandalous ceremonies is a greater duty than the preaching of the Word, which is but a ceremonial of the First Table, and if the neglect of tending a sick person’s body be a greater sin than to omit the hearing of many sermons, much more to murder the souls of men by practicing inconvenient and scandalous ceremonies, is a greater sin than to omit the preaching of many sermons, which is all the omission (if there be any) of those who suffer deprivation for refuising to conform unto inconvenient ceremonies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 1, p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-2815f4ead8" data-kw="">
<blockquote><p>Again, hereby all Popish corruptions and mixtures brought into this sacrament [of baptism] are confuted and condemned, as their cream, their tapers [candles], their crosses, their censers, their salt, their spittle, their holy-water, their exorcisings and conjurations, having also an opinion of salvation and worship annexed unto them… True it is, if all the other parts and actions be observed, these inventions and additions, which are so many abuses make not baptism void, neither bring a nullity therof…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Badges of Christianity, or a Treatise of the Sacraments</cite>, … (London, 1606), Ch. 5, ‘Of the third outward part of baptism’, pp. 146-7</span></figcaption>

</figure><figure class="quote" id="q-c40c632b2a" data-kw="">
<blockquote><p>The third innovation is that the word of promise, ‘This is my body,’ ‘This cup is the new testament, etc.’ is not uttered demonstratively when the elements are delivered to every communicant. It is not enough that the words of the institution were rehearsed before by way of history narratively, or materially. This sacrament is an imitation of Christ, not a recital of his words and actions; it is to do as He did, and not to report what He did, says Pierre du Moulin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute upon Communicating at our Confused Communions</cite>, ch. 4, ‘Of the Words Uttered at the Delivery of the Elements’ in A Dispute upon Communicating at our Confused Communions (Amsterdam, 1624), pp. 24-28</span></figcaption>

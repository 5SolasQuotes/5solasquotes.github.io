<main class="wrap"><figure class="quote" id="q-cff4795b7e" data-kw="">
<blockquote><p>Here, then, we have our Lord’s own testimony regarding His relation to the law of God. His first and most comprehensive declaration upon the subject — the one which may be said to rule all the others — is the utterance on the mount, ‘Think not that I came to destroy the law or the prophets, I came not to destroy (καταλῦσαι), to dissolve, abrogate, make void), but to fulfil (πληρῶσαι).’ This latter expression must be taken in its plain and natural sense; therefore, not as some would understand it, to confirm or ratify — which is not the import of the word, and also what the law and the prophets did not require. God’s word needs no ratification. Nor, as others, to fill up and complete their teaching — for this were no proper contrast to the destroying or making void.

No; it means simply to substantiate, by doing what they required, or making good what they announced. To fulfil a law (πληροῦν νόμου), was a quite common expression, in profane as well as sacred writings, and only in the sense now given. So we find Augustine confidently urging it against the Manichaean perverters of the truth in his day: ‘The law (says he) is fulfilled when the things are done which are commanded. . . . Christ came not to destroy the law but to fulfil it: not that things might be added to the law which were wanting, but that the things written in it might be done — which His own words confirm; for He does not say, “One jot or one tittle shall not pass from the law” till the things wanting are added to it, but “till all be done.” And uttered as the declaration was when men’s minds were fermenting with all manner of opinions respecting the intentions of Jesus, it was plainly meant to assure them that He stood in a friendly relation to the law and the prophets, and could no more, in His teaching than in His working, do what would be subversive of their design. They must find in Him only their fulfilment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-fairbairn.html">Patrick Fairbairn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Revelation of Law in Scripture: Considered with respect both to its own Nature, and to its Relative Place in Successive Dispensations. The Third Series of the ‘Cunningham Lectures’</cite>, (Edinburgh: T. &amp; T. Clark, 1869), pp 223-24.</span></figcaption>

<blockquote><p>(6.) They that want faith cannot bring forth fruit unto the glory of God. No more than these branches broken down can bear fruit, no more can a man without faith bring forth good fruit unto God. What is that which makes folk like briers and thorns? Whence their profanity, ungodliness, and throwing out oaths for every trifling matter? Is it not owing to their unbelief? And,

(7.) This is the woefulness of their case that want faith, that whatsoever they do is sin. “Whatsoever is not of faith is sin.” Everything that people do is sin, if they believe not. The very work and labour they are about is sin. Their plowing, their eating, their drinking, their walking, their sitting, their sleeping, and all that they do is sin. Their hearing, their reading, their praying is sin. And is not that a deplorable case, to have all that a man doeth looked upon as sin? And so it is with such as are destitute of the grace of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-guthrie.html">William Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon VII in Sermons in Times of Persecution in Scotland, by Sufferers for the Royal Prerogatives of Jesus Christ</cite></span></figcaption>

</figure><figure class="quote" id="q-56cc9ae88d" data-kw="">
<blockquote><p>If a man desire to have his wife chaste both in body and mind, and cannot love her if she hath given away her love and settled her heart upon another, or that she hath yielded or permitted him (I say) not her whole body, but only her mouth to kiss her, or her neck, or arms to embrace her: Think we that Jesus Christ desireth not his spouse to be much more pure both in body and mind: Think, we that he can abide that we should dedicate our heart to any other than to him: Think we that he delighteth, that we should make this body a member of an harlot, a temple of Idols, and of the Devil, and a brothel house of Satan, whereof Jesus is the head, and which he hath consecrated &amp; sanctified as a sovereign bishop, to be the temple of God and dwelling house of the holy Ghost: Think we that he can abide that we should come every day in his sight, and humble our selves before the strumpet of Babylon and do reverence to Baal, &amp; kiss strange gods, &amp; pollute all the members of our body through such fornications &amp; adulteries:

We may perceive it by that which is written in the Law. Thou shalt have none other gods before me, nor in my presence. Thou shalt doe no homage nor reverence to Images. He doth not forbid us only to settle our hearts thereon, But that we should not bow down or make any sign of honour or reverence to them at all: The husband, who that after he hath reconciled his wife to him, should see her frequent the house of the adulterer that seduced her, and see her every day in his arms kissing her, embracing her, and dallying with her, what account could be make of her, but that she is a false, impudent, and desperate strumpet: And if she were an honest woman should she not abhor, even to see him or his house, or to hear talk of him: Ought she not to fear (if she were not too impudent or over much ingrateful) to cast her eyes towards him, whether it were in presence or absence of her husband: Ought she not to fear to provoke him against her, and to give occasion as well to him as to all others, to have some evil opinion and suspicion of her, which might redound to the dishonesting, and defaming as well of her as of her husband.

Ought we not to content our selves to have lived so long &amp; been conversant in the brothel house of Satan, and to have continued in our fornications and adulteries; but that we must return thither again every day and every hour, as though of set purpose we had determined to provoke the Lord to jealousy &amp; to anger, making our members servants to all filthiness, uncleanness, idolatry and superstition: how is it possible that we should acknowledge the great grace and mercy, that God hath bestowed on us, in withdrawing us out of this sink full of blasphemies and abominations, in stead of rejecting us and casting us of, as an Adulteress which hath violated and broken her faith to her husband, and that we make so light account to be conversant always with our old companions, and to serve them, with so great dishonour to our true Spouse Jesus Christ.

Wherefore I greatly marvel that such kind of spirits are to be found amongst those which will have the names to follow the gospel, and to be counted of the number of Disciples of Christ Jesus, which dare yet maintain that the faithful and those to whom God hath revealed the truth of his Gospel may communicate with idolaters and superstitious persons, in their idolatries, and superstitions, and be partaker, of the tables of Devils, whereunto we cannot approach without overthrowing the table of Christ Jesus: I tremble when I heart that such speeches passe, from the mouths of those which boast themselves of the Gospel, and so much the more, for that so boldly, they dare give that council to others: for their opinions are so far contrary to truth, and so strange to any good Christian heart, that it were better such men had never heard speak of Christ Jesus nor his religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-viret.html">Pierre Viret</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An epistle to the faithful necessary for all the children of God: especially in the so dangerous days</cite>, trans. F. H. (London: Tobie Smith, 1582), unpaginated.</span></figcaption>

ere+an+honest+woman+should+she+not+abhor%2C+even+to+see+him+or+his+house%2C+or+to+hear+talk+of+him%3A+Ought+she+not+to+fear+%28if+she+were+not+too+impudent+or+over+much+ingrateful%29+to+cast+her+eyes+towards+him%2C+whether+it+were+in+presence+or+absence+of+her+husband%3A+Ought+she+not+to+fear+to+provoke+him+against+her%2C+and+to+give+occasion+as+well+to+him+as+to+all+others%2C+to+have+some+evil+opinion+and+suspicion+of+her%2C+which+might+redound+to+the+dishonesting%2C+and+defaming+as+well+of+her+as+of+her+husband.%0A%0AOught+we+not+to+content+our+selves+to+have+lived+so+long+%26+been+conversant+in+the+brothel+house+of+Satan%2C+and+to+have+continued+in+our+fornications+and+adulteries%3B+but+that+we+must+return+thither+again+every+day+and+every+hour%2C+as+though+of+set+purpose+we+had+determined+to+provoke+the+Lord+to+jealousy+%26+to+anger%2C+making+our+members+servants+to+all+filthiness%2C+uncleanness%2C+idolatry+and+superstition%3A+how+is+it+possible+that+we+should+acknowledge+the+great+grace+and+mercy%2C+that+God+hath+bestowed+on+us%2C+in+withdrawing+us+out+of+this+sink+full+of+blasphemies+and+abominations%2C+in+stead+of+rejecting+us+and+casting+us+of%2C+as+an+Adulteress+which+hath+violated+and+broken+her+faith+to+her+husband%2C+and+that+we+make+so+light+account+to+be+conversant+always+with+our+old+companions%2C+and+to+serve+them%2C+with+so+great+dishonour+to+our+true+Spouse+Jesus+Christ.%0A%0AWherefore+I+greatly+marvel+that+such+kind+of+spirits+are+to+be+found+amongst+those+which+will+have+the+names+to+follow+the+gospel%2C+and+to+be+counted+of+the+number+of+Disciples+of+Christ+Jesus%2C+which+dare+yet+maintain+that+the+faithful+and+those+to+whom+God+hath+revealed+the+truth+of+his+Gospel+may+communicate+with+idolaters+and+superstitious+persons%2C+in+their+idolatries%2C+and+superstitions%2C+and+be+partaker%2C+of+the+tables+of+Devils%2C+whereunto+we+cannot+approach+without+overthrowing+the+table+of+Christ+Jesus%3A+I+tremble+when+I+heart+that+such+speeches+passe%2C+from

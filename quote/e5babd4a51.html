<main class="wrap"><figure class="quote" id="q-e5babd4a51" data-kw="">
<blockquote><p>Now, lest this so strict observance of the Lord’s day, in spending the whole day in holy meditation, holy exercises, and works of mercy, excepting only necessary repasts, should be thought, as it is by some, to be merely Jewish, or only the private opinion of some zealots, more nice than wise; know, that as the fourth commandment is of moral obligation, there is the same reason for the strict observance of it, as any other divine precept, as against idolatry, murder, fornication, &amp;c.

And taking away of the morality of the fourth commandment, and unloosing the conscience from the immediate bonds of God’s command to observe a day for his solemn worship, overthrows true religion, and the power of godliness, and opens a wide gap to atheism, profaneness, and all licentiousness; as daily experience proves in those persons and places, by whom and where the Lord’s day is not holily and duly observed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-scudder.html">Henry Scudder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Daily Walk in Holy Security and Peace</cite>, (1627; Philadelphia, 1800), p. 94.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2777d66ffc" data-kw="">
<blockquote><p>Concl. The former considerations being clear, we hold that such a Church-covenant is a conceit destitute of all authority of God’s Word, Old or New Testament, and therefore to be rejected as a way of men’s devising,

1. Argum. All will-worship laying a band on the Conscience, where God hath laid none, is damnable; but to tie the oath of God to one particular duty rather then another, so as you cannot, without such an oath, enter into such a state, nor have title and right to the seals of grace and God’s Ordinances, is will-worship, and that by virtue of a divine Law, and is a binding of the Conscience where God hath not bound it. …

I prove the assumption; for a Minister to swear the oath of fidelity to his flock, is lawful; but to tie an oath so to his Ministry, as to say the Apostles teach, he cannot be a minister who sweareth not that oath, is to lay a bond on the Conscience, where God hath laid none. That a father swear to perform the duties of a father, a master the duties of a master towards his servant, is lawful; but to lay a bond on him, that he is in Conscience, and before God no father, no master, except he swear to perform those duties, is to lay a bond on the Conscience where God hath laid none.

So to swear subjection to such a Ministry and visible Church, is lawful; but to tie by an Apostolic Law and practice the oath of God so to such duties, as to make this Church-oath the essential form of such membership, so as you cannot enter into Church-state, nor have right to the Seals of the Covenant without such an oath, is to bind where God hath not bound; for there is no Law of God, putting upon any Church-oath such a state, as that it is the essential form of Church-membership, without the which a man is no Church-member, and the Church visible, not swearing this oath is no Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The due right of presbyteries, or, A peaceable plea for the government of the Church of Scotland</cite>, (London: Richard Whittaker and Andrew Crook, 1644), pp 88, 89.</span></figcaption>

</figure><figure class="quote" id="q-2ea2a6b47a" data-kw="">
<blockquote><p>Also when it [‘worship’] expresses the Greek word sebomai; as Acts 18:13, ‘to worship God contrary to the law;’ and Acts 18:7, ‘Justus a worshipper of God.’ And so both it and the Greek answer to the Hebrew jaré [יָרֵא], which properly signifies to fear or reverence, as Mt. 15:9, ‘in vaine they worship Me;’ for that which in Hebrew is, ‘their fear towards me,’ Isa. 29:13. So Job and Jonah, as the Hebrew says, ‘feared,’ as the Greek [Septuagint] translates, ‘worshipped God.’ Also when it interprets the Greek word threskeuo, as Col. 2:18, ‘the worshipping of angels;’ and verse 23, ‘in will-worship’ or voluntary religion. Thus worship is largely used for the fear and service of God, or any religious action.</p></blockquote>

<blockquote><p>You also wrote me concerning some supposed image of Christ, which image you wished me to send you. Now what kind of thing is this that you call the image of Christ? I do not know what impelled you to request that an image of Our Saviour should be delineated. What sort of image of Christ are you seeking? Is it the true and unalterable one which bears His essential characteristics, or the one which He took up for our sake when He assumed the form of a servant? . . . Granted, He has two forms, even I do not think that your request has to do with His divine form. . . . Surely then, you are seeking His image as a servant, that of the flesh which He put on for our sake. But that, too, we have been taught, was mingled with the glory of His divinity so that the mortal part was swallowed up by Life. Indeed, it is not surprising that after His ascent to heaven He should have appeared as such, when, while He—the God, Logos—was yet living among men, He changed the form of the servant, and indicating in advance to a chosen band of His disciples the aspect of His Kingdom, He showed on the mount that nature which surpasses the human one—when His face shone like the sun and His garments like light. Who, then, would be able to represent by means of dead colors and inanimate delineations (skiagraphiai) the glistening, flashing radiance of such dignity and glory, when even His superhuman disciples could not bear to behold Him in this guise and fell on their faces, thus admitting that they could not withstand the sight? If, therefore, His incarnate form possessed such power at the time, altered as it was by the divinity dwelling within Him, what need I say of the time when He put off mortality and washed off corruption, when He changed the form of the servant into the glory of the Lord God. . . ? … How can one paint an image of so wondrous and unattainable a form—if the term ‘form’ is at all applicable to the divine and spiritual essence—unless, like the unbelieving pagans, one is to represent things that bear no possible resemblance to anything. . . ? For they, too, make such idols when they wish to mould the likeness of what they consider to be a god or, as they might say, one of the heroes or anything else of the kind, yet are unable even to approach a resemblance, and so delineate and represent some strange human shapes. Surely, even you will agree that such practices are not lawful for us. But if you mean to ask of me the image, not of His form transformed into that of God, but that of the mortal flesh before its transformation, can it be that you have forgotten that passage in which God lays down the law that no likeness should be made either of what is in heaven or what is in the earth beneath? Have you ever heard anything of the kind either yourself in church or from another person? Are not such things banished and excluded from churches all over the world, and is it not common knowledge that such practices are not permitted to us alone? Once— I do not know how—a woman brought me in her hands a picture of two men in the guise of philosophers and let fall the statement that they were Paul and the Saviour—I have no means of saying where she had had this from or learned such a thing. With the view that neither she nor others might be given offence, I took it away from her and kept it in my house, as I thought it improper that such things ever be exhibited to others, lest we appear, like idol worshippers, to carry our God around in an image. I note that Paul instructs all of us not to cling any more to things of the flesh; for, he says, though we have known Christ after the flesh, yet now henceforth know we Him no more. It is said that Simon the sorcerer is worshipped by godless heretics painted in lifeless material. I have also seen myself the man who bears the name of madness57 [painted] on an image and escorted by Manichees. To us, however, such things are forbidden. For in confessing the Lord God, Our Saviour, we make ready to see Him as God, and we ourselves cleanse our hearts that we may see Him after we have been cleansed. . .</p></blockquote>

he Lord God, Our Saviour, we make ready to see Him as God, and we ourselves cleanse our hearts that we may see Him after we have been cleansed. . .”

d+washed+off+corruption%2C+when+He+changed+the+form+of+the+servant+into+the+glory+of+the+Lord+God.+.+.+%3F+%E2%80%A6+How+can+one+paint+an+image+of+so+wondrous+and+unattainable+a+form%E2%80%94if+the+term+%E2%80%98form%E2%80%99+is+at+all+applicable+to+the+divine+and+spiritual+essence%E2%80%94unless%2C+like+the+unbelieving+pagans%2C+one+is+to+represent+things+that+bear+no+possible+resemblance+to+anything.+.+.+%3F+For+they%2C+too%2C+make+such+idols+when+they+wish+to+mould+the+likeness+of+what+they+consider+to+be+a+god+or%2C+as+they+might+say%2C+one+of+the+heroes+or+anything+else+of+the+kind%2C+yet+are+unable+even+to+approach+a+resemblance%2C+and+so+delineate+and+represent+some+strange+human+shapes.+Surely%2C+even+you+will+agree+that+such+practices+are+not+lawful+for+us.+But+if+you+mean+to+ask+of+me+the+image%2C+not+of+His+form+transformed+into+that+of+God%2C+but+that+of+the+mortal+flesh+before+its+transformation%2C+can+it+be+that+you+have+forgotten+that+passage+in+which+God+lays+down+the+law+that+no+likeness+should+be+made+either+of+what+is+in+heaven+or+what+is+in+the+earth+beneath%3F+Have+you+ever+heard+anything+of+the+kind+either+yourself+in+church+or+from+another+person%3F+Are+not+such+things+banished+and+excluded+from+churches+all+over+the+world%2C+and+is+it+not+common+knowledge+that+such+practices+are+not+permitted+to+us+alone%3F+Once%E2%80%94+I+do+not+know+how%E2%80%94a+woman+brought+me+in+her+hands+a+picture+of+two+men+in+the+guise+of+philosophers+and+let+fall+the+statement+that+they+were+Paul+and+the+Saviour%E2%80%94I+have+no+means+of+saying+where+she+had+had+this+from+or+learned+such+a+thing.+With+the+view+that+neither+she+nor+others+might+be+given+offence%2C+I+took+it+away+from+her+and+kept+it+in+my+house%2C+as+I+thought+it+improper+that+such+things+ever+be+exhibited+to+others%2C+lest+we+appear%2C+like+idol+worshippers%2C+to+carry+our+God+around+in+an+image.+I+note+that+Paul+instructs+all+of+us+not+to+cling+any+more+to+things+of+the+flesh%3B+for%2C+he+says%2C+

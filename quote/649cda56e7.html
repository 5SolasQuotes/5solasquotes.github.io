<blockquote><p>4. The Church is not made ministerial by us, without the body exclusively wholly (for Christ’s government is voluntary), nor ought any new thing to be concluded in our assemblies while the people hear of it: for if the Romans used rogare et suadere legem [to ask and persuade the law], and obtain the consent of the people thereunto, far more are they not to be acknowledged as Church-laws that are to be obtruded upon the godly against their will and knowledge; and much more if they be against the Word of God, and former godly acts with consent agreed unto by the Church; that is, whether the people consent or not, but yet without the body, whether they exercise acts of jurisdiction or not, for no act of jurisdiction is due to them; and to exclude the consent of women, no less interessed [interested] in practice of conscience than men, is to be Lord’s of their faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church Discipline Penned by Mr. Thomas Hooker… (London, 1658)</cite>, p. 258</span></figcaption>

<blockquote><p>Those, however, who are believed to be presbyters by many, but serve their own lusts, and, do not place the fear of God supreme in their hearts, but conduct themselves with contempt towards others, and are puffed up with the pride of holding the chief seat, and work evil deeds in secret, saying, No man sees us, shall be convicted by the Word, who does not judge after outward appearance (secundum gloriam), nor looks upon the countenance, but the heart</p></blockquote>

</figure><figure class="quote" id="q-205010c68a" data-kw="">
<blockquote><p>The Order for the election of elders in use at Edinburgh at the Reformation gave the Session the duty of selecting a number of names from which the congregation chose half to be elders. This Order was generally confirmed by the Assembly of 1582. According to the Second Book of Discipline the Session nominates and the people approve. The names of those proposed were always brought before the congregation in order that any objection might be brought forward. [John G.] Lorimer, quoting the Presbyterian Review, 1834, makes a vain attempt to insist that there was real popular election in the seventeenth century… Everybody, however, was satisfied that the people’s rights were amply preserved when the Session elected. In 1642 the Assembly stated the rule that the old Session should elect the new [elders] both in town and country, always of course with the consent of the people [contra patronage]… The same custom was followed in the churches of Strassburg, France and Holland… …On these occasions [in 1654, 1656, 1658, 1669, which were enumerated by Henderson, though not quoted here] the congregation apparently was not present, though the regular edicts with regard to objections had been submitted; but clearly it was more usual to admit elders publicly before the congregation, as for example at Yester in 1683. Nevertheless, at the end of the eighteenth century and beginning of the nineteenth elders at Oldmachar were regularly admitted simply at a Session meeting. … But the idea of popular election really came in with the Secessions [1733 ff.]. Currie, of Kinglassie, a Church of Scotland minister, had attempted something approaching popular election before 1740. In 1761 Aberdeen Associate Church minutes that ‘this congregation knows that the right of election belongs to such as are in full communion with us.’ In the Church of Scotland some of the Evangelicals favored popular election, and Lorimer devotes a chapter [ch. 10] in his Eldership of the Church of Scotland to advocating the method. It had been definitely rejected by Assembly a few years previously, but in 1842 it was carried, and it became the rule in the Free Church. At Urquhart Free Church in 1845 elders were elected at a meeting of male communicants and male heads of families…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/g-d-henderson.html">G.D. Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 216-25 of ch. 6, ‘Controversy’ in The Scottish Ruling Elder (1935)</cite></span></figcaption>

</figure><figure class="quote" id="q-dc6148f3bb" data-kw="">
<blockquote><p>‘Do not harshly rebuke an elder.’ He now recommends to Timothy gentleness and moderation in correcting faults. Correction is a medicine, which has always some bitterness, and consequently is disagreeable. Besides, Timothy being a young man, his severity would have been less tolerable, if it had not been somewhat moderated. ‘But exhort him as a father.’ The Apostle enjoins him to reprove elder persons as parents; and he even employs the milder term, ‘exhort.’ It is impossible not to be moved with reverence, when we place before our eyes our father or our mother; in consequence of which, instead of harsher vehemence, we are immediately influenced by modesty. Yet it ought to be observed, that he does not wish old men to be spared or indulged in such a manner as to sin with impunity and without correction; he only wishes that some respect should be paid to their age, that they may more patiently bear to be admonished. ‘The younger as brethren.’ Even towards younger persons he wishes moderation to be used, though not in an equal degree; for the vinegar must always be mingled with oil, but with this difference, that reverence should always be shown to older persons, and equals should be treated with brotherly gentleness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Tim.</cite>, 5:1</span></figcaption>

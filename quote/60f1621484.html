<blockquote><p>(3) You must take heed how you hear, because if you do not, the Word will not only be ineffectual to you, but do you a great deal of hurt.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9c3b0121fb" data-kw="">
<blockquote><p>The power of a univocal agent is wholly manifested in its effect. The generative power of man, for example, is not able to do more than beget man. But the power of a non-univocal agent does not wholly manifest itself in the production of its effect: as, for example, the power of the sun does not wholly manifest itself in the production of an animal generated from putrefaction. Now it is clear that God is not a univocal agent. For nothing agrees with Him either in species or in genus, as was shown above (Q. 3, A. 5; Q. 4, A. 3). Whence it follows that His effect is always less than His power. It is not necessary, therefore, that the infinite power of God should be manifested so as to produce an infinite effect. Yet even if it were to produce no effect, the power of God would not be ineffectual; because a thing is ineffectual which is ordained towards an end to which it does not attain. But the power of God is not ordered toward its effect as towards an end; rather, it is the end of the effect produced by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, quest. 25, art. 2, reply to obj. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>Three things are to be observed in this speech:

1. God’s resolution not always to strive with man by his Spirit. My Spirit has striven a great while; it shall strive yet a little longer; but it shall not strive always. The Holy Spirit is a striving Spirit with the children of men; striving them away from sin, and to bring them to God; striving by the checks of their own consciences, but the ministry of the Word, by the rebukes of Providence; striving by one fair warning after another to reclaim the sinner. Have not we ourselves experienced these strivings?—something within us that has whispered in an hour of temptation, “Do not this abominable thing which the Lord hates?” ‘Twill be our wisdom to hearken to such whispers, and to close with them, striving against sin. Heb 12:4. If the Spirit of God be resisted in its strivings, and quenched in its motions, though it may strive long, yet it will not strive always. ‘Tis a principle with men not to be always persuading those with whom they cannot prevail; neither will the blessed Spirit do so. If Ephraim be joined to idols, is it not a righteous thing with God to say, Strive no more with him, let him alone? Hosea 4:17. What guest will stay long there where he is not welcome? Is it not wisdom then to improve these strivings while we have them?

2. The reason of that resolution: For that he also is flesh; carnal, earthly, sensual, corrupted, depraved, defiled; and therefore ‘tis to no purpose to strive with him; ‘tis but labor lost. It is as good to go about to change the Ethiopian’s skin or the leopard’s spots, as to reclaim and reform these impenitent sinners. Flesh, in scripture, is frequently opposed to spirit. It is the corrupt nature that renders the strivings of the blessed Spirit ineffectual. ‘Tis the law in the members that wars against the law of the mind. Rom. 7:23. The flesh and the spirit are sworn enemies one to another, and between them there is a constant conflict. Gal. 5:17. Now where the flesh, the carnal part, is so far suffered to prevail, as that the man may be denominated flesh, there the Spirit will not always, will not long strive. Those therefore that would enjoy the Spirit’s strivings, must curb and restrain, and not gratify and encourage, the corrupt motions and carnal desires of the flesh and of the mind. Eph. 2:3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-henry.html">Philip Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the First 11 Chapters of Genesis</cite>, (d. 1696; London: Nisbet &amp; Co., 1839), pp. 166-67 on Gen. 6:3, “And the Lord said, My Spirit shall not always strive with man, for that he also is flesh.”</span></figcaption>

</figure><figure class="quote" id="q-46d54d6e63" data-kw="">
<blockquote><p>Doctrine 3. ‘Counsel of his will’. That is which his will propounded to it, [it] did freely accept. Observe hence that what God wills once, that He effectually works, see Ps. 115, ‘Our God is in heaven and does whatsoever He wills: Who has refused his will?’ so Isa. 46:10. We see in beasts that they have an appetite to that [which] they move after; in men that which they will, that they put out their power to effect; so it is in God: if He will anything, He does work it effectually. That is a frivolous distinction of an effectual and an ineffectual will in God, which stands neither with truth of Scripture, as in this place, nor with the blessedness of God, nor with the nature of things: all that showed Him, which his will accepts, He does effectually work it. [It is] Against [the] blessedness of God: for might God will a thing and not have it, He were not fully blessed, when to have every good will is more blessed than to want [lack] it. Against [the] nature of things, for everything which will and ability works, if God almighty have will to anything, the thing must needs follow. Where there is full power to work anything, applied to the working of it, the thing wrought must needs follow. Here some distinguish and say that in things which God will do, his power does work them effectually, but the things which God would have on condition from us, those his power does not work: an old Pelagian conceit. Would not God have us walk in his commandments, and has He not said that He will put his Spirit in us and make us walk in them? St. Augustine learned that God did promise to work mightily those things He requires from us. If to have the conditional will be more happy than to want it, then God who has power to work the condition in us will not want it: Not to say that this conditional will is absurdly imagined in God: He must will the having a thing on condition which He will not work, and then it is impossible, unless the creature can do something good which He will not do in him; or on condition which He will work, and then He works all He wills; or on such a condition which He sees the creature cannot perform, nor Himself will not make Him perform; and this were idle and frivolous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-baynes.html">Paul Baynes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the First Chapter of the Epistle of Saint Paul, written to the Ephesians</cite>, … some Principal Controversies about Predestination are handled, and diverse arguments of Arminius are examined (London, 1618), on Eph. 1:11, pp. 254-55 Note Baynes’s context against Arminius.</span></figcaption>

<blockquote><p>4. The Fathers erred not so much as many suppose in their ascribing [salvific effects] to baptism. For:

1. Sometime by baptism they mean not only the external ordinance, but the whole work therein to be done; viz. the accepting Christ solemnly in Covenant, and giving up ourselves as a sanctified people to Him, renouncing the flesh, the world and the Devil, and so becoming fully Christians. This is baptism with them, and not the outward sign alone. And what says Peter less, when he says, ‘Baptism saves us,’ and thus expounds himself when he has done? And what say the Fathers more?

2. When they speak of these effects of baptism, they suppose a due recipient or subject, that is, a true believer, or the seed of such: and therefore they oft speak of the inefficacy of the outward baptism to hypocrites.

3. When they speak of the outward ordinance only, the collation which they ascribe to it and all the great effects, are to be understood but by way of obsignation and solemnization, and not solely excluding the internal faith and the Covenant: as actual solemnized marriage gives a woman right to her husband and all that he has, when yet she had a right by secret covenant and contract before. Now common reason and the nature of the thing and many of the contexts showing that the Fathers and Councils must be thus expounded according to these rules, I would fain know how they deserve that heavy accusation that we commonly lay upon them for their judgement in this, or what ground the Papists have to plead them generally for their efficacy ex opere operato [from the work working]? And yet I will not excuse each particular person of them thus.</p></blockquote>

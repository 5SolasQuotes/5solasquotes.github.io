<main class="wrap"><figure class="quote" id="q-4e9b07758c" data-kw="">
<blockquote><p>Osiander&#x27;s objection as to its being inconsistent with the nature of God, falls back upon himself; for though he clothes the saints with a twofold righteousness as with a coat of skins, he is, however, forced to admit, that without forgiveness no man is pleasing to God. If this be so, let him at least admit, that with reference to what is called the proportion of imputation, those are regarded as righteous who are not so in reality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/osiander.html">Osiander</a> › <a href="../topics/union-with-christ/osiander/essential-righteousness.html">Essential righteousness</a></span><span class="t"><a href="../topics/justification/formal-cause.html">Formal Cause: Imputation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f635f317d4" data-kw="">
<blockquote><p>Justification goes beyond forgiveness. Not only are we forgiven because of Christ, but God also declares us righteous because of Christ. God requires two things of us: punishment for our sins and perfection in our lives. Our sins must be punished, and our lives must be righteous. But we cannot bear our own punishment (Ps. 49:7-8), and we cannot provide our own righteousness. “None is righteous; no, not one” (Rom. 3:10). Therefore, God, out of His immeasurable love for us, provided His own Son to do both. Christ bears our punishment, and Christ performs our righteousness. And when we receive Christ (John 1:12), all of His punishment and all of His righteousness is counted as ours (Rom. 4:4-6; 5:1, 19; 8:1; 10:4; 2 Cor. 5:21; Phil. 3:8-9).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-piper.html">John Piper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This Momentary Marriage</cite>, p. 46</span></figcaption>

</figure><figure class="quote" id="q-d5bb7e8c5d" data-kw="">
<blockquote><p>In the past, God had left sins unpunished. He could conceivably be accused of overlooking sin since He had not required punishment for it. Now, however, He has put forth Jesus. This proves that God is just (His wrath required the sacrifice) and that He is the justifier of those who have faith in Jesus (His love provided the sacrifice for them).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/millard-erickson.html">Millard Erickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, p. 828</span></figcaption>

</figure><figure class="quote" id="q-1d5f625a04" data-kw="">
<blockquote><p>Justification is therefore defined as: A gracious action of God, by His mercy toward the Elect, without any work or merit of their own, on account of the satisfaction of Christ, apprehended by true faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/franciscus-junius.html">Franciscus Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputation on Justification</cite>, Thesis II</span></figcaption>

— Franciscus Junius, Theological Disputation on Justification, Thesis II">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CJustification+is+therefore+defined+as%3A+A+gracious+action+of+God%2C+by+His+mercy+toward+the+Elect%2C+without+any+work+or+merit+of+their+own%2C+on+account+of+the+satisfaction+of+Christ%2C+apprehended+by+true+faith.%E2%80%9D%0A%0A%E2%80%94+Franciscus+Junius%2C+Theological+Disputation+on+Justification%2C+Thesis+II&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1d5f625a04.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1d5f625a04.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-e7011f9b00" data-kw="">
<blockquote><p>We are today accepted in the Beloved, today absolved from sin, today acquitted at the bar of God… We are now pardoned; even now are our sins put away; even now we stand in the sight of God accepted, as though we had never been guilty. “There is therefore now no condemnation to them which are in Christ Jesus.” There is not a sin in the Book of God, even now, against one of His people. Who dares to lay anything to their charge? There is neither speck, nor spot, nor wrinkle, nor any such thing remaining upon any one believer in the matter of justification in the sight of the Judge of all the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Morning and Evening</cite>, Morning, May 15</span></figcaption>

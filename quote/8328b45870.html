<main class="wrap"><figure class="quote" id="q-8328b45870" data-kw="Second justification">
<blockquote><p>There is no controversy between us and the sounder Schoolmen as to the beginning of justification. They admit that the sinner, freely delivered from condemnation, obtains justification, and that by forgiveness of sins; but under the term justification they comprehend the renovation by which the Spirit forms us anew to the obedience of the Law; and in describing the righteousness of the regenerate man, maintain that being once reconciled to God by means of Christ, he is afterwards deemed righteous by his good works, and is accepted in consideration of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.14.11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a> › <a href="../topics/justification/twofold-justification/first-and-second-justification.html">First and second justification</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/infused-righteousness.html">Infused righteousness</a></span></div>

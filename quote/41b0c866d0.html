<main class="wrap"><figure class="quote" id="q-41b0c866d0" data-kw="">
<blockquote><p>That though there be most dispute betwixt us and the Papists, upon the with-holding of the Cup of the holy Communion, in the thing it self, there is no more necessity held (by either side) of the use of the one element, then of the other: nor is Christ less present to the faithful, in the one, then in the other, though methinks (besides other advantages on our part) this is of no small moment, that they have made choice of the bread rather then the wine in their half Communion: whereas (with more probability of reason) they might have pleaded for an half communion in wine, then in bread, both because, Our Saviour said expressly, Drink ye all of this, and said not so of the bread, Eat ye all of this, (though he meant no less.) Because that the Blood of Christ (not so much as it is in the body, as let out of the Veins, and made potable liquor) is the proper means of the remission of our sins, without which there is no remission.

Because in the blood, is the life of the creature, yea, it is called life it self, and is diffused all over the body, being the purer part of the nourishment (which we receive) whereof are produced the Spirits, which quicken the whole man in the motion and operation of all his parts, and faculties: so that (in this respect) her case is in my conceit more comfortable (who can take no bread, if she can drink the wine) then theirs, who (contrariwise) are disposed to a dry Communion, and not to a moist, who can eat the bread, but cannot drink the wine of the Sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ley.html">John Ley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A case of conscience, concerning the sacrament of the Lords Supper: when either the bread or wine is wanting, or when there is a desire, yet with an antipathy to them, or debility to receive them</cite>, (London: George Lathum, 1641), pp 17-18.</span></figcaption>

</figure><figure class="quote" id="q-0b00e0383d" data-kw="">
<blockquote><p>And this is one of the Effects which your Transubstantiation operates, destroying the most convincing Arguments you can offer the Infidels, and giving them an infallible means to defend themselves, and right to maintain, That if these Proofs be good, Transubstantiation is not a part of the Christian Religion; or if Transubstantiation be a part of the Christian Religion, these Proofs he of no validity.

It’s certain, if they be Men endued with sense, they will lay hold of the first of these Propositions. In effect it’s apparent, That Mr. Huet‘s Proof, are valid, and good in themselves; whereas ’tis not certain, That Transubstantiation is one of the Doctrines which Christianity teaches, not to say that it ought to be taken for granted, that it is not one of them.

It is so strange and offensive, and so little agrees with the whole Body of revealed Truths; either in general, or particular, that a Man needs only the use of his Senses, free from all prejudices, to perceive, That this comes not from the same Spring, and that the Author of Christianity is a very different Person from the Author of Transubstantiation.

Such Infidels then, that are discerning Men, will separate what’s offered to them jointly. They will embrace Christianity, and reject Transubstantiation: They will receive this Holy Religion, as coming from the Spirit of God, and put from them your Doctrine as a human Invention.

However ’tis not long of you, That they cast not themselves into the other aforementioned extremity: I mean, the persuading themselves that the Proofs of the Christian Religion be invalid. Yet you are for persuading them, not only That Transubstantiation is one of the Doctrines which the Gospel teaches, but moreover one of its principal ones; one of the most essential Points of Christian Religion, and that which can be least spared.

And consequently, if these Infidels be simple enough to believe this, and after such an Error have any reason left, they will only make use of it to persuade themselves, That that Religion which teaches such an incredible Doctrine, could not have been revealed by the Spirit of Truth; and that the Proofs which were made use of to establish the Divinity of it, are of no validity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-la-placette.html">Jean La Placette</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Six conferences concerning the Eucharist wherein is shewed, that the doctrine of transubstantiation overthrows the proofs of Christian religion</cite>, trans. Thomas Tenison (London: Richard Chiswell 1687), pp 7-9.</span></figcaption>

</figure><figure class="quote" id="q-00576a4c2f" data-kw="">
<blockquote><p>Lord, thou knows I am weak in grace, thou seest my faith is feeble, my love cold, my desires faint, my obedience small; but thou hast all fulness of grace; thou art the Fountain, and this Fountain is opened here; thou art the Treasury, and this Treasury is here unlocked.

Those graces I have, though weak, thou begatst them, and wilt not thou now nourish them? From thee I had the being of grace, and from thee I must have the nourishing. Thou hast set up this Ordinance as a means to convey grace, and thou hast promised to remember them that are in thy way, therefore help,—&amp;c.

Besides, may faith say, Lord, thou hast been pleased to implant me into Christ, and shall I die for want of nourishment? thou hast made me a member of Christ, and shall I decay and wither for want of influence? Oh! never let it be said, that a branch in Christ shall wither and decay for want of nourishment, when there is so much in the root; let it never be said, that a member of Christ should wither and die for want of influence and life, seeing there is so much in the Head.

Thou camest, that I might have life; yea, &amp; have it in abundance; why Lord, my graces are weak, here are dying affections, dying dispositions, dying graces, Oh! come down before I die, strengthen the things that are ready to die in me. Thou hast raised me from the death of sin, let me not again drop into the same grave; thou hast wrought graces in me, let them not decay for want of life, when such abundance in thee.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The guard of the tree of life, or, A sacramental discourse shewing a Christians privilege in approaching to God in ordinances, duty in his sacramental approaches, danger if he do not sanctify God in them</cite>, (London: A. Kemble, 1644), pp 66-68.</span></figcaption>

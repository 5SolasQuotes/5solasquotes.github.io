<blockquote><p>The word πάρεσις, remission, more strictly means pretermission, a passing by, or overlooking. Paul repeatedly uses the proper term for remission (ἄφεσις,) as in Eph. 1:7, Heb. 9:22, &amp;c.; but the word here used occurs nowhere else in the New Testament. Many, therefore, consider the selection of this particular term as designed to express the idea, that sins committed before the advent of Christ might more properly be said to be overlooked, than actually pardoned, until the sacrifice of the Redeemer had been completed; see Wolf’s Curæ. Reference is made to Acts 17:30, where God is said to have overlooked the times of ignorance. But as the word used by the apostle is actually used to express the idea of remission, in Greek writers, (see Elsner,) the majority of commentators adopt that meaning here. The words πάρεσις and ἄφεσις express the same thing, but under different aspects. They differ only as not punishing, and pardoning. To say that God did not punish sins under the old dispensation, is only a different way of saying that he pardoned them. So “not to impute iniquity” is the negative statement of justification. This passage, however, is one of the few which the Romanists quote in support of their doctrine that there was no real pardon, justification, or salvation, before the advent of Christ. The ancient believers at death, according to their doctrine, did not pass into heaven, but into the limbus patrum, where they continued in a semi-conscious state until Christ’s descensus ad inferos for their deliverance. The moden transcendental theologians of Germany, who approach Romanism in so many other points, agree with the Papists also here. Thus Olshausen says, “Under the Old Testament there was no real, but only a symbolical forgiveness of sins.” Our Lord, however, speaks of Abraham as in heaven; and the Psalms are filled with petitions and thanksgiving for God’s pardoning mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, (Grand Rapids: Louis Kregel, 1882), 149–50.</span></figcaption>

<blockquote><p>When the creed goes on to say that Christ descended into hell, does that mean that He descended into the limbus, where there is neither joy nor sorrow, so that He might liberate the patriarchs from there? Or does it mean that He descended into the place of the damned? Not at all! For first of all, it is undisputed that the patriarchs experienced joy and comfort even before the death of Christ, as we see in the story of Abraham and Lazarus in Luke 16[:19–26]. Furthermore, nowhere in Scripture is the word “hell” ever taken to mean limbus. The origin of the limbus error is that many thought, and still do think, that sins were not forgiven prior to the suffering of Christ. But Christ’s suffering possessed its power from eternity. For “Christ is the same yesterday, today, and forever” (Heb. 13:8). In Romans 4[:7], Paul defines justification using the words of David: “Blessed are those whose iniquities are forgiven” [Ps. 32:1]. Thereore, in the time of David, before Christ had yet suffered, sins were forgiven through trust in the future sacrifice of Christ. In the same chapter, Paul says that we obtain forgiveness of sins and happiness no differently than Abraham, the father of all believers. Hence we read in Matthew 8[:11] that “many will come from east and west and sit down with Abraham, Isaac, and Jacob in the kingdom of heaven.” As this error, namely, that the patriarchs had no forgiveness of sins prior to the suffering of Christ, gained strength against Scripture, another error emerged from it—the limbus. For it was too difficult to push the patriarchs into hell, since, as they themselves say, there is no redemption from hell. However, they did not dare to place them in eternal happiness since, based on the fact that Christ had not yet suffered, they thought that the patriarchs’ sins were not yet forgiven. Therefore, they invented a middle place, in which there was neither happiness nor sorrow, which the Scholastics called the limbus (in German, dasvorgebeude der Hellen), a kind of porch to hell. The devil was trying to obscure the magnitude of the efficacy of Christ’s sacrifice by denying that the patriarchs in the Old Testament had forgiveness of sins through faith in the sacrifice to come. Therefore, he fabricated the limbus for them, just as he invented purgatory for those faithful ones who have died after Christ suffered. That, too, was intended to take away the power of cleansing sin from the suffering of Christ, which contradicts the clear Word of God (1 John 1:7). Second, we should not say, either, that Christ descended into hell, that is, the place of the damned, in order to vanquish death and the devil there on our behalf or to suffer new torments. Christ both vanquished Satan through His own death and, after His death, suffered no more torments by which to deliver us from Satan’s power, as Hebrews 2[:14–15] testifies: “That through death He might destroy him who had the power of death, that is, the devil, and release those who through fear of death were all their lifetime subject to bondage” (see also Col. 2:14–15). Luke the Evangelist testifies that Christ handed over His spirit to the custody of the Father [Luke 23:46]. Third, the descent into hell cannot be properly taken, either, as the display in hell of Christ’s victory, for that belongs to the exaltation, which began only in His resurrection. The descent into hell, however, belongs to the humiliation, as Peter expressly teaches in Acts 2[:25–27], when he quotes the words of David. When some of the ancient fathers reflected on these things, they concluded that hell should be understood here simply as “the grave.” But if it were nothing more than that, it would not have been necessary to repeat in the articles more obscurely what had already been stated more clearly.</p></blockquote>

<blockquote><p>Justifying faith is properly that which is defined in the catechism; according to which definition, the general nature of saving faith consists in knowledge and an assured confidence; for there can be no faith in a doctrine that is wholly unknown. It is proper for us, therefore, to obtain a knowledge of that in which we are to believe, before we exercise faith; from which we may see the absurdity of the implicit faith of the Papists. The difference, or formal character of saving faith, is the confidence and application which every one makes to himself, of the free remission of sins by and for the sake of Christ. The property, or peculiar character of this faith, is trust and delight in God, on account of this great benefit. The efficient cause of justifying faith is the Holy Spirit. The instrumental cause is the gospel, in which the use of the sacraments is also comprehended. The subject of this faith is the will and heart of man. Justifying or saving faith differs, therefore, from the other kinds of faith, because it alone is that assured confidence by which we apply unto ourselves the merit of Christ, which is done when we firmly believe that the righteousness of Christ is granted and imputed unto us, so that we are accounted just in the sight of God. Confidence is an exercise or motion of the will and heart, following something good—resting and rejoicing in it. The German has it, vertrauen, sich ganz und gar darauf verlassen. Πιστις and πιστευειν the former of which means belief, and the latter to believe, are from πεπεισμαι, which means strongly persuaded; whence πιστευειν, even among profane writers, signifies to wax confident, or to rest upon any thing; as we read in Phocilides, “Believe not the people, for the multitude is deceitful.” And in Demosthenes, “Thou art confident in thyself, &amp;c. Justifying faith differs from historical, because it always includes that which is historical. Historical faith is not sufficient for our justification. The same thing may also be said of the other two kinds of faith. Justifying faith, again, differs from all other kinds of faith, in this, that it is by it alone that we obtain righteousness, and a title to the inheritance of the saints. For if, as the Apostle says, we are justified by faith, and faith is imputed for righteousness, and by faith is the inheritance, then this faith must be one of the four kinds of which we have spoken. But it is not historical faith; for then the devils would also be accounted just, and be heirs of the promise. Neither is it temporary faith; for Christ rejects this. Nor is it the faith of miracles; for in that case, Judas would also be an heir. Hence it is by justifying faith alone that we obtain righteousness, and an inheritance among the saints; which the Scriptures properly and simply call faith, and which is also peculiar to the elect. No man, however, truly knows what justifying faith is, except he who believes, or possesses it; as he, who never saw or tasted honey, knows nothing of its quality or taste, although you may tell him many things of the sweetness of honey. But the man who truly believes, experience these things in himself, and is able, also, to explain them to others. 1. He believes that every thing which the Scriptures contain is true, and from God. 2. He feels himself constrained firmly to believe and embrace these things; for if we confess that they are true and from God, it is proper that we should assent to them. 3. He sees, embraces, and applies particularly, to himself, the promise of grace, or the free remission of sins, righteousness and eternal life, by and for the sake of Christ, as it is said: “He that believeth on the Son hath everlasting life.” (John 3:36.) 4. Having this confidence, he trusts and rejoices in the present grace of God, and from this he thus concludes in reference to future good: since God now loves me, and grants unto me such great blessings, he will also preserve me unto eternal life; because he is unchangeable, and his gifts are without repentance. 5. Joy arises in the heart, in view of such benefits, which joy is accompanied with a peace of conscience that passes all understanding. 6. Then he has a will and an earnest desire to obey all the commands of God, without a single exception, and is willing to endure patiently whatever God may send upon him. The man, therefore, who possesses a justifying faith, does that which is required of him, regardless of the opposition of the world, and the devil. He who truly believes, experiences all these things in himself; and he who experiences these things in himself, truly believes …The effects of justifying faith are, 1. Our justification before God. 2. Joy and delight in God, with peace of conscience. “Being justified by faith, we have peace with God.” (Rom. 5:1.) 3. Conversion, regeneration, and universal obedience. “Purifying their hearts by faith.” (Acts 15:9.) 4. The consequences which belong to the effects of faith, such as an increase of temporal and spiritual gifts, and the reception of these gifts by faith. The first effect, therefore, of justifying faith, is our justification. After this has once taken place, all the other benefits which follow faith are made over unto us, which benefits, we believe, are given unto us by faith, inasmuch as faith is the cause of them. For that which is the cause of a cause, is also the cause of the effect. If faith be, therefore, the last cause of our justification, it is likewise the cause of those things which follow our justification. “Thy faith hath made thee whole.” (Luke 8:48.) In a word, the effects of faith are justification, and regeneration which is begun in this life, and will be perfected in the life to come. (Rom. 3:28; 10:10. Acts 13:39.) …The forgiveness of sins is granted and received by faith alone, which the Holy Spirit works and kindles in us. It may be said then, that the forgiveness of sins is granted at the time when it is received by faith. God has, indeed, determined from everlasting to pardon the sins of those whom he has chosen in Christ, for the sake of his satisfaction, but he pardons the p 309 sins of every one, and of all that believe in Christ, at the time when he accounts them as righteous, and works in their hearts by the Holy Spirit a sense of this pardon, so that they may forever remain certain regard to it. The decree of God, therefore, concerning the forgiveness of sins is everlasting, but the execution of it takes place at the time when we apply to ourselves by faith the forgiveness which the gospel offers unto us. It is in the same way that God always loves his people, but he does not shed abroad this love in their hearts before their repentance. But those who do truly repent obtain at length the testimony of their conscience, by the Holy Spirit which is given unto them, that they are beloved of God, and so enjoy the forgiveness of sins. …It is commonly said, that we are justified by faith correlatively, by which it is meant that we are justified by that which faith has respect to, which is the merit of Christ; or by that which it apprehends: for faith and the satisfaction of Christ have a mutual relation to each other; the one is that which receives, and the other is that which is received. This form of speech is correctly used, because when we thus speak, faith is understood to mean the formal cause of our justification, and the sense is, that the merit of Christ justifies us, and not faith; or that we are justified by that which is apprehended, and not by the instrument which apprehends. But justification may also be correctly attributed to faith, as the instrumental cause, without any such relation, for we may correctly say that we are justified by faith, meaning by it, that we are justified by it as a means: for the effect of an efficient cause is ordinarily attributed to the instrument. But when it is said,” faith is counted for righteousness,” (Rom. 4:5.) and when expressions of a similar character are used, they must necessarily be understood correlatively, in as much as faith is the instrument by which we apprehend the righteousness of Christ, or it is the hand with which we receive the righteousness of Christ. …We are said to be justified by faith only: 1. Because we are justified by the object of faith alone, that is by the merits of Christ only, without which we can have no righteousness whatever: for we are justified for Christ’s sake. Nothing but the merit of Christ can be our righteousness in the sight of God, either as a whole, or a part only. We are justified only by believing, and receiving the righteousness of another, and not by our own works, or merit. All works are excluded from our justification, yea even faith itself in as far as it is a virtue, or work. 2. Because the act which belongs properly to faith is to apprehend, and apply to itself the righteousness of Christ; yea, faith is nothing else than the acceptance itself, or the apprehension of the merits of Christ. 3. Because faith alone is the instrument which apprehends the satisfaction of Christ. Hence it is plain, why the exclusive particle only should be added, as it is in the Catechism, and be maintained against the Papist. It is done, 1. For the purpose of expressing what Paul affirms when he says:” “We are justified freely by his grace, without the deeds of the laws:” And what Christ says;” “only believe.” (Rom. 4:24, 28. Mark. 5:36.) 2. That all our own works, and merits, as well as those of others, may be excluded as being the cause of our justification, that faith may be understood correlatively. We are justified by faith only, that is, by the merits of Christ alone. 3. That not only all our merits, but that even faith itself may be excluded from that which is received by faith; so that when we say, we are justified by faith only, the sense is, that it is not by meriting, but only by receiving; as when it is said, This beggar is enriched only by receiving alms, all works and merits are excluded therefrom, yea, even the very acceptance of alms, in as far as it is viewed as a merit. It is for this reason, that Paul always says, that we are justified by faith, and through faith, as by an instrument; and never on account of faith, as the Papists will have it, who indeed admit both forms of expression, as if faith might be the application of Christ’s righteousness, and be also at the same time a certain work, or merit, by which we are counted worthy of being declared righteous, which is directly opposed to the very nature of faith. For if we were justified on account of our faith, then faith would no longer be the acceptance of the righteousness of another, but it would be the merit, and cause of our own righteousness; neither would it receive the satisfaction of another, for it would no longer stand in need of it. 4. That we may understand the necessity of faith for our justification, and may know that we are justified, not by the merit of faith, but yet just as little without faith, to receive the righteousness of Christ; because it is the province of faith to appropriate this to itself. 5. The orthodox Fathers often use the same form of speech, by faith only. Origen writes:” “The Apostles say, that the justification of faith only is sufficient, so that if any one only believes, he may be justified, even though he does not perform any works.” Ambrose says:“They are justified freely, who, without working or rendering any thing in turn, are justified by faith only as the gift of God.” Again; “How can the Jews suppose that they are justified by the works of the law, seeing they have the justification of Abraham set before them, who was justified, not by the works of the law, but by faith only. The law, therefore, is not necessary, when the sinner is justified before God by faith only.“And again.”God has decreed that he who believes in Christ, should be saved without works, receiving the remission of sins freely by faith only.” We are therefore justified by faith only, which means that it is by the merits of Christ alone, apprehended by faith. This we must firmly maintain, and believe: 1. For the glory of God, that so the sacrifice of Christ may not be impaired. 2. For our comfort, that we may be assured that our righteousness does not depend upon our works, (for if this were the case we should lose it thousands of times,) but upon the sacrifice and merit of Christ alone.</p></blockquote>

— Zacharias Ursinus, The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism, trans. G. W. Williard, (Cincinnati, OH: Elm Street Printing Company, 1888, 113, 110–11, 308–09, 331–32. [“Holy Ghost” revised to “Holy Spirit”]">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CJustifying+faith+is+properly+that+which+is+defined+in+the+catechism%3B+according+to+which+definition%2C+the+general+nature+of+saving+faith+consists+in+knowledge+and+an+assured+confidence%3B+for+there+can+be+no+faith+in+a+doctrine+that+is+wholly+unknown.+It+is+proper+for+us%2C+therefore%2C+to+obtain+a+knowledge+of+that+in+which+we+are+to+believe%2C+before+we+exercise+faith%3B+from+which+we+may+see+the+absurdity+of+the+implicit+faith+of+the+Papists.+The+difference%2C+or+formal+character+of+saving+faith%2C+is+the+confidence+and+application+which+every+one+makes+to+himself%2C+of+the+free+remission+of+sins+by+and+for+the+sake+of+Christ.+The+property%2C+or+peculiar+character+of+this+faith%2C+is+trust+and+delight+in+God%2C+on+account+of+this+great+benefit.+The+efficient+cause+of+justifying+faith+is+the+Holy+Spirit.+The+instrumental+cause+is+the+gospel%2C+in+which+the+use+of+the+sacraments+is+also+comprehended.+The+subject+of+this+faith+is+the+will+and+heart+of+man.+Justifying+or+saving+faith+differs%2C+therefore%2C+from+the+other+kinds+of+faith%2C+because+it+alone+is+that+assured+confidence+by+which+we+apply+unto+ourselves+the+merit+of+Christ%2C+which+is+done+when+we+firmly+believe+that+the+righteousness+of+Christ+is+granted+and+imputed+unto+us%2C+so+that+we+are+accounted+just+in+the+sight+of+God.+Confidence+is+an+exercise+or+motion+of+the+will+and+heart%2C+following+something+good%E2%80%94resting+and+rejoicing+in+it.+The+German+has+it%2C+vertrauen%2C+sich+ganz+und+gar+darauf+verlassen.+%CE%A0%CE%B9%CF%83%CF%84%CE%B9%CF%82+and+%CF%80%CE%B9%CF%83%CF%84%CE%B5%CF%85%CE%B5%CE%B9%CE%BD+the+former+of+which+means+belief%2C+and+the+latter+to+believe%2C+are+from+%CF%80%CE%B5%CF%80%CE%B5%CE%B9%CF%83%CE%BC%CE%B1%CE%B9%2C+which+means+strongly+persuaded%3B+whence+%CF%80%CE%B9%CF%83%CF%84%CE%B5%CF%85%CE%B5%CE%B9%CE%BD%2C+even+among+profane+writers%2C+signifies+to+wax+confident%2C+or+to+rest+upon+any+thing%3B+as+we+read+in+Phocilides%2C+%E2%80%9CBelieve+not+the+people%2C+for+the+multitude+is+deceitful.%E2%80%9D+And+in+Demosthenes%2C+%E2%80%9CThou+art+confident+in+thyself%2C+%26c.+Justifying+faith+differs+from+historical%2C+because+it+always+includes+that+which+is+historical.+Historical+faith+is+not+sufficient+for+our+justification.+The+same+thing+may+also+be+said+of+the+other+two+kinds+of+faith.+Justifying+faith%2C+again%2C+differs+from+all+other+kinds+of+faith%2C+in+this%2C+that+it+is+by+it+alone+that+we+obtain+righteousness%2C+and+a+title+to+the+inheritance+of+the+saints.+For+if%2C+as+the+Apostle+says%2C+we+are+justified+by+faith%2C+and+faith+is+imputed+for+righteousness%2C+and+by+faith+is+the+inheritance%2C+then+this+faith+must+be+one+of+the+four+kinds+of+which+we+have+spoken.+But+it+is+not+historical+faith%3B+for+then+the+devils+would+also+be+accounted+just%2C+and+be+heirs+of+the+promise.+Neither+is+it+temporary+faith%3B+for+Christ+rejects+this.+Nor+is+it+the+faith+of+miracles%3B+for+in+that+case%2C+Judas+would+also+be+an+heir.+Hence+it+is+by+justifying+faith+alone+that+we+obtain+righteousness%2C+and+an+inheritance+among+the+saints%3B+which+the+Scriptures+properly+and+simply+call+faith%2C+and+which+is+also+peculiar+to+the+elect.+No+man%2C+however%2C+truly+knows+what+justifying+faith+is%2C+except+he+who+believes%2C+or+possesses+it%3B+as+he%2C+who+never+saw+or+tasted+honey%2C+knows+nothing+of+its+quality+or+taste%2C+although+you+may+tell+him+many+things+of+the+sweetness+of+honey.+But+the+man+who+truly+believes%2C+experience+these+things+in+himself%2C+and+is+able%2C+also%2C+to+explain+them+to+others.+1.+He+believes+that+every+thing+which+the+Scriptures+contain+is+true%2C+and+from+God.+2.+He+feels+himself+constrained+firmly+to+believe+and+embrace+these+things%3B+for+if+we+confess+that+they+are+true+and+from+God%2C+it+is+proper+that+we+should+assent+to+them.+3.+He+sees%2C+embraces%2C+and+applies+particularly%2C+to+himself%2C+the+promise+of+grace%2C+or+the+free+remission+of+sins%2C+righteousness+and+eternal+life%2C+by+and+for+the+sake+of+Christ%2C+as+it+is+said%3A+%E2%80%9CHe+that+believeth+on+the+Son+hath+everlasting+life.%E2%80%9D+%28John+3%3A36.%29+4.+Having+this+confidence%2C+he+trusts+and+rejoices+in+the+present+grace+of+God%2C+and+from+this+he+thus+concludes+in+reference+to+future+good%3A+since+God+now+loves+me%2C+and+grants+unto+me+such+great+blessings%2C+he+will+also+preserve+me+unto+eternal+life%3B+because+he+is+unchangeable%2C+and+his+gifts+are+without+repentance.+5.+Joy+arises+in+the+heart%2C+in+view+of+such+benefits%2C+which+joy+is+accompanied+with+a+peace+of+conscience+that+passes+all+understanding.+6.+Then+he+has+a+will+and+an+earnest+desire+to+obey+all+the+commands+of+God%2C+without+a+single+exception%2C+and+is+willing+to+endure+patiently+whatever+God+may+send+upon+him.+The+man%2C+therefore%2C+who+possesses+a+justifying+faith%2C+does+that+which+is+required+of+him%2C+regardless+of+the+opposition+of+the+world%2C+and+the+devil.+He+who+truly+believes%2C+experiences+all+these+things+in+himself%3B+and+he+who+experiences+these+things+in+himself%2C+truly+believes+%E2%80%A6The+effects+of+justifying+faith+are%2C+1.+Our+justification+before+God.+2.+Joy+and+delight+in+God%2C+with+peace+of+conscience.+%E2%80%9CBeing+justified+by+faith%2C+we+have+peace+with+God.%E2%80%9D+%28Rom.+5%3A1.%29+3.+Conversion%2C+regeneration%2C+and+universal+obedience.+%E2%80%9CPurifying+their+hearts+by+faith.%E2%80%9D+%28Acts+15%3A9.%29+4.+The+consequences+which+belong+to+the+effects+of+faith%2C+such+as+an+increase+of+temporal+and+spiritual+gifts%2C+and+the+reception+of+these+gifts+by+faith.+The+first+effect%2C+therefore%2C+of+justifying+faith%2C+is+our+justification.+After+this+has+once+taken+place%2C+all+the+other+benefits+which+follow+faith+are+made+over+unto+us%2C+which+benefits%2C+we+believe%2C+are+given+unto+us+by+faith%2C+inasmuch+as+faith+is+the+cause+of+them.+For+that+which+is+the+cause+of+a+cause%2C+is+also+the+cause+of+the+effect.+If+faith+be%2C+therefore%2C+the+last+cause+of+our+justification%2C+it+is+likewise+the+cause+of+those+things+which+follow+our+justification.+%E2%80%9CThy+faith+hath+made+thee+whole.%E2%80%9D+%28Luke+8%3A48.%29+In+a+word%2C+the+effects+of+faith+are+justification%2C+and+regeneration+which+is+begun+in+this+life%2C+and+will+be+perfected+in+the+life+to+come.+%28Rom.+3%3A28%3B+10%3A10.+Acts+13%3A39.%29+%E2%80%A6The+forgiveness+of+sins+is+granted+and+received+by+faith+alone%2C+which+the+Holy+Spirit+works+and+kindles+in+us.+It+may+be+said+then%2C+that+the+forgiveness+of+sins+is+granted+at+the+time+when+it+is+received+by+faith.+God+has%2C+indeed%2C+determined+from+everlasting+to+pardon+the+sins+of+those+whom+he+has+chosen+in+Christ%2C+for+the+sake+of+his+satisfaction%2C+but+he+pardons+the+p+309+sins+of+every+one%2C+and+of+all+that+believe+in+Christ%2C+at+the+time+when+he+accounts+them+as+righteous%2C+and+works+in+their+hearts+by+the+Holy+Spirit+a+sense+of+this+pardon%2C+so+that+they+may+forever+remain+certain+regard+to+it.+The+decree+of+God%2C+therefore%2C+concerning+the+forgiveness+of+sins+is+everlasting%2C+but+the+execution+of+it+takes+place+at+the+time+when+we+apply+to+ourselves+by+faith+the+forgiveness+which+the+gospel+offers+unto+us.+It+is+in+the+same+way+that+God+always+loves+his+people%2C+but+he+does+not+shed+abroad+this+love+in+their+hearts+before+their+repentance.+But+those+who+do+truly+repent+obtain+at+length+the+testimony+of+their+conscience%2C+by+the+Holy+Spirit+which+is+given+unto+them%2C+that+they+are+beloved+of+God%2C+and+so+enjoy+the+forgiveness+of+sins.+%E2%80%A6It+is+commonly+said%2C+that+we+are+justified+by+faith+correlatively%2C+by+which+it+is+meant+that+we+are+justified+by+that+which+faith+has+respect+to%2C+which+is+the+merit+of+Christ%3B+or+by+that+which+it+apprehends%3A+for+faith+and+the+satisfaction+of+Christ+have+a+mutual+relation+to+each+other%3B+the+one+is+that+which+receives%2C+and+the+other+is+that+which+is+received.+This+form+of+speech+is+correctly+used%2C+because+when+we+thus+speak%2C+faith+is+understood+to+mean+the+formal+cause+of+our+justification%2C+and+the+sense+is%2C+that+the+merit+of+Christ+justifies+us%2C+and+not+faith%3B+or+that+we+are+justified+by+that+which+is+apprehended%2C+and+not+by+the+instrument+which+apprehends.+But+justification+may+also+be+correctly+attributed+to+faith%2C+as+the+instrumental+cause%2C+without+any+such+relation%2C+for+we+may+correctly+say+that+we+are+justified+by+faith%2C+meaning+by+it%2C+that+we+are+justified+by+it+as+a+means%3A+for+the+effect+of+an+efficient+cause+is+ordinarily+attributed+to+the+instrument.+But+when+it+is+said%2C%E2%80%9D+faith+is+counted+for+righteousness%2C%E2%80%9D+%28Rom.+4%3A5.%29+and+when+expressions+of+a+similar+character+are+used%2C+they+must+necessarily+be+understood+correlatively%2C+in+as+much+as+faith+is+the+instrument+by+which+we+apprehend+the+righteousness+of+Christ%2C+or+it+is+the+hand+with+which+we+receive+the+righteousness+of+Christ.+%E2%80%A6We+are+said+to+be+justified+by+faith+only%3A+1.+Because+we+are+justified+by+the+object+of+faith+alone%2C+that+is+by+the+merits+of+Christ+only%2C+without+which+we+can+have+no+righteousness+whatever%3A+for+we+are+justified+for+Christ%E2%80%99s+sake.+Nothing+but+the+merit+of+Christ+can+be+our+righteousness+in+the+sight+of+God%2C+either+as+a+whole%2C+or+a+part+only.+We+are+justified+only+by+believing%2C+and+receiving+the+righteousness+of+another%2C+and+not+by+our+own+works%2C+or+merit.+All+works+are+excluded+from+our+justification%2C+yea+even+faith+itself+in+as+far+as+it+is+a+virtue%2C+or+work.+2.+Because+the+act+which+belongs+properly+to+faith+is+to+apprehend%2C+and+apply+to+itself+the+righteousness+of+Christ%3B+yea%2C+faith+is+nothing+else+than+the+acceptance+itself%2C+or+the+apprehension+of+the+merits+of+Christ.+3.+Because+faith+alone+is+the+instrument+which+apprehends+the+satisfaction+of+Christ.+Hence+it+is+plain%2C+why+the+exclusive+particle+only+should+be+added%2C+as+it+is+in+the+Catechism%2C+and+be+maintained+against+the+Papist.+It+is+done%2C+1.+For+the+purpose+of+expressing+what+Paul+affirms+when+he+says%3A%E2%80%9D+%E2%80%9CWe+are+justified+freely+by+his+grace%2C+without+the+deeds+of+the+laws%3A%E2%80%9D+And+what+Christ+says%3B%E2%80%9D+%E2%80%9Conly+believe.%E2%80%9D+%28Rom.+4%3A24%2C+28.+Mark.+5%3A36.%29+2.+That+all+our+own+works%2C+and+merits%2C+as+well+as+those+of+others%2C+may+be+excluded+as+being+the+cause+of+our+justification%2C+that+faith+may+be+understood+correlatively.+We+are+justified+by+faith+only%2C+that+is%2C+by+the+merits+of+Christ+alone.+3.+That+not+only+all+our+merits%2C+but+that+even+faith+itself+may+be+excluded+from+that+which+is+received+by+faith%3B+so+that+when+we+say%2C+we+are+justified+by+faith+only%2C+the+sense+is%2C+that+it+is+not+by+meriting%2C+but+only+by+receiving%3B+as+when+it+is+said%2C+This+beggar+is+enriched+only+by+receiving+alms%2C+all+works+and+merits+are+excluded+therefrom%2C+yea%2C+even+the+very+acceptance+of+alms%2C+in+as+far+as+it+is+viewed+as+a+merit.+It+is+for+this+reason%2C+that+Paul+always+says%2C+that+we+are+justified+by+faith%2C+and+through+faith%2C+as+by+an+instrument%3B+and+never+on+account+of+faith%2C+as+the+Papists+will+have+it%2C+who+indeed+admit+both+forms+of+expression%2C+as+if+faith+might+be+the+application+of+Christ%E2%80%99s+righteousness%2C+and+be+also+at+the+same+time+a+certain+work%2C+or+merit%2C+by+which+we+are+counted+worthy+of+being+declared+righteous%2C+which+is+directly+opposed+to+the+very+nature+of+faith.+For+if+we+were+justified+on+account+of+our+faith%2C+then+faith+would+no+longer+be+the+acceptance+of+the+righteousness+of+another%2C+but+it+would+be+the+merit%2C+and+cause+of+our+own+righteousness%3B+neither+would+it+receive+the+satisfaction+of+another%2C+for+it+would+no+longer+stand+in+need+of+it.+4.+That+we+may+understand+the+necessity+of+faith+for+our+justification%2C+and+may+know+that+we+are+justified%2C+not+by+the+merit+of+faith%2C+but+yet+just+as+little+without+faith%2C+to+receive+the+righteousness+of+Christ%3B+because+it+is+the+province+of+faith+to+appropriate+this+to+itself.+5.+The+orthodox+Fathers+often+use+the+same+form+of+speech%2C+by+faith+only.+Origen+writes%3A%E2%80%9D+%E2%80%9CThe+Apostles+say%2C+that+the+justification+of+faith+only+is+sufficient%2C+so+that+if+any+one+only+believes%2C+he+may+be+justified%2C+even+though+he+does+not+perform+any+works.%E2%80%9D+Ambrose+says%3A%E2%80%9CThey+are+justified+freely%2C+who%2C+without+working+or+rendering+any+thing+in+turn%2C+are+justified+by+faith+only+as+the+gift+of+God.%E2%80%9D+Again%3B+%E2%80%9CHow+can+the+Jews+suppose+that+they+are+justified+by+the+works+of+the+law%2C+seeing+they+have+the+justification+of+Abraham+set+before+them%2C+who+was+justified%2C+not+by+the+works+of+the+law%2C+but+by+faith+only.+The+law%2C+therefore%2C+is+not+necessary%2C+when+the+sinner+is+justified+before+God+by+faith+only.%E2%80%9CAnd+again.%E2%80%9DGod+has+decreed+that+he+who+believes+in+Christ%2C+should+be+saved+without+works%2C+receiving+the+remission+of+sins+freely+by+faith+only.%E2%80%9D+We+are+therefore+justified+by+faith+only%2C+which+means+that+it+is+by+the+merits+of+Christ+alone%2C+apprehended+by+faith.+This+we+must+firmly+maintain%2C+and+believe%3A+1.+For+the+glory+of+God%2C+that+so+the+sacrifice+of+Christ+may+not+be+impaired.+2.+For+our+comfort%2C+that+we+may+be+assured+that+our+righteousness+does+not+depend+upon+our+works%2C+%28for+if+this+were+the+case+we+should+lose+it+thousands+of+times%2C%29+but+upon+the+sacrifice+and+merit+of+Christ+alone.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+The+Commentary+of+Dr.+Zacharias+Ursinus+on+the+Heidelberg+Catechism%2C+trans.+G.+W.+Williard%2C+%28Cincinnati%2C+OH%3A+Elm+Street+Printing+Company%2C+1888%2C+113%2C+110%E2%80%9311%2C+308%E2%80%9309%2C+331%E2%80%9332.+%5B%E2%80%9CHoly+Ghost%E2%80%9D+revised+to+%E2%80%9CHoly+Spirit%E2%80%9D%5D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4cb3bc836f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4cb3bc836f.html">Permalink</a><a class="src" href="https://heidelblog.net/2022/05/ursinus-true-faith-in-the-act-of-justification-is-not-formed-by-affections-or-love/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>From the imputation of righteousness, a meritorious claim upon life and the reward of life itself equally follow. For just as the sentence of sin’s remission has regard to three things—sin, liability to punishment, and punishment itself—so the sentence of justification has regard to three things—Christ’s righteousness or satisfaction, that merit which belongs to Christ’s righteousness or satisfaction (for his satisfaction is meritorious of eternal life), and life itself.</p></blockquote>

<blockquote><p>36. The instrument of application is faith, not theoretical but practical, nor an act of the mind only but also of the heart, and that not superficial but radical. 37. But this faith is regarded in application neither habitually or qualitatively, but only relatively and organically, whence the benefit of justification is promiscuously ascribed, sometimes to the instrument, sometimes to the object apprehended through the instrument, in an identical sense. 38. The instruments of producing this faith are the Word and sacraments, not by reason of inherent virtue, but by reason of adhering blessing, and that from God’s ordination. Whence both the use of the Word and Sacraments is to be employed, yet to be circumscribed, and neither is to be attributed to the instruments what belongs to Him who acts through instruments, nor is God to be bound to them, but man only, nor is the same latitude to be judged of our duty and of grace. 39. The efficient cause of this faith is God’s Spirit, who through internal calling produces its act, through sanctification its habit, and through this omnimodo-sanctity according to parts, although not according to degrees, both as to the repurgation of faculties corrupted through sin and as to the convenient subordination of them inverted through sin.</p></blockquote>

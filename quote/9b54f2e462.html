<main class="wrap"><figure class="quote" id="q-9b54f2e462" data-kw="">
<blockquote><p>In every comparison there must be some dissimilitude. …‘Proportions are alike, but not the same.’ Christ’s body is not divided in parts as the bread; therefore there is no analogy betwixt Christ crucified and the bread? It follows not, for similitudes disagree in some things. Similitudes are not to be taken from things altogether different: as an ancient writer makes a comparison betwixt the ten plagues of Egypt and the Ten Commandments: so those who make the comparison betwixt the 70 disciples and the 70 palm trees; the 12 fountains and the 12 apostles: here the comparison is far sought. The comparison must agree in the main point, else it is not a comparison;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Synagogue</cite>, … (London, 1623), 3rd bk., ch. 2, ‘Of the Illustration of Doctrine by Comparisons’, p. 281</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fb9b120c8b" data-kw="">
<blockquote><p>XII. But as it is possible, nay, frequently happens, that, in some countries, neither bread nor wine are used, as in America and other parts of the world, where instead of bread they have a food prepared of pulse, or herbs, or of the fruits or even the bark of trees; and instead of wine their drink is made of honey or sugar, or other aromatics, or even the juice of the coco tree: It is justly queried, whether in those countries, they are wholly to abstain from the Lord’s supper, or whether, instead of bread and wine, it may be lawful to use that food in the supper which answers the purposes of bread and wine, and is adapted for strengthening the body and cheering the heart. Indeed, we think that no rash innovations should be made in the use of the sacraments: but then necessity has no law. And it seems very hard, should anyone take upon him to order that the natives and the foreigners in those spacious countries of the world should be deprived of the Lord’s supper, and their Christianity maimed without the sacramental food. Especially as the principal thing in the analogy is retained when that food and drink is made use of, by which the body may be properly nourished and the heart made glad.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, section 12 of ch. 17, ‘Of the Lord’s Supper’ in bk. 4 of The Economy of the Covenants Between God &amp; Man… (NY: George Forman, 1798), vol. 3, p. 425</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-c270919e61" data-kw="">
<blockquote><p>XIV. God has by Nature and Scripture obliged men themselves to choose and determine diverse subordinate expressions, significations, modes, circumstances, or accidents of this universal religion, which are not themselves meet for an universal, and unchangeable, obligation, but local, temporary, and mutable: Some of which every man may choose for himself, some the present pastor must choose, some the associated pastors may choose, and some the magistrate may choose. These must be added to the universal duties, so far is such addition from being sin: I have often named many particulars, as: the translation of the Scripture, which to choose: the version of the psalms in rhythm, or metre, the common use of new made hymns, the dividing the Scripture into chapter and verse; the words of sermons; their method; the particular text to be chosen; what chapters to read; at what hour to begin; how long to preach; in what words to pray, whether the same oft, or changed; whether fore-studied, or not, whether written, or unwritten: whether studied, and written by ourselves, or by others; where the place shall be, where the pulpit, [baptismal] font, table, etc. shall stand; what ornaments they shall have, linen, silk, silver vessels or otherwise? Whether we be bare-headed, or covered at prayer, sacrament, etc. Whether we shall kneel, stand, sit, or be prostrate at prayer, etc. what distinctive garments pastors shall use. By what signs of consent and obligation men vow, and swear, whether by putting the hand under the thigh, lifting it up, subscribing, laying it on the Book [Bible], kissing the Book, etc. what catechisms to use, with many more such. God has commanded men to choose such things as these by the rules of edification, love, peace, concord, order, decency, winning those without, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, [Against] Dr. Owen’s Vindicator… (London: Parkhurst, 1684), section 2, p. 11</span></figcaption>

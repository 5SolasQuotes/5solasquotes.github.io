<main class="wrap"><figure class="quote" id="q-3e2d83e76c" data-kw="">
<blockquote><p>It never was the doctrine of the Reformation, or of the Lutheran and Calvinistic divines, that the imputation of righteousness affected the moral character of those concerned. It is true, whom God justifies he also sanctifies; but justification is not sanctification, and the imputation of righteousness is not the infusion of righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted on X by @5Solas2</cite>, Oct 21, 2024</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2292c0d676" data-kw="">
<blockquote><p>In the confusion of a twofold grace, which Osiander obtrudes upon us, there is a similar absurdity. Because those whom God freely regards as righteous, he in fact renews to the cultivation of righteousness, Osiander confounds that free acceptance with this gift of regeneration, and contends that they are one and the same. But Scriptures while combining both, classes them separately, that it may the better display the manifold grace of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.6</span></figcaption>

</figure><figure class="quote" id="q-e399ae0de2" data-kw="Imputation Forgiveness">
<blockquote><p>Sin, however, though it ceases to reign, ceases not to dwell in them. … We admit that these remains, just as if they had no existence, are not imputed, but we, at the same time, contend that it is owing to the mercy of God that the saints are not charged with the guilt which would otherwise make them sinners before God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.3.11</span></figcaption>

</figure><figure class="quote" id="q-a8c10b0015" data-kw="">
<blockquote><p>By so doing we by no means establish as the formal cause of our justification that essential righteousness of Christ, which is itself His deity, or the supreme purity and holiness of His humanity, or His sufferings absolutely considered, which ceased together with His earthly life. But we say that the merit of His sufferings (παθημάτων) is the material cause of our justification, which is substituted in place of our guilt, inborn corruption, and all our sins that flow forth from that sewer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defense of Justification through the Righteousness of Christ Alone</cite>, reply to the Anonymous Man’s Third Argument</span></figcaption>

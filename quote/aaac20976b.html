<main class="wrap"><figure class="quote" id="q-aaac20976b" data-kw="">
<blockquote><p>The prince shall have a section on one side and the other of the holy district and the city’s property … Then it shall be the prince’s part to give burnt offerings, grain offerings, and drink offerings, at the feasts, the New Moons, the Sabbaths, and at all the appointed seasons of the house of Israel. He shall prepare the sin offering, the grain offering, the burnt offering, and the peace offerings to make atonement for the house of Israel. Ezekiel 45:7, 17.

On the basis of the above prophecy, the Belfast Covenanter periodical deduced that the Christian magistrate was bound to give financial support to the cause of true religion:

That as we have here an account of a prince, of his having an appropriate portion of land assigned him, and of his furnishing burnt-offerings, meat-offerings, and drink-offerings, in the solemnities of public worship, we therein see, that a king, or supreme magistrate, has a special relation to the Church – should not only sanction religion by his authority and example, but honour and support it, when necessary, by his royal munificence.

In considering more minutely the contents of this 17th verse, we observe, that the profession and establishment of religion being taken for granted, as well as the appointment of a supreme magistrate, it is his business and duty to provide for the maintenance of the true religion, if not immediately from his own personal resources, at least by seeing that the subjects contribute according to the benefit enjoyed. […] Nobody complains of being obliged to be honest, or of being restrained from murder, robbery, perjury, or any other crime which would unhinge society; why then should the restraining of daring irreligion and profaneness by the magistrate be accounted oppressive, since the obligations of religion are as clearly revealed as those of morality, and those transgressions of the first table as injurious to society, as those of the second table of the moral law? There is indeed no hardship imposed, in requiring a profession of the Christian religion, and as little in requiring its professors to support it, since both are duties which mankind have no right to evade; nor can they neglect them without openly rebelling against the God who made them. The Christian magistrate, ruling over his subjects with paternal care, […] it is nevertheless his duty to see that pure Christianity be publicly professed by his subjects, and that a liberal support be administered to them that serve at the altar. His suppressing all immorality, idolatry, gross error, and false religion, is perhaps the best establishment he can give to the true; for as it is already sanctioned and established by a higher authority than that of man, it only requires the approbation, protection, and support of the civil power, in that nation or kingdom into which it has been introduced.

We may further notice here, that as the prince should take care that the ministers of religion have a sufficient maintenance, so he ought to see, that the service of God be faithfully performed by them; and where negligence or dereliction of duty is detected, should enforce amendment, since the clergy are as strictly obliged to attend to their duties, as the laity are to furnish the means of their subsistence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Dec. 1831, pp 7-8</span></figcaption>

<blockquote><p>Therefore, in order that none of us may stumble on that stone, let us first consider that there is a twofold government in man (duplex esse in homine regimen): one aspect is spiritual, whereby the conscience is instructed in piety and in reverencing God; the second is political, whereby man is educated for the duties of humanity and citizenship that must be maintained among men. These are usually called the “spiritual” and the “temporal” jurisdiction (not improper terms) by which is meant that the former sort of government pertains to the life of the soul, while the latter has to do with the concerns of the present life—not only with food and clothing but with laying down laws whereby a man may live his life among other men holily, honorably, and temperately. For the former resides in the inner mind, while the latter regulates only outward behavior. The one we may call the spiritual kingdom, the other, the political kingdom. Now these two, as we have divided them, must always be examined separately; and while one is being considered, we must call away and turn aside the mind from thinking about the other. There are in man, so to speak, two worlds, over which different kings and different laws have authority.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (1559 edition), 3.19.15 (Battles edition).</span></figcaption>

<blockquote><p>To what extent has Christ abrogated the Law, and to what extent is it still in force? The ordinary and correct answer to this question is, that the ceremonial and judicial law, as given by Moses, has been abrogated in as far as it relates to obedience; and that the moral law has also been abrogated as it respects the curse, but not as it respects obedience. That the ceremonial and judicial laws have been so abrogated by the coming of Christ, that they no longer bind any to obedience, and that they have not the appearance and force of laws in respect to the present time, is proven, 1. From the fact that the prophets even declared and foretold this abrogation in the Old Testament. “Christ shall confirm the covenant with many for one week, and in the midst of the week he shall cause the sacrifice and the oblation to cease.” “Thou art a priest forever after the order of Melchisedek. (Dan. 9:27. Ps. 110:4.)

2. Christ and his Apostles, in different places in the New Testament, expressly assert this abrogation. (See Acts 7:8. Heb. 7:11–18; 8:8–13.) Instead of adducing a number of testimonies in confirmation of this point, we shall merely cite the decree passed by the Apostles when assembled in Jerusalem: “For it seemed good to the Holy Ghost and to us to lay upon you no greater burden, than these necessary things,” etc. (Acts 15:28, 29.)

3. When certain causes are once changed, the laws which are based upon these causes are also changed. One cause now of the ceremonial and judicial law was that the form of worship and civil polity which existed among the Jews, from whom the Messiah was to be born, might distinguish them from all other nations until the Messiah would come. Another cause was that they might be types of the Messiah and of his benefits. These causes now since the coming of the Messiah, have been done away with: for the Apostle declares that the middle wall of partition between the Jews and other nations has been broken down: “He is our Peace, who hath made both one, and hath broken down the middle wall of partition between us,” “For in Christ Jesus, neither circumcision availeth any thing, nor uncircumcision, but a new creature. (Eph. 2:14. Gal. 6:15.) It is also every where taught in the New Testament Scriptures that the rites and ceremonies of the old dispensation have been fulfilled in Christ. “The Holy Spirit, this signifying that the way into the holiest of all was not yet made manifest, while the first tabernacle was yet standing.” “The law and the prophets were until John.” “Let no man judge you in meat or in drink,” etc. (Heb. 9:8. Luke 10:16. Col. 2:16.) … Objection 3: The best and most wholesome form of government is always to be retained. The form of government established among the Jews was the best and most wholesome, for the reason that it was instituted by God. Therefore it is to be retained. Answer: There is here a fallacy in taking that to be absolutely true, which is true only in a certain respect. The form of government established among the Jews was the best, not absolutely, but only for that time, that country and nation: for there were many things in it adapted to the state and condition of that nation, country, time, and ceremonial worship, the observance of which would now neither be proper nor profitable, because the causes on account of which those laws were given to the Jews are now changed or removed; as giving a writing or bill of divorcement, marrying the widow of one’s kindred, etc. God did not, for this reason, institute this form of government that all nations and ages might be bound by it; but only that his own people might, by this discipline, be separated for a time from the surrounding nations. If any one should object and say, that if Christians are permitted to observe and conform to the laws of other nations, such as the Greeks or Romans, etc., much more ought we to observe those which were given by Moses, the servant of God; we readily grant the argument, if this observance is rendered without attaching to it the idea of necessity; or if these laws are observed, not because Moses commanded and enjoined them upon the Jewish nation, but because there are good reasons why we should now comply with them; and if these reasons should be changed, to retain the liberty of changing these enactments by public authority.</p></blockquote>

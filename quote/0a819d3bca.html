<main class="wrap"><figure class="quote" id="q-0a819d3bca" data-kw="">
<blockquote><p>A simple survey of the world should of itself suffice to attest a Divine Providence. The heavens revolve daily, and, immense as is their fabric, and inconceivable the rapidity of their revolutions, we experience no concussion — no disturbance in the harmony of their motion. The sun, though varying its course every diurnal revolution, returns annually to the same point. The planets, in all their wanderings, maintain their respective positions. How could the earth hang suspended in the air were it not upheld by God’s hand? By what means could it maintain itself unmoved, while the heavens above are in constant rapid motion, did not its Divine Maker fix and establish it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Ps.</cite>, 93:1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-62d6ab6209" data-kw="">
<blockquote><p>With the same characteristic reticence Calvin skirts the issue of the exact nature of the days of creation in the 1559 edition of his Institutes… Perkins’ paraphrasing of ‘six distinct days’ with ‘six distinct spaces of time’ appears to be an acknowledgment that the nature of at least the first three days [before the sun was made] may not be clear… it will not do to claim for the six 24-hour day view those who merely refer to the six days of creation. This is to beg the very question of the nature of the six days spoken of in Genesis 1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-s-barker.html">William S. Barker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 13, ‘The Westminster Assembly on the Days of Creation: a Reply to David W. Hall’ in Word to the World (Ross-shire, UK: Christian Focus Publications, 2005), pp. 259-70</cite>, pp. 263, 265-66</span></figcaption>

<blockquote><p>Thus also a celebration of the finishing of the creation within the space of seven days, which is termed the Sabbath, was observed not only amongst the Grecians and Italians (for of the Hebrews it is clear enough) but also by… and by the most ancient appellations of the days in the week. …and that the lives of those which lived at the beginning, and afterward were protracted almost to the space of a thousand years, it [is] witnessed by Berosus, Manethos, and others…</p></blockquote>

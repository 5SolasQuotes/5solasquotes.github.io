<main class="wrap"><figure class="quote" id="q-ee1a3d3007" data-kw="">
<blockquote><p>A second rule is, that as the matter in which we are zealous, must be good in it self, so it must be known unto us to be of that quality. True zeal must begin where the word begins, and end where it ends: for otherwise it cannot be of faith, which is ever grounded on the word; and whatsoever is not of faith is sin. We must not therefore content our selves with an honest meaning, and hope that we have a good zeal towards God, when we have no warrant for our hope: but must so acquaint our selves with the Scriptures of God, that our zeal may be according to knowledge.

Which rule discovereth the corruptness of their zeal, whether close hypocrites, or weak Christians, who are led on merely by the examples of good men, whom they affect, much to like of, and earnestly to stand for such things, as they perceive them in their practise to observe, and to make conscience of: and if there be but a word spoken against any of the things that they have taken a liking of, they are marvellously stirred with indignation thereat, and grow passionate and vehement against the parties, though they have never so good a meaning in that which they speak:

Yet let them be urged to prove out of the word the necessity of those duties which they so earnestly press, they can say little or nothing to the purpose for them; and so grow many times either to dislike and forsake all if they be hypocrites, or at least to be discouraged, and to be at a stand, if they be weaklings in Christ Jesus. And whence proceed these inconveniences but from this, that they are zealous for things that in themselves, and unto others are good and holy, but not thoroughly discerned of them to be of that nature: the consideration whereof, should make us to sit sure in matters of godliness, not building upon the example of good men, but upon the truth of the good word of God, and then our foundation shall never fail us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-cleaver.html">Robert Cleaver</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Tract Concerning Zeal, wherein the properties of true Zeal are described, and the contrary discovered</cite>, in John Dod, Four godly and fruitful sermons two preached at Drayton in Oxford-shire, at a fast, enjoined by authority, by occasion of the pestilence then dangerously dispersed. Likewise two other sermons on the twelfth Psalm. Whereunto is annexed a brief tract of zeal (London: William Welbie, 1611), pp 86-87.</span></figcaption>

<blockquote><p>Whiggism is not circumscribed and confined to any one or two of the Religions now professed in the World, but diffuses it self among all. We have known Jews, Turks, nay, some Papists, (which I own to be a great Rarity) very great Lovers of the Constitution and Liberty; and were there rational Grounds to expect, that any Numbers of them could be so, I should be against using Severities and Distinctions upon Account of Religion.

For a Papist is not dangerous, nor ought to be ill used by any body, because he prays to Saints, believes Purgatory, or the real Presence in the Eucharist, and pays Divine Worship to an Image or Picture (which are the common Topics of our Writers of Controversy against the Papists;) but because Popery sets up a foreign Jurisdiction paramount to our Laws.

So that a real Papist can neither be a true Governor of a Protestant Country, nor a true Subject, and besides, is the most Priest-Ridden Creature in the World: and (when uppermost) can bear with no body that differs from him in Opinion; little considering, that whosoever is against Liberty of Mind, is, in effect, against Liberty of Body too.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-molesworth.html">Robert Molesworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Translator s Preface’ in François Hotman, Franco-Gallia: Or An Account of the Ancient Free State of France, and most other parts of Europe, before the loss of their Liberties</cite></span></figcaption>

n-the-political-danger-of-papists-to-a-protestant-nation/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-2ed7420708" data-kw="">
<blockquote><p>We should not imagine, that all that which is called Zeal for Religion, and a design to convert Heretics, should necessarily flow from a good Principle. On the contrary, God, for the Trial of the Faith of his Elect, hath almost always permitted, that false Religions have had more Zeal for the destruction of the True, than the True Religion for the ruin of the Falser. When Christian Religion became predominant, She did not do that for the ruin of Paganism, which had been done against her during the Reign of Pagan Emperors.

It’s true, that true Zeal is always accompanied with Moderation, and false Zeal with Violence. So that in the Eyes of Flesh, the true faithful Ones do appear Luke-warm; and the Enemies of Truth do pass for true Zealots. When Human Passions do mingle themselves in those Sentiments of Hearts called Religion, there is no Excess that they are not capable of. In respect of other Objects, in the midst of their greatest Transports they do reproach themselves secretly, which stops their fury, and steal away some part of their Impetuousness; and chiefly when they are allayed, and consider in cold blood their Conduct past, they do often accuse their own selves. But contrarily here, Passions do solicit and animate themselves, they make Merit of their Violence, and believe that God and his Church are concerned in their Justification; because they imagine, that they have laboured for the Truth. This is one of the Reasons why often Men believe, that they see but little Zeal in the true Church, while there is so much Fire in the Conduct of Them, that endeavour her Ruin.

But we must needs grant, that there is something more. The Moderation of the Faithful doth not alway proceed from that Sweet Spirit, which is the very Genius of the Gospel: It comes often from the coldness of their Zeal; God permits it to oblige us to adore in Silence the Mysteries of his Conduct, and to confound at the same time the Pride of Man’s heart. We have much less Love for the Truth, than the World and the Devil have of Hatred against it. And whilst we act in the Establishment of Religion by a Principle, of Self-love, we have quite another kind of Ardour than when we have no other prospect than that of the Glory of God.

The Church doth easily relent; the fervour of the Zeal, which seeks the Conversion of Others, doth not last long. It is so hard a thing to seek for Salvation, that Men imagine they do enough to labour for their own, without charging themselves with the Care of Others. And we easily fall into those unhappy Thoughts, That God is good enough to do his own Business; that he will have a care of his own Interest, and that he will not want Means to Convert them whom he hath destined to eternal Salvation. Whereas false Zeal doth hold it self up, doth persevere, and finds it self often more capable to endure greater Labours, than the true Devotion.

It is a thing that confounds us: I grant it’s one of the great Temptations which good Souls are to overcome. But truly, it’s a Thing whereof it’s impossible to deny the Truth, if we have any thing of good Faith or Probity. Our Lord Jesus Christ himself doth teach us, that the Pharisees and the false Doctors of Judaism did compass Sea and Land to make a Proselyte; and all their labours did conclude to render Him a Son of Hell, likes themselves. All those things do make me conclude, That the Zeal to make Conversions, is not always a certain Sign that the Truth is in that Party.

It is a favourable Prejudice; but after all it’s but a Prejudice, and we should not suffer our selves to be conducted by those kinds of Lights, which are often deceitful. We must be permitted to examine, If the Zeal of Religion, which causes so many Emotions, be a Divine fire, or a Passion merely Human. Now we cannot better know the Nature of that Zeal which seeks for Conversions, than by the Means which it employs: for it’s an indubitable Principle, That true Piety never doth any ill, that good may come thereof. She seeks the Salvation of Men; but she seeks it by ways that are just, lawful, and rational.</p></blockquote>

f+Them%2C+that+endeavour+her+Ruin.%0A%0ABut+we+must+needs+grant%2C+that+there+is+something+more.+The+Moderation+of+the+Faithful+doth+not+alway+proceed+from+that+Sweet+Spirit%2C+which+is+the+very+Genius+of+the+Gospel%3A+It+comes+often+from+the+coldness+of+their+Zeal%3B+God+permits+it+to+oblige+us+to+adore+in+Silence+the+Mysteries+of+his+Conduct%2C+and+to+confound+at+the+same+time+the+Pride+of+Man%E2%80%99s+heart.+We+have+much+less+Love+for+the+Truth%2C+than+the+World+and+the+Devil+have+of+Hatred+against+it.+And+whilst+we+act+in+the+Establishment+of+Religion+by+a+Principle%2C+of+Self-love%2C+we+have+quite+another+kind+of+Ardour+than+when+we+have+no+other+prospect+than+that+of+the+Glory+of+God.%0A%0AThe+Church+doth+easily+relent%3B+the+fervour+of+the+Zeal%2C+which+seeks+the+Conversion+of+Others%2C+doth+not+last+long.+It+is+so+hard+a+thing+to+seek+for+Salvation%2C+that+Men+imagine+they+do+enough+to+labour+for+their+own%2C+without+charging+themselves+with+the+Care+of+Others.+And+we+easily+fall+into+those+unhappy+Thoughts%2C+That+God+is+good+enough+to+do+his+own+Business%3B+that+he+will+have+a+care+of+his+own+Interest%2C+and+that+he+will+not+want+Means+to+Convert+them+whom+he+hath+destined+to+eternal+Salvation.+Whereas+false+Zeal+doth+hold+it+self+up%2C+doth+persevere%2C+and+finds+it+self+often+more+capable+to+endure+greater+Labours%2C+than+the+true+Devotion.%0A%0AIt+is+a+thing+that+confounds+us%3A+I+grant+it%E2%80%99s+one+of+the+great+Temptations+which+good+Souls+are+to+overcome.+But+truly%2C+it%E2%80%99s+a+Thing+whereof+it%E2%80%99s+impossible+to+deny+the+Truth%2C+if+we+have+any+thing+of+good+Faith+or+Probity.+Our+Lord+Jesus+Christ+himself+doth+teach+us%2C+that+the+Pharisees+and+the+false+Doctors+of+Judaism+did+compass+Sea+and+Land+to+make+a+Proselyte%3B+and+all+their+labours+did+conclude+to+render+Him+a+Son+of+Hell%2C+likes+themselves.+All+those+things+do+make+me+conclude%2C+That+the+Zeal+to+make+Conversions%2C+is+not+always+a+certain+Sign+that+the+Truth+is+in+that+Party.%0A%0AIt+is+a+favourable+Prejudice%3B+but+after+all+it%E2%80%99s+but+a+Prejudice%2C+and+we+should+not+suffer+our+selves+to+be+conducted+by+those+kinds+of+Lights%2C+which+are+often+deceitful.+We+must+be+permitted+to+examine%2C+If+the+Zeal+of+Religion%2C+which+causes+so+many+Emotions%2C+be+a+Divine+fire%2C+or+a+Passion+merely+Human.+Now+we+cannot+better+know+the+Nature+of+that+Zeal+which+seeks+for+Conversions%2C+than+by+the+Means+which+it+employs%3A+for+it%E2%80%99s+an+indubitable+Principle%2C+That+true+Piety+never+doth+any+ill%2C+that+good+may+come+thereof.+She+seeks+the+Salvation+of+Men%3B+but+she+seeks+it+by+ways+that+are+just%2C+lawful%2C+and+rational.%E2%80%9D%0A%0A%E2%80%94+Pierre+Jurieu%2C+A+preservative+against+the+change+of+religion%2C+or%2C+A+just+and+true+idea+of+the+Roman+Catholic+religion%2C+opposed+to+the+flattering+portraitures+made+thereof%2C+and+particularly+to+that+of+my+Lord+of+Condom%2C+trans.+Claudius+Gilbert+%28London%3A+Thomas+Cockerill%2C+1683%29%2C+pp+3-5.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2ed7420708.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2ed7420708.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2024/04/04/pierre-jurieu-on-good-and-bad-zeal-in-religion/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-c6125460a2" data-kw="">
<blockquote><p>What is the duty of Christian men at such at time? What is the duty, in particular, of Christian officers in the Church? In the first place, they should encourage those who are engaging in the intellectual and spiritual struggle. They should not say, in the sense in which some laymen say it, that more time should be devoted to the propagation of Christianity, and less to the defence of Christianity. Certainly there should be propagation of Christianity. Believers should certainly not content themselves with warding off attacks, but should also unfold in an orderly and positive way the full riches of the gospel. But far more is usually meant by those who call for less defence and more propagation. What they really intend is the discouragement of the whole intellectual defence of the faith. And their words come as a blow in the face of those who are fighting the great battle. As a matter of fact, not less time, but more time, should be devoted to the defence of the gospel. Indeed, truth cannot be stated clearly at all without being set over against error. Thus a large part of the New Testament is polemic; the enunciation of evangelical truth was occasioned by the errors which had arisen in the churches. So it will always be, on account of the fundamental laws of the human mind. Moreover, the present crisis must be taken into account. There may have been a day when there could be propagation of Christianity without defence. But such a day at any rate is past. At the present time, when the opponents of the gospel are almost in control of our churches, the slightest avoidance of the defence of the gospel is just sheer unfaithfulness to the Lord. There have been previous great crises in the history of the Church, crises almost comparable to this. One appeared in the second century, when the very life of Christendom was threatened by the Gnostics. Another came in the Middle Ages when the gospel of God’s grace seemed forgotten. In such times of crisis, God has always saved the Church. But He has always saved it not by theological pacifists, but by sturdy contenders for the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christianity and Liberalism</cite>, (New York: Macmillan, 1923), p. 147</span></figcaption>

</figure><figure class="quote" id="q-a8b6033d9a" data-kw="">
<blockquote><p>Alas, we deceive ourselves with the noise of a covenant, and a cause of God; we cry it up as an antidote against all evils, use it as a charm, even as the Jews did their temple; and, in the mean time, we do not care how we walk before God, or with our neighbours: well, thus saith the Lord, “trust ye not in lying words,” &amp;c. Jer. vii. 4, 5, 6. If drunkenness reign among you, if filthiness, swearing, oppression, cruelty reign among you, your covenant is but a lie, all your professions are but lying words, and shall never keep you in your inheritance and dwellings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heart-Humiliation: or, Miscellany Sermons, Preached upon some choice texts, at several solemn occasions</cite>, (1676) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 3: 33.</span></figcaption>

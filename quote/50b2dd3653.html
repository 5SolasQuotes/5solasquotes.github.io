<main class="wrap"><figure class="quote" id="q-50b2dd3653" data-kw="">
<blockquote><p>[E]very man by nature is, by reason of Adam’s covenant breach, under a twofold debt. 1. on account of Adam’s sin, which is imputed to him, he lies under an obligation eternally to undergo God’s wrath and curse; so that he has lost communion with God and is bound down completely to the pitiable state of this life, to death itself, and the pains of hell throughout eternity (Rom. 5:12).

2. as a consequence of Adam’s guilt, which is imputed unto all who by means of ordinary generation come forth of him, there is an inherent guilt, which consists in the lack of that original righteousness, with which man was created after God’s image, in knowledge, righteousness and true holiness: all men lack this since the fall, God dealing as a righteous Judge, so that the nature of each is depraved, the understanding darkened, the will at enmity with God, all the desires and passions unbridled: and, to express it in a word, man is dead in trespasses and sins, and to every good work reprobate and quite incapable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-comrie.html">Alexander Comrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The ABC of Faith</cite>, trans. J. Marcus Banfield (1746; Ossett: Zoar Publications, 1978), pp 68-69.</span></figcaption>

</figure><figure class="quote" id="q-5e9a744e0c" data-kw="">
<blockquote><p>But still the images of such things live in my memory, of which I have spoken much, which my habitual way of life has deeply imprinted there, and they occur to me awake, although lacking strength, but in sleep not only to the point of pleasure, but even to the point of consent and an act very like the reality. And such is the force of illusion in my soul and in my flesh, that false visions persuade my sleeping mind of things which true visions cannot persuade my waking mind. Cannot your hand, O All-Powerful God, heal all the languors of my soul and by a more abundant grace extinguish even the lascivious motions of my sleep? You will increase in me more and more, O Lord, your gifts, that my soul may not be rebellious to itself and that not only in sleep it may not perpetrate those turpitudes of corruptions through animal imaginations even to the flow of the flesh, but may not even consent to them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Practical Theological Disputation on Sin, pt. 2’</cite>, tr. Onku with AI (Leiden: Johann Elsevir, 1660), sect. 15-20 Latin | XVII. And so even during dreams we sometimes sin, being conscious of which, pious people more diligently commend themselves to God before sleep, lest they be defiled by any foul or evil thought, and they specially confess to God and grieve over sins committed during sleep. Augustine did this in his Confessions, Book 10, Chapter 30:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

<blockquote><p>Why then do we die for another’s sin? Why is the sin of Adam imputed to us?… What? that the punishment is greater than the sin? For when we sinned in Adam only, in potentia, ‘in power’ and possibility, yet we are punished in actu, ‘in act’: And that seems most cruel, that Adam, which sinned in act is saved [by the promise of the Redeemer, it is held], and for the same sin many are damned, who sinned in Adam only in power and possibility. I answer: [1.] The place in Ezekiel must be taken thus: The innocent son shall not bear the punishment of his father’s sin: So when God says in the Law, that He will visit the iniquity of fathers upon the children, He speaks of children which walk in their father’s steps, and are partakers of the same fault: But the sons of Adam cannot be said to be innocent, as they which not only sinned in Adam, as in the stock and root of mankind, but also themselves are born stained with the same depravation, and prone to the same sin. Secondly, I say that that place in Ezekiel makes nothing to the present matter: for he speaks of the sins of the fathers, whose sins are personal, and who in sinning do not sustain the persons of their children. … Adam receiued gifts, which as he had for himself, so he should have conveyed them to his posterity, which seeing he lost, it justly comes to pass that his posterity should be deprived of those gifts. But my grandfather or great-grandfather received no supernatural gifts from God, which by an hereditary right they should derive to their posterity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism</cite>, … (1619; London, 1620), ch. 9, pp. 59-61</span></figcaption>

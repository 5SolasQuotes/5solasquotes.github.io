<blockquote><p>Hence in the first justification of believing sinners, all future sins are remitted as unto any actual obligation unto the curse of the Law, unless they should fall into such sins as should ipso facto, forfeit their justified estate, and transfer them from the Covenant of Grace, into the Covenant of Works, which we believe that God in his Faithfulness will preserve them from. And although sin cannot be actually pardoned before it be actually committed, yet may the obligation unto the curse of the Law be virtually taken away from such sins in justified persons as are consistent with a justified estate, or the terms of the Covenant of Grace, antecedently unto their actual commission. God at once in this sense forgives all their iniquities, and heals all their diseases, redeems their life from destruction, and crowns them with loving kindness and mercies, Ps. 103:2-3. Future sins are not so pardoned as that when they are committed they should be no sins, which cannot be, unless the commanding power of the Law be abrogated. But their respect unto the curse of the Law, or their power to oblige the justified person thereunto is taken away. Still there abides the true nature of sin in every inconformity unto, or transgression of the Law in justified persons, which stands in need of daily actual pardon. For there is no man that lives and sins not, and if we say that we have no sin, we do but deceive our selves. None are more sensible of the guilt of sin, none are more troubled for it, none are more earnest in supplications for the pardon of it, than justified persons. For this is the effect of the sacrifice of Christ applied unto the souls of believers, as the apostle declares, Heb. 10:1-4, 10, 14, that it does take away conscience condemning the sinner for sin with respect unto the curse of the Law; but it does not take away conscience condemning sin in the sinner, which on all considerations of God and themselves, of the Law and the gospel, requires repentance on the part of the sinner, and actual pardon on the part of God. … …Now the first act of God in the imputation of righteousness cannot be repeated. And the actual pardon of sin after justification is an effect and consequent of that imputation of righteousness. If any man sin, there is a propitiation… Wherefore unto this actual pardon there is nothing required but the application of that righteousness which is the cause of it, and this is done by faith only. … What it is that, when a justified person is guilty of sin (as guilty he is more or less every day) and his conscience is pressed with a sense thereof, as that only thing which can endanger or intercept his justified estate, his favor with God, and title unto glory, he betakes himself unto, or ought so to do, for the continuance of his state, and pardon of his sins, what he pleads unto that purpose, and what is available thereunto…. And is it not of faith alone, which is that grace whereby they apply themselves unto the mercy or grace of God through the mediation of Christ? It is true that faith herein, works and acts itself in and by godly sorrow, repentance, humiliation, self-judging, and abhorrency, fervency in prayer and supplications with an humble waiting for an answer of peace from God, with engagements unto renewed obedience. But it is faith alone that makes applications unto grace in the blood of Christ for the continuation of our justified estate… The Scripture expressly does declare this to be the only way of the continuation of our justification, 1 Jn. 2:1-2, ‘These things write I unto you that you sin not. And if any man sin we have an advocate with the Father, Jesus Christ the Righteous; and he is the propitiation for our sins.’ It is required of those that are justified that they sin not; it is their duty not to sin; but yet it is not so required of them as that if in anything they fail of their duty they should immediately lose the privilege of their justification. Wherefore on a supposition of sin, if any man sin, (as there is no man that lives and sins not) what way is prescribed for such persons to take, what are they to apply themselves unto, that their sin may be pardoned, and their acceptance with God continued; that is, for the continuation of their justification? The course in this case directed unto by the apostle is none other but the application of our souls by faith unto the Lord Christ, as our advocate with the Father, on the account of the propitiation that He has made for our sins. Under the consideration of this double act of his sacerdotal office, his oblation and intercession, He is the object of our faith in our absolute justification, and so He is as unto the continuation of it. So our whole progress in our justified estate in all the degrees of it is ascribed unto faith alone.</p></blockquote>

<blockquote><p>…once vile sinners, now washed, sanctified and justified: as soon as they believe, they are put into a state of acceptation [Greek], that is, justifying, He continues to justify them unto the death, and He keeps them in that estate wherein they have exemption from the punishment of sin and a right to eternal life… All these things concur to our justification and do not contradict, but imply one another: The first moving cause of all is grace; the meritorious cause, is Christ’s blood: the means of applying, or the condition on our part upon which we are capable at first of receiving so great a privilege, is faith: and the means of continuing in our justified estate, is by good works, or new obedience. I say, our first actual pardon, justification, and right to life, is given upon condition of our first faith and repentance; but this estate is continued to us both by faith, Rom. 1:17 and new obedience; these fairly accord. The grace of God will do nothing without the intervention of Christ’s merits; and Christ’s merits do not profit us ’till it be applied by faith; and sound believers will live in a course of new obedience.</p></blockquote>

0of%20new%20obedience." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-82485833f0" data-kw="">
<blockquote><p>We do not deny (as the Papists falsely slander us) all inherent righteousness, 2 Cor. 5:17, nor all justification before God by inherent righteousness, 1 Kn. 8:32 [“Then hear thou in heaven, and do, and judge thy servants, condemning the wicked, to bring his way upon his head; and justifying the righteous, to give him according to his righteousness.”]. But this we teach, that this inherent righteousness is not that righteousness whereby any poor sinner in this life can be justified before God’s Tribunal, for which he is pronounced to be innocent, absolved from death and condemnation, and adjudged unto eternal life. … Whether inherent justice be actual or habitual? Bishop Davenant, ch. 3, Of Habitual Righteousness, says a certain habitual or inherent justice is infused into all that are justified, Jn. 1:13; 2 Cor. 5:17; Gal. 6:15; 1 Cor. 6:11, 19; 2 Pet. 1:4. All those that are justified do supernatural works; Therefore, it is certain that they are endued with supernatural grace and holiness. We are said to be righteous, from this inherent justice we are said to be just, and that by God Himself, Gen. 6:9; Heb. 11:4; Lk. 1:61 &amp; 2:25; 1 Pet. 4:18.</p></blockquote>

<blockquote><p>So in treating of our restoration, Paul intimates in close connection issuing from our very justification before God–provided conviction of it is ours–the immediate presence in believers of the Spirit, the fashioner of all the righteousness we are to display in our lives. Hence he never uses the word ‘justify’ in this way without appearing to speak no less of this imparting of true righteousness than of the round and head of our entire salvation, the forgiveness of sins. In chapter 3 (verse 25) [of Romans] after saying that righteousness is revealed in the era of the unveiling of the gospel, that is to say, is so clearly manifested in the lives of believers that the world now acknowledges these alone to be capable of true righteousness, and after saying secondly, that Christ came to introduce to the world an endeixis, a demonstration of divine righteousness unmistakable to all, he then added, ‘that God himself might be righteous, and the justifier of him who has faith in Jesus Christ’. Here without a doubt he includes at the same time in the word ‘justify’ that righteousness which God produces by his Spirit in those who believe in Christ, and which he intends to be his attestation to the effect that he has now forgiven their sins and counts them among those he resolved to justify, that is, to count among the righteous not only by pardoning their sin but also by conforming them to the image of his Son. The apostle always speaks about our justification in this fashion, never failing to comprehend the summit of our salvation, for which he prayed for the Philippians as follows: ‘It is my prayer that your love may abound more and more in knowledge and all aesthesis (that is, a quality of discernment) whereby you may be able to approve with certainty what is excellent, and to this end, that you may be pure and give offence to no one, thus being equipped for the day of Christ, and filled with the fruits of righteousness which are produced through Jesus Christ to the glory and praise of God.’ [1:9-11] Consequently, since Paul is accustomed to speaking in this way, denoting by the word ‘justification’ first of course the remission of sins, yet at the same time always indicating in addition that imparting of righteousness which God proceeds to work in us by the Spirit, the same Spirit by whom he grants us assurance of the pardon of our sins and of his goodwill towards us, and whom he has established the seal (sphragis) of that pardon–because, I say, Paul customarily speaks in these terms, the majority of the holy Fathers, bearing in mind no doubt the more visible aspect of justification, have taken dikaiousthai, ‘to be justified’, in the sense of ‘to be made righteous… It goes without saying that however great a degree of righteousness the Spirit of Christ might effect in us when we believe, it will nonetheless [not?] be sufficient to merit our being regarded as righteous in God’s sight, for we remain unprofitable servants even when we have fulfilled all his bidding. It was with this in mind that Philip Melanchthon in his highly erudite and devout Commentary on this Epistle rightly condemns those who want to make, “We are justified by faith,’ mean, “Faith is the source or cause that produces other virtues for whose sake we are pronounced righteous,’ or ‘Faith itself is in us a virtue, deserving of God’s approval.’ And he subjoins these godly words: ‘“We are justified by faith,” should be transposed in[to] this sentence: “We are reckoned righteous by mercy.” Similarly, “we are justified by faith alone” means, “We are pronounced righteous by trusting in mercy alone”–so it is only for us to add, ‘as we are given the assurance that we are so pronounced, and thus know by experience this merciful favour of God.’ Surely no godly soul can doubt for a moment that it is through God’s mercy alone and for the sake of Christ’s merit alone that we are justified, pronounced righteous before God, and not because of anything in us at all, however many works of holiness, however genuine our fruits of the Spirit. For who is ignorant of the Scripture, ‘Enter not into judgment with thy servant, for no man living will be justified before thee’? [Ps. 143:2] And in Isaiah, ‘In the Lord shall all the seed of Israel be justified and praised’. [Isa. 45:25]</p></blockquote>

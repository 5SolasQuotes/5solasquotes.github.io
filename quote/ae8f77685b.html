<main class="wrap"><figure class="quote" id="q-ae8f77685b" data-kw="">
<blockquote><p>We loudly maintain that the sacrifice of the Mass is nothing else than an impious profanation of the Lord’s Supper. This we make plain by the clear words of our Lord. For in instituting the sacred Supper, he does not enjoin us to sacrifice, but invites us to partake of the sacrifice which he himself once offered. He commands distribution to be made, and orders all alike to communicate in both symbols. And there is no obscurity in the words; Take, distribute among yourselves; drink ye all of this cup. What resemblance is there between the observance which corresponds to our Lord’s command and the Papal Mass, in which they pretend that Christ offers himself to the Father to expiate the sins of the world by the sacrifice of himself, and not only so, but also to obtain redemption for the dead – in which no invitation is given to partake, but one individual sets himself apart from the whole flock – and where, if any one comes forward to partake, the half is withheld from him?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canons and decrees of the Council of</cite>, Trent, with the antidote (1547) in John Calvin: tracts and letters, trans. and ed. Henry Beveridge (7 vols, Edinburgh, 1851), iii, 59.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/the-mass.html">The Mass</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-90ca2723c8" data-kw="">
<blockquote><p>Another question arises about the reality of real relation, namely whether there is a real distinction between the relation itself and its absolute foundation, on which see chapter 8 below. Quantity too gives some difficulty, namely whether it is merely a mode or modal accident of substance or not. For Scholastics, in order to explain how the sensible species of the Eucharist can be sustained miraculously in the absence of the substance of bread and wine, seem to have changed, and perhaps not a little, the original Aristotelian opinion. But this question seems rather to belong to theology than to philosophy.</p></blockquote>

</figure><figure class="quote" id="q-42023b3dec" data-kw="">
<blockquote><p>It were a greater work to illustrate these great mysteries as they deserve, and I am unwilling to meddle with their obscene impurities, which are daily before the eyes and faces of all, that it may be understood that the mass, taken in the most choice form in which it can be exhibited, without any appendages, teems from head to foot with all kinds of impiety, blasphemy, idolatry, and sacrilege.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.18.18</span></figcaption>

</figure><figure class="quote" id="q-05426fba33" data-kw="both kinds">
<blockquote><p>From this the opinion of the Romanists is evident without any further investigation. Ours is wholly contrary. In fact, we think that the communion under both kinds instituted by Christ should necessarily be retained; so that it is not only free to each one to use it, but from the command of Christ they are individually bound to it, unless they are prevented by some insuperable hindrance. Not without the highest sacrilege can the cup be taken away from the people against the express law of God. The state of the question therefore (1) is not Was communion under both kinds instituted by Christ? (which our opponents do not dispute); but Ought it to be instituted in like manner by believers, so that it is not only a thing indifferent and accidental, but necessary and essential to the perfection of the sacrament? (2) The question is not Is the believer so bound to communion under both kinds that he cannot in any case without sin commune under one kind only? For we confess if any unavoidable impediment interposes, either internal (arising from the disposition of the receiver) or external from other causes, by which he is prohibited from taking one kind, such an one is worthy of commiseration rather than of reprehension.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.25.5</span></figcaption>

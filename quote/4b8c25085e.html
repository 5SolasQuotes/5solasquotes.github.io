<main class="wrap"><figure class="quote" id="q-4b8c25085e" data-kw="Author of sin">
<blockquote><p>Although God by his providence governs even sins, yet he is not the cause or author of sin: because he takes no delight in sin, but rather abhors it; nor does he himself sin, or can he sin; likewise because he neither commands nor persuades sin; nor does he pour malice into those who sin, nor compel them to sin; and moreover he directs all things to a good end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Christian Doctrine</cite>, Locus 6, aph. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a> › <a href="../topics/providence/providence-and-evil/the-problem-of-evil.html">The problem of evil</a></span><span class="t"><a href="../topics/the-decrees-of-god/decree-and-sin.html">Decree and Sin</a> › <a href="../topics/the-decrees-of-god/decree-and-sin/god-not-the-author-of-sin.html">God not the author of sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-12a63f8296" data-kw="Author of sin Depravity">
<blockquote><p>First, the offering of occasions which can be procured only by the peculiar providence of God by the concourse of circumstances and the proposition of objects, fitted to move faculties constituted in this or that way (in which manner God does not infuse wickedness into the minds of men, but draws out into action the wickedness latent there).</p></blockquote>

</figure><figure class="quote" id="q-bc72ee2b84" data-kw="Permission Author of sin">
<blockquote><p>Not by permitting the evil action, because he is bound by no law to hinder sin. Not by determining it; for as he who puts out a fire so that it may not spread further is not the cause of the fire, so he who fixes bounds to sin is not the cause of sin. Not by directing it to a good end; for as it is the highest art to prepare a wholesome medicine from venomous animals, so it is glorious for God to draw light even out of darkness, and something good out of evils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wollebius.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 6 (providence), canon 11</span></figcaption>

</figure><figure class="quote" id="q-f36de3147a" data-kw="Author of sin Satan">
<blockquote><p>Yet we deny that He is the author of sin, or that the blame of things done amiss can be laid upon Him, seeing His will is the sovereign and infallible rule of all righteousness and equity: but this we confess that He has those admirable means as whereby He makes the devils and the ungodly, as His instruments to serve Him and to turn the evil which they do and whereof they are guilty into good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed-churches.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The French Confession</cite>, 1559, Art. 8</span></figcaption>

</figure><figure class="quote" id="q-7c90655911" data-kw="providence sin mean">
<blockquote><p>The orthodox hold the mean between these extremes, maintaining that the providence of God is so occupied about sin as neither idly to permit it (as the Pelagians think) nor efficiently to produce it (as the Libertines suppose), but efficaciously to concur about it, so that he is neither the author of sin nor a mere idle spectator of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 6.7.2</span></figcaption>

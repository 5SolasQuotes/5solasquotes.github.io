<main class="wrap"><figure class="quote" id="q-8e2a5d167e" data-kw="">
<blockquote><p>To as many as received Him, to them gave He power to become the sons of God, even to them that believe on his name, which were born not of blood nor of the will of the flesh, nor of the will of man, but of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gaspine.html">John Gaspine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Farewell Sermons of some of the Most Eminent of the Nonconformist Ministers: Delivered at the Period of their Ejectment by the Act of Uniformity in the year 1662</cite>, (London: Gale &amp; Fenner, 1816), p. 352 | “I shall show how many ways a people or person may have God to be their Father, and they may be his children: | Thirdly, a person may have God for his Father by adoption and regeneration; and thus true believers, and only such are the children of God, and God is their Father, 1 John 12:13:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/adoption/fatherhood-of-god.html">Fatherhood of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-10b9772ad2" data-kw="">
<blockquote><p>But when he was yet a great way off, his father saw him, and had compassion, and ran, and fell on his neck, and kissed him, and . . . said to his servants, Bring forth the best robe, and put it on him; and put a ring on his hand, and shoes on his feet: and bring hither the fatted calf, and kill it; and let us eat, and be merry: for this my son was dead, and is alive again; he was lost, and is found. . . It was meet that we should make merry, and be glad for this thy brother was dead, and is alive again; and was lost, and is found.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/b-h-carroll.html">B.H. Carroll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“God and the Sinner,” in Sermons and Life Sketch of B. H. Carroll, D. D., compiled by Rev. J. B. Cranfill</cite>, (Philadelphia: The American Baptist Publication Society, c1893; repr. by Gallatin, TN: Church History Research &amp; Archives, 1986), 149-162. This quote was compiled by Tony Byrne | I say that the universality of these invitations, their earnestness, their broadness, which accompany the publication of the means and which are accompanied by the prayers of those that publish the means, is an evidence of the truth of the proposition with which we started out, that a sinner’s death can never be attributed to God’s pleasure. God’s pleasure runs in another direction. It is further evidenced by the welcome that is extended to the man who accepts the invitation and who returns to God. I want to read that to you. I do not know how better to get before you the preciousness of the truth. I read it to you from the fifteenth chapter of Luke, in that matchless parable of the prodigal son:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/adoption/fatherhood-of-god.html">Fatherhood of God</a></span></div>

</figure><figure class="quote" id="q-f56ed18439" data-kw="">
<blockquote><p>IV. [The use of the doctrine of creation] Unto Παράκλησιν [Paraklēsin, Consolation]: Let us trust, however, in the help of God in whatever case, because both He can help us, as He who by a word fashioned the soul, Gen. 1, and He wills to help, because He is paternally affected toward man, inasmuch as concerning all things, not only for necessity but also for delight, He provided even before he existed. Let us retain this confidence concerning Him, however much the means of helping may not be present, Gen. 2:5-6.</p></blockquote>

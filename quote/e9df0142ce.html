<main class="wrap"><figure class="quote" id="q-e9df0142ce" data-kw="">
<blockquote><p>There have been certain strange folk who have wished to suggest from this passage [Mt. 1:24-25] that the Virgin Mary had other children than the Son of God, and that Joseph had then dwelt with her later; but what folly this is! for the gospel writer did not wish to record what happened afterwards; he simply wished to make clear Joseph’s obedience [to the angel in Mt. 1:24] and to show also that Joseph had been well and truly assured that it was God who had sent His angel to Mary. He had therefore never dwelt with her nor had he shared her company. There we see that he had never known her person for he was separated from his wife. He could marry another all the more because he could not enjoy the woman to whom he was betrothed; but he rather desired to forfeit his rights and abstain from marriage [for the time?], being yet always married: he preferred, I say, to remain thus in the service of God rather than to consider what he might still feel that he could come to. He had forsaken everything in order that he might subject himself fully to the will of God. And besides this, our Lord Jesus Christ is called the first-born. This is not because there was a second or a third, but because the gospel writer is paying regard to the precedence. Scripture speaks thus of naming the first-born whether or no there was any question of the second. Thus we see the intention of the Holy Spirit. This is why to lend ourselves to foolish subtleties would be to abuse Holy Scripture, which is, as St. Paul says, “to be used for our edification.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon 22 on Matthew 1:22-25</cite>, (1562), from Corpus Reformatorum, vol. 46, pp. 259-272 (not currently on the net) as given in Max Thurian (a Protestant), Mary: Mother of All Christians, trans. Nevill B. Cryer (New York: Herder &amp; Herder, 1963), pp. 39-40. The French and this English excerpt, along with another larger translation of the French, has been provided by the Roman apologist Dave Armstrong, ‘John Calvin: Sermon 22 on Matthew 1:22-25 (Mary’s Perpetual Virginity)’.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d8b5db9ae0" data-kw="">
<blockquote><p>Now the question may occupy us how Christ could have brothers, since He was the only Son of Mary, and the Virgin Mary bore no children besides Him. Some say that Joseph had been married before his marriage to Mary, and that the children of this first wife were later called Christ’s brothers… Any children born to Joseph by other wives would have been half brothers of Christ. This is the explanation offered by some. But I am inclined to agree with those who declare that “brothers” really means “cousins” here, for Holy Writ and the Jews always call cousins brothers. Be that as it may, it matters little. It neither adds to nor detracts from faith. It is immaterial whether these men were Christ’s cousins or His brothers begotten by Joseph.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on John, chs. 1-4</cite>, (1539) in LW, 22:214-215</span></figcaption>

<blockquote><p>Doctrine 3. Christ was born of Mary, remaining still a virgin after He was born. This is gathered from the scope of the words [Mt. 1:20], the question being about this, whether Mary were a virgin or no; and the words of the angel were to assure him that she was. Reason. 1. Is that this might be a singular and miraculous sign to the whole house of Israel, and this is it that is pointed at, in Isa. 7:14. Reason 2. That the prophesies going before of this thing might be fulfilled. Reason 3. That God’s omnipotency in this so divine a mystery, and principal a work of God, might be evidently shown. Now it was not difficult to the power of God that a son should be born of a virgin. For seeing all second causes act by their virtue which they received from God, it is not to be doubted, but that God can produce all these effects without this or that cause cooperating, which otherways use to exist by them. Yet not onely the power of God appeared in that work, but also his wisdom, to which it was most agreeable, that so singular a substance of human nature, should in as singular a manner be brought to pass, that differed from all others. For in three manners all men were made before: 1. Without the concurrence of either man or woman, as in the creation of Adam. 2. Without the concurrence of woman, as in the production of Eve. 3. By the concurrence of man and woman, as in all ordinary generation afterwards. And this only is the proper and peculiar one of Christ, by and of a woman, without concurrence of a man. Reason 4. That it might easily appear how the contagion of sin might be removed from the human nature of Christ. [The] Use, is of confirmation, for strengthening of our faith about the person of Christ; to wit, that He was both the Messiah of old promised, and the promised seed of the woman in that peculiar manner, as that promise seems to have intended; to wit, the Son of Man; that is, of a woman descending of Adam and other men in ordinary way, but made mother of a son not vulgarly or after the common manner, but miraculously and without the company of a man begotten, and born; so that from his first conception all things were in him supernatural; about which our minds being busied, ought always to be lifted up to supernatural contemplations, laying aside carnal and worldly thoughts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Christian Religion, or, A Plain and Easy Draught of the Christian Catechism in 52 Lectures</cite>, … (London: Mabb, 1659), 14th Lord’s Day, pp. 100-101</span></figcaption>

<blockquote><p>[Richard Hooker, an Anglican, said:] ‘Now we can nowhere find by reading Scripture anything for the baptizing of infants, or a remedy for women to be cured of original sin in the Old Testament in lieu of circumcision; we find no warrant for the Feast of Dedication in the Law of Moses, nor for the days of puring observed by the Jews, nor for images, invocation of saints, prayer for the dead, the perpetual virginity of the virgin Mary, and many such doctrines which the Church believes.’ But we [Rutherford &amp; the Scottish reformed] answer, because these vain doctrines (we except the baptizing of infants, warranted by Scripture) are not in Scripture, they are the vain and sapless doctrines of men, and will-worship…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (London, 1646), Introduction, section 2, pp. 22-23</span></figcaption>

<div class="actions"><button class="copy" data-copy="“[Richard Hooker, an Anglican, said:] ‘Now we can nowhere find by reading Scripture anything for the baptizing of infants, or a remedy for women to be cured of original sin in the Old Testament in lieu of circumcision; we find no warrant for the Feast of Dedication in the Law of Moses, nor for the days of puring observed by the Jews, nor for images, invocation of saints, prayer for the dead, the perpetual virginity of the virgin Mary, and many such doctrines which the Church believes.’ But we [Rutherford &amp; the Scottish reformed] answer, because these vain doctrines (we except the baptizing of infants, warranted by Scripture) are not in Scripture, they are the vain and sapless doctrines of men, and will-worship…”

<blockquote><p>The nativity of Christ, is that whereby Mary, a virgin, did after the course of nature and the custom of women [contra in partu], bring forth Christ, that Word of the Father and the Son of David: so that those are much deceived which are of opinion that Christ, after a miraculous manner, came into the world, the womb of the Virgin being shut. Lk. 2:23, ‘Every man-child which first opens the womb, shall be called holy to the Lord.’ The which place of scripture is applied to Mary and our Savior Christ. Hence is it that the Virgin Mary is said Theotokos [God-bearer] to bring forth God, albeit she is not any way mother of the Godhead. For Christ as He is God, is without mother, and as man, without father. It is convenient to be thought that Mary continued a virgin until her dying day, albeit we make not this opinion any article of our belief: I. Christ being now to depart the world, committed his mother to the tuition and custody of his disciple John, which it is like He would not have done, if she had had any children, by whom, as custom was, she might have been provided for, Jn. 19:26. II. It is likely that she who was with child by the Holy Ghost, would not after[ward] know any man. III. It is agreed of by the Church in all ages.</p></blockquote>

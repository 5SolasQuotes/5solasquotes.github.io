<main class="wrap"><figure class="quote" id="q-12e38d3156" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Oration on the Synod of Dort &amp; the Remonstrants’ Articles’</cite>, trans. AI (1619; Monergism, 2026), Article 2, ‘Concerning the Death of Christ for All’, p. 24</span></figcaption>

</figure><figure class="quote" id="q-01d73992a9" data-kw="">
<blockquote><p>We no more need to know specifically for whom Christ died than we need to know specifically who has been ordained to eternal life. The calling indeed rests on a particular basis, for it belongs to and proceeds from the covenant, but it is addressed in keeping with God’s revealed will and with the inherently all-sufficient value of Christ’s sacrifice – also to those who are outside the covenant in order that they too may be incorporated into that covenant and in faith itself receive the evidence of their election.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, (Backer Academic, 2004), 3:246</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

— Herman Bavinck, Reformed Dogmatics (Backer Academic, 2004), 3:246">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+no+more+need+to+know+specifically+for+whom+Christ+died+than+we+need+to+know+specifically+who+has+been+ordained+to+eternal+life.+The+calling+indeed+rests+on+a+particular+basis%2C+for+it+belongs+to+and+proceeds+from+the+covenant%2C+but+it+is+addressed+in+keeping+with+God%E2%80%99s+revealed+will+and+with+the+inherently+all-sufficient+value+of+Christ%E2%80%99s+sacrifice+%E2%80%93+also+to+those+who+are+outside+the+covenant+in+order+that+they+too+may+be+incorporated+into+that+covenant+and+in+faith+itself+receive+the+evidence+of+their+election.%E2%80%9D%0A%0A%E2%80%94+Herman+Bavinck%2C+Reformed+Dogmatics+%28Backer+Academic%2C+2004%29%2C+3%3A246&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F01d73992a9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/01d73992a9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=We%20no%20more%20need%20to%20know,receive%20the%20evidence%20of%20their%20election&amp;text=We%20no%20more%20need%20to%20know%20specifically%20for&amp;text=faith%20itself%20receive%20the%20evidence%20of%20their%20election" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-49b66891f4" data-kw="">
<blockquote><p>This deed of gift and grant, or authentic gospel-offer is expressed in so many words, ‘For God so loved the world, that he gave his only begotten Son, that whosoever believes in Him should not perish, but have everlasting life’ (John 3:16). Where the gospel comes, this grant is published, and the ministerial offer made, and there is no exception of any of all mankind in the grant. If there was, no ministerial offer of Christ could be warrantably made to the party excepted, more than to the fallen angels; and without question, the publishing and proclaiming of heaven’s grant unto any, by way of ministerial offer, presupposes the grant, in the first place, to be made to them: otherwise, it would be of no more value than a crier’s offering of the king’s pardon to one who is not comprehended in it. This is the good old way of discovering to sinners their warrant to believe in Christ; and it does indeed bear the sufficiency of the sacrifice of Christ for all, and that Christ crucified is the ordinance of God for salvation unto all mankind, in the use-making of which only they can be saved; but not an universal atonement or redemption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, … with Notes by the Rev. Thomas Boston (London: Tegg, 1837), p. 106, Notes of Boston</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“This deed of gift and grant, or authentic gospel-offer is expressed in so many words, ‘For God so loved the world, that he gave his only begotten Son, that whosoever believes in Him should not perish, but have everlasting life’ (John 3:16). Where the gospel comes, this grant is published, and the ministerial offer made, and there is no exception of any of all mankind in the grant. If there was, no ministerial offer of Christ could be warrantably made to the party excepted, more than to the fallen angels; and without question, the publishing and proclaiming of heaven’s grant unto any, by way of ministerial offer, presupposes the grant, in the first place, to be made to them: otherwise, it would be of no more value than a crier’s offering of the king’s pardon to one who is not comprehended in it. This is the good old way of discovering to sinners their warrant to believe in Christ; and it does indeed bear the sufficiency of the sacrifice of Christ for all, and that Christ crucified is the ordinance of God for salvation unto all mankind, in the use-making of which only they can be saved; but not an universal atonement or redemption.”

n&amp;text=This%20deed%20of%20gift%20and%20grant%2C%20or%20authentic&amp;text=saved%3B%20but%20not%20an%20universal%20atonement%20or%20redemption" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b3d5828935" data-kw="">
<blockquote><p>2. Nor does the deity of Christ stand in the way, which, since it itself demands satisfaction, does not seem able to receive it from itself, for justice is toward another (Socinus part 3, ch. 5). For I deny that a real diversity must always intervene between the one who makes satisfaction and the one to whom it is made (which is sufficiently refuted from civil affairs: the treasurer general, when his stipend is owed to him, is the same one who ought to pay and to whom it ought to be paid). A moral and virtual distinction suffices here, that is, a diversity of status and mode of subsistence. And thus in Christ, the formal principle of Christ’s actions as Mediator is different from the formal principle as God, whence Christ considered κατ᾽ οἰκονομίαν [according to the economy] made satisfaction to the second person of the divinity considered οὐσιωδῶς [essentially].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’</cite>, tr. by AI by Onku (Utrecht, 1650) Latin</span></figcaption>

<blockquote><p>III. Nations are bound to provide for the support of religion because they are moral persons.

There are duties peculiar to individuals, and which societies are incapable of performing; but all duties which societies arc capable of performing are as obligatory upon them as upon individuals. It is the duty of individuals to promote the interests of religion by every proper and accessible means. To furnish pecuniary aid is one of the most obvious means of supporting religion. The ordinances of the gospel cannot be maintained without such means; and nations being moral persons are bound to see that such means arc provided. “If all men” says Vattel, “are bound to serve God, the entire nation in her national capacity is doubtless obliged to serve and honor him.” It is unquestionably the duty of individuals to give, and that liberally, for the maintenance of the ordinances of religion; but certainly it is not for the advantage of religion that its support be wholly dependent upon spontaneous individual liberality. This is too uncertain, and often too capriciously furnished to be safely relied on. Hence the necessity of a national supervision to provide means for the regular administration of the ordinances of religion. This national supervision does not interfere with individual obligation. The former from the nature of the case must be a general provision: this leaves ample scope in the best supposable case, for the exercise of individual liberality. An analogous case illustrates this. A general provision is made by law for the support of the poor; but sufficient room is left notwithstanding for the promptings of individual charity, enough still to excite the emotions of human sympathy. So is it in the case of religion, while a general provision is made by a nation for its support there will still remain sufficient opportunity for individual obligation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive principles of the Reformed Presbyterian Church</cite>, (Albany, 1841), pp 285-6.</span></figcaption>

<blockquote><p>What was then the sin of Peter in resuming the practice of the ceremonies there [in Galatians 2]? His sin was double. First, the abuse of his authority in the Church, for, that unawares by his example, he compelled the gentiles to the use of such ceremonies as himself saw liberty to forbear amongst them; and which having never been commanded by God to them, he had no power to impose on them. His other sin was the dissembling or concealing of his Christian Liberty which he should then have stood upon, when he saw the false teachers urge these ceremonies upon the gentiles as well as upon the Jews, to the prejudice of their Christian Liberty. When things that are indifferent are commanded to be done of necessity (as now all Popes, and prelates’ ceremonies are) then are not the same to be obeyed, because the same destroyes our freedom in Christ. The sum of all this will lead us by the hand one step farther, namely; if it be a sin in Church-governors to command (especially upon strict penalty) indifferent, decent things, it will be a sin also in ministers and in private Christians to subscribe ex animo [from the soul], and to yield obedience by conformity to such commands, although the ceremonies were as good (indeed) as they were pretended (which I believe they are not) indifferent-decent-things. For, does not such voluntary subscription and conforming to them build up our Church-governors, yea and with them (that which is most to be taken to heart of us, our soveraign civil governors also in the confidence) that such commandements are as well lawfully given by them, as received and obeyed, yea confirmed and allowed by us? Now to build up or edify a brother to sin, is properly to offend a brother; for the proper definition of an offence is that which edifies a brother unto sin, as the original word expresses it (1 Cor. 8:10), and so to sin against a brother, is to wound his conscience; yea, and as much as in us lies, to cause him to perish for whom Christ died; which is no better than spiritual murder of his soul. Now, if thus to edify any brother to sin be so heinous an offence, how much more heinous an offence is it to edify our governors to the giving and urging of such commandments, yea and to the sharp censuring of all others as refractory and factious persons, who choose rather to undergo the loss of the greatest comforts they enjoy in this world than to wound the consciences either of themselves or of their governours? It is true by forbearing obedience to those commandments we offend the spirits of our governors, and make them to be (though causelesly) offended with us; But by yielding obedience to these things we should offend their consciences in edifying them to sin, and provoke the Lord to be offended with them. Better they be offended with us, without fault, than through our fault God to be offended with them and us. It is not for Christians, much less for ministers, to redeem outward peace and liberty at so dear a price as the hazzard of the blood of so many precious souls, especially of our governors in highest place and authority. This was the author’s judgement with whom our martyr, Mr. William Tyndale concurs, in his Answer to Mr. Moore’s First Book, pp. 285-6. Our prelates ought to be our servants, as the apostles were, to teach us Christ’s doctrine, and not to Lord over us with their own, Peter called it tempting of the Holy Ghost, Acts 15[:10], to lade the heathen with ought but that which necessity and brotherly love requires, and Paul rebuking the Corinthians and Galatians for their over much obedience, warns all men to stand fast and not to suffer themselves to be brought into bondage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief, Pithy Discourse upon 1 Corinthians 14:40</cite>, … (London, 1661), pp. 13-14</span></figcaption>

<blockquote><p>[A]s your princes and rulers are criminal, with your bishops, of all idolatry committed, and of all the innocent blood that is shed for the testimony of Christ’s truth, and that because they maintain them in their tyranny, so are you (I mean so many of you as give no plain confession to the contrary) criminal and guilty with your princes and rulers, of the same crimes, because ye assist and maintain your princes in their blind rage, and give no declaration that their tyranny displeaseth you.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“[A]s your princes and rulers are criminal, with your bishops, of all idolatry committed, and of all the innocent blood that is shed for the testimony of Christ’s truth, and that because they maintain them in their tyranny, so are you (I mean so many of you as give no plain confession to the contrary) criminal and guilty with your princes and rulers, of the same crimes, because ye assist and maintain your princes in their blind rage, and give no declaration that their tyranny displeaseth you.”

</figure><figure class="quote" id="q-c81f8ffed3" data-kw="">
<blockquote><p>Upon perusal of Mr. Ascham’s book you left with me, I find not myself in my understanding thereby convinced of the necessity or lawfulness of conforming unto, or complying with an unjust prevailing power further than I was before persuaded. It might be lawful or necessary so to do: viz. as I paying taxes and submitting to some other things (in themselves not unlawful) by 〈1 page missing〉 3. Without any explicit or implicit acknowledgment of the justice and legality of their power: I may submit to the [Greek] (to the force), but not acknowledge the [Greek] (the authority), or by any [of] my voluntary act give strength, assistance or countenance thereunto.

4. Without any prejudice unto the claim of the oppressed party that has a right, title; or casting myself into an incapacity of lending him my due and bounden assistance, if in time to come it may be useful to him towards the recovery of his right.

5. Where I may reasonably and bona fide [with good faith] presume the oppressed power (to whom my obedience is justly due), if he perfectly knew the present condition I am in together with the exigence and necessity of the present case and all of circumstances thereof, would give his willing consent to such my conformity and compliance. So that upon the whole matter and in short, I conceive I may so far submit unto the impositions or comply with the persons of a prevailing usurped power unjustly commanding things not in themselves unlawful, or make use of their power to protect one from other’s injuries, as I may submit unto, comply with or make use of a highway thief or robber when I am fallen into his hands and lie at his mercy. As for Mr. Ascham ‘s discourse, though it be handsomely framed, yet all the strength of it (to my seeming) lie’s upon two principles, which (if he would speak out) would be in plain English these:

1. That self-preservation is the first and chiefest obligation in the world, to which all other bonds and relations (at least between man and man) must give place.

2. That no oath, at least no imposed oath, at what terms soever expressed, binds the taker further than he intended to bind himself thereby; and, it is presumed, that no man intended to bind himself to the prejudice of his own safety. [These are] Two dangerous and desperate principles which evidently tend: 1. to the taking away of all Christian fortitude and suffering in a righteous cause; 2. to the encouraging of daring and ambitious spirits to attempt continual innovations, with this confidence, that if they can by any ways (how unjust soever) possess themselves of the supreme power, they ought to be submitted unto; 3. to the obstructing unto the oppressed party all possible ways and means, without a miracle, of ever recovering that just right of which he shall have been unjustly dispossessed; and (to omit further instancing) 4. to the bringing in of atheism with the contempt of God and all religion, whilst every man, by making his own preservation the measure of all his duties and actions, makes himself thereby his own idol.</p></blockquote>

<blockquote><p>Q. IV. What are the ends that I aim at in the great undertaking? … 3. I can appeal to God, that I have no design in the least to maintain a party, or to keep up any schismatical faction; my heart rises against the thoughts of it. I hate dividing principles and practices, and whatever others use, I am for peace and healing; and if my blood would be sufficient balsam, I would gladly part with the last drop of it, for the close up of the bleeding wounds of differences that are amongst true Christians. Peace is such a precious jewel, that I would give anything for it but truth. Those who are hot and bitter in their contendings for or against little things, and zealous in keeping up names of division and maintaining parties, are of a spirit which I understand not. Let not my soul come into their secret. My ends then are according to my principles, and I humbly appeal to God concerning the integrity of my heart in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Serious Self-Examination Before Ordination’ (1687) in the biographies of Henry by William Tong &amp; J.B. Williams</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-388b438a3a" data-kw="">
<blockquote><p>First, for schismatical Churches, that is, such as embrace and profess the common saving faith of the catholic Church; but yet have separated themselves from the outward communion of those particular visible Churches, that sometimes they have been, and should be members of: the cause of such schisms is sometimes pride, discontent, weakness, willfulness, pretended zeal, a factious spirit; always it is Satan’s instigation, and man’s acceptation: whatsoever the cause be, and how great soever the schism be, though they be justly condemned as schismatical, in regard they are rent from the outward fellowship of such visible congregations as they belong unto, yet because they hold correspondency with the catholic Church in matters of saving faith, and accordingly profess the same, they [the schismatics] cannot be denied to be true visible Churches: Such were the Donatists of old, and such are the Brownists at this day…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-randall.html">John Randall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twenty-Nine Lectures of the Church… (London: Kyngston, 1631). Randall (1570–1622) was an English puritan. | pt. 2</cite>, Lecture 26; p. 151</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

pener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7c2cd21a76" data-kw="">
<blockquote><p>First, that the blessed and long sought for union of Protestant Churches may be recommended unto the public prayers of the Church. And secondly, that either an Evangelical correspondency for mutual edification, for healing of breaches, for taking away of scandals and for the advancement of the Gospel of Jesus Christ amongst Protestants should henceforth be entertained with foreign Churches, by those to whom the care of so blessed a work may be with authority referred: Or that his Majesty, with your Honours’ advice and grave counsel, might be moved to call together a general synod of Protestants in due time, for the better setling of weighty matters in the Church, which now trouble not only the consciences of most men, but disturb the tranquility of publick states and divide the Churches one from another to the great hinderance of Christianity, and the dishonour of religion. All which evils by this means may be taken out of the way, and from hence a great blessing of God, and much honour amongst men will redound to this Church and nation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/articles-of.html">Articles of</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John Dury, his Petition to the Honourable House of Commons in England, now Assembled in Parliament (London, 1641) 2 pp.</cite></span></figcaption>

hurch%20and%20nation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d67e8ccc5c" data-kw="">
<blockquote><p>By ‘unity’ we mean the concurrence of men’s judgments, affections and actions about the same thing in one and the same way, and for the same end. By ‘forbearance’ we mean the refraining from uncharitable and unkindly affections and behaviors towards another in some things, although there be some difference between us and him in judgement and in the way of acting about these things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Moderator: Endeavoring a Full Composure &amp; Quiet Settlement of those many Differences both in Doctrine &amp; Discipline, which have so long disturbed the peace and welfare of this commonwealth (London: Bellamy, 1652), ch. 3</cite>, p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“By ‘unity’ we mean the concurrence of men’s judgments, affections and actions about the same thing in one and the same way, and for the same end. By ‘forbearance’ we mean the refraining from uncharitable and unkindly affections and behaviors towards another in some things, although there be some difference between us and him in judgement and in the way of acting about these things.”

— Joseph Caryl, The Moderator: Endeavoring a Full Composure &amp; Quiet Settlement of those many Differences both in Doctrine &amp; Discipline, which have so long disturbed the peace and welfare of this commonwealth (London: Bellamy, 1652), ch. 3, p. 24">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy+%E2%80%98unity%E2%80%99+we+mean+the+concurrence+of+men%E2%80%99s+judgments%2C+affections+and+actions+about+the+same+thing+in+one+and+the+same+way%2C+and+for+the+same+end.+By+%E2%80%98forbearance%E2%80%99+we+mean+the+refraining+from+uncharitable+and+unkindly+affections+and+behaviors+towards+another+in+some+things%2C+although+there+be+some+difference+between+us+and+him+in+judgement+and+in+the+way+of+acting+about+these+things.%E2%80%9D%0A%0A%E2%80%94+Joseph+Caryl%2C+The+Moderator%3A+Endeavoring+a+Full+Composure+%26+Quiet+Settlement+of+those+many+Differences+both+in+Doctrine+%26+Discipline%2C+which+have+so+long+disturbed+the+peace+and+welfare+of+this+commonwealth+%28London%3A+Bellamy%2C+1652%29%2C+ch.+3%2C+p.+24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd67e8ccc5c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d67e8ccc5c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/unity-of-the-church/#:~:text=By%20%E2%80%98unity%E2%80%99%20we%20mean%20the%20concurrence,way%20of%20acting%20about%20these%20things&amp;text=By%20%E2%80%98unity%E2%80%99%20we%20mean%20the%20concurrence%20of%20men%E2%80%99s&amp;text=in%20the%20way%20of%20acting%20about%20these%20things" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c657d1c5d6" data-kw="">
<blockquote><p>And concerning the bounds and limits of this forbearance, all will undeniably acknowledge that it ought not to be extended indifferently unto all persons, opinions and practises, but that these four propositions are agreeable to the truth of Christianity: … Secondly, that it is not the mind of Christ that any of his servants should profess themselves willing or obliged to bear with any person which does endeavour, and with any doctrine or practice which does tend to overthrow the faith in his name, which is delivered to the saints (Jude 3), or to destroy the life and power of godliness either in the private or publick profession of religion (Tit. 1:10-11; 2 Tim. 3:5-8; Gal. 5:7-13), or to dissolve the bonds of holy communion amongst Christian brethren (Phil. 3:2; Jud. 19; Rom. 16:17-18), or to abolish the orderly relations and obligations natural and moral, without which human societies cannot stand (1 Tim. 5:8; Mt. 15:4-6; 1 Tim. 4:3), or to put down the authority which God has set up in and over human societies for the administration of justice therein (2 Pet. 2:10; Rom. 13:1-8). … Fourthly, that in matters of greater weight, which are not merely circumstantial, but are conceived to be determined by the Word, yet so, as that it is differently understood: in this case the mind of Christ is that the rules of Christian charity and mutual edification, be inviolably observed with all long suffering and forbearance. And this course ought to be continued so long, either as there is hope to gain the advantage of loving conferences, whereby differences may be reconciled, and mistakes and scandals prevented and taken out of the way; or so long as there is cause to think that God may reveal his profitable truths to such as err not wilfully, but through weakeness of judgment and harmlessly, Phil. 3:15-16 and 2 Tim. 2:22-26.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Moderator: endeavoring a Full Composure &amp; Quiet Settlement of those many differences both in doctrine &amp; discipline which have so long disturbed the peace &amp; welfare of this Commonwealth… (London: Bellamy, 1652), ch. 8, pp. 57-58 Caryl was a congregationalist.</cite></span></figcaption>

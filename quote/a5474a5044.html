<blockquote><p>VI. We know that the evangelical promises are universal, and appertain to all: but not to the incredulous and unconverted Turks, Jews, heathens, Epicures, so long as they remain such, but to all believers; for to all promises there is the condition of faith in Christ annexed, either implicitly, or explicitly, that which the plain text of Scripture shows.</p></blockquote>

<blockquote><p>III. The same controversy was afterwards renewed among the Romanists, some of whom defended the universality of redemption (with the Semipelagians), others its particularity (with Augustine and his genuine disciples). This controversy lay principally between the Jesuits and Jansenists, of whom the former (an offshoot of the Pelagians) warmly contend for the universality of Christ’s death, while the latter with great firmness defend its particularity, following their founder, Jansen, who has argued this subject very largely and with great solidity in his Augustinus (‘De Gratia Christi Salvatoris,’ 3.20 [1640/1964]. pp. 369-80), his Apologia Jansenii published in 1644, Art. 17,19,20+ and in Catechismo de Gratia, c. 7, de Predesti. q. 65+.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, Question 14, p. 456</span></figcaption>

<blockquote><p>IV. The efficient cause of the Resurrection in common is the whole Holy Trinity; but singularly, Christ the Lord. Christ is its efficient cause in three ways:

I. As God.

II. As Judge of the World.

III. As Mediator. In the first two ways he is the efficient cause of the resurrection of the reprobate as well as of the elect; in the third way he is the cause of the Resurrection of the faithful by merit, efficacy and beginning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 34 (the resurrection), canon 4</span></figcaption>

<blockquote><p>Hence, it is not allowed that Christ has died for the reprobate, yet by the death of Christ they have been made reconciliable in this sense:

1. Because Christ assumed the nature which is common; it is not conceded that it was common to all, but it was the nature of Abraham, the father of the believing (Heb. 2:16). Hence, the devils are not at all made salvable by Christ, of course, as the angelic nature has not itself been united to his person.

2. Because Christ has expiated the common sin of Adam on the tree of the cross, though it is not conceded that it was as common, but as it was in the elect and the believing.

3. Because the grace of the preaching of the Gospel has been procured [impetrata est] by the death of Christ to reprobates born in the visible Church, and the sacrifice of Christ has been made approved and of simple complacency to them. Wherefore they are called to the Supper (Mt. 22; Lk. 14:16) and are called to Christ (Mt. 11:16; 23:37-38; 1 Cor. 1:18,23; [sic] Acts 14:46; Prov. 1:24-25; Isa. 6:10-11; 65:2-3). These previous things cannot be said of devils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether the Reprobate are made Reconcilable by the Death of Christ?’</cite>, [Distinguish] in Rutherford’s Examination of Arminianism: The Tables of Contents with Excerpts from Every Chapter, trans. T. Fentiman &amp; C. Johnson (RBO, 2019), pp. 90-92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<blockquote><p>9. As for the intention of application, it is rightly said that Christ made satisfaction only for those whom He saved, though in regard to the sufficiency in the mediation of Christ it may also rightly be said that Christ made satisfaction for each and all. Because these counsels of God are hidden to us, it is the part of charity to judge well of every one, although we may not say of all collectively that Christ equally pleads the cause of each before God.</p></blockquote>

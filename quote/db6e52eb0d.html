<main class="wrap"><figure class="quote" id="q-db6e52eb0d" data-kw="">
<blockquote><p>The question also arises, whether it was strictly speaking through his passion and death that Christ merited this glory for his human nature. And whereas we really do not wish to enter into a dispute with those who make this claim,† since Christ certainly did obtain it for us by the worthiness of what He merited, yet we are of the opinion that the opposite point of view, which is shared by many Reformed writers, rests upon arguments that are stronger. The chief one of these is that the glory was owed to Christ by the right of his hypostatic union, and as the Son’s, and as the Son’s rightful inheritance (Ps. 2:7-8; Heb. 1:2). And so, by the consensus of all theologians, that hypostatic union does not follow upon any merit, nor the things which necessarily and by God’s decree followed it–which is why the apostle Paul also uses the word [karisasthai] ‘to bestow as gift’ in this context (Phil. 2:9 [‘and given Him’]).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, Section 29 of Disputation 28, ‘On Jesus Christ in his State of Exaltation’ in Synopsis of a Purer Theology, vol. 2, ed. Henk van den Belt (1625; Brill, 2016), p. 175 In Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-95c848559a" data-kw="">

</figure><figure class="quote" id="q-fd1c7f51b5" data-kw="">
<blockquote><p>According to the view of the Scotists and the Nominalists, the reason for the meritoriousness of good works lies exclusively in God’s free acceptance so that God could have accepted as merit and rewarded with everlasting life merely naturally good works. According to the better-founded Thomistic view, the ground of the meritoriousness lies also in the intrinsic value of good works performed in the state of grace. The state of grace effects an inner equivalence (meritum de condigno) between the good actions and the eternal reward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludwig-ott.html">Ludwig Ott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fundamentals of Catholic Dogma</cite>, bk. 4, pt. 1, sec. 2, §24, 3</span></figcaption>

</figure><figure class="quote" id="q-db4fc88540" data-kw="">
<blockquote><p>Nor may it be gathered from this that this is merit de condigno; for even though it is from God, yet it is not from God dwelling within through justifying grace, but from God stirring up and helping from without … and moreover it is from God beginning and initiating, not yet completing and perfecting. Hence it is a merit begun and imperfect; and it has some dignity and proportion to its end, but not so great as merit de condigno requires. Finally, there is lacking, as we said, a pact properly so called, without which there can be no merit out of justice, or de condigno.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-f6b0d135b8" data-kw="">
<blockquote><p>So in treating of our restoration, Paul intimates in close connection issuing from our very justification before God–provided conviction of it is ours–the immediate presence in believers of the Spirit, the fashioner of all the righteousness we are to display in our lives. Hence he never uses the word ‘justify’ in this way without appearing to speak no less of this imparting of true righteousness than of the round and head of our entire salvation, the forgiveness of sins. In chapter 3 (verse 25) [of Romans] after saying that righteousness is revealed in the era of the unveiling of the gospel, that is to say, is so clearly manifested in the lives of believers that the world now acknowledges these alone to be capable of true righteousness, and after saying secondly, that Christ came to introduce to the world an endeixis, a demonstration of divine righteousness unmistakable to all, he then added, ‘that God himself might be righteous, and the justifier of him who has faith in Jesus Christ’. Here without a doubt he includes at the same time in the word ‘justify’ that righteousness which God produces by his Spirit in those who believe in Christ, and which he intends to be his attestation to the effect that he has now forgiven their sins and counts them among those he resolved to justify, that is, to count among the righteous not only by pardoning their sin but also by conforming them to the image of his Son. The apostle always speaks about our justification in this fashion, never failing to comprehend the summit of our salvation, for which he prayed for the Philippians as follows: ‘It is my prayer that your love may abound more and more in knowledge and all aesthesis (that is, a quality of discernment) whereby you may be able to approve with certainty what is excellent, and to this end, that you may be pure and give offence to no one, thus being equipped for the day of Christ, and filled with the fruits of righteousness which are produced through Jesus Christ to the glory and praise of God.’ [1:9-11] Consequently, since Paul is accustomed to speaking in this way, denoting by the word ‘justification’ first of course the remission of sins, yet at the same time always indicating in addition that imparting of righteousness which God proceeds to work in us by the Spirit, the same Spirit by whom he grants us assurance of the pardon of our sins and of his goodwill towards us, and whom he has established the seal (sphragis) of that pardon–because, I say, Paul customarily speaks in these terms, the majority of the holy Fathers, bearing in mind no doubt the more visible aspect of justification, have taken dikaiousthai, ‘to be justified’, in the sense of ‘to be made righteous… It goes without saying that however great a degree of righteousness the Spirit of Christ might effect in us when we believe, it will nonetheless [not?] be sufficient to merit our being regarded as righteous in God’s sight, for we remain unprofitable servants even when we have fulfilled all his bidding. It was with this in mind that Philip Melanchthon in his highly erudite and devout Commentary on this Epistle rightly condemns those who want to make, “We are justified by faith,’ mean, “Faith is the source or cause that produces other virtues for whose sake we are pronounced righteous,’ or ‘Faith itself is in us a virtue, deserving of God’s approval.’ And he subjoins these godly words: ‘“We are justified by faith,” should be transposed in[to] this sentence: “We are reckoned righteous by mercy.” Similarly, “we are justified by faith alone” means, “We are pronounced righteous by trusting in mercy alone”–so it is only for us to add, ‘as we are given the assurance that we are so pronounced, and thus know by experience this merciful favour of God.’ Surely no godly soul can doubt for a moment that it is through God’s mercy alone and for the sake of Christ’s merit alone that we are justified, pronounced righteous before God, and not because of anything in us at all, however many works of holiness, however genuine our fruits of the Spirit. For who is ignorant of the Scripture, ‘Enter not into judgment with thy servant, for no man living will be justified before thee’? [Ps. 143:2] And in Isaiah, ‘In the Lord shall all the seed of Israel be justified and praised’. [Isa. 45:25]</p></blockquote>

<blockquote><p>Neither does the distinction added in § 5 between first and second justification effect anything, since it is a pure fiction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/valentin-veltheim.html">Valentin Veltheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Dissertation on James 2.24</cite>, §25</span></figcaption>

— Valentin Veltheim, Theological Dissertation on James 2.24, §25">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNeither+does+the+distinction+added+in+%C2%A7+5+between+first+and+second+justification+effect+anything%2C+since+it+is+a+pure+fiction.%E2%80%9D%0A%0A%E2%80%94+Valentin+Veltheim%2C+Theological+Dissertation+on+James+2.24%2C+%C2%A725&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F918bc7b9a5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/918bc7b9a5.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-bacfbd6ff5" data-kw="">
<blockquote><p>But believers sin greatly after they are in a justified state, and so stand in need of renewed pardon, from time to time. That believers sin after they are in a justified state, sad experience, as well as God’s Word, does daily show; but the sins of those who are in a justified state come under another consideration, for their “persons are not under the law,” (or legal covenant) Rom. 6:14. They are in Christ, who is “the end of the law for righteousness, to every one that believeth,” Rom. 10:4. So that as believers have nothing to do with the law, so as to seek justification for their persons, by their obedience to the same; neither can the law, with its condemning power, reach them, so as to bring them into legal condemnation again: so that unless the covenant of grace be made void, the believer’s justified state remains, and he is no more under the law forever. … But if the saints are not under the law, or legal covenant, then it should seem from thence that they need no pardon of sin, and so ought not in their daily prayers to pray for the same: so where there is no law there is no transgression. Though believers are not under the law, or legal covenant, yet it does not from thence follow that they stand in no need of daily pardon. Indeed, they stand not in need of such pardon as unbelievers stand in need of, they are under a legal condemnation, obnoxious to the curse, and stand in need of a change of their state, God being to them a God of terror. But if at any time they are, through grace, brought savingly to believe in Christ, then God, as a God of all grace, freely justifies them, by remitting of their sins, and imputing of Christ’s righteousness for their justification, and properly this is Scripture justification, Rom. 4:6, 8. But believers standing in relation to God, as children to a tender-hearted Father, this alters the case quite, and shows a vast difference between the state of the one and of the other, the believer being “justified from all things,” Acts 13:39, and the unbeliever being “condemned already,” John 3:18. Now though God deal as a Judge with those that continue in their unbelief, yet He deals as a tender-hearted Father with all true believers. “Like as a father pitieth his children, so the Lord pitieth them that fear him: yea, he remembereth that we are dust,” Ps. 103:13-14. Now when the saints sin against a loving Father, then does God come forth with his fatherly corrections: “Then will I visit their transgressions with the rod, and their iniquity with stripes,” Ps. 89:32. And sometimes in a very sore manner; “Behold thou art wroth, for we have sinned,” Isa. 64:5. Indeed the sins of the saints shall not make void God’s covenant, therefore the prophet comes in the next words, saying, In those, that is, in thy mercies, is continuance, and we shall be saved; yet they highly provoke a tender-hearted Father by sinning against Him; and as often as the saints sin against their heavenly Father, in this their new covenant relation, so oft they stand in need of fatherly forgiveness. Thus with holy David, who had sinned in the matter of Uriah, yet when brought to confess the same, “Nathan said unto David, The Lord hath put away thy sin, thou shalt not die,” 2 Sam. 12:13; for by God’s law adulterers ought to be put to death, Lev. 20:10. Now God remitting this temporal chastisement to David, is said to pardon, or put away his sin: and the Church cried out, Lam. 3:42, “We have transgressed and rebelled, thou hast not pardoned;” that is, their afflictions were not removed. And in this sense God oft lets sin lie on his otherwise justified children for some time unpardoned, and as often as He is pleased to remit these chastisements, so often He may be said to pardon his children; and as long as the saints sin against their God and Father in their new covenant relation, so long shall we need renewed pardon, which will be whilst we are in this world. And this should keep the saints at the throne of grace, daily begging of pardon, confessing of sin, bewailing of corrupt nature, and entreating a farther discovery of their covenant state. Now in this respect, the saints daily need pardon of sin, and a more full discovery of their new covenant relation with God; so that it is not true in every respect, you see, to say all pardon is at once: but with respect to the justifying of our persons, in a proper sense, justification is but one constant, complete act of grace, admitting of no degrees, nor revocation, but remains firm for ever. But if God correct his justified children for their sins, does it not dishonour the cross of Christ? That God does correct his saints here for their sins, and not only from them, as some would have it, is most plain from the New, as well as from the Old Testament… So that though God does not, as a judge, take vengeance on his justified children for their sins, yet as a loving Father He assuredly corrects them when they go astray. And certainly there can be no good argument drawn from the perfection of Christ’s satisfaction, to exempt believers from fatherly corrections here for their going astray. Nay, holy David looks on God’s corrective dispensations, as his keeping of covenant with him: “I know, O Lord, thy judgments are right (that is, thy corrections) and that them in faithfulness hast afflicted me,” Ps. 119:75.</p></blockquote>

ther, the believer being “justified from all things,” Acts 13:39, and the unbeliever being “condemned already,” John 3:18. Now though God deal as a Judge with those that continue in their unbelief, yet He deals as a tender-hearted Father with all true believers. “Like as a father pitieth his children, so the Lord pitieth them that fear him: yea, he remembereth that we are dust,” Ps. 103:13-14. Now when the saints sin against a loving Father, then does God come forth with his fatherly corrections: “Then will I visit their transgressions with the rod, and their iniquity with stripes,” Ps. 89:32. And sometimes in a very sore manner; “Behold thou art wroth, for we have sinned,” Isa. 64:5. Indeed the sins of the saints shall not make void God’s covenant, therefore the prophet comes in the next words, saying, In those, that is, in thy mercies, is continuance, and we shall be saved; yet they highly provoke a tender-hearted Father by sinning against Him; and as often as the saints sin against their heavenly Father, in this their new covenant relation, so oft they stand in need of fatherly forgiveness. Thus with holy David, who had sinned in the matter of Uriah, yet when brought to confess the same, “Nathan said unto David, The Lord hath put away thy sin, thou shalt not die,” 2 Sam. 12:13; for by God’s law adulterers ought to be put to death, Lev. 20:10. Now God remitting this temporal chastisement to David, is said to pardon, or put away his sin: and the Church cried out, Lam. 3:42, “We have transgressed and rebelled, thou hast not pardoned;” that is, their afflictions were not removed. And in this sense God oft lets sin lie on his otherwise justified children for some time unpardoned, and as often as He is pleased to remit these chastisements, so often He may be said to pardon his children; and as long as the saints sin against their God and Father in their new covenant relation, so long shall we need renewed pardon, which will be whilst we are in this world. And this should keep the saints at the throne of grace, daily begging of pardon, confessing of sin, bewailing of corrupt nature, and entreating a farther discovery of their covenant state. Now in this respect, the saints daily need pardon of sin, and a more full discovery of their new covenant relation with God; so that it is not true in every respect, you see, to say all pardon is at once: but with respect to the justifying of our persons, in a proper sense, justification is but one constant, complete act of grace, admitting of no degrees, nor revocation, but remains firm for ever. But if God correct his justified children for their sins, does it not dishonour the cross of Christ? That God does correct his saints here for their sins, and not only from them, as some would have it, is most plain from the New, as well as from the Old Testament… So that though God does not, as a judge, take vengeance on his justified children for their sins, yet as a loving Father He assuredly corrects them when they go astray. And certainly there can be no good argument drawn from the perfection of Christ’s satisfaction, to exempt believers from fatherly corrections here for their going astray. Nay, holy David looks on God’s corrective dispensations, as his keeping of covenant with him: “I know, O Lord, thy judgments are right (that is, thy corrections) and that them in faithfulness hast afflicted me,” Ps. 119:75.”

— William Bridge, ‘The Doctrine of Justification by Faith, Opened &amp; Applied from Rom. 3:24-25…’ in Works (London: Tegg, 1845), vol. 5, pp. 384-89">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+believers+sin+greatly+after+they+are+in+a+justified+state%2C+and+so+stand+in+need+of+renewed+pardon%2C+from+time+to+time.+That+believers+sin+after+they+are+in+a+justified+state%2C+sad+experience%2C+as+well+as+God%E2%80%99s+Word%2C+does+daily+show%3B+but+the+sins+of+those+who+are+in+a+justified+state+come+under+another+consideration%2C+for+their+%E2%80%9Cpersons+are+not+under+the+law%2C%E2%80%9D+%28or+legal+covenant%29+Rom.+6%3A14.+They+are+in+Christ%2C+who+is+%E2%80%9Cthe+end+of+the+law+for+righteousness%2C+to+every+one+that+believeth%2C%E2%80%9D+Rom.+10%3A4.+So+that+as+believers+have+nothing+to+do+with+the+law%2C+so+as+to+seek+justification+for+their+persons%2C+by+their+obedience+to+the+same%3B+neither+can+the+law%2C+with+its+condemning+power%2C+reach+them%2C+so+as+to+bring+them+into+legal+condemnation+again%3A+so+that+unless+the+covenant+of+grace+be+made+void%2C+the+believer%E2%80%99s+justified+state+remains%2C+and+he+is+no+more+under+the+law+forever.+%E2%80%A6+But+if+the+saints+are+not+under+the+law%2C+or+legal+covenant%2C+then+it+should+seem+from+thence+that+they+need+no+pardon+of+sin%2C+and+so+ought+not+in+their+daily+prayers+to+pray+for+the+same%3A+so+where+there+is+no+law+there+is+no+transgression.+Though+believers+are+not+under+the+law%2C+or+legal+covenant%2C+yet+it+does+not+from+thence+follow+that+they+stand+in+no+need+of+daily+pardon.+Indeed%2C+they+stand+not+in+need+of+such+pardon+as+unbelievers+stand+in+need+of%2C+they+are+under+a+legal+condemnation%2C+obnoxious+to+the+curse%2C+and+stand+in+need+of+a+change+of+their+state%2C+God+being+to+them+a+God+of+terror.+But+if+at+any+time+they+are%2C+through+grace%2C+brought+savingly+to+believe+in+Christ%2C+then+God%2C+as+a+God+of+all+grace%2C+freely+justifies+them%2C+by+remitting+of+their+sins%2C+and+imputing+of+Christ%E2%80%99s+righteousness+for+their+justification%2C+and+properly+this+is+Scripture+justification%2C+Rom.+4%3A6%2C+8.+But+believers+standing+in+relation+to+God%2C+as+children+to+a+tender-hearted+Father%2C+this+alters+the+case+quite%2C+and+shows+a+vast+difference+between+the+state+of+the+one+and+of+the+other%2C+the+believer+being+%E2%80%9Cjustified+from+all+things%2C%E2%80%9D+Acts+13%3A39%2C+and+the+unbeliever+being+%E2%80%9Ccondemned+already%2C%E2%80%9D+John+3%3A18.+Now+though+God+deal+as+a+Judge+with+those+that+continue+in+their+unbelief%2C+yet+He+deals+as+a+tender-hearted+Father+with+all+true+believers.+%E2%80%9CLike+as+a+father+pitieth+his+children%2C+so+the+Lord+pitieth+them+that+fear+him%3A+yea%2C+he+remembereth+that+we+are+dust%2C%E2%80%9D+Ps.+103%3A13-14.+Now+when+the+saints+sin+against+a+loving+Father%2C+then+does+God+come+forth+with+his+fatherly+corrections%3A+%E2%80%9CThen+will+I+visit+their+transgressions+with+the+rod%2C+and+their+iniquity+with+stripes%2C%E2%80%9D+Ps.+89%3A32.+And+sometimes+in+a+very+sore+manner%3B+%E2%80%9CBehold+thou+art+wroth%2C+for+we+have+sinned%2C%E2%80%9D+Isa.+64%3A5.+Indeed+the+sins+of+the+saints+shall+not+make+void+God%E2%80%99s+covenant%2C+therefore+the+prophet+comes+in+the+next+words%2C+saying%2C+In+those%2C+that+is%2C+in+thy+mercies%2C+is+continuance%2C+and+we+shall+be+saved%3B+yet+they+highly+provoke+a+tender-hearted+Father+by+sinning+against+Him%3B+and+as+often+as+the+saints+sin+against+their+heavenly+Father%2C+in+this+their+new+covenant+relation%2C+so+oft+they+stand+in+need+of+fatherly+forgiveness.+Thus+with+holy+David%2C+who+had+sinned+in+the+matter+of+Uriah%2C+yet+when+brought+to+confess+the+same%2C+%E2%80%9CNathan+said+unto+David%2C+The+Lord+hath+put+away+thy+sin%2C+thou+shalt+not+die%2C%E2%80%9D+2+Sam.+12%3A13%3B+for+by+God%E2%80%99s+law+adulterers+ought+to+be+put+to+death%2C+Lev.+20%3A10.+Now+God+remitting+this+temporal+chastisement+to+David%2C+is+said+to+pardon%2C+or+put+away+his+sin%3A+and+the+Church+cried+out%2C+Lam.+3%3A42%2C+%E2%80%9CWe+have+transgressed+and+rebelled%2C+thou+hast+not+pardoned%3B%E2%80%9D+that+is%2C+their+afflictions+were+not+removed.+And+in+this+sense+God+oft+lets+sin+lie+on+his+otherwise+justified+children+for+some+time+unpardoned%2C+and+as+often+as+He+is+pleased+to+remit+these+chastisements%2C+so+often+He+may+be+said+to+pardon+his+children%3B+and+as+long+as+the+saints+sin+against+their+God+and+Father+in+their+new+covenant+relation%2C+so+long+shall+we+need+renewed+pardon%2C+which+will+be+whilst+we+are+in+this+world.+And+this+should+keep+the+saints+at+the+throne+of+grace%2C+daily+begging+of+pardon%2C+confessing+of+sin%2C+bewailing+of+corrupt+nature%2C+and+entreating+a+farther+discovery+of+their+covenant+state.+Now+in+this+respect%2C+the+saints+daily+need+pardon+of+sin%2C+and+a+more+full+discovery+of+their+new+covenant+relation+with+God%3B+so+that+it+is+not+true+in+every+respect%2C+you+see%2C+to+say+all+pardon+is+at+once%3A+but+with+respect+to+the+justifying+of+our+persons%2C+in+a+proper+sense%2C+justification+is+but+one+constant%2C+complete+act+of+grace%2C+admitting+of+no+degrees%2C+nor+revocation%2C+but+remains+firm+for+ever.+But+if+God+correct+his+justified+children+for+their+sins%2C+does+it+not+dishonour+the+cross+of+Christ%3F+That+God+does+correct+his+saints+here+for+their+sins%2C+and+not+only+from+them%2C+as+some+would+have+it%2C+is+most+plain+from+the+New%2C+as+well+as+from+the+Old+Testament%E2%80%A6+So+that+though+God+does+not%2C+as+a+judge%2C+take+vengeance+on+his+justified+children+for+their+sins%2C+yet+as+a+loving+Father+He+assuredly+corrects+them+when+they+go+astray.+And+certainly+there+can+be+no+good+argument+drawn+from+the+perfection+of+Christ%E2%80%99s+satisfaction%2C+to+exempt+believers+from+fatherly+corrections+here+for+their+going+astray.+Nay%2C+holy+David+looks+on+God%E2%80%99s+corrective+dispensations%2C+as+his+keeping+of+covenant+with+him%3A+%E2%80%9CI+know%2C+O+Lord%2C+thy+judgments+are+right+%28that+is%2C+thy+corrections%29+and+that+them+in+faithfulness+hast+afflicted+me%2C%E2%80%9D+Ps.+119%3A75.%E2%80%9D%0A%0A%E2%80%94+William+Bridge%2C+%E2%80%98The+Doctrine+of+Justification+by+Faith%2C+Opened+%26+Applied+from+Rom.+3%3A24-25%E2%80%A6%E2%80%99+in+Works+%28London%3A+Tegg%2C+1845%29%2C+vol.+5%2C+pp.+384-89&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbacfbd6ff5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bacfbd6ff5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=But%20believers%20sin%20greatly%20after%20they,faithfulness%20hast%20afflicted%20me%2C%E2%80%9D%20Ps.%20119%3A75&amp;text=But%20believers%20sin%20greatly%20after%20they%20are%20in&amp;text=them%20in%20faithfulness%20hast%20afflicted%20me%2C%E2%80%9D%20Ps.%20119%3A75" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Proposition 3: Many of our learned [Romish] adversaries destroy that which is principal and most essential in remission of sinnes, to wit, condonation. Vasques the Jesuit says [denying condonation]… The said author confirms his opinion by these two arguments especially: … Argument 2: If a condonation be admitted for the merit of Christ, then the merit of Christ imputed is the formal cause of that condonation: and granting this, the justification of a sinner must have two forms: one of remission of sins; the other of inward cleansing and sanctification. But this is contrary to the Trident Council affirming that justification has but one form. (Bellarmine, On Justification, bk. 2, ch. 2; Concil of Trent, sess. 6, ch. 7) And it differs very little from the doctrine of the Protestants. For in the principal, it is one with it, to wit, in that it holds that a justified person does next and immediatly receive the remission of sins for the merit of Christ imputed. And the smaller difference between the sides, to wit, whether inherent justice may be admitted a part of justification, might be qualified by some such modification as Vega propounds to Calvin (For the Council of Trent, bk. 15, ch. 5), saying, ‘If at all times when one is iustified, he is also sanctified, what offence is it to allow one common word (namely ‘justification’ [citing Beza on Tit. 3:7 &amp; Rom. 8:30]) to express and contain both these parts?’ I am not ignorant that many other Papists admit condonation; but Vasquez charges that opinion with having affinity with ours, and affirms and proves that it is repugnant to the Trident Councel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-white.html">Francis White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Faith &amp; Way to the Church Explaned &amp; Justified in Answer to a Popish Treatise... (London: Field, 1617), pt. 1, ch. 1, Observation 1, ‘Touching remission of sins in justification’, pp. 18-19 White (c. 1564 – 1638) was an Anglican bishop.</cite></span></figcaption>

<blockquote><p>1. Active justification differs from passive justification. In Latin, the nouns ending in –io are generally interpreted in this way [as active and passive]. God justifies and we are justified. 2. Passive justification is later than faith. Passive justification follows after passive faith, because it is through faith that we receive the remission of sins, Act 26:18.</p></blockquote>

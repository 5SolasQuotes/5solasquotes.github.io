</figure><figure class="quote" id="q-4812ca1e72" data-kw="">
<blockquote><p>But it is obvious that it is repugnant, not only to the laws of pious emperors, but also to the law of God and of nature and to every law of nations, that children who are in the power of their parents do or attempt anything of great moment outside the knowledge and will of the parents, much less emancipate themselves completely from the power of their parents and withdraw themselves from their control, as occurs in matrimony.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-b2d8991f58" data-kw="">
<blockquote><p>Here, however, where God compares polygamy with divorce, he says that polygamy is the worse and more detestable crime; for the husband impurely connects himself with another woman, and then, not only deals unfaithfully with his wife to whom he is bound, but also forcibly detains her: thus his crime is doubled. For if he replies and says that he keeps the wife to whom he is bound, he is yet an adulterer as to the second wife: thus he blends, as they say, holy with profane things; and then to adultery and lasciviousness he adds cruelty, for he holds under his authority a miserable woman, who would prefer death to such a condition; for we know what power jealousy has over women. And when any one introduces a harlot, how can a lawful wife bear such an indignity without being miserably tormented?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Malachi</cite>, 2:16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>
<div class="actions"><button class="copy" data-copy="“Here, however, where God compares polygamy with divorce, he says that polygamy is the worse and more detestable crime; for the husband impurely connects himself with another woman, and then, not only deals unfaithfully with his wife to whom he is bound, but also forcibly detains her: thus his crime is doubled. For if he replies and says that he keeps the wife to whom he is bound, he is yet an adulterer as to the second wife: thus he blends, as they say, holy with profane things; and then to adultery and lasciviousness he adds cruelty, for he holds under his authority a miserable woman, who would prefer death to such a condition; for we know what power jealousy has over women. And when any one introduces a harlot, how can a lawful wife bear such an indignity without being miserably tormented?”

</figure><figure class="quote" id="q-fecf99c6a7" data-kw="">
<blockquote><p>The whole case may be cleared in this example: two single persons agree on mariage betwixt themselves, with allowance of parents, and have by virtue of that contract mutual right one in other; yet the laws of the place where they live, having ordered that none shall be held for married persons without certain forms which they appoint, they have not external legal power or liberty one in the other before such rites be performed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr</cite>, [John] Robinson. Or a confirmation of the former in an answer to his manumission (Amsterdam, 1615), pp. 12-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

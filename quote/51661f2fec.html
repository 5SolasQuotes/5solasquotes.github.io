<main class="wrap"><figure class="quote" id="q-51661f2fec" data-kw="">
<blockquote><p>What did John Calvin (1509– 64) know of Thomas Aquinas’s (d. 1274) theology? Did he actually read the Angelic Doctor’s work, or is his knowledge of Aquinas a mediated knowledge? And in the end did he understand what he encountered?… The older scholarship was generally optimistic about Calvin’s firsthand familiarity with Aquinas’s work… I argue that when citing Thomas, Calvin was not engaging Aquinas through a firsthand reading of his work. Rather, he received a mediated knowledge of Thomas from secondary sources. Even more, the evidence suggests that the secondary lens arises from the nominalist school of thought and refracts Thomas’s position in a direction more according to this school, in which human merit plays a stronger role in explaining the doctrine of predestination than Thomas himself believes. In the end, I conclude that Aquinas is of little to no importance to Calvin, with Calvin having very little firsthand knowledge of the Angelic Doctor’s thought.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-raith.html">Charles Raith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Calvin &amp; Aquinas Reconsidered” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), pp. 19-35</cite>, p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>
<div class="actions"><button class="copy" data-copy="“What did John Calvin (1509– 64) know of Thomas Aquinas’s (d. 1274) theology? Did he actually read the Angelic Doctor’s work, or is his knowledge of Aquinas a mediated knowledge? And in the end did he understand what he encountered?… The older scholarship was generally optimistic about Calvin’s firsthand familiarity with Aquinas’s work… I argue that when citing Thomas, Calvin was not engaging Aquinas through a firsthand reading of his work. Rather, he received a mediated knowledge of Thomas from secondary sources. Even more, the evidence suggests that the secondary lens arises from the nominalist school of thought and refracts Thomas’s position in a direction more according to this school, in which human merit plays a stronger role in explaining the doctrine of predestination than Thomas himself believes. In the end, I conclude that Aquinas is of little to no importance to Calvin, with Calvin having very little firsthand knowledge of the Angelic Doctor’s thought.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-00fdb6afba" data-kw="">
<blockquote><p>We call principles those things which are known per se by the light of nature, which are known immediately, and which are unmoved or immutable, such that from them at last definite knowledge arises. From these principles the faculty of reason deduces fixed processes, like rivulets from springs. It compares the principles of nature with the truth of reality or separates them from one another. It joins causes with effects and from these forms conclusions. It decides which things are common and which unique. Finally, it so orders everything that it acquires knowledge of all those things which the reason of a person can trace down and follow.</p></blockquote>

</figure><figure class="quote" id="q-81fb419190" data-kw="">
<blockquote><p>We should not immediately reject a doctrine, or even doubt it, just for the sake of mental exercise… Problem 1. In order to do theology freely and skillfully, should we clear our minds of all preconceptions to the point that we doubt everything we have learned through diligent study, meditation, and the teaching of our instructors, and treat it all as false (even if it is not), until the truth is inscribed anew on our minds like a blank slate, after proper and methodical inquiry and demonstration based on certain principles? Answer: No. The Remonstrants wanted the National Synod to revise the Confession and Catechism, and they wanted the Synod members to be released from affirming the Belgic Catechism and Confession in the meantime, supposedly so they would not be hindered by any preconceptions in perceiving and judging the truth. Therefore, should we have temporarily suspended our agreement with, belief in, and profession of the truths attested by our affirmation (e.g., in articles 1 and 2 of the Confession)? Therefore, should the Reformed Synod have re-examined and investigated the article or thesis ‘That there is a God?’ I ask the same about the truths and theses of natural theology or philosophy concerning God, his attributes and works, providence, the distinction between moral good and evil, the honorable and the base, etc. I ask the same about the basic catechetical elements instilled and proven from God’s word in infancy, childhood, and adolescence, before someone devoted himself to theological studies in an academic program.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation On the Ways of Knowing God’, pt. 2 tr. Michael Lynch (1665; 2024) at Translationes Lyncei</cite></span></figcaption>

<blockquote><p>In chapter 1 we introduced the principle of proportionate causality (PPC), which states that whatever is in an effect must be in its cause, insofar as a cause cannot give what it does not first have. Let’s now examine this principle more carefully. Recall first that, stated more precisely, PPC holds that whatever is in an effect must be in its total cause in some way or other, whether formally, virtually, or eminently… PPC follows straightforwardly from the principle of causality (PC) and the principle of sufficient reason (PSR), both of which have been defended at length in earlier chapters. If there were some aspect of an effect that didn’t come from its total cause, then that would involve a potentiality that was actualized without anything doing the actualizing, which would violate PC. It would be an aspect of the effect that lacked any explanation, which would violate PSR.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Proofs of the Existence of God (Ignatius, 2017) | ch. 6, The Nature of God and of His Relationship to the World</cite>, p. 170</span></figcaption>

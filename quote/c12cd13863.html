<blockquote><p>Query 3. Whether the will of God touching conversion be always accomplished therein?… God may be said to will the conversion of men two ways; either by such a will as is effective, and determinative of the event, or by such as is only virtual, and ordinative of the means tending thereunto: both parts of this distinction are bottomed upon scripture… …[W]herefore, in respect of that ordination, God may be truly said, by a kind of virtual and ordinative will, to will the turning and salvation of all men… 1. God by a virtual or ordinative will does will the turning and salvation of all men within the bosom of the church; for they have Jesus Christ set before their eyes, and what was the true end of Christ’s coming, but to turn every one from his iniquities, (Acts 3:26). They have the gospel preached unto them: there we have God spreading out his hands all the day, standing and knocking at the door of the heart, crying out with redoubled calls, “Turn ye, turn ye, why will ye die?” Wooing and beseeching men, be ye reconciled unto me; making his salvation bringing grace appear unto all men, even to the non-elect themselves… what is the meaning of all this, if God no way will their conversion?… Neither will it salve the business, to say, there is a voluntas signi in all this; for what is voluntas signi, if it be not signum voluntatis? If it be only an outward sign or appearance, and there be no counterpane or prototype thereof, within the divine will, how is it a true sign? which way could it be breathed out from God’s heart?… the true end of his call is their conversion, and that that end is not attained, the only reason lies within themselves, in their own corrupt, unbelieving hearts. Moreover, it is worthy of our consideration, that those scriptures (which the Remonstrants urge, to prove that all the operations of grace, even those in the very elect who actually turn unto God, are resistible) do signally set forth this ordinative will of God… wherefore, this will is God’s ordinative will, imported in the ministry of Christ and the prophets, the proper end and tendency whereof was to gather them into the bosom of his grace… Every ordinance is an ordinance from the will of God; it is an appointment dropped down from heaven; it is divinely destinated eis oikodomen, for edification and not for destruction; it is the place where God records his name… John’s baptism was not a mere external sign or shadow, but imported God’s ordinative counsel to bring men to repentance; it was eis matanoian, to repentance, as its proper end, (Matt. iii. 11). Gospel-preaching is not a mere sound or voice of words, but it importeth God’s ordinative counsel to turn men unto himself… Every ordinance speaks an ordinative counsel for some spiritual end, a serious ordination for the good of souls… but it proves that the proper end and tendency of the means afforded to the Jewish church, was that they might bring forth good fruits to God; and in respect of that ordination, God is said to expect those good fruits from them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-polhill.html">Edward Polhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Divine Will Considered in its Eternal Decrees” in The Works of Edward Polhill</cite>, (Morgan, PA.: Soli Deo Gloria Publications, 1998), pp. 131-32, 164 &amp; 208-10 | ‘Edward Polhill (1622-1694) on Matthew 23:37’</span></figcaption>

9s+heart%3F%E2%80%A6+the+true+end+of+his+call+is+their+conversion%2C+and+that+that+end+is+not+attained%2C+the+only+reason+lies+within+themselves%2C+in+their+own+corrupt%2C+unbelieving+hearts.+Moreover%2C+it+is+worthy+of+our+consideration%2C+that+those+scriptures+%28which+the+Remonstrants+urge%2C+to+prove+that+all+the+operations+of+grace%2C+even+those+in+the+very+elect+who+actually+turn+unto+God%2C+are+resistible%29+do+signally+set+forth+this+ordinative+will+of+God%E2%80%A6+wherefore%2C+this+will+is+God%E2%80%99s+ordinative+will%2C+imported+in+the+ministry+of+Christ+and+the+prophets%2C+the+proper+end+and+tendency+whereof+was+to+gather+them+into+the+bosom+of+his+grace%E2%80%A6+Every+ordinance+is+an+ordinance+from+the+will+of+God%3B+it+is+an+appointment+dropped+down+from+heaven%3B+it+is+divinely+destinated+eis+oikodomen%2C+for+edification+and+not+for+destruction%3B+it+is+the+place+where+God+records+his+name%E2%80%A6+John%E2%80%99s+baptism+was+not+a+mere+external+sign+or+shadow%2C+but+imported+God%E2%80%99s+ordinative+counsel+to+bring+men+to+repentance%3B+it+was+eis+matanoian%2C+to+repentance%2C+as+its+proper+end%2C+%28Matt.+iii.+11%29.+Gospel-preaching+is+not+a+mere+sound+or+voice+of+words%2C+but+it+importeth+God%E2%80%99s+ordinative+counsel+to+turn+men+unto+himself%E2%80%A6+Every+ordinance+speaks+an+ordinative+counsel+for+some+spiritual+end%2C+a+serious+ordination+for+the+good+of+souls%E2%80%A6+but+it+proves+that+the+proper+end+and+tendency+of+the+means+afforded+to+the+Jewish+church%2C+was+that+they+might+bring+forth+good+fruits+to+God%3B+and+in+respect+of+that+ordination%2C+God+is+said+to+expect+those+good+fruits+from+them.%E2%80%9D%0A%0A%E2%80%94+Edward+Polhill%2C+%E2%80%9CThe+Divine+Will+Considered+in+its+Eternal+Decrees%E2%80%9D+in+The+Works+of+Edward+Polhill+%28Morgan%2C+PA.%3A+Soli+Deo+Gloria+Publications%2C+1998%29%2C+pp.+131-32%2C+164+%26+208-10+%7C+%E2%80%98Edward+Polhill+%281622-1694%29+on+Matthew+23%3A37%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc12cd13863.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c12cd13863.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-gods-signified-will-or-will-of-sign/#:~:text=Query%203.%20Whether%20the%20will%20of,expect%20those%20good%20fruits%20from%20them&amp;text=Query%203.%20Whether%20the%20will%20of%20God%20touching&amp;text=said%20to%20expect%20those%20good%20fruits%20from%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bb47c23da1" data-kw="">
<blockquote><p>First, ‘God’ (say they [Arminians]), ‘considering all mankind as fallen from that grace and favor in Adam where they were created, and excluded utterly from the attainment of salvation by virtue of the covenant of works which was at the first made with him, yet by his infinite goodness was inclined to desire the happiness of them all and every one, that they might be delivered from misery and be brought unto Himself, which inclination of his they call his universal love and antecedent will, whereby He would desirously have them all to be saved, out of which love He sends Christ.’ [Owen:] That God has any natural or necessary inclination by his goodness or any other property to do good to us or any of his creatures, we do deny: everything that concerns us is an act of his free will and good pleasure, and not a natural necessary act of his Deity, as shall be declared. Secondly, the ascribing an antecedent conditional will unto God, whose fulfilling and accomplishment should depend on any free contingent act or work of ours, is injurious to his wisdom, power and sovereignty, and cannot well be excused from blasphemy, and is contrary to Rom. 9:19, ‘Who hath resisted his will? I say.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Salus electorum, sanguis Jesu, or the Death of Death in the Death of Christ</cite>, … (London: W.W., 1648), bk. 2, ch. 4, pp. 91-92</span></figcaption>

<blockquote><p>§6. Let no one doubt that the will of God tends toward Himself: 1. Because God, in the genus of being and of goods, is the best and greatest, who adequately and intimately knows Himself as such: which knowledge with consciousness evidently presents to Him as thinking a thing exceedingly pleasing, in which He takes delight and rests—since, seeing that He absolutely possesses every reality, He sees that nothing is lacking to Him which He could desire, and thus He loves Himself, and is conscious to Himself of an acquiescence which expresses the very formal ratio of His blessedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/salomon-van-til.html">Salomon Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Both Theologies, even Natural &amp; Revealed</cite>, … (1703; 1719), 1. Nature of God, subsection 4, ‘On the Will of God’ tr. AI by Roman Prestarri Latin</span></figcaption>

<blockquote><p>[I] This is called his [Greek] (Acts 2:23), Determined purpose, [Greek] (Acts 4:28), The hand and counsel of God; [Greek] (Eph. 1:9), The good pleasure of God and Gods eternal providence. (Now this is called his eternal providence, that it may be distinguished from actual providence, which is nothing else but the execution of God’s decrees.) II. This is called, the Will of God, or The will of his good pleasure. Indeed the decree is the very will of God; yet for our better understanding, the will is considered as the cause efficient, the decree is the effect. Now whereas this word ‘will’ is taken diversely, it is diverse ways distinguished by divines, to wit, into the will of his good pleasure and the will of the sign; into an antecedent and consequent; into absolute, and conditional; into secret and revealed. But these are not real distributions of the divine will, but distinctions only of the name: For to speak properly, there is in God but one only will, which is called the will of his good pleasure, because out of his most free good pleasure He has decreed what shall be done: It is called also his antecedent will because it had existence before any creature and from eternity with God it was established: It is named also absolute, because it depends upon God’s good pleasure and not from the things which are done in time. Lastly it is called secret, because in respect of priority it is known neither to men nor angels. But these things are improperly styled by the name of divine will which are comprehended in that ordinary verse: Praecipit, et prohibet, promittit, consulit, implet: “Commands, forbids, promises, consults, fulfills.</p></blockquote>

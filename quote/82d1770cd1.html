</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-801a501ae6" data-kw="">
<blockquote><p>Here it may be demanded whether it be lawful for Christian men to go into the temples of idols. I answer: they may, if they have a calling so to do, and do not communicate with idolaters in their superstitions, or give any honor to idols: but on the contrary, do openly profess, either by word , or by their deeds, or both, that they abhor both the idols and their service. Thus was Elijah present with the priests of Baal. Thus were the three children present when the golden image was worshipped. Thus was the prophet of God present at the altar of Bethel, when Jeroboam stretched out his hand to offer incense to the idol. (1 Kings 13) Thus Paul was present in Athens, and in the places of idolatry, that he might behold their superstitions. (Acts 17; 27) The Protestant princes in the crowning of Maximilian at Frankfurt brought the Emperor to the Church and to the place whereas he was to sit: this done, they returned without doing any reverence at all, and thereby professed their mislike of popish idols, and their service. It may be objected that the prophet of the Lord prayed in the place where idolatry was exercised: because he prayed at the altar of Bethel, for the restoring of the King’s arm. (1 Kings 13:6) Answer: He did not amiss: For to the clean, all things indifferent are clean : and therefore the place, though polluted with idolatry of others , was clean to the clean prophet. And the Jews were commanded, when they were in the midst of idolatrous nations, to worship God towards the Temple at Jerusalem. (1 Kings 8:48; Dan. 6:10) And God heard his prayer, by miracle restoring the king’s arm: and therefore He approved it. And a prayer made in an idolatrous assembly is no approbation of idolatry, if there be an open profession of the mislike thereof: and the prayer be made upon some necessity, as this of the prophets was, that the king might be convinced of his impiety. It may be objected that the prophet, refusing to eat in the place (1 Kings 13:8), should also have refused to pray there. I answer: No, because God appointed abstinence from meat to be the sign of detestation of the idolatry committed in Bethel, and not abstinence from prayer. And this example of the prophet, does not warrant us to be present at idolatrous service, there to worship the true God, because he did not dissemble, but he openly professed the truth against idolaters. On the contrary, if men resolve not to profess their detestation of idolatrous worship, either by word of mouth, gesture, or some other way; but only desire upon curiosity, to see new fashions, and hereupon, enter into the temples of idols; I think they ought not to do it. For they themselves tempt God by so doing; they offend their weak brethren and draw them by their example to do the like. And lastly, by their presence they confirm the obstinate idolaters in their superstition. The like is to be said of them, that curiously without calling go out of the precincts of the Church into idolatrous countries for this end only to see and to be seen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (London: Legatt, 1626), vol. 1, p. 692</span></figcaption>

ee%20and%20to%20be%20seen&amp;text=Here%20it%20may%20be%20demanded%20whether%20it%20be&amp;text=end%20only%20to%20see%20and%20to%20be%20seen" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Thirdly, it is objected that the humanity of Christ and the picture of Christ crucified may be allowed, not for adoration but in sign of love and commemoration. Answer: First, I answer in the words of the apostle, Gal. 3:1, labour that Jesus Christ may be so pictured by the preaching of the Gospel in the mind that thou maist by the eye of faith behold Him as clearly and more effectually than if he were described in thy sight and crucified before thee: For by faith we behold Him which is invisible, Heb. 11:1, 27. Secondly, I say we be bound to discern between the precious body of the Son of God, and the sinfull carcases of mortal men: for that this is a mystery most admirable that God should be manifested in the flesh, 1 Tim. 3:6, that God and man should be so united together that both natures make but one person: so as albeit death parted the natural soul from the natural body, yet that precious body was still the body of that person which was the Son of God, no way subiect to any change or corruption, Acts 2:27. An image will teach us to disjoin in our minds those holy natures which God has so conjoined as man ought not in the thoughts of his heart to separate them, but ever by spiritual wisdom and faith to distinguish them. Thirdly, I say if no man on the earth can at this day give us the true picture of Christ: then is it intolerable audaciousness for any earthly man to counterfeit falsely his holy parts and members. But no man can give us his just stature, or truly discribe his physiognomy: therefore this ought not to be practiced. And if a man cannot bear to be abused and falsely or untruly resembled and conterfeited by picture: shall we think it none offense to the Son of God? Fourthly, we may reason from the writings of the holy Evangelists, who were appointed and sent from God, purposely to describe the Son of God Jesus Christ: for if they with one consent, deny us any help at all, or any one live concerning the external lineaments, and form of his body: then ought not man to presume to picture Christ after his own invention: but we see clearly how the four Evangelists purposely pass over this matter, the holy Ghost foreseeing the superstition of Antichrist, and how the Popish painted Christs should be worshipped to the great dishonour of our everlasting Lord and Savior Jesus Christ. Fifthly, we may reason against this Popish God on this manner: if that picture of Christ, which was allowed and commanded of God Himself, Num. 21:8; Jn. 3:14, being superstitiously abused, must be burnt to ashes, 2. Kings 18:4, then much more these false pictures of Christ never allowed, but disallowed of God, and most impiously adored of vain men, ought to be rejected with a far greater detestation. If any doubt of the Popish idolatry, to their cross their own book and daily practice in their false Church testify against them. The fourth objection: They say the picture of Christ serves well to confute the old heretics, the Marcionites and Valentinians which denied that Christ had a true, natural, human body. Answer: First, if these and the like heretics believe not the words, nor respect the works of Christ: if they will not believe Moses and the prophets testifying of Christ, with his apostles and evangelists, they will not belieue anyone that shall return from the dead, and much less a dead and painted Christ. The godly emperors Valens and Theodosius made a law that none should make any image of our Sauior Christ: and if any were found, it should be utterly defaced and rejected. Again, Epiphanius rent in pieces the picture of Christ on a cloth, anno 565, because, said he, it was contrary to holy Scripture (Epiphanius, Epistle ad Iohan.; epistle Hierosolymit). Eusebius says that some convents of the gentiles carried about in tables the pictures of Peter and Paul and Christ also, because this was a custom (says he) to remember their patrons and benefactors (Eusebius, lib. confes. ch. 36). Their very words are these: ‘As our care is, in and by all means to maintain the religion of the most high God: so permit we none to portrait, engrave, or picture, in colors, stone or any other matter whatsoever, the image of our Savior: moreover we command that wheresoever such an image can be found, it be taken away, and all those to be chastised with most grievous punishment that attempt anything against our command.’ (Petr. Crinitus, bk. 9, de honest. discipl)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-holland.html">Henry Holland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of Adam, or the Fourfold State of Man, well formed in his Creation, Deformed in his Corruption, Reformed in Grace &amp; Perfected in Glory</cite>, (London: Thomas Man, 1606), On the 2nd Commandment, Question 79, pp. 42-43 Holland was a London minister.</span></figcaption>

used+and+falsely+or+untruly+resembled+and+conterfeited+by+picture%3A+shall+we+think+it+none+offense+to+the+Son+of+God%3F+Fourthly%2C+we+may+reason+from+the+writings+of+the+holy+Evangelists%2C+who+were+appointed+and+sent+from+God%2C+purposely+to+describe+the+Son+of+God+Jesus+Christ%3A+for+if+they+with+one+consent%2C+deny+us+any+help+at+all%2C+or+any+one+live+concerning+the+external+lineaments%2C+and+form+of+his+body%3A+then+ought+not+man+to+presume+to+picture+Christ+after+his+own+invention%3A+but+we+see+clearly+how+the+four+Evangelists+purposely+pass+over+this+matter%2C+the+holy+Ghost+foreseeing+the+superstition+of+Antichrist%2C+and+how+the+Popish+painted+Christs+should+be+worshipped+to+the+great+dishonour+of+our+everlasting+Lord+and+Savior+Jesus+Christ.+Fifthly%2C+we+may+reason+against+this+Popish+God+on+this+manner%3A+if+that+picture+of+Christ%2C+which+was+allowed+and+commanded+of+God+Himself%2C+Num.+21%3A8%3B+Jn.+3%3A14%2C+being+superstitiously+abused%2C+must+be+burnt+to+ashes%2C+2.+Kings+18%3A4%2C+then+much+more+these+false+pictures+of+Christ+never+allowed%2C+but+disallowed+of+God%2C+and+most+impiously+adored+of+vain+men%2C+ought+to+be+rejected+with+a+far+greater+detestation.+If+any+doubt+of+the+Popish+idolatry%2C+to+their+cross+their+own+book+and+daily+practice+in+their+false+Church+testify+against+them.+The+fourth+objection%3A+They+say+the+picture+of+Christ+serves+well+to+confute+the+old+heretics%2C+the+Marcionites+and+Valentinians+which+denied+that+Christ+had+a+true%2C+natural%2C+human+body.+Answer%3A+First%2C+if+these+and+the+like+heretics+believe+not+the+words%2C+nor+respect+the+works+of+Christ%3A+if+they+will+not+believe+Moses+and+the+prophets+testifying+of+Christ%2C+with+his+apostles+and+evangelists%2C+they+will+not+belieue+anyone+that+shall+return+from+the+dead%2C+and+much+less+a+dead+and+painted+Christ.+The+godly+emperors+Valens+and+Theodosius+made+a+law+that+none+should+make+any+image+of+our+Sauior+Christ%3A+and+if+any+were+found%2C+it+should+be+utterly+defaced+and+rejected.+Again%2C+Epiphanius+rent+in+pieces+the+picture+of+Christ+on+a+cloth%2C+anno+565%2C+because%2C+said+he%2C+it+was+contrary+to+holy+Scripture+%28Epiphanius%2C+Epistle+ad+Iohan.%3B+epistle+Hierosolymit%29.+Eusebius+says+that+some+convents+of+the+gentiles+carried+about+in+tables+the+pictures+of+Peter+and+Paul+and+Christ+also%2C+because+this+was+a+custom+%28says+he%29+to+remember+their+patrons+and+benefactors+%28Eusebius%2C+lib.+confes.+ch.+36%29.+Their+very+words+are+these%3A+%E2%80%98As+our+care+is%2C+in+and+by+all+means+to+maintain+the+religion+of+the+most+high+God%3A+so+permit+we+none+to+portrait%2C+engrave%2C+or+picture%2C+in+colors%2C+stone+or+any+other+matter+whatsoever%2C+the+image+of+our+Savior%3A+moreover+we+command+that+wheresoever+such+an+image+can+be+found%2C+it+be+taken+away%2C+and+all+those+to+be+chastised+with+most+grievous+punishment+that+attempt+anything+against+our+command.%E2%80%99+%28Petr.+Crinitus%2C+bk.+9%2C+de+honest.+discipl%29%E2%80%9D%0A%0A%E2%80%94+Henry+Holland%2C+The+History+of+Adam%2C+or+the+Fourfold+State+of+Man%2C+well+formed+in+his+Creation%2C+Deformed+in+his+Corruption%2C+Reformed+in+Grace+%26+Perfected+in+Glory+%28London%3A+Thomas+Man%2C+1606%29%2C+On+the+2nd+Commandment%2C+Question+79%2C+pp.+42-43+Holland+was+a+London+minister.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe5ece47dd5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e5ece47dd5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/images-of-christ/#:~:text=Thirdly%2C%20it%20is%20objected%20that%20the,Crinitus%2C%20bk.%209%2C%20de%20honest.%20discipl&amp;text=Thirdly%2C%20it%20is%20objected%20that%20the%20humanity%20of&amp;text=command.%E2%80%99%20%28Petr.%20Crinitus%2C%20bk.%209%2C%20de%20honest.%20discipl" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e26adb4488" data-kw="">
<blockquote><p>Again if by this phrase he [the opponent] mean that a purposed observation of an outward act, with an aim and reference to such a thing, is of necessity required to make up a ceremony or a ceremonious action, in worship or otherwise, it is a miserable mistake: Instance thus: A carnal protestant presents himself amongst such as are at mass, he professes to his companions, before he goes in, and does in the purpose of his heart seriously loath the pix and idol there, yet when it’s lifted up, he bows as others do: Let any man in reason tell me, did he not use or abuse rather a divine ceremony in that bowing or no? If the Rejoinder say yes, as he must, unless he will speak against all reason and truth: I then reply upon his own grounds: That outward action which is not purposely referred, that is not a ceremony; but this action is not purposely observed with any aim to that end for the party intended no such thing, purposed no such matter, but did it as a thing of-course, as a man should bow his knee for exercise when he is alone. 2. Peter withdrawing himself from the gentiles at the coming of the Jews, he did not purposely this, with reference to any Judaical seperation, as judging any legal pollution in joining with the gentiles, or holiness in parting from them, and therfore he did not practice any Jewish ceremony, according to the Rejoinder’s conceit, but directly contrary to the text: there is no end of these absurdities.</p></blockquote>

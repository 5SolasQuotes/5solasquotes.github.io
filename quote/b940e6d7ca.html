<main class="wrap"><figure class="quote" id="q-b940e6d7ca" data-kw="">
<blockquote><p>The Lord’s decree is the first rise of all things that are, or have been, or are to come. This is the first original of them all, to which they must be reduced as their spring and fountain. All of you may understand that there are many things possible, which yet actually will never be. The Lord’s power and omnipotency is of a further extent than his decree and purpose. His power is natural and essential to his being; his decree is of choice, and voluntary. The Father could have sent a legion of angels to have delivered his Son; the Son could have asked them, but neither of them would do it, Matt. xxvi. 53. The Lord could have raised up children to Abraham out of stones, but he would not, Matt. iii. 9.

His power then comprehends within its reach all possible things which do not in their own nature and proper conception imply a contradiction; so that infinite worlds of creatures more perfect than this, – numbers of angels and men above these, – and creatures in glory surpassing them again, – are within the compass of the boundless power and omnipotency of God. But yet for all this it might have fallen out that nothing should actually and really have been, unless his majesty had of his own free will decreed what is, or hath been, or is to be. His will determines his power, and, as it were, puts it in the nearest capacity to act and exercise itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of the Christian Religion, Clearly Proved, and Singularly Improved. Or, A Practical Catechism</cite>, (1672) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), i, 159.</span></figcaption>

<blockquote><p>Thirdly, [God is] without passions too; that is, not subject to, nor capable of love, hatred, joy, grief, anger, and the like, as they daily arise in us imperfect creatures; but he is always the same unmovable, unchangeable, impassible God: and therefore in all our contemplations of the Divine essence, we are not to conceive him as one passionately rejoicing or grieving for any thing, as we do, but as a pure and perfect essence, without body, parts, and passions too; as appears from scripture, reason, and fathers.

… we must conclude him to be without passions too, as well as parts; for if he be such a pure essence, yea, essence itself, it is impossible he should be subject to any passions. But this, that he is without passions, appears more clearly from these words, God is not a man, that he should lie, nor the son of man that he should repent, Num. xxiii. 19. But most clearly of all in that Paul and Barnabas, to convince the people at Lystra that they were not Gods, but men, tell them, they were men of like passions, or subject to passions, as well as they, Acts xiv. 14. And St. James useth the same argument to prove that Elias was a man too, James v. 17. Now had God been subject to passions, as well as men, the apostles would have been much overseen in their logics, using an argument that would make as much against them as for them. …

And that God is without passions, is also as clear as that he is without body and parts: for passion in its proper notion and notation implies suffering, which it is impossible for God, who is a most pure act, to be subject to. Again, in every passion, there is a motion or change in the subject wherein it is; and therefore also it is called a passion, because the subject suffers some change by it, sometimes loving, then hating, now rejoicing, then grieving, and the like; so that there is some change in the subject, from what it was before.

But now it is impossible there should be any such motion or change in God; for inconstancy and mutability are imperfections, and therefore not to be admitted into the notion of a Deity. And further, if God should be moved or changed, it must be either from better to worse, from worse to better, or from equal to equal. From better to worse he cannot be changed, for then he would be corrupted, and want some perfection after his change, which he had before, and so cease to be the chiefest good, and by consequence God; which we have before shewed he cannot, being in and of himself eternal.

From worse to better if he should change, before his change he was not God, because he wanted some perfection or degree of goodness, which he hath after: after his change he would not be God, because he had a beginning, and so not eternal. From equal to equal also he cannot change, for then too he would not be God absolutely perfect, wanting some perfection before his change, which he had after, and some perfection after his change, which he had before.

And lastly, if God should be moved, or changed, and by consequence be in passion any way, it must be either from something without him, or from something within him: from any thing without him, it cannot be; for he is the First Cause, and so the first mover, by whom all other things are moved, and therefore who cannot be moved by any thing: from within he cannot be moved, for he hath not any parts, (as I have shewn,) whereof one can be the thing moving, and the other the thing moved, being in and of himself a most pure and simple act. And therefore we cannot but conclude from reason also, that God is without body, parts, and passions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-beveridge.html">William Beveridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII</cite>, in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 26, 27-28, 30-31.</span></figcaption>

</figure><figure class="quote" id="q-23f7665f4c" data-kw="">
<blockquote><p>But thus they [medieval scholastics] expound themselves, that God works, decrees and wills the deformity that is found in the sins of commission, not by his antecedent will, whereby He works things out of his own liking, but by his consequent and conditional will, whereby presupposing the purpose of suffering his creature to avert and turn from Him, He still intends to move, impel and carry them forward, though being by their own fault out of the way, He carries them thither whither they should not go: first, say they, by substraction of grace, upon the withdrawing whereof He saw the creature would turn from Him, He purposed to suffer the sin of aversion or omission to enter: secondly, this purpose being presupposed, and foreseeing that which would follow upon it in his consequent and conditional will, He positively decreed the other, which is of commission. Man by creation was made to seek an infinite good, and love it infinitely; which if he omit to seek in God, then must he needs commit the contrary and seek it in himself: for so God decreed that man not continuing to adhere unto Him, should fall into self-love, pride and all evils of that kind. All this might be borne withal, save only they make deformity of the essence of an action, which cannot be borne withal…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-99fc4e9c2d" data-kw="">
<blockquote><p>He [John Robinson, a separatist] excepts against baptizing of all infants born in the [Anglican] parish. But (to abstain from by-controversies) it shall suffice for that, that other Churches do extend the use of that sacrament to as great largeness as England does, with whom not withstanding Mr. Robinson wil not deny all communion-public.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr</cite>, [John] Robinson. Or a confirmation of the former in an answer to his manumission (Amsterdam, 1615), p. 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5fe0fc1c30" data-kw="">
<blockquote><p>As for infants, their case is of a peculiar consideration, God by his Spirit supplying what is wanting [lacking] through the imbecility of their age; and hence the Spirit working semen fidei [a seed of faith], and apprehending them, though they cannot apprehend Christ; I question not their union to Christ, and the imputation of his righteousnesse to their justification; but we speak now de adultis [of adults], that none that are of years sufficient are justified without actual faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-warren.html">Thomas Warren</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Unbelievers No Subjects of Justification</cite>, … (London: Browne, 1654), p. 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-da3711feeb" data-kw="">
<blockquote><p>V. Those parishioners that desire us to baptize their children, or to be themselves admitted to the Lord’s Supper, and are not members of this church (because they will not), we desire to come to us, some days before that so we may be satisfied of their faith and life: And if they seem true Christians, and either bring a certificate that they are members of any other church, with (which we are to hold communion, or show that it is not from ungodliness that they refuse to live under order and discipline, we shall baptize their children, and occasionally admit them to our communion. But if they are scandalous, we shall require them first to profess their serious repentance: And if they return to scandal, we shall after stay till we see their reformation (or of one of the parents in case of baptism).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Religion expressed: I, briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II, more largely in a Profession taken out of the Holy Scriptures, containing 1, the articles of the Christian Belief</cite>, The Christian Religion expressed: I, briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II, more largely in a Profession taken out of the Holy Scriptures, containing 1, the articles of the Christian Belief, 2, our consent to the Gospel Covenant, 3, the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660), The Order &amp; Discipline of this Church, agreeable to the Word of God</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>
<div class="actions"><button class="copy" data-copy="“V. Those parishioners that desire us to baptize their children, or to be themselves admitted to the Lord’s Supper, and are not members of this church (because they will not), we desire to come to us, some days before that so we may be satisfied of their faith and life: And if they seem true Christians, and either bring a certificate that they are members of any other church, with (which we are to hold communion, or show that it is not from ungodliness that they refuse to live under order and discipline, we shall baptize their children, and occasionally admit them to our communion. But if they are scandalous, we shall require them first to profess their serious repentance: And if they return to scandal, we shall after stay till we see their reformation (or of one of the parents in case of baptism).”

ction+of+the+ignorant%2C+the+promoting+of+holiness%2C+and+the+charitable+concord+of+all+true+believers%E2%80%A6+%28London%3A+1660%29%2C+The+Order+%26+Discipline+of+this+Church%2C+agreeable+to+the+Word+of+God&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fda3711feeb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/da3711feeb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/baptism/the-baptism-of-the-children-of-adherents/#:~:text=V.%20Those%20parishioners%20that%20desire%20us,the%20parents%20in%20case%20of%20baptism&amp;text=V.%20Those%20parishioners%20that%20desire%20us%20to%20baptize&amp;text=one%20of%20the%20parents%20in%20case%20of%20baptism" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-576f4001d4" data-kw="">
<blockquote><p>However, we do not therefore exclude form the fellowship of this sacrament those children who were born of Christian stock and baptized parents–even though their own parents through their wicked lives or impure faith cause the efficacy of the covenant sealed in their own baptism to be ineffective for themselves–if those same parents or the relatives who have authority over them present them for baptism according to the customary order in our churches. For in the new covenant the son does not bear the iniquity of the father, and of such children God remains God just the same, as He Himself bears witness in Ezekiel 16 and 23. There He calls the children of the godless Israelites his own sons, whom they had begotten for God, although they were sacrificing them to Molech. And it is from these children that God also normally gathers his church through the ordinary preaching of the Word. And for this reason he also commanded the children of such Israelites (of whom many had died in their ungodliness) to be circumcised, no less than those of the godly ones (Joshua 5:4 and 6)–which necessary deed also the Israelite and the early Christian church always have considered beyond debate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Anthony Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, (Brill, 2020), vol. 3, Disputation 44, ‘On the Sacrament of Baptism’, section 50, p. 167</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<blockquote><p>11. ‘Then Zipporah tooke a sharpe knife and cut away the foreskin of her son.’ The two things that here might be considered (namely, that doctrine of Popery concerning the danger of children dying unbaptized, and secondly of such an absolute necessity of baptism, as that women must administer it in time of supposed need) I forbear to stand upon now: I have sufficiently touched them in my Notes upon Genesis. Therefore do but remember with yourself (touching the first) that we make a great difference betwixt want [lack] of the sacrament and contempt of the same; contempt, damning; and want, not, through the strength of God’s promise; meaning, by want, when God so prevents by death, that it cannot be had, according to the manner allowed in the Word. And, touching the second, observe, that this act of Zipporah, here, in circumcizing her child, was merely extraordinary, and does no way warrant women to baptize now-a-days.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Comfortable Notes upon the Books of Exodus &amp; Leviticus</cite>, … (London, 1604), on Exodus, ch. 4, p. 60</span></figcaption>

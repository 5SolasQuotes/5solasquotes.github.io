<main class="wrap"><figure class="quote" id="q-009dfdc701" data-kw="">
<blockquote><p>The gospel is the means that the Holy Spirit employs for communicating the grace of Christ to elect sinners in order to produce that change of their state and of their nature to which they have been chosen. It is by means of the gospel that, in the moment of regeneration, the Spirit of Christ and His grace enter and take possession of the hearts of God’s elect. Sinners who are born again are born “not of corruptible seed, but of incorruptible, by the word of God, which liveth and abideth for ever” (1 Peter 1:23). Hence, the psalmist, directing his speech to the Messiah, says, “The LORD shall send the rod of thy strength out of Zion: rule thou in the midst of thine enemies. Thy people shall be willing in the day of thy power” (Ps. 110:2–3). The gospel, accordingly, is called “the spirit [which] giveth life” (2 Cor. 3:6); “the grace of God that bringeth salvation” (Titus 2:11); and “the power of God unto salvation” (Rom. 1:16). By the gospel, God exerts the exceeding greatness of His power in quickening and converting sinners to Himself. It is by means of it that He enlightens their “minds, renews their wills, rectifies and sanctifies their affections, and so makes them partakers of a new and holy nature. Hence, the apostle Paul styles it “the law of the Spirit of life in Christ Jesus,” which made him “free from the law of sin and death” (Rom. 8:2).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 109-110.</span></figcaption>

<blockquote><p>Abraham Kuyper and Herman Bavinck brought this older discussion into the center of a much larger argument. Topics once dispersed across providence, pagan virtue, natural law, and the Spirit’s nonsaving operations became materials for interpreting cultural history, science, and public institutions. Their achievement was not to discover useful gifts among unbelievers but to ask what those gifts meant for the development of civilization and Christian participation in it. That change of scale is the problem of this essay. The older Reformed writers offered more than scattered anticipations of neo-Calvinism; Kuyper and Bavinck offered more than a new vocabulary for old conclusions. The history requires us to distinguish inheritance from reconstruction, and theological recognition from political authorization.</p></blockquote>

<blockquote><p>The Calvinist, on the contrary [to Arminianism], holds that the unregenerate man never ceases to resist and never yields to God of his own motion, but only as he is acted upon by the Holy Spirit and is thereby ‘persuaded and enabled’ to cease resisting and to yield obedience. Ceasing to resist God, he [the Calvinist] contends, is holy action, and so is yielding or submitting to God. To refer this kind of action to the sinful and unregenerate will as its author [as the Arminian does], the Calvinist asserts [this] is contrary to the Scripture declaration, that ‘the carnal mind is enmity against God, and is not subject to the law of God, neither indeed can be,’ Rom. 8:7. A will at enmity with God never of itself ceases resisting Him, and never of itself yields to Him. It must be changed from enmity into love by ‘the washing of regeneration and renewing of the Holy Ghost’ in order to sweet and gentle submission. The sinner, as such, cannot, therefore, assist and co-operate with the Holy Spirit in this work of originating faith and repentance, but the whole of it must be done by that Almighty Agent who can turn the human heart as the rivers of water. Christ, through the Spirit, is the sole ‘author of faith’ (Heb. 12:2). When the Holy Spirit puts forth a higher degree of his energy than He exerts in his ordinary operation, He overcomes and stops the sinner’s resistance instead of the sinner’s overcoming and stopping it of himself, and [the Holy Spirit] inclines the sinner to yield to the Divine monitions [admonitions] and impulse instead of the sinner’s yielding of his own accord [as the Arminian says]. If the sinner’s resistance is ‘overcome’, it is overcome by God’s action [according to the Calvinist]; but if it ‘ceases’, it ceases by the sinner’s action [by his own power, according to the Arminian]. To say that common grace [in the sincere strivings of the Spirit] would [hypothetically] succeed [in salvation] if it were not resisted by man, is not the same as saying that common grace would succeed if it were yielded to by man[‘s independent power, as in Arminianism]. [Hypothetical] Non-resistance is different from ceasing resistance [of the Arminian]. In the former [hypothetical] instance there is no opposition by the man [and thus the common, gracious striving of the Spirit in the gospel call would result in saving grace]; in the latter there is opposition, which is put a stop to by the man[‘s independent power, on the Arminian view]. … According to the monergistic [God alone working] or Calvinistic view of grace, on the contrary [to Arminianism], no man receives a grace that is ‘sufficient for generating faith’ who does not receive such a measure of Divine influence as overcomes his hostile will; so that he does not stop his own resistance but it stopped by the mercy and power of God; so that his faith and repentance are not the result in part of his own efficiency, but solely of the Holy Spirit’s irresistible and sovereign energy in regeneration. In a word, the dependence upon Divine grace in the Calvinistic system [in being saved] is total; in the Arminian is partial. In the former, common grace cannot be made saving grace by the sinner’s co-action; in the latter it can be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed</cite>, (NY: 1893), ch. 9, pp. 100-103</span></figcaption>

come%E2%80%99%2C+it+is+overcome+by+God%E2%80%99s+action+%5Baccording+to+the+Calvinist%5D%3B+but+if+it+%E2%80%98ceases%E2%80%99%2C+it+ceases+by+the+sinner%E2%80%99s+action+%5Bby+his+own+power%2C+according+to+the+Arminian%5D.+To+say+that+common+grace+%5Bin+the+sincere+strivings+of+the+Spirit%5D+would+%5Bhypothetically%5D+succeed+%5Bin+salvation%5D+if+it+were+not+resisted+by+man%2C+is+not+the+same+as+saying+that+common+grace+would+succeed+if+it+were+yielded+to+by+man%5B%E2%80%98s+independent+power%2C+as+in+Arminianism%5D.+%5BHypothetical%5D+Non-resistance+is+different+from+ceasing+resistance+%5Bof+the+Arminian%5D.+In+the+former+%5Bhypothetical%5D+instance+there+is+no+opposition+by+the+man+%5Band+thus+the+common%2C+gracious+striving+of+the+Spirit+in+the+gospel+call+would+result+in+saving+grace%5D%3B+in+the+latter+there+is+opposition%2C+which+is+put+a+stop+to+by+the+man%5B%E2%80%98s+independent+power%2C+on+the+Arminian+view%5D.+%E2%80%A6+According+to+the+monergistic+%5BGod+alone+working%5D+or+Calvinistic+view+of+grace%2C+on+the+contrary+%5Bto+Arminianism%5D%2C+no+man+receives+a+grace+that+is+%E2%80%98sufficient+for+generating+faith%E2%80%99+who+does+not+receive+such+a+measure+of+Divine+influence+as+overcomes+his+hostile+will%3B+so+that+he+does+not+stop+his+own+resistance+but+it+stopped+by+the+mercy+and+power+of+God%3B+so+that+his+faith+and+repentance+are+not+the+result+in+part+of+his+own+efficiency%2C+but+solely+of+the+Holy+Spirit%E2%80%99s+irresistible+and+sovereign+energy+in+regeneration.+In+a+word%2C+the+dependence+upon+Divine+grace+in+the+Calvinistic+system+%5Bin+being+saved%5D+is+total%3B+in+the+Arminian+is+partial.+In+the+former%2C+common+grace+cannot+be+made+saving+grace+by+the+sinner%E2%80%99s+co-action%3B+in+the+latter+it+can+be.%E2%80%9D%0A%0A%E2%80%94+William+G.T.+Shedd%2C+Calvinism%3A+Pure+%26+Mixed+%28NY%3A+1893%29%2C+ch.+9%2C+pp.+100-103&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3e8bc84111.html&amp;via=5Solas" target="_blank" rel="noopener">Sha <blockquote><p>Why, this is it that Christ offers, no less than Himself, to be thine forever. This is it which He offers when He stands and knocks at thy heart: ‘Open to me; I will be thy God, the Lord thy Redeemer. Though thou hast rebelled against Me, and followed after strange gods, yet now renounce those idols; Open to me, I will be thy God, and that by covenant more durable than heaven and earth.’ ‘Open to me, thy Redeemer will be thy husband. Though thou hast played the harlot with many lovers… I will marry thee to Myself in an everlasting covenant that shall never be broken; I will rejoice over thee as a bridegroom over his bride.’ ‘Open to me, I will make over no less than Myself unto thee. Thou shalt have that which it is the glory and happiness of Heaven to have, myself, communion with Me; I will come and sup with thee, and thou with Me. Art thou poor? Open to Me;’ The commander of Heaven and earth will be thine to enrich thee… Thus Christ offers Himself; and oh how wonderful is it, that He should come to vile worms, and knock, and wait, and entreat that Himself may be accepted!</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Why, this is it that Christ offers, no less than Himself, to be thine forever. This is it which He offers when He stands and knocks at thy heart: ‘Open to me; I will be thy God, the Lord thy Redeemer. Though thou hast rebelled against Me, and followed after strange gods, yet now renounce those idols; Open to me, I will be thy God, and that by covenant more durable than heaven and earth.’ ‘Open to me, thy Redeemer will be thy husband. Though thou hast played the harlot with many lovers… I will marry thee to Myself in an everlasting covenant that shall never be broken; I will rejoice over thee as a bridegroom over his bride.’ ‘Open to me, I will make over no less than Myself unto thee. Thou shalt have that which it is the glory and happiness of Heaven to have, myself, communion with Me; I will come and sup with thee, and thou with Me. Art thou poor? Open to Me;’ The commander of Heaven and earth will be thine to enrich thee… Thus Christ offers Himself; and oh how wonderful is it, that He should come to vile worms, and knock, and wait, and entreat that Himself may be accepted!”

<blockquote><p>55. Nor can it [unregenerate choice] apprehend offered grace, unless it first receives through regeneration the faculty of apprehending. 56. In receiving this faculty of apprehending grace and assenting to the promise, it conducts itself merely passively, because then the choice is only the subject in which God works, in which he imprints new qualities and inclinations (Ezk. 11:19; 36:26; Eccl. 17:14; Job 33:3-6; Jn. 1:13). 57. But in the very apprehension of grace, or the act of apprehending, it conducts itself both passively and actively; for the choice acts, but having been acted upon by the Holy Spirit (Ezk. 36:27). 58. For one thing is δύναμις, the faculty of apprehending; another is ἐνέργεια, the act of apprehending or the apprehension itself. 59. After the choice has been regenerated, it indeed wills and does good, and perseveres in it, but only insofar as God effects and confirms these things in it (Phil. 1:6, 2:13; 1 Cor. 4:7; Jn. 15:5; 1 Cor. 12:3, 1:8).</p></blockquote>

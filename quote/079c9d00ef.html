<main class="wrap"><figure class="quote" id="q-079c9d00ef" data-kw="">
<blockquote><p>The Jewish way under the law of praising the Lord was upon the timbrel, the harp, psaltery, and ten-stringed instruments, and other instruments of music that belonged to ceremonial worship that is now abolished. Christ, who is the end of the law, has torn or taken away the ceremonies of the law, and there is no warrant now to make use of the organs, as they do in the Popish Church, and in the Prelatical Church of England, and even among them that are more reformed, those over in Holland. Oh, but we have a great advantage in being free of these! But there are some in the other extreme, that are for no music at all, but we are to sing and praise vocally, and with the heart too. This reproves Quakers, who make a mock at singing of psalms. But we will let them see a fine ancient warrant for vocal music. “And be not drunk with wine… speaking to yourselves in psalms, hymns, and spiritual songs, making melody in your hearts to the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cameron.html">Richard Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Lecture 2’ on Ps. 92</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6ceaa3133c" data-kw="">
<blockquote><p>Objection: These gracious effects and fruits of singing Psalms, do plead as much for singing and playing with instruments, as for singing with voices. Answer 1: This last effect of singing to the glory of God with our glory is peculiar only to singing with our tongues. Answer 2: Suppose it were true that these effects of singing Psalms did plead as much for singing and playing with instruments, as singing with voices; yet evident it is that singing with voices had the preeminence, as that which uttering the Word of God did chiefly utter the Spirit of God breathing in it. And withal evident likewise it is that it is no impeachment to an ordinance that the outward dispensing of it may be performed by Nature and Art; but notwithstanding that it may be accompanied of God with a spiritual blessing. Answer 3: Singing with instruments was typical, and so a ceremonial worship and therefore is ceased. But singing with heart and voice is a moral worship such as it written in the hearts of all men by Nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Singing of Psalms: a Gospel Ordinance</cite>, p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><figure class="quote" id="q-b43667675b" data-kw="">
<blockquote><p>5. It is observed, that David’s psalms were sung formerly with musical instruments, as the harp, timbrel, and cymbal, and organs; and why not with these now? If these are to be disused, why not singing itself? I answer, these are not essential to singing, and so may be laid aside, and that continue; it was usual to burn incense at the time of prayer, typical of Christ’s mediation, and of the acceptance of prayer through it; that is now disused; but prayer being a moral duty, still remains: the above instruments were used only when the church was in its infant-state, and what is showy, gaudy, and pompous, are pleasing to children; and as an ancient writer observes, “these were fit for babes, but in the churches (under the gospel-dispensation, which is more manly) the use of these, fit for babes, is taken away, and bare or plain singing is left.” As for organs… were first introduced by a pope of Rome, Vitalianus, and that in the seventh century, and not before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Body of Doctrinal &amp; Practical Divinity</cite>, vol. 3, ‘Of Singing Psalms As A Part of Public Worship’ (London, 1796), p. 384</span></figcaption>

that%20in%20the%20seventh%20century%2C%20and%20not%20before" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>II. A Voluntate Dei, ‘from the will of God’. This is the other reason: ‘For the Father seeks such to worship Him.’ [Jn. 4:23] God requires such worship and worshippers. The foundation of this reason is this: The rule of worship is not mans fancy, but God’s will: Men’s fancies and wills are infinitely various, and therefore those that have gone that way, have been divided into a thousand varieties; they worship they know not what, as v. 22. Only God’s will is the stable rule: None knows the mind of God but the Spirit of God: Now this is the worship God requires in Gospel times. Argument Second: From the end [design] of worship. Look what the ends of worship are, such must the worship be: And that was the reason why the Jewish worship was so much typical, because the end of it was to represent Christ; And that end being now attained, and Christ exhibited [revealed], we must consider what were and are the further ends of worship. Now the ends are of two sorts.

1. In reference to God.

2. In reference to men. And both will show us that the worship must be spiritual.

I. In relation to God; so it is double:

      1. To please God: this is finis operis &amp; operantis too [‘the end of the work, and of working’], (if a man be sincere) Ps. 19:14, ‘Let the words of my mouth and the meditation of my heart be acceptable in thy sight.’ Now it is only spiritual worship that can please God: That man does but little consider the nature of God, that thinks God is pleased with the bowing of the knee to an altar, no, it is the bending of the heart that God respects. It is not an organ in a church, but the organ of a gracious heart, and melody in the heart that pleases God.

      2. To exalt God amongst men, to render Him glorious in the eyes of the world: Now how is that done? Do you think that it makes God glorious, when men seek to honor Him with bodily and external services? No, you cannot dishonor God more than by giving Him such a worship as begets a carnal representation of God, etc. And when God would set Himself forth in his glory, He represents Himself in a spiritual manner, and He takes them off from all corporeal thoughts and fancies: ‘God is a Spirit.’ ‘To whom will you liken Me?’ ‘You saw no shape.’ ‘God dwells not in temples made with hands.’

II. In reference to men; so the ends of worship are purely spiritual: such as these (for I can but name them) the elevation of the soul to God, and its assimilation to Him, the union of man with his Creator, the supply of the soul’s spiritual necessities, and the conduct of a sinner to glory, and all these are spiritual works, and to be done by spiritual helps, and therefore evangelical worship must be spiritual worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evangelical Worship is Spiritual Worship as it was Discussed in a Sermon</cite>, (1660), pp. 13-14 Poole was an English puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

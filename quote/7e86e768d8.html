<main class="wrap"><figure class="quote" id="q-7e86e768d8" data-kw="">
<blockquote><p>In his book, English Popish Ceremonies, George Gillespie points out that the English Puritans and the Scottish Covenanters were not the only people in the Reformed world who opposed the religious observance of extra-biblical festivals (holy days were called holidays in Gillespie’s time):

As touching the judgment of divines, we say 1. Many divines disallow of festival days, and wish the church, were free of them. For the Belgic churches, in their synod, anno 1578, wished that the six days might be wrought upon, and that the Lord’s day alone might be celebrated. And Luther in his book, de Bonis Operibus, wished that there were no feast-days among Christians but the Lord’s day. […] The old Waldenses also, whose doctrine was restored and propagated by John Huss, and Jerome of Prague, after Wicklif, and that with the congratulation of the church of Constantinople, held, that they were to rest from labour upon no day but upon the Lord’s day, whereby it appeareth that holidays have had adversaries before us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dispute against the English Popish ceremonies obtruded on the Church of Scotland</cite>, (1637; Edinburgh, 1844), p. 22.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f2b19ab676" data-kw="">
<blockquote><p>After affirming belief in the sufficiency of scripture for the doctrine and worship of the church in its First Head (“Of Doctrine”), the First Book of Discipline of the Church of Scotland (1560) called for all extra-biblical holy days to be abolished:

In which Books of Auld and New Testaments we affirm, that all things necessary for the instruction of the Kirk, and to make the man of God perfect, is contained and sufficiently expressed.

By the contrary Doctrine, we understand whatsoever men, by Laws, Counsels, or Constitutions have imposed upon the consciences of men, without the expressed commandment of God’s word; such as be [the] vows of chastity, forswearing of marriage, binding of men and women to several disguised apparels, to the superstitious observation of fasting days, difference of meat for conscience sake, prayer for the dead; and keeping of holy days of certain Sanctis commandit by man, such as be all those that the Papists have invented, as the Feasts (as they term them) of Apostles, Martyrs, Virgins, of Christmas, Circumcision, Epiphany, Purification, and other fond feasts of our Lady. Which things, because in God’s Scriptures they neither have commandment nor assurance, we judge them utterly to be abolished from this Realm; affirming farther, that the obstinate maintainers and teachers of such abominations ought not to escape the punishment of the Civil Magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/first-scottish-book-of-discipline.html">First Scottish Book of Discipline</a></span><span class="wk"><span class="lbl">Work:</span> <cite>repr in The works of John Knox, ed. David Laing</cite>, (6 vols, Edinburgh, 1856), ii, 185-6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

</figure><figure class="quote" id="q-a14e2c5337" data-kw="">
<blockquote><p>Concerning the distinction or difference of days, we say that it is a beastly superstition to esteem one day more holy than another, or to think that abstaining from work were a thing of itself that pleases God. Notwithstanding among the seven days we observe and keep one, according to the commandment of God, for to bestow it to hear the Word of God in the congregation, and principally to dedicate and give ourselves to learn and understand our duties towards God, and towards our neighbors. Thus we spend the Sunday. And concerning other festival days, we have put away as many as is possible for us: knowing the abuse that has come thereby, and the little need that Christendom has of them. Yet nevertheless, because there be certain days dedicated to the mysteries of our redemption, we use the Christian liberty, and have respect to that which either may hurt, or serve to the edification of the Church, according to the circumstance of time, place, and persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief &amp; Pithy Sum of the Christian Faith made in Form of a Confession</cite>, (London, 1562), ch. 5, 39. Of marriage, of fasting and of the difference of days and meats, pp. 119-20</span></figcaption>

<blockquote><p>That whereunto more respect and account is given than God alloweth to be given to it, and wherein more excellency is placed than God hath put into it, or will at all communicate to it, is an idol exalted against God. […] Now, when Hooker accounteth festival days, for God’s extraordinary works wrought upon them, to be holier than other days, what man of sound judgment will not perceive that these days are idolised, since such an eminence and excellency is put in them, whereas God hath made no difference betwixt them and any other days?</p></blockquote>

<blockquote><p>§46. 6. And as for holy days, there is great difference between them: Those are liable to most question that are obtruded on the Church with the greatest confidence. As for such days as are appointed upon some emergent occasions that arose since Scripture was indited, and are not common to all times and places of the Church, there is no more question whether the magistrate may command them, or the pastors agree upon them, than whether a lecture-day, or fast-day, or thanksgiving-day may be commanded or agreed on: some time for God’s worship besides the Lord’s Day must be appointed: And God having not told us which, the magistrate may, on fit occasions. And this is no derogation from the sufficiency of Scripture: For the occasion of the day was not existent when the Scripture was written: such occasions are various according to the various state of the Church in several ages and countries. And therefore to keep an anniversary day of thanksgiving, such as we keep on the fifth of November for our deliverance from the Papists’ powder plot, is no more questionable than to keep a lecture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, p. 412</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

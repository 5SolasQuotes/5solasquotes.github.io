<main class="wrap"><figure class="quote" id="q-6876250b9b" data-kw="">
<blockquote><p>Hence, it is also manifest that if any good quality or work of ours were made the condition of our justification or title to eternal life, this would turn the covenant of grace exhibited in the gospel into a covenant of works. The covenant of grace revealed and offered to sinners in the gospel is the only covenant according to which a sinner can be justified and entitled to life eternal. It is absolutely impossible that he can be justified according to the broken covenant of works. But were any graces, acts, or works of his the proper conditions of his justification, the covenant of grace would be as much a covenant of works as ever the covenant made with Adam was. The condition of Adam’s covenant was perfect obedience, and according to this imaginary law of easier terms, the conditions of the covenant of grace are sincere faith and sincere obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 102.</span></figcaption>

<blockquote><p>These are the two parts of justification; the first is grace revealed by Christ, in that by Him we have God appeased, so that sin can no longer accuse us, but our conscience is, through trust in the mercy of God, brought back to security: the other is the gift of the Holy Ghost, with his gifts, who illuminates us against the defilements of the flesh and the spirit.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-546eb0fd3d" data-kw="Merit">
<blockquote><p>There now can be no merit in man with God by works whatsoever, either of congruity or of condignity. (1) They are not undue, but due; for whatever we are and can do, all this we owe to God, whose debtors we are on this account called (Lk. 17:10; Rom. 8:12). (2) Not one is ours, but all are gifts of grace and fruits of the Spirit (Jam. 1:17; Phil. 2:13; 2 Cor. 3:5). (3) They are not perfect, but alloyed as yet by various impurities (Rom. 7:18; Gal. 5:17, 18; Is. 64:6). (4) They are not equal to future glory because there is no proportion between the finite and temporary and the infinite and eternal (Rom. 8:18; 2 Cor. 4:17). (5) The reward promised to them is purely gratuitous and undue and so to be expected not from the internal merit of the work and its intrinsic worth, but only from the most free estimation of it by the one who crowns it (Rom. 6:23; 4:4; 11:6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 17.5.7</span></figcaption>

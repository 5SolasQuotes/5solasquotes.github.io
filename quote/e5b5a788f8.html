<main class="wrap"><figure class="quote" id="q-e5b5a788f8" data-kw="">
<blockquote><p>The course in this case directed unto by the apostle is none other but the application of our souls by faith unto the Lord Christ, as our advocate with the Father, on the account of the propitiation that he has made for our sins. Under the consideration of this double act of his sacerdotal office, his oblation and intercession, he is the object of our faith in our absolute justification; and so he is as unto the continuation of it. So our whole progress in our justified estate, in all the degrees of it, is ascribed unto faith alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b86bb291ee" data-kw="">
<blockquote><p>The Reformation doctrine of justification helps us to see that our salvation is the work of Christ for us. It also delivers us from a life of doubt and fear that causes us to wonder how God could possibly love sinners like us. It shows us that we have peace with God objectively because Christ has satisfied the demands of God for us, and it shows us subjectively because we can know confidently that by faith in Christ we are right with God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/w-robert-godfrey.html">W. Robert Godfrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tabletalk</cite>, April 2004, p. 18</span></figcaption>

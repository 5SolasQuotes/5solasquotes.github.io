<main class="wrap"><figure class="quote" id="q-c06acbe19d" data-kw="">
<blockquote><p>He that hath taken upon him the charge and oversight of the Church of God, let him well weigh and consider, whether he have carefully discharged his duty, both in doctrine &amp; life, so that the glory of God by him thereby hath been the rather favoured and propagated, and the consciences of many effectually stayed &amp; comforted.

Whether in matters touching God and Christian religion, he hath set forth and uttered in the Church, any thing doubtful and uncertain, in steed of certain truth, and undoubted verity. Whether he be spotted and infected with any heresy, or unsound opinion. Whether he have at all times to the uttermost of his ability and skill, endeavoured to beat down and confute all corrupt doctrines.

Whether he have patiently winked at, &amp; quietly suffered any rites wherein hath been either apparent superstition, or otherwise any notable offence and inconvenience: As gadding and ranging about with procession, countenancing in corners, superstitious usage of holy water, pilgrimages, and vows to be performed in some certain places, and with certain appointed solemnities and ceremonies, whereby there are commonly committed sundry lewd attempts and many lamentable enormities.

Whether he have admitted any to be teachers in the Church, which were either unmeet or unable sincerely and discreetly to deliver the word of God: or any corrupt and unsound preachers, that willingly deprave the texts of the scriptures, and purposely misconstrue the words of truth, to confirm and establish their own fantastical, or rather fanatical, opinions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-hyperius.html">Andreas Hyperius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true trial and examination of a man’s own self wherein every faithful Christian, by looking into his conscience, may most plainly behold his spiritual deformity by nature, described, his actual rebellion by disobedience detected, his promise breach at baptism, by ordinary transgression apparentl</cite>, trans. Thomas Newton (London: John Windet, 1587), pp 37-39.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

Whether in matters touching God and Christian religion, he hath set forth and uttered in the Church, any thing doubtful and uncertain, in steed of certain truth, and undoubted verity. Whether he be spotted and infected with any heresy, or unsound opinion. Whether he have at all times to the uttermost of his ability and skill, endeavoured to beat down and confute all corrupt doctrines.

Whether he have patiently winked at, &amp; quietly suffered any rites wherein hath been either apparent superstition, or otherwise any notable offence and inconvenience: As gadding and ranging about with procession, countenancing in corners, superstitious usage of holy water, pilgrimages, and vows to be performed in some certain places, and with certain appointed solemnities and ceremonies, whereby there are commonly committed sundry lewd attempts and many lamentable enormities.

</figure><figure class="quote" id="q-b194faad89" data-kw="">
<blockquote><p>10th Problem, ‘Where from bishops or the magistrate certain new and [previously] unused ceremonies, but called ‘indifferent’, are obtruded, whether a Church or the ministers ought to receive them in order to avoid a greater evil, for instance persecution or a major change in doctrine, or schism, etc.? I respond: 1st Conclusion: If the reception may note approbation, it is denied. For none ought to exert force to bear on the conscience or the power of the Church and the cause of truth for this reason. 2. If indeed the reception may note ecclesiastical connivance or permission, or toleration: of the common members it is able to be distinguished…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, (Amsterdam, 1663-1676), vol. 1, pt 1, bk. 2, ‘Of Ecclesiastical Things, or Acts &amp; Exercises’, Tract 1, ‘Of Formularies, or Liturgies &amp; Rituals’, ch. 7, ‘Questions Further Explained on the Nature, Causes &amp; Properties of the Ceremonies’, Section 2, “Problems surrounding the causes of the ceremonies are these”, p. 431</span></figcaption>

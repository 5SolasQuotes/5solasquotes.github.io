<main class="wrap"><figure class="quote" id="q-cedf944e34" data-kw="privation">
<blockquote><p>Hence it follows that the formal reason of sin consists in anomia and privation, denoting the want of the rectitude or goodness which ought to be in the rational creature according to the prescription of the law (whether it belongs to the nature or qualities or actions themselves, for it deprives all these of conformity with the law and so constitutes them guilty of sin). But this privation is not pure or simple, but corrupting; not idle, but energetic; not of pure negation, but of depraved disposition, by which not only is the due rectitude taken away, but also an undue unrectitude and a depraved quality laid down, infecting all the faculties. Just as a physical disease is not only a removal of the temper of the humors, but also a corrupt disposition and disorder (dyskrasia) of them, so sin (which holds the relation of a moral disease of the soul) is not only the negation of a good, but the position of a corrupt disposition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/nature-of-sin.html">Nature of Sin</a> › <a href="../topics/sin/nature-of-sin/privation-or-positive.html">Privation or positive</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c25047dbda" data-kw="sabbath">

</figure><figure class="quote" id="q-a84fb7eb54" data-kw="">

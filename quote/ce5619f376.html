<main class="wrap"><figure class="quote" id="q-ce5619f376" data-kw="">
<blockquote><p>Thirdly, true matter [of the Church] are all such [persons] as are baptized, and openly profess that Jesus the son of Mary is the Son of God, made Christ the Lord, by whom only and alone is salvation… … Thirdly, because it is the sum of the whole Gospel, and Covenant in the New Testament, in respect whereof, there is no other point of religion necessary, but as it tends either to bring men unto, or to confirm them in this main truth. Hence it is, that St. John concludes his Gospel with this scope… And therefore since such as do profess this truth do summarily and in general profess all the evangelical doctrines in God’s book, such must needs be fit matter of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Plain Evidences the Church of England is Apostolical, the Separation Schismatical</cite>, ... (London: 1610), 8th Error, p. 271</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1e615a3ebe" data-kw="">
<blockquote><p>And all students in divinity are most expressly enjoined, upon pain of being declared unworthy of ever serving in the sacred ministry, to raise any stirs or debates about unnecessary questions, as concerning the order of God’s decrees, of universal grace by the preaching of nature, which may lead and bring men unto salvation, points only propounded and advanced by pure curiosity, and for the exercise of men’s wits. And all examiners of our proposans in order to the ministry, shall proceed in that business with very much charity, exacting from them nothing but what is demanded by the canons of our discipline; and provided they give that satisfaction which is requisite, by signing the Confession of Faith, the Liturgy of our Churches, and the Canons of Alez, Charenton, and Alenson, and this present act, they shall be approved and admitted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synodicon in Gallia Reformata (John Quick, London, 1692)</cite>, 3rd National Synod of Charenton 1644 / 1645, ch. 10, p. 455</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-8e0bf6110d" data-kw="">
<blockquote><p>In 1720, the [Presbyterian] Synod [of Ulster] adopted the so-called ‘Pacific Act,’ which in the same breath professed adherence to the Westminster Confession, extended the Act of 1705 to all intrants to the ministry, though licensed and ordained elsewhere; and ‘legalized the practice of receiving explanations of objectionable phrases.’ In 1721 a motion was made and carried that all the members of Synod who are willing to subscribe the Westminster Confession of Faith, according to the terms of the Pacific Act, be allowed by this Synod to do it. Charitable declarations were made by both parties in the Synod and approved by Synod. The great majority of the members of Synod signed the following formula: ‘Reserving to ourselves the benefit of the Pacific Act, we believe the Westminster Confession of Faith to be founded on the Word of God, and therefore as such, by this our subscription, we do own the said Confession as the confession of our faith.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-cooper.html">James Cooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confessions of Faith &amp; Formulas of Subscription</cite>, … (Glasgow: MacLehose &amp; Sons, 1907), pp. 19-22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“In 1720, the [Presbyterian] Synod [of Ulster] adopted the so-called ‘Pacific Act,’ which in the same breath professed adherence to the Westminster Confession, extended the Act of 1705 to all intrants to the ministry, though licensed and ordained elsewhere; and ‘legalized the practice of receiving explanations of objectionable phrases.’ In 1721 a motion was made and carried that all the members of Synod who are willing to subscribe the Westminster Confession of Faith, according to the terms of the Pacific Act, be allowed by this Synod to do it. Charitable declarations were made by both parties in the Synod and approved by Synod. The great majority of the members of Synod signed the following formula: ‘Reserving to ourselves the benefit of the Pacific Act, we believe the Westminster Confession of Faith to be founded on the Word of God, and therefore as such, by this our subscription, we do own the said Confession as the confession of our faith.&#x27;”

oopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c0c69850e8" data-kw="">
<blockquote><p>Furthermore, the Churches of Helvetia, and Savoy, and the free cities of France, and the Low Countries, and Scotland, are to be reverenced as the true Churches of God, as their confession make manifest. And no less must we think of our own Churches in England and Ireland. For we hold, believe, and maintain, and preach the true Faith, that is, the ancient doctrine of salvation by Christ, taught and published by the prophets and apostles, as the book of the [39] Articles of Faith agreed upon in open parliament do fully show…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Creed, on the Church in A Golden Chain</cite>, (Cambridge, 1600), p. 496</span></figcaption>

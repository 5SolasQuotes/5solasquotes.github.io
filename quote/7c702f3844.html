<main class="wrap"><figure class="quote" id="q-7c702f3844" data-kw="">
<blockquote><p>REV. AND DEAR SIR,

I rejoice to hear that my poor labours have been of any service to any in New England. All glory be to the great and glorious God, when out of the mouths of babes and sucklings, he is pleased sometimes to ordain praise. I rejoice to hear the progress of God’s work among you, this last summer and that there are any appearances of its continuance: Blessed be God, dear brother! As to the subject you mention of laymen being sent out to exhort and to teach, supposing them to be real converts, I cannot but think, if it be encouraged and continued, it will be of dreadful consequence to the church’s peace and soundness in the faith. I will not gainsay but that private persons may be of service to the church of God by private, humble, fraternal reproof, and exhortations; and no doubt it is their duty to be faithful in these things.

But in the mean time if christian prudence and humility do not attend their essays, they are like to be prejudicial to the church’s real well-being. But for ignorant young converts to take upon them authoritatively to instruct and exhort publicly, tends to introduce the greatest errors and the grossest anarchy and confusion. The ministers of Christ should be apt to teach and able to convince gainsayers, and it is dangerous to the pure church of God, when those are novices, whose lips should preserve knowledge. It is base presumption, whatever zeal be pretended to, notwithstanding, for any persons to take this honour to themselves, unless they be called of God, as Aaron.

I know most young zealots are apt, through ignorance, inconsideration, and pride of heart, to undertake what they have no proper qualifications for: and, through their imprudences and enthusiasm, the church of God suffers. I think all that fear God, should rise up and crush the enthusiastic creature in the egg. Dear brother, the times we live in are dangerous. The churches in America and elsewhere are in great hazard of enthusiasm: we have need to think of the maxim, principiis obsta. May Zion’s King protect his church! I add no more, but love, and beg a remembrance in your prayers.

GILBERT TENNENT.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-tennent.html">Gilbert Tennent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Jonathan Edwards, [1741] in S. E. Dwight, The Life of President Edwards (New York: G. &amp; C. &amp; H. Carvill, 1830), p. 153.</cite></span></figcaption>

<blockquote><p>[Arminian Error:] 7. That man’s conversion is properly nothing but the act of believing the promise of grace. This restraint of our conversion unto so narrow a compass as first to bring it from the habit [inward power] of faith to the act of believing, and then to appropriate it to that act without so much as once mentioning any other graces: this narrow conceit touching our conversion is that which has filled the writings of many learned about this point with much darkness and confusion. They so speak and write of conversion as if it began in that one and only action of man’s will consenting to the promise of mercy in Christ. But this is without all ground. To convert is not only to believe, but to repent, to love God and our neighbor, to abstain from every evil way, to practice all duties of piety and goodness: these acts are as proper and immediate parts of true conversion, as faith. Nor does the Scripture so much as intimate any such limitation, as to appropriate our conversion to the act of faith: nay, tis manifest that the Scriptures when they speak of man’s turning unto God, do join repentance and other godly acts together with faith: as appears by that solemn invitation of men unto God, ‘Repent and believe the Gospel,’ so often used in the New Testament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith… (London: 1627)</cite>, p. 135</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5b7bdd323b" data-kw="">
<blockquote><p>Position 3. To repent, to mortify sin, is not to condemn all our works (as Mr. Town says) righteousness and judgment, and our best things in us, and then by faith to fly to grace; nor is it to distrust our own righteousness and embrace Christ’s in the promise: 1. Because this is faith; and the Scripture says we are justified by faith. 2. We receive Christ by faith, Jn. 1:12. 3. We receive and embrace the promise by faith, Heb. 11:11, and were persuaded of them. 4. We are to believe without staggering, Rom. 4.19. 5. We have peace of conscience through faith, Rom. 5:1. 6. By faith we have access into this grace wherein we stand, Rom. 5:2. And boldness to enter into the holy of holiest, and draw near to our High Priest, with full assurance of faith, Heb. 10:19-22. Now we are not justified by repentance and mortification; we neither receive Christ, nor embrace the promises by repentance. The apostle requires in repentance, sorrow, carefulness to eschew sin, clearing, indignation, fear, zeal, desire, revenge, 2 Cor. 7:10-11, but nowhere does the Scripture require this as an ingredient of repentance, that we have boldness and access, and full assurance: nor do Antinomians admit that by repentance we have peace or pardon, but this they ascribe to faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself (London: 1647)</cite>, p. 272</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

h." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8236c961f6" data-kw="">
<blockquote><p>By it [repentance unto life] a sinner, out of the sight and sense, not only of the danger, but also of the filthiness and odiousness of his sins, as contrary to the holy nature and righteous law of God, and upon the apprehension of his mercy in Christ to such as are penitent, so grieves for and hates his sins, as to turn from them all unto God,[c] purposing and endeavouring to walk with him in all the ways of his commandments.[d] [c] Ezek. 18:30,31. Ezek. 36:31. Isa. 30:22. Ps. 51:4. Jer. 31:18,19. Joel 2:12,13. Amos 5:15. Ps. 119:128. 2 Cor. 7:11. [d] Ps. 119:6,59,106. Luke 1:6. 2 Kings 23:25.</p></blockquote>

</figure><figure class="quote" id="q-17afc6fb4a" data-kw="">
<blockquote><p>Repentance is a detestation of wicked life, and a turn to the better. Whence the parts of repentance are two: withdrawal from evil, and approach to the good, Psalm 34:14, depart from evil, and do good. It is evident that this repentance, insofar as it is saving conversion to God, that is, Sanctification begun or continued, pertains to the Gospel: (1.) Because it is an effect of evangelical doctrine. (2.) Because the baptism of repentance, which John preached, Mk. 1:4, is not a sacrament of the Law, but of the Gospel. (3.) Because the Gospel alone works that sorrow that is according to God, 2 Cor. 7:10. But the Law works wrath, Rom. 4:15. (4.) Because it immediately flows from the remission of sins, insofar as the Gospel is the preaching of the remission of sins and of repentance, Mk. 6:12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-wendelin.html">Marcus Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd ed. (1634). ‘Gospel-Offer &amp; Covenant of Grace’ Wendelin (1584-1652)</cite></span></figcaption>

</figure><figure class="quote" id="q-cbd0ebcdcd" data-kw="">
<blockquote><p>§XII. For in the State of Grace, restituted or of inchoate reparation, the man who is called is excited and vivified from the lethargy and death of sin by prevenient and preparing grace, so that he may be able to read, hear, understand and meditate on the Word of God; by which means the intellect is illuminated and the will is impelled, and is gradually prepared and disposed, so that he can obey God calling through the Word, believe, and convert himself [Acts 2:40]. Eph. 2:5: “God, even when we were dead in sins, hath quickened us together in Christ… And hath raised us up together, and made us sit together in the heavenly places, in Christ Jesus.” ch. 5:8: “For you were heretofore darkness; but now, light in the Lord. Walk then as children of the light.” v. 14: “Wherefore he saith: Arise, thou that sleepest, and arise from the dead: and Christ shall enlighten thee.” Tit. 2:11-12: “For the grace of God our Saviour hath appeared to all men; Instructing us, that, denying ungodliness and worldly desires, we should live soberly, and justly, and godly in this world.” Rev. 3:20: “Behold, I stand at the gate, and knock. If any man shall hear my voice, and open to me the door, I will come in to him, and will sup with him, and he with me.</p></blockquote>

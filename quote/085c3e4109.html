<main class="wrap"><figure class="quote" id="q-085c3e4109" data-kw="">
<blockquote><p>Now I confidently say that whosoever calls himself, or desires to be called, Universal Priest, is in his elation the precursor of Antichrist, because he proudly puts himself above all others. Nor is it by dissimilar pride that he is led into error; for, as that perverse one wishes to appear as above all men, so whosoever this one is who covets being called sole priest, he extols himself above all other priests.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-the-great.html">Gregory the Great</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters</cite>, bk. 7, ep. 33 (to the Emperor Maurice)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ed477133ac" data-kw="">
<blockquote><p>Nor do I regard that as an honour whereby I know that my brethren lose their honour. For my honour is the honour of the universal Church: my honour is the solid vigour of my brethren. Then am I truly honoured when the honour due to all and each is not denied them. For if your Holiness calls me Universal Pope, you deny that you are yourself what you call me universally. But far be this from us. Away with words that inflate vanity and wound charity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-the-great.html">Gregory the Great</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters</cite>, bk. 8, ep. 30 (to Eulogius of Alexandria)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/papal-supremacy.html">Papal supremacy</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/the-popes-claims.html">The Pope&#x27;s claims</a></span></div>

</figure><figure class="quote" id="q-788f2fe55a" data-kw="Papal infallibility">
<blockquote><p>Thirdly, if Christ asked this for all the Roman pontiffs, that they should be exempt from error, then he did not obtain what he asked. For it is certain that many Roman pontiffs have erred, even when teaching ex cathedra, that is, determining controversies; as Alphonsus asserts, Contra Hæres. Lib. I. c. 4, where he affirms that the pope not only may err, but even be a heretic. The same is written and held by other papists also. Then who, I pray you, will be the supreme judge of the church, when the supreme pontiff hath fallen into heresy? Is he a fit person to be the supreme judge in religion, and one in whose judgment we should acquiesce, who may be, and is a heretic, as the very papists themselves confess? Surely, never. The supreme judge of all controversies must be such a one as can neither err nor prove a heretic: and such is Christ himself, that true High Priest, and the sacred scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 5</span></figcaption>

</figure><figure class="quote" id="q-c793e92df6" data-kw="">
<blockquote><p>This claim, as it rests upon the authority of the Pope, is utterly unscriptural, because the Pope is not known to Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology</cite>, p. 99</span></figcaption>

</figure><figure class="quote" id="q-f40671079e" data-kw="Councils and the pope">
<blockquote><p>Although the Levitical high priest had the right to convoke councils and to gain for them infallible authority, it does not follow that the same belongs to the Roman pontiff, because no other besides Christ succeeded the ancient high priest (Heb. 7, 8, 9). Besides, the right of extraordinary conventions was with the supreme magistrate (as we have said) and if they had any authority, that flowed entirely from the word, not from the pope.</p></blockquote>

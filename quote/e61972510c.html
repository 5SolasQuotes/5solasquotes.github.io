<main class="wrap"><figure class="quote" id="q-e61972510c" data-kw="">
<blockquote><p>Now that it is not sufficient that they be put to subscribe a confession of faith in only scripture words is clear: 1. Because the Jews will swear and seal the Old Testament in their own sense, but their sense makes the Old Testament to be the word of man, not the Word of God. The Sadducees acknowledged the five books of Moses to be the Word of God, yet because they denied the resurrection of the dead, Christ argues them, Mt. 22:45, ignorant both of the power of God asserted in the books of Moses and of the scriptures, especially of that scripture which God spake out of the bush to Moses: ‘I am the God of Abraham, the God of Isaac, etc.’ Ex. 3:6. Yet would the Sadducees have sworn and subscribed all the book of Exodus as the undoubted word of God, but when they denied the resurrection, sure these words ‘I am the God of Abraham etc.’ making the Covenant of grace to die when Abraham died, and Abraham to have perished in soul and body as they expounded it, was not the Word of God; And Papists will subscribe the Old and New Testament and the three Creeds, the Nicene Creed, the Creed of Athanasius and that which commonly is called the Apostles’ Creed. Yet as they expound the Word and these Creeds, we say they transform the Word of God into the doctrine of devils and most abominable idolatry. The greatest heretics that were, Arius, Nestorius, Appolliuaris, Macedonius, the Tritheists, acknowledge the Scripture to be the Word of God and will swear and subscribe the Word of God and contain themselves intra sacra scripturae locutiones, ‘within the words of scripure’. But their faith is not the faith of the Scripture, and this makes ten thousand and millions of faiths whereas the word ‘faith’ there is but one faith. For Arius has one faith, Apollinaris another, Nestorius another, and every heretic a faith according to the sense that he falsely puts on the Scripture, and all may swear one confession of faith in Scripture-words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

<blockquote><p>Wherefore we suffer not ourselves, in controversies about religion, or matters of faith, to be pressed with the bare testimonies of Fathers, or Decrees of Councils; much less with received customs, or with the multitude of men being of one judgment, or with prescription of long time. Therefore, in controversies of religion, or matters of faith, we cannot admit any other judge than God himself, pronouncing by the holy Scriptures, what is true, what is false, what is to be followed, or what to be avoided.</p></blockquote>

</figure><figure class="quote" id="q-875d9e0582" data-kw="">
<blockquote><p>So are there none here admitted without the approbation and judgment of men according to the rules of the Word, and the received order of the Church. This outward calling of the Officers of the Church doth consist in Election and Ordination, after due trial and examination of their soundness in religion, and godliness of life… … The person thus known and nominated… is examined of his skill in the languages, Latin, Greek, and Hebrew, in his interpreting of Scripture, in the controversies of religion, in his gift of exhortation, in the holy and ecclesiastical history and chronology; And first of all, Of his life and manner of conversation… Being thus examined, and found qualified for that charge, he is sent to the vacant place… …And at the same time a public edict is served, that if any person or persons, have any thing to object against the literature, doctrine, or life of such a man, why he may not be a profitable minister of such a Parish, they shall appear… that their objections may be tried and discussed. … …the party… is called up and demanded concerning his willingness and desire to serve the Lord Jesus, for the good of that people; with other questions of that kind; and the people also are demanded, whether they will receive him for their pastor… Both having declared their readiness and mutual consent, the minister.. with so many of the ministers present, as may conveniently come near, lay their hands upon his head, and in the Name of Jesus do appoint him to be the pastor of that people… … This liberty of election is in part prejudged and hindered by patronages and presentations which are still in use there, not by the rules of their discipline, but by toleration of that which they cannot amend, in the mean time procuring, that in the case of presentations by patrons, the examination and trial by the presbytery, is still the same. The congregation, where he who is presented is to serve, is called, if they have ought to object against his doctrine or life, after they have heard him, or that their consent may be had. … The same course of election and admission for substance, and in form according to the nature of their office, is observed in the calling of other officers, as ruling elders, and deacons…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Government &amp; Order of the Church of Scotland</cite>, (Edinburgh: Bryson, 1641), II. Of their Calling</span></figcaption>

— Alexander Henderson, The Government &amp; Order of the Church of Scotland (Edinburgh: Bryson, 1641), II. Of their Calling">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSo+are+there+none+here+admitted+without+the+approbation+and+judgment+of+men+according+to+the+rules+of+the+Word%2C+and+the+received+order+of+the+Church.+This+outward+calling+of+the+Officers+of+the+Church+doth+consist+in+Election+and+Ordination%2C+after+due+trial+and+examination+of+their+soundness+in+religion%2C+and+godliness+of+life%E2%80%A6+%E2%80%A6+The+person+thus+known+and+nominated%E2%80%A6+is+examined+of+his+skill+in+the+languages%2C+Latin%2C+Greek%2C+and+Hebrew%2C+in+his+interpreting+of+Scripture%2C+in+the+controversies+of+religion%2C+in+his+gift+of+exhortation%2C+in+the+holy+and+ecclesiastical+history+and+chronology%3B+And+first+of+all%2C+Of+his+life+and+manner+of+conversation%E2%80%A6+Being+thus+examined%2C+and+found+qualified+for+that+charge%2C+he+is+sent+to+the+vacant+place%E2%80%A6+%E2%80%A6And+at+the+same+time+a+public+edict+is+served%2C+that+if+any+person+or+persons%2C+have+any+thing+to+object+against+the+literature%2C+doctrine%2C+or+life+of+such+a+man%2C+why+he+may+not+be+a+profitable+minister+of+such+a+Parish%2C+they+shall+appear%E2%80%A6+that+their+objections+may+be+tried+and+discussed.+%E2%80%A6+%E2%80%A6the+party%E2%80%A6+is+called+up+and+demanded+concerning+his+willingness+and+desire+to+serve+the+Lord+Jesus%2C+for+the+good+of+that+people%3B+with+other+questions+of+that+kind%3B+and+the+people+also+are+demanded%2C+whether+they+will+receive+him+for+their+pastor%E2%80%A6+Both+having+declared+their+readiness+and+mutual+consent%2C+the+minister..+with+so+many+of+the+ministers+present%2C+as+may+conveniently+come+near%2C+lay+their+hands+upon+his+head%2C+and+in+the+Name+of+Jesus+do+appoint+him+to+be+the+pastor+of+that+people%E2%80%A6+%E2%80%A6+This+liberty+of+election+is+in+part+prejudged+and+hindered+by+patronages+and+presentations+which+are+still+in+use+there%2C+not+by+the+rules+of+their+discipline%2C+but+by+toleration+of+that+which+they+cannot+amend%2C+in+the+mean+time+procuring%2C+that+in+the+case+of+presentations+by+patrons%2C+the+examination+and+trial+by+the+presbytery%2C+is+still+the+same.+The+congregation%2C+where+he+who+is+presented+is+to+serve%2C+is+called%2C+if+they+have+ought+to+object+against+his+doctrine+or+life%2C+after+they+have+heard+him%2C+or+that+their+consent+may+be+had.+%E2%80%A6+The+same+course+of+election+and+admission+for+substance%2C+and+in+form+according+to+the+nature+of+their+office%2C+is+observed+in+the+calling+of+other+officers%2C+as+ruling+elders%2C+and+deacons%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Alexander+Henderson%2C+The+Government+%26+Order+of+the+Church+of+Scotland+%28Edinburgh%3A+Bryson%2C+1641%29%2C+II.+Of+their+Calling&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F875d9e0582.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/875d9e0582.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-in-scottish-church-history/#:~:text=So%20are%20there%20none%20here%20admitted,officers%2C%20as%20ruling%20elders%2C%20and%20deacons&amp;text=So%20are%20there%20none%20here%20admitted%20without%20the&amp;text=of%20other%20officers%2C%20as%20ruling%20elders%2C%20and%20deacons" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

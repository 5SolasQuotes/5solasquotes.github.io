<main class="wrap"><figure class="quote" id="q-0480249b8d" data-kw="">
<blockquote><p>I was standing on the 10th of December, 1846, at the end of my Father’s house, and meditating on that precious word that has brought peace to countless weary ones: ‘God so loved the world, that He gave his only begotten Son, that whosoever believeth in Him, should not perish, but have eternal life’ (John 3:16). I saw the proof of his love in the giving of his Son Jesus. I saw that ‘whosoever’ meant anybody and everybody, and therefore me, even me. I saw the result of believing—that I would not perish, but have everlasting life. I was enabled to take God at his word. I saw no one, but Jesus only, all in all in redemption. My burden fell from my back, and I was saved. Yes, saved!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/duncan-matheson.html">Duncan Matheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Life and Labors of Duncan Matheson: The Scotttish Evangelist, by John MacPherson</cite>, (Kilmarnock: Ritchie, n.d.), p. 26, as quoted by Ian Murray, The Cross: the Pulpit of God’s Love, n.d., p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“I was standing on the 10th of December, 1846, at the end of my Father’s house, and meditating on that precious word that has brought peace to countless weary ones: ‘God so loved the world, that He gave his only begotten Son, that whosoever believeth in Him, should not perish, but have eternal life’ (John 3:16). I saw the proof of his love in the giving of his Son Jesus. I saw that ‘whosoever’ meant anybody and everybody, and therefore me, even me. I saw the result of believing—that I would not perish, but have everlasting life. I was enabled to take God at his word. I saw no one, but Jesus only, all in all in redemption. My burden fell from my back, and I was saved. Yes, saved!”

ooks Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-96d45ff267" data-kw="">
<blockquote><p>Plead hard with God, but plead with Him upon his own arguments; there are amongst many others, these four grounds on which to bottom your plea… 1. On God Himself. And there are two special things from which you may plead here: 1. His gracious nature. Fetch your arguments by which you plead with God for mercy thence, whence He originally fetched his arguments to persuade Himself to show mercy; from his own bowels, from his gracious nature, from his natural goodness and gracious inclination to mercy, Jn. 3:16, ‘God so loved the world that He gave his only Son, etc.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-alleine.html">Richard Alleine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ pietatis: or a Vindication of Godliness</cite>, … (London: 1665), Sermon on Jn. 1:47, 3. Learn the skill to plead with God in prayer, pp. 222-23</span></figcaption>

</figure><figure class="quote" id="q-ff0eb34bea" data-kw="">
<blockquote><p>2. The next thing in God is love, and that arises from goodness. The goodness that is in God inclines Him to love, and to be the most profuse lover. You read in 1 John 4:7-8, ‘God is love.’ The question is whether this speech does not import that He is love in Himself, as well as that He shows love. There are these reasons why it imports what He is in Himself, when He says, ‘God is love.’ Says He, verse 7, ‘Every one that loves is born of God, and knows God,’ that is the affirmative; and verse 8, ‘He that loves not knows not God, for God is love’; that is, he knows not God in what is most proper to Him, as to what does most abound in Him, for God is love. We ordinarily say of a man that is of such a disposition, I know him, he is so and so; so the believer knows God to be love… He speaks it of his love, which none sees but as manifest by effects; but God is love essentially. Says Aquinas, Whoever has a will, has a proneness to love. Says Musculus, As every one is in goodness, so in love. If God then has a will inclined to anything, it is to love; He has hatred in Him to sin, He has the opposite: He has a love also to something, only it is guided by his will towards creatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Object &amp; Acts of Justifying Faith, pt. 1</cite>, bk. 1, ch. 8, on Ex. 34:6-7 in The Works (d. 1680; Edinburgh: James Nichol, 1864), vol. 8, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>…why then did Christ here urge the testimony of John? Why, these things I say, that you may be saved. This He aimed at in all this discourse, to save not his own life, but the souls of others; He produced John’s testimony because, being one of themselves, it was to be hoped that they would hearken to it. Note, First, Christ desires and designs the salvation even of his enemies and persecutors. Secondly, the word of Christ is the ordinary means of salvation. Thirdly, Christ in his word considers our infirmities and condescends to our capacities, consulting not so much what it befits so great a prince to say as what we can bear, and what will be most likely to do us good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Bible</cite></span></figcaption>

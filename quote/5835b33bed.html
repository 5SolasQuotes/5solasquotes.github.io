<main class="wrap"><figure class="quote" id="q-5835b33bed" data-kw="">
<blockquote><p>Nor is trouble the exclusive lot of those who occupy the lower stations of life. There are the labours of the mind, as well as those of the body; and it is what affects the mind that strikes most directly at the seat of our peace. There are the harassing care and the drudgery of those who are engaged in extensive business; there is the intellectual struggle in those who would make great acquirements in knowledge—the weariness of the flesh in much study; there is the mental anxiety of all who aspire; there is the waking dream, and there is the sleepless night; there is the indescribable feeling of nervousness; there is the gloom of melancholy, and there is the eclipse of reason: all these ought to be considered as so many monitors reminding men that this is not their rest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-foote.html">James Foote</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The World is not our Rest in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><figure class="quote" id="q-a61f6dd84f" data-kw="">
<blockquote><p>The author looks at the history of the use of the cassock, scarf and bands in Scotland… The scarf is reported as being worn ‘by quite a number of ministers’, its use having been revived ‘about half a century ago’. Theories regarding its origin vary and are described. James Melville writes of seeing John Knox wearing a type of forerunner. They fell into disuse after the Revolution and until ‘our own times’. Bands are medieval in origin, though whether civil or ecclesiastical is in dispute. They are the only article which distinguishes the minister from the probationer. They were worn by some of the clergy in pre-Reformation times and in Reformed circles in England as early as 1566. They appear in Scotland from the end of the 16th century and their use appears unaffected by the Revolution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-mcmillan.html">William McMillan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Scottish Ecclesiastical Dress’ Church Service Society Annual</cite>, 20 (1950), pp. 32-43</span></figcaption>

<main class="wrap"><figure class="quote" id="q-dac9265f56" data-kw="">
<blockquote><p>Controversy 3 – Can the sacraments, especially baptism, be administered by anyone, including women? We deny against the Papists, Socinians, Arminians, and Anabaptists. Arguments: 1. Christ gave the power of administering the sacraments only to the apostles and ministers of the Church (Mt. 28:19). 2. And these alone are stewards and dispensers of the mysteries of God (1 Cor. 4:1). 3. The administration of the sacraments is joined with the preaching of the Word; thus, whoever cannot do one, cannot do the other 4. Calling is required (Jn. 1:33, 1 Cor. 1:17). 5. It is forbidden for women to speak in the Church or to do any ecclesiastical duty (1 Cor. 14:34-35). Objections 1. Zippora circumcised her son (Ex. 4:25). Reply: Their relation to circumcision is one thing and their relation to baptism another, and the fact that it was done by a woman is not approved. 2. Philip the deacon baptized (Acts 8:38). Reply: First, he was a deacon. Later, he was an evangelist (Acts 21:8). 3. So did Ananias (Acts 9:18). Reply: He had a special command (v. 10), nor is there proof that he was not a minister.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-rijssen.html">Leonard Rijssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 17, ‘The Sacraments’, pp. 224-5 in Wesley White, A Translation with Introduction to A Summary of Elenctic Theology by Leonard Rijssen a Masters thesis (GPTS, 2009)</cite></span></figcaption>

%93%20Can%20the%20sacraments,that%20he%20was%20not%20a%20minister&amp;text=Controversy%203%20%E2%80%93%20Can%20the%20sacraments%2C%20especially%20baptism&amp;text=there%20proof%20that%20he%20was%20not%20a%20minister" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1946aa0d79" data-kw="">
<blockquote><p>But if anyone either on the testimony of the church, or parents, or witnesses, or of others cannot be sure about the baptism that he had received in infancy, or if it happened that he was moistened by no other baptism than that of the midwives or private individuals, we are of the opinion that such a man may be baptized without any scruple. For the baptism applied by the last-mentioned people is not baptism at all, and the baptism of the first mentioned people is worthless, as the Council of Carthage [AD 418] has rightly decided (5.3): ‘Concerning infants it has been decided that whenever no very certain witnesses are found who testify without a doubt that they were baptized, and whenever they themselves are not, on account of their age, in a position to give an answer about the sacraments that were given to them, they should be baptized without any scruple, lest that doubt should cause them to be bereft of the cleansing of the sacraments.’ For as Leo [AD 400-461] rightly added, ‘what is not known to have been done cannot be said to have been repeated.’ And consequently we should not approve of a conditional baptism that the papal teachers are used to observing in such cases, according to this formula: ‘If you have not been baptized, then I baptize you.’ For a baptism of this kind lacks any precedent in Scripture and changes the form for baptism that Christ had taught, and it also leaves the one who has been baptized in doubt as to which baptism is the real one–which goes against the purpose of baptism that does not make the promises of God ambiguous but establishes and seals them.</p></blockquote>

</figure><figure class="quote" id="q-29e4908f08" data-kw="">
<blockquote><p>…we do not suppose that our salvation depends upon the sacrament of baptism, but upon our adoption according to the formula: “I will be your God and that of your seed.” [Gen. 17:7] We diligently attend to this adoption in the children of the saints according to the Word of the Lord since it has been sealed upon them through the sacrament of baptism… …little corruptions have arisen from no other source than from the understanding that baptism is necessary for salvation, which we consider entirely false. We hold this view to be false because adoption by God must take place before anyone can be baptized rightly. Otherwise, why is a confession of faith required of adults before thy are baptized? We believe, however, that the children of the saints have already been adopted right in the womb according to the covenantal formula. And so we baptize them. …We count as nonsense his assertion that children are holy–that is, in the outward company of the church–before their baptism. For the opposite is true: those children whom (we claim) the Lord has already truly adopted before, according to the covenantal formula, are introduced into the outward company of the church through baptism.</p></blockquote>

<blockquote><p>Neither is that after-consent by acceptance and submission which Mr. [John] Robinson speaks of [with reference to a pastor and his hearers] so slight a matter for this purpose as he would make it. For as in wedlock, the after-consent of parents or parties does often make that a lawful state of marriage which before and without that was none: and in government, acceptance and submission does make him a king which before was a tyrant, though in their nature these actions be rather consequences than causes of that calling; so is it [sometimes] betwixt minister and people.</p></blockquote>

<blockquote><p>4. Those who, in baptism, according to the common condition of infants, were truly justified, regenerated, and adopted, when arrived at years of discretion, do not continue justified, regenerated, or adopted as adults unless by repentance, faith, and the renunciation promised they fulfil their vow taken upon them at baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Baptismal Regeneration &amp; the Final Perseverance of the Saints. A letter of… Davenant… to Dr. Samuel Ward… tr. J. Allport (d. 1641; London: Macintosh, 1864) 30 pp.</cite></span></figcaption>

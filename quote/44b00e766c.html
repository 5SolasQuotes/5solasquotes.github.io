<blockquote><p>…in such cases, where two parts of a Church are divided, having independent authorities as to one another, and there being contrary determinations in the same question, it seems convenient and necessary for peace, that either both should waive their decisions, or that both should permit the decisions of each other to stand and be in force, to such only as should acquiesce therein, and willingly acknowledge the same.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-95ca1a7932" data-kw="">
<blockquote><p>3. …But must we separate from all sinners? or from all that sin in their entrance into the ministry? And why not as well from all other sins of equal greatness? Do you warn all others not to hear yourself? Or do you yet take yourself to be no sinner? or no great sinner? What if the presbyterians think the Independents’ way of entrance to be undue? And the Independents think so of the presbyterians? And both of the Anabaptists [baptists]? and the Anabaptists of them both, etc. Must they all therefore warn all men not to hear each other? Mr. [Philip] Nye [an Independent] thought not so, when he wrote for such hearing public ministers. Is it fit for the author [Edward Bagshaw] of two books of calumnies and bold untruths, besides false doctrines and other crimes, to say ‘Their sin is great, etc. and therefore we both forbear ourselves and warn all others not to hear them?’ 4. Most that I speak of did enter into the ministry in the presbyterian or Independent way heretofore, and do but continue on the terms which I dissent from as well as you. How then can you say they unduly enter into the ministry? 5… 4. But suppose that you are the wiser man, and that those that are more ignorant do mistakingly think that canonical obedience and the oath (with that of Supremacy) to be their duty, and no renouncing of their Christian liberty: Is it not false doctrine to conclude that Christ never sent out any that had as great a sin as this? what none? when he sent out Judas himself, who was first a thief and after a traitor? Do you think then that Christ ever sent out liars, railers, furious Church-dividers, false accusers, etc.?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, … (London, 1671), sect. 41, pp. 102-3</span></figcaption>

</figure><figure class="quote" id="q-22e2ddb815" data-kw="">
<blockquote><p>The covenanters are often considered to have been unrelenting opponents of episcopacy. In the Glasgow Assembly of 1638, when nearly all covenanters voted to ‘remove and abjure’ episcopacy in the kirk, the Glaswegian minister Robert Baillie was the sole named dissenter. Baillie’s subsequent conformity to the covenanting regime after 1638 and his ultimate acceptance of the restored episcopate after 1661 have led historians to claim that he was pliantly obeying those in power. In order to offer an alternative explanation, this article explores the contours of Baillie’s writings on episcopacy in the periods 1637-9 and 1658-62. His views were informed by hatred of the Laudian episcopate and his belief that Scripture described a lawful form of episcopacy similar to the superintendents of the post-Reformation kirk. Whilst Baillie protested against the restored episcopate in 1661, the reasons for his subsequent submission suggest one explanation as to why many presbyterian ministers acquiesced in Charles II’s Erastian kirk settlement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-campbell.html">Alexander Campbell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Episcopacy in the Mind of Robert Baillie</cite>, 1637-1662’ The Scottish Historical Review, vol. 93, no. 236, pt. 1 (April 2014), pp. 29-55 | Abstract:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>When subsequently one presbyter was chosen to preside over the rest, this was done to remedy schism and to prevent each individual from rending the church of Christ by drawing it to himself. For even at Alexandria from the time of Mark the Evangelist until the episcopates of Heraclas and Dionysius the presbyters always named as bishop one of their own number chosen by themselves and set in a more exalted position, just as an army elects a general, or as deacons appoint one of themselves whom they know to be diligent and call him archdeacon. For what function, excepting ordination, belongs to a bishop that does not also belong to a presbyter?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 146</cite>, (to Evangelus), §1</span></figcaption>

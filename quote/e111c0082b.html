<main class="wrap"><figure class="quote" id="q-e111c0082b" data-kw="">
<blockquote><p>God is the just Judge of crimes, and if he did not exercise this justice, he would not be God. […] Third, the moral and ceremonial law itself establishes the same thing. Since the precepts of the former (as to a great part) are indispensable and founded upon the eternal and natural right of God, it is necessary that the penal sanction added to them should be of the same nature; also because (as has been shown before) there is a natural and necessary connection between sin and punishment, moral and physical evil, just as moral and physical good are mutually connected by an indissoluble bond. […]

Thus a magistrate would err, if by a too great indulgence he would dispense with the right of punishment as this would give impunity to crimes. Now the penal right of which we speak is not a positive but a natural right, founded on the very holiness and justice of God. It springs from the essential dependence of the creature (subjecting it to its Creator) both as to obedience by reason of precepts and as to punishment by reason of their sanction. It is not the private right of a creditor; for although sins are sometimes compared to debts, yet they are also crimes which cannot remain unpunished without prejudice to the laws. Rather it is the public right of a ruler because God does not punish as the offended part, but as Judge and the supreme ruler of the world.</p></blockquote>

<blockquote><p>FIRST QUESTION

Whether there is a natural law, and how it differs from the moral law. The former we affirm; the latter we distinguish.

I. As the doctrine concerning the law of God (the discussion of which we now enter upon with the favour of God) properly belongs to the theologian, so it has a multiple use in theology. (1) For the direction of life – as a perfect rule of God’s right over man and of man’s duty towards God. (2) For a knowledge of sin – because as sin is illegally (anomia), from no other source than the law can its truth and heinousness be ascertained (Rom. 3:20). (3) For preparation for grace – that from the declaration of man’s sin and misery, the necessity of saving grace may be unfolded and a desire for it excited in us (in which sense it is called “a schoolmaster unto Christ,” Gal. 3:24). …

IV. Now this law of God is divided in general into natural and positive. As the right of God is twofold (one natural, founded in the perfectly just and holy nature of God; the other positive, depending on the will of God alone in which he also shows his own liberty), so there is a positive law of God built on the free and positive right of God (with respect to which things are then good because God commands them). Hence God was free either not to give such a law or to institute otherwise (such as the law relating to food and the symbolic law given to Adam [Gen. 2:16, 17] and the ceremonial laws of the Old Testament, in which there was no moral goodness or evil per se, but only from the command of God).

There is another (natural) founded on the natural right of God, with regard to which things are not called just because they are commanded, but are commanded because they were just and good antecedent to the command of God (being founded on the very holiness and wisdom of God). And such is its nature that (the creation of man being supposed) it must have been given to him, since it prescribes to him indispensable duties to be performed by all, always and everywhere. …

XXII. If it is asked how this natural law agrees with or differs from the moral law, the answer is easy. It agrees as to substance and with regard to principles, but differs as to accidents and with regard to conclusions. The same duties (both toward God and toward our neighbour) prescribed by the moral law are also contained in the natural law. The difference is with regard to the mode of delivery.

In the moral law, these duties are clearly, distinctly and fully declared; while in the natural law they are obscurely and imperfectly declared both because many intimations have been lost and obliterated by sin and because it has been variously corrupted by the vanity and wickedness of men (Rom. 1:20-22). Not to mention other differences: as that the natural law was engraven upon the hearts of men, the moral law on stony tables; the former pertains to all universally, the latter only to those called by the word, the former contains nothing except morality, the latter has also certain ceremonials mingled with it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 11.1.1, 4, 22.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

n+the+natural+right+of+God%2C+with+regard+to+which+things+are+not+called+just+because+they+are+commanded%2C+but+are+commanded+because+they+were+just+and+good+antecedent+to+the+command+of+God+%28being+founded+on+the+very+holiness+and+wisdom+of+God%29.+And+such+is+its+nature+that+%28the+creation+of+man+being+supposed%29+it+must+have+been+given+to+him%2C+since+it+prescribes+to+him+indispensable+duties+to+be+performed+by+all%2C+always+and+everywhere.+%E2%80%A6%0A%0AXXII.+If+it+is+asked+how+this+natural+law+agrees+with+or+differs+from+the+moral+law%2C+the+answer+is+easy.+It+agrees+as+to+substance+and+with+regard+to+principles%2C+but+differs+as+to+accidents+and+with+regard+to+conclusions.+The+same+duties+%28both+toward+God+and+toward+our+neighbour%29+prescribed+by+the+moral+law+are+also+contained+in+the+natural+law.+The+difference+is+with+regard+to+the+mode+of+delivery.%0A%0AIn+the+moral+law%2C+these+duties+are+clearly%2C+distinctly+and+fully+declared%3B+while+in+the+natural+law+they+are+obscurely+and+imperfectly+declared+both+because+many+intimations+have+been+lost+and+obliterated+by+sin+and+because+it+has+been+variously+corrupted+by+the+vanity+and+wickedness+of+men+%28Rom.+1%3A20-22%29.+Not+to+mention+other+differences%3A+as+that+the+natural+law+was+engraven+upon+the+hearts+of+men%2C+the+moral+law+on+stony+tables%3B+the+former+pertains+to+all+universally%2C+the+latter+only+to+those+called+by+the+word%2C+the+former+contains+nothing+except+morality%2C+the+latter+has+also+certain+ceremonials+mingled+with+it.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+trans.+George+M.+Giger%2C+ed.+James+T.+Dennison+%281679%3B+3+vols%2C+Phillipsburg+NJ%3A+Presbyterian+%26+Reformed%2C+1992%29%2C+11.1.1%2C+4%2C+22.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F16ab5630b2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/16ab5630b2.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/04/07/francis-turretin-on-natural-positive-and-moral-law/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

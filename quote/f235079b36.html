<main class="wrap"><figure class="quote" id="q-f235079b36" data-kw="">
<blockquote><p>IV… Joined to these [the soul’s faculties, such as intellect and will] is free will, or, as others prefer, liberum arbitrium, which is to be considered strictly and generically, arising from the interaction of both faculties and acting according to a natural inclination and from an intrinsic principle, which alone is free in an uncoerced manner. This freedom applies not only to man but also to beasts and some inanimate objects that act uncoercedly, though not in a state of moral freedom as man does, where actions are performed both directly and by command, with premeditated consultation, deliberation, judgment, and from the will, which gives it liberty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-essenius.html">Andreas Essenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Image of God in Man’ Download tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653) Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-1f45008222" data-kw="">
<blockquote><p>1. It cannot be denied but that so much of God’s amiableness or goodness is revealed to infidels that have not the Gospel, by the means mentioned in the objection, as is sufficient to bring men under an obligation to love God as God, and to leave them unexcusable that do not. 2. Therefore to such the impossibility is not physical, but moral. 3. And there is in that objective revelation, so much sufficiency, as that if the soul itself were sanctified and well disposed, it might love God upon such revelation. (Which [Moses] Amyraldus has largely proved.) 4. But to an unholy and undisposed soul no objective revelation is sufficient without the Spirit’s help and operations. 5. Only the Spirit of Christ the Mediator, as given by and from Him, does thus operate on souls, as savingly to renew them. (Of all this I have discoursed more largely in my Catholic Theology, and the applied Epitome.) 6. Whether ever the Spirit of Christ does thus operate on any that hear not of Christ’s incarnation, must be known either by the Scripture or by experience. [1.] By the Scripture I am not able to prove the universal negative, though it’s easy to prove sanctification incomparably more common in the Church, than on those without, if any there have it. The case of infants and of the Churches, and the world before Christ’s incarnation, must here come into consideration. 2. And by experience no man can prove the negative; because no man has experience what is in the hearts of all the persons in the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Knowledge &amp; Love… (London: Parkhurst, 1689), pt. 2, ch. 14</cite>, pp. 266-69</span></figcaption>

</figure><figure class="quote" id="q-73e6e1796c" data-kw="">
<blockquote><p>…the Fall causes a damage or loss of moral and spiritual freedom (man can no longer do the good or love God); the natural freedom, by which man’s will can choose between opposites without being necessitated towards one of both, remains after the Fall. This natural freedom is essential to man, in the sense that without this freedom he would no longer be man as a rational and responsible creature. The Reformed authors treated in this volume [Zanchius, Junius, Gomarus, Voetius, Turretin, de Moore] take pains to combine the permanence of essential freedom (presupposing contingency in reality) with the disastrous slavery of sin by which man’s will s bound (accounting for the factual impossibility of doing the good, since we can only do the good by loving and obeying God). …human freedom does not go unqualified: man does not act out of nature, or contrary to the (ultimate) judgment of his intellect, or outside of God’s providence. Still, these forms of necessity obtain in terms of the necessity of the consequence by which the outcome (the consequent) is not made necessary in itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/willem-j-van-asselt.html">Willem J. van Asselt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Thought on Freedom: the Concept of Free Choice in Early Modern Reformed Theology</cite>, p. 235</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

ary%20in%20itself" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-fd151550ce" data-kw="">
<blockquote><p>Consider the laptop computer on which you might be reading this. There is an obvious sense in which it is complete all by itself, with its operating system, other software installed in the factory, built-in Wi-Fi capability, and so on. Yet it has the capacity to have added to it all sorts of new software and accessories… Since software and accessories of the latter sort were not even in view when the computer was designed, they cannot be said to be ends for which the computer was made. All the same, they are ends that might be added to it, because it does at least have the inherent capacity to have such ends added to it. This is analogous to the notion of an “obediential potency,” and it indicates the sense in which there is indeed a middle ground of just the sort Hart claims is impossible. In what Thomists call a state of “pure nature,” human beings would not have the beatific vision as an end to which they are directed, any more than a computer is oriented toward running some application that did not even exist when it was manufactured. But just as a computer does nevertheless have a capacity to have such applications added to it, so too are human beings made in such a way that an orientation toward the beatific vision might be imparted to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘David Bentley Hart’s Post-Christian Pantheism’ (2022) at Public Discourse</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<main class="wrap"><figure class="quote" id="q-5bccefe48c" data-kw="">
<blockquote><p>XXXVI… For as to the laying on of hands, it cannot be considered as a sign. (a) It is not an element, but an action. (b) It is common with confirmation and many other things and was practiced even under the Old Testament. (c) It was not instituted by Christ by any command, but is a free ceremony, which we read indeed of having been employed, but not of having been instituted; what has been employed, however, ought not at once to be said to have been instituted. Thus the washing of feet and breathing upon the apostles were employed by Christ (Jn. 13:5; Jn. 20:22); yet they were not on that account instituted. (d) Imposition of hands does not pertain to all the orders [of Church office], but only to some.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Institutes of Eclenctic Theology, vol. 3, Topic 19, Question 31, ‘The Five False Sacraments of the Romanists’, section 36, ‘Proof that the Orders [of Church Office] are not Sacraments’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-89c952eadc" data-kw="">
<blockquote><p>If they say that men of such erroneous principles, if they cannot be rectified, are bound to give up the ministry to others of better judgments. I answer: 1. Show me but where those men are, in so full a number as may supply the churches necessities, but so far as that I and such as I may conscionably cease without the church’s loss, and I here promise that I will joyfully give up my office whenever any such fitter man shall be called to my place. And I think the rest of my brethren will do the like. But we live in the open world, where we have opportunity to know men, as well as others: and we cannot see any such plentiful choice of able, pious men to supply all our places if we should give them up.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653), ‘Objections Answered’, p. 76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-38d4725347" data-kw="">
<blockquote><p>Thirdly, while you are preaching that opinion which your zeal is so much for, you are omitting far greater and more necessary truths. Fourthly, mercy is to be preferred before sacrifice: What if the present uttering some truth would cost many thousand men’s lives? Were not that an untimely and unmerciful word? And is it not as bad if (but accidentally) it tend to the ruin of the Church and the hurt of souls? It were easy to instance in unseasonable and imprudent words of truth spoken to princes, which have raised persecutions of long continuance and ruined Churches, silenced ministers and caused the death of multitudes of men. … It is not truth but goodness which is the ultimate object of the soul. And God who is infinite goodness itself, has revealed his truths to the world to do men good, and not to hurt them. And the Devil, who is the Destroyer, so he may but do men hurt, will be content to make use even of truth to do it; though usually he only pretends truth to cover his lies: And this angel of Light has his ministers of light and righteousness, who are known by their fruits; whilst the pretenses of light and righteousness are used to Satan’s ends and not to Christ’s, to hurt and destroy and to hinder Christ’s Kingdom, and not to save and to do good: as the wolf is known by his bloody jaws, even in his sheep’s clothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Direction 38, ‘Neglect not any truth of God, much less renounce it or deny it: for lying and contempt of sacred truth is always sinful: But yet do not take it for your duty to publish all which you judge to be truth, nor a sin to silence many lesser truths, when the Church’s peace and welfare does require it’ in The Cure of Church Divisions, Direction 38, ‘Neglect not any truth of God, much less renounce it or deny it: for lying and contempt of sacred truth is always sinful: But yet do not take it for your duty to publish all which you judge to be truth, nor a sin to silence many lesser truths, when the Church’s peace and welfare does require it’ in The Cure of Church Divisions… (London, 1670), pt. 1, pp. 208-9</span></figcaption>

</figure><figure class="quote" id="q-4a26fef0a7" data-kw="">
<blockquote><p>Our judgment is that none may publicly in the church assembly of the faithful preach the Word of God in the Name of Christ and of God, but he who is sent by a divine calling for that work; as the Protestants demonstrate against the Socinians and Anabaptists from Rom. 10:14-15; Heb. 5:4-5; Acts 13:1-2 &amp; 14:22; Tit. 1:5; 2 Tim. 2:2, and other places and arguments; and from the examples of all those, who either in an extraordinary or ordinary manner were sent to preach the Word. Which mission, or sending, consists not only in conferring gifts, whereby an ability, [Greek], is given by God; but in conferring a power, whereby is given an authority, [Latin], to preach the Word of God; which authority is oft-times not conferred on those, on whom yet God bestows gifts and ability. For it is by the Word of God denied to women, in whose lips is the Law of God, Prov. 31:26, and a fitness to teach the yonger women, Tit. 2:3-4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated</cite>, (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’, pp. 75-77</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<blockquote><p>1st Distinction. There is one power of public preaching in a Church not constitute[d], and another in a Church constitute[d]; gifted persons in extraordinary cases, where a Church is not planted, may publicly preach, but the case is otherwise in a Church constituted. … 3rd Distinction. Public preaching, as it is the ordinary mean of saving such as believe, is proper and peculiar to the Church, both subjectively, as being only in the Church, and objectively as being only exercised on the Church members per se, but upon pagans by accident. 4th Distinction. There is a call to an habitual and ordinary prophesying; here is required not only a calling by gifts, but also a collation of authority to the office, either immediately by God, or mediately by the Church, and there is a call to some particular or occasional acts of exhorting, as the martyrs and Stephen [Acts 7] are called to give confession of their faith, and a king in battle, to exhort his army, or a prince his subjects to piety, and to this latter there is no other call required but the place and profession of the exhorter, though he bee not by office a pastor. 5th Distinction. There is a formal calling of the Church, as the laying on of the hands of the elders, and a virtual and interpretative calling or tacit approbation of the Church, when learned men of eminent gifts, not in office, do write commentaries, sermons on canonic Scriptures, and tractates refuting heresies; to this the tacit approbation of the Church is required, but these have not ordinary pastoral care, nor are they the ordinary converters of souls to Christ, as the pretended prophets of [the] Separatists are. 6th Distinction. Gifted Christians may occasionally admonish, warn, rebuke and exhort one another: 1. privately; 2. without any pastoral care of souls as they are a Church, but only as they occasionally converse with them; 3. ex communi officio charitatis [out of the common office and charity], by the Law of nature, charity tying one member to help another;

4. Not authoritatively by special office; but all authority here is from the Word occasionally spoken. The pastor is to preach, 1. publicly; 2. to the Church as the Church. 3. with a pastoral obligation to all alike, whether he converse daily with them or not. 4. not only by the tie of common charity, but by a virtue of a special office.

5. With authority both objective from the Word and official from his charge. 6. and is obliged to separate himself for this charge allanerly [singly, especially or wholly], as a watchman who must give an account in a special manner to Jesus Christ.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“1st Distinction. There is one power of public preaching in a Church not constitute[d], and another in a Church constitute[d]; gifted persons in extraordinary cases, where a Church is not planted, may publicly preach, but the case is otherwise in a Church constituted. … 3rd Distinction. Public preaching, as it is the ordinary mean of saving such as believe, is proper and peculiar to the Church, both subjectively, as being only in the Church, and objectively as being only exercised on the Church members per se, but upon pagans by accident. 4th Distinction. There is a call to an habitual and ordinary prophesying; here is required not only a calling by gifts, but also a collation of authority to the office, either immediately by God, or mediately by the Church, and there is a call to some particular or occasional acts of exhorting, as the martyrs and Stephen [Acts 7] are called to give confession of their faith, and a king in battle, to exhort his army, or a prince his subjects to piety, and to this latter there is no other call required but the place and profession of the exhorter, though he bee not by office a pastor. 5th Distinction. There is a formal calling of the Church, as the laying on of the hands of the elders, and a virtual and interpretative calling or tacit approbation of the Church, when learned men of eminent gifts, not in office, do write commentaries, sermons on canonic Scriptures, and tractates refuting heresies; to this the tacit approbation of the Church is required, but these have not ordinary pastoral care, nor are they the ordinary converters of souls to Christ, as the pretended prophets of [the] Separatists are. 6th Distinction. Gifted Christians may occasionally admonish, warn, rebuke and exhort one another: 1. privately; 2. without any pastoral care of souls as they are a Church, but only as they occasionally converse with them; 3. ex communi officio charitatis [out of the common office and charity], by the Law of nature, charity tying one member to help another;

4. Not authoritatively by special office; but all authority here is from the Word occasionally spoken. The pastor is to preach, 1. publicly; 2. to the Church as the Church. 3. with a pastoral obligation to all alike, whether he converse daily with them or not. 4. not only by the tie of common charity, but by a virtue of a special office.

5. With authority both objective from the Word and official from his charge. 6. and is obliged to separate himself for this charge allanerly [singly, especially or wholly], as a watchman who must give an account in a special manner to Jesus Christ.”

— Samuel Rutherford, Other citations (work not named), Pt. 2, p. 272">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1st+Distinction.+There+is+one+power+of+public+preaching+in+a+Church+not+constitute%5Bd%5D%2C+and+another+in+a+Church+constitute%5Bd%5D%3B+gifted+persons+in+extraordinary+cases%2C+where+a+Church+is+not+planted%2C+may+publicly+preach%2C+but+the+case+is+otherwise+in+a+Church+constituted.+%E2%80%A6+3rd+Distinction.+Public+preaching%2C+as+it+is+the+ordinary+mean+of+saving+such+as+believe%2C+is+proper+and+peculiar+to+the+Church%2C+both+subjectively%2C+as+being+only+in+the+Church%2C+and+objectively+as+being+only+exercised+on+the+Church+members+per+se%2C+but+upon+pagans+by+accident.+4th+Distinction.+There+is+a+call+to+an+habitual+and+ordinary+prophesying%3B+here+is+required+not+only+a+calling+by+gifts%2C+but+also+a+collation+of+authority+to+the+office%2C+either+immediately+by+God%2C+or+mediately+by+the+Church%2C+and+there+is+a+call+to+some+particular+or+occasional+acts+of+exhorting%2C+as+the+martyrs+and+Stephen+%5BActs+7%5D+are+called+to+give+confession+of+their+faith%2C+and+a+king+in+battle%2C+to+exhort+his+army%2C+or+a+prince+his+subjects+to+piety%2C+and+to+this+latter+there+is+no+other+call+required+but+the+place+and+profession+of+the+exhorter%2C+though+he+bee+not+by+office+a+pastor.+5th+Distinction.+There+is+a+formal+calling+of+the+Church%2C+as+the+laying+on+of+the+hands+of+the+elders%2C+and+a+virtual+and+interpretative+calling+or+tacit+approbation+of+the+Church%2C+when+learned+men+of+eminent+gifts%2C+not+in+office%2C+do+write+commentaries%2C+sermons+on+canonic+Scriptures%2C+and+tractates+refuting+heresies%3B+to+this+the+tacit+approbation+of+the+Church+is+required%2C+but+these+have+not+ordinary+pastoral+care%2C+nor+are+they+the+ordinary+converters+of+souls+to+Christ%2C+as+the+pretended+prophets+of+%5Bthe%5D+Separatists+are.+6th+Distinction.+Gifted+Christians+may+occasionally+admonish%2C+warn%2C+rebuke+and+exhort+one+another%3A+1.+privately%3B+2.+without+any+pastoral+care+of+souls+as+they+are+a+Church%2C+but+only+as+they+occasionally+converse+with+them%3B+3.+ex+communi+officio+charitatis+%5Bout+of+the+common+office+and+charity%5D%2C+by+the+Law+of+nature%2C+charity+tying+one+member+to+help+another%3B+4.+Not+authoritatively+by+special+office%3B+but+all+authority+here+is+from+the+Word+occasionally+spoken.+The+pastor+is+to+preach%2C+1.+publicly%3B+2.+to+the+Church+as+the+Church.+3.+with+a+pastoral+obligation+to+all+alike%2C+whether+he+converse+daily+with+them+or+not.+4.+not+only+by+the+tie+of+common+charity%2C+but+by+a+virtue+of+a+special+office.+5.+With+authority+both+objective+from+the+Word+and+official+from+his+charge.+6.+and+is+obliged+to+separate+himself+for+this+charge+allanerly+%5Bsingly%2C+especially+or+wholly%5D%2C+as+a+watchman+who+must+give+an+account+in+a+special+manner+to+Jesus+Christ.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Other+citations+%28work+not+named%29%2C+Pt.+2%2C+p.+272&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F47c8ab8f0f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/47c8ab8f0f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-an-extraordinary-calling/#:~:text=1st%20Distinction.%20There%20is%20one%20power,a%20special%20manner%20to%20Jesus%20Christ&amp;text=1st%20Distinction.%20There%20is%20one%20power%20of%20public&amp;text=account%20in%20a%20special%20manner%20to%20Jesus%20Christ" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-2e8f33f7e8" data-kw="effectual not from cooperation">
<blockquote><p>Bellarmine says that the first makes “effectual calling to consist in the assent and cooperation of man; so that it is called effectual from the event because it brings about its effect, and does so because the human will cooperates with it; so that it is in man’s power to render sufficient grace effectual.” But this opinion brings back the very error of Pelagius, who transferred the principal cause of conversion to the free will of man. Hence it is properly rejected by Bellarmine himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.4.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/universal-call-and-particular-grace.html">Universal Call and Particular Grace</a> › <a href="../topics/effectual-calling/universal-call-and-particular-grace/the-efficacious-call-of-the-elect.html">The efficacious call of the elect</a></span><span class="t"><a href="../topics/effectual-calling/external-and-internal-call.html">External and Internal Call</a> › <a href="../topics/effectual-calling/external-and-internal-call/inward-call-by-the-spirit.html">Inward call by the Spirit</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f0bc1b9847" data-kw="irresistible vs resistible">
<blockquote><p>Whether efficacious grace operates only by a certain moral suasion which man is able either to receive or to reject. Or whether it operates by an invincible and omnipotent suasion which the will of man cannot resist. The former we deny; the latter we affirm against the Romanists and Arminians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.6.1b</span></figcaption>

— Francis Turretin, Institutes of Elenctic Theology, 15.6.1b">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhether%20efficacious%20grace%20operates%20only%20by%20a%20certain%20moral%20suasion%20which%20man%20is%20able%20either%20to%20receive%20or%20to%20reject.%20Or%20whether%20it%20operates%20by%20an%20invincible%20and%20omnipotent%20suasion%20which%20the%20will%20of%20man%20cannot%20resist.%20The%20former%20we%20deny%3B%20the%20latter%20we%20affirm%20against%20the%20Romanists%20and%20Arminians.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2015.6.1b&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff0bc1b9847.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f0bc1b9847.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-2504f5db98" data-kw="new heart Spirit">
<blockquote><p>Hence while he suggests pious thoughts to man (2 Cor. 3:5), he causes man also to consider his own way (Prov. 16:9; Hag. 1:5); while he gives a new heart and puts a new spirit within us, he makes us also to walk in his commandments (Ezk. 36:27); while he works in us both to will and to do, he sees to it that we ourselves also work out our own salvation with fear and trembling (Phil. 2:12, 13).</p></blockquote>

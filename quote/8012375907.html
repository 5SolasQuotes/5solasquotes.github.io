<main class="wrap"><figure class="quote" id="q-8012375907" data-kw="">
<blockquote><p>The [Final, 1788] Directory’s Description of Worship ORDER OF WORSHIP. The arrangement of chapters in the draft and certain procedural remarks implied the following order of worship: Prayer of adoration, invocation, and preparation Reading of Scripture Singing of praise Long prayer of adoration, confession, thanksgiving, supplication and intercession, followed by Lord’s Prayer Sermon (Lord’s Supper, when celebrated) Prayer Singing of a psalm Offering Blessing</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/american-presbyterianism.html">Presbyterian Church in the U.S.A.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First American Presbyterian Order of Worship</cite>, 1788, as given in Julius Melton, Presbyterian Worship in America</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-539838700a" data-kw="">
<blockquote><p>III. Let us consider the concluding word, Amen. It imports two things. (1.) Our desire to be heard, q.d. so be it, Rev. 22:20. ‘Amen. Even so come, Lord Jesus.’ And the believer uses this word properly as a testimony of his desire, when by faith he is enabled and emboldened to plead with God, that He would fulfill his requests, 2 Chron. 20:6,11. (2.) Our Confidence and assurance that we shall be heard; q.d. so certainly it shall be, Rev. 1:7. ‘Even so Amen.’ And the sincere Christian uses the word with great propriety in the conclusion of his prayers, in testimony of his assurance to be heard, when he is by faith emboldened quietly to rest upon the Lord, that He will fulfill the desires of his heart, 2 Chron. 14:11. I conclude all with a very few inferences. … 4. Lastly, Use not Amen superficially at the end of your prayers, but with earnestness and faith. As for those who think it superstition to say Amen, they are ignorant of the word of God; and I would recommend to them to consult their Bible and Catechism, in order to cure them of that senseless conceit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Illustration of the Doctrines of the Christian Religion, ‘The Conclusion of the Lord’s Prayer’, in his Works</cite>, vol. 2, pp. 642-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-1e1e0634df" data-kw="">
<blockquote><p>Secondly, the farther that the members or Churches, either congregational, presbyterial, or national, are removed in local distance one from another, the less is the visible and external communion of rebuking, comforting, and admonishing one another; yet the power and obligation of these duties are not removed. So though the national Churches be locally distant one from another, yet their power of exercising duties… is not from thence concluded to be null. Yea, national duties upon occasion are still obligatory, and communion of men of sundry nations is clear to me, Isa. 2:3, ‘many nations shall flow unto the mountain of the Lord’s House,’ Zech. 8:23, ‘Ten men shall take hold out of all languages of the nations, they even shall take hold of the skirt of him that is a Jew, saying, we will go with you, for we have heard that God is with you.’ …the places [of Scripture] do well prove the power-lawful of performing duties, whereas the exercise of them in one place is not hic &amp; nunc, in ordinary providence, possible. And so this consequence must be weak: the whole catholic visible Churches in their principal guides cannot ordinarily and constantly meet, hic &amp; nunc, for the exercise of their power; Therefore they have no such power. For if the power be exercised in parts, which, through occurrences of providence and the corruption of men’s nature, cannot be exercised in whole at once, yet it’s not hence evinced [proven] to be a power not given of Christ for edification;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 1, pp. 300-301</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

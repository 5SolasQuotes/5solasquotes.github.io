<blockquote><p>d. Finally, there is an objection derived from the bona fide [with good faith] offer of salvation… … (3) The universal offer of salvation does not consist in the declaration that Christ made atonement for every man that hears the gospel, and that God really intends to save each one. It consists in: (a) an exposition of the atoning work of Christ as in itself sufficient for the redemption of all men; … (c) a declaration that each one who comes to Christ with true repentance and faith will obtain the blessings of salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology (1950; Banner of Truth) | VI. The Purpose &amp; Extent of the Atonement, 4. Objections to the Doctrine of a Limited Atonement</cite>, pp. 397-98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-efe6226578" data-kw="">
<blockquote><p>Let us then see what the kingdom of Christ is, which begins in the faithful in this world… The kingdom of Christ in this world is the administration of salvation, whereby Jesus Christ the king Himself, outwardly gathers to Himself through the Gospel and sacrament of baptism, a people or visible Church (in which many hypocrites are mingled) and calls them to salvation, and administers and gives Himself the same salvation to which He calls them, in those whom He accounts for his elect in this congregation…</p></blockquote>

<blockquote><p>II. Among the ancients, it appears that the universality of redemption was contended for by the Pelagians and Semipelagians. Hence Prosper [of Aquitaine, c. 390 – c. 455 AD] (concerning the remains of the Pelagian heresy) says, ‘This is their definition and profession that Christ died for the whole human race and that no one is excluded from the redemption effected by his blood’ (Letter to Augustine 6 [ACW 32:43; PL 33.1005]). And among the damnable errors which they boasted of having found in Augustine was this also: ‘The Savior was not crucified for the redemption of the whole world.’ Faustus (Rhegiensis) [a semi-pelagian prelate, d. c. 485 A.D.] says, ‘They wander far from the path of piety who say that the Savior did not die for all’ (De Gratia Dei et Libero Arbitrio 1.4 [PL 58.789])</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, vol. 2, 14th Topic, ‘The Mediatorial Office of Christ’, Question 14</cite>, p. 455</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-df5b903686" data-kw="">
<blockquote><p>But as much as many being called by the Gospel do not repent nor believe in Christ, but perish in their infidelity, this comes not to pass for want of, or by any insufficiency of the sacrifice of Christ offered upon the Cross, but by their own default.</p></blockquote>

</figure><figure class="quote" id="q-750d639e01" data-kw="">
<blockquote><p>You will remember the multitude He has redeemed; not me alone, nor you alone, but “a multitude that no man can number,” which shall as far exceed the stars of heaven for number, as they exceed all mortal reckoning. Christ hath bought for Himself, some out of every kingdom, and nation, and tongue, under heaven; He hath redeemed from among men some of every rank, from the highest to the lowest; some of every colour—black and white; some of every standing in society, the best and the worst. For some of all sorts hath Jesus Christ given Himself a ransom that they might be redeemed unto Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Justification by Grace”</cite>, sermon on Rom. 3:24</span></figcaption>

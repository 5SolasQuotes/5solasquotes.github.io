<main class="wrap"><figure class="quote" id="q-c7550de74c" data-kw="">
<blockquote><p>For the more clear opening of the ensuing treatise it is necessary to speak somewhat of worship and adoration, and especially of these: 1. honor. 2. praise. 3. glory, 4. reverence. 5. veneration. 6. devotion. 7. religion. 8. service. 9. worship. 10. love. 11. obedience. 12. adoration. 1. Honor, is a testification of the excellency of any, Aristotle, Ethics, bk. 8, ch. 8; Aquinas, Honos est signum quoddam excellentiae. ‘Honour is a sign or expression of excellency in any,’ it does not import any superiority in the party whom we honor, as adoration does. [2.] Praise is a special honoring of any, consisting in words. [3.] Glory is formally the effect of honor, though it be taken, pro claritate, ‘for the celebrity’ or renownedness of any; yet glory seems to be founded upon celebrity, as its foundation. [4.] Reverence is a sort of veneration of a person for excellency connotating a sort of fear. [5.] Veneration is a sort of fear, and reverencing of a person: I see not well any difference between reverence and veneration, except that veneration seems to be some more, and comes nearer to adoration. [6.] Devotion is the promptitude, cheerfulness, or spiritual propension of the will to serve God; [7.] Religion is formally in this, when a man subjects himself to God, as to his supreme Lord, and thence arises to give him honor, as his God and absolute Lord. The two integral parts of religion are the subjection of the reasonable creature to God. 2. An exhibition of honour… [8.] Service is from the bond of subjection, to reverence God as an inferior or servant does his Lord and Master: A servant does properly do the will of his master for the gain or profit that redounds to his master… [9.] For worship formally is to give reverence to God for his excellency; in one and the same act we may both worship God and serve Him. Only service does include the obligation of a servant to a lord. As concerning [10.] love, faith and hope, they are internal worship, not properly adoration: Love as love does rather import an equality with the thing loved, and a desire of an union, rather than a submission. It is true, there is a perfection in that which we love, but not essentially to perfect the lover… Faith and hope may suppose a resting on a helper as a helper, and so are internal worship; if they be adoration formally may be a question… [11.] Obedience is founded, not formally upon God’s excellency, properly so called, but upon his jurisdiction and authority to command. [12.] Adoration is the subjection or prostration of soul or body to God in the due recognition and acknowledgement of his absolute supremacy. There is no need, that Vasquez [a Romanist] should deny that there is any internal adoration, for that adoration is only an external and bodily worship of God, can hardly be defended… as external adoration is an act by which we offer our bodies to God and subject the utter man to him, in sign of service and reverence to so supreme a Lord, so there is a heart-prostration and inward bowing of the soul answerable thereunto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646) | Introduction, Section 6, ‘What Honor, Praise, Glory, Reverence, Veneration, Devotion, Service, Worship, etc. are’</cite>, p. 83</span></figcaption>

<blockquote><p>…whereat Paybody [a Formalist] starts and replies that the gestures which the people of God used in circumcision and baptism, the renting of the garment used in humiliation and prayer, Ezra 9:5; 2 Kings 22:19; Jer. 36:24, lifting up the hands, kneeling with the knees, uncovering the head in the sacrament, standing and sitting at the sacrament, were and are significant in worshipping, yet are not forbidden by the 2nd Commandment. Answer: There are three sorts of signs here to be distinguished: 1. Natural signs: so smoke is a sign of fire, and the dawning of the day a sign of the rising of the sun. 2. Customable signs, and so the uncovering of the head, which of old [in the OT, exampled by the priests] was a sign of preeminence, has through custom become a sign of subjection [such as in 1 Cor. 11]. 3. Voluntary signs, which are called signa instituta; these are either sacred or civil. To appoint sacred signs of heavenly mysteries or spiritual graces, is God’s own peculiar, and of this kind are the holy sacraments. Civil signes for civil and moral uses, may be and are commendably appointed by men, both in Church and commonwealth, and thus the tolling of a bell is a sign given for assembling, and has the same signification both in ecclesiastical and secular assemblings. Now, besides the sacred signs of God’s own institution, we know that natural signs have also place in divine worship; thus kneeling in time of prayer signifies the submission of our hearts and minds, the lifting up of our eyes and hands signifies the elevation of our affections, the renting of the garments signified the renting of the heart by sorrow, standing with a religious respect to that which is before us signifies veneration or reverence, sitting at table signifies familiarity and fellowship. For which of you, says our Master [Lk. 17:7], having a servant plowing or feeding cattle, will say unto him by and by, when he is come from the field, go and sit down to meat. All these signs have their significations from nature. … Secondly, customable signs have likewise place in divine service, for so a man coming into one of our churches, in time of public worship, if he see the hearers covered, he knows by this customable sign that [the] sermon is begun. Thirdly, civil or moral signs instituted by men, for that common order and decency, which is respect both in civil and sacred actions, have also place in the acts of God’s worship. Thus a basen and a laver set before a pulpit are signs of baptism to be ministered: but common decency teaches us to make the same use of basin and a laver in civility which a minister makes of them in the action of baptizing. All our question [with the Formalists, on the other hand] is about sacred mystical signs. Every sign of this kind, which is not ordained of God, we refer to the imagery forbidden in the 2nd Commandment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637) | 3rd Part, ‘Against the Lawfulness of the Ceremonies’ | ch. 5, ‘5th Argument… taken from the mystical &amp; significant nature of them’</cite>, pp. 85-86</span></figcaption>

f+the+heart+by+sorrow%2C+standing+with+a+religious+respect+to+that+which+is+before+us+signifies+veneration+or+reverence%2C+sitting+at+table+signifies+familiarity+and+fellowship.+For+which+of+you%2C+says+our+Master+%5BLk.+17%3A7%5D%2C+having+a+servant+plowing+or+feeding+cattle%2C+will+say+unto+him+by+and+by%2C+when+he+is+come+from+the+field%2C+go+and+sit+down+to+meat.+All+these+signs+have+their+significations+from+nature.+%E2%80%A6+Secondly%2C+customable+signs+have+likewise+place+in+divine+service%2C+for+so+a+man+coming+into+one+of+our+churches%2C+in+time+of+public+worship%2C+if+he+see+the+hearers+covered%2C+he+knows+by+this+customable+sign+that+%5Bthe%5D+sermon+is+begun.+Thirdly%2C+civil+or+moral+signs+instituted+by+men%2C+for+that+common+order+and+decency%2C+which+is+respect+both+in+civil+and+sacred+actions%2C+have+also+place+in+the+acts+of+God%E2%80%99s+worship.+Thus+a+basen+and+a+laver+set+before+a+pulpit+are+signs+of+baptism+to+be+ministered%3A+but+common+decency+teaches+us+to+make+the+same+use+of+basin+and+a+laver+in+civility+which+a+minister+makes+of+them+in+the+action+of+baptizing.+All+our+question+%5Bwith+the+Formalists%2C+on+the+other+hand%5D+is+about+sacred+mystical+signs.+Every+sign+of+this+kind%2C+which+is+not+ordained+of+God%2C+we+refer+to+the+imagery+forbidden+in+the+2nd+Commandment.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29+%7C+3rd+Part%2C+%E2%80%98Against+the+Lawfulness+of+the+Ceremonies%E2%80%99+%7C+ch.+5%2C+%E2%80%985th+Argument%E2%80%A6+taken+from+the+mystical+%26+significant+nature+of+them%E2%80%99%2C+pp.+85-86&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd353662d30.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d353662d30.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-veneration-as-distinguished-from-the-worship-of-adoration/#:~:text=whereat%20Paybody%20%5Ba%20Formalist%5D%20starts%20and,imagery%20forbidden%20in%20the%2 <blockquote><p>4. As in serious prayer, specially in secret, the affections of the heart do utter themselves in the answerable gestures of the body, as well as in the voice and words of the mouth: so those gestures have their own speech unto God, no less than the words of the mouth have; as here, ‘I have stretched out my hands unto Thee,’ is brought forth to express his submissive rendering up of himself unto God and his dependance upon him.</p></blockquote>

</figure><figure class="quote" id="q-60e895d05e" data-kw="">
<blockquote><p>Paybody [a Formalist] thinks kneeling in the act of receiving the communion to be expedient for the reverend using and handling of that holy sacrament, and that much reverence arises to the sacrament from it. Answer: I verily believe that more reverence arises to the sacrament from kneeling than is due to it; But I am sure there is no less true reverence of that holy sacrament among such as kneel not in the receiving of it than among such as do kneel. I hope it is not unknown how humbly and reverently many sincere Christians, with fear and trembling, do address themselves to that most holy sacrament, who yet for all the world, would not kneel in receiving it. Thus we see that these expediencies pretended for the ceremonies are attained unto as well and better without them, than by them.</p></blockquote>

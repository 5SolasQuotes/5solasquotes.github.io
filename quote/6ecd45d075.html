<main class="wrap"><figure class="quote" id="q-6ecd45d075" data-kw="">
<blockquote><p>The next thing in order of time seems to be the appointment of the Christian Sabbath. For though this was gradually established in the Christian church, yet these things by which the revelation of God’s mind and will was made, began on the day of Christ’s resurrection, by his appearing then to his disciples, John xx 19; and was afterwards confirmed by his appearing from time to time on that day rather than any other, John xx. 26 and by his sending down the Holy spirit so remarkably on that day, Acts ii. 1. and afterwards in directing that public assemblies and the public worship of Christians should be on that day, which may be concluded from Acts xx. 7 1 Cor. xvi. 1, 2, and Rev. i. 10.

And so the day of the week on which Christ arose from the dead, that joyful day, is appointed to be the day of the church’s holy rejoicing to the end of the world, and the day of their stated public worship. This is a very great and principal means of the success which the gospel has had in the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A history of the work of redemption. Containing the outlines of a body of divinity, in a method entirely new</cite>, ed. John Erskine (1774; Boston, 1782), p. 185.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-73c2c6e6b7" data-kw="">
<blockquote><p>And yet I will not deny but that there have been and are mistakes in this matter leaning towards the other extreme. Directions have been given, and that not by a few, for the observation of a day of holy rest, which, either for the matter of them or the manner prescribed, have had no sufficient warrant or foundation in the Scripture.

For whereas some have made no distinction between the Sabbath as moral and as Mosaical, unless it be merely in the change of the day, they have endeavoured to introduce the whole practice required on the latter into the Lord’s day. But we have already showed that there were sundry additions made unto the command, as to the manner of its observance, in its accommodation unto the Mosaical pedagogy, besides that the whole required a frame of spirit suited thereunto.

Others, again, have collected whatever they could think of that is good, pious, and useful in the practice of religion, and prescribed it all, in a multitude of instances, as necessary to the sanctification of this day; so that a man can scarcely in six days read over all the duties that are proposed to be observed on the seventh. And it hath been also no small mistake, that men have laboured more to multiply directions about external duties, giving them out as it were by number or tale, than to direct the mind or inward man in and unto a due performance of the whole duty of the sanctification of the day, according to the spirit and genius of gospel obedience.

And, lastly, it cannot be denied but that some, it may be measuring others by themselves and their own abilities, have been apt to tie them up unto such long, tiresome duties, and rigid abstinences from refreshments, as have clogged their minds, and turned the whole service of the day into a wearisome bodily exercise, that profiteth little.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercitations Concerning the Name, Original, Nature, Use, and Continuance of a Day of Sacred Rest</cite>, (1671), Ex. 6, § 6 in An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations, ed. W. H. Goold (7 vols, Edinburgh: Johnston and Hunter, 1854), 2: 441.</span></figcaption>

</figure><figure class="quote" id="q-a58bf7ba85" data-kw="">
<blockquote><p>When commenting on Abel’s sacrifice when preaching on Hebrews 11:4, William Perkins observed that even some ceremonial laws partly set forth moral duties that, when stripped of their ceremonial form, remain valid in every age (cf. Westminster Confession 19.3):

Now for us the truth is, this law binds us not, for it was a ceremony and is ended in Christ. Yet the equity and use of it reaches even to us – namely, it teaches us when we will give anything unto God, to give the best we have. This is the equity of those laws ceremonial, which commanded them to give to the Lord their firstborn and their firstfruits and the fattest of their cattle. And so much of them do still bind us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Cloud of Faithful Witnesses, Leading to the Heavenly Canaan: Or, A Commentary upon the 11th Chapter to the Hebrews</cite>, (1609) in The Works of William Perkins: Volume 3, eds Randall J. Pederson and Ryan M. Hurd (Grand Rapids: Reformation Heritage Books, 2017), p. 37.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>Three things about the worship of God are to be considered:

1. The kinds of it…

2. The parts of it…

3. There are certain circumstances and solemnities for the manner of celebrating those parts and kinds: Now the two former must be expressly commanded. The later must not be forbidden nor condemned, only a thing of solemnity is changed into a part when a religious necessity is imposed upon it, and a spiritual efficacy conceived to be annexed unto it, as appears in the priests’ garments in the Law. Thus for example: Prayer is a kind of God’s worship; the confession of sins, petition and thanksgiving for benefits be parts of this kind of worship, and so are the person to whom, and the person in whose name necessary things for the matter of the worship. But now, whether I pray in such or such a place, whether with eyes lift up or cast down, whether kneeling or standing, whether with mine head covered or uncovered, these are certain points of solemnity, as it were adjuncts of the exercise. And here it is sufficient, that I use no such circumstance as is condemned, nor neglect any that is commanded; but if I do esteem it a matter of religious necessity to Godward… I do now turn the circumstance into a part of worship, and seeing it is not from God, of false worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, 1654), 9th Book, of the Moral Law, ch. 3, 2nd Commandment, p. 772</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

2. The parts of it…

3. There are certain circumstances and solemnities for the manner of celebrating those parts and kinds: Now the two former must be expressly commanded. The later must not be forbidden nor condemned, only a thing of solemnity is changed into a part when a religious necessity is imposed upon it, and a spiritual efficacy conceived to be annexed unto it, as appears in the priests’ garments in the Law. Thus for example: Prayer is a kind of God’s worship; the confession of sins, petition and thanksgiving for benefits be parts of this kind of worship, and so are the person to whom, and the person in whose name necessary things for the matter of the worship. But now, whether I pray in such or such a place, whether with eyes lift up or cast down, whether kneeling or standing, whether with mine head covered or uncovered, these are certain points of solemnity, as it were adjuncts of the exercise. And here it is sufficient, that I use no such circumstance as is condemned, nor neglect any that is commanded; but if I do esteem it a matter of religious necessity to Godward… I do now turn the circumstance into a part of worship, and seeing it is not from God, of false worship.”

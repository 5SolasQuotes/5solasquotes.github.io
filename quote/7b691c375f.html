<main class="wrap"><figure class="quote" id="q-7b691c375f" data-kw="">
<blockquote><p>And the Gospel directs us to renewed acts of Repentance and Faith upon our short comings. The Children of God, being renewed but in part, can do no duty entirely perfect, according to the tenor of the first Covenant; and having the remainders of sin in them, which is a Law in their members, and a body of death, often takes advantage to make Captives of them, and draw them to acts of disobedience: now all the defects, in the Obedience of the Children of God are hidden under the Robe of Christ’s Righteousness; and there is a pardon out upon his account, to be applied to them for all their follies; but yet, as faith tells us that there is an Advocate with the Father for us if we sin, so it tells us that we ought not to sin, 1 Joh. 2.1.

And besides, we are acquainted, that all the sins of believers themselves, which have boldness or presumption attending upon them, do make a breach between God and them, though not to their rejection, yet to their feeling of his holy displeasure, by some manifest discoveries of it: and the way to have this breach made up again is thus prescribed. And we are told, 2 Cor. 7.10. That Godly sorrow worketh repentance into Salvation not to be repented of.

Yea the very daily unavoidable imperfections of God’s Children, call for the continued exercise of Repentance and Faith: In which Repentance we acknowledge our sins, and our just deservings by them, and do with grief and hatred renounce them; and in which Faith, we go to Christ for the pardon of these, the covering of them under his Robe, and the new witnessing in us to our Justification, and for more strength to be given us to withstand the Suggestions of Satan and Solicitations of the carnal part in us. All of these things most plainly discover what a value the Doctrine of faith in Christ puts upon the Law of God as a Rule.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The law established by the Gospel or, A brief discourse, wherein is asserted and declared, the great honour which is put upon the law of God, in the Gospel way of justification be faith alone. Being the substance of a sermon preached on the lecture in Boston, September 20. 1694</cite>, (Boston MA: Michael Perry, 1694), pp 32-33.</span></figcaption>

</figure><figure class="quote" id="q-d2e4f6dd17" data-kw="">
<blockquote><p>Another way we have of apprehending him, by way of negation, denying all the imperfections of the creatures, and removing them at an infinite distance from him; and truly, though this be an imperfection in knowledge, yet it is the greatest knowledge we can attain to, to know rather what he is not, than what he is.

He is not limited to any place, nor bounded with any measures and degrees of perfection, as creatures are; therefore we call him infinite: he is not comprehended within the limits of time, but comprehends all within himself; therefore he is eternal: he is not subject to changes and alterations; therefore called immutable: he is not compounded, as a result of divers parts; therefore he is most purely simple, and one: he is not like those things we see and hear, that fall under our senses; therefore we call him a Spirit, or a spiritual Being.

Now, in all these weak endeavours of man, to detain and fix his own spirit in the contemplation of God, if he cannot reach the understanding of what God is, yet certainly he will attain this great point of wisdom, — not to be ignorant of his own ignorance. And truly, my beloved, this is the thing I would have us to learn to know, that the admiration of God in silence is the best expression of him.

We would not search into these mysteries, to satisfy our curiosity, but rather compose our hearts to a continual silent wondering before him; for where our understandings are confounded, and our minds overwhelmed with the infiniteness of that glory, so that we can see nothing but our ignorance of all, this should certainly compose all to quiet admiration, for silence and wonder is the proper and natural posture of a soul that is at a stand, and can neither win [i.e. get] forward for inaccessible light, nor will retire backward, for that it apprehends already.</p></blockquote>

<blockquote><p>4. [God justifies] By way of Execution, when the sentence is executed. This is in part done here, as God takes off the penalties and fruits of sin, either in the way of his internal or external government, and gives us many blessings, as the pledge of his love, and above all, the gift of the Holy Spirit, whereby He sanctifies us more thoroughly, and works in us that which is pleasing in his sight: This He gives as the God of peace, as reconciled to us in Christ, Heb. 13:20-21: ‘Now the God of peace that brought again from the dead our Lord Jesus, that great shepherd of the sheep, through the blood of the everlasting Covenant, make you perfect in every good work, to do his will, working in you that which is pleasing in his sight, through Jesus Christ.’ 1 Thess. 5:23: ‘And the very God of peace sanctify you wholly: and I pray God your whole spirit, and soul, and body, be preserved blameless unto the coming of our Lord Jesus Christ;’ Faithful is he that calls you, who will do it: but more fully at the Last Day, when we enter into everlasting glory; and the wicked are turned into Hell with the Devil and his angels, Mt. 25:46, ‘And these shall go into everlasting punishment; but the righteous into life eternal’: then is the full and final execution, a perfect freedom from all misery, and a possession of all happiness.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“4. [God justifies] By way of Execution, when the sentence is executed. This is in part done here, as God takes off the penalties and fruits of sin, either in the way of his internal or external government, and gives us many blessings, as the pledge of his love, and above all, the gift of the Holy Spirit, whereby He sanctifies us more thoroughly, and works in us that which is pleasing in his sight: This He gives as the God of peace, as reconciled to us in Christ, Heb. 13:20-21: ‘Now the God of peace that brought again from the dead our Lord Jesus, that great shepherd of the sheep, through the blood of the everlasting Covenant, make you perfect in every good work, to do his will, working in you that which is pleasing in his sight, through Jesus Christ.’ 1 Thess. 5:23: ‘And the very God of peace sanctify you wholly: and I pray God your whole spirit, and soul, and body, be preserved blameless unto the coming of our Lord Jesus Christ;’ Faithful is he that calls you, who will do it: but more fully at the Last Day, when we enter into everlasting glory; and the wicked are turned into Hell with the Devil and his angels, Mt. 25:46, ‘And these shall go into everlasting punishment; but the righteous into life eternal’: then is the full and final execution, a perfect freedom from all misery, and a possession of all happiness.”

— Thomas Manton, A Second Volume of Sermons preached by the late reverend and learned Thomas Manton, … (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33, p. 334">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+%5BGod+justifies%5D+By+way+of+Execution%2C+when+the+sentence+is+executed.+This+is+in+part+done+here%2C+as+God+takes+off+the+penalties+and+fruits+of+sin%2C+either+in+the+way+of+his+internal+or+external+government%2C+and+gives+us+many+blessings%2C+as+the+pledge+of+his+love%2C+and+above+all%2C+the+gift+of+the+Holy+Spirit%2C+whereby+He+sanctifies+us+more+thoroughly%2C+and+works+in+us+that+which+is+pleasing+in+his+sight%3A+This+He+gives+as+the+God+of+peace%2C+as+reconciled+to+us+in+Christ%2C+Heb.+13%3A20-21%3A+%E2%80%98Now+the+God+of+peace+that+brought+again+from+the+dead+our+Lord+Jesus%2C+that+great+shepherd+of+the+sheep%2C+through+the+blood+of+the+everlasting+Covenant%2C+make+you+perfect+in+every+good+work%2C+to+do+his+will%2C+working+in+you+that+which+is+pleasing+in+his+sight%2C+through+Jesus+Christ.%E2%80%99+1+Thess.+5%3A23%3A+%E2%80%98And+the+very+God+of+peace+sanctify+you+wholly%3A+and+I+pray+God+your+whole+spirit%2C+and+soul%2C+and+body%2C+be+preserved+blameless+unto+the+coming+of+our+Lord+Jesus+Christ%3B%E2%80%99+Faithful+is+he+that+calls+you%2C+who+will+do+it%3A+but+more+fully+at+the+Last+Day%2C+when+we+enter+into+everlasting+glory%3B+and+the+wicked+are+turned+into+Hell+with+the+Devil+and+his+angels%2C+Mt.+25%3A46%2C+%E2%80%98And+these+shall+go+into+everlasting+punishment%3B+but+the+righteous+into+life+eternal%E2%80%99%3A+then+is+the+full+and+final+execution%2C+a+perfect+freedom+from+all+misery%2C+and+a+possession+of+all+happiness.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+A+Second+Volume+of+Sermons+preached+by+the+late+reverend+and+learned+Thomas+Manton%2C+%E2%80%A6+%28London%3A+Astwood%2C+1684%29%2C+Sermons+on+Rom.+8%2C+Sermon+43%2C+on+Rom.+8%3A33%2C+p.+334&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquo

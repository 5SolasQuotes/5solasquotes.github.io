<main class="wrap"><figure class="quote" id="q-6f01bb37e2" data-kw="without beginning">
<blockquote><p>God is without beginning. “In the beginning God created” the world, Gen. 1:1. God was then before the beginning of it; and what point can be set wherein God began, if he were before the beginning of created things? God was without beginning, though all other things had time and beginning from him. As unity is before all numbers, so is God before all his creatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Eternity of God</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/eternity.html">Eternity</a> › <a href="../topics/attributes-of-god/eternity/timelessness.html">Timelessness</a></span><span class="t"><a href="../topics/attributes-of-god/spirituality-and-aseity.html">Spirituality and Aseity</a> › <a href="../topics/attributes-of-god/spirituality-and-aseity/self-existence.html">Self-existence</a></span></div>

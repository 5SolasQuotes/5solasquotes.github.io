</figure><figure class="quote" id="q-f9c7f70eeb" data-kw="">
<blockquote><p>They [older non-conformists] argue that there is no necessity for [total] Separation for the sake of such corruptions, because a person may communicate in the worship without partaking in those corruptions… 1. This separation of the good from the bad in divine worship they grant possible. So Mr. [John] Ball: ‘If some things human be mixed with divine, a sound Christian must separate the one from the other, and not cast away what is of God as a nullity, fruitless, unprofitable, defiled, because somewhat of men is annexed unto them. In the body we can distinguish betwixt the substance and the sickness which cleaves unto it; betwixt the substance of a part or member, and some bunch or swelling, which is a deformity, but destroys not the nature of that part or member, etc.’ (Trial of the Grounds, etc., [ch. 13,] p. 308) … 2. They grant that what is faulty and a sin in worship, is no sin to us when we do not consent to it. So Mr. [John] Corbet: ‘My partaking in any divine worship, which is holy and good for the matter and allowable or passable in the mode for the main, does not involve me in the blame of some sinful defects therein, to which I consent not and which I cannot redress.’ (Non-Conformists Plea, etc., p. 6) So another [John Barret], in his Farewell Sermon: ‘While all necessary fundamental truth is publicly professed and maintained in a Church, is taught and held forth in public assemblies and the corruptions there (though great, yet) are not such as make the worship cease to be God’s worship, nor of necessity to be swallowed down if one would communicate in that worship, while any Christian (that is watchful over his own heart and carriage, as all ought ever to be) may partake in the one, without being active in, or approving the other; there God is yet present, there he may be spiritually worshipped, served acceptably, and really enjoyed.’ (England‘s Remembrancer, sermon 4, p. 94)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/degrees-of-impurities.html">Degrees of Impurities</a></span><span class="wk"><span class="lbl">Work:</span> <cite>London Ministers | A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, John Williams, ‘The Non-Conformists’ Plea for Lay-Communion with the Church of England’ Williams (d. 1709) was an Anglican bishop.</cite>, p. 32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-a63c0c2f96" data-kw="">
<blockquote><p>Q. 154. What are the outward means whereby Christ communicates to us the benefits of his mediation? A. The outward and ordinary means whereby Christ communicates to his church the benefits of his mediation, are all his ordinances; especially the word, sacraments, and prayer; all which are made effectual to the elect for their salvation.[l] [l] Matt. 28:19,20. Acts 2:42,46,47. Q. 155. How is the word made effectual to salvation? A. The Spirit of God maketh the reading, but especially the preaching of the word, an effectual means of enlightening,[m] convincing, and humbling sinners;[n] of driving them out of themselves, and drawing them unto Christ;[o] of conforming them to his image,[p] and subduing them to his will;[q] of strengthening them against temptations and corruptions;[r] of building them up in grace,[s] and establishing their hearts in holiness and comfort through faith unto salvation.[t] [m] Neh. 8:8. Acts 26:18. Ps. 19:8. [n] 1 Cor. 14:24,25. 2 Chron. 34:18,19,26-28. [o] Acts 2:37,41. Acts 8:27-39. [p] 2 Cor. 3:18. [q] 2 Cor. 10:4-6. Rom. 6:17. [r] Matt. 4:4,7,10. Eph. 6:16,17. Ps. 19:11. 1 Cor. 10:11. [s] Acts 20:32. 2 Tim. 3:15-17. [t] Rom. 16:25. 1 Thess. 3:2,10,11,13. Rom. 15:4. Rom. 10:13-17. Rom. 1:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Larger Catechism</cite></span></figcaption>

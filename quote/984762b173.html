<main class="wrap"><figure class="quote" id="q-984762b173" data-kw="">
<blockquote><p>Neither has this variety [of catechisms] been looked upon as hurtful, for if so, then holy men would have kept to what they found, and have made conscience of increasing this evil by adding to the number; ‘I find’ (says Dr. Gouge, Epistle to his Catechism): ‘in all ages of the Church, God has stirred up many of his servants to publish several forms, all agreeable in the substance, and I observe among many other, these two good uses to arise from thence, etc.’ which there he specifies; nay, since this of the [Westminster] Assembly, composed by a synod of holy and learned men, approved of, and commended to the nation by the parliament then sitting, and received and settled in Scotland, yet men’s consciences have not been satisfied in this, as the only catechism fit to be used, as appears in the great number and variety of catechisms composed and printed since this was published, a greater number then in so short a time were ever published before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beams of Former Light: discovering how Evil it is to Impose doubtful and disputable forms or practices, upon ministers: especially under the penalty of ejection for non-conformity unto the same. As also something about catechizing</cite>, Beams of Former Light: discovering how Evil it is to Impose doubtful and disputable forms or practices, upon ministers: especially under the penalty of ejection for non-conformity unto the same. As also something about catechizing. (London: 1660) This was published just before the Great Ejection of 1662., pp. 86-87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“Neither has this variety [of catechisms] been looked upon as hurtful, for if so, then holy men would have kept to what they found, and have made conscience of increasing this evil by adding to the number; ‘I find’ (says Dr. Gouge, Epistle to his Catechism): ‘in all ages of the Church, God has stirred up many of his servants to publish several forms, all agreeable in the substance, and I observe among many other, these two good uses to arise from thence, etc.’ which there he specifies; nay, since this of the [Westminster] Assembly, composed by a synod of holy and learned men, approved of, and commended to the nation by the parliament then sitting, and received and settled in Scotland, yet men’s consciences have not been satisfied in this, as the only catechism fit to be used, as appears in the great number and variety of catechisms composed and printed since this was published, a greater number then in so short a time were ever published before.”

b173.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=Neither%20has%20this%20variety%20%5Bof%20catechisms,a%20time%20were%20ever%20published%20before&amp;text=Neither%20has%20this%20variety%20%5Bof%20catechisms%5D%20been%20looked&amp;text=so%20short%20a%20time%20were%20ever%20published%20before" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-db801550a1" data-kw="">
<blockquote><p>Classis Walcheren in Zeeland [in 1574] drafted the earliest form of subscription used by ministers: ‘We the undersigned ministers of the Word of God, within these islands of Walcheren, do hereby believe and confess that the written [Belgic] Confession of Faith of the Christian churches of the Netherlands, lying under Spanish rule, contained in 37 articles and printed again in the year 1573 at Dordrecht, conforms (ghelijkformigh is) in all parts to the Word of God. And so we promise to orient our doctrine and worship to it, in our teaching, consolation, and admonition, and to oppose what conflicts with it, according to our abilities.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/netherlands.html">Donald Sinnema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Origin of the Form of Subscription in the Dutch Reformed Tradition” in Calvin Theological Journal</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“Classis Walcheren in Zeeland [in 1574] drafted the earliest form of subscription used by ministers: ‘We the undersigned ministers of the Word of God, within these islands of Walcheren, do hereby believe and confess that the written [Belgic] Confession of Faith of the Christian churches of the Netherlands, lying under Spanish rule, contained in 37 articles and printed again in the year 1573 at Dordrecht, conforms (ghelijkformigh is) in all parts to the Word of God. And so we promise to orient our doctrine and worship to it, in our teaching, consolation, and admonition, and to oppose what conflicts with it, according to our abilities.&#x27;”

</figure><figure class="quote" id="q-c0d9ddd83a" data-kw="">
<blockquote><p>…obey the sayings and doings of your parents that concern you, even that which they say or do to you ‘in all things’; we are to expound these words by those, Eph. 6:1, ‘Children obey your parents in the Lord,’ and so the meaning is in all things honest, lawful and agreeable to the Word of God.</p></blockquote>

</figure><figure class="quote" id="q-39ccd92681" data-kw="Councils">
<blockquote><p>The authority of councils sinks far below that of the Scriptures, nor do their decisions bind the conscience any further than they appear to be conformed to the word of God. Hence a judgment belongs to them in matters of faith; not authoritative, infallible and supreme, but subaltern and ministerial; obligatory as to the external order of ecclesiastical communion and which ought to be of great weight among all the pious, but not as to faith and conscience, except insofar as they coincide with the Scriptures, which alone can bind the conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.33.14</span></figcaption>

</figure><figure class="quote" id="q-1fbe464489" data-kw="">
<blockquote><p>It seems to the present writer that to demand acceptance of every proposition in so extensive a series of documents [as the Westminster Confession and Catechisms] would be incompatible with the avowal made in answer to the first question to the formula of subscription and comes dangerously close to the error of placing human documents on a par with holy Scripture.</p></blockquote>

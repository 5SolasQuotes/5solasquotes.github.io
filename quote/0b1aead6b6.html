<main class="wrap"><figure class="quote" id="q-0b1aead6b6" data-kw="">
<blockquote><p>That their conformity with the Brownists [separatists] may be full, the New-English [New England congregationalists] do count sitting at a table, not only to be necessary, but to be a part of our imitation of Christ, and a rite significant of diverse heavenly privileges and comforts; but as the Brownists at Amsterdam this day have no table at all, as they send the elements from the pulpit (the place where the minister preaches and celebrates the sacrament) by the hand of the deacon to all the congregation, where in their meeting-house they sit up and down in their several places: So the Independents at London do vehemently contend for the needlessness of any to come to the Table, whatever be the practice of all the rest of the Reformed Churches: But they will have the holy seals carried from the place where the minister preaches to the people in their pews, or wherever else they have their ordinary places for hearing of the Word; although most easily in their small congregations without any disturbance all might be brought to the Table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map</cite>, … (London, 1645), ch. 6, ‘An Enumeration of the Common Tenets of the Independents’, pp. 122-23 The first part of the quote deals with taking the table too far.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-98a8c10b1e" data-kw="">
<blockquote><p>That has been the uniform and constant order of this Church [of Scotland], since the reformation [in 1560]: that the communicants should receive the sacramental elements of bread and wine, sitting at the table. In the second head of the First Book of Discipline [of the Church of Scotland, 1560], are set down these words: ‘The table of the Lord is then rightly ministered when it approaches most near to Christ’s own action, but it is plain that at that supper Christ Jesus sat with his disciples, and therefore we do judge that sitting at a table is most convenient to that holy action.’ In the general Assembly held in December 1562 it was ordained, That one uniform order be observed in the ministration of the sacraments, according to the order of Geneva [Switzerland, where John Calvin was]… But so it is, that sitting at the table in the act of receiving has been established by laws, custom, long prescription of time and confirmed by oaths and subscriptions as is evident by the former deduction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Perth Assembly</cite>, (1619), pp. 33-34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-644a4b274b" data-kw="">
<blockquote><p>I. When two commandments of the moral law are opposite in respect of use as we can not do them both at the same time: then the lesser commandment gives place to the greater and does not bind for that instant. Example 1. God commands one thing, and the magistrate commands the flat contrary: in this case which of these two commandments must be obeyed, ‘Honor God,’ or, ‘Honor the Magistrate’? The answer is, that the latter must give place to the former, and the former must only be obeyed. Acts 4:19, ‘Whether it be right in the sight of God to obey you rather than God judge ye.’

II. The 4th Commandment prescribes rest on the Sabbath day. Now it [falls?] out that at the same time [that] a whole town set on fire, and the Sixth Commandment requires our help in saving our neighbor’s life and goods. Now of these two commandments, which must be obeyed? For both cannot. The answer is that the Fourth Commandment at this time is to give place, and the Sixth Commandment alone binds the conscience: so as then (if need should require) a man might labor all the day without offence to God. Mt. 9:13, ‘I will have mercy and not sacrifice.’ And the rule must not be omitted that charity towards our neighbor is subordinate to the love of God, and therefore must give place to it. For this cause the commandment concerning charity must give place to the commandment concerning love to God: and when the case so falls out that we must either offend our neighbor or God, we must rather offend our neighbor than God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Conscience wherein is set Down the Nature, Properties and Differences thereof: as also the way to get and keep good conscience</cite>, … (Cambridge, 1596), pp. 14-15</span></figcaption>

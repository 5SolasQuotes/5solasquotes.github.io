<main class="wrap"><figure class="quote" id="q-9a60b3960c" data-kw="">
<blockquote><p>We also renounce Arminianism, which is a System containing many gross Errors; such as, notwithstanding of the Fall, Man retains a Freedom of Will to that which is spiritually good; that the Grace of God is not irresistible and efficacious of itself; that Believers in Christ may fall totally and finally away from a State of Grace; that Election depends upon foreseen good Works; and that Christ merited Grace to all Mankind; that the Reason why some are chose to Salvation, and others rejected, is for the foreseen Faith and good Works of the one, and for the foreseen Unbelief and evil Works of the other …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-moncrieff.html">Alexander Moncrieff</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of National Covenanting Explained: In Some Sermons Preached at the Renovation of Our Covenants, National and Solemn League, in the Bond Adapted to our Present Situation and Circumstances in this Period, by the Associate Presbytery, at Abernethy, in the Month of July 1744</cite>, (Edinburgh: David Duncan, 1747), p. 78.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5cf7dccd86" data-kw="">
<blockquote><p>In his review of a sermon by his fellow New York Presbyterian, Gardiner Spring, the nineteenth-century American Reformed Presbyterian, Alexander McLeod, made the following interesting distinction between the original (liberal) Remonstrant Arminians and later evangelical Arminians:

However decidedly we are ourselves opposed to Arminian tenets, we would not think it becoming to class all men, who disagree with us upon the doctrine of election, among the venomous seed of the serpent. The judgment of men’s persons and state belongs to God.

We think it, therefore, at least indecorous in the preacher, to designate, not only such men as Episcopius and old John Goodwin, but also John Wesley and Adam Clarke, and the great body of respectable men, who are associated, in so many benevolent institutions, along with himself [Gardiner Spring] in this city [New York], as “the seed of the serpent spiting our their venom,” because they do not recognize his doctrine of election.

While, with all our talents, we oppose their doctrines, whereinsoever we think them erroneous, we esteem it altogether improper to hold up their persons in such an execrable light, and disgusting attitude, to public detestation – “the seed of the serpent spitting out venom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-mcleod.html">Alexander McLeod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Review of Gardiner Spring The Doctrine of Election Illustrated and Established in Evangelical Guardian and Review</cite></span></figcaption>

/22/alexander-mcleod-on-distinguishing-between-the-original-arminians-and-evangelical-arminians/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-5bdb92f8f8" data-kw="">
<blockquote><p>I. This doctrine which doth place in an infidel and unregenerate man grace, which either mediately or immediately may suffice to the obtaining of faith or salvation, without any knowledge of the Gospel and faith in Christ, doth pull up Christian Religion by the roots, and is contrary to Scripture and experience.

II. First of all, it must needs be that all doctrine in matter of our salvation, which doth not rest it self on the testimony of the scripture, must fall to the ground: But the Scripture doth no where say, that God is bound to give increases of grace to them who have rightly used natural light and understanding. It doth no where say that a man without faith can rightly worship God. It doth no where say that God is bound to give to all men, mediately or immediately, power to believe and fulfil those things which are commanded in the Gospel: It doth no where say that supernatural grace is given to all men, by which they may rightly use natural light: It doth no where say, that the Gentiles who are ignorant of Christ, are led by the holy Ghost. These are the forgeries of idle men, whom an evil itching of wit, and a bad custom of disputing hath ceased on.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 39.1-2, p. 324.</span></figcaption>

.github.io%2Fquote%2F5bdb92f8f8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5bdb92f8f8.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/03/18/pierre-du-moulin-arminian-universal-grace-pulls-up-christianity-by-the-roots/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-8d34f989fb" data-kw="">
<blockquote><p>Reader,

THERE are two rotten pillars on which the fabric of late Arminianism (an egg of the old Pelagianism, which we had well hoped had been long since chilled, but is sit upon and brooded by the wanton wits of our degenerate and apostate spirits) doth principally stand.

The one is, That God loveth all alike, Cain as well as Abel, Judas as the rest of the apostles.

The other is, That God giveth (nay is bound, “ex debito,” so to do) both Christ, the great gift of his eternal love, for all alike to work out their redemption, and “vires credendi,” power to believe in Christ to all alike to whom he gives the gospel; whereby that redemption may effectually be applied for their salvation, if they please to make right use of that which is so put into their power.

The former destroys the free and special grace of God, by making it universal; the latter gives cause to man of glorying in himself rather than in God, — God concurring no farther to the salvation of a believer than a reprobate. Christ died for both alike; — God giving power of accepting Christ to both alike, men themselves determining the whole matter by their free-will; Christ making both savable, themselves make them to be saved.

This cursed doctrine of theirs crosseth the main drift of the holy Scripture; which is to abase and pull down the pride of man, to make him even to despair of himself, and to advance and set up the glory of God’s free grace from the beginning to the end of man’s salvation. His hand hath laid the foundation of his spiritual house; his hand shall also finish it.

The reverend and learned author of this book hath received strength from God (like another Samson) to pull down this rotten house upon the head of those Philistines who would uphold it. Read it diligently, and I doubt not but you will say with me, there is such variety of choice matter running through every vein of each discourse here handled, and carried along with such strength of sound and deep judgment, and with such life and power of a heavenly spirit, and all expressed in such pithy and pregnant words of wisdom, that you will both delight in the reading and praise God for the writer. That both he and it may be more and more profitable shall be my hearty prayers. — The unworthiest of the ministers of the gospel,

Stanley Gower.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stanley-gower.html">Stanley Gower</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Two Attestations Touching the Ensuing Treatise’ in John Owen Salus Electorum, Sanguis Jesu: or, The Death of Death in the Death of Christ</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

<blockquote><p>Pelagianism &amp; Arminianism, needeth not put a man to much study, and to the reading of many books, to the end, it may be practically learned (though the patrons hereof labour hot in the very fires, to make their notions hang together, and to give them such a lustre of unsanctified and corrupt reason, as may be taking with such as know no other conduct in the matters of God) for naturally we are all born Pelagians and Arminians: these Tenets are deeply engraven in the heart of every Son of fallen Adam: what serious servant of God findeth not this, in his dealing with souls, whom he is labouring to bring into the way of the Gospel? Yea what Christian is there, who hath acquaintance with his own heart, and is observing its bypasses and corrupt inclinations, that is not made to cry out, O wretched man that I am! who shall deliver me from these dregs of Pelagianism, Arminianism and Jesuitism, which I find yet within my soul?</p></blockquote>

<main class="wrap"><figure class="quote" id="q-6aef140aee" data-kw="">
<blockquote><p>It may however be hence inferred with certainty, that our salvation is altogether through the grace and mere beneficence of God. He might indeed have used other words -- that the wages of righteousness is eternal life; and then the two clauses would correspond: but he knew that it is through God&#x27;s gift we obtain it, and not through our own merits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistle to the Romans</cite>, Romans 6:23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/efficient-cause.html">Efficient Cause: The Free Grace of God</a> › <a href="../topics/justification/efficient-cause/gods-free-grace.html">God’s free grace</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a> › <a href="../topics/justification/nature-of-justification/justification-is-by-grace.html">Justification is by grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b49c3cf9d4" data-kw="">
<blockquote><p>“It is God that justifieth;” and, therefore, the continuation of our justification is his act also. And this, on his part, depends on the immutability of his counsel; the unchangeableness of the everlasting covenant, which is “ordered in all things, and sure;” the faithfulness of his promises; the efficacy of his grace; his complacency in the propitiation of Christ; with the power of his intercession, and the irrevocable grant of the Holy Ghost unto them that do believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>

</figure><figure class="quote" id="q-ac98fbbe65" data-kw="">
<blockquote><p>But whenever the true cause is to be assigned, he enjoins us not to take refuge in works, but to keep our thoughts entirely fixed on the mercy of God; &quot;The wages of sin is death; but the gift of God is eternal life,&quot; (Rom. 6:23). … the Apostle employed the comparison to express the fact, that death is due to the deserts of men, but that life was treasured up solely in the mercy of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.14.21</span></figcaption>

</figure><figure class="quote" id="q-b18e02cfaf" data-kw="">
<blockquote><p>Let those who marvel that justification is attributed to faith alone marvel also that justification is attributed only to the mercy of God, and not rather to human merits. For to trust in divine mercy is to have no confidence in any of our own works.</p></blockquote>

</figure><figure class="quote" id="q-63e5ff40c5" data-kw="">
<blockquote><p>Hence we see, that the apostle leaves nothing to men in procuring salvation. In these three phrases, -- not of yourselves, -- it is the gift of God, -- not of works, -- he embraces the substance of his long argument in the Epistles to the Romans and to the Galatians, that righteousness comes to us from the mercy of God alone, -- is offered to us in Christ by the gospel, -- and is received by faith alone, without the merit of works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistles to the Galatians and Ephesians</cite>, Ephesians 2:9</span></figcaption>

<main class="wrap"><figure class="quote" id="q-4ef8944025" data-kw="">
<blockquote><p>But perhaps they will object the apostles determination (Acts 15) concerning the Gentiles newly converted to Christianity, that they should abstain from eating of blood and things strangled, which was a Mosaical rite. To which I answer: First, that the apostles in the same place (v. 10) do show, that that burden of legal ceremonies was removed by the death of Christ and buried in his grave. Secondly, they did this in regard of the Jews which dwelt among those Christians for the time, being for peace’s sake, until the Christian Jews were better confirmed in the faith and knowledge of Christ (v. 21). Thirdly, they did it by the special direction of the Holy Ghost (v. 28), for the reason alleged. So as that example being extraordinary, and for the time of the infancy of the Gospel, it is no rule for us to follow now after so long a shining forth of the Gospel. And I might add this moreover, that the apostles did not this alone, but with the whole congregation, the presbyters, or elders, and brethren being joined with them. Whereas our prelates, though, they confess that a General Council has no immediate institution from Christ to determine controversies; but that it was prudently taken up in the Church from the apostles’ example, Acts 15. Yet for all their prudence in taking up that which belongs not unto them, they shew themselves very unfaithful, while they follow not the example of the apostles in determining alone, and not with the whole congregation; and therefore Christians have the less reason to captivate their faith to prelatical decrees, either in a General Council where the Pope of Rome and of Canterbury are the rulers of the rost, or in a convocation, where the Pope of Canterbury is Prime, Primate, Metropolitan, and All, who without the Holy Ghost (which is never given to any such Antichristian assemblies) whatever they decree in point of faith or otherwise, be it never so erroneous, yet they enjoin obedience thereunto by all men, as our Prelate affirms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lord Bishops, None of the Lord’s Bishops. Or A Short Discourse, wherein is Proved that Prelatical Jurisdiction is Not of Divine Institution, but forbidden by Christ Himself (1640), ch. 7. Prynne was a prominent Erastian.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ed2682ea70" data-kw="">
<blockquote><p>There may indeed be a parting between man and wife upon other accounts [than adultery], either wholly or in part: in case one of them will part from the other, which the apostle determines, 1 Cor. 7:11,15, in which case the person departing is only guilty if he or she marry again.</p></blockquote>

</figure><figure class="quote" id="q-537c63a515" data-kw="">
<blockquote><p>The very ground of this assertion of master [Robert] Bellarmine’s [a Romanist], is that he thinks not the copulation of married folk to be of the substance of matrimony. And this he proves by some testimonies out of the fathers in that fifth chapter. But yet himself will not [have] that this his saying should be so understood as if that he said that the use of marriage is not any way of the substance of marriage. For afterwards he says that this their sacrament may have two respects. As it is made, and as it is continued. As it [is] made, that is, (if I be not deceived) as the mutual consent of parties joines them together by their promises, the consent expressed by such words, is the matter and form of their sacrament. And thus must we understand that common rule in their law, that consent makes marriages. And thus do the fathers understand that which they say concerning the substance of marriage to consist in the mutual consent: partly, because after such consent given, the parties are not free to change the choice which they have made: and partly because that even by God’s law, if parties after such consent given, should carnally know another, it was death for them so to do: which could not be, but because this their consent is after a sort the marriage itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-bunny.html">Francis Bunny</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth &amp; Falsehood: Or a Comparison between the Truth now taught in England &amp; the Doctrine of the Romish Church… (London: Sims, 1595), ch. 19, ‘Of Matrimony, that it is not a Sacrament &amp; that it is Lawful for all’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-8edd371a20" data-kw="">
<blockquote><p>Lo, before ever there was father or mother or son in the world, God has appointed that the bonds betwixt husband and wife shall be more strait and indissoluble than betwixt the parent and child; and can any man be so unreasonable as to defend it lawful upon some unkind usages or thwartness of disposition, for a parent to abandon and forsake his child; or the son to cast off his parent? Much less therefore may it be thus betwixt an husband and wife: They two are one flesh. Behold here an union of God’s making: A man’s body is not more his own than his wife’s body is his: And will a man be content to part easily with a piece of himself? Or can we think that God will endure an union made by Himself to be slightly dissolved? Or how is this bodily matrimony a lively image of the spiritual marriage betwixt Christ and his Church (who has said, ‘I will betroth thee unto me forever; Yea I will betroth thee unto me in righteousness and in judgment, and in loving kindness, and in mercies,’ Hos. 2:19), if upon small occasions it may be subject to utter dissolution? Yea, what speak I of divinity? Even modest heathens would hiss this Libertinism off the stage…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times (London, 1654), 4th Decade, Case 2, ‘Whether Marriage Lawfully made may Admit of any Cause of Divorce, save only for the Violation of the Marriage Bed, by Fornication or Adultery?’, p. 303</cite>, pp. 303-4</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Lo, before ever there was father or mother or son in the world, God has appointed that the bonds betwixt husband and wife shall be more strait and indissoluble than betwixt the parent and child; and can any man be so unreasonable as to defend it lawful upon some unkind usages or thwartness of disposition, for a parent to abandon and forsake his child; or the son to cast off his parent? Much less therefore may it be thus betwixt an husband and wife: They two are one flesh. Behold here an union of God’s making: A man’s body is not more his own than his wife’s body is his: And will a man be content to part easily with a piece of himself? Or can we think that God will endure an union made by Himself to be slightly dissolved? Or how is this bodily matrimony a lively image of the spiritual marriage betwixt Christ and his Church (who has said, ‘I will betroth thee unto me forever; Yea I will betroth thee unto me in righteousness and in judgment, and in loving kindness, and in mercies,’ Hos. 2:19), if upon small occasions it may be subject to utter dissolution? Yea, what speak I of divinity? Even modest heathens would hiss this Libertinism off the stage…”

— Joseph Hall, Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times (London, 1654), 4th Decade, Case 2, ‘Whether Marriage Lawfully made may Admit of any Cause of Divorce, save only for the Violation of the Marriage Bed, by Fornication or Adultery?’, p. 303, pp. 303-4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CLo%2C+before+ever+there+was+father+or+mother+or+son+in+the+world%2C+God+has+appointed+that+the+bonds+betwixt+husband+and+wife+shall+be+more+strait+and+indissoluble+than+betwixt+the+parent+and+child%3B+and+can+any+man+be+so+unreasonable+as+to+defend+it+lawful+upon+some+unkind+usages+or+thwartness+of+disposition%2C+for+a+parent+to+abandon+and+forsake+his+child%3B+or+the+son+to+cast+off+his+parent%3F+Much+less+therefore+may+it+be+thus+betwixt+an+husband+and+wife%3A+They+two+are+one+flesh.+Behold+here+an+union+of+God%E2%80%99s+making%3A+A+man%E2%80%99s+body+is+not+more+his+own+than+his+wife%E2%80%99s+body+is+his%3A+And+will+a+man+be+content+to+part+easily+with+a+piece+of+himself%3F+Or+can+we+think+that+God+will+endure+an+union+made+by+Himself+to+be+slightly+dissolved%3F+Or+how+is+this+bodily+matrimony+a+lively+image+of+the+spiritual+marriage+betwixt+Christ+and+his+Church+%28who+has+said%2C+%E2%80%98I+will+betroth+thee+unto+me+forever%3B+Yea+I+will+betroth+thee+unto+me+in+righteousness+and+in+judgment%2C+and+in+loving+kindness%2C+and+in+mercies%2C%E2%80%99+Hos.+2%3A19%29%2C+if+upon+small+occasions+it+may+be+subject+to+utter+dissolution%3F+Yea%2C+what+speak+I+of+divinity%3F+Even+modest+heathens+would+hiss+this+Libertinism+off+the+stage%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Joseph+Hall%2C+Cases+of+Conscience+Practically+Resolved+Containing+a+Decision+of+the+Principal+Cases+of+Conscience+of+Daily+Concernment+%26+Continual+Use+Amongst+Men%3A+Very+Necessary+for+their+Info

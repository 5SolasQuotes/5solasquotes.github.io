<main class="wrap"><figure class="quote" id="q-e449def23e" data-kw="">
<blockquote><p>He who is just could not have commanded anything impossible, nor is a man condemned for that which he could not avoid, for He is pious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-baptiste-gonet.html">Jean Baptiste Gonet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shield of Thomistic Theology</cite>, 5 vols. 10th ed. (1667; Antwerp: Pitteri, 1744), vol. 1, tract 4, On the Will of God &amp; his Providence, disp. 4, Antecedent &amp; Consequent Will of God tr. AI by The Faith Received | 110. The conclusion is therefore proven lastly by another fundamental reason. By the very fact that God, through an antecedent will, ordains men to salvation and a supernatural end, He obliges them to observe the supernatural precepts, which are the necessary means for its attainment: according to that saying of Christ, “If you wish to enter into life, keep the commandments.” But man cannot be obliged to the observance of supernatural precepts without sufficient aids: Therefore, God, through an antecedent will, prepares sufficient aids for men. The major premise is evident; the minor is proven: | Man cannot be obliged to the impossible: But the observance of supernatural precepts, without supernatural aid, at least sufficient, is impossible: Therefore, such aid being excluded, he cannot be obliged to it: The major premise is established from the Council of Trent (sess. 6, chap. 11), where it is said that God does not command impossibilities; and from Augustine (de natura &amp; gratia, chap. 69), saying: “It is most firmly believed that God, being just and good, could not have commanded impossibilities.” And in Sermon 16 de tempore: “We execrate the blasphemy of those who say that anything impossible has been commanded by God.” And in Sermon 6:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1f44e69cf6" data-kw="">
<blockquote><p>It cannot be denied but that there were in Christ during the state of his humiliation, those acts of the will that the Schools call efficaces and inefficaces; such acts of holy love that were complete and perfect in themselves and in the issue and accomplishment, and such other acts of holy love that were imperfect in themselves and also ineffectual in the event.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

— William Creed, paragraphs 61-73, pp. 236-43 in sect. 13 in The Refuter Refuted, or Dr. [Henry] Hammond’s Ektenesteron Defended, against the impertinent cavils of Mr. Henry Jeanes... (London: Royston, 1660), p. 236">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+cannot+be+denied+but+that+there+were+in+Christ+during+the+state+of+his+humiliation%2C+those+acts+of+the+will+that+the+Schools+call+efficaces+and+inefficaces%3B+such+acts+of+holy+love+that+were+complete+and+perfect+in+themselves+and+in+the+issue+and+accomplishment%2C+and+such+other+acts+of+holy+love+that+were+imperfect+in+themselves+and+also+ineffectual+in+the+event.%E2%80%9D%0A%0A%E2%80%94+William+Creed%2C+paragraphs+61-73%2C+pp.+236-43+in+sect.+13+in+The+Refuter+Refuted%2C+or+Dr.+%5BHenry%5D+Hammond%E2%80%99s+Ektenesteron+Defended%2C+against+the+impertinent+cavils+of+Mr.+Henry+Jeanes...+%28London%3A+Royston%2C+1660%29%2C+p.+236&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1f44e69cf6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1f44e69cf6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-willings-of-god/#:~:text=It%20cannot%20be%20denied%20but%20that,and%20also%20ineffectual%20in%20the%20event&amp;text=It%20cannot%20be%20denied%20but%20that%20there%20were&amp;text=in%20themselves%20and%20also%20ineffectual%20in%20the%20event" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9cd60dd626" data-kw="">
<blockquote><p>Hence is that, Aquinas, Valentia, Durandus and Suarez† want the will of God divided thus: it is the will improperly and the division is by a homonym in homonyms, so that the will of sign is the will improperly. Thus Durand, on folio 13, ‘A command,’ he says, ‘is not directly and always a sign that the one commanding wants the thing commanded to be, but only that He wants to oblige the subject.’ † Aquinas, in pt. 2, q. 9, art. 11; Valentia, tome 1, disp. 1, q. 19, punc. 2; Durandus, bk. 1, dist. 48, q. 3; Suarez, tome 1, Of the Attributes of God, bk. 3, ch. 8.</p></blockquote>

</figure><figure class="quote" id="q-394835e485" data-kw="">
<blockquote><p>1224. Rom. 9:18, ‘God has mercy on whom He will have mercy, and whom He will He hardens.’ Ch. 11:32, ‘God has concluded them all in unbelief, that He might have mercy upon all.’ The first place is concerning the most free will and power of God, who may have mercy on whom He please; his antecedent will reaches to all men, his consequent will is restrained to the believers and unbelievers, and so He will have mercy of the faithful, that they may be saved, but he justly punishes and hardens the unbelievers and wicked men who resist his grace freely offered unto them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-thaddaeus.html">Johannes Thaddaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reconciler of the Bible</cite>, … (London: Miller, 1662) | Romans</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

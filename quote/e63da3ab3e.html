<main class="wrap"><figure class="quote" id="q-e63da3ab3e" data-kw="">
<blockquote><p>I believe also the universal sensible church to be one, while it holdeth this true confession spoken of before. And I believe them to be of the same church whosoever by Christian profession obeyeth it according unto the written word and promise.

I believe Isaac, Jacob, Judah, being infants and all that were of the seed of Abraham, and also those infants whose parents in the primitive church at the preaching of the apostles turned unto Christ to be of this church. For Isaac &amp; other of the old fathers, except they had been of the church, they had not received the badge and cognisance thereof.

Sith they were then of the church being infants, then as well thereof must our infants &amp; little ones be of the church to. Wherefore I believe and know, that thy infants co-signed with the sacrament of baptism be of the church. For the infant {is} acknowledge it by the mouths of their godfathers and own fathers to in that they be offered of their parents unto the church, yea rather the promise, which is no less made unto our infants but more largely &amp; oftener than to the infants of the old fathers offer them unto the church.

These are the principal grounds &amp; foundations as touching the infants to be baptised &amp; commended unto the church, against the which all the dotes &amp; engines of the Catabaptists, that is to say of them that will have us christened again, may nothing prevail. For they are not only to be baptised that believe, but they that are of the church by the reason of the promise of God’s word. For else should none of the apostles have baptised any man, when none of the apostles were sure of the faith of him that outwardly acknowledged and obeyed their preaching {is}. For Simon the juggler &amp; charmer, Ananias &amp; Judas to, and many more were baptized when they obeyed and took the name of Christian men, and yet had they not faith.

Again, Isaac yet an infant was circumcised, when he neither said he would be of the church nor yet believed: but the {pro}mise told them that he was of the church of God. Sith then our infants be in the same place that thy infants of the Hebrews were, therefore doth the promise concerning them made unto our church both name them &amp; confess them to be of the church. Wherefore verily as well doth baptism as circumcision (we speak of the sacrament of baptism) nothing else require then the one of these two either the acknowledging or name giving, or else the covenant or promise: …</p></blockquote>

<blockquote><p>Hence Romanists and Ritualists have inferred that the sign is inseparable from the grace signified, and that these spiritual effects are due to the outward ordinance. Hence the doctrine of baptismal regeneration. But it must be observed that the Scriptures do not assert these spiritual attributes of water baptism in itself considered, but of water baptism as the sign or emblem of baptism by the holy Ghost. These spiritual attributes belong only to baptism by the Spirit, and they accompany the sign only when the sign is accompanied by that which it signifies. It does not follow, however, that the sign is inseparable from the grace. The grace is sovereign; and experience teaches us that it is often absent from the sign, and that the sign is least frequently honoured by the presence of the grace when it is itself most implicitly relied upon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, chs. 27–28 (on baptismal regeneration)</span></figcaption>

<blockquote><p>LXIV. On the other hand, if someone asks about adults who foster and profess faith but are not yet baptized, who are called catechumens, and also about those who have been excommunicated from the Church but still retain faith and charity in their hearts, whether they are part of the Church and should be considered true members of it, the Romanist doctors simply deny it, while our [Reformed] theologians affirm it. However, there seems to be agreement in reality; for such individuals, according to the Romanists, pertain, as they say, to the soul of the Church and the mystical body of Christ to be granted salvation by Him. Our theologians concede that such individuals are not, at least absolutely and perfectly, part of the visible Church, that is, they do not pertain to the external society of the Church, nor are they aggregated to any particular Church, which does not prejudice their salvation according to both sides. See Whitaker, On the Church against Bellarmine.</p></blockquote>

</figure><figure class="quote" id="q-585568724b" data-kw="">
<blockquote><p>I have treated on these two subjects, because I know they are the tempting errours of these Times, and have the fairest glosses set on them, and have too much influence to disturb the Peace and Order of Churches:

The first [anti-paedobaptism] especially, which eats out men’s affections, and creeps at the heart like a gangrene insensibly; an opinion which hath been always ominous, and of a wonderful strange influence, accompanied with the most dangerous retinue of errors, since the first Embryo of it was brought forth; whether by a judgement of God, or from its natural and secret connexion with other principles of darkness, I will not determine; only God hath shewed some black characters on it in every Nation where it hath prevailed; though we cannot but say, many Saints are innocently under the power of it.

For the second [error, uninspired hymns], I hope when men’s hearts come in Tune, their voices will likewise: The former denies more Fundamental Principles, as the Covenant in its extent, and subjects; the freeness of Grace; the riches of its workings in the New Testament; and contracts the Gospel; leaving more Grace visible in the Legal and Old Testament dispensation, then in the New.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cuthbert-sidenham.html">Cuthbert Sidenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian, Sober &amp; Plain Exercitation on the Two Grand Practical Controversies of these Times; Infant-Baptism and Singing of Psalms</cite>, (London: Robert White, 1654), epistle dedicatory.</span></figcaption>

724b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/03/03/cuthbert-sidenham-anti-paedobaptism-as-a-worse-error-than-uninspired-hymns/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-003d5b33a5" data-kw="">
<blockquote><p>According to God’s promise (Gen. 17:7; Acts 2:39), the children of believing parents are included in the covenant of grace and must be received as members of the church by baptism. This promise is precious, and the privileges it confers on our children are great indeed. But they afford us no ground to presume that our children are regenerate and no reason to treat them as such before they come to saving faith and repentance. We baptize infants based on many points, but not on account of ‘presumptive regeneration.&#x27;</p></blockquote>

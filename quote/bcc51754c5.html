<main class="wrap"><figure class="quote" id="q-bcc51754c5" data-kw="">
<blockquote><p>It is evident that there may be union and communion with a Church where there are several corruptions neither confessed nor reformed. As for example, there may be difference of judgment about many things, and doctrinal determinations of disputable points exacted by synods, contrary to our sentiments; and yet there may be forbearance with protestations, if we be not constrained to subscribe or homologate the same. In worship there may be many defects and disorders. In discipline and government there may be many dissatisfactions with Church officers, unjust censures, unfit ordinations, erroneous decisions, wrong constitutions of judicatories, dissatisfactions with persons that have the main stroke in the administrations, occasioning jealousies and fears of misgovernment for the time to come, and the like.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b101212edc" data-kw="">
<blockquote><p>These, I think, were two, or at most three: The first was, apostasy from the Faith; or, when a bishop renounced the Christian Faith, and, through fear of prosecution, embraced the heathenish idolatries; The second was heresy, if they could accuse him of false heretical doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-a787f58d8f" data-kw="">
<blockquote><p>But yet let me freely tell you, that there is one step in Mr. Erskine’s conduct that I am not able to justify; it is, When the synod of Perth and Stirling resolved to give him a modest rebuke, he did not silently receive it. I should never have advised my worthy brother Mr. Erskine to have made any confession of a fault even in his expressions, when his conscience justified him in the same; but I cannot think that his silence at the time that either the synod or General Assembly rebuked him, when they resolved thereby to finish the process, would be construed an acknowledgment of a fault: I am sure that the history of our blessed Lord’s sufferings bears expressly, that, when He was accused of many things before Pilate, He answered nothing; and when he was urged by the self-condemned heathen judge, He still continued silent; and I am persuaded that no good Christian can allege that his silence did import any confession of a fault, yea, it was a fulfilling of the Scripture, Isa. 53:7.</p></blockquote>

</figure><figure class="quote" id="q-ac4705b8fe" data-kw="">
<blockquote><p>For the erecting of a Church within a presbyterian Church, I must say that it is a novation with a witness. Our friends express much zeal for the obligation of our covenants (which I acknowledge is inviolable) and therefore I would recommend to their serious views that article of our National Covenant, whereby we abjure all novations contrary to our received standards. Sure I am, our old covenanters were not of their mind. I know no precedent for their way amongst us save this one, of which I think they will not be very fond, namely, that of the Public Resolutioners, who were the first that ever pretended to set up distinct judicatories in this Church: The Protesters sat with them in judicatories without any hesitation, and pressed to continue, and to act a faithful part as it might please the Lord to guide them, they were the separatists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

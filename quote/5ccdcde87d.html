<main class="wrap"><figure class="quote" id="q-5ccdcde87d" data-kw="">
<blockquote><p>…a man may be said to be justified either intentionally, or virtually, or actually; either in God, or in Christ, or in himself. 1. Intentionally in God in God’s purpose and decree: This is from all eternity, but this decree and intention does not put anything into a state of actual being, but in the fulness of time. 2. Virtually in Christ: And this is from the day of Christ’s passion, and in the virtue of his satisfaction; yet this intends no more but that satisfaction is made and remission purchased by the blood of Christ. 3. Actually in himself: When a man has the possession of justification, immediately after his union with the Lord Jesus Christ. Now this justification considered as it is a state of favor, a covenant state with God, which a man at his first believing is put into, is not reiterated, no more than a wife, after that first entrance into the relation, is frequently made a wife; yet the particular acts of pardon, and imputation of Christ’s righteousness, are continually by God communicated unto the believer. In this respect this actual justification (or particular acts of pardon) has its degrees of progression: The beginning thereof is laid in our first union and incorporation into Christ; the consummation of it is not till the Judge at the latter day has solemnly pronounced the sentence of final absolution, and so set us in full possession of entire remission: Between both these, there is a progressive work of justification, by the constant actings of the Spirit, applying the blood of Christ by the hand of faith, to the quiet and comfort of the soul: The first we may term initial justification, the second progressive, the last perfective; the second is the fruit of the first, and the preludial assurance of the last: The first is wrought and sealed in the first sacrament, the second is wrought and sealed in the second sacrament; and both these branches of sacramental justification, are to us the pre-assurance of that complemental and perfective justification, the sentence whereof puts an end to all fears, changing our faith and hope into fruition and full possession. It has been commonly said by some of our best divines that justification is transacted in our first union and incorporation into Christ; at which time it is conceived that the pardon of all sin is sealed to the believer at once. But I fear the misunderstanding of this point (not untrue in itself, if not mistaken and misapprehended) has laid the ground upon which some build that unhappy structure which turns the grace of God into wantonness: who knows not that justification in the proper acceptation of the word, according to the Scripture phrase, is the act of a judge pronouncing a judicial sentence, wherein he absolves the person of the sinner from all sin and punishment due to him for sin, and that for the alone righteousness of the surety Christ freely imputed, and by faith received of him. And according to this, I suppose we shall not err from the truth, if we say: 1. That the main work of justification, is even as yet to us future, viz. at the great and last day of Judgment, when we shall receive a final quietus est, and discharge, and when God shall wipe away all tears from our eyes: And yet 2. That in our first union with Christ there is a work of justification, viz. actual imputation of Christ’s righteousness, and actual remission of what sin for the present the soul stands guilty of, at that time when it is first united to Christ. I dare not say that justification, quatenus [so far as] it comprehends imputation and remission of sin, is one individual act; or that all sins, past, present and to come are remitted to the believer at once; but this I say, that in our first union, all our sins past and present are actually pardoned; and this favor received is a pledge of assurance that in future also, by applying ourselves to Christ, we may and shall receive the forgiveness of our daily sins, and that at the Last Day we shall at once be absolved from all accusations and charges laid in against us; and that justification (besides those particular acts of pardon, and imputation of Christ’s righteousness) does connote a state that the subject at his first believing is put into, viz. a state of grace, and favor, and reconciliation with God for the imputed righteousness of Christ, without apostasy from it, either total or final.</p></blockquote>

<blockquote><p>Hence, we are free insofar as we have been renewed. Insofar as we are flesh and age, we are under the law; although what is left of the old, is condoned in believers for the same of their faith. In a word, as far as we believe, we are free; and as far as we show diffidence, we are under the law… For here we have just begun our justification and have not entirely completed it. Thus Paul forthwith orders us to be changed by the renewing of our minds.</p></blockquote>

<blockquote><p>§IV. For first, whereas justification before God is but one, wherein the Lord by imputation of Christ’s righteousness to a believing sinner does absolve him from his sins and also accepts of him as righteous in Christ, not only in the first moment of justification, wherein being a sinner in himself he was first constituted righteous in Christ: but also in the continuance of justification, wherein the believer being still a sinner in himself, is continued in the favor of God by the merits and intercession of Christ: and though a sinner in himself, yet believing in Him that justifies a sinner, is made the righteousness of God in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Justification</cite>, (London: 1633), ch. 3, ‘Bellarmine’s answers… refuted’, p. 451</span></figcaption>

<div class="actions"><button class="copy" data-copy="“§IV. For first, whereas justification before God is but one, wherein the Lord by imputation of Christ’s righteousness to a believing sinner does absolve him from his sins and also accepts of him as righteous in Christ, not only in the first moment of justification, wherein being a sinner in himself he was first constituted righteous in Christ: but also in the continuance of justification, wherein the believer being still a sinner in himself, is continued in the favor of God by the merits and intercession of Christ: and though a sinner in himself, yet believing in Him that justifies a sinner, is made the righteousness of God in Christ.”

<blockquote><p>And it is inquired what it is whereon their continuation in this state does on their part depend; or what is required of them that they may be justified unto the end. And this as some say is not faith alone, but also the works of sincere obedience. And none can deny but that they are required of all them that are justified, whilst they continue in a state of justification on this side glory… …that which was the necessity of owning a personal obedience in justified persons, is on all hands absolutely agreed…</p></blockquote>

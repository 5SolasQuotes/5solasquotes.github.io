<blockquote><p>Nature and Revelation are both volumes from the hand of the same intelligent Author, both imparting — the one in a form more limited and obscure, the other in a manner definite and ample — much relating to His character and perfections. … Between these two great volumes, containing, as they do, the entire sum of God’s revelation to man, there can be neither contrariety nor contradiction.

A complete understanding is only necessary to a complete harmony; and while it is impious for the mere physicist to attempt to array the facts of science against revelation, it is weak for the Theologian to array his exegesis against well established scientific truths, or tremble for the ark of God before mere theories which stand like an inverted pyramid upon a very limited induction of facts, or, as is frequently the case, upon mere hypothesis; or wage war against any branch of science merely because illegitimate inferences may have been drawn from its facts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-r-w-sloane.html">J. R. W. Sloane</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Word: A Discourse, Delivered at the Opening of the Reformed Presbyterian Synod, in Allegheny, Pa., on Tuesday Evening, May 24, 1859</cite>, (New York: Thomas Holman, 1859), pp 9, 10-11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Oaths conceived or made rightly of things lawful, true, certain, weighty, and possible, are to be kept. For if once thou hast acknowledged and testified thyself to be justly bound to keep thy promise, and hast called God to record hereof, when as afterwards thou wittingly and willingly breakest thine oath, thou dost violate and break a just bond, and doest either accuse God, the witness and maintainer of this bond, of vanity and lightness, or provoke Him to punish thee. Ps. 15:4-5… But oaths that are made of unlawful things, either by an error, or by ignorance, or through infirmity, or against the conscience, it is sin to keep them. And therefore such oaths are to be retracted and recalled, least we add thereby sins unto sins… They therefore who keep that which they have ill sworn heap sin unto sin; as did Herod putting John Baptist to death by pretence of keeping his oath: and likewise such as keep monastical vows, whereby they have sworn idolatry and impious single living… and according to the example and doctrine of David, 1 Sam. 25, who swears that he will destroy Nabal together with his family, saying: ‘So and more also do God unto the enemies of David; for surely I will not leave of all that he has by the dawning of the day, any that pisses against the wall:’ But after he had heard Abigail speak, he gives thanks to God that the executing and fulfilling of his oath was hindered by her and confirms by a new oath that this is God’s blessing and benefit, saying: ‘Blessed be the Lord God of Israel which sent thee this day to meet me; and blessed be thy counsels, and blessed be thou, which hast kept me this day from coming to shed blood, and that mine hand has not saved me. For indeed, as the Lord God of Israel lives, who has kept me back from hurting thee, etc.’… Objection 2. The oath of peace which was made to the Gibeonites, Josh. 9, was [by deception and] against the commandment of God. It is lawful therefore to keep an oath made of things unlawful. Answer:

1. They were not excluded from peace if any of those nations which God has commanded to be destroyed, did ask peace of the Israelites and did embrace their religion. Now the Gibeonites desire peace and are adjudged to serve the tabernacle for woodcleavers and drawers of water perpetually. Therefore the peace which was promised them, albeit it was obtained by fraud and guile, yet was it not repugnant to God’s commandment.

2. The Israelites do not therefore keep this oath, as that they were bound thereby, because they sware it being deceived, and thinking the Gibeonites to have been of another country: but first for avoiding of offence, whereby the name of God might be disgraced among the heathen, if the Jews had not kept their oath; and then, because it was lawful and just to save them which desired peace and embraced their religion, although no oath had been made at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered</cite>, … in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), 3rd Commandment, 4. Whether all oaths are to be kept, pp. 917-19</span></figcaption>

</figure><figure class="quote" id="q-56d954c30d" data-kw="">
<blockquote><p>Heaven-work and heart-work are the chiefest parts of Christian duty. Christ often gives us his summaries of the Law and inculcates his great Command; Jn. 13:35; Mt. 22:37-39; Lk. 10:27. And so does the apostle, Rom. 13:10; 1 Pet. 1:22; 1 Jn. 3:11, 14, 23 &amp; 4:7, 11-12, 20; 2 Jn. 5. And the fruits of the Spirit are manifest, Gal. 5:22-23. James says that pure religion and undefiled before God, even the Father, is this, to visit the fatherless and widows in adversity and to keep ourselves unspotted of the world, James 1:27. Paul says, 1 Tim. 1:5, ‘The end of the commandment is charity out of a pure heart, and of a good conscience and of faith unfeigned:’ And then adds, ‘From which some having swerved, have turned aside to vain janglings’— In a word: The effectual belief of pardon and eternal glory given through Christ, and the love of God and man, with the denial of ourselves, and fleshly desires, and contempt of all things in the world, which are competitors with God and our salvation, with a humble patient enduring of all which must be suffered for these ends, is the nature and sum of the Christian religion. Do nothing therefore as a duty which is a hinderance to any of this. Contentious preachings and factious sidings which weaken love are not of God. The servant of the Lord must not strive, but be gentle to all men, 2 Tim. 2:24… It is one of the most important things in the world for the resolving of a thousand cases of conscience and the directing of a Christian life to know which duties are the greater and which are the lesser, and so which is to be preferred in competition; For that which is a duty at another time is a sin when it is done instead of a greater! as Christ has resolved in the case of the Sabbath. If good must be loved as good, then the greatest good must be most loved and sought. Sacrifice instead of mercy is a sin: Our gift must be left at the altar while we go to be reconciled to our brother. Mt. 5. Never hearken to those men who would set up their controverted duties or any positives and lesser things against the duties of nature itself or the great substantial parts of godliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 39, ‘Know which are the great duties of a Christian life, and wherein the nature of true Religion does consist; and then pretend not any lesser duty against those greater, though the least when it is indeed a duty, is not to be denied or neglected’, pp. 209-10</span></figcaption>

f+conscience+and+the+directing+of+a+Christian+life+to+know+which+duties+are+the+greater+and+which+are+the+lesser%2C+and+so+which+is+to+be+preferred+in+competition%3B+For+that+which+is+a+duty+at+another+time+is+a+sin+when+it+is+done+instead+of+a+greater%21+as+Christ+has+resolved+in+the+case+of+the+Sabbath.+If+good+must+be+loved+as+good%2C+then+the+greatest+good+must+be+most+loved+and+sought.+Sacrifice+instead+of+mercy+is+a+sin%3A+Our+gift+must+be+left+at+the+altar+while+we+go+to+be+reconciled+to+our+brother.+Mt.+5.+Never+hearken+to+those+men+who+would+set+up+their+controverted+duties+or+any+positives+and+lesser+things+against+the+duties+of+nature+itself+or+the+great+substantial+parts+of+godliness.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Cure+of+Church+Divisions%2C+%E2%80%A6+%28London%2C+1670%29%2C+pt.+1%2C+Direction+39%2C+%E2%80%98Know+which+are+the+great+duties+of+a+Christian+life%2C+and+wherein+the+nature+of+true+Religion+does+consist%3B+and+then+pretend+not+any+lesser+duty+against+those+greater%2C+though+the+least+when+it+is+indeed+a+duty%2C+is+not+to+be+denied+or+neglected%E2%80%99%2C+pp.+209-10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F56d954c30d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/56d954c30d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/ethics#:~:text=Heaven%2Dwork%20and%20heart%2Dwork%20are%20the%20chiefest,the%20great%20substantial%20parts%20of%20godliness&amp;text=Heaven%2Dwork%20and%20heart%2Dwork%20are%20the%20chiefest%20parts%20of&amp;text=itself%20or%20the%20great%20substantial%20parts%20of%20godliness" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Objection: Be it true that crosses were purposely appointed to be adored, yet not so now. The Jews would not admit of the image of Caesar in the Church, yet they abolished it not, but admitted it in their coin… [Rutherford’s] Answer: 1. Though the cross were first framed for no adoration… … 5. We remove not crosses from coinage, no more than the Jews did the image of Caesar. But we agree with them [the Jews], [Richard] Hooker [an Anglican] being judge, in banishing them from the worship.</p></blockquote>

<blockquote><p>We may… try to conceive the landscape, and the parish features generally, as the new incumbent [John Macmillan of Balmaghie] saw them in 1701… The dress of the people was on a par with their homes and fare. A Galloway man wore constantly, even in church, his broad blue bonnet, made in Kilmarnock… Young girls at home wore no head-covering, but snooded their locks with a piece of string or ribbon. At fair or church, they wore white linen mutches [linen caps], slightly plaited above the brow. The farmers’ wives covered their heads with coarse white linen toys [linen or wool headdresses that hang down over the shoulders] when they went a-visiting.¹ ¹ For all the above, I have drawn on Nicholson’s History, II. 332-339.</p></blockquote>

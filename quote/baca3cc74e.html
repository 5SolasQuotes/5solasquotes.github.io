<blockquote><p>What is stressed here, however, is that when these preachers appeared in Scotland they gave impetus to a type of preaching and practice which hitherto had been little known in the land. One would not say that [D. L.] Moody was an Arminian of the pronounced order, but this fact only gave him the larger opportunity to introduce his doctrines into circles which would have repudiated a more positive form of Arminianism.

The outcome was a pronounced swing from the Calvinism, now regarded as severe, which had hitherto prevailed in Scotland. Along with this came the introduction of practices which were themselves expressive of an underlying conception, distinctively Arminian, which would have been utterly inconceivable under a Calvinistic regime. But most hurtful of all was the introduction of hymn-singing on a large scale into the public worship of the Free Church. It was, in fact, almost a death-blow to the Psalm-singing, which hitherto had been almost a universal feature of public worship throughout Scotland.

Dr John Kennedy, of Dingwall, with his massive mind and keen discernment, perceived all these things and the dangers attendant upon them and sounded loudly the trumpet of warning. But, apart from those Highlanders who had learned to know his value and to esteem his judgment, he was little regarded, unless it were to be roundly abused as one who had little or no sympathy with the proclamation of a “free” Gospel. After events, however, verified his forecast and gave to him the place of the prophet who speaks unheeded to the ears of an unbelieving generation.

The working of the new leaven in the Free Church of Scotland speedily revealed itself. Up till then, whatever measure of approval the new German Higher Criticism had won for itself the response had been practically inaudible. Now, however, with the rise of what Dr Kennedy called the “Hyper-Evangelistic” party in the Free Church, it became no longer necessary for those who favoured the Higher Criticism to conceal their antipathy to the strict and binding terms of the Confession and Formula of the church under which they exercised their ministry.

It is not for a moment contended that this new Evangelistic party had the slightest sympathy with the attitude of the Higher Critics towards the Scriptures, but the two parties found common ground in their antipathy to much in that to which they had sworn their allegiance. And now that it had become fashionable to express dissatisfaction with the old formulas, the Higher Critics felt it safe to emerge from their hiding-holes.

To the Arminian party, as we may now call the Evangelists, the stout, uncompromising Calvinism of the standards of the Church had become intolerable, and, under the leadership of Dr [Robert] Rainy, what was known as the Declaratory Act was prepared and duly passed by the General Assembly of 1892—although not without the strongest possible protest on the part of the conservative elements in the Church.

By this Act the terms of the most Calvinistic articles of the Confession of Faith were explained away and made to mean what they did not mean, and what they were never meant to mean. The Act, therefore, was a most unworthy and dishonest measure, aimed, not, as several responsible parties nowadays seek to maintain, at finding vantage ground in the Church for the Higher Criticism—Principal Rainy was no Higher Critic—but at the Calvinistic articles of the Confession, which were so obnoxious to the Arminians. A perusal of the Declaratory Act itself will fully bear this out.

It was the intention of Dr Rainy and his party, with whom the Higher Critics naturally allied themselves, to follow up the Declaratory Act with a corresponding adjustment of the Formula of Subscription signed by all ministers and office-bearers of the Church, so as to make the measure binding upon all who might henceforth be ordained or inducted to office in the Church, but, taking fright at the unexpected secession of the Revs Donald Macfarlane, of Raasay, and Donald Macdonald, of Shieldaig, in 1893—the founders of the Free Presbyterian Church — they proceeded no further until, by the Union of 1900 with the United Presbyterian Church, they succeeded in making their measure operative with the introduction of a Formula which no longer bound ordinands and office-bearers uncompromisingly to the Calvinistic doctrines of the Confession.

The new United Free Church, as it was called, was confessedly Arminian in doctrine, and it was upon this issue, together with their Voluntaryism, or rejection of the Establishment Principle, that they lost their case by the famous House of Lords’ decision in 1904. Higher Criticism had absolutely nothing to do with it. This fact is worth emphasising in view of the fact that efforts are now being made to teach the younger generation of Free Church people that the 1900 struggle was fought on the Higher Criticism, and that the question of Arminianism did not enter into the picture at all. That contention is simply not correct, and it only indicates the extent to which Arminianism is favoured in certain Free Church circles today.

The Highlands split directly over the real issue. Where the people adhered to the old Calvinism of the Confession they remained faithful to the Free Church; where they sympathised with the newer doctrines the United Free Church sprang up. The division was clean. The Free Church was Calvinistic; the United Free Church was Arminian. At that date, so far as the Highlands were concerned, neither church was Modernistic. Such was the bitter fruit of the Moody-Sankey Revival, as against the impetus to Evangelical religion, which has been so largely claimed for it.</p></blockquote>

<blockquote><p>But what can be the reason, may some man say, why the Scripture has not itself determined these kinds of assemblies [synods, general assemblies, etc.] particularly? I answer, three reasons may begiven for it:

1. Because it was not necessary, the general rules of the word, together with nature’s light, which directeth commonwealths in things of the same kind, being sufficient to direct the church therein.

2. As seasons and times for the meeting of assemblies , so the just bounds thereof in so many different places of the world are things of that kind which were not determinable in Scripture, unless the world had been filled with volumes thereof; for, individua sunt infinita.

3. Because this constitution of synods, provincial and national, is not universal for all times and places; for example, there may bein a remote island ten or twelve Christian congregations, which, beside their particular elderships, have a common presbytery, but are not capable of synods, either provincial or national. Again, let there be an island containing forty or fifty Christian congregations, there shall be therein, beside presbyteries, one kind of a synod, but not two kinds. Besides, the reformed congregations within a great nation may haply [by chance] be either so few, or so dispersed and distant, or so persecuted, that they can neither have provincial nor national assemblies.</p></blockquote>

— George Gillespie, An Assertion of the Government of the Church of Scotland, (1641), p. 53">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+what+can+be+the+reason%2C+may+some+man+say%2C+why+the+Scripture+has+not+itself+determined+these+kinds+of+assemblies+%5Bsynods%2C+general+assemblies%2C+etc.%5D+particularly%3F+I+answer%2C+three+reasons+may+begiven+for+it%3A%0A%0A1.+Because+it+was+not+necessary%2C+the+general+rules+of+the+word%2C+together+with+nature%E2%80%99s+light%2C+which+directeth+commonwealths+in+things+of+the+same+kind%2C+being+sufficient+to+direct+the+church+therein.%0A%0A2.+As+seasons+and+times+for+the+meeting+of+assemblies+%2C+so+the+just+bounds+thereof+in+so+many+different+places+of+the+world+are+things+of+that+kind+which+were+not+determinable+in+Scripture%2C+unless+the+world+had+been+filled+with+volumes+thereof%3B+for%2C+individua+sunt+infinita.%0A%0A3.+Because+this+constitution+of+synods%2C+provincial+and+national%2C+is+not+universal+for+all+times+and+places%3B+for+example%2C+there+may+bein+a+remote+island+ten+or+twelve+Christian+congregations%2C+which%2C+beside+their+particular+elderships%2C+have+a+common+presbytery%2C+but+are+not+capable+of+synods%2C+either+provincial+or+national.+Again%2C+let+there+be+an+island+containing+forty+or+fifty+Christian+congregations%2C+there+shall+be+therein%2C+beside+presbyteries%2C+one+kind+of+a+synod%2C+but+not+two+kinds.+Besides%2C+the+reformed+congregations+within+a+great+nation+may+haply+%5Bby+chance%5D+be+either+so+few%2C+or+so+dispersed+and+distant%2C+or+so+persecuted%2C+that+they+can+neither+have+provincial+nor+national+assemblies.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+An+Assertion+of+the+Government+of+the+Church+of+Scotland%2C+%281641%29%2C+p.+53&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe8a82d4739.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e8a82d4739.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/evangelism#:~:text=But%20what%20can%20be%20the%20reason,neither%20have%20provincial%20nor%20national%20assemblies&amp;text=But%20what%20can%20be%20the%20reason%2C%20may%20some&amp;text=they%20can%20neither%20have%20provincial%20nor%20national%20assemblies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-11880a3a39" data-kw="">
<blockquote><p>Thirdly, the Reformed Churches may send pastors to the Indians, for that which Acosta says of Jesuits we may with better reason say it of ourselves: That pastors are as soldiers, and some soldiers are to keep order and remain in a certain place; others run up and down in all places; So some are affixed to a congregation, to feed them; others may be sent to those people who have not heard of the Gospel, which sending is ordinary and lawful in respect of pastors sending and the pastors who are sent, because in pastors, even after the apostles be dead, there remains a general pastoral care for all the Churches of Christ. Thus sending is not ordinary, but extraordinary in respect of those to whom the pastors are sent; yet is it a pastoral sending [as opposed to this being absent in congregationalism in such a case].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (London: 1644), pt. 2, p. 204</span></figcaption>

</figure><figure class="quote" id="q-25f99403e0" data-kw="">
<blockquote><p>Now to the next verse: The words are plain. He makes this more clear, to wit, That they were examples to them of Macedonia &amp; Achaia. And he says, For from you sounded out the word of the Lord, not in Macedonia and Achaia only. Even as, at the beginning this blessed Gospel sounded out from Zion (for they that preached it came from Zion, which is Jerusalem) and spread it abroad through the whole world. So from the Thessalonians the word sounded out, &amp; spread to Macedonia &amp; Achaia. Who were these that sounded the word to Macedonia? Now certainly it appears well, even travelling men, so journeys, passengers, merchants, traffiquers, that had travelling in Macedonia (as men that would go out of Edinburgh to other parts of this Realm) &amp; so from Macedonia to Achaia.

These men as they so journeyed they so journeyed not with close mouths, but they ever sounded as Heralds and Trumpeters sounding, and where ever they found occasion, they spake of Christ, and of that grace which was in him, to them that knew him not. So that they had conference ever of spiritual things. Then ye who travels from town to town, &amp; from Country to Country, ye have your lesson here, ye should not travel with a close[d] mouth, &amp; all your speech should not be of merchandise and traffique; but of some grace ye have gotten at home, disperse and speak of it.

Ye think of duty ye should seek your advantage &amp; merchandise: the Lord has bound your consciences as it were with bonds to speak &amp; open the grace of God, &amp; going to places where there is freedom to speak the Lord bids you speak, he bids you be lamps &amp; lights to blind people, where ever ye resort: for besides all other means, the Lord has appointed this as a mean to win souls to Christ, that ye who travels and have heard of grace should communicate that grace, and have conference thereof to all persons where ye come, that you may win your poor brother &amp; sister that have not heard of it. Alas, our consciences may accuse us very sore for the neglect of our duty herein: And I trow, because when men are abroad travelling, they travel with close mouths, never speaking of the grace they got at home, the Lord has begun to close the mouths of the preachers of grace in this Town here.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-e36ba5a74f" data-kw="">
<blockquote><p>But since our infants also ought to be baptized according to the promise of the Lord, “I will be your God, and the God of your seed” (Gen. 17:7), both the parents of the baptized infants and the ministers of the Church must take the responsibility that, as soon as they have matured, they will be diligently catechized and instructed in the doctrine of Christ, so that they may make for themselves publicly in church the profession of their faith which they were unable to do when they were baptized, confessing their sins, and embracing with a most grateful heart the grace of Baptism conferred on them in infancy, renouncing the world and Satan, and pledging themselves to the obedience of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Christi</cite>, (1550) in Wilhelm Pauck (ed.), The library of Christian classics: Melanchthon and Bucer (Philadelphia, 1969), pp 228-9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-51a882480b" data-kw="">
<blockquote><p>All infants who, in the judgment of charity, are within the covenant, are to be baptized. And baptism is to be administered exactly according to this judgment of charity. And that judgment concludes all to be within the covenant, whose parents were sometime sealed with the seal of the covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oliver-bowles.html">Oliver Bowles</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De pastore evangelico tractatus</cite>, Book 3, Ch. 3, as quoted by Thomas Boston, Works, vol. 6, ‘Miscellaneous Questions’, Question 6, p. 140</span></figcaption>

</figure><figure class="quote" id="q-9dea4eed4c" data-kw="">
<blockquote><p>These Things were so plain to the Jews in the Old Testament, that they made no question but that in the New Testament the Children should be admitted as the Parents were: Therefore you read little of the Baptism of the Infants; but it was clear, that if the Fathers and their Seed were then received into the Covenant by the Seal of Circumcision, (Col. ii. 11, 12.) then in the New Testament the were to be received by the Seal of Baptism; so that in the New Testament you read of nothing but of the joining and gluing to the Church; and as Man and Wife were joined by Marriage Covenant, so were they joined together by Covenant in Church-Fellowship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Government and Discipline of the Churches of Christ, set down by way of Questions and Answers, with an Explanation and Application of the same</cite>, (London: John Clark, 1722), p. 23.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

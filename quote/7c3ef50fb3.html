<blockquote><p>The third thing that fell out in the time of Christ’s crucifying, was the pitiful complaint, in which he cried with a loud voice, Eli, Eli, lama sabacthani, that is, My God, my God, why hast thou forsaken me? In the opening of this complaint many points must be scanned. The first is, what was the cause that moved Christ to complain?

Ans. It was not any impatience or discontentation of mind, or any despair, or any dissembling, as some would have it: but it was an apprehension and a feeling of the whole wrath of God, which seized upon him both in body &amp; soul.

The second, what was the thing whereof he doth complain.

Ans. That he is forsaken of God the father. And from this point ariseth another question. How Christ being God, can be forsaken of God? for the Father, the Son, and the holy Ghost are all three but one and the same God.

Ans. By God we must understand God the father the first person. According to the common rule, when God is compared with the Son or the holy Ghost, then the father is meant by this title, God; as in this place: not that the father is more God then the Son, for in dignity all the three persons are equal: but they are distinguished in order only, and the father is first. And again whereas Christ complaineth that he was forsaken, it must be understood in regard of his human nature, not of his godhead.

And Christ’s manhood was forsaken, not that his godhead and manhood were severed, for they were ever joined together from the first moment of the incarnation: but the godhead of Christ, and so the godhead of the father did not shew forth his power in the manhood, but did as it were lie a sleep for a time, that the manhood might suffer: when a man sleepeth, the soul is not severed from the body, but lieth as it were dead, and exerciseth not it self: even so the godhead lay still, &amp; did not manifest his power in the manhood, &amp; thus the manhood seemed to be forsaken.

The third point is, the manner of this complaint; My God, my God, saith he: these words are words of faith, I say not of justifying faith, whereof Christ stood not in need: but he had such a faith or hope, whereby he did put his confidence in God. The last words, why hast thou forsaken me? seem at the first to be words of distrust. How then (will some say) can these words stand with the former: for faith and distrust are flat contraries?

Ans. Christ did not utter any speech of distrust, but only make his moan and complaint, by reason of the greatness of his punishment: and yet still relied himself on the assistance of his father. Hence we learn first that religion doth not stand in feeling but in faith: which faith we must have in Christ, though we have no feeling at all: for God oftentimes doth withdraw his grace and favour from his children, that he may teach them to believe in his mercy in Christ then, when they feel nothing less than his mercy. And faith and feeling cannot always stand together; because faith is a subsisting of things which are not seen, &amp; the ground of this hoped for, and we must live by faith, and not by feeling.

Though feeling of God’s mercy be a good thing, yet God doth not always vouchsafe to give it unto his children: and therefore in the extremity of afflictions and temptations, we must always trust and rely on God by faith in Christ; as Christ himself doth when he is as it were plunged into the sea of the wrath of God. Secondly, here we may see how God dealeth with his children: for Christ in the sense and feeling of his human nature was forsaken, yet had he sure trust and confidence in God, that caused him to say, My God, my God. God will oftentimes cast his dear children into huge gulfs of woe and misery, where they shall see neither bank nor bottom, nor any way to get out: yet men in this case must not despair, but remember still that that which befell Christ the head, doth also befall his members.

Though Christ him-self at his death did bear the wrath of God in such measure, as that in the sense and feeling of his human nature he was forsaken: yet for all this he was the son of God, and had the spirit of his father, crying, My God, my God. And therefore though we be wonderfully afflicted either in body or in mind, so as we have no sense or feeling of Gods mercy at all, yet must we not despair and think that we are cast-aways, but still labour to trust and rely on God in Christ, and build upon this that we are his children, though we feel nothing but his wrath upon us; against mercy cleaving to his mercy.

This was David’s practise: In the day of trouble (saith he) I sought the Lord: my sore ran and ceased not in the night: my soul refused comfort. I did think upon God and was troubled: my soul was full of anguish: and so he continueth on, saying, Will the Lord absent himself for ever? and will he shew no more favour? hath God forgotten to be merciful? but in the end he recovereth himself out of this gulf of temptation, saying, Yet I remember the years of the right hand of the most high: I remember the works of the Lord, certainly I remember the wonders of old. Wherefore this practise of Christ in his passion, must then be remembered of us all, when God shall humble vs either in body or soul, or both.</p></blockquote>

<blockquote><p>(1.) It is clear that the specific and essential form of a fundamental article is not taken from the authority of God speaking in the Word (seeing God’s authority is one and the same in all that He speaks), but from the influence that the knowledge of an article has to unite us to God in Christ, and bring us to salvation. (2.) And secondly, it will follow that this, Thou shalt not by the use of things indifferent kill him for whom Christ died, and the like is no less fundamental, by evident consequence, in respect it is spoken by God’s own authority, than articles of our faith. (3.) It follows that formalists ignorantly divide matters of God’s worship, into matters of faith, or points fundamental, and things indifferent, as if many scriptural truths were not to be found in God’s Word, such as the miracles of Moses, and Elias, the journeys of Paul, which are neither matters fundamental, nor yet things indifferent. (4.) Many things may be fundamental, by consequence, to one who can read the Word, and hear it read, which is not by consequence fundamental to a rude and ignorant man.</p></blockquote>

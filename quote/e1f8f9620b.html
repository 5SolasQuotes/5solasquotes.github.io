<main class="wrap"><figure class="quote" id="q-e1f8f9620b" data-kw="">
<blockquote><p>Thy teeth shall not do him violence, neither thy stomach contain his glorious body. Thy faith must reach up into heaven. By faith he is seen, by faith he is touched, by faith he is digested. Spiritually by faith we feed upon Christ, when we steadfastly believe that his body was broken, and his blood shed for us upon the cross; by which sacrifice, offered once for all, as sufficient for all, our sins were freely remitted, blotted out, and washed away.

This is our heavenly bread, our spiritual food. This doth strengthen our souls, and cheer our hearts. Sweeter it is unto us than honey, when we are certified by this outward sacrament of the inward grace given unto us through his death; when in him we are assured of remission of sins, and eternal life. Better food than this thy soul can never feed upon. This is the bread of everlasting life. They which truly eat it shall live by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edwin-sandys.html">Edwin Sandys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons made by the Most Reverend Father in God, Edwin, Archbishop of York, primate of England and metropolitan</cite>, (London: Henry Midleton, 1585), p. 76.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cfff28fb4f" data-kw="">
<blockquote><p>The truth is, we cannot lawfully be either praying or praising in the very act of receiving because our hearts and minds should then be exercised in meditating upon Christ’s death and the inestimable benefits which comes to us thereby, 1 Cor. 11:24, ‘Do this in remembrance of Me.’ This remembrance is described, v. 26, ‘Ye do show the Lord’s death.’ Now one of the special ways whereby we remember Christ and so do show forth his death is by private meditation upon his death, as Pareus resolves (Commentary on 1 cor. 11:26). This meditation is a speech of the soul to itself: and though it may stand with short ejaculations, which may and should have place in all our actions, yet can it not stand with an ordinary and continued prayer purposely conceived, as Bishop Lindsey would maintain [who advocated for prayer to God while kneeling to receive the elements]. For how can we orderly both speak to God by prayer and to ourselves by meditation at one instant of time? If therefore prayer be purposely and orderly conceived, it banishes away meditation, which should be the souls exercise in the receiving of the sacrament. And by the contrary, if meditation be entertained, as it should be, it admits not prayer to have place at that time. For it is well said that Dum auribus, oculis, manibus, dentibus exterius; auribus, oculis, manibus, dentibus fidei interius occupamur, orationem continuam et durabilem, absque mentis diragatione ab opere praecepto et imperato, instruere non possumus. (Calderwood, Altar of Damascus, p. 803)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4, pp. 74-75</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-9ad7b51dbc" data-kw="">
<blockquote><p>In the Supper of the Lord, the external minister holds forth the external symbols, the bread of the Lord and the wine of the Lord, which are perceived by the organs of our body, consumed and swallowed. The internal minister, the Holy Spirit, not by external organs of the body, but by his secret virtue, feeds the souls of the faithful, both truly and efficaciously, with the body and the blood of the Lord unto eternal life, as truly as they know themselves to be nourished for this mortal life by bread and wine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvin: Theological Treatises</cite>, J. K. S. Reid, Calvin: Theological Treatises (Louisville, KY; London: Westminster John Knox Press, 1954), 174.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-8bc547c3df" data-kw="">
<blockquote><p>The Church-Government of which I here speak [and argue for], is a Church-government in its morals: To exclude those things that are merely physical and human in this government, as a pulpit of this or that matter, stone or timber, or of this timber, or of any other kind; a communion-table of this, or that form; a cup of wood, or of metal, as silver, tin, etc…. but what sort of river the water of baptism be, is merely physical, not moral.</p></blockquote>

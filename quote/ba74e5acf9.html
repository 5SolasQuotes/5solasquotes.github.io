<blockquote><p>24. Thus the Lord, when he chose Abraham for himself, did not commence with circumcision, in the meanwhile concealing what He meant by that sign, but first announced that He intended to make a covenant with him, and, after his faith in the promise [Gen. 15], made him partaker of the sacrament [Gen. 17]. Why does the sacrament come after faith in Abraham, and precede all intelligence in his son Isaac? It is right that he who, in adult age, is admitted to the fellowship of a covenant by one from whom he had hitherto been alienated, should previously learn its conditions; but it is not so with the infant born to him. He, according to the terms of the promise, is included in the promise by hereditary right from his mother’s womb. Or, to state the matter more briefly and more clearly: If the children of believers, without the help of understanding, are partakers of the covenant, there is no reason why they should be denied the sign, because they are unable to swear to its stipulations. This undoubtedly is the reason why the Lord sometimes declares that the children born to the Israelites are begotten and born to him, (Eze. 16:20; 23:37). For He undoubtedly gives the place of sons to the children of those to whose seed He has promised that He will be a Father. But the child descended from unbelieving parents is deemed an alien to the covenant until he is united to God by faith. Hence, it is not strange that the sign is withheld when the thing signified would be vain and flillacious. In that view, Paul says that the Gentiles, so long as they were plunged in idolatry, were strangers to the covenant, (Eph. 2:11). The whole matter may, if I mistake not, be thus briefly and clearly expounded: Those who, in adult age, embrace the faith of Christ, having hitherto been aliens from the covenant, are not to receive the sign of baptism without previous faith and repentance. These alone can give them access to the fellow- ship of the covenant, whereas children, deriving their origin from Christians, as they are immediately on their birth received by God as heirs of the covenant, are also to be admitted to baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, Book 4</cite>, ch. 16, section 24, trans. Beveridge</span></figcaption>

<blockquote><p>1. It is certain that it is the parents great duty to bring up their children in the nurture and admonition of the Lord. 2. It is certain that God has appointed this to be the means of their actual knowledge, faith and holiness. (Eph. 6:4-5; Col. 3:21; Gen. 18:19; Dt. 6:6-8 &amp; 11:18-20) 3. And God does not appoint such means unnecessarily or in vain: nor may we ordinarily expect his grace but in the use of the means of grace, which He has appointed us to use. 4. It is certain that God’s receiving the children of the faithful is an act of God’s love to the parents as well as the children, and promised as a part of his blessing on themselves. … 6. Even before children are capable of instruction, there are certain duties imposed by God on the parents for their sanctification, viz.: 1. That the parents pray earnestly and believingly for them. 2. That they themselves so live towards God as may invite Him still to bless their children for their sakes, as he did Abraham’s, and usually did to the faithful’s seed. (2nd Commandment; Prov. 20:7) 7. It is certain that the Church ever required parents not only to enter their children into the Covenant, and so to leave them, but to do their after duty for their good, and to pray for them, and educate them according to their Covenant. 8. It is plain that if there were none to promise so to educate them, the Church would not baptize them. And God Himself, who allowed the Israelites, and still allows us, to bring our children into his Covenant, does it on this supposition, that we promise also to go on to do our duty for them, and that we actually do it. 9. All this set together maketh it plain: 1. That God never promises the adult in baptism, though true believers, that He will work in them all graces further by his sanctifying Spirit, let them never so much neglect or resist Him: or that He will absolutely see that they never shall resist Him: nor that the Spirit shall still help them, though they neglect all his means; or that He will keep them from neglecting the means (election may secure this to the elect as such; but the Baptismal Covenant as such secures it not to the baptized, nor to believers as such). 2. And consequently… that the Holy Ghost as your Sanctifier will afford you all necessary help in the use of those means which He has appointed you to receive his help in. … 11. And how dangerously parents may make partial forfeitures of the Spirit’s assistance to their children, and operations on them, by their own sinful lives, and neglect of prayer, and of prudent and holy education, even in particular acts, I fear many believing parents never well considered. 12. Yet is not this forfeiture such as obliges God to deny his Spirit: For He may do with his own, as a free benefactor, as He list; and may have mercy freely, beyond his promise (though not against his Word) on whom He will have mercy. But I say that He that considers the woeful unfaithfulness and neglect of most parents, even the religious, in the great work of holy educating their children, may take the blame of their ungodliness on themselves, and not lay it on Christ or the Spirit who was in Covenant with them as their Sanctifier, seeing He promised but conditionally to give them the sanctifying heavenly influences of his life, light, and love, in their just use of his appointed means, according to their abilities. 13. Also as soon as children come to a little use of reason, they stand conjunctly on their parents’ wills and on their own. As their parents are bound to teach and rule them, so they are bound to learn of them and be ruled by them for their good. And though every sin of a parent or a child be not a total forfeiture of grace, yet both their notable actual sins may justly be punished with a denial of some further help of the Spirit which they grieve and quench.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory... (London: 1673) | Question 43, ‘Is the right of the baptized (infants or adult) to the sanctifying operations of the Holy Ghost, now absolute, or suspended on further conditions?…’</cite>, pp. 821-22</span></figcaption>

<blockquote><p>1. In the controversy upon the perseverance or falling away of believers or saints, the question relates to that faith or sanctifying grace which may be received, exercised, retained, or rejected only through the medium, or some exercise of, free will [i.e. in adults].</p></blockquote>

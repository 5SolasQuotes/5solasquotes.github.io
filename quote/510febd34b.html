<main class="wrap"><figure class="quote" id="q-510febd34b" data-kw="">
<blockquote><p>Now Faith.” Faith in the word of God is specially of three sorts: historical, miraculous, [and] justifying or saving faith. First, historical faith is not only a knowledge of the word, but an assent of the heart to the truth of it. And this faith is general not only to all men, good and bad, but even to the devils themselves: “Thou believest there is one God, thou doest well: the devils also believe it, and tremble” (James 2:19), Now he that will believe out of the Scripture there is one God, he will believe historically anything in the Scriptures. Second, miraculous, or the faith of miracles, which is an inward persuasion of the heart wrought by some special instinct of the Holy Ghost in some man, whereby he is truly persuaded that God will use him as His instrument for the working of some miracles. This is also general, both to elect and reprobate. Judas had it with the rest of the apostles. Thirdly, (commonly called justifying) faith, which is a special persuasion wrought by the Holy Ghost in the heart of the those that are effectually called concerning their reconciliation and salvation by Christ. Of these three sorts sof faith, the third is principally meant in this place….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, 11 The Works of William Perkins, vol. 3. ed. Randall J. Pederson and Ryan M. Hurd (Grand Rapids: Reformation Heritage Books, 2017), 6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith.html">Faith</a></span></div>

ns-on-faith-in-hebrews-11/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cc4ddf99c3" data-kw="">
<blockquote><p>Again, as sanctification is imperfect, so faith has its degrees by which it increases and grows, both as to knowledge and as to trust. In this sense, we do not deny that faith can be called in a certain sense implicit, both in children and the uninstructed (who have only an obscure knowledge) and in the more advanced (in whom the light is always mixed with darkness, who often can reach only the fact [to hoti], but do not rise to the why [to dioti]). Thus the faith of the Old Testament fathers could be called obscure and implicit with respect to ours on account of the obscurity of the revelation. But the question is whether faith in its conception included knowledge; if not a full, still a true and certain knowledge in its own order.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, tr. George M. Giger, ed. James Dennison Jr. (1679–1685; P&amp;R, 1994) | 15th Topic, 9th Question, ‘Is faith assent without knowledge and can it be defined better by ignorance than by knowledge? We deny against the Romanists.’ in vol. 2, pp. 564-68, p. 565</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/implicit-faith.html">Implicit Faith</a></span></div>

h%20has&amp;text=true%20and%20certain%20knowledge%20in%20its%20own%20order" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b0babaf1a5" data-kw="">
<blockquote><p>But, 2. All the power and authority of synods we conceive to be ministerial, not lordly, limited, regulated by the only Word of God in the Scripture, and in matters circumstantial, of order and decency, as time, place, persons (observe I say not in mystical religions, ceremonies, called, but unjustly, ‘indifferent’, or the like) by the law of nature, rules of piety, charity, and Christian prudency, for the edification of our brethren and the glory of God; and a lawful synod we judge has power ministerial from Christ to pass constitutions [in Greek] ‘decrees’, Acts 16:4 (‘laws’ I do not call them, because Christ is the only Lawgiver, King, and head of his Church, his officers are only servants and heralds to hold forth his laws) and these constitutions [or creeds and confessions] condemning Arminianism, Socinianism, Familism, Antinomianism, etc…. and commanding in the Lord that they consent to the form of sound doctrine, rebuking all that subvert souls, and trouble the Churches, Acts 15:23-24, are to be obeyed, and the conscience submitted to them, not absolutely, not for the sole will and mere authority of the heralds, as if they were infallible, not with blind obedience, not without reclamation, or appeal, if they be either contrary or beside the scriptures, but conditionally in so far as they are agreeable to the Word of God…</p></blockquote>

</figure><figure class="quote" id="q-0b49af45fd" data-kw="">
<blockquote><p>The way of nature is to go into oneself for all; according to the fundamental maxim of unsanctified morality, &quot;That a man should trust in himself;&quot; which, according to the doctrine of faith, is mere foolishness … Now faith is the soul&#x27;s going out of itself for all—and this, nature, on the other hand, determines to be foolishness, 1 Cor. 1:18-23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Human Nature in Its Fourfold State</cite>, State II</span></figcaption>

</figure><figure class="quote" id="q-57fc8840e2" data-kw="">
<blockquote><p>The first is the act of knowledge (notitia)—of all things to be believed by us, whether pertaining to our misery or to the grace of God. For as truth is the object of faith (and indeed not any truth, but the divine and supernatural truth revealed in the word of God), it requires above all knowledge for its apprehension.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-27d1b45792" data-kw="">
<blockquote><p>Reform your own lives and conversations; for how reasonable is it that you who make laws that others do not swear, you your selves should not? how fit is it that you who bind others to the keeping of the Sabbath, you your selves should sanctify it? And this again did undo Jehu, that although he pulled down Baal, yet he did not reform himself from Jeroboam’s sins: lege historiam ne fias historia, read the history of Jehu, lest thou thy self be made such an history to others.

Oh therefore let it be true of thee, that since thou hast been labouring in this public Reformation, thou hast been more holy, thou hast been more pure: Thou that hast endeavoured to make way for Christ in the Church and State, hast much more made way for him in thy own family: What will it profit to have holy Ordinances, holy Worship, if we our selves still remain unholy?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The difficulty of and the encouragements to a reformation a sermon preached before the honourable House of Commons at the publick fast, Septem. 27, 1643</cite>, (London: Thomas Underhill, 1643), p. 27.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9d81b301a0" data-kw="">
<blockquote><p>Do not imagine that no one can please God while he is engaged in military service. Among such was holy David to whom the Lord gave such high testimony. Among such were many just men of that time. Among such, also, was that centurion who said to the Lord: ‘I am not worthy that thou shouldst enter under my roof, but only say the word and my servant shall be healed. For I also am a man, subject to authority, having under me soldiers, and I say to this one: Go, and he goeth, and to another: Come, and he cometh; and to my servant: Do this, and he doth it’; of him the Lord said: ‘Amen I say to you I have not found so great faith in Israel.’ Among such, also, was that Cornelius to whom the angel was sent, who said: ‘Cornelius, thy prayer is heard and thy alms are accepted,’ when he advised him to send to the blessed Apostle Peter, to hear from him what he ought to do. And to summon the Apostle to him he sent a religious soldier.

Among such, also, were those who came for baptism to John, the holy precursor of the Lord and friend of the bridegroom, of whom the Lord said: ‘There hath not arisen among them that are born of women a greater one than John the Baptist.’ When they asked him what they ought to do, he answered them: ‘Do violence to no man, neither calumniate any man, and be content with your pay.’ Obviously, he did not forbid them to serve in the army when he commanded them to be satisfied with their pay.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Boniface, c. 418 (no. 189) in Saint Augustine Letters: Volume IV (c. 420-30), trans. Wilfred Parsons, The Fathers of the Church: A New Translation, vol. 30 (Washington D.C.: The Catholic University of America Press, 1955), p. 268.</cite></span></figcaption>

</figure><figure class="quote" id="q-aafb2b9365" data-kw="">
<blockquote><p>Let the most bitter-spirited antagonist ingenuously say, ‘Is not the whole Book of Psalms (so often avowed, cited, and used by Christ) Sepher-Tehillim, a Book of Praises, composed for the Churches use unto the end of time [in contrast to adding instrumentation]?’ or think you that this so excellent a part of Scripture was written only to inform us what the saints of God did before us, but not what we also must do by their example [of playing instruments in worship]? As for the abuse of music, we abominate it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon Delivered</cite>, (London, 1663), p. 15. This sermon was given shortly after the Restoration and Great Ejection of 1662, in order to defend in Reading’s church, the cathedral church in Canterbury, that instruments were lawful in public worship, contra the dissenting puritans. Cathedral churches usually had more ornate music than parish churches.</span></figcaption>

<blockquote><p>1. What this Covenant is. You must know, that there is a double covenant, there is a covenant of works, and a covenant of grace: The covenant of works runs in these terms: “Do this and you shall live, and I will be your God.” This is the covenant that was made with Adam and the covenant that is expressed by Moses in the Moral Law, “Do this and live.” The second is the covenant of grace, and that runs in these terms: “You shall believe, you shalt take my Son for your Lord, and your Savior, and you shall likewise receive the gift of righteousness, which was wrought by him, for an absolution for your sins, for a reconciliation with me, and thereupon thou shall grow up in love and obedience towards me and then I will be your God, and you shall be my people.” This is the covenant of grace, “you shall believe, and take my Son and accept of the gift of righteousness” and “I will be your God.” The difference between them you shall find, 2 Cor. 3. where you shall see 3 differences, to reduce them to those heads, I will not trouble you with particular places, lest I stay too long upon them. The first covenant “was a ministration of the letter,” that is, in the first covenant, there was no more heard nor seen, but the naked commandment it was written in Tables of stone, and presented to them, there went with it no aptness, no disposition to keep it: they heard what the Law was, they saw what God required, but there was no more, and those that were declarers of it, were but the ministers of the Letter, and not of the Spirit. Secondly, this covenant, it brings only a servile fear, and enmity: for when a man looks upon the Author of this covenant, and he hears no more but the Law, and what it requires: he looks upon God, as a hard Master, as an enemy; again, he looks upon his Law as a hard and cruel Law, as a heavy yoke, as an unsupportable bondage, and therefore he hates it, and wishes there were no such Law; he runs from it, as a Bond slave runs from his Master, as far as it is in his power. This is that which is said, Gal 4. Hagar genders to bondage, that is, the covenant of works begets bond-men, and slaves, and not sons and freemen; and likewise that, Heb. 12:18. says the Apostle, “You are not come to Mount Sinai, to the burning of fire, to clouds, to darkness, to tempest, to the sound of a trumpet, so that Moses himself did quake and tremble.” That is, when a man looks upon this covenant of works, it causes in him a fear and enmity, that is the 2nd difference. The third is, That it is a ministration of death, as it is called, 2 Cor. 3. a ministration of death, that is, it propounds a curse to all those that do not keep it, and shews no means to avoid it: and therefore a man is affected to it, and to God the Author of it, as one is to an enemy that seeks his destruction; and therefore the ministration of it is said to be the ministration of death. The reason of this is, not because there is any ill in the Law, it is a ministration of the letter, it begets fear and enmity, it is a ministration of death: I say, this arises not from hence, that the Law of God is a cruel deadly Law: (for the Law is good) but it arises from the weakness, and the infirmity of the flesh: As for example, if you would take a potter’s vessel, and dash it against the firm Wall, the reason why the Wall is the destruction of the Vessel, is not any infirmity or weakness in the wall, for it is the excellency and virtue of the Wall to be hard, it should be so; but it is the weakness and fragility, and brittleness of the vessel, and thence comes it to be broken asunder, and so in this case, the reason why this Law or Covenant of works is a ministration of death, and of enmity, it is not because there is any imperfection in the law, it arises rather from the perfection of it, but it is from the weakness of the flesh that is not able to keep the law? it is the excellency of the aw, that it is so perfect, that a man is not able to keep it: it arises, I say, from the weakness and infirmity of the flesh, that is not able to observe this law. First, is a ministration of the Spirit, and not of the letter. Secondly, a ministration of love, not of enmity; of freedom, not of bondage; it is a ministration of righteousness, as it is there called the ministration of righteousness; for if the ministration of condemnation were glorious, much more shall the ministration of righteousness exceed in glory. Thirdly, a ministration of life and justification, and not a ministration of death and condemnation. The ground of this, and how it is thus, we shall show you, expressing to you the order how these depend, and follow one upon the other: when a man hath looked upon the covenant of works, and sees death in it, sees a strict law that he is not able to keep: then comes the covenant of grace, and shows to him a righteousness to satisfy that law that himself never wrought, shows him a way of obtaining pardon and remission for the sins that he hath committed against this law, by the death and satisfaction of another: when he sees this, he sees withal the goodness and mercy of God, giving this to him for his salvation out of his free grace and mercy: and when he sees it, the opinion, of a sinner is changed, mark; I say, his opinion, his disposition, and affection is altered, he looks not on God now as upon a hard and cruel Master, but he looks upon him now as a God exceeding full of mercy and compassion: whence this follows, that his heart melts toward the Lord, it relents, it comes to be a soft heart, that is easy and tractable, it is not haled now to the commandment, but out of an ingenuity and willingness he comes and serves the LORD, with alacrity and cheerfulness: the disposition is wrought in him, because now he sees another way, his apprehension is altered, even as a servant when it is revealed to him that he is a son, and that those hard tasks that are laid on him, are the best way to lead him to happiness, they are but rules of direction, for his own wealth, and for his own advantage, he doth them now with all willingness, the case is altered, he looks not now upon the Law of God as an enemy, or as a hard bondage, but he looks upon all the law of God as a wholesome and profitable rule of direction, that he is willing to keep for his own comfort: now, when the heart is thus softened, then the Spirit of God is sent into his heart, and writes the Law of God in his inward parts; as you shall see if you compare these two places together, Heb. 8. 8. 9. 10. “Behold, says the Lord, I will make a new covenant and this is the Testament that I will make with the house of Israel: After those days saith the Lord, I will put my laws into their minds and in their hearts will I write them; and I will be….” [the following pages are missing in the typescript].</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. What this Covenant is. You must know, that there is a double covenant, there is a covenant of works, and a covenant of grace: The covenant of works runs in these terms: “Do this and you shall live, and I will be your God.” This is the covenant that was made with Adam and the covenant that is expressed by Moses in the Moral Law, “Do this and live.” The second is the covenant of grace, and that runs in these terms: “You shall believe, you shalt take my Son for your Lord, and your Savior, and you shall likewise receive the gift of righteousness, which was wrought by him, for an absolution for your sins, for a reconciliation with me, and thereupon thou shall grow up in love and obedience towards me and then I will be your God, and you shall be my people.” This is the covenant of grace, “you shall believe, and take my Son and accept of the gift of righteousness” and “I will be your God.” The difference between them you shall find, 2 Cor. 3. where you shall see 3 differences, to reduce them to those heads, I will not trouble you with particular places, lest I stay too long upon them. The first covenant “was a ministration of the letter,” that is, in the first covenant, there was no more heard nor seen, but the naked commandment it was written in Tables of stone, and presented to them, there went with it no aptness, no disposition to keep it: they heard what the Law was, they saw what God required, but there was no more, and those that were declarers of it, were but the ministers of the Letter, and not of the Spirit. Secondly, this covenant, it brings only a servile fear, and enmity: for when a man looks upon the Author of this covenant, and he hears no more but the Law, and what it requires: he looks upon God, as a hard Master, as an enemy; again, he looks upon his Law as a hard and cruel Law, as a heavy yoke, as an unsupportable bondage, and therefore he hates it, and wishes there were no such Law; he runs from it, as a Bond slave runs from his Master, as far as it is in his power. This is that which is said, Gal 4. Hagar genders to bondage, that is, the covenant of works begets bond-men, and slaves, and not sons and freemen; and likewise that, Heb. 12:18. says the Apostle, “You are not come to Mount Sinai, to the burning of fire, to clouds, to darkness, to tempest, to the sound of a trumpet, so that Moses himself did quake and tremble.” That is, when a man looks upon this covenant of works, it causes in him a fear and enmity, that is the 2nd difference. The third is, That it is a ministration of death, as it is called, 2 Cor. 3. a ministration of death, that is, it propounds a curse to all those that do not keep it, and shews no means to avoid it: and therefore a man is affected to it, and to God the Author of it, as one is to an enemy that seeks his destruction; and therefore the ministration of it is said to be the ministration of death. The reason of this is, not because there is any ill in the Law, it is a ministration of the letter, it begets fear and enmity, it is a ministration of death: I say, this arises not from hence, that the Law of God is a cruel deadly Law: (for the Law is good) but it arises from the weakness, and the infirmity of the flesh: As for example, if you would take a potter’s vessel, and dash it against the firm Wall, the reason why the Wall is the destruction of the Vessel, is not any infirmity or weakness in the wall, for it is the excellency and virtue of the Wall to be hard, it should be so; but it is the weakness and fragility, and brittleness of the vessel, and thence comes it to be broken asunder, and so in this case, the reason why this Law or Covenant of works is a ministration of death, and of enmity, it is not because there is any imperfection in the law, it arises rather from the perfection of it, but it is from the weakness of the flesh that is not able to keep the law? it is the excellency of the aw, that it is so perfect, that a man is not able to keep it: it arises, I say, from the weakness and infirmity of the flesh, that is not able to observe this law. First, is a ministration of the Spirit, and not of the letter. Secondly, a ministration of love, not of enmity; of freedom, not of bondage; it is a ministration of righteousness, as it is there called the ministration of righteousness; for if the ministration of condemnation were glorious, much more shall the ministration of righteousness exceed in glory. Thirdly, a ministration of life and justification, and not a ministration of death and condemnation. The ground of this, and how it is thus, we shall show you, expressing to you the order how these depend, and follow one upon the other: when a man hath looked upon the covenant of works, and sees death in it, sees a strict law that he is not able to keep: then comes the covenant of grace, and shows to him a righteousness to satisfy that law that himself never wrought, shows him a way of obtaining pardon and remission for the sins that he hath committed against this law, by the death and satisfaction of another: when he sees this, he sees withal the goodness and mercy of God, giving this to him for his salvation out of his free grace and mercy: and when he sees it, the opinion, of a sinner is changed, mark; I say, his opinion, his disposition, and affection is altered, he looks not on God now as upon a hard and cruel Master, but he looks upon him now as a God exceeding full of mercy and compassion: whence this follows, that his heart melts toward the Lord, it relents, it comes to be a soft heart, that is easy and tractable, it is not haled now to the commandment, but out of an ingenuity and willingness he comes and serves the LORD, with alacrity and cheerfulness: the disposition is wrought in him, because now he sees another way, his apprehension is altered, even as a servant when it is revealed to him that he is a son, and that those hard tasks that are laid on him, are the best way to lead him to happiness, they are but rules of direction, for his own wealth, and for his own advantage, he doth them now with all willingness, the case is altered, he looks not now upon the Law of God as an enemy, or as a hard bondage, but he looks upon all the law of God as a wholesome and profitable rule of direction, that he is willing to keep for his own comfort: now, when the heart is thus softened, then the Spirit of God is sent into his heart, and writes the Law of God in his inward parts; as you shall see if you compare these two places together, Heb. 8. 8. 9. 10. “Behold, says the Lord, I will make a new covenant and this is the Testament that I will make with the house of Israel: After those days saith the Lord, I will put my laws into their minds and in their hearts will I write them; and I will be….” [the following pages are missing in the typescript].”

pon+the+Author+of+this+covenant%2C+and+he+hears+no+more+but+the+Law%2C+and+what+it+requires%3A+he+looks+upon+God%2C+as+a+hard+Master%2C+as+an+enemy%3B+again%2C+he+looks+upon+his+Law+as+a+hard+and+cruel+Law%2C+as+a+heavy+yoke%2C+as+an+unsupportable+bondage%2C+and+therefore+he+hates+it%2C+and+wishes+there+were+no+such+Law%3B+he+runs+from+it%2C+as+a+Bond+slave+runs+from+his+Master%2C+as+far+as+it+is+in+his+power.+This+is+that+which+is+said%2C+Gal+4.+Hagar+genders+to+bondage%2C+that+is%2C+the+covenant+of+works+begets+bond-men%2C+and+slaves%2C+and+not+sons+and+freemen%3B+and+likewise+that%2C+Heb.+12%3A18.+says+the+Apostle%2C+%E2%80%9CYou+are+not+come+to+Mount+Sinai%2C+to+the+burning+of+fire%2C+to+clouds%2C+to+darkness%2C+to+tempest%2C+to+the+sound+of+a+trumpet%2C+so+that+Moses+himself+did+quake+and+tremble.%E2%80%9D+That+is%2C+when+a+man+looks+upon+this+covenant+of+works%2C+it+causes+in+him+a+fear+and+enmity%2C+that+is+the+2nd+difference.+The+third+is%2C+That+it+is+a+ministration+of+death%2C+as+it+is+called%2C+2+Cor.+3.+a+ministration+of+death%2C+that+is%2C+it+propounds+a+curse+to+all+those+that+do+not+keep+it%2C+and+shews+no+means+to+avoid+it%3A+and+therefore+a+man+is+affected+to+it%2C+and+to+God+the+Author+of+it%2C+as+one+is+to+an+enemy+that+seeks+his+destruction%3B+and+therefore+the+ministration+of+it+is+said+to+be+the+ministration+of+death.+The+reason+of+this+is%2C+not+because+there+is+any+ill+in+the+Law%2C+it+is+a+ministration+of+the+letter%2C+it+begets+fear+and+enmity%2C+it+is+a+ministration+of+death%3A+I+say%2C+this+arises+not+from+hence%2C+that+the+Law+of+God+is+a+cruel+deadly+Law%3A+%28for+the+Law+is+good%29+but+it+arises+from+the+weakness%2C+and+the+infirmity+of+the+flesh%3A+As+for+example%2C+if+you+would+take+a+potter%E2%80%99s+vessel%2C+and+dash+it+against+the+firm+Wall%2C+the+reason+why+the+Wall+is+the+destruction+of+the+Vessel%2C+is+not+any+infirmity+or+weakness+in+the+wall%2C+for+it+is+the+excellency+and+virtue+of+the+Wall+to+be+hard%2C+it+should+be+so%3B+but+it+is+the+weakness+and+fragility%2C+and+brittleness+of+the+vessel%2C+and+thence+comes+it+to+be+broken+asunder%2C+and+so+in+this+case%2C+the+reason+why+this+Law+or+Covenant+of+works+is+a+ministration+of+death%2C+and+of+enmity%2C+it+is+not+because+there+is+any+imperfection+in+the+law%2C+it+arises+rather+from+the+perfection+of+it%2C+but+it+is+from+the+weakness+of+the+flesh+that+is+not+able+to+keep+the+law%3F+it+is+the+excellency+of+the+aw%2C+that+it+is+so+perfect%2C+that+a+man+is+not+able+to+keep+it%3A+it+arises%2C+I+say%2C+from+the+weakness+and+infirmity+of+the+flesh%2C+that+is+not+able+to+observe+this+law.+First%2C+is+a+ministration+of+the+Spirit%2C+and+not+of+the+letter.+Secondly%2C+a+ministration+of+love%2C+not+of+enmity%3B+of+freedom%2C+not+of+bondage%3B+it+is+a+ministration+of+righteousness%2C+as+it+is+there+called+the+ministration+of+righteousness%3B+for+if+the+ministration+of+condemnation+were+glorious%2C+much+more+shall+the+ministration+of+righteousness+exceed+in+glory.+Thirdly%2C+a+ministration+of+life+and+justification%2C+and+not+a+ministration+of+death+and+condemnation.+The+ground+of+this%2C+and+how+it+is+thus%2C+we+shall+show+you%2C+expressing+to+you+the+order+how+these+depend%2C+and+follow+one+upon+the+other%3A+when+a+man+hath+looked+upon+the+covenant+of+works%2C+and+sees+death+in+it%2C+sees+a+strict+law+that+he+is+not+able+to+keep%3A+then+comes+the+covenant+of+grace%2C+and+shows+to+him+a+righteousness+to+satisfy+that+law+that+himself+never+wrought%2C+shows+him+a+way+of+obtaining+pardon+and+remission+for+the+sins+that+he+hath+committed+against+this+law%2C+by+the+death+and+satisfaction+of+another%3A+when+he+sees+this%2C+he+sees+withal+the+goodness+and+mercy+of+God%2C+giving+this+to+him+for+his+salvation+out+of+his+free+grace+and+mercy%3A+and+when+he+sees+it%2C+the+opinion%2C+of+a+sinner+is+changed%2C+mark%3B+I+say%2C+his+opinion%2C+his+disposition%2C+and+affection+is+altered%2C+he+looks+not+on+God+now+as+upon+a+hard+and+cruel+Master%2C+but+he+looks+upon+him+now+as+a+God+exceeding+full+of+mercy+and+compassion%3A+whence+this+follows%2C+that+his+heart+melts+toward+the+Lord%2C+it+relents%2C+it+comes+to+be+a+soft+heart%2C+that+is+easy+and+tractable%2C+it+is+not+haled+now+to+the+commandment%2C+but+out+of+an+ingenuity+and+willingness+he+comes+and+serves+the+LORD%2C+with+alacrity+and+cheerfulness%3A+the+disposition+is+wrought+in+him%2C+because+now+he+sees+another+way%2C+his+apprehension+is+altered%2C+even+as+a+servant+when+it+is+revealed+to+him+that+he+is+a+son%2C+and+that+those+hard+tasks+that+are+laid+on+him%2C+are+the+best+way+to+lead+him+to+happiness%2C+they+are+but+rules+of+direction%2C+for+his+own+wealth%2C+and+for+his+own+advantage%2C+he+doth+them+now+with+all+willingness%2C+the+case+is+altered%2C+he+looks+not+now+upon+the+Law+of+God+as+an+enemy%2C+or+as+a+hard+bondage%2C+but+he+looks+upon+all+the+law+of+God+as+a+wholesome+and+profitable+rule+of+direction%2C+that+he+is+willing+to+keep+for+his+own+comfort%3A+now%2C+when+the+heart+is+thus+softened%2C+then+the+Spirit+of+God+is+sent+into+his+heart%2C+and+writes+the+Law+of+God+in+his+inward+parts%3B+as+you+shall+see+if+you+compare+these+two+places+together%2C+Heb.+8.+8.+9.+10.+%E2%80%9CBehold%2C+says+the+Lord%2C+I+will+make+a+new+covenant+and+this+is+the+Testament+that+I+will+make+with+the+house+of+Israel%3A+After+those+days+saith+the+Lord%2C+I+will+put+my+laws+into+their+minds+and+in+their+hearts+will+I+write+them%3B+and+I+will+be%E2%80%A6.%E2%80%9D+%5Bthe+following+pages+are+missing+in+the+typescript%5D.%E2%80%9D%0A%0A%E2%80%94+John+Preston%2C+The+New+Covenant+or+The+Saints+Portion%2C+%28London%2C+1639%29%2C+314%E2%80%9318.+%5Bspelling+and+punctuation+modernized%5D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F779c3f5d94.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/779c3f5d94.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/01/preston-on-the-distinction-between-the-covenants-of-works-and-grace/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Such is the view given by our Lord on the law of the Sabbath, speaking as from the ground of law, and doing the part merely of a correct expounder of its meaning; but a thought is introduced and variously expressed, as from His own higher elevation, in harmony with the spiritual aspect of the subject He had presented, and pointing to still further developments of it. The Temple, He had said, has claims of service, which it was no proper desecration of the Sabbath, but the reverse, to satisfy; and ‘a greater than the Temple was there.’ ‘The Temple yields to Christ, the Sabbath yields to the Temple, therefore the Sabbath yields to Christ’ – so the sentiment is syllogistically expressed by Bengel; but yields, it must be observed, in both cases alike, only for the performance of works not antagonistic, but homogeneous, to its nature.

Or, as it is again put, ‘The Son of Man is Lord of the Sabbath.’ Made, as the Sabbath was, for man, there necessarily belongs to man, within certain limits, a regulating power in respect to its observance, so as to render it more effectually subservient to its proper ends. But this power is supremely resident in Him, who is the Son of Man, in whom Humanity attains to its true ideal of goodness, whose will is in all things coincident with the will of God, and who, like the Father, works even while He rests. He is Lord of the Sabbath, and, as such, has a right to order everything concerning it, so as to make it, in the fullest sense, a day of blessing for man – a right, therefore, if He should see fit, to transfer its observance from the last day of the week to the first, that it might be associated with the consummation of His redemptive work, and to make it, in accordance with the impulsive life and energy thereby brought in, more than in the past, a day of active and hallowed employment for the good of men.

So much was certainly implied in the claim of our Lord in reference to the Sabbath; but as regards the existence of such a day, its stated place in the ever-recurring weekly cycle, which in its origin was coeval with the beginning of the world, which as a law was inscribed among the fundamental precepts of the Decalogue, which renders it on the one side a memorial of the paradise that has been lost, and on the other a pledge of the paradise to be restored — in this respect nothing of a reactionary nature fell from our Lord, nor was any principle advanced which can justly be said to point in such a direction.</p></blockquote>

2C+therefore%2C+if+He+should+see+fit%2C+to+transfer+its+observance+from+the+last+day+of+the+week+to+the+first%2C+that+it+might+be+associated+with+the+consummation+of+His+redemptive+work%2C+and+to+make+it%2C+in+accordance+with+the+impulsive+life+and+energy+thereby+brought+in%2C+more+than+in+the+past%2C+a+day+of+active+and+hallowed+employment+for+the+good+of+men.%0A%0ASo+much+was+certainly+implied+in+the+claim+of+our+Lord+in+reference+to+the+Sabbath%3B+but+as+regards+the+existence+of+such+a+day%2C+its+stated+place+in+the+ever-recurring+weekly+cycle%2C+which+in+its+origin+was+coeval+with+the+beginning+of+the+world%2C+which+as+a+law+was+inscribed+among+the+fundamental+precepts+of+the+Decalogue%2C+which+renders+it+on+the+one+side+a+memorial+of+the+paradise+that+has+been+lost%2C+and+on+the+other+a+pledge+of+the+paradise+to+be+restored+%E2%80%94+in+this+respect+nothing+of+a+reactionary+nature+fell+from+our+Lord%2C+nor+was+any+principle+advanced+which+can+justly+be+said+to+point+in+such+a+direction.%E2%80%9D%0A%0A%E2%80%94+Patrick+Fairbairn%2C+The+Revelation+of+Law+in+Scripture%3A+Considered+with+respect+both+to+its+own+Nature%2C+and+to+its+Relative+Place+in+Successive+Dispensations.+The+Third+Series+of+the+%E2%80%98Cunningham+Lectures%E2%80%99%2C+%28Edinburgh%3A+T.+%26+T.+Clark%2C+1869%29%2C+pp+237-39.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa1e3d1d1e6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a1e3d1d1e6.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/12/31/patrick-fairbairn-on-christ-and-the-sabbath-2/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-c6b03f72de" data-kw="">
<blockquote><p>As the Magistrate therefore both with word and sword must defend God’s cause, his Religion, Temple, People, Ministers and Doctrine, so must the Preacher, and those that be learned, with their pains, prayer, preaching, and all other means that they can: yea if our goods or lives were required for the defence of it, no state of men ought to refuse it. For this end are we born and live, to glorify our God, and set forth his praise: for this purpose are all things given us, and therefore must not be spared, but spent and bestowed, when his glory requireth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Parliament’s commission: delivered in a sermon, upon Nehemiah chap. 2 vers. 19, 20</cite>, (London: R. Austin, 1643), p. 4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>That is, the General Assembly decided that appeals cannot lie except in judicial cases. It is really a matter of importance. It would be a hard case if a party, suffering under a grievous wrong, should be turned away from the bar of our highest judicatory, merely on the ground that he had mistaken the nature of his remedy… We have had a superior judicatory in our Church for more than a hundred and twenty years. During about seventy years of this period, our discipline was conducted according to the Westminster Directory. In 1789 our present constitution went into operation; which was submitted to an extensive revision and alteration, as to matters of detail, in 1821. Under these several systems, appeals and complaints were allowed, without hindrance or contradiction, from any kind of decision in an inferior judicatory by a person who felt himself aggrieved, until 1834. Then, for the first time in our history, as far as we know, the idea was started that appeals and complaints could be made only in cases strictly judicial. …That this novel doctrine was not at that time the doctrine of the synod, which the Rev. gentleman defended, is plain… Though the synod was thus free from this new doctrine in May 1834, it grew in such sudden favour, that when that body met the following autumn, they decided not merely that appeals and com- plaints could not lie except in judicial cases, but even that protests were in the same predicament. This is an instructive illustration of the fact that the wisest and best men sometimes allow themselves to be run away with by a plausible idea, though contrary to all their own previous professions and practice. This, however, was a mere temporary delusion. The members of that synod who had signed or allowed protests in all kinds of cases before, still continued to sign or allow them, with equal freedom, their own decision to the contrary notwithstanding… We found its very authors and advocates disregarding it the very next year; acting as though no such doctrine had ever been broached. If they practically abandoned it as untenable… The Synod of Philadelphia extended the [new] doctrine to appeals, complaints and protests. Thus putting minorities completely under the feet of majorities, not allowing them even the right of recording their dissent with the reasons for it… …There is a good deal of confusion and error often occasioned by the mere designation of our ecclesiastical bodies as courts or judicatories. They are so called Avhen not sitting in judicial capacity… Our courts are bodies sui generis [of their kind]; they include within themselves legislative, executive and judicial powers. Yet this division is in a great measure arbitrary. These several powers are but different modes of exercising the general governing authority in the Church; and it is often very difficult to say whether a particular act should be placed under the one or the other of these heads… An appeal supposes an aggrieved party, but he may appeal from any kind of decision which directly affects himself. A complaint supposes some kind of impropriety in the act complained of, but it may be entered against any kind of act alleged to be improper. So that any kind of decision may be regularly brought up in each of the several ways specified above. That this is the true meaning of this article, might be inferred with certainty from the fact that it has always been so understood and acted upon; and that it is almost a literal transcript of the Scottish rule on the same subject, which has always been interpreted and applied in the same way… In the first place, these technical terms are to be understood, not according to their use in civil courts, but according to our own ecclesiastical usage. Our bodies are called courts; their decisions are called judgments; the matters brought before them are called cases. Are we to infer from this, as has been done by the New School lawyers and brethren, that they have nothing but judicial powers… In the second place, our rules were drawn up with special reference to that class of cases which is of most frequent occurrence, and hence the language employed is adapted to such cases… In the third place it is a fallacy running through this argument that there can be no judicial investigation of anything but a judicial act… There is, therefore, no foundation in our constitution for this new doctrine. Every letter of the rules may be, and has been fully complied with in a multitude of cases, where the decision appealed from was merely an executive act… We shall proceed to show that this new doctrine, especially if applied to complaints as well as appeals (and we have seen that the two cannot in this matter be consistently separated), is subversive of the fundamental principles of Presbyterianism, and inconsistent with the uniform practice of the Church… This doctrine is at variance also with the undeviating practice of our own and all other Presbyterian Churches. This of itself is a fatal objection to any new doctrine. The fact that we have been going on in accordance with the usage of all other Presbyterian bodies, for a hundred and twenty years, interpreting and administering our constitution in a certain way, is answer enough… The words of our book have the sense which they were intended to bear; and they were intended to bear the sense in which its authors and administrators have ever understood and applied them… That the practice of our Church has been uniform on this subject, is admitted… There is not then, upon our Minutes, a single case of an appeal or complaint, which was rejected on the ground that it did not refer to a judicial sentence. We have been going on for a hundred and twenty years entertaining such appeals without any one dreaming of their being irregular… If after all this a new and opposite doctrine is to be introduced, there never can be any stability or security with regard to any principle of Presbyterian Church government… Nothing short of a plain and intelligible denial of the right to complain of oppressive and unconstitutional acts; or to appeal from unrighteous decisions, though they may not be judicial, will induce Presbyterians to forego a privilege which they have enjoyed from the very foundation of their Church… If it is to be applied to appeals, we see not how any one can fail to apply it to complaints and references, and if so applied, all must acknowledge that our system of government would be completely overturned. The right of appeal is already restricted within very harrow limits. It is not the privilege of any member of the court. It belongs exclusively to an aggrieved party; to those whose character or interests are immediately concerned in the decision. And to all such it is a right guaranteed by the constitution and by the undeviating practice of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discussions in Church Polity</cite>, … (NY: Scribner’s Sons, 1878), pt. 2, ch. 16, ‘Discipline’, section 3, ‘Appeals &amp; Complaints’ | a. ‘Appeals in Cases Not Judicial’ 470</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

Presbyterian Church government… Nothing short of a plain and intelligible denial of the right to complain of oppressive and unconstitutional acts; or to appeal from unrighteous decisions, though they may not be judicial, will induce Presbyterians to forego a privilege which they have enjoyed from the very foundation of their Church… If it is to be applied to appeals, we see not how any one can fail to apply it to complaints and references, and if so applied, all must acknowledge that our system of government would be completely overturned. The right of appeal is already restricted within very harrow limits. It is not the privilege of any member of the court. It belongs exclusively to an aggrieved party; to those whose character or interests are immediately concerned in the decision. And to all such it is a right guaranteed by the constitution and by the undeviating practice of the Church.”

— Charles Hodge, Discussions in Church Polity, … (NY: Scribner’s Sons, 1878), pt. 2, ch. 16, ‘Discipline’, section 3, ‘Appeals &amp; Complaints’ | a. ‘Appeals in Cases Not Judicial’ 470">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+is%2C+the+General+Assembly+decided+that+appeals+cannot+lie+except+in+judicial+cases.+It+is+really+a+matter+of+importance.+It+would+be+a+hard+case+if+a+party%2C+suffering+under+a+grievous+wrong%2C+should+be+turned+away+from+the+bar+of+our+highest+judicatory%2C+merely+on+the+ground+that+he+had+mistaken+the+nature+of+his+remedy%E2%80%A6+We+have+had+a+superior+judicatory+in+our+Church+for+more+than+a+hundred+and+twenty+years.+During+about+seventy+years+of+this+period%2C+our+discipline+was+conducted+according+to+the+Westminster+Directory.+In+1789+our+present+constitution+went+into+operation%3B+which+was+submitted+to+an+extensive+revision+and+alteration%2C+as+to+matters+of+detail%2C+in+1821.+Under+these+several+systems%2C+appeals+and+complaints+were+allowed%2C+without+hindrance+or+contradiction%2C+from+any+kind+of+decision+in+an+inferior+judicatory+by+a+person+who+felt+himself+aggrieved%2C+until+1834.+Then%2C+for+the+first+time+in+our+history%2C+as+far+as+we+know%2C+the+idea+was+started+that+appeals+and+complaints+could+be+made+only+in+cases+strictly+judicial.+%E2%80%A6That+this+novel+doctrine+was+not+at+that+time+the+doctrine+of+the+synod%2C+which+the+Rev.+gentleman+defended%2C+is+plain%E2%80%A6+Though+the+synod+was+thus+free+from+this+new+doctrine+in+May+1834%2C+it+grew+in+such+sudden+favour%2C+that+when+that+body+met+the+following+autumn%2C+they+decided+not+merely+that+appeals+and+com-+plaints+could+not+lie+except+in+judicial+cases%2C+but+even+that+protests+were+in+the+same+predicament.+This+is+an+instructive+illustration+of+the+fact+that+the+wisest+and+best+men+sometimes+allow+themselves+to+be+run+away+with+by+a+plausible+idea%2C+though+contrary+to+all+their+own+previous+professions+and+practice.+This%2C+however%2C+was+a+mere+temporary+delusion.+The+members+of+that+synod+who+had+signed+or+allowed+protests+in+all+kinds+of+cases+before%2C+still+continued+to+sign+or+allow+them%2C+with+equal+freedom%2C+their+own+decision+to+the+contrary+notwithstanding%E2%80%A6+We+found+its+very+authors+and+advocates+disregarding+it+the+very+next+year%3B+acting+as+though+no+such+doctrine+had+ever+been+broached.+If+they+practically+abandoned+it+as+untenable%E2%80%A6+The+Synod+of+Philadelphia+extended+the+%5Bnew%5D+doctrine+to+appeals%2C+complaints+and+protests.+Thus+putting+minorities+completely+under+the+feet+of+majorities%2C+not+allowing+them+even+the+right+of+recording+their+dissent+with+the+reasons+for+it%E2%80%A6+%E2%80%A6There+is+a+good+deal+of+confusion+and+error+often+occasioned+by+the+mere+designation+of+our+ecclesiastical+bodies+as+courts+or+judicatories.+They+are+so+called+Avhen+not+sitting+in+judicial+capacity%E2%80%A6+Our+courts+are+bodies+sui+generis+%5Bof+their+kind%5D%3B+they+include+within+themselves+legislative%2C+executive+and+judicial+powers.+Yet+this+division+is+in+a+great+measure+arbitrary.+These+several+powers+are+but+different+modes+of+exercising+the+general+governing+authority+in+the+Church%3B+and+it+is+often+very+difficult+to+say+whether+a+particular+act+should+be+placed+under+the+one+or+the+other+of+these+heads%E2%80%A6+An+appeal+supposes+an+aggrieved+party%2C+but+he+may+appeal+from+any+kind+of+decision+which+directly+affects+himself.+A+complaint+supposes+some+kind+of+impropriety+in+the+act+complained+of%2C+but+it+may+be+entered+against+any+kind+of+act+alleged+to+be+improper.+So+that+any+kind+of+decision+may+be+regularly+brought+up+in+each+of+the+several+ways+specified+above.+That+this+is+the+true+meaning+of+this+article%2C+might+be+inferred+with+certainty+from+the+fact+that+it+has+always+been+so+understood+and+acted+upon%3B+and+that+it+is+almost+a+literal+transcript+of+the+Scottish+rule+on+the+same+subject%2C+which+has+always+been+interpreted+and+applied+in+the+same+way%E2%80%A6+In+the+first+place%2C+these+technical+terms+are+to+be+understood%2C+not+according+to+their+use+in+civil+courts%2C+but+according+to+our+own+ecclesiastical+usage.+Our+bodies+are+called+courts%3B+their+decisions+are+called+judgments%3B+the+matters+brought+before+them+are+called+cases.+Are+we+to+infer+from+this%2C+as+has+been+done+by+the+New+School+lawyers+and+brethren%2C+that+they+have+nothing+but+judicial+powers%E2%80%A6+In+the+second+place%2C+our+rules+were+drawn+up+with+special+reference+to+that+class+of+cases+which+is+of+most+frequent+occurrence%2C+and+hence+the+language+employed+is+adapted+to+such+cases%E2%80%A6+In+the+third+place+it+is+a+fallacy+running+through+this+argument+that+there+can+be+no+judicial+investigation+of+anything+but+a+judicial+act%E2%80%A6+There+is%2C+therefore%2C+no+foundation+in+our+constitution+for+this+new+doctrine.+Every+letter+of+the+rules+may+be%2C+and+has+been+fully+complied+with+in+a+multitude+of+cases%2C+where+the+decision+appealed+from+was+merely+an+executive+act%E2%80%A6+We+shall+proceed+to+show+that+this+new+doctrine%2C+especially+if+applied+to+complaints+as+well+as+appeals+%28and+we+have+seen+that+the+two+cannot+in+this+matter+be+consistently+separated%29%2C+is+subversive+of+the+fundamental+principles+of+Presbyterianism%2C+and+inconsistent+with+the+uniform+practice+of+the+Church%E2%80%A6+This+doctrine+is+at+variance+also+with+the+undeviating+practice+of+our+own+and+all+other+Presbyterian+Churches.+This+of+itself+is+a+fatal+objection+to+any+new+doctrine.+The+fact+that+we+have+been+going+on+in+accordance+with+the+usage+of+all+other+Presbyterian+bodies%2C+for+a+hundred+and+twenty+years%2C+interpreting+and+administering+our+constitution+in+a+certain+way%2C+is+answer+enough%E2%80%A6+The+words+of+our+book+have+the+sense+which+they+were+intended+to+bear%3B+and+they+were+intended+to+bear+the+sense+in+which+its+authors+and+administrators+have+ever+understood+and+applied+them%E2%80%A6+That+the+practice+of+our+Church+has+been+uniform+on+this+subject%2C+is+admitted%E2%80%A6+There+is+not+then%2C+upon+our+Minutes%2C+a+single+case+of+an+appeal+or+complaint%2C+which+was+rejected+on+the+ground+that+it+did+not+refer+to+a+judicial+sentence.+We+have+been+going+on+for+a+hundred+and+twenty+years+entertaining+such+appeals+without+any+one+dreaming+of+their+being+irregular%E2%80%A6+If+after+all+this+a+new+and+opposite+doctrine+is+to+be+introduced%2C+there+never+can+be+any+stability+or+security+with+regard+to+any+principle+of+Presbyterian+Church+government%E2%80%A6+Nothing+short+of+a+plain+and+intelligible+denial+of+the+right+to+complain+of+oppressive+and+unconstitutional+acts%3B+or+to+appeal+from+unrighteous+decisions%2C+though+they+may+not+be+judicial%2C+will+induce+Presbyterians+to+forego+a+privilege+which+they+have+enjoyed+from+the+very+foundation+of+their+Church%E2%80%A6+If+it+is+to+be+applied+to+appeals%2C+we+see+not+how+any+one+can+fail+to+apply+it+to+complaints+and+references%2C+and+if+so+applied%2C+all+must+acknowledge+that+our+system+of+government+would+be+completely+overturned.+The+right+of+appeal+is+already+restricted+within+very+harrow+limits.+It+is+not+the+privilege+of+any+member+of+the+court.+It+belongs+exclusively+to+an+aggrieved+party%3B+to+those+whose+character+or+interests+are+immediately+concerned+in+the+decision.+And+to+all+such+it+is+a+right+guaranteed+by+the+constitution+and+by+the+undeviating+practice+of+the+Church.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Discussions+in+Church+Polity%2C+%E2%80%A6+%28NY%3A+Scribner%E2%80%99s+Sons%2C+1878%29%2C+pt.+2%2C+ch.+16%2C+%E2%80%98Discipline%E2%80%99%2C+section+3%2C+%E2%80%98Appeals+%26+Complaints%E2%80%99+%7C+a.+%E2%80%98Appeals+in+Cases+Not+Judicial%E2%80%99+470&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F104eb0485a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/104eb0485a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-jurisprudence/#:~:text=That%20is%2C%20the%20General%20Assembly%20decided,the%20undeviating%20practice%20of%20the%20Church&amp;text=That%20is%2C%20the%20General%20Assembly%20decided%20that%20appeals&amp;text=and%20by%20the%20undeviating%20practice%20of%20the%20Church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

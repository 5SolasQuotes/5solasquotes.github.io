<main class="wrap"><figure class="quote" id="q-832527ca0f" data-kw="">
<blockquote><p>It was unlawful for God’s people under the Old Testament to spend any part of the Sabbath in carnal pleasures and recreations, it is unlawful for us under the New… That such recreations were prohibited to the Jews, I believe none will deny… [by] the Fourth Command and Isa. 58:13 forecited… we are bound to abstain from those recreations upon the Sabbath, as well as the Jews… but the Jews were bound to abstain from carnal recreations on the Sabbath, upon moral grounds, which concern us as well as them… the reasons of the Fourth Command are moral… every one of them levels as much against worldly recreations on the Sabbath Day as against worldly employments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-willison.html">John Willison</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise Concerning the Sanctification of the Lord’s Day</cite>, … 3rd ed. (1716; Edinburgh: Lumisden, 1745), pp. 75-76</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-db215012fe" data-kw="Lord&#x27;s day apostolic institution">
<blockquote><p>Others ascend to a divine ordination, so that either Christ himself may be said to have immediately and expressly instituted that day, which Junius holds and some others with him; or mediately only inasmuch as the apostles inspired of God sanctioned it in the Christian church by precept, example and their own practice. This is the more common opinion of the orthodox and to this we adhere.</p></blockquote>

<blockquote><p>XXI. The fourth commandment is moral and perpetual as to the substance of the thing commanded (to wit, that some solemn external worship is due to God and that a certain time should be devoted to it; not as to the particular determination of the seventh day [a matter of positive right], which moreover as ceremonial could be changed…).</p></blockquote>

</figure><figure class="quote" id="q-6fc8db84bc" data-kw="">
<blockquote><p>XXV. Here, nevertheless, are excepted [to the prohibition of servile work]: … (3) the works of common honesty, because as always, so on this day above others, we ought to carry ourselves and to act honestly and decorously; (4) works of necessity, which are neither feigned nor designedly produced, but imposed upon us by providence (Lk. 14:5); not only absolute and simple, that may be called necessary only (which we can in no way be in want of), but modified and relative so that those things may be reckoned necessary not only which are required absolutely for the existence and support of life, but also those which conduce to our living better. Hence some great advantage and emolument accrues to us or our neighbor if they are done or some great disadvantage and loss if they are omitted. ‘The sabbath’ (as Christ testifies in Mk. 2:27) ‘was made for man and not man for the sabbath.’ XXVI. Therefore, we do not think that in this cessation believers are bound to Judaical precision which some (more scrupulous than is just) maintain was not revoked, so that it is lawful neither to kindle a fire, nor to cook food, nor to take up arms against an enemy, nor to prosecute a journey begun by land or sea, nor to refresh themselves with innocent relaxation of the mind and body, provided they are done out of the hours for divine worship, nor to have any diversion, however slight, to any things belonging to the advantages or emoluments of this life. For although this opinion bears on its face a beautiful appearance of piety (and undoubtedly with good intention is proposed by pious men to procure the better sanctification of this day, usually so basely profaned), still it labors under grievous disadvantages; nor can it be retained without in this way bringing back into the church and imposing anew upon the shoulders of Christians an unbearable yoke (abastakton), repugnant to Christian liberty and the gentleness of Christ and opposed to the sweetness of the covenant of grace by agitating and tormenting the consciences of men through infinite scruples and inextricable difficulties (nearly driving to desperation).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 2, 11th Topic, Q. 14, ‘The Lord’s Day…, p. 98</span></figcaption>

</figure><figure class="quote" id="q-7dfb04dafa" data-kw="">
<blockquote><p>Yet 2. we assert, That by this rest all sort of actions are not condemned, but only such as are inconsistent with the end and scope of this command; as by other Scriptures, and the practice of Christ and the Saints is clear: we conceive therefore these to be permitted: …

5. Works of necessity, such as… much more preparing honestly sober allowance for the sustaining of the body, as the disciples plucked the ears of corn, Mt. 12, and the Jews, Ex. 16:23, dressed the manna on the Sabbath, though they were not to gather it, yet on the sixth day to bake and seethe a part, and to keep a part till the morrow, but not till the day following, and therefore they behoved to dress it also; yea, Jesus Christ went Himself to a feast on the Sabbath, Lk. 14 (that He might take that opportunity by his spiritual discourse to edify the company as He did notably) which He would not have done had it been unlawful to dress any meat on the Sabbath, yet his carriage was such at that feast most remarkably, that it would be followed as a pattern by such as may be invited by others to eat with them, and shall be disposed to go on the Sabbath: And if this were the design of the inviters and invited, men’s eating together on that day would not readily prejudice the sanctification of it, as very often it does…

6. Works of comliness, tending to honest or decent walking, as putting on of clothes honestly, making the house clean from any uncleanness that may fall in it throughout the Sabbath, etc. By all which believers have allowance, 1. for piety, 2. for charity, 3. for what is needful for their beasts, 4. what is needful and convenient, or comely for themselves; and more is not necessary: In these the Lord hath not streightned them, neither has He pinched and pinned them up to absolute necessity, but has left them to walk by Christian prudence (yet so as they may not exceed) for the disciples possibly might have endured that hunger, and not plucked the ears of corn, or beasts may live a day without water, and not be much the worse, or some sort of victuals may be provided to be set beside men on the Sabbath needing no dressing or preparing; yea, a man may live on little or nothing for one day: but the Lord has thought good not to straighten them, so as to make his day and worship a weariness and burden unto them, seeing He has made the Sabbath for man, to be refreshing to him, and not man for the Sabbath; nor will He have their consciences to be festered with inextricable scruples: He leaves it to men on other days, how much to eat and drink by a Christian prudence (yet allows them not to exceed even on these) so here there is some latitude left to conscientious reason to walk by; for some may do something at one time, and not at another, yea, one man may take more pains in upholding his body than is called for from another who is stronger, so that it’s impossible to set particular rules which will agree to all, but men would look, 1 to their end, 2. to their need, 3. to what may conveniently attain the end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition of the Ten Commandments</cite>, … (d. 1658; London: 1675), 4th Commandment, Sanctification of the Sabbath, p. 277, 279-80</span></figcaption>

5. Works of necessity, such as… much more preparing honestly sober allowance for the sustaining of the body, as the disciples plucked the ears of corn, Mt. 12, and the Jews, Ex. 16:23, dressed the manna on the Sabbath, though they were not to gather it, yet on the sixth day to bake and seethe a part, and to keep a part till the morrow, but not till the day following, and therefore they behoved to dress it also; yea, Jesus Christ went Himself to a feast on the Sabbath, Lk. 14 (that He might take that opportunity by his spiritual discourse to edify the company as He did notably) which He would not have done had it been unlawful to dress any meat on the Sabbath, yet his carriage was such at that feast most remarkably, that it would be followed as a pattern by such as may be invited by others to eat with them, and shall be disposed to go on the Sabbath: And if this were the design of the inviters and invited, men’s eating together on that day would not readily prejudice the sanctification of it, as very often it does…

6. Works of comliness, tending to honest or decent walking, as putting on of clothes honestly, making the house clean from any uncleanness that may fall in it throughout the Sabbath, etc. By all which believers have allowance, 1. for piety, 2. for charity, 3. for what is needful for their beasts, 4. what is needful and convenient, or comely for themselves; and more is not necessary: In these the Lord hath not streightned them, neither has He pinched and pinned them up to absolute necessity, but has left them to walk by Christian prudence (yet so as they may not exceed) for the disciples possibly might have endured that hunger, and not plucked the ears of corn, or beasts may live a day without water, and not be much the worse, or some sort of victuals may be provided to be set beside men on the Sabbath needing no dressing or preparing; yea, a man may live on little or nothing for one day: but the Lord has thought good not to straighten them, so as to make his day and worship a weariness and burden unto them, seeing He has made the Sabbath for man, to be refreshing to him, and not man for the Sabbath; nor will He have their consciences to be festered with inextricable scruples: He leaves it to men on other days, how much to eat and drink by a Christian prudence (yet allows them not to exceed even on these) so here there is some latitude left to conscientious reason to walk by; for some may do something at one time, and not at another, yea, one man may take more pains in upholding his body than is called for from another who is stronger, so that it’s impossible to set particular rules which will agree to all, but men would look, 1 to their end, 2. to their need, 3. to what may conveniently attain the end.”

— James Durham, A Practical Exposition of the Ten Commandments, … (d. 1658; London: 1675), 4th Commandment, Sanctification of the Sabbath, p. 277, 279-80">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYet+2.+we+assert%2C+That+by+this+rest+all+sort+of+actions+are+not+condemned%2C+but+only+such+as+are+inconsistent+with+the+end+and+scope+of+this+command%3B+as+by+other+Scriptures%2C+and+the+practice+of+Christ+and+the+Saints+is+clear%3A+we+conceive+therefore+these+to+be+permitted%3A+%E2%80%A6+5.+Works+of+necessity%2C+such+as%E2%80%A6+much+more+preparing+honestly+sober+allowance+for+the+sustaining+of+the+body%2C+as+the+disciples+plucked+the+ears+of+corn%2C+Mt.+12%2C+and+the+Jews%2C+Ex.+16%3A23%2C+dressed+the+manna+on+the+Sabbath%2C+though+they+were+not+to+gather+it%2C+yet+on+the+sixth+day+to+bake+and+seethe+a+part%2C+and+to+keep+a+part+till+the+morrow%2C+but+not+till+the+day+following%2C+and+therefore+they+behoved+to+dress+it+also%3B+yea%2C+Jesus+Christ+went+Himself+to+a+feast+on+the+Sabbath%2C+Lk.+14+%28that+He+might+take+that+opportunity+by+his+spiritual+discourse+to+edify+the+company+as+He+did+notably%29+which+He+would+not+have+done+had+it+been+unlawful+to+dress+any+meat+on+the+Sabbath%2C+yet+his+carriage+was+such+at+that+feast+most+remarkably%2C+that+it+would+be+followed+as+a+pattern+by+such+as+may+be+invited+by+others+to+eat+with+them%2C+and+shall+be+disposed+to+go+on+the+Sabbath%3A+And+if+this+were+the+design+of+the+inviters+and+invited%2C+men%E2%80%99s+eating+together+on+that+day+would+not+readily+prejudice+the+sanctification+of+it%2C+as+very+often+it+does%E2%80%A6+6.+Works+of+comliness%2C+tending+to+honest+or+decent+walking%2C+as+putting+on+of+clothes+honestly%2C+making+the+house+clean+from+any+uncleanness+that+may+fall+in+it+throughout+the+Sabbath%2C+etc.+By+all+which+believers+have+allowance%2C+1.+for+piety%2C+2.+for+charity%2C+3.+for+what+is+needful+for+their+beasts%2C+4.+what+is+needful+and+convenient%2C+or+comely+for+themselves%3B+and+more+is+not+necessary%3A+In+these+the+Lord+hath+not+streightned+them%2C+neither+has+He+pinched+and+pinned+them+up+to+absolute+necessity%2C+but+has+left+them+to+walk+by+Christian+prudence+%28yet+so+as+they+may+not+exceed%29+for+the+disciples+possibly+might+have+endured+that+hunger%2C+and+not+plucked+the+ears+of+corn%2C+or+beasts+may+live+a+day+without+water%2C+and+not+be+much+the+worse%2C+or+some+sort+of+victuals+may+be+provided+to+be+set+beside+men+on+the+Sabbath+needing+no+dressing+or+preparing%3B+yea%2C+a+man+may+live+on+little+or+nothing+for+one+day%3A+but+the+Lord+has+thought+good+not+to+straighten+them%2C+so+as+to+make+his+day+and+worship+a+weariness+and+burden+unto+them%2C+seeing+He+has+made+the+Sabbath+for+man%2C+to+be+refreshing+to+him%2C+and+not+man+for+the+Sabbath%3B+nor+will+He+have+their+consciences+to+be+festered+with+inextricable+scruples%3A+He+leaves+it+to+men+on+other+days%2C+how+much+to+eat+and+drink+by+a+Christian+prudence+%28yet+allows+them+not+to+exceed+even+on+these%29+so+here+there+is+some+latitude+left+to+conscientious+reason+to+walk+by%3B+for+some+may+do+something+at+one+time%2C+and+not+at+another%2C+yea%2C+one+man+may+take+more+pains+in+upholding+his+body+than+is+called+for+from+another+who+is+stronger%2C+so+that+it%E2%80%99s+impossible+to+set+particular+rules+which+will+agree+to+all%2C+but+men+would+look%2C+1+to+their+end%2C+2.+to+their+need%2C+3.+to+what+may+conveniently+attain+the+end.%E2%80%9D%0A%0A%E2%80%94+James+Durham%2C+A+Practical+Exposition+of+the+Ten+Commandments%2C+%E2%80%A6+%28d.+1658%3B+London%3A+1675%29%2C+4th+Commandment%2C+Sanctification+of+the+Sabbath%2C+p.+277%2C+279-80&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7dfb04dafa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7dfb04dafa.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-works-of-necessity-mercy-on-the-sabbath/#:~:text=Yet%202.%20we%20assert%2C%20That%20by,what%20may%20con

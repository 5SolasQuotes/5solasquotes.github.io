<main class="wrap"><figure class="quote" id="q-9f7b734e4d" data-kw="">
<blockquote><p>But the truth is this, the Lord must let in an influence of some special motion and operation and leave some impression of spiritual power upon the will to enable it to act, not only to concur with the act thereof. God gives a man ability whereby he may will, does not 〈◊〉 with him by assistance and providence when He wills as one in whom we live and move. Of the first of these it’s true which many of the ancients speak, God works without us, many things in us, i.e. unto which we being in no causal ability at all, God gives us ability to do that which is pleasing and spiritual, to the obtaining whereof, we had no causal ability of our own; when the Lord Christ raised Lazarus now dead and smelling in the grave, He did not concur with the action and motion of his soul in rising out of the grave, but without any causal concurrence or help of Lazarus, He put a soul into his body, whereby He was enabled to stir and move. So it is with a soul dead in sins and tresspasses, when the mind and will have no ability for any spiritual act, not able to take off that deadness and indisposition that is there, the Lord without the will, without any causal concurrence of it, lets in ability into it for the work, and concurs with it in the work. So Paul expresses this manner of God’s work, 2 Cor. 4:6, He causes light to shine out of darkness; He gives light and being out of darkness, without the help of light, and then concurs with the light in the shining of it; God lets in an influence to the will, not only lends a concurrence to the work.</p></blockquote>

<blockquote><p>This will I briefly show, when that I have spoken of justification, the which precedes regeneration, from whom we may discern it, but not divide it, no more than heat from the fire. Justification in Scripture is taken for the forgiveness of our sins, and consists in the forgiveness of our sins. This is only God’s work, and we nothing else but patients and not agents. After this work, in respect of us and our sense, comes regeneration, which altogether is God’s work also: for, as to our first birth we bring nothing (bring, quoth I? yes, we bring to let [prevent] it many things, but to further it nothing at all)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bradford.html">John Bradford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Writings of John Bradford</cite>, … Parker Society (d. 1555; Cambridge Univ. Press, 1848-1853), “Election &amp; Free-Will”, vol. 1, p. 217 Bradford (1510–1555).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-220fd0f8ce" data-kw="">
<blockquote><p>But the persons to whom we refer seem to think that nothing is done towards the salvation of men, but at the moment of their conversion, and that every good effect must be at once manifest. Perhaps some one may infer that we believe in a gradual regeneration, and that special grace differs from common, only in degree; but such an inference would be utterly false, for there can be no medium between life and death; but we do profess to believe and maintain, that there is a gradual preparation, by common grace, for regeneration, which may be going on from childhood to mature age; and we believe that, as no mortal can tell the precise moment, when the soul is vivified, and as the principle of spiritual life in its commencement is often very feeble, so it is an undoubted truth, that the developement of the new life in the soul may be, and often is, very slow; and not unfrequently that which is called conversion is nothing else but a more sensible and vigorous exercise of a principle which has long existed. Just as the seed under ground may have life, and may be struggling to come forth to open day; but it may meet with various obstructions and unfavourable circumstances which retard its growth. At length, however, it makes its way through the earth, and expands its leaves to the light and the air, and begins to drink in from every source that nutriment which it needs. No one supposes, however, that the moment of its appearing above ground is the commencement of its life; but this mistake is often made in the analogous case of the regeneration of the soul. The first clear and lively exercise of faith and repentance is made the date of the origin of spiritual life, whereas it existed in a feeble state, and put forth obscure acts long before.</p></blockquote>

<blockquote><p>To this faith we ascribe justification and regeneration, inasmuch as it frees from terrors, and brings forth in the heart not only peace and joy, but also a new life.</p></blockquote>

</figure><figure class="quote" id="q-d6537c6b74" data-kw="">
<blockquote><p>§XIV… in the first moment of conversion, while the intellect is being illuminated, the will is being prepared, disposed, and changed, it behaves merely passively, with Scripture as witness. … Man, however, being illuminated, aided, and renewed by this grace of God through the Word, and from being unwilling made willing, under grace, with a free but attendant will, without injury to his free will, freely and actively complies with operating grace, and with resistance having been taken away, willingly cooperates and concurs, according to the vow of the Church, Cant. 1:3: “Draw me, we will run after thee.” To which can be referred that passage in Jer. 20:7: “Thou hast seduced me, O Lord, and I am seduced: thou art stronger than I, and thou hast prevailed.” For grace does not kill free will, but remakes it; does not abolish it, but cherishes it; does not take it away, but transfers it, according to Prosper and Bernard.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), pp. 25-26 Latin</span></figcaption>

<div class="actions"><button class="copy" data-copy="“§XIV… in the first moment of conversion, while the intellect is being illuminated, the will is being prepared, disposed, and changed, it behaves merely passively, with Scripture as witness. … Man, however, being illuminated, aided, and renewed by this grace of God through the Word, and from being unwilling made willing, under grace, with a free but attendant will, without injury to his free will, freely and actively complies with operating grace, and with resistance having been taken away, willingly cooperates and concurs, according to the vow of the Church, Cant. 1:3: “Draw me, we will run after thee.” To which can be referred that passage in Jer. 20:7: “Thou hast seduced me, O Lord, and I am seduced: thou art stronger than I, and thou hast prevailed.” For grace does not kill free will, but remakes it; does not abolish it, but cherishes it; does not take it away, but transfers it, according to Prosper and Bernard.”

<main class="wrap"><figure class="quote" id="q-b03d8f1c66" data-kw="">
<blockquote><p>The demand was of the same man, who formerly did lawfully preach in a public assembly, if he should [now] obtain a license from the Lord bishop of the diocesse, without any unlawful condition for to continue in that his course [of public preaching], whether that leave or licence given does pollute the actions, seeing a man may ask leave of the great Turk to preach the gospel within his dominions? His [John Robinson’s] answer is that the very obtaining and receiving of such a license is unlawful, because it is a real acknowledgement that such a bishop has a lawful power to grant it. Which [in my judgment] is neither so nor so, for: 1. The asking and receiving of leave or license (which are both one) does not always imply an acknowledgement of his lawful authority from whom it is sought. If any man of violence shall usurp a power to himself, of permitting or hindering the lawful and good offices that pertain unto honest men, so that without his licence a man could not buy or sell, or teach any science or trade of life; if an honest man whom these duties concern, should in that case take a licence from that usurper (though he were no better then a strong theif) no reasonable man will say that in so doing he did acknowledge such usurped power lawful. The rulers of Jewish synagoges had no lawful power over the apostles of Christ in any part of their ministery, neither would Paul ever acknowledge so much: yet he and Barnabas accepted of such license or leave from them sometime as they did usually grant unto those that acknowledged themselves lawfully subject to their authority. See an example, Acts 13:15. Mr. Robinson himself has granted in the first demand that a man may preach by leave in a parochial assembly: which leave must be given by the parochial minister and church-wardens, whose authority he holds one with the bishops. If therefore leave or license (whether in word or writing, that is all one) may be lawfully taken from them, without acknowledging any authority lawful which is unlawful, why not from the bishop? 2. There is some authority in the bishops derived from the king which may be acknowledged lawful. Such is this of giving license, liberty and civil authority for men to do good. The civil magistrate may do it himself, or appoint others to do it, 2 Chron. 17:7. The abuse of this authority does not make it unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr</cite>, [John] Robinson. Or a confirmation of the former in an answer to his manumission (Amsterdam, 1615), pp. 6-7</span></figcaption>

</figure><figure class="quote" id="q-b5bdf9af74" data-kw="">
<blockquote><p>The Church of Rome did not meet in one place for celebrating the worship of God, there were more holy assemblies there in diverse places; there was a Church in the house of Aquila and Priscilla, Rom. 16:5. Paul when he was at Rome had holy Church assemblies in his own house, Acts 28:23, 30, 31, which yet was not that whole (collectively taken) and famous Church of the believing Romans, whose faith was famous through the whole world, Rom. 1:8. Other examples we meet with in the Scripture of Churches duly constituted according to God’s appointment, which met not in one place for exercising the worship of God, but did in diverse places under a common presbytery of diverse pastors perform holy duties. Hence also in our Belgic Churches in some greater towns, though there be more believers than can celebrate the holy worship of God and exercise other ordinances of Christ together in one place; yet they are not divided into several Churches, but do together make one visible Church, under the common presbytery and government of diverse pastors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England concerning the Government of the Church of God</cite>, (London: 1645), ch. 3, ‘Of an Institute Visible Church’, pp. 27-28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>Thirdly, the Scripture intimates this difference between ministry and magistracy, that the work of the ministry and the administrations thereof are performed in the name of Jesus Christ, as Mediator and King of the Church: the work of the magistracy not so… Now let our opposites show (if they can) where they find in Scripture that the Christian magistrate is to rule in the name of Christ, to judge in the name of Christ, to make laws in the name of Christ, to make war or peace in the name of Christ, to punish evil-doers with the temporal sword in the name of Christ. Of the ministry I did show that in the name of the Lord Jesus Christ we do assemble ourselves together, Mt. 18:20, in his name do we preach, Lk. 24:47; Acts 4:17-18; 5:28,44; 9:27, in his name do we baptize, Acts 2:38, 8:16; 19:5, in his name do we excommunicate, 1 Cor. 5:5… … A minister of Christ does both preach and baptize in the name of Christ, as Mediator, that is, vice Christi [in the place of Christ], in Christ’s stead, and having authority for that effect from Christ, as Mediator; for Christ, as Mediator, gave us our comission to preach and baptize… So that to preach and baptize epi to onomati Iesou Christou (which we find both of preaching, Lk. 24:47, and of baptizing, Acts 2:38) comprehends a formal commission, power and auhority, given and derived from Christ. … The ministers of Christ do act in the name of Christ, that is, in the name, authority, room and place of Christ: We are ambassadors for Christ, and we preach in Christ’s stead, 2 Cor. 5:20. This… makes good my argument. Why did he [Mr. Hussey, an Erastian] not show us the like concerning magistracy? I suppose he would, if he could…</p></blockquote>

— George Gillespie, Aaron’s Rod Blossoming (1646), bk. 2, ch. 7, pp. 109-112">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThirdly%2C+the+Scripture+intimates+this+difference+between+ministry+and+magistracy%2C+that+the+work+of+the+ministry+and+the+administrations+thereof+are+performed+in+the+name+of+Jesus+Christ%2C+as+Mediator+and+King+of+the+Church%3A+the+work+of+the+magistracy+not+so%E2%80%A6+Now+let+our+opposites+show+%28if+they+can%29+where+they+find+in+Scripture+that+the+Christian+magistrate+is+to+rule+in+the+name+of+Christ%2C+to+judge+in+the+name+of+Christ%2C+to+make+laws+in+the+name+of+Christ%2C+to+make+war+or+peace+in+the+name+of+Christ%2C+to+punish+evil-doers+with+the+temporal+sword+in+the+name+of+Christ.+Of+the+ministry+I+did+show+that+in+the+name+of+the+Lord+Jesus+Christ+we+do+assemble+ourselves+together%2C+Mt.+18%3A20%2C+in+his+name+do+we+preach%2C+Lk.+24%3A47%3B+Acts+4%3A17-18%3B+5%3A28%2C44%3B+9%3A27%2C+in+his+name+do+we+baptize%2C+Acts+2%3A38%2C+8%3A16%3B+19%3A5%2C+in+his+name+do+we+excommunicate%2C+1+Cor.+5%3A5%E2%80%A6+%E2%80%A6+A+minister+of+Christ+does+both+preach+and+baptize+in+the+name+of+Christ%2C+as+Mediator%2C+that+is%2C+vice+Christi+%5Bin+the+place+of+Christ%5D%2C+in+Christ%E2%80%99s+stead%2C+and+having+authority+for+that+effect+from+Christ%2C+as+Mediator%3B+for+Christ%2C+as+Mediator%2C+gave+us+our+comission+to+preach+and+baptize%E2%80%A6+So+that+to+preach+and+baptize+epi+to+onomati+Iesou+Christou+%28which+we+find+both+of+preaching%2C+Lk.+24%3A47%2C+and+of+baptizing%2C+Acts+2%3A38%29+comprehends+a+formal+commission%2C+power+and+auhority%2C+given+and+derived+from+Christ.+%E2%80%A6+The+ministers+of+Christ+do+act+in+the+name+of+Christ%2C+that+is%2C+in+the+name%2C+authority%2C+room+and+place+of+Christ%3A+We+are+ambassadors+for+Christ%2C+and+we+preach+in+Christ%E2%80%99s+stead%2C+2+Cor.+5%3A20.+This%E2%80%A6+makes+good+my+argument.+Why+did+he+%5BMr.+Hussey%2C+an+Erastian%5D+not+show+us+the+like+concerning+magistracy%3F+I+suppose+he+would%2C+if+he+could%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+Aaron%E2%80%99s+Rod+Blossoming+%281646%29%2C+bk.+2%2C+ch.+7%2C+pp.+109-112&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd9cdcfb5f4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d9cdcfb5f4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/presbyterianism#:~:text=Thirdly%2C%20the%20Scripture%20intimates%20this%20difference,suppose%20he%20would%2C%20if%20he%20could&amp;text=Thirdly%2C%20the%20Scripture%20intimates%20this%20difference%20between%20ministry&amp;text=magistracy%3F%20I%20suppose%20he%20would%2C%20if%20he%20could" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-6a8daa9d23" data-kw="">
<blockquote><p>We knew that these psalms, and hymns and spiritual songs, though in other languages (and consequently so in other poetical measures) were inspired by the Holy-Ghost, to holy men of old for the edification and comfort of the Church and people of God in all ensuing ages to the end of the world. And for these holy ends we have with special care &amp; diligence translated them into such meters as are most usual and suitable for such holy poems, in our own language, having a special eye to the gravity of the phrase of sacred writ and sweetness of the verse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-dunster.html">Henry Dunster</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms Hymns and Spiritual Songs of the Old and New Testament, faithfully translated into English metre</cite>, ([Cambridge, Mass.], 1651), ‘To the Godly Reader’, no page number. This 3rd edition of the Bay Psalm Book psalter has the 150 psalms and other inspired Bible songs in it (the original Bay Psalm Book did not have the other Bible-Songs). On the title page is 2 Tim. 3:16-17; Col. 3:16; Eph. 5:18-19; James 5:13. This same psalter and preface were reprinted in Boston in 1698 with Cotton Mather’s name on it.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9465ee833f" data-kw="">
<blockquote><p>Have I caused my family to go with me to the Church? And did I with them come in due time, and being there, did stay the whole time of prayer, reading, and preaching of the Word, singing of Psalms, receiving and administering the Sacraments, even that of Baptism, when others are baptized, and did attend diligently, and join with the minister and the rest of the congregation in all those holy exercises?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-scudder.html">Henry Scudder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scudder on the Church’s Public Worship</cite>, pp. 101-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“Have I caused my family to go with me to the Church? And did I with them come in due time, and being there, did stay the whole time of prayer, reading, and preaching of the Word, singing of Psalms, receiving and administering the Sacraments, even that of Baptism, when others are baptized, and did attend diligently, and join with the minister and the rest of the congregation in all those holy exercises?”

</figure><figure class="quote" id="q-1a602939db" data-kw="">
<blockquote><p>Teaching and admonishing one another. This is one way wherein we are to be the means of each others’ instruction and one means whereby the Word of God, particularly that part of the Word that consists in psalms &amp; hymns and spiritual songs is to dwell in us richly in all wisdom. Singing of Psalms is a Great help to a spiritual understanding of the Psalms. The mind of the Holy Ghost in the Psalms is often times conveyed while the Psalm is a singing, and as it is a means of a spiritual understanding of that excellent part of the Word of God… What should be sung, viz. Psalms. What seems to be here intended, at least chiefly, is the Psalms and spiritual songs that are contained in the Word of God, for the apostle is speaking of the Word of God. Let the Word of God, says he, dwell in you richly in all wisdom, and then he mentions singing as a means, but then it must be singing some part of the Word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon Notes on Col. 3:16 in Sermons, Series II</cite>, 1736 (WJE Online Vol. 51)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-ada1c8474e" data-kw="">
<blockquote><p>The matter is here three ways to be considered: First, in the ground, foundation, or authority of the Psalms we use, viz. they must be the word of Christ, that is contained in the Scriptures. Secondly in the kinds of Psalms, there are many sort of Psalms in Scripture. The Psalms of Moses, David, Solomon, and other prophets: but all are here referred to three heads; they are either Psalms, specially so called, or hymns, or songs. Great ado there is among interpreters to find a difference in these: some would have Psalms to be the songs of men, and Hymns of angels: some think they differ, especially in the manner of music. Some are sung by voice, some played upon instruments; but the plausiblest opinion is not to distinguish them by the persons that use them, or by the kind of music, but by the matter, and so they say Psalms contain exhortation to manners or holy life. Hymns contain praises to God in the commemoration of his benefits. Songs contain doctrine of the chief good, or man’s eternal felicity. But I think there needs not any curious distinction: it may suffice us that there is variety of Psalms in Scripture and God allows us the use of every kind. Thirdly, the property of the Psalms, they are Spiritual, both because they are indited by the spirit, and because they make us more spiritual in the due use of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition Upon the Epistle to the Colossians</cite>, (London, 1615), commentary on ch. 3, v. 16, p. 101</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-a430a3db15" data-kw="">
<blockquote><p>There are three main ends of Psalms: … 3. That all men might learn by heart the principles of religion, the Psalms (as Rivet saith) being a compendium of Scripture, affording all points necessary for doctrine and duty. Col. 3:16, ‘Let the word of Christ dwell in you richly in all wisdom; teaching, and admonishing one another in Psalms, and Hymns, and Spiritual Songs,’ etc. From which words follow also these Conclusions: 1. That Scripture psalms (even David’s Psalms, called in Hebrew by the name of Psalms, and Hymns, and Spiritual Songs) and no other, should be used in the Church; for no other are the word of Christ, and consequently cannot have that certainty, purity, authority and sufficiency that the Scripture psalms have.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-barton.html">William Barton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of Many Errors and some gross absurdities</cite>, A View of Many Errors and some gross absurdities in the old translation of the Psalms in English metre; as also in some other translations lately published: showing how the Psalms ought to be translated, to be acceptable and edifying… (London: Printed by W.D., 1656), ‘To the Courteous Reader’, no page number</span></figcaption>

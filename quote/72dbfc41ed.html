<main class="wrap"><figure class="quote" id="q-72dbfc41ed" data-kw="">
<blockquote><p>…if we understand the words [of the opponent] as a prohibition of that worship and ordinance wherein there is any disorder committed: even so they are not generally true; for though we come with disorder and unpreparedness unto the hearing of the Word and public prayers, yet we are not for this disorder to omit public prayers, and hearing of the Word: for this were the way not to prevent, but to multiply our sin; and yet I do not deny, but that this disorder and unpreparednes is a great sin, for which we ought to be humbled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want [Lack] of Church-Government [is] No Warrant for a Total Omission of the Lord’s Supper… (London, 1650) Jeanes (1611–1662) was a presbyterian minister in London.</cite>, p. 72</span></figcaption>

</figure><figure class="quote" id="q-049f8a4265" data-kw="">
<blockquote><p>Verse 20. ‘And the Lord hearkened to Hezekiah, and healed the people.’ That is, He sanctified them by his Spirit in an extraordinary way; or, He did not punish them, but forgive them that their infirmity, and accepted them as if they had been purified. Verse 22. ‘And Hezekiah spake comfortably to all the Levites, that taught the good knowledge of the Lord.’ That is, he encouraged them in their work, and gave them hope of God’s mercy to the people as concerning those that had eaten the Passover and were not cleansed according to the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-jackson.html">Arthur Jackson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon the Remaining Historical Part of the Old Testament... (Cambridge, 1646) Jackson (1593?-1666) was an English clergyman of strong presbyterian and royalist views; he was ejected in the Great Ejection of 1662. | on 2 Chron. 30, vv. 20 &amp; 22</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-10f7895cb1" data-kw="">
<blockquote><p>3. The charge of ‘false worship’ unexplained, is mere deceit: 1. Worship is so far false as it is contrary to the rule. Every sermon, prayer or sacrament which we administer has faultiness and sin and is so far ‘false worship’. 2. But worship offered God on pretence that He instituted it when He did not, or that man has authority to command the like, is yet worse false worship. 3. And the worship of false gods or idols, is yet worse than that, and abhorred of God. 4. His [a separatist] making all faulty circumstances, such as he names, to be idolatry, because ‘false’, as he calls it, is yet more sinful and of mischievous importance [than the above three items].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes… (London: 1684), pt. 2</cite>, p. 14</span></figcaption>

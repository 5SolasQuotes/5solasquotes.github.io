<main class="wrap"><figure class="quote" id="q-8507c2e93c" data-kw="">
<blockquote><p>Vers. 25. Who was delivered for our offences, and was raised again for our Justification.

He lays the foundation of this certainty in a twofold judicial act of God towards Christ. The first act is, the delivering up of Christ our Surety to death for our offences. The other is, the raising of him for our Justification. In the first whereof, God testifies that the sins of the Redeemed were translated upon Christ by Covenant.

And in the other, that he is abundantly satisfied for their sins, and that the Redeemed in the person of their Surety are justified: From whence it follows, that to those who are Redeemed, (seeing they by Faith agree in this Covenant revealed in the Gospel) Faith is imputed to righteousness, or the Righteousness obtained by Christ is applied to them, that as in the person of their Surety they are justified, so also they may be justified in themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5c6831edca" data-kw="">
<blockquote><p>The first commandment teaches us that God wants us to sincerely trust Him. Yet we must fear Him about everything else. … So the good works required by the first commandment are holy and must be obeyed. But who can live up to them? Certainly no one can completely obey the first commandment. Everyone is a sinner except for Christ. Christ, however, comes to us and says, “I have shed my blood for you. My blood cries out on your behalf.” Out of His grace and kindness, He brings us the forgiveness of our sins at no cost to us whatsoever.</p></blockquote>

</figure><figure class="quote" id="q-d970ca3fcb" data-kw="">
<blockquote><p>It is a great sin to think any sin little; but it is a greater sin to think the righteousness of Christ is not above all sin. Our disobedience is the disobedience of man; but Christ’s obedience is the obedience of God: therefore, our believing in Christ doth please God better than if we had continued innocency, and never sinned. The least sin is unpardonable without this obedience and righteousness of Christ; and the greatest is pardonable by it. Therefore, O seek in to Christ, to be clothed upon with this righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“And Walking in Him, Opened”</cite></span></figcaption>

</figure><figure class="quote" id="q-318d74c4c5" data-kw="">
<blockquote><p>He who believes has eternal life. In justification not only the merit of Christ’s passive obedience is imputed but also that of his active obedience. In that benefaction believers receive forgiveness, exemption from punishment, and are not returned to the prefall state of Adam, who with the power granted to him had to keep the law and earn eternal life. On the contrary: on the basis of Christ’s perfect obedience, they are immediately entitled to eternal life; the holy works accomplished by Christ are credited to them; they do not, by keeping the law, have to earn eternal life, but do good works based on the principle of eternal life already granted to them in faith.</p></blockquote>

</figure><figure class="quote" id="q-ff21275831" data-kw="">
<blockquote><p>God demanded this perfect obedience from a man that was perfect in every way, and equal to the stipulated duty, for indeed: (1) through the image of God conferred upon Him, and in that image, original righteousness, He was blessed with spiritual wisdom… (2) He was to that point without any vice or sin (as much original as actual), through which alone his whole posterity was incapable of rendering to God his due (Rom. 8:3). Thus: (3) intrinsically, he was equipped with a perfect principle of obeying, namely, original righteousness; extrinsically, there was before him a perfect norm of obeying, nor did anything hinder that obedience.</p></blockquote>

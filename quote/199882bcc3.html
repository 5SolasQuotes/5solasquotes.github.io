<main class="wrap"><figure class="quote" id="q-199882bcc3" data-kw="faith response to call">
<blockquote><p>For as God calls by his word and offers the promise of grace, thus man responds by faith and receives and applies to himself the offered promise. The Scriptures often introduce this colloquy: “I will say, It is my people; and they shall say, The Lord is my God” (Hos. 2:23; Zech. 13:9; cf. Ps. 27:8; Jer. 3:22; Rom. 8:15, 16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.7.1</span></figcaption>

</figure><figure class="quote" id="q-ed7f354084" data-kw="acts of faith knowledge assent trust">
<blockquote><p>As to the acts, they are explained by theologians in different ways—some making more, others fewer. Some make only one, namely assent or persuasion. Others acknowledge only two—knowledge and assent. Others add a third (to wit, trust). Others a fourth also (to wit, confidence or the acquiescence of the will). These different opinions do not so much change the nature of faith as unfold it in different ways.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.8.1</span></figcaption>

<main class="wrap"><figure class="quote" id="q-71d4101d7c" data-kw="">
<blockquote><p>Therefore it is more certain than certain that Christ rose again on the third day after his death. This is:… (2) prefigured… Compare the bush that was burning yet not consumed (Ex. 3:2)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, trans. Todd Rester &amp; Michael Spangler (RHB), vol. 4, bk. 5; ch. 15, section 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

— Petrus van Mastricht, Theoretical Practical Theology. trans. Todd Rester &amp; Michael Spangler (RHB), vol. 4, bk. 5; ch. 15, section 3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTherefore+it+is+more+certain+than+certain+that+Christ+rose+again+on+the+third+day+after+his+death.+This+is%3A%E2%80%A6+%282%29+prefigured%E2%80%A6+Compare+the+bush+that+was+burning+yet+not+consumed+%28Ex.+3%3A2%29%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical+Practical+Theology.+trans.+Todd+Rester+%26+Michael+Spangler+%28RHB%29%2C+vol.+4%2C+bk.+5%3B+ch.+15%2C+section+3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F71d4101d7c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/71d4101d7c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/images-of-the-burning-bush-are-unlawful/#:~:text=Therefore%20it%20is%20more%20certain%20than,burning%20yet%20not%20consumed%20%28Ex.%203%3A2&amp;text=Therefore%20it%20is%20more%20certain%20than%20certain%20that&amp;text=that%20was%20burning%20yet%20not%20consumed%20%28Ex.%203%3A2" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d25546976b" data-kw="">
<blockquote><p>The things that are said of the burning bush, do wonderfully agree with the Old-Testament representations of the Messiah. It was not a high tree, but a bush; as the Messiah is called the low tree; Eze. 17:24, and elsewhere, the twig and the tender plant. This bush was a root out of dry ground; for it was a bush that grew in mount Horeb, which was so called for the remarkable dryness of the place. The word signifies ‘dryness;’ there was no spring about the mountain, till Moses there fetched water out of the dry rock. It was in a thirsty wilderness, where was wont to be no rain… That bush was the growth of the earth, as the human nature of Christ in the Old Testament is represented to be. Yet it had the divine nature of Christ in it; for this angel of the Lord that is said to appear in the bush, has been proved to be the same with the Messiah from the Old Testament, in my discourse on the prophecies of the Messiah. This angel is said to ‘dwell’ in this bush, Dt. 33:16, the more to represent the divine nature of the Messiah dwelling in the human nature. This bush burnt with fire, agreeably to what the prophecies speak of the sufferings of Christ; great calamity and affliction in the Old Testament are often called fire. This was especially a resemblance of the wrath of God, that is often called fire in the Old Testament, and which the prophecies represent the Messiah as enduring… The bush was preserved from being consumed, though it burnt with fire, agreeably to the prophecies of the preservation and upholding of the Messiah, God’s not suffering his Holy One to see corruption, etc. The bush emerged alive and frech out of the fire, agreeably to the prophecies of the Messiah’s resurrection from the dead, and deliverance from all his sufferings. The angel that dwelt out of that bush, who was the Messiah, comes out of the fire, and appears in the bush, and delivered alive from the flames, to work redemption for his people. See Ex. 3:8. So the prophecies represent the Messiah rising from the dead, and exalted out of his state of humiliation, to work salvation for his people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works</cite>, … ed. Edward Hickman (London: Ball, 1840) | Types of the Messiah, p. 653, vol. 2</span></figcaption>

</figure><figure class="quote" id="q-789a0114c6" data-kw="">
<blockquote><p>Behold, they paint and portray Jesus Christ, who (as we know) is not only man, but also God manifested in the flesh: and what a representation is that? He is God’s eternal Son in whom dwells the fullness of the God head, yea even substantially. Seeing it is said, substantially, should we have portraitures and images whereby only the flesh may be represented? Is it not a wiping away of that which is chiefest in our Lord Jesus Christ, that is to wit, of his divine Majesty? Yes: and therefore whensoever a crucifix stands mopping and mowing in the Church, it is all one as if the Devil had defaced the Son of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Deuteronomy</cite>, Sermon on Deuteronomy, May 23, 1555</span></figcaption>

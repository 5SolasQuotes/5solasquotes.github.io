<main class="wrap"><figure class="quote" id="q-d1758a69a1" data-kw="intuitive knowledge">
<blockquote><p>God knows all things by one intuitive act. As there is no succession in his being, so there is no succession in his knowledge. He knows things that are successive, before their existence and succession, by one single act of intuition. By one cast of his eye, all things future are present to him in regard of his eternity and omnipresence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Knowledge of God</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a> › <a href="../topics/attributes-of-god/knowledge-and-wisdom/foreknowledge.html">Foreknowledge</a></span><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a> › <a href="../topics/attributes-of-god/knowledge-and-wisdom/knowledge-of-future-contingents.html">Knowledge of future contingents</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3906a14668" data-kw="foreknowledge contingents">
<blockquote><p>Do all things fall under the knowledge of God, both singulars and future contingencies? We affirm against Socinus. He knows all things perfectly, undividedly, distinctly and immutably. Perfectly because he knows all things by himself or by his essence. Undividedly, because he knows all things intuitively and noetically, not discursively and dianoetically.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.12.1–2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a> › <a href="../topics/attributes-of-god/knowledge-and-wisdom/foreknowledge.html">Foreknowledge</a></span><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a> › <a href="../topics/attributes-of-god/knowledge-and-wisdom/knowledge-of-future-contingents.html">Knowledge of future contingents</a></span></div>

— Francis Turretin, Institutes of Elenctic Theology, 3.12.1–2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDo%20all%20things%20fall%20under%20the%20knowledge%20of%20God%2C%20both%20singulars%20and%20future%20contingencies%3F%20We%20affirm%20against%20Socinus.%20He%20knows%20all%20things%20perfectly%2C%20undividedly%2C%20distinctly%20and%20immutably.%20Perfectly%20because%20he%20knows%20all%20things%20by%20himself%20or%20by%20his%20essence.%20Undividedly%2C%20because%20he%20knows%20all%20things%20intuitively%20and%20noetically%2C%20not%20discursively%20and%20dianoetically.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%203.12.1%E2%80%932&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3906a14668.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3906a14668.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-dd70aeaad2" data-kw="scientia media">
<blockquote><p>Besides these two species of divine knowledge, a third was devised by the Jesuits, Fonseca, Lessius, Molina, which they called “middle knowledge.” Is there a middle knowledge in God between the natural and the free? We deny against the Jesuits, Socinians and Remonstrants. The free knowledge depends upon his will and decree by which things pass from a state of possibility to a state of futurition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.13.1–2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a> › <a href="../topics/attributes-of-god/knowledge-and-wisdom/middle-knowledge-scientia-media.html">Middle knowledge (scientia media)</a></span></div>
<div class="actions"><button class="copy" data-copy="“Besides these two species of divine knowledge, a third was devised by the Jesuits, Fonseca, Lessius, Molina, which they called “middle knowledge.” Is there a middle knowledge in God between the natural and the free? We deny against the Jesuits, Socinians and Remonstrants. The free knowledge depends upon his will and decree by which things pass from a state of possibility to a state of futurition.”

— Francis Turretin, Institutes of Elenctic Theology, 3.13.1–2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBesides%20these%20two%20species%20of%20divine%20knowledge%2C%20a%20third%20was%20devised%20by%20the%20Jesuits%2C%20Fonseca%2C%20Lessius%2C%20Molina%2C%20which%20they%20called%20%E2%80%9Cmiddle%20knowledge.%E2%80%9D%20Is%20there%20a%20middle%20knowledge%20in%20God%20between%20the%20natural%20and%20the%20free%3F%20We%20deny%20against%20the%20Jesuits%2C%20Socinians%20and%20Remonstrants.%20The%20free%20knowledge%20depends%20upon%20his%20will%20and%20decree%20by%20which%20things%20pass%20from%20a%20state%20of%20possibility%20to%20a%20state%20of%20futurition.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%203.13.1%E2%80%932&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdd70aeaad2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dd70aeaad2.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-f2494a6812" data-kw="Contentment Wisdom">
<blockquote><p>We, indeed, look at things by pieces, we look at one detail and do not consider the relation that one thing has to another, but God looks at all things at once, and sees the relation that one thing has to another. When a child looks at a clock, it looks first at one wheel, and then at another wheel: he does not look at them all together or the dependence that one has upon another; but the workman has his eyes on them all together and sees the dependence of all, one upon another: so it is in God&#x27;s providence. Now notice how this works to contentment: when a certain passage of providence befalls me, that is one wheel, and it may be that if this wheel were stopped, a thousand other things might come to be stopped by this. In a clock, stop but one wheel and you stop every wheel, because they are dependant upon one another. So when God has ordered a thing for the present to be thus and thus, how do you know how many things depend upon this thing? God may have some work to do twenty years hence that depends on this passage of providence that falls out this day or this week.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rare Jewel of Christian Contentment</cite>, ch. 3, Lesson 9 (variety and order of providence)</span></figcaption>

</figure><figure class="quote" id="q-8fb05937d5" data-kw="Wisdom">
<blockquote><p>Who can trace the motions of God&#x27;s eyes in their race? &#x27;He makes the clouds his chariot,&#x27; Ps. 104:3, in his motions about the earth, and his throne is in the dark. He walks upon the wings of the wind, his providential speed makes it too quick for our understanding. His ways are mysterious, and put the reason and wisdom of men to a stand. The clearest-sighted servants of God do not see the bottom of his works, the motion of God&#x27;s eyes is too quick for ours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite>, Discourse on 2 Chron. 16:9, Doct. 1, Prop. 2</span></figcaption>

<blockquote><p>Q. What is the Word to be with reference unto us?

A. A Rule.

Q. Is any other Rule sufficient for our direction?

A. No, this is the only Rule.

Q. Can we receive sufficient directions from our own wisdom, or the light of nature, to come to glorify, and enjoy God?

A. No.

Q. Can we receive sufficient direction from God’s works of Creation, and Providence?

A. No.

Q. Is the Scripture a sufficient Guide?

A. Yes.

Q. In what do the Scriptures direct us?

A. How we may glorify God, and enjoy him for ever.

Q. Can we never learn then how to glorify God here, or to enjoy him hereafter, without the guidance, and directions of the Scriptures?

A. No.</p></blockquote>

<blockquote><p>24. Applicatory works of grace are either external or internal.

25. External ones are both calling through the Word, partly of Law, partly of gospel, and the sealing of those called through sacraments.

26. Calling through Law is prior, and that partly imperative of obedience, partly declarative of sanction, both promissory and comminatory. …

29. Calling through nature to God the Creator is broader; calling through the Word to God the redeemer is stricter.

30. Universal calling to salvation neither was, nor is, nor will be.

31. That hope of special mercy is shown in nature, or that this is the instrument of gospel-calling, is false, nor can this be said without nature being established as a herald of grace.</p></blockquote>

</figure><figure class="quote" id="q-a11a0e697c" data-kw="">
<blockquote><p>The infinite God cannot be fully known by any of His creatures, but that there is a knowledge of Him within the reach of His creatures of mankind, is apparent from the very constitution of their nature, as well as from the relation in which they stand to Him.

That knowledge reveals to them His spirituality and His glory, as well as His providential care, that “they may seek Him, if haply they may feel after Him and find Him, though He is not far from every one of us.”

This view of the divine nature is furnished by observation of the works of God, and is also the dictate of our own consciousness, which tells us that we are not self-made and selfsustained, but that we are the children of a divine Father and the subjects of His supreme rule.

The Atheist denies the truth that there is a God; and the Pantheist affirms that there is nothing else but God. Both of these errors are renounced by enlightened reason. It refuses to be blind to the great fact of the divine existence. It also rejects the notion that this God is merely an infinite substance — a vague immensity. There is one living and true God, but in Him all being is not absorbed. He is in all; but everything is not God.</p></blockquote>

quotes.github.io%2Fquote%2Fa11a0e697c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a11a0e697c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/11/19/alexander-macewan-on-the-natural-knowledge-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-d2478435c2" data-kw="">
<blockquote><p>Of course, without special personal divine interposition there is a considerable amount of revelation of God’s being and perfections afforded by nature, — by the works of God’s hand, the constitution that He has given to man, and the providence and government which He constantly and silently exercises over him. God could not create such a world as this, and put and keep in it an intelligent being like man, without inlaying into the workmanship of His hands, and into His providence over it, incontestible evidence of His own existence, and considerable proofs, because traces of His wisdom, power, and goodness.

No one doubts, and our [Westminster] Confession in its very first clause admits, that in this there is a source of knowledge of God, or if you will, of revelation, thoroughly valuable and important; while science, glorious science, is continually reading it off to us more and more fully, some of her unwitting sons labouring in the service as the hardest driven Gibeonites we have ever chanced to come across sweating in their toil. Long and successfully may they toil, and much may they bring to light in proof of God’s necessary existence and God’s necessary perfections!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Doctrine of the Inspiration of Scripture (With a Prefatory Note on the Free Church College Committee’s Report, and with Remarks on Dr Marcus Dods’s Recent Sermon)</cite>, (1877; 4th edn, London: J. Nisbet, 1890), p. 11.</span></figcaption>

</figure><figure class="quote" id="q-f5fd75eefd" data-kw="">
<blockquote><p>An extreme opinion on this subject has been held by some Christians, to the effect that no true and certain knowledge of God can be derived by man, in his present condition, from the light of nature in the entire absence of a supernatural revelation; that we are altogether dependent upon such a revelation for any certain knowledge that God exists, as well as for all knowledge of his nature and his purposes. This opinion is disproved: (a.) By the direct testimony of Scripture. Rom. 1:20–24; 2:14, 15. (b.) By the fact that many conclusive arguments for the existence of a great first Cause, who is at the same time an intelligent personal Spirit and righteous moral Governor, have been drawn by a strict induction from the facts of nature alone, as they lie open to the natural understanding. The fact that this argument remains unanswerable shows that the process by which the conclusions are drawn from purely natural sources is legitimate. (c.) All nations, however destitute of a supernatural revelation they may have been, have yet possessed some knowledge of a God. And in the case of the most enlightened of the heathen, natural religion has given birth to a considerable natural theology. We must, however, distinguish between that knowledge of the divine character which may be obtained by men from the works of nature and providence in the exercise of their natural powers alone, without any suggestions or assistance derived from a supernatural revelation—as is illustrated in theological writings of some most eminent of the heathen who lived before Christ—and that knowledge which men in this age, under the clear light of a supernatural revelation, are competent to deduce from a study of nature. The natural theology of the modern rationalists demonstrably owes all its special excellences to that Christian revelation it is intended to supersede.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, (Philadelphia: Presbyterian Board of Publications, 1920), 45–46.</span></figcaption>

— A. A. Hodge, A Commentary on the Confession of Faith, (Philadelphia: Presbyterian Board of Publications, 1920), 45–46.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAn+extreme+opinion+on+this+subject+has+been+held+by+some+Christians%2C+to+the+effect+that+no+true+and+certain+knowledge+of+God+can+be+derived+by+man%2C+in+his+present+condition%2C+from+the+light+of+nature+in+the+entire+absence+of+a+supernatural+revelation%3B+that+we+are+altogether+dependent+upon+such+a+revelation+for+any+certain+knowledge+that+God+exists%2C+as+well+as+for+all+knowledge+of+his+nature+and+his+purposes.+This+opinion+is+disproved%3A+%28a.%29+By+the+direct+testimony+of+Scripture.+Rom.+1%3A20%E2%80%9324%3B+2%3A14%2C+15.+%28b.%29+By+the+fact+that+many+conclusive+arguments+for+the+existence+of+a+great+first+Cause%2C+who+is+at+the+same+time+an+intelligent+personal+Spirit+and+righteous+moral+Governor%2C+have+been+drawn+by+a+strict+induction+from+the+facts+of+nature+alone%2C+as+they+lie+open+to+the+natural+understanding.+The+fact+that+this+argument+remains+unanswerable+shows+that+the+process+by+which+the+conclusions+are+drawn+from+purely+natural+sources+is+legitimate.+%28c.%29+All+nations%2C+however+destitute+of+a+supernatural+revelation+they+may+have+been%2C+have+yet+possessed+some+knowledge+of+a+God.+And+in+the+case+of+the+most+enlightened+of+the+heathen%2C+natural+religion+has+given+birth+to+a+considerable+natural+theology.+We+must%2C+however%2C+distinguish+between+that+knowledge+of+the+divine+character+which+may+be+obtained+by+men+from+the+works+of+nature+and+providence+in+the+exercise+of+their+natural+powers+alone%2C+without+any+suggestions+or+assistance+derived+from+a+supernatural+revelation%E2%80%94as+is+illustrated+in+theological+writings+of+some+most+eminent+of+the+heathen+who+lived+before+Christ%E2%80%94and+that+knowledge+which+men+in+this+age%2C+under+the+clear+light+of+a+supernatural+revelation%2C+are+competent+to+deduce+from+a+study+of+nature.+The+natural+theology+of+the+modern+rationalists+demonstrably+owes+all+its+special+excellences+to+that+Christian+revelation+it+is+intended+to+supersede.%E2%80%9D%0A%0A%E2%80%94+A.+A.+Hodge%2C+A+Commentary+on+the+Confession+of+Faith%2C+%28Philadelphia%3A+Presbyterian+Board+of+Publications%2C+1920%29%2C+45%E2%80%9346.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff5fd75eefd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f5fd75eefd.html">Permalink</a><a class="src" href="https://heidelblog.net/2020/10/a-a-hodge-in-defense-of-natural-revelation/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

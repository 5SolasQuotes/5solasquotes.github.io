<main class="wrap"><figure class="quote" id="q-492d7d067f" data-kw="">
<blockquote><p>God speaks with sinners through his messengers. They come for God’s purpose, and their words, counsels, exhortations, and reproofs are his. When sinners reject the words which God’s ministers bring in his name, they are actually striving with the Spirit. They are wrestling with Christ as if He were present. When God comes to reckon with sinners, it will prove just so. God will remind them of his striving and their unkind resistance. The Spirit strives with the consciences of men, debating in their own hearts the case against them, and shows man his sin in all its ugly colors. He does this so well that the creature can sometimes smell the very fire and brimstone about him, and makes him feel at present in a temporary hell. At other times, he parleys and works with them, and makes gracious overtures and offers of the gospel to them. He opens a door of hope and woos and beseeches them to throw down their rebellious arms and come to Christ for life. He reveals how Christ is in a present disposition to embrace their first motion towards mercy. The Spirit follows the sinner from place to place, and from time to time suggesting such encouragements. Many, however, cast off the Spirit’s hands in resistance. This carries such malignity in it, that some have felt the horror of the unpardonable sin, even though their condition is not final. Take heed, however, sinners, how you respond to the Spirit when He comes knocking at the door of your hearts. Open at this knock, and He will be your guest; you will have his sweet company. Repulse Him, and you have not a promise He will knock again. If once He stops striving with you, unhappy man, you are lost forever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gurnall.html">William Gurnall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian in Complete Armor</cite>, (†1679), 1:116-17</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f966c5e672" data-kw="">
<blockquote><p>Secondly, Those who have not as yet received Christ to dwell in them are to be moved, as they desire Heaven’s glory hereafter and the comfortable hopes of it here upon earth, to give entertainment unto Jesus Chist. Zacchaeus upon a hint given of Christ’s willingness to come into his house, comes down out of the sycamore tree quickly, and receives him joyfully (Lk. 19:4). Now do you with seriousness consider with what 1. importunity, 2. patience, 3. and promises the Lord Jesus calls upon you for entertainment. ‘Behold, I stand at the door and knock, if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with Me.’ (Rev. 3:20)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/simeon-ashe.html">Simeon Ashe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Riches of the Gospel &amp; the Hope of Christians, a Sermon</cite>, … (London, A.M., 1654), p. 32</span></figcaption>

</figure><figure class="quote" id="q-74624ffb35" data-kw="">
<blockquote><p>Why, this is it that Christ offers, no less than Himself, to be thine forever. This is it which He offers when He stands and knocks at thy heart: ‘Open to me; I will be thy God, the Lord thy Redeemer. Though thou hast rebelled against Me, and followed after strange gods, yet now renounce those idols; Open to me, I will be thy God, and that by covenant more durable than heaven and earth.’ ‘Open to me, thy Redeemer will be thy husband. Though thou hast played the harlot with many lovers… I will marry thee to Myself in an everlasting covenant that shall never be broken; I will rejoice over thee as a bridegroom over his bride.’ ‘Open to me, I will make over no less than Myself unto thee. Thou shalt have that which it is the glory and happiness of Heaven to have, myself, communion with Me; I will come and sup with thee, and thou with Me. Art thou poor? Open to Me;’ The commander of Heaven and earth will be thine to enrich thee… Thus Christ offers Himself; and oh how wonderful is it, that He should come to vile worms, and knock, and wait, and entreat that Himself may be accepted!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Gracious Invitation to Sinners on Rev. 3:20 in Practical Works</cite>, (d. 1686; Edinburgh: J. Nichol, 1865), vol. 2, pp. 34-100, p. 42</span></figcaption>

</figure><figure class="quote" id="q-9268fb1e60" data-kw="">
<blockquote><p>The mighty God who fills all space and reigns in majesty over all worlds, standing at the door of the sinner’s heart, humbling Himself to the language of entreaty, beseeching the sinner to come and be reconciled to Him, begging for admittance, and protesting that if you only come unto Him through Christ, He is willing to forgive all, and to forget all. Oh! my brethren, ought not this to encourage you? Yes! and if you refuse the encouragement, it ought also to fill you with terror.</p></blockquote>

</figure><figure class="quote" id="q-b77f7d56f4" data-kw="">
<blockquote><p>And he says, though He be a king, yea, the King of Kings, yet He stands at the door and knocks, that is, calls them to repentance and promises if they will let Him in, that is, turn from their sin and yield to his will, He will come unto them and sup with them, signifying what exceeding joy and comfort they should receive by Him; yea, they should be made partakers of the joys of Heaven: where he alludes to the comfort that friends have one of another when they meet together at their dinners, suppers and feasts, which thing, if it be comfortable to men, much more comfort shall it minister unto us, to be partakers of the company of Christ Jesus Himself in his heavenly banquet. A second benefit he notes in that those that do thus receive Him and overcome shall not only receive comfort, but glory also and honor in his Kingdom…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain Explanation of the Whole Revelation of St. John</cite>, … (d. 1603; London: 1622), ch. 3, p. 22</span></figcaption>

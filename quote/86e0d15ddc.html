<blockquote><p>In natural things, it is to be noted that the whole fulness of perfection due to a thing, is not from the mere substantial form that gives it its species since a thing derives much from supervening accidents, as man does from shape, color and the like; and if any one of these accidents be out of due proportion, evil is the result. So it is with action. For the plenitude of its goodness does not consist wholly in its species, but also in certain additions which accrue to it by reason of certain accidents: and such are its due circumstances. Wherefore if something be wanting that is requisite as a due circumstance the action will be evil. … Circumstances are outside an action inasmuch as they are not part of its essence; but they are in an action as accidents thereof… Every accident is not accidentally in its subject, for some are proper accidents; and of these every art takes notice. And thus it is that the circumstances of actions are considered in the doctrine of morals… Since good and being are convertible, according as being is predicated of substance and of accident, so is good predicated of a thing both in respect of its essential being, and in respect of its accidental being; and this, both in natural things and in moral actions.</p></blockquote>

<blockquote><p>…you [Gilbert Burnet] boldly attempt to make even the very sacraments arbitrary by asking why we use not washing of feet, since there is no sacrament set down more punctually in Scripture? And when your non-conformist [in your book] retorts that you are under the same obligation (which retortion may be pertinently made to most of your objections), you tell him that you have a clear answer, that in these externals God intended no perpetual obligation, and therefore in them you follow the practice of the catholic Church… As for this your lax acceptation of a professed indifferency in externals, what part of the Christian religion or worship may it not corrupt or subvert? And seing it does tolerate and allow the not practising of the washing of feet to you, as well founded In Scripture as either of the sacraments, would it not in a just parity of reason dispense with and forego these also? This is indeed doctrine so damnable, that I hope it shall never need an antidote; and therefore I return to examine your third or eight sacrament (I know not which, for all are but external) of washing of feet. And you say that it has in Scripture of element, water, the action, washing the feet, the institution, ‘as I have done so do ye’ and ‘ye ought to wash one another’s feet’, and the spiritual use of it, humility: Whence you conclude: ‘Why do ye not therefore use this rite?’ To which last point, it is, that waving any further discourse about the nature and requisites of a sacrament, whereof, notwithstanding your parrallel description of this washing, yet I perceive you are loathe to apply the name, I shall direct my answere, viz.: That this washing is not to be used, because though our Lord did practice this lowly act of condescendence as eminently expressive of that humility whereunto He would have his disciples instructed, yet neither is it in itself of the nature of a sacramental sign, whereof all the significancie is from the institution, and virtue in the exhibition of the thing signified, which you cunningly omit to mention; Nor does Christ perform it by way of institution, for repetition, but by way of example, for imitation, as is manifest from the text, John 13:4, etc. where we find that our Lord does first wash his disciples’ feet before He told them what He was a doing; and then having done the act, not simply significant by his appointment, but of itself as the effect expressing the greatest humility as its cause, He teaches them not a […]o […]emne reiteration, but the use in these words, ‘If I your Lord and Master have washed your feet, ye also ought to wash on another’s feet’: ‘If I have been among you as He that serves, so ought ye to serve one another, for I have given you an example that ye should do as I have done to you.’ I have not showed you humility in a figure to be repeated for your remembrance, but by a solid practice taught you the like performance: so that to turn this pattern unto a rite is in effect as far from our Lord’s purpose as the instruction of plain examples is preferable to that of mystic representations: Which exposition is so true and sound, that as this fancy of yours was never owned by the Church of Christ, so, it is most certain, that where it has been followed (I mean by the Pope) and this action has been used as a rite, it has only been made a color to the most prodigious and superlative pride that ever the sun beheld: and thus I hope all men may see that the not using of this washing, never again used for anything we read, by way of sacrament or ceremony, either by our Lord or his apostles and Churches, is neither a deformity in us from the Scripture, nor an argument for your irreligious laxness in things you call externals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … (1671), 3rd Dialogue, pp. 117-19</span></figcaption>

<blockquote><p>I respond that it was a part of the obedience to the divinely given ceremonial laws until the death of Christ, and a fulfilling of the time of correction (Col. 2; Heb. 9). But by the death of Christ, it being one with the other ceremonials, became defunct as to observing it in conscience, yet not however until it had an honest funeral, but from reason of the scandal of the weak from amongst the circumcision, some of them were to observe them in parts till the Jews may be fully and plainly convicted of the cessation of the ceremonial law.</p></blockquote>

<blockquote><p>3. Much less must we prefer them [animals] before men: We must not be cruel to men pretending to show mercy to the brute creatures. The life of a beast must go still to save or preserve the life of a man. I cannot but condemn the Turks, who set birds at liberty out of their cages, redeeming with money these captives, and yet make no conscience of chaining Christians to their galleys; as also the hypocrisy [of those] that cheat amongst the Romanists, whose clergy are forbid to hunt beasts, and yet some made Lords Inquisitors on purpose to hunt down, tear and devour the harmless sheep and lambs of Christ. Surely the good, the great, and the chief Shepherd of the flock and the Bishop of our souls will count them but little thanks for their so doing when He shall come to hold his general Visitation and to judge the world. These things notwithstanding, I dare not condemn those (if necessitated to save and defend their own lives) which in the civil wars of France cut off their horse-legs and so made themselves a breast-work of their bodies. Nor dare I judge king David for houghing his enemies’ horses, thereby to make them unserviceable for the wars, 2 Sam. 8:4. Let’s not be superstitiously afraid to use these creatures, either for food, physic or service, no nor for our honest delight and recreation. See your charter for so doing, if not implicitly given to Adam, yet expressly to Noah; and again renewed, Acts 10, under the Gospel, in the vision and voice to Peter, ‘Arise Peter, kill, and eat.’ And though ’tis said the disciples of the Nazarites may be known by their abstinence from the flesh of all living creatures, yet our Lord Jesus Christ of Nazareth, and He that in substance though not in vow and ceremony was the true Nazarite, gave his disciples no such commandment. Those who refuse altogether to eat the flesh of living creatures, when duly killed, deserve the name of Pythagoreans, followers of Pythagoras the philosopher, rather than to be called Christians or disciples of Christ our Saviour. So then, use these creatures we may, we must, without scruple for our meat; yea and we may use these creatures for our work, to plow and harrow the ground, and to carry our corn into the barn, and for any other necessary use. And although many condemn those persons who promote the generation of mules [which are a mix of species], so does Maimonides in his More Nev. p. 3, ch. 4 and our own writers on Gen. 36:24, yet we may use them lawfully; for we find them brought to Solomon, 1 Kings 10:25; 2 Chron. 9:24, and amongst the Israelites at their return from captivity, Ezra 2:66 and Neh. 7:68. And we nowhere find that ever they were commanded to put these away, though monsters in nature, as they were to put away their outlandish wives.</p></blockquote>

<blockquote><p>XXXV. The argument drawn from ‘the abstemious,’ who commune only under one kind, cannot favor our opponents. The insuperable exception of a few ought not to overthrow a general rule. Their abstaining from the cup is not voluntary and free (which would be altogether culpable), but involuntary and invincible on account of a natural and unavoidable inability. Therefore, if they do not use the cup, they are not on that account to be considered as violators of the divine command, because the precept has reference only to those who can use wine and not to those in whom God has placed such an invincible impediment (and whom on that account He wished to dispense [dispensare] from this precept). But so far is this from infringing the command of Christ that it rather strengthens it the more, as an exception added to a rule is wont to bind it more strongly. For since they only are excused from taking the cup who have a disgust for wine, by that very thing all others are determined to be bound to receive it. This is illustrated by the example of the deaf; for although the command to hear the Word is given to all, it binds only those who can hear and not the deaf. And if the deaf are exempted from it, falsely would anyone infer from this that it was also lawful for others to be excepted. XXXVI. The article of discipline of our churches by which the abstemious are excused from the use of the cup, provided they show reverence only by the movement of the cup to the mouth (by which they follow the institution of Christ and do not abstain from it through contempt but from inability), cannot help the Romanists (cf. ‘The Discipline of the Reformed Churches of France,’ 12, Canon 7 in Quick, Synodicon [1692], 1:xlviii). (1) Our practice differs widely from the Roman. It is one thing to bear with the weakness of those who cannot use wine; another to takw away from and prohibit the cup to those who are without such weakness. The former is done by us; the latter by Romanists. (2) The article of discipline is a work of charity and accommodation (synkatabaseos) towards a few out of unavoidable necessity. But the dogma of the Romanists is an absolute and simple interdiction towards all without necessity and against the express command of Christ. (3) The discipline does not intend that the species of the sacrament should be divided; nay, it intends that the sacrament should be retained entire and be conjointly extended and distributed to the people by the ministers (although both species cannot be received by the abstemious, but only one). But the Roman doctrine and practice wishes the sacrament to be divided and the communion mutilated by the priests. According to us the abstemious ought not only to desire the cup, but also to do everything to overcome their weakness; but the Romanists so take away the cup from the people that it is wrong for them to ask for it or to touch it. In one word, while according to our opinion nobody is kept from the use of the cup; nay, pastors are commanded to offer both kinds and believers to do all they can for its reception; by the Romanists the use of the cup is expressly forbidden to the people. It is evident that there is a great and wide difference between our opinion and theirs. XXXVII. Now although the abstemious receive the sacrament only under one kind, their communion is not on that account to be considered wholly profitless (illusoria). (1) The entire sacrament is extended to them by the minister and if they are compelled to abstain from one kind, it is not done spontaneously and contemptuously, but from sheer weakness and unavoidable necessity. (2) Although the species in the sacrament are indivisible by the ordination of God, this has respect to those only who can use them and not to others (whom He Himself dispenses by the obstacle placed in their way). For as He made the law, so He alone can dispense from it whom He pleases; and separate the species in certain cases, who joined them and willed them to be joined. (3) The defect of use (or of either species through the taste) can in some measure be supplied both by the wish and from the sight, touch, smell and other sensations. (4) Although both signs are not received, they do not cease to be made partakers of the whole thing signified, which is indivisible.</p></blockquote>

France%2C%E2%80%99+12%2C+Canon+7+in+Quick%2C+Synodicon+%5B1692%5D%2C+1%3Axlviii%29.+%281%29+Our+practice+differs+widely+from+the+Roman.+It+is+one+thing+to+bear+with+the+weakness+of+those+who+cannot+use+wine%3B+another+to+takw+away+from+and+prohibit+the+cup+to+those+who+are+without+such+weakness.+The+former+is+done+by+us%3B+the+latter+by+Romanists.+%282%29+The+article+of+discipline+is+a+work+of+charity+and+accommodation+%28synkatabaseos%29+towards+a+few+out+of+unavoidable+necessity.+But+the+dogma+of+the+Romanists+is+an+absolute+and+simple+interdiction+towards+all+without+necessity+and+against+the+express+command+of+Christ.+%283%29+The+discipline+does+not+intend+that+the+species+of+the+sacrament+should+be+divided%3B+nay%2C+it+intends+that+the+sacrament+should+be+retained+entire+and+be+conjointly+extended+and+distributed+to+the+people+by+the+ministers+%28although+both+species+cannot+be+received+by+the+abstemious%2C+but+only+one%29.+But+the+Roman+doctrine+and+practice+wishes+the+sacrament+to+be+divided+and+the+communion+mutilated+by+the+priests.+According+to+us+the+abstemious+ought+not+only+to+desire+the+cup%2C+but+also+to+do+everything+to+overcome+their+weakness%3B+but+the+Romanists+so+take+away+the+cup+from+the+people+that+it+is+wrong+for+them+to+ask+for+it+or+to+touch+it.+In+one+word%2C+while+according+to+our+opinion+nobody+is+kept+from+the+use+of+the+cup%3B+nay%2C+pastors+are+commanded+to+offer+both+kinds+and+believers+to+do+all+they+can+for+its+reception%3B+by+the+Romanists+the+use+of+the+cup+is+expressly+forbidden+to+the+people.+It+is+evident+that+there+is+a+great+and+wide+difference+between+our+opinion+and+theirs.+XXXVII.+Now+although+the+abstemious+receive+the+sacrament+only+under+one+kind%2C+their+communion+is+not+on+that+account+to+be+considered+wholly+profitless+%28illusoria%29.+%281%29+The+entire+sacrament+is+extended+to+them+by+the+minister+and+if+they+are+compelled+to+abstain+from+one+kind%2C+it+is+not+done+spontaneously+and+contemptuously%2C+but+from+sheer+weakness+and+unavoidable+necessity.+%282%29+Although+the+species+in+the+sacrament+are+indivisible+by+the+ordination+of+God%2C+this+has+respect+to+those+only+who+can+use+them+and+not+to+others+%28whom+He+Himself+dispenses+by+the+obstacle+placed+in+their+way%29.+For+as+He+made+the+law%2C+so+He+alone+can+dispense+from+it+whom+He+pleases%3B+and+separate+the+species+in+certain+cases%2C+who+joined+them+and+willed+them+to+be+joined.+%283%29+The+defect+of+use+%28or+of+either+species+through+the+taste%29+can+in+some+measure+be+supplied+both+by+the+wish+and+from+the+sight%2C+touch%2C+smell+and+other+sensations.+%284%29+Although+both+signs+are+not+received%2C+they+do+not+cease+to+be+made+partakers+of+the+whole+thing+signified%2C+which+is+indivisible.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+%28P%26R%29%2C+vol.+3%2C+19th+Topic%2C+Question+25%2C+%E2%80%98Communion+under+Both+Kinds%E2%80%99%2C+sections+35-37%2C+pp.+463-4+This+is+contra+Rome+withholding+the+cup+from+the+laity.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F44fb257ea6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/44fb257ea6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sacraments-in-extra-ordinary-circumstances/#:~:text=XXXV.%20The%20argument%20drawn%20from%20%E2%80%98the,whole%20thing%20signified%2C%20which%20is%20indivisible&amp;text=XXXV.%20The%20argument%20drawn%20from%20%E2%80%98the%20abstemious%2C%E2%80%99%20who&amp;text=of%20the%20whole%20thing%20signified%2C%20which%20is%20indivisible" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

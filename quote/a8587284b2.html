<blockquote><p>Here he indicates the end for which God, in the flesh of his Son, condemned our sin—namely, that the righteousness (or justification) of the Law might be fulfilled in us; that is, that we might be justified, being endowed with that righteousness which the Law requires of us. For the Law requires of us either perfect obedience or punishment. But we have not rendered perfect obedience; yet we have paid the penalty in Christ, for he paid it on our behalf. Therefore we have satisfied the Law in Christ; and consequently the Law cannot condemn us, but is bound to justify us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Rom. 8:4, “That the righteousness of the law might be fulfilled in us, who walk not after the flesh, but after the Spirit.”</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2b18c6ea1b" data-kw="">
<blockquote><p>Here the preceding cause [in Rom. 3:24] is Christ constituted a propitiation in his blood. In this impulsive cause, two things are noted: First, Christ’s justice or obedience is the meritorious cause of our salvation; Second, this justice and obedience consists in full satisfaction for our sins and complete fulfillment of the Law for us. Concerning the first, that Christ’s justice is the meritorious cause of our salvation: since it seems to conflict that we are saved by free grace and by merit, that is, a price paid, it must be thus understood. Christ’s merit opposes not God’s judgment simply or in itself, for Christ, as man and Son of God by the union of divine and human natures, has this of grace, not having earned it. As Augustine testifies, in Him the predestination of grace most clearly shines, so His merit opposes not God’s grace but is subordinate to it, depending thereon. But both God’s grace and Christ’s merit oppose our works, each in its order. Thus, grace, from which merit flows, and merit, whereby we are saved, stand together. This is proved by texts conjoining God’s love, Christ’s propitiation, reconciliation, redemption, and ransom, and by the same and like texts proving that Christ by His obedience truly merited salvation for us. For if He fully satisfied for our sins, paid the penalties due, appeased God’s wrath, and acquired eternal life, He rightly merited salvation for us. Merit here we call the most sufficient price to satisfy God’s judgment for sins and penalties and to acquire eternal life. In sum, respecting God, all is free; respecting God’s appeased wrath through the Son, there is merit, yet freely given to you. Concerning the second, that Christ’s justice consists in full satisfaction for our sins and complete fulfillment of the Law: Christ’s most full and perfect obedience or justice, whereby we are justified when imputed, includes both complete satisfaction for all sins and fulfillment of all the Law requires of us. For He was made under the Law for us, which demands two things: that we commit nothing against it, and omit nothing of it. Otherwise, it thunders woe against both him that does not what he ought and him that does what he ought not. But Christ is the fulfilling of the Law unto salvation for all that believe (Rom. 10). The righteousness of the Law is fulfilled in us, not by us, but in our Head, Christ, for us. Thus, chiefly, Christ by His obedience satisfied for our sins, bearing most sufficient penalties, whence Scripture greatly commends the benefit of Christ’s death, for by it we are redeemed from death. But He also perfectly fulfilled the Law for us, not only by suffering but by doing—yea, in suffering He acts, for He offers Himself as priest and is offered as victim (Rom. 4). Not only are sins not imputed, being remitted, but Christ’s justice is imputed, He who was made justice for us (1 Cor. 1:30). Yet to understand this rightly, note that Christ’s justice is threefold: First, essential, common to the three Persons, which is God Himself, for whatsoever is in God is God; Second, habitual justice, adorning His human nature from conception with purity far beyond angelic, yet created; Third, actual justice, whereby throughout His life, especially in suffering that death, He rendered obedience to the Father. This third alone enters the account of the merit of our justification, whereby we are not only redeemed from death but obtain eternal life through this perfect obedience perfectly rendered to the Law by Christ for us. … The matter of justification, as the term is variously taken, is considered by theologians not in one way, but it reduces to this: the matter is either the subject in which and from which this benefit arises, namely, Christ’s imputed justice, as taught above, which imputation includes both absolution from injustice through remission of sins (by which term Scripture often synecdochically comprehends the whole benefit of salvation) and the adjudication of Christ’s justice (Dan. 9, Rom. 4, 8, mentioning not only remission but the gift of justice); or the subject receiving this benefit, which is all and only the elect (Rom. 8, proved first a priori, because they are elect, then a posteriori, because they are justified). The form of justification is this application of Christ’s justice through faith, or that free imputation whereof we spoke (Rom. 4, Phil. 3, 2 Cor. 5), where the phrase ‘in Him’ notes two things: first, our justice is not inherent in us but Christ’s, existing outside us, yet ours by right of donation; second, we have Christ’s justice as Christ has our sin—not subjectively but relatively, by imputation, as shall be said in explicating the effects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-lucas-trelcatius.html">Lucas Trelcatius Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commonplaces of Holy Theology, “Of Justification”, “Part Constructive”</cite>, p. 137 in Trelcatius Sr. &amp; Jr., Opuscula Theologica Omnia (d. 1602; Leiden: Orlers &amp; Maire, 1614), trans. AI at Confessionally Reformed Theology. Trelctius Sr. (1542–1602) was a reformed theologian and professer at Leiden, Netherlands.</span></figcaption>

l+the+most+sufficient+price+to+satisfy+God%E2%80%99s+judgment+for+sins+and+penalties+and+to+acquire+eternal+life.+In+sum%2C+respecting+God%2C+all+is+free%3B+respecting+God%E2%80%99s+appeased+wrath+through+the+Son%2C+there+is+merit%2C+yet+freely+given+to+you.+Concerning+the+second%2C+that+Christ%E2%80%99s+justice+consists+in+full+satisfaction+for+our+sins+and+complete+fulfillment+of+the+Law%3A+Christ%E2%80%99s+most+full+and+perfect+obedience+or+justice%2C+whereby+we+are+justified+when+imputed%2C+includes+both+complete+satisfaction+for+all+sins+and+fulfillment+of+all+the+Law+requires+of+us.+For+He+was+made+under+the+Law+for+us%2C+which+demands+two+things%3A+that+we+commit+nothing+against+it%2C+and+omit+nothing+of+it.+Otherwise%2C+it+thunders+woe+against+both+him+that+does+not+what+he+ought+and+him+that+does+what+he+ought+not.+But+Christ+is+the+fulfilling+of+the+Law+unto+salvation+for+all+that+believe+%28Rom.+10%29.+The+righteousness+of+the+Law+is+fulfilled+in+us%2C+not+by+us%2C+but+in+our+Head%2C+Christ%2C+for+us.+Thus%2C+chiefly%2C+Christ+by+His+obedience+satisfied+for+our+sins%2C+bearing+most+sufficient+penalties%2C+whence+Scripture+greatly+commends+the+benefit+of+Christ%E2%80%99s+death%2C+for+by+it+we+are+redeemed+from+death.+But+He+also+perfectly+fulfilled+the+Law+for+us%2C+not+only+by+suffering+but+by+doing%E2%80%94yea%2C+in+suffering+He+acts%2C+for+He+offers+Himself+as+priest+and+is+offered+as+victim+%28Rom.+4%29.+Not+only+are+sins+not+imputed%2C+being+remitted%2C+but+Christ%E2%80%99s+justice+is+imputed%2C+He+who+was+made+justice+for+us+%281+Cor.+1%3A30%29.+Yet+to+understand+this+rightly%2C+note+that+Christ%E2%80%99s+justice+is+threefold%3A+First%2C+essential%2C+common+to+the+three+Persons%2C+which+is+God+Himself%2C+for+whatsoever+is+in+God+is+God%3B+Second%2C+habitual+justice%2C+adorning+His+human+nature+from+conception+with+purity+far+beyond+angelic%2C+yet+created%3B+Third%2C+actual+justice%2C+whereby+throughout+His+life%2C+especially+in+suffering+that+death%2C+He+rendered+obedience+to+the+Father.+This+third+alone+enters+the+account+of+the+merit+of+our+justification%2C+whereby+we+are+not+only+redeemed+from+death+but+obtain+eternal+life+through+this+perfect+obedience+perfectly+rendered+to+the+Law+by+Christ+for+us.+%E2%80%A6+The+matter+of+justification%2C+as+the+term+is+variously+taken%2C+is+considered+by+theologians+not+in+one+way%2C+but+it+reduces+to+this%3A+the+matter+is+either+the+subject+in+which+and+from+which+this+benefit+arises%2C+namely%2C+Christ%E2%80%99s+imputed+justice%2C+as+taught+above%2C+which+imputation+includes+both+absolution+from+injustice+through+remission+of+sins+%28by+which+term+Scripture+often+synecdochically+comprehends+the+whole+benefit+of+salvation%29+and+the+adjudication+of+Christ%E2%80%99s+justice+%28Dan.+9%2C+Rom.+4%2C+8%2C+mentioning+not+only+remission+but+the+gift+of+justice%29%3B+or+the+subject+receiving+this+benefit%2C+which+is+all+and+only+the+elect+%28Rom.+8%2C+proved+first+a+priori%2C+because+they+are+elect%2C+then+a+posteriori%2C+because+they+are+justified%29.+The+form+of+justification+is+this+application+of+Christ%E2%80%99s+justice+through+faith%2C+or+that+free+imputation+whereof+we+spoke+%28Rom.+4%2C+Phil.+3%2C+2+Cor.+5%29%2C+where+the+phrase+%E2%80%98in+Him%E2%80%99+notes+two+things%3A+first%2C+our+justice+is+not+inherent+in+us+but+Christ%E2%80%99s%2C+existing+outside+us%2C+yet+ours+by+right+of+donation%3B+second%2C+we+have+Christ%E2%80%99s+justice+as+Christ+has+our+sin%E2%80%94not+subjectively+but+relatively%2C+by+imputation%2C+as+shall+be+said+in+explicating+the+effects.%E2%80%9D%0A%0A%E2%80%94+Sr.+Lucas+Trelcatius%2C+Commonplaces+of+Holy+Theology%2C+%E2%80%9COf+Justification%E2%80%9D%2C+%E2%80%9CPart+Constructive%E2%80%9D%2C+p.+137+in+Trelcatius+Sr.+%26+Jr.%2C+Opuscula+Theologica+Omnia+%28d.+1602%3B+Leiden%3A+Orlers+%26+Maire%2C+1614%29%2C+trans.+AI+at+Confessionally+Reformed+Theology.+Trelctius+Sr.+%281542%E2%80%931602%29+was+a+reformed+theologian+and+professer+at+Leiden%2C+Nethe </figure><figure class="quote" id="q-f6cbf50387" data-kw="Justification">
<blockquote><p>Those whom God effectually calls, he also freely justifies, not by infusing righteousness into them, but by pardoning their sins, and by accounting and accepting their persons as righteous; not for anything wrought in them, or done by them, but for Christ&#x27;s sake alone; not by imputing faith itself, the act of believing, or any other evangelical obedience to them, as their righteousness; but by imputing Christ&#x27;s active obedience unto the whole law, and passive obedience in his death for their whole and sole righteousness by faith, which faith they have not of themselves; it is the gift of God.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8fd989b3de" data-kw="" data-pol="">
<blockquote><p>By contrast, the Reformation asserted that a church, however venerable, can still err. … Even the most simple believer can and may if necessary, Bible in hand, stand up to an entire church, as Luther did to Rome. Only thus the freedom of the Christian, and simultaneously the sovereignty of God, is maintained. There is no higher appeal from Scripture. It is the supreme court of appeal. No power or pronouncement stands above it.</p></blockquote>
<figcaption>— <a href="../authors/herman-bavinck.html">Herman Bavinck</a>, <cite>Reformed Dogmatics</cite>, vol. 1: Prolegomena, ch. 14</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-tradition.html">Rome: Tradition</a><a class="tag" href="../topics/scripture/authority.html">Authority</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5a492649a0" data-kw="" data-pol="">
<blockquote><p>The authority of the Word is derived from the Word itself. The church cannot be the foundation upon which one believes that the Scriptures are the Word of God, for: First, the church derives all its authority from the Word. … Thus, we do not believe the Word to be the Word of God because the church affirms it, but on the contrary, we believe the church to be the true church because the Word validates her as such.</p></blockquote>
<figcaption>— <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a>, <cite>The Christian&#x27;s Reasonable Service</cite>, vol. 1, ch. 2, p. 29</figcaption>

</figure><figure class="quote" id="q-694d9cd5ae" data-kw="" data-pol="">

</figure><figure class="quote" id="q-1219b1eb93" data-kw="" data-pol="">
<blockquote><p>Pedagogically the church is prior to Scripture. But in the logical order Scripture is the sole foundation (principium unicum) of church and theology. In case of conflict between them, the possibility of which can never be denied on a Reformational view, church and confession must yield to Scripture. … Nothing may be put on a level with Scripture. Church, confession, tradition—all must be ordered and adjusted by it and submit themselves to it.</p></blockquote>
<figcaption>— <a href="../authors/herman-bavinck.html">Herman Bavinck</a>, <cite>Reformed Dogmatics</cite>, vol. 1: Prolegomena, ch. 2</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-tradition.html">Rome: Tradition</a><a class="tag" href="../topics/scripture/authority.html">Authority</a></div>

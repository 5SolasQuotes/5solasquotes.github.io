<main class="wrap"><figure class="quote" id="q-c34d11c77b" data-kw="">
<blockquote><p>c. Special grace is irresistible. This does not mean that it is a deterministic force which compels man to believe against his will, but that by changing the heart it makes man perfectly willing to accept Jesus Christ unto salvation and to yield obedience to the will of God. Common grace is resistible, and as a matter of fact is always more or less resisted. Paul shows in Rom. 1 and 2 that neither the Gentiles nor the Jews were living up to the light which they had. Says [W.G.T.] Shedd: “In common grace the call to believe and repent is invariably ineffectual, because man is averse to faith and repentance and in bondage to sin.” [Calvinism Pure &amp; Mixed, p. 99.] It is ineffectual unto salvation because it leaves the heart unchanged. d. Special grace works in a spiritual and re-creative way, renewing the whole nature of man, and thus making man able and willing to accept the offer of salvation in Jesus Christ, and to produce spiritual fruits. Common grace, to the contrary, operates only in a rational and moral way by making man in a general way receptive for the truth, by presenting motives to the will, and by appealing to the natural desires of man. This is equivalent to saying that special (saving) grace is immediate and supernatural, since it is wrought directly in the soul by the immediate energy of the Holy Spirit, while common grace is mediate, since it is the product of the mediate operation of the Holy Spirit through the truth of general or special revelation and by moral persuasion.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e14391fe04" data-kw="">
<blockquote><p>Davenant recognized that if God wills the means of salvation to be procured for the reprobate, then God’s intention to save appears thwarted. Does this not imply that God’s will is ineffectual because of God’s universal desire to save all? Davenant responds to God’s apparent impotence by noting that God oftentimes obtains (and sometimes actually grants) the means to an end wherein the end is never attained. Davenant appeals to the scholastic distinction between providence and predestination employed by Aquinas. (Davenant, De Morte Christi, in DD, 23 (370); Davenant, Sententia de Gallicana controversia, in DD, fol. Ii4v. Cf. Aquinas, [Disputed Questions,] De Veritate, in CT, q. 6 [on Predestination] a. 2 co. [actually art. 3, body]) Providence is a general appointment of a thing toward an end (universaliter ordinationem in finem), whereas predestination represents the outcome or result of an ordering (exitum vel eventum ordinis). Predestination differs from providence in that “not everything that is ordained to an end [as in providence] reaches that end.” (Aquinas, De Veritate, in CT, q. 6 a. 2 co. [actually art. 3, body]) Like providence, then, the evangelical covenant is grounded upon an ordination to an end that does not infallibly obtain. God has ordained that Christ make a universal satisfaction on condition of belief, which condition being not always fulfilled, necessitates that not all are forgiven. This evangelical covenant, which displays the “freedom, mercy, and justice of God,” is made, consonant with God’s general love for mankind, between humanity and God promising the saving benefits of Christ to those who repent and believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On John Davenant &amp; Aquinas | Michael Lynch, John Davenant’s Hypothetical Universalism: a Defense of Catholic &amp; Reformed Orthodoxy (Oxford Univ. Press, 2021), p. 138</span></figcaption>

<blockquote><p>2. They resisted the Holy Ghost striving with them by their own consciences, and would not comply with the convictions and dictates of them. God’s Spirit strove with them as with the old world, but in vain; they resisted Him, took part with their corruptions against their convictions, and rebelled against the light. There is that in our sinful hearts that always resists the Holy Ghost, a flesh that lusts against the Spirit, and wars against his motions; but in the hearts of God’s elect, when the fullness of time comes, this resistance is overcome and overpowered, and after a struggle the throne of Christ is set up in the soul, and every thought that had exalted itself against it is brought into captivity to it, 2 Co. 10:4, 2 Co. 10:5. That grace therefore which effects this change might more fitly be called victorious grace than irresistible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, 7:51, “…ye do always resist the Holy Ghost…”</span></figcaption>

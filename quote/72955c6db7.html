<main class="wrap"><figure class="quote" id="q-72955c6db7" data-kw="">
<blockquote><p>Verse 24, ‘You see therefore, that by works a man is justified, and not by faith only?’ This passage is easily reconciled with those things which Paul seems to argue to the contrary everywhere, if we establish, which is most true, that the apostle James is not dealing here with one single justification, which is accomplished partly by faith, partly by works, but with two distinct ones, of which the former is from faith and from faith only; the latter is from works. For since a twofold accusation is brought against the faithful, one from God, the law and conscience, by which they are held guilty of many sins; the other from the Devil and the wicked, by whom they are falsely accused of hypocrisy, a mercenary spirit, impiety and heinous crimes, a twofold justification is required: One by which, though truly sinners in themselves, they are absolved freely for Christ’s sake from the guilt of their sins, which justification is by faith alone without works. The other, by which, as truly sanctified and regenerated, they are absolved from those false accusations of the Devil and the wicked, which justification is sought from works. James urges that both must be joined, and therefore that man is not justified by faith only, but also by works. That is, it is not sufficient that he be justified by faith from the sins he has committed, but it is further required that he be justified also by works from the sins of which he is falsely accused, and from which he is immune through regeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludovicus-de-dieu.html">Ludovicus de Dieu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions on Romans… to which is added, a Gleaning on the rest of the same Apostle’s, as well as the Catholic Epistles (Leiden: Elzeviers, 1646) de Dieu (1590-1642) was a Dutch reformed minister and a leading orientalist. | on James 2:24</cite>, p. 215</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-664e294b7b" data-kw="">
<blockquote><p>We feel that this inchoate righteousness is indeed a true and living righteousness, a splendid and excellent gift of God, and that the new life in Christ consists in this righteousness, and that all saints are just by this very righteousness also, both before God and before men; and on account of it the saints are also justified by God with a justification of works, that is, they are approved by God, praised and rewarded. However, although this righteousness is true and living, and in its own way also justifying, yet it is not of such a kind, not so true, living, and solid, that any of the saints could be justified by it with the justification of life, much less that it be the righteousness or justification of life itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludovicus-de-dieu.html">Ludovicus de Dieu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions on Romans… to which is added, a Gleaning on the rest of the same Apostle’s, as well as the Catholic Epistles (Leiden: Elzeviers, 1646) de Dieu (1590-1642) was a Dutch reformed minister and a leading orientalist. | on Rom. 8:4, pp. 67-73 | Then on</cite>, p. 313:</span></figcaption>

</figure><figure class="quote" id="q-3b1cfb93cb" data-kw="">
<blockquote><p>Secondly, justification does connote a state and established condition of a man, and therefore is not frequently iterated, although it be continued. A man is not justified many times in a day, though sins be pardoned often in a day. It is true, God does continue to justify those that believe in Him, and if He should cease to do so, they would immediately fall into misery and guilt; but yet God does not renew or revive our justification, as if there were an interruption or intermission of it. That justification does denote an estate is plain by comparing it with all the other privileges God vouchsafes his people: regeneration and vocation denote a state the person is put into, so does glorification. As therefore sanctification is one thing, and those auxiliary actings of God’s grace are another thing, so that though we may say such a man has new quickening grace every day, yet we cannot say he has a new regeneration; so it is here: though we may say that every day the believer, begging the pardon of his daily infirmities, has a new pardon, yet he has not a new justification, because this denominates the state of a man. Neither can it be said that pardon of this sin or that sin puts a man into the state of God’s favor absolutely, but quoad hoc [so far as this]; the pardon of this or that sin does not make that universal righteousness of the person whereby he stands acquitted from all. It is true, some learned men call this daily remission of sin justificatio particularis [a particular justification]; but we are now treating of that universal justification whereby the person of a believer stands acquitted and disobliged from the guilt of all his sins he has committed. And great is the comfort of a Christian in that his justification is a state of favor with God; for hence flow many other inestimable benefits and advantages, which the believer is to study out and improve.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification… (London: Underhill, 1654), pt. 2, | sermon 27, ‘That the whole nature of justification is not comprehended in remission and forgiveness of sin’</cite>, p. 268</span></figcaption>

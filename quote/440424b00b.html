<main class="wrap"><figure class="quote" id="q-440424b00b" data-kw="">
<blockquote><p>Of works

NO manner of works make us righteous we believe that a man shall be justified without works. No man is justified by the deeds of the law, but by the faith of Jesus Christ, and we believe in Jesus Christ that we may be justified by the faith of Christ &amp; not by the deeds of the law. If righteousness came by the law then died Christ in vain. That no man is justified by the law it is manifest, for a righteous man liveth by his faith, but the law is not of faith. Moreover, sith Christ the maker of heaven and earth &amp; all that is therein, behoved to die for us, we are compelled to grant that we were so far drowned &amp; sunk in sin that neither our deeds nor all the treasures that ever God made or might make, might have holp us out of them, ergo no deeds nor works may make us righteous.

No works make us unrighteous

For if any works made us unrighteous, then the contrary works should make us righteous. But it is proved that no works can make us righteous, ergo no works make us unrighteous.

¶ works make us neither good nor evil

It is proved that no works neither make us righteous nor unrighteous, ergo no works make us neither good nor evil. For righteous &amp; good are one thing &amp; unrighteous &amp; evil likewise one God works make not a good man nor evil works an evil man, but a good man maketh God works &amp; an evil man evil works.

Good fruit maketh not the tree good, nor evil fruit the evil tree, but a good tree beareth good fruit &amp; an evil tree evil fruit. A good man cannot do evil works nor an evil man good works, for a good tree cannot bear evil fruit nor an evil tree good fruit. A man is good ere he do good works, &amp; evil ere he do evil works, for the tree is good ere it bear good fruit &amp; evil ere it bear evil fruit

¶ Every man is either good or evil.

Every tree is either good or evil, either make ye the tree good &amp; the fruit good also, or else make the tree evil &amp; the fruit of it likewise evil. Every man’s works are either good or evil. For all fruit trees are either good or evil. Either make ye the tree good &amp; the fruit god also, or else make the tree evil &amp; the fruit of it likewise evil. A good man is known by his works for a good man doth good works &amp; an evil works ye shall know them by their fruit, for a good tree beareth good fruit, and an evil tree evil fruit. A man is likened to the tree and his works to the fruit of the tree. Beware of the false prophets which come to you in sheep’s clothing, but inwardly they are ravening wolves, ye shall know them by their fruits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-hamilton.html">Patrick Hamilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Patrick’s Places</cite>, trans. John Frith (Antwerp: S. Cock, [1531]), unpaginated.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b25d102dd9" data-kw="">
<blockquote><p>If we do not commit the sins which daily and hourly, either in deed, word, or thoughts, we do commit: yet in the good things which we do, how many defects are there intermingled? God in that which is done, respecteth the mind &amp; intention of the doer. Cut of then all these things wherein we have regarded our own glory, those things which men do to please men, and to satisfy our own liking, those things which we do by any respect, not sincerely, &amp; purely for the love of God: and a small score will serve for the number of our righteous deeds.

Let the holiest and best thing we do, be considered: we are never better affected unto God, then when we pray; yet when we pray, how are our affections many times distracted? How little reverence do we shew unto the grand majesty of God unto whom we speak? How little remorse of our own miseries? How little taste of the sweet influence of his tender mercies do we feel? Are we not as unwilling many times to begin, and as glad to make an end; as if in saying, call upon me, he had set us a very burdensome task? It may seem somewhat extreme which I will speak: therefore let every one judge of it, even as his own heart shall tell him, and no otherwise …</p></blockquote>

</figure><figure class="quote" id="q-f773a7b874" data-kw="">
<blockquote><p>Since we have been delivered from our misery by grace alone through Christ, without any merit of our own, why must we yet do good works? Because Christ, having redeemed us by his blood, also renews us by his Holy Spirit to be his image, so that with our whole life we may show ourselves thankful to God for his benefits, and he may be praised by us. Further, that we ourselves may be assured of our faith by its fruits, and that by our godly walk of life we may win our neighbours for Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Catechism</cite>, Q&amp;A 86</span></figcaption>

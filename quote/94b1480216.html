<main class="wrap"><figure class="quote" id="q-94b1480216" data-kw="">
<blockquote><p>A sentiment that it matters not what a man believes, so that he is sincere, is as unscriptural as it is absurd. Sincerity of belief has no more effect in warding off evil in the spiritual, than in the natural kingdom.

If the teachings and persuasions of a reputed chemist should prevail on you “to believe” that arsenic is harmless, would it therefore be harmless? Could you mix it with your bread, and you or your children eat it without injury to health and life? Oh, no!

Neither will the sincerity of your belief save you from the consequence of error in religious faith. Right belief, truth, God’s truth, my brethren, is the only foundation on which you can safely rest your hopes. But true belief is not a mere act of the understanding, it involves exercises of the heart; the emotions are purified, and love pervades the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-norris-kirk.html">Edward Norris Kirk</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Prevalent Mistake in Christian Miscellany</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-026632dec8" data-kw="">
<blockquote><p>Have due respect to every truth which God has revealed in his word. — Divine truths are one consistent whole; none of which can be spared without disfiguring the beauty and symmetry of the whole system, and injuring our own souls and the souls of others, by withholding from them a truth which they need for their spiritual improvement and comfort.

It is a great mistake to suppose one part of the Bible to be legal, and another evangelical, as if the divine oracles contradicted themselves, — far from it; they make one complete, united, and consistent system. Every truth beautifully fills its own place. Transpose it, and it becomes useless, yea, a pernicious error. Omit it, and a vacancy is left which nothing else can supply.

If divine truths seem to us to militate against each other, the fault is in the medium through which we view them; and because we view them through a false medium, they appear contradictions to us, but are not so in themselves. We, as sinners, want them all; they were intended for our relief as such: and united together as a complete whole, they are a suitable and adequate remedy for all our miseries.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-charles.html">Thomas Charles</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preface to the Rev. Mr. Oliver s Hymn Book’ in Edward Morgan (ed.), Essays, Letters, and Interesting Papers of the Late Rev. Thomas Charles, A.B. Bala, Merionethshire</cite></span></figcaption>

<blockquote><p>But true love is when we love Christ for his loveliness, namely, that infinite and superlative beauty which shines in Him, as Augustine says, ‘We love Jesus on account of Jesus’; that is, as a man loves sweet wine for itself.​</p></blockquote>

</figure><figure class="quote" id="q-f0d502f708" data-kw="">
<blockquote><p>Is it of no importance whether the Son of God actually came in the flesh? Is it of no importance whether he actually died on the tree for our sins? Whether he actually rose again for our justification? Whether he actually ascended to heaven and sits there on his throne, the Lord of the world? Beautiful dreams these! But if only beautiful dreams! How dreadful to have only an imaginary Saviour and an imaginary salvation. But this is precisely what we must come to on the principle that it is the ideal, not the real that counts in the religious life.

It makes no difference what actually happened so only prophets and sages and apostles have risen to these great conceptions – if the independence of the ideal on the real is the most important lesson of religious thinking – why, then, we must be prepared to satisfy ourselves with a Christianity innocent of a real Redeemer and a real Redemption. Are we content to be saved from sin only an idea – to “go to heaven” only in imagination?

And this leads us to a right estimate of the assertion that is now so constantly made all about us, that Christianity has nothing to fear from the criticism which is evaporating (to its own satisfaction) the historicity of the Bible narratives. That depends on what Christianity is. If it is a religion that is founded on the actual – if it is a religion of fact – if it has any historical content – it is evaporated with its history. If it is a religion of “ideas,” it is of course unaffected by the destruction of any history that may have become accidentally associated with it.

But in that case, it is not Christianity in any intelligible sense; it is nothing but a natural religion – a religion of “eternal verities” – as inoperative as all the rest of its fellows actually to save, though it may be infinitely superior to its fellows in the loftiness of its conceptions. A God who is only an idea, and who never intervenes in the world of fact, can never actually save a soul that is read from sin that is real.

For the actual salvation of an actual sin-stricken soul we require an actual Redeemer who has actually intervened in the actual course of history. … Christianity is a historical religion, all of whose doctrines are facts. He who assaults the trustworthiness of the record of the intervention of God for the redemption of the world, is simply assaulting the heart of Christianity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>How to get rid of Christianity (1900) in Selected Shorter Writings of Benjamin B. Warfield</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

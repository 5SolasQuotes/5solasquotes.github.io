<blockquote><p>For this reason the Jews persecuted Jesus, and sought to kill Him, because He had done these things on the Sabbath. But Jesus answered them, “My Father has been working until now, and I have been working.” (John 5:17-18)

It has often been argued that John Calvin denied the abiding validity of the Sabbath. Some readers of Calvin appeal to passages in his Institutes, where he appeared to say that the Sabbath has been abrogated. Others appeal to his sermons, where he appears to say that it remains binding. His comments on the above passage help us to resolve this paradox:

My Father worketh hitherto. We must see what kind of defense Christ employs. He does not reply that the Law about keeping the Sabbath was temporary, and that it ought now to be abolished; but, on the contrary, maintains that he has not violated the Law, because this is a divine work. It is true that the ceremony of the Sabbath was a part of the shadows of the Law, and that Christ put an end to it by his coming, as Paul shows, (Colossians 2:16;) but the present question does not turn on that point. For it is only from their own works that men are commanded to abstain; and, accordingly, circumcision — which is a work of God, and not of men — is not at variance with the Sabbath.

What Christ insists upon is this, that the holy rest which was enjoined by the Law of Moses is not disturbed when we are employed in works of God. And for this reason he excuses not only his own action, but also the action of the man who carried his bed; for it was an appendage, and — as we might say — a part of the miracle, for it was nothing else than an approbation of it. Besides, if thanksgiving and the publication of the divine glory be reckoned among the works of God, it was not a profanation of the Sabbath to testify the grace of God by feet and hands. But it is chiefly concerning himself that Christ speaks, to whom the Jews were more hostile. He declares that the soundness of body which he has restored to the diseased man is a demonstration of his divine power. He asserts that he is the Son of God, and that he acts in the same manner as his Father.

What is the use of the Sabbath, and for what reasons it was enjoined, I do not now argue at greater length. It is enough for the present passage, that the keeping of the Sabbath is so far from interrupting or hindering the works of God, that, on the contrary, it gives way to them alone. For why does the Law enjoin men to abstain from their own works, but in order to keep all their senses free and occupied for considering the works of God? Consequently, he who does not, on the Sabbath, allow a free course and reign to the works of God, is not only a false expounder of the Law, but wickedly overturns it.

If it be objected, that the example of God is held out to men, that they may rest on the seventh day, the answer is easy. Men are not conformed to God in this respect, that He ceased to work, but by abstaining from the troublesome actions of this world and aspiring to the heavenly rest. The Sabbath or rest of God, therefore, is not idleness, but true perfection, which brings along with it a calm state of peace.

Nor is this inconsistent with what Moses says, that God put an end to his works, (Genesis 2:2;) for he means that, after having completed the formation of the world, God consecrated that day, that men might employ it in meditating on his works. Yet He did not cease to sustain by this power the world which he had made, to govern it by his wisdom, to support it by his goodness, and to regulate all things according to his pleasure, both in heaven and on earth. In six days, therefore, the creation of the world was completed, but the administration of it is still continued, and God incessantly worketh in maintaining and preserving the order of it; as Paul informs us, that in him we live, and move, and are, (Acts 17:28;) and David informs us, that all things stand so long as the Spirit of God upholds them, and that they fail as soon as he withdraws his support, (Psalm 104:29.) Nor is it only by a general Providence that the Lord maintains the world which He has created, but He arranges and regulates every part of it, and more especially, by his protection, he keeps and guards believers whom he has received under his care and guardianship.</p></blockquote>

<blockquote><p>This gospel holiness respects Jesus Christ as its pattern. It proposeth no lower pattern for imitation, then to be conform to his image; he that is begotten again unto a lively hope, by the resurrection of Christ from the dead, girds up the loins of his mind (which are the affections of his soul, lest by falling flat upon the earth he be hindered in running the race set before him, as looking to the forerunner his pattern) in this girdle of hope, that he may be holy in all manner of conversation, keeping his eye upon the precept and pattern, that his practice may be conform[ed].

It is written, saith he, Be ye holy for I am holy, the hope of seeing God, and being ever with him imposeth a necessity upon him who hath it, to look no lower, then at him, who is glorious in holiness; and therefore he is said to purify himself, even as he is pure; and knowing that this is the end of their being quickened together with Christ, that they may walk even as he walked; they, in their working and walking, aim at no less then to be like him; and therefore never sit down upon any attained measure, as if they were already perfect: the spotless purity of God expressed in his laws, is that whereto they study assimilation; therefore they are still in motion towards this mark, and are changed from one degree of glorious grace into another, into the same image, even as by the Spirit of the Lord, who never gives over his putting them to cleanse from all filthiness of the flesh and of the Spirit, till that be true in the truest sense, thou art all fair, my love, there is no spot in thee.

And knowing that perfect fruition of him cannot be without perfect conformity to him, herein do they exercise themselves, to grow in grace, and to be still advancing towards some more likeness to his image, forgetting all their attainments, as things that are behind, and by their reachings forth unto that which is before, make it evident, that they make every begun degree of grace and conformity to God, a prevenient capacity for a new degree, which yet they have not attained.

I know, our moralists look upon themselves as matchless, in talking of following his steps, as he hath left us an example: in this they make a flourish with flaunting effrontery, but for all their boasting of wisdom, such a poor simple man as I, am made to wonder at their folly, who proposing, as they say, the purity of Christ for their pattern, are not even thence convinced, that in order to a conformity thereto, there is a simple &amp; absolute necessity of the mighty operations of that Spirit of God, whereby this end can be reached; but while they flout at the Spirit’s working, as a melancholy fancy, whereby the soul is garnished with the beauty of holiness, and made an habitation for God, I doubt not to say of these great sayers, that they understand neither what they say, nor whereof they affirm: nay doth not their talking of the one, not only without seeing the necessity of the other, but speaking against it, say in the heart of every one, (who hath not the heart of a beast) that they have never yet got a sight of the holiness of that pattern, nor of their own pollutions and impotency; for if they had, they would give themselves up to Jesus Christ to be washed by him, without which they can have no part with him.

O there will be a vast difference, at the latter day, betwixt them who have given their black souls to Jesus Christ to bleach, when he shall present them without spot, not only clothed with wrought gold, but all glorious within, and these who have never dipped, yea who have despised to dip their defiled souls in any other fountain, save in the impure puddle of their own performances: this will make them loathsome in his sight, and cause his soul abhor those, who have done this despite unto the Spirit of grace, as to slight that blessed fountain, opened for sin &amp; for uncleanness, let them pretend as high as they will, to look to him, as a pattern, while (because the plague sore is got up in their eye) they look not to him as a price, not to the grace of Jesus Christ, as that which can only principle any acceptable performance of duty, he will plunge them in the ditch, and it Will cost them their souls, for rejecting the counsel of God against themselves, in not making use of him who came by water, as well as by blood.</p></blockquote>

— Robert MacWard, Letter to John Brown of Wamphray, Christ, the way, and the truth, and the life. Or, A short discourse pointing forth the way of making use of Christ for justification and especially and more particularly for sanctification in all its parts, from Johan. XIV: vers. VI. Wherein several cases of conscie">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+gospel+holiness+respects+Jesus+Christ+as+its+pattern.+It+proposeth+no+lower+pattern+for+imitation%2C+then+to+be+conform+to+his+image%3B+he+that+is+begotten+again+unto+a+lively+hope%2C+by+the+resurrection+of+Christ+from+the+dead%2C+girds+up+the+loins+of+his+mind+%28which+are+the+affections+of+his+soul%2C+lest+by+falling+flat+upon+the+earth+he+be+hindered+in+running+the+race+set+before+him%2C+as+looking+to+the+forerunner+his+pattern%29+in+this+girdle+of+hope%2C+that+he+may+be+holy+in+all+manner+of+conversation%2C+keeping+his+eye+upon+the+precept+and+pattern%2C+that+his+practice+may+be+conform%5Bed%5D.%0A%0AIt+is+written%2C+saith+he%2C+Be+ye+holy+for+I+am+holy%2C+the+hope+of+seeing+God%2C+and+being+ever+with+him+imposeth+a+necessity+upon+him+who+hath+it%2C+to+look+no+lower%2C+then+at+him%2C+who+is+glorious+in+holiness%3B+and+therefore+he+is+said+to+purify+himself%2C+even+as+he+is+pure%3B+and+knowing+that+this+is+the+end+of+their+being+quickened+together+with+Christ%2C+that+they+may+walk+even+as+he+walked%3B+they%2C+in+their+working+and+walking%2C+aim+at+no+less+then+to+be+like+him%3B+and+therefore+never+sit+down+upon+any+attained+measure%2C+as+if+they+were+already+perfect%3A+the+spotless+purity+of+God+expressed+in+his+laws%2C+is+that+whereto+they+study+assimilation%3B+therefore+they+are+still+in+motion+towards+this+mark%2C+and+are+changed+from+one+degree+of+glorious+grace+into+another%2C+into+the+same+image%2C+even+as+by+the+Spirit+of+the+Lord%2C+who+never+gives+over+his+putting+them+to+cleanse+from+all+filthiness+of+the+flesh+and+of+the+Spirit%2C+till+that+be+true+in+the+truest+sense%2C+thou+art+all+fair%2C+my+love%2C+there+is+no+spot+in+thee.%0A%0AAnd+knowing+that+perfect+fruition+of+him+cannot+be+without+perfect+conformity+to+him%2C+herein+do+they+exercise+themselves%2C+to+grow+in+grace%2C+and+to+be+still+advancing+towards+some+more+likeness+to+his+image%2C+forgetting+all+their+attainments%2C+as+things+that+are+behind%2C+and+by+their+reachings+forth+unto+that+which+is+before%2C+make+it+evident%2C+that+they+make+every+begun+degree+of+grace+and+conformity+to+God%2C+a+prevenient+capacity+for+a+new+degree%2C+which+yet+they+have+not+attained.%0A%0AI+know%2C+our+moralists+look+upon+themselves+as+matchless%2C+in+talking+of+following+his+steps%2C+as+he+hath+left+us+an+example%3A+in+this+they+make+a+flourish+with+flaunting+effrontery%2C+but+for+all+their+boasting+of+wisdom%2C+such+a+poor+simple+man+as+I%2C+am+made+to+wonder+at+their+folly%2C+who+proposing%2C+as+they+say%2C+the+purity+of+Christ+for+their+pattern%2C+are+not+even+thence+convinced%2C+that+in+order+to+a+conformity+thereto%2C+there+is+a+simple+%26+absolute+necessity+of+the+mighty+operations+of+that+Spirit+of+God%2C+whereby+this+end+can+be+reached%3B+but+while+they+flout+at+the+Spirit%E2%80%99s+working%2C+as+a+melancholy+fancy%2C+whereby+the+soul+is+garnished+with+the+beauty+of+holiness%2C+and+made+an+habitation+for+God%2C+I+doubt+not+to+say+of+these+great+sayers%2C+that+they+understand+neither+what+they+say%2C+nor+whereof+they+affirm%3A+nay+doth+not+their+talking+of+the+one%2C+not+only+without+seeing+the+necessity+of+the+other%2C+but+speaking+against+it%2C+say+in+the+heart+of+every+one%2C+%28who+hath+not+the+heart+of+a+beast%29+that+they+have+never+yet+got+a+sight+of+the+holiness+of+that+pattern%2C+nor+of+their+own+pollutions+and+impotency%3B+for+if+they+had%2C+they+would+give+themselves+up+to+Jesus+Christ+to+be+washed+by+him%2C+without+which+they+can+have+no+part+with+him.%0A%0AO+there+will+be+a+vast+difference%2C+at+the+latter+day%2C+betwixt+them+who+have+given+their+black+souls+to+Jesus+Christ+to+bleach%2C+when+he+shall+present+them+without+spot%2C+not+only+clothed+with+wrought+gold%2C+but+all+glorious+within%2C+and+these+who+have+never+dipped%2C+yea+who+have+despised+to+dip+their+defiled+souls+in+any+other+fountain%2C+save+in+the+impure+puddle+of+their+own+performances%3A+this+will+make+them+loathsome+in+his+sight%2C+and+cause+his+soul+abhor+those%2C+who+have+done+this+despite+unto+the+Spirit+of+grace%2C+as+to+slight+that+blessed+fountain%2C+opened+for+sin+%26+for+uncleanness%2C+let+them+pretend+as+high+as+they+will%2C+to+look+to+him%2C+as+a+pattern%2C+while+%28because+the+plague+sore+is+got+up+in+their+eye%29+they+look+not+to+him+as+a+price%2C+not+to+the+grace+of+Jesus+Christ%2C+as+that+which+can+only+principle+any+acceptable+performance+of+duty%2C+he+will+plunge+them+in+the+ditch%2C+and+it+Will+cost+them+their+souls%2C+for+rejecting+the+counsel+of+God+against+themselves%2C+in+not+making+use+of+him+who+came+by+water%2C+as+well+as+by+blood.%E2%80%9D%0A%0A%E2%80%94+Robert+MacWard%2C+Letter+to+John+Brown+of+Wamphray%2C+Christ%2C+the+way%2C+and+the+truth%2C+and+the+life.+Or%2C+A+short+discourse+pointing+forth+the+way+of+making+use+of+Christ+for+justification+and+especially+and+more+particularly+for+sanctification+in+all+its+parts%2C+from+Johan.+XIV%3A+vers.+VI.+Wherein+several+cases+of+conscie&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0dc7cc87b1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0dc7cc87b1.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/11/11/robert-mcward-on-christ-as-the-pattern-for-gospel-holiness/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>…The reader will see that I only declared my dislike of organs in our churches, and therein I think I have better authority than those that are of another mind, forasmuch as in the Homily of the Place and time of Prayer (a book established and enjoined by the laws of the land) p. 131, they bring in some superstitious persons, complaining that they could not “hear the like piping, singing, chanting and playing upon the organs, that they could before”: To this is immediately answered thus; “But (dearly beloved) we ought greatly to rejoice and to give thanks to God, that our Churches are delivered out of those things which displeased God so sore, and filthily defiled his holy House”…</p></blockquote>

<blockquote><p>Q. What is the main scope of the First Commandment, ‘Thou shalt have no other Gods before Me?’ A. Here is required all that natural worship of God, whether the same be inward or outward, which is such as if there were no Law prescribed, yet if we well know his nature, we would undoubtedly perform it to Him. Q. Name some principal duties that are here required, with the contrary vices forbidden? A. Here is required faith in God, love to his Majesty, and hope in Him, hearing his voice, calling upon Him by prayer, and such like. … Q What is the main scope of the Second Commandment? A. The Second Commandement enjoyns all that worship of God which is by divine institution and ordinance, Mt. 28:20; Dt. 12:32. Q What are some of the particulars? A. The public and solemn preaching and hearing of his word, and prayer, celebration of sacraments, Church fellowship, election and ordaining of ministers and their whole ministration, with the due observation of Church discipline. … Q. What is the sum of the Third Commandement? A. The things here required are the due manner of observing and using all things that pertain to the natural or instituted worship of God, and all that name of God whereby He makes Himself known unto his people?</p></blockquote>

<blockquote><p>Saying AMEN, audibly to all. Neh. 8. 6. […]

As for an audible pronouncing of Amen, if the mind of them that pronounce it, have been upon that which the Minister uttered, and their heart have given consent thereto, it compriseth altogether as much as the Minister hath uttered. This is the only warranteable means for people to utter their mind in a Congregation. It must therefore be uttered by every one, altogether, so loud, as well as they hear what he hath uttered in their name. For the one is as requisite as the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s Sanctification</cite>, (London, 1641), p. 5.</span></figcaption>

<blockquote><p>3. And they shall put off their clothes. 4. And they shall baptize the little children first. And if they can answer for themselves, let them answer. But if they cannot, let their parents or someone from their family answer for them. 5. And next they shall baptize the grown men; and last the women….</p></blockquote>

<blockquote><p>Controversy 3 – Can the sacraments, especially baptism, be administered by anyone, including women? We deny against the Papists, Socinians, Arminians, and Anabaptists. Arguments: 1. Christ gave the power of administering the sacraments only to the apostles and ministers of the Church (Mt. 28:19). 2. And these alone are stewards and dispensers of the mysteries of God (1 Cor. 4:1). 3. The administration of the sacraments is joined with the preaching of the Word; thus, whoever cannot do one, cannot do the other 4. Calling is required (Jn. 1:33, 1 Cor. 1:17). 5. It is forbidden for women to speak in the Church or to do any ecclesiastical duty (1 Cor. 14:34-35). Objections 1. Zippora circumcised her son (Ex. 4:25). Reply: Their relation to circumcision is one thing and their relation to baptism another, and the fact that it was done by a woman is not approved. 2. Philip the deacon baptized (Acts 8:38). Reply: First, he was a deacon. Later, he was an evangelist (Acts 21:8). 3. So did Ananias (Acts 9:18). Reply: He had a special command (v. 10), nor is there proof that he was not a minister.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-rijssen.html">Leonard Rijssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 17, ‘The Sacraments’, pp. 224-5 in Wesley White, A Translation with Introduction to A Summary of Elenctic Theology by Leonard Rijssen a Masters thesis (GPTS, 2009)</span></figcaption>

%93%20Can%20the%20sacraments,that%20he%20was%20not%20a%20minister&amp;text=Controversy%203%20%E2%80%93%20Can%20the%20sacraments%2C%20especially%20baptism&amp;text=there%20proof%20that%20he%20was%20not%20a%20minister" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6a7a05c505" data-kw="">
<blockquote><p>The most probable explanation [of 1 Cor. 15:29] is, that the apostle here refers to the Levitical rule of Numbers 19:14-19. Were there no resurrection, a corpse would be like any other clod; and there would be no reason for treating it as a symbol of moral defilement, or for bestowing on it so religiously the rites of sepulture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, p. 760</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-ab803be0d5" data-kw="">
<blockquote><p>Others, like the sacramentarians, (those are justly called sacramentarians, who attribute to the sacraments what they do not contain, and by high-sounding but false and made-up promises, lead men away from simple trust in the one God to belief in the power of symbols. Therefore if any one hereafter finds “sacramentarians” in my writings, I want him to understand that class of men who attribute to symbols what belongs only to Divine Power and to the Holy Spirit, personally working in our souls, which symbols and the external word only proclaim and represent), the sacramentarians, I say, either not understanding or not wishing to understand the usage and meaning of our Lord’s words, twist this language so far as to venture to assert that the things themselves are really and materially conveyed by the sacraments by virtue of the words joined with the elements, and they defend their error by saying, “Faith is of things invisible.” “You do not see grace in baptism,” they say, “but it is certainly conveyed by virtue of the words, as soon as the clergyman has said, ‘I baptize thee in the name of the Father and of the Son and of the Holy Ghost.’ ” When you demand proof this proposition, they say: “Faith is of things invisible.” They fail to notice that baptism is not given to any one unless he first confesses that he has faith, if he is a grown person, or unless he has the promise in virtue of which he is counted a member of the Church, if he is a child. Thus this thing which the sacramentarians maintain is conveyed invisibly by the sacrament was actually conveyed before. For he who confesses faith had it before he confessed it and, therefore, before he was baptized. For confession precedes immersion. Thus the faith which was given by the light and gift of the Spirit was there before the candidate was admitted to the sacrament, or if he did not have faith, it is certainly not brought to him by baptism. For neither Judas nor Simon the sorcerer, who were without faith when they were baptized, received faith by baptism. But if an infant is to be baptized, since he cannot himself confess faith, he must have the promise which counts him within the Church. The promise is, that the Gentiles, when they have obtained the knowledge of God, and true religion, shall be just as much of the church and people of God as the Hebrews. This all the prophets heralded and Christ Himself most plainly promises. “They shall come from the east and from the west, and shall recline with the God of Abraham and Isaac and Jacob.”* And “The last shall be first,” and “The vineyard shall be given to other husbandmen,” and “There shall be one shepherd and one fold.” Since, therefore, the children of the Hebrews have always been counted with the Church with their parents, and the divine promise is sure, it is clear that the children of Christians belong to the Church of Christ just as much as their parents. This promise is not conveyed in baptism, but he to whom it has been previously given is baptized, that by a visible sign he may bear witness that he is of the number of those who through the goodness of God are called the people of God. Here surely nothing new is brought in, but that which has been previously given is recognized by a religious rite, and the name is given when the symbol and pledge have been received.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/huldrych-zwingli.html">Huldrych Zwingli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Latin Works of Huldreich Zwingli</cite>, ed. William John Hinke (Philadelphia: Heidelberg Press, 1922), 2.194–95.</span></figcaption>

fessed+it+and%2C+therefore%2C+before+he+was+baptized.+For+confession+precedes+immersion.+Thus+the+faith+which+was+given+by+the+light+and+gift+of+the+Spirit+was+there+before+the+candidate+was+admitted+to+the+sacrament%2C+or+if+he+did+not+have+faith%2C+it+is+certainly+not+brought+to+him+by+baptism.+For+neither+Judas+nor+Simon+the+sorcerer%2C+who+were+without+faith+when+they+were+baptized%2C+received+faith+by+baptism.+But+if+an+infant+is+to+be+baptized%2C+since+he+cannot+himself+confess+faith%2C+he+must+have+the+promise+which+counts+him+within+the+Church.+The+promise+is%2C+that+the+Gentiles%2C+when+they+have+obtained+the+knowledge+of+God%2C+and+true+religion%2C+shall+be+just+as+much+of+the+church+and+people+of+God+as+the+Hebrews.+This+all+the+prophets+heralded+and+Christ+Himself+most+plainly+promises.+%E2%80%9CThey+shall+come+from+the+east+and+from+the+west%2C+and+shall+recline+with+the+God+of+Abraham+and+Isaac+and+Jacob.%E2%80%9D%2A+And+%E2%80%9CThe+last+shall+be+first%2C%E2%80%9D+and+%E2%80%9CThe+vineyard+shall+be+given+to+other+husbandmen%2C%E2%80%9D+and+%E2%80%9CThere+shall+be+one+shepherd+and+one+fold.%E2%80%9D+Since%2C+therefore%2C+the+children+of+the+Hebrews+have+always+been+counted+with+the+Church+with+their+parents%2C+and+the+divine+promise+is+sure%2C+it+is+clear+that+the+children+of+Christians+belong+to+the+Church+of+Christ+just+as+much+as+their+parents.+This+promise+is+not+conveyed+in+baptism%2C+but+he+to+whom+it+has+been+previously+given+is+baptized%2C+that+by+a+visible+sign+he+may+bear+witness+that+he+is+of+the+number+of+those+who+through+the+goodness+of+God+are+called+the+people+of+God.+Here+surely+nothing+new+is+brought+in%2C+but+that+which+has+been+previously+given+is+recognized+by+a+religious+rite%2C+and+the+name+is+given+when+the+symbol+and+pledge+have+been+received.%E2%80%9D%0A%0A%E2%80%94+Huldrych+Zwingli%2C+The+Latin+Works+of+Huldreich+Zwingli%2C+ed.+William+John+Hinke+%28Philadelphia%3A+Heidelberg+Press%2C+1922%29%2C+2.194%E2%80%9395.&amp;url=http </figure><figure class="quote" id="q-99709e246d" data-kw="">
<blockquote><p>Hence baptism is a seal of our incorporation in Christ’s visible Church;” Rutherrford cites 1 Cor. 12:13; Acts 2:41; Mt. 28:19; Acts 8:38; 10:47; 16:15,23. His 4 considerations are: 1. Baptism is not that whereby we are entered into Christ’s mystical and invisible body as such, for it is presupposed we be members of Christ’s body, and our sins pardoned already, before baptism come to be a seal of sins pardoned; but baptism is a seal of our entry in Christ’s visible body, as swearing to the colors is that which enters a soldier to be a member of such an army, whereas before his oath, he was only a heart friend to the army and cause. 2. Baptism as it is such is a seal, and a seal as a seal adds no new lands or goods to the man to whom the charter and seal is given, but only does legally confirm him in the right of such lands given to the man by the prince or state; yet this hinders not but baptism is a real, legal seal, legally confirming the man in his actual and visible profession of Christ, remission of sins, regeneration, so as though before baptism he was a member of Christ’s body, yet quoad nos [as far as us], he is not a member of Christ’s body visible until he be made such by baptism. 3. On the controversy anent the efficiency, working and operation of the Sacraments</p></blockquote>

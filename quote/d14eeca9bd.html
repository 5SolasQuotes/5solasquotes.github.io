<main class="wrap"><figure class="quote" id="q-d14eeca9bd" data-kw="">
<blockquote><p>Now that a man who adores before the painted or graven image of Christ, though he profess that he intends his whole adoration to Christ, and that he places the image before him only to represent Christ, and to stir up his mind to worship Christ, does nevertheless commit idolatry, I trust none of our Opposites will deny.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<blockquote><p>It is not lawful to have pictures of Jesus Christ, because his divine nature cannot be pictured at all, and because his body, as it is now glorified, cannot be pictured as it is; and because, if it do not stir up devotion, it is in vain; if it do stir up devotion, it is a worshipping by an image or picture, and so a palpable breach of the Second Commandment.</p></blockquote>

</figure><figure class="quote" id="q-780b169739" data-kw="">
<blockquote><p>It is the Lord, particularly Jesus Christ, who gave this law in the name of the Trinity. This is plain from the Scripture, Acts 7:38; Heb. 12:24-26. It was He that brought the people out of Egypt, and that appeared in the bush that burned with fire, and yet was not consumed, giving commission to Moses for their deliverance, Ex. 3:2-8.</p></blockquote>

</figure><figure class="quote" id="q-33147b1c16" data-kw="">
<blockquote><p>The angel of the Lord; not a created angel, but the Angel of the covenant, Christ Jesus, who then and ever was God, and was to be man… And these temporary apparitions of his were presages or forerunners of his more solemn mission and coming… I am the Lord, etc. …By a flame of fire was fitly represented God’s majesty, and purity, and power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on the Bible, on Exodus, ch. 3, verse 2</cite></span></figcaption>

</figure><figure class="quote" id="q-95e9714745" data-kw="">
<blockquote><p>Of the nature of painting that represents the Historie of the Bible There are many things are more clearly set forth in a picture then in a discourse. The fabrick of the Tabernacle, the architecture of the Temple; the dimensions, stories, and divers rooms of Noahs Ark, are more perceptible by us in a painting to the eye, then is the verbal description the Scripture gives us of it. A man verily may behold the situation and length of the Land of Canaan better in a Chorographick Map, then in the History of Josuah: But that which is the more evident and easie, is not neverthelesse the more excellent. These paintings are not divine, as are the words of the Scripture. A visible representation of Solomon’s Temple is meerly a humane figure; but the verball representation of the same Temple exhibited in Scripture terms is a divine work. The picture of a man crucified, is it as divine as the words of the Scripture describing the passion of Christ? or rather, is it comparable to a Sermon, in which Jesus Christ is drawn out before our eyes, and crucified among us? Gal. 3.1. Where is it authorized by God to plant Faith in our hearts? In many narrations a picture verily may serve for an help to the understanding of the Historie: but it can never be either instrument or object of our Faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-d-espagne.html">Jean D’Espagne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>New Observations upon the Decalogue… (London, 1652), 2nd Commandment. D’Espagne (1591-1659) was a French, reformed minister who lived for a significant amount of time in London.</cite>, pp. 51-52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

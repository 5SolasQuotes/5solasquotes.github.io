<main class="wrap"><figure class="quote" id="q-f56d03c37b" data-kw="">
<blockquote><p>With the deepest feeling of affection for the Church of England I cannot avoid the conclusion that in the matter of the laity its system is at present defective and infra-scriptural, and hence this well-meant scheme of Brotherhoods. I cannot reconcile the position of the English lay Episcopalian in 1890 with that of his brother in any apostolic Church eighteen centuries ago. I cannot make the two things square. To my eyes it seems that in the regular working of the Church of England almost everything is left in the hands of the clergy, and hardly anything is assigned to the laity! The clergy settle everything! The clergy manage everything! The clergy arrange everything!

The laity are practically allowed neither voice, nor place, nor opinion, nor power, and must accept whatever the clergy decide for them. In all this there is no intentional slight. Not the smallest reflection is implied on the trustworthiness and ability of the laity. But from one cause or another they are left out in the cold, passive recipients and not active members, in a huge ecclesiastical corporation; sleeping partners and not working agents in an unwieldy and ill-managed concern.

In short, in the normal action of the Church of England, lay Churchmen have been left on a siding. Like soldiers not wanted, they have fallen out of the ranks, retired to the rear, and sunk out of sight. The effect at the present day is that the English laity are far below the position they ought to occupy, and the English clergy are far above theirs. Both parties, in short, are in the wrong place. The clergy have too much to do and the laity too little, and the whole result is that the masses are not reached.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Brotherhoods: An Address given at the Hull Church Congress, 1890 in Charges and Addresses</cite></span></figcaption>

</figure><figure class="quote" id="q-20a88fffc5" data-kw="">
<blockquote><p>Last of all, we are to distinguish between the condition of the primitive churches, before the division of parishes, and the state of our churches now after such division. At the first, when the multitude of Christians in those great cities of Rome, Corinth, Ephesus, etc. was not divided into several parishes, the common presbytery in the city did suffice for the government of the whole [as described in the N.T.], and there was no need of a particular consistory [session] of elders for every assembly and congregation of Christians within the city, except perhaps to admonish, rebuke or exhort, or to take notice of such things as were to be brought into the common presbytery. But after that parishes were divided, and Christian congregations planted in the rural villages, as well as in the cities, from henceforth it was necessary that every congregation should have at hand, within itself, a certain consistory, for some acts of church government, though still those of greater importance were reserved to the greater presbytery… If it be said that I seem to deny the divine right of the same, or that they have any warrant from the pattern of the apostolic Church, I answer: I acknowledge the conformity of the same with the pattern thus far:

1. It is to be suposed that in some small cities (especially the same not being wholly converted to the Christian faith) there was but one Christian congregation, the eldership whereof did manage matters of jurisdiction proper thereto.

2. Even in the great cities, at the first there was but one congregation of Christians, and so but one particular eldership.

3. After that the Gospel had spread, and Christians were multiplied in those great cities, it is true, they were all governed by a common presbytery, but that presbytery was not remote, but ready at hand among themselves. Now in this we keep ourselves as close to the pattern, as the alteration of the Church’s condition by the division of parishes will suffer us, that is to say, we have a common presbytery for governing the congregations within a convenient circuit, but withal our congregations have, ad manum, among themselves, an inferior eldership for lesser acts of government; though in respect of the distance of the seat of the common presbytery from sundry of our parishes, they cannot have that ease and benefit of neareness which the apostolic Churches had, yet by the particular elderships they have as great ease of this kind as conveniently can be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, ... (Edinburgh: 1641), pt. 2, ch. 2, 128-30</span></figcaption>

</figure><figure class="quote" id="q-373000dea1" data-kw="">
<blockquote><p>Hence, then, it is obvious that we do not at all deny that churches remain under his tyranny; churches, however, which by sacrilegious impiety he has profaned, by cruel domination has oppressed, by evil and deadly doctrines like poisoned potions has corrupted and almost slain; churches where Christ lies half-buried, the gospel is suppressed, piety is put to flight, and the worship of God almost abolished; where, in short, all things are in such disorder as to present the appearance of Babylon rather than the holy city of God.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a5ce6c97ff" data-kw="">
<blockquote><p>This one thing is a condemnation of the highly corrupt state of our society today. The Jews feed their poor, despite the fact that they are exiles with no fixed abode. We also hear that the Muslims are extremely generous in giving alms. It is only the Christians who neglect their own, and what happens among them is what happened long ago among the Jews—puffed-up prelates and a mean clique of priests and monks live high off the possessions of the church while the poor go begging when they are the very people whom our forebears wanted to look after by generous giving.

Even in the reformed churches there are very few who do their duty in this respect, so that those who should be supplying the needs of the church rob it, and when they have grown rich of their spoils they become public enemies of the faith, resembling no one so much as Judas Iscariot, who was Christ’s first treasurer. They attract the savage hatred of onlookers, whether they are church members or strangers to the faith. Who would say that people like that are lovers of God? Are these not the times of which were predicted: “Since wickedness will be multiplied, the love of many will grow cold”?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 218.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6fde623784" data-kw="">
<blockquote><p>(1.) It is clear that the specific and essential form of a fundamental article is not taken from the authority of God speaking in the Word (seeing God’s authority is one and the same in all that He speaks), but from the influence that the knowledge of an article has to unite us to God in Christ, and bring us to salvation. (2.) And secondly, it will follow that this, Thou shalt not by the use of things indifferent kill him for whom Christ died, and the like is no less fundamental, by evident consequence, in respect it is spoken by God’s own authority, than articles of our faith. (3.) It follows that formalists ignorantly divide matters of God’s worship, into matters of faith, or points fundamental, and things indifferent, as if many scriptural truths were not to be found in God’s Word, such as the miracles of Moses, and Elias, the journeys of Paul, which are neither matters fundamental, nor yet things indifferent. (4.) Many things may be fundamental, by consequence, to one who can read the Word, and hear it read, which is not by consequence fundamental to a rude and ignorant man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, The Due Right of Presbyteries, … (1644), pt. 2, ch. 4, section 5, p. 221 ff. | 4 Distinctions about Fundamentals</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-5d63c12f3b" data-kw="">
<blockquote><p>My Brethren and I, that have had Occasion here to confer about you, see a Beauty in the Providence of your being in Communion with the English Church; otherwise such great Confluences from among them, had not attended your Ministry, nor consequently received the Benefit, or reaped the Advantage by it, which so many of them have done.

And tho’ infinite Wisdom has made and may yet make this an alluring Bait to draw them forth; yet as England’s Reformation at first (from Popery and its superstitious and ceremonial Services) however great and glorious, was far from being to full as that of some other Protestant Churches, particularly that of Scotland; so we would fain hope, that, when a new and general Reformation shall be set on Foot, some more at least of the Rags of that Romish Church will be dropp’d, such as (abstracting at present from the Subject of Church-Government) many useless Rites and Customs relating to Worship, that have no scriptural Foundation.

This is what some of the most pious and eminent Divines of your Communion, have wished to see reformed, knowing that many of these were retained at first, only under a View of Reforming gradually, and from some prudential Considerations; and knowing also that the continued Retaining of these Things, which the reforming Fathers designed gradually to cast off, has been more stumbling to the Friends, than ever it was gaining to the Enemies of the Reformation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Letter from the Reverend Mr. Ralph Erskine to the Reverend Mr. Geo. Whitefield</cite>, (Philadelphia: B. Franklin, 1741), pp 5-6.</span></figcaption>

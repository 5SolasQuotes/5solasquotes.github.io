<main class="wrap"><figure class="quote" id="q-61173222ae" data-kw="">
<blockquote><p>Q. Doth this consecration change the bread and wine into the body and blood of Christ?

A. No: but they still continue in nature and substance bread and wine still, and are but only types and seals of Christ’s body and blood.

Q. But doth not our Saviour say of the bread, This is my body; and of the wine, This is my blood?

A. Though he do; yet it thence no more followeth, that the bread is his very real body, and the wine his blood, then that he is a material door, or vine, because he saith, I am the door, I am the vine.

Q. How is our Saviour then to be understood?

A. To speak by an usual figure, where the name of the thing signified, is given to the sign. After the same manner that in the old Testament, Circumcision is called the Covenant, and the Lamb, the Passover, because they were signs of those things.

Q. What special reasons have you against the change of these elements into the very body and blood of Christ, commonly called Transubstantiation?

A. First, then at the first institution, there must needs be two Christs, one that giveth, another that is given.

Secondly, If the bread be the very body of Christ, &amp;c. then there is no true and proportionable sign to represent the thing signified, and consequently no Sacrament.

Thirdly, the same individual body must then of necessity be in more places then one at once, which is not only against the nature of a true human body, but of a body in general also.

Fourthly, the Apostles, and Evangelists call it bread and wine after the consecration. 1. Cor. 10. 16. 26. 27. 28. Matth. 26. 29.

Fifthly, if there were any such change, it were the greatest miracle in the world, but all other miracles are such, as have been apparent to sense.

Sixthly, then the wicked as well as the godly, should receive Christ Jesus and his quickening spirit, which is never separated from him. Yea (which is horrible to consider) mice and rats may eat the true body of Christ, and drink his blood.

Q. But it is not likely, that at this time, and in this place, our Saviour would use a figurative speech, and speak obscurely, whereas he might have spoken plainly?

A. First, it is plain, that at the same time he used as figurative a speech as this. Secondly, in this institution also we must of necessity acknowledge, that he useth a figure when he saith, that the cup is the new Testament. Thirdly, there is often more light and plainness in a figure, then in a proper speech.

Q. But what may be noted out of this form of speech?

A. The near and sure conjunction of the sign, with the thing signified, which it hath in them that shall receive it worthily; in so much as they which partake of the one, receive the other also.

Q. Then it seems, that though upon the consecration, the bread and wine be not changed into the real body and blood of Christ, that yet they are present, in, with, or under the bread and wine?

A. Not corporally, substantially, or locally; for then, first, the body of Christ should be every where; which doth as much destroy the nature of a human body, as to be in many places at once. Secondly, then as in transubstantiation, the body and blood of Christ should not be a spiritual food of the soul, but bodily, such as the wicked eat of as well as the godly. Thirdly, then also (as in transubstantiation) Christ should be eaten as the Capernaites fancied, really, &amp; with the body, which our Saviour denieth. Fourthly, it should not then be true, which is said, Act. 3. 21. That the heavens shall contain him, till the time that all things be restored. Fifthly, it is the nature of that faith by which we lay hold on, and receive Christ, to seek him, and behold him, in heaven, and to feed upon him there.</p></blockquote>

<blockquote><p>XXV. Next follow the actions of the disciples, and consequently of the other guests. And these, according to Christ’s appointment, are three: first, to receive both the bread and the cup; but each separately, for so Christ distributed them: in this manner he commanded his people to take them; thus the body of Christ, as broken for us; his blood as poured out of his body, are more distinctly represented; and in fine, as a complete entertainment requires both meat and drink, so this most complete spiritual repast which we have in Christ, is thus most excellently represented. And therefore we cannot so well approve of that custom which prevailed in Cyprian’s time, to give a piece of bread dipt in wine to infants and the sick; which was the practice in some places, about the year of Christ 340, in the public and ordinary celebration of the sacrament. The same judgment we are to pass on the custom of the Greeks, who crumble the consecrated bread into the wine, and take it out with a spoon.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“XXV. Next follow the actions of the disciples, and consequently of the other guests. And these, according to Christ’s appointment, are three: first, to receive both the bread and the cup; but each separately, for so Christ distributed them: in this manner he commanded his people to take them; thus the body of Christ, as broken for us; his blood as poured out of his body, are more distinctly represented; and in fine, as a complete entertainment requires both meat and drink, so this most complete spiritual repast which we have in Christ, is thus most excellently represented. And therefore we cannot so well approve of that custom which prevailed in Cyprian’s time, to give a piece of bread dipt in wine to infants and the sick; which was the practice in some places, about the year of Christ 340, in the public and ordinary celebration of the sacrament. The same judgment we are to pass on the custom of the Greeks, who crumble the consecrated bread into the wine, and take it out with a spoon.”

— Herman Witsius, The Economy of the Covenants between God and Man, trans. William Crookshank, vol. 2 (London: T. Tegg &amp; Son, 1837), 4.17.27 (2.452). HT: Amy Warren.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXV.+Next+follow+the+actions+of+the+disciples%2C+and+consequently+of+the+other+guests.+And+these%2C+according+to+Christ%E2%80%99s+appointment%2C+are+three%3A+first%2C+to+receive+both+the+bread+and+the+cup%3B+but+each+separately%2C+for+so+Christ+distributed+them%3A+in+this+manner+he+commanded+his+people+to+take+them%3B+thus+the+body+of+Christ%2C+as+broken+for+us%3B+his+blood+as+poured+out+of+his+body%2C+are+more+distinctly+represented%3B+and+in+fine%2C+as+a+complete+entertainment+requires+both+meat+and+drink%2C+so+this+most+complete+spiritual+repast+which+we+have+in+Christ%2C+is+thus+most+excellently+represented.+And+therefore+we+cannot+so+well+approve+of+that+custom+which+prevailed+in+Cyprian%E2%80%99s+time%2C+to+give+a+piece+of+bread+dipt+in+wine+to+infants+and+the+sick%3B+which+was+the+practice+in+some+places%2C+about+the+year+of+Christ+340%2C+in+the+public+and+ordinary+celebration+of+the+sacrament.+The+same+judgment+we+are+to+pass+on+the+custom+of+the+Greeks%2C+who+crumble+the+consecrated+bread+into+the+wine%2C+and+take+it+out+with+a+spoon.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+The+Economy+of+the+Covenants+between+God+and+Man%2C+trans.+William+Crookshank%2C+vol.+2+%28London%3A+T.+Tegg+%26+Son%2C+1837%29%2C+4.17.27+%282.452%29.+HT%3A+Amy+Warren.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fde0e31b76d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/de0e31b76d.html">Permalink</a><a class="src" href="https://heidelblog.net/2021/01/herman-witsius-contra-intinction/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-1222ba13fe" data-kw="signs things">
<blockquote><p>Therefore, the end of this whole institution can be threefold. (1) A commemoration of Christ and of his death: “This do in remembrance of me” (Lk. 22:19); “As often as ye eat this bread, and drink this cup, ye do show the Lord’s death till he come” (1 Cor. 11*:26). This commemoration is not only theoretical, but also practical—of things which Christ did and suffered for us, to celebrate with grateful minds the immense love of Christ, who did not refuse to suffer a dreadful death for us and to pour out his blood, as in the old Passover (which was a memorial of deliverance from Egyptian bondage) they celebrated the wonderful blessing received from God. He wished to give the most appropriate symbol of this in the broken bread and the poured-out wine; and not only broken and poured out, but distributed to us that even from this it might be evident that all this was designed and obtained for us and that Christ offered himself as a victim for the expiation of our sins for no other end than that he might afterwards give himself to us for food, upon which we may feed and be supported unto eternal life.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1eac54fbbf" data-kw="">
<blockquote><p>The love of Christ to sinners is the very essence and marrow of the Gospel. That He should love us at all, and care for our souls, — that He should love us before we love Him, or even know anything about Him, — that He should love us so much as to come into the world to save us, take our nature on Him, bear our sins, and die for us on the cross, — all this is wonderful indeed! It is a kind of love to which there is nothing like among men. The narrow selfishness of human nature cannot fully comprehend it. It is one of those things which even the angels of God “desire to look into.” It is a truth which Christian preachers and teachers should proclaim incessantly, and never be weary of proclaiming.

But the love of Christ to saints is no less wonderful, in its way, than His love to sinners, though far less considered. That He should bear with all their countless infirmities from grace to glory, — that He should never be tired of their endless inconsistencies and petty provocations, — that He should go on forgiving and forgetting incessantly, and never.be provoked to cast them off and give them up, — all this is marvellous indeed! No mother watching over the waywardness of her feeble babe, in the days of its infancy, has her patience so thoroughly tried, as the patience of Christ is tried by Christians. Yet His longsuffering is infinite. His compassions are a well that is never exhausted. His love is “a love that passeth knowledge.”

Let no man be afraid of beginning with Christ, if he desires to be saved. The chief of sinners may come to Him with boldness, and trust Him for pardon with confidence. This loving Saviour is One who delights to “receive sinners.” (Luke xv. 2.) Let no man be afraid of going on with Christ after he has once come to Him and believed. Let him not fancy that Christ will cast him off because of failures, and dismiss him into his former hopelessness on account of infirmities. Such thoughts are entirely unwarranted by anything in the Scriptures. Jesus will never reject any servant because of feeble service and weak performance. Those whom He receives He always keeps. Those whom He loves at first He loves at last. His promise shall never be broken, and it is for saints as well as sinners: “Him that cometh unto Me I will in no wise cast out.” (John vi. 37.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on the Gospels. For Family and Private Use. With the Text Complete. St. John. Vol. III</cite>, (New York: Robert Carter and Brothers, 1878), pp 2-3.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a70f4018d9" data-kw="">
<blockquote><p>Question 1. Whether in a good or evil act there be necessarily required an inclination of the will? 1st Answer. First, the will is the principle and the first cause of all human operation in regard of the exercise of the act. For we therefore do this or that rather than another thing, because we will; As God Himself is said to do all things of his own Will, Eph. 1:11. So also does man who is made after the Image of God. The first cause therefore of the goodness or sinfulness of any act of man, is in the will.

2. Secondly, liberty also of election is formally in the will: that therefore anyone does yield obedience to God, or refuses to do so, proceeds from the will.

3. Lastly, our obedience stands in our conformity to the Will of God, and the disobedience, in our unconformity thereunto. Now our conformity with the Will of God is first and principally in our will, Apoc. 2:6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conscience with the Power &amp; Cases Thereof</cite>, (1639), bk. 3, ch. 19, ‘Of a Voluntary Act’, pp. 92-3</span></figcaption>

</figure><figure class="quote" id="q-a12f49bf35" data-kw="">
<blockquote><p>Love to Christ delights in his ordinances, and leads the person in whom it dwells to observe them regularly and conscientiously. These are the places where he meets with his people, and holds communion with them. True love will fly with eagerness to seek its object wherever it is to be found, and will linger fondly about the spot where it expects to meet him. …

If a person is careless in waiting on public ordinances, if he can absent himself from them on the most trifling account, if he has more pleasure in loitering at home, in traversing the fields, or in visiting his friends, how dwelleth the love of Christ in that man?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Love to Christ in Sermons</cite></span></figcaption>

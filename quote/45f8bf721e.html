<blockquote><p>That Ruling Elders are officers in the Church of God, may be clearly gathered from Rom. 12. 8. He that ruleth with diligence. (a) 1 Tim. 5. 17. Let the Elders that rule well be counted worthy of double-honour, chiefly those that labour in the word and doctrine. &amp; 1 Cor. 12. 28. God hath set in the Church—Governments.

2. That they are officers distinct from other officers, is also plain from the same place; chiefly from that of 1 Tim. 5. 17. and from Rom. 12. 4, 6. compared with 8. For in 1 Tim. 5. 17. he doth mention two sorts of Elders: first in the general those that rule well; secondly more distinctly, those that in bearing rule, labour in the word and doctrine.

And in Rom. 12. 4. the Apostle saith, that there are many members in the body of the Church, and that they have not all of them the same offices: then, v. 6. he saith, that the gifts of grace which makes men capable of offices, are different: and then in the latter part of v. 6. and v. 7. &amp; 8. he sheweth what the particular differences of offices are, amongst which he reckoneth up that of Ruling; from whence it followeth, that the Ruler is not only an officer, but a different officer from the others named in that place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dury.html">John Dury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A model of church-government: or, The grounds of the spiritual frame and government of the house of God. Shewing, what the holy Scriptures have therein delivered; what the best Reformed Churches do practise; what the tender consciences may rest in. For the better satisfaction of such as scruple at t</cite>, (London: John Bellamy, 1647), pp 19-20.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2c4a4d30ca" data-kw="">
<blockquote><p>The officers of this church were the bishops and deacons. The bishops were the pastors, elders, and overseers of the church, for a bishop and an elder is one and the same; see Acts 20:17 Acts 20:28; where the elders of the church at Ephesus are called overseers or bishops; for the same word is used there as here; and the Syriac version here renders the word by קשישא, elders: and they design no other than common and ordinary pastors; who have the name of elders from their age, gravity, and seniority; and that of bishops and overseers from the nature of their office, which is to feed, watch, inspect, and take the oversight of the flock, minister sound doctrine to them, and preserve them from error and heresies.

It seems by this, and the instance of the church at Ephesus, that there were, and so may be, where there is necessity for it, more pastors or bishops than one in a church; unless it can be thought that there were more churches than one in each of these cities; or that the pastors of adjacent churches are here included; neither of which seem to be a clear case, but the contrary: but then these pastors or bishops were all upon an equal foot; one had not any authority or power over another, or more authority than another; they were not metropolitan or diocesan bishops, but pastors of a particular church; and were neither lords over one another, nor of God’s heritage.

The deacons were such as served tables, the Lord’s table, the minister’s table, and the poor’s table; took care of the secular affairs of the church, received and disbursed moneys, kept the church’s accounts, and provided everything necessary for its temporal good. The one sort of these officers were concerned with the souls and spiritual estate of the members of the church; the others with their bodies and temporal estate, by visiting the sick, relieving the poor and both these exhibit the true primitive plan of church offices and discipline; there being no other order of offices or officers, in a Christian church of divine institution, but pastors and deacons; whatever else is introduced is without warrant, and comes from the man of sin. These officers are mentioned by the apostle, not only to show his respect to them, but to observe to the members of this church, that they ought to esteem them highly for their works’ sake; these being offices of great importance and usefulness to the church, which, by having such, was a truly organized church of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the New Testament; In which the Sense of the Sacred Text is Taken; Doctrinal and Practical Truths are set in Plain and Easy Light: Difficult Passages Explained; Seeing Contradictions Reconciled; And whatever is material in the Various Readings and Several Oriental Versions is Observ</cite>, (2 vols, London: William Hill Collingridge, 1853), 1: 461.</span></figcaption>

<blockquote><p>Quest. What is the Office and Work of the Ruling Elders?

Answ. Seeing the Kingdom of God is not of this World, but Heavenly and Spiritual, and the Government of his Kingdom is not Lordly, but Stewardly and Ministerial, and to labour in the Ministry of Exhortation and Doctrine, is the proper Work of the Pastors and Teachers, it remaineth therefore to be the Office and Work of the Ruling Elders to assist the Pastors and Teachers, in diligent Attendance to all other Aids of Rule besides Exhortation and Doctrine, as becometh good Stewards of the Household of God.

As I. To open and shut the Doors of God’s House, by Admission of Members, by Ordination of Officers, by Excommunication of notorious and obstinate Offenders. 2. To see none live in the Church inordinately without a Calling, or idle in their Calling. 3. To prevent and heal Offences whether in Life or Doctrine, that might corrupt their own Church, or other Churches also, if their Counsel be required. 4. To prepare Matters for the Churches Consideration, and to moderate the Carriage of all Matters in the Church-Assemblies, as to propound Matters to the Church, and to order the Seasons of Speech and Silence in the Church. 5. Finally, To feed the Flock of God by a Word of Admonition; and, as they shall be called, to visit and pray for their sick Brethren.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Government and Discipline of the Churches of Christ, set down by way of Questions and Answers, with an Explanation and Application of the same</cite>, (London: John Clark, 1722), pp 53-54.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Quest. What is the Office and Work of the Ruling Elders?

Answ. Seeing the Kingdom of God is not of this World, but Heavenly and Spiritual, and the Government of his Kingdom is not Lordly, but Stewardly and Ministerial, and to labour in the Ministry of Exhortation and Doctrine, is the proper Work of the Pastors and Teachers, it remaineth therefore to be the Office and Work of the Ruling Elders to assist the Pastors and Teachers, in diligent Attendance to all other Aids of Rule besides Exhortation and Doctrine, as becometh good Stewards of the Household of God.

As I. To open and shut the Doors of God’s House, by Admission of Members, by Ordination of Officers, by Excommunication of notorious and obstinate Offenders. 2. To see none live in the Church inordinately without a Calling, or idle in their Calling. 3. To prevent and heal Offences whether in Life or Doctrine, that might corrupt their own Church, or other Churches also, if their Counsel be required. 4. To prepare Matters for the Churches Consideration, and to moderate the Carriage of all Matters in the Church-Assemblies, as to propound Matters to the Church, and to order the Seasons of Speech and Silence in the Church. 5. Finally, To feed the Flock of God by a Word of Admonition; and, as they shall be called, to visit and pray for their sick Brethren.”

— Thomas Goodwin, The Government and Discipline of the Churches of Christ, set down by way of Questions and Answers, with an Explanation and Application of the same, (London: John Clark, 1722), pp 53-54.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQuest.+What+is+the+Office+and+Work+of+the+Ruling+Elders%3F%0A%0AAnsw.+Seeing+the+Kingdom+of+God+is+not+of+this+World%2C+but+Heavenly+and+Spiritual%2C+and+the+Government+of+his+Kingdom+is+not+Lordly%2C+but+Stewardly+and+Ministerial%2C+and+to+labour+in+the+Ministry+of+Exhortation+and+Doctrine%2C+is+the+proper+Work+of+the+Pastors+and+Teachers%2C+it+remaineth+therefore+to+be+the+Office+and+Work+of+the+Ruling+Elders+to+assist+the+Pastors+and+Teachers%2C+in+diligent+Attendance+to+all+other+Aids+of+Rule+besides+Exhortation+and+Doctrine%2C+as+becometh+good+Stewards+of+the+Household+of+God.%0A%0AAs+I.+To+open+and+shut+the+Doors+of+God%E2%80%99s+House%2C+by+Admission+of+Members%2C+by+Ordination+of+Officers%2C+by+Excommunication+of+notorious+and+obstinate+Offenders.+2.+To+see+none+live+in+the+Church+inordinately+without+a+Calling%2C+or+idle+in+their+Calling.+3.+To+prevent+and+heal+Offences+whether+in+Life+or+Doctrine%2C+that+might+corrupt+their+own+Church%2C+or+other+Churches+also%2C+if+their+Counsel+be+required.+4.+To+prepare+Matters+for+the+Churches+Consideration%2C+and+to+moderate+the+Carriage+of+all+Matters+in+the+Church-Assemblies%2C+as+to+propound+Matters+to+the+Church%2C+and+to+order+the+Seasons+of+Speech+and+Silence+in+the+Church.+5.+Finally%2C+To+feed+the+Flock+of+God+by+a+Word+of+Admonition%3B+and%2C+as+they+shall+be+called%2C+to+visit+and+pray+for+their+sick+Brethren.%E2%80%9D%0A%0A%E2%80%94+Thomas+Goodwin%2C+The+Government+and+Discipline+of+the+Churches+of+Christ%2C+set+down+by+way+of+Questions+and+Answers%2C+with+an+Explanation+and+Application+of+the+same%2C+%28London%3A+John+Clark%2C+1722%29%2C+pp+53-54.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff42ca74d6f.html&amp;via=5Sola

<main class="wrap"><figure class="quote" id="q-2be9b15777" data-kw="">
<blockquote><p>It is most probable that no gift, no pains a man takes to fit himself for preaching, shall ever do good to the people or himself, except a man labor to have and keep his heart in a spiritual condition before God, depending on Him always for furniture and the blessing. Earnest faith and prayer, a single aim at the glory of God, and good of people, a sanctified heart and carriage, shall avail much for right preaching. There is sometime somewhat in preaching that cannot be ascribed either to the matter or expression, and cannot be described what it is, or from whence it comes, but with a sweet violence, it pierces into the heart and affections, and comes immediately from the Lord. But if there be any way to attain to any such thing, it is by a heavenly disposition of the speaker.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-livingstone.html">John Livingstone</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Remarks on Preaching and Praying in Public by John Livingstone’, in Scottish Puritans: Select Biographies, vol. 1</cite>, p. 287</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0d0c138d09" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>History of the Sufferings of the Church of Scotland (d. 1734; Glasgow: Blackie, 1842), 2.210</cite></span></figcaption>

<blockquote><p>It’s the common trap of the Papists to put ignorant people to prove the calling of the ministers, or forsake them. They that preach the Gospel and do the office (though faultily), and are in possession [of it], have a calling sufficient to justifie the hearers, when it may not be enough to justify themselves: [they have] a better call than the high priests that Christ did send men to.</p></blockquote>

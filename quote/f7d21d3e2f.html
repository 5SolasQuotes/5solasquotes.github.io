<main class="wrap"><figure class="quote" id="q-f7d21d3e2f" data-kw="">
<blockquote><p>There be three acts of faith, assent, acceptance, and assurance: The Papists generally give the essence of saving faith to the first, viz. assent. The Lutherans, and some of our own, give it to the last, viz. assurance: but it can be neither way so. Assent does not agree only to true believers, or justified persons. Assurance agrees to justified persons, and them only, but not to all justified persons, and that at all times.

Assent is too low to contains the essence of saving faith, it is found in the unregenerate as well as the regenerate: yea, in devils as well as men, James ii. 19. it is supposed and included in justifying faith, but it is not the justifying or saving act. Assurance is as much too high, being found only in some eminent believers: and in them too but at some times. There is many a true believer to whom the joy and comfort of assurance is denied; they may say of their union with Christ, as Paul said of his vision; whether in the body or out of the body, I cannot tell; so they, whether in Christ or out of Christ, they cannot tell.

A true believer may “walk in darkness, and see no light,” Isa. l. 10. Nay a man must be a believer before he know himself to be so; the direct act of faith is before the reflex act: so that the justifying act of faith lies neither in assent nor in assurance. Assent saith, I believe that Christ is, and that he is the Saviour of the elect. Assurance saith, I believe and am sure that Christ died for me, and that I shall be saved through him. So that assent widens the nature of faith too much, and assurance upon the other hand straitens it too much; but acceptance, which saith, I take Christ in all his offices to be mine, this fits it exactly, and belongs to all true believers, and to none but true believers; and to all true believers at all times. This therefore must be the justifying and saving act of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Method of Grace in the Gospel-Redemption</cite>, (1699) in The Works of John Flavel (1820; 6 vols, London: Banner of Truth: 1968), 2: 114-15.</span></figcaption>

<blockquote><p>‘Who hath anointed us, and sealed us.’ Anointing and sealing go together. The same God anoints us doth also seal us. Both are to secure us of our happy condition. Now Christ is the first sealed: John 6:27, ‘Him hath the father sealed.’ God hath set Christ apart from others, hath distinguished him, and set a stamp upon him to be the Messiah by the graces of the Spirit, whereof he was richly beautified, and by many miracles, whereby he shewed that he was the Son of God; by his resurrection from the dead, by his calling of the Gentiles, and many other things. Christ being sealed himself, he sealed all that he did for our redemption with his blood, and hath added for the strengthening of our faith outward seals, the sacraments, to secure his love more firmly to us. But in this place another manner of sealing is to be understood. For here is not meant the sealing of Christ, but the sealing of us that have communion with him. The same Spirit that seals the Redeemer seals the redeemed. Quest. What is the manner of our sealing by the Spirit? Ans. (1.) Sealing we know hath divers uses. First of all, it doth imprint a likeness of him that doth seal. When the king’s image is stamped upon the wax, everything in the wax answers to that in the seal, face to face, eye to eye, body to body. So we are said to be sealed when we carry in our souls the image of the Lord Jesus; for the Spirit sets the stamp of Christ upon every true convert. There is the likeness of Christ in all things to be found in him. As the child answers the father, foot for foot, finger for finger in proportion, but not in quantity, so it is in the sealing of a believer. There is a likeness in the soul that is sealed by the Spirit to the Lord Jesus. There is understanding of the same heavenly supernatural truths; there is a judging of things as Christ judgeth, a loving of that which he loves, and a hating of that which he hates; a rejoicing to do that which he delights in, and a grief to commit anything that displeaseth his majesty. Every affection of the soul is carried that way that the affections of our blessed Saviour are carried, in proportion; everything in the soul is answerable to him in its degree. There is no grace in Christ, but there is the like in every Christian in some measure. The obedience of Christ to his Father, even to the death, is to be found in every true Christian. The humility whereby Christ abased himself, it is in every renewed heart. Christ works in the soul that receives him a conformity to himself. The soul that believes that Christ hath loved him, and done such great things for him, is ambitious to express Christ in all his ways. Being once in Christ, we shall delight to be transformed more and more unto him. To bear the image of the ‘second Adam’ upon our breasts, to make it appear that Jesus Christ lives in us, and that we ‘live not to ourselves, but to him that died for us,’ 2 Cor. 5:15; to be meek and heavenly-minded as he was, talking and discoursing of spiritual things, going about doing good everywhere; active for God, fruitful in holiness, doing and receiving all the good we are able, drawing others from this world to meditate of a better estate, labouring for the advancement of God’s kingdom, and approving ourselves to him. This is one use of sealing, to imprint a likeness. (2.) A second use of the seal is distinction. Sealing is a stamp upon one thing among many. It distinguisheth Christians from others, as we shall see after. (3.) Again, it serves for appropriation. Men seal those things that are their own. Merchants, we see, set their stamp on those wares which they have or mean to have a right unto. It pleaseth God thus to condescend unto us, by applying himself to human contracts. He appropriates his own to shew that he hath chosen and singled them out for himself to delight in. (4.) Sealing further serves to make things authentical, to give authority and excellency. The seal of the prince is the authority of the prince. This gives validity to things, answerable to the dignity and esteem of him that seals. These are the four principal uses of sealing; and God by his Spirit doth all these to his. He stamps his own image upon us; he distinguisheth us from others, even from the great refuse of the world. God by his Spirit appropriates us to himself; he makes us to be his, and shews that we are his. He likewise authoriseth us, and puts an excellency upon us, to secure us against all temptations. When we have God’s seal on us, we stand firm in the greatest trial. ‘Who shall separate us from the love of God?’ Rom. 8:35. We dare defy all objections of Satan, and accusations of conscience whatsoever. A man that hath God’s seal stands impregnable in the most tempestuous season; for it is given for our assurance, and not for God’s. The Lord knows who are his. He seals not because he is ignorant, but for our comfort and establishment.</p></blockquote>

of the prince is the authority of the prince. This gives validity to things, answerable to the dignity and esteem of him that seals. These are the four principal uses of sealing; and God by his Spirit doth all these to his. He stamps his own image upon us; he distinguisheth us from others, even from the great refuse of the world. God by his Spirit appropriates us to himself; he makes us to be his, and shews that we are his. He likewise authoriseth us, and puts an excellency upon us, to secure us against all temptations. When we have God’s seal on us, we stand firm in the greatest trial. ‘Who shall separate us from the love of God?’ Rom. 8:35. We dare defy all objections of Satan, and accusations of conscience whatsoever. A man that hath God’s seal stands impregnable in the most tempestuous season; for it is given for our assurance, and not for God’s. The Lord knows who are his. He seals not because he is ignorant, but for our comfort and establishment.”

— Richard Sibbes, The Complete Works of Richard Sibbes, ed. Alexander Balloch Grosart, vol. 4 (Edinburgh; London; Dublin: James Nichol; James Nisbet and Co.; W. Robertson, 1863), 132–33.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98Who+hath+anointed+us%2C+and+sealed+us.%E2%80%99+Anointing+and+sealing+go+together.+The+same+God+anoints+us+doth+also+seal+us.+Both+are+to+secure+us+of+our+happy+condition.+Now+Christ+is+the+first+sealed%3A+John+6%3A27%2C+%E2%80%98Him+hath+the+father+sealed.%E2%80%99+God+hath+set+Christ+apart+from+others%2C+hath+distinguished+him%2C+and+set+a+stamp+upon+him+to+be+the+Messiah+by+the+graces+of+the+Spirit%2C+whereof+he+was+richly+beautified%2C+and+by+many+miracles%2C+whereby+he+shewed+that+he+was+the+Son+of+God%3B+by+his+resurrection+from+the+dead%2C+by+his+calling+of+the+Gentiles%2C+and+many+other+things.+Christ+being+sealed+himself%2C+he+sealed+all+that+he+did+for+our+redemption+with+his+blood%2C+and+hath+added+for+the+strengthening+of+our+faith+outward+seals%2C+the+sacraments%2C+to+secure+his+love+more+firmly+to+us.+But+in+this+place+another+manner+of+sealing+is+to+be+understood.+For+here+is+not+meant+the+sealing+of+Christ%2C+but+the+sealing+of+us+that+have+communion+with+him.+The+same+Spirit+that+seals+the+Redeemer+seals+the+redeemed.+Quest.+What+is+the+manner+of+our+sealing+by+the+Spirit%3F+Ans.+%281.%29+Sealing+we+know+hath+divers+uses.+First+of+all%2C+it+doth+imprint+a+likeness+of+him+that+doth+seal.+When+the+king%E2%80%99s+image+is+stamped+upon+the+wax%2C+everything+in+the+wax+answers+to+that+in+the+seal%2C+face+to+face%2C+eye+to+eye%2C+body+to+body.+So+we+are+said+to+be+sealed+when+we+carry+in+our+souls+the+image+of+the+Lord+Jesus%3B+for+the+Spirit+sets+the+stamp+of+Christ+upon+every+true+convert.+There+is+the+likeness+of+Christ+in+all+things+to+be+found+in+him.+As+the+child+answers+the+father%2C+foot+for+foot%2C+finger+for+finger+in+proportion%2C+but+not+in+quantity%2C+so+it+is+in+the+sealing

<main class="wrap"><figure class="quote" id="q-cd99261633" data-kw="">
<blockquote><p>To put forward a more refined and true principle in alternative to [George] Gillespie’s: Things less than fully good, or impure, not inherently wrong, may in some circumstances, especially according to the degree of necessity, be personally, materially done, even in worship, public worship and Church government (though they occasion passive scandal in some), for the good in the things themselves and for attaining higher and weightier goods (in proportion to that degree), while seeking to avoid the greater hurt and scandal, without approving the impurities or what may be deficient in them. [John] Sprint essentially affirmed this principle, while Gillespie essentially denied it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, p. 48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bbd710f39d" data-kw="">
<blockquote><p>…yea there can be no sin eligible [chosen] by such and such a case [of necessary circumstance], as Lot sinned in exposing his daughters to the lust of men, to redeem abstinence from sodomy. Hence it is clear: we may not do a less, nor counsel another to commit a less sin, to eschew a greater, as the Jesuits wickedly teach. So Tannerus, so Turrianus and others who make a scandalum permissum, a scandal that a Christian may hinder another to fall in, and yet he permits him to fall in it. But God has a prerogative to permit sinful scandals, men have no such power, when they are obliged to hinder it. The divinity of others seems better to me, who deny that the least venial [sin] should be committed to eschew a greater sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Touching Scandal &amp; Christian Liberty, p. 83 in The Divine Right of Church Government (1646)</cite></span></figcaption>

</figure><figure class="quote" id="q-c43f3df445" data-kw="">
<blockquote><p>Divines commonly accept that covenants do not remove preexisting obligations. [Andrew] Honyman, amongst other things, maintains that preaching the Gospel and procuring the greater good of “the public peace and good of Church and State, and prevent[ing] horrid confusions” are preexisting and more foundational ministerial obligations than the form of Church government or what the SL&amp;C could alter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, p. 125</span></figcaption>

</figure><figure class="quote" id="q-a70f4018d9" data-kw="">
<blockquote><p>Question 1. Whether in a good or evil act there be necessarily required an inclination of the will? 1st Answer. First, the will is the principle and the first cause of all human operation in regard of the exercise of the act. For we therefore do this or that rather than another thing, because we will; As God Himself is said to do all things of his own Will, Eph. 1:11. So also does man who is made after the Image of God. The first cause therefore of the goodness or sinfulness of any act of man, is in the will. 2. Secondly, liberty also of election is formally in the will: that therefore anyone does yield obedience to God, or refuses to do so, proceeds from the will. 3. Lastly, our obedience stands in our conformity to the Will of God, and the disobedience, in our unconformity thereunto. Now our conformity with the Will of God is first and principally in our will, Apoc. 2:6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conscience with the Power &amp; Cases Thereof (1639), bk. 3, ch. 19, ‘Of a Voluntary Act’</cite>, pp. 92-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-559bf1690e" data-kw="">
<blockquote><p>6th Rule. There is a principal obligation, a less principal, a least principal. Hence these three degrees issue from love: 1. God, 2. ourselves, 3. our neighbor. The love of God is most principal, and is the measure of the love of ourselves: the love of ourself is less principal than the love of God, and so the obligation [is] less. I am to make away, life and all things, yea, eternal glory as divided from holiness, and as it includes only happiness, rather ere I sin against God. The obligation to care for my own salvation is more principal than my obligation to care for the salvation of my brother: for the love of myself is the measure and rule of the love of my neighbor. Now because the obligation of caring for the soul of my brother is only secondary, in compare[ison] of the obligation of caring for my own salvation, I am not to sin myself, or sinfully to omit anything that is commanded me in a positive precept, to prevent the sin of my brother. Yet hence it does not follow that a positive precept is more excellent than the law of Nature, which is, ‘Thou shalt not murder,’ nor ‘scandalize him for whom Christ died.’ Because though to care for the soul of my brother be of the law of nature simpliciter, yet [it] is a secondary obligation, and may cease and yield to a stronger obligation that ties me more principally to care for my own soul; for though the command be positive, yet knowingly to sin by a sinful omission, is no less a destroying of my own soul, and so of the law of nature, in a higher obligation, than the other is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646), Appendix</cite>, pp. 83-84</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

<main class="wrap"><figure class="quote" id="q-a305adef80" data-kw="">
<blockquote><p>For God sends not private men, or Christian unofficed scholars (or if he do, their extraordinary sending makes them public pastors and prophets, not the people), but he sent Philip an evangelist, and after Peter and John to Samaria, Acts 8, Paul to Macedonia, Acts 16, and his own ministers, Titus 1:5; 1 Tim. 4:14 &amp; 5:22, Paul and Barnabas, men in office, some more than zealous Christians and scholars to the Gentiles, Acts 13, Jonah to Nineveh, Ananias to baptize Paul, Jonah 3; Acts 9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (1658), ch. 21, p. 116</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f423a7e4c7" data-kw="">
<blockquote><p>7. A calling to the ministry is either such as wants the essentials, as gifts in any messenger, and the Churches’ consent, or these who occupy the room of the Church, the Church consenting, such a minister is to be reputed for no minister. Or. 2. An entry to a calling, or a calling, where diverse of the apostles’ requisites are wanting, may be a valid calling, as if one enter as Caiphas who entered by favor and money, and contrary to the Law was High-Priest but for a year: yet was a true High-Priest, and prophesied as the High-Priest.

8. If the Church approve by silence, or countenance the ministry of a man who opened the Church door to himself, by a silver key, having given the prelate a bud, the ordinance of God is conferred upon him and his calling ceases not to be God’s calling because of the sins of the instruments both taking and giving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 165 | pt. 2, p. 228</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-3257a990ce" data-kw="">
<blockquote><p>4. Mr. Hooker [a congregationalist] will not say all that were scattered, Acts 8[:4] (for they were all scattered, except the apostles, verse 1) did preach the Gospel, for there were of them women, verse 3; then some of them only preached. And if Mr. Hooker say they were not officers, Mr. Rutherford says they were officers, and that the extraordinariness of their condition supplied the want of a Church-calling, and let Mr. Hooker but attempt to bring a proof for it.

5. If nothing extraordinary was here, l […]t Mr. Hooker or any for him vindicate the place, Acts 8, from Anabaptists who allege the same place, Acts 8, to destroy the standing ordinance of the ministry: and read the judicious Tractate of the Ministers of London, of Mr. Collings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (1658), p. 426</span></figcaption>

<blockquote><p>…gifts give not the keys, nor authority to use gifts; and so that all believers, though gifted and graced also, have not power of the keys. 2. It’s certain that in a constituted Church there be no hands nor mouths to do and speak by authority, and ex officio, by virtue of an office, save only elders and pastors; and that if they do or speak, they do it extraordinarily, when Churches’ hands are lame and her eyes blind; or if they do and speak ordinarily, it is from the law of charity in a private way, not by power of the keys, and as judges and officers.</p></blockquote>

</figure><figure class="quote" id="q-bda0dba676" data-kw="">
<blockquote><p>If [as Thomas Hooker says,] ‘the laying on of hands be no specificating act of an office, because it is used in other performances, as in the sending of Paul and Barnabas to preach to the Gentiles, Acts 13,’ then shall water not be essential to baptism, nor drinking to the Lord’s Supper, nor blessing sacramental in that Supper, because in Levitical washings, in the feasts-sacred, in the Passover, in praying for a blessing to the Word preached, all these were used. It’s loose logic, a genere ad speciem [a genus to the species]; the question is not of laying on of hands in general, but of a certain kind and species of laying on of hands by way of prayer and designation. Mr. Rutherford knows there be diverse kinds of laying on of hands. 2. Nor do I say that the rite is essential to ordination, but of the necessity of before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (1658), pp. 428-9</span></figcaption>

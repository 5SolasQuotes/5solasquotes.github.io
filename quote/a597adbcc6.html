<main class="wrap"><figure class="quote" id="q-a597adbcc6" data-kw="">
<blockquote><p>What is Christian Religion?

It is that worship and service which every good &amp; godly man ought by virtue of bond and obligation to tender unto God himself. Wherein is chalked out unto us the way as well of living here honestly, as living hereafter happily; as Augustine saith in his book of true Religion, the first Chapter. The only course of living well and happily consists in true Religion, whereby we know the only true God, and worship him in holy pureness.

For by religion the soul of man, which before by sin was separate from God, being now reconciled, is again tied and re-united to God, from whence Religion hath its very name: For when we re-lige [sic], as it were; that is, oblige and bind over again our souls into God, then we empty our selves of all superstitious worship contrary to God’s service. … This is the very first step in wisdom, to know what it is for God truly to be a Father unto us, and him with all sanctity to worship and revere, obeying his will, and wholly devoting our selves to his service.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bartholomaus-keckermann.html">Bartholomaus Keckermann</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A GODLY AND De</cite>, vout Treatise, teaching with what due preparation we ought to come to the holy Communion, which is indeed an Abridgement of the System of Divinity, and may serve for a Catechism of Christianity in Ουρανογνωδα. Heavenly knowledge A manuduction to theology, trans. Thomas Vicars (London: Aug. Math., 1622), pp 1-2.</span></figcaption>

<blockquote><p>Also when it [‘worship’] expresses the Greek word sebomai; as Acts 18:13, ‘to worship God contrary to the law;’ and Acts 18:7, ‘Justus a worshipper of God.’ And so both it and the Greek answer to the Hebrew jaré [יָרֵא], which properly signifies to fear or reverence, as Mt. 15:9, ‘in vaine they worship Me;’ for that which in Hebrew is, ‘their fear towards me,’ Isa. 29:13. So Job and Jonah, as the Hebrew says, ‘feared,’ as the Greek [Septuagint] translates, ‘worshipped God.’ Also when it interprets the Greek word threskeuo, as Col. 2:18, ‘the worshipping of angels;’ and verse 23, ‘in will-worship’ or voluntary religion. Thus worship is largely used for the fear and service of God, or any religious action.</p></blockquote>

<blockquote><p>§65. The sum of all that I have said is this, that man may determine of modes and circumstances of worship, necessary and commanded in genere, but not determined by God in specie. But to make new worship-ordinances, or institute sacraments, or sacramental signs, or any thing else, for which in genere he has no commission, this is simply unlawful. §66. But this is not all: There is a second thing unlawful also; and that is the misdetermining of those same modes and circumstances, which he is authorized to determine. For he is (as is said) to do it by God’s General Rule. Here therefore we must thus conclude:

1. That every misordering of such great affairs is the sin of them that do it.

2. But yet that the subject is not exempted from obedience by every such mistake of the governor: but by some, he is.</p></blockquote>

<blockquote><p>The sorts of this worship are twofold:

1. Solemn.

2. Common. The solemn worship is that whereto men do wholly give themselves, setting themselves apart from all other things to attend it wholly. The common is that which is to be performed to God jointly in and with our other affairs, so far forth as in them we have anything to do with Him or any thing of his.</p></blockquote>

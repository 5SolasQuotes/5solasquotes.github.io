<blockquote><p>The creation of the world was distinguished by the space of six days, in respect of the effects, and whole world created; and for our better capacity. And for as much as God is above all time, and of infinite power, it is to be thought He created every thing particular [every particular thing] in a moment, saying, ‘Let there be light, and there was light’, Gen. 1:3.</p></blockquote>

</figure><figure class="quote" id="q-32d4291ae7" data-kw="">
<blockquote><p>[Thomas, Summa, pt. 1, quest. 25, art. 2:] Reply to second objection. ‘Even if it were to produce no effect, the power of God would not be ineffectual: because a thing is ineffectual which is ordained to an end to which it does not attain. But the power of God is not ordered toward its effect as toward an end; rather it is the end of the effect produced but it.’ St. Thomas in this reply observes that ‘the power of a univocal agent is wholly manifested in its effect. The generative power of man is not able to do more than beget man. But the power of a non-univocal agent does not wholly manifest itself in the production of its effect,’ just as the power of the sun is not wholly manifested, for instance, in the ripening of the fruits of the earth. But God evidently is not a univocal agent. ‘Hence his effect is always less than his power.’ Nevertheless His infinite power is manifested in the mode of producing things, inasmuch as He produces something out of nothing, or from no presupposed subject. Analogically we say that men of great genius are superior to the works they produce; but it is, nevertheless, in the way they produce these works that their superiority is seen. On the contrary, men of ordinary ability are, so to speak, univocal agents, and the whole of their power is manifested in the effect produced. They could not do more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The One God: a Commentary on the First Part of St. Thomas’ Theological Summa</cite>, (Herder Book Co., 1943), ch. 25, p. 721</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-af4b12fc42" data-kw="">
<blockquote><p>…creation is instantaneous, unpreceded by a process of becoming… St. Thomas excels in explaining this distinction, just now noted, between passive potency and active potency. Real passive potency is not simple possibility. Simple possibility is prerequired and suffices for creation ex nihilo. But it does not suffice as prerequisite for motion, change, mutation. Mutation presupposes a real subject, determinable, transformable, mutable, whereas creation is the production of the entire created being, without any presupposed real potency. Now, since active potency, active power, must be greater in proportion to its passive correlative, it follows that when passive potency is reduced to zero, the active potency must be infinite. In other words, the most universal of effects, the being of all [created] things, cannot be produced except by the most universal of all causes, that is, by the Supreme Being. (Summa, pt. 1, q. 45, art. 1, 2, 5; pt. 3, q. 75, art. 8)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought</cite>, (n.p., 1946), ch. 5, ‘Act &amp; Potency’, pp. 29-30 Lagrange is a Romanist, neo-Thomist theologian.</span></figcaption>

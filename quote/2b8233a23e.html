<main class="wrap"><figure class="quote" id="q-2b8233a23e" data-kw="">
<blockquote><p>Although the efficient cause of the operations of Christ is one alone [that of the divine nature], still the exciting cause is twofold–the divinity and humanity. The work upon which both exciting (egergema) causes exert their power is one, but the action (energeia) is twofold.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes… (P&amp;R), vol. 2, 13th Topic, ‘Person &amp; State of Christ’, 7th Question, ‘Was the hypostatical union of the two natures in Christ such that neither the person is divided nor the natures confounded?’, section 15</cite>, p. 321</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>
<div class="actions"><button class="copy" data-copy="“Although the efficient cause of the operations of Christ is one alone [that of the divine nature], still the exciting cause is twofold–the divinity and humanity. The work upon which both exciting (egergema) causes exert their power is one, but the action (energeia) is twofold.”

— Francis Turretin, Institutes… (P&amp;R), vol. 2, 13th Topic, ‘Person &amp; State of Christ’, 7th Question, ‘Was the hypostatical union of the two natures in Christ such that neither the person is divided nor the natures confounded?’, section 15, p. 321">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlthough+the+efficient+cause+of+the+operations+of+Christ+is+one+alone+%5Bthat+of+the+divine+nature%5D%2C+still+the+exciting+cause+is+twofold%E2%80%93the+divinity+and+humanity.+The+work+upon+which+both+exciting+%28egergema%29+causes+exert+their+power+is+one%2C+but+the+action+%28energeia%29+is+twofold.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes%E2%80%A6+%28P%26R%29%2C+vol.+2%2C+13th+Topic%2C+%E2%80%98Person+%26+State+of+Christ%E2%80%99%2C+7th+Question%2C+%E2%80%98Was+the+hypostatical+union+of+the+two+natures+in+Christ+such+that+neither+the+person+is+divided+nor+the+natures+confounded%3F%E2%80%99%2C+section+15%2C+p.+321&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2b8233a23e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2b8233a23e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/christ/the-human-and-divine-natures-of-christ/on-the-two-operations-energies-of-the-mediator-divine-human-unto-the-same-effect-apotelesma/#:~:text=Although%20the%20efficient%20cause%20of%20the,but%20the%20action%20%28energeia%29%20is%20twofold." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0c475215e2" data-kw="">
<blockquote><p>This Person is the common beginning of those actions, which the Greek Fathers have called divinely humane: for the actions of Christ are not only, some humane, some divine: but also some of common operation, which Christ effects; both as he is Man-God by Nature, and as he is Mediator by dispensation: his Natures are the beginnings of Natural Actions; but his person is the beginning, both of common and particular actions, according to both natures: wherefore every working of Christ, in respect of his person, is in number one; in respect of his Natures, is in kind, two-fold: One in number, because he is one effectual Worker: and one absolute Perfection. In kind two-fold, because there is one Divine, of the God-head, and another humane, of the man-hood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity… (London, 1610), ‘Of the Person of Christ’, Part Confirmative, ch. 6</cite>, pp. 156-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

</figure><figure class="quote" id="q-b2e7348499" data-kw="">
<blockquote><p>Peter cannot be called the foundation of the church, since no other foundation can be laid besides Christ (1 Cor. 3:11), and he himself is a member of the church, who ought to be built on Christ with the others as he himself teaches (1 Pet. 2:5, 6). Nor if the church is said to be built upon the foundation of the apostles, is this to be understood with respect to their persons, but with respect to their doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.17.13</span></figcaption>

<blockquote><p>21. The execution of Christ’s office adequately brings remedy to the defects introduced through sin, and both conciliates grace to man and glory. 22. The prophetic office of Christ heals the defect of ignorance, the priestly the defect of righteousness, the royal the defect of power. 23. But this office was destined equally as the person exercising it, to the elect sons of God alone, for whose good alone and in whose place he both performed the act of ἱλασμοῦ [propitiation] on earth and performs the act of ἐντεύξεως [intercession] in heaven.</p></blockquote>

</figure><figure class="quote" id="q-4b07a0e66a" data-kw="">
<blockquote><p>And not only Peter but also all the apostles, by making this confession—which they would soon proclaim in the midst of the world—laid the foundation of the church of Christ. Accordingly, figuratively speaking, along with Peter they were all of them the rock on which Christ built his church; or, in another application of the same image, Christ is the rock that the apostles by their preaching laid as the foundation of the church (Acts 4:11; Rom. 9:33; 1 Cor. 3:10–11; Eph. 2:20; 1 Pet. 2:5–6; Rev. 21:14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 4</cite>, §502</span></figcaption>

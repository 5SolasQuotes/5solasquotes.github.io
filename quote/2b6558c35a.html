<main class="wrap"><figure class="quote" id="q-2b6558c35a" data-kw="">
<blockquote><p>When writing in opposition to the British government’s proposed scheme of National Education in Ireland, The Orthodox Presbyterian periodical, which Henry Cooke (among others) edited, reminded its readers that governments should establish the true religion and refuse to patronise false religion:

We are of that old fashioned school who maintain, that Governments may and should patronize and support true religion, and religious education, and neither must nor should patronize and support a false and unscriptural system. Moreover we do maintain, that when Governments, upon any pretence whatsoever, patronize or establish an unscriptural system, those Governments become partners in the sin, and will be made, if they repent not, “partakers of the plague,” which God will pour out upon every system of error and sin.

Still farther do we assert our conviction, that the people who stupidly or negligently acquiesce in the sins of the Government will, at the bar of providence and judgment, stand chargeable with the guilt. We therefore call upon the people, by respectful, honest, and bold petition, so to express their opinions, that should the Parliament proceed to establish Popery, and re-marry the nation to the long divorced errors and plagues of Rome, the people may stand unconnected with the guilt of the deed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/the-orthodox-presbyterian.html">The Orthodox Presbyterian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘New System of National Education’ Orthodox Presbyterian</cite></span></figcaption>

<blockquote><p>Whatsoever kind of office-bearers the Jewish Church had, not as it was Jewish, but as it was a Church, such ought the Christian Church to have also. But the Jewish Church, not as it was Jewish, but as it was a Church, had elders of the people who assisted in their ecclesiastical government and were members of their ecclesiastical consistories. Therefore such ought the Christian Church to have also. The proposition will no man call in question, for ‘quod competit alicui qua tali competit omni tali.’ That which agrees to any Church as it is a Church, agrees to every Church. I speak of the Church as it is a political body and settled ecclesiastical republic.</p></blockquote>

<blockquote><p>8. The non-necessaries, or such things as need not be in the worship of God, which do bring scandal, must 1. be such as are neither necessary in specie, nor in individuo, in kind, or in specie or nature, or in their individuals and particulars, as the whole category of men’s devices, as:

1. Unwritten traditions—not necessary, not written.

2. Human mystical, symbolical signs and ceremonies—not necessary, not written.

3. Human holy days, crossing, kneeling to elements, altars, crossing, surplice, rochets, etc.—not necessary, not written.

4. This and this human holy day, this crossing—not necessary, not written.</p></blockquote>

</figure><figure class="quote" id="q-7ae4d04682" data-kw="">
<blockquote><p>As concerning actions of Church-Policy, that cannot be warranted by the light of nature, and yet have intrinsecal conveniency and aptitude to edify and decently to accomodate the worship of God. I conceive these may be done, but not because the Church so commands, as if their commandment were the formal reason of our obedience, but because partly the light of the Law of reason, partly Scripture does warrant them… Again I conceive that there be two sort of positives in the externals of government or worship: 1. Some divine, as that there be in the public worship, prayers, praising, preaching, sacraments, and these are substantials; that there be such officers, pastors, teachers, elders and deacons; that there be such censures, as rebuking, excommunication and the like, are morally divine, or divinely moral: [2.] and when the Church forms a directory for worship and government; the directory itself is in the form not simply divine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Intro, Section 5, p. 80</span></figcaption>

</figure><figure class="quote" id="q-71c0dc2498" data-kw="">
<blockquote><p>In 1834 one of the Belfast newspapers contained the following announcement of the opening of a new covenanting meeting-house in the town. The newspaper was Anglican and politically conservative in outlook, yet it recognised the liberality of the Covenanters:

The new Meeting-house of the Second Congregation of the Reformed Presbyterians, commonly called Covenanters, lately erected in South College-street, in this town, is to be opened for public worship, on Sunday next, at two o’clock afternoon. The congregation, although small, have very spiritedly contributed nearly one-half the cost of the building of this plain, but very neat place of worship. It is not, we believe generally known that the Covenanters support their own poor, and they also very liberally contribute to works of general benevolence. They receive no aid from Government to assist in paying their Clergymen. […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guardian-and-constitutional-advocate.html">Guardian and Constitutional Advocate</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Guardian and Constitutional Advocate</cite>, 22 Aug. 1834</span></figcaption>

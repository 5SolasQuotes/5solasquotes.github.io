</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eaf1d5cb57" data-kw="">
<blockquote><p>They offered fire that God had not commanded. Hence I say that all things in Gods worship must have a warrant out of God’s Word, must be commanded. It’s not enough that it is not forbidden: I beseech you observe it: it is not enough that a thing is not forbidden, and what hurt is there in it? But it must be commanded: I confess in matters that are civil and natural, there this may be enough; If it be but according to the rules of prudence, and not forbidden in the Word; we may make use of this in civil and natural things. But now when we come to matters of religion, and the worship of God, we must either have a command, or some what out of God’s Word by some consequence drawn from some command wherein God manifests his will; either a direct command, or by comparing one thing with another, or drawing consequences plainly from the words. We must have a warrant of the worship of God… It’s true, there are some things in the worship of God that are natural and civil helps, and there we need not have any command: As for instance; when we come to worship God, the congregation meets, they must have a convenient place to keep the air and weather from them: now this is but a natural help, and so far as I use the place of worship as a natural help I need have no command. But if I will put any thing in a place beyond what it has in its own nature, there I must look for a command. For if I account one place more holy than another; or to think that God should accept of worship in one place rather than in another: This is to raise it above what it is in its own nature. So that when any creature is raised in a religious way, above what it has in it by nature; if I have not Scripture to warrant me I am therein superstitious. It’s a very useful rule for to help you: If any creature that you make any use of in a way of religion beyond what it has in its own nature, if you have not some warrant from the Word of God (whatsoever specious show there may be in it) it is superstition. As now for the place, there was a place that was holy, but then it had an institution from God. And so for garments, to use those that are decent, the light of reason is enough: but if I will put any thing upon them beyond what there is in them in their own nature, as heretofore in a surplice, what, had that any more decency in its own nature, but only man’s institution? Now when man shall put a religious respect upon a thing, by virtue of his own institution when he has not a warrant from God; here’s superstition! … Now God has written the law of natural worship in our hearts, as that we should love God, fear God, trust in God, and pray to God; this God has written in our hearts: But there are other things in the worship of God that are not written in our hearts, that only depend upon the Will of God revealed in his Word, which were no duties except they were revealed in his Word. And these are of such a nature as we can see no reason for, but only this, because God will have them. As now, there are many kinds of ceremonies to manifest honor to princes that there is no reason for them at all, but merely because it is a civil institution so appointed: So God would have some ways for the honoring of Him, that the creature should not see into the reason of them, but merely the Will of God to have them so:</p></blockquote>

<blockquote><p>The sorts of this worship are twofold: 1. Solemn, 2. Common… The Common is that which is to be performed to God jointly in and with our other affairs, so far forth as in them we have anything to do with Him or anything of his.</p></blockquote>

<blockquote><p>Q. What is the worship of God? A. That reverent respect and love wherewith we are to embrace his maiesty with our whole man. 1 Sam. 12:24; Mt. 22:37-38. The Schoolmen define it to be an immediate act of the will upon God: but this is the whole rule of divinity, which is nothing else but the ordering of the will so as it may please God. Now the act of the will is either to believe or obey, and obedience is either immediate, as piety, or mediate as charity. Hence the love of my neighbor is not an immediate act upon God, and in this sense worship is well distinguished from charity: as having no nearer object than God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-yates.html">John Yates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Model of Divinity, Catechistically Composed</cite>, … (London, 1622), bk. 2, ch. 1, ‘Of the Law’, p. 307</span></figcaption>

<blockquote><p>The ceremonial law is the system of God’s positive precepts concerning the external worship in sacred things, prescribed to the ancient church, either for the sake of order or signification. … Ceremonies are external rites and sacred accidents of the worship of God. They are not of themselves the worship of God, but concomitant adjuncts and assistants by signification, exercise, exercise, work and decorum.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R, 1994), vol. 2, 11th Topic, ‘On the Law of God’, Question 24, ‘What was the end and use of the ceremonial law under the Old Testament?’, section 4 &amp; 6, pp. 146-47</span></figcaption>

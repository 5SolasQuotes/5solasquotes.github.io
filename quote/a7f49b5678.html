<main class="wrap"><figure class="quote" id="q-a7f49b5678" data-kw="">
<blockquote><p>Second, love moves us to help our neighbours when they are physically oppressed. Hebrew believers exhibited that kind of love in ministering to the oppressed saints of Christ (Heb. 6:10). All works of mercy flow from love. Our faith will be judged on the last day by whether we fed the hungry, gave water to the thirsty, clothed the naked, offered hospitality to the poor, and comforted to the sick and people in prison.

If our hearts are motivated by love for each other (Rom. 12:10), we will gladly give to needy saints and he inclined to offer them hospitality (Rom. 12:13). Love is the spice that adds zest to our alms before God and man. Without love, our works mean nothing, even if we give all our goods to feed the poor (1 Cor. 13:3). We find examples of loveless giving in the Pharisees, as well as in Ananias and Sapphira (Acts 5:3).

On the other hand, a donation of one penny would be suitable to God, if it were given sacrificially and with a believing heart (Luke 21:3), for “God loveth a cheerful giver” (2 Cor. 9:7). Love is so powerful that we seek to do good to all, even our enemies (Matt. 5:44) and unbelievers (Gal. 6:10). A true sign of Christian love is that we do good to our enemies from the heart in obedience to Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/godefridus-udemans.html">Godefridus Udemans</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Faith, Hope, and Love</cite>, trans. Annemie Godbehere, ed. Joel R. Beeke (1621; Grand Rapids MI: Reformation Heritage Books, 2012), pp 42-43.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-af0f8b82cb" data-kw="">
<blockquote><p>The Spouse of Christ Jesus, when she shines in Love, she is amiable in Beauty; precious in the eye of her Husband, powerful with God her Father, prosperous in her own spiritual health and vigour, and prepared for her consummate marriage in celestial glory. Her husband is God, and God is love, and God cannot but love that love which is like himself. And that they may love his Spouse for her love, when she becomes one Spirit with him, by this unity of Spirit he gives her an uniformity of love; the ointment of Christ Jesus, the Head, floweth down into all his members, and breatheth love into them; and as far as his life goes, so far goeth his love: therefore no love, no life in Christ Jesus. Agreeably, the beloved Disciple, and an especial Teacher of love, having shewed that the New-birth brings love with life, he fitly addeth, He that loveth not, abideth in death. No wonder then, if the great Master and lover of this Disciple, make love the mark of his true Disciples, seeing those are only Christ’s true Disciples, which so learn Christ, as they draw that spirit from him, which teacheth them love, and breatheth it into them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-rouse.html">Francis Rous</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The balm of love: To heal divisions, and the wounds made by them, and to make the body of Christ whole and entire for its own beauty, strength, and safety. Partly presented in a former discourse, when it might have prevented, and now after many evils for want of prevention re-enforced in a second</cite>, (London: John Wright, 1648), pp 1-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life.html">The Christian Life</a></span></div>

<blockquote><p>We do observe beautiful things through our senses, but the property by which they are beautiful is not perceivable through the senses. Animals have perceptions and representations of beautiful things, but they do not know the beautiful. They know only the useful and the pleasant. For that reason, the perception and recognition of the beautiful, also in sensory things, belongs to the higher faculty of knowing, to reason… Beauty is something that the beholding of which delights a person. Something is good insofar as it, when it is recognized by us, is desirable to our will. But beauty is what stimulates not our desire in a narrow sense, but our pleasure.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-22d2555627" data-kw="">
<blockquote><p>The question is whether [these necessary matters] are presented somewhere in such a manner that a believer can recognize their truth when he has given them serious consideration, because nothing is learned from the more obscure passages that is not found most plainly taught elsewhere. As Augustine says, &quot;The Holy Spirit has arranged the Scriptures in such a wonderful and wholesome manner, that hunger is remedied by the plainer passages and pride by the more obscure&quot; (Concerning Christian Doctrine 2.6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.17.5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../topics/holy-scripture/perspicuity/clarity.html">Clarity</a></span></div>

<blockquote><p>We do not say that every thing is immediately plain and easy in the scriptures, so as to be intelligible to every one; but we say that those things which at first seem obscure and difficult, are afterwards rendered easy, if one be diligent in reading them, and bring with him a pure and pious mind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 4, ch. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../topics/holy-scripture/perspicuity/clarity.html">Clarity</a></span></div>

</figure><figure class="quote" id="q-9d4abd4aee" data-kw="">
<blockquote><p>That Scripture has this perspicuity is plain (1) from Scripture itself, which proclaims its lucidity. &quot;The testimony of Jehovah is sure, enlightening the eyes&quot; (Ps. 19:8). &quot;Thy words are a lamp to my feet&quot; (Ps. 119:105). &quot;A light shining in the darkness&quot; (II Peter 1:19). &quot;The law is a lamp&quot; (Prov. 6:23). … For Scripture is called &quot;clear&quot; (lucidus) not only because it throws light upon the matters that are understood, but also because it is clear in itself and has been made suitable for throwing light on these matters, if used by people with the eyes of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.17.8</span></figcaption>

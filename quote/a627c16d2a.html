</figure><figure class="quote" id="q-b2d8991f58" data-kw="">
<blockquote><p>Here, however, where God compares polygamy with divorce, he says that polygamy is the worse and more detestable crime; for the husband impurely connects himself with another woman, and then, not only deals unfaithfully with his wife to whom he is bound, but also forcibly detains her: thus his crime is doubled. For if he replies and says that he keeps the wife to whom he is bound, he is yet an adulterer as to the second wife: thus he blends, as they say, holy with profane things; and then to adultery and lasciviousness he adds cruelty, for he holds under his authority a miserable woman, who would prefer death to such a condition; for we know what power jealousy has over women. And when any one introduces a harlot, how can a lawful wife bear such an indignity without being miserably tormented?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Malachi</cite>, 2:16</span></figcaption>

</figure><figure class="quote" id="q-899ec16a4d" data-kw="">
<blockquote><p>Yet we must remember, that this restriction [against eating blood] was part of the old law. Wherefore, what Tertullian relates, that in his time it was unlawful among Christians to taste the blood of cattle, savours of superstition. For the apostles, in commanding the Gentiles to observe this rite, for a short time, did not intend to inject a scruple into their consciences, but only to prevent the liberty which was otherwise sacred, from proving an occasion of offense to the ignorant and the weak.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 9:4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-e7179c861a" data-kw="">
<blockquote><p>Thirdly, we may use any such fellowship with them as is, or shall be occasioned by virtue of our particular calling. Thus Christ, being the Savior of the world, conversed with publicans and sinners. Thus Paul being the Apostle of the Gentiles, enters into Athens, and there beholds their devotions. It is God’s commandement that the believing wife, shall nor forsake her unbelieving husband, if he be willing or desirous to dwell with her. (1 Cor. 7:13) If it be alleged that Ezra constrained the Israelites to put away their Ammonitish and Moabitish, and the rest of their heathen, wives (Ezra 10:3): I answer that their marriages were indeed void and no marriages: First, because the nations with whom they married were people, according to God’s Law, civilly dead: in that God had commanded their destruction, unless when peace was offered, they accepted of it. (Dt. 20:10) Secondly, in that they were not only idolators, but also enticers to idolatry; God by express commandment did simply forbid the Jews to marry with them unless they did repent and changed their religion. And in regard of this commandment, the foresaid marriages were nullities, as incestuous marriages are no marriages by reason of the absolute prohibition of God. Touching the society forbidden us with idolators, it is the society of amity, that is, of familiarity and special love. Two examples, whereof we find in the Word of God. One is of contracts of marriage with idolators, which the Scripture precisely condemns as an abomination in lsrael and a profanation of the name of God, when Judah marries the daughter of a strange god, Mal. 2:11. Boaz indeed married Ruth, a Moabitess, but she was entered and received into the body of the Israelites by a former marriage: and she was one that believed in the God of Israel. ‘Thy people’ (says he to Naomi and Ruth) ‘shall be my people, and thy God, my God.’ Sampson likewise married a woman of the Philistines (Judg. 14:4), but that was by divine instinct and consequently by a special appointment of God. Again it is alleged that God by express law gave leave to the Israelites to marry heathenish women taken captives in war. (Dt. 21:10-11) Answer: That is a law only of toleration, without approbation, in which God, for the hardness of their hearts, permits the evil, which cannot by policy be quite taken away. And this appears by two things: First, before the marriage, the woman by God’s appointment must be deformed, by cutting off her hair, by the growing of her nails, by putting off the garments of her captivity, and by mourning for her father and mother for the space of a month: and the end of this was to cause a dislike in the Israelites of their intended marriages, or to signify a change of religion, at the least in pretense, in the parties espoused. … Here one exception must not be omitted. Put the case that the husband is an idolator and is content to dwell with his believing wife: she then is to live with him, not only in the society of peace, but also in the society of amity by doing all duties of Iove that concern a wife, so far as may stand with good conscience. For the precept of Paul’s, that marriage and marriage duties are to be preserved of the believing party with an infidel (1 Cor. 7:13-14), so be it the said infidel be content. It may be al!eged that thus the believer exposes himself to danger of idolatry. I answer: Not because God defends them that call upon Him who thrust not themselves into danger, but bear the danger and calamity into which they are fallen, attending upon their callings. Again, if the unbelieving party shall solicit the other and use all means, both fair and foul, to draw him or her to idolatry, the believing party in this case, may go aside for a time and omit the duty of marriage. For this is all one as if the idolatrous and unbelieving party should depart. For indeed, that party is said to depart in whom the cause of departing is, as in the Church he is a schismatic in whom the cause of the schism is, and not always he that separates. Secondly, it may be objected that a Christian may not become the member of a harlot, much less of an idolator; considering idolatry is a great sin. I answer: The reason is not like. For the fornicator consents to the fornication: and so does not the believing party, by doing duties that pertain to marriage, consent to the idolatry of the unbelieving party. And the fornicator willingly joins himself with an harlot; whereas the believing party desires he might be yoked with a believer and not with an infidel. Lastly, it may be objected: if for adultery, divorce may be made, why not for idolatry which is spiritual adultery? I answer: That not any sin by itself, as it is a sin, not breaking the troth and bond of marriage, is the proper cause of a divorce; and not any kind of idolatry, but the sin of adultery breakest his troth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (London: Legatt, 1626), vol. 1, p. 692</span></figcaption>

e Church he is a schismatic in whom the cause of the schism is, and not always he that separates. Secondly, it may be objected that a Christian may not become the member of a harlot, much less of an idolator; considering idolatry is a great sin. I answer: The reason is not like. For the fornicator consents to the fornication: and so does not the believing party, by doing duties that pertain to marriage, consent to the idolatry of the unbelieving party. And the fornicator willingly joins himself with an harlot; whereas the believing party desires he might be yoked with a believer and not with an infidel. Lastly, it may be objected: if for adultery, divorce may be made, why not for idolatry which is spiritual adultery? I answer: That not any sin by itself, as it is a sin, not breaking the troth and bond of marriage, is the proper cause of a divorce; and not any kind of idolatry, but the sin of adultery breakest his troth.”

uth%2C+a+Moabitess%2C+but+she+was+entered+and+received+into+the+body+of+the+Israelites+by+a+former+marriage%3A+and+she+was+one+that+believed+in+the+God+of+Israel.+%E2%80%98Thy+people%E2%80%99+%28says+he+to+Naomi+and+Ruth%29+%E2%80%98shall+be+my+people%2C+and+thy+God%2C+my+God.%E2%80%99+Sampson+likewise+married+a+woman+of+the+Philistines+%28Judg.+14%3A4%29%2C+but+that+was+by+divine+instinct+and+consequently+by+a+special+appointment+of+God.+Again+it+is+alleged+that+God+by+express+law+gave+leave+to+the+Israelites+to+marry+heathenish+women+taken+captives+in+war.+%28Dt.+21%3A10-11%29+Answer%3A+That+is+a+law+only+of+toleration%2C+without+approbation%2C+in+which+God%2C+for+the+hardness+of+their+hearts%2C+permits+the+evil%2C+which+cannot+by+policy+be+quite+taken+away.+And+this+appears+by+two+things%3A+First%2C+before+the+marriage%2C+the+woman+by+God%E2%80%99s+appointment+must+be+deformed%2C+by+cutting+off+her+hair%2C+by+the+growing+of+her+nails%2C+by+putting+off+the+garments+of+her+captivity%2C+and+by+mourning+for+her+father+and+mother+for+the+space+of+a+month%3A+and+the+end+of+this+was+to+cause+a+dislike+in+the+Israelites+of+their+intended+marriages%2C+or+to+signify+a+change+of+religion%2C+at+the+least+in+pretense%2C+in+the+parties+espoused.+%E2%80%A6+Here+one+exception+must+not+be+omitted.+Put+the+case+that+the+husband+is+an+idolator+and+is+content+to+dwell+with+his+believing+wife%3A+she+then+is+to+live+with+him%2C+not+only+in+the+society+of+peace%2C+but+also+in+the+society+of+amity+by+doing+all+duties+of+Iove+that+concern+a+wife%2C+so+far+as+may+stand+with+good+conscience.+For+the+precept+of+Paul%E2%80%99s%2C+that+marriage+and+marriage+duties+are+to+be+preserved+of+the+believing+party+with+an+infidel+%281+Cor.+7%3A13-14%29%2C+so+be+it+the+said+infidel+be+content.+It+may+be+al%21eged+that+thus+the+believer+exposes+himself+to+danger+of+idolatry.+I+answer%3A+Not+because+God+defends+them+that+call+upon+Him+who+thrust+not+themselves+into+danger%2C+but+bear+the+danger+and+calamity+into+which+they+are+fallen%2C+attending+upon+their+callings.+Again%2C+if+the+unbelieving+party+shall+solicit+the+other+and+use+all+means%2C+both+fair+and+foul%2C+to+draw+him+or+her+to+idolatry%2C+the+believing+party+in+this+case%2C+may+go+aside+for+a+time+and+omit+the+duty+of+marriage.+For+this+is+all+one+as+if+the+idolatrous+and+unbelieving+party+should+depart.+For+indeed%2C+that+party+is+said+to+depart+in+whom+the+cause+of+departing+is%2C+as+in+the+Church+he+is+a+schismatic+in+whom+the+cause+of+the+schism+is%2C+and+not+always+he+that+separates.+Secondly%2C+it+may+be+objected+that+a+Christian+may+not+become+the+member+of+a+harlot%2C+much+less+of+an+idolator%3B+considering+idolatry+is+a+great+sin.+I+answer%3A+The+reason+is+not+like.+For+the+fornicator+consents+to+the+fornication%3A+and+so+does+not+the+believing+party%2C+by+doing+duties+that+pertain+to+marriage%2C+consent+to+the+idolatry+of+the+unbelieving+party.+And+the+fornicator+willingly+joins+himself+with+an+harlot%3B+whereas+the+believing+party+desires+he+might+be+yoked+with+a+believer+and+not+with+an+infidel.+Lastly%2C+it+may+be+objected%3A+if+for+adultery%2C+divorce+may+be+made%2C+why+not+for+idolatry+which+is+spiritual+adultery%3F+I+answer%3A+That+not+any+sin+by+itself%2C+as+it+is+a+sin%2C+not+breaking+the+troth+and+bond+of+marriage%2C+is+the+proper+cause+of+a+divorce%3B+and+not+any+kind+of+idolatry%2C+but+the+sin+of+adultery+breakest+his+troth.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+%E2%80%98A+Warning+Against+the+Idolatry+of+the+Last+Times%2C+%26+an+Instruction+touching+Religious+or+Divine+Worship%E2%80%99+in+The+Works+%28London%3A+Legatt%2C+1626%29%2C+vol.+1%2C+p.+692&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe7179c861a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e7179c861a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-divorce-remarriage/#:~:text=Thirdly%2C%20we%20may%20use%20any%20such,sin%20of%20adult

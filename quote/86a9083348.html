<blockquote><p>1. The root of the difference between the Old Nonconformists and the Conformists was that one sort thought they should stick to the mere Scripture rule and simplicity, and go far from all additions which were found invented or abused by the Papists, in doctrine, worship and government; and the other side thought that they should show more reverence to the customs of the ancient Church, and retain that which was not forbidden in the Scripture, which was introduced before the ripeness of the Papacy, or before the year 600 at least, and which was found lawful in the Roman Church, and common to them with the Greek, that we might not seem singular, odd and humorous, or to go further from the Papists than reason and necessity drave us. And the laity seemed nowhere so sensible of the difference as between the way of ceremony and unceremonious simplicity, and the way of our many short liturgic prayers and offices and the way of free-praying from the present sense and habits of the speaker; while pacificators thought both seasonably good.</p></blockquote>

<blockquote><p>13. The points upon which the Lutheran Churches disagree with us are of two kinds. There are some upon which it is easier to reach agreement: such are the ceremonies of the Lutheran Churches, which may be excused and tolerated, because they concern decorum rather than necessity. Of the same sort also are certain opinions respecting the point of Predestination, upon which, I judge, one might easily draw up an article of the common confession that all would approve without difficulty, provided that curiosity be avoided—which, I believe, has already been done by the Confession of Augsburg [1530], which speaks of it soberly and expressly declines that question. There is also some difference concerning the necessity of baptism, which may rightly and reasonably be affirmed to be necessary to salvation — that is to say, that it is necessary for each person not to despise it — without pressing the question of necessity any further.</p></blockquote>

<blockquote><p>Goodwin’s argument makes as much against Christ and the apostles as against us, for they could never in all their sermons and writings so frequently bottom and found the faith on &lt;Greek&gt; ‘as it is written in the Prophets,’ ‘as David saith,’ ‘as Isaiah saith,’ and Hosea, ‘as Daniel saith,’ as Moses and Samuel, and all the Prophets bear witness, if they had had no other certainty, that the writings of the Prophets, that came to their hands, was the very word of God, but the credit, learning and authority of men, as Mr. [John] Goodwin says, for sure Christ and the apostles and evangelists had not the authentic and first copies of Moses and the prophets, but only copies written by men, who might mistake, printers and translators not being then, more than now, immediately inspired Prophets, but fallibly men, and obnoxious to failings, mistakes and ignorance of ancient Hebraisms and force of words; and if ye remove an unerring providence, who doubts but men might add a &lt;Hebrew&gt; or subtract, and so vitiate the fountain sense? and omit points, change consonants, which in the Hebrew and Greek, both might quite alter the sense: Nor can any say, ‘Christ and the Apostles being infallible, could well cite the prophets without a mistake, though the copies might have been vitiate and corrupt, 2. Because the very citing of these testimonies by Christ and his apostles, made them Scripture, and so of infallible authority; but our citing of them, (since both printers and translators are not immediately inspired, and we also might err) cannot adopt them into canonical and authentic Scripture, such as was first written by the immediately inspired prophets.’ I shall answer that first, this objection presumes that Christ and the apostles might, and did, find errors and mis-printings even in written Scripture, which might reduce the Church in after ages to an invincible ignorance in matters of faith, and yet they gave no notice to the Church thereof; or if there was no error de facto, then for so many hundred years, yet there are now substantial errors, and so foul that it may be we have no Word of God at all, amongst us, and God has no Church, no believer on earth, but we must all take the word of printers and translators, which is merely the word of man: And what is become of all the martyrs that suffered by the bloody woman Babel? They died for mere conjectures and opinions, for they had not the first original copies of Moses and the Prophets, yea Stephen the first martyr, who according to all our copies, Acts 7, adds five to Moses, his 70 souls, that went down to Egypt, in that glorious sermon that he has before his death, when he sealed the truth with his blood and died gloriously, and said, ‘Lord Jesus receive my spirit,’ died but upon the faith of men’s fallible skill in grammar, printing and writing; for he cites the writings of Moses to his enemies that stoned him, according to the copies that they then had, who would quickly have controlled him if he had cited false copies, and Stephen’s own testimony was controverter, and therefore except we say that Stephen and Christ and the apostles cited the testimonies of the prophets as they were then obvious to the eyes and reading of both the people of God and the enemies, and that not simply as their own words which they spake as immediately inspired, but as the testimony of the prophets, according to the then written copies, we must say they spake not ingeniously the truth of God, for it was against truth, candor, ingenuity, to Christ and the apostles to say, ‘as it is written in your Law,’ John 8:17, and so often ‘it is written,’ if they would not have the hearers to receive with certainty of faith and full assurance, free from all doubting and fear of humane fallibility, that what they cited as written, was undoubtedly the same very truth of God, and no other, which Moses and the prophets spoke and wrote; and if they would not have them to read, search and believe these same Scriptures, and to conceive that they drew arguments in the New Testament to prove and confirm their doctrine from that which was written by Moses and the prophets in the Old Testament, and would not have them to believe them, only because New Testament writers immediately inspired had so said.

6. If God will have us to try and examine all spirits, all doctrines, by the Scriptures written, then are we certainly assured that the books we now have of the Old and New Testament, are the very Word of God, though we cannot by any possibility have the first and original authentic copies of Moses and the prophets and apostles. Because 1. God would not bid us try, and then leave us no rule to try withal but our own natural light, which must lead us into darkness.

2. The visible Church should not be guilty of unbelief if the written Word were not among us, or then Christ and his apostles speaking to us, as is clear, John 15:22; Rom. 10:14-15; Mt. 11:21-22. The assumption is clear by the commended practice of the Bereans, who tried Paul’s doctrine by the Scriptures, Acts 17. See Rivetus, Whitaker, Calvin.

3. By the command of God, 1 Thess. 5:2; 1 John 4:1; ‘Try all things,’ ‘try the sprits.’

7. John would not call those blessed who read and hear, Rev. 1:5, nor would Paul recommend reading to Timothy, and continuance in the doctrine of the Scriptures, and so extol the necessity and utility of the Scripture and the indwelling of the word of God in us as he does, 1 Tim. 4:16; 2 Tim. 3:14-16; Col. 3:16, nor could the things written by John ch. 21, by Moses and the prophets, Luke 16:29-31, be holden forth as sufficient to bring souls to heaven, and to cause them eschew Hell, if it were true that we ‘have no certainty that the Scripture of the old and New Testament are the very word of God, but such as is made of men’s credit and learning.’

8. Yea and so what God spake immediately to Abraham, Moses and the prophets, could not be infallibly and by certainty of faith to them the Word of God; for if God spake to them in a language intelligible, they had no certainty of faith that the words that came from God did signify thus and thus; for sure, God, by immediate inspiration, taught them not grammar and significations of words, and those that read the Law written by God’s finger on two tables of stone, those who heard Moses and the prophets preach in their mother-tongue, even the Jews who read the original first Hebrew copy of Moses and the prophets, must have had no warrant that that was the Word of God, but the authority of father, mother and nurses, who first taught them their mother-tongue, for sure the prophets were not school-masters to teach them Hebrew; so by this learning there was never since the world was any certainty of faith, but such conjectural human and fallible opinions in all the matters of God as is resolved ultimately (says Mr. Goodwin) into men’s fallible and topic authority and skill of grammar, and all divine faith is perished out of the earth, except God by a supernatural power taught men first grammar, and then to believe, for which we have no warrant, so all our faith must be dreams. And since Mr. Goodwin acknowledges a supernatural power of the Spirit of grace to believe; what else does this Spirit cause us believe, but lies? or at best fancies resolved into human credit? which may be false for any certainty of knowledge that Libertines allow us? … May not reading, interpunction, a parenthesis, a letter, an accent, alter the sense of all fundamentals in the Decalogue? of the principles of the Gospel? and turn the Scripture in all points (which Mr. Doctour restricts to some few darker places, whose senses are off the way to heaven, and less necessary) in a field of problems, and turn all believing into digladiations of wits? all our comforts of the Scriptures into the reelings of a Windmill, and fancies of seven moons at once in the firmament? this is to put our faith and the first-fruits of the Spirit, and Heaven and Hell to the press. But though printers and pens of men may err, it follows not ‘that heresies should be tolerated,’ except we say, 1. that our faith is ultimately resolved upon characters, and the faith of printers. 2. We must say we have not the clear and infallible word of God, because the Scripture comes to our hand by fallible means, which is a great inconsequence, for though scribes, translators, grammarians, printers, may all err, it follows not that an erring providence of Him that has seven eyes, has not delivered to the Church, the Scriptures containing the infallible truth of God. Say that Baruch might err in writing the prophesy of Jeremiah, it follows not that the prophesy of Jeremiah, which we have, is not the infallible Word of God; if all translators and printers did their alone watch over the Church, it were something, and if there were not one with seven eyes to care for the Scripture. But for tradition, councils, popes, fathers, they are all fallible means, and so far forth to be believed as they bring Scripture with them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, (1649), pp. 333-38</span></figcaption>

 a Windmill, and fancies of seven moons at once in the firmament? this is to put our faith and the first-fruits of the Spirit, and Heaven and Hell to the press. But though printers and pens of men may err, it follows not ‘that heresies should be tolerated,’ except we say, 1. that our faith is ultimately resolved upon characters, and the faith of printers. 2. We must say we have not the clear and infallible word of God, because the Scripture comes to our hand by fallible means, which is a great inconsequence, for though scribes, translators, grammarians, printers, may all err, it follows not that an erring providence of Him that has seven eyes, has not delivered to the Church, the Scriptures containing the infallible truth of God. Say that Baruch might err in writing the prophesy of Jeremiah, it follows not that the prophesy of Jeremiah, which we have, is not the infallible Word of God; if all translators and printers did their alone watch over the Church, it were something, and if there were not one with seven eyes to care for the Scripture. But for tradition, councils, popes, fathers, they are all fallible means, and so far forth to be believed as they bring Scripture with them.”

inspired+prophets.%E2%80%99+I+shall+answer+that+first%2C+this+objection+presumes+that+Christ+and+the+apostles+might%2C+and+did%2C+find+errors+and+mis-printings+even+in+written+Scripture%2C+which+might+reduce+the+Church+in+after+ages+to+an+invincible+ignorance+in+matters+of+faith%2C+and+yet+they+gave+no+notice+to+the+Church+thereof%3B+or+if+there+was+no+error+de+facto%2C+then+for+so+many+hundred+years%2C+yet+there+are+now+substantial+errors%2C+and+so+foul+that+it+may+be+we+have+no+Word+of+God+at+all%2C+amongst+us%2C+and+God+has+no+Church%2C+no+believer+on+earth%2C+but+we+must+all+take+the+word+of+printers+and+translators%2C+which+is+merely+the+word+of+man%3A+And+what+is+become+of+all+the+martyrs+that+suffered+by+the+bloody+woman+Babel%3F+They+died+for+mere+conjectures+and+opinions%2C+for+they+had+not+the+first+original+copies+of+Moses+and+the+Prophets%2C+yea+Stephen+the+first+martyr%2C+who+according+to+all+our+copies%2C+Acts+7%2C+adds+five+to+Moses%2C+his+70+souls%2C+that+went+down+to+Egypt%2C+in+that+glorious+sermon+that+he+has+before+his+death%2C+when+he+sealed+the+truth+with+his+blood+and+died+gloriously%2C+and+said%2C+%E2%80%98Lord+Jesus+receive+my+spirit%2C%E2%80%99+died+but+upon+the+faith+of+men%E2%80%99s+fallible+skill+in+grammar%2C+printing+and+writing%3B+for+he+cites+the+writings+of+Moses+to+his+enemies+that+stoned+him%2C+according+to+the+copies+that+they+then+had%2C+who+would+quickly+have+controlled+him+if+he+had+cited+false+copies%2C+and+Stephen%E2%80%99s+own+testimony+was+controverter%2C+and+therefore+except+we+say+that+Stephen+and+Christ+and+the+apostles+cited+the+testimonies+of+the+prophets+as+they+were+then+obvious+to+the+eyes+and+reading+of+both+the+people+of+God+and+the+enemies%2C+and+that+not+simply+as+their+own+words+which+they+spake+as+immediately+inspired%2C+but+as+the+testimony+of+the+prophets%2C+according+to+the+then+written+copies%2C+we+must+say+they+spake+not+ingeniously+the+truth+of+God%2C+for+it+was+against+truth%2C+candor%2C+ingenuity%2C+t Spirit+cause+us+believe%2C+but+lies%3F+or+at+best+fancies+resolved+into+human+credit%3F+which+may+be+false+for+any+certainty+of+knowledge+that+Libertines+allow+us%3F+%E2%80%A6+May+not+reading%2C+interpunction%2C+a+parenthesis%2C+a+letter%2C+an+accent%2C+alter+the+sense+of+all+fundamentals+in+the+Decalogue%3F+of+the+principles+of+the+Gospel%3F+and+turn+the+Scripture+in+all+points+%28which+Mr.+Doctour+restricts+to+some+few+darker+places%2C+whose+senses+are+off+the+way+to+heaven%2C+and+less+necessary%29+in+a+field+of+problems%2C+and+turn+all+believing+into+digladiations+of+wits%3F+all+our+comforts+of+the+Scriptures+into+the+reelings+of+a+Windmill%2C+and+fancies+of+seven+moons+at+once+in+the+firmament%3F+this+is+to+put+our+faith+and+the+first-fruits+of+the+Spirit%2C+and+Heaven+and+Hell+to+the+press.+But+though+printers+and+pens+of+men+may+err%2C+it+follows+not+%E2%80%98that+heresies+should+be+tolerated%2C%E2%80%99+except+we+say%2C+1.+that+our+faith+is+ultimately+resolved+upon+characters%2C+and+the+faith+of+printers.+2.+We+must+say+we+have+not+the+clear+and+infallible+word+of+God%2C+because+the+Scripture+comes+to+our+hand+by+fallible+means%2C+which+is+a+great+inconsequence%2C+for+though+scribes%2C+translators%2C+grammarians%2C+printers%2C+may+all+err%2C+it+follows+not+that+an+erring+providence+of+Him+that+has+seven+eyes%2C+has+not+delivered+to+the+Church%2C+the+Scriptures+containing+the+infallible+truth+of+God.+Say+that+Baruch+might+err+in+writing+the+prophesy+of+Jeremiah%2C+it+follows+not+that+the+prophesy+of+Jeremiah%2C+which+we+have%2C+is+not+the+infallible+Word+of+God%3B+if+all+translators+and+printers+did+their+alone+watch+over+the+Church%2C+it+were+something%2C+and+if+there+were+not+one+with+seven+eyes+to+care+for+the+Scripture.+But+for+tradition%2C+councils%2C+popes%2C+fathers%2C+they+are+all+fallible+means%2C+and+so+far+forth+to+be+believed+as+they+bring+Scripture+with+them.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Free+Disputation+Against+Pretended+Liberty+of+Conscience%2C+%281649%29%2C+pp.+333-38&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F075824cdf1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/075824cdf1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/original-manuscripts/the-majority-text/#:~:text=Goodwin%E2%80%99s%20argument%20makes%20as%20much%20against,as%20they%20bring%20Scripture%20with%20them&amp;text=Goodwin%E2%80%99s%20argument%20makes%20as%20much%20against%20Christ%20and&amp;text=be%20believed%20as%20they%20bring%20Scripture%20with%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Consecrating of churches is taken two ways:

1. For a mere dedication or civil destination of any thing to its end and use: As when a house is builded, a garment is first put on, when we refresh ourselves with a draught of water, we may pray for a blessing on these [Lk. 9:16], and on all the creatures for our use [1 Tim. 4:4-5]; and the very habitual intention of the builder of an house to dwell in is a civil dedication of it to that use for which it is ordained. Prayer added to it for a blessing of it in the use makes not a consecrated thing; for then my clothes every day put on, my sleep, my daily walking in and out, my physic, my meals, my horse, my ship I sail in, should all be holy, consecrated and religious things, which I were to reverence as religious things; for all these may be blessed in their use. [2.] But here is that [which] we condemn in religious dedication of churches:

1. That the end being sacred, to wit, the habitual worshipping of God in that place.

2. The praying for the church or house of worship, to say nothing of the vain ceremonies used in the dedication of churches: These two are applied to make the church holy and to denominate it the house of God, and capable of religious veneration and salutation [it was the custom of Anglicans to bow to or salute even the architecture or furniture of the church’s building]. Then: [1.] Certainly all the synagogues of Judea should be religiously holy, as was the Temple.

2. And prayers should be more acceptable to God in the synagogue for the house’s sake [as was an Anglican custom for their church buildings], than prayers in any other place.

3. God shall bind Himself by promise to hear prayers in the synagogue, or made with the face toward the synagogue, as He did toward the Temple: we were [then] obliged in the New Testament to pray with our faces toward the churches or meeting places in the New Testament, and we should have one famous and celebrious Church for all Jews and gentiles more holy than all the little holy temples now consecrated as holy places, and where shall this be? And what typical signification shall it have? It must signify Christ to come, or already come; both are unlawful.</p></blockquote>

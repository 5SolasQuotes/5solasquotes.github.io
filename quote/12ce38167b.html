<main class="wrap"><figure class="quote" id="q-12ce38167b" data-kw="">
<blockquote><p>The supposition of a perpetual night, is a dismal gloomy Thought. O what will the Everlasting Darkness of the Infernal Prison be! The Sun by day enlightens the Earth, directs our motion, guides our way, governs our Travail, assists Conversation, awakens Industry, warms the Earth and Air, gives life, and vigour, and fruitfulness to all things under the Sun, and makes the whole Inferior Creation to rejoice. An Emblem of God’s universal Goodness, who is kind to all his Creatures. How admirable is its Lustre! how glorious is its Light! how loudly doth it proclaim his Power and Wisdom! who made this, and the other Lights of Heaven, his powerful Word, and preserves them hitherto by his daily Providence.

If God be now so glorious, contemplated in his works, considered in the lustre of the created Sun, viewed only through the Windows of Sense; how much more glorious will he appear hereafter, when we shall see him face to face, and nothing interpose betwixt us and his incomparable Light! If mine Eyes dazzle to look upon the meridian Sun, in what inaccessible Light must he dwell, who is the Father of Lights? If this lower World, the common receptacle of his Friends and Enemies, have so much of his Glory vouchsafed them by the Heavenly Bodies; O what a place will Heaven be, where shall be no Sun or Moon nor need of any, but the Glory of God shall lighten it, and the Lamb be the Light thereof?</p></blockquote>

</figure><figure class="quote" id="q-babe6f6031" data-kw="">
<blockquote><p>Concerning the mode of creation, insofar as it indeed pertains to the efficient, it must be held that God did not always create—otherwise the creature would be coeternal with the creator. But He began to create at the beginning of time, as Moses speaks, Gen. 1:1, “In the beginning”; from which beginning John speaks, Jn. 1:1, from which beginning creation is called the beginning of Jehovah’s way, Prov. 8:22. And when He began, He did not pass from idleness to work, from potency to act. But the creature, which was in potency, and that only negative, was brought into act and existed in act. …

I. That the creation of individual things was made in an instant, as they say, or moment of time, in respect to God the creator, because in creating He employed the omnipotent Word. … The subject creation concerned were creatures, to be produced by the power of God. The subject, however, in which, there was initially none, because, no creature existing, there existed also no place. Afterward, however, with the creature place began: common indeed to all creatures, the world; proper, however, to certain ones: heaven, water, earth, Gen. 1:1, 14, 20, 24. …

II. Finitude is in place and time. In place, because all creatures, inasmuch as they are finite in essence, occupy some space, whether corporeal or spiritual, according to the condition of their nature, Gen. 1 throughout. In time, because they both began in time, Gen. 1:1, and as long as they exist, they are subject to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>

<blockquote><p>But let us suppose, for I shall not contradict it, that the common determination is right, that God created the world, not necessarily, but freely; not only as freedom is opposite to coaction, and to any extrinsic, imposed necessity, which are unquestionable, but also to an intrinsical necessity, so that his wisdom, and communicative nature, or glory, did not necessitate the creation of the world, but that he so willed to create it, that consideratis considerandis, he might have nilled it, and in this sense did freely create it. I say on this common ground supposed we shall proceed, though I fear such high inquiries myself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unreasonableness of Infidelity</cite>, (London: R.W., 1655), An Advertisement Explicatory, pp. ix-x</span></figcaption>

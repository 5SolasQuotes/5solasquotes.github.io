<blockquote><p>22. And so we must conceive of God by all these following inadequate conceptions, confessing the impropriety, but having no better: I. The essence of God, who in Scripture is called in two words “An Infinite Spirit,” is necessarily conceived of by these three conceptions: 1. [Greek], 2. Vita [life], 3. Perfectio [perfection]. The two first being the substantial conceptus of a spirit, and the third that which answers to all perfective degrees, properties, and accidents in creatures, and comprehends a multitude of perfective attributes; which I express in the abstract, being loath much to use concretes or adjectives of God. Of these, as the first answers to matter in materials and to the genus and substantia abstracte sumpta in spirits, so the second to the form and difference, when yet in God there is no composition or matter. 22. II. And the formal conceptus ‘Vita’ must itself be conceived of in this threefold inadequate conception: 1. Potentia-Actus [power-act], 2. Intellectus [understanding], 3. Voluntas [will]. I call the first Potentia-Actus to avoid concretes, and to signify that as God has no potentia passiva [passive power], so his potentia activa [active power] is not an idle, ceasing power, but in perpetual perfect act; and that act is a most powerful act: so that neither potentia alone, nor actus alone, but both together, are our best conception of this first principle in the Deity. And I take it for granted that even in man’s soul, the potentia vitalis activa [vital active power], the intellect, and the will, are not, as Thomas thought, accidents, but the formal essence of the soul, as the Scotists and Nominalists better say. And I have largely elsewhere proved this, and therefore stand not here upon it. … 25. IV. The essential immanent acts of God are three: 1. Sibi vivere [to live to Himself], or to be essential active life in Himself; 2. Se intelligere [to understand Himself], to know Himself; 3. Se amare [to love Himself], or to be amor sui [self-love].</p></blockquote>

<blockquote><p>Liberty is God willing Himself freely and necessarily, but whatever is besides Himself not necessarily, but freely: that is, not of any necessity of nature, but of his mere good pleasure,† Ps. 115:3; Isa. 49:3; Dan. 4:5. † Scotus, bk. 1, dist. 39: Libera terminatio divinae voluntatis in creaturum potuit adesse vel abesse sine ulla mutabilitate subjectiva in Deo [The free determination of the divine will toward creatures could be present or absent without any subjective change in God.]. [Francis] Smising [Tract on the One God?], tract 2, disp. 3, quest. 1, num. 23. Though nothing be more manifest than that God wills freely and not necessarily whatsoever is besides Himself: yet the manner of his willing thereof exceeds our capacities. Created acts of liberty being limited and bounded by their objects, cannot tend unto diverse objects, without tending to diverse acts: but increated liberty, being infinite, is illimited by its objects and tends unto diverse objects by one and the same act. Increated liberty is not to be looked at as consisting in an indifferency to diverse acts of willing or nilling: For that would argue imperfection in God: but it is clearly seen in respect of its diverse created objects, which, as they have their being from God’s good pleasure, so had He so pleased, they had never been, but continued forever in their nothing, Himself notwithstanding eternal, all blessed and all glorious. Omnipotency is God able to do whatsoever his wisdom does conceive, Gen. 18:14; Mt. 19:26; Isa. 46:10. All contradictions, impossibilities and repugnancies unto the revealed Will of God are excluded in this proposition…</p></blockquote>

<blockquote><p>But as in recognizing the authority of revelation, so in investigating the sense of it, and settling controversies, we must perpetually have recourse to natural theology. Nor can we possibly give our assent to any thing, as a divine revelation which contradicts the light of nature. Wherefore if any doctrine is attempted to be imposed on us as a revealed truth, which is inconsistent with natural theology, we are on that very account to be absolutely certain that it is an imposture, or at least to try if the passages which seem to contain such a doctrine will bear a construction which will remove the inconsistence, for it is impossible that God can contradict Himself. Thus when the Anthropomorphite asserts that the Deity is possessed of a human form, because the Scripture speaks of his face, his eyes, his ears and arms; natural theology at once convinces us of the delusion, teaching us that God is a being absolutely perfect, and therefore must of consequence be immaterial.</p></blockquote>

<blockquote><p>Objection: God might have willed or not willed the being of the creature, else He were not free. He that may both will and not will is mutable. The sum is: the liberty and immutability of God seem not to consist together. Answer: That immutability and liberty consist together is evident from the nature of God, who wills his own being freely. (see [Francis] Smising, [Tract on the One God?] tract 2, disp. 3, quest. 1, num. 23) If he were subject to co-action and mutability, He were not God. If by reason of our weakness we are less able so distinctly to discern the liberty of God as concerning the creature in the act of God willing, yet it is clearly to be seen in the object willed, viz. the creature: because nothing is more manifest then that there is no necessary connection between the being of God and the being thereof. God had been the same, perfect and blessed for ever, though the creature had never been. … God wills Himself freely, yet necessarily; that which acts necessarily, acts with all its might.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Objection: God might have willed or not willed the being of the creature, else He were not free. He that may both will and not will is mutable. The sum is: the liberty and immutability of God seem not to consist together. Answer: That immutability and liberty consist together is evident from the nature of God, who wills his own being freely. (see [Francis] Smising, [Tract on the One God?] tract 2, disp. 3, quest. 1, num. 23) If he were subject to co-action and mutability, He were not God. If by reason of our weakness we are less able so distinctly to discern the liberty of God as concerning the creature in the act of God willing, yet it is clearly to be seen in the object willed, viz. the creature: because nothing is more manifest then that there is no necessary connection between the being of God and the being thereof. God had been the same, perfect and blessed for ever, though the creature had never been. … God wills Himself freely, yet necessarily; that which acts necessarily, acts with all its might.”

— John Norton, The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 9-10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObjection%3A+God+might+have+willed+or+not+willed+the+being+of+the+creature%2C+else+He+were+not+free.+He+that+may+both+will+and+not+will+is+mutable.+The+sum+is%3A+the+liberty+and+immutability+of+God+seem+not+to+consist+together.+Answer%3A+That+immutability+and+liberty+consist+together+is+evident+from+the+nature+of+God%2C+who+wills+his+own+being+freely.+%28see+%5BFrancis%5D+Smising%2C+%5BTract+on+the+One+God%3F%5D+tract+2%2C+disp.+3%2C+quest.+1%2C+num.+23%29+If+he+were+subject+to+co-action+and+mutability%2C+He+were+not+God.+If+by+reason+of+our+weakness+we+are+less+able+so+distinctly+to+discern+the+liberty+of+God+as+concerning+the+creature+in+the+act+of+God+willing%2C+yet+it+is+clearly+to+be+seen+in+the+object+willed%2C+viz.+the+creature%3A+because+nothing+is+more+manifest+then+that+there+is+no+necessary+connection+between+the+being+of+God+and+the+being+thereof.+God+had+been+the+same%2C+perfect+and+blessed+for+ever%2C+though+the+creature+had+never+been.+%E2%80%A6+God+wills+Himself+freely%2C+yet+necessarily%3B+that+which+acts+necessarily%2C+acts+with+all+its+might.%E2%80%9D%0A%0A%E2%80%94+John+Norton%2C+The+Orthodox+Evangelist%E2%80%A6+%28London%3A+Macock%2C+1654%29%2C+ch.+1%2C+%E2%80%98Of+the+Divine+Essence%E2%80%99%2C+pp.+9-10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2ab74cff97.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2ab74cff97.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/god#:~:text=Objection%3A%20God%20might%20have%20willed%20or,necessarily%2C%20acts%20with%20all%20its%20might&amp;text=Objection%3A%20God%20might%20have%20willed%20or%20not%20willed&amp;text=which%20acts%20necessarily%2C%20acts%20with%20all%20its%20might" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c563cf8a32" data-kw="">
<blockquote><p>But if any one alleges that the human mind which is finite cannot possibly comprehend divine things which are infinite, we must here properly distinguish–For if by the word ‘comprehend’ be meant to comprehend perfectly, we are quite agreed. For we are entirely of the opinion that a perfect and adequate knowledge of divine matters is quite inconsistent with the imperfection of the human understanding. But if by ‘comprehending’ be understood a clear and convincing knowledge, to a certain degree, the greatness of the objects in such enquiries is by no means inconsistent with this kind of knowledge. For what can the mind conceive greater than eternity? when we attempt to have a full and adequate conception of it, our understanding is quite aborbed by the idea: and yet that there is such a thing as eternity is one of the clearest and most evident truths, as we shall demonstrate in its proper place.</p></blockquote>

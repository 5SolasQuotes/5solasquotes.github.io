<blockquote><p>I answer: though the Lord give us no particular promise in his Word, yet He gives us that which is equally effectual, and of like force; namely his general promise without any limitation, exception or condition, but the condition of faith and repentance, with a commaundment to apply the same. And because naturally we are unable in ourselves to perform this, therefore He has ordained the ministry of the Word, and the use of the sacraments, which He makes effectual by the inward operation of his Spirit, for the begetting and confirming of our faith, and stirring us up to repentance; which being wrought in us, we may as certainly be persuaded that the general promises belong unto us, as if they were made unto us particularly and by name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Warfare</cite>, … (London, 1604), bk. 2, ch. 12, ‘The reasons alledged against the assurance ofour salvation, answered’, p. 271</span></figcaption>

</figure><figure class="quote" id="q-4866fffea8" data-kw="">
<blockquote><p>3rd Exception: They [Papists] say, we are indeed to believe our salvation on God’s part: but we must needs doubt in regard of ourselves: because the promises of remission of sins are given upon condition of man’s faith and repentance. Now we cannot (say they) be assured that we have true faith and repentance, because we may lie in secret sins, and so want that indeed which we suppose ourselves to have. Answer: I say again, he that does truly repent and believe, does by God’s grace know that he does repent and believe: for else Paul would never have said, ‘Prove yourselves whether you be in the faith or not:’ and the same apostle says, 2 Cor. 12, ‘We have not received the spirit of the world, but the Spirit which is of God, that we might know the things which are given of God:’ which things are not only life everlasting, but justification, sanctification, and such like. And as for secret sins, they cannot make our repentance void: for he that truly repents of his known sins, repents also of such as be unknown, and receives the pardon of them all. God requires not an express or special repentance of unknown sins; but accepts it as sufficient, if we repent of them generally: as David says, Ps. 19. ‘Who knows the errors of this life: forgive me my secret sins.’ And whereas they add that faith and repentance must be sufficient, I answer that the sufficiency of our faith and repentance stands in the truth and not in the measure or perfection thereof; and the truth of both where they are, is certainly discerned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, ... (Cambridge, 1598), 3rd Point, Certainty of Salvation, ‘Our Reasons to the Contrary’, pp. 56-57</span></figcaption>

<blockquote><p>19. Because of this receiving, calling is termed conversion, Acts 26:20. All who obey the call of God are completely turned from sin to grace and from the world to follow God in Christ. It is also called regeneration or the very beginning of a new life, a new creation, a new creature–and it is often described in the Scriptures, Jn. 1:13; 3:6; 1 Jn. 3:9; 1 Pet. 1:23 and 2:2…

20. As for man, receiving is either passive or active. Phil. 3:12, ‘I apprehend, because I have been apprehended.’

21. The passive receiving of Christ is the process by which a spiritual principle of grace is generated in the will of man. Eph. 2:5, ‘He has quickened.’ …

30. Repentance has the same causes and principles as faith, for they are both free gifts of God. Eph. 2:8, ‘Faith is the gift of God;’ 2 Tim. 2:25, ‘Whether God may at some time give them repentance.’ They have the same subject; both have their seat in the heart or will of man. Rom. 10:9; 1 Kn. 8:48, ‘With the heart man believes.’ ‘They shall come back with all their heart.’ They are also begotten at the same time. But, first, they have diverse objects, for faith is properly directed to Christ and through Christ to God, but repentance is directed to God Himself who has been offended by the sin. Acts 20:21, ‘Turning towards God and faith in our Lord Jesus Christ.’ Second, they have diverse ends, for faith properly seeks reconciliation with God but repentance compliance with the will of God. Rom. 3:25, ‘A reconciliation through faith in his blood;’ Acts 26:20, ‘That they should… turn to God doing works fit for repentance.’

31. Repentance, so far as it comprises the care, anxiety, and terror connected with the law, precedes faith in order of nature, as a preparing and disposing cause, and is even found in the unregenerate; but insofar as it turns man away effectively and genuinely from sin, by which God is offended, it follows faith and depends upon it as an effect upon its cause and so belongs to those who have faith. … 34. Repentance is likely to be known before faith, because a sinner cannot easily persuade himself that he is reconciled to God in Christ before he feels himself to have left those sins which separated him from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, ed. tr. John Eusden (Labyrinth Press, 1983), bk. 1, ch. 26, ‘Calling’, pp. 158-60</span></figcaption>

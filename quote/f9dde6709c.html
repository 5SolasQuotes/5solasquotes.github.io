<main class="wrap"><figure class="quote" id="q-f9dde6709c" data-kw="">
<blockquote><p>Just as God is most wise, unchangeable, all-knowing, and almighty, so the election made by him can neither be suspended nor altered, revoked, or annulled; neither can God’s chosen ones be cast off, nor their number reduced.</p></blockquote>

</figure><figure class="quote" id="q-ab49ef4f0f" data-kw="good pleasure election">
<blockquote><p>The orthodox maintain that the good pleasure (eudokian) alone has place and think that no other cause can either be given or rightly sought. But the adversaries (who cherish Pelagianism or semi-Pelagianism) suppose that others also can come in order: for instance, either Christ and his merit, or the foresight of faith and works.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-498d889bda" data-kw="">
<blockquote><p>‘The honor rendered to the image passes to the prototype,’ to the model or original… This is the locus classicus of the defenders of the images in the Byzantine Iconoclastic Controversy… The sentence just cited is taken from St. Basil’s late fourth century anti-Arian treatise On the Holy Spirit, where it had served to illustrate the unifying image relation of the Son to the Father in the Divine Trinity, a relation first expressed by St. Paul when he said that Christ was the Image of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gerhart-b-ladner.html">Gerhart B. Ladner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Concept of the Image in the Greek Fathers &amp; the Byzantine Iconoclastic Controversy’ in Dumbarton Oaks Papers</cite>, vol. 7 (1953), pp. 3-34, p. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-144d96d337" data-kw="">
<blockquote><p>The whole place shows it was God: but He is called an angel, that we might know that He which was seen, was not God the Father (for whose angel should the Father be) but the only begotten Son of God, which is the Angel of the great Counsel, which said to his holy apostles, ‘All things which I have heard of my Father, I have declared unto you.’ And even as He gave Him the name of an angel, not meaning thereby to note any other minister or messenger, but to show the Person of the only begotten Son: so again he sets forth both his nature and power, saying He said: ‘I AM THAT I AM,’ and ‘I the God of Abraham, the God of Isaac, the God of Jacob’…</p></blockquote>

</figure><figure class="quote" id="q-f61059cb55" data-kw="">
<blockquote><p>If we had the true portrait and very resemblance of our Saviour Christ, taken from his own body, what account ought we to make of it? Had I such a picture, I would keep it as most precious, not only above all other painting, but as one of the most worthy objects of man’s sight: But I would ever make more account of the least Christian than of such a picture: For a Christian represents Christ a great deal better then any paint. A true human body animated not only with a reasonable soul, but also with the spirit of Christ, does it not more resemble Christ than a dead crucifix, or a shape that expresses nothing but some superficial lineaments? I say more: That if one would abuse this picture and idolatrize it, I would do by it as Hezekiah did by the brazen serpent, 2 Kings 18:14. . A notable difference betwixt one of the figures which represented Christ and those that represented the angels, and a consideration upon the matter. In the Old Testament Christ was figured by the image of a serpent set upon a pole, without the Tabernacle, in an open place: But the angels were figured by the faces of men, having wings, placed over the ark itself, in the most holy of Holies. If we consider these figures and their placing, that of Christ’s was greatly inferior unto that of the angels: and if the true image of Christ did consist in outward lineaments, a human shape had been fitter there than that of a serpent. . Whence is it that in the Apocalypse, Jesus Christ (being man) is deciphered only in parabolical figures rather than in the natural form of his own body? We see him appear with seven stars in his right hand, and a two-edged sword going forth of his mouth: We see him clad with a robe dipped in blood, and mounted upon a white horse: We see him in the shape of a lamb slain, having seven eyes and seven horns. But we never see him there, or in any other place of the holy history, in the figure of his own natural visage: To teach us that we ought rather to seek Him in the description of his graces than in the idea of the feature of his visage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-d-espagne.html">Jean D’Espagne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>New Observations upon the Decalogue</cite>, … (London, 1652), 2nd Commandment. D’Espagne (1591-1659) was a French, reformed minister who lived for a significant amount of time in London., pp. 55-58</span></figcaption>

</figure><figure class="quote" id="q-238d431ef1" data-kw="">
<blockquote><p>It is known that this duty is frequently enjoined and prescribed unto us: Col. 3:5, “Mortify therefore your members which are upon the earth; fornication, uncleanness, inordinate affection, evil concupiscence, and covetousness, which is idolatry.” … The “members that are upon the earth” are our affections: for in the outward part of the body sin is not seated; in particular, not “covetousness,” which is there enumerated, to be mortified amongst our members that are on the earth. Yea, after grace hath taken possession of the soul, the affections do become the principal seat of the remainders of sin.… Hence the great duty of mortification is chiefly directed to take place upon the affections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Mortification of Sin in Believers, on Col. 3:5 (covetousness which is idolatry)</span></figcaption>

<blockquote><p>I answer, not only in the beginning of our conversion, but also in the continuance and final accomplishment thereof. For here Paul desires in the day of judgment to stand before God only by the justice of faith without his own justice of the law. And Paul brings in Abraham (as I have noted before) in the very midst of godly conversation and holy obedience to be justified without any works by his faith in the Messiah [Rom. 4:2–3]. And Paul avouches three things of faith: (1) by it ‘we have access’ to the grace of God; (2) by it we ‘stand in the same grace’; (3) by it ‘we rejoice under the hope of glory’ [Rom. 5:2]. Thus then, we see there is only one way of justification, namely that we are justified and accepted of God to life eternal through grace alone by faith alone for Christ alone in the beginning, middle, and end of our conversion. And here is plainly discovered the error of the Church of Rome. It makes a double justification: the first [is] whereby the sinner is made of an evil man a just man, and this (they say) is by faith alone; [and] the second is whereby a man of a just man is made more just, and this (they say) is by faith and works together. But [they speak] falsely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, 9:65–66.</span></figcaption>

<blockquote><p>14. No man is saved or justified but by the proper merit of Christ’s perfect obedience; yea, and his habitual holiness and satisfactory sufferings, advanced in dignity by his divine perfection. 15. This merit, as related to us, supposes that Christ, as a sponsor, was the Second Adam, the Root of the justified, the reconciling Mediator, who obeyed perfectly with that intent that by his obedience we might be justified; and who suffered for our sins, in our room and stead; and so was in tantum [to that extent] our Vicarius poenae, as some phrase it, or substitute; and was made a curse for us, that we might be healed by his stripes; as He was obedient, that his righteousness might be the reason as a meritorious cause of our justification: which supposes the relation of an undertaking Redeemer, in our nature doing this, and in our stead so far forth, as that therefore perfect obedience should not be necessary to be performed by ourselves: And righteousness therefore is imputed to us, that is, we are truly reputed righteous, because we, as believing members of Christ, have right to impunity and life, as merited by his righteousness, and freely given to all penitent believers. And Christ’s own righteousness may be said so far to be imputed to us, as to be reckoned or reputed the meritorious cause of our right or justification, as aforesaid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Catholic Theology, Plain, Pure, Peaceable</cite>, ... (London: White, 1675), ‘An Appendix to this Premonition,’ n.p.</span></figcaption>

<blockquote><p>3. Likewise, it is quite clear that adults do not obtain these blessings of Christ, except by the prevenient movement of the Holy Spirit, by which their mind and will are moved to hate sin. For, as St. Augustine says, it is impossible to begin a new life if we do not repent of the former one. Likewise, in the last chapter of Luke [24:47], Christ commands that repentance and forgiveness of sin should be preached in his name. Also, John the Baptist, sent to prepare the way of the Lord, preached repentance, saying [Matt. 3:2]: ‘Repent [Poenitentiam agite], for the kingdom of heaven is drawing near.’ Next, man’s mind is moved toward God by the Holy Spirit through Christ and this movement is through faith. Through this man’s mind believes with certainty all that God has transmitted [tradita], and also with full certainty and without doubt assents to the promises made to us by God who, as stated in the psalm [144:13], is faithful in all his words. From there he acquires confidence [fiduciam] on account of God’s promise, by which he has pledged that he will remit sins freely and that he will adopt as children those who believe in Christ, those I say who repent of their former life. By this faith, he is lifted up to God by the Holy Spirit and so he receives the Holy Spirit, remission of sins, imputation of righteousness and countless other gifts. 4. So it is a reliable and sound doctrine that the sinner is justified by living and efficacious faith, for through it we are pleasing and acceptable to God on account of Christ. And living faith is what we call the movement of the Holy Spirit, by which those who truly repent of their old life are lifted up to God and truly appropriate the mercy promised in Christ, so that they now truly recognize that they have received the remission of sins and reconciliation on account of the merits of Christ, through the free [gratuita] goodness of God, and cry out to God: Abba Father’. But this happens to no one unless also at the same time love is infused [infundatur] which heals the will so that the healed will may begin to fulfil the law, just as Saint Augustine said [Of the Spirit &amp; Letter, ch. 9,15]. So living faith is that which both appropriates mercy in Christ, believing that the righteousness which is in Christ is freely imputed to it, and at the same time receives the promise of the Holy Spirit and love. Therefore the faith that truly justifies is that faith which is effectual through love [Gal. 5:6]. Nevertheless it remains true that it is by this faith that we are justified (i.e. accepted and reconciled to God) inasmuch as it appropriates the mercy and righteousness which is imputed to us on account of Christ and his merit, not on account of the worthiness or perfection of the righteousness imparted [communicatae] to us in Christ. 5. Although the one who is justified receives righteousness and through Christ also has inherent [righteousness], as the apostle says [1 Cor. 6:11]: ‘you are washed, you are sanctified, you are justified, etc.’ (which is why the holy fathers made use of [the term] ‘to be justified’ even to mean ‘to receive inherent righteousness’), nevertheless, the faithful soul depends not on this, but only on the righteousness of Christ given to us as a gift, without which there is and can be no righteousness at all. And so by faith in Christ we are justified or reckoned to be righteous, that is we are accepted through his merits and not on account of our own worthiness or works. And on account of the righteousness inherent in us we are said to be righteous, because the works which we perform are righteous, according to the saying of John [1 John 3:7]: ‘whoever who does what is right is righteous’. … 10. Now those who say that we are justified by faith alone should at the same time teach the doctrine of repentance, of the fear of God, of the judgement of God and of good works, so that all the chief points of the preaching may remain firm, as Christ said: ‘preaching repentance and the remission of sins in my name’ [Luke 24:47]. And that is to prevent this way of speaking [i.e. sola fide] from being understood other than has been previously mentioned.</p></blockquote>

— Regensburg Agreement of, Article 5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+Likewise%2C+it+is+quite+clear+that+adults+do+not+obtain+these+blessings+of+Christ%2C+except+by+the+prevenient+movement+of+the+Holy+Spirit%2C+by+which+their+mind+and+will+are+moved+to+hate+sin.+For%2C+as+St.+Augustine+says%2C+it+is+impossible+to+begin+a+new+life+if+we+do+not+repent+of+the+former+one.+Likewise%2C+in+the+last+chapter+of+Luke+%5B24%3A47%5D%2C+Christ+commands+that+repentance+and+forgiveness+of+sin+should+be+preached+in+his+name.+Also%2C+John+the+Baptist%2C+sent+to+prepare+the+way+of+the+Lord%2C+preached+repentance%2C+saying+%5BMatt.+3%3A2%5D%3A+%E2%80%98Repent+%5BPoenitentiam+agite%5D%2C+for+the+kingdom+of+heaven+is+drawing+near.%E2%80%99+Next%2C+man%E2%80%99s+mind+is+moved+toward+God+by+the+Holy+Spirit+through+Christ+and+this+movement+is+through+faith.+Through+this+man%E2%80%99s+mind+believes+with+certainty+all+that+God+has+transmitted+%5Btradita%5D%2C+and+also+with+full+certainty+and+without+doubt+assents+to+the+promises+made+to+us+by+God+who%2C+as+stated+in+the+psalm+%5B144%3A13%5D%2C+is+faithful+in+all+his+words.+From+there+he+acquires+confidence+%5Bfiduciam%5D+on+account+of+God%E2%80%99s+promise%2C+by+which+he+has+pledged+that+he+will+remit+sins+freely+and+that+he+will+adopt+as+children+those+who+believe+in+Christ%2C+those+I+say+who+repent+of+their+former+life.+By+this+faith%2C+he+is+lifted+up+to+God+by+the+Holy+Spirit+and+so+he+receives+the+Holy+Spirit%2C+remission+of+sins%2C+imputation+of+righteousness+and+countless+other+gifts.+4.+So+it+is+a+reliable+and+sound+doctrine+that+the+sinner+is+justified+by+living+and+efficacious+faith%2C+for+through+it+we+are+pleasing+and+acceptable+to+God+on+account+of+Christ.+And+living+faith+is+what+we+call+the+movement+of+the+Holy+Spirit%2C+by+which+those+who+truly+repent+of+their+old+life+are+lifted+up+to+God+and+truly+appropriate+the+mercy+promised+in+Christ%2C+so+that+they+now+truly+recognize+that+they+have+received+the+remission+of+sins+and+reconciliation+on+account+of+the+merits+of+Christ%2C+through+the+free+%5Bgratuita%5D+goodness+of+God%2C+and+cry+out+to+God%3A+Abba+Father%E2%80%99.+But+this+happens+to+no+one+unless+also+at+the+same+time+love+is+infused+%5Binfundatur%5D+which+heals+the+will+so+that+the+healed+will+may+begin+to+fulfil+the+law%2C+just+as+Saint+Augustine+said+%5BOf+the+Spirit+%26+Letter%2C+ch.+9%2C15%5D.+So+living+faith+is+that+which+both+appropriates+mercy+in+Christ%2C+believing+that+the+righteousness+which+is+in+Christ+is+freely+imputed+to+it%2C+and+at+the+same+time+receives+the+promise+of+the+Holy+Spirit+and+love.+Therefore+the+faith+that+truly+justifies+is+that+faith+which+is+effectual+through+love+%5BGal.+5%3A6%5D.+Nevertheless+it+remains+true+that+it+is+by+this+faith+that+we+are+justified+%28i.e.+accepted+and+reconciled+to+God%29+inasmuch+as+it+appropriates+the+mercy+and+righteousness+which+is+imputed+to+us+on+account+of+Christ+and+his+merit%2C+not+on+account+of+the+worthiness+or+perfection+of+the+righteousness+imparted+%5Bcommunicatae%5D+to+us+in+Christ.+5.+Although+the+one+who+is+justified+receives+righteousness+and+through+Christ+also+has+inherent+%5Brighteousness%5D%2C+as+the+apostle+says+%5B1+Cor.+6%3A11%5D%3A+%E2%80%98you+are+washed%2C+you+are+sanctified%2C+you+are+justified%2C+etc.%E2%80%99+%28which+is+why+the+holy+fathers+made+use+of+%5Bthe+term%5D+%E2%80%98to+be+justified%E2%80%99+even+to+mean+%E2%80%98to+receive+inherent+righteousness%E2%80%99%29%2C+nevertheless%2C+the+faithful+soul+depends+not+on+this%2C+but+only+on+the+righteousness+of+Christ+given+to+us+as+a+gift%2C+without+which+there+is+and+can+be+no+righteousness+at+all.+And+so+by+faith+in+Christ+we+are+justified+or+reckoned+to+be+righteous%2C+that+is+we+are+accepted+through+his+merits+and+not+on+account+of+our+own+worthiness+or+works.+And+on+account+of+the+righteousness+inherent+in+us+we+are+said+to+be+righteous%2C+because+the+works+which+we+perform+are+righteous%2C+according+to+the+saying+of+John+%5B1+John+3%3A7%5D%3A+%E2%80%98whoever+who+does+what+is+right+is+righteous%E2%80%99.+%E2%80%A6+10.+Now+those+who+say+that+we+are+justified+by+faith+alone+should+at+the+same+time+teach+the+doctrine+of+repentance%2C+of+the+fear+of+God%2C+of+the+judgement+of+God+and+of+good+works%2C+so+that+all+the+chief+points+of+the+preaching+may+remain+firm%2C+as+Christ+said%3A+%E2%80%98preaching+repentance+and+the+remission+of+sins+in+my+name%E2%80%99+%5BLuke+24%3A47%5D.+And+that+is+to+prevent+this+way+of+speaking+%5Bi.e.+sola+fide%5D+from+being+understood+other+than+has+been+previously+mentioned.%E2%80%9D%0A%0A%E2%80%94+Regensburg+Agreement+of%2C+Article+5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3e250a42f4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3e250a42f4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/justification#:~:text=3.%20Likewise%2C%20it%20is%20quite%20clear,other%20than%20has%20been%20previously%20mentioned&amp;text=3.%20Likewise%2C%20it%20is%20quite%20clear%20that%20adults&amp;text=being%20understood%20other%20than%20has%20been%20previously%20mentioned" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-502fe444b3" data-kw="">
<blockquote><p>If at this day we should take a survey of the several professions of Christianity that have any large spread in any part of the world (as of the religion of the Roman and the Reformed Churches in our quarters, of the Egyptians and Ethiopians in the South, of the Grecians and other Christians in the Eastern parts) and should put-by the points wherein they differ one from another, and gather into one body the rest of the articles wherein they do all generally agree, we should find that in those propositions which without all controversy are universally received in the whole Christian world, so much truth is contained, as being joined with holy obedience, may be sufficient to bring a man unto everlasting salvation. Neither have we cause to doubt, but that as many as do walk according to this rule (neither overthrowing that which they have builded by superinducing any damnable heresies thereupon, nor otherwise vitiating their holy faith with a lewd and wicked conversation), peace shall be upon them and mercy, and upon the Israel of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Opinions of Certain Reverend &amp; Learned Divines concerning the Fundamental Points of the True Protestant Religion, &amp; the Right Government of Reformed Churches</cite>, ([Oxford] Downes, 1643), ‘The Judgment of… Lord Archbishop of Armagh, delivered in a Sermon of his preached before King James at Wansted, June 20th, 1624’, pp. 6-7</span></figcaption>

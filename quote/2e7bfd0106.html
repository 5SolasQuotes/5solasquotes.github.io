<blockquote><p>The many ethical gradations of common life arise from the intermix of the natural teleologies of our variegated and shuffling circumstances, according to their qualities, weights and proportions, mixed with the same in positive laws. Upright common sense (or practical reason) tends to accurately recognize moral judgments before one can formally articulate and intellectually conclude the sometimes complex moral principles involved² (Ps. 119:66; Rom. 2:14-15; Lk. 10:36-37; 14:5; Jn. 3:21; 1 Cor. 10:15; 14:37; 1 Jn. 1:1-4; 2:20; 3:9-10, 18-19). In this respect philosophy ought to confirm and validate common sense. ² An example is posing a hypothetical situation for moral judgment. Usually the moral judgment is made quickly based on one’s moral sensibilities, and rationalizations are then come up with to justify the moral judgment. This article has constantly posed such scenarios, appealing to persons’ upright common sense, leaving the principles of why such is right to be worked out (as has been done). It is believed the principles laid out in this article do exactly that (albeit imperfectly due to my own unskillful dullness), and reflect and synthesize the gradations of ethical living in common life better…</p></blockquote>

2e7bfd0106.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-human-soul/#:~:text=The%20many%20ethical%20gradations%20of%20common,ethical%20living%20in%20common%20life%20better&amp;text=The%20many%20ethical%20gradations%20of%20common%20life%20arise&amp;text=gradations%20of%20ethical%20living%20in%20common%20life%20better" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Definition [of Ontological Goodness] Just as ontological truth states the relation of being to the cognitive faculty, so goodness involves a relation to the appetitive faculty or the will. Just as the former consists in the knowability of being, so the latter consists in being’s appetibility. Hence it is defined as the property of being whereby it is made appetible or willable or, more briefly, it is appetibility or willability. On other interpretations of ontological goodness see what I wrote elsewhere (Wolter, Transcendentals, p.199 ff.). On the Convertibility of Ontological Goodness Conclusion 29: Every being is good, or being and good convert. The appetite or will tends to its object either because the object is perfect for it, namely insofar as it has the being-ness and perfection due to it (love of benevolence), or because the object confers perfection on another (love of concupiscence). As far as God is concerned, it is plain that he is altogether perfect and so supremely appetible both to himself and to another. As far as creatures are concerned, one must say that they are truly loved or willed by God himself, otherwise they would not exist; therefore they are lovable or willable. Further, creatures are also good for other creatures; for example substance upholds accidents, accidents give further perfection to substance, etc.</p></blockquote>

<blockquote><p>Aquinas and other Scholastic philosophers often employ the principle agere sequitur esse (Latin for “action follows being”). The basic idea is that what a thing does necessarily reflects what it is. Eyes and ears function differently because they are structured differently. Plants take in nutrients, grow, and reproduce while stones do none of these things, because the former are living things and the latter are inanimate… The PPC [Principle of Proportionate Causality] tells us, again, that whatever is in the thing that changes or comes to exist must in some way have been in the total set of factors that brought about this change or existent. In this sense, the effect cannot go beyond the cause. A formal cause is the nature of a thing, that which makes it the kind of thing it is… The principle agere sequitur esse basically says that these attributes and activities cannot go beyond that nature, any more than an effect can go beyond its efficient cause. Hence, a stone cannot exhibit attributes and activities like nutrition, growth, and reproduction, because these go beyond the nature of a stone. Anything that could do these things wouldn’t be a stone in the first place. The principle agere sequitur esse, like the PPC, follows from the PSR [Principle of Sufficient Reason, that everything has a sufficient reason for it]. If an effect could go beyond its total efficient cause, then the part of the effect that went beyond it would have no explanation and be unintelligible. Similarly, if a thing’s activities could go beyond its nature—if, for example, a stone could take in nutrients or use language—then this activity would lack an explanation and be unintelligible… …even a materialist could agree that if intellectual activity were immaterial, then the thing which carries out that activity would itself have to be immaterial. And indeed, the naturalist philosopher John Searle takes precisely that view in criticizing a theory known as property dualism. Property dualism holds that mental properties are immaterial but that they are nevertheless properties of a material thing —namely, the brain. The theory is essentially an attempt to acknowledge the problems with materialist theories of the mind without having to accept the dualist view that the mind is an immaterial thing. Searle’s criticism is that the theory is unstable. If the property dualist maintains that a mental property is something ‘over and above’ the brain, then the trouble in Searle’s view is that such a property cannot be a property of the brain, but must be ‘a separate thing, object, or non-property type of entity’. On the other hand, if a mental property really is a property of the brain, then it cannot be something ‘over and above’ the brain. Other critics of property dualism have complained that it is mysterious how an entirely material thing like the brain could give rise to immaterial properties.</p></blockquote>

ks Online</a></div>

<blockquote><p>The intellect is that power by which we are able to entertain concepts, to affirm the truth or falsity of propositions, and to assess the cogency of arguments… A further distinction traditionally drawn in Aristotelian-Thomistic philosophy is that between the external senses and the internal senses, both of which are typically possessed by sentient organisms. The external senses are the familiar ones: sight, hearing, taste, smell, and touch… The internal senses are the synthetic sense, instinct, the imagination, and sensory imagery. Some of the jargon may be unfamiliar, but the capacities it refers to are not. The synthetic sense is what unifies the deliverances of the five external senses into a coherent conscious experience… Instinct is also known as the ‘estimative power,’… the capacity of an organism to apprehend something sensed as either beneficial or harmful, and to be inclined, accordingly, either to pursue it or to avoid it… The imagination, in the sense we are concerned with, is the capacity to form images… understood as copies of what we experience in sensation… Sensory memory retains what is known via instinct or the estimative power, just as imagination retains what is sensed… It is not terribly controversial that sentient organisms possess something like the capacities just described… …a dog can see a triangle, but it does not conceptualize it as a closed plane figure with three straight sides… For that reason, it does not entertain propositions about triangles or human beings, much less reason from one proposition to other propositions. But a dog can do things like instinctively estimate the piece of food a particular human being is holding out to it as desirable, and thus be inclined to approach it. It can have images of sights, odors, tastes and the like that it has experienced in the past triggered in its consciousness. It can by virtue of such experience come to associate a certain human being with food, and thereby be moved in future to seek that human being out. Of course, human beings… do conceptualize the deliverances of these senses.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The intellect is that power by which we are able to entertain concepts, to affirm the truth or falsity of propositions, and to assess the cogency of arguments… A further distinction traditionally drawn in Aristotelian-Thomistic philosophy is that between the external senses and the internal senses, both of which are typically possessed by sentient organisms. The external senses are the familiar ones: sight, hearing, taste, smell, and touch… The internal senses are the synthetic sense, instinct, the imagination, and sensory imagery. Some of the jargon may be unfamiliar, but the capacities it refers to are not. The synthetic sense is what unifies the deliverances of the five external senses into a coherent conscious experience… Instinct is also known as the ‘estimative power,’… the capacity of an organism to apprehend something sensed as either beneficial or harmful, and to be inclined, accordingly, either to pursue it or to avoid it… The imagination, in the sense we are concerned with, is the capacity to form images… understood as copies of what we experience in sensation… Sensory memory retains what is known via instinct or the estimative power, just as imagination retains what is sensed… It is not terribly controversial that sentient organisms possess something like the capacities just described… …a dog can see a triangle, but it does not conceptualize it as a closed plane figure with three straight sides… For that reason, it does not entertain propositions about triangles or human beings, much less reason from one proposition to other propositions. But a dog can do things like instinctively estimate the piece of food a particular human being is holding out to it as desirable, and thus be inclined to approach it. It can have images of sights, odors, tastes and the like that it has experienced in the past triggered in its consciousness. It can by virtue of such experience come to associate a certain human being with food, and thereby be moved in future to seek that human being out. Of course, human beings… do conceptualize the deliverances of these senses.”

<blockquote><p>Human acts are the acts of the will directed by reason. They are either elicited, that is, produced by the will itself, or commanded, that is, produced by some other faculty under the influence of the will. Elicited acts are concerned either with the end or with the means. Three acts are concerned with the end: a) simple velleity, not yet efficacious; b) efficacious intention of the end; c) joy in the end attained. Two acts are concerned with means: a) consent, which accepts means; b) choice of a determined set of means. Each of these five acts of the will is preceded by a directive act of the intellect. Simple velleity, by the knowledge of the good in question; intention, by a judgment that this end should be attained; consent, by counsel; choice, by the last practical judgment which terminates deliberation. After voluntary choice there follows, in the intellect, the act called imperium, which directs the execution of the means chosen, ascending from lower means to those higher and nearer to the end to be obtained, in order inverse to that of intention, which descends from the desired end to the means which come first in execution. After the intellect’s imperium there follows in the will the act called active use, which sets the other faculties to work. These acts of the other faculties, called passive use, are, properly speaking, commanded acts of the will. And the will’s last act is that of joy in the possession of the end obtained. The end, which was first in the order of intention, is the last in the order of execution. … By the term ‘interior’ act St. Thomas often means an act which does not arise from a previous act, the first act, for example, of willing an end. By opposition, then, ‘exterior act’ often means not only the act of the corporeal members, but also an act of the will itself, if this act arises from a preceding act, as when, for example, we will the means because we already will the end. Here we must remark, further, that a human act, voluntary and free, is not necessarily preceded, if we speak precisely, by a discursive deliberation, but may be the fruit of a special inspiration, superior to human deliberation. But, even here, the act is free… because the will consents to follow the inspiration. Here lies the difference between the virtue of prudence, which presupposes discursive deliberation, and the gifts which make man prompt and docile to the inspirations of the Holy Ghost. These latter acts, free but not in the proper sense deliberate [deliberative], are the fruit, as we shall see later, not of co-operating grace, but of operating grace.</p></blockquote>

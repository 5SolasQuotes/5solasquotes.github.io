<blockquote><p>Krause shows in detail how resourcefully the young Aquinas developed his understanding of the beatific vision, on the shoulders of giants: his teacher Albert the Great, as well as Aristotle, Avicenna, and Averroes on the one hand, Augustine and pseudo-Dionysius on the other.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e3c4b7bc33" data-kw="">
<blockquote><p>Life Eternal is the life of glory, wherein the soul, joined to our body, enjoys God forever, being advanced to the highest top and height of her felicity. The Cause of this life is God, to wit, the Father the efficient, the Son the meritorious, and the Holy Ghost the sealing and applying cause. The Matter, which has the respect of the subject, are those good things, which neither eye has seen, nor ear heard, nor can the mind of man comprehend. That which is of the Object, are all the blessed and elect. The Form is the most perfect knowledge, vision, and fruition of God Himself, and the exceeding felicity &amp; blessedness of man, which accompanies the same, which also consists both in the separation, and absence of all evil things, and in the participation, and presence of all good things; both are both perfect and eternal. The End is the glory of God’s grace, and the glorifying of the elect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity… (London, 1610), bk. 3, ch. 8, ‘Of Man’s Estate After this Life’ | The Part Confirming</cite>, pp. 589-90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

nk">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-80e7476069" data-kw="">
<blockquote><p>The Reformed acknowledge that Christ truly died, and therefore the natural union of the body and soul was taken away for those three days, and hence he was also certainly a dead man, but yet he was also a man in the true and proper sense, because otherwise: [Mastricht gives eight Scriptural and theological reasons]… If they should allege to the contrary that with the union of the essential parts of the body and soul taken away, a man in the true and proper sense would not survive, then I would grant that, with all union of those parts taken away, a man in the true and proper sense would not survive, but since, in agreement with all Christians, in the incarnation a twofold union was procured by the Holy Spirit—one natural, through which he was a living man, and the other personal, through which the same person was not only God but also man—when the former ceases, nevertheless the latter remains. So then, because the essential parts of man in death were not deprived of all union (as ordinarily occurs in the dead, who for this reason are also not men, except equivocally), but only the union that makes a living man, we conclude that he nevertheless throughout the three days of his death and burial remained a man in the true and proper sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>3. ‘Was Christ during the three days of his death and burial a true man?’ in Theoretical Practical Theology (RHB), vol. 4, bk. 5, ch. 13, Polemical Part, §XIII</cite>, pp. 466-68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-434f3c8a49" data-kw="eternal life vision">
<blockquote><p>To the eternal death which awaits the damned, eternal life is opposed—the fulfillment and crown of all of Christ’s benefits. So great a good as neither eye has seen, nor ear heard, nor has it entered into the heart of anyone to conceive, and will not enter until we, obtaining our wish, ascend thither and know as we are known, and no longer walk by faith, but by sight.</p></blockquote>

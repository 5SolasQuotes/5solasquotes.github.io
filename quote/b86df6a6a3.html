<main class="wrap"><figure class="quote" id="q-b86df6a6a3" data-kw="">
<blockquote><p>Most broadly understood it [a condition] includes anything that is required in any way for the covenant of grace, whether: (1) antecedently, and as it were in a preparatory fashion, in which sense the hearing of the promulgated covenant, a general assent given to the divine Word, a conviction of the necessity of the covenant of grace, an effectual call to faith (prior to faith, if not in time, at least in nature), an acknowledgement and sense of one’s misery, a godly desperation about oneself and all things outside the Mediator, and so forth, can be called a condition. Or, (2) concomitantly, in which manner self-denial (Lk. 9:23; Phil. 3:4–12), the exercise of repentance (Mk. 1:15; Acts 2:38–39), and so forth, can be taken as a condition. Or, (3) consequently, as covenantal duties, in which sense evangelical obedience (cf. Gen. 12:1–3; 15:18; 17:1–2; 9:1–15) and renewal of repentance (Dt. 30:1–9 with 29:24 to the end) can be admitted as a condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (2nd ed. 1698; RHB), vol. 4, pt. 1, bk. 5, ch. 1, ‘The Covenant of Grace’, sect. XXII, ‘What the condition of the covenant of grace is’, p. 24</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-468e894502" data-kw="">
<blockquote><p>The papists prefer good works as meritorious causes, as do the Socinians, but as good works required by grace. There are those who prefer faith and repentance taken jointly, and there are several who are pleased with repentance, faith, and obedience. Most of the orthodox, with the Scriptures, most accurately admit here faith alone… Most broadly understood it [a condition] includes anything that is required in any way for the covenant of grace, whether: (1) antecedently, and as it were in a preparatory fashion, in which sense the hearing of the promulgated covenant, a general assent given to the divine Word, a conviction of the necessity of the covenant of grace, an effectual call to faith (prior to faith, if not in time, at least in nature), an acknowledgement and sense of one’s misery, a godly desperation about oneself and all things outside the Mediator, and so forth, can be called a condition. Or, (2) concomitantly, in which manner self-denial (Lk. 9:23; Phil. 3:4–12), the exercise of repentance (Mk. 1:15; Acts 2:38–39), and so forth, can be taken as a condition. Or, (3) consequently, as covenantal duties, in which sense evangelical obedience (cf. Gen. 12:1–3; 15:18; 17:1–2; 9:1–15) and renewal of repentance (Dt. 30:1–9 with 29:24 to the end) can be admitted as a condition. More strictly and most properly understood, a condition denotes that by which, when it is given in man, from the divine promise, the covenant of grace is entered into. In this sense faith alone supplies the condition of the covenant of grace, for by this: (1) it is distinguished from the covenant of works (Rom. 3:27; 10:5–14); (2) it is denominated the law of faith (Rom. 3:27); and (3) its righteousness, the righteousness of faith (Rom. 10:6; Phil. 3:9; Heb. 11:7); (4) its covenanted parties are called οἱ ἐκ πίστεως, those who are of faith (Gal. 3:9).</p></blockquote>

<blockquote><p>VIII. Divines explain themselves differently as to the conditions of the covenant of grace. We, for our part, agree with those who think that the covenant of grace, to speak accurately, with respect to us has no conditions, properly so called; which sentiment we shall explain and establish in the following manner.

IX. A condition of a covenant, properly so called, is that action which, being performed, gives a man a right to the reward. But that such a condition cannot be required of us in the covenant of grace, is self-evident: because a right to life neither is nor indeed can be founded on any action of ours, but on the righteousness of our Lord alone; who having perfectly fulfilled the righteousness of the law for us, nothing can, in justice, be required of us to perform, in order to acquire a right already fully purchased for us. And, indeed, in this all the orthodox readily agree.

X. Further, the apostle more than once sets forth the covenant of grace under the appellation of a testament, which is God’s immutable purpose, not suspended on any one condition: and as it is founded on the unchangeable counsel of God, and ratified by the death of the testator, so it is not possible it should be made void by any unbelief of the elect, nor acquire its stability from any faith of man; for in this very testament God has immutably determined concerning faith, as salvation. Thus, Gal. 3:15, we see the covenant of God with Abraham is called a testament; the ratification of which must also be the same with that of a testament. And the covenant to be made with Israel, Jer. 31 has the same appellation, Heb. 8:10; as also that covenant with Israel mentioned by Moses, Exod. 24 and the declaration of the manner of enjoying the love of God through faith in Christ, Heb. 9:15, 20. And likewise, the compact of the Father with the Son, Luke 22:39, “In which passage, first, the will of God is published, by which he decreed, that the Son should, by the divine power of the Father, obtain the inheritance of the world, and a kingdom: secondly, the will of Christ, that the apostles and others given him should, through faith, become heirs of righteousness, and of the heavenly kingdom and of that of the world.” Compare Gal. 3:8. “But why should the apostle call the covenant of Abraham, and that mentioned, Heb. 8:10, a testament, and whether it ought not to be so taken, Matt. 26:18, and in other places, shall be considered in its place.”—Cocceius de Fœder. §. 4. And, in a word, I know not whether Paul, when speaking of the covenant of grace, did at any time or in any passage give it any other name than that of a testament. “But at that time,” at least if we give in to Cocceius’s opinion, “that word signified, neither to Greeks, nor Hellenist Jews, nor to the Hebrews, any other thing but a testament.” Cocceius ad Gal. 3 §. 134. I do not assert these things, as if I wanted to confound the notions of a covenant and a testament; but to show that the covenant of grace is testamentary, and to be distinguished from a covenant founded on a compact agreement, or law. Nor do I conceal that I found this in Cocceius de Fœd. §. 87; which made me wonder that a certain learned person, who is a great admirer of Cocceius, should find fault with these things.

XI. The famous Cloppenburg, formerly the ornament of the university of Friesland, has accurately observed the same thing, whose words I shall subjoin from Disputat. 3, de Fœderibus, Thes. 29: “The other disposition of the covenant [which regards us] is testamentary, whereby the grace by which we are saved comes to us from the most perfect merit of Christ the surety. For we are reckoned to be in covenant with God by the new covenant of grace, without having superadded to the covenant confirmed with Christ, the surety, by the renewal of the old agreement, any condition by which God should transact with us, but giving a gratuitous call to the inheritance of the promises whose testament Christ ratified by his death, and whose mediator he now is in heaven; namely, of full reconciliation with God and of eternal life.” Junius, in like manner, in his Theses, Disputat. 25, §. 29, “The conditions being fulfilled by the Angel of the Covenant, the catholic church was, through and for him, constituted heir of eternal life, without any condition.</p></blockquote>

— Herman Witsius, The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity, trans. William Crookshank, 2 vols. (London: Tegg &amp; Son, 1837), vol. 1, pp. 252–58; italics original. See also Herman Witsius, The Economy of the Covenants Between God &amp; Man, 2 vols. (1822; RHB, 2017), vol. 1, pp. 284–91">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVIII.+Divines+explain+themselves+differently+as+to+the+conditions+of+the+covenant+of+grace.+We%2C+for+our+part%2C+agree+with+those+who+think+that+the+covenant+of+grace%2C+to+speak+accurately%2C+with+respect+to+us+has+no+conditions%2C+properly+so+called%3B+which+sentiment+we+shall+explain+and+establish+in+the+following+manner.+IX.+A+condition+of+a+covenant%2C+properly+so+called%2C+is+that+action+which%2C+being+performed%2C+gives+a+man+a+right+to+the+reward.+But+that+such+a+condition+cannot+be+required+of+us+in+the+covenant+of+grace%2C+is+self-evident%3A+because+a+right+to+life+neither+is+nor+indeed+can+be+founded+on+any+action+of+ours%2C+but+on+the+righteousness+of+our+Lord+alone%3B+who+having+perfectly+fulfilled+the+righteousness+of+the+law+for+us%2C+nothing+can%2C+in+justice%2C+be+required+of+us+to+perform%2C+in+order+to+acquire+a+right+already+fully+purchased+for+us.+And%2C+indeed%2C+in+this+all+the+orthodox+readily+agree.+X.+Further%2C+the+apostle+more+than+once+sets+forth+the+covenant+of+grace+under+the+appellation+of+a+testament%2C+which+is+God%E2%80%99s+immutable+purpose%2C+not+suspended+on+any+one+condition%3A+and+as+it+is+founded+on+the+unchangeable+counsel+of+God%2C+and+ratified+by+the+death+of+the+testator%2C+so+it+is+not+possible+it+should+be+made+void+by+any+unbelief+of+the+elect%2C+nor+acquire+its+stability+from+any+faith+of+man%3B+for+in+this+very+testament+God+has+immutably+determined+concerning+faith%2C+as+salvation.+Thus%2C+Gal.+3%3A15%2C+we+see+the+covenant+of+God+with+Abraham+is+called+a+testament%3B+the+ratification+of+which+must+also+be+the+same+with+that+of+a+testament.+And+the+covenant+to+be+made+with+Israel%2C+Jer.+31+has+the+same+appellation%2C+Heb.+8%3A10%3B+as+also+that+covenant+with+Israel+mentioned+by+Moses%2C+Exod.+24+and+the+declaration+of+the+manner+of+enjoying+the+love+of+God+through+faith+in+Christ%2C+Heb.+9%3A15%2C+20.+And+likewise%2C+the+compact+of+the+Father+with+the+Son%2C+Luke+22%3A39%2C+%E2%80%9CIn+which+passage%2C+first%2C+the+will+of+God+is+published%2C+by+which+he+decreed%2C+that+the+Son+should%2C+by+the+divine+power+of+the+Father%2C+obtain+the+inheritance+of+the+world%2C+and+a+kingdom%3A+secondly%2C+the+will+of+Christ%2C+that+the+apostles+and+others+given+him+should%2C+through+faith%2C+become+heirs+of+righteousness%2C+and+of+the+heavenly+kingdom+and+of+that+of+the+world.%E2%80%9D+Compare+Gal.+3%3A8.+%E2%80%9CBut+why+should+the+apostle+call+the+covenant+of+Abraham%2C+and+that+mentioned%2C+Heb.+8%3A10%2C+a+testament%2C+and+whether+it+ought+not+to+be+so+taken%2C+Matt.+26%3A18%2C+and+in+other+places%2C+shall+be+considered+in+its+place.%E2%80%9D%E2%80%94Cocceius+de+F%C5%93der.+%C2%A7.+4.+And%2C+in+a+word%2C+I+know+not+whether+Paul%2C+when+speaking+of+the+covenant+of+grace%2C+did+at+any+time+or+in+any+passage+give+it+any+other+name+than+that+of+a+testament.+%E2%80%9CBut+at+that+time%2C%E2%80%9D+at+least+if+we+give+in+to+Cocceius%E2%80%99s+opinion%2C+%E2%80%9Cthat+word+signified%2C+neither+to+Greeks%2C+nor+Hellenist+Jews%2C+nor+to+the+Hebrews%2C+any+other+thing+but+a+testament.%E2%80%9D+Cocceius+ad+Gal.+3+%C2%A7.+134.+I+do+not+assert+these+things%2C+as+if+I+wanted+to+confound+the+notions+of+a+covenant+and+a+testament%3B+but+to+show+that+the+covenant+of+grace+is+testamentary%2C+and+to+be+distinguished+from+a+covenant+founded+on+a+compact+agreement%2C+or+law.+Nor+do+I+conceal+that+I+found+this+in+Cocceius+de+F%C5%93d.+%C2%A7.+87%3B+which+made+me+wonder+that+a+certain+learned+person%2C+who+is+a+great+admirer+of+Cocceius%2C+should+find+fault+with+these+things.+XI.+The+famous+Cloppenburg%2C+formerly+the+ornament+of+the+university+of+Friesland%2C+has+accurately+observed+the+same+thing%2C+whose+words+I+shall+subjoin+from+Disputat.+3%2C+de+F%C5%93deribus%2C+Thes.+29%3A+%E2%80%9CThe+other+disposition+of+the+covenant+%5Bwhich+regards+us%5D+is+testamentary%2C+whereby+the+grace+by+which+we+are+saved+comes+to+us+from+the+most+perfect+merit+of+Christ+the+surety.+For+we+are+reckoned+to+be+in+covenant+with+God+by+the+new+covenant+of+grace%2C+without+having+superadded+to+the+covenant+confirmed+with+Christ%2C+the+surety%2C+by+the+renewal+of+the+old+agreement%2C+any+condition+by+which+God+should+transact+with+us%2C+but+giving+a+gratuitous+call+to+the+inheritance+of+the+promises+whose+testament+Christ+ratified+by+his+death%2C+and+whose+mediator+he+now+is+in+heaven%3B+namely%2C+of+full+reconciliation+with+God+and+of+eternal+life.%E2%80%9D+Junius%2C+in+like+manner%2C+in+his+Theses%2C+Disputat.+25%2C+%C2%A7.+29%2C+%E2%80%9CThe+conditions+being+fulfilled+by+the+Angel+of+the+Covenant%2C+the+catholic+church+was%2C+through+and+for+him%2C+constituted+heir+of+eternal+life%2C+without+any+condition.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+The+Economy+of+the+Covenants+between+God+and+Man%3A+Comprehending+a+Complete+Body+of+Divinity%2C+trans.+William+Crookshank%2C+2+vols.+%28London%3A+Tegg+%26+Son%2C+1837%29%2C+vol.+1%2C+pp.+252%E2%80%9358%3B+italics+original.+See+also+Herman+Witsius%2C+The+Economy+of+the+Covenants+Between+God+%26+Man%2C+2+vols.+%281822%3B+RHB%2C+2017%29%2C+vol.+1%2C+pp.+284%E2%80%9391&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F070d9b7b03.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/070d9b7b03.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/in-what-respects-the-covenant-of-grace-is-condition/#:~:text=VIII.%20Divines%20explain%20themselves%20differently%20as,of%20eternal%20life%2C%20without%20any%20condition&amp;text=VIII.%20Divines%20explain%20themselves%20differently%2 </figure><figure class="quote" id="q-77c6f64958" data-kw="">
<blockquote><p>At first Ishmael had obtained the same rank with his brother Isaac, because the spiritual covenant was equally sealed in him by the symbol of circumcision. He is first cut off, then Esau, at last an innumerable multitude, almost the whole of Israel. In Isaac was the seed called. The same calling held good in the case of Jacob. God gave a similar example in the rejection of Saul. This is also celebrated in the psalm, “Moreover, he refused the tabernacle of Joseph, and chose not the tribe of Ephraim: but chose the tribe of Judah,” (Ps. 78:67-68) This the sacred history sometimes repeats, that the secret grace of God may be more admirably displayed in that change. I admit that it was by their own fault Ishmael, Esau, and others, fell from their adoption; for the condition annexed was that they should faithfully keep the covenant of God, whereas they perfidiously violated it.</p></blockquote>

med Books Online</a></div>
</figure><figure class="quote" id="q-b52da0bba0" data-kw="">
<blockquote><p>Wherefore, when the Lord invites the Jewish people to repentance, He gives no injunction concerning another circumcision, though (as we have said) they were circumcised by a wicked and sacrilegious hand, and had long lived in the same impiety. All He urges is conversion of heart. For how much soever the covenant might have been violated by them, the symbol of the covenant always remained, according to the appointment of the Lord, firm and inviolable. Solely, therefore, on the condition of repentance, were they restored to the covenant which God had once made with them in circumcision, though this which they had received at the hand of a covenant-breaking priest, they had themselves as much as in them lay polluted and extinguished.</p></blockquote>

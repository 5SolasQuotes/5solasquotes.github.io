</figure><figure class="quote" id="q-2ff9c83299" data-kw="">
<blockquote><p>In other words, a course too exact, rigid, and severe occasions the misfortunes of the righteous. They overdo. And so also they show themselves as wise, or demean themselves as claiming to be wise, [Hebrew] Hith., i.e., wiser than others; and so, by carrying these things to excess, they cause themselves to be ‘deserted’ or ‘forsaken,’ [Hebrew] Hith., for [Hebrew], ‘make thyself desolate or lonely.’ Like Job in 16:7 (on which passage the writer perhaps had his eye), friends forsake him, and leave him to his fancied superior sanctity and wisdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/moses-stuart.html">Moses Stuart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ecclesiastes</cite>, (Andover: Draper, 1864), on 7:16, p. 252</span></figcaption>

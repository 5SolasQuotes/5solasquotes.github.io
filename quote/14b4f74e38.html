<main class="wrap"><figure class="quote" id="q-14b4f74e38" data-kw="">
<blockquote><p>Secondly, I say Christ is a second Adam, and a public person, and became ours, we then being in his loins, so the righteousness of Christ is made ours, we being born in Christ by faith, and found in Him: He being our head, we have a spiritual life descending upon us; He being our husband, all his goods are ours also. This point is the soul of the Church and the golden key which opens Heaven for us…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Third Chapter of the Epistle of St. Paul to the Philippians</cite>, ... (London: Cotes, 1639), on verse 9, ‘But that which is through the faith of Christ…’, p. 110</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5d08c12ed3" data-kw="">
<blockquote><p>God’s sentence of life to those of us who are the objects of justification is executed when he regenerates us through his Holy Spirit—that is, when he creates within us that new life that he has assigned to us already by means of that earlier sentence of justification.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>
<div class="actions"><button class="copy" data-copy="“God’s sentence of life to those of us who are the objects of justification is executed when he regenerates us through his Holy Spirit—that is, when he creates within us that new life that he has assigned to us already by means of that earlier sentence of justification.”

</figure><figure class="quote" id="q-c7b99b2e9d" data-kw="">
<blockquote><p>5. All the justified have a real union and interest in Christ, to live by faith (Hab. 2:4; Rom. 1:17), and wait on God in all their troubles by faith; but though there be an union of love in God’s mind from eternity, between the elect and God, yet a complete union between us and Christ, without the Spirit, and without any faith, though it be boldly asserted by Familists (Rise, Reign, Er., p. 37), is against the Scripture: For then might we be born again, and not receive Christ by faith, contrary to the Scripture (Jn. 1:11-12, Antinomians hold an union with Christ before we believe); and be united to Christ, as branches to the Vine-tree, and not abide in Christ (Jn. 15:1-6), have Christ dwelling in our heart, and not by faith, contrary to Paul (Eph. 3:17); so might Christ live in us, and we eat and drink Him as the true manna, have the Son, and yet want [lack] faith, contrary to the Scriptures (Gal. 2:20; Rev. 2:7•; Jn. 6:35, 40, 44, 47, 54-55). All which, or most of them, prove that we were not justified when Christ died on the cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, … (London: 1648), pt. 2, ch. 18, ‘That we are not justified until we believe’, pp. 19-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

,when%20Christ%20died%20on%20the%20cross&amp;text=5.%20All%20the%20justified%20have%20a%20real%20union&amp;text=not%20justified%20when%20Christ%20died%20on%20the%20cross" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-03be889c9b" data-kw="">
<blockquote><p>He says not: ‘ye are the children of God because ye are circumcised, because ye have heard the law and have done the works thereof’ (as the Jews do imagine, and the false apostles teach): but ‘by faith in Jesus Christ’ [Gal. 3:26]. The law then makes us not the children of God, and much less men’s traditions. It cannot beget us into a new nature or a new birth: but it sets before us that old birth whereby we were born to the kingdom of the Devil: And so it prepares us to a new birth which is by faith in Jesus Christ and not by the law, as Paul plainly witnesses: ‘For ye are all the children of God by faith, etc.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary</cite>, … upon… Galatians… (London: Vautroullier, 1575), on Gal., 3:26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

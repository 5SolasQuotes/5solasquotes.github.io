<blockquote><p>XXXIX. We are so far from desiring to draw people from the parish churches into conventicles [separate assemblies], that we would keep up the honor of them to the utmost of our power, as knowing how greatly the countenance and maintenance of Rulers conduceth to the furtherance of religion… XL. We are not for preaching when we are forbidden, where there is not a real and evident need of our labors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (London, 1689), ch. 2</cite>, pp. 15-16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/evangelism.html">Evangelism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2954cf3d83" data-kw="">
<blockquote><p>Christ preached the Gospel to those that He knew sinned against the Holy Ghost, to the Pharisees who persecuted Christ to death and others, Mt. 12:31-34; Jn. 15:22-25; Jn. 7:28-29; Jn. 12:35-38; Jn. 10:31-32; Jn. 11:47-48… the word is a converting ordinance out of question, and preached to heathen and to the non-converted, though they refuse to embrace and believe the Gospel, and refuse to entertain the preachers of it: as is clear, Acts 19:22-25; Tit. 1:10-13; 2 Tim. 3:25-27. The texts that Master Prynne alledges, that the Gospel should not be preached to heathen who refuse to embrace and believe the Gospel, to wit, Mt. 10:14-15; Lk. 9:5; Acts 13:46, are to no purpose, for Mt. 10; Lk. 9, is but a temporary commandment, given for a time, that the disciples should depart from those houses of Judea (there is nothing of the heathen; but by the contrary the apostles are forbidden to go to Samaritans or gentiles at all, Mt. 10:5-6 [which was unique to those circumstances]) who would not receive the peace of God in the Gospel, which precept the apostles in the story of the Acts did not observe, but preached the Gospel to many heathen who refused to embrace and believe the Gospel: As Acts 16 and 17, and 19:2. The place Acts 13:15 is meant of the blaspheming Jews, to whom Paul preached long after they persecuted and stoned the prophets, and had killed the Lord of life, Acts▪2 and 4, and 8, and 9; Mt. 23:37-38. 3. Those places, are to better color of purpose brought by Arminians and Socinians to prove that the Gospel is preached to people for their good entertainment thereof, and denied to others for their unworthiness, and because they will not welcome it; So the Arminians in the conference at Hague, pp. 87-89, God sends the Gospel not according to his absolute will, sed ob alias causas in homine latent•s, for secret causes in man. Arminius, Against Perkins, p. 199, ‘The will of God in sending the Gospel has causes in the will of man according to that,’ habenti dabitur: So Corvinus, Ad Wallachros, p. 44. Socinus, Commentary on 1 Jn. 4, p. 307 says the same: and Mr. Prynne is pleased in the same sense to cite them, I conceive imprudently, for I believe that Reverend and learned man does hate those impious sects, the enemies of the grace of God; but truly if this be a rule to pastors to spread the Gospel, that they are to offer and give the pearl of the preached Gospel to those that willingly receive it and harbour the preachers, and presently to depart and preach no more the Word of the Kingdom to those who refuse it, as the places Mt. 10:14 and Lk. 9:5 carry that sense, because they are heathens who refuse to embrace and believe the Gospel, and harbor the preachers, as (the worthy divine says) conceiving that to be a casting of pearls to dogs and swine; I see not how the preachers and spreaders of the Gospel to the heathen are to believe that God out of mere grace and the good pleasure of his will, without respect to good or bad deserving, sends the Gospel to some and denies it to others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London, 1646), ch. 23</cite>, pp. 516-18</span></figcaption>

ns+in+the+conference+at+Hague%2C+pp.+87-89%2C+God+sends+the+Gospel+not+according+to+his+absolute+will%2C+sed+ob+alias+causas+in+homine+latent%E2%80%A2s%2C+for+secret+causes+in+man.+Arminius%2C+Against+Perkins%2C+p.+199%2C+%E2%80%98The+will+of+God+in+sending+the+Gospel+has+causes+in+the+will+of+man+according+to+that%2C%E2%80%99+habenti+dabitur%3A+So+Corvinus%2C+Ad+Wallachros%2C+p.+44.+Socinus%2C+Commentary+on+1+Jn.+4%2C+p.+307+says+the+same%3A+and+Mr.+Prynne+is+pleased+in+the+same+sense+to+cite+them%2C+I+conceive+imprudently%2C+for+I+believe+that+Reverend+and+learned+man+does+hate+those+impious+sects%2C+the+enemies+of+the+grace+of+God%3B+but+truly+if+this+be+a+rule+to+pastors+to+spread+the+Gospel%2C+that+they+are+to+offer+and+give+the+pearl+of+the+preached+Gospel+to+those+that+willingly+receive+it+and+harbour+the+preachers%2C+and+presently+to+depart+and+preach+no+more+the+Word+of+the+Kingdom+to+those+who+refuse+it%2C+as+the+places+Mt.+10%3A14+and+Lk.+9%3A5+carry+that+sense%2C+because+they+are+heathens+who+refuse+to+embrace+and+believe+the+Gospel%2C+and+harbor+the+preachers%2C+as+%28the+worthy+divine+says%29+conceiving+that+to+be+a+casting+of+pearls+to+dogs+and+swine%3B+I+see+not+how+the+preachers+and+spreaders+of+the+Gospel+to+the+heathen+are+to+believe+that+God+out+of+mere+grace+and+the+good+pleasure+of+his+will%2C+without+respect+to+good+or+bad+deserving%2C+sends+the+Gospel+to+some+and+denies+it+to+others.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government+%28London%2C+1646%29%2C+ch.+23%2C+pp.+516-18&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2954cf3d83.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2954cf3d83.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/evangelism#:~:text=Christ%20preached%20the%20Gospel%20to%20those,some%20and%20denies%20it%20to%20others&amp;text=Christ%20preached%20the%20Gospel%20to%20those%20that%20He&amp;text=Gospel%20to%20some%20and%20denies%20it%20to%20others" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-26f1ea2082" data-kw="">
<blockquote><p>It is true, they [the Independents] object that the apostles, Mt. 18, were commanded to preach to all nations, but pastors are not so now, but are commanded to feed the flock over which God has appointed them, Acts 20:28; but it is as true [that] the apostles were commanded to preach to all nations, in opposition to the charge that the prophets of old were to speak to the people of Israel only, and the apostles, Mt. 10, [were] forbidden to preach to the Samaritans and gentiles; and it is as true that God’s Spirit limited the apostles to preach to Macedonia, not to Bithynia; Now because this particular direction for places is wanting in the Church, it is certain that a man is yet a pastor in office in relation to as many as God’s hand of providence shall send him unto, though he be chosen by a people to feed ordinarily one determinate flock, and though he be not an extraordinary and immediately inspired planter of Churches, or the first planter, as were the apostles, yet is he a pastor in relation to all. And if this be not said: 1. It were simply unlawful for pastors now to plant churches and spread the Gospel to those nations who have not heard it, because all pastors now are ordinary [according to congregationalists], and none are immediately inspired apostles: but it is certain what the apostles did by an extraordinary gift, as such immediately called pastors, it is unlawful for ordinary pastors to attempt to do, as to attempt to speak with tongues, and to plant Churches by speaking with tongues and confirming it with miracles is unlawful. Papists, as Bellarmine, Suarez, Acosta, ascribe this to the Pope and his apostles. Our divines answer that the apostles that way have no successors; But what the apostles did by an ordinary pastoral gift, as to preach the Word, administrate the Sacraments, to erect and plant Churches by ordinary gifts, where the pastors can speak to the Churches by an ordinary gift in their own language, they are obliged both within and without the congregation, to preach as pastors, because where God gives gifts pastoral to pastors, he commands them to exercise these gifts, else they dig their Lord’s talent in the earth: but God gives to pastors pastoral gifts to preach to others than their own congregation, and to administrate the seals to them also, and to plant churches. Therefore, it is presumed that the Church does give authority and an external ministerial calling to the exercise of these gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644), pt. 2</cite>, pp. 207-8</span></figcaption>

<blockquote><p>Mr. Hooker [a congregationalist]: ”The Apostles’ (says Mr. Rutherford) ‘stand in the room of the whole catholic ministerial guides when they revealed the keys.’ [Hooker’s] Answer [to Rutherford]: The apostles in that commission were extraordinary persons sent to all the world to lay the foundation of the Gospel, by an apostolic power; and in this sense they have no successors, nor stand in the room of any.’ [Rutherford’s] Answer: [1.] If the apostles represent none in this sense, Mt. 28:19; Mk. 16:15; Jn. 20:21, ‘Go and teach, etc.’, ‘Whose sins ye remit, etc.’, then none succeed the apostles to teach, baptize, remit and retain sins; pastors then must do these without a commission from Christ, or these ordinances must cease. 2. Mt. 28; Jn. 20, He sends the apostles and says, ‘Behold, I am with you to the end of the world,’ in preaching and baptizing. The apostles, Mt. 28:19-20; Jn. 20:21-22, when they received power to preach and baptize, did represent all ordinary teachers to the end of the world, or then ordinary teachers want [lack] all calling. But the apostles do not live to preach and baptize to the end of the world; therefore that ministerial presence of Christ must be promised to some represented by the apostles. So the English Divines, Calvin, Beza, Diodati [held], as apostles gifted with power of working miracles, etc., they represented none, nor had they any successors. So [in] Mt. 28, the pastors have the power of the keys and of office given them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum... (London, 1658), bk. 4, ch. 2</cite>, pp. 353-4</span></figcaption>

</figure><figure class="quote" id="q-11880a3a39" data-kw="">
<blockquote><p>Thirdly, the Reformed Churches may send pastors to the Indians, for that which Acosta says of Jesuits we may with better reason say it of ourselves: That pastors are as soldiers, and some soldiers are to keep order and remain in a certain place; others run up and down in all places; So some are affixed to a congregation, to feed them; others may be sent to those people who have not heard of the Gospel, which sending is ordinary and lawful in respect of pastors sending and the pastors who are sent, because in pastors, even after the apostles be dead, there remains a general pastoral care for all the Churches of Christ. Thus sending is not ordinary, but extraordinary in respect of those to whom the pastors are sent; yet is it a pastoral sending [as opposed to this being absent in congregationalism in such a case].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (London: 1644), pt. 2</cite>, p. 204</span></figcaption>

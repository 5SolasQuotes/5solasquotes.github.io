<main class="wrap"><figure class="quote" id="q-9583a20943" data-kw="">
<blockquote><p>To say that Councils may not err, though private persons may, at first sight is a merry speech; as if a man should say, That every single Soldier indeed may run away, but a whole Army cannot, especially having Hannibal for their Captain; and since it is confest, that all single persons not only may, but do err, it will prove a very hard matter, to gather out of these a multitude, of whom being gathered together, we may be secured they cannot err.

I must for mine own part confess, that Councils, and Synods not only may and have erred, but considering the means how they are managed, it were a great marvel if they did not err: For what men are they of whom those great Meetings do consist? are they the best, the most learned, the most virtuous, the most likely to walk uprightly?

No, the greatest, the most ambitious, and many times men, neither of Judgment, nor Learning; such are they of whom these Bodies do consist: and are these men in common equity likely to determine for Truth? Qui ut in vita, sic in causis, spes quoque improbas alunt, [Those who, as in life, so in causes, also nourish ungodly hopes] as Quintilian speaks. Again, when such persons are thus met, their way to proceed to conclusion, is not by weight of Reason, but by multitude of Votes and Suffrages; as if it were a maxim in nature, that the greater part must needs be the better; whereas our common experience shews, That, Nunquam ita bene agitur cum rebus humanis ut plures sint meliores. [It is never so well done with human affairs that the more are the better.]

It was never heard in any profession, that Conclusion of Truth went by plurality of Voices, the Christian profession only excepted; and I have often mused how it comes to pass, that the way which in all other Sciences is not able to warrant the poorest Conclusion, should be thought sufficient to give authority to Conclusions in Divinity, the Supreme Empress of Sciences.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-hales.html">John Hales</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A tract on the sacrament of the Lord s Supper’ in Several tracts, by the ever memorable Mr. John Hales of Eaton Coll</cite></span></figcaption>

</figure><figure class="quote" id="q-38b795f294" data-kw="">
<blockquote><p>…the Church ministerially does judge, so as the obligatory power is from the things themselves, not from the will of human superiors. No necessity of peace which is posterior to truth, no necessity of obedience to authority, no necessity of uniformity in these externals, simply, and as they are such, are necessities obliging us to obedience: For things must first in themselves be necessary, before they can oblige to obedience. I must obey superiors in these things of convenient necessity, because they are convenient, and most convenient in themselves, and so intrinsically most necessary, but they are not necessarily to be done in themselves, because I must obey superiors, and because I must keep uniformity with the Church. The will of superiors do find in things necessity, and good of uniformity, but they do not make necessity, nor the good of uniformity: We should be servants of men if our obedience were ultimately resolved in the mere will of superiors in any the least circumstance of worship: and what I say of actions, holds in matters of mere custom also.</p></blockquote>

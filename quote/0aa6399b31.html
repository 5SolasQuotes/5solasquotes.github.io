<blockquote><p>Secondly, it is plain that the Scripture teaches no Separation from a true Church, with condemnation of it as a false Church. Thirdly, no example in Scripture given of any separating from true Churches for corruptions; but either for gross idolatry, visible pictures set up to be worshipped, as among the Israelites, or for open blasphemy against Christ’s very Person. (Acts 19:9)</p></blockquote>

</figure><figure class="quote" id="q-917f4352cb" data-kw="">
<blockquote><p>But mistake me not, I speak not this of all kind of errors in judgement, what man is he that errs not? All errors are sinful, but all errors are not damning: all errors are hurtful, but all errors are not destructive and undoing errors. I told you there were some errors which were building errors, and some which were fundamental errors: as the apostle speaks, 1 Cor. 3:10-12, etc. In the one the work shall be burnt, in the other the workman. One shall be saved, but so saved as by fire, the other shall be destroyed in fire; work and workman, person and errors shall perish together, 1 Cor. 3:13-15.</p></blockquote>

</figure><figure class="quote" id="q-9d904176a2" data-kw="">
<blockquote><p>That by giving out themselves in these meetings as the generality of the godly throughout the land, or delegates in a sort from them, they do cast an imputation upon the bulk of the national Church beside, who are against their way, and do not join with them in these courses, as not only wrong in that matter, but as not godly, some very few excepted. Which as we know to be a most false imputation (not many of these, of any rank, who owned the cause from the beginning, going along with them). So it is an evidence of a strange divisive and separating spirit in our Brethren.</p></blockquote>

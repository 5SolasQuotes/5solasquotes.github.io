<main class="wrap"><figure class="quote" id="q-f0b36fd5f9" data-kw="">
<blockquote><p>XX. The subject ‘to which’ it [original sin] happens are all men who are brought forth into the light by the common law of birth. And therefore, Christ alone was immune from this sin; and the Virgin Mary was subject to this evil, because she was propagated from Adam naturally. Then, since Holy Scripture convicts all of sin (1 Kn. 8:46; Eccl. 7:21; Rom. 11:32; Gal. 3:22, etc.), who can press forward and give exceptions to the general propositions of the Word of God, besides the Word itself? But it excepts only Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-tronchin.html">Theodore Tronchin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on Original Sin</cite>, trans. AI (Geneva: de la Planche, 1625), p. 6 Tronchin (1582-1657) was a professor of Hebrew and theology at Geneva.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a298cb1788" data-kw="">
<blockquote><p>Master Perkins says nothing of the necessity of believing. That point of the virgin Mary’s perpetual virginity, we hold to be true, but we dare not lay a burden upon any man’s conscience where the Scripture is silent. St. Austin’s judgment, though he were a singular light of the Church, is not of weight enough to determine, without all warrant of scripture, what is heresy and what is not… Besides, Austin thus delivers the matter concerning the Helvidians’ heresy. The Helvidians (says he) so gainsaid the virginity of Mary that they confidently affirm [that] she had other children after Christ by her husband Joseph. So that it may well be Austin counted them heretics especially for avouching that peremptorily which they could no way make good by Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-wotton.html">Anthony Wotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defence of Mr</cite>, [William] Perkins’ book, called A Reformed Catholic, against the Cavils of a Popish Writer... (London, 1606), The 7th Point, ‘Of Traditions’. Wotton (c. 1561 – 1626) was an English clergyman and controversialist, of puritan views., pp. 401-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

%20could%20no%20way%20make%20good%20by%20Scripture" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-df4a33cf85" data-kw="">
<blockquote><p>CHRIST IS TRUE MAN, HAVING REAL FLESH. We also believe and teach that the eternal Son of the eternal God was made the Son of man, from the seed of Abraham and David, not from the coitus [union] of a man, as the Ebionites [a sect from the Early Church] said, but was most chastely conceived by the Holy Spirit and born of the ever virgin Mary, as the evangelical history carefully explains to us (Matt., ch. 1). And Paul says: “he took not on him the nature of angels, but of the seed of Abraham.” Also the apostle John says that whoever does not believe that Jesus Christ has come in the flesh, is not of God. Therefore, the flesh of Christ was neither imaginary nor brought from heaven, as Valentinus and Marcion wrongly imagined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/affirmation-of.html">Second Helvetic Confession</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second Helvetic Confession</cite>, (1562-66) &amp; the Church of Scotland (1566) | Ch. 11, ‘Of Jesus Christ, True God and Man, the Only Savior of the World’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-1b78151012" data-kw="">
<blockquote><p>8. Question: Since she was ordained by God to be the mother of our Savior, and was thus to remain a pure virgin, why then must she be married to Joseph according to God’s providence? Answer: So that she would have in him a carer and a guardian, who would partly shield her pregnant body from evil suspicion and the strictness of the Mosaic law, and partly protect her and her future son’s holy persons from all violence and inconvenience, and would be helpful to them with advice and deed. … 15th Question: Was the holy Virgin before, during &amp; after the birth, &amp; herewith an ever-pure virgin? Answer: That she was before and during the birth a pure virgin Holy Writ testifies clearly (Isa. 7:14 &amp; Mt. 1:23). Thus, we also do not doubt that after the birth and herewith she was an ever-pure virgin, partly because Holy Writ, if it had been otherwise, would not have concealed such; partly since otherwise the Lord Christ at the cross would not have entrusted her to John, if she had borne other more children. 16th Question: But why is the Lord Christ called (Mt. 1:25) the firstborn son of Mary; and why are the brothers of Christ mentioned (Mk. 6:3)? Answer: He is called the firstborn son of Mary the Lord not because others were after Him, but because no other was born before Him. And those who are named brothers of Christ were not his biological brothers, but according to the manner of speaking common in God’s Word, they were his closest friends and relatives.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Short Instruction on the holy and highly lauded Virgin Mary, for a better understanding of the simple-minded, set up in a question and answer format’</cite>, tr. by AI by dvinb150 (Zurich: Gessner, 1673), pp. 5 &amp; 9 German in Schriftmässiger Bericht von der Jungfrauen Maria (Zürich: Gessner, 1673)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-31e2552aa2" data-kw="">
<blockquote><p>We by no means think or teach that the relics of the saints should be held in contempt, or treated in an irreverent and irreligious manner, but that they should be given that place, and be held in that regard, which the testimonies of Scripture we have quoted show. It does not follow from this, however, that we should gather from the cogitations of human reason, or learn from the examples of the heathen or of any people, or that everyone ought to figure out for himself, with what veneration the relics of the saints are to be honored; but the same Scripture which teaches that the relics of the saints are to be considered precious also shows the mode and manner of their true veneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part IV, First Topic (Relics of the Saints), Sec. II</span></figcaption>

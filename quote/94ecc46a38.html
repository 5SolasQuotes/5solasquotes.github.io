<blockquote><p>…the instrumental cause of the administration of the Lord’s Supper, viz. the ministers of the Gospel, and the power which they have as ministers to administer the Lord’s Supper. It is called by divines potestas ordinis [the power of order] or potestas muneris specialis [the power of a special office]: and by the London divines in their Divine-Right of Church-Government, is defined to be a Church-power more special and particular to the office of some Church-governors only, as the power of preaching the Gospel, and which they as ministers may execute virtute officii [by virtue of the office]: and it is distinguished from the power of jurisdiction which is more general and common to the office of all Church-governors, as the power of censures, wherein ruling-elders may act with ministers… …That which belongs to ministers as ministers, belongs to all ministers, and always, in all states and conditions of the Church, as well in an un-presbyterated as a presbyterated Church. For a quatenus ad de omni valet argumentum: and the universality required in a proposition, that is, de omni, is universalitas posterioristica, as well as prioristica; temporis, as well as subjecti; Indeed this universality of time, this always is not to be understood, as in natural attributions, for that which is absolutely such in a mathematical latitude, but is to be taken (as usually it is) when it is applied to matters moral, for frequency or usualness… For first every power is for its act, and therefore power in a minister of administring the Lord’s Supper is not to lie idle and unactive; but to be exercised and actuated as often as there is a fit occasion and opportunity; unless there be some such impediment, as I spake of but now, etc. ‘[Greek] Hoc est frustra, quod sua natura in alterius gratiam est comparatum, quando non perficit id, cujus gratia est, &amp; natura comparatum est.’ (Aristotle, bk. 2, Physics, text 62. ‘Now if that may be said in vain which does not reach that end unto which it was appointed, much more may that be said so which is never used or applied for the compassing of that end.’ Secondly, The edification of the Church of Christ is, as the London divines say well, that eminent scope and end why Christ gave Church Government, and all other ordinances of the New Testament to the Church, 2 Cor. 10:8; 2 Cor. 13:10. The power then both of Order and Jurisdiction are both to be employed to the edification of the Church. The power of jurisdiction the minister cannot exercise singly by himself, without other Church officers. The power of order he may: For he alone is the seat and receptacle thereof. …Now a minister ought to exercise and employ for the edification of the Church all the power and authority that he may lawfully exercise. For, not to employ it, were with the slothful servant in the parable to hide his talent in the earth.</p></blockquote>

<blockquote><p>18. First there ought to be a greater difference placed between the doctrine of salvation required in the church and those things which they establish only to keep civil order. For doctrine, we also comprehend under this light the sacraments, which teach the conscience and do not depend on man who is bound to maintain it under the pain of damnation without changing, adding to or diminishing anything (in no such way, as we have declared before). But the canonical ordinances concerning the manner of proceeding are all exterior and outward according to the circumstances of places, times and persons, by reason of which they can neither be perpetual nor universal without exception. For such order and fashion may be held in one place which cannot be used in another place. Such a thing also is good in one place or at one time which would be unprofitable or harmful at another. And for this reason, there is often contradiction among the canons, as it is necessary to have with respect to those things which are expedient. Since such ordinances are mutable and made by man, it follows that they do not concern the conscience, especially in cases of slander and disorder–a prohibition of the purpose for which they were established, i.e., the edification and peace of the Church. For example, it was agreed by the council of Jerusalem… that the gentiles should abstain from eating the sacrifice of idols, from blood and beasts that are suffocated or strangled. I say that this is an ordinance distinct from the one before [fornication] (which pertains not to conscience nor to salvation simply, but only to the external and outward life), to attain an end more excellent and perfect, i.e., that the doctrine of salvation may take place among the Jews (Acts 15:19-21). For if it had been otherwise, apostles would have contradicted themselves. In the beginning, they agreed upon this–that grace alone justified by faith without the works of the Law (Acts 15:9-11); and also they would have contradicted the doctrine of Jesus Christ, who witnessed and said that what enters into the mouth does not defile a man; and St. Paul, who was in this council, would have been contrary to himself (Rom. 14:17; 1 Cor. 8:8; Col. 2:16-23; Titus 1:14-15). For shortly afterwards, he wrote that the kingdom of God was not in meat nor drink, and that one might eat of all things without creating any difficulty for conscience sake. Such prohibitions are devilish doctrines (1 Tim. 4:1-3), except when they are used for the liberty of the edification of neighbors. For avoiding slander (Rom. 14:13-19; 1 Cor. 10:23-4), let those then who will not understand this difference declare to us why they have abolished the apostolic ordinance; or whether they have greater power than the apostles; or else whether they will give place to the truth of God and study with us what may serve to the glory of God, instead of serving their own ambition and avarice in falsely abusing the title and authority of the church (Col. 2:8). 19. The second point: since such ordinances and statutes are made to increase the doctrine of the gospel, let them be established and set up in such a way that there is no abuse or any kind of superstition… 20. The third point: since men are so prompt and ready to love their own inventions and to turn the true religion into superstition; and also the times of the shadows of the Law are passed, and that God now ill be served in Spirit and truth and not in outward ceremonies (Jn. 4:23; Gal. 2:4; 5:1; and the whole epistle of the Hebrews); therefore, above all things, special regard must be taken that nothing be brought into the church except what is profitable and especially appropriate and necessary… But certainly the purest simplicity is the best, and the more Jesus Christ is plainly and simply declared, the more it is agreeable to His Word…</p></blockquote>

 Law (Acts 15:9-11); and also they would have contradicted the doctrine of Jesus Christ, who witnessed and said that what enters into the mouth does not defile a man; and St. Paul, who was in this council, would have been contrary to himself (Rom. 14:17; 1 Cor. 8:8; Col. 2:16-23; Titus 1:14-15). For shortly afterwards, he wrote that the kingdom of God was not in meat nor drink, and that one might eat of all things without creating any difficulty for conscience sake. Such prohibitions are devilish doctrines (1 Tim. 4:1-3), except when they are used for the liberty of the edification of neighbors. For avoiding slander (Rom. 14:13-19; 1 Cor. 10:23-4), let those then who will not understand this difference declare to us why they have abolished the apostolic ordinance; or whether they have greater power than the apostles; or else whether they will give place to the truth of God and study with us what may serve to the glory of God, instead of serving their own ambition and avarice in falsely abusing the title and authority of the church (Col. 2:8). 19. The second point: since such ordinances and statutes are made to increase the doctrine of the gospel, let them be established and set up in such a way that there is no abuse or any kind of superstition… 20. The third point: since men are so prompt and ready to love their own inventions and to turn the true religion into superstition; and also the times of the shadows of the Law are passed, and that God now ill be served in Spirit and truth and not in outward ceremonies (Jn. 4:23; Gal. 2:4; 5:1; and the whole epistle of the Hebrews); therefore, above all things, special regard must be taken that nothing be brought into the church except what is profitable and especially appropriate and necessary… But certainly the purest simplicity is the best, and the more Jesus Christ is plainly and simply declared, the more it is agreeable to His Word…”

which+pertains+not+to+conscience+nor+to+salvation+simply%2C+but+only+to+the+external+and+outward+life%29%2C+to+attain+an+end+more+excellent+and+perfect%2C+i.e.%2C+that+the+doctrine+of+salvation+may+take+place+among+the+Jews+%28Acts+15%3A19-21%29.+For+if+it+had+been+otherwise%2C+apostles+would+have+contradicted+themselves.+In+the+beginning%2C+they+agreed+upon+this%E2%80%93that+grace+alone+justified+by+faith+without+the+works+of+the+Law+%28Acts+15%3A9-11%29%3B+and+also+they+would+have+contradicted+the+doctrine+of+Jesus+Christ%2C+who+witnessed+and+said+that+what+enters+into+the+mouth+does+not+defile+a+man%3B+and+St.+Paul%2C+who+was+in+this+council%2C+would+have+been+contrary+to+himself+%28Rom.+14%3A17%3B+1+Cor.+8%3A8%3B+Col.+2%3A16-23%3B+Titus+1%3A14-15%29.+For+shortly+afterwards%2C+he+wrote+that+the+kingdom+of+God+was+not+in+meat+nor+drink%2C+and+that+one+might+eat+of+all+things+without+creating+any+difficulty+for+conscience+sake.+Such+prohibitions+are+devilish+doctrines+%281+Tim.+4%3A1-3%29%2C+except+when+they+are+used+for+the+liberty+of+the+edification+of+neighbors.+For+avoiding+slander+%28Rom.+14%3A13-19%3B+1+Cor.+10%3A23-4%29%2C+let+those+then+who+will+not+understand+this+difference+declare+to+us+why+they+have+abolished+the+apostolic+ordinance%3B+or+whether+they+have+greater+power+than+the+apostles%3B+or+else+whether+they+will+give+place+to+the+truth+of+God+and+study+with+us+what+may+serve+to+the+glory+of+God%2C+instead+of+serving+their+own+ambition+and+avarice+in+falsely+abusing+the+title+and+authority+of+the+church+%28Col.+2%3A8%29.+19.+The+second+point%3A+since+such+ordinances+and+statutes+are+made+to+increase+the+doctrine+of+the+gospel%2C+let+them+be+established+and+set+up+in+such+a+way+that+there+is+no+abuse+or+any+kind+of+superstition%E2%80%A6+20.+The+third+point%3A+since+men+are+so+prompt+and+ready+to+love+their+own+inventions+and+to+turn+the+true+religion+into+superstition%3B+and+also+the+times+of+the+shadows+of+the+Law+are+passed%2C+and+that+God+now+ill+be+served+in+Spirit+and+truth+and+not+in+outward+ceremonies+%28Jn.+4%3A23%3B+Gal.+2%3A4%3B+5%3A1%3B+and+the+whole+epistle+of+the+Hebrews%29%3B+therefore%2C+above+all+things%2C+special+regard+must+be+taken+that+nothing+be+brought+into+the+church+except+what+is+profitable+and+especially+appropriate+and+necessary%E2%80%A6+But+certainly+the+purest+simplicity+is+the+best%2C+and+the+more+Jesus+Christ+is+plainly+and+simply+declared%2C+the+more+it+is+agreeable+to+His+Word%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+%E2%80%98Theodore+Beza%E2%80%99s+Confession+%281560%29%3A+A+Brief+%26+Pithy+Sum+of+Christian+Faith%E2%80%99%2C+5th+Point%2C+%E2%80%98Of+the+Church%E2%80%99%2C+18.+%E2%80%98%E2%80%A6When+or+at+What+Time+They+Should+Establish+Disciplinary+Procedures+in+the+Church%E2%80%99+%26+19-20+in+Reformed+Confessions+of+the+16th+%26+17th+Centuries%2C+ed.+Dennison+%28RHB%2C+2010%29%2C+vol.+2%2C+pp.+311-12&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb8dc92d531.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b8dc92d531.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-church-ordinances/#:~:text=18.%20First%20there%20ought%20to%20be,it%20is%20agreeable%20to%20His%20Word&amp;text=18.%20First%20there%20ought%20to%20be%20a%20greater&amp;text=the%20more%20it%20is%20agreeable%20to%20His%20Word" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c937f8d010" data-kw="">
<blockquote><p>All, therefore, to whom the office of teaching was committed, they called presbyters, and in each city these presbyters selected one of their number to whom they gave the special title of bishop, lest, as usually happens, from equality dissension should arise. The bishop, however, was not so superior in honour and dignity as to have dominion over his colleagues, but as it belongs to a president in an assembly to bring matters before them, collect their opinions, take precedence of others in consulting, advising, exhorting, guide the whole procedure by his authority, and execute what is decreed by common consent, a bishop held the same office in a meeting of presbyters. And the ancients themselves confess that this practice was introduced by human arrangement, according to the exigency of the times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.4.2</span></figcaption>

</figure><figure class="quote" id="q-4ded594794" data-kw="">
<blockquote><p>In giving the name of bishops, presbyters, and pastors, indiscriminately to those who govern churches, I have done it on the authority of Scripture, which uses the words as synonymous. To all who discharge the ministry of the word it gives the name of bishops. Thus Paul, after enjoining Titus to ordain elders in every city, immediately adds, &quot;A bishop must be blameless,&quot; &amp;c., (Tit. 1: 5, 7.) So in another place he salutes several bishops in one church, (Phil. 1: 1.) And in the Acts, the elders of Ephesus, whom he is said to have called together, he, in the course of his address, designates as bishops, (Acts 20: 17.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.3.8</span></figcaption>

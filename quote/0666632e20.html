<blockquote><p>FIFTH QUESTION: THE UNITY OF THE COVENANT OF GRACE Was the covenant of grace one and the same as to substance under each dispensation? We affirm against the Socinians, Anabaptists and Remonstrants I. This most important controversy is waged by us with the ancient and modern Pelagians (to wit, the Socinians, Remonstrants, Anabaptists and others who deny the identity of the gratuitous covenant). They hold that the fathers of the Old Testament were not saved by the gratuitous mercy of God in Christ, the Mediator (God-man, theanthrōpō) through faith in him about to come. Opinion of the Socinians.

II. The Socinians express their opinion in the Racovian Catechism where they assert that in the law of Christ two promises are contained (which were not contained in the law of Moses)—eternal life and the Holy Spirit, “Nowhere will you discover in the law of Moses, either eternal life or the gift of the Spirit promised to those obeying the precepts of the law, as it is evident they are promised in the law given by Christ” (Racovian Catechism 5 [1652], p. 113). Socinus clearly confirms this: “We say, therefore, that the new covenant brought most openly to us the promise of eternal life; moreover the promise of remission of sins. Finally the promise to be obtained by all believers, of the Holy Spirit. Since that old covenant wants and wanted all these and proposed earthly happiness, it is easy to recognize the superiority of the new covenant in this respect” (de Officio Christi+). Volkelius labors to prove the same thing by various arguments (De vera Religione 3.11 [1630], pp. 56–72) and also Smaltzius (De Divinitate Jesu Christi 2 and 7 [1608], pp. 3–7 and 25–29). Still they do not deny that the fathers of the Old Testament were saved or would be saved in eternal happiness. “Not to be guilty of dissimulation,” says Smaltzius, “we firmly maintain, even if no open promise occurs of eternal life in the old covenant, that it would be given at some time or other to all those, who ever trusted in God and obeyed him” (ibid., 7, p. 27). Volkelius agrees with him (ibid.). Nor do they deny that God pardoned their sins, although he had not promised it nor signified his intention to do so (Socinus, De Iesu Christo Servatore, Pt. III. 2 [1594], pp. 228–50; “Tractatus de Justificatione,” 3* Opera Omnia [1656], 1:604–9), and that the fathers had some knowledge and hope of eternal life, although not promised to them (Smaltzius, De Divinitate Jesu Christi 7 [1608], pp. 25–29); that Christ and grace and salvation in Christ had been preached under the Old Testament. Socinus in his Praelect.+: “Now it is certain, that Christ not only really was and is our savior, but it was also predicted by the prophets, as we learn, among other passages, from chap. 23 and 33 of Jeremiah.” But on this account, they do not hold either that the ancients looked to Christ or were saved in the hope of his coming. The same one: “In this I disagree with you, that you seem to concede, that the pious under the Old Testament, looked to Christ in those ceremonies and sacrifices in which he was typified, and were saved in the hope of his coming, a thing of which I can in no way persuade myself” (Socinus, “Ad amicos epistolae: ad Matthaeum Radecium,” Opera Omnia [1656], 1:377). Hence they distinguish between the faith of those times and ours, so that was a faith in God simply and this a faith also in Christ. Smaltzius: “Nor was that faith in Jesus Christ, but in God and his promises” (Refutatio Thesium D. Wolfgangi Frantzii, Disp. 12 [1614], p. 459); and Volkelius holds that the faith of the ancients and ours differs in three things and especially “that now we are commanded to believe as much in Christ as in God; but that formerly such a faith by no means was exercised is evident even from the fact that Christ was not then manifested” (De vera Religione 4.3 [1630], p. 176). Of the Remonstrants.

III. The Remonstrants do not differ from the Socinians. Arminius indeed properly places the agreement of both testaments in the one and same matter of both (to wit, the obedience of faith required in both and the inheritance of eternal life promised through the imputation of the righteousness of faith, and the gracious adoption in Christ) (“Disputation XIII: On the Comparison of the Law and the Gospel,” Works [1956], 1:539–48). The one object is Christ. The difference is in some accidentals which detract nothing from the substantial unity. But his followers speak differently. The apologists call the question concerning faith in Jesus Christ (“whether and how it had a place under the Old Testament”) “absurd, ambiguous and useless and there is certainly no passage where it appears that faith was commanded or flourished under the Old Testament” (“Apologia pro confessione sive declaratione … Remonstrantes,” 7 in Episcopius, Operum theologicorum [1665], Pt. II, p. 155). At length they distinguish the manner of revelation (clear or obscure) and say that faith in Jesus Christ was taught in the Old Testament neither openly and directly, but yet indirectly and obscurely comprehended and involved in the faith of the general favor and grace of God. They say the same thing concerning the promise of eternal life: “From this it is easy to gather what must be determined concerning the famous question, did the promise of eternal life have a place in the old covenant or rather was it comprehended in the covenant itself? For if special promises seem to be expressed in that old covenant, we must confess that no clear promise of eternal life can be found in them. If anyone thinks differently, it is his place to point out where it can be found, which I think cannot be done. But if there seem to be general promises, it must be confessed on the other part that they are such that the promise of eternal life should not only seem to come under, but also by the intention it ought to be believed to have come under them” (Episcopius, “Institutiones theologicae,” 3.4.1 Opera theologica [1678], p. 156). Of the Anabaptists.

IV. Many Anabaptists fall into the same error, as is evident from the Frankenthal Colloquy where they speak of the Israelite people as if they were a herd of swine, whom they jestingly say were fattened on this earth by the Lord without any hope of heavenly immortality (Protocoll … Frankenthal, Art. 15, 16 [J. Meier, 1573], pp. 292–335). They maintain that only temporal goods and earthly promises were granted to them. This was also the impious notion of Servetus, against whom Calvin solidly disputes (Institutes of the Christian Religion, 2.10 pp. 428–49). Statement of the question.

V. From these things the state of the question can clearly be gathered. The question is not: (1) whether the covenant of grace was various as to accidentals and the different modes and degrees of dispensation and manifestation (for we confess that under this relation [schesei] there is a multiple difference between the Old and New Testament or the old and new economy, as will be proved in its proper place). Rather the question is whether it was the same as to substance and the essential parts of the covenant, i.e., both as to the covenanted themselves and as to the federal pact consisting in the mutual obligation of the parties. Whether the same Mediator (Christ) in both; the same faith in Christ; promises of the same spiritual and heavenly blessings; the same way of reconciliation and salvation—the economy and administration only of the covenant varying. This our opponents deny; we affirm.

VI. The question is not whether the fathers of the Old Testament were saved, whether their sins were pardoned, whether they had any hope of eternal life, whether Christ was predicted to them. Most of our adversaries do not dare deny this. Rather the question is whether they looked to Christ and were saved in the hope of his coming. Whether promises not only temporal, but also spiritual and heavenly concerning eternal life and the Holy Spirit were given to them. And whether the same covenant entered into with us in Christ had already been contracted with them, although more obscurely and reservedly. This they deny; we assert. We maintain that Christ was not only predicted but also promised to the fathers and by his grace they were saved under the Old Testament no less than we are saved under the New; nor was any other name given under heaven even from the beginning from which salvation could be hoped for (Acts 4:12) and that too according to the inviolable promise of the gratuitous covenant. The identity of the covenant is proved: (1) from the Scriptures.

VII. The reasons are: First, in general, the Scriptures teach that the covenant of grace (which God contracted with us in the New Testament) is the same with the covenant previously made with Abraham. Hence Zachariah says in his song, “God visited and redeemed his people, as he spake by the mouth of his holy prophets, which have been since the world began: to perform the mercy promised to our fathers, and to remember his holy covenant; the oath which he sware to our father Abraham” (Lk. 1:68, 70, 72, 73). And Peter addressing the Jews concerning the days of Christ (which had been predicted by all the prophets) says, “Ye are the children of the prophets, and of the covenant which God made with our fathers, saying unto Abraham, And in thy seed shall all the kindreds of the earth be blessed” (Acts 3:25). Paul mentions by name the promise of the gospel: “The Scripture, foreseeing that God would justify the heathen through faith, preached before the gospel unto Abraham, saying, In thee shall all nations be blessed” (Gal. 3:8). Hence he brings forward the justification of Abraham by faith as an example for us (Rom. 4:3) and exhibits him as “the father of the faithful” to the Jews as well as the Gentiles (which could not have been done if the covenant was not identical). This is confirmed by the fact that he calls the promise given to Abraham “the covenant that was before confirmed of God in Christ” (diathēkēn prokekyrōmenēn hypo tou Theou eis Christon, Gal. 3:17).

      2. From the identity of the covenant of grace.

VIII. Second, in particular, from all the parts of the covenant of grace which were the same in both cases. Such is the clause of the covenant that God will be our God and the God of our seed; for as it had already been proposed to Abraham (Gen. 17:7) and renewed to Moses in a vision (Ex. 3:15) and frequently in legislation, confirmed in the captivity and after it (Ezk. 36:28), so no other was proposed in the covenant of grace as the foundation of all blessings, spiritual as well as celestial (Mt. 22:32; 2 Cor. 6:16; Rev. 21:3).

      3. From the identity of the Mediator.

IX. Third, the identity of the Mediator (given in the Old and New Testament), the foundation of the covenant. He is the blessed seed of the woman who would bruise the serpent’s head (Gen. 3:15 compared with Heb. 2:14 and Rom. 16:20), the seed of Abraham in whom all the nations of the earth were to be blessed (Gen. 22:18, viz., Christ—cf. Gal. 3:16); in the Old Testament “the angel of Jehovah’s presence” (Is. 63:9), “the angel of the covenant” (Mal. 3:1), “a covenant of the people and of the Gentiles,” i.e., its Mediator (Is. 42:6; 49:8), who bore the griefs of his people and was smitten for their sins (Is. 53:5, 6). In the New Testament, he is the Mediator between God and men (1 Tim. 2:5); the Mediator of the New Testament and of a better covenant (Heb. 8:6; 9:15); “the same yesterday, today and forever” (Heb. 13:8); by whose grace the fathers, no less than we, were saved (Acts 15:10, 11); to whom all the prophets bore testimony (Acts 10:43); the one sole name given under heaven by which we can be saved (Acts 4:12); the Way, the Truth and the Life, so that no one can come to the Father except by him (Jn. 14:6).

X. The objection to Heb. 13:8 is vain. Christ is said to be “the same yesterday, today and forever,” and it is supposed either that it treats of his doctrine, not concerning his person and the covenant made in it. If a doctrine is eternal, therefore also the person who delivers it and the covenant proposed in it is eternal. Or it is supposed that “yesterday” denotes the day of his flesh before his ascension and “today” the time after his ascension. This is repugnant to the aim of Paul, which is to exhort to constancy of faith, the argument being drawn from the identity and perpetuity of the gospel doctrine, of which Christ as Mediator is the object. Or that by “today” and “yesterday” is denoted a thing new and recent which commenced not very long ago (as men are said to be of “yesterday” in Job 8:9 and among the Greeks ephēmeroi [“beings of a day”] on account of the shortness of their lives). The expressions are very dissimilar. To be mthmvl (“from yesterday and the day before”) depresses human nature. But here Christ is said to have been yesterday and to be today and forever through all the differences of time, to denote his glory and eternity. Nor is he only said to be yesterday, today and forever, but the same, i.e., not different, either now or then or afterwards; but always and everywhere the same Jesus Christ. This could not be said if Christ had not even from the beginning been the Mediator of the covenant of grace and the Prophet and teacher of the church.

XI. Acts 15:11 cannot be understood of the apostles compared with the converted Gentile believers and not with the fathers of the Old Testament (as they maintain). For Peter had spoken proximately of the fathers and so the following words are fitly referred to them—“But we believe that through the grace of the Lord Jesus Christ, we shall be saved, even as they (kath’ hon tropon kakeinoi).” (2) The design of Peter demands this. He wishes to prove that the yoke of the ceremonial law is not to be placed on the necks of the Gentiles for this reason—that the fathers themselves could not bear it, but were saved by the same grace of Christ as we. (3) If the apostles had wished to join themselves with the Gentiles in the manner of salvation, they would not have said we believe that we are saved even as they; but rather vice versa, they even as we. It did not become the apostles to follow the Gentiles and to set these before themselves as an example in the manner of salvation, but the contrary. (4) Nor is it absurd for Peter (discoursing concerning the manner in which the Gentiles should obtain salvation) to end with an argument taken from the fathers, because there is one method of salvation for all. If the yoke of the law was insufferable (abastakton) to the fathers, it is rightly inferred that the Gentiles are not to be subjected to that yoke.

XII. It is also falsely alleged that the words “There is none other name under heaven given among men, whereby we must be saved” (Acts 4:12) refer only to the time in which Christ was manifested and cannot be extended to the past. The words themselves disprove this interpretation. They do not assert that there is now no name given to men whereby they can be saved, but that no name is given among men (en anthrōpois) in all time. The thing itself demands this. For since no salvation can be granted to the sinner without a mediator (and there is no mediator except Christ), it follows either that the fathers had no salvation or that they were saved by Christ. Nor if the words are used in the present, are the past or the future excluded; but this is done that the truth of the mediation of Christ may be predicated of all time.

XIII. The words “from the foundation of the world” (apo katabolēs kosmou, Rev. 13:8) are not to be separated from those which immediately precede (“the Lamb slain”) and to be joined with “the book of life” by transposition (as is the case in Rev. 17:8). (1) There is no necessity for such a transposition doing violence to the series of the discourse, which flows far more smoothly when we thus read—“whose names are not written in the book of life of the Lamb slain from the foundation of the world”—than according to the wish of our opponents—“whose names are written from the foundation of the world in the book of life of the Lamb slain.” For as the book of life is said “to be the book of life of the Lamb” (Rev. 21:27), it ought not to be torn away from the words “of the Lamb slain” (arniou esphagmenou). (2) “The Lamb slain” is nowhere put by itself, but mention is always made either of the time from which or of the persons for whom (or for what causes) he was slain. (3) It is most properly said “slain from the foundation of the world”; not in himself, but intentionally, in the decree of God; objectively, in the promises of the word and the faith of the fathers; typically, in sacraments and sacrifices. (4) Even granting that the words are to be so explained, the force of the argument is not destroyed because no one can be written in the book of life, except in Christ slain (or in his death).</p></blockquote>

IX. Third, the identity of the Mediator (given in the Old and New Testament), the foundation of the covenant. He is the blessed seed of the woman who would bruise the serpent’s head (Gen. 3:15 compared with Heb. 2:14 and Rom. 16:20), the seed of Abraham in whom all the nations of the earth were to be blessed (Gen. 22:18, viz., Christ—cf. Gal. 3:16); in the Old Testament “the angel of Jehovah’s presence” (Is. 63:9), “the angel of the covenant” (Mal. 3:1), “a covenant of the people and of the Gentiles,” i.e., its Mediator (Is. 42:6; 49:8), who bore the griefs of his people and was smitten for their sins (Is. 53:5, 6). In the New Testament, he is the Mediator between God and men (1 Tim. 2:5); the Mediator of the New Testament and of a better covenant (Heb. 8:6; 9:15); “the same yesterday, today and forever” (Heb. 13:8); by whose grace the fathers, no less than we, were saved (Acts 15:10, 11); to whom all the prophets bore testimony (Acts 10:43); the one sole name given under heaven by which we can be saved (Acts 4:12); the Way, the Truth and the Life, so that no one can come to the Father except by him (Jn. 14:6).

X. The objection to Heb. 13:8 is vain. Christ is said to be “the same yesterday, today and forever,” and it is supposed either that it treats of his doctrine, not concerning his person and the covenant made in it. If a doctrine is eternal, therefore also the person who delivers it and the covenant proposed in it is eternal. Or it is supposed that “yesterday” denotes the day of his flesh before his ascension and “today” the time after his ascension. This is repugnant to the aim of Paul, which is to exhort to constancy of faith, the argument being drawn from the identity and perpetuity of the gospel doctrine, of which Christ as Mediator is the object. Or that by “today” and “yesterday” is denoted a thing new and recent which commenced not very long ago (as men are said to be of “yesterday” in Job 8:9 and among the Greeks ephēmeroi [“beings of a day”] on account of the shortness of their lives). The expressions are very dissimilar. To be mthmvl (“from yesterday and the day before”) depresses human nature. But here Christ is said to have been yesterday and to be today and forever through all the differences of time, to denote his glory and eternity. Nor is he only said to be yesterday, today and forever, but the same, i.e., not different, either now or then or afterwards; but always and everywhere the same Jesus Christ. This could not be said if Christ had not even from the beginning been the Mediator of the covenant of grace and the Prophet and teacher of the church.

XI. Acts 15:11 cannot be understood of the apostles compared with the converted Gentile believers and not with the fathers of the Old Testament (as they maintain). For Peter had spoken proximately of the fathers and so the following words are fitly referred to them—“But we believe that through the grace of the Lord Jesus Christ, we shall be saved, even as they (kath’ hon tropon kakeinoi).” (2) The design of Peter demands this. He wishes to prove that the yoke of the ceremonial law is not to be placed on the necks of the Gentiles for this reason—that the fathers themselves could not bear it, but were saved by the same grace of Christ as we. (3) If the apostles had wished to join themselves with the Gentiles in the manner of salvation, they would not have said we believe that we are saved even as they; but rather vice versa, they even as we. It did not become the apostles to follow the Gentiles and to set these before themselves as an example in the manner of salvation, but the contrary. (4) Nor is it absurd for Peter (discoursing concerning the manner in which the Gentiles should obtain salvation) to end with an argument taken from the fathers, because there is one method of salvation for all. If the yoke of the law was insufferable (abastakton) to the fathers, it is rightly inferred that the Gentiles are not to be subjected to that yoke.

XII. It is also falsely alleged that the words “There is none other name under heaven given among men, whereby we must be saved” (Acts 4:12) refer only to the time in which Christ was manifested and cannot be extended to the past. The words themselves disprove this interpretation. They do not assert that there is now no name given to men whereby they can be saved, but that no name is given among men (en anthrōpois) in all time. The thing itself demands this. For since no salvation can be granted to the sinner without a mediator (and there is no mediator except Christ), it follows either that the fathers had no salvation or that they were saved by Christ. Nor if the words are used in the present, are the past or the future excluded; but this is done that the truth of the mediation of Christ may be predicated of all time.

XIII. The words “from the foundation of the world” (apo katabolēs kosmou, Rev. 13:8) are not to be separated from those which immediately precede (“the Lamb slain”) and to be joined with “the book of life” by transposition (as is the case in Rev. 17:8). (1) There is no necessity for such a transposition doing violence to the series of the discourse, which flows far more smoothly when we thus read—“whose names are not written in the book of life of the Lamb slain from the foundation of the world”—than according to the wish of our opponents—“whose names are written from the foundation of the world in the book of life of the Lamb slain.” For as the book of life is said “to be the book of life of the Lamb” (Rev. 21:27), it ought not to be torn away from the words “of the Lamb slain” (arniou esphagmenou). (2) “The Lamb slain” is nowhere put by itself, but mention is always made either of the time from which or of the persons for whom (or for what causes) he was slain. (3) It is most properly said “slain from the foundation of the world”; not in himself, but intentionally, in the decree of God; objectively, in the promises of the word and the faith of the fathers; typically, in sacraments and sacrifices. (4) Even granting that the words are to be so explained, the force of the argument is not destroyed because no one can be written in the book of life, except in Christ slain (or in his death).”

maltzius+%28De+Divinitate+Jesu+Christi+2+and+7+%5B1608%5D%2C+pp.+3%E2%80%937+and+25%E2%80%9329%29.+Still+they+do+not+deny+that+the+fathers+of+the+Old+Testament+were+saved+or+would+be+saved+in+eternal+happiness.+%E2%80%9CNot+to+be+guilty+of+dissimulation%2C%E2%80%9D+says+Smaltzius%2C+%E2%80%9Cwe+firmly+maintain%2C+even+if+no+open+promise+occurs+of+eternal+life+in+the+old+covenant%2C+that+it+would+be+given+at+some+time+or+other+to+all+those%2C+who+ever+trusted+in+God+and+obeyed+him%E2%80%9D+%28ibid.%2C+7%2C+p.+27%29.+Volkelius+agrees+with+him+%28ibid.%29.+Nor+do+they+deny+that+God+pardoned+their+sins%2C+although+he+had+not+promised+it+nor+signified+his+intention+to+do+so+%28Socinus%2C+De+Iesu+Christo+Servatore%2C+Pt.+III.+2+%5B1594%5D%2C+pp.+228%E2%80%9350%3B+%E2%80%9CTractatus+de+Justificatione%2C%E2%80%9D+3%2A+Opera+Omnia+%5B1656%5D%2C+1%3A604%E2%80%939%29%2C+and+that+the+fathers+had+some+knowledge+and+hope+of+eternal+life%2C+although+not+promised+to+them+%28Smaltzius%2C+De+Divinitate+Jesu+Christi+7+%5B1608%5D%2C+pp.+25%E2%80%9329%29%3B+that+Christ+and+grace+and+salvation+in+Christ+had+been+preached+under+the+Old+Testament.+Socinus+in+his+Praelect.%2B%3A+%E2%80%9CNow+it+is+certain%2C+that+Christ+not+only+really+was+and+is+our+savior%2C+but+it+was+also+predicted+by+the+prophets%2C+as+we+learn%2C+among+other+passages%2C+from+chap.+23+and+33+of+Jeremiah.%E2%80%9D+But+on+this+account%2C+they+do+not+hold+either+that+the+ancients+looked+to+Christ+or+were+saved+in+the+hope+of+his+coming.+The+same+one%3A+%E2%80%9CIn+this+I+disagree+with+you%2C+that+you+seem+to+concede%2C+that+the+pious+under+the+Old+Testament%2C+looked+to+Christ+in+those+ceremonies+and+sacrifices+in+which+he+was+typified%2C+and+were+saved+in+the+hope+of+his+coming%2C+a+thing+of+which+I+can+in+no+way+persuade+myself%E2%80%9D+%28Socinus%2C+%E2%80%9CAd+amicos+epistolae%3A+ad+Matthaeum+Radecium%2C%E2%80%9D+Opera+Omnia+%5B1656%5D%2C+1%3A377%29.+Hence+they+distinguish+between+the+faith+of+those+times+and+ours%2C+so+that+was+a+faith+in+God+simply+and+this+a+faith+also+in+Christ.+Smaltzius%3A+%E2%80%9CNor+was+that+faith+in+Jesus+Christ%2C+but+in+God+and+his+promises%E2%80%9D+%28Refutatio+Thesium+D.+Wolfgangi+Frantzii%2C+Disp.+12+%5B1614%5D%2C+p.+459%29%3B+and+Volkelius+holds+that+the+faith+of+the+ancients+and+ours+differs+in+three+things+and+especially+%E2%80%9Cthat+now+we+are+commanded+to+believe+as+much+in+Christ+as+in+God%3B+but+that+formerly+such+a+faith+by+no+means+was+exercised+is+evident+even+from+the+fact+that+Christ+was+not+then+manifested%E2%80%9D+%28De+vera+Religione+4.3+%5B1630%5D%2C+p.+176%29.+Of+the+Remonstrants.+III.+The+Remonstrants+do+not+differ+from+the+Socinians.+Arminius+indeed+properly+places+the+agreement+of+both+testaments+in+the+one+and+same+matter+of+both+%28to+wit%2C+the+obedience+of+faith+required+in+both+and+the+inheritance+of+eternal+life+promised+through+the+imputation+of+the+righteousness+of+faith%2C+and+the+gracious+adoption+in+Christ%29+%28%E2%80%9CDisputation+XIII%3A+On+the+Comparison+of+the+Law+and+the+Gospel%2C%E2%80%9D+Works+%5B1956%5D%2C+1%3A539%E2%80%9348%29.+The+one+object+is+Christ.+The+difference+is+in+some+accidentals+which+detract+nothing+from+the+substantial+unity.+But+his+followers+speak+differently.+The+apologists+call+the+question+concerning+faith+in+Jesus+Christ+%28%E2%80%9Cwhether+and+how+it+had+a+place+under+the+Old+Testament%E2%80%9D%29+%E2%80%9Cabsurd%2C+ambiguous+and+useless+and+there+is+certainly+no+passage+where+it+appears+that+faith+was+commanded+or+flourished+under+the+Old+Testament%E2%80%9D+%28%E2%80%9CApologia+pro+confessione+sive+declaratione+%E2%80%A6+Remonstrantes%2C%E2%80%9D+7+in+Episcopius%2C+Operum+theologicorum+%5B1665%5D%2C+Pt.+II%2C+p.+155%29.+At+length+they+distinguish+the+manner+of+revelation+%28clear+or+obscure%29+and+say+that+faith+in+Jesus+Christ+was+taught+in+the+Old+Testament+neither+openly+and+directly%2C+but+yet+indirectly+and+obscurely+comprehended+and+involved+in+the+faith+of+the+general+favor+and+grace+of+God.+They+say+the+same+thing+concerning+the+promise+of+eternal+life%3A+%E2%80%9CFrom+this+it+is+easy+to+gather+what+must+be+determined+concerning+the+famous+question%2C+did+the+promise+of+eternal+life+have+a+place+in+the+old+covenant+or+rather+was+it+comprehended+in+the+covenant+itself%3F+For+if+special+promises+seem+to+be+expressed+in+that+old+covenant%2C+we+must+confess+that+no+clear+promise+of+eternal+life+can+be+found+in+them.+If+anyone+thinks+differently%2C+it+is+his+place+to+point+out+where+it+can+be+found%2C+which+I+think+cannot+be+done.+But+if+there+seem+to+be+general+promises%2C+it+must+be+confessed+on+the+other+part+that+they+are+such+that+the+promise+of+eternal+life+should+not+only+seem+to+come+under%2C+but+also+by+the+intention+it+ought+to+be+believed+to+have+come+under+them%E2%80%9D+%28Episcopius%2C+%E2%80%9CInstitutiones+theologicae%2C%E2%80%9D+3.4.1+Opera+theologica+%5B1678%5D%2C+p.+156%29.+Of+the+Anabaptists.+IV.+Many+Anabaptists+fall+into+the+same+error%2C+as+is+evident+from+the+Frankenthal+Colloquy+where+they+speak+of+the+Israelite+people+as+if+they+were+a+herd+of+swine%2C+whom+they+jestingly+say+were+fattened+on+this+earth+by+the+Lord+without+any+hope+of+heavenly+immortality+%28Protocoll+%E2%80%A6+Frankenthal%2C+Art.+15%2C+16+%5BJ.+Meier%2C+1573%5D%2C+pp.+292%E2%80%93335%29.+They+maintain+that+only+temporal+goods+and+earthly+promises+were+granted+to+them.+This+was+also+the+impious+notion+of+Servetus%2C+against+whom+Calvin+solidly+disputes+%28Institutes+of+the+Christian+Religion%2C+2.10+pp.+428%E2%80%9349%29.+Statement+of+the+question.+V.+From+these+things+the+state+of+the+question+can+clearly+be+gathered.+The+question+is+not%3A+%281%29+whether+the+covenant+of+grace+was+various+as+to+accidentals+and+the+different+modes+and+degrees+of+dispensation+and+manifestation+%28for+we+confess+that+under+this+relation+%5Bschesei%5D+there+is+a+multiple+difference+between+the+Old+and+New+Testament+or+the+old+and+new+economy%2C+as+will+be+proved+in+its+proper+place%29.+Rather+the+question+is+whether+it+was+the+same+as+to+substance+and+the+essential+parts+of+the+covenant%2C+i.e.%2C+both+as+to+the+covenanted+themselves+and+as+to+the+federal+pact+consisting+in+the+mutual+obligation+of+the+parties.+Whether+the+same+Mediator+%28Christ%29+in+both%3B+the+same+faith+in+Christ%3B+promises+of+the+same+spiritual+and+heavenly+blessings%3B+the+same+way+of+reconciliation+and+salvation%E2%80%94the+economy+and+administration+only+of+the+covenant+varying.+This+our+opponents+deny%3B+we+affirm.+VI.+The+question+is+not+whether+the+fathers+of+the+Old+Testament+were+saved%2C+whether+their+sins+were+pardoned%2C+whether+they+had+any+hope+of+eternal+life%2C+whether+Christ+was+predicted+to+them.+Most+of+our+adversaries+do+not+dare+deny+this.+Rather+the+question+is+whether+they+looked+to+Christ+and+were+saved+in+the+hope+of+his+coming.+Whether+promises+not+only+temporal%2C+but+also+spiritual+and+heavenly+concerning+eternal+life+and+the+Holy+Spirit+were+given+to+them.+And+whether+the+same+covenant+entered+into+with+us+in+Christ+had+already+been+contracted+with+them%2C+although+more+obscurely+and+reservedly.+This+they+deny%3B+we+assert.+We+maintain+that+Christ+was+not+only+predicted+but+also+promised+to+the+fathers+and+by+his+grace+they+were+saved+under+the+Old+Testament+no+less+than+we+are+saved+under+the+New%3B+nor+was+any+other+name+given+under+heaven+even+from+the+beginning+from+which+salvation+could+be+hoped+for+%28Acts+4%3A12%29+and+that+too+according+to+the+inviolable+promise+of+the+gratuitous+covenant.+The+identity+of+the+covenant+is+proved%3A+%281%29+from+the+Scriptures.+VII.+The+reasons+are%3A+First%2C+in+general%2C+the+Scriptures+teach+that+the+covenant+of+grace+%28which+God+contracted+with+us+in+the+New+Testament%29+is+the+same+with+the+covenant+previously+made+with+Abraham.+Hence+Zachariah+says+in+his+song%2C+%E2%80%9CGod+visited+and+redeemed+his+people%2C+as+he+spake+by+the+mouth+of+his+holy+prophets%2C+which+have+been+since+the+world+began%3A+to+perform+the+mercy+promised+to+our+fathers%2C+and+to+remember+his+holy+covenant%3B+the+oath+which+he+sware+to+our+father+Abraham%E2%80%9D+%28Lk.+1%3A68%2C+70%2C+72%2C+73%29.+And+Peter+addressing+the+Jews+concerning+the+days+of+Christ+%28which+had+been+predicted+by+all+the+prophets%29+says%2C+%E2%80%9CYe+are+the+children+of+the+prophets%2C+and+of+the+covenant+which+God+made+with+our+fathers%2C+saying+unto+Abraham%2C+And+in+thy+seed+shall+all+the+kindreds+of+the+earth+be+blessed%E2%80%9D+%28Acts+3%3A25%29.+Paul+mentions+by+name+the+promise+of+the+gospel%3A+%E2%80%9CThe+Scripture%2C+foreseeing+that+God+would+justify+the+heathen+through+faith%2C+preached+before+the+gospel+unto+Abraham%2C+saying%2C+In+thee+shall+all+nations+be+blessed%E2%80%9D+%28Gal.+3%3A8%29.+Hence+he+brings+forward+the+justification+of+Abraham+by+faith+as+an+example+for+us+%28Rom.+4%3A3%29+and+exhibits+him+as+%E2%80%9Cthe+father+of+the+faithful%E2%80%9D+to+the+Jews+as+well+as+the+Gentiles+%28which+could+not+have+been+done+if+the+covenant+was+not+identical%29.+This+is+confirmed+by+the+fact+that+he+calls+the+promise+given+to+Abraham+%E2%80%9Cthe+covenant+that+was+before+confirmed+of+God+in+Christ%E2%80%9D+%28diath%C4%93k%C4%93n+prokekyr%C5%8Dmen%C4%93n+hypo+tou+Theou+eis+Christon%2C+Gal.+3%3A17%29.+2.+From+the+identity+of+the+covenant+of+grace.+VIII.+Second%2C+in+particular%2C+from+all+the+parts+of+the+covenant+of+grace+which+were+the+same+in+both+cases.+Such+is+the+clause+of+the+covenant+that+God+will+be+our+God+and+the+God+of+our+seed%3B+for+as+it+had+already+been+proposed+to+Abraham+%28Gen.+17%3A7%29+and+renewed+to+Moses+in+a+vision+%28Ex.+3%3A15%29+and+frequently+in+legislation%2C+confirmed+in+the+captivity+and+after+it+%28Ezk.+36%3A28%29%2C+so+no+other+was+proposed+in+the+covenant+of+grace+as+the+foundation+of+all+blessings%2C+spiritual+as+well+as+celestial+%28Mt.+22%3A32%3B+2+Cor.+6%3A16%3B+Rev.+21%3A3%29.+3.+From+the+identity+of+the+Mediator.+IX.+Third%2C+the+identity+of+the+Mediator+%28given+in+the+Old+and+New+Testament%29%2C+the+foundation+of+the+covenant.+He+is+the+blessed+seed+of+the+woman+who+would+bruise+the+serpent%E2%80%99s+head+%28Gen.+3%3A15+compared+with+Heb.+2%3A14+and+Rom.+16%3A20%29%2C+the+seed+of+Abraham+in+whom+all+the+nations+of+the+earth+were+to+be+blessed+%28Gen.+22%3A18%2C+viz.%2C+Christ%E2%80%94cf.+Gal.+3%3A16%29%3B+in+the+Old+Testament+%E2%80%9Cthe+angel+of+Jehovah%E2%80%99s+presence%E2%80%9D+%28Is.+63%3A9%29%2C+%E2%80%9Cthe+angel+of+the+covenant%E2%80%9D+%28Mal.+3%3A1%29%2C+%E2%80%9Ca+covenant+of+the+people+and+of+the+Gentiles%2C%E2%80%9D+i.e.%2C+its+Mediator+%28Is.+42%3A6%3B+49%3A8%29%2C+who+bore+the+griefs+of+his+people+and+was+smitten+for+their+sins+%28Is.+53%3A5%2C+6%29.+In+the+New+Testament%2C+he+is+the+Mediator+between+God+and+men+%281+Tim.+2%3A5%29%3B+the+Mediator+of+the+New+Testament+and+of+a+better+covenant+%28Heb.+8%3A6%3B+9%3A15%29%3B+%E2%80%9Cthe+same+yesterday%2C+today+and+forever%E2%80%9D+%28Heb.+13%3A8%29%3B+by+whose+grace+the+fathers%2C+no+less+than+we%2C+were+saved+%28Acts+15%3A10%2C+11%29%3B+to+whom+all+the+prophets+bore+testimony+%28Acts+10%3A43%29%3B+the+one+sole+name+given+under+heaven+by+which+we+can+be+saved+%28Acts+4%3A12%29%3B+the+Way%2C+the+Truth+and+the+Life%2C+so+that+no+one+can+come+to+the+Father+except+by+him+%28Jn.+14%3A6%29.+X.+The+objection+to+Heb.+13%3A8+is+vain.+Christ+is+said+to+be+%E2%80%9Cthe+same+yesterday%2C+today+and+forever%2C%E2%80%9D+and+it+is+supposed+either+that+it+treats+of+his+doctrine%2C+not+concerning+his+person+and+the+covenant+made+in+it.+If+a+doctrine+is+eternal%2C+therefore+also+the+person+who+delivers+it+and+the+covenant+proposed+in+it+is+eternal.+Or+it+is+supposed+that+%E2%80%9Cyesterday%E2%80%9D+denotes+the+day+of+his+flesh+before+his+ascension+and+%E2%80%9Ctoday%E2%80%9D+the+time+after+his+ascension.+This+is+repugnant+to+the+aim+of+Paul%2C+which+is+to+exhort+to+constancy+of+faith%2C+the+argument+being+drawn+from+the+identity+and+perpetuity+of+the+gospel+doctrine%2C+of+which+Christ+as+Mediator+is+the+object.+Or+that+by+%E2%80%9Ctoday%E2%80%9D+and+%E2%80%9Cyesterday%E2%80%9D+is+denoted+a+thing+new+and+recent+which+commenced+not+very+long+ago+%28as+men+are+said+to+be+of+%E2%80%9Cyesterday%E2%80%9D+in+Job+8%3A9+and+among+the+Greeks+eph%C4%93meroi+%5B%E2%80%9Cbeings+of+a+day%E2%80%9D%5D+on+account+of+the+shortness+of+their+lives%29.+The+expressions+are+very+dissimilar.+To+be+mthmvl+%28%E2%80%9Cfrom+yesterday+and+the+day+before%E2%80%9D%29+depresses+human+nature.+But+here+Christ+is+said+to+have+been+yesterday+and+to+be+today+and+forever+through+all+the+differences+of+time%2C+to+denote+his+glory+and+eternity.+Nor+is+he+only+said+to+be+yesterday%2C+today+and+forever%2C+but+the+same%2C+i.e.%2C+not+different%2C+either+now+or+then+or+afterwards%3B+but+always+and+everywhere+the+same+Jesus+Christ.+This+could+not+be+said+if+Christ+had+not+even+from+the+beginning+been+the+Mediator+of+the+covenant+of+grace+and+the+Prophet+and+teacher+of+the+church.+XI.+Acts+15%3A11+cannot+be+understood+of+the+apostles+compared+with+the+converted+Gentile+believers+and+not+with+the+fathers+of+the+Old+Testament+%28as+they+maintain%29.+For+Peter+had+spoken+proximately+of+the+fathers+and+so+the+following+words+are+fitly+referred+to+them%E2%80%94%E2%80%9CBut+we+believe+that+through+the+grace+of+the+Lord+Jesus+Christ%2C+we+shall+be+saved%2C+even+as+they+%28kath%E2%80%99+hon+tropon+kakeinoi%29.%E2%80%9D+%282%29+The+design+of+Peter+demands+this.+He+wishes+to+prove+that+the+yoke+of+the+ceremonial+law+is+not+to+be+placed+on+the+necks+of+the+Gentiles+for+this+reason%E2%80%94that+the+fathers+themselves+could+not+bear+it%2C+but+were+saved+by+the+same+grace+of+Christ+as+we.+%283%29+If+the+apostles+had+wished+to+join+themselves+with+the+Gentiles+in+the+manner+of+salvation%2C+they+would+not+have+said+we+believe+that+we+are+saved+even+as+they%3B+but+rather+vice+versa%2C+they+even+as+we.+It+did+not+become+the+apostles+to+follow+the+Gentiles+and+to+set+these+before+themselves+as+an+example+in+the+manner+of+salvation%2C+but+the+contrary.+%284%29+Nor+is+it+absurd+for+Peter+%28discoursing+concerning+the+manner+in+which+the+Gentiles+should+obtain+salvation%29+to+end+with+an+argument+taken+from+the+fathers%2C+because+there+is+one+method+of+salvation+for+all.+If+the+yoke+of+the+law+was+insufferable+%28abastakton%29+to+the+fathers%2C+it+is+rightly+inferred+that+the+Gentiles+are+not+to+be+subjected+to+that+yoke.+XII.+It+is+also+falsely+alleged+that+the+words+%E2%80%9CThere+is+none+other+name+under+heaven+given+among+men%2C+whereby+we+must+be+saved%E2%80%9D+%28Acts+4%3A12%29+refer+only+to+the+time+in+which+Christ+was+manifested+and+cannot+be+extended+to+the+past.+The+words+themselves+disprove+this+interpretation.+They+do+not+assert+that+there+is+now+no+name+given+to+men+whereby+they+can+be+saved%2C+but+that+no+name+is+given+among+men+%28en+anthr%C5%8Dpois%29+in+all+time.+The+thing+itself+demands+this.+For+since+no+salvation+can+be+granted+to+the+sinner+without+a+mediator+%28and+there+is+no+mediator+except+Christ%29%2C+it+follows+either+that+the+fathers+had+no+salvation+or+that+they+were+saved+by+Christ.+Nor+if+the+words+are+used+in+the+present%2C+are+the+past+or+the+future+excluded%3B+but+this+is+done+that+the+truth+of+the+mediation+of+Christ+may+be+predicated+of+all+time.+XIII.+The+words+%E2%80%9Cfrom+the+foundation+of+the+world%E2%80%9D+%28apo+katabol%C4%93s+kosmou%2C+Rev.+13%3A8%29+are+not+to+be+separated+from+those+which+immediately+precede+%28%E2%80%9Cthe+Lamb+slain%E2%80%9D%29+and+to+be+joined+with+%E2%80%9Cthe+book+of+life%E2%80%9D+by+transposition+%28as+is+the+case+in+Rev.+17%3A8%29.+%281%29+There+is+no+necessity+for+such+a+transposition+doing+violence+to+the+series+of+the+discourse%2C+which+flows+far+more+smoothly+when+we+thus+read%E2%80%94%E2%80%9Cwhose+names+are+not+written+in+the+book+of+life+of+the+Lamb+slain+from+the+foundation+of+the+world%E2%80%9D%E2%80%94than+according+to+the+wish+of+our+opponents%E2%80%94%E2%80%9Cwhose+names+are+written+from+the+foundation+of+the+world+in+the+book+of+life+of+the+Lamb+slain.%E2%80%9D+For+as+the+book+of+life+is+said+%E2%80%9Cto+be+the+book+of+life+of+the+Lamb%E2%80%9D+%28Rev.+21%3A27%29%2C+it+ought+not+to+be+torn+away+from+the+words+%E2%80%9Cof+the+Lamb+slain%E2%80%9D+%28arniou+esphagmenou%29.+%282%29+%E2%80%9CThe+Lamb+slain%E2%80%9D+is+nowhere+put+by+itself%2C+but+mention+is+always+made+either+of+the+time+from+which+or+of+the+persons+for+whom+%28or+for+what+causes%29+he+was+slain.+%283%29+It+is+most+properly+said+%E2%80%9Cslain+from+the+foundation+of+the+world%E2%80%9D%3B+not+in+himself%2C+but+intentionally%2C+in+the+decree+of+God%3B+objectively%2C+in+the+promises+of+the+word+and+the+faith+of+the+fathers%3B+typically%2C+in+sacraments+and+sacrifices.+%284%29+Even+granting+that+the+words+are+to+be+so+explained%2C+the+force+of+the+argument+is+not+destroyed+because+no+one+can+be+written+in+the+book+of+life%2C+except+in+Christ+slain+%28or+in+his+death%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger%2C+vol.+2+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%9397%29%2C+192%E2%80%9396+%2812.5.1%E2%80%9313%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0666632e20.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0666632e20.html">Permalink</a><a class="src" href="https://heidelblog.net/2020/04/turretin-we-affirm-the-unity-of-the-covenant-of-grace-against-the-socinians-remonstrants-and-anabaptists/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Obs. XXIX. The new covenant is made with them alone who effectually and eventually are made partakers of the grace of it. — “This is the covenant that I will make with them,..... I will be merciful unto their unrighteousness,” etc. Those with whom the old covenant was made were all of them actual partakers of the benefits of it; and if they are not so with whom the new is made, it comes short of the old in efficacy, and may be utterly frustrated. Neither doth the indefinite proposal of the terms of the covenant prove that the covenant is made with them, or any of them, who enjoy not the benefits of it. Indeed this is the excellency of this covenant, and so it is here declared, that it doth effectually communicate all the grace and mercy contained in it unto all and every one with whom it is made; whomsoever it is made withal, his sins are pardoned.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Obs. XXIX. The new covenant is made with them alone who effectually and eventually are made partakers of the grace of it. — “This is the covenant that I will make with them,..... I will be merciful unto their unrighteousness,” etc. Those with whom the old covenant was made were all of them actual partakers of the benefits of it; and if they are not so with whom the new is made, it comes short of the old in efficacy, and may be utterly frustrated. Neither doth the indefinite proposal of the terms of the covenant prove that the covenant is made with them, or any of them, who enjoy not the benefits of it. Indeed this is the excellency of this covenant, and so it is here declared, that it doth effectually communicate all the grace and mercy contained in it unto all and every one with whom it is made; whomsoever it is made withal, his sins are pardoned.”

— John Owen, An Exposition of the Epistle to the Hebrews, 8:12; Works, vol. 22, p. 207">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObs.%20XXIX.%20The%20new%20covenant%20is%20made%20with%20them%20alone%20who%20effectually%20and%20eventually%20are%20made%20partakers%20of%20the%20grace%20of%20it.%20%E2%80%94%20%E2%80%9CThis%20is%20the%20covenant%20that%20I%20will%20make%20with%20them%2C.....%20I%20will%20be%20merciful%20unto%20their%20unrighteousness%2C%E2%80%9D%20etc.%20Those%20with%20whom%20the%20old%20covenant%20was%20made%20were%20all%20of%20them%20actual%20partakers%20of%20the%20benefits%20of%20it%3B%20and%20if%20they%20are%20not%20so%20with%20whom%20the%20new%20is%20made%2C%20it%20comes%20short%20of%20the%20old%20in%20efficacy%2C%20and%20may%20be%20utterly%20frustrated.%20Neither%20doth%20the%20indefinite%20proposal%20of%20the%20terms%20of%20the%20covenant%20prove%20that%20the%20covenant%20is%20made%20with%20them%2C%20or%20any%20of%20them%2C%20who%20enjoy%20not%20the%20benefits%20of%20it.%20Indeed%20this%20is%20the%20excellency%20of%20this%20covenant%2C%20and%20so%20it%20is%20here%20declared%2C%20that%20it%20doth%20effectually%20communicate%20all%20the%20grace%20and%20mercy%20contained%20in%20it%20unto%20all%20and%20every%20one%20with%20whom%20it%20is%20made%3B%20whomsoever%20it%20is%20made%20withal%2C%20his%20sins%20are%20pardoned.%E2%80%9D%0A%0A%E2%80%94%20John%20Owen%2C%20An%20Exposition%20of%20the%20Epistle%20to%20the%20Hebrews%2C%208%3A12&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1a4f8877c3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1a4f8877c3.html">Permalink</a><a class="src" href="https://archive.org/details/worksofjohnowend0023owen" rel="noopener" target="_blank">Read it online · Internet Archive (Goold)</a></div>
</figure><figure class="quote" id="q-c387c9c582" data-kw="">
<blockquote><p>Jonah would not have shrunk from God’s command, had he been sent to the Ninevites to teach what he had been ordered to do among the chosen people. Had then a message been committed to Jonah, to set forth a gracious and merciful God to the Ninevites, he would not have hesitated a moment to offer his service. But as this express threatening, Nineveh shall be destroyed, was given him in charge, he became confounded, and sought at length to flee away rather than to execute such a command. Why so? Because he thus reasoned with himself, “I am to denounce a near ruin on the Ninevites; why does God command me to do this, except to invite these wretched men to repentance? Now if they repent, will not God be instantly ready to forgive them? He would otherwise deny his own nature: God cannot be unlike Himself, He cannot put off that disposition of which He has once testified to Moses [Ex. 34]. Since God, then, is reconcilable, if the Ninevites will return to the right way and flee to him, He will instantly embrace them: thus I shall be found to be false in my preaching.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jonah</cite>, ch. 4, verse 2</span></figcaption>

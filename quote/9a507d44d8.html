<blockquote><p>If Christ made satisfaction for our sins by the obedience with which He fulfilled the law, so that that [obedience] is imputed to us by God as though we ourselves had fulfilled [the law], then it follows therefrom that we are set free from obedience of the law, because—according to this hypothesis—Christ has fulfilled it for us or in our stead.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2b18c6ea1b" data-kw="">
<blockquote><p>Here the preceding cause [in Rom. 3:24] is Christ constituted a propitiation in his blood. In this impulsive cause, two things are noted: First, Christ’s justice or obedience is the meritorious cause of our salvation; Second, this justice and obedience consists in full satisfaction for our sins and complete fulfillment of the Law for us. Concerning the first, that Christ’s justice is the meritorious cause of our salvation: since it seems to conflict that we are saved by free grace and by merit, that is, a price paid, it must be thus understood. Christ’s merit opposes not God’s judgment simply or in itself, for Christ, as man and Son of God by the union of divine and human natures, has this of grace, not having earned it. As Augustine testifies, in Him the predestination of grace most clearly shines, so His merit opposes not God’s grace but is subordinate to it, depending thereon. But both God’s grace and Christ’s merit oppose our works, each in its order. Thus, grace, from which merit flows, and merit, whereby we are saved, stand together. This is proved by texts conjoining God’s love, Christ’s propitiation, reconciliation, redemption, and ransom, and by the same and like texts proving that Christ by His obedience truly merited salvation for us. For if He fully satisfied for our sins, paid the penalties due, appeased God’s wrath, and acquired eternal life, He rightly merited salvation for us. Merit here we call the most sufficient price to satisfy God’s judgment for sins and penalties and to acquire eternal life. In sum, respecting God, all is free; respecting God’s appeased wrath through the Son, there is merit, yet freely given to you. Concerning the second, that Christ’s justice consists in full satisfaction for our sins and complete fulfillment of the Law: Christ’s most full and perfect obedience or justice, whereby we are justified when imputed, includes both complete satisfaction for all sins and fulfillment of all the Law requires of us. For He was made under the Law for us, which demands two things: that we commit nothing against it, and omit nothing of it. Otherwise, it thunders woe against both him that does not what he ought and him that does what he ought not. But Christ is the fulfilling of the Law unto salvation for all that believe (Rom. 10). The righteousness of the Law is fulfilled in us, not by us, but in our Head, Christ, for us. Thus, chiefly, Christ by His obedience satisfied for our sins, bearing most sufficient penalties, whence Scripture greatly commends the benefit of Christ’s death, for by it we are redeemed from death. But He also perfectly fulfilled the Law for us, not only by suffering but by doing—yea, in suffering He acts, for He offers Himself as priest and is offered as victim (Rom. 4). Not only are sins not imputed, being remitted, but Christ’s justice is imputed, He who was made justice for us (1 Cor. 1:30). Yet to understand this rightly, note that Christ’s justice is threefold: First, essential, common to the three Persons, which is God Himself, for whatsoever is in God is God; Second, habitual justice, adorning His human nature from conception with purity far beyond angelic, yet created; Third, actual justice, whereby throughout His life, especially in suffering that death, He rendered obedience to the Father. This third alone enters the account of the merit of our justification, whereby we are not only redeemed from death but obtain eternal life through this perfect obedience perfectly rendered to the Law by Christ for us. … The matter of justification, as the term is variously taken, is considered by theologians not in one way, but it reduces to this: the matter is either the subject in which and from which this benefit arises, namely, Christ’s imputed justice, as taught above, which imputation includes both absolution from injustice through remission of sins (by which term Scripture often synecdochically comprehends the whole benefit of salvation) and the adjudication of Christ’s justice (Dan. 9, Rom. 4, 8, mentioning not only remission but the gift of justice); or the subject receiving this benefit, which is all and only the elect (Rom. 8, proved first a priori, because they are elect, then a posteriori, because they are justified). The form of justification is this application of Christ’s justice through faith, or that free imputation whereof we spoke (Rom. 4, Phil. 3, 2 Cor. 5), where the phrase ‘in Him’ notes two things: first, our justice is not inherent in us but Christ’s, existing outside us, yet ours by right of donation; second, we have Christ’s justice as Christ has our sin—not subjectively but relatively, by imputation, as shall be said in explicating the effects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-lucas-trelcatius.html">Lucas Trelcatius Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commonplaces of Holy Theology, “Of Justification”, “Part Constructive”</cite>, p. 137 in Trelcatius Sr. &amp; Jr., Opuscula Theologica Omnia (d. 1602; Leiden: Orlers &amp; Maire, 1614), trans. AI at Confessionally Reformed Theology. Trelctius Sr. (1542–1602) was a reformed theologian and professer at Leiden, Netherlands.</span></figcaption>

<blockquote><p>1. We begin with the most ancient father, Justin [Martyr]. He, in the book inscribed… an Exposition of the Faith, has these words: ‘The Son of God, as man, passed a life removed from all crime, and underwent a voluntary death; [Greek] that is, obliterating sin by a perfect and sinless conversation [conduct], and abolishing our debt by a debt that he owed not. Justin Martyr here plainly teaches, not only that the death and satisfaction of Christ are imputed to us for the blotting out of our punishment, but that his conversation itself, or active obedience, is imputed to us, for the obliteration of our sin.

2. Irenaeus, Against Heresies, bk. 5… in ch. 18: ‘The Lord has restored us to friendship by his incarnation, being made the Mediator between God and man; both propitiating the Father for us, against whom we had sinned, and making amends for our disobedience; bestowing moreover upon us that conversation [conduct] and obedience which is due to our Maker.’ …What else is this than the obedience of Christ both active and passive, made ours by imputation and bestowal?</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. We begin with the most ancient father, Justin [Martyr]. He, in the book inscribed… an Exposition of the Faith, has these words: ‘The Son of God, as man, passed a life removed from all crime, and underwent a voluntary death; [Greek] that is, obliterating sin by a perfect and sinless conversation [conduct], and abolishing our debt by a debt that he owed not. Justin Martyr here plainly teaches, not only that the death and satisfaction of Christ are imputed to us for the blotting out of our punishment, but that his conversation itself, or active obedience, is imputed to us, for the obliteration of our sin.

2. Irenaeus, Against Heresies, bk. 5… in ch. 18: ‘The Lord has restored us to friendship by his incarnation, being made the Mediator between God and man; both propitiating the Father for us, against whom we had sinned, and making amends for our disobedience; bestowing moreover upon us that conversation [conduct] and obedience which is due to our Maker.’ …What else is this than the obedience of Christ both active and passive, made ours by imputation and bestowal?”

— John Davenant, A Treatise on Justification: or The Disputatio de justitia habituali et actuali, …, vol. 1 trans. Josiah Allport (d. 1641; London: Hamilton, 1844/1846), ch. 29, p. 254">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+We+begin+with+the+most+ancient+father%2C+Justin+%5BMartyr%5D.+He%2C+in+the+book+inscribed%E2%80%A6+an+Exposition+of+the+Faith%2C+has+these+words%3A+%E2%80%98The+Son+of+God%2C+as+man%2C+passed+a+life+removed+from+all+crime%2C+and+underwent+a+voluntary+death%3B+%5BGreek%5D+that+is%2C+obliterating+sin+by+a+perfect+and+sinless+conversation+%5Bconduct%5D%2C+and+abolishing+our+debt+by+a+debt+that+he+owed+not.+Justin+Martyr+here+plainly+teaches%2C+not+only+that+the+death+and+satisfaction+of+Christ+are+imputed+to+us+for+the+blotting+out+of+our+punishment%2C+but+that+his+conversation+itself%2C+or+active+obedience%2C+is+imputed+to+us%2C+for+the+obliteration+of+our+sin.+2.+Irenaeus%2C+Against+Heresies%2C+bk.+5%E2%80%A6+in+ch.+18%3A+%E2%80%98The+Lord+has+restored+us+to+friendship+by+his+incarnation%2C+being+made+the+Mediator+between+God+and+man%3B+both+propitiating+the+Father+for+us%2C+against+whom+we+had+sinned%2C+and+making+amends+for+our+disobedience%3B+bestowing+moreover+upon+us+that+conversation+%5Bconduct%5D+and+obedience+which+is+due+to+our+Maker.%E2%80%99+%E2%80%A6What+else+is+this+than+the+obedience+of+Christ+both+active+and+passive%2C+made+ours+by+imputation+and+bestowal%3F%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+A+Treatise+on+Justification%3A+or+The+Disputatio+de+justitia+habituali+et+actuali%2C+%E2%80%A6%2C+vol.+1+trans.+Josiah+Allport+%28d.+1641%3B+London%3A+Hamilton%2C+1844%2F1846%29%2C+ch.+29%2C+p.+254&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa906397c9a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a906397c9a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=1.%20We%20begin%20with%20the%20most,made%20ours%20by%20imputation%20and%20bestowal&amp;text=1.%20We%20begin%20with%20the%20most%20ancient%20father&amp;text=and%20passive%2C%20made%20ours%20by%20imputation%20and%20bestowal" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f8a786cf96" data-kw="">
<blockquote><p>It is a question, the threatening standing, Gen. 2:17, how the active righteousness of Christ can be a cause meriting to us life and satisfying the Law when there is no suffering for the breach of the Law, which expressly required death in the sinner: Not to say that it seems too near to make Christ’s dying needless if his active holiness do the business; Nay we cannot so teach.</p></blockquote>

</figure><figure class="quote" id="q-a56619ff23" data-kw="">
<blockquote><p>For 2. I add, it is by the satisfaction of Christ the Redeemer, wherein are contained both the matter and form of the justification of a sinner. The matter is Christ’s satisfaction, his obedience in his life, in his death; in fulfilling the law, and in suffering for our not fulfilling it; and the merit of all manifested in his resurrection and glorious ascension. The form is the imputing of that obedience whereby the righteousness of Christ does now become the believer’s as truly and really by imputation as it was Christ’s own in action.</p></blockquote>

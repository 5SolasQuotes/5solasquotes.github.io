<main class="wrap"><figure class="quote" id="q-80a32aa2ee" data-kw="">
<blockquote><p>They ought not to have despaired, for whom the Lord, hanging on the cross, deigned to pray. He saw some of His own among many strangers. He was already asking forgiveness for those from whom He was still receiving injury. For He did not attend to the fact that He was dying at their hands, but that He was dying for them.’ All of which seems to be referred to some of His own, not to the many strangers. 17. Nevertheless, I judge, according to the mind of St. Augustine it is to be carried to each man of the whole collection in which Christ the Lord saw some of his own among many strangers, so that the salvation of certain ones was especially and efficaciously intended, and this was the principal motive on account of which the prayer and redemption were extended to the whole collection, in which many strangers were mixed in. For thus are received universally and without restriction those sentences: ‘He was already asking forgiveness for those from whom He was still receiving injury. For He did not attend to the fact that He was dying at their hands, but that He was dying for them.’ [Ruiz continues to section 26 with further, similar quotes from Augustine and the fathers on the subject.]</p></blockquote>

</figure><figure class="quote" id="q-3b72859a83" data-kw="">
<blockquote><p>The second conclusion pretended to be drawn from this [Rev. 2:21] is that the Lord has a universal will to have all men saved, seeing He gives her time to repent. This we say does not follow hence: For: … 4. It will not follow Christ wills persons to repent; therefore He wills their salvation: because He may be said to will them to repent when He requires it of them as their duty: and thus their duty of repenting is the immediate object of his revealed and preceptive will: but a person’s salvation is the proper object of his will of good-pleasure, or of his decreeing and purposing will. And no otherways can He be said to will such persons’ salvation (because He commands them to repent) than this, to wit, that in His Word He has signified repentance to be such a person’s duty, and that He has appointed a connection between repentance and salvation; which still relates to his revealed will: even as when God made the first Covenant with Adam, it might be said that He willed Adam to be holy, and that by that Covenant He had made a connection between holiness and life; yet it is not proper to say that the Lord willed life to Adam upon that condition, because that looks to the event and respects the Lord’s will of purpose: which cannot but be effectual. And if the Lord’s willing of men (at least such as are under his ordinances) to be saved be thus understood as including only the duty which God lays upon men and the connection that He has made between it and salvation in his Word, it may be admitted: but if it be extended to any antecedent will in God Himself, distinct from that which is called His revealed will, this place and such like will give no ground for such an assertion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, (Edinburgh: Higgins, 1658), ch. 2, Lecture 6, on vv. 18-29, pp. 169-70</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-06dacfd041" data-kw="">
<blockquote><p>And so in all the commandments of God, we must understand the will of God to be either (Zanchi, Of the Nature of God, ch. 3): 1. Declarans [declaring] 2. Efficiens [effecting] The first is that which shows what should be done, and so the Law is called doctrina, a rule which shows us what pleases or displeases God. The second is that which causes us to do what is pleasing to Him, and so the Law is called mandatum [a commandment], when He makes the elect to walk in his paths (Eze. 11:20), or works faith in their hearts to believe in Christ. The 1. may be broken by the wicked. The 2. cannot: ‘For my counsel shall stand, and my will shall be done, says the Lord.’ (Isa. 46) But then it may be objected that the wicked sin not, because they do not break or do any thing against the absolute and proper will of God. I answer: That sin is not defined to be the transgressing of the secret will of God which cannot be broken, but of his declared and revealed will (Zanchi, bk. 3, ch. 4, Of the Nature of God), which only shows what is pleasing or displeasing to Him. Hereby then you see the will of God is only one, immutable and unchangeable, and that although He gives his Law unto all, yea, both legem operandi and lege credendi [the law to be worked and the law to be believed], to show what should be done and what should be believed; yet it is not his absolute will that all men should either do or believe the same, that they might be saved. For if it were, who could resist it? (Rom. 9:19)</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“And so in all the commandments of God, we must understand the will of God to be either (Zanchi, Of the Nature of God, ch. 3): 1. Declarans [declaring] 2. Efficiens [effecting] The first is that which shows what should be done, and so the Law is called doctrina, a rule which shows us what pleases or displeases God. The second is that which causes us to do what is pleasing to Him, and so the Law is called mandatum [a commandment], when He makes the elect to walk in his paths (Eze. 11:20), or works faith in their hearts to believe in Christ. The 1. may be broken by the wicked. The 2. cannot: ‘For my counsel shall stand, and my will shall be done, says the Lord.’ (Isa. 46) But then it may be objected that the wicked sin not, because they do not break or do any thing against the absolute and proper will of God. I answer: That sin is not defined to be the transgressing of the secret will of God which cannot be broken, but of his declared and revealed will (Zanchi, bk. 3, ch. 4, Of the Nature of God), which only shows what is pleasing or displeasing to Him. Hereby then you see the will of God is only one, immutable and unchangeable, and that although He gives his Law unto all, yea, both legem operandi and lege credendi [the law to be worked and the law to be believed], to show what should be done and what should be believed; yet it is not his absolute will that all men should either do or believe the same, that they might be saved. For if it were, who could resist it? (Rom. 9:19)”

— William Griffith, The Delights of the Saints… (London: Butter, 1622), pt. 1, pp. 15-16 Gryffith (c.1589–1672) was an Anglican bishop, opposed to the puritans.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+so+in+all+the+commandments+of+God%2C+we+must+understand+the+will+of+God+to+be+either+%28Zanchi%2C+Of+the+Nature+of+God%2C+ch.+3%29%3A+1.+Declarans+%5Bdeclaring%5D+2.+Efficiens+%5Beffecting%5D+The+first+is+that+which+shows+what+should+be+done%2C+and+so+the+Law+is+called+doctrina%2C+a+rule+which+shows+us+what+pleases+or+displeases+God.+The+second+is+that+which+causes+us+to+do+what+is+pleasing+to+Him%2C+and+so+the+Law+is+called+mandatum+%5Ba+commandment%5D%2C+when+He+makes+the+elect+to+walk+in+his+paths+%28Eze.+11%3A20%29%2C+or+works+faith+in+their+hearts+to+believe+in+Christ.+The+1.+may+be+broken+by+the+wicked.+The+2.+cannot%3A+%E2%80%98For+my+counsel+shall+stand%2C+and+my+will+shall+be+done%2C+says+the+Lord.%E2%80%99+%28Isa.+46%29+But+then+it+may+be+objected+that+the+wicked+sin+not%2C+because+they+do+not+break+or+do+any+thing+against+the+absolute+and+proper+will+of+God.+I+answer%3A+That+sin+is+not+defined+to+be+the+transgressing+of+the+secret+will+of+God+which+cannot+be+broken%2C+but+of+his+declared+and+revealed+will+%28Zanchi%2C+bk.+3%2C+ch.+4%2C+Of+the+Nature+of+God%29%2C+which+only+shows+what+is+pleasing+or+displeasing+to+Him.+Hereby+then+you+see+the+will+of+God+is+only+one%2C+immutable+and+unchangeable%2C+and+that+although+He+gives+his+Law+unto+all%2C+yea%2C+both+legem+operandi+and+lege+credendi+%5Bthe+law+to+be+worked+and+the+law+to+be+believed%5D%2C+to+show+what+should+be+done+and+what+should+be+believed%3B+yet+it+is+not+his+absolute+will+that+all+men+should+either+do+or+believe+the+same%2C+that+they+might+be+saved.+For+if+it+were%2C+who+could+resist+it%3F+%28Rom.+9%3A19%29%E2%80%9D%0A%0A%E2%80%94+William+Griffith%2C+The+Delights+of+the+Saints%E2%80%A6+%28London%3A+Butter%2C+1622%29%2C+pt.+1%2C+pp.+15-16+Gryffith+%28c.1589%

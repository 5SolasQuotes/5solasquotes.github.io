<main class="wrap"><figure class="quote" id="q-80facc6494" data-kw="">
<blockquote><p>The Covenanters saw that the only cure for Ireland’s ills was the Word of God, and that the darkness of Romanism and all the crime and misery attendant thereon could be banished only by the light of God’s truth. And so they bound themselves that they would “sincerely, really, and constantly, through the grace of God, endeavour the reformation of religion in the Kingdom of Ireland in doctrine, worship, discipline, and government, according to the Word of God and the example of the best reformed Churches.” Does not this show that they were prepared for missionary work, and that the fulfilment of the Covenants would have meant the giving of the Bible to Ireland, as Rome has ever been refusing to give it, and not to Ireland alone but to the heathen nations of the world?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ramsey.html">John Ramsey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The British covenants suited to present-day needs</cite>, (Belfast, 1897), p. 17.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><figure class="quote" id="q-89397af287" data-kw="">
<blockquote><p>Whatever have been the effects and fruit of meetings of persons of diverse families in times of corruption or trouble (in which cases many things are commendable which otherwise are not tolerable) yet, when God has blessed us with peace and purity of the Gospel, such meetings of persons of diverse families (except in cases mentioned in these Directions)¹ are to be disapproved, as tending to the hindrance of the religious exercise of each family by itself, to the prejudice of the public ministry, to the renting of the families of particular congregations, and (in process of time) of the whole Kirk, besides many offenses which might come thereby, to the hardening ofthe hearts of carnal men, and grief of the godly.</p></blockquote>

<blockquote><p>A minority within the Societies, such as Hamilton and Earlstoun, would continue to reject William’s kingship, but the majority, including their ministerial leadership, either tacitly or openly accepted it. That split proved to be fundamental and led to the great schism in the Societies in 1690, when Hamilton and a minority of the Societies refused to accept the Revolution settlement of Church and State, and, ultimately, publicly rejected William’s authority in the Sanquhar Declaration of 1692. (Walker, BP, I, 126; Shields, FCD, 411-2, 418-9.)… The Societies also took steps to secure the Revolution by offering military support…</p></blockquote>

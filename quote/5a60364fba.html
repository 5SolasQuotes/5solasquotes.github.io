<blockquote><p>The modern Jew acknowledges the true God of his fathers Abraham, Isaac and Jacob, but owns not Jesus the son of Mary for the true Christ… The deluded Mahometan confesses one God, the Creator of heaven and earth; yea conceives so well of the Lord Jesus, as not to suffer any Jew to take up the profession of a Musulman, till he have first renounced his enmity against Christ.</p></blockquote>

<blockquote><p>§17. Now to the Political Means. I. Nothing is accomplished, indeed, things are done badly, by persecuting, harassing or oppressing the Jews, driving them away, or killing them. … Therefore, the better and more common opinion, both among theologians and among jurists, is that the Jews should be tolerated—not indeed enticed, but, where they are found, not treated more harshly. Thus: • Baldus, vol. 1, Consil, 315-16 • Rolandus a Valle, vol. 3, Consil, 25 • Alexander of Hales, Summa, pt. 2, Questions 179-80 • Vincent of Beauvais, Spec. Doctr., bk. 10, ch. 38, etc. • Johannes Gerhard, Common Places, On the Magistrate, p. 631 • Hottinger, Thesaurus Philologicus, bk. 1, ch. 1, section 2, question 1 And the one who treated this matter learnedly and extensively in a separate book, Georgius Theodorus, Counselor of Hesse, De jure et statu Iudæorum in Republica Christianorum [On the Law and Status of the Jews in the Republics of Christians].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>T’shuvah Yehudah, or For the Convincing &amp; Converting of the Jews</cite>, (Leiden, 1655), pp. 24-25 tr. AI Latin</span></figcaption>

d it online · Reformed Books Online</a></div>

<blockquote><p>And upon these [previously listed] terms I (and I believe everybody else) will willingly consent to their readmission [under a limited-political toleration]. If any desire further satisfaction in this particular, either from civilians, schoolmen, casuists, canonists, historians, or other divines, he may consult these or such like: I. Justinian Cod. de Judaeis &amp; Caelicolis, bk. 1, title 12 and the gloss there. II. Codex Theodosianus de Judaeis, Caelicolis &amp; Samaritanis, bk. 16, title 8, p. 515. III. Jacobi Sirmondi, Appendix Cod. Theodosiani, leg. 6. p. 14 &amp; leg. 4, p. 11. IV. Marquardus de Susanis Tractatu de Judaeis, &amp; aliis Infidelibus inter tractatus Illustrium, tome 14, p. 28. See Bernardum, Hieronimum, Alexandrum Iltum, aliosque Auctores ab eo ibidem citatos. V. Mathaeus Wesenbecius in Comentario in Codicem Justinianeum de Judeis, title 9, p. 14. VI. Decretum Gregorii extra de Judaeis, &amp; Saracenis, bk. 6, title 6. VII. Clementinar. bk. 5, title 2, de Judaeis. VIII. Corvini Jus Canonicum, tit. de Judaeis, p. 295. IX. Frederick Balduin, Cases of Conscience, bk. 2, ch. 6, case 5, p. 188. X. Capitulare Caroli Magni, bk. 6, ch. 120 &amp; 308. XI. Henry Alting, Problematum Theolog. pt. 2, problem 21, p. 340. XII. Petrus Crespetius in summa Eccles. Disciplinae Verbo Judaeus, p. 520 etc. fuse. XIII. Philip Melanchthon, Epistles, bk. 1, epistle 68, p. 75 in edit. Corn. Bee. XIV. Martin Becanus, in compendio manualis, bk. 5, ch. 17, p. 509. XV. Decretum Concilii Viennensis contra Judaeos apud Hen. Canisium Lect. Antiquarum, tome 1, p. 621 &amp; apud Binium, tome 3, parte altera, p. 1,493. XVI. Filiucius, Cases of Conscience, tract 22, ch. 5, p. 40, col. 2, de Judaismo. XVII. Johannes de Lugo, Of the Power of Divine Faith, disp. 22, sect. 4 and authors cited there. XVIII. Bodinus, Of the Republic, bk. 3-4. XIX. Statutum de Judaismo apud D. Edvardum Cooke, Institit. pt. 2, p. 506 &amp; Commentarium ejus in dictum Statutum. XX. Aquinas, [Summa] pt. 2 of 2, quest. 10-11 where various things on the Jews occur. XXI. Erasmus Brockmannus, Systemate Theologiae, universae, art. 41, ch. 2, quest. 9, tome 2, p. 5,043. XXII. Basilica Lenuclavii, bk. 1, title 1, ch. 9, de Judaeis, p. 2. XXIII. Jerome of the Holy Faith, Book contra the Jews. XXIV. Petrus Galatinus, de Arcanis Catholicae veritatis. XXV. Gilbertus Genebrardus, in Symbolae fidei Judeorum è R. Mos. Aegyptio, etc. XXVI. Vide etiam (si placet) Scriptores (innumeros pene) quos exhibet Georgius Draudius in Bibliothea Classica inter Libros Theologicos, pp. 349-50, etc. Alii alios de facili addant.</p></blockquote>

<blockquote><p>On the other hand [in contrast to Christianity], those who introduced the errors of the sects proceeded in contrary fashion, as is clear from Mohammed, who enticed peoples with the promise of carnal pleasures, to the desire of which the concupiscence of the flesh instigates. He also delivered commandments in keeping with his promises, by giving the reins to carnal pleasure, in which it is easy for carnal men to obey. Also, the lessons of truth which he inculcated were only such as can be easily known to any man of average wisdom by his natural powers—in fact, he mingled the truths which he taught with many fables and most false doctrines. Nor did he add any signs of supernatural agency, which alone are a fitting witness to divine inspiration, since a visible work that can only be from God proves the teacher of truth to be invisibly inspired, but he asserted that he was sent in the power of arms, which sign is not lacking even to robbers and tyrants. Again, those who believed in him from the outset were not wise men practiced in things divine and human, but bestial men who dwelt in the deserts, utterly ignorant of all divine teaching, and it was by a multitude of such men and the force of arms that he compelled others to submit to his law. Lastly, no divine oracles of prophets in a previous age bore witness to him; rather, he corrupted almost all the teaching of the Old and New Testaments by a narrative replete with fables, as one may see by a perusal of his law. Hence, by a cunning device, he did not commit the reading of the Old and New Testament books to his followers, lest he should thereby be convicted of falsehood. Thus it is evident that those who believe his words believe lightly.</p></blockquote>

— Thomas Aquinas, Summa Contra Gentiles, bk. 1, ch. 6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COn+the+other+hand+%5Bin+contrast+to+Christianity%5D%2C+those+who+introduced+the+errors+of+the+sects+proceeded+in+contrary+fashion%2C+as+is+clear+from+Mohammed%2C+who+enticed+peoples+with+the+promise+of+carnal+pleasures%2C+to+the+desire+of+which+the+concupiscence+of+the+flesh+instigates.+He+also+delivered+commandments+in+keeping+with+his+promises%2C+by+giving+the+reins+to+carnal+pleasure%2C+in+which+it+is+easy+for+carnal+men+to+obey.+Also%2C+the+lessons+of+truth+which+he+inculcated+were+only+such+as+can+be+easily+known+to+any+man+of+average+wisdom+by+his+natural+powers%E2%80%94in+fact%2C+he+mingled+the+truths+which+he+taught+with+many+fables+and+most+false+doctrines.+Nor+did+he+add+any+signs+of+supernatural+agency%2C+which+alone+are+a+fitting+witness+to+divine+inspiration%2C+since+a+visible+work+that+can+only+be+from+God+proves+the+teacher+of+truth+to+be+invisibly+inspired%2C+but+he+asserted+that+he+was+sent+in+the+power+of+arms%2C+which+sign+is+not+lacking+even+to+robbers+and+tyrants.+Again%2C+those+who+believed+in+him+from+the+outset+were+not+wise+men+practiced+in+things+divine+and+human%2C+but+bestial+men+who+dwelt+in+the+deserts%2C+utterly+ignorant+of+all+divine+teaching%2C+and+it+was+by+a+multitude+of+such+men+and+the+force+of+arms+that+he+compelled+others+to+submit+to+his+law.+Lastly%2C+no+divine+oracles+of+prophets+in+a+previous+age+bore+witness+to+him%3B+rather%2C+he+corrupted+almost+all+the+teaching+of+the+Old+and+New+Testaments+by+a+narrative+replete+with+fables%2C+as+one+may+see+by+a+perusal+of+his+law.+Hence%2C+by+a+cunning+device%2C+he+did+not+commit+the+reading+of+the+Old+and+New+Testament+books+to+his+followers%2C+lest+he+should+thereby+be+convicted+of+falsehood.+Thus+it+is+evident+that+those+who+believe+his+words+believe+lightly.%E2%80%9D%0A%0A%E2%80%94+Thomas+Aquinas%2C+Summa+Contra+Gentiles%2C+bk.+1%2C+ch.+6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc4a236c97d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c4a236c97d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-islam/#:~:text=On%20the%20other%20hand%20%5Bin%20contrast,who%20believe%20his%20words%20believe%20lightly&amp;text=On%20the%20other%20hand%20%5Bin%20contrast%20to%20Christianity&amp;text=that%20those%20who%20believe%20his%20words%20believe%20lightly" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>When we look into the doctrine of Mahomet, we find therein many truths, which he had taken from Jews and Christians, which greatly advance his religion above that of the pagans. He admitted only of one God, and asserted that his essence was simple and infinite… Thus far his doctrine is good: these are truths which that impostor drew from the books of the Old and New Testament.</p></blockquote>

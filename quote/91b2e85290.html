<main class="wrap"><figure class="quote" id="q-91b2e85290" data-kw="">
<blockquote><p>If you would be silent under your greatest afflictions, your sharpest trials, then make this consideration your daily companion, viz., That all the afflictions that come upon you, come upon you by and through that covenant of grace that God hath made with you. In the covenant of grace, God hath engaged himself to keep you from the evils, snares, and temptations of the world; in the covenant of grace, God hath engaged himself to purge away your sins, to brighten and increase your graces, to crucify your hearts to the world, and to prepare you and preserve you to his heavenly kingdom; and by afflictions he effects all this, and that according to his covenant too: Ps. lxxxix. 30-34, ‘If his children forsake my law, and walk not in my commandments; if they break my statutes, and keep not my commandments.’ In these words you have a supposition that the saints may both fall into sins of commission and sins of omission; in the following words you have God’s gracious promise: ‘Then will I visit their transgressions with the rod, and their iniquities with stripes.’

God engages himself by promise and covenant, not only to chide and check, but also to correct his people for their sins: ‘Nevertheless, my loving-kindness will I not utterly take from him, nor suffer my faithfulness to fail.’ Afflictions are fruits of God’s faithfulness, to which the covenant binds him. God would be unfaithful, if first or last, more or less, he did not afflict his people. Afflictions are part of that gracious covenant which God hath made with his people; afflictions are mercies, yea, covenant mercies, Ps. cxix. 75. Hence it is that God is called the terrible God, keeping covenant and mercy, Neh. i. 5; because, by his covenant of mercy, he is bound to afflict and chastise his people.

God by covenant is bound to preserve his people, and not to suffer them to perish; and happy are they that are preserved, whether in salt and vinegar, or in wine and sugar. All the afflictions that come upon a wicked man come upon him by virtue of a covenant of works, and so are cursed unto him; but all the afflictions that come upon a gracious man, they come upon him by virtue of a covenant of grace, and so they are blessed unto him; and therefore he hath eminent cause to hold his peace, to lay his hand upon his mouth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mute Christian under the Smarting Rod</cite>, (1684) in The Works of Thomas Brooks, ed. Alexander B. Grosart (6 vols, Edinburgh: Banner of Truth, 1980), i, 395.</span></figcaption>

<blockquote><p>1. As love stands opposed to hatred and wrath, and enmity. Considering man as God’s creature, he was not hated of God; God hates not the work of his own hand; but considering him as a lapsed creature, as degenerated into the plant of a strange vine, after that God had created him a generous, noble plant… How suitable to us now is it to have a Savior? That is love, and who has loves, considering the aversion in the holy Divine Being from mankind as rebellious seed, a seed of evil-doers? Who could have suited us to have become a Savior unto us, but one who had a kind propension and inclination to us, inclining Him to the great work of man’s redemption and reconciliation to God, especially also considering that there could be no remission of sins without blood…</p></blockquote>

</figure><figure class="quote" id="q-dcf053489c" data-kw="">
<blockquote><p>But seeing the Law cannot contradict the Gospel, and speaketh nothing of a Surety and Mediator, and so is negatively diverse from the Gospel, yet positively it is not contrary, nor denyeth that there ought to be a Mediator (for so should there be two contrary wills in God, and so it had been injustice, and against a just law, that God should send his Son to die for sinners.)

It is the same very obedience commanded in the Law, as a strict covenant of works, to be done by strength from our own nature, and for the authority of the Law-giver, and the love of God, and now enjoined in a mild covenant of grace, from the strength of the grace of Christ, and now not only acteth on us by Legal motives, the love of God, the authority of the Law-giver, (which the Gospel excludeth not) but upon the love of a free Redeemer and Ransom-payer: as it may be the same debt, which a man payeth of his own proper goods, and of the money borrowed from a rich friend.

1 Perfect obedience, which the Law requireth, and imperfect obedience which the Gospel accepteth (for it requireth perfection as well as the Law doth) are but gradually differences; as the same sum of gold, though clipped, if accepted by the creditor as full payment, the rest which is wanting being pardoned, may in grace and value, bee as good as the full payment. It is the Law that commandeth the love of God, under pain of eternal death, for the least fail, and by way of a covenant of works. Now the tenure of a covenant of works is an accident of the Law.

2 A new obligation of obedience varieth not the nature of it; as it is the same moral obedience that God commanded to the heathen, and the Jews, but that it was written and preached to Jews, addeth more guiltiness, when they disobey, and these same duties that Moses commanded of righteousness, holiness, and sobriety, Exod. 20. doth the grace of the Gospel enjoin. Tit. 3.11. and the Apostles command as acts of sanctification; and though Moses should not command them by the motives of the grace of Redemption (which yet is false, except when he presseth the Law as a covenant of works) yet Gospel-motives vary not the nature of duties: as a Master may command the same duties to his son and his servant, upon different grounds.

3 The Gospel abateth nothing of the height of perfection, in commanding what ever the law commandeth in the same perfection; for tis as holy, pure, and spiritual in commanding, we be perfect as our heavenly Father, and holy, as he is holy, as the Law is. In acceptation of grace, the Gospel accepteth less then the law, but commandeth no less, therefore the Gospel granteth pardons, but no dispensations; the Law though it deny not pardons, nor forbid them positively, yet it granteth neither.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 2.7, pp 7-8.</span></figcaption>

<blockquote><p>2. Under the new covenant or testament, however, these promised blessings are not given to all men, because God is true, thus the covenant is necessarily discriminate. These blessings are, however, given doubly when the covenant is received. In the first place, by the substance itself of the covenant, or by the promised blessings from God themselves, then by their administration in the visible assembly. In the first meaning learned from Jeremiah in the place already cited and which substance is peculiar to the elect. For to all the elect and to them alone, this part, the remission of sins, renewal to the image of God, and the knowledge of God itself is therefor promised, or which embraces God’s favor which they would never have had from themselves (John 6:44,45; 64,65; 10:26; 11:52; Acts 13:47,48; Romans 8:29,30; 9:7,8,9,11,15,16; Titus 1:1). Thus Moses spoke about substance of the covenant (Deuteronomy 30[:6]). “God will circumcise your heart and that of your children.” He acts truly in the administration of the covenant, (Genesis 17), ‘This is my covenant’ etc. Likewise he says, ‘My covenant will be in your flesh.’ Certainly, the very substance of the covenant was not in their flesh. And not all of their hearts were circumcised, to whom the covenant was administered or offered through circumcision (Acts 7:51,52,53). That is to say, they personally, maliciously, rejected the gracious offer of the covenant, as Stephen teaches in the same place. Therefore, the covenant of grace, if you see its essence, is a sworn oath promised by God, a gift to you by God who is never angry with you (Isaiah 54) and by our adoption in God’s Son we have been made heirs of eternal life with Jesus Christ the eternal and only begotten Son of God, the seed of Abraham who is Christ, and to all men, who by faith in this free gift which was brought by the seed, and in whom by grace they were justified and glorified short of any condition or stipulation, knowledge of the good, so that he might be celebrated in his gracious goodness from himself, in this life and life eternal (Hosea 2; Isaiah 54; Genesis 22; Hebrews chapters 1, 6; Galatians 3:15-18, 22,26,29). The administration of the covenant of grace, however, is through the testimony or call of the Royal word from the darkness (of which darkness he is convicted by the law partly natural and partly written) that is, from sin and the penalty of sin, to the light, which is unto the discerning and receiving of the Son of God offered in the gospel, with the double benefit, truly, free rightousness in the remission of sins, by cleansing in his blood, and renewal to the image of God or the spirit of holiness for sharing in the heavenly inheritance. By the outward voice and visible signs in the testimony of mutual agreement between God and us, and by the addition of the truly efficacious gift of grace of internal faith and repentance out the infinite, incomprehensible mercy to the elect, which mercy is not truly added indeed to the reprobate, but nevertheless justly and to the worship of God’s justice. For the call from the darkness to the light, that is, the gracious offer, is never rejected without evil and contumacy of the heart.</p></blockquote>

der-the-new-covenant-the-promised-blessings-not-given-to-all/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>The goodness of God, on the contrary, is the loveliness, benign character, sweetness, friendliness, kindness, and generosity of God. Goodness is the very essence of God’s being, even if there were no creature to whom this could be manifested. “The good LORD pardon every one” (2 Chr.30:18); “Good and upright is the LORD: therefore will He teach sinners in the way” (Psa. 25:B); “There is none good but one, that is, God” (Mat. 19:17). From this goodness issues forth lovingkindness and an inclination to bless His creatures. This is to the astonishment of all who take note of this, which explains why David exclaims twenty-six times in Ps. 136, “For His Mercy endureth for ever.” In the following texts we read likewise. “Also unto Thee, O Lord, belongeth mercy” (Psa. 62:12); “All the paths of the LORD are mercy” (Psa. 25:10). From goodness and benevolence issues forth the doing of that which is good. “Thou art good, and doest good” (Psa. 119:68); “Rejoice the soul of Thy servant: and attend unto the voice of my supplications. For Thou Lord, art good, and ready to forgive; and plenteous in mercy unto all them that call upon Thee” (Psa. 86:4, 6, 5). This goodness is of a general nature in reference to all God’s creatures, since they are His creatures. “The LORD is good to all: and His tender mercies are over all is works” (Psa. 145:9); “The earth is full of the goodness of the LORD” (Psa. 33:5); “For He maketh His sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust” (Mat. 5:45). The goodness which is of a special or particular nature as it relates to God’s children is thus expressed: ‘Truly God is good to Israel, even to such as arc of a clean heart” (Psa. 73:1); “The LORD is good unto them that wait for Him, to the soul that seeketh Him” (Lam. 3:25). This goodness of God is the reason why a believer, even after many backslidings, is motivated by renewal to return unto the Lord. “The children of Israel shall return… and shall fear the LORD and His goodness” (Hosea 3:5); “But I have trusted in Thy mercy” (Psa. 13:5). This is why they call the Lord “the God of my mercy” (Psa. 59:10, 17). In this goodness they rejoice and this goodness they magnify. “I will sing of the mercies of the LORD for ever” (Psa. 89:1); “Praise ye the LORD. O give thanks unto the LORD; for He is good: for His mercy endureth for ever” (Psa. 106:1).</p></blockquote>

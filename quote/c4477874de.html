<main class="wrap"><figure class="quote" id="q-c4477874de" data-kw="">
<blockquote><p>AS it was in the Blood of Lambs, that GOD made a Covenant with the People of Israel, so the Eucharist representing to us in the fifth Place, that the Blood of CHRIST is the Ground and Foundation of the New Covenant, which GOD has made with Christians, we cannot look upon the Sacrament as the Pledge and Seal of this Covenant, without being filled with an Excess of Joy and Consolation. For indeed, what greater Glory can be imagined, than for Man to be admitted to a Treaty with GOD? And what an inconceivable Advantage is this, that GOD should vouchsafe to enter into Covenant with us? There are none but are sensible of the Happiness of the Israelites, in this regard.

To be convinced of which, we need only hear them, even at this day, speaking with the greatest Comfort, of the Honour GOD therein has done them, notwithstanding their total dispersion, and groaning under the Burthen of that Curse, which pursues and overtakes them every where. Now, that ancient Covenant GOD has abolished, as being imperfect; but this which we commemorate, is to endure for ever.

The Design of the former was only to give the Jews a lively Sense of Sin, or at the best to administer a Typical Expiation; whereas the latter, viz. the New (according to the Prophet Jeremy) makes a true Atonement for Sin, and affords a Remission rightly and properly so called. That had no promises, but what concerned a Happiness here on Earth; whereas This does promise a Resurrection and Eternal Glory.

THE greatest Honour the Old Covenant did confer upon the Jews, was this, That the MESSIAS should be born of their Blood; but the Advantage of the New, is, That the MESSIAS partaking of Flesh and Blood with the rest of Mankind, has given his own Blood to raise them to the Glory of Adoption, who shall believe in Him. O how happy is the People, whose God is the Lord! And what does this Expression, to be the God of any one, import, but this, viz. To be his Great and Sovereign Benefactor? Of old He was the GOD of Abraham, but not of Loth, and his Posterity; Of Isaac, but not of Ismael and his Off-spring; Of Jacob, but not of Esau and the Edomites. Now, He is the GOD of all the Earth. But he has not made this Covenant with all the Nations of the World, save only by virtue and on the Sole Account of the Blood of CHRIST.

And can we with any attention, reflect on this Truth, represented to us in the Holy Eucharist, without feeling a Joy unspeakable and full of Glory? GOD had promised to enter into such a Covenant, as this; and Jeremy describes it in the 31. Chap. of his Prophecies; Yet the Old lasted till John the Baptist, and so long the Ceremonies of it were in use. But then comes CHRIST, and instead of continuing the Celebration of the Old Covenant, which was made in the Blood of the Paschal Lamb, He abrogates it, and in its room substitutes the New Covenant, made in his own Blood. Do this (says He) in remembrance of me. Not That which was done before, but This: For this Cup is the New Testament in my Blood, which is shed for the Remission of your Sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-allix.html">Pierre Allix</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A preparation for the Lord’s Supper</cite>, trans. Paul Lorrain (London: Brab. Aylmer, 1688), pp 39-42.</span></figcaption>

<blockquote><p>In the case of the Eucharist, you blame us for attempting to confine the Lord of the universe, and his divine and spiritual power, (which is perfectly free and infinite,) within the corners of a corporeal nature with its circumscribed boundaries. What end, pray, will there be to calumny? We have always distinctly testified, that not only the divine power of Christ, but his essence also, is diffused over all, and defined by no limits, and yet you hesitate not to upbraid us with confining it within the corners of corporeal nature! How so? Because we are unwilling with you to chain down his body to earthly elements. But had you any regard for sincerity, assuredly you are not ignorant how great a difference there is between the two things – between removing the local presence of Christ’s body from bread, and circumscribing his spiritual power within bodily limits.

Nor ought you to charge our doctrine with novelty, since it was always held by the Church an acknowledged point. But as this subject alone would extend to a volume, in order that both of us may escape so toilsome a discussion, the better course will be for you to read Augustine’s Epistle to Dardanus, where you will find how one and the same Christ more than fills heaven and earth with the vastness of his divinity, and yet is not everywhere diffused in respect of his humanity.

We loudly proclaim the communion of flesh and blood, which is exhibited to believers in the Supper; and we distinctly show that that flesh is truly meat, and that blood truly drink — that the soul, not contented with an imaginary conception, enjoys them in very truth. That presence of Christ, by which we are ingrafted in him, we by no means exclude from the Supper, nor shroud in darkness, though we hold that there must be no local limitation, that the glorious body of Christ must not be degraded to earthly elements; that there must be no fiction of transubstantiating the bread into Christ, and afterwards worshipping it as Christ. We explain the dignity and end of this solemn rite in the loftiest terms which we can employ, and then declare how great the advantages which we derive from it.

Almost all these things are neglected by you. For, overlooking the divine beneficence which is here bestowed upon us, overlooking the legitimate use of so great a benefit, (the topics on which it were becoming most especially to dwell,) you count it enough that the people gaze stupidly at the visible sign, without any understanding of the spiritual mystery. In condemning your gross dogma of transubstantiation, and declaring that stupid adoration which detains the minds of men among the elements, and permits them not to rise to Christ, to be perverse and impious, we have not acted without the concurrence of the ancient Church, under whose shadow you endeavour in vain to hide the very vile superstitions to which you are here addicted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Cardinal Sadolet’s Letter (1539) in Tracts and Letters relating to the Reformation, trans and ed. Henry Beveridge (7 vols, Edinburgh: Calvin Translation Society, 1844), 1: 45-46.</cite></span></figcaption>

<blockquote><p>We feed on the body and blood of Christ spiritually, and are refreshed thereby, as verily as our bodies are refreshed with the bread and wine. For God doth not feed us with empty symbols and representations, but with things themselves that the soul which comes prepared by faith is partaker of Christ crucified, and is knit to him, though now in heaven. There is as sure an union and communion between Christ and the Christian soul, as there is between the food and the body, when it is once digested.</p></blockquote>

</figure><figure class="quote" id="q-1a09d03e1c" data-kw="">
<blockquote><p>This fact of David [eating the showbread under natural and moral necessity] was not done by any extraordinary impulsion of the Spirit, but by a constant channel that providence ordinarily runs in, according to which I, or any professor [of Christianity] must be obliged to prefer a work of mercy to sacrifice, that is, by which we are to give obedience to the Sixth Command, which is not to kill; even as without extraordinary impulsion, I may absent myself from hearing the Word when I find going to Church may endanger my life, for non-obedience to affirmatives [affirmative commands] in a greater necessity is ordinary. And therefore Christian prudence, with which the Wisdom of God keeps house, Prov. 8:12, does determine many things of scandal: And prudence is a virtue commanded in the Word of God, for a wise man observes times, and so will he observe all other circumstances…</p></blockquote>

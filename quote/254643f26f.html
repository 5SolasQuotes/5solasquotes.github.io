<main class="wrap"><figure class="quote" id="q-254643f26f" data-kw="">
<blockquote><p>Here he setteth forth but the chief office and benefit of Christ, for which he became man, when he sayeth, By himself purged he our sins. This short saying containeth a sum of the whole doctrine of the Gospel concerning Christ’s benefits, concerning the difference between the Law and the Gospel, and concerning forgiveness of sins, or justification.

The Law purgeth not, ne taketh away sins, but increaseth sin, and maketh it out of measure sinful. Rom. 7. The sacrifices of the Levites purged not sin, but were figures of Christ’s sacrifice. Our own works and monkish ceremonies purge not sins. Only Christ by himself, (that is to say by the sacrifice of his body offered upon the altar of the cross,) hath purged us, and hath for evermore made perfect those that are to be sanctified, as is said afterward in the 7. 9. &amp; 10. chapters. And 1. John. 1. The blood of Christ the son of God cleanseth us from all sin, and justifieth us &amp; maketh us heirs of everlasting salvation and glory. For we shall be glorified with Christ who sitteth at the right hand of the Majesty, that is to say, reigneth in equal power and majesty with the eternal father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-chytraus.html">David Chyträus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A postil or orderly disposing of certain epistles usually red in the Church of God, upon the Sundays and holy days throughout the whole year,</cite>, trans. Arthur Golding (London: Lucas Harrison and George Bishop, 1570), pp 11-12.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-541b658406" data-kw="">
<blockquote><p>Paul includes all laws and related statements without distinction, though the papalists argue that the text is referring only to the ceremonial laws of Moses. This just shows how stupid they are. Paul here says that none of the law justifies us in any way, and he clearly contrasts the justification of the sinner by faith in Christ with the law. Paul was certainly well-educated enough to have been able to distinguish one kind of law from another had he wished to do so. The following rule is to be observed. When the text makes no distinction, a distinction must not be forced on it. Furthermore, Paul soon goes on to add that he had died through the law, and this must be understood to refer to the moral law.

In this verse the words “faith of Jesus Christ” do not mean the faith that he himself had but the faith that we have in him. Paul means that faith by which we recognize Christ as our redeemer and savior. Faith therefore is the tool by which we come to a knowledge of Christ and his blessings. It assures us that we have freely received the forgiveness of sins and eternal life on account of Christ. Faith does not mean just believing that Christ is the truth, but it also involves applying Christ and the promise of grace to ourselves, so that we may know that God is reconciled to us according to the promises of his grace and that we have eternal life because of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-wigand.html">Johann Wigand</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolam Sancti Pauli ad Gatatas Annotations</cite>, (Wittenberg: Johann Craton, 1580). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 73.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-e2f2c4ad9c" data-kw="">
<blockquote><p>1. Active justification differs from passive justification. In Latin, the nouns ending in –io are generally interpreted in this way [as active and passive]. God justifies and we are justified.

2. Passive justification is later than faith. Passive justification follows after passive faith, because it is through faith that we receive the remission of sins, Act 26:18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Discourse</cite>, (1644), ch. 13, ‘On Justification’, p. 231</span></figcaption>

</figure><figure class="quote" id="q-de53499081" data-kw="">
<blockquote><p>In this, however, there is nothing to prevent the Lord from embracing works as inferior causes. But how so? In this way: Those whom in mercy he has destined for the inheritance of eternal life, he, in his ordinary administration, introduces to the possession of it by means of good works. What precedes in the order of administration is called the cause of what follows. For this reason, he sometimes makes eternal life a consequent of works; not because it is to be ascribed to them, but because those whom he has elected he justifies, that he may at length glorify (Rom. 8:30).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.14.21</span></figcaption>

<main class="wrap"><figure class="quote" id="q-bdb46a00cd" data-kw="">
<blockquote><p>Strong efforts have been used by hell and earth in all ages, to put out the lamp of God’s Anointed, that his soul-captivating glory might not be seen by the sons of men. This is, and has been, the design of all the errors that were ever broached since the Christian church and the gospel-lamp was set up in the world.

The Arian heresy is designed to darken the glory of his supreme Deity. The Socinian error agrees with the Arians, and also overclouds, or rather obliterates, his satisfaction. The Arminian error darkens the freedom and efficacy of his grace, by exalting the freedom of man’s will in his depraved state. Papists and Legalists, of whatever denomination, they impugn and disparage his everlasting righteousness, by substituting something of their own legal workings, doings, or personal qualifications, in the room of it.

And now-a-days, the idol of self-love is substitute in the room of the glory of God, &amp;c. All these, and the like errors, are just like so many damps or mists cast out of hell, through the malice and subtlety of the old serpent, in order to darken and obscure the lamp of gospel-light, that men may not perceive the glory, fulness, and suitableness of Christ, and so believe in him, to the salvation of their souls.

However, through the over-ruling hand of God, these mists and clouds have only served in the issue to make the gospel-lamp, and the glory of God’s Anointed, to shine with the greater lustre; like the clouds in the air, which you observe have just now overcast the sun in the firmament, they obscure his light for a while, and yet serve only, in the event, as a foil to set off the glory of the sun, when he breaks through these clouds, and darts his beams down upon this earth among the children of men, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Lamp Ordained for God s Anointed. Being the Substance of Two Sermons. The First Preached at the Admission of the Rev. James Fisher, late Minister of the Gospel at Kinclaven, to be Minister of the Dissenting Associate Congregation in and about Glasgow, October 8, 1741; the other preached at Stirlin</cite></span></figcaption>

<blockquote><p>III. However, the received opinion among the orthodox is that the promise given to Adam was not only of a happy life to be continued in paradise, but of a heavenly and eternal life (to which he was to be carried after the course of perfect obedience and perseverance had been run and which God had prescribed to him as a trial of his faith). Hence it is evident that the question is not whether Adam had the privilege of immortality in his upright state (which we have proved before against Socinus). The question is not whether the promise was given to him of happiness and life perpetually to endure, if he had persisted integrity (which the learned men, with whom we here dispute, do not deny). Rather the question is whether that happiness and life were to be passed in heaven or only upon the earth and in paradise. The latter, they affirm; we the former.

IV. The reasons are: (1) The law of works had the promise of heavenly and eternal life; therefore also the law prescribed to Adam. In each instance, it is the same law as to substance. The former is evident from “who doeth these things, shall live by them” (Lev. 18:5); “if thou wilt enter into life” (namely, the heavenly) “keep the commandments” (Mt. 19:16, 17); and “the commandment was ordained to life” (Rom. 7:10) assuredly, not earthly, but heavenly. Since however, after the fall, the law can justify no one, this promise must necessarily have had place in upright Adam.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

<blockquote><p>Position 2. The Scripture and all the ordinances are but created things and not the ultimate object of our faith and highest and compleatest love: that is reserved to God in Jesus Christ; yea, the most perfect [mere human] we read of, Paul a chosen vessel, stood in need of comfort from Titus, 2 Cor 7:5-6, and the saints at Rome, Rom. 1:11-12… then the most perfect are not above the Law, the Gospel and Ordinances, as Familists say… But that we may understand this the better, we are to remember that:

1. There is a a twofold happiness of the saints, one formal and another objective.

2. That there is a mediate seeing of God, one by ordinances and means; another immediate.

3. That there is a twofold will of God; one that is revealed in Scripture, or the Law of Nature, and that is the moral good that God approves and enjoins to us, rather than the will of God; this the Familists call ‘the exterior or accidental will of God,’ because God’s will, as his essence, should have been entire and self-sufficient, though God had never revealed any such will to men or angels, yea though He had never made the world or men, or angel. ‘There is another will-essential in God, which is not the thing willed, but the essential faculty of desiring or willing in God.’ Now to come nearer the point, the formal blessedness of the saints is in the act of seeing, knowing, loving, enjoying God, which on our part are created things, and so empty nothings, and are not essentially the happiness of man, but means by the which we enjoy God our happiness, so the using of all the means and ordinances are not our happiness. It’s true, our Saviour says, It’s life eternal to know God and his Son Christ, Jn. 17. But He means it is the way and necessary means to happiness and life eternal. God in Christ, and in the in-comings and out-flowings of the Spirit of glory, or the blessed one God, in three persons, is the object and happiness of the saints, and therefore we are to prefer Christ Himself to all the kisses, visions, out-flowings of glory, and all our acts of seeing, loving, and enjoying of God; we may love ordinances, and prize highly, the vision of God, but God Himself, and Jesus Christ, we must not only prize, but be ravished, overcharged with Himself; as the Bridegroom is far more excellent than his bracelets, chains, rings. In this sense I would in my heart and esteem make away all ordinances, yea, all the honey-combs, all the apples, all the created roses that grow on Christ, all the sweet results and out-flowings of glory, yea, whole created heaven for Christ; Christ-God Himself; the bulk, the body, the stalk of the Tree of Life, is infinitely to be valued above an apple; yea all the created apples and sweet blossoms and soul-delighting flowers that grow on the tree. Now here on earth we are happy as ‘heirs,’ not as ‘lords and possessors, and in an union with the exterior, and revealed will of God,’ in believing, fearing, serving God, in Christ, in a practical union with God, but all this is but the way to the well, not the well itself, and the union with, or vision of God is mediate, far off, in a mirror, in the image, form, characters, elements, or looking-glass of Word, sacraments, ministry, ordinances, of hearing, praying, praising, but in heaven we see God face to face, that is without means, or the intervention of messengers, or ordinances. I cannot determine whether, when we shall know and see the Lord in an immediate vision of glory, our understanding shall receive created forms, intellectual species, images, characters of the lovely essence, the white, ruddy, pleasant, lovely countenance of that desirable Prince, the Lord Jesus; it’s a nicety not for our edification; sure Christ shall infuse and pour in into every vessel of glory so much of Himself, his presence, lovliness, image, beauty, as from bottom to brim, the soul shall be full, and who knows what the eternal milkings, the everlasting intellectual suckings of the glorified ones are, by which they draw in and drink from the honeycomb of uncreated glory, and the deep, deep fountain and river of endless life, the streams of joy, consolation, love, fruition of Jehovah, the soul being the channel, whose banks are eternally green with glory? what are the emanations, the out-flowings of blessedness from the pure essence and bright face of Him that sits on the throne? and what can these in-commings and the eternal flowings of the tide of that sea of matchless felicity be? who knows? ‘Come up and see,’ can best resolve; come up and drink, be drunk and giddy, and satiated with glory and move no curious question of that fruition of God. Christ will solve all these doubts to the quieting of your mind when ye come up thither. Nor is it needful to say that there is a vision of God in this life, which is heaven, and all the heaven we shall ever have, and this vision is without receiving any images, forms, characters of God, because it is purely spiritual and abstracted from all acts of imagination, and in it we are mere patients, not agents, God pouring the immediate brightness of his own essence in us: truely, this is to be wise above what is written and I crave leave to doubt, if Familists have the images and species of this opinion from the Spirit of God. For that spirit is a Spirit of sobriety and the most spiritual and ecstatical visions that the prophets, the men of God were taken up with; in them all, to me, there seems to be visions of forms, images, characters, a throne, angels with six wings, smoke, a woman clothed with the sun, etc… but a vision of God immediate in this life, and that ordinary, without forms, images, without Word, sacraments, ordinances, I know not, I understand it not. … Position 4. There is a twofold fulness of loveliness in Christ; one attainable in this life, the other reserved for the life to come. The full and highest pitch of the drawing loveliness of Christ, I think excludes all ordinances, Scripture, sacraments, and means we now use. Because old monks and late Familists make no heaven but in this life only (as if a monks’ coul were the very crown of eternal glory) and say the Resurrection is past; as their fathers Hymeneus and Phyletus said, and doubt of the immortality of the soul; therefore they, that they may be true to their own principles, must say that there be a number of perfect men that are above and higher than Law, duties, ordinances, teaching of men, ministry, because these are for the unperfect and unregenerate (and the monks and Familists are not such, but do already enjoy God in a fruition of glory). But the Scripture says that means, ordinances, are ever in use in this life and only excluded from the life to come, 1 Cor. 13:8… 2. The life to come is holden forth, Rev. 21:22, to want all ordinances… 2. The body of Christ is low of stature, capable of growing, the bride’s hair grows, she is not of a perfect •all stature, but like a yong girl, not yet fit for marriage to the Lamb, till we meet all in the unity of Faith: So I know no active anihilation, no evanishing of and ceasing from all acts of the will of God revealed in the law and Gospel; that is, from praying, hearing, meditating, loving, desiring, longing after Christ, till the day that the shadows flee away; Then I confess I shall have no leisure to read on the book of the Old and New Testament, or to attend preaching, sacraments or other ordinances, because I need no mirror, no portrait of Christ, no message of ministers, when I see and enjoy Himself. … Position 5. There is a fulness of loveliness in Christ, that is begun in us, by possession and title in this life, but never perfect till the life to come, in which there be these: 1. union. 2. fruition. 3. rest. 4. satisfaction. 5. sense. 6. living and acting in Christ. 7. loving and solacing of the soul…</p></blockquote>

— Samuel Rutherford, Christ Dying &amp; Drawing Sinners to Himself, (London: 1647), pp. 349-52">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CPosition+2.+The+Scripture+and+all+the+ordinances+are+but+created+things+and+not+the+ultimate+object+of+our+faith+and+highest+and+compleatest+love%3A+that+is+reserved+to+God+in+Jesus+Christ%3B+yea%2C+the+most+perfect+%5Bmere+human%5D+we+read+of%2C+Paul+a+chosen+vessel%2C+stood+in+need+of+comfort+from+Titus%2C+2+Cor+7%3A5-6%2C+and+the+saints+at+Rome%2C+Rom.+1%3A11-12%E2%80%A6+then+the+most+perfect+are+not+above+the+Law%2C+the+Gospel+and+Ordinances%2C+as+Familists+say%E2%80%A6+But+that+we+may+understand+this+the+better%2C+we+are+to+remember+that%3A+1.+There+is+a+a+twofold+happiness+of+the+saints%2C+one+formal+and+another+objective.+2.+That+there+is+a+mediate+seeing+of+God%2C+one+by+ordinances+and+means%3B+another+immediate.+3.+That+there+is+a+twofold+will+of+God%3B+one+that+is+revealed+in+Scripture%2C+or+the+Law+of+Nature%2C+and+that+is+the+moral+good+that+God+approves+and+enjoins+to+us%2C+rather+than+the+will+of+God%3B+this+the+Familists+call+%E2%80%98the+exterior+or+accidental+will+of+God%2C%E2%80%99+because+God%E2%80%99s+will%2C+as+his+essence%2C+should+have+been+entire+and+self-sufficient%2C+though+God+had+never+revealed+any+such+will+to+men+or+angels%2C+yea+though+He+had+never+made+the+world+or+men%2C+or+angel.+%E2%80%98There+is+another+will-essential+in+God%2C+which+is+not+the+thing+willed%2C+but+the+essential+faculty+of+desiring+or+willing+in+God.%E2%80%99+Now+to+come+nearer+the+point%2C+the+formal+blessedness+of+the+saints+is+in+the+act+of+seeing%2C+knowing%2C+loving%2C+enjoying+God%2C+which+on+our+part+are+created+things%2C+and+so+empty+nothings%2C+and+are+not+essentially+the+happiness+of+man%2C+but+means+by+the+which+we+enjoy+God+our+happiness%2C+so+the+using+of+all+the+means+and+ordinances+are+not+our+happiness.+It%E2%80%99s+true%2C+our+Saviour+says%2C+It%E2%80%99s+life+eternal+to+know+God+and+his+Son+Christ%2C+Jn.+17.+But+He+means+it+is+the+way+and+necessary+means+to+happiness+and+life+eternal.+God+in+Christ%2C+and+in+the+in-comings+and+out-flowings+of+the+Spirit+of+glory%2C+or+the+blessed+one+God%2C+in+three+persons%2C+is+the+object+and+happiness+of+the+saints%2C+and+therefore+we+are+to+prefer+Christ+Himself+to+all+the+kisses%2C+visions%2C+out-flowings+of+glory%2C+and+all+our+acts+of+seeing%2C+loving%2C+and+enjoying+of+God%3B+we+may+love+ordinances%2C+and+prize+highly%2C+the+vision+of+God%2C+but+God+Himself%2C+and+Jesus+Christ%2C+we+must+not+only+prize%2C+but+be+ravished%2C+overcharged+with+Himself%3B+as+the+Bridegroom+is+far+more+excellent+than+his+bracelets%2C+chains%2C+rings.+In+this+sense+I+would+in+my+heart+and+esteem+make+away+all+ordinances%2C+yea%2C+all+the+honey-combs%2C+all+the+apples%2C+all+the+created+roses+that+grow+on+Christ%2C+all+the+sweet+results+and+out-flowings+of+glory%2C+yea%2C+whole+created+heaven+for+Christ%3B+Christ-God+Himself%3B+the+bulk%2C+the+body%2C+the+stalk+of+the+Tree+of+Life%2C+is+infinitely+to+be+valued+above+an+apple%3B+yea+all+the+created+apples+and+sweet+blossoms+and+soul-delighting+flowers+that+grow+on+the+tree.+Now+here+on+earth+we+are+happy+as+%E2%80%98heirs%2C%E2%80%99+not+as+%E2%80%98lords+and+possessors%2C+and+in+an+union+with+the+exterior%2C+and+revealed+will+of+God%2C%E2%80%99+in+believing%2C+fearing%2C+serving+God%2C+in+Christ%2C+in+a+practical+union+with+God%2C+but+all+this+is+but+the+way+to+the+well%2C+not+the+well+itself%2C+and+the+union+with%2C+or+vision+of+God+is+mediate%2C+far+off%2C+in+a+mirror%2C+in+the+image%2C+form%2C+characters%2C+elements%2C+or+looking-glass+of+Word%2C+sacraments%2C+ministry%2C+ordinances%2C+of+hearing%2C+praying%2C+praising%2C+but+in+heaven+we+see+God+face+to+face%2C+that+is+without+means%2C+or+the+intervention+of+messengers%2C+or+ordinances.+I+cannot+determine+whether%2C+when+we+shall+know+and+see+the+Lord+in+an+immediate+vision+of+glory%2C+our+understanding+shall+receive+created+forms%2C+intellectual+species%2C+images%2C+characters+of+the+lovely+essence%2C+the+white%2C+ruddy%2C+pleasant%2C+lovely+countenance+of+that+desirable+Prince%2C+the+Lord+Jesus%3B+it%E2%80%99s+a+nicety+not+for+our+edification%3B+sure+Christ+shall+infuse+and+pour+in+into+every+vessel+of+glory+so+much+of+Himself%2C+his+presence%2C+lovliness%2C+image%2C+beauty%2C+as+from+bottom+to+brim%2C+the+soul+shall+be+full%2C+and+who+knows+what+the+eternal+milkings%2C+the+everlasting+intellectual+suckings+of+the+glorified+ones+are%2C+by+which+they+draw+in+and+drink+from+the+honeycomb+of+uncreated+glory%2C+and+the+deep%2C+deep+fountain+and+river+of+endless+life%2C+the+streams+of+joy%2C+consolation%2C+love%2C+fruition+of+Jehovah%2C+the+soul+being+the+channel%2C+whose+banks+are+eternally+green+with+glory%3F+what+are+the+emanations%2C+the+out-flowings+of+blessedness+from+the+pure+essence+and+bright+face+of+Him+that+sits+on+the+throne%3F+and+what+can+these+in-commings+and+the+eternal+flowings+of+the+tide+of+that+sea+of+matchless+felicity+be%3F+who+knows%3F+%E2%80%98Come+up+and+see%2C%E2%80%99+can+best+resolve%3B+come+up+and+drink%2C+be+drunk+and+giddy%2C+and+satiated+with+glory+and+move+no+curious+question+of+that+fruition+of+God.+Christ+will+solve+all+these+doubts+to+the+quieting+of+your+mind+when+ye+come+up+thither.+Nor+is+it+needful+to+say+that+there+is+a+vision+of+God+in+this+life%2C+which+is+heaven%2C+and+all+the+heaven+we+shall+ever+have%2C+and+this+vision+is+without+receiving+any+images%2C+forms%2C+characters+of+God%2C+because+it+is+purely+spiritual+and+abstracted+from+all+acts+of+imagination%2C+and+in+it+we+are+mere+patients%2C+not+agents%2C+God+pouring+the+immediate+brightness+of+his+own+essence+in+us%3A+truely%2C+this+is+to+be+wise+above+what+is+written+and+I+crave+leave+to+doubt%2C+if+Familists+have+the+images+and+species+of+this+opinion+from+the+Spirit+of+God.+For+that+spirit+is+a+Spirit+of+sobriety+and+the+most+spiritual+and+ecstatical+visions+that+the+prophets%2C+the+men+of+God+were+taken+up+with%3B+in+them+all%2C+to+me%2C+there+seems+to+be+visions+of+forms%2C+images%2C+characters%2C+a+throne%2C+angels+with+six+wings%2C+smoke%2C+a+woman+clothed+with+the+sun%2C+etc%E2%80%A6+but+a+vision+of+God+immediate+in+this+life%2C+and+that+ordinary%2C+without+forms%2C+images%2C+without+Word%2C+sacraments%2C+ordinances%2C+I+know+not%2C+I+understand+it+not.+%E2%80%A6+Position+4.+There+is+a+twofold+fulness+of+loveliness+in+Christ%3B+one+attainable+in+this+life%2C+the+other+reserved+for+the+life+to+come.+The+full+and+highest+pitch+of+the+drawing+loveliness+of+Christ%2C+I+think+excludes+all+ordinances%2C+Scripture%2C+sacraments%2C+and+means+we+now+use.+Because+old+monks+and+late+Familists+make+no+heaven+but+in+this+life+only+%28as+if+a+monks%E2%80%99+coul+were+the+very+crown+of+eternal+glory%29+and+say+the+Resurrection+is+past%3B+as+their+fathers+Hymeneus+and+Phyletus+said%2C+and+doubt+of+the+immortality+of+the+soul%3B+therefore+they%2C+that+they+may+be+true+to+their+own+principles%2C+must+say+that+there+be+a+number+of+perfect+men+that+are+above+and+higher+than+Law%2C+duties%2C+ordinances%2C+teaching+of+men%2C+ministry%2C+because+these+are+for+the+unperfect+and+unregenerate+%28and+the+monks+and+Familists+are+not+such%2C+but+do+already+enjoy+God+in+a+fruition+of+glory%29.+But+the+Scripture+says+that+means%2C+ordinances%2C+are+ever+in+use+in+this+life+and+only+excluded+from+the+life+to+come%2C+1+Cor.+13%3A8%E2%80%A6+2.+The+life+to+come+is+holden+forth%2C+Rev.+21%3A22%2C+to+want+all+ordinances%E2%80%A6+2.+The+body+of+Christ+is+low+of+stature%2C+capable+of+growing%2C+the+bride%E2%80%99s+hair+grows%2C+she+is+not+of+a+perfect+%E2%80%A2all+stature%2C+but+like+a+yong+girl%2C+not+yet+fit+for+marriage+to+the+Lamb%2C+till+we+meet+all+in+the+unity+of+Faith%3A+So+I+know+no+active+anihilation%2C+no+evanishing+of+and+ceasing+from+all+acts+of+the+will+of+God+revealed+in+the+law+and+Gospel%3B+that+is%2C+from+praying%2C+hearing%2C+meditating%2C+loving%2C+desirin

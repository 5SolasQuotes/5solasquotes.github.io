<main class="wrap"><figure class="quote" id="q-318faa975f" data-kw="">
<blockquote><p>Q. Of how many sorts is this Covenant?

A. In substance it is but one, but in regard of circumstance it is two: the Old Testament, and the New.

Q. What is the Old Testament?

A. It is the covenant of God, which (under types, figures, and shadows) did set forth Christ before his coming in the flesh; and by virtue whereof life everlasting was given by faith in Christ that was to come.

Q. What is the new Testament?

A. It is the covenant of God, which (since the coming of Christ in the flesh) hath abolished those shadows, &amp; giveth life everlasting by faith in Christ, that is come; by means whereof it is in a special respect called the Gospel. Coloss. 2.16.17.20. Hebr. 9.1.2.3. &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or the whole body and substance of divinity</cite>, (London, 1616), p. 168.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b0b9a3104d" data-kw="">
<blockquote><p>For here I observe, that men of learning in other respects have stumbled, who, when explaining the nature of those Sacraments, too incautiously blend things belonging to a quite different covenant. Nothing is here to be brought in which does not belong to the covenant of works, the promises of that covenant, and the duties of man under the same; all which are most distinct from the covenant of grace. Here we are to say nothing of Christ, nothing of justifying faith in him, nothing of our ceasing from our own works as impure, nor any thing of that rest after the miseries of this life. All these belong to another covenant. I do not, however, deny, that the unsearchable wisdom of God did appoint and order these symbols in such a manner that the remembrance of them, after the fall, might be able to instruct man in many things relating to the covenant of grace and its mediator. As that, according to Paul, the first Adam himself was a type of the second; Eve, curiously formed out of Adam’s rib while asleep, was a type of the church, as it were, taken from Christ in virtue of his death; and that the first marriage represented that great mystery which regards Christ and the church. These things, however, were neither known nor thought of in a state of nature; nor to be mentioned in a discourse on the Sacraments of the covenant of works. Having premised these things, let us now inquire into each particular with all the care possible, beginning with Paradise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man</cite>, trans. William Crookshank 2 vol (Edinburgh: T. Tegg &amp; Son, 1837), 1.81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b0b9a3104d.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/08/witsius-sharply-distinguished-between-the-covenants-of-works-and-grace/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-5c532f04d9" data-kw="">
<blockquote><p>Man, after the fall, abides under the covenant of works; and to this day, life is promised him under condition of works done by strength and nature. But if he will not do so well, death and the everlasting curse of God is denounced against him, so long as he is without Christ and without the gospel. And being freed from the covenant of works…he is admitted to the covenant of grace…. Christ, therefore, our Mediator, subjected himself to the covenant of works, and unto the law for our sake, and did both fulfill the condition of the covenant of works in his holy and good life…and also did undergo that curse with which man was threatened in the covenant of works, if that condition of good and holy works were not kept…Wherefore we see Christ in two respects, to wit, in doing and suffering, subject to the covenant of works, and in both respects he has most perfectly fulfilled it, and that for our sake whose Mediator he is become.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Works of Robert Rollock</cite>, 1.52.</span></figcaption>

<blockquote><p>To be a God unto thee. In this single word we are plainly taught, that this was a spiritual covenant, not confirmed in reference to the present life only; but one from which Abraham might conceive the hope of eternal salvation, so that being raised even to heaven, he might lay hold of solid and perfect bliss. For those whom God adopts to himself, from among a people—seeing that he makes them partakers of his righteousness and of all good things—he also constitutes heirs of celestial life. Let us then mark this as the principal part of the covenant, that He who is the God of the living, not of the dead, promises to be a God to the children of Abraham. It follows afterwards, in the way of augmentation of the grant, that he promises to give them the land. I confess, indeed, that something greater and more excellent than itself was shadowed forth by the land of Canaan; yet this is not at variance with the statement, that the promise now made was an accession to that primary one, ‘I will be thy God.’ Now, although God again affirms, as before, that He will give the land to Abraham himself, we nevertheless know, that Abraham never possessed dominion over it; but the holy man was contented with his title to it alone, although the possession of it was not granted him; and, therefore, he calmly passed from his earthly pilgrimage into heaven. God again repeats that He will be a God to the posterity of Abraham, in order that they may not settle upon earth, but may regard themselves as trained for higher things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 1.450.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>Obs. XXIX. The new covenant is made with them alone who effectually and eventually are made partakers of the grace of it. — “This is the covenant that I will make with them,..... I will be merciful unto their unrighteousness,” etc. Those with whom the old covenant was made were all of them actual partakers of the benefits of it; and if they are not so with whom the new is made, it comes short of the old in efficacy, and may be utterly frustrated. Neither doth the indefinite proposal of the terms of the covenant prove that the covenant is made with them, or any of them, who enjoy not the benefits of it. Indeed this is the excellency of this covenant, and so it is here declared, that it doth effectually communicate all the grace and mercy contained in it unto all and every one with whom it is made; whomsoever it is made withal, his sins are pardoned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:12; Works, vol. 22, p. 207</span></figcaption>

— John Owen, An Exposition of the Epistle to the Hebrews, 8:12; Works, vol. 22, p. 207">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObs.+XXIX.+The+new+covenant+is+made+with+them+alone+who+effectually+and+eventually+are+made+partakers+of+the+grace+of+it.+%E2%80%94+%E2%80%9CThis+is+the+covenant+that+I+will+make+with+them%2C.....+I+will+be+merciful+unto+their+unrighteousness%2C%E2%80%9D+etc.+Those+with+whom+the+old+covenant+was+made+were+all+of+them+actual+partakers+of+the+benefits+of+it%3B+and+if+they+are+not+so+with+whom+the+new+is+made%2C+it+comes+short+of+the+old+in+efficacy%2C+and+may+be+utterly+frustrated.+Neither+doth+the+indefinite+proposal+of+the+terms+of+the+covenant+prove+that+the+covenant+is+made+with+them%2C+or+any+of+them%2C+who+enjoy+not+the+benefits+of+it.+Indeed+this+is+the+excellency+of+this+covenant%2C+and+so+it+is+here+declared%2C+that+it+doth+effectually+communicate+all+the+grace+and+mercy+contained+in+it+unto+all+and+every+one+with+whom+it+is+made%3B+whomsoever+it+is+made+withal%2C+his+sins+are+pardoned.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+An+Exposition+of+the+Epistle+to+the+Hebrews%2C+8%3A12%3B+Works%2C+vol.+22%2C+p.+207&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1a4f8877c3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1a4f8877c3.html">Permalink</a><a class="src" href="https://archive.org/details/worksofjohnowend0023owen" rel="noopener" target="_blank">Read it online · Internet Archive (Goold)</a></div>

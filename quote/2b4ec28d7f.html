<main class="wrap"><figure class="quote" id="q-2b4ec28d7f" data-kw="">
<blockquote><p>You are wont, indeed, to bring up against us the letters of Cyprian, his opinion, his Council; why do ye claim the authority of Cyprian for your schism, and reject his example when it makes for the peace of the Church? But who can fail to be aware that the sacred canon of Scripture, both of the Old and New Testament, is confined within its own limits, and that it stands so absolutely in a superior position to all later letters of the bishops, that about it we can hold no manner of doubt or disputation whether what is confessedly contained in it is right and true….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Baptism Against the Donatists II.3–4. (HT: Adiaphora).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0df9e898c7" data-kw="">
<blockquote><p>I must turn to the Word of God. In questions of this kind it matters nothing what the world thinks right or wrong. There is only one sure test of truth. What says the Scripture? What is written in the Bible? What is the mind of the Holy Spirit? If we cannot submit our judgments to this infallible umpire, it is useless to pretend that we have any religion at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Old Paths</cite>, ch. on The Heart, p. 322</span></figcaption>

</figure><figure class="quote" id="q-af1d9fc9d0" data-kw="">
<blockquote><p>We do not say that each individual should acquiesce in that interpretation which his own private spirit frames and dictates to him; for this would be to open a door to fanatical tempers and spirits: but we say that that Spirit should be the judge, who speaks openly and expressly in the scriptures, and whom all may hear; by him we desire that all other spirits, that is, all doctrines, (for so the word is to be taken in this place,) should be examined.</p></blockquote>

<blockquote><p>Don&#x27;t confuse solo scriptura with sola scriptura. Don&#x27;t confuse the Radicals with the Reformers.</p></blockquote>

</figure><figure class="quote" id="q-6b9349f83f" data-kw="sufficiency">
<blockquote><p>The question is not whether all those things are taught in Scripture word for word (autolexei), or immediately and expressly. We acknowledge that many things are to be deduced by legitimate inference and to be considered as the word of God. But the question is whether they are so contained in Scripture, be they expressly in it or derivable from it by legitimate inference, that there is no need of another and an unwritten (agraphō) rule of faith from which to derive matters of religion and salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.16.3</span></figcaption>

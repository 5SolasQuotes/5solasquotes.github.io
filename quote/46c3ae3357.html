<blockquote><p>I shall not now enquire whether these acts of Christ’s will and holy love did issue and proceed from Him per modum naturae [through the mode of nature, as Rutherford held; see below], or per modum rationis [through the mode of reason], as they speak in the Schools, or both; that is, whether they were only the natural weights and inclinations, and desires of the will and habit of charity to his own self-preservation, without any deliberation, such as is to be found in children before the use of reason; or whether they proceeded from Him out of a deliberate consideration and pondering, not so much of the now-impending evils and the fury of his Father’s wrath, as the love He bore to his own people the Jews, whose destruction and casting off He foresaw would be the consequents of his death: though Suarez seems to me to have proved the latter as well as the former.</p></blockquote>

<blockquote><p>Still, however, the will of God is not at variance with itself. It undergoes no change. He makes no pretence of not willing what He wills, but while in Himself the will is one and undivided, to us it appears manifold, because, from the feebleness of our intellect, we cannot comprehend how, though after a different manner, He wills and wills not the very same thing.</p></blockquote>

</figure><figure class="quote" id="q-cd32f57039" data-kw="">
<blockquote><p>As in the previous controversies, the rectitude of the distinction depends upon its definition: ‘it is possible to allow a voluntas conditionata [conditional will]’ in God ‘but not in an a priori and antecedent sense, as if dependent on a condition, rather in an a posteriori and consequent sense, given that some condition in the creature intervenes between the will and its execution’; and then ‘only to the extent that the condition does not belong to the internal divine act (a parte actus interni) or volition (volitionis), but to the external object (a parte obiecti externi) or thing willed (rei volitae).’ In this sense, the distinction can legitimately be applied to the promises associated with God’s covenants… the covenants of law and gospel, where God’s promises are extended conditionally to sinners… In other words, the conditional will remains an immutable will, willed eternally by God, but it is understood as being directed toward a contingent or conditional event: the condition, strictly understood, obtains, not in the divine will, but in the temporal event.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>5. ‘Voluntas absoluta and voluntas conditionata’ in Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725 2nd ed. (Baker Books, 2003), vol. 3, ch. 5.4, E. The Ad Intra–Ad Extra Distinctions, pp. 463-65</cite>, p. 464</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-3a1212302c" data-kw="">
<blockquote><p>Surely it is easy to observe that we are too fearful of some distinctions which carry in them a jealousy of former abuse and yet both may well be admitted in a good sense and serve for excellent purpose. As that (if we labor for our better understanding to explicate the one will of God by several notions of the antecedent and consequent will of God, which Paulus Ferrius, a reformed schoolman, approves by the suffrages of Zanchi, Polanus and other orthodox divines, to look at it a little running, as that which gives no small light to the business in hand. As there is wont to be conceived a double knowledge of God, the one of mere understanding whereby He foreknows all things that may be; the other of vision, or approbation, whereby he foreknows that which undoubtedly shall be, so there is a double will to be conceived of God answerable to this double knowledge: an antecedent will, which answers to the mere understanding whereby God wills every possible good without the consideration of the adjuncts appertaining to it; a consequent will answering to the knowledge of approbation, whereby (all circumstances prepensed) God does simply will this or that particular event as simply good to be and which is there upon impossible not to be. The one of these is a will of complacency, the other of prosecution; the one is as it were an optative will, the other an absolute. In the first of these God would have all to be saved because it is in a sort good in itself, in that the nature of man is ordainable to life and man has by God common helps seriously offered for the attaining thereof; neither can we think it other than pleasing to God that his creatures should both do well and fare well. In the latter He wills some of all to be saved, as not finding it simply good (all circumstances considered) to extend this favor to all; this appears in the effect, for if God absolutely willed it, it could not fail of being, neither does ought hinder, but these two may stand well together, a complacence in the blessedness of his creature and a will of his smart. For both that which we will in one regard, we may not will in another, as we may wish a felon to live as a man, to die as a malefactor; and besides, the possibility of one opposite does not hinder the act of another, as he that has power to run perhaps does sit or lie. Learned Zanchi methinks gives at once a good satisfaction as to this doubt (Of the Nature of God, 1.3, ch. 4); so to the ordinary exception whereat many have stumbled, of the pretended mockage of God’s invitations, where He means not, as some have misconceived, a serious effect. In the parable of the Gospel (says he) those which were first bidden to the marriage feast and came not, were they therefore mocked by the king because he only signified unto them what would be acceptable unto him and what was their duty to perform? and yet he did not command them to be compelled as he did the second guests to come to the wedding? Surely no, yet in the mean time, there was not the same will of the king in the inviting of the first and of the second, for in these second there was an absolute will of the king, that they should without fail come; and therefore he effectually caused them to come. In the former he only signified, and that fairly and ingenuously, what would be pleasing to him: Thus he. The entertainment of this one distinction, which has the allowance of orthodox and learned authors to be free from any danger or inconvenience, would mitigate this strife since it is that which the opponents contend for, which the defendents may yield without any sensible prejudice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shaking of the Olive-Tree: the Remaining Works of that Incomparable Prelate Joseph Hall… (London: Cadwell, 1660), Via Media: the Way of Peace in the Five Busy Articles commonly known by the name of Arminius, Of the Fifth Article of Perseverance</cite>, pp. 376-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Surely it is easy to observe that we are too fearful of some distinctions which carry in them a jealousy of former abuse and yet both may well be admitted in a good sense and serve for excellent purpose. As that (if we labor for our better understanding to explicate the one will of God by several notions of the antecedent and consequent will of God, which Paulus Ferrius, a reformed schoolman, approves by the suffrages of Zanchi, Polanus and other orthodox divines, to look at it a little running, as that which gives no small light to the business in hand. As there is wont to be conceived a double knowledge of God, the one of mere understanding whereby He foreknows all things that may be; the other of vision, or approbation, whereby he foreknows that which undoubtedly shall be, so there is a double will to be conceived of God answerable to this double knowledge: an antecedent will, which answers to the mere understanding whereby God wills every possible good without the consideration of the adjuncts appertaining to it; a consequent will answering to the knowledge of approbation, whereby (all circumstances prepensed) God does simply will this or that particular event as simply good to be and which is there upon impossible not to be. The one of these is a will of complacency, the other of prosecution; the one is as it were an optative will, the other an absolute. In the first of these God would have all to be saved because it is in a sort good in itself, in that the nature of man is ordainable to life and man has by God common helps seriously offered for the attaining thereof; neither can we think it other than pleasing to God that his creatures should both do well and fare well. In the latter He wills some of all to be saved, as not finding it simply good (all circumstances considered) to extend this favor to all; this appears in the effect, for if God absolutely willed it, it could not fail of being, neither does ought hinder, but these two may stand well together, a complacence in the blessedness of his creature and a will of his smart. For both that which we will in one regard, we may not will in another, as we may wish a felon to live as a man, to die as a malefactor; and besides, the possibility of one opposite does not hinder the act of another, as he that has power to run perhaps does sit or lie. Learned Zanchi methinks gives at once a good satisfaction as to this doubt (Of the Nature of God, 1.3, ch. 4); so to the ordinary exception whereat many have stumbled, of the pretended mockage of God’s invitations, where He means not, as some have misconceived, a serious effect. In the parable of the Gospel (says he) those which were first bidden to the marriage feast and came not, were they therefore mocked by the king because he only signified unto them what would be acceptable unto him and what was their duty to perform? and yet he did not command them to be compelled as he did the second guests to come to the wedding? Surely no, yet in the mean time, there was not the same will of the king in the inviting of the first and of the second, for in these second there was an absolute will of the king, that they should without fail come; and therefore he effectually caused them to come. In the former he only signified, and that fairly and ingenuously, what would be pleasing to him: Thus he. The entertainment of this one distinction, which has the allowance of orthodox and learned authors to be free from any danger or inconvenience, would mitigate this strife since it is that which the opponents contend for, which the defendents may yield without any sensible prejudice.”

— Joseph Hall, The Shaking of the Olive-Tree: the Remaining Works of that Incomparable Prelate Joseph Hall… (London: Cadwell, 1660), Via Media: the Way of Peace in the Five Busy Articles commonly known by the name of Arminius, Of the Fifth Article of Perseverance, pp. 376-78">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSurely+it+is+easy+to+observe+that+we+are+too+fearful+of+some+distinctions+which+carry+in+them+a+jealousy+of+former+abuse+and+yet+both+may+well+be+admitted+in+a+good+sense+and+serve+for+excellent+purpose.+As+that+%28if+we+labor+for+our+better+understanding+to+explicate+the+one+will+of+God+by+several+notions+of+the+antecedent+and+consequent+will+of+God%2C+which+Paulus+Ferrius%2C+a+reformed+schoolman%2C+approves+by+the+suffrages+of+Zanchi%2C+Polanus+and+other+orthodox+divines%2C+to+look+at+it+a+little+running%2C+as+that+which+gives+no+small+light+to+the+business+in+hand.+As+there+is+wont+to+be+conceived+a+double+knowledge+of+God%2C+the+one+of+mere+understanding+whereby+He+foreknows+all+things+that+may+be%3B+the+other+of+vision%2C+or+approbation%2C+whereby+he+foreknows+that+which+undoubtedly+shall+be%2C+so+there+is+a+double+will+to+be+conceived+of+God+answerable+to+this+double+knowledge%3A+an+antecedent+will%2C+which+answers+to+the+mere+understanding+whereby+God+wills+every+possible+good+without+the+consideration+of+the+adjuncts+appertaining+to+it%3B+a+consequent+will+answering+to+the+knowledge+of+approbation%2C+whereby+%28all+circumstances+prepensed%29+God+does+simply+will+this+or+that+particular+event+as+simply+good+to+be+and+which+is+there+upon+impossible+not+to+be.+The+one+of+these+is+a+will+of+complacency%2C+the+other+of+prosecution%3B+the+one+is+as+it+were+an+optative+will%2C+the+other+an+absolute.+In+the+first+of+these+God+would+have+all+to+be+saved+because+it+is+in+a+sort+good+in+itself%2C+in+that+the+nature+of+man+is+ordainable+to+life+and+man+has+by+God+common+helps+seriously+offered+for+the+attaining+thereof%3B+neither+can+we+think+it+other+than+pleasing+to+God+that+his+creatures+should+both+do+well+and+fare+well.+In+the+latter+He+wills+some+of+all+to+be+saved%2C+as+not+finding+it+simply+good+%28all+circumstances+considered%29+to+extend+this+favor+to+all%3B+this+appears+in+the+effect%2C+for+if+God+absolutely+willed+it%2C+it+could+not+fail+of+being%2C+neither+does+ought+hinder%2C+but+these+two+may+stand+well+together%2C+a+complacence+in+the+blessedness+of+his+creature+and+a+will+of+his+smart.+For+both+that+which+we+will+in+one+regard%2C+we+may+not+will+in+another%2C+as+we+may+wish+a+felon+to+live+as+a+man%2C+to+die+as+a+malefactor%3B+and+besides%2C+the+possibility+of+one+opposite+does+not+hinder+the+act+of+another%2C+as+he+that+has+power+to+run+perhaps+does+sit+or+lie.+Learned+Zanchi+methinks+gives+at+once+a+good+satisfaction+as+to+this+doubt+%28Of+the+Nature+of+God%2C+1.3%2C+ch.+4%29%3B+so+to+the+ordinary+exception+whereat+many+have+stumbled%2C+of+the+pretended+mockage+of+God%E2%80%99s+invitations%2C+where+He+means+not%2C+as+some+have+misconceived%2C+a+serious+effect.+In+the+parable+of+the+Gospel+%28says+he%29+those+which+were+first+bidden+to+the+marriage+feast+and+came+not%2C+were+they+therefore+mocked+by+the+king+because+he+only+signified+unto+them+what+would+be+acceptable+unto+him+and+what+was+their+duty+to+perform%3F+and+yet+he+did+not+command+them+to+be+compelled+as+he+did+the+second+guests+to+come+to+the+wedding%3F+Surely+no%2C+yet+in+the+mean+time%2C+there+was+not+the+same+will+of+the+king+in+the+inviting+of+the+first+and+of+the+second%2C+for+in+these+second+there+was+an+absolute+will+of+the+king%2C+that+they+should+without+fail+come%3B+and+therefore+he+effectually+caused+them+to+come.+In+the+former+he+only+signified%2C+and+that+fairly+and+ingenuously%2C+what+would+be+pleasing+to+him%3A+Thus+he.+The+entertainment+of+this+one+distinction%2C+which+has+the+allowance+of+orthodox+and+learned+authors+to+be+free+from+any+danger+or+inconvenience%2C+would+mitigate+this+strife

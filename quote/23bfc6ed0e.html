<main class="wrap"><figure class="quote" id="q-23bfc6ed0e" data-kw="">
<blockquote><p>There remains to speak of the widows which were godly, poor, women in the church above the age of 60 years for the avoiding of all suspicion of evil which might rise by slanderous tongues if they had been younger (1 Tim. 5:9). These, as they were nourished at the charges of the church, being poor, so did they serve the church in attending upon poor strangers and the poor which were sick in the church, whereof they were widows. Now although there is not so great use of these widows with us as there was in those places where the churches were first founded and in that time wherein this order of widows was instituted, part of the which necessity grew both by the multitude of strangers through the persecution and by the great heat of those East countries, whereupon the washing and supplyng of their feet was required: yet for so much as there are poor which are sick in every church, I do not see how a better and more convenient order can be devised for the attendance of them in their sickness and other infirmities than this which St. Paul appoints that there should be (if there can be any gotten) godly, poor widows, of the age which St. Paul appoints, which should attend upon such. For if there be any such poor widows of that age destitute of all friends, it is manifest that they must needs live of the charge of the church, and seing they must needs do so, it is better they should do some duty for it unto the church again than the church should be at a new charge to find others to attend upon those which are sick and destitute of keepers, seeing that there can be none so fit for that purpose as those women which St. Paul does there describe: so that I conclude that (if such may be gotten) we ought also to keep that order of widows in the church still. I know that there be learned men which think otherwise, but I stand upon the authority of God’s Word and not upon the opinions of men be they never so well learned. And if the matter also should be tried by the judgement of men I am able to show the judgment of as learned as this age has brought forth which think that the institution of widows is perpetual and ought to be where it may be had and where such widows are found. Indeed they are more rare now than in the apostles’ times: For then by reason of the persecution those which had the gift of continency did abstain from marriage after the death of their husbands for that the sole life was an easier estate and less dangerous and chargeable when they were driven to fly than the estate of those which were married.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reply to an Answer made of Mr. Doctor Whitgift Against the</cite>, [Presbyterian] Admonition to the Parliament (1573) | ‘To the sections beginning in the 118th page and holding on until the 123rd page’, pp. 191-2</span></figcaption>

</figure><figure class="quote" id="q-7196856abe" data-kw="">
<blockquote><p>All the officers of the New Testament both ordinary and extraordinary are designed and distinguished by their names, or compellations, as apostles, evangelists, presbyters, deacons. The extraordinary and superior have upon good reason the names of the ordinary and inferior common unto them, as the apostles are called ‘elders’ (1 Pet. 5:1). But this is not reciprocal, for the ordinary and inferior are never called by the names of the extraordinary and superior: the deacon is not called an ‘elder,’ nor the pastor by the name of the ‘apostle’ or ‘evangelist’. It is true that Barnabas is called an ‘apostle’ (Acts 14:4, 14) because he was an apostle [messenger] of Christ as Paul was. Titus and others and Epaphroditus are only called ‘apostles’ or messengers of the Church (2 Cor. 8:23; Phil. 2:25). Whence it must follow that the office of a bishop is not an office superior to the office of a pastor, since the name ‘bishop’ is common to the pastor; and that the office of a bishop and the office of a pastor are not different, but one and the same office, since the names are altogether common in all the places of the New Testament (Acts 20:28; Phil 1:1; 1 Tim. 3:2; 1 Pet. 5:1), and the Syriac Interpreter has translated the one by the other (Tit. 1:7). What reason can there be, while the officers are distinguished by their names and the names of ‘bishop’ and ‘pastor’ are common, but that the office of the bishop and elder is one and the same office; the one name signifying, sapientiae maturitatem [a maturity of wisdom], and the other Industriam curae Pastoralis [the industry of the pastoral oversight], says Beda.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unlawfulness and danger of Limited Prelacy</cite>, (1641), pp. 3-4</span></figcaption>

<blockquote><p>Bavinck… says, the church ‘cannot do without women in this work.’ This includes things like Sunday school, care for the poor and the sick, care for the elderly, the support of pregnant women, and more. He doesn’t think these activities need to be directly under the oversight of the church as an institution, but the church does have the calling to promote this kind of work where women use their gifts.</p></blockquote>

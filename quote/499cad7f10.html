<blockquote><p>149. Seeing, then, that Covenants ought to embrace nothing but what is Scriptural and moral, and inasmuch as moral and Scriptural truth is in itself infinitely binding, are not Covenants, if not pernicious, at least unnecessary?

This objection, though plausible, is most deceptive. True, the obligation of the law of God is infinite, and hence this obligation cannot be increased: but, our obligation to keep the law of God may be increased. A Covenant superadds a new obligation, on our part, to keep the Divine law. An oath cannot make truth more true, but it increases our obligation to speak the truth; hence, the breach of an oath is not only lying, but perjury.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prize catechism on the principles and position of the Reformed Presbyterian Church</cite>, (Belfast, 1858), pp 62-3.</span></figcaption>

</figure><figure class="quote" id="q-2274f4a73a" data-kw="">
<blockquote><p>It is worthy of note, that in every form of religion established by God among men, the Sabbath has stood forth its most conspicuous monument. In the religion of nature, which was strictly a religion of law, and had respect to man in his primitive holiness, the Sabbath was the only ordinance of worship.

There was the law written upon Adam’s heart; there was the tree of temptation for the proof of his obedience; there was the sacramental tree of life, the seal of the covenant and its blessings, instantly forfeited upon transgression; but amidst them all rose the Sabbath, itself the sign of a more perfect rest, the great comprehensive institute of natural religion, embodying the worship which man owes to God, and embracing that obedience to His law, which was its fundamental element. It was eminently proper that man should thus bring, in the worship of the Sabbath, a pledge of his soul’s deepest homage to God. But this was not all; in its repose also, he brought a religious tribute of that very life and being which God had bestowed.

In the gift of immortality, God set the seal of His own image upon the existence which He gave to man. If it was not self-being, since this could not be given, it was at least ceaseless being; and this natural endowment is placed as the stake of man’s obedience, which the law covers with its mortgage. Now, it is of this very being, thus consecrated by the seal of God’s image, and placed as the pawn to be redeemed only by perfect obedience to the divine law, that man, in the repose of the first Sabbath, offered the first fruits to God; and ever as this weekly day of rest recurs, is there presented a perpetual wave-offering before the Lord, by which our whole time and life are surrendered to Him, and anew received at His hands.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-morgan-palmer.html">Benjamin Morgan Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pastoral Letter on the Observance of the Sabbath, to the Churches and Church members within the Synod of South Carolina in Minutes of the Synod of South Carolina, at their Sessions, in Winnsborough, Fairfield District, S.C., Nov. 1851</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><figure class="quote" id="q-fde2d15b26" data-kw="">
<blockquote><p>After He had washed their feet, and had taken his garments, and was set down again, He said unto them, ‘Know ye what I have done to ye, ye call me Master and Lord, and ye say well, for so I am; if I then your Lord and Master have washed your feet, ye also ought to wash one another’s feet, for I have given you an example that ye should do as I have done to you.’ ‘Tis evident that it is the moral duty of brotherly love, in condescension, and mutual helpfulness to be expressed in all necessary offices as occasion doth require, that is the thing which Jesus Christ here enjoins his disciples, and leads them to by his own example in an office of love then in use in those parts. The same is to be said of the holy kiss, Rom. 16:16 which was a temporary occasional token of entire love; which may in answer thereunto, be expressed by any sober usage of salutation amongst men to the same purpose. But the things themselves were not instituted for any continuance, nor do represent any special grace of the New Covenant, which is inseparable from every institution of Gospel worship properly so called. Common usages or practises therefore, directed to be used in a due manner, and unto a proper end, where they are used, make them not institutions of worship. Neither have they in them as so commanded or directed, any one thing that concurs to the constitution of a Gospel-Ordinance: for neither had they their rise in the authority of Christ, nor is any continuance of them enjoined, nor any promise annexed unto them, nor any grace of the New Covenant represented or exhibited in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John</cite>, 13:12-15</span></figcaption>

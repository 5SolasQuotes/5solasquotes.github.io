<main class="wrap"><figure class="quote" id="q-417fd21fb8" data-kw="">
<blockquote><p>And here I expressly call upon you, most excellent King, or rather, God himself addresses you by the mouth of his servant Isaiah, charging you to proceed, to the utmost of your ability and power, in carrying forward the restoration of the Church, which has been so successfully begun in your kingdom. First, you daily read and hear that this duty is enjoined on you in the kingdom over which you rule. More especially Isaiah, as I have said, calls Kings the nursing-fathers of the Church, (Isaiah 49:23,) and does not permit them to withhold that assistance which her afflicted condition demands. Nor ought your mind to be slightly affected by the consideration, that the Prophet pronounces a woe on all kings and nations who refuse to give her their support.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume First</cite>, trans. William Pringle (Geneva, 1550) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), vii, p. xxiv.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-47926c9091" data-kw="">
<blockquote><p>And what further authority, or proceedings purely ecclesiastical, of one, or many sister Churches towards another whole Church, or Churches offending, either the Scriptures do hold forth, or can rationally be put in execution (without the magistrates interposing a power of another nature, unto which we upon his particular cognizance, and examination of such causes, profess ever to submit, and also to be most willing to have recourse unto) for our parts we saw not then, nor do yet see… And if the magistrate’s power (to which we give as much, and (as we think) more, than the principles of the presbyterial government will suffer them to yield) do but assist and back the sentence of other Churches denouncing this non-communion [of Independent churches] against Churches miscarrying, according to the nature of the crime, as they judge meet…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/goodwin-nye-simpson-burroughs-bridge.html">Goodwin, Nye, Simpson, Burroughs, Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apologetical Narration, Humbly Submitted to the Honourable Houses of Parliament</cite>, (London [1643]), pp. 17, 19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</a></div>
</figure><figure class="quote" id="q-6d4d78e8f9" data-kw="">
<blockquote><p>Aug. 10, 1585 Proclamation, Gatherings. The foresaid bailies and a part of the counsel ordains proclamation to be made through this burgh charging that no manner of persons enduring the time of this present pestilence, either men or women, take upon hand to hold any conventions at the close heads, Cowgate, and high streets, be even or be day, as they commonly do, whereby infection daily arises, discharging all convention of huseis [houses?] and women in special and all such other idle persons which has not charge or licence of the bailies, but only to convene at Kirk and market and to no other places and times, under the pain to be enclosed in their houses upon their own charges for the space of a month and further punished in their bodies and goods at the will of the magistrates.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-5c6831edca" data-kw="">
<blockquote><p>The first commandment teaches us that God wants us to sincerely trust Him. Yet we must fear Him about everything else. … So the good works required by the first commandment are holy and must be obeyed. But who can live up to them? Certainly no one can completely obey the first commandment. Everyone is a sinner except for Christ. Christ, however, comes to us and says, “I have shed my blood for you. My blood cries out on your behalf.” Out of His grace and kindness, He brings us the forgiveness of our sins at no cost to us whatsoever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith Alone: A Daily Devotional</cite>, (p. 210). Zondervan. Kindle Edition.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7ad8dce818" data-kw="">
<blockquote><p>Hence in the first justification of believing sinners, all future sins are remitted as unto any actual obligation unto the curse of the Law… And although sin cannot be actually pardoned before it be actually committed, yet may the obligation unto the curse of the Law be virtually taken away from such sins in justified persons as are consistent with a justified estate, or the terms of the Covenant of Grace, antecedently unto their actual commission. God at once in this sense forgives all their iniquities, and heals all their diseases, redeems their life from destruction, and crowns them with loving kindness and mercies, Ps. 103:2-3. Future sins are not so pardoned as that when they are committed they should be no sins, which cannot be, unless the commanding power of the Law be abrogated. But their respect unto the curse of the Law, or their power to oblige the justified person thereunto is taken away. … Whereas therefore one essential part of justification consists in the pardon of our sins, and sins cannot be actually pardoned before they are actually committed… Justification is at once complete in the imputation of a perfect righteousness, the grant of a right and title unto the heavenly inheritance, the actual pardon of all past sins, and the virtual pardon of future sins…</p></blockquote>

</figure><figure class="quote" id="q-fc723ab2ff" data-kw="">
<blockquote><p>But as gospel-faith is not that reflex act of the soul in a man whereby it is persuaded that Christ is his, but a direct act of taking and receiving Christ to be ours, so a gospel-repentance is not that mainly whereby we are humbled because we receive God’s love to us in pardoning, but principally in that loathing of ourselves to obtain pardon. It is therefore great ignorance in that author, in his treatise of Gospel Repentance, when p. 58, he calls repentance that goes before this faith, viz. that my sins are pardoned, a dead work; as if the faith that justifies, and without which it is impossible to please God, were the believing that my sins are pardoned; whereas the Scripture makes it to be the receiving of Christ and laying hold on Him. And seeing that the object must in order of nature be before the act that is employed about it, it follows infallibly that I must have justification before I can believe I have it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, (London: Miller, 1651), Lecture 30, on Lk. 7:47, p. 268</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“But as gospel-faith is not that reflex act of the soul in a man whereby it is persuaded that Christ is his, but a direct act of taking and receiving Christ to be ours, so a gospel-repentance is not that mainly whereby we are humbled because we receive God’s love to us in pardoning, but principally in that loathing of ourselves to obtain pardon. It is therefore great ignorance in that author, in his treatise of Gospel Repentance, when p. 58, he calls repentance that goes before this faith, viz. that my sins are pardoned, a dead work; as if the faith that justifies, and without which it is impossible to please God, were the believing that my sins are pardoned; whereas the Scripture makes it to be the receiving of Christ and laying hold on Him. And seeing that the object must in order of nature be before the act that is employed about it, it follows infallibly that I must have justification before I can believe I have it.”

ore%20I%20can%20believe%20I%20have%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f6b0d135b8" data-kw="">
<blockquote><p>So in treating of our restoration, Paul intimates in close connection issuing from our very justification before God–provided conviction of it is ours–the immediate presence in believers of the Spirit, the fashioner of all the righteousness we are to display in our lives. Hence he never uses the word ‘justify’ in this way without appearing to speak no less of this imparting of true righteousness than of the round and head of our entire salvation, the forgiveness of sins. In chapter 3 (verse 25) [of Romans] after saying that righteousness is revealed in the era of the unveiling of the gospel, that is to say, is so clearly manifested in the lives of believers that the world now acknowledges these alone to be capable of true righteousness, and after saying secondly, that Christ came to introduce to the world an endeixis, a demonstration of divine righteousness unmistakable to all, he then added, ‘that God himself might be righteous, and the justifier of him who has faith in Jesus Christ’. Here without a doubt he includes at the same time in the word ‘justify’ that righteousness which God produces by his Spirit in those who believe in Christ, and which he intends to be his attestation to the effect that he has now forgiven their sins and counts them among those he resolved to justify, that is, to count among the righteous not only by pardoning their sin but also by conforming them to the image of his Son. The apostle always speaks about our justification in this fashion, never failing to comprehend the summit of our salvation, for which he prayed for the Philippians as follows: ‘It is my prayer that your love may abound more and more in knowledge and all aesthesis (that is, a quality of discernment) whereby you may be able to approve with certainty what is excellent, and to this end, that you may be pure and give offence to no one, thus being equipped for the day of Christ, and filled with the fruits of righteousness which are produced through Jesus Christ to the glory and praise of God.’ [1:9-11] Consequently, since Paul is accustomed to speaking in this way, denoting by the word ‘justification’ first of course the remission of sins, yet at the same time always indicating in addition that imparting of righteousness which God proceeds to work in us by the Spirit, the same Spirit by whom he grants us assurance of the pardon of our sins and of his goodwill towards us, and whom he has established the seal (sphragis) of that pardon–because, I say, Paul customarily speaks in these terms, the majority of the holy Fathers, bearing in mind no doubt the more visible aspect of justification, have taken dikaiousthai, ‘to be justified’, in the sense of ‘to be made righteous… It goes without saying that however great a degree of righteousness the Spirit of Christ might effect in us when we believe, it will nonetheless [not?] be sufficient to merit our being regarded as righteous in God’s sight, for we remain unprofitable servants even when we have fulfilled all his bidding. It was with this in mind that Philip Melanchthon in his highly erudite and devout Commentary on this Epistle rightly condemns those who want to make, “We are justified by faith,’ mean, “Faith is the source or cause that produces other virtues for whose sake we are pronounced righteous,’ or ‘Faith itself is in us a virtue, deserving of God’s approval.’ And he subjoins these godly words: ‘“We are justified by faith,” should be transposed in[to] this sentence: “We are reckoned righteous by mercy.” Similarly, “we are justified by faith alone” means, “We are pronounced righteous by trusting in mercy alone”–so it is only for us to add, ‘as we are given the assurance that we are so pronounced, and thus know by experience this merciful favour of God.’ Surely no godly soul can doubt for a moment that it is through God’s mercy alone and for the sake of Christ’s merit alone that we are justified, pronounced righteous before God, and not because of anything in us at all, however many works of holiness, however genuine our fruits of the Spirit. For who is ignorant of the Scripture, ‘Enter not into judgment with thy servant, for no man living will be justified before thee’? [Ps. 143:2] And in Isaiah, ‘In the Lord shall all the seed of Israel be justified and praised’. [Isa. 45:25]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places of Martin Bucer</cite>, pp. 162–64 in Steven Wedgeworth, ‘Bucer on Double Justification’ (2008) at Wedgewords</span></figcaption>

d not because of anything in us at all, however many works of holiness, however genuine our fruits of the Spirit. For who is ignorant of the Scripture, ‘Enter not into judgment with thy servant, for no man living will be justified before thee’? [Ps. 143:2] And in Isaiah, ‘In the Lord shall all the seed of Israel be justified and praised’. [Isa. 45:25]”

that+is%2C+a+quality+of+discernment%29+whereby+you+may+be+able+to+approve+with+certainty+what+is+excellent%2C+and+to+this+end%2C+that+you+may+be+pure+and+give+offence+to+no+one%2C+thus+being+equipped+for+the+day+of+Christ%2C+and+filled+with+the+fruits+of+righteousness+which+are+produced+through+Jesus+Christ+to+the+glory+and+praise+of+God.%E2%80%99+%5B1%3A9-11%5D+Consequently%2C+since+Paul+is+accustomed+to+speaking+in+this+way%2C+denoting+by+the+word+%E2%80%98justification%E2%80%99+first+of+course+the+remission+of+sins%2C+yet+at+the+same+time+always+indicating+in+addition+that+imparting+of+righteousness+which+God+proceeds+to+work+in+us+by+the+Spirit%2C+the+same+Spirit+by+whom+he+grants+us+assurance+of+the+pardon+of+our+sins+and+of+his+goodwill+towards+us%2C+and+whom+he+has+established+the+seal+%28sphragis%29+of+that+pardon%E2%80%93because%2C+I+say%2C+Paul+customarily+speaks+in+these+terms%2C+the+majority+of+the+holy+Fathers%2C+bearing+in+mind+no+doubt+the+more+visible+aspect+of+justification%2C+have+taken+dikaiousthai%2C+%E2%80%98to+be+justified%E2%80%99%2C+in+the+sense+of+%E2%80%98to+be+made+righteous%E2%80%A6+It+goes+without+saying+that+however+great+a+degree+of+righteousness+the+Spirit+of+Christ+might+effect+in+us+when+we+believe%2C+it+will+nonetheless+%5Bnot%3F%5D+be+sufficient+to+merit+our+being+regarded+as+righteous+in+God%E2%80%99s+sight%2C+for+we+remain+unprofitable+servants+even+when+we+have+fulfilled+all+his+bidding.+It+was+with+this+in+mind+that+Philip+Melanchthon+in+his+highly+erudite+and+devout+Commentary+on+this+Epistle+rightly+condemns+those+who+want+to+make%2C+%E2%80%9CWe+are+justified+by+faith%2C%E2%80%99+mean%2C+%E2%80%9CFaith+is+the+source+or+cause+that+produces+other+virtues+for+whose+sake+we+are+pronounced+righteous%2C%E2%80%99+or+%E2%80%98Faith+itself+is+in+us+a+virtue%2C+deserving+of+God%E2%80%99s+approval.%E2%80%99+And+he+subjoins+these+godly+words%3A+%E2%80%98%E2%80%9CWe+are+justified+by+faith%2C%E2%80%9D+should+be+transposed+in%5Bto%5D+this+sentence%3A+%E2%80%9CWe+are+reckoned+righteous+by+mercy.%E2%80%9D+Similarly%2C+%E2%80%9Cwe+are+justified+by+faith+alone%E2%80%9D+means%2C+%E2%80%9CWe+are+pronounced+righteous+by+trusting+in+mercy+alone%E2%80%9D%E2%80%93so+it+is+only+for+us+to+add%2C+%E2%80%98as+we+are+given+the+assurance+that+we+are+so+pronounced%2C+and+thus+know+by+experience+this+merciful+favour+of+God.%E2%80%99+Surely+no+godly+soul+can+doubt+for+a+moment+that+it+is+through+God%E2%80%99s+mercy+alone+and+for+the+sake+of+Christ%E2%80%99s+merit+alone+that+we+are+justified%2C+pronounced+righteous+before+God%2C+and+not+because+of+anything+in+us+at+all%2C+however+many+works+of+holiness%2C+however+genuine+our+fruits+of+the+Spirit.+For+who+is+ignorant+of+the+Scripture%2C+%E2%80%98Enter+not+into+judgment+with+thy+servant%2C+for+no+man+living+will+be+justified+before+thee%E2%80%99%3F+%5BPs.+143%3A2%5D+And+in+Isaiah%2C+%E2%80%98In+the+Lord+shall+all+the+seed+of+Israel+be+justified+and+praised%E2%80%99.+%5BIsa.+45%3A25%5D%E2%80%9D%0A%0A%E2%80%94+Martin+Bucer%2C+Common+Places%2C+pp.+162%E2%80%9364+in+Steven+Wedgeworth%2C+%E2%80%98Bucer+on+Double+Justification%E2%80%99+%282008%29+at+Wedgewords&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff6b0d135b8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f6b0d135b8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=So%20in%20treating%20of%20our%20restoration,be%20justified%20and%20praised%E2%80%99.%20%5BIsa.%2045%3A25&amp;text=So%20in%20treating%20of%20our%20restoration%2C%20Paul%20intimates&amp;text=of%20Israel%20be%20justified%20and%20praised%E2%80%99.%20%5BIsa.%2045%3A25" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>It is indeed true, that we are justified in Christ through the mercy of God alone; but it is equally true and certain, that all who are justified are called by the Lord, that they may live worthy of their vocation. Let then the faithful learn to embrace him, not only for justification, but also for sanctification, as he has been given to us for both these purposes, lest they rend him asunder by their mutilated faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, Romans 8:13</span></figcaption>

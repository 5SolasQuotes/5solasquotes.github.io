<main class="wrap"><figure class="quote" id="q-9d81b301a0" data-kw="">
<blockquote><p>Do not imagine that no one can please God while he is engaged in military service. Among such was holy David to whom the Lord gave such high testimony. Among such were many just men of that time. Among such, also, was that centurion who said to the Lord: ‘I am not worthy that thou shouldst enter under my roof, but only say the word and my servant shall be healed. For I also am a man, subject to authority, having under me soldiers, and I say to this one: Go, and he goeth, and to another: Come, and he cometh; and to my servant: Do this, and he doth it’; of him the Lord said: ‘Amen I say to you I have not found so great faith in Israel.’ Among such, also, was that Cornelius to whom the angel was sent, who said: ‘Cornelius, thy prayer is heard and thy alms are accepted,’ when he advised him to send to the blessed Apostle Peter, to hear from him what he ought to do. And to summon the Apostle to him he sent a religious soldier.

Among such, also, were those who came for baptism to John, the holy precursor of the Lord and friend of the bridegroom, of whom the Lord said: ‘There hath not arisen among them that are born of women a greater one than John the Baptist.’ When they asked him what they ought to do, he answered them: ‘Do violence to no man, neither calumniate any man, and be content with your pay.’ Obviously, he did not forbid them to serve in the army when he commanded them to be satisfied with their pay.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Boniface, c. 418 (no. 189) in Saint Augustine Letters: Volume IV (c. 420-30), trans. Wilfred Parsons, The Fathers of the Church: A New Translation, vol. 30 (Washington D.C.: The Catholic University of America Press, 1955), p. 268.</cite></span></figcaption>

<blockquote><p>In the second half of the seventeenth century, the Viennese nobility introduced French fashion as a consumption pattern for Austrian elites. Beaver and vicuña hats, made of raw materials from Canada, Peru, West Africa, the Sudan and the Levant, were part and parcel of the new French fashion. French hats were globalized commodities appreciated throughout Europe, although the globalized nature and composition of the product remained completely invisible. This article considers Vienna as a remote area, far from the booming and, in historiography, well-explored European Atlantic ports and capitals, and investigates how Vienna participated in particular global fashion trends. Specifically, it focuses on the social and economic impact of hats as a globalized consumer good on the local Viennese market. Based on an extensive analysis of archival sources, the article sheds light on consumption patterns of elites, practices of the trade in hats, and the consequences of the globalized hat market for local craft production. The globalization of the hat market entailed the immigration of fully trained hatters. Skilled craftsmen from France and Italy introduced new processing methods in Vienna, but this did not result in the dissemination of knowledge. The continuing demand for hats in Vienna stoked a large increase in imports of finished or semi-finished hats, which in turn fostered the emergence of new branches of activity for the accoutrement and selling of these products.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/veronika-hyden-hanscho.html">Veronika Hyden-Hanscho</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Invisible Globalization: French Hats in Habsburg Vienna</cite>, 1650-1750′ Journal of European Economic History (3 / 2016), pp. 11-54</span></figcaption>

</figure><figure class="quote" id="q-173c2383c4" data-kw="">
<blockquote><p>For what more commodity did the Jews receive by King David’s means, then we by our sovereign Lady Queen Elizabeth’s? What enemies, what dangers, what deaths did he escape: from the like whereof the Lorde hath not as often, as wonderfully, preserved her Majesty? The ark of the covenant, wherein the testimony was laid, whereon the mercy-seat was placed, from which the voice of God was heard, at which his name was called upon, whereto they had not sought in the days of Saul, King David brought into his city: and caused the Levites joyfully to play on instruments of music, and lift up their voices at the bringing of it.

Queen Elizabeth hath brought us the body and truth of that whereof his ceremonies were but shadows only, the free use and Christian doctrine of the Gospel, the word of God, the holy Scriptures, the prayers and public service of the highest, all in a language known to all: and hath moved her Subjects to receive these means of their instruction and salvation with Psalms, and hymns, and spiritual songs, singing with a grace in their hearts unto the Lord. [1]

David to those heavenly treasures added earthly, &amp; enriched his kingdom with silver and gold. The purity of coin restored by her Majesty for base and copper monies wherewith she found the realm pestered, doth say no less for her: beside place of silver and gold with other ornaments in so great plenty, as if God would verify according to the letter that which he promised his Church in a mystery, For brass will I bring gold, and for iron will I bring silver. Much did it make for the safety of Jury, that David put garrisons in Syria and Idumaea, countries that bordered upon the North and South thereof much.

But more for England, that Elisabeth (to pass over the fortifying of borders) hath furnished it with all sort of armour, and munition, never more or better: and thereto with a royal navy of vessels, so stately, so strong, so well appointed for wars, that our land is fenced with walls, not only of wood as Gręcia was against Xerxes, but of brass &amp; iron too against foreign enemies. The people of Israel confessed of themselves that they were delivered out of the hand of the Philistines, and other enemies by that King. The wars which our Queen hath had for our safeguard in Scotland and France, even aliens have seen and shewed to the world that they were attached with marvellous honour and advantage to her self &amp; her realm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rainolds.html">John Rainolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon upon part of the eighteenth Psalm preached to the public assembly of scholars in the University of Oxford the last day of August, 1586. by John Rainolds: upon occasion of their meeting to give thanks to God for the late detection and apprehension of traitors, who wickedly conspired against </cite>, (Oxford: Joseph Barnes, 1586), unpaginated.</span></figcaption>

<blockquote><p>One can observe a variety of physical bearing in the prayers of the saints. Moses fell upon his face (Deuteronomy 9:18); David was stretched upon the ground and clothed in sackcloth when he prayed for his infant son (2 Samuel 12:16). Job was seated in ashes and dust (Job 42:6); the Israelites were standing (Nehemiah 9:5); Ezra and Paul were kneeling down (Ezra 9:5 and Acts 20:36). Solomon prayed on bended knees and with hands outstretched (2 Chronicles 6:13); Christ with eyes lifted up towards heaven (John 17:1), while the tex-collector prayed with his eyes cast down to the earth (Luke 18:13). And while men pray with their heads uncovered, women do so with covered head, according to the apostle’s instruction (1 Corinthians 11:4).† † The annotation on the verse in the Dutch Statenvertaling, of which Walaeus possibly was the author, states that the uncovering of the head at that time was a sign of power and sovereignty, whereas today those who are in authority shall keep their heads covered and those who are subject to them shall uncover their heads: ‘But in this matter one must always regard the use in different times and countries and what is correct and build up… A comparison of all these things with each other makes it clear that a certain amount of freedom was given for various gestures, but that at the same time we should adopt the kind of postures that are best suited to every nation’s own customs and that promote rather than hinder the attentiveness of our soul. We should avoid every form of vanity in those postures, but also carelessness and pride; and the gestures should convey, without pretense and in a most suitable manner, the inner disposition and ardent longing of those who are praying. Yet the saints most frequently employed the bending of the knees,‡ and so that gesture was sometimes used in the absolute sense for the prayer itself, as one can see from Romans 11:4 and 14:11, and likewise in Ephesians 3:14. And in the same vein the apsotle links the stretching forth of lifting up of hands to the injunction that they should prayer everywhere (1 Timothy 2:8). ‡ In 1610 the consistory of Middelburg–where Walaeus served as a pastor from 1605 to 1619–admonished the people to humble themselves bodily during the public prayers by kneeling and folding their hands… According to Van Deursen that was rather common at the time…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ac4752d8cf" data-kw="">
<blockquote><p>We will call then the true and pure Churches all those wherein we find the Word of God and sacraments purely and lawfully administered, that is to say (as Cyprian says) according to the institution of the Lord. And we nothing doubt to communicate with them, and that God is there president, howsoever in some certain points of doctrine there have been some error, and in the outward policy some abuse and corruption, and impurity in manners: for it behooves that always we resort thither, when the chief points of the foundation of our salvation be there truly taught, seeing we are men, and the Churches are compounded of men…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philippe de Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Notable Treatise of the Church in which are handled all the Principal Questions that have been moved in our Time concerning that matter</cite>, [in controversy with Romanism] (London: Barker, 1579), ch. 2, n.p.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b016abb8db" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-stock.html">Richard Stock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned &amp; Very Useful Commentary upon the Whole Prophesy of Malachi</cite>, (London: T.H., 1641), on ch. 1, verse 9, pp. 177</span></figcaption>

</figure><figure class="quote" id="q-4ece83658b" data-kw="">
<blockquote><p>3. That place must needs be holy where the Lord dwells as a Master in his house, teaching, ordering and supplying all necessaries. Where Christ, the holy Son of God, walks in the midst of the seven golden candlesticks, being conversant among the flocks of shepherds… Surely, this is Bethel, the house of God, and the gate of Heaven. This teaches us not to despise our [Anglican] assemblies, nor to think our churches unholy for some corruptions. Look upon Jerusalem, Mt. 23:37; you shall see the eleven tribes were apostates, there were in it dumb dogs, Isa. 56:10, there were scribes and Pharisees, hypocrites. At this time the doctrine of the Law was corrupted by the false glosses of the Pharisees, and the Temple was almost a den of thieves, full of buyers and sellers. Yet for all this, the evangelist calls it ‘the holy city,’ even when it had more corruptions in it than the Church of England has at this day. Why?:

1. Because there the service of the true God was set up in the Temple, the Word preached, sacrifices offered, and the meetings of the Church of God.

2. Because as yet they had not received a bill of divorce. Have we not the Word truly preached, and the sacraments for substance truly administered? And for discipline, I will say, I wish we had the execution of so much as the Church allows. Or, when did the Lord give us a bill of divorce? Or, what Church has convinced us that we cannot be acknowledged for a true Church? If they say, they of the Separation have, I answer:

1. They have labored to discover some errors, but none fundamental in us, nor without as many in themselves.

2. We… must not think it strange if some unstable persons forsake our communion, since in the golden and flourishing age of the apostles there were some such, Heb. 10:25.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-taylor.html">Thomas Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Combat &amp; Conquest: or the Lion of the Tribe of Judah Vanquishing the Roaring Lion, assaulting Him in three most fierce and hellish temptations, expounded</cite>, ... (Cambridge: Legge, 1618), verses 5-6, pp. 165-66</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<main class="wrap"><figure class="quote" id="q-810a0efac6" data-kw="">
<blockquote><p>As you allow me to speak freely, I solemnly assure you I have been most scrupulously adverse from strife and contention. I have taught nothing which did not naturally arise from the passage on which I was lecturing; yea, when occasions of speaking on the habits [vestments] have come in my way, I have ever avoided them. But I do not deny that I have said our ministry [in the Church in England] has deviated from that of the primitive and apostolic church, to the purity of which I wished ours to be conformed: but this I said in so candid and modest a way, that none but ignorant or malicious persons could find fault. Yet I hear that I am accused to your excellency.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As quoted by Alexander Grosart in the biographical preface</cite>, p. ix, to A Commentary upon the Epistle… to the Colossians</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7ae450d63b" data-kw="">
<blockquote><p>Liturgical vestments that distinguished the priest from the community are attested only from the fourth century onward. There are no guidelines or regulations given in the New Testament. Moreover, the early Christian communities did not place themselves in the tradition of the Old Testament priesthood and its cultic dress… As the customary everyday dress changed, the clergy held on to the old style of dress… This older form of dress… served to distinguish the clergy from the other members of the community. In Rome as early as the sixth century it seems that there existed blessings for liturgical vestments. From the ninth century onward prayers were said as the vestments were put on… Liturgical vestments were given ever new allegorical interpretations reflecting salvation history (Rabanus Maurus [780-856] and Amalar of Metz [775-850])… …In the adiaphorist [indifferent] controversy Zwingli, Calvin, the Anabaptists, and Matthias Flacius Illyricus [a Lutheran] and his followers among other things called for doing away with liturgical vestments. As early as the first Zurich Disputation of 1523 Zwingli rejected liturgical vestments; he allowed for them in his work De canone missae epicheiresis, which appeared that same year; finally, toward the end of the year, presumably under external pressure, he adopted a stance against vestments. In the Zurich regulations of 1535 he disapproved of external adornments such as silk, gold and silver in the churches on the grounds that the early church not only did not possess these things, but even rejected them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oxford-encyclopedia-of-the-reformation.html">Oxford Encyclopedia of the Reformation</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Oxford Encyclopedia of the Reformation</cite>, (1996), ‘Clerical Vestments’, vol. 1, pp. 366-68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/vestments-and-dress.html">Vestments and Dress</a></span></div>

</figure><figure class="quote" id="q-4d8a44d880" data-kw="">
<blockquote><p>§21. 13. God that has required us to celebrate his worship, does imply that we must do it in a decent habit: Nakedness is a shame: Clothing we must wear: but He has not told us what it must be: Whether linen or woolen: whether black or white: or of what shape and fashion; This therefore is left to human prudence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, p. 405</span></figcaption>

</figure><figure class="quote" id="q-c47959bd3f" data-kw="">
<blockquote><p>In Scotland it appears to have been the regular custom for ministers to wear a gown when conducting divine service. The cassock also was in frequent use, but this is not surprising since it was not a liturgical vestment, but the usual out-of-doors dress of the ministry. In England, however, the Puritans appear to have discarded the cassock, whilst there is little evidence to show that the early Puritans wore gowns.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horton-davies.html">Horton Davies</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 46-48 in Ch. 4 of The Worship of the English Puritans (Soli Deo Gloria, 1997), p. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/vestments-and-dress.html">Vestments and Dress</a></span></div>

</figure><figure class="quote" id="q-cb9bb6fc0d" data-kw="">
<blockquote><p>Although a thing may have its origin in Scripture, if it is to be indifferent, it is nevertheless required that there be no positive precept by which it is ordered, nor any negative one by which it is prohibited, but that it be left to us as something free, to use or not to use, as shall seem useful… Indifferent things must have a manifest and open usefulness, known in the Church, lest they may seem to be received for no purpose, or to be forced into the Church by treachery and deceit… power is given to edification and not to destruction (1 Cor. 14)… …the writings of the apostles and evangelists, which place before us most clearly the annulment of the rituals of Aaron, his ceremonies, priesthood, images, and peculiar figures, and the institution of the new and perfect priesthood of Christ. They must demonstrate to us from these books the grounds and occasion when some peculiar and special vestments should be worn in the ministry, for the adornment of the ministry itself, or for the preferring of its decorum, or for some distinctive mark, by which the minister can be distinguished from the people, as once was ordained by the Lord in the ministry of Aaron’s priesthood. But the statutes, canons and decrees of the apostles and evangelists make no mention of this matter… …What is prohibited by God can in no way be indifferent, as we have given warning above. For this is the doctrine of Paul in Gal. 2, that whatever re-establishes things that have been annulled in Christ, transgresses the will of God… Neither is it without its mystery that our Saviour Jesus Christ hung naked from the Cross. For Aaron’s priests used vestments in their own ministry because the reality of their priesthood, Christ Himself, had not yet come. But when Christ Himself was to be sacrificed, stripped of all clothing, displaying in this way his own priesthood, which since He was Reality itself, now had no further need of veils or semblances…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-hooper.html">John Hooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Regulative Principle &amp; Things Indifferent’</cite>, (1550) in ed. Iain Murray, The Reformation of the Church: a Collection of Reformed &amp; Puritan Documents on Church Issues</span></figcaption>

<blockquote><p>(1) One objection is derived from the veracity of God… Furthermore, it should be borne in mind that God does not offer sinners the forgiveness of sins and eternal life unconditionally, but only in the way of faith and conversion; and that the righteousness of Christ, though not intended for all, is yet sufficient for all.</p></blockquote>

<blockquote><p>What are the fruits of this free grace of God with respect to the gift of Christ for us and to us, as related in this scripture-testimony… [3.] That God had made Him a little lower than the angels, in his being made man, that He might suffer and humble Himself to death. [4.] That God crowned the human nature of Christ with glory and honour… that by his sufferings He might make satisfaction, tasting death for every man, sensibly feeling and undergoing the bitter agonies of that shameful, painful, and cursed death of the cross, hereby putting all mankind into a new state of trial.</p></blockquote>

</figure><figure class="quote" id="q-a7ad219589" data-kw="">
<blockquote><p>As for that collaterality which is objected, I answer, the civil and ecclesiastical power, if we speak properly, are not collateral. 1. They have no footing upon the same ground: there may be many subject to the magistrate, who are no church members, and so not under the spiritual power; and where the same persons are subject to both the powers, there is no more collaterality, in this case, nay, not so much, as is betwixt the power of a father in one man, and the power of a master in another man, when both powers are exercised upon the same man who is both a son and a servant. 2. Powers that are collateral, are of the same eminency and altitude, of the same kind and nature; but the civil power is a dominion and lordship; the ecclesiastical power is ministerial, not lordly. 3. Collateral powers do mutually and alike exercise authority over each other respectively. But, though the magistrate may exercise much authority in things ecclesiastical [circa sacra], church officers can exercise no authority in things civil. The magistrate’s authority is ecclesiastical objective, though not formaliter: but the church officer’s authority is not civil so much as objective, not being exercised about either civil, criminal, or capital cases. 4. Collateral powers are subordinate to, and derived from the supreme and original power, like two branches growing out of the same stock, two streams flowing from the same fountain, two lines drawn from the same center, two arms under the same head; but the power of the magistrate is subordinate unto, and depends upon the dominion of God the Creator of all: the power of church officers depends upon the dominion of Christ, the Mediator and King of the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, (1646) | Part 2, ch. 8, p. 120</span></figcaption>

</figure><figure class="quote" id="q-67cb1ff92e" data-kw="">
<blockquote><p>For this properly means to die for another: to liberate another from death by one’s own death, that he may live. Thus David in his lamentation exclaims: “My son Absalom: who shall give me to die for thee?” meaning, would that by my death I could redeem thy life, or liberate thee from death (2 Sam. 18:33). In the same way Christ is said to have” died for us when we were enemies” and “ungodly”: that is, to have liberated us, being enemies and ungodly, from death by his own death (Rom. 5:6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Oration on the Synod of Dort &amp; the Remonstrants’ Articles’</cite>, Article 2, ‘Concerning the Death of Christ for All’ in ‘Oration on the Synod of Dort &amp; the Remonstrants’ Articles’ trans. AI (1619; Monergism, 2026), pp. 24-27, p. 25</span></figcaption>

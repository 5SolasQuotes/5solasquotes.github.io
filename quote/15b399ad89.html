<blockquote><p>As every law whatsoever is either Divine or human, and every Divine law either published in scripture or implanted in nature; so every law that is published in scripture is either ceremonial, judicial, or moral: which distinction seems to be intimated in these words; Now these are the commandments, statutes, and the Judgments, which the Lord commanded to teach you, Deut. vi. 1: where by commandments we may understand the moral, by statutes the ceremonial, and by judgments the judicial law of God. Now what we ought to believe concerning these three laws is here set down in this part of the article [7 of the 39 Articles].

First, concerning the ceremonial law, it is here said, Although the law given from God by Moses, as touching ceremonies and rites, do not bind Christian men, implying, that that law is now of no force and virtue in obliging us to obedience, as it did the Jews: where we may briefly consider, first, what this law was; secondly, how it appears to be now disannulled. As for the first, what this law was, it is plain that it was that law whereby God was pleased to determine the outward circumstances of his own worship, and the outward performances of his people’s lives, containing several precepts:

1st, concerning their sacraments, viz. circumcision, and the eating of the paschal lamb; to which may be added also the eating of the shewbread, and their purification from several uncleannesses, as when any one was a leper, had touched a dead body, or the like.

2dly, Concerning their sacrifices; whether sin-offerings, or heave-offerings, or burnt-offerings; whether offered by the high priest only, by the ordinary priest, by all the people, or private persons; as also whether they were of living creatures, as goats or kids, rams or lambs, heifers or calves, doves or turtles; or inanimate, as bread or wine or oil.

3dly, Concerning their holy things: as, first, their holy places; as the tabernacle and temple, the one carried up and down, the other fixed, divided into three parts; the holy of holies, where the high priest only came, and that but once a year; the sanctuary, where the ordinary priests went continually; and the outward court, where the people stood: secondly, holy times; as their sabbaths, new moons, passover, pentecost, feast of tabernacles, the feast of in-gathering, the feast of trumpets, the day of atonement, Lev. xxiii.; the sabbatical year also, and the year of jubilee.

4thly, Concerning outward observances in priests or people; as, not to eat such and such flesh, not to wear such and such clothes, not to plough with an ox and an ass together, and such like.

Thus we see what these ceremonies and rites were. Now, secondly, that they are not obligatory unto us, as they were to the Jews, appears from the determination of that canonical synod holden by the apostles themselves at Hierusalem. Acts xv. where this question being debated, whether circumcision, and so the other ceremonies of the law should be enjoined the Gentiles, they determined it in the negative, that the Gentiles which were turned to God should not be troubled with these things. Hence it is that we read St. Paul, writing to the Colossians, Let no man therefore judge you either in meat or drink, or in respect of a holy day, new moon, or sabbath days, Col. ii. 16; and to the Galatians, If you be circumcised, Christ profiteth you nothing, Gal. v. 2. And he acquaints the Hebrews with the reason of it; For the priesthood being changed, there is made of necessity a change also of the law, Heb. vii. 19, viz. the ceremonial law, which being at the first instituted and imposed only until the time of reformation, Heb. ix. 10, even until the coming of Christ, who was the substance of those shadows and the truth of those types, there was no need of them when once himself was come, nor indeed any law for them.

For seeing the law enjoined them for no longer a time than till Christ was come, and the time in his coming being expired, the law enforcing them must needs be disannulled. So that now we are no ways bound to use any of the aforesaid ceremonies, they being no furtherances now, as they were under the law, but rather hindrances of our faith in Christ the substance: but they are to us Christians as if they had never been imposed at all upon the Jews, even without any binding or obligatory force at all in them, as the Fathers taught of old.</p></blockquote>

<blockquote><p>Christ is also the legislative Head of the Church. All her laws and ordinances are of Christ’s appointment. The ordinances of the Mosaic economy were prescribed by the Redeemer (Acts vii. 38); and when these had served their object, the same power which instituted those ancient rites abolished them, and in their stead appointed the precious ordinances of the New Testament (Matt. xxviii. 19, 20). The legislative power of Christ is completely ignored by the Church of Rome; for that church has not only repealed and set aside the laws and institutions which Christ has appointed, but she has also instituted laws and ordinances in addition, and in flat opposition, to the laws and ordinances appointed by the Great Lawgiver. The Church of England also has, in the most unwarrantable manner, prescribed holidays, introduced the rite of confirmation, and required the sign of the cross, and godfathers and godmothers in baptism, &amp;c.</p></blockquote>

<blockquote><p>Question 6. Whether absolute and unlimited power of royalty be a ray and beam of divine majesty immediately derived from God? Answer. Not at all. Such a creature is not in the world of God’s creation. Royalists and flatterers of kings are parents to this prodigious birth. There is no shadow of power to do ill in God. An absolute power is essentially a power to do without or above law, and a power to do ill, to destroy; and so it cannot come from God as a moral power by institution, though it come from God by a flux of permissive providence; but so things unlawful and sinful come from God.</p></blockquote>

<blockquote><p>After He had washed their feet, and had taken his garments, and was set down again, He said unto them, ‘Know ye what I have done to ye, ye call me Master and Lord, and ye say well, for so I am; if I then your Lord and Master have washed your feet, ye also ought to wash one another’s feet, for I have given you an example that ye should do as I have done to you.’ ‘Tis evident that it is the moral duty of brotherly love, in condescension, and mutual helpfulness to be expressed in all necessary offices as occasion doth require, that is the thing which Jesus Christ here enjoins his disciples, and leads them to by his own example in an office of love then in use in those parts. The same is to be said of the holy kiss, Rom. 16:16 which was a temporary occasional token of entire love; which may in answer thereunto, be expressed by any sober usage of salutation amongst men to the same purpose. But the things themselves were not instituted for any continuance, nor do represent any special grace of the New Covenant, which is inseparable from every institution of Gospel worship properly so called. Common usages or practises therefore, directed to be used in a due manner, and unto a proper end, where they are used, make them not institutions of worship. Neither have they in them as so commanded or directed, any one thing that concurs to the constitution of a Gospel-Ordinance: for neither had they their rise in the authority of Christ, nor is any continuance of them enjoined, nor any promise annexed unto them, nor any grace of the New Covenant represented or exhibited in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John</cite>, 13:12-15</span></figcaption>

uote/fde2d15b26.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-holy-kiss-foot-washing-anointing-with-oil/#:~:text=After%20He%20had%20washed%20their%20feet,Covenant%20represented%20or%20exhibited%20in%20them&amp;text=After%20He%20had%20washed%20their%20feet%2C%20and%20had&amp;text=the%20New%20Covenant%20represented%20or%20exhibited%20in%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The [opposing] Doctor takes needless pains to prove sitting in the act of receiving the sacramental elements of bread and wine, not to be necessary. For we hold not sitting in special [to be] absolutely necessary in the act of receiving, but [rather] a table-gesture in general, whether sitting or standing about the table, we hold necessary; howbeit not to the essence, yet to the right ministration of the sacrament. And of these two table gestures, we hold sitting most aggreeable to the institution: for Christ setting down before his apostles, a pattern, conformed whereunto they should celebrate that holy action thereafter, celebrated the same sitting: and this gesture ougt not to be changed, no not in another table gesture without some urgent necessity. To stand at the minister’s hand [giving the elements], or to take in passing by, we account [to be] no table-gesture; for there is no use in that case more of a table-gesture, than if it were a dressor, or cup-board; and that kind of gesture takes away the distribution of the communicants [between themselves], which is not taken away by standing about the table. … Casaubonus does acknowledge the gesture of Christ and his apostles at the Paschal supper to have been not a simple lying, but a gesture consisting partly of sitting, and lying… Seeing therefore the Hebrew, Chaldaic and Rabbinical writers do interpret the one word indifferently by the other [whether sitting or lying], our vulgar translators [of the Bible] have done right in expressing Christ’s gesture by the word ‘sitting’. The Doctor himself at Perth Assembly [1618] confessed that our gesture of upright sitting and his apostles’ gesture at the Paschal supper were analoga [analogous]. If Christ had celebrated the Paschal supper in the days of David [1 Sam. 4:18; 20:25-34] or Solomon [1 Kings 2:19; 10:19; 2 Kings 4:10; 2 Chron. 9:18], before the custom of sitting at table in beds entered among the Jews [as a cultural custom], He had used the gesture of upright sitting, as the Jews did then and as the Jews do at this day when they celebrate the Paschal supper.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Solution of Doctor Resolutus, his Resolutions for Kneeling</cite>, ([Amsterdam, 1619]), ch. 1, ‘A Table Gesture is Necessary’, pp. 5-6</span></figcaption>

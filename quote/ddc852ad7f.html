<blockquote><p>Doctrine: Sound knowledge and belief joined with sovereign fear and love, and both these crowned with sincere repentance and obedience, guided by the light and line of true religion, is the only way to true happiness. They are all of them in their places of absolute necessity, and without any one of them a man cannot attain to that happiness that we aim at, etc. 2. All these are required absolutely; take them divisively, by themselves, etc. Knowledge and faith are necessary as the very foundation and groundwork of the whole building; repentance and obedience, they are necessary too, as the very issue and product of all, as the evident demonstration of the other. Love and fear, those holy affections of the soul, they are necessary too as the very vital things, wherein I conceive grace does principally consist, etc. But yet if we speak comparatively, which of all these were the most necessary, and wherein lies the principality of these; I conceive in this former respect every one of them may claim a principality, and go for a principal. But yet simply and absolutely the most characteristical of all these is the qualification of the heart and soul, the changing and turning of the affections, when the bias of them is set Godward and heavenward, there lies the principal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-stoughton.html">John Stoughton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as given in Richard Baxter, Richard Baxter’s Confession of his Faith</cite>, … (London: 1655), ch. 3, pp. 397-98 Stoughton (1593?–1639) | Sermon 7, p. 51</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-24a4706bdb" data-kw="">
<blockquote><p>From this come three periods of justification that should be diligently observed here, namely 1: The period of establishment, by which man is first justified: in this occasion not only is efficacy of works excluded for acquiring justification, but so is the very presence of these works in so far as God justifies the sinner and the wicked. 2: The period of continuation: in this occasion, although no efficacy of good works is granted for justification, the presence of these same works, nevertheless, is required. And it is probably in this sense that James denies that we are justified by faith along but he requires works in addition. And lastly 3: The period of consummation in which the right unto eternal life, granted under the first period and continued under the second, is advanced even to the possession of eternal life: in this occasion not only is the presence of good works required, but also, in a certain sense, their efficacy, in so far as God, whose law we attain just now through the merit alone of Christ, does not want to grant possession of eternal life, unless [it is] beyond faith with good works previously performed. We received once before the right unto eternal life through the merit of Christ alone. But God does not want to grant possession of eternal life, unless there are, next to faith, also good works which precede this possession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As given in Mark Jones, Antinomianism: Reformed Theology’s Unwelcome Guest</cite>, (P&amp;R, 2013)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

edbooksonline.com/good-works/#:~:text=From%20this%20come%20three%20periods%20of,good%20works%20which%20precede%20this%20possession&amp;text=From%20this%20come%20three%20periods%20of%20justification%20that&amp;text=faith%2C%20also%20good%20works%20which%20precede%20this%20possession" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ba5c800737" data-kw="">
<blockquote><p>II. There are three principal opinions about the necessity of good works…; The third is that of those who (holding the middle ground between these two extremes) neither simply deny, nor simply assert; yet they recognize a certain necessity for them against the Libertines, but uniformly reject the necessity of merit against the Romanists. This is the opinion of the orthodox.

III. Hence it is evident that the question here does not concern the necessity of merit, causality, and efficiency—whether good works are necessary to effect salvation or to acquire it by right. (For this belongs to another controversy, of which hereafter). Rather the question concerns the necessity of means, of presence and of connection or order—Are they required as the means and way for possessing salvation? This we hold.

IV. Although the proposition concerning the necessity of good works to salvation (which was thrust forward in a former century by the Romanists under the show of a reconciliation in the Intermistic formula, but really that imperceptibly the purity of the doctrine concerning justification might be corrupted) was rejected by various Lutheran theologians as less suitable and dangerous; nay, even by some of our theologians; still we think with others that it can be retained without danger if properly explained. We also hold that it should be pressed against the license of the Epicureans so that although works may be said to contribute nothing to the acquisition of our salvation, still they should be considered necessary to the obtainment of it, so that no one can be saved without them–that thus our religion may be freed from those most foul calumnies everywhere cast mot unjustly upon it by the Romanists (as if it were the mistress of impiety and the cushion of carnal licentiousness and security)… VII. And as to the covenant, everyone knows that it consists of two parts: on the one hand the promise on the part of God; on the other the stipulation of obedience on the part of man…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol 2, 17th Topic, Third Question: ‘The Necessity of Good Works; Are good works necessary to salvation? We affirm., p. 703</span></figcaption>

<blockquote><p>14. Christians having sorrow or serious regret for sin in them, and being in earnest conflict with the law in their members, with the lusts, and irregular passions, and inordinate affections of the flesh, their way of walking cannot (as to their ordinary and habitual course) be after the flesh; nor can they be the slaves of sin; but being made free from sin, and become servants to God ([Rom.] ch. 6:22), they walk after the Spirit, have their fruit unto holiness (which is the necessary and certain characteristic of the true Christian), and the end everlasting life; to which end and final issue holiness is indispensably necessary–though, however necessary, yet eternal life is not proper wages which men win by their holiness, but is the gift of God through Jesus Christ.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“14. Christians having sorrow or serious regret for sin in them, and being in earnest conflict with the law in their members, with the lusts, and irregular passions, and inordinate affections of the flesh, their way of walking cannot (as to their ordinary and habitual course) be after the flesh; nor can they be the slaves of sin; but being made free from sin, and become servants to God ([Rom.] ch. 6:22), they walk after the Spirit, have their fruit unto holiness (which is the necessary and certain characteristic of the true Christian), and the end everlasting life; to which end and final issue holiness is indispensably necessary–though, however necessary, yet eternal life is not proper wages which men win by their holiness, but is the gift of God through Jesus Christ.”

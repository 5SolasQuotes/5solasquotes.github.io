<blockquote><p>The author [Baxter] thought it not unfit here to annex the description of that order and discipline which is exercised by him, with his assistant fellow-pastors, in the parish-church of Kidderminster, in Association with many pastors of those parts who have agreed to exercise so much of the ministerial office as by the consent of the episcopal, presbyterian and congregational [parties] belongs to them. Which, being published:

1. May prevent men’s injurious misreports of our associations and discipline, which they may be drawn to by fallacious fame.

2. And may be an example for those churches that by the magistrates are left at liberty to worship God in that communion and order which they judge most agreeable to the Word of God and the universal consent and practice of the primitive Church. .

I. We are willing to teach all in our parish, the doctrine of life, that are willing to learn: and desire them all to hear the Word publicly preached and to come to us to be catechized or instructed.

II. We own all those as visible Christians and members of the universal Church that make a credible profession of Christianity and destroy it not by heresy or ungodly lives.

III. So many of these as also consent to hold communion with this church as members of it, submitting to the ministers and discipline of Christ, we shall esteem our flock and special charge, and faithfully perform the duties of our office for their good, as we are able.

IV. We desire that all the youth of the parish will learn the principles of the Christian religion: and as soon as they understand it, and are heartily resolved to give up themselves to God in Christ through the Spirit, and to lead a holy life, that they will come and acquaint us with their faith and resolution; and before the Church will make a solemn profession thereof, and give up themselves to God in the personal owning their baptismal Covenant; either reciting the foregoing creed or Profession, or, if they are unfit for public speaking, by consenting when we propound it to them, or by any other fit expressions. That so we may publicly pray for their confirmation; and if they consent also to hold communion with this church, we may know them as our charge and register their names.

V. Those parishioners that desire us to baptize their children, or to be themselves admitted to the Lord’s Supper, and are not members of this church (because they will not), we desire to come to us, some days before that so we may be satisfied of their faith and life: And if they seem true Christians, and either bring a certificate that they are members of any other church, with (which we are to hold Communion, or show that it is not from ungodliness that they refuse to live under order and discipline, we shall baptize their children, and occasionally admit them to our communion. But if they are scandalous, we shall require them first to profess their serious repentance: And if they return to scandal, we shall after stay till we see their reformation (or of one of the parents in case of baptism).

VI. If any member of this Church do differ from us about the gesture in the Lord’s Supper (or any such circumstance) we desire them first to come to us and hear our reasons: and if we cannot satisfy them, we will not hinder them from receiving it in any decent gesture they desire.

VII. All members of the church must ordinarily hold communion with it in the Lord’s Supper and all ordinances: and if a brother grossly offend, they must orderly and prudently admonish him; and if he hear them not, tell the church [Mt. 18].

VIII. Once a month we have a meeting of the magistrates, ministers, deacons and above twenty persons chosen annually by the church, as their trustees or deputies: Here the offenders must be accused, and heard, and dealt with before the case be opened in the church. And any that are justly offended with any member, may have church-justice: the magistrates’ presence being only ad melius esse [to the better well-being] and the chosen trustees or deputies being no ecclesiastical officers, nor pretending to divine institution as such: but only the fittest of the people chosen to do those things which belong to the people (who cannot all so frequently meet) and having no authoritative ruling votes.

IX. Those that repent not upon public admonition must be cast out of our communion and avoided as heathens: But those that are penitent, must be absolved, and lovingly received.

X. If any of our people be offended at anything in our doctrine or life, we desire them before they vent their offense behind our backs, to come and lovingly tell it us, and hear us speak. And if we do not satisfy them, we desire them to open the matter before the ministers of this Association, who are here assembled every month. And we shall before them be responsible for our doctrine, our administrations and our lives. (As we are also willing to be to the magistrate, who only has the power of the sword, even over the pastors of the church, and whom in all things lawful we must obey, and not resist.)</p></blockquote>

<blockquote><p>‘Private interpretation,’ [2 Pet. 1] is either Praeter fundamentum veritatis, ‘by the ground of verity,’ or Praeter fundamentum salutis, ‘by the ground of salvation;’ circa fundamentum salutis, ‘about the ground of salvation;’ or contra fundamentum salutis, or ‘contrary to the foundation of salvation’.

1. Praeter fundamentum veritatis, is when an interpretation agrees not with the place intreated, although it be not contra fundamentum salutis: these the Greeks called [Greek] aliena a proposito, out of purpose: as those who seek gold in the earth, if they miss the vein, they lose the gold (Chrysostom): so these who interpret Scripture, besides the meaning of the place intreated, they miss the sense of the Scripture.

2. Praeter fundamentum salutis, is that interpretation which is not only besides the verity, but also besides the foundation, Christ: this by the apostle is called hay and stubble, it shall burn, but the builder may be safe. (1 Cor. 3:15)

3. Circa fundamentum salutis, is that interpretation, which weakens the foundation, although it raze it not directly.

4. Contra fundamentum salutis, is that interpretation, which razes the foundation, ‘not holding the head Christ’. (Col. 2:19) … True interpretation is that interpretation which is super fundamentum, upon the foundation, and gives the true interpretation of the place intreated. The doctors of the Jews were called bonim, aedificantes, ‘builders,’ because they were bound to build upon the foundation. (Mk. 12:10)</p></blockquote>

1%2C+paragraph+5%2C+pp.+30-31&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5e965e2a11.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5e965e2a11.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-fundamental-secondary-tertiary-teachings-of-christianity/#:~:text=Private%20interpretation%2C%E2%80%99%20%5B2%20Pet.%201%5D%20is,build%20upon%20the%20foundation.%20%28Mk.%2012%3A10&amp;text=Private%20interpretation%2C%E2%80%99%20%5B2%20Pet.%201%5D%20is%20either%20Praeter&amp;text=bound%20to%20build%20upon%20the%20foundation.%20%28Mk.%2012%3A10" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-831c2c1777" data-kw="">
<blockquote><p>Lastly, there may be corruption in the translation of the Word and in the Church’s interpretation of the Word, and so false doctrines arise and be maintained; yet not being in the fundamental points of the Covenant before mentioned, the Church may be a true church, though corrupted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Plain Evidences the Church of England is Apostolical, the Separation Schismatical</cite>, ... (London: 1610) | 8th Error of the Brownists, pp. 277-88</span></figcaption>

</figure><figure class="quote" id="q-9408b2336d" data-kw="">
<blockquote><p>II. In dealing with adversaries, or others, about controverted truths, it were good for their conviction to make use of some known, uncontroverted principle, and thence deduce what they would have received; for where there is no agreement in any common notion or principle, there is no hope of getting truths received: therefore Paul, in debating this matter [Romans 7:1-3], doth wisely lay down, in the first place, what they received as truth, and did not doubt of saying, Know ye not; which is as much as if he had said, You know this, and cannot deny it, viz. That the law hath dominion over a man, as long as he liveth.

III. It is not the most gaining way, in dealing with adversaries of truth, to contemn their parts and abilities, and to speak of them in an undervaluing manner; but rather on the contrary, to acknowledge their parts and knowledge, and make use of that for their conviction, as the apostle doth here; he does not lightly them, but says, they knew the law.

IV. In all our attempts ot gain folks to the truth, we should still labour to gain their affection; and we should so carry ourselves, as they may be convinced of our love and tender respect towards them, and that we seek not to shame, or rub any affront on them, but intend, out of a friendly and brotherly manner, to gain them; for Paul doth insinuate himself thus upon these here, by stiling them brethren: thus he laboured to conciliate their favour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Paul the Apostle to the Romans</cite>, p. 221</span></figcaption>

</figure><figure class="quote" id="q-454f9c5b4b" data-kw="">
<blockquote><p>3rd Argument. If Paul do not only not command separation in the Church of Corinth, but also command and approve their meeting together in Church-communion, 1 Cor. 5:4; 11:18, 20-22; 14:23; 16:2, where there was: Schisms and contentious, 1 Cor. 1:12-13, envying and strife, 1 Cor. 3:3, incest, and incest tolerated, such as is not named amongst the gentiles, 1 Cor. 5:1, going to law with their brethren for gain before infidels, 1 Cor. 6, harlotry, vv. 15-16, eating at the idols’ table, 1 Cor. 8, keeping fellowship with devils, 1 Cor. 10:20-22, coming to the Lord’s Table drunken, 1 Cor. 11:21, eating and drinking damnation, vv. 29-30. A denying of a fundamental point of faith, the resurrection of the dead, and that with scoffing at it, 1 Cor. 15:35, murdering of weak souls, whom Christ had died for, 1 Cor. 8:12-13, Paul’s name despitefully traduced, 2 Cor. 10:8-9, etc. Then it is unlawful to separate from the pure worship of God, because a Church is not constituted of visible saints and a people all taught of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London: Bartlet, 1642), ch. 10, ‘Whether or not it be lawful to separate from a true Church visible, for the corruption of teachers… where faith is begotten by the preaching of professed truth?’, pp. 141-42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<main class="wrap"><figure class="quote" id="q-b324cf7a33" data-kw="">
<blockquote><p>For God so loved the world that He gave His only begotten Son, that whoever believes in Him should not perish but have everlasting life. (John 3:16)

That whosoever believeth on him may not perish. It is a remarkable commendation of faith, that it frees us from everlasting destruction. For he intended expressly to state that, though we appear to have been born to death, undoubted deliverance is offered to us by the faith of Christ; and, therefore, that we ought not to fear death, which otherwise hangs over us. And he has employed the universal term whosoever, both to invite all indiscriminately to partake of life, and to cut off every excuse from unbelievers. Such is also the import of the term World, which he formerly used; for though nothing will be found in the world that is worthy of the favour of God, yet he shows himself to be reconciled to the whole world, when he invites all men without exception to the faith of Christ, which is nothing else than an entrance into life.

Let us remember, on the other hand, that while life is promised universally to all who believe in Christ, still faith is not common to all. For Christ is made known and held out to the view of all, but the elect alone are they whose eyes God opens, that they may seek him by faith. Here, too, is displayed a wonderful effect of faith; for by it we receive Christ such as he is given to us by the Father — that is, as having freed us from the condemnation of eternal death, and made us heirs of eternal life, because, by the sacrifice of his death, he has atoned for our sins, that nothing may prevent God from acknowledging us as his sons. Since, therefore, faith embraces Christ, with the efficacy of his death and the fruit of his resurrection, we need not wonder if by it we obtain likewise the life of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the gospel according to John</cite>, trans. William Pringle (Geneva, 1553) in Calvin’s commentaries (22 vols, Grand Rapids, 1993), xvii, 124-5.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-280ccb1fb4" data-kw="foreknew believe election grace">
<blockquote><p>Assuredly, if this were said because God foreknew that they would believe, not because He Himself would make them believers, the Son is speaking against such a foreknowledge as that when He says, &quot;Ye have not chosen me, but I have chosen you;&quot; when God should rather have foreknown this very thing, that they themselves would have chosen Him, so that they might deserve to be chosen by Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Predestination of the Saints, ch. 17</span></figcaption>

<blockquote><p>Let us then draw near to Him with holiness of spirit, lifting up pure and undefiled hands unto Him, loving our gracious and merciful Father, who has made us partakers in the blessings of His elect. For thus it is written, “When the Most High divided the nations, when He scattered the sons of Adam, He fixed the bounds of the nations according to the number of the angels of God. His people Jacob became the portion of the Lord, and Israel the lot of His inheritance.” And in another place [the Scripture] saith, “Behold, the Lord taketh unto Himself a nation out of the midst of the nations, as a man takes the first-fruits of his threshing-floor; and from that nation shall come forth the Most Holy.</p></blockquote>

</figure><figure class="quote" id="q-8817d6b4d7" data-kw="">
<blockquote><p>This same election took place, not on the basis of foreseen faith, of the obedience of faith, of holiness, or of any other good quality and disposition, as though it were based on a prerequisite cause or condition in the person to be chosen, but rather for the purpose of faith, of the obedience of faith, of holiness, and so on. Accordingly, election is the source of every saving good. Faith, holiness, and the other saving gifts, and at last eternal life itself, flow forth from election as its fruits and effects. As the apostle says, “He chose us” (not because we were, but) “so that we should be holy and blameless before him in love” (Eph. 1:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 9</span></figcaption>

</figure><figure class="quote" id="q-f426fefa18" data-kw="persuaded free mercy election">
<blockquote><p>We shall never feel persuaded as we ought that our salvation flows from the free mercy of God as its fountain, until we are made acquainted with his eternal election, the grace of God being illustrated by the contrast--viz. that he does not adopt all promiscuously to the hope of salvation, but gives to some what he denies to others. It is plain how greatly ignorance of this principle detracts from the glory of God, and impairs true humility. But though thus necessary to be known, Paul declares that it cannot be known unless God, throwing works entirely out of view, elect those whom he has predestined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.21.1</span></figcaption>

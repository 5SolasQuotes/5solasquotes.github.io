<main class="wrap"><figure class="quote" id="q-9c953dba82" data-kw="">
<blockquote><p>This accusation [of incoherency against classical theism] is plausible so long as one is compelled to hold either that the divine Word subtracted something from Himself in assuming a human nature or added something to Himself. But contrary to widespread recent opinion, subtraction and addition are not the only options. Thomas Aquinas, among others, repudiates both these approaches, expounding instead a doctrine of terminative assumption. Termination eludes the liabilities of subtraction and addition by requiring neither privation of being nor passive potency in the divine Word in order to account for his becoming man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dolezal.html">James Dolezal</a></span><span class="wk"><span class="lbl">Work:</span> <cite>’Neither Subtraction, Nor Addition: The Word’s Terminative Assumption of a Human Nature’ Nova et Vetera, vol. 20, no. 1 (Winter, 2022) 23 pp.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d4c4f08593" data-kw="">
<blockquote><p>Durand [d. 1296] distinguisheth of a twofold composition: Hujus ex his [of this out of that], &amp; hujus ad hoc [of this to that] (bk. 3, Distinction 7, question 3 [this distinction is from Aristotle]). … ‘There is’ (says he) ‘a second kind of composition, and that is hujus ad hoc, and it is not so properly a composition of a third thing out of the things united, as an adjoining of one of the things united unto the other. And thus the person of the Word after the incarnation may be said to be compounded. For hereby, the human nature is added unto the person of the Word and unto the divine nature in the unity of the same person.’ But now, he also subdivides this composition, which he terms hujus ad hoc. ‘For it is either by inherence of one thing in another, and such is the composition of an accident with its subject: or else by way of a supposital dependance of one thing upon, and relation unto another: so that the one should substantially inexist in the other, and the other should terminate the respect and dependance of the former, which inexists, and after this latter manner the person of the Word is after the incarnation compounded. Because, whereas before, it subsisted only in the divine nature, after the incarnation, it by it’s subsistence terminated the dependance of the human nature.’ Thus he. … A second objection is taken from the completeness of the Word. That which comes unto a thing already complete and perfect, comes thereunto only accidentally, and makes therewith only an aggregation, and not a substantial union. But now the person of the Word, from all eternity, was most perfect, and complete. And therefore the adding or coming of the manhood unto it, is not substantial, but accidental. For answer: The major is true only, when one thing is so added, and comes unto another, as that it pertains not to the same subsistence. And thus a man’s garment is added unto him, and therefore united with him only accidentally; so that homo vestitus is ens unum tantum per accidens. But now the manhood is so added, and comes unto the Word, that it is drawn, or assumed into a communion of subsistence with the word, and it’s divine nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Mixture of Scholastical Divinity, with Practical, in Several Tractates… (Oxford, 1656), ‘There dwelleth in Christ all fullness’, pp. 146 &amp; 149-50 Jeanes was an English presbyterian.</cite></span></figcaption>

</figure><figure class="quote" id="q-42d71c9918" data-kw="">
<blockquote><p>There can be no safety, no holiness, and no happiness to those who are out of Christ. No safety, because all such are under the condemnation of the law, verses 1-3; no holiness, because only such as are united to Christ have the Spirit of Christ, verse 9; and no happiness, because “to be carnally minded is death,” verse 6. Hence those who are in Christ, should be very humble, seeing they are nothing, and he is everything; very grateful, and very holy. And those who are out of Christ, should at once go to him, that they may attain safety, holiness, and happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Epistle to the Romans</cite>, rev. ed., 1886, ch. 8, Remarks</span></figcaption>

</figure><figure class="quote" id="q-b5b7f085f8" data-kw="">
<blockquote><p>I lighted upon a passage in [the Romanist] Becanus (Sum. Theol. tome 5, ch. 7, question 3, p. 119) , that merits a little stay and consideration. Besides that grant above mentioned, which the Orthodox make unto the Lutherans, he gratifies them farther, and yields unto them that the divine attributes are communicated unto the humanity, not only in the Person of the Word, but also in the very humanity itself: Howbeit, not proximè, immediately, and formally, but only mediately, consequently, and identically; for only the subsistence of the Word is communicated proximè, immediately, and formally unto the humanity in itself, and by it the humanity does nextly, immediately, and formally subsist. But because that subsistence is really the same with the divine essence and attributes, therefore the divine essence and attributes are communicated consequently and identically unto the humanity, not that the humanity is omnipotent, omniscient, and omnipresent by them, but that it subsists by them, as they are really one and the same thing with the subsistence of the Word. A hint he had of this conceit it seems from Gregory De Valentia: For unto him he refers the reader, and the words which he relates unto are as follows: ‘Agnoscimus &amp; subsistentiam, &amp; etiam divinitatem at{que} perfectionem omnem verbi, naturae humanae communicatam esse uno quodam modo maximè reali, ut scilicet in personâ verbi subsistat, primariò quidem per ipsam verbi subsistentiam seu personalitatem, secundariò autem per Divinitatem etiam &amp; perfectiones ejus, quae ab eâ subsistentia re non differunt’ (tome 4, question 2, punct. 3, section 3, p. 131). ‘We acknowledge that both the subsistence and also divinity, and every perfection of the Word, is communicated unto the human nature after one way or manner, that is most real: to wit, that it subsists in the person of the Word primarily, by the subsistence, or personality itself of the word, secondarily by the divinity also, and perfections thereof, which do not differ really from the subsistence.’ Thus you see, that both of them make no bones to affirm that the subsistence, or personality of the Word, is communicated unto the manhood of Christ, so that it denominates it to subsist properly in, or by the Person of the Word. For confutation of this their opinion, I shall at present allege but two arguments out of [Robert] Baron against it (Philos. Theol. Exercit., pt. 1, article 12, pp. 55-56). 1. If the manhood of Christ subsist any manner of way, then it is a person, or suppositum: for what is subsistence here, but suppositality, and therefore it, and suppositum are reciprocated. 2. To exist in another person, and to subsist, are opposite manners of existence; for to subsist isesse per se, &amp; extra aliud omne suppositum. But the manhood of Christ does exist in the Person of the Word, and therefore it cannot be said to subsist. If these men would have consulted their own Suarez, he would have rectified this their mistake, and have told them, how that usual saying, ‘The humanity of Christ subsists in the Person of the Word,’ is to be qualified, to wit, in regard of its termination unto, and sustentation by the subsistence of the Word. For having propounded this objection, ‘Dices, humanitas Christi non subsistit proprie, quia non est in se, sed in alio,’ he frames hereunto this answer: ‘Respondetur, non subsistere, tanquam id quod subsistit: sed proprie verbum in illa subsistit, &amp; illa dicitur in verbo subsistere, quia illius subsistentia terminatur, &amp; quasi sustentatur.’ (on 3rd pt. of Thomas, tome 1, disputation 8, section 3, p. 231)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Mixture of Scholastical Divinity… (Oxford, 1656) Jeanes (1611-1662) was an English, clergyman and puritan minister.</cite>, pp. 134-6</span></figcaption>

<div class="actions"><button class="copy" data-copy="“I lighted upon a passage in [the Romanist] Becanus (Sum. Theol. tome 5, ch. 7, question 3, p. 119) , that merits a little stay and consideration. Besides that grant above mentioned, which the Orthodox make unto the Lutherans, he gratifies them farther, and yields unto them that the divine attributes are communicated unto the humanity, not only in the Person of the Word, but also in the very humanity itself: Howbeit, not proximè, immediately, and formally, but only mediately, consequently, and identically; for only the subsistence of the Word is communicated proximè, immediately, and formally unto the humanity in itself, and by it the humanity does nextly, immediately, and formally subsist. But because that subsistence is really the same with the divine essence and attributes, therefore the divine essence and attributes are communicated consequently and identically unto the humanity, not that the humanity is omnipotent, omniscient, and omnipresent by them, but that it subsists by them, as they are really one and the same thing with the subsistence of the Word. A hint he had of this conceit it seems from Gregory De Valentia: For unto him he refers the reader, and the words which he relates unto are as follows: ‘Agnoscimus &amp; subsistentiam, &amp; etiam divinitatem at{que} perfectionem omnem verbi, naturae humanae communicatam esse uno quodam modo maximè reali, ut scilicet in personâ verbi subsistat, primariò quidem per ipsam verbi subsistentiam seu personalitatem, secundariò autem per Divinitatem etiam &amp; perfectiones ejus, quae ab eâ subsistentia re non differunt’ (tome 4, question 2, punct. 3, section 3, p. 131). ‘We acknowledge that both the subsistence and also divinity, and every perfection of the Word, is communicated unto the human nature after one way or manner, that is most real: to wit, that it subsists in the person of the Word primarily, by the subsistence, or personality itself of the word, second — Henry Jeanes, A Mixture of Scholastical Divinity… (Oxford, 1656) Jeanes (1611-1662) was an English, clergyman and puritan minister., pp. 134-6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+lighted+upon+a+passage+in+%5Bthe+Romanist%5D+Becanus+%28Sum.+Theol.+tome+5%2C+ch.+7%2C+question+3%2C+p.+119%29+%2C+that+merits+a+little+stay+and+consideration.+Besides+that+grant+above+mentioned%2C+which+the+Orthodox+make+unto+the+Lutherans%2C+he+gratifies+them+farther%2C+and+yields+unto+them+that+the+divine+attributes+are+communicated+unto+the+humanity%2C+not+only+in+the+Person+of+the+Word%2C+but+also+in+the+very+humanity+itself%3A+Howbeit%2C+not+proxim%C3%A8%2C+immediately%2C+and+formally%2C+but+only+mediately%2C+consequently%2C+and+identically%3B+for+only+the+subsistence+of+the+Word+is+communicated+proxim%C3%A8%2C+immediately%2C+and+formally+unto+the+humanity+in+itself%2C+and+by+it+the+humanity+does+nextly%2C+immediately%2C+and+formally+subsist.+But+because+that+subsistence+is+really+the+same+with+the+divine+essence+and+attributes%2C+therefore+the+divine+essence+and+attributes+are+communicated+consequently+and+identically+unto+the+humanity%2C+not+that+the+humanity+is+omnipotent%2C+omniscient%2C+and+omnipresent+by+them%2C+but+that+it+subsists+by+them%2C+as+they+are+really+one+and+the+same+thing+with+the+subsistence+of+the+Word.+A+hint+he+had+of+this+conceit+it+seems+from+Gregory+De+Valentia%3A+For+unto+him+he+refers+the+reader%2C+and+the+words+which+he+relates+unto+are+as+follows%3A+%E2%80%98Agnoscimus+%26+subsistentiam%2C+%26+etiam+divinitatem+at%7Bque%7D+perfectionem+omnem+verbi%2C+naturae+humanae+communicatam+esse+uno+quodam+modo+maxim%C3%A8+reali%2C+ut+scilicet+in+person%C3%A2+verbi+subsistat%2C+primari%C3%B2+quidem+per+ipsam+verbi+subsistentiam+seu+personalitatem%2C+secundari%C3%B2+autem+per+Divinitatem+etiam+%26+perfectiones+ejus%2C+quae+ab+e%C3%A2+subsistentia+re+non+differunt%E2%80%99+%28tome+4%2C+question+2%2C+punct.+3%2C+section+3%2C+p.+131%29.+%E2%80%98We+acknowledge+that+both+the+subsistence+and+also+divinity%2C+and+every+perfection+of+the+Word%2C+is+communicated+unto+the+human+nature+after+one+way+or+manner%2C+that+is+most+real%3A+to+wit%2C+that+it+subsists+in+the+person+of+the+Word+primarily%2C+by+the+subsistence%2C+or+personality+itself+of+the+word%2C+secondarily+by+the+divinity+also%2C+and+perfections+thereof%2C+which+do+not+differ+really+from+the+subsistence.%E2%80%99+Thus+you+see%2C+that+both+of+them+make+no+bones+to+affirm+that+the+subsistence%2C+or+personality+of+the+Word%2C+is+communicated+unto+the+manhood+of+Christ%2C+so+that+it+denominates+it+to+subsist+properly+in%2C+or+by+the+Person+of+the+Word.+For+confutation+of+this+their+opinion%2C+I+shall+at+present+allege+but+two+arguments+out+of+%5BRobert%5D+Baron+against+it+%28Philos.+Theol.+Exercit.%2C+pt.+1%2C+article+12%2C+pp.+55-56%29.+1.+If+the+manhood+of+Christ+subsist+any+manner+of+way%2C+then+it+is+a+person%2C+or+suppositum%3A+for+what+is+subsistence+here%2C+but+suppositality%2C+and+therefore+it%2C+and+suppositum+are+reciprocated.+2.+To+exist+in+another+person%2C+and+to+subsist%2C+are+opposite+manners+of+existence%3B+for+to+subsist+isesse+per+se%2C+%26+extra+aliud+omne+suppositum.+But+the+manhood+of+Christ+does+exist+in+the+Person+of+the+Word%2C+and+therefore+it+cannot+be+said+to+subsist.+If+these+men+would+have+consulted+their+own+Suarez%2C+he+would+have+rectified+this+their+mistake%2C+and+have+told+them%2C+how+that+usual+saying%2C+%E2%80%98The+humanity+of+Christ+subsists+in+the+Person+of+the+Word%2C%E2%80%99+is+to+be+qualified%2C+to+wit%2C+in+regard+of+its+termination+unto%2C+and+sustentation+by+the+subsistence+of+the+Word.+For+having+propounded+this+objection%2C+%E2%80%98Dices%2C+humanitas+Christi+non+subsistit+proprie%2C+quia+non+est+in+se%2C+sed+in+alio%2C%E2%80%99+he+frames+hereunto+this+answer%3A+%E2%80%98Respondetur%2C+non+subsistere%2C+tanquam+id+quod+subsistit%3A+sed+proprie+verbum+in+illa+subsistit%2C+%26+illa+dicitur+in+verbo+subsistere%2C+quia+illius+subsistentia+terminatur%2C+%26+quasi+sustentatur.%E2%80%99+%28on+3rd+pt.+of+Thomas%2C+tome+1%2C+disputation+8%2C+section+3%2C+p.+231%29%E2%80%9D%0A%0A%E2%80%94+Henry+Jeanes%2C+A+Mixture+of+Scholastical+Divinity%E2%80%A6+%28Oxford%2C+1656%29+Jeanes+%281611-1662%29+was+an+English%2C+clergyman+and+puritan+minister.%2C+pp.+134-6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb5b7f085f8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b5b7f085f8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-grace-of-union-the-logos-assuming-flesh/#:~:text=I%20lighted%20upon%20a%20passage%20in,disputation%208%2C%20section%203%2C%20p.%20231&amp;text=I%20lighted%20upon%20a%20passage%20in%20%5Bthe%20Romanist&amp;text=tome%201%2C%20disputation%208%2C%20section%203%2C%20p.%20231" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The fifth and last, is of the branch and tree into which it is engraffed; as suppose a vine-branch and an olive-tree: now as this olive-tree is but one, but has two different natures in it, and so it beareth two kinds of fruit: and yet between the tree and the branch there is a composition, not hujus ex his, but hujus ad hoc (i.e.) not of a third thing out of the two things united, but of one of the two things united or adjoyned to the other: Even so Christ is one, but He has two different natures, and in them He performs the different actions pertaining to either of them: and yet between the different natures (the divine and human nature) there is a composition, not hujus ex his but hujus ad hoc, not of a third nature arising out of these, but of the humane nature added or united to the divine, in unity of the same person: so that now we may say, as this vine is an olive-tree, and this olive-tree is a vine: or as this vine bears olives, and this olive-tree bears grapes, so the Son of man is the Son of God, and the Son of God is the Son of Man: or this Son of Man laid the foundation of the earth, and this Son of God was born of Mary, and crucified by the Jews. This similitude (I take it) is the aptest and fullest of all the other, though in some things also it does fail; for the branch has first a separate subsistence in itself, and losing it after, then it is drawn into the unity of the subsistence of that tree into which it is implanted; but it is otherwise with the human nature of Christ; it never had any subsistence of its own, until it was united to the person or subsistence of the Son of God.</p></blockquote>

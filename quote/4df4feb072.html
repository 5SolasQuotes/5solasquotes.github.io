<main class="wrap"><figure class="quote" id="q-4df4feb072" data-kw="">
<blockquote><p>Lastly, Sanctification of the Sabbath, by the whole family, in all or most of the duties aforesaid, publicly and privately, is the care of the chief householder; as in the fourth Commandment: Remember thou keep holy the Sabbath day: Thou Master, and thy son and daughter, manservant and maidservant. What need so particular enumeration, if there were not a great weight in the performance thereof?

But where shall we find the family that doth all this? when the Householders themselves neglect or profane it by their own example; and employ their children and servants in businesses, to keep them from the public Congregation, or leave them to come or go at their own pleasure; or to spend the day in Idleness or Sports &amp; pastimes, that day; How can these men say truly, I and my house, we will serve the Lord? I shall only say more truly, what once was falsely applied to our Saviour; This man is not of God, because he keepeth not the Sabbath day: because he takes no care, that his family with him, do keep the Sabbath day. And thus much of the third Use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Family reformation promoted. In a sermon on Joshua, chap. 24. ver. 15.</cite>, (London: John Wright, 1656), pp 40-41.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fa58b92034" data-kw="">
<blockquote><p>…God was immediately present in and with the ark, the temple, the holy mountain, the bush, the cloud and the fire which came from heaven, speaking and manifesting Himself to his people by his own immediate voice and miraculous extraordinary presence: So that worshipping before these things had the same reason which makes the 24 elders in heaven worship before the throne. For in these things God did immediately manifest his presence, as well as in heaven. Though there be a difference in the degrees of the immediate manifestation of his presence in earth and in heaven, yet magne et minus non variant speciem [greater and less do not vary the species]. Now God is present in the sacrament, not extraordinarily, but in the way of an ordinary dispensation, not immediately but mediately. [While pictures of the ark, temple and Mt. Sinai might be lawfully made, because those things only extraordinarily revealed God’s presence at extraordinary times, and apart from that they did not but only revealed God’s presence in an ordinary manner (as like the sacraments, which pictures may be made of), yet there were no times at which the burning bush and the pillar and cloud of fire did not extraordinarily reveal God’s presence.] Yet to no better purpose they [formalist opponents] tell us that when God spake Abraham fell on his face. And when the fire came down at Elijah’s prayer, the people fell on their faces. What is this to the purpose? And how shall kneeling in a mediate and ordinary worship [such as in receiving the Supper] be warranted by kneeling in the hearing of God’s own immediate voice, or in seeing the miraculous signs of his extraordinary presence?… Moreover it is objected out of Lev. 9:24; 2 Chron. 7:3; Mic. 6:6; 2 Chron. 29:28-30, that all the people fell on their faces before the legal sacrifices when the fire consumed the burnt-offering. Whereunto it may be answered that the fire which came from God and consumed the burnt offerings was one of the miraculous signs of God’s extraordinary and immediate presence… But if we will particularly consider all these places, we find in the first two, that beside the fire, the glory of the Lord did also appear in a more miraculous and extraordinary manner, Lev. 9:23, ‘The glory of the Lord appeared to all the people,’ 2 Chron. 7:1, 12, ‘The glory of the Lord filled the house.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4, p. 69</span></figcaption>

<blockquote><p>Q. 2. Why will God have a Sabbath on earth?

A. God will have a Sabbath on earth, to give us therein an emblem of that eternal Sabbath in heaven, wherein his people shall be serving him, and praising him without interruption, or mixture of any other business throughout eternity; Heb. iv. 9. There remaineth therefore a rest to the people of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of the Assembly’s catechism. With practical inferences from each question: as it was carried on in the Lord’s Days exercises in</cite>, Dartmouth, in the first year of liberty, 1688 (1692) in The works of John Flavel (6 vols, London, 1820), 6: 233.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>I will analyze how a group of Byzantine seals mark a subgroup of this elite [class] that emerged at the forefront of Byzantine society at the beginning of the iconoclast era… The common feature shared by these seals is that they all contain quotations of the Psalms, and represent nearly the only quotations—scriptural or otherwise—that occur on Byzantine seals. This short-lived sigillographic trend was, moreover, restricted to prominent early iconoclast lay officials.</p></blockquote>

<blockquote><p>…these were to be offered continually as a burnt offering upon the altar, which law was not to take place until they came into the [Promised] Land, as we heard before in the like case, [Num.] ch. 15:2, because in the desert they wanted many things necessary, Dt. 12:8, which was a sufficient dispensation for the omitting of them: For when God does require anything, He gives means to perform it; and did never impute it as a sin unto them when an inevitable necessity did hinder them, and the desire to obey is no less accepted than obedience itself.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-21fe84f65e" data-kw="">
<blockquote><p>Now the means God has appointed for a man’s recovery are diverse: First, There are means by way of love and goodness: There are also means by way of chastisements and afflictions By way of Love; How winning and overcoming should that be? Love does surround you; it’s love that you live, that you breath; its love, you are preserved from hell and damnation; its love, that you have any support at all; therefore the goodness of God in all the creatures you enjoy, should lead you to repentance, Rom. 2[:4]. The sun that shines to you, the earth that brings forth fruit for you, the health and perfection of the senses, should melt you always into good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace &amp; Assurance, pt. 1 (1652; Ames, Iowa: 1990), Sermon 66, “Showing that the Damnation of Wicked Men is unpleasing to God, and that which He delights not in”</cite>, pp. 403-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-829edfe447" data-kw="">
<blockquote><p>5. Although through this call salvation becomes the possession of only a few, as everyone must admit, it nevertheless retains its great value and significance also for those who reject it… Frequently, even for those who harden themselves in their unbelief, it is a source of various blessings. The enlightenment of the mind, a taste of the heavenly gift, partaking of the Holy Spirit, enjoyment of the Word of God, the experience of the powers of the age to come–these have sometimes even come to those who later fell away and held the Son of God in contempt (Heb. 6:4–6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, 4:37-38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-30cbe3f315" data-kw="">
<blockquote><p>The third theological foundation of the Genevan Psalter was the doctrine of common grace. By this it was recognized that there are two types of divine gifts — supernatural and natural. The former are the virtues wrought in the soul by a special work of grace; the latter are those which pertain to secular matters and are distributed to all, not to saints only; as a matter of fact, often to sinners. But, wherever they were, Calvin recognized these and used them for his purposes. Skill in music is a natural rather than a supernatural skill, but Calvin was ever on the alert to capture this for the worship of God. Thus, at his Academy in Geneva, he made music required four hours each week. The choir thereby trained in this skill was to lead the people so they could, under its leadership, cultivate the same skill. Acting on this same principle, Calvin was quick to appreciate the able — though not excessively orthodox — Marot, and to stand by the gifted composer, Bourgeois, who was thrown into prison for breaking some of the rigid disciplines of Geneva of which Calvin was himself the main author. Abraham Kuyper, in his admirable Lectures on Calvinism, so aptly remarks, “Music…would flourish, henceforth, not within the narrow limitation of particular grace, but in the wide and fertile fields of common grace.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Singing the Words God Has Put in Our Mouths” (originally published in The Hymn, January 1953), in John H. Gerstner: The Early Writings, vol. 1</cite>, pp. 204-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-710314ac0a" data-kw="">
<blockquote><p>Together with these external means, serving for drawing on the covenant and going on in it, the common operations of God do concur; common to all the called, both elect and reprobate, and gifts common to both, are bestowed, such as illumination, moral persuasion, historical, dogmatic and temporary faith, moral change of affections, and some sort of external amendment of their outward conversation, saving grace being the special gift of God to His own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/therapeutica-sacra.html">Therapeutica Sacra</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Book 1, Chapter 6</cite></span></figcaption>

</figure><figure class="quote" id="q-44319088f9" data-kw="">
<blockquote><p>‘The love of God is the essential property or essence of God, whereby delighting Himself in it, He wishes it the good which He approves.’ To be distinguished are ‘the general love of God’, the object of which is creation generally, so that ‘no one either of men or even of demons may say that he is not loved by God’; God hates the sin in the godless, but loves the nature created by Him — and the ‘special love of God, by which He peculiarly pursues the separate elect.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syntagma Theologiae Christianae, 2.122, quoted by Heinrich Heppe, Reformed Dogmatics, p. 95. The whole, large quote is Heppe’s; the small quotes inside it are from Polanus’.</cite></span></figcaption>

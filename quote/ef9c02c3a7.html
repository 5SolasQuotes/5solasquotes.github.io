<main class="wrap"><figure class="quote" id="q-ef9c02c3a7" data-kw="">
<blockquote><p>Magistrates ought not to plant or propagate religion by arms. The cruelty of the [Romanist] Spaniards upon the Indians is abhorred by all. True religion should be planted by true doctrine, instruction, example, but it may be defended by arms.</p></blockquote>

</figure><figure class="quote" id="q-f5a59ae39d" data-kw="">
<blockquote><p>…Lewis Du Moulin… a son of the famous Molinaeus, who took so active a part in the Arminian controversy, and was long the leading divine in the Protestant Church of France. Lewis settled in England, and obtained a chair in Oxford during the Commonwealth. He adopted Independent, or Congregational, views on church government, chiefly, it would appear, because he thought them more favorable to Erastianism than Presbyterian principles, a notion for which he could plead the authority of Congregational divines of the highest eminence–namely, the five dissenting brethren, as they were called, in the Westminster Assembly. They, in their Apologetical Narration, had asserted that they gave as much, or, as they thought, more, power to the civil magistrate in religious matters than the principles of Presbyterians would allow them to do, a declaration which, whether it be regarded as made honestly or hypocritically, has been very galling to those who have succeeded them in the maintenance of Congregational principles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/congregationalists.html">Congregationalists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>William Cunningham, HT</cite>, 2.580</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-ac832da950" data-kw="">
<blockquote><p>For the first, we lay hold on all the arguments that prove the Word preached to be the only means of converting the soul, begetting of faith and that carnal weapons are not able, yea nor were they ever appointed of God to doing down strong holds, nor can they make a willing people: and Lactantius said well, ‘What is left to us, if another’s lust 〈◊〉 th•t by force, which we must do willingly?’ (Lactantius, Institutes, bk. 5, ch. 14) And that of Tertullian: ‘It is of the law or right of man and of his natural power what every man worships, what he thinks he should worship, nor does the religion of one either do good or do evil to another man, nor is it religion to compel religion, which ought to be received by will, not by force: since sacrifices (of worship) are required of a willing mind.’ (Tertullian ad Scapul••) In which I observe: 1. Tertullian speaks not of the true Christian religion, which is now in question, but of religion in general as it is comprehensive of both true and false religion. Because he speaks of that religion which by the Law of nature a man chooses, and is humani juris et naturalis potestatis [‘of human law and natural power’]: but it is not of the law of man or natural power, nor in flesh and blood’s power to choose the true Christian religion; that election is supernatural says Tertullian there and elsewhere often, as also the Scripture: Jn. 6:44; Mt. 16:17; 11:25-27. 2. ‘Religion’ is taken two ways: 1. For the inward and outward acts of religion as seen both to God and man, as Lactantius, Tertullian and others say: so it is most true. Christians ought not with force of sword compel Jews, nor Jews or pagans compel Christians to be of their religion, because religion has begotten many by persuasion of the mind, not by forcing of the man. [2.] Again ‘religion’ is taken for the external profession and acting and performances of true religion within the Church, or by such as profess the truth, that are obvious to the eyes of magistrates and pastors, and thus the sword is no means of God to force men [who are not professing Christians] positively to external worship or performances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (London: R.I. for Andrew Crook, 1649), ch. 4, pp. 50-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>On the positive side, contrary to the criticism of our detractors, the phrase VICARIUS FILLI DEI has been used historically as a major papal title, and possibly it was also inscribed in some papal tiaras or mitres. On the negative side, the identification of the number 666 with VICARIUS FILII DEI, cannot be exegetically supported by Revelation 13:18, because the text does not say that the meaning of 666 is to be found in the added numerical value of the letters of a name. We noted that such numerical method of interpretation is unknown in the Bible.</p></blockquote>

— James A. De Jong, As the Waters Cover the Sea: Millennial Expectations in the Rise of AngloAmerican Missions 1640-1810 (Laurel: Audubon Press, 2006), p. 7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnticipation+of+the+approaching+fall+of+the+Roman+Catholic+and+Turkish+Antichrists%3B+hope+for+the+conversion+of+the+Jews+and+many+heathen+to+the+Reformed+faith%3B+predictions+of+an+age+of+peace%2C+unity+among+Christians%2C+and+a+great+decline+in+the+power+of+Satan+and+evil%3B+the+belief+in+the+destined+wealth+and+prestige+of+the+Protestant+powers.%E2%80%9D%0A%0A%E2%80%94+James+A.+De+Jong%2C+As+the+Waters+Cover+the+Sea%3A+Millennial+Expectations+in+the+Rise+of+AngloAmerican+Missions+1640-1810+%28Laurel%3A+Audubon+Press%2C+2006%29%2C+p.+7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1f2a87b9dc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1f2a87b9dc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/eschatology/#:~:text=Anticipation%20of%20the%20approaching%20fall%20of,and%20prestige%20of%20the%20Protestant%20powers&amp;text=Anticipation%20of%20the%20approaching%20fall%20of%20the%20Roman&amp;text=destined%20wealth%20and%20prestige%20of%20the%20Protestant%20powers" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f7c6784545" data-kw="">
<blockquote><p>I know that the opinions of the expositors touching these thousand years be diverse. I know how the heresy of the Chiliasts or Millenaries by Papias, authour hereof, as Eusebius recites in the 3rd book [ch. 39.12] of the Ecclesiastical History, was taken hereof. I will not here stand about to confute the opinion of others, which also would be overlong and tedious, and not of so great profit. I wil only utter my own to be weighed of the godly readers, then will I leave it free for every man to follow that thing which he shall think most agreable to the truth and profitable for the godly. And I understand plainly and simply that St. John speaks of a thousand years which ran on by continual course from the time of Christ until the last corrupting of the evangelical preaching and church of Christ. Neither am I very scrupulous in searching out the term of the supputation of these thousand years. Simply I appoint the beginning of the reckoning in the open preaching of the Gospel and what time the Word began now to be received, and was now received of the gentiles. I suppose therefore that there may be three terms or times appointed, which nevertheless shall come all to one reckoning, differing little or nothing amongst themselves or having small diversity, not passing half a year more or less. Ye may therefore, if you please, begin the supputation of the thousand years from the 33rd year of Christ’s birth, wherein Christ also ascended into heaven and Paul being called to the ministry and drawing the gentiles into the felloweship of God’s people by the preaching of God’s Word, began to restrain Satan. And you shall come to the year of our Lord, 1034, and to the bishopric of Pope Benedict IX, which after he come by unlawful means into the chair of St. Peter, as they call it, practiced art-magic and was joined in league with the Devil: of whom he was carried away also, what time he had sold his bishopric before the Pope Gregory VI… Thou wilt say then, that about that time the Devil brake loose again and seduced the people, especially by Popes. Or begin the supputation of the thousand years from that time wherein Paul, being bound for the gospel at Rome, testified that the gospel was preached throughout the world. That was about the year of our Lord, 60; from thence accompting a thousand years, you shall come to the year of our Lord, 1060, when Nicholas II was Pope, under whom it is written that the verity was diversely tempted and corrupted and that Gregory VII did then also by his crafts and enterprises trouble the whole world. Or begin the supputation from the destruction of Jerusalem, what time the Jews [were] cast off, the gentiles in great number entered and were received into the place of the Jews rejected, which was the year of our Lord 73, and thou shalt attain to the year of our Lord 1073, even to Pope Gregory VII: in the which time not a few historiographers write that the Devil himself reigned. Doubtless never man hurt godliness or more stoutly advanced impiety than did this Gregory, otherwise called Hildebrand. Of him I have spoken before in the 13th chapter. Where also I admonished you that Cardinal Benon did accompt those thousand years from the birth of the Lord and concluded [the same] in Sylvester II. It is evident therefore that the gospel has had a notable place in the world, neither has [it] been quenched for the space of a thousand years: that is to say, from the time of the apostles until the year of our Lord was reckoned 1073 or there about… … St. John assigned to Antichrist a certain number of years, to wit 666. Whereof we might understand the name of Antichrist. But therefore it follows not that the Devil was then quite loosed or the light of the Gospel utterly extinguished. For the apostle in his time, speaking of him: ‘The mystery,’ says he, ‘of iniquity now works.’ Antichrist therefore has his seeds, he has his beginning, he has his rising up, his growing and increases. But after a thousand years, he went to work most impudently and most boldly which before also had uttered his maliciousness: but now most venomously of all he spews out his poison, oppressing kings and all that speak never so little against him. We know moreover that in these thousand years past the Devil has reigned in many by murder, perjury and innumerable and unspeakeable evils. But if you consider what has been done since those thousand years, and what is done at this day: you will say those ages of the thousand years to have been golden and silver worlds and ours now for these five hundred years to be of brass, iron, lead and clay. Lactantius in the seventh book of Institutes, the 15th chapter, towards the last end of the world, says he, the state of worldly matters must needs be altered and iniquity prevailing to incline to the worse: so that these our times, in the which iniquity and mischief is grown to the highest degree, yet in comparison of that uncurable evil may be accompted fortunate and in manner golden ages. For justice shall than wear so thin, ungodliness, covetousness, wilfulness and lust shall be so common, that if there shall be then haply any good men, they shall be a pray to the wicked, and everywhere vexed of the unrighteous… By all the which our days now seem to be painted lively. But what is that, which is annexed, that the Devil must be loosed for a little season? seems this a little season which continues now five hundred years? And this place we expound so as that same in the gospel: unless those days were shortened, no flesh should be saved. For it is evidently by stories that neither the Devil, nor Antichrist has enjoyed that his kingdom long quiet. For evermore and in all ages have sprung up some holy and learned men, which being illumined and comforted of God, like Enoch and Helie [Elijah?], haue resisted the ungodly and ungodliness, and have maintained the true religion… Therefore both Satan and the Pope could enjoy these matters but a small season. For immediately after the thousand years sprang up the Waldenses which constantly impugned the Pope and his ungodliness. The Lord has raised up certain kings amongst whom be the Fridericks, German Emperors, Lewis of the house of Bauier, and many others. The Popes also have been at dissension amongst themselves whilst many have been chosen, and every one of them wil be the vicar of Christ, and so tear all that ecclesiastical body of theirs with schisms. There rise up against these preachers earnest and vehement, Wyclif, Huss, Jerome of Prague and diverse others. What is done at this day and has been now these 30 years and more against superstitions and idolatry, against the Pope, and all his clergy, the Papists themselves cry out and all parts of the world can testify. Therefore is the Devil loosed a little season. The Lord Jesus tread him under our feat shortly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Hundred Sermons upon the Apocalypse of Jesus Christ</cite>, ... (London: John Day, 1561), 87th sermon, p. 593-94 &amp; 598-600</span></figcaption>

— Heinrich Bullinger, A Hundred Sermons upon the Apocalypse of Jesus Christ... (London: John Day, 1561), 87th sermon, p. 593-94 &amp; 598-600">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+know+that+the+opinions+of+the+expositors+touching+these+thousand+years+be+diverse.+I+know+how+the+heresy+of+the+Chiliasts+or+Millenaries+by+Papias%2C+authour+hereof%2C+as+Eusebius+recites+in+the+3rd+book+%5Bch.+39.12%5D+of+the+Ecclesiastical+History%2C+was+taken+hereof.+I+will+not+here+stand+about+to+confute+the+opinion+of+others%2C+which+also+would+be+overlong+and+tedious%2C+and+not+of+so+great+profit.+I+wil+only+utter+my+own+to+be+weighed+of+the+godly+readers%2C+then+will+I+leave+it+free+for+every+man+to+follow+that+thing+which+he+shall+think+most+agreable+to+the+truth+and+profitable+for+the+godly.+And+I+understand+plainly+and+simply+that+St.+John+speaks+of+a+thousand+years+which+ran+on+by+continual+course+from+the+time+of+Christ+until+the+last+corrupting+of+the+evangelical+preaching+and+church+of+Christ.+Neither+am+I+very+scrupulous+in+searching+out+the+term+of+the+supputation+of+these+thousand+years.+Simply+I+appoint+the+beginning+of+the+reckoning+in+the+open+preaching+of+the+Gospel+and+what+time+the+Word+began+now+to+be+received%2C+and+was+now+received+of+the+gentiles.+I+suppose+therefore+that+there+may+be+three+terms+or+times+appointed%2C+which+nevertheless+shall+come+all+to+one+reckoning%2C+differing+little+or+nothing+amongst+themselves+or+having+small+diversity%2C+not+passing+half+a+year+more+or+less.+Ye+may+therefore%2C+if+you+please%2C+begin+the+supputation+of+the+thousand+years+from+the+33rd+year+of+Christ%E2%80%99s+birth%2C+wherein+Christ+also+ascended+into+heaven+and+Paul+being+called+to+the+ministry+and+drawing+the+gentiles+into+the+felloweship+of+God%E2%80%99s+people+by+the+preaching+of+God%E2%80%99s+Word%2C+began+to+restrain+Satan.+And+you+shall+come+to+the+year+of+our+Lord%2C+1034%2C+and+to+the+bishopric+of+Pope+Benedict+IX%2C+which+after+he+come+by+unlawful+means+into+the+chair+of+St.+Peter%2C+as+they+call+it%2C+practiced+art-magic+and+was+joined+in+league+with+the+Devil%3A+of+whom+he+was+carried+away+also%2C+what+time+he+had+sold+his+bishopric+before+the+Pope+Gregory+VI%E2%80%A6+Thou+wilt+say+then%2C+that+about+that+time+the+Devil+brake+loose+again+and+seduced+the+people%2C+especially+by+Popes.+Or+begin+the+supputation+of+the+thousand+years+from+that+time+wherein+Paul%2C+being+bound+for+the+gospel+at+Rome%2C+testified+that+the+gospel+was+preached+throughout+the+world.+That+was+about+the+year+of+our+Lord%2C+60%3B+from+thence+accompting+a+thousand+years%2C+you+shall+come+to+the+year+of+our+Lord%2C+1060%2C+when+Nicholas+II+was+Pope%2C+under+whom+it+is+written+that+the+verity+was+diversely+tempted+and+corrupted+and+that+Gregory+VII+did+then+also+by+his+crafts+and+enterprises+trouble+the+whole+world.+Or+begin+the+supputation+from+the+destruction+of+Jerusalem%2C+what+time+the+Jews+%5Bwere%5D+cast+off%2C+the+gentiles+in+great+number+entered+and+were+received+into+the+place+of+the+Jews+rejected%2C+which+was+the+year+of+our+Lord+73%2C+and+thou+shalt+attain+to+the+year+of+our+Lord+1073%2C+even+to+Pope+Gregory+VII%3A+in+the+which+time+not+a+few+historiographers+write+that+the+Devil+himself+reigned.+Doubtless+never+man+hurt+godliness+or+more+stoutly+advanced+impiety+than+did+this+Gregory%2C+otherwise+called+Hildebrand.+Of+him+I+have+spoken+before+in+the+13th+chapter.+Where+also+I+admonished+you+that+Cardinal+Benon+did+accompt+those+thousand+years+from+the+birth+of+the+Lord+and+concluded+%5Bthe+same%5D+in+Sylvester+II.+It+is+evident+therefore+that+the+gospel+has+had+a+notable+place+in+the+world%2C+neither+has+%5Bit%5D+been+quenched+for+the+space+of+a+thousand+years%3A+that+is+to+say%2C+from+the+time+of+the+apostles+until+the+year+of+our+Lord+was+reckoned+1073+or+there+about%E2%80%A6+%E2%80%A6+St.+John+assigned+to+Antichrist+a+certain+number+of+years%2C+to+wit+666.+Whereof+we+might+understand+the+name+of+Antichrist.+But+therefore+it+follows+not+that+the+Devil+was+then+quite+loosed+or+the+light+of+the+Gospel+utterly+extinguished.+For+the+apostle+in+his+time%2C+speaking+of+him%3A+%E2%80%98The+mystery%2C%E2%80%99+says+he%2C+%E2%80%98of+iniquity+now+works.%E2%80%99+Antichrist+therefore+has+his+seeds%2C+he+has+his+beginning%2C+he+has+his+rising+up%2C+his+growing+and+increases.+But+after+a+thousand+years%2C+he+went+to+work+most+impudently+and+most+boldly+which+before+also+had+uttered+his+maliciousness%3A+but+now+most+venomously+of+all+he+spews+out+his+poison%2C+oppressing+kings+and+all+that+speak+never+so+little+against+him.+We+know+moreover+that+in+these+thousand+years+past+the+Devil+has+reigned+in+many+by+murder%2C+perjury+and+innumerable+and+unspeakeable+evils.+But+if+you+consider+what+has+been+done+since+those+thousand+years%2C+and+what+is+done+at+this+day%3A+you+will+say+those+ages+of+the+thousand+years+to+have+been+golden+and+silver+worlds+and+ours+now+for+these+five+hundred+years+to+be+of+brass%2C+iron%2C+lead+and+clay.+Lactantius+in+the+seventh+book+of+Institutes%2C+the+15th+chapter%2C+towards+the+last+end+of+the+world%2C+says+he%2C+the+state+of+worldly+matters+must+needs+be+altered+and+iniquity+prevailing+to+incline+to+the+worse%3A+so+that+these+our+times%2C+in+the+which+iniquity+and+mischief+is+grown+to+the+highest+degree%2C+yet+in+comparison+of+that+uncurable+evil+may+be+accompted+fortunate+and+in+manner+golden+ages.+For+justice+shall+than+wear+so+thin%2C+ungodliness%2C+covetousness%2C+wilfulness+and+lust+shall+be+so+common%2C+that+if+there+shall+be+then+haply+any+good+men%2C+they+shall+be+a+pray+to+the+wicked%2C+and+everywhere+vexed+of+the+unrighteous%E2%80%A6+By+all+the+which+our+days+now+seem+to+be+painted+lively.+But+what+is+that%2C+which+is+annexed%2C+that+the+Devil+must+be+loosed+for+a+little+season%3F+seems+this+a+little+season+which+continues+now+five+hundred+years%3F+And+this+place+we+expound+so+as+that+same+in+the+gospel%3A+unless+those+days+were+shortened%2C+no+flesh+should+be+saved.+For+it+is+evidently+by+stories+that+neither+the+Devil%2C+nor+Antichrist+has+enjoyed+that+his+kingdom+long+quiet.+For+evermore+and+in+all+ages+have+sprung+up+some+holy+and+learned+men%2C+which+being+illumined+and+comforted+of+God%2C+like+Enoch+and+Helie+%5BElijah%3F%5D%2C+haue+resisted+the+ungodly+and+ungodliness%2C+and+have+maintained+the+true+religion%E2%80%A6+Therefore+both+Satan+and+the+Pope+could+enjoy+these+matters+but+a+small+season.+For+immediately+after+the+thousand+years+sprang+up+the+Waldenses+which+constantly+impugned+the+Pope+and+his+ungodliness.+The+Lord+has+raised+up+certain+kings+amongst+whom+be+the+Fridericks%2C+German+Emperors%2C+Lewis+of+the+house+of+Bauier%2C+and+many+others.+The+Popes+also+have+been+at+dissension+amongst+themselves+whilst+many+have+been+chosen%2C+and+every+one+of+them+wil+be+the+vicar+of+Christ%2C+and+so+tear+all+that+ecclesiastical+body+of+theirs+with+schisms.+There+rise+up+against+these+preachers+earnest+and+vehement%2C+Wyclif%2C+Huss%2C+Jerome+of+Prague+and+diverse+others.+What+is+done+at+this+day+and+has+been+now+these+30+years+and+more+against+superstitions+and+idolatry%2C+against+the+Pope%2C+and+all+his+clergy%2C+the+Papists+themselves+cry+out+and+all+parts+of+the+world+can+testify.+Therefore+is+the+Devil+loosed+a+little+season.+The+Lord+Jesus+tread+him+under+our+feat+shortly.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+A+Hundred+Sermons+upon+the+Apocalypse+of+Jesus+Christ...+%28London%3A+John+Day%2C+1561%29%2C+87th+sermon%2C+p.+593-94+%26+598-600&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff7c6784545.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f7c6784545.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/eschatology/#:~:text=I%20know%20that%20the%20opinions%20of,tread%20him%20under%20our%20feat%20shortly&amp;text=I%20know%20that%20the%20opinions%20of%20the%20expositors&amp;text=Lord%20Jesus%20tread%20him%20under%20our%20feat%20shortly" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4ab11a288f" data-kw="">
<blockquote><p>For his heart would have served him too seduce all nations, and to hold them still in the pestilent errors of idolatry, yea and in all kind of horrible misdeeds. But God has plucked them out of the power of darkness, and removed them into the kingdom of his dear beloved Son, Col. …13, till the thousand years be fulfilled. That is to say, till Antichrist be come. And after that he must be let loose. This thing came to pass after that the dominion as well of Mahumet as of the Romish bishop was so increased in strength that they became terrible to all kings and princes of the earth, for as much as they were able, not only to grieve them when they listed, but also to cast them from their seats, and to tread them quite under foot, until they submitted their necks to false religion and rightless laws: which thing is done yet still at this day, according as Paul foretold. 2. Thess. 2. b. 11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-marlorat.html">Augustine Marlorat</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catholic Exposition upon the Revelation</cite>, … ([London] Binneman [1574]), on Rev. 20, p. 274</span></figcaption>

</figure><figure class="quote" id="q-fbc6fbd442" data-kw="">
<blockquote><p>6. …Yea, he bound that malicious Satan and made him sure for a thousand years’ space, to make of the vessels of wrath the vessels of mercy. This did he by his strong word of covenaunt, whom he made for a thousand generations. And a full performance it is of God’s first promise for man’s behove, that Christ should tread down the head of the serpent. For a thousande years was this restraint. Mark besides the mystery, the time from the ascension of Christ unto the days of Silvester the second bishop of Rome of that name, and ye shall all find that it was from Christ’s nativity a complete thousand, after all the historiographers. By such necromancy as he learned of a Sarazin in Spain obtained he the papacy, and as witnesses John Wycliff in his book, De solutiōe sathane, in Christ’s vicarship he loosened that devil who Christ had afore shut up, and set him again at large to deceive afresh. Consider for the time that he was thus bound, the constaunt says of the Christians, and the invincible hearts of their martyrs, and ye shall find them far different from them which has been since. He was then so weak, so infatuate and babish, that not only wise men, learned men, and strong men, did set him light, but also young maidens, children, and tender infants in a manner did laugh him to scorn, and set all his subtle sleights at nought. Evident will this be to all them that shall read the lives of the holy martyrs and saints of the primative Church… 8. …Neither was he able to pluck them from Christ’s faith by flattering prosperity, nor yet by urgent adversity. Neither could tyrannies nor heresies for that time prevail against the Gospel. … 12. And where as it is here said that after these thousand years Satan must be let loose again for a certain time… In the end of these thousand years reigned in the papacy at Rome the aforenamed necromanser Silvester, which was both a black monk and also a Frenchman born. This beastly Antichrist boasting himself not only to be Christ’s vicar in earth, but also to be equal with him in majesty and power, set first the Devil at large by his necromancy, which took from the hearts of men the living Word of the Lord lest they should be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bale.html">John Bale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Image of both Churches after the most wonderful and heavenly Revelation of St. John</cite>, … (d. 1563; London [c. 1570]), on Rev. 20 no page numbers Bale was an Anglican reformer.</span></figcaption>

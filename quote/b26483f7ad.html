<main class="wrap"><figure class="quote" id="q-b26483f7ad" data-kw="">
<blockquote><p>…a public dispute at Heidelberg, in the year 1568, upon certain theses concerning the necessity of church government, and the power of presbyteries to excommunicate; which theses were exhibited by Mr. George Withers, an Englishman, who left England because of the ceremonies, and was at that time made doctor of divinity at Heidelberg.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-withers.html">George Withers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Brief Refutation of the Sophisms by which certain persons attempted to overthrow Ecclesiastical Discipline in a Public Discussion held in Heidelberg’</cite>, (1568) 11 pp. in Ursinus, Commentary on the Heidelberg Catechism, pp. 453-363</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>
<div class="actions"><button class="copy" data-copy="“…a public dispute at Heidelberg, in the year 1568, upon certain theses concerning the necessity of church government, and the power of presbyteries to excommunicate; which theses were exhibited by Mr. George Withers, an Englishman, who left England because of the ceremonies, and was at that time made doctor of divinity at Heidelberg.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-355b1f3f17" data-kw="">
<blockquote><p>The earliest discussions upon this subject, in the seventeenth century, were connected with the rise and progress of the Arminian controversy in Holland, and arose out o the interference of the civil authorities in the theological disputes which the views of Arminius and his followers produced –so much so, that it has been said that this might be regarded as a sixth point or article in the Arminian controversy. The Arminians generally adopted Erastian views… The cause of this was partly, no doubt, because they found that, during the earlier stages of the controversy, previous to the calling of the Synod of Dort, the civil authorities generally favored them, and were disposed to promote their views… But their leaning to Erastianism had a deeper foundation than this, in the general character and tendency of their doctrinal views, especially in their latitudinarianism, which implied or produced a want of an adequate sense of responsibility connected with the discovery and the maintenance of all God’s truth; and thus tended to dispose them towards an allowance or toleration of the interference of a foreign and incompetent authority in the decision of religious controversies, and in the regulation of ecclesiastical affairs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>
<div class="actions"><button class="copy" data-copy="“The earliest discussions upon this subject, in the seventeenth century, were connected with the rise and progress of the Arminian controversy in Holland, and arose out o the interference of the civil authorities in the theological disputes which the views of Arminius and his followers produced –so much so, that it has been said that this might be regarded as a sixth point or article in the Arminian controversy. The Arminians generally adopted Erastian views… The cause of this was partly, no doubt, because they found that, during the earlier stages of the controversy, previous to the calling of the Synod of Dort, the civil authorities generally favored them, and were disposed to promote their views… But their leaning to Erastianism had a deeper foundation than this, in the general character and tendency of their doctrinal views, especially in their latitudinarianism, which implied or produced a want of an adequate sense of responsibility connected with the discovery and the maintenance of all God’s truth; and thus tended to dispose them towards an allowance or toleration of the interference of a foreign and incompetent authority in the decision of religious controversies, and in the regulation of ecclesiastical affairs.”

xt=The%20earliest%20discussions%20upon%20this%20subject%2C%20in%20the&amp;text=controversies%2C%20and%20in%20the%20regulation%20of%20ecclesiastical%20affairs" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4. Did any of us think or write what Bellarmine [a papist] has spoken against the Lord’s anointed? If princes cannot be moved by Church-censures, and if the necessity of the Church require, the Pope shall free their subjects from obeying them, ipsis[que] principatus abrogabit, and shall pull their princedom from them.</p></blockquote>

</figure><figure class="quote" id="q-11e69be364" data-kw="">
<blockquote><p>But if once the government of Christ were set up among us, we know not what would impede it by the sword of God alone [i.e. the Word of God], without any secular violence, to banish out of the land those spirits of error, in all meekness, humility and love, by the force of truth convincing and satisfying the minds of the seduced. Episcopal courts were never fitted for the reclaiming of minds. Their prisons, their fines, their pillories, their nose-slitting, ear-croppings and cheek-burnings did but hold down the flame to break out in season with the greater rage. But the reformed presbytery does proceed in a spiritual method eminently fitted for the gaining of hearts; they go on with the offending party with all respect: they deal with him in all gentleness from weeks to months, from months sometimes to years, before they come near to any censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissuasive from the Errors of the Time</cite></span></figcaption>

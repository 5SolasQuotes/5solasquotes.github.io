<blockquote><p>Q. Did Christ always abide under the power and dominion of death?

A. No, for the power of death being subdued, the third day he rose again, ascended into heaven, and sitteth at the right hand of the Father.

Expos. 14. The resurrection of Christ is the first degree of his exaltation, wherein his soul being joined to the same flesh that died, he was raised up to life, 1. Cor. 15. 4. It was necessary that he should rise again, in regard of the excellency of his person, Act. 2. 24. the covenant which he had made with the Father, Psa. 2. 6, 7. Es. 53. 10. the dignity of his high office of eternal mediation, Psal. 110. 6, 7. Rom. 4. 25. and that the truth of those things which were foretold concerning the glory of the Messias, might be fulfilled.

Christ by his divine power rose again from the dead, Rom. 1. 4. 1. Pet. 3. 18. 1. Tim. 3. 16. Jo. 5. 21. and 10. 17, 18. Act. 2. 24. and 3. 15. Eph. 1. 17. 20. Rom. 8. 11. not as a private but as a public person, Rom. 5. 14. 19. 1. Cor. 15. 45. Heb. 10. 14. 1. Pet. 2. 20, 21. thereby shewing that his satisfaction is fully absolute, Rom 4. 25. and 6. 9, 10. The end of his resurrection was, that he might prepare himself to the performance of the glorious functions of a Mediator, and shew himself to be the conqueror of death, and the Lord of quick and dead, Rom. 14. 9. Act. 17. 31.

15. To sit at the right hand, is a manner of speech borrowed from earthly Princes, who use to set at their right hand such as they substitute to rule under them in their names, 1. King. 2. 19. And hereby is clearly noted that excellent glory, power, and dominion of Christ, received of the Father, whereby he doth execute his Kingly, Priestly, and Prophetical office in glory, Matth. 28. 18. Io. 17. 2. Phi. 2. 9, 10. Psa. 110. 1.</p></blockquote>

<blockquote><p>I. What was the will and intention of the Father and the Son in undergoing the death of the cross? Arminians: The will and intention of the Father in delivering the Son to death, and of the Son in undergoing it, was that reconciliation and remission of sins might be obtained for all and every one, both those that perish and those that are to be saved, but applied only to believers. Therefore, although those things are obtained for all and every one, yet they are applied only to believers. Censure: The will and intention of the Father in delivering the Son to death, and of the Son in undergoing it, was that the Son, through the ransom of his precious blood, might both obtain and apply remission of sins and eternal life to those whom the Father gave to him from eternity. Matthew 20:28; Hebrews 9:28; 1 Peter 2:24; Romans 3:25; 2 Corinthians 5:19; Colossians 1:21-22. To this pertain also those passages of Scripture, where Christ is said to have laid down his life for his sheep, to have given himself for his Church, to have redeemed the Church with his own blood. John 10:15; Ephesians 5:23, 25; Matthew 1:21; Acts 20:28.

II. Whether Christ died for all men universally? Arminians. Christ underwent death for all individuals both of the perishing and of those to be saved, as to the obtaining of salvation, as much for Cain and Judas, as for Abel and Peter: not however for the former, as such or about to perish, nor for the latter, as believers; but indiscriminately for these and those considered in the common lot of the fall and sin.. Censure. Christ is the expiation for the sins of the whole world, as to the worth and sufficiency of the λύτρον [ransom]. But by reason of efficacy, and the application of faith by him, according to the gratuitous election of God, he is the Savior of the elect only. John 10:15. But in Scripture Christ is said to have died for all, 1 Tim. 2:6, Heb. 2:9, and for many, namely the elect, sons of God and believers. Matt. 20:28, John 17:9, 19, Rom. 3:22. Which ἐναντιοφανές [seeming contradiction] that it may be taken away, it is to be held, that Christ is said to have died for all in three ways: In the beginning he died efficaciously for all his sheep. John 10:15. And in these all and alone there is a certain special universality, as is in Ambrose lib. 1 de vocat. gent. c. 3. The Apostle expresses that universality of believers in Rom. 3:22. Then in certain places of Scripture by the word “all” is understood the indeterminate and universal object of the death of Christ: which are all men, without exception of peoples, condition and sex: so that by this phrase the amplitude of grace in the New Testament is signified. Finally Christ is said to have died for all, if the sufficiency or magnitude of the price is regarded. For indeed the death of the Son of God, and of the immaculate lamb, is the one, perfect, and sufficient λύτρον [ransom], sufficient for expiating and deleting all the sins of the whole world: by which sufficiency all the reprobate are rendered inexcusable.

III. Whether the death of Christ and his resurrection, and also his intercession, are of equal extent? Arminians: Christ died adequately for all sinners, he rose again and intercedes with the intention of saving adequately for believers. Censure: As Christ died adequately for all and only the elect, so for them alone did he intercede in his state of humiliation, for them alone he rose again, and for them alone he now intercedes in heaven. Isaiah 53:17; John 10:15; 17:9; Hebrews 9:24.</p></blockquote>

<blockquote><p>V. It is then out of doubt, that all they, and only they, are partakers of the efficacy of Christ’s death; that is, of redemption, reconciliation with God, remission of sins, righteousness, and eternal life, so many as receive by faith these benefits in the Gospel: but such as pass over this life without faith, remain forever excluded from this power and benefits of his death.</p></blockquote>

</figure><figure class="quote" id="q-15279c9495" data-kw="">
<blockquote><p>Yet surely as ministers derive their power from the Mediator Christ, so magistrates derive theirs from God Almighty, and both by vertue of their office, commission and capacity are unavoidably obliged to join their power and policy together for the suppression and punishment of vice and wickedness and the promoval and encouragement of virtue and piety, for no less will God call civil magistrates to an account for their negligence and maladministrations than Church pastors and ministers; therefore both should amicably correspond and cordially concur for advancing the peace and purity of the Church, for which purpose it is our hearty vote that God would pour forth a spirit of wisdom, zeal and holiness upon magistrates, ministers and all ranks and degrees of persons, Amen.</p></blockquote>

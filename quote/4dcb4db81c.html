<main class="wrap"><figure class="quote" id="q-4dcb4db81c" data-kw="">
<blockquote><p>What is the Lord’s Supper?

Ans. A Sacrament of our preservation in the Church, sealing unto us our spiritual nourishment, and continual increase in CHRIST.

What doth the elements of Bread and Wine in the Lord’s supper represent unto us?

Ans. The Body, and Blood of Christ.

What doth the breaking of the Bread, and pouring out of the Wine represent?

Ans. The sufferings whereby our Saviour was broken for our iniquities, the shedding of His precious blood and pouring out of His Soul unto death.

What doth the receiving of the Bread, and Wine represent?

Ans. The receiving of Christ by faith.

What doth the nourishment, which our body receiveth (by virtue of this outward meat) seal unto us?

Ans. The perfect nourishment, and continual increase of strength which the inward man, injoyeth by virtue of the Communion with Jesus Christ, after the course of this life is ended.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Principles of Christian Religion Summarily set down according to the Word of God: together with A Brief Epitome of the Body of Divinity</cite>, (London: Geo. Badger, 1645), pp 35-37.</span></figcaption>

</figure><figure class="quote" id="q-0bce3d4602" data-kw="">
<blockquote><p>Nor can the context of public worship be completely divorced from the ethical sphere of common life, because the most fundamental law of nature is to pursue good and avoid evil112 (Ps. 34:14; Amos 5:14; 1 Pet. 3:11). This natural law, inherent to us, falls under moral obedience to God in the First Commandment. But public worship ordinances, being ceremonial in nature, and the Regulative Principle of Worship, are secondary to that and less fundamental, flowing out of the Second Commandment. Further, the good of persons’ salvation, besides being grounded in the First Commandment, also derives in significant part from the moral Sixth Commandment, both of which may override the ceremonies of the First Table of the Law. Thus moral obedience and serving the good of the cause of the Gospel (including through the principles we have been discussing) underlies, penetrates, takes precedence over and foundationally supports public worship. To deny this and affirm the opposite is to wrench the Great Commission backwards (Mt. 28:18–20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

<blockquote><p>That has been the uniform and constant order of this Church [of Scotland], since the reformation [in 1560]: that the communicants should receive the sacramental elements of bread and wine, sitting at the table. In the second head of the First Book of Discipline [of the Church of Scotland, 1560], are set down these words: ‘The table of the Lord is then rightly ministered when it approaches most near to Christ’s own action, but it is plain that at that supper Christ Jesus sat with his disciples, and therefore we do judge that sitting at a table is most convenient to that holy action.’ In the general Assembly held in December 1562 it was ordained, That one uniform order be observed in the ministration of the sacraments, according to the order of Geneva [Switzerland, where John Calvin was]… But so it is, that sitting at the table in the act of receiving has been established by laws, custom, long prescription of time and confirmed by oaths and subscriptions as is evident by the former deduction.</p></blockquote>

<blockquote><p>Q. Why is faith required [to rightly receive communion]?

A. Because well we may eat the Bread, and drink the wine without faith; but we cannot eat Christ’s body, and drink his Blood without faith.

True; for the eating of his Body is a spiritual eating, and the drinking of his Blood is a spiritual drinking, consisting in meditation of the wonderful love of GOD the Father, who to save our souls, spared not his own Son: The wonderful love of God the Son, who to save our souls, spared not his own self but gave himself to suffer a shameful death, a bitter death, and an accursed death for our sins: He is the love of Christ that passeth knowledge: such is the breadth and the length and depth, and height of it, that we are not able sufficiently to comprehend it.

And like as the body by feeding and drinking, doth gather strength to the better performance of all actions of nature: so the soul of a Christian by meditation on this love of Christ in giving his body to be crucified, and his blood to be shed for our sins, doth gather more and more strength continually for the better performance of all actions of grace; whether they be actions of dependence, to depend upon him, and put our trust in him in all states, in all conditions, even in the time of affliction, and persecution, and at the very house of death; Or whether they be actions of conformity to his will, in obeying him, and walking in the ways of his commandments unto the end?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Catechetical Exposition of Christian Doctrine</cite>, (London, 1633), pp 10-11.</span></figcaption>

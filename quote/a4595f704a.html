<main class="wrap"><figure class="quote" id="q-a4595f704a" data-kw="Original Sin Author of sin">
<blockquote><p>Although souls are created by God destitute of original righteousness, God cannot on that account be considered the author of sin. It is one thing to infuse impurity; another not to give the purity of which man has rendered himself unworthy in Adam.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dc0406b35f" data-kw="imputation">
<blockquote><p>However although this mode of general propagation is evident and is sufficient for establishing the truth of the traduction of sin; whence since Julian sought through what chinks sin could have entered, since he does not sin who is born; he does not sin who begat; he does not sin who made—Augustine answers, “Why does he seek a concealed crack, when he has a wide open gate? By one man.… What does he seek further; what clearer; what more impressive?” (On Marriage and Concupiscence 2.28 [NPNF1, 5:302; PL 44.464]). Still because the importunity of our opponents is wont to attack this mode violently as impossible (because sin can neither pass by the soul, which is created by God and is not drawn from the body, nor by the body which is brute and incapable of sin), let us see what can be said here more particularly to untie the knot which they think cannot be loosed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.12</span></figcaption>

</figure><figure class="quote" id="q-3630fcaed0" data-kw="Original Sin Author of sin Justice">
<blockquote><p>He is not the author of the evil dispositions with which that nature is infected at birth. The doctrine of original sin attributes no efficiency to God in the production of evil. It simply supposes that He judicially abandons our apostate race, and withholds from the descendants of Adam the manifestations of his favour and love, which are the life of the soul.</p></blockquote>

</figure><figure class="quote" id="q-ac2cd3cfb9" data-kw="Original Sin Author of sin Holiness Justice">
<blockquote><p>However, this is certain, that God doth not infuse it. Souls receive neither purity nor impurity from him, but only their naked essence, and the natural powers and properties flowing therefrom. He doth not infuse any impurity into men; for he cannot be the author of sin, who is the revenger of it. … As a pure and holy God, he cannot infuse any impurity into the souls of men; and as a just and righteous God, he may and doth withhold from, or create them void and destitute of, that holiness and righteousness which was once their happiness and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Illustration of the Doctrines of the Christian Religion</cite>, on original sin</span></figcaption>

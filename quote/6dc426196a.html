<main class="wrap"><figure class="quote" id="q-6dc426196a" data-kw="">
<blockquote><p>Be not easily tempted to cast at your ministers of whose heart-honesty you have had sufficient demonstration. If once Satan get you to begin a little to spurn at them, he will not cease tempting and providence may justly let snares be rained on you, occasions of stumbling be afforded you, till ye turn quite off and become wild. Notorious it is that people’s idolizing, inamoredness with some, and rooted prejudice at others upon partialities and by-respects are both a cause, foment and consequent of woeful divisions, 1 Cor. 1:11-12 and 3:3-4. O esteem your pastors highly in love for their work’s sake and let not every petty difference cast you and them out: Keep not distance with them, but go and lovingly confer with them anent what ye and they differ in: And if ye get not satisfaction, recommend the matter to God, but let love and peace stand entire notwithstanding. What is Satan’s great engine, and consequently his design for marring your good of ministers; but by stating prejudices in your minds at them? Shut your ears and hearts then to all charms that would suggest ill thoughts of your honest ministers. Receive not lightly ill reports of them, spread perhaps industriously to make them odious (Jer. 20:10) to alienate you from them, as Gal. 4:15-16. Be not then too credulous, try e’re ye trust, and admit no bad impressions of them before ye have found that truly they deserve [them].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland</cite>, (1674; London: Cockerill, 1681), p. 173</span></figcaption>

<blockquote><p>And Trypho again inquired, ‘But if some one, knowing that this is so, after he recognises that this man is Christ, and has believed in and obeys Him, wishes, however, to observe these [Mosaic institutions], will he be saved?’ I said, ‘In my opinion, Trypho, such an one will be saved, if he does not strive in every way to persuade other men— I mean those gentiles who have been circumcised from error by Christ, to observe the same things as himself, telling them that they will not be saved unless they do so. This you did yourself at the commencement of the discourse, when you declared that I would not be saved unless I observe these institutions.’ Then he replied, ‘Why then have you said, ‘In my opinion, such an one will be saved,’ unless there are some who affirm that such will not be saved?’ ‘There are such people, Trypho,’ I answered, ‘and these do not venture to have any intercourse with or to extend hospitality to such persons; but I do not agree with them. But if some, through weak-mindedness, wish to observe such institutions as were given by Moses, from which they expect some virtue, but which we believe were appointed by reason of the hardness of the people’s hearts, along with their hope in this Christ, and [wish to perform] the eternal and natural acts of righteousness and piety, yet choose to live with the Christians and the faithful, as I said before, not inducing them either to be circumcised like themselves, or to keep the Sabbath, or to observe any other such ceremonies, then I hold that we ought to join ourselves to such, and associate with them in all things as kinsmen and brethren. But if, Trypho,’ I continued, ‘some of your race, who say they believe in this Christ, compel those gentiles who believe in this Christ to live in all respects according to the law given by Moses, or choose not to associate so intimately with them, I in like manner do not approve of them. But I believe that even those, who have been persuaded by them to observe the legal dispensation along with their confession of God in Christ, shall probably be saved. And I hold, further, that such as have confessed and known this man to be Christ, yet who have gone back from some cause to the legal dispensation, and have denied that this man is Christ, and have repented not before death, shall by no means be saved.&#x27;</p></blockquote>

<blockquote><p>14. I would willingly inquire of the Independents, to what church were added so many thousands that were baptized by the apostles and added unto the Church in one day? Whether to a particular congregation, or to a greater ecclesiastical consociation? It could not be to a particular congregation:

1. For the reasons I have already produced.

2. Because the apostles were not particular, but universal ministers, set over the universal militant Church; and therefore, in virtue of their charge, admitted them to be members of all the Churches, whereof they were ministers.

3. Because they were of diverse and sundry countries: neither is it credible that to be a member of the Church, they were bound to quit their countries and to stay at Jerusalem, howsoever so long as they did stay there, they might participate as well of all the rest of God’s ordinances, as of baptism: Ergo, they were added to some greater consociation, viz. to that, and to all those, whereof the apostles were ministers; for out of all doubt, the apostles who baptized them could not refuse to admit them unto the Lord’s Table wherever they celebrated the sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/adam-steuart.html">Adam Steuart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Part of the Duply to M.S. alias Two Brethren: Wherein are Maintained the King’s, Parliament’s, &amp; All Civil Magistrates’ Authority about the Church. Subordination of Ecclesiastical Judicatories. Refuted the Independency of Particular Congregations</cite>, The Second Part of the Duply to M.S. alias Two Brethren: Wherein are Maintained the King’s, Parliament’s, &amp; All Civil Magistrates’ Authority about the Church. Subordination of Ecclesiastical Judicatories. Refuted the Independency of Particular Congregations… (London, 1644), p. 92 Steuart (1591–1654) was a Scottish presbyterian, philosopher, controversialist and professor in both France and the Netherlands.</span></figcaption>

<blockquote><p>Mr. [Thomas] Hooker: ‘…But these three [qualifications are] assigned by Mr. Rutherford [in order to be accepted as a member of the Church]:

1. To profess the Faith;

2. Eagerly to desire the Seals;

3. To desire Church-fellowship, counting it a disparagement not to be born again, if not admitted to the Sacraments, [yet all this] may agree to a drunkard [according to Hooker].’ Answer: …if the [drunkard] man be a born heathen, and shall come to get these three requisites, and profess as Magus did, he is to be received a member: but if he hath not these three requisites, for he lives in sorcery, as Magus and Elymas, and opposeth the Gospel, the openly lying profession is scandalous; such a profession Mr. Rutherford saith is not his requisites: If he be a pagan, and continue in habitual drunkenness, he may be holden out while he gives evidences to others of amendment, and then he may be admitted to the outer court, as a hearer; though a profession of faith, if not belied with worshipping of false gods, can hardly consist with paganism [and hence he is part of the visible Church in some way and should therefore be a member of a church].</p></blockquote>

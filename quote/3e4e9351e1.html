<main class="wrap"><figure class="quote" id="q-3e4e9351e1" data-kw="">
<blockquote><p>On the part of the people generally, of course, there was no intention of seeking an armed confrontation with the government. The only aim of the majority who attended the field-meetings was to worship God according to their consciences–and to resort to justified self-defence if pushed to extremity… By 1677–or at least by the end of that year–a movement had become established which sought to stiffen the pattern of resistance, and in various ways to carry the battle to the authorities. The acknowledged leader of this movement was Robert Hamilton [who was 27 years old]… Hamilton, who had earlier had a reputation as a profligate, had apparently undergone a radical spiritual experience, and had set himself up as a champion of orthodoxy and of opposition to compromise… …Hamilton and his associates… With their support, and primarily at their instigation, some of the younger preachers began to hold meetings on the boundaries of, and even within, the parishes of such [indulged] ministers, with the object of drawing away their people from attending their services. This unmistakably aggressive stance was fully in line with Hamilton’s view of how to proceed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lion of the Covenant: the Story of Richard Cameron (Durham: Evangelical Press, 1997)</cite>, pp. 76-77</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e15e1b5f18" data-kw="">
<blockquote><p>VIII. The occasion of a scandal which is only passive should be removed, if it be not some necessary thing, and we are not only to shun that which gives scandal, but also that whereupon follows a scandal taken, whatsoever it be, if it be not necessary. This is so evident, that Papists themselves subscribe to it, for both Cardinal Cajetan and Dominicus Bannes say that we should abstain even spiritualibus non necessariis [non-necessary spiritual things] when scandal rises out of them. … XII. We ought for the scandal of the malicious to abstain from all things from which we ought to abstain for the scandal of the weak; for we ought not to abstain from necessary things for the scandal of the weak no more than for the scandal of the malicious; and from things that are not necessary, we ought to abstain for the scandal of the malicious as well as for the scandal of the weak.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 2</cite>, ch. 8, p. 32-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-796a2944fa" data-kw="">
<blockquote><p>Though in some cases as we are warranted, so we are necessitated to withdraw, yet neither do we allow it upon slight or slender grounds; nor can any tender soul be forced to discountenance the ministers of Christ (I do not speak here of the prelatic curates) without great reluctancy and grief of heart, even when the grounds of it are solid and valid, and the necessity unavoidable: Therefore we reject these as insufficient grounds, besides what are given already: 1. We cannot withdraw from a minister for his infirmities and weaknesses, natural, spiritual or moral. 2. Neither for personal faults and escapes; we expect a faithful but not a sinless ministry. 3. Nor for every defect in faithfulness through ignorance, want of courage, misinformation, or being biased with affection for particular persons. We do not hold that faults in members, or defects in ministers do pollute the ordinances, and so necessitate a separation; but agree with what Mr. Durham says on Revelation, ch. 2, lect. 6, ‘Sincerity discovered will cover many faults.’ 4. Nor for every discovery of hypocrisy: Though we may have ground to suspect a man’s principle and motive be not right, yet if he be following duty unblameably, and have a lawful call, what then? “Notwithstanding every way, whether in pretense or in truth, Christ is preached; therein we may rejoice,” Phil. 1:18. 5. Nor yet for real scandals not attended with obstinacy, if ministers will take reproof and admonition, and at least by doctrinal confessing, and practical forsaking them, satisfy the offended, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

<blockquote><p>It is no new thing to see men (happy in the greatest attainments of human learning, and blessed with the influences and graces of the Spirit of God while in this militant state, where great fogs of ignorance cloud the understandings of the best) differ in their judgments about sin and duty; since one way of thinking, and an entire harmony of judgments is reserved as a valuable jewel of that crown of glory which shall encircle the happy heads of the Church triumphant.</p></blockquote>

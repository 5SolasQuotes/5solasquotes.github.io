<main class="wrap"><figure class="quote" id="q-43175d6add" data-kw="Faith alone">
<blockquote><p>By that alone are we justified by which the righteousness of Christ is applied to us, who satisfied the law for us. Now this is done by faith alone; nor does it belong to love or to hope. Not to hope, which does not apprehend, but expects the thing promised. Not to love, which is concerned with the fulfillment of a command, not with the apprehension of a promise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 16.8.9</span></figcaption>

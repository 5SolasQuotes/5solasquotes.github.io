<main class="wrap"><figure class="quote" id="q-94d7e19136" data-kw="">
<blockquote><p>Frequent the windows of his ordinances, both the more secret and retired windows of prayer and meditation, reading, fasting, Christian conference; and these that are more solemn and public, such as word and sacrament, when you can have access: for there it is that Christ feeds his doves, and gives them interviews with himself; and when the public windows are shut, or defiled, or haunted with foxes or birds of prey, that fright, scatter, or tear the doves, be the more frequently resorting to the more private or secret windows, &amp;c.</p></blockquote>

</figure><figure class="quote" id="q-67a848c7de" data-kw="">
<blockquote><p>1. Jesus preached peace (Eph. 2:17); don’t be a better preacher than Jesus.

2. Preach first to yourself.

3. Preach from your heart, not only to their heart.

4. Leverage your own distress.

5. How much do you have to hate the people to try to impress them rather than help them?

6. A pervasive tone of encouragement.

7. Vivid imagery. Visceral, sensory. Littered with analogues.

8. They’re more distressed than they’re revealing.

9. The power is in the Word, not your cleverness.

10. The Spirit works with your weakness and need, not our strength and sufficiency.

11. Think yourself full, pray yourself aglow.

12. Be concrete, not abstract.

13. Specificity communicates universality.

14. Be clear. Lewis: sheep. If you given them a route to misunderstand, they’ll take it.

15. Be simple but not simplistic.

16. Ruthlessly cut everything extraneous.

17. Smile. And mean it. Preaching is an act of pastoral love.

18. Doctrine is not enough; but, people do want to know doctrine.

19. Regularly reveal something of your own weakness.

20. Let them know of exegetical discoveries new to you.

21. Don’t ask adjectives to do the work verbs should be doing.

22. Make the gospel clear at some point.

23. Both unbelievers and believers are present.

24. Both eager and stagnant belieers are present.

25. Remember, and speak directly to, the kids.

26. Speak in your natural everyday voice; resist every form of ‘the preacher’s voice’.

27. Handle objections.

28. When on the fence, shorter is better.

29. Quit preaching while you still have them.

30. You don’t look as happy as you are; so stretch for joy.

31. If they feel loved by you (Phil. 4:1), they will feel hurt with you (Phil. 4:14).

32. ‘We will hear you again about this’ (Acts 17:32). Intrigue them with Jesus, even if they haven’t collapsed into his arms yet.

33. Don’t let your main points be transposable onto any other text in the Bible.

34. Slow down to notice every actual word of the text–what it says, and doesn’t say.

35. Calm down and be yourself.

36. Be a farmer, not a penny stock trader. Crock pot, not microwave.

37. They don’t need eloquence; they need radiance.

38. T.F. Tenney: ‘Preach every sermon like your son is sitting on the last row and giving church one last chance.’

39. Tincture. Give them a taste of what Jesus himself is like. Rutherford.</p></blockquote>

</figure><figure class="quote" id="q-d7a60a1cd6" data-kw="">
<blockquote><p>And this leads me to observe, as the second thing of which the text [Isaiah 21:11], as now used, may remind and assure us, that however discouraging the aspect of things may, in many points, appear — “the morning cometh” — a day of unprecedented brilliancy and joy, when the kingdom and dominion, under the whole heaven, shall be given to the Son of Man; and when, emancipated from the strife and turmoil of incessant wars, and enjoying and exhibiting a foretaste and emblem of the heavenly state, the rest of Zion shall be glorious.

Yes, the Lord’s watchmen, not once or dubiously, but explicitly, and a thousand times, have proclaimed that such a “morning cometh”‘ — the morning of that millennial day when there shall be nothing to hurt nor to destroy in all God’s holy mountain, and when the earth shall be full of the knowledge of the glory of the Lord, as the waters cover the sea.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-buchanan.html">Robert Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of Examining the Signs of the Times (Preached at the Opening of the Synod of Glasgow and Ayr, October 1844.) in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>…you say we ‘are not bound, or rather have no warrant to use the Psalms in meter or with tunes.’ To this I answer, that we are bound to sing is evident, both from Scripture-precept and example; and that we are thereby warranted to have the Psalms in meter with tunes is as clear, as both are necessary, at least convenient in the propriety of our language, for the use of singing: I deny not, but prose may be sung; but seeing it is certain that our language has no such exact prosody, as either to render it easily measurable, or the measures distinguishable by points and accents; nay that the import of the music or tonici accentus, in the Hebrew, qui olim moderabantur harmoniam musicam, is so far now lost and unknown, that if we were now to sing the Hebrew Psalms, we could not make use of them: Pray, Sir, leave us but the way of meter in place of points and accents until you teach us better grammar: whereas you hint, that we ‘may have all David‘s instruments as well as tunes’, if you could learn us to sing without tunes, as we may well do without organs, I shall not contend, but seeing that David did, no doubt, invent and introduce these his instruments, as well by the special direction of the Spirit, as he did all other things anent the service of the Temple, and that the Primitive Christians, worshipping more in the simplicity of the Spirit than in outward shows, canebant assâ voce non […], I think you may now put up your pipes and spare the cost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … ([Amsterdam], 1671), The Fifth Dialogue Answered, pp. 277-278. MacWard was the protege of Samuel Rutherford.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…you say we ‘are not bound, or rather have no warrant to use the Psalms in meter or with tunes.’ To this I answer, that we are bound to sing is evident, both from Scripture-precept and example; and that we are thereby warranted to have the Psalms in meter with tunes is as clear, as both are necessary, at least convenient in the propriety of our language, for the use of singing: I deny not, but prose may be sung; but seeing it is certain that our language has no such exact prosody, as either to render it easily measurable, or the measures distinguishable by points and accents; nay that the import of the music or tonici accentus, in the Hebrew, qui olim moderabantur harmoniam musicam, is so far now lost and unknown, that if we were now to sing the Hebrew Psalms, we could not make use of them: Pray, Sir, leave us but the way of meter in place of points and accents until you teach us better grammar: whereas you hint, that we ‘may have all David‘s instruments as well as tunes’, if you could learn us to sing without tunes, as we may well do without organs, I shall not contend, but seeing that David did, no doubt, invent and introduce these his instruments, as well by the special direction of the Spirit, as he did all other things anent the service of the Temple, and that the Primitive Christians, worshipping more in the simplicity of the Spirit than in outward shows, canebant assâ voce non […], I think you may now put up your pipes and spare the cost.”

— Robert MacWard, The True Non-Conformist, … ([Amsterdam], 1671), The Fifth Dialogue Answered, pp. 277-278. MacWard was the protege of Samuel Rutherford.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6you+say+we+%E2%80%98are+not+bound%2C+or+rather+have+no+warrant+to+use+the+Psalms+in+meter+or+with+tunes.%E2%80%99+To+this+I+answer%2C+that+we+are+bound+to+sing+is+evident%2C+both+from+Scripture-precept+and+example%3B+and+that+we+are+thereby+warranted+to+have+the+Psalms+in+meter+with+tunes+is+as+clear%2C+as+both+are+necessary%2C+at+least+convenient+in+the+propriety+of+our+language%2C+for+the+use+of+singing%3A+I+deny+not%2C+but+prose+may+be+sung%3B+but+seeing+it+is+certain+that+our+language+has+no+such+exact+prosody%2C+as+either+to+render+it+easily+measurable%2C+or+the+measures+distinguishable+by+points+and+accents%3B+nay+that+the+import+of+the+music+or+tonici+accentus%2C+in+the+Hebrew%2C+qui+olim+moderabantur+harmoniam+musicam%2C+is+so+far+now+lost+and+unknown%2C+that+if+we+were+now+to+sing+the+Hebrew+Psalms%2C+we+could+not+make+use+of+them%3A+Pray%2C+Sir%2C+leave+us+but+the+way+of+meter+in+place+of+points+and+accents+until+you+teach+us+better+grammar%3A+whereas+you+hint%2C+that+we+%E2%80%98may+have+all+David%E2%80%98s+instruments+as+well+as+tunes%E2%80%99%2C+if+you+could+learn+us+to+sing+without+tunes%2C+as+we+may+well+do+without+organs%2C+I+shall+not+contend%2C+but+seeing+that+David+did%2C+no+doubt%2C+invent+and+introduce+these+his+instruments%2C+as+well+by+the+special+direction+of+the+Spirit%2C+as+he+did+all+other+things+anent+the+service+of+the+Temple%2C+and+that+the+Primitive+Christians%2C+worshipping+more+in+the+simplicity+of+the+Spirit+than+in+outward+shows%2C+canebant+ass%C3%A2+voce+non+%5B%E2%80%A6%5D%2C+I+think+you+may+now+put+up+your+pipes+and+spare+the+cost.%E2%80%9D%0A%0A%E2%80%94+Robert+MacWard%2C+The+True+Non-Conformist%2C+%E2%80%A6+%28%5BAmsterdam%5D%2C+1671%29%2C+The+Fifth+Dialogue+Answered%2C+pp.+277-278.+MacWard+

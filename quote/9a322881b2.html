<main class="wrap"><figure class="quote" id="q-9a322881b2" data-kw="">
<blockquote><p>As readers of the New Testament, we know that to the men of the New Testament &quot;the Scriptures&quot; were the Word of God which could not be broken, i. e. whose every word was trustworthy; and that a simple &quot;It is written&quot; was therefore to them the end of all strife.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8203363a8d" data-kw="">
<blockquote><p>It is not by Romanists only that it is denied, practically at least, if not theoretically. Nothing is more common among Protestants, especially in our day, than the attempt to coerce the conscience of men by public opinion; to make the opinions of men on questions of morals a rule of duty for the people, and even for the Church. If we would stand fast in the liberty wherewith Christ has made us free, we must adhere to the principle that in matters of religion and morals the Scriptures alone have authority to bind the conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. VI, §4</span></figcaption>

</figure><figure class="quote" id="q-8d052c2daa" data-kw="">
<blockquote><p>Some distinguished men among the Roman Catholics have asserted, that the Scriptures owe all their authority to the Church; so that if she did not give her attestation to the gospels, they would have no more authority than Æsop&#x27;s Fables. But when asked how the Church can establish her authority, they must answer, that it is proved by the testimony of the Scriptures. This is a perfect example of the sophism called &quot;a circle,&quot; for they prove the authority of the Scriptures by the Church, and the authority of the Church by the Scriptures.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-6649a5160f" data-kw="">
<blockquote><p>…for rulers in making laws, and creating by their sole pleasure goodness-moral, in particular matters without the Word of God, are not God’s servants, nor is human authority as human, the nearest cause of obligation of conscience, instamped in these laws, nor is it the cause at all, and therefore to resist them, is not to resist God. They be God’s instruments and ministers in:

1. Propounding and expounding God’s laws.

2. In executing them and defending them from the violence of men.

3. In making positive and directory civil laws for civil government that are laws improperly so called, which bind the conscience as above is said, insofar as they have dependence upon God’s Law; For James says, ‘There is but one Lawgiver’ [James 4:12]. As for Church-canons, all, except physical circumstances in them, are to be warranted by the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Ch. 2, Question 2, p. 208</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bd9b8b3b09" data-kw="">
<blockquote><p>Answer… It is blasphemy to seek this distinction of person and office in the King of kings, because by person in a mortal king, we understand a man that can sin.

1. I am not obliged to obey his [the king’s] personal commandment, except I were his domestic [servant], nor his unlawful personal commandments, because they are sinful.

2. It is false that you obey the king’s law because you obey the king; for then you say but this: ‘I obey the king because I obey the king.’ The truth is, obedience is not formally terminated on the person of the king. Obedience is relative to a precept, and it is men-service to obey a law, not because it is good and just, but upon this formal motive, because it is the will of a mortal man to command it. And reverence, love, fear, being acts of the affection, are not terminated on a law, but properly on the person of the judge; and they are modifications, or laudable qualifications of acts of obedience, not motives, not the formal reason why I obey, but the manner how I obey. And the apostle makes expressly fear of punishment a motive of obedience (Rom. 13:4), while he says, “He beareth not the sword in vain,” therefore be subject to the king; and this hinders not personal resistance to unjust commandments. … Answer.

1. To obey the king’s personal will when it is sinful (as we now suppose), against his legal will, is a sin and a disobedience to God and the king also, seeing the law is the king’s will as king; but to obey his legal will against his sinful personal will (as it must be sinful if contrary to a just law) is obedience to the king as king, and so obedience to God.

2. You take the king’s person to be himself, but you take quid pro quo [this for that]; for his ‘person’ here, you must not take physically for his suppost [agent] of soul and body, but morally: it is the king as a sinful man, doing his worst will against the law, which is his just and best will and the rule of the subjects. And the king’s personal will is so far just and to regulate the subjects insofar as it agrees with his legal will or his law, and this [personal] will can sin, and therefore may be crossed without breach of the Fifth Commandment; but his legal will cannot be crossed without disobedience both to God and the king. … Answer… We are to obey the king’s personal will when the thing commanded is not sin; but his subjects, as subjects, have little to do with his personal will in that notion. It concerns his domestic servant, and is the king’s will as he is the master of servants, not as he is king in relation to subjects; But we speak of the king’s personal will as repugnant to law and contrary to the king’s will as king, and so contrary to the Fifth Commandment; and this [personal will] is attended often not only with passion, but also with prejudice; and we owe no subjection to prejudice and passions, or to actions commanded by these disordered powers, because they are not from God, nor his ordinances, but from men and the flesh, and we owe no subjection to the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, … (1644; Edinburgh: Ogle, 1843), p. 150. Rutherford is responding to the royalist, Symmons.</span></figcaption>

</figure><figure class="quote" id="q-51d687d320" data-kw="">
<blockquote><p>‘Why then’ (say they) ‘have we cast out all the significant ceremonies of Popery?’ Not for their significancy barely, but for their weight and measure. They are not to them only as outward garnishments of worship, but as proper worship, efficacious and meritorious. Their number stifles devotion and fills it with shows without substance. A cup of water refreshes, but a whole well of water chokes. Yea, an hundred sermons weekly would not edify; they would eat out our conscience in our particular callings. Much more would an hundred ceremonies eat out the substance of our general callings, when a few may much refresh and profit, if judgment overpower fancy and affection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-abbot.html">Robert Abbot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Trial of our Church-Forsakers. Or A Meditation Tending to still the Passions of Unquiet Brownists, upon Heb. 10:25</cite>, ... (London: Payne, 1639), sect. 15, p. 207 Abbot (c. 1588 – c. 1662) was a partially conforming English, puritan divine.</span></figcaption>

<blockquote><p>6. Though it were lawful to add other things contrived by ourselves, the Fathers, the papists or others to the sacred ceremonies instituted by God, yet nevertheless they must not be vain or frivolous; they are not to be multiplied excessively, and neither their perpetuity, uniformity or observation is necessary without a case of scandal or contempt.</p></blockquote>

<blockquote><p>For our hope is placed in the true cross of our Lord Jesus Christ, not in an image. For this reason I confess that I whole-heartedly detest the image of the crucifix. It is the image of the cruelty of the Jews against Christ, and so I cannot bear it.</p></blockquote>

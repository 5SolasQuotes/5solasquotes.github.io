<main class="wrap"><figure class="quote" id="q-9a5a82e795" data-kw="">
<blockquote><p>God has forbidden two things [ cf. Exodus 20:4-5]. First, the making of any picture of Him…. The other is, that no image may be worshipped…. The setting up of images in churches, is a defiling . . . By and by, folk go and kneel down to it. . . . The Papists . . . paint and portray ‘Jesus Christ’ – Who (as we know) is not only man but also God manifested in the flesh. He is God’s eternal Son, in Whom the fullness of the Godhead dwells – yes, even substantially . . . Should we have portraitures and images, whereby only the flesh may be represented? Is it not a wiping away of that which is chiefest in our Lord Jesus Christ – that is, to wit, of His Divine Majesty? Yes! And therefore, whensoever a crucifix stands moping and mowing in the church – it is all one as if the Devil had defaced the Son of God. You see, then, that the Papists are destitute of all excuse . . . They abuse their puppets and pictures, after that fashion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Deuteronomy</cite>, (Edinburgh: Banner of Truth Trust, repr. in 1987), 138a51–55 and 138b3–48). Online here (footnote reference no. 69).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-aca7e1212a" data-kw="images worship denied">
<blockquote><p>The question is not whether images may be made which ought to be valued by us (whether we regard the artist, material or antiquity, or even on account of the prototype, if he is a man of some reputation, dear to us). Rather the question is: Should any religious worship (whether called adoration or veneration) be paid to images of God and the saints made by the hand of men? Among our opponents, there is no agreement on this point, some roundly showing adoration, others however, to avoid odium, urging only veneration. But this is an empty distinction. Since religious worship is only one and does not admit of various species, it is equally such by whatever name it may be designated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.9.2</span></figcaption>

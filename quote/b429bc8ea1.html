<main class="wrap"><figure class="quote" id="q-b429bc8ea1" data-kw="">
<blockquote><p>Secondly, every office necessarily supposes the corresponding gift. No man could be an apostle without the gift of infalibility; nor a prophet without the gift of inspiration; nor a healer of diseases without the gift of healing. Man may appoint men to offices for which they have not the necessary gifts, but God never does, any more than he ordains the foot to see or the hand to hear. If any man, therefore, claims to be an apostle, or prophet, or worker of miracles, without the corresponding gift, he is a false pretender. In the early church, as now, there were many false apostles, i.e. those who claimed the honor and authority of the office without its gifts. Thirdly, the fact that any office existed in the apostolic church is no evidence that it was intended to be permanent. In that age there was a plenitude of spiritual manifestations and endowments demanded for the organization and propagation of the church, which is no longer required. We have no longer prophets, nor workers of miracles, nor gifts of tongues. The only evidence that an office was intended to be permanent is the continuance of the gift of which it was the organ, and the command to appoint to the office those who are found to possess the gift.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the First Epistle to the Corinthians</cite>, (NY: Robert Carter, 1860), on 1 Cor. 12:28, p. 263</span></figcaption>

<main class="wrap"><figure class="quote" id="q-a89034af7e" data-kw="">
<blockquote><p>it’s a sin in an Indian prince, and he sins against his magistratical office in that he punishes not an Indian false-teacher who teacheth against the Law of nature [which is universally known], because an Indian should not worship the Devil; but the Indian ruler invincibly ignorant of the Gospel sins not against his office as a magistrate because he punishes not a Gospel-heretic, for he is not obliged to every magistratical act as a magistrate, not to those of which he is invincibly and faultlessly ignorant, as an Indian husband and master invincibly ignorant of the Gospel sins not against the duty of a husband and head of a family, though he teach not wife, children and servants, the principles of the Gospel, which a Christian husband and head of a family is obliged to do, not as a husband and head of a family simply, but as such a husband and head as hears the Gospel, and so either hears and knows, or may hear these Gospel principles if he were not thereof ignorant through his own sinful neglect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience… (1649)</cite>, p. 190</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

</figure><figure class="quote" id="q-c4db61a2d0" data-kw="Imputation Forgiveness">
<blockquote><p>That concupiscence does not condemn the regenerate, comes to pass by an accident, which is the grace of God, which does not impute it to the faithful. This, however, does not occur in this way, as though concupiscence were no sin; for other sins in like manner do not condemn the regenerate, not because they are no sins, but because they have obtained the pardon of them through Christ.</p></blockquote>

</figure><figure class="quote" id="q-73711eb6d7" data-kw="">
<blockquote><p>There are some of our party who think the distinction of mortal and venial sin can be retained in this sense [as in Rom. 7], as Robert Baron, following the theologians of Great Britain, in his Judicio de Perseverantia, although it does not seem sufficiently appropriate on account of our opponents; the distinction of heavy and light sins is better. The question simply concerns the nature of sins in themselves according to the strictness of the law. We think all are mortal, none truly venial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baron.html">Robert Baron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Theological Disputation on the True Distinction Between Mortal &amp; Venial Sin &amp; the Impossibility of Fulfilling the Law of God from the Daily Incursion of Venial Sins; to which is annexed an Appendix on the Possibility of Perfecting [Praestandi, Supassing?] the Law Considered as a Gospel Rule (Aberdeen, 1633) 176 pp. | Baron (1596-39) was one of the Scottish ‘Aberdeen doctors’, a hypothetical universalist, and one whom Rutherford disputed with. Turretin says:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>
<div class="actions"><button class="copy" data-copy="“There are some of our party who think the distinction of mortal and venial sin can be retained in this sense [as in Rom. 7], as Robert Baron, following the theologians of Great Britain, in his Judicio de Perseverantia, although it does not seem sufficiently appropriate on account of our opponents; the distinction of heavy and light sins is better. The question simply concerns the nature of sins in themselves according to the strictness of the law. We think all are mortal, none truly venial.”

20venial&amp;text=There%20are%20some%20of%20our%20party%20who%20think&amp;text=We%20think%20all%20are%20mortal%2C%20none%20truly%20venial" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3fd84ecb2b" data-kw="">
<blockquote><p>Forsomuch then as it appears by most substantial reasons that the corrupt lusts which remain in us after baptism are sins; now it rests that we see unto what kind or part of sins they belong. Sin may seem thus to be divided: that there is one thing, which may be forgiven, and another thing, which cannot. Transgression against the law of God, which is never forgiven, is sin against the Holy Ghost. But if sin may be forgiven, that may be two manner of ways: for either it is so forgiven as we must of necessity altogether depart from it; which we see come to pass in sore and grievous sins, which Paul says do separate us from the kingdom of God, and commonly be called mortal: and those be called small or venial sins, without the which man’s life cannot here be led. [Note in margin: 1 Cor. 6:9, or else be so forgiven, as we depart not from them; partly, through ignorance engrafted in us, and partly, by reason of the infirmity, wherewith we be infected.] [Note in margin: Lust and the first motions motions unto evil, be in their own nature mortal] Paul has put a notable difference between these sins, when he exhorts us that we should not suffer sin to reign in us. (Rom. 6:1) And of this third kind of sins the apostle complained, when he said, ‘O unhappy man that I am! Who shall deliver me from the body of this death? (Rom. 7:24)’ And of these sins do we mean, when we teach, that the works of men, notwithstanding they be godly men, be not without deadly sins; for that we do nothing without this kind of defects. And such kind of defects be deadly, because in their own nature they deserve death: for the reward of sin is death. Further also, for that so long as we carry about with us these blemishes of corruption, we cannot enjoy the life eternal: for so long are we excluded from it, until by death we have put off all corruption. Moreover, it is written; ‘Cursed be every one, which abides not in all the things which are written in the words of this law.’ And he which complains with Paul, that he does not the good which he would, does not perform all the things, which the law requires, nor is not utterly without curse: though the same, through the mercy of God, be not imputed unto him unto eternal destruction. [Note in margin: By the mercy of God they be not imputed to damnation]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places, II.2.26</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

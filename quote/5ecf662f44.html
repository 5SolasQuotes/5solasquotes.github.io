<main class="wrap"><figure class="quote" id="q-5ecf662f44" data-kw="">
<blockquote><p>THE BIBLE has received from man a treatment different from all other books, whether esteemed sacred or profane. Some have received and regarded it as the oracles of God, the only guide to heaven. Others have regarded it as an imposition of designing knaves. Some have delighted to exhibit the evidence of its divine origin, with all its overwhelming conviction. Others have sophisticated with, full ingenuity to cloud its evidences, and bewilder the human mind in the mazes of error &amp; falsehood.

The adversary, being driven from the field of argument again and again, and convinced by triumphs of the doctrines of the cross, so rapid and so extensive, that open and their opposition was in vain, has resorted to two artful stratagems: 1st. To admit that the Bible was the word of God; but that it was dangerous to the souls of men to suffer it to be in the hands of the laity. 2d. To admit the Bible had a divine origin; but that the Alcoran [Koran] was still a more perfect revelation, and God’s last testament to man.

These artifices completed the eastern and western apostasies. The consequence was, the Bible was soon banished almost from the abodes of men. The dogmas of arrogance, and the fooleries of superstition and ignorance, were imposed on the credulous people as the religion of Jesus of Nazareth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-l-anderson.html">Isaac L. Anderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Millennium. A sermon, delivered at the organization of the Blount County Bible Society, November 21, 1827 in The Calvinistic Magazine</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><figure class="quote" id="q-ec738a4a8b" data-kw="authority">
<blockquote><p>The authority of Scripture (concerning which we here inquire) is nothing else than the right and dignity of the sacred books, on account of which they are most worthy of faith with regard to those things which they propose to be believed and of our obedience in those things which they command us to omit or to do. The divine and infallible truth of these books (which have God for their author) is the foundation because he has the highest right to bind men to faith and duty. But this truth may be either intrinsic or extrinsic. The former is the credibility (axiopistia) in itself of the word which is always equal and consistent with itself, whether it has the testimony of men or not. The latter is the estimation or judgment of men in relation to the Scriptures, which is different as the subjects are different. Of history and of rule.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.4.3</span></figcaption>

</figure><figure class="quote" id="q-8fd989b3de" data-kw="">
<blockquote><p>By contrast, the Reformation asserted that a church, however venerable, can still err. … Even the most simple believer can and may if necessary, Bible in hand, stand up to an entire church, as Luther did to Rome. Only thus the freedom of the Christian, and simultaneously the sovereignty of God, is maintained. There is no higher appeal from Scripture. It is the supreme court of appeal. No power or pronouncement stands above it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, vol. 1: Prolegomena, ch. 14</span></figcaption>

</figure><figure class="quote" id="q-9c7da9c85b" data-kw="">
<blockquote><p>Now I find that Mr. [Richard ]Hooker [an Anglican] says two things to this:

1. That Scripture does regulate all our moral actions, but not scripture only, for the Law of nature and the most concealed instincts of nature, and other principles may warrant our actions: We move (says he), we sleep, we take the cup at the hand of our friend; a number of things we often do only to satisfy some natural desire without present express and actual reference to any commandment of God, unto his glory; even these things are done which we naturally perform, and not only that which naturally and spiritually we do, for by every effect proceeding from the most concealed instincts of nature, his power is made manifest. But it does not therefore follow, that of necessity we shall sin unless we expressly intend the glory of God in every such particular. [Rutherford’s] Answer: …I answer that as: [1.] there be some actions in man purely and spiritually, but supernaturally, moral, as to believe in Christ for remission of sins, to love God in Christ: these the Gospel does regulate.

2. There be some actions naturally moral in the substance of the act, as many things commanded and forbidden in the Moral Law; and these are to be regulated by the Law of nature and the Moral Law:

3. There be some actions mixed, as such actions in which nature, or concealed instincts of nature are the chief principles, yet in and about these actions, as in their modification of time, place, and manner and measure, there is a special morality, in regard of which they are to be ruled by the Word; Such mixed actions as these that are mentioned by Hooker, as to move, sleep, take the cup at the hand of a friend, cannot be called simply moral, for to move may be purely natural, as if a man against his will fall off a high place or off a horse, to start in the sleep, are so natural that I know not any morality in them; but sure I am [that] for Nathaniel to come to Christ, which was also done by a natural motion, is not a mere natural action proceeding from the most concealed instincts of nature; so to sleep has somewhat natural in it, for beasts do sleep; beasts do move; I grant they cannot take a cup at the hand of a friend, they cannot salute one another: (It is Hooker’s instance) but fancy sometimes in men do these, whereas conscience should do them: What is natural in moving and sleeping, and what is common to men with beasts, I grant, Scripture does not direct or regulate these acts of moving and sleeping; we grant [that] actions natural and common to us with beasts need not the rule of the Word to regulate them: But this I must say (I speak it, my record is in Heaven, not to offend any) Formalists, as such, and as Prelatical, are irreligious and profane: One of them asked a godly man, ‘Will you have Scripture for giving your horse a peck of oats, and for breaking wind, and easing or obeying nature?’ And therefore they bring in these instances to make sport: But I conceive, sleeping moderately, to enable you to the service of God, as eating, drinking, that God may be glorified, 1 Cor. 10:31, are also in the measure and manner of doing moral, and so ruled by Scripture and Scripture only, and not regulated by natural instincts… Whereas being created according to God’s image, especially, he living in the visible Church, he is to do all his actions deliberate, even natural and moral in Faith, and with a warrant from scripture, to make good their morality, Ps. 119:9; Prov. 3:23-24; 2 Cor. 5:7. And truly Formalists give men in their morals to live at random and to walk without taking heed to their ways according to God’s Word. … Answer: 1. The Law of reason in morals (for of such we now speak) is nothing but the Moral Law and will of God, contained fully in the Scriptures of the Old and New Testament; and therefore is not to be divided from the Scriptures; if a man be ruled in that, he is ruled by Scripture: for a great part of the Bible, of the Decalogue, is printed in the reasonable soul of man: as when he loves his parents, obeys his superiors, saves his neighbor in extreme danger of death, because he does these according to the Law of Reason, shall it follow that these actions which are expressly called [in Greek] Rom. 2:14, the things or duties of the Law, are not warranted by express Scripture because they are done according to the Law of natural reason? I should think the contrary most true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Intro, Section 4, pp. 72-74</span></figcaption>

God’s image, especially, he living in the visible Church, he is to do all his actions deliberate, even natural and moral in Faith, and with a warrant from scripture, to make good their morality, Ps. 119:9; Prov. 3:23-24; 2 Cor. 5:7. And truly Formalists give men in their morals to live at random and to walk without taking heed to their ways according to God’s Word. … Answer: 1. The Law of reason in morals (for of such we now speak) is nothing but the Moral Law and will of God, contained fully in the Scriptures of the Old and New Testament; and therefore is not to be divided from the Scriptures; if a man be ruled in that, he is ruled by Scripture: for a great part of the Bible, of the Decalogue, is printed in the reasonable soul of man: as when he loves his parents, obeys his superiors, saves his neighbor in extreme danger of death, because he does these according to the Law of Reason, shall it follow that these actions which are expressly called [in Greek] Rom. 2:14, the things or duties of the Law, are not warranted by express Scripture because they are done according to the Law of natural reason? I should think the contrary most true.”

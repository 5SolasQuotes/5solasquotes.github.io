<blockquote><p>Indeed, nothing like the example of a ceremony has been exhibited thus far. On the laying on of hands and of the holy kiss, we speak below.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, (Amsterdam, 1663-1676) | vol. 1, pt 1, bk. 2, ‘Of Ecclesiastical Things, or Acts &amp; Exercises’, Tract 1, ‘Of Formularies, or Liturgies &amp; Rituals’ | ch. 7. ‘Questions Further Explained on the Nature, Causes &amp; Properties of the Ceremonies’, pp. 422-460 “On the public controversies [previously] explicated, we respond to various problems and questions on the ceremonies, by which the nature and properties of them may be the better laid open. I divide them into problems on ceremonies in general and on ceremonies in particular. The first classes [on ceremonies in general] pertain to what it is, or the definition, or the causes or properties.” | On the definition of a ceremony: | 11th Problem, ‘Whether in the time of the N.T. there were instiuted, or observed by the apostles ceremonies properly called sacred and mystical, whether in their signifying or working, which however were not parts of divine worship, nor instituted by divine law, nor consequently necessary by the necessity of a precept? I respond: No.’, p. 425</span></figcaption>

<blockquote><p>‘Yea, but’ (say they) ‘our ceremonies are typical and Jewish ceremonies, which hurt our worship.’ They mean (as I conceive) they are teaching ceremonies, not ceremonies of mere order, but significant, to put us in mind of duty. I am sorry that this should be accounted a fault. If they did not signify, how could they edify? (1 Cor. 14:26) Were they types and shadows of the mysteries of the Gospel invented by men, indeed Christ were ill-advised not to ordain them. But being only moral documents and monitors of some duties, I wonder where their guilt lies. If I had an hundred boxes in my house for my uses, and some few of them had a mark upon them to direct me where my money lay, that I might be careful of that, does this savor of want of natural wisdom? So neither does it taste of want of spiritual wisdom to set a mark upon some few ceremonies, to put me in mind of my duty to Christ. ‘What are these’ (say they) ‘but images set up to ourselves for religious use?’ What? to worship? to adore God in or by? No, but to remind us of what we ought to do. And this was the practice of the Church in all ages: Abraham put his servant’s hand under his thigh in swearing, surely to signify his subjection to him in that business about the promised seed (Gen. 24:2). Moses set up an altar when Amalek was overthrown and called it Jehovah-Nissi, to signify that the Lord was their banner (Ex. 17:15). The two tribes and a half built an altar, not to distinguish their borders, but to signify that they were God’s people and that they had all one God, to whom they and their posterity must sacrifice upon his own altar (Josh. 22:24–35). Samuel set up a stone when the Philistines were discomfited and called it Eben-Ezer, to signify that the Lord helped them (1 Sam. 7:12). When Christ the truth was come, he used human significant ceremonies, as the feast of dedication (John 10:22), sitting at the Passover—a sign of rest (Matt. 26:20)—the water pots of the Jewish purifications (John 2:6), the custom of embalming (John 19:39–40), besides other formalities of the synagogue. (Lk. 4:17-20) The Corinthians had the women’s veil in the congregation, to signify subjection (1 Cor. 11:5–6), and the kiss of peace to signify love (Rom. 16:20; 2 Pet. 2:11). Other Christians had agapae [love-feasts] at the sacrament (Jude), in the room whereof the Christians’ offertory was brought in for pious uses, to signify that love they should have one to another. So we have standing at the Belief [Apostles’ Creed], to signify that it is not a prayer and that we are ready to confess our faith; kneeling at the commandments, to signify the honor we have to that God that gave it, and that we must be ready to dart up prayer for our obedience; and kneeling at the sacrament, to signify an humble acknowledgment of God’s love for so great a benefit. And do we and all these saints before us set up images to ourselves in these ceremonies for religious use? God forbid. The practice of these saints, when the laws of God were purely taught and kept, teaches us that though we may not set up an image to worship God by or in, yet may we set up some edifying signs to put us in mind of those duties we owe to God (1 Cor. 14): The patriarchs may build altars, give their children proper names to be admonishing signs of their duties to God; and we may set all our senses on work that way. We may set up a post in a dark and dangerous passage, that when I go that way and touch it, it may signify my danger, and I may avoid it. I may set a watchman in a tower to give a sound when the enemy comes, that he may signify my enemy’s approach, and I may avoid him. I may set up a sea mark to signify a rock near, that I split not upon it. And may not we be as wise for our souls as for our bodies? God forbid. I am sure He has nowhere forbidden it. Therefore it is not against Christ. If it be not against Him, it is for Him, says our Savior (Mk. 9:40).</p></blockquote>

<blockquote><p>Anointing the sick with oil was held in that [flagship Independent] Church of Arnheim [Netherlands], as a standing ordinance for church members, (for others [of other churches] had no right to that ordinance), as laying on of hands was a standing ordinance for church officers: There was a writing amongst them in many hands, proving it to be so, and there were some cases propounded, with what oil the sick members of the Church were to be anointed, and there was a resolution of the case, namely with olive oil. A copy of this writing some ministers of the [Westminster] Assembly have perused, and one of them has it amongst his papers in the country. [Thomas] Mr. Goodwin did anoint a gentlewoman (whose name I conceal) when she was sick, and she recovered after it (they say).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Anointing the sick with oil was held in that [flagship Independent] Church of Arnheim [Netherlands], as a standing ordinance for church members, (for others [of other churches] had no right to that ordinance), as laying on of hands was a standing ordinance for church officers: There was a writing amongst them in many hands, proving it to be so, and there were some cases propounded, with what oil the sick members of the Church were to be anointed, and there was a resolution of the case, namely with olive oil. A copy of this writing some ministers of the [Westminster] Assembly have perused, and one of them has it amongst his papers in the country. [Thomas] Mr. Goodwin did anoint a gentlewoman (whose name I conceal) when she was sick, and she recovered after it (they say).”

— Thomas Edwards, Antapologia, or, A Full Answer to the Apologetical Narration of [the Independents] Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge… (London, 1644), p. 36">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnointing+the+sick+with+oil+was+held+in+that+%5Bflagship+Independent%5D+Church+of+Arnheim+%5BNetherlands%5D%2C+as+a+standing+ordinance+for+church+members%2C+%28for+others+%5Bof+other+churches%5D+had+no+right+to+that+ordinance%29%2C+as+laying+on+of+hands+was+a+standing+ordinance+for+church+officers%3A+There+was+a+writing+amongst+them+in+many+hands%2C+proving+it+to+be+so%2C+and+there+were+some+cases+propounded%2C+with+what+oil+the+sick+members+of+the+Church+were+to+be+anointed%2C+and+there+was+a+resolution+of+the+case%2C+namely+with+olive+oil.+A+copy+of+this+writing+some+ministers+of+the+%5BWestminster%5D+Assembly+have+perused%2C+and+one+of+them+has+it+amongst+his+papers+in+the+country.+%5BThomas%5D+Mr.+Goodwin+did+anoint+a+gentlewoman+%28whose+name+I+conceal%29+when+she+was+sick%2C+and+she+recovered+after+it+%28they+say%29.%E2%80%9D%0A%0A%E2%80%94+Thomas+Edwards%2C+Antapologia%2C+or%2C+A+Full+Answer+to+the+Apologetical+Narration+of+%5Bthe+Independents%5D+Mr.+Goodwin%2C+Mr.+Nye%2C+Mr.+Sympson%2C+Mr.+Burroughs%2C+Mr.+Bridge%E2%80%A6+%28London%2C+1644%29%2C+p.+36&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9298e19dcf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9298e19dcf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-holy-kiss-foot-washing-anointing-with-oil/#:~:text=Anointing%20the%20sick%20with%20oil%20was,she%20recovered%20after%20it%20%28they%20say&amp;text=Anointing%20the%20sick%20with%20oil%20was%20held%20in&amp;text=sick%2C%20and%20she%20recovered%20after%20it%20%28they%20say" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>I. I was born and bred of parents piously affected, but of no such knowledge or acquaintance as might engage them in any controversies, or disaffect them to the present government of the Church, or cause them to scruple conformity to its doctrine, worship or discipline: In this way I was bred myself, but taught by my parents and God Himself to make conscience of sin and to fear God, and to discern between the godly and the notoriously wicked: For which my parents and I were commonly derided as puritans, the spirit of the vulgar being commonly then fired with hatred and scorn of serious godliness, and using that name as their instrument of reproach, which was first forged against the nonconformists only; And the clergy where I lived, being mostly only readers of the liturgy, and some others that rather countenanced than reproved this course, I soon confined my reverence to a very few among them that were learned and godly (but conformists), and for going out of my parish to hear them, my reproach increased: About eighteen or nineteen years of age I fell acquainted with some persons, half conformists and half nonconformists, who for fear of severities against private meetings, met with great secresy only to repeat the public sermons, and pray, and by pious conference edify each other. Their spirits and practice was so savoury to me, that it kindled in me a distaste of the prelates as persecutors, who troubled and ruined such persons, while ignorant drunkards and worldlings were tolerated in so many churches, yea, and countenanced for crying down such persons, and crying up bishops, liturgie and conformity: Before I was aware, my affections began to solicit my understanding to judge of the things and causes by the persons (where the difference was very great). But yet my first teachers kept my judgement for conformity as lawful, though not desirable had we liberty, till I was ordained. But soon after a new acquaintance provoked me to a deeper study of the whole controversy than I had undertaken before; which left me persuaded that the use of liturgy and ceremonies was lawful in that case of necessity, except the baptismal use of the cross, and the subscription to all things, etc. But in 1640, the oath called ‘Et Caetera’ being offered the ministry, forced me to a yet more searching study of the case of our diocesan prelacie (which else I had never been like to have gainsaid). At a meeting of ministers to debate the case, it fell to Mr. Christopher Cartwright’s lot and mine to be the disputers; and the issue of all (that and my studies) was that I settled in the approbation of the episcopacy asserted by Ignatius, yea, and Cyprian, but such a dissent from the English frame, as I have given account of in my Disputations of Church Government. My genius was inquisitive, and earnestly desirous to know the truth: my helps for piety were greater than my helps for learning, of which I had not much besides books: sickness helped my seriousness, keeping me still in expectation of death. All my reverenced acquaintances (save one) cried down Arminianism as the Pelagian heresy, and the enemy of grace: I quickly plunged myself into the study of Dr. [William] Twisse and [William] Amesius, and [John] Camero, and [William] Pemble, and others on that subject: By which my mind was settled in prejudice against Arminianism, without a clear understanding of the case: whereupon I felt presently in my mind a judgment of those that were for Arminianism, as bad or dangerous adversaries to the Church; and specially of the then ruling bishops: which yet I think I had not-entertained, had I not taken them withal for the great persecutors of godly able ministers, and serious Christians, not only for ceremonies, but for holy practices of life. Being under these apprehensions, when the wars began [early-1640’s], though the cause itself lay in civil controversies between king and parliament, yet the thoughts that the Church and godliness itself was deeply in danger by persecution and Arminianism did much more to bias me to the parliament’s side than the civil interest (which at the heart I little regarded)…</p></blockquote>

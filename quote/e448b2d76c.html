<main class="wrap"><figure class="quote" id="q-e448b2d76c" data-kw="">
<blockquote><p>In 1834 the American Old Light Covenanter Synod rejected the false notion, which was originally espoused by Erastians, Tolerationists, and Anabaptist fanatics, but has even been propagated by some who claim to stand in the covenanting tradition, that civil punishment in the Old Testament was ecclesiastical discipline. Indeed, they opposed such an idea so strongly that they even condemned it as heresy:

As the doctrine of Erastus is not very popular in the present age, and as his followers depended much for the support of their cause on arguments taken from the state of things in the Jewish church, it might seem advisable to let the dispute sink into oblivion; but when we consider that multitudes of errorists and heretics in the present day, hold the same opinions respecting the Jewish church which were held by the Erastians, the discussion of this question is of no small importance. The Erastians, in order to support their doctrine, maintained that in the Jewish church there were no rulers distinct from the civil magistrate; and no discipline distinct from civil punishment. Our present heretics hold the same opinion; but the two parties deduce very different conclusions from the same premises. The Erastians, supposing that civil and ecclesiastical rulers were the same under the Old Testament, maintained that they are so still. Our present heretics, assuming the same false premises, allege, that all which is recorded of the pious kings of Judah suppressing idolatry, was done by them as ecclesiastical rulers; and that the ancient dispensation being abolished, their example is not to be followed by the Christian magistrate. In opposition to both, we maintain that the Jewish church had a government distinct from that of the state, and a discipline distinct from civil punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/general-synod-of-the-reformed-presbyterian-church.html">General Synod of the Reformed Presbyterian Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Minutes of the General Synod of the Reformed Presbyterian Church, session seventeenth, held in the city of Pittsburgh, October, 1834. With an appendix containing two overtures: I. on the ‘jury act,’ II. on the magistrate’s power, circa sacra (Newburgh, 1834), pp 22-3.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>3. And if communicants will be at the charge of maintaining a pastor whom they can better trust their souls with, than him whom the patron chooses for them, the orthodox or tolerating magistrate must see that he be not an heretic, that does more hurt than good; and must keep them under the laws of loyalty and peace, and see that they sow not sedition, and revile not others under pretense of worshipping God.

4. And no men should, without necessity, lose the advantages of a public ministry which the most consent to, and which has the magistrates countenance and maintenance; because gathering singular churches within parish-bounds, seems some accusation of the parish-minister or Church; and such Churches are oft tempted to envy and censoriousness, and are usually envied and censured by others: And unity is much of our strength and beauty. But in case of necessity it may be done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Defended against both Extremes, and Unnecessary Division Confuted in Five Parts</cite>, ... (1684), Unnecessary Separating Disowned, pp. 4-5</span></figcaption>

</figure><figure class="quote" id="q-ac832da950" data-kw="">
<blockquote><p>For the first, we lay hold on all the arguments that prove the Word preached to be the only means of converting the soul, begetting of faith and that carnal weapons are not able, yea nor were they ever appointed of God to doing down strong holds, nor can they make a willing people: and Lactantius said well, ‘What is left to us, if another’s lust 〈◊〉 th•t by force, which we must do willingly?’ (Lactantius, Institutes, bk. 5, ch. 14) And that of Tertullian: ‘It is of the law or right of man and of his natural power what every man worships, what he thinks he should worship, nor does the religion of one either do good or do evil to another man, nor is it religion to compel religion, which ought to be received by will, not by force: since sacrifices (of worship) are required of a willing mind.’ (Tertullian ad Scapul••) In which I observe:

1. Tertullian speaks not of the true Christian religion, which is now in question, but of religion in general as it is comprehensive of both true and false religion. Because he speaks of that religion which by the Law of nature a man chooses, and is humani juris et naturalis potestatis [‘of human law and natural power’]: but it is not of the law of man or natural power, nor in flesh and blood’s power to choose the true Christian religion; that election is supernatural says Tertullian there and elsewhere often, as also the Scripture: Jn. 6:44; Mt. 16:17; 11:25-27.

2. ‘Religion’ is taken two ways: 1. For the inward and outward acts of religion as seen both to God and man, as Lactantius, Tertullian and others say: so it is most true. Christians ought not with force of sword compel Jews, nor Jews or pagans compel Christians to be of their religion, because religion has begotten many by persuasion of the mind, not by forcing of the man. [2.] Again ‘religion’ is taken for the external profession and acting and performances of true religion within the Church, or by such as profess the truth, that are obvious to the eyes of magistrates and pastors, and thus the sword is no means of God to force men [who are not professing Christians] positively to external worship or performances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (London: R.I. for Andrew Crook, 1649), ch. 4, pp. 50-51</span></figcaption>

<blockquote><p>for they [the Scots] plead not for deposing or dethroning of kings, but only for resisting and withstanding them, when they carry a hostile mind against them… and are seeking the ruin and destruction of their own subjects. They plead only, that, in that case the people may, and are bound before God, to defend themselves when their religion (which ought to be dearer to them than anything else) is sought to be taken away, or altered, and service-books, or mass books, and the like, tyrannically obstruded upon them.</p></blockquote>

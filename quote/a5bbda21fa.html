<blockquote><p>VII. Freedom from coercion is an essential quality of the will. Otherwise the will would not be performing acts of will.</p></blockquote>

<blockquote><p>The short answer is that the will is the power or capacity of a rational substance to pursue what the intellect judges to be good. (Not necessarily morally good, but at least good in the broad sense of being suitable or desirable in some way.) It is also traditionally known as the ‘rational appetite.’ It is an appetite insofar as it involves an inclination or tendency toward some object or end. It is a rational appetite insofar as the object is pursued as something conceptualized in a certain way, and thus as something about which we might reason and come to know true propositions. This distinguishes the will from the appetites that non-human animals possess, which involve inclinations toward non-conceptualized objects of sensory perception; and from the sorts of inclinations or tendencies that a plant or an inanimate substance might exhibit, which are not even conscious, let alone conceptualized… A human being, by contrast, can not only perceive and desrie water, but can know that it is water and desire it precisely as something conceptualized… To be able to do that sort of thing is just what it is to have a will. This is, in any even, the account fo the will famously associated with Aquinas…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

<blockquote><p>117. A significant part of that dominion and subjection [Gen. 1:28] is that humans could feed not only on herbs and tree fruits, but also on animals for food. After the Pythagoreans and Hebrews, other ancient and modern Christians considered this unlawful, deceived by παρερμηνείᾳ [a misinterpretation] of Moses’ words, which when correctly explained declare the opposite. For God speaks thus [Gen. 1:29-30]: “Behold, I have given you every herb bearing seed, which is upon the face of the earth, and every tree which is in it, the fruit of the tree bearing seed shall be yours for food; ולכל חית הארץ [and for all living things of the earth], or together with all animals of the earth, indeed and every bird of יeaven and every creeping thing upon the earth, with every green herb of the earth for food.</p></blockquote>

<blockquote><p>39. It is a dreadful thing to be over-bold, rash and presumptuous, in speaking and asserting anything without clear proof, of God’s knowledge and will, especially to reduce them to all the modes and methods of a man, even as to the order of his acts: seeing we are forced to confess that even intellection and volition are spoken of God with exceeding great impropriety, and man’s acts, which are the prius significatum [the primary meaning], are further below God’s than a worm is below a man. Therefore were it not that the presumption of the schools and polemical writers has made that necessary as defensive, which else would not be so, I should scarce dare to say this little following.</p></blockquote>

<blockquote><p>One one version [of traducianism], the soul derives form the bodies of the parents. But it is at best difficult to ee how something incorporeal could arise from something corporeal… The other way to interpret traducianism is to hold that the oul derives from the souls of the parents… But it faces another problem. Again, for the reasons considered in chapter 8, the soul is simple or without parts. So how can one’s soul come from the souls of one’s parents? That would seem to require that a part of one’s fatehr’s soul and a part of one’s mother’s soul be passed down to their offspring. But, again, souls do not have parts. It would also seem to require that those parts be combined in order to make up the soul of the child. But souls cannot be made up of parts, because, once again, they lack parts. So it seems that traducianism, on either interpretation, fails. Creationism is the alternative view that… God and the parents together produce the new human being… …Hence, suppose that the existence of God can be independently established… Suppose it can also be established that only God can create something ex nihilo. And suppose that… it can be established that there is no way in principle for a soul to come into being except by being created ex nihilo. Then the appeal to divine action [in creating the soul] will by no means be either ad hoc or a “God of the gaps” explanation. It will be the only possible explanation. My own view is that it is indeed the only possible explanation.</p></blockquote>

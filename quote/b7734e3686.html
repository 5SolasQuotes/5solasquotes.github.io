<main class="wrap"><figure class="quote" id="q-b7734e3686" data-kw="">
<blockquote><p>Till men and women are brought to feel their sinfulness and need, no real good is ever done to their souls. Till a sinner sees himself as God sees him, he will continue careless, trifling, and unmoved. …

To this end we must expound the length and breadth of God’s holy law. To this end we must denounce every practice contrary to that law, however fashionable and customary. This is the only way to do good. Never does a soul value the Gospel medicine until it feels its disease.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on the Gospels: John, Volume One</cite>, (1869; Edinburgh: Banner of Truth, 1987), p. 206.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-87ad15d57f" data-kw="">
<blockquote><p>I do highly approve the distinction following of things commanded, and things permitted on the Lord’s Day, and the explication of each member; the object of the one, all actions advancing God’s service; the object of the other, such things as are no hindrance thereunto; As in the first place works of necessity; then works of charity; yet the permitting of these, is rightly to be understood; not so as if the works of necessity here mentioned, were in such sort permitted as left to a man’s liberty, whether he will perform them or no. For undoubtedly we are bound as much as lies in our power, to quench a dangerous fire kindled in a town, on the Sabbath day, it being a work of mercy, necessarily required. For if to return a pledge ere the poor pawner of it went to his bed, in case it were his covering, were a work of mercy, how much more to save a man’s house from burning, how much more to save a whole town from being consumed, whereby many might be driven to lie without doors, void of all comfort to the body? So to draw the ox out of the ditch, and to lead cattle to watering, I take it to be a work of mercy, as tending to the preservation of life in a dumb creature. In like sort the dressing [preparing] of meat for the health of man’s body, I take to be a work of mercy. So that the performing of these in reference to the end whereto they tend, I take to be of necessary duty (as here they are called works of necessity) and consequently not permitted only, but commanded also in the general, though not in this [fourth] commandment; but in the Second Commandment of the Second Table only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Morality of the Fourth Commandment as Still in Force to Bind Christians (1641), p. 241</span></figcaption>

</figure><figure class="quote" id="q-7f7e291c8e" data-kw="">
<blockquote><p>To come nearer to the point in hand, we must know also that the heathen idolatrous holy days were turned into Christian, as Christ‘s Nativity was appointed to be kept, and hath long been generally observed on the very time and day, when Saturn’s idolatrous, riotous feast was solemnized, and in the room and imitation thereof, and therefore that time was anciently called Yule … as the heathens called it, and the mad, riotous, profane plays, and sports in Christmas time, Yule-games and Christmas Carols, sung in praise of Christ, as the heathens did the hymn … in honour of the idol Keres, that is Ceres, goddess of corn.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-mocket.html">Thomas Mocket</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christmas, The Christian’s grand feast: Its original, growth, and observation, also of Easter, Whitsontide, and other holy days modestly discussed and determined. Also the beginning of the year, and other things observable</cite>, (London: Richard Wodenoth, 1650), p. 5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-b4b7c5b1a8" data-kw="">
<blockquote><p>Even after Joseph had died, they observed circumcision (as seems must be gathered from Ex. 4:25), and were also intent upon prayers (Ex. 2:23); they certainly desired sacrifices, but did not sacrifice, being deterred by fear of the Egyptians (Ex. 8:26), yet at the same time when about to flee they sacrificed the Passover in Egypt (Ex. 12). Besides those points, hardly anything is mentioned about their divine worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), bk. 8, ch. 2, sect. 25</span></figcaption>

<main class="wrap"><figure class="quote" id="q-4bfa275b68" data-kw="splendid vices">
<blockquote><p>That sin is rightly called the punishment of sin is proved: (1) Scripture expressly establishes this—the incest of Absalom is put forward as a punishment of David sent by God: “Thus saith the Lord, Behold, I will raise up evil against thee out of thine own house, and I will take thy wives before thine eyes, and give them unto thy neighbor, and he shall lie with thy wives in the sight of this sun. For thou didst it secretly: but I will do this thing before all Israel, and before the sun” (2 S. 12:11, 12). Nor can it be objected that “there was nothing penal here, only a bare permission and that the incest itself was not punishment formally.” We answer that the punishment of David ought to be a public disgrace and loss inflicted upon him before the sun and all Israel, and it was a pollution of David’s bed. Now the divine permission was neither formally a detriment to David, nor made publicly before the sun, but secretly in the impure heart of Absalom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/total-depravity.html">Total Depravity</a> › <a href="../topics/sin/total-depravity/splendid-vices.html">Splendid vices</a></span><span class="t"><a href="../topics/sin/total-depravity.html">Total Depravity</a> › <a href="../topics/sin/total-depravity/common-grace-and-restraint-of-sin.html">Common grace and restraint of sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-542411a48a" data-kw="degrees">
<blockquote><p>Hence it appears that the question does not concern the equality of sins or gradual inequality, but their essential demerit. The question is not whether all sins are equal to each other (the paradox of the ancient Stoics and falsely charged upon us by our opponents). If all sins agree in being mortal, it does not follow that they are equal in all things because they can differ from each other as to degree of demerit, so as to deserve a greater or lesser punishment. Rather the question is only whether they are equally mortal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.4.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a> › <a href="../topics/sin/degrees-of-sin/great-and-small.html">Great and small</a></span></div>

</figure><figure class="quote" id="q-17d1cee9cf" data-kw="actual">
<blockquote><p>Second, involuntary may be taken in two ways: either positively or negatively. The former is the same as unwilling which is such by a positive nolition. In this sense, we grant that no sin can be involuntary. The latter is what is done (the act of will ceasing) when the will ought to have acted (which is said to be such by a negative nolition). In this sense, every sin is not necessarily voluntary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.2</span></figcaption>

<blockquote><p>Whatever is anomon (“lawless” in the abstract) or anomia (“lawlessness”) is really sin, but not forthwith what is called “lawless” (anomon) in the concrete because it has sin in itself. In this sense, human nature is called “lawless” (anomos); not that it is sin itself, but because having sin in itself it is well called “sinful.”</p></blockquote>

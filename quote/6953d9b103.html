<main class="wrap"><figure class="quote" id="q-6953d9b103" data-kw="">
<blockquote><p>‘for that which is conceived in her is of the Holy Ghost.’ ‘That holy thing’, ( as Luke speaks), that human body which is in her womb, is created in her, and is of the Holy Ghost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on Mt. ch. 1</cite>, v. 20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“‘for that which is conceived in her is of the Holy Ghost.’ ‘That holy thing’, ( as Luke speaks), that human body which is in her womb, is created in her, and is of the Holy Ghost.”

— Matthew Poole, Annotations on Mt. ch. 1, v. 20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98for+that+which+is+conceived+in+her+is+of+the+Holy+Ghost.%E2%80%99+%E2%80%98That+holy+thing%E2%80%99%2C+%28+as+Luke+speaks%29%2C+that+human+body+which+is+in+her+womb%2C+is+created+in+her%2C+and+is+of+the+Holy+Ghost.%E2%80%9D%0A%0A%E2%80%94+Matthew+Poole%2C+Annotations+on+Mt.+ch.+1%2C+v.+20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6953d9b103.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6953d9b103.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=for%20that%20which%20is%20conceived%20in,and%20is%20of%20the%20Holy%20Ghost&amp;text=for%20that%20which%20is%20conceived%20in%20her%20is&amp;text=in%20her%2C%20and%20is%20of%20the%20Holy%20Ghost" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-371541bb79" data-kw="">
<blockquote><p>God’s curse to the woman was in part, ‘I will greatly multiply your sorrow and your conception’ (Gen. 3:16). Just as every other aspect of creation entered into a curse, so too did conception. To ignore the impact of the fall upon procreation is to miss critical changes that have come about that can make conception a sorrow rather than a blessing (things like cancer, high blood pressure, being worn out from running after five children under the age of six, changes to the function of lactation, etc.)… Physiology shows that perfect bodies were designed by God to suppress ovulation as long as there was breastfeeding (up to three years). The Fall has impacted many bodies to override this normal God-given function.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/phillip-kayser.html">Phillip Kayser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conception Control: Avoiding Antinomianism &amp; Legalism’</cite>, (2017)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“God’s curse to the woman was in part, ‘I will greatly multiply your sorrow and your conception’ (Gen. 3:16). Just as every other aspect of creation entered into a curse, so too did conception. To ignore the impact of the fall upon procreation is to miss critical changes that have come about that can make conception a sorrow rather than a blessing (things like cancer, high blood pressure, being worn out from running after five children under the age of six, changes to the function of lactation, etc.)… Physiology shows that perfect bodies were designed by God to suppress ovulation as long as there was breastfeeding (up to three years). The Fall has impacted many bodies to override this normal God-given function.”

— Phillip Kayser, ‘Conception Control: Avoiding Antinomianism &amp; Legalism’ (2017)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod%E2%80%99s+curse+to+the+woman+was+in+part%2C+%E2%80%98I+will+greatly+multiply+your+sorrow+and+your+conception%E2%80%99+%28Gen.+3%3A16%29.+Just+as+every+other+aspect+of+creation+entered+into+a+curse%2C+so+too+did+conception.+To+ignore+the+impact+of+the+fall+upon+procreation+is+to+miss+critical+changes+that+have+come+about+that+can+make+conception+a+sorrow+rather+than+a+blessing+%28things+like+cancer%2C+high+blood+pressure%2C+being+worn+out+from+running+after+five+children+under+the+age+of+six%2C+changes+to+the+function+of+lactation%2C+etc.%29%E2%80%A6+Physiology+shows+that+perfect+bodies+were+designed+by+God+to+suppress+ovulation+as+long+as+there+was+breastfeeding+%28up+to+three+years%29.+The+Fall+has+impacted+many+bodies+to+override+this+normal+God-given+function.%E2%80%9D%0A%0A%E2%80%94+Phillip+Kayser%2C+%E2%80%98Conception+Control%3A+Avoiding+Antinomianism+%26+Legalism%E2%80%99+%282017%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F371541bb79.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/371541bb79.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-birth-control/#:~:text=God%E2%80%99s%20curse%20to%20the%20woman%20was,to%20override%20this%20normal%20God%2Dgiven%20function&amp;text=God%E2%80%99s%20curse%20to%20the%20woman%20was%20in%20part&amp;text=many%20bodies%20to%20override%20this%20normal%20God%2Dgiven%20function" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-96c7c9f9d1" data-kw="">
<blockquote><p>Whether the Son of God assumed flesh by the soul mediating? It is affirmed with a distinction. Whether the Son of God assumed a soul by the spirit or mind mediating, that is, the rational part of the soul? It is affirmed. Whether the soul was assumed before the flesh. It is denied. Whether the flesh of Christ was assumed by the Word before the union of the soul? It is denied. Whether the whole nature was assumed simultaneously through mediating parts? It is distinguished. Whether the human nature was assumed by grace mediating? It is distinguished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Syllabus of Theological Problems, which, for the Needed Thing to be Proposed or Pressed, are Accustomed to be Used in Private &amp; Public Exercises of Disputations, Examinations, Gatherings &amp; Consultations</cite>, … (Utrecht, 1643), Tract 2, On the Person, Offices &amp; States of Christ the Mediator, Title 1, on the Person of Christ the Mediator, Subtitle: On the Assumption &amp; Union of the Human Nature. trans. T. Fentiman | On the Mode of Assuming, as far as the Order</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“Whether the Son of God assumed flesh by the soul mediating? It is affirmed with a distinction. Whether the Son of God assumed a soul by the spirit or mind mediating, that is, the rational part of the soul? It is affirmed. Whether the soul was assumed before the flesh. It is denied. Whether the flesh of Christ was assumed by the Word before the union of the soul? It is denied. Whether the whole nature was assumed simultaneously through mediating parts? It is distinguished. Whether the human nature was assumed by grace mediating? It is distinguished.”

— Gisbertus Voetius, A Syllabus of Theological Problems… (Utrecht, 1643), Tract 2, On the Person, Offices &amp; States of Christ the Mediator, Title 1, on the Person of Christ the Mediator, Subtitle: On the Assumption &amp; Union of the Human Nature. trans. T. Fentiman | On the Mode of Assuming, as far as the Order">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhether+the+Son+of+God+assumed+flesh+by+the+soul+mediating%3F+It+is+affirmed+with+a+distinction.+Whether+the+Son+of+God+assumed+a+soul+by+the+spirit+or+mind+mediating%2C+that+is%2C+the+rational+part+of+the+soul%3F+It+is+affirmed.+Whether+the+soul+was+assumed+before+the+flesh.+It+is+denied.+Whether+the+flesh+of+Christ+was+assumed+by+the+Word+before+the+union+of+the+soul%3F+It+is+denied.+Whether+the+whole+nature+was+assumed+simultaneously+through+mediating+parts%3F+It+is+distinguished.+Whether+the+human+nature+was+assumed+by+grace+mediating%3F+It+is+distinguished.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+A+Syllabus+of+Theological+Problems%E2%80%A6+%28Utrecht%2C+1643%29%2C+Tract+2%2C+On+the+Person%2C+Offices+%26+States+of+Christ+the+Mediator%2C+Title+1%2C+on+the+Person+of+Christ+the+Mediator%2C+Subtitle%3A+On+the+Assumption+%26+Union+of+the+Human+Nature.+trans.+T.+Fentiman+%7C+On+the+Mode+of+Assuming%2C+as+far+as+the+Order&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F96c7c9f9d1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/96c7c9f9d1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=Whether%20the%20Son%20of%20God%20assumed,by%20grace%20mediating%3F%20It%20is%20distinguished&amp;text=Whether%20the%20Son%20of%20God%20assumed%20flesh%20by&amp;text=was%20assumed%20by%20grace%20mediating%3F%20It%20is%20distinguished" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-85123d9e17" data-kw="">
<blockquote><p>…like Voetius–he interprets Zecahriah 12 as implying that the soul is given to a ‘body that is already formed organically.’ Van Mastricht denies a development throughout three kinds of souls [as Aquinas held], ‘first the vegetative, then the sensitive and finally the rational’ soul… It seems that Van Mastricht–like his predecessor in Utrecht [Voet]–thought that the body needs to have reached a certain stage in its development, before it receives a soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aza-goudriaan.html">Aza Goudriaan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Orthodoxy &amp; Philosophy</cite>, pp. 239-42, 247-48 &amp; 257 of ch. 4, ‘The Human Being: His Soul &amp; Body…’ in Reformed Orthodoxy &amp; Philosophy, 1625-1750: Gisbertus Voetius, Petrus van Mastricht, &amp; Anthonius Driessen (Brill, 2006), p. 247</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“…like Voetius–he interprets Zecahriah 12 as implying that the soul is given to a ‘body that is already formed organically.’ Van Mastricht denies a development throughout three kinds of souls [as Aquinas held], ‘first the vegetative, then the sensitive and finally the rational’ soul… It seems that Van Mastricht–like his predecessor in Utrecht [Voet]–thought that the body needs to have reached a certain stage in its development, before it receives a soul.”

— Aza Goudriaan, pp. 239-42, 247-48 &amp; 257 of ch. 4, ‘The Human Being: His Soul &amp; Body…’ in Reformed Orthodoxy &amp; Philosophy, 1625-1750: Gisbertus Voetius, Petrus van Mastricht, &amp; Anthonius Driessen (Brill, 2006), p. 247">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6like+Voetius%E2%80%93he+interprets+Zecahriah+12+as+implying+that+the+soul+is+given+to+a+%E2%80%98body+that+is+already+formed+organically.%E2%80%99+Van+Mastricht+denies+a+development+throughout+three+kinds+of+souls+%5Bas+Aquinas+held%5D%2C+%E2%80%98first+the+vegetative%2C+then+the+sensitive+and+finally+the+rational%E2%80%99+soul%E2%80%A6+It+seems+that+Van+Mastricht%E2%80%93like+his+predecessor+in+Utrecht+%5BVoet%5D%E2%80%93thought+that+the+body+needs+to+have+reached+a+certain+stage+in+its+development%2C+before+it+receives+a+soul.%E2%80%9D%0A%0A%E2%80%94+Aza+Goudriaan%2C+pp.+239-42%2C+247-48+%26+257+of+ch.+4%2C+%E2%80%98The+Human+Being%3A+His+Soul+%26+Body%E2%80%A6%E2%80%99+in+Reformed+Orthodoxy+%26+Philosophy%2C+1625-1750%3A+Gisbertus+Voetius%2C+Petrus+van+Mastricht%2C+%26+Anthonius+Driessen+%28Brill%2C+2006%29%2C+p.+247&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F85123d9e17.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/85123d9e17.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=like%20Voetius%E2%80%93he%20interprets%20Zecahriah%2012%20as,development%2C%20before%20it%20receives%20a%20soul&amp;text=like%20Voetius%E2%80%93he%20interprets%20Zecahriah%2012%20as%20implying%20that&amp;text=in%20its%20development%2C%20before%20it%20receives%20a%20soul" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ed6aab79e7" data-kw="">
<blockquote><p>The Third Proposition, The soul being thus created an essential part of a man, and the form informing of him: Hence it is that we must not conceive the soul to be first created, as it were, of itself subsisting, and then infused into the body, but when the materials are sufficiently prepared then as the schoolmen expresse it well, Infundendo creatur, and creando infuditur, ‘it’s infused by the creating of it’, and ‘created by infusing’; So that the soul is made in the body organized, not without it; so the Scripture, Zech. 12:1, ‘Who formeth the spirit of man with him,’ and because of the soul’s union to the body when thus disposed;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Original Sin</cite>, (London, 1658), p. 2, ch. 24, sect. 7, p. 201</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

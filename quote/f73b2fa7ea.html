<main class="wrap"><figure class="quote" id="q-f73b2fa7ea" data-kw="">
<blockquote><p>That [the moral law] alone being, in all the branches of it, conform and answerable to the Law of Nature written in Adam’s heart at his Creation. The Ceremonial Law being merely Positive, and instituted: Revealing only Gods instituted worship, and Typifying only supernatural Mysteries in Christ Jesus. And the Judicial Law being only of positive Institution for that Common-wealth of the Jews, and obliging formally as such no other Common-wealth in the world thereunto, though the Matter of some Judicials, so far as bottomed upon Moral principles and foundations, may also analogically oblige other godly and Christian Commonwealths. That alone being of perpetual force and power to all the Churches of God in all succeeding ages both under Old and New Testament. For, the Ceremonial Laws vanished at Christ’s Death, having received their accomplishment in him: And the Judicials expired at the dissolution of the Jewish Common-wealth. In these, and like respects, the Moral Law far excels the Ceremonial and Judicial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mystery and Marrow of the Bible: God’s Covenants with Man</cite>, (London: George Calvert, 1657), 3.4.1.2.3, p. 663.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>…in making orders and ceremonies of the Church it is not lawful to do what men list, but they are bound to follow the general rules of the Scripture that are given to be the square whereby those should be squared out. Which rules I will here set down as those which I would have as well all orders and ceremonies of the church framed by as by the which I wil be content that all those orders and ceremonies which are now in question whether they be good and convenient or no should be tried and examined by. And they are those rules which Paul gave in such cases as are not particularly mentioned of in scripture. The first, that they offend not any, especially the Church of God. (1 Cor. 10:32) The second is (that which you cite also out of Paul) that all be done in order and comliness. (1 Cor. 14:40) The third, that all be done to edifying. (1 Cor. 14:26) The last, that they be done to the glory of God. Rom. 6:7)</p></blockquote>

</figure><figure class="quote" id="q-88821cf794" data-kw="">
<blockquote><p>Conclusion 3. We hold that the Church of God has power to prescribe ordinances rules, or traditions, touching time and place of God’s worship, and touching order and comeliness to be used in the same: and in this regard, Paul, 1 Cor. 11:2, commends the Church of Corinth for keeping his traditions, and Acts 15, the Council at Jerusalem decreed that the Churches of the Gentiles should abstain from blood and from things strangled. This decree is termed a tradition, and it was in force among them so long as the offence of the Jews remained. And this kind of traditions, whether made by general councils or particular synods, we have care to maintain and observe; these caveats being remembered: First, that they prescribe nothing childish or absurd to be done: Secondly, that they be not imposed as any parts of God’s worship: Thirdly, that they be severed from superstition or opinion of merit: Lastly, that the Church of God be not burdened with the multitude of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholike</cite>, … ([Cambridge,] 1598), 7th Point, ‘Of Traditions’, pp. 136-7</span></figcaption>

<blockquote><p>The very many questions that the [Medieval] Scholastics usually raise on this point are foolish ones: whether it is permitted to use for baptism anything other than every-day water, or whether it is permitted to use lye [a liquor made from ashes of wood], urine, boiled or distilled water, or also wine, vinegar, or even sand or mud. For as they rashly identify many materials on the assumption that baptism is absolutely necessary, so we read that Christ and the apostles consecrated and used for this sacrament nothing other than every-day water, and therefore, and therefore since these materials lack any commandment or promise, they cannot be used in faith. Accordingly we see that also John preached in Aenon because there was much water there (John 3:23), and that Philip did not baptize the already believing Ethiopian until they came to a place where there was water (Acts 8:36). And since there is obviously nothing more common than water (so that it has even become a proverb), instances of that sort can arise very rarely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, (Brill, 2020), vol. 2, Disputation 44, ‘On the Sacrament of Baptism’, section 17, p. 145</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<main class="wrap"><figure class="quote" id="q-b5888ac32b" data-kw="">
<blockquote><p>Thomas Burnet… was… an influential thinker with many friends in high places, which is how he became the Chaplain to King William III and Clerk of the Closet. Burnet wrote ‘A Treatise Concerning the State of Departed Souls,’ where he argued for universal reconciliation and strongly repudiated the traditional view of eternal damnation… Burnet’s Treatise was published posthumously in 1720… Burnet did not deny that there would be a judgment for those who reject Christ or fail to repent of their sins, but he did not believe this judgment would last forever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/river-devereux.html">River Devereux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A History of Alternative Views of Hell in the Church of England’ (2025)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/hell.html">Hell</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bcdbb060e2" data-kw="Gehenna sheol">
<blockquote><p>Hell is called in Hebrew sheol, in Greek hades. Here we take it for the place of the damned, as it is taken in Lk. 16:23. Various synonyms of it occur in the Scriptures: perdition; Gehenna (Mt. 5:22, 29), a word derived from the valley of the children of Hinnom, in which the wicked Israelites were accustomed to practice horrible idolatries to Moloch.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.7.2</span></figcaption>

</figure><figure class="quote" id="q-c89fc9a1c8" data-kw="">
<blockquote><p>The complete whole of our race shall have been perfected from the first man to the last — some having at once in this life been cleansed from evil, others having afterwards in the necessary periods been healed by the Fire.” (On the Soul and the Resurrection, NPNF2 5:859-866)</p></blockquote>

</figure><figure class="quote" id="q-7ec1f22716" data-kw="hell sense loss">
<blockquote><p>Is there a hell? And what are its punishments—whether only of loss or also of sense? We affirm the latter. The execution of the sentence of the Judge will follow its promulgation. This will be carried out with respect to the wicked by casting them down into hell, where they must be tormented for ever with the devils; but with respect to the pious, by their introduction into heaven, to the joys of eternal life.</p></blockquote>

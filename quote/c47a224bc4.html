</figure><figure class="quote" id="q-915e624165" data-kw="">
<blockquote><p>Things inconvenient even in matters of religion may be commanded in some cases (Circumcision was a burden, Acts 15:10, and these burdens called ‘necessary things,’ v. 28, and they were said to do well if they observe them, v. 29.): as when it is to redeem a far worse inconvenience. For of two evils of punishments, the magistrate may take the less, as well as any other private man. And if that subjects, to prevent worse inconveniences, may use inconvenient ceremonies, then may the magistrate, to preuent worse inconveniences, command inconvenient ceremonies. If the apostles may use the inconvenient Jewish ceremonies, then the apostles may enjoin for a time the use of inconvenient ceremonies: as they did make ordinances about things which yet they called burdens, Acts 15.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 586-98 on 1 Pet. 2:13 in A Commentary: or Sermons upon the Second Chapter of the First Epistle of Saint Peter... (London, 1623)</cite>, pp. 590-91</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>I.: Why did our Savior Christ, of all other things in the world, select and consecrate bread and wine to be the symbols and representations of his body and blood? B.: In regard of the excellent analogy and likeness that is between the one and the other, in their several properties and effects.</p></blockquote>

</figure><figure class="quote" id="q-cb1630fbc8" data-kw="">
<blockquote><p>Though these [circumstances of worship] also, when they have a religious respect put on them, are made essential, and come under the things our Saviour here refers to [Mat. 15:9]. But a thing may then be said to be made a part of worship, when it hath such an holiness put upon it, as to be reputed a medium of our communion with God. And this is not to be judged of by what men say of it, but by the necessary consequence of the usage of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sinfulness of Worshipping God with Men’s Institutions, as it was Delivered in a Sermon (Boston, 1691)</cite>, pp. 7-8</span></figcaption>

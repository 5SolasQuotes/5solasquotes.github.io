<main class="wrap"><figure class="quote" id="q-7fbf23b427" data-kw="">
<blockquote><p>It is true, that CHRIST his death is a sufficient price of ransom for the sins of the whole world: Yea of more worlds, if there were more then one, for his blood and his sufferings, whereby he redeemed us, were the blood and sufferings of him that was and is God but yet they are effectual only to those that do believe.

For if CHRIST had redeemed all men, then all should be saved. For all that are redeemed are also justified, &amp; all that are justified shall be glorified For, for whom CHRIST died, for them he hath satisfied the justice of his father, so that there is no condemnation to them, whom CHRIST hath redeemed.

For whom CHRIST died, them by his death he reconciled to God, now they, who when they were enemies were reconciled to God by the death of his Son; much more being reconciled shall be saved by his life: Neither may we think, that CHRIST would die for them, for whom he would not pray. But for the world saith he, that is for the company of the wicked and reprobates I pray not but for them whom thou hast given me out of the world.

But if the Oath of an honest man, ought to be the end of controversy, much more ought the Oath of God in this place end this controversy concerning universal redemption. For God hath sworn, that to so many as he redeemeth, he will give them to worship him in holiness and righteousness. But the greater part of mankind have never the grace to worship God in holiness and righteousness, and therefore to them the benefit of redemption doth not belong.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Grace or An Exposition upon Luke 1. 73.74.75</cite>, (Dublin, 1631), pp 40-41.</span></figcaption>

<blockquote><p>In the original language of the Old Testament, the word which we translate covenant is, according to some, derived from a root that signifies, to cut down, or cut off; because in ancient times, it was, in making a solemn covenant, usual for the parties contracting, to cut beasts for sacrifice in two, and to pass between the parts of them, in order to confirm their agreement. According to others, it is more properly derived from a root that signifies, to choose; and is expressive of the nature of a free compact: for, in every such compact, a choice is made of the parties between whom, of the objects about which, and of the conditions on which, the agreement is made.

Now that word is, in the Old Testament, employed by the sacred writers, to express the covenant of grace, considered as a compact, or covenant properly so called, or, as made from all eternity, between the Father, and the Son as the last Adam. In this sense, it is used especially in Psalm Ixxxix. 3, where the eternal Father saith, “I have made a covenant with my chosen One”—The same word is also used, and used most frequently, to signify the covenant of grace, considered as a testament or testamentary deed, and as manifested to sinners, in time. It is employed to express that glorious covenant, as published and offered to sinners; as accepted by the faith of elect sinners; as ratified by the sacraments; and by the internal sealing of the Holy Spirit, by which it is rendered effectual In a word, it is often used, to express the covenant in its testamentary form, as administered by the Lord Jesus Christ, to sinners of mankind.

The term in the original language of the New Testament, by which, the inspired Penmen of it, have translated the one above mentioned, from the Old; is in like manner used by them, sometimes, to express the covenant of grace, considered as a proper compact, or federal settlement, between the Father, and the Son as the Representative of his elect. In this sense, the apostle Paul uses it, in Heb. vii 22., when he says, “By so much, was Jesus made a Surety of a better covenant.” The same term is also used by the Apostle, in the same Epistle, to signify the same covenant, as turned into a testament or testamentary disposition. “And for this cause,” says he, “he is the Mediator of the new testament, that by means of death for the redemption of the transgressions that were under the first testament, they which are called, might receive the promise of eternal inheritance. For where a testament is, there must also of necessity be the death of the Testator. For a testament is of force, after men are dead: otherwise it is of no strength at all, while the Testator liveth.”

The blessings of Salvation are, in the 15th verse, styled “the eternal inheritance” because they are not given to believers, on condition of the good works which they perform; but are bequeathed to them, in a testament, ratified by the death of the blessed Testator. As the covenant, considered as administered to sinners of mankind, is of a testamentary form, in which, the Lord Jesus, who purchased all the benefits of it, and who, as the Trustee of it, has them all committed to him, actually bequeaths them to poor sinners; so it was necessary, that by his death, he should render it, as a testamentary deed, firm and irreversible.

The same word is likewise employed, by the apostle Paul, to express at once, the idea, both of a covenant properly so called, and of a testament In his epistle to the Galatians, he says, “Brethren, I speak after the manner of men: Though it be but a man’s covenant, yet if it be confirmed, no man disannulleth, or addeth thereto.” Here, the term is used in a mixed sense; to signify the covenant of grace, considered both as a covenant, and as a testament, or as a testamentary covenant. This glorious covenant, was made to assume a testamentary form, in every dispensation of it; whether as typically confirmed, by the death of typical sacrifices, or as actually ratified, by the death of Jesus Christ.

Thus then, it is manifest from the original terms, which are used in sacred Scripture, to express the covenant of grace, that this august contract is to be considered, on the one hand, as a covenant or compact properly so called, and on the other, as a testamentary disposition or deed of conveyance. In respect of Christ, it is a proper covenant; in regard to us, it is a testament: considered as made in eternity, it is a covenant, a covenant of redeeming grace; considered as administered to sinners in time, it is a testament, ratified by the death of the adorable Testator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), pp 7-10.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

— John Colquhoun, A Treatise of the Covenant of Grace, (Edinburgh: Ogle, Allardice and Thomson, 1818), pp 7-10.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+the+original+language+of+the+Old+Testament%2C+the+word+which+we+translate+covenant+is%2C+according+to+some%2C+derived+from+a+root+that+signifies%2C+to+cut+down%2C+or+cut+off%3B+because+in+ancient+times%2C+it+was%2C+in+making+a+solemn+covenant%2C+usual+for+the+parties+contracting%2C+to+cut+beasts+for+sacrifice+in+two%2C+and+to+pass+between+the+parts+of+them%2C+in+order+to+confirm+their+agreement.+According+to+others%2C+it+is+more+properly+derived+from+a+root+that+signifies%2C+to+choose%3B+and+is+expressive+of+the+nature+of+a+free+compact%3A+for%2C+in+every+such+compact%2C+a+choice+is+made+of+the+parties+between+whom%2C+of+the+objects+about+which%2C+and+of+the+conditions+on+which%2C+the+agreement+is+made.%0A%0ANow+that+word+is%2C+in+the+Old+Testament%2C+employed+by+the+sacred+writers%2C+to+express+the+covenant+of+grace%2C+considered+as+a+compact%2C+or+covenant+properly+so+called%2C+or%2C+as+made+from+all+eternity%2C+between+the+Father%2C+and+the+Son+as+the+last+Adam.+In+this+sense%2C+it+is+used+especially+in+Psalm+Ixxxix.+3%2C+where+the+eternal+Father+saith%2C+%E2%80%9CI+have+made+a+covenant+with+my+chosen+One%E2%80%9D%E2%80%94The+same+word+is+also+used%2C+and+used+most+frequently%2C+to+signify+the+covenant+of+grace%2C+considered+as+a+testament+or+testamentary+deed%2C+and+as+manifested+to+sinners%2C+in+time.+It+is+employed+to+express+that+glorious+covenant%2C+as+published+and+offered+to+sinners%3B+as+accepted+by+the+faith+of+elect+sinners%3B+as+ratified+by+the+sacraments%3B+and+by+the+internal+sealing+of+the+Holy+Spirit%2C+by+which+it+is+rendered+effectual+In+a+word%2C+it+is+often+used%2C+to+express+the+covenant+in+its+testamentary+form%2C+as+administered+by+the+Lord+Jesus+Christ%2C+to+sinners+of+mankind.%0A%0AThe+term+in+the+original+language+of+the+New+Testament%2C+by+which%2C+the+inspired+Penmen+of+it%2C+have+translated+the+one+above+mentioned%2C+from+the+Old%3B+is+in+like+manner+used+by+them%2C+sometimes%2C+to+express+the+covenant+of+grace%2C+considered+as+a+proper+compact%2C+or+federal+settlement%2C+between+the+Father%2C+and+the+Son+as+the+Representative+of+his+elect.+In+this+sense%2C+the+apostle+Paul+uses+it%2C+in+Heb.+vii+22.%2C+when+he+says%2C+%E2%80%9CBy+so+much%2C+was+Jesus+made+a+Surety+of+a+better+covenant.%E2%80%9D+The+same+term+is+also+used+by+the+Apostle%2C+in+the+same+Epistle%2C+to+signify+the+same+covenant%2C+as+turned+into+a+testament+or+testamentary+disposition.+%E2%80%9CAnd+for+this+cause%2C%E2%80%9D+says+he%2C+%E2%80%9Che+is+the+Mediator+of+the+new+testament%2C+that+by+means+of+death+for+the+redemption+of+the+transgressions+that+were+under+the+first+testament%2C+they+which+are+called%2C+might+receive+the+promise+of+eternal+inheritance.+For+where+a+testament+is%2C+there+must+also+of+necessity+be+the+death+of+the+Testator.+For+a+testament+is+of+force%2C+after+men+are+dead%3A+otherwise+it+is+of+no+strength+at+all%2C+while+the+Testator+liveth.%E2%80%9D%0A%0AThe+blessings+of+Salvation+are%2C+in+the+15th+verse%2C+styled+%E2%80%9Cthe+eternal+inheritance%E2%80%9D+because+they+are+not+given+to+believers%2C+on+condition+of+the+good+works+which+they+perform%3B+but+are+bequeathed+to+them%2C+in+a+testament%2C+ratified+by+the+death+of+the+blessed+Testator.+As+the+covenant%2C+considered+as+administered+to+sinners+of+mankind%2C+is+of+a+testamentary+form%2C+in+which%2C+the+Lord+Jesus%2C+who+purchased+all+the+benefits+of+it%2C+and+who%2C+as+the+Trustee+of+it%2C+has+them+all+committed+to+him%2C+actually+bequeaths+them+to+poor+sinners%3B+so+it+was+necessary%2C+that+by+his+death%2C+he+should+render+it%2C+as+a+testamentary+deed%2C+firm+and+irreversible.%0A%0AThe+same+word+is+likewise+employed%2C+by+the+apostle+Paul%2C+to+express+at+once%2C+the+idea%2C+both+of+a+covenant+properly+so+called%2C+and+of+a+testament+In+his+epistle+to+the+Galatians%2C+he+says%2C+%E2%80%9CBrethren%2C+I+speak+after+the+manner+of+men%3A+Though+it+be+but+a+man%E2%80%99s+covenant%2C+yet+if+it+be+confirmed%2C+no+man+disannulleth%2C+or+addeth+thereto.%E2%80%9D+Here%2C+the+term+is+used+in+a+mixed+sense%3B+to+signify+the+covenant+of+grace%2C+considered+both+as+a+covenant%2C+and+as+a+testament%2C+or+as+a+testamentary+covenant.+This+glorious+covenant%2C+was+made+to+assume+a+testamentary+form%2C+in+every+dispensation+of+it%3B+whether+as+typically+confirmed%2C+by+the+death+of+typical+sacrifices%2C+or+as+actually+ratified%2C+by+the+death+of+Jesus+Christ.%0A%0AThus+then%2C+it+is+manifest+from+the+original+terms%2C+which+are+used+in+sacred+Scripture%2C+to+express+the+covenant+of+grace%2C+that+this+august+contract+is+to+be+considered%2C+on+the+one+hand%2C+as+a+covenant+or+compact+properly+so+called%2C+and+on+the+other%2C+as+a+testamentary+disposition+or+deed+of+conveyance.+In+respect+of+Christ%2C+it+is+a+proper+covenant%3B+in+regard+to+us%2C+it+is+a+testament%3A+considered+as+made+in+eternity%2C+it+is+a+covenant%2C+a+covenant+of+redeeming+grace%3B+considered+as+administered+to+sinners+in+time%2C+it+is+a+testament%2C+ratified+by+the+death+of+the+adorable+Testator.%E2%80%9D%0A%0A%E2%80%94+John+Colquhoun%2C+A+Treatise+of+the+Covenant+of+Grace%2C+%28Edinburgh%3A+Ogle%2C+Allardice+and+Thomson%2C+1818%29%2C+pp+7-10.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4dd04179ab.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4dd04179ab.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/12/20/john-colquhoun-on-the-covenant-of-grace-as-a-testamentary-deed/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-188acf59c2" data-kw="">
<blockquote><p>Whereas it has pleased the Lord to move the Heart of our dread Sovereign Charles [I] by the Grace of God King etc. to grant license and liberty to sundry of his subjects to plant themselves in the Western parts of America. We… considering with ourselves the holy Will of God and our own Necessity that we should not live without wholesome Laws and Civil Government among us… do in the name of Christ and in the sight of God combine ourselves together to erect and set up among us such Government as shall be to our best discerning agreeable to the Will of God… and binding of ourselves solemnly by the Grace and Help of Christ and in His Name and fear to submit ourselves to such Godly and Christian Laws as are established in the realm of England… which shall… be made and enacted among us according to God that we may live quietly and peaceably together in all godliness and honest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/new-hampshire.html">New Hampshire</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Agreement of the Settlers at Exeter in New Hampshire, 1639 (Thorpe, 4.2445)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>33. That, as it is the duty of every man to worship God in such a manner as he thinks most acceptable to Him; all persons, professing the Christian religion, are equally entitled to protection in their religions liberty… the Legislature may, in their discretion, lay a general and equal tax, for the support of the Christian religion… And all acts of Assembly, lately passed, for collecting monies for building or repairing particular churches or chapels of ease, shall continue in force, and be executed… …and every encumbent of the church of England, who has remained in his parish, and performed his duty, shall be entitled to receive the provision and support established by the act, entitled ‘An act for the support of the clergy of the church of England, in this Province,’… … 35. That no other test or qualification ought to be required on admission to any office of trust or profit, than such oath of support and fidelity to this State, and such such oath of office, as shall be directed by this Convention, or the Legislature of this State, and a declaration of a belief in the Christian religion. 36. That the manner of administering an oath to any person, ought to be such, as those of the religious persuasion, profession, or denomination, of which such person is one, generally esteem the most effectual confirmation, by the attestation of the Divine Being…</p></blockquote>

-principle-in-the-american-westminster-standards-and-early-american-states/#:~:text=33.%20That%2C%20as%20it%20is%20the,the%20attestation%20of%20the%20Divine%20Being&amp;text=33.%20That%2C%20as%20it%20is%20the%20duty%20of&amp;text=confirmation%2C%20by%20the%20attestation%20of%20the%20Divine%20Being" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4a1d55b285" data-kw="">
<blockquote><p>Papists exempt their clergy from the judgment of the civil power (though they be delinquents against it) and their [e]states, both civil and spiritual, from civil taxes, tributes, and penalties, both which [papal positions] we deny to ours, for: (1) This is repugnant to the law of nature, that church officers and members, as parts and members of the commonwealth, should not be subject to the government of that commonwealth whereof they are parts. (2) [This is] repugnant to the laws and practices of the Old Testament, under which we read of no such exemptions. Yea, we have instance of Abiathar the highpriest, who, for his partnership with Adonijah in his rebellion, was exiled by king Solomon, and so consequently deprived of the exercise of his office (1 Kings 2:26-27). (3) [This is] inconsistent with our Savior’s example, who, as subject to the law, held himself obliged to pay tribute to avoid offence (Mt. 17:26), which was an active scandal; and He confesses Pilate’s power to condemn or release Him was given Him from above (John 19:11). (4) And finally, [this is] contrary to the apostolical precepts, enjoining all to be subject to superior powers (Rom. 13:1-4; 1 Pet. 2:13-15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/london-presbyterians.html">London Presbyterians</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jus Divinum, the Divine Right of Church Government… (1646, 1647, 1654; NY: Robert Martin &amp; Co., 1844), pt. 2, ch. 9, section 1, ‘Of the Proper Receptacle &amp; Distinct Subject of All this Power &amp; Authority of Church Government… That the Political Magistrate is Not the Proper Subject of this Power’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-c3e0589a64" data-kw="">
<blockquote><p>Then the true state of the question is not whether the sword be a means of conversion of men to the true faith, nor 2. whether heathen by fire and sword are to be compelled to embrace the truth [which is denied], nor 3. whether violence without instruction and arguing from light of scriptures, should be used against false teachers, nor 4. whether the Magistrate can punish the opinions of the mind, and strain internal liberty. But whether or no ought the godly and Christian prince restrain and punish with the sword false teachers, publishers of heretical and pernicious doctrines, which may be proved by witness, and tends to the injuring of the souls of the people of God, in a Christian society, and are dishonorable to God, and contrary to sound doctrine; and so coerce men for external misdemeanors flowing from a practical conscience sinning against the second table, as well as from a speculative conscience (to borrow these terms here) when they profess and are ready to swear they perform these externals merely from and for conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience (1649), Ch. 4, ‘The state of the question of compulsion of conscience and toleration’</cite>, p. 57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

20question%20is&amp;text=perform%20these%20externals%20merely%20from%20and%20for%20conscience" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7810b67d81" data-kw="">
<blockquote><p>But far be it from me to argue with Bellarmme (de poenit. bk. 3, ch. 2) from Uzziah’s bodily leprosy to infer that any prince who is spiritually leprous and turned heretical, is presently to be dethroned. Nothing can dethrone a king but such tyranny as is inconsistent with his royal office. Nor durst I infer that kings, now a-days, may be removed from actual government for one single transgression. It is true, eighty priests, and the whole kingdom, so serving king Uzziah (their motives, I know, were divine) proves well that the subjects may punish the transgression of God’s express law in the king, in some cases even to remove him from the throne;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843) | Question 44</cite>, pp. 231-32</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But far be it from me to argue with Bellarmme (de poenit. bk. 3, ch. 2) from Uzziah’s bodily leprosy to infer that any prince who is spiritually leprous and turned heretical, is presently to be dethroned. Nothing can dethrone a king but such tyranny as is inconsistent with his royal office. Nor durst I infer that kings, now a-days, may be removed from actual government for one single transgression. It is true, eighty priests, and the whole kingdom, so serving king Uzziah (their motives, I know, were divine) proves well that the subjects may punish the transgression of God’s express law in the king, in some cases even to remove him from the throne;”

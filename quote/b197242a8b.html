<main class="wrap"><figure class="quote" id="q-b197242a8b" data-kw="">
<blockquote><p>Chrysostom, speaking of such has are subject to bishops, says, it is in their power to obey or not. Liberty in things indifferent, says Amandus Polanus, is that through which Christians are free in use of or abstinence from indifferent things. Calvin, speaking of our liberty in things indifferent, says, We may sometimes observe, sometimes disregard them indiscriminately, and places this liberty more in the abstaining then in the using. It is marked of the rites of the ancient church, that the observance of these ceremonies were without obligation in the church. And what means the apostle while [when] he says,”if ye be dead with Christ from the rudiments of the world, why as though living in the world, are you subject to the ordinances (touch not, taste not, handle not; which are all to perish with the using;) after the commandments and doctrines of men” (Col. 2:20–22?) Sure[ly] he condemns not only humana decreta de ritibus [not only human ordinances concerning ceremonies], but also subjection and obedience to such ordinances of men as take from liberty of practice in the use of things indifferent, obedience (I say) for conscience of their ordinances merely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against The English Popish Ceremonies Obtruded On The Church Of Scotland</cite>, ed. Chris Coldwell (Dallas: Naphtali Press, rev. edition, 2013), 27–28.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>‘Occasional‘, properly, is that which has a reason, not from the nature of the thing itself, but from such occasional occurrences of providence, as God will not alter, and its that which has no moral nor sacred conveniency with the nature of worship, but has only a conveniency for such a time and place, as Christ’s preaching in a ship, when He is at the sea side, and a multitude are to hear Him, the ship has no agreement with the nature of preaching, more than a house has. Time, place, and persons are clearly such as agreed with that [Last] Supper, as [a supper] first, not as a sacred worship; and therefore [these particulars] were merely occasional, and so not imitable [by us]; and though Christ might have altered them, yet had they been occasional, and they have no sacred conveniency with this Supper, as this Supper; and if Christ had altered these for mere will, upon no reasons that concerns all suppers, they had not been occasional, but positive points of worship, and so had obliged us;</p></blockquote>

iged%20us" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-225a1af2b5" data-kw="">
<blockquote><p>By the Diataktic [Teaching] power [of the Church,] a synod may institute, restore or change, according to the condition and exigence of the Church, the external circumstances in the worship of God and ecclesiastical discipline: I mean those circumstances which are common both to civil and sacred societies, the conveniency whereof is determinable by the light of Nature, always observing the general rules of the Word, which commands that all be done to the glory of God, that all be done to edifying, that all be done in order and decency, that we give none offence, that we support the weak, that we give no place to the enemies of the truth, nor symbolize with idolaters, etc. Now for avoiding disorder and disconformity in a nation professing one religion [such as Scotland], it is fit that national synods give certain directions and rules even concerning these rites and circumstances, not having therein an arbitrary or autocratoric power, but being always tied to follow the rules foresaid.</p></blockquote>

<blockquote><p>In liberty, not only spiritual (which also existed in the Old Testament), but also external, by which we are free from the legal ceremonies (Col. 2:20–22) and besides are become the servants of Christ alone and not of men (Gal. 5:1).</p></blockquote>

</figure><figure class="quote" id="q-4a2f105d7d" data-kw="">
<blockquote><p>Moreover, as we may not use any indifferent thing at our own pleasure; so neither may the Church at her will and pleasure command the use of it: but as our practice, so the Church’s injunction must be determined and squared according to the former [three] rules [of using indifferent things (1) to the glory of God, (2)according to the law of charity and (3) purity of conscience]. And if any man think, that in the use of things indifferent he may be led and ruled by the Church’s determination without examining any further, let him understand that the Church’s determination is but a subordinate rule, or a rule ruled by higher rules. … He [Dr. Forbes] has been speaking of the rules which God’s Word gives us concerning the use of things indifferent, and all of them he comprehends under this rule, that we should hear the Church and obey them who are set over us, as if God’s rules were subordinate to men’s rules and not theirs to his. We say not that every man may use things indifferent suo arbitratu [according to his judgment]: but we say withal that neither may the Church command the use of things indifferent, suo arbitratu. Both, she in commanding and we in obeying, must be guided by the rules of Scripture. They who are set over us in the Church have no power given them of Christ which is not for edifying, Eph. 4:12. The council of the apostles and elders at Jerusalem (which is a lively pattern of a lawful synod to the world’s end) professed they would lay no other burden upon the disciples except such things as the law of charity made necessary for shunning of scandal: and so that which they decreed had force and strength to bind, a Charitate propter Scandalum [from charity due to scandal], says Sanctius. But suo arbitratu [by their (mere) judgment] they enjoined nothing. It appears by this place (says [Thomas] Cartwright) that there may be no abridgment of liberty simply decreed, but in regard of circumstance, according to the rule of edification. And if the Church’s decrees and canons be not according to the rules of the Word, yet forasmuch as everyone of us shall give account of himself and his own deed, we must look that whatsoever the Church decree, yet our practice in the use or omission of a thing indifferent, be according to the foresaid rules. We may not for the commandment of men transgress the rule of piety by doing anything which is not for God’s glory and ordered according to his will; neither ought any of us to obey men, except for the Lord’s sake and as the servants of Christ, doing the will of God; which teaches us the manner how we ought to obey men, namely, propter Christum et sicut Christus praecipit [for Christ, as Christ commands]. For if we should know no more but the will of man for that which we do, then we should be the servants of men, not the servants of Christ. Neither yet may we for any human ordinance break the rule of charity: but whatsoever either would weaken or not edify our brother, be it never so lawful, never so profitable to ourselves, never so powerfully by earthly authority enjoined, Christians, who are not born unto themselves, but unto Christ, unto his Church and unto the fellow members, must not dare to meddle with it. Nor lastly may we obey men so as to break the Law of Purity, and perform any action with a doubtful conscience, that is, whereof either the Word has not, or we out of it have no warrant: in which case tender consciences must be tendered, rather than be racked by authority: for be the things in themselves never so lawful, etc., they are utterly unlawful to me without such information. Whereas therefore some say that in the use of matters indifferent, the laws of those who are set over us ought to rule us; we still answer that our practice may not be ruled by any law of man except it be according to the rules of the Word; whereof one is this: Tantum oportere esse obedientiae studium in Christianis, ut nihil agant, quod non existiment vel potius certi sint placere Deo (Calvin on Rom. 14:5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, ... ([Leiden] 1637), pt. 4, ch. 3, pp. 10-11</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Moreover, as we may not use any indifferent thing at our own pleasure; so neither may the Church at her will and pleasure command the use of it: but as our practice, so the Church’s injunction must be determined and squared according to the former [three] rules [of using indifferent things (1) to the glory of God, (2)according to the law of charity and (3) purity of conscience]. And if any man think, that in the use of things indifferent he may be led and ruled by the Church’s determination without examining any further, let him understand that the Church’s determination is but a subordinate rule, or a rule ruled by higher rules. … He [Dr. Forbes] has been speaking of the rules which God’s Word gives us concerning the use of things indifferent, and all of them he comprehends under this rule, that we should hear the Church and obey them who are set over us, as if God’s rules were subordinate to men’s rules and not theirs to his. We say not that every man may use things indifferent suo arbitratu [according to his judgment]: but we say withal that neither may the Church command the use of things indifferent, suo arbitratu. Both, she in commanding and we in obeying, must be guided by the rules of Scripture. They who are set over us in the Church have no power given them of Christ which is not for edifying, Eph. 4:12. The council of the apostles and elders at Jerusalem (which is a lively pattern of a lawful synod to the world’s end) professed they would lay no other burden upon the disciples except such things as the law of charity made necessary for shunning of scandal: and so that which they decreed had force and strength to bind, a Charitate propter Scandalum [from charity due to scandal], says Sanctius. But suo arbitratu [by their (mere) judgment] they enjoined nothing. It appears by this place (says [Thomas] Cartwright) that there may be no abridgment of liberty simply decreed, but in regard of circumstance, according to the rule of edification. And if the Church’s decrees and canons be not according to the rules of the Word, yet forasmuch as everyone of us shall give account of himself and his own deed, we must look that whatsoever the Church decree, yet our practice in the use or omission of a thing indifferent, be according to the foresaid rules. We may not for the commandment of men transgress the rule of piety by doing anything which is not for God’s glory and ordered according to his will; neither ought any of us to obey men, except for the Lord’s sake and as the servants of Christ, doing the will of God; which teaches us the manner how we ought to obey men, namely, propter Christum et sicut Christus praecipit [for Christ, as Christ commands]. For if we should know no more but the will of man for that which we do, then we should be the servants of men, not the servants of Christ. Neither yet may we for any human ordinance break the rule of charity: but whatsoever either would weaken or not edify our brother, be it never so lawful, never so profitable to ourselves, never so powerfully by earthly authority enjoined, Christians, who are not born unto themselves, but unto Christ, unto his Church and unto the fellow members, must not dare to meddle with it. Nor lastly may we obey men so as to break the Law of Purity, and perform any action with a doubtful conscience, that is, whereof either the Word has not, or we out of it have no warrant: in which case tender consciences must be tendered, rather than be racked by authority: for be the things in themselves never so lawful, etc., they are utterly unlawful to me without such information. Whereas therefore some say that in the use of matters indifferent, the laws of those who are set over us ought to rule us; we still answer that our practice may not be ruled by any law of man except it be according to the rules of the Word; whereof one is this: Tantum oportere esse obedientiae studium in Christianis, ut nihil agant, quod non existiment vel potius certi sint placere Deo (Calvin on Rom. 14:5).”

— George Gillespie, A Dispute Against the English-Popish Ceremonies... ([Leiden] 1637), pt. 4, ch. 3, pp. 10-11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMoreover%2C+as+we+may+not+use+any+indifferent+thing+at+our+own+pleasure%3B+so+neither+may+the+Church+at+her+will+and+pleasure+command+the+use+of+it%3A+but+as+our+practice%2C+so+the+Church%E2%80%99s+injunction+must+be+determined+and+squared+according+to+the+former+%5Bthree%5D+rules+%5Bof+using+indifferent+things+%281%29+to+the+glory+of+God%2C+%282%29according+to+the+law+of+charity+and+%283%29+purity+of+conscience%5D.+And+if+any+man+think%2C+that+in+the+use+of+things+indifferent+he+may+be+led+and+ruled+by+the+Church%E2%80%99s+determination+without+examining+any+further%2C+let+him+understand+that+the+Church%E2%80%99s+determination+is+but+a+subordinate+rule%2C+or+a+rule+ruled+by+higher+rules.+%E2%80%A6+He+%5BDr.+Forbes%5D+has+been+speaking+of+the+rules+which+God%E2%80%99s+Word+gives+us+concerning+the+use+of+things+indifferent%2C+and+all+of+them+he+comprehends+under+this+rule%2C+that+we+should+hear+the+Church+and+obey+them+who+are+set+over+us%2C+as+if+God%E2%80%99s+rules+were+subordinate+to+men%E2%80%99s+rules+and+not+theirs+to+his.+We+say+not+that+every+man+may+use+things+indifferent+suo+arbitratu+%5Baccording+to+his+judgment%5D%3A+but+we+say+withal+that+neither+may+the+Church+command+the+use+of+things+indifferent%2C+suo+arbitratu.+Both%2C+she+in+commanding+and+we+in+obeying%2C+must+be+guided+by+the+rules+of+Scripture.+They+who+are+set+over+us+in+the+Church+have+no+power+given+them+of+Christ+which+is+not+for+edifying%2C+Eph.+4%3A12.+The+council+of+the+apostles+and+elders+at+Jerusalem+%28which+is+a+lively+pattern+of+a+lawful+synod+to+the+world%E2%80%99s+end%29+professed+they+would+lay+no+other+burden+upon+the+disciples+except+such+things+as+the+law+of+charity+made+necessary+for+shunning+of+scandal%3A+and+so+that+which+they+decreed+had+force+and+strength+to+bind%2C+a+Charitate+propter+Scandalum+%5Bfrom+charity+due+to+scandal%5D%2C+says+Sanctius.+But+suo+arbitratu+%5Bby+their+%28mere%29+judgment%5D+they+enjoined+nothing.+It+appears+by+this+place+%28says+%5BThomas%5D+Cartwright%29+that+there+may+be+no+abridgment+of+liberty+simply+decreed%2C+but+in+regard+of+circumstance%2C+according+to+the+rule+of+edification.+And+if+the+Church%E2%80%99s+decrees+and+canons+be+not+according+to+the+rules+of+the+Word%2C+yet+forasmuch+as+everyone+of+us+shall+give+account+of+himself+and+his+own+deed%2C+we+must+look+that+whatsoever+the+Church+decree%2C+yet+our+practice+in+the+use+or+omission+of+a+thing+indifferent%2C+be+according+to+the+foresaid+rules.+We+may+not+for+the+commandment+of+men+transgress+the+rule+of+piety+by+doing+anything+which+is+not+for+God%E2%80%99s+glory+and+ordered+according+to+his+will%3B+neither+ought+any+of+us+to+obey+men%2C+except+for+the+Lord%E2%80%99s+sake+and+as+the+servants+of+Christ%2C+doing+the+will+of+God%3B+which+teaches+us+the+manner+how+we+ought+to+obey+men%2C+namely%2C+propter+Christum+et+sicut+Christus+praecipit+%5Bfor+Christ%2C+as+Christ+commands%5D.+For+if+we+should+know+no+more+but+the+will+of+man+for+that+which+we+do%2C+then+we+should+be+the+servants+of+men%2C+not+the+servants+of+Christ.+Neither+yet+may+we+for+any+human+ordinance+break+the+rule+of+charity%3A+but+whatsoever+either+would+weaken+or+not+edify+our+brother%2C+be+it+never+so+lawful%2C+never+so+profitable+to+ourselves%2C+never+so+powerfully+by+earthly+authority+enjoined%2C+Christians%2C+who+are+not+born+unto+themselves%2C+but+unto+Christ%2C+unto+his+Church+and+unto+the+fellow+members%2C+must+not+dare+to+meddle+with+it.+Nor+lastly+may+we+obey+men+so+as+to+break+the+Law+of+Purity%2C+and+perform+any+action+with+a+doubtful+conscience%2C+that+is%2C+whereof+either+the+Word+has+not%2C+or+we+out+of+it+have+no+warrant%3A+in+which+case+tender+consciences+must+be+tendered%2C+rather+than+be+racked+by+authority%3A+for+be+the+things+in+themselves+never+so+lawful%2C+etc.%2C+they+are+utterly+unlawful+to+me+without+such+information.+Whereas+therefore+some+say+that+in+the+use+of+matters+indifferent%2C+the+laws+of+those+who+are+set+over+us+ought+to+rule+us%3B+we+still+answer+that+our+practice+may+not+be+ruled+by+any+law+of+man+except+it+be+according+to+the+rules+of+the+Word%3B+whereof+one+is+this%3A+Tantum+oportere+esse+obedientiae+studium+in+Christianis%2C+ut+nihil+agant%2C+quod+non+existiment+vel+potius+certi+sint+placere+Deo+%28Calvin+on+Rom.+14%3A5%29.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+A+Dispute+Against+the+English-Popish+Ceremonies...+%28%5BLeiden%5D+1637%29%2C+pt.+4%2C+ch.+3%2C+pp.+10-11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4a2f105d7d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4a2f105d7d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-arbitrary-laws-commands/#:~:text=Moreover%2C%20as%20we%20may%20not%20use,placere%20Deo%20%28Calvin%20on%20Rom.%2014%3A5&amp;text=Moreover%2C%20as%20we%20may%20not%20use%20any%20indifferent&amp;text=certi%20sint%20placere%20Deo%20%28Calvin%20on%20Rom.%2014%3A5" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

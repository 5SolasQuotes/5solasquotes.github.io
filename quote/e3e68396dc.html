<main class="wrap"><figure class="quote" id="q-e3e68396dc" data-kw="">
<blockquote><p>The Form and Manner of Baptizing Pagans, Jews, Mahometans and Anabaptists Converted to the Christian Faith; Composed by the National Synod of the Reformed Churches of France, Assembled at Charenton, in the Year 1645. …

Quest. 1. Do you not believe that the Scriptures of the Old and New Testament be inspired of God, and contain his whole Counsel for the Salvation of Men, and are the only perfect Rule of Faith and Life?

Answ. Yes.

Quest. 2. Do not you believe that Jesus the Son of the Blessed Virgin Mary, who was Conceived in her by the Virtue of the Holy Ghost, and Formed as to the Flesh out of her own Substance, is God and Man, Blessed for evermore, perfect God, and perfect Man; Man born of a Woman in due fulness of time, and God begotten of the Father from Everlasting?

Answ. Yes.

Quest. 3. Do not you believe that the Lord Jesus, from his first Conception after the Flesh, was Holy, Innocent, without Blemish, and separate from Sinners; and that he did not suffer Death for his own Sins, but for ours only?

Answ. Yes.

Quest. 4. Do not you believe that his Death is the Propitiation for our Sins, yea, and for the Sins of the whole World; and that this Propitiation is infinitely Meritorious, through which Everlasting Glory and Salvation were purchased for us?

Answ. Yes.

Quest. 5. Do not you believe that Mahomet was an Impostor, and that his Alcoran is a Sacrilegious Heap of Idle Fancies, full of Absurdities, broached on design to set up a False and Abominable Religion?

Answ. Yes.

Quest. 6. Do not you believe that the Gospel of our Lord Jesus is the power of God unto Salvation, to every one that believeth; and that in the Christian Religion, only God the Father hath revealed his good Will and Pleasure for the Salvation of Men, until the End of the World, and that since its Revelation, there is not any new Religion to be expired [expected?], for that the Lord Christ is the only great Prophet promised unto the Faithful of the Old Testament; and that God having formerly spoken at sundry times, and in divers manners unto Men, before the Law, and under the Law, hath spoken to the Church of the New Testament, by the Mouth of his only Son the Lord Jesus?

Answ. Yes.

Quest. Give an Account of your Creed.

Answ. I believe in God, the Father Almighty, Creator of, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-quick.html">John Quick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synodicon in Galliâ Reformatâ; of the Acts, Canons, Decisions, and Decrees, of the Four Last National Synods of the Reformed Churches of France. The Second Part of the Second Volume</cite>, (London: Thomas Parkhurst and Jonathan Robinson, 1691), 2: 449.</span></figcaption>

<blockquote><p>A question here ariseth about infants; Whether they are to be baptized, or not, seeing they cannot be taught or instructed about faith? I answer that the children, or infants of believers ought to be baptized, because while they are yet infants, as to the external privileges of the Covenant with God, they are accounted both persons and parties of, or belonging to their parents; and therefore they are of the family of Christ, or of the number of his disciples. For if the Covenant made with Abraham be the same for substance, by which we are saved, and belongeth as much to us and to our children as it did to Abraham and his posterity, then not only we, but our children also ought to be partakers of the seal of this Covenant. But the first is true, as appeareth by Rom. 4 and other places; and therefore the latter also is true.</p></blockquote>

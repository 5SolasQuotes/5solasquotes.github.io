<main class="wrap"><figure class="quote" id="q-8593423a17" data-kw="">
<blockquote><p>The Fathers, as Augustine, Chrysostom, Ambrose, Jerome; the Schoolmen, as Aquinas, D. Bannez, Suarez (On Faith, Hope &amp; Love, ch. 8, de con.), say, correcting of our brother is (sublevatio miseriae peccantis) ‘a succouring of the misery of a sinner’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea… (London: 1644)</cite>, ch. 2, p. 27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bd83c980d6" data-kw="necessity amp">
<blockquote><p>Although all the truths revealed in Scripture are necessary to be believed as divine and infallible, yet they are not all equally necessary and the amplitude and extension of faith must be accurately distinguished here from its necessity. Not everything which belongs to the amplitude of faith must therefore belong to its necessity. All truths are not of the same weight. Some have a greater, others a lesser degree of necessity. For example, some are necessary by the necessity of means; others only by the necessity of precept. Some relate to doctrines strictly so called, others only to rites and ceremonies. One relates to some article or doctrine as to substance (for instance that Christ suffered and died); another to the same considered only with reference to circumstances (for instance, that Christ suffered under Pontius Pilate and was crucified between two thieves). For we might be ignorant of the latter without peril to our salvation. Proof of this from Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.14.5</span></figcaption>

</figure><figure class="quote" id="q-2e92560358" data-kw="">
<blockquote><p>5. …And certainly, the nature of first principles requires that they not be proven, but taken for granted. 6. That habit or natural intellectual power (…since the natural power of the intellect itself, both practical and speculative, suffices [for the innate knowledge of God]; which is to establish its necessity with Thomas Aquinas in his 1st book of the Sentences, dist. 21, ad 1) comprehends the truth of principles immediately, without reasoning or proof, by a kind of simple intuition. It grasps partly theoretical principles and partly practical ones. Among the particular theoretical first principles, I place first and formost: ‘God exists’; and among the practical first principles, first and foremost: ‘God ought to be worshipped.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation on the Ways of Knowing God, pt. 1 tr. Michael Lynch (1665)</cite></span></figcaption>

</figure><figure class="quote" id="q-d662f50fd5" data-kw="">
<blockquote><p>VI. Many abuses can also be reckoned up: … (3) When philosophy assumes to itself the office of a master, in articles of faith, not content with that of a servant (as was done by the [Medieval, Romanist] Scholastics who places Aristotle upon the throne; and by the Socinians who would not admit the doctrines of the Trinity, of the incarnation, etc. because they did not seem to be in accordance with the principles of philosophy). (4) When more new distinctions and phrases than necessary are introduced from philosophy into theology under which (oftentimes) new and dangerous errors lie concealed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes (P&amp;R), vol. 1, 1st Topic, Q. 13, ‘Is there any use of Philosophy in Theology? We Affirm’, section 6</cite>, pp. 45-56</span></figcaption>

</figure><figure class="quote" id="q-bfcd07b77a" data-kw="">
<blockquote><p>XXIV. It is asked, fifth, whether infants before all use of reason are subject to actual sin… The Reformed, although they acknowledge that original corruption is actually present in infants, from which by nature they are prone to all actual sins, and moreover bear in themselves the seeds of the same, nonetheless deny that they are properly subject to any actual sin… Nevertheless they object:… (2) That the human mind consists in actual thought, which can not only be congruent with divine law, but also repugnant to it. I respond: (1) That the human mind is a thinking substance which, with organs adequately disposed, can think, we do not doubt, just as it is a reasoning substance, not because it is always reasoning in actuality, but because it can reason, with necessary things put in place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology (RHB), vol. 3, bk. 4, ch. 3, ‘Actual Sin’, sections 24</cite></span></figcaption>

<blockquote><p>(6) The secrecy of the lodge is inimical to the Church.

The Church is an open society, and the formation of secret fraternities within her ranks is destructive of the glorious liberty wherewith Christ has made her free. It sets up false and unchristian distinctions between those of whom Jesus says, “All ye are brethren,” and it takes away that mutual confidence and trust which are essential to true Christian brotherhood, but which cannot flourish in the atmosphere of secrecy. The secrecy of the lodge is opposed to the communion of saints. The lodge-bound Christian is compelled to favour a brother in the lodge who may be an unbeliever, even to the injury of a brother in Christ. There are many other ways in which secret orders antagonize the Church, but we are now speaking only of secrecy. Secrecy is a principle of evil which belongs to the kingdom of darkness, and is renounced by Him who says: “I am the light of the world.” … “Ye are the light of the world.” … “Walk as children of light.” As our Church Covenant says, all such organizations are “ensnaring in their nature, pernicious in their tendency, and perilous to the liberties of both Church and State.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-j-george.html">R. J. George</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures in pastoral theology</cite>, (3 vols, New York, 1917), iii, 277.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-68c87a6049" data-kw="">
<blockquote><p>I am afraid of a controversy on this subject [instrumental music], or of its issue, so far as the merits of the question are concerned. I believe that it is a question which touches some of the highest and deepest points of Christian theology. Is the Temple destroyed? Is the Temple worship wholly superseded? Have we, or have we not, priests and sacrifices among us now? Is the Temple or the Synagogue the model on which the Church of the New Testament is formed?

Does the Old Testament itself point to anything but “the fruit of the lips” as the peace-offering or thank-offering of Gospel times? Is there a trace in the New Testament of any other mode of praise? For my part, I am persuaded that if the Organ be admitted, there is no barrier, in principle, against the sacerdotal system in all its fulness,—against the substitution again, in our whole religion, of the formal for the spiritual, the symbolical for the real.

I do not judge others. The case is very different with those who never reached our measure of reformation from what it is with us. A Church which, stopping short in the process of its emancipation from a false system, retains certain of the usages of that false system, is in a very different position from a Church which, having advanced farther in the direction of purity and simplicity, voluntarily retrogrades and returns to these usages.

To the one they may be comparatively harmless, while to the other they may prove deeply hazardous. In the former instance, the continuance of them indicates no new leaning towards ritualism, no decline from what is more pure and spiritual. In the latter instance, the adoption of them may have a significancy, and may exert an influence, of a very serious character indeed. A landing-place which is tolerable for those who are going forward, may be the reverse of tolerable for those who are retreating.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introductory Notice in The Organ Question: Statements by Dr Ritchie, and Dr Porteous, for and against the use of the organ in public worship, in the proceedings of the Presbytery of Glasgow, 1807-8. With an introductory notice, by Robert S. Candlish, D.D., Edinburgh</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>Of these two conflicting systems of religion, the one has its centre in the truth. The truth as it is in Jesus, is its sun. Around this, all revolves, and to this all is subordinated. It is essentially tolerant of diversities of form, where the truth is preserved and honoured. … The other system revolves around the form. It asks not simply is the truth held, but how it is held. Orders, rites, ceremonies, are the grand principles on which it rests the weightier matters of its law. And by a very natural consequence, one indeed which results from the laws of our being, this undue exaltation of the form, draws after it a corresponding depreciation of the spirit. The apotheosis of external religion, is the dethronement of the internal and the spiritual, and to a greater or less extent, this result is unvarying. Go where you will among the adherents of this system, and you find a latitudinarian tolerance of diversities of doctrine, prevailing in exact proportion to the rigidness of the demand for uniformity of practice in the observances of religion.

Not unfrequently this laxity of doctrine is boasted of, as an ornament and trusted in as a secret of strength. You may believe what you will, within certain very broad and somewhat dimly defined limits, provided the loved and cherished form is observed. The very Church that, avowedly, so framed its declarations of truth as to comprehend well nigh all shades of theological opinion, even inviting to her bosom those who held some of the grand distinguishing principles of the great anti-christian apostacy, takes its position with unflinching firmness on the ground of rites and ceremonies, and cuts off from Church relationship, and valid ordinances, and abandons to the uncovenanted mercies of God, all who do not use her Shibboleth. She drowns the voice of admitted truth and piety, pleading for Christian recognition and fellowship, with the deafening cry “great is Diana of the Ephesians.” Instead of seeking for the living spirit of Christianity, and recognizing it when found; this system of externalism is satisfied with the lifeless corpse, from which the animating spirit has fled, provided you give it

Before decay’s effacing fingers

Have swept the lines where beauty lingers.

Instead of giving free scope to the spirit, allowing it to develop itself, controlled by no laws save those God has given, it forms an encrustation around it, compelling all its growth, if it grow at all, to a conformity to its fossil mould. In short its body is more a mummy than a man.

Now between these two rival systems every man must make his choice. He cannot serve God and Mammon. He cannot have two supreme tests of the Church. These systems are antagonistic, and every man must array himself with the one or the other. And the gathering with one, is scattering abroad so far as the other is concerned. If his system is distinctively ritual, the spirit must be neglected. Dethroned from its rightful sovereignty, it will be confined in the cruel bondage of a prescribed and unalterable mould; and there is great danger that it will pine away and die in its captivity. But if the spiritual element be regnant, forms will not be despised as useless, or cumbersome; but they will be held in subordination to the truth, and if they attempt to bind and hinder its free exercise, they will be burst asunder, as will the cerements of the tomb when the life-giver shall bid the dead to come forth.</p></blockquote>

<blockquote><p>It has become almost an adage, that the Church has developed her theology mainly through conflict with error. This must be so from the nature of the case. Attention is not apt to be specially directed to what is undisputed, and our clearest judgments are derived from comparison. The contrast of truth and error, induced by the assertion of the latter, enhances our comprehension of both. The doctrine of the covenants constitutes no exception to this law.

It was not brought distinctly under investigation and formally developed until the period succeeding the Reformation. Luther grandly elucidated the cardinal doctrine of justification by faith alone. Justification he saw clearly. Imputation he perceived less distinctly; and he stopped short of the controlling principle of federal representation. Even Calvin, magnificently endowed as he was by his abilities and learning for a systematic treatment of revealed truth, although he produced a theological work distinguished for its comprehensive grasp of the doctrines of religion in their relation to each other, did not seem to have had his mind definitely turned to the federal scheme.

It was when Placæus [Joshua De La Place] broached his theory of the mediate imputation of Adam’s sin, that the attention of the Reformed Church was thoroughly aroused to the importance and scope of the federal theology. The theologians of the Dutch School, in their massive works, subjected it to a full, if not an exhaustive, consideration; and their example was followed by some of the most illustrious divines of England and Scotland.

And while Cunningham, Hodge, and our own Thornwell have trodden in their footsteps, and evinced in their discussions their sense of the importance of the federal system—a fact for which the present generation of Calvinists should be devoutly thankful—it is to be feared that indications are beginning to manifest themselves of a growing tendency towards a departure from this type of theology. Especially would it be for a lamentation should it disappear from the pulpit—the grand organ by which divine truth is brought into contact with the masses.

And as surely as the pulpit drifts away from it, will it more and more cast its instructions in the mould of a wretched legalism; or, losing the influence of this pervading genius of theological truth, and so lapsing from any thoroughgoing inculcation of doctrine, it will more and more neglect its heavenly call to be an instructor of Christ’s people, and sink its high didactic office into that of a vapid and sensational haranguer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Federal Theology: Its Import and its Regulative Influence in Memorial Volume of the Semi-Centennial of the Theological Seminary at Columbia, South Carolina</cite></span></figcaption>

<blockquote><p>3. When Christ commands his disciples to bless them that curse them and persecute them, He gives not therein a rule to public officers, whether in Church or commonweal, to suffer notorious sinners, either in life or doctrine, to pass away with a blessing: But to private Christians to suffer persecution patiently, yea and to pray for their persecutors. Again, it is true, Christ would have his disciples to be far from persecuting (for that is a sinful oppression of men for righteousness sake) but that hinders not but that He would have them execute upon all disobedience the judgement and vengeance required in the Word, 2 Cor. 10:6; Rom. 13:4.

4. Though it be true that wicked persons now may by the grace of God become true disciples and converts, yet we may not do evil that good may come thereof: And evil it would be to tolerate notorious evil-doers, whether seducing teachers or scandalous livers. Christ had something against the angel of the Church of Pergamus for tolerating them that held the doctrine of Balaam, and against the Church of Thiatira for tolerating Jezabel to teach and seduce, Rev. 2:14, 20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Answer of Mr. John Cotton of Boston in New-England</cite>, …’ in Roger Williams, The Blovdy Tenent of Persecution for Cause of Conscience, Discussed in a Conference… (London, 1644), p. 10</span></figcaption>

<main class="wrap"><figure class="quote" id="q-5bb3907a8e" data-kw="">
<blockquote><p>The Lord has called you into the fellowship of His Son Jesus Christ, and by that act and deed He has put you into the place of infallible safeguard. If you are indeed a believer you are one with Jesus, and therefore you are secure. Do you not see that it must be so? You must be confirmed to the end until the day of His appearing, if you have indeed been made one with Jesus by the irrevocable act of God. Christ and the believing sinner are in the same boat: unless Jesus sinks, the believer will never drown.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>All of Grace</cite>, p. 89</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/perseverance-of-the-saints/grounds-of-perseverance.html">Grounds of Perseverance</a></span><span class="t"><a href="../topics/union-with-christ/union-and-communion.html">Union and Communion</a> › <a href="../topics/union-with-christ/union-and-communion/communion-with-christ.html">Communion with Christ</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e2292fd89c" data-kw="Mortification">

</figure><figure class="quote" id="q-0b044c059b" data-kw="">
<blockquote><p>True believers may have the assurance of their salvation divers ways shaken, diminished, and intermitted; as by negligence in preserving of it, by falling into some special sin which woundeth the conscience and grieveth the Spirit; by some sudden or vehement temptation, by God&#x27;s withdrawing the light of his countenance, and suffering even such as fear him to walk in darkness and to have no light, yet are they never destitute of the seed of God and life of faith, that love of Christ and the brethren, that sincerity of heart and conscience of duty out of which, by the operation of the Spirit, this assurance may in due time be revived, and by the which, in the meantime, they are preserved from utter despair.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 18.4</span></figcaption>

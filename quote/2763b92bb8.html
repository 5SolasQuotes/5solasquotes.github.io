<main class="wrap"><figure class="quote" id="q-2763b92bb8" data-kw="">
<blockquote><p>That direction, in this kind, which with me is instar omnium, is for a diligent endeavour to have the power of the truths professed and contended for abiding upon our hearts, that we may not contend for notions, but what we have a practical acquaintance with in our own souls. When the heart is cast indeed into the mould of the doctrine that the mind embraceth; when the evidence and necessity of the truth abides in us; when not the sense of the words only is in our heads, but the sense of the things abides in our hearts; when we have communion with God in the doctrine we contend for, — then shall we be garrisoned, by the grace of God, against all the assaults of men.

And without this all our contending is, as to ourselves, of no value. What am I the better if I can dispute that Christ is God, but have no sense or sweetness in my heart from hence that he is a God in covenant with my soul? What will it avail me to evince, by testimonies and arguments, that he hath made satisfaction for sin, if, through my unbelief, the wrath of God abideth on me, and I have no experience of my own being made the righteousness of God in him, — if I find not, in my standing before God, the excellency of having my sins imputed to him and his righteousness imputed to me?

Will it be any advantage to me, in the issue, to profess and dispute that God works the conversion of a sinner by the irresistible grace of his Spirit, if I was never acquainted experimentally with the deadness and utter impotency to good, that opposition to the law of God, which is in my own soul by nature, with the efficacy of the exceeding greatness of the power of God in quickening, enlightening, and bringing forth the fruits of obedience in me? It is the power of truth in the heart alone that will make us cleave unto it indeed in an hour of temptation.

Let us, then, not think that we are any thing the better for our conviction of the truths of the great doctrines of the gospel, for which we contend with those men, unless we find the power of the truths abiding in our own hearts, and have a continual experience of their necessity and excellency in our standing before God and our communion with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Evangelicæ; or, The Mystery of the Gospel Vindicated and Socinianism Examined</cite>, (Oxford, 1655) in William H. Goold (ed.), The Works of John Owen (1850-53; 16 vols, Edinburgh: Banner of Truth, 1966), xii, 52.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5f17cebff8" data-kw="">
<blockquote><p>MEDITATION, as including learning, reading, and reflection, and especially reading and reflecting upon the Word of God, so as to understand the meaning of its statements, and the import of its teaching, is that which in the ordinary relation of cause and effect bears most directly and immediately upon the acquisition of theological knowledge. Prayer and the experimental application of divine truth are exercises which mainly and principally lie between God and your own souls, in which it is with him you have to do, and where little aid or assistance can be derived from your fellow-men.

In meditation or study you may derive much assistance from others, by their interpreting and explaining the word of God to you, illustrating and establishing the truths which are taught there, counselling you as to the books that ought to be read, and the way in which they may be read and studied to most advantage, and in various ways affording you at the commencement of your theological studies the benefit and the experience acquired by those who have already given some attention to the investigation of these subjects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, (New York: Robert Carter and Brothers, 1878), Lecture VI, p. 75.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/spiritual-duties.html">Spiritual Duties</a></span></div>

<blockquote><p>2. Meditate on the omnipotency of God, who made all these creatures of nothing (Heb. xi. 3)—of his wisdom (Psal. cxlv. 15, 16), who feedeth so many infinite creatures through the universal world, maintaining all their lives, which he has given them, which surpasseth the wisdom of all the angels in heaven—and of his clemency and goodness, in feeding also his very enemies (Matt. v. 45, &amp;c.; Acts xiv. 17.)

3. Meditate how many sorts of creatures, as beasts, fish, and fowl, have lost their lives, to become food to nourish thee; and how God’s providence from remote places has brought all these portions together on thy table for thy nourishment; and how by these dead creatures he maintains thee in health and life.

4. Meditate that seeing thou hast so many pledges of God’s fatherly bounty, goodness, and mercy towards thee, as there are dishes of meat on thy table, O suffer not in such a place, so gracious a God to be abused by scurrility, ribaldry, or swearing; or thy fellow-brother, by disgraceful backbiting, taunting, or slandering.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety: Directing a Christian to walk, that he may please God</cite>, (1612; Grand Rapids MI: Soli Deo Gloria, 2019), p. 150.</span></figcaption>

<blockquote><p>Briefly (in deed) and in very few words is it said by the Apostle, Let a man examine himself: but in that brevity, and in those few words, he effectually comprehendeth the whole office and duty of every such an one, as doth earnestly desire to be reconciled, and to be at one with God; yea, therein he summarily setteth down, and compendiously prescribeth all and whatsoever is needful or expedient, for each true Christian to do &amp; perform.

For, to examine a man’s own self, is nothing else, than for him thoroughly to try, narrowly to search, and diligently to prove, who and what manner of person he is; &amp; in what case he inwardly feeleth his own conscience. To the same effect, purpose and meaning doth the Apostle in an other place say, Let every man prove his own works: And again, Prove your selves whether ye be in the faith: examine your selves.

He therefore is to be understood, rightly, duly, and truly to examine himself, which diligently and carefully searcheth out, trieth, groapeth, &amp; inwardly rippeth up every corner of his conscience, and so narrowly fifteth both his works, actions and faith, that he leaveth nothing in his whole man, either outwardly or inwardly, whereof he maketh not a true and perfect presentment unto his Conscience, and (as it were) strictly enditeth and judicially arraigneth at the Bar, as before a most severe Judge.

And look how necessary it is for every one that hath sinned, (and by sinning disfranchised and banished himself from the kingdom of heaven) to bend his whole care and study, how to come into favour again with God, king of the same heavenly kingdom: so necessary is it, that before he go about the same, he diligently try and examine himself.</p></blockquote>

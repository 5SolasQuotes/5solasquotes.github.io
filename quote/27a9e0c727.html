<main class="wrap"><figure class="quote" id="q-27a9e0c727" data-kw="">
<blockquote><p>As all were not true prophets, the Apostle here declares that they ought to have been examined and tried. And he addresses not only the whole Church, but also every one of the faithful. … That we may then be fit judges, we must necessarily be endowed with and directed by the Spirit of discernment. But as the Apostle would have commanded this in vain, were there no power of judging supplied, we may with certainty conclude, that the godly shall never be left destitute of the Spirit of wisdom as to what is necessary, provided they ask for him of the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, 1 John 4:1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“As all were not true prophets, the Apostle here declares that they ought to have been examined and tried. And he addresses not only the whole Church, but also every one of the faithful. … That we may then be fit judges, we must necessarily be endowed with and directed by the Spirit of discernment. But as the Apostle would have commanded this in vain, were there no power of judging supplied, we may with certainty conclude, that the godly shall never be left destitute of the Spirit of wisdom as to what is necessary, provided they ask for him of the Lord.”

— John Calvin, Commentaries on the Catholic Epistles, 1 John 4:1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs%20all%20were%20not%20true%20prophets%2C%20the%20Apostle%20here%20declares%20that%20they%20ought%20to%20have%20been%20examined%20and%20tried.%20And%20he%20addresses%20not%20only%20the%20whole%20Church%2C%20but%20also%20every%20one%20of%20the%20faithful.%20%E2%80%A6%20That%20we%20may%20then%20be%20fit%20judges%2C%20we%20must%20necessarily%20be%20endowed%20with%20and%20directed%20by%20the%20Spirit%20of%20discernment.%20But%20as%20the%20Apostle%20would%20have%20commanded%20this%20in%20vain%2C%20were%20there%20no%20power%20of%20judging%20supplied%2C%20we%20may%20with%20certainty%20conclude%2C%20that%20the%20godly%20shall%20never%20be%20left%20destitute%20of%20the%20Spirit%20of%20wisdom%20as%20to%20what%20is%20necessary%2C%20provided%20they%20ask%20for%20him%20of%20the%20Lord.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Commentaries%20on%20the%20Catholic%20Epistles%2C%201%20John%204%3A1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F27a9e0c727.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/27a9e0c727.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom45" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-012b73bcb1" data-kw="">
<blockquote><p>As for types, allegories, mystical stories, and obscure predictions, he made use of them under the Old Testament on purpose to exercise the faith of the church in the discovery of the mystery of grace which was contained in them. And whatever of that nature is contained in the Scripture, being interpreted by the light of the gospel, is clear and plain unto them who are taught of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, Works (Goold), vol. 4</span></figcaption>

<div class="actions"><button class="copy" data-copy="“As for types, allegories, mystical stories, and obscure predictions, he made use of them under the Old Testament on purpose to exercise the faith of the church in the discovery of the mystery of grace which was contained in them. And whatever of that nature is contained in the Scripture, being interpreted by the light of the gospel, is clear and plain unto them who are taught of God.”

</figure><figure class="quote" id="q-a067c1d621" data-kw="">
<blockquote><p>When God&#x27;s Word is by the Fathers expounded, construed, and glossed, then, in my judgment, it is even as when one strains milk through a coal-sack, which must needs spoil and make the milk black; God&#x27;s Word of itself is pure, clean, bright and clear; but, through the doctrines, books, and writings of the Fathers, it is darkened, falsified, and spoiled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Table Talk</cite>, Of the Fathers of the Church, DXIX, p. 297</span></figcaption>

<div class="actions"><button class="copy" data-copy="“When God&#x27;s Word is by the Fathers expounded, construed, and glossed, then, in my judgment, it is even as when one strains milk through a coal-sack, which must needs spoil and make the milk black; God&#x27;s Word of itself is pure, clean, bright and clear; but, through the doctrines, books, and writings of the Fathers, it is darkened, falsified, and spoiled.”

— Martin Luther, Table Talk, Of the Fathers of the Church, DXIX, p. 297">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+God%27s+Word+is+by+the+Fathers+expounded%2C+construed%2C+and+glossed%2C+then%2C+in+my+judgment%2C+it+is+even+as+when+one+strains+milk+through+a+coal-sack%2C+which+must+needs+spoil+and+make+the+milk+black%3B+God%27s+Word+of+itself+is+pure%2C+clean%2C+bright+and+clear%3B+but%2C+through+the+doctrines%2C+books%2C+and+writings+of+the+Fathers%2C+it+is+darkened%2C+falsified%2C+and+spoiled.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Table+Talk%2C+Of+the+Fathers+of+the+Church%2C+DXIX%2C+p.+297&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa067c1d621.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a067c1d621.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-ee0846291f" data-kw="">
<blockquote><p>He studies not the Scripture as he should, which studies not providence as he should; we should compare Gods promises and providences together. What we hear of him in his Word, with what we see in his Works.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/providence/providence-in-general.html">Providence in General</a></span><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>
<div class="actions"><button class="copy" data-copy="“He studies not the Scripture as he should, which studies not providence as he should; we should compare Gods promises and providences together. What we hear of him in his Word, with what we see in his Works.”

</figure><figure class="quote" id="q-e8b377bc63" data-kw="">
<blockquote><p>We hold the case thus:—that the spirits are to be tried and proved by a twofold judgment. The one, internal; by which, through the Holy Spirit, or a peculiar gift of God, any one may illustrate, and to a certainty, judge of, and determine on, the doctrines and sentiments of all men, for himself and his own personal salvation concerning which it is said. (1 Cor. ii. 15.) &quot;The spiritual man judgeth all things, but he himself is judged of no man.&quot; This belongs to faith, and is necessary for every, even private, Christian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bondage of the Will</cite>, sect. 34</span></figcaption>

<main class="wrap"><figure class="quote" id="q-725030c331" data-kw="">
<blockquote><p>To the first, we answer, That now nature being corrupted, it can be no good rule to try what is truth concerning God by it; it can hardly be denied, if nature be considered as in Adam at the beginning, but to him there was clearness in this mystery, there being express mention of the blessed Trinity in his creation, as the word, Let Us make man according to Our Image, doth import: which is not for nought mentioned then, more than formerly, especially, considering that excellent knowledge that Adam was furnished with, which was a part of the Image of that One God, who is Father, Son, and Spirit.

But, not to insist in this, we say, secondly, That if by nature, as it is now corrupted, what is tolerable or intolerable in the matters of Religion were to be tried, then were the whole Doctrine of the Gospel and Redemption through the Mediator, to be accounted no fundamental thing; and consequently, no Error, destroying it, were to be restrained, because nature hath not discovered that. That therefore must be an unsafe rule to walk by.

And indeed if a master of a family and father, who yet, as such, is (to say so) a servant of nature, is not by that exempted from the obligation of bringing up his children and servants in the knowledge of God according to the Gospel; but is notwithstanding to exercise his authority in the restraining of every thing contrary thereunto according to his station. Can it be thought, that a Magistrate, who must count for his Authority over a people, as a master must do for his, over a family, is less obliged thereunto? For, Christians are to be Christians in their stations, as in their personal carriage; and so to seek the promoving of the Gospel, and the restraining of what may mar it according to their station.

Thirdly, we answer, That even this may be drawn from the Moral Law of God; wherein not only the true God is alone to be worshipped, as in the first Command; but also accordingly as he hath prescribed and revealed in His Word, which is the sum of the second Command. Now, this being true, that the Lord hath thus revealed Himself to be worshipped according to the Gospel, it becomes no less necessary to Worship God in that manner, than to Worship Him, who is the true God; and so, is by the first Command, and according to the light of nature, Magistrates should restrain, and not suffer what is inconsistent with the worshipping of the One true and living God, so is he, by the second Command and that same light of nature, obliged to restrain all manner of Doctrine and Worship, that is inconsistent with what he hath revealed, according to the second.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A commentary upon the book of the Revelation. Wherein the text is explained, the series of the several prophecies contained in that book, deduced according to their order and dependence on each other; the periods and succession of times, at, or about which, these prophecies, that are already fulfill</cite>, (Edinburgh: Christopher Higgins, 1658), p .10.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d3c4cc2eb6" data-kw="">
<blockquote><p>By the Godhead is meant the divine nature. A person in the Godhead, is the Godhead distinguished by personal properties. The Godhead is one only in number: But the persons in the Godhead are three; and they are the Father, the Son, and the Holy Ghost … Jesus Christ is the second of these persons, namely, the Son. And the Father is true God: the Son is true God: and the Holy Ghost is true God. Yet they are not three Gods, but one God …

Howbeit, the Godhead neither is, nor can be divided into parts: but each of the three persons hath the one whole indivisible Godhead. They are not then of a like substance only, but the very same in substance. But they are distinguished by their personal properties. And it is the personal property of the Father, to beget the Son … And it is the personal property of the Son, to be begotten of the Father … And it is the personal property of the Holy Ghost, to proceed from the Father and the Son … The Son and the Holy Ghost are not below the Father, but equal with him: They are all equally powerful and glorious. So the personal properties make no inequality among them; forasmuch as these properties are not temporary and accidental, but eternal and necessary, and could not but be: and every one of the three persons, is the eternal, the supreme, the most high God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Explication of the First Part of the Assembly’s Shorter Catechism</cite>, (1727) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), vii, 15-16.</span></figcaption>

</figure><figure class="quote" id="q-7b33af83f5" data-kw="Spirit deity Ananias">
<blockquote><p>The title of God and the attribute of eternal Spirit, given in sacred Scripture, prove that the Spirit in whose name we are baptized is not a quality, grace, or effect. When Peter reproached Ananias for lying to the Holy Spirit, he said that Ananias had lied not to men but to God (Acts 5:4). Paul infers that we are the temple of God because the Spirit dwells in us (1 Cor. 3:16 and 6:19). As Augustine eloquently teaches in Epistle 66, if we were commanded to build a temple for God out of wood and stone, because such worship is due to Him alone, it would clearly argue His divinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XXV</span></figcaption>

<blockquote><p>John Bidle’s XII Arguments Drawn out of the Scripture; wherein the commonly Received Opinion, Touching the Deity of the Holy Spirit, Is clearly and fully Refuted (1647) was answered by several Reformed theologians and scholars, both continental and British. These responses were full, demonstrative, and clear; but they were written largely for academics. It fell to a young parish minister, Matthew Poole, not yet thirty years of age, to provide a concise and popular response, for the edification of the common man. Poole’s Blasphemer Slaine with the Sword of the Spirit remains one of the best popular defenses of the Deity of the Holy Spirit in the English language.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Blasphemer Slain with the Sword of the Spirit in The Literary Labors of the Reverend Matthew Poole</cite>, vol. 2</span></figcaption>

<blockquote><p>Thesis XIV… For because divine essence is infinite, most simple, and eternal, therefore the three hypostases subsisting in it—although they are truly three in number—because these individual hypostases are distinguished by their own incommunicable properties, they are nevertheless not three gods nor are they said to be three gods in the same way that there are three men… But instead, in the divine this happens by an indescribable communication of the whole essence from eternity, in which no point of beginning, middle, or end can be stated.† † dari, i.e., cannot be stated or supplied because it does not exist.</p></blockquote>

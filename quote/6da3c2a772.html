<main class="wrap"><figure class="quote" id="q-6da3c2a772" data-kw="">
<blockquote><p>We observed with much regret that the Psalms of David, which is the divinely authorized Hymn Book of the Christian Church, are seldom used. Not content with a supplement of hymns, for occasionally use, one collection has followed another, each more bulky and copious than its predecessor, until the Psalms of David are in no small danger of being thrust wholly out of sight and mind.

The Hymn Books, which all denominations have formed, each one to please its own taste for poetry, and its own views of orthodoxy, like the traditions of the scribes of old, are making void the oracles of God, and estranging the church from those inspired compositions in which the sweet-singer of Israel celebrates the fortunes of the Church and her glorious Head, in strains adapted to every age, until the Son of God shall appear to take the kingdom to himself, and terminate the mediatorial work.

The Psalms, as a natural consequence, seem less read in private, and less understood and relished – treated as if they were the hymns of a bygone dispensation, having little nourishment for a gospel church. Christians who will not take the trouble of penetrating beneath the antique veil and drapery of these noble compositions, pronounce them Jewish grapes, fit only for the infancy of the church and the ritual service of Judaism; yet good Bishop Horne, by his piety, and Bishop Horsley by his perspicacity – two minds as differently constituted as ever two minds were – have both attained the same convictions, and spread before us in their expositions, not the unripe grapes of Judaism, but the ripe clusters of Zion, discerning themselves, and making visible to others Christ and his church, its joys and sorrows, sufferings and triumphs, until time shall be no more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-lewis.html">George Lewis</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Impressions of</cite>, America and the American churches (Edinburgh, 1845), pp 100-01.</span></figcaption>

<blockquote><p>Another thing God did towards this work, at that time, was his inspiring David to show forth Christ and his redemption, in divine songs, which should be for the use of the church, in public worship, throughout all ages. David was himself endued with the spirit of prophecy.

He is called a prophet, Acts ii. 29.30. “Let me freely speak to you of the patriarch David, that he is both dead and buried, and his sepulchre is with us unto this day: therefore being a prophet, and knowing that God had sworn with an oath,” &amp;c. So that herein he was a type of Christ, that he was both a prophet and king.

We have no certain account of the time when David was first endued with the spirit of prophecy; but it is manifest, that it either was at the time that Samuel anointed him, or very soon after; for he appears soon after acted by this spirit, in the affair of Goliath: and then great part of the psalms were penned in the time of his troubles, before he came to the crown; as might be made manifest by an induction of particulars.

The oil that was used in anointing David was a type of the spirit of God; and the type and the antitype were given both together; as we are told, 1 Sam. xvi.13. “Then Samuel took the horn of oil, and anointed him in the midst of his brethren; and the spirit of the Lord came down upon David from that day forward:” and it is probable, that it now came upon him in its prophetical influences.

The way that this spirit influenced him was, to inspire him to show forth Christ, and the glorious things of his redemption, in divine songs, sweetly expressing the breathings of a pious soul, full of admiration of the glorious things of the Redeemer, inflamed with divine love, and lifted up with praise; and therefore he is called the sweet psalmist of Israel. 2 Sam. xxiii.1. “Now those be the last words of David: David the son of Jesse said, and the man who was raised up on high, the anointed of the God of Jacob, and the sweet psalmist of Israel.”

The main subjects of these sweet songs were the glorious things of the gospel; as is evident by the interpretation that is often put upon them, and the use that is made of them in the New Testament; for there is no one book of the Old Testament that is so often quoted in the New, as the book of Psalms. Joyfully did this holy man sing of those great things of Christ’s redemption, that had been the hope and expectation of God’s church and people from the beginning of the church of God on earth; and joyfully did others follow him in it, as Asaph, Heman, Ethan, and others; for the book of Psalms was not all penned by David, though the greater part of it was. Hereby the canon of scripture was further added to; and an excellent portion of divine writ was it that was added.

This was a great advancement that God made in this building; and the light of the gospel, which had been gradually growing from the fall, was exceedingly increased by it: for whereas before there was but here and there a prophecy given of Christ in a great many ages, nowhere Christ is spoken of by his ancestor David abundantly, in multitudes of songs, speaking of his incarnation, life, death, resurrection, ascension into heaven, his satisfaction, intercession; his prophetical, kingly, and priestly office; his glorious benefits in this life and that which is to come; his union with the church, and blessedness of the church in him; the calling of the Gentiles, the future glory of the church near the end of the world, and Christ’s coming to the final judgement. All these things, and many more, concerning Christ and his redemption, are abundantly spoken of in the book of Psalms.

This was also a glorious advancement of the affair of redemption, as God hereby gave his church a book of divine songs for their use in that part of their public worship, viz. singing his praises, throughout all ages to the end of the world. It is manifest the book of Psalms was given of God for this end. It was used in the church of Israel by God’s appointment: this is manifest by the title of many of the psalms, in which they are inscribed to the chief musician, i. e. to the man that was appointed to be the leader of divine songs in the temple, in the public worship of Israel.

So David is called, the sweet psalmist of Israel, because he penned psalms for the use of the church of Israel; and accordingly we have an account that they were actually made use of in the church of Israel for that end, even ages after David was dead; as 2 Chron. xxix.30. “Moreover, Hezekiah the king, and the princes, commanded the Levites to sing praises unto the Lord, with the words of David, and of Asaph the seer.”

And we find that the same are appointed in the New Testament to be made use of in the Christian church, in their worship: Eph. v. 19. “Speaking to yourselves in psalms, hymns, and spiritual songs.” Col. iii. 16. “Admonishing one another in psalms, hymns, and spiritual songs.” And so they have been, and will to the end of the world be made use of in the church to celebrate the praises of God. The people of God were wont sometimes to worship God by singing songs to his praise before; as they did at the Red sea; and they had Moses’s prophetical song, in the 32nd chapter of Deuteronomy, committed to them and Deborah, and Barak, and Hannah, sung praises to God: but now first did God commit to his church a book of divine songs for their constant use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A history of the work of redemption. Containing the outlines of a body of divinity, in a method entirely new</cite>, ed. John Erskine (1774; Boston, 1782), pp 78-80.</span></figcaption>

+to+his+church+a+book+of+divine+songs+for+their+constant+use.%E2%80%9D%0A%0A%E2%80%94+Jonathan+Edwards%2C+A+history+of+the+work+of+redemption.+Containing+the+outlines+of+a+body+of+divinity%2C+in+a+method+entirely+new%2C+ed.+John+Erskine+%281774%3B+Boston%2C+1782%29%2C+pp+78-80.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fce531fd8b8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ce531fd8b8.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/02/05/jonathan-edwards-on-christ-and-the-psalms/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

</figure><figure class="quote" id="q-e07c50acc4" data-kw="">
<blockquote><p>The singing of Psalms was under the Law, is under the Gospel an Holy Ordinance of God, in right performance whereof, Churches and Christians make heavenly melody in their hearts unto the Lord. Eph. 5:19.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stanley-gower.html">Stanley Gower</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Preface’ in John White, David’s Psalms in Metre. Agreeable to the Hebrew, To be sung in usual Tunes. To the benefit of the Churches of Christ</cite>, (London, 1655), no page number. John White was a Westminster divine. This psalter only contains the 150 psalms. Both Gower and White were New England puritans in Dorchester, near Boston.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“The singing of Psalms was under the Law, is under the Gospel an Holy Ordinance of God, in right performance whereof, Churches and Christians make heavenly melody in their hearts unto the Lord. Eph. 5:19.”

— Stanley Gower, ‘Preface’ in John White, David’s Psalms in Metre. Agreeable to the Hebrew, To be sung in usual Tunes. To the benefit of the Churches of Christ, (London, 1655), no page number. John White was a Westminster divine. This psalter only contains the 150 psalms. Both Gower and White were New England puritans in Dorchester, near Boston.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+singing+of+Psalms+was+under+the+Law%2C+is+under+the+Gospel+an+Holy+Ordinance+of+God%2C+in+right+performance+whereof%2C+Churches+and+Christians+make+heavenly+melody+in+their+hearts+unto+the+Lord.+Eph.+5%3A19.%E2%80%9D%0A%0A%E2%80%94+Stanley+Gower%2C+%E2%80%98Preface%E2%80%99+in+John+White%2C+David%E2%80%99s+Psalms+in+Metre.+Agreeable+to+the+Hebrew%2C+To+be+sung+in+usual+Tunes.+To+the+benefit+of+the+Churches+of+Christ%2C+%28London%2C+1655%29%2C+no+page+number.+John+White+was+a+Westminster+divine.+This+psalter+only+contains+the+150+psalms.+Both+Gower+and+White+were+New+England+puritans+in+Dorchester%2C+near+Boston.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe07c50acc4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e07c50acc4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=The%20singing%20of%20Psalms%20was%20under,hearts%20unto%20the%20Lord.%20Eph.%205%3A19&amp;text=The%20singing%20of%20Psalms%20was%20under%20the%20Law&amp;text=in%20their%20hearts%20unto%20the%20Lord.%20Eph.%205%3A19" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9e7bfcd23f" data-kw="">
<blockquote><p>I. First then, as to the Praises of God. The Scriptures both of the Old and New Testaments require the use of the Psalms in offering up praises to God. We find in the Old Testament (2 Chron. 29:30) [that] Hezekiah the King and the princes commanded the Levites to sing praises to the Lord with the words of David, and of Asaph, and they sang with gladness. This Command of Hezekiah proceeded from God, and was approved by Him. The same way of praising God continued in the Jewish Church till our Saviour’s time: And after that, we have yet a more positive command for the use of them by the apostle, Eph. 5:19, ‘Speaking to your selves in psalms, and hymns, and spiritual songs.’ And Col. 3:16, ‘Let the words of Christ dwell in you richly in all wisdom, teaching and admonishing one another in psalms, and hymns, and spiritual songs; singing and making melody with grace in your hearts to the Lord.’ I think there is no room to doubt, but by the psalms, etc. in these places, is meant the Book of Psalms, which the Holy Ghost has left for this purpose to the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-king.html">William King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Inventions of men</cite>, (Dublin, 1694), Ch. 1, ‘Of Praises’, Section 1, ‘What the Holy Scriptures prescribe concerning them’, pp. 6-7. King (1650-1729) was an Anglican divine in the Church of Ireland and was the archbishop of Dublin.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

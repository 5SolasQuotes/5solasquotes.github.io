<main class="wrap"><figure class="quote" id="q-5791856475" data-kw="">
<blockquote><p>I beseech you therefore, brethren, by the mercies of God, that ye offer up your bodies a living sacrifice, holy, and acceptable unto God, which is your reasonable worshipping… He desires us to offer ourselves unto God. And this oblation he says shall have the nature of a sacrifice… A sacrifice is a voluntary action, wherein we worship God and offer unto Him somewhat, whereby we testify his chief dignity and dominion, and our servitude and submission towards Him. In this definition are expressed all the causes. The matter is the oblation: the form is the action, not a natural action, but that which is done with election, and inspired by the Holy Ghost: neither is it a political or economical action but a religious action: for that pertains to the worshipping of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most Learned &amp; Fruitful Commentaries</cite>, … upon… Romans… trans. H.B. (London: Daye, 1568), | on Romans 12, pp. 410-11, 413</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e284ea526b" data-kw="">
<blockquote><p>Therefore, a true and worthy esteem of God and other acts manifesting esteem constitute, as it were, the first matter of religion. Every honest, human act making for the honor and glory of God may be the matter or material object of religion. It is one and the same act which as submission to commandment is called obedience and as honor to God is called religion and worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, ed. John Eusden (1639; Grand Rapids: Baker, 1997), bk. 2, ch. 4, ‘Religion’, section 24, p. 239.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-58aa8968f2" data-kw="">
<blockquote><p>The act of Perth [1618] about kneeling would draw some commendation to this ceremony [of kneeling before the sacrament], from those words of the Psalm, ‘O come let us worship and bow down. let us kneel before the Lord our maker.’ [Ps. 95:6] Which is as if one should argue thus: We may worship before the lord. Therefore, before a creature. We may kneel in an immediate worship of God, Therefore in a mediate. For who sees not, that the kneeling there spoken of is a kneeling in the action of solemn praise and joyful noise of singing unto the Lord?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 6, p. 96</span></figcaption>

</figure><figure class="quote" id="q-187d739753" data-kw="">
<blockquote><p>There is no part of religion which Satan does not endeavor to destroy under pretense of promoting it: and his way is to overgo Christ and his apostles, and to seem more zealous than ever they were, and to mend their work by doing it better or doing more. Christ was not strict enough for the Pharisees, in keeping the Sabbath, nor in his company, nor in his diet. Satan has always two ways to destroy both truth and duty: The first is by direct opposing it; But when that will not do, the next is by overdoing and pretending to defend it. If he cannot destroy zeal, by scorning it and quenching it; he will try to do it by overheating and distempering it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1 | Direction 57, p. 270</span></figcaption>

</figure><figure class="quote" id="q-fe5f29ba12" data-kw="">
<blockquote><p>We complain that the whole doctrine of godliness is adulterated by impious dogmas; that the whole worship of God is vitiated by foul and disgraceful superstitions; that the pure institution of the sacraments has been supplanted by horrible sacrilege; that their use has been converted into a profane trafficking; that poor souls, which ought to have been ruled by the doctrine of Christ, are oppressed by cruel bondage; that nothing is seen in the Christian Church that is not deformed and debased; that the grace of Christ not only lies half-buried, but is partly torn to pieces, partly altogether extinguished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, p. 20</span></figcaption>

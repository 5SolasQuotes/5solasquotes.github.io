<main class="wrap"><figure class="quote" id="q-541cecb321" data-kw="">
<blockquote><p>And these temporal circumstances, whether of evening or night-time, or of the sixth day of the week [i.e. Thursday night] or that particular day of the year (i.e., of the third day before Christ’s resurrection), and also of the place (i.e. a private place), do not have any force of prescribed necessity or of observance. Nor do the following facts have any force of being required or observed: that the supper was given to them after they had eaten a meal, after their feet had been washed, when they were lying at table, and even that there were twelve in number (some of which were observed for some time in the early church).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-thysius.html">Antonius Thysius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, ... (1625; Brill), vol. 3, Disputation 45, ‘On the Lord’s Supper’, pp. 187</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6f9ea7331c" data-kw="">
<blockquote><p>Answer 1 [to the Papists’s practice of keeping the cup from the people]: As in some countries there is no wine to be had, so we find that in certain places and regions of the world there is no bread, such as Christ used, made of wheat or the like grain: as in some places amongst the West Indians they have a certain kind of bread made of roots called Cazabi, as Benzo witnesses. Wherefore by this reason [of the Papists] of uniformity, we should not communicate at all, either in bread or wine, seeing that as some countries are destitute of wine, so other are of bread: But all this not withstanding, the sacrament may be duly administered in all places in both kinds: and where they have neither bread nor wine, neither can possibly provide them, they may safely use such other elements, as do stand them in the like stead: as in the place of bread, that which comes nearest to the use thereof: and for wine, some other precious liquor, that is to be had, as in Russia instead of wine they use a certain drink like unto that which we call Metheglen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis Papismi, that is, A General View of Papistry</cite>, ... (London, 1592), 13th Controversy, 8th Question, ‘Of Receiving the Sacrament in One Kind’, p. 470</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

p;text=drink%20like%20unto%20that%20which%20we%20call%20Metheglen" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a531f12cdc" data-kw="">
<blockquote><p>There is nothing accidental in the worship of God. Every thing that belongs to it, is part of it. Some things are of more weight, use and importance than others (Mt. 23:27), but all things duly belonging to it, are parts of it, or of its subsistence; outward circumstances are natural and occasional, no accidental parts of worship.</p></blockquote>

<blockquote><p>The State of the controversy is: Whether private confession and absolution is necessary? Whether bowing of the knees and an uncovering of the head is at the mention of the name of Jesus has been commanded? and lastly, whether Latin songs may be allowed in public assemblies? The Lutherans affirm; we deny.</p></blockquote>

</figure><figure class="quote" id="q-6cfc349ce3" data-kw="">
<blockquote><p>Fourthly, the flux and reflux (so to speak) of several successive [seatings of] tables [for the Lord’s Supper in one congregation], where there is a great number to communicate, and the repeating, or pronouncing and applying to those several tables of receivers, the words, ‘Take ye’, ‘eat ye’, which Christ pronounced but once in one act of distribution, these things (I say) cannot be justly charged as deviations from the example of Christ, when the same providence which limited Him to a fewer number, calls us to distribute to a great number: Neither can they [the Independents] who so charge us [the presbyterians], ever make good what they allege, unless they prove that although Christ had been distributing this sacrament to all the 500 disciples to whom He appeared after his resurrection [1 Cor. 15:6] (suppose I say, there had been so many communicants), yet He had given them all at once the elements, and had said but once, ‘Take ye, eat ye’, and that there had been no intermission at all, nor no partition into several successive companies. If this can be proved, then they say much against the use of successive tables, otherwise not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, … (Edinburgh, 1649), ch. 18, ‘Of the Use of a Table in the Lord’s Supper’, p. 221</span></figcaption>

</figure><figure class="quote" id="q-698e135415" data-kw="Lord&#x27;s day resurrection">
<blockquote><p>The Lord’s day (kyriakē hēmera) in Christian usage is applied to the first day of the week, appointed for the public worship of God in memory of Christ’s resurrection. Now it is so called not so much with regard to the efficient (as if it was formally instituted by Christ himself, as the Lord’s Prayer and the Lord’s Supper are designated by the apostle, 1 Cor. 10:21). As will be seen afterwards, no argument can be given for such institution. With regard to the end, it was instituted in memory of the resurrection of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.14.1</span></figcaption>

</figure><figure class="quote" id="q-71341c3740" data-kw="">
<blockquote><p>Lastly, if it were granted that Ambrose did entreat Count Arbogastes at a feast, whether will any believe it, who considers the austere life of Ambrose, chastising his body with that discipline (as Paulinus, ibidem) that he observed a daily fast, that he would distain himself with feasts on the Lord’s day which hindred the exercises of religion, either public or private? Nay, truly, He might perhaps dine on the Lord’s day, as the custom of the Church required: but we must not believe that the grave father did fare so daintily on that day as that he could not attend the duties of piety: concerning which nature of feasts we are here speaking: in which number that is to [be] reckoned, which Baronius mentions out of Gregor. Turonens, who tells us of a certain presbyter, invading the Bishopric of Avergue, after the death of Sidonius Apollinaris, who, when the Lord’s day came, having prepared a banquet, commanded that all the citizens should be invited into the Church: a wickedness indeed beseeming the author, that he who had ambitiously invaded the Bishops’ See, against the Canons of the Church, should violate the Lord’s solemnity by his feast, that hindered the duties of divine worship: which unlawful example, I hope nobody that relishes anything of Christ will follow. And now I will conclude with St. Austin [Augustine] (Epistle 86), that none can rightly deny that a Christian may on the Lord’s day be refreshed with a moderate and sober dinner, and also will affirm with that grave father, that those who fear God must not riot on the Lord’s Day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-young.html">Thomas Young</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lord’s Day</cite>, … (London: Leach, 1672), bk. 1, ch. 13, pp. 227-28 Young was a Westminster divine.</span></figcaption>

</figure><figure class="quote" id="q-9a29be598b" data-kw="">
<blockquote><p>This delight is spiritual in God as the proper object, and in the ordinances as the only means to lead us unto God, Job 27:10; Ps. 43:4; Canticles, 2:3; Isa. 56:7. Reasons.

1. Because the duties of that day are higher, we have then all the means of communion with God:

1. We have them in a more raised solemn way without any interruption; there is then a double institution, not only of the worship, but the time.

2. Its a spiritual feast, a day of God’s appointment, our recompence as well as our duty, Neh. 2:26. Ordinances are fodinae gratiae [wells of grace], Isa. 12:3.

3. This day we come to remember the highest favours of God to the creature, to contemplate the works of Creation, God’s rest, and of Redemption, Christ’s rest, 1 Pet. 4:1, and our own eternal rest, Heb. 4:9, the Sabbaths of the faithful are the suburbs of Heaven, Heb. 12:23, the Lord’s Supper is heaven in a map, Luke 14:15; Mt. 26:29.

4. Many of the duties of the day are but spiritual recreations; meditation is the solace of the mind in the contemplation of God’s works, Ps. 104:34. Singing of Psalms is a vent for spiritual mirth, Lam. 5; Eph. 5:18-19; then God should be solemnly praised, Ps. 92:1-2.

5. It is the temper of the people of God to delight in his solemn worship, Ps. 2; 1 Cor. 2:12. Male concordat canticum novum et vetus homo [The new song and old man poorly agree]. Augustine; Ps. 84:1, 10; Ps. 122:1.

6. Delight in the Sabbath is the best way to discharge the duties:

1. With comfort; delight sweetens all; how will men toil at their sport? Neh. 11:8.

2. With profit, Isa. 64:5; God will not send them away sad which come into his presence with joy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London: A.M., 1654), 9th Book, of the Moral Law, ch. 5, 4th Commandment, pp. 820-21</span></figcaption>

<main class="wrap"><figure class="quote" id="q-5240ad4d2c" data-kw="">
<blockquote><p>Now Libertines turn all our faith in a topic and conjectural opinion, so most of them are turned sceptics and affirm that we know nothing with any certainty; yea the more supernatural and sublime that fundamentals of salvation are, the more indulgence and latitude of liberty is to be yielded to the consciences of all men, because the higher the subject is, the ranker is our propension to err, God having given a thinner and more scarce measure of knowledge in supernaturall things, that do so far transcend the sphere and orb of natural reason, than of knowledge in natural things, our minds being in their own element, and in a capacity to reach their connatural and proper object when they are among natural things knowable by the light of nature; Hence that opinion now so prevailing that all and every religion is to be tolerated, and an indulgence yielding to all in superstructures in fundamentals, though a man should deny that Christ is the Saviour of the world; therefore Saltmarsh takes on him (Sparkles of Glory as pp. 185-188) to reckon out the articles of our faith, especially concerning the first Adam’s sin, sin-original, of Christ born of the virgin Mary, made under the Law, bearing our sins, dead, buried, ascended into Heaven, siting at the right hand etc. and speaks of the highest attaintments of the protestants generally in the mystery of salvation. but speaks not one word of the general resurrection of our bodies, of Christ coming to judge all men, of a Heaven and Hell after this life, as if these were none of the highest attaintments of the protestants generally in the mystery of salvation. And Saltmarsh, as I conceive with Hymeneus and Philetus and other Libertines in the [English] army, doubt of or deny these…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, ... (London, 1648) | pt. 1 | ch. 32, ‘What Certainty of Faith the Saints may Attain to Beyond the Familists’ Fluctuation of Faith: of Heresie &amp; Schism’, pp. 274-5</span></figcaption>

<blockquote><p>4. ‘By this the justified man lives and abides’ (as Towne says) ‘forever, by faith, in the sight of God.’ But what haste? The Resurrection is not past yet, except Antinomians with Familists follow Hymeneus and Phyletus: [1.] Nor are the justified yet glorified; they abide not ever under God’s eye sinless and as clean as Christ (as Eaton blasphemes to his everlasting shame), for the Jebusite (says Towne) remains in the land, the law of the members and sinful corruption of the flesh dwells in them.

2. They must say daily, ‘Forgive us our sins,’ if God be their Father, else they need not pray daily, ‘hallowed be thy name, thy kingdom come,’ etc.

3. The flesh of sin dwells with the Spirit, Rom. 7, while they live.

4. Death is not an imaginary lie and fancy, so as faith must believe the contradicent [contrary], that is, that believers’ breath goes not out, they return not to their dust, [rather] they are to believe, sure, believers see corruption, Acts 13:36; 2:27-29; 1 Cor. 15:42-44. Then Antinomians cannot say true[ly] that there is no more sin in believers, nor anything having the nature and being of sin, than is in Christ.

5. They are not yet enjoying God in a vision of glory, as Christ did, even in the days of his flesh, for He was both ‘viator’ [wayfarer] and ‘comprehensor’ [attainer], a traveller to the crown and an enjoyer of the crown, and therefore though justified, they must walk here below, and cannot choose but sin, though they be ‘not forced’ to sin (as Towne says).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, ... (London, 1648) | pt. 2 | ch. 58, ‘Antinomians teach, believers must not walk in their conversation as in the sight of God, but must live by faith with God’, p. 103</span></figcaption>

<blockquote><p>Wherefore there remaineth two rules for to judge of spirits. One is, if the opinions, as touching faith be retained perfect and pure. And this meant John when he said: ‘If any man confess the Lord Jesus,’ etc. And this confession of opinions must be examined by the holy Scriptures: the which seeing they had not in the Church at the beginning, as concerning the New Testament, they were examined by the words and doctrine of the apostles. Therefore John a little after says: ‘He that is of God heareth us, and he that heareth not us is not of God.’ Then he adds, that thus we do prove the spirit. Another rule is of manners and life: This did Christ express when he said: ‘By their fruits ye shall know them.‘ And as opinions are known by examining of them with the Scriptures, so life and manners should be tried by the discipline of the Church… In the primative Church a gift was extant whereby it might easily be known with what spirit they which did speak were led. By these means Satan was resisted when he transformed himself into an angel of light.</p></blockquote>

<blockquote><p>I. Whether regeneration of the intellect through illumination, both in the first and in the second act, whose terminus or formal effect is knowledge and assent to truth, theological wisdom, ecclesiastical prudence, etc., differs in species and form from that more common aid of illumination which also befalls certain reprobate, or the elect before actual conversion? Response: Affirmatively, from 1 Jn. 5:19–20; Phil. 1:9–10; Col. 1:9; Eph. 1:17–18; Jm. 3:13, 15, 17, where distinctly ἡ ἄνωθεν σοφία [hē anōthen sophia, the wisdom from above]; and Lk. 1:17, φρόνησις δικαίων [phronēsis dikaiōn, the prudence of the righteous]. Concerning which [see] in the Disputation on Simplicity and Hypocrisy. By equal reasoning we think a distinction should be made here, as concerning faith of miracles and other charisms in the regenerate, which are materially common, formally peculiar and proper in the regenerate and truly faithful, Mk. 16:16–17; Jn. 7:28[?]; Acts 19:4–6. Compare the Disputations on Miracles and on Charisms. But whether the habit of theological wisdom or ecclesiastical prudence in the unregenerate ought properly and specifically to be called infused, or indeed acquired, could be inquired. We incline to the latter affirmative, so that we regard such habits in the same estimation as their philosophical, medical, historical, poetic habits, etc.</p></blockquote>

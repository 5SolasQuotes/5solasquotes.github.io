<main class="wrap"><figure class="quote" id="q-70334928a3" data-kw="">
<blockquote><p>‘Dost thou wish’, he [the apostle] says, ‘to be cheerful, dost thou wish to employ the day? I give thee spiritual drink;’ for drunkenness even cuts off the articulate sound of our tongue; it makes us lisp and stammer, and distorts the eyes, and the whole frame together. Learn to sing psalms, and thou shalt see the delightfulness of the employment. For they who sing psalms are filled with the Holy Spirit, as they who sing satanic songs are filled with an unclean spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies on the Epistle to the Ephesians in A Library of Fathers of the Holy Catholic Church</cite>, … Trans. members of the English Church (Oxford, 1845), Sermon 19, vv. 18-21, p. 302</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>Teaching and admonishing one another in Psalms, and Hymns, and spiritual Songs] See Eph. 5:19. In both which places, as the Apostle exhorteh us to singing, so he instructs what the matter of our song should be,† viz. Psalms, Hymns, and spiritual Songs. Those three are the titles of the songs of David, as they are delivered to us by the Holy Ghost Himself; some of them are called Mizmorim, Psalms; some Tehillim, Hymns; some Shirim, Songs, Spiritual Songs. †Mr. Cotton of singing of Psalms, ch. 4, and on 1 Cant., Psalmus est in quo concinendo adhibetia musicum aliquod instrumentum praeter linguam. Hymnus propriè est laudis canticum, sive alta voce, sive aliter canatur. Oda non laudes tantum continet, sed paraeneses &amp; alia argumenta. Calvinus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon all the New Testament, Philological &amp; Theological</cite>, (London: 1650) | on Col. ch. 3, verse 16, p. 306</span></figcaption>

</figure><figure class="quote" id="q-10bee237fb" data-kw="">
<blockquote><p>And if we look into the book of Psalms, we shall find not only a great many which do generally concern the estate of the whole Church, and therefore are most fit to be sung in the common assemblies… … And if the private singing of psalms were not so necessary a duty of Christians as it is, to what end serves that earnest exhortation of the apostle to the Colossians? Let the word of Christ dwell in you plenteously in all wisdom, teaching and admonishing one another in psalms, and hymns, and spiritual songs, singing with grace in your hearts to the Lord (Col. 3:16). Where he teaches the whole Church how they should behave themselves in their private meetings… they should sing spiritual songs, whereof there are so many kinds, as appears by the diverse words he uses in this place, as when he says, psalms, hymns, and spiritual songs. Whereunto agrees that which he writes unto the Ephesians: Be not drunken with wine… speaking unto yourselves in psalms, and hymns, and spiritual songs… (Eph. 5:18-20)… they on the contrary should in the midst of these things (being guided by God’s Spirit) burst forth into the praises of God through Jesus Christ; and testify their holy mirth, not of the flesh, but of the Spirit, by singing Psalms; whereof there are so many sundry kinds, that for every time we shall be fitted with some one or other [psalm, hymn, or spiritual song.] Let us not therefore deny so manifest a truth, but acknowledge as the Word teaches us, that the Lord requires of us in our private meetings upon the Lord’s Day, and when we are alone by ourselves, to sing psalms, as well as in the church. And though I do not bind men unto this–for be it far from me that I should lay any heavier burden upon any, than the Word of God itself binds–bind them I say unto this, that in all their mirth they should sing psalms, as might seem the places alleged do import… For as that is… a blessed heaviness that makes us seek unto the Lord; so that is a godly mirth that ends with singing of psalms, and a heavenly joy, that at leastwise makes us more fit to serve God. . pp. 406-7 What Makes it Comely …So though to sing be never so comely in its own nature, yet it become not us, except we be prepared for it, and do sing David’s psalms [not so much with David’s harp,] as with David’s spirit. Therefore the apostle, writing to the Ephesians, wills them in singing to make melody in their hearts to the Lord (Eph. 5:19), and not to sing with the tongue only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-bownd.html">Nicholas Bownd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of the Sabbath</cite>, (1595/1606; Naphtali &amp; RHB, 2015) Emphasis in the original. See also pp. 402-3. | Book 2, ch. 11, ‘Private Worship: Singing of Psalms’, pp. 396-8</span></figcaption>

<blockquote><p>A brilliantly worded, deeply devotional, phrase-by-phrase study of Psalm 51.” – Cyril Barber . 1900’s King, Frederick LaRue – ‘Psalm 51’ in Exposition of Selected Psalms (Pennypacker, 1911), pp. 102-39 King (1823-1905) was an American minister born in NJ who graduated from Princeton University who labored in New York and Pennsylvania. Adams, John – Ps. 51, An Ideal Prayer in The Lenten Psalms in The Short Course Series (Charles Scribner’s Sons, 1912) Chappell, Clovis Gillham – ‘A Murderer’s Prayer: David, Ps. 51’ in More Sermons on Biblical Characters (NY: Doran, 1923), pp. 165-75 MacArthur, John – ‘True Confession’ on Ps. 51, a sermon (1979) Beisner, Calvin – ‘Longings of a Broken Heart: Psalm 51’ in Psalms of Promise: Celebrating the Majesty &amp; Faithfulness of God (Presbyterian &amp; Reformed, 1988), pp. 99-115 . 2000’s Ruddell, Todd – ‘Psallo: Psalm 51’ in The Confessional Presbyterian, vol. 3 (2007), pp. 273-75 at Confessional.org Keele, Zach – ‘The Stains of Guilt: A Guide for Confession in Psalm 51’, pt. 1, 2 (2023) at Heidelblog Boswell, Matthew – Create in Me a Clean Heart: Experiencing God’s Abundant Mercy in Psalm 51 (Crossway, 2026) About Blurb: “Based on sermons by Matthew Boswell, Create in Me a Clean Heart reflects on the beauty of Psalm 51. In examining the chapter’s key themes of repentance, restoration, renewal, and response, Boswell offers a fresh, unhurried look into David’s heart and the Christian walk. This rich exposition teaches readers who long for forgiveness or need to understand their own need for repentance to find hope through the joy of confession and the mercy of Jesus.</p></blockquote>

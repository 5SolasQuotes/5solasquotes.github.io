<blockquote><p>When we think of… God… thought takes the form of an attempt to conceive something than which nothing more excellent or sublime exists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Doctrine, I, 7, 7</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-01cb76a8c2" data-kw="">
<blockquote><p>Q. 75. What is sanctification? A. Sanctification is a work of God’s grace, whereby they whom God hath, before the foundation of the world, chosen to be holy, are in time, through the powerful operation of his Spirit[b] applying the death and resurrection of Christ unto them,[c] renewed in their whole man after the image of God;[d] having the seeds of repentance unto life, and all other saving graces, put into their hearts,[e] and those graces so stirred up, increased, and strengthened,[f] as that they more and more die unto sin, and rise unto newness of life.[g] [b] Eph. 1:4. 1 Cor. 6:11. 2 Thess. 2:13. [c] Rom. 6:4-6. [d] Eph. 4:23,24. [e] Acts 11:18. 1 John 3:9. [f] Jude 20. Heb. 6:11,12. Eph. 3:16-19. Col. 1:10,11. [g] Rom. 6:4,6,14. Gal. 5:24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Larger Catechism</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

<blockquote><p>4. [God justifies] By way of Execution, when the sentence is executed. This is in part done here, as God takes off the penalties and fruits of sin, either in the way of his internal or external government, and gives us many blessings, as the pledge of his love, and above all, the gift of the Holy Spirit, whereby He sanctifies us more thoroughly, and works in us that which is pleasing in his sight: This He gives as the God of peace, as reconciled to us in Christ, Heb. 13:20-21: ‘Now the God of peace that brought again from the dead our Lord Jesus, that great shepherd of the sheep, through the blood of the everlasting Covenant, make you perfect in every good work, to do his will, working in you that which is pleasing in his sight, through Jesus Christ.’ 1 Thess. 5:23: ‘And the very God of peace sanctify you wholly: and I pray God your whole spirit, and soul, and body, be preserved blameless unto the coming of our Lord Jesus Christ;’ Faithful is he that calls you, who will do it: but more fully at the Last Day, when we enter into everlasting glory; and the wicked are turned into Hell with the Devil and his angels, Mt. 25:46, ‘And these shall go into everlasting punishment; but the righteous into life eternal’: then is the full and final execution, a perfect freedom from all misery, and a possession of all happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons… (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33</cite>, p. 334</span></figcaption>

584e2a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/sanctification#:~:text=4.%20%5BGod%20justifies%5D%20By%20way%20of,and%20a%20possession%20of%20all%20happiness." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-06fa1177e8" data-kw="">
<blockquote><p>Effects arisen and dependent from faith considered organically are: … IV. Sanctification strictly so called, or the excitation and study of new holiness in the inner and outer man, 2 Cor. 7:1. To which pertains the practice of repentance and faith and a purged conscience… Now the proper character of this new practice of holiness is perfection or integrity, which consists in this: … 5. That they are perfect with perfection of the greater parts, namely, the inner and outer—that is, that they worship God not hypocritically but sincerely. 6. That moreover they are perfect with perfection of the lesser parts—that is, they live according to all the commandments of God as to the ordinary and composed course of life, so that they know no commandment of God or set before themselves any which they have resolved to transgress knowingly and willingly, Phil. 1:1 [This should be a different reference]; Rom. 7:15–16. 7. That they also in their own manner attain some perfection of degrees: namely, by desire, affection, purpose, study, and endeavor—yet not by effect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

<blockquote><p>A disposition to good works is necessary to justification, being the qualification of an active and lively faith… Sincere, uniform and constant [obedience], though imperfect in measure and degree, and this is so necessary that without it there is no salvation to be expected. The Covenant of Grace calls for perfection, accepts sincerity, God in mercy pardoning the imperfections of our best performances. If perfection was rigidly exacted, no flesh could be saved: if not at all commanded, imperfection should not be sin, nor perfection to be labored after. The faith that is lively to embrace mercy is ever conjoined with an unfeigned purpose to walk in all well-pleasing, and the sincere performance of all holy obedience, as opportunity is offered, does ever attend that faith whereby we continually lay hold upon the promises once embraced. Actual good works of all sorts (though not perfect in degree) are necessary to the continuance of actual justification, because faith can no longer lay faithful claim to the promises of life, than it does virtually or actually lead us forward in the way to Heaven. For: ‘If we say we have fellowship with God and walk in darkness, we lie and do not the truth: But if we walk in the light, as He is in the light, we have fellowship one with another,’ 1 Jn. 1:6-7. This walking in the light as He is in the light is that qualification whereby we become immediately capable of Christ’s righteousness, or actual participants of his propitiation, which is the sole immediate cause of our justification, taken for remission of sins, or actual approbation with God. The truth of which doctrine St. John likewise ratifies in terms equivalent, in the words presently following: ‘and the blood of Christ cleanseth us’ (walking in the light as God is in the light) ‘from all sin.’ [v. 7]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace… (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’</cite>, pp. 20-21</span></figcaption>

<main class="wrap"><figure class="quote" id="q-56cb50f6b5" data-kw="">
<blockquote><p>Therefore, Jesus Christ, true God and true man (i.e. consisting truly of a human body and soul and, by the working of the Holy Spirit, of the substance of the Virgin Mary, daughter of David), was truly conceived and indeed born of that virgin (virgin, I say, both before and after giving birth) and was to fulfill all things for our salvation (Matt. 1:21-23; Luke 1:27,31).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/affirmation-of.html">Affirmation of</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of Tarcal &amp; Torda 1562/3</cite>, Article 23 in ed. Dennison, Jr., Reformed Confessions 2.663. This was a Transylvanian confession.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-5db7de0c84" data-kw="">
<blockquote><p>But that even our Scriptures… use metaphorical and symbolic words and discourse is clearly apparent from these things… How is it that Mary herself calls Joseph the father of Jesus (Luke 2:48)? What pious person would not profess that all these things are said improperly? Or, having been taught by Scripture, do we not firmly believe that the Lord Jesus was by no means conceived by the seed of Joseph (which certain heretics, being of unsound mind with the Jews, have dared to proclaim) but that He was conceived of the Holy Spirit (Luke 1:35), and that His blessed mother had never known a man but remained a virgin and untouched forever?</p></blockquote>

</figure><figure class="quote" id="q-3e46fbc951" data-kw="">
<blockquote><p>The first trial of the faith of the new converts was the definition of the dogma of the Immaculate Conception, in 1852, when a doctrine was declared to be the universal ancient tradition of the Church, on which eminent divines had notoriously held different opinions, so much so, that this diversity had been accounted for by Bishop Milner and other controversialists by the assertion that neither Scripture nor tradition contained anything on the subject.</p></blockquote>

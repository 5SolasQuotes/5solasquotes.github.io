<blockquote><p>6. That though ordination be not, as the two sacraments of the Covenant of Grace, and necessary to salvation, nor generally to all the people, yet may it not unfitly be called, ‘the Sacrament of Orders,’ or of our ministerial Covenant with Christ, as a soldiers oath and engagement was [called] Sacramentum Militare.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-322c200def" data-kw="">
<blockquote><p>Controversy 3 – Did the first reformers, Luther, Calvin and others, have a legitimate calling? We affirm against the Papists. Arguments 1. They were qualified, called by the Church, approved by the magistrate, and, originally, appointed by the Roman Church itself to teach. Objections 1. Then the Roman Church is a true Church. Reply: Originally, it was, and later it became impure, however, it did perform this according to the Word of God, that it called ministers. 2. They were not confirmed by bishops following the ordinary rituals. Reply: It was not necessary. But their calling can be called extraordinary: a. Insofar as God gave them extraordinary gifts. b. From an extraordinary impulse of the Holy Spirit. c. Insofar as God used them for an extraordinary work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-rijssen.html">Leonard Rijssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 16, ‘The Church’</cite>, p. 214</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-a54315bb33" data-kw="">
<blockquote><p>…gifts give not the keys, nor authority to use gifts; and so that all believers, though gifted and graced also, have not power of the keys. 2. It’s certain that in a constituted Church there be no hands nor mouths to do and speak by authority, and ex officio, by virtue of an office, save only elders and pastors; and that if they do or speak, they do it extraordinarily, when Churches’ hands are lame and her eyes blind; or if they do and speak ordinarily, it is from the law of charity in a private way, not by power of the keys, and as judges and officers.</p></blockquote>

</figure><figure class="quote" id="q-7bb5dc3c23" data-kw="">
<blockquote><p>Ordination appears to have been performed by apostles, by evangelists, and by a presbytery, Acts 6:6, and 14:23; Tit. 1:5; 1 Tim. 5:22, and 4:14: but never by private Christians. Could these [private Christians] ordain their pastors or other ecclesiastic officers, to what purpose did Paul leave Titus at Crete to ordain elders in every city? Or why did he write never a word about ordination to the people, in any of his epistles, but to their rulers?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters on the Constitution, Government &amp; Discipline of the Christian Church (d. 1787)</cite>, pp. 73-74</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-32882f1932" data-kw="">
<blockquote><p>The reason why it is believed, that regeneration does not usually accompany baptism, is simply because no evidences of spiritual life appear in baptized children more than in those which remain unbaptized. The education of children should proceed on the principle that they are in an unregenerate state, until evidences of piety clearly appear, in which case, they should be sedulously cherished and nurtured. These are Christ’s lambs — ” little ones, who believe in Him” whom none should offend or mislead upon the peril of a terrible punishment. But though the religious education of children should proceed on the ground that they are destitute of grace, it ought ever to be used as a means of grace. Every lesson, therefore, should be accompanied with the lifting up of the heart of the instructer to God for a blessing on the means. “Sanctify them through thy truth; thy word is truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-alexander.html">A.A. Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts on Religious Experience (Philadelphia: Presbyterian Board of Publication, 1841)</cite>, pp. 26-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

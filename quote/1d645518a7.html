<main class="wrap"><figure class="quote" id="q-1d645518a7" data-kw="">
<blockquote><p>Infiniteness is God of universal, unlimited and incomprehensible perfection, Job 11:8-9; 1 Tim. 6:16. His understanding is infinite, Ps. 147:5. What is there said of one attribute, is true of all. God receives not his being of any, but has it of himself: yea, He is his own being, therefore illimited; for there is none to limit Him. God wills Himself freely, yet necessarily; that which acts necessarily, acts with all its might. God therefore having all perfection in his own power, cannot deny any to Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, Of the Divine Essence, pp. 9-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/infinity-and-immensity.html">Infinity and Immensity</a></span></div>

</figure><figure class="quote" id="q-39e752de40" data-kw="">
<blockquote><p>The affirmation of God as transcending all such distinction… is not an admission that God’s being is contentless, however, but, on the contrary, the ascription to him of the very plenitude of all content. He is this actual plenitude nonetheless in a way that remains unknown and unknowable, i.e., though affirmed by way of concepts and from a perspective provided by man’s concepts, he is not properly represented in any concept. To admit there could be a concept of God is to admit that his essence is something other than the act of being (esse)… Thus, God is what he is in a way that cannot be properly grasped in a concept because the latter expresses only a mode of being. … The determinateness of God, far from being exclusive of other determinations, is all-embracing in a unity transcendent to the rich diversity of the finite. All that is excluded is what pertains not to beings as such, but to their diminished or defective states, to being as it suffers privation in its finite instances with such sequelae to finitude as, e.g., evil. This is but to say: God is wholly infinite and nowise finite.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-j-hill.html">William J. Hill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘In What Sense is God Infinite? A Thomistic View’ in The Thomist XLII</cite>, (1978), pp. 14-27, pp. 17-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/infinity-and-immensity.html">Infinity and Immensity</a></span></div>

</figure><figure class="quote" id="q-15f2d2300e" data-kw="">
<blockquote><p>A conclusion certain enough: God loves himself.” p. 100 Proof: … 2) Blessedness seems to be a pure perfection, and therefore it belongs to God in supreme degree. But love seems to be either the principal element in blessedness, or at any rate intimately connected with the blessedness of an intellectual being. That blessedness is a pure perfection is clear from the notion of it; for blessedness is nothing other than an intellectual being pleased, that follows upon possession of one’s proper perfection. But God knows himself as infinitely perfect; he seems, therefore, to be blessed; therefore blessedness seems to be a pure perfection. … 18. Whatever a finite cause can produce, God can directly produce. This conclusion seems to be a corollary of the preceding one, for the reason there stated. … Conclusions Respecting Reality … 30. Evil involves good, or evil exists in a good, for from what was said, evil is privation of good in something good. … Evil cannot have a material or formal cause, namely constitutive principles. If the material cause is taken in the sense of the subject-in-which, good is this cause. Evil cannot exist in itself, but [only] in some good. But can it have a final cause? Physical evil [as distingushed from moral evil] can be intended as a means to some end, and licitly so, provided the end is good, or indifferent, or proportionate to the evil. Moral evil can be intended only illicitly and only by a finite will. But no evil can be desired for its own sake or as an end, save under the appearance of good. For evil as such has no appetibility in itself or because of itself. But every evil can be permitted, that is, not impeded either by God or by man, given what needs to be given.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Allan Wolter’s Conclusions respecting Reality, Proving God’</cite>, (1958), ‘Conclusions respecting Reality’</span></figcaption>

<blockquote><p>The brief text… will address… the following points:

1. The historical development of infinity as a divine attribute;

2. The teaching of Thomas Aquinas on divine infinity;

3. A philosophical appraisal of this teaching;

4. An appraisal of this teaching from the point of view of Christian faith;

5. Some remarks on alternative positions – especially on process theism and a non-theistic stance – in view of a critical dialogue.</p></blockquote>

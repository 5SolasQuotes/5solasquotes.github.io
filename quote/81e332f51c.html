<main class="wrap"><figure class="quote" id="q-81e332f51c" data-kw="">
<blockquote><p>The paying of money to the clerks [related to the Scottish third Indulgence of 1679]… These clerks seek it not by the prelates’ authority, but upon the [civil] council’s appointment, backed with charges of horning [being declared a rebel and having civil protections taken away]; and whether it be rather eligible to [choose to] pay a little money, or to be put to the horn and taken with caption, let any sober person judge. The scruples that the author [John Brown of Wamphray] and some others have put in the people’s heads about paying of stipends to the conformists and sessors [tax assessors and collectors] have wasted some peoples’ estates and tends to waste their consciences; for when they are quartered on and eaten up and plundered, they are driven to do what they thought sinful [i.e. to pay the tax]; and this disposes them to do things that are truly sinful upon temptations; and when they are by necessity driven to pay, they who wait for their halting, allege they have no conscience; and if they were put to it in other things, they would do all that would be required of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-vilant.html">William Vilant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Review &amp; Examination of a Book bearing the Title of The History of the Indulgence</cite>, (London: Cockerill, 1681), p. 228</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7fcc491e11" data-kw="">
<blockquote><p>Wherever there is a choice between candidates, where one of those candidates, if elected, will clearly do more to uphold the moral law of God to protect the good and punish evil, you have a moral obligation before God to vote for that candidate. That is how you exercise your God-given authoritative position as voter, to protect the good and punish the evil… Now no one exercises authority perfectly: no parent, police officer, professor, or president. But when you are in any of these or other positions of authority, you are obligated, in every instance, to do what is most good and least evil…. the raison d’être of all authorities: punishing the evil and protecting the good…</p></blockquote>

</figure><figure class="quote" id="q-4ee9865af2" data-kw="">
<blockquote><p>With that in mind, I contend that the best commonwealth is the one that has as its chief end, the common or public good, especially in relation to spiritual matters, the glorifying and enjoying of God forever. If this is the chief end of man, it ought to be the chief end of every institution in the world, whether government, school, family, or religious assembly… If the chief end of government is the public good, as the [Westminster] Confession says and the American founders said, especially the spiritual welfare of its subjects, then he [the magistrate] must both decide what is true religion for himself and promote it. The most obvious means is the enforcement of God’s moral law, classically understood as both tables of the Decalogue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-lynch.html">Michael Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Almost Christian Nationalist”</cite>, (2025) at American Reformer</span></figcaption>

<blockquote><p>4. Personal power in man is the first; family power is the next; city and kingdom power supposes these and cannot destroy them. Hence subjects that are not mere slaves stand up to plead for their personal and domestic property, liberty and power, if my money, and limbs and life be not at the patron’s or the prince’s will, much less my soul. He is trusted with my estate and life; but I am first and more trusted with them. He may keep out ill physicians from the land, and encourage the good, but he has no power to tie me to an ill physician, nor to an ill diet, nor to ill servants, etc. The choice of these belongs to myself… I will not believe that the patron loves me and all the parish better than we love ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Answer to Dr. Edward Stillingfleet’s Charge of Separation</cite>, … (London: 1680), ‘A Reply to Dr. Stillingfleet’s Letter’, p. 16</span></figcaption>

<div class="actions"><button class="copy" data-copy="“4. Personal power in man is the first; family power is the next; city and kingdom power supposes these and cannot destroy them. Hence subjects that are not mere slaves stand up to plead for their personal and domestic property, liberty and power, if my money, and limbs and life be not at the patron’s or the prince’s will, much less my soul. He is trusted with my estate and life; but I am first and more trusted with them. He may keep out ill physicians from the land, and encourage the good, but he has no power to tie me to an ill physician, nor to an ill diet, nor to ill servants, etc. The choice of these belongs to myself… I will not believe that the patron loves me and all the parish better than we love ourselves.”

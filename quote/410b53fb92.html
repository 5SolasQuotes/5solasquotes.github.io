<main class="wrap"><figure class="quote" id="q-410b53fb92" data-kw="">
<blockquote><p>By this great sacrifice of himself, which Christ offered, without spot, unto God, He magnified the law and made it honourable. In bowing His anointed head to receive the stroke of that law-avenging sword, which shed His infinitely-precious blood, He paid a homage to the law and justice of God, greater far than if that stroke had fallen on ten thousand apostate worlds.

“Thus,” says the Apostle Paul, “hath God set Him forth to be a propitiation, through faith in His blood, to declare His righteousness for the remission of sins that are past, through the forbearance of God, to declare at this time His righteousness, that He might be just and the justifier of him that believeth in Jesus,” (Rom. iii. 25, 26).

In these words we are expressly told that the death of Christ upon the cross declares the righteousness of God; reveals, that is to say, clearly and fully, what the typical sacrifices of the Old Testament had, till then, but dimly shadowed forth, that God had been acting righteously all along, in pardoning the sins of those who trusted in His promised mercy; that He never at any time had relaxed the penal demands of the law, but had only, in His forbearance, stayed the execution of those penalties against the proper offenders, until their surety und substitute had taken their place, and had been wounded for their transgressions and bruised for their iniquities.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-buchanan.html">Robert Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Relation of the Law, as Given to Israel, to the Mission and Work of Christ in Patrick Fairbairn et al., Divine Revelation Explained and Vindicated: A Course of Lectures for the Times, Delivered in Glasgow in the Spring of 1866</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5f9d9e5623" data-kw="">
<blockquote><p>For the Kind, we must beware how we put the New Creature in the room of Christ: it is not so available as our blessed Lord Jesus is, who is the only Foundation, on which the Church is built, 1 Cor. 3.10. And able to save to the uttermost, Heb. 7.25. No Creature must be set up in competition with him, for there’s no Salvation in any other, Acts 4.12.

And herein I am afraid the Quakers are guilty of a gross Heresy, who call us from a Christ without us, to a Christ within us: yea, it hath been a dispute in the Plantation, called Pennsylvania, whether we must believe only in a Christ within us, or a Christ both within and without us, and it was carried mostly in the former Sense: But let no man be drawn from placing his entire confidence in Christ the Son of God, both God and Man in one Person, who suffered Death on the Cross, to make atonement for Sinners, and now sits on the right hand of God to make intercession for us.

2. If by a Christ within, they mean that called Light within, either Free will or Natural Conscience, or a power to help our selves without special Grace, its an exploded Error, and it’s to be feared, the Jesuits deliver their Popish stuff out of these men’s Mouths with refined Language. 3. If by Christ within, be meant Christ’s Person in the Believer, that he is Christed or Goded, ’tis blasphemy. 4. If by this expression, Christ within us, the hope of glory, Col. 1.27. or Christ dwelling in our hearts by faith, Eph. 3.17.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oliver-heywood.html">Oliver Heywood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A new creature: or, A short discourse, opening the nature, properties, and necessity of the great work of the new creation upon the souls of men. Being some plain discourses on Galatians vi. 15</cite>, (London: Tho. Parkhurst, 1695), p. 44.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

</figure><figure class="quote" id="q-931b3d6b25" data-kw="">

</figure><figure class="quote" id="q-b739b4f72c" data-kw="">
<blockquote><p>They further argue, that Christ is the meritorious cause of the resurrection; and since he has merited nothing for the wicked or reprobate they shall not be raised. The answer to which is, that Christ is the meritorious cause of the resurrection of life, but not of the resurrection of damnation; the saints will rise to life by virtue of union to Christ, through his merit, and the power of his resurrection: not so the wicked; they will rise, not through his merit, and by virtue of union to him, but by his almighty power.</p></blockquote>

</figure><figure class="quote" id="q-ab17f8e132" data-kw="">
<blockquote><p>It was also required that our Mediator should be both God and man. God, that he might have free access to the Father; man, that we might have access to him. God, in order to know all the secret things of the Father that were to be revealed; man, that he might declare them to us: God, that he might sanctify us by his Spirit; man, that he might shew us the way to heaven by his example: God, that he might satisfy divine justice, and overcome sin, death, and the devil; man, that he might offer himself as a sacrifice: God, that he might stamp the highest value on his sufferings; man, that he might be capable of suffering.</p></blockquote>

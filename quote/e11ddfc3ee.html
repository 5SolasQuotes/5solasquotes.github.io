<blockquote><p>Matthew and Mark almost exhaust the resources of language to convey to us some conception of our Lord’s “agony”¹ as an early interpolator of Luke (Lk.xxii. 44) calls it, in this dreadful experience. The anguish of reluctance which constituted this “agony” is in part described by them both—they alone of the Evangelists enter into our Lord’s feelings here—by a term the primary idea of which is loathing, aversion, perhaps not unmixed with despondency.² ¹ [Greek] agonia: see G. Heine, Synonymik etc., 1898, p. 189: “Contest, quaking, agitation (and anxiety of the issue?) Lk. xxii. 44; Luther, ‘he grappled with death’, Weizsacker, ‘he struggled’, Bengel; ‘supreme grief and anguish. It properly denotes the anguish and passion of the mind, when it enters upon a conflict and arduous labor, even when there is no doubt of a good issue’.” Plummer in loc.: “Field contends that fear is the radical notion of the word. The passages in which it occurs in LXX confirm this view… It is therefore an agony of fear that is apparently to be understood.” It would be better to say consternation, appalled reluctance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Emotional Life of our Lord’</cite>, (1912), pp. 74-76</span></figcaption>

— Robert Anderson, The Lord from Heaven (1910; Kregel, 1978) 115, pp. ToC">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6ably+expounds+Christ%E2%80%99s+deity+from+both+testaments%2C+focusing+on+Him+as+King+of+kings.%E2%80%9D%0A%0A%E2%80%94+Robert+Anderson%2C+The+Lord+from+Heaven+%281910%3B+Kregel%2C+1978%29+115%2C+pp.+ToC&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5fa1a5f17a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5fa1a5f17a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-divinity-of-christ/#:~:text=ably%20expounds%20Christ%E2%80%99s%20deity%20from%20both,on%20Him%20as%20King%20of%20kings&amp;text=ably%20expounds%20Christ%E2%80%99s%20deity%20from%20both%20testaments%2C%20focusing&amp;text=testaments%2C%20focusing%20on%20Him%20as%20King%20of%20kings" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-913e6be71c" data-kw="">
<blockquote><p>We have seen that our Lord formerly contended with the fear of death; but as He now fights face to face with temptation, such an attack is called the beginning of grief and sorrow… Thus, though God had already tried his Son by certain preparatory exercises, He now wounds Him more sharply by a nearer prospect of death, and strikes his mind with a terror to which He had not been accustomed. But as it appears to be inconsistent with the divine glory of Christ, that he was seized with trembling and sadness, many commentators have labored with toil and anxiety to find some way of evading the difficulty. But their labor has been ill-judged and of no use; for if we are ashamed that Christ should experience fear and sorrow, our redemption will perish and be lost. Ambrose justly says: ‘I not only do not think that there is any need of excuse, but there is no instance in which I admire more his kindness and his majesty; for he would not have done so much for me, if he had not taken upon him my feelings. He grieved for me, who had no cause of grief for himself; and, laying aside the delights of the eternal Godhead, he experiences the affliction of my weakness. I boldly call it sorrow, because I preach the cross. For he took upon him not the appearance, but the reality, of incarnation. It was therefore necessary that he should experience grief, that he might overcome sorrow, and not shut it out; for the praise of fortitude is not bestowed on those who are rather stupefied than pained by wounds.’ Thus far Ambrose. Certainly those who imagine that the Son of God was exempt from human passions do not truly and sincerely acknowledge him to be a man. And when it is even said that the divine power of Christ rested and was concealed for a time, that by his sufferings He might discharge all that belonged to the Redeemer, this was so far from being absurd, that in no other way could the mystery of our salvation have been accomplished. For Cyril has properly said: ‘…For the same reason that the Word of God is God, (Jn. 1:1) and is naturally life itself, (Jn. 11:25) nobody doubts that he had no dread of death; but, having been made flesh (Jn. 1:14) He allows the flesh to feel what belongs to it, and, therefore, being truly a man, He trembles at death, when it is now at the door… You see how human nature, even in Christ Himself, has the sufferings and fears which belong to it, but that the Word, who is united to it, raises it to a fortitude which is worthy of God.’… Still the weakness which Christ took upon Himself must be distinguished from ours, for there is a great difference. In us there is no affection unaccompanied by sin, because they all exceed due bounds and proper restraint; but when Christ was distressed by grief and fear, He did not rise against God, but continued to be regulated by the true rule of moderation. We need not wonder that, since He was innocent, and pure from every stain, the affections which flowed from Him were pure and stainless; but that nothing proceeds from the corrupt nature of men which is not impure and filthy. Let us, therefore, attend to this distinction, that Christ, amidst fear and sadness, was weak without any taint of sin; but that all our affections are sinful, because they rise to an extravagant height. …And whence came to Him both sorrow and anxiety and fear, except because He felt in death something sadder and more horrible than the separation of the soul and body? And certainly He underwent death, not merely that He might move from earth to heaven, but rather that He might take on Himself the curse to which we were liable, and deliver us from it. His horror was not, then, at death simpliciter, as a passage out of the world, but because He had before his eyes the dreadful tribunal of God, and the Judge Himself armed with inconceivable vengeance; it was our sins, the burden of which He had assumed, that pressed Him down with their enormous mass. It is, then, not at all strange if the dreadful abyss of destruction tormented Him grievously with fear and anguish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew</cite>, 26, v. 37</span></figcaption>

<blockquote><p>[The] Use of all is to press us to this weighty duty of living to God, and not to ourselves. Not to our own will and interest, and according to the will, and for the glory of God. Motives: 1. Christ’s self-denial, who came from heaven not only to expiate our offenses, but to give us an example. And wherein was the example? He tells us He came not to do his own will, but the will of Him that sent Him, Jn. 6:38. And to promote his Father’s glory, Jn. 8:50, ‘I seek not my own Glory’? He was still guided by his Fathers will, and had his orders from heaven for all that He did. Now how did He do the will of God and seek the glory of God? He did it with delight, Jn 4:34, ’twas meat and drink to Him to do his Fathers will. A will wedded to itself, and his own honour and ease, and credit, is most unlike Christ. And He did it with much patience, and self-denial, Rom. 15:3. He pleased not Himself, that is, sought not the interests of that life He had assumed, but contradicted them by his fastings, temptations sufferings, through the reproaches, and ingratitude of men, and outward meanness, and poverty of his condition. And especially by his death, and passion there, he humbled Himself, and made Himself of no reputation, Phil. 2:4-8. That the same mind might be in us; that we might learn that life, and all the comforts of life, should not be so dear to us, as the love of God, and everlasting life; for Christ loved not his life in comparison of love to his Father and his Church. He preferred the pleasing of his Father in the work of redemption, before his own life. Christ emptied himself , that God might be glorified. How unwilling are ye to go back two or three degrees in your pomp or pleasure, or profit, for God’s sake, when the Sun of righteousness went back ten degrees.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>
<div class="actions"><button class="copy" data-copy="“[The] Use of all is to press us to this weighty duty of living to God, and not to ourselves. Not to our own will and interest, and according to the will, and for the glory of God. Motives: 1. Christ’s self-denial, who came from heaven not only to expiate our offenses, but to give us an example. And wherein was the example? He tells us He came not to do his own will, but the will of Him that sent Him, Jn. 6:38. And to promote his Father’s glory, Jn. 8:50, ‘I seek not my own Glory’? He was still guided by his Fathers will, and had his orders from heaven for all that He did. Now how did He do the will of God and seek the glory of God? He did it with delight, Jn 4:34, ’twas meat and drink to Him to do his Fathers will. A will wedded to itself, and his own honour and ease, and credit, is most unlike Christ. And He did it with much patience, and self-denial, Rom. 15:3. He pleased not Himself, that is, sought not the interests of that life He had assumed, but contradicted them by his fastings, temptations sufferings, through the reproaches, and ingratitude of men, and outward meanness, and poverty of his condition. And especially by his death, and passion there, he humbled Himself, and made Himself of no reputation, Phil. 2:4-8. That the same mind might be in us; that we might learn that life, and all the comforts of life, should not be so dear to us, as the love of God, and everlasting life; for Christ loved not his life in comparison of love to his Father and his Church. He preferred the pleasing of his Father in the work of redemption, before his own life. Christ emptied himself , that God might be glorified. How unwilling are ye to go back two or three degrees in your pomp or pleasure, or profit, for God’s sake, when the Sun of righteousness went back ten degrees.”

— Thomas Manton, A Second Volume of Sermons preached by the late reverend and learned Thomas Manton in two parts: the first containing 27 Sermons on the Twenty-Fifth chapter of St. Matthew... (London: Robinson, 1684), Sermons on 2 Cor. 5, sermon 29, on 2 Cor. 5:15, p. 187">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BThe%5D+Use+of+all+is+to+press+us+to+this+weighty+duty+of+living+to+God%2C+and+not+to+ourselves.+Not+to+our+own+will+and+interest%2C+and+according+to+the+will%2C+and+for+the+glory+of+God.+Motives%3A+1.+Christ%E2%80%99s+self-denial%2C+who+came+from+heaven+not+only+to+expiate+our+offenses%2C+but+to+give+us+an+example.+And+wherein+was+the+example%3F+He+tells+us+He+came+not+to+do+his+own+will%2C+but+the+will+of+Him+that+sent+Him%2C+Jn.+6%3A38.+And+to+promote+his+Father%E2%80%99s+glory%2C+Jn.+8%3A50%2C+%E2%80%98I+seek+not+my+own+Glory%E2%80%99%3F+He+was+still+guided+by+his+Fathers+will%2C+and+had+his+orders+from+heaven+for+all+that+He+did.+Now+how+did+He+do+the+will+of+God+and+seek+the+glory+of+God%3F+He+did+it+with+delight%2C+Jn+4%3A34%2C+%E2%80%99twas+meat+and+drink+to+Him+to+do+his+Fathers+will.+A+will+wedded+to+itself%2C+and+his+own+honour+and+ease%2C+and+credit%2C+is+most+unlike+Christ.+And+He+did+it+with+much+patience%2C+and+self-denial%2C+Rom.+15%3A3.+He+pleased+not+Himself%2C+that+is%2C+sought+not+the+interests+of+that+life+He+had+assumed%2C+but+contradicted+them+by+his+fastings%2C+temptations+sufferings%2C+through+the+reproaches%2C+and+ingratitude+of+men%2C+and+outward+meanness%2C+and+poverty+of+his+condition.+And+especially+by+his+death%2C+and+passion+there%2C+he+humbled+Himself%2C+and+made+Himself+of+no+reputation%2C+Phil.+2%3A4-8.+That+the+same+mind+might+be+in+us%3B+that+we+might+learn+that+life%2C+and+all+the+comforts+of+life%2C+should+not+be+so+dear+to+us%2C+as+the+love+of+God%2C+and+everlasting+life%3B+for+Christ+loved+not+his+life+in+comparison+of+love+to+his+Father+and+his+Church.+He+preferred+the+pleasing+of+his+Father+in+the+work+of+redemption%2C+before+his+own+life.+Christ+emptied+himself+%2C+that+God+might+be+glorified.+How+unwilling+are+ye+to+go+back+two+or+three+degrees+in+your+pomp+or+pleasure%2C+or+profit%2C+for+God%E2%80%99s+sake%2C+when+the+Sun+of+righteousness+went+back+ten+degrees.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+A+Second+Volume+of+Sermons+preached+by+the+late+reverend+and+learned+Thomas+Manton+in+two+parts%3A+the+first+containing+27+Sermons+on+the+Twenty-Fifth+chapter+of+St.+Matthew...+%28London%3A+Robinson%2C+1684%29%2C+Sermons+on+2+Cor.+5%2C+sermon+29%2C+on+2+Cor.+5%3A15%2C+p.+187&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F993fe3fb0f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/993fe3fb0f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/christ/the-human-and-divine-natures-of-christ/on-the-human-nature-of-christ/#:~:text=The%5D%20Use%20of%20all%20is%20to,of%20righteousness%20went%20back%20ten%20degrees&amp;text=The%5D%20Use%20of%20all%20is%20to%20press%20us&amp;text=the%20Sun%20of%20righteousness%20went%20back%20ten%20degrees" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The union personalis in Christ was made adiairetos, indivisibly, in respect of place, so that the human nature is nowhere unsupported by the Logos, the Logos nowhere fails to support the human nature, nor is it outside the Logos or the Logos apart from it: akoristos, inseparably in respect of time, because this union is never dissolved but is perpetual, which was also seen in the death and burial…</p></blockquote>

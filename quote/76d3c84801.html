<main class="wrap"><figure class="quote" id="q-76d3c84801" data-kw="">
<blockquote><p>According to some authors the beautiful should be numbered in some way among the attributes convertible with being. But it seems to be a species of goodness.¹ ¹ Alexander of Hales, Summa, 1, n. 3, “the good is said in two ways, the noble and the useful… I call the noble intelligible beauty.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e182afc1a3" data-kw="">
<blockquote><p>After indicating that the Genevans, of course, wish and hope for the gospel to be spread everywhere, the letter states: “But we know well also what is within our compass, and we do not presume even to wish to reform extensive kingdoms.”… What is fascinating here is the apparent renouncing, on the part of the Genevans, of any connection to the evangelical movement within France or anywhere else. They would seem to wish for the king to believe that Geneva stays resolutely and quietly within its own geographical border and does not meddle in the work of reforming other parts of Europe, let alone France. In all of this, Geneva kept up a near-constant state of deception in regards to the French king and his government… Geneva was extremely effective at feigning obedience to French kings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jon-balserak.html">Jon Balserak</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Geneva’s Use of Lies, Deceit &amp; Simulation in Their Efforts to Reform France</cite>, 1536–1563’ HTR 112:1 (2019), pp. 76–100, p. 99</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-5dd5cce50b" data-kw="">
<blockquote><p>Reformed moral philosophers in the period of early orthodoxy (ca. 1550–ca. 1650) continue a medieval tradition of engaging moral questions in conversation with Aristotle’s Nicomachean Ethics, and they often address the moral status of self-love in connection with the virtue of friendship. There is broad agreement among these authors that self-love is not only not necessarily sinful, but that some kinds of self-love are morally good and that self-love is the source and rule for love of one’s neighbor. Lambert Daneau’s Ethices Christianae, however, stands in a more complex relationship to this consensus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-mcginnis.html">Andrew McGinnis</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Moral Status of Self-Love in Early Reformed Ethics’ in Journal of Early Modern Christianity Ref</cite>, (2023)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

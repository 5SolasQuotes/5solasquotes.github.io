<main class="wrap"><figure class="quote" id="q-340fa712b7" data-kw="">
<blockquote><p>Edward Bagshaw, p. 12: ‘2. Being present where those things are used in the worship of God, which God has not commanded, this would involve us in the guilt and contagion of them…’ Richard Baxter: Here are two more false doctrines intimated:

1. That to use things in the worship of God which He has not commanded (without exception) is a sin.

2. That being present where they are used involves us in the guilt. Where note:

1. That it is not part of the worship [formally], but things used in the worship that he speaks of.

2. That I proved the contrary to both these at large… and [Bagshaw] gives not a syllable of answer to my twenty instances and many undeniable reasons to the contrary… Sermon notes, meters, tunes, printed Bibles (as printed) and divided into chapters and verses, the words of a sermon or prayer, the particular method, cups, tables, etc. are used in the worship of God without any particular command or any command for this rather than that in cases of indifferency: and yet all these are not therefore unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, (London: Simmons, 1671), sect. 44, pp. 113-14</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ac344361c5" data-kw="">
<blockquote><p>III. On the statement of the question take notice: (1) acts of divine worship are twofold, some which do not differ form the worship itself (to wit, from piety and holiness, in which worship essentially consists); others ordinated to worship as helps or instruments to perform that worship suitably and declare it abroad. The former kind of acts can be instituted and commanded by God alone, who is the sole chief and legislator, who has dominion over the conscience; nor does any right belong to the Church of adding, taking away or changing anything. The latter, again, are either necessary and so also instituted by God, at least as to being (to on)–for example that assemblies should be held, the word preached, the sacraments administered; others are contingent and free as to quality (to poion), the reason of which depends upon the honesty and fitness of particular churches (to wit, that assemblies should be held in this or that time and place and the sacraments administered). The former, as being necessary, depend upon God alone and the Church has no control or power over them; the latter God has thus far left to the will of the Church as means and indifferent, so that a regard be always paid to divine truth, Christian simplicity and public edification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 3, 18th Topic, Question 31, section III, p. 286</span></figcaption>

</figure><figure class="quote" id="q-1224286efb" data-kw="">
<blockquote><p>Hence arises a manifold difference between the moral law and others [ceremonial and judicial] both in origin (because the moral is founded upon natural right and on this account is known by nature; but the others upon positive right and on this account are from free revelation) and in duration. The former is immutable and eternal; the latter mutable and temporary. In regard to object, the one is universal embracing all; the others particular applying only to the Jews… In regard to use, the moral is the end of the others, while the others are subservient to the moral.</p></blockquote>

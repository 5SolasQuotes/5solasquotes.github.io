<blockquote><p>If any would know how considerable this article concerning original sin hath ever been accounted in the church of Christ, let him but consult the writings of St Augustine, Prosper, Hilary, Fulgentius, any of those learned fathers whom God stirred up to resist, and enabled to overcome, the spreading Pelagian heresy, or look on those many councils, edicts, decrees of emperors, wherein that heretical doctrine of denying this original corruption is condemned, cursed, and exploded. Now, amongst those many motives they had to proceed so severely against this heresy, one especially inculcated deserves our consideration, namely, —

That it overthrew the necessity of Christ’s coming into the world to redeem mankind. It is sin only that makes a Saviour necessary; and shall Christians tolerate such an error as, by direct consequence, infers the coming of Jesus Christ into the world to be needless? My purpose for the present is not to allege any testimonies of this kind; but, holding myself close to my first intention, to show how far in this article, as well as others, the Arminians have apostated from the pure doctrine of the word of God, the consent of orthodox divines, and the confession of this church of England.

In the ninth article of our church, which is concerning original sin, I observe especially four things:— First, That it is an inherent evil, the fault and corruption of the nature of every man. Secondly, That it is a thing not subject or conformable to the law of God, but hath in itself, even after baptism, the nature of sin. Thirdly, That by it we are averse from God, and inclined to all manner of evil. Fourthly, That it deserveth God’s wrath and damnation. All which are frequently and evidently taught in the word of God, and every one denied by the Arminians, as it may appear by these instances, in some of them:—

First, That it is an inherent sin and pollution of nature, having a proper guilt of its own, making us responsible to the wrath of God, and not a bare imputation of another’s fault to us his posterity: which, because it would reflect upon us all with a charge of a native imbecility and insufficiency to good, is by these self-idolizers quite exploded.

“Infants are simply in that estate in which Adam was before his fall,” saith Venator. “Neither is it at all considerable whether they be the children of believers or of heathens and infidels; for infants, as infants, have all the same innocency,” say they jointly, in their Apology: nay, more plainly, “It can be no fault wherewith we are born.” In which last expression these bold innovators, with one dash of their pens, have quite overthrown a sacred verity, an apostolic, catholic, fundamental article of Christian religion. But, truly, to me there are no stronger arguments of the sinful corruption of our nature than to see such nefarious issues of unsanctified hearts. Let us look, then, to the word of God confounding this Babylonish design.

First, That the nature of man, which at first was created pure and holy, after the image of God, endowed with such a rectitude and righteousness as was necessary and due unto it, to bring it unto that supernatural end to which it was ordained, is now altogether corrupted and become abominable, sinful, and averse from goodness, and that this corruption or concupiscence is originally inherent in us and derived from our first parents, is plentifully delivered in holy writ, as that which chiefly compels us to a self-denial, and drives us unto Christ. “Behold, I was shapen in iniquity; and in sin did my mother conceive me,” saith David, Ps. li. 5. Where, for the praise of God’s goodness towards him, he begins with the confession of his native perverseness, and of the sin wherein he was wrapped before he was born.

Neither was this peculiar to him alone; he had it not from the particular iniquity of his next progenitors, but by an ordinary propagation from the common parent of us all; though in some of us, Satan, by this Pelagian attempt for hiding the disease, hath made it almost incurable: for even those infants of whose innocency the Arminians boast are unclean in the verdict of St Paul, 1 Cor. vii. 14, if not sanctified by an interest in the promise of the covenant; and no unclean thing shall enter into the kingdom of heaven. “The weakness of the members of infants is innocent, and not their souls;” they want nothing, but that the members of their bodies are not as yet ready instruments of sin. They are not sinful only by external denomination, — accounted so because of the imputation of Adam’s actual transgression unto them; for they have all an uncleanness in them by nature, Job xiv. 4, from which they must be “cleansed with the washing of water by the word,” Eph. v. 20.

Their whole nature is overspread with such a pollution as is proper only to sin inherent, and doth not accompany sin imputed; as we may see in the example of our Saviour, who was pure, immaculate, holy, undefiled, and yet “the iniquity of us all” was imputed unto him. Hence are those phrases of “washing away sin,” Acts xxii. 16; of “cleansing filth,” 1 Pet. iii. 21, Tit. iii. 5. Something there is in them, as soon as they are born, excluding them from the kingdom of heaven; for except they also be born again of the Spirit, they shall not enter into it, John iii. 5.

Secondly, The opposition that is made between the righteousness of Christ and the sin of Adam, Rom. v., which is the proper seat of this doctrine, showeth that there is in our nature an inbred sinful corruption; for the sin of Adam holds such relation unto sinners, proceeding from him by natural propagation, as the righteousness of Christ doth unto them who are born again of him by spiritual regeneration. But we are truly, intrinsically, and inherently sanctified by the Spirit and grace of Christ; and therefore there is no reason why, being so often in this chapter called sinners, because of this original sin, we should cast it off, as if we were concerned only by an external denomination, for the right institution of the comparison and its analogy quite overthrows the solitary imputation.

Thirdly, All those places of Scripture which assert the proneness of our nature to all evil, and the utter disability that is in us to do any good, that wretched opposition to the power of godliness, wherewith from the womb we are replenished, confirms the same truth. But of these places I shall have occasion to speak hereafter.

Fourthly, The flesh, in the Scripture phrase, is a quality (if I may so say) inherent in us; for that, with its concupiscence, is opposed to the Spirit and his holiness, which is certainly inherent in us. Now, the whole man by nature is flesh; for “that which is born of the flesh is flesh,” John iii. 6; — it is an inhabiting thing, a thing that “dwelleth” within us, Rom. vii. 17. In brief, this vitiosity, sinfulness, and corruption of our nature is laid open, — First, By all those places which cast an aspersion of guilt, or desert of punishment, or of pollution, on nature itself; as Eph. ii. 1, 3, we are “dead in trespasses and sins,” being “by nature the children of wrath, even as others,” being wholly encompassed by a “sin that doth easily beset us.” Secondly, By them which fix this original pravity in the heart, will, mind, and understanding, Eph. iv. 18; Rom. xii. 2; Gen. vi. 5. Thirdly, By those which positively decipher this natural depravation, 1 Cor. ii. 14; Rom. viii. 7; — or, Fourthly, That place it in the flesh, or old man, Rom. vi. 6; Gal. v. 16. So that it is not a bare imputation of another’s fault, but an intrinsical adjacent corruption of our nature itself, that we call by this name of original sin. But, alas! it seems we are too large carvers for ourselves, in that wherewith we will not be contented.</p></blockquote>

em%2C+as+soon+as+they+are+born%2C+excluding+them+from+the+kingdom+of+heaven%3B+for+except+they+also+be+born+again+of+the+Spirit%2C+they+shall+not+enter+into+it%2C+John+iii.+5.%0A%0ASecondly%2C+The+opposition+that+is+made+between+the+righteousness+of+Christ+and+the+sin+of+Adam%2C+Rom.+v.%2C+which+is+the+proper+seat+of+this+doctrine%2C+showeth+that+there+is+in+our+nature+an+inbred+sinful+corruption%3B+for+the+sin+of+Adam+holds+such+relation+unto+sinners%2C+proceeding+from+him+by+natural+propagation%2C+as+the+righteousness+of+Christ+doth+unto+them+who+are+born+again+of+him+by+spiritual+regeneration.+But+we+are+truly%2C+intrinsically%2C+and+inherently+sanctified+by+the+Spirit+and+grace+of+Christ%3B+and+therefore+there+is+no+reason+why%2C+being+so+often+in+this+chapter+called+sinners%2C+because+of+this+original+sin%2C+we+should+cast+it+off%2C+as+if+we+were+concerned+only+by+an+external+denomination%2C+for+the+right+institution+of+the+comparison+and+its+analogy+quite+overthrows+the+solitary+imputation.%0A%0AThirdly%2C+All+those+places+of+Scripture+which+assert+the+proneness+of+our+nature+to+all+evil%2C+and+the+utter+disability+that+is+in+us+to+do+any+good%2C+that+wretched+opposition+to+the+power+of+godliness%2C+wherewith+from+the+womb+we+are+replenished%2C+confirms+the+same+truth.+But+of+these+places+I+shall+have+occasion+to+speak+hereafter.%0A%0AFourthly%2C+The+flesh%2C+in+the+Scripture+phrase%2C+is+a+quality+%28if+I+may+so+say%29+inherent+in+us%3B+for+that%2C+with+its+concupiscence%2C+is+opposed+to+the+Spirit+and+his+holiness%2C+which+is+certainly+inherent+in+us.+Now%2C+the+whole+man+by+nature+is+flesh%3B+for+%E2%80%9Cthat+which+is+born+of+the+flesh+is+flesh%2C%E2%80%9D+John+iii.+6%3B+%E2%80%94+it+is+an+inhabiting+thing%2C+a+thing+that+%E2%80%9Cdwelleth%E2%80%9D+within+us%2C+Rom.+vii.+17.+In+brief%2C+this+vitiosity%2C+sinfulness%2C+and+corruption+of+our+nature+is+laid+open%2C+%E2%80%94+First%2C+By+all+those+places+which+cast+an+aspersion+of+guilt%2C+or+desert+of+punishment%2C+or+of+pollution%2C+on+nature+itself%3B+as+Eph.+ii.+1%2C+3%2C+we+are+%E2%80%9Cdead+in+trespasses+and+sins%2C%E2%80%9D+being+%E2%80%9Cby+nature+the+children+of+wrath%2C+even+as+others%2C%E2%80%9D+being+wholly+encompassed+by+a+%E2%80%9Csin+that+doth+easily+beset+us.%E2%80%9D+Secondly%2C+By+them+which+fix+this+original+pravity+in+the+heart%2C+will%2C+mind%2C+and+understanding%2C+Eph.+iv.+18%3B+Rom.+xii.+2%3B+Gen.+vi.+5.+Thirdly%2C+By+those+which+positively+decipher+this+natural+depravation%2C+1+Cor.+ii.+14%3B+Rom.+viii.+7%3B+%E2%80%94+or%2C+Fourthly%2C+That+place+it+in+the+flesh%2C+or+old+man%2C+Rom.+vi.+6%3B+Gal.+v.+16.+So+that+it+is+not+a+bare+imputation+of+another%E2%80%99s+fault%2C+but+an+intrinsical+adjacent+corruption+of+our+nature+itself%2C+that+we+call+by+this+name+of+original+sin.+But%2C+alas%21+it+seems+we+are+too+large+carvers+for+ourselves%2C+in+that+wherewith+we+will+not+be+contented.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+%CE%98%CE%95%CE%9F%CE%9C%CE%91%CE%A7%CE%99%CE%91+%CE%91%CE%A5%CE%A4%CE%95%CE%9E%CE%9F%CE%A5%CE%A3%CE%99%CE%91%CE%A3%CE%A4%CE%99%CE%9A%CE%97%2C+or%2C+A+display+of+Arminianism%3A+being+a+discovery+of+the+old+Pelagian+idol+free-will%2C+with+the+new+goddess+contingency+%281643%29+in+William+H.+Goold+%28ed.%29%2C+The+Works+of+John+Owen%2C+D.D.+%2824+vols%2C+Edinburgh%3A+T.+%26+T.+Clark%2C+1850-53%29%2C+10%3A+69-72.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9b21058f37.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9b21058f37.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/01/07/john-owen-on-the-apostasy-of-arminians-from-the-church-of-englands-doctrine-of-original-sin/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>5. Was original righteousness natural to man? The opinion of the papists XLIV. It is asked, fifth, whether original righteousness was natural to man. The Pelagianizing papists—so that they may obtain: (1) that concupiscence, whose second acts only does original righteousness control, and whose first act it does not take away, is not itself sin, and accordingly, if it does not stand in the way, man can be perfect here and now; (2) that man was created in purely natural things, that is, by nature, neither just nor unjust; (3) that the natural things of man survived whole after the fall—admit indeed an original righteousness, but one that is supernatural to man, added to nature, so that it may check the natural discord of the flesh and spirit. Meanwhile, they do not deny that it arose with man, and that it would have helped him even in natural things. And the opinion of the Reformed with their reasons The Reformed, although they do not acknowledge that original righteousness (as Flacius [a radical Lutheran] desired) is the very nature of man, yet do acknowledge that it is natural to man, insofar as it was owed to his integral nature in such a way that it could not be morally whole without it. For if (1) it were supernatural, then its opposite, that is, carnal concupiscence or the discord of flesh and spirit, would be natural to man, and thus good and from God, which is contrary to the Scriptures (Rom. 7:7–8; 1 John 2:16). (2) Thus the rebellion of the flesh against the spirit would be natural to man, without any previous demerit, by the condition of nature that was conferred by God, and accordingly, God would be the author of sin. Then (3) blessedness was the natural end of man, and accordingly, so also was righteousness and holiness, without which he could not have achieved blessedness (Rev. 21:27; 1 Cor. 15:50). Objections The arguments of the papists for the most part coincide with the Socinian arguments against original righteousness. For they allege: (1) that there is a natural contrariety of flesh and spirit, of body and soul, and thus original righteousness was not natural. I respond, We previously denied against the Socinians that this obtained in the state of integrity, where a most perfect harmony thrived until the point of sin. (2) That the gifts conferred upon the first man are called honor and glory (Ps. 8:5), which without a doubt are extrinsic and accessory to man, not natural. I respond: (a) The psalmist calls “honor and glory” not only original righteousness, but also the rule of man over the earthly creatures. Then also (b) in a sound sense, original righteousness is honor and glory (Rom. 3:23), insofar as it is the foundation of all honor and glory, and in that sense it was not something extrinsic to man, but something especially intrinsic. Bellarmine has certain other arguments (vol. 4, bk. 1), but they are of no significance; if anyone desires to know more, he may consult his antagonists: Ames, Pareus, and others.85 85. Bellarmine, De controversiis Christianae Fidei in Opera Omnia (Paris: L. Vivès, 1870–91), 5:169–213; William Ames, Bellarminus Enervatus, 4 vols. (Amsterdam: Joannes Janssonius, 1628–29), 4: 5–12; e.g. David Pareus, Quaestiones controversae theologicae…adversus Bellarminum (Schönfeld, 1612); idem, Rob. Bellarmini de justificatione impii libri explicati et castigati studio Davidis Parei (Heidelberg: Jonah Rosa, 1615).</p></blockquote>

d+of+man%2C+and+accordingly%2C+so+also+was+righteousness+and+holiness%2C+without+which+he+could+not+have+achieved+blessedness+%28Rev.+21%3A27%3B+1+Cor.+15%3A50%29.+Objections+The+arguments+of+the+papists+for+the+most+part+coincide+with+the+Socinian+arguments+against+original+righteousness.+For+they+allege%3A+%281%29+that+there+is+a+natural+contrariety+of+flesh+and+spirit%2C+of+body+and+soul%2C+and+thus+original+righteousness+was+not+natural.+I+respond%2C+We+previously+denied+against+the+Socinians+that+this+obtained+in+the+state+of+integrity%2C+where+a+most+perfect+harmony+thrived+until+the+point+of+sin.+%282%29+That+the+gifts+conferred+upon+the+first+man+are+called+honor+and+glory+%28Ps.+8%3A5%29%2C+which+without+a+doubt+are+extrinsic+and+accessory+to+man%2C+not+natural.+I+respond%3A+%28a%29+The+psalmist+calls+%E2%80%9Chonor+and+glory%E2%80%9D+not+only+original+righteousness%2C+but+also+the+rule+of+man+over+the+earthly+creatures.+Then+also+%28b%29+in+a+sound+sense%2C+original+righteousness+is+honor+and+glory+%28Rom.+3%3A23%29%2C+insofar+as+it+is+the+foundation+of+all+honor+and+glory%2C+and+in+that+sense+it+was+not+something+extrinsic+to+man%2C+but+something+especially+intrinsic.+Bellarmine+has+certain+other+arguments+%28vol.+4%2C+bk.+1%29%2C+but+they+are+of+no+significance%3B+if+anyone+desires+to+know+more%2C+he+may+consult+his+antagonists%3A+Ames%2C+Pareus%2C+and+others.85+85.+Bellarmine%2C+De+controversiis+Christianae+Fidei+in+Opera+Omnia+%28Paris%3A+L.+Viv%C3%A8s%2C+1870%E2%80%9391%29%2C+5%3A169%E2%80%93213%3B+William+Ames%2C+Bellarminus+Enervatus%2C+4+vols.+%28Amsterdam%3A+Joannes+Janssonius%2C+1628%E2%80%9329%29%2C+4%3A+5%E2%80%9312%3B+e.g.+David+Pareus%2C+Quaestiones+controversae+theologicae%E2%80%A6adversus+Bellarminum+%28Sch%C3%B6nfeld%2C+1612%29%3B+idem%2C+Rob.+Bellarmini+de+justificatione+impii+libri+explicati+et+castigati+studio+Davidis+Parei+%28Heidelberg%3A+Jonah+Rosa%2C+1615%29.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical+Practical+Theology%2C+%28RHB%29%2C+vol.+3%2C+bk.+3%2C+ch.+9%2C+section+44&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc1dcd5c73f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c1dcd5c73f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/concupiscence-or-desires-of-pre-motions-to-sin-are-sinful/#:~:text=5.%20Was%20original%20righteousness%20natural%20to,Davidis%20Parei%20%28Heidelberg%3A%20Jonah%20Rosa%2C%201615&amp;text=5.%20Was%20original%20righteousness%20natural%20to%20man%3F%20The&amp;text=castigati%20studio%20Davidis%20Parei%20%28Heidelberg%3A%20Jonah%20Rosa%2C%201615" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7002eb38f7" data-kw="">
<blockquote><p>IN the first place, the wrath of man praises God, as it is an example and illustration of divine truth, and clearly points out the corruption of our nature, which is the foundation stone of the doctrine of redemption. Nothing can be more absolutely necessary to true religion, than a clear and full conviction of the sinfulness of our nature and state.

Without this there can be neither repentance in the sinner, nor humility in the believer. Without this all that is said in scripture of the wisdom and mercy of God, in providing a Saviour, is without force and without meaning. Justly does our Saviour say, The whole have no need of a physician, but those that are sick. I came not to call the righteous but sinners to repentance. Those who are not sensible that they are sinners, will treat every exhortation to repentance, and every offer of mercy, with disdain or defiance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-witherspoon.html">John Witherspoon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The dominion of Providence over the passions of men. A sermon preached at Princeton, on the 17th of May, 1776. Being the general fast appointed by the Congress through the United Colonies. To which is added, an address to the natives of Scotland residing in America</cite>, (Philadelphia: R. Aitken, 1776), pp 7-8.</span></figcaption>

<blockquote><p>This is one part of atheism and self-idolatry, to magnify ourselves, with the forgetfulness and to the injury of our Creator.… In ascribing the glory of what we do or have to ourselves, to our own wisdom, power, virtue, etc.… He regards Babylon as his heaven and himself as his idol, as if he were all and God nothing.… So much as we sacrifice to our own credit, to the dexterity of our hands, or the sagacity of our wit, we detract from God.</p></blockquote>

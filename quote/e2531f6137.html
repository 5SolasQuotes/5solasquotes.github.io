<blockquote><p>IX. Errors.

We condemn therefore those, which teach that for the worthiness of their works there is due unto them either remission of sins or eternal life or any other good gift. For, though we should perfectly fulfill the commandments of God, yet we should be but unprofitable servants. But no man, yea, after his engrafting into Christ keepeth the commandments of God as they should be kept. Meanwhile we disprove not the fathers in that they used the word merit, namely, so far forth as thereby they meant nothing else then a good work done by faith, unto which of favour and for the only merits of Christ was given a reward.

Again we cannot allow of those, which do so discourse of good works, as if they were things indifferent and therefore hold that the same are not only needless, but also do nothing avail to salvation. For how should any man be saved without faith? And how can he have a living faith without a care to do good works? And who can also hold faith, unless he also keep a good conscience? And how can he keep a good conscience, unless he also keep a care to avoid sin and to do good works and to frame his whole life to the will of God?

But we simply condemn all Libertines, who make it all one to keep or not to keep God’s commandments, to do well or to do ill. We condemn also those, which teach that our good works do profit the very souls of the dead, which lie in a certain burning flame, which they call purgatory, sith the scripture saith every one shall be judged according to his own works, which he did in his own body and not the works of other men, but their own works do follow them which are dead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), XXI.IX, 1: 369-71.</span></figcaption>

<blockquote><p>And if you please further to infer that, because perseverance in sin of infidelity and impenitency, as they are the meritorious causes of damnation so they are the meritorious causes of the decree of damnation also: I think I may with as good reason take liberty to infer from the former, that seeing faith and repentance, yea and good works also are the disposing causes of salvation, therefore they are to be accounted the disposing causes of the decree of salvation, that is of our election also: And so your opinion shall appear at full and to life in his proper colors, not an hair’s breadth different, either from the Arminian heresy of late, or from the Pelagian heresy of old.</p></blockquote>

<blockquote><p>In respect of God, our election standeth certain from all eternity… But in respect of ourselves it is uncertain, and therefore we must ‘strive to make the same sure’ by good works, 2 Peter 1:10. These are the ways to come to heaven, though they be not the cause why we should come to heaven; therefore we must keep the way, if ever we mean to come to heaven; for as we are ordained to the end, so are we ordained to the means which bring us to that end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Good Works are the Way to Heaven’ in The Lawyer’s Question</cite>, In ‘Good Works are the Way to Heaven’ in The Lawyer’s Question: In Three Sermons (1595) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 2:108</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

<blockquote><p>That as grace and glory differ not in nature, but gradually as the morning dawning of twilight, and the noon-day-light; so the good works done by the grace of Christ, and that perfect love of God, and our brethren in heaven, are of the same nature, different in degrees, and the one degrees and ways to the other; especially when from Gods free promise of the blessings of this life, and that which is to come; the Lord hath made a pass between the one and the other; and the Lord hath tied himself to himself, not to us, to carry on grace out of mere grace. Every branch that bringeth forth fruit in me (saith Christ) my Father purgeth, that it may bring forth more fruit, unto every one that hath shall be given, and he shall have abundance. He that soweth to the spirit, shall of the Spirit reap life everlasting.

There is a harvest promised to this sowing; as to a special furtherance of our reckoning in the day of Christ; he that soweth bountifully, shall reap bountifully, yea sent once and again unto my necessity; not because I desire a gift; but I desire fruit that may abound to your account, if ye, through the spirit, doe mortify the deeds of the flesh, ye shall live. But being made free from sin, and become servants to God, ye have your fruit unto holiness, and the end everlasting life. Blessed are they that do his commandments, that they may have right to the tree of life, and may enter in thorow the gates into the city.

And lest we should think the commands are all but one only precept of believing, he addeth for without are Dogs and Sorcerers, and Whoremongers, and Murderers, &amp;c. He that hath my commandments, and keepeth them, he it is that loveth me, and he that loveth me shall be loved of my Father, and I will love him and manifest my self to him. All these evidence to us, that holy walking is a way to heaven, as sowing is to harvest, and that Christ maketh a promise of life eternal to him that doth his Commandments: only the question is, in what terms the promise is made to the doer of God’s will, as a doer, or as a believer, whose faith is fruitful, and with child of Evangelike doing.

But we may say the formal promise of the covenant of grace is made to believing, as the Law-promise is made to doing Legally, and perfectly out of our own, without grace; and that the Gospel, as it is larger then the covenant of grace; and as it containeth the whole doctrine of grace, taught by the Prophets and Apostles, is a promise of life eternal, made to Evangelike and unperfect doing through the strength of grace.

And that because 1. God commandeth good works through the whole New Testament. 2. They are so necessary, as without them, our faith is a dead and vain faith, and cannot justify us. 3. They are the end, for which Christ redeemed us, that we should live to him, be redeemed from our vain conversation, from the present evil world, that we should be a purified peculiar people to him, zealous of good works, and in this title also they are commanded. 4. They are conditions without which we cannot be saved. For John Baptist taught this with the Gospel, Every tree that bringeth not forth good fruit, shall be hewn down, and cast into the fire. What shall we do to be saved, receiveth this answer, Repent, and be baptized every one of you; Except ye repent ye shall all likewise perish.

5. They are commanded as acts of the new creature; and partly, as contrary to sinful fiery, and mighty temptations of Satan, and the flesh, as mortification to fleshly lust, faith to unbelief. Partly as expressions of thankfulness for the free redemption in Christ, and commanded in the Law, in the great Commandment of the loving of God with all our heart, just as this Law of loving God did oblige Abraham to offer his Son Isaak for God, and Judah to be thankful to God, for redeeming them out of the Babylonish Captivity; though the Law neither commanded any father to offer his Son, nor the people to return from Captivity; yet the eternal Law of love commandeth both these, and us to do, what ever God-Redeemer commands us, as well as what ever God the Law-giver injoyneth; only we cannot say, Good works doe merit salvation, or purchase right to life eternal, Christ’s blood is only so a ransom of life.

2. Nor have they any proper condignity to such a high reward, being so imperfect. 3. Nor can they have any effective influence, or proper causality thereunto, nor are they causes or conditions of justification: but that which [Tobias] Crispe saith is not of God; But withal (saith he) I must tell you, that all this sanctification of life, is not a jot of the way of a justified person to heaven; it is true, they are not the meritorious, the efficient cause or way, nor the formal covenant-condition; but a way they are, as sowing is to harvest, running to the garland, wrestling to the victory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 2.37, pp 37-39.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

— Samuel Rutherford, A survey of the spiritual antichrist, (London: Andrew Crooke, 1648), Part 2.37, pp 37-39.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+as+grace+and+glory+differ+not+in+nature%2C+but+gradually+as+the+morning+dawning+of+twilight%2C+and+the+noon-day-light%3B+so+the+good+works+done+by+the+grace+of+Christ%2C+and+that+perfect+love+of+God%2C+and+our+brethren+in+heaven%2C+are+of+the+same+nature%2C+different+in+degrees%2C+and+the+one+degrees+and+ways+to+the+other%3B+especially+when+from+Gods+free+promise+of+the+blessings+of+this+life%2C+and+that+which+is+to+come%3B+the+Lord+hath+made+a+pass+between+the+one+and+the+other%3B+and+the+Lord+hath+tied+himself+to+himself%2C+not+to+us%2C+to+carry+on+grace+out+of+mere+grace.+Every+branch+that+bringeth+forth+fruit+in+me+%28saith+Christ%29+my+Father+purgeth%2C+that+it+may+bring+forth+more+fruit%2C+unto+every+one+that+hath+shall+be+given%2C+and+he+shall+have+abundance.+He+that+soweth+to+the+spirit%2C+shall+of+the+Spirit+reap+life+everlasting.%0A%0AThere+is+a+harvest+promised+to+this+sowing%3B+as+to+a+special+furtherance+of+our+reckoning+in+the+day+of+Christ%3B+he+that+soweth+bountifully%2C+shall+reap+bountifully%2C+yea+sent+once+and+again+unto+my+necessity%3B+not+because+I+desire+a+gift%3B+but+I+desire+fruit+that+may+abound+to+your+account%2C+if+ye%2C+through+the+spirit%2C+doe+mortify+the+deeds+of+the+flesh%2C+ye+shall+live.+But+being+made+free+from+sin%2C+and+become+servants+to+God%2C+ye+have+your+fruit+unto+holiness%2C+and+the+end+everlasting+life.+Blessed+are+they+that+do+his+commandments%2C+that+they+may+have+right+to+the+tree+of+life%2C+and+may+enter+in+thorow+the+gates+into+the+city.%0A%0AAnd+lest+we+should+think+the+commands+are+all+but+one+only+precept+of+believing%2C+he+addeth+for+without+are+Dogs+and+Sorcerers%2C+and+Whoremongers%2C+and+Murderers%2C+%26c.+He+that+hath+my+commandments%2C+and+keepeth+them%2C+he+it+is+that+loveth+me%2C+and+he+that+loveth+me+shall+be+loved+of+my+Father%2C+and+I+will+love+him+and+manifest+my+self+to+him.+All+these+evidence+to+us%2C+that+holy+walking+is+a+way+to+heaven%2C+as+sowing+is+to+harvest%2C+and+that+Christ+maketh+a+promise+of+life+eternal+to+him+that+doth+his+Commandments%3A+only+the+question+is%2C+in+what+terms+the+promise+is+made+to+the+doer+of+God%E2%80%99s+will%2C+as+a+doer%2C+or+as+a+believer%2C+whose+faith+is+fruitful%2C+and+with+child+of+Evangelike+doing.%0A%0ABut+we+may+say+the+formal+promise+of+the+covenant+of+grace+is+made+to+believing%2C+as+the+Law-promise+is+made+to+doing+Legally%2C+and+perfectly+out+of+our+own%2C+without+grace%3B+and+that+the+Gospel%2C+as+it+is+larger+then+the+covenant+of+grace%3B+and+as+it+containeth+the+whole+doctrine+of+grace%2C+taught+by+the+Prophets+and+Apostles%2C+is+a+promise+of+life+eternal%2C+made+to+Evangelike+and+unperfect+doing+through+the+strength+of+grace.%0A%0AAnd+that+because+1.+God+commandeth+good+works+through+the+whole+New+Testament.+2.+They+are+so+necessary%2C+as+without+them%2C+our+faith+is+a+dead+and+vain+faith%2C+and+cannot+justify+us.+3.+They+are+the+end%2C+for+which+Christ+redeemed+us%2C+that+we+should+live+to+him%2C+be+redeemed+from+our+vain+conversation%2C+from+the+present+evil+world%2C+that+we+should+be+a+purified+peculiar+people+to+him%2C+zealous+of+good+works%2C+and+in+this+title+also+they+are+commanded.+4.+They+are+conditions+without+which+we+cannot+be+saved.+For+John+Baptist+taught+this+with+the+Gospel%2C+Every+tree+that+bringeth+not+forth+good+fruit%2C+shall+be+hewn+down%2C+and+cast+into+the+fire.+What+shall+we+do+to+be+saved%2C+receiveth+this+answer%2C+Repent%2C+and+be+baptized+every+one+of+you%3B+Except+ye+repent+ye+shall+all+likewise+perish.%0A%0A5.+They+are+commanded+as+acts+of+the+new+creature%3B+and+partly%2C+as+contrary+to+sinful+fiery%2C+and+mighty+temptations+of+Satan%2C+and+the+flesh%2C+as+mortification+to+fleshly+lust%2C+faith+to+unbelief.+Partly+as+expressions+of+thankfulness+for+the+free+redemption+in+Christ%2C+and+commanded+in+the+Law%2C+in+the+great+Commandment+of+the+loving+of+God+with+all+our+heart%2C+just+as+this+Law+of+loving+God+did+oblige+Abraham+to+offer+his+Son+Isaak+for+God%2C+and+Judah+to+be+thankful+to+God%2C+for+redeeming+them+out+of+the+Babylonish+Captivity%3B+though+the+Law+neither+commanded+any+father+to+offer+his+Son%2C+nor+the+people+to+return+from+Captivity%3B+yet+the+eternal+Law+of+love+commandeth+both+these%2C+and+us+to+do%2C+what+ever+God-Redeemer+commands+us%2C+as+well+as+what+ever+God+the+Law-giver+injoyneth%3B+only+we+cannot+say%2C+Good+works+doe+merit+salvation%2C+or+purchase+right+to+life+eternal%2C+Christ%E2%80%99s+blood+is+only+so+a+ransom+of+life.%0A%0A2.+Nor+have+they+any+proper+condignity+to+such+a+high+reward%2C+being+so+imperfect.+3.+Nor+can+they+have+any+effective+influence%2C+or+proper+causality+thereunto%2C+nor+are+they+causes+or+conditions+of+justification%3A+but+that+which+%5BTobias%5D+Crispe+saith+is+not+of+God%3B+But+withal+%28saith+he%29+I+must+tell+you%2C+that+all+this+sanctification+of+life%2C+is+not+a+jot+of+the+way+of+a+justified+person+to+heaven%3B+it+is+true%2C+they+are+not+the+meritorious%2C+the+efficient+cause+or+way%2C+nor+the+formal+covenant-condition%3B+but+a+way+they+are%2C+as+sowing+is+to+harvest%2C+running+to+the+garland%2C+wrestling+to+the+victory.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+survey+of+the+spiritual+antichrist%2C+%28London%3A+Andrew+Crooke%2C+1648%29%2C+Part+2.37%2C+pp+37-39.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fce51ab0849.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ce51ab0849.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/05/03/samuel-rutherford-good-works-are-necessary-but-are-not-casual-to-salvation/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-0820d8d034" data-kw="">
<blockquote><p>Upon believing, or with believing (I shall explain it by and by) the whole right of salvation is given us; but all the holiness and works we have do not serve for the right, but only we are led through them to the possession of it. You have it said in 2 Thess. 2:13 that we are saved through faith and sanctification. But the Apostle here [in Eph. 2:8-10] orders them, how through faith, and how through sanctification. He speaks in common of both there; here, so through faith as not through sanctification. ‘Not of works,’ saith he. How shall we solve that? This is the clear distinction of it. We are saved through faith, as that which gives us the present right, or that which God doth then give as a judge, when we believe, before faith hath done a whit of work else; but we are led through sanctification and good works to the possession of salvation. Distinguish the right and the possession, and you have clearly the Apostle’s meaning; for, saith he, ‘he hath ordained good works, that we should walk in them,’ as being already ‘saved through faith,’ which he speaks before that.</p></blockquote>

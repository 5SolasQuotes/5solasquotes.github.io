<main class="wrap"><figure class="quote" id="q-f55f6f4391" data-kw="">
<blockquote><p>Properly, in the sense by him [Mr. Biddle] pointed to, anger, wrath, etc., are not in God… If He be properly and literally angry and furious, and wrathful, He is moved, troubled, perplexed, desires revenge, and is neither blessed nor perfect. 4. Mr. Biddle [a Socinian] has given us a rule in his preface, that when any thing is ascribed to God in one place which is denied of Him in another, then it is not properly ascribed to Him. Now, God says expressly that ‘fury’ or anger ‘is not in Him,’ Isa. 27:4; and therefore it is not properly ascribed to Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined</cite>, Ch. 4, ‘Of the Attribution of Passions &amp; Affections, Anger, Fear, Repentance unto God’ of Vindiciae Evangelicae; Or the Mystery of the Gospel Vindicated &amp; Socinianism Examined in Works, vol. 12, pp. 111-12, 114-5, p. 112</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c54d9e9900" data-kw="">
<blockquote><p>As the Divine will cannot but be perfect, so it cannot be wanting to render the highest love to itself, to its goodness, to the Divine nature, which is due to Him. Indeed, the acts of those, ad extra are not necessary, but upon a condition. To love righteousness without Himself, or to detect sin, or inflict punishment for the committing of it, could not have been, had there been no righteous creature for Him to love, no sinning creature for Him to loathe and to exercise his justice upon as the object of punishment. Some attributes require a condition to make the acts of them necessary, as it is at God’s liberty whether He will create a rational creature or no… It is at his liberty whether He will permit a creature to sin; but if He sees good to suffer it, it is impossible but that He should detest that creature that goes cross to his righteous nature. His holiness is not solely an act of his will, for then he might be unholy as well as holy…</p></blockquote>

ne</a></div>
</figure><figure class="quote" id="q-759465c850" data-kw="">
<blockquote><p>Other affections which are given to God metaphorically, and by an anthropopathy are 1. Anger, and its contrary, complacency or gentleness, which are improperly in God, for He is neither pleased nor displeased; neither can a sudden either pertubation or tranquillity agree to God; but by these the actions of God are declared, which are such as those of offended and pleased men are wont to be; viz. God by an eternal and constant act of his will approves obedience, and the purity of the creature, and witnessses that by some sign of his favor, but abhors the iniquity and sin of the same creature and shows the same, by inflicting a punishment, not less severe, but far more just than men are wont to do when they are hot with anger, Ex. 32:10, ‘Now therefore, let Me alone, that my wrath may wax hot against them, and that I may consume them…&#x27;</p></blockquote>

</figure><figure class="quote" id="q-95fb5874b7" data-kw="">
<blockquote><p>The more principal Relative Attributes are in number seven:

1. Creation.

2. Providence.

3. Lordship.

4. Benignity.

5. Mercy.

6. Redemption.

7. Justice. To which, or some of which, the rest of like nature may conveniently be referred. Though the terms Creator, Governor, Redeemer and Lord do more clearly hold forth the relation between God and the creature, yet (after others) the fore-named terms are here made use of: both as sufficiently containing the relation and better conducing to teach the doctrine intended. A new Relative Attribute or praedication does not always presuppose a change in that thing unto which that new relation is given, though it always presupposes a change in that whereunto such relation does really belong: for example sake: Peter may sit at the right hand of John without any change in Peter, the change being only in John who places himself at Peter’s left hand. The princes are said to stand on the right hand of the wall, Neh. 12:31, without any change in the wall; the change was only in them so placing themselves. So God who was not a Creator from eternity, is a Creator in time: yet this new appellation puts no change in God, but only in the creature. The Second Person who was not incarnate from eternity, becomes incarnate in the fulness of time, yet without any change: the change was, and is only in the human nature assumed, not in the divine nature assuming. In these Relative Attributes (the Creator being above the order of the creature), the extremes not being alike, the relation is not alike. The relation on Gods part is only a relation of reason: that is, such a respect of the Creator to the creature, as is without any change in Him: but on the creature’s part, it is a real relation: that is, such a relation as infers a change in it. Relative Attributes add a new predication or title to, but cause no real mutation or change in God: as concerning the creature, they both add a new predication to it and cause a real mutation in it. In all Relative Attributes there are considerable (but especially in Creation, Providence and Redemption) an eternal immanent act, whereby God wills such a thing to be; and a transient temporal act, whereby He works the thing according to his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, Of the Divine Essence, pp. 10-11</span></figcaption>

<blockquote><p>To the love of God belong what may be called his desires or wishes, etc. Now it is the absence of good which excites desire; but since God enjoys all good, it is plain that desire cannot properly apply to Him; yet it is frequently attributed to Him in scripture, and to this may be referred all those passages in which God is introduced speaking to this effect: “O that my people had hearkened unto me.” (Ps. 81:14; Isa. 48:14; Lk. 19:42) Therefore this desire in God denotes, that man’s obedience is highly pleasing to him, and that He will not pass it by unrewarded; at the same time it points out man’s duty, and his great wickedness in not discharging this duty. To this desire is opposed aversion, by which God is said to loathe sin, and to have no pleasure in the destruction of the creature. From what has been said, we clearly see what ideas we ought to have of the hope of God, of his joy, sorrow, jealousy, etc. Hope or expectation in God, intimates that the thing is due to Him. Thus when He said that He “looked that his vineyard should bring forth grapes,” (Isa. 5:2) He meant that the vineyard owed him fruit, and could not be fruitless without sin. God is said to rejoice when anything is pleasing to Him; and also when He performs anything which displays his glory, as when He does good to his people, or when He punishes the rebellious and ungodly. (Deut. 28:63; 30:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, (d. 1724), bk. 2, ch. 5, p. 87</span></figcaption>

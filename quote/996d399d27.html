<main class="wrap"><figure class="quote" id="q-996d399d27" data-kw="">
<blockquote><p>XXV. Though we think not that men may [morally] command us to destroy our neighbors’ souls by scandal, yet when disobedience to a ruler’s law is likely to do more hurt than the scandal taken at it comes to, we are for avoiding the greater hurt. … XXVII. We hold it unlawful to reproach all Churches that we see to be faulty, but it is our duty to keep peace with all. [Rom. 12:18; Heb. 12:14]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, Detailed | The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (London, 1689), ch. 2, pp. 11-16 | Scandal</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-00823314c2" data-kw="">
<blockquote><p>Such as the worship is in Popery, where they teach and do many things contrary to the principles of faith, placing holiness and the worship of God in their own inventions, and seeking remission of sins, and the merit of eternal life in every beggarly superstitious observation and ceremony. But if by false manner of worship you understand every error, fault and corruption in matters of religion, which though they be evil and to be condemned, yet overthrow not the faith, nor the very essence of God’s true worship, but be in circumstances, or in parts that may be maimed, and yet the life remain: then I deny the proposition as most erroneous, false and heretical…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gifford.html">George Gifford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Treatise Against the Donatists of England, whom we call Brownists</cite>, ... (London, 1590) Gifford (c. 1548–1600 or 1620?) was a non-conformist, English, puritan preacher. | ‘Brownist Position’, p. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-d9584d74da" data-kw="">
<blockquote><p>…but [nonconformists] will keep all loving correspondence with them [parish churches], and seasonably sometimes communicate with them to show their principles by their practice. For the benefit of Christian love and concord, may make it best for certain seasons to join even in defective modes of worship, as Christ did in the synagogues [such as with forms of prayer] and Temple in his time. Though the least defective must be chosen when no such accidental reasons sway the other way. And perhaps some nonconformists’ own administrations may be as defective as the Liturgy… 6. They prefer their own manner of worshipping God, as better than the Liturgy in their opinion, and therefore to be chosen when they may choose; but they account it not the only acceptable worship, but are present with you in spirit, desiring a part in the prayers of all true Christians in the world.</p></blockquote>

</figure><figure class="quote" id="q-d8d0ceedf7" data-kw="">
<blockquote><p>…superstition is the opposite vice to religion, in the excess, as our divines describe it; for it exhibits more in the worship of God than He requires in his worship… We see he [Jonas Porree referencing Zanchi] accounts superstition to be in the addition of ceremonies not instituded by Christ, as well as in the addition of more substantial matters… Now our ceremonies, though they exhibit worship to God, yet this is done inordinately, and they make the worship to be otherwise performed than it should be; for example, though God be worshipped by the administration of the sacraments in private places, yet not so as He should be worshipped… …ceremonies… have no necessary nor profitable use in the Church (as has been proved) which kind of things, cannot be used without superstition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 1, pp. 1-2</span></figcaption>

</figure><figure class="quote" id="q-60d84d2a26" data-kw="">
<blockquote><p>But, lest any honest Christian should by his frequent distractions be discouraged from his duties, or in his holy duties, I shall… prevent such a temptation by laying down some encouragements: … The fifth encouragement is that our God can gather some sense out of a distracted duty, and do us some good by it. Rom. 8:27, ‘He that searcheth the hearts, knoweth what is the mind of the Spirit;’ ’tis true of our spirit as well as of God’s. The great searcher of hearts knows what you came pregnant with, what you meant, though you missed it in the delivery. He can tell what was written in the letter, though it did miscarry, and will answer your godly meaning, and overlook your unwilling failing, Ps. 103:13, ‘As a father pitieth his children, so the Lord…’ Why, the child comes sometimes full of a suit to the Father, and he is quite out in his tale, has forgotten what he would have, but the Father knows what he wants and what he would have said, and grants the whole. And so, provided thou be a child, and art heartily sensible of thy wants, and comest panting to the Throne of Grace; thy heavenly Father will accept thy meaning, and grant thy petition…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-steele.html">Richard Steele</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Antidote against Distractions, or an Endeavor to Serve the Church in the Daily Case of Wanderings in the Worship of God</cite>, (London: 1667), ch. 9, pp. 204, 213-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-392310d4f8" data-kw="">
<blockquote><p>I hasten to mark out decisive proofs of this wide-wasting treason against the Majesty of the Holy Spirit of the living God.

Of these, the first and most prominent is —

Sabbath-breaking, or the prostitution of Sacred time.

Were it my design to establish the authority of this wise, good, holy institution, I might go back to the foundation of the world, and to the bowers of the original paradise; or I might call you to listen to that terrific voice of words, which, issuing from the tempestuous darkness and flames of Sinai, conveyed terror to the breasts of millions, while it pronounced the statute of Heaven, “Remember the Sabbath-day to keep it holy.” But I take it for granted, that the institution is Divine. My present object is to mark the atrocity of its violation, as implying a vile contempt of the influences of the Holy Spirit.

When the glorious Saviour, having finished the mysterious purchase of salvation, rose to endless life and dominion on the first day of the week, the honours of the Sabbath were justly transferred to that day; and its hours became peculiarly sacred and auspicious, as the season when mortals, humbly waiting upon God, might hope to be visited with those operations of the Spirit of Jesus Christ which apply the blessings of redemption. What then might be expected in a country wherein such a Sabbath is made known?

We plead not for the formal austerities of hypocrisy; but we contend for it, and all the sophistry in the world cannot resist us, that to refuse a serious, diligent observation of the Christian Sabbath, with a view to the spiritual ends of its appointment, is to contemn those influences of the Eternal Spirit, which bring salvation, and heaven, into immortal souls. Every Sabbath-breaker is such a despiser; every act of Sabbath-breaking expresses such contempt.

What then must be the state of a country filled with such rebels? Be astonished, ye Heavens; be ashamed, thou Sun, whom the Spirit of God placed in the skies — withdraw thy shining beams from the haunts of such transgressors; and thou solid Earth, tremble under their steps, while they assemble in unashamed crowds, to declare, before angels and men, how much they despise the Majesty and Grace of thy Creator!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-love.html">John Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Radical Cause of National Calamity: A Sermon, Preached at the Scots Church, Crown Court, Russel Street, Covent Garden, October 27. 1794 in Sermons Preached on Public Occasions: With Fifteen Addresses to the People of Otaheite, and A Serious Call Respecting a Mission to the River Indus</cite></span></figcaption>

</figure><figure class="quote" id="q-27ed43151f" data-kw="">
<blockquote><p>First of all I shall set forth the best contributions of the philosophers of the Greeks, because whatever there is of good has been given to men from above by God, since ‘every best gift and every perfect gift is from above, coming down from the Father of lights.’ If, however, there is anything that is contrary to the truth, then it is a dark invention of the deceit of Satan and a fiction of the mind of an evil spirit … In imitation of the method of the bee, I shall make my composition from those things which are conformable with the truth and from our enemies themselves gather the fruit of salvation. But all that is worthless and falsely labelled as knowledge I shall reject.</p></blockquote>

<blockquote><p>And I took unto me two staves; the one I called Beauty and the other I called Bands; and I fed the flock.” – Zech. 11:7 Christ “feeds and rules his poor flock with his staff called Beauty, his Word, ordinances and government— being as glorious things in themselves, so the special beauty and honour of the church that enjoy them. Thus among the people of the Jews, the ark and the tabernacle are called their glory…</p></blockquote>

</figure><figure class="quote" id="q-ea9285199b" data-kw="">
<blockquote><p>Put such books into people’s hands as plead best the cause of love and peace. Among others, get men to read these: Bishop Ussher’s Sermon on Eph. 4:13 at Wansted before King James [‘A Brief Declaration of the Universality of the Church of Christ’, 1624 / 1629], Bishop Hall’s [sermon, ‘The True] Peacemaker’ [1624]: Mr. Jeremiah Burroughs’s of Heart-Divisions, and Mr. Stillingfleet’s Irenicon, and all Mr. [John] Durie’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Direction 60, ‘When the love-killing spirit, either cruel or dividing is abroad among Christians, be not idle nor discouraged spectators, nor betray the Churches’ peace by a few lazy wishes, but make it a great part of your labor and religion to revive love and peace, and to destroy their contraries: And let not censures or contempt of any sect or party take you off: But account it an honor to be a martyr for love and peace, as well as for the Faith’ in The Cure of Church Divisions… (London, 1670), pt. 1, pp. 300-4</cite>, p. 304</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-e182afc1a3" data-kw="">
<blockquote><p>After indicating that the Genevans, of course, wish and hope for the gospel to be spread everywhere, the letter states: “But we know well also what is within our compass, and we do not presume even to wish to reform extensive kingdoms.”… What is fascinating here is the apparent renouncing, on the part of the Genevans, of any connection to the evangelical movement within France or anywhere else. They would seem to wish for the king to believe that Geneva stays resolutely and quietly within its own geographical border and does not meddle in the work of reforming other parts of Europe, let alone France. In all of this, Geneva kept up a near-constant state of deception in regards to the French king and his government… Geneva was extremely effective at feigning obedience to French kings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jon-balserak.html">Jon Balserak</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Geneva’s Use of Lies, Deceit &amp; Simulation in Their Efforts to Reform France, 1536–1563’ HTR 112:1 (2019), pp. 76–100</cite>, p. 99</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

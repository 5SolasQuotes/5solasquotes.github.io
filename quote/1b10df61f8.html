<blockquote><p>2. The apostle [Peter] would have Christians in a special manner careful that they offend not the laws of the princes of this world; this appears in that he enjoins [in 1 Pet. 2:13 ff.] them the duties of subjects first, and in that they do teach them the duty of submission, both in this and other Scriptures with great force and violence (as it were) of arguments… Fiftly, because perversness and contempt, and careless neglect of the laws of princes many times proves scandalous, and we must not offend them that are without, 1 Cor. 10:2; Col. 4:5. Many that were somewhat inclined to embrace the sincerity of the Gospel, have been cast back, and profess that therefore they abhor such people because they observe their disobedience against human government, either through indiscretion or nice scruples, or perverse willfulness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary: or Sermons upon the Second Chapter of the First Epistle of Saint Peter... (London, 1623), on 1 Pet. 2:13</cite>, pp. 560-61</span></figcaption>

<blockquote><p>There is no scandall taken, but (if it be known to be taken, and the thing at which it is taken be not necessary) it is also given. … 2. Giving and not granting that the scandal of them who were first offended at the ceremonies [c. 1618] was only passive, yet the using of them after scandal is known to rise out of them, must be an active scandal, because the keeping of a thing which is not necessary, after scandal rises out of it, is an active scandal, though the scandal which at first rose out of it, had been only passive…</p></blockquote>

</figure><figure class="quote" id="q-f5f7f2e614" data-kw="">
<blockquote><p>4. But if we were malicious in offending at the ceremonies as things unlawful, and in urging of non-conformity as necessary, should they [the prelates] therefore contemn our being scandalized? Those that would have Titus circumcised, were they not malicious? [Gal. 2:3-5] Did they not urge circumcision as necessary? Held they it not unlawful, not to circumcise Titus? Yet did the apostle abstain, because they were to be scandalized, that is, made worse and more wicked calumniators by the circumcising of Titus, as I have showed (above, ch. 8, section 6); So that albeit we are not to care for the displeasing of men that malitiously and contumaciously urge (as necessary) abstaining from that which is lawful to be done, yet must we care for scandalizing them and making them worse: rather ere that be, we ought to abstain from the use of our liberty.</p></blockquote>

</figure><figure class="quote" id="q-bda28d4fcf" data-kw="">
<blockquote><p>IX. Neither can the indifferency or lawfulness of the thing done, nor the ordinance of authority commanding the use of it, make the scandal following upon it to be only passive [and hence the commanders would be innocent], which otherwise, i.e. in case the thing were neither lawful, nor ordained by authority, should be active. Not the former; for our divines teach (Hemmings., Enchir. Theol., class 3, ch. 17; Magdeburg, Century 1, bk. 2, ch. 4, cols. 448-449) that scandalum datum [scandal given] rises sometimes, ex facto-in se adiaphoro [out of the fact in itself by the thing indifferent] when it is done intempessive, contra charitatis regulam [unseasonably contra the rule of charity]. Not the latter; for no human authority can take away the condition of scandal from that which otherwise should be scandal, because nullum homo potist vel charitati, vel conscientiis nostris imperare, vel periculum scandali d•…ti prestar•…, says a learned casuist (Ames, bk. 5, de Consc., ch. 11, q. 6). . ch. 9, p. 41 ” If this be not taken well from us, let one of our opposites speak for us, who aknowledges that human power cannot make us do that which we cannot do without giving of scandal, and that in this case, the pretext of obedience to superiors shall not excuse us at the hands of the Supreme Judge. (Dr. [John] Forbes, Iren., bk. 2, ch. 20, num. 19)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 2</cite>, ch. 8, p. 32-33</span></figcaption>

</figure><figure class="quote" id="q-ffe07740d4" data-kw="">
<blockquote><p>In judging of cases of scandal, we are not so much to look at the event, what that is, or may be; as at the cause, [from] whence it comes; for sometimes there is given just cause of scandal, and yet no scandal follows, because it is not taken: sometimes scandal is taken, and yet no just cause given; and sometimes there is both cause of scandal given, and scandal thereat taken; But no man is concerned in any scandal that happens to another by occasion of anything done by him, neither is [he] chargeable with it, farther than he is guilty of having given it. If then we give scandal to others, and they take it not, we are to bear a share in the blame as well as they, and that a deeper share too (‘Vae homini’, ‘Woe to the man by whom the offence cometh,’ Mt. 8:7); but if they take offence when we give none, it is a thing we cannot help; therefore the whole blame must lie upon them. … 4. The third way [in which a man may be guilty of giving scandal] is, when a man does something before another, which in itself is not evil, but indifferent, and so according to the Rule of Christian Liberty, lawful for him to do, or not to do, as he shall see cause (yea, and perhaps otherwise commodious and convenient for him to do), yet whereat he probably foresees the other will take scandal, and be occasioned thereby to do evil. In such case, if the thing to be done, be not in some degree (at least prudentially) necessary for him to do, but that he might without great inconvenience and prejudice to himself and any third person, leave it undone, he is bound in charity and compassion to his brother’s soul (for whom Christ died) and for the avoiding of scandal to abridge himself in the exercise of his Christian Liberty for that time so far, as rather to suffer some inconvenience himself by the not doing of it than by doing of it to cause his brother to offend; the very case which is so often, and so largely, and so earnestly insisted upon by St. Paul, Rom. 14:13,21 and 15:1,3; 1 Cor. 8:7,13 and 9:12,22 and 10:23,33. Here the rule is, Do nothing that may be reasonably forborne, whereat it is like[ly] scandal will be taken. 5. The last way is, when a man does something before another which is not only lawful, but (according to the exigencies of present circumstances pro hic et nunc [for here and now]) very behoveful, and in some sort (prudentially) necessary for him to do, but foresees in the beholder a propension to make an ill use of it and to take encouragement thereby to commit sin; if there be not withal a great care had to prevent, as much as is possible, the scandal that might be taken thereat: for, Qui non prohibet peccare cum potest, jubet [He who does not prohibit sinning when able, enjoins it]. In such case the bare neglect of his brother, and not using his utmost endeavor to prevent the evil that might ensue, making him guilty, upon which consideration stands the equity of the [particular] judicial law given to the Jews, Ex. 21:33,34, which orders that in [the] case a man dig a pit or well for the use of his family, and (looking no farther than his own conveniency) put no cover on it, but leave it open, whereby it happens [that] his neighbor’s beast do fall therein and perish, the owner of the pit is to make it good, inasmuch as he was the occasioner of that loss unto his neighbor, which he might and ought to have prevented: In this last case the thing is not (for the danger of the scandal) to be left undone, supposing it (as we now do) otherwise behoveful to be done; but the action is to be ordered and carried on by us, for the manner of doing, and in all respects and circumstances thereunto belonging, with so much clearness, tenderness, and moderation and wisdom, that so many as are willing to take notice of it may be satisfied that there was on our part a reason of just necessity that the thing should be done;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-sanderson.html">Robert Sanderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Case 4, ‘of Scandal’ in Nine Cases of Conscience Occasionally Determined (London, 1678), pp. 75-81</cite>, p. 75, 78-80</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In judging of cases of scandal, we are not so much to look at the event, what that is, or may be; as at the cause, [from] whence it comes; for sometimes there is given just cause of scandal, and yet no scandal follows, because it is not taken: sometimes scandal is taken, and yet no just cause given; and sometimes there is both cause of scandal given, and scandal thereat taken; But no man is concerned in any scandal that happens to another by occasion of anything done by him, neither is [he] chargeable with it, farther than he is guilty of having given it. If then we give scandal to others, and they take it not, we are to bear a share in the blame as well as they, and that a deeper share too (‘Vae homini’, ‘Woe to the man by whom the offence cometh,’ Mt. 8:7); but if they take offence when we give none, it is a thing we cannot help; therefore the whole blame must lie upon them. … 4. The third way [in which a man may be guilty of giving scandal] is, when a man does something before another, which in itself is not evil, but indifferent, and so according to the Rule of Christian Liberty, lawful for him to do, or not to do, as he shall see cause (yea, and perhaps otherwise commodious and convenient for him to do), yet whereat he probably foresees the other will take scandal, and be occasioned thereby to do evil. In such case, if the thing to be done, be not in some degree (at least prudentially) necessary for him to do, but that he might without great inconvenience and prejudice to himself and any third person, leave it undone, he is bound in charity and compassion to his brother’s soul (for whom Christ died) and for the avoiding of scandal to abridge himself in the exercise of his Christian Liberty for that time so far, as rather to suffer some inconvenience himself by the not doing of it than by doing of it to cause his brother to offend; the very case which is so often, and so largely, and so earnestly insisted upon by St. Paul, Rom. 14:13,21 and 15:1,3; 1 Cor. 8:7,13 and 9:12,22 and 10:23,33. Here the rule is, Do nothing that may be reasonably forborne, whereat it is like[ly] scandal will be taken. 5. The last way is, when a man does something before another which is not only lawful, but (according to the exigencies of present circumstances pro hic et nunc [for here and now]) very behoveful, and in some sort (prudentially) necessary for him to do, but foresees in the beholder a propension to make an ill use of it and to take encouragement thereby to commit sin; if there be not withal a great care had to prevent, as much as is possible, the scandal that might be taken thereat: for, Qui non prohibet peccare cum potest, jubet [He who does not prohibit sinning when able, enjoins it]. In such case the bare neglect of his brother, and not using his utmost endeavor to prevent the evil that might ensue, making him guilty, upon which consideration stands the equity of the [particular] judicial law given to the Jews, Ex. 21:33,34, which orders that in [the] case a man dig a pit or well for the use of his family, and (looking no farther than his own conveniency) put no cover on it, but leave it open, whereby it happens [that] his neighbor’s beast do fall therein and perish, the owner of the pit is to make it good, inasmuch as he was the occasioner of that loss unto his neighbor, which he might and ought to have prevented: In this last case the thing is not (for the danger of the scandal) to be left undone, supposing it (as we now do) otherwise behoveful to be done; but the action is to be ordered and carried on by us, for the manner of doing, and in all respects and circumstances thereunto belonging, with so much clearness, tenderness, and moderation and wisdom, that so many as are willing to take notice of it may be satisfied that there was on our part a reason of just necessity that the thing should be done;”

— Robert Sanderson, Case 4, ‘of Scandal’ in Nine Cases of Conscience Occasionally Determined (London, 1678), pp. 75-81, p. 75, 78-80">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+judging+of+cases+of+scandal%2C+we+are+not+so+much+to+look+at+the+event%2C+what+that+is%2C+or+may+be%3B+as+at+the+cause%2C+%5Bfrom%5D+whence+it+comes%3B+for+sometimes+there+is+given+just+cause+of+scandal%2C+and+yet+no+scandal+follows%2C+because+it+is+not+taken%3A+sometimes+scandal+is+taken%2C+and+yet+no+just+cause+given%3B+and+sometimes+there+is+both+cause+of+scandal+given%2C+and+scandal+thereat+taken%3B+But+no+man+is+concerned+in+any+scandal+that+happens+to+another+by+occasion+of+anything+done+by+him%2C+neither+is+%5Bhe%5D+chargeable+with+it%2C+farther+than+he+is+guilty+of+having+given+it.+If+then+we+give+scandal+to+others%2C+and+they+take+it+not%2C+we+are+to+bear+a+share+in+the+blame+as+well+as+they%2C+and+that+a+deeper+share+too+%28%E2%80%98Vae+homini%E2%80%99%2C+%E2%80%98Woe+to+the+man+by+whom+the+offence+cometh%2C%E2%80%99+Mt.+8%3A7%29%3B+but+if+they+take+offence+when+we+give+none%2C+it+is+a+thing+we+cannot+help%3B+therefore+the+whole+blame+must+lie+upon+them.+%E2%80%A6+4.+The+third+way+%5Bin+which+a+man+may+be+guilty+of+giving+scandal%5D+is%2C+when+a+man+does+something+before+another%2C+which+in+itself+is+not+evil%2C+but+indifferent%2C+and+so+according+to+the+Rule+of+Christian+Liberty%2C+lawful+for+him+to+do%2C+or+not+to+do%2C+as+he+shall+see+cause+%28yea%2C+and+perhaps+otherwise+commodious+and+convenient+for+him+to+do%29%2C+yet+whereat+he+probably+foresees+the+other+will+take+scandal%2C+and+be+occasioned+thereby+to+do+evil.+In+such+case%2C+if+the+thing+to+be+done%2C+be+not+in+some+degree+%28at+least+prudentially%29+necessary+for+him+to+do%2C+but+that+he+might+without+great+inconvenience+and+prejudice+to+himself+and+any+third+person%2C+leave+it+undone%2C+he+is+bound+in+charity+and+compassion+to+his+brother%E2%80%99s+soul+%28for+whom+Christ+died%29+and+for+the+avoiding+of+scandal+to+abridge+himself+in+the+exercise+of+his+Christian+Liberty+for+that+time+so+far%2C+as+rather+to+suffer+some+inconvenience+himself+by+the+not+doing+of+it+than+by+doing+of+it+to+cause+his+brother+to+offend%3B+the+very+case+which+is+so+often%2C+and+so+largely%2C+and+so+earnestly+insisted+upon+by+St.+Paul%2C+Rom.+14%3A13%2C21+and+15%3A1%2C3%3B+1+Cor.+8%3A7%2C13+and+9%3A12%2C22+and+10%3A23%2C33.+Here+the+rule+is%2C+Do+nothing+that+may+be+reasonably+forborne%2C+whereat+it+is+like%5Bly%5D+scandal+will+be+taken.+5.+The+last+way+is%2C+when+a+man+does+something+before+another+which+is+not+only+lawful%2C+but+%28according+to+the+exigencies+of+present+circumstances+pro+hic+et+nunc+%5Bfor+here+and+now%5D%29+very+behoveful%2C+and+in+some+sort+%28prudentially%29+necessary+for+him+to+do%2C+but+foresees+in+the+beholder+a+propension+to+make+an+ill+use+of+it+and+to+take+encouragement+thereby+to+commit+sin%3B+if+there+be+not+withal+a+great+care+had+to+prevent%2C+as+much+as+is+possible%2C+the+scandal+that+might+be+taken+thereat%3A+for%2C+Qui+non+prohibet+peccare+cum+potest%2C+jubet+%5BHe+who+does+not+prohibit+sinning+when+able%2C+enjoins+it%5D.+In+such+case+the+bare+neglect+of+his+brother%2C+and+not+using+his+utmost+endeavor+to+prevent+the+evil+that+might+ensue%2C+making+him+guilty%2C+upon+which+consideration+stands+the+equity+of+the+%5Bparticular%5D+judicial+law+given+to+the+Jews%2C+Ex.+21%3A33%2C34%2C+which+orders+that+in+%5Bthe%5D+case+a+man+dig+a+pit+or+well+for+the+use+of+his+family%2C+and+%28looking+no+farther+than+his+own+conveniency%29+put+no+cover+on+it%2C+but+leave+it+open%2C+whereby+it+happens+%5Bthat%5D+his+neighbor%E2%80%99s+beast+do+fall+therein+and+perish%2C+the+owner+of+the+pit+is+to+make+it+good%2C+inasmuch+as+he+was+the+occasioner+of+that+loss+unto+his+neighbor%2C+which+he+might+and+ought+to+have+prevented%3A+In+this+last+case+the+thing+is+not+%28for+the+danger+of+the+scandal%29+to+be+left+undone%2C+supposing+it+%28as+we+now+do%29+otherwise+behoveful+to+be+done%3B+but+the+action+is+to+be+ordered+and+carried+on+by+us%2C+for+the+manner+of+doing%2C+and+in+all+respects+and+circumstances+thereunto+belonging%2C+with+so+much+clearness%2C+tenderness%2C+and+moderation+and+wisdom%2C+that+so+many+as+are+willing+to+take+notice+of+it+may+be+satisfied+that+there+was+on+our+part+a+reason+of+just+necessity+that+the+thing+should+be+done%3B%E2%80%9D%0A%0A%E2%80%94+Robert+Sanderson%2C+Case+4%2C+%E2%80%98of+Scandal%E2%80%99+in+Nine+Cases+of+Conscience+Occasionally+Determined+%28London%2C+1678%29%2C+pp.+75-81%2C+p.+75%2C+78-80&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fffe07740d4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ffe07740d4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-scandal/#:~:text=In%20judging%20of%20cases%20of%20scandal%2C,that%20the%20thing%20should%20be%20done%3B" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

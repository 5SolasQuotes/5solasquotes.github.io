<blockquote><p>God only is properly and absolutely eternal: Angels and men’s souls are said to be eternal, à posteriori, or à parte post, God à priori et à posteriori, ex parte ante et post, since He has neither beginning, succession, nor end.</p></blockquote>

<blockquote><p>14. Since they are not mere thoughts but substantial beings they exist spatially, but in such wise that space is not for them an obstructive barrier. In the same way angels exist temporally as beings created for a definite time, but in such wise that for them time never ends. … Thomas is more correct in denying that they are in a place without operating, because they are everywhere and operate by knowledge and will, even ad extra [to themselves], by glorifying God, and serving Him among men and all other creatures. So that they may be said to be in a place not because they are bounded by a place but because they themselves rather bound the place by their operation, as Thomas rightly says, 22: Therefore angels whom no medium resists must move very swiftly; much more, assuredly, than a corporeal thunderbolt, which is borne from east to west in a most destructive moment. Nor does it follow from this that angels move in a moment or by deserting their localisation acquire a new one in a moment. Although the medium is not resistant, succession is and so is a fresh act succeeding a former one, as well as the distance between the termini, which involves some measure of delay. For it is impossible that in the same nuni and present it should have a locus and when it leaves it should acquire a new one. Nor may we accept outright without a grain of salt Tertullian’s words: ‘As spirit has wings, in a moment it is everywhere.’ Heidegger (VIII, 23): ‘The duration of angels is neither eternity, which befits God alone as existing necessarily and through his nature; nor time or a continuance consisting of material things measurable by movement; or something separate (discretum), which suits things that succeed each other without continuity, not permanent things; nor a permanent instant which is defectible. Therefore what is usually attributed to them is aion, aevum, as it were aei on, always (at least a posteriori) existing, because of their prolonged duration, the origin of which man does not attain to by living, and of which there shall be no end at all.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics ed. Ernst Bizer, tr. G.T. Thomson (1861; Wipf &amp; Stock, 2007), ch. 10, ‘Angels Good &amp; Bad’, pp. 209-10 Heppe (1820–1879) was a German reformed theologian.</cite></span></figcaption>

</figure><figure class="quote" id="q-636b608490" data-kw="">
<blockquote><p>The mercy-seat, also (Ex. 25:17-18, 21) where, under the Law, God exhibited the presence of his power, was so framed as to intimate that God is best seen when the mind rises in admiration above itself: the cherubim with outstretched wings shaded, and the veil covered it, while the remoteness of the place was in itself a sufficient concealment. It is therefore mere infatuation to attempt to defend images of God and the saints by the example of the cherubim. For what, pray, did these figures mean, if not that images are unfit to represent the mysteries of God, since they were so formed as to cover the mercy-seat with their wings, thereby concealing the view of God, not only from the eye, but from every human sense, and curbing presumption?… Moreover, all men of sound judgment acknowledge that the cherubim in question belonged to the old tutelage of the law. It is absurd, therefore, to bring them forward as an example for our age. For that period of puerility, if I may so express it, to which such rudiments were adapted, has passed away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion, trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 1, bk. 1, ch. 11, section 3</cite>, pp. 122-23</span></figcaption>

<blockquote><p>Q. 23. Is it lawful, as some plead, to have images or pictures in churches, though not for worship, yet for instruction, and raising the affections? No; because God has expressly prohibited not only the worshipping but the MAKING of any image whatever on a religious account; and the setting them up in churches, cannot but have a natural tendency to beget a sacred veneration for them; and therefore ought to be abstained from, as having at least an “appearance of evil,” Isa. 45:9-18; 1 Thess. 5:22. Q. 24. May they not be placed in churches for beauty and ornament? No; the proper ornament of churches is the sound preaching of the gospel, and the pure dispensation of the sacraments, and other ordinances of divine institution. Q. 25. Were not the images of the cherubims placed in the tabernacle and temple, by the command of God himself? Yes; but out of all hazard of any abuse, being placed in the holy of holies, where none of the people ever came: they were instituted by God Himself, which images are not; and they belonged to the typical and ceremonial worship, which is now quite abolished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fisher.html">James Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Assembly’s Shorter Catechism Explained (1753)</cite></span></figcaption>

<blockquote><p>3. Place XV. Third, the place of their existing, which they occupy not only by reason of their operating, but by coexistence; nor by circumscription, as if they were bounded extrinsically, like bodies; nor by repletion, or infinite coexistence; but by delimitation,18 whereby on account of the finitude of their essence, they are so restricted to this place that they may not be in a different one.19 Thus it is said that in one man there was a legion (Luke 8:30). 18. definitio, cf. §XXVIII, below 19. …non sola operandi ratione, sed per coexistentiam; nec per circumscriptionem…; nec per repletionem…; sed per definitionem…. Cf. Roelf T. te Velde, Paths Beyond Tracing Out: The Connection of Method and Content in the Doctrine of God, Examined in Reformed Orthodoxy, Karl Barth, and the Utrecht School (Delft: Uitgeverij Eburon, 2010), 139. 4. Motion XVI. Accordingly, fourth, a local motion by which they pass from place to place (Gen. 28:12), which although it is most rapid, since no medium resists it, from which they are compared to wind and fire (Ps. 104:4), and the seraphim are said to be winged (Ezek. 1:6), and like lightning (Luke 10:18), yet it occurs not in a moment, but successively.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology, vol. 3, bk. 3, ch. 7, The Good Angels, §15</cite>, pp. 183-84</span></figcaption>

<div class="actions"><button class="copy" data-copy="“3. Place XV. Third, the place of their existing, which they occupy not only by reason of their operating, but by coexistence; nor by circumscription, as if they were bounded extrinsically, like bodies; nor by repletion, or infinite coexistence; but by delimitation,18 whereby on account of the finitude of their essence, they are so restricted to this place that they may not be in a different one.19 Thus it is said that in one man there was a legion (Luke 8:30). 18. definitio, cf. §XXVIII, below 19. …non sola operandi ratione, sed per coexistentiam; nec per circumscriptionem…; nec per repletionem…; sed per definitionem…. Cf. Roelf T. te Velde, Paths Beyond Tracing Out: The Connection of Method and Content in the Doctrine of God, Examined in Reformed Orthodoxy, Karl Barth, and the Utrecht School (Delft: Uitgeverij Eburon, 2010), 139. 4. Motion XVI. Accordingly, fourth, a local motion by which they pass from place to place (Gen. 28:12), which although it is most rapid, since no medium resists it, from which they are compared to wind and fire (Ps. 104:4), and the seraphim are said to be winged (Ezek. 1:6), and like lightning (Luke 10:18), yet it occurs not in a moment, but successively.”

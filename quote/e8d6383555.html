<blockquote><p>8. The application [of redemption] plainly has the same latitude as redemption itself, i.e., redemption applies to all those and only to those for whom it was obtained by the intention of Christ and the Father. Yet because of them the same temporal benefits of Christ overflow also to others.

9. As for the intention of application, it is rightly said that Christ made satisfaction only for those whom He saved, though in regard to the sufficiency in the mediation of Christ it may also rightly be said that Christ made satisfaction for each and all. Because these counsels of God are hidden to us, it is the part of charity to judge well of every one, although we may not say of all collectively that Christ equally pleads the cause of each before God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, tr. John D. Eusden (1623; Baker, 1997), bk. 1, ch. 24, ‘The Application of Christ’, p. 150</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4f42522e02" data-kw="">
<blockquote><p>Now the book of life in this place must not be so strictly taken as if it included those only that were elect of God to eternal life, but must be understood of that book wherein are recorded the rules and bounds of visible church-communion; and so all those that, through the gifts and operations of special or common grace, do fall within the compass of those rules and bounds. Thus it was in the type at the return out of captivity, none were to be admitted entrance into the church but those that could show their privileges by genealogy and the records of the church; and to others it was said that they had neither portion, nor lot, nor memorial, in Jerusalem (Ezr. 2:62,63; Neh. 7:64,65; 2:20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol., 3:449</span></figcaption>

<blockquote><p>5. Although through this call salvation becomes the possession of only a few, as everyone must admit, it nevertheless retains its great value and significance also for those who reject it… Frequently, even for those who harden themselves in their unbelief, it is a source of various blessings. The enlightenment of the mind, a taste of the heavenly gift, partaking of the Holy Spirit, enjoyment of the Word of God, the experience of the powers of the age to come–these have sometimes even come to those who later fell away and held the Son of God in contempt (Heb. 6:4–6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, 4:37-38</span></figcaption>

<blockquote><p>[7.] Seventhly, Get this principle rooted in you, That it is the delight of Christ to give poor sinners an interest [legal right] in Himself. He is not only able to do it, but it is his delight to do it. Christ’s soul is in nothing more. Witness his leaving his Father’s bosom; witness his laying down his crown; witness those many sufferings and deaths that He went through in this world; witness those gospel acclamations, Mark 16:16, Rev. 22:17; witness those persuasive exhortations and gracious impetrations [obtaining by asking or petition] and entreaties, Isa. 53:11, Matt 11:28, 2 Cor. 5:20; witness divine injunctions and comminations [threatening of divine vengeance], 1 John 5:23, Matt 11:21; witness those pathetical lamentations, Matt 23:37, Luke 19:42, Ps. 81:13; and witness the inward motions and secret excitations of his blessed Spirit, Gen. 6:3, all which speak out his great willingness and delight to save poor sinners; so in Ps. 40:7,8, ‘I delight to do thy will, O my God; thy law is in my heart;’ or, as the Hebrew has it b’tok m’ee, ‘It is in the midst of my bowels.’ Now mark, the will of the Father was the salvation of sinners. This was the will of the Father, ‘That Jesus Christ should seek and save them that are lost,’ Matt 18:11. Now says Christ, ‘I delight to do thy will, O my God;’ it is the joy and rejoicing of my heart to be a-seeking and a-saving lost sinners. When Christ was an hungry, He went not into a victualling house [a house of eating], but into the temple, and taught the people most part of the day, to show how much He delighted in the salvation of sinners, etc. [Footnote: Christ did so much delight, and his heart was so much set upon the conversion and salvation of the Samaritans, that He neglected his own body to save their souls, as you may clearly see in John 4.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unsearchable Riches of Christ</cite>, vol. 3, p. 206</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

<blockquote><p>First, I say, let us view the love of a God of love, in the different kinds of it. … 2, He has a love, not only of benevolence, but of beneficence; He not only wishes you well, but does well unto you. O Sirs! many a good turn has He done you, particularly you who are members of the visible church; He gives you line upon line, precept upon precept; He makes you to hear the joyful sound, the voice of the turtle; many a minister has He sent you; many an offer of Christ, and of life through Him, has He made to you; many a time has He knocked at thy door, by word, by conscience, and the motions and whispers of his Spirit; so that He may say to us, as He did of his vineyard, Isa. 5:4, “What could have been done more for them, that I have not done?” And because of your obstinacy in unbelief and sin, He may challenge you as he did Israel, and say, Micah 6:3, “O my people, what have I done unto thee, and wherein have I wearied thee? testify against me. Was I ever a barren wilderness, or a land of darkness?” Thus, I say, God’s love of benevolence and beneficence is, in some respects, extended unto all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘God in Christ, A God of Love’, a sermon on 1 Jn. 4:16</cite>, vol. 1, pp. 280-81</span></figcaption>

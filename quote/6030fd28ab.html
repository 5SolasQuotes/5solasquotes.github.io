<main class="wrap"><figure class="quote" id="q-6030fd28ab" data-kw="">
<blockquote><p>Learned politicians, as Bartholomeus Romulus, (Defens. part 1, n. 153, and Joannes de Anania (in c. fin. de his qui fil. occid.) teach that “the father is not obliged to reveal the conspiracy of his son against his prince; nor is he more to accuse his son, than to accuse himself, because the father loves the son better than himself,” (D. Listi quidem. Sect. Fin. quod, met. caus, et D. L. fin. c. de cura furiosi) and certainly a father had rather die in his own person, as choose to die in his son’s, in whom he affects a sort of immortality, in specie, quando non potest in individuo [in kind when not able in the individual]; but a king does not love his subjects with a natural or fatherly love thus; and if the affections differ, the power which seconds the affection, for the conservation either of being, or well-being, must also differ proportionally.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8ac8089445" data-kw="">
<blockquote><p>But I consider that there is a wide difference between the case of a congregation or society in which the right [of ladies to vote for ecclesiastical officers] had been recognized, at least tacitly and by practice, and the case of another congregation or society which had never recognized it, but had uniformly acted on a different principle. In the latter case, I would think it my duty to continue the common practice, not only because it had been the custom, but also because I looked on it as well-founded. And if any individuals should complain that they were denied their rights, I would say to them, ‘You are not denied any rights which were ever recognized in the body of which you are members; and provided you think that the right of election is too much circumscribed by its laws or usages, the least thing that is incumbent on you is, to wait until you can obtain a rectification of the supposed evil in a regular way, and, in the meantime, to show me and those whose province it is to authorize the alteration, that our present practice and mode of management is faulty and unscriptural.’ … It is generally allowed that when he refers to ‘nature itself’, he means to include custom, which is in many cases the best expounder of those principles and feelings which are natural to man, and recognized by those who are unenlightened by divine revelation; and by the manner in which he appeals to it, the apostle teaches us that there is a regard due to such dictates even in what relates to the Church; as we are taught by several places of the New Testament, that, from inadvertence or from other causes, Christians and Christian Churches may fall into opinions and practices, which those who had only nature’s dim lamp to guide them avoided.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Right of Females to Vote in the Election of Ministers and Elders’, pp. 3, 5 from Miscellaneous Writings, Chiefly Historical (1841)</cite>, pp. 669-76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-e7a2f5b2b6" data-kw="">

</figure><figure class="quote" id="q-5a2e4d1aaa" data-kw="">
<blockquote><p>XII. Tenth, we must always distinguish between the state of the church constituted and the state of the church to be constituted; the tranquil and well-ordered state and the same perturbed and corrupted. Many things are lawful in a disturbed condition of the state which would not be lawful in a peaceful and well-composed condition, where all things are rightly ordered and done according to the laws. For then necessity (which knows no law) does many lawful things which (if the necessity was removed) would have to be blamed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes ed. Dennison, Jr. (P&amp;R), vol. 3, 18th Topic, Question 23</cite>, p. 219</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-4f922161b6" data-kw="">
<blockquote><p>The binder of conscience is either proper or improper. Proper is that thing which has absolute and sovereign power in itself to bind the conscience. And that is the Word of God written in the books of the Old and New Testament. Reason 1. He which is the Lord of [???] by his Word and laws binds conscience: but God is the only Lord of conscience, because He once created it, and He alone governs none but He knows it. Therefore his Word and laws only bind conscience properly.</p></blockquote>

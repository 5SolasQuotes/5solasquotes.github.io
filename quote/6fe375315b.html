<blockquote><p>It is, then, universally acknowledged that we must believe the Deity to be not only almighty, but just, and good, and wise, and everything else that suggests excellence. It follows, therefore, in the present dispensation of things, that it is not the case that some particular one of these Divine attributes freely displays itself in creation, while there is another that is not present there; for, speaking once for all, no one of those exalted terms, when disjoined from the rest, is by itself alone a virtue, nor is the good really good unless allied with what is just, and wise, and mighty (for what is unjust, or unwise, or powerless, is not good, neither is power, when disjoined from the principle of justice and of wisdom, to be considered in the light of virtue; such species of power is brutal and tyrannous; and so, as to the rest, if what is wise be carried beyond the limits of what is just, or if what is just be not contemplated along with might and goodness, cases of that sort one would more properly call vice; for how can what comes short of perfection be reckoned among things that are good?). If, then, it is fitting that all excellences should be combined in the views we have of God, let us see whether this Dispensation as regards man fails in any of those conceptions which we should entertain of Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-nyssen.html">Gregory of Nyssa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Catechism</cite>, (c. 385), 20 in Nicene and Post-Nicene Fathers 2, 5: 491.</span></figcaption>

ods-excellencies/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>§.10. Otherwise the will of God is distinguished into the will of sign [voluntas signi] and the will of good pleasure [voluntas beneplaciti]. The latter is, and is conceived as, the very complacency of God decreeing concerning the futurition of things, and approving Himself and whatever is in some manner similar to Himself. The former, which is called of sign, is indicated through some sign, and is made manifest among men: of which the will of precept is also a part. For those signs are referred to the number of five, and were formerly comprehended in this verse: He foretells, forbids, permits, commands, fulfils [Prædicit, prohibet, permittit, præcipit, implet]. §.11. Here it is inquired whether the will of precept and the will of decree do not very often conflict with one another: because what He wills by the will of precept, we often see not to come to pass, and thus it is evident from the event that God in His decree willed it not to be done. But we easily reconcile these by observing that the will of the mandate says nothing other than that God wills the obligation of the rational creature: but the will of decree, that He wills to permit a particular man not to answer to his obligation; or sometimes, if the mandate be positive, that He wills the obligation to endure for a time, until He Himself dissolves it. §.12. Those who distinguish the will of God into efficacious and inefficacious, absolute and conditional, antecedent and consequent, etc., in order to free the liberty of the will [libertas arbitrii] from all necessity of the event, labor in vain and ascribe many imperfections to God. Wherefore we acknowledge no will of decree which is not efficacious, absolute, and antecedent, as in the chapter on the decree of God we shall see that no other is to be admitted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/salomon-van-til.html">Salomon Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Both Theologies, even Natural &amp; Revealed</cite>, … (1703; 1719), 1. Nature of God, subsection 4, ‘On the Will of God’ tr. AI by Roman Prestarri Latin</span></figcaption>

</figure><figure class="quote" id="q-2e92233f43" data-kw="">
<blockquote><p>The object of divine love is God. God is good, and good is amiable. God is all good: there is none good but one, that is God. God is essentially good, goodness in the abstract; he is infinitely excellent, he is all perfection. In this one attribute all the rest of the attributes of God are included, and this in each of them.

However the Scriptures, speaking to our capacities, describe God and his glorious attributes in several and distinct notions, yet in each one all are included; each one is infinite, and infinite perfection is essentially all perfection. God is originally good, the fountain and pattern of all that moral good which is in his creatures; he is bountiful and gracious, ready to do them good; and he is the felicitating end, or the final blessedness of the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-alleine.html">Richard Alleine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heaven Opened; or, A Brief and Plain Discovery of the Riches of God’s Covenant of Grace</cite>, (1665; New York: American Tract Society, 1838), p. 172.</span></figcaption>

</figure><figure class="quote" id="q-97cd3b6464" data-kw="">
<blockquote><p>Fifth [objection], [there must be composition in God] because in God there are very many attributes really distinct from Him and among themselves – at least distinct in such a way that they are not God Himself, therefore… Response: We deny the antecedent. They are God Himself, nor do they really differ, e.g. goodness, justice, power, intellect, will. There are some who concede that they are distinguished from the nature of the thing formally, as Scotus with his followers, because although they are the same simple thing, nevertheless from the nature of the thing they are distinct formal notions; for the formal notion and definition of one, e.g. of intellect or justice, is not the definition and formal notion of the other, e.g. of will or mercy – which opinion Rada, Bishop of Patti, subtly defends against all the Thomists out of the more recent authors in the cited place. But others, such as the Thomists and most of the more recent Papists (with whom I think the Reformed philosophers and Theologians side), more truly and accurately establish here a distinction of reasoning reason and reasoned reason [i.e. a purely rational distinction]. The former indeed on the part of our intellect, both on account of the most eminent perfection of God which cannot be represented by a single notion, and on account of the finitude and narrowness of our intellect, which cannot adequately conceive the whole perfection of God by a single concept, but needs many inadequate concepts to conceive it – hence it happens that it conceives one and the same thing separately by many formal concepts really distinct, concepts, I say, analogically taken from created things which through many distinct qualities furnish those things which the divine essence [furnishes] through itself. But the latter [distinction] on the part of the thing, because there are various objective concepts not really, actually, in themselves, but virtually or eminently distinct in effects, emanations, and terminations. This distinction they properly call virtual or eminent [distinction] of reasoned reason; or (to adapt it to Scotistic terms) from the nature of the thing formal not in act, but in power or eminently. So that there is some foundation of this latter distinction on the part of the thing, not indeed in God Himself, but in the effects of God. For although the divine essence and perfection is one and simple, nevertheless it does not operate according to its adequate notion. Whence we say that God punishes the wicked according to the notion of justice, saves his own [people] according to the notion of mercy, produces Bucephalus to the idea of a horse, not of a man; but Alexander to the idea of a man, not of a horse. The attributes of justice and mercy, as well as the ideas of man and horse, are indeed not multiplied or distinguished in God Himself in act; but they are distinguished only virtually in the effects themselves, or in termination to such and such a work or effect. Let the more immature learn the nature of this distinction from the common metaphysical and logical authors and apply it to the present matter. Two examples are usually adduced, of the soul and of solar light. The soul, really one in man, is virtually or eminently threefold: vegetative, sensitive, rational; because that one form furnishes in man what the vegetative [furnishes] in plants, the sensitive in brutes. The light of the sun, although it is one, nevertheless virtually or as to its effects contains in itself a drying and heating force. But when it illuminates or heats or dries, it does not operate according to its whole notion. For by the action of illuminating as such, it does not dry or heat, although the drying or heating force is not separated from the illuminative force, but they hold themselves accidentally to illumination; because light does not operate according to its whole notion, but only according to the notion of illuminating. … Instance 2, which is Walter’s: The attributes are in diverse predicaments, e.g. essence in substance, goodness in quality. Response: Now boys in the schools know that God is in a predicament analogically. Instance 3: Things which cannot be predicated of each other and of the essence in the abstract, in the nominative case, and by synonymous predication, are not really the same. But the former is true. Therefore… Response: There is a fallacy of figure of speech; for the identical sense is changed into the formal sense. Something is predicated of another either in the identical sense or in the formal sense. The attributes as they are considered on the part of the thing and insofar as they are in God and thus are entirely the same as the essence and among themselves, can be predicated of each other in the identical sense; thus you will rightly and most truly say: The essence on the part of the thing is life, will on the part of the thing is intellect, and vice versa, and so in others. But as the attributes are conceived by us, and as they are in our concepts, they cannot be truly and properly predicated of each other, namely in the formal sense; the reason is, because thus they are not entirely the same but are distinguished by reasoning reason and reasoned reason (namely virtual). For there are many objective concepts virtually distinct which correspond to many formal concepts really distinct. Therefore it cannot be said: The objective concept of will is the objective concept of intellect, or, the attribute of mercy is the attribute of punitive justice. It must nevertheless be noted that there are some propositions which can be taken in both senses, namely those which consist of the copula “is”, e.g. Intellect is will; to understand is to will; mercy is justice – which taken in the abstract and in the identical sense are true, but in the formal sense false. There are also others which are always taken in the formal sense, and thus under those terms are absolutely and always false, in which essential or notional acts are signified. Essential: as intellect understands, will wills. Notional: as the Father begets, the Son is begotten, the Holy Spirit proceeds – which are only true when something is signified to be appropriate to God according to that notion according to which it is truly appropriate; but they are false when something is signified to be appropriate to God according to another notion which holds itself accidentally and according to which it is not truly appropriate, e.g. intellect wills, will understands, justice shows mercy, mercy punishes – which nevertheless can be true under other terms, namely taken in the abstract, in themselves, as they are on the part of the thing in God, but not as they are attended to in distinct effects as principles of diverse productions or according to the diverse emanations of God, as, that thing which is will understands, that thing which is mercy punishes.</p></blockquote>

tinct in effects, emanations, and terminations. This distinction they properly call virtual or eminent [distinction] of reasoned reason; or (to adapt it to Scotistic terms) from the nature of the thing formal not in act, but in power or eminently. So that there is some foundation of this latter distinction on the part of the thing, not indeed in God Himself, but in the effects of God. For although the divine essence and perfection is one and simple, nevertheless it does not operate according to its adequate notion. Whence we say that God punishes the wicked according to the notion of justice, saves his own [people] according to the notion of mercy, produces Bucephalus to the idea of a horse, not of a man; but Alexander to the idea of a man, not of a horse. The attributes of justice and mercy, as well as the ideas of man and horse, are indeed not multiplied or distinguished in God Himself in act; but they are distinguished only virtually in the effects themselves, or in termination to such and such a work or effect. Let the more immature learn the nature of this distinction from the common metaphysical and logical authors and apply it to the present matter. Two examples are usually adduced, of the soul and of solar light. The soul, really one in man, is virtually or eminently threefold: vegetative, sensitive, rational; because that one form furnishes in man what the vegetative [furnishes] in plants, the sensitive in brutes. The light of the sun, although it is one, nevertheless virtually or as to its effects contains in itself a drying and heating force. But when it illuminates or heats or dries, it does not operate according to its whole notion. For by the action of illuminating as such, it does not dry or heat, although the drying or heating force is not separated from the illuminative force, but they hold themselves accidentally to illumination; because light does not operate according to its whole notion, but only according to the notion of illuminating. … Instance 2, which is Walter’s: The attributes are in diverse predicaments, e.g. essence in substance, goodness in quality. Response: Now boys in the schools know that God is in a predicament analogically. Instance 3: Things which cannot be predicated of each other and of the essence in the abstract, in the nominative case, and by synonymous predication, are not really the same. But the former is true. Therefore… Response: There is a fallacy of figure of speech; for the identical sense is changed into the formal sense. Something is predicated of another either in the identical sense or in the formal sense. The attributes as they are considered on the part of the thing and insofar as they are in God and thus are entirely the same as the essence and among themselves, can be predicated of each other in the identical sense; thus you will rightly and most truly say: The essence on the part of the thing is life, will on the part of the thing is intellect, and vice versa, and so in others. But as the attributes are conceived by us, and as they are in our concepts, they cannot be truly and properly predicated of each other, namely in the formal sense; the reason is, because thus they are not entirely the same but are distinguished by reasoning reason and reasoned reason (namely virtual). For there are many objective concepts virtually distinct which correspond to many formal concepts really distinct. Therefore it cannot be said: The objective concept of will is the objective concept of intellect, or, the attribute of mercy is the attribute of punitive justice. It must nevertheless be noted that there are some propositions which can be taken in both senses, namely those which consist of the copula “is”, e.g. Intellect is will; to understand is to will; mercy is justice – which taken in the abstract and in the identical sense are true, but in the formal sense false. There are also others which are always taken in the formal sense, and thus under those terms are absolutely and always false, in which essential or notional acts are signified. Essential: as intellect understands, will wills. Notional: as the Father begets, the Son is begotten, the Holy Spirit proceeds – which are only true when something is signified to be appropriate to God according to that notion according to which it is truly appropriate; but they are false when something is signified to be appropriate to God according to another notion which holds itself accidentally and according to which it is not truly appropriate, e.g. intellect wills, will understands, justice shows mercy, mercy punishes – which nevertheless can be true under other terms, namely taken in the abstract, in themselves, as they are on the part of the thing in God, but not as they are attended to in distinct effects as principles of diverse productions or according to the diverse emanations of God, as, that thing which is will understands, that thing which is mercy punishes.”

— Gisbertus Voetius, Select Theological Disputations, vol. 1 tr. AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1 Latin | On the One &amp; Most Simple Essence of God, pp. 225-27">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFifth+%5Bobjection%5D%2C+%5Bthere+must+be+composition+in+God%5D+because+in+God+there+are+very+many+attributes+really+distinct+from+Him+and+among+themselves+%E2%80%93+at+least+distinct+in+such+a+way+that+they+are+not+God+Himself%2C+therefore%E2%80%A6+Response%3A+We+deny+the+antecedent.+They+are+God+Himself%2C+nor+do+they+really+differ%2C+e.g.+goodness%2C+justice%2C+power%2C+intellect%2C+will.+There+are+some+who+concede+that+they+are+distinguished+from+the+nature+of+the+thing+formally%2C+as+Scotus+with+his+followers%2C+because+although+they+are+the+same+simple+thing%2C+nevertheless+from+the+nature+of+the+thing+they+are+distinct+formal+notions%3B+for+the+formal+notion+and+definition+of+one%2C+e.g.+of+intellect+or+justice%2C+is+not+the+definition+and+formal+notion+of+the+other%2C+e.g.+of+will+or+mercy+%E2%80%93+which+opinion+Rada%2C+Bishop+of+Patti%2C+subtly+defends+against+all+the+Thomists+out+of+the+more+recent+authors+in+the+cited+place.+But+others%2C+such+as+the+Thomists+and+most+of+the+more+recent+Papists+%28with+whom+I+think+the+Reformed+philosophers+and+Theologians+side%29%2C+more+truly+and+accurately+establish+here+a+distinction+of+reasoning+reason+and+reasoned+reason+%5Bi.e.+a+purely+rational+distinction%5D.+The+former+indeed+on+the+part+of+our+intellect%2C+both+on+account+of+the+most+eminent+perfection+of+God+which+cannot+be+represented+by+a+single+notion%2C+and+on+account+of+the+finitude+and+narrowness+of+our+intellect%2C+which+cannot+adequately+conceive+the+whole+perfection+of+God+by+a+single+concept%2C+but+needs+many+inadequate+concepts+to+conceive+it+%E2%80%93+hence+it+happens+that+it+conceives+one+and+the+same+thing+separately+by+many+formal+concepts+really+distinct%2C+concepts%2C+I+say%2C+analogically+taken+from+created+things+which+through+many+distinct+qualities+furnish+those+things+which+the+divine+essence+%5Bfurnishes%5D+through+itself.+But+the+latter+%5Bdistinction%5D+on+the+part+of+the+thing%2C+because+there+are+various+objective+concepts+not+really%2C+actually%2C+in+themselves%2C+but+virtually+or+eminently+distinct+in+effects%2C+emanations%2C+and+terminations.+This+distinction+they+properly+call+virtual+or+eminent+%5Bdistinction%5D+of+reasoned+reason%3B+or+%28to+adapt+it+to+Scotistic+terms%29+from+the+nature+of+the+thing+formal+not+in+act%2C+but+in+power+or+eminently.+So+that+there+is+some+foundation+of+this+latter+distinction+on+the+part+of+the+thing%2C+not+indeed+in+God+Himself%2C+but+in+the+effects+of+God.+For+although+the+divine+essence+and+perfection+is+one+and+simple%2C+nevertheless+it+does+not+operate+according+to+its+adequate+notion.+Whence+we+say+that+God+punishes+the+wicked+according+to+the+notion+of+justice%2C+saves+his+own+%5Bpeople%5D+according+to+the+notion+of+mercy%2C+produces+Bucephalus+to+the+idea+of+a+horse%2C+not+of+a+man%3B+but+Alexander+to+the+idea+of+a+man%2C+not+of+a+horse.+The+attributes+of+justice+and+mercy%2C+as+well+as+the+ideas+of+man+and+horse%2C+are+indeed+not+multiplied+or+distinguished+in+God+Himself+in+act%3B+but+they+are+distinguished+only+virtually+in+the+effects+themselves%2C+or+in+termination+to+such+and+such+a+work+or+effect.+Let+the+more+immature+learn+the+nature+of+this+distinction+from+the+common+metaphysical+and+logical+authors+and+apply+it+to+the+present+matter.+Two+examples+are+usually+adduced%2C+of+the+soul+and+of+solar+light.+The+soul%2C+really+one+in+man%2C+is+virtually+or+eminently+threefold%3A+vegetative%2C+sensitive%2C+rational%3B+because+that+one+form+furnishes+in+man+what+the+vegetative+%5Bfurnishes%5D+in+plants%2C+the+sensitive+in+brutes.+The+light+of+the+sun%2C+although+it+is+one%2C+nevertheless+virtually+or+as+to+its+effects+contains+in+itself+a+drying+and+heating+force.+But+when+it+illuminates+or+heats+or+dries%2C+it+does+not+operate+according+to+its+whole+notion.+For+by+the+action+of+illuminating+as+such%2C+it+does+not+dry+or+heat%2C+although+the+drying+or+heating+force+is+not+separated+from+the+illuminative+force%2C+but+they+hold+themselves+accidentally+to+illumination%3B+because+light+does+not+operate+according+to+its+whole+notion%2C+but+only+according+to+the+notion+of+illuminating.+%E2%80%A6+Instance+2%2C+which+is+Walter%E2%80%99s%3A+The+attributes+are+in+diverse+predicaments%2C+e.g.+essence+in+substance%2C+goodness+in+quality.+Response%3A+Now+boys+in+the+schools+know+that+God+is+in+a+predicament+analogically.+Instance+3%3A+Things+which+cannot+be+predicated+of+each+other+and+of+the+essence+in+the+abstract%2C+in+the+nominative+case%2C+and+by+synonymous+predication%2C+are+not+really+the+same.+But+the+former+is+true.+Therefore%E2%80%A6+Response%3A+There+is+a+fallacy+of+figure+of+speech%3B+for+the+identical+sense+is+changed+into+the+formal+sense.+Something+is+predicated+of+another+either+in+the+identical+sense+or+in+the+formal+sense.+The+attributes+as+they+are+considered+on+the+part+of+the+thing+and+insofar+as+they+are+in+God+and+thus+are+entirely+the+same+as+the+essence+and+among+themselves%2C+can+be+predicated+of+each+other+in+the+identical+sense%3B+thus+you+will+rightly+and+most+truly+say%3A+The+essence+on+the+part+of+the+thing+is+life%2C+will+on+the+part+of+the+thing+is+intellect%2C+and+vice+versa%2C+and+so+in+others.+But+as+the+attributes+are+conceived+by+us%2C+and+as+they+are+in+our+concepts%2C+they+cannot+be+truly+and+properly+predicated+of+each+other%2C+namely+in+the+formal+sense%3B+the+reason+is%2C+because+thus+they+are+not+entirely+the+same+but+are+distinguished+by+reasoning+reason+and+reasoned+reason+%28namely+virtual%29.+For+there+are+many+objective+concepts+virtually+distinct+which+correspond+to+many+formal+concepts+really+distinct.+Therefore+it+cannot+be+said%3A+The+objective+concept+of+will+is+the+objective+concept+of+intellect%2C+or%2C+the+attribute+of+mercy+is+the+attribute+of+punitive+justice.+It+must+nevertheless+be+noted+that+there+are+some+propositions+which+can+be+taken+in+both+senses%2C+namely+those+which+consist+of+the+copula+%E2%80%9Cis%E2%80%9D%2C+e.g.+Intellect+is+will%3B+to+understand+is+to+will%3B+mercy+is+justice+%E2%80%93+which+taken+in+the+abstract+and+in+the+identical+sense+are+true%2C+but+in+the+formal+sense+false.+There+are+also+others+which+are+always+taken+in+the+formal+sense%2C+and+thus+under+those+terms+are+absolutely+and+always+false%2C+in+which+essential+or+notional+acts+are+signified.+Essential%3A+as+intellect+understands%2C+will+wills.+Notional%3A+as+the+Father+begets%2C+the+Son+is+begotten%2C+the+Holy+Spirit+proceeds+%E2%80%93+which+are+only+true+when+something+is+signified+to+be+appropriate+to+God+according+to+that+notion+according+to+which+it+is+truly+appropriate%3B+but+they+are+false+when+something+is+signified+to+be+appropriate+to+God+according+to+another+notion+which+holds+itself+accidentally+and+according+to+which+it+is+not+truly+appropriate%2C+e.g.+intellect+wills%2C+will+understands%2C+justice+shows+mercy%2C+mercy+punishes+%E2%80%93+which+nevertheless+can+be+true+under+other+terms%2C+namely+taken+in+the+abstract%2C+in+themselves%2C+as+they+are+on+the+part+of+the+thing+in+God%2C+but+not+as+they+are+attended+to+in+distinct+effects+as+principles+of+diverse+productions+or+according+to+the+diverse+emanations+of+God%2C+as%2C+that+thing+which+is+will+understands%2C+that+thing+which+is+mercy+punishes.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Select+Theological+Disputations%2C+vol.+1+tr.+AI+by+Onku+%28Utrecht%3A+Johannes+a+Waesberg%2C+1648%29%2C+pt.+1+Latin+%7C+On+the+One+%26+Most+Simple+Essence+of+God%2C+pp.+225-27&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F97cd3b6464.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/97cd3b6464.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-divine-simplicity/#:~:text=Fifth%20%5Bobjection%5D%2C%20%5Bthere%20must%20be%20composition,that%20thing%20which%20is%20mercy%20punishes&amp;text=Fifth%20%5Bobjection%5D%2C%20%5Bthere%20must%20be%20composition%20in%20God&amp;text=will%20understands%2C%20that%20thing%20which%20is%20mercy%20punishes" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Internal or real Virtue consists in an inward Temper and Disposition of Mind, which is like to God and conformable to the moral Perfections of his Nature; such as Holiness, Justice, Goodness and Truth. And this internal, divine Principle will naturally produce a Course of external Actions conformable to it, as the natural Effect and Expression of it. And the ultimate End and Design of a Person endued with this Principle, will be to act in Conformity to the divine Perfections, and to do all to the Glory of God.

… External or apparent Virtue is such an external Conduct as may seem to be the visible Effect or Expression of this inward divine Principle; but, in Reality, is not; and proceeds from some lower Motive, such as Self-Interest, Honour, Fancy, or the like. Thus a Man may devote a considerable Part of his Estate to public Uses civil and sacred, may be just and beneficent to his Neighbour, punctual to his Promises, and abstain from all bodily Excesses; and yet, in all these Things, have no Regard to God, but only to himself, to his own Interest, Reputation or Fancy.

Although the Matter of these Actions is just and right, and agreeable to the divine Law; yet, as they do not proceed from a true Principle and right End, they are not really virtuous, nor so accounted by the Searcher of Hearts. Indeed the Heathen, who had no higher Principle, generally accounted such Actions to be virtuous; but divine Revelation teaches us, that there can be no virtuous Actions without a divine Temper of Mind, in Conformity to the Perfections of God.</p></blockquote>

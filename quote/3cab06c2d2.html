<main class="wrap"><figure class="quote" id="q-3cab06c2d2" data-kw="">
<blockquote><p>Religion needs not any such ornaments, except men would make the worship of God, when naked [as Adam &amp; Eve were in the Garden in purity], under shame, and so under sin (for Justice married shame and sin once). But as roses, lillies, the sun, and other glorious creatures, are most beautiful without garments, and not capable of shame; so is the worship of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646), ‘To the Reader’, no page number</cite></span></figcaption>

</figure><figure class="quote" id="q-12bc9a21f6" data-kw="">
<blockquote><p>For theology is the doctrine of salvation: and our salvation and blessedness consists in these two parts: (1) That we rightly know God. (2) That we rightly worship Him, being rightly known. And so indeed we rightly know God, so that we might sincerely worship Him. Christ expresses these two parts in Mark 1:15, ‘repent ye, and believe the Gospel.’ Scripture expresses the same parts elsewhere by faith and love, 2 Timothy 1:13: by faith and a good conscience, 1 Timothy 1:19. Paul also distributed his theology into these parts, Acts 24:14-16, ‘I believe all things which are written, and have hope in God: and I do exercise myself to have a conscience void of offence.’ Whence the same Paul reprehends the Gentiles, because ‘they glorified not God, neither were they thankful,’ Romans 1:21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-f-wendelin.html">Marcus F. Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd ed. (1634), ‘The Distribution of Theology’</cite></span></figcaption>

<blockquote><p>Ritibus et ceremoniis divinitus institutis, non licuit homini suo arbitrio aliquid adiicere aut detrahere.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Kings 8:65 as quoted in Latin by George Gillespie, English-Popish Ceremonies (1637), bk. 3, ch. 7</cite>, p. 121</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Ritibus et ceremoniis divinitus institutis, non licuit homini suo arbitrio aliquid adiicere aut detrahere.”

— Peter Martyr Vermigli, Commentary on 1 Kings 8:65 as quoted in Latin by George Gillespie, English-Popish Ceremonies (1637), bk. 3, ch. 7, p. 121">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CRitibus+et+ceremoniis+divinitus+institutis%2C+non+licuit+homini+suo+arbitrio+aliquid+adiicere+aut+detrahere.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+Commentary+on+1+Kings+8%3A65+as+quoted+in+Latin+by+George+Gillespie%2C+English-Popish+Ceremonies+%281637%29%2C+bk.+3%2C+ch.+7%2C+p.+121&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fab43c1b2c8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ab43c1b2c8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-regulative-principle-of-worship/#:~:text=Ritibus%20et%20ceremoniis%20divinitus%20institutis%2C%20non,suo%20arbitrio%20aliquid%20adiicere%20aut%20detrahere." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-39a49d7ec1" data-kw="">
<blockquote><p>But No Collection Is To Be Made In The Time of Divine Service Therefore though I cannot like of the disordered gathering for the poor that is in many places, where in the time of divine service you shall see men go up and down asking, receiving, changing, and bestowing of money – wherein many times you shall have them so disagree, that they are louder than the minister – and the rest stand looking, and listening unto them, leaving the worship of God (as though it did not concern them), and thus all is confused; so yet I am persuaded that this is the fittest time to make this provision. And I presume that it is not the meaning of our godly wise rulers in the church and commonwealth (who are abused therein), that any such thing should be done; but that the gathering being made at some other time of day, before or after the divine service, they might have it in a readiness beforehand, to bestow at the end of service upon the needy, according to their discretion; or generally to take some good order that God might be best served, our brethren relieved, and no man justly offended. {And it seems that Justin Martyr would insinuate thus much unto us, that in his time at their public assemblies not only there was collection for the poor, but in this manner. For speaking of all things that were done publicly, he speaks of this last, as though it were last done, when he says: ‘first the books of the prophets and apostles were read; then some exhortation was made to the people; after this there was prayer and thanksgiving.’ [157] Not that there was none before, but then were there solemn prayers for the whole Church, and for them that are in authority. ‘Fourthly, the creatures of bread and wine were blessed and distributed unto the people; and last of all the richer sort did contribute something to the poor, as God did make them able, and willing.’ By which as we may presume that it was his meaning to show that this was their order, that the reading and preaching of the Word of God and prayer went before the sacrament, so all of them before their collection for the poor; so that it did neither prevent any of them, nor was mingled with them; whose example should be our imitation.} 157. Justin Martyr, Apolog. 2 [Cf. First Apology, ch. 67, ANF 1, 186. Cf. Migne, PG 6, 430.] But we may say of this thing [offering during the worship service], as the papists do of private mass (which they cannot defend), that the iniquity of the people brought it in. For when men through covetousness would not follow the rule of the apostle, to put something apart for the poor, as they should find God had blessed them (1 Cor. 16:2), and so bring that with them and have it in readiness, as he says here, being persuaded that it is a duty which God requires of them, and so do it cheerfully (2 Cor. 9:7), as unto Him who has promised to reward it; but being left to their discretion, they have shifted it off as they might; and when divine service was ended, and now nothing more was to be done in the church but that, they would not tarry [for] it. Then, the collectors for the poor were compelled to take them in the midst of God’s service, when for very shame by starting {aside} they could not refuse. But from the beginning it was not so; and seeing God is not the author of confusion, all things in the Church must be done honestly and in good order (1 Cor. 14:33-40). {But what order can there be in this, that then, when the minister is reading or praying, unto the which all should attend without interruption, others should be chopping and changing of money, and squaring about it? Or to speak the best of it, quietly taking out their purse, seeking in it, and distributing out of it? We would think it strange, if while the pastor were thus occupied, some other men should read aloud a chapter in another end of the church, or three or four should begin to sing a psalm. Why then should it not seem as strange unto us, when the minister is occupied in the public service, that others should interpose themselves with gathering of money? Especially seeing that others may better agree together than these two, seeing they are more suitable, as being all of them parts of God’s divine immediate worship, and so is not the gathering and giving of alms, though it be a work of the Sabbath day. Besides, seeing the apostle does justly blame the Corinthians for not using their spiritual gifts so in the public assemblies, as the whole church might be best edified by them – saying, What is to be done then brethren? when ye come together, according as every one of you hath a psalm, or hath a doctrine, or hath a tongue, or hath revelation, or hath interpretation: let all things be done unto edifying (1 Cor. 14:26) – then how much more would he blame them, for so using their temporal gifts in the church, that they should tend to the destruction of themselves, and others? Now for a man, when he is devoutly occupied in any part of God’s public worship, to have another man come and pull him by the sleeve, and to whisper in his ear, and for him then to draw out his purse, and to change money; whether this be likely to edify, or destroy them both, that is, to further, or to hinder them in that about the which then they should be occupied, let other men judge. I am sure it is contrary to an injunction made in the days of our late sovereign Queen Elizabeth, of most blessed and famous memory, which as far as I conceive is not reversed by any of the last canons and ecclesiastical constitutions made in the first year of his Highness’ reign (whom God preserve and bless), in which it was decreed, ‘that no man, woman, or child, should otherwise be occupied in the time of service, than in quiet attendance to hear, mark, and understand that that is read, preached and ministered.’ [158] 158. Elizabeth, Injunct. Article 38 (Q. Iniunct. Articl. 38). [Cf. Injunctions given by the Queens Majesty concerning both the clergy and laity (1559; repr. c.1840), 9]. And so I conclude, that as alms giving is a necessary and perpetual duty to be performed upon the Sabbath day, so that it ought to be performed after that manner that no part of God’s public worship may be hindered, interrupted, or made unprofitable by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-bownd.html">Nicholas Bownd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sabbathum Veteris Et Novi Testamenti: or The True Doctrine of the Sabbath, 1635, ed. Christopher Coldwell (Dallas, TX and Grand Rapids, MI: Naphtali Press and Reformation Heritage Books, 2015)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

 the minister is occupied in the public service, that others should interpose themselves with gathering of money? Especially seeing that others may better agree together than these two, seeing they are more suitable, as being all of them parts of God’s divine immediate worship, and so is not the gathering and giving of alms, though it be a work of the Sabbath day. Besides, seeing the apostle does justly blame the Corinthians for not using their spiritual gifts so in the public assemblies, as the whole church might be best edified by them – saying, What is to be done then brethren? when ye come together, according as every one of you hath a psalm, or hath a doctrine, or hath a tongue, or hath revelation, or hath interpretation: let all things be done unto edifying (1 Cor. 14:26) – then how much more would he blame them, for so using their temporal gifts in the church, that they should tend to the destruction of themselves, and others? Now for a man, when he is devoutly occupied in any part of God’s public worship, to have another man come and pull him by the sleeve, and to whisper in his ear, and for him then to draw out his purse, and to change money; whether this be likely to edify, or destroy them both, that is, to further, or to hinder them in that about the which then they should be occupied, let other men judge. I am sure it is contrary to an injunction made in the days of our late sovereign Queen Elizabeth, of most blessed and famous memory, which as far as I conceive is not reversed by any of the last canons and ecclesiastical constitutions made in the first year of his Highness’ reign (whom God preserve and bless), in which it was decreed, ‘that no man, woman, or child, should otherwise be occupied in the time of service, than in quiet attendance to hear, mark, and understand that that is read, preached and ministered.’ [158] 158. Elizabeth, Injunct. Article 38 (Q. Iniunct. Articl. 38). [Cf. Injunctions given by the Queens Majesty concerning both the clergy and laity (1559; repr. c.1840), 9]. And so I conclude, that as alms giving is a necessary and perpetual duty to be performed upon the Sabbath day, so that it ought to be performed after that manner that no part of God’s public worship may be hindered, interrupted, or made unprofitable by it.”

— Nicholas Bownd, Sabbathum Veteris Et Novi Testamenti: or The True Doctrine of the Sabbath, 1635, ed. Christopher Coldwell (Dallas, TX and Grand Rapids, MI: Naphtali Press and Reformation Heritage Books, 2015)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+No+Collection+Is+To+Be+Made+In+The+Time+of+Divine+Service+Therefore+though+I+cannot+like+of+the+disordered+gathering+for+the+poor+that+is+in+many+places%2C+where+in+the+time+of+divine+service+you+shall+see+men+go+up+and+down+asking%2C+receiving%2C+changing%2C+and+bestowing+of+money+%E2%80%93+wherein+many+times+you+shall+have+them+so+disagree%2C+that+they+are+louder+than+the+minister+%E2%80%93+and+the+rest+stand+looking%2C+and+listening+unto+them%2C+leaving+the+worship+of+God+%28as+though+it+did+not+concern+them%29%2C+and+thus+all+is+confused%3B+so+yet+I+am+persuaded+that+this+is+the+fittest+time+to+make+this+provision.+And+I+presume+that+it+is+not+the+meaning+of+our+godly+wise+rulers+in+the+church+and+commonwealth+%28who+are+abused+therein%29%2C+that+any+such+thing+should+be+done%3B+but+that+the+gathering+being+made+at+some+other+time+of+day%2C+before+or+after+the+divine+service%2C+they+might+have+it+in+a+readiness+beforehand%2C+to+bestow+at+the+end+of+service+upon+the+needy%2C+according+to+their+discretion%3B+or+generally+to+take+some+good+order+that+God+might+be+best+served%2C+our+brethren+relieved%2C+and+no+man+justly+offended.+%7BAnd+it+seems+that+Justin+Martyr+would+insinuate+thus+much+unto+us%2C+that+in+his+time+at+their+public+assemblies+not+only+there+was+collection+for+the+poor%2C+but+in+this+manner.+For+speaking+of+all+things+that+were+done+publicly%2C+he+speaks+of+this+last%2C+as+though+it+were+last+done%2C+when+he+says%3A+%E2%80%98first+the+books+of+the+prophets+and+apostles+were+read%3B+then+some+exhortation+was+made+to+the+people%3B+after+this+there+was+prayer+and+thanksgiving.%E2%80%99+%5B157%5D+Not+that+there+was+none+before%2C+but+then+were+there+solemn+prayers+for+the+whole+Church%2C+and+for+them+that+are+in+authority.+%E2%80%98Fourthly%2C+the+creatures+of+bread+and+wine+were+blessed+and+distributed+unto+the+people%3B+and+last+of+all+the+richer+sort+did+contribute+something+to+the+poor%2C+as+God+did+make+them+able%2C+and+willing.%E2%80%99+By+which+as+we+may+presume+that+it+was+his+meaning+to+show+that+this+was+their+order%2C+that+the+reading+and+preaching+of+the+Word+of+God+and+prayer+went+before+the+sacrament%2C+so+all+of+them+before+their+collection+for+the+poor%3B+so+that+it+did+neither+prevent+any+of+them%2C+nor+was+mingled+with+them%3B+whose+example+should+be+our+imitation.%7D+157.+Justin+Martyr%2C+Apolog.+2+%5BCf.+First+Apology%2C+ch.+67%2C+ANF+1%2C+186.+Cf.+Migne%2C+PG+6%2C+430.%5D+But+we+may+say+of+this+thing+%5Boffering+during+the+worship+service%5D%2C+as+the+papists+do+of+private+mass+%28which+they+cannot+defend%29%2C+that+the+iniquity+of+the+people+brought+it+in.+For+when+men+through+covetousness+would+not+follow+the+rule+of+the+apostle%2C+to+put+something+apart+for+the+poor%2C+as+they+should+find+God+had+blessed+them+%281+Cor.+16%3A2%29%2C+and+so+bring+that+with+them+and+have+it+in+readiness%2C+as+he+says+here%2C+being+persuaded+that+it+is+a+duty+which+God+requires+of+them%2C+and+so+do+it+cheerfully+%282+Cor.+9%3A7%29%2C+as+unto+Him+who+has+promised+to+reward+it%3B+but+being+left+to+their+discretion%2C+they+have+shifted+it+off+as+they+might%3B+and+when+divine+service+was+ended%2C+and+now+nothing+more+was+to+be+done+in+the+church+but+that%2C+they+would+not+tarry+%5Bfor%5D+it.+Then%2C+the+collectors+for+the+poor+were+compelled+to+take+them+in+the+midst+of+God%E2%80%99s+service%2C+when+for+very+shame+by+starting+%7Baside%7D+they+could+not+refuse.+But+from+the+beginning+it+was+not+so%3B+and+seeing+God+is+not+the+author+of+confusion%2C+all+things+in+the+Church+must+be+done+honestly+and+in+good+order+%281+Cor.+14%3A33-40%29.+%7BBut+what+order+can+there+be+in+this%2C+that+then%2C+when+the+minister+is+reading+or+praying%2C+unto+the+which+all+should+attend+without+interruption%2C+others+should+be+chopping+and+changing+of+money%2C+and+squaring+about+it%3F+Or+to+speak+the+best+of+it%2C+quietly+taking+out+their+purse%2C+seeking+in+it%2C+and+distributing+out+of+it%3F+We+would+think+it+strange%2C+if+while+the+pastor+were+thus+occupied%2C+some+other+men+should+read+aloud+a+chapter+in+another+end+of+the+church%2C+or+three+or+four+should+begin+to+sing+a+psalm.+Why+then+should+it+not+seem+as+strange+unto+us%2C+when+the+minister+is+occupied+in+the+public+service%2C+that+others+should+interpose+themselves+with+gathering+of+money%3F+Especially+seeing+that+others+may+better+agree+together+than+these+two%2C+seeing+they+are+more+suitable%2C+as+being+all+of+them+parts+of+God%E2%80%99s+divine+immediate+worship%2C+and+so+is+not+the+gathering+and+giving+of+alms%2C+though+it+be+a+work+of+the+Sabbath+day.+Besides%2C+seeing+the+apostle+does+justly+blame+the+Corinthians+for+not+using+their+spiritual+gifts+so+in+the+public+assemblies%2C+as+the+whole+church+might+be+best+edified+by+them+%E2%80%93+saying%2C+What+is+to+be+done+then+brethren%3F+when+ye+come+together%2C+according+as+every+one+of+you+hath+a+psalm%2C+or+hath+a+doctrine%2C+or+hath+a+tongue%2C+or+hath+revelation%2C+or+hath+interpretation%3A+let+all+things+be+done+unto+edifying+%281+Cor.+14%3A26%29+%E2%80%93+then+how+much+more+would+he+blame+them%2C+for+so+using+their+temporal+gifts+in+the+church%2C+that+they+should+tend+to+the+destruction+of+themselves%2C+and+others%3F+Now+for+a+man%2C+when+he+is+devoutly+occupied+in+any+part+of+God%E2%80%99s+public+worship%2C+to+have+another+man+come+and+pull+him+by+the+sleeve%2C+and+to+whisper+in+his+ear%2C+and+for+him+then+to+draw+out+his+purse%2C+and+to+change+money%3B+whether+this+be+likely+to+edify%2C+or+destroy+them+both%2C+that+is%2C+to+further%2C+or+to+hinder+them+in+that+about+the+which+then+they+should+be+occupied%2C+let+other+men+judge.+I+am+sure+it+is+contrary+to+an+injunction+made+in+the+days+of+our+late+sovereign+Queen+Elizabeth%2C+of+most+blessed+and+famous+memory%2C+which+as+far+as+I+conceive+is+not+reversed+by+any+of+the+last+canons+and+ecclesiastical+constitutions+made+in+the+first+year+of+his+Highness%E2%80%99+reign+%28whom+God+preserve+and+bless%29%2C+in+which+it+was+decreed%2C+%E2%80%98that+no+man%2C+woman%2C+or+child%2C+should+otherwise+be+occupied+in+the+time+of+service%2C+than+in+quiet+attendance+to+hear%2C+mark%2C+and+understand+that+that+is+read%2C+preached+and+ministered.%E2%80%99+%5B158%5D+158.+Elizabeth%2C+Injunct.+Article+38+%28Q.+Iniunct.+Articl.+38%29.+%5BCf.+Injunctions+given+by+the+Queens+Majesty+concerning+both+the+clergy+and+laity+%281559%3B+repr.+c.1840%29%2C+9%5D.+And+so+I+conclude%2C+that+as+alms+giving+is+a+necessary+and+perpetual+duty+to+be+performed+upon+the+Sabbath+day%2C+so+that+it+ought+to+be+performed+after+that+manner+that+no+part+of+God%E2%80%99s+public+worship+may+be+hindered%2C+interrupted%2C+or+made+unprofitable+by+it.%E2%80%9D%0A%0A%E2%80%94+Nicholas+Bownd%2C+Sabbathum+Veteris+Et+Novi+Testamenti%3A+or+The+True+Doctrine+of+the+Sabbath%2C+1635%2C+ed.+Christopher+Coldwell+%28Dallas%2C+TX+and+Grand+Rapids%2C+MI%3A+Naphtali+Press+and+Reformation+Heritage+Books%2C+2015%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F39a49d7ec1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/39a49d7ec1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/tithes-and-offerings/offering-is-not-an-element-of-public-worship/#:~:text=But%20No%20Collection%20Is%20To%20Be,interrupted%2C%20or%20made%20unprofitable%20by%20it." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

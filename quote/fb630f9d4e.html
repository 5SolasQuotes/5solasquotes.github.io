<main class="wrap"><figure class="quote" id="q-fb630f9d4e" data-kw="">
<blockquote><p>The end of the whole Gospel ministry is that God, the fountain of all felicity, communicate Christ to us who are disunited by sin and hence ruined, that we may from him enjoy eternal life; that in a word all heavenly treasures be so applied to us that they be no less ours than Christ’s himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvin: Theological Treatises</cite>, J. K. S. Reid, Calvin: Theological Treatises (Louisville, KY; London: Westminster John Knox Press, 1954), 171.</span></figcaption>

</figure><figure class="quote" id="q-74af20edbe" data-kw="">
<blockquote><p>From this cause [native depravity] it proceeds, that many children, who have the opportunity of a good religious education, learn scarcely any thing of the most important truths of Christianity. If they are compelled to commit the Catechism to memory, they are wont to do this without ever thinking of the doctrines contained in the words which they recite; so that, when the attention is at any time awakened to the subject of religion, as a personal concern, they feel themselves to be completely ignorant of the system of divine truth taught in the Bible. Yet even to these, the truths committed to memory are now of great utility. They are like a treasure which has been hidden, but is now discovered. Of two persons under conviction of sin, one of whom has had sound religious instruction, and the other none, the former will have an unspeakable advantage over the latter in many respects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-a-alexander.html">Archibald A. Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts on Religious Experience</cite>, (Philadelphia: Presbyterian Board of Publication, 1841), ch. 1, p. 13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>

</figure><figure class="quote" id="q-4bef7517da" data-kw="">
<blockquote><p>He commanded the lepers cleansed to go to the priests, and offer their due, and his disciples to hear the scribes and pharisees in moses’s chair, etc. And yet: 1. The high priests were not of Aaron‘s line according to institution. 2. They bought the office of heathen Romans. 3. They had it not for life, according to institution. 4. Doctrine, worship, discipline and manners were heinously corrupted, so that the hearers were to beware of the leaven of their doctrine and not to imitate their lives. 4. They were bitter enemies of Christ and persecutors: yet Christ never bid his disciples to separate from anything but their errors; but says, ‘They shall cast you out of the synagogues.’ And doubtless Christ committed no sin; nor can we be so holy as He.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684), pt. 2, pp. 14-15</span></figcaption>

</figure><figure class="quote" id="q-7126d39207" data-kw="">
<blockquote><p>If I were with [the Cameronian minister] Mr. [James] Renwick, I would put him to call to mind the saying which at his parting I said to him, while he was requiring of me some memorable token, ‘Be not righteous over much, neither make thyself over wise; why shouldest thou destroy thyself?’ Now you understand not this; but remember that this I said to you, that sometime it shall be useful. Now it is time to live according to that word. Oh what need has he now of that admonition! If I were present with them that do adhere to Mr. Renwick, these that refuse to hear ministers, I would show them how great a sin schism is; and that the wrath of God is not far off from them who make and cherish separation. I with tears in the name of Jesus would beg that, leaving schism, they might live with their brethren in peace, love and unanimity. To decline union in every truth is nothing but pride and lordliness… if there be any that in his conscience thinks other ministers ought not to be heard, he errs in simplicity, and it is necessary that most quickly he leave that error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Maurice Grant, Preacher to the Remnant: The Story of James Renwick</cite>, (Blue Banner Productions, 2009), pp. 140-41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>

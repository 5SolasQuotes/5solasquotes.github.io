<main class="wrap"><figure class="quote" id="q-ca7a04a264" data-kw="">
<blockquote><p>2. The Gospel-Church before Antichrist, during his reign and what follows, is still one Church… This consideration shows the continuance of the Church and ordinances, and how that series is not interrupted by Antichrist’s sitting down in the Temple, 2 Thess. 2, but it continues to be the Church notwithstanding, and after his removal is to be acknowledged for the same Church that it was before he did set himself down therein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lecture 3, ‘Concerning the Identity of Angel, Bishop &amp; Presbyter’ in A Commentary upon the Book of the Revelation</cite>, … (Edinburgh, 1658), p. 539</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a></span></div>
<div class="actions"><button class="copy" data-copy="“2. The Gospel-Church before Antichrist, during his reign and what follows, is still one Church… This consideration shows the continuance of the Church and ordinances, and how that series is not interrupted by Antichrist’s sitting down in the Temple, 2 Thess. 2, but it continues to be the Church notwithstanding, and after his removal is to be acknowledged for the same Church that it was before he did set himself down therein.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2d4610d0fa" data-kw="">
<blockquote><p>‘But’ says [John] Robinson [the Separatist], ‘How can England forsake the Church of Rome and forsake the ministry, which is in the Church as in the subject, especially seeing you teach that a true ministry makes essentially a true Church?’ I answer, England may well separate from Rome everting the fundamental parts of faith, and not separate from Rome’s baptism, or ministry, insofar as they be essentially the ordinances of Christ: and I retort this argument: How can Separatists separate from both us and Rome, and yet retain the baptism in both our Church and Rome? 2. A ministry true in the essence may make a Church true [in Greek], insofar; but because of many other substantial corruptions in Rome, it is a Church which we ought to forsake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 240</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a></span></div>

</figure><figure class="quote" id="q-cb317aa3f1" data-kw="">
<blockquote><p>For that the doctrine there is most impure, we have demonstrated through its several parts. But if it is asked about morals, come, let the very histories of the Roman pontiffs (which the parasites of the pontiffs wrote) be compared with whatever monsters of men ever existed from the founding of the world, and it will be found that in this one seat more was permitted to Satan than in any tyranny that ever oppressed the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, ch. 7</span></figcaption>

</figure><figure class="quote" id="q-3851715e87" data-kw="">
<blockquote><p>…we haue delivered in the former observation that the Church of Rome in some sense may rightly be reputed a true visible Church; Everyone will be ready to except against it, and say, why then have you forsaken it, why do ye not still hold communion with her, what just exception can ye allege for your separation from her? For answer to which exception: Doctrine 2. I will propound in the second place this observation, namely, that howsoever the Church of Rome in some sense may be reputed a true visible Church, yet it is marvelously unsound and corrupt, and exceedingly corrupt with many foul abuses, errors and abominations; yea, so corrupt, as it is not lawful nor safe for us to communicate with her:</p></blockquote>

</figure><figure class="quote" id="q-451662e0a3" data-kw="">
<blockquote><p>Answer 1. A promiscuous baptizing of all we deny: It may import a baptizing of the infants of Turks, or of Papists, who avow they will bring up the child baptized in the Roman faith: In which case, it would seem Baptism should be denied, as the learned Walleus thinketh (in loc., commentary).</p></blockquote>

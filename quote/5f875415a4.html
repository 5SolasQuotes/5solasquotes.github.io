<main class="wrap"><figure class="quote" id="q-5f875415a4" data-kw="">
<blockquote><p>Paul begins now to make a closer comparison between the law and the nature of man, in order that the origin of the wickedness which leads to death may be more clearly understood. He then sets before us the example of a regenerate man, in whom the remains of the flesh dissent from the law of the Lord in such a way that the spirit would gladly obey it. …Sold under sin. By this expression Paul shows the strength which sin has in itself. By nature man is no less a slave to sin, then the bondmen whom their masters buy and ill-treat at will, as if they were oxen or asses. You are so completely driven by the power of sin, that our whole mind, our whole heart, and all our actions are inclined to sin. Compulsion I always exclude, for the sin of our own free will. It would not be sin if it were not voluntary. We are, however, so addicted to sin, that we can do nothing of our own accord but sin…. 15. For that which I do I know not. And now comes to a more particular example of a man who has already been regenerated. In this man the two objects of Paul’s attention appear more clearly, viz. the great difference which exists between the law of God and the nature of man, and the impossibility of the law of its self producing death…. For the purpose, therefore, of understanding the whole of this argument with more certainty and fidelity, it should be noted that this conflict mentioned by the apostle does not exist in man until he has been sanctified by the spirit of God. There is, therefore, this difference between them and believers. Believers are never so blinded and hardened in their minds as not to come down their crimes when they are reminded of them in the judgment of their own conscience…. Among the godly, on the other hand, the regeneration of God has been begun. They are so divided, however, that although they aspire to God with a special desire of their hearts, seek heavenly righteousness, and hate sin, they are drawn back again to the earth by the remnant of their flesh. Accordingly, in this state of distraction they fight against their own nature and feel their own nature fighting against them. They condemn their sins, not only because they are compelled by the judgment of reason, but because they abhor them with genuine feeling of the heart and detest their conduct in committing sin. This is the Christian warfare between flesh and spirit, of which Paul speaks in Gal. 5.17…. We may do dues from this what we stated previously, that Paul is here speaking of believers. Some grace of the Spirit exists in them, which illustrates the agreement between a sound mind and the righteousness of the law, because the flesh does not hate sin.</p></blockquote>

<blockquote><p>The progress in sin is therefore such… First, from the tinder comes a certain motion of titillation in the flesh toward lust, that is toward carnal concupiscence, which the sense existing in the flesh apprehends. [Second,] Through whose apprehension first the sensitive appetite conjoined to the sense is moved by a motion of pleasure about that to which the flesh tingles. Thirdly it is moved by a motion of desire to pursue that into action, which motion in the sensitive appetite mediated by the sense is apprehended by the reason of simple intelligence. Through which apprehension fourthly the will is moved by a motion of delight in delighting in the sensitive appetite; and in the fifth way by a motion into delight; and sixth by surreptitious desire for consent to pursue that into action, and here is the boundary and term of venial sin. Seventh is interpretative consent in delight, and it is the first and lowest grade of mortal sin, which is called mortal from morose delight. Eighth is true consent in delight. Ninth is consent in deed and according to Augustine in On the Sermon of the Lord on the Mount, “full sin known to God in our heart, and now if by deed it does not become known to men”. And then tenth, if the opportunity is present, follows the execution of the deed. Eleventh, from frequent execution, custom; and twelfth from custom, despair; and thirteenth, from despair, obstinacy, says Augustine in the sermon on Pharaoh’s hardening: “From a multitude of sins despair is born, and from despair hardness is generated according to that which is written: ‘The sinner, when he has come into the depths of sins, despises&#x27;”. And then fourteenth and last follows final impenitence, of which says Augustine in the sermon on blasphemy against the Holy Spirit: “Impenitence, as long as one lives in this flesh, cannot be judged as we understand persistent hardness of heart”. … First indeed in this way undoubtedly first motions are sins, both in the regenerate and in the unregenerate, because they have deformity in themselves against the rules of prudence and right reason, which deformity has the rule of vice, just as its contrary information has the rule of virtue. In this way also the said obliquity in the rule has the rule of vice, and similarly the tinder in the flesh, and this according to the manner in which virtues and vices are granted to be in the sensitive powers not by essence, but by a certain participation, as we determined in a preceding Quolibet… Secondly… And this mortal, if mortal sin be called that to which is due eternal punishment, because with sin as it is sin, eternal punishment is due… And this sin in the unregenerate should be called not original sin, but actual, and this because it is perpetrated not by an act of its own will, but by an act proper to its own flesh. … To the second that “first motions are not voluntary”, it must be said that, although not voluntary as regards the will of him in whom they are… they are however voluntary as regards the will of the first parent, as determines Augustine, bk. 3, ‘On Free Choice’, from whose will proceeded his own proper actual sin and henceforth all other original sins of others, either medially or immediately, and from them first motions, from whose will they have that they are sins both as regards blemish and as regards guilt…</p></blockquote>

<blockquote><p>The recognition of this matter is twofold, one true and certain, by divine revelation given to the Prophets, as often was done in the beginning of the Apostolic Church, as it is evident from Acts; 1 Cor. 12; 1 Tim. 1:20; 2 Tim. 4:14, 15; the other likely and uncertain, through human experience, by a diligent observation of the words and deeds of the impious against Christ (Gomar), when the desperate impiety of some most clearly appears, etc. (Calvin), as formerly it was judged that the Emperor Julian† had sinned, etc. (Gomar). † The Emperor Julian reigned from 361 to 363. Although trained up in the Christian religion, he apostatized from the faith, and endeavored, if unsuccessfully, to restore Rome to its ancient paganism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Synopsis of Interpreters, both Critical &amp; Otherwise, of the Sacred Scripture in The Exegetical Labors of the Reverend Matthew Poole</cite>, vol. 79, 1, 2, and 3 John, Jude (VA: Master Poole Publishing, 2013), on 1 Jn. 5:16, pp. 173-74</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The recognition of this matter is twofold, one true and certain, by divine revelation given to the Prophets, as often was done in the beginning of the Apostolic Church, as it is evident from Acts; 1 Cor. 12; 1 Tim. 1:20; 2 Tim. 4:14, 15; the other likely and uncertain, through human experience, by a diligent observation of the words and deeds of the impious against Christ (Gomar), when the desperate impiety of some most clearly appears, etc. (Calvin), as formerly it was judged that the Emperor Julian† had sinned, etc. (Gomar). † The Emperor Julian reigned from 361 to 363. Although trained up in the Christian religion, he apostatized from the faith, and endeavored, if unsuccessfully, to restore Rome to its ancient paganism.”

</figure><figure class="quote" id="q-4bfa275b68" data-kw="splendid vices">
<blockquote><p>That sin is rightly called the punishment of sin is proved: (1) Scripture expressly establishes this—the incest of Absalom is put forward as a punishment of David sent by God: “Thus saith the Lord, Behold, I will raise up evil against thee out of thine own house, and I will take thy wives before thine eyes, and give them unto thy neighbor, and he shall lie with thy wives in the sight of this sun. For thou didst it secretly: but I will do this thing before all Israel, and before the sun” (2 S. 12:11, 12). Nor can it be objected that “there was nothing penal here, only a bare permission and that the incest itself was not punishment formally.” We answer that the punishment of David ought to be a public disgrace and loss inflicted upon him before the sun and all Israel, and it was a pollution of David’s bed. Now the divine permission was neither formally a detriment to David, nor made publicly before the sun, but secretly in the impure heart of Absalom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.15</span></figcaption>

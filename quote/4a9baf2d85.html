<blockquote><p>The exercise of the keys to preach and administer the seals of grace, to open and shut Heaven by the keys, is given to the rulers in some things as they are scattered and single men, as to preach and administer the sacraments, without consent in special to every singular act: in some things, as to exercise power of jurisdiction, the exercise and the power is given to a community, not to one, unitati, non uni [a unity is not one], as Gerson observes from Augustine, and Augustine from the Word, Mt. 16; for the Church, not one single man, has power of discipline:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea… (London, 1642)</cite>, p. 5</span></figcaption>

</figure><figure class="quote" id="q-916cd650fe" data-kw="">
<blockquote><p>Also it is said, Acts 2:47, ‘God added to the Church daily such as should be saved’; which was not a particular congregational church, but the catholic. For it is not probable that those hundred and twenty that were together at Pentecost were one congregational church, for many of them were men of Galilee, which by their habitation could not pertain to the Church in Jerusalem, and yet the rest were added to them. … Again Eph. 4:4-5, the apostle proves the Church to be but one by diverse arguments. First he says, ‘There is but one body’ of Christ… Secondly, there is but one Spirit in that whole body, which is as one soul in one body. Thirdly, there is but one hope of their calling. Fourthly, there is but one Lord or King over the whole Church. Fifthly, there is but one Faith, i.e. one religion, doctrine, worship, the same commands and statutes for all. Sixthly, There is but one baptism to admit into this Church. Now if the whole world were under one King, and governed by one Law, and all capable of the same privileges, and all made denizons by the same way of enrollment, it would make but one empire; yet so it is with all the Churches in the world: they have the same King, Law, Word, sacraments, of admission and nutrition, which they visibly subject themselves unto and receive; therefore they are all one visible Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Essence &amp; Unity of the Church, catholic, visible: and the Priority thereof in regard of Particular Churches Discussed (London, 1645)</cite>, pp. 16-17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

"_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/916cd650fe.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/local-church-membership-is-not-necessary-to-partake-of-the-sacraments/#:~:text=Also%20it%20is%20said%2C%20Acts%202%3A47,they%20are%20all%20one%20visible%20Church&amp;text=Also%20it%20is%20said%2C%20Acts%202%3A47%2C%20%E2%80%98God%20added&amp;text=receive%3B%20therefore%20they%20are%20all%20one%20visible%20Church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-42dc7236d2" data-kw="">
<blockquote><p>Fourthly, the signs that difference a true Church from a false, do not primarily belong to a particular congregation, but to the Church-catholic-visible, viz. profession of the true faith, the administration of the true ordinances of God, the Word and sacraments; for therein all the whole Church agree, and is thereby distinguished from those that are without, not from those that are within. This is no note to know this or that particular church by, from another, for it is common to the universal Church, it distinguishes not among themselves, but from the general common opposite: the heathen, or the gross heretic. A man being lead into a vault where were the skulls of many dead men, and understanding that Alexander’s skull was there, desired his guide to show him that; his guide told him it was that skull with the hollow eye holes and with the gristly nose, and with futures crossing the brain pan, and when the man replied that they had all so, yea says his guide, there is no difference between kings and other men’s skulls when they are dead. So if any man should ask you or me which is the church of Ipswich, Dedham or Colchester, it were a folly to say it is the Church where the word of God is preached and sacraments administered, and that profess Jesus Christ to be crucified, dead and buried, risen again, and ascended into Heaven, for so do all the Church catholic, but I must give some other notes to distinguish any of them, for these are not distinctive, because common. Therefore the signs of the true Church belong primarily to the whole, secondarily to particular parts thereof, and are therefore not distinctive to the parts. That which is primary to any thing is distinctive to that thing, but that which is secondary and common is not distinctive from other particulars of the like kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Essence &amp; Unity of the Church, catholic, visible: and the Priority thereof in regard of Particular Churches Discussed (London, 1645)</cite>, p. 29</span></figcaption>

</figure><figure class="quote" id="q-3f44fc0ca5" data-kw="">
<blockquote><p>As your baptism makes you members of the universal Church, in order of nature before you are members of a particular church, so your relation to the universal Church is more noble, more necessary and more durable than your relation to any particular church. It is more noble, because the society is more noble. The whole is more excellent than a little part: It is more necessary because you cannot be saved and be Christians without being members of the universal Church: But you may be Christians and be saved without being a member of any stated particular church. It is more durable because you can never separate from the universal Church or cease to be a member of it without being separated from Christ: but diverse occasions may warrant your removal from a particular church. Live not therefore in those narrow and dangerous principles as if your congregation or your party were all the Church of Christ, or as if you had no Christian relation to any other ministers or people, nor owed any duty to them as members of the same Body. But remember that all Christians, persons and congregations are but the members of the Kingdom of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1, Direction 18, ‘Understand well the necessity of your Communion with all the Universal Church, and wherein it consists, and how far to be preferred before your Communion with any particular Church’</cite>, pp. 115-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

<main class="wrap"><figure class="quote" id="q-dd854b39f7" data-kw="">
<blockquote><p>THOSE who wish to explore the holy Scripture and who drive away negligence in doing so, and thirst rather for the attainment thereof, and apply themselves vigorously and apart from all sloth – the being in every good shall be theirs, for they fill their mind with the Divine Light: and then applying it to the doctrines of the Church, they admit every thing that is right and unadulterate, and that most readily, and lay it up in the hidden treasures of their soul, and rejoice as much in what they in their desire of knowledge have collected, as others who are worldly, in insatiably collecting Indian gems or gold, yea rather, yet more: for wisdom is better than costly stones, and every precious thing is not worthy of her, as it is written. For I say that they who are wise and prudent and skilled in the Divine doctrines, ought to remember what has been profitably written by one of the holy Disciples, Brethren try the spirits whether they he of God. And the Divine Paul says that to the saints has been given discerning of spirits.

For the one who say Lord Jesus, will say it none otherwise than through the Holy Ghost: and they who out of unlearning let loose a contradicting tongue against them, and wherein those think rightly, these all but say Jesus Anathema, from Beelzebub will they do so. We must then studying to prove all things subtly and in a finished manner and with mind awake, light on the writings of certain, and test skilfully what words they use of Christ the Saviour of us all, and imitate, and that aright, the most approved and experienced of money dealers, who admit proved coin, and diligently reject the counterfeit and amiss.

And to this the blessed Paul invites us saying, Be ye skilful bankers, prove all things, hold fast that which is good, abstain from every form of evil. And it is in other ways also all-disgraceful and unseemly, that in the affairs of this life we should be seen no whit sparing of what conduceth to profit, but rather make it of moment to aim and strive after those things whereby we may live splendidly, and neglect things so sacred and count for nothing the salvation of the soul, but let it sink down in pits and swamps, sometimes exposing unto the mere pleasure of those who choose to say what they ought not, our mind, not vigilant for the truth, nor choosing to search diligently what is the true and profitable meaning of what has been read, what the perverted one and that outsteps accuracy in doctrine and works loss in the soul that looks to it. Yet to the soul is there nought equal in value in their sight who are perfect in understanding.

We must try therefore and that most straitly, writings on the Divine doctrines, and if any should go along with the sacred Scriptures and speed its clear and most unerring way therein, let it be acclaimed by us too with testimonies to its orthodoxy: but if it form its language cold and astray and amiss, yea rather giver of destruction to the readers, let it hear from every mouth, But ye are uttering and telling us another error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-cyril-of-alexandria.html">Cyril of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five-Book Contradiction of the Blasphemies of Nestorius or The Five Tomes of S. Cyril</cite>, (430), Book 1, preface, trans. P. E. Pusey in A Library of Fathers of the Holy Catholic Church, Anterior to the Division of the East and West, Translated by Members of the English Church. Volume 47 (Oxford: James Parker, 1881), pp 1-2.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7469950696" data-kw="">
<blockquote><p>Now we determine that the supreme right, authority, and judgment of interpreting the scriptures, is lodged with the Holy Ghost and the scripture itself: for these two are not mutually repugnant. We say that the Holy Spirit is the supreme interpreter of scripture, because we must be illuminated by the Holy Spirit to be certainly persuaded of the true sense of scripture; otherwise, although we use all means, we can never attain to that full assurance which resides in the minds of the faithful. … As to external persuasion, we say that scripture itself is its own interpreter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, Controversy 1, Q. 5, ch. 3 (p. 415)</span></figcaption>

<blockquote><p>The Bereans are praised for not rashly and hastily receiving whatever Paul taught them, but diligently examining his doctrine by scripture. Whence we draw two inferences: First, that all doctrine is to be judged by the scriptures. For, if the Bereans compared the preaching of an apostle with the rule of scripture, shall we embrace without any examination whatever the pope may please to maintain?</p></blockquote>

</figure><figure class="quote" id="q-ea02d03b91" data-kw="">
<blockquote><p>The other, then, is the external judgment; by which, we judge, to the greatest certainty, of the spirits and doctrines of all men; not for ourselves only, but for others also, and for their salvation. This judgment is peculiar to the public ministry of the Word and the external office, and especially belongs to teachers and preachers of the Word. Of this we make use, when we strengthen the weak in faith, and when we refute adversaries.</p></blockquote>

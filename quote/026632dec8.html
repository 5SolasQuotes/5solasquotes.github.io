<main class="wrap"><figure class="quote" id="q-026632dec8" data-kw="">
<blockquote><p>Have due respect to every truth which God has revealed in his word. — Divine truths are one consistent whole; none of which can be spared without disfiguring the beauty and symmetry of the whole system, and injuring our own souls and the souls of others, by withholding from them a truth which they need for their spiritual improvement and comfort.

It is a great mistake to suppose one part of the Bible to be legal, and another evangelical, as if the divine oracles contradicted themselves, — far from it; they make one complete, united, and consistent system. Every truth beautifully fills its own place. Transpose it, and it becomes useless, yea, a pernicious error. Omit it, and a vacancy is left which nothing else can supply.

If divine truths seem to us to militate against each other, the fault is in the medium through which we view them; and because we view them through a false medium, they appear contradictions to us, but are not so in themselves. We, as sinners, want them all; they were intended for our relief as such: and united together as a complete whole, they are a suitable and adequate remedy for all our miseries.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-charles.html">Thomas Charles</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preface to the Rev. Mr. Oliver s Hymn Book’ in Edward Morgan (ed.), Essays, Letters, and Interesting Papers of the Late Rev. Thomas Charles, A.B. Bala, Merionethshire</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-85d2bcd06d" data-kw="">
<blockquote><p>One finds Calvin (for instance) declaiming, in his lectures, that they [French kings] are “gross and stupid.” They “think they are exempt from the law.” They are self-indulgent, “inhuman tyrants,” and “madmen.” They “despise everything divine” and wish to be worshipped in God’s place. They “rage against the church.” “We know that wherever there is cunning in the world, it reigns especially in the palaces of princes.”… Thus, the depiction of obsequious deference and obedience on the part of Geneva towards France was, in reality, a façade.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jon-balserak.html">Jon Balserak</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Geneva’s Use of Lies, Deceit &amp; Simulation in Their Efforts to Reform France</cite>, 1536–1563’ HTR 112:1 (2019), pp. 76–100, p. 97</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-70b462bc5a" data-kw="">
<blockquote><p>Q. What if by the wrong a man does me, I observe such infirmity, yea and iniquity to be in him, as by experience I find him to be a far other man than at first I supposed him to be, ought I notwithstanding to make such account of him as I did before? A. We must put difference betwixt a wrong done upon such an occasion as may afterwards be avoided, and that which is done upon an evil disposition, which remaining in a man, may be a means to make him continue to do more and more wrongs. The wrong of the former must be so forgiven, as the wrong doer be so accepted as if he had done no wrong at all. As for the latter, we are to try if he may be brought to sight of his evil disposition, and to repentance for the same. If he be, then ought we to esteem him as if he never had done us any hurt. But if obstinately he persist in that evil disposition, and be like, on all occasions, again and again to wrong us, though we do, as we ought, fully forgive all the wrongs done, and neither take any present revenge, nor keep them in mind and memory for any future revenge, yet may we in our judgment esteem him to be such an one as we find him to be. (Woe to them that call evil good: that put light for darkness, and sweet for bitter.) For example, if I find one of whom I have had a very good account, and thereupon used him very familiarly, to have no command of his tongue, but on all occasions to be ready to blab out, and blaze abroad whatsoever he sees or hears, if therein he have wronged me, I may forbear to use him so familiarly as I did before, and take heed what secrets I communicate to him, though I fully forgive the wrong that is past. Or if I have accounted one to be an entire friend to me, but by experience find him to be hollow-hearted, and maliciously minded against me, I ought wisely and warily to avoid his society, and to take heed of the snares which he lays for me. (For which we have the pattern of David, and Christ) yet so to pass by the wrongs done as if none had been done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Go to God</cite>, (London, 1626), §148. ‘Of a full forgiving one another,’, pp. 186-87</span></figcaption>

</figure><figure class="quote" id="q-827e45f8e4" data-kw="">
<blockquote><p>And yet (which is our great reproach) we are often in a deep sleep in the midst of our greatest Dangers, and are hardly well awake when God has wrought out our Deliverance: we sleep when our Enemies are awake to contrive our destruction; and are but in a Dream, when watchful Providence has brought Salvation; so was the Church Ps. 126.1. When the Lord turned again the Captivity of Zion, then were we like them that dream; and that because we are slow to believe there should be so much malice in men to plot the ruin of them that are innocent; or so much mercy in God to save them that are so guilty: And therefore our God awakens our dull and drowsy souls, to consider how faithfully he that keeps Israel doth neither slumber nor sleep.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/vincent-alsop.html">Vincent Alsop</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God in the mount: A sermon upon the wonderful deliverance of His Majesty from assassination. The nation from invasion</cite>, (London: J. Barnes, 1696), p. 1.</span></figcaption>

</figure><figure class="quote" id="q-6291ea70cd" data-kw="">
<blockquote><p>And thus beauty, which is indeed God’s handiwork, but only a temporal, carnal, and lower kind of good, is not fitly loved in preference to God, the eternal, spiritual, and unchangeable good. When the miser prefers his gold to justice, it is through no fault of the gold, but of the man; and so with every created thing. For though it be good, it may be loved with an evil as well as with a good love: it is loved rightly when it is loved ordinately; evilly, when inordinately. It is this which some one has briefly said in these verses in praise of the Creator: “These are Thine, they are good, because Thou art good who didst create them. There is in them nothing of ours, unless the sin we commit when we forget the order of things, and instead of Thee love that which Thou hast made.” But if the Creator is truly loved, that is, if He Himself is loved and not another thing in His stead, He cannot be evilly loved; for love itself is to be ordinately loved, because we do well to love that which, when we love it, makes us live well and virtuously. So that it seems to me that it is a brief but true definition of virtue to say, it is the order of love; and on this account, in the Canticles, the bride of Christ, the city of God, sings, “Order love within me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bishop of Hippo. The City of God, XV.22</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“And thus beauty, which is indeed God’s handiwork, but only a temporal, carnal, and lower kind of good, is not fitly loved in preference to God, the eternal, spiritual, and unchangeable good. When the miser prefers his gold to justice, it is through no fault of the gold, but of the man; and so with every created thing. For though it be good, it may be loved with an evil as well as with a good love: it is loved rightly when it is loved ordinately; evilly, when inordinately. It is this which some one has briefly said in these verses in praise of the Creator: “These are Thine, they are good, because Thou art good who didst create them. There is in them nothing of ours, unless the sin we commit when we forget the order of things, and instead of Thee love that which Thou hast made.” But if the Creator is truly loved, that is, if He Himself is loved and not another thing in His stead, He cannot be evilly loved; for love itself is to be ordinately loved, because we do well to love that which, when we love it, makes us live well and virtuously. So that it seems to me that it is a brief but true definition of virtue to say, it is the order of love; and on this account, in the Canticles, the bride of Christ, the city of God, sings, “Order love within me.”

— Augustine of Hippo, Bishop of Hippo. The City of God, XV.22">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+thus+beauty%2C+which+is+indeed+God%E2%80%99s+handiwork%2C+but+only+a+temporal%2C+carnal%2C+and+lower+kind+of+good%2C+is+not+fitly+loved+in+preference+to+God%2C+the+eternal%2C+spiritual%2C+and+unchangeable+good.+When+the+miser+prefers+his+gold+to+justice%2C+it+is+through+no+fault+of+the+gold%2C+but+of+the+man%3B+and+so+with+every+created+thing.+For+though+it+be+good%2C+it+may+be+loved+with+an+evil+as+well+as+with+a+good+love%3A+it+is+loved+rightly+when+it+is+loved+ordinately%3B+evilly%2C+when+inordinately.+It+is+this+which+some+one+has+briefly+said+in+these+verses+in+praise+of+the+Creator%3A+%E2%80%9CThese+are+Thine%2C+they+are+good%2C+because+Thou+art+good+who+didst+create+them.+There+is+in+them+nothing+of+ours%2C+unless+the+sin+we+commit+when+we+forget+the+order+of+things%2C+and+instead+of+Thee+love+that+which+Thou+hast+made.%E2%80%9D+But+if+the+Creator+is+truly+loved%2C+that+is%2C+if+He+Himself+is+loved+and+not+another+thing+in+His+stead%2C+He+cannot+be+evilly+loved%3B+for+love+itself+is+to+be+ordinately+loved%2C+because+we+do+well+to+love+that+which%2C+when+we+love+it%2C+makes+us+live+well+and+virtuously.+So+that+it+seems+to+me+that+it+is+a+brief+but+true+definition+of+virtue+to+say%2C+it+is+the+order+of+love%3B+and+on+this+account%2C+in+the+Canticles%2C+the+bride+of+Christ%2C+the+city+of+God%2C+sings%2C+%E2%80%9COrder+love+within+me.%E2%80%9D%0A%0A%E2%80%94+Augustine+of+Hippo%2C+Bishop+of+Hippo.+The+City+of+God%2C+XV.22&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6291ea70cd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6291ea70cd.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/03/strong-meat-from-the-stacks-augustine-on-rightly-ordered-love/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

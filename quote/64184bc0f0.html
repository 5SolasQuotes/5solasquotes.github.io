<main class="wrap"><figure class="quote" id="q-64184bc0f0" data-kw="">
<blockquote><p>As I hasten to a conclusion, I am compelled to pass by your calumny, that, leaning entirely to our own judgment, we find not in the whole Church one individual to whom we think deference is due. That it is a calumny, I have already sufficiently demonstrated. For, although we hold that the Word of God alone lies beyond the sphere of our judgment, and that Fathers and Councils are of authority only in so far as they accord with the rule of the Word, we still give to Councils and Fathers such rank and honour as it is meet for them to hold, under Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tracts Relating to the Reformation</cite>, trans. Henry Beveridge, vol. 1 (Edinburgh: Calvin Translation Society, 1844), 66.</span></figcaption>

<blockquote><p>. . . he is the best student who does not read his thoughts into the book, but lets it reveal its own; who draws from it its sense, and does not import his own into it, nor force upon its words a meaning which he had determined was the right one before he opened its pages. Since then we are to discourse of the things of God, let us assume that God has full knowledge of Himself, and bow with humble reverence to His words. For He Whom we can only know through His own utterances is the fitting witness concerning Himself.</p></blockquote>

<blockquote><p>For we never said that every thing in scripture is easy, perspicuous, and plain; that there is nothing obscure, nothing difficult to be understood; but we confess openly that there are many obscure and difficult passages of scripture … We hold the contrary, that the scriptures are not so difficult but that they may be read with advantage, and ought to be read, by the people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, Question 4, ch. 1</span></figcaption>

</figure><figure class="quote" id="q-f44781459e" data-kw="">
<blockquote><p>It is designed primarily for the intelligent reader rather than for the scholar. In the process of popularization much had to be diluted, ommitted or condensed. In many areas the presentation is very sketchy, though, I hope, authentic and accurate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-chomsky.html">William Chomsky</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hebrew: The Eternal Language</cite>, (Philadelphia: Jewish Publication Society, 1957) 340 pp. ToC Chart of paleo-Hebrew: p. 87., p. vii</span></figcaption>

— William Chomsky, Hebrew: The Eternal Language (Philadelphia: Jewish Publication Society, 1957) 340 pp. ToC Chart of paleo-Hebrew: p. 87., p. vii">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+designed+primarily+for+the+intelligent+reader+rather+than+for+the+scholar.+In+the+process+of+popularization+much+had+to+be+diluted%2C+ommitted+or+condensed.+In+many+areas+the+presentation+is+very+sketchy%2C+though%2C+I+hope%2C+authentic+and+accurate.%E2%80%9D%0A%0A%E2%80%94+William+Chomsky%2C+Hebrew%3A+The+Eternal+Language+%28Philadelphia%3A+Jewish+Publication+Society%2C+1957%29+340+pp.+ToC+Chart+of+paleo-Hebrew%3A+p.+87.%2C+p.+vii&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff44781459e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f44781459e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/textual-criticism-of-the-old-testament/#:~:text=It%20is%20designed%20primarily%20for%20the,though%2C%20I%20hope%2C%20authentic%20and%20accurate&amp;text=It%20is%20designed%20primarily%20for%20the%20intelligent%20reader&amp;text=very%20sketchy%2C%20though%2C%20I%20hope%2C%20authentic%20and%20accurate" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a761f3de04" data-kw="">
<blockquote><p>If he feign another rule of faith besides the written word of God, we reject, repudiate, and refuse to acknowledge any such, and reduce the whole rule of the catholic faith to the scripture alone. …Faith, therefore, is not the gift of the church, except improperly and in a mere ministerial capacity; but it is properly and necessarily the gift and effect of the Holy Spirit speaking through the scriptures. The sum of the matter is this: faith is produced by scripture alone; therefore the true sense of scripture is to be discovered from the scripture itself alone. Our third argument stands thus: The supreme judge of controversies and legitimate interpreter of scripture should have these three properties: the first is, that we should certainly know that the sentence which he delivers is true, and that we can acquiesce in it; the second, that no appeal from that sentence shall be lawful; the third, that he be influenced by no partiality. Now the church or the pope possess none of these; whereas the scripture, and the Holy Spirit speaking in the scripture, have them all. Therefore the supreme decision is to be given to them, and not to the church or the pope. The major is self-evident. The minor, namely, that none of these properties exist in any visible church or in the pope, is clear also. …As to Cyprian, his error did not lie in rejecting custom and appealing to scripture, (for he is praised by Augustine for doing so,) but in thinking that his opinion could be established by scripture, whereas scripture is subversive of it. Even Gratian, Dist. 8 and 9, approves of Cyprian for refusing to yield to mere custom2. Bellarmine subjoins that the Arians (to mention no more) appealed to the scripture alone. I answer: The Arians clung to the bare words of scripture: we do not imitate them in that. We do not reject terms which never occur in scripture, provided the sense and force of those terms be contained in scripture, as we have frequently replied already: on which account we condemn the Arians for rejecting the Homoüsion. However, religion and piety do not consist in words; and Luther said truly, that he should not be a heretic if he rejected the term Homoüsion, and yet so thought of the Son of God as the scriptures have delivered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, (1588), 328, 448, 611.</span></figcaption>

<blockquote><p>XL. Holy obedience is to walk in a manner worthy of the Lord, to please Him in all respects, bearing fruit in every good work and increasing in the knowledge of God. XLI. This life is like a journey that we must walk, always mindful that we are here as travelers, far from the Lord, and striving toward our homeland. XLII. Those who walk in a manner worthy of the Lord are those who, throughout the course of their lives, follow the will and guidance of God, denying their own desires and the dictates of the flesh, as befits children of the heavenly Father and imitators of God.</p></blockquote>

<blockquote><p>I answer: For the understanding of the aforesaid, it must be noted that, according to John Damascene, the will of good pleasure is twofold, namely, antecedent and consequent: antecedent or conditional, by which He wills, as far as is in Him, the salvation of all, and absolute, by which He determinately wills something that He knows with certainty will happen. It must be understood, therefore, that it is not possible for any will of God to be overcome; it is not possible for any to be rendered void; yet it is possible for some, such as the antecedent, not to be fulfilled; and it is necessary for some, such as the consequent, to be fulfilled, and it is impossible for it to be hindered. None, I say, is possible to be overcome. For if a man does not do what God wills, as far as is in him, by the antecedent will, God does with him what He wills by the consequent will; and thus it is always fulfilled either of the man or by the man, and thus it is never vanquished or overcome. Nor is it possible for the will of God to be rendered void. For something is said to be void when it is deprived of its proper effect, for which it is: but no will is deprived of the effect for which it is properly. For what is said, that God wills all men to be saved, as far as is in Him, this will does not connote salvation, nor is it properly for the effect of salvation, but it connotes the ordination of nature or a nature ordainable to salvation. Hence it is nothing more to say: God wills this person to be saved, as far as is in Him, than that it pleased God to give this person a nature through which he could arrive at salvation, and that God was prepared to help, so that salvation does not fail because of a defect on the part of God. Hence it is not rendered void, because it has its proper effect. But concerning the absolute will, it is plain that it cannot be rendered void, because it posits all its effect and never remains unfulfilled. Since, therefore, it is true that the will of God can in no way be overcome or rendered void, yet it is necessary that the absolute will be fulfilled, but the conditional will not at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1 | dist. 47 | Treatment of the Questions</span></figcaption>

<blockquote><p>7. To the first argument [n.1] I say that although the saying of the apostle [1 Tim. 2:4] could be expounded with a distribution accommodated for all those who will be saved – yet it could much better be expounded of antecedent will, thus: ‘he wills to save all men and that all are saved’, namely as far as concerns his own part and by his antecedent will, forasmuch as he has given them natural gifts and right laws and common aids sufficient for salvation.

8. Just as of a king, establishing good laws and prefixing ministers to guard those laws, it could be said that he wills all his subjects to live peaceably and quietly, as far as in him, and yet, if he see someone being unjustly oppressed, it would not be necessary that the king at once involve himself, to make him live quietly, unless he were turned over to him by a complaint of fact (he does indeed antecedently will everyone to live peaceably and quietly, but he does not will everyone immediately so to live), – so I say in the matter at hand, that although God [does] not have a will of being well-pleased to save this person, yet he wills for him the common aids to salvation, by which he too can live sufficiently well and be saved; on account of which it can be said that, as far as is on his part, he wills all to be saved.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“7. To the first argument [n.1] I say that although the saying of the apostle [1 Tim. 2:4] could be expounded with a distribution accommodated for all those who will be saved – yet it could much better be expounded of antecedent will, thus: ‘he wills to save all men and that all are saved’, namely as far as concerns his own part and by his antecedent will, forasmuch as he has given them natural gifts and right laws and common aids sufficient for salvation.

8. Just as of a king, establishing good laws and prefixing ministers to guard those laws, it could be said that he wills all his subjects to live peaceably and quietly, as far as in him, and yet, if he see someone being unjustly oppressed, it would not be necessary that the king at once involve himself, to make him live quietly, unless he were turned over to him by a complaint of fact (he does indeed antecedently will everyone to live peaceably and quietly, but he does not will everyone immediately so to live), – so I say in the matter at hand, that although God [does] not have a will of being well-pleased to save this person, yet he wills for him the common aids to salvation, by which he too can live sufficiently well and be saved; on account of which it can be said that, as far as is on his part, he wills all to be saved.”

— John Duns Scotus, Ordinatio, bk. 1, dist. 26-48 tr. Peter Simpson (2013 / 2023), dist. 46, Whether God’s Will of Good-Pleasure is always fulfilled? II. To the Principal Arguments, p. 197">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C7.+To+the+first+argument+%5Bn.1%5D+I+say+that+although+the+saying+of+the+apostle+%5B1+Tim.+2%3A4%5D+could+be+expounded+with+a+distribution+accommodated+for+all+those+who+will+be+saved+%E2%80%93+yet+it+could+much+better+be+expounded+of+antecedent+will%2C+thus%3A+%E2%80%98he+wills+to+save+all+men+and+that+all+are+saved%E2%80%99%2C+namely+as+far+as+concerns+his+own+part+and+by+his+antecedent+will%2C+forasmuch+as+he+has+given+them+natural+gifts+and+right+laws+and+common+aids+sufficient+for+salvation.+8.+Just+as+of+a+king%2C+establishing+good+laws+and+prefixing+ministers+to+guard+those+laws%2C+it+could+be+said+that+he+wills+all+his+subjects+to+live+peaceably+and+quietly%2C+as+far+as+in+him%2C+and+yet%2C+if+he+see+someone+being+unjustly+oppressed%2C+it+would+not+be+necessary+that+the+king+at+once+involve+himself%2C+to+make+him+live+quietly%2C+unless+he+were+turned+over+to+him+by+a+complaint+of+fact+%28he+does+indeed+antecedently+will+everyone+to+live+peaceably+and+quietly%2C+but+he+does+not+will+everyone+immediately+so+to+live%29%2C+%E2%80%93+so+I+say+in+the+matter+at+hand%2C+that+although+God+%5Bdoes%5D+not+have+a+will+of+being+well-pleased+to+save+this+person%2C+yet+he+wills+for+him+the+common+aids+to+salvation%2C+by+which+he+too+can+live+sufficiently+well+and+be+saved%3B+on+account+of+which+it+can+be+said+that%2C+as+far+as+is+on+his+part%2C+he+wills+all+to+be+saved.%E2%80%9D%0A%0A%E2%80%94+John+Duns+Scotus%2C+Ordinatio%2C+bk.+1%2C+dist.+26-48+tr.+Peter+Simpson+%282013+%2F+2023%29%2C+dist.+46%2C+Whether+God%E2%80%99s+Will+of+Good-Pleasure+is+always+fulfilled%3F+II.+To+the+Principal+Arguments%2C+p.+197&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff89fa2cd79.html&amp;via=5Solas" target="_blank" rel="n

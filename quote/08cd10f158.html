<main class="wrap"><figure class="quote" id="q-08cd10f158" data-kw="">
<blockquote><p>The sovereignty of the Lord Jesus over all creatures, doth plainly foreshew a resurrection of the bad, as well as of the good. Indeed, the unjust shall not arise, by virtue of any relation they stand in to the Lord Jesus, as the saints shall; but yet, because all are delivered into his hand, and he made sovereign Lord over them; therefore by an act of his sovereign power, they that are ungodly, shall arise</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Resurrection of the Dead, and Eternal Judgment</cite>, The Resurrection of the Wicked</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-399eaf4d68" data-kw="">
<blockquote><p>Obj. 1. The resurrection of Christ, according to what has been said, can neither be an argument in favor of the resurrection of the wicked, nor the cause of it, inasmuch as they are not members of Christ. Therefore the wicked will not rise. Ans. The wicked will not rise on account of the resurrection of Christ, but for other causes, viz: on account of the just judgment of God, for which they will be raised from the dead, that they may be eternally punished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, Q. 45 (benefits of Christ&#x27;s resurrection)</span></figcaption>

— Zacharias Ursinus, Commentary on the Heidelberg Catechism, Q. 45 (benefits of Christ&#x27;s resurrection)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObj.%201.%20The%20resurrection%20of%20Christ%2C%20according%20to%20what%20has%20been%20said%2C%20can%20neither%20be%20an%20argument%20in%20favor%20of%20the%20resurrection%20of%20the%20wicked%2C%20nor%20the%20cause%20of%20it%2C%20inasmuch%20as%20they%20are%20not%20members%20of%20Christ.%20Therefore%20the%20wicked%20will%20not%20rise.%20Ans.%20The%20wicked%20will%20not%20rise%20on%20account%20of%20the%20resurrection%20of%20Christ%2C%20but%20for%20other%20causes%2C%20viz%3A%20on%20account%20of%20the%20just%20judgment%20of%20God%2C%20for%20which%20they%20will%20be%20raised%20from%20the%20dead%2C%20that%20they%20may%20be%20eternally%20punished.%E2%80%9D%0A%0A%E2%80%94%20Zacharias%20Ursinus%2C%20Commentary%20on%20the%20Heidelberg%20Catechism%2C%20Q.%2045%20%28benefits%20of%20Christ%27s%20resurrection%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F399eaf4d68.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/399eaf4d68.html">Permalink</a><a class="src" href="https://archive.org/details/commentaryofzach00ursiuoft" rel="noopener" target="_blank">Read it online · Internet Archive</a></div>
</figure><figure class="quote" id="q-68ca6aa5c2" data-kw="">
<blockquote><p>XXVI. Although the wicked as well as the pious will rise again, still the resurrection of each will be diverse as to cause as well as with regard to manner. The latter, indeed, will be made by Christ the Mediator, as head, by the efficacy of his quickening Spirit (Rom. 8:11), to an immortality of glory. But the former by Christ as the Son of God, the Lord and Judge, by virtue of his omnipotence and justice, to eternal punishment, in which the wicked will acquire a physical immortality and incorruptibility, but in order to greater punishment—that they may suffer for ever and thus feel that they die, so as never to die; not only by a punishment of loss, but also by the severest punishment of sense, of which there will be no end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.1.26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/resurrection/resurrection-of-the-body.html">Resurrection of the Body</a> › <a href="../topics/resurrection/resurrection-of-the-body/resurrection-of-the-just-and-unjust.html">Resurrection of the just and unjust</a></span><span class="t"><a href="../topics/judgment-and-the-final-state/the-last-judgment.html">The Last Judgment</a> › <a href="../topics/judgment-and-the-final-state/the-last-judgment/the-judge.html">The Judge</a></span><span class="t"><a href="../topics/resurrection/christs-resurrection-as-the-pledge.html">Christ&#x27;s Resurrection as the Pledge</a> › <a href="../topics/resurrection/christs-resurrection-as-the-pledge/united-to-the-risen-head.html">United to the risen Head</a></span></div>

— Francis Turretin, Institutes of Elenctic Theology, 20.1.26">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXVI.%20Although%20the%20wicked%20as%20well%20as%20the%20pious%20will%20rise%20again%2C%20still%20the%20resurrection%20of%20each%20will%20be%20diverse%20as%20to%20cause%20as%20well%20as%20with%20regard%20to%20manner.%20The%20latter%2C%20indeed%2C%20will%20be%20made%20by%20Christ%20the%20Mediator%2C%20as%20head%2C%20by%20the%20efficacy%20of%20his%20quickening%20Spirit%20%28Rom.%208%3A11%29%2C%20to%20an%20immortality%20of%20glory.%20But%20the%20former%20by%20Christ%20as%20the%20Son%20of%20God%2C%20the%20Lord%20and%20Judge%2C%20by%20virtue%20of%20his%20omnipotence%20and%20justice%2C%20to%20eternal%20punishment%2C%20in%20which%20the%20wicked%20will%20acquire%20a%20physical%20immortality%20and%20incorruptibility%2C%20but%20in%20order%20to%20greater%20punishment%E2%80%94that%20they%20may%20suffer%20for%20ever%20and%20thus%20feel%20that%20they%20die%2C%20so%20as%20never%20to%20die%3B%20not%20only%20by%20a%20punishment%20of%20loss%2C%20but%20also%20by%20the%20severest%20punishment%20of%20sense%2C%20of%20which%20there%20will%20be%20no%20end.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2020.1.26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F68ca6aa5c2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/68ca6aa5c2.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-39e34c7d9b" data-kw="">
<blockquote><p>This notion, as if the justification, righteousness, and life spoken of in Rom. v. implied the resurrection of damnation, is not only without ground from Scripture, but contrary to reason. For those are there spoken of as great benefits, by the grace and free gift of God: but this is the contrary, in the highest degree possible; the most consummate calamity. To obviate this, our author supposes the resurrection of all to be a great benefit in itself, though turned into a calamity by the sin and folly of obstinate sinners, who abuse God&#x27;s goodness. But the far greater part of mankind, since Adam, have never had opportunity to abuse this goodness, it having never been made known to them. Men cannot abuse a kindness, which they never had either in possession, promise, offer, or some intimation: but a resurrection is made known only by divine revelation which few comparatively have enjoyed. So that as to such wicked men as die in lands of darkness, if their resurrection comes at all by Christ, it comes from him, and to them, only is a curse, and not a blessing; for it never comes to them at all by any conveyance, grant, promise, or offer, or any thing by which they can claim it, or know any thing of it, till it comes as an infinite calamity, past all remedy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Christian Doctrine of Original Sin Defended</cite>, pt. 2, ch. 4, sec. 1 (on Rom. 5:12–21)</span></figcaption>

</figure><figure class="quote" id="q-b739b4f72c" data-kw="">
<blockquote><p>They further argue, that Christ is the meritorious cause of the resurrection; and since he has merited nothing for the wicked or reprobate they shall not be raised. The answer to which is, that Christ is the meritorious cause of the resurrection of life, but not of the resurrection of damnation; the saints will rise to life by virtue of union to Christ, through his merit, and the power of his resurrection: not so the wicked; they will rise, not through his merit, and by virtue of union to him, but by his almighty power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Doctrinal Divinity</cite>, bk. 7, ch. 4 (Of the Resurrection of the Body)</span></figcaption>

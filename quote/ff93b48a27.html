<main class="wrap"><figure class="quote" id="q-ff93b48a27" data-kw="">
<blockquote><p>Hence Romanists and Ritualists have inferred that the sign is inseparable from the grace signified, and that these spiritual effects are due to the outward ordinance. Hence the doctrine of baptismal regeneration. But it must be observed that the Scriptures do not assert these spiritual attributes of water baptism in itself considered, but of water baptism as the sign or emblem of baptism by the holy Ghost. These spiritual attributes belong only to baptism by the Spirit, and they accompany the sign only when the sign is accompanied by that which it signifies. It does not follow, however, that the sign is inseparable from the grace. The grace is sovereign; and experience teaches us that it is often absent from the sign, and that the sign is least frequently honoured by the presence of the grace when it is itself most implicitly relied upon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, chs. 27–28 (on baptismal regeneration)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5304def06a" data-kw="">
<blockquote><p>That condition is faith. It is the clearly pronounced doctrine of the Lutheran Church that baptism is altogether useless or void of any saving effect, unless the recipient be a believer. And by faith is not meant mere speculative assent, such as Simon Magus had, but true, living, and saving faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, “Condition on which the Efficacy of Baptism is suspended”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/efficacy.html">Baptism: Efficacy</a> › <a href="../topics/baptism/efficacy/baptismal-regeneration-vs-baptism-as-sign-and-seal.html">Baptismal regeneration vs baptism as sign and seal</a></span></div>
<div class="actions"><button class="copy" data-copy="“That condition is faith. It is the clearly pronounced doctrine of the Lutheran Church that baptism is altogether useless or void of any saving effect, unless the recipient be a believer. And by faith is not meant mere speculative assent, such as Simon Magus had, but true, living, and saving faith.”

— Charles Hodge, Systematic Theology, vol. 3, “Condition on which the Efficacy of Baptism is suspended”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+condition+is+faith.+It+is+the+clearly+pronounced+doctrine+of+the+Lutheran+Church+that+baptism+is+altogether+useless+or+void+of+any+saving+effect%2C+unless+the+recipient+be+a+believer.+And+by+faith+is+not+meant+mere+speculative+assent%2C+such+as+Simon+Magus+had%2C+but+true%2C+living%2C+and+saving+faith.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Systematic+Theology%2C+vol.+3%2C+%E2%80%9CCondition+on+which+the+Efficacy+of+Baptism+is+suspended%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5304def06a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5304def06a.html">Permalink</a><a class="src" href="https://ccel.org/ccel/hodge/theology3" rel="noopener" target="_blank">Read it online · CCEL, vol. 3</a></div>
</figure><figure class="quote" id="q-305c2b20cb" data-kw="">
<blockquote><p>Christ does not retain both members of the first proposition in that which stands in opposition to the promise; he merely says: “He that believeth not, shall be damned.” Christ makes this distinction, because there is not the same necessity for faith and baptism to salvation. Faith is absolutely necessary to salvation, so that no one can be saved without it: for “without faith it is impossible to please God.” (Heb. 11:6.) But the sacraments are necessary when they may be observed according to divine appointment. Contempt of the sacraments under such circumstances, is inconsistent with faith. This is the reason why Christ promises salvation to those that believe and are baptized, keeping in view the distinction which is here made. Yet he does not deny salvation to those who are deprived of this sacrament. … The word extends to all; the sacraments only to such as believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, on Mark 16:16 (the necessity of baptism)</span></figcaption>

</figure><figure class="quote" id="q-8ded7cc3b8" data-kw="">
<blockquote><p>With regard to the efficacy of the sacraments, we think that they do not produce grace, nor have any inherent power of conferring or bestowing it, but are only signs and seals, which, lawfully used, seal grace, and exhibit it to the faithful;—God by his Holy Spirit really working the power, and fulfilling in the faithful, whatsoever he promises and signifies by the signs; hence they have no efficacy except towards believers, for whose benefit they were appointed. Now we prove that the sacraments do not bestow grace, first, because grace is the effect of the Spirit only… Secondly, because the sacraments would thus physically contain grace in them, or grace would be tied to the sacraments, which is absurd, for as many are saved without, so many are condemned with, the sacraments,—Simon Magus, for instance. Thirdly, because nothing that is corporeal has power to penetrate to the soul. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, Book XI, ch. II, Of the Efficacy of the Sacraments</span></figcaption>

</figure><figure class="quote" id="q-9cbaa3a91f" data-kw="">
<blockquote><p>In this matter of baptism — if I may be pardoned for saying it — I can only conclude that all the doctors have been in error from the time of the apostles. . . . All the doctors have ascribed to the water a power which it does not have and the holy apostles did not teach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/huldrych-zwingli.html">Huldrych Zwingli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Baptism</cite></span></figcaption>

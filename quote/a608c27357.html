</figure><figure class="quote" id="q-125b61d58b" data-kw="">
<blockquote><p>Concerning the matter of the Church, the Independents have learned all their unjust scrupulosity from the other; as the Brownists [separatists] require every church member to be a saint, really regenerate and justified, who at their admission have publicly satisfied the whole congregation by convincing signs of their true holiness: the other requires the same. Whatever indulgence here the Independents profess to give, either to weak ones in whom they find the least of Christ, or to women whom they remit from the congregation to speak more privately in the eldership (yet this is no other than the present practice of the Brownists at Amsterdam.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (1645), ch. 6, pp. 105-6</span></figcaption>

</figure><figure class="quote" id="q-83d968759b" data-kw="">
<blockquote><p>2. By virtue of this church communion, they say, one church by letters of recommendation may give power to another church over any of her members for excommunication, and the ministers of one church may convey power to the ministers of another church for administration of the sacraments to any of their members. Cotton, Catechism, p. 7; Apology, pp. 2, 14, 26, 40; J.W. to T.S…

3. But without such letters of recommendations and formal granting over of such power, from one church and minister to another, it were unlawful in any case to administer any church ordinance to any church or members but their own or to admit them to any church communion upon any pretense whatsoever. Apology, pp. 14, 26, 40.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-rathband.html">William Rathband</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Narration of Some Church Courses Held in Opinion &amp; Practice</cite>, … (London, 1644) Rathband was a Westminster divine., Ch. 10, pp. 37-38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>
<div class="actions"><button class="copy" data-copy="“2. By virtue of this church communion, they say, one church by letters of recommendation may give power to another church over any of her members for excommunication, and the ministers of one church may convey power to the ministers of another church for administration of the sacraments to any of their members. Cotton, Catechism, p. 7; Apology, pp. 2, 14, 26, 40; J.W. to T.S…

3. But without such letters of recommendations and formal granting over of such power, from one church and minister to another, it were unlawful in any case to administer any church ordinance to any church or members but their own or to admit them to any church communion upon any pretense whatsoever. Apology, pp. 14, 26, 40.”

— William Rathband, A Brief Narration of Some Church Courses Held in Opinion &amp; Practice in the Churches Lately Erected in New England: Collected out of Sundry of their Own Printed Papers, … (London, 1644) Rathband was a Westminster divine., Ch. 10, pp. 37-38">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+By+virtue+of+this+church+communion%2C+they+say%2C+one+church+by+letters+of+recommendation+may+give+power+to+another+church+over+any+of+her+members+for+excommunication%2C+and+the+ministers+of+one+church+may+convey+power+to+the+ministers+of+another+church+for+administration+of+the+sacraments+to+any+of+their+members.+Cotton%2C+Catechism%2C+p.+7%3B+Apology%2C+pp.+2%2C+14%2C+26%2C+40%3B+J.W.+to+T.S%E2%80%A6+3.+But+without+such+letters+of+recommendations+and+formal+granting+over+of+such+power%2C+from+one+church+and+minister+to+another%2C+it+were+unlawful+in+any+case+to+administer+any+church+ordinance+to+any+church+or+members+but+their+own+or+to+admit+them+to+any+church+communion+upon+any+pretense+whatsoever.+Apology%2C+pp.+14%2C+26%2C+40.%E2%80%9D%0A%0A%E2%80%94+William+Rathband%2C+A+Brief+Narration+of+Some+Church+Courses+Held+in+Opinion+%26+Practice+in+the+Churches+Lately+Erected+in+New+England%3A+Collected+out+of+Sundry+of+their+Own+Printed+Papers%2C+%E2%80%A6+%28London%2C+1644%29+Rathband+was+a+Westminster+divine.%2C+Ch.+10%2C+pp.+37-38&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F83d968759b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/83d968759b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-leaving-a-congregation/#:~:text=2.%20By%20virtue%20of%20this%20church,whatsoever.%20Apology%2C%20pp.%2014%2C%2026%2C%2040&amp;text=2.%20By%20virtue%20of%20this%20church%20communion%2C%20they&amp;text=any%20pretense%20whatsoever.%20Apology%2C%20pp.%2014%2C%2026%2C%2040" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

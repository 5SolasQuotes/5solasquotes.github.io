<main class="wrap"><figure class="quote" id="q-35279583c3" data-kw="">
<blockquote><p>The primitive Church also of Christ his apostles had no images, either of Christ himself or of other saints set up in their places of public prayer, nor in their Churches. The deed of Epiphanius is very well known which he committed at Anablacha in Syria. It is written in Greek in an epistle to John Bishop of Jerusalem, and translated into Latin by St. Jerome: He rent the vail that hung in the temple [church building], bearing in it the image of Christ or some other saint, testifying therewithal that it is against Christian religion for the picture of a man, to hang in the Church of God. Saint Augustine in Catalogo haerese [Greek] makes mention of one Marcella a follower of Carpocrates his sect, which worshipped the images of Jesu, Paul Homer and Pythagoras, with falling down prostrate before them and offering incense unto them…. Furthermore, for Christ our Lord and very God, though he have taken on him the nature of us men, yet that notwithstanding, there ought no image to be erected. For he did not become man to that intent. But he drew up his humanity into heaven, and therewithal gave us a charge, that so often as we pray, we shoulde lift up the eyes of our minds and bodies into heaven above. Moreover, being once ascended, he sent his Spirit instead of himself, unto the Church wherin he has a spiritual kingdom, and needs not any bodily or corruptible things. For he commanded that if we would bestow any thing on him or for his sake, we should bestow it on the poor, and not on his picture or image. And now, since without all controuersy, our Christ is the very true God, and that the very true God does forbid to hallow to him any likeness of man, that is, to represent God in the shape of a man, it follows consequently that to Christ no image is to be dedicated, because he is the true and very God and life everlasting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty Godly &amp; Learned Sermons divided into Five Decades</cite>, … (1549; London: 1577), 2nd Decade, 2nd Sermon, Of God’s Law, and of the Two First Commandments of the First Table, pp. 121-22</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5f6717e9f4" data-kw="">
<blockquote><p>The worst men and the most superstitious will yet pretend the honoring of God. So it is again in regard of those days that men have set apart for God, and it is that which has settled men in the superstitious observation of them, that it is for the honor of Christ. ‘What’ (say they) ‘shall we not honor the birth of our blessed Savior?’ What a profaness, what a disrespect is this unto Jesus Christ? ‘Well let others do what they will, for our parts we will do it, for hereby we shall do honor unto our blessed Savior.’ So the Papists for the adoration of images, say they, ‘What not regard, not to reverence the image the picture of our blessed Savior and of the holy saints?’ And the truth is if it be duly weighed, there is the same reason of images of Christ and the saints, and of days set apart for the honor of Christ by man’s invention; and there is as fair a pretence of honoring Christ by setting up his image before me to put me in mind of Him as of honoring of Him by keeping a day of mine own appointment. There is (I say) the same reason of both, and whatsoever argument any man shall bring me against the one, I dare undertake to make it good to be against the other. As now, is not natural reason as strong to set up the picture of the King to honor him (and you do it for that end) is not this as much as to keep a day once a year to remember him? So the reason may be as strong to honor Christ by way of picture as to honor Him by observing any day set apart for that end by the inventions of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Eighth, Ninth and Tenth Chapters of the Prophesy of Hosea</cite>, … (London: Cole, 1650), on Hos. 5:6, pp. 408-9</span></figcaption>

</figure><figure class="quote" id="q-27b9fb99a7" data-kw="">
<blockquote><p>There is a twofold worship due only to God, internal and external.… Internal, which consists in the acts of the soul and actions answerable thereto. When the mind is most taken up with an object, and the heart and affections most set upon it, this is soul worship, and this is due only to God.… Now according to this distinction of worship there are two sorts of idolatry, 1. Open, outward idolatry.… 2. Secret and soul idolatry, when the mind and heart is set upon anything more than God; when anything is more valued, more intended; anything more trusted, more loved, or our endeavours more for any other thing than God. Then is that soul worship, which is due only to God … given to other things besides him. And this is as true, as heinous idolatry, as the former, though not so open, discernible, nor so much observed.… Secret idolaters shall have no inheritance in the kingdom of God. Soul idolatry will exclude men out of heaven as well as open idolatry. He that serves his lusts is as uncapable of heaven as he that serves, worships idols of wood or stone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Soul Idolatry Excludes Men Out of Heaven</cite>, on Eph. 5:5 (definition of soul idolatry)</span></figcaption>

</figure><figure class="quote" id="q-32f10c1bd5" data-kw="">
<blockquote><p>Therefore upon these grounds, 1. We simply condemn any delineating of God, or the Godhead, or Trinity, such as some have upon their buildings, or books, like a sun shining with beams and the Lord’s Name, Jehova, in it, or any other way, this is most abominable to see, and a heinous wronging of God’s Majesty.</p></blockquote>

<blockquote><p>…the attitude of the early Fathers had been anything but friendly toward the images of art. They had rejected their use by Christians and had held a quite derogatory view of religious imagery. It was only in the age of the great Cappadocians, toward the end of the fourth century, when in religious literature and learning, too, the first phase of the fusion between Christianity and Hellenism was well-nigh completed, that religious imagery was no longer considered as idolatry by the leaders of Christian thought. But it remained for the [iconophiles in the] era of the Iconoclastic Controversy to give a thorough theoretical foundation to the distinction between idols and icons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gerhart-b-ladner.html">Gerhart B. Ladner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Concept of the Image</cite>, vol. 7 (1953), pp. 3-34, p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“…the attitude of the early Fathers had been anything but friendly toward the images of art. They had rejected their use by Christians and had held a quite derogatory view of religious imagery. It was only in the age of the great Cappadocians, toward the end of the fourth century, when in religious literature and learning, too, the first phase of the fusion between Christianity and Hellenism was well-nigh completed, that religious imagery was no longer considered as idolatry by the leaders of Christian thought. But it remained for the [iconophiles in the] era of the Iconoclastic Controversy to give a thorough theoretical foundation to the distinction between idols and icons.”

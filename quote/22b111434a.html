<main class="wrap"><figure class="quote" id="q-22b111434a" data-kw="">
<blockquote><p>The Holy Scripture is the only sufficient, certain and infallible rule of all saving knowledge, faith and obedience … The whole counsel of God concerning all things necessary for his own glory, man’s salvation, faith and life, is either expressly set down or necessarily contained in the Holy Scripture: unto which nothing at any time is to be added, whether by new revelation of the Spirit, or traditions of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 1.1, 1.6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span><span class="t"><a href="../topics/holy-scripture/inerrancy-and-infallibility.html">Inerrancy and Infallibility</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9ae95d3b37" data-kw="Mary Mediator Invocation of saints">
<blockquote><p>However, we cannot in any way acknowledge or accept what our opponents openly say, namely that Mary is to be invoked as a mediator between God and humans, or that she is our patron and advocate. We do not believe that this is either a tradition of Holy Scripture or a command from God. We believe that God, who alone grants all salvation for the present and future, is the one to be invoked alone. We believe that Christ alone [since He alone is true God and true man] is the true mediator between God and humans. We believe that He, who alone can satisfy all humans, is the patron and advocate with the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon on the Blessed Virgin Mary, the Mother of Our Lord Jesus Christ</cite>, 1558</span></figcaption>

</figure><figure class="quote" id="q-3f70548235" data-kw="">
<blockquote><p>In other words, if faith depends upon the word of God alone, if it regards and reclines on it alone, what place is left for any word of man? … God deprives man of the power of producing any new doctrine, in order that he alone may be our master in spiritual teaching, as he alone is true, and can neither lie nor deceive.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.8.9</span></figcaption>

</figure><figure class="quote" id="q-738aac8891" data-kw="">
<blockquote><p>As we believe and confess the Scriptures of God sufficient to instruct and make the man of God perfect; 2 Tim. iii. 16, 17. so do we affirm and avow the authority of the same to be of God, and neither to depend on men nor angels. We affirm, therefore, that such as allege the Scripture to have no other authority but that which it hath received from the Church, are blasphemous against God, and injurious to the true church; which always heareth and obeyeth the voice of her own Spouse and pastor (John 10), but takes not upon her to be mistress over the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scottish-reformers.html">Scottish Reformers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scots Confession</cite>, 1560, Art. 19</span></figcaption>

<blockquote><p>Secondly I answer that we do acknowledge with glad minds that Christ died for all (the scripture averring so much): but we utterly deny that He died for all and everyone alike in respect of God, or, as well for the damned as elect, and that effectually on God’s part. … Again, if all and every one be effectually redeemed, all and every one are reconciled unto God, because that the forgiveness of sins and the satisfaction for the same are inseparably joined together. Yea and Paul places redemption in the remission of sins where he says: ‘By whom we have redemption through his blood, even the forgiveness of sins.’ (Eph. 1:7 &amp; Col. 1:14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian &amp; Plain Treatise of the Manner &amp; Order of Predestination &amp; of the Largeness of God’s Grace (d. 1602: London: Welby &amp; Clarke, 1606), 4th Crimination</cite>, pp. 82-83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a7ad219589" data-kw="">
<blockquote><p>As for that collaterality which is objected, I answer, the civil and ecclesiastical power, if we speak properly, are not collateral. 1. They have no footing upon the same ground: there may be many subject to the magistrate, who are no church members, and so not under the spiritual power; and where the same persons are subject to both the powers, there is no more collaterality, in this case, nay, not so much, as is betwixt the power of a father in one man, and the power of a master in another man, when both powers are exercised upon the same man who is both a son and a servant. 2. Powers that are collateral, are of the same eminency and altitude, of the same kind and nature; but the civil power is a dominion and lordship; the ecclesiastical power is ministerial, not lordly. 3. Collateral powers do mutually and alike exercise authority over each other respectively. But, though the magistrate may exercise much authority in things ecclesiastical [circa sacra], church officers can exercise no authority in things civil. The magistrate’s authority is ecclesiastical objective, though not formaliter: but the church officer’s authority is not civil so much as objective, not being exercised about either civil, criminal, or capital cases. 4. Collateral powers are subordinate to, and derived from the supreme and original power, like two branches growing out of the same stock, two streams flowing from the same fountain, two lines drawn from the same center, two arms under the same head; but the power of the magistrate is subordinate unto, and depends upon the dominion of God the Creator of all: the power of church officers depends upon the dominion of Christ, the Mediator and King of the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming (1646) | Part 2, ch. 8</cite>, p. 120</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<blockquote><p>We believe it can be proved to be the clear and certain teaching of Scripture, that Christ, having become our surety and substitute, took our place and assumed our responsibilities as transgressors of God’s law, and in consequence, endured the penalty we had incurred, and thereby rendered satisfaction to the Divine Justice and Law for our sins,—a satisfaction which was the true and adequate ground of all subsequent procedure on God’s part towards us, in bestowing forgiveness and spiritual blessings. Christ’s death, according to this view, was not merely penal in its general character, but it was on His part the endurance of the penalty we had merited,—the same penalty we had incurred;—the same, not, of course, in its circumstances or its external aspects, but in its legal value,—its moral worth, its real significance, as a compliance with the requirements of law, which denounced punishment and demanded satisfaction. It is true, indeed, that all orthodox divines have not attached quite so much importance as Dr. Owen does, to the distinction between the idem and the tantundem,—‘the same,’ and ‘the as much,’—a distinction which he presses so strongly in the exposition of this subject. Some divines of the highest eminence and orthodoxy have admitted that the substance of what Scripture teaches on this subject might be held to be declared by asserting that Christ suffered as much as sinners had deserved,—the tantundem and not the idem,—provided due care was taken to guard against the loose and vague generality of representing Christ’s death merely as a substitute for the penalty,—a phrase which may mean almost anything or almost nothing,—and to keep up distinctly and prominently the idea of substantial identity, or sameness as really attaching to it, when viewed as a judicial infliction in accordance with the provisions of law. But though some difference of phraseology has been sanctioned by high authority on this subject, there has been a very general concurrence of opinion among orthodox divines, that it is no real declaration of the scriptural doctrine of the Atonement to say that Christ’s death was a substitute for the penalty which men had incurred, or even to say that it was an equivalent for the penalty, unless the idea of substantial identity, or sameness,—sameness in worth and value, in import and significance,—be kept up, by its being represented as a full equivalent and an adequate compensation. This, at least, seems necessary in order to embody the sum and substance of what Scripture teaches upon the subject; and nothing short of this can be fairly held to be implied in the position that Christ suffered as a substitute for us, and thereby rendered satisfaction for our sins to God’s Justice and Law. Our [Westminster] Confession of Faith says (ch. 11, section 5) that both ‘the exact justice and the rich grace of God are glorified in the justification of sinners.’ And we are persuaded that it may be regarded as a general test of the soundness of men’s views upon this whole subject, that they not only assent honestly and intelligently to this statement of our Confession…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons: from 1828-1860 (1872; rep. Still Waters Revival, 1991), Sermon 28, ‘The Atonement: Scripture Doctrine &amp; Current Theories’, on Gal. 4:4-5</cite>, pp. 408-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<blockquote><p>Fourthly, we deny that all mankind is the object of that love of God which moved Him to send his Son to die: God having made some for the day of evil, Prov. 16:4; hated them before they were born, Rom. 9:12; before of old ordained them to condemnation, Jude 4; being fitted for destruction, Rom. 9:22; made to be taken and destroyed, 2 Pet. 2:12; appointed to condemnation, 1 Thess. 5:9; to go to their own place, Acts 1:25.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Salus electorum, sanguis Jesu, or the Death of Death in the Death of Christ… (London: W.W., 1648), bk. 2, ch. 4</cite>, p. 92</span></figcaption>

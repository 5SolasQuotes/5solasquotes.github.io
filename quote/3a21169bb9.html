<main class="wrap"><figure class="quote" id="q-3a21169bb9" data-kw="">
<blockquote><p>About refraining a moral duty for the evil mixed with it, or in the persons performing it: 1. As we are not to do evil that good may come of it, no more ought we to leave what is morally good undone for the evil that is some way mixed with it. Zeal for good is to be preferred to that which is against evil. The greatest good is better than the greatest evil is bad. Whatever good thing we do tends towards our union with the chiefest Good, the refraining of evil not so immediately. 2. Betwixt things indifferent and what is morally good, you have this difference: If there be any mixture of evil with the one, it becomes wholly evil; there is nothing of good in it to give stop or preponderate; but what is morally good will remain so still, though mixed with evil. We may allay the worth of it, as baser metals mixed with gold, but yet it is gold still, and may be perfectly severed. 3. ‘When I would do good,’ says the apostle, ‘evil is present with me.’ [Rom. 7:21] I cannot hear, or read or pray, and the rest, but with a mixture of sin; yet upon this account I may not cease from or neglect a known duty, not though materially considered the evil accompanying being greater than the good; as in meditation, when blasphemous thoughts arise, etc. To omit a known duty is a sin of wilfulness; the evil from me in it is but infirmity only; The least wilful sin is greater and more provoking than the greatest sin of infirmity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Case of Great &amp; Present Use: Whether we may Lawfully Hear the now Conforming Ministers who are Re-ordained &amp; have Renounced the [Solemn League &amp;] Covenant &amp; Some of them [are] Supposed to be Scandalous in their Lives, Considered &amp; Affirmatively Resolved (1672; 1677), Consideration 2</cite>, pp. 8-10</span></figcaption>

</figure><figure class="quote" id="q-7b93b1b030" data-kw="">
<blockquote><p>Will any object unto us the profaneness of the ministers, rudeness and disorder of the ministration of God’s worship, we yield it is too visibly true; but more vile administrators, or irregular administrations cannot be than were the sons of Eli in their service, who made the people to loathe the offerings of the Lord, and were rebuked, and described by Samuel in 1 Sam. 2:12-17… O horrid uncleanness, most heaven-daring villany! Yet I find not that any God-fearing-Israelite forsook the sanctuary, or durst forbear their sacrifice; nor did Samuel (who reproved, and denounced God’s judgment against this profaneness) ever advise or direct the same.</p></blockquote>

</figure><figure class="quote" id="q-b150bf6217" data-kw="">
<blockquote><p>While the people with fear and joy see God lighting his own fire, fire from heaven, the two sons of Aaron, in a careless presumption, will be serving Him with a common flame; as if He might not have leave to choose the forms of his own worship. If this had been done some ages after, when the memory of the original of this heavenly fire had been worn out, it might have been excused with ignorance; but now, when God had newly sent his fire from above, newly commanded the continuance of it, either to let it go out, or, while it still flamed, to fetch profane coals to God’s altar, could savour of no less than presumption and sacrilege. … Speed of death is not always a judgment: suddenness, as it is ever justly suspicable, so then certainly argues anger, when it finds us in an act of sin. Leisure of repentance is an argument of favor. When God gives a man law, it implies that He would not have judgment surprise him.</p></blockquote>

</figure><figure class="quote" id="q-10f7895cb1" data-kw="">
<blockquote><p>3. The charge of ‘false worship’ unexplained, is mere deceit: 1. Worship is so far false as it is contrary to the rule. Every sermon, prayer or sacrament which we administer has faultiness and sin and is so far ‘false worship’. 2. But worship offered God on pretence that He instituted it when He did not, or that man has authority to command the like, is yet worse false worship. 3. And the worship of false gods or idols, is yet worse than that, and abhorred of God. 4. His [a separatist] making all faulty circumstances, such as he names, to be idolatry, because ‘false’, as he calls it, is yet more sinful and of mischievous importance [than the above three items].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes… (London: 1684), pt. 2</cite>, p. 14</span></figcaption>

<main class="wrap"><figure class="quote" id="q-1d4739cbe5" data-kw="">
<blockquote><p>48. Q. When begins the Lord’s day?

A. In the morning. Act. 20.7.

When Paul came to the Church at Troas, he had a mind to spend a Lord’s day with them, though he was in great haste to depart so soon as he could. He came therefore to their assembly at the time that they came together according to their custom: but he kept them till the end of that day: (for he would not travel on the Lord’s day) and having dismissed the assembly, he departed. Now it is said, that he continued his speech till midnight (Acts 20. 7) even till break of day (ver. 11.) and then departed: which departure of his is said to be on the morrow. By this punctual expression of the time it appears that the first day of the week, the Lord’s day, ended at midnight: and that then the morrow began. Now to make a natural day which consisteth of twenty four hours, it must begin and end at the same time: for the end of one day is the beginning of another. There is not a minute betwixt them. As therefore the Lord’s day ended at midnight, so it must begin at midnight: when we count the morning to begin. Which is yet more evident by this phrase (Mat. 28.1.) In the end of the Sabbath (namely of the week before, which was the former Sabbath) as it began to dawn (namely) on the next day, which was the Lord’s day) or (as Joh. 20.1.) when it was yet dark there came divers to anoint the body of Jesus, but they found him not in the grave: he was risen before: so as Christ rose before the Sun.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s sanctification</cite>, (London, 1641), pp 24-5.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-82f0725e3b" data-kw="">
<blockquote><p>We must observe the sabbath as holy time; holy, yet not by constitution, not essentially holy, as Christ is holy; nor inherently, as the saints are holy; but holy by institution, by sanction, relatively holy. “The Lord blessed the sabbath-day, and hallowed it;” [Exod. xx. 11;] that is, he set it apart for holy uses: “Keep the sabbath-day to sanctify it.” (Deut. v. 12.) Nothing but holy things must be done in this holy time, – praying, reading, hearing, singing of psalms, &amp;c., (as Psalm xcii., which is both a precept and platform for sabbath sanctification,) meditation, rejoicing in God, and thanksgiving, as you may read at large.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-case.html">Thomas Case</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon VI. Of Sabbath Sanctification in Puritan Sermons 1659-1689: Being the Morning Exercises at Cripplegate, St. Giles in the Fields and in Southwark</cite></span></figcaption>

<blockquote><p>As for the argument that the New Testament contains numerous fragments of hymns, it is significant that there is not a tittle of evidence to show that most of the alleged fragments are quotations, or that they were ever sung or intended to be sung, or that they are uninspired hymns, or that they are hymns or poetry at all!</p></blockquote>

</figure><figure class="quote" id="q-5d1d7cee19" data-kw="">
<blockquote><p>Psalms are song by emperors; the common people rejoice in them. Each man does his utmost in singing what will be a blessing to all. Psalms are sung in the home and rehearsed on the streets. The psalm is learned without labor and remembered with delight. Psalmody unites those who disagree, makes friends of those at odds, and brings together those who are out of charity with one another. Who could retain a grievance against the man whom he had joined in singing before God? The singing of praise is the very bond of unity, when the whole people join a single act of song.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-ambrose.html">Ambrose of Milan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition 9</cite>, trans. Erik Routley in The Church and Music (London: Duckworth, 1950), 129.</span></figcaption>

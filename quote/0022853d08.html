<blockquote><p>In the midst of his critique of the Presbyterian Church in Ireland, the Revd James Kennedy, the Covenanter minister at Limavady (who later moved to America), pointed out that the PCI was inconsistent in professing adherence to the Westminster Standards while, at the same time, admitting those of erroneous sentiments into their pulpits:

Another step in reform we would endeavour to bring to our brethren to take would be the ceasing to employ to teach their congregations men whom in consistency they must consider to be erroneous in sentiment and principle. We have already referred to the fact, that members of the Assembly freely invite to their pulpits, to teach their people, Congregationalists and Baptists; and the time is not long past when even Methodists – known to be of Arminian sentiments – were to be found occasionally in the pulpits of Presbyterian ministers. […]

The Presbyterians of Ireland in the times of the Covenant acted not thus, for as [James Seaton] Reid well shews, when Arminians and Baptists attempted to shew their face in any locality, the most strenuous efforts were made to suppress their erroneous teachings. All this may be thought very uncharitable to Baptists, but really after all, men who deny that we are even baptized – hold us an unbaptized mass of unconverted professors, and must in consistency deny that we have a sacrament at all, and thus virtually unchurch us, deserve little charity at our hands, and we have no sympathy with the inconsistency of the men who by patronising such, pull Presbyterianism down with the one hand while they build it up with the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-kennedy.html">James Kennedy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tekel. The Reformed Presbyterian Church and the General Assembly of the Presbyterian Church in Ireland weighed in the balance of truth</cite>, (Londonderry, 1858), pp 24-5.</span></figcaption>

<blockquote><p>[F]alse theology will be (3) apart from Christ, that is, not teaching the words about Christ, for which reason heathenism, Judaism, and Islam fail, since they do not hold to the words about Christ. Or, it will be (4) insufficiently “according to godliness,” which is especially problematic for the schismatic theology of the Lutherans and Arminians, since they either excessively extol man and his will, his works, his perfection, and disparage God’s grace and mercy in Christ – which Arminianism does along with the Pelagians, papists, and Socinians – or they present an opportunity for despairing by setting up, in their teaching on absolute perfection and the total apostasy of the saints, perpetual doubts about salvation.

Even Lutheranism participates in this last error: along with what was just pointed out, at least regarding the total apostasy of the saints, they also give rein to carnal security either by a universal grace of God, a universal satisfaction of Christ – which they apply to all equally, for which reason, with the rest, the Lutheran faith is especially troubled – or by widening the path of salvation, which agrees little with either the justice or mercy of God. In this way, by setting mercy against justice, Lutheranism follows the Socinian path to its own ruin.</p></blockquote>

<blockquote><p>Objections to Postmillennialism. There are some very serious objections to the Postmillennial theory. a. The fundamental idea of the doctrine, that the whole world will gradually be won for Christ, that the life of all nations will in course of time be transformed by the gospel, that righteousness and peace will reign supreme, and that the blessings of the Spirit will be poured out in richer abundance than before, so that the Church will experience a season of unexampled prosperity just before the coming of the Lord,—is not in harmony with the picture of the end of the ages found in Scripture. The Bible teaches indeed that the gospel will spread throughout the world and will exercise a beneficent influence, but does not lead us to expect the conversion of the world, either in this or in a coming age. It stresses the fact that the time immediately preceding the end will be a time of great apostasy, of tribulation and persecution, a time when the faith of many will wax cold, and when they who are loyal to Christ will be subjected to bitter sufferings, and will in some cases even seal their confession with their blood, Matt. 24:6–14, 21, 22; Luke 18:8; 21:25–28; 2 Thess. 2:3–12; 2 Tim. 3:1–6; Rev. 13. Postmillennialists, of course, cannot very well ignore entirely what is said about the apostasy and the tribulation that will mark the end of history, but they minimize it and represent it as predicting an apostasy and a tribulation on a small scale, which will not affect the main course of the religious life. Their expectation of a glorious condition of the Church in the end, is based on passages which contain a figurative description, either of the gospel dispensation as a whole, or of the perfect bliss of the external Kingdom of Jesus Christ. b. The related idea, that the present age will not end in a great cataclysmic change, but will pass almost imperceptibly into the coming age, is equally un-Scriptural. The Bible teaches us very explicitly that a catastrophe, a special intervention of God, will bring the rule of Satan on earth to an end, and will usher in the Kingdom that cannot be shaken, Matt. 24:29–31, 35–44; Heb. 12:26, 27; 2 Pet. 3:10–13. There will be a crisis, a change so great that it can be called “the regeneration,” Matt. 19:28. No more than believers are progressively sanctified in this life until they are practically ready to pass, without much more change, into heaven, will the world gradually be purified and thus made ready to enter upon the next stage. Just as believers must still undergo a great change at death, so must the world suffer a tremendous change when the end comes. There will be a new heaven and a new earth, Rev. 21:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Grand Rapids: Eerdmans, 1942), 718</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Objections to Postmillennialism. There are some very serious objections to the Postmillennial theory. a. The fundamental idea of the doctrine, that the whole world will gradually be won for Christ, that the life of all nations will in course of time be transformed by the gospel, that righteousness and peace will reign supreme, and that the blessings of the Spirit will be poured out in richer abundance than before, so that the Church will experience a season of unexampled prosperity just before the coming of the Lord,—is not in harmony with the picture of the end of the ages found in Scripture. The Bible teaches indeed that the gospel will spread throughout the world and will exercise a beneficent influence, but does not lead us to expect the conversion of the world, either in this or in a coming age. It stresses the fact that the time immediately preceding the end will be a time of great apostasy, of tribulation and persecution, a time when the faith of many will wax cold, and when they who are loyal to Christ will be subjected to bitter sufferings, and will in some cases even seal their confession with their blood, Matt. 24:6–14, 21, 22; Luke 18:8; 21:25–28; 2 Thess. 2:3–12; 2 Tim. 3:1–6; Rev. 13. Postmillennialists, of course, cannot very well ignore entirely what is said about the apostasy and the tribulation that will mark the end of history, but they minimize it and represent it as predicting an apostasy and a tribulation on a small scale, which will not affect the main course of the religious life. Their expectation of a glorious condition of the Church in the end, is based on passages which contain a figurative description, either of the gospel dispensation as a whole, or of the perfect bliss of the external Kingdom of Jesus Christ. b. The related idea, that the present age will not end in a great cataclysmic change, but will pass almost imperceptibly into the coming age, is equally un-Scriptural. The Bible teaches us very explicitly that a catastrophe, a special intervention of God, will bring the rule of Satan on earth to an end, and will usher in the Kingdom that cannot be shaken, Matt. 24:29–31, 35–44; Heb. 12:26, 27; 2 Pet. 3:10–13. There will be a crisis, a change so great that it can be called “the regeneration,” Matt. 19:28. No more than believers are progressively sanctified in this life until they are practically ready to pass, without much more change, into heaven, will the world gradually be purified and thus made ready to enter upon the next stage. Just as believers must still undergo a great change at death, so must the world suffer a tremendous change when the end comes. There will be a new heaven and a new earth, Rev. 21:1.”

— Louis Berkhof, Systematic Theology, (Grand Rapids: Eerdmans, 1942), 718">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObjections+to+Postmillennialism.+There+are+some+very+serious+objections+to+the+Postmillennial+theory.+a.+The+fundamental+idea+of+the+doctrine%2C+that+the+whole+world+will+gradually+be+won+for+Christ%2C+that+the+life+of+all+nations+will+in+course+of+time+be+transformed+by+the+gospel%2C+that+righteousness+and+peace+will+reign+supreme%2C+and+that+the+blessings+of+the+Spirit+will+be+poured+out+in+richer+abundance+than+before%2C+so+that+the+Church+will+experience+a+season+of+unexampled+prosperity+just+before+the+coming+of+the+Lord%2C%E2%80%94is+not+in+harmony+with+the+picture+of+the+end+of+the+ages+found+in+Scripture.+The+Bible+teaches+indeed+that+the+gospel+will+spread+throughout+the+world+and+will+exercise+a+beneficent+influence%2C+but+does+not+lead+us+to+expect+the+conversion+of+the+world%2C+either+in+this+or+in+a+coming+age.+It+stresses+the+fact+that+the+time+immediately+preceding+the+end+will+be+a+time+of+great+apostasy%2C+of+tribulation+and+persecution%2C+a+time+when+the+faith+of+many+will+wax+cold%2C+and+when+they+who+are+loyal+to+Christ+will+be+subjected+to+bitter+sufferings%2C+and+will+in+some+cases+even+seal+their+confession+with+their+blood%2C+Matt.+24%3A6%E2%80%9314%2C+21%2C+22%3B+Luke+18%3A8%3B+21%3A25%E2%80%9328%3B+2+Thess.+2%3A3%E2%80%9312%3B+2+Tim.+3%3A1%E2%80%936%3B+Rev.+13.+Postmillennialists%2C+of+course%2C+cannot+very+well+ignore+entirely+what+is+said+about+the+apostasy+and+the+tribulation+that+will+mark+the+end+of+history%2C+but+they+minimize+it+and+represent+it+as+predicting+an+apostasy+and+a+tribulation+on+a+small+scale%2C+which+will+not+affect+the+main+course+of+the+religious+life.+Their+expectation+of+a+glorious+condition+of+the+Church+in+the+end%2C+is+based+on+passages+which+contain+a+figurative+description%2C+either+of+the+gospel+dispensation+as+a+whole%2C+or+of+the+perfect+bliss+of+the+external+

<main class="wrap"><figure class="quote" id="q-833ea0c68f" data-kw="">
<blockquote><p>They that shall adventure to bring into the city and to sell things forbidden are worthily to be punished with the loss of the things themselves. The same punishment is to be laid upon the buyers, if they yet now have with them the things whole and untouched: otherwise let the punishment be equal unto the price of the things. He that is found selling of profitable things, as meats or drinks, in any other place than in the place appointed, let him bear the loss of all that he sets to sale. Whosoever of his own private authority shall covetously increase the price of things sellable above that [which] is reasonable or above the appointed rate, let him be under the punishment of unlawful usuries, and for a time forbidden to occupy any more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection in the Time of the Plague or Pestilence, Two Books</cite>, (London, 1583), bk. 2, ch. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-292947d1fe" data-kw="">
<blockquote><p>From the Council Registers we see that the plague made its appearance at Geneva in 1542, and that during several years it made great ravages in the town and throughout the whole territory of Savoy. The number of sick was immense. It was almost certain death to visit them. Three ministers offered spontaneously to discharge that duty: Calvin, Sebastian Castalio, and Blanchet. Castalio, who was the first person designated by lot, appears to have declined that perilous honour. Banchet generously made the sacrifice of his life; and the urgent solicitations of the Seigneury of Geneva, who were afraid to expose the valuable life of the Reformer, could alone determine Calvin to desist from undertaking the charge which he bad himself solicited.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geneva.html">Jules Bonnet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters of John Calvin</cite>, ed. Jules Bonnet</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-d88f5496f0" data-kw="">
<blockquote><p>May 21, 1585 Wilsoun, Russell, Walker, put to Assize. Finds expedient that Thomas Wilsoun, traveler, presently infected with the pest[ilence] and in point of death, and also Margaret Russell and Jonet Walker, her daughter, be incontinent [not containing themselves] put to the knowledge of an assize [judgment] for having of the pest and known the same concealing thereof and repairing amongst our Sovereign Lord’s lieges [lands] openly, to the infection of some and hazard of many, and being found culpable in any point of the premises, to be immediately execut[ed] to the death at the Stray Mercat. … May 28, 1585 Masters of the College. The bailies and a part of the council being convened, and understanding be master Robert Rollock and master Duncane Nairne, masters of the College, that the whole students, through the fire and brute of the pestilence, has left the schools and thereby they have nothing to do, desiring therefore licence of the town to depart and use their friends for a season, offering to return to their cuir [chair?] and service whensoever the town shall think expedient, upon advertisement to be made in their names be master Alexander Guthre, their clerk. Which desire the said bailies and council thought reasonable, and therefore willingly granted and consented thereto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/city-of-edinburgh.html">City of Edinburgh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Plague records</cite>, (see citation)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-1ee9e51e3f" data-kw="">
<blockquote><p>…The reader will see that I only declared my dislike of organs in our churches, and therein I think I have better authority than those that are of another mind, forasmuch as in the Homily of the Place and time of Prayer (a book established and enjoined by the laws of the land) p. 131, they bring in some superstitious persons, complaining that they could not “hear the like piping, singing, chanting and playing upon the organs, that they could before”: To this is immediately answered thus; “But (dearly beloved) we ought greatly to rejoice and to give thanks to God, that our Churches are delivered out of those things which displeased God so sore, and filthily defiled his holy House”…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evangelical Worship is Spiritual Worship as it was Discussed in a Sermon</cite>, (1660) | To the Reader</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-079c9d00ef" data-kw="">
<blockquote><p>The Jewish way under the law of praising the Lord was upon the timbrel, the harp, psaltery, and ten-stringed instruments, and other instruments of music that belonged to ceremonial worship that is now abolished. Christ, who is the end of the law, has torn or taken away the ceremonies of the law, and there is no warrant now to make use of the organs, as they do in the Popish Church, and in the Prelatical Church of England, and even among them that are more reformed, those over in Holland. Oh, but we have a great advantage in being free of these! But there are some in the other extreme, that are for no music at all, but we are to sing and praise vocally, and with the heart too. This reproves Quakers, who make a mock at singing of psalms. But we will let them see a fine ancient warrant for vocal music. “And be not drunk with wine… speaking to yourselves in psalms, hymns, and spiritual songs, making melody in your hearts to the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cameron.html">Richard Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Lecture 2’ on Ps. 92, in Sermons Delivered in Times of Persecution in Scotland</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><figure class="quote" id="q-0de4a92ab0" data-kw="">
<blockquote><p>If the apostle justly prohibits the use of unknown tongues in the Church, much less would he have tolerated these artificial musical performances, which are addressed to the ear alone, and seldom strike the understanding, even of the performers themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As quoted by Dr. Porteous, The Organ Question</cite>, p. 45</span></figcaption>

</figure><figure class="quote" id="q-830945a23e" data-kw="">
<blockquote><p>Lastly, God’s spirit works not with ceremonies, and so they are as the offering of swines’ blood and the slaying of a man; and so abomination to God, Isa. 66:3. 2. The Holy Spirit is merited to us by Christ, Jn. 16:14, “He shall receive of mine and show unto you”: but who can say that the grace of joy in the Holy Ghost, wrought by the droning of organs and the holiness taught by surplice, is a work of the spirit merited by Christ as our High Priest? 3. God has made no promise that He will work by ceremonies, for the Spirit works not without the Word; so then I might resist the working of the Spirit and not sin against the Word; and this is Anabaptists’ Enthusiasm: If God work not by them, they be vain and fruitless; and the idol is unlawful for this [reason], that ‘it profits not’. Also, the Spirit’s action is either natural or supernatural here: If natural, it is a natural work, and a natural spirit, and to be rejected: If supernatural, we may devise means to produce supernatural effects: men’s ceremonies can produce supernatural joy, comfort, peace, and acts of grace purchased to us by Christs merit; this is a miracle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), Question 3, ‘Whether Ceremonies Have any Divinity in Them’, p. 136</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><figure class="quote" id="q-ee2867da8e" data-kw="">
<blockquote><p>This cathedral music introduces to the Church of God a rabble of church-officers which the Lord never appointed, and which never came into His heart, the choristers and singing-men, and that is a very great evil. It is not in the power of men, but it is the great prerogative of Jesus Christ to appoint officers in His church who has appointed none but pastors and teachers, elders and deacons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-mather.html">Samuel Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Figures or Types of the Old Testament by which Christ and the heavenly things of the Gospel were preached and shadowed to the people of God of old</cite>, (Dublin, 1683), pp. 547-53 of ‘The Gospel of the Feast of Trumpets’; p. 440</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

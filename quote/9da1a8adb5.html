<main class="wrap"><figure class="quote" id="q-9da1a8adb5" data-kw="">
<blockquote><p>Their [Israel’s] Political Constitution was Monarchical, Aristocratical, and Democratical: and therefore most prudently and perfectly composed. 1. Monarchical, In that God would still have it Governed by One, as Supreme; viz. First by Moses, then by Joshua, then by Judges, then by Kings, then by Princes and Governors after the Captivity: The raising up and erecting of which Supreme Rulers, God reserved still to himself as Supreme over all.

2. Aristocratical. In that seventy chief, wise, understanding, and known men among their tribes were as Princes set over them as assistants to the Supreme Governor, Moses, &amp;c. 3. Democratical, In that these chief Heads were chosen by the people themselves out of every Tribe. This was the form of their Polity; the best form, and most excellently composed, for preventing of Anarchy, Popular Confusions and Divisions, Arbitrariness, and Tyranny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mystery and Marrow of the Bible: God’s Covenants with Man</cite>, (London: George Calvert, 1657), 3.4.1.2.3, p. 674.</span></figcaption>

<blockquote><p>In the second place, let us refer to the right inherent in the Church of Christ to propagate the Gospel, and make disciples in every country and nation under heaven. This right, claimed by the Church, and belonging to her in consequence of the duty enjoined by her Head, is a right of such a nature, that it cannot properly consist with the neutrality of the civil magistrate, or be recognised by any state constituted on the principle that it has nothing to do with religion.

The full and free and unrestricted power to take possession of this world in the name of Christ, to the exclusion of any other form of faith and worship, is what Christianity demands: with less than this it cannot be satisfied. And yet it may well be doubted whether it be consistent with the principle and practice of absolute neutrality on the part of the state to concede this demand, or whether a toleration for the truth, founded on the theory of entire impartiality and indifference as regards truth and falsehood, is sufficient to protect the Church of Christ in its exclusive claims.

The Gospel of Christ is not, like the systems of polytheism among which it was introduced at first, compatible with every other system of falsehood. It is exclusive in its character and pretensions; and demands that it be received and owned and submitted to, to the abandonment and rejection of every other faith. Christ Himself tells us that He came to send on the earth, “not peace, but a sword,” not ease, but “a burning fire;” and, like a sword, His Gospel divides asunder the outward and formal union of human society, and, like a fire, it kindles strife and division in the world.

There is so much in the Gospel fitted to awaken the hostility of the human heart, and standing in direct opposition to the principles and practices of the world, that it cannot but act as a firebrand wherever it enters. To introduce and propagate it, therefore, in any community, tends not indirectly to excite the rage and outrage and violence of men. More than this: its first principle and first duty is that of aggression.

The ministers of the Gospel claim it as a right to go into every nation, however fenced around and guarded from intrusion, and to demand an entrance in the name of Him who sent them, even although the magistrate should bid them depart from his coasts. Further still, the messengers of the Cross arrogate to themselves the title to enter into every human dwelling where a sinner is to be found,-seeking admittance in the name of the Saviour of sinners, that they may negotiate with the inhabitant in behalf of their Master, however sternly the door may be closed against them by jealousy of their errand, or hatred to their cause.

It has been the eloquent boast of freedom in our country, that every man’s house is his castle; and that, be it but a strawbuilt shed, open to every breath of heaven, yet fenced about by the protection and the sanction of law, there even “the king cannot and dare not enter.” But where the king cannot enter, there the missionary of Christ claims to be admitted; and, with a higher warrant in his hand than that of human law, bids the gates be lifted up, that with the Gospel he may enter in. And can claims and pretensions so essentially exclusive and aggressive, which belong from its very nature to Christianity, be owned and conceded by a state constituted on the principle of entire and equal indifference to truth and falsehood?

Is it, in the nature of things, possible, in regard to such demands, to profess or carry out the theory of neutrality in civil legislation, granting a licence free and full to Christianity, intolerant as it is of every other religion? Ask the Roman magistrate within whose jurisdiction the Gospel was at first preached, or the magistrate of any country not Christian within whose rule Christianity is introduced at the present day. For the first three hundred years of its existence the religion of Christ was in almost perpetual collision with the state, just on the ground that it was essentially a missionary and an exclusive religion, that it would not, and could not, exist in peace alongside of any other faith, that its temples must stand alone, and its Deity find no place in the Pantheon. Nor has the essential character of Christianity altered since the days of Nero and Diocletian.

Upon the principle of complete indifference to truth and to falsehood, it were difficult to argue or assert that any government could or ought to protect, or give place by civil permission to, a religion framed upon a principle so intolerant, and proceeding in a manner so aggressive. With no other right to toleration than the right which falsehood equally has, it were a matter of question whether the preaching of the truth as it is in Jesus, and the full claims of an exclusive kind which it makes, ought to be granted by any state.

At all events, waiving the question of right, we know that, in the history of the world, it has been found impossible in point of fact for any state not Christian to grant them; and that, in the person of a magistrate not a friend to the Gospel, we have, from the very necessity of the case, to deal with an enemy and a persecutor, whether that magistrate be a philosopher, like Pliny, or “the father of his people,” like Marcus Antoninus.</p></blockquote>

<blockquote><p>And kings shall be thy nursing fathers. After having spoken of the obedience of the Gentiles, he shews that this relates not to the common people only, but to “kings” also. He compares “kings” to hired men who bring up the children of others, and “queens” to “nurses,” who give out their labour for hire. Why so? Because “kings” and “queens” shall supply everything that is necessary for nourishing the offspring of the Church.

Having formerly driven out Christ from their dominions, they shall henceforth acknowledge him to be the supreme King: and shall render to him all honour, obedience, and worship. This took place when the Lord revealed himself to the whole world by the Gospel; for mighty kings and princes not only submitted to the yoke of Christ, but likewise contributed their riches to raise up and maintain the Church of Christ, so as to be her guardians and defenders.

Hence it ought to be observed that something remarkable is here demanded from princes, besides an ordinary profession of faith; for the Lord has bestowed on them authority and power to defend the Church and to promote the glory of God. This is indeed the duty of all; but kings, in proportion as their power is greater, ought to devote themselves to it more earnestly, and to labour in it more diligently. And this is the reason why David expressly addresses and exhorts them to “be wise, and serve the Lord, and kiss his Son.” (Ps. ii. 10-12.)

This shews how mad are the dreams of those who assert that kings cannot be Christians without laying aside that office; for those things were accomplished under Christ, when kings, who had been converted to God by the preaching of the Gospel, obtained this highest pinnacle of rank, which surpasses dominion and principality of every sort, to be “nursing-fathers” and guardians of the Church.

The Papists have no other idea of kings being “nursing-fathers” of the Church than that they have left to their priests and monks very large revenues, rich possessions and prebends, on which they might fatten, like hogs in a sty. But that “nursing” aims at an object quite different from filling up those insatiable gulls. Nothing is said here about enriching the houses of those who, under false pretences, hold themselves out to be ministers of the Church, (which was nothing else than to corrupt the Church of God and to destroy it by deadly poison,) but about removing superstitions and putting an end to all wicked idolatry, about advancing the kingdom of Christ and maintaining purity of doctrine, about purging scandals and cleansing from the filth that corrupts piety and impairs the lustre of the Divine majesty.

Undoubtedly, while kings bestow careful attention on these things, they at the same time supply the pastors and ministers of the Word with all that is necessary for food and maintenance, provide for the poor and guard the Church against the disgrace of pauperism; erect schools, and appoint salaries for the teachers and board for the students; build poor-houses and hospitals, and make every other arrangement that belongs to the protection and defense of the Church. But those unnecessary and extravagant expenses for Anniversaries and Masses, for golden vessels and costly robes, which swell the pride and insolence of papists, serve only to uphold pomp and ambition, and corrupt the pure and simple “nursing” of the Church, and even choke and extinguish the seed of God, by which alone the Church lives.

When we see that matters are now very different, and that “kings” are not the “nursing-fathers,” but the executioners of the Church; when, in consequence of taking away the doctrine of piety and banishing its true ministers, idle bellies, insatiable whirlpools, and messengers of Satan, are fattened, (for such are the persons to whom the princes cheerfully distribute their wealth, that is, the moisture and blood which they have sucked out of the people;) when even princes otherwise godly have less strength and firmness for defending the Word and upholding the Church; let us acknowledge that this is the reward due to our sins, and let us confess that we do not deserve to have good “nursing-fathers.” But yet, after this frightfully ruinous condition, we ought to hope for a restoration of the Church, and such a conversion of kings that they shall shew themselves to be “nursing-fathers” and protectors of believers, and shall bravely defend the doctrine of the Word.

And shall lick the dust of thy feet. This passage is also tortured by the Papists in order to uphold the tyranny of their idol, as if kings and princes had no other way of proving themselves to be sincere and lawful worshippers of God than by adoring that masked prince of the Church instead of God. Thus they consider the obedience of piety to consist in kissing the Pope’s feet with deep reverence. What they ought to think of such barbarous and idolatrous worship, let them learn, first, from Peter, whose seat they boast of occupying, who would not permit such honour to be rendered to him by the centurion. (Acts x. 26.) Let them, next, learn from Paul, who tore his garments, and rejected such worship with the utmost abhorrence. (Acts xiv.14.)

What could be more absurd than to imagine that the Son of God appointed, instead of a minister of the Gospel, an object of abhorrence, some king dazzling in Persian luxury and splendour? But let us remember that the Church, so long as she is a pilgrim in this world, is subjected to the cross, that she may be humble and may be conformed to her Head; that if her foes make any cessation of their hostility, still her highest ornament and lustre is modesty. Hence it follows, that she has laid aside her own attire, when she is clothed with irreligious pride.

Here the Prophet means nothing else than the adoration by which princes bow down before God, and the obedience which they render to his Word in the Church. What we have already said must be carefully observed, that, when we speak of rendering honour to the Church, she must never be separated from the Head; for this honour and worship belongs to Christ, and, when it is bestowed on the Church, it still continues to belong undivided to him alone. By the obedience of piety kings do not profess submission, so as to bear the yoke of men, but to yield to the doctrine of Christ. Whosoever therefore rejects the ministry of the Church, and refuses to bear the yoke which God wishes to lay with his own hand on all his people, can neither have any fellowship with Christ nor be a child of God.</p></blockquote>

<blockquote><p>A spiritual prayer is accompanied with the use of means… When Hezekiah was sick, he did not only pray for recovery, but he laid a lump of figs to the boil, Isa. 38:21. Thus it is in case of the soul, when we pray against sin, and avoid temptations; when we pray for grace, and improve opportunities, this is the laying a fig to the boil, which will make us recover: To pray for holiness, and neglect the means, is like winding up the clock, and pulling off the weights.</p></blockquote>

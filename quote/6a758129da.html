<blockquote><p>The passages are these:— He was thirty years old when he came up to be baptized. Then, when he had the mature age of a teacher, he came to Jerusalem, so that all would reasonably accept him as a teacher. For he did not appear to be one thing while he was another, as those say who introduce him as a man only in appearance. He actually was what he appeared to be. So, when he was teacher, he also had the age of a teacher. He did not reject human nature or exalt himself above it, nor did he abrogate in himself his own law [given in behalf] of the human race; but he sanctified every age by a likeness to himself. Surely, he came to save all people through himself; I say all who would again be born to God—infants, children, youth, young adults, elderly. Therefore, he passed through every age. Becoming an infant among infants, he sanctified infants; becoming a child among children, he sanctified those having this age and at the same time became for them an example of piety and righteousness and obedience; becoming a young adult among young adults, he was an example for young adults and sanctified them to the Lord. In the same way, he became also an elderly person among the elderly, so that he might be a mature teacher for all, not merely by explaining the truth but also by his age, that is, by at the same time sanctifying the elderly and being an example for them. Lastly, he came even to death so that he might be the Firstborn from the dead, himself holding the primacy in all things, the Author of life, prior to all and going before all.1 [Book. 1. ch. 21. sect. 1]: The tradition about their redemption turns out to be invisible and incomprehensible, inasmuch as this is the mother of the incomprehensible and invisible beings.1 And so it is unstable and cannot be told simply or in one word, because each one of them hands it down just as he wishes. For there are as many redemptions as there are mystery-teachers of this doctrine. When in the proper place we shall expose them, we shall tell how this false picture was injected by Satan in order to deny the baptism of rebirth unto God, and to destroy the entire faith.2 Mr Tombs tells us, “This proves not infant baptism, because though it be granted that in Justin Martyr, and others of the ancients, to be regenerated is to be baptized, yet it doth not appear that Irenæus meant it so in this place, unless it were proved it is so only meant by him and the ancients. Nor doth Irenæus, lib. i. cap. xviii., term baptism ‘regeneration;’ but saith thus, ‘To the denying of baptism of that regeneration which is unto God.’ But that indeed the word ‘renascuntur,’ ‘are born again,’ is not meant of baptism is proved from the words and the scope of them; for,— “1. The words are, ‘Per eum renascuntur,’ ‘By him,’ that is, Christ, ‘are born again.’ And it is clear, from the scope of the speech about the fulness of his age, as a perfect master, that ‘By him’ notes his person according to his human nature. Now, if then, ‘By him are born again,’ be as much as ‘By him are baptized,’ this should be Irenæus assertion, that by Christ himself, in his human body, infants, and little ones, and boys, and young men, and elder men, are baptized unto God. But this speech is most manifestly false; for neither did Christ baptize any at all in his own person, (John 4:1, 2, ‘Jesus himself baptized not, but his disciples,’) nor did the disciples baptize any infant at all, as may be gathered from the whole New Testament. “2. The word which Irenæus expresseth whereby persons are born again to God by Christ is applied to the example of his age, as the words and scope show. But he was not in his age an example of every age by his baptism, as if he did by it sanctify every age, for then he should have been baptized in every age; but in respect of the holiness of his human nature, which did remain each age, and so exemplarily sanctify each age to God, so as that there was no age but was capable of holiness by conformity to his example. “3. Irenæus’ words are, ‘Omnes enim venit per semetipsum salvare, omnes, inquam, qui per eum renascuntur in Deum, infantes, et parvulos,’ etc. Now, if the meaning were, that Christ came to save all that were baptized by him or by his appointment, then he came to save Simon Magus, or whoever are or have been baptized rightly. But in that sense the proposition is most palpably false; and therefore that sense is not to be attributed to his words. “4. Christ is by Irenæus said to sanctify as ‘a perfect master,—not only according to the exposition of truth, but also as an example to them of piety, justice, and subjection.’ But this is to be understood not in respect of his baptism only, but his whole life, in which he was an example; even as an infant, for then he did willingly empty himself,—‘Took upon him the form of a servant,’ etc., Phil. 2:7, 8. “By all which reasons,” saith Mr Tombs, “I presume the readers who are willing to see truth will perceive this passage of Irenæus to be wrested by Pedobaptists against its meaning, to prove a use of pedobaptism in his time.” Ans.

1. The phrase of “Renascuntur in Deum” is so constantly I used by the ancients for baptism that it may be referred to the conscience of Mr Tombs or any one who hath been conversant in their writings, whether they would not have judged and granted that it was here intended, if mention had not been made of infants and little ones. The ensuing exceptions, therefore, are an endeavour to stifle light in favour of an opinion;—which is not unusual with some. Ans.

2. “Per eum” is the same with “Per semetipsum,” in the words immediately foregoing; that is, “By himself,” in his mediation, grace, and ordinances. And to suppose that if baptism be intended, he must baptize them in his own person, is a mere cavil; for all that are born to God by baptism to this day are so by him. Ans.

3. The words, Εἰς ἐξάρνησιν τοῦ βαπτίσματος τῆς εἰς Θεὸν ἀναγεννήσεως, “Unto the denial of the baptism of regeneration unto God,” do plainly declare that by “renascuntur” he intends the baptism of regeneration, as being the means and pledge of it, in allusion to that of the apostle, Λούτρον παλιγγενεσίας, Tit. 3:5. Ans.

4. It is remarkable in the words of Irenæus, that in expressing the way and means of the renascency of infants, he mentions nothing of the example of Christ, which he adds unto that of all other ages. Ans.

5. The example of Christ is mentioned as one outward means of the regeneration of them who were capable of its use and improvement. Of his being an example of baptism nothing is spoken. Nor was Christ in his own person an example of regeneration unto any; for as he was not baptized in all ages, so he was never regenerated in any, for he needed no regeneration. Ans.

6. It is well that it is so positively granted that Christ doth sanctify infants; which, seeing he doth not do so to all universally, must be those of believing parents; which is enough to end this controversy. Ans.

7. The meaning of Irenæus is no more but that Christ, passing through all ages, evidenced his design to exclude no age, to communicate his grace unto all sorts and ages; and he mentioneth old men, because his judgment was that Christ was fifty years old when he died. Ans.

8. It was the constant opinion of the ancients that Christ came to save all that were baptized; not intending his purpose and intention with respect unto individuals, but his approbation of the state of baptism, and his grant of the means of grace.</p></blockquote>

nd+invisible+beings.1+And+so+it+is+unstable+and+cannot+be+told+simply+or+in+one+word%2C+because+each+one+of+them+hands+it+down+just+as+he+wishes.+For+there+are+as+many+redemptions+as+there+are+mystery-teachers+of+this+doctrine.+When+in+the+proper+place+we+shall+expose+them%2C+we+shall+tell+how+this+false+picture+was+injected+by+Satan+in+order+to+deny+the+baptism+of+rebirth+unto+God%2C+and+to+destroy+the+entire+faith.2+Mr+Tombs+tells+us%2C+%E2%80%9CThis+proves+not+infant+baptism%2C+because+though+it+be+granted+that+in+Justin+Martyr%2C+and+others+of+the+ancients%2C+to+be+regenerated+is+to+be+baptized%2C+yet+it+doth+not+appear+that+Iren%C3%A6us+meant+it+so+in+this+place%2C+unless+it+were+proved+it+is+so+only+meant+by+him+and+the+ancients.+Nor+doth+Iren%C3%A6us%2C+lib.+i.+cap.+xviii.%2C+term+baptism+%E2%80%98regeneration%3B%E2%80%99+but+saith+thus%2C+%E2%80%98To+the+denying+of+baptism+of+that+regeneration+which+is+unto+God.%E2%80%99+But+that+indeed+the+word+%E2%80%98renascuntur%2C%E2%80%99+%E2%80%98are+born+again%2C%E2%80%99+is+not+meant+of+baptism+is+proved+from+the+words+and+the+scope+of+them%3B+for%2C%E2%80%94+%E2%80%9C1.+The+words+are%2C+%E2%80%98Per+eum+renascuntur%2C%E2%80%99+%E2%80%98By+him%2C%E2%80%99+that+is%2C+Christ%2C+%E2%80%98are+born+again.%E2%80%99+And+it+is+clear%2C+from+the+scope+of+the+speech+about+the+fulness+of+his+age%2C+as+a+perfect+master%2C+that+%E2%80%98By+him%E2%80%99+notes+his+person+according+to+his+human+nature.+Now%2C+if+then%2C+%E2%80%98By+him+are+born+again%2C%E2%80%99+be+as+much+as+%E2%80%98By+him+are+baptized%2C%E2%80%99+this+should+be+Iren%C3%A6us+assertion%2C+that+by+Christ+himself%2C+in+his+human+body%2C+infants%2C+and+little+ones%2C+and+boys%2C+and+young+men%2C+and+elder+men%2C+are+baptized+unto+God.+But+this+speech+is+most+manifestly+false%3B+for+neither+did+Christ+baptize+any+at+all+in+his+own+person%2C+%28John+4%3A1%2C+2%2C+%E2%80%98Jesus+himself+baptized+not%2C+but+his+disciples%2C%E2%80%99%29+nor+did+the+disciples+baptize+any+infant+at+all%2C+as+may+be+gathered+from+the+whole+New+Testament.+%E2%80%9C2.+The+word+which+Iren%C3%A6us+expresseth+whereby+persons+are+born+again+to+God+by+Christ+is+applied+to+the+example+of+his+age%2C+as+the+words+and+scope+show.+But+he+was+not+in+his+age+an+example+of+every+age+by+his+baptism%2C+as+if+he+did+by+it+sanctify+every+age%2C+for+then+he+should+have+been+baptized+in+every+age%3B+but+in+respect+of+the+holiness+of+his+human+nature%2C+which+did+remain+each+age%2C+and+so+exemplarily+sanctify+each+age+to+God%2C+so+as+that+there+was+no+age+but+was+capable+of+holiness+by+conformity+to+his+example.+%E2%80%9C3.+Iren%C3%A6us%E2%80%99+words+are%2C+%E2%80%98Omnes+enim+venit+per+semetipsum+salvare%2C+omnes%2C+inquam%2C+qui+per+eum+renascuntur+in+Deum%2C+infantes%2C+et+parvulos%2C%E2%80%99+etc.+Now%2C+if+the+meaning+were%2C+that+Christ+came+to+save+all+that+were+baptized+by+him+or+by+his+appointment%2C+then+he+came+to+save+Simon+Magus%2C+or+whoever+are+or+have+been+baptized+rightly.+But+in+that+sense+the+proposition+is+most+palpably+false%3B+and+therefore+that+sense+is+not+to+be+attributed+to+his+words.+%E2%80%9C4.+Christ+is+by+Iren%C3%A6us+said+to+sanctify+as+%E2%80%98a+perfect+master%2C%E2%80%94not+only+according+to+the+exposition+of+truth%2C+but+also+as+an+example+to+them+of+piety%2C+justice%2C+and+subjection.%E2%80%99+But+this+is+to+be+understood+not+in+respect+of+his+baptism+only%2C+but+his+whole+life%2C+in+which+he+was+an+example%3B+even+as+an+infant%2C+for+then+he+did+willingly+empty+himself%2C%E2%80%94%E2%80%98Took+upon+him+the+form+of+a+servant%2C%E2%80%99+etc.%2C+Phil.+2%3A7%2C+8.+%E2%80%9CBy+all+which+reasons%2C%E2%80%9D+saith+Mr+Tombs%2C+%E2%80%9CI+presume+the+readers+who+are+willing+to+see+truth+will+perceive+this+passage+of+Iren%C3%A6us+to+be+wrested+by+Pedobaptists+against+its+meaning%2C+to+prove+a+use+of+pedobaptism+in+his+time.%E2%80%9D+Ans.+1.+The+phrase+of+%E2%80%9CRenascuntur+in+Deum%E2%80%9D+is+so+constantly+I+used+by+the+ancients+for+baptism+that+it+may+be+referred+to+the+conscience+of+Mr+Tombs+or+any+one+who+hath+been+conversant+in+their+writings%2C+whether+they+would+not+have+judged+and+granted+that+it+was+here+intended%2C+if+mention+had+not+been+made+of+infants+and+little+ones.+The+ensuing+exceptions%2C+therefore%2C+are+an+endeavour+to+stifle+light+in+favour+of+an+opinion%3B%E2%80%94which+is+not+unusual+with+some.+Ans.+2.+%E2%80%9CPer+eum%E2%80%9D+is+the+same+with+%E2%80%9CPer+semetipsum%2C%E2%80%9D+in+the+words+immediately+foregoing%3B+that+is%2C+%E2%80%9CBy+himself%2C%E2%80%9D+in+his+mediation%2C+grace%2C+and+ordinances.+And+to+suppose+that+if+baptism+be+intended%2C+he+must+baptize+them+in+his+own+person%2C+is+a+mere+cavil%3B+for+all+that+are+born+to+God+by+baptism+to+this+day+are+so+by+him.+Ans.+3.+The+words%2C+%CE%95%E1%BC%B0%CF%82+%E1%BC%90%CE%BE%CE%AC%CF%81%CE%BD%CE%B7%CF%83%CE%B9%CE%BD+%CF%84%CE%BF%E1%BF%A6+%CE%B2%CE%B1%CF%80%CF%84%CE%AF%CF%83%CE%BC%CE%B1%CF%84%CE%BF%CF%82+%CF%84%E1%BF%86%CF%82+%CE%B5%E1%BC%B0%CF%82+%CE%98%CE%B5%E1%BD%B8%CE%BD+%E1%BC%80%CE%BD%CE%B1%CE%B3%CE%B5%CE%BD%CE%BD%CE%AE%CF%83%CE%B5%CF%89%CF%82%2C+%E2%80%9CUnto+the+denial+of+the+baptism+of+regeneration+unto+God%2C%E2%80%9D+do+plainly+declare+that+by+%E2%80%9Crenascuntur%E2%80%9D+he+intends+the+baptism+of+regeneration%2C+as+being+the+means+and+pledge+of+it%2C+in+allusion+to+that+of+the+apostle%2C+%CE%9B%CE%BF%CF%8D%CF%84%CF%81%CE%BF%CE%BD+%CF%80%CE%B1%CE%BB%CE%B9%CE%B3%CE%B3%CE%B5%CE%BD%CE%B5%CF%83%CE%AF%CE%B1%CF%82%2C+Tit.+3%3A5.+Ans.+4.+It+is+remarkable+in+the+words+of+Iren%C3%A6us%2C+that+in+expressing+the+way+and+means+of+the+renascency+of+infants%2C+he+mentions+nothing+of+the+example+of+Christ%2C+which+he+adds+unto+that+of+all+other+ages.+Ans.+5.+The+example+of+Christ+is+mentioned+as+one+outward+means+of+the+regeneration+of+them+who+were+capable+of+its+use+and+improvement.+Of+his+being+an+example+of+baptism+nothing+is+spoken.+Nor+was+Christ+in+his+own+person+an+example+of+regeneration+unto+any%3B+for+as+he+was+not+baptized+in+all+ages%2C+so+he+was+never+regenerated+in+any%2C+for+he+needed+no+regeneration.+Ans.+6.+It+is+well+that+it+is+so+positively+granted+that+Christ+doth+sanctify+infants%3B+which%2C+seeing+he+doth+not+do+so+to+all+universally%2C+must+be+those+of+believing+parents%3B+which+is+enough+to+end+this+controversy.+Ans.+7.+The+meaning+of+Iren%C3%A6us+is+no+more+but+that+Christ%2C+passing+through+all+ages%2C+evidenced+his+design+to+exclude+no+age%2C+to+communicate+his+grace+unto+all+sorts+and+ages%3B+and+he+mentioneth+old+men%2C+because+his+judgment+was+that+Christ+was+fifty+years+old+when+he+died.+Ans.+8.+It+was+the+constant+opinion+of+the+ancients+that+Christ+came+to+save+all+that+were+baptized%3B+not+intending+his+purpose+and+intention+with+respect+unto+individuals%2C+but+his+approbation+of+the+state+of+baptism%2C+and+his+grant+of+the+means+of+grace.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+The+Works+of+John+Owen%2C+ed.+William+H.+Goold%2C+vol.+16+%28Edinburgh%3A+T%26T+Clark%2C+n.d.%29%2C+263%E2%80%9365.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6a758129da.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6a758129da.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/08/owen-versus-toombes-baptism/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>However, we do not therefore exclude form the fellowship of this sacrament those children who were born of Christian stock and baptized parents–even though their own parents through their wicked lives or impure faith cause the efficacy of the covenant sealed in their own baptism to be ineffective for themselves–if those same parents or the relatives who have authority over them present them for baptism according to the customary order in our churches. For in the new covenant the son does not bear the iniquity of the father, and of such children God remains God just the same, as He Himself bears witness in Ezekiel 16 and 23. There He calls the children of the godless Israelites his own sons, whom they had begotten for God, although they were sacrificing them to Molech. And it is from these children that God also normally gathers his church through the ordinary preaching of the Word. And for this reason he also commanded the children of such Israelites (of whom many had died in their ungodliness) to be circumcised, no less than those of the godly ones (Joshua 5:4 and 6)–which necessary deed also the Israelite and the early Christian church always have considered beyond debate.</p></blockquote>

<blockquote><p>First, all that belong to the covenant and church of God are to be baptized. But the children of christians, as well as adults, belong to the covenant and church of God. Therefore they are to be baptized as well as adults. The major proposition is proven from the command of Christ, which requires the whole church to be baptized. “Go, and teach all nations, baptizing them,” &amp;c. And Paul says: “By one Spirit are we all baptized into one body.” (1 Cor. 12:13.) The minor proposition is clear from the covenant itself in which God declares, “I will be a God unto thee and thy seed after thee:” and from what Christ says: “Suffer little children to come unto me; for of such is the kingdom of heaven.” (Gen. 17:7. Matt. 19:14.)</p></blockquote>

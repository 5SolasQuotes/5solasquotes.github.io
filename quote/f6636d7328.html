<main class="wrap"><figure class="quote" id="q-f6636d7328" data-kw="">
<blockquote><p>Now in these last days, Jesus Christ, the chief and most perfect Doctor and teacher of his Church being given to the world, taught the Apostles by mouth, &amp; ordained them teachers for his Church, which did publish in writing the doctrine of the Gospel received from Christ, &amp; by them taught by mouth. Sith then the word of God is the measure of our faith, &amp; that that word of God remaineth in the most holy monuments or writings of the scriptures, it followeth of necessity, that all the principles which are necessary to faith and salvation of the Church, are contained in the holy Scriptures: and whatsoever the Apostles have taught, we ought to look for them in the holy Scriptures: neither ought we to receive any tradition in matter of faith.

And because matters are made more manifest by similitudes, we will take our similitude from a King, which by mouth proclaimeth an Edict, &amp; then willeth the same to be printed, the which being done, men are not won’t curiously to enquire of others, which either heard or were present at the proclamation, what is contained in the King’s Edict, because the Edict is in print, to the which they must stand, and the which they must also believe. So then I affirm, in as much as the word was proclaimed and declared by the Apostles and evangelists, and by them committed to writing, it were in vain and foolish nowadays any other where to be sought, then in the Scriptures: what the Apostles and Evangelists did teach by mouth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antoine-de-chandieu.html">Antoine de Chandieu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise touching the Word of God written, against the traditions of men handled both school like, and divine like, where also is set down a true method to dispute divinely and school like</cite>, trans. John Coxe (London: John Harrison, 1583), pp 30-31.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c2bcea62c6" data-kw="">
<blockquote><p>XIII. The scripture is very perspicuous in such things as be necessary to salvation; and therefore ought to be read of all.

Yea we think and know the whole doctrine of salvation not only plentifully but plainly and perspicuously to be delivered in the holy scriptures, and sith God never spake unto his people but in their natural language, which might be understood of all, that it is a great injustice and tyranny to forbid the reading of them to any men, and consequently the turning of them into the proper tongue of any nation, which the Lord hath willed and commanded should be read of all men for their own salvations sake, yea and should be continually borne about in their hands day and night.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), I.XIII, 1: 127.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><figure class="quote" id="q-91079faa78" data-kw="">
<blockquote><p>The old fathers Origen and Chrysostom exhort the people to read the Scriptures, to buy them books, to reason at home betwixt themselves of divine matters--wives with their husbands, and parents with their children.</p></blockquote>

</figure><figure class="quote" id="q-5c74e7f435" data-kw="">
<blockquote><p>What does the Bible presume that we already know. There are a lot of things that the Bible presumes that we already know… Biblicism is a term that’s often being used in reference to a specific distinctive of evangelicals… How do you define Biblicism? I define it as that elevation of the Bible to such a high level that it occludes other things that we need to take into account… And often in circles that emphasize Biblicism you see prudential categores of thought deemphasized; its not about prudence if you have a divinely inspired verse that commands you to do something about it… in addition to that, there’s also the sidelining of philosophical categories, and systematic categories… We do teach the sufficiency of Scripture, but sufficiency for the task that God has given it. And so its like talking about the sufficiency of a steering wheel for steering a car. We don’t think of the sufficiency of the steering wheel in detachment from the rest of the steering mechanism, or in detachment from the driver; and so we need all of these things together, and Scripture is something that works along with God’s revelation in nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/video.html">Brad Belschner &amp; Alastair Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Is Biblicism Bad?” 6 min. Davenant Institute</cite></span></figcaption>

</figure><figure class="quote" id="q-9d4abd4aee" data-kw="">
<blockquote><p>That Scripture has this perspicuity is plain (1) from Scripture itself, which proclaims its lucidity. &quot;The testimony of Jehovah is sure, enlightening the eyes&quot; (Ps. 19:8). &quot;Thy words are a lamp to my feet&quot; (Ps. 119:105). &quot;A light shining in the darkness&quot; (II Peter 1:19). &quot;The law is a lamp&quot; (Prov. 6:23). … For Scripture is called &quot;clear&quot; (lucidus) not only because it throws light upon the matters that are understood, but also because it is clear in itself and has been made suitable for throwing light on these matters, if used by people with the eyes of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.17.8</span></figcaption>

<main class="wrap"><figure class="quote" id="q-3c776e04f8" data-kw="">
<blockquote><p>Luther struck the key-note of this anti-popery exegesis. He had at first a very low opinion of the Apocalypse, and would not recognize it as apostolic or prophetic (1522), but afterward he utilized for polemic purposes (in a preface to his edition of the N.T. of 1530). He dated the one thousand years (Rev. 20:7) with Augustine from the composition of the book [of Revelation], and the six hundred and sixty-six years from Gregory VII [c. 1015 – 1085], as the supposed founder of the papacy, and understood Gog and Magog to mean the unspeakable Turks and the Jews. As Gregory VII. was elected pope 1073, the anti-Christian era ought to have come to an end A.D. 1739; but that year passed off without any change in the history of the papacy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pastmillennialism.html">Pastmillennialism</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, On Luther | Philip Schaff, History of the Christian Church 3rd rev. (NY: Charles Scribner’s Sons, 1928), vol. 1, Apostolic Christianity, 1st Perdiod, ch. 12, section 101, ‘The Apocalypse’, p. 849</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/second-coming.html">Second Coming</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ab11a288f" data-kw="">
<blockquote><p>For his heart would have served him too seduce all nations, and to hold them still in the pestilent errors of idolatry, yea and in all kind of horrible misdeeds. But God has plucked them out of the power of darkness, and removed them into the kingdom of his dear beloved Son, Col. …13, till the thousand years be fulfilled. That is to say, till Antichrist be come. And after that he must be let loose. This thing came to pass after that the dominion as well of Mahumet as of the Romish bishop was so increased in strength that they became terrible to all kings and princes of the earth, for as much as they were able, not only to grieve them when they listed, but also to cast them from their seats, and to tread them quite under foot, until they submitted their necks to false religion and rightless laws: which thing is done yet still at this day, according as Paul foretold. 2. Thess. 2. b. 11.</p></blockquote>

</figure><figure class="quote" id="q-b7016e1218" data-kw="">

</figure><figure class="quote" id="q-812f45c829" data-kw="">
<blockquote><p>Another important division of historical interpreters is into Post-Millennarians and Pre-Millennarians, according as the millennium predicted in Rev. 20 is regarded as past or future. Augustine committed the radical error of dating the millennium from the time of the Apocalypse or the beginning of the Christian era (although the seer mentioned it near the end of his book), and his view had great influence; hence the wide expectation of the end of the world at the close of the first millennium of the Christian church. Other post-millennarian interpreters date the millennium from the triumph of Christianity over paganism in Rome at the accession of Constantine the Great (311); still others (as Hengstenberg) from the conversion of the Germanic nations or the age of Charlemagne.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pastmillennialism.html">Pastmillennialism</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, On Augustine | Philip Schaff, History of the Christian Church 3rd rev. (NY: Charles Scribner’s Sons, 1928), vol. 1, Apostolic Christianity, 1st Perdiod, ch. 12, section 101, ‘The Apocalypse’, p. 839</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/second-coming.html">Second Coming</a></span></div>

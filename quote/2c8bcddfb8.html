<blockquote><p>Those articles of religion wherein the divines of both sides [of the reformed and Lutherans] do fully agree are abundantly sufficient, both for a Christian man’s salvation and likewise for the establishing of a firm and lasting peace in the Churches of God. As for the rest… they are such as may perhaps not unfitly be sent to the divinity-schools, there to be thoroughly discussed: but by no means ought they to disquiet the peace either of any Christian soul or of God’s holy Church… our good and gracious Savior passed over with silence and toleration great and grievous errors in comparison of these… and that too even in such as were of his own household and retinue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Opinions of Certain Reverend &amp; Learned Divines concerning the Fundamental Points of the True Protestant Religion, &amp; the Right Government of Reformed Churches ([Oxford] Downes, 1643), “Opinion of Joseph Hall,”</cite>, pp. 1–2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-891dbcdb70" data-kw="">
<blockquote><p>XI. (4) Disagreements are a prejudice under whichthe evangelical churches labor. But they cannot hinder them from retaining the name of [a] true church, because they agree as to the foundation. And if any differences exist (which God wished to permit in order to prove our faith), they are about articles less necessary, in which there can be a disagreement without touching the essence of saving religion: as the apostolic churches formerly had their differences and stains, as is evident from the Acts of the Apostles and the Pauline epistles; nor were the eastern and western churches, the Latin and the Greek, the African and Italian churches free from them, which did not on that account cease to be true churches. Again, the contentions and differences of the evangelicals are far less than those which are agitated among the Romanists, who, as was seen before, frequently charge each other with heresy. Nor do we notice here the more rigid judgments of some of those who take their name from the great Luther, who, carried away by sinister prejudices, are accustomed to attack us. For however harshly they may have treated us, we do not cease to honor them with brotherly affection. And if, their prejudices and private affections being laid aside, they would seriously examine the thing itself by the law of love, truth and Christian prudence, they would not be so much averse to a pious syncretism and reconciliation with us, or at least a mutual toleration, to which not a few of the more moderate among them are not indisposed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes (P&amp;R), vol. 3, 18th Topic, question 15, “Are the evangelical and Reformed churches true churches of Christ?”</cite>, p. 143</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-8ed0b72981" data-kw="">
<blockquote><p>Thus we see where at this day we may find the true Church of God. Now I come to the third question; and that is: At what time a man may with good conscience make separation from a Church. Answer: So long as a Church makes no separation from Christ, we must make no separation from it: and when it separates from Christ, we may also separate from it;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Creed (1595), on the Church in A Golden Chain (Cambridge, 1600)</cite>, p. 497</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-097263c6db" data-kw="">
<blockquote><p>Schismatical is such as was the schisms of the Donatists [in the Early Church], which separated themselves from the true Church of God under the pretense of a more absolute life and a more perfect holiness… But none of these [kinds of schisms] can be justly imputed unto us declining from the Romish Church, for that departing is without all blame, which is not from a true Church, but from a false Church: not from the people of God, but from the persecuters of the people of God, not from the articles of the Faith and sound doctrine of the church, but from errors which darken the articles of the Faith and from the wicked traditions of men, which specially is not done by any lightness but by necessity, not for the desire of innovation but for true religion’s sake, and to recover the true Faith according to the testimony of the eternal verity, that leaving the fellowship of darkness, we may be gathered again in true light, placed with Christ and all his members. So we at this day have forsaken that Romish Sea full of false doctrine and idolatry, and flowing with the innocent blood of martyrs, and have embraced the evangelic and apostolic doctrine, and so Christ Himself being head of the Church, which is the commmunion of all saints believing in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-alley.html">William Alley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Poor Man’s Library Rapsodiæ G.A. Bishop of Exeter upon the First Epistle of Saint Peter... (1560; London: Day, 1565), Lecture 7, Now to the Romish Church, Response, 3. Schismatical, p. 246 Alley was the Anglican bishop of Exeter during the reign of Queen Elizabeth I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-3df12a43cc" data-kw="">
<blockquote><p>And I make no doubt but some opinions as well as practices render men unmeet for Church-communion, Tit. 3:10; 2 Jn. 10. All opinions which overthrow doctrines necessary to be believed, which the apostle comprehends under the name of Faith; and all such opinions as are inconsistent with an holy life and te power of godliness, which the apostle comprehends under the name of a good conscience, 1 Tim. 1:19-20. Whosoever shall hold or maintain any such opinions as these, he is either to be kept out, if not admitted; or cast out, if he be in Church-fellowship. In receiving such you receive but spies and incendiaries among you. What a fire-brand did Arius prove, not only in the Church of Constantinople, but even to the whole world? Men of graceless hearts and erroneous heads will give a continual exercise to the patience of sober Christians… if they can be discerned before they be admitted, a little preventive care would be of singular and seasonable use to the tranquillity of Church-societies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Planelogia, a Succinct &amp; Seasonable Discourse of the Occasions, Causes, Nature, Rise, Growth &amp; Remedies of Mental Errors... (London: Roberts, 1691), pp. 438-39, 446 Flavel was a presbyterian. | Direction 1</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

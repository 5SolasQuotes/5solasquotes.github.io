<blockquote><p>Hence baptism is a seal of our incorporation in Christ’s visible Church;” Rutherrford cites 1 Cor. 12:13; Acts 2:41; Mt. 28:19; Acts 8:38; 10:47; 16:15,23. His 4 considerations are: 1. Baptism is not that whereby we are entered into Christ’s mystical and invisible body as such, for it is presupposed we be members of Christ’s body, and our sins pardoned already, before baptism come to be a seal of sins pardoned; but baptism is a seal of our entry in Christ’s visible body, as swearing to the colors is that which enters a soldier to be a member of such an army, whereas before his oath, he was only a heart friend to the army and cause. 2. Baptism as it is such is a seal, and a seal as a seal adds no new lands or goods to the man to whom the charter and seal is given, but only does legally confirm him in the right of such lands given to the man by the prince or state; yet this hinders not but baptism is a real, legal seal, legally confirming the man in his actual and visible profession of Christ, remission of sins, regeneration, so as though before baptism he was a member of Christ’s body, yet quoad nos [as far as us], he is not a member of Christ’s body visible until he be made such by baptism. 3. On the controversy anent the efficiency, working and operation of the Sacraments</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Question 2, ‘Whether or no children be received into the visible Church by Baptism’ in The Due Right of Presbyteries… (London, 1644), pt. 2, ch. 4, section 5</cite>, pp. 210-20</span></figcaption>

9e246d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/99709e246d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/baptism/#:~:text=Hence%20baptism%20is%20a%20seal%20of,working%20and%20operation%20of%20the%20Sacraments&amp;text=Hence%20baptism%20is%20a%20seal%20of%20our%20incorporation&amp;text=the%20efficiency%2C%20working%20and%20operation%20of%20the%20Sacraments" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-47557be10b" data-kw="">
<blockquote><p>15. But when and in what sort and degree Christ gives the actual operations of the Spirit to all covenanted infants, it is wonderful hard for us to know. But this much seems clear: 1. That Christ may when he please work on the soul of an infant to change its disposition, before he come to the use of reason. 2. That Christ and his Spirit as in Covenant with infants, are ready to give all necessary assistance to infants for their inherent sanctification in the use of those means, and on those further conditions, on which we must wait for it and expect it. For the Holy Ghost is not so engaged to us in our Covenant or baptism, as to be obliged presently to give us all the grace that we want; but only to give it us on certain further conditions, and in the use of certain means. … In that also they are by Covenant and their parents promise, engaged to use those means which Christ has appointed for sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory... (London: 1673) | Question 42, ‘But the great question is, How the Holy Ghost is given to infants in baptism?…’</cite>, p. 819</span></figcaption>

</figure><figure class="quote" id="q-dae5e88ec1" data-kw="">
<blockquote><p>All ministers must be admonished to be more careful to instruct the ignorant than ready to satisfy their appetites; and more sharp in examination than indulgent, in admitting to that great mystery such as are ignorant of the use and virtue of the same. And therefore we think that the administration of the Table ought never to be without that examination pass before, especially of those whose knowledge is suspect. We think that none are apt to be admitted to that mystery who cannot formally say the Lord’s Prayer, the articles of the belief, and declare the sum of the law… Every master of household must be commanded either to instruct, or else cause [to] be instructed, his children, servants, and family, in the principles of the Christian religion; without the knowledge whereof ought none to be admitted to the Table of the Lord Jesus. For such as are so dull and so ignorant, that they can neither try themselves, neither yet know the dignity and mystery of that action, cannot eat and drink of that Table worthily. And therefore of necessity we judge it, that every year at least, public examination be had by the ministers and elders of the knowledge of every person within the church: to wit, that every master and mistress of household come themselves, and their family (so many as are come to maturity), before the ministers and elders, to give confession of their faith, and to answer to such chief points of religion as the ministers shall demand. Such as are ignorant in the articles of their faith; understand not, nor cannot rehearse the commandments of God; know not how to pray, neither whereinto their righteousness consists, ought not to be admitted to the Lord’s Table.</p></blockquote>

<blockquote><p>There is no question between us and the Mennonites as to whether the infants of unbelievers, or of those who are outside of the covenant of God, are to be baptized? For to these, both we and they deny baptism. But the question is, whether the infants of those who are in the covenant, or one of whose parents is in the covenant, are to be baptized?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-van-hoeke.html">Peter van Hoeke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lord’s Day 27, Inquiry 74, ‘Whether Infants are to be Baptized Also?’, p. 310 in Studies in the Palatinate Catechism (Leiden, 1711) See also the first of the three arguments on the same page that he gives to prove the reformed position. As translated in Krauth</cite>, p. 33.</span></figcaption>

<blockquote><p>Lawyer: What have you against our use of godfathers in baptism? Minister: Negatively, we are not at all against the old sort of patrimi, ‘susceptors,’ or sponsors that were used at baptism in the ancient Churches, though we think it but a prudential thing and not of necessity to baptism.</p></blockquote>

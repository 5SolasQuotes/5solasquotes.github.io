<main class="wrap"><figure class="quote" id="q-98a386b464" data-kw="">
<blockquote><p>Reason 12. Those (moderate men) that are most against Church-covenantings, speak only against the necessity of them; but the lawfulness they deny not, no nor the convenience in case of liberty; no nor the necessity of the thing, but only of the circumstantials and manner of expression, and ends by some affixed. They require that the people expressly consent to the choice of their minister, and that they be examined before the sacrament of their knowledge in the fundamentals. This differs from what we propound but in circumstances. And I should think it more seasonable and convenient to be satisfied of our people’s spiritual sufficiency and capacity for Church-communion at our first reformation of a disordered Church, or in a well-ordered Church, at their first transition out of the state of imperfect, infant members, and admission into the number of adult members (and after this, to suppose their right good to communion and Church privileges, till it be on sufficient grounds disproved, excepted against or questioned by any) than to try them as only for admission to the Lord’s Supper, suffering them to live quietly in the reputation of members, [even] so [when] they will not come to the Table of the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653) | ‘An Explication of some Passages in the foregoing Propositions’, p. 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ddc2983088" data-kw="">
<blockquote><p>1. But come we to your [congregationalist] particulars: First, ‘by way of participation of the Lord’s Supper, the members of one church coming to another church, etc.’ But: 1. Why do you instance in this ordinance only? Have not their children, occasionally born there, a liberty also of baptisme? The rather, because baptism is not administred with respect to this or that church, but to the general visible Church: Unless you hold that a man or child is baptized to no church but that particular, and [is] an infidel to all the rest. Yet some of your brethren will hardly baptize a child of any but a member of their own church, which is next door to Anabaptism. … …4. But your reason I like very well: ‘For we receive the Lord’s Supper, not only as a seal of our communion with the Lord Jesus, and with his members in our own church, but also in all the churches of the saints’: Whence I infer, then, it is not any favour dispensed by you to a member of another church, but a dignity or privilege common to every member of that body, by virtue of that membership, and not with respect to his particular church membership. And I pray, is not baptism also a seal of our communion with all the members of Christ’s body? Why then may you not admit the children of the members of any church to be baptized by your pastors upon just occasion, as well as to admit the parents to the Lord’s Supper? Nay further: If the sacraments be seals of our communion with all the members of Christ, why do you not admit any true Christian, and his children, to the communion of the sacraments, though they be not as yet admitted members of any particular congregation? How dare you deny any member of that Body communion with its fellow-members, when it has union and communion with the Head? Consider it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Clavium</cite>, … (1645), ch. 4, pp. 39-41 Cawdrey was an English presbyterian and Westminster divine.</span></figcaption>

</figure><figure class="quote" id="q-42dc7236d2" data-kw="">
<blockquote><p>Fourthly, the signs that difference a true Church from a false, do not primarily belong to a particular congregation, but to the Church-catholic-visible, viz. profession of the true faith, the administration of the true ordinances of God, the Word and sacraments; for therein all the whole Church agree, and is thereby distinguished from those that are without, not from those that are within. This is no note to know this or that particular church by, from another, for it is common to the universal Church, it distinguishes not among themselves, but from the general common opposite: the heathen, or the gross heretic. A man being lead into a vault where were the skulls of many dead men, and understanding that Alexander’s skull was there, desired his guide to show him that; his guide told him it was that skull with the hollow eye holes and with the gristly nose, and with futures crossing the brain pan, and when the man replied that they had all so, yea says his guide, there is no difference between kings and other men’s skulls when they are dead. So if any man should ask you or me which is the church of Ipswich, Dedham or Colchester, it were a folly to say it is the Church where the word of God is preached and sacraments administered, and that profess Jesus Christ to be crucified, dead and buried, risen again, and ascended into Heaven, for so do all the Church catholic, but I must give some other notes to distinguish any of them, for these are not distinctive, because common. Therefore the signs of the true Church belong primarily to the whole, secondarily to particular parts thereof, and are therefore not distinctive to the parts. That which is primary to any thing is distinctive to that thing, but that which is secondary and common is not distinctive from other particulars of the like kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Essence &amp; Unity of the Church, catholic, visible</cite>, (London, 1645), p. 29</span></figcaption>

<blockquote><p>…these… truths are most certainly evident out of the Scripture. All Christians in the Church of Jerusalem were admitted into Church-fellowship upon their repenting, believing and being baptized, without any other conditions, and that upon offering themselves… But it will farther more illustriously yet appear, if we consider the diverse other additions of believers, and that daily unto the Church of Jerusalem: for in the last verse of this chapter it is said that the Lord added daily unto the Church such as should be saved; here we find additions upon additions of believers, and that daily, indefinitely set down, as if they could not easily have been told, which adds no small emphasis unto the expression; and all these were admitted into Church-fellowship without any of those conditions the Independents require of all their members in these our times; for it is said the Lord added daily unto the Church such as should be saved; and therefore He did it only upon his own terms of repentance, faith and baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bastwick.html">John Bastwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Utter Routing of the Whole Army of All the Independents &amp; Sectaries</cite>, … (London, 1646), The Antiloquie, no page number</span></figcaption>

<blockquote><p>‘But’ (says he [John Robinson, a Separatist]) ‘the bare profession of fundamentals makes not a Church; they must be a company of faithful people, and if they must not be truly faithful, then they must be falsely faithful; for God requires true and ready obedience in his word, according to which we must define Churches, and not according to casual things.’ [Rutherford’s] Answer: This is a special ground that deceives the Separatists, their ignorance (I mean) of the visible Church, for the visible Church consists essentially neither of such as be truly faithful, nor of such as must be falsely faithful; for the ignorant man sees not that the visible Church includes neither faith, nor unbelief in its essence or definition. It is true, to the end that professors may be members of the invisible Church, they must be believers, and must believe, except they would be condemned eternally; but to make them members of the visible Church, neither believing nor unbelieving is essential, but only a profession ecclesiastically intear[?], that is not scandalous &amp; visibly &amp; apparently lewd and flagitious, such as was the profession of Simon Magus when he was baptized with the rest of the visible Church, Acts 8. And God indeed requires of us true worship and ready obedience, as he says, but not that a visible Church should be defined by true and sincere obedience: for essentials only are taken in a definition, and casual corruptions are only accidental to Churches and fall out through men’s faults, and therefore should not be in the definition either of a visible or an invisible Church; nor should ready and sincere obedience which is a thing invisible to men’s eyes be put in the definition of a visible Church, for it is accidental to a visible Church, and nothing invisible can be essential to that which essentially is visible; the visible Church is essentially visible.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-5e69ccbd26" data-kw="">
<blockquote><p>The present critics of the new apologetic have no quarrel with its Christian theistic position, nor do they question the legitimacy of the attempt to demonstrate the reasonableness of the Christian faith by borrowing from secular philosophers. They seriously question, however, the adequacy and, in fact, the technical correctness with which the new apologetic has done its job.

Specifically, they complain (1) that its theory of knowledge, borrowed from the idealist school, logically leads to a species of pantheism, not to theism; (2) that it frequently confuses an argument by presupposition with a rational demonstration; (3) that it sometimes grossly misrepresents the position of secular and Catholic thinkers (It is one thing to reject Aristotle; it is quite another to play up the superiority of the Christian position by contrasting it with a distortion of Aristotle); (4) that it ignores and also confuses recognized meanings of the words “truth” and “knowledge”; (5) that it arbitrarily assigns new and unheard of meanings to certain technical terms in philosophy, thereby confusing issues, raising pseudo-problems, and presenting pseudo-demonstrations of foregone conclusions; and (6) that it tends to put into the idea of the antithesis a content which can only lead to exaggerated, improbable, and even absurd results.

Again, none of the present writers suspects the proponents of the new apologetic of making anything like a subtle attempt to undermine Christian doctrine. But when theories and presuppositions which can lead only to pantheism are uncritically taken over in order to arrive at theism, the resulting discourse easily reduces to the cabalistic. And, after all, a bad argument for the truth frequently does more damage than a good argument against it. …

In asserting that the givens with which we must begin are not facts but “God-interpreted facts,” the new apologetic seems to have taken over uncritically the idealist theory of knowledge and truth, a theory leading logically to a kind of pantheism. For the assertion appears to mean that “to be” is identical with “to be interpreted by God.” In other words, God’s interpretative action enters into the being of a fact (say, a tree, a bar of iron, or a human thought) in such a way as to make its existence identical with God’s knowledge. Now if God’s knowledge constitutes the facts, the facts must constitute God’s knowledge. How, then, can we distinguish God’s knowledge from God’s creatures?

This is the question of the relation between truth and reality, a question which the idealist handles somewhat as follows. Truth and reality, so he argues, must have a fundamental identity, since if truth is not identical with reality there must be something in reality which is not a content of truth and which, therefore, cannot be a possible object of thought – any thought. But if truth is to be truth, it must contain all of reality in ideal form. Yet that is demonstrably impossible since truth can never, for example, include whatever we feel at the moment, nor can it include the sensible past and the sensible future.

Truth and reality, therefore, do not seem to be identical after all. Nevertheless, if in knowledge we must begin with “facts pre-interpreted,” they must be identical. Now there is but one way out of this dilemma and that is to regard truth as an aspect of reality. Accordingly, reality must be conceived as an all-comprehending Absolute, something behind and beyond the distinction of subject and object, i.e., the knower and the thing known.

Now if, on the one hand, we identify this Absolute with God, we arrive at a full-blown pantheism – God is the one Reality comprehending all other realities which, in turn, are so many parts or aspects of God. In fact, we could say that God is the one Reality comprehending all illusions, since whatever is not itself the Absolute is not ultimately real. And, on the other hand, if we do not identify God with the Absolute, God must be regarded as something less than the Absolute, i.e., a part or aspect of the Absolute and having, therefore, no final reality in Himself. Well, any theory of knowledge the logic of which pushes one into something like that can hardly be considered a happy choice if one wishes to make a case for Christian theism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cecil-de-boer.html">Cecil De Boer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The New Apologetic in The Calvin Forum</cite></span></figcaption>

<blockquote><p>The Most Illustrious COCCEIUS, in ad ultimum Mosis, § 74, says these words, “It comes here to be wondered at, even a new pestilence sprouting at this time, of those that induce the soul to doubt, whether they themselves be, see, hear, etc. Wretched mortals, who reason against their own sense, doubting themselves to be, and daring to profess themselves to be infidels and ἀθέους/atheists, at least while they are willing to doubt; thereon they are going to apply themselves to this, that they might question all things, with respect to which they are able to delay their confidence (which the Scripture calls reasonings and murmurings), and remove from themselves the knowledge of God and His ways.” Add what things are found in his Summa Theologiæ, chapter VIII, § 25, opera, tome 7, page 160.</p></blockquote>

<blockquote><p>For, since the principle of all the knowledge which the reason acquires about a thing is the understanding of that thing’s essence—because, according to the Philosopher’s teaching (2 Posterior Analytics 3, 9) the principle of a demonstration is what a thing is—it follows that our knowledge about a thing will be in proportion to our understanding of its essence. Therefore, if the human intellect comprehends the essence of a particular thing, such as a stone or a triangle, no truth about that thing will surpass the capability of human reason. But this does not happen to us in relation to God, because the human intellect is incapable by its natural power of attaining to the comprehension of his essence. For our intellect’s knowledge, according to the mode of the present life, originates from the senses: and thus things which are not objects of sense cannot be comprehended by the human intellect except insofar as knowledge of them is gathered from sensibles. Now sensibles cannot lead our intellect to see in them what God is, because they are effects unequal to the power of their cause. And yet our intellect is led by sensibles to the divine knowledge so as to know about God that he is, and other such truths which need to be ascribed to the first principle. Accordingly, some divine truths are attainable by human reason, while others altogether surpass the power of human reason. … Furthermore, the same is made abundantly clear by the deficiency which we experience every day in our knowledge of things. For we are ignorant of many of the properties of sensible things, and in many cases we are unable to discover the nature of those properties which we perceive by our senses. Much less, therefore, is human reason capable of investigating all the truths about that most sublime [divine] essence. This agrees with the saying of the Philosopher, where he says that our intellect is like the eye of a bat in relation to the sun in relation to those primary things which are most evident in nature (1a Metaphysics 1, 2).</p></blockquote>

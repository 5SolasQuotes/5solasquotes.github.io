<blockquote><p>By those who were competent to take the measure of Amyraldianism—such as Rivetus, Maresius, and Spanheim—it was regarded as a subtle form of Arminianism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Holy Spirit</cite>, p. 361, 363</span></figcaption>

<div class="actions"><button class="copy" data-copy="“By those who were competent to take the measure of Amyraldianism—such as Rivetus, Maresius, and Spanheim—it was regarded as a subtle form of Arminianism.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-755e0e1434" data-kw="">
<blockquote><p>The first contains the preparation of the remedy necessary for man’s salvation; the second brings with it an application of the same. And consequently the one may well appertain to the common nature, which the Son assumed, when the other is a special privilege vouchsafed to such particular persons only, as the Father has given Him. And therefore we may safely conclude out of all these premises, that ‘the Lamb of God, offering Himself a sacrifice for the sins of the whole world,’ intended by giving sufficient satisfaction to God’s justice, to make the nature of man, which He assumed, a fit subject for mercy and to prepare a medicine for the sins of the whole world, which should be denied to none that intended to take the benefit of it: howsoever He intended not by applying this all-sufficient remedy unto every person in particular to make it effectual unto the salvation of all, or to procure thereby actual pardon for the sins of the whole world. So, in one respect He may be said to have died for all; yet so as in respect of his mercy He may be counted a kind of universal cause of the restoring of our nature, as Adam was of the depraving of it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Most Rev. James Ussher</cite>, … 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘Of the True Intent &amp; Extent of Christ’s Death &amp; Satisfaction upon the Cross’ (1617), pp. 552-60, p. 559</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

quote/755e0e1434.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=The%20first%20contains%20the%20preparation%20of,was%20of%20the%20depraving%20of%20it&amp;text=The%20first%20contains%20the%20preparation%20of%20the%20remedy&amp;text=as%20Adam%20was%20of%20the%20depraving%20of%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e1cdea8129" data-kw="">
<blockquote><p>Also, it should be pointed out again that the doctrinal difference between the Saumur theologians and Turretin do not involve any of the fundamental tenets of the Reformed faith. Turretin himself mentions this fact in a letter to Jean Claude which we shall consider later in this thesis. As we have seen various times in this chapter, Turretin refers to the Salmurians as fellow Reformed pastors and theologians, and the Salmurians certainly view themselves as being within the Reformed tradition. In fact, Amyraut goes to great lengths in attempting to prove that the orthodox Reformed theologians are in agreement with him. Thus, even though this controversy was a serious and lengthy one, nevertheless it was entirely an internal dispute within the Reformed churches concerning non-fundamental matters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/genevan.html">Donald Davis Grohman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Genevan Reactions to the Saumur Doctrines of Hypothetical Universalism</cite>, (Knox College in cooperation with Toronto School of Theology, 1971), p. 120</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-747526e2d6" data-kw="">
<blockquote><p>Together with his brother-in-law, Pierre du Moulin, professor of theology at Sedan, and Spanheim, first professor at Geneva and thereafter at Leiden, he [Rivet] sharpened his theological knife in order to combat Amyraut. For this purpose, he also used an abstract of Amyraut’s ideas, which he had composed in 1635 at The Hague. It contained fifty theses and was followed by his comments on them, divided into ten chapters, and then a conclusion (Synopsis doctrinae de natura et gratia, excerpta ex Mosis Amyraldis… in Riveti Opera Theologica, 3:830-851).” – van Asselt in Theology of the French Reformed Churches, p. 270 Maresius, Samuel – A Theological Judgment on the Questions of Grace &amp; Universal Redemption, Partly Refutative, containing 10 Exercitations, Against the Apology of John Daille, published in Belgium, contra the Common &amp; Constant Judgment of the Reformed Churches &amp; Schools of the Belgic Federation, and All Others, to which is Appended Brief Strictures to the Recent Vindications of the Same Daille, which are Most Wordy &amp; Contumacious… (Groningen, 1658) 913 pp. ToC Daille’s Apology is above. Table of Contents Dedication Prolegomena Epistle of Blondel to Maresius Response of Maresius Exercitation 1. The First Part of the Apology [of John Daille], in which is viewed: Jn. 3:16 is weighed, then 1 Tim. 2:3, in which kinds of individuals ought to be understood; The Objections of the Apology to the contrary are satisfied; 2 Pet. 3:9 is weighed, to the effect that Calvin in no way favors universalism; also Eze. 33:11, in which the common explanation is vindicated; refutations to the contrary are opposed 1 Exercitation 2. Places customarily used to support universal redemption are weighed: 1 Tim. 2:6, the distinction between the sufficiency and efficacy of the death of Christ; Rom. 5:18; Heb. 2:9, ‘every man’, what it is; Jn. 1:9 &amp; 1 Jn. 2:2, in which the true sense is propounded and vindicated: other testimonies on the term ‘world’ 58 Exercitation 3. Proceeds to other places for universal redemption, the judgment of the Arminians on this head; the disparity of the affection of Christ towards the elect and reprobates to die for both (2 Cor. 5:14-15; Rom. 14:8-9; Mt. 18:11; Mk. 11:17; Lk. 5; 1 Tim. 1:15; Lk. 9:56, and many others are viewed) to placate the Father through the blood of Christ; Tit. 2:11, the testimony of Gomarus is elucidated and vindicated. What of this dogma the reformed churches and schools of Belgium judge. The judgment of Twisse on Molina. The judgment of the Rev. Apologist, by which he differs from Remonstrantism, and by which inconvenient things he draws away from them. The Janists, on the view of the Apology and some on Blondel 102 Exercitation 4. The Second Part of the Apology, in which is viewed: Whether God wills all them to be saved to whom his Word is externally announced: the first reason for the affirmative is weighed and refuted: on the end and means: the command made to Abraham; the precept of the Law ought to save; it ought to work repentance and belief. That command to Pharaoh, also God having willed the slaying of his Son, or his will to save the reprobate hearers of the Gospel: various places of Scripture having been brought on that, and similar ones customarily brought by Remonstrants and Jesuits are weighed; and the genuine sense of them is profusely expounded 147 Exercitation 5 proceeds in an examination of the first argument; Prov. 1:5 &amp; Lk. 7:30 are weighed; the twofold counsel of God is taken up; in what way that is resisted, out of Acts 7:51; on that most vexed place, Mt. 23:37 which is discussed by many; the reasons by which the Apologist seeks to prove that God always intends that to be that which He commands to men, are clearly refuted; the whole conclusion of the first argument 217 Exercitation 6. The refutation of the Second Argument of the Apologist from the divine promisses; it concides with the first; the third from divine calling; the fourth from the parable of the marriage feast; the fifth from the invitation to the perishing unto repentance and faith; places specially brought to that effect are disected, namely Isa. 55:1-3; Jn. 7:37; Prov. 9:4-6; Mt. 11:18-19; on the Galatians out of Gal. 3:1; the place Jn. 6:32, Christ is really offered to the unbelieving, and whether that of the minister is to be distinguished from God; the sixth argument from that which is incumbent upon ministers from the command of God; the means unto salvation, of what kind and how far they are admitted with respect to reprobates; the end of pastors in preaching the gospel; whether reprobates are called through that which is falling out [accidens] 253 Exercitation 7. The remaining arguments of the revered man are dissected; the seventh from the foolishness of the unruly; it is falsely supposed that they are minimally called; the penitence of demons and the damned; what and in what way it is offered to reprobates. Eighth, on times assigned to sinners. Ninth, in what way we may hold to the first thing of the Gospel, whether the hearing or the preaching; Tenth, ‘Do this and you will live’. The Principles in which we come together. So to proceed onto the Arminian disputation, the judgment of Cameron 323 Exercitation 8. The second member of the second part of the Apology, on the universality of the death of Christ. What of Cameron on that? The first argument of the apology is disected out of Rom. 14:15 &amp; 1 Cor. 8:10-11. The second taken out of 1 Pet. 2:1, and so proceeding to sieze it from the Remonstrants, and sufficiently refute them from [Daniel] Chamier. Gomarus and Calvin on this place. Third, out of Heb. 10:29. A sacramental sanctification is there denoted, so it is proved by multitudes. The fourth and fifth grasp at a false supposition [sophisma] of the Remonstrants, that whatever one holds to believe, that is true. The absurd supposition of the Apologist, whether he implicates a contradiction? This sophism is accurately refuted 361 Exercitation 9. The sixth argument from absurdities and the play-acted Catechism, which, through the Jesuit and Remonstrant slander, is attributed to our reformed Apologist. Repentance, whether it is prior to faith? The seventh dissected, and it is showed in what way unbelief is the cause of damnation. The eighth and ninth are of the same sort with the seventh. The tenth is far more absurd, from the salvation of believers. The eleventh, of the same scaly stuff. The twelvth, out of which the Apologist wills for no one to believe that Jesus is the Christ, except that he would believe that He died for him. The thirteenth and fourteenth contain a seventh Cocceianism 430 Exercitation 10. Of the salvation of adults which are destitute of the Word, and of Christ’s death for them. The doctrine of the Apologist fights in many ways with the Synod of Alencon: many places of Scripture are examined, having been brought forth by it, out of Acts 17:26-27; 14:16-17; Rom. 2:4; 1:18-21. The same reason from the examples. Whether to that end the knowledge of God is from Himself manifested to pagans, so that through it they may repent and be saved? It is proved that God has intended their inexcusability, and this from the distinct end of the thing, from the end of God, as the event of it shows from this having been intended. Christ did not die for the ethnics without the Word. God does not will their premature infants, having been snatched away in death, to have been saved, nor did Christ redeem them 493 Brief Strictures upon the Most Verbose Vindications of John Daille, recently opposing the first three of the preceeding exercitations, for the defense of their errors on Universal Grace &amp; Redemption 568 ToC of the Exercitations 908 Omissions that ought to be Adjoined 914 Errata 915 Grebenitz, Elias – A Theological Tract on the Denial of Universal, Divine Grace (Frankfurt, 1665) 87 pp. Grebenitz (1627-1689) was a reformed professor of logic, metaphysics and theology at Frankfurt, Germany. Burman, Francis – 17. ‘Of the Subject of the Covenant of Grace. Where is Treated of its Latitude &amp; of Universal Grace’, pp. 499-506 in A Synopsis of Theology, and especially of the Economy of the Covenant of God, from the beginning of ages to the consummation of all things, vol. 1 (Utrecht, 1671) Burman (1628-79) . 1700’s Vitringa, Sr., Campegius – Ch. 19, ‘Of the Covenant of Grace, which has an Eternal Superstructure &amp; Various Dispensations of it’, ‘Of the Extent of the Covenant of Grace’, pp. 247-249 in The Doctrine of the Christian Religion, Summarily Described through Aphorisms, vol. 4 (d. 1722) Vitringa, Sr. (1659-1722) was a professor in Franeker and a Hebraist. “…Vitringa… maintained a fairly centrist Reformed position… Vitringa and De Moor serve as codifiers and bibliographers of the earlier tradition, the former from a federalist, the latter from a nonfederalist perspective.</p></blockquote>

third from divine calling; the fourth from the parable of the marriage feast; the fifth from the invitation to the perishing unto repentance and faith; places specially brought to that effect are disected, namely Isa. 55:1-3; Jn. 7:37; Prov. 9:4-6; Mt. 11:18-19; on the Galatians out of Gal. 3:1; the place Jn. 6:32, Christ is really offered to the unbelieving, and whether that of the minister is to be distinguished from God; the sixth argument from that which is incumbent upon ministers from the command of God; the means unto salvation, of what kind and how far they are admitted with respect to reprobates; the end of pastors in preaching the gospel; whether reprobates are called through that which is falling out [accidens] 253 Exercitation 7. The remaining arguments of the revered man are dissected; the seventh from the foolishness of the unruly; it is falsely supposed that they are minimally called; the penitence of demons and the damned; what and in what way it is offered to reprobates. Eighth, on times assigned to sinners. Ninth, in what way we may hold to the first thing of the Gospel, whether the hearing or the preaching; Tenth, ‘Do this and you will live’. The Principles in which we come together. So to proceed onto the Arminian disputation, the judgment of Cameron 323 Exercitation 8. The second member of the second part of the Apology, on the universality of the death of Christ. What of Cameron on that? The first argument of the apology is disected out of Rom. 14:15 &amp; 1 Cor. 8:10-11. The second taken out of 1 Pet. 2:1, and so proceeding to sieze it from the Remonstrants, and sufficiently refute them from [Daniel] Chamier. Gomarus and Calvin on this place. Third, out of Heb. 10:29. A sacramental sanctification is there denoted, so it is proved by multitudes. The fourth and fifth grasp at a false supposition [sophisma] of the Remonstrants, that whatever one holds to believe, that is true. The absurd supposition of the Apologist, whether he implicates a contradiction? This sophism is accurately refuted 361 Exercitation 9. The sixth argument from absurdities and the play-acted Catechism, which, through the Jesuit and Remonstrant slander, is attributed to our reformed Apologist. Repentance, whether it is prior to faith? The seventh dissected, and it is showed in what way unbelief is the cause of damnation. The eighth and ninth are of the same sort with the seventh. The tenth is far more absurd, from the salvation of believers. The eleventh, of the same scaly stuff. The twelvth, out of which the Apologist wills for no one to believe that Jesus is the Christ, except that he would believe that He died for him. The thirteenth and fourteenth contain a seventh Cocceianism 430 Exercitation 10. Of the salvation of adults which are destitute of the Word, and of Christ’s death for them. The doctrine of the Apologist fights in many ways with the Synod of Alencon: many places of Scripture are examined, having been brought forth by it, out of Acts 17:26-27; 14:16-17; Rom. 2:4; 1:18-21. The same reason from the examples. Whether to that end the knowledge of God is from Himself manifested to pagans, so that through it they may repent and be saved? It is proved that God has intended their inexcusability, and this from the distinct end of the thing, from the end of God, as the event of it shows from this having been intended. Christ did not die for the ethnics without the Word. God does not will their premature infants, having been snatched away in death, to have been saved, nor did Christ redeem them 493 Brief Strictures upon the Most Verbose Vindications of John Daille, recently opposing the first three of the preceeding exercitations, for the defense of their errors on Universal Grace &amp; Redemption 568 ToC of the Exercitations 908 Omissions that ought to be Adjoined 914 Errata 915 Grebenitz, Elias – A Theological Tract on the Denial of Universal, Divine Grace (Frankfurt, 1665) 87 pp. Grebenitz (1627-1689) was a reformed professor of <blockquote><p>But if to believe that Christ died for oneself is the same thing as to believe that the death of Christ is sufficient of itself to expiate one’s sins, we do not deny that reprobates are also bound to believe this: which is perfectly true, whether they believe it, or not. For, the value of Christ’s death is such, that it is of itself sufficient for the altogether complete expiation of the sins of all men, even if they should be ten thousand times more: even if God did not determine it for the expiation of the sins of all. So indeed in this controversy it is customary among many to make a distinction, that they say, that Christ died sufficiently for all, even reprobates; but efficiently only for the elect: which words, suitably explained, and applied to amplify the value of the merit of Christ, we readily admit: even if we have not made use of this distinction from the beginning: because the impropriety in the words appears to be overly harsh. For to [have] died for someone, if we speak properly, is to die for the favor of someone, or in the place of someone, so that he might be delivered from death: and if a voluntary death is met for another, it presupposes the greatest possible love, as Christ testifies, Jn. 15:13. Now, if you should add, ‘sufficiently only, not efficiently’, this not very suitable sense will emerge: Christ, impelled by the greatest possible charity, died in the place of reprobates, so that they might be delivered from death, sufficiently indeed, but not efficiently, that is, they are never actually delivered. Those that say, that Christ dies also for reprobates, not indeed so that they might actually be delivered, but so that they might be able to be delivered, tacitly suppose (or they really do not say anything relevant), that it is in the power and ability of reprobates to apprehend Christ’s offered merit by faith: since without faith they are not even able to be delivered. Likewise (which I wish properly to be observed), that God decreed from eternity to save all men and each through Christ, under this condition, that they believe upon Christ, the Redeemer of all men and each. Which no Orthodox theologian would admit, as Pelagian or Semi-pelagian dogma. I leave unmentioned, that God foreknew from eternity, that a great many were not going to believe, and that He decreed that He was not going to give faith to them, which is not able to be had, except with Him freely giving. Why then would He have decree salvation, and have determined means of salvation, that is, the death of His Son, under a condition, which He foreknew that He was not going to fulfill, and the ability of the fulfilling of which He denied in His eternal decree. Not even man plans so imprudently. But let us dismiss these things. Nevertheless, we think that it is more rightly and plainly said, that the death of Christ is sufficient in itself for the expiation of all the sins of men, than, Christ died sufficiently for all, even reprobates.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, ed. (1634), Species of the Office of Christ, pt. 3 Wendelin admits that Christ died for the world to make a sufficient atonement for all, yet Christ dying for someone properly means to deliver them; hence he does not like the language of Christ dying for all sufficiently. He then argues against hypothetical universalism.</span></figcaption>

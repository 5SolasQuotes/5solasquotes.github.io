<main class="wrap"><figure class="quote" id="q-74c29ba9e9" data-kw="">
<blockquote><p>When any are lost, we do not hesitate to say that they perish by their own deserts, although God could have mercifully saved them, had it pleased him; and when any are saved, we dare not affirm that they deserved to be saved, since God could have justly condemned them, had it pleased him. But why he does not save all, or why he saves some rather than others, it is not necessary to inquire; since, leaving out the reasons of that difference, it is enough to know, that neither mercy supersedes justice, nor justice mercy, before that Being, by whom no one is condemned except through justice, no one is saved except through mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted, Christian Theology</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f72a97a8ae" data-kw="">
<blockquote><p>God is Actus Purus, which is to say that He is eternally all that He can be. Potentiality is a trait of creatures, not God. The concept of Actus Purus was first articulated by Aristotle in his argument for the unmoved mover, and through its history, the church has considered this notion a valid articulation of the absolute perfection and preeminence of God over all things. This paper, then, explores the exegetical footing of Actus Purus. It also will seek to understand its implications for systematic theology. Careful exegesis will demonstrate that the doctrine of pure actuality is deducible from Scripture by good and necessary consequence. It is an instrument that helps to sound the unbounded perfection of God…</p></blockquote>

<blockquote><p>360. XII. The last now to be named is the antecedent and consequent will. This also is handled by many Schoolmen and much used by the Jesuits and Arminians. To pass by others, Pennottus handles it Propugn. bk. 4, ch. 21, having first showed, ch. 20, p. 225 that Chrysostom and Damascene first used it. His explicatory propositions are:

1. Voluntas antecedens et consequens non est in Deo respectu omnium volitorum, sed solum respectu eorum quae aliquo modo pendent ex lib. arbtrio creaturae. [The antecedent and consequent will do not exist in God with respect to all things willed, but only with respect to those things which in some manner depend upon the free will of the creature.]

2. Voluntas antecedens est illa qua Deus vult hominis salutem quantum in ipso est, et qua illum ad salutem ordinat, et media ad salutem necessaria praeparat, quibus nisi per ipsum hominem steterit, salutem assequatur. [The antecedent will is that by which God wills the salvation of man, insofar as it lies in Him, and by which He ordains him to salvation and prepares the means necessary for salvation, so that, unless the hindrance to salvation should arise from the man himself, he may attain salvation.]

3. Non semper voluntas antecedens et consequens circa objecta contraria versantur, sed potest idem objectum esse volitum à Deo voluntate tum antecedente tum consequente. [The antecedent and consequent will do not always concern contrary objects; rather, the same object may be willed by God both by the antecedent will and by the consequent will.]

4. Voluntas antecedens in Deo est voluntas beneplaciti, et non solum voluntas signi. [The antecedent will in God is the will of good pleasure, and not merely the will of sign.]

5. Voluntas antecedens est formaliter et proprie in Deo existens, et non solum per metaphoram ad eum modum, quo voluntas signi. [The antecedent will exists formally and properly in God, and not merely metaphorically, in the manner in which the will of sign does.]

361. I tell you their sense that I may the better open the plain truth to you, which is as follows:

1. This distinction of voluntas antecedens et consequens is not applied to God as He is our Creator, or end, nor as He is mere Proprietor or Benefactor, but only as He is Rector or [the] Moral Ruler of man.

2. As government has an antecedent and consequent part, viz. legislation and judgement (with execution), so God’s antecedent will is nothing but his legal will, or his will as Rector signified by his laws; and his consequent will is his judicial will, or expressed in judgment: one antecedent to man’s part (obedience or disobedience) and the other consequent to it.

3. It is most certain that God wills antecedently all that is in his Law, that is, that all that believe and repent shall be saved: and that He wills consequently that Judas e.g., and every finally impenitent unbeliever, shall be damned. For what God does, that He wills to do: But God does Himself make such a Law and pass such a judgement: Therefore He is willing of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable</cite>, ... (London: White, 1675) | pt. 1, sect. 14, Of Several Distinctions of God’s Will, pp. 56-57</span></figcaption>

</figure><figure class="quote" id="q-6f9facaff9" data-kw="">
<blockquote><p>The Reformed [of the 1500’s and 1600’s], by contrast [from the Lutherans], argue a hidden will of God to bestow special saving grace irresistibly upon the elect, a voluntas decreti sive beneplaciti arcana [will of decree or hidden good-pleasure], more ultimate than the revealed will of God to offer salvation to all by means of a universal grace… The voluntas signi vel praecepti, the will of the sign or precept, is the voluntas revelata, or revealed will, of God and the voluntas moralis, or moral will, according to which God reveals in signs and precepts his plan for mankind both in the law and in the gospel. Here, again, the Lutherans and Reformed differ insofar as the former [the Lutherans] deny the contrast between a universally offered salvation revealed in the voluntas signi and a secret elective will in the voluntas beneplaciti. … The Reformed further argue the distinction of the voluntas decreti vel beneplaciti [will of decree or good-pleasure] or voluntas decernens [decreeing will] into the categories of voluntas efficiens, effecting will, and voluntas permittens, permitting will. Under the former category, God is viewed as directly or indirectly through instrumental causes effecting his positive will, whereas under the latter category God is understood as permitting both contingent events and acts of free will even when such events and acts go against his revealed will.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The Reformed [of the 1500’s and 1600’s], by contrast [from the Lutherans], argue a hidden will of God to bestow special saving grace irresistibly upon the elect, a voluntas decreti sive beneplaciti arcana [will of decree or hidden good-pleasure], more ultimate than the revealed will of God to offer salvation to all by means of a universal grace… The voluntas signi vel praecepti, the will of the sign or precept, is the voluntas revelata, or revealed will, of God and the voluntas moralis, or moral will, according to which God reveals in signs and precepts his plan for mankind both in the law and in the gospel. Here, again, the Lutherans and Reformed differ insofar as the former [the Lutherans] deny the contrast between a universally offered salvation revealed in the voluntas signi and a secret elective will in the voluntas beneplaciti. … The Reformed further argue the distinction of the voluntas decreti vel beneplaciti [will of decree or good-pleasure] or voluntas decernens [decreeing will] into the categories of voluntas efficiens, effecting will, and voluntas permittens, permitting will. Under the former category, God is viewed as directly or indirectly through instrumental causes effecting his positive will, whereas under the latter category God is understood as permitting both contingent events and acts of free will even when such events and acts go against his revealed will.”

— Richard Muller, Dictionary of Latin &amp; Greek Theological Terms, ed. (Baker, 1985), pp. 222, 329 &amp; 332-33 | voluntas Dei, ‘the will of God’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Reformed+%5Bof+the+1500%E2%80%99s+and+1600%E2%80%99s%5D%2C+by+contrast+%5Bfrom+the+Lutherans%5D%2C+argue+a+hidden+will+of+God+to+bestow+special+saving+grace+irresistibly+upon+the+elect%2C+a+voluntas+decreti+sive+beneplaciti+arcana+%5Bwill+of+decree+or+hidden+good-pleasure%5D%2C+more+ultimate+than+the+revealed+will+of+God+to+offer+salvation+to+all+by+means+of+a+universal+grace%E2%80%A6+The+voluntas+signi+vel+praecepti%2C+the+will+of+the+sign+or+precept%2C+is+the+voluntas+revelata%2C+or+revealed+will%2C+of+God+and+the+voluntas+moralis%2C+or+moral+will%2C+according+to+which+God+reveals+in+signs+and+precepts+his+plan+for+mankind+both+in+the+law+and+in+the+gospel.+Here%2C+again%2C+the+Lutherans+and+Reformed+differ+insofar+as+the+former+%5Bthe+Lutherans%5D+deny+the+contrast+between+a+universally+offered+salvation+revealed+in+the+voluntas+signi+and+a+secret+elective+will+in+the+voluntas+beneplaciti.+%E2%80%A6+The+Reformed+further+argue+the+distinction+of+the+voluntas+decreti+vel+beneplaciti+%5Bwill+of+decree+or+good-pleasure%5D+or+voluntas+decernens+%5Bdecreeing+will%5D+into+the+categories+of+voluntas+efficiens%2C+effecting+will%2C+and+voluntas+permittens%2C+permitting+will.+Under+the+former+category%2C+God+is+viewed+as+directly+or+indirectly+through+instrumental+causes+effecting+his+positive+will%2C+whereas+under+the+latter+category+God+is+understood+as+permitting+both+contingent+events+and+acts+of+free+will+even+when+such+events+and+acts+go+against+his+revealed+will.%E2%80%9D%0A%0A%E2%80%94+Richard+Muller%2C+Dictionary+of+Latin+%26+Greek+Theological+Terms%2C+ed.+%28Baker%2C+1985%29%2C+pp.+222%2C+329+%26+332-33+%7C+voluntas+Dei%2C+%E2%80%98the+will+of+God%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6f9facaff9.html&amp;via=5Sola

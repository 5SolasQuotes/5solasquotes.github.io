<blockquote><p>2… Look yonder on the amiable Jesus Christ (for a marriage between whom and thy precious soul I am now wooing). Do but observe his condescending willingness to be united to thee: That great Ahasuerus courts his own captive Esther. The Potter makes suit to his own clay, woos thee, though He wants [needs] thee not; is infinitely happy without thee, yet is not, cannot be satisfied but with thee. Heark how He commands, entreats, begs thee to be reconciled, 2 Cor. 5:20; Swears and pawns his life upon it, that He desires not thy death, Eze. 33:11; seals his oath with his blood; and if after all this thou art fond of thine own damnation and hadst rather be at an agreement with Hell, than with Him; see how the brinish tears trickle down his cheeks, Lk. 19:41-42. He weeps for thee, that dost not, wilt not weep for thyself: Nay, after all this obdurate obstinacy, is resolved still to wait, that He may be gracious, Isa. 30:18. Stands yet and knocks, though his head be wet with rain, and his locks with the dew of the night; fain He would have thee open the door, that He may be come in and sup with thee, and thou with Him, Rev. 3:20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-lye.html">Thomas Lye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Morning Exercise Methodized (London: E.M., 1660), Sermon 18</cite>, p. 397</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b4d63f5295" data-kw="">
<blockquote><p>So in the 23rd [of] Proverbs, v. 26. ‘My son give me thy heart;’ ‘O my son,’ says God, ‘give Me thy heart;’ Christ is the Everlasting Father, and He says, ‘My son, give me thy heart, come to Me.’ One place more in the 3rd [chapter of] Revelation is worth your observing; ‘Behold, I stand at the door and knock, if any man hear my voice and open the door, I will come in to him and will sup with him, and he with Me:’ ‘Behold I stand at the door and knock;’ I came down from heaven into mine ordinances, I knock at the door of your hearts and consciences, if any man will open now, if any many would have water of life from me, if any man would have bread of life from Me, if any man would have communion with Me, let him but open and receive Me in, and I will sup with him and he with Me: what sweet invitations have we from Christ, how forward, how ready is the Lord Jesus to do poor sinners good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-greenhill.html">Ezekiel Greenhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons of Christ… (London: R.I., 1656), “Christ’s Willingness to Save Sinners, Sermon 1”</cite>, p. 156</span></figcaption>

 Online</a></div>
</figure><figure class="quote" id="q-71d1c41f51" data-kw="">
<blockquote><p>Or it may be taken as a poetical figure designed to represent the subject more affectingly. God, in his Word and ordinances, is thus to be welcomed by us, 1. With great readiness: the doors and gates must be thrown open to Him. Let the Word of the Lord come into the innermost and uppermost place in our souls; and, if we had 600 necks, we should bow them all to the authority of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Whole Bible | on Ps. 24, verses 7-10</cite></span></figcaption>

</figure><figure class="quote" id="q-67b703ed0b" data-kw="">
<blockquote><p>Christ makes the feast, Lk. 15:23, and the angels make the music, verse 7. But if men will not receive the tenders of grace, Christ grieves, Mk. 3:5. He is like a judge that passes the sentence with tears in his eyes, Lk. 19:42, ‘And when He came nigh the city, He wept.’ ‘Ah sinners, I come to save you, but you put away salvation from you (Acts 13). I come with healing under my wings, but you bolt out your Physician; I would have you but open your hearts to receive Me, and I will open Heaven to receive you, but you will rather stay with your sins and die, than come to Me and live, Ps. 81:11, ‘Israel would none of me.’ Well sinners, I will weep at your funerals.’ Oh how lovely is Christ in his disposition! He comes with his supplying oil to pour into sinners’ wounds; He would fain break their hearts with his mercies, He labors to overcome their evil with his good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saint’s Delight (London: T.R., 1657), “Christ’s Loveliness”</cite>, pp. 353-54</span></figcaption>

</figure><figure class="quote" id="q-4f4d498e05" data-kw="">
<blockquote><p>‘Alas, this business is beyond my strength, I cannot change mine own heart; though there are encouragements and helps, I know not which way to go, nor how to plead them.’ Well, but is the Spirit of God able to quicken thee, and to teach thee, and to enable thee? He stands especially engaged, ’tis his immediate work to prevail upon the heart. Go to the Spirit, and beg of Him, that He would lead thee to the Father, and to Christ, that thou mayst have fellowship with the Father and the Son. ‘Alas, I cannot go unto the Spirit, I have so long resisted Him, so often grieved Him, with what face can I go? I am unworthy of his guidance.’ Well, but Jesus Christ stands engaged; and never speak of merit that day thou speakest of Christ. Go to Christ, and beg that He would send his Spirit into thy heart. Jesus Christ is thy Kinsman, he knows how to pity thee; and the Spirit of Grace is at his dispose. Oh then go to Christ. ‘Alas, I cannot go to Christ, I have no ability to go, nor so much as a will to move towards Him. I cannot go to Christ.’ Well, but the Father is engaged to draw thee, though thou canst not go; a man may be drawn, which has no natural willingness of his own. The Father stands engaged to change the will, and absolute promises are theirs that lay claim to them (provided they do not overthrow their own claim). Go therefore and tell the Father thy case.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-annesley.html">Samuel Annesley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Communion with God, in Two Sermons… (London: Tyler, 1655), sermon 2</cite>, pp. 41-42</span></figcaption>

<div class="actions"><button class="copy" data-copy="“‘Alas, this business is beyond my strength, I cannot change mine own heart; though there are encouragements and helps, I know not which way to go, nor how to plead them.’ Well, but is the Spirit of God able to quicken thee, and to teach thee, and to enable thee? He stands especially engaged, ’tis his immediate work to prevail upon the heart. Go to the Spirit, and beg of Him, that He would lead thee to the Father, and to Christ, that thou mayst have fellowship with the Father and the Son. ‘Alas, I cannot go unto the Spirit, I have so long resisted Him, so often grieved Him, with what face can I go? I am unworthy of his guidance.’ Well, but Jesus Christ stands engaged; and never speak of merit that day thou speakest of Christ. Go to Christ, and beg that He would send his Spirit into thy heart. Jesus Christ is thy Kinsman, he knows how to pity thee; and the Spirit of Grace is at his dispose. Oh then go to Christ. ‘Alas, I cannot go to Christ, I have no ability to go, nor so much as a will to move towards Him. I cannot go to Christ.’ Well, but the Father is engaged to draw thee, though thou canst not go; a man may be drawn, which has no natural willingness of his own. The Father stands engaged to change the will, and absolute promises are theirs that lay claim to them (provided they do not overthrow their own claim). Go therefore and tell the Father thy case.”

— Samuel Annesley, Communion with God, in Two Sermons… (London: Tyler, 1655), sermon 2, pp. 41-42">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98Alas%2C+this+business+is+beyond+my+strength%2C+I+cannot+change+mine+own+heart%3B+though+there+are+encouragements+and+helps%2C+I+know+not+which+way+to+go%2C+nor+how+to+plead+them.%E2%80%99+Well%2C+but+is+the+Spirit+of+God+able+to+quicken+thee%2C+and+to+teach+thee%2C+and+to+enable+thee%3F+He+stands+especially+engaged%2C+%E2%80%99tis+his+immediate+work+to+prevail+upon+the+heart.+Go+to+the+Spirit%2C+and+beg+of+Him%2C+that+He+would+lead+thee+to+the+Father%2C+and+to+Christ%2C+that+thou+mayst+have+fellowship+with+the+Father+and+the+Son.+%E2%80%98Alas%2C+I+cannot+go+unto+the+Spirit%2C+I+have+so+long+resisted+Him%2C+so+often+grieved+Him%2C+with+what+face+can+I+go%3F+I+am+unworthy+of+his+guidance.%E2%80%99+Well%2C+but+Jesus+Christ+stands+engaged%3B+and+never+speak+of+merit+that+day+thou+speakest+of+Christ.+Go+to+Christ%2C+and+beg+that+He+would+send+his+Spirit+into+thy+heart.+Jesus+Christ+is+thy+Kinsman%2C+he+knows+how+to+pity+thee%3B+and+the+Spirit+of+Grace+is+at+his+dispose.+Oh+then+go+to+Christ.+%E2%80%98Alas%2C+I+cannot+go+to+Christ%2C+I+have+no+ability+to+go%2C+nor+so+much+as+a+will+to+move+towards+Him.+I+cannot+go+to+Christ.%E2%80%99+Well%2C+but+the+Father+is+engaged+to+draw+thee%2C+though+thou+canst+not+go%3B+a+man+may+be+drawn%2C+which+has+no+natural+willingness+of+his+own.+The+Father+stands+engaged+to+change+the+will%2C+and+absolute+promises+are+theirs+that+lay+claim+to+them+%28provided+they+do+not+overthrow+their+own+claim%29.+Go+therefore+and+tell+the+Father+thy+case.%E2%80%9D%0A%0A%E2%80%94+Samuel+Annesley%2C+Communion+with+God%2C+in+Two+Sermons%E2%80%A6+%28London%3A+Tyler%2C+1655%29%2C+sermon+2%2C+pp.+41-42&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4f4d498e05.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4f4d498e05.html

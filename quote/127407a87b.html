<blockquote><p>CHAP. XXXVII. CONCERNING THE SECOND DEGREE OF THE DECLARATION OF GODS LOVE. The second degree, is Justification, whereby such as believe, are accounted just before God, through the obedience of Christ Jesus. 2. Cor. 5. 21. He has made him to be sin for us, who knew no sin: that we should be made the righteousness of God in him. 1. Cor. 1. 30. Rom. 5. 19. As by one man’s disobedience many were made sinners, so by the obedience of one (that is, Jesus Christ) shall many also be made righteous. Quest. Whether did Christ perform full obedience to the Law, for us men alone, or for himself also? Answ. I. Not for himself, as some not rightly would have him: for the flesh of Christ being hypostatically united to the Word, and so in it self fully sanctified, was even from the first moment of conception, most worthy to be blessed with eternal life. Therefore, by all that obedience which he performed after his conception, Christ merited nothing for himself. II. For us, namely, for the faithful, he fulfilled all the righteoussness of the law and hence it is, that he is called the end of the law unto righteousness, to every one who believes, Rom. 10. 4. Here may be objected: I. Christ as he is man, is bound to perform obedience to the law for himself. Answ. He is not bound by nature, but of his own accord: for he was not a mere man, but God and man. And albeit Christ did never suffer nor fulfill the law, but in that flesh which he took upon him; yet by reason of the hypostatical union, this his passion and obedience has respect unto the whole person, considered as God and man, and therefore his obedience was not due on his part, and so was without merit to himself yea, in that the flesh of Christ is united to the person of the Word, and so exalted in dignity and sanctity, above all angels, it may seem to be exempted from this natural obligation of performing the law. II. Object. If then Christ performed the law for us, we are no more bound to the observance of the same: as we do not undergo eternal punishments for our sins, the which Christ in his person did bear upon the cross. Answer. If we keep the same respect of performing obedience to the law, the consequence is very true, otherwise it is not so: for Christ performed obedience to the law for us, as it is the satisfaction of the law: but the faithful they are bound to obedience, not as it is satisfactory, but as it is a document of faith, and a testimony of their gratitude towards God, or a means to edify their neighbours: even as Christ suffering eternal punishments for our sins, we also suffer punishments, as they are either trials, or chastisments unto us. III. Object. The law and justice of God do not togither exact both, namely obedience, and punishment. Answ. In man’s perfect estate, the justice of God requires only obedience: but in his estate corrupted, he requires both obedience, and punishment. Punishment, as the law is violated: Obedience, that legal justice may be performed. Gal. 3. 10. It is therefore plain, that not only Christ’s passion, but also his legal obedience, is our righteousness before God. Justification hath two parts: Remission of sins, and imputation of Christs righteoussness. Remission of sins, is that part of justification, whereby he that believeth, is freed from the guilt and punishment of sin, by the passion of Christ. Col. 1. 21, 22. You has he now reconciled in the body of his flesh thorough death, to make you holy and blameless, and without fault in his sight. 1. Pet. 2. 24. Who, in his own flesh, bore our sins in his body, on the tree, that we being delivered from sin, should live in righteousness, by whose stripes you are healed. Imputation of righteousness, is the other part of justification, whereby such as believe, having the guilt of their sins covered, are accounted just in the sight of God, through Christ’s righteousness. 2. Cor. 5. 21. Psal. 32. 1. Blessed is he, whose wickedness is forgiven, and whose sin is covered. Rom. 4. the whole chapter, where the Apostle repeats imputation eleven times. Phil. 3. 8, 9. I have counted all things loss, and do judge them to be dung, that I might win Christ, and might be found in him, that is, not having my own righteousness that is by the law, but that which is through the faith of Christ, even the righteousness [note] which is of faith. The form of justification, is, as it were, a kind of translation of the believer’s sins to Christ, and again Christ’s righteousness unto the believer, by a reciprocal or mutual imputation. As is apparent in this picture following.</p></blockquote>

<blockquote><p>Here the preceding cause [in Rom. 3:24] is Christ constituted a propitiation in his blood. In this impulsive cause, two things are noted: First, Christ’s justice or obedience is the meritorious cause of our salvation; Second, this justice and obedience consists in full satisfaction for our sins and complete fulfillment of the Law for us. Concerning the first, that Christ’s justice is the meritorious cause of our salvation: since it seems to conflict that we are saved by free grace and by merit, that is, a price paid, it must be thus understood. Christ’s merit opposes not God’s judgment simply or in itself, for Christ, as man and Son of God by the union of divine and human natures, has this of grace, not having earned it. As Augustine testifies, in Him the predestination of grace most clearly shines, so His merit opposes not God’s grace but is subordinate to it, depending thereon. But both God’s grace and Christ’s merit oppose our works, each in its order. Thus, grace, from which merit flows, and merit, whereby we are saved, stand together. This is proved by texts conjoining God’s love, Christ’s propitiation, reconciliation, redemption, and ransom, and by the same and like texts proving that Christ by His obedience truly merited salvation for us. For if He fully satisfied for our sins, paid the penalties due, appeased God’s wrath, and acquired eternal life, He rightly merited salvation for us. Merit here we call the most sufficient price to satisfy God’s judgment for sins and penalties and to acquire eternal life. In sum, respecting God, all is free; respecting God’s appeased wrath through the Son, there is merit, yet freely given to you. Concerning the second, that Christ’s justice consists in full satisfaction for our sins and complete fulfillment of the Law: Christ’s most full and perfect obedience or justice, whereby we are justified when imputed, includes both complete satisfaction for all sins and fulfillment of all the Law requires of us. For He was made under the Law for us, which demands two things: that we commit nothing against it, and omit nothing of it. Otherwise, it thunders woe against both him that does not what he ought and him that does what he ought not. But Christ is the fulfilling of the Law unto salvation for all that believe (Rom. 10). The righteousness of the Law is fulfilled in us, not by us, but in our Head, Christ, for us. Thus, chiefly, Christ by His obedience satisfied for our sins, bearing most sufficient penalties, whence Scripture greatly commends the benefit of Christ’s death, for by it we are redeemed from death. But He also perfectly fulfilled the Law for us, not only by suffering but by doing—yea, in suffering He acts, for He offers Himself as priest and is offered as victim (Rom. 4). Not only are sins not imputed, being remitted, but Christ’s justice is imputed, He who was made justice for us (1 Cor. 1:30). Yet to understand this rightly, note that Christ’s justice is threefold: First, essential, common to the three Persons, which is God Himself, for whatsoever is in God is God; Second, habitual justice, adorning His human nature from conception with purity far beyond angelic, yet created; Third, actual justice, whereby throughout His life, especially in suffering that death, He rendered obedience to the Father. This third alone enters the account of the merit of our justification, whereby we are not only redeemed from death but obtain eternal life through this perfect obedience perfectly rendered to the Law by Christ for us. … The matter of justification, as the term is variously taken, is considered by theologians not in one way, but it reduces to this: the matter is either the subject in which and from which this benefit arises, namely, Christ’s imputed justice, as taught above, which imputation includes both absolution from injustice through remission of sins (by which term Scripture often synecdochically comprehends the whole benefit of salvation) and the adjudication of Christ’s justice (Dan. 9, Rom. 4, 8, mentioning not only remission but the gift of justice); or the subject receiving this benefit, which is all and only the elect (Rom. 8, proved first a priori, because they are elect, then a posteriori, because they are justified). The form of justification is this application of Christ’s justice through faith, or that free imputation whereof we spoke (Rom. 4, Phil. 3, 2 Cor. 5), where the phrase ‘in Him’ notes two things: first, our justice is not inherent in us but Christ’s, existing outside us, yet ours by right of donation; second, we have Christ’s justice as Christ has our sin—not subjectively but relatively, by imputation, as shall be said in explicating the effects.</p></blockquote>

t of all the Law requires of us. For He was made under the Law for us, which demands two things: that we commit nothing against it, and omit nothing of it. Otherwise, it thunders woe against both him that does not what he ought and him that does what he ought not. But Christ is the fulfilling of the Law unto salvation for all that believe (Rom. 10). The righteousness of the Law is fulfilled in us, not by us, but in our Head, Christ, for us. Thus, chiefly, Christ by His obedience satisfied for our sins, bearing most sufficient penalties, whence Scripture greatly commends the benefit of Christ’s death, for by it we are redeemed from death. But He also perfectly fulfilled the Law for us, not only by suffering but by doing—yea, in suffering He acts, for He offers Himself as priest and is offered as victim (Rom. 4). Not only are sins not imputed, being remitted, but Christ’s justice is imputed, He who was made justice for us (1 Cor. 1:30). Yet to understand this rightly, note that Christ’s justice is threefold: First, essential, common to the three Persons, which is God Himself, for whatsoever is in God is God; Second, habitual justice, adorning His human nature from conception with purity far beyond angelic, yet created; Third, actual justice, whereby throughout His life, especially in suffering that death, He rendered obedience to the Father. This third alone enters the account of the merit of our justification, whereby we are not only redeemed from death but obtain eternal life through this perfect obedience perfectly rendered to the Law by Christ for us. … The matter of justification, as the term is variously taken, is considered by theologians not in one way, but it reduces to this: the matter is either the subject in which and from which this benefit arises, namely, Christ’s imputed justice, as taught above, which imputation includes both absolution from injustice through remission of sins (by which term Scripture often synecdochically comprehends the whole benefit — Sr. Lucas Trelcatius, Commonplaces of Holy Theology, “Of Justification”, “Part Constructive”, p. 137 in Trelcatius Sr. &amp; Jr., Opuscula Theologica Omnia (d. 1602; Leiden: Orlers &amp; Maire, 1614), trans. AI at Confessionally Reformed Theology. Trelctius Sr. (1542–1602) was a reformed theologian and professer at Leiden, Netherlands.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHere+the+preceding+cause+%5Bin+Rom.+3%3A24%5D+is+Christ+constituted+a+propitiation+in+his+blood.+In+this+impulsive+cause%2C+two+things+are+noted%3A+First%2C+Christ%E2%80%99s+justice+or+obedience+is+the+meritorious+cause+of+our+salvation%3B+Second%2C+this+justice+and+obedience+consists+in+full+satisfaction+for+our+sins+and+complete+fulfillment+of+the+Law+for+us.+Concerning+the+first%2C+that+Christ%E2%80%99s+justice+is+the+meritorious+cause+of+our+salvation%3A+since+it+seems+to+conflict+that+we+are+saved+by+free+grace+and+by+merit%2C+that+is%2C+a+price+paid%2C+it+must+be+thus+understood.+Christ%E2%80%99s+merit+opposes+not+God%E2%80%99s+judgment+simply+or+in+itself%2C+for+Christ%2C+as+man+and+Son+of+God+by+the+union+of+divine+and+human+natures%2C+has+this+of+grace%2C+not+having+earned+it.+As+Augustine+testifies%2C+in+Him+the+predestination+of+grace+most+clearly+shines%2C+so+His+merit+opposes+not+God%E2%80%99s+grace+but+is+subordinate+to+it%2C+depending+thereon.+But+both+God%E2%80%99s+grace+and+Christ%E2%80%99s+merit+oppose+our+works%2C+each+in+its+order.+Thus%2C+grace%2C+from+which+merit+flows%2C+and+merit%2C+whereby+we+are+saved%2C+stand+together.+This+is+proved+by+texts+conjoining+God%E2%80%99s+love%2C+Christ%E2%80%99s+propitiation%2C+reconciliation%2C+redemption%2C+and+ransom%2C+and+by+the+same+and+like+texts+proving+that+Christ+by+His+obedience+truly+merited+salvation+for+us.+For+if+He+fully+satisfied+for+our+sins%2C+paid+the+penalties+due%2C+appeased+God%E2%80%99s+wrath%2C+and+acquired+eternal+life%2C+He+rightly+merited+salvation+for+us.+Merit+here+we+call+the+most+sufficient+price+to+satisfy+God%E2%80%99s+judgment+for+sins+and+penalties+and+to+acquire+eternal+life.+In+sum%2C+respecting+God%2C+all+is+free%3B+respecting+God%E2%80%99s+appeased+wrath+through+the+Son%2C+there+is+merit%2C+yet+freely+given+to+you.+Concerning+the+second%2C+that+Christ%E2%80%99s+justice+consists+in+full+satisfaction+for+our+sins+and+complete+fulfillment+of+the+Law%3A+Christ%E2%80%99s+most+full+and+perfect+obedience+or+justice%2C+whereby+we+are+justified+when+imputed%2C+includes+both+complete+satisfaction+for+all+sins+and+fulfillment+of+all+the+Law+requires+of+us.+For+He+was+made+under+the+Law+for+us%2C+which+demands+two+things%3A+that+we+commit+nothing+against+it%2C+and+omit+nothing+of+it.+Otherwise%2C+it+thunders+woe+against+both+him+that+does+not+what+he+ought+and+him+that+does+what+he+ought+not.+But+Christ+is+the+fulfilling+of+the+Law+unto+salvation+for+all+that+believe+%28Rom.+10%29.+The+righteousness+of+the+Law+is+fulfilled+in+us%2C+not+by+us%2C+but+in+our+Head%2C+Christ%2C+for+us.+Thus%2C+chiefly%2C+Christ+by+His+obedience+satisfied+for+our+sins%2C+bearing+most+sufficient+penalties%2C+whence+Scripture+greatly+commends+the+benefit+of+Christ%E2%80%99s+death%2C+for+by+it+we+are+redeemed+from+death.+But+He+also+perfectly+fulfilled+the+Law+for+us%2C+not+only+by+suffering+but+by+doing%E2%80%94yea%2C+in+suffering+He+acts%2C+for+He+offers+Himself+as+priest+and+is+offered+as+victim+%28Rom.+4%29.+Not+only+are+sins+not+imputed%2C+being+remitted%2C+but+Christ%E2%80%99s+justice+is+imputed%2C+He+who+was+made+justice+for+us+%281+Cor.+1%3A30%29.+Yet+to+understand+this+rightly%2C+note+that+Christ%E2%80%99s+justice+is+threefold%3A+First%2C+essential%2C+common+to+the+three+Persons%2C+which+is+God+Himself%2C+for+whatsoever+is+in+God+is+God%3B+Second%2C+habitual+justice%2C+adorning+His+human+nature+from+conception+with+purity+far+beyond+angelic%2C+yet+created%3B+Third%2C+actual+justice%2C+whereby+throughout+His+life%2C+especially+in+suffering+that+death%2C+He+rendered+obedience+to+the+Father.+This+third+alone+enters+the+account+of+the+merit+of+our+justification%2C+whereby+we+are+not+only+redeemed+from+death+but+obtain+eternal+life+through+this+perfect+obedience+perfectly+rendered+to+the+Law+by+Christ+for+us.+%E2%80%A6+The+matter+of+justification%2C+as+the+term+is+variously+taken%2C+is+considered+by+theologians+not+in+one+way%2C+but+it+reduces+to+this%3A+the+matter+is+either+the+subject+in+which+and+from+which+this+benefit+arises%2C+namely%2C+Christ%E2%80%99s+imputed+justice%2C+as+taught+above%2C+which+imputation+includes+both+absolution+from+injustice+through+remission+of+sins+%28by+which+term+Scripture+often+synecdochically+comprehends+the+whole+benefit+of+salvation%29+and+the+adjudication+of+Christ%E2%80%99s+justice+%28Dan.+9%2C+Rom.+4%2C+8%2C+mentioning+not+only+remission+but+the+gift+of+justice%29%3B+or+the+subject+receiving+this+benefit%2C+which+is+all+and+only+the+elect+%28Rom.+8%2C+proved+first+a+priori%2C+because+they+are+elect%2C+then+a+posteriori%2C+because+they+are+justified%29.+The+form+of+justification+is+this+application+of+Christ%E2%80%99s+justice+through+faith%2C+or+that+free+imputation+whereof+we+spoke+%28Rom.+4%2C+Phil.+3%2C+2+Cor.+5%29%2C+where+the+phrase+%E2%80%98in+Him%E2%80%99+notes+two+things%3A+first%2C+our+justice+is+not+inherent+in+us+but+Christ%E2%80%99s%2C+existing+outside+us%2C+yet+ours+by+right+of+donation%3B+second%2C+we+have+Christ%E2%80%99s+justice+as+Christ+has+our+sin%E2%80%94not+subjectively+but+relatively%2C+by+imputation%2C+as+shall+be+said+in+explicating+the+effects.%E2%80%9D%0A%0A%E2%80%94+Sr.+Lucas+Trelcatius%2C+Commonplaces+of+Holy+Theology%2C+%E2%80%9COf+Justification%E2%80%9D%2C+%E2%80%9CPart+Constructive%E2%80%9D%2C+p.+137+in+Trelcatius+Sr.+%26+Jr.%2C+Opuscula+Theologica+Omnia+%28d.+1602%3B+Leiden%3A+Orlers+%26+Maire%2C+1614%29%2C+trans.+AI+at+Confessionally+Reformed+Theology.+Trelctius+Sr.+%281542%E2%80%931602%29+was+a+reformed+theologian+and+professer+at+Leiden%2C+Nethe <blockquote><p>27. By the righteousness of Christ imputed to us we cannot be said absolutely or in every respect to be righteous, as if, on account of it, God regarded us as though we had performed all things required of us by his law. For then, after that righteousness of Christ had been admitted and accepted, God could demand no obedience to his law from us on our part. But by the righteousness of Christ imputed to us God esteems us righteous insofar as we have been transgressors of the divine law; so that we are said to be made righteous by that righteousness of Christ insofar as by our disobedience we had been constituted unrighteous. For Christ did not satisfy for all those things which we were bound to do by the law (for He would then have come into the world to dissolve the law), but only for those things which we had done against the law, or which, when we ought to have done them, we did not do.</p></blockquote>

<blockquote><p>XVII. (2) The adjudication of eternal life, with respect to its right (Rom. 6:22; Jn. 3:16), for when the guilt of eternal death is taken away through absolution, the right of eternal life cannot but follow it. So that from this, it is perceived with no trouble that there is not a real distinction between absolution from eternal death and adjudication of eternal life. For just as there is also not a real difference between satisfaction and merit, such that absolution must be sought in only satisfaction and the right to eternal life in only merit, and then the former, that is, satisfaction, in only passive righteousness, and the latter in only active. For the dikaioma on account of which we are justified, as it includes without division both forms of the righteousness of Christ, so also it provides without division the cause on account of which also we are freed from the guilt of sin, and receive the right to every good, just as we taught elsewhere explicitly (1.5.18 §XIV; §XI, above).</p></blockquote>

<blockquote><p>Q. 21. Why doth God mention not only servants but beasts?

A. As he would not have servants enslaved and abused by such labour as should unfit them for sabbath work and comfort, so he would have man exercise the clemency of his nature, even towards the brutes; and beasts cannot labour, but man will be put to some labour or diversion by it: and God would have the whole place where we dwell, and all that we have to do with, to bear an open signification of our obedience to his command, and our reverence to his sanctified day and worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catechising of Families. A Teacher of Householders how to Teach their Households</cite>, (1682) in The Practical Works of Richard Baxter (4 vols, London: George Virtue, 1838), 3: 129.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2be9b15777" data-kw="">
<blockquote><p>It is most probable that no gift, no pains a man takes to fit himself for preaching, shall ever do good to the people or himself, except a man labor to have and keep his heart in a spiritual condition before God, depending on Him always for furniture and the blessing. Earnest faith and prayer, a single aim at the glory of God, and good of people, a sanctified heart and carriage, shall avail much for right preaching. There is sometime somewhat in preaching that cannot be ascribed either to the matter or expression, and cannot be described what it is, or from whence it comes, but with a sweet violence, it pierces into the heart and affections, and comes immediately from the Lord. But if there be any way to attain to any such thing, it is by a heavenly disposition of the speaker.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-livingstone.html">John Livingstone</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Remarks on Preaching and Praying in Public by John Livingstone’</cite>, vol. 1, p. 287</span></figcaption>

</figure><figure class="quote" id="q-88d4f9e359" data-kw="">
<blockquote><p>This is an advertisement very needful; because many are apt to skip over the lesson concerning the means (that will fill up this whole treatise) as superfluous and useless. When once they know the nature and excellency of the duties of the law, they account nothing wanting but diligent performances; and they rush blindly on immediate practice, making more haste than good speed. They are quick in promising, ‘All that the Lord has spoken, we will do,’ (Exod. 19:8), without sitting down and counting the cost. They look on holiness as only the means of an end, of eternal salvation: not as an end itself, requiring any great means for attaining the practice of it. The enquiry of most, when they begin to have a sense of religion, is ‘What good thing shall I do, that I may have eternal life?’ (Matt. 19:16); not, ‘How shall I be enabled to do anything that is good?’ Yea, many that are accounted powerful preachers spend all their zeal in the earnest pressing the immediate practice of the law, without any discovery of the effectual means of performance – as if the works of righteousness were like those servile employments that need no skill and artifice at all, but industry and activity. That you may not stumble at the threshold of a religious life by this common oversight, I shall endeavor to make you sensible that it is not enough for you to know the matter and reason of your duty, but that you are also to learn the powerful and effectual means of performance before you can successfully apply yourselves to immediate practice. And, for this end, I shall lay before you the considerations following. …Sanctification, by which our hearts and lives are conformed to the law, is a grace of God communicated to us by means, as well as justification, and by means of teaching, and learning something that we cannot see without the Word (Acts 26:17, 18). There are several things pertaining to life and godliness that are given through knowledge (2Peter 1:2, 3). There is a form of doctrine made use of by God to make people free from sin, and servants of righteousness (Rom. 6:17, 18). And there are several pieces of the whole armor of God necessary to be known and put on, that we may stand against sin and Satan in the evil day (Eph. 6:13). Shall we slight and overlook the way of sanctification, when the learning the way of justification has been accounted worth so many elaborate treatises?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-marshall.html">Walter Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gospel Mystery of Sanctification</cite>, (An interview on this work. More resources on sanctification)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-900138a031" data-kw="">
<blockquote><p>Mark well how many parsonages or vicarages are there in the realm, which at the least have a plow-land a-piece. Then note the lands of bishops, abbots, priors, nuns, knights of St John’s, cathedral churches, colleges, chauntries, and free-chapels. For though the house fall in decay, and the ordinance of the founder be lost, yet will not they lose the lands. What cometh once in, may never more out. They make a free-chapel of it; so that he which enjoyeth it shall do nought therefore. Besides all this, how many chaplains do gentlemen find at their own cost, in their houses? How many sing for souls, by testaments? Then the proving of testaments, the prizing of goods, the bishop of Canterbury’s prerogative; is that not much through the realm in a year? Four offering days, and priuy tithes. There is no servant, but that he shall pay somewhat of his wages. None shall receive the body of Christ at Easter, be he never so poor a beggar, or never so young a lad or maid, but they must pay somewhat for it. …What get they also by confessions? Yea, and many enjoin penance, to give a certain [sum] for to have so many masses said, and desire to provide a chaplain themselves; soul-masses, dirges, month-minds, year-minds, All-souls-day, and trentals. The mother church, and the high altar, must have somewhat in every testament. Offerings at priests’ first masses. Item, no man is professed, of whatsoever religion it be, but he must bring somewhat. The hallowing, or rather conjuring of churches, chapels, altars, super-altars, chalice, vestments, and bells. Then book, bell, candlestick, organs, chalice, vestments, copes, altar-cloths, surplices, towels, basins, ewers, ship, censer, and all manner ornament, must be found them freely; they will not give a mite thereunto. Last of all, what swarms of begging friars are there! The parson sheareth, the vicar shaveth, the parish priest polleth, the friar scrapeth, and the pardoner pareth; we lack but a butcher to pull off the skin.</p></blockquote>

— William Tyndale, Doctrinal Treatises and Introductions to Different Portions of the Holy Scriptures. Originally published 1525, ed. Henry Walter (Cambridge: Parker Society , 1848), 236–238.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMark+well+how+many+parsonages+or+vicarages+are+there+in+the+realm%2C+which+at+the+least+have+a+plow-land+a-piece.+Then+note+the+lands+of+bishops%2C+abbots%2C+priors%2C+nuns%2C+knights+of+St+John%E2%80%99s%2C+cathedral+churches%2C+colleges%2C+chauntries%2C+and+free-chapels.+For+though+the+house+fall+in+decay%2C+and+the+ordinance+of+the+founder+be+lost%2C+yet+will+not+they+lose+the+lands.+What+cometh+once+in%2C+may+never+more+out.+They+make+a+free-chapel+of+it%3B+so+that+he+which+enjoyeth+it+shall+do+nought+therefore.+Besides+all+this%2C+how+many+chaplains+do+gentlemen+find+at+their+own+cost%2C+in+their+houses%3F+How+many+sing+for+souls%2C+by+testaments%3F+Then+the+proving+of+testaments%2C+the+prizing+of+goods%2C+the+bishop+of+Canterbury%E2%80%99s+prerogative%3B+is+that+not+much+through+the+realm+in+a+year%3F+Four+offering+days%2C+and+priuy+tithes.+There+is+no+servant%2C+but+that+he+shall+pay+somewhat+of+his+wages.+None+shall+receive+the+body+of+Christ+at+Easter%2C+be+he+never+so+poor+a+beggar%2C+or+never+so+young+a+lad+or+maid%2C+but+they+must+pay+somewhat+for+it.+%E2%80%A6What+get+they+also+by+confessions%3F+Yea%2C+and+many+enjoin+penance%2C+to+give+a+certain+%5Bsum%5D+for+to+have+so+many+masses+said%2C+and+desire+to+provide+a+chaplain+themselves%3B+soul-masses%2C+dirges%2C+month-minds%2C+year-minds%2C+All-souls-day%2C+and+trentals.+The+mother+church%2C+and+the+high+altar%2C+must+have+somewhat+in+every+testament.+Offerings+at+priests%E2%80%99+first+masses.+Item%2C+no+man+is+professed%2C+of+whatsoever+religion+it+be%2C+but+he+must+bring+somewhat.+The+hallowing%2C+or+rather+conjuring+of+churches%2C+chapels%2C+altars%2C+super-altars%2C+chalice%2C+vestments%2C+and+bells.+Then+book%2C+bell%2C+candlestick%2C

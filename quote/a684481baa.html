<blockquote><p>He that smiteth his Father or Mother, shall die the death. This is an other law in this Chap. which maketh for the exposition of that Commandment of honouring them, &amp; is to be referred to it. We may note in it, how God doth not say, he that killeth Father or Mother shall be killed for it; but he that smiteth, so that not so much as a tip is to be given to parents upon pain of death, no not with the tong may we smite them, that is, by any evil and unfit words abuse them, as you may at large read in the exposition of that Commandment. So great is the honour of Parents before God, and so sharp a Judge is God against all abusers of them: Little thought of by too many in our days, &amp; the rather because continually in the Church there is not a beating of these points of Catechism into Children’s heads, and hearts, by careful Ministers.

O, that they would be once drawn to do this duty in their several Churches: Soon, soon should they find the Fruit of it, and the greatness of their Sin in so long neglecting it. In Plato an heathen we read the like law, wherein is decreed that all beating and contumelies of Parents should be punished with perpetual banishment and death. By the Roman laws the slayer of his parents was not to be slain either with sword or fire, or other ordinary punishment, sed in sutus culeo, &amp;c. sowed in a sack with a Dog, a Cock, a Viper, and an Ape, he should be thrown into the Sea or River, that the ayre whilst he lived, and the earth when he was dead might be denied him, who so had wronged them that gave him a life and being in the air and upon the earth. A good Writer testifieth he saw one put to death at Tigurine who had cursed and reviled his Mother.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Comfortable notes upon the books of Exodus and Leviticus, as before upon Genesis Gathered and laid down still in this plain manner, for the good of them that cannot use better helps, and yet are careful to read the Scriptures, and very desirous to find the comfort in them. … With a table of the prin</cite>, (London: Thomas Chard, 1604), pp 333-34.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4d4d76bc79" data-kw="">
<blockquote><p>Vice prevailing greatly weakens a people and makes them far less able to uphold and defend themselves. It weakens them as it enfeebles their bodies, and so renders them the more unfit for the fatigue and hardship and warlike achievements necessary for the defence of a nation. It weakens them, as it thins their numbers. Proverbs 14:28, “In the multitude of people is the king’s honour: but in the want of people is the destruction of the prince.”

It weakens them as it enfeebles their minds and renders them effeminate. It weakens them as it consumes their wealth. The strength and power of a nation or kingdom consists very much in their wealth. It has ever been found by experience that nations or kingdoms [that] have been very much overrun with luxury and sensuality, that they have declined and have been an easy prey to their enemies.

Thus sin is a reproach to any people, as they thereby lose their power and influence, and so lose their honour and expose themselves to [the] contempt and the insults of their neighbours; and often by this means are reduced from a prosperous and flourishing state, to become subjects and slaves to foreigners’ honour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sin and Wickedness bring Calamity and Misery on a People (1729) in Sermons and Discourses, 1723-1729</cite></span></figcaption>

<blockquote><p>47. The matter may further be thus illustrated: There is almost the like respect and consideration of the Magistrate as he is occupied about the outward things of the Church, and of the ecclesiastic ministry as it is occupied about the inward or spiritual part of civil government, that is, about those things which in the government of the commonwealth belong to the conscience. It is one thing to govern the commonwealth, and to make political and civil laws; another thing to interpret the Word of God, and out of it to show to the Magistrate his duty, to wit, how he ought to govern the commonwealth and in what manner he ought to use the sword. The former is proper and peculiar to the Magistrate (neither does the ministry intermeddle or entangle itself into such businesses), but the latter is contained within the office of the ministers. … 63. The same sin therefore in the same man may be punished one way by the civil, another way by the ecclesiastical power; by the civil power under the formality of a crime, with corporal or pecuniary punishment; By the ecclesiastical power, under the notion and nature of scandal, with a spiritual censure, even as also the same civil question is one way deliberate upon and handled by the Magistrate in the Senate or place of Judgment; another way by the minister of the Church, in the presbytery or synod; by the magistrate so far as it pertains to the government of the commonwealth, by the minister, so far as it respects the conscience; for the ecclesiastical ministry also is exercised about civil things spiritually, in so far as it teaches and admonishes the magistrate out of the Word of God what is best and most acceptable unto God, or as it reproves freely unjust judgments, unjust wars, and the like, and out of the Scripture threatens the wrath of God to be revealed against all unrighteousness of men; So also is the magistrate said to be occupied civilly about spiritual things.</p></blockquote>

<blockquote><p>[If the child’s soul comes from the parents through the sperm and egg:] What will become of so much seed that is lost, which either falls from them that sleep, or is unhonestly lost, or being received into the womb does not come to conception? Will so many souls of men be lost, or shall they be choked in the womb? or shall they remain alone without matter, seeing it is certain that they belong not to the number of men.</p></blockquote>

<blockquote><p>So the love-tokens and testimonial rings and bracelets of the Husband, my love to the saints, my keeping of his word, my holy walking in Christ, being the works of his Spirit, which dwelt in Jesus Christ, are actu primo [the first act], in themselves, as infallible signs of the Bridegroom’s love to me; as the Beloved’s word who spake and said, ‘Arise, my love’: And if the spirations and breathings of the Spirit go not along, both the voice and the love-bracelets (for Christ is no more counterfeit in his love-tokens than in his word when He speaks as a Husband) are alike ineffectual to persuade the soul.</p></blockquote>

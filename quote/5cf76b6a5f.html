<main class="wrap"><figure class="quote" id="q-5cf76b6a5f" data-kw="">
<blockquote><p>V. …the conscience has no one between itself and God by whom it may be known and judged. As it is known to God alone, so can it be judged by Him alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, p. 287 of Question 31, ‘Does a legislative power properly so called, of enacting laws binding the conscience, belong to the church? Or only an ordaining (diataktike) power, of sanctioning constitutions and canons for the sake of good order (eutaxian)? The former we deny; the latter we affirm against the Romanists.’ under ‘Ecclesiastical Power’ in the 18th topic, ‘The Church’ in Institutes, vol. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“V. …the conscience has no one between itself and God by whom it may be known and judged. As it is known to God alone, so can it be judged by Him alone.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8116813603" data-kw="">
<blockquote><p>And thus for the Judicial Laws, because they were given to them as a politic body, that polity ceasing, which was the principal, the accessory falls with it; so that the Ceremonial Law, in the judgement of all, had still bound Christians, were there not special revocations of these commands, and were there not reasons for their expiration from the very nature of them. Now no such thing can be affirmed by the Moral Law; for the matter of that is perpetual, and there are no places of Scripture that do abrogate it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Moral Law &amp; the Covenants</cite>, (London: Young, 1647), p. 168</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-f2d4439522" data-kw="">
<blockquote><p>Question 8: May a guilty person plead not guilty, or deny the fact? Answer: Common use is the interpreter of words: If the common use of those words does make their public sense a lie, it may not be done. But if the forensic [legal] common use of the denial is taken to signify no more but this, ‘Let him that accuses me, prove it’ [then]: I am not bound to accuse my self, or, in foro [in court] I am not guilty till it be proved, then it is lawful to plead ‘not-guilty’ and deny the fact, except in cases wherein you are bound to an open confession, or in which the scandal will do more hurt than the denial will do good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), pt 4, ch. 22, ‘Cases &amp; Directions Against Injurious Law-Suits, Witnessing &amp; Judgment’, p. 149</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“Question 8: May a guilty person plead not guilty, or deny the fact? Answer: Common use is the interpreter of words: If the common use of those words does make their public sense a lie, it may not be done. But if the forensic [legal] common use of the denial is taken to signify no more but this, ‘Let him that accuses me, prove it’ [then]: I am not bound to accuse my self, or, in foro [in court] I am not guilty till it be proved, then it is lawful to plead ‘not-guilty’ and deny the fact, except in cases wherein you are bound to an open confession, or in which the scandal will do more hurt than the denial will do good.”

</figure><figure class="quote" id="q-ccff3f6b3e" data-kw="">
<blockquote><p>Though Saul’s destroying of the Amalekites in that cause was moral, in regard ‘they lay in wait for Israel, when they came out of Egypt,’ and so of perpetual obligation, yet the destroying of them, 1 Sam. 15, is temporary and obliges not us:

1. Because that generation were their sons, not those same persons that oppressed Israel when they came out of Egypt, and we may not punish the sons for the sins of their fathers with death; therefore God’s positive command to Saul, and the reason, ‘I remember what Amalek did’ (in Moses his time) ‘therefore kill them,’ does not oblige us, except we had the like command.

2. Because the slaying of man, woman, infant and suckling, ox and sheep, was temporary and cannot have a perpetually obligatory ground in the Law of nature or natural justice obliging us.

3. Where there is an injury done to God against the Law of nature and against our brethren in drawing them from serving the true God, and a punishment commanded by God to be inflicted once; that punishment, or the like in substance and nature, must ever be such as obliges us in the like cases; The learned professors in Leiden say, ‘They can see no reason but they must oblige under the New Testament.’ I confess when the fault is ceremonial, though the punishment be real, as the cutting off of an infant not circumcised [Gen. 17:14], and some punishments inflicted on the leper, it is not reason the Law should oblige us in the New Testament, either as touching the punishment or the degree. Because these punishments for typical faults are ordained to teach rather than to be punishments, and the Magistrate by no light of nature could make laws against unbaptized infants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), p. 299</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-fd42fb2623" data-kw="">
<blockquote><p>For what actions have no good, nor lawfulness, nor aptitude to edify in themselves, these the will of man can never make good, lawful and apt to edify, because only God, whose will is the prime rule of all goodness, can create moral goodness in actions: Not to eat of the fruit of the Tree of Knowledge is only good because God has so appointed in his Law, and to eat of the fruit of that tree had been as lawful and just as not to eat, if God had commanded eating thereof, under promises and threatnings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), p. 648</span></figcaption>

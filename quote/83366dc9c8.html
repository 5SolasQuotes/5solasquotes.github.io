<main class="wrap"><figure class="quote" id="q-83366dc9c8" data-kw="">
<blockquote><p>The reasons the man adds of this his assertion contain the grand plea of all idolaters, heathenish and antichristian: &quot;Whatever is given to them,&quot; saith he, &quot;who are in that subordination is given to God.&quot; So said the Pagans of old, so say the Papists at this day; all redounds to the glory of God, when they worship stocks and stones, because he appoints them so to do. And so said the Israelites when they worshipped the golden calf: &quot;It is a feast to Jehovah.&quot;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Evangelicae</cite>, ch. 19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-99848ae32d" data-kw="">
<blockquote><p>The phrase that follows, “before my face,” makes the offense more heinous because God is provoked to jealousy as often as we substitute our own inventions in place of him. This is like a shameless woman who brings in an adulterer before her husband’s very eyes only to vex his mind the more.… Therefore, when God by his present power and grace testified that he kept watch over the people whom he had chosen, he warned them—to keep them even more from the crime of rebellion—that they could introduce no new gods without his witnessing and observing their sacrilege.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.8.16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/first-table-commandments-1-4.html">First Table (Commandments 1-4)</a> › <a href="../topics/the-law-of-god/first-table-commandments-1-4/first-commandment.html">First commandment</a></span><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“The phrase that follows, “before my face,” makes the offense more heinous because God is provoked to jealousy as often as we substitute our own inventions in place of him. This is like a shameless woman who brings in an adulterer before her husband’s very eyes only to vex his mind the more.… Therefore, when God by his present power and grace testified that he kept watch over the people whom he had chosen, he warned them—to keep them even more from the crime of rebellion—that they could introduce no new gods without his witnessing and observing their sacrilege.”

— John Calvin, Institutes of the Christian Religion, 2.8.16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+phrase+that+follows%2C+%E2%80%9Cbefore+my+face%2C%E2%80%9D+makes+the+offense+more+heinous+because+God+is+provoked+to+jealousy+as+often+as+we+substitute+our+own+inventions+in+place+of+him.+This+is+like+a+shameless+woman+who+brings+in+an+adulterer+before+her+husband%E2%80%99s+very+eyes+only+to+vex+his+mind+the+more.%E2%80%A6+Therefore%2C+when+God+by+his+present+power+and+grace+testified+that+he+kept+watch+over+the+people+whom+he+had+chosen%2C+he+warned+them%E2%80%94to+keep+them+even+more+from+the+crime+of+rebellion%E2%80%94that+they+could+introduce+no+new+gods+without+his+witnessing+and+observing+their+sacrilege.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+2.8.16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F99848ae32d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/99848ae32d.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-20d92c6b49" data-kw="">
<blockquote><p>(2) To LOVE anything more than God, is to make it a god. If we love our ESTATE more than God, we make it a god.… The covetous man is called an idolater. Eph 5:5. Why so? Because he loves his estate more than God, and so makes it his god. Though he does not bow down to an idol, if he worships the engraved image in his coins, he is an idolater. That which has most of the heart, we make a god of. If we love our PLEASURE more than God, we make a god of it.… If we love our BELLY more than God, we make a god of it. “Whose god is their belly.” Phil 3:19.… But to mind nothing but the indulging of the appetite, is idolatry.… If we love a CHILD more than God, we make a god of it.… This is to make an idol of a child, and to set it in God’s place. Thus God is often provoked to take away our children. If we love the jewel more than him who gave it, God will take away the jewel, that our love may return to him again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, First Commandment (love as heart idolatry)</span></figcaption>

</figure><figure class="quote" id="q-238d431ef1" data-kw="">
<blockquote><p>It is known that this duty is frequently enjoined and prescribed unto us: Col. 3:5, “Mortify therefore your members which are upon the earth; fornication, uncleanness, inordinate affection, evil concupiscence, and covetousness, which is idolatry.” … The “members that are upon the earth” are our affections: for in the outward part of the body sin is not seated; in particular, not “covetousness,” which is there enumerated, to be mortified amongst our members that are on the earth. Yea, after grace hath taken possession of the soul, the affections do become the principal seat of the remainders of sin.… Hence the great duty of mortification is chiefly directed to take place upon the affections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Mortification of Sin in Believers</cite>, on Col. 3:5 (covetousness which is idolatry)</span></figcaption>

</figure><figure class="quote" id="q-0602870132" data-kw="Mary Queen of Heaven Idolatry">
<blockquote><p>This saying of Christ openly and manifestly warns men to beware lest, by too superstitiously elevating the honor of the name of mother in the Virgin Mary, they transfer to her what belongs exclusively to God. … For Mary has been constituted the Queen of Heaven, the Hope, the Life, and the Salvation of the world; and, in short, their fury and madness proceeded so far that they stripped Christ of his spoils, and left him almost naked.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Gospel according to John</cite>, John 2:4</span></figcaption>

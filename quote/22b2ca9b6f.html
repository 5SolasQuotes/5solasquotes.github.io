<main class="wrap"><figure class="quote" id="q-22b2ca9b6f" data-kw="">
<blockquote><p>In an extensive sense, God is a Father, and is so revealed in his works as well as his Word. The paternal relation among men aids us in contemplating the loving relation in which God stands to his creatures: it is a shadow and representation of the Divine Fatherhood. Fatherly dispositions and dealings are ascribed to Him. By creation, He is the Father of intelligent beings. Angels are those “sons of God” that shouted for joy when “the morning stars,” at the dawn of creation, “sang together.” (Job 38:7) Men are “his offspring,” and He is “the Father of the spirits of all flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works Doctrinal and Practical of Thomas Houston</cite>, (1876), vol. 1, The Adoption of Sons, ch. 3, The Fatherhood of God, p. 128</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-45d5f9a9b5" data-kw="">
<blockquote><p>First, What is this love of God in Christ? Here I take it actively for the love wherewith He loves us. Love may be considered: First, as an attribute or a perfection in God; so it is said, 1 John 4:8, ‘God is love.’ Which notes his readiness, self-propension or inclination to do good. Secondly, as it relates and passes out to the creature; so there is a common love and a special love. His common love is set forth: Ps. 145:9, ‘The Lord is good to all, and his tender mercies are over all his works.’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“A Practical Exposition Upon the Fifty-Third Chapter of Isaiah: the First Verse” in The Complete Works of Thomas Manton</cite>, (London: Nisbet &amp; Co., 1873), vol. 3, pp. 210–11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-bc6445d2aa" data-kw="">
<blockquote><p>Here we see what care about our salvation is manifested by our Heavenly Father, who wishes us to take hold of his power and goodness, that we may know how great it is, and may partake of it more and more abundantly; for He would wish to deal with us on the same familiar terms as with his children, if we did not prevent Him by our wickedness. Since, therefore, we are incapable of enjoying his fatherly tenderness, He must display his strength and majesty, that, being awed by it, and affected by the anticipation of the judgment, we may humbly entreat Him, and sincerely implore peace and pardon. Now, this is done when we are truly converted to Him; for, so long as we please ourselves, and flatter our vices, we cannot but displease Him; and, on the other hand, if we enter into peace with Him, we must make war against Satan and sin. How earnestly God desires to be reconciled to us appears still more clearly from the repetition of the words. He might have said, in a single word, that He is merciful and ready to bestow pardon; and therefore, when He twice repeats the words, ‘that he may make peace with Me,’ He declares that willingly and most earnestly He hastens to blot out all our offenses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Isaiah</cite>, 27:5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-5fb64f8045" data-kw="">
<blockquote><p>This disposition [in Eze. 18:33] proves that God is ready to pardon, to forbear, and to forgive sins if only people were willing to come to their senses. But because they continue to be stubborn and to reject every remedy, He is tortured, as it were, by their wickedness.</p></blockquote>

</figure><figure class="quote" id="q-359936c78b" data-kw="">

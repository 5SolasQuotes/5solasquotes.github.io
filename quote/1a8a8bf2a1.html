<main class="wrap"><figure class="quote" id="q-1a8a8bf2a1" data-kw="">
<blockquote><p>…also some punishments were merely symbolic, to teach the detestation of such a vice, as the boring with an aul the ear of him that loved his master, and desired still to serve him, and the making of him his perpetual servant. I should think the punishing with death the man that gathered sticks on the Sabbath was such;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Right of Church Government (London, 1646), ch. 22, quest. 18</cite>, p. 494</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4bc153b4ac" data-kw="">
<blockquote><p>Hence also works of necessity, not only for preservation of life, but also for comfort and comeliness of life, are not unlawful; for it is a gross mistake to think that works only of absolute necessity are allowed only upon this day; for to lead an ox to water [Lk. 13:16], which in the strictest times was not disallowed of, is not of absolute necessity, for it may live more than a day without it; only it is necessary for the comfort of the life of the beast: how much more is allowed to the comfort of the life of man! The disciples possibly might have lived longer than the Sabbath without rubbing corn ears [Mt. 12:1], and men may live on Sabbath days generally without warm meat, yea, they may fast perhaps all that day; yet it is not unlawful to eat such meat, because it is necessary for the comfort of life. Hence also to put on comely garments, to wash hands and face, and many such thnigs as are necessary tor the comeliness as well as the comfort of life, are not unlawful now;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-shepard.html">Thomas Shepard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sanctification of the Sabbath in The Works of Thomas Shepard… (d. 1649; Boston, 1853)</cite>, pp. 258-59</span></figcaption>

v>
</figure><figure class="quote" id="q-51aa640d50" data-kw="">
<blockquote><p>56. Doubt: How should I know when to begin and conclude the Lord’s day? Resolution: It it a great question among divines: For mine own part (with submission) I think it begins at the dawning of the day, when Christ arose: I know it is said (Gen. 1) ‘The evening and the morning’ and not ‘The morning and the evening;’ nor dare I say it is an Histero proteron, for the often inculcating of it seems to point at some mystery: But this I say, that though it be granted that the natural day and particularly the Sabbath, containing four and twenty hours, had its revolution from evening to evening, yet nothing hinders why the Christian Sabbath may not be from morning to morning; for seeing the Lord’s Day is kept in memory of Christ’s resurrection, why should it not as well begin at the hour and minute, as be celebrated on the day that he rose from the dead?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/adam-martindale.html">Adam Martindale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divinity-Knots Unloosed… (London, 1649), ch. 12, pp. 53-54 Martindale (1623-1686) was an English presbyterian minister who had taken the Solemn League &amp; Covenant.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

ank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4c3302b976" data-kw="">
<blockquote><p>When these things were finished, ‘the evening and the morning,’ Moses tells us, ‘were the first day.’ By ‘the evening’ here we understand not the beginning of the day according to the calculation which the Jews make during their festival seasons, but the close of the preceding day, and by the morning the beginning of the following day. Therefore Moses says ‘and the evening was,’ i.e., the darkness came on: just as he who labors during the day rests in the evening and on the following morning resumes his toils. Thus terminated the first day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-venema.html">Herman Venema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Translation of Hermann Venema’s inedited Institutes of Theology tr. Alexander W. Brown (d. 1787; Edinburgh: T&amp;T Clark, 1850), ch. 19, Creation</cite>, p. 344</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-69bd674b2a" data-kw="">
<blockquote><p>4. That this whole time is, as far as may be, to be employed in some or other of these exercises. That it cannot all of it be actually so attended, will be considered afterwards: … 3. …The whole Sabbath is not to be spent in public, nor yet in private ordinarily, except when the providence of God prevents the opportunity of public assemblies, which is wont [accustomed] to fall out in times of persecution… … 2. Such as fall out extraordinarily, or on special occasions, which put unavoidable necessity of intermitting the proper duties of the Day; and if we do not attend them, we shall be further exposed. And of this sort are: (1.) To fight or fly from an invading enemy: if not to be aggressors on such a Day, yet to stand on their own defense, when assaulted. The law of self-preservation calls for it, and the thing itself puts by duties of worship, and if this were not a duty, but unlawful, we should by it become a prey to them that hate us. And as to flying, when oppressed on a Sabbath by a prevailing foe, against whom we cannot defend ourselves, our Savior supposes it lawful, though afflictive, in Mt. 24:20, ‘Pray that your flight be not on the Sabbath Day.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Body of Divinity… (Boston, 1726), Sermon 172, Q. 60</cite>, pp. 584-88</span></figcaption>

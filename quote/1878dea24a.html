<main class="wrap"><figure class="quote" id="q-1878dea24a" data-kw="">
<blockquote><p>If he [the opponent] judge the terms of our communion lawful [in the Church of Scotland], then he must either join and keep communion with us, or maintain that a Church, the terms of whose communion are lawful, or, to keep to our these [thesis], in which there are no sinful terms of communion imposed, is yet to be separated from. This is a new tenet, never known before among men that called themselves presbyterians. I think they had reason, who, when these [separatist] men began to call themselves ‘the true presbyterians of the Chuch of Scotland’ [after the Glorious Revolution of 1689], they called them ‘the new presbyterians’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gavin-hamilton.html">Gavin Hamilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Just Reflections upon a Pamphlet entitled, A Modest Reply to a Letter from a Friend to Mr. John M’millan ([London] 1712)</cite>, p. 36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-7964ffdaea" data-kw="">
<blockquote><p>Use 2: It may teach us what to judge of the Seperatists, or Brownists… 1. Because they seperate where Christ keeps fellowship, Rev. 1:18, and that He walks with us, we argue, because He is still pleased to dispense to us the Word of Life, and edifies many souls thereby, and therefore surely Christ has fellowship, and shall man be more pure than his Maker? where Christ vouchsafes fellowship, shall man renounce it? … 2. But they say that our Church consists of a mixed multitude, so was that 2 Chron. 20:13, when Jehoshaphat assembled all Judah before the Lord, there was a mixed multitude (Num. 11:4), and they did it out of fear, and yet it was a true Church, and so is ours, though there be a mixed multitude. And yet this falling off, because it is not from the main doctrine, but from the skirts, and some circumstantials, therefore they do not fall utterly from Christ, but yet it is not possible but they weaken their faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary, or an Exposition with Observations, Reasons, and uses upon the First Epistle General of John (London: Parkhurst, 1658), on 1 Jn. 2:19</cite>, pp. 156-57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-2ac0a9a91f" data-kw="">
<blockquote><p>…whatsoever a man holds, though his conscience be never so much taken with it, yet if it cannot stand with the power of godliness, but destroys it, if this man be in a Christian society after all means used to reduce him, if he still perseveres in it, he is, notwithstanding his conscience, to be cast out of the society of the saints; This is not a little matter, if a man has any conscience in him, it cannot but be a dreadful thing to him: If poison be got into a glass, and you cannot wash it out, the poison and glass too is to be thrown into the sink: Such a man as this is, with the conscience that he has, is to be thrown upon the dunghill. If a man by his wickedness cuts himself off from the mystical body of Christ, the Church may cut him off from his visible, he has forfeited his Church-priviledge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum, to the Lovers of Truth and Peace. Heart-Divisions Opened… (London: Robert Davvlman, 1653)</cite>, ch. 6, p. 34</span></figcaption>

</figure><figure class="quote" id="q-188d83d849" data-kw="">
<blockquote><p>That principle, whereby they maintain the lawfulness of gathering churches out of Churches, acknowledged by themselves to be true Churches. A most dividing principle, insofar as it gives way for every man to separate from his own, and to join himself with another church supposed purer, with contempt of the former congregation. To gather churches out of Churches, is the way to destroy, but not to heal diseased Churches; It is to destroy many churches for making up of one, as if one going about the cure of a natural body should cut off and take out all the sound members and leave the rotten and diseased members either to cure one another or to perish. A strange and desperate way of cure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Refutation of the Errors: Toleration, Erastianism, Independency &amp; Separation… (d. 1667; Edinburgh: 1692), ‘Sermon preached before the synod at Glasgow, 1653’</cite>, pp. 246-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

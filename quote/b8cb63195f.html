<main class="wrap"><figure class="quote" id="q-b8cb63195f" data-kw="">
<blockquote><p>I answer that… Therefore, that toward which God has ordered the creature with regard to himself is said to be willed by him as by a first intention or by an antecedent will. But when a creature is impeded from this end because of its defect, God still fulfills in it the goodness of which it is capable; and this pertains, as it were, to his second intention and it is called a consequent will. Thus, since God made all men for blessedness, he is said to will the salvation of all men by an antecedent will; but since some are turned against their own salvation, whom the order of his wisdom does not allow to come to salvation because of their defect, he fulfills in them what pertains to his goodness in another way, namely, condemning them by justice; so that whereas they do not attain to the first order of his will, they fall into the second; and while they do not carry out God’s will, the will of God is fulfilled in them. However, the very defect of sin by which someone is rendered worthy of punishment in the present or else the future is not willed by God either by an antecedent or a consequent will, but it is only permitted by him… and neither did he order him to salvation according to the order of predestination, which is the order of absolute will; rather, to the extent that this order is from himself, he gave to him a nature ordered to beatitude. Reply Obj. 1: Neither order nor distinction comes from the act of the will, but only from the things willed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether the divine will can be distinguished by antecedent and consequent?’ in Disputed Questions, On Truth</cite>, question 23, On the Will of God</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>[Margin note:] How far the will of sign may be a will Question 33, Whether the will of sign may improperly and metonymically be the will of God? Response: The will of sign, according as it designates what is the pleasing and acceptable revealed will of God to us, that which is of our duty, so it is called the approving will, contradistinguished from the will of good-pleasure [of decree], and refers to two things: 1. To that which we ought to believe or do, inasmuch as that is obliging of consciences, since we ought to will to please God and will the reward of obedience following. 2. It refers to obedience, and this so far as God displays that to us by an act, either through special grace or a common concursus. The first will is of complacency and is properly called will, whose object is the duty of the rational creature. In this way God sincerely [serio] approves and wills obedience, and is pleased in this moral good as a rule and norm, and it is not less a will than that which is called of good-pleasure [or the will of decree]. But the latter way is not an executing will as the will of good-pleasure is, nor does God will, intend or decree through grace or concursus, to work in the creatures that which He commands or prohibits, because He commands or prohibits it. And in this way the will of sign is so far improperly called ‘the will of sign’; indeed, the punishment is called the wrath of God, because assuredly God punishes that which is done, as men are accustomed to do such being angry and in the passion of wrath, being aroused and agitated, although nonetheless, passions do not occur in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Scholastic Disputation on Divine Providence, chs. 1-10</cite>, (Edinburgh, 1649), Metaphysical Inquiries, p. 605 Trans. T. Fentiman. A ‘metonymy’ is something that is indirectly named by something closely related to it. Rutherford here delineates the eternal foundation of the will of sign, namely what Rollock had elucidated, the will of approval in God, which wills the goodness of things in and of themselves.</span></figcaption>

<blockquote><p>(2)… Although God wills some things voluntas signi [will of sign, or the revealed will], like the repentance of the reprobate, the faith of Judas, the non-slaying of Christ, which He nevertheless anything but decreed by voluntas beneplaciti [will of good-pleasure, or decree] as things that would never happen; and He wills some things voluntas beneplaciti, which He can anything but will voluntate signi, like the selling of Joseph or the slaying of Christ. (3) But these wills are not contrary, because they are not concerned with the same things, nor is their connection and reference the same. The object of the beneplacitum [good-pleasure of decree] is an existent eventuating [causing to become an event] in the nature of things, which is to have or not to have an actual existence, be it a good or a bad existent [existence], consonant or not with the voluntas signi. But the object of the voluntas signi is approval of the morally good and honorable or disapproval of the unjust and wicked.</p></blockquote>

<blockquote><p>I answer: For the understanding of the aforesaid, it must be noted that, according to John Damascene, the will of good pleasure is twofold, namely, antecedent and consequent: antecedent or conditional, by which He wills, as far as is in Him, the salvation of all, and absolute, by which He determinately wills something that He knows with certainty will happen. It must be understood, therefore, that it is not possible for any will of God to be overcome; it is not possible for any to be rendered void; yet it is possible for some, such as the antecedent, not to be fulfilled; and it is necessary for some, such as the consequent, to be fulfilled, and it is impossible for it to be hindered. None, I say, is possible to be overcome. For if a man does not do what God wills, as far as is in him, by the antecedent will, God does with him what He wills by the consequent will; and thus it is always fulfilled either of the man or by the man, and thus it is never vanquished or overcome. Nor is it possible for the will of God to be rendered void. For something is said to be void when it is deprived of its proper effect, for which it is: but no will is deprived of the effect for which it is properly. For what is said, that God wills all men to be saved, as far as is in Him, this will does not connote salvation, nor is it properly for the effect of salvation, but it connotes the ordination of nature or a nature ordainable to salvation. Hence it is nothing more to say: God wills this person to be saved, as far as is in Him, than that it pleased God to give this person a nature through which he could arrive at salvation, and that God was prepared to help, so that salvation does not fail because of a defect on the part of God. Hence it is not rendered void, because it has its proper effect. But concerning the absolute will, it is plain that it cannot be rendered void, because it posits all its effect and never remains unfulfilled. Since, therefore, it is true that the will of God can in no way be overcome or rendered void, yet it is necessary that the absolute will be fulfilled, but the conditional will not at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1 | dist. 47 | Treatment of the Questions</span></figcaption>

<div class="actions"><button class="copy" data-copy="“I answer: For the understanding of the aforesaid, it must be noted that, according to John Damascene, the will of good pleasure is twofold, namely, antecedent and consequent: antecedent or conditional, by which He wills, as far as is in Him, the salvation of all, and absolute, by which He determinately wills something that He knows with certainty will happen. It must be understood, therefore, that it is not possible for any will of God to be overcome; it is not possible for any to be rendered void; yet it is possible for some, such as the antecedent, not to be fulfilled; and it is necessary for some, such as the consequent, to be fulfilled, and it is impossible for it to be hindered. None, I say, is possible to be overcome. For if a man does not do what God wills, as far as is in him, by the antecedent will, God does with him what He wills by the consequent will; and thus it is always fulfilled either of the man or by the man, and thus it is never vanquished or overcome. Nor is it possible for the will of God to be rendered void. For something is said to be void when it is deprived of its proper effect, for which it is: but no will is deprived of the effect for which it is properly. For what is said, that God wills all men to be saved, as far as is in Him, this will does not connote salvation, nor is it properly for the effect of salvation, but it connotes the ordination of nature or a nature ordainable to salvation. Hence it is nothing more to say: God wills this person to be saved, as far as is in Him, than that it pleased God to give this person a nature through which he could arrive at salvation, and that God was prepared to help, so that salvation does not fail because of a defect on the part of God. Hence it is not rendered void, because it has its proper effect. But concerning the absolute will, it is plain that it cannot be rendered void, because it posits all its effect and never remains unfulfilled. Since, therefore, it is true that the will of God can in no way be overcome or rendered void, yet it is necessary that the absolute will be fulfilled, but the conditional will not at all.”

— Bonaventure, Commentary on the Sentences (d. 1274), bk. 1 | dist. 47 | Treatment of the Questions">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+answer%3A+For+the+understanding+of+the+aforesaid%2C+it+must+be+noted+that%2C+according+to+John+Damascene%2C+the+will+of+good+pleasure+is+twofold%2C+namely%2C+antecedent+and+consequent%3A+antecedent+or+conditional%2C+by+which+He+wills%2C+as+far+as+is+in+Him%2C+the+salvation+of+all%2C+and+absolute%2C+by+which+He+determinately+wills+something+that+He+knows+with+certainty+will+happen.+It+must+be+understood%2C+therefore%2C+that+it+is+not+possible+for+any+will+of+God+to+be+overcome%3B+it+is+not+possible+for+any+to+be+rendered+void%3B+yet+it+is+possible+for+some%2C+such+as+the+antecedent%2C+not+to+be+fulfilled%3B+and+it+is+necessary+for+some%2C+such+as+the+consequent%2C+to+be+fulfilled%2C+and+it+is+impossible+for+it+to+be+hindered.+None%2C+I+say%2C+is+possible+to+be+overcome.+For+if+a+man+does+not+do+what+God+wills%2C+as+far+as+is+in+him%2C+by+the+antecedent+will%2C+God+does+with+him+what+He+wills+by+the+consequent+will%3B+and+thus+it+is+always+fulfilled+either+of+the+man+or+by+the+man%2C+and+thus+it+is+never+vanquished+or+overcome.+Nor+is+it+possible+for+the+will+of+God+to+be+rendered+void.+For+something+is+said+to+be+void+when+it+is+deprived+of+its+proper+effect%2C+for+which+it+is%3A+but+no+will+is+deprived+of+the+effect+for+which+it+is+properly.+For+what+is+said%2C+that+God+wills+all+men+to+be+saved%2C+as+far+as+is+in+Him%2C+this+will+does+not+connote+salvation%2C+nor+is+it+properly+for+the+effect+of+salvation%2C+but+it+connotes+the+ordination+of+nature+or+a+nature+ordainable+to+salvation.+Hence+it+is+nothing+more+to+say%3A+God+wills+this+person+to+be+saved%2C+as+far+as+is+in+Him%2C+than+that+it+pleased+God+to+give+this+person+a+nature+through+which+he+could+arrive+at+salvation%2C+and+that+God+was+prepared+to+help%2C+so+that+salvation+does+not+fail+because+of+a+defect+on+the+part+of+God.+Hence+it+is+not+rendered+void%2C+because+it+has+its+proper+effect.+But+concerning+the+absolute+will%2C+it+is+plain+that+it+cannot+be+rendered+void%2C+because+it+posits+all+its+effect+and+never+remains+unfulfilled.+Since%2C+therefore%2C+it+is+true+that+the+will+of+God+can+in+no+way+be+overcome+or+rendered+void%2C+yet+it+is+necessary+that+the+absolute+will+be+fulfilled%2C+but+the+conditional+will+not+at+all.%E2%80%9D%0A%0A%E2%80%94+Bonaventure%2C+Commentary+on+the+Sentences+%28d.+1274%29%2C+bk.+1+%7C+dist.+47+%7C+Treatment+of+the+Questions&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F10c6b7e1b6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/10c6b7e1b6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=I%20answer%3A%20For%20the%20understanding%20of,the%20conditional%20will%20not%20at%20all&amp;text=I%20answer%3A%20For%20the%20understanding%20of%20the%20aforesaid&amp;text=fulfilled%2C%20but%20the%20conditional%20will%20not%20at%20all" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Mr. [Thomas] Hooker [a congregationalist] leaves out the chief word, wherein stands the force of my argument, he speaks nothing of God’s revealed intention and command to call in fools that they may be made wise, and he frames his answer, as if I had argued from the bare intention and hidden decree of God. But I find that Mr. Hooker utterly mistakes the distinction of God’s decree, and of his approving will, and therefore he takes for one and the same, the decree or intention of God (from which I bring not my argument) and the revealed intention of God, or his commanding will: the ignorance of which is a stumbling to Arminians, and Socinians, and to Mr. Hooker, who, as we shall hear, goes on with them, but I judge it one mistake in judgment in that godly man, but no heretical spirit, and therefore his defenders and followers would take heed to it.</p></blockquote>

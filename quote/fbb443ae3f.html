<main class="wrap"><figure class="quote" id="q-fbb443ae3f" data-kw="">
<blockquote><p>Scandal or offence is not the grieving or displeasing of my brother; for peradventure when I grieve him or displease him, I do edify him; now edification and scandal are not compatible. But scandal is a word or deed proceeding from me which is, or may be, the occasion of another man’s halting or falling into, or swerving from the straight way of righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 2, ch. 8</cite>, p. 31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

<blockquote><p>…Whereas it is said we may forbear the practice of things commanded by affirmative precepts, hic et nunc [here and now], in some places, and at some times; it must always be taken with this proviso, that there be not incurred a greater and more perilous scandal by forbearance, than would probably be occasioned by practice of the thing commanded… …if we speak of the scandal tending unto sorrow and vexation, more are scandalized [in this case] at the forbearance [of it], than in likelihood would be at the practice.</p></blockquote>

</figure><figure class="quote" id="q-bda28d4fcf" data-kw="">
<blockquote><p>IX. Neither can the indifferency or lawfulness of the thing done, nor the ordinance of authority commanding the use of it, make the scandal following upon it to be only passive [and hence the commanders would be innocent], which otherwise, i.e. in case the thing were neither lawful, nor ordained by authority, should be active. Not the former; for our divines teach (Hemmings., Enchir. Theol., class 3, ch. 17; Magdeburg, Century 1, bk. 2, ch. 4, cols. 448-449) that scandalum datum [scandal given] rises sometimes, ex facto-in se adiaphoro [out of the fact in itself by the thing indifferent] when it is done intempessive, contra charitatis regulam [unseasonably contra the rule of charity]. Not the latter; for no human authority can take away the condition of scandal from that which otherwise should be scandal, because nullum homo potist vel charitati, vel conscientiis nostris imperare, vel periculum scandali d•…ti prestar•…, says a learned casuist (Ames, bk. 5, de Consc., ch. 11, q. 6). . ch. 9, p. 41 ” If this be not taken well from us, let one of our opposites speak for us, who aknowledges that human power cannot make us do that which we cannot do without giving of scandal, and that in this case, the pretext of obedience to superiors shall not excuse us at the hands of the Supreme Judge. (Dr. [John] Forbes, Iren., bk. 2, ch. 20, num. 19)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 2</cite>, ch. 8, p. 32-33</span></figcaption>

<blockquote><p>62. The duties of justice are prior and of more binding obligation than those of charity (or love). 63. Therefore, we have a greater obligation to pay our debts than to give away anything of our own. And he who offends another has a greater obligation to seek reconciliation than he who is offended.</p></blockquote>

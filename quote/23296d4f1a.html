<main class="wrap"><figure class="quote" id="q-23296d4f1a" data-kw="">
<blockquote><p>([Margin Note:] Places Haunted by Evil Spirits must be Shunned) 3rd Use. This branch of the petition serves to direct us what to do in this case: say that a dwelling house or some other place is by God’s permission haunted and abused by some evil spirit, whether may a man lawfully frequent or abide in such a place? Answer: By this petition is plain he may not; for here we pray to be delivered from evil, and therefore we may not voluntarily thrust ourselves into such a place as is haunted by the devil: would we come within the compass of the lion’s paw, or within the chain of a mad dog, or of an hunger-bitten bear? Why then should we rashly thrust ourselues into the danger of the devil, who like a roaring lion seeks continually whom he may devour. Many ignorant people are so bold-hardy that they will rai•e upon and defy the deuil, and command him to be gone. But without a calling thereunto we may not so do. Indeed, if by God’s providence we be called to live in such places necessarily, then this we may do, we must not reason with the devil, but betake ourselves to God by humble and earnest prayer, and complain of Satan’s vexation, making God our shelter and defence both for soul and body: else if we presume to meddle with him without a calling from God, we may justly be foiled and abused by him (as the sons of Sceva were, Acts 19:14,16) because we have no promise from the Lord to be protected from him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>on Mt. 6:13 in A Godly &amp; Learned Exposition of Christ’s Sermon in the Mount... (Cambridge, 1608)</cite>, pp. 315-6</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-369168cb1d" data-kw="">
<blockquote><p>When Rainer Decker was researching a sensational seventeenth-century German witchcraft trial, he discovered, much to his surprise, that in this case the papacy functioned as a force of skepticism and restraint. His curiosity piqued, he tried unsuccessfully to gain access to a secret Vatican archive housing the records of the Roman Inquisition that had been sealed to outsiders from its sixteenth-century beginnings. In 1996 Decker was one of the first of a small group of scholars allowed access… Witchcraft and the Papacy is based on these newly available materials and traces the role of the papacy in witchcraft prosecutions from medieval times to the eighteenth century. Decker found that although the medieval church did lay the foundation for witch hunts of the sixteenth to eighteenth centuries, the postmedieval papacy, and the Roman and Spanish Inquisitions, played the same kind of skeptical, restraining role during the height of the witch-hunting frenzy in Germany and elsewhere in Europe… Witchcraft and the Papacy overturns a large body of scholarship…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rainer-decker.html">Rainer Decker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Witchcraft &amp; the Papacy: An Account Drawing on the Formerly Secret Records of the Roman Inquisition Ref (Univ. of Virginia Press, 2008) 262 pp.</cite></span></figcaption>

 · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ff68bebe16" data-kw="">
<blockquote><p>This is a highly original study of demon possession and the ritual of exorcism, both of which were rife in early modern times, and which reached epidemic proportions in France… The rite of exorcism… generated as many problems as it resolved. Possessed women endured frequently violent exorcisms, exorcists were suspected of conjuring devils, and possession itself came to be seen as a form of holiness, elevating several women to the status of living saints.</p></blockquote>

</figure><figure class="quote" id="q-fd871d8b27" data-kw="">
<blockquote><p>2nd Use. If we pray God to deliver us from evil, then we must beware of all satanical practises as means of help in any distress; this is gross hypocrisy to pray against the evils of Satan and to give ourselves to the practise of them. Herein many offend, for the Papists say this prayer, but yet their religion in many things is a gross practice of magic and sorcery; for first: the consecration of their host in the mass is plain conjuration: and so are their exorcisms in halowing salt, bread, and water, their casting out of devils by certain words, by the sign of the cross, the application of relics and such like: nay, come to ourselues, what is more common among us than to use charmes and amuletts, to seek to witches and sorcerers when any strange affliction does befall us? And the setting of a figure, though it be not gross magic, yet therein is a close and privy work of the devil, his hand is deep therein: and the Church in former times has condemned it for witchcraft: for charms, characters and amulets be but the devil’s watchword and sacraments to set him a working: what though the words used be good, yet therein is Satan’s deeper policy, who turns himself into an angel of light, under fair shows working the greater mischeif. But what horrible impiety is this, that when God gives us occasion to come unto Him, we leave Him and run for help to his professed enemies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>on Mt. 6:13 in A Godly &amp; Learned Exposition of Christ’s Sermon in the Mount... (Cambridge, 1608)</cite>, p. 315</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/evil-angels.html">Evil Angels</a></span></div>

e/fd871d8b27.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-exorcism/#:~:text=2nd%20Use.%20If%20we%20pray%20God,for%20help%20to%20his%20professed%20enemies." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9941fe4cd2" data-kw="">
<blockquote><p>…though such has been the dotage, and is at this day of superstitious ones, that they think to charm the devil with their carnal exorcisms; hence the Romish reliques, cross, holy water, yea, and among the Jews themselves in corrupter times, who thought by their phylacteries and circumcision to scare away the devil, which made some of them expound that, Cant. 3:8, of circumcision, ‘Every man hath his sword on his thigh, because of fear in the night.’ By sword on the thigh, they expound circumcision, which they will vainly have given as a charm against evil spirits that affright them in the night. But alas, the devil cares for none of these, no, not for an ordinance of God, when by fleshly confidence we make it a spell: he has been often bound with these fetters and chaines (as is said of him in the Gospel) and the chains have been plucked asunder by him, neither could any man thus tame him. He esteems, as Job says of the Leviathan, iron as straw, and brass as rotten wood. It must be a stronger than the strong man must bind him, and none stronger but God the Father of spirits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gurnall.html">William Gurnall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian in Complete Armour… (London, 1655), ch. 4, section 1</cite>, pp. 197-98</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…though such has been the dotage, and is at this day of superstitious ones, that they think to charm the devil with their carnal exorcisms; hence the Romish reliques, cross, holy water, yea, and among the Jews themselves in corrupter times, who thought by their phylacteries and circumcision to scare away the devil, which made some of them expound that, Cant. 3:8, of circumcision, ‘Every man hath his sword on his thigh, because of fear in the night.’ By sword on the thigh, they expound circumcision, which they will vainly have given as a charm against evil spirits that affright them in the night. But alas, the devil cares for none of these, no, not for an ordinance of God, when by fleshly confidence we make it a spell: he has been often bound with these fetters and chaines (as is said of him in the Gospel) and the chains have been plucked asunder by him, neither could any man thus tame him. He esteems, as Job says of the Leviathan, iron as straw, and brass as rotten wood. It must be a stronger than the strong man must bind him, and none stronger but God the Father of spirits.”

<main class="wrap"><figure class="quote" id="q-8d5fdcb5fd" data-kw="">
<blockquote><p>…we conceive therefore these to be permitted.

1. All duties of piety, as was sacrificing under the Old Testament, or preaching, hearing or going about the sacraments under the New Testament: In which sense, Mt. 12, our Lord says the priests profaned the Sabbath and were blameless, not that formally they prophaned the Sabbath, or did indeed break that command, but materially they wrought in killing beasts, etc. which had been unlawful, had it not been in the exercises of piety.

2. All things that have a tendency, as necessary helps and means to the performance of the former works of piety, are lawful, as going to the congregation to hear the Law, calling the assembly for worship by trumpets, or bells, or by a voice, journeying, going or riding to Church, etc. because the duties of the Sabbath cannot well be done without some of these, nor at all without others of them. If it should be asked here, what that, which is called a Sabbaths day journey, Acts 1:12, was among the Jews? and whence it came, and what way may it be stinted or limited among Christians? Answer: It was to them 2000 cubits… It arose to be reckoned so from these grounds:

1. From their expounding Ex. 16:29, ‘Let none go out of his place;’ thus, Let none go without the bounds of the city, which with its suburbs was 2000 cubits, or a mile about.

2. That the Tabernacle of the congregation was so far from the tents of these who pitched about it in the wilderness, Num. 2, as they supposed; and that the priests kept that distance from the people in entering with the ark into Jordan, Josh. 3:4, whence they gathered that a man might still go to the ark or place of worship, as it was then in these cases at a distance from them, and no further on the Sabbath day. But we say whatever superstitiously or on custom they took up (for that is but their tradition) we cannot stint a Sabbath day’s journey to so many miles, fewer or more, but it must be as the man is in providence cast to reside further from, or nearer to the place where the ordinances are dispensed; for one may go many miles and not profane the Sabbath, if he cannot have the public ordinances nearer, whereas another may break the Sabbath by going but to his neighbor’s door, yea by walking in his own house, or to his door, if either it be done idly, or with respect to another civil or worldly end, which agrees not to that day; it is not here remoteness or nearness, but what sways us, and what is our end, that we are to try by.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition of the Ten Commandments</cite>, … (d. 1658; London: 1675), 4th Commandment, Sanctification of the Sabbath, p. 277</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-afe51e93d3" data-kw="">
<blockquote><p>A second sort of works allowed to be done on the Lord’s day: are bodily works and labors which are so necessary for the fitting and enabling of Christians to sanctify that day… And because men cannot be so cheerful in the service of God, nor so heartily rejoice before Him, not with strength and delight spend the whole day in Sabbath duties, without warm and wholesome food, and plentiful refreshing of their weak bodies, therefore the dressing, boiling, baking and roasting of meat is lawful on the Lord’s day, so far as it more helps than hinders holy duties and the service of God. This is manifest by the words of the law, Ex. 12:16, where the Lord forbidding all manner of work on his holy Sabbaths, excepts labor and work about that which people were to eat, and which was necessary for the upholding of an holy moderate feasting on those days. This was practised by the Pharisees and by our Savior and his apostles who on the Sabbath day came to a feast to the house of a chief Pharisee, Lk. 14:1-2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath</cite>, … (Amsterdam, 1638), ch. 21 Westminster divine, p. 152</span></figcaption>

<blockquote><p>…whatsoever recreations and exercises of body and mind are necessar[il]y required for the bettering of our sanctification of the Lord’s day and the enabling of us to perform with more cheerfulness, strength and courage the holy worship of God, and the work and service of his holy Sabbath, and which are also intended by us only to that end and use, them we may use, and so far as they serve to further and in no wise to hinder God’s holy worship and the immediate works and duties thereof. This is manifest by God’s allowing to his people in the Law dressing of meat and cheerful feasting on his Sabbath and holy days: which are needfull to cheer up men, and to provoke them to worship Him with all thankfulness of heart, also to put on our best apparel that we may come decently to God’s house. As these are lawful, being directed to holy use, so undoubtedly honest refreshing with recreations which cheer up the heart and refresh the spirits are lawful when they are helpful to holy exercises and are directed to that end, as stirring of the body, walking into gardens or fields to take fresh air, being found very helpful to preachers to revive their spirits, strengthen their loins, clear their voices, sharpen and quicken their wits and memories; and being done only to that end are lawful. So also walking into the corn fields in summer or harvest, or into meadows or pastures in the spring, both to refresh our bodies and spirits, and to give us occasion to admire God’s bounty in clothing the bodies, and his Fatherly providence in making the earth so fruitful, and to laud and praise Him, is lawful for us. And if after public and private exercise we do so walk about, diverse together, conferring of heavenly things and taking occasion by sight of earthly blessings to provoke one another to thankfulness and acknowledgment of God’s love, this no doubt is a recreation fit for the Lord’s day, and helps much our devotion; and this seems to have been practiced by our Savior, who went through the corn fields on the Sabbath day, Mt. 12:1, and his disciples with them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath</cite>, … (1638), ch. 21 Westminster divine, pp. 158-59</span></figcaption>

</figure><figure class="quote" id="q-16bd4886a2" data-kw="">
<blockquote><p>And in the seventh chapter [Jn. 7:23], He defends this fact of his, saying, ‘If a man upon the Sabbath receive circumcision, that the law of Moses should not be broken; be ye angry with Me, because I haue made a man every whit whole on the Sabbath day?’ If the law of circumcision do bind men to minister and receive it upon the Sabbath, then much more does the law of love bind men to show mercy upon the Sabbath, seeing that it is appointed of God, not to hinder us from, but to further us in all his works, among which the relieving of them that be in necessity, is one of the chief and principal. And as the Lord Jesus Christ came not to destroy the law, but to fulfill it, so He observed it very carefully in this point, and being most full of compassion, did declare it abundantly, by taking all oportunity to succour them that were in misery, even upon the Sabbath, as the fittest time for it.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“And in the seventh chapter [Jn. 7:23], He defends this fact of his, saying, ‘If a man upon the Sabbath receive circumcision, that the law of Moses should not be broken; be ye angry with Me, because I haue made a man every whit whole on the Sabbath day?’ If the law of circumcision do bind men to minister and receive it upon the Sabbath, then much more does the law of love bind men to show mercy upon the Sabbath, seeing that it is appointed of God, not to hinder us from, but to further us in all his works, among which the relieving of them that be in necessity, is one of the chief and principal. And as the Lord Jesus Christ came not to destroy the law, but to fulfill it, so He observed it very carefully in this point, and being most full of compassion, did declare it abundantly, by taking all oportunity to succour them that were in misery, even upon the Sabbath, as the fittest time for it.”

<blockquote><p>…that we remember especially to put all things in practice which we have learned out of the Word, and that we begin upon that very day to do all duties of love unto men, and that we show mercy vnto them then especially. Whereunto that we might be made the more fit, the whole worship of God, and the Sabbath itself is ordained, in so much that the Lord would have every whit of it to cease even upon the Sabbath, rather than mercy should not be showed to the full, or any duty of it neglected to our brethren, when both of them cannot be done together, as we have seen it before more at large.</p></blockquote>

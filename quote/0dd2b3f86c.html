<main class="wrap"><figure class="quote" id="q-0dd2b3f86c" data-kw="">
<blockquote><p>Fifthly, the union of the two natures in Christ is an inseparable union. So that from the first moment thereof, there never was, nor to eternity shall be, any separation of them. If you ask how the union remained betwixt them when Christ’s human soul and body were separated from each other upon the cross? Is not death the dissolution of union betwixt soul and body? True, the natural union betwixt his soul and body was dissolved by death for a time, but this hypostatical union remained even then as entire and firm as ever. For though his soul and body were divided from each other, yet neither of them from the divine nature. Divines assist our conception of this mystery by an apt illustration. A man that holds in his hand a sword sheathed, when he pleases, draws forth the sword, but still holds that in one hand and the sheath in the other, and then sheaths it again, still holding it in his hand; so when Christ died his soul and body retained their union with the divine nature, though not (during that space) one with another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘5th Sermon’ on Jn. 1:14 in The Fountain of Life Opened</cite>, … (London, 1673), pp. 56-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-2ddb4b27bc" data-kw="">
<blockquote><p>…it may be said of Christ whilst He was here below that in the same sense or manner wherein He bore our sicknesses, Mt. 8:17 (who yet was never personally tainted with any disease) in the same sense or manner He may be said to have born our sins, namely thus: Christ when He came to an elect child of his that was sick, whom He healed, his manner was, first by a sympathy and pity to afflict Himself with their sickness, as if it had been his own: Thus at his raising of Lazarus it is said that He groaned in spirit, etc. and so by the merit of taking the disease upon Himself, through a fellow-feeling of it, He took it off from them, being for them afflicted, as if He Himself had been sick. And this seems to be the best interpretation that I have met with of that difficult place in Mt. 8:16-17 where it is said: ‘He healed all that were sick, that it might be fulfilled which was spoken by Isaiah the prophet, saying, Himself took our infirmities, [and bare our sicknesses.]’ Now in the like way or manner unto this, of bearing our sicknesses, He might beare our sins too…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Heart of Christ in Heaven to Sinners on Earth</cite>, section 3, p. 136</span></figcaption>

el="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The union personalis in Christ was made adiairetos, indivisibly, in respect of place, so that the human nature is nowhere unsupported by the Logos, the Logos nowhere fails to support the human nature, nor is it outside the Logos or the Logos apart from it: akoristos, inseparably in respect of time, because this union is never dissolved but is perpetual, which was also seen in the death and burial…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-5d2b1e852a" data-kw="">
<blockquote><p>In the controversy that led to the schism in the Reformed Presbyterian Church of Ireland in 1840, one difference between the leaders of the differing parties, Thomas Houston and John Paul, which has not been fully appreciated is their divergence of opinion with regard to the established Church of Ireland.[1] When replying to a derogatory observation made by Paul regarding the ministers of the Irish establishment, Houston replied:

The established clergy are spoken of as “one day hunting a fox, and the next hunting their own parishioners, and shooting them as dogs for non-payment of tithes.” … Where, we may be permitted to inquire, has a single instance of the fine-drawn picture of “hunting a fox, and shooting their own parishioners,” been exhibited? If the Dr. [Paul] cannot show one, then we must set down his well-turned period as an unfounded slander on the established clergy of this country, not a few of whom are devoted and godly men. …

There could be no accusation more weighty brought against ministers of religion, that their “one day hunting foxes, and the next hunting their own parishioners, and shooting them as dogs.” Men that could act thus would be monsters in human shape. – Not even the priests of paganism are chargeable with crimes more heinous. Dr. Paul, in bringing forward this foul charge against the established clergy of this country, has equalled in virulence and slander popish priests and demagogues, who had urged on infuriated mobs for their assassination.

Thomas Houston, The Covenanter’s Narrative and Plea; Exhibiting the Error, Schism, Radicalism, and Slander of Dr. Paul, and other Separatists from the Reformed Presbyterian Church. Part I. (Belfast: Wm. Moore’s, 1841), pp 41, 41n.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>see Peter Brooke, ‘The Grand Principle of Magistratical Restraint in Matters of Religion: A Dispute in the Reformed Presbyterian Synod in Ireland, 1830-40’, http://www.peterbrooke.org.uk/p&amp;t/Northern%20Ireland/rpsynod</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ecb0bd3c80" data-kw="">
<blockquote><p>As I understand it, Paul was making one of two distinctions: (1) women in general are to remain silent in church, with only a special group of them permitted to prophesy (being marked as a special group by a peculiar kind of covering for their heads); or (2) there was a distinct kind of prophesying practised by Christian women outside of the actual worship service. It is my opinion that the latter interpretation is preferable… Women who possessed this [non-continuing] gift [of prophecy] were to demonstrate their femininity either by putting on a special kind of covering, or by wearing their hair in a particular way… they were not to exercise the gift during the corporate worship of the church (14:34)… A woman has her long hair instead of a veil to serve as her proper covering. A man is to wear his hair shorter than women do, because he is to have his head uncovered. The passage is quite specific: long hair is the equivalent of covering, while short hair is the same as an uncovered head… In conclusion, the eleventh chapter of First Corinthians has absolutely nothing to do with hats. Men may wear hats if they so desire; they may not wear long hair… What is relevant is the respective length of men and women’s hair. That is the focus of Paul’s argumentation.</p></blockquote>

</figure><figure class="quote" id="q-9c0a7ab7f1" data-kw="">
<blockquote><p>And besides, all such as enjoy the means of grace, and yet have not felt this visitation of God, should be much allured to the care of attending upon the means, and be made desirous to receive the grace of God, and that effectually: it should much move them that God has now sent them the means, and keeps his public visitation; and that God stands not upon desert, nor does He make exception of them, but offers his grace unto all, and desires not the death of any sinner, yea beseeches them to be reconciled [see 2 Cor. 5:20]; and to that end has committed the Word of reconciliation to his servants, with express commandment that they should be instant, and with all patience instruct men, and call upon them, and persuade them to save their souls.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-37f6ac98f0" data-kw="">
<blockquote><p>[A] superfluous will worship, of which there is too palpable an example and practice in this kingdom at this time, in the observation of days. No church or kingdom on earth has greater reason to take heed to it, than the Church and Kingdom of England. Because the house and service of God has been pestered, beside a multitude of superstitious observations and ceremonies, with a greater number of days, than the Church of the Jews had in the time of their ceremonial worship.

Because the Christian Sabbath or Lord’s Day has been profaned, and what has been added to other days has been added with derogation to the Lord’s Day. They have forsaken the fountain of living waters, and digged unto themselves cisterns which hold no water. Because God has called this land to mourning and fasting, as we profess this day, and I pray God that the unseasonable keeping of this festivity, which God has not commanded, be not more prevalent for evil, than the humiliation of this day for good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached to the Honourable House of Commons at their late Solemn Fast, Wednesday, December 27, 1643 in Chris Coldwell (ed.), Sermons preached before the English Houses of Parliament by the Scottish Commissioners to the Westminster Assembly of divines 1643-1645</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

7/alexander-henderson-on-will-worship-and-holy-days/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9d81b301a0" data-kw="">
<blockquote><p>Do not imagine that no one can please God while he is engaged in military service. Among such was holy David to whom the Lord gave such high testimony. Among such were many just men of that time. Among such, also, was that centurion who said to the Lord: ‘I am not worthy that thou shouldst enter under my roof, but only say the word and my servant shall be healed. For I also am a man, subject to authority, having under me soldiers, and I say to this one: Go, and he goeth, and to another: Come, and he cometh; and to my servant: Do this, and he doth it’; of him the Lord said: ‘Amen I say to you I have not found so great faith in Israel.’ Among such, also, was that Cornelius to whom the angel was sent, who said: ‘Cornelius, thy prayer is heard and thy alms are accepted,’ when he advised him to send to the blessed Apostle Peter, to hear from him what he ought to do. And to summon the Apostle to him he sent a religious soldier.

Among such, also, were those who came for baptism to John, the holy precursor of the Lord and friend of the bridegroom, of whom the Lord said: ‘There hath not arisen among them that are born of women a greater one than John the Baptist.’ When they asked him what they ought to do, he answered them: ‘Do violence to no man, neither calumniate any man, and be content with your pay.’ Obviously, he did not forbid them to serve in the army when he commanded them to be satisfied with their pay.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Boniface, c. 418 (no. 189) in Saint Augustine Letters: Volume IV (c. 420-30), trans. Wilfred Parsons, The Fathers of the Church: A New Translation, vol. 30 (Washington D.C.: The Catholic University of America Press, 1955), p. 268.</cite></span></figcaption>

</figure><figure class="quote" id="q-af238627d4" data-kw="">
<blockquote><p>[T]ill a man be called and his person justified and sanctified, all that ever he does is sin. First, his common actions, his eating, drinking, sleeping, walking, talking are all sins. Yea, secondly, the works of his calling and his labour in the same, though never so just, equal, and upright. Thirdly, further, his civil actions – namely, the practice of civil virtues. His outward gravity, meekness, sobriety, temperance, quietness, uprightness, and all outward conformity are all sins.

Yea, more than all this, his best actions – namely, his practicing of the parts of God’s worship, or his deeds of charity, his prayer, his hearing the word, his receiving of the sacraments, his giving of alms – they are all sins unto him, if he have not a believing and penitent heart. Yea, such sins as shall condemn him, if he had no other.

Objection. This should seem strange divinity that the most holy actions, as prayer, etc., should be damnable sins. I answer, they are in themselves holy and good and as far as God has commanded them. Yet in the doer they are sins because he does them from a foul and unholy heart, for the same action may be holy in itself and in regard of God the author of it and yet a sin in him that is the doer of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Cloud of Faithful Witnesses, Leading to the Heavenly Canaan: Or, A Commentary upon the 11th Chapter to the Hebrews</cite>, (1609) in The Works of William Perkins: Volume 3, eds Randall J. Pederson and Ryan M. Hurd (Grand Rapids: Reformation Heritage Books, 2017), p. 41.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-d5fc83548e" data-kw="">
<blockquote><p>Thirdly, as man is a creature endued with reason, the Law of Nature teacheth him, 1. Something concerning God. 2. Something concerning his Neighbour. 3. Something concerning himself. I mean some general notions concerning good and evil, in respect of Each of these. Whereof the Apostle meaneth, whiles he saith, that the Gentiles shew the work of the Law written in their hearts. First then, the Law of Nature teacheth man, to know that there is a God, and that this God is to be worshipped. Whereupon it followeth, that man should seek to know God, and the manner of his worship. Now that which may be known of God, is shewed even unto the Gentiles. The Apostle saith signanter [distinctly] τὸ γνωστὸν τοῦ θεοῦ [what is known about God], meaning those few and small sparkles of the knowledge of God, which natures imbred light discovered unto the Gentiles, for making them inexcusable, namely, that there is a[n] eternal power and Godhead, which men ought to reverence and to worship.

2. The Law of Nature teacheth man to hold fast friendship and amity with his Neighbours, for as much as he is Animal sociale [a social animal]. Violare alterum saith Cicero, naturae lege prohibemur. [We are forbidden to do dishonour to another by the law of nature.] For the Law of Nature biddeth us do to others as we would have them to do unto us. And from these precepts it followeth, that we should not offend other men, that we should keep promises, stand to bargains, give to every man his own, &amp;c.

3. As touching a man’s self, the Law of Nature teacheth him, that he should not live as a reasonless creature, but that all his actions should be such, as may be congruous and beseeming for a creature endued with reason. Whereupon it followeth, that he should live honestly and virtuously, that he should observe order &amp; decency in all his actions, &amp;c. Hence the Apostle saith, that nature itself teacheth, that it is a shame for a man to have long hair, because it is repugnant to that decency and comeliness which the Law of Nature requireth. For among other differences which Nature hath put betwixt men and women, this is one, that it hath given to women thicker and longer hair, then to men, that it might be as a vail to adorn and cover them. The reason whereof, Nature hath hid in the complexion of a woman, which is more humid then the complexion of a man. So that if a man should take him to this womanish ornament, he should but against Nature transform himself (in so far) into a woman.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dispute against the English-popish ceremonies, obtruded upon the Church of Scotland</cite>, (n.p., 1637), Part III, pp 199-200.</span></figcaption>

3. As touching a man’s self, the Law of Nature teacheth him, that he should not live as a reasonless creature, but that all his actions should be such, as may be congruous and beseeming for a creature endued with reason. Whereupon it followeth, that he should live honestly and virtuously, that he should observe order &amp; decency in all his actions, &amp;c. Hence the Apostle saith, that nature itself teacheth, that it is a shame for a man to have long hair, because it is repugnant to that decency and comeliness which the Law of Nature requireth. For among other differences which Nature hath put betwixt men and women, this is one, that it hath given to women thicker and longer hair, then to men, that it might be as a vail to adorn and cover them. The reason whereof, Nature hath hid in the complexion of a woman, which is more humid then the complexion of a man. So that if a man should take him to this womanish ornament, he should but against Nature transform himself (in so far) into a woman.”

— George Gillespie, A dispute against the English-popish ceremonies, obtruded upon the Church of Scotland, (n.p., 1637), Part III, pp 199-200.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThirdly%2C+as+man+is+a+creature+endued+with+reason%2C+the+Law+of+Nature+teacheth+him%2C+1.+Something+concerning+God.+2.+Something+concerning+his+Neighbour.+3.+Something+concerning+himself.+I+mean+some+general+notions+concerning+good+and+evil%2C+in+respect+of+Each+of+these.+Whereof+the+Apostle+meaneth%2C+whiles+he+saith%2C+that+the+Gentiles+shew+the+work+of+the+Law+written+in+their+hearts.+First+then%2C+the+Law+of+Nature+teacheth+man%2C+to+know+that+there+is+a+God%2C+and+that+this+God+is+to+be+worshipped.+Whereupon+it+followeth%2C+that+man+should+seek+to+know+God%2C+and+the+manner+of+his+worship.+Now+that+which+may+be+known+of+God%2C+is+shewed+even+unto+the+Gentiles.+The+Apostle+saith+signanter+%5Bdistinctly%5D+%CF%84%E1%BD%B8+%CE%B3%CE%BD%CF%89%CF%83%CF%84%E1%BD%B8%CE%BD+%CF%84%CE%BF%E1%BF%A6+%CE%B8%CE%B5%CE%BF%E1%BF%A6+%5Bwhat+is+known+about+God%5D%2C+meaning+those+few+and+small+sparkles+of+the+knowledge+of+God%2C+which+natures+imbred+light+discovered+unto+the+Gentiles%2C+for+making+them+inexcusable%2C+namely%2C+that+there+is+a%5Bn%5D+eternal+power+and+Godhead%2C+which+men+ought+to+reverence+and+to+worship.%0A%0A2.+The+Law+of+Nature+teacheth+man+to+hold+fast+friendship+and+amity+with+his+Neighbours%2C+for+as+much+as+he+is+Animal+sociale+%5Ba+social+animal%5D.+Violare+alterum+saith+Cicero%2C+naturae+lege+prohibemur.+%5BWe+are+forbidden+to+do+dishonour+to+another+by+the+law+of+nature.%5D+For+the+Law+of+Nature+biddeth+us+do+to+others+as+we+would+have+them+to+do+unto+us.+And+from+these+precepts+it+followeth%2C+that+we+should+not+offend+other+men%2C+that+we+should+keep+promises%2C+stand+to+bargains%2C+give+to+every+man+his+own%2C+%26c.%0A%0A3.+As+touching+a+man%E2%80%99s+self%2C+the+Law+of+Nature+teacheth+him%2C+that+he+should+not+live+as+a+reasonless+creature%2C+but+that+all+his+actions+should+be+such%2C+as+may+be+congruous+and+beseeming+for+a+creature+endued+with+reason.+Whereupon+it+followeth%2C+that+he+should+live+honestly+and+virtuously%2C+that+he+should+observe+order+%26+decency+in+all+his+actions%2C+%26c.+Hence+the+Apostle+saith%2C+that+nature+itself+teacheth%2C+that+it+is+a+shame+for+a+man+to+have+long+hair%2C+because+it+is+repugnant+to+that+decency+and+comeliness+which+the+Law+of+Nature+requireth.+For+among+other+differences+which+Nature+hath+put+betwixt+men+and+women%2C+this+is+one%2C+that+it+hath+given+to+women+thicker+and+longer+hair%2C+then+to+men%2C+that+it+might+be+as+a+vail+to+adorn+and+cover+them.+The+reason+whereof%2C+Nature+hath+hid+in+the+complexion+of+a+woman%2C+which+is+more+humid+then+the+complexion+of+a+man.+So+that+if+a+man+should+take+him+to+this+womanish+ornament%2C+he+should+but+against+Nature+transform+himself+%28in+so+far%29+into+a+woman.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+A+dispute+against+the+English-popish+ceremonies%2C+obtruded+upon+the+Church+of+Scotland%2C+%28n.p.%2C+1637%29%2C+Part+III%2C+pp+199-200.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd5fc83548e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d5fc83548e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/07/22/george-gillespie-on-what-we-can-learn-from-the-law-of-nature/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-20b1752885" data-kw="">
<blockquote><p>And I dare say, whosoever shall peruse with a judicious and unpartial eye most of those pamphlets, that in this daring age have been thrust into the world against… (…things of lesser regard and usefulness and more open to acception [exception] and abuse, yet so far as I can understand, unjustly condemned as things utterly unlawful, such as are lusorious lots, dancing, stage plays and some other things of like nature), when he shall have drained out the bitter invectives, unmannerly jeers, petulant guirding at those that are in authority, impertinent digressions, but above all those most bold and perverse wrestings of holy Scripture, wherewith such books are infinitely stuffed, he shall find that little poor remainder that is left behind to contain nothing but vain words and empty arguments. For when these great undertakers have snatched up the bucklers, as if they would make it good against all comers, that such and such things are utterly unlawful, and therefore ought in all reason and conscience to bring such proofs as will come up to that conclusion: Quid dignum tanto? very seldom shall you hear from them any other arguments than such as will conclude but an inexpediency at the most, as that they are apt to give scandal, that they carry with them an appearance of evil, that they are often occasions of sin, that they are not command[ed] in the Word, and such like. Which objections, even where they are just, are not of force (no not taken altogether, much less any of them singly) to prove a thing to be utterly unlawful. And yet are they glad many times, rather than sit out, to play very small game and to make use of arguments yet weaker than these and such as will not reach so far as to prove a bare inexpediency, as that they were invented by heathens, that they have been abused in Popery and other such like. Which to my understanding is a very strong presumption that they have taken a very weak cause in hand and such as is wholly destitute of sound proof.</p></blockquote>

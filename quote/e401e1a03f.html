<main class="wrap"><figure class="quote" id="q-e401e1a03f" data-kw="">
<blockquote><p>Hence we conclude that the knowledge of faith consists more of certainty than discernment. … We add, that it is sure and firm, the better to express strength and constancy of persuasion. For as faith is not contented with a dubious and fickle opinion, so neither is it contented with an obscure and ill-defined conception.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.2.14–15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a> › <a href="../topics/faith/nature-of-saving-faith/knowledge-assent-trust-fiducia.html">Knowledge, assent, trust (fiducia)</a></span><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a> › <a href="../topics/assurance-peace-and-joy/assurance-of-salvation/assurance-of-faith.html">Assurance of faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-19f01e32d5" data-kw="">
<blockquote><p>Faith comprehends the knowledge of the mystery of God, and of Christ in the light of grace, the truth of which mystery the believer acknowledges with full assent of mind, on the authority of the testimony of God. And not only so, but he is also in love with that truth, exults therein and glorifies God; he likewise ardently desires communion with Christ … wherefore, when Christ is offered to him by the word and Spirit, he receives him with the greatest complacency of soul, leans and rests upon him, and gives and surrenders himself to him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants</cite>, 3.7.26</span></figcaption>

</figure><figure class="quote" id="q-c1abb94772" data-kw="">
<blockquote><p>To this knowledge must be joined assent, which is the second act of faith, whereby a person receives and acknowledges as truths, those things which he knows, &quot;receiving the testimony of God, and thus setting to his seal that God is true,&quot; John 3:33. This assent is principally founded on the infallible veracity of God, who testifies of himself and of his Son, 1 John 5:9, 10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants</cite>, 3.7.11</span></figcaption>

</figure><figure class="quote" id="q-a2b0d88443" data-kw="">
<blockquote><p>But in the strict and special sense of the word, as discriminated from knowledge or opinion, faith means the belief of things not seen, on the ground of testimony.</p></blockquote>

</figure><figure class="quote" id="q-157c138df0" data-kw="">
<blockquote><p>The more common and truer opinion recognizes three acts in faith: knowledge, assent, trust (notitiam, assensum, fiduciam). Although all the others can be referred to these, still that we may understand the whole subject more easily, we must treat more distinctly of them.</p></blockquote>

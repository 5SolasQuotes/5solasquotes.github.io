<main class="wrap"><figure class="quote" id="q-e0b7586e08" data-kw="special object Christ Mediator">
<blockquote><p>This we hold to be the evangelical promise concerning Christ, the Mediator, and the special mercy granted in him to believers and penitents. For it so far properly justifies and saves, as it apprehends and embraces the merit of Christ revealed to it in the word of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.12.2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7db9d5d022" data-kw="temporary vs saving faith">
<blockquote><p>Whether a true believer who is called according to God’s purpose and truly justified, furnished with a faith not dogmatical and temporary, but living and saving, can (no less as to God and the event, than as to himself) lose faith, not only objectively (which believes), but also subjectively (by which he believes); not only demeritoriously, but effectively (totally); not only for a time, but finally. We deny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.16.7</span></figcaption>

</figure><figure class="quote" id="q-fb228d71e6" data-kw="">
<blockquote><p>That the tender of the gospel to the conversion of sinners, is absolutely free (John 3:14–15; 1:12; Isa. 55:1; John 7:37), no way requiring, as absolutely necessary, any qualifications, preparations, terrors of the law, or preceding ministry of the law, but only and alone the naked soul, as a sinner and ungodly to receive Christ (1 Tim. 1:15; Rom. 4:5; 5:8), as crucified, dead, and buried, and risen again, being made a prince and a Savior for such sinners (Acts 5:30–31; 2:36; 1 Cor. 1:22–24).</p></blockquote>

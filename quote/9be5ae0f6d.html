<main class="wrap"><figure class="quote" id="q-9be5ae0f6d" data-kw="">
<blockquote><p>But for no cause the most weighty can we choose either to shed innocent blood or to co-operate with the shedding of it, nor to co-operate with the works of darkness, for it is shameful that a servant may lawfully cooperate with and thrust his master in at a window to go to a whore; the jus or dominion of masters to command, and the right of servants to obey is only in the Lord. …the one kind of action in itself is as indifferent and susceptible of moral lawfulness and unlawfulness as the other. And if the master do cooperate to commit harlotry in climbing in at a window to a whore, and to robbing, in digging through an innocent man’s house in the night, to kill the master of the house, and to steal his goods, then the servant that cooperates in these same physical actions, and also digs through the innocent man’s house and kills himself, is the harlot and the robber by cooperation and participation, no less than the master. The naked relation of a captive and of a servant cannot make the captive and servant innocent and guiltless cooperators, for then to sin at the command of any conqueror and master, because I am in the condition of a captive and servant, were lawful, though God forbid and inhibit me to do what I do, by the command of my master and conqueror, for in so doing, Utor meo jure, ‘I use my right’ as a servant. For God forbids me in what relation I be in, servant or captive, to sin at the command of any, or for declining any ill of punishment, though as weighty as the torment of hell, separated from sinful despairing and blaspheming of God. Now to cooperate with that which I know to be a sin is to partake in other men’s sins, which is forbidden, as a sin, 1 Tim. 5:22; Eph. 5:11. But to run with the thief and to help an arch-robber, Prov. 1:13-14, is a consenting to his robbery and bloodshed.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-09822e2260" data-kw="">
<blockquote><p>God gives kingdoms to whom He will. What then?… and He gives tyrannous conquests to whom He will: and it is Nebuchadnezzar to whom Daniel speaks that from the Lord [Dan. 5:21], and he had no just title to many kingdoms, especially to the kingdom of Judah, which yet God, the King of kings, gave to him because it was his good pleasure; and if God had not commanded them by the mouth of his prophet Jeremiah, might they not have risen, and, with the sword, have vindicated themselves and their own liberty, no less than they lawfully, by the sword, vindicated themselves from under Moab, (Judges 3) and from under Jabin, king of Canaan, who, twenty years, mightily oppressed the children of Israel, Judges 4. Now this Popish Prelate [John Maxwell], by all these instances, making heathen kings to be kings by as good a title as David and Hezekiah, [implicitly] condemns the people of God as rebels, if, being subdued and conquered by the Turk and Spanish king, they should, by the sword, recover their own liberty [such as happened the Reformation in the Netherlands]; and that Israel, and the saviours which God raised to them, had not warrant from the law of nature to vindicate themselves to liberty, which was taken from them violently and unjustly by the sword… for Nebuchadnezzar’s sovereignty over the people of God, and many other kingdoms also, was revenged of God as tyranny, Jer. 1:6-7; and therefore the vengeance of the Lord, and the vengeance of his temple, came upon him and his land, Jer. 1:16, etc. It is true the people of God were commanded of God to submit to the king of Babylon, to serve him, and to pray for him, and to do the contrary was rebellion; but this was not because the king of Babylon was their king, and because the king of Babylon had a command of God so to bring under his yoke the people of God. So Christ had a commandment to suffer the death of the cross (John 10:18) but had Herod and Pilate any warrant to crucify him? None at all.</p></blockquote>

<blockquote><p>49… When a rebel rose up against his prince and got but the stronger party and possession, how quickly did they [degenerate bishops] flatter him and own him. I find but one bishop besides St. Martin in all France and that part of Germany, that disowned Maximus that murdered Gratian: The rest applauded him for their own ends: Nor in that part of Italy I find not any besides Ambrose and one Hyginus that disowned him. (Not that I think it my part to condemn all the holy bishops who professed subjection to usurpers in possession: Even holy Ambrose could write to the odious tyrant Eugenius (Clementissimo Imperatori Eugenio) concluding, nam cum privato detulerim corde intimo, quomodo non deferrem Imperatori, ‘When I honored thee a private man from the bottom of my heart, how can I but honor thee being emperor?’ And how far have the Roman bishops gone in this, even to Phocas and such as he?)</p></blockquote>

<blockquote><p>Conquest, seeing it is an act of violence and God’s revenging justice for the sins of a people, cannot give in God’s court such a just title to the throne as the people are to submit their consciences unto, except God reveal his regulating will by some immediate voice from heaven, as he commanded Judah to submit to Nebuchadnezzar as to their king by the mouth of Jeremiah. Now this is not a rule to us; for then, if the Spanish king should invade this land, and, as Nebuchadnezzar did, deface the temple and instruments and means of God’s worship, and abolish the true worship of God, it should be unlawful to resist him, after he had once conquered the land: neither God’s Word, nor the law of nature could permit this. I suppose, even by grant of adversaries, now no act of violence done to a people, though in God’s court they have deserved it, can be a testimony to us of God’s regulating will; except it have some warrant from the law and testimony [Scripture], it is no rule to our conscience to acknowledge him a lawful magistrate whose sole law to the throne is an act of the bloody instrument of divine wrath, I mean the sword. That, therefore, Judah was to submit, according to God’s Word, to Nebuchadnezzar, whose conscience and best warranted calling to the kingdom of Judah was his bloody sword, even if we suppose Jeremiah had not commanded them to submit to the king of Babylon, I think cannot be said.</p></blockquote>

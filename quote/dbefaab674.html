</figure><figure class="quote" id="q-3feea598b2" data-kw="">
<blockquote><p>2. I hope it will be granted me too, without much begging, that for the woman to come into the congregation of God’s worshippers with her head uncovered, or attired after the manner of the man, is a very uncomely and unchristian-like thing… 3. And I presume upon the observation of all that I have had to do with, that it will not be denied that in praying and in singing of psalms, the man ought to have his head uncovered. I met with none that own these ordinances, but are ready to own it to be their duty to be uncovered in them, and take it as a piece of profane irreverence and contempt of God’s ordinance to be otherwise. Though indeed there be some, who of late have learnt a new fashion of uncovering the head, by hanging their hats half way on one side, or on their brows; these are uncovered by a synecdoche partis, and show their readiness to keep them quite on, if it were but the fashion; as if they were afraid of too much reverence, or of abasing themselves too much in the sight of God. Of whom this fantastical fashion was first learnt, I know not; yet thus much even these seem to grant by that little they do, that in these duties the head ought to be uncovered in whole or in part. And being thus far agreed, that which remains to be tried, is only this: Whether it be the duty of the man to have his head uncovered, while the word of God is read or preached in the congregation of his people?… Objection 1: I hear some allege thus, That it is in itself a matter of indifferency, and to be determined by the custom of those particular churches or people, where any one has his conversation, and not to be positively asserted for a general duty… Objection 2: Others object, That the Reformed Churches in other countries observe no such thing, but generally practice the contrary in their assemblies; but if it were a duty, why should not they practice it as well as we?… Objection 4: Others there be that will allow it to be necessary, by the rules of decency and reverence, to be uncovered in prayer, and in singing and perhaps in reading of the Scriptures too, but not in preaching: And their reason is because in preaching we have not the pure word of God, but mixed with men’s own private opinions and improvements… Objection 5: Others, it seems, argue after this fashion: This uncovering of the head in divine worship, is a thing that has been so abused, and rested in by a company of dead formalists, and so zealously affected by such as dote on foolish and superstitious ceremonies, that to show our dislike of their ways, we think it expedient to act contrary to them in this thing also, and not to symbolize with their superstitions. Answer: Had I not heard it from some that pretended to sobriety… Objection 6: But there are yet others that think they have more to say than all this. Their bodily infirmities are such as that they cannot bear it to be so long uncovered, without hazard of their health: But God will have mercy, and not sacrifice… Objection 7: Others think to say something in this, if this had been such a duty; wherefore have our teachers been so long silent, Why had we not heard of this sooner?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-stoddon.html">Samuel Stoddon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on a Question Relating to Divine Worship viz. Whether it be Contrary to the Apostolical Laws of Decency &amp; Reverence for a Man to have his Head Covered in the Time &amp; Place of God’s Solemn Public Worship?: Affirmative</cite>, An Essay on a Question Relating to Divine Worship viz. Whether it be Contrary to the Apostolical Laws of Decency &amp; Reverence for a Man to have his Head Covered in the Time &amp; Place of God’s Solemn Public Worship?: Affirmative (London: Maxwell, 1682) Stoddon was an English, congregationalist minister., pp. 40-44</span></figcaption>

C+and+to+be+determined+by+the+custom+of+those+particular+churches+or+people%2C+where+any+one+has+his+conversation%2C+and+not+to+be+positively+asserted+for+a+general+duty%E2%80%A6+Objection+2%3A+Others+object%2C+That+the+Reformed+Churches+in+other+countries+observe+no+such+thing%2C+but+generally+practice+the+contrary+in+their+assemblies%3B+but+if+it+were+a+duty%2C+why+should+not+they+practice+it+as+well+as+we%3F%E2%80%A6+Objection+4%3A+Others+there+be+that+will+allow+it+to+be+necessary%2C+by+the+rules+of+decency+and+reverence%2C+to+be+uncovered+in+prayer%2C+and+in+singing+and+perhaps+in+reading+of+the+Scriptures+too%2C+but+not+in+preaching%3A+And+their+reason+is+because+in+preaching+we+have+not+the+pure+word+of+God%2C+but+mixed+with+men%E2%80%99s+own+private+opinions+and+improvements%E2%80%A6+Objection+5%3A+Others%2C+it+seems%2C+argue+after+this+fashion%3A+This+uncovering+of+the+head+in+divine+worship%2C+is+a+thing+that+has+been+so+abused%2C+and+rested+in+by+a+company+of+dead+formalists%2C+and+so+zealously+affected+by+such+as+dote+on+foolish+and+superstitious+ceremonies%2C+that+to+show+our+dislike+of+their+ways%2C+we+think+it+expedient+to+act+contrary+to+them+in+this+thing+also%2C+and+not+to+symbolize+with+their+superstitions.+Answer%3A+Had+I+not+heard+it+from+some+that+pretended+to+sobriety%E2%80%A6+Objection+6%3A+But+there+are+yet+others+that+think+they+have+more+to+say+than+all+this.+Their+bodily+infirmities+are+such+as+that+they+cannot+bear+it+to+be+so+long+uncovered%2C+without+hazard+of+their+health%3A+But+God+will+have+mercy%2C+and+not+sacrifice%E2%80%A6+Objection+7%3A+Others+think+to+say+something+in+this%2C+if+this+had+been+such+a+duty%3B+wherefore+have+our+teachers+been+so+long+silent%2C+Why+had+we+not+heard+of+this+sooner%3F%E2%80%9D%0A%0A%E2%80%94+Samuel+Stoddon%2C+An+Essay+on+a+Question+Relating+to+Divine+Worship+viz.+Whether+it+be+Contrary+to+the+Apostolical+Laws+of+Decency+%26+Reverence+for+a+Man+to+have+his+Head+Covered+in+the+Time+%26+Place+of+God%E2% </figure><figure class="quote" id="q-962c79f34d" data-kw="">
<blockquote><p>I see some religious, and well affected women carried away with Erroneous opinions concerning this point; whose tender consciences have been abused by the mis-interpretations of some ignorants to be drawn to hold that this covering must be absolute; and total, and perpetual, so as if any hair at all be seen, it is a violation of this charge and their duty; to which purpose they urge that verse 15 as a full commentary upon this text, that the hair was given the woman for a covering; and upon this ground they are apt to censure them who take liberty to expose any of their hair, though never so moderately to others view… That I may therefore lay some grounds of this my just determination, know first that in the use of garments and these outward appendances of the body there is much latitude and variety according to the several guises of nations, and degrees of persons: there are countries the extremity of whose cold climate is such that it is no boot to bid both sexes be covered, yea muffled up, for their own safety; there are others so scorching that will hardly admit of any covering either for head or body; there are some whose hair is so large, that is able to hide them, there are others whose curled heads are alike short in both sexes, and give no advantage to the covering of either: he that made these differences of climates and people has not thought fit to confine them to one universal rule, only contenting himself with a general prescription of decency which in all countries must be regulated according to the custom or convenience of the place. For certainly these sacred ceremonies must follow the rule of the civil, for that which is held a token of subjection to our princes and other superiors, in all countries is so used in the service of the King above all gods: the Turks and all Mahumetans therefore not uncovering their heads to their Bashaes, or their Grand Lord; keep their heads covered in their devotions: and only by bowing or prostration testify their humble subjection to God. The French Divines preach with their hats on, ours uncovered; both pretend good reason; and custom for these contrary fashions; neither are either of them to be censured as faulty, and exorbitant: and with us we hold the head uncovered if the hat be off, though the cap be on: others make no difference if there be ought at all on the head.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“I see some religious, and well affected women carried away with Erroneous opinions concerning this point; whose tender consciences have been abused by the mis-interpretations of some ignorants to be drawn to hold that this covering must be absolute; and total, and perpetual, so as if any hair at all be seen, it is a violation of this charge and their duty; to which purpose they urge that verse 15 as a full commentary upon this text, that the hair was given the woman for a covering; and upon this ground they are apt to censure them who take liberty to expose any of their hair, though never so moderately to others view… That I may therefore lay some grounds of this my just determination, know first that in the use of garments and these outward appendances of the body there is much latitude and variety according to the several guises of nations, and degrees of persons: there are countries the extremity of whose cold climate is such that it is no boot to bid both sexes be covered, yea muffled up, for their own safety; there are others so scorching that will hardly admit of any covering either for head or body; there are some whose hair is so large, that is able to hide them, there are others whose curled heads are alike short in both sexes, and give no advantage to the covering of either: he that made these differences of climates and people has not thought fit to confine them to one universal rule, only contenting himself with a general prescription of decency which in all countries must be regulated according to the custom or convenience of the place. For certainly these sacred ceremonies must follow the rule of the civil, for that which is held a token of subjection to our princes and other superiors, in all countries is so used in the service of the King above all gods: the Turks and all Mahumetans therefore not uncovering their heads to their Bashaes, or their Grand Lord; keep their heads covered in their devotions: and only by bowing or prostration testify their humble subjection to God. The French Divines preach with their hats on, ours uncovered; both pretend good reason; and custom for these contrary fashions; neither are either of them to be censured as faulty, and exorbitant: and with us we hold the head uncovered if the hat be off, though the cap be on: others make no difference if there be ought at all on the head.”

— Joseph Hall, The Shaking of the Olive-Tree, the Remaining Works of that Incomparable Prelate Joseph Hall… (London, 1660), The Women’s Vail, or a Discourse concerning the Necessity or Expedience of the Close-Covering of the Heads of Women… Occasioned by an offence unjustly taken at a Modest Dress, pp. 241-42">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+see+some+religious%2C+and+well+affected+women+carried+away+with+Erroneous+opinions+concerning+this+point%3B+whose+tender+consciences+have+been+abused+by+the+mis-interpretations+of+some+ignorants+to+be+drawn+to+hold+that+this+covering+must+be+absolute%3B+and+total%2C+and+perpetual%2C+so+as+if+any+hair+at+all+be+seen%2C+it+is+a+violation+of+this+charge+and+their+duty%3B+to+which+purpose+they+urge+that+verse+15+as+a+full+commentary+upon+this+text%2C+that+the+hair+was+given+the+woman+for+a+covering%3B+and+upon+this+ground+they+are+apt+to+censure+them+who+take+liberty+to+expose+any+of+their+hair%2C+though+never+so+moderately+to+others+view%E2%80%A6+That+I+may+therefore+lay+some+grounds+of+this+my+just+determination%2C+know+first+that+in+the+use+of+garments+and+these+outward+appendances+of+the+body+there+is+much+latitude+and+variety+according+to+the+several+guises+of+nations%2C+and+degrees+of+persons%3A+there+are+countries+the+extremity+of+whose+cold+climate+is+such+that+it+is+no+boot+to+bid+both+sexes+be+covered%2C+yea+muffled+up%2C+for+their+own+safety%3B+there+are+others+so+scorching+that+will+hardly+admit+of+any+covering+either+for+head+or+body%3B+there+are+some+whose+hair+is+so+large%2C+that+is+able+to+hide+them%2C+there+are+others+whose+curled+heads+are+alike+short+in+both+sexes%2C+and+give+no+advantage+to+the+covering+of+either%3A+he+that+made+these+differences+of+climates+and+people+has+not+thought+fit+to+confine+them+to+one+universal+rule%2C+only+contenting+himself+with+a+general+prescription+of+decency+which+in+all+countries+must+be+regulated+according+to+the+custom+or+convenience+of+the+place.+For+certainly+these+sacred+ceremonies+must+follow+the+rule+of+the+civil%2C+for+that+which+is+held+a+token+of+subjection+to+our+princes+and+other+superiors%2C+in+all+countries+is+so+used+in+the+service+of+the+King+above+all+gods%3A+the+Turks+and+all+Mahumetans+therefore+not+uncovering+their+heads+to+their+Bashaes%2C+or+their+Grand+Lord%3B+keep+their+heads+covered+in+their+devotions%3A+and+only+by+bowing+or+prostration+testify+their+humble+subjection+to+God.+The+French+Divines+preach+with+their+hats+on%2C+ours+uncovered%3B+both+pretend+good+reason%3B+and+custom+for+these+contrary+fashions%3B+neither+are+either+of+them+to+be+censured+as+faulty%2C+and+exorbitant%3A+and+with+us+we+hold+the+head+uncovered+if+the+hat+be+off%2C+though+the+cap+be+on%3A+others+make+no+difference+if+there+be+ought+at+all+on+the+head.%E2%80%9D%0A%0A%E2%80%94+Joseph+Hall%2C+The+Shaking+of+the+Olive-Tree%2C+the+Remaining+Works+of+that+Incomparable+Prelate+Joseph+Hall%E2%80%A6+%28London%2C+1660%29%2C+The+Women%E2%80%99s+Vail%2C+or+a+Discourse+concerning+the+Necessity+or+Expedience+of+the+Close-Covering+of+the+Heads+of+Women%E2%80%A6+Occasioned+by+an+offence+unjustly+taken+at+a+Modest+Dress%2C+pp.+241-42&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F962c79f34d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/962c79f34d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=I%20see%20some%20religious%2C%20and%20well,ought%20at%20all%20on%20the%20head&amp;text=I%20see%20some%20religious%2C%20and%20well%20affected%20women&amp;text=there%20be%20ought%20at%20all%20on%20the%20head" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

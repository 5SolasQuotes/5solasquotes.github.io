<main class="wrap"><figure class="quote" id="q-bf33b0c2d9" data-kw="">
<blockquote><p>II. Law is an ordinance of reason, instituted by him who has the care of a community, concerning good things, for the common and particular advantage of some society; teaching what is to be done and what is not, and likewise commanding or forbidding the same, and obligating the rational creature to perform those things by the threatening of punishment and the promise of reward. … XIX. From this distinction of the Mosaic law, judgment is easily made concerning the difference and agreement of these three parts [the moral, ceremonial and judicial laws], both in substance and as to their accidental abrogation. They agree: 1. in author, both principal and ministerial. 2. in general end, namely, the common good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomar.html">Francis Gomar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>’15th of the Theological Disputations, on the Law of God’ (Leiden: Patius, 1603), trans. AI at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-896bf0dbf5" data-kw="">
<blockquote><p>There is no community but is major [has authority] in this, that it can appoint its own tutors; and though it cannot be without all rulers [due to the inclinations of nature], yet it may well be without this or that prince and ruler, and, therefore, may resume its power, which it gave conditionally to the ruler for its own safety and good; and in so far as this condition is violated, and power turned to the destruction of the commonwealth, it is to be esteemed as not given; and though the people be not a politic judge in their own cause, yet in case of manifest oppression, nature can teach them to oppose defensive violence against offensive. A community in its politic body is also above any ruler, and may judge what is manifestly destructive to itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843) | question 17</cite>, p. 69 rt col top</span></figcaption>

<blockquote><p>We hold with Lactantius that religion cannot be compelled, nor can mercy and justice and love to our neighbor commanded in the Second Table [of the Law], be more compelled than faith in Christ.</p></blockquote>

</figure><figure class="quote" id="q-cbf3704f54" data-kw="">
<blockquote><p>I lay down this maxim of divinity: Tyranny being a work of Satan, is not from God, because sin, either habitual or actual, is not from God; the power that ‘is’ [Rom. 13:1], must be from God; the magistrate as magistrate, is good, in nature of office, and the intrinsecal end of his office, Rom. 13:4, for he is the minister of God for thy good; and therefore a power ethical, politic, or moral, to oppress, is not from God, and is not a power, but a licentious deviation of a power, and is no more from God (but from sinful nature, and the old serpent) than a license to sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 34</span></figcaption>

</figure><figure class="quote" id="q-193f78de04" data-kw="">
<blockquote><p>They spoil kings and parliaments of their legislative power. But their great tenet about the magistracy is this, that no prince nor state on the earth has any legislative power; that neither king nor parliament can make any law in anything that concerns either church or state; that God alone is the Lawgiver; that the greatest magistrate has no other power, but to execute the Laws of God set down in Scripture; that the judicial Law of Moses binds at this day all the nations of the world as well as ever it did the Jews: They tell us that whatever God in Scripture has left free, it may not be bound by any human law, whether civil or ecclesiastic; and what God has bound by any law in Scripture, they will not have it loosed by the hand of any man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive From the Errours of the Time (1645)</cite>, p. 31</span></figcaption>

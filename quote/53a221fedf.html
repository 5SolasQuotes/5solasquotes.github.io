<main class="wrap"><figure class="quote" id="q-53a221fedf" data-kw="">
<blockquote><p>5. Duration XVII. Fifth, the duration of their existing, and its measure, through which they are not under time, by which such things are measured which by their nature admit of a beginning and end; nor under eternity, which belongs only to him who by nature can experience neither beginning nor end; but under aevum, ‘forever,’20 by which those things are measured which include a beginning by nature, but exclude an end. This aevum is congruent with time, tempus, in this, that not only does it imply a beginning of duration, but also flux or succession; this aevum is congruent with eternity in that it excludes an end of its duration. It differs from time in that it excludes an end, and from eternity in that it includes a beginning and flux. 23 The three measures of duration are tempus, aeternitas, and aevum, also called “aeviternity” or “improper eternity.” Cf. 1.2.11 §VIII.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, ed. Joel Beeke, tr. Todd Rester (RHB, 2021), vol. 3, bk. 3, ch. 7, The Good Angels, p. 184</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>

ank">Read it online · Reformed Books Online</a></div>

<blockquote><p>3. Place XV. Third, the place of their existing, which they occupy not only by reason of their operating, but by coexistence; nor by circumscription, as if they were bounded extrinsically, like bodies; nor by repletion, or infinite coexistence; but by delimitation,18 whereby on account of the finitude of their essence, they are so restricted to this place that they may not be in a different one.19 Thus it is said that in one man there was a legion (Luke 8:30). 18. definitio, cf. §XXVIII, below 19. …non sola operandi ratione, sed per coexistentiam; nec per circumscriptionem…; nec per repletionem…; sed per definitionem…. Cf. Roelf T. te Velde, Paths Beyond Tracing Out: The Connection of Method and Content in the Doctrine of God, Examined in Reformed Orthodoxy, Karl Barth, and the Utrecht School (Delft: Uitgeverij Eburon, 2010), 139.

4. Motion XVI. Accordingly, fourth, a local motion by which they pass from place to place (Gen. 28:12), which although it is most rapid, since no medium resists it, from which they are compared to wind and fire (Ps. 104:4), and the seraphim are said to be winged (Ezek. 1:6), and like lightning (Luke 10:18), yet it occurs not in a moment, but successively.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, vol. 3, bk. 3, ch. 7, The Good Angels, §15, pp. 183-84</span></figcaption>

<blockquote><p>…and it is most certain that angelical persons have a limited presence, because they have a finite essince [as opposed to God]… I need say no more concerning angels than what is commonly said, ‘Angeli sunt alicuoi definitive; sunt enim in suo ubi non per operationem vel circumscriptionem, sed per designationem definitivam,’ angels are naturally somewhere; though they are not in any place by extension of parts, yet their finite nature is contained within certain bounds and limits. Hence it is that some learned men affirm that it is improper to say, that God is somewhere because He is everywhere; somewhere is a definitive word.</p></blockquote>

<blockquote><p>XL. Our [Reformed] theologians also inquire whether angels are part of the Church. Tilenus, Polanus and others who want the Church to be taken broadly enough to include even the angels affirm this. However, the illustrious Amyraldus, in his Theses on the Parts of the Church, denies it along with many others. I think briefly that there is great communion between angels and pious and faithful men, and that Christ’s death reconciled angels to men and closely united them, making angels protectors and guardians of the faithful and promoting their salvation. But pious men form a certain society among themselves to which angels do not belong. The name ‘Church’ in Scripture is only attributed to the society of men and never includes angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), Nature &amp; Definition of the Church, p. 429 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>
<div class="actions"><button class="copy" data-copy="“XL. Our [Reformed] theologians also inquire whether angels are part of the Church. Tilenus, Polanus and others who want the Church to be taken broadly enough to include even the angels affirm this. However, the illustrious Amyraldus, in his Theses on the Parts of the Church, denies it along with many others. I think briefly that there is great communion between angels and pious and faithful men, and that Christ’s death reconciled angels to men and closely united them, making angels protectors and guardians of the faithful and promoting their salvation. But pious men form a certain society among themselves to which angels do not belong. The name ‘Church’ in Scripture is only attributed to the society of men and never includes angels.”

</figure><figure class="quote" id="q-9d211e2e14" data-kw="">
<blockquote><p>But because sculpture and painting are gifts of God, I seek a pure and legitimate use of each… We believe it wrong that God should be represented by a visible appearance, because He Himself has forbidden it [Ex. 20:4] and it cannot be done without some defacing of his glory… Therefore it remains that only those things are to be sculptured or painted which the eyes are capable of seeing… Within this class some are histories and events, some are images and forms of bodies without any depicting of past events. The former have some use in teaching or admonition; as for the latter, I do not see what they can afford other than pleasure. And yet it is clear that almost all the images that until now have stood in churches were of this [latter] sort. From this, one may judge that these images had been called forth not out of judgment or selection but of foolish and thoughtless craving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, bk. 1, ch. 11, sect. 12 (Battles)</span></figcaption>

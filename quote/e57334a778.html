<main class="wrap"><figure class="quote" id="q-e57334a778" data-kw="">
<blockquote><p>Ma. Which be the chiefest parts of the Word of God?

Scho. The Law and the Gospel.

Ma. How be these two known, the one from the other?

Sch. The Law teacheth us our duty towards God, and our Neighbour, and chargeth us straightly to do the same: promising everlasting life to such as do fulfil the Law, and threatning eternal damnation to such as do break the same.

Ma. What doth the Gospel?

Sch. It promiseth that God, through faith in Christ, will be merciful to forgive the offenders of the Law, such as be sorry therefore, and purpose to amend.

Ma. How many parts be there of true Religion?

Sch. There be two principal parts of Religion, likewise as of the Word of God; out of the which, as it were the spring head, Religion doth flow.

Ma. Which be they?

Sch. Obedience, which the Law commandeth: and faith, or belief, which the Gospel requireth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-nowell.html">Alexander Nowell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechism, or Instruction of Christian Religion, to be learned of all youth, next after the little Catechism: Appointed in the Book of Common Prayer</cite>, (London: John Day, 1572), unpaginated.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e0097125d6" data-kw="">
<blockquote><p>For if the inheritance be of the law, it is no more of promise: but God gave it to Abraham by promise.’ If it was ‘by Promise,’ then it was ‘by faith,’ for faith only receives the Promise; if it was by the Law, then it was by works, for works only fulfil the Law. True, the Law was afterwards added to the Promise, but not to disannul or to supersede it; on the contrary, it was itself a dispensation of the covenant of grace, for it was proclaimed in the name of the ‘God of Abraham, and Isaac, and Jacob;’ and if it republished in all their rigour the original terms of the covenant of works, it was only ‘because of transgressions, till the seed should come to whom the Promise was made.’ It was for conviction of sin, for ‘the Law worketh wrath,’ and is a ‘ministration of death;’ but, as such, it was ‘our schoolmaster to bring us unto Christ, that we might be justified by faith.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-buchanan.html">James Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification</cite>, (Edinburgh: T&amp;T Clark, 1867), 52–53.</span></figcaption>

</figure><figure class="quote" id="q-36e4c46091" data-kw="abrogation justification curse">
<blockquote><p>The question does not concern the use of the law as to justification—whether we are still bound to the law in order to acquire life. Since this is impossible after sin, in this sense it may even be said to have been abrogated: “By the deeds of the law there shall no flesh be justified” (Rom. 3:20) and “As many as are of the works of the law, are under the curse” (Gal. 3:10). Second, the question does not concern its curse because by Christ under this relation it is abrogated with respect to believers: “Christ hath redeemed us from the curse of the law, being made a curse for us” (Gal. 3:13).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.23.2</span></figcaption>

</figure><figure class="quote" id="q-698e135415" data-kw="Lord&#x27;s day resurrection">
<blockquote><p>The Lord’s day (kyriakē hēmera) in Christian usage is applied to the first day of the week, appointed for the public worship of God in memory of Christ’s resurrection. Now it is so called not so much with regard to the efficient (as if it was formally instituted by Christ himself, as the Lord’s Prayer and the Lord’s Supper are designated by the apostle, 1 Cor. 10:21). As will be seen afterwards, no argument can be given for such institution. With regard to the end, it was instituted in memory of the resurrection of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.14.1</span></figcaption>

</figure><figure class="quote" id="q-ea1baf7f9a" data-kw="two tables four and six">
<blockquote><p>Some assign five precepts to each table: as Josephus, “Moses brings forward two tables containing ten written precepts, five on each,” whom Philo follows and, of the fathers, Irenaeus. But this is false because Christ comprehends the fifth precept under the second table (Mt. 19:18); and Paul also when he calls it the first commandment of the second table with promise (Eph. 6:2). For in the first table, a promise is given in the second precept. Also the nature of the thing proves it because some are duties of religion towards God (prescribed in the first table), others of love and reverence for superiors (prescribed in the second table).</p></blockquote>

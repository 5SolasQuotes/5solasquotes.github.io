<main class="wrap"><figure class="quote" id="q-c09bf5a540" data-kw="">
<blockquote><p>Against claims that John Calvin repudiated the beatific vision and teleological virtue ethics, this article demonstrates the importance of the visio Dei by examining sections of Calvin’s exegesis and several important sermons. To explicate how such a teleology impacts the Christian’s relation to ‘lower goods’, it then explores Augustine’s theology of created being. Together these conversations contribute to an explanation of Calvin’s view of Christian moral life now through growth in virtue and in relation to the hope of seeing or contemplating God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alden-c-mccray.html">Alden C. McCray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Defending ‘Avertive’ Religion: Calvin on the Visio Dei &amp; Moral Theology’ in Reformed Theological Review</cite>, vol. 82, no. 1 (April 2023), pp. 25-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1b13e7cb51" data-kw="">
<blockquote><p>Whether the blessed saints after the end of this world shall inhabit this earth, or at least often visit it, Curiose quaeritur &amp; docte ignoratur ‘It is carefully examined, shrewdly passed over’. Voet, Bibliotheca Studiosi Theologiae, bk. 1, ch. 9 [p. 87]. Dr. [Andrew] Willet upon the Romans holds the affirmative (as I remember) and grounds it on that place of Mt. 5:5. Some urge that place in Peter, ‘A new heaven and earth wherein dwelleth righteousnesse’, that is, righteous persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, bk. 10, ‘Of Glorification…’, ch. 4, ‘Of Everlasting Life’ of A System or Body of Divinity (London, 1654), p. 873</span></figcaption>

</figure><figure class="quote" id="q-5dd7c3879c" data-kw="">
<blockquote><p>Now in all dwelling in Christ there is a continual acting of life by believing, joying, resting in God. As Phillip says, Jn. 14:8, ‘Lord, show us the Father and it sufficeth us.’ Here life seeks a soul-satisfying union with life, for life is only a satisfactory object to life. Living things seek no dead things as such to be their happiness if reason do rightly act them, and God as revealed in Jesus Christ is that in which the saints find a soul-sufficiency for themselves; and the act of seeing God in Christ, whether in this life or in the life to come, is an act of life, for the soul lives in the ocean, sea, and bosom of a fair eternal truth. But does it act there? yea, it does, and the Scripture expresses its acting by seeing God, drinking the fountain of life. Then the soul, thus in Christ, drinks in love and milks, and sucks in the soul-rejoicing irradiations of Christ, and Christ letting out the breathings of the sweetness of his excellency on the face of the soul draws and sucks in reciprocally acts of admiration and wondering, Cant. 2:8, ‘The voice of my beloved, behold he cometh leaping upon the mountaines, and skipping on the hills;’ ‘behold’ is a word of wonder, 1 Jn. 3:1, ‘Behold what manner of love the Father hath bestowed on us.’ Not love only, but the manner and the kind of the Father’s love in Christ, is a world’s wonder, and 2 Thess. 1:10, Christ when he comes shall be wondered in them that believe. 2. Then again when we see and enjoy the drawing loveliness of Christ, He as the fountain and well of life pours in, in our intellectuall love and in the glancings and rays of our understanding, acts of divine light, lumps of fresh love from the spring of heaven’s love, and the soul opens its mouth wide and takes in the streams of Christ’s nectar, honey and milk, his consolations and love-breathings; and in his light we seeing light, and in his love, feeling love, He makes out light and love (as it were) coeternal with borrowed eternity; and we go along with the out-shinings of Christ’s bright countenance, to shine in borrowed light, to flame in borrowed coals of love; and as Christ is said to feed his flock among the lilies, the garden of Christ, his Church being the common pasture for the lambs of the flock; so He feeds the souls of the saints that enjoy Him, with the marrow, fatness and dainties of his light and love that shine in his face, even as the oil feeds the lamp; but with this difference, Christ’s dainties are not lessened because we feed upon them, as the oil is consumed with burning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), pp. 360-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

</figure><figure class="quote" id="q-c9e7a0bd53" data-kw="">

<blockquote><p>Out of this translation of Enoch we may learn: … Thirdly, whereas the papists hold that all the fathers who died before Christ were in limbus and came not in heaven till Christ fetched them thence and carried them with Him at His ascension, here we learn it is most false and forged. For here we see Enoch and afterward Elijah were in heaven both in body and soul many hundred years before Christ’s incarnation, whereby (as also by many other evidences that might be brought) it is apparent that limbus patrum [‘the limbo of the Fathers’] is nothing but a device of that heretical Church of Rome. Against this ground, being the very words of the Old Testament, no man can take exception. And here in a word, let us all mark the high and sovereign authority of God’s Word, which even the Holy Ghost Himself vouchsafes to allege for the confirmation of His own words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, (RHB), vol. 3, pp. 47-75</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>
<div class="actions"><button class="copy" data-copy="“Out of this translation of Enoch we may learn: … Thirdly, whereas the papists hold that all the fathers who died before Christ were in limbus and came not in heaven till Christ fetched them thence and carried them with Him at His ascension, here we learn it is most false and forged. For here we see Enoch and afterward Elijah were in heaven both in body and soul many hundred years before Christ’s incarnation, whereby (as also by many other evidences that might be brought) it is apparent that limbus patrum [‘the limbo of the Fathers’] is nothing but a device of that heretical Church of Rome. Against this ground, being the very words of the Old Testament, no man can take exception. And here in a word, let us all mark the high and sovereign authority of God’s Word, which even the Holy Ghost Himself vouchsafes to allege for the confirmation of His own words.”

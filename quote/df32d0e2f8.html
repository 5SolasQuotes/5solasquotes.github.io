<blockquote><p>Men can place no religion in circumstances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), p. 22</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-539838700a" data-kw="">
<blockquote><p>III. Let us consider the concluding word, Amen. It imports two things. (1.) Our desire to be heard, q.d. so be it, Rev. 22:20. ‘Amen. Even so come, Lord Jesus.’ And the believer uses this word properly as a testimony of his desire, when by faith he is enabled and emboldened to plead with God, that He would fulfill his requests, 2 Chron. 20:6,11. (2.) Our Confidence and assurance that we shall be heard; q.d. so certainly it shall be, Rev. 1:7. ‘Even so Amen.’ And the sincere Christian uses the word with great propriety in the conclusion of his prayers, in testimony of his assurance to be heard, when he is by faith emboldened quietly to rest upon the Lord, that He will fulfill the desires of his heart, 2 Chron. 14:11. I conclude all with a very few inferences. … 4. Lastly, Use not Amen superficially at the end of your prayers, but with earnestness and faith. As for those who think it superstition to say Amen, they are ignorant of the word of God; and I would recommend to them to consult their Bible and Catechism, in order to cure them of that senseless conceit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Illustration of the Doctrines of the Christian Religion, ‘The Conclusion of the Lord’s Prayer’, in his Works</cite>, vol. 2, pp. 642-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-6ccc9b4c4f" data-kw="">
<blockquote><p>The particle wde, ‘here’, if referred to time, notes during Moses’s economy, while the Levitical law lasted; if it refer to place, it notes Jerusalem in the land of Canaan, where the temple was: in that habitation of the Israelitish church the Levitical priests were not only as to their nature and persons withering and decaying, ceasing to be on earth, though they had the honor to decimate their brethren, but as to their order and office, mortal, they were no better than the tithed and blessed by them, in prospect of death. Aaron himself, the first of the order, died, and so did all his successors, as well as Israel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations</cite>, On Mt. 23:23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

<blockquote><p>6. Though the law of tenths be not now necessary, as it was a ceremonious duty: but it is lawful either to keep that or any other constitution for the sufficient maintenance of the Church, whether it be more or less than the tenth part: yet we doubt not to say that this provision for the Church maintenance by paying of tithes is the most safe, indifferent and surest way, and no better can come in the place thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Concerning the Maintenance of the Church by Tithes’, ‘Whether the Payment of Tithes be Necessary?’ &amp; ‘By What Right Tithes are due to the Ministers of the Gospel?’ in Synopsis Papismi</cite>, (London, 1592), First Book or Century, 5th Controversy: Concerning Spiritual Persons, 6th Question, pp. 223-31, pp. 226-227</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-3fe43b0229" data-kw="">
<blockquote><p>11. We thought it meet to subjoin the full proof of every word [of our agreed upon articles] from the Scripture, that it might be past controversy with all believers. Concerning the texts cited, I must desire you to observe that every text does not express the very words that we have put down, but all express the sense and sum of the words; so that I think scarce two syllables can be found that are not expressly in the words of Scripture, which contain any matter that is liable to controversy. If you find ten texts cited for one thing, if the words be not in nine of them, it is sufficient if they be in the tenth; and therefore I must intreat you, if you doubt, to peruse them all. And let not the number offend you: If you need them not, they are no trouble to you: Few of them, I think, or none, are impertinent: A consent of many texts may convince more than one single text: at least it will be useful to have so many texts at hand for the convincing any others of any article of the Faith, though you doubt not yourselves. Only the particular application of some parts of the last branch, viz. ‘our consent that such a man shall be our pastor,’ and that ‘we will be members of this or that particular church:’ cannot be proved in terms from Scripture, but by consequence: For who can expect that Scripture should name the persons of our pastors or the places of our habitation?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘A Brief Explication of some Passages in the Profession’, p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

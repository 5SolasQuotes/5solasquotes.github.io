<main class="wrap"><figure class="quote" id="q-1cf9912c79" data-kw="">
<blockquote><p>…these considerations must be premised: 1. That mercy is otherwise in God than in man: in man indeed it is a grief or compassion conceived upon another’s misery: but in God it is only a propension and readiness of the divine will to help those which are in misery. 2. Mercy in God either signifies the inclination, power, faculty and property to show mercy, and this is natural in God: or the act and exercising of that property toward the creature, and this is so natural in God as yet it is directed by his will. 3. A thing is said to be natural two ways: Either that which only proceeds from the instinct of nature, as the fire naturally burns: or that whereunto nature inclines, yet not without direction of the will, as thus a man is said to speak, to understand naturally: So God is both ways naturally merciful, in Himself the first way; toward his creatures the second. Now to the arguments we answer: 1. The apostle [in Rom. 9:18] speaks not of the natural property, but of the act of mercy, which is directed by the will of God. 2. All the natural properties which are in God He always uses not, nor towards all: as his justice, power, longanimity, mercy: they are always in God, but He exercises them as it pleases Him. 3. Justice and mercy are not contrary, but cruelty is opposed to mercy: neither is there any contrariety in God, but in the effects in diverse subjects: as the Sun with the same heat mollifies the wax and hardens the clay. 4. Neither are these properties unequal in God, but the effects and acts only are unequal, as it pleases God to dispose in his freewill.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla, that is a Six-fold Commentary upon… Romans... (Lege, 1611) | on ch. 9, Places of Controversy, Controversy 12, Whether mercy be a natural property in God, or an effect only of his will, against Socinus?</cite></span></figcaption>

</figure><figure class="quote" id="q-1239b11234" data-kw="">
<blockquote><p>It should be the care both of ministers and of all those that deal with others first of all to use mild and winning, and gaining courses. Now to prove this: First, they are more suitable to the nature of man: for the nature of man is best wrought on by rational courses suitable to his nature… Again, they suit most to God’s disposition, for God is love [1 Jn. 4:8], and his course to man is love: if He take any course contrary to love, it is not his own work, as He says to punish man, it is not his own work [Isa. 28:21]. He is forced to that alway: to show love and mercy, that is his work, that that comes from his own principle, from his mercy: He is love; He does not say He is justice, or rigor, but He is love. It agrees with the nature of God to deal mercifully; if He deal otherwise, it is forced from us.</p></blockquote>

<blockquote><p>2. [About the word “righteousness“:] It cannot be denied but that in many places its used for that propensity in God whereby from his hatred to sin He punishes wicked men; and thus it must be here [in Ps. 11:7], as the context evidences. Thus it is evidently used 2 Chron. 12:6; Rom. 2:5. Therefore in the next place, righteousness attributed to God signifies in the general that rectitude and purity in God’s nature, whereby He is free from all sin and hates all iniquity. And then more particularly that attribute in God whereby He does punish ungodly men:</p></blockquote>

</figure><figure class="quote" id="q-ff0eb34bea" data-kw="">
<blockquote><p>2. The next thing in God is love, and that arises from goodness. The goodness that is in God inclines Him to love, and to be the most profuse lover. You read in 1 John 4:7-8, ‘God is love.’ The question is whether this speech does not import that He is love in Himself, as well as that He shows love. There are these reasons why it imports what He is in Himself, when He says, ‘God is love.’ Says He, verse 7, ‘Every one that loves is born of God, and knows God,’ that is the affirmative; and verse 8, ‘He that loves not knows not God, for God is love’; that is, he knows not God in what is most proper to Him, as to what does most abound in Him, for God is love. We ordinarily say of a man that is of such a disposition, I know him, he is so and so; so the believer knows God to be love… He speaks it of his love, which none sees but as manifest by effects; but God is love essentially. Says Aquinas, Whoever has a will, has a proneness to love. Says Musculus, As every one is in goodness, so in love. If God then has a will inclined to anything, it is to love; He has hatred in Him to sin, He has the opposite: He has a love also to something, only it is guided by his will towards creatures.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2. The next thing in God is love, and that arises from goodness. The goodness that is in God inclines Him to love, and to be the most profuse lover. You read in 1 John 4:7-8, ‘God is love.’ The question is whether this speech does not import that He is love in Himself, as well as that He shows love. There are these reasons why it imports what He is in Himself, when He says, ‘God is love.’ Says He, verse 7, ‘Every one that loves is born of God, and knows God,’ that is the affirmative; and verse 8, ‘He that loves not knows not God, for God is love’; that is, he knows not God in what is most proper to Him, as to what does most abound in Him, for God is love. We ordinarily say of a man that is of such a disposition, I know him, he is so and so; so the believer knows God to be love… He speaks it of his love, which none sees but as manifest by effects; but God is love essentially. Says Aquinas, Whoever has a will, has a proneness to love. Says Musculus, As every one is in goodness, so in love. If God then has a will inclined to anything, it is to love; He has hatred in Him to sin, He has the opposite: He has a love also to something, only it is guided by his will towards creatures.”

— Thomas Goodwin, The Object &amp; Acts of Justifying Faith, pt. 1, bk. 1, ch. 8, on Ex. 34:6-7 in The Works (d. 1680; Edinburgh: James Nichol, 1864), vol. 8, p. 59">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+The+next+thing+in+God+is+love%2C+and+that+arises+from+goodness.+The+goodness+that+is+in+God+inclines+Him+to+love%2C+and+to+be+the+most+profuse+lover.+You+read+in+1+John+4%3A7-8%2C+%E2%80%98God+is+love.%E2%80%99+The+question+is+whether+this+speech+does+not+import+that+He+is+love+in+Himself%2C+as+well+as+that+He+shows+love.+There+are+these+reasons+why+it+imports+what+He+is+in+Himself%2C+when+He+says%2C+%E2%80%98God+is+love.%E2%80%99+Says+He%2C+verse+7%2C+%E2%80%98Every+one+that+loves+is+born+of+God%2C+and+knows+God%2C%E2%80%99+that+is+the+affirmative%3B+and+verse+8%2C+%E2%80%98He+that+loves+not+knows+not+God%2C+for+God+is+love%E2%80%99%3B+that+is%2C+he+knows+not+God+in+what+is+most+proper+to+Him%2C+as+to+what+does+most+abound+in+Him%2C+for+God+is+love.+We+ordinarily+say+of+a+man+that+is+of+such+a+disposition%2C+I+know+him%2C+he+is+so+and+so%3B+so+the+believer+knows+God+to+be+love%E2%80%A6+He+speaks+it+of+his+love%2C+which+none+sees+but+as+manifest+by+effects%3B+but+God+is+love+essentially.+Says+Aquinas%2C+Whoever+has+a+will%2C+has+a+proneness+to+love.+Says+Musculus%2C+As+every+one+is+in+goodness%2C+so+in+love.+If+God+then+has+a+will+inclined+to+anything%2C+it+is+to+love%3B+He+has+hatred+in+Him+to+sin%2C+He+has+the+opposite%3A+He+has+a+love+also+to+something%2C+only+it+is+guided+by+his+will+towards+creatures.%E2%80%9D%0A%0A%E2%80%94+Thomas+Goodwin%2C+The+Object+%26+Acts+of+Justifying+Faith%2C+pt.+1%2C+bk.+1%2C+ch.+8%2C+on+Ex.+34%3A6-7+in+The+Works+%28d.+1680%3B+Edinburgh%3A+James+Nichol%2C+1864%29%2C+vol.+8%2C+p.+59&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fff0eb34bea.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ff0eb34bea.html">Permalink</a><a class="src" href="h

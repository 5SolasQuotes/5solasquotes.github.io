<main class="wrap"><figure class="quote" id="q-7410b9c799" data-kw="">
<blockquote><p>From the moment there was a man upon the earth, it seems to have been the will of God that a seventh part of time should be consecrated to his service. It is quite certain that much, very much, is made of the Sabbath throughout the whole of the Old Testament, and, especially, that the Prophets, in all their reflections on the melancholy past, and in all their anticipations of the portentous future, represent the sanctification of the Sabbath as lying at the foundation of all temporal as well as spiritual prosperity, and the neglect of this divine institution as most certainly drawing down the destroying judgments of God on those who indulged it. This feature of the prophetic parts of the Old Testament, is too prominent to escape the notice of any intelligent reader.

The Prophets dwell much more on moral than ceremonial observances; and denounce the terrors of the Almighty much more frequently and solemnly against delinquencies with regard to the former than the latter. Yet who that has read their thrilling pages has failed to observe that the desecration of the Sabbath is the object of their constant and most emphatic proclamations of Divine wrath; and represented as that great and radical sin, which, more than most others, is adapted to undermine religious character, and to destroy nations? In fact, there is no sin, unless, perhaps, it may be that of idolatry, which is more heavily censured, or more awfully threatened, throughout their writings, than the breach of the Sabbath. Surely, such language as the following ought to make a deep impression upon every reflecting mind …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introductory Essay in John Holmes Agnew, A Manual on the Christian Sabbath</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c65ec98d77" data-kw="">
<blockquote><p>It’s demanded, What fruit was it, which brought the Axe to the Root of the tree?

1. It was prophanation of the Sabbath, Jerem. 17. 24, 25. 27. If they made conscience of God’s Sabbath, he would take care of their City: If they would hollow that day with pious duties, he would honour them with choice Princes; but if they would defile his day, he would fire their City, and that with unquenchable fire.

This made Nehemiah so zealous for the Sabbath, after the return from Babylon, Neh. 13. 17, 10. he contended with the Nobles, and said, What evil thing is this that ye do, and prophane the Sabbath day? did not your Father’s thus, and did not our God bring all his evils upon us, and upon this City? yet ye bring more wrath upon Israel, by prophaning the Sabbath day. He knew that sin had formerly laid them waste, and would therefore stand for the Sabbath, that the Lord of Sabbaths might stand for and by them. England is not innocent in this thing. The Book of Sports (a Monster that Heathen and Idolatrous Kingdoms never produced) that opened a wide door to prophane the Lord’s day, hath kindled a fire in our Land, which is not like to be extinct till that Book be burnt by publique Authority.

2. Idolatry, that is a Kingdom destroying sin. Jeroboam’s two Calves eat up the 10. Tribes, and Manasses’ Idols devoured Juda, Hos. 13 1. When Ephraim sinned in Baal then he died. Idolatry is the death of a Land, it divides between God and Kingdoms, it breaks the Covenant, and causes God to give a Bill of Divorce, and that is not all, it calls forth Gods fury upon a Land, Ezek. 36. 18. 19. and that is a destructive thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-greenhill.html">William Greenhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Αξινε προσ τεν Ριζαν. The axe at the root, a sermon preached before the Honourable House of Commons, at their public fast, April 26. 1643</cite>, (London: Benjamin Allen, 1643), pp 21-22.</span></figcaption>

</figure><figure class="quote" id="q-ce12967c23" data-kw="">
<blockquote><p>But, on the contrary, whereas the malicious craft of Satan and the prevalent power and rage of mankind have combined and been set at work to the ruin and utter suppression of this book, proceeding sometimes so far as that there was no appearing way for its escape; yet, through the watchful care and providence of God, sometimes putting itself forth in miraculous instances, it hath been preserved unto this day, and shall be so to the consummation of all things.

The event of that which was spoken by our Saviour, Matt. v. 18, doth invincibly prove the divine approbation of this book, as that doth its divine original, “Till heaven and earth pass, one jot or one tittle shall in no wise pass from the law.” God’s perpetual care over the Scripture for so many ages, that not a letter of it should be utterly lost, nothing that hath the least tendency towards its end should perish, is evidence sufficient of his regard unto it.

Especially would it be so if we should consider with what remarkable judgments and severe reflections of vengeance on its opposers this care hath been managed, instances whereof might easily be multiplied. And if any will not ascribe this preservation of the books of the Bible, not only in their being, but in their purity and integrity, free from the least just suspicion of corruption, or the intermixture of any thing human or heterogeneous, unto the care of God, it is incumbent on him to assign some other cause proportionate to such an effect, whilst it was the interest of heaven and the endeavour of earth and hell to have it corrupted and destroyed.

For my part, I cannot but judge that he that seeth not an hand of divine Providence stretched out in the preservation of this book and all that is in it, its words and syllables, for thousands of years, through all the overthrows and deluges of calamities that have befallen the world, with the weakness of the means whereby it hath been preserved, and the interest, in some ages, of all those in whose power it was to have it corrupted, — as it was of the apostate churches of the Jews and Christians, — with the open opposition that hath been made unto it, doth not believe there is any such thing as divine providence at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reason of Faith; or, An Answer unto that Inquiry, “Wherefore we Believe the Scripture to be the Word of God;” with the Causes and Nature of that Faith wherewith we do so</cite>, (London, 1677) in William H. Goold (ed.), The Works of John Owen (16 vols, Edinburgh: Banner of Truth, 1965), iv, 24.</span></figcaption>

<blockquote><p>[Margin Note:] The uncovering of the head not like kneeling We uncover our heads, say they, when we receive the elements, why may we not also kneel? I answer: First, the uncovering of the head is a gesture of reverence only, and that only among some nations, but not of adoration. The Jews, Turks and Mahometans pray with their heads covered. The Grecians and Romans of old, howbeit they walked in public with uncovered heads, except in rain, great heat or mourning, yet in the service of their gods, they had their heads covered. The Europeans this day uncover their heads when they are praying. Kneeling is a gesture of adoration among all nations, either in civil or religious use. Augustine says: ‘Honorat emnis qui adorat, no autem adorat omnes quid onorat;’ ‘Every one that does adore, does honor, but not every one that honors, adores.’ Contra Serm. Arian., ch. 23 I will not kneel to every one to whom I uncover my head civilly. Everyone that stands with his head uncovered in presence of the king is not adoring, as he is who is presenting his petition to the king upon his knee in their sight. A provincial synod holden at London (anno 1603) ordained the head to be uncovered when their service is read in the Church, yet I think they would not have enjoined kneeling. We [the Scots] hear the canonical scripture read [in the administration of the Lord’s Supper] with uncovered heads, but yet we kneel not. The words of Christ, which He uttered at the institution are still and often uttered; that same voice sounds through all the tables of the world; his actions, which were divine and holy, are reiterat[ed]. In Gratian’s decree (De consecrat. dist. 1, ch. 68) we have a superstitious direction of Pope Anastasius, that when the Gospel is read in the Church, those that are present shall not sit, but stand, venerabiliter curvi, bowing reverently, hearken and adore. Wherefore more at the hearing of the Gospel than the [reading of the] Epistle[s], which is also Evangelical? Yet you see, howbeit that standing with bowing be more than to have the head uncovered, it was but veneration. And, whereas he says, Et fideliter adorent, the gloss has, id est venerentur, because the word ‘adoring’ is taken there in a large sense, as ye may see [in] sundry places above cited, not for that which is in a strict sense called adoration. Adoration in strict sense is kneeling or prostration. Whereas Matthew says, ch. 8, of the leprous man, that he worshipped Christ, or adored Christ, as the Latin translation has according to the original, Mk. 1:40, He kneeled down to Him, and Luke 5:12, that he fell in his face. Suchlike, where it is said of the Cananitish woman, Mt. 15:25, that she worshipped, or adored Him: et adoravit eum, Mk. 7:25, it is said that she fell at his feet. The Greek word [Greek], signifies to fall down like a dog o••whelp at the feet of another, as our Lord. Further, our heads are not other way uncovered in the act of receiving than in the rest of the time of the celebration when we are not near the elements. And thirdly, the uncovering of our head is compatible with the variety of actions in time of celebration: praying, singing, the words of the institution, and chapters read, but adoration directed, as they pretend to God, cannot be without presenting our petitions and thanks to God, which requires a several part of the action by itself.</p></blockquote>

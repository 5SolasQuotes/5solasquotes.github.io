<blockquote><p>Many evangelicals think that you can be a Christian while treating the church as an optional extra. The Reformed faith denies this, and so the Westminster Confession teaches that outside the visible church there is no ordinary possibility of salvation (WCF 25:2). Likewise, Henry Bullinger expresses the same opinion when he says: ‘Without the church, as it were without the ark of Noe, is no salvation: but in the church, I mean, in the fellowship of Christ and the saints, is full forgiveness of all offences.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i,164.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-871af72684" data-kw="">
<blockquote><p>2. Be it granted: That there is no salvation to any that are out of the communion (i.e.) internal of the Church (For certainly none are saved that are not the members of Christ, the Head; and then tis impossible that any should be one of the members of Christ and not have those of the church for his fellow-members, unless Christ have two distinct bodies). Of this St. Augustine, Against the Donatists, Of the Unity of the Church, ch. 2, speaks very fully: ‘Quaestio certe inter nos versatur, ubi sit Ecclesia; utrum apud nos, an apud illos? Quae utique una est; quam majores nostri Catholicam nominarunt. Haec autem Ecclesia corpus Christi est. Unde utique manifestum est, eum, qui non est in membris Christi, Christianam salutem habere non posse. Membra vero Christi per unitatis charitatem sibi copulantur, et per eandem capiti suo cohaerent, quod est Jesus Christus.’ He continues afterward, ch. 4: ‘Quicunque de ipso Capite Scripturis sanctis consentiunt [i.e. are never so orthodox in their belief] et unitati Ecclesiae non communicant, non sunt in Ecclesia; quia de Christi corpore (quod est Ecclesia) dissentiunt ab ipsius Christi testificatione [i.e. that she is toto orbe diffusa, and shall never perish, etc.] et apertissimis ac notissimis Scripturarum testimoniis contradicunt.’ Again: ‘Quicunque credunt quod Christus Jesus in carne vener it etc. sed tamen ab ejus corpore, quod est Ecclesia, ita dissentiunt, ut eorum communio non sit cum toto quacunque diffunditur, sed in aliqua parte separata inveniatur; manifestum est eos non esse in Ecclesia Catholica. In aliqua parte separata, for the reason given by him above; because they want charity: Membra vero Christi per unitatis charitatem sibi copulantur, et capiti suo; and because notissimis Scripturis contradicunt.’

3. But, all this being granted, yet 3rdly, if any happen to be extra Ecclesiam [outside the Church], out of the Church’s external communion, or also in parte separata [in a part separated]; so he be not guilty of that fault which makes such separation damnable, but still retains the necessary bond of charity; such a one (once joined unto it by baptism), though amongst other separatists, seems to remain himself still unseparated (though not from the external, yet) from the internal communion of the Church. And if any be so strict, as, besides this internal (effected by the same Spirit of Christ in all the faithful, and always seen to God) always to exact an external also, such assertion will in many instances prove false, even in St. Augustine’s Confessions; who freely acknowledges both many that are in the external communion of the Church, no true members thereof; and many to be true members of the Church who are out of the external communion thereof. See Of the Unity of the Church, ch. 20: ‘Multi tales sunt in Sacramentorum communione cum Ecclesia, et tamen jam non sunt in Ecclesia: Alioquin et tunc quisque praeciditur, cum excommunicatur. Consequens erit, ut tunc rursus inseratur, cum visibiliter communioni restituitur. Quid si ergo sictus accedat, atque adversus veritatem et Ecclesiam •or inimicissimum gerat? Quamvis peragatur in eo illa solemnitas, nunquid reconciliatur? nunquid inseritur? absit. Sicut ergo, jam denuo communicans nondum insertus est; sic et antequam visibiliter excommunicatur, quisquis contra veritatem, qua convincitur et arguitur, inimicum gest at animum, jam praecisus est.’ Again; Of Baptism, bk. 1, ch. 17: ‘Semper ab illius Ecclesiae, quae sine macula et ruga est, unitate divisus est, etiam qui, in carnali obduratione, congregationi Sanctorum miscetur.—Spirituales autem sive ad hoc ipsum pro studio proficientes, non eunt for as [i.e. when they are excommunicated]: quia et quum aliqua vel perversitate, vel necessitate hominum, videntur expelli; ibi magis probantur quam si intus permaneant; cum adversus Ecclesiam nullatenus eriguntur, sed in solida unitatis petra fortissimo charitatis robore radicantur.’ Add to this the place quoted below, §13, and that discourse of his Of the Unity of the Church, ch. 20, of the several degrees of their culpableness who may live in a schismatical communion, set down §7: Where the father affirms, God has some good corn amongst those tares: ubi radice viva herbae vigor atteritur, etc. Several instances therefore there may be given wherein such assertion will prove false. For example: It is granted to be false in those who are unjustly excommunicated (as some, tis by all conceded, may be); and in penitents, after a just excommunication, who are not yet actually reconciled, of whom Bellarmine, De Ecclesia, bk. 3, ch. 6, says: ‘Tales esse in Ecclesia animo sive desiderio, quod sufficit illis ad salutem:’ bringing in St. Augustine’s saying, Of the True Religion, ch. 6, of such like; Hos coronat in occulto Pater in occulto videns. (See below §) Again: false, at least, in those dying after baptism, before the use of reason, in a schismatical Church. Again, false in catechumeni [catechumens] that die before they receive baptism, or are entered into the Church… I add that some of the catechumeni were such, as, for secular reasons, etc, deferred baptism long after they might have been admitted to, and received, it: and amongst such, I suppose was Valentinian; who dying before baptism received, after baptism willingly deferred, yet St. Ambrose doubted not of his salvation… But we must put some difference between the committing of a fault (in the want [lack] thereof), and the incurring of certain damnation… I say therefore, in such cases, the position above, being meant of external communion, is false: and then why may it not also be so in some other cases? As namely in one, whose ill hap it is to be born in a schismatical communion, yet where he partakes the true sacraments; when it is supposed, that such a one may be guiltless of that crime, for which the schismatical are damned.</p></blockquote>

— Obadiah Walker, ‘Of the Danger of Schism’, pp. 4-7 in Of Faith Necessary to Salvation &amp; of the Necessary Ground of Faith Salvifical whether this, alway, in every man, must be infallibility… (Oxford, 1688), Concerning Salvation possible to be had in a Schismatical Communion and Concerning the danger of living in, and the necessity of departing from, a Known-Schismatical Communion">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+Be+it+granted%3A+That+there+is+no+salvation+to+any+that+are+out+of+the+communion+%28i.e.%29+internal+of+the+Church+%28For+certainly+none+are+saved+that+are+not+the+members+of+Christ%2C+the+Head%3B+and+then+tis+impossible+that+any+should+be+one+of+the+members+of+Christ+and+not+have+those+of+the+church+for+his+fellow-members%2C+unless+Christ+have+two+distinct+bodies%29.+Of+this+St.+Augustine%2C+Against+the+Donatists%2C+Of+the+Unity+of+the+Church%2C+ch.+2%2C+speaks+very+fully%3A+%E2%80%98Quaestio+certe+inter+nos+versatur%2C+ubi+sit+Ecclesia%3B+utrum+apud+nos%2C+an+apud+illos%3F+Quae+utique+una+est%3B+quam+majores+nostri+Catholicam+nominarunt.+Haec+autem+Ecclesia+corpus+Christi+est.+Unde+utique+manifestum+est%2C+eum%2C+qui+non+est+in+membris+Christi%2C+Christianam+salutem+habere+non+posse.+Membra+vero+Christi+per+unitatis+charitatem+sibi+copulantur%2C+et+per+eandem+capiti+suo+cohaerent%2C+quod+est+Jesus+Christus.%E2%80%99+He+continues+afterward%2C+ch.+4%3A+%E2%80%98Quicunque+de+ipso+Capite+Scripturis+sanctis+consentiunt+%5Bi.e.+are+never+so+orthodox+in+their+belief%5D+et+unitati+Ecclesiae+non+communicant%2C+non+sunt+in+Ecclesia%3B+quia+de+Christi+corpore+%28quod+est+Ecclesia%29+dissentiunt+ab+ipsius+Christi+testificatione+%5Bi.e.+that+she+is+toto+orbe+diffusa%2C+and+shall+never+perish%2C+etc.%5D+et+apertissimis+ac+notissimis+Scripturarum+testimoniis+contradicunt.%E2%80%99+Again%3A+%E2%80%98Quicunque+credunt+quod+Christus+Jesus+in+carne+vener+it+etc.+sed+tamen+ab+ejus+corpore%2C+quod+est+Ecclesia%2C+ita+dissenti e+catechumeni+were+such%2C+as%2C+for+secular+reasons%2C+etc%2C+deferred+baptism+long+after+they+might+have+been+admitted+to%2C+and+received%2C+it%3A+and+amongst+such%2C+I+suppose+was+Valentinian%3B+who+dying+before+baptism+received%2C+after+baptism+willingly+deferred%2C+yet+St.+Ambrose+doubted+not+of+his+salvation%E2%80%A6+But+we+must+put+some+difference+between+the+committing+of+a+fault+%28in+the+want+%5Black%5D+thereof%29%2C+and+the+incurring+of+certain+damnation%E2%80%A6+I+say+therefore%2C+in+such+cases%2C+the+position+above%2C+being+meant+of+external+communion%2C+is+false%3A+and+then+why+may+it+not+also+be+so+in+some+other+cases%3F+As+namely+in+one%2C+whose+ill+hap+it+is+to+be+born+in+a+schismatical+communion%2C+yet+where+he+partakes+the+true+sacraments%3B+when+it+is+supposed%2C+that+such+a+one+may+be+guiltless+of+that+crime%2C+for+which+the+schismatical+are+damned.%E2%80%9D%0A%0A%E2%80%94+Obadiah+Walker%2C+%E2%80%98Of+the+Danger+of+Schism%E2%80%99%2C+pp.+4-7+in+Of+Faith+Necessary+to+Salvation+%26+of+the+Necessary+Ground+of+Faith+Salvifical+whether+this%2C+alway%2C+in+every+man%2C+must+be+infallibility%E2%80%A6+%28Oxford%2C+1688%29%2C+Concerning+Salvation+possible+to+be+had+in+a+Schismatical+Communion+and+Concerning+the+danger+of+living+in%2C+and+the+necessity+of+departing+from%2C+a+Known-Schismatical+Communion&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F871af72684.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/871af72684.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-phrase-there-is-no-salvation-outside-the-church/#:~:text=2.%20Be%20it%20granted%3A%20That%20there,for%20which%20the%20schismatical%20are%20damned&amp;text=2.%20Be%20it%20granted%3A%20That%20there%20is%20no&amp;text=that%20crime%2C%20for%20which%20the%20schismatical%20are%20damned" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Q. May one be saved out of the Church’s communion? A. There is no salvation out of the universal Church; but there is no particular church out of which one may not be saved, and there is such particular church, the communion whereof must one renounce than to be saved. Q. What difference is there between the particular churches? A. Some are pure and true in their doctrine, and others are impure and untrue.</p></blockquote>

</figure><figure class="quote" id="q-10590f5402" data-kw="">
<blockquote><p>3. We must know that there is no salvation out of this Church; such as never become members of it, must eternally perish: they that are true members, shall be saved. If they had been of us, they would have continued with us: but they went out from us, that it might be manifest they were not of us. Without are dogs and scorners, etc. All out of the ark perished in the waters. ‘The Lord added to the Church daily such as should bee saved.’ First, because there is no means of salvation out of it; no word to teach, no sacraments to confirm. And especially because out of the Church there is no Christ, and out of Christ no salvation. Who have not the Church their mother, cannot have God their Father… ‘The general assembly’ [Heb. 12:23]: this is the property of the Church; ‘General’. It is catholic in three respects; of Time, of Persons, of Place… Thus we see the property of this Church, catholic or general. It is one, but not tied to one time, nor one place, nor one person: it is catholic to all times, to all places, to all persons… …I desire to express two things: one for distinction, the other for instruction. First for distinction betwixt this Generall assembly and particular churches: then for instruction, to show who be true members of this catholic Church. 1. The main difference between them consists in this: that the catholic Church is always invisible, the members thereof only known to God: particular churches are sometimes invisible, and lying hid; other times manifest in the open profession of Christ’s name.</p></blockquote>

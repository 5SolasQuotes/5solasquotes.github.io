<main class="wrap"><figure class="quote" id="q-deee31033b" data-kw="">
<blockquote><p>Let us not suppose, then, that the Holy Spirit, by this promise, commends the dignity of our works, as if they were deserving of such a reward. For Scripture leaves us nothing of which we may glory in the sight of God. Nay, rather its whole object is to repress, humble, cast down, and completely crush our pride. … to this happiness he gives the name of reward, hire, recompense, not as estimating the merit of works, but intimating that it is a compensation for their straits, sufferings, and affronts, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1d3367e33f" data-kw="">
<blockquote><p>Just as we say there is a certain merit ex congruo, so we shall say there is a certain reward ex congruo, which is owed rather of grace than of justice.</p></blockquote>

</figure><figure class="quote" id="q-3cdade0ee1" data-kw="">
<blockquote><p>Accordingly, when the Scripture speaks of &quot;a crown of righteousness which God the righteous Judge shall give&quot; &quot;at that day,&quot; (2 Tim. 4:8), I not only say with Augustine, … but I also add, how could he impute righteousness to our works, did not his indulgence hide the unrighteousness that is in them? How could he deem them worthy of reward, did he not with boundless goodness destroy what is unworthy in them? Augustine is wont to give the name of grace to eternal life, because, while it is the recompense of works, it is bestowed by the gratuitous gifts of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.5</span></figcaption>

</figure><figure class="quote" id="q-73bdee7a45" data-kw="">
<blockquote><p>Merit and reward refer to the same, for a reward means something given anyone in return for work or toil, as a price for it. … Now it is clear that between God and man there is the greatest inequality: for they are infinitely apart, and all man&#x27;s good is from God. Hence there can be no justice of absolute equality between man and God, but only of a certain proportion, inasmuch as both operate after their own manner. Now the manner and measure of human virtue is in man from God. Hence man&#x27;s merit with God only exists on the presupposition of the Divine ordination, so that man obtains from God, as a reward of his operation, what God gave him the power of operation for.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae</cite>, I-II, q. 114, a. 1</span></figcaption>

</figure><figure class="quote" id="q-9713d497d0" data-kw="">
<blockquote><p>Nor ought it to be doubted that condign merit can vary in these three ways. For if some work were much inferior to the reward promised by agreement—as if the lord of a vineyard hired laborers and promised as wages, not a denarius a day, but a hundred gold pieces—such merit would be ex condigno by reason of the pact, not by reason of the work. Conversely, if the work were really equal to the reward, or perhaps even greater, but no agreement had intervened, then if such merit ought to be called ex condigno, it would have to be called ex condigno by reason of the work, not by reason of the pact. … Finally, if a pact both intervenes and the work is truly equal to the reward, as when laborers are hired for the vineyard for a denarius a day according to the Gospel, that merit will be ex condigno by reason of the work and by reason of the pact.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.17 (translated from the Latin)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-0c3aa81cbf" data-kw="">
<blockquote><p>Fifthly, says the Author [Thomas Hooker, a congregationalist], ‘The elders have power to dismiss the people or Church, and that with a blessing, Num. 6:23-26, which is an act of superiority, Heb. 7:7. [Rutherford’s] Answer: This [his use of ‘elders’] is but an empty title also. For: 1. The pastor, only and one, dismisses doctor, elders, deacons and the whole congregation… 2. A majority or superiority [by the pastor, in some sense] is one thing, and a power of jurisdiction is another. Blessing of the Church at their dismission is nothing but a prayer of the whole Church (the minister being [the] mouth) who blesses all, and is no act of superiority of jurisdiction… And I much doubt if the priest’s blessing of the people, Num. 6, was moral, and if it was not typical, he not taking in himself but as a type of Christ [in] pronouncing the whole visible Church blessed, so typifying Christ our Priest, in whom all the nations of the earth are blessed, Gal. 3:8,14…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, Part 2, p. 322</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

<blockquote><p>5. Prayer to God, as the mouth of the people, is a part of the office of the Lord’s ministers: for so much is imported by pointing at the gesture of the supplicant: ‘Lift up your hands in the sanctuary,’ that is, in the place where the people assemble.</p></blockquote>

</figure><figure class="quote" id="q-14172bfe30" data-kw="">
<blockquote><p>…for you lay down as an undeniable principle, and the basis of your whole doctrine of independent government that there are no visible Churches in the world but a congregation meeting in one place to worship God, which I have demonstrated to be most false… so, though a congregation may only be actually seen when it is convened within the four angles of a material house, yet all the congregations on earth make one visible Church, and have some visible and audible acts of external government common to all, as that all pray, praise, fast, mourn, rejoice, one with another; and are to rebuke, exhort, comfort one another and to censure one another, so far as is possible, and of right and by law meet in one council, and so by Christ’s institution are that way visible, that a single congegation is visible which meets in one house, though many be absent de facto, through sickness, callings, imprisonment and some through sinful neglect;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 1, p. 95</span></figcaption>

</figure><figure class="quote" id="q-411f6d6d8e" data-kw="">
<blockquote><p>This thesis is an examination of the eucharistic doctrine of ten Scottish theological writers in the tradition of Scottish Episcopacy… The argument of this thesis is that all of the writers, rejecting the Tridentine, Lutheran, Bezan-Calvinist, and Zwinglian definitions of the Eucharist, maintained a material sacrifice in the Eucharist, which is an offering to God the Father of bread and wine as the propitiatory memorial of Christ’s death on the Cross, commanded by Christ Himself at the Last Supper. The sacrifice is propitiatory because it is the means of representing the one sacrifice of Christ on the cross to God the Father, thereby pleading the benefits of the cross for the communicants. The bread and wine do not change substance, but become effectively the body and blood of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wallace-d-kornahrens.html">Wallace D. Kornahrens</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eucharistic Doctrine in Scottish Episcopacy</cite>, 1620-1875 Download (2008) PhD thesis 300 pp. | Abstract:</span></figcaption>

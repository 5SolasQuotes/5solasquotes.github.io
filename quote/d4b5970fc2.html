<main class="wrap"><figure class="quote" id="q-d4b5970fc2" data-kw="">
<blockquote><p>3. Those duties which are required of all those who publicly preach the Word of God in the Name of Christ are not required of all those Christians that are gifted: as that there lies on them the pastoral charge of souls, of which they are to give an account to God, Heb. 13:17, that they ought to give themselves wholly to the reading and studying of the Scriptures, 2 Tim. 4:15-16, that they may not apply themselves to the things of this world, 2 Tim. 2:4, that in the Name of Christ as his Ambassadors they entreat men to be reconciled to God, 2 Cor. 5. 20, that they are to distribute to all and every one in the house of God their portion of food in due season, Mt. 24:46, that they are authoritatively in the Name of Christ to remit and retain sins, Jn. 20:21. Now all these things are not enjoined on all Christians who have received the gifts of the Spirit. 4. Hence also the privileges and promises which are made to pastors, who preach the Word in the Name of God, are not given to all believers who are endued with the gifts of the Spirit; as, that they are worthy of double honor, 1 Tim. 5:17, that God will by a peculiar and singular assistance of his Spirit be present with them, Mt. 28:20; Lk. 21:14-15. And so a prophet’s recompence and reward is distinguished from the reward of a righteous man, Mt. 10:42. Therefore that labor, duty, and burden, to which these promises are made, is not imposed on all the righteous that are endued with gifts of the Holy Ghost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England, Concerning the Government of the Church of God (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’</cite>, pp. 79-80</span></figcaption>

<blockquote><p>…let us note that God will have every of us nowadays for his own part to do his endeavor to multiply the church… And when God vouchsafeth us his grace to win any man, and to bring him into his flock, then are we as spiritual fathers… Now albeit that all have not that office of preaching the Word of God, yet a private person being a member of the Church, may beget spiritual children unto God, if he have occasion and ability to win a poor soul and to enlighten him with the faith of the gospel. Let us then bestow our pains to this end, knowing that if the carnal marriage was so precious under the law in the sight of God: Surely the mean whereby we be made members of our Lord Jesus Christ, is a thing now far dearer and of greater estimation with Him. And therefore let every man employ himself that way to the uttermost of his poor. For here is no forcing of us to marry against our wills, but of the winning of wives unto our Lord Jesus Christ, that by the multiplying of the Church, we may always be the more firmly linked unto Him. Seeing then that our condition is more gentle and sweet than that which was under the law, we ought to be stirred up so much the more to the discharging of that duty, and we shall have so much the less excuse if we be careless and negligent therein.</p></blockquote>

<blockquote><p>Mr. Hooker [a congregationalist]: ”The Apostles’ (says Mr. Rutherford) ‘stand in the room of the whole catholic ministerial guides when they revealed the keys.’ [Hooker’s] Answer [to Rutherford]: The apostles in that commission were extraordinary persons sent to all the world to lay the foundation of the Gospel, by an apostolic power; and in this sense they have no successors, nor stand in the room of any.’ [Rutherford’s] Answer: [1.] If the apostles represent none in this sense, Mt. 28:19; Mk. 16:15; Jn. 20:21, ‘Go and teach, etc.’, ‘Whose sins ye remit, etc.’, then none succeed the apostles to teach, baptize, remit and retain sins; pastors then must do these without a commission from Christ, or these ordinances must cease. 2. Mt. 28; Jn. 20, He sends the apostles and says, ‘Behold, I am with you to the end of the world,’ in preaching and baptizing. The apostles, Mt. 28:19-20; Jn. 20:21-22, when they received power to preach and baptize, did represent all ordinary teachers to the end of the world, or then ordinary teachers want [lack] all calling. But the apostles do not live to preach and baptize to the end of the world; therefore that ministerial presence of Christ must be promised to some represented by the apostles. So the English Divines, Calvin, Beza, Diodati [held], as apostles gifted with power of working miracles, etc., they represented none, nor had they any successors. So [in] Mt. 28, the pastors have the power of the keys and of office given them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum... (London, 1658), bk. 4, ch. 2</cite>, pp. 353-4</span></figcaption>

<blockquote><p>But what can be the reason, may some man say, why the Scripture has not itself determined these kinds of assemblies [synods, general assemblies, etc.] particularly? I answer, three reasons may begiven for it: 1. Because it was not necessary, the general rules of the word, together with nature’s light, which directeth commonwealths in things of the same kind, being sufficient to direct the church therein. 2. As seasons and times for the meeting of assemblies , so the just bounds thereof in so many different places of the world are things of that kind which were not determinable in Scripture, unless the world had been filled with volumes thereof; for, individua sunt infinita. 3. Because this constitution of synods, provincial and national, is not universal for all times and places; for example, there may bein a remote island ten or twelve Christian congregations, which, beside their particular elderships, have a common presbytery, but are not capable of synods, either provincial or national. Again, let there be an island containing forty or fifty Christian congregations, there shall be therein, beside presbyteries, one kind of a synod, but not two kinds. Besides, the reformed congregations within a great nation may haply [by chance] be either so few, or so dispersed and distant, or so persecuted, that they can neither have provincial nor national assemblies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland (1641)</cite>, p. 53</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But what can be the reason, may some man say, why the Scripture has not itself determined these kinds of assemblies [synods, general assemblies, etc.] particularly? I answer, three reasons may begiven for it: 1. Because it was not necessary, the general rules of the word, together with nature’s light, which directeth commonwealths in things of the same kind, being sufficient to direct the church therein. 2. As seasons and times for the meeting of assemblies , so the just bounds thereof in so many different places of the world are things of that kind which were not determinable in Scripture, unless the world had been filled with volumes thereof; for, individua sunt infinita. 3. Because this constitution of synods, provincial and national, is not universal for all times and places; for example, there may bein a remote island ten or twelve Christian congregations, which, beside their particular elderships, have a common presbytery, but are not capable of synods, either provincial or national. Again, let there be an island containing forty or fifty Christian congregations, there shall be therein, beside presbyteries, one kind of a synod, but not two kinds. Besides, the reformed congregations within a great nation may haply [by chance] be either so few, or so dispersed and distant, or so persecuted, that they can neither have provincial nor national assemblies.”

— George Gillespie, An Assertion of the Government of the Church of Scotland (1641), p. 53">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+what+can+be+the+reason%2C+may+some+man+say%2C+why+the+Scripture+has+not+itself+determined+these+kinds+of+assemblies+%5Bsynods%2C+general+assemblies%2C+etc.%5D+particularly%3F+I+answer%2C+three+reasons+may+begiven+for+it%3A+1.+Because+it+was+not+necessary%2C+the+general+rules+of+the+word%2C+together+with+nature%E2%80%99s+light%2C+which+directeth+commonwealths+in+things+of+the+same+kind%2C+being+sufficient+to+direct+the+church+therein.+2.+As+seasons+and+times+for+the+meeting+of+assemblies+%2C+so+the+just+bounds+thereof+in+so+many+different+places+of+the+world+are+things+of+that+kind+which+were+not+determinable+in+Scripture%2C+unless+the+world+had+been+filled+with+volumes+thereof%3B+for%2C+individua+sunt+infinita.+3.+Because+this+constitution+of+synods%2C+provincial+and+national%2C+is+not+universal+for+all+times+and+places%3B+for+example%2C+there+may+bein+a+remote+island+ten+or+twelve+Christian+congregations%2C+which%2C+beside+their+particular+elderships%2C+have+a+common+presbytery%2C+but+are+not+capable+of+synods%2C+either+provincial+or+national.+Again%2C+let+there+be+an+island+containing+forty+or+fifty+Christian+congregations%2C+there+shall+be+therein%2C+beside+presbyteries%2C+one+kind+of+a+synod%2C+but+not+two+kinds.+Besides%2C+the+reformed+congregations+within+a+great+nation+may+haply+%5Bby+chance%5D+be+either+so+few%2C+or+so+dispersed+and+distant%2C+or+so+persecuted%2C+that+they+can+neither+have+provincial+nor+national+assemblies.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+An+Assertion+of+the+Government+of+the+Church+of+Scotland+%281641%29%2C+p.+53&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe8a82d4739.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e8a82d4739.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/evangelism#:~:text=But%20what%20can%20be%20the%20reason,neither%20have%20provincial%20nor%20national%20assemblies&amp;text=But%20what%20can%20be%20the%20reason%2C%20may%20some&amp;text=they%20can%20neither%20have%20provincial%20nor%20national%20assemblies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>[Margin Note:] Evangelists are now ceased as well as apostles. 2. Synods from Acts 15 and Acts 13 may lend men, authorized with pastoral power, to heathens to spread the Gospel; and private men as no pastors, but as private men, are intruders [though] authorized by Mr. Hooker, for they have no promise, such as pastors have by Mt. 28:19-20; Mk. 16:15-17; Jer. 1:6,17-18, to plant Churches among the heathens; nor is there a warrant to say that evangelists are ordinary officers left by Christ to plant Churches. If Hooker have any ground from Eusebius or Scripture for evangelists now, or in Trajan’s time, he must show that they have the gift of tongues: for how could evangelists be fellow-helpers to preach the Gospel to the Churches planted by the apostles if they were not an extraordinary office only? See those divines in the margin, and my learned and dear brother, Mr. George Gillespie, Miscellaneous Questions, ch. 7. If the Church should send any to the heathen any way rip[…] for the Gospel, these could be no other than ordinary pastors to them. [Margin Note:] Tilen, Syntagma, disputation 19, thesis 38, Apostolorum vice, ubi res poscebat, fungebantur. Professors of Leiden, Synopsis of Pure Theology, disputation [??], thesis 17, p. 605; [William] Bucanus, in loc., Common place 42, question 45; Calvin, Commentary on Eph. 4, Apostolis proximi erant Evangelistae, et munus affine habebant. Bullinger, ibid., In plebe potissimum e […]udienda; Zanchi, Commentary on the same, Apostolorum Comites—non immediate mi […]—sed assumebantur. Dr. Robert Boyd from Trocherig, Commentary on Eph. 4, p. 493, Apostolorum Comites modo huc, modo illuc missi, modo re vocati ab Apostolis, extraordinarii.</p></blockquote>

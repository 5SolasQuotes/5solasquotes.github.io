<blockquote><p>Once upon a time, a friend of mine got into trouble on a “Reformed” discussion board for arguing that Christians must not fight in unjust wars (in other words, he got into trouble for saying that they should not partake in the sin of murder). According to Henry Bullinger, my friend was correct and his “Reformed” critics were not Reformed on this issue:

Thus hitherto I have shewed you that it is lawful for the magistrate for to make war. Where, by the way, also we gather, that the subjects do lawfully, without any offence to God, take armour to battle, when they take it in hand at the magistrate’s bidding. But if the magistrate’s purpose be to kill the guiltless, I declared in my former sermons that then his people ought not to obey his wicked commandments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 373.</span></figcaption>

<blockquote><p>[The first time was when the ceremonial law was obliging under the Mosaic system.] The second time was from the ascension of Christ, till about the time of the destruction of the Temple and city: in which ceremonies ceased to bind conscience and remained indifferent. Hereupon Paul circumcised Timothy: the apostles after Christs ascension, as occasion was offered were present in the temple, Acts 3:1; And the council of Jerusalem tendering the weakness of some believers, decreed that the Church for a time should abstain from strangled [animals] and blood. And there was good reason of this, because the Church of the Jews was not yet sufficiently convicted that an end was put to the ceremonial law by the death of Christ. In the third time, which was after the publishing of the Gospel, ceremonies of the Jews Church became unlawful, and so shall continue to the world’s end.</p></blockquote>

</figure><figure class="quote" id="q-f2bd2c70c7" data-kw="">
<blockquote><p>In what continual danger are we everywhere of running into extremes! While some, blinded and hardened by sin, never bestow one serious thought about their souls, — insensible of the malady within, they despise the physician and disregard the means of recovery, — there are others who think or at least talk of nothing else but of their disorder, saying how bad they are.

Fruitless complaints, complaints of themselves and of their condition, is the sum and substance of their religion. If they can conjure up doubts respecting themselves, and form desponding complaints of their uncomfortable condition, they fancy that they have done their duty. I have myself known several who have spent a good part of their time in such spiritual gossiping, — I know not what else to call it, in going up and down from one to another with their melancholy complaints and objections. But such conduct is utterly contrary to the life of faith.

Had they spent half this time in pouring out their complaints before the Lord, or employed it in doing good to others, they would have been long ago fat and well liking, thriving daily in holiness, and comfort, life and joy. I say not but that it is good, in our soul’s concerns and spiritual difficulties, to apply to them who are furnished with the tongue of the learned, and who know how to speak a word in season to the weary: but what I say is, that for persons to fill their minds with their own complaints and objections, without endeavouring to mix with faith and practice what is spoken for their relief, and to go on still in their own slothful and obstinate way, that this is of no sort of use or advantage, but I fear of much real hurt to the soul.

And yet some, I am apt to think, may even please themselves in such a course, as if it had somewhat in it of eminency in religion. But can they think to mend their condition by wishing it were better, or by complaining that it is so bad? If they do, they will most assuredly be disappointed. None of us will think so absurdly about worldly things. In such things we readily take an industrious course. The husbandman well knows, that if he be idle and slothful in seed-time, it will be in vain to form any expectations as to the time of harvest. “The sluggard will not sow by reason of cold;” and what return hath he in harvest? He must “beg in harvest and have nothing.” Prov. xx. 4.

So it is in spiritual things. The hand of the diligent alone maketh rich. Tell me how a man employs his time, whether he is slothful or industrious, and I will tell you what progress he makes in grace; for you may as soon gather grapes of thorns or figs of thistles, as enjoy those fruits of the Spirit, — love, joy, and peace, whilst you live after the flesh, in self-indulgence, ease, and sloth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-charles.html">Thomas Charles</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The means to be used for obtaining peace (1782) in Edward Morgan (ed.), Essays, Letters, and Interesting Papers of the Late Rev. Thomas Charles, A.B. Bala, Merionethshire</cite></span></figcaption>

<blockquote><p>53. The object of ecclesiastical power is not the same with the object of the civil power, but much differing from it; for the ecclesiastical power does determine and appoint nothing concerning men’s bodies, goods, dignities, civil rights, but is employed only about the inward man, or the soul, not that it can search the hearts, or judge of the secrets of the conscience, which is in the Power of God alone: Yet notwithstanding it has for its proper object those externals which are purely spiritual, and do belong properly and most nearly to the spiritual good of the soul; Which also are termed [in Greek] the inward things of the Church.

54. Those things then wherein the ecclesiastical power is exercised, are the Preaching of the Word, the Administration of Sacraments, public Prayer and Thanksgiving, the Catechising and instructing of children and ignorant persons, the examination of those who are to come to the holy Communion, the Ecclesiastical Discipline, the Ordination of Ministers, and the abdication, deposing, and degrading of them (if they become like unsavory salt), the deciding and determining of controversies of Faith and cases of Conscience, Canonical constitutions concerning the treasury of the Church and collections of the faithful, as also concerning ecclesiastical rites, or indifferent things, which pertain to the keeping of decency and order in the Church, according to the general rules of Christian love and prudence contained in the Word of God. … 79. Seeing then there are so many and so great differences of both offices [of the Church and the magistrate], and seeing also that the function of ministers and elders of the Church is not at all contained in the office of the magistrate; neither on the other part, this is comprehended within that; magistrates shall no less sin in usurping ecclesiastical power, ministering holy things, ordaining ministers, or exercising discipline ecclesiastical, than ministers should sin in rushing into the borders of the magistrate, and in thrusting themselves into his calling. 81. So then the Word of God and the Law of Christ which by so evident difference separates and distinguishes ecclesiastical government from the civil, forbids the Christian magistrate to enter upon or usurp the ministry of the Word and sacraments,, or the juridical dispensing of the keys of the Kingdom of Heaven, to invade the Church-Government, or to challenge to himself the right of both swords, spiritual and corporal; But if any magistrate (which God forbid) should dare to arrogate to himself so much, and to enlarge his skirts so far, the Church shall then straightway be constrained to complain justly, and cry out, that though the Pope is changed, yet Popedom remains still.</p></blockquote>

54. Those things then wherein the ecclesiastical power is exercised, are the Preaching of the Word, the Administration of Sacraments, public Prayer and Thanksgiving, the Catechising and instructing of children and ignorant persons, the examination of those who are to come to the holy Communion, the Ecclesiastical Discipline, the Ordination of Ministers, and the abdication, deposing, and degrading of them (if they become like unsavory salt), the deciding and determining of controversies of Faith and cases of Conscience, Canonical constitutions concerning the treasury of the Church and collections of the faithful, as also concerning ecclesiastical rites, or indifferent things, which pertain to the keeping of decency and order in the Church, according to the general rules of Christian love and prudence contained in the Word of God. … 79. Seeing then there are so many and so great differences of both offices [of the Church and the magistrate], and seeing also that the function of ministers and elders of the Church is not at all contained in the office of the magistrate; neither on the other part, this is comprehended within that; magistrates shall no less sin in usurping ecclesiastical power, ministering holy things, ordaining ministers, or exercising discipline ecclesiastical, than ministers should sin in rushing into the borders of the magistrate, and in thrusting themselves into his calling. 81. So then the Word of God and the Law of Christ which by so evident difference separates and distinguishes ecclesiastical government from the civil, forbids the Christian magistrate to enter upon or usurp the ministry of the Word and sacraments,, or the juridical dispensing of the keys of the Kingdom of Heaven, to invade the Church-Government, or to challenge to himself the right of both swords, spiritual and corporal; But if any magistrate (which God forbid) should dare to arrogate to himself so much, and to enlarge his skirts so far, the Church shall then straightway be constrained to complain justly, and cry out, that though the Pope is changed, yet Popedom remains still.”

<main class="wrap"><figure class="quote" id="q-08bf918eb7" data-kw="">
<blockquote><p>…for here [at the Jerusalem Council] that not only the doctrinal power was to be used, but beside that: 1. the schism was to be removed, and the authority of the synod to be used against the willfulness and obstinacy of those obtruders of circumcision, in rebuking them as perverters of souls. 2. For the scandal which might have been taken if the Gentiles should have eaten blood and things strangled, and meats offered to idols, and therefore the apostles and elders behoved, as a convened synod to forbid a grievous scandal and a spiritual homicide against the Law of nature, to wit, that the gentiles for fear of scandalizing weak. believers amongst the Jews, should abstain from the practice of some things at this time merely indifferent in their nature, though not indifferent in their use, such as were to eat things offered to idols, things strangled and blood:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, pp. 390-91</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-24dd033885" data-kw="">
<blockquote><p>Obiection II. There was blood and things strangled forbidden in the council at Jerusalem after Christ’s ascension, Acts 15. Answer. It was forbidden only in regard of offence and for a time, so long as the weak Jew remained weak, not in regard of conscience. And therefore afterward Paul says that all things, even blood itself was lawful, though not expedient, in regard of scandal (1 Cor. 6:12). And to the pure all things are pure (Titus 1:15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Treatise of the Cases of Conscience (1606)</cite>, p. 541</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

— Samuel Rutherford, A Peaceable and Temperate Plea for Paul’s Presbytery in Scotland 1642, p. 262">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6because+the+mutual+consent+betwixt+A.+B.+and+his+wife%2C+being+essentially+marriage%2C+as+the+canon+law%2C+divines%2C+and+sound+casuists+acknowledge%2C+it+makes+A+B.+a+husband%2C+and+also+the+husband+of+such+a+wife%2C+during+their+lifetime%3B%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Peaceable+and+Temperate+Plea+for+Paul%E2%80%99s+Presbytery+in+Scotland+1642%2C+p.+262&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffaa6347b05.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/faa6347b05.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/family/marriage/#:~:text=because%20the%20mutual%20consent%20betwixt%20A,such%20a%20wife%2C%20during%20their%20lifetime&amp;text=because%20the%20mutual%20consent%20betwixt%20A.%20B.%20and&amp;text=husband%20of%20such%20a%20wife%2C%20during%20their%20lifetime" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2476d15112" data-kw="">
<blockquote><p>You will learn from our brother, master Butler, by what circumstances I am hindered and with whom I have to contend within these two days on the subject of divorce. In the commentaries¹ which I lately wrote on the decalogue, I allowed both to the man and his wife an equal liberty of divorce on account of adultery, if they are disposed to use that liberty which Christ has permitted in the gospel of his Church, where the marriage contract is dissolved by adultery. ¹ See a Declaration of the ten holy Commandments of Almighty God, in Hooper’s early writings, Parker Society edition. The passage here referred to will be found in pp. 378, 379, where Hooper complains of the uncharitable construction put upon it. My opponents allow the husband to divorce his wife by reason of adultery, and to marry another; but they do not allow the same liberty to the wife. In your next letter, as you love me, either confirm my opinion, or correct my error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-hooper.html">John Hooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Original Letters relative to the English Reformation, ed. Hastings Robinson for the Parker Society (Cambridge Univ. Press, 1846), vol. 1, Letter 32, Hooper to Bullinger</cite>, p. 64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

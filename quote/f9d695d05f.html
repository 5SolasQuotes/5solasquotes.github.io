<blockquote><p>VII. However, although he was free from the slavery of sin (because created just and upright) still he was not free from mutability (because whatever his holiness and righteousness, he was mutable, from which in consequence he could fall). Adam was placed in such a state in which he could stand and fall, sin and not sin. Although this argues less perfection than the state of grace (which is immutable), still it denotes no fault or imperfection (since immutability is by no means a gift of nature, but of grace). Still that mutability cannot belong to the liberty of Adam (although sometimes it is so termed) because that condition did not fear to be adorned with so illustrious a description which placed a limit to both the liberty and happiness of man; rather it was only an appendage of the Adamic liberty, so proper to it that it neither has been nor can be in any other man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.1.7 (p. 571).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability.html">Free Will and Inability</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b08de97c2c" data-kw="">
<blockquote><p>In Christ’s conception there were two miracles: one that a woman conceived God, and another that a virgin begot a child. As to the first, then, the Blessed Virgin was involved in the conception only according to an obediential potency, and yet one much more remote than was the man’s rib as that from which the woman was formed. Now, in such matters the act and the potency toward the act are given together, as far as this may be said to be possible. But as to the second miracle, the Virgin did have a passive potency, although a natural one, which could be brought into act by a natural agent. Whence, as to the first he [Lombard] says, ‘a power receptive of the Word of God’; but as to the second he says, ‘but at the same time a power to beget the Word of God’. For the power of the Holy Spirit brings both potencies into act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, distinction 3, quest. 2, art. 1, Whether the Virgin actively contributed anything toward Christ’s conception, Reply to obj. 1, bk. 3,</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-8609c1b4f4" data-kw="">
<blockquote><p>The inability of sinful man is not… to be reckoned among those things which are absolutely impossible (adynata)… nor simplynatural (as that is natural from which we are called neither good nor bad; while this inability is certainly vicious and culpable); or as natural is contradistinguished from voluntary (as in a stone or brute there is a natural inability to speak). Our inability is in the highest degree voluntary; or as that is called natural which arises from a defect of natural faculty or power (such as the inability to see in the blind, to walk in the paralytic, to rise in the dead). Our inability does not exclude, but always supposes in man a natural power to understand and will… For although the phrase can in some measure be tolerated when understood of the natural power of willing (never taken away from us in whatever state we may be; as that by which we are distinguished from the brutes), still it cannot be admitted when we speak of the moral disposition of the will to good; not only to willing, but to willing well. Concerning this alone we dispute with our opponents…</p></blockquote>

<blockquote><p>(2) To evince to you the greatness and horridness of that sin [of not delighting in God]. Suffer yourselves therefore to be reasoned with to this purpose; and consider, first, that you have somewhat of delectation in your natures, that is, you have the power naturally inherent in you of taking delight in one thing or other… Therefore herein an act is not enjoined you which is incompetent to your natures, or simply impossible to you… …Yea, when you look into your disaffected hearts and find that you not only do not delight in God, but you cannot, and not for the want of the natural power, but a right inclination, should you not with astonishment bethink yourselves, every one for himself, ‘What is this that has befallen me? I am convinced this is the best good, every way most worthy of my highest delight and love, and yet my heart savors it not!&#x27;</p></blockquote>

<blockquote><p>…divine providence is occupied not only with respect to necessary things, which have a natural connection with their own causes (Jer. 33:20, 25), but also, first, with respect to contingent things, which have an uncertain, fortuitous, and casual connection: either with the existence and nature of God, in which sense all things except God exist contingently, inasmuch as in themselves they are able not to exist; or with their own proximate causes operating accidentally and contingently; or with man’s free choice. That contingent things of this sort are subject to divine governance is taught throughout Scripture (Ex. 21:12–13; Deut. 19:5; Prov. 21:31; Ps. 127:1–2; 46:8–10; Dan. 11:21), even to the smallest things, such as the falling of a hair (Matt. 10:30), the operations of locusts and lice (Ex. 8:17; 10:12; Joel 1:4; Acts 12:23). In these things, accordingly, their own natural contingency does not perish, because they are certainly and infallibly directed, and come to pass, by the first cause. This appears specifically in the lot (Prov. 16:33), by which God decides cases through merely contingent events (Judges 6:37; Josh. 7:14), and likewise in his deciding the end of human life (Ex. 21:12–13; Isa. 38:5).

5. With free actions XVII. It is also occupied, second, with respect to free things that result from choice or counsel. For that these are subject to divine determination (and that certainly physical, not only moral), is evident both by the Scriptures (Prov. 16:1; 19:21; 21:1; Gen. 43:14; Ex. 11:1–3; 4:11; Phil. 2:12), and by reasons, because otherwise free choice would be independent, at least with respect to the act of determining itself. Yet notwithstanding, that these things remain free, is likewise, according to Scripture (1 Peter 5:2; Heb. 10:26) and experience, an indubitable fact. Moreover, by what reckoning the liberty of our choice is consistent with divine predestination is not so difficult to understand (as many think), if we consider that the divine influence and its predetermination does not hinder man from acting from counsel and rational complacency, or from determining himself while remaining otherwise undetermined and indeterminable by any created cause. I will add that if God, by determining the will and therefore producing a volition, deprived the will of liberty, then also the will, by determining itself and procuring its own volition, would deprive itself of liberty, which is contradictory; conversely, if the will, by determining itself, does not destroy its own liberty, then neither does God by doing the same. Wherefore the providence of God, in determining our choice, in no way either takes away or injures the liberty of choice.

6. With moral operations XVIII. It is occupied, namely, third, with respect to moral actions, both good and evil, which, just as from this determination of divine providence they are not any less free, likewise they are not any less ours: for although God is their efficient cause insofar as they are existing things (Acts 17:25, 28), nevertheless man remains their formal cause. God certainly produces faith in man, yet it is not God who believes, but man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3 | section 16, pp. 318-19, bk. 3; ch. 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“…divine providence is occupied not only with respect to necessary things, which have a natural connection with their own causes (Jer. 33:20, 25), but also, first, with respect to contingent things, which have an uncertain, fortuitous, and casual connection: either with the existence and nature of God, in which sense all things except God exist contingently, inasmuch as in themselves they are able not to exist; or with their own proximate causes operating accidentally and contingently; or with man’s free choice. That contingent things of this sort are subject to divine governance is taught throughout Scripture (Ex. 21:12–13; Deut. 19:5; Prov. 21:31; Ps. 127:1–2; 46:8–10; Dan. 11:21), even to the smallest things, such as the falling of a hair (Matt. 10:30), the operations of locusts and lice (Ex. 8:17; 10:12; Joel 1:4; Acts 12:23). In these things, accordingly, their own natural contingency does not perish, because they are certainly and infallibly directed, and come to pass, by the first cause. This appears specifically in the lot (Prov. 16:33), by which God decides cases through merely contingent events (Judges 6:37; Josh. 7:14), and likewise in his deciding the end of human life (Ex. 21:12–13; Isa. 38:5).

5. With free actions XVII. It is also occupied, second, with respect to free things that result from choice or counsel. For that these are subject to divine determination (and that certainly physical, not only moral), is evident both by the Scriptures (Prov. 16:1; 19:21; 21:1; Gen. 43:14; Ex. 11:1–3; 4:11; Phil. 2:12), and by reasons, because otherwise free choice would be independent, at least with respect to the act of determining itself. Yet notwithstanding, that these things remain free, is likewise, according to Scripture (1 Peter 5:2; Heb. 10:26) and experience, an indubitable fact. Moreover, by what reckoning the liberty of our choice is consistent with divine predestination is not so difficult to understand (as many think), if we consider that the divine influence and its predetermination does not hinder man from acting from counsel and rational complacency, or from determining himself while remaining otherwise undetermined and indeterminable by any created cause. I will add that if God, by determining the will and therefore producing a volition, deprived the will of liberty, then also the will, by determining itself and procuring its own volition, would deprive itself of liberty, which is contradictory; conversely, if the will, by determining itself, does not destroy its own liberty, then neither does God by doing the same. Wherefore the providence of God, in determining our choice, in no way either takes away or injures the liberty of choice.

6. With moral operations XVIII. It is occupied, namely, third, with respect to moral actions, both good and evil, which, just as from this determination of divine providence they are not any less free, likewise they are not any less ours: for although God is their efficient cause insofar as they are existing things (Acts 17:25, 28), nevertheless man remains their formal cause. God certainly produces faith in man, yet it is not God who believes, but man.”

— Petrus van Mastricht, Theoretical Practical Theology, (RHB), vol. 3 | section 16, pp. 318-19, bk. 3; ch. 10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6divine+providence+is+occupied+not+only+with+respect+to+necessary+things%2C+which+have+a+natural+connection+with+their+own+causes+%28Jer.+33%3A20%2C+25%29%2C+but+also%2C+first%2C+with+respect+to+contingent+things%2C+which+have+an+uncertain%2C+fortuitous%2C+and+casual+connection%3A+either+with+the+existence+and+nature+of+God%2C+in+which+sense+all+things+except+God+exist+contingently%2C+inasmuch+as+in+themselves+they+are+able+not+to+exist%3B+or+with+their+own+proximate+causes+operating+accidentally+and+contingently%3B+or+with+man%E2%80%99s+free+choice.+That+contingent+things+of+this+sort+are+subject+to+divine+governance+is+taught+throughout+Scripture+%28Ex.+21%3A12%E2%80%9313%3B+Deut.+19%3A5%3B+Prov.+21%3A31%3B+Ps.+127%3A1%E2%80%932%3B+46%3A8%E2%80%9310%3B+Dan.+11%3A21%29%2C+even+to+the+smallest+things%2C+such+as+the+falling+of+a+hair+%28Matt.+10%3A30%29%2C+the+operations+of+locusts+and+lice+%28Ex.+8%3A17%3B+10%3A12%3B+Joel+1%3A4%3B+Acts+12%3A23%29.+In+these+things%2C+accordingly%2C+their+own+natural+contingency+does+not+perish%2C+because+they+are+certainly+and+infallibly+directed%2C+and+come+to+pass%2C+by+the+first+cause.+This+appears+specifically+in+the+lot+%28Prov.+16%3A33%29%2C+by+which+God+decides+cases+through+merely+contingent+events+%28Judges+6%3A37%3B+Josh.+7%3A14%29%2C+and+likewise+in+his+deciding+the+end+of+human+life+%28Ex.+21%3A12%E2%80%9313%3B+Isa.+38%3A5%29.+5.+With+free+actions+XVII.+It+is+also+occupied%2C+second%2C+with+respect+to+free+things+that+result+from+choice+or+counsel.+For+that+these+are+subject+to+divine+determination+%28and+that+certainly+physical%2C+not+only+moral%29%2C+is+evident+both+by+the+Scriptures+%28Prov.+16%3A1%3B+19%3A21%3B+21%3A1%3B+Gen.+43%3A14%3B+Ex.+11%3A1%E2%80%933%3B+4%3A11%3B+Phil.+2%3A12%29%2C+and+by+reasons%2C+because+otherwise+free+choice+would+be+independent%2C+at+least+with+respect+to+the+act+of+determining+itself.+Yet+notwithstanding%2C+that+these+things+remain+free%2C+is+likewise%2C+according+to+Scripture+%281+Peter+5%3A2%3B+Heb.+10%3A26%29+and+experience%2C+an+indubitable+fact.+Moreover%2C+by+what+reckoning+the+liberty+of+our+choice+is+consistent+with+divine+predestination+is+not+so+difficult+to+understand+%28as+many+think%29%2C+if+we+consider+that+the+divine+influence+and+its+predetermination+does+not+hinder+man+from+acting+from+counsel+and+rational+complacency%2C+or+from+determining+himself+while+remaining+otherwise+undetermined+and+indeterminable+by+any+created+cause.+I+will+add+that+if+God%2C+by+determining+the+will+and+therefore+producing+a+volition%2C+deprived+the+will+of+liberty%2C+then+also+the+will%2C+by+determining+itself+and+procuring+its+own+volition%2C+would+deprive+itself+of+liberty%2C+which+is+contradictory%3B+conversely%2C+if+the+will%2C+by+determining+itself%2C+does+not+destroy+its+own+liberty%2C+then+neither+does+God+by+doing+the+same.+Wherefore+the+providence+of+God%2C+in+determining+our+choice%2C+in+no+way+either+takes+away+or+injures+the+liberty+of+choice.+6.+With+moral+operations+XVIII.+It+is+occupied%2C+namely%2C+third%2C+with+respect+to+moral+actions%2C+both+good+and+evil%2C+which%2C+just+as+from+this+determination+of+divine+providence+they+are+not+any+less+free%2C+likewise+they+are+not+any+less+ours%3A+for+although+God+is+their+efficient+cause+insofar+as+they+are+existing+things+%28Acts+17%3A25%2C+28%29%2C+nevertheless+man+remains+their+formal+cause.+God+certainly+produces+faith+in+man%2C+yet+it+is+not+God+who+believes%2C+but+man.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical+Practical+Theology%2C+%28RHB%29%2C+vol.+3+%7C+section+16%2C+pp.+318-19%2C+bk.+3%3B+ch.+10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F05797ee800.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/05797ee800.html">Perma

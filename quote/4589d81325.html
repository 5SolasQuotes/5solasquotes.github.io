<blockquote><p>5. [Henning] Arnisaeus [d. 1636, a German, Lutheran political writer] desires that kings may use sparingly the plenitude of their power for public good; there must be, says he, necessity to make it lawful to use the plenitude of their power justly; therefore Ahab sinned, in that he unjustly possessed Naboth’s vineyard… but this plenitude of power may be justly put forth in act, says he, if the public good may be regarded.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex… (1644)</cite>, p. 197</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

<blockquote><p>XXV. As every escape, error, or act of unfaithfulness (even known and continued in) whether in a minister’s entry to the ministry, or in his doctrine or deportment, does not non-minister him, nor give sufficient ground to withdraw from, or reject him as a minister of Christ: So neither does every enormity, mis-demeanure or act of tyranny, injustice, perfidy or profanity etc. in the civil magistrate, whether as to his way of entry to that office or in the execution of it, or in his private and personal behavior, denominate him a tyrant or an usurper, or give sufficient ground to divest him of his magistratical power, and reject him as the lawful magistrate.</p></blockquote>

</figure><figure class="quote" id="q-4698f1b8ef" data-kw="">
<blockquote><p>And because the king being made a king leaves not off to be a reasonable creature, he must be under a law, and so his will and lust cannot be the rule of his power and dominion, but law and reason must regulate him. Now if God had given to the king a dominion over men as reasonable creatures, his power and dominion which by royalists is conceived to be above law, should be a rule to men as reasonable men, which would make men under kings no better than brute beasts, for then should subjects exercise acts of reason, not because good and honest, but because their prince commands them so to do; and if this cannot be said, none can be at the disposing of kings in politic acts liable to royal government, that way that the slave is in his actions under the dominion of his master.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 65 rt col</span></figcaption>

</figure><figure class="quote" id="q-ecee29aff3" data-kw="">
<blockquote><p>It will be necessary, however, to return to the west country [of Scotland], where the invasion of the Highland host [in 1679] was succeeded by oppressions which at length exasperated the country people to resistance. Among these we may notice the imposition of the cess, as it was termed, a tax raised expressly for maintaining the army intended to put down field-conventicles. A more odious tax can hardly be conceived. That they should not only be severely fined and punished for attending these meetings, but compelled to pay for the means of suppressing them, was such an outrage on the feelings of the people, that we might be prepared to hear it would be almost universally resisted. Yet the greater part submitted to the tax, contenting themselves with a protest against its use; thus declaring their readiness to suffer for religion if they should be called to account, and at the same time avoiding even the appearance of evil by refusing the magistrate’s just right to levy cess and custom on the subjects. This, however, proved another “bone of contention;” the stricter and more rigid of the Presbyterians considering that by paying the cess they shared in the guilt of the purpose to which it was avowedly applied. The ministers who were banished to Holland loudly inveighed against the practice; and it was no doubt very easy for them, placed at a distance from the scene of oppression, as it may be for us who are free from all such exactions, to protest against those who yielded to them. But much may be said in behalf of those who submitted against their will to an imposition which they could not resist, and which, had they resisted, would have been wrested from them with the loss of all they possessed. On the other hand, the principles upon which some of the Presbyterians afterwards resisted the impost, and which are vindicated at great length in the Hind let Loose [by the Cameronian Alexander Shields], were founded on the tyrannical character of the governors, and necessarily led to the casting off all allegiance or submission to the civil government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie.html">Thomas M’Crie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Story of the Scottish Church: from the Reformation to the Disruption (London: Blackie &amp; Son, 1875)</cite>, p. 326</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><figure class="quote" id="q-81609f3c8d" data-kw="">
<blockquote><p>Controversy – Is God able not only to deprive an innocent creature of life but also to condemn them to the eternal tortures of hell? We deny against certain Scholastics. Arguments 1. All the ways of God should be mercy and truth to those who keep covenant (Ps. 25:10). 2. Anyone approaching God should believe that He will reward their obedience with a reward not condemn them (Heb. 11:6). 3. In an innocent creature there can be no consciousness of guilt or the just judgment of God, which is the meaning of punishment. 4. No glory to God could arise from this but rather the dishonor of a tyrannical lord. 5. The righteousness of God demands that He acquit the holy, but it does not permit him to condemn someone who has not merited it (Ps. 18:26-27, Gen. 18:25, Ps. 7:11). Objections 1. He can reduce the innocent to nothing. Reply. Then he only takes away what He gave, but punishment would be to do injury to someone while existing. 2. He acts this way with Christ. Reply. He was our surety, who took our debts on Himself. 3. God can impute to us the sin of Adam. Reply. That is imputed to be ours which is truly ours just as the children of slaves are slaves and the sons of citizens are citizens and are reputed to be such. 4. We are permitted to kill innocent creatures. Reply. 1. Not rational ones. 2. Irrational ones (bruta) for our use (2 Pet. 2:12). 3. It is one thing to kill, another to give to the living the highest punishment according to one’s pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 11, ‘Christ’</cite>, pp. 84-85, 112-13, 121-22</span></figcaption>

— Leonard Riissen, A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 11, ‘Christ’, pp. 84-85, 112-13, 121-22">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CControversy+%E2%80%93+Is+God+able+not+only+to+deprive+an+innocent+creature+of+life+but+also+to+condemn+them+to+the+eternal+tortures+of+hell%3F+We+deny+against+certain+Scholastics.+Arguments+1.+All+the+ways+of+God+should+be+mercy+and+truth+to+those+who+keep+covenant+%28Ps.+25%3A10%29.+2.+Anyone+approaching+God+should+believe+that+He+will+reward+their+obedience+with+a+reward+not+condemn+them+%28Heb.+11%3A6%29.+3.+In+an+innocent+creature+there+can+be+no+consciousness+of+guilt+or+the+just+judgment+of+God%2C+which+is+the+meaning+of+punishment.+4.+No+glory+to+God+could+arise+from+this+but+rather+the+dishonor+of+a+tyrannical+lord.+5.+The+righteousness+of+God+demands+that+He+acquit+the+holy%2C+but+it+does+not+permit+him+to+condemn+someone+who+has+not+merited+it+%28Ps.+18%3A26-27%2C+Gen.+18%3A25%2C+Ps.+7%3A11%29.+Objections+1.+He+can+reduce+the+innocent+to+nothing.+Reply.+Then+he+only+takes+away+what+He+gave%2C+but+punishment+would+be+to+do+injury+to+someone+while+existing.+2.+He+acts+this+way+with+Christ.+Reply.+He+was+our+surety%2C+who+took+our+debts+on+Himself.+3.+God+can+impute+to+us+the+sin+of+Adam.+Reply.+That+is+imputed+to+be+ours+which+is+truly+ours+just+as+the+children+of+slaves+are+slaves+and+the+sons+of+citizens+are+citizens+and+are+reputed+to+be+such.+4.+We+are+permitted+to+kill+innocent+creatures.+Reply.+1.+Not+rational+ones.+2.+Irrational+ones+%28bruta%29+for+our+use+%282+Pet.+2%3A12%29.+3.+It+is+one+thing+to+kill%2C+another+to+give+to+the+living+the+highest+punishment+according+to+one%E2%80%99s+pleasure.%E2%80%9D%0A%0A%E2%80%94+Leonard+Riissen%2C+A+Complete+Summary+of+Elenctic+Theology+%26+of+as+Much+Didactic+Theology+as+is+Necessary+trans.+J.+Wesley+White+MTh+thesis+%28Bern

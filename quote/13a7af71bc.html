<blockquote><p>Providence is a word which, in its proper signification, may seem to comprehend all the actions of God that outwardly are of him, that have any respect unto his creatures, all his works that are not ad intra, essentially belonging unto the Deity.

Now, because God “worketh all things according to his decree, or the counsel of his will,” Eph. i. 11, for whatsoever he doth now it pleased him from the beginning, Ps. cxv. 3; seeing, also, that known unto God are all his works from eternity; therefore, three things concerning his providence are considerable:—

1. His decree or purpose, whereby he hath disposed of all things in order, and appointed them for certain ends, which he hath fore-ordained. 2. His prescience, whereby he certainly fore-knoweth all things that shall come to pass. 3. His temporal operation, or working in time, — “My Father worketh hitherto,” John v. 17, — whereby he actually executeth all his good pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ΘΕΟΜΑΧΙΑ ΑΥΤΕΞΟΥΣΙΑΣΤΙΚΗ</cite>, or, A display of Arminianism: being a discovery of the old Pelagian idol free-will, with the new goddess contingency (1643) in William H. Goold (ed.), The Works of John Owen (16 vols, Edinburgh: Banner of Truth, 1967), 10: 31.</span></figcaption>

</figure><figure class="quote" id="q-3fdc58a3ef" data-kw="">
<blockquote><p>XXIII. There is in man a twofold judgment, to wit, an antecedent, which is that of the affections and senses; and a consequent, which is that of reason: so there is a twofold volition: the one follows the judgment of sense, and it is rather an imperfect desire than a perfect volition; the other follows the judgment of reason: both these volitions were in Christ more eminently than in us, because in Him were two wills, and these, by reason of his two natures, were distinct in Him, though his person was but one; therefore He desired the cup might pass from Him, but willed it not; or, He willed it by his antecedent, not by his consequent will. O Thou that madest in Thyself the judgement of affection stoop to the judgment of reason and madest thy desire subservient to thy will, and causedst thy antecedent will to give place to thy consequent: produce in me the same effect, that these sinful delights which my affections so earnestly run after, and thy gentle corrections, which they so earnestly run from, may be so ordered that the one by me may be courageously subdued, the other patiently endured, that my affections may submit to my will, my will to reason and reason to thy Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Century of Divine Meditations upon Predestination</cite>, … (London: Young, 1646), pp. 15-16, 19, 21-23, 89-92 Ross (c. 1590–1654) was a Scottish minister and chaplain-in-ordinary to King Charles I. He was not the Aberdeen doctor of the same name.</span></figcaption>

</figure><figure class="quote" id="q-dce0b3aa99" data-kw="">
<blockquote><p>The Doctrine of the Jesuits, who albeit they teach the concurrence of the first cause, to be necessary unto each operation of the second cause: yet so, as it doth not determine, but is determined by the second cause: thus Bellarmine. So as not fore-going, only accompanying of the second cause: thus Vasquez. So as it co-operates with the second cause, not after the manner of a principle, but after the manner of an action: thus Suarez.

It determineth the second cause (say they) negatively, not by way of influence: which mystical sense of the Jesuits. Hurtado (himself also a Jesuit) opens by a familiar comparison, thus: As (saith he) in case you can write with two pens, and I holding one of them, hinder you writing with it, permitting you to write with the other: this permission compelleth not you to write, you are free to both: but if you write, it must be with that pen which I leave, not with that which I hold in my hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The orthodox evangelist. Or A treatise wherein many great evangelical truths (not a few whereof are much opposed and eclipsed in this perilous hour of the passion of the Gospel) are briefly discussed, cleared, and confirmed: as a further help, for the begetting, and establishing of the faith which i</cite>, (London: Henry Cripps and Lodowick Lloyd, 1654), p. 125.</span></figcaption>

</figure><figure class="quote" id="q-cc7e6c2842" data-kw="">
<blockquote><p>Whatever is in God is essential to Him and to that end the very nature and essence of God. Therefore, God’s righteousness is God’s very essence, whereby He wills and does all things justly according to His law. For in the moral law, God expressed to us His righteousness and nature. Holiness in God embraces the highest of all God’s virtues—wisdom, righteousness, power, mercy, goodness, et cetera. This is what elsewhere is called goodness, as in Psalm 143:10, “Your good Spirit leads me through an upright journey,” and the light of God (1 John 1:5). And this is about these in God, in the ideal Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, trans. Casey B. Carmichael, Classic Reformed Theology, vol. 5 (1593; Kindle edn, Grand Rapids MI: Reformation Heritage Books, 2021), Kindle Locations 3364-3368.</span></figcaption>

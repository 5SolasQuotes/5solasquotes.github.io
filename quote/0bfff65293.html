<blockquote><p>In preface to taking up some of [John Brown of] Wamphray’s arguments, he in general mistakenly infers, as did most opposed to the [Scottish, civil] indulgence (and those of a similar mindset today), that if there are deficiencies or evils in the indulgence (or any such enactment), then it is sinful to accept those deficiencies and evils. However, ‘evil’ is an ambiguous term and may stand for miserable or moral evils. One may morally choose to undergo and suffer certain miserable (though not moral) evils in necessity, other alternatives not being available, likely, reasonable or best. Choosing to eat expired food rather than starve is not wrong, though starving would be. That one must have the best or none at all, is against the greater good; miserable evils often contain a significant degree of good, and we ought not to choose the worst.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 139</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-51c3b75087" data-kw="">
<blockquote><p>§25… We must distinguish: 1. between a lawful impose or contracter, and a violent usurper or robber that injuriously compels us to swear. 2. Between the obvious usual sense of the words and an unusual forced sense. 3. Between a sincere, involuntary misunderstanding the imposer, and a voluntary fraudulent reservation or private sense. 4. Between one that I owe something to antecedently, and one that I owe nothing to but by the mere self-obligation of my vow. 5. Between an imposer that is himself the culpable cause of my misunderstanding him, and one that is not the cause, but my own weakness or negligence is the cause. 6. Between a case where both senses may be kept, and a case where they cannot, being inconsistent. … Proposition 6. If the imposer be a robber or usurper, or one that I owe nothing to in justice, but what I oblige myself to by my oath, I am not then bound at all to keep my oath in his sense, if my own sense was according to the common use of the words. Proposition 7. Though I may not lie to a robber or tyrant that unjustly imposes promises or oaths upon me, yet if he put an oath or promise on me which is good and lawful in the proper usual sense of the words, though bad in his sense (which is contrary to the plain words), whether I may take this to save my liberty or life, I leave to the consideration of the judicious: that which may be said against it is, that oaths must not be used indirectly and dissemblingly. That which may be said for it is: 1. That I have no obligation to fit my words to his personal private sense. 2. That I deceive him not, but only permit him to deceive himself, as long as it is he and not I that misuses the words. 3. That I am to have chief respect to the public sense: and it is not his sense, but mine that is the public sense. 4. That the saving of a man’s life or liberty is cause enough for the taking [of] a lawful oath. [Baxter elsewhere says this: “Lawyer: But as you have said that those great men, [Hugo] Grotius and Bishop Jeremy Taylor were for profitable lying, so you know that worthy Latitudinarian doctor who was wont to say that if false knaves would turn him out of his ministry and living by ensnaring impositions, he would take the words in the best sense he could subdue them to, whatever the authors meant; and it was as lawful for him to defend himself against knaves with his tongue, as with his hands and sword. … §32. Rule 18. Though an oath imposed by an usurper or by violence is not to be taken in formal obedience, nor at all, unless the greatness of the benefit require it, yet being taken it is nevertheless obligatory (supposing nothing else do make it void). Man is a free agent and cannot be forced though he may be frightened: If he swear to a thief for the saving of his life, he voluntarily does choose the inconveniences of the oath as a means to save his life. Therefore being a voluntary act it is obligatory. Else there should be no obligation on us to suffer for Christ, but anything might be sworn or done to escape suffering: See of this Dr. Sanderson largely, Lectures 4, sect. 14-16. The imposition and the oath are different things. In the imposition, a thief or tyrant is the party commanding, and I am the party commanded: And his having no authority to command me, does nullify only his command and makes me not obliged to obey him, nor to take it in any obedience to him: But yet if I do take it without any authority obliging me (as private oaths are taken), it is still an oath or vow, in which the parties are God and man: Man vowing and making himself a debtor to God: And God has authority to require me to keep my vows, when men have no authority to require me to make them. All men confess that private Vows bind: And the nullity of the imposer’s authority makes them but private vows. This case is easy and commonly agreed on.</p></blockquote>

<blockquote><p>And if the greater part be in error and so stiff that they would sooner persecute the better than reform, if it be not in matters fundamental or bordering thereupon, or noxious and pernicious to be concealed, I know not that either that innocent is allowed to separate from the exercises of religion for that cause, or bound to admonish them of their error. He that taught to suffer the tares rather than to pluck up the wheat with them, has showed a reason for this judgment (Mt. 13:29).</p></blockquote>

</figure><figure class="quote" id="q-c4e8300ca3" data-kw="">
<blockquote><p>Absolute censorship of the Nazi data does not seem proper, especially when the secrets of saving lives may lie solely in its contents… When the value of the Nazi data is of great value to humanity, then the morally appropriate policy would be to utilize the data, while explicitly condemning the atrocities… To further justify its use, the scientific validity of the experiment must be clear; there must be no other alternative source from which to gain that information, and the capacity to save lives must be evident. …it must not be included as ordinary scientific research, just to be cited and placed in a medical journal… citation of the data must contain a thorough expose’ of exactly what tortures and atrocities were committed for that experiment… [and it] must be accompanied with the author’s condemnation of the data… as medical evil, never to be repeated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/baruch-c-cohen.html">Baruch C. Cohen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Nazi Medical Experimentation: The Ethics Of Using Medical Data From Nazi Experiments’</cite>, (n.d.) 115 paragraphs | It is clear that good can be, and has been brought out of the Nazis’ preserved data (which can’t be obtained in any other way), but should it? The main cost involved in doing so, besides the sheer revoltingness of it all, is the very scandal of the knowledge of these things becoming known. The article concludes:</span></figcaption>

p;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc4e8300ca3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c4e8300ca3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cooperation-with-evil/#:~:text=Absolute%20censorship%20of%20the%20Nazi%20data,medical%20evil%2C%20never%20to%20be%20repeated&amp;text=Absolute%20censorship%20of%20the%20Nazi%20data%20does%20not&amp;text=as%20medical%20evil%2C%20never%20to%20be%20repeated" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>My arguments against the derivation of magistracy from Jesus Christ as Mediator, and against the magistrate’s holding of his office of and under Christ as Mediator, are these: First, this doctrine does evacuate and nullify the civil authority and government of all heathen or pagan magistrates; for which way was the authority of government derived from Christ, and from Him as Mediator, to a pagan magistrate or emperor? If he has not his power from Christ, as Mediator, then He is but a usurper, and has no just title to reign, according to their principles, who hold that all government, even civil, is given to Christ, and to Him as Mediator. Mr. Hussey, forsooth, does learnedly yield the argument, and answers, p. 20, that not only it is a sin to be a heathen, but the government of a heathen is sinful and unlawful; for which he gives this reason, ‘Whatsoever is not of faith is sin.’ He might as well conclude, in that sense, that the best virtues of the heathen were sin, because not of faith; that is, accidentally sin, in respect of the end, or manner of doing, not materially, or in their own nature. Upon the same reason he must conclude, that the government of a heathen magistrate per se [in of itself], simpliciter [essentially], et ex natura sua [out of its nature], unlawful and sinful? Whether has he any just right or title to government and magistracy? If his title to civil magistracy be just, and if his government be in itself materially and substantially lawful, then he must have a commission from Christ, and from him as Mediator. This I suppose cannot be Mr. Hussey’s sense, for he has not answered one syllable to the argument, tending that way. But if the government of a heathen magistrate be in itself materially, substantially, and in the nature of the tenure, sinful and unlawful, so that, as long as he remains a heathen, he has no real right or true title to government, but only a pretended and usurped title (which must needs be Mr. Hussey’s sense, if he has answered anything at all to my argument), then he goes cross not only to the holy men of God in the Old Testament, who honored heathen princes, and were subject to them as to lawful magistrates, but also to the doctrine of Jesus Christ, who taught his disciples to give unto Caesar what is Caesar’s; and of the apostles, who in their time, exhorted the churches to be subject even to the heathen magistrates (for they had no other at that time), to obey them, to pray for them, Rom. 13; Titus 3:1; 1 Tim. 2:1-2; 1 Pet. 2:13-17. It is justly condemned as one of the errors of the Anabaptists, that a heathen magistrate is not to be acknowledged as a lawful magistrate, or as being from God. See Gerhard, Loc. Com., tom. 6, p. 498-9; P. Hinkelmannus, de Anabaptismo, disp. 13, cap. 1 The Scriptures now cited are so clear, that when Mr. Hussey says of the heathen magistrate, ‘Let Baal plead for himself,’ he might as well have said, that Christ and his apostles pleaded for Baal. They that plead for the authority of a heathen magistrate do not plead for Baal, but for God, and for his ordinance; ‘For the powers that be are ordained of God,’ says Paul, speaking even of the heathen magistrates, Rom. 13:1. But what will Mr. Hussey say, if his great master Erastus be found a pleader for Baal as much as I am? Confirm. Thes., lib. 3, cap. 2, p. 184, speaking of the heathen and unbelieving magistrates, before whom the Corinthians went to law one against another, he says, [contains Latin], Is not the ungodly magistrate also preferred by God, that he may defend any of his subjects from injury and violence. Yea, the Scriptures afore touched are so clear in this point, that Gamachaeus, in Primam Secundae, quest. 4-5, cap. 33, though he hold that by human and ecclesiastical right, pagan princes lose their dominion and authority over their subjects when their subjects turn Christians, yet he acknowledges that they still retain their former jurisdiction over those subjects by the law of God and nature. Surely one might as well say, that heathen parents are unlawful, and heathen husbands are unlawful (all which were contrary to the Word of God), as to say that heathen magistrates are unlawful. Take the instance in parents; for all lawful magistrates are fathers by the fifth commandment: Does the paternity of a heathen father differre specie [differ in kind] from the paternity of a Christian father? are they not both lawful parents, being made such by God and nature? are not their children bound to honor them, and be subject to them, and obey them in things lawful? The paternity is the same in se [in principle], but different modaliter [in way], that I may borrow a distinction from Mr. Hussey. The Christian father is sanctified, and qualified to do service to Jesus Christ, as a father, in educating his children Christianly, which a heathen father cannot do. The heathen magistrate and the Christian magistrate are both lawful magistrates, being made such by God and nature, or by election of people. They are both of them to be honored, submitted unto, and obeyed; they are both of them the ministers of God for the good to their people; their power is the same in actu signato [the intent of power], though not in actu exercito [in how the power is actually exercised in specific acts]. The heathen magistrate may do, and ought to do, what the Christian magistrate does; but the Christian magistrate is fitted, qualified, enabled, and sanctified to glorify and serve Jesus Christ as a magistrate, which the heathen magistrate is not.</p></blockquote>

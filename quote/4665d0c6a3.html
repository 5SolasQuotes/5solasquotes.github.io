<blockquote><p>¶ A confession of sins with faith and repentance.

O Merciful and heavenly Father, wee thy servants do humbly prostrate our selves before thy Majesty, acknowledging here in thy sight our heinous offences committed against thy Majesty, seeing &amp; beholding thy heavy wrath against them: we feel our selves laden (O Lord our God) with a huge company of horrible sins, whereof even the very least, being but conceived in thought, is sufficient in judgement to throw us down to the everlasting burning lake. Our own consciences, O Lord, do bear witness against us, of our manifold transgressions of thy blessed law, of our security &amp; senseless blindness running headlong to destruction, committing sin after sin, although not notorious to the world, yet horrible before thine eye.

The thoughts of our hearts rise up in judgment against us: the vanity of our talk before thy majesty condemneth us: the wickedness of our deeds from thy sight rejecteth us: all our wicked thoughts, words and deeds, with the inward corruption of our nature, do altogether as it were a whole lump and load of sin, lie heavy upon us, and with their intolerable weight do even press us down to hell. We do daily groan under the burthen of them, inwardly lamenting our own folly so greedily running into them.

In Heaven, earth, or hell, we see none able to sustain the weight of them, but even thy dearly beloved Son Jesus Christ, who in mercy infinite, and compassion endless, hath sustained and overcome that endless punishment due unto them: in him therefore, in him, most merciful Father, and through him we come to thee, being fully assured according to thy promise, that thou wilt accept and take that full recompense which he thy dear son hath made for us, as a just ransom for all the sins of all those whose with a true faith take hold on him. In him therefore we see thine anger towards us appeased, thy wrath satisfied, &amp; our debts paid.

Increase in us, good Lorde, wee beseech thee, this lively and feeling faith, for we feel it often times in us very weak, and troubled with many doubts: increase it in us (O Lord) that we may through thy holy spirit bee assured, that the punishment of our sins is fully in thy son discharged. Make us, O Lorde our God, to feel this same in our souls and consciences, that Jesus Christ is ours, and all that he hath done: that we are grafted into his body, &amp; made one with him, and therefore fellow heirs with him of everlasting life.

Let us not only have these words in our mouths (good Lord) but through thy holy Spirit let us feel the comfort of them in our hearts fully sealed and settled in us: that we feeling our selves inwardly before thy judgement seat discharged, and our consciences towards thee appeased, may be swallowed up with an unfained love toward thy Heavenly Majesty, and towards our brethren for thy sake. Make sin to die in us daily more and more, that we may hate, detest, and utterly abhor all sin and wickedness in all men, but especially in our selves: that we may strongly through thy holy Spirit set our selves in open war and defiance against all sin and wickedness: that we please not our selves in our sins, but straightly examining sin by the just rule of thy holy Laws, we may utterly from the bottom of our hearts condemn even the least sin in our selves, having our whole joy, comfort and consolation upon those things which be agreeable to thy blessed will, always being afraid to do any thing contrary to the same:

[T]hat we may even from the bottom of our hearts, examine and try our thoughts, before thy presence, that they be upright and unfained, not hypocritical in outward shew only and appearance, but that even all corners of our hearts being opened and disclosed before thee, we may even as though it were openly before the face of the whole world bring them in shew, knowing that a double heart is detestable in thine eyes: and that we may walk always as before thine eyes, not only before the eyes of man, being more careful to walk circumspectly, in this respect, that wee have thee to be a viewer of our doings, a thousand fold more then the eyes of man: that thus we may walk as becometh thy children, not only in outward shew, but also in sincerity of heart, abhorring even the least sin in our selves, striving, resisting and fighting against sin, not delighting our selves in sin, nor nourishing the same in our breast, but earnestly embracing, and studiously seeking after those things which be pleasant in thine eyes:

[T]hat neither the fear of man, nor loss of goods, life, lands possessions, or friends draw us away from thee, to do any least thing contrary to thy will and pleasure: neither the favour or friendship of man, nor yet the flattering enticements of this world, nor the vain promotions of the same do move us any whit from the true and endless joy, delight and pleasure which we ought to have in those things which be agreeable to thy will, and the constant performance of the same: but that always to the end of our life we may continue in thy paths, growing and increasing from faith to faith, from strength to strength, till at length we shall come to thy everlasting rest. Amen.</p></blockquote>

<blockquote><p>This monkish and hermetic life is first of all contrary to the nature of man when the same was uncorrupt, for whom it was not judged good to be alone, but contrariwise thought convenient that he should have one of the same nature to keep him company, not only in marriage for creations’ sake, but for other helpful and comfortable society. Now therefore that he is fallen from that sufficiency whereby he was passingly more able to live by himself than now he is, it is evident to uphold himself in any commendable estate agreeing with his creation, it is needful that he lean upon the company of his like. Wherefore Solomon says: ‘Two are better than one, for that they have a good reward of their labor: For if the one fall the other may raise up his fellow: but woe to him that is alone, for if he fall, there is no second to lift him up. Likewise if two sleep together, they get warmth, but how should one alone come to any thread that is not soon broken.’ (Eccl. 4:9, etc.) The philosophers, which saw as far as the natural eye was able to pierce, esteemed a man naturally companionable, and him that naturally without constraint of banishment and such like severed himself from the society of men, they deemed either to be a god or else esteemed to be a wild beast; they would have said a devil if they had as much knowledge of him as of God. Secondly, as this solitary life is an enemy to mankind, so is it to the communion of saints in the Church of God: for if they have any singular gifts that take their flight into the wilderness, the sentence of our savior Christ pulls their wings: That no man lights a candle to put it under a bushel, but rather sets it in the candlestick of some society, where it may give light to all that are round about (Mt. 5:15): whether also is referred that such personages are called the salt of others, which has need to approach and be applied to that flesh which it must season and deliver from putrefaction. And if he be void of such gifts, or have not in any great measure, then also is it meet that he should join himself to their company, by whom he may have supply of his wants, that by daily conversation with the wise he may learn wisdom? And if neither any man should have need of him, nor he need of any, yet the desire of being in the congregation of God’s people, to see the beauty of the house of God, in the participation of the Word and sacraments would call him, would so inflame him as to cause him to speed himself as fast from the forsaken wilderness to the place of the assembly of God’s people, as the hart pursued of the dogs, makes footmanship to the soil. (Prov. 13:20, Ps. 42 &amp; 43). For David, being many years a hermit according to your description, that is, one that lived in erema, or wilderness, did notwithstanding the Lord’s calling into that place, feel the horror of the wilderness, through desire he had to go with the rest of the people unto the house of God (Ps. 84). If therefore it be a pleasant paradise unto you which was unto him a horrible and desolate waste: if you voluntarily fly from that which he did so thirstily pursue, and if you greedily seek thither from whence he so desirously departed, it is easy for all men to see that your hermits and monks are of another spirit than David was. But the example of the primitive church conducted by the hands of the apostles is very pregnant against these wild asses whose habitations are in the wilderness: for Luke bears witness that as many as believed were together in one place (Acts 2:44), and that they communicated not only in spiritual things, but nourished love by society in their bodily repasts [meals]. Whereupon it may be easily perceived that as amongst birds they are the uncleanest and most hateful that covet the desolate places, so amongst men they are most to be detested that forsake the mutual society of their brethren. Against this, and for foundation of hermits and monks, is alleged: First, that John was in the wilderness. Whereunto our men answering that it was no such wilderness but that there were towns in it, are charged with shameless perverting of the place. Howbeit take that away which you have falsely surmised of us, that we expound a wilderness which is full of towns, and the shame of your ignorance will return upon yourselves. For if you had not been inured or unready in the Word, you should have known out of the prophet, who wills the wilderness with their cities to lift up their voice. Those places which in comparison of others [are] more peopled are called wildernesses, are not so naked of their inhabitants, but that they may have diverse towns and villages planted in them. Hereupon the self-same quarter of the wilderness of Jordan where John was, there was the town of Bethabara builded upon the bank of the river. Here therefore it is manifest that the entrance into his ministry was not in such a wilderness as the Jesuits imagine, but in a plain inhabited of men. The reason whereof is that, as the first captivity and stroke of God’s judgment began about those parts of Jordan, so to them also first should be offered the saving health, which was able to comfort them over all their desolations. There are two other places, and but two (as far as I remember) famous by John’s ministry, and those are:

1. The waters of Salem.

2. The waters of Enon, which are so called of the two towns Salem and Enon, set upon the brink of those waters. So that John’s whole ministry, so far as may appear, was executed in habitable places, where the cause assigned by the Holy Ghost why John haunted those places is to be observed, namely: for the abundance of waters that were there fit for his ministry in the holy sacrament of baptism, whereby it is evident that John came not to those places for that they were not so much peopled as others, but rather for seeking the commodity of water. Now therefore, if it be enough to make a hermit or a monk to remain in such a wilderness as John did, I can direct you to fitter fathers and founders of your kind of hermits. You have therefore Nabal the churl which dwelt in the wilderness of Maon; you have also the Ziphims, which dwelt in the wilderness of Zyph, that would have betrayed David into the hands of Saul: these are more like birds of your feather. Or if these you like not, you have the heathen men which are called Iaponici, who live after the same sort that your monks do, and in like laws. Now for the closing up of John’s ministry, it appears to have been in the court of Herod, whether a man would think that it should be hard for you to prove that he repaired to the end that he might live in a wilderness. And if it were granted you which you would have, yet considering that whatsoever was done here was to fulfill the prophecy of Isaiah, and by calling of the Lord, it can give no warrant unto you which undertake this of your own head, without commandment or instruction out of the Word. The same reason is there of his authority in diet and apparel, which is frankly confessed on our part to have been after a base and homely sort: howbeit such it was notwithstanding as the country (for abundance of camels and plenty of locusts and wild honey which was there) did afford. For this special diet and apparel, whereby Saint John, declining from a more liberal entertainment, which has priestly estate did yield him, conformed himself to the baser and poorer sort of people, was not a fancy of his own, but that wherein he had the light of the Word to go before him:

1. First, that he might more lively represent the ministry of Elijah, whereunto he was diversely like, especially in the restoring of the true worship of God.

2. Secondly, by commandment which being expressed in his drink, was wisely both of John, and of his parents, by proportion and convenience, translated unto his meat and clothing: considering that it would have been as an old piece in a new garment, if his drink being by God’s prescription thin and common, his meat and apparel should have been exquisite and picked. Further, seeing that John’s ministry has no succession, neither in respect of his calling which was immediately from God, nor of his office, which was to prepare the way for the former coming of our savior Christ, it is manifest that the office being at an end, the things that were annexed unto it cannot continue. After this, Chrysostom is brought for the confirmation of these orders, wherein occasion is given to note how their orders of hermits and monks crept first into the church. In time of persecution, good men were glad to make the wilderness, as it were, the cities of their refuge from the face of tyrants that pursued them. This the apostle to the Hebrews does plainly set forth, where diverse amongst sufferings for the truth, he adds that some wandered in the wilderness, in mountains, and hid themselves in dens and holes of the earth, clad in badgers’ and goats’ skins (Heb. 11:38), in which number it is apparent that Elijah, upon whom you would also father this profession, is contained. He adds that therefore they were in the wilderness, because the world (that dwelt in cities and villages) were not worthy of them. If therefore you now forsake the people by example of these hermits, it is evident that you condemn your popish towns and cities as profane and utterly unworthy of your company. And that which the epistle to the Hebrews witnesses of diverse times of the Law, the same do the ecclesiastical writers of diverse alike times under the Gospel, as appears by the example of Paulus of Thebes, supposed most commonly to be the prince of the monks and hermits, which took the wilderness only as a remedy in persecution raised against him. Further, the apostle in the said epistle, and St. John witnesses of the whole estate of the church, that it should be in this respect a hermit, wherefore the cause of this hermetic life, being through peace of the church taken away, the kind of life ought to have gone withal. But as the churches, by an unadvised imitation drew the interrogatories ministered in the primitive church, to those which were of years to profess their faith in baptism, unto young children: even so with like unadvisedness, the state of the hermits, which properly agreed unto the persecuting times, was translated unto the peaceable times of the church. It was no marvel therefore, although Chrysostom and others did fall sometimes into the commendation of the monkish and hermetic life. But their hermits and monks are so unlike the pope’s creatures, that it is a marvel that they would fetch meat at the father’s hands to nourish this cattle with, of whom they could not well be ignorant but that they should receive more stripes than their meat is worth.

1. For first, they were not within any degree of church ministry, whereby they were, by so much the freer to live unto themselves.

2. Secondly, they were not as caged as yours as, but it was left free unto them, whether they would repair to the company of other monks or not.

3. Thirdly, they were bound to wash the guests’ feet.

4. Fourthly, there was permitted unto them care of wives, of family, and private possession, so that the same were moderate and not against the care of the soul: contrary to your laws, which thrust upon them the vow of wilful poverty.

5. Fifthly, their diet throughout was very sparing, whereas your monks feed so fat, that their fatness and great bellies are grown into a proverb.

6. Sixthly, the ancient monks got their living with the labor of their hands, whereof also they were bound to give an account unto their father; yours are idle bellies, which live off the labors of others only.

7. Seventhly, they were not too notorious by singular weed, or kind of apparel, least men passing by should stand gazing upon them, or point them out with the finger? Yours are. Hither also is to be referred that they had no rasure [shaving] command, only it was provided that they should have their hair long, as women have, where yours are crown shaven. Likewise, in the virgins at that time, it was sharply reproved if they did cut off their hair, whereas you commend it highly, as a virtue in your nuns that they clip their hair.

8. Eighthly, many of the monks in the elder times remaining monks, retained their wives, which to you is an abomination, who thrust upon them the vow of continual continency. Last of all, these were obedient unto their bishop or pastor, as well as other of the body of the church: yours are exempted from his obedience. So that in vowing obedience of your own invention, you disavow the obedience which the Lord has commanded unto you. Now touching your testimonies, Chrysostom has not that John [the Baptist] was Prince of the Hermits, as you would untruly insinuate: but of the monks, without mention of the hermits. Which also, if they have no manner of ground out of the Evangelist, have we not cause to be offended with Chrysostom? And we would think the Jesuits themselves should not be altogether pleased with him; saying that they like well that the truth be always spoken against, so that it be by a friend of the truth, under whom they may cover their deadly hate against it. Otherwise how will they digest that he says, The soul of the monks is without grief or passion and their bodies be as Adam’s before the fall. Jerome, speaking of anchorites and monks, reckons up the opinions of others, how some esteem Elijah the author of them: other some John Baptist; which opinions Jerome does apparently nip in the head, affirming Elijah more than a monk, and John a prophet from his birth: and therefore none that made choice of any special vocation. But that the most part, one Paulus of Thebes, the prince of that sect: where it is to be observed that this monkish and hermetic birth is so obscure that the father of it is unknown. Secondly, the nearest guess that can be had of the parentage of it, leaves it altogether in the filth of man’s invention. Last of all, that all our monks and hermits and bastard and degenerate children from their father Paulus of Thebes, the likelist prince of their profession, whom Jerome affirms to have taken the wilderness, not of his voluntary will, but persecuted even of his nearest friends. Touching Isidorus, if all speak truth that are learned: he (for his time wherein he lived) should be worthy of credit. He flourished about Pope Gregory’s days the great, when this kind of cattle was not dainty. And therefore if the stream of common error carried him to the liking and praising of such a seat, there is no learning nor wisdom in the world (without a special grace from God) which was able to resist such a forcible drift. Howbeit Isidorus was not so wedded to the monks as the Jesuits, who of six kinds of monks rejects three as very bad: where there is not with the Jesuits no order of monks which are not sacred; who, wheresoever they do but find the name of a monk, by and by they think that it is ground good enough to plant monkery upon. In Bernard, your purveyor has deceived you, for we find no such treatise as you give the title of. In a sermon of John’s nativity, he greatly commends him: but with no mark either of monk or hermit. Neither has he any other thing that makes for your purpose.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“This monkish and hermetic life is first of all contrary to the nature of man when the same was uncorrupt, for whom it was not judged good to be alone, but contrariwise thought convenient that he should have one of the same nature to keep him company, not only in marriage for creations’ sake, but for other helpful and comfortable society. Now therefore that he is fallen from that sufficiency whereby he was passingly more able to live by himself than now he is, it is evident to uphold himself in any commendable estate agreeing with his creation, it is needful that he lean upon the company of his like. Wherefore Solomon says: ‘Two are better than one, for that they have a good reward of their labor: For if the one fall the other may raise up his fellow: but woe to him that is alone, for if he fall, there is no second to lift him up. Likewise if two sleep together, they get warmth, but how should one alone come to any thread that is not soon broken.’ (Eccl. 4:9, etc.) The philosophers, which saw as far as the natural eye was able to pierce, esteemed a man naturally companionable, and him that naturally without constraint of banishment and such like severed himself from the society of men, they deemed either to be a god or else esteemed to be a wild beast; they would have said a devil if they had as much knowledge of him as of God. Secondly, as this solitary life is an enemy to mankind, so is it to the communion of saints in the Church of God: for if they have any singular gifts that take their flight into the wilderness, the sentence of our savior Christ pulls their wings: That no man lights a candle to put it under a bushel, but rather sets it in the candlestick of some society, where it may give light to all that are round about (Mt. 5:15): whether also is referred that such personages are called the salt of others, which has need to approach and be applied to that flesh which it must season and deliver from putrefaction. And if he be void of such gifts, or have not in any great measure, then also is it meet that he should join himself to their company, by whom he may have supply of his wants, that by daily conversation with the wise he may learn wisdom? And if neither any man should have need of him, nor he need of any, yet the desire of being in the congregation of God’s people, to see the beauty of the house of God, in the participation of the Word and sacraments would call him, would so inflame him as to cause him to speed himself as fast from the forsaken wilderness to the place of the assembly of God’s people, as the hart pursued of the dogs, makes footmanship to the soil. (Prov. 13:20, Ps. 42 &amp; 43). For David, being many years a hermit according to your description, that is, one that lived in erema, or wilderness, did notwithstanding the Lord’s calling into that place, feel the horror of the wilderness, through desire he had to go with the rest of the people unto the house of God (Ps. 84). If therefore it be a pleasant paradise unto you which was unto him a horrible and desolate waste: if you voluntarily fly from that which he did so thirstily pursue, and if you greedily seek thither from whence he so desirously departed, it is easy for all men to see that your hermits and monks are of another spirit than David was. But the example of the primitive church conducted by the hands of the apostles is very pregnant against these wild asses whose habitations are in the wilderness: for Luke bears witness that as many as believed were together in one place (Acts 2:44), and that they communicated not only in spiritual things, but nourished love by society in their bodily repasts [meals]. Whereupon it may be easily perceived that as amongst birds they are the uncleanest and most hateful that covet the desolate places, so amongst men they are most to be detested that forsake the mutual society of their brethren. Against this, and for foundation of hermits and monks, is alleged: First, that John was in the wilderness. Whereunto our men answering that it was no such wilderness but that there were towns in it, are charged with shameless perverting of the place. Howbeit take that away which you have falsely surmised of us, that we expound a wilderness which is full of towns, and the shame of your ignorance will return upon yourselves. For if you had not been inured or unready in the Word, you should have known out of the prophet, who wills the wilderness with their cities to lift up their voice. Those places which in comparison of others [are] more peopled are called wildernesses, are not so naked of their inhabitants, but that they may have diverse towns and villages planted in them. Hereupon the self-same quarter of the wilderness of Jordan where John was, there was the town of Bethabara builded upon the bank of the river. Here therefore it is manifest that the entrance into his ministry was not in such a wilderness as the Jesuits imagine, but in a plain inhabited of men. The reason whereof is that, as the first captivity and stroke of God’s judgment began about those parts of Jordan, so to them also first should be offered the saving health, which was able to comfort them over all their desolations. There are two other places, and but two (as far as I remember) famous by John’s ministry, and those are:

1. The waters of Salem.

2. The waters of Enon, which are so called of the two towns Salem and Enon, set upon the brink of those waters. So that John’s whole ministry, so far as may appear, was executed in habitable places, where the cause assigned by the Holy Ghost why John haunted those places is to be observed, namely: for the abundance of waters that were there fit for his ministry in the holy sacrament of baptism, whereby it is evident that John came not to those places for that they were not so much peopled as others, but rather for seeking the commodity of water. Now therefore, if it be enough to make a hermit or a monk to remain in such a wilderness as John did, I can direct you to fitter fathers and founders of your kind of hermits. You have therefore Nabal the churl which dwelt in the wilderness of Maon; you have also the Ziphims, which dwelt in the wilderness of Zyph, that would have betrayed David into the hands of Saul: these are more like birds of your feather. Or if these you like not, you have the heathen men which are called Iaponici, who live after the same sort that your monks do, and in like laws. Now for the closing up of John’s ministry, it appears to have been in the court of Herod, whether a man would think that it should be hard for you to prove that he repaired to the end that he might live in a wilderness. And if it were granted you which you would have, yet considering that whatsoever was done here was to fulfill the prophecy of Isaiah, and by calling of the Lord, it can give no warrant unto you which undertake this of your own head, without commandment or instruction out of the Word. The same reason is there of his authority in diet and apparel, which is frankly confessed on our part to have been after a base and homely sort: howbeit such it was notwithstanding as the country (for abundance of camels and plenty of locusts and wild honey which was there) did afford. For this special diet and apparel, whereby Saint John, declining from a more liberal entertainment, which has priestly estate did yield him, conformed himself to the baser and poorer sort of people, was not a fancy of his own, but that wherein he had the light of the Word to go before him:

4. Fourthly, there was permitted unto them care of wives, of family, and private possession, so that the same were moderate and not against the care of the soul: contrary to your laws, which thrust upon them the vow of wilful poverty.

+of+some+society%2C+where+it+may+give+light+to+all+that+are+round+about+%28Mt.+5%3A15%29%3A+whether+also+is+referred+that+such+personages+are+called+the+salt+of+others%2C+which+has+need+to+approach+and+be+applied+to+that+flesh+which+it+must+season+and+deliver+from+putrefaction.+And+if+he+be+void+of+such+gifts%2C+or+have+not+in+any+great+measure%2C+then+also+is+it+meet+that+he+should+join+himself+to+their+company%2C+by+whom+he+may+have+supply+of+his+wants%2C+that+by+daily+conversation+with+the+wise+he+may+learn+wisdom%3F+And+if+neither+any+man+should+have+need+of+him%2C+nor+he+need+of+any%2C+yet+the+desire+of+being+in+the+congregation+of+God%E2%80%99s+people%2C+to+see+the+beauty+of+the+house+of+God%2C+in+the+participation+of+the+Word+and+sacraments+would+call+him%2C+would+so+inflame+him+as+to+cause+him+to+speed+himself+as+fast+from+the+forsaken+wilderness+to+the+place+of+the+assembly+of+God%E2%80%99s+people%2C+as+the+hart+pursued+of+the+dogs%2C+makes+footmanship+to+the+soil.+%28Prov.+13%3A20%2C+Ps.+42+%26+43%29.+For+David%2C+being+many+years+a+hermit+according+to+your+description%2C+that+is%2C+one+that+lived+in+erema%2C+or+wilderness%2C+did+notwithstanding+the+Lord%E2%80%99s+calling+into+that+place%2C+feel+the+horror+of+the+wilderness%2C+through+desire+he+had+to+go+with+the+rest+of+the+people+unto+the+house+of+God+%28Ps.+84%29.+If+therefore+it+be+a+pleasant+paradise+unto+you+which+was+unto+him+a+horrible+and+desolate+waste%3A+if+you+voluntarily+fly+from+that+which+he+did+so+thirstily+pursue%2C+and+if+you+greedily+seek+thither+from+whence+he+so+desirously+departed%2C+it+is+easy+for+all+men+to+see+that+your+hermits+and+monks+are+of+another+spirit+than+David+was.+But+the+example+of+the+primitive+church+conducted+by+the+hands+of+the+apostles+is+very+pregnant+against+these+wild+asses+whose+habitations+are+in+the+wilderness%3A+for+Luke+bears+witness+that+as+many+as+believed+were+together+in+one+place+%28Acts+2%3A44%29%2C+and+that+they+communicated+not+only+in+spiritual+things%2C+but+nourished+love+by+society+in+their+bodily+repasts+%5Bmeals%5D.+Whereupon+it+may+be+easily+perceived+that+as+amongst+birds+they+are+the+uncleanest+and+most+hateful+that+covet+the+desolate+places%2C+so+amongst+men+they+are+most+to+be+detested+that+forsake+the+mutual+society+of+their+brethren.+Against+this%2C+and+for+foundation+of+hermits+and+monks%2C+is+alleged%3A+First%2C+that+John+was+in+the+wilderness.+Whereunto+our+men+answering+that+it+was+no+such+wilderness+but+that+there+were+towns+in+it%2C+are+charged+with+shameless+perverting+of+the+place.+Howbeit+take+that+away+which+you+have+falsely+surmised+of+us%2C+that+we+expound+a+wilderness+which+is+full+of+towns%2C+and+the+shame+of+your+ignorance+will+return+upon+yourselves.+For+if+you+had+not+been+inured+or+unready+in+the+Word%2C+you+should+have+known+out+of+the+prophet%2C+who+wills+the+wilderness+with+their+cities+to+lift+up+their+voice.+Those+places+which+in+comparison+of+others+%5Bare%5D+more+peopled+are+called+wildernesses%2C+are+not+so+naked+of+their+inhabitants%2C+but+that+they+may+have+diverse+towns+and+villages+planted+in+them.+Hereupon+the+self-same+quarter+of+the+wilderness+of+Jordan+where+John+was%2C+there+was+the+town+of+Bethabara+builded+upon+the+bank+of+the+river.+Here+therefore+it+is+manifest+that+the+entrance+into+his+ministry+was+not+in+such+a+wilderness+as+the+Jesuits+imagine%2C+but+in+a+plain+inhabited+of+men.+The+reason+whereof+is+that%2C+as+the+first+captivity+and+stroke+of+God%E2%80%99s+judgment+began+about+those+parts+of+Jordan%2C+so+to+them+also+first+should+be+offered+the+saving+health%2C+which+was+able+to+comfort+them+over+all+their+desolations.+There+are+two+other+places%2C+and+but+two+%28as+far+as+I+remember%29+famous+by+John%E2%80%99s+ministry%2C+and+those+are%3A+1.+The+waters+of+Salem.+2.+The+waters+of+Enon%2C+which+are+so+called+of+the+two+towns+Salem+and+Enon%2C+set+upon+the+brink+of+those+waters.+So+that+John%E2%80%99s+whole+ministry%2C+so+far+as+may+appear%2C+was+executed+in+habitable+places%2C+where+the+cause+assigned+by+the+Holy+Ghost+why+John+haunted+those+places+is+to+be+observed%2C+namely%3A+for+the+abundance+of+waters+that+were+there+fit+for+his+ministry+in+the+holy+sacrament+of+baptism%2C+whereby+it+is+evident+that+John+came+not+to+those+places+for+that+they+were+not+so+much+peopled+as+others%2C+but+rather+for+seeking+the+commodity+of+water.+Now+therefore%2C+if+it+be+enough+to+make+a+hermit+or+a+monk+to+remain+in+such+a+wilderness+as+John+did%2C+I+can+direct+you+to+fitter+fathers+and+founders+of+your+kind+of+hermits.+You+have+therefore+Nabal+the+churl+which+dwelt+in+the+wilderness+of+Maon%3B+you+have+also+the+Ziphims%2C+which+dwelt+in+the+wilderness+of+Zyph%2C+that+would+have+betrayed+David+into+the+hands+of+Saul%3A+these+are+more+like+birds+of+your+feather.+Or+if+these+you+like+not%2C+you+have+the+heathen+men+which+are+called+Iaponici%2C+who+live+after+the+same+sort+that+your+monks+do%2C+and+in+like+laws.+Now+for+the+closing+up+of+John%E2%80%99s+ministry%2C+it+appears+to+have+been+in+the+court+of+Herod%2C+whether+a+man+would+think+that+it+should+be+hard+for+you+to+prove+that+he+repaired+to+the+end+that+he+might+live+in+a+wilderness.+And+if+it+were+granted+you+which+you+would+have%2C+yet+considering+that+whatsoever+was+done+here+was+to+fulfill+the+prophecy+of+Isaiah%2C+and+by+calling+of+the+Lord%2C+it+can+give+no+warrant+unto+you+which+undertake+this+of+your+own+head%2C+without+commandment+or+instruction+out+of+the+Word.+The+same+reason+is+there+of+his+authority+in+diet+and+apparel%2C+which+is+frankly+confessed+on+our+part+to+have+been+after+a+base+and+homely+sort%3A+howbeit+such+it+was+notwithstanding+as+the+country+%28for+abundance+of+camels+and+plenty+of+locusts+and+wild+honey+which+was+there%29+did+afford.+For+this+special+diet+and+apparel%2C+whereby+Saint+John%2C+declining+from+a+more+liberal+entertainment%2C+which+has+priestly+estate+did+yield+him%2C+conformed+himself+to+the+baser+and+poorer+sort+of+people%2C+was+not+a+fancy+of+his+own%2C+but+that+wherein+he+had+the+light+of+the+Word+to+go+before+him%3A+1.+First%2C+that+he+might+more+lively+represent+the+ministry+of+Elijah%2C+whereunto+he+was+diversely+like%2C+especially+in+the+restoring+of+the+true+worship+of+God.+2.+Secondly%2C+by+commandment+which+being+expressed+in+his+drink%2C+was+wisely+both+of+John%2C+and+of+his+parents%2C+by+proportion+and+convenience%2C+translated+unto+his+meat+and+clothing%3A+considering+that+it+would+have+been+as+an+old+piece+in+a+new+garment%2C+if+his+drink+being+by+God%E2%80%99s+prescription+thin+and+common%2C+his+meat+and+apparel+should+have+been+exquisite+and+picked.+Further%2C+seeing+that+John%E2%80%99s+ministry+has+no+succession%2C+neither+in+respect+of+his+calling+which+was+immediately+from+God%2C+nor+of+his+office%2C+which+was+to+prepare+the+way+for+the+former+coming+of+our+savior+Christ%2C+it+is+manifest+that+the+office+being+at+an+end%2C+the+things+that+were+annexed+unto+it+cannot+continue.+After+this%2C+Chrysostom+is+brought+for+the+confirmation+of+these+orders%2C+wherein+occasion+is+given+to+note+how+their+orders+of+hermits+and+monks+crept+first+into+the+church.+In+time+of+persecution%2C+good+men+were+glad+to+make+the+wilderness%2C+as+it+were%2C+the+cities+of+their+refuge+from+the+face+of+tyrants+that+pursued+them.+This+the+apostle+to+the+Hebrews+does+plainly+set+forth%2C+where+diverse+amongst+sufferings+for+the+truth%2C+he+adds+that+some+wandered+in+the+wilderness%2C+in+mountains%2C+and+hid+themselves+in+dens+and+holes+of+the+earth%2C+clad+in+badgers%E2%80%99+and+goats%E2%80%99+skins+%28Heb.+11%3A38%29%2C+in+which+number+it+is+apparent+that+Elijah%2C+upon+whom+you+would+also+father+this+profession%2C+is+contained.+He+adds+that+therefore+they+were+in+the+wilderness%2C+because+the+world+%28that+dwelt+in+cities+and+villages%29+were+not+worthy+of+them.+If+therefore+you+now+forsake+the+people+by+example+of+these+hermits%2C+it+is+evident+that+you+condemn+your+popish+towns+and+cities+as+profane+and+utterly+unworthy+of+your+company.+And+that+which+the+epistle+to+the+Hebrews+witnesses+of+diverse+times+of+the+Law%2C+the+same+do+the+ecclesiastical+writers+of+diverse+alike+times+under+the+Gospel%2C+as+appears+by+the+example+of+Paulus+of+Thebes%2C+supposed+most+commonly+to+be+the+prince+of+the+monks+and+hermits%2C+which+took+the+wilderness+only+as+a+remedy+in+persecution+raised+against+him.+Further%2C+the+apostle+in+the+said+epistle%2C+and+St.+John+witnesses+of+the+whole+estate+of+the+church%2C+that+it+should+be+in+this+respect+a+hermit%2C+wherefore+the+cause+of+this+hermetic+life%2C+being+through+peace+of+the+church+taken+away%2C+the+kind+of+life+ought+to+have+gone+withal.+But+as+the+churches%2C+by+an+unadvised+imitation+drew+the+interrogatories+ministered+in+the+primitive+church%2C+to+those+which+were+of+years+to+profess+their+faith+in+baptism%2C+unto+young+children%3A+even+so+with+like+unadvisedness%2C+the+state+of+the+hermits%2C+which+properly+agreed+unto+the+persecuting+times%2C+was+translated+unto+the+peaceable+times+of+the+church.+It+was+no+marvel+therefore%2C+although+Chrysostom+and+others+did+fall+sometimes+into+the+commendation+of+the+monkish+and+hermetic+life.+But+their+hermits+and+monks+are+so+unlike+the+pope%E2%80%99s+creatures%2C+that+it+is+a+marvel+that+they+would+fetch+meat+at+the+father%E2%80%99s+hands+to+nourish+this+cattle+with%2C+of+whom+they+could+not+well+be+ignorant+but+that+they+should+receive+more+stripes+than+their+meat+is+worth.+1.+For+first%2C+they+were+not+within+any+degree+of+church+ministry%2C+whereby+they+were%2C+by+so+much+the+freer+to+live+unto+themselves.+2.+Secondly%2C+they+were+not+as+caged+as+yours+as%2C+but+it+was+left+free+unto+them%2C+whether+they+would+repair+to+the+company+of+other+monks+or+not.+3.+Thirdly%2C+they+were+bound+to+wash+the+guests%E2%80%99+feet.+4.+Fourthly%2C+there+was+permitted+unto+them+care+of+wives%2C+of+family%2C+and+private+possession%2C+so+that+the+same+were+moderate+and+not+against+the+care+of+the+soul%3A+contrary+to+your+laws%2C+which+thrust+upon+them+the+vow+of+wilful+poverty.+5.+Fifthly%2C+their+diet+throughout+was+very+sparing%2C+whereas+your+monks+feed+so+fat%2C+that+their+fatness+and+great+bellies+are+grown+into+a+proverb.+6.+Sixthly%2C+the+ancient+monks+got+their+living+with+the+labor+of+their+hands%2C+whereof+also+they+were+bound+to+give+an+account+unto+their+father%3B+yours+are+idle+bellies%2C+which+live+off+the+labors+of+others+only.+7.+Seventhly%2C+they+were+not+too+notorious+by+singular+weed%2C+or+kind+of+apparel%2C+least+men+passing+by+should+stand+gazing+upon+them%2C+or+point+them+out+with+the+finger%3F+Yours+are.+Hither+also+is+to+be+referred+that+they+had+no+rasure+%5Bshaving%5D+command%2C+only+it+was+provided+that+they+should+have+their+hair+long%2C+as+women+have%2C+where+yours+are+crown+shaven.+Likewise%2C+in+the+virgins+at+that+time%2C+it+was+sharply+reproved+if+they+did+cut+off+their+hair%2C+whereas+you+commend+it+highly%2C+as+a+virtue+in+your+nuns+that+they+clip+their+hair.+8.+Eighthly%2C+many+of+the+monks+in+the+elder+times+remaining+monks%2C+retained+their+wives%2C+which+to+you+is+an+abomination%2C+who+thrust+upon+them+the+vow+of+continual+continency.+Last+of+all%2C+these+were+obedient+unto+their+bishop+or+pastor%2C+as+well+as+other+of+the+body+of+the+church%3A+yours+are+exempted+from+his+obedience.+So+that+in+vowing+obedience+of+your+own+invention%2C+you+disavow+the+obedience+which+the+Lord+has+commanded+unto+you.+Now+touching+your+testimonies%2C+Chrysostom+has+not+that+John+%5Bthe+Baptist%5D+was+Prince+of+the+Hermits%2C+as+you+would+untruly+insinuate%3A+but+of+the+monks%2C+without+mention+of+the+hermits.+Which+also%2C+if+they+have+no+manner+of+ground+out+of+the+Evangelist%2C+have+we+not+cause+to+be+offended+with+Chrysostom%3F+And+we+would+think+the+Jesuits+themselves+should+not+be+altogether+pleased+with+him%3B+saying+that+they+like+well+that+the+truth+be+always+spoken+against%2C+so+that+it+be+by+a+friend+of+the+truth%2C+under+whom+they+may+cover+their+deadly+hate+against+it.+Otherwise+how+will+they+digest+that+he+says%2C+The+soul+of+the+monks+is+without+grief+or+passion+and+their+bodies+be+as+Adam%E2%80%99s+before+the+fall.+Jerome%2C+speaking+of+anchorites+and+monks%2C+reckons+up+the+opinions+of+others%2C+how+some+esteem+Elijah+the+author+of+them%3A+other+some+John+Baptist%3B+which+opinions+Jerome+does+apparently+nip+in+the+head%2C+affirming+Elijah+more+than+a+monk%2C+and+John+a+prophet+from+his+birth%3A+and+therefore+none+that+made+choice+of+any+special+vocation.+But+that+the+most+part%2C+one+Paulus+of+Thebes%2C+the+prince+of+that+sect%3A+where+it+is+to+be+observed+that+this+monkish+and+hermetic+birth+is+so+obscure+that+the+father+of+it+is+unknown.+Secondly%2C+the+nearest+guess+that+can+be+had+of+the+parentage+of+it%2C+leaves+it+altogether+in+the+filth+of+man%E2%80%99s+invention.+Last+of+all%2C+that+all+our+monks+and+hermits+and+bastard+and+degenerate+children+from+their+father+Paulus+of+Thebes%2C+the+likelist+prince+of+their+profession%2C+whom+Jerome+affirms+to+have+taken+the+wilderness%2C+not+of+his+voluntary+will%2C+but+persecuted+even+of+his+nearest+friends.+Touching+Isidorus%2C+if+all+speak+truth+that+are+learned%3A+he+%28for+his+time+wherein+he+lived%29+should+be+worthy+of+credit.+He+flourished+about+Pope+Gregory%E2%80%99s+days+the+great%2C+when+this+kind+of+cattle+was+not+dainty.+And+therefore+if+the+stream+of+common+error+carried+him+to+the+liking+and+praising+of+such+a+seat%2C+there+is+no+learning+nor+wisdom+in+the+world+%28without+a+special+grace+from+God%29+which+was+able+to+resist+such+a+forcible+drift.+Howbeit+Isidorus+was+not+so+wedded+to+the+monks+as+the+Jesuits%2C+who+of+six+kinds+of+monks+rejects+three+as+very+bad%3A+where+there+is+not+with+the+Jesuits+no+order+of+monks+which+are+not+sacred%3B+who%2C+wheresoever+they+do+but+find+the+name+of+a+monk%2C+by+and+by+they+think+that+it+is+ground+good+enough+to+plant+monkery+upon.+In+Bernard%2C+your+purveyor+has+deceived+you%2C+for+we+find+no+such+treatise+as+you+give+the+title+of.+In+a+sermon+of+John%E2%80%99s+nativity%2C+he+greatly+commends+him%3A+but+with+no+mark+either+of+monk+or+hermit.+Neither+has+he+any+other+thing+that+makes+for+your+purpose.%E2%80%9D%0A%0A%E2%80%94+Thomas+Cartwright%2C+Confutation+of+the+Rhemists%E2%80%99+Notes%2C+Glosses+%26+Annotations+on+the+New+Testament%2C+%E2%80%A6+%28d.+1603%3B+%5BLeiden%5D+1618%29%2C+on+Mt.+3%3A1%2C+pp.+9-11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0a739707c2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0a739707c2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-monasticism/#:~:text=This%20monkish%20and%20hermetic%20life%20is,thing%20that%20makes%20for%20your%20purpose&amp;text=This%20monkish%20and%20hermetic%20life%20is%20first%20of&amp;text=any%20other%20thing%20that%20makes%20for%20your%20purpose" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-939396c332" data-kw="Infallibility of the church">
<blockquote><p>When they deny that the Church can err, their end and meaning are to this effect: Since the Church is governed by the Spirit of God, she can walk safely without the word; in whatever direction she moves, she cannot think or speak anything but the truth, and hence, if she determines anything without or beside the word of God, it must be regarded in no other light than if it were a divine oracle. If we grant the first point--viz. that the Church cannot err in things necessary to salvation--our meaning is, that she cannot err, because she has altogether discarded her own wisdom, and submits to the teaching of the Holy Spirit through the word of God. Here then is the difference. They place the authority of the Church without the word of God; we annex it to the word, and allow it not to be separated from it.</p></blockquote>

<blockquote><p>When one asked him concerning marriage, whether it were good to marry; seeing sometimes, when concupiscence pricked him, he was moved to it, and some other time when he felt no such thing, he thought he might abstain from it: He answered, many come hastily into that calling, not vying the means of trying their estate thoroughly before; as namely, whether they by prayer, fasting, and avoiding all occasions of concupiscence, have the gift of chastity or no? Many use some of the means, and not all: many use all the means, but a small time: therefore it is good to use first the means, not part of them, but all of them: not for a while, but long. If so be that all these things will not prevail, attend upon the Lord’s ordinance, and wait when the Lord shall give just occasion of using that estate, to his glory and our comfort.</p></blockquote>

</figure><figure class="quote" id="q-84de3e55fc" data-kw="">
<blockquote><p>For this I affirm (and would that I could not, for such just causes, affirm it): that white does not more oppose black than Papism opposes Christianity; which I have now resolved to prove in a few words. Nor do I here dispute about their crimes and most abandoned morals, but I aim at the very throat of the cause, namely their doctrine, than which I affirm that nothing more impure or corrupt can even be feigned.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-7f6dfea4c5" data-kw="">
<blockquote><p>It is not the spirit of man that can, and doth thus work: for first, the spirit of man perceiveth not the things of God, till God’s Spirit acquaint him with them. Secondly, they be foolishness unto him. Thirdly, his wisdom is enmity with God, so as God’s wisdom in divine mysteries, and man’s wisdom can never agree in one. Fourthly, the spirit of man savoreth the things of the flesh, and not of the Spirit of God. Fifthly, his heart is continually evil, till he be regenerate. Sixthly and lastly, it is evidently known by too much miserable experience, that man loveth not the study of the Scriptures, he cannot delight in them, he cannot away to frame his life after them; everyone that hath any spark of divine knowledge, knoweth this to be true from his own natural corruption, both in himself and others also.

Now can any reasonable-minded man think, that such an averse spirit as is in man, so disaffecting the holy Scriptures, and the study thereof, that it can be that Spirit which persuadeth and draweth men, contrary to it corrupt self, to embrace that Religion which is grounded upon the Scriptures, and to press to the obedience thereof? Yea, can it be man’s spirit, that worketh love to such a Religion, which so opposeth man’s corruption, as the worldly wise Politician derideth it, the pleasurable man hateth it, the greedy of gain cannot abide to be ruled by it, and the haughty spirit which hunteth after the pride of life, hath it in great contempt? so as none in very deed, but only such as do deny themselves, do forsake the world, and can be well contented to take up their cross, and follow Christ, either can, or will embrace the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Look beyond Luther: or An answer to that question, so often and so insultingly proposed by our adversaries, asking us; where this our religion was before Luther’s time? Whereto are added sound props to bear up honest-hearted Protestants, that they fall not from their saving-faith</cite>, (London: Felix Kingston, 1623), p. 4.</span></figcaption>

</figure><figure class="quote" id="q-10c5bf7df6" data-kw="">
<blockquote><p>Obs. IV. That our utmost care and diligence in the consideration of the mind of God are required in all that we do about his worship.—There is nothing wherein men for the most part are more careless. Some suppose it belongs unto their own wisdom to order things in the worship of God as it seems most meet unto them;—an apprehension that I shall leave this world in admiration of, that ever it should befall the minds of so many good and honest men as it hath done. But the power of prejudice is inexpressible. Some think they are no further concerned in these things than only to follow the traditions of their fathers. This unto the community of Christians is the only rule of divine worship. To suppose that it is their duty to inquire into the way and manner of the worship of God, the grounds and reasons of what they practise therein, is most remote from them. ‘It was Moses that had the command to take care about the making of the tabernacle, and not the people. There was nothing left unto them but to do and observe what he had appointed.’ And it is true; when God first reveals the way of his worship immediately from himself, as he did first by Moses, and last of all by his Son Jesus Christ, the people have nothing to do therewith, but only to observe and do what is appointed, as our Saviour expressly declares, Matt. 28:20: but when his worship is so revealed and declared, there is not the meanest person, who professeth obedience unto him, who is exempted from this command of taking most diligent care about the due discharge of his duty herein. And this care and diligence are necessary,—</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, ed. W. H. Goold, vol. 23, Works of John Owen (Edinburgh: Johnstone and Hunter, 1854), 42–43.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-1224286efb" data-kw="">
<blockquote><p>Hence arises a manifold difference between the moral law and others [ceremonial and judicial] both in origin (because the moral is founded upon natural right and on this account is known by nature; but the others upon positive right and on this account are from free revelation) and in duration. The former is immutable and eternal; the latter mutable and temporary. In regard to object, the one is universal embracing all; the others particular applying only to the Jews… In regard to use, the moral is the end of the others, while the others are subservient to the moral.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R, 1994), vol. 2, 11th Topic, ‘On the Law of God’, Question 24, ‘What was the end and use of the ceremonial law under the Old Testament?’, section 3, p. 146</span></figcaption>

<blockquote><p>The duties required in the first commandment are, the knowing and acknowledging of God to be the only true God, and our God;[o] and to worship and glorify him accordingly,[p] by thinking,[q] meditating,[r] remembering,[s] highly esteeming,[t] honouring,[v] adoring,[w] choosing,[x] loving,[y] desiring,[z] fearing of him;[a] believing him;[b] trusting,[c] hoping,[d] delighting,[e] rejoicing in him;[f] being zealous for him;[g] calling upon him, giving all praise and thanks,[h] and yielding all obedience and submission to him with the whole man;[i] being careful in all things to please him,[k] and sorrowful when in any thing he is offended;[l] and walking humbly with him.[m] [o] 1 Chron. 28:9. Deut. 26:17. Isa. 43:10. Jer. 14:22. [p] Ps. 95:6,7. Matt. 4:10. Ps. 29:2. [q] Mal. 3:16. [r] Ps. 63:6. [s] Eccl. 12:1. [t] Ps. 71:19. [v] Mal. 1:6. [w] Isa. 45:23. [x] Josh. 24:15,22. [y] Deut. 6:5. [z] Ps. 73:25. [a] Isa. 8:13. [b] Exod. 14:31. [c] Isa. 26:4. [d] Ps. 130:7. [e] Ps. 37:4. [f] Ps. 32:11. [g] Rom. 12:11 compared with Num. 25:11. [h] Phil. 4:6. [i] Jer. 7:23. James 4:7. [k] 1 John 3:22. [l] Jer. 31:18. Ps. 119:136. [m] Micah 6:8.</p></blockquote>

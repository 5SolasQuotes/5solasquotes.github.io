<main class="wrap"><figure class="quote" id="q-f8b91c1809" data-kw="">
<blockquote><p>And although ordinary believers are obliged to make diligent and conscientious use of the ministry of the church, among other things, as a means appointed of God to lead, guide, and instruct them in the knowledge of his mind and will revealed in the Scripture, which is the principal end of that ordinance; yet is not their understanding of the truth, their apprehension of it and faith in it, to rest upon or to be resolved into their authority, who are not appointed of God to be lords of their faith, but helpers of their joy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, ch. 1</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7469950696" data-kw="">
<blockquote><p>Now we determine that the supreme right, authority, and judgment of interpreting the scriptures, is lodged with the Holy Ghost and the scripture itself: for these two are not mutually repugnant. We say that the Holy Spirit is the supreme interpreter of scripture, because we must be illuminated by the Holy Spirit to be certainly persuaded of the true sense of scripture; otherwise, although we use all means, we can never attain to that full assurance which resides in the minds of the faithful. … As to external persuasion, we say that scripture itself is its own interpreter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Controversy 1, Q. 5, ch. 3 (p. 415)</span></figcaption>

</figure><figure class="quote" id="q-28d3ab91db" data-kw="">
<blockquote><p>Seventhly, all our expositions should accord with the analogy of faith, which we read of, Rom. xii. 6. Now the analogy of faith is nothing else but the constant sense of the general tenour of scripture in those clear passages of scripture, where the meaning labours under no obscurity; such as the articles of faith in the Creed, and the contents of the Lord&#x27;s Prayer, the Decalogue, and the whole Catechism: for every part of the Catechism may be confirmed by plain passages of scripture. Whatever exposition is repugnant to this analogy must be false.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Controversy 1, Q. 5, ch. 9 (p. 472)</span></figcaption>

</figure><figure class="quote" id="q-b65e48dc5d" data-kw="">
<blockquote><p>In this matter there is no need of knowing immediately and a priori who has the Spirit, but only who speaks according to the Scriptures. When this becomes known by a reference to the Scriptures, we can readily judge a posteriori who utters the words of the Spirit and speaks from him. Thus the Bereans did not inquire a priori whether Paul who preached to them was moved by the Holy Spirit … but whether Paul spoke according to the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.20.35</span></figcaption>

</figure><figure class="quote" id="q-638e3a3824" data-kw="Interpretation">

<main class="wrap"><figure class="quote" id="q-d6568cc077" data-kw="">
<blockquote><p>How then can these things be gods, seeing that they need one another’s assistance? Or how is it proper to ask anything of them when they too ask help for themselves one from another? For if it is an admitted truth about God that He stands in need of nothing, but is self-sufficient and self-contained, and that in Him all things have their being, and that He ministers to all rather than they to Him, how is it right to proclaim as gods the sun and moon and other parts of creation, which are of no such kind, but which even stand in need of one another’s help?

But, perhaps, if divided and taken by themselves, our opponents themselves will admit that they are dependent, the demonstration being an ocular one. But they will combine all together, as constituting a single body, and will say that the whole is God. For the whole once put together, they will no longer need external help, but the whole will be sufficient for itself and independent in all respects; so at least the would-be philosophers will tell us, only to be refuted here once more.

Now this argument, not one whit less than those previously dealt with, will demonstrate their impiety coupled with great ignorance. For if the combination of the parts makes up the whole, and the whole is combined out of the parts, then the whole consists of the parts, and each of them is a portion of the whole. But this is very far removed from the conception of God. For God is a whole and not a number of parts, and does not consist of diverse elements, but is Himself the Maker of the system of the universe. For see what impiety they utter against the Deity when they say this. For if He consists of parts, certainly it will follow that He is unlike Himself, and made up of unlike parts. For if He is sun, He is not moon, and if He is moon, He is not earth, and if He is earth, He cannot be sea: and so on, taking the parts one by one, one may discover the absurdity of this theory of theirs.

But the following point, drawn from the observation of our human body, is enough to refute them. For just as the eye is not the sense of hearing, nor is the latter a hand: nor is the belly the breast, nor again is the neck a foot, but each of these has its own function, and a single body is composed of these distinct parts,—having its parts combined for use, but destined to be divided in course of time when nature, that brought them together, shall divide them at the will of God, Who so ordered it;—thus (but may He that is above pardon the argument), if they combine the parts of creation into one body and proclaim it God, it follows, firstly, that He is unlike Himself, as shewn above; secondly, that He is destined to be divided again, in accordance with the natural tendency of the parts to separation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/athanasius-of-alexandria.html">Athanasius of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against the Heathen</cite>, (c. 335), 28.1-4 in Nicene and Post-Nicene Fathers 2, 4: 18-19.</span></figcaption>

<blockquote><p>…we conceive therefore these to be permitted.

1. All duties of piety, as was sacrificing under the Old Testament, or preaching, hearing or going about the sacraments under the New Testament: In which sense, Mt. 12, our Lord says the priests profaned the Sabbath and were blameless, not that formally they prophaned the Sabbath, or did indeed break that command, but materially they wrought in killing beasts, etc. which had been unlawful, had it not been in the exercises of piety.

2. All things that have a tendency, as necessary helps and means to the performance of the former works of piety, are lawful, as going to the congregation to hear the Law, calling the assembly for worship by trumpets, or bells, or by a voice, journeying, going or riding to Church, etc. because the duties of the Sabbath cannot well be done without some of these, nor at all without others of them. If it should be asked here, what that, which is called a Sabbaths day journey, Acts 1:12, was among the Jews? and whence it came, and what way may it be stinted or limited among Christians? Answer: It was to them 2000 cubits… It arose to be reckoned so from these grounds:

1. From their expounding Ex. 16:29, ‘Let none go out of his place;’ thus, Let none go without the bounds of the city, which with its suburbs was 2000 cubits, or a mile about.

2. That the Tabernacle of the congregation was so far from the tents of these who pitched about it in the wilderness, Num. 2, as they supposed; and that the priests kept that distance from the people in entering with the ark into Jordan, Josh. 3:4, whence they gathered that a man might still go to the ark or place of worship, as it was then in these cases at a distance from them, and no further on the Sabbath day. But we say whatever superstitiously or on custom they took up (for that is but their tradition) we cannot stint a Sabbath day’s journey to so many miles, fewer or more, but it must be as the man is in providence cast to reside further from, or nearer to the place where the ordinances are dispensed; for one may go many miles and not profane the Sabbath, if he cannot have the public ordinances nearer, whereas another may break the Sabbath by going but to his neighbor’s door, yea by walking in his own house, or to his door, if either it be done idly, or with respect to another civil or worldly end, which agrees not to that day; it is not here remoteness or nearness, but what sways us, and what is our end, that we are to try by.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition of the Ten Commandments</cite>, … (d. 1658; London: 1675), 4th Commandment, Sanctification of the Sabbath, p. 277</span></figcaption>

<blockquote><p>So much of the Parts of God’s Worship prescribed, together with the right use and abuse thereof. What say you of such Forms of Worship as are not prescribed by God in his Word?

We are commanded to serve God, not according to the Traditions of Men, but according to his Will revealed in the Scripture, Col. 2. 18, Mat. 15. 9.

What followeth hereupon?

That no Power must be admitted in the Church to prescribe other Forms of Worship, not appointed by God himself in his Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity: or, The Sum and Substance of Christian Religion</cite>, ed. Michael Nevarr (1648; Herndon VA: Solid Ground Christian Books, 2007), p. 204.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

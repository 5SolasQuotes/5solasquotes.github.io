<main class="wrap"><figure class="quote" id="q-df04ad4eee" data-kw="">
<blockquote><p>God, to whom belongs the world and the fulness thereof, disponed to Abraham and his seed the land of Canaan for their inheritance and ordained that they should use their bow and their sword for the actual possession thereof; and the like divine right had David to the Edomites and Ammonites, though the occasion of David’s taking possession of these kingdoms by his sword did arise from particular and occasional exigencies and injuries; but it follows in no sort that, therefore, kings now wanting any word of promise, and so of divine right to any lands, may ascend to the thrones of other kingdoms than their own by no other title than the bloody sword. That God’s will was the chief patent here is clear, in that God forbade his people to conquer Edom, or Esau’s possession, when as He gave them command to conquer the Amorites. I doubt not to say, if Joshua and David had no better title than their bloody sword, though provoked by injuries, they could have had no right to any kingly power over these kingdoms; and if only success by the sword be a right of providence, it is no right of precept.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 49 rt col</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>Mortifications [donations] given to religious uses by a positive law may be recalled by a more divine and stronger law of nature, such as this, ‘I will have mercy and not sacrifice.’ Suppose David, of his own proper heritage, had given the showbread to the priests; yet, when David and his men are famishing, he may take it back from them against their will. Suppose Christ had bought the ears of corn and dedicated them to the altar; yet might He and his disciples eat them in their hunger [Mt. 15:5-6]. The vessels of silver, dedicated to the church, may be taken and bestowed on wounded soldiers.</p></blockquote>

</figure><figure class="quote" id="q-0617859933" data-kw="">
<blockquote><p>5thly. I shall only propose one thing more to your consideration. Although the institutions and examples of the Old Testament, of the duty of magistrates in the things and about the worship of God, are not, in their whole latitude and extent, to be drawn into rules that should be obligatory to all magistrates now, under the administration of the gospel,-and that because the magistrate then was ‘custos, vindex, et administrator legis judicialis, et politiae Mosaicae,’ [the custodian, vindicator and administrator of the Judicial Law and Mosaic polity] from which, as most think, we are freed;–yet, doubtless, there is something moral in those institutions, which, being unclothed of their Judaical form, is still binding to all in the like kind, as to some analogy and proportion. Subduct [subtract] from those administrations what was proper to, ad lies upon the account of, the church and nation of the Jews, and what remains upon the general notion of a church and nation must be everlastingly binding.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Kingdom &amp; the Magistrate’s Power: a Sermon</cite>, p. 509</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</div>
</figure><figure class="quote" id="q-3dd5da3b7b" data-kw="">
<blockquote><p>…about a law there are these affections (if I may call them so): There is an interpretation, a dispensation, or relaxation; and these differ from an abrogation. For the former do suppose the law still standing in force, though mitigated; but Abrogation is then properly, when a Law is totally taken away. And this abrogation arises sometimes from the express constitution at first, which did limit and prescribe the time of the law’s continuance: sometimes by an express revoking and repealing of it by that authority which made it, sometimes by adding to that repeal an express law commanding the contrary. Now it may be easily proved that the Ceremonial and Judicial laws, they are abrogated by express repeal. The Judicial Law: 1 Pet. 2:13, where they are commanded to be subject to every ordination of man: and this was long foretold Gen. 49:10. The Lawgiver shall be taken from Judah. The Ceremonial Law that is also expressly repealed Acts 15 and in other places… In the second place, if we would speak exactly and properly, we cannot say, in any good sense, that the Moral Law is abrogated at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Moral Law &amp; the Covenants (London: Young, 1647)</cite>, pp. 211-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

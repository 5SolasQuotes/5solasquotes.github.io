<main class="wrap"><figure class="quote" id="q-a3ebf2ba79" data-kw="">
<blockquote><p>Both Piscator of late, by evidence of Scripture, and Bradwardine long before, by demonstration of reason, have proved that no will in God is conditionate, quoad actum volentis [as to the act of the one willing]; all the conditions are found, quoad res volitas [with respect to the things willed]. And indeed, though the purposes of God are absolute, yet his promises are therefore conditionate, because they are conformed to the manner of God’s operation with man: For, as God works in all things agreeable to their natures, so in man He uses to work agreeable to his nature. And therefore, albeit his purpose be absolute to bring them to grace and glory, to faith, repentance and salvation; yet He allures them to faith and repentance by promises and threatnings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. Cotton’s clearing certain doubts concerning Predestination together with an Examination thereof</cite>, (London: J.D., 1646) | 3rd Doubt, p. 63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c7fe119bf4" data-kw="">
<blockquote><p>673. Eze. 18:23; 33:11, ‘God will not the death.’ ‘He has no pleasure in the death of the wicked.’ Rom. 9:18, ‘He has mercy on whom He will, and whom He will he hardens.’ God will not the death of a sinner by his antecedent will, but by his consequent will, or his justice; because he justly punishes him who rejects the grace of God offered unto Him. He hardens therefore permissively, not affectively. 674. Eze. 18:23, ‘I will not the death of him that dies. Ch. 3:18, ‘Thou shalt die the death.’ God as our Father will not by the Gospel, but as He is our judge and revenger, He will by the Law, that a sinner shall die.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-thaddaeus.html">Johannes Thaddaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reconciler of the Bible</cite>, … (London: Miller, 1662) | Ezekiel</span></figcaption>

</figure><figure class="quote" id="q-65583f6f88" data-kw="">
<blockquote><p>Now we understand that God’s efficacious will is always infallibly fulfilled… In what sense, then, do we speak of God’s inefficacious will? This will, says Thomas (Ia, q. 19, a. 6 [Whether the Will of God is always fulfilled?], ad 1), is a conditioned will, an antecedent will, which wills all that is good in itself, independently of circumstances. Now this conditional, antecedent will remain[s] inefficacious because, in view of a higher good of which He alone is judge, God permits that this or that good thing does not come to pass. Thus, in view of that higher good , God permits to illustrate, that harvests do not reach maturity, that the gazelle becomes the prey of the lion, that the just suffer persecution, that this or that sinner dies in final impenitence. Sometimes we see the higher good in question, sometimes we cannot. In permitting final impenitence, for example, God may be manifesting infinite justice against obstinacy in evil. Such is the Thomistic distinction of antecedent (inefficacious) will from consequent (efficacious) will… To illustrate. God willed, by consequent will, the conversion of St. Paul. This conversion comes to be, infallibly but freely, because God’s will, strong and sweet, causes Paul’s will to consent freely, spontaneously, without violence, to his own conversion. God did not on the other hand will, efficaciously, the conversion of Judas, though He, conditionally, inefficaciously, antecedently, certainly willed it, and He permitted Judas to remain, freely, in final impenitence. What higher good had God in mind? This, at least: the manifestation of infinite justice. (For more extended exposition, see our work, De Deo uno, 1938, pp. 410-34; also Rev. thom., May, 1937, “Le fondement supreme de la distinction des deux graces, suffisante et efficace.”) We must add this remark: Resisting sufficient grace is an evil which comes solely from ourselves. But non-resistance is a good, which, in last analysis, comes from God, source of all good.</p></blockquote>

</figure><figure class="quote" id="q-a6f09fda47" data-kw="">
<blockquote><p>Mr. [Thomas] Hooker [a congregationalist] leaves out the chief word, wherein stands the force of my argument, he speaks nothing of God’s revealed intention and command to call in fools that they may be made wise, and he frames his answer, as if I had argued from the bare intention and hidden decree of God. But I find that Mr. Hooker utterly mistakes the distinction of God’s decree, and of his approving will, and therefore he takes for one and the same, the decree or intention of God (from which I bring not my argument) and the revealed intention of God, or his commanding will: the ignorance of which is a stumbling to Arminians, and Socinians, and to Mr. Hooker, who, as we shall hear, goes on with them, but I judge it one mistake in judgment in that godly man, but no heretical spirit, and therefore his defenders and followers would take heed to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (1658), Book 1, ch. 8, p. 33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

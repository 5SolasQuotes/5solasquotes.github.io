<main class="wrap"><figure class="quote" id="q-b80c64c354" data-kw="">
<blockquote><p>‘Let people praise thee, Lord; Let people all thee praise: Oh let the nations be glad, And sing for joy always. Then shall the earth yield her increase, God, our God, bless us shall; God shall us bless, and of the earth, The ends shall fear Him all.’

Here the two grand characteristics of the true Church of God,—the evangelical, and evangelistic or missionary,—are written as in a sunbeam:—the evangelical, in the possession of all needful gifts and graces out of the plenitude of the Spirit’s fulness: the evangelistic, in the instant and perpetual propension which that possession ought to generate and feed, instrumentally to dispense these blessings among all nations. As if to confound lukewarm and misjudging professors throughout all generations, these characteristics are represented by the Spirit of inspiration itself, as essential to the very existence and well-being of the Church, and in their very nature inseparable.

The prayer of the Church, as dictated by the Divine Spirit, is directed to the obtainment of blessings, not as an end, merely terminating in herself, but as a means towards the promotion and attainment of an ulterior end of the sublimest description,—the enlightenment and conversion of all nations! Hence it follows, that when a Church ceases to be evangelistic, it must cease to be evangelical; and when it ceases to be evangelical, it must cease to exist as a true Church of God, however primitive or apostolic it may be in its outward form and constitution!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-duff.html">Alexander Duff</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Missions. The Chief End of the Christian Church</cite>, (new edn, Edinburgh: Andrew Elliot, 1877), pp 11-12.</span></figcaption>

<blockquote><p>[2 Corinthians 1] Vers. 24. Not for that we have dominion over your Faith, but are helpers of your joy: for by Faith ye stand.

Hence arises another Objection: Therefore thou makest thy self Lord of our Faith, as if thou couldest punish when thou wouldst. He answers by denying any Mastery, affirming the power of his Ministry, and that to be employed to the benefit of the Church, that timely Censures, according to the Will of Christ, being used, those that repented might at length rejoice: He gives an account why he denied any dominion over their Faith, because Faith is the bond of conjunction with Christ, by which Faith we stand fast in the Grace of God, in right and title unto Christ, in the possession of things present, and in hopes of future good things: Therefore Faith admits no Lord, besides God; it admits of men only as Ministers, and helpers.</p></blockquote>

<blockquote><p>At that time the superstitious observance of Lent had prevailed everywhere, because the common people thought that in it they were doing some exceptional service to God, and the pastors commended it as a holy imitation of Christ. On the contrary, it is plain that Christ did not fast to set an example for others, but to prove, in so beginning to proclaim the gospel, that it was no human doctrine but actually one sent from heaven [Matt. 4:2]. And the marvel is that such sheer hallucination (which is refuted so often and with such clear arguments) could creep upon men of keen judgment. For Christ does not fast often—as he would have to do if he had willed to lay down a law of yearly fasting—but only once, when he girded himself for the proclamation of the gospel. Nor does he fast in human fashion, as would have been fitting if he willed to arouse men to imitate him; but he shows an example rather to transport all men to admiration of him than to arouse them with zeal to imitate him. Finally, his reason for fasting was not different from that which Moses performed when he received the law at the Lord’s hand [Ex. 24:18; 34:28]. For since that miracle was manifested in Moses to establish the authority of the law, it ought not to have been omitted in Christ, lest the gospel seem to yield to the law. But since that time it never entered any man’s mind, on the excuse of following Moses, to establish such a form of fasting among the people of Israel. And none of the holy prophets and patriarchs followed it, even when they had enthusiasm and zeal enough for all pious exercises. For the statement that Elijah went forty days without food and drink [1 Kings 19:8] only served to apprise the people that he had been raised up to restore the law, from which almost all Israel had departed. It was, therefore, mere wrongheaded zeal, full of superstition, that they justified and painted fasting as the following of Christ. However, there was amazing diversity in the manner of fasting, as Cassiodorus relates from the ninth book of Socrates’ history. For the Romans (he says) had only three weeks, but for them the fast was continuous, except on Sunday and Saturday. The Illyrians and Greeks had six; others, seven; but fasting was at intervals. They differed as much in choice of foods: some ate only bread and water; others added vegetables; still others did not abstain from fish and fowl; others made no distinction in foods. Augustine also mentions this difference in his second letter to Januarius</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, ed. John T. McNeill, trans. Ford Lewis Battles. The Library of Christian Classics (Louisville: Westminster John Knox Press, 2011), 4.12.20.</span></figcaption>

<blockquote><p>Doct. 3. One part of our duty is that on the Lord’s day, we cease from all our own works.

It is gathered from the Text; In six days shalt thou doe all thy work; but on the seventh day thou shalt do no work. &amp;c. That is, no work that is thine. Now that work is said to be our work, which neither directly belongs to the worship of God, nor yet is otherways imposed upon us by any necessity from God; but is chosen by our selves for some human, or worldly end.

Now such are 1. All our common and mercenary works. 2 All things, that call away our mind from that intention that is required unto the worship of God on that day, though otherways they be not servile. Yet such things are not forbidden, as either belong unto common honesty, or are of a very urgent and not of a made necessity of our own. The reason of this rest is, that we may be at convenient leisure for divine worship: For worldly businesses do in divers ways withstand this more solemn worship of God.

Reas. 1. Because the very external acts of both are for the most part such, as that they cannot consist or stand together at one time.

Reas. 2. Because the mind being distracted with such worldly business, cannot compose or settle it self in good order to perform solemn worship to God, as it ought.

Reas. 3. Because the taste, and savour, and power of holy exercises is impaired, and dulled at least, or blunted by mixture of such things with them, which in comparison should be but vile to them.

Use Is of Reproof, of such as easily break the rest of this day, either by their ordinary and vulgar occupations; or with merchandizes, or with sports or plays, or with troublesome and long feastings on it, &amp;c.</p></blockquote>

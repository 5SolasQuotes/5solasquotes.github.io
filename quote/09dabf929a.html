<blockquote><p>Yet it ought to be observed, that we cannot become acceptable to God without being united in one and the same faith, that is, without being members of the Church; for it is not necessary for us to run to Jerusalem, or to Mount Zion, because in the present day Zion is as wide and extensive as the whole world, which is entirely devoted to God. All that is necessary therefore is, that the same faith dwell in us, and that we be joined together by the bond of love. If this be wanting, every thing about us is heathen, and we have nothing that is sacred or holy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Second</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 7: 45-46.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ddc2983088" data-kw="">
<blockquote><p>1. But come we to your [congregationalist] particulars: First, ‘by way of participation of the Lord’s Supper, the members of one church coming to another church, etc.’ But: 1. Why do you instance in this ordinance only? Have not their children, occasionally born there, a liberty also of baptisme? The rather, because baptism is not administred with respect to this or that church, but to the general visible Church: Unless you hold that a man or child is baptized to no church but that particular, and [is] an infidel to all the rest. Yet some of your brethren will hardly baptize a child of any but a member of their own church, which is next door to Anabaptism. … …4. But your reason I like very well: ‘For we receive the Lord’s Supper, not only as a seal of our communion with the Lord Jesus, and with his members in our own church, but also in all the churches of the saints’: Whence I infer, then, it is not any favour dispensed by you to a member of another church, but a dignity or privilege common to every member of that body, by virtue of that membership, and not with respect to his particular church membership. And I pray, is not baptism also a seal of our communion with all the members of Christ’s body? Why then may you not admit the children of the members of any church to be baptized by your pastors upon just occasion, as well as to admit the parents to the Lord’s Supper? Nay further: If the sacraments be seals of our communion with all the members of Christ, why do you not admit any true Christian, and his children, to the communion of the sacraments, though they be not as yet admitted members of any particular congregation? How dare you deny any member of that Body communion with its fellow-members, when it has union and communion with the Head? Consider it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Clavium</cite>, … (1645), ch. 4, pp. 39-41 Cawdrey was an English presbyterian and Westminster divine.</span></figcaption>

</figure><figure class="quote" id="q-b869d84c47" data-kw="">
<blockquote><p>We hold all who profess faith in Christ to be members of the visible Church, though they be not members of a visible congregation, and that the seals of the Covenant [of Grace] should not be denied to them. And for [the] more full clearing of the question, let these considerations be observed: First Distinction: All believers, as believers, in foro Dei, ‘before God’ have right to the seals of the Covenant [of Grace], these to whom the Covenant and body of the Charter belongs, to these the seal belongs, but in foro Ecclesiastico [in the sight of the Church], and in an orderly Church-way, the seals are not to be conferred by the Church upon persons because they believe, but because they profess their believing: therefore the apostles never baptized pagans, but upon profession of their faith. Second Distinction: Faith in Christ truly gives right to the seals of the Covenant [of Grace], and in God’s intention and decree, called voluntas beneplaciti [will of good-pleasure], they belong only to the invisible Church; but the orderly way of the Churches’ giving the seals is because such a society is a professing or visible Church, and [the] orderly giving of the seals according to God’s approving will, called, voluntas signi et revelata [the signified and revealed will], belongs to the visible Church. Third Distinction: The Church may orderly and lawfully give the seals of the Covenant to those to whom the Covenant and promises of grace do not belong in God’s decree of election. Fourth Distinction: The Church may lawfully add to the Church visible such as God adds not to the Church invisible, as they may add Simon Magus; and the Church may lawfully cast out of the visible Church, such as Christ has not cast out of the invisible Church, as the Church may excommunicate regenerate persons for scandalous sins. Fifth Distinction: Then the regenerate-excommunicated have right to the seals of the Covenant, as they have to the Covenant, and yet the Church does lawfully debar them, hic et nunc [here and now], in such a scandalous case, from the seals of the Covenant. We hold that those who are not members of a particular congregation may lawfully be admitted to the seals of the Covenant: First, Because those to whom the promises are made, and profess the Covenant, these should be baptized. But men of approved piety are such, though they be not members of a particular parish. The proposition is Peter’s argument, Acts 2:38. Secondly, Those who are not members of a particular church may be visible professors, and so members of a visible Church. Therefore, the seals of the Covenant belong to them. Thirdly, The contrary opinion has no warrant in God’s Word. Fourthly, The apostles required no more of those whom they baptized but profession of belief, as Acts 10:47, ‘Can any forbid water that these should not be baptized, who have received the Holy Ghost, as well as we?’ Acts 8:37, ‘If thou believest with all thy heart, thou mayest be baptized:’ no more is sought of the jailor, Acts 16:31,34.</p></blockquote>

<blockquote><p>1. Particular converts are first converted into the Church-catholic entitive, and secondarily conjoined into particular consociations, for the more opportune enjoyment of ordinances actually and constantly.

2. Every member of a particular congregation is a member of the Church-catholic entitive, and that relation does primarily belong unto him.

3. External profession of the true faith and subjection to God’s ordinances is enough to make a man capable of being a member of the Church-catholic visible, and so also of a particular congregation, quoad externam formam [as far as the external form].

4. By baptism members are visibly and ministerially admitted into the Church-catholic visible.

5. By excommunication rightly administered, an offender is cast out of the Church-catholic visible, as much as out of a particular congregation.

6. Federal holiness belongs to none primarily because [they are] born of members of a particular congregation, but [rather as they are] of the Church-catholic.

7. They that are only in the Church-catholic visible are not ‘without’ in the apostle’s sense [1 Cor. 5:12].

8. Children of believing parents have right to baptism, though their parents were not members of any particular congregation, and [they] are debarred from their due if [they are] denied it.

9. Every visible believer is or ought to be a member of the particular Church wherein and among whom he dwells. [This ought to be qualified by regular circumstances conducing to edification.]

10. The being in the general Covenant [of Grace] gives right to the ordinances, and not any particular covenant; neither do we find any mention in Scripture of any particular covenant either urged or used at admission of members into a particular congregation, or at the constitution thereof.

11. The invisible members of the Church which have internal communion with Christ are also visible members and have external communion in external ordinances.

12. The departure of a member from a particular congregation and removal to another for convenience or by necessity is no sin; but departing from the Church-catholic, and ceasing to be a member thereof, is a sin.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. Particular converts are first converted into the Church-catholic entitive, and secondarily conjoined into particular consociations, for the more opportune enjoyment of ordinances actually and constantly.

3. External profession of the true faith and subjection to God’s ordinances is enough to make a man capable of being a member of the Church-catholic visible, and so also of a particular congregation, quoad externam formam [as far as the external form].

<blockquote><p>Negative precepts oblige to every point of time. Affirmative do not so. He that is always under obligation to pray solemnly, is not obliged to be always solemnly at prayer. The worship of God is better than most actions of our lives; yet the saving of a town or house from fire, yea, plucking of a sheep or an ox out of a ditch, is sometimes to be preferred. The most sacred, external act of duty becomes sin, when it excludes that which is more a duty at that time. How fatal, how totally destructive an error might it have proved, before, to the Jewish nation, always to have thought it unlawful to defend themselves on the Sabbath-Day! (as it was once said to have been; Plutarch, de Superst.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Howe</cite>, vol. 5, Containing the Treatises: On Divine Prescience and the Trinity… (d. 1705; Religious Tract Society, 1863), ‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’, pp. 278-79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

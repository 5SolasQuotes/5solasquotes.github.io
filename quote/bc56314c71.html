<main class="wrap"><figure class="quote" id="q-bc56314c71" data-kw="">
<blockquote><p>…for, notwithstanding all their pretences, it will appear that they [of the opposite opinion] hang the whole weight of their building on three or four texts of Scripture— namely, 1 Tim. 2:5-6; Jn. 3:16-17; Heb. 2:9; 1 Jn. 2:2, with some few others [e.g. Jn. 1:29; 1 Tim. 4:10; 2 Pet. 2:1]— and the ambiguity of two or three words, which themselves cannot deny to be of exceeding various acceptations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Death of Death, ‘To the Reader’ in Works</cite>, 10:153-54</span></figcaption>

<blockquote><p>There is such a fulness in the satisfaction of Christ, as is sufficient for the salvation of the whole world, were the whole world to believe in Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-w-pink.html">A.W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Gospel of John (Zondervan, 1962), 2.219-22 This is early Pink, at his worst. HT: David Ponter | “Christ died for sinners. But everything turns on the significance of the preposition. What is meant by “Christ died for sinners”? To answer that Christ died in order to make it possible for God to righteously receive sinners who come to Him through Christ, is only saying what many a Socinian has affirmed. The testing of a man’s orthodoxy on this vital truth of the atonement requires something far more definite than this. The saving efficacy of the atonement lies in the vicarious nature of Christ’s death, in his representing certain persons, in his bearing their sins, in his being made a curse for them, in his purchasing them, spirit and soul and body. It will not do to evade this by saying</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-42f7ff9a1c" data-kw="">
<blockquote><p>Position 1. As there is no merit, good deserving, work or hire in the miserable sinner dying in his blood, dead in sins, out of his wit and disobedient, deceived and serving diverse lusts, Eze. 16:4-8; Eph. 2:1-4; Tit. 3:3-4, so there is as much love, man-kindness and free grace in heaven in the breast of Christ as would save all in hell, or out of hell. I speak this in regard, not of the Lord’s intention, as if He did bear all and every one of mankind a good will, purposing to save them. But because their lies and flows such a sea and ocean of infinite love about the heart and in the bowels of Jesus Christ as would over-save and out-love infinite worlds of sinners (so all could come and draw and drink, and suck the breasts of overflowings of Christ’s free grace) in regard of the intrinsical weight and magnitude of this love, that if you appoint banks to channel or marches to bound this free love, God should not be God, nor the Redeemer the Redeemer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself (London: 1647)</cite>, p. 233</span></figcaption>

<blockquote><p>5. That Christ Jesus died sufficiently for all men (his death being of sufficient merit to redeem and save them), but primarily and effectually for the elect alone, for whom alone He has actually and effectually obtained remission of sins, and life eternal.</p></blockquote>

</figure><figure class="quote" id="q-a7ad219589" data-kw="">
<blockquote><p>As for that collaterality which is objected, I answer, the civil and ecclesiastical power, if we speak properly, are not collateral. 1. They have no footing upon the same ground: there may be many subject to the magistrate, who are no church members, and so not under the spiritual power; and where the same persons are subject to both the powers, there is no more collaterality, in this case, nay, not so much, as is betwixt the power of a father in one man, and the power of a master in another man, when both powers are exercised upon the same man who is both a son and a servant. 2. Powers that are collateral, are of the same eminency and altitude, of the same kind and nature; but the civil power is a dominion and lordship; the ecclesiastical power is ministerial, not lordly. 3. Collateral powers do mutually and alike exercise authority over each other respectively. But, though the magistrate may exercise much authority in things ecclesiastical [circa sacra], church officers can exercise no authority in things civil. The magistrate’s authority is ecclesiastical objective, though not formaliter: but the church officer’s authority is not civil so much as objective, not being exercised about either civil, criminal, or capital cases. 4. Collateral powers are subordinate to, and derived from the supreme and original power, like two branches growing out of the same stock, two streams flowing from the same fountain, two lines drawn from the same center, two arms under the same head; but the power of the magistrate is subordinate unto, and depends upon the dominion of God the Creator of all: the power of church officers depends upon the dominion of Christ, the Mediator and King of the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming (1646) | Part 2, ch. 8</cite>, p. 120</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

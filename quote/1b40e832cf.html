<main class="wrap"><figure class="quote" id="q-1b40e832cf" data-kw="">
<blockquote><p>O how sad a reckoning, when the Devil the cozening Creditor comes at night, with his back counts, Pay me for your sweet lusts I gave you: answer my Bill for your idle oaths, your lies, oppressions, cozening, Covenant-breaking, your unjust judging, your starving, and murdering of the widow, and the fatherless, by detaining of the wages of the Soldier, your slighting of Christ, and the price is referred to God, and the market known. Satan can abate nothing, thy soul he must have, and within few days the body too; is this wisdom to earn hell? and to make away a noble for a straw?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Himself (London, 1647), pp 135-36.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-daee1297a2" data-kw="">
<blockquote><p>Though the Jewish Church and commonwealth were for the most part not different materially, the same men being members of both, even as in all Christian republics; yet they were formally different from one another in regard of distinct acts, laws, courts, officers, censures, and administrations. For, 1. The ceremonial law was given to them as a Church, the judicial law given to them as a State.

2. They did not worship, do sacrifice, pray, praise, etc. as a State; nor did they kill malefactors with the sword as a Church.

3. As the Lord’s matters and the King’s matters were distinguished, so there were two different courts for judging of the one and the other (2 Chron. 19:8, 11).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A late dialogue between a civilian and a divine</cite>, (London, 1644) in The anonymous writings of George Gillespie, ed. Chris Coldwell (Dallas TX, 2008), pp 122-3.</span></figcaption>

<blockquote><p>Occasionally on this blog, I will make reference to the R2K error. This view is held by a number of modern “Reformed” scholars, especially from Westminster Seminary California. Although I gave a brief definition of what it was in a recent post by Samuel B. Wylie, nevertheless, it is always better to get something straight from the horses’ mouth in order to avoid accusations that you are erecting a straw-man of your opponent’s position. Michael Horton is by far the most learned, gifted, and pious of the R2K theologians I have come across. Consequently, I think it is safe to say that his definition of the dogma is probably accurate. In his recent work on systematic theology, Professor Horton provides us with the following definition of what R2Kers believe concerning God’s law and civil government: ‘God secretly governs the nations just as he does the church, although he governs the former through natural law and common grace and the latter through his Word written and preached. […] The Mosaic theocracy was limited to the old covenant and is no longer the blueprint for nation-states.’ [1]

As a forum for Reformed political theology and Covenanter Theonomy, this blog will repeatedly post material arguing that nations are to be governed by biblical law. Moreover, although we acknowledge that modern nations are not to be exact replicas of the Hebrew Republic, as the judicial laws of particular right to Israel have expired, we do believe that judicial laws of common equity in the Mosaic law, which act as an external fence to the Decalogue, bind all nations. While some posts will directly address the R2K error, others will refute it indirectly by dealing with themes relating to the establishment principle, biblical penal sanctions, social theocracy, and the Lordship of Christ over the state. In light of the writings of our Reformed forebears on these themes, one can be in no doubt that there is no place for R2K at the Reformed table, as R2K is not Reformed.[2]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-horton.html">Michael Horton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian faith: a systematic theology for pilgrims on the way</cite>, (Grand Rapids, 2011), pp 366-7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-c3b11cf246" data-kw="">
<blockquote><p>As touching private persons, their bonds of friendship and amity are diverse and manifold; among these, this is the chiefest, unto which also natural conjunction of blood (as God witnesses) must give place, I mean the bond and tie of wedlock: so that in my judgement the husband cannot with a good conscience go or the wife from the husband, especially if one of them be [infected with?] the plague: And how much parents do owe unto their children, and children to their parents, kinsmen to kinsmen, the very laws of nature declares, the which Christian charity is so far off from letting loose, that contrariwise it draws them more and harder together: Yea, and for servants to forsake their masters, or masters to look slenderly to their servants being sick (which comes too often to pass), who have made use of their service when they were well, is cruelty. Yet is not the bond of all these friendships alike or equal, and therefore that which is not so near must give place to the nearer, forasmuch as many cannot be discharged at once.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned Treatise of the Plague</cite>, … (London, 1665), p. 18</span></figcaption>

Books Online</a></div>
</figure><figure class="quote" id="q-8aef366b20" data-kw="">
<blockquote><p>Assertion 1 — Patient suffering of wicked men and violent resisting are not incompatible, but they may well stand together; so this [following] consequence is the basis of the [opponent’s] argument, and it is just nothing: to wit, servants are to suffer unjustly wounds and buffeting of their wicked masters, and they are to bear it patiently; therefore, servants are in conscience obliged to non-resistance. Now, Scripture makes this clear: 1. The Church of God is to bear with all patience the indignation of the Lord, because she has sinned, and to suffer of wicked enemies which were to be trodden as mire in the streets (Mic. 7:9-12); but withal, they were not obliged to non-resistance and not to fight against these enemies, yea, they were obliged to fight against them also. If these were Babylon, Judah might have resisted and fought if God had not given a special commandment of a positive law, that they should not fight; if these were the Assyrians and other enemies, or rather both, the people were to resist by fighting, and yet to endure patiently the indignation of the Lord. David did bear most patiently the wrong that his own son Absalom, and Ahitophel, and the people inflicted on him, in pursuing him to take his life and the kingdom from him, as is clear by his gracious expressions (2 Sam. 15:25-26; 16:10-12; Ps. 3:1-3); yea, he prays for a blessing on the people that conspired against him (Ps. 3:8); yet did he lawfully resist Absalom and the conspirators, and sent out Joab and a huge army in open battle against them (2 Sam. 18:1-4, etc.) and fought against them. And were not the people of God patient to endure the violence done to them in the wilderness by Og, king of Bashan; Sihon, king of Heshbon; by the Amorites, Moabites, etc.? I think God’s law ties all men, especially his people, to as patient a suffering in wars (Dt. 8:16). God then trying and humbling his people, as the servant is to endure patiently unjustly inflicted buffets (1 Pet. 2:18); and yet God’s people at God’s command did resist these kings and people, and did fight and kill them, and possess their land, as the history is clear. See the like Josh. 11:18-19.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Assertion 1 — Patient suffering of wicked men and violent resisting are not incompatible, but they may well stand together; so this [following] consequence is the basis of the [opponent’s] argument, and it is just nothing: to wit, servants are to suffer unjustly wounds and buffeting of their wicked masters, and they are to bear it patiently; therefore, servants are in conscience obliged to non-resistance. Now, Scripture makes this clear: 1. The Church of God is to bear with all patience the indignation of the Lord, because she has sinned, and to suffer of wicked enemies which were to be trodden as mire in the streets (Mic. 7:9-12); but withal, they were not obliged to non-resistance and not to fight against these enemies, yea, they were obliged to fight against them also. If these were Babylon, Judah might have resisted and fought if God had not given a special commandment of a positive law, that they should not fight; if these were the Assyrians and other enemies, or rather both, the people were to resist by fighting, and yet to endure patiently the indignation of the Lord. David did bear most patiently the wrong that his own son Absalom, and Ahitophel, and the people inflicted on him, in pursuing him to take his life and the kingdom from him, as is clear by his gracious expressions (2 Sam. 15:25-26; 16:10-12; Ps. 3:1-3); yea, he prays for a blessing on the people that conspired against him (Ps. 3:8); yet did he lawfully resist Absalom and the conspirators, and sent out Joab and a huge army in open battle against them (2 Sam. 18:1-4, etc.) and fought against them. And were not the people of God patient to endure the violence done to them in the wilderness by Og, king of Bashan; Sihon, king of Heshbon; by the Amorites, Moabites, etc.? I think God’s law ties all men, especially his people, to as patient a suffering in wars (Dt. 8:16). God then trying and humbling his people, as the servant is to endure patiently unjustly inflicted buffets (1 Pet. 2:18); and yet God’s people at God’s command did resist these kings and people, and did fight and kill them, and possess their land, as the history is clear. See the like Josh. 11:18-19.”

— Samuel Rutherford, Lex Rex, ... (1644; Edinburgh: Ogle, 1843), pp. 152-53">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAssertion+1+%E2%80%94+Patient+suffering+of+wicked+men+and+violent+resisting+are+not+incompatible%2C+but+they+may+well+stand+together%3B+so+this+%5Bfollowing%5D+consequence+is+the+basis+of+the+%5Bopponent%E2%80%99s%5D+argument%2C+and+it+is+just+nothing%3A+to+wit%2C+servants+are+to+suffer+unjustly+wounds+and+buffeting+of+their+wicked+masters%2C+and+they+are+to+bear+it+patiently%3B+therefore%2C+servants+are+in+conscience+obliged+to+non-resistance.+Now%2C+Scripture+makes+this+clear%3A+1.+The+Church+of+God+is+to+bear+with+all+patience+the+indignation+of+the+Lord%2C+because+she+has+sinned%2C+and+to+suffer+of+wicked+enemies+which+were+to+be+trodden+as+mire+in+the+streets+%28Mic.+7%3A9-12%29%3B+but+withal%2C+they+were+not+obliged+to+non-resistance+and+not+to+fight+against+these+enemies%2C+yea%2C+they+were+obliged+to+fight+against+them+also.+If+these+were+Babylon%2C+Judah+might+have+resisted+and+fought+if+God+had+not+given+a+special+commandment+of+a+positive+law%2C+that+they+should+not+fight%3B+if+these+were+the+Assyrians+and+other+enemies%2C+or+rather+both%2C+the+people+were+to+resist+by+fighting%2C+and+yet+to+endure+patiently+the+indignation+of+the+Lord.+David+did+bear+most+patiently+the+wrong+that+his+own+son+Absalom%2C+and+Ahitophel%2C+and+the+people+inflicted+on+him%2C+in+pursuing+him+to+take+his+life+and+the+kingdom+from+him%2C+as+is+clear+by+his+gracious+expressions+%282+Sam.+15%3A25-26%3B+16%3A10-12%3B+Ps.+3%3A1-3%29%3B+yea%2C+he+prays+for+a+blessing+on+the+people+that+conspired+against+him+%28Ps.+3%3A8%29%3B+yet+did+he+lawfully+resist+Absalom+and+the+conspirators%2C+and+sent+out+Joab+and+a+huge+army+in+open+battle+against+them+%282+Sam.+18%3A1-4%2C+etc.%29+and+fought+against+them.+And+were+not+the+people+of+God+patient+to+endure+the+violence+done+to+them+in+the+wilderness+by+Og%2C+king+of+Bashan%3B+Sihon%2C+king+of+

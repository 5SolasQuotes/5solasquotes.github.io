<blockquote><p>Q. 6. When doth the Christian Sabbath begin?

A. It appears that this day is not to be reckoned from evening to evening, but from morning to morning; because the Christian Sabbath must begin when the Jewish Sabbath ended, but that ended towards the morning, Mat. xxviii. 1. In the end of the Sabbath, as it began to dawn towards the first day of the week, came Mary Magdalen, and the other Mary, to see the sepulchre.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of the Assembly’s catechism. With practical inferences from each question: as it was carried on in the Lord’s Days exercises in</cite>, Dartmouth, in the first year of liberty, 1688 (1692) in The works of John Flavel (6 vols, London, 1820), 6: 234.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e72445e500" data-kw="">
<blockquote><p>If thou knewest the gift of God, and who it is that saith to thee. Give me to drink; thou wouldest have asked of him, and he would have given thee living water. — John iv. 10.

IF the puzzled woman had but known that the mysterious stranger then talking with her was no mere Jew, but the divine Creator of all the floods of waters, and the divine Friend and Redeemer of the soul that is at the same time sin-smitten and athirst for heavenly blessings, she would have become a suppliant herself and would have sued for that “gift of God”‘ which Christ, the gracious and omnipotent Jehovah, had it in his power to bestow upon her.

Nor would he have denied her request, but would have conferred upon her that true inward “fountain of living water “so faintly symbolized by the freshly bubbling fountainheads and leaping streams of this earth. Eternal Life.” He who, as some think, pointed to the rising sun when he exclaimed, “I am the light of the world,” stood amidst the pillared galleries of Herod’s temple when the golden flagon was brought from the pool of Siloam on the last day of the feast and poured on the altar, and cried, “If any man thirst, let him come unto me and drink.</p></blockquote>

<blockquote><p>As far as I rawly conceive, I think that God is praised two ways: 1st. By a concional profession of His highness before men, such as is the very hearing of the word, and receiving of either of the sacraments; in which acts by profession, we give out to men, that He is our God with whom we are in covenant, and our Lawgiver. Thus eating and drinking in the Lord’s Supper, is an annunciation and profession before men, that Christ is our slain Redeemer. Here, because God speaketh to us, not we to Him, it is not a formal thanksgiving, but an annunciation or predication of Christ’s death—concional, not adorative—neither hath it God for the immediate object, and therefore no kneeling can be here. 2ndly. There is another praising of God, formal, when we are either formally blessing God, or speaking His praises. And this I take to be twofold:

1. When we directly and formally direct praises and thanksgiving to God. This may well be done kneeling, in token of our recognizance of His Highness; yet not so but that it may be done standing or sitting, especially seeing joyful elevation (which should be in praising) is not formally signified by kneeling.

2. When we speak good of God, and declare His glorious nature and attributes, extolling Him before men, to excite men to conceive highly of Him. The former I hold to be worship every way immediate, else I know not any immediate worship at all; the latter hath God for the subject, not properly the object, seeing the predication is directed to men immediately, rather than to God; for here we speak of God by way of praising, rather than to God. And, for my own part, as I am for the present minded, I see not how this can be done kneeling, seeing it is prædicatio Dei et Christi, non laudatio aut benedictio Dei. [A preaching of God and Christ, and not a praising or blessing of God.] But observe, that it is formal praising of God, and not merely concional, as I distinguished in the first member; for, in the first member, any speaking of God, or of His works of creation, providence, and redemption, is indirect and concional praising of Him, and formally preaching, or an act of teaching, not an act of predication of His praises. For there is a difference betwixt the simple relation of the virtues of a thing (which is formally teaching), and the extolling of the worth of a thing by way of commendation, to cause others to praise with us.</p></blockquote>

<blockquote><p>I had almost determined to be silent concerning the Innocents, as they call them; for although I could muster something like an army of them, it might always be alleged that there is nothing in this contradictory to history, because their exact number has not been defined. Therefore, I will say nothing of their numbers. Only let it be observed, that there is not a region of the world where some of them are not said to exist. I would ask, however, in what manner, after so long an interval, their graves were discovered, more especially as they were not regarded as saints till Herod slew them. I would also ask, when were they brought hither? The only answer which can be given is, that it was five or six hundred years after their death. Any person, however ignorant and illiterate, may judge what the result will be if credit is given to such wild dreams. Moreover, even if these Innocents could have been discovered, how could such a number of their bodies have been imported into France, Germany, and Italy, so as to be distributed amongst cities so remote from each other? This imposture, therefore, I leave as clearly established. As Lawrence is included in the list of ancient martyrs, we will here assign a place to him. I do not know, indeed, that his body is in more than one place, viz., at Rome, in the church which bears his name; but there is a separate vase filled with his ashes, and likewise two jugs, the one filled with his blood, and the other with his fat. Moreover, an arm and bones are in the church which bears the name of Palisperna, and other relics in the church of St Sylvester. But were all the bones collected which are in France alone, I have no doubt that two complete bodies might be formed out of them. There also is the gridiron on which he was roasted, although Palisperna, which we have mentioned, boasts of having a fragment of it. In regard to the gridiron I could pardon them; but there are other more notable relics as to which it were unlawful to be silent, I mean the coals which are shown at the church of St Eustathius, and the towel with which an angel is said to have wiped his body. Since they have idled away their time in devising dreams of this nature to impose upon the world, let those who read this Admonition take time for due consideration, and, by so doing, consult for themselves, and guard against being so imposed upon in future. Of the same manufacture is the dalmatic, which is also shown at Rome, in the church of St Barbara. Having heard that Lawrence was a deacon, they imagined that he decked himself in a vesture similar to that which metamorphoses their deacons when they play their part in the mass. But the office of deacon in the ancient Church was a very different thing from what it now is in the Papacy. Deacons were then elected to take charge of the poor and distribute alms, not to be a kind of stage-players, and, consequently, had no need whatever of dalmatics or similar maskings. To Lawrence we will join Gervasius and Protasius, whose tomb existed at Milan in the days of Ambrose, as he himself testifies, and likewise Jerome, Augustine, and many others. Accordingly, the Milanese even now lay claim to their bodies, which are nevertheless at Brissac, in Germany, and at Besançon, in the church of St Peter, besides an endless number of fragments scattered up and down in various churches of the world. Each of them must, therefore, have had at least three or four bodies, or we must discard the bones which now falsely pass under their name. In assigning to Sebastian the office of curing the plague, their object was to bring him into high esteem, and so make him be more eagerly sought after. The consequence has been, that his one body has been multiplied into four bodies, one of which is at Rome, in the church of St Lawrence, a second at Soissons, a third at Pilignum, in Brittany, and a fourth near Narbonne, the place of his birth. He has, moreover, two heads—one at Rome, in the church of St Peter, and another at Toulouse, in the possession of the Dominicans. Both heads, however, are empty, if credit is to be given to the Franciscans of Angers, who give out that they have his brain. Nay, these Dominicans have also an arm. There is also another at Toulouse, in the church of Saturninus, another at Casede, in Auvergne, another at Brissac, in Germany, beside minute fragments which exist in various churches. When all these things have been well considered, let any one guess where the body of Sebastian really is. Not contented, however, with these, they have made relics of the arrows with which he was pierced. One of them is shown at Lambesc, in Provence, another at Poictiers, while others are scattered up and down in various places. The whole makes it plain that they had taken it for granted that they were never to be called to account for their impostures. John Calvin, Theodore Beza, and Henry Beveridge, Tracts Relating to the Reformation, vol. 1 (Edinburgh: Calvin Translation Society, 1844), 332–334.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I had almost determined to be silent concerning the Innocents, as they call them; for although I could muster something like an army of them, it might always be alleged that there is nothing in this contradictory to history, because their exact number has not been defined. Therefore, I will say nothing of their numbers. Only let it be observed, that there is not a region of the world where some of them are not said to exist. I would ask, however, in what manner, after so long an interval, their graves were discovered, more especially as they were not regarded as saints till Herod slew them. I would also ask, when were they brought hither? The only answer which can be given is, that it was five or six hundred years after their death. Any person, however ignorant and illiterate, may judge what the result will be if credit is given to such wild dreams. Moreover, even if these Innocents could have been discovered, how could such a number of their bodies have been imported into France, Germany, and Italy, so as to be distributed amongst cities so remote from each other? This imposture, therefore, I leave as clearly established. As Lawrence is included in the list of ancient martyrs, we will here assign a place to him. I do not know, indeed, that his body is in more than one place, viz., at Rome, in the church which bears his name; but there is a separate vase filled with his ashes, and likewise two jugs, the one filled with his blood, and the other with his fat. Moreover, an arm and bones are in the church which bears the name of Palisperna, and other relics in the church of St Sylvester. But were all the bones collected which are in France alone, I have no doubt that two complete bodies might be formed out of them. There also is the gridiron on which he was roasted, although Palisperna, which we have mentioned, boasts of having a fragment of it. In regard to the gridiron I could pardon them; but there are other more notable relics as to which it were unlawful to be silent, I mean the coals which are shown at the church of St Eustathius, and the towel with which an angel is said to have wiped his body. Since they have idled away their time in devising dreams of this nature to impose upon the world, let those who read this Admonition take time for due consideration, and, by so doing, consult for themselves, and guard against being so imposed upon in future. Of the same manufacture is the dalmatic, which is also shown at Rome, in the church of St Barbara. Having heard that Lawrence was a deacon, they imagined that he decked himself in a vesture similar to that which metamorphoses their deacons when they play their part in the mass. But the office of deacon in the ancient Church was a very different thing from what it now is in the Papacy. Deacons were then elected to take charge of the poor and distribute alms, not to be a kind of stage-players, and, consequently, had no need whatever of dalmatics or similar maskings. To Lawrence we will join Gervasius and Protasius, whose tomb existed at Milan in the days of Ambrose, as he himself testifies, and likewise Jerome, Augustine, and many others. Accordingly, the Milanese even now lay claim to their bodies, which are nevertheless at Brissac, in Germany, and at Besançon, in the church of St Peter, besides an endless number of fragments scattered up and down in various churches of the world. Each of them must, therefore, have had at least three or four bodies, or we must discard the bones which now falsely pass under their name. In assigning to Sebastian the office of curing the plague, their object was to bring him into high esteem, and so make him be more eagerly sought after. The consequence has been, that his one body has been multiplied into four bodies, one of which is at Rome, in the church of St Lawrence, a second at Soissons, a third at Pilignum, in Brittany, and a fourth near Narbonne, the place of his birth. He has, moreover, two heads—one at Rome, in the church of St Peter, and another at Toulouse, in the possession of the Dominicans. Both heads, however, are empty, if credit is to be given to the Franciscans of Angers, who give out that they have his brain. Nay, these Dominicans have also an arm. There is also another at Toulouse, in the church of Saturninus, another at Casede, in Auvergne, another at Brissac, in Germany, beside minute fragments which exist in various churches. When all these things have been well considered, let any one guess where the body of Sebastian really is. Not contented, however, with these, they have made relics of the arrows with which he was pierced. One of them is shown at Lambesc, in Provence, another at Poictiers, while others are scattered up and down in various places. The whole makes it plain that they had taken it for granted that they were never to be called to account for their impostures. John Calvin, Theodore Beza, and Henry Beveridge, Tracts Relating to the Reformation, vol. 1 (Edinburgh: Calvin Translation Society, 1844), 332–334.”

— John Calvin, An Admonition Showing the Advantages Which Christendom Might Derive From an Inventory of Relics, Vol. 1 | Edinburgh: Calvin Translation Society, 1844, pp. 332–34">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+had+almost+determined+to+be+silent+concerning+the+Innocents%2C+as+they+call+them%3B+for+although+I+could+muster+something+like+an+army+of+them%2C+it+might+always+be+alleged+that+there+is+nothing+in+this+contradictory+to+history%2C+because+their+exact+number+has+not+been+defined.+Therefore%2C+I+will+say+nothing+of+their+numbers.+Only+let+it+be+observed%2C+that+there+is+not+a+region+of+the+world+where+some+of+them+are+not+said+to+exist.+I+would+ask%2C+however%2C+in+what+manner%2C+after+so+long+an+interval%2C+their+graves+were+discovered%2C+more+especially+as+they+were+not+regarded+as+saints+till+Herod+slew+them.+I+would+also+ask%2C+when+were+they+brought+hither%3F+The+only+answer+which+can+be+given+is%2C+that+it+was+five+or+six+hundred+years+after+their+death.+Any+person%2C+however+ignorant+and+illiterate%2C+may+judge+what+the+result+will+be+if+credit+is+given+to+such+wild+dreams.+Moreover%2C+even+if+these+Innocents+could+have+been+discovered%2C+how+could+such+a+number+of+their+bodies+have+been+imported+into+France%2C+Germany%2C+and+Italy%2C+so+as+to+be+distributed+amongst+cities+so+remote+from+each+other%3F+This+imposture%2C+therefore%2C+I+leave+as+clearly+established.+As+Lawrence+is+included+in+the+list+of+ancient+martyrs%2C+we+will+here+assign+a+place+to+him.+I+do+not+know%2C+indeed%2C+that+his+body+is+in+more+than+one+place%2C+viz.%2C+at+Rome%2C+in+the+church+which+bears+his+name%3B+but+there+is+a+separate+vase+filled+with+his+ashes%2C+and+likewise+two+jugs%2C+the+one+filled+with+his+blood%2C+and+the+other+with+his+fat.+Moreover%2C+an+arm+and+bones+are+in+the+church+which+bears+the+name+of+Palisperna%2C+and+other+relics+in+the+church+of+St+Sylvester.+But+were+all+the+bones+collected+which+are+in+France+alone%2C+I+have+no+doubt+that+two+complete+bodies+might+be+formed+out+of+them.+There+also+is+the+gridiron+on+which+he+was+roasted%2C+although+Palisperna%2C+which+we+have+mentioned%2C+boasts+of+having+a+fragment+of+it.+In+regard+to+the+gridiron+I+could+pardon+them%3B+but+there+are+other+more+notable+relics+as+to+which+it+were+unlawful+to+be+silent%2C+I+mean+the+coals+which+are+shown+at+the+church+of+St+Eustathius%2C+and+the+towel+with+which+an+angel+is+said+to+have+wiped+his+body.+Since+they+have+idled+away+their+time+in+devising+dreams+of+this+nature+to+impose+upon+the+world%2C+let+those+who+read+this+Admonition+take+time+for+due+consideration%2C+and%2C+by+so+doing%2C+consult+for+themselves%2C+and+guard+against+being+so+imposed+upon+in+future.+Of+the+same+manufacture+is+the+dalmatic%2C+which+is+also+shown+at+Rome%2C+in+the+church+of+St+Barbara.+Having+heard+that+Lawrence+was+a+deacon%2C+they+imagined+that+he+decked+himself+in+a+vesture+similar+to+that+which+metamorphoses+their+deacons+when+they+play+their+part+in+the+mass.+But+the+office+of+deacon+in+the+ancient+Church+was+a+very+different+thing+from+what+it+now+is+in+the+Papacy.+Deacons+were+then+elected+to+take+charge+of+the+poor+and+distribute+alms%2C+not+to+be+a+kind+of+stage-players%2C+and%2C+consequently%2C+had+no+need+whatever+of+dalmatics+or+similar+maskings.+To+Lawrence+we+will+join+Gervasius+and+Protasius%2C+whose+tomb+existed+at+Milan+in+the+days+of+Ambrose%2C+as+he+himself+testifies%2C+and+likewise+Jerome%2C+Augustine%2C+and+many+others.+Accordingly%2C+the+Milanese+even+now+lay+claim+to+their+bodies%2C+which+are+nevertheless+at+Brissac%2C+in+Germany%2C+and+at+Besan%C3%A7on%2C+in+the+church+of+St+Peter%2C+besides+an+endless+number+of+fragments+scattered+up+and+down+in+various+churches+of+the+world.+Each+of+them+must%2C+therefore%2C+have+had+at+least+three+or+four+bodies%2C+or+we+must+discard+the+bones+which+now+falsely+pass+under+their+name.+In+assigning+to+Sebastian+the+office+of+curing+the+plague%2C+their+object+was+to+bring+him+into+high+esteem%2C+and+so+make+him+be+more+eagerly+sought+after.+The+consequence+has+been%2C+that+his+one+body+has+been+multiplied+into+four+bodies%2C+one+of+which+is+at+Rome%2C+in+the+church+of+St+Lawrence%2C+a+second+at+Soissons%2C+a+third+at+Pilignum%2C+in+Brittany%2C+and+a+fourth+near+Narbonne%2C+the+place+of+his+birth.+He+has%2C+moreover%2C+two+heads%E2%80%94one+at+Rome%2C+in+the+church+of+St+Peter%2C+and+another+at+Toulouse%2C+in+the+possession+of+the+Dominicans.+Both+heads%2C+however%2C+are+empty%2C+if+credit+is+to+be+given+to+the+Franciscans+of+Angers%2C+who+give+out+that+they+have+his+brain.+Nay%2C+these+Dominicans+have+also+an+arm.+There+is+also+another+at+Toulouse%2C+in+the+church+of+Saturninus%2C+another+at+Casede%2C+in+Auvergne%2C+another+at+Brissac%2C+in+Germany%2C+beside+minute+fragments+which+exist+in+various+churches.+When+all+these+things+have+been+well+considered%2C+let+any+one+guess+where+the+body+of+Sebastian+really+is.+Not+contented%2C+however%2C+with+these%2C+they+have+made+relics+of+the+arrows+with+which+he+was+pierced.+One+of+them+is+shown+at+Lambesc%2C+in+Provence%2C+another+at+Poictiers%2C+while+others+are+scattered+up+and+down+in+various+places.+The+whole+makes+it+plain+that+they+had+taken+it+for+granted+that+they+were+never+to+be+called+to+account+for+their+impostures.+John+Calvin%2C+Theodore+Beza%2C+and+Henry+Beveridge%2C+Tracts+Relating+to+the+Reformation%2C+vol.+1+%28Edinburgh%3A+Calvin+Translation+Society%2C+1844%29%2C+332%E2%80%93334.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+An+Admonition+Showing+the+Advantages+Which+Christendom+Might+Derive+From+an+Inventory+of+Relics%2C+Vol.+1+%7C+Edinburgh%3A+Calvin+Translation+Society%2C+1844%2C+pp.+332%E2%80%9334&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F89a2da3060.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/89a2da3060.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/05/calvin-time-for-an-inventory-13/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

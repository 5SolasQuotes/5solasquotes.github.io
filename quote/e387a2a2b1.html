<main class="wrap"><figure class="quote" id="q-e387a2a2b1" data-kw="">
<blockquote><p>O but we are covetous and soul-thirsty after our own will in the matter of soul-manifestations; either I see little here, or we idol comforts, and would gladly have a Christ of created grace, rather than Christ, or his grace; and when we are thirsting for Christ, it is his comforts, the rings, jewels, bracelets of the Bridegroom, we sick after, rather than Himself; its not an unmixed, nor a poor marriage-love, to marry the riches and possessions, and not the person,</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing All Men to Himself (1647)</cite>, p. 155</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1e2b34c605" data-kw="">
<blockquote><p>Question 18: What if a woman have a husband that will not suffer her to read the Scriptures, nor go to God’s worship, public or private, or that so beats or abuses her, as that it cannot be expected that human nature should be in such a case kept fit for any holy action: or if a man have a wife that will scold at him when he is praying or instructing his family, and make it impossible to him to serve God with freedom, or peace and comfort? Answer: The woman must (at necessary seasons, though not when she would) both read the Scriptures and worship God, and suffer patiently what is inflicted on her: Martyrdom may be as comfortably suffered from a husband as from a prince. But yet if neither her own love and duty, and patience, nor friends’ persuasion, nor the magistrate’s justice can free her from such inhumane cruelty, as quite disables her for her duty to God and man, I see not but she may depart from such a tyrant. But the man has more means to restrain his wife from beating him, or doing such intollerable things: either by the magistrate, or by denying her what else she might have, or by his own violent restraining her, as belongs to a conjugal ruler, and as circumstances shall direct a prudent man. But yet in case that unsuitableness or sin be so great, that after long trial, there is no likelihood of any other cohabitation but what will tend to their spiritual hurt and calamity, it is their lesser sin to live asunder by mutual consent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory… (London, 1673), pt. 2, ‘Christian Economics’, ch. 9, ‘Cases About Divorce &amp; Separation’</cite>, p. 539</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-1ffe2b06fc" data-kw="">
<blockquote><p>[The first time was when the ceremonial law was obliging under the Mosaic system.] The second time was from the ascension of Christ, till about the time of the destruction of the Temple and city: in which ceremonies ceased to bind conscience and remained indifferent. Hereupon Paul circumcised Timothy: the apostles after Christs ascension, as occasion was offered were present in the temple, Acts 3:1; And the council of Jerusalem tendering the weakness of some believers, decreed that the Church for a time should abstain from strangled [animals] and blood. And there was good reason of this, because the Church of the Jews was not yet sufficiently convicted that an end was put to the ceremonial law by the death of Christ. In the third time, which was after the publishing of the Gospel, ceremonies of the Jews Church became unlawful, and so shall continue to the world’s end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Conscience wherein is set Down the Nature, Properties and Differences thereof: as also the way to get and keep good conscience (1596)</cite>, pp. 21-22</span></figcaption>

<blockquote><p>Fifthly, such as are wicked and ungodly vows… And thus two evils meet together, the one whereof is to vow, the other to perform such a vow; and therefore such vows are not to be kept. This serveth to set before the eyes of many their folly, who never consider what the vow is which they have taken upon them to observe, but if they can say, I have a vow to do this or that, they grow obstinate and settled in evil, and will by no means be removed, yea and think they are bound by virtue of their vow to do it, and are discharged of all fault and offence when they have done it: whereas that which is evil to vow, is much worse to perform; and therefore they must repent of their rash vow, and not proceed to the accomplishment of it, for that were to add one transgression to another, as it were drunkenness unto thirst, and to plunge themselves into endless destruction both of soul and body. This is the case of many young men and women who have entangled themselves in such vows, by promising marriage either to other without the consent of parents; they often pretend great scruple of conscience, which cannot be tied by such evil vows, the vow was evil, and therefore the way is not to go forward, but to crave pardon of God for that evil, as here it is prescribed in this Chapter [Num. 30].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Fourth Book of Moses, Called Numbers (London, 1618)</cite>, p. 1,159</span></figcaption>

<blockquote><p>…it was the opinion of the church of England, at the commencement of the reign of Queen Eli|zabeth, that, after a divorce for adultery, the parties might marry again. It is true that the despotic tribunal, the Star-Chamber, whose very name is odious to the ears of a free-born Englishman, did reverse this opinion… But, what was this less than acting against the spirit, reversing the very principles, of the Reformation; and recurring back again to the usages and practices of popery?</p></blockquote>

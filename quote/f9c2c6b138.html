<main class="wrap"><figure class="quote" id="q-f9c2c6b138" data-kw="">
<blockquote><p>So that every true Christian may by this doctrine of predestination, that Christ died only for them whom he hath predestinated before, comfort himself that he is one of them which are predestinated, forasmuch as he believeth, &amp; the spirit of God which is within him, even that spirit of comfort, doth witness to his spirit that he is the son of God, and therefore assure himself of his own salvation, without entering into the secrets of God, to judge of other men whether they shall be saved or no.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dove.html">John Dove</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached at Paul’s Cross, the sixth of February. 1596 In which are discussed these three conclusions. 1 It is not the will of God that all men should be saved. 2 The absolute will of God, and his secret decree from all eternity is the cause why some are predestined to salvation, others to d</cite>, (London: R. Dexter, 1597), p. 76.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

<blockquote><p>IV. The efficient cause of the Resurrection in common is the whole Holy Trinity; but singularly, Christ the Lord. Christ is its efficient cause in three ways:

I. As God.

II. As Judge of the World.

III. As Mediator. In the first two ways he is the efficient cause of the resurrection of the reprobate as well as of the elect; in the third way he is the cause of the Resurrection of the faithful by merit, efficacy and beginning.</p></blockquote>

<blockquote><p>IV. Although then this most divine panace or catholic remedy is proposed to all in the Gospel, yet we believe that no efficacy of it can be transfused, except there be an applying of this by faith in the Son of God, even as there can be no efficacy in physic or medicaments, except the sick patient hearken to the physician, and apply his medicines; which metaphor the Holy Ghost uses in this case.</p></blockquote>

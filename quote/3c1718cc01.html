<main class="wrap"><figure class="quote" id="q-3c1718cc01" data-kw="">
<blockquote><p>…natural ceremonies, such as bowing of the body before superiors, embracing of those who are dear unto us, lifting up the hands and eyes to heaven in ordinary worship, which nature itself does teach all nations to observe, without any institution, though not without some government of counsel, nor without such variety, as nature itself is subject unto…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-df81039e94" data-kw="">
<blockquote><p>Upon all these reasons I advise all that love their time, their souls, their God and happiness, to turn away from these nurseries of vice and to delight themselves in the Law and ordinances of their Savior, Ps. 1:2-3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Question 114, ‘Whether Stage-Plays where the Virtuous &amp; Vicious are Personated, be Lawful?’ [Yes] in A Christian Directory… (London: White, 1673), pt. 3, ‘Christian Ecclesiastics’, pp. 877-78 | 5. I think I never knew or heard of a lawful stage-play, comedy or tragedy in the age that I have lived in: And that those now commonly used, are not only sins, but heinous aggravated sins, for these reasons:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-2d2e6ec6a6" data-kw="">
<blockquote><p>Yet, with all his serenity, unlike the violence of his contemporaries, Shakspere showed in no uncertain way his dislike of the Puritans and their growing power.</p></blockquote>

</figure><figure class="quote" id="q-8187585510" data-kw="">
<blockquote><p>Yet in spite of Shakspere’s awareness of the social, political and religious movements of Elizabethan England and his knowledge of the feelings of the populace, it has been alleged that he knew nothing of the popular tendencies of Puritans… it is possible to discover his attitude toward the impending religious and political strife.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Yet in spite of Shakspere’s awareness of the social, political and religious movements of Elizabethan England and his knowledge of the feelings of the populace, it has been alleged that he knew nothing of the popular tendencies of Puritans… it is possible to discover his attitude toward the impending religious and political strife.”

</figure><figure class="quote" id="q-ecbb59759f" data-kw="">
<blockquote><p>…in making orders and ceremonies of the Church it is not lawful to do what men list, but they are bound to follow the general rules of the Scripture that are given to be the square whereby those should be squared out. Which rules I will here set down as those which I would have as well all orders and ceremonies of the church framed by as by the which I wil be content that all those orders and ceremonies which are now in question whether they be good and convenient or no should be tried and examined by. And they are those rules which Paul gave in such cases as are not particularly mentioned of in scripture. The first, that they offend not any, especially the Church of God. (1 Cor. 10:32) The second is (that which you cite also out of Paul) that all be done in order and comliness. (1 Cor. 14:40) The third, that all be done to edifying. (1 Cor. 14:26) The last, that they be done to the glory of God. Rom. 6:7)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reply to an Answer made of Mr. Doctor Whitgift against the Admonition to the Parliament (1573), Answer to</cite>, pp. 20-22, p. 27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

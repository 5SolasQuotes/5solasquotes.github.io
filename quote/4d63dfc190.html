<main class="wrap"><figure class="quote" id="q-4d63dfc190" data-kw="">
<blockquote><p>Q. What is forbidden [in the 2nd Commandment]? A. All will-worship devised by man. Religion is not human policy, but God’s divinity: yet in circumstances which are rather the ornaments than the elements of worship of the bye, than the substance, the Church is to be heard; for nothing is left in the power of the Church but things indifferent: that which is commanded, or forbidden, is to stand against all rules of men, and God must rather be obeyed than man. Acts 5:29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-yates.html">John Yates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Model of Divinity, Catechistically Composed</cite>, … (London, 1622), bk. 2, ch. 1, p. 309</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 13 lt. col.</span></figcaption>

<blockquote><p>Reason 2. Because nothing is required of them unfitting or burdensome, but that once every week, in convenient time and place, every one would contribute according to that measure wherewith God had blessed him: And the manner is plain, whereby the collection might be made publicly every Lord’s Day, and yet every one should lay it by himself, i. e. no man knowing the sum: We may imagine that they imitated the example of the ancient Church, a bored Chest being placed in the entrance to the house where they met for the Worship of God.</p></blockquote>

</figure><figure class="quote" id="q-2ad8e44f61" data-kw="">
<blockquote><p>Therefore, that thou be not beguiled with falsehood of sophistical words, understand that the words which the scripture uses in the worshipping or honoring of God, are these: Love God, cleave to God, dread, serve, bow, pray and call on God, believe and trust in God, and such like: which words all we use in the worshipping of man also, howbeit diversely; and the difference thereof does all the scripture teach.</p></blockquote>

</figure><figure class="quote" id="q-748db3f4cb" data-kw="">
<blockquote><p>And thus have we made good our argument that the lawfulnss of the ceremonies cannot be warranted by any ecclesiastical law. If we had no more against them, this were enough, that they are but human additions and want the warrant of the Word. When Nadab and Abihu offered strange fire before the Lord (Lev. 10:1), and when the Jews burnt their sons and their daughters in the valley of the son of Hinnon, howsoever manifold wickedness might have been challenged in that which they did, yet if any would dispute with God upon the matter, He stops their mouths with this one answer, ‘I commanded it not, neither came it into my heart.’ (Jer. 7:31)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), bk. 3, ch. 7, section 14, p. 122</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

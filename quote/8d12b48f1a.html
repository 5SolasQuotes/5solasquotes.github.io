<main class="wrap"><figure class="quote" id="q-8d12b48f1a" data-kw="">
<blockquote><p>For the promise is to you and to your children (Acts 2:39)

Have infants now under Christ no privilege nor covenant grace external by their birth and descent from believing parents? Answer: Sure they have. For Acts 2:39, the promise is to you and to your children. Either to all children or to some, the text makes no exception. If it be said to all conditionally, if they believe, not absolutely?

Answer: That must be an internal covenanting proper to the elect, and the promise is not made to the aged but conditionally, so they [Anabaptists] believe. And yet the promise shall be made to infants and children, but not while they come to age. To be cut off and cast out of the covenant is a dreadful judgment, Zechariah 11:9; Hosea 2:3-5; Romans 11:20, well, because of unbelief they are broken off. Then because the Jews believe in Christ already come, all their children, for no fault, but for the belief of their parents, must be cut off. Whereas Paul makes it a misery that the Ephesians, Ephesians 2:12, were strangers from the covenants of promise, saving no hope and without God, without Christ.

And Peter, that the Gentiles were no people, 1 Peter 2, then that misery lies upon the infants of Christians and all within the visible church, until they be converted and baptized, and the Gospel is no favour to them, that they are within the net, and in the office house of Grace the visible church where the word preached to children, who are to be taught, Genesis 18:19; Deuteronomy 6:7; Exodus 12:26, 27; Psalm 78:1-7; 2 Timothy 3:15, and the Lord reckons it among the favours, that he bestows not on every nation but only on his own covenanted Israel, that the Word of the Gospel to gather them and their children, Matthew 23:37; 2 Timothy 3:15; Psalm 78:1-5, and his statutes and judgments are declared and preached to them, Romans 3:1, 2; Romans 9:4, the promises and the giving of the Law, and the covenants and the service of God. And this is a special blessing in the New Testament to old and young is clear from Acts 13 when Paul turns from the blaspheming Jews to the Gentiles. Acts 13:47, I have set thee to be a light to the Gentiles, that thou shouldest be for salvation to the end of the earth. Now this covenant salvation is, Isaiah 49:6, 8-9, I will give thee to restore the preserved of Israel, I will give thee for a covenant to the people to establish the earth. That thou mayest say to the prisoners go forth, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The covenant of life opened; or, a treatise of the covenant of grace</cite>, ed. C. M. McMahon (1654; New Lennox IL, 2005), pp 133-4.</span></figcaption>

<blockquote><p>The nature and use of the law (which goes before the covenant of grace) having been unfolded, we must now treat of the covenant itself. Since it is of the greatest importance in theology (being as it were the center and bond of all religion, consisting in the communion of God with man and embracing in its compass all the benefits of God towards man and his duties towards God), our highest interest lies in rightly knowing and observing it. Hence the discussion of it demands peculiar accuracy (akribeian), that the truth may be confirmed against the errors by which Satan has endeavored in almost every age to obscure and corrupt this saving doctrine.</p></blockquote>

<blockquote><p>(1.) The life which he now led was a life of faith with respect unto things spiritual and eternal. For he had for the foundation and object hereof, [1.] The promise of the blessed Seed, and the spiritual blessing of all nations in him, as a confirmation of the first fundamental promise to the church, concerning the Seed of the woman that was to break the serpent’s head. And [2] God entered expressly into covenant with him, confirming it with the seal of circumcision, wherein he obliged himself to be his God, his God almighty, or all-sufficient, for his temporal and eternal good. To suppose that Abraham saw nothing in this promise and covenant but only things confined unto this life, nothing of spiritual grace or mercy, nothing of eternal reward or glory, is so contrary to the analogy of faith, to express testimony of Scripture, so destructive of all the foundations of religion, so unworthy of the nature and properties of God, rendering his title of “the father of the faithful,” and his example in believing, so useless, as that it is a wonder men of any tolerable sobriety should indulge to such an imagination.</p></blockquote>

<blockquote><p>If God’s love is known by what it hates, it is also known by what it loves or inclines toward. First, in a sense, it extends to all creatures. All creatures have some good from God.136 Even the wicked share in this benevolence. “God is kind to the unthankful and evil.”137 Man is now naturally contrary to God and positively evil, but the Luke 6:35 sermon shows that God still loves him in some ways. Indeed, Edwards goes on to say in another sermon: “even in damnation.”138 Yet, fundamentally, “holy persons love holy things for their holiness.”139 136. Unpublished MS sermon on Ps. 145:15–21, “All creatures in heaven and earth have their good things from God,” p. 1, St. Ind., Nov. 1, 1753.

137. Unpublished MS sermon on Lk. 6:35.

138. Unpublished MS sermon on Eph. 4:15–16, “In a company of Christians among whom Christianity has its genuine effect, love is the beginning and love is the middle and love is the end of all their affairs,” p. 2, May 1743.

139. Unpublished MS sermons on Ps. 119:[1]40.</p></blockquote>

<blockquote><p>Will they then give over their wicked ways and suffer them to increase, whom God will have to increase? No, but they add unto their cruelty more and more: in such sort as the Israelites are weary of their lives, by sore labour in clay and brick, and in all work in the field, with all manner of bondage, which they laid upon them most cruelly, &amp; that their iniquity might be full, they devise a cruelty never heard of before, to send for the Midwives and to deal with them to destroy the male-children of the Israelites at the birth. Which may rightly teach us to beware ever how we begin to do evil, for fear one evil pull on another as here it did; and in David again, when adultery drew on murder of an innocent man, and a faithful subject.

But did the Midwives obey his commandment? No, they fear God, saith the text, and did not as the king commanded them, but preserved alive the men-children, justly commended for that they rather obeyed God, than man. They considered what stood with the law of God, which to them was known, and not what pleased a mis-led mind of a governor. Kings are to be obeyed and pleased, but in the Lord. And if further they will force us, our bodies are theirs to sustain undeserved pain, but both body and soul shall die, if we sin against God. This did those happy men know and follow, when they were threatened, and at last thrust into that fiery furnace by great cruelty, saying, as you read there; Our God is able to deliver us, if it please him, but if not, yet know, O King, that we will not do this thing being wicked idolatry to worship the molten image.

The reason of the Midwives refusal is alleged, the fear of God. And surely wheresoever this bank is, the waters of ungodliness are held out from everflowing, as where the bank is not, they do. When Abraham once entertained the thought, that in the king of Gerar his court, the fear of God was not, straight he doubted violence both to himself, and to his wife: and so offended in saying she was his sister. This fear made Joseph that he durst not sin against his master or against his brethren when his father was dead. This fear is the beginning of wisdom, and a good understanding have all they that doe thereafter, the praise of it endureth for ever. Still then labour to keep this fear in your heart, and you shall reap a comfortable reward of it at the last.

7. What then became of the Midwives? how escaped they the King’s wrath, disobeying his commandment? Surely the text saith, the King sent for them, and they by an untruth excused themselves, saying: The Hebrew women were so strong, that they were delivered before any midwife came. Where, in the King, we may learn this good, not to condemn any before we hear them: for, if so wicked a man as this King was, had yet that justice, to send for them and to hear their defence, much more should we that know more, doe the like. Many swelling tales and strange reports have feeble proof, when hearing is granted.

Secondly, in the Midwives we may see the weakness of our natures, for they should not have lied for any fear: and therefore though a good deed be done, yet it is ill defended. We may not lie, saith the scripture, to justify God, much less for any other cause. This weakness then in these good women was like a spot in a faire face: and S. Augustine saith of them, Viues conseruare natos fuit miserecordiae, at pro vita sua mentit as esse, opus fuit infirmitatis, quam Deus gratia condonat. Homines veró non nisi ingrati et proterui possunt adexemplum imitationis sibi proponere. To preserve alive the children, was a work of mercy, but to lie for the safety of their lives, was a work of infirmity, which yet God pardoned by grace, and none, saving unthankful and crooked persons, will ever propose it to themselves to be imitated. …

I will cast my heart upon another thing, me think, here most comfortable, namely, how God rejected not the good that was in these women for the imperfection that was mingled with it, but pardoning what was weak, graciously rewardeth what was well. Fear not you then though all be not in you as you wish, but pray as you can, read as you can, hear as you can, and all other Christian duties do them as you can, according to that measure of grace which you have received: and, if any infirmity thrust it self in, and trouble you, when you are most desirous to be free from it, fear not: the Lord sheweth in these women what his nature is. He knoweth our mould whereof we be made, and he turneth away his face from beholding our frailties, casting a gracious countenance upon our good. Frailty is ours, our welldoing is his: and his own grace he will reward. You are not greater than the Apostle was who yet groaned (you know) under this burden, that he could not doe the good which he would, but still slipt into the evil which he would not.

Tyrannize not then over your self, but know it for a truth, that want to do all, disgraceth not a will to do some thing with a sweet God. Often remember that place in the Kings, so full of comfort. He only (saith the Lord) shall go to the grave in peace, because in him there is some goodness. Some goodness, I say again, and ever have you it in your remembrance: for not, some goodness, shall loose his reward with God, though all be not there. Your will would do better, and that he seeth, but you fail as a child of Adam, and that he seeth also, yet will not see it, to stop any mercy from your, some goodness. If he then be so sweet, be not you sower against your self, but cheerfully doing what you can, say for your wants with him in the Gospel which felt infirmity as you do: Lord, help my unbelief: Lord, help my weakness every way, for thy mercy sake.</p></blockquote>

+with+God%2C+though+all+be+not+there.+Your+will+would+do+better%2C+and+that+he+seeth%2C+but+you+fail+as+a+child+of+Adam%2C+and+that+he+seeth+also%2C+yet+will+not+see+it%2C+to+stop+any+mercy+from+your%2C+some+goodness.+If+he+then+be+so+sweet%2C+be+not+you+sower+against+your+self%2C+but+cheerfully+doing+what+you+can%2C+say+for+your+wants+with+him+in+the+Gospel+which+felt+infirmity+as+you+do%3A+Lord%2C+help+my+unbelief%3A+Lord%2C+help+my+weakness+every+way%2C+for+thy+mercy+sake.%E2%80%9D%0A%0A%E2%80%94+Gervase+Babington%2C+Comfortable+notes+upon+the+books+of+Exodus+and+Leviticus%2C+as+before+upon+Genesis+Gathered+and+laid+down+still+in+this+plain+manner%2C+for+the+good+of+them+that+cannot+use+better+helps%2C+and+yet+are+careful+to+read+the+Scriptures%2C+and+very+desirous+to+find+the+comfort+in+them.+%E2%80%A6+With+a+table+of+the+prin%2C+%28London%3A+Thomas+Chard%2C+1604%29%2C+pp+11-13%2C+13-14.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F70f73502ad.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/70f73502ad.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/10/09/gervase-babington-on-the-imperfect-obedience-of-the-hebrew-midwives/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

</figure><figure class="quote" id="q-ed61c83180" data-kw="">
<blockquote><p>Christians have been known to spend much time debating who was technically right in the American Civil War/War Between the States. While not an entirely useless endeavour, this approach is in danger of missing the bigger picture. Isaac Nelson, of the Irish Presbyterian Church, reminds us of how the war demonstrated what happens when a nation abandons biblical justice:

His judgment long ago was – that slavery was entirely opposed to all justice. The pulpit had not done its duty in the matter, when it might have done so. The Churches of America had filled the cup of God’s indignation, and the people had now drunk it to the dregs. We find fault with the men who are corrupting the Word of the living God. It was quite possible for a nation as well as an individual to sin away its days of grace; and let us beware that as a nation we are not doing so. The lesson we have to learn from America is this – that they took to their bosom an adder of which we have to mourn, and learn the lesson that to do justice, to love mercy, to walk humbly with God is the only security for national prosperity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-nelson.html">Isaac Nelson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Banner of Ulster</cite>, 22 Apr. 1865</span></figcaption>

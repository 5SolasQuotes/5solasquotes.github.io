<main class="wrap"><figure class="quote" id="q-a1a48e9131" data-kw="">
<blockquote><p>Holding the distinction of natural and moral ability and inability, decides nothing in this behalf, because these terms are used by different men in different senses. Some mean by natural ability, plenary [complete] ability, in the full Pelagian sense; others mean, a partial, or gracious; an Arminian, or Semi-Pelagian ability. The orthodox, however, use it, if at all, simply to denote the natural faculties of understanding, desire, and will, which are essential to moral agency and responsibility, and belong to man, as such, whether unfallen, fallen, or renewed by grace. So, by moral inability, the former class [of Pelagians and Arminians] mean merely an aversion or unwillingness which the sinner can remove by his own will. The old Calvinists mean by moral inability, that indeed which characterizes fallen man; but still that which is real, which the subject of it cannot, while the Almighty power of God can, remove.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lyman-atwater.html">Lyman Atwater</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Witherspoon’s Theology’, The Biblical Repertory &amp; Princeton Review</cite>, (1863), pp. 598-99</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-55623a345b" data-kw="">
<blockquote><p>For because He executes some things by general and common operation in Nature, other things by particular and proper action in the Church, hence works are accustomed to be distinguished into those of Nature and of Grace. They are not, however, called ‘works of nature’ as if God works them by nature, seeing that outside Himself He acts not by necessity of nature but by the liberty of His will, Ps. 115:3; Eph. 1:11. Now the works of Nature are the works of Creation, Conservation, and Governance. For these proceed from God’s common action, Gen. 1 throughout; Mt. 5:45; Acts 17:24ff., are occupied in common nature, and constitute the common principles of natural things. Which is the cause why in order of explication they are premised to the works of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-e052571c14" data-kw="">
<blockquote><p>I answer that immortality indicates a certain potential to live forever and not die. But this potential is not found in human nature on the side of the body, except imperfectly, as if by obediential potency alone, since everlasting life cannot be had through the principles of nature. Rather, the completion of this potency comes from a divine gift gratuitously conferred. And so, immortality can be considered in two ways: either with regard to incomplete natural potency, and in this way, there is one and the same immortality just as there is one and the same nature; or with regard to the gift of grace, which is like the formal element completing the aforementioned potency. And in this way, we find a difference between the two immortalities and impassibilities, since the first was through the grace of innocence whereas the final will be through the gift of glory. For in the first state the soul’s dominance over the body was such that nothing in the body could happen that would be adverse to the soul. But in the last state the dominance will be greater, inasmuch as the properties of the soul will in a certain way overflow into the body such that the body will be rendered agile, bright, and spiritual, as well as impassible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, distinction 19, Immortality in the Original State of Man, quest. 1, art. 5, Whether the immoratlity of Adam was the same as the immortality of the resurrected, I answer that, bk. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-a6012a06a9" data-kw="">
<blockquote><p>From what has been said it is now easy to gather that liberty does survive in our choice, even after sin, a liberty that is essential to man’s nature, one by which all the worst men, whatever they do, do it freely; yet not such a liberty as is independent from the first cause, nor which is fitted with strength for spiritual good, to accomplish it spiritually, and in this respect it is rather called enslaved than free.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3 | section 11, p. 527, bk. 4, ch. 4, ‘The Penalty &amp; State of Sin’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

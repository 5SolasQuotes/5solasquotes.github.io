<main class="wrap"><figure class="quote" id="q-6e62898d0e" data-kw="">
<blockquote><p>But, whereas God is said to will the thing that he commands, here ariseth a question, how that can be said to be willed by God, which most commonly is not accomplished? For, albeit the will of command is accomplished, by the commanding of this or that, yet God’s will of the thing commanded seems not to be accomplished, unless the thing willed by God be sometimes brought to pass. The truth is, your opinion seems to be, That God not only willeth the salvation of the world, upon the condition of their repentance, (for that is no more to will their salvation, than their damnation) but that God willeth and desireth their salvation absolutely, in as much as he willeth and desireth their repentance.

I confess you do not in express terms profess as much; namely, that God willeth and desireth the repentance of Reprobates; yet hitherto you seem to tend, in this discourse of yours, though concerning this you say no more than this, That God gives means to help them to the performance of this obedience, so far as is meet for him: which while you profess, I doubt you understand not your own meaning; and therefore no marvel if others do not understand it: For, how far he doth help them, you express in a very uncertain manner; which is rather to conceal, than to discover and express your meaning. But I will endeavour to bolt it out.

These means you speak of are either moral only, consisting in instructing them wherein this obedience doth consist, and urging them by persuasion thereunto; or, in affording, besides this, some efficacious operation of God’s Spirit, to work them to this obedience. Now, this latter cannot be your meaning; for if this were afforded them, their obedience, certainly, would be wrought: but the world, of whom you speak, doe never perform this obedience. Now, in granting the other, there is not so much evidence of God’s will that they shall perform this obedience, as by the denying of this we have evidence, that his will is not that they shall perform this obedience.

Again, in respect of means moral, can any be saved without the means of true faith and true repentance? I think you will not say they can: Then consider, have all men sufficient instruction unto the performance of true faith and true repentance? How will you be able to make this good? Hand over head, you say, God gives means to help them to the performance of this obedience, so far as is meet for him to do: yet, I am persuaded, you are not able to make this good, taking it according to the confuse generality wherein you express it. For, is it not meet for God to afford any Nation or particular persons his word and Gospel, as well as it is meet for him to afford it us?

Nay, is it not as meet for God to afford any other person both the outward means, and the inward efficacious operation of his holy Spirit, to work them unto faith and true repentance, as well as by these means he hath been pleased to work us hereunto? This meetness, what is it but that which Schoolmen call, Justitia condecentiae, and which they profess doth accompany every action of God? So that had God afforded the same grace to others which he hath afforded unto us, he had carried himself therein meetly, that is, justly, justitia condecentiae.

Again, had he denied the same grace to us which he hath denied unto others, he had herein also carried himself meetly, or decently, that is, justly, justitia condecentiae. I am sorry to observe from such good men’s pens such illusions to have their course, to the obscuring of the grace of God, and his sovereignty of dispensing it to whom he will.</p></blockquote>

<blockquote><p>And lastly the Scripture speaks in a twofold manner of our conversion: [1] Sometimes the Lord attributes to us, and requires of us the whole work thereof, as if it depended altogether on our will; ‘If ye be willing and obedient, ye shall eat the good things of the land.’ (Isa. 1:19) ‘Turn ye unto Me, and I will turn unto you:’ (Zech. 1:3) ‘Make you a new heart, and a new spirit: for why will ye die, O house of Israel:’ (Eze. 18:31) ‘Repent ye and believe the Gospel’ (Mk. 1:15; Why God requires and attributes conversion to man: On Grace &amp; Free Will, ch. 6; Of Corruption &amp; Grace, ch. 3) not, as if it were [Greek] or in our power to do these things. For how can they spiritually move who are dead in sins? But the Scripture thus speaks:

1. To teach us that we neither will, nor can do anything of ourselves: but are bound to ask it of God. And 2. Because God by such exhortations, threatenings, promises and conditions does please effectually to raise up our desire and by his Spirit enables us to perform his will. Augustine says well: ‘God commands us those things which we cannot do, that we may know what we ought to ask of Him.’ And in another place: ‘O man observe from the commandment what thou shouldst have: by reproofs, what thou art deprived of by thy own default, and in prayer acknowledge whence to receive what thou desirest to have.’ [2] And again other [passages] where the Lord ascribes the whole work of our conversion unto Himself alone and commands us so to acknowledge it. As: ‘I will make you to walk in my ways, and I will take the stony heart out of your flesh, and I will give you an heart of flesh.’ (Eze. 36:26) ‘Turn thou me, and I shall be turned.’ (Jer. 31:18) ‘No man can come unto me, except the Father draw him.’ (Jn. 6:44) ‘Without Me ye can do nothing.’ (Jn. 15:6) See the like: Eph. 2:1; 1 Cor. 2:13-14; Rom. 8:7; 2 Cor. 3:5; Lk. 24:45; Acts 16:14; 11:18. All which testimonies do plainly evince that the grace of conversion is not indifferent or universal: but as our sufficient [help], so also our effectual help does wholly depend upon the general and particular pleasure and motion of God. Which difference of the Scriptures, and the cause thereof, because the Pelagians and their adherents have not observed: But ••ther abused the former places, as if they were absolutely spoken: and corrupted the latter by their equivocations about grace, calling it (as they also do to this day) a suasory, indifferent and resistible grace, limited by the will of man either to that which is good or evil: they have most falsely wrested the same, for to establish their idol of free-will. Now herewithal they must of necessity embrace all other Pelagian heresies and impieties also, as namely:

1. That faith and good works foreseen, do go before God’s predestination: and so are not from God’s predestinating of them: whereupon it will follow that predestination, being an effect of causes and conditions foreseen, is not to be called a predestination, but rather a post-destination.

2. That faith going before predestination must also be before vocation: seeing we are elected before we are called: And by this ground not God, but man should be the author of faith: contrary to that of Rom. 9:16, ‘It is not of him that willeth, or of him that runneth, but of God that sheweth mercy.’

3. That the will either co-working, or not co-working with foregoing grace does make men to differ, which is contrary to 1 Cor. 4:7, ‘Who maketh thee to differ from another? And what hast thou that thou didst not receive?’ And so the increase of faith and grace should be given according to the merit of congruity.

4. That man’s will is not corrupted or made worse by the Fall of Adam: and so either there should be no original sin at all, or else but in name only: whereas, ‘The heart of man is deceitful above all things.’

5. That the Law is not above man’s strength, but that he may absolutely fulfill the same: and be altogether free from sin in this life, if he would: wheras the Scriptures on the contrary teach that there is not any one just man in the earth which does good and sins not. All which errors establish merits of condignity, overthrow the grace and merits of Christ, and so consequently the truth of Christian religion, being nothing indeed, but in name only: and in a word confirms pagan divinity and philosophy. For in all these positions, the names only excepted, there is nothing but what philosophy itself teaches, both concerning the beginnings and reward of virtue: which to philosophers is faith, righteousness and works.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“And lastly the Scripture speaks in a twofold manner of our conversion: [1] Sometimes the Lord attributes to us, and requires of us the whole work thereof, as if it depended altogether on our will; ‘If ye be willing and obedient, ye shall eat the good things of the land.’ (Isa. 1:19) ‘Turn ye unto Me, and I will turn unto you:’ (Zech. 1:3) ‘Make you a new heart, and a new spirit: for why will ye die, O house of Israel:’ (Eze. 18:31) ‘Repent ye and believe the Gospel’ (Mk. 1:15; Why God requires and attributes conversion to man: On Grace &amp; Free Will, ch. 6; Of Corruption &amp; Grace, ch. 3) not, as if it were [Greek] or in our power to do these things. For how can they spiritually move who are dead in sins? But the Scripture thus speaks:

1. To teach us that we neither will, nor can do anything of ourselves: but are bound to ask it of God. And 2. Because God by such exhortations, threatenings, promises and conditions does please effectually to raise up our desire and by his Spirit enables us to perform his will. Augustine says well: ‘God commands us those things which we cannot do, that we may know what we ought to ask of Him.’ And in another place: ‘O man observe from the commandment what thou shouldst have: by reproofs, what thou art deprived of by thy own default, and in prayer acknowledge whence to receive what thou desirest to have.’ [2] And again other [passages] where the Lord ascribes the whole work of our conversion unto Himself alone and commands us so to acknowledge it. As: ‘I will make you to walk in my ways, and I will take the stony heart out of your flesh, and I will give you an heart of flesh.’ (Eze. 36:26) ‘Turn thou me, and I shall be turned.’ (Jer. 31:18) ‘No man can come unto me, except the Father draw him.’ (Jn. 6:44) ‘Without Me ye can do nothing.’ (Jn. 15:6) See the like: Eph. 2:1; 1 Cor. 2:13-14; Rom. 8:7; 2 Cor. 3:5; Lk. 24:45; Acts 16:14; 11:18. All which testimonies do plainly evince that the grace of conversion is not indifferent or universal: but as our sufficient [help], so also our effectual help does wholly depend upon the general and particular pleasure and motion of God. Which difference of the Scriptures, and the cause thereof, because the Pelagians and their adherents have not observed: But ••ther abused the former places, as if they were absolutely spoken: and corrupted the latter by their equivocations about grace, calling it (as they also do to this day) a suasory, indifferent and resistible grace, limited by the will of man either to that which is good or evil: they have most falsely wrested the same, for to establish their idol of free-will. Now herewithal they must of necessity embrace all other Pelagian heresies and impieties also, as namely:

1. That faith and good works foreseen, do go before God’s predestination: and so are not from God’s predestinating of them: whereupon it will follow that predestination, being an effect of causes and conditions foreseen, is not to be called a predestination, but rather a post-destination.

2. That faith going before predestination must also be before vocation: seeing we are elected before we are called: And by this ground not God, but man should be the author of faith: contrary to that of Rom. 9:16, ‘It is not of him that willeth, or of him that runneth, but of God that sheweth mercy.’

3. That the will either co-working, or not co-working with foregoing grace does make men to differ, which is contrary to 1 Cor. 4:7, ‘Who maketh thee to differ from another? And what hast thou that thou didst not receive?’ And so the increase of faith and grace should be given according to the merit of congruity.

4. That man’s will is not corrupted or made worse by the Fall of Adam: and so either there should be no original sin at all, or else but in name only: whereas, ‘The heart of man is deceitful above all things.’

5. That the Law is not above man’s strength, but that he may absolutely fulfill the same: and be altogether free from sin in this life, if he would: wheras the Scriptures on the contrary teach that there is not any one just man in the earth which does good and sins not. All which errors establish merits of condignity, overthrow the grace and merits of Christ, and so consequently the truth of Christian religion, being nothing indeed, but in name only: and in a word confirms pagan divinity and philosophy. For in all these positions, the names only excepted, there is nothing but what philosophy itself teaches, both concerning the beginnings and reward of virtue: which to philosophers is faith, righteousness and works.”

— David Pareus, Commentary on Revelation and John, (d. 1622; Amsterdam, 1644), ch. 3, pp. 82-83 on Rev. 3:20, “If any man… open the door…”">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+lastly+the+Scripture+speaks+in+a+twofold+manner+of+our+conversion%3A+%5B1%5D+Sometimes+the+Lord+attributes+to+us%2C+and+requires+of+us+the+whole+work+thereof%2C+as+if+it+depended+altogether+on+our+will%3B+%E2%80%98If+ye+be+willing+and+obedient%2C+ye+shall+eat+the+good+things+of+the+land.%E2%80%99+%28Isa.+1%3A19%29+%E2%80%98Turn+ye+unto+Me%2C+and+I+will+turn+unto+you%3A%E2%80%99+%28Zech.+1%3A3%29+%E2%80%98Make+you+a+new+heart%2C+and+a+new+spirit%3A+for+why+will+ye+die%2C+O+house+of+Israel%3A%E2%80%99+%28Eze.+18%3A31%29+%E2%80%98Repent+ye+and+believe+the+Gospel%E2%80%99+%28Mk.+1%3A15%3B+Why+God+requires+and+attributes+conversion+to+man%3A+On+Grace+%26+Free+Will%2C+ch.+6%3B+Of+Corruption+%26+Grace%2C+ch.+3%29+not%2C+as+if+it+were+%5BGreek%5D+or+in+our+power+to+do+these+things.+For+how+can+they+spiritually+move+who+are+dead+in+sins%3F+But+the+Scripture+thus+speaks%3A+1.+To+teach+us+that+we+neither+will%2C+nor+can+do+anything+of+ourselves%3A+but+are+bound+to+ask+it+of+God.+And+2.+Because+God+by+such+exhortations%2C+threatenings%2C+promises+and+conditions+does+please+effectually+to+raise+up+our+desire+and+by+his+Spirit+enables+us+to+perform+his+will.+Augustine+says+well%3A+%E2%80%98God+commands+us+those+things+which+we+cannot+do%2C+that+we+may+know+what+we+ought+to+ask+of+Him.%E2%80%99+And+in+another+place%3A+%E2%80%98O+man+observe+from+the+commandment+what+thou+shouldst+have%3A+by+reproofs%2C+what+thou+art+deprived+of+by+thy+own+default%2C+and+in+prayer+acknowledge+whence+to+receive+what+thou+desirest+to+have.%E2%80%99+%5B2%5D+And+again+other+%5Bpassages%5D+where+the+Lord+ascribes+the+whole+work+of+our+conversion+unto+Himself+alone+and+commands+us+so+to+acknowledge+it.+As%3A+%E2%80%98I+will+make+you+to+walk+in+my+ways%2C+and+I+will+take+the+stony+heart+out+of+your+flesh%2C+and+I+will+give+you+an+heart+of+flesh.%E2%80%99+%28Eze.+36%3A26%29+%E2%80%98Turn+thou+me%2C+and+I+shall+be+turned.%E2%80%99+%28Jer.+31%3A18%29+%E2%80%98No+man+can+come+unto+me%2C+except+the+Father+draw+him.%E2%80%99+%28Jn.+6%3A44%29+%E2%80%98Without+Me+ye+can+do+nothing.%E2%80%99+%28Jn.+15%3A6%29+See+the+like%3A+Eph.+2%3A1%3B+1+Cor.+2%3A13-14%3B+Rom.+8%3A7%3B+2+Cor.+3%3A5%3B+Lk.+24%3A45%3B+Acts+16%3A14%3B+11%3A18.+All+which+testimonies+do+plainly+evince+that+the+grace+of+conversion+is+not+indifferent+or+universal%3A+but+as+our+sufficient+%5Bhelp%5D%2C+so+also+our+effectual+help+does+wholly+depend+upon+the+general+and+particular+pleasure+and+motion+of+God.+Which+difference+of+the+Scriptures%2C+and+the+cause+thereof%2C+because+the+Pelagians+and+their+adherents+have+not+observed%3A+But+%E2%80%A2%E2%80%A2ther+abused+the+former+places%2C+as+if+they+were+absolutely+spoken%3A+and+corrupted+the+latter+by+their+equivocations+about+grace%2C+calling+it+%28as+they+also+do+to+this+day%29+a+suasory%2C+indifferent+and+resistible+grace%2C+limited+by+the+will+of+man+either+to+that+which+is+good+or+evil%3A+they+have+most+falsely+wrested+the+same%2C+for+to+establish+their+idol+of+free-will.+Now+herewithal+they+must+of+necessity+embrace+all+other+Pelagian+heresies+and+impieties+also%2C+as+namely%3A+1.+That+faith+and+good+works+foreseen%2C+do+go+before+God%E2%80%99s+predestination%3A+and+so+are+not+from+God%E2%80%99s+predestinating+of+them%3A+whereupon+it+will+follow+that+predestination%2C+being+an+effect+of+causes+and+conditions+foreseen%2C+is+not+to+be+called+a+predestination%2C+but+rather+a+post-destination.+2.+That+faith+going+before+predestination+must+also+be+before+vocation%3A+seeing+we+are+elected+before+we+are+called%3A+And+by+this+ground+not+God%2C+but+man+should+be+the+author+of+faith%3A+contrary+to+that+of+Rom.+9%3A16%2C+%E2%80%98It+is+not+of+him+that+willeth%2C+or+of+him+that+runneth%2C+but+of+God+that+sheweth+mercy.%E2%80%99+3.+That+the+will+either+co-working%2C+or+not+co-working+with+foregoing+grace+does+make+men+to+differ%2C+which+is+contrary+to+1+Cor.+4%3A7%2C+%E2%80%98Who+maketh+thee+to+differ+from+another%3F+And+what+hast+thou+that+thou+didst+not+receive%3F%E2%80%99+And+so+the+increase+of+faith+and+grace+should+be+given+according+to+the+merit+of+congruity.+4.+That+man%E2%80%99s+will+is+not+corrupted+or+made+worse+by+the+Fall+of+Adam%3A+and+so+either+there+should+be+no+original+sin+at+all%2C+or+else+but+in+name+only%3A+whereas%2C+%E2%80%98The+heart+of+man+is+deceitful+above+all+things.%E2%80%99+5.+That+the+Law+is+not+above+man%E2%80%99s+strength%2C+but+that+he+may+absolutely+fulfill+the+same%3A+and+be+altogether+free+from+sin+in+this+life%2C+if+he+would%3A+wheras+the+Scriptures+on+the+contrary+teach+that+there+is+not+any+one+just+man+in+the+earth+which+does+good+and+sins+not.+All+which+errors+establish+merits+of+condignity%2C+overthrow+the+grace+and+merits+of+Christ%2C+and+so+consequently+the+truth+of+Christian+religion%2C+being+nothing+indeed%2C+but+in+name+only%3A+and+in+a+word+confirms+pagan+divinity+and+philosophy.+For+in+all+these+positions%2C+the+names+only+excepted%2C+there+is+nothing+but+what+philosophy+itself+teaches%2C+both+concerning+the+beginnings+and+reward+of+virtue%3A+which+to+philosophers+is+faith%2C+righteousness+and+works.%E2%80%9D%0A%0A%E2%80%94+David+Pareus%2C+Commentary+on+Revelation+and+John%2C+%28d.+1622%3B+Amsterdam%2C+1644%29%2C+ch.+3%2C+pp.+82-83+on+Rev.+3%3A20%2C+%E2%80%9CIf+any+man%E2%80%A6+open+the+door%E2%80%A6%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5fa9a9717c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5fa9a9717c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-conversion/#:~:text=And%20lastly%20the%20Scripture%20speaks%20in,philosophers%20is%20faith%2C%20righteousness%20and%20works&amp;text=And%20lastly%20the%20Scripture%20speaks%20in%20a%20twofold&amp;text=which%20to%20philos

<main class="wrap"><figure class="quote" id="q-1a256fba76" data-kw="">
<blockquote><p>That the observances of the old law are better called signs than sacraments. For those things which were instituted only for the sake of signifying are merely signs, and not sacraments; such were the carnal sacrifices and the ceremonial observances of the Old Law, which could never justify those who offered them. As the Apostle says, “the blood of goats and of oxen, and the ashes of an heifer being sprinkled, sanctified such as are defiled, for the cleansing of the flesh,” [Heb 9:13] ‘not of the soul’ [Glossa Ordinaria] because the defilement arose from contact with the dead.—Augustine. Hence Augustine: ‘By that defilement which the Law cleanses, I understand noting other than contact with a dead person; anyone who touched such a person was unclean for seven days; but according to the Law he was purified on the third and seventh day, and was cleansed,’ so that he might enter the Temple. At times, those legal observances also cleansed ‘from bodily leprosy’; but as the Apostle says, no one was ever justified by the words of the Law, even if they were done in faith and charity. Why? —Ambrose, On the Letter to the Hebrews: ‘Because God imposed them for servitude, not for justification, and that they should be a figure of the future, willing them to be offered to himself rather than to idols.’ —And so they were sings; and Scriptures, because they were signs of a sacred thing, which they certainly did not confer. 4. Which things are called works of the Law. The Apostle calls those things the works of the Law which were instituted only for the sake of signifying, or as a burden.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-lombard.html">Peter Lombard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sentences</cite>, Book 4, dist. 1, ch. 4, §§ 3-4.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6ac70eebd0" data-kw="">
<blockquote><p>Should anyone attempt to weaken the truth of natural theology by this argument, that nothing of certainty can be discovered in human affairs, or that what is certain cannot possibly be distinguished from that which is doubtful, a confutation of the first of these puerilities does not belong to this part of the subject; for it is not our business here to demonstrate the principles of human knowledge, but to take them for granted–Let these who are so thoroughly possessed of such skeptical opinions in order to be cured of their folly apply to the metaphysicians, I had almost said to the physicians–all that our subject requires of us is to show that there is as great certainty to be found in matters of a divine nature as can possibly be met with in human affairs. For to add only this one remark, what end can it serve to confute those by argument who attempt to destroy all reasoning, nay the very foundations of it, and who, on their own principles, are equally refuted, whether they prove their own opinion to be true, or do not prove it, whether they overcome in their disputations, or are defeated? But that certainty is often confounded with doubt, and truth with falsehood, in every subject of our enquiry, more particularly such enquiries as have divine things for their object, cannot be denied. For this reason in particular, the candid enquirer after truth should determine nothing without caution, nothing precipitately, nothing from prejudice, from anger, from hatred, or any improper disposition. But to assert that nothing, in any of our enquiries, can be known with certainty, even when the utmost caution, sincereity and attention guide our researches, is perfectly absurd and quite inconsistent with the first principles of reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Natural Theology</cite>, tr. William Crawford (d. 1737; Belfast: Magee, 1777), Theses concerning Natural Theology in General, pp. 4-5</span></figcaption>

<blockquote><p>…it is impossible for the aforesaid truth of faith to be contrary to those principles which reason knows naturally…. Now, the knowledge of naturally known principles is instilled into us by God, since God himself is the author of our nature. Therefore, the divine wisdom also contains these principles. Consequently, whatever is contrary to these principles is contrary to the divine wisdom. Therefore, it cannot be from God. Therefore, those things which are received by faith from divine revelation cannot be contrary to our natural knowledge… God does not instil into man any opinion or belief contrary to natural knowledge… Yet, because it [the word of faith] surpasses reason, some look upon it as though it were contrary to reason; which is impossible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, bk. 1 | ch. 7, ‘That the truth of reason is not in opposition to the truth of the Christian faith’</span></figcaption>

<blockquote><p>‘But’ says he [Hussey, an Erastian], ‘may they not worship Christ as Mediator? Yes, doubtless they may.’ [Gillespie’s response:] No doubt He that is Mediator must be worshipped, because He is God; Christ God-man is the object of divine adoration, and his God-head is the cause of that adoration; but whether He is to be worshipped because He is Mediator, or under this formal consideration as Mediator; and whether the Mediator ought to be therefore adored with divine adoration, because He is Mediator, is res altioris indaginis [a thing for deeper investigation]. If Mr. Hussey please to read and consider what diverse Schoolmen have said upon that point, as: Aquinas, [Summa] third part, quest. 25, art. 1 &amp; 2; Alex. Alensis, Sum. Theol., part 3, quest. 30, member 2; Suarez in the third part of Thomas, disp. 53, sect. 1; Valentia, Comment on Thomas, tome 4, disp. 1, quest. 24, point 1; Tannerus, Scholastic Theology, tome 4, disp. 1, quest. 7, doubt 7. But much more if he please to read Disputatio de adoratione Christi, habita inter Faustum Socinum &amp; Christianum Francken: and above all Dr. Voetius, Select Disputations, pt. 2, disp. 14, Whether Christ is to be Adored as Mediator? Then I believe he will be more wary and cautious what he holds concerning that question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, … (London: 1646), bk. 2, ch. 6, p. 230</span></figcaption>

<blockquote><p>Objection 5… But sin unto death is sin against the Holy Spirit, as the Master [Peter Lombard] says…. Reply to Objection 5… so also among sins it is only those sins among mortal sins that are called “sins unto death” that, as far as they themselves go, are unforgivable. Therefore, sin is called “mortal” from the first death, but “unto death” because of the second death.” (Sentences, bk. 2, dist. 43, q. 1, art. 2; the ‘Exposition of the Text’ on this Distinction confirms this) For the Reformed: ‘That the Sin unto Death is the Same as the Sin Against the Holy Spirit’. . Disagreements What it is Thomas: “to sin through malice is to sin against the Holy Ghost.” (Summa, pt. 2 of 2, q. 14, art. 1) Turretin: “We say it is a universal apostasy from true Christianity or of the truth of the Gospel (of which one is convicted in his conscience); a total and persevering denial, hatred and resistance (whether sophistical or tyrannical) proceeding not from a common human weakness, but from special and deliberate wickedness and direct, diabolical hatred of it, joined with a contempt for all the means of salvation and final impenitency.” (1.647) Turretin’s view was the dominant view of the Reformed: ‘Of the Sin Against the Holy Spirit’. . Sin unto Death: Not to be Prayed for Thomas: “‘I do not say that anyone should pray for him.’ [1 Jn. 5:16]… then it must be understood in the sense that not just anyone should pray for such a sinner, since the conversion of these kinds of sinners is, as it were, miraculous. Hence just as not just anyone should pray for miracles to be performed, except great and holy men, neither should just anyone pray for the conversion of these kinds of sinners. Even so, according to the form of the words, it is not forbidden for there to be prayer for such a person.” (Sentences, bk. 2, dist. 43, ‘Exposition of the Text’) WCF 21.4: “Prayer is to be made for things lawful,[n] and for all sorts of men living… but not for… those of whom it may be known that they have sinned the sin unto death.[q] [n] 1 John 5:14 [q] 1 John 5:16</p></blockquote>

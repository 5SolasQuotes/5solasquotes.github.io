<main class="wrap"><figure class="quote" id="q-f6e19a7a29" data-kw="">
<blockquote><p>But we see that the godly are visited with sore anguish and very heavy afflictions beyond others; for in this manner God wishes to try their faith, that, after having laid aside their desires and forsaken the world, they may serve him. Since, therefore, the Lord has a peculiar care of them, he must chastise them, while he permits wicked men to indulge in unbounded licentiousness.

Here we are also reminded that we must endure not merely one or another calamity, and must not imagine that, when we have endured some afflictions, there are none in reserve for us; for we ought always to be prepared to endure new ones. When God begins to chastise his people, he does not immediately cease. We shall “bring forth wind” when we think that the birth is at hand; other calamities will break out, and we shall be continually attacked by additional sorrows. We must therefore maintain this warfare so long as it shall please God to employ us in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Second</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 7: 235.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2a31d27502" data-kw="">
<blockquote><p>Sometimes, by elevating his People above the bitterness of their afflictions, by the surpassing sweetness of his Presence, and transporting consolations. Great afflictions may be upon them, but greater divine refreshments may even drown and swallow them up. Our abounding afflictions are sweetly cured by Christ’s abounding and superabounding Consolations. The Moon and Stars are in the sky at mid-day, as well as at mid-night, but not one of them then appears; because the Sun shining in his strength, hath outshined them all: So when Jesus Christ the glorious Sun of righteousness shines in his strength of Grace and Consolation upon the hearts of his afflicted, he so shines away their troubles and distresses, that they scarce appear.

If Christ steel the Spirit with Faith, Courage and Magnanimity, and fill the heart with the Consolations of God, which are not small; how easy is it to trample upon the greatest tribulation, and count all afflictions as no afflictions, yea as great advantages! Holy [John] Bradford Martyr said; I thank God more of this Prison, then of any Parlour, yea then of any pleasure that ever I had; for in it I find God, my most sweet good God always. And Laurence Sanders Martyr confessed; I was in Prison, till I got into Prison. Hierom hath a good note concerning Job: That God came nearest to Job in his extremities, and dealt with him then most familiarly. And he adds: Let strokes come, let all kind of Punishments come: so that after these Christ will come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The chequer-work of God’s providences, towards His own people, made up of blacks and whites, viz., of their abasements, and advancements, their distresses, and deliverances, their sullying tribulations, and beautifying relaxations represented in a sermon preached at the funeral of that faithful serv</cite>, (London: G. Calvert, 1657), pp 34-35.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><figure class="quote" id="q-a53208e82e" data-kw="chastise">
<blockquote><p>&quot;You have chastised me, and I was chastised, as a bullock unaccustomed to the yoke; turn me and l shall be turned.&quot; &amp;c. And it is for the breaking down of the weight of one&#x27;s spirit that God lays it on: for which cause it is declared to be a good thing to bear it, that being the way to make one at length as a weaned child. Secondly, A strong desire to have the cross removed, and to have matters in that part going according to our inclinations. This is very natural, nature desiring to be freed from everything that is burdensome or cross to it; and if that desire is kept in a due subordination to the will of God, and it is not too pre-emptory, it is not sinful. &quot;If it is possible, let this cup pass from me; nevertheless, not as I will.&quot; &amp;c.</p></blockquote>

</figure><figure class="quote" id="q-5037874bca" data-kw="">
<blockquote><p>The choicest saints are ‘born to troubles as the sparks fly upwards’ Job v. 7. ‘Many are the troubles of the righteous;’ if they were many, and not troubles, then, as it is in the proverb, the more the merrier; or if they were troubles and not many, then the fewer the better cheer. But God, who is infinite in wisdom and matchless in goodness, hath ordered troubles, yea, many troubles to come trooping in upon us on every side.

As our mercies, so our crosses seldom come single; they usually come treading one upon the heels of another; they are like April showers, no sooner is one over but another comes. And yet, Christians, it is mercy, it is rich mercy, that every affliction is not an execution, that every correction is not a damnation. The higher the waters rise, the nearer Noah’s ark was lifted up to heaven; the more thy afflictions are increased, the more thy heart shall be raised heavenward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mute Christian under the Smarting Rod</cite>, (1684) in The Works of Thomas Brooks, ed. Alexander B. Grosart (6 vols, Edinburgh: Banner of Truth, 1980), i, 287.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

<blockquote><p>That answer was the answer of God; it implies divine perfection in him who gave it. To what sufferer would the favor of a creature be sufficient? Who but God can say, “My grace is sufficient for thee?” To Paul it was sufficient. It gave him perfect peace.</p></blockquote>

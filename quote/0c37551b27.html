<main class="wrap"><figure class="quote" id="q-0c37551b27" data-kw="">
<blockquote><p>XI. Therefore all Christ is everywhere, although his human nature, since his ascension untill the day of the Last Judgment, be nowhere but in Heaven. Mt. 28:6, ‘He is risen, he is not here,’ Mt. 26:11, ‘Me ye have not always with you.’ Jn. 16:28; ‘I leave the world and go unto my Father.’ Acts 3:21, ‘Whom the heavens must contain, until the time of restoring of all things.

XII. And the godly in what place of heaven or earth so ever they abide, are united to the human nature assumed by the Son of God, as members to their head, the same Holy Spirit dwelling in Christ by unity of essence with the Word, and in the godly by grace. 1. Cor. 12:13, ‘By one Spirit we are all baptized into one body.’ Eph. 4:4, ‘There is one body and one Spirit.’ 1 Jn. 4:13, ‘By this we know that we abide in Him and He in us, because He hath given us of his Spirit.’ Rom. 8:11, ‘If the Spirit of Him who hath raised etc. dwell in you etc.’ Irenaeus, bk. 3, ch. 19, ‘As of dry meal one lump cannot be made, nor one bread: so neither could we which are many, be made one in Christ Jesus, without that water which is from Heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of the Office &amp; Person of Christ the Only Mediator’ in A Collection of Certain Learned Discourses</cite>, … (Oxford, 1600), p. 245</span></figcaption>

</figure><figure class="quote" id="q-9f4b7ef13b" data-kw="">
<blockquote><p>We therefore reject the deifications of the Enthusiasts, the spirit and eternal uncreated Word, etc. For by these they subvert the nature of God and of man, and the operations of both. Which abominations, arising from the confusion of God with His work, of substance with accident, of the Holy Spirit with the Word, of man sanctified by God with the Sanctifier Himself and His divine holiness, we detect elsewhere.</p></blockquote>

</figure><figure class="quote" id="q-8ffaeccd41" data-kw="">
<blockquote><p>1st. The highest and closest union is between those things that are actuated by one spirit dwelling and moving in them… 2dly. Things at the greatest distance, and between which there is no physical continuity, may be acted by the same spirit, providing he be immense and infinite… 3dly. ‘Tis Christ as mediator that believers are united to… 4. The Holy Ghost did in a singular manner operate upon and reside in the human nature of Christ… 5thly. The Holy Ghost is the immediate renewer and sanctifier of the elect… 6thly. ‘Tis from, by, and through Jesus Christ as mediator that the Spirit, whether it be with respect to his Immediate seisure of us and dwelling in us, or with reference to any of his saving operations, is given to and bestowed upon us… 7ly. Through the communication of the Spirit from Christ to us, and immediately upon his taking the possession of us, the nature of Christ, the seed of God, and a vital living principle comes to be formed in us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-ferguson.html">Robert Ferguson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 3, ‘Of the Union of Believers with Christ’ Outline in The Interest of Reason in Religion… &amp; the Nature of the Union Betwixt Christ &amp; Believers; (with Reflections on Several Late Writings, especially Mr. Sherlock’s Discourse…)… (London, 1675), pp. 421-665, pp. 656-661:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-42d71c9918" data-kw="">
<blockquote><p>There can be no safety, no holiness, and no happiness to those who are out of Christ. No safety, because all such are under the condemnation of the law, verses 1-3; no holiness, because only such as are united to Christ have the Spirit of Christ, verse 9; and no happiness, because “to be carnally minded is death,” verse 6. Hence those who are in Christ, should be very humble, seeing they are nothing, and he is everything; very grateful, and very holy. And those who are out of Christ, should at once go to him, that they may attain safety, holiness, and happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, rev. ed., 1886, ch. 8, Remarks</span></figcaption>

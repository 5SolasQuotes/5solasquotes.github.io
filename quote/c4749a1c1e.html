<main class="wrap"><figure class="quote" id="q-c4749a1c1e" data-kw="">
<blockquote><p>For the King of heaven has long invited us to the marriage of His Son. We have yielded ourselves to be His guests. And there is a time when the King will take a survey of all His guests, whether they have the wedding garment, which is Christ Himself. And they which are not clad with this robe shall be cast into utter darkness. We are as naked infants exposed to death (Ezek. 16:4). The merits and obedience of Christ is as swaddling clothes and swaddling bands….[T]here is a great temptation arising upon the consideration of our own indignity. For when our sins come to our remembrance, they drive us from the presence of God and make us that we dare not pray. Now the remedy is this. We must come clothed with Christ into the presence of God. We may not come in our names, but we must come in His name and present the merit of Christ unto the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, 2:236 | on Matthew 22:1–14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e82de1bc9b" data-kw="">
<blockquote><p>But this sacred and holy image [of the glorified Christ in Rev. 1] instructs in all these points all the faithful of Christ most fully. Howbeit this image of Christ is not to be set forth with colors, since that colors cannot attain to the majesty thereof: but with the ecclesiastical doctrine, which has the promises of the Spirit of Christ: And is therefore more evident, and only meet for the true expressing thereof. Let us also print the same image, not upon any dead table with colors that will perish and fade, but in our hearts through the lively Spirit of God, which may also keep it in our minds, never to be wiped out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Hundred Sermons upon the Apocalypse of Jesus Christ</cite>, … (London: 1561), 5th Sermon, p. 33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-6649a5160f" data-kw="">
<blockquote><p>…for rulers in making laws, and creating by their sole pleasure goodness-moral, in particular matters without the Word of God, are not God’s servants, nor is human authority as human, the nearest cause of obligation of conscience, instamped in these laws, nor is it the cause at all, and therefore to resist them, is not to resist God. They be God’s instruments and ministers in: 1. Propounding and expounding God’s laws. 2. In executing them and defending them from the violence of men. 3. In making positive and directory civil laws for civil government that are laws improperly so called, which bind the conscience as above is said, insofar as they have dependence upon God’s Law; For James says, ‘There is but one Lawgiver’ [James 4:12]. As for Church-canons, all, except physical circumstances in them, are to be warranted by the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Ch. 2, Question 2, p. 208</span></figcaption>

<blockquote><p>We consider the placement of images and statues in the places of worship as explicitly forbidden by God’s Word a thousand times. For why else would they be placed there except for worship? Is it to stir the memory? And yet the Holy Spirit is wiser than we are.</p></blockquote>

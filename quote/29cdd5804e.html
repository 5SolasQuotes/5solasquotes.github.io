<blockquote><p>28. We have, therefore, a most excellent and sure mark to distinguish… the legitimate observances of the Church, if we remember that one of two things, or both together, are always intended, viz., that in the sacred assembly of the faithful, all things may be done decently, and with becoming dignity, and that human society may be maintained. In order by certain bonds, as It were, of moderation and humanity… since nothing here is sought but the maintenance of charity by a common office… 30. …the whole sum of righteousness, and all the parts of divine worship, and everything necessary to salvation, the Lord has faithfully comprehended, and clearly unfolded, in his sacred oracles, so that in them He alone is the only Master to be heard. But as in external discipline and ceremonies [he used as an example bowing in prayer], he has not been pleased to prescribe every particular that we ought to observe, (he foresaw that this depended on the nature of the times, and that one form would not suit all ages, in them we must have recourse to the general rules which he has given, employing them to test whatever the necessity of the Church may require to be enjoined for order and decency. Lastly, as he has not delivered any express command, because things of this nature are not necessary to salvation, and, for the edification of the Church, should be accommodated to the varying circumstances of each age and nation, it will be proper, as the interest of the Church may require, to change and abrogate the old, as well as to introduce new forms. I confess, indeed, that we are not to innovate rashly or incessantly, or for trivial causes. Charity is the best judge of what tends to hurt or to edify: if we allow her to be guide, all things will be safe. 31. Things which have been appointed according to this rule, it is the duty of the Christian people to observe with a free conscience indeed, and without superstition, but also with a pious and ready inclination to obey…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, bk. 4, ch. 10, sections 27-32</span></figcaption>

<blockquote><p>27. But ordinances about such circumstances as place, time and the like are rightly said by the best authorities to be partly divine and partly human. They are grounded in part upon the will of God because of their chief and primary purpose, and partly upon man’s prudence, insofar as a special observation agreeable to God’s will is concerned. If no human error is made in this matter, the ordinance is to be held as wholly divine. It is the will of God that the church meet at the most convenient hour of the day, all circumstances considered. If, therefore, no error occurs in estimating the circumstances, the hour assigned for meeting after due consideration must be acknowledged as if appointed by God.</p></blockquote>

</figure><figure class="quote" id="q-4307c99bbc" data-kw="">
<blockquote><p>I remember one of our brethren of Scotland, in a discourse tending to the advancing of the presbyterian way, tells us that Dr. Montague, the late worthy bishop of Winchester, asked King James of blessed memory (whose sweet affability the world well knew) how it came about that there were so few heresies and errors of doctrine broached and prosecuted to the public disturbance of the Church of Scotland? Unto which the wise and learned king is said to have returned this answer: ‘That every parish has their pastor ever present with them and watching over them; that the pastor has his elders and deacons sorted with him; that he with them once a week meets at a set time and place for the censure of manners or whatever disorder falls out in the parish; so as he by this means perfectly knows his flock and every aberration of them, either in matter of opinion or practice: And lest any error or heresy may seize upon the pastor; they have their presbyteries, consisting of several shrivalties, which meet together in the chief town or city next to them, every week also once; and have there their exercise of prophesying; after which the moderator of the said meeting asks and gathers the judgements of all the said pastors concerning the doctrine then delivered, or, of any other doubtful point that is then and there propounded; And if the said presbyters be divided in their opinions, then the question is, under an enjoined silence, put over to the next synod, which is held twice a year; unto that all the pastors of that quarter or province duly resort; accompanied with their elders; the moderator of the former synod begins the action; then a new moderator is chosen for the present, or (as it seldom falls out) the last moderator, by voices, continued. Any question of doubt being proposed is either decided by that meeting or (if it cannot be so done) is, with charge of silence, reserved till the national synod or general assembly; which they hold every year once; whither come not the pastors only, but the king himself or his commissioners and some of all orders and degrees sufficiently authorized for the determining of any controversy that shall arise amongst them.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/king-james-i.html">King James I</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as narrated by Joseph Hall, ‘A Modest Offer of some meet Considerations tendered to the Learned Prolocutor and to the rest of the Assembly of Divines met at Westminster’</cite>, (Oxford, 1644), pp. 8-10</span></figcaption>

<blockquote><p>18. First there ought to be a greater difference placed between the doctrine of salvation required in the church and those things which they establish only to keep civil order. For doctrine, we also comprehend under this light the sacraments, which teach the conscience and do not depend on man who is bound to maintain it under the pain of damnation without changing, adding to or diminishing anything (in no such way, as we have declared before). But the canonical ordinances concerning the manner of proceeding are all exterior and outward according to the circumstances of places, times and persons, by reason of which they can neither be perpetual nor universal without exception. For such order and fashion may be held in one place which cannot be used in another place. Such a thing also is good in one place or at one time which would be unprofitable or harmful at another. And for this reason, there is often contradiction among the canons, as it is necessary to have with respect to those things which are expedient. Since such ordinances are mutable and made by man, it follows that they do not concern the conscience, especially in cases of slander and disorder–a prohibition of the purpose for which they were established, i.e., the edification and peace of the Church. For example, it was agreed by the council of Jerusalem… that the gentiles should abstain from eating the sacrifice of idols, from blood and beasts that are suffocated or strangled. I say that this is an ordinance distinct from the one before [fornication] (which pertains not to conscience nor to salvation simply, but only to the external and outward life), to attain an end more excellent and perfect, i.e., that the doctrine of salvation may take place among the Jews (Acts 15:19-21). For if it had been otherwise, apostles would have contradicted themselves. In the beginning, they agreed upon this–that grace alone justified by faith without the works of the Law (Acts 15:9-11); and also they would have contradicted the doctrine of Jesus Christ, who witnessed and said that what enters into the mouth does not defile a man; and St. Paul, who was in this council, would have been contrary to himself (Rom. 14:17; 1 Cor. 8:8; Col. 2:16-23; Titus 1:14-15). For shortly afterwards, he wrote that the kingdom of God was not in meat nor drink, and that one might eat of all things without creating any difficulty for conscience sake. Such prohibitions are devilish doctrines (1 Tim. 4:1-3), except when they are used for the liberty of the edification of neighbors. For avoiding slander (Rom. 14:13-19; 1 Cor. 10:23-4), let those then who will not understand this difference declare to us why they have abolished the apostolic ordinance; or whether they have greater power than the apostles; or else whether they will give place to the truth of God and study with us what may serve to the glory of God, instead of serving their own ambition and avarice in falsely abusing the title and authority of the church (Col. 2:8).

19. The second point: since such ordinances and statutes are made to increase the doctrine of the gospel, let them be established and set up in such a way that there is no abuse or any kind of superstition…

20. The third point: since men are so prompt and ready to love their own inventions and to turn the true religion into superstition; and also the times of the shadows of the Law are passed, and that God now ill be served in Spirit and truth and not in outward ceremonies (Jn. 4:23; Gal. 2:4; 5:1; and the whole epistle of the Hebrews); therefore, above all things, special regard must be taken that nothing be brought into the church except what is profitable and especially appropriate and necessary… But certainly the purest simplicity is the best, and the more Jesus Christ is plainly and simply declared, the more it is agreeable to His Word…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“18. First there ought to be a greater difference placed between the doctrine of salvation required in the church and those things which they establish only to keep civil order. For doctrine, we also comprehend under this light the sacraments, which teach the conscience and do not depend on man who is bound to maintain it under the pain of damnation without changing, adding to or diminishing anything (in no such way, as we have declared before). But the canonical ordinances concerning the manner of proceeding are all exterior and outward according to the circumstances of places, times and persons, by reason of which they can neither be perpetual nor universal without exception. For such order and fashion may be held in one place which cannot be used in another place. Such a thing also is good in one place or at one time which would be unprofitable or harmful at another. And for this reason, there is often contradiction among the canons, as it is necessary to have with respect to those things which are expedient. Since such ordinances are mutable and made by man, it follows that they do not concern the conscience, especially in cases of slander and disorder–a prohibition of the purpose for which they were established, i.e., the edification and peace of the Church. For example, it was agreed by the council of Jerusalem… that the gentiles should abstain from eating the sacrifice of idols, from blood and beasts that are suffocated or strangled. I say that this is an ordinance distinct from the one before [fornication] (which pertains not to conscience nor to salvation simply, but only to the external and outward life), to attain an end more excellent and perfect, i.e., that the doctrine of salvation may take place among the Jews (Acts 15:19-21). For if it had been otherwise, apostles would have contradicted themselves. In the beginning, they agreed upon this–that grace alone justified by faith without the works of the Law (Acts 15:9-11); and also they would have contradicted the doctrine of Jesus Christ, who witnessed and said that what enters into the mouth does not defile a man; and St. Paul, who was in this council, would have been contrary to himself (Rom. 14:17; 1 Cor. 8:8; Col. 2:16-23; Titus 1:14-15). For shortly afterwards, he wrote that the kingdom of God was not in meat nor drink, and that one might eat of all things without creating any difficulty for conscience sake. Such prohibitions are devilish doctrines (1 Tim. 4:1-3), except when they are used for the liberty of the edification of neighbors. For avoiding slander (Rom. 14:13-19; 1 Cor. 10:23-4), let those then who will not understand this difference declare to us why they have abolished the apostolic ordinance; or whether they have greater power than the apostles; or else whether they will give place to the truth of God and study with us what may serve to the glory of God, instead of serving their own ambition and avarice in falsely abusing the title and authority of the church (Col. 2:8).

19. The second point: since such ordinances and statutes are made to increase the doctrine of the gospel, let them be established and set up in such a way that there is no abuse or any kind of superstition…

20. The third point: since men are so prompt and ready to love their own inventions and to turn the true religion into superstition; and also the times of the shadows of the Law are passed, and that God now ill be served in Spirit and truth and not in outward ceremonies (Jn. 4:23; Gal. 2:4; 5:1; and the whole epistle of the Hebrews); therefore, above all things, special regard must be taken that nothing be brought into the church except what is profitable and especially appropriate and necessary… But certainly the purest simplicity is the best, and the more Jesus Christ is plainly and simply declared, the more it is agreeable to His Word…”

— Theodore Beza, ‘Theodore Beza’s Confession, (1560): A Brief &amp; Pithy Sum of Christian Faith’, 5th Point, ‘Of the Church’, 18. ‘…When or at What Time They Should Establish Disciplinary Procedures in the Church’ &amp; 19-20 in Reformed Confessions of the 16th &amp; 17th Centuries, ed. Dennison (RHB, 2010), vol. 2, pp. 311-12">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C18.+First+there+ought+to+be+a+greater+difference+placed+between+the+doctrine+of+salvation+required+in+the+church+and+those+things+which+they+establish+only+to+keep+civil+order.+For+doctrine%2C+we+also+comprehend+under+this+light+the+sacraments%2C+which+teach+the+conscience+and+do+not+depend+on+man+who+is+bound+to+maintain+it+under+the+pain+of+damnation+without+changing%2C+adding+to+or+diminishing+anything+%28in+no+such+way%2C+as+we+have+declared+before%29.+But+the+canonical+ordinances+concerning+the+manner+of+proceeding+are+all+exterior+and+outward+according+to+the+circumstances+of+places%2C+times+and+persons%2C+by+reason+of+which+they+can+neither+be+perpetual+nor+universal+without+exception.+For+such+order+and+fashion+may+be+held+in+one+place+which+cannot+be+used+in+another+place.+Such+a+thing+also+is+good+in+one+place+or+at+one+time+which+would+be+unprofitable+or+harmful+at+another.+And+for+this+reason%2C+there+is+often+contradiction+among+the+canons%2C+as+it+is+necessary+to+have+with+respect+to+those+things+which+are+expedient.+Since+such+ordinances+are+mutable+and+made+by+man%2C+it+follows+that+they+do+not+concern+the+conscience%2C+especially+in+cases+of+slander+and+disorder%E2%80%93a+prohibition+of+the+purpose+for+which+they+were+established%2C+i.e.%2C+the+edification+and+peace+of+the+Church.+For+example%2C+it+was+agreed+by+the+council+of+Jerusalem%E2%80%A6+that+the+gentiles+should+abstain+from+eating+the+sacrifice+of+idols%2C+from+blood+and+beasts+that+are+suffocated+or+strangled.+I+say+that+this+is+an+ordinance+distinct+from+the+one+before+%5Bfornication%5D+%28which+pertains+not+to+conscience+nor+to+salvation+simply%2C+but+only+to+the+external+and+outward+life%29%2C+to+attain+an+end+more+excellent+and+perfect%2C+i.e.%2C+that+the+doctrine+of+salvation+may+take+place+among+the+Jews+%28Acts+15%3A19-21%29.+For+if+it+had+been+otherwise%2C+apostles+would+have+contradicted+themselves.+In+the+beginning%2C+they+agreed+upon+this%E2%80%93that+grace+alone+justified+by+faith+without+the+works+of+the+Law+%28Acts+15%3A9-11%29%3B+and+also+they+would+have+contradicted+the+doctrine+of+Jesus+Christ%2C+who+witnessed+and+said+that+what+enters+into+the+mouth+does+not+defile+a+man%3B+and+St.+Paul%2C+who+was+in+this+council%2C+would+have+been+contrary+to+himself+%28Rom.+14%3A17%3B+1+Cor.+8%3A8%3B+Col.+2%3A16-23%3B+Titus+1%3A14-15%29.+For+shortly+afterwards%2C+he+wrote+that+the+kingdom+of+God+was+not+in+meat+nor+drink%2C+and+that+one+might+eat+of+all+things+without+creating+any+difficulty+for+conscience+sake.+Such+prohibitions+are+devilish+doctrines+%281+Tim.+4%3A1-3%29%2C+except+when+they+are+used+for+the+liberty+of+the+edification+of+neighbors.+For+avoiding+slander+%28Rom.+14%3A13-19%3B+1+Cor.+10%3A23-4%29%2C+let+those+then+who+will+not+understand+this+difference+declare+to+us+why+they+have+abolished+the+apostolic+ordinance%3B+or+whether+they+have+greater+power+than+the+apostles%3B+or+else+whether+they+will+give+place+to+the+truth+of+God+and+study+with+us+what+may+serve+to+the+glory+of+God%2C+instead+of+serving+their+own+ambition+and+avarice+in+falsely+abusing+the+title+and+authority+of+the+church+%28Col.+2%3A8%29.+19.+The+second+point%3A+since+such+ordinances+and+statutes+are+made+to+increase+the+doctrine+of+the+gospel%2C+let+them+be+established+and+set+up+in+such+a+way+that+there+is+no+abuse+or+any+kind+of+superstition%E2%80%A6+20.+The+third+point%3A+since+men+are+so+prompt+and+ready+to+love+their+own+inventions+and+to+turn+the+true+religion+into+superstition%3B+and+also+the+times+of+the+shadows+of+the+Law+are+passed%2C+and+that+God+now+ill+be+served+in+Spirit+and+truth+and+not+in+outward+ceremonies+%28Jn.+4%3A23%3B+Gal.+2%3A4%3B+5%3A1%3B+and+the+whole+epistle+of+the+Hebrews%29%3B+therefore%2C+above+all+things%2C+special+regard+must+be+taken+that+nothing+be+brought+into+the+church+except+what+is+profitable+and+especially+appropriate+and+necessary%E2%80%A6+But+certainly+the+purest+simplicity+is+the+best%2C+and+the+more+Jesus+Christ+is+plainly+and+simply+declared%2C+the+more+it+is+agreeable+to+His+Word%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+%E2%80%98Theodore+Beza%E2%80%99s+Confession%2C+%281560%29%3A+A+Brief+%26+Pithy+Sum+of+Christian+Faith%E2%80%99%2C+5th+Point%2C+%E2%80%98Of+the+Church%E2%80%99%2C+18.+%E2%80%98%E2%80%A6When+or+at+What+Time+They+Should+Establish+Disciplinary+Procedures+in+the+Church%E2%80%99+%26+19-20+in+Reformed+Confessions+of+the+16th+%26+17th+Centuries%2C+ed.+Dennison+%28RHB%2C+2010%29%2C+vol.+2%2C+pp.+311-12&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb8dc92d531.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b8dc92d531.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-church-ordinances/#:~:text=18.%20First%20there%20ought%20to%20be,it%20is%20agreeable%20to%20His%20Word&amp;text=18.%20First%20there%20ought%20to%20be%20a%20greater&amp;text=the%20more%20it%20is%20agreeable%20to%20His%20Word" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>A particular church, gathered and completely organized according to the mind of Christ, consists of officers and members; and the officers appointed by Christ to be chosen and set apart by the church (so called and gathered), for the peculiar administration of ordinances, and execution of power or duty, which he intrusts them with, or calls them to, to be continued to the end of the world, are bishops or elders, and deacons.</p></blockquote>

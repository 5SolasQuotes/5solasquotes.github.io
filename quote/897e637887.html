<main class="wrap"><figure class="quote" id="q-897e637887" data-kw="">
<blockquote><p>Our predestination is not wrought in ourselves, but in secret with Him, in His foreknowledge. But we are called by the preaching of repentance. We are justified in the calling of mercy and fear of judgment. He feareth not judgment, who hath previously attained salvation. Being called, we renounce the devil by repentance, that we may not continue under his yoke: being justified, we are healed by mercy, that we may not fear judgment: being glorified, we pass into everlasting life, where we praise God without end.… The verse wherewith this Psalm concludeth is the voice of life everlasting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Expositions on the Book of Psalms,” in Saint Augustin</cite>, ed. Philip Schaff, trans. A. Cleveland Coxe, vol. 8, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, First Series (New York: Christian Literature Company, 1888), 682.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0310ffe173" data-kw="">
<blockquote><p>10. Protestants, however, almost universally teach that we are justified by faith alone, and that not after the manner of a disposition (as the Romanists say) but after the manner of an instrument; that is, that justification is received, or as they themselves say, apprehended by no other thing than faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Considerationes Modestae et Pacificae Controversiarum de Justificatione</cite>, pp. 33-37 &amp; 55-59 in Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 1, chs. 3-4, p. 33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><figure class="quote" id="q-bd2e5c9660" data-kw="">
<blockquote><p>CHAPTER 31: THE MEANS BY WHICH OBTAIN DIVINE BLESSING Let us cleave then to His blessing, and consider what are the means of possessing it. Let us think over the things which have taken place from the beginning. For what reason was our father Abraham blessed? Was it not because he wrought righteousness and truth through faith? Isaac, with perfect confidence, as if knowing what was to happen, cheerfully yielded himself as a sacrifice. Jacob, through reason of his brother, went forth with humility from his own land, and came to Laban and served him; and there was given to him the scepter of the twelve tribes of Israel. CH 32: WE ARE JUSTIFIED NOT BY OUR OWN WORKS, BUT BY FAITH Whosoever will candidly consider each particular, will recognize the greatness of the gifts which were given by him. For from him have sprung the priests and all the Levites who minister at the altar of God. From him also [was descended] our Lord Jesus Christ according to the flesh. From him [arose] kings, princes, and rulers of the race of Judah. Nor are his other tribes in small glory, inasmuch as God had promised, “Thy seed shall be as the stars of heaven.” All these, therefore, were highly honored, and made great, not for their own sake, or for their own works, or for the righteousness which they wrought, but through the operation of His will. And we, too, being called by His will in Christ Jesus, are not justified by ourselves, nor by our own wisdom, or understanding, or godliness, or works which we have wrought in holiness of heart; but by that faith through which, from the beginning, Almighty God has justified all men; to whom be glory for ever and ever. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/clement-of-rome.html">Clement of Rome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>c. 94–97AD</cite></span></figcaption>

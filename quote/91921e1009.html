<main class="wrap"><figure class="quote" id="q-91921e1009" data-kw="">
<blockquote><p>A. Repentance unto life is a saving grace,[h] wrought in the heart of a sinner by the Spirit[i] and word of God,[k] whereby, out of the sight and sense, not only of the danger,[l] but also of the filthiness and odiousness of his sins,[m] and upon the apprehension of God’s mercy in Christ to such as are penitent,[n] he so grieves for[o] and hates his sins,[p] as that he turns from them all to God,[q] purposing and endeavouring constantly to walk with him in all the ways of new obedience.[r] [h] 2 Tim. 2:25. [i] Zech. 12:10. [k] Acts 11:18,20,21. [l] Ezek. 18:28,30,32. Luke 15:17,18. Hos. 2:6,7. [m] Ezek. 36:31. Isa. 30:22. [n] Joel 2:12,13. [o] Jer. 31:18,19. [p] 2 Cor. 7:11. [q] Acts 26:18. Ezek. 14:6. 1 Kings 8:47,48. [r] Ps. 119:6,59,128. Luke 1:6. 2 Kings 23:25.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Larger Catechism</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c6d2361ad7" data-kw="">
<blockquote><p>There are two sorts of persons who will find it harder to repent than others: 1. Such as have sat a great while under the droppings of God’s ordinances, but grow no better. The earth which drinketh in the rain, yet beareth thorns and briars, is nigh unto cursing (Heb. 6.8). The metal which hath lain long in the fire, but is not melted and refined, there is little hope of it. When God hath sent his ministers one after another, exhorting and persuading men to leave their sins, but they settle upon the lees of formality, and can sit and sleep under a sermon; it will be hard for these ever to be brought to repentance; they may fear lest Christ should say to them as once to the fig-tree, Never fruit grow on thee more. 2. They will find it harder to repent, who have sinned frequently against the convictions of the Word, the checks of conscience, and the motions of the Spirit. Conscience has stood as the angel, with a flaming sword in its hand; it has said, ‘Do not this great evil;’ but sinners regard not the voice of conscience, but march on resolvedly under the Devil’s colors: these will not find it easy to repent (Job 24.13). They are of those that rebel against the light. It is one thing to sin for want of light, and another thing to sin against light. Here the unpardonable sin takes its rise; first men sin against the light of conscience, and so proceed gradually to the despighting the Spirit of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Repentance, Useful for These Times</cite>, (London: Printed by R.W. for Thomas Parkhurst, 1668), pp. 77-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

<blockquote><p>XXII. Nor does the law contain any implicit condition of repentance, as if the meaning of its penalties were this: “Whoever breaks the law shall die—unless he repents.” For if that were the case, then by repenting, the sinner would have satisfied the law and could demand acquittal not as grace, but as right, and the judge would be bound by law to justify him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joshua-placeus.html">Joshua Placeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on the Justification of Man before God’</cite>, (1634), p. 5</span></figcaption>

</figure><figure class="quote" id="q-f168bae878" data-kw="">
<blockquote><p>[Arminian Error:] 7. That man’s conversion is properly nothing but the act of believing the promise of grace. This restraint of our conversion unto so narrow a compass as first to bring it from the habit [inward power] of faith to the act of believing, and then to appropriate it to that act without so much as once mentioning any other graces: this narrow conceit touching our conversion is that which has filled the writings of many learned about this point with much darkness and confusion. They so speak and write of conversion as if it began in that one and only action of man’s will consenting to the promise of mercy in Christ. But this is without all ground. To convert is not only to believe, but to repent, to love God and our neighbor, to abstain from every evil way, to practice all duties of piety and goodness: these acts are as proper and immediate parts of true conversion, as faith. Nor does the Scripture so much as intimate any such limitation, as to appropriate our conversion to the act of faith: nay, tis manifest that the Scriptures when they speak of man’s turning unto God, do join repentance and other godly acts together with faith: as appears by that solemn invitation of men unto God, ‘Repent and believe the Gospel,’ so often used in the New Testament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith</cite>, … (London: 1627), p. 135</span></figcaption>

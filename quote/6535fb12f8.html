<main class="wrap"><figure class="quote" id="q-6535fb12f8" data-kw="">
<blockquote><p>XI. Mary is rightly called the Mother of God (theotokos) in the concrete and specifically because she brought forth him who is also God, but not in the abstract and reduplicatively as God. Although this is not expressly stated in the Scriptures, still it is sufficiently intimated when she is called the mother of the Lord (Lk. 1:43) and the mother of Immanuel. If the blessed virgin brought nothing to the person of the Logos (Logou) absolutely considered, still she can be said to have brought something to the person of the incarnate Logos (Logou) economically considered, inasmuch as she gave the human nature which he took into the unity of person.

XII. The title Mother of God given to the virgin was perverted by superstitious men into an occasion of idolatry, as Paul Sarpi observes. “Because the impiety of Nestorius divided Christ, constituting two sons and denying that he, who was born of the virgin Mary, is God; the church, in order to implant the catholic truth in the minds of believers, decided that the words, Mary, the Mother of God (Maria theotokos), should be more frequently inculcated in the churches of the East as well as of the West. This, instituted indeed solely for the honor of Christ, by degrees began to be shared with the mother and at length was referred entirely to her alone” (History of the Council of Trent 2 [1620], p. 181). Although, I say, this most gross error either arose from or was increased by this occasion, it derogates nothing from the truth because the abuse and error of the papists ought not to take away the lawful use of this name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 2 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 13.7.11–12 (p. 320).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e12a8af594" data-kw="">
<blockquote><p>For this reason, too, Scripture does not quibble or speak about the virginity of Mary after the birth of Christ, a matter about which the hypocrites are greatly concerned, as if it were something of the utmost importance on which our whole salvation depended. Actually, we should be satisfied simply to hold that she remained a virgin after the birth of Christ because Scripture does not state or indicate that she later lost her virginity. We certainly need not be so terribly afraid that someone will demonstrate, out of his own head apart from Scripture, that she did not remain a virgin. But the Scripture stops with this, that she was a virgin before and at the birth of Christ; for up to this point God had need of her virginity in order to give us the promised blessed seed without sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, LW, 45:205-206</span></figcaption>

</figure><figure class="quote" id="q-5466316c74" data-kw="">
<blockquote><p>Mary’s virginity did not flow from a vow, whether on the parents’ part or on her own. With many other fairy tales contrary to the practice of the gens and the nature of wedlock she entered upon, this is a fiction of the Papists, using Lk. 1:34 (‘How shall this be, seeing I know not a man?’) for empty weaving of words, which, whether we translate them in the past with a frequent change of tense, or in the present or even, with reference to Isaiah’s prophecy, in the future, establish not a prayer but only a particular fact. Nor does Christian faith demand that Mary’s virginity be extended perpetually beyond the nativity of Jesus, as the Papists will again have it on the pretext of a vow and the of the excellency of virginity and of the passage Eze. 44:2 dealt with allegorically with this in view… But so far we agree with them against the Helvidians and the Antidico-Marianites, that we believe it more probable that Joseph abstained from conjugal contact with Mary even after the nativity of Jesus, because he sensed a gracious miracle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-marck.html">Johannes Marckius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium Theologiae Christianae</cite>, … (Groningen, 1690), XVIII, section 11 as quoted by Heinrich Heppe, Reformed Dogmatics ed. Ernst Bizer (1950; Wipf &amp; Stock, 2007), ch. 17, section 10, pp. 422-23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

y%E2%80%99s%20virginity%20did%20not%20flow%20from,because%20he%20sensed%20a%20gracious%20miracle&amp;text=Mary%E2%80%99s%20virginity%20did%20not%20flow%20from%20a%20vow&amp;text=of%20Jesus%2C%20because%20he%20sensed%20a%20gracious%20miracle" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ac5e5d5d16" data-kw="">
<blockquote><p>But are there no far off truths at all to be tolerated? Do not learned men give diverse and contrary expositions of one and the same text of Scripture? And has not the Church suffered errors and erroneous opinions in godly, learned men in all ages, even in Tertullian, Augustine and others? and have not implored the sword of the magistrate against them, though all errors printed and preached hurt the souls of others more or less. [Rutherford’s] Answer: … 2. For diverse expositions of one and the same text, as that, ‘we look for new heavens and new earth,’ when neither of the expositions so far as is revealed to the godly and learned, who in this life do but know and prophesy in part, do neither hurt the foundation, nor cross any clear truth that is non-fundamental: we think the opinions of both may be tolerated, even though the one of them be in itself an error, and that upon the ground that Church and magistrates both are to tolerate, not to punish these infirmities, against both Tables, that are the necessary results of sin-original, common to all men as men bearing about with them a body of sin. And the like I say of other the like opinions about matters of religion, and especially matters of fact [whether it ocurred or not], as the virginity of Mary for all her life.</p></blockquote>

<blockquote><p>This saying of Christ openly and manifestly warns men to beware lest, by too superstitiously elevating the honor of the name of mother in the Virgin Mary, they transfer to her what belongs exclusively to God. … For Mary has been constituted the Queen of Heaven, the Hope, the Life, and the Salvation of the world; and, in short, their fury and madness proceeded so far that they stripped Christ of his spoils, and left him almost naked.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on John</cite>, John 2:4</span></figcaption>

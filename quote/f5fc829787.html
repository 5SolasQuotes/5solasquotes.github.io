<main class="wrap"><figure class="quote" id="q-f5fc829787" data-kw="">
<blockquote><p>The precept of the Sabbath observance is moral in one respect, insofar as it commands man to give some time to the things of God, according to Ps. 45:11: ‘Be still and see that I am God.’ In this respect it is placed among the precepts of the decalogue: but not as to the fixing of the time, in which respect it is a ceremonial precept.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, of 2, quest. 100, article 3, reply to Objection 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

<blockquote><p>3 Q. Of how many hours does the Sabbath day consist? A. Of four and twenty. Gen. 2:3 The Sabbath is called the seventh day: so as it is a seventh part of the week: therefore so many hours as make up every of the other days (which are four and twenty) must be accounted to this day. 4 Q. Are all those hours to be sanctified? A. Yes. Exod. 20:11 The Lord rested the whole seventh day: and all the time wherein He rested He sanctified. Gen. 2:2,3 5 Q. How can all that time be sanctified? A. 1. By observing things commanded. Jer. 17:22 2. By observing things permitted. Exod. 12:16.</p></blockquote>

<blockquote><p>164th Session on May 17, 1619:

1. There is in the fourth commandment of the divine law a ceremonial and a moral element.

2. The ceremonial element is the rest of the seventh day after creation, and the strict observance of that day imposed especially on the Jewish people.

3. The moral element consists in the fact that a certain definite day is set aside for worship and so much rest as is needful for worship and hallowed meditation.

4. The Sabbath of the Jews having been abolished, the day of the Lord must be solemnly hallowed by Christians.

5. Since the times of the apostles this day has always been observed by the old catholic church.

6. This day must be so consecrated to worship that on that day we rest from all servile works, except those which charity and present necessity require; and also from all such recreations as interfere with worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Synod of Dort</cite>, 164th Session, May 17, 1619, as cited in Howard B. Spaan, Christian Reformed Church</span></figcaption>

</figure><figure class="quote" id="q-129532c924" data-kw="">
<blockquote><p>‘Such things’ (says Aaron) ‘have befallen me, and if I had eaten the sin-offering to day, should it have been good in the eyes of the Lord?’ [Lev. 10:19] In these words Aaron excuses himself, by reason of his sorrow, which made him unfit and unworthy to eat of those holy things. Dt. 12:7 &amp; 26:14; Hos. 9:4. The [Romanist] Douay divines, somewhat to the same purpose: ‘Natural grief of mind made Aaron both unwilling to eat, and less apt to complete all the ceremonies: so without sin he omitted that pertained to his own commodity, offering it unto God.’ The Geneva notes, ‘Moses bare with his infirmity, considering his great sorrow, but does not leave an example to forgive them that maliciously transgress the commandment of God.’… The conclusions from this text of Scripture may be such as these, that oftentimes the letter of the Law gives place to great necessities…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Two Treatises of Mr. John Can, the Leader of the English Brownists in Amsterdam</cite>, … (London: R.B., 1642), ch. 1, section 4, p. 52</span></figcaption>

<main class="wrap"><figure class="quote" id="q-7810b67d81" data-kw="">
<blockquote><p>But far be it from me to argue with Bellarmme (de poenit. bk. 3, ch. 2) from Uzziah’s bodily leprosy to infer that any prince who is spiritually leprous and turned heretical, is presently to be dethroned. Nothing can dethrone a king but such tyranny as is inconsistent with his royal office. Nor durst I infer that kings, now a-days, may be removed from actual government for one single transgression. It is true, eighty priests, and the whole kingdom, so serving king Uzziah (their motives, I know, were divine) proves well that the subjects may punish the transgression of God’s express law in the king, in some cases even to remove him from the throne;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843) | Question 44, pp. 231-32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f5a59ae39d" data-kw="">
<blockquote><p>…Lewis Du Moulin… a son of the famous Molinaeus, who took so active a part in the Arminian controversy, and was long the leading divine in the Protestant Church of France. Lewis settled in England, and obtained a chair in Oxford during the Commonwealth. He adopted Independent, or Congregational, views on church government, chiefly, it would appear, because he thought them more favorable to Erastianism than Presbyterian principles, a notion for which he could plead the authority of Congregational divines of the highest eminence–namely, the five dissenting brethren, as they were called, in the Westminster Assembly. They, in their Apologetical Narration, had asserted that they gave as much, or, as they thought, more, power to the civil magistrate in religious matters than the principles of Presbyterians would allow them to do, a declaration which, whether it be regarded as made honestly or hypocritically, has been very galling to those who have succeeded them in the maintenance of Congregational principles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>HT</cite></span></figcaption>

</figure><figure class="quote" id="q-95271cf080" data-kw="">
<blockquote><p>6. The object of the king’s power is not simply a peaceable life, and external peace of human societies, but also honesty and godliness, but to be procured by a civil, politic, regal and coactive way, by the sword of the secular arm, as the object of the Church power is honesty and godliness to be procured by a ministerial, ecclesiastical, and spiritual power, without any forcing of men by external power.</p></blockquote>

</figure><figure class="quote" id="q-4c6c3ea50e" data-kw="">
<blockquote><p>XII. The [House of] representatives… shall each of them… before he takes his seat, shall make and subscribe the following declaration, viz. You do believe in one God, the Creator and Governor of the Universe, the rewarder of the good, and punisher of the wicked. And you do acknowledge the scriptures of the Old and New Testament to be given by divine inspiration; and own and profess the Protestant religion. … XXXVIII. …And all religious societies, or bodies of men, that may be hereafter united or incorporated, for the advancement of religion and learning, or for other pious and charitable purposes, shall be encouraged and protected in the enjoyment of the privileges, immunities and estates, which they in justice ought to enjoy, under such regulations as the General Assembly of this State shall direct.</p></blockquote>

</figure><figure class="quote" id="q-5fd50f4490" data-kw="">
<blockquote><p>But how does this oath, or the act of parliament requiring ministers to take this oath, make ministers dependent on the magistrate in the exercise of their ministry, when the oath only contains the duty of a subject, and speaks nothing either of the ministry or exercise of the ministry? ‘Yea, but the act enjoining it, makes it an essential requisite to a minister of this national Church.’ Answer: There is no such metaphysical term in the act as essential, but only that ministers of this national Church shall take it. The Church is considered not simply as a Church, but as national, having national and legal privileges, which they are deprived of that refuse this oath. It does not say he shall not be a minister if he take it not, but he shall not have the countenance and protection of civil authority, he shall not enjoy his benefice, shall not have allowance form the magistrate for, and encouragement in the exercise of his ministry. He shall not enjoy the peaceable public exercise of his ministry. And what wonder that the magistrate will not countenance them as ministers who will not bind themselves to him as subjects? that he will not let them preach to his subjects if he can hinder them, who will not promise and swear when required that they will not preach treason and rebellion against him, when they should teach them subjection and obedience to Christ? that he will not let them teach others what they call their duty to God who will not do their duty to their sovereign, but separate these things which God has conjoined, ‘Fear God, honor the king’? See more of this in the Seasonable Admonition and Exhortation of the Commission of the General Assembly, anno 1698, which you have neither obeyed neither yet given a reason of your disobedience; and in a Treatise against Separation, by Mr. Alexander Shields, one of your teachers, to whom you became his enemy, because he told you the truth… …But [the magistrate] shows by this act whom he will countenance and protect in the exercise of the ministry, to whom he will give or allow the stipends and legal maintenance to encourage them in the exercise of the ministry, whom he will suffer to pass and repass, and exercise their ministry without hazard or molestation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gavin-hamilton.html">Gavin Hamilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Just Reflections upon a Pamphlet entitled, A Modest Reply to a Letter from a Friend to Mr. John M’millan</cite>, ([Edinburgh] 1712) Hamilton was a Church of Scotland minister., p. 35</span></figcaption>

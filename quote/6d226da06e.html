<blockquote><p>In Book 3, Distinction 14, of the Sentences, after discussing the wisdom with which the soul of Christ was endowed, namely, the wisdom that granted the soul of Christ to see all things in the Word [the theology of union] and thus, in a sense, to be all-knowing, he [Lombard] raises the question of power: Whether it can be said that the soul is omnipotent, just as it was said about omniscience. He responds that it cannot be simply said, and he proves this by effect, for Christ indeed knows how the world was created but cannot create the world. He has the knowledge of his created self but does not have the power to create or sustain himself. If you ask why God did not give Him the power to do everything as He gave Him the knowledge of all things, he answers:

1. Because He was not capable of this omnipotence as He was of omniscience. Moreover, He understands omniscience in a certain way, not simply, as explained above.

2. It was not given to Him this power by which He could do everything that God does, so that He would not be thought to be omnipotent and therefore God. From this, we understand that He can do everything so as to be omnipotent and to be God, these are αντισρεφοντα [incompatible]. However, this is not the case with seeing all things in the Word and being God. Therefore, it can be said that the soul of Christ sees all things in the Word, which the Word sees, but it cannot do everything that the Word can. He adds that perhaps God could not grant this power to the soul. He said ‘perhaps’ out of reverence for the divinity, so that it would not seem that something was being detracted from the omnipotence of God. But he does not sin if he says that God cannot do what cannot be done simply, as we explained earlier. Those things simply cannot be done which conflict with the nature of God, with His truth, and goodness. The reason is that the apostle also speaks in this way, as in 2 Timothy 2:13, ‘If we are faithless, He remains faithful— for he cannot deny himself.’ Therefore, the Master concludes that the soul of Christ is not communicated the power to do everything that God does or can do. Not only is it not given, but it could not be given… Therefore, it cannot be said that the human nature or the soul or the flesh of Christ is omnipotent, omniscient, present everywhere, but only the person, i.e., Christ himself, insofar as he is the person of man, or as a form subsisting in a servant, and he is called by the name of man, these properties are predicated. Christ, as a man, this man, or the Son of man, is omnipotent, present everywhere. This is from Peter Lombard. Among other Scholastic theologians, Thomas Aquinas explains this doctrine excellently in Summa Theologiae, Part 3, Question 13. In the first article, he poses the question of whether the soul of Christ had, or has, omnipotence namely in itself, so that it really perceives itself as being omnipotent. He responds that it does not have it. The first reason is that what is proper to God cannot be communicated (namely in reality) to creatures. Omnipotence is the proper attribute of God. Because the principle or power of acting always proceeds from the form and therefore from the nature of the agent and follows it. Indeed, every thing operates according to its form so that if the form is finite, it can only operate in a finite way, and infinite form produces infinite operations. Examples are evident. God operates by His essence, which is His form and nature, and these are immense and infinite. The heavens, elements, and all kinds of things do the same, each performing its own finite form and presenting certain operations. However, the nature in the human Christ cannot be the principle of all the actions that He performs and can perform. For Christ operates both divine and human, being both God and man, and having two forms, that of God and that of a servant. The divine operates by the form of God, and the human operates by the form of a servant, which has a limited power, acting according to the form of God, and that which is finite performs according to the form of a servant. And what else is omnipotence but the power of infinite action? Therefore, it cannot happen that the soul of Christ, in reality, has omnipotence in itself. For the natures are not changed by the hypostatic union; rather, each retains its own properties. The same is proven by induction. The soul of Christ cannot create things out of nothing or reduce them to nothing, for both belong to God alone. The soul of Christ cannot sustain itself; it is sustained by the Word, and through Him, not by creatures. Creatures are sustained by the powerful Word of Christ (Heb. 1). Likewise, the soul of Christ cannot change creatures, such as turning water into wine, as this power belongs solely to the Divine nature. This is why we read in Jn. 2 that this miracle manifested His glory. Furthermore, the soul of Christ could not change its own body and prevent it from natural actions, such as hunger, thirst, and sleep. The changes in natural actions are subject to the author of nature. However, now in heaven, Christ cannot perform such actions because His body has its actions, and He cannot create another body for Himself. Therefore, it is not omnipotent. The conclusion is that the opinion stands: Christ, who is operating and acting, with two forms, the form of God and the form of man, and since each operates through its own form, which belongs to it and not to the other, the opinion stands, I say, that Christ operates divine actions through the divine form and human actions through the human form. This is as Leo also teaches, saying: ‘Each form performs its actions.’ Since infinite power is not required for human works, only for divine ones, it follows that the omnipotence of the human form or nature is not communicated. It would be in vain to communicate it since it is not required for human actions. God does not act in vain. Yet, you might say, God acts through the form of a servant as through an organ of His deity. We grant this, but what do you conclude from it? Whether the omnipotence is communicated to the human nature? By no means. For the power of an agent residing through an organ is in the agent and is not actually communicated to the organ, even if it operates through the organ. The soul sees through the eye, but where is the power of seeing? It resides in the soul as its subject. Christ vivifies us through His flesh, but where does the power of vivifying reside? In the Deity, although it is exercised through that flesh. The Spirit is the one who vivifies, regenerates through water, but the power of regeneration does not adhere to the water as its subject; rather, it is in the Spirit of Christ. Therefore, it is the Spirit that vivifies. Hence, omnipotence, as if it were divine operations, does not reside in the soul or in the form of a servant but is to be attributed only to the form of God. Therefore, rightly, Thomas Aquinas says in Summa Theologica (Part 3, Question 13, Article 2) that the soul of Christ and the entire human nature in Christ, for divine works, did not have or have the power unless as instrumental. Concerning Matthew 28: “All power is given to me,” he responds from Jerome that the power was given to the man Christ, not to the nature, and it is said to be given due to the union by which it happened that he who was almighty God became also an almighty man, as the Master of the Sentences has already stated. Or, he who was potent only in the form of God became potent also in the form of a servant. And this power has been known to the angels from the very conception, but after the resurrection, it became known to humans. Often things are said to happen when they become known. However, he consistently denies that omnipotence is communicated to the soul of Christ in a real and proper sense, although through that soul and the entire human nature, as through an instrument, He has often exercised His omnipotence, and even now exercises it. However, power is always properly attributed to and should be attributed to the principal agent, not to the instrument. So, what power has the soul of Christ obtained from the hypostatic union with the Word? The greatest power of all creatures, surpassing even the power of all joined creatures by far and infinitely greater than them in countless ways, but still finite. Power was given to the intellect so that it could see God, the Logos, and in Him all things, as explained above. But it illuminates the created and therefore finite, not to mention the infused and natural wisdom, about which it has been said before, which are all created and finite. Power was given to the memory so that it could forget nothing but have everything in present memory. Yet, this gift is finite. Power was given to the will so that it could love God with the whole heart and the neighbor as itself, indeed more than itself, but with what kind of love? Indeed, it is the greatest, but still finite. It was given to Him so that He could perfectly fulfill the entire law, but the obedience of the soul is finite. Finally, it was given to Him so that whatever He wished to accomplish, He could do it either by Himself or through His own Deity. For that blessed soul desired certain things to be fulfilled by itself, and other things, it willed to be accomplished through divinity, and both kinds of volition are fulfilled and continue to be fulfilled daily. Regarding the first point, He did not will anything to be perfectly fulfilled that He could not fulfill. His will was so wise, just, and right that He did not will anything that He knew should not or could not be done by Himself. Augustine’s saying in the book “De Quæstionibus Veteris et Novi Testamenti” applies here: “It is impossible that the will of the Savior not be fulfilled; nor can He will what He knows should not be done.” Isn’t this a maxim of power? Regarding the second point, He did not will infinite things to be done through the soul, perhaps as through an instrument, but only through the Deity to which He was united. Therefore, that soul willed and wills to be fulfilled through that alone by which alone things can be fulfilled and perfected, as seen in the resurrection of the dead and the forgiveness of sins. Hence, it is clear that power was given to the soul of Christ, enabling Him to fulfill what He willed. How great is this power? It has the nature of omnipotence, to the extent that He is called omnipotent, namely, the one who does what He wills and does not will what He does not do. This concludes the discussion on the power given to the soul of Christ. Thus far, both in general and in particular, I consider the other thesis of ours, posed in Question XI, to be sufficiently confirmed: that all innumerable and great goods and gifts that can be conferred upon a created substance were communicated to the human nature of Christ. However, all its natural properties always remained intact and secure.</p></blockquote>

hat+it+would+not+seem+that+something+was+being+detracted+from+the+omnipotence+of+God.+But+he+does+not+sin+if+he+says+that+God+cannot+do+what+cannot+be+done+simply%2C+as+we+explained+earlier.+Those+things+simply+cannot+be+done+which+conflict+with+the+nature+of+God%2C+with+His+truth%2C+and+goodness.+The+reason+is+that+the+apostle+also+speaks+in+this+way%2C+as+in+2+Timothy+2%3A13%2C+%E2%80%98If+we+are+faithless%2C+He+remains+faithful%E2%80%94+for+he+cannot+deny+himself.%E2%80%99+Therefore%2C+the+Master+concludes+that+the+soul+of+Christ+is+not+communicated+the+power+to+do+everything+that+God+does+or+can+do.+Not+only+is+it+not+given%2C+but+it+could+not+be+given%E2%80%A6+Therefore%2C+it+cannot+be+said+that+the+human+nature+or+the+soul+or+the+flesh+of+Christ+is+omnipotent%2C+omniscient%2C+present+everywhere%2C+but+only+the+person%2C+i.e.%2C+Christ+himself%2C+insofar+as+he+is+the+person+of+man%2C+or+as+a+form+subsisting+in+a+servant%2C+and+he+is+called+by+the+name+of+man%2C+these+properties+are+predicated.+Christ%2C+as+a+man%2C+this+man%2C+or+the+Son+of+man%2C+is+omnipotent%2C+present+everywhere.+This+is+from+Peter+Lombard.+Among+other+Scholastic+theologians%2C+Thomas+Aquinas+explains+this+doctrine+excellently+in+Summa+Theologiae%2C+Part+3%2C+Question+13.+In+the+first+article%2C+he+poses+the+question+of+whether+the+soul+of+Christ+had%2C+or+has%2C+omnipotence+namely+in+itself%2C+so+that+it+really+perceives+itself+as+being+omnipotent.+He+responds+that+it+does+not+have+it.+The+first+reason+is+that+what+is+proper+to+God+cannot+be+communicated+%28namely+in+reality%29+to+creatures.+Omnipotence+is+the+proper+attribute+of+God.+Because+the+principle+or+power+of+acting+always+proceeds+from+the+form+and+therefore+from+the+nature+of+the+agent+and+follows+it.+Indeed%2C+every+thing+operates+according+to+its+form+so+that+if+the+form+is+finite%2C+it+can+only+operate+in+a+finite+way%2C+and+infinite+form+produces+infinite+operations.+Examples+are+evident.+God+operates+by+His+essence%2C+which+is+His+form+and+nature%2C+and+these+are+immense+and+infinite.+The+heavens%2C+elements%2C+and+all+kinds+of+things+do+the+same%2C+each+performing+its+own+finite+form+and+presenting+certain+operations.+However%2C+the+nature+in+the+human+Christ+cannot+be+the+principle+of+all+the+actions+that+He+performs+and+can+perform.+For+Christ+operates+both+divine+and+human%2C+being+both+God+and+man%2C+and+having+two+forms%2C+that+of+God+and+that+of+a+servant.+The+divine+operates+by+the+form+of+God%2C+and+the+human+operates+by+the+form+of+a+servant%2C+which+has+a+limited+power%2C+acting+according+to+the+form+of+God%2C+and+that+which+is+finite+performs+according+to+the+form+of+a+servant.+And+what+else+is+omnipotence+but+the+power+of+infinite+action%3F+Therefore%2C+it+cannot+happen+that+the+soul+of+Christ%2C+in+reality%2C+has+omnipotence+in+itself.+For+the+natures+are+not+changed+by+the+hypostatic+union%3B+rather%2C+each+retains+its+own+properties.+The+same+is+proven+by+induction.+The+soul+of+Christ+cannot+create+things+out+of+nothing+or+reduce+them+to+nothing%2C+for+both+belong+to+God+alone.+The+soul+of+Christ+cannot+sustain+itself%3B+it+is+sustained+by+the+Word%2C+and+through+Him%2C+not+by+creatures.+Creatures+are+sustained+by+the+powerful+Word+of+Christ+%28Heb.+1%29.+Likewise%2C+the+soul+of+Christ+cannot+change+creatures%2C+such+as+turning+water+into+wine%2C+as+this+power+belongs+solely+to+the+Divine+nature.+This+is+why+we+read+in+Jn.+2+that+this+miracle+manifested+His+glory.+Furthermore%2C+the+soul+of+Christ+could+not+change+its+own+body+and+prevent+it+from+natural+actions%2C+such+as+hunger%2C+thirst%2C+and+sleep.+The+changes+in+natural+actions+are+subject+to+the+author+of+nature.+However%2C+now+in+heaven%2C+Christ+cannot+perform+such+actions+because+His+body+has+its+actions%2C+and+He+cannot+create+another+body+for+Himself.+Therefore%2C+it+is+not+omnipotent.+The+conclusion+is+that+the+opinion+stands%3A+Christ%2C+who+is+operating+and+acting%2C+with+two+forms%2C+the+form+of+God+and+the+form+of+man%2C+and+since+each+operates+through+its+own+form%2C+which+belongs+to+it+and+not+to+the+other%2C+the+opinion+stands%2C+I+say%2C+that+Christ+operates+divine+actions+through+the+divine+form+and+human+actions+through+the+human+form.+This+is+as+Leo+also+teaches%2C+saying%3A+%E2%80%98Each+form+performs+its+actions.%E2%80%99+Since+infinite+power+is+not+required+for+human+works%2C+only+for+divine+ones%2C+it+follows+that+the+omnipotence+of+the+human+form+or+nature+is+not+communicated.+It+would+be+in+vain+to+communicate+it+since+it+is+not+required+for+human+actions.+God+does+not+act+in+vain.+Yet%2C+you+might+say%2C+God+acts+through+the+form+of+a+servant+as+through+an+organ+of+His+deity.+We+grant+this%2C+but+what+do+you+conclude+from+it%3F+Whether+the+omnipotence+is+communicated+to+the+human+nature%3F+By+no+means.+For+the+power+of+an+agent+residing+through+an+organ+is+in+the+agent+and+is+not+actually+communicated+to+the+organ%2C+even+if+it+operates+through+the+organ.+The+soul+sees+through+the+eye%2C+but+where+is+the+power+of+seeing%3F+It+resides+in+the+soul+as+its+subject.+Christ+vivifies+us+through+His+flesh%2C+but+where+does+the+power+of+vivifying+reside%3F+In+the+Deity%2C+although+it+is+exercised+through+that+flesh.+The+Spirit+is+the+one+who+vivifies%2C+regenerates+through+water%2C+but+the+power+of+regeneration+does+not+adhere+to+the+water+as+its+subject%3B+rather%2C+it+is+in+the+Spirit+of+Christ.+Therefore%2C+it+is+the+Spirit+that+vivifies.+Hence%2C+omnipotence%2C+as+if+it+were+divine+operations%2C+does+not+reside+in+the+soul+or+in+the+form+of+a+servant+but+is+to+be+attributed+only+to+the+form+of+God.+Therefore%2C+rightly%2C+Thomas+Aquinas+says+in+Summa+Theologica+%28Part+3%2C+Question+13%2C+Article+2%29+that+the+soul+of+Christ+and+the+entire+human+nature+in+Christ%2C+for+divine+works%2C+did+not+have+or+have+the+power+unless+as+instrumental.+Concerning+Matthew+28%3A+%E2%80%9CAll+power+is+given+to+me%2C%E2%80%9D+he+responds+from+Jerome+that+the+power+was+given+to+the+man+Christ%2C+not+to+the+nature%2C+and+it+is+said+to+be+given+due+to+the+union+by+which+it+happened+that+he+who+was+almighty+God+became+also+an+almighty+man%2C+as+the+Master+of+the+Sentences+has+already+stated.+Or%2C+he+who+was+potent+only+in+the+form+of+God+became+potent+also+in+the+form+of+a+servant.+And+this+power+has+been+known+to+the+angels+from+the+very+conception%2C+but+after+the+resurrection%2C+it+became+known+to+humans.+Often+things+are+said+to+happen+when+they+become+known.+However%2C+he+consistently+denies+that+omnipotence+is+communicated+to+the+soul+of+Christ+in+a+real+and+proper+sense%2C+although+through+that+soul+and+the+entire+human+nature%2C+as+through+an+instrument%2C+He+has+often+exercised+His+omnipotence%2C+and+even+now+exercises+it.+However%2C+power+is+always+properly+attributed+to+and+should+be+attributed+to+the+principal+agent%2C+not+to+the+instrument.+So%2C+what+power+has+the+soul+of+Christ+obtained+from+the+hypostatic+union+with+the+Word%3F+The+greatest+power+of+all+creatures%2C+surpassing+even+the+power+of+all+joined+creatures+by+far+and+infinitely+greater+than+them+in+countless+ways%2C+but+still+finite.+Power+was+given+to+the+intellect+so+that+it+could+see+God%2C+the+Logos%2C+and+in+Him+all+things%2C+as+explained+above.+But+it+illuminates+the+created+and+therefore+finite%2C+not+to+mention+the+infused+and+natural+wisdom%2C+about+which+it+has+been+said+before%2C+which+are+all+created+and+finite.+Power+was+given+to+the+memory+so+that+it+could+forget+nothing+but+have+everything+in+present+memory.+Yet%2C+this+gift+is+finite.+Power+was+given+to+the+will+so+that+it+could+love+God+with+the+whole+heart+and+the+neighbor+as+itself%2C+indeed+more+than+itself%2C+but+with+what+kind+of+love%3F+Indeed%2C+it+is+the+greatest%2C+but+still+finite.+It+was+given+to+Him+so+that+He+could+perfectly+fulfill+the+entire+law%2C+but+the+obedience+of+the+soul+is+finite.+Finally%2C+it+was+given+to+Him+so+that+whatever+He+wished+to+accomplish%2C+He+could+do+it+either+by+Himself+or+through+His+own+Deity.+For+that+blessed+soul+desired+certain+things+to+be+fulfilled+by+itself%2C+and+other+things%2C+it+willed+to+be+accomplished+through+divinity%2C+and+both+kinds+of+volition+are+fulfilled+and+continue+to+be+fulfilled+daily.+Regarding+the+first+point%2C+He+did+not+will+anything+to+be+perfectly+fulfilled+that+He+could+not+fulfill.+His+will+was+so+wise%2C+just%2C+and+right+that+He+did+not+will+anything+that+He+knew+should+not+or+could+not+be+done+by+Himself.+Augustine%E2%80%99s+saying+in+the+book+%E2%80%9CDe+Qu%C3%A6stionibus+Veteris+et+Novi+Testamenti%E2%80%9D+applies+here%3A+%E2%80%9CIt+is+impossible+that+the+will+of+the+Savior+not+be+fulfilled%3B+nor+can+He+will+what+He+knows+should+not+be+done.%E2%80%9D+Isn%E2%80%99t+this+a+maxim+of+power%3F+Regarding+the+second+point%2C+He+did+not+will+infinite+things+to+be+done+through+the+soul%2C+perhaps+as+through+an+instrument%2C+but+only+through+the+Deity+to+which+He+was+united.+Therefore%2C+that+soul+willed+and+wills+to+be+fulfilled+through+that+alone+by+which+alone+things+can+be+fulfilled+and+perfected%2C+as+seen+in+the+resurrection+of+the+dead+and+the+forgiveness+of+sins.+Hence%2C+it+is+clear+that+power+was+given+to+the+soul+of+Christ%2C+enabling+Him+to+fulfill+what+He+willed.+How+great+is+this+power%3F+It+has+the+nature+of+omnipotence%2C+to+the+extent+that+He+is+called+omnipotent%2C+namely%2C+the+one+who+does+what+He+wills+and+does+not+will+what+He+does+not+do.+This+concludes+the+discussion+on+the+power+given+to+the+soul+of+Christ.+Thus+far%2C+both+in+general+and+in+particular%2C+I+consider+the+other+thesis+of+ours%2C+posed+in+Question+XI%2C+to+be+sufficiently+confirmed%3A+that+all+innumerable+and+great+goods+and+gifts+that+can+be+conferred+upon+a+created+substance+were+communicated+to+the+human+nature+of+Christ.+However%2C+all+its+natural+properties+always+remained+intact+and+secure.%E2%80%9D%0A%0A%E2%80%94+Jerome+Zanchi%2C+Other+citations+%28work+not+named%29%2C+On+the+Incarnation+of+the+Son+of+God+tr.+by+AI+by+Matt+Hedges+%28Heidelberg%2C+1593%29%2C+%E2%80%98About+the+power+obtained+through+the+union+in+the+human+nature+of+Christ%E2%80%99%2C+pp.+385-92+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6d226da06e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6d226da06e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/christ/the-human-and-divine-natures-of-christ/on-the-two-operations-energies-of-the-mediator-divine-human-unto-the-same-effect-apotelesma/#:~:text=In%20Book%203%2C%20Distinction%2014%2C%20of,properties%20always%20remained%20intact%20and%20secure&amp;text=In%20Book%203%2C%20Distinction%2014%2C%20of%20the%20Sentences&amp;text=its%20natural%20properties%20always%20remained%20intact%20and%20secure" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>33. His office is rightly conceived as threefold: Prophetic, Priestly, and Royal, since salvation had to be announced to the sinner, and merited, and applied.

34. The instrument of pre-announcement indeed was the word of the Law, yet of announcement only the word of the Gospel.

35. The rule [ratio] of merit is to be sought in the entire obedience of Christ exhibiting full satisfaction both in order to the commandment of the law and in order to the penal sanction adjoined to it.

36. The instrument of application is faith, not theoretical but practical, nor an act of the mind only but also of the heart, and that not superficial but radical.

37. But this faith is regarded in application neither habitually or qualitatively, but only relatively and organically, whence the benefit of justification is promiscuously ascribed, sometimes to the instrument, sometimes to the object apprehended through the instrument, in identical sense.

38. The instruments of producing this faith are the word and Sacraments, not by reason of inherent virtue, but by reason of adhering blessing, and that from God’s ordination. Whence both the use of the Word and Sacraments is to be employed, yet to be circumscribed, and neither is to be attributed to the instruments what belongs to Him who acts through instruments, nor is God to be bound to them, but man only, nor is the same latitude to be judged of our duty and of grace.

39. The efficient cause of this faith is God’s Spirit, who through internal calling produces its act, through sanctification its habit, and through this omnimodo-sanctity according to parts, although not according to degrees, both as to the repurgation of faculties corrupted through sin and as to the convenient subordination of them inverted through sin.

40. The end of this sanctification, but the effect of justification, is glorification, consisting both in perfect vision of God and in perfect fruition of God seen, which is the sum of our hopes, the compendium of our vows, and the goal and complement of glory.</p></blockquote>

35. The rule [ratio] of merit is to be sought in the entire obedience of Christ exhibiting full satisfaction both in order to the commandment of the law and in order to the penal sanction adjoined to it.

36. The instrument of application is faith, not theoretical but practical, nor an act of the mind only but also of the heart, and that not superficial but radical.

37. But this faith is regarded in application neither habitually or qualitatively, but only relatively and organically, whence the benefit of justification is promiscuously ascribed, sometimes to the instrument, sometimes to the object apprehended through the instrument, in identical sense.

38. The instruments of producing this faith are the word and Sacraments, not by reason of inherent virtue, but by reason of adhering blessing, and that from God’s ordination. Whence both the use of the Word and Sacraments is to be employed, yet to be circumscribed, and neither is to be attributed to the instruments what belongs to Him who acts through instruments, nor is God to be bound to them, but man only, nor is the same latitude to be judged of our duty and of grace.

39. The efficient cause of this faith is God’s Spirit, who through internal calling produces its act, through sanctification its habit, and through this omnimodo-sanctity according to parts, although not according to degrees, both as to the repurgation of faculties corrupted through sin and as to the convenient subordination of them inverted through sin.

40. The end of this sanctification, but the effect of justification, is glorification, consisting both in perfect vision of God and in perfect fruition of God seen, which is the sum of our hopes, the compendium of our vows, and the goal and complement of glory.”

— Friedrich Spanheim, ‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima, (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C33.+His+office+is+rightly+conceived+as+threefold%3A+Prophetic%2C+Priestly%2C+and+Royal%2C+since+salvation+had+to+be+announced+to+the+sinner%2C+and+merited%2C+and+applied.+34.+The+instrument+of+pre-announcement+indeed+was+the+word+of+the+Law%2C+yet+of+announcement+only+the+word+of+the+Gospel.+35.+The+rule+%5Bratio%5D+of+merit+is+to+be+sought+in+the+entire+obedience+of+Christ+exhibiting+full+satisfaction+both+in+order+to+the+commandment+of+the+law+and+in+order+to+the+penal+sanction+adjoined+to+it.+36.+The+instrument+of+application+is+faith%2C+not+theoretical+but+practical%2C+nor+an+act+of+the+mind+only+but+also+of+the+heart%2C+and+that+not+superficial+but+radical.+37.+But+this+faith+is+regarded+in+application+neither+habitually+or+qualitatively%2C+but+only+relatively+and+organically%2C+whence+the+benefit+of+justification+is+promiscuously+ascribed%2C+sometimes+to+the+instrument%2C+sometimes+to+the+object+apprehended+through+the+instrument%2C+in+identical+sense.+38.+The+instruments+of+producing+this+faith+are+the+word+and+Sacraments%2C+not+by+reason+of+inherent+virtue%2C+but+by+reason+of+adhering+blessing%2C+and+that+from+God%E2%80%99s+ordination.+Whence+both+the+use+of+the+Word+and+Sacraments+is+to+be+employed%2C+yet+to+be+circumscribed%2C+and+neither+is+to+be+attributed+to+the+instruments+what+belongs+to+Him+who+acts+through+instruments%2C+nor+is+God+to+be+bound+to+them%2C+but+man+only%2C+nor+is+the+same+latitude+to+be+judged+of+our+duty+and+of+grace.+39.+The+efficient+cause+of+this+faith+is+God%E2%80%99s+Spirit%2C+who+through+internal+calling+produces+its+act%2C+through+sanctification+its+habit%2C+and+through+this+omnimodo-sanctity+according+to+parts%2C+although+not+according+to+degrees%2C+both+as+to+the+repurgation+of+faculties+corrupted+through+sin+and+as+to+the+convenient+subordination+of+them+inverted+through+sin.+40.+The+end+of+this+sanctification%2C+but+the+effect+of+justification%2C+is+glorification%2C+consisting+both+in+perfect+vision+of+God+and+in+perfect+fruition+of+God+seen%2C+which+is+the+sum+of+our+hopes%2C+the+compendium+of+our+vows%2C+and+the+goal+and+complement+of+glory.%E2%80%9D%0A%0A%E2%80%94+Friedrich+Spanheim%2C+%E2%80%98Miscellaneous+Theological+Disputation+exhibiting+a+Theological+Compendium%E2%80%99+in+Disputationum+Theologicarum+Miscellaneorum+Pars+Prima%2C+%28d.+1649%3B+Geneva%3A+Chou%C3%ABt%2C+1652%29%2C+trans.+AI+by+Roman+Prestarri+at+Confessionally+Reformed+Theology+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3fb5d4add4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3fb5d4add4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/christ/the-offices-of-christ#:~:text=33.%20His%20office%20is%20rightly%20conceived,the%20goal%20and%20complement%20of%20glory&amp;text=33.%20His%20office%20is%20rightly%20conceived%20as%20threefold&amp;text=vows%2C%20and%20the%20goal%20and%20complement%20of%20glory" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>V. Our sponsor (as stated) is Christ Jesus, the only-begotten Son of God and himself God blessed forever, according to both natures. The principle which [acts] is indeed his person; the principle by which [he acts] is his nature, both human and divine. Hence there was entirely a communion in the work, but a distinction of power and mode in the operating natures. The passion formally belonged to the human nature; its power and value flowed from the divine. Christ our Lord freely, willingly and lawfully undertook this sponsorship (Ps 40:8, Heb 10:9), for he was Lord of his life and had the power of laying it down (John 10:18). It was also of his dignity, that he was most apt for satisfying the rigor of justice.</p></blockquote>

<blockquote><p>Those things, and Persons which Heathen Kings, Magistrates, Nations and Idolaters themselves, by the very light of nature, thought fit to punish with corporal and capital punishments; all Christian Kings, Magistrates, Nations, ought much more to censure in this kind.

But Heathen Kings, Magistrates, Nations, and Idolaters themselves, by the very light of nature, have thought fit to punish with corporal and capital punishments, such as adored not those Idol-gods which they worshipped and reputed for the true; and such as they deemed Idolaters, Apostates, Heretics, Schismatics, Blasphemers, and open Rebels against God.

Therefore Christian Kings, Magistrates, Nations under the Gospel, ought much more to do it.

The Major is evident by its own light, and ratified by ROM. 2. 14, 15. The Minor I shall make good by Scripture testimonies. I shall begin with King Artaxerxes his Commission to Ezra, c: 7. 15; 26. And thou Ezra after the wisdom of thy God, that is in thine hand, set Magistrates and Judges which may judge all the people which are beyond the river; all such as know the Law of thy God: And whosoever WILL NOT DO THE LAW OF THY GOD, and the law of the King, let judgement be executed speedily upon him, WHETHER IT BE TO DEATH, OR TO BANISHMENT, OR TO CONFISCATION OF GOODS, OR TO IMPRISONMENT.

Shall a mere Heathen King be so zealous as to enjoin the Judges and Magistrates under him, to inflict these corporal and capital censures upon such as will not do the Law of God; in which number all Idolaters, Apostates, Heretics, Blasphemers, &amp;c. are included; and shall not Christian Princes, Magistrates, Judges much more exceed him in their zeal and justice against such transgressors of Gods Law?

But that Decree of Nebuchadnezzar against blasphemers of God, is more emphatical, and pathetical: DAN. 3. 28, 29. Then Nebuchadnezzar spake and said, blessed be the Lord God of Shadrach, Mesach, and Abednego, who hath sent his Angel and delivered his servants that trusted in him &amp;c. Therefore I make a Decree, that every people, nation, and language WHICH SPEAK ANY ERROR (or any thing amiss) AGAINST THE GOD of Shadrach, Meshach, and Abednego, SHALL BE CUT IN PIECES, and THEIR HOUSES SHALL BE MADE A DUNGHILL, because there is no God that can deliver after this sort.

If this Pagan King out of his transcendent zeal, upon the sight but of one miracle, was stirred up without any debates or delay, to make such a severe decree as this, against all those of every people, nation, and language that did speak any Error or Blasphemy against the true God, whom these three worthies then, and we now worship: shall not this decree of his rise up in Judgement against all those Christian Princes, Parliaments, Magistrates, Judges under the Gospel, who profess themselves the worshippers, servants, children of this true God; and yet shall refuse, or neglect to make such strict and severe Decrees against such Heretics and Blasphemers, who maliciously belch out most execrable blasphemies, and Errors against God himself, and openly maintain them in discourse and writing?

[B]ut especially against those who pretend and stile themselves the ONLY SAINTS and SERVANTS OF GOD (how truly let this one act alone declare) who professedly plead, preach, and write against the Corporal and Capital Punishment of such damnable Heretics, Blasphemers, and the enacting of any severe Laws against them by the Parliament and civil Magistrates, when as this Pagan King by his Decree commanded such, to be instantly cut in pieces and their houses to be made a dunghill, without any pity or pardon? Were Pagan Nebuchadnezzar now alive amongst us, he would new heat his Fiery Furnace to warm the kay-cold frozen zeal of such heatless New-Lights, and zeal-less Saints as these; or shame them into an emulation of his zeal against such Heretics and Blasphemers. …

For as the very light of Nature instructs all Nations that there is a God, and instigates them to elect and adore some Deity or other as their God and Saviour:

So it farther instructs them, that that Deity they adore, and that Religion they embrace is no ways to be openly blasphemed, reviled, oppugned, contemned, under pain of the most severe capital punishments, because such offences against the supremest Majesty of God transcend any Treason against an earthly Sovereign: whence most Laws and Nations have made them capital, and by the light of Nature in all ages punished such whom they esteemed Atheists, Heretics, Blasphemers of their gods, or oppugners of their established Religion, with no less then capital Punishments and the severest Censures, as is evident by these Scripture instances, and sundry other. …

Whence I conclude, that what Pagan Kings, Magistrates, Nations have usually punished with corporal, or capital punishments, and restrained by Civil Laws in all ages out of the light of Nature; that Christian Kings, Magistrates, and Nations under the Gospel may lawfully punish in like sort, even by the principles of Nature too, had they no other Divine Law to warrant them, as they have: ‘Tis true, most of these erred in the object, in deeming that Heresy, Schism, Blasphemy, Error, which was not; not in the punishment, had the object been such as they really deemed it, and such as we here dispute of.</p></blockquote>

<blockquote><p>VII. Sixth [Rule], ‘some precepts are affirmative’ (ordering things to be done, sins of omission); ‘others negative’ (prohibiting things to be avoided, sins of commission). ‘The former bind always, but not to always, the latter bind always to always.’ The virtues and duties commanded by the affirmative precepts cannot be exercised every moment together at once, and suppose certain conditions (which being absent, there is no place for them); for example, parents are not always alive or near us, so that we can render them their due respect. But the vices and crimes prohibited can be committed lawfully in no article of time. Here, however, we must make an exception of the general affirmative command to love God (which obliges always and to always) because there is no time or place or state in which man can be exempted from the duty of loving God. … XII. Fourth [Rule of Obedience], as the precepts do not have an equal degree of importance and necessity, so neither is the obedience to be reckoned of the same order and value… The omission of a command is one thing; opposition to it another; forgetfulness, neglect and contempt are different. Neglect proceeds from the langor of slothfulness…</p></blockquote>

</figure><figure class="quote" id="q-d01ed4a283" data-kw="">
<blockquote><p>It is inquired whether the judicial laws of Moses should still endure or thrive, and therefore whether the Christian magistrate should be bound to such laws today no less than before, and may render judgment according to them with certainty, or, in other words, whether he should enforce their precepts as much as the Israelite magistrate was formerly obliged to do.

I respond to this inquiry with a distinction: the magistrate is obliged to those judicial laws which teach concerning matters which are immutable and universally applicable to all nations, but not to those which teach concerning matters which are mutable and peculiar to the Jewish or Israelite nations for the times when those governments remained in existence.

Things common to all nations (that is, which befall all) and are immutable with respect to their own nature and merits are moral offences, that is, against the Decalogue, such as murder, adultery, theft, seduction from the true God, blasphemy, and smiting of parents.

Those laws which are mutable and which were peculiar to the Jews for that time are things such as the emancipation of Hebrew slaves in the seventh year, Levirate marriage, releasing of debts in the appointed year, marriage with a woman from one’s own tribe, and if there were any other of the same sort. Likewise, these include ceremonial offences such as touching a dead body, touching a woman suffering her menstrual cycle, and others of the same sort.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputations on the Judicial Laws of Moses</cite>, trans. Adam J. Brink, ed. Joel McDurmon (1646; Powder Springs GA: American Vision Press, 2015), pp 4-5.</span></figcaption>

</figure><figure class="quote" id="q-6225698499" data-kw="">
<blockquote><p>Regarding ministers, if one today comes to believe it is most proper, apart from necessity, to sit at a table for the Supper, or to do it with a common cup, and that’s not going to happen in the next few weeks or several months, must a minister abstain from dispensing an impure Supper (with the attendant consequences) or resign his charge to his congregation and go elsewhere? Do you have a framework in which to deal with this, while maintaining a clear and undoubting conscience? If Church officers cannot ever comply with things not fully right, regarding worship or otherwise, then officers can never remain in the Church while seeking her reform. Most all the reformers were against Gillespie’s principle as they continued in the Church (maintaining her unity) while performing practices they did not believe were fully right, while seeking to reform them to the Word, which largely occurred. That was a great good, only able to be attained through that means and our principle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 51</span></figcaption>

</figure><figure class="quote" id="q-0b1aead6b6" data-kw="">
<blockquote><p>That their conformity with the Brownists [separatists] may be full, the New-English [New England congregationalists] do count sitting at a table, not only to be necessary, but to be a part of our imitation of Christ, and a rite significant of diverse heavenly privileges and comforts; but as the Brownists at Amsterdam this day have no table at all, as they send the elements from the pulpit (the place where the minister preaches and celebrates the sacrament) by the hand of the deacon to all the congregation, where in their meeting-house they sit up and down in their several places: So the Independents at London do vehemently contend for the needlessness of any to come to the Table, whatever be the practice of all the rest of the Reformed Churches: But they will have the holy seals carried from the place where the minister preaches to the people in their pews, or wherever else they have their ordinary places for hearing of the Word; although most easily in their small congregations without any disturbance all might be brought to the Table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, … (London, 1645), ch. 6, ‘An Enumeration of the Common Tenets of the Independents’, pp. 122-23 The first part of the quote deals with taking the table too far.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-60d2f7d4d8" data-kw="">
<blockquote><p>No other single theologian perhaps had as much indirect influence on the compilations of the Westminster Assembly as James Ussher. Next to the Irish Articles this work was the next in importance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As given in Chris Coldwell, ‘The Westminster Assembly &amp; the Judicial Law</cite>, vol. 5 (2009), p. 30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f6b15e6750" data-kw="">
<blockquote><p>Whereas some teach, that when we doubt of the lawfulness of the thing enjoined, and are certain that obedience to authority is a duty, we must do the thing; We conceive that we cannot be certain of our obligation to obey in a case wherein we are not sure of the lawfulness of the thing commanded, because we are sure we must not obey the magistrate’s command in things unlawful, and our ignorance or error cannot alter our obligation to God’s Law. Here is therefore an uncertainty on either side, and perhaps the danger may be greater on the side of obeying than refusing. For possibly the injunction of a heinous sin may be the matter of the uncertainty, and in this staight we apprehend it more unsafe and less excusable to choose the greater before the lesser sin, though indeed it be lawful to choose neither.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Account given of the Principles &amp; Practices of Several Nonconformists</cite>, … (London: Parkhurst, 1682), p. 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-5564f73674" data-kw="">
<blockquote><p>Moreover, grace perfects nature and does not annul it (ibid., I, qu. 1, art. 8, ad 2). Grace presupposes nature (ibid., qu. 2, art. 2, ad 1) and perfects nature according to the proper mode of that nature (ibid., qu. 62, art. 5, a). Just as grace presupposes nature and perfects it, divine law presupposes and perfects natural law (ibid., I-II, qu. 90, art. 2, ad 1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/germain-grisez.html">Germain Grisez</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Dualism &amp; the New Morality’</cite>, (1977)</span></figcaption>

</figure><figure class="quote" id="q-e89aa0b540" data-kw="">
<blockquote><p>…what is meant by the Law of Nature. To wit, that Law which God writes and imprints in the nature of man, so that it is as it were connatural and born together with man (Zanchi, bk. 1, Of the Law of God, thesis 8, col. 190). Now if we consider what law was written in the nature of man in his first creation, it was no other than the Decalogue or the Moral Law (Amandus Polanus, System, bk. 6, ch. 9, col. 49; D. Pau. Explic. Catech., pt. 3, question 92, p. 503). But the Law which we are here to enquire of is that law, which after the Fall, God still writes in the heart of every man: which (we all know) comes far short and wants much of that which was written in the heart of man before his Fall… For that law which is simply called jus naturale is innatum, and lays before the minds of men that way, wherein by the guidance and conduct of nature, they may be led to that good which is in the end proportionate to nature (Francis Junius, On the Mosaic Polity).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, … (1637), Part 3, ch. 9, ‘That the lawfulness of the [English-Popish] ceremonies, cannot be warranted by the Law of Nature’, p. 197</span></figcaption>

<blockquote><p>Question 12: Must a judge and jury proceed secundum allegata &amp; probata, ‘according to evidence and proof’, when they know the witness to be false and the truth to be contrary to the testimony, but are not able to evince [prove] it? Answer: Distinguish between the negative and the positive part of the verdict or sentence: In the negative they must go according to the evidence and testimonies, unless the Law of the land leave the case to their private knowledge. As for example: They must not sentence a thief or murderer to be punished upon their secret unproved knowledge; They must not adjudge either moneys or lands to the true owner from another without sufficient evidence and proof; They must forbear doing justice because they are not called to it, nor enabled. But positively they may do no injustice upon any evidence or witness against their own knowledge of the truth: As they may not upon known false witness, give away any man’s lands or money, or condemn the innocent: But [they] must in such a case renounce the office: The judge must come off the bench, and the jury protest that they will not meddle or give any verdict (whatever come of it): Because God and the Law of Nature prohibit their injustice. Objection: ‘It is the Law that does it, and not we.’ Answer: It is the Law and you: and the Law cannot justify your agency in any unrighteous sentence. The case is plain and past dispute.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), pt 4, ch. 22, ‘Cases &amp; Directions Against Injurious Law-Suits, Witnessing and Judgment’, p. 149</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>The basic principle in application is to know whether the passage is a statement of the law or of the gospel. For when the Word is preached, the law and the gospel operate differently. The law exposes the disease of sin, and as a side-effect, stimulates and stirs it up. But it provides no remedy for it. However the gospel not only teaches us what is to be done, it also has the power of the Holy Spirit joined to it….A statement of the law indicates the need for a perfect inherent righteousness, of eternal life given through the works of the law, of the sins which are contrary to the law and of the curse that is due them…. By contrast, a statement of the gospel speaks of Christ and his benefits, and of faith being fruitful in good works</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Art of Prophesying (1592). Reprinted, Edinburgh: Banner of Truth Trust, 1996, 54-55.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-771cc66c44" data-kw="">
<blockquote><p>As for that which they tax the ministers, to be ministers of the dead letter, one may plainly see the Lord’s taking vengeance upon the outrage offered unto his holy Word; smiting them with the spirit of giddiness, for having despised the true and only means of coming unto God, which is the Scripture and the Word of God. In the passage of the Corinthians where Paul says, “The letter kills, and the Spirit quickens;” let any closely consider, against whom the Apostle disputes, and they will understand his drift. It is very evident that Paul in this place, had to do with false Apostles, who preached and extolled the Law without Christ, and caused the people to recoil from salvation purchased by Christ, and the grace of the new covenant, whereunto the Lord had promised to write his Law in the heart of the faithful: the Law then being separated from Christ, as a body without a soul; and nothing comes from it but death, to those that are under it: it does nothing but beat and strike the ears, without quickening the soul, until by faith we are sent from it unto Christ, as from the usher to the master; and then the Law will be found such as David sings it, “The Law of the Lord is perfect, converting the soul; the testimony of the Lord is faithful, making Wise the simple: the commandments of the Lord are right, rejoicing the heart, etc.” Thus must we understand how it is said, “The Letter kills:” Paul called the Law, The killing Letter, and says, The Spirit quickens, i.e., The Ministry of the Gospel, which he opposes unto the naked Law; and he himself calls his preaching “The Ministry of the Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rise, Spring, and Foundation of the Anabaptists (1st edition, 1552; English translation 1668), 40-41.</cite></span></figcaption>

</figure><figure class="quote" id="q-29bc292ded" data-kw="">
<blockquote><p>Canon XXIV: But this later Covenant of Grace according to the diversity of times has also different dispensations. For when the Apostle speaks of the dispensation of the fullness of times, that is, the administration of the last time (Eph 1:10), he very clearly indicates that there had been another dispensation and administration until the times which the Father appointed. Yet in the dispensation of the Covenant of Grace the elect have not been saved in any other way than by the Angel of his presence (Isa 63:9), the Lamb slain from the foundation of the world (Rev 13:8), Christ Jesus, through the knowledge of that just Servant and faith in him and in the Father and his Spirit. For Christ is the same yesterday, today, and forever (Heb 13:8). And by His grace we believe that we are saved in the same manner as the Fathers also were saved, and in both Testaments these statutes remain unchanged: “Blessed are all they that put their trust in Him,” (the Son) (Ps 2:12); “He that believes in Him is not condemned, but he that does not believe is condemned already” (John 3:18). “You believe in God,” even the Father, “believe also in me” (John 14:1). But if, moreover, the holy Fathers believed in Christ as their God, it follows that they also believed in the Holy Spirit, without whom no one can call Jesus Lord. Truly there are so many clearer exhibitions of this faith of the Fathers and of the necessity of such faith in either Covenant, that they can not escape any one unless one wills it. But though this saving knowledge of Christ and the Holy Trinity was necessarily derived, according to the dispensation of that time, both from thc promise and from shadows and figures and mysteries, with greater difficulty than in the NT. Yet it was a true knowledge, and, in proportion to the measure of divine Revelation, it was sufficient to procure salvation and peace of conscience for the elect, by the help of God’s grace. Canon XXV: We disapprove therefore of the doctrine of those who fabricate for us three Covenants, the Natural, the Legal, and the Gospel, different in their entire nature and essence, and in explaining these and assigning their differences, so intricately entangle themselves that they greatly obscure and even impair the nucleus of solid truth and piety. Nor do they hesitate at all, with regard to the necessity, under the OT dispensation, of knowledge of Christ and faith in him and his satisfaction and in the whole sacred Trinity, to speculate much too loosely and dangerously.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-marshall.html">Stephen Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Formula Consensus Helvetica [The Swiss Form of Consensus] 1675 | trans. Martin I. Klauber, Trinity Journal 11 (1990): pp. 103-23 See Wikipedia for background.</cite></span></figcaption>

</figure><figure class="quote" id="q-f92399d50e" data-kw="against mental reservations">
<blockquote><p>Whether it is lawful to use ambiguous equivocations and mental reservations in oaths. We deny against the papists and especially the Jesuits. We do not speak of the rhetorical use of equivocations, nor of the logical use which often obtains in disputations. Rather we speak of the theological and moral use in giving testimony and in oaths, where truth and sincerity are required.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.12.1</span></figcaption>

<blockquote><p>This is one part of atheism and self-idolatry, to magnify ourselves, with the forgetfulness and to the injury of our Creator.… In ascribing the glory of what we do or have to ourselves, to our own wisdom, power, virtue, etc.… He regards Babylon as his heaven and himself as his idol, as if he were all and God nothing.… So much as we sacrifice to our own credit, to the dexterity of our hands, or the sagacity of our wit, we detract from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse 2, On Practical Atheism (self-idolatry)</span></figcaption>

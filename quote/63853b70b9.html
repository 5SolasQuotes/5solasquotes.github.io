<main class="wrap"><figure class="quote" id="q-63853b70b9" data-kw="theologian">
<blockquote><p>Although the human understanding is very dark, yet there still remains in it some rays of natural light and certain first principles, the truth of which is unquestionable: such as, the whole is greater than its part, an effect supposes a cause, to be and not to be at the same time are incompatible (asystatous), etc. If this were not the case, there could be no science, nor art, nor certainty in the nature of things. (2) These first principles are true not only in nature, but also in grace and the mysteries of faith. Faith, so far from destroying, on the contrary borrows them from reason and uses them to strengthen its own doctrines. (3) Although reason and faith are of different classes (the one natural, the other supernatural), they are not however opposed, but hold a certain relation and are subordinate to each other. Reason is perfected by faith and faith supposes reason, upon which to found the mysteries of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.9</span></figcaption>

<blockquote><p>Rom. 1:19, 20 (concerning that which may be known of God, gnōstō tou Theou) does not favor a common religion by which all may be saved and which is sufficient for salvation. (1) Only that which may be known (gnōstō) is there spoken of and not that which is to be believed (pistō), which alone is saving. (2) Paul says the knowledge (to gnōston) of God is manifest in the Gentiles, but not all knowledge (pan gnōston) (viz., what may be learned from the book of nature, but not all that may be known of him from his word and which must be known in order to salvation, such as the mystery of the Trinity, and of Christ the Redeemer, etc.). (3) This knowledge (gnōston) which is restricted by the apostle to his “power and godhead” (i.e., to the knowledge of his existence and of those attributes which strike our senses in the works of creation and providence) is usually referred to natural theology; but is not extended to the knowledge of his will and mercy in Christ which can be derived only from his word, and not at all from his works and without which there can be no salvation. (4) This knowle</p></blockquote>

</figure><figure class="quote" id="q-f5f702de65" data-kw="wayfarers">
<blockquote><p>A science practical per se is not only that which is concerned with an operable thing and is regulative and directive of some operation. Otherwise that part of medicine which considers the parts of the human body and their diseases (and the signs and causes of diseases) would be speculative and not practical, which is absurd. For the ultimate and principal object of that branch of medicine is not the knowledge but the cure of diseases. Also that which is either impulsive to operation (as the knowledge of the good or evil consequences which follow virtue or vice), impels to right actions or is prerequisite to a better operation and action, as pathology (pathologikē) in medicine. Theology is called practical not only in the first sense, but also in the second and third. There is no mystery proposed to our contemplation as an object of faith which does not excite us to the worship of God or which is not prerequisite for its proper performance.</p></blockquote>

</figure><figure class="quote" id="q-c0521c3f2b" data-kw="fundamentals">
<blockquote><p>As in a house that is the foundation which has such a position that the house can neither be erected nor stand without it, so in religion that is the foundation upon which the whole of religion depends and it standing, religion stands; removed, religion falls. It is used in two senses: either simply and personally (applied to Christ the foundation of all salvation upon which the church and religion are built as upon a firm and immovable rock, Mt. 16:18; 1 Pet. 2:6, 7; 1 Cor. 3:11—“for other foundation can no man lay than that is laid, which is Jesus Christ”); or comprehensively and naturally for the fundamental truth which all are required to believe and which is therefore called the foundation of faith. But this may be either widely extended to the first rudiments of the Christian religion (which were taught the catechumens for initiation and are called by the apostle the foundation [themeliou], or the principles [archēs]): such as repentance from dead works, faith toward God, the doctrine of baptisms, the laying on of hands, the resurrection of the dead and eternal judgment (Heb.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1035334f61" data-kw="">
<blockquote><p>That this righteousness of ours, that is, whereby we are righteous, or made righteous before God; is not Legal, but Evangelical. Man’s first righteousness was Legal, but that is a Non-ens now; there is no such thing in being now betwixt God and us, as Legal Righteousness: once it was, but now ’tis cast out, in the Bond-woman and her Son, Gal. 4.

The Law is not able to justify a sinner; therefore the Apostle saith, If there had been a Law which could have given life, i.e. Justification unto life (as Rom. 5.18.) verily righteousness should have been by Law: but the Scripture, i.e. the Law hath concluded all under sin, that the promise by faith of Jesus Christ might be given to them that believe.

‘Tis true, Christ’s Righteousness, as in himself was legal, being the satisfaction of the Law, and Justice of God in our behalf. But as this Righteousness is imputed to us, so it is Evangelical Righteousness; because it is not Righteousness in us, but Righteousness accounted to us: Abraham believed, and it was accounted to him for righteousness. So that there is now another way to Justification, and so to life and glory, than once there was, which the Epistle to the Hebrews calls a New way; and this is the Righteousness of Christ made ours, or Christ, the Lord our Righteousness.</p></blockquote>

<blockquote><p>XL. Our [Reformed] theologians also inquire whether angels are part of the Church. Tilenus, Polanus and others who want the Church to be taken broadly enough to include even the angels affirm this. However, the illustrious Amyraldus, in his Theses on the Parts of the Church, denies it along with many others. I think briefly that there is great communion between angels and pious and faithful men, and that Christ’s death reconciled angels to men and closely united them, making angels protectors and guardians of the faithful and promoting their salvation. But pious men form a certain society among themselves to which angels do not belong. The name ‘Church’ in Scripture is only attributed to the society of men and never includes angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), Nature &amp; Definition of the Church, p. 429 Latin</span></figcaption>

<blockquote><p>VIII. Furthermore, the nature of this eternity [of God] will be made further known to us if we consider that there are, in total, three measures of duration. The first belongs to things that by their nature are mutable and that wear out. It possesses a beginning and an end, and it is called ‘time’. Its nature consists in a continuous succession of moments, such that properly speaking not but one moment exists at a time, and only when the preceding moments have ceased to exist and the following moments do not yet exist. In this measure of duration it is proper to observe periods: the past, the present, and the future. The second measure of duration belongs to things that by their essence are incorruptible or immaterial. It has a beginning but it is without end, and it is named ‘forever’ [aevum]. The third measure is simply immutable, and thus it lacks beginning, end and succession. And only this measure is that eternity which the Scholastics define as “interminable, indivisible, and independent duration”: “interminable,” meaning that it lacks both outer boundaries; “indivisible,” meaning that it also lacks succession; and finally, “independent,” meaning that it lacks all imperfection and change. Thus in this eternity, three things come together: the absence of a beginning, the absence of an end (which all admit), and the absence of succession. This last absence Vorstius [an Arminian] as well as the Socinians deny, and we will demonstrate and vindicate it in the elenctic part.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, ed. Joel Beeke, tr. Todd Rester (RHB, 2021), vol. 2, bk. 2, ch. 11, The Eternity of God, p. 217</span></figcaption>

<blockquote><p>It is true, that God also elected good angels, confirming them in holiness, rendering them happy in the possession of eternal glory, and hence they are called “elect angels.” Yet they were not elected in Christ, for never having sinned, they needed no Mediator, no Redeemer — it was only necessary to insure their original integrity; but man having fallen from his innocence, it was indispensible that he should be restored to it through the medium of a surety, in the contemplation of whose merit alone we could be elected. God, then, elected us in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-bosc.html">Pierre Du Bosc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protestantism. Being a Series of Discourses on a Portion of the Epistle to the Ephesians</cite>, trans. J. B. Law (1699; London: A. Hall, Virtue, &amp; Co., 1853), p. 202.</span></figcaption>

<blockquote><p>There is no created holiness sure, stable, and perfect in itself: The glorious angels which are, and ever shall be saints in Heaven, and the saints in Heaven who are like angels, stand not in that holy and happy estate by their own sufficiency, but by the decree and grace of God. Those angels which fell at first were holy, and they who now stand, might have fallen notwithstanding their created holiness, if God had not superadded confirming grace which establishes them forever. Yet this is not all, that the angels are imperfect because they might fall if not supported, there is somewhat more in it…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c964c3e5c6" data-kw="">
<blockquote><p>549. Prov. 1:26, ‘I will mock at your trouble; and laugh when your destruction comes.’ Eze. 18:32, ‘I will not the death of a sinner, for I take no pleasure in the destruction of a sinner.’ God is delighted in his justice, when He punishes those which despise his grace, and that will not hearken to his fatherly vocation; but of his mercy He will not the death of sinners, as death is the destruction of nature. The former place belongs to God’s consequent will; the latter to his antecedent will; that is ruled by justice, this by mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-thaddaeus.html">Johannes Thaddaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reconciler of the Bible</cite>, … (London: Miller, 1662) | Proverbs</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8d315da5fe" data-kw="">
<blockquote><p>Wherefore he teaches that God in these threatnings and promises does not always reveal his hidden and unchangeable will, whereby He has most firmly decreed what He will do: but only his will, which they call the antecedent will, or the will of the sign, that is of admonition: for that their present estate requires that. But Paul in this place and the prophet in the beginning of the chapter entreat of that will and power of God whereby He by most good right both makes, and makes n•w all things as pleases Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most Learned &amp; Fruitful Commentaries</cite>, … upon… Romans... (London: Daye, 1568), ch. 9, p. 273</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-c67f6c7c3c" data-kw="">
<blockquote><p>Having proved it [the Mosaic deliverance of the 10 Commandments] is a covenant, all the difficulty remains in declaring what covenant it is; for here is much difference of judgements, even with the learned and orthodox… Some explain it thus: God (say they) had a primary or antecedent will in giving of the Law, or a secondary and consequent: His primary will was to hold out perfect and exact righteousness, against which the apostle argues and proves no man can be justified thereby: but then God, knowing man’s impotency and inability, did secondarily command repentance and promises a gracious acceptance through Christ; and this [understanding] may be very well received, if it be not vexed with ill interpretations. But, lastly, this way I shall go: The Law (as to this purpose) may be considered more largely, as that whole doctrine delivered on Mount Sinai with the preface and promises adjoined and all things that may be reduced to it; or more strictly, as it is an abstracted rule of righteousness, holding forth life upon no terms but perfect obedience. Now take it in the former sense: it was a covenant of grace; take it in the later sense, as abstracted from Moses’s administration of it, and so it was not of grace, but works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis, or a Vindication of the Moral Law &amp; the Covenants</cite>, … (London: Underhill, 1647), Lecture 24, on Dt. 4:13, pp. 231-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

online.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=Having%20proved%20it%20%5Bthe%20Mosaic%20deliverance,was%20not%20of%20grace%2C%20but%20works&amp;text=Having%20proved%20it%20%5Bthe%20Mosaic%20deliverance%20of%20the&amp;text=so%20it%20was%20not%20of%20grace%2C%20but%20works" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0ffc758c98" data-kw="">
<blockquote><p>34. The Will of God is the other faculty of the life of God, or the act that follows, by which God knows Himself and wills and approves of all good things as they agree unto the nature and order of his mind, the contraries He necessarily disapproves, which will is called approving; and out of which things He is able to do, some He freely wills, chooses and decrees by a foregoing wisdom, and does, which is the effecting will;…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-thysius.html">Antonius Thysius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thesis 34 in The Sixth of the Theological Disputations in On the Nature of God &amp; the Divine Attributes</cite>, (d. 1640; Leiden, 1620) This disputation is also in the Synopsis of Pure Theology as disputation 6.</span></figcaption>

</figure><figure class="quote" id="q-6ec63573ca" data-kw="">
<blockquote><p>(2) In this Sinai-Covenant Jesus Christ is frequently tendered unto Israel, and that in variety of notions and considerations as has been abundantly manifested: The Tabernacle, the veil, the ark, the mercy-seat over the ark, the high priest with his consecration, garments, office, etc. the sacrifices of all sorts, the altar of incense, the altar of burnt-offering, etc. they all typed out and tendered Christ to Israel. Consequently true faith in Christ must herein be necessarily implied and required of Israel for discerning Christ in these mysteries, for apprehending and applying Him unto themselves for righteousness and salvation accordingly. For without such faith to apprehend and apply Christ, all these manifestations of Christ to Israel had been vain, useless and ineffectual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Mysterium &amp; Medulla Bibliorum: the Mystery &amp; Marrow of the Bible, viz. God’s Covenant with Man</cite>, … (London: R.W., 1657), bk. 3, ch. 4, p. 865</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<main class="wrap"><figure class="quote" id="q-0f3186eb5d" data-kw="">
<blockquote><p>If any man before the time prescribed shall go out of his house without license and thrust himself into the company of others, he shall be bound to begin afresh the time of shutting in and be punished beside[s] with an arbitrary [appointed] punishment. But if the same part being infected before and yet scarce well recovered, or but meetly recovered, shall adventure to do the like, he is to be accused of great unthankfulness and to be deprived of all benefits usual to be done unto him, and besides [this] to be restrained with [a] longer keeping in. But if being now in very deed infected with the plague, he shall be found to have committed this heinous offence upon notorious and wicked boldness, as a murderer after the loss of his goods [being set to die and having nothing further to lose], if he be without children, let him be delivered over unto the hangman.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection in the Time of the Plague or Pestilence, Two Books</cite>, (London, 1583)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-5a8d4c7847" data-kw="">
<blockquote><p>…the King has sufficient power to oppose wasters of his kingdom and to require homage of his subjects. Suppose he have not an unlimited power to forbid these of other nations and Churches, and his own, to go to a synod, within or without his nation, for the settling of the Churches in necessary peace and truth, if the Churches must seek liberty and counsel for their souls good, and edification: nor has he any lawful power from God to hinder his own subjects to send commissioners to sound and godly synods for counsel and synodical light, more than Jeroboam could lawfully forbid the people to go and worship at Jerusalem, upon pretense that they might be persuaded to cleave to Rehoboam their lawful prince, and waste his new kingdom: nor hath the prince an unlimited and absolute power to exact such absolute homage of his people; nor such a power over their moving from place: ([Margin note:] The Lord of Life has principally in the First Table laid a law upon our locomotive, and all our actings, to honor and love Him first, and the prince only secondarily and subordinately to God; if God charge us first to go to public meetings to honor Him, the Prince under pretense of peace cannot forbid the people to go up to Jerusalem to worship; we are to obey God rather than man.) for so the [claimed] Church Independent of Jerusalem consisting of ten thousand, if not more, should have no intrinsic power to meet for the public worship of God; but the prince must have a lawful power to hinder their meeting, or then the Church cannot have a lawful power to meet; for the convening of ten thousands, if abused, is as dangerous for wasting of a kingdom in its own way, as the convening of a national synod, is, or may be destructive to peace.</p></blockquote>

</figure><figure class="quote" id="q-86a7216cbc" data-kw="">
<blockquote><p>But I answer, [1.] the king as king has dominion-civil of places and times, as places and times, but not of places as sacred in use, and of times as sacred and religious: for his power in Church matters being accumulative, not privative [depriving], he cannot take away a house dedicated to God’s service no more than he can take away maintenance allotted by public authority upon hospitals, schools, doctors and pastors. God has here a sort of propriety of houses and goods as men have. Places as sacred-abused are subject to regal power; he may inhibit conventions of heretics. 2. The apostles might preach in the Temple, though civil authority forbid them. 3. Kings are as much lords of places as sacred and public, as they have a dominion of civil places, in respect the king may by coactive [coercive] power hinder that false and heretical doctrine be preached, either in public, or private places, for this he ought to do as a preserver of both Tables [of the Law] and a bearer of the sword for the good of religion; and if they may command pure doctrine to be preached, and sound discipline to be exercised, they may command the same to be done in public places.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), Appendix, pp. 430-1</span></figcaption>

<blockquote><p>10th Assertion. Hence I am not afraid to assert a reciprocation of subordinations between the Church and the Magistrate, and a sort of collaterality and independent supremacy in their own kind common to both, for every soul, pastors and others, are subject to the Magistrate as the higher power, in all civil things, Rom. 13:1-4; Tit. 3:1; 1 Pet. 2:13-14; Mt. 22:21.</p></blockquote>

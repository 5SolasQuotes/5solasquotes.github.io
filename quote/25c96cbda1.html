<main class="wrap"><figure class="quote" id="q-25c96cbda1" data-kw="moral law not abolished">
<blockquote><p>As it was not abolished but fulfilled by Christ, neither is its use among us to be abolished. Luke wants us to hear Moses and the prophets: “They have Moses and the prophets, let them hear them” (16:29). If they are to be heard, their commands must therefore be obeyed also. If this is said by Christ to the Jews of his time, it ought not forthwith to be understood of them to the exclusion of others. He does not give here a special, but a general precept to all who desire to escape the place of torment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.23.5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1b3756b939" data-kw="">
<blockquote><p>The Reformed on the contrary state that all the acts of concupiscence, even the primary-first, are sins, because the contrary opinion is: (1) contrary to the express words of the apostle (Rom. 7:7); (2) contrary to the express demand of the law (Ex. 20:17); (3) contrary to the force and strictness of the law, which under the penalty of an eternal curse demands the most exact obedience (Matt. 22:37; Deut. 27:26; Gal. 3:10), and therefore condemns all concupiscence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology</cite>, 4.3.21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a> › <a href="../topics/sin/concupiscence/concupiscence-is-truly-sin.html">Concupiscence is truly sin</a></span><span class="t"><a href="../topics/the-law-of-god/law-in-general.html">Law in General</a></span></div>

— Petrus van Mastricht, Theoretical-Practical Theology, 4.3.21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Reformed+on+the+contrary+state+that+all+the+acts+of+concupiscence%2C+even+the+primary-first%2C+are+sins%2C+because+the+contrary+opinion+is%3A+%281%29+contrary+to+the+express+words+of+the+apostle+%28Rom.+7%3A7%29%3B+%282%29+contrary+to+the+express+demand+of+the+law+%28Ex.+20%3A17%29%3B+%283%29+contrary+to+the+force+and+strictness+of+the+law%2C+which+under+the+penalty+of+an+eternal+curse+demands+the+most+exact+obedience+%28Matt.+22%3A37%3B+Deut.+27%3A26%3B+Gal.+3%3A10%29%2C+and+therefore+condemns+all+concupiscence.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical-Practical+Theology%2C+4.3.21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1b3756b939.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1b3756b939.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-e4ce59d60d" data-kw="">
<blockquote><p>All confidence reposed in creatures … is evidently opposed to a correct knowledge of God, since he who places his trust in creatures makes for himself many gods. Hence God expressly condemns in his word all those who repose their confidence either in men, or in power and riches, or in any created object. Avarice, or covetousness, is included in this vice, and condemned.… Idolatry … There are two forms or species of idolatry. One is, when another beside the true God is professedly worshiped, or, when that is worshiped for God which is no God.… The other form of idolatry is when we do not professedly worship another God, but err in the kind of worship we render unto him.… Those who worship God otherwise than he will be worshipped, imagine another God, one differently affected from what the true God is; and in this way they do not worship God, but a figment of their own brain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, on the First Commandment (creature-trust and forms of idolatry)</span></figcaption>

</figure><figure class="quote" id="q-72b7111168" data-kw="">
<blockquote><p>Fifth, the last commandment of lust forbids the first motions to sin that are before consent. … Again, the philosophers knew that lust with consent was evil, even by the light of nature. But Paul, a learned Pharisee, and therefore more than a philosopher, knew not lust to be sin that is forbidden in this commandment [Rom. 7:7]. Lust therefore that is forbidden here, is without consent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Advertisement to all Favorers of the Roman Religion</cite></span></figcaption>

</figure><figure class="quote" id="q-ffaa63822b" data-kw="civil pedagogical conviction restraint">
<blockquote><p>In the destitute state of sin, the use of the law cannot be “justification” because it was weak in the flesh. It is not said to have been given for life, but “because of transgressions” (Gal. 3:19). Still there is a threefold use of the law. (a) For conviction, when it brings man to a knowledge of sin and convinces him of his guilt—“by the law is the knowledge of sin” (Rom. 3:20). Thus it is like a mirror in which we see our blemishes. (b) For restraint, restraining and checking men by its commands and threatenings, so that they who feel no regard for justice and rectitude unless compelled (while they hear its direful sanctions) may be restrained at least by the fear of punishment. In this respect, Paul says “the law is not made for a righteous man, but for lawless and disobedient, for the ungodly and for sinners” (1 Tim. 1:9).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.22.9</span></figcaption>

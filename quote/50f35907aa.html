<blockquote><p>Q. What is forbidden in this [Second] Commandment, in one word. A. Will-worship.

Q. What is Will-worship? A. To worship God after our own wits and wills.

Q. What is Commanded? A. To worship God according to this Word.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-31c09df0bd" data-kw="">
<blockquote><p>How can we deprive the Church of this liberty that it may not signify some thing by her actions and rites, the same being done, without placing any worship of God therein, modestly and in few things, so as the people of Christ be not burthened with ceremonies, and that better things be not letted [prevented]. But you will say [with respect to a white vestment], let them [ministers] show themselves to be angels, let them not signify it. I hear what you say. But the self same might have been answered unto Paul when he decreed unto the Corinthians that the woman should have her head covered, and the man uncovered, for he only urges a reason of the signification. For any man of the Church of Corinth might have answered: let the man show himself to be head of the woman, and let the woman in her deeds and life show herself to be subject unto the man, let them not contend to show this by signs. But the apostle saw this also to be a profitable thing, that we should not only live well, but that also we should by words and tokens be admonished of our duty. But and if hereby there be given an occasion of error unto the weak, let them be warned how they should believe these indifferent things, let them be taught by sermons that they judge not the worshipping of God to consist herein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places</cite>, II.2.26, (d. 1562; London, 1583) | Theological Epistles, Epistle to John Hooper, pp. 119-20</span></figcaption>

</figure><figure class="quote" id="q-cff4795b7e" data-kw="">
<blockquote><p>Here, then, we have our Lord’s own testimony regarding His relation to the law of God. His first and most comprehensive declaration upon the subject — the one which may be said to rule all the others — is the utterance on the mount, ‘Think not that I came to destroy the law or the prophets, I came not to destroy (καταλῦσαι), to dissolve, abrogate, make void), but to fulfil (πληρῶσαι).’ This latter expression must be taken in its plain and natural sense; therefore, not as some would understand it, to confirm or ratify — which is not the import of the word, and also what the law and the prophets did not require. God’s word needs no ratification. Nor, as others, to fill up and complete their teaching — for this were no proper contrast to the destroying or making void.

No; it means simply to substantiate, by doing what they required, or making good what they announced. To fulfil a law (πληροῦν νόμου), was a quite common expression, in profane as well as sacred writings, and only in the sense now given. So we find Augustine confidently urging it against the Manichaean perverters of the truth in his day: ‘The law (says he) is fulfilled when the things are done which are commanded. . . . Christ came not to destroy the law but to fulfil it: not that things might be added to the law which were wanting, but that the things written in it might be done — which His own words confirm; for He does not say, “One jot or one tittle shall not pass from the law” till the things wanting are added to it, but “till all be done.” And uttered as the declaration was when men’s minds were fermenting with all manner of opinions respecting the intentions of Jesus, it was plainly meant to assure them that He stood in a friendly relation to the law and the prophets, and could no more, in His teaching than in His working, do what would be subversive of their design. They must find in Him only their fulfilment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-fairbairn.html">Patrick Fairbairn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Revelation of Law in Scripture: Considered with respect both to its own Nature, and to its Relative Place in Successive Dispensations. The Third Series of the ‘Cunningham Lectures’</cite>, (Edinburgh: T. &amp; T. Clark, 1869), pp 223-24.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-1c2fed46c1" data-kw="">
<blockquote><p>Obj. 2. The covenant was occasional and temporary, being made upon the occasion of the prevalency and growing power of the enemy (as is mentioned in the narrative), which foundation being taken away the superstructure cannot stand.

Ans. 1. … Shall we therefore be no longer bound to obey and maintain good laws, because the evils which gave occasion to their making have ceased?

2. The covenant doth, in express words, oblige us constantly, and all the days of our lives, to pursue the ends therein expressed; so that to hold it but a temporary obligation is a breach of covenant.

3. There is not any one of the ends of the covenant which is yet fully attained. The very Directory of Worship is not observed in most places of the kingdom; neither is the abolition of prelacy, and of the Book of Common Prayer, yet established by act of parliament.

4. If we had attained the ends of the covenant (which we have not), yet non minor est virtus quam quorere parta tueri, and the recidivation may prove worse than the first disease.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, (1649; Edinburgh, 1844), pp 87-88.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-fed762504d" data-kw="">
<blockquote><p>Let us then here call to mind the distinction which has been showed betwixt religious ceremonies and moral circumstances: for as touching moral circumstances which serve for common order and decency in the worship of God, they being so many and so alterable that they could not be particularly determined in Scripture, for all the different and almost infinite cases which might occur, the Jewish Synagogue had the same power for determining things of this nature which the church of Christ now has. For the law did not define but left the[m to] be defined by the Synagogue, the set hours for all public divine service, when it should begin, how long it should last, the order [that] should be kept in the reading and expounding of the law, praying, singing, catechizing, excommunicating, censuring and absolving of delinquents, etc., the circumstances of the celebration of mariage, of the education of youth in schools and colleges, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, (1637), pt. 3, ch. 7, p. 119</span></figcaption>

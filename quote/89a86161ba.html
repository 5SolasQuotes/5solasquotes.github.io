<main class="wrap"><figure class="quote" id="q-89a86161ba" data-kw="">
<blockquote><p>Although there is much evidence for the practice of female veiling in the Classical world it has for the most part been ignored. Evidence for the veiling of Roman women is found in many sources. Ancient lexicographers list many names for veils that these women wore. Each of these veils was particular to the context in which they were worn and by whom they were worn. The plenitude of veiling terminology as well as the specialized nature of these veils alerts the reader to the importance that the Romans attributed to the veil, suggesting that it formed an important part of their culture and this is described in visual and literary terms by ancient artists and writers. … The practice of veiling is therefore viewed by the Romans in a positive light, and its disruption is understood by them as a cause for concern. This concern was especially apparent during the late republic. The dissolution of the traditional forms of government was in some ways problematized in terms of gender, with women’s abandonment of their traditional roles and their incursion into the public sphere being of specific importance. In order to remedy this, attempts were made by the new regime of Augustus to promote a return to what were seen to be traditional gender relations. This programme of moral reform made use of both formal, legalistic decree (the Julian marriage laws) and more propagandistic constructions (the public works of art). In this process traditional symbols assumed a high degree of salience. Because of its power to signify the beneficial and appropriate status of the female body, one of the most important of these symbols was the veil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lydia-lenore-veronica-matthews.html">Lydia Lenore Veronica Matthews</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conspicuous Concealment</cite>, (University of KwaZulu-Natal, 2007) 225 pp. Pictures are on, pp. 149-204</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<blockquote><p>V. 3. But I] a new precept or renewed by the apostle, concerning common civility for habit [wearing of garments] namely that women in public assemblies of the church should be covered, and men should have their heads uncovered by reason that in those places and times, the covered head was sign of subjection and an uncovered head contrary wise of liberty; and command wherefore that they might keep in the church that degree amongst sexes which God had established, they were to observe such signs and marks thereof as were used by the common consent of nations. See Gen. 20:16 and 24:65… … V. 10. To have power] as who should say to go forth in public in a modest and civil manner for this necessity of women’s covering the head took place but only out of doors, and not within doors. And if they went abroad without a vail they were reputed as debauched women, like run away servants or soldiers that have not their master’s or captain’s pass…</p></blockquote>

<blockquote><p>…we did never condemn all significant rites in religion, even though they be not founded on divine institution. Uncovering the head is a significant rite, and we know no divine institution for it; and yet we use it in the worship of God, viz. prayer and several other exercises; and will separate from no Church because of it. That a minister preach in a decent garb, and not in a fool’s coat, is a significant rite used in religion, not founded on divine institution, yet we shall not separate for enjoyning that.</p></blockquote>

</figure><figure class="quote" id="q-3addea374e" data-kw="">
<blockquote><p>…and consider the reason of such rules and commandments, which carries in it the light and the life of the commandments. For where that reason holds not, there are we free from the commandment; but where the reason is in force, there are we no less bound to the substance and effect of such particular commandment than they were. So if there could be like reason as caused that commandment to the disciples, we were in such case to keep it, and where the same offence is justly to be feared in eating of meats forbidden, as was then and may be in many like cases now and to the end, there that order of the apostles binds. As for the last place out of the 1 Cor. 11, if he look better upon it, he shall find that the apostle grounds that order there prescribed upon so general and necessary reasons of the ordinance of God, the glory of our Savior Christ, the regard of angels, and the voice of nature, and the custom of all the Churches, as he has taken his level far amiss to leave it at liberty, whether a man keep it or no: provided that he understand the apostle’s meaning aright: which is that men and women, especially being present in the public assemblies of the church, should carry the mark of their creation, agreeable to the sex whereof they were: the woman wearing upon her head a vail or kerchief, or such other attire (according to the lawful custom of their country and place of abode) as declares her sex and subjection to man by such coverture of her head. And the man, by not wearing any such attire upon his head as is proper to womankind, but by want of any such upon his head, show the glory of Christ, and the honor that in the order of creation is bestowed upon men. Therefore notwithstanding his caution or anything here alleged to the contrary, it remains firm and stable that the constant and perpetual examples of the Churches, the orders, rules, and commandments of our Savior Christ and of his apostles, both for the points of doctrine to be believed, and also for such as are to be obeyed and practiced in the public government of the Church, and in the private life of everyone, do bind the conscience of all the people of God to keep and to obey them: yea the most particular rules, the like case and reason being in us that was in them to whom they were given.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-travers.html">Walter Travers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defence of the Ecclesiastical Discipline ordained of God to be used</cite>, … (1588), pp. 123-4</span></figcaption>

<blockquote><p>And he said not, ‘let her have long hair,’ but, ‘let her be covered,’ [v. 6] ordaining both these to be one [v. 5], and establishing them both ways, from what was customary…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-870d0bcd08" data-kw="">
<blockquote><p>The Lord’s day is the first day of the week, wherein Christians do make solemn meetings to exercise the public worship of God. Act. 20.7.

1. Cor. 16.2. Revel. 1.10. But the Lord’s day is celebrated in stead of the sabbath for 3. causes, 1. that it might continually call to remembrance the benefit of the Lord’s resurrection.

2. That the believers might understand, that they are freed from the yoke of the Law.

3. That it might be a difference between us that are Christians, and the Jews, who as yet (but without cause) are addicted to the observation of the time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The substance of Christian religion soundly set forth in two books, by definitions and partitions, framed according to the rules of a natural method, by Amandus Polanus professor of divinity. The first book concerneth faith. The second concerneth good works. The principal points whereof are containe</cite>, trans. Elijahu Wilcocks (London: John Oxenbridge, 1595), pp 223-24.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Many signs of lamentations are expressed here. Which from hence and other Scriptures may more fully be gathered thus: Sighing, mourning, mournful songs, weeping, howling, fasting, changing of the garments, mourning women, Jer. 9:17; 2 Chron. 35:25; Amos 5:16, rending of the clothes, wearing black and sackcloth, sitting on the ground and keeping silence, lying prostrate upon the ground, sitting, lying, covering, rolling, wallowing in ashes, in dust and ashes, casting up dust, ashes, earth upon them and their heads, spreading and wringing the hands, laying the hands upon the head, smiting with the hand, stamping with the feet, hanging down the head, uncovering the head and bare, and again in some ages, the covering the head, covering head and face too, as our close mourners, covering the upper lip, bare-foot, shaving the head and beard, making baldness, plucking off the hair, beating the breast, printing marks upon the flesh, tearing it, cutting it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-richardson.html">John Richardson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Choice Observations &amp; Explanations upon the Old Testament</cite>, … which are Additionals to the Large Annotations made by some of the Assembly of Divines… (d. 1654; London, 1655), on Lamentations, p. 425 Richardson (1580-1654) was an English bishop of the Church of Ireland.</span></figcaption>

edbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=Many%20signs%20of%20lamentations%20are%20expressed,the%20flesh%2C%20tearing%20it%2C%20cutting%20it&amp;text=Many%20signs%20of%20lamentations%20are%20expressed%20here.%20Which&amp;text=marks%20upon%20the%20flesh%2C%20tearing%20it%2C%20cutting%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-65b12e97ec" data-kw="">
<blockquote><p>Again, we say that their auricular Confession, wherein all, even the private sins of a man must be numbered, as near as they can remember, and whispered into the ear of the Priest; we affirm, I say, that such a Confession is the invention of man’s brain, whereof there is no commandment or example extant in the whole Scripture:

Yea verily the will of God is, that many private sins, unto which we alone are privy, should be concealed, &amp; not uttered, even as God doth cover the multitude of our private sins of his free will and mercy, wherewith he embraceth us in Christ Jesus. Notwithstanding this, he requireth of us that we privately repent of them, so oft as we shall remember them.</p></blockquote>

<blockquote><p>Ma. Now remaineth the last Commmandment?

Sch. Thou shalt not cover thy Neighbour’s house. Thou shalt not covet thy Neighbour’s wife, nor his servant, nor his Maid, nor his Ox, nor his Ass, nor any thing that is his.

Ma. What is more commanded here than was before?

Sch. God hath before forbidden evil doings &amp; corrupt affectations of the mind; but now he requireth of us a more precise pureness, that we suffer not any desire, be it never so light, nor any thought, be it never so small, in any wise swerving from right, once to creep into our heart. For it is meet that even in our very hearts and minds, should shine before God most perfect pureness and cleanness. For no innocency and righteousness, but that which is most perfect, can please him: whereof he hath also set before us this Law as a most perfect Rule.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-nowell.html">Alexander Nowell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechism, or Instruction of Christian Religion, to be learned of all youth, next after the little Catechism: Appointed in the Book of Common Prayer</cite>, (London: John Day, 1572), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>B.—But which of the two do you think most conformable to nature; that vagrant and solitary life, or the social and unanimous assemblage of men?

M.—Undoubtedly the unanimous assemblage of men, whom

Utility herself, from whom, on earth,

Justice and equity derive their birth,

first collected into masses and taught,

Fenc’d by one wall, and by one key and bar,

From open’d gates to pour the tide of war.

B.—What! do you imagine that utility was the first and principal cause of human union?

M.—Why not? since the lesson inculcated by the greatest sages is, that men were made by nature for men.

B.—To certain individuals, indeed, utility seems to have great influence, both in the formation and in the maintenance of society. But, if I am not mistaken, their assemblage claims a much higher origin, and the bond of their union is of a much earlier and more venerable date. For, if every individual were to pay attention only to his own interest, there is ground for suspecting, I fear, that this very utility would rather dissolve than unite society.

M.—That observation may, perhaps, be true. But I should be glad to hear what is your other source of human association.

B.—It is a certain innate propensity, not only in men, but also in other animals of the gentler tribes, to associate readily, even without the allurements of utility, with beings of their own species. But of the brute creation it is not our present business to treat. Men we certainly find so deeply impressed, and so forcibly swayed by this natural principle, that, if any of them were to enjoy, in abundance, everything that is calculated either for the preservation and health of the body, or for the pleasure and amusement of the mind, he must, without human intercourse, experience life to be a burden.

This is such a notorious truth that even the persons who, from a love of science and a desire of investigating truth, have retired from the bustle of the world and lived recluse in sequestered retreats, have neither been able, for a length of time, to bear a perpetual exertion of mind, nor, upon discovering the necessity of relaxation, to remain immured in solitude, but readily produced the very result of their studies; and, as if they had laboured for the common good, added the fruit of their labours to the common stock. Hence it is my opinion, that if any person be so attached to solitude as to shun and fly the society of men, he is actuated rather by a disease of the mind than a principle of nature. Such, according to report, was Timon of Athens, and Bellerophon of Corinth,

A wretch, who, preying in corrosive pain

On his own vitals, roam’d the Aleian plain

With comfortless and solitary pace,

Shunning the commerce of the human race.

M.—Here our sentiments are not far from coincidence. But the term nature, adopted by you, is an expression, which, from habit, I often use rather than understand; and it is applied by others so variously, and to such a multitude of objects, that I am generally at a loss about the idea which it conveys.

B.—At present I certainly wish nothing else to be understood by it but the light infused into our minds by the divinity; for, since God created this dignified animal

Erect, of deeper reach of thought possess’d,

And fit to be the lord of all the rest,

he not only bestowed upon his body eyes, by whose guidance he might shun what is adverse, and pursue what is adapted to his condition, but also presented to his mind a kind of light, by which he might distinguish vice and infamy from virtue and honour. This power some call nature, some the law of nature: I certainly hold it to be divine, and am thoroughly persuaded that

Nature and wisdom’s voices are the same.

Of this law, too, we have from God a kind of abridgement, comprehending the whole in a few words, when he commands us to love him with all our heart, and our neighbours as ourselves. The sacred volumes, in all the books which relate to the formation of mortals, contain hardly anything else but an explanation of this law.

M.—Do you then conceive that human society derives its origin not from any orator or lawyer that collected the dispersed tribes of men, but from God himself?

B.—That is positively my opinion; and, in the words of Cicero, I think that nothing done upon earth is more acceptable to the sovereign Deity, that rules this world, than assemblages of men called states, and united upon principles of justice. The different members of these states politicians wish to have connected by ties similar to the coherence subsisting between all the limbs of our body, to be cemented by mutual good offices, to labour for the general interest, to repel dangers and secure advantages in common, and, by a reciprocation of benefits, to conciliate the affections of the whole community.</p></blockquote>

<blockquote><p>Instead then of listening to infidel counsel, and shutting up our churches at any of the wonted [accustomed] times of worship, let their doors be invitingly opened, and with frequency let sincere supplication, with humiliation and fasting, be presented to our merciful God. This is a duty which ought not to be perfunctorily performed; but one to which individuals, and families, and fellowships, and all other religious associations, are bound to attend, and in which they ought to abound, praying that a spirit of grace and of supplication may be poured out upon all; and that, by repentance and reliance on the efficacious atonement of our blessed Redeemer, God may be graciously pleased to hear and to heal. Jesus has given every encouragement to believing social prayer in his name: “ If two of you shall agree on earth as touching any thing that they shall ask. it shall be done for them of my Father which is in heaven.” Mat. xviii. 19. Let united, fervent, and believing supplication be sent up then to the throne of God, and we shall have reason to rejoice in the issue. Let it not be said of us as it is written against Asa, King of Judah, after all the Lord had done for him, who “ was diseased in Iris feel, until his disease was exceeding great; Yet in his disease lie sought to the Lord, but to the physicians.” 2 Chron. xvi. 12. But in the midst of abounding sin and alarming indifference, it is matter of the greatest consolation to each individual believer, that whatever becomes of the nation, his own faith and repentance will not pass unrewarded, if he truly put his trust and dependence on the living God.</p></blockquote>

<blockquote><p>The judicial law is entirely abrogated so far as it concerns the distinction of Jews from the Gentiles, and the typical signification of the kingdom of Christ. However, as far as it concerns a form of civil government, it is abrogated in some particular aspects. For whatever was a particular proper right, such as peculiarly concerned the Jews, of which sort was the law concerning the office of the Levites, as another concerning inheritances not being transferred from one tribe to another, all of this kind have ceased. But insofar as it concerned common right, enacted according to the law of nature for all men together, of which sort are the laws concerning the punishments for crimes, these same judicial laws all remain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alting.html">Johann Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scriptorum Theologicorum Heidelbergensium Tomus Primus, continens Locos Communes</cite>, (Amstelodami, Apud Joannem Janssonium, 1646), Locorum Theologicorum, Pars Prior, Locus VI, pp 100–13. Quoted in Johannes Piscator, Disputations on the Judicial Laws of Moses, trans. Adam J. Brink, ed. Joel McDurmon (1646; Powder Springs GA: American Vision Press, 2015), p. 59n.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

rget="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-678f7064e9" data-kw="">
<blockquote><p>…hereafter we must see concerning the selling and buying of things necessary… it is a thing doubtless greatly material that not only things hurtful be not brought into the city, but also the things good and profitable should be brought, but with such a proviso that the things that are to be brought in be set abroad and sold with least danger. Here therefore laws are to be made [of] what kinds of meats [foods] may be lawful to be sold and what not… and a certain penalty by the Preservers [civil health officials appointed for the time of the plague] to be set upon the offenders. … Lastly, also as touching the place wherein all things pertaining unto meat and drink are to be sold, something must be added. For it seems not convenient that all things should be brought into one market. For so it must needs be that a mighty multitude of people should come together… the infection must with all diligence be shunned, as has been often said already. There must therefore be ordained many places in sundry parts of the city where those things must be set which pertain unto food and are needful for everyone. Let there also be a several [different] market for flesh and fish, for herbs and fruits, that all discommodities which may arise by the mingling together of a multitude of people and bringing of things sellable, may with all diligence be avoided.</p></blockquote>

<blockquote><p>The improper binder [of the conscience] is that which has no power or virtue in itself to bind conscience: but does it only by virtue of God’s Word or of some part of it. It is threefold: human laws, an oath, a promise.</p></blockquote>

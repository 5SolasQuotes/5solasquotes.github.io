<blockquote><p>Q. How many things do we pray for in this petition [“Thy kingdom come”]?

A. For two things.

Q. What is the first?

A. That God will send faithful Pastors to preach his Word.

Q. What is the second?

A. That GOD will send Christian Princes to give countenance to it.</p></blockquote>

<blockquote><p>A Prayer for the King and Parliament, fit to be used by all good Christians daily in their Houses.

O God, the great Protector and guider of all Kings and Kingdoms, mercifully look with thy favourable eyes of mercy, upon this distressed Kingdom, and so inspire the heart of our Royal King Charles, whom thou hast called to the state and government of this Kingdom, and who through thy mercy, hath taken upon him the same, that he may effect all things to the honour and glory of thy name, and that he may receive the increase of all virtues, wherewith being decently adorned, he may both be able to avoid the monstrousness of vices, as also to come unto thee right gracious: and grant O merciful God, that there may be a true peace, and unity between Him and His Parliament and that thou O God, so inspire him with thy holy spirit, that he may hearken to his Parliament, and be ruled by them in all things that may be for the good of His sacred Person? and for His whole Kingdom[.]

[A]nd with the same holy spirit so inspire the hearts of this Parliament, whom it bath pleased thee to call together from several parts of this Kingdom, for the general good of the same, that they may do nothing but what may be to thy honour and glory, and that they may grow and persevere in all manner of virtue, setting all things in due order for the good of the kingdom; and that thy true Religion may here again be thoroughly settled amongst all men: Thou wouldst O God that none should perish, favourably look upon the souls deceived by devilish deceit of heretical Popish Sectaries and impiety, and remove from their hearts all such foulness, that they may be united to thy holy Church; and that all manner of wars or dissenions amongst thy people may be purged, and that thy servants earnestly craving thy mercy, the cruelty of their enemies be dispersed, thy Church truly settled, our king and Parliament faithfully united, we may evermore praise thee with incessant thankfulness, who livest and reignest one true and living God, world without end, Amen.</p></blockquote>

<blockquote><p>II. Should saints and angels be invoked? No.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Practical Theological Disputation on Sin, pt. 2’</cite>, tr. Onku with AI (Leiden: Johann Elsevir, 1660), Corollaries Latin</span></figcaption>

</figure><figure class="quote" id="q-5619110d65" data-kw="">
<blockquote><p>Prayer consists in calling upon the true God, and arises from an acknowledgment and sense of our want, and from a desire of sharing in the divine bounty, in true conversion of heart and confidence in the promise of grace for the sake of Christ the mediator, asking at the hands of God such temporal and spiritual blessings as are necessary for us; or in giving thanks to God for the benefits received. The genus or general character of prayer consists invocation or adoration. Adoration is often used in the sense of the whole worship of God, since we regard him as the true God, whom we worship. Prayer is a species or part of invocation, for to call upon the true God is to ask of him such things as are necessary both for soul and body, and to render thanks to him for benefits received. It is here used in the sense of the general character of pray. There are, therefore, two species or parts comprehended in prayer—petition and thanksgiving. Petition is a prayer asking of God those blessings necessary both for the soul and body. Thanksgiving is prayer acknowledging and magnifying the benefits received from God, and binding those who receive these gifts to such gratitude as is pleasing to God. Thankfulness in general consists in acknowledging and professing what and how great is the benefit received, and in binding those who are the recipients thereof to the performance of such duties as are mutual, possible and becoming. It comprehends, therefore, truth and justice. The apostle Paul, in his first Epistle to Timothy, 2:1, enumerates four species of prayer, saying, “I exhort, therefore, that first of all supplication, prayers, intercessions, and giving of thanks, be made for all men.” The first includes prayers against evil things; the second, petitions for good things; the third, intercession for others; and the fourth, thanksgiving for benefits received and evils warded off. This distinction is drawn from the end or design of prayer. Prayer is also distinguished into public and private prayer, from the circumstances of person and place. Private prayer is the intercourse which a faithful soul has with God, asking, alone and apart from others, certain blessings for himself, or for others; or giving thanks for benefits received. This form of prayer is not restricted to any particular words or places, for oftentimes the heart, when burdened and distressed, gives utterance to nothing more than sighs and groans; and the Apostle commands “that men pray every where, lifting up holy hands.” (1 Tim. 2:8.) Public prayer is that which, by the use of certain words, is offered up to God by the whole church in the congregation, the minister leading, as it is right and proper that he should in the public gatherings of the church. Language, or the use of the tongue, is necessary for this form of prayer. Hence Christ said: When ye pray, say, Our Father, &amp;c. It was also chiefly for this that the tongue was made, that God might be praised and magnified by it; and it is out of the abundance of the heart that the mouth speaketh. Lastly, by this others are also invited to praise and worship God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, (Cincinnati, OH: Elm Street Printing Company, 1888), 619–20.</span></figcaption>

n of prayer. Prayer is also distinguished into public and private prayer, from the circumstances of person and place. Private prayer is the intercourse which a faithful soul has with God, asking, alone and apart from others, certain blessings for himself, or for others; or giving thanks for benefits received. This form of prayer is not restricted to any particular words or places, for oftentimes the heart, when burdened and distressed, gives utterance to nothing more than sighs and groans; and the Apostle commands “that men pray every where, lifting up holy hands.” (1 Tim. 2:8.) Public prayer is that which, by the use of certain words, is offered up to God by the whole church in the congregation, the minister leading, as it is right and proper that he should in the public gatherings of the church. Language, or the use of the tongue, is necessary for this form of prayer. Hence Christ said: When ye pray, say, Our Father, &amp;c. It was also chiefly for this that the tongue was made, that God might be praised and magnified by it; and it is out of the abundance of the heart that the mouth speaketh. Lastly, by this others are also invited to praise and worship God.”

.%E2%80%9D+The+first+includes+prayers+against+evil+things%3B+the+second%2C+petitions+for+good+things%3B+the+third%2C+intercession+for+others%3B+and+the+fourth%2C+thanksgiving+for+benefits+received+and+evils+warded+off.+This+distinction+is+drawn+from+the+end+or+design+of+prayer.+Prayer+is+also+distinguished+into+public+and+private+prayer%2C+from+the+circumstances+of+person+and+place.+Private+prayer+is+the+intercourse+which+a+faithful+soul+has+with+God%2C+asking%2C+alone+and+apart+from+others%2C+certain+blessings+for+himself%2C+or+for+others%3B+or+giving+thanks+for+benefits+received.+This+form+of+prayer+is+not+restricted+to+any+particular+words+or+places%2C+for+oftentimes+the+heart%2C+when+burdened+and+distressed%2C+gives+utterance+to+nothing+more+than+sighs+and+groans%3B+and+the+Apostle+commands+%E2%80%9Cthat+men+pray+every+where%2C+lifting+up+holy+hands.%E2%80%9D+%281+Tim.+2%3A8.%29+Public+prayer+is+that+which%2C+by+the+use+of+certain+words%2C+is+offered+up+to+God+by+the+whole+church+in+the+congregation%2C+the+minister+leading%2C+as+it+is+right+and+proper+that+he+should+in+the+public+gatherings+of+the+church.+Language%2C+or+the+use+of+the+tongue%2C+is+necessary+for+this+form+of+prayer.+Hence+Christ+said%3A+When+ye+pray%2C+say%2C+Our+Father%2C+%26c.+It+was+also+chiefly+for+this+that+the+tongue+was+made%2C+that+God+might+be+praised+and+magnified+by+it%3B+and+it+is+out+of+the+abundance+of+the+heart+that+the+mouth+speaketh.+Lastly%2C+by+this+others+are+also+invited+to+praise+and+worship+God.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+The+Commentary+of+Dr.+Zacharias+Ursinus+on+the+Heidelberg+Catechism%2C+%28Cincinnati%2C+OH%3A+Elm+Street+Printing+Company%2C+1888%29%2C+619%E2%80%9320.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5619110d65.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5619110d65.html">Permalink</a><a class="src" href="https://heidelblog.net/2018/06/what-is-prayer/" rel="noopener" target="_bla

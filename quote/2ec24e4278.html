<blockquote><p>nature; a term having three primary meanings in scholastic theology and in Protestant orthodox usage: (1) essence; (2) a particular kind or species of essence in its actual existence; (3) the entire physical universe and its phenomenon… In the third sense, natura simply refers to the order of nature and is used in such terms as lex naturalis (q.v.), natural law, or theologia naturalis (q.v.), natural theology–the law implicit in the order of the phenomenal world and the knowledge of God obtainable from examination of the physical universe.</p></blockquote>

<blockquote><p>The means for the knowledge of God: The more general means XIX. Now, concerning the supports by which we arrive at the knowledge of God, they are observed to be of two kinds. In the first more general kind are enumerated three ways to arrive at the knowledge of God, namely: (1) the way of causality, whereby having moved through various second causes as if by Jacob’s ladder, we finally arrive at the highest step, where God is, according to the mode which we described above in §VI. And this knowledge is what the apostle seems to indicate in Romans 1:19. (2) The way of eminence, by which whatever there is of absolute perfection in creatures we attribute with the highest eminence to the Creator, because of the fact that no one can confer on another what he does not have either formally or eminently, nor can an effect be conceived such that it is on the whole more excellent than its own cause. The psalmist seems to use this way in Psalm 94:9. Indeed, it is fitting by this support to interpret all anthropopathic and metaphorical expressions. (3) The way of negation, by which we entirely remove from him any imperfection that occurs in the creatures, for example, corporality, mortality, finitude, and the like. Scripture seems to follow this way in Numbers 23:19 and Psalm 90:2–3. And indeed in this manner, we arrive by this threefold way at the knowledge of God, such that (1) the first way chiefly leads to his relative attributes, through which he is called Creator, preserver, governor, and mover; (2) the second way leads to his communicable and affirmative attributes, for example, wisdom, righteousness, and so forth, which we will discuss in their own place; and (3) the third leads to his incommunicable and negative attributes, such as infinity, immutability, and so forth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 2, bk. 2, ch. 2, sect. 19, p. 56 The more specific means Mastricht lists as: (1) the divine names in Scripture, (2) the divine attributes in Scripture, (3) the works of God, (4) the Word of God.</span></figcaption>

<blockquote><p>It [theology] is called doctrine, not to separate it from understanding, knowledge, wisdom, art or prudence–for these go with every exact discipline, and most of all with theology–but to mark it as a discipline which derives not from nature and human inquiry like others, but from divine revelation and appointment. Isa. 51:4, ‘Doctrine shall go forth from Me;’ Mt. 21:25, ‘From heaven… Why then did you not believe him?’; Jn. 9:29, ‘We know that God has spoken to Moses;’ Gal. 1:11-12, ‘The gospel… is not according to man. For I neither received it from man, nor was I taught it, but it came through a revelation;’ Jn. 6:45. 3. The principles of other arts, since they are inborn in us, can be developed through sense perception, observation, experience and induction, and so brought to perfection. But the basic principles of theology, though they be advanced by study and industry, are not in us by nature. Matt. 16:17, ‘Flesh and blood has not revealed this to you.’ 4. Every art has its rules to which the work of the person practicing it corresponds. Since living is the noblest work of all, there cannot be any more proper study than the art of living well. 5. Since the highest kind of life for a human being is that which approaches most closely the living and life-giving God, the nature of theological life is living to God. … 8. Although it is within the compass of this life to live both happily and well, euzoia, living well, is more excellent than eudaimonia, living happily. What chiefly and finally ought to be striven for is not happiness which has to do with our own pleasure, but goodness which looks to God’s glory… … 10. Now since this life so willed is truly and properly our most important practice, it is self-evident that theology is not a speculative discipline but a practical one–not only in the common respect that all disciplines have eupraxia, good practice, as their end, but in a special and peculiar manner compared with all others. 11. Nor is there anything in theology which does not refer to the final end or to the means related to that end–all of which refer directly to practice. 12. This practice of life is so perfectly reflected in theology that there is no precept of universal truth relevant to living well in domestic economy, morality, political life or law-making which does not rightly pertain to theology. 13. Theology, therefore, is to us the ultimate and noblest of all exact teaching arts. It is a guide and master plan for our hightest end, sent in a special manner from God, treating of divine things, tending towards God, and leading man to God. It may therefore not incorrectly be called theozoia, a living to God, theourgia, a working towards God, as well as theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, trans. John D. Eusden (1623; Baker, 1997), ch. 1, ‘The Definition or Nature of Theology’, p. 77</span></figcaption>

<blockquote><p>Aquinas’s argument is thus immune to the sorts of objections [David] Hume pressed upon design arguments, to the effect that the designer would have to work through corporeal organs the way human designers do, and would manifest complexity which itself requires explanation… They [Paley’s defenders] do not, and cannot deny that the designer at least could in principle be the sort Hume describes. But the Humean objections do not even get off the ground against Aquinas’s divine intelligence, who, being pure act, is necessarily absolutely simple and incorporeal.</p></blockquote>

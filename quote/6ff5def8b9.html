<main class="wrap"><figure class="quote" id="q-6ff5def8b9" data-kw="">
<blockquote><p>When the old prophet did invite the young prophet to eat bread and drink water with him, common civility made a table necessary in this single entertainment (1 Kings 13:20), ‘And it came to pass as they sat at the table…’ If it were a disrespect to invite friends to eat and drink with us, and yet when they come, not to place them at a table (where a table may be had), I know no reason why it ought not also to be conceived a wronging of Christ’s guests when they are not placed at his Table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, ... (Edinburgh, 1649), ch. 18, ‘Of the Use of a Table in the Lord’s Supper…’, p. 224</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ffa696fb07" data-kw="">
<blockquote><p>Mr. Sprint [an opponent] himself lays down one ground which proves the refusing of inconvenient ceremonies to be a greater duty than the preaching of the Word: for he holds that the substantials of the Second Table do overrule the ceremonials of the First Table, according to that which God says, ‘I will have mercy and not sacrifice,’ (Mt. 12:7). And elsewhere he teaches that to tend a sick person ready to die is a greater duty than the hearing of the Word. Now to practice inconvenient and scandalous ceremonies is to commit soul-murder, and so to break one of the most substantial duties of the Second Table. Therefore, according to Mr. Sprint’s own ground, the refusing of inconvenient and scandalous ceremonies is a greater duty than the preaching of the Word, which is but a ceremonial of the First Table, and if the neglect of tending a sick person’s body be a greater sin than to omit the hearing of many sermons, much more to murder the souls of men by practicing inconvenient and scandalous ceremonies, is a greater sin than to omit the preaching of many sermons, which is all the omission (if there be any) of those who suffer deprivation for refuising to conform unto inconvenient ceremonies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 1, p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-35fe3c05b1" data-kw="">
<blockquote><p>Good works are two fold: that is either the works of God’s worship, or of virtue. The former, that is, God’s worship, is commanded in the first table of the ten commandments: the other in the second.</p></blockquote>

</figure><figure class="quote" id="q-83af03d9b1" data-kw="">
<blockquote><p>V. That what God forbids, is at no time to be done; what He commands, is always our duty, and yet every particular duty is not to be done at all times. Thus sin is, under no pretense, to be committed. Accordingly, Moses, when he was in a prosperous condition in Pharaoh’s court, though he might have pretended that his greatness and the advantages which Israel might have expected from it, would be an excuse for his continuing to enjoy the pleasures of sin there; yet he was sensible that these considerations would not exempt him from guilt. Hence, ‘he forsook Egypt, and chose rather to suffer affliction with the people of God, than to enjoy the pleasures of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, … (New York: Robert Carter, 1855), vol. 2, p. 313</span></figcaption>

</figure><figure class="quote" id="q-29576b744b" data-kw="">
<blockquote><p>Paul says [in 1 Cor. 11:20] that in this way it is not the Lord’s supper that is partaken of — not that a single abuse altogether set aside the sacred institution of Christ, and reduced it to nothing, but that they polluted the sacrament by observing it in a wrong way. For we are accustomed to say, in common conversation, that a thing is not done at all, if it is not done aright. Now this was no trivial abuse, as we shall afterwards see. If you understand the words is not as meaning, is not allowable, the meaning will amount to the same thing… he condemns that profane admixture, which had nothing in it akin to the Lord’s Supper.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 11, verse 20</span></figcaption>

<main class="wrap"><figure class="quote" id="q-d3ac8d1b5e" data-kw="">
<blockquote><p>The Psalmist’s expression in the eyes of the Lord, are very pregnant to our purpose. Here is a description of eternity, proving that God seeth all things with one intuitive cast of his eye, and that although to us things are present, past and to come, yet to God all things are present, and although we are not able to reach this with our understanding, no more then a pigmy the Pyramids, yet we must rest more upon this Scripture assertion, then our own understanding, Quicquid de Deo dici (we may add cogitari) potest, eo ipso est indig∣num quia dici (cogitari) potest: and again dignè Deum aestimamus, dum inaestimabilm dicimus.

The Schoolmen dispute, whether those things which God did once know, he still knoweth, as for example, God once knew that Christ was to die, but now it is not true, that he is to die; and their resolution is, that we cannot properly say, God begins to know what he did, or ceaseth to know what he did, but rather that the thing it self beginneth to be known, or ceaseth to be known, so that the change is not in respect of God’s knowing, but the thing known, as when I see the Sun, and afterwards it is hid in the cloud, the change is not in my eye, but in the Sun; Hence they also resolve, that God knoweth all things simul together, that his knowledge is invariable, that it admitteth not of increase or decrease, that all things are present to him, and that as the Sun is always in actu lucendi, so God in actu intelligendi …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), p. 92.</span></figcaption>

n+asserted+and+vindicated%2C+from+the+errors+of+Papists%2C+Arminians%2C+Socinians%2C+and+more+especially+Antinomians+in+XXX+lectures+preached+at+Lawrence-Jury%2C+London%2C+%282nd+edn%2C+London%3A+Tho.+Underhill%2C+1651%29%2C+p.+92.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd3ac8d1b5e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d3ac8d1b5e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/06/09/anthony-burgess-on-gods-eternal-knowledge/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dce0b3aa99" data-kw="">
<blockquote><p>The Doctrine of the Jesuits, who albeit they teach the concurrence of the first cause, to be necessary unto each operation of the second cause: yet so, as it doth not determine, but is determined by the second cause: thus Bellarmine. So as not fore-going, only accompanying of the second cause: thus Vasquez. So as it co-operates with the second cause, not after the manner of a principle, but after the manner of an action: thus Suarez.

It determineth the second cause (say they) negatively, not by way of influence: which mystical sense of the Jesuits. Hurtado (himself also a Jesuit) opens by a familiar comparison, thus: As (saith he) in case you can write with two pens, and I holding one of them, hinder you writing with it, permitting you to write with the other: this permission compelleth not you to write, you are free to both: but if you write, it must be with that pen which I leave, not with that which I hold in my hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The orthodox evangelist. Or A treatise wherein many great evangelical truths (not a few whereof are much opposed and eclipsed in this perilous hour of the passion of the Gospel) are briefly discussed, cleared, and confirmed: as a further help, for the begetting, and establishing of the faith which i</cite>, (London: Henry Cripps and Lodowick Lloyd, 1654), p. 125.</span></figcaption>

<blockquote><p>In a wonderful and ineffable manner, that which is done even contrary to His will is not done apart from His will; for it would not happen if He did not permit it. Nor does He permit it unwillingly, but willingly. Nor would He, being good, permit evil to be done unless, being omnipotent, He were also able to bring good out of evil.” Augustine, Handbook on Faith, Hope &amp; Love, ch. 100] 2. Conditional, when He wills, some condition being put in us; so God would have all men saved on this condition, if they can believe. The first of these is by another name called Voluntas beneplaciti, the last Voluntas signi. God’s will is:

1. Secret, Voluntas propositi, that whereby He has absolutely and freely determined with Himself what He will do, permit or hinder. Ps. 115:3; Eph. 1:11; Rom. 9:18, called the will of God concerning us.

2. Revealed, Voluntas praecepti, that whereby God has manifested what He would have believed, done or left undone by his reasonable creatures, Mk. 3:35; 1 Thess. 4:3. That distinction of God’s will into beneplaciti et signi, differs little from this. Signi is the same with revealed. Beneplacitum is the decree properly so called, which may be either hidden or manifest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, 1654), bk. 2, ch. 7, ‘Of God’s Understanding that He is Omniscient, and of his Will’ | “The will of God is one and the same, but it is distinguished:¹ | 2. In respect of application to the creature, into: | 1. Absolute, when God wills and concludes anything concerning us without any condition in us.²</span></figcaption>

</figure><figure class="quote" id="q-6ccde3d345" data-kw="">
<blockquote><p>Here, then is another test of our Christian discipleship – a test, moreover, which I greatly fear many inwardly feel that they cannot at all abide. They inwardly respect real goodness; but to respect it is one thing, and so to love as to associate with it, and peculiarly to befriend and shelter it, is distinctly another.

And while I say not of now hearing me, that they are without natural affection. I yet would have you all to that you may utterly detest, and shun as would do the contagion of a pestilence, or of the grave, even all that is gracious; and that, should that persecution of which we at last been officially forewarned, be now to break forth upon us, it will be but in fulfilment of all our speculations upon human character, if we find the most active and relentless agents of it among those of our professing brethren, who have ever felt highest respect for real goodness, and yet have been farthest of all from ever liking it.</p></blockquote>

</figure><figure class="quote" id="q-7f9e890881" data-kw="omnipresence purity">
<blockquote><p>What place can defile a spirit? Is light polluted by shining upon a dunghill, or a sunbeam tainted by darting upon a quagmire? What can steam from the most noisome body, to pollute the spiritual nature of God? As he is of purer eyes than to behold iniquity, so he is of a more spiritual substance than to contract any physical pollution from the places where he doth diffuse himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Omnipresence of God</span></figcaption>

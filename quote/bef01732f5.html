<blockquote><p>In perfect accordance with the views respecting the moral law exhibited in the Sermon on the Mount, and widely different from what He said of the ceremonial institutions, was the action of our Lord in regard to the Sabbatism enjoined in the fourth command of the Decalogue. He gives no hint whatever of its coming abolition, but, on the contrary, recognised its Divine ordination, and merely sought to establish a more wholesome and rational observance of it than was dreamt of or admitted by the slaves of the letter.

On a variety of occasions He wrought cures on the Sabbath-day – so often, indeed, that the action must have been taken on purpose to convey what He deemed salutary and needful instruction for the time; and on one occasion He allowed His disciples to satisfy their hunger by plucking the ears of as they passed through a field. His watchful adversaries were not slow in marking this procedure, and charged our Lord with profaning the sacred rest of the Sabbath. How does He meet their reproaches? Not by quarrelling with the Divine command, or seeking to relax its obligation; but by explaining its true purport and design, as never meant to interfere with such actions as He performed or sanctioned.

In proof of this He chiefly appeals to precedents and practices which His adversaries themselves could not but allow, if their minds had been open to conviction – such as David being permitted in a time of extremity to eat the shew-bread, or themselves rescuing a sheep when it had fallen into a pit on the Sabbath – things necessary to the preservation and support of life; or things, again, of a sacred nature, such as circumcising children on the legal day, though it might happen to be a Sabbath, doing the work at the Temple connected with the appointed service, which in some respects was greater on the seventh than the other days of the week, yea, at times involved all the labour connected with the slaying and roasting of the Paschal lamb for tens of thousands of people.

With such things the parties in question were quite familiar; and they should have understood from them, that the prescribed rest of the Sabbath was to be taken, not in an absolute, but in a relative sense – not as simply and in every case cessation from work, irrespective of the ends for which it might be done, but cessation from ordinary or servile work, in order that things of higher moment, things touching on the most important interests of men, might be cared for. Its sacred repose, therefore, must give way to the necessary demands of life, even of irrational life, and to whatever is required to bring relief from actual distress and trouble. It must give way also to that kind of work which is more peculiarly connected with the service of God and with men’s restored fellowship with the life and blessedness of Heaven; for to promote this was the more special design of the Sabbatical appointment.

So, plainly, existing facts shewed even in Old Testament times, though the Pharisees, in their zeal for an abstract and imperious legalism missed the proper reading of them. Jesus grasped, as usual, the real spirit of the institution; for, we are to remember, He is explaining the law of the Sabbath as it then stood, not superseding it by another. He would have them to understand that, as it is not the simple abstraction of a man’s property (which may in certain circumstances be done lawfully, and for his own temporal good), that constitutes a violation of the eighth commandment, but a selfish and covetous appropriation of it by fraud or violence; so, in regard to the fourth, the prohibition of work had respect only to what was at variance with its holy and beneficent designs.

‘The Sabbath was made for man’ – with a wise and gracious adaptation to the requirements of his complex nature, as apt to be wearied with the toils, and in his spirit dragged downward by the cares of life; ‘not man for the Sabbath,’ as if it were an absolute and independent authority, that must hold its own, however hardly in doing so it might bear on the wants and interests of those placed under its control. It has an aim, a high moral aim, for the real wellbeing of mankind; and by a conscientious regard to this must everything, in regard to its outward observance, be ruled.</p></blockquote>

<blockquote><p>Eighthly, God under the New Testament has appointed all his worship in a plain, simple way, not to please the eye, or affect the heart, but only to draw out the spiritual exercise of the soul. Insomuch that it is the most difficult thing that can be: not to be offended at the simplicity of Gods worship now appointed; ‘I am afraid,’ says Paul, ‘as the serpent beguiled Eve, so your minds should be corrupted from the simplicity of the Gospel of Christ.’ [2 cor. 11:3] Paul was afraid of this: the Devil is to be feared more as a glittering subtle serpent than a raging roaring lion: and in nothing does his serpentine art appear more then in introducing worship that is pompous and ceremonious. As children love to play with babies; so do ignorant, carnal people with an external sensible worship. And the more spiritual any ordinance, or the administration of it is, the less glorious it is unto a corrupt heart; whereas a gracious heart [full of God’s grace] sees glorious majesty in spirituality. Christ’s presence in the temple, expounding, informing and reforming, made the second temple more glorious than the former, which did exceed in gold and other magnificence. As the painting of a precious jewel hinders the native and proper luster of it, so does human pomp added to the pure institutions of Christ take off from the innate beauty and glory of them. God indeed in the Old Testament appointed a solemn external worship, full of sensible glory and pomp, but it was because they were infants, and children had rather have a baby than a rich inheritance. Expect therefore in the worship of God, that which may exercise thy faith, heavenly-mindedness, and dependency upon God, which may make a divine impression and stamp upon thy soul, not that which may ravish thy eyes and thy ears.</p></blockquote>

<blockquote><p>It is assumed that this is not a mere party work for the purposes of mere partyism. Few deny, that, throughout all the Departments of the Church, a reform is needed in her Psalmody. The subject now advocated is a solemn institution of the Church of God, authorized by her standards, and the main points of which, now advocated, are sustained by many, if not by all, of the ablest men of her several denominations.

The argument is not a little sectional one, but a plea upon the broad ground of Christian institution, for Christian consistency, truth, and influence, in a deeply interesting part of the solemnities of Zion. In the sustentation of the plea, the voice of some of the most distinguished men of the Presbyterian, Episcopal, and Baptist, families of the great Christian commonwealth, is distinctly heard.</p></blockquote>

<blockquote><p>Excess in apparel, as it argueth the levity and wantonness of the mind, by daily changing of fashions, apishly imitating the French, Spanish, &amp; Italian cut: so doth it transform us into their lewd manners: wherein not youths only, but old Dotards also (whom it as well beseemeth, as a Fiddle doth an Ass) do offend. Every man in his Velvet, Silks, Gold, Silver, Pearls, whereas in the mean time, the poor and needy in great numbers starve for cold &amp; nakedness.</p></blockquote>

</figure><figure class="quote" id="q-51197250fa" data-kw="">
<blockquote><p>Their [the Independents’] second objection is this, say they, the Holy Ghost says expressly that they did meet all ‘at one place’ [Acts 2:1]… and that the whole mutlitude did come ‘together’, as for instance, Acts 2:1, it is said, ‘They were all with one accord in one place’, and in the same chapter, verse 46, ‘They continuing daily with one accord in the Temple, etc.’ And it is also said, Acts 6:2, ‘then the twelve called the multitude of disciples unto them, etc.’ And verse 5, ‘And the saying pleased the whole multitude.’ Now to take off this exception which seems to be the most plausible of their objections: First consider what we spoke from the Scripture of their number, and what thousands were in this Church: and let any reasonable man conceive how it could be possible that all those should meet in one place; and therefore that meeting in one place must be taken in another sense: It’s observed by the learned that the word here turned, ‘meeting together in one place’, epi to auto [Acts 2:1] does not always signify a meeting together in one room, but the agreeing of the affection and judgment in one thing: And for the clearing of this they cite Acts 4:25-26, ‘Why did the heathen rage, and the people imagine vain things? The kings of the earth stood up, and the rulers were gathered together against the Lord, etc.’ Now it is the same word that is there turned, ‘in one place,’ which is here turned, ‘gathered together’, and certainly no place of Scripture will prove that Herod, Pontius Pilate, Jew and Gentile did meet in one place to consult about the death of Christ, but only they agreed in one judgment and hearty affection about it… …[Acts 2] verse 46, ‘They continuing daily with one accord in the Temple.’… it is only mentioned [that] they came to the Temple to hear the Word, but not that they were all of one congregation, partaking of all ordinances in one place; for it is said afterwards, ‘They break bread from house to house’, meaning the sacrament of the Lord’s Supper, which they did partake of from house to house in their particular congregations.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-456a527028" data-kw="">
<blockquote><p>Touching that saying, ‘Denying the Lord that bought them;’ none are properly said to be bought by the Lord, but the elect; yet in a large sense, all to whom the Gospel comes are said to be bought by Him, yea all men, because the price He paid is sufficient to ransom all; neither is it by any defect therein that any perish, but through their own wickedness and unbelief.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Whole Bible</cite>, (London, 1631), vol. 3, p. 146 on 2 Pet. 2:1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cec55288b5" data-kw="">

</figure><figure class="quote" id="q-f34c6a4968" data-kw="">
<blockquote><p>XXIII. While Christ’s passion is minimized by the foregoing errors, those who teach that he died for all human beings (pro omnibus et singulis) broaden the object of his passion more than is allowable. Of course, if we take into consideration the magnitude and worthiness of the merit, we admit that it would suffice for the redemption of ten worlds; but if we take the plan of God and the intention of Christ into consideration, then it is false to say that Christ died for every person. For this reason others say that his death was sufficient for all, but not effective for all; that is, the merit of Christ, because of his worthiness, is sufficient for all, but it is not effective for all in its application, because Christ did not die with the intention that his death be applied to all. Why should He die for those for whom He would not pray?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity in</cite>, ed. John Beardslee, Reformed Dogmatics (Grand Rapids: Baker, 1977), pp. 105-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-37dfb2a0f9" data-kw="">
<blockquote><p>Secondly I answer that we do acknowledge with glad minds that Christ died for all (the scripture averring so much): but we utterly deny that He died for all and everyone alike in respect of God, or, as well for the damned as elect, and that effectually on God’s part. … Again, if all and every one be effectually redeemed, all and every one are reconciled unto God, because that the forgiveness of sins and the satisfaction for the same are inseparably joined together. Yea and Paul places redemption in the remission of sins where he says: ‘By whom we have redemption through his blood, even the forgiveness of sins.’ (Eph. 1:7 &amp; Col. 1:14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian &amp; Plain Treatise of the Manner &amp; Order of Predestination &amp; of the Largeness of God’s Grace</cite>, (d. 1602: London: Welby &amp; Clarke, 1606), 4th Crimination, pp. 82-83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-ee9e95d760" data-kw="">
<blockquote><p>We grant that Christ’s death is sufficient to save many thousand worlds: we grant again it is every way most effectual in itself: but that it is effectual in, or unto the person of every man, that we deny.</p></blockquote>

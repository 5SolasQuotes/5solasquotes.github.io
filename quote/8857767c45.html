<main class="wrap"><figure class="quote" id="q-8857767c45" data-kw="">
<blockquote><p>It must be granted, however, that, altogether apart from the exegesis of these passages, some sort of reference of the atonement to every man may be affirmed; and inasmuch as this reference is a beneficial one, we are led to posit back of it a form of love equally comprehensive and effective, which will have to be coordinated with the three other forms of universal love previously distinguished [ (1) ‘this indiscriminate goodness in the sphere of nature,’ (2) ‘the collective love which embraces the world as an organism,’ (3) ‘the love of compassion which God retains for every lost sinner’]. The Bible gives us no right to say that Christ in His atoning work acted as the legal substitute of every individual human being. But certainly neither does it require us to assert that for the non-elect the atonement is void of all benefit or significance. Every man is indebted for great privileges to the cross of Christ. The continued existence of the race in spite of sin, but for it [the cross of Christ], would have been impossible. The atonement by its universal sufficiency renders the gospel a message which can be preached to every human being, and the offer of the gospel illumines the entire earthly existence of every one to whom it comes by the hope that he may find himself through faith one of the actual heirs of redemption. It makes an immense difference whether our present life be spent in the consciousness of this hope or without it. This may be best realized by making clear to ourselves what a tremendous change the withdrawal of the offer of the gospel would produce in the entire outlook upon life, even for those who do not accept its terms. On the other hand, the love from which these universal benefits of the atonement flow should never be so defined as to obscure the fact that it falls short of the intention to bestow efficacious grace. We must also remember that as it embodies itself in the offer of the gospel it can be called universal in a qualified sense only, since its field is circumscribed by the actual spread of the gospel at any given time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Scriptural Doctrine of the Love of God” in The Presbyterian &amp; Reformed Review</cite>, (1902), from The Presbyterian &amp; Reformed Review, 13:1-37, p. 19</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-498d9d8ee6" data-kw="">
<blockquote><p>If you look into 1 Peter 3:19-20, you there find that Christ “went and preached unto the spirits in prison; which sometime were disobedient, when once the long-suffering of God waited in the days of Noah.” The meaning of which is, that in the days before the flood, Christ by his Spirit strove [Gen. 6:3] with the disobedient and rebellious sinners in the ministry of Noah, who then were living men and women as we are, but now are “spirits in prison,” that is, damned souls in hell, for their disobedience…</p></blockquote>

</figure><figure class="quote" id="q-67c096ad66" data-kw="">
<blockquote><p>In point of fact, the Old Testament has a great deal to teach on the benevolent side of God’s self-revelation to the world at large. The strongest of terms are used on occasion to emphasize this truth. Even the covenant conception is not deemed too sacred to be employed for the purpose of describing the solemn manner in which God pledged to the whole of creation, in the day of Noah, His abundant, ever-flowing kindness in the sphere of natural life, His longsuffering in the view of universal sin, His common grace working for the restraint of sin. It is attributed to His righteousness, universally revealed, that He keeps this covenant and preserves man and beast. As Jonah took pity on his gourd, so He pities and spares the Ninevites and their cattle. His mercy is wider and deeper than the ocean of human misery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Doctrine of the Love of God in The Presbyterian &amp; Reformed Review 13:1-37</cite>, (1902), p. 11</span></figcaption>

<blockquote><p>41. And indeed, God loves all his creatures, insofar as they are his creatures, but not with the same level of love. For he loves some in Christ, whom he chose in Christ from eternity according to the will of his good pleasure. He does not love the reprobate in the same way, whom nevertheless he does not damn as innocent, but on account of their voluntary wickedness and willful unbelief.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-tossanus.html">Daniel Tossanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Theological Disputation on that Place of Paul</cite>, 1 Cor. 15:22, ‘As in Adam All Die, so in Christ All shall be Made Alive’, &amp; of this Question, Whether Christ has Died for All?, pt. 5 tr. Michael Lynch (Heidelberg, 1589)</span></figcaption>

</figure><figure class="quote" id="q-2ddd2ba5cf" data-kw="">
<blockquote><p>When the goodness of God is exercised towards His rational creatures, it assumes the higher character of love, and this love may again be distinguished according to the objects on which it terminates. In distinction from the goodness of God in general, it may be defined as that perfection of God by which He is eternally moved to self–communication. Since God is absolutely good in Himself, His love cannot find complete satisfaction in any object that falls short of absolute perfection. He loves His rational creatures for His own sake, or, to express it otherwise, He loves in them Himself, His virtues, His work, and His gifts. He does not even withdraw His love completely from the sinner in his present sinful state, though the latter’s sin is an abomination to Him, since He recognizes even in the sinner His image-bearer. John 3:16; Matt. 5:44,45. At the same time He loves believers with a special love, since He contemplates them as His spiritual children in Christ. It is to them that He communicates Himself in the fullest and richest sense, with all the fulness of His grace and mercy. John 16:27; Rom. 5:8; I John 3:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology, Part I</cite>, ch. 7, On the Communicable Attributes of God, C. Moral Attributes, 1. The Goodness of God, b. The Love of God</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“When the goodness of God is exercised towards His rational creatures, it assumes the higher character of love, and this love may again be distinguished according to the objects on which it terminates. In distinction from the goodness of God in general, it may be defined as that perfection of God by which He is eternally moved to self–communication. Since God is absolutely good in Himself, His love cannot find complete satisfaction in any object that falls short of absolute perfection. He loves His rational creatures for His own sake, or, to express it otherwise, He loves in them Himself, His virtues, His work, and His gifts. He does not even withdraw His love completely from the sinner in his present sinful state, though the latter’s sin is an abomination to Him, since He recognizes even in the sinner His image-bearer. John 3:16; Matt. 5:44,45. At the same time He loves believers with a special love, since He contemplates them as His spiritual children in Christ. It is to them that He communicates Himself in the fullest and richest sense, with all the fulness of His grace and mercy. John 16:27; Rom. 5:8; I John 3:1.”

— Louis Berkhof, Systematic Theology, Part I, ch. 7, On the Communicable Attributes of God, C. Moral Attributes, 1. The Goodness of God, b. The Love of God">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+the+goodness+of+God+is+exercised+towards+His+rational+creatures%2C+it+assumes+the+higher+character+of+love%2C+and+this+love+may+again+be+distinguished+according+to+the+objects+on+which+it+terminates.+In+distinction+from+the+goodness+of+God+in+general%2C+it+may+be+defined+as+that+perfection+of+God+by+which+He+is+eternally+moved+to+self%E2%80%93communication.+Since+God+is+absolutely+good+in+Himself%2C+His+love+cannot+find+complete+satisfaction+in+any+object+that+falls+short+of+absolute+perfection.+He+loves+His+rational+creatures+for+His+own+sake%2C+or%2C+to+express+it+otherwise%2C+He+loves+in+them+Himself%2C+His+virtues%2C+His+work%2C+and+His+gifts.+He+does+not+even+withdraw+His+love+completely+from+the+sinner+in+his+present+sinful+state%2C+though+the+latter%E2%80%99s+sin+is+an+abomination+to+Him%2C+since+He+recognizes+even+in+the+sinner+His+image-bearer.+John+3%3A16%3B+Matt.+5%3A44%2C45.+At+the+same+time+He+loves+believers+with+a+special+love%2C+since+He+contemplates+them+as+His+spiritual+children+in+Christ.+It+is+to+them+that+He+communicates+Himself+in+the+fullest+and+richest+sense%2C+with+all+the+fulness+of+His+grace+and+mercy.+John+16%3A27%3B+Rom.+5%3A8%3B+I+John+3%3A1.%E2%80%9D%0A%0A%E2%80%94+Louis+Berkhof%2C+Systematic+Theology%2C+Part+I%2C+ch.+7%2C+On+the+Communicable+Attributes+of+God%2C+C.+Moral+Attributes%2C+1.+The+Goodness+of+God%2C+b.+The+Love+of+God&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2ddd2ba5cf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2ddd2ba5cf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/common-grace#:~:text=When%20the%20goodness%20of%20God%20is,16%3A27%3B%20Rom.%205%3A8%3B%20I%20John%203%3A1&amp;text=When%20th

<blockquote><p>5. Also, there is a difference between the constraining of a circumcised or baptized people to worship God in the purity of ordinances, as they have been engaged thereto, which was Josiah’s practice, and the constraining of a people to engage and be baptized which were not formerly engaged; because, actual members of a Church have not even that liberty as others have to abandon ordinances: and this puts them to no new engagement in religion, but presses them to continue under former engagements and accordingly to perform: Hence we see, that both in the Old and New Testament, Church-members have been put to many things and restrained from many things, which had not been pertinent in the case of others. See, 2 Chron. 15:13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal... (Edinburgh: Higgins, 1659), pt. 3, ch. 4</cite>, pp. 253-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0350d090e9" data-kw="">
<blockquote><p>[1. The Rule of Reformation.] The rule of building the house of God, and of the reformation of religion is the same and perpetual: the commandment of God, and not the commandment of man one or more, whether they be civil or ecclesiastical persons. It is their part to provide according to their places and callings, to command and direct that the Commandment of God be obeyed. This King commands not that his will be done, but what God has commanded. Neither King nor Parliament can command otherwise. Civil powers have great authority, not only in things civil, but in matters of Religion; and they sin against God, if they use not the authority which God hath put in their hands, for the good of Religion. To them belongs inspection and watching over, not only ecclesiasticos [ecclesiastical persons], but ecclesiastica [that which is ecclesiastical]. Ecclesiastical persons are subject to civil authority no less than others; and in respect of things-ecclesiastical, or matters of religion, Eusebius brings in Constantine the great, saying: ‘Vos Episcopi in Ecclesia, ego extra Ecclesiam seu templum Episcopus a Deo constitutus sum‘ [Ye are overseers in the Church; I am constituted of God an overseer outside of the Church Church]: Not that any mortal man whether Pope or Prince, can be properly Head of the Church, or vice-gerent [regent] unto Christ the Mediator in his special and economical Kingdom of Grace: for princes are vice-gerents to God, and to his Son Jesus Christ as He is God, in his universal Kingdom of Providence; and this watching and inspection of princes and magistrates, is objective ecclesiastica [objectively ecclesiastical], but formaliter civilis [formally civil], it is about matters of religion in a civil manner, and in a way suitable to the nature and quality of their place and power. The faithful custody and preservation of religion, is a part of their office: for they are not only keepers of the Second, but of the First Table of the Law… Religion also expects from them the civil sanction, that the worship of God, and the wholesome constitutions of the Church about religion, be confirmed and settled by their Laws. Coaction [coercion] also is theirs, for they by their power [in a Christian nation] are to constrain their subjects to the duties of religion, and to coerce and stop them that they do nothing to the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sermon Preached To the Honorable House of Commons, at Their late Solemn Fast, Wed., Dec. 27, 1643’ (London, 1644)</cite></span></figcaption>

<blockquote><p>Magistrates ought not to plant or propagate religion by arms. The cruelty of the [Romanist] Spaniards upon the Indians is abhorred by all. True religion should be planted by true doctrine, instruction, example, but it may be defended by arms.</p></blockquote>

<blockquote><p>The Admonition annexed to the Queen’s Injunctions. The Queen’s Majesty being informed that in certain places of this realm, sundry of her native subjects, being called to ecclesiastical ministry in the Church, be by sinister persuasion and perverse construction induced to find some scruple in the form of an oath which by an act of the last parliament is prescribed to be required of diverse persons, for the recognition of their allegiance to her Majesty, which certainly neither was ever meant, ne by any equity of words or good sense, can be thereof gathered: Would that all her loving subjects should understand that nothing was, is, or shall be meant or intended by the same oath, to have any other duty, allegiance, or bond required by the same oath than was acknowledged to be due to the most noble kings of famous memory, king Henry VIII, her Majesty’s father, or king Edward VI, her Majesty’s brother. And further her Majesty forbids all manner her subjects to give ear or credit to such perverse and malicious persons which most sinisterly and maliciously labor to notify to her loving subjects how by the words of the said oath, it may be collected the kings or queens of this realm, possessors of the crown, may challenge authority and power of ministry of divine offices in the Church, wherein her said subjects be much abused by such evil disposed persons. For certainly her Majesty neither does, ne ever will challenge any other authority than that was challenged and lately used by the said noble kings of famous memory, king Henry VIII, and king Edward VI, which is and was of ancient time due to the imperial crown of this realm.</p></blockquote>

<blockquote><p>6. The object of the king’s power is not simply a peaceable life, and external peace of human societies, but also honesty and godliness, but to be procured by a civil, politic, regal and coactive way, by the sword of the secular arm, as the object of the Church power is honesty and godliness to be procured by a ministerial, ecclesiastical, and spiritual power, without any forcing of men by external power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Due Right of Presbyteries (1644), pt. 2, Appendix</cite>, p. 388</span></figcaption>

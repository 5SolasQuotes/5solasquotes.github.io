<main class="wrap"><figure class="quote" id="q-1bdf6fb235" data-kw="">
<blockquote><p>In the imprecatory psalms, we are raised to his throne to join with him in his denunciations of wrath on his enemies. Private resentment is not to be allowed a place in singing these songs. That would be to offer strange fire on God’s altar, and instead of being acceptable service would expose to his displeasure.

The general import of these psalms is substantially as in the second and third petitions of the Lord’s prayer. “Thy kingdom come, thy will be done on earth as it is in heaven.” As taught in the Shorter Catechism in the petition: “Thy kingdom come,” we pray that “Satan’s kingdom may be destroyed.” This must take place before the kingdom of Christ can be established; and in singing those imprecatory petitions we magnify his grace in these displays of his power by which this glorious result is to be accomplished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-sproull.html">Thomas Sproull</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Psalms in Reformed Presbyterian and Covenanter</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6a8daa9d23" data-kw="">
<blockquote><p>We knew that these psalms, and hymns and spiritual songs, though in other languages (and consequently so in other poetical measures) were inspired by the Holy-Ghost, to holy men of old for the edification and comfort of the Church and people of God in all ensuing ages to the end of the world. And for these holy ends we have with special care &amp; diligence translated them into such meters as are most usual and suitable for such holy poems, in our own language, having a special eye to the gravity of the phrase of sacred writ and sweetness of the verse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-dunster.html">Henry Dunster</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms Hymns and Spiritual Songs of the Old and New Testament, faithfully translated into English metre</cite>, ([Cambridge, Mass.], 1651), ‘To the Godly Reader’, no page number. This 3rd edition of the Bay Psalm Book psalter has the 150 psalms and other inspired Bible songs in it (the original Bay Psalm Book did not have the other Bible-Songs). On the title page is 2 Tim. 3:16-17; Col. 3:16; Eph. 5:18-19; James 5:13. This same psalter and preface were reprinted in Boston in 1698 with Cotton Mather’s name on it.</span></figcaption>

</figure><figure class="quote" id="q-db563e53ef" data-kw="">
<blockquote><p>In 1643, White was chosen to serve among the Westminster Assembly of Divines. When the Assembly swore to uphold the Solemn League and Covenant on September 25, 1643, John Lightfoot recorded in his Journal that “Mr. White prayed near upon an hour.” White attended faithfully and contributed diligently to the work of the Assembly, and was in fact married to the sister of Cornelius Burgess, his co-assessor at the Assembly. While the Assembly was engaged in a battle over whose metrical Psalter would be chosen to serve as the instrument of uniformity and “get the civil sanction,” the leading candidates being Francis Rous and William Barton. White, who had prepared his own version of the metrical Psalms, preferred not to publish it while the debate was going on, in the interests of harmony. It was published posthumously with the permission of his son under the title David’s Psalms in Metre, agreeable to the Hebrew. To be sung in usual Tunes To the benefit of the Churches of Christ (1655) and shows his poetic skills.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-white.html">John White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David’s Psalms in meter. Agreeable to the Hebrew</cite>, 1655 | Background to White’s psalter by Andrew Myers:</span></figcaption>

<blockquote><p>47. Yet because the lifting up of the heart to God is together required, Simul &amp; consequenter, and going along with the thing that is sung, and it is also the end of that meditation; therefore we are said to sing in our heart to the Lord, Col. 3:16, and psalms that are sung have the consideration of prayers.

48. But because this religious melody hath the respect of prayers, therefore it is not so fit that the Decalogue, and other such like, which do not partake the nature of prayer, be turned into meter and be sung instead of psalms. … 53. But in the melody of singing, because it tendeth to our mutual edification, attention, and stirring up of pious affections among us one toward another, Col. 3:16, therefore all do join their voices together, 1. Chron. 16:35; Mk. 14:26.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Sacred Divinity Drawn out of the Holy Scriptures, and the Interpreters thereof, and brought into Method</cite>, (London: 1642), Book 2, ch. 9, ‘Of Prayer’, p. 284</span></figcaption>

</figure><figure class="quote" id="q-31f82330d9" data-kw="">
<blockquote><p>Only it appeared to me to be requisite to show in passing, that this book makes known to us this privilege, which is desirable above all others — that not only is there opened up to us familiar access to God, but also that we have permission and freedom granted us to lay open before him our infirmities which we would be ashamed to confess before men. Besides there is also here prescribed to us an infallible rule for directing us with respect to the right manner offering to God the sacrifice of praise, which he declares to be most precious in his sight, and of the sweetest odour. There is no other book in which there is to be found more express and magnificent commendations, both of the unparalleled liberality of God towards his Church, and of all his works; there is no other book in which there is recorded so many deliverances nor one in which the evidences and experiences of the fatherly providence and solicitude which God exercises towards us are celebrated with such splendor of diction, and yet with the strictest adherence to truth, in short, there is no other book in which we are more perfectly taught the right manner of praising God, or in which we are more powerfully stirred up to the performance of this religious exercise. Moreover although The Psalms are replete with all the precepts which serve to frame our life to every part of holiness, piety, and righteousness, yet they will principally teach and train us to bear the cross; and the bearing of the cross is a genuine proof our obedience, since by doing this, we renounce the guidance of our own affections and submit ourselves entirely to God, leaving him to govern us, and to dispose of our life according to his will, so that the afflictions which are the bitterest and most severe to our nature, become sweet to us, because they proceed from him. In one word, not only will we here find general commendations of the goodness of God, which may teach men to repose themselves in him alone, and to seek all their happiness solely in him; and which are intended to teach true believers with their whole hearts confidently to look to him for help in all their necessities; but we will also find that the free remission of sins, which alone reconciles God towards us and procures for us settled peace with him, is so set forth and magnified, as that here there is nothing wanting which relates to the knowledge of eternal salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ’s Preface to the Commentary on the Psalms (HT: Matt Crutchmer)</span></figcaption>

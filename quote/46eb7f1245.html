<blockquote><p>Many there be that are taken in the briars of this profane schism that wish they had never met with the separation of that schismatical body [of the Brownists], and would fly so that they might escape without excommunication, with which they terrify them so that they dare not so much as whisper, or as much as •uff against it.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0e39098969" data-kw="">
<blockquote><p>By the one same act man both serves and worships God, for worship regards the excellence of God, to Whom reverence is due: while service regards the subjection of man who, by his condition, is under an obligation of showing reverence to God. To these two belong all acts ascribed to religion, because, by them all, man bears witness to the Divine excellence and to his own subjection to God, either by offering something to God, or by assuming something Divine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aquinas.html">Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 2, second part</cite>, Question 81, ‘Of Religion’, Article 3, ‘Whether religion is one virtue’, Reply to Objection 2. Rutherford (below) follows Aquinas in this.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>For although the light of nature teach that God is to be worshipped, yet in substantial things reason teaches not how this worship of God is to be administred, nor the house of God to be governed, but in all this we must depend upon the mind and pleasure of Christ, the King of his Church, and Saviour of his body.</p></blockquote>

</figure><figure class="quote" id="q-ac344361c5" data-kw="">
<blockquote><p>III. On the statement of the question take notice: (1) acts of divine worship are twofold, some which do not differ form the worship itself (to wit, from piety and holiness, in which worship essentially consists); others ordinated to worship as helps or instruments to perform that worship suitably and declare it abroad. The former kind of acts can be instituted and commanded by God alone, who is the sole chief and legislator, who has dominion over the conscience; nor does any right belong to the Church of adding, taking away or changing anything. The latter, again, are either necessary and so also instituted by God, at least as to being (to on)–for example that assemblies should be held, the word preached, the sacraments administered; others are contingent and free as to quality (to poion), the reason of which depends upon the honesty and fitness of particular churches (to wit, that assemblies should be held in this or that time and place and the sacraments administered). The former, as being necessary, depend upon God alone and the Church has no control or power over them; the latter God has thus far left to the will of the Church as means and indifferent, so that a regard be always paid to divine truth, Christian simplicity and public edification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 3, 18th Topic, Question 31, section III, p. 286</span></figcaption>

0Christian%20simplicity%20and%20public%20edification&amp;text=III.%20On%20the%20statement%20of%20the%20question%20take&amp;text=to%20divine%20truth%2C%20Christian%20simplicity%20and%20public%20edification" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-58884cf76a" data-kw="">
<blockquote><p>Now these things carry a show of humility, and so those thousands of superstitious ceremonies and ways of worship that have been brought into the Church, they come under the name of zeal and devotion; but observe the Scripture, you shall see: Baptism, the Lord’s Supper, when purely administered although in a grave and holy way, yet in such simplicity and plainness, that there is not the least mention of the least ceremony or traditional worship that afterwards was introduced; and this the apostle meant when he said [that] he was afraid lest the Serpent should beguile them from the simplicity of the Gospel of Christ, 2 Cor. 11:3, [‘But I fear, lest by any means, as the serpent beguiled Eve through his subtilty, so your minds should be corrupted from the simplicity that is in Christ.’]. Oh that is a worthy place! There is a simplicity in the doctrine, worship, and life of the Gospel, and your minds are easily corrupted from this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scripture Directory for Church-Officers &amp; People, or, A Practical Commentary upon 1 Cor. 3</cite>, … (London, 1659), on verse 4, p. 55</span></figcaption>

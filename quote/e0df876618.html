<blockquote><p>SIMO.

What canst thou make of a faithful but a faithful? I can not understand how infants and young babes can be faithful, sith that they do want the use of reason.

IO.

But in this business, we do so speak of the faithful that we do in no wise exclude the children from the number of them, saith that the children and infants are of God whom God doth always admit and receive into his church among the faithful.

SIM.

It behoveth thee to have proved the same, as I have already proved the contrary,

IOI.

I will prove it. Genesis xvii. chap. Where God doth make a covenant with Abraham. The Lord doth peculiarly comprehend the children in the covenant, for he saith. I shall be thy God, and the God of thy seed after the. And afterwards he commandeth the infants to be circumcised upon the eight day, &amp; to receive the sign of the Testament. Whereby it followeth that God is not only the God of them that be of age, and can believe in God, but also of the infant, which for lack of age can not yet believe, for they through grace and the promise, are received in to the covenant and number of the faithful.

SIM.

I care not for the old Testament of the Jews, these old things are abolished by the gospel.

IO.

By Jesus Christ the ceremonies are abolished and the figures fulfilled, but the covenant made with Abraham, standeth still. Else God were not our God, and the God of our seed, and should be made by Christ more unmerciful and more strange, then he was to the ancient fathers before Christ. Which to think, were a foolish thing, that I should not say an ungodly, specially saith that in the new Testament, also the faithful are called the children of Abraham. Rom. iiii. Gal. iiii Mat. viii. Luk. xiii. &amp; xix. Chap. Besides these, Christ which express words, doth say: Suffer young children to come unto me, for to such doth belong the kingdom of heaven. Paul speaking of the children of the Christians, saith: Your children are clean: How should that be, unless it were through grace, mercy, &amp; the promise of God? It followeth then, that the children of the Christians, are of God, &amp; ought to be numbered among the children of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A most sure and strong defence of the baptism of children, against [the] pestiferous sect of the Anabaptists</cite>, trans. John Heron (Worcester: John Oswen, 1551), unpaginated.</span></figcaption>

<blockquote><p>We may consider a visible Church either metaphysically or politically. It is one thing to consider men as living creatures endued with reason; another thing to consider them as magistrates, masters, fathers, children, servants, etc. So is it one thing to consider a visible Church as a society of men and women separated from the blind world by divine vocation [calling], and professing together the gospel of Jesus Christ; and another thing to consider it as a political body, in which the power of spiritual government and jurisdiction is exercised–some governing and some governed. These are very different considerations; for first, a visible Church being taken entitatively or metaphysically, her members do ordinarily communicate together in those holy things which fall under the power of order, which I may call sacra mystica [sacred, mystical rites]; but being taken politically, her members communicate together in such holy things as fall within the compass of the power of jurisdiction, which I may call sacra politica [sacred politics]. Secondly, infants under age, being initiated in baptism, are actually members of the Church in the former consideration, but potentially only in the latter; for they neither govern, nor yet have the use of reason to be subject and obedient to those that do govern.</p></blockquote>

<blockquote><p>I. Children of pagans, of whatever age and however they have come into the power of Christians, whether legitimately or illegitimately, if they are taken into Christian families as their slaves or servants, who can be manumitted [released] again at their masters’ pleasure and ejected from Christian families, should not be baptized, but should first be taught the Christian religion, and a confession of the same should be required from them before they are admitted to baptism. For such children of pagans are not and should not be considered members of the visible church either by right of birth or by right of adoption into Christian families. Not by right of birth, for they are born outside the church from unbelieving and polluted parents, and therefore they themselves are also rightly considered unbelieving and polluted, according to 1 Corinthians 7:14. Not by right of adoption into Christian families, for this, if it is done only for the sake of servitude and with reserved liberty of expulsion, makes no one a member of the church. For thus in the Old Testament, in the families of faithful patriarchs, and in the time of the primitive apostolic church in Christian families, many children were born from pagan servants, who nevertheless were outside the church no less than their parents, and were not considered its members, until their parents, having abandoned paganism, transferred to the Jewish or Christian religion and brought their children with them to the church. Nor does the example of Abraham in Genesis 17 stand opposed [to our position], who also circumcised those bought with money and foreigners. For Abraham did not force such unwilling ones to circumcision, nor did he admit them while still unbelieving, for otherwise God’s covenant would have been profaned. Instead, he first instructed them in the doctrine of the covenant and circumcised those who embraced that doctrine along with their infants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/no.html">Hessian Delegation at the Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Hessian Delegation at the Synod of Dordt on the Baptism of Slave Children’</cite>, tr. Michael Lynch from Early Sessions of the Synod of Dordt (V&amp;R, 2018), pp. 134-36 at Translationes Lyncei</span></figcaption>

<blockquote><p>But we do exclude from baptism the children of those who clearly are strangers to the covenant, such as the children of heathens, Muslims, Jews, and of similar people… And for this reason we should leave them–like foreigners–to the judgement of God… unless they happen through lawful adoption or through the just and properly-designated status of slaves to be enrolled and taken up into the families of believers as though belonging to them.† For in this case many Reformed churches do baptize those children, because they deem that God has adopted them into the fellowship of his covenant in this manner, that is to say by the covenant of Genesis 17:12-13, which in the early church was so far beyond debate that from it Augustine on several occasions deduced a powerful argument against the Pelagians for election by grace. [On the Grace of Christ &amp; on Original Sin 2.35 in NPNF1 5.249-50] † This is a remarkable position, given the fact that the Synod of Dort had decided negatively on the issue in response to a question from East-India if it was allowed to baptize a child from pagan parents adopted into a Christian family. At the synod, the professors and the delegates from Zeeland, Friesland and Utrecht did not object to baptism, together with the majority of foreign delegates, but the delegates from Holland and Gelderland objected because human adoption does not imply divine adoption. Adopted children first had to profess faith and only then could be baptized, though as infants they could be commended to God’s gracious care by the laying-on of hands. See Acta of the Synod of Dordt, eds. Donald Sinnema, Christian Moser, and Herman Selderhuis (Gottingen: Vandenhoeck &amp; Ruprecht), 30-32.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But we do exclude from baptism the children of those who clearly are strangers to the covenant, such as the children of heathens, Muslims, Jews, and of similar people… And for this reason we should leave them–like foreigners–to the judgement of God… unless they happen through lawful adoption or through the just and properly-designated status of slaves to be enrolled and taken up into the families of believers as though belonging to them.† For in this case many Reformed churches do baptize those children, because they deem that God has adopted them into the fellowship of his covenant in this manner, that is to say by the covenant of Genesis 17:12-13, which in the early church was so far beyond debate that from it Augustine on several occasions deduced a powerful argument against the Pelagians for election by grace. [On the Grace of Christ &amp; on Original Sin 2.35 in NPNF1 5.249-50] † This is a remarkable position, given the fact that the Synod of Dort had decided negatively on the issue in response to a question from East-India if it was allowed to baptize a child from pagan parents adopted into a Christian family. At the synod, the professors and the delegates from Zeeland, Friesland and Utrecht did not object to baptism, together with the majority of foreign delegates, but the delegates from Holland and Gelderland objected because human adoption does not imply divine adoption. Adopted children first had to profess faith and only then could be baptized, though as infants they could be commended to God’s gracious care by the laying-on of hands. See Acta of the Synod of Dordt, eds. Donald Sinnema, Christian Moser, and Herman Selderhuis (Gottingen: Vandenhoeck &amp; Ruprecht), 30-32.”

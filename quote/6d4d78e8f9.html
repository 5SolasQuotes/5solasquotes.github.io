<blockquote><p>Aug. 10, 1585 Proclamation, Gatherings. The foresaid bailies and a part of the counsel ordains proclamation to be made through this burgh charging that no manner of persons enduring the time of this present pestilence, either men or women, take upon hand to hold any conventions at the close heads, Cowgate, and high streets, be even or be day, as they commonly do, whereby infection daily arises, discharging all convention of huseis [houses?] and women in special and all such other idle persons which has not charge or licence of the bailies, but only to convene at Kirk and market and to no other places and times, under the pain to be enclosed in their houses upon their own charges for the space of a month and further punished in their bodies and goods at the will of the magistrates.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/city-of-edinburgh.html">City of Edinburgh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Extracts from the Records: 1585, Jul-Sept’, in Extracts From the Records of the Burgh of Edinburgh, 1573-1589, ed. J D Marwick (Edinburgh, 1882), pp. 430-437. British History Online</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

rmed Books Online</a></div>

<blockquote><p>…green and raw deliverances are plagues of God, not mercies; the plague is nine times removed, but Pharaoh’s heart is neither softened nor humbled, the scum abideth in the bloody city, as the Lord complains, Eze. 24:6, ‘Therefore thus saith the Lord God, Woe to the bloody City, to the pot whose scum is therein, and whose scum is not gone out;’ the prophet in Chaldea heard that Jerusalem had been boiled with the sword of the Lord, but the scum of their idolatry and blood remained in them; whilst the wicked of these kingdoms, malignants, bloody Irish, rotten hearted men, such backsliders and perjured apostates, as are in Scotland, delivered to Satan and excommunicated, while these taste of the gall and wormwood of the wrath of God in this war, the hand of God cannot be removed, and therefore that must be taken notice of, Jer. 6:29, ‘The bellows are burnt, the lead is consumed of the fire, the founder melteth in vain: for the wicked are not plucked away;’ O that our Lord would boil out on the fire the scum of both kingdoms. The whoredoms of Popish Egypt, and the ceremonies, the inventions of men are not mourned for by the pastors of the Lord, sure, I am, not by most of the ministers in Scotland…</p></blockquote>

<blockquote><p>§. 44. Direction 5. Make haste away from the occasions of thy sin, and the company which ensnares thee in it. If thou knewest that they were robbers that intended to murder thee, thou wouldst be gone: If thou knewest that they had plague sores running on them thou wouldst be gone: And wilt thou not be gone when thou knowest that they are the servants of the Devil, that would infect thee with sin, and cheat thee of thy salvation? Say not, Is not this company lawful, and that pleasure lawful? etc. If it be like to entice thy heart to sin, it is unlawful to thee, whatever it is to others: It is not lawful to undo thy soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology… (London, 1673)</cite>, p. 623</span></figcaption>

<blockquote><p>2. And you will hinder the great benefit which the world may get, by their vain attire: For (though it be no thanks to them that intend it not) yet it is a very great commodity that comes to mankind by these people’s sin: that fools should go about in fools-coats, and that empty brains, and proud and wanton hearts should be so openly detected in the streets and churches: that sober people may avoid them; and that wise, and chaste, and civil people may not be deceived by such in marriage to their undoing: As the different clothing of the different sexes is necessary to chastity and order; so it is a matter of great convenience in a commonwealth, that sots, and swaggerers, and phrenetics, and Idiots, and proud, and wanton lustful persons should be openly distinguished from others: As in a plague-time the doors of infected houses are marked with a ‘Lord have mercy on us’: And the wisest magistrate knew not how to have accomplished this himself by a law, as the wretches themselves do by their voluntary choice: For if it were not voluntary, it would be no distinguishing badge of their profession. Now for any honest civil people to join with them and take up their livery, and the habit of their Order, is to profess themselves such as they, and so to encourage and approve them, or else to confound the proud and humble, the vain and the sober, the wanton and the chaste, and destroy the benefit of distinction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology… (London, 1673)</cite>, p. 467</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<blockquote><p>Every person is engaged in his place and capacity to appear against vice, and to endeavor the extirpation of it; but here the Magistrate in a special manner is concerned, who is to see that all infected persons be shut up. The leper under the Law was to dwell alone without the camp, that he might not converse with those that were whole: now I have told you, that sin is the worst of plagues and leprosies. You therefore that are in public places and offices are to set a watch over notorious sinners, that they go not abroad to infect others: if they break out, you may shoot at them; if sinners will be bold and daring, you are bound to unsheath the sword of justice and strike at them; as indeed there are a sort of hardened sinners that stare justice in the face, and say she is blind, and laugh at her sword, and make their brag that they never felt the edge of it. Here you will do well to make them experience how sharp it is; that others too, beholding the punishment inflicted on them, may not presume to glory in their shame.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Plague of the Heart… (Cambridge, 1665), pp. 29-30. Edwards was a reformed Anglican.</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-2e52a7cff9" data-kw="">
<blockquote><p>those constitutions and ceremonies which… strive to direct the worship constituted by God with respect to circumstantial matters of places and times, for εὐταξία καὶ εὐσχημονία, ‘good order and decency’… they acknowledge [in these] something divine and something human: they are divine with respect to the foundation, insofar as God generally prescribes that all things be done in good order and decently (1 Cor. 14:40), and human with respect to the particular determination, whereby this or that is said to aim at good order and decency.</p></blockquote>

<blockquote><p>His [Knewstubs’s] objection against the cross consisted of three interrogatories: 1. Whether the Church had power to institute an external significant sign? To which was replied: First, that he did mistake the use of the cross with us, which was not used in baptism any otherwise than only as a ceremony. Secondly, by their own example, who make imposition of hands in their ordination of pastors to be a sign significant. Thirdly, in prayer, says the Bishop of Winton, the kneeling on the ground, the lifting up of our hands, the knocking of our breasts are ceremonies significant: the first, of our humility coming before the mighty God, the second, of our confidence and hope, the other of our sorrow and detestation of our sins, and these are, and may lawfully be used. Lastly, M. Deane of the chapel, remembered the practice of the Jews, who unto the institution of the Passeover, prescribed unto them by Moses, had as the rabbins witness added both signs and words, eating sour herbs and drinking wine, with these words to both, ‘Take, and eat these in remembrance, etc. Drink this in remembrance, etc.’ Upon which addition and tradition of theirs, our Sauiour instituted the sacrament of his Last Supper, in celebrating it with the same words and after the same manner; thereby approving that fact of theirs in particular; and generally, that a Church may institute and retain a sign significant: which satisfied his Maiesty exceeding well. And here the king desired, to have himself made acquainted about the antiquity of the use of the cross. Which Doctor [John] Reynolds confessed to have been ever since the apostles times, but this was the difficulty, to prove it of that ancient use in baptism… it fell from one, I think it was my Lord of Winchester, obiter, to say, that, in Constantine’s time it was used in baptism. What, quoth the King, and is it now come to that pass that we shall appeach Constantine of Popery and superstition; if then it were used, says his Majesty, I see no reason but that still we may continue it. Mr. Knewstubs’s second question was that, put [the] case [that] the Church had such power to add significant signs, whether it might there add them where Christ had already ordained one; which he said, was no less derogatory to Christ’s institution, as he thought, than if any potentate of this land should presume to add his seal unto the great seal of England. To which his Majesty answered that the case was not alike, for that no sign or thing was added to the sacrament, which was fully and perfectly finished, before any mention of the cross is made; for confirmation whereof, he willed the place to be read [in the Book of Common Prayer]. Lastly, if the Church had that power also, yet the greatest scruple to their conscience was, how far such an ordinance of the Church was to bind them, without impeaching their Christian liberty? Whereat the king, as it seemed, was much moved, and tolde him he would not argue that point with him, but answer therein as kings are wont to speak in Parliament, Le Roy J’auisera: adding withall, that it smelled very rankly of Anabaptism: comparing it unto the usage of a beardless boy (one Mr. John Black) who the last Conference his Majesty had with the ministers in Scotland (in December, 1602) told him that he would hold conformity with his Majesty’s ordinances for matters of doctrine: but for matters of ceremony, they were to be left in Christian liberty unto every man as he received more and more light from the illumination of God’s Spirit; even till they go mad, quoth the king, with their own light: but I will none of that, I will have one doctrine and one discipline, one religion in substance, and in ceremony: and therefore I charge you, never speak more to that point (how far you are bound to obey?) when the Church has ordained it. And so asked them again, if they had anything else to say? Dr. Reynolds objected the example of the brasen serpent, demolished and stamped to powder by Ezekiel, because the people abused it to idolatry: wishing, that, in like sort, the cross should be abandoned, because in the time of Popery it had been superstitiously abused. Whereunto the King’s Majesty answered diverse ways. First, quoth he, though I be sufficiently persuaded of the cross in baptism, and the commendable use thereof in the Church so long: yet, if there were nothing else to move me, this very argument were an inducement to me for the retaining of it, as it is now by order established: For, inasmuch, as it was abused, so you say, to superstition in time of popery, it does plainly imply, that it was well used before Popery. I will tell you, I haue lived among this [dissenting] sort of men (speaking to the lords and bishops) ever since I was ten years old, but I may say of myself as Christ did of Himself: Though I lived amongst them, yet since I had ability to judge, I was never of them; neither did anything make me more to condemn and detest their courses than that they did so peremptorily disallow of all things which at all had been used in Popery. For my part, I know not how to answer the objection of the Papists, when they charge us with novelties: but truly to tell them that their abuses are new, but the things which they abused we retain in their primitive use, and forsake only the novel corruption. By this argument we might renounce the Trinity and all that is holy, because it was abused in Popery (and speaking to Doctor Reynolds merely) they used to wear hose and shoes in Popery, therefore, you shall, now, go barefoot. Secondly, quoth his Majesty, what resemblance is there between the brazen serpent, a material visible thing, and the sign of the cross made in the air? Thirdly, I am given to understand by the bishops, and I find it true, that the Papists themselves did never ascribe any power or spiritual grace to the sign of the cross in baptism. Fourthly, you see, that the material crosses, which in time of Popery were made, for men to fall down before them, as they passed by them, to worship them (as the idolatrous Jews did the brazen serpent) are demolished, as you desire.</p></blockquote>

— King James I, ed. William Barlow, The Sum &amp; Substance of the Conference which it pleased his excellent Majesty to have with the Lords, Bishops &amp; other of his Clergy… at Hampton Court, January 14, 1603 (London: Windet, 1604), 2nd Day, pp. 67-74">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHis+%5BKnewstubs%E2%80%99s%5D+objection+against+the+cross+consisted+of+three+interrogatories%3A+1.+Whether+the+Church+had+power+to+institute+an+external+significant+sign%3F+To+which+was+replied%3A+First%2C+that+he+did+mistake+the+use+of+the+cross+with+us%2C+which+was+not+used+in+baptism+any+otherwise+than+only+as+a+ceremony.+Secondly%2C+by+their+own+example%2C+who+make+imposition+of+hands+in+their+ordination+of+pastors+to+be+a+sign+significant.+Thirdly%2C+in+prayer%2C+says+the+Bishop+of+Winton%2C+the+kneeling+on+the+ground%2C+the+lifting+up+of+our+hands%2C+the+knocking+of+our+breasts+are+ceremonies+significant%3A+the+first%2C+of+our+humility+coming+before+the+mighty+God%2C+the+second%2C+of+our+confidence+and+hope%2C+the+other+of+our+sorrow+and+detestation+of+our+sins%2C+and+these+are%2C+and+may+lawfully+be+used.+Lastly%2C+M.+Deane+of+the+chapel%2C+remembered+the+practice+of+the+Jews%2C+who+unto+the+institution+of+the+Passeover%2C+prescribed+unto+them+by+Moses%2C+had+as+the+rabbins+witness+added+both+signs+and+words%2C+eating+sour+herbs+and+drinking+wine%2C+with+these+words+to+both%2C+%E2%80%98Take%2C+and+eat+these+in+remembrance%2C+etc.+Drink+this+in+remembrance%2C+etc.%E2%80%99+Upon+which+addition+and+tradition+of+theirs%2C+our+Sauiour+instituted+the+sacrament+of+his+Last+Supper%2C+in+celebrating+it+with+the+same+words+and+after+the+same+manner%3B+thereby+approving+that+fact+of+theirs+in+particular%3B+and+generally%2C+that+a+Church+may+institute+and+retain+a+sign+significant%3A+which+satisfied+his+Maiesty+exceeding+well.+And+here+the+king+desired%2C+to+have+himself+made+acquainted+about+the+antiquity+of+the+use+of+the+cross.+Which+Doctor+%5BJohn%5D+Reynolds+confessed+to+have+been+ever+since+the+apostles+times%2C+but+this+was+the+difficulty%2C+to+prove+it+of+that+ancient+use+in+baptism%E2%80%A6+it+fell+from+one%2C+I+think+it+was+my+Lord+of+Winchester%2C+obiter%2C+to+say%2C+that%2C+in+Constantine%E2%80%99s+time+it+was+used+in+baptism.+What%2C+quoth+the+King%2C+and+is+it+now+come+to+that+pass+that+we+shall+appeach+Constantine+of+Popery+and+superstition%3B+if+then+it+were+used%2C+says+his+Majesty%2C+I+see+no+reason+but+that+still+we+may+continue+it.+Mr.+Knewstubs%E2%80%99s+second+question+was+that%2C+put+%5Bthe%5D+case+%5Bthat%5D+the+Church+had+such+power+to+add+significant+signs%2C+whether+it+might+there+add+them+where+Christ+had+already+ordained+one%3B+which+he+said%2C+was+no+less+derogatory+to+Christ%E2%80%99s+institution%2C+as+he+thought%2C+than+if+any+potentate+of+this+land+should+presume+to+add+his+seal+unto+the+great+seal+of+England.+To+which+his+Majesty+answered+that+the+case+was+not+alike%2C+for+that+no+sign+or+thing+was+added+to+the+sacrament%2C+which+was+fully+and+perfectly+finished%2C+before+any+mention+of+the+cross+is+made%3B+for+confirmation+whereof%2C+he+willed+the+place+to+be+read+%5Bin+the+Book+of+Common+Prayer%5D.+Lastly%2C+if+the+Church+had+that+power+also%2C+yet+the+greatest+scruple+to+their+conscience+was%2C+how+far+such+an+ordinance+of+the+Church+was+to+bind+them%2C+without+impeaching+their+Christian+liberty%3F+Whereat+the+king%2C+as+it+seemed%2C+was+much+moved%2C+and+tolde+him+he+would+not+argue+that+point+with+him%2C+but+answer+therein+as+kings+are+wont+to+speak+in+Parliament%2C+Le+Roy+J%E2%80%99auisera%3A+adding+withall%2C+that+it+smelled+very+rankly+of+Anabaptism%3A+comparing+it+unto+the+usage+of+a+beardless+boy+%28one+Mr.+John+Black%29+who+the+last+Conference+his+Majesty+had+with+the+ministers+in+Scotland+%28in+December%2C+1602%29+told+him+that+he+would+hold+conformity+with+his+Majesty%E2%80%99s+ordinances+for+matters+of+doctrine%3A+but+for+matters+of+ceremony%2C+they+were+to+be+left+in+Christian+liberty+unto+every+man+as+he+received+more+and+more+light+from+the+illumination+of+God%E2%80%99s+Spirit%3B+even+till+they+go+mad%2C+quoth+the+king%2C+with+their+own+light%3A+but+I+will+none+of+that%2C+I+will+have+one+doctrine+and+one+discipline%2C+one+religion+in+substance%2C+and+in+ceremony%3A+and+therefore+I+charge+you%2C+never+speak+more+to+that+point+%28how+far+you+are+bound+to+obey%3F%29+when+the+Church+has+ordained+it.+And+so+asked+them+again%2C+if+they+had+anything+else+to+say%3F+Dr.+Reynolds+objected+the+example+of+the+brasen+serpent%2C+demolished+and+stamped+to+powder+by+Ezekiel%2C+because+the+people+abused+it+to+idolatry%3A+wishing%2C+that%2C+in+like+sort%2C+the+cross+should+be+abandoned%2C+because+in+the+time+of+Popery+it+had+been+superstitiously+abused.+Whereunto+the+King%E2%80%99s+Majesty+answered+diverse+ways.+First%2C+quoth+he%2C+though+I+be+sufficiently+persuaded+of+the+cross+in+baptism%2C+and+the+commendable+use+thereof+in+the+Church+so+long%3A+yet%2C+if+there+were+nothing+else+to+move+me%2C+this+very+argument+were+an+inducement+to+me+for+the+retaining+of+it%2C+as+it+is+now+by+order+established%3A+For%2C+inasmuch%2C+as+it+was+abused%2C+so+you+say%2C+to+superstition+in+time+of+popery%2C+it+does+plainly+imply%2C+that+it+was+well+used+before+Popery.+I+will+tell+you%2C+I+haue+lived+among+this+%5Bdissenting%5D+sort+of+men+%28speaking+to+the+lords+and+bishops%29+ever+since+I+was+ten+years+old%2C+but+I+may+say+of+myself+as+Christ+did+of+Himself%3A+Though+I+lived+amongst+them%2C+yet+since+I+had+ability+to+judge%2C+I+was+never+of+them%3B+neither+did+anything+make+me+more+to+condemn+and+detest+their+courses+than+that+they+did+so+peremptorily+disallow+of+all+things+which+at+all+had+been+used+in+Popery.+For+my+part%2C+I+know+not+how+to+answer+the+objection+of+the+Papists%2C+when+they+charge+us+with+novelties%3A+but+truly+to+tell+them+that+their+abuses+are+new%2C+but+the+things+which+they+abused+we+retain+in+their+primitive+use%2C+and+forsake+only+the+novel+corruption.+By+this+argument+we+might+renounce+the+Trinity+and+all+that+is+holy%2C+because+it+was+abused+in+Popery+%28and+speaking+to+Doctor+Reynolds+merely%29+they+used+to+wear+hose+and+shoes+in+Popery%2C+therefore%2C+you+shall%2C+now%2C+go+barefoot.+Secondly%2C+quoth+his+Majesty%2C+what+resemblance+is+there+between+the+brazen+serpent%2C+a+material+visible+thing%2C+and+the+sign+of+the+cross+made+in+the+air%3F+Thirdly%2C+I+am+given+to+understand+by+the+bishops%2C+and+I+find+it+true%2C+that+the+Papists+themselves+did+never+ascribe+any+power+or+spiritual+grace+to+the+sign+of+the+cross+in+baptism.+Fourthly%2C+you+see%2C+that+the+material+crosses%2C+which+in+time+of+Popery+were+made%2C+for+men+to+fall+down+before+them%2C+as+they+passed+by+them%2C+to+worship+them+%28as+the+idolatrous+Jews+did+the+brazen+serpent%29+are+demolished%2C+as+you+desire.%E2%80%9D%0A%0A%E2%80%94+King+James+I%2C+ed.+William+Barlow%2C+The+Sum+%26+Substance+of+the+Conference+which+it+pleased+his+excellent+Majesty+to+have+with+the+Lords%2C+Bishops+%26+other+of+his+Clergy%E2%80%A6+at+Hampton+Court%2C+January+14%2C+1603+%28London%3A+Windet%2C+1604%29%2C+2nd+Day%2C+pp.+67-74&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff2aa09de7d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f2aa09de7d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=His%20%5BKnewstubs%E2%80%99s%5D%20objection%20against%20the%20cross,serpent%29%20are%20demolished%2C%20as%20you%20desire&amp;text=His%20%5BKnewstubs%E2%80%99s%5D%20objection%20against%20the%20cross%20consisted%20of&amp;text=the%20brazen%20serpent%29%20are%20demolished%2C%20as%20you%20desire" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1db11d6637" data-kw="">
<blockquote><p>It is without all warrant to expound Christian Liberty of a power of devising a mutable Church-policy, and laws not warranted in God’s Word, seeing Christian Liberty expressly exempts us altogether from obedience to men’s laws not warranted by Christ’s Word, Gal. 5:1; Col. 2:20, etc.</p></blockquote>

— Samuel Rutherford, The Divine Right of Church Government… (1646), p. 30">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+without+all+warrant+to+expound+Christian+Liberty+of+a+power+of+devising+a+mutable+Church-policy%2C+and+laws+not+warranted+in+God%E2%80%99s+Word%2C+seeing+Christian+Liberty+expressly+exempts+us+altogether+from+obedience+to+men%E2%80%99s+laws+not+warranted+by+Christ%E2%80%99s+Word%2C+Gal.+5%3A1%3B+Col.+2%3A20%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%E2%80%A6+%281646%29%2C+p.+30&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1db11d6637.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1db11d6637.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-arbitrary-laws-commands/#:~:text=It%20is%20without%20all%20warrant%20to,Word%2C%20Gal.%205%3A1%3B%20Col.%202%3A20%2C%20etc&amp;text=It%20is%20without%20all%20warrant%20to%20expound%20Christian&amp;text=by%20Christ%E2%80%99s%20Word%2C%20Gal.%205%3A1%3B%20Col.%202%3A20%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-fde2d15b26" data-kw="">
<blockquote><p>After He had washed their feet, and had taken his garments, and was set down again, He said unto them, ‘Know ye what I have done to ye, ye call me Master and Lord, and ye say well, for so I am; if I then your Lord and Master have washed your feet, ye also ought to wash one another’s feet, for I have given you an example that ye should do as I have done to you.’ ‘Tis evident that it is the moral duty of brotherly love, in condescension, and mutual helpfulness to be expressed in all necessary offices as occasion doth require, that is the thing which Jesus Christ here enjoins his disciples, and leads them to by his own example in an office of love then in use in those parts. The same is to be said of the holy kiss, Rom. 16:16 which was a temporary occasional token of entire love; which may in answer thereunto, be expressed by any sober usage of salutation amongst men to the same purpose. But the things themselves were not instituted for any continuance, nor do represent any special grace of the New Covenant, which is inseparable from every institution of Gospel worship properly so called. Common usages or practises therefore, directed to be used in a due manner, and unto a proper end, where they are used, make them not institutions of worship. Neither have they in them as so commanded or directed, any one thing that concurs to the constitution of a Gospel-Ordinance: for neither had they their rise in the authority of Christ, nor is any continuance of them enjoined, nor any promise annexed unto them, nor any grace of the New Covenant represented or exhibited in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John</cite>, 13:12-15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“After He had washed their feet, and had taken his garments, and was set down again, He said unto them, ‘Know ye what I have done to ye, ye call me Master and Lord, and ye say well, for so I am; if I then your Lord and Master have washed your feet, ye also ought to wash one another’s feet, for I have given you an example that ye should do as I have done to you.’ ‘Tis evident that it is the moral duty of brotherly love, in condescension, and mutual helpfulness to be expressed in all necessary offices as occasion doth require, that is the thing which Jesus Christ here enjoins his disciples, and leads them to by his own example in an office of love then in use in those parts. The same is to be said of the holy kiss, Rom. 16:16 which was a temporary occasional token of entire love; which may in answer thereunto, be expressed by any sober usage of salutation amongst men to the same purpose. But the things themselves were not instituted for any continuance, nor do represent any special grace of the New Covenant, which is inseparable from every institution of Gospel worship properly so called. Common usages or practises therefore, directed to be used in a due manner, and unto a proper end, where they are used, make them not institutions of worship. Neither have they in them as so commanded or directed, any one thing that concurs to the constitution of a Gospel-Ordinance: for neither had they their rise in the authority of Christ, nor is any continuance of them enjoined, nor any promise annexed unto them, nor any grace of the New Covenant represented or exhibited in them.”

— Explication, Mention is made in the Scriptures of sundry things practiced by the Lord Christ and his Apostles, which being then in common use amongst men, were occasionally made by them symbolical instructions in moral duties. Such were washing of feet by one another, the holy kiss, and the like; but there being no more in them, but a sanctified use directed unto the present civil customs and usages, the commands given concerning them, respect not the outward action, nor appointed any continuance of them, being peculiarly suited unto the state of things and persons in those countries; as John 13:12-15">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAfter+He+had+washed+their+feet%2C+and+had+taken+his+garments%2C+and+was+set+down+again%2C+He+said+unto+them%2C+%E2%80%98Know+ye+what+I+have+done+to+ye%2C+ye+call+me+Master+and+Lord%2C+and+ye+say+well%2C+for+so+I+am%3B+if+I+then+your+Lord+and+Master+have+washed+your+feet%2C+ye+also+ought+to+wash+one+another%E2%80%99s+feet%2C+for+I+have+given+you+an+example+that+ye+should+do+as+I+have+done+to+you.%E2%80%99+%E2%80%98Tis+evident+that+it+is+the+moral+duty+of+brotherly+love%2C+in+condescension%2C+and+mutual+helpfulness+to+be+expressed+in+all+necessary+offices+as+occasion+doth+require%2C+that+is+the+thing+which+Jesus+Christ+here+enjoins+his+disciples%2C+and+leads+them+to+by+his+own+example+in+an+office+of+love+then+in+use+in+those+parts.+The+same+is+to+be+said+of+the+holy+kiss%2C+Rom.+16%3A16+which+was+a+temporary+occasional+token+of+entire+love%3B+which+may+in+answer+thereunto%2C+be+expressed+by+any+sober+usage+of+salutation+amongst+men+to+the+same+purpose.+But+the+things+themselves+were+not+instituted+for+any+continuance%2C+nor+do+represent+any+special+grace+of+the+New+Covenant%2C+which+is+inseparable+from+every+institution+of+Gospel+worship+properly+so+called.+Common+usages+or+practises+therefore%2C+directed+to+be+used+in+a+due+manner%2C+and+unto+a+proper+end%2C+where+they+are+used%2C+make+them+not+institutions+of+worship.+Neither+have+they+in+them+as+so+commanded+or+directed%2C+any+one+thing+that+concurs+to+the+constitution+of+a+Gospel-Ordinance%3A+for+neither+had+they+their+rise+in+the+authority+of+Christ%2C+nor+is+any+continuance+of+them+enjoined%2C+nor+any+promise+annexed+unto+them%2C+nor+any+grace+of+the+New+Covenant+represented+or+exhibited+in+them.%E2%80%9D%0A%0A%E2%80%94+Explication%2C+Mention+is+made+in+the+Scriptures+of+sundry+things+practiced+by+the+Lord+Christ+and+his+Apostles%2C+which+being+then+in+common+use+amongst+men%2C+were+occasionally+made+by+them+symbolical+instructions+in+moral+duties.+Such+were+washing+of+feet+by+one+another%2C+the+holy+kiss%2C+and+the+like%3B+but+there+being+no+more+in+them%2C+but+a+sanctified+use+directed+unto+the+present+civil+customs+and+usages%2C+the+commands+given+concerning+them%2C+respect+not+the+outward+action%2C+nor+appointed+any+continuance+of+them%2C+being+peculiarly+suited+unto+the+state+of+things+and+persons+in+those+countries%3B+as+John+13%3A12-15&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffde2d15b26.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fde2d15b26.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-holy-kiss-foot-washing-anointing-with-oil/#:~:text=After%20He%20had%20washed%20their%20feet,Covenant%20represented%20or%20exhibited%20in%20them&amp;text=After%20He%20had%20washed%20their%20feet%2C%20and%20had&amp;text=the%20New%20Covenant%20represented%20or%20exhibited%20in%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

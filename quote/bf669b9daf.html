<main class="wrap"><figure class="quote" id="q-bf669b9daf" data-kw="">
<blockquote><p>IV. Good works are not the cause, but the effect of our uniting to Christ and of our justification and life.

Likewise as these branches and boughs do not therefore bring forth good fruits, that they might by them be planted in the vine or the olive tree, or that they might live therein, but therefore they bring fruit, because they are already planted and do live, and so their good fruits are not the causes of their planting and life, but the effects and manifest testimonies thereof, after the very same manner we believe that it is between us and Christ, as also Augustine fully teacheth, who also saith that good works do not go before him that is to be justified, but follow him that is justified. And therefore we constantly confess that a man (speaking properly and of the justification of his life) is not justified by works, but by them declared to be just.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), XXI.IV, 1: 363.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-110dec18fb" data-kw="">
<blockquote><p>It’s all the reason in the world that a sinner be drawn to Christ. For Christ is the most rational object that is, He being the wisdom of God. And man is led and taken with reason. Christ is a convincing thing and invincibly binds reason: So the forlorne Son, before he return to his Father, argues… and the wise merchant must discourse, Mt. 13:45-46… So Mt. 9:21, the diseased woman has heart-logic within herself… and the unjust steward cast syllogisms thus… Yea, a fool’s paradise, a wedge of gold, is a strong reason, Prov. 7:21… Faith is the deepest and soundest understanding, the gold, the flower of reason…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London, 1647), p. 280</span></figcaption>

</figure><figure class="quote" id="q-754d50b87f" data-kw="">
<blockquote><p>…upon the first moment that a man believes he is justified, and all his sins-past are actually pardoned, his sins to come virtually, so that no following sin shall unjustify him; though it may take away his aptitude for heaven, yet not his right: and though his sin may deserve damnation, and without actual repentance and faith he cannot be saved, yet grace shall be given to enable him to repent and believe, so that though there must be nova remissio [a new remission], yet there is not nova justificatio [a new justification]; though a new remission is needful, yet not a new justification; pardon of sin is a continued act, but our justification quoad statum [as far as the state] is done simul et semel, ‘once and for all’; this you know to be the Orthodox opinion…</p></blockquote>

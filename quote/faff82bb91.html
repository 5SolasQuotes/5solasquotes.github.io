<main class="wrap"><figure class="quote" id="q-faff82bb91" data-kw="ceremonial abrogation">
<blockquote><p>The ceremonial law can be viewed in two ways: either with regard to doctrine and signification; or with regard to obligation and observance. The question is not whether it was abrogated as to doctrine. We confess that it still remains and is useful in many ways among Christians; and that the mystical truth, hidden under this shell, is always the same and of perpetual necessity. Rather the question is whether it was abrogated as to obligation and obedience and whether believers are still in subjection to the ceremonial law. This was the opinion not only of the Jews of old, but also of the Judaizing false apostles in the time of the apostles. However we, with the apostles and the whole church, deny it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.25.1</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1826e86ef5" data-kw="oath obligation third commandment">
<blockquote><p>To the third commandment belongs the celebrated question concerning the faith of an oath; or what and how great is the obligation of an oath; and in what cases we can violate or are bound to keep plighted faith. First, every oath repugnant to the law of God and the lawful obedience to magistrates (concerning things either unlawful or impossible) does not bind the swearer to a performance of it. An oath ought not to be a bond of iniquity and no one ought to be compelled to do anything iniquitously. The apostolic maxim ought always to hold good here, “It is better to obey God rather than men” (Acts 5:29).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.11.1–2</span></figcaption>

</figure><figure class="quote" id="q-e97ffcf9d4" data-kw="Holiness">

</figure><figure class="quote" id="q-6410d65b06" data-kw="">
<blockquote><p>Certainly, the professors of it are not well purged from this latter idolatry: for, even among Protestants themselves, we shall find very many that are in this sense idolaters. For, [1] Whosoever chiefly and supremely loves any creature, is an idolater; because our chiefest love is due only unto God. Hence the covetous person is expressly called an idolater; and covetousness, idolatry: Col. 3:5. Mortify your earthly members; … uncleanness … evil concupiscence, and covetousness, which is idolatry. And the sensual epicure is likewise an idolater: Phil. 3:19 his belly, saith the Apostle, is his God. The proud person is an idolater: for he loves himself supremely; sets up himself for his own idol; and falls prostrate before that image, which he hath pourtrayed of his own perfections, in his own fancy and imagination. And, generally, all such, who love and admire anything above God, or esteem anything so, are idolaters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, on the First Commandment (heart / creature idolatry)</span></figcaption>

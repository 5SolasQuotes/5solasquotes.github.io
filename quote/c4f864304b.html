<main class="wrap"><figure class="quote" id="q-c4f864304b" data-kw="">
<blockquote><p>Ob. The Son and holy Ghost are not without beginning, therefore they are not eternal.

Answ. This is not a beginning of time or continuance, but only of order and offspring: but the Sabellian here cavil, viz. Christ saith, He that seeth me, seeth the Father: and believest thou not that I am in the Father, and the Father in me? Joh. 14.9.10. therefore the Father and the Son are one person. Ans. Indeed he that seeth the Son seeth the Father, because the Son hath the same essence with the Father, and being manifested in the flesh, hath delivered to us the whole will of God, Joh. 1.18.

Ob. 2. That which is one in number, cannot without contradiction be said to be three in persons: but God is one in number, (Deut. 6.4.) ergo.

Ans. That unity doth signify God’s simple essence, not the manner by which that simple essence subsisteth. Therefore God absolutely according to his essence is one, because he is indivisible: and only in respect of inward relation, I meane the reason of subsisting, is three.

Ob. 3. If there be one being of the Father, another of the Son, and another of the holy Ghost: it followeth, that in God there are three divers beings, and consequently three divers persons.

Ans. The being of the Father doth not signify that essence by which he is absolutely God, but by which he is Father, that is, in that he otherwise subsisteth then doth the Son: therefore the being of the Father is one thing, and the being of the Son is another, and yet both of them have the same essence.

Ob. 4. If there be three Persons truly distinguished, and one only essence, then is there a quaternity in God.

Ans. Not so: for the essence differeth from Person only in reason: but the Persons differ each from other both in reason and in being.

Ob. 5. The Father begot his Son either existing or not existing, to say either of these is absurd.

Ans. We may well say, that the Father begat his Son already existing, because the Father was never without the Son, even as the sun was never without his light. Again, it may be as well said, that he begat him not existing, in that his generation, although it be eternal, yet in order goeth before existence, as the sun is before his light.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guillaume-bucanus.html">Guillaume Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian religion framed out of God’s word, and the writings of the best divines, methodically handled by questions and answers, fit for all such as desire to know, or practise the will of God</cite>, trans. Robert Hill (London: George Snowdon and Leonell Snowdon, 1606), pp 10-11.</span></figcaption>

<blockquote><p>John Bidle’s XII Arguments Drawn out of the Scripture; wherein the commonly Received Opinion, Touching the Deity of the Holy Spirit, Is clearly and fully Refuted (1647) was answered by several Reformed theologians and scholars, both continental and British. These responses were full, demonstrative, and clear; but they were written largely for academics. It fell to a young parish minister, Matthew Poole, not yet thirty years of age, to provide a concise and popular response, for the edification of the common man. Poole’s Blasphemer Slaine with the Sword of the Spirit remains one of the best popular defenses of the Deity of the Holy Spirit in the English language.</p></blockquote>

</figure><figure class="quote" id="q-42428f32bf" data-kw="">
<blockquote><p>From this [popish] bondage we were delivered at the Reformation; but though the Fathers of Protestantism escaped the worst errors of the Church of Rome, they were tempted into an imitation of the exclusive spirit of Popery. Luther himself, when he refused to give the right hand of Christian fellowship to the Fathers of the Swiss Church, upon a point which he had not at first regarded as essential, laid the foundaton of the division between the Lutheran and the Reformed Churches.

The example has been followed in breaking down Churches into minor subdivisions throughout Europe and in the New World; and a want of zeal for external as well as internal unity has hitherto been the weakness and the reproach of Protestantism. It has exhibited itself both in the active and passive forms above referred to; the former being chiefly manifest in powerful communities (especially, though not exclusively, in connection with the State), in laying down conditions of communion upon topics which they own to be indifferent, but which are viewed as sinful by others who are thus thrust forth in segregation.

While the passive form has naturally been resorted to by smaller and less influential sects, in erecting, as they have sometimes silently done, partitions of proud or sullen seclusion. And in this way the Reformed Churches, not only in different countries, but even in the same land, present themselves to the eye, rather as separate and independent kingdoms, than as constituting merely different cantons and dependencies of one confederate commonwealth, the united members of one compact body politic.</p></blockquote>

<blockquote><p>It does not follow that a doctrine is untrue because it is incomprehensible. The Bible teaches the doctrine of the Trinity. The rationalist denies it. It is a contradiction, he says. But it is not a contradiction, for the human mind cannot believe a contradiction, and the doctrine of the trinity is a cardinal one in the Christian’s creed. Incomprehensible it undoubtedly is, but this is no argument against it, unless, indeed, the man who makes it is omniscient.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-971e4b8f59" data-kw="">
<blockquote><p>2. If Archippus has the same office to the whole congregation and to every single member, then as he has pastoral acts of teaching and ruling to the whole, [then] so [he has them] to the parts and single members; but this latter is denied by Mr. [Thomas] Hooker [an Independent], who says that a pastor cannot put forth pastoral acts but in the church assembly; a strange imagination!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker... (London, 1658)</cite>, Bk. 2, ch. 4, p. 209</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d2a78fca8a" data-kw="">
<blockquote><p>Prayer is to be made for things lawful… The reading of the Scriptures, preaching, and hearing the Word of God, singing of psalms; as also the administration of baptism and the Lord’s Supper, are all parts of religious worship of God, to be performed in obedience unto God with understanding, faith, reverence, and godly fear. Solemn humiliations, with fastings and thanksgivings upon special occasions, are in their several times and seasons to be used in a holy and religious manner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/congregationalists.html">Congregationalists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Savoy Declaration of Faith &amp; Order, 22.4-5 (1658)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-497ecc260a" data-kw="">
<blockquote><p>Secondly, Paul requires the elders of the Church of Ephesus to take heed unto and to oversee the whole flock, which did consist of more than did or could then meet together ordinarily into one place for the worship of God, as appears by the Church in the house of Aquila and Priscilla (which was one, but not the only one church assembly at Ephesus) by the great and wonderfull increase of the Gospel at Ephesus… Peter also writing to the churches of the strangers in several provinces, calls them the ‘flock’, not ‘flocks’, and commends unto the elders the feeding and oversight of that flock… No doubt they had the administration of the Word and sacraments partitive, or severally. Nor do I deny but they had a partitive several government: but there was also an union or association of them under one common government, which did denominate them to be one visible, ecclesiastical flock.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming... (1646), bk. 2, ch. 9</cite>, p. 298</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-257a0d3a59" data-kw="">
<blockquote><p>Answer: This [argument of Rutherford’s Independent opponent] speaks against glebes [contracted lands] of ministers, but the New Testament speaks not of manses or houses, or of moneys for ministers; yet a wage we know is due, Matt 10:10; 1 Cor. 9:8-10; Gal. 6:6, and the Levites were not to be distracted from the most necessary work of the Tabernacle and service of God more than ministers, yet they had lands and towns assigned of God to them; though the less distractous the wages be, the better and the more convenient they are, 2 Tim. 2:3-5. As for the tithes, we think quotta decimarum, or a sufficient maintenance of tithes or what else may conduce for food and raiment, of divine right, Matt 10:16; 1 Cor. 9:8-9, tithes formally as tithes are not necessary, so [as long as] the ministers be provided and a stipend be allowed to them, not as an alms but as a debt, Luke 10:7. But the stinting [frugal restricting] of maintenance for ministers the author [Rutherford’s opponent] condemns, because when Constantine gave large rents to the Church, it proved the bane of the Church. But I answer, stinting makes not this, but excess, for mountains of rents may be stinted no less than mole-hills.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Due Right of Presbyteries (1644), 2nd Part, pp. 465-66 Scottish commissioner to the Westminster Assembly</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

t%20of%20Rutherford%E2%80%99s%20Independent,be%20stinted%20no%20less%20than%20mole%2Dhills&amp;text=Answer%3A%20This%20%5Bargument%20of%20Rutherford%E2%80%99s%20Independent%20opponent%5D%20speaks&amp;text=rents%20may%20be%20stinted%20no%20less%20than%20mole%2Dhills" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-64accecdb3" data-kw="">
<blockquote><p>That all the members of the catholic Church are united in this profession [of the Christian faith] is very true; but this is not all, they are bound to more than this, viz. to the exercise of the same specifical ordinances, to subjection to the same discipline, as also to love to one another, and where it is possible, to the celebrating together of the same numerical worship. And in any of these, to make any differences, is a breach of that union, that ought to be among the members of the catholic visible Church. … For when Christ has instituted that every church meeting together, and every member of the catholic Church, should exercise the same specifical ordinances, is not this a Church union, or union of Churches? And let it then be considered, that if every member of the Church catholic may be a member of any or every particular church, where providence may cast him (being rightly qualified thereunto), having right first to the same specifical ordinances as a member of the catholic, and then to the same numerical ordinances, where he comes and finds them (as some of his own way [that is congregationalism] do grant, and cannot well be denied), then the denial of such a person to join in those numerical ordinances [such as congregationalists practice] is a breach of that union and love which ought to be between the members of the catholic Church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Independency a Great Schism, Proved Against Dr. [John] Owen… (London, 1657)</cite>, ch. 5; pp. 93-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

<blockquote><p>A bishop ordained of God, or set up by the law of God, does declare nothing else but their calling, which by an other more special name, are called pastors, whom (says Luke [in Acts 20]) the holy Ghost has appointed bishops to feed the Church of God. And either of these names of pastor or of bishop is proper to them in the New Testament, whereby the apostle does distinguish them from apostles, prophets, and evangelists, which were callings to endure for a time, Eph. 4:11, and from deacons, 1 Tim. 3 and Phil. 1:1, for otherwise they are everywhere called elders… But they are called bishops in regard of the sheep committed unto them, as though a man should call them watchmen of [or?] overseers. These now were one alone, as where any church had but one pastor, or more if the church had more than one. And the meeting of them together jointly with their elders, whom Paul calls ‘governors’ [1 Cor. 12], of the other common name called, was the eldership. Their duty was to attend on the word and prayer, both publicly and privately, and in common to governe the Church, as appears by many places of Scripture. … Of the Bishop that is of Man The bishop that is of man, that is to say, brought into the Church by the alone wisdom of man, besides the express Word of God, is a certain power given to one certain pastor above his other fellows, yet limited with certain orders or rules provided against tyranny. They which did bear this office of bishop, are called bishops in regard of their fellow elders and the whole clergy, as watchmen set over the clergy. That this calling was not brought in by the Word, it is manifest by that, that there is not to be found in the New Testament so much as one syllable, whereby there may be the least surmise of any such thing. For although we doubt not, but all things ought to be done orderly in the Lord’s house, and therefore that some one should be president in every assembly… … The Answer to the First Question Where as Satan’s bishop has been the overthrow of the Church and all Christian kingdoms, whose head is the Roman Antichrist, it is to be looked unto of all hands, especially of all godly princes, that they at once abolish it, if they mind the reformation of the Church and their own safety. As for the bishop ordained by man and brought into the Church by little and little, whereby Satan made him a way for greater things, it had been tolerable… experience of so many ages does teach us too well, that unless this root also be plucked up, it will come to pass that the same fruit will sprout and bud forth again. Finally, seeing the Lord has so often decided this controversy of superiority among his own disciples, that He shut it clean out, seeing the rule both for doctrine and good order of the Church is to be sought for out of the very writings of the apostles: and it is manifested, the churches then prospered, when all this authority of one man over the rest, yet was not, but as that grew up, so all things fell to decay. Finally, seeing where the remnants of this government by a few are not clean taken away, the work of the Lord, is openly hindered: Our judgement is that after the chasing away of this device of man, the churches shall be well provided for, if they may be repaired according to the writings of the apostles.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2d68b0f711" data-kw="">
<blockquote><p>Here it must be noted that Church history has constrained all that understand it to confess (both Papists, Greeks and Protestants) that: [1.] The ordination of bishops and presbyters was in the power of the bishops, and the election in the power of the people, not only the first 300 years under heathen emperors, but for many hundred years after under Christian emperors and princes.

2. That this was taken for their right given them by God. To cite more proofs, for this would expose us to the reader’s censure as unnecessary tediousness: Many Papists largely prove it, as does David Blondel beyond exception, De jure plebis in regimine Ecclesiastico, with more.

3. That yet we here plead not for the necessity of so much as the people’s election as it signifies the first nomination of the person, but only for the necessity of consent, either explicitly or implicitly expressed. If the senior pastors have the first nomination, or, if it be the magistrate, or patrons, as with us, we quarrel not against it if the flock do but consent. Parents may choose husbands and wives for their children; but they are not such at all till mutual consent.</p></blockquote>

</figure><figure class="quote" id="q-73ce228bfb" data-kw="">
<blockquote><p>It is one of the greatest objections against the suppressing… of… errors and schisms, ‘O,’ say they, ‘this is a persecuting of those that are godly; this is a wound to piety, and the power of godliness.’ I do not deny but there may be, and is, true piety in many who are somewhat infected with the leaven of false doctrine, and live in some erroneous opinion… Those that are truly godly may in diverse things differ in opinion. Every error is not inconsistent with holiness, yet every error doth pro tanto [by so much], and proportionably retard, hinder, and prejudge holiness; and although the devil sow his tares among Christ’s wheat (I mean in the same persons as well as in the same church), yet who will say that a field of wheat is nothing the worse for the tares?… And this I hold as a good rule in practical divinity… so error of judgment, if continued in, doth not only hinder growing, but makes a dangerous decreasing and falling short in true piety… It is to be observed that sometimes the Scripture speaks of an error of the judgment concerning the faith as a fountain and cause of ungodliness, profaneness… 2 Tim. 2:16-19; Gal. 5:4; 2 Jn. 9; as contrariwise, there is a light and knowledge which preserves from sin and ungodliness, and leads the soul in ways of holiness and obedience, Ps. 9:10; 119:33-34; Jn. 17:17. If the knowledge of God, of his Christ, and of his Word, and will, and name and statutes, preserve us from sin, and lead us in the ways of obedience, then, by the rule of contraries, error of judgment in these things will ensnare us in sin and wickedness.</p></blockquote>

<blockquote><p>III. …acts of divine worship are twofold, some which do not differ from the worship itself (to wit, from piety and holiness, in which worship essentially consists); others ordinated to worship as helps or instruments to perform that worship suitably and declare it abroad. The former kind of acts can be instituted and commanded of God alone, who is the sole chief and legislator, who has dominion over the conscience; nor does any right belong to the church of adding, taking away or changing anything. The latter, again, are either necessary and so also instituted by God, at least as to being (to on)–for example that assemblies should be held, the word preached, the sacraments administered; others are contingent and free as to quality (to poion), the reason of which depends upon the honesty and fitness of particular churches (to wit, that assemblies should be held in this or that time and place and the sacraments administered). The former, as being necessary, depend upon God alone and the church has no control or power over them; the latter God has thus far left to the will of the church as means and indifferent, so that a regard be always paid to divine truth., Christian simplicity and public edification. … XIX. The object of this directive power is not the doctrine itself of faith and worship (which rests upon the Word of God alone), but other things concerning which the express Word of God is not given, which are either merely indifferent and free or ambiguous and doubtful, concerning which God has delivered nothing certain in particular, such as was the case about which the apostle speaks in 1 Cor. 7:10,12, or which refer to the mode of external worship, or the determination of the circumstances, without which the precepts of the first table and the public exercises of piety in ecclesiastical assemblies scarcely and not even scarcely can be rightly observed and performed. Here pertain the time, place, form and rule of prayers, addresses, of the administration of the sacraments, fasts, alms-giving: all of which ought to be established and exercised not with confusion, but rightly and decently (euschemonos) for the edification of the church. Since these in themselves are indifferent and do not directly touch the mystery of our salvation, they do not of themselves bind the conscience, nor yet are they so fixed and immovable that they may not be reformed and changed where the use of the church shall demand.</p></blockquote>

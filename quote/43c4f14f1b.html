<main class="wrap"><figure class="quote" id="q-43c4f14f1b" data-kw="">
<blockquote><p>And because in this matter it chiefly behoves to know who is truly said to be an heretic or whom is a schismatic: of these matters I will first of all speak these few words. St. Augustine thinks that this difference there is between an heretic and a schismatic: That a heretic does corrupt the sincerity of faith and doctrine of the apostles with his wicked doctrine; and a schismatic, although he sin not at all against the pure doctrine and sincere faith, yet he rashly separates himself from the Church, breaking the bond of unity. And surely he properly is an heretic, whosoever he be that contrary to the Scripture, which is the Word of God, against the Articles of Faith,¹ or against the sound opinions of the Church grounded on the Word of God, through hope of any temporal commodity, of his own brain and fleshly choice chooses, receives, teaches, follows strange things, and stiffly retaining does both defend them and spread them abroad. ¹ [This likely refers to the Apostles’ Creed, which was also known as the 12 Articles, and around which Bullinger’s Decades was roughly organized.] By the imperial edict of Augustus Cesar, Gratian, Valentinian and Theodosius, they are defined to be catholics or Christians who continue in that religion which St. Peter taught the church of Rome and which blessed Damasus and St. Peter, bishop of Alexandria, did teach, that is to say, confessing according to the teaching of the apostles and doctrine of the Gospel the only Godhead of the Father, and of the Son, and of the Holy Ghost in equal majesty and in an holy Trinity. And again they are by them declared to be heretics, who follow contrary opinions, whom they accompt both mad and infamous, and worthy of punishment. And he is a scismatic, whosoever he be that separates himself from the unity of the true Church of God, and either himself gathers together new assemblies, or joins himself to congregations gathered by others, albeit in doctrine he err little or nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty Godly &amp; Learned Sermons divided into Five Decades</cite>, … (d. 1575; London: Newberrie, 1577), 5th Decade, Sermon 2, “That there is one catholic Church”, p. 850</span></figcaption>

</figure><figure class="quote" id="q-620c90814e" data-kw="">
<blockquote><p>the constant and earnest wish of all good men for these hundred years past… that the Protestant Churches which differ one from another about some points of religion, laying aside or at least moderating on both sides their over-tenacious adhering to their own opinions, may now at length be united and made up into one body… we [the reformed and Lutherans] are not at variance about any fundamental point of Christian religion, or such wherein men may not safely be of either opinion without hazarding their salvation… we make no doubt but every man would then readily wish for this much-desired communion, which none ever shunned or refused but out of a kind of religion and conscience, conceiving it unlawful to entertain a communion with any that are not of the same belief and opinion with themselves: so soon as men on both sides shall be wrought off from this superstitious conceit, they will gladly run and rush (as it were) into one another’s arms and embraces… how foul and scandalous a thing, how hurtful to both sides, how dangerous and pernicious to the whole Christian world this Schism is which has hitherto divided and distracted us… seeing we confess that whatsoever is of necessity for salvation to be believed or done by us, it is all clearly and plainly laid down in this Gospel, what hinders why we may not jointly confirm and ratify those articles wherein we both agree? and for those other points about which we differ, we may express them in such words and phrases as the sacred Scriptures afford us…</p></blockquote>

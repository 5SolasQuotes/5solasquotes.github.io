<main class="wrap"><figure class="quote" id="q-d931506157" data-kw="Infallibility of the church">
<blockquote><p>For if the church ought to be infallible, the Holy Spirit would undoubtedly somewhere have told believers of it, as of a thing of the greatest importance to confirm the faith of the pious and to guard them against all seductions. Otherwise he would appear to have been wanting in a thing the most necessary of all and which it was of the greatest moment for the church to know. But nowhere is mention made of this privilege having been given to any certain church; for it will be shown hereafter that the many passages adduced by our opponents to prove this thing do not prove it. So far from its being said that this was granted to the Roman church (as ought to have been said by all means, if any such thing belonged to it), on the contrary Paul earnestly admonishes it of the danger of defection and of their impending fall: “Because of unbelief they were broken off, and thou standest by faith. Be not highminded, but fear: For if God spared not the natural branches, take heed lest he also spare not thee” (Rom. 11:20, 21).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/infallibility-of-the-church.html">Infallibility of the Church</a> › <a href="../topics/the-church/infallibility-of-the-church/against-rome.html">Against Rome</a></span><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a> › <a href="../topics/rome/the-church/infallibility.html">Infallibility</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b4ae17b616" data-kw="Canon Church can err">
<blockquote><p>If then we grant that that church, which was the whole and sole church at that particular time, could have rejected canonical books, then it is evident that the church may err, which the papists will not be willing to allow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 1, ch. 5</span></figcaption>

</figure><figure class="quote" id="q-3e0ab16df0" data-kw="Seat of infallibility">
<blockquote><p>They are not yet agreed among themselves on the seat of this infallibility, nor is it known as yet with whom it ought to be—with the pope or with a council. Some claim this privilege for a council, as is done by all those who believe the pope to be fallible and who on that account wish the council to be above him (as it was decreed in the councils of Constance and Basil and is constantly believed by the French church). Others ascribe it to the pope, as those who maintain that he is superior to a council (as the Council of Trent determined and with it the canonists and Scholastics).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.19</span></figcaption>

</figure><figure class="quote" id="q-5e87bb7bf1" data-kw="Supreme judge">
<blockquote><p>The supreme judge of controversies and legitimate interpreter of scripture should have these three properties: the first is, that we should certainly know that the sentence which he delivers is true, and that we can acquiesce in it; the second, that no appeal from that sentence shall be lawful; the third, that he be influenced by no partiality. Now the church or the pope possess none of these; whereas the scripture, and the Holy Spirit speaking in the scripture, have them all. Therefore the supreme decision is to be given to them, and not to the church or the pope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 8</span></figcaption>

<blockquote><p>Question: But how could he [Paul] wish this [to be accursed from Christ for his brethren’s sake, in Rom. 9:3], seeing it imports a diminution of the love of God… Answer: If ye will consider this petition by itself, it was neither sin nor dimunition of this love: but if ye will consider the consequents of this wish, if indeed he had been excluded from the Kingdome of heaven, then it had been a sin for him to have wished it. One may wish a thing simply without sin, yet to wish it vestitum omnibus circumstantiis [clothed with all circumstances] it may be sin. Example: a woman has her husband to be executed for some capital offence, the woman wished her husband to live, as her husband and a father to her children to provide for them; but if she should desire her husband to live as an enemy to the commonwealth contrary to the law, then her wish were a sinful wish: So for Paul to wish this to testify his earnest love to the Church, it was no sin; but if he had wished it vestitum ominibus circumstantiis, with a diminution of the love of God and want of eternal happiness, then his wish had been sin. Again we wish a thing antecedente voluntate vel consequente voluntate, ‘with an antecedent or consequent will.’ Example: a judge by his antecedent will wishes that all the subjects may live; but by his consequent will, he wishes the malefactor to die. So Paul wished this by his antecedent will, but not considering it with all the consequents that might follow upon it. Fourthly, Paul wished not this absolutely, but in comparison: as the natural mother who pleaded before Solomon chose rather that the child should be given to her who was not the mother of it than that the child should be cut in two, 1 Kn. 3:26. If ye consider Paul’s wish here, it was only in comparison; rather than they should die, he wishes this to himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Moral Law, or Ten Commandments... (London: Cotes, 1632), bk. 1, Commandment 1, Exercitation 7</cite>, pp. 50-51</span></figcaption>

<blockquote><p>3. Voluntas efficax and voluntas inefficax…. But what of the possibility that God’s will can be distinguished into voluntas efficax [an effective will] and voluntas inefficax [an ineffective will]? This latter distinction is ill chosen, but will stand if it refers to the effectual will of God to the decree and the ineffectual will to the divine precepts, the former being incapable of resistance and the latter resisted successfully by all evildoers. If a distinction between effective and ineffective will is sought in the voluntas decreti [will of decree] itself, this is repugnant and deeply in error…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary, ed. 1 | PRRD, vol. 3</cite>, p. 470</span></figcaption>

</figure><figure class="quote" id="q-b0fff760f8" data-kw="">
<blockquote><p>§.10. Otherwise the will of God is distinguished into the will of sign [voluntas signi] and the will of good pleasure [voluntas beneplaciti]. The latter is, and is conceived as, the very complacency of God decreeing concerning the futurition of things, and approving Himself and whatever is in some manner similar to Himself. The former, which is called of sign, is indicated through some sign, and is made manifest among men: of which the will of precept is also a part. For those signs are referred to the number of five, and were formerly comprehended in this verse: He foretells, forbids, permits, commands, fulfils [Prædicit, prohibet, permittit, præcipit, implet]. §.11. Here it is inquired whether the will of precept and the will of decree do not very often conflict with one another: because what He wills by the will of precept, we often see not to come to pass, and thus it is evident from the event that God in His decree willed it not to be done. But we easily reconcile these by observing that the will of the mandate says nothing other than that God wills the obligation of the rational creature: but the will of decree, that He wills to permit a particular man not to answer to his obligation; or sometimes, if the mandate be positive, that He wills the obligation to endure for a time, until He Himself dissolves it. §.12. Those who distinguish the will of God into efficacious and inefficacious, absolute and conditional, antecedent and consequent, etc., in order to free the liberty of the will [libertas arbitrii] from all necessity of the event, labor in vain and ascribe many imperfections to God. Wherefore we acknowledge no will of decree which is not efficacious, absolute, and antecedent, as in the chapter on the decree of God we shall see that no other is to be admitted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/salomon-van-til.html">Salomon Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Both Theologies, even Natural &amp; Revealed… (1703; 1719), 1. Nature of God, subsection 4, ‘On the Will of God’ tr. AI by Roman Prestarri Latin</cite></span></figcaption>

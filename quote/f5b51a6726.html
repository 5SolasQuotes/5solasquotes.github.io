<main class="wrap"><figure class="quote" id="q-f5b51a6726" data-kw="">
<blockquote><p>I would not be understood to extend this too far, as some, through a Mistake dangerous enough, do, as if thereby we were forbid civil or neighbourly Converse with Persons that are not religious; for this is not only lawful, but a Duty; we have not only Scripture Commands to this Purpose, but the very Law of Nature obliges us to it: And we are sure, GOD did never by any positive Precept enjoin us any Thing contrary to this. Nay, upon the contrary, we see plainly, That a Walk according; to the Law of Nature in this Matter, is highly congruous to Religion. If such Persons do visit us, we may visit them again, and carry it friendly.

This is one Part of that Courteousness that the Apostle Peter enjoins us, I Pet. iii. 8, Finally, be ye all of one Mind, having Compassion one of another; love as Brethren, be pitiful, be courteous. And where as the Refusal of civil Converse, in enquiring after one another’s Health, visiting at some Times, and the like Acts of Kindness, is looked upon by some as a Piece of Strictness and Perfection, it is quite otherwise; for the very contrary is determined to be a Piece of a Perfection, by our great Lord and Master, who is the best Judge, Matth. v. 47, 48. And if ye salute your Brethren only, what do ye more than others? do not even the Publicans so? Be therefore perfect, even as your Father which is in Heaven is perfect.

The plain Meaning of which is this, A Christian should be a Man every way beyond others, and should have something peculiar in the Whole of his Conduct; but if ye deal only civilly and neighbourly with these of your own Persuasion, with these who in every Thing do jump with you, wherein do ye go beyond the Publicans and Sinners, the most signally impious Wretches that the World can shew again? Even Thieves and Robbers will keep some Correspondence and Civility toward these of their own Sort; but Christian Perfection calls for more Enlargement of Soul, and requires that we carry obligingly to all, and perform, as Occasion calls, all the Duties of Love, which comprehend certainly these of civil Converse and Neighbourliness, as the Apostle puts beyond all question, I Cor. x. 27, If any of them that believe not, bid you to a Feast, and ye be disposed to go, whatsoever is set before you, eat asking no Question for Conscience sake.

Thus we see Christians are allowed to converse civilly with these who are Unbelievers. And indeed not to do so, has a Tendency to brine the Way of GOD into Contempt, and to make Religion to be evil spoken of, and is contrary to the very Spirit of the Gospel, and to those many express Commands which we have of adorning the Gospel, and of conversing, so as thereby we may leave a Testimony upon the Consciences of Men. Nay, ’tis to bear Witness against GOD’s Goodness, and to rub Shame upon our Religion, as if it did narrow our Souls, and make us defective in these Duties which it obliges us to abound in.

But tho’ what we have said doth condemn the unchristian Rigidity of some, yet it will not justify the unwarrantable Choice of Persons who have no Religion, for our Intimates, or for our ordinary and daily Companions. No, we are obliged to guard against this. If we do this, we are out of our Duty, and therefore have no Reason to promise to our selves GOD’s Protection. A Person that walks, that ordinarily converses with such Men, has Reason to fear that the LORD may leave him to become like to them: And this Intimacy, I fear, is what most of you are guilty of.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-halyburton.html">Thomas Halyburton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Concern of Salvation</cite>, (Edinburgh, 1721), pp 110-12.</span></figcaption>

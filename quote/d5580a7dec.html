<blockquote><p>Fifthly, God hath Sovereign Authority over all Kingdoms, Now is the Axe laid unto the Root of the Tree, this axe was the Roman State, this Tree was the Jewish State. God hath the Authority of all in his hand, he sets one Kingdom against another. Babylon must ruin Sion: Titus and Vespatian, are stirred up by God to cut down and destroy the Jewish Nation: God hath Sovereignty over all Kingdoms, Psal. 103. 19. and can imply them to execute his judgements. Senacherib was his axe, Esa 10. 15. to cut down Nations. God makes one Kingdom an Axe to hew down another, he makes one part of a State to hew down another part of the same.

The Jewish Common-wealth was now under the Roman Empire; it’s so in England at this day, hath not God mingled a perverse Spirit amongst us, Esa. 9. 21. Ephraim against Manasseh, Manasseh against Ephraim, and both against Judah; They sought each others’ destruction as we do at this day; a perverse Spirit was mingled among them and among us. Kingdoms depend upon God, Dan. 4. 32. 2 Chap. 21. and where there is the greatest dependency, there is the greatest Sovereignty. Now Kingdoms depend upon God, quoad omnia, for their beings, upholdings and blessings, and therefore he hath, jus utendi, he may do with his own what he list, he can and may dash one Family, one Towne, one Country, and one Kingdom against another, and that without control. Who shall say to him, what doest thou?

What should this beget in us, but to fear this God that hath Sovereign authority over all flesh, over all Kingdoms; let us fear this God, Jer. 10. 7. Who would not fear thee O King of Nations? for to thee doth it appertain: Shall God be the King of Nations, the King of all Kings and not be feared? to the doth it appertain, not to men to be feared but to thee doth it appertain: The great God must be feared. Ye that are petty Kings on the Earth, you that are Gods on the Earth, you must know that this God hath Sovereign Authority over Nations, Persons, lives, consciences, he is the everlasting King or King of eternity, Jer. 10. 10. He can, will, and must, dispose of you err long eternally in heaven or hell, Job 36. 8, 9, 10.

When Families and Kingdoms are in fetters under the afflicting hand of God, then He shews them the excessiveness of their sins, and commands them to return from iniquity. Did not God command them before? yes, but then they slighted God, being at ease and in prosperity, His commands were not regarded, but when God cast into straights, fetters and afflicts Families or Kingdoms, their ears are opened, they harken to Discipline? What they formerly contemned, is now precious, and they see Authority and Majesty in the command of God, Mic. 6. 9.

The King of Nations is wroth with this Kingdom, He hath it in fetters, let us hearken to His commands, and tremble at his Sovereignty. Psal. 99. 1. The Lord Reigneth let the Earth tremble; let all the Potentates and Inhabitants of it tremble and quake before him: It’s for our advantage to do it. Hab. 3. 16. when the Chaldeans were to come up and besiege Jerusalem, the Prophet apprehending it beforehand, quivered and quaked, and why was it? that he might rest in the day of trouble: that soul which trembleth when judgement is in the Cloud, when the Axe is at the root of the tree, shall have rest in the day of trouble: Isa. 66 2. To him will I look that is of a contrite Spirit, and trembleth at my word: God will look to him, that the flood shall not drown him, nor the Axe cut him down. Lot is saved when the fire consumed Sodom; God was to him a Sanctuary, he feared God and God was his defence, Esa. 8. 13, 14. When we have frames of Spirit suitable to the Authority and Majesty of the great God, that is Lord of Kingdoms, that raises and ruins them at his pleasure, then we sanctify God in our hearts, and he will be a Sanctuary unto us, and such a Sanctuary is needful for these times.</p></blockquote>

<blockquote><p>IN the year 1521 and the year ensuing, there arose a certain number of mutinous and seditious persons, who secretly made Factions: they chiefly dwelt in the quarters of Saxony, which bordered upon the River Salah; among whom their chief was Nicholas Stork.

They dreamed dreams, and said, That they spake familiarly with God by Visions, they preached their dreams for truths and Divine Oracles; and because that there should come a new world, wherein should dwell righteousness: Therefore they ought to exterminate all the wicked, with all the Princes and unbelieving Magistrates, from off the earth (they called all those unbelievers which were not of their Sect and Faction.)

From out of this School came Thomas Muntzer, Dr. Balthazar Hubmore, Melchior Rink, John Hutt, John Deuter, Lodovike Hetzer, &amp;c. All these boasted that they familiarly conferred with the Lord. In their teachings, they with heat of affection did defame and detract from the Ministers of the Gospel: afterward with the like violence fell upon the Magistrate, thinking that if they could make void these two Orders unto the Church, the wolves might safely fall upon and dismember the Flock; wherefore these wolves, (i. e.) these false Teachers, have always principally set themselves against the Ministers of the Church, and the Magistrates, to see if they could drive them out from the Flock, or at least disgust some of the sheep against their Pastors; that so estranging them from them, they might undo them.</p></blockquote>

<blockquote><p>Cap. 29. He [Thomas Hobbes] is angry with those who say, [That every private man hath a property in his goods.] Among the Turks [Muslims] indeed no private man hath any property at all; under Christian Princes private men live more happily, who enjoy a property, yet not simply absolute, if we consider that the Prince hath a right to our goods in cases of necessity, as in his own, and Country’s defence, and such like cases, in this regard no man is born for himself, nor hath any man an absolute property in his own life, which he ought when occasion urgeth, lay down for his Country: Dulce &amp; decorum pro patria mori; therefore Plato saith well, That our Country requires a share in our birth; the property then of the subject excludeth not the Princes right in cases of necessity, but only his arbitrary power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Leviathan drawn out with a hook, or, Animadversions upon Mr. Hobbs his Leviathan. Together with some observations upon Sir Walter Raleigh’s History of the World</cite>, (London: Richard Royston, 1653), p. 31.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Cap. 29. He [Thomas Hobbes] is angry with those who say, [That every private man hath a property in his goods.] Among the Turks [Muslims] indeed no private man hath any property at all; under Christian Princes private men live more happily, who enjoy a property, yet not simply absolute, if we consider that the Prince hath a right to our goods in cases of necessity, as in his own, and Country’s defence, and such like cases, in this regard no man is born for himself, nor hath any man an absolute property in his own life, which he ought when occasion urgeth, lay down for his Country: Dulce &amp; decorum pro patria mori; therefore Plato saith well, That our Country requires a share in our birth; the property then of the subject excludeth not the Princes right in cases of necessity, but only his arbitrary power.”

— Alexander Ross, Leviathan drawn out with a hook, or, Animadversions upon Mr. Hobbs his Leviathan. Together with some observations upon Sir Walter Raleigh’s History of the World, (London: Richard Royston, 1653), p. 31.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCap.+29.+He+%5BThomas+Hobbes%5D+is+angry+with+those+who+say%2C+%5BThat+every+private+man+hath+a+property+in+his+goods.%5D+Among+the+Turks+%5BMuslims%5D+indeed+no+private+man+hath+any+property+at+all%3B+under+Christian+Princes+private+men+live+more+happily%2C+who+enjoy+a+property%2C+yet+not+simply+absolute%2C+if+we+consider+that+the+Prince+hath+a+right+to+our+goods+in+cases+of+necessity%2C+as+in+his+own%2C+and+Country%E2%80%99s+defence%2C+and+such+like+cases%2C+in+this+regard+no+man+is+born+for+himself%2C+nor+hath+any+man+an+absolute+property+in+his+own+life%2C+which+he+ought+when+occasion+urgeth%2C+lay+down+for+his+Country%3A+Dulce+%26+decorum+pro+patria+mori%3B+therefore+Plato+saith+well%2C+That+our+Country+requires+a+share+in+our+birth%3B+the+property+then+of+the+subject+excludeth+not+the+Princes+right+in+cases+of+necessity%2C+but+only+his+arbitrary+power.%E2%80%9D%0A%0A%E2%80%94+Alexander+Ross%2C+Leviathan+drawn+out+with+a+hook%2C+or%2C+Animadversions+upon+Mr.+Hobbs+his+Leviathan.+Together+with+some+observations+upon+Sir+Walter+Raleigh%E2%80%99s+History+of+the+World%2C+%28London%3A+Richard+Royston%2C+1653%29%2C+p.+31.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff7950f1691.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f7950f1691.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/07/06/alexander-ross-on-private-property-and-our-duty-to-the-state/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>There’s a difference between a Tyrant that cometh violently to force men to submit to him, or one that comes with a sudden surprise, or with any cunning ways to persuade men to come in to submit to him, and a Prince that is upon his Throne reigning, and having his Subjects acknowledging themselves to be as Subjects to him …</p></blockquote>

— Jeremiah Burroughs, The difference between the spots of the godly and of the wicked preached by Mr. Jeremiah Burroughs at Cripple Gat, e (London, 1668), p. 68.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere%E2%80%99s+a+difference+between+a+Tyrant+that+cometh+violently+to+force+men+to+submit+to+him%2C+or+one+that+comes+with+a+sudden+surprise%2C+or+with+any+cunning+ways+to+persuade+men+to+come+in+to+submit+to+him%2C+and+a+Prince+that+is+upon+his+Throne+reigning%2C+and+having+his+Subjects+acknowledging+themselves+to+be+as+Subjects+to+him+%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+The+difference+between+the+spots+of+the+godly+and+of+the+wicked+preached+by+Mr.+Jeremiah+Burroughs+at+Cripple+Gat%2C+e+%28London%2C+1668%29%2C+p.+68.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F60d951ee5b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/60d951ee5b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/08/21/jeremiah-burroughs-on-the-difference-between-a-lawful-prince-and-a-tyrant/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-031e75f6c4" data-kw="">
<blockquote><p>I conceive kings are conceived to have a threefold supreme power:

1. Strictly absolute to do what they please, their will being simply a law. This is tyrannical. Some kings have it, de facto, ex consuetudine [by custom], but by a divine law none have it…

2. There is another power limited to God’s law, the due proper right of kings. (Dt. 17:18-20)

3. There is, a potestas intermedia, a middle power, not so vast as that which is absolute and tyrannical, which yet is some way human. This I take what jurists call jus regium, lex regia, jura regalia regis; Cicero, jura majestatis; Livius, jura imperii, and these royal privileges are such common and high dignities as no one particular magistrate can have [inherently, or to himself alone], seeing they are common to all the kingdom… so the magazine and armory for the safety of the kingdom is in the king’s hand. The king has the like of these privileges, because he is the common, supreme, public officer and minister of God for the good of all the kingdom; and, amongst these royal privileges, I reckon that power that is given to the king, when he is made king, to do many things without warrant of the letter of the law, without the express consent of his council, which he cannot always carry about with him, as the law says. The king shall not raise armies without consent of the parliament; but if an army of Irish, or Danes, or Spaniards, should suddenly land in Scotland, he has a power, without a formally-convened parliament, to command them all to rise in arms against these invaders and defend themselves — this power no inferior magistrate has as he is, but [only] such a magistrate [as the king]. And in many such exigencies, when the necessity of justice or grace requires an ex-temporal [out of the moment] exposition of laws, pro re nata, ‘for present necessary execution’, some say only the emperor, — others, all kings have these pleasures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), Question 39, ‘Whether or No any Prerogative at All Above the Law be Due to the King, or if Jura Magestatis [the Rights of Majesty] be any Such Prerogative Royal?’, p. 193</span></figcaption>

<main class="wrap"><figure class="quote" id="q-06759181ed" data-kw="">
<blockquote><p>Note that whenever some merit derived from the sacraments or other works is mixed with faith, the result is another gospel that is not Christ’s but a radical perversion of it. Let us apply this teaching to our own times. Paul is contending for the basic principle of the gospel, which is that we are justified (or pardoned from our sins) by trusting in Christ alone and not by circumcision. Satan still objects to this principle today, but not in the same way. What he objects to now is our assertion that we receive Christ, who is our righteousness, by faith alone (that is, by trusting that he was handed over to death for our sake and that we are united with him).

Satan adds that Christ is also received by our mouths. As a result of this teaching of his, there are many people today who think that the forgiveness of sins is part and parcel of the sacramental host. How can we be surprised if they try to get righteousness and the forgiveness of sins by receiving the sacrament if that is the way they have been taught to receive Christ? But the articles of our faith teach something very different from that, and Paul opposes this notion directly in Romans 4:10–11. What we have here is a different gospel and a perversion of the gospel of Christ. Just think what great danger you are exposing yourself to if you accept such ideas.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolam Divi Pauli Apostoli ad Galatas Notae ex Concionibus Gasparis Oleviani Excerptae, et a Theodoro Beza Editae (</cite>, Geneva: Eustache Vignon, 1578). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 27.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eca3f1de29" data-kw="">
<blockquote><p>There are those who think that the good works of the just are meritorious of eternal life ex condigno by reason of the work, even if no divine agreement existed. So Cajetan teaches. … Others, on the contrary, think that good works proceeding from grace are not meritorious ex condigno by reason of the work, but only by reason of the pact and of divine acceptance. So Scotus teaches. … To us the middle opinion seems more probable, which teaches that the good works of the just are meritorious of eternal life ex condigno by reason of the pact and of the work together; not indeed that without the pact or acceptance a good work has no proportion to eternal life, but because God is not bound to accept a good work for that reward, even though it be equal and on a par with the reward, unless an agreement intervene.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.17 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-f8f5a33276" data-kw="">
<blockquote><p>But there is still greater ground for contradicting, when they are not ashamed to affirm that nothing is to prevent believers from satisfying the Law, at least in a degree proportioned to the present state, and meriting eternal life. … With the same confidence do they talk of a heaven for hire, while they themselves meanwhile continue engrossed with the present hire, after which they are always gaping.</p></blockquote>

</figure><figure class="quote" id="q-b230cc27ff" data-kw="">
<blockquote><p>Objection 2. Christ by His death, merited that our works should merit life everlasting. Answer. That is false. All we find in Scripture is that Christ, by His merit procured pardon of sin, imputation of righteousness, and life everlasting. And it is nowhere said in the Word of God that Christ did merit that our works should merit. It is a dotage of their own devising. He died not for our good works to make them able to satisfy God’s anger, but for our sins that they might be pardoned. Thus much says the Scripture, and no more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, 7:54.</span></figcaption>

</figure><figure class="quote" id="q-77047bdab6" data-kw="">
<blockquote><p>…the Lutherans could not speak of any reward and exaltation for Christ. For according to them, the human nature of Christ shared in the divine attributes of omnipresence, omniscience, and omnipotence already from the moment of the incarnation. It therefore first received these attributes not as a reward for the mediatorial work done in the state of humiliation but already before hand, in virtue or its union with the divine nature, and also kept them throughout, be it that in his humiliation Christ did not make use of them, at least no public use. The exaltation was not a true and real exaltation, but only a matter of using, or publicly using, that which He already possessed from the beginning. It was not the outcome of an antecedent human development but merely a glorious manifestation of what He already was and possessed in secret.ª ª J. Gerhard, Loci theologici, ed. E. Preuss, 9 vols. (Berlin: G. Schlawitz, 1863-75), IV, 329; J. Quenstedt, Theologia, III, 324; D. Hollaz, Examen, 748; J.F. Buddeus, Inst. theol., 787.</p></blockquote>

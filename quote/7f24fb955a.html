</figure><figure class="quote" id="q-32882f1932" data-kw="">
<blockquote><p>The reason why it is believed, that regeneration does not usually accompany baptism, is simply because no evidences of spiritual life appear in baptized children more than in those which remain unbaptized. The education of children should proceed on the principle that they are in an unregenerate state, until evidences of piety clearly appear, in which case, they should be sedulously cherished and nurtured. These are Christ’s lambs — ” little ones, who believe in Him” whom none should offend or mislead upon the peril of a terrible punishment. But though the religious education of children should proceed on the ground that they are destitute of grace, it ought ever to be used as a means of grace. Every lesson, therefore, should be accompanied with the lifting up of the heart of the instructer to God for a blessing on the means. “Sanctify them through thy truth; thy word is truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-alexander.html">A.A. Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts on Religious Experience</cite>, (Philadelphia: Presbyterian Board of Publication, 1841), pp. 26-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-322c200def" data-kw="">
<blockquote><p>Controversy 3 – Did the first reformers, Luther, Calvin and others, have a legitimate calling? We affirm against the Papists. Arguments 1. They were qualified, called by the Church, approved by the magistrate, and, originally, appointed by the Roman Church itself to teach. Objections 1. Then the Roman Church is a true Church. Reply: Originally, it was, and later it became impure, however, it did perform this according to the Word of God, that it called ministers. 2. They were not confirmed by bishops following the ordinary rituals. Reply: It was not necessary. But their calling can be called extraordinary: a. Insofar as God gave them extraordinary gifts. b. From an extraordinary impulse of the Holy Spirit. c. Insofar as God used them for an extraordinary work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-rijssen.html">Leonard Rijssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary</cite>, trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 16, ‘The Church’, p. 214</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

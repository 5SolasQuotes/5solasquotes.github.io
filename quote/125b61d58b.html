<main class="wrap"><figure class="quote" id="q-125b61d58b" data-kw="">
<blockquote><p>Concerning the matter of the Church, the Independents have learned all their unjust scrupulosity from the other; as the Brownists [separatists] require every church member to be a saint, really regenerate and justified, who at their admission have publicly satisfied the whole congregation by convincing signs of their true holiness: the other requires the same. Whatever indulgence here the Independents profess to give, either to weak ones in whom they find the least of Christ, or to women whom they remit from the congregation to speak more privately in the eldership (yet this is no other than the present practice of the Brownists at Amsterdam.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map (1645), ch. 6</cite>, pp. 105-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-cf8d9e31f7" data-kw="">
<blockquote><p>Its a wide mistake that a presbyterian Church has its formal essence from a voluntary, actual combination in such bounds, or such a circuit more or less. That is not a pillar of presbyterian Churches. For their near association, by dwelling where they may edify or scandalize one another, gives them right to be an associated Church; not simply habitation, but the habitation of such and such professors in covenant with God, baptized and giving themselves up in profession to Christ as disciples, before there be a formal consent, they are obliged to associate: yea, nor does that voluntary combination make a presbyterial Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline penned by Mr. Thomas Hooker… wherein the way of the churches of N. England is now re-examined (London, 1658)</cite>, p. 190</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-10e7eb0cf1" data-kw="">
<blockquote><p>It is uncharitable, and against the Word, to teach that when a church is dissolved, by no sin and scandal-visible, but by persecution or pestilence, that the dissolved members, though both real and visible converts, have no right to the ordinances: for if the formal cause, to wit, their confederacy into one visible body, as Mr. [Thomas] Hooker [a congregationalist] says, be removed, their visible and external right is removed. The like is to be said of visible professors, and of members of another congregation, and known godly sojourners [travelers]; these Mr. Hooker [by implication] excommunicates for no scandal, visible and invisible: for impossible it is that they can meet together in one place with their own church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline… (London, 1658), bk. 1 | ch. 19, ‘Mr. [Thomas] Hooker [a congregationalist], his formal cause of a Church visible, or Church confederating, is considered’, pp. 96-104</cite>, p. 96</span></figcaption>

 target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1a37cb9941" data-kw="">
<blockquote><p>In conclusion, the five membership vows used by the PCA were added to the Directory for Worship of the Book of Church Order by the PCUS in response to the growth of parachurch-interdenominational ministries in the late nineteenth and early twentieth centuries. This has been shown in particular with the addition of vow four that requires a member to support the church. The case was not developed in this brief article, but it is believed that the four vows adopted in 1894 were intended to distinguish church membership in the PCUS as a shepherded, historic, confessional, and evangelistic church from the parachurch, revivalism, and interdenominational churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barry-waugh.html">Barry Waugh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘History of Membership Vows, Presbyterian Church in America’</cite></span></figcaption>

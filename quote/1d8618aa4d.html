<main class="wrap"><figure class="quote" id="q-1d8618aa4d" data-kw="">
<blockquote><p>19. Also we judge it our duty to preach those plain and necessary things which the salvation of men does most depend on, and the people generally have most need to hear; that is, the opening to them their Baptismal Covenant, and the Articles of the [Apostles’] Creed, the Lord’s Prayer, the Decalogue and the Gospel-precepts; or more briefly the doctrine of faith in Christ, and repentance towards God, and of the love of God and man; to live soberly, righteously, and godly in this world, as looking and hoping for a better, Tit. 2:12. And not to fill the people’s heads with needless controversies, or vain jangling, or contending about words which edify not, but subvert the hearers; much less to perplex them with talking of the unrevealed counsels of God; nor yet to corrupt their minds by talking against our superiors, or against dissenters behind their backs, or by aggravating the faults of other men’s manner of worshipping God, or breeding in them distaste of the public worship; or talking against bishops, or ceremonies, or liturgy; nor by representing any sort of Christians who differ from us in points not fundamental, as odious to the hearers; whether Lutherans, Calvinists, Arminians, Episcopal, Presbyterian, Independent, yea or Anabaptists; no, nor to injure the Papists themselves, by making our differences seem greater than indeed they are. Our office is to preach up love, and not to preach it down and mortify it, which all those do, whatever they pretend, that attempt to represent their brethren as odious, and to hide or deny, or extenuate that in them which is good and amiable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Nonconformists’ Ministry, containing: I. the Reasons of their Preaching, II. an Answer to the accusations urged as reasons for the silencing of about 2000</cite>, … (1668-1669; 1675; London: 1681), pp. 18-19</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-25f7b99c98" data-kw="">
<blockquote><p>Must you defy your mother, because you see your brethren fighting? Their dissension is her grief: Must she lose some sons, because some others quarrel? Do not so wrong yourself in afflicting her. Will you love Christ the less because his coat is divided? Yea, let me boldly say, The hem is torn a little, the garment is whole; or rather it is fretted a little, not torn; or rather the fringe, not the hem. Behold, here is one Christ, one Creed, one Baptism, one heaven, one way to it; in sum, one religion, one foundation, and (take away the tumultuous spirits of some rigorous Lutherans) one heart. Our differences are those of Paul and Barnabas, not those of Peter and Magus: if they be some, it is well they are no more; if many, that they are not capital. Show me that Church that has not complained of distraction; yea that family, yea that fraternity, yea that man that always agrees with himself.</p></blockquote>

<blockquote><p>5th Consideration. The essential ingredients and reasons of a lawful divorce [from Romanism] are here: 1. We could not lie in one bed with that sometime sister Church of Rome, but our skin behoved to rub upon her botch-boil, and therfore we did separate from nothing but corruption. 2. There was there persecutions, and in that we are patients and ejected rather then departers on foot and horse. 3. A professed dominion over our consciences. 4. Necessity of receiving the mark of the beast, and so the plagues of the beast, to worship images, and the work of men’s hands, a necessity of professing fundamental errors that subvert the foundation of faith, did all necessitate our seperation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London: Bartlet, 1642), ch. 10, ‘Whether or not it be lawful to separate from a true Church visible, for the corruption of teachers… where faith is begotten by the preaching of professed truth?’, p. 123</span></figcaption>

%20of%20faith%2C%20did%20all%20necessitate%20our%20seperation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-23e8bfb1a5" data-kw="">
<blockquote><p>Now in the next place, for the further opening of the unity of the Faith, we are to call unto mind the distinction which the apostle makes betwixt the foundation and that which is builded thereupon: betwixt the principles of the doctrine of Christ and that which he calls perfection. The unity of the Faith and of the knowledge of the Son of God here spoken of, has reference (as we heard) to the foundation: as that which follows of a perfect man, and the measure of the stature of the fullness of Christ, to the superstruction and perfection. In the former there is a general unity among all true believers: in the latter, a great deal of variety, there being several degrees of perfection to be found in several persons, according to the measure of the gift of Christ. So we see in a material building, that still there is but one foundation, though great disparity be observed in sundry parts of the superstruction: some rooms are high, some low, some dark, some lightsome, some more substantially, some more slightly builded, and in tract of time some prove more ruinous than others; yet all of them belong to one building, as long as they hold together and stand upon the same foundation. And even thus is it in the spiritual building also, whether we respect the practical part of Christianity or the intellectual. In the practical we see wonderful great difference betwixt Christian and Christian: some by God’s mercy attain to a higher measure of perfection and keep themselves unspotted from the common corruptions of the world; others watch not so carefully over their ways and lead not such strict lives, but are oftentimes overtaken and fall fouly: that he who looketh upon the one and the other, would hardly think that one Heaven should receive them both. But although the one does so far outstrip the other in the practice of new obedience (which is the Christian man’s race) yet are there certain fundamental principles, in which they both concur; as a desire to fear God’s name, repentance for sins passed, and a sincere purpose of heart for the time to come to cleave unto the Lord. Which whosoever has is under mercy, and may not be excluded from the communion of saints. In like manner for the intellectual part: the first principles of the oracles of God (as the apostle calls them) hold the place of the common foundation, in which all Christians must be grounded: although some be babes, and for further knowledge are unskilful in the Word of righteousness; other some are of perfect age, who by reason of use have their senses exercised to discern both good and evil. The oracles of God contain abundance of matter in them, and whatsoever is found in them is a fit object for faith to apprehend: but that all Christians should uniformly agree in the profession of all those truths that are revealed there, is a thing that rather may be wished than ever hoped for. Yet the variety of men’s judgments in those many points, that belong to theological faith, does not dissolve the unity which they hold together in the fundamental principles of the catholic Faith. The unity of the Faith commended here [in Eph. 4:11-14], is a catholic unity, and such as every true Christian attains unto. ‘Till we ALL come in the unity of the Faith:’ says the apostle. As there is a common salvation, so is there a common Faith, which is alike precious in the highest apostle and the meanest believer. For we may not think that Heaven was prepared for deep clerks only: and therefore beside that larger measure of knowledge, whereof all are not capable, there must be a rule of Faith common to small and great; which as it must consist but of few propositions (for simple men cannot bear away many), so is it also requisite that those articles should be of such weight and moment that they may be sufficient to make a man wise unto salvation: that howsoever in other points learned men may go beyond common Christians, and exceed one another likewise by many degrees: yet in respect of these radical [root] truths, which is the necessary and common food of all the children of the Church, there is not an unity only, but such a kind of equality also brought in among all sorts of Christians, as was heretofore among the congregation of the Israelites in the collection of their manna; where he that gathered much had nothing over; and he that gathered little had no lack.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“Now in the next place, for the further opening of the unity of the Faith, we are to call unto mind the distinction which the apostle makes betwixt the foundation and that which is builded thereupon: betwixt the principles of the doctrine of Christ and that which he calls perfection. The unity of the Faith and of the knowledge of the Son of God here spoken of, has reference (as we heard) to the foundation: as that which follows of a perfect man, and the measure of the stature of the fullness of Christ, to the superstruction and perfection. In the former there is a general unity among all true believers: in the latter, a great deal of variety, there being several degrees of perfection to be found in several persons, according to the measure of the gift of Christ. So we see in a material building, that still there is but one foundation, though great disparity be observed in sundry parts of the superstruction: some rooms are high, some low, some dark, some lightsome, some more substantially, some more slightly builded, and in tract of time some prove more ruinous than others; yet all of them belong to one building, as long as they hold together and stand upon the same foundation. And even thus is it in the spiritual building also, whether we respect the practical part of Christianity or the intellectual. In the practical we see wonderful great difference betwixt Christian and Christian: some by God’s mercy attain to a higher measure of perfection and keep themselves unspotted from the common corruptions of the world; others watch not so carefully over their ways and lead not such strict lives, but are oftentimes overtaken and fall fouly: that he who looketh upon the one and the other, would hardly think that one Heaven should receive them both. But although the one does so far outstrip the other in the practice of new obedience (which is the Christian man’s race) yet are there certain fundamental principles, in which they both concur; as a desire to fear God’s name, repentance for sins passed, and a sincere purpose of heart for the time to come to cleave unto the Lord. Which whosoever has is under mercy, and may not be excluded from the communion of saints. In like manner for the intellectual part: the first principles of the oracles of God (as the apostle calls them) hold the place of the common foundation, in which all Christians must be grounded: although some be babes, and for further knowledge are unskilful in the Word of righteousness; other some are of perfect age, who by reason of use have their senses exercised to discern both good and evil. The oracles of God contain abundance of matter in them, and whatsoever is found in them is a fit object for faith to apprehend: but that all Christians should uniformly agree in the profession of all those truths that are revealed there, is a thing that rather may be wished than ever hoped for. Yet the variety of men’s judgments in those many points, that belong to theological faith, does not dissolve the unity which they hold together in the fundamental principles of the catholic Faith. The unity of the Faith commended here [in Eph. 4:11-14], is a catholic unity, and such as every true Christian attains unto. ‘Till we ALL come in the unity of the Faith:’ says the apostle. As there is a common salvation, so is there a common Faith, which is alike precious in the highest apostle and the meanest believer. For we may not think that Heaven was prepared for deep clerks only: and therefore beside that larger measure of knowledge, whereof all are not capable, there must be a rule of Faith common to small and great; which as it must consist but of few propositions (for simple men cannot bear away many), so is it also requisite that those articles should be of such weight and moment that they may be sufficient to make a man wise unto salvation: that howsoever in other points learned men may go beyond common Christians, and exceed one another likewise by many degrees: yet in respect of these radical [root] truths, which is the necessary and common food of all the children of the Church, there is not an unity only, but such a kind of equality also brought in among all sorts of Christians, as was heretofore among the congregation of the Israelites in the collection of their manna; where he that gathered much had nothing over; and he that gathered little had no lack.”

— James Ussher, A Brief Declaration of the Universality of the Church of Christ &amp; the Unity of the Catholic Faith… (London, 1629), pp. 14-16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+in+the+next+place%2C+for+the+further+opening+of+the+unity+of+the+Faith%2C+we+are+to+call+unto+mind+the+distinction+which+the+apostle+makes+betwixt+the+foundation+and+that+which+is+builded+thereupon%3A+betwixt+the+principles+of+the+doctrine+of+Christ+and+that+which+he+calls+perfection.+The+unity+of+the+Faith+and+of+the+knowledge+of+the+Son+of+God+here+spoken+of%2C+has+reference+%28as+we+heard%29+to+the+foundation%3A+as+that+which+follows+of+a+perfect+man%2C+and+the+measure+of+the+stature+of+the+fullness+of+Christ%2C+to+the+superstruction+and+perfection.+In+the+former+there+is+a+general+unity+among+all+true+believers%3A+in+the+latter%2C+a+great+deal+of+variety%2C+there+being+several+degrees+of+perfection+to+be+found+in+several+persons%2C+according+to+the+measure+of+the+gift+of+Christ.+So+we+see+in+a+material+building%2C+that+still+there+is+but+one+foundation%2C+though+great+disparity+be+observed+in+sundry+parts+of+the+superstruction%3A+some+rooms+are+high%2C+some+low%2C+some+dark%2C+some+lightsome%2C+some+more+substantially%2C+some+more+slightly+builded%2C+and+in+tract+of+time+some+prove+more+ruinous+than+others%3B+yet+all+of+them+belong+to+one+building%2C+as+long+as+they+hold+together+and+stand+upon+the+same+foundation.+And+even+thus+is+it+in+the+spiritual+building+also%2C+whether+we+respect+the+practical+part+of+Christianity+or+the+intellectual.+In+the+practical+we+see+wonderful+great+difference+betwixt+Christian+and+Christian%3A+some+by+God%E2%80%99s+mercy+attain+to+a+higher+measure+of+perfection+and+keep+themselves+unspotted+from+the+common+corruptions+of+the+world%3B+others+watch+not+so+carefully+over+their+ways+and+lead+not+such+strict+lives%2C+but+are+oftentimes+overtaken+and+fall+fouly%3A+that+he+who+looketh+upon+the+one+and+the+other%2C+would+hardly+think+that+one+Heaven+should+receive+them+both.+But+although+the+one+does+so+far+outstrip+the+other+in+the+practice+of+new+obedience+%28which+is+the+Christian+man%E2%80%99s+race%29+yet+are+there+certain+fundamental+principles%2C+in+which+they+both+concur%3B+as+a+desire+to+fear+God%E2%80%99s+name%2C+repentance+for+sins+passed%2C+and+a+sincere+purpose+of+heart+for+the+time+to+come+to+cleave+unto+the+Lord.+Which+whosoever+has+is+under+mercy%2C+and+may+not+be+excluded+from+the+communion+of+saints.+In+like+manner+for+the+intellectual+part%3A+the+first+principles+of+the+oracles+of+God+%28as+the+apostle+calls+them%29+hold+the+place+of+the+common+foundation%2C+in+which+all+Christians+must+be+grounded%3A+although+some+be+babes%2C+and+for+further+knowledge+are+unskilful+in+the+Word+of+righteousness%3B+other+some+are+of+perfect+age%2C+who+by+reason+of+use+have+their+senses+exercised+to+discern+both+good+and+evil.+The+oracles+of+God+contain+abundance+of+matter+in+them%2C+and+whatsoever+is+found+in+them+is+a+fit+object+for+faith+to+apprehend%3A+but+that+all+Christians+should+uniformly+agree+in+the+profession+of+all+those+truths+that+are+revealed+there%2C+is+a+thing+that+rather+may+be+wished+than+ever+hoped+for.+Yet+the+variety+of+men%E2%80%99s+judgments+in+those+many+points%2C+that+belong+to+theological+faith%2C+does+not+dissolve+the+unity+which+they+hold+together+in+the+fundamental+principles+of+the+catholic+Faith.+The+unity+of+the+Faith+commended+here+%5Bin+Eph.+4%3A11-14%5D%2C+is+a+catholic+unity%2C+and+such+as+every+true+Christian+attains+unto.+%E2%80%98Till+we+ALL+come+in+the+unity+of+the+Faith%3A%E2%80%99+says+the+apostle.+As+there+is+a+common+salvation%2C+so+is+there+a+common+Faith%2C+which+is+alike+precious+in+the+highest+apostle+and+the+meanest+believer.+For+we+may+not+think+that+Heaven+was+prepared+for+deep+clerks+only%3A+and+therefore+beside+that+larger+measure+of+knowledge%2C+whereof+all+are+not+capable%2C+there+must+be+a+rule+of+Faith+common+to+small+and+great%3B+which+as+it+must+consist+but+of+few+propositions+%28for+simple+men+cannot+bear+away+many%29%2C+so+is+it+also+requisite+that+those+articles+should+be+of+such+weight+and+moment+that+they+may+be+sufficient+to+make+a+man+wise+unto+salvation%3A+that+howsoever+in+other+points+learned+men+may+go+beyond+common+Christians%2C+and+exceed+one+another+likewise+by+many+degrees%3A+yet+in+respect+of+these+radical+%5Broot%5D+truths%2C+which+is+the+necessary+and+common+food+of+all+the+children+of+the+Church%2C+there+is+not+an+unity+only%2C+but+such+a+kind+of+equality+also+brought+in+among+all+sorts+of+Christians%2C+as+was+heretofore+among+the+congregation+of+the+Israelites+in+the+collection+of+their+manna%3B+where+he+that+gathered+much+had+nothing+over%3B+and+he+that+gathered+little+had+no+lack.%E2%80%9D%0A%0A%E2%80%94+James+Ussher%2C+A+Brief+Declaration+of+the+Universality+of+the+Church+of+Christ+%26+the+Unity+of+the+Catholic+Faith%E2%80%A6+%28London%2C+1629%29%2C+pp.+14-16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F23e8bfb1a5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/23e8bfb1a5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=Now%20in%20the%20next%20place%2C%20for,that%20gathered%20little%20had%20no%20lack&amp;text=Now%20in%20the%20next%20place%2C%20for%20the%20further&amp;text=and%20he%20that%20gathered%20little%20had%20no%20lack" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>III. But they [Arminians] do unwisely prove that which is not in controversy. For we do not teach, we do not acknowledge that irresistibility which they attribute to us. This conclusion therefore does not hurt us, who do willingly confess that the Holy Ghost does not always so work in men’s hearts that He takes away all resistance… the question is, whether it may be that they may never be converted, and may finally resist the spirit of adoption. To the proving of this, the places which speaks of reprobates, which we confess do finally resist God calling, and do want the spirit of adoption, are plainly besides the purpose. Finally, these sectaries do not prove that in all these places [of Scripture] it is spoken of a final resistance, of which alone it is spoken here.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism</cite>, … (1619; London, 1635), pp. 478-79</span></figcaption>

<blockquote><p>Calvinists, indeed, do not admit that it is an accurate mode of stating the question, to put it in this form,—whether or not the grace or gracious operation of the Spirit be irresistible? for they do not dispute that, in some sense, men do resist the Spirit; and they admit that resistance to the Spirit may be predicated both of the elect and of the non-elect,—the non-elect having operations of the Spirit put forth upon them which they resist or throw off, and never yield to,—and the elect having generally resisted the operations of the Spirit for a time before they yielded to them. Accordingly, although the only thing in the Arminian declaration, as given in to the Synod of Dort [1618-9], which was regarded as containing a positive error in doctrine, was the assertion that, as to the mode of the Spirit’s operation in conversion, it was not irresistible, there is not, in the canons of the synod, any formal deliverance, in terminis [in such terms], upon this precise point, though all that the Arminians meant to assert, by denying the irresistibility of grace, is clearly and fully condemned. This statement likewise holds true, in all its parts, of our own [Westminster] Confession of Faith. It does not contain, in terminis [in such terms], an assertion of the irresistibility, or a denial of the resistibility, of the grace of God in conversion; but it contains a clear and full assertion of the whole truth which Arminians have generally intended to deny by asserting the resistibility of grace, and which Calvinists have intended to assert, when—accommodating themselves to the Arminian phraseology, but not admitting its accuracy—they have maintained that grace in conversion is irresistible. They [Calvinists] object to the word irresistible, as applied to their doctrine, because of its ambiguity,—because, in one sense, they hold grace in conversion to be resistible, and in another, not. It may be said to be resistible, and to be actually resisted, inasmuch as motions or operations of the Spirit upon men’s minds—which, in their general nature and bearing, may be said to tend towards the production of conversion—are resisted, or not yielded to, by the non-elect, and for a time even by the elect; while it may be said to be irresistible,—or, as Calvinists usually prefer calling it, insuperable, or infrustratable, or certainly efficacious,—inasmuch as, according to their doctrine, whenever the gracious divine power that is sufficient to produce conversion, and necessary to effect it, is put forth, it certainly overcomes all the resistance that men are able to make, and infallibly produces the result.</p></blockquote>

get="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>c. Special grace is irresistible. This does not mean that it is a deterministic force which compels man to believe against his will, but that by changing the heart it makes man perfectly willing to accept Jesus Christ unto salvation and to yield obedience to the will of God. Common grace is resistible, and as a matter of fact is always more or less resisted. Paul shows in Rom. 1 and 2 that neither the Gentiles nor the Jews were living up to the light which they had. Says [W.G.T.] Shedd: “In common grace the call to believe and repent is invariably ineffectual, because man is averse to faith and repentance and in bondage to sin.” [Calvinism Pure &amp; Mixed, p. 99.] It is ineffectual unto salvation because it leaves the heart unchanged. d. Special grace works in a spiritual and re-creative way, renewing the whole nature of man, and thus making man able and willing to accept the offer of salvation in Jesus Christ, and to produce spiritual fruits. Common grace, to the contrary, operates only in a rational and moral way by making man in a general way receptive for the truth, by presenting motives to the will, and by appealing to the natural desires of man. This is equivalent to saying that special (saving) grace is immediate and supernatural, since it is wrought directly in the soul by the immediate energy of the Holy Spirit, while common grace is mediate, since it is the product of the mediate operation of the Holy Spirit through the truth of general or special revelation and by moral persuasion.</p></blockquote>

<blockquote><p>willed and intended the obedience and salvation of the angels who apostatised, inasmuch as he furnished them with gifts, fit in themselves and suitable, to perform obedience and obtain salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On John Davenant &amp; Aquinas | Michael Lynch, John Davenant’s Hypothetical Universalism: a Defense of Catholic &amp; Reformed Orthodoxy (Oxford Univ. Press, 2021) | This granting of various gifts and graces to creatures is understood by Davenant with Aquinas’s doctrine of God’s providence in view. Davenant illustrates this order of providence by observing from the natural world that God has provided for us many bodily remedies that are applicable to heal us, though not infallibly ordained to heal us. In the realm of theology, Davenant explains God’s providential will in furnishing the angels, both elect and nonelect, with many gifts ordained by God to the end of the angels’ felicity, even though not every angel obtained such felicity. According to this will, God may be said to have, pp. 152-53</span></figcaption>

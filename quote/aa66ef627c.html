<main class="wrap"><figure class="quote" id="q-aa66ef627c" data-kw="">
<blockquote><p>I shall maintain the Affirmative, that they may, nay ought to do it. To avoid mistakes and state the question aright; I shall first of all lay down these conclusions as indubitable.

1. That there are such sins as Idolatry, Apostacy, Heresy, damnable Errors, obstinate Schisms and Blasphemies in Christian Kingdoms, States, Churches, and persons guilty of them.

2. That those who are guilty of them, are, or may be certainly known, discovered to and by Christian Princes and Magistrates.

3. That these sins draw down God’s Judgments, not only on the persons who are guilty of them, but likewise on the Christian Rulers, States, and places which permit, tolerate, or not severely punish and suppress them.

4. That it is the duty of Christian Princes, States, Magistrates, to use all possible diligence and lawful means to keep their Kingdoms, States, People, from being infected with all, or any of these dangerous wrath-provoking sins, yea, a grand sin and neglect in them, not to do it.

Secondly, I shall propound and agree what is not in controversy, as.

1. That the preaching of the Word, Christian Exhortations, Reprehensions, Conferences, and Disputes, are the most proper and effectual means to convert, reform Idolaters, Apostates, Heretics, False Teachers, Schismatics, and Blasphemers.

2. That such as these are first of all to be gently admonished, instructed, confuted, and if possible, reformed by the Word, or other spiritual and gentle means, before the civil Magistrate proceed to corporal or capital punishments.

3. That the present question is only of Idolaters, Apostates, Heretics, False Teachers, obstinate Schismatics, and Blasphemers, not mere tender consciences in matters of Church Discipline and the like; neither yet are all these always to be proceeded against with the self-same rigour and severity; but as their obstinacy, Idolatries, Apostacies, Heresies, Errors, Schisms, Blasphemies, are more or less heinous and pernicious, so the proceedings against them ought to be more mild or severe.</p></blockquote>

<blockquote><p>Magistrates are likewise bound to suppress all idolatry and false worship within the limits of their jurisdiction. Idolatry being a superstitious worship given to an improper object, is expressly forbidden in the law of God. “Thou shalt have no other gods before me.” “Thou shalt not make unto thee any graven image, or any likeness of any thing that is in heaven above, or that is in the earth beneath, or that is in the water under the earth: Thou shalt not bow down thyself to them, nor serve them.” (Exod. xx. 3, 4, 5.)

In conformity with the spirit of these prohibitions, a witch, of old, was not to be suffered to live; because, pretending to supernatural power, she attempted to withdraw men’s dependence from God, the Creator and Possessor of heaven and earth, who worketh all things according to the counsel of his own will.

As the sin of idolatry is hurtful to the souls of men, it must also be ruinous to the kingdoms and states. If Christians be solemnly warned to “flee from idolatry,” (1 Cor. x. 14,) it must then be the duty of the civil magistrate to remove the temptation, as did reforming kings in the ancient dispensation. “And he (Hezekiah) did that which was right in the sight of the Lord, according to all that David his father did. He removed the high places, and brake the images, and cut down the groves, and brake in pieces the brazen serpent that Moses had made; for unto these days, the children of Israel did burn incense to it; and he called it Nehustan,” (a piece of brass, so named by was of derision.) (2 Kings xviii. 4.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/the-belfast-covenanter.html">The Belfast Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Dissertation on Romans xiii. 1-6. ( Continued from page</cite></span></figcaption>

<blockquote><p>The Free Church of Scotland minister, Dr Thomas Guthrie, said the following about Northern and British guilt in Southern slavery:

Abuse the South as men may, I say that in some respects the North is the guiltier of the two. They know the truth, they had the truth, they were free, and they ought to have more sympathy with the cause of freedom than men bred up in the South with slavery; and, for my part, I sometimes think there are six of the one and half-a-dozen of the other. I don’t say that our own country is without blame in the matter, and I should not be surprised that we suffer some share of the judgment. Our merchants and manufacturers were long guilty of neglecting to raise cotton in our own colonies, and thereby to cut the foundation out below slavery. But just look at New York – look at its merchants. It is a notorious fact that the merchants of New York, by the reverence which they pay to the dollar, have been the mainstay of slavery in the South. It is New York dollars that have built every slave ship, and it is by New York merchants that every ship is owned that carries on that infamous traffic. And look to the pulpits of the North – look to their preachers and their ministers. They have employed their pens and prostituted their pulpits in defending this atrocious system.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-guthrie.html">Thomas Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Banner of Ulster</cite>, 14 May 1861.</span></figcaption>

<blockquote><p>The meanest and poorest of her members must not be overlooked; and no child should be suffered to grow up untaught, either in relation to Divine things, or to the acquirements which are requisite to fit him for the business of human life. […] Expense should be cheerfully borne rather than that one child should be allowed to grow up uneducated.</p></blockquote>

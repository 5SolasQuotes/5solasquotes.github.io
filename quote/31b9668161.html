<main class="wrap"><figure class="quote" id="q-31b9668161" data-kw="">
<blockquote><p>Customs laudable are grounded upon decency and reason, and so moral, or grounded upon no reason at all. But Christ did nothing in God’s worship, nor did He any human moral actions for the mere fact and will of others going before, for these were not reasonable human actions; and if it [sitting at the First Lord’s Supper] be customable only, it is not lawful to put away a customable action out of worship, and to put a moral action of kneeling and divine signification in the place thereof, for so we might change places, times, persons and all physical circumstances, and make them supernatural.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646)</cite>, Ch. 2, Question 1, pp. 192-3</span></figcaption>

<blockquote><p>Such expressions of pious and devout affections as to some may seem indecent and imprudent ought not to be hastily censured and condemned, much less ridiculed, because, if they come from an upright heart, God will accept the strength of the affection and excuse the weakness of the expressions of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalm 47, verse 1</cite></span></figcaption>

</figure><figure class="quote" id="q-e11ed65781" data-kw="">
<blockquote><p>Though a penitentiary kneel to God purposely in the presence and sight of the congregation, that he may make known to them his repentance for the sin whereby he has scandalized them, yet is the confessing of his sin to God kneeling there upon his knees, an immediate worship, neither does the congregation come betwixt him and God as belonging to the substance of this worship, for he kneels to God as well and makes confession of his sin when the congregation is not before him. But I suppose our kneelers themselves will confess that the elements come so betwixt God and them when they kneel that they belong to the essence of the worship in hand, and that they would not, nor could not worship the flesh and blood of Christ in the sacrament if the elements were not before them. To be short, the case of a penitentiary stands thus, that not in his kneeling simpliciter, but in his kneeling publicly and in sight of the congregation, he sets them before him, purposely and with a respect to them: Whereas our kneelers do kneel in such sort that their kneeling simpliciter, and without an adjection or adjunct, has a respect to the elements purposely set before them, neither would they at all kneel, for that end and purpose for which they do kneel, namely, for worshipping the flesh and blood of Christ in the sacrament, except the elements were before the eyes both of their minds and bodies; as the penitentiary does kneel, for making confession of his sin to God, when the congregation is not before him. … For the very kneeling itself (simply considered) before the elements, respects them as then purposely set in our sight, that we may kneel before them: whereas in the case of the penitentiary, it is not his kneeling to confess his sin to God, which has a respect to the congregation as set in his sight for that purpose; But some circumstances of his kneeling only, to wit, When? At that time when the congregation is assembled; and where? Publicly in sight of the congregation. In regard of these circumstances, he has the congregation purposely in his sight, and so respects them; But in regard of the kneeling itself simply, the presence of the congregation is but accidental to him who kneels, and confesses his sin before God. As touching giving thanks before the meat set on our common tables, though a man should do it kneeling, yet this speaks not home to the point now in controversy, except a man so kneel before his meat, that he have a religious respect to it, as a thing separated from a common use and made holy, and likewise have both his mind and his external senses of seeing, touching, and tasting fastened upon it in the act of his kneeling. And if a man should thus kneel before his meat, he were an idolater. Lastly, giving thanks before the elements of bread and wine in the beginning of the holy action, is as far from the purpose: For this giving of thanks is an immediate worship of God wherein we have our minds and senses not upon the bread &amp; wine, as upon things which have a state in that worship of the Lord’s Supper, and belong to the substance of the same (for the very consecration of them to this use, is but then in fieri), but we worship God immediately by prayer and giving of thanks: Which is all otherwise in the act of receiving [the bread and wine].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637) | pt. 3, ch. 4</cite>, pp. 70-71</span></figcaption>

</figure><figure class="quote" id="q-1e3e039a49" data-kw="">
<blockquote><p>You [the episcopalian adversary] fall next to censure ‘the posture of sitting in time of public prayer, as very irreverent.’ Sir, not to detain you, I am not far from your opinion: For my own part, and I have many of our way assenting, I dislike sitting in prayer (if infirmity and other great inconveniences do not hinder it)… so I cannot but disagree from you in your overprizing and exacting the postures that you plead for: for though I am convinced that there is an indecency, and other inconveniences in sitting, for which I wish that wherever it may be, it were wholly disused, yet I am far from offending at, let be imposing upon these who of no intended irreverence, but for the most part from a just disgust of the too great weight has been laid upon such circumstances, do innocently practice it… So there are also upon record, such clear instances of an undetermined liberty in these matters, apparent enough in our Lord, his disciples and company, their ordinary sitting down to meat, and blessing and giving thanks in that posture, that I cannot but strange at your bringing any of these practices under an obligation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 70-71 of ‘The Second Dialogue’ in The True Non-Conformist (1671)</cite></span></figcaption>

<blockquote><p>…that which Dr. Jackson answers the Papists about this fashion (Origin of Unbelief, sect. 4, ch. 35): ‘We use the book only as a complement of the civil act, whereby we give satisfaction unto men, or as a visible resemblancer, partly to bystanders or spectators, whose eyes by this means may become as true witnesses as their ears that such protestations have been made, partly unto him that makes them, who will be more wary and circumspect what he avouches and protests, when he perceives his speeches must be sealed with such remarkeable circumstances as they cannot be often recalled to his own and other’s memory. To the same end men of honourable place and calling use to lay their hands upon their hearts when they take a solemn oath.&#x27;</p></blockquote>

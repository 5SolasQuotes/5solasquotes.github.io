<main class="wrap"><figure class="quote" id="q-f42ee4c27d" data-kw="extra calvinisticum circumscription">
<blockquote><p>For the more easily to evade the argument drawn from the ascension of Christ to prove the circumscription of Christ’s body, they deny that Christ truly and properly ascended; but only figuratively, inasmuch as he withdrew his visible presence from the world (although he still remains in the world invisibly). And the heaven into which he ascended (they maintain) is not the highest or third heaven (called the heaven of the blessed), but the heaven of the beatitude and kingdom of God (which is everywhere). We affirm that Christ ascended properly by a local movement from the lower places to the supreme heaven of the blessed; and deny the metaphorical disappearance against the Lutherans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.18.1</span></figcaption>

</figure><figure class="quote" id="q-d294b22804" data-kw="against genus maiestaticum">
<blockquote><p>Were certain properties of the divine nature formally communicated to the human nature of Christ by the personal union? We deny against the Lutherans. The effects of the hypostatical union with respect to the human nature are: the grace of eminence and habitual graces. To the former are commonly ascribed both the grace of eminence (which is the dignity of human nature above all creatures, arising from the union of the same with the divine nature, by which flesh is a property of the Son of God—which can be said of no other creature) and habitual graces (to wit, those remarkable gifts with which the human nature was adorned).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.8.1</span></figcaption>

</figure><figure class="quote" id="q-5b880359da" data-kw="hypostatic union">
<blockquote><p>In the Christian religion there are two questions above all others which are difficult. The first concerns the unity of the three persons in the one essence in the Trinity; the other concerns the union of the two natures in the one person in the incarnation. As in the Trinity the unity of essence does not hinder the persons from being distinct, so the union of natures in the person of Christ does not prevent both the natures and their properties from remaining unconfounded and distinct.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.6.1</span></figcaption>

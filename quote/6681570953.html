<main class="wrap"><figure class="quote" id="q-6681570953" data-kw="">
<blockquote><p>Some more zealous than knowing and considerate did aggravate the acceptance of the indulgence to a great height, and ground of separation, and so wrought their enemies’ work for them better than they could do it for themselves: And so that division proved fatal at Bothwell, where they had a fair game, and opportunity to have defeated all their enemies, and brought prelacy down to the dust. It is observable there was this difference in the two appearances: Pentland had love, harmony and sympathy, wanting nothing but men and arms; Bothwell had both, and wanted harmony, but plagued with division.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-567ceb6c81" data-kw="">
<blockquote><p>Employing the vivid imagery that was the hallmark of Spurgeon’s preaching, he wrote, ‘The house is being robbed, its very walls are being digged down, but the good people who are in bed are too fond of the warmth, and too much afraid of getting broken heads, to go downstairs and meet the burglars; they are even half vexed that a certain noisy fellow will spring his rattle, or cry, ‘Thieves!”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/macarthur-jr-john.html">MacArthur, Jr., John</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Spurgeon &amp; the Downgrade Controversy’ from Ashamed of the Gospel (Wheaton: Crossway, 1992)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-debfb648a2" data-kw="">
<blockquote><p>…no doubt it was this party headed by Mr. Hamilton, who, as they violently pushed forward the country people to a rising, so by their indiscretion and want of conduct, evidently ruined the west country army, and effectually hindered the fair prospect there once was, that they might have been a mean of delivering the church and nation from the burdens they were under; and the upshot of all was, divisions came in, joint measures were not taken. A great many left them when they saw whither matters were going, and far more never joined them; and such as continued together could never do any thing of consequence: and when they came to be attacked, the high-flyers withdrew first, and left the poor country men to the mercy of the king’s army.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3</cite>, p. 65</span></figcaption>

</figure><figure class="quote" id="q-02f4d49452" data-kw="">
<blockquote><p>[1.] In order to engage us to this charity, which would issue in an unity of measures, let us consider what melancholy consequences may ensue upon our divisions, if they be not happily removed. ‘Tis notour, they have been fatal to all societies, have tumbled down flourishing monarchies, and laid magnificent cities into ashes; they have rent Churches into pieces, and knocked religion on the head. 2. The enemies of our Zion, whose projects have been baffled of Heaven, and their counsels infatuated of God, will have this piece of satisfaction left them, to rejoice when they see us disagree among ourselves, and be pleased with the agreeable thoughts that we are about to accomplish ourselves what they designed for us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

<blockquote><p>because they had not freedom to retract their Protestation, and profess their sorrow for it, two sinful terms of ministerial communion have been imposed: 1. That no minister of this Church should testify from the pulpit against acts of Assembly, and proceedings of Church judicatories, even though they were such as had a direct tendency to undermine our constitution. 2. That no minister or member of this Church should protest, for their own exoneration, against acts, sentences, or decisions of the supreme judicatory, even though they should nearly affect the public cause of God and restrain ministerial freedom and faithfulness in testifying against the sins and defections of a backsliding Church.</p></blockquote>

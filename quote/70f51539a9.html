<blockquote><p>Mercy attends upon the grace of God. For as the latter exercises itself about man as a sinner (granting the pardon of his sin) so the former is exercised about man as miserable (relieving his misery).</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-62cf1b0924" data-kw="">
<blockquote><p>amor Dei, ‘the love of God’ … “Considered as a divine attribute, the amor Dei can be defined as the propensity of the divine essence or nature for the good, both in the sense of God’s inward, intrinsic, benevolentia, or willing of the good, and in the sense of God’s external, extrinsic, beneficentia, or kindness, toward his creatures. … Externally or extrinsically, the amor Dei is directed toward all things, but according to a threefold distinction. [1] The amor Dei universalis encompasses all things and is manifest in the creation itself, in the conservation and governance of the world; [2] the amor Dei communis is directed toward all human beings, both elect and reprobate, and is manifest in the blessings, or benefits (beneficia), of God; [3] and the amor Dei proprius, or specialis, is directed toward the elect or believers only and is manifest in the gift of salvation. The amor Dei universalis is frequently called by the scholastics complacentia, or general good-pleasure; the amor Dei communis is understood to be benevolentia in the strict sense of goodwill toward human beings; and amor Dei specialis, is termed amicitia, i.e. friendship or sympathy toward believers. In the discussion of the divine attributes, the amor Dei is considered both as an ultimate essential characteristic of God determinative of the other attributes and as one of the affections of the divine will. In the former sense, resting on the scriptural predication, “God is Love” (1 John 4:8), the scholastics can subsume the grace (gratia), mercy (misericordia), long-suffering (long animitas), patience (patientia), and clemency or mildness (clementia) of God under the amor Dei. In the latter sense, the amor Dei together with these related attributes is viewed as an aspect of the divine willing and is juxtaposed with the wrath (ira) and hate (odium) of God against sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms</cite>, (1985), p. 31-32</span></figcaption>

<blockquote><p>The second sort of divines (Contra-Remonstrants) [that is, those against the Arminians] distinguish the sufficiency and efficiency of Christ’s death. In respect of the worth and greatness of the price, He died for all men: because it was sufficient for the redemption of every man in the world if they did repent and believe; and God might, without impeachment of justice, have offered salvation to every man in the world had it been his pleasure. In the efficiency, as every man or any man has fruit by the death of Christ, so Christ died for him. But this is not of one kind: some fruit is common to every man; for as Christ is lord of all things in heaven and earth, even the earthly blessings which infidels enjoy may be termed fruits of Christ’s death. Others proper to the members of the visible Church, and common to them, as to be called by the word, enjoy the ordinances of grace, live under the covenant, partake of some graces that come from Christ, which, through their fault, be not saving; and in this sense Christ died for all that be under the covenant. But other fruits of Christ’s death, according to the will of God and intention of Christ as Mediator, be peculiar to the sheep of Christ, his brethren, them that be given unto him of the Father, as faith unfeigned, regeneration, pardon of sin, adoption, etc.; and so they hold Christ died efficiently for his people only, in this sense,–namely, so as to bring them effectually to faith, grace, and glory.</p></blockquote>

<blockquote><p>Secondly, It is not denied by the advocates of particular redemption, or of a limited atonement, that mankind in general, even those who ultimately perish, do derive some advantages or benefits from Christ’s death; and no position they hold requires them to deny this. They believe that important benefits have accrued to the whole human race from the death of Christ, and that in these benefits those who are finally impenitent and unbelieving partake… Many blessings flow to mankind at large from the death of Christ, collaterally and incidentally, in consequence of the relation in which men, viewed collectively, stand to each other. All these benefits were of course forseen by God, when He resolved to send His Son into the world; they were contemplated or designed by Him, as what men should receive and enjoy. They are to be regarded and received as bestowed by Him, and as thus unfolding His glory, indicating His character, and actually accomplishing His purposes; and they are to be viewed as coming to men through the channel of Christ’s mediation, of His sufferings and death. [There is a footnote to Witsius, Economy of the Covenants, Book 2, Ch. 9, Section 4] The truth of this position has been considered as affording some warrant for saying, in a vague and indefinite sense, that Christ died for all men; and in this sense, and on this account, some Calvinists have scrupled about meeting the position that Christ died for all men with a direct negative, as if they might thus be understood as denying that there was any sense in which all men derived benefit, and in which God intended that they should derive benefit from Christ’s death… The advocates of universal atonement, then, have no right to charge us with teaching that none derive any benefit from Christ’s death except those who are pardoned and saved; we do not teach this, and we are not bound in consistency to teach it. We teach the opposite of this; and we are not deterred from doing so by the fear lest we should thereby afford to those who are opposed to us…</p></blockquote>

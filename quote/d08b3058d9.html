<main class="wrap"><figure class="quote" id="q-d08b3058d9" data-kw="">
<blockquote><p>Our Lord Jesus is the actual and eventual Saviour of the elect only, in whose room and stead only he died upon the cross, according to the eternal compact passed between him and the Father, in the covenant of grace, otherwise called the covenant of redemption; for these are not two, but one and the same covenant. Thus the apostle calls him “the Saviour of the body,” Eph. v. 23. that is, of the elect, who make up the body whereof he was appointed the head from eternity, and in whose name he contracted with the Father in the eternal covenant.

And he is their Saviour eventually, as actually saving them, Matth. i. 21. “And she shall bring forth a son, and thou shalt call his name Jesus; for he shall save his people from their sins.” None but these will ever truly employ him as a Saviour, or put their case in his hand: and there are none of them but will certainly employ him sooner or later, Acts xiii. 48. “As many as were ordained to eternal life, believed.” John vi. 37. “All that the Father giveth me, shall come to me; and him that cometh to me, I will in no wise cast out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Saviour of the World. A Sermon Preached Immediately before the Celebration of the Lord’s Supper, at Ettrick, June 7, 1724</cite>, in The Complete Works of the Late Rev. Thomas Boston, Ettrick, ed. Samuel McMillan (12 vols, London, 1853), 6: 297.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>affectio: affection; viz. passion or desire, a disposition toward someone or something; synonymous with passio and affectus. Specifically, the affectio animi, or affection of soul, that is the faculty of desire. [While the above is speaking of affections in general, that is for living creatures, and God does not have passions, yet note the Reformed Orthodox teaching that affections are attributed to God improperly: ‘On the Affections of God’.] affectus voluntatis Dei: affections of the will of God; viz., those divine attributes which, according to the strict faculty psychology held by the Protestant scholastics, appear as dispositions or conditions of the divine will; i.e., amor or love, benevolentia or goodness of will, clementia or clemency, gratia or grace, ira or wrath, longanimitas or longsuffering, misericordia or mercy, odium or hate, and patientia or patience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms</cite>, ed. (Baker, 1985), p. 29</span></figcaption>

</figure><figure class="quote" id="q-b2bd544491" data-kw="">
<blockquote><p>…just as in human beings, the term ‘virtues’ is reserved for ‘excellent and confirmed habits’ or dispositions that conduce to the proper use of the faculties, so also in God is the word ‘virtues’ applied to the workings of the divine essence, with specific reference to the disposition and use of the ‘faculties’ of intellect and will. This approach is analogical, given that the divine virtues are not separable from the divine essence as human virtues are separable from humanity. In short, the virtues of God are the divine moral perfections, specifically the goodness and righteousness of the divine willing. These virtues are also the source of all finite or creaturely goodness and righteousness. (Leigh, Treatise, II.x (pp. 78-79).)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, p. 560</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>Tota ratio Schismatis, the very essence of a schism consists in the separating from the Church, I say, from the true and orthodoxal Church. It is a renting or dissolving of that unity which ought to be amongst Christians; See Mr. [Stephen] Marshall’s Sermon on Rom. 12:4-5. It was a memorable speech of Calvin, who said he would willingly travel all over the seas and countries in the world to put an end to the differences that were in the Reformed Churches. [John] Cameron well distinguishes of a double schism: 1. Negative, which is a bare secession or subduction, and is unlawful. Non separatio sed causa facit Schismaticum [Not the separation but the cause that makes the schismatic]. Cassander. 2. Positive, when there is a certain consociation, which uses ecclesiastical laws, the Word of God and administration of the sacraments separatim [in a separated way], which he calls setting up an altar against an altar; this is called schism Antonomastic [Greek], and [Greek], says he [in] De Ecclesia. Different forms of Churches and Church-government in one state must needs lay a foundation of strife and division therein. It is no wisdom (says Mr. [John] Dury in a letter [about congregationalists]) in a state, to reject an approved way of government, which all the best reformed Churches have received all this while, and acknowledged to be God’s way, and by experience found to be safe, sound; and instead of it to take up another, which it is not yet known what it is, nor was ever tried but in two or at the most three churches, and that for the space of a few years. The slighter the cause of separation, the greater the fault of schism; when men hold the same Faith and orthodox truths, yet separate for lesser matters. The true saints in the 7 Churches of the Revelation were never bid go out of them though they were very corrupt, as they were out of Babylon, Mr. [Richard] Vines. The first separatist in the Scripture (says one) was Cain, Gen. 4:16. Enforcements to love are clear, 1 Cor. 13:1. That question of Separation in Scripture is dark. See Mr. [George] Gillespie, Miscellaneous Questions, ch. 10 and 15, and Mr. [Thomas] Manton on James 3. 17. Schisma est secessio in religionis negotio vel temeraria vel injusta, Cameron, De Ecclesia. Schism is a causeless separation from external communion with any true Church of Christ: Mr. [John] Ball, Against Separation, ch. 8. Schism is a breach of the unity of the Church. Dr. Field, bk. 3, Of the Church, ch. 5. We do not leave communion of true Churches for corruptions and sins, but only abstain from the practice of evil in our own persons, and witness against it in others, still holding communion with the Churches of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity... (London: A.M., 1654), bk. 4, ch. 22, ‘Schism’</cite>, pp. 376-77</span></figcaption>

<blockquote><p>Reason 3. Ministers that were studious of the good of the flock did (very many of them) heretofore discern the need of an express consent [by laypesons for church-membership], that they might have more certainty of the extent of their charge than the bounds of a parish can give them. Only they (truly) maintained that our churches were true churches without a more express consent than we then had; and that it tended but to the well-being of a church, and not to the being, that the consent be more express than formerly…</p></blockquote>

<blockquote><p>§5. But we find the ancient Fathers with a holy zeal, charging such as apostates from the Church and breakers of her peace, who held opinions contrary to the essential and fundamental, or any of the great articles of the Christian Faith, so that they placed the unity of the catholic Church in a harmonious consent to these great truths. Irenaeus ([Against Heresies] bk. 1, ch. 3, p. 53, edition Cologne, 1625), having given a short account of the chief articles of the true religion, has these words: hanc igitur praedicationem, et hanc ••dem adepta Ecclesia, quamvis dispersa in universo mundo, diligenter conservat, a• si in una eademque domo habitaret, ac similiter iis fidem habet, ac si unam animam unumque et idem cor haberet; atque un• consensu hoc praedicat, docet ac tradit, ac si uno ore praedita esset. Quamvis enim dissimilia sunt in mundo genera linguarum, una tamen et eadem est vis traditionis; nec quae constitutae sunt in Germania Ecclesiae aliter credunt; nec quae in Hispania, neque in Galliis; neque in Oriente, neque in Aegypto, neque in Lybia, aut in medio Orbis terrarum fundatae sunt, sed quemadmodum Sol Creatura Dei unus et idem est in universo Mundo; ita &amp; praedicatio veritatis ubiquae lucet, &amp; illuminat eos qui ad notionem veritatis venire volunt. Eusebius (Ecclesiastical History, bk. 4, ch. 27) cites Irenaeus condemning Tatianus, the author of the sect of the Encratitae, and saying of him, [Greek], he reckoned his opinions a falling from the Church, or a breaking her unity. The same Historian, bk. 4, ch. 24, gives account of Egesippus narrating, how long the Church remained a virgin, teaching and believing nothing but the Law and the prophets, and what the Lord Himself taught, and he mentions particularly the Churches of Corinth, Rome and Jerusalem; and then shows how heresies arose, whose authors he calls false Christs, false prophets and false apostles, and of them he says, [Greek],they divided the unity of the Church by their corrupt doctrines against God, and against his Christ. Several other citations might be brought to this purpose, but these may be sufficient. I do not question but that there might be other things which might be called schism, even with respect to the universal Church, as if any should bring in idolatrous, or superstitious worship, contrary to the rules of the Gospel, or should violate any of the necessary and laudable canons of General Councils, and should set up societies in opposition, not only to one or few, but to all the societies of Christians, or all the soundest of them… §6. There is another sort of unity much regarded among the ancients, which though the breach of it had as bad influence on all, or most Churches, and so on the catholic Church: yet it properly respected neighbor Churches, either which were united by the bond of one government, a provincial, or lesser synod, being made up of them: or only living in the vicinity of one another, or having frequent occasion of correspondence; they who were not under any uniting bonds, but these commune to all the parts of the catholic Church, yet had an unity of kind correspondence, mutual assistance, as occasion offered, acquainting one another with their affairs so far as it was of any advantage: admitting the members of other Churches to communion with them on occasion, refusing communion with such members of other Churches as were by them excommunicated: and this unity was then broken when these acts of friendship were shunned or refused, especially when they who were cast out by one were received to another: or when occasional communion was either shuned by them who so joined in another Church or denied to such sojourners if they desired it: or when one Church showed rage, fury and bitterness against another because of what they differed about.</p></blockquote>

<blockquote><p>The author [Baxter] thought it not unfit here to annex the description of that order and discipline which is exercised by him, with his assistant fellow-pastors, in the parish-church of Kidderminster, in Association with many pastors of those parts who have agreed to exercise so much of the ministerial office as by the consent of the episcopal, presbyterian and congregational [parties] belongs to them. Which, being published: 1. May prevent men’s injurious misreports of our associations and discipline, which they may be drawn to by fallacious fame. 2. And may be an example for those churches that by the magistrates are left at liberty to worship God in that communion and order which they judge most agreeable to the Word of God and the universal consent and practice of the primitive Church. . I. We are willing to teach all in our parish, the doctrine of life, that are willing to learn: and desire them all to hear the Word publicly preached and to come to us to be catechized or instructed. II. We own all those as visible Christians and members of the universal Church that make a credible profession of Christianity and destroy it not by heresy or ungodly lives. III. So many of these as also consent to hold communion with this church as members of it, submitting to the ministers and discipline of Christ, we shall esteem our flock and special charge, and faithfully perform the duties of our office for their good, as we are able. IV. We desire that all the youth of the parish will learn the principles of the Christian religion: and as soon as they understand it, and are heartily resolved to give up themselves to God in Christ through the Spirit, and to lead a holy life, that they will come and acquaint us with their faith and resolution; and before the Church will make a solemn profession thereof, and give up themselves to God in the personal owning their baptismal Covenant; either reciting the foregoing creed or Profession, or, if they are unfit for public speaking, by consenting when we propound it to them, or by any other fit expressions. That so we may publicly pray for their confirmation; and if they consent also to hold communion with this church, we may know them as our charge and register their names. V. Those parishioners that desire us to baptize their children, or to be themselves admitted to the Lord’s Supper, and are not members of this church (because they will not), we desire to come to us, some days before that so we may be satisfied of their faith and life: And if they seem true Christians, and either bring a certificate that they are members of any other church, with (which we are to hold Communion, or show that it is not from ungodliness that they refuse to live under order and discipline, we shall baptize their children, and occasionally admit them to our communion. But if they are scandalous, we shall require them first to profess their serious repentance: And if they return to scandal, we shall after stay till we see their reformation (or of one of the parents in case of baptism). VI. If any member of this Church do differ from us about the gesture in the Lord’s Supper (or any such circumstance) we desire them first to come to us and hear our reasons: and if we cannot satisfy them, we will not hinder them from receiving it in any decent gesture they desire. VII. All members of the church must ordinarily hold communion with it in the Lord’s Supper and all ordinances: and if a brother grossly offend, they must orderly and prudently admonish him; and if he hear them not, tell the church [Mt. 18]. VIII. Once a month we have a meeting of the magistrates, ministers, deacons and above twenty persons chosen annually by the church, as their trustees or deputies: Here the offenders must be accused, and heard, and dealt with before the case be opened in the church. And any that are justly offended with any member, may have church-justice: the magistrates’ presence being only ad melius esse [to the better well-being] and the chosen trustees or deputies being no ecclesiastical officers, nor pretending to divine institution as such: but only the fittest of the people chosen to do those things which belong to the people (who cannot all so frequently meet) and having no authoritative ruling votes. IX. Those that repent not upon public admonition must be cast out of our communion and avoided as heathens: But those that are penitent, must be absolved, and lovingly received. X. If any of our people be offended at anything in our doctrine or life, we desire them before they vent their offense behind our backs, to come and lovingly tell it us, and hear us speak. And if we do not satisfy them, we desire them to open the matter before the ministers of this Association, who are here assembled every month. And we shall before them be responsible for our doctrine, our administrations and our lives. (As we are also willing to be to the magistrate, who only has the power of the sword, even over the pastors of the church, and whom in all things lawful we must obey, and not resist.)</p></blockquote>

+ministers+and+discipline+of+Christ%2C+we+shall+esteem+our+flock+and+special+charge%2C+and+faithfully+perform+the+duties+of+our+office+for+their+good%2C+as+we+are+able.+IV.+We+desire+that+all+the+youth+of+the+parish+will+learn+the+principles+of+the+Christian+religion%3A+and+as+soon+as+they+understand+it%2C+and+are+heartily+resolved+to+give+up+themselves+to+God+in+Christ+through+the+Spirit%2C+and+to+lead+a+holy+life%2C+that+they+will+come+and+acquaint+us+with+their+faith+and+resolution%3B+and+before+the+Church+will+make+a+solemn+profession+thereof%2C+and+give+up+themselves+to+God+in+the+personal+owning+their+baptismal+Covenant%3B+either+reciting+the+foregoing+creed+or+Profession%2C+or%2C+if+they+are+unfit+for+public+speaking%2C+by+consenting+when+we+propound+it+to+them%2C+or+by+any+other+fit+expressions.+That+so+we+may+publicly+pray+for+their+confirmation%3B+and+if+they+consent+also+to+hold+communion+with+this+church%2C+we+may+know+them+as+our+charge+and+register+their+names.+V.+Those+parishioners+that+desire+us+to+baptize+their+children%2C+or+to+be+themselves+admitted+to+the+Lord%E2%80%99s+Supper%2C+and+are+not+members+of+this+church+%28because+they+will+not%29%2C+we+desire+to+come+to+us%2C+some+days+before+that+so+we+may+be+satisfied+of+their+faith+and+life%3A+And+if+they+seem+true+Christians%2C+and+either+bring+a+certificate+that+they+are+members+of+any+other+church%2C+with+%28which+we+are+to+hold+Communion%2C+or+show+that+it+is+not+from+ungodliness+that+they+refuse+to+live+under+order+and+discipline%2C+we+shall+baptize+their+children%2C+and+occasionally+admit+them+to+our+communion.+But+if+they+are+scandalous%2C+we+shall+require+them+first+to+profess+their+serious+repentance%3A+And+if+they+return+to+scandal%2C+we+shall+after+stay+till+we+see+their+reformation+%28or+of+one+of+the+parents+in+case+of+baptism%29.+VI.+If+any+member+of+this+Church+do+differ+from+us+about+the+gesture+in+the+Lord%E2%80%99s+Supper+%28or+any+such+circumstance%29+we+desire+them+first+to+come+to+us+and+hear+our+reasons%3A+and+if+we+cannot+satisfy+them%2C+we+will+not+hinder+them+from+receiving+it+in+any+decent+gesture+they+desire.+VII.+All+members+of+the+church+must+ordinarily+hold+communion+with+it+in+the+Lord%E2%80%99s+Supper+and+all+ordinances%3A+and+if+a+brother+grossly+offend%2C+they+must+orderly+and+prudently+admonish+him%3B+and+if+he+hear+them+not%2C+tell+the+church+%5BMt.+18%5D.+VIII.+Once+a+month+we+have+a+meeting+of+the+magistrates%2C+ministers%2C+deacons+and+above+twenty+persons+chosen+annually+by+the+church%2C+as+their+trustees+or+deputies%3A+Here+the+offenders+must+be+accused%2C+and+heard%2C+and+dealt+with+before+the+case+be+opened+in+the+church.+And+any+that+are+justly+offended+with+any+member%2C+may+have+church-justice%3A+the+magistrates%E2%80%99+presence+being+only+ad+melius+esse+%5Bto+the+better+well-being%5D+and+the+chosen+trustees+or+deputies+being+no+ecclesiastical+officers%2C+nor+pretending+to+divine+institution+as+such%3A+but+only+the+fittest+of+the+people+chosen+to+do+those+things+which+belong+to+the+people+%28who+cannot+all+so+frequently+meet%29+and+having+no+authoritative+ruling+votes.+IX.+Those+that+repent+not+upon+public+admonition+must+be+cast+out+of+our+communion+and+avoided+as+heathens%3A+But+those+that+are+penitent%2C+must+be+absolved%2C+and+lovingly+received.+X.+If+any+of+our+people+be+offended+at+anything+in+our+doctrine+or+life%2C+we+desire+them+before+they+vent+their+offense+behind+our+backs%2C+to+come+and+lovingly+tell+it+us%2C+and+hear+us+speak.+And+if+we+do+not+satisfy+them%2C+we+desire+them+to+open+the+matter+before+the+ministers+of+this+Association%2C+who+are+here+assembled+every+month.+And+we+shall+before+them+be+responsible+for+our+doctrine%2C+our+administrations+and+our+lives.+%28As+we+are+also+willing+to+be+to+the+magistrate%2C+who+only+has+the+power+of+the+sword%2C+even+over+the+pastors+of+the+church%2C+and+whom+in+all+things+lawful+we+must+obey%2C+and+not+resist.%29%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Christian+Religion+expressed%3A+I.+briefly+in+the+Ancient+Creeds%2C+the+Ten+Commandments+%26+the+Lord%E2%80%99s+Prayer%2C+and%2C+II.+more+largely+in+a+Profession+taken+out+of+the+Holy+Scriptures%2C+containing+1.+the+articles+of+the+Christian+Belief%2C+2.+our+consent+to+the+Gospel+Covenant%2C+3.+the+Sum+of+Christian+Duty+according+to+the+primitive+simplicity%2C+purity%2C+and+practice%2C+fitted+to+the+right+instruction+of+the+ignorant%2C+the+promoting+of+holiness%2C+and+the+charitable+concord+of+all+true+believers%E2%80%A6+%28London%3A+1660%29+%7C+The+Order+%26+Discipline+of+this+Church%2C+agreeable+to+the+Word+of+God&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8ea034e400.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8ea034e400.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=The%20author%20%5BBaxter%5D%20thought%20it%20not,we%20must%20obey%2C%20and%20not%20resist&amp;text=The%20author%20%5BBaxter%5D%20thought%20it%20not%20unfit%20here&amp;text=things%20lawful%20we%20must%20obey%2C%20and%20not%20resist" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

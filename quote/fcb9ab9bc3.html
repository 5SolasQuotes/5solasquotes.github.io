<main class="wrap"><figure class="quote" id="q-fcb9ab9bc3" data-kw="">
<blockquote><p>Other Ceremonialists used to plead for the Church’s ceremony-making power with a little more caution and limitation, so as they are careful to shut the door against the Popish ceremonies: Some [shut the door] because of their ineptitude, the bulk of them, because of their number, being a burden…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), section 12, p. 279 Rule was a Scottish, divine-right presbyterian.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-30fb86e05a" data-kw="">
<blockquote><p>Section 5. Note that things not determined of God [for public worship] and left to the determination of men must be such as are necessary in genere, and not things idle and superfluous. A superior may not institute a superfluous thing that is not simply evil, though sometimes the inferior may lawfully obey therein; or to speak more properly, [the inferior may] lawfully do the thing to avoid inconvenience, or to testify respect to the superior, though in that particular he has no lawful power to command. Note also, that of things necessary in genere, the superior may not lawfully determine for such species, as, though not simply evil, may have a tendency to evil or be evil in the consequence, when he may determine that which will not be evil in the consequence. Yet the inferior may obey, or rather observe the thing commanded, when the evil consequence of non-observance will be greater than the evil consequence of observance. Section 6. If superiors command that which is above their sphere to command [for public worship], namely, things not necessary in genere [by its kind], yet if they be not simply evil, subjects may¹ do those things, unless they be evil in their consequence to a higher degree than the not doing of them would be.² In this case it is not formal obedience,³ but they are done for the end’s sake and to avoid evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of the Reverend &amp; Learned Mr. John Corbet</cite>, Of Divine Worship… in The Remains of the Reverend &amp; Learned Mr. John Corbet… (London: Thomas Parkhurst, 1684), pt. 3 Corbet (d. 1680) was an English, congregationalist puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-72dbfc41ed" data-kw="">
<blockquote><p>…if we understand the words [of the opponent] as a prohibition of that worship and ordinance wherein there is any disorder committed: even so they are not generally true; for though we come with disorder and unpreparedness unto the hearing of the Word and public prayers, yet we are not for this disorder to omit public prayers, and hearing of the Word: for this were the way not to prevent, but to multiply our sin; and yet I do not deny, but that this disorder and unpreparednes is a great sin, for which we ought to be humbled.</p></blockquote>

<blockquote><p>34. Though we must prefer better before worse, that worse may be best to us at that time and place when we cannot have better without more hurt than benefit to the public or ourselves. Among many ministers, weak and strong, all cannot hear the best, nor must renounce the weaker. To live under the countenance of government under an honest¹ minister of mean parts in peace and concord, though he use the liturgy, is more to the common advantage of religion and to the profit of most particular souls than to hear an abler man with the distraction of disturbers² and to be fined and lie in prison on no better a cause.</p></blockquote>

</figure><figure class="quote" id="q-33a1038d43" data-kw="">
<blockquote><p>…as to the preaching of the Word, we grant that the people are not obliged to give blind and implicit obedience to what is delivered by the ministers, as if they ought to receive as the Word of God whatsoever is delivered by them, but that they have power and ought by the judgment of discretion to search the Scriptures whether the things delivered by the ministers be so, to try the spirits whether they be of God or not, to prove all things and hold fast that which is good, Acts 17:11; 1 Jn. 4:1; 1 Thess. 5:18; and the like judgment of discretion we grant to them in relation to other parts of worship.</p></blockquote>

<blockquote><p>This thesis is an examination of the eucharistic doctrine of ten Scottish theological writers in the tradition of Scottish Episcopacy… The argument of this thesis is that all of the writers, rejecting the Tridentine, Lutheran, Bezan-Calvinist, and Zwinglian definitions of the Eucharist, maintained a material sacrifice in the Eucharist, which is an offering to God the Father of bread and wine as the propitiatory memorial of Christ’s death on the Cross, commanded by Christ Himself at the Last Supper. The sacrifice is propitiatory because it is the means of representing the one sacrifice of Christ on the cross to God the Father, thereby pleading the benefits of the cross for the communicants. The bread and wine do not change substance, but become effectively the body and blood of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wallace-d-kornahrens.html">Wallace D. Kornahrens</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eucharistic Doctrine in Scottish Episcopacy</cite>, 1620-1875 Download (2008) PhD thesis 300 pp. | Abstract:</span></figcaption>

<blockquote><p>If all the people may lawfully join themselves with that Church which has the ablest teacher, then almost all the world must go to a few men and leave the rest. Then Barnabas may be forsaken, if Paul be the chief speaker… And God has more means than ministerial abilities to increase men’s graces: He that keeps in God’s order under a meaner [less excellent], honest minister, is like to be a more humble, thriving Christian than he that will break that order under pretense of edification. The Lord knows that I speak against my own visible carnal interests in all this… 10. Christians should not first ask, ‘Where may I have the best minister, or company, or purest Ordinances? or where may I receive most good?’ But they must first ask, ‘Where lies my duty? and where may I do most good?’ For God’s work must be done before our own. And the saving of souls and propagation of the Gospel must be preferred before our comforts. Yea let me tell you my observation: The comfort that Christians have in a suffering, self-denying course of doing good is a surer and more stable comfort than that which is drawn from the special advantages of ordinances. That man that lives among a company of poor ignorant souls, and will set himself night and day resolvedly and unweariedly to teach them, persuade them and win them to Christ, till he have bettered the imperfect church where he is, shall usually be a man of solid settled peace. When he that says, ‘These are carnal, heathens, wicked; This is a weak ministry; I will go join myself to such an excellent minister and Church, and let them alone,’ this man will likely be soon sadded with his new comforts, and weary of his precious ordinances, and be as ready to vilify them and turn to some other till in this disorder he have run himself out of breath, if not out of all appearance of grace.</p></blockquote>

<blockquote><p>…we think that some things are tolerated which should not at all be endured. We are not spending so much time on those linen vestments that we would want the progress of God’s Word to be disturbed because of them–even just a little. Yet we judge that they have acted correctly and wisely who have thrown out of their churches that whole form of dress, which is more suited to actors than to ministers of the Word, as well as other remnants of paganism. For surely they can do a great deal of harm, as experience itself has taught; and they cannot help at all. But we certainly do not count the restoring of what has been thrown out among things that are indifferent [adiaphora].</p></blockquote>

<blockquote><p>I. The law given by Moses is usually distinguished into three species: moral (treating of morals or of perpetual duties towards God and our neighbor); ceremonial (of the ceremonies or rites about the sacred things to be observed under the Old Testament); and civil, constituting the civil government of the Israelite people. The first is the foundation upon which rests the obligation of the others and these are its appendices and determinations. Ceremonial has respect to the first table determining its circumstances, especially as to external worship. Civil has respect to the second table in judicial things, although it lays down punishments for crimes committed against the first table. II. The truth of this distinction appears from the diversity of the names by which it is designated in the Scriptures. The moral law is for the most part expressed by mtsvth (“precepts”), the ceremonial by chqym (“statutes”) and the judicial by mshptym (“judgments”), which the Septuagint renders by entolas, dikaiōmata and krimata. “I will speak unto thee all the commandments, and the statutes, and the judgments, which thou shalt teach them” (Dt. 5:31); so also in 6:1, 20; 7:11; and Lev. 26:46. Sometimes however these words are synonymous and used promiscuously (Ezk. 5:6; 20:11, 16, 18). But the distinction appears principally from the nature of the thing and the office of the law (whose it is to settle the order according to which man is joined to God and his neighbor). Now man is joined to God first by a certainternal and external likeness—in love and justice, holiness and truth, whose rule the moral law delivers. Again by the external signification and testification of those acts of divine worship (marks and symbols being employed) whose use the ceremonial law prescribes. Finally, what duty man owes to man, the civil law (applied more distinctly to the Israelites) explains. The moral law regards the Israelite people as men; the ceremonial as the church of the Old Testament expecting the promised Messiah; the civil regards them as a peculiar people who in the land of Canaan ought to have a republic suiting their genius and disposition. III. Hence arises a manifold difference between the moral law and others both in origin (because the moral is founded upon natural right and on this account is known by nature; but the others upon positive right and on this account are from free revelation) and in duration. The former is immutable and eternal; the latter mutable and temporary. In regard to object, the one is universal embracing all; the others particular applying only to the Jews (the civil, indeed, inasmuch as it regarded them as a distinct state dedicated to God; the ceremonial, however, referring to their ecclesiastical state and state of minority and infancy). In regard to use, the moral is the end of the others, while the others are subservient to the moral. Thus far we have spoken of the moral; now we must discuss the ceremonial. IV. The ceremonial law is the system of God’s positive precepts concerning the external worship in sacred things, prescribed to the ancient church, either for the sake of order or of signification. It is so called from the object about which it is conversant (viz., the sacred ceremonies or rites that were formerly to be observed in the external worship of God). This is so whether the word ceremony is derived from the Etruscan cerus, meaning “holy,” as sanctimonia from sanctus (according to Joseph Scaliger and Dionysius Gothofredus in notis ad Festum+); or from Ceres which (because the Gauls occupied Rome, they preserved the eternal fire and the vestal virgins) was called the sanctuary of the Roman people and the receptacle of the Roman sacred vessels. The Romans, for the sake of renumeration, called their sacred rites caeremoniae from Ceres (according to Valerius Maximus, Factorum et Dictorum Memorabilium 1.1.10 [ed. C. Kemp, 1966], p. 6; cf. Florus, lib. 1, cap. 13+). Or (what is more probable) from the Hebrew chrm which signifies a thing sacred and devoted to God. V. It is marked by various names—now by chqym (as mshptym marks the judicial and mtsvth the moral); then by “the law of commandments in ordinances” (nomon tōn entolōn en dogmasi, Eph. 2:15) because its precepts are ordained (dedogmena) (sanctioned by the will of God) having no goodness except from the divine appointment; then by “carnal commandment” (entolēn sarkikēn, Heb. 7:16) and “carnal ordinances” (dikaiōmata sarkos, Heb. 9:10) because they are occupied with prescribing external and corruptible things (which are called carnal in the Scriptures); then by “weak and beggarly elements” (stoicheia asthenē kai ptōcha tou kosmou, Gal. 4:9) because they were the first rudiments and, as it were, the alphabet of the Jewish church. During her infantile state, she ought to have been instructed in them and able to do nothing by herself either for justification or for salvation.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I. The law given by Moses is usually distinguished into three species: moral (treating of morals or of perpetual duties towards God and our neighbor); ceremonial (of the ceremonies or rites about the sacred things to be observed under the Old Testament); and civil, constituting the civil government of the Israelite people. The first is the foundation upon which rests the obligation of the others and these are its appendices and determinations. Ceremonial has respect to the first table determining its circumstances, especially as to external worship. Civil has respect to the second table in judicial things, although it lays down punishments for crimes committed against the first table. II. The truth of this distinction appears from the diversity of the names by which it is designated in the Scriptures. The moral law is for the most part expressed by mtsvth (“precepts”), the ceremonial by chqym (“statutes”) and the judicial by mshptym (“judgments”), which the Septuagint renders by entolas, dikaiōmata and krimata. “I will speak unto thee all the commandments, and the statutes, and the judgments, which thou shalt teach them” (Dt. 5:31); so also in 6:1, 20; 7:11; and Lev. 26:46. Sometimes however these words are synonymous and used promiscuously (Ezk. 5:6; 20:11, 16, 18). But the distinction appears principally from the nature of the thing and the office of the law (whose it is to settle the order according to which man is joined to God and his neighbor). Now man is joined to God first by a certainternal and external likeness—in love and justice, holiness and truth, whose rule the moral law delivers. Again by the external signification and testification of those acts of divine worship (marks and symbols being employed) whose use the ceremonial law prescribes. Finally, what duty man owes to man, the civil law (applied more distinctly to the Israelites) explains. The moral law regards the Israelite people as men; the ceremonial as the church of the Old Testament expecting the promised Messiah; the civil regards them as a peculiar people who in the land of Canaan ought to have a republic suiting their genius and disposition. III. Hence arises a manifold difference between the moral law and others both in origin (because the moral is founded upon natural right and on this account is known by nature; but the others upon positive right and on this account are from free revelation) and in duration. The former is immutable and eternal; the latter mutable and temporary. In regard to object, the one is universal embracing all; the others particular applying only to the Jews (the civil, indeed, inasmuch as it regarded them as a distinct state dedicated to God; the ceremonial, however, referring to their ecclesiastical state and state of minority and infancy). In regard to use, the moral is the end of the others, while the others are subservient to the moral. Thus far we have spoken of the moral; now we must discuss the ceremonial. IV. The ceremonial law is the system of God’s positive precepts concerning the external worship in sacred things, prescribed to the ancient church, either for the sake of order or of signification. It is so called from the object about which it is conversant (viz., the sacred ceremonies or rites that were formerly to be observed in the external worship of God). This is so whether the word ceremony is derived from the Etruscan cerus, meaning “holy,” as sanctimonia from sanctus (according to Joseph Scaliger and Dionysius Gothofredus in notis ad Festum+); or from Ceres which (because the Gauls occupied Rome, they preserved the eternal fire and the vestal virgins) was called the sanctuary of the Roman people and the receptacle of the Roman sacred vessels. The Romans, for the sake of renumeration, called their sacred rites caeremoniae from Ceres (according to Valerius Maximus, Factorum et Dictorum Memorabilium 1.1.10 [ed. C. Kemp, 1966], p. 6; cf. Florus, lib. 1, cap. 13+). Or (what is more probable) from the Hebrew chrm which signifies a thing sacred and devoted to God. V. It is marked by various names—now by chqym (as mshptym marks the judicial and mtsvth the moral); then by “the law of commandments in ordinances” (nomon tōn entolōn en dogmasi, Eph. 2:15) because its precepts are ordained (dedogmena) (sanctioned by the will of God) having no goodness except from the divine appointment; then by “carnal commandment” (entolēn sarkikēn, Heb. 7:16) and “carnal ordinances” (dikaiōmata sarkos, Heb. 9:10) because they are occupied with prescribing external and corruptible things (which are called carnal in the Scriptures); then by “weak and beggarly elements” (stoicheia asthenē kai ptōcha tou kosmou, Gal. 4:9) because they were the first rudiments and, as it were, the alphabet of the Jewish church. During her infantile state, she ought to have been instructed in them and able to do nothing by herself either for justification or for salvation.”

— Francis Turretin, Institutes of Elenctic Theology, trans. George Musgrave Giger, vol. 2 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 11.24.1–5; pp. 145–147.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+The+law+given+by+Moses+is+usually+distinguished+into+three+species%3A+moral+%28treating+of+morals+or+of+perpetual+duties+towards+God+and+our+neighbor%29%3B+ceremonial+%28of+the+ceremonies+or+rites+about+the+sacred+things+to+be+observed+under+the+Old+Testament%29%3B+and+civil%2C+constituting+the+civil+government+of+the+Israelite+people.+The+first+is+the+foundation+upon+which+rests+the+obligation+of+the+others+and+these+are+its+appendices+and+determinations.+Ceremonial+has+respect+to+the+first+table+determining+its+circumstances%2C+especially+as+to+external+worship.+Civil+has+respect+to+the+second+table+in+judicial+things%2C+although+it+lays+down+punishments+for+crimes+committed+against+the+first+table.+II.+The+truth+of+this+distinction+appears+from+the+diversity+of+the+names+by+which+it+is+designated+in+the+Scriptures.+The+moral+law+is+for+the+most+part+expressed+by+mtsvth+%28%E2%80%9Cprecepts%E2%80%9D%29%2C+the+ceremonial+by+chqym+%28%E2%80%9Cstatutes%E2%80%9D%29+and+the+judicial+by+mshptym+%28%E2%80%9Cjudgments%E2%80%9D%29%2C+which+the+Septuagint+renders+by+entolas%2C+dikai%C5%8Dmata+and+krimata.+%E2%80%9CI+will+speak+unto+thee+all+the+commandments%2C+and+the+statutes%2C+and+the+judgments%2C+which+thou+shalt+teach+them%E2%80%9D+%28Dt.+5%3A31%29%3B+so+also+in+6%3A1%2C+20%3B+7%3A11%3B+and+Lev.+26%3A46.+Sometimes+however+these+words+are+synonymous+and+used+promiscuously+%28Ezk.+5%3A6%3B+20%3A11%2C+16%2C+18%29.+But+the+distinction+appears+principally+from+the+nature+of+the+thing+and+the+office+of+the+law+%28whose+it+is+to+settle+the+order+according+to+which+man+is+joined+to+God+and+his+neighbor%29.+Now+man+is+joined+to+God+first+by+a+certainternal+and+external+likeness%E2%80%94in+love+and+justice%2C+holiness+and+truth%2C+whose+rule+the+moral+law+delivers.+Again+by+the+external+signification+and+testification+of+those+acts+of+divine+worship+%28marks+and+symbols+being+employed%29+whose+use+the+ceremonial+law+prescribes.+Finally%2C+what+duty+man+owes+to+man%2C+the+civil+law+%28applied+more+distinctly+to+the+Israelites%29+explains.+The+moral+law+regards+the+Israelite+people+as+men%3B+the+ceremonial+as+the+church+of+the+Old+Testament+expecting+the+promised+Messiah%3B+the+civil+regards+them+as+a+peculiar+people+who+in+the+land+of+Canaan+ought+to+have+a+republic+suiting+their+genius+and+disposition.+III.+Hence+arises+a+manifold+difference+between+the+moral+law+and+others+both+in+origin+%28because+the+moral+is+founded+upon+natural+right+and+on+this+account+is+known+by+nature%3B+but+the+others+upon+positive+right+and+on+this+account+are+from+free+revelation%29+and+in+duration.+The+former+is+immutable+and+eternal%3B+the+latter+mutable+and+temporary.+In+regard+to+object%2C+the+one+is+universal+embracing+all%3B+the+others+particular+applying+only+to+the+Jews+%28the+civil%2C+indeed%2C+inasmuch+as+it+regarded+them+as+a+distinct+state+dedicated+to+God%3B+the+ceremonial%2C+however%2C+referring+to+their+ecclesiastical+state+and+state+of+minority+and+infancy%29.+In+regard+to+use%2C+the+moral+is+the+end+of+the+others%2C+while+the+others+are+subservient+to+the+moral.+Thus+far+we+have+spoken+of+the+moral%3B+now+we+must+discuss+the+ceremonial.+IV.+The+ceremonial+law+is+the+system+of+God%E2%80%99s+positive+precepts+concerning+the+external+worship+in+sacred+things%2C+prescribed+to+the+ancient+church%2C+either+for+the+sake+of+order+or+of+signification.+It+is+so+called+from+the+object+about+which+it+is+conversant+%28viz.%2C+the+sacred+ceremonies+or+rites+that+were+formerly+to+be+observed+in+the+external+worship+of+God%29.+This+is+so+whether+the+word+ceremony+is+derived+from+the+Etruscan+cerus%2C+meaning+%E2%80%9Choly%2C%E2%80%9D+as+sanctimonia+from+sanctus+%28according+to+Joseph+Scaliger+and+Dionysius+Gothofredus+in+notis+ad+Festum%2B%29%3B+or+from+Ceres+which+%28because+the+Gauls+occupied+Rome%2C+they+preserved+the+eternal+fire+and+the+vestal+virgins%29+was+called+the+sanctuary+of+the+Roman+people+and+the+receptacle+of+the+Roman+sacred+vessels.+The+Romans%2C+for+the+sake+of+renumeration%2C+called+their+sacred+rites+caeremoniae+from+Ceres+%28according+to+Valerius+Maximus%2C+Factorum+et+Dictorum+Memorabilium+1.1.10+%5Bed.+C.+Kemp%2C+1966%5D%2C+p.+6%3B+cf.+Florus%2C+lib.+1%2C+cap.+13%2B%29.+Or+%28what+is+more+probable%29+from+the+Hebrew+chrm+which+signifies+a+thing+sacred+and+devoted+to+God.+V.+It+is+marked+by+various+names%E2%80%94now+by+chqym+%28as+mshptym+marks+the+judicial+and+mtsvth+the+moral%29%3B+then+by+%E2%80%9Cthe+law+of+commandments+in+ordinances%E2%80%9D+%28nomon+t%C5%8Dn+entol%C5%8Dn+en+dogmasi%2C+Eph.+2%3A15%29+because+its+precepts+are+ordained+%28dedogmena%29+%28sanctioned+by+the+will+of+God%29+having+no+goodness+except+from+the+divine+appointment%3B+then+by+%E2%80%9Ccarnal+commandment%E2%80%9D+%28entol%C4%93n+sarkik%C4%93n%2C+Heb.+7%3A16%29+and+%E2%80%9Ccarnal+ordinances%E2%80%9D+%28dikai%C5%8Dmata+sarkos%2C+Heb.+9%3A10%29+because+they+are+occupied+with+prescribing+external+and+corruptible+things+%28which+are+called+carnal+in+the+Scriptures%29%3B+then+by+%E2%80%9Cweak+and+beggarly+elements%E2%80%9D+%28stoicheia+asthen%C4%93+kai+pt%C5%8Dcha+tou+kosmou%2C+Gal.+4%3A9%29+because+they+were+the+first+rudiments+and%2C+as+it+were%2C+the+alphabet+of+the+Jewish+church.+During+her+infantile+state%2C+she+ought+to+have+been+instructed+in+them+and+able+to+do+nothing+by+herself+either+for+justification+or+for+salvation.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+trans.+George+Musgrave+Giger%2C+vol.+2+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%9397%29%2C+11.24.1%E2%80%935%3B+pp.+145%E2%80%93147.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7f5f5aff92.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a cla

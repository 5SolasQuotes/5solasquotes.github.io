</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5e965e2a11" data-kw="">
<blockquote><p>‘Private interpretation,’ [2 Pet. 1] is either Praeter fundamentum veritatis, ‘by the ground of verity,’ or Praeter fundamentum salutis, ‘by the ground of salvation;’ circa fundamentum salutis, ‘about the ground of salvation;’ or contra fundamentum salutis, or ‘contrary to the foundation of salvation’.

1. Praeter fundamentum veritatis, is when an interpretation agrees not with the place intreated, although it be not contra fundamentum salutis: these the Greeks called [Greek] aliena a proposito, out of purpose: as those who seek gold in the earth, if they miss the vein, they lose the gold (Chrysostom): so these who interpret Scripture, besides the meaning of the place intreated, they miss the sense of the Scripture.

2. Praeter fundamentum salutis, is that interpretation which is not only besides the verity, but also besides the foundation, Christ: this by the apostle is called hay and stubble, it shall burn, but the builder may be safe. (1 Cor. 3:15)

3. Circa fundamentum salutis, is that interpretation, which weakens the foundation, although it raze it not directly.

4. Contra fundamentum salutis, is that interpretation, which razes the foundation, ‘not holding the head Christ’. (Col. 2:19) … True interpretation is that interpretation which is super fundamentum, upon the foundation, and gives the true interpretation of the place intreated. The doctors of the Jews were called bonim, aedificantes, ‘builders,’ because they were bound to build upon the foundation. (Mk. 12:10)</p></blockquote>

</figure><figure class="quote" id="q-b28f86b1bc" data-kw="">
<blockquote><p>I, Philip Melanchthon, regard the above [Smalcald] articles [1537] as right and Christian. However, concerning the pope I hold that, if he would allow the Gospel, we, too, may concede to him that superiority over the bishops which he possesses by human right, making this concession for the sake of peace and general unity among the Christians who are not under him and who may be in the future.</p></blockquote>

</figure><figure class="quote" id="q-e10e4d6844" data-kw="">
<blockquote><p>The judicious and great divine Calvin does upon this account exceedingly aggrege the divisions amongst some English in Frankfort [over the Anglican ceremonies], who… did even there contend for matters of little moment. This (says he, Epistle 200) was exceeding intempestive, or untimeous, and exceeding offensive to the Church of Christ, and unbecoming their case: And although he utterly disapproved these ceremonies, as unbecoming the Church of Christ, yet does he (Epistle 206) press moderation on both sides, using these words… ‘As I did exhort these who were not of one mind with you to stretch themselves with all possible moderation, so it did displease me that there was upon the other hand by you nothing ceded or remitted.’</p></blockquote>

</figure><figure class="quote" id="q-b878dca577" data-kw="">
<blockquote><p>8. The Church can fail in respect of its faith or its morals. Regarding morals there is no doubt and regarding faith it is certain. The apostles erred in the doctrine of Christ’s resurrection and Christ’s kingdom, which are both articles of faith.

9. It is also possible that the Church errs in its foundation, but it does not err tenaciously or until the end. This is evident in the apostles, who erred in the fundamental doctrine concerning the resurrection.</p></blockquote>

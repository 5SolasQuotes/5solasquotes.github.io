<main class="wrap"><figure class="quote" id="q-e7f5b79954" data-kw="">
<blockquote><p>The third cause is to avoid the inconvenience of solitariness, signified in these words, “It is not good for man to be alone;” as though he had said, This life would be miserable and irksome, and unpleasant to man, if the Lord had not given him a wife to company his troubles. If it be not good for man to be alone, then it is good for man to have a fellow; therefore as God created a pair of all other kinds, so he created a pair of this kind.

We say that one is none, because he cannot be fewer than one, he cannot be less than one, he cannot be weaker than one, and therefore the wise man saith, Eccles. iv. 10, ‘Woe to him that is alone,’ that is, he which is alone shall have woe. Thoughts, and cares, and fears will come to him because he hath none to comfort him, as thieves steal in when the house is empty; like a turtle which hath lost his mate; like one leg when the other is cut off; like one wing when the other is clipped; so had the man been, if the woman had not been joined to him; therefore for mutual society, God coupled two together, that the infinite troubles which lie upon us in the world might be eased with the comfort and help one of another, and that the poor in the world might have some comfort as well as the rich ; for “the poor man,” saith Solomon, “is forsaken of his own brethren,” Prov. xix. 7; yet God hath provided one comfort for him, like Jonathan’s armour-bearer, that shall never forsake him, 1 Sam. xiv. 7, that is, another self, which is the only commodity (as I may term it) wherein the poor do match the rich; without which some persons should have no helper, no comfort, no friend at all.

But as it is not good to be alone, so Solomon sheweth that “it is better to be alone than to dwell with a froward wife,” Prov. xxi. 9, which is like a quotidian ague, to keep his patience in ure [sic]. Such furies do haunt some men, like Saul’s spirit, 1 Sam. xvi. 14, as though the devil had put a sword into their hands to kill themselves; therefore choose whom thou mayest enjoy, or live alone still, and thou shalt not repent thee of thy bargain.</p></blockquote>

<blockquote><p>For although the Papists have some glimpse of light &amp; see more then the Heathens, as the Pharisees did whose words (I am afraid) they will use likewise: are we also blind? yet as the Pharisees were overseen foully in many of their arguments grounded upon reason, so the Papists may be. And that they not only may be overseen, but are in the reasons which their puddle-water hath yielded unto Bellarmine’s cisterns in this point: the beams of reason lightened from above shall open &amp; descrie; let such as love not darkness more then light be judges. For he reasoneth first thus: The Marriage of the faithful is a sign of Christ’s conjunction with the Church, as St. Paul teacheth. But that Conjunction is indissoluble, and cannot be loosed, The band of Marriage is therefore indissoluble too. As if a rebel should say. The joining of the Head with the Body in man resembleth the Conjunction of Christ with the Church as St. Paul teacheth.

But Christ &amp; the Church can never be parted, there fore the head may never be cut from the body. A happy conclusion for Traitors, if it were true. But if it bee false where then is Bellarmine’s reason? which will take the greater overthrow by this because look how Christ is the head of the Church, semblably the husband is the wives head. So that notwithstanding the similitude of Christ’s head-ship, the joint whereby a traitorous head is knit unto his body may feel the axe of Justice, as Bell. will grant: the marriage band that coupleth a man to an adulterous wife may be loosed by the like reason, notwithstanding marriage is a sign of Christ’s conjunction with the Church. And if this suffice not to make him acknowledge the looseness &amp; fondness of his sophistical syllogism, let him observe farther that the separation which themselves allow in case of adultery is condemned by it.

For Christ doth continue with his Church alway, &amp; cherisheth her for ever with his spirit of comfort, &amp; he is so far from despoiling her of her own wealth, if she had any, that of his gifts &amp; graces still he leaveth with her. Now the papists teach that a man may lawfully withdraw himself from ever dwelling with his wife, &amp; from yielding husband-like love &amp; duty to her, yea may still with-hold her own dowry from her, if she be an adulteress. Which doctrine how could Bell. cleanse from stain of error, if some whore of Rome should touch it with this reason. The marriage of the faithful is a sign of Christ’s conjunction with the Church, as Paul teacheth? but Christ doth still assist relieve, &amp; enrich the Church with his graces: therefore must the husband dwell still with his wife &amp; find her maintenance &amp; wealth. Would he say the C[ouncil]. of Trent accurseth all who make such Jesuitical syllogisms &amp; sophisms against their sacred canon. Certainly the harlots reason must be good unless the Jesuits be naught.

But he goeth onward, &amp; addeth that albeit some parts of the Church, to wit, some faithful folk do commit spiritual whoredom now &amp; then, &amp; make a divorcement yet it is not lawful for them to change their God. What a speech is this? As who say, our Saviour could deserve at our hands that we should forsake him, &amp; got ourselves a new bridegroom. Neither doth God cast them so away (saith Bell) that he will not be reconciled, nay he doth exhort to reconcilement still; Still? To whom then sware he, they should not enter into his rest? what were they whose carcasses fell in the wilderness? whence came the man of God who willed them that commit idolatry to be slain? where lived the Prophet who says Thou distroyest all them that go a whoring from thee: The Israelites whom God did shut out of the promised land, of whom he took many thousands away by sundry plagues, to whom the law speaketh as being under the law, did they not profess that faith &amp; use those Sacram. which al that doe are faithful folk &amp; parts of the church in Bell. phrase &amp; meaning?

I grant that God offereth to be reconciled sometimes to such offenders, &amp; waiteth in mercy long for their amendment. which if it be a pattern for us to follow herein, I say, if it be, for God gave time of repentance to Joab a will-full murderer, whom the magistrate should have put to death presently: God gave time of repentance to idolatrous wives of the Jews, whom their husbands ought not to have spared so: if therefore God’s action̄ herein be set down for our imitation, the man that can contain, &amp; be without a wife, as God without our service, may likewise in mercy wait for her repentance, &amp; when he perceive it to be unfeigned, take her again to be his wife. But he who can not, or will not render such kindness for such unkindness &amp; wickedness, may in justice also put her so away that no place or hope of reconcilement be left her, as Bell. own reason in this similitude teacheth.

For God is not bound to give unto prophane despisers of his grace &amp; breakers of his covenant place of repentance &amp; reconciliation: Nay he may in justice absolutely deny it them, &amp; oftentimes doth as the examples of Cain, of Esau, of Corah, Dathan &amp; Abiram, of Zimri. of Acan, of Ananias &amp; Saphira, of sinfinit other, that have either presently dyed in their sins, or had sentence of death pronounced irrevocably against them, do argue. wherefore when Bell. concluded this reason with saying that S. Austin urgeth it greatly in his book of the Good of marriage: he dealeth as Cooks do in larding lean-meat to give that a relish, which of it self would be unsavoury.

Though even for the lard too perhaps it agreeth not half so well herewith, as this Italian cook would have us think it doth. For why did not S. Austin urge the same likewise in his books of adulterous marriages written afterward &amp; purposely maintaining this Point against Polētius who gainsaid him in it? was it because he saw that he had urged it more then it would bear well? or that he perceived it would not hold against an adversary: though without an adversary it were a pretty allusion? At least whatsoever men deem of the lard, the meat is naught questions: &amp; such that though the cook be content to eat the driest morsel of it, yet must he needs grant that it hath not taste, not as much as the white of an egg hath. For himself saith that marriage betokeneth &amp; signifieth Christ’s conjunction with the faithful soul, as Thomas [Aquinas?] &amp; the Pope teach. But Christ’s conjunction with the faithful soul is not indissoluble, as him self also saith: the band of marriage therefore (by his own consequence) may be dissolved &amp; loosed. And thus far of his first sophism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rainolds.html">John Rainolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A defence of the judgment of the Reformed churches. That a man may lawfully not only put away his wife for her adultery, but also marry another. Wherein both Robert Bellarmine the Jesuits Latin treatise, and an English pamphlet of a nameless author maintaining the contrary are confuted by John Raino</cite>, (Dordrecht: George Walters, 1609), pp 79-82.</span></figcaption>

eth+a+man+to+an+adulterous+wife+may+be+loosed+by+the+like+reason%2C+notwithstanding+marriage+is+a+sign+of+Christ%E2%80%99s+conjunction+with+the+Church.+And+if+this+suffice+not+to+make+him+acknowledge+the+looseness+%26+fondness+of+his+sophistical+syllogism%2C+let+him+observe+farther+that+the+separation+which+themselves+allow+in+case+of+adultery+is+condemned+by+it.%0A%0AFor+Christ+doth+continue+with+his+Church+alway%2C+%26+cherisheth+her+for+ever+with+his+spirit+of+comfort%2C+%26+he+is+so+far+from+despoiling+her+of+her+own+wealth%2C+if+she+had+any%2C+that+of+his+gifts+%26+graces+still+he+leaveth+with+her.+Now+the+papists+teach+that+a+man+may+lawfully+withdraw+himself+from+ever+dwelling+with+his+wife%2C+%26+from+yielding+husband-like+love+%26+duty+to+her%2C+yea+may+still+with-hold+her+own+dowry+from+her%2C+if+she+be+an+adulteress.+Which+doctrine+how+could+Bell.+cleanse+from+stain+of+error%2C+if+some+whore+of+Rome+should+touch+it+with+this+reason.+The+marriage+of+the+faithful+is+a+sign+of+Christ%E2%80%99s+conjunction+with+the+Church%2C+as+Paul+teacheth%3F+but+Christ+doth+still+assist+relieve%2C+%26+enrich+the+Church+with+his+graces%3A+therefore+must+the+husband+dwell+still+with+his+wife+%26+find+her+maintenance+%26+wealth.+Would+he+say+the+C%5Bouncil%5D.+of+Trent+accurseth+all+who+make+such+Jesuitical+syllogisms+%26+sophisms+against+their+sacred+canon.+Certainly+the+harlots+reason+must+be+good+unless+the+Jesuits+be+naught.%0A%0ABut+he+goeth+onward%2C+%26+addeth+that+albeit+some+parts+of+the+Church%2C+to+wit%2C+some+faithful+folk+do+commit+spiritual+whoredom+now+%26+then%2C+%26+make+a+divorcement+yet+it+is+not+lawful+for+them+to+change+their+God.+What+a+speech+is+this%3F+As+who+say%2C+our+Saviour+could+deserve+at+our+hands+that+we+should+forsake+him%2C+%26+got+ourselves+a+new+bridegroom.+Neither+doth+God+cast+them+so+away+%28saith+Bell%29+that+he+will+not+be+reconciled%2C+nay+he+doth+exhort+to+reconcilement+still%3B+Still%3F+To+whom+then+sware+he%2C+they+should+not+enter+into+his+rest%3F+what+were+they+whose+carcasses+fell+in+the+wilderness%3F+whence+came+the+man+of+God+who+willed+them+that+commit+idolatry+to+be+slain%3F+where+lived+the+Prophet+who+says+Thou+distroyest+all+them+that+go+a+whoring+from+thee%3A+The+Israelites+whom+God+did+shut+out+of+the+promised+land%2C+of+whom+he+took+many+thousands+away+by+sundry+plagues%2C+to+whom+the+law+speaketh+as+being+under+the+law%2C+did+they+not+profess+that+faith+%26+use+those+Sacram.+which+al+that+doe+are+faithful+folk+%26+parts+of+the+church+in+Bell.+phrase+%26+meaning%3F%0A%0AI+grant+that+God+offereth+to+be+reconciled+sometimes+to+such+offenders%2C+%26+waiteth+in+mercy+long+for+their+amendment.+which+if+it+be+a+pattern+for+us+to+follow+herein%2C+I+say%2C+if+it+be%2C+for+God+gave+time+of+repentance+to+Joab+a+will-full+murderer%2C+whom+the+magistrate+should+have+put+to+death+presently%3A+God+gave+time+of+repentance+to+idolatrous+wives+of+the+Jews%2C+whom+their+husbands+ought+not+to+have+spared+so%3A+if+therefore+God%E2%80%99s+action%CC%84+herein+be+set+down+for+our+imitation%2C+the+man+that+can+contain%2C+%26+be+without+a+wife%2C+as+God+without+our+service%2C+may+likewise+in+mercy+wait+for+her+repentance%2C+%26+when+he+perceive+it+to+be+unfeigned%2C+take+her+again+to+be+his+wife.+But+he+who+can+not%2C+or+will+not+render+such+kindness+for+such+unkindness+%26+wickedness%2C+may+in+justice+also+put+her+so+away+that+no+place+or+hope+of+reconcilement+be+left+her%2C+as+Bell.+own+reason+in+this+similitude+teacheth.%0A%0AFor+God+is+not+bound+to+give+unto+prophane+despisers+of+his+grace+%26+breakers+of+his+covenant+place+of+repentance+%26+reconciliation%3A+Nay+he+may+in+justice+absolutely+deny+it+them%2C+%26+oftentimes+doth+as+the+examples+of+Cain%2C+of+Esau%2C+of+Corah%2C+Dathan+%26+Abiram%2C+of+Zimri.+of+Acan%2C+of+Ananias+%26+Saphira%2C+of+sinfinit+other%2C+that+have+either+presently+dyed+in+their+sins%2C+or+had+sentence+of+death+pronounced+irrevocably+against+them%2C+do+argue.+wherefore+when+Bell.+concluded+this+reason+with+saying+that+S.+Austin+urgeth+it+greatly+in+his+book+of+the+Good+of+marriage%3A+he+dealeth+as+Cooks+do+in+larding+lean-meat+to+give+that+a+relish%2C+which+of+it+self+would+be+unsavoury.%0A%0AThough+even+for+the+lard+too+perhaps+it+agreeth+not+half+so+well+herewith%2C+as+this+Italian+cook+would+have+us+think+it+doth.+For+why+did+not+S.+Austin+urge+the+same+likewise+in+his+books+of+adulterous+marriages+written+afterward+%26+purposely+maintaining+this+Point+against+Pole%CC%84tius+who+gainsaid+him+in+it%3F+was+it+because+he+saw+that+he+had+urged+it+more+then+it+would+bear+well%3F+or+that+he+perceived+it+would+not+hold+against+an+adversary%3A+though+without+an+adversary+it+were+a+pretty+allusion%3F+At+least+whatsoever+men+deem+of+the+lard%2C+the+meat+is+naught+questions%3A+%26+such+that+though+the+cook+be+content+to+eat+the+driest+morsel+of+it%2C+yet+must+he+needs+grant+that+it+hath+not+taste%2C+not+as+much+as+the+white+of+an+egg+hath.+For+himself+saith+that+marriage+betokeneth+%26+signifieth+Christ%E2%80%99s+conjunction+with+the+faithful+soul%2C+as+Thomas+%5BAquinas%3F%5D+%26+the+Pope+teach.+But+Christ%E2%80%99s+conjunction+with+the+faithful+soul+is+not+indissoluble%2C+as+him+self+also+saith%3A+the+band+of+marriage+therefore+%28by+his+own+consequence%29+may+be+dissolved+%26+loosed.+And+thus+far+of+his+first+sophism.%E2%80%9D%0A%0A%E2%80%94+John+Rainolds%2C+A+defence+of+the+judgment+of+the+Reformed+churches.+That+a+man+may+lawfully+not+only+put+away+his+wife+for+her+adultery%2C+but+also+marry+another.+Wherein+both+Robert+Bellarmine+the+Jesuits+Latin+treatise%2C+and+an+English+pamphlet+of+a+nameless+author+maintaining+the+contrary+are+confuted+by+John+Raino%2C+%28Dordrecht%3A+George+Walters%2C+1609%29%2C+pp+79-82.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe842160d09.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e842160d09.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/07/26/john-rainolds-on-divorce-and-christs-marriage-to-the-church/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-515bc6a4a5" data-kw="">
<blockquote><p>We see this in marriage, published in the face of the Church, solemnized by consent of parties and parents, ratified by the action of the minister, and celebrated in the presence of many friends; the knot cannot be untied, no not by agreement of the parents, of the parties, of the minister, of the friends, and of the whole congregation, because marriage is not of the nature of a civil contract, but God is a party and hath a special hand in it, and whom God hath joined together let no man put asunder, or separate again without his consent. (Mt. 19:6)</p></blockquote>

</figure><figure class="quote" id="q-537c63a515" data-kw="">
<blockquote><p>The very ground of this assertion of master [Robert] Bellarmine’s [a Romanist], is that he thinks not the copulation of married folk to be of the substance of matrimony. And this he proves by some testimonies out of the fathers in that fifth chapter. But yet himself will not [have] that this his saying should be so understood as if that he said that the use of marriage is not any way of the substance of marriage. For afterwards he says that this their sacrament may have two respects. As it is made, and as it is continued. As it [is] made, that is, (if I be not deceived) as the mutual consent of parties joines them together by their promises, the consent expressed by such words, is the matter and form of their sacrament. And thus must we understand that common rule in their law, that consent makes marriages. And thus do the fathers understand that which they say concerning the substance of marriage to consist in the mutual consent: partly, because after such consent given, the parties are not free to change the choice which they have made: and partly because that even by God’s law, if parties after such consent given, should carnally know another, it was death for them so to do: which could not be, but because this their consent is after a sort the marriage itself.</p></blockquote>

ttps://reformedbooksonline.com/topics/topics-by-subject/family/marriage/#:~:text=The%20very%20ground%20of%20this%20assertion,after%20a%20sort%20the%20marriage%20itself&amp;text=The%20very%20ground%20of%20this%20assertion%20of%20master&amp;text=consent%20is%20after%20a%20sort%20the%20marriage%20itself" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9fb32096e2" data-kw="">
<blockquote><p>Yet it is still a greater wonder to me, why they compel a man to remain unmarried after being separated from his wife by divorce, and why they will not permit him to remarry. For if Christ permits divorce on the ground of unchastity and compels no one to remain unmarried, and if Paul would rather have us marry than burn [I Cor. 7:9], then he certainly seems to permit a man to marry another woman in the place of the one who has been put away.</p></blockquote>

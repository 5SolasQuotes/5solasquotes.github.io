<main class="wrap"><figure class="quote" id="q-a8df8cd63a" data-kw="">
<blockquote><p>In light of such problems, Leigh, Maccovius, and Twisse (very much following the tradition) indicate that the voluntas propositi or beneplaciti [proposed will or of good pleasure, i.e. the will of decree] alone is properly called the will of God, ‘which none can resist, Rom. 9:19,’ whereas the voluntas signi or commandment is only ‘improperly’ called God’s will… Baxter does agree with Twisse, however, that the commandments or signs of God are only improperly designated as the divine will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD 3.459</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-706d9201a5" data-kw="">
<blockquote><p>§24. Question 24: May we pray for the destruction of the enemies of Christ, or of the Gospel, or of the king? Answer: Not with respect to that which is called God’s antecedent will; for so we ought first to pray for their conversion (and restraint till then). But with respect to that called his consequent will, we may: that is, we must first pray that they may be restrained and converted, and secondly that, if not, they may be destroyed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory... (London: White, 1673), pt. 2, Christian Economics, ch. 23, title 2, Some Questions about Prayer Answered</cite>, p. 595</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

— Richard Baxter, A Christian Directory... (London: White, 1673), pt. 2, Christian Economics, ch. 23, title 2, Some Questions about Prayer Answered, p. 595">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A724.+Question+24%3A+May+we+pray+for+the+destruction+of+the+enemies+of+Christ%2C+or+of+the+Gospel%2C+or+of+the+king%3F+Answer%3A+Not+with+respect+to+that+which+is+called+God%E2%80%99s+antecedent+will%3B+for+so+we+ought+first+to+pray+for+their+conversion+%28and+restraint+till+then%29.+But+with+respect+to+that+called+his+consequent+will%2C+we+may%3A+that+is%2C+we+must+first+pray+that+they+may+be+restrained+and+converted%2C+and+secondly+that%2C+if+not%2C+they+may+be+destroyed.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory...+%28London%3A+White%2C+1673%29%2C+pt.+2%2C+Christian+Economics%2C+ch.+23%2C+title+2%2C+Some+Questions+about+Prayer+Answered%2C+p.+595&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F706d9201a5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/706d9201a5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=%C2%A724.%20Question%2024%3A%20May%20we%20pray,if%20not%2C%20they%20may%20be%20destroyed." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f00ef9afe1" data-kw="">
<blockquote><p>Still, however, the will of God is not at variance with itself. It undergoes no change. He makes no pretence of not willing what He wills, but while in Himself the will is one and undivided, to us it appears manifold, because, from the feebleness of our intellect, we cannot comprehend how, though after a different manner, He wills and wills not the very same thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, 1.18.3</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-13b047c2a0" data-kw="">
<blockquote><p>Further, there are some which interpret these words of the apostle [1 Tim. 4:2, “God will have all men to be saved”], of the will of the sign or of the antecedent, that all men are invited, for that preaching is indifferently set forth to all men. Neither is there any, in a manner, which inwardly feels not some prick whereby he is oftimes stirred up to live well. So that if we respect this will of God, we easily grant that He will have all men to be saved. But they will not have it to be understood of the hidden and effectual will, which they call consequent: and after this manner may those kinds of speech be understood: ‘God lightens every man which comes into this world;’ (Jn. 1:9) ‘Come unto Me all ye which labor, and are laden.’ (Mt. 11:21) For all men are provoked by the oracles of God, and all men are inwardly moved by some provoking. All these interpretations are doubtless very likely, and also apt… 46. They object also a sentence of Christ, ‘How often would I have gathered together thy children, as a hen gathers together her chickens, and thou wouldest not?’ (Mt. 23:37) But here also is meant of the antecedent will of the sign, whereby God by his prophets, preachers, apostles and scriptures, many times invited the Jews to fly unto Him by repentance: which yet they refused to do. But yet God, by his effectual will, which they call consequent, perpetually drew to Him those that were his: neither was there ever any age wherein He gathered not together as many of the Hebrews as He had predestinated. Therefore Augustine said, ‘Those which I would, I have gathered together, although thou wouldest not.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Places (d. 1562; London, 1583), pt. 3, ch. 1, Of Predestination upon the 9th Chapter to the Romans</cite>, pp. 31-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-0c2f5df2d3" data-kw="">
<blockquote><p>If we compare this text [Matt 23:37, Christ lamenting over Jerusalem] with Isa. 6:10 they seem to be contrary. For here Christ says, ‘I would have gathered you’: there He says, ‘Harden them that they be not gathered and converted.’ God therefore seems to will and not to will one and the same thing. Answer: There is but one will in God: yet does it not equally will all things, but in diverse respects it does will and nil the same thing. He wills the conversion of Jerusalem, in that He approves it as a good thing in itself: in that He commands it, and exhorts men to it: in that He gives them all outward means of their conversion. He wills it not, in that He did not decree effectually to work their conversion. For God does approve, and He may require many things, which nevertheless for just causes known to Himself, He will not do. The confirmation of the angels that fell, God approved as a thing good in itself, yet did not He will to confirm them. A judge in compassion approves and will[s] the life of a malefactor: and yet withal he wills the execution of justice in his death. Even so God sometimes wills that in his signifying will, which He wills not in the will of his good pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of God’s Free Grace &amp; Man’s Free Will (Cambridge, 1601)</cite>, p. 44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

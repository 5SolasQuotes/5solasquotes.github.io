<main class="wrap"><figure class="quote" id="q-58370bd530" data-kw="">
<blockquote><p>Internal or real Virtue consists in an inward Temper and Disposition of Mind, which is like to God and conformable to the moral Perfections of his Nature; such as Holiness, Justice, Goodness and Truth. And this internal, divine Principle will naturally produce a Course of external Actions conformable to it, as the natural Effect and Expression of it. And the ultimate End and Design of a Person endued with this Principle, will be to act in Conformity to the divine Perfections, and to do all to the Glory of God.

… External or apparent Virtue is such an external Conduct as may seem to be the visible Effect or Expression of this inward divine Principle; but, in Reality, is not; and proceeds from some lower Motive, such as Self-Interest, Honour, Fancy, or the like. Thus a Man may devote a considerable Part of his Estate to public Uses civil and sacred, may be just and beneficent to his Neighbour, punctual to his Promises, and abstain from all bodily Excesses; and yet, in all these Things, have no Regard to God, but only to himself, to his own Interest, Reputation or Fancy.

Although the Matter of these Actions is just and right, and agreeable to the divine Law; yet, as they do not proceed from a true Principle and right End, they are not really virtuous, nor so accounted by the Searcher of Hearts. Indeed the Heathen, who had no higher Principle, generally accounted such Actions to be virtuous; but divine Revelation teaches us, that there can be no virtuous Actions without a divine Temper of Mind, in Conformity to the Perfections of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-clap.html">Thomas Clap</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An essay on the nature and foundation of moral virtue and obligation; being a short introduction to the study of ethics; for the use of students of Yale-College</cite>, (New Haven: B. Mecom, 1765), pp 7-8.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god.html">Attributes of God</a></span></div>

<blockquote><p>XXIII. There is in man a twofold judgment, to wit, an antecedent, which is that of the affections and senses; and a consequent, which is that of reason: so there is a twofold volition: the one follows the judgment of sense, and it is rather an imperfect desire than a perfect volition; the other follows the judgment of reason: both these volitions were in Christ more eminently than in us, because in Him were two wills, and these, by reason of his two natures, were distinct in Him, though his person was but one; therefore He desired the cup might pass from Him, but willed it not; or, He willed it by his antecedent, not by his consequent will. O Thou that madest in Thyself the judgement of affection stoop to the judgment of reason and madest thy desire subservient to thy will, and causedst thy antecedent will to give place to thy consequent: produce in me the same effect, that these sinful delights which my affections so earnestly run after, and thy gentle corrections, which they so earnestly run from, may be so ordered that the one by me may be courageously subdued, the other patiently endured, that my affections may submit to my will, my will to reason and reason to thy Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Century of Divine Meditations upon Predestination</cite>, … (London: Young, 1646), pp. 15-16, 19, 21-23, 89-92 Ross (c. 1590–1654) was a Scottish minister and chaplain-in-ordinary to King Charles I. He was not the Aberdeen doctor of the same name.</span></figcaption>

<blockquote><p>There is no composition in God, neither Physical, nor Logical, nor Metaphysical; because in him there is no priority nor posteriority, as in composition where the compositum is posterior to the parts compounding.

2. In composition there is act and possibility; but God is all act.

3. In composition the parts differ from the compositum; but in God there is no difference.

4. There is no composition in form; but God is a most simple form.

5. Whatsoever is compounded hath a cause of that composition; but in God there is no cause.</p></blockquote>

</figure><figure class="quote" id="q-05df01efa5" data-kw="">
<blockquote><p>We may be reminded that the [Westminster] Confession declares God to be ‘without passions.’ So the theologians tell us that we must ascribe to Him no ‘passive powers’; for then He would not be immutable. He acts on everything, but is acted on by none. He is the source, but not the recipient of effects. This is indisputable. But we should not so overstrain the truth as to reject two other truths. One is, that while God has no passions, while He has no mere susceptibility such that his creature can cause an effect upon it irrespective to God’s own will and freedom, yet He has active principles. These are not passions, in the sense of fluctuations or agitations, but none the less are they affections of his will, actively distinguished from the cognitions in his intelligence. They are true optative functions of the divine Spirit. However anthropopathic may be the statements made concerning God’s repentings, wrath, pity, pleasure, love, jealousy, hatred, in the Scriptures, we should do violence to them if we denied that He here meant to ascribe to Himself active affections in some mode suitable to his nature. And it is impossible for us to suppose an agent without active principles, as well as cognitive, as we could not believe that the compass could move the ship without any motive power. The other truth is, that objective beings and events are the real occasions, though not efficient causes, of the action both of the divine affections and will. Are not many divines so much afraid of ascribing to God any ‘passive powers,’ or any phase of dependence on the creature, that they hesitate even to admit that scriptural fact? But why should they recoil from the simple statements of his Word on this point, unless they were confused or misled by the old sensualistic view, which regarded the objective impression as somehow the efficient, instead of the mere occasion, of the following activities of the percipient soul: “God is angry with the wicked every day” (Ps. 7:11); “But the thing that David had done displeased the Lord;” “My delight is in her” (Is. 62:4); “In these things I delight, saith the Lord” (Jer. 9:24). Is all this so anthropopathic as not even to mean that God’s active principles here have an objective? Why not let the Scriptures mean what they so plainly strive to declare? But some seem so afraid of recognizing in God any susceptibility of a passive nature that they virtually set Scripture aside, and paint a God whose whole activities of intelligence and will are so exclusively from Himself that even the relation of objective occasion to Him is made unreal, and no other is allowed than a species of coincidence or preëstablished harmony. They are chary of conceding (what the Bible seems so plainly to say) that God is angry because men sin; and would go no farther than to admit that somehow He is angry when men sin, yet, because absolutely independent, angry only of Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discussions</cite>, vol 1, ‘God’s Indiscriminate Proposals of Mercy’</span></figcaption>

0of%20Himself" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Creation, Providence and Redemption, considered as they are in God, i.e. as immanent acts, belong unto God’s sufficiency and may be placed amongst his attributes; but if they be looked at as transient acts, i.e. as acts passing, and done in time; so they belong unto God’s efficiency, and are placed amongst the works of God.</p></blockquote>

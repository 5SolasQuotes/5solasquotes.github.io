</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-916507e2d1" data-kw="">
<blockquote><p>VIII. Third, as to moral necessity arising from habits. For as the will can be called “free” if it is devoid of habit, so it can rightly be called “slavish” if by habit it has been determined to a certain manner of acting. Still this servitude by no means overthrows the true and essential nature of liberty. Otherwise it would follow that habits destroy the will (which they rather perfect and facilitate to operation). Hence moral habits are twofold: good and evil. A twofold servitude also is thence born: the one of righteousness in good; the other of sin in evil and misery. This belongs to man in a state of sin, of which John says, “Whosoever committeth sin is the servant of sin” (8:34); and “Ye were the servants of sin” (Rom. 6:17)… IX. Hence it is evident that the adversaries falsely charge our men with saying the will is a slave in the state of sin, as if its liberty were destroyed by that very thing. Scripture beforehand so calls it and indeed with a twofold limitation: (1) that “servant” should be understood not absolutely and physically, but relatively, after the fall in a state of sin; (2) not simply about every natural, civil, or externally moral object, but especially about a spiritual object good per se (in which manner inability to good is more strongly asserted, but the essence of liberty is not destroyed). Although the sinner is so enslaved by evil that he cannot but sin, still he does not cease to sin most freely and with the highest liberty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Institutes, Tenth Topic, ‘The Free Will of Man in a State of Sin’, Question 2. The reader is encouraged to see Turretin’s numerous discussions relating to the related issues throughout his Institutes, as he has a lot more to say., p. 663</span></figcaption>

<blockquote><p>Thesis XX. Whence it appears not only that all and every heir of Adam is universally corrupt, but also totally corrupt, namely both with respect to the soul, and with respect to the body, and finally with respect to the whole composite being. For it should not be thought as if only the body were corrupt, or even only the soul, but the whole man, as great as he is, is corrupt. For just as the image of God was not in the soul alone, nor even in the body alone, but in man and therefore in the whole composite, so also this original sin should be attributed not only to the soul and body, but to the whole composite consisting of soul and body; which can be best gathered from the opposite, regeneration, which pertains not to one or the other part of man, but to the whole man. … Thesis XXII. That the soul is corrupt is, alas, sufficiently clear from the depravation both of the intellect, which, although it may discern something in matters contributing to the convenience of civil life, yet in spiritual matters pertaining to the true worship of God and the salvation of our soul, it is not so much dim-sighted as blind, unless the Lord gives a mind to understand, eyes to see, etc. For its wisdom is enmity against God, holding those things which are of the Spirit of God for foolishness. And although worldly men sometimes understand something, yet they have it not from flesh and blood, but from the revelation of God the heavenly Father. Then of the will, which is placed in the same plight as the intellect. For original sin has so depraved the will that it in no way wills the spiritual good, namely, neither with respect to substance, nor with respect to manner, that is, from faith and for the glory of God. Whence the heart of man is not undeservedly called fraudulent, hardened, whose imagination is evil from his youth. Thesis XXIII. The body is so corrupt that, first in general, our members present themselves as weapons of unrighteousness for sin; then in particular, the mouth is full of curses and bitterness; the tongue is deceitful and the lips are filled with the venom of asps; the throat is an open sepulcher; the eyes are either lustful and evil; the hands are ready for theft; the belly is a god; the knees are bent to idolatry; the feet are swift to shed innocent blood.</p></blockquote>

<blockquote><p>…not only was original righteousness taken away on account of the fall, but by the same stroke the entire nature of man was so morally corrupted as regards the intellect, the will, the affections, that by nature he is blind in respect to all spiritual truth, likewise incompetent for any spiritual good, and prone to all evil in respect to his will. These are the chief reasons of the Reformed: (1) Scripture declares that man is dead in sin (Eph. 2:1, 5; Matt. 8:22; 1 Tim. 5:6; Rom. 5:12), yet death pertains to nature. (2) All of man’s faculties are said to be corrupted: a blind intellect (Eph. 4:18), which does not perceive the things that are of the Spirit, and considers them as foolishness (1 Cor. 2:14–15), a will averse to spiritual good, enmity toward God, which does not subject itself to the divine law, neither indeed can it (Rom. 8:7), an impure conscience (Titus 1:15), distorted affections (Gal. 5:24; Rom. 7:5), members (Rom. 6:19), the whole man entirely corrupted (Isa. 1:4, 6), the flesh, the fleshly man, the old man. (3) We are said to be alienated from the life of God, that is, from the divine, spiritual, and heavenly life (Eph. 4:18), and destitute of the glory of God (Rom. 3:23). (4) We are all said to be under sin (Rom. 3:9ff.). (5) There is made known in us a total powerlessness toward spiritual good (Jer. 13:23; 2 Cor. 3:5; Rom. 7:14–25).</p></blockquote>

<blockquote><p>Although the human will [according to the Roman Catholic Thomist, Domingo Banez] necessarily follows the divine will to attain the good, it does not do so with an absolute necessity (called “necessity of the consequent”) but only with a hypothetical and relative necessity (called “necessity of the consequence”). For example, the fact that the sun shines is an absolute necessity, provoked by the very nature of the sun; however, here we speak of a certain conditional or hypothetical necessity, such as the one the proposition “Peter is seated” has, while Peter is effectively seated. It is not absolutely necessary for Peter to be seated, but, if he is seated, then it is necessary for him (with necessity of consequence) to be seated. Likewise, if God, with his efficacious grace, moves a man here and now to conversion, it is necessary that he performs his conversion, but he will do so freely, because he possesses the intrinsic capacity to do it or not. Moreover, God does not concur in the human act as a partial cause, as Molina thought, but as a principal total cause, while the created free will is also a total but subordinate cause.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-f49c1f4576" data-kw="">
<blockquote><p>At their famous council of 754, the iconoclasts, as is well-known, did not denounce all representations of Christ but only those which attempted in one way or another to stimulate his outward form or appearance by means of painting or sculpture. In fact, they specifically endorsed what they called the image of Christ as set forth in the Eucharist… Many, however, seem not to be aware that the iconoclasts at the same time announced their approval of still another, and, from the ethical point of view, at least, more significant conception of an image, which described the virtues of the saints as living images and called for their imitation. This spiritual or ethical interpretation of the image is probably to be understood as a part of the iconoclastic campaign to purify Christian worship of what many took to be superstitious and idolatrous practices. Our knowledge of these iconoclastic efforts in the direction of reform, dating from the so-called First Iconoclastic period (726-787), we owe principally to the text of the oros, (Horos, or dogmatic definition) and anathemas pronounced by the iconoclastic Council of 754… Apart from a brief general introduction and conclusion, the florilegium of 754 consists of eight excerpts from the fathers, of which all but two deal with what I shall, for the sake of brevity, call the ethical theory of the image.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/milton-v-anastos.html">Milton V. Anastos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Ethical Theory of Images Formulated by the Iconoclasts in 754 &amp; 815’ in Dumbarton Oaks Papers</cite>, vol. 8 (1954), pp. 153-60, p. 153</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-46af5bd0b2" data-kw="">
<blockquote><p>We consider the placement of images and statues in the places of worship as explicitly forbidden by God’s Word a thousand times. For why else would they be placed there except for worship? Is it to stir the memory? And yet the Holy Spirit is wiser than we are.</p></blockquote>

</figure><figure class="quote" id="q-7d61bfb3e3" data-kw="">
<blockquote><p>What is it to have other gods besides the true God? I fear upon search, we have more idolaters among us than we are aware of. (1) To TRUST in anything more than God, is to make it a god. If we trust in our RICHES, we make riches our God.… Money is his creator, redeemer, comforter: his creator, for if he has money, he thinks he is made; his redeemer, for if he is in danger, he trusts to his money to redeem him; his comforter, for if he is sad, money is the golden harp to drive away the evil spirit. Thus by trusting to money, we make it a god.… If we trust in THE ARM OF FLESH, we make it a god.… If we trust in our WISDOM, we make it a god.… If we trust in our MORALITY, we make it a god.… If we trust to our DUTIES to save us, we make them a god.… Use duty—but do not trust to it; for then you make it a god.… If we trust in our GRACE, we make a god of it. Grace is but a creature; if we trust to it we make it an idol.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, First Commandment (trust as heart idolatry)</span></figcaption>

</figure><figure class="quote" id="q-3cf2afc866" data-kw="">

</figure><figure class="quote" id="q-c9fff794c6" data-kw="">
<blockquote><p>Images of God were strictly forbidden. But Puritan psychology also kept its strong Scholastic roots… Tension between Reformed iconoclasm and Scholastic psychology was not immediately apparent, but during the Evangelical Awakening of the 1740s it became acute. The problem may be stated concisely: If mental images are natural products of the imagination, how can a mental image of Christ be condemned as idolatrous? Does not this impugn the character of God who gave the mind its capacity for forming images? The following study… concludes with the controversy which erupted in Scotland when Jonathan Edwards defended the psychological neutrality of ‘Imaginary ideas of Christ.&#x27;</p></blockquote>

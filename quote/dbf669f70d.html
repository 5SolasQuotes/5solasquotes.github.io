<main class="wrap"><figure class="quote" id="q-dbf669f70d" data-kw="">
<blockquote><p>In Voetius’s view it is valid to say that some unborn foetuses have ‘a human life’ and others have not. He refers to Exodus 21:22-23 as a passage suggesting that not all abortions of foetuses are the same. He shows a certain flexibility as to the estimated time when a foetus is animated [ensouled], but maintains that the soul can only ‘be brought into an organized body’… Zechariah 12:1, a text that speaks of ‘…the Lord, which… formeth the spirit of man within him’ (AV)… Voetius obviously thought that initially there is no soul for an embryo that has yet to be formed. He cites various opinions on the time when an embryo is animated… Voet thinks it is prudent not to move beyond the latter estimate [of the 30th to 40th day], and leaves further debate to physicians. The former estimate seems to have been motivated by references to both Aristotle and the Bible (Lev. 12[:2-6]).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aza-goudriaan.html">Aza Goudriaan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Orthodoxy &amp; Philosophy</cite>, pp. 239-42, 247-48 &amp; 257 of ch. 4, ‘The Human Being: His Soul &amp; Body…’ in Reformed Orthodoxy &amp; Philosophy, 1625-1750: Gisbertus Voetius, Petrus van Mastricht, &amp; Anthonius Driessen (Brill, 2006), pp. 239-41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“In Voetius’s view it is valid to say that some unborn foetuses have ‘a human life’ and others have not. He refers to Exodus 21:22-23 as a passage suggesting that not all abortions of foetuses are the same. He shows a certain flexibility as to the estimated time when a foetus is animated [ensouled], but maintains that the soul can only ‘be brought into an organized body’… Zechariah 12:1, a text that speaks of ‘…the Lord, which… formeth the spirit of man within him’ (AV)… Voetius obviously thought that initially there is no soul for an embryo that has yet to be formed. He cites various opinions on the time when an embryo is animated… Voet thinks it is prudent not to move beyond the latter estimate [of the 30th to 40th day], and leaves further debate to physicians. The former estimate seems to have been motivated by references to both Aristotle and the Bible (Lev. 12[:2-6]).”

— Aza Goudriaan, pp. 239-42, 247-48 &amp; 257 of ch. 4, ‘The Human Being: His Soul &amp; Body…’ in Reformed Orthodoxy &amp; Philosophy, 1625-1750: Gisbertus Voetius, Petrus van Mastricht, &amp; Anthonius Driessen (Brill, 2006), pp. 239-41">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+Voetius%E2%80%99s+view+it+is+valid+to+say+that+some+unborn+foetuses+have+%E2%80%98a+human+life%E2%80%99+and+others+have+not.+He+refers+to+Exodus+21%3A22-23+as+a+passage+suggesting+that+not+all+abortions+of+foetuses+are+the+same.+He+shows+a+certain+flexibility+as+to+the+estimated+time+when+a+foetus+is+animated+%5Bensouled%5D%2C+but+maintains+that+the+soul+can+only+%E2%80%98be+brought+into+an+organized+body%E2%80%99%E2%80%A6+Zechariah+12%3A1%2C+a+text+that+speaks+of+%E2%80%98%E2%80%A6the+Lord%2C+which%E2%80%A6+formeth+the+spirit+of+man+within+him%E2%80%99+%28AV%29%E2%80%A6+Voetius+obviously+thought+that+initially+there+is+no+soul+for+an+embryo+that+has+yet+to+be+formed.+He+cites+various+opinions+on+the+time+when+an+embryo+is+animated%E2%80%A6+Voet+thinks+it+is+prudent+not+to+move+beyond+the+latter+estimate+%5Bof+the+30th+to+40th+day%5D%2C+and+leaves+further+debate+to+physicians.+The+former+estimate+seems+to+have+been+motivated+by+references+to+both+Aristotle+and+the+Bible+%28Lev.+12%5B%3A2-6%5D%29.%E2%80%9D%0A%0A%E2%80%94+Aza+Goudriaan%2C+pp.+239-42%2C+247-48+%26+257+of+ch.+4%2C+%E2%80%98The+Human+Being%3A+His+Soul+%26+Body%E2%80%A6%E2%80%99+in+Reformed+Orthodoxy+%26+Philosophy%2C+1625-1750%3A+Gisbertus+Voetius%2C+Petrus+van+Mastricht%2C+%26+Anthonius+Driessen+%28Brill%2C+2006%29%2C+pp.+239-41&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdbf669f70d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dbf669f70d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=In%20Voetius%E2%80%99s%20view%20it%20is%20valid,Aristotle%20a </figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b2e7b1723a" data-kw="">
<blockquote><p>(4) The formation of the foetus in the Virgin’s womb had its stages and processes, as is usual in the formation of other foetuses and which are usually completed in the space of 9 months. It was right that Christ should be made like us in this too, namely in not being formed and born in a moment, but being completed in a matrix suited to the order and processes of nature, the operation of the H. Spirit thus accommodating its process of quickening. (5) The union of the divine nature with the human began the moment the formation of the human nature was completed, so that it would be said to have been composed of human matter and form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bartholomaus-keckermann.html">Bartholomaus Keckermann</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in Heinrich Heppe, Reformed Dogmatics, Person of Christ</cite>, section 12, p. 425</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-7f7ce76c33" data-kw="">
<blockquote><p>In terms of justifying the word ‘control,’ I want to explain the importance of avoiding passivity. Dominion involves stewardship, study, exploration, managing, planning, rationing, apportioning, starting work, resting from work, categorizing, improving, and using this creation to God’s glory. Man was not to be passive in relationship to his environment, his family, his time, future, or any other aspect of creation. Indeed, to passively allow creation to order itself is the opposite of the dominion mandate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/phillip-kayser.html">Phillip Kayser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conception Control: Avoiding Antinomianism &amp; Legalism’</cite>, (2017)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-96c7c9f9d1" data-kw="">
<blockquote><p>Whether the Son of God assumed flesh by the soul mediating? It is affirmed with a distinction. Whether the Son of God assumed a soul by the spirit or mind mediating, that is, the rational part of the soul? It is affirmed. Whether the soul was assumed before the flesh. It is denied. Whether the flesh of Christ was assumed by the Word before the union of the soul? It is denied. Whether the whole nature was assumed simultaneously through mediating parts? It is distinguished. Whether the human nature was assumed by grace mediating? It is distinguished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Syllabus of Theological Problems, which, for the Needed Thing to be Proposed or Pressed, are Accustomed to be Used in Private &amp; Public Exercises of Disputations, Examinations, Gatherings &amp; Consultations</cite>, … (Utrecht, 1643), Tract 2, On the Person, Offices &amp; States of Christ the Mediator, Title 1, on the Person of Christ the Mediator, Subtitle: On the Assumption &amp; Union of the Human Nature. trans. T. Fentiman | On the Mode of Assuming, as far as the Order</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“Whether the Son of God assumed flesh by the soul mediating? It is affirmed with a distinction. Whether the Son of God assumed a soul by the spirit or mind mediating, that is, the rational part of the soul? It is affirmed. Whether the soul was assumed before the flesh. It is denied. Whether the flesh of Christ was assumed by the Word before the union of the soul? It is denied. Whether the whole nature was assumed simultaneously through mediating parts? It is distinguished. Whether the human nature was assumed by grace mediating? It is distinguished.”

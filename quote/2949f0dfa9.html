<main class="wrap"><figure class="quote" id="q-2949f0dfa9" data-kw="">
<blockquote><p>Secondly, the mate [spouse] must be fit… diverse men have many virtues, and yet do not fit to some women: and therefore we see many times, even the godly couples to jar when they are married, because there is some unfitness between them which makes odds. What is odds but the contrary to even?… From hence came the first use of the ring in weddings, to represent this evenness: for if it be straighter than the finger it will pinch, and if it be wider than the finger it will fall off; but if it be fit, it neither pinches nor slips: So they which are like strive not…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Preparative to Marriage (1591)</cite>, pp. 30-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c50ef5a04d" data-kw="">
<blockquote><p>Further, if parents should be unwilling to allow the honorable vows of their children and proceed to abuse their power over them, they must be admonished and persuaded by a warning, prayers, and the urging first of relatives and friends, and secondly of the presbyters of the church. But if harsh parents should ignore all these, then the magistrates must interpose their authority, lest anyone by the wickedness of his parents be either kept from marriage longer than is fair or driven to a less acceptable marriage, provided that those who have such inhuman parents are not seeking to be joined with corrupt men of little honor and piety. There was a provision concerning such things even in Roman laws (Digest XXIII, 2, 19, 21, 22; Code V, 4, 12).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Reign of Christ in Melanchthon &amp; Bucer, ed. Wilhelm Pauck (Philadelphia: Westminster Press, 1969), bk. 2, ch. 18, ‘Marriages should not be held valid which are contracted without the consent of those who have power over the ones who make the contract, or without suitable advisors’</cite>, pp. 323-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

%20V%2C%204%2C%2012&amp;text=Further%2C%20if%20parents%20should%20be%20unwilling%20to%20allow&amp;text=2%2C%2019%2C%2021%2C%2022%3B%20Code%20V%2C%204%2C%2012" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0ce3b9668e" data-kw="">
<blockquote><p>But I do not believe that, as royalists say, the kingly power is essentially and univocally that same with a paternal or fatherly power… for if fatherly power be the first and native power of commanding, it is against nature that a monarch who is not my father by generation, should take that power from me, and be a king over me and my children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 62 lt col mid</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-5f44cb6f49" data-kw="">
<blockquote><p>The woman being created was brought to man and given unto him by God, and he took her, with her consent, as flesh of his flesh, and bone of his bone; and they twain became one flesh. And God commanded this order to be observed unto the end of the world. This was the first institution of this sacred society: So that the first and principal efficient of marriage, was God instituting it; the subordinate, is the mutual consent of the parties. For marriage is a contract, or covenant: This is the general nature of it; and as the matter is one man, and one woman, free from all former obligation that may hinder it, so the form, and chief essence is in the special nature of the contract, whereby they mutually bind themselves one unto another so as to become one flesh for term of life of both the parties. The end is propagation mutual help and comfort, and upon the Fall, per accidens, the avoiding of fornication.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-lawson.html">George Lawson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theo-Politica, or, A Body of Divinity... (London: Streater, 1659), ch. 8, 7th Commandment</cite>, p. 205</span></figcaption>

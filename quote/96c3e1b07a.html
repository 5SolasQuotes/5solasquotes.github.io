<main class="wrap"><figure class="quote" id="q-96c3e1b07a" data-kw="">
<blockquote><p>Warfield is correct in claiming that the clause was intended to exclude hypothetical universalism by ensuring that each element in the ordo salutis (order of salvation) was recognized as intended only for the elect, and was not merely a description of the fact that only the elect receive the benefits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-letham.html">Robert Letham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Assembly</cite>, p. 182</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>
<div class="actions"><button class="copy" data-copy="“Warfield is correct in claiming that the clause was intended to exclude hypothetical universalism by ensuring that each element in the ordo salutis (order of salvation) was recognized as intended only for the elect, and was not merely a description of the fact that only the elect receive the benefits.”

— Robert Letham, The Westminster Assembly, p. 182">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWarfield+is+correct+in+claiming+that+the+clause+was+intended+to+exclude+hypothetical+universalism+by+ensuring+that+each+element+in+the+ordo+salutis+%28order+of+salvation%29+was+recognized+as+intended+only+for+the+elect%2C+and+was+not+merely+a+description+of+the+fact+that+only+the+elect+receive+the+benefits.%E2%80%9D%0A%0A%E2%80%94+Robert+Letham%2C+The+Westminster+Assembly%2C+p.+182&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F96c3e1b07a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/96c3e1b07a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=Warfield%20is%20correct%20in%20claiming%20that,only%20the%20elect%20receive%20the%20benefits&amp;text=Warfield%20is%20correct%20in%20claiming%20that%20the%20clause&amp;text=fact%20that%20only%20the%20elect%20receive%20the%20benefits" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d33ddd19d4" data-kw="">
<blockquote><p>Amyraut, however, builds on Calvin’s argument and, indeed, claims to be interpreting and clarifying it by arguing two mercies and two wills in God where Calvin did not; in fact where Calvin had specifically stated that the will of God is one and simple, albeit with distinctions that can be observed in its revelation. Where Calvin resolved the issue of the universal call and particular election by simply declaring a resolution in the fact that, as promised, the repentant are saved, Amyraut indicated a double divine intentionality… Even if Amyraut had added, as he would do at the Synod of Alençon, that his language of two decrees was by rational distinction and intended “without any succession of Thought, or Order of Priority and Posteriority” in God, his exegesis still would differ from Calvin’s in its postulation of two divine mercies and two intentions. The exegesis of the particular text, therefore, does not fully support those who appeal to it in order to interpret Amyraut as a precise follower of Calvin… Amyraut offered his own conclusion, modifying and supplementing Calvin’s argument with a concept of two wills in God—a scholastic distinction not found in Calvin’s reading of the text and related, probably, to Amyraut’s own training under John Cameron.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Tale of Two Wills: Calvin &amp; Amyraut on Ezekiel 18:23’ in Calvin Theological Journal 44</cite>, (2009): 211-25, p. 224</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-03e3bb8fd8" data-kw="">
<blockquote><p>The weight of the debate was clearly on the side of the proposition proposed, and on that score alone we cannot feel surprise that it was retained in the Confession.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-90d26f2ee7" data-kw="">
<blockquote><p>…for the proof thereof they [Arminians] allege, as their predecessors, the Semipelagians, did before them, that received axiom of Christ’s dying for all men, which being rightly understood, makes nothing for their purpose. Some of their opposites (subject to oversights as well as others) more forward herein than circumspect, have answered this objection, not by expounding (as was fit) but by flat denying that famous axiom [of Thomas Lombard]: affirming peremptorily, that Christ died only for the elect, and for others nullo modo [in no way]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Most Rev. James Ussher</cite>, … 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘An Answer of the Archbishop of Armagh to some Exceptions taken against his aforesaid Letter’, pp. 562-71, p. 565</span></figcaption>

<blockquote><p>7. The seventh distinction (which is ordinary) is of the commandments into affirmative and negative… … 2. Though the positive commandment, or (the positive part of the commandment) be of alike force and authority with the negative, as to the obligation it lays on us to duty, yet it does not tie us to all occasions and times, as negatives do: Hence is that common maxim, that affirmative commands tie and oblige semper, ever, that is, they never want their authority, and we are never absolved from their obedience, but they do not oblige and tie ad semper, that is, in all differences of time we are not tied to the exercise of the duties enjoined; negatives again oblige both semper and ad semper, that is, always, and in all differences of time: For instance, in the Third Commandment, the affirmative part is to use the Lord’s Name, and ordinances holily and reverently in prayer, reading and hearing, etc. So in the Fourth Commandment we are required to sanctify the Sabbath, by waiting on ordinances, etc. This makes these still duties, so as to pray, hear, etc. are still duties, but we are not to be, and should not be always exercised in these duties, for we must abound in other duties also of necessity, and mercy, we must eat, and sleep, etc. and when we sleep, we can neither act love, nor fear. Again, the negative part is, not to profane the Lord’s Name in his ordinances; this may not be done at any time: The reason of the difference is this, because in affirmatives we are not always tied to the acts of duties and graces, but to the disposition and habit. Habits are a spiritual quality, a (vis) or power sitting and enabling for bringing forth these acts; and for the bringing them forth in the due time and season, when they shall be called for; but in sinful things we are prohibited, not only the habits, but the acts also: the one is always and ever a sin, but the other is not always called for as duty. If any desire rules to know when a duty is called for; as for instance, when we are to pray, hear, etc. it is hardly possible to be particular in this, yet we may try it by these generals: 1. Any affirmative precept binds to present practise, when the duty required tends to Gods glory, unto which every thing should be done (as 1 Cor. 10:31) and when the omission of the duty may dishonor him. 2. When it tends to others edification, and omitting will some way stumble and offend. 3. When some special providences meet and concur, to give opportunity for such a duty; as for instance, the giving of aims when we have it, and some indigent person offers, whose necessity calls for it, Gal. 6:10. So when secrecy for prayer is offered (and no other more necessary duty at that time is called for), which we are to watch unto, Col. 4:2, or when we meet with some special occasion or dispensation, pointing out to us this or that as a duty called for, such a providence invites us to the practice of that duty: for though providences will not make these things to become duties which are not duties, yet they will serve to time and circumstantiate duties that lie on us, by virtue of affirmative precepts. 4. Some special occasions and times are set down in the Word, as for praying morning and evening, for hearing the Word on Sabbath days; and in these, and other the like duties, the examples of the saints, so recorded for imitation in Scripture, would be observed as a copy and pattern. 5. When they have not such inconveniences with them, as cross and hinder other moral duties of edification, love, etc. for if they do that, they must yield and give place to these; but if no other duty be called for, then they ought to be done, for we should be in some duty. And though such duties be in themselves moral, suppose praying, hearing, and such others, which might be instanced, yet the timing of them, or going about them at such a time, and in such a manner, is not moral simply, but as these are by circumstances called for. 6. When without sin such a duty cannot be omitted; and although there be not any inward exercise of mind, or frame of spirit suitable thereto, yet the conscience calls for it, or there is some on special occasion or other that puts us to it. 3. Observe, that this rule of negatives tying ad semper, or obliging in all circumstances of time, is not to be understood, but where the matter is moral; therefore we would distinguish again betwixt negative morals, and negative positives, for positives, whether negative or affirmative, give still place to morals. As for instance, that part of the fourth Commandment is negative. In it (that is, on the seventh day) ‘Thou shalt do no manner of work,’ yet sometimes, when necessity calls for it, some manner of works is lawful on that day, because it is only a negative positive, and not a negative moral: And so David’s eating of Show-bread, was against a negative command, though not against a negative moral, but a negative positive.</p></blockquote>

<blockquote><p>Provided always, That the clause in the Directory, of the administration of the Lord’s Supper, which metions the communicants sitting about the table, or at it, be not interpreted as if, in the judgment of this kirk, it were indifferent, and free for any of the communicants not to come to, and receive at the table; or as if we did approve the distributing of the elements by the minister to each communicant, and not by the communicants among themselves…</p></blockquote>

<blockquote><p>As for the rest of the testimonies Dr. Burgess produces out of the Fathers for kneeling, I need not insist upon them for either they speak of the inward adoration of the heart, which we ought to direct unto Christ when we receive the Sacrament (and this none of us denies), or else they speak of adoring the sacrament: where by the word ‘adoration’ we may not understand any divine worship, inward or outward, but a reverence of another nature, called veneration. That this (which we deny not neither) and no more is meant by the Fathers when they speak of the adoration of the sacrament, Antonius de Dominis shows more copiously (Rep. Eccl., bk. 5, ch. 6).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“As for the rest of the testimonies Dr. Burgess produces out of the Fathers for kneeling, I need not insist upon them for either they speak of the inward adoration of the heart, which we ought to direct unto Christ when we receive the Sacrament (and this none of us denies), or else they speak of adoring the sacrament: where by the word ‘adoration’ we may not understand any divine worship, inward or outward, but a reverence of another nature, called veneration. That this (which we deny not neither) and no more is meant by the Fathers when they speak of the adoration of the sacrament, Antonius de Dominis shows more copiously (Rep. Eccl., bk. 5, ch. 6).”

— George Gillespie, English Popish Ceremonies (1637), 3rd Part, ‘Against the Lawfulness of the Ceremonies’, ch. 4, ‘That the Ceremonies are Idols among Formalists themselves; &amp; that kneeling in the Lord’s Supper before the Bread &amp; Wine in the act of receiving them is formally Idolatry’, p. 79">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+for+the+rest+of+the+testimonies+Dr.+Burgess+produces+out+of+the+Fathers+for+kneeling%2C+I+need+not+insist+upon+them+for+either+they+speak+of+the+inward+adoration+of+the+heart%2C+which+we+ought+to+direct+unto+Christ+when+we+receive+the+Sacrament+%28and+this+none+of+us+denies%29%2C+or+else+they+speak+of+adoring+the+sacrament%3A+where+by+the+word+%E2%80%98adoration%E2%80%99+we+may+not+understand+any+divine+worship%2C+inward+or+outward%2C+but+a+reverence+of+another+nature%2C+called+veneration.+That+this+%28which+we+deny+not+neither%29+and+no+more+is+meant+by+the+Fathers+when+they+speak+of+the+adoration+of+the+sacrament%2C+Antonius+de+Dominis+shows+more+copiously+%28Rep.+Eccl.%2C+bk.+5%2C+ch.+6%29.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29%2C+3rd+Part%2C+%E2%80%98Against+the+Lawfulness+of+the+Ceremonies%E2%80%99%2C+ch.+4%2C+%E2%80%98That+the+Ceremonies+are+Idols+among+Formalists+themselves%3B+%26+that+kneeling+in+the+Lord%E2%80%99s+Supper+before+the+Bread+%26+Wine+in+the+act+of+receiving+them+is+formally+Idolatry%E2%80%99%2C+p.+79&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7e015e2e86.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7e015e2e86.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-lords-supper#:~:text=As%20for%20the%20rest%20of%20the,Rep.%20Eccl.%2C%20bk.%205%2C%20ch.%206&amp;text=As%20for%20the%20rest%20of%20the%20testimonies%20Dr&amp;text=more%20copiously%20%28Rep.%20Eccl.%2C%20bk.%205%2C%20ch.%206" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The ceremonies associated with these signs are of express significance, and therefore are to be implemented as Christ has exemplified in the institution of it. Christ broke the bread, thereby signifying the breaking of his body, that is, his death. The apostle passes on to the congregation the ceremony of breaking; he refers to it as ‘the breaking of bread,’ and ‘the bread which we break’ (1 Cor. 10:16). The apostolic church did likewise, ‘…breaking bread’ (Acts 2:46); ‘…when the disciples came together to break bread’ (Acts 20:7). Therefore today the minister also must break the bread and give it as such to the communicants. The Papists and the Lutherans do this in an entirely different manner by giving a wafer to everyone without breaking it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service (RHB), vol. 2, pp. 474, 529 &amp; 532</cite></span></figcaption>

<blockquote><p>VI. Fifth, ‘the precepts of the first table take the preference of those of the second’ as to necessary internal and external acts, when they both cannot have place at the same time. Thus the love of our neighbor ought to be subjected to the love of God. We are bound to hate father and mother for Christ’s sake (Lk. 14:26), when the love of parents is incompatible (asystatos) with the love of Christ. Human commands are to be neglected when opposed to the commands of God (Mt. 10:37; Acts 4:19). But in turn ‘the ceremonial of the first table yields to the moral of the second because God desires mercy and not sacrifice’ (Hos. 6:6), i.e., moral worship principally and primarily as better and of itself necessary; the ceremonial, however, only secondarily on account of the moral. Hence we ought not to be so anxious about the former as about the latter. … VIII. Seventh, ‘the beginning and end of all the precepts is love.’… However as the object of love is twofold (God and our neighbor), so a twofold love is commanded: of God in the first table of the law; of our neighbor in the second. That is called ‘the first and great commandment’; this ‘the second like to it.’ The love of God is rightly called the ‘first’ commandment because as there is nothing before God, so his worship ought first to be attended to by us in order that all things may begin from and end in it. It is called ‘great’ (a) with regard to the object because conversant with the greatest and infinite object (viz., God)… The second is said to be ‘like’ unto it, not with regard to importance, but (1) with regard to quality because both in the love of God and of our neighbor sincerity and purity of heart are required; (2) with regard to authority because each is commanded by God and tends to his glory; (3) with regard to punishment because the violation of either table exposes to eternal death; (4) with regard to connection and dependence because they are so strictly connected with each other that neither can be fulfilled without the other (for as God cannot be loved without the love of God, who created him)…</p></blockquote>

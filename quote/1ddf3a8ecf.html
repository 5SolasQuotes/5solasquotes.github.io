<main class="wrap"><figure class="quote" id="q-1ddf3a8ecf" data-kw="">
<blockquote><p>Show a law of nature that the father might enslave his children; by a divine positive law, presupposing sin, the father might do that; and yet I think that may be questioned whether it was not a permission rather than a law, as was the bill of divorce; but a law of nature it was not.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7a9d848621" data-kw="">
<blockquote><p>Assertion 1. As a man comes into the world a member of a politic society, he is, by consequence, born subject to the laws of that society… Assertion 2. Slavery of servants to lords or masters, such as were of old amongst the Jews, is not natural, but against nature: 1. Because slavery is malum naturae, a penal evil and contrary to nature, and a punishment of sin. 2. Slavery should not have been in the world if man had never sinned, no more than there could have been buying and selling of men, which is a miserable consequent of sin and a sort of death, when men are put to the toiling pains of the hireling, who longs for the shadow, and [are] under iron harrows and saws, and to hew wood, and draw water continually. 3. The original of servitude was when men were taken in war, to eschew a greater evil, even death, the captives were willing to undergo a less evil, slavery, (S. Servitus, 1 de jure. Pers.) 4. A man being created according to God’s image, he is res sacra, ‘a sacred thing,’ and can no more, by nature’s law, be sold and bought than a religious and sacred thing dedicated to God. Servitus, 1. Instit. de inutil. scrupl. I. inter Stipulantem. S. Sacram. F. de verber. Obligat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘…and How it is True, ‘Every Man is Born Free’ &amp; how Servitude is Contrary to Nature’ in Lex Rex (1644), Question 13, Assertion 2, ff., pp. 51-53</cite>, p. 51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

ink</a><a class="src" href="https://reformedbooksonline.com/topics/slavery/#:~:text=Assertion%201.%20As%20a%20man%20comes,S.%20Sacram.%20F.%20de%20verber.%20Obligat&amp;text=Assertion%201.%20As%20a%20man%20comes%20into%20the&amp;text=inter%20Stipulantem.%20S.%20Sacram.%20F.%20de%20verber.%20Obligat" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8ad5e62da7" data-kw="">
<blockquote><p>1. Liberty is that natural power which man has of his own person, whence a free man is said to be suae potestatis, ‘in his own power’, and it is defined in the law to be a natural faculty to do that which every man pleases, unless he be hindered by law or force. … 5. Though liberty be the most precious right, yet it is not absolute, but limited; First, by the Will of God, and our obediential obligations to Him, and to men by his ordinance; and so though man has power of his own person, yet has he no power of his own life, or his members, to dispose of them at his pleasure, either by taking away of his life or amputation, or hurting of any member by himself, or by giving power to any other so to do, unless it be necessary for preserving the whole, but he is naturally obliged to God to maintain his life: So likewise men may be restrained, or constrained by others, without encroachment upon the law of liberty, in the pursuance of other obediential obligations; as a husband has power to restrain his wife, from her liberty of going where she will, and may keep her within the bounds of conjugal society; so may parents restrain their children, and also constrain them to the performance of moral duties, and that without any engagement or law; we may also without any injury, restrain a furious person, or one who is inferring violence to himself, in his life or limbs, because this is not against any act of his lawful liberty, and is done as a duty in us of love and mercy: But in matters of utility and profit, where the natural liberty is not hemmed in with an obligation, there, unless by his own delinquence or consent, man cannot justly be restrained, much less constrained upon pretense of his utility or profit; for liberty, as far preferable to profit, and in the matter of utility, every man is left to his own choice, and cannot without injury to God and Man, be hindered to do what he pleases, or be compelled to do what he pleases not, in things wherein he is free, 6. Liberty may be diminished or taken away by our delinquence in the way of punishment, for seeing it is a right in our own power; as goods and debts may be forfaulted by our delinquence, so may our liberty, in whole or in part. 7. Thirdly, our engagements do commonly import a diminution of our personal liberty, but much more, of that natural liberty of things without us; whence it is that the law allows personal execution or restraint, and incarceration of the debitor’s person, until he do all the deeds that are in his power for the satisfaction of his Creditor. … 9. Fifthly, liberty is wholly taken off by bondage, slavery or servitude, which is diametrically opposite to liberty; for as liberty is that power by which men are sui juris [in his own power], so by servitude they became alieni juris, ‘in the power of another’… 10. Bondage was introduced by the law of nations, and it is among the positive laws of nations, settled by common consuetude [custom], and it took first place in these who were taken in war, who being under the power of their enemies’ sword, did lose their liberty in lieu [in place] of their life [instead of being killed]; such also were these who sold their liberty and gave it up, and were content to be perpetual slaves, as were the Jewish bondmen, whose ears were pierced with an aul [Ex. 21], as the solemnity of their perpetual and willing servitude, the offspring of servants remained in their servile condition… 11. Bondage, though contrair to the nature of liberty, yet it is lawful; liberty being a right alienable, and in our disposal, so that the natural law constitutes us free, but puts no necessity on us, so to continue; and therefore servitude is both approven in the Old Testament; and in the New, it is cleared against that obvious objection, that being made free by Christ, we should not become the servants of men, to which the Apostle answers, ‘Art thou called, being a servant (or slave)? continue so, for nevertheless thou art Christ’s freeman’ [1 Cor. 7]: But yet Christian lenity and mercy, has almost taken away bondage, except amongst the Spaniards, Portugals [who were Romanist] and other Christian nations bordering upon the Turks [Muslims], where, because the Turks do extremely exercise slavery, especially upon Christians, their neighbors do the like, that they may have slaves to exchange with slaves: little of slavery remains elsewhere among Christians, except the ascriptitii [naturalized foreigners], who are not absolutely slaves… but in Scotland there is no such thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dalrymple-stair.html">James Dalrymple Stair</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Institutions of the Law of Scotland, Deduced from its Originals, &amp; Collated with the Civil, Canon &amp; Feudal Laws, &amp; with the Customs of Neighboring Nations</cite>, ... (Edinburgh, 1681), Title 2, ‘Of Liberty’, p. 21</span></figcaption>

— James Dalrymple Stair, The Institutions of the Law of Scotland, Deduced from its Originals, &amp; Collated with the Civil, Canon &amp; Feudal Laws, &amp; with the Customs of Neighboring Nations... (Edinburgh, 1681), Title 2, ‘Of Liberty’, p. 21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+Liberty+is+that+natural+power+which+man+has+of+his+own+person%2C+whence+a+free+man+is+said+to+be+suae+potestatis%2C+%E2%80%98in+his+own+power%E2%80%99%2C+and+it+is+defined+in+the+law+to+be+a+natural+faculty+to+do+that+which+every+man+pleases%2C+unless+he+be+hindered+by+law+or+force.+%E2%80%A6+5.+Though+liberty+be+the+most+precious+right%2C+yet+it+is+not+absolute%2C+but+limited%3B+First%2C+by+the+Will+of+God%2C+and+our+obediential+obligations+to+Him%2C+and+to+men+by+his+ordinance%3B+and+so+though+man+has+power+of+his+own+person%2C+yet+has+he+no+power+of+his+own+life%2C+or+his+members%2C+to+dispose+of+them+at+his+pleasure%2C+either+by+taking+away+of+his+life+or+amputation%2C+or+hurting+of+any+member+by+himself%2C+or+by+giving+power+to+any+other+so+to+do%2C+unless+it+be+necessary+for+preserving+the+whole%2C+but+he+is+naturally+obliged+to+God+to+maintain+his+life%3A+So+likewise+men+may+be+restrained%2C+or+constrained+by+others%2C+without+encroachment+upon+the+law+of+liberty%2C+in+the+pursuance+of+other+obediential+obligations%3B+as+a+husband+has+power+to+restrain+his+wife%2C+from+her+liberty+of+going+where+she+will%2C+and+may+keep+her+within+the+bounds+of+conjugal+society%3B+so+may+parents+restrain+their+children%2C+and+also+constrain+them+to+the+performance+of+moral+duties%2C+and+that+without+any+engagement+or+law%3B+we+may+also+without+any+injury%2C+restrain+a+furious+person%2C+or+one+who+is+inferring+violence+to+himself%2C+in+his+life+or+limbs%2C+because+this+is+not+against+any+act+of+his+lawful+liberty%2C+and+is+done+as+a+duty+in+us+of+love+and+mercy%3A+But+in+matters+of+utility+and+profit%2C+where+the+natural+liberty+is+not+hemmed+in+with+an+obligation%2C+there%2C+unless+by+his+own+delinquence+or+consent%2C+man+cannot+justly+be+restrained%2C+much+less+constrained+upon+pretense+of+his+utility+or+profit%3B+for+liberty%2C+as+far+preferable+to+profit%2C+and+in+the+matter+of+utility%2C+every+man+is+left+to+his+own+choice%2C+and+cannot+without+injury+to+God+and+Man%2C+be+hindered+to+do+what+he+pleases%2C+or+be+compelled+to+do+what+he+pleases+not%2C+in+things+wherein+he+is+free%2C+6.+Liberty+may+be+diminished+or+taken+away+by+our+delinquence+in+the+way+of+punishment%2C+for+seeing+it+is+a+right+in+our+own+power%3B+as+goods+and+debts+may+be+forfaulted+by+our+delinquence%2C+so+may+our+liberty%2C+in+whole+or+in+part.+7.+Thirdly%2C+our+engagements+do+commonly+import+a+diminution+of+our+personal+liberty%2C+but+much+more%2C+of+that+natural+liberty+of+things+without+us%3B+whence+it+is+that+the+law+allows+personal+execution+or+restraint%2C+and+incarceration+of+the+debitor%E2%80%99s+person%2C+until+he+do+all+the+deeds+that+are+in+his+power+for+the+satisfaction+of+his+Creditor.+%E2%80%A6+9.+Fifthly%2C+liberty+is+wholly+taken+off+by+bondage%2C+slavery+or+servitude%2C+which+is+diametrically+opposite+to+liberty%3B+for+as+liberty+is+that+power+by+which+men+are+sui+juris+%5Bin+his+own+power%5D%2C+so+by+servitude+they+became+alieni+juris%2C+%E2%80%98in+the+power+of+another%E2%80%99%E2%80%A6+10.+Bondage+was+introduced+by+the+law+of+nations%2C+and+it+is+among+the+positive+laws+of+nations%2C+settled+by+common+consuetude+%5Bcustom%5D%2C+and+it+took+first+place+in+these+who+were+taken+in+war%2C+who+being+under+the+power+of+their+enemies%E2%80%99+sword%2C+did+lose+their+liberty+in+lieu+%5Bin+place%5D+of+their+life+%5Binstead+of+being+killed%5D%3B+such+also+were+these+who+sold+their+liberty+and+gave+it+up%2C+and+were+content+to+be+perpetual+slaves%2C+as+were+the+Jewish+bondmen%2C+whose+ears+were+pierced+with+an+aul+%5BEx.+21%5D%2C+as+the+solemnity+of+their+perpetual+and+willing+servitude%2C+the+offspring+of+servants+remained+in+their+servile+condition%E2%80%A6+11.+Bondage%2C+though+contrair+to+the+nature+of+liberty%2C+yet+it+is+lawful%3B+liberty+being+a+right+alienable%2C+and+in+our+disposal%2C+so+that+the+natural+law+constitutes+us+free%2C+but+puts+no+necessity+on+us%2C+so+to+continue%3B+and+therefore+servitude+is+both+approven+in+the+Old+Testament%3B+and+in+the+New%2C+it+is+cleared+against+that+obvious+objection%2C+that+being+made+free+by+Christ%2C+we+should+not+become+the+servants+of+men%2C+to+which+the+Apostle+answers%2C+%E2%80%98Art+thou+called%2C+being+a+servant+%28or+slave%29%3F+continue+so%2C+for+nevertheless+thou+art+Christ%E2%80%99s+freeman%E2%80%99+%5B1+Cor.+7%5D%3A+But+yet+Christian+lenity+and+mercy%2C+has+almost+taken+away+bondage%2C+except+amongst+the+Spaniards%2C+Portugals+%5Bwho+were+Romanist%5D+and+other+Christian+nations+bordering+upon+the+Turks+%5BMuslims%5D%2C+where%2C+because+the+Turks+do+extremely+exercise+slavery%2C+especially+upon+Christians%2C+their+neighbors+do+the+like%2C+that+they+may+have+slaves+to+exchange+with+slaves%3A+little+of+slavery+remains+elsewhere+among+Christians%2C+except+the+ascriptitii+%5Bnaturalized+foreigners%5D%2C+who+are+not+absolutely+slaves%E2%80%A6+but+in+Scotland+there+is+no+such+thing.%E2%80%9D%0A%0A%E2%80%94+James+Dalrymple+Stair%2C+The+Institutions+of+the+Law+of+Scotland%2C+Deduced+from+its+Originals%2C+%26+Collated+with+the+Civil%2C+Canon+%26+Feudal+Laws%2C+%26+with+the+Customs+of+Neighboring+Nations...+%28Edinburgh%2C+1681%29%2C+Title+2%2C+%E2%80%98Of+Liberty%E2%80%99%2C+p.+21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8ad5e62da7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8ad5e62da7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/slavery/#:~:text=1.%20Liberty%20is%20that%20natural%20power,Scotland%20there%20is%20no%20such%20thing&amp;text=1.%20Liberty%20is%20that%20natural%20power%20which%20man&amp;text=but%20in%20Scotland%20there%20is%20no%20such%20thing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But it is a question of more moment: How God promises a reward to these sons of Jonadab [who are Rechabites] for obeying the command of their [fore-]father [to dwell in tents and not drink wine], and whether they had sinned if they had not obeyed this command of Jonadab; which brings in another question: Whether parents have a power to oblige their children in matters which God has left at liberty? To which I answer: 1. God might reward these Rechabites for their reverence and obedience to Jonadab their father, though these were not strictly, by the Divine law, obliged thus far to have obeyed him; as He rewarded David for his thoughts in his heart to build him a house, though it was not God’s will that He should do it; so as God’s promise of the reward does not prove their obedience in this particular to have been their duty. Admit that it remained still a matter of liberty, yet the general honour and reverence they testified might be rewarded by God. 2. Unquestionably parents have not a power to determine children in all things as to which God has left them a liberty, for then they have a power to make their children slaves, and to take away all their natural liberty. To marry or not, and to this or that person, is [a] matter of liberty. Parents cannot in this case determine their children; Bethuel, Gen. 24:58, asks Rebekah if she would go with Abraham’s servant before he would send her. 3. In matters of civil concernment they have a far greater power than in matters of religion. All souls are God’s, and conscience can be under no other dominion than that of God. 4. In civil things parents have a great power, during the nonage of children, and after also in matters which concern their parents’ good, as to command them to assist them, to help to supply their necessities, etc. 5. Parents being set over children, and instead of God to them, as it is their duty to advise their children to the best of their ability for their good; so it is the duty of children to receive their advice, and not to depart from it, unless they see circumstances so mistaken by parents, or so altered by the providence of God, as they may reasonably judge their parents, had these known or foreseen it, would not have so advised. But that parents have an absolute power to determine children in all things as to which God has not forbidden them, and that children by the law of God are obliged to an obedience to all such commands, however they may see their parents mistaken, or God by his providence may have altered circumstances, I see no reason to conclude. Jonadab had prudently advised his sons as before mentioned; they were things they might do, and which by experience they found not hurtful to them, but of great profit and advantage, and that with reference to all the ends of man’s life: herein they yield obedience, and pay a reverence to their parent; this pleases God, He promises to reward them with the continuance of their family, according to what He had said, Ex. 20:12, in the Fifth Commandment, which the apostle calls the first commandment with promise.</p></blockquote>

<blockquote><p>2. Calvin thinks their vow not lawful. Bucanus, Polyander and Willet think it the lawful vow of the Nazarites, commanded [in] Num. 6. What then? if by God’s Law of the Nazarites, they abstained from wine and the Passover? God is above his own Law… 3. How prove ye, they abstained from the Passover? being so divine a law, might not their vow suffer an exception for a greater law in eating the Passover? I think it might, for in case of necessity they [the Rechabites] came and dwelt at Jerusalem for fear of the army of the Chaldeans, Jer. 35:11, and yet their vow was to dwell in tents.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-7e31ec594f" data-kw="">
<blockquote><p>St. Austin answering a question made unto him, why the gift of Tongues was ceased in the Church, and no man spake with that variety of Languages, which divers had in the Primitive times, wittily tells us, That every one may justly claim unto himself that miraculous gift of Tongues. For since the Church, which is the body of Christ, of which we are but members, is far and wide disperst over the earth, and is in sundry Nations, which use sundry Languages, every one of us, may well be said to speak with divers Tongues; because in that which is done by the whole, or by any part of it, every part may claim his share.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-hales.html">John Hales</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Omnipotency</cite>, in Golden remains, of the ever memorable Mr. John Hales, of Eaton-College, &amp;c. The second impression. With additions from the author’s own copy, viz., sermons &amp; miscellanies, also letters and expresses concerning the Synod of Dort (not before printed,) from an authentic hand (London: Robert Pawlet, 1673), pp 127-28.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4c849b76e2" data-kw="">
<blockquote><p>For these things [Mk. 16:17-20] are not absolutely and without exception, but in some respect the tokens of faith belonging to that primitive Church until the gospel were made more manifest. For miracles were as trumpets and open criers whereby the gospel was commended. For even as the law of Moses procured to itself credit, through the manifold miracles showed upon mount Sinai and in the wilderness, which afterward ceased when they were come to the land of promise: so in like manner miracles are now also taken away, seeing the gospel is spread throughout the world. And therefore the promise which Christ would have to be written in the gospel of Mark belonged not to all times; whereof it is not our part either to complain or find any fault, because that we hear that the Holy Ghost distributes to everyone as He will, who nevertheless, for great considerations Him moving, does not impart to all men gifts and graces alike. For if they should happen to all alike, they would soon grow out of estimation, whereas God has determined to make store of them. Moreover, He would that charity should grow and increase, which is then exercised when one man does help another, which thing would not have taken place if all men had been endued with like gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether it be lawful for the godly to desire miracles, and why there be none in this our age’ in ch. 9. ‘Of Miracles, &amp; the Definition &amp; Difference of Them’ in The Common Places</cite>, … (London: Henrie Denham et al., 1583), pt. 1, pp. 69-72, pp. 71-72</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>
<div class="actions"><button class="copy" data-copy="“For these things [Mk. 16:17-20] are not absolutely and without exception, but in some respect the tokens of faith belonging to that primitive Church until the gospel were made more manifest. For miracles were as trumpets and open criers whereby the gospel was commended. For even as the law of Moses procured to itself credit, through the manifold miracles showed upon mount Sinai and in the wilderness, which afterward ceased when they were come to the land of promise: so in like manner miracles are now also taken away, seeing the gospel is spread throughout the world. And therefore the promise which Christ would have to be written in the gospel of Mark belonged not to all times; whereof it is not our part either to complain or find any fault, because that we hear that the Holy Ghost distributes to everyone as He will, who nevertheless, for great considerations Him moving, does not impart to all men gifts and graces alike. For if they should happen to all alike, they would soon grow out of estimation, whereas God has determined to make store of them. Moreover, He would that charity should grow and increase, which is then exercised when one man does help another, which thing would not have taken place if all men had been endued with like gifts.”

</figure><figure class="quote" id="q-008711bfe9" data-kw="">
<blockquote><p>Thus a careful analysis of Gillespie’s wider thought brings Gillspie far more nearly into line with his cessationist colleagues at the Assembly than may have been supposed by recent scholars such as Berends. Nothing that Gillespie concludes necessarily separates him from the majority view of the Reformed orthodox. He appeals to the same texts which others applied earlier to immediately-inspired prophets, but these texts, as we have seen, can also be used to justify a later non-miraculous though otherwise analogous gift of the Holy Spirit, as John Own and other Westminster divines maintained. Neither does anything Gillespie says preclude an explanation like Rutherford’s of the Knoxian foretellers- namely that modern ‘prophets’ were applying Scripture principles to providential circumstances under the leading of the Holy Spirit. None of the Scottish commissioners, including Blair and Gillespie, therefore, needs to be understood as a proponent of a continuing immediate revelation. Indeed, there is insufficient evidence to allow that conclusion concerning any of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, ch. 5, ‘Whether these prophets and prophesyings in the primitive church, 1 Cor. 14; 12:28; eph. 4:11; were extraordinary and not so to continue; or whether they are precedents for the preaching or prophesying of such as are neither ordained ministers nor probationers for the ministry’ in A Treatise of Miscellany Questions | Garnet Milne, p. 247:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thus a careful analysis of Gillespie’s wider thought brings Gillspie far more nearly into line with his cessationist colleagues at the Assembly than may have been supposed by recent scholars such as Berends. Nothing that Gillespie concludes necessarily separates him from the majority view of the Reformed orthodox. He appeals to the same texts which others applied earlier to immediately-inspired prophets, but these texts, as we have seen, can also be used to justify a later non-miraculous though otherwise analogous gift of the Holy Spirit, as John Own and other Westminster divines maintained. Neither does anything Gillespie says preclude an explanation like Rutherford’s of the Knoxian foretellers- namely that modern ‘prophets’ were applying Scripture principles to providential circumstances under the leading of the Holy Spirit. None of the Scottish commissioners, including Blair and Gillespie, therefore, needs to be understood as a proponent of a continuing immediate revelation. Indeed, there is insufficient evidence to allow that conclusion concerning any of them.”

</figure><figure class="quote" id="q-e2b79a5551" data-kw="">
<blockquote><p>In former times those who accepted the divine preaching and who were baptized for their salvation were given visible signs of the grace of the Holy Spirit at work in them. Some spoke in tongues which they did not know and which nobody had taught them, while others performed miracles or prophesied. These Corinthians also did these things, but they did not use the gifts as they should have done. They were more interested in showing off than in using them for the edification of the church… Even in our time grace is given to those who are deemed worthy of holy baptism, but it may not take the same form as it did in those days.</p></blockquote>

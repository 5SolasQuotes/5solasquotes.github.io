<blockquote><p>The Revelation of St. John.

The Ecclesiastical history shows how John, being under the Emperor Domitian, was banished into the Hand of Patmos, &amp; there wrote this Apocalypse, or Revelation. And again, after the death of Domitian, when he returned from the Ile of Patmos to Ephesus, to have written his Gospel against the Heretics, Marcion, Ebon, and Cerunhus.

This book under the name of Revelation, contains prophesy, concerning event, fortune, matters, and of the derived church: that is to say, the church derived from the Primitive church, and thence to be derived unto the end of the world.

It may very well be divided.

1 Into Seals.

2 Into Trumpets.

3 Into Vials.

The 7. seals signify the persecution of the church, which is under Tyrants: to wit, Domitian, Traianus, &amp;c. which truly began in the primitive church, in the time of the Apostles and continued thence the space of 300 years, unto the time of Constantine, &amp; it is described in this book chap. 4, 5, 6, 7.

The Trumpets signify heresies, as the Arians, &amp;c. From the time of Constantine vnto Theodosius, for other 300. years, yea unto Mahomet and the pope. This is described, chap. 8 unto 18.

The Vials, signify the plagues of Antichrist for these 900 years, from the time of Boniface the pope unto this our time, of the which thou may read from the 17. chap, unto the end of the book.

It may otherwise be divided: to wit, into seven visions: that is to say, into figures, most wonderfully showing to the mind and eyes of all men.

The first vision of the seven churches of Asia the less.

The second vision, concerning Christ &amp; his church being exalted.

The third vision concerning the diligence of the disciples of Christ.

The fourth concerning the affliction of the church.

The fifth concerning the last persecution under Antichrist.

The sixth concerning the day of judgement.

The seventh, concerning the victory of Christ and the church.

Briefly, he describes.

1 The Kingdom of Christ.

2 The comfort of the godly afflicted

3 The Threats of Tyrants.

4 The priesthood of Christ.

5 The Prayers of the Saints.

6 The Histories of the new Testament is revealed.

The chapters are thus to be discerned.

From the 1. chap. unto the 4. chap. is the preface, in which first of all it containeth the commendation of these revelations from the efficient cause: to wit, from God. Then it containeth the admonition to the seven bishops of the Churches of Asia the less, which he calls Angels, Candlesticks, stars, &amp;c. For the ministry of the word.

From the fourth chapter, unto the 8. is the first part of the book with the 7. seals. Where first he would have to be understood by Elders, the Prophets. Secondly, by beasts, the Evangelists. 3 By birds, Doctrine. 4 By the Lamb, Christ himself. 5. By Angels, the ministers of the word. 6 By Seals, Persecutions. 7 by Horses, Tyrants. 8. by sealed the elect, the Jews. 9 by the multitude, the elect of the Gentiles, 10 by the book, the ministry of Revelations.

From the 8. chapter unto the 15. chapter is the second part of the book of Trumpets: by which he understandeth Heresies. 2. by stars, Heretics. 3 By the angel, the ministry of the word. 4. by the the Gospel. 5 By the measuring of the Temple, Religion. 6 By the holy City, the Church. 7 By the two witnesses, the Prophets and Apostles. 8 By the woman, the Church. 9. By the 12. stars, the 12. Tribes. 10 By the wars, the preaching of the Gospel. 11 by Michael, Christ Jesus. 12 By the Beasts, the Roman Monarchy. 13 By the lamb, Christ. 14 By the voice of thundering, the word of the Gospel. 15 By the new Song, the Gospel. 16 By the women, Idolatry 17 By Virgins, sincere Christians.

From the 16, unto the end is the third part of this book. First, by the beasts, he would understand the Roman Monarchy. 2 By the Harlot, the Idolatry of Antichrist. 3 By the golden people, hypocrisy. 4. By Characters, a perfect sign of Antichrist. 5 By vials, the plagues of Antichrist. 6 By the marriage of the lamb the humanity of Christ. 7 By the name written, the Divinity of Christ. 8 By new heaven and new earth, the Image of everlasting life. To the which place he shall bring us, who hath signed this his holy scriptures with his own precious blood, even Jesus Christ our Lord, who with the Father and the holy Ghost, be praised for ever and ever. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peder-palladius.html">Peder Palladius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An introduction into the books of the prophets and apostles. Written by Peter Palladius, Doctor of Divinity and Bishop of Rochil</cite>, trans. Edward Vaughan (London: William Holme, 1598), unpaginated.</span></figcaption>

<blockquote><p>…ever since the Reformation, it has been a particular controversy between the Romanists and us, whether ecclesiastical laws oblige the conscience, in other cases besides those of contempt and scandal. The Church of Rome has declared for the affirmative; and Protestant authors, as well Lutherans as Calvinists, for the negative. If any question this, let them give themselves the trouble of reading Bellarmine De Bonis Operibus [Of Good Works], particularly book 2, ch. 7 [‘Ecclesiastical Law Obliges the Faithful in Conscience…’], and the Brothers of Valemborch, tome 1, p. 183; tome 2, p. 187, among the papists; and among those of our communion, the supplement to Chamier, p. 375; Rivet’s Summary of Controversies [in French], tract 2, question 9 [‘Whether the Church may Make Laws?’]; [Jean] Mestrezat, Of the Church, Theses of Salmur, tome 1, disputation 1 [‘Whether Conscience to the Faith is Prior to that of the Church, or that to the Church is Prior to that of the Faith?’]. But this is not all, the Confession of Faith, published by the Reformed Churches of France, is express to the same purpose; see Article 33. So that if I have gone too far in this respect, I have all the Protestant Churches for my vouchers.</p></blockquote>

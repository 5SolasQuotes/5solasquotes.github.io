<blockquote><p>If the changeable [being] is taken strictly [see p. 11], there must be a subject of the change that is relatively permanent; therefore there is something else that is absolutely and independently permanent (from conclusion 2…); therefore there is something that is in itself unchangeable. If the changeable is taken in a broad sense then either it always existed thus or it did not; if it did not it is transient, and then too the unchangeable must exist. If the changeable always existed thus in fact, nevertheless it could not be altogether independent with respect to its persistence, for otherwise it would not be changeable in the broad sense. Therefore it would be dependent as to its persisting; therefore it would, like the relatively persistent, require a first independent thing existing simultaneously that is unchangeable also in the broad sense.” p. 37 12. An eternal being actually exists, or something actually existing is eternal. 13. An unchangeable being actually exists, or something actually existing is unchangeable. 14. Therefore being is divided into temporal and eternal (from conclusions 8, 9, and 10). 15. Therefore being is divided into unchangeable and changeable. If changeable is taken broadly [see p. 11], this conclusion follows from conclusions 8, 9, and 13. If it is taken strictly the existence of the unchangeable follows from what was said above about constant elements of our experience [see p. 33]. The existence of the unchangeable follows from conclusion 13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-wolter.html">Allan Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Allan Wolter’s Conclusions respecting Reality, Proving God’, ‘Conclusions respecting Reality’ | 11. If there is something changeable there is something unchangeable.</cite></span></figcaption>

</figure><figure class="quote" id="q-81fb419190" data-kw="">
<blockquote><p>We should not immediately reject a doctrine, or even doubt it, just for the sake of mental exercise… Problem 1. In order to do theology freely and skillfully, should we clear our minds of all preconceptions to the point that we doubt everything we have learned through diligent study, meditation, and the teaching of our instructors, and treat it all as false (even if it is not), until the truth is inscribed anew on our minds like a blank slate, after proper and methodical inquiry and demonstration based on certain principles? Answer: No. The Remonstrants wanted the National Synod to revise the Confession and Catechism, and they wanted the Synod members to be released from affirming the Belgic Catechism and Confession in the meantime, supposedly so they would not be hindered by any preconceptions in perceiving and judging the truth. Therefore, should we have temporarily suspended our agreement with, belief in, and profession of the truths attested by our affirmation (e.g., in articles 1 and 2 of the Confession)? Therefore, should the Reformed Synod have re-examined and investigated the article or thesis ‘That there is a God?’ I ask the same about the truths and theses of natural theology or philosophy concerning God, his attributes and works, providence, the distinction between moral good and evil, the honorable and the base, etc. I ask the same about the basic catechetical elements instilled and proven from God’s word in infancy, childhood, and adolescence, before someone devoted himself to theological studies in an academic program.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation On the Ways of Knowing God’, pt. 2 tr. Michael Lynch (1665; 2024) at Translationes Lyncei</cite></span></figcaption>

<blockquote><p>We can distinguish between adequate and inadequate distinction. The first is if the things said to be distinct are as it were equal or equivalent, as is the case with all the distinctions above adduced. A distinction is inadequate if the distinct things are not equal, so that one includes the other but not conversely. Such inadequate distinctions flourish, for example, between the whole and its part, or between a subject and its mode, for a mode includes the subject it modifies and the whole includes its parts. These sort of inadequate distinctions, as is plain, can be real (for example between the human body and an arm), or formal (for example between soul and intellect, between animality and sense feeling, between formality and its mode, as between divine wisdom and the same thing’s infinity), or logical (for instance between the rays of the sun and their power of heating). Also here can be added real negative distinctions, which flourish not between thing and thing but between a thing and a negation of it (for example between man and blindness).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alan-b-wolter.html">Alan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958), ch. 2, On the Attributes in General &amp; on ‘One”, Article 4, ‘On Identity &amp; Distinction’</cite>, p. 32</span></figcaption>

<blockquote><p>The purpose of this paper is to explain Descartes’ views on Metaphysics. It is my thesis that one of the ways in which he influenced not only modern philosophy, but the way in which we do philosophy even today, is by turning metaphysical inquiry into an epistemological enterprise. That is to say, he made the critique of knowledge necessary prior to any consideration of existence, and what may or may not have it… I will attempt to show that Descartes’ view of Metaphysics, in spite of the fact that he used familiar scholastic metaphysical terminology, actually turned Metaphysics into what is today termed Epistemology. Descartes, not Kant, was the first to perform a true critique of knowledge, and to make that critique a necessary preliminary to all questions about what exists outside our minds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-haines.html">David Haines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Descartes &amp; Epistemological Metaphysics’</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-ec738a4a8b" data-kw="authority">
<blockquote><p>The authority of Scripture (concerning which we here inquire) is nothing else than the right and dignity of the sacred books, on account of which they are most worthy of faith with regard to those things which they propose to be believed and of our obedience in those things which they command us to omit or to do. The divine and infallible truth of these books (which have God for their author) is the foundation because he has the highest right to bind men to faith and duty. But this truth may be either intrinsic or extrinsic. The former is the credibility (axiopistia) in itself of the word which is always equal and consistent with itself, whether it has the testimony of men or not. The latter is the estimation or judgment of men in relation to the Scriptures, which is different as the subjects are different. Of history and of rule.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.4.3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9a322881b2" data-kw="">
<blockquote><p>As readers of the New Testament, we know that to the men of the New Testament &quot;the Scriptures&quot; were the Word of God which could not be broken, i. e. whose every word was trustworthy; and that a simple &quot;It is written&quot; was therefore to them the end of all strife.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/b-b-warfield.html">B. B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Inspiration and Authority of the Bible</cite>, ch. II, &quot;The Church Doctrine of Inspiration&quot;</span></figcaption>

</figure><figure class="quote" id="q-8203363a8d" data-kw="">
<blockquote><p>It is not by Romanists only that it is denied, practically at least, if not theoretically. Nothing is more common among Protestants, especially in our day, than the attempt to coerce the conscience of men by public opinion; to make the opinions of men on questions of morals a rule of duty for the people, and even for the Church. If we would stand fast in the liberty wherewith Christ has made us free, we must adhere to the principle that in matters of religion and morals the Scriptures alone have authority to bind the conscience.</p></blockquote>

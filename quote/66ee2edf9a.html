<blockquote><p>Aquinas’s own view of the matter is worth noting, however, since it touches on a deep difficulty in the philosophy of beauty. Aquinas regarded truth, goodness and unity as ‘transcendentals’—features of reality possessed by all things, since they are aspects of being, ways in which the supreme gift of being is made manifest to the understanding. His views on beauty are more implied than stated; nevertheless he wrote as though beauty too is such a transcendental (which is one way of explaining the point already made, that beauty belongs to every category). He also thought that beauty and goodness are, in the end, identical, being separate ways in which a single positive reality is rationally apprehended.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/roger-scruton.html">Roger Scruton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beauty: a Very Short Introduction Pre</cite>, (Oxford University Press, 2011), pp. 3-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-51c1107dad" data-kw="">
<blockquote><p>First in general; It is demanded how a man should and ought to forgive an injury? Answer: In forgiveness there be four things: The first is forgiveness of revenge, that is of requiting evil for evil, either by thought word or deed. This must always be practiced. For vengeance is not ours, but the Lord’s, and great reason then that we should ever-more forgive in regard of revenge and hatred. This the apostle teaches, when he says, 1 Cor. 13:5, Love is not provoked, it never thinks, much less speaks or does, evil. The second is forgiveness of private punishment; which is, when men return punishment for injuries done in way of requital; and this must always take place with us, because as vengeance itself, so also punishment in way of revenge is God’s alone. The third is, forgiveness of judgment, when we judge an injury done to be an injury. This judgment we are not bound to forgive unto men. For we may with good conscience judge a sin and a wrong to be as they are. And yet notwithstanding, if a man make satisfaction for the wrong done, then there ought to be forgiveness, even in regard of judgement. The fourth is forgiveness of satisfaction. This we are not alway[s] bound to remit, but we may with good conscience, alway[s] require satisfaction where hurt is done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Treatise of the Cases of Conscience</cite>, … (Legat: Univ. of Cambridge, 1606), bk. 3, ch. 3, question 1, ‘How may a man carry himself in respect of injuries and offences done unto him?’, pp. 492-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

1107dad.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/51c1107dad.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-forgiveness/#:~:text=First%20in%20general%3B%20It%20is%20demanded,require%20satisfaction%20where%20hurt%20is%20done&amp;text=First%20in%20general%3B%20It%20is%20demanded%20how%20a&amp;text=conscience%2C%20alway%5Bs%5D%20require%20satisfaction%20where%20hurt%20is%20done" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But people evaluate things also according to the standard of beauty and ugliness… But the beautiful is nevertheless essentially distinct from the pleasant. People do not argue about what is pleasant. One person finds this food and that drink enjoyable, but another does not. People are comfortable with this and do not argue about these differences. However, in connection with what is beautiful, people tend not to be satisfied with the notion that something attracts one person but not another; people attempt to account for beauty to themselves and others and attempt, as it were, to demonstrate why something is attractive. People proceed from the notion that what is genuinely beautiful should be attractive to everyone, given sufficient enlightenment and education.</p></blockquote>

</figure><figure class="quote" id="q-2e809cbdf1" data-kw="">
<blockquote><p>But because there is no hope that most should be judicious, there is no other remedy for such but this of Christ’s prescript which I have here set down: First, happy is he that chooses a judicious faithful guide and learns of him till his own understanding be better illuminated; and that escapes the conduct of ignorant, erroneous, self-seeking, proud, dividing teachers. Secondly, continue in the communion of the generality of agreeing Christians: The generality of the godly are more unlikely to be forsaken of Christ than a few odd self-conceited singular professors. This is the way of peace to yourselves and to the Church of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 40, ‘Labour for a sound judgment to know good from evil, lest you trouble yourselves and others by mistakes: And till you grow so judicious, forsake not the guidance of a judicious teacher, nor the company of the agreeing generality of the Godly’, pp. 212-13</span></figcaption>

d it online · Reformed Books Online</a></div>

<blockquote><p>Further, if people are thus unjustly charged, it may be some comfort to consider the best of Christ’s servants have been thus accused, as appears from what the apostle says, 2 Cor. 1:17-18, when it seems such as turned his enemies in that Church had charged him with lightness and changeableness in his doctrine and principles, as well as in his purposes, where, for his own vindication, he is obliged to use a sort of solemn oath, saying, ‘But as God is true, our word,’ or preaching, ‘toward you was not yea and nay.’ And Durham on Scandal (p. 176) instances this as one of the ways whereby the Devil carries on division in the Church, viz. by making people charge ministers with ‘lightness’ and ‘changeableness,’ as if they were of one mind this year and of another the next. As formerly I endeavored to contribute my mite in opposing what I judged amiss in the Church of Scotland, so, through grace, I hope to continue and cannot see a shadow of reason to imagine but it is as acceptable to God, and much more acceptable to Him to oppose what may be amiss in her conduct, in a way of Church-communion, as in a separate state, ‘Separation’ (as the Protesters say) ‘being highly impedimental to reformation.’ (Rep. to Ass., 1652) I know every Christian, and ministers of the Gospel, in a special manner, ought to be very cautious, guarding against giving offense to any of Christ’s little ones, but if they will take offense at doing what is plain present duty, though they are to be pitied and used tenderly, yet they are not to be regarded so as to omit duty for fear they take offense. When the great apostle of the gentiles opposed Peter, and other saints, who pretending greater strictness, did separate from the gentile converts, he knew his conduct in that would offend many who were dear unto the Lord; yet he regarded not their offense, but ‘withstood Peter to the face, because he was to be blamed.’ (Gal. 2:11-14) Our Lord Jesus knew his healing and curing diseased persons on the Sabbath would occasion such as watched him (Mk. 3:2) to take offense; He also knew his familiar converse with publicans and sinners would be stumbling and offensive to sundry; yet he would not forbear it. Sometimes we are called to deny ourselves as to our ease, conveniency, pleasure and satisfaction rather than occasion the offending of such as causelessly take offense, but, according to our Lord’s example, commanded present duty is to be done, let never so many stumble or be offended. Hence [Matthew] Henry says (on Mk. 2:16), ‘Those are too tender of their own good name who, to preserve it with some nice people, will decline a good work; Christ would not do so.’ And tender Christians, who may be ready to take offense, ought to consider what danger there is in being ‘righteous over much.’ If the prophetess Miriam, or Aaron, the saint of God, speak against Moses, his Lord will resent it, asking ‘Wherefore were ye not afraid to speak against my servant Moses?’ (Num. 12:8) Now, for doing what, in my opinion, is plain present duty in this case, viz. the opposing what I take to be sinful schism, though I should further suffer in my reputation from some, yet ’tis some satisfaction to think in this I’m far from being singular; for here I suffer with a cloud of faithful witnesses, as…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Real Reformation-Principles of the Church of Scotland concerning Separation, etc</cite>, .... (Edinburgh: A. Alison, 1740), To the Reader, pp. viii-ix</span></figcaption>

— John Currie, A Vindication of the Real Reformation-Principles of the Church of Scotland concerning Separation, etc.... (Edinburgh: A. Alison, 1740), To the Reader, pp. viii-ix">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFurther%2C+if+people+are+thus+unjustly+charged%2C+it+may+be+some+comfort+to+consider+the+best+of+Christ%E2%80%99s+servants+have+been+thus+accused%2C+as+appears+from+what+the+apostle+says%2C+2+Cor.+1%3A17-18%2C+when+it+seems+such+as+turned+his+enemies+in+that+Church+had+charged+him+with+lightness+and+changeableness+in+his+doctrine+and+principles%2C+as+well+as+in+his+purposes%2C+where%2C+for+his+own+vindication%2C+he+is+obliged+to+use+a+sort+of+solemn+oath%2C+saying%2C+%E2%80%98But+as+God+is+true%2C+our+word%2C%E2%80%99+or+preaching%2C+%E2%80%98toward+you+was+not+yea+and+nay.%E2%80%99+And+Durham+on+Scandal+%28p.+176%29+instances+this+as+one+of+the+ways+whereby+the+Devil+carries+on+division+in+the+Church%2C+viz.+by+making+people+charge+ministers+with+%E2%80%98lightness%E2%80%99+and+%E2%80%98changeableness%2C%E2%80%99+as+if+they+were+of+one+mind+this+year+and+of+another+the+next.+As+formerly+I+endeavored+to+contribute+my+mite+in+opposing+what+I+judged+amiss+in+the+Church+of+Scotland%2C+so%2C+through+grace%2C+I+hope+to+continue+and+cannot+see+a+shadow+of+reason+to+imagine+but+it+is+as+acceptable+to+God%2C+and+much+more+acceptable+to+Him+to+oppose+what+may+be+amiss+in+her+conduct%2C+in+a+way+of+Church-communion%2C+as+in+a+separate+state%2C+%E2%80%98Separation%E2%80%99+%28as+the+Protesters+say%29+%E2%80%98being+highly+impedimental+to+reformation.%E2%80%99+%28Rep.+to+Ass.%2C+1652%29+I+know+every+Christian%2C+and+ministers+of+the+Gospel%2C+in+a+special+manner%2C+ought+to+be+very+cautious%2C+guarding+against+giving+offense+to+any+of+Christ%E2%80%99s+little+ones%2C+but+if+they+will+take+offense+at+doing+what+is+plain+present+duty%2C+though+they+are+to+be+pitied+and+used+tenderly%2C+yet+they+are+not+to+be+regarded+so+as+to+omit mation-Principles+of+the+Church+of+Scotland+concerning+Separation%2C+etc....+%28Edinburgh%3A+A.+Alison%2C+1740%29%2C+To+the+Reader%2C+pp.+viii-ix&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F645fa28869.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/645fa28869.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-scandal/#:~:text=Further%2C%20if%20people%20are%20thus%20unjustly,a%20cloud%20of%20faithful%20witnesses%2C%20as&amp;text=Further%2C%20if%20people%20are%20thus%20unjustly%20charged%2C%20it&amp;text=suffer%20with%20a%20cloud%20of%20faithful%20witnesses%2C%20as" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

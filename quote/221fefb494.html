<blockquote><p>TO ALL THOSE WHO LOVE THE LORD JESUS CHRIST IN SINCERITY, AND Sincerely associated themselves in the bond of this holy COVENANT when this Sermon was preached; THE AUTHOR, Their unworthy, yet willing servant, in this or any other work of the Lord, Humbly presents this Sermon Printed:

Heartily beseeching God, our God, the great, the mighty, and the terrible GOD, who keepeth Covenant for ever, TO Strengthen us all, in performing all the duties, which we have promised in this Covenant.

TO Fill us and these Kingdoms, with all the blessings, which this Covenant promiseth, To the glory of his own most holy name, the advancement of the Gospel, in Peace and Truth, as the gracious return of our present labours, and prayers, and the portion of our posterity; that the children which are yet unborn may bless us, and bless God for us.</p></blockquote>

<blockquote><p>But you will say: ‘England is not a true Church, and therefore you separate; adhere to the true Church.’ I answer: Our Church is easily proved to be a true Church of Christ: First, because it has all the essentials necessary to the constitution of a true Church: as sound preaching of the gospel, right dispensation of the sacraments, prayer religiously performed, and evil persons justly punished (though not in that measure as some criminals and malefactors deserve); and therefore a true Church. … But I hear you reply: ‘Our Church is corrupted with ceremonies and pestered with profane persons. What then?’ Must we therefore separate for ceremonies, which many think may be lawfully used? But admit they be evils, must we make a rent in the Church for ceremonious rites, for circumstantial evils? That were a remedy worse than the disease. Besides, had not all the true Churches of Christ their blemishes and deformities, as you may see in the seven Asian Churches (Rev. 2–3)? And though you may find some Churches beyond sea free from ceremonies, yet notwithstanding they are more corrupt in preachers (which is the main), as in profanation of the Lord’s Day, etc.</p></blockquote>

<blockquote><p>Now if it could be made plain to the divided Protestant Churches, that indeed the causes of their divisions are extra-fundamental, it may be truly and hopefully concluded that for conscience sake towards God and for their mutual edification and preservation against the encroaching power of darkness, they would be moved to leave off passionate disputations and laying aside the causes of their separation to compose their differences in brotherly love.</p></blockquote>

<blockquote><p>The word Church signifies the whole body of the faithful, whether in heaven or on earth, who have been or shall be spiritually united to Christ as their Saviour.

There are many examples in Scripture of the use of the term in this wide sense. The first occasion on which the word occurs in the New Testament is one of these, when our Lord declares that “the gates of hell shall not prevail against His Church,”— language which plainly refers to the society or association of all those who had believed or should believe in Him.

All history proves that particular and local Churches may fall away from the faith into complete and final apostasy. The promise of our Lord can apply to no special community except the universal Church of Christ, invisible to human eye, and known only to His, consisting of all true believers, and of none else. Again, in the Epistle to the Ephesians, we are told that Christ “loved the Church, and gave Himself for it, that He might sanctify and cleanse it with the washing of water by the Word, that He might present it to Himself a glorious Church, not having spot or wrinkle, or any such thing, but that it should be holy and without blemish.”

That society of men for whom Christ died, and who shall, each one of them, be presented at last holy and without spot before God, is plainly a society the members of which no man can number or declare by any external mark; which can be restricted to no geographical locality, and can be recognised by no features visible to the outward eye. It is the society of the elect, and not identical with any outward Church or Churches of whatsoever name. It is the spiritual and invisible Church of the Redeemer, known only to Himself, of which Scripture thus speaks; and in entire accordance with this use of the term Church in Scripture to denote a society comprehending the whole body of the elect, and none else, are other names or titles given to it in the New Testament.

The Church is at one time spoken of under the mysterious name of the Bride or Spouse of Christ,”—an expression which can apply to no local or particular Church—to no society, indeed, at all, measured and recognised by the eye of man under any form, or under all forms, of Christian profession,–but must be intended to mark out those, and those only, who have been espoused to Christ through the holy union of His Spirit with theirs. At another time it is spoken of as “the temple of the Holy Ghost,” “a spiritual house,” “an habitation of God through the Spirit,” —language plainly designed to mark out a society defined by no outward limits, but identical with the whole number of spiritual Christians of whatsoever society throughout the world, who have been quickened by the Spirit.

And, finally, the Church is described as “the body of Christ,” all the members of which are united to Him as the Head of life and influence and grace to them,”—a description not applicable to any outward body of professing Christians made up of any or all communions, but only to be realized in that great multitude which no man has seen or numbered, who make up the invisible Church of the Redeemer, and whose names are written in heaven.

In these passages, and in many others, we have a society defined and described, which embraces the whole number of Christ’s elect, and none but they, a society not identical with any known on earth, and not to be recognised by any local names or notes or boundaries, a society marked out from any other by the possession of certain high and mysterious privileges, and standing in a very close and peculiar relation to Christ, but unseen and unknown of man, — a society whose members are unreckoned and unobserved on earth, but all of whom are numbered and known in heaven.

Such is the invisible Church of the Redeemer. “The catholic or universal Church,” says the Confession of Faith, “which is invisible, consists of the whole number of the elect that have been or shall be gathered into one under Christ, the Head thereof; and is the spouse, the body, the fullness of Him that filleth all in all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, ed. D. Douglas Bannerman (2 vols, Edinburgh: T &amp; T Clark, 1868), 1: 6-8.</span></figcaption>

whatsoever+name.+It+is+the+spiritual+and+invisible+Church+of+the+Redeemer%2C+known+only+to+Himself%2C+of+which+Scripture+thus+speaks%3B+and+in+entire+accordance+with+this+use+of+the+term+Church+in+Scripture+to+denote+a+society+comprehending+the+whole+body+of+the+elect%2C+and+none+else%2C+are+other+names+or+titles+given+to+it+in+the+New+Testament.%0A%0AThe+Church+is+at+one+time+spoken+of+under+the+mysterious+name+of+the+Bride+or+Spouse+of+Christ%2C%E2%80%9D%E2%80%94an+expression+which+can+apply+to+no+local+or+particular+Church%E2%80%94to+no+society%2C+indeed%2C+at+all%2C+measured+and+recognised+by+the+eye+of+man+under+any+form%2C+or+under+all+forms%2C+of+Christian+profession%2C%E2%80%93but+must+be+intended+to+mark+out+those%2C+and+those+only%2C+who+have+been+espoused+to+Christ+through+the+holy+union+of+His+Spirit+with+theirs.+At+another+time+it+is+spoken+of+as+%E2%80%9Cthe+temple+of+the+Holy+Ghost%2C%E2%80%9D+%E2%80%9Ca+spiritual+house%2C%E2%80%9D+%E2%80%9Can+habitation+of+God+through+the+Spirit%2C%E2%80%9D+%E2%80%94language+plainly+designed+to+mark+out+a+society+defined+by+no+outward+limits%2C+but+identical+with+the+whole+number+of+spiritual+Christians+of+whatsoever+society+throughout+the+world%2C+who+have+been+quickened+by+the+Spirit.%0A%0AAnd%2C+finally%2C+the+Church+is+described+as+%E2%80%9Cthe+body+of+Christ%2C%E2%80%9D+all+the+members+of+which+are+united+to+Him+as+the+Head+of+life+and+influence+and+grace+to+them%2C%E2%80%9D%E2%80%94a+description+not+applicable+to+any+outward+body+of+professing+Christians+made+up+of+any+or+all+communions%2C+but+only+to+be+realized+in+that+great+multitude+which+no+man+has+seen+or+numbered%2C+who+make+up+the+invisible+Church+of+the+Redeemer%2C+and+whose+names+are+written+in+heaven.%0A%0AIn+these+passages%2C+and+in+many+others%2C+we+have+a+society+defined+and+described%2C+which+embraces+the+whole+number+of+Christ%E2%80%99s+elect%2C+and+none+but+they%2C+a+society+not+identical+with+any+known+on+earth%2C+and+not+to+be+recognised+by+any+local+names+or+notes+or+boundaries%2C+a+society+marked+out+from+any+other+by+the+possession+of+certain+high+and+mysterious+privileges%2C+and+standing+in+a+very+close+and+peculiar+relation+to+Christ%2C+but+unseen+and+unknown+of+man%2C+%E2%80%94+a+society+whose+members+are+unreckoned+and+unobserved+on+earth%2C+but+all+of+whom+are+numbered+and+known+in+heaven.%0A%0ASuch+is+the+invisible+Church+of+the+Redeemer.+%E2%80%9CThe+catholic+or+universal+Church%2C%E2%80%9D+says+the+Confession+of+Faith%2C+%E2%80%9Cwhich+is+invisible%2C+consists+of+the+whole+number+of+the+elect+that+have+been+or+shall+be+gathered+into+one+under+Christ%2C+the+Head+thereof%3B+and+is+the+spouse%2C+the+body%2C+the+fullness+of+Him+that+filleth+all+in+all.%E2%80%9D%0A%0A%E2%80%94+James+Bannerman%2C+The+Church+of+Christ%3A+A+Treatise+on+the+Nature%2C+Powers%2C+Ordinances%2C+Discipline%2C+and+Government+of+the+Christian+Church%2C+ed.+D.+Douglas+Bannerman+%282+vols%2C+Edinburgh%3A+T+%26+T+Clark%2C+1868%29%2C+1%3A+6-8.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9af8503b77.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9af8503b77.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/08/18/james-bannerman-on-the-catholic-church-of-the-elect/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-8d117e14bb" data-kw="">
<blockquote><p>Although we recognize in Christ a twofold union, one personal (of the two natures, the divine and human in one person), the other natural (of the soul and body in the one human nature)… These two unions differ from each other… (4) in their adjuncts, because that [union of body and soul] is separable and was dissolved by the death of Christ, while this [the personal union] is inseparable–what the Logos (Logos) has once assumed he never laid aside.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes… (P&amp;R), vol. 3, 13th Topic, ‘Person &amp; State of Christ’, 6th Question, ‘Did the Son of God assume human nature into the unity of his person?’, section 9</cite>, pp. 312-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-8e584628e5" data-kw="">
<blockquote><p>On two occasions we are told that Jesus felt that occurrences which he witnessed were extraordinary and experienced the appropriate emotion of “wonder” regarding them (Mt. viii. l0; Lk. vii 9; Mk. vi. 6).¹ ¹ [Greek] Thaumazo: see Schmidt, Synonymik etc., iv. §165, pp. 184sq.: “it is perfectly generally ‘to wonder’ or ‘to admire’, and is distinguished from thambein precisely as the German sich wundern, or hewundern is from staunen: that is, what has seized on us in the case of thaumazein is the extraordinary nature of the thing while in the case of thambain it is the unexpectedness and suddenness of the occurrence.” Cf. Art. “Amazement” in Hasting’s DCG. I, pp. 47, 48.</p></blockquote>

<blockquote><p>‘This hour’. Among all the hours that Christ had, this was the saddest: 1. Christ saw that his life in this hour would be taken from Him; it was convenient that Christ, who was a man, like us in all things except sin, should not be a stock in dying; but have actual pain and sense in the losing of his life, for Christ had as much nature, though no corruption, as any man; and life is a sweet inheritance, it’s nature’s excellent free-hold, and no man is willingly, and without one sigh or tear cast out of this free-hold, and Christ’s nature was not brass or iron. Sorrow and sadness found a kindly lodging in Him. . Sorrow Bible Verse Mt. 26:37-38 “And he took with Him Peter and the two sons of Zebedee, and began to be sorrowful and very heavy. Then saith He unto them, ‘My soul is exceeding sorrowful, even unto death…&#x27;</p></blockquote>

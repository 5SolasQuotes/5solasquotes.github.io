</figure><figure class="quote" id="q-4211d83ec0" data-kw="">
<blockquote><p>5. God calls upon sinners to turn to Him by the internal voice and motions of His Spirit… There is a twofold call of the Spirit: more common and more special. 1. More common, and so many are called which never are thoroughly converted. It was the common work of the Spirit which made Felix tremble, which brought Agrippa within a step of Christianity and caused Herod to do many things. Multitudes of unregenerate ones have felt the waters stirred, the Holy Ghost moving them to conversion, and have readily proffered His aid and assistance, and perhaps, for awhile, they have been led by Him. But then they have refused to let go of some lust or vanity which He has bid them abandon. They would not turn their spiritual sloth into serious diligence about the concerns of their immortal souls, and so by disregarding His motions, and by slighting His help, they have made the Spirit to go away in grief who came in love to work upon them. 2. There is a call of the Spirit which is more special and efficacious…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Conversion of a Sinner, Explained and Applied, a sermon on Eze. 33:11</cite>, 1669, in The Puritans on Conversion (Soli Deo Gloria, 1990), pp. 105-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

<blockquote><p>[Ralph] Erskine’s comparison of mental idolatry with mental adultery suggests some important clues. A man cannot always avoid seeing a beautiful woman or being attracted to her. Mental adultery does not consist in physical sight, but in cultivating the mental image of that woman for the purpose of sexual stimulation. In the same way, it is possible to walk past a portrait of Christ in a museum without yielding to any temptation to meditate on God through its instrumentality. Even if the picture is sinful, the viewer need not sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-k-la-shell.html">John K. La Shell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Imagination &amp; Idol: A Puritan Tension’ in Westminster Theological Journal, vol. 49:2 (Fall 1987)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d1540f6e1e" data-kw="">
<blockquote><p>Fifthly, it is not superstition to do the same material thing which another does superstitiously; if we have not the same superstitious conceit of it as he has. If a Papist should anoint the sick as a sacrament, and a protestant do it as a medicine, the former is superstition and not the latter. And so in other things. Sixthly, whether that indifferent thing remain indifferent to our use which others use to superstition is a case which a judicious collation of circumstances must determine. His superstitious use does not make it simply a sin in any other who has none of his false conceits and ends (else some superstitious persons so abusing meat and drink and clothes and all things in the world might make all things become unlawful to us: or at least deprive us of all our liberty in things indifferent). Seventhly, if we avoid another’s superstition as to the form or intention which makes it superstition, and this as a sin, we do well: If we avoid the matter itself which he uses superstitiously, because it is by him made scandalous, we do our duty, when it is scandalous indeed, and no contrary greater accident maketh it our duty. But if we take it to be simply superstition or sin to do materially the same action which a superstitious person does, we are superstitious in avoiding his superstitious act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Direction 58, ‘Take heed of Superstition, and observe well the circular course of zealous superstition…’ in The Cure of Church Divisions… (London, 1670), pt. 1, pp. 278-95</cite>, pp. 285-86</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

s" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d1540f6e1e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-superstition/#:~:text=Fifthly%2C%20it%20is%20not%20superstition%20to,superstitious%20in%20avoiding%20his%20superstitious%20act&amp;text=Fifthly%2C%20it%20is%20not%20superstition%20to%20do%20the&amp;text=we%20are%20superstitious%20in%20avoiding%20his%20superstitious%20act" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b69904f602" data-kw="">
<blockquote><p>When Moses beheld the bush burning with fire, and yet no whit consumed, he wondered at the sight, and said, ‘I will now turn aside and see this great sight, why the bush is not burnt.’ But when God thereupon called unto him out of the midst of the bush, and said, ‘Draw not night hither,’ and told him who He was; Moses trembled, hid his face, and durst not behold God. Yet although being thus warned, we dare not draw so nigh; what doth hinder but we may stand aloof off, and wonder at this great sight? ‘Our God is a consuming fire;’ (Heb. 12:29) says the apostle: and a question we find propounded in the prophet, ‘Who among us shall dwell with the devouring fire? Who among us shall dwell with the everlasting burnings?’… With what astonishment then may we behold our dust and ashes assumed into the undivided unity of God’s own person; and admitted dwell here, as an inmate under the same roof? And yet in the midst of those everlasting burning, the bush to remain unconsumed, and to continue fresh, and green for evermore. Yea, how should not we with Abraham rejoice to see this day, wherein not only our nature in the person of our Lord Jesus is found to dwell for ever in those everlasting burnings; but, in and by Him, our own persons also are brought so night thereunto, that God does set his sanctuary among us, and dwell with us; and (which is much more) makes us ourselves to be the house and habitation, wherein He is pleased to dwell by his Spirit…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mystery of the Incarnation in The Whole Works… (1631), vol. 4</cite>, pp. 585-86</span></figcaption>

02.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b69904f602.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/images-of-the-burning-bush-are-unlawful/#:~:text=When%20Moses%20beheld%20the%20bush%20burning,pleased%20to%20dwell%20by%20his%20Spirit&amp;text=When%20Moses%20beheld%20the%20bush%20burning%20with%20fire&amp;text=He%20is%20pleased%20to%20dwell%20by%20his%20Spirit" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-780b169739" data-kw="">
<blockquote><p>It is the Lord, particularly Jesus Christ, who gave this law in the name of the Trinity. This is plain from the Scripture, Acts 7:38; Heb. 12:24-26. It was He that brought the people out of Egypt, and that appeared in the bush that burned with fire, and yet was not consumed, giving commission to Moses for their deliverance, Ex. 3:2-8.</p></blockquote>

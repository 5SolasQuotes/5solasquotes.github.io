<main class="wrap"><figure class="quote" id="q-10c5bf7df6" data-kw="">
<blockquote><p>Obs. IV. That our utmost care and diligence in the consideration of the mind of God are required in all that we do about his worship.—There is nothing wherein men for the most part are more careless. Some suppose it belongs unto their own wisdom to order things in the worship of God as it seems most meet unto them;—an apprehension that I shall leave this world in admiration of, that ever it should befall the minds of so many good and honest men as it hath done. But the power of prejudice is inexpressible. Some think they are no further concerned in these things than only to follow the traditions of their fathers. This unto the community of Christians is the only rule of divine worship. To suppose that it is their duty to inquire into the way and manner of the worship of God, the grounds and reasons of what they practise therein, is most remote from them. ‘It was Moses that had the command to take care about the making of the tabernacle, and not the people. There was nothing left unto them but to do and observe what he had appointed.’ And it is true; when God first reveals the way of his worship immediately from himself, as he did first by Moses, and last of all by his Son Jesus Christ, the people have nothing to do therewith, but only to observe and do what is appointed, as our Saviour expressly declares, Matt. 28:20: but when his worship is so revealed and declared, there is not the meanest person, who professeth obedience unto him, who is exempted from this command of taking most diligent care about the due discharge of his duty herein. And this care and diligence are necessary,—</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, ed. W. H. Goold, vol. 23, Works of John Owen (Edinburgh: Johnstone and Hunter, 1854), 42–43.</span></figcaption>

</figure><figure class="quote" id="q-eb9354003c" data-kw="">
<blockquote><p>Chrysostom shows that it was the manner of the heathen Grecians to come to prayer covered thus, and Beza alleges Plutarch speaking of the Romans, that they worshipped their gods being covered and bowing their heads. Wherefore it was necessary for the apostle to admonish them hereof, there being some doubtless, who notwithstanding the order before settled at Corinth, did cleave to this their superstitious manner still… Here is no ground then for being bareheaded in the congregation, as some imagine, nor yet for the preachers being bareheaded, but that he may wear a little cap to defend him from the cold, as Calvin allows, or a hat, where the order of the Church is such in token of authority, as Beza contends, and is the manner of the French Church, because howsoever it was then, now it is a sign of authority amongst men to be covered, and of subjection to be uncovered. The only thing to be gathered hence is that all should be held with such reverence of the public place, as that they should do nothing unseemly there, of what sex or condition soever they be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon All the Epistles of the Apostle Saint Paul</cite>, ... (London, 1631), on 1 Cor. 11 Mayer (1583–1664) was an English clergyman, who, it appears, conformed at 1662. | Question 2</span></figcaption>

<blockquote><p>Me thinks it is somewhat a strange kind of reasoning, because the rod of discipline is wanting [lacking], the children should be denied bread; yea, but you will say, dogs will eat the children’s bread: Why, will you therefore starve the children because dogs without your default may snatch the children’s portion? Shall the children be debarred (as I may say) their daily bread, because it will become accidentally poison unto dogs?… As it is better for God’s sheep to feed upon pasture where some weeds grow rather than starve for want [lack] of food: So it is better for God’s shepherds to suffer some weeds to grow in the sheeps’ pastures if they cannot prevent it, than to starve their flocks; yea, and as it is better for the sheep to feed among goats rather than starve, so it is better the shepherds should suffer the goats to feed upon the sheeps’ pasture though it should poison them, than for the sheep to be kept from it;</p></blockquote>

<blockquote><p>How should involuntary mental portraits of Christ be treated by those who experience them?… Erskine’s comparison of mental idolatry with mental adultery suggests some important clues. A man cannot always avoid seeing a beautiful woman or being attracted to her. Mental adultery does not consist in physical sight, but in cultivating the mental image of that woman for the purpose of sexual stimulation… When a mental image comes into the mind without a deliberate volition, its content must be evaluated. If it is symbolic of God’s attributes or if it represents an event in the life of the Lord Jesus, it may be entertained with caution. If it consists of a virtual portrait of the Savior, it ought to be rejected rather than fondled.</p></blockquote>

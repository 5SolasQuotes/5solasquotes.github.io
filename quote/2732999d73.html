<blockquote><p>‘(which is) your reasonable worship.’ that is, a worship which consists not in outward offering up of unreasonable beasts, as in the Old Testament, but in a spiritual offering up of reasonable men, i.e., of yourselves, Heb. 13:15; 1 Pet. 2:5.</p></blockquote>

<blockquote><p>III. On the statement of the question take notice: (1) acts of divine worship are twofold, some which do not differ form the worship itself (to wit, from piety and holiness, in which worship essentially consists); others ordinated to worship as helps or instruments to perform that worship suitably and declare it abroad. The former kind of acts can be instituted and commanded by God alone, who is the sole chief and legislator, who has dominion over the conscience; nor does any right belong to the Church of adding, taking away or changing anything. The latter, again, are either necessary and so also instituted by God, at least as to being (to on)–for example that assemblies should be held, the word preached, the sacraments administered; others are contingent and free as to quality (to poion), the reason of which depends upon the honesty and fitness of particular churches (to wit, that assemblies should be held in this or that time and place and the sacraments administered). The former, as being necessary, depend upon God alone and the Church has no control or power over them; the latter God has thus far left to the will of the Church as means and indifferent, so that a regard be always paid to divine truth, Christian simplicity and public edification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 3, 18th Topic, Question 31, section III, p. 286</span></figcaption>

0Christian%20simplicity%20and%20public%20edification&amp;text=III.%20On%20the%20statement%20of%20the%20question%20take&amp;text=to%20divine%20truth%2C%20Christian%20simplicity%20and%20public%20edification" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2ea2a6b47a" data-kw="">
<blockquote><p>Also when it [‘worship’] expresses the Greek word sebomai; as Acts 18:13, ‘to worship God contrary to the law;’ and Acts 18:7, ‘Justus a worshipper of God.’ And so both it and the Greek answer to the Hebrew jaré [יָרֵא], which properly signifies to fear or reverence, as Mt. 15:9, ‘in vaine they worship Me;’ for that which in Hebrew is, ‘their fear towards me,’ Isa. 29:13. So Job and Jonah, as the Hebrew says, ‘feared,’ as the Greek [Septuagint] translates, ‘worshipped God.’ Also when it interprets the Greek word threskeuo, as Col. 2:18, ‘the worshipping of angels;’ and verse 23, ‘in will-worship’ or voluntary religion. Thus worship is largely used for the fear and service of God, or any religious action.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-ainsworth.html">Henry Ainsworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defence of the Holy Scriptures, Worship &amp; Ministery, used in the Christian Churches Separated from Antichrist</cite>, ... (Amsterdam: Thorp, 1609), ‘Of Worship’, pp. 5-6</span></figcaption>

</figure><figure class="quote" id="q-fd7f6ad98e" data-kw="">
<blockquote><p>…a definition of the worship of God may be framed thus: The worship or service of God is when, upon right knowledge of God, we freely give Him the honor that is proper to him, in our hearts, according to his own will. Worship thus defined must be condsidered as a distinct thing from that honor which is called ‘veneration’. For worship properly belongs to persons, and veneration to things which appertain to persons. And veneration is to have a reverent estimation of anything or to preserve and keep it without hurt, as making store of it, and to use it reverently if it be to be used.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (d. 1602; London: Legatt, 1626), vol. 1, p. 702</span></figcaption>

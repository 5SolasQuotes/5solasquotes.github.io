<main class="wrap"><figure class="quote" id="q-d421357274" data-kw="Auricular confession">
<blockquote><p>It is not strange, therefore, that we condemn that auricular confession, as a thing pestilent in its nature, and in many ways injurious to the Church, and desire to see it abolished. But if the thing were in itself indifferent, yet, seeing it is of no use or benefit, and has given occasion to so much impiety, blasphemy, and error, who does not think that it ought to be immediately abolished?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.4.19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/sacraments.html">Rome: Sacraments</a> › <a href="../topics/rome/sacraments/penance-and-confession.html">Penance and confession</a></span><span class="t"><a href="../topics/church-discipline/absolution.html">Absolution</a> › <a href="../topics/church-discipline/absolution/against-priestly-absolution.html">Against priestly absolution</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-70fbe0dd05" data-kw="">
<blockquote><p>The schools of the Sophists have taught with remarkable agreement that the sacraments of the new law (those now used in the Christian church) justify and confer grace, provided we do not set up a barrier of mortal sin. How deadly and pestilential this notion is cannot be expressed — and the more so because for many centuries it has been a current claim in a good part of the world, to the great loss of the church. Of a certainty it is diabolical. For in promising a righteousness apart from faith, it hurls souls headlong to destruction… Hence, any man is deceived who thinks anything more is conferred upon him through the sacraments than what is offered by God’s Word and received by him in true faith. From this something else follows: assurance of salvation does not depend upon participation in the sacrament, as if justification consisted in it. For we know that justification is lodged in Christ alone, and that it is communicated to us no less by the preaching of the gospel than by the seal of the sacrament, and without the latter can stand unimpaired.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.14.14</span></figcaption>

</figure><figure class="quote" id="q-fbcadf9853" data-kw="">
<blockquote><p>So that the popish sacrifice of the mass, as they call it, is most abominable, injurious to Christ&#x27;s own sacrifice the alone propitiation for all the sins of the elect.</p></blockquote>

</figure><figure class="quote" id="q-c204f63b4a" data-kw="">
<blockquote><p>The Papists restrict or bind the worship of Christ to a thing, to which Christ has not restricted it by any express command; and in this way they declare themselves idolaters, no less than if they were to worship Christ at a wall, or if they were to adore him falling down before a pillar. From what has now been said, it is evident that the mass is an idol, formed by Anti-Christ out of various accursed errors and blasphemies, and substituted in the place of the Lord&#x27;s supper, which, for his reason, is properly and necessarily abolished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, On the Lord&#x27;s Supper (the Mass)</span></figcaption>

</figure><figure class="quote" id="q-8a64591cf5" data-kw="">

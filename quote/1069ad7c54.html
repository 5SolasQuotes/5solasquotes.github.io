<main class="wrap"><figure class="quote" id="q-1069ad7c54" data-kw="">
<blockquote><p>The Porn Myth is a non-religious response to pro-pornography arguments. It draws from the experience of porn performers, recent research from neurology, sociology, and psychology to build a case for why pornography is destructive to individuals, relationships, and society. Matt Fradd provides insightful arguments, including the latest scientific research, on nearly every relevant subject imaginable, exposing the negative impact pornography has on our minds, our relationships, and our culture. This book addresses the neurological reasons porn is addictive, helps individuals learn how to be free of porn, and offers real help to parents and the spouses of porn users.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matt-fradd.html">Matt Fradd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Porn Myth: Exposing the Reality Behind the Fantasy of Pornography</cite></span></figcaption>

<blockquote><p>After indicating that the Genevans, of course, wish and hope for the gospel to be spread everywhere, the letter states: “But we know well also what is within our compass, and we do not presume even to wish to reform extensive kingdoms.”… What is fascinating here is the apparent renouncing, on the part of the Genevans, of any connection to the evangelical movement within France or anywhere else. They would seem to wish for the king to believe that Geneva stays resolutely and quietly within its own geographical border and does not meddle in the work of reforming other parts of Europe, let alone France. In all of this, Geneva kept up a near-constant state of deception in regards to the French king and his government… Geneva was extremely effective at feigning obedience to French kings.</p></blockquote>

</figure><figure class="quote" id="q-024bd578e7" data-kw="">
<blockquote><p>What is meant by our forgiving them [Mt. 6:12]? It is our hearty forgiving them the injury done to us (to forgive the injury against God is not in our power), entertaining no hatred or malice against them, but loving them with a love of goodwill, heartily wishing their good, and being ready to do them good, Mt. 5:44-45: ‘But I say unto you, Love your enemies, bless them that curse you, do good to them that hate you, pray for them that despitefully use you, and persecute you; that ye may be the children of your Father which is in heaven, for he maketh his sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust.’ But it does not extend to a love of complacency or delight in them in whom there appears no ground for that, either as men or as Christians. Ps. 26:4, ‘I have not sat with vain persons,’ says David, ‘neither will I go in with dissemblers.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Divinity in Works</cite>, vol. 2, pp. 617-18</span></figcaption>

</figure><figure class="quote" id="q-8dc4bf9297" data-kw="">
<blockquote><p>But the words of Luke give rise to another question; for Christ does not order us to grant forgiveness, till the offender turn to us and give evidence of repentance. I reply, there are two ways in which offenses are forgiven. If a man shall do me an injury, and I, laying aside the desire of revenge, do not cease to love him, but even repay kindness in place of injury, though I entertain an unfavorable opinion of him, as he deserves, still I am said to forgive him. For when God commands us to wish well to our enemies, He does not therefore demand that we approve in them what He condemns, but only desires that our minds shall be purified from all hatred. In this kind of pardon, so far are we from having any right to wait till he who has offended shall return of his own accord to be reconciled to us, that we ought to love those who deliberately provoke us, who spurn reconciliation, and add to the load of former offenses. A second kind of forgiving is, when we receive a brother into favor, so as to think favorably respecting him, and to be convinced that the remembrance of his offense is blotted out in the sight of God. And this is what I have formerly remarked, that in this passage Christ does not speak only of injuries which have been done to us, but of every kind of offenses; for he desires that, by our compassion, we shall raise up those who have fallen. This doctrine is very necessary, because naturally almost all of us are peevish beyond measure; and Satan, under the pretense of severity, drives us to cruel rigor, so that wretched men, to whom pardon is refused, are swallowed up by grief and despair. But here another question arises. As soon as a man by words makes profession of repentance, are we bound to believe him? Were this done, we must of necessity go willingly and knowingly into mistake; for where will be discretion, if any man may freely impose on us, even to the hundredth offense? I answer, first, the discourse relates here to daily faults, in which every man, even the best, needs forgiveness. Since, then, amidst such infirmity of the flesh, our road is so slippery, and snares and attacks so numerous what will be the consequence if, at the second or third fall, the hope of forgiveness is cut off? We must add, secondly, that Christ does not deprive believers of the exercise of judgment, so as to yield a foolish readiness of belief to every slight expression, but only desires us to be so candid and merciful, as to stretch out the hand to offenders, provided there be evidence that they are sincerely dissatisfied with their sins. For repentance is a sacred thing, and therefore needs careful examination; but as soon as the offender gives probable evidence of conversion, Christ desires that he shall be admitted to reconciliation, lest, on being repulsed, he lose courage and fall back. Thirdly, It must be observed that, when any man, through his light and unsteady behavior, has exposed himself to suspicion, we may grant pardon when he asks it, and yet may do so in such a manner as to watch over his conduct for the future, that our forbearance and meekness, which proceed from the Spirit of Christ, may not become the subject of his ridicule. For we must observe the design of our Lord himself, that we ought, by our gentleness, to assist those who have fallen to rise again. And certainly we ought to imitate the goodness of our heavenly Father, who meets sinners at a distance to invite them to salvation. Besides, as repentance is a wonderful work of the Spirit, and is the creation of the new man, if we despise it, we offer an insult to God himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew</cite>, ch. 18, verse 21</span></figcaption>

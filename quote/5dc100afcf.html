<main class="wrap"><figure class="quote" id="q-5dc100afcf" data-kw="">
<blockquote><p>The words of the apostle, ‘God will have all men to be saved, etc.’ [1 Tim. 2:4] can be understood in three ways: Third, according to [John] Damascene (Of the Orthodox Faith, 2.29), they are understood of the antecedent will of God; not of the consequent will. This distinction must not be taken as applying to the divine will itself, in which there is nothing antecedent nor consequent, but to the things willed. To understand this we must consider that everything, in so far as it is good, is willed by God. A thing taken in its primary sense, and absolutely considered, may be good or evil, and yet when some additional circumstances are taken into account, by a consequent consideration may be changed into the contrary. Thus that a man should live is good; and that a man should be killed is evil, absolutely considered. But if in a particular case we add that a man is a murderer or dangerous to society, to kill him is a good; that he live is an evil. Hence it may be said of a just judge, that antecedently he wills all men to live; but consequently wills the murderer to be hanged. In the same way God antecedently wills all men to be saved, but consequently wills some to be damned, as His justice exacts. Nor do we will simply, what we will antecedently, but rather we will it in a qualified manner; for the will is directed to things as they are in themselves, and in themselves they exist under particular qualifications. Hence we will a thing simply inasmuch as we will it when all particular circumstances are considered; and this is what is meant by willing consequently. Thus it may be said that a just judge wills simply the hanging of a murderer, but in a qualified manner he would will him to live, to wit, inasmuch as he is a man. Such a qualified will may be called a willingness rather than an absolute will. Thus it is clear that whatever God simply wills takes place; although what He wills antecedently may not take place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, quest. 19, article 6, Whether the will of God is always fulfilled?, reply to objection 1</span></figcaption>

</figure><figure class="quote" id="q-f86a15fe0c" data-kw="">
<blockquote><p>But as it cannot be but that God will smite us with his rods, not only because we deserve to be smitten, but also because it is expedient, it is necessary to flee to this consolation which is offered to us, even that God having afflicted us with grief will again shew us compassion, even ‘according to the multitude of his mercies.’ He confirms the truth of what he alleges by a reference to the very nature of God Himself. Hence, that the faithful might not debate with themselves whether God would be propitious to them, after having inflicted on them a temporary punishment, the prophet comes to their aid, and sets before them the mercy of God, or rather mercies, in the plural number; as though he had said, that it could not be that God should deny Himself, and that therefore He would be always merciful to his people; for otherwise his mercy would be obliterated, yea, that mercy which is inseparable from his eternal essence and divinity.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-79509cd451" data-kw="">
<blockquote><p>What if I live in a Church where I think their gouernment is not according to God’s Word? I answer: First, that though euery particular in that government cannot be maintained by God’s Word, yet in the general it may be soundly maintained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-randall.html">John Randall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twenty-Nine Lectures of the Church</cite>, … (London, 1631) Randall (1570–1622) was an English puritan., Lecture 15, p. 253</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-31d09e463d" data-kw="">
<blockquote><p>Now why should we once name or make mention of that third kind of traditions, which do either shake the foundations of the salvation by Christ, either overthrow the things that are built upon that foundation. Such as are the supremacy of the bishop of Rome, the praying to saints, prayer for the dead, the making and the worshipping of idols, the magistral and doctoral determinations (as they call them) of free will, of merit, of pardons and of such other filthiness, the which things seeing they could never be established so long as the authority of the heavenly doctrine stood unshaken in his full force, so are they over impudent which do think that these things may be established either by the false forged title of the Church or by the prescription and length of time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the most renowned Prince Louis</cite>, [I] of Bourbon [d. 1569], Prince of Conde [in France]… in A Confession of Faith made by Common Consent of diverse Reformed Churches beyond the Seas: with an Exhortation to the Reformation of the Church. Perused &amp; allowed according to the Queen’s Majesty’s injunctions (London: Wykes, 1568)</span></figcaption>

<blockquote><p>2. Whether a separation may be iustly made from our Church for some errors or corruptions of life. I know that diverse who were once among us, never of us, have put out their own lights, indeed excommunicated themselves. What’s their plea? That our assemblies are full of enormities. I answer: That the defects and corruptions of a Church must be distinguished: they are either in doctrine or in manners. For doctrine, some errors are Citra fundamentum, some Circa fundamentum, others Contra fundamentum. Errors beside the foundation trouble, errors about the foundation shake, errors against the foundation ouerturn all. So long then as no foundation is harmed, it is not lawful depart until the Church separates from Christ, we must not separate from it. In two cases there is warrant of separation: First, when the substance of God’s worship is quite corrupted. What agreement has the Temple of God with idols? (2 Cor. 6:16) When this is, verse 17, ‘Come out from among them, and be ye separate, says the Lord,’ When Jeroboam had set up idols in Israel, the priests and the Levites left their suburbs and possession and came to Judah and Jerusalem. (2 Chron. 11:14) Secondly, when the substance of doctrine is quite corrupted. If any man consent not to the words of our Lord Jesus Christ, and to the doctrine which is according to godliness, etc. (1 Tim. 6:3) ‘From such,’ verse 5, ‘withdraw thyself.’ Paul in the synagogue at Ephesus preached for the space of three months together. (Acts 19:9) But when diverse were hardened, and believed not, but spake evil of that way, he departed from them, and separated the disciples. In these two cases lawful, not else.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-adams.html">Thomas Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Happiness of the Church</cite>, (London, 1619), ‘To the General Assembly, and Church of the Firstborn which are Written in Heaven,’, pp. 66-67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-7f4649e9c9" data-kw="">
<blockquote><p>During his formative years, while studying at Herborn and Heidelberg, Comenius came under the influence of teachers who strengthened his ecumenical predisposition. This is particularly true of the period of study at Heidelberg, where he became acquainted with David Pareus, whose house, ‘Pareanum’, served as the center for those who worked for Protestant union. Two years after his return to his native land, Comenius was ordained priest of the Unity, and became pastor at Fulnek in Moravia. But with the outbreak of the Thirty Years War, Fulnek fell a prey to the fury of the Imperial armies. Comenius was compelled to take refuge on the Bohemian estates of one of the most important members of the Unity, Count Charles of Zerotin… There he wrote his celebrated Labyrinth of the World, a book in which the ecumenical theme found expression in condemnation of the fanaticism and bigotry of the confessional groups…” – Martin Schmidt in A History of the Ecumnical Movement, vol. 1, p. 89 Various – Good Counsels for the Peace of Reformed Churches by some reverend &amp; learned Bishops &amp; other Divines (Oxford: 1641) 150 pp. ToC King James I, To Cardinal Perron Richard Hooker, Answer to Travers Edwin Sandys, View of the State of Religion in the Western World John Davenent, Opinion of Thomas Morton, On the Peace of the Church Joseph Hall Opinion of To John Dury James Ussher Opinion of Sermon before King James Some French Reformed Divines, Opinion of Dury, John A Summary Discourse Concerning the Work of Peace-Ecclesiastical, how it may Concur with the Aim of a Civil Confederation Amongst Protestants (Cambrdige, 1641) 50 pp. A Motion Tending to the Public Good of this Age &amp; of Posterity, or, The Copies of Certain Letters Written by Mr. John Dury to a Worthy Knight at his Earnest Desire, Showing Briefly what a Public Good is &amp; how by the best Means of Reformation in learning &amp; religion it may be Advanced to Some Perfection (1642) 50 pp. Giles Firmin – Separation Examined: or a Treatise wherein the Grounds for Separation from the Ministry &amp; Churches of England are weighed and found too light… Also an humble request presented to the congregational divines, that since the differences between them and the classical [presbyterial]-divines are very small, they would please to strike in with the classical-divines in carrying on the work of reformation… (London: R.I., 1652) 111 pp. Firmin (1614–1697) was a puritan English minister who appeared to lean congregationalist, but could submit to episcopacy and presbyterianism. He actively promoted Baxter’s model of persons of different persuasions in Church government uniting in a consensus practice (as Phil. 3:15-16 says Christians ought to do). Firmin was ejected in the Great Ejection of 1662. Baxter, Richard Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653) 145 pp. ToC See the second part of this, ‘An Explication of some Passages in the foregoing Propositions.. with an Answer to some Objections’ at EEBO. For background to Baxter’s paradigmatic and influential association of moderates of the differing parties for the sake of the Gospel and pastoral work (during a political and ecclesiastical vacuum), and the other similar associations which were modeled after it, see Tim Cooper, When Christians Disagree: Lessons from the Fractured Relationship of John Owen and Richard Baxter (Crossway, 2024), pp. 23, 91-92, 104. For the creedal Profession and 20 Propositions of the discipline of the Association, typed out, see below. See also ‘A Brief Explication of Some Passages in the Profession’. ‘An Explication of Some Passages in the Propositions’ gives a lot more of the philosophy of the whole. Cooper: “England had a divided church. Even among puritans, fault lines had visibly widened under the pressure of the civil war and its aftermath. After his own traumatic experience of the war, Baxter longed for order and peace, and he developed a lifelong yearning to bring Christians together in unity. He identified four main parties within the English church (Congregationalists, Episcopalians, Erastians, and Presbyterians), but he felt that the moderates within each party held similar views and, more importantly, could work together in practice even if their principles varied. He believed that if England’s ministers simply got on with the work of ministry, they would be too busy to notice how their differing doctrines of church government might otherwise keep them apart. So he formed the Worcestershire Association, a network open to local parish ministers of all stripes who met monthly for the purpose of mutual edification and encouragement. In 1653 they published their agreement to work together, and similar ministerial associations sprang up in other counties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-amos-comenius.html">John Amos Comenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Labyrinth of the World &amp; the Paradise of the Heart</cite>, ed. and tr. Count Lutzow (1623; Dent, 1905) 306 pp., p. 23</span></figcaption>

tion (1642) 50 pp. Giles Firmin – Separation Examined: or a Treatise wherein the Grounds for Separation from the Ministry &amp; Churches of England are weighed and found too light… Also an humble request presented to the congregational divines, that since the differences between them and the classical [presbyterial]-divines are very small, they would please to strike in with the classical-divines in carrying on the work of reformation… (London: R.I., 1652) 111 pp. Firmin (1614–1697) was a puritan English minister who appeared to lean congregationalist, but could submit to episcopacy and presbyterianism. He actively promoted Baxter’s model of persons of different persuasions in Church government uniting in a consensus practice (as Phil. 3:15-16 says Christians ought to do). Firmin was ejected in the Great Ejection of 1662. Baxter, Richard Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653) 145 pp. ToC See the second part of this, ‘An Explication of some Passages in the foregoing Propositions.. with an Answer to some Objections’ at EEBO. For background to Baxter’s paradigmatic and influential association of moderates of the differing parties for the sake of the Gospel and pastoral work (during a political and ecclesiastical vacuum), and the other similar associations which were modeled after it, see Tim Cooper, When Christians Disagree: Lessons from the Fractured Relationship of John Owen and Richard Baxter (Crossway, 2024), pp. 23, 91-92, 104. For the creedal Profession and 20 Propositions of the discipline of the Association, typed out, see below. See also ‘A Brief Explication of Some Passages in the Profession’. ‘An Explication of Some Passages in the Propositions’ gives a lot more of the philosophy of the whole. Cooper: “England had a divided church. Even among puritans, fault lines had visibly widened under the pressure of the civil war and its aftermath. After his own traumatic experience of the war, Baxter longed for order and peace, and he developed a lifelong yearning to bring Christians together in unity. He identified four main parties within the English church (Congregationalists, Episcopalians, Erastians, and Presbyterians), but he felt that the moderates within each party held similar views and, more importantly, could work together in practice even if their principles varied. He believed that if England’s ministers simply got on with the work of ministry, they would be too busy to notice how their differing doctrines of church government might otherwise keep them apart. So he formed the Worcestershire Association, a network open to local parish ministers of all stripes who met monthly for the purpose of mutual edification and encouragement. In 1653 they published their agreement to work together, and similar ministerial associations sprang up in other counties.”

is+Age+%26+of+Posterity%2C+or%2C+The+Copies+of+Certain+Letters+Written+by+Mr.+John+Dury+to+a+Worthy+Knight+at+his+Earnest+Desire%2C+Showing+Briefly+what+a+Public+Good+is+%26+how+by+the+best+Means+of+Reformation+in+learning+%26+religion+it+may+be+Advanced+to+Some+Perfection+%281642%29+50+pp.+Giles+Firmin+%E2%80%93+Separation+Examined%3A+or+a+Treatise+wherein+the+Grounds+for+Separation+from+the+Ministry+%26+Churches+of+England+are+weighed+and+found+too+light%E2%80%A6+Also+an+humble+request+presented+to+the+congregational+divines%2C+that+since+the+differences+between+them+and+the+classical+%5Bpresbyterial%5D-divines+are+very+small%2C+they+would+please+to+strike+in+with+the+classical-divines+in+carrying+on+the+work+of+reformation%E2%80%A6+%28London%3A+R.I.%2C+1652%29+111+pp.+Firmin+%281614%E2%80%931697%29+was+a+puritan+English+minister+who+appeared+to+lean+congregationalist%2C+but+could+submit+to+episcopacy+and+presbyterianism.+He+actively+promoted+Baxter%E2%80%99s+model+of+persons+of+different+persuasions+in+Church+government+uniting+in+a+consensus+practice+%28as+Phil.+3%3A15-16+says+Christians+ought+to+do%29.+Firmin+was+ejected+in+the+Great+Ejection+of+1662.+Baxter%2C+Richard+Christian+Concord%2C+or+the+Agreement+of+the+Associated+Pastors+%26+Churches+of+Worcestershire%2C+with+Richard+Baxter%E2%80%99s+Explication+%26+Defence+of+it%2C+%26+his+Exhortation+to+Unity+%28London%3A+A.M.%2C+1653%29+145+pp.+ToC+See+the+second+part+of+this%2C+%E2%80%98An+Explication+of+some+Passages+in+the+foregoing+Propositions..+with+an+Answer+to+some+Objections%E2%80%99+at+EEBO.+For+background+to+Baxter%E2%80%99s+paradigmatic+and+influential+association+of+moderates+of+the+differing+parties+for+the+sake+of+the+Gospel+and+pastoral+work+%28during+a+political+and+ecclesiastical+vacuum%29%2C+and+the+other+similar+associations+which+were+modeled+after+it%2C+see+Tim+Cooper%2C+When+Christians+Disagree%3A+Lessons+from+the+Fractured+Relationship+of+John+Owen+and+Richard+Baxter+%28Crossway%2C+2024%29%2C+pp.+23%2C+91-92%2C+104.+For+the+creedal+Profession+and+20+Propositions+of+the+discipline+of+the+Association%2C+typed+out%2C+see+below.+See+also+%E2%80%98A+Brief+Explication+of+Some+Passages+in+the+Profession%E2%80%99.+%E2%80%98An+Explication+of+Some+Passages+in+the+Propositions%E2%80%99+gives+a+lot+more+of+the+philosophy+of+the+whole.+Cooper%3A+%E2%80%9CEngland+had+a+divided+church.+Even+among+puritans%2C+fault+lines+had+visibly+widened+under+the+pressure+of+the+civil+war+and+its+aftermath.+After+his+own+traumatic+experience+of+the+war%2C+Baxter+longed+for+order+and+peace%2C+and+he+developed+a+lifelong+yearning+to+bring+Christians+together+in+unity.+He+identified+four+main+parties+within+the+English+church+%28Congregationalists%2C+Episcopalians%2C+Erastians%2C+and+Presbyterians%29%2C+but+he+felt+that+the+moderates+within+each+party+held+similar+views+and%2C+more+importantly%2C+could+work+together+in+practice+even+if+their+principles+varied.+He+believed+that+if+England%E2%80%99s+ministers+simply+got+on+with+the+work+of+ministry%2C+they+would+be+too+busy+to+notice+how+their+differing+doctrines+of+church+government+might+otherwise+keep+them+apart.+So+he+formed+the+Worcestershire+Association%2C+a+network+open+to+local+parish+ministers+of+all+stripes+who+met+monthly+for+the+purpose+of+mutual+edification+and+encouragement.+In+1653+they+published+their+agreement+to+work+together%2C+and+similar+ministerial+associations+sprang+up+in+other+counties.%E2%80%9D%0A%0A%E2%80%94+John+Amos+Comenius%2C+The+Labyrinth+of+the+World+%26+the+Paradise+of+the+Heart+ed.+and+tr.+Count+Lutzow+%281623%3B+Dent%2C+1905%29+306+pp.%2C+p.+23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7f4649e9c9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7f4649e9c9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=During%20his%20formative%20years%2C%20while <blockquote><p>But if in a froward tergiversation [change of position], the fornicator begin to reply that he also is scandalized and provoked to go on in his fornication obstinately, by the pastor’s rebuking him for so light a matter, and that the pastor’s reproof to him has appearance of evil, as much as his fornication has to the pastor: Albeit here it may be answered that the pastor’s reproof is not done inordinate [inordinately], neither has any appearance of evil, except in the fornicator’s perverse interpretation, yet for stopping the fornicator’s mouth as well more forcibly as more quickly, the pastor rejoinds that if any scandal follow upon his reproof, it is not to be regarded, because the thing is necessary and that because fornication being a great sin, he may not but reprove it. So, albeit our argument of scandal [against the ceremonies] holds out against the ceremonies considered by themselves, without making mention of the unlawfulness of them in themselves: albeit also when the scandal of non-conformity (if there be any such) is compared with the scandal of conformity, we say truly, that this has appearance of evil in its own condition, and that has none, except in the false interpretation of those who glory in gainsaying.</p></blockquote>

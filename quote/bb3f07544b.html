<main class="wrap"><figure class="quote" id="q-bb3f07544b" data-kw="">
<blockquote><p>Three things in fact are required for the possible real, namely: 1) that existence is not intrinsically repugnant to it; 2) that having necessary existence is repugnant to it; 3) that existence is not extrinsically repugnant to it. The last requirement involves the existence of a cause having the capacity to bring the possible into actual existence. For this reason the possible is said to have virtual existence in its cause, that is, a cause exists that has the virtue or power of producing it. The possible is also said to have ‘existence in a certain respect’ in itself, that is, existence in something intelligent as a known object (intelligible being).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), p. 54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>’The sun and the moon stood still in their habitation’ – they stood still in their several spheres wherein they move, for these be their habitations, and note that they both stood still, sun and moon. For the moon borrowing all her light of the sun, had she kept her course while the sun had stool still the length of a day, there had been great irregularity of motion in these celestial bodies, from the constant order set them by their Maker in their creation. Observe also, he does not say the earth stood still, but the sun: it had been, as some said, the earth and moon stood still as the sun and moon, and our understanding would have soon apprehended, if that new astronomy had been then revealed, which some of our empericks, and journeymen in that excellent science of astronomy have late revived in their almanacs, telling the world that they have long been in a wrong belief, that the sun moves and the earth is fixed, for they believe that the sun is fixed, and the earth is moved. And to evade the clear evidence of the text, which tells it for a wonder that the sun stood still, they say, this is spoken to our capacity, because to our sight it so seems, that the sun moves and the earth is fixed, but indeed it is otherwise. Our capacity I think has much wrong done in this, for if the Word of God had told us that God had created the sun to stand still, and the earth to move, it is more likely that we should have taken his word for it, and have believed it as it is, as well as we now believe it, as it appears. We are neither incapable nor incredulous, but that many against the letter of Scripture have written, and made more believe, that the sun stands still from the creation. The common defence of this opinion grounded on God’s application of himself, to human capacity, does make figures in a story where is no need, and makes David a man of small judgement in the knowledge of the sun, who says, that God ‘hath set a tabernacle for the sun in the heavens’ (called here) a habitation, ‘which is a bridegroom coming out of his chamber, and rejoiceth, as a strong man, to run his race.’ His going forth is from the end of the Heaven, and his circuit unto the ends of it. Does not this prophet speak of the glory of God, declared in the motion, not the station of the sun? or in the glory of God showed in our opinion of the sun’s motion, not in the truth thereof. Greater secrets then this are revealed in holy Scripture, which are against the vouchie of the outward sense, or the rational discourse of man, and no doubt, but if the sun had stood still, and the earth that we live upon had moved, when this miracle was by the spirit of truth recorded, it had been so set down to us…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-marbury.html">Edward Marbury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary or Exposition upon the Prophecy of Habbakuk</cite>, ... (London, 1650), on Hab. 3:11, pp. 127-128</span></figcaption>

<blockquote><p>VIII. Nor is God the univocal cause of the world, but the equivocal; nor necessary and immanent, as Spinoza wishes, Ethics, pt. 1, On God, Proposition 18, p. 19, but free and transient, or better: Creation, taken actively, is not an immanent, but a transient action, by which God produces things diverse from Himself and confers being upon them, the immediate principle of which action is the practical volition of God, his command and mandate. For an agent is then said to act transiently when it actually flows into an external effect diverse from the agent, which has its place in Creation, where a true and real influx of God into the creature is given, signified by the command of God in:Gen. 1:3, “Let there be light: and there was light.”… From this it appears clearer than daylight that here is given a true and real influx of an efficient cause into the effect, and therefore a true and real transient action. These things being diligently observed, the whole of Spinozism collapses. … XI. The preceding, i.e., intrinsically moving, cause is the divine goodness, communicative and diffusive of itself, by which it came to pass that God, blessed in Himself, went forth outside Himself and communicated his goodness with creatures. Ps. 127:5-8; 145:9. He produced all things from nothing, and declared His immense goodness, wisdom, and power to the creature, especially the rational one, by which in turn He would be acknowledged and worshipped. The directing and ordering cause is knowledge, wisdom, and, based on these as a directive principle, the decree of God, as an imperious principle, which is accompanied by the power of God as an executive principle, which things were decreed from knowledge and most wisely. Whence in Eph. 1:11, God is said to do all things ‘according to the counsel of His own will.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), trans. AI Latin</span></figcaption>

<blockquote><p>We believe that God the Father, by the Son, together with the Holy Ghost, in the space of six days created of nothing all things visible and invisible, which the Holy Spirit in the holy Scriptures comprehends under the name of ‘heauen and earth’;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of the Christian Religion</cite>, … (1586; Cambridge, 1599), Confession, ch. 5, sect. 1, p. 21</span></figcaption>

<main class="wrap"><figure class="quote" id="q-b3d711adc6" data-kw="">
<blockquote><p>By setting aside the contrary supposition, he proves his statement, that by grace we are saved, — that we have no remaining works by which we can merit salvation; for all the good works which we possess are the fruit of regeneration. Hence it follows, that works themselves are a part of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistles to the Galatians and Ephesians</cite>, Ephesians 2:10</span></figcaption>

</figure><figure class="quote" id="q-c699849847" data-kw="">

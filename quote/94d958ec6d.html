<main class="wrap"><figure class="quote" id="q-94d958ec6d" data-kw="absolute ordinate power">
<blockquote><p>The power of God is nothing other than the divine essence itself productive outwardly, through which he is conceived as able to do whatsoever he wills or can will. The ordinate power is that according to which God actually and irresistibly does whatsoever he wills. The absolute power is that through which he is conceived as able to do more than he really does, viz., those things which are not repugnant to his most perfect nature or imply no contradiction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.21.1–3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/power.html">Power</a> › <a href="../topics/attributes-of-god/power/absolute-and-ordained-power.html">Absolute and ordained power</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d1758a69a1" data-kw="intuitive knowledge">
<blockquote><p>God knows all things by one intuitive act. As there is no succession in his being, so there is no succession in his knowledge. He knows things that are successive, before their existence and succession, by one single act of intuition. By one cast of his eye, all things future are present to him in regard of his eternity and omnipresence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Knowledge of God</span></figcaption>

</figure><figure class="quote" id="q-8fb05937d5" data-kw="Wisdom">
<blockquote><p>Who can trace the motions of God&#x27;s eyes in their race? &#x27;He makes the clouds his chariot,&#x27; Ps. 104:3, in his motions about the earth, and his throne is in the dark. He walks upon the wings of the wind, his providential speed makes it too quick for our understanding. His ways are mysterious, and put the reason and wisdom of men to a stand. The clearest-sighted servants of God do not see the bottom of his works, the motion of God&#x27;s eyes is too quick for ours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite>, Discourse on 2 Chron. 16:9, Doct. 1, Prop. 2</span></figcaption>

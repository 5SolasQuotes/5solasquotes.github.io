<main class="wrap"><figure class="quote" id="q-cdfc0eea12" data-kw="">
<blockquote><p>All that outward reverence which we show towards God in his worship and service must be measured and estimated according to the customs and usage of places and countries; so that what they use as a sign and expression of honor to their superiors, they ought much more to use it in the presence of the great God, the King of Kings and Lord of Lords. And therefore uncovering of the head [for men], bowing of the body, an humble submiss and settled composure of the whole man, which among us are but fitting signs of respect and reverence, when we appear in the presence of those who are much our superiors, ought likewise to be used by us in the presence of God, who is infinitely such, not indeed that they are essential parts of worship, but signs and testimonies of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Ten Commandments with other Sermons</cite>, … (London, 1691) | Second Commandment</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7b2bea5a5e" data-kw="">
<blockquote><p>II. Answerable to a servant’s obeisance must be his whole behavior before his master, seasoned and ordered with such modesty and humility, as may manifest an honorable respect to his master: as … 2. By uncovering their heads in their master’s presence: this in our days, and in the parts of the world where we dwell, is in the male kind a sign and token of subjection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Domestical Duties… (London: 1622) | 7th Treatise, “Duties of Servants” | section 8, pp. 601-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-0be51627bb" data-kw="">
<blockquote><p>Besides, you mistake him [Tertullian] if you think he meant by the name of ‘tradition’ a tradition of the apostles. For whatsoever custom not written in the scripture was kept by the faithful, that, because it was delivered by some body from whom the use thereof was taken, he says it came in by tradition. In so much that he affirms it both of Jewish customs before the apostles, as that their women covered their faces with vails…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rainolds.html">John Rainolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of the Conference between John Rainolds and John Hart</cite>, [a Romanist] touching the Head and the Faith of the Church (London, 1584), ch. 8, p. 581</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-f6d80689e0" data-kw="">
<blockquote><p>Uncovering of the head: Though this last be not adoration, but a national sign of reverence, and is not every where adoration; yet Abulensis says, the Jews did pray and sacrifice with covered heads: So says Virgil, and Lod. Vives: Therefore the Corinthians had this from the Grecians as a civil sign of gravity, which should not be banished from God’s worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), ch. 1, p. 144</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

— Samuel Rutherford, The Divine Right of Church Government... (1646), ch. 1, p. 144">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CUncovering+of+the+head%3A+Though+this+last+be+not+adoration%2C+but+a+national+sign+of+reverence%2C+and+is+not+every+where+adoration%3B+yet+Abulensis+says%2C+the+Jews+did+pray+and+sacrifice+with+covered+heads%3A+So+says+Virgil%2C+and+Lod.+Vives%3A+Therefore+the+Corinthians+had+this+from+the+Grecians+as+a+civil+sign+of+gravity%2C+which+should+not+be+banished+from+God%E2%80%99s+worship.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government...+%281646%29%2C+ch.+1%2C+p.+144&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff6d80689e0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f6d80689e0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/head-coverings-in-public-worship/gillespie-rutherford-on-headcoverings-in-public-worship/#:~:text=Uncovering%20of%20the%20head%3A%20Though%20this,not%20be%20banished%20from%20God%E2%80%99s%20worship&amp;text=Uncovering%20of%20the%20head%3A%20Though%20this%20last%20be&amp;text=which%20should%20not%20be%20banished%20from%20God%E2%80%99s%20worship" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-62f4e9eeda" data-kw="">
<blockquote><p>…in 1 Cor. 11:6, ‘if the woman be not covered, let her also be shorn’: If she lays her vail aside and appears in the public assemblies without a covering, then I say, ‘let her also be shorn or shaved’, let her hair be cut close to the skin, let her go like some of the cropped philosophers among the Stoics. Not that he would have her do so, but only by this sarcastic way of speaking he signifies that one is as decent as the other. It is as disgraceful to be uncovered as to be shaved: for ’twas the laudable custom then in the Christian churches for the women to be vailed, and it was disgraceful and reproachful for any of that sex to appear bare-faced in the time of worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Authority, Style &amp; Perfection of the Books of the Old &amp; New-Testament with a Continued Illustration of Several Difficult Texts of Scripture throughout the Whole Work</cite>, (London, 1693), ‘Of the Style of the Holy Scriptures’, ch. 4, pp. 132-33 See also, pp. 241-44.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-1aeb2dfe15" data-kw="">
<blockquote><p>Whereas Paul says that “the promise is given to believers,” [Gal. 3:22] it is manifest that the promise is not universal in respect of all mankind, but only indefinite and universal in respect of believers. Wherefore their doctrine is not sound that teach the redemption wrought by Christ to be as general as the sin wrought by Adam. Indeed, if we regard the value and sufficiency of the death of Christ, it is so; but if we respect the communication and donation of this benefit, it is not. For though all be shut under sin, yet the promise is only given “to them that believe.” It is objected that “God was in Christ reconciling the world to Himself” (2 Cor. 5:19). Answer. The text in hand shows that by “the world” we are to understand all believers through the whole world. And whereas Paul says, “God shut up all under unbelief, that he might have mercy upon all” (Rom. 11:32), his meaning is here set down, that He shut both Jews and Gentiles under unbelief that He might have mercy upon all that believe, both Jews and Gentiles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 201.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

</figure><figure class="quote" id="q-99e73a55f3" data-kw="intercession necessary">
<blockquote><p>Various arguments prove the necessity of his intercession. (1) The institution of God, who wished two parts to be in the priesthood—satisfaction and intercession; just as under the Old Testament the high priest was bound to do two things in virtue of his office—first, to offer a victim upon the altar of whole burnt offerings; second, to carry the blood of the offered victim into the holy place and to burn incense upon the altar of incense. Having finished his sacrifice on earth upon the cross, Christ must intercede in heaven. Hence Paul testifies if he were on earth, he should not be a priest (Heb. 8:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.15.2</span></figcaption>

</figure><figure class="quote" id="q-53d9370573" data-kw="">
<blockquote><p>Here comes in that question, whether or not the power of the temporal magistrate (as such) be so derived from Christ, not only as God, but as Mediator, so that he is his deputy and vice-gerent. The negative may be made good by these following arguments: 1. The power of Christ’s deputies as Mediator is only ministerial, the power of servants or heralds (Lk. 22:25-26; Mt. 20:25-27): as Protestants prove against Papists in the controversy touching the supremacy of the Pope. But now the power of magistrates may be imperial and monarchical, and therefore it is not derived from Christ as He is Mediator unto his deputies. 2. All the deputies and vice-gerents of Christ as Mediator are obliged to promote the Kingdom and Gospel of Christ. But now heathenish magistrates that never heard, nor could hear of the name of Christ, are not bound to promote Christ’s Mediatory Kingdom and gospel: for they are invincibly ignorant thereof, and there can be no obligation without revelation (Jn. 15:22; Rom. 2:12). Therefore they are not the deputies and vice-gerents of Christ as Mediator, and therefore [they are] no magistrates as such: for, à quatenus ad de omni valet consequentia. 3. All the deputies and vice-gerents of Christ as Mediator have their commission from the Gospel; but now temporal magistrates have their commission at least from the secondary law of nature, the law of nations. But now the law of nature and nations dictates nothing of a Mediator, or anything relating unto Him as such. I should send the reader unto Mr. Gillespie in his Aaron’s Rod Blossoming, Book 2, chs. 6–7; to see farther of this subject, but because Mr. Baxter thinks Mr. Rutherford a more able disputant than Gillespie, I shall refer unto him, in his Lex &amp; Rex, Question 42, from pp. 422-433, as also his Divine Right of Church Government, [ch. 28] from pp. 600-42 where he prosecutes these and other arguments at large…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Mixture of Scholastical Divinity with Practical, in Several Tractates (Oxford, 1656), p. 43. Jeanes was an English presbyterian minister.</cite></span></figcaption>

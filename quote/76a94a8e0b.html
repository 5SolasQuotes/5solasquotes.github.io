<main class="wrap"><figure class="quote" id="q-76a94a8e0b" data-kw="">
<blockquote><p>The women’s preparation, verse 20, ‘And Miriam the prophetess the sister of Aaron, took a timbrel in her hand, and all the women went out after her with timbrels and dances’… Question. Is this practice now imitable in the Church? Answer: No, for: 1. This was done by a prophetical and extraordinary instinct. 2. It was a service suitable to that legal constitution at that time. 3. The Gospel only requires spiritual sacrifices of praise and singing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-hughes.html">George Hughes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Analytical Exposition of the Whole First Book of Moses, called Genesis… (1672), on Ex. 15, verse 20</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8b4283b22d" data-kw="">
<blockquote><p>If the Church prescribe anything lawfully, so that she prescribe no more than she has power given her to prescribe, her ordinance must be accompanied with some good reason and warrant given for the satisfaction of tender consciences… It becomes not the spouse of Christ, endued with the spirit of meekness, to command anything imperiously, and without a reason given… Tertullian’s testimony is known (in Apologet.): Nulla lex, etc. ‘No law (says he) owes to itself alone the conscience of its equity, but to those from whom it expects obedience. Moreover, it is a suspected law which will not have itself to be proved, but a wicked law, which not being proved, yet bears rule.’… Neither can the Church prescribe anything lawfully which she shows not to have been convenient, even before her determination. … If the ceremonies be lawful to us because the law and ordinance of the Church prescribes them, then either the bare and naked prescription of the Church, having no other warrant than the Church’s own authority, make them to be thus lawful; or else the law of the Church, as grounded upon and warranted by the law of God and nature… If they take them (as needs they must) to the latter part, then let them either say that the ceremonies are lawful unto us, because the Church judges them to be agreeable to the law of God and nature, or because the Church proves unto us, by evident reasons, that they are indeed agreeable unto these laws. If they yield us the latter, then it is not the Church’s law, but the Church’s reasons given for her law, which can warrant the lawfulness of them unto us; which does elude and elide all that which they allege for the lawfulness of them from the power and authority of the Church. And further, if any such reasons be to be give forth for the ceremonies, why are they so long kept up from us?… It will be answered (I know), that if they Church command anything repugnant to God’s Word we are not bound to do it, nor to receive it as lawful, though the Church judge so of it; but otherwise, if that which the Church judges to be agreeable to the law of God and nature (and in that respect prescribes) be not repugnant to the Word of God, but in itself indifferent, then are we to embrace it as convenient, and consonant to the law of God and nature, neither ought we to call in question the lawfulness of it. But I reply, that [in this case] either we must judge a thing to be repugnant or not repugnant to the Word, to be indifferent or not indifferent in itself, [merely] because the Church judges so of it [which is insufficient to conscience], or else because the Church proves unto us by an evident reason that it is so… the argument is still set afoot [incomplete]; then we must receive everything (be it ever so bad) as indifferent, if only the Church happen so to judge of it; for quod competit alicui qua tale, etc. So that if we receive anything as indifferent, for this respect, because the Church judges it to be so, then shall we receive everything for indifferent which the Church shall so judge of [which is absurd].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), Pt. 3, Ch. 7, Sections 7</cite>, pp. 131-3</span></figcaption>

them+from+the+power+and+authority+of+the+Church.+And+further%2C+if+any+such+reasons+be+to+be+give+forth+for+the+ceremonies%2C+why+are+they+so+long+kept+up+from+us%3F%E2%80%A6+It+will+be+answered+%28I+know%29%2C+that+if+they+Church+command+anything+repugnant+to+God%E2%80%99s+Word+we+are+not+bound+to+do+it%2C+nor+to+receive+it+as+lawful%2C+though+the+Church+judge+so+of+it%3B+but+otherwise%2C+if+that+which+the+Church+judges+to+be+agreeable+to+the+law+of+God+and+nature+%28and+in+that+respect+prescribes%29+be+not+repugnant+to+the+Word+of+God%2C+but+in+itself+indifferent%2C+then+are+we+to+embrace+it+as+convenient%2C+and+consonant+to+the+law+of+God+and+nature%2C+neither+ought+we+to+call+in+question+the+lawfulness+of+it.+But+I+reply%2C+that+%5Bin+this+case%5D+either+we+must+judge+a+thing+to+be+repugnant+or+not+repugnant+to+the+Word%2C+to+be+indifferent+or+not+indifferent+in+itself%2C+%5Bmerely%5D+because+the+Church+judges+so+of+it+%5Bwhich+is+insufficient+to+conscience%5D%2C+or+else+because+the+Church+proves+unto+us+by+an+evident+reason+that+it+is+so%E2%80%A6+the+argument+is+still+set+afoot+%5Bincomplete%5D%3B+then+we+must+receive+everything+%28be+it+ever+so+bad%29+as+indifferent%2C+if+only+the+Church+happen+so+to+judge+of+it%3B+for+quod+competit+alicui+qua+tale%2C+etc.+So+that+if+we+receive+anything+as+indifferent%2C+for+this+respect%2C+because+the+Church+judges+it+to+be+so%2C+then+shall+we+receive+everything+for+indifferent+which+the+Church+shall+so+judge+of+%5Bwhich+is+absurd%5D.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English-Popish+Ceremonies+%281637%29%2C+Pt.+3%2C+Ch.+7%2C+Sections+7%2C+pp.+131-3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8b4283b22d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8b4283b22d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-arbitrary-laws-commands/#:~:text=If%20the%20Church%20prescribe%20anything%20lawfully,so%20judge%20of%20%5Bwhich%20is%20absurd&amp;text=If%20the%20Church%20prescribe%20anything%20lawfully%2C%20so%20that&amp;text=Church%20shall%20so%20judge%20of%20%5Bwhich%20is%20absurd" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>There was a certain Count of your [Reformed] confession who possessed common jurisdiction in a certain church with a certain Prince of our [Lutheran] religion. Therefore since the Associate was judging that he [the reformed Count] had more of right in that church, he made sure that the altar was destroyed and that a table be built [for the Lord’s Supper] in the temple [church building]. The Prince found out later about this, and ordered that the table be removed and an altar be constructed again. The Count in return took care a second time in return that the altar be destroyed, and the table restored. The Prince likewise a second time ordered that the table be taken away and the altar restored. I do not know whether this happened a third time. But the [reformed] Count later heeded the [Lutheran] Prince’s strictness, and left off from his course, such that the altar remained in the temple in place of the table.</p></blockquote>

<blockquote><p>As touching that point whether the minister should wear it [the surplice, a white garment], although it be inconvenient: the truth is that I dare not be author to any to forsake his pastoral charge for the inconvenience thereof: considering that this charge, being an absolute commandment of the Lord, ought not to be laid aside for a simple inconvenience or uncomeliness of a thing which in the own nature is indifferent. The offence in occasioning the weak to fall and the wicked to be confirmed in their wickedness is one of the foulest spots in the surplice, and which of all other can make it most detestable in the eyes of a godly minister… But when it is laid in the scales with the preaching of the Word of God, which is so necessary for him that is called thereunto, that a woe hangs on his head if he do not preach it: it is of less importance than for the refusal of it we should let go so necessary a duty.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“As touching that point whether the minister should wear it [the surplice, a white garment], although it be inconvenient: the truth is that I dare not be author to any to forsake his pastoral charge for the inconvenience thereof: considering that this charge, being an absolute commandment of the Lord, ought not to be laid aside for a simple inconvenience or uncomeliness of a thing which in the own nature is indifferent. The offence in occasioning the weak to fall and the wicked to be confirmed in their wickedness is one of the foulest spots in the surplice, and which of all other can make it most detestable in the eyes of a godly minister… But when it is laid in the scales with the preaching of the Word of God, which is so necessary for him that is called thereunto, that a woe hangs on his head if he do not preach it: it is of less importance than for the refusal of it we should let go so necessary a duty.”

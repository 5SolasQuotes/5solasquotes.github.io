<main class="wrap"><figure class="quote" id="q-26bfbc15b8" data-kw="">
<blockquote><p>Individuals, who enter into such public bonds, bind their children by the moral principles of the covenant; and the obligations continue upon posterity until the purpose of the engagement has been accomplished. Moral obligations will be honoured by the honourable; and can be ignored by none without sin.

For this reason the Covenanters of America admit the binding force of the Covenants of their ancestors of other centuries and other lands. They have cheerfully endorsed the immutable principles contained therein, as far as they are applicable in this country and to the condition of society in this age. These principles have been inscribed in the American Covenant.</p></blockquote>

<blockquote><p>Neverthelesse, if any man think the sentence of the bshop and the presbytery given forth against him to be unjust, he ought to have liberty of recourse to the synod and there to be heard, according as it was decreed by the Fourth Council of Carthage, Canon 66. But oftimes the matter is of such difficulty or importance, that the bishop and the presbytery may not giveout an peremptory sentence of suspension or deprivation (Fenner, Theol., bk. 7, ch. 7, p. 153), till the matter be brought to the synod of the province (Hemming, Enchir., class. 3, ch. 11, pp. 390-91), where according to the ancient order the matter is to be handled, not by the censure of one bishop, but by the judgement of the whole clergy gathered together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 8, Digression 4, p. 194</span></figcaption>

<blockquote><p>1. Liberty is that natural power which man has of his own person, whence a free man is said to be suae potestatis, ‘in his own power’, and it is defined in the law to be a natural faculty to do that which every man pleases, unless he be hindered by law or force. … 5. Though liberty be the most precious right, yet it is not absolute, but limited; First, by the Will of God, and our obediential obligations to Him, and to men by his ordinance; and so though man has power of his own person, yet has he no power of his own life, or his members, to dispose of them at his pleasure, either by taking away of his life or amputation, or hurting of any member by himself, or by giving power to any other so to do, unless it be necessary for preserving the whole, but he is naturally obliged to God to maintain his life: So likewise men may be restrained, or constrained by others, without encroachment upon the law of liberty, in the pursuance of other obediential obligations; as a husband has power to restrain his wife, from her liberty of going where she will, and may keep her within the bounds of conjugal society; so may parents restrain their children, and also constrain them to the performance of moral duties, and that without any engagement or law; we may also without any injury, restrain a furious person, or one who is inferring violence to himself, in his life or limbs, because this is not against any act of his lawful liberty, and is done as a duty in us of love and mercy: But in matters of utility and profit, where the natural liberty is not hemmed in with an obligation, there, unless by his own delinquence or consent, man cannot justly be restrained, much less constrained upon pretense of his utility or profit; for liberty, as far preferable to profit, and in the matter of utility, every man is left to his own choice, and cannot without injury to God and Man, be hindered to do what he pleases, or be compelled to do what he pleases not, in things wherein he is free, 6. Liberty may be diminished or taken away by our delinquence in the way of punishment, for seeing it is a right in our own power; as goods and debts may be forfaulted by our delinquence, so may our liberty, in whole or in part. 7. Thirdly, our engagements do commonly import a diminution of our personal liberty, but much more, of that natural liberty of things without us; whence it is that the law allows personal execution or restraint, and incarceration of the debitor’s person, until he do all the deeds that are in his power for the satisfaction of his Creditor. …

9. Fifthly, liberty is wholly taken off by bondage, slavery or servitude, which is diametrically opposite to liberty; for as liberty is that power by which men are sui juris [in his own power], so by servitude they became alieni juris, ‘in the power of another’…

10. Bondage was introduced by the law of nations, and it is among the positive laws of nations, settled by common consuetude [custom], and it took first place in these who were taken in war, who being under the power of their enemies’ sword, did lose their liberty in lieu [in place] of their life [instead of being killed]; such also were these who sold their liberty and gave it up, and were content to be perpetual slaves, as were the Jewish bondmen, whose ears were pierced with an aul [Ex. 21], as the solemnity of their perpetual and willing servitude, the offspring of servants remained in their servile condition…

11. Bondage, though contrair to the nature of liberty, yet it is lawful; liberty being a right alienable, and in our disposal, so that the natural law constitutes us free, but puts no necessity on us, so to continue; and therefore servitude is both approven in the Old Testament; and in the New, it is cleared against that obvious objection, that being made free by Christ, we should not become the servants of men, to which the Apostle answers, ‘Art thou called, being a servant (or slave)? continue so, for nevertheless thou art Christ’s freeman’ [1 Cor. 7]: But yet Christian lenity and mercy, has almost taken away bondage, except amongst the Spaniards, Portugals [who were Romanist] and other Christian nations bordering upon the Turks [Muslims], where, because the Turks do extremely exercise slavery, especially upon Christians, their neighbors do the like, that they may have slaves to exchange with slaves: little of slavery remains elsewhere among Christians, except the ascriptitii [naturalized foreigners], who are not absolutely slaves… but in Scotland there is no such thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/viscount-of-stair-james-dalrymple.html">James Dalrymple</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Institutions of the Law of Scotland</cite>, ... (Edinburgh, 1681), Title 2, ‘Of Liberty’, p. 21</span></figcaption>

</figure><figure class="quote" id="q-8c980a5c42" data-kw="">
<blockquote><p>The man of business – the merchant and the tradesman, must have respect to the law of Christ, and see that so far as their authority and influence extend, his law be not violated, nor his name dishonoured with their connivance, much less sanction and example. Angels are commanded to worship him [Heb. 1:6]. He employs them as his ministers in advancing the interests of his kingdom. Are magistrates, wielding, as the nation’s representatives, the national power and influence, exempted from this universal law?

Is civil government, which God has ordained for his own glory, and for good to man, to be the only exception? Are civil rulers not to be called upon to “serve him” to whom angels minister? are they alone of all moral agents at liberty to refuse to promote the ends of the mediatorial administration? It cannot be.

“All kings shall fall down before him: all nations shall serve him,” Ps. lxxii. 11. They must “serve him,” by so directing their measures, and so employing their resources, as to facilitate the spread of truth, and throw on its side the influence of the national sanction; by furnishing aid to the church in executing her righteous schemes of piety and benevolence; by removing every outward hindrance, so far as it can be done; by restraining gross violators of the moral law of both tables; thus infusing into the whole frame and actings of the machinery of the government a spirit of opposition to error, and wrong, and impiety, and of favour to truth, and morality, and godliness.

This they can never do, unless they acknowledge, and honour, and defend, and support the Christian church. The magistrate may not, indeed, interfere with the church’s independence, or attempt to discharge spiritual functions, but he is to aid the church in effecting the ends of her organization, and thus promote the knowledge and service of God the Redeemer.</p></blockquote>

<blockquote><p>Writing in the late 1820s (the Reformed Presbyterian reprinted his writings much later), William MacKray warned the Scottish Voluntaryists to look to the United States of America as an example of the wickedness that the implementation of Voluntaryism would lead to:

And, my brethren, we are not left on this subject to reasoning of a merely inferential nature. There is one country in which the new scheme has been tried-and not only so, but tried in contrast with the opposite plan. That country you are aware, is America-the region which we now hear so often and ignorantly eulogised, as the land where freedom is triumphing and religion flourishing, and almost every man happy to his heart’s content. The comparative merits of the two systems have been tried there; and the result has been such as to do more than warrant the sentiments I have been expressing; it has been such as ought utterly and for ever to silence the foes of an Establishment; it has been such as, I do hope, will lead the American people themselves to see the duty of renouncing their present infidel atheistical constitution and of adopting another, that will look with a friendly and supporting aspect on the interests of religion and the Church of God. The population of the American states is computed to be at this day twelve millions of human beings.* In almost all the states, the government has made no provision for the religious instruction of the people. The consequence is, that, after the operation of the “Voluntary” system for the space of half a century, there are eight millions of the people who are wholly uninstructed in the religion of Jesus Christ.

I ask you, my brethren, if it is not utterly appalling to think of the government of a land – claiming to be a Christian land – having the means of diffusing religious knowledge to its remotest bounds, nevertheless neglecting to do so; permitting one generation of its subjects after another to live and die in ignorance and heathenism. In how immensely different circumstances might these masses of degraded and perishing immortals have been, if the government, actuated by Christian benevolence, had appropriated a portion of its revenues to provide, throughout the vast tract of its territory, pious and evangelical preachers of the gospel, and instructors of the youth in the knowledge of God’s blessed word! Suppose that, in all the states, there had been adopted the system on this point, which, for many years, has obtained in the state of Connecticut; that is to say, that they had made provision from the public revenue for the support of religion, the consequence would have been, that throughout the American territory, the general population would have been in the same advantageous circumstances, in point of religious instruction, with the people of that state. But how lamentably are matters the reverse of this! It was recorded by Dr. Dwight thirty years ago, that in the territory of Connecticut, every twelve hundred inhabitants enjoyed the privilege of a stated gospel ministry. Nor, so far as I am aware, has the supply of the means of religious instruction in that province, fallen behind the increase of its population. But look abroad over the other states. In some of them, you find only sixty ministers to a population of a million of souls. In others, the supply of religious instruction is still more deficient. Nay, there are whole districts of country, containing from twenty to fifty thousand inhabitants, entirely destitute of the knowledge of Christianity.

This, my brethren, is the state of matters in America at this day; and I appeal to you, if it does not furnish a striking proof of the grievous insufficiency of the voluntary system. Thirty years ago, the people of one state, where the principle which we advocate was acted on, were amply provided with the means of Christian knowledge. Whereas, in the other states, where the opposite principle has been adopted – where the government has made no provision for the support of religion – two thirds of the population, eight out of twelve millions of souls, are entirely destitute of religious instruction — are living and dying in total ignorance of the gospel of salvation! This, I say again, is the melancholy condition of the American states at this day. The principle of non-interference on the part of the state, in any matters connected with religion, has been in operation among them for half a century; and the result of its operation is, that two-thirds of the American continent are in a state of heathenism! This, my friends, is the land to which our Scottish people are desired to look as the scene where the “Voluntary” scheme is displaying its marvellous efficiency, and where we behold a model which we ought to imitate!</p></blockquote>

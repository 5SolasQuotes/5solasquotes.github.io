<blockquote><p>Since the creature must pattern his ways after his Creator’s, and since the Creator rested only after he had worked, it was a covenant of works which was proffered to Adam as the means by which to arrive at the consummation. In the sense that it was the door to the consummation, this original Covenant of Creation was eschatological.

That door, however, was never opened. It was not the Fall in itself that delayed the consummation. According to the conditions of the Covenant of Creation the prospective consummation was either/or. It was either eternal glory by covenantal confirmation or original righteousness or eternal perdition by covenant-breaking repudiation of it.

The Fall, therefore, might have been followed at once by a consummation of the curse of the covenant. The delay was due rather to the principle and purpose of divine compassion by which a new way of arriving at the consummation was introduced, the way of redemptive covenant with common grace as its historical corollary.</p></blockquote>

<blockquote><p>1. I shall confirm this great truth, and evince the being of such a covenant. It is altogether denied by the Arminians that there was any such covenant, and amongst ourselves by Professor Simson, that it was a proper covenant. The weight of this matter lies here, that if the covenant made with Adam was not a proper covenant, he could not be a proper representing head; and if he was not, then there cannot be a proper imputation of Adam’s sin unto his posterity. None could ever dream, but there must be a manifest difference betwixt covenants between God and man, and those between men and men. There is no manner of equality betwixt God and man; God could require all duty of men without any covenant; yea, they have nothing but what is from him, and so owe it to him. But those things do not hinder, that, upon God’s condescending to enter into a covenant with man, there may be a proper covenant betwixt them. Though all similitudes here must halt; yet let us suppose a father to propose to his son, that if he will obey his orders, and especially in one point give him punctual obedience, for instance, labour his vineyard, he will give him a certain sum of money; and the son having nothing to labour it with, the father furnishes him with all things necessary thereto; the son accepts of this proposal. Can any man say that there is not a proper bargain, or covenant, in this case betwixt the father and his son, although the son was tied by the bond of nature to obey his father’s commands in all this antecedently to the bargain, and though he has nothing to labour it with, but what he has from the father? Let him perform his father’s orders now according to the covenant, and he can challenge the sum as a debt, which he could not do before. For proof this, consider, 1. Here is a concurrence of all that is necessary to constitute a true and proper covenant of works. The parties contracting, God and man; God requiring obedience as the condition of life; a penalty fixed in case of breaking; and man acquiescing in the proposal. The force of this cannot be evaded, by comparing it with the consent of subjects to the laws of an absolute prince. For such a law proposed by a prince, promising a reward upon obedience to it, is indeed the proposing of a covenant, the which the subject consenting to for himself and his, and taking on him to obey, does indeed enter into a covenant with the prince, and having obeyed the law may claim the reward by virtue of paction. And so the covenant of works is ordinarily in scripture called “the law,” being in its own nature a pactional law.

2. It is expressly called a covenant in scripture, Gal. 4:2, “For these are the two covenants, the one from the Mount Sinai,” &amp;c. This covenant from Mount Sinai was the covenant of works as being opposed to the covenant of grace, namely, the law of the ten commandments, with promise and sanction, as before expressed. At Sinai it was renewed indeed, but that was not its first appearance in the world. For there being but two ways of life to be found in scripture, one by works, the other by grace; the latter hath no place, but where the first is rendered ineffectual; therefore the covenant of works was before the covenant of grace in the world; yet the covenant of grace was promulgated quickly after Adam’s fall; therefore the covenant of works behoved to have been made with him before. And how can one imagine a covenant of works set before poor impotent sinners, if there had not been such a covenant with man in his state of integrity? Hos. 6:7, “But as for them; like Adam, they have transgressed the covenant.” Our translators set the word Adam on the margin. But in Job 31:33, they translate the very same word, “as Adam.” This word occurs but three times in scripture, and still in the same sense. Job 31:33, “If I covered my transgressions, as Adam,” Psalm 82:7, “But ye shall die like Adam.” Compare ver. 6, “I have said, Ye are gods; and all of you are children of the Most High;” compared with Luke 3:38, “Adam, which was the son of God.” And also here, Hos. 6:7. While Adam’s hiding his sin, and his death are made an example, how natural is it that his transgression, that led the way to all, be made so too? This is the proper and literal sense of the words; it is so read by several, and is certainly the meaning of it.

3. We find a law of works opposed to the law of faith, Rom. 3:27. “Where is boasting then? It is excluded. By what law? of works? Nay; but by the law of faith.” This law of works is the covenant of works, requiring works, or obedience, as the condition pleadable for life; for otherwise the law as a rule of life requires works too. Again, it is a law that does not exclude boasting, which is the very nature of the covenant of works, that makes the reward to be of debt. And further, the law of faith is the covenant of grace; therefore the law of works is the covenant of works. So Rom. 6:14, “Ye are not under the law, but under grace.” And this was the way of life without question, which was given to Adam at first.</p></blockquote>

<blockquote><p>I shall confirm this great truth, and evince the being of such a covenant. It is altogether denied by the Arminians that there was any such covenant, and amongst ourselves by Professor [John] Simson, that it was a proper covenant. The weight of this matter lies here, that if the covenant made with Adam was not a proper covenant, he could not be a proper representing head; and if he was not, then there cannot be a proper imputation of Adam’s sin unto his posterity. None could over dream, but there must be a manifest difference betwixt covenants between God and man, and those between men and men. There is no manner of equality betwixt God and man; God could require all duty of men without any covenant; yea, they have nothing but what is from him, and so owe it to him.

But those things do not hinder, that, upon God’s condescending to enter into a covenant with man, there may be a proper covenant betwixt them. Though all similitudes here must halt; yet let us suppose a father to propose to his son, that if he will obey his orders, and especially in one point give him punctual obedience, for instance, labour his vineyard, he will give him a certain sum of money; and the son having nothing to labour it with, the father furnishes him with all things necessary thereto; the son accepts of this proposal. Can any man say that there is not a proper bargain, or covenant, in this case betwixt the father and his son, although the son was tied by the bond of nature to obey his father’s commands in all this antecedently to the bargain, and though he has nothing to labour it with, but what he has from the father? Let him perform his father’s orders now according to the covenant, and he can challenge the sum as a debt, which he could not do before. For proof of this, consider, …

Here is a concurrence of all that is necessary to constitute a true and proper covenant of works. The parties contracting, God and man; God requiring obedience as the condition of life; a penalty fixed in case of breaking; and man acquiescing in the proposal. The force of this cannot be evaded, by comparing it with the consent of subjects to the laws of an absolute prince. For such a law proposed by a prince, promising a reward upon obedience to it, is indeed the proposing of a covenant, the which the subject consenting to for himself and his, and taking on him to obey, does indeed enter into a covenant with the prince, and having obeyed the law may claim the reward by virtue of paction. And so the covenant of works is ordinarily in scripture called ”the law,” being in its own nature a pactional law. …

It is expressly called a covenant in scripture, Gal. iv. 24, “For these are the two covenants, the one from the Mount Sinai,” &amp;c. This covenant from Mount Sinai was the covenant of works as being opposed to the covenant of grace, namely, the law of the ten commandments, with promise and sanction, as before expressed. At Sinai it was renewed indeed, but that was not its first appearance in the world. For there being but two ways of life to be found in scripture, one by works, the other by grace; the latter hath no place, but where the first is rendered ineffectual; therefore the covenant of works was before the covenant of grace in the world; yet the covenant of grace was promulgated quickly after Adam’s fall; therefore the covenant of works behoved to have been made with him before.

And how can one imagine a covenant of works set before poor impotent sinners, if there had not been such a covenant with man in his state of integrity? Hos. vi. 7, “But as for them; like Adam, they have transgressed the covenant.” Our translators set the word Adam on the margin. But in Job xxxi. 33, they translate the very same word, “as Adam.” This word occurs but three times in scripture, and still in the same sense. Job xxxi. 33, “If I covered my transgressions, as Adam,” Psalm Ixxxii. 7, “But ye shall die like Adam.” Compare ver. 6, “I have said. Ye are gods; and all of you are children of the Most High;” compared with Luke iii. 38, “Adam, which was the son of God.” And also here, Hos. vi. 7. While Adam’s hiding his sin, and his death are made an example, how natural is it that his transgression, that led the way to all, be made so too? This is the proper and literal sense of the words; it is so read by several, and is certainly the meaning of it. …

We find a law of works opposed to the law of faith, Rom. iii. 27, “Where is boasting then? It is excluded. By what law? of works? Nay; but by the law of faith.” This law of works is the covenant of works, requiring works, or obedience, as the condition pleadable for life; for otherwise the law as a rule of life requires works too. Again, it is a law that does not exclude boasting, which is the very nature of the covenant of works, that makes the reward to be of debt. And further, the law of faith is the covenant of grace; therefore the law of works is the covenant of works. So Rom. vi. 14, “Ye are not under the law, but under grace.” And this was the way of life without question, which was given to Adam at first. …

There were sacramental signs and seals of this transaction in paradise. As it has pleased the Lord still to deal with man in the way of a covenant, so to append seals to these covenants. God’s covenant with Noah, that he would not destroy the earth again with water, had the rainbow as a sign of it to confirm it. Gen. ix. 12, 13. The covenant with Abraham had circumcision; that with the Israelites, circumcision and the passover; and the new covenant with the New Testament church, baptism and the Lord’s supper. So to the covenant of works God appended the two trees; the tree of life, Gen. iii. 22, ”And now lest he put forth his hand, and take also of the tree of life, and eat, and live for ever;” and the tree of the knowledge of good and evil, mentioned in the words of the text. When we find then confirming seals of this transaction, we must own it to be a covenant. …

Lastly, All mankind are by nature under the guilt of Adam’s first sin; Rom. v. 12, “As by one man sin entered into the world, and death by sin, and so death passed upon all men, for that all have sinned.” And they are under the curse of the law before they have committed actual sin: hence they are said to be “by nature children of wrath,” Eph. ii. 3, which they must needs owe to Adam’s sin, as imputed to them. This must be owing to a particular relation betwixt them and him; which must either be, that he is their natural head simply, from whence they derive their natural being; but then the sins of our immediate parents, and all other mediate ones too, behoved to be imputed rather than Adam’s, because our relation to them is nearer; or because he is our federal head also, representing us in the first covenant. And that is the truth, and evidences the covenant of works made with Adam to have been a proper covenant.</p></blockquote>

<blockquote><p>Thus also He made man with free will; and although ignorant of his future fall, yet therefore happy, because he thought it was in his own power both not to die and not to become miserable. And if he had willed by his own free will to continue in this state of uprightness and freedom from sin, assuredly without any experience of death and of unhappiness he would have received by the merit of that continuance the fulness of blessing with which the holy angels also are blessed; that is, the impossibility of falling any more, and the knowledge of this with absolute certainty. For even he himself could not be blessed although in Paradise, nay, he would not be there, where it would not become him to be miserable, if the foreknowledge of his fall had made him wretched with the dread of such a disaster.

But because he forsook God of his free will, he experienced the just judgment of God, that with his whole race, which being as yet all placed in him had sinned with him, he should be condemned. For as many of this race as are delivered by God’s grace are certainly delivered from the condemnation in which they are already held bound. Whence, even if none should be delivered, no one could justly blame the judgment of God. That, therefore, in comparison of those that perish few, but in their absolute number many, are delivered, is effected by grace, is effected freely: thanks must be given, because it is effected, so that no one may be lifted up as of his own deservings, but that every mouth may be stopped, and he that glorieth may glory in the Lord.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Thus also He made man with free will; and although ignorant of his future fall, yet therefore happy, because he thought it was in his own power both not to die and not to become miserable. And if he had willed by his own free will to continue in this state of uprightness and freedom from sin, assuredly without any experience of death and of unhappiness he would have received by the merit of that continuance the fulness of blessing with which the holy angels also are blessed; that is, the impossibility of falling any more, and the knowledge of this with absolute certainty. For even he himself could not be blessed although in Paradise, nay, he would not be there, where it would not become him to be miserable, if the foreknowledge of his fall had made him wretched with the dread of such a disaster.

But because he forsook God of his free will, he experienced the just judgment of God, that with his whole race, which being as yet all placed in him had sinned with him, he should be condemned. For as many of this race as are delivered by God’s grace are certainly delivered from the condemnation in which they are already held bound. Whence, even if none should be delivered, no one could justly blame the judgment of God. That, therefore, in comparison of those that perish few, but in their absolute number many, are delivered, is effected by grace, is effected freely: thanks must be given, because it is effected, so that no one may be lifted up as of his own deservings, but that every mouth may be stopped, and he that glorieth may glory in the Lord.”

— Augustine of Hippo, A Treatise on Rebuke and Grace, (c. 427), 28 in Nicene and Post-Nicene Fathers 1, 5: 483.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus+also+He+made+man+with+free+will%3B+and+although+ignorant+of+his+future+fall%2C+yet+therefore+happy%2C+because+he+thought+it+was+in+his+own+power+both+not+to+die+and+not+to+become+miserable.+And+if+he+had+willed+by+his+own+free+will+to+continue+in+this+state+of+uprightness+and+freedom+from+sin%2C+assuredly+without+any+experience+of+death+and+of+unhappiness+he+would+have+received+by+the+merit+of+that+continuance+the+fulness+of+blessing+with+which+the+holy+angels+also+are+blessed%3B+that+is%2C+the+impossibility+of+falling+any+more%2C+and+the+knowledge+of+this+with+absolute+certainty.+For+even+he+himself+could+not+be+blessed+although+in+Paradise%2C+nay%2C+he+would+not+be+there%2C+where+it+would+not+become+him+to+be+miserable%2C+if+the+foreknowledge+of+his+fall+had+made+him+wretched+with+the+dread+of+such+a+disaster.%0A%0ABut+because+he+forsook+God+of+his+free+will%2C+he+experienced+the+just+judgment+of+God%2C+that+with+his+whole+race%2C+which+being+as+yet+all+placed+in+him+had+sinned+with+him%2C+he+should+be+condemned.+For+as+many+of+this+race+as+are+delivered+by+God%E2%80%99s+grace+are+certainly+delivered+from+the+condemnation+in+which+they+are+already+held+bound.+Whence%2C+even+if+none+should+be+delivered%2C+no+one+could+justly+blame+the+judgment+of+God.+That%2C+therefore%2C+in+comparison+of+those+that+perish+few%2C+but+in+their+absolute+number+many%2C+are+delivered%2C+is+effected+by+grace%2C+is+effected+freely%3A+thanks+must+be+given%2C+because+it+is+effected%2C+so+that+no+one+may+be+lifted+up+as+of+his+own+deservings%2C+but+that+every+mouth+may+be+stopped%2C+and+he+that+glorieth+may+glory+in+the+Lord.%E2%80%9D%0A%0A%E2%80%94+Augustine+of+Hippo%2C+A+Treatise+on+Rebuke+and+Grace%2C+%28c.+427%29%2C+28+in+Nicene+and+Post-Nicene+Fathers+1%2C+5%3A+483.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc9f03dff6b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c9f03dff6b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/07/04/augustine-of-hippo-on-adams-potentiality-to-attain-eternal-life/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The covenant of works is that in which God promiseth everlasting life unto a man that in all respects performeth perfect obedience to the law of works, adding thereunto threatenings of eternal death, if he shall not perform perfect obedience thereto. God made this covenant in the beginning with the first man Adam, whilst he was in the first estate of integrity: the same covenant God did repeat and make again by Moses with the people of Israel.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-324bf4807f" data-kw="">
<blockquote><p>Alongside of the archetypal knowledge of God, found in God Himself, there is also an ectypal knowledge of Him, given to man by revelation. The latter is related to the former as a copy is to the original, and therefore does not possess the same measure of clearness and perfection. All our knowledge of God is derived from His self-revelation in nature and in Scripture. Consequently, our knowledge of God is on the one hand ectypal and analogical, but on the other hand also true and accurate, since it is a copy of the archetypal knowledge which God has of Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (For more on this see Recovering the Reformed Confession.)</span></figcaption>

<blockquote><p>In the order of eminence he [Scotus] shows that 1) some eminent nature is simply first in perfection; 2) a supreme nature is uncausable; 3) a supreme nature actually exists. Next Scotus shows that this triple primacy, namely of efficiency, finality, and eminence, belongs to the same quiddity or nature. Having proved these relative properties of the first being, he proceeds further to prove the infinity of the first being. Having proved infinity, he demonstrates that God is unique in nature, using six (or seven) arguments…</p></blockquote>

<blockquote><p>1. Concerning metaphysics to be produced by the Reformed, long before me the most learned men from all sides have thought much; and who, if even the least leisure had been theirs from their affair, would here easily have borne off the prize. [William] Twisse pities the fate of Christianity that until now the students of our [reformed] academies have used no other instructors but Jesuits: and they hope to be able to aspire to the arduous progress of things where it lies open by natural light by such masters. Yet who would have been more fit than him to undertake this labor for the sake of the theological youth? Who would have more suitably cleansed that Augean stable of the Jesuits; and thus through natural reason would have paved for us the royal way to the innermost parts of sacred theology? lest the enemies of the Orthodox religion through first philosophy, defiled and polluted by them, should make a straight attack on pure and sacred theology. But that most famous man has departed; and what others would have not undeservedly demanded from him, he in vain desired in others. Must therefore so great a work be put off to the coming of Elijah or of Christ the Savior? Not indeed. Provision must especially be made for those who will one day propose the mysteries of God to the people. Provision must be made as quickly as possible, lest like the Israelites the students be perpetually compelled to borrow arms from the Philistines, the enemies of divine truth. I designate the writings of the Jesuits, which certainly are not traversed safely enough by studious youth, because they prepare the way to Pelagianism, Skepticism, Libertinism and many other things.</p></blockquote>

<blockquote><p>For we both are, and know that we are, and delight in our being, and our knowledge of it. Moreover, in these three things no true-seeming illusion disturbs us; for we do not come into contact with these by some bodily sense, as we perceive the things outside of us—colors, e.g., by seeing, sounds by hearing, smells by smelling, tastes by tasting, hard and soft objects by touching—of all which sensible objects it is the images resembling them, but not themselves which we perceive in the mind and hold in the memory, and which excite us to desire the objects. But, without any delusive representation of images or phantasms, I am most certain that I am, and that I know and delight in this. In respect of these truths, I am not at all afraid of the arguments of the Academicians, who say, ‘What if you are deceived?’ For if I am deceived, I am. For he who is not, cannot be deceived; and if l am deceived, by this same token I am. And since I am if I am deceived, how am I deceived in believing that I am? for it is certain that I am if I am deceived. Since, therefore, I, the person deceived, should be, even if I were deceived, certainly I am not deceived in this knowledge that I am. And, consequently, neither am I deceived in knowing that I know. For, as I know that I am, so I know this also, that I know. And when I love these two things, I add to them a certain third thing, namely, my love, which is of equal moment. For neither am I deceived in this, that I love, since in those things which I love I am not deceived; though even if these were false, it would still be true that I loved false things. For how could I justly be blamed and prohibited from loving false things, if it were false that I loved them? But, since they are true and real, who doubts that when they are loved, the love of them is itself true and real? Further, as there is no one who does not wish to be happy, so there is no one who does not wish to be. For how can he be happy, if he is nothing?</p></blockquote>

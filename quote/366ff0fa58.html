<main class="wrap"><figure class="quote" id="q-366ff0fa58" data-kw="">
<blockquote><p>…as we do communicate and are knit in one God, one faith, one law, one baptism, and be partakers of one spiritual table; even so we may communicate and be partakers together of and in those things, which do proceed and come unto us, by the means of the aforesaid things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-hooper.html">John Hooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief &amp; Clear Confession of the Christian faith, containing an Hundred Articles, according to the Order of the Apostles’ Creed</cite>, (1574), p. 26</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ece284cd1" data-kw="">
<blockquote><p>But seeing, as I proved, there ought to be a communion between all particular churches, not only in profession of the same faith, but also in the same specifical, and where it is possible, numerical worship, the refusing to hold this union and communion, in doctrine or worship, has the nature, and well deserves the name, of schism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Independency a Great Schism, Proved Against Dr</cite>, [John] Owen… (London, 1657), ch. 7, p. 156</span></figcaption>

</figure><figure class="quote" id="q-eaad6f599b" data-kw="">
<blockquote><p>…the Protestant Reformation marked a sharp break in the pattern of ecclesiastical finance wherever it took root… by the end of 1525, however, he [Martin Luther] was assuring the elector of Saxony that the revenues of the church belonged to the state, and that after proper payments to clergy, schools and charity, the surplus could be employed by the prince. Huldrych Zwingli and Martin Bucer, on the other hand, held that church property belonged to the religious community and that the secular ruler merely administered it. … The Calvinist church was more fully separated from past modes of finance than its Lutheran and Anglican counterparts… Elsewhere [other than Geneva], Calvinism was often a minority faith and had to depend on the voluntary support of its members… The Dutch Reformed Church was funded by the magistracy after several false starts in the 1570’s, but not at a particularly generous level.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/felicity-heal.html">Felicity Heal</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Church Finances’ in The Oxford Encyclopedia of the Reformation</cite>, vol. 1, pp. 329-31</span></figcaption>

</figure><figure class="quote" id="q-497ecc260a" data-kw="">
<blockquote><p>Secondly, Paul requires the elders of the Church of Ephesus to take heed unto and to oversee the whole flock, which did consist of more than did or could then meet together ordinarily into one place for the worship of God, as appears by the Church in the house of Aquila and Priscilla (which was one, but not the only one church assembly at Ephesus) by the great and wonderfull increase of the Gospel at Ephesus… Peter also writing to the churches of the strangers in several provinces, calls them the ‘flock’, not ‘flocks’, and commends unto the elders the feeding and oversight of that flock… No doubt they had the administration of the Word and sacraments partitive, or severally. Nor do I deny but they had a partitive several government: but there was also an union or association of them under one common government, which did denominate them to be one visible, ecclesiastical flock.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, ... (1646), bk. 2, ch. 9, p. 298</span></figcaption>

</figure><figure class="quote" id="q-9f795fda78" data-kw="">
<blockquote><p>Giving and not granting that they [the Jerusalem Christians] were all convened to prayer [in Acts 4:31], it does not follow that they did meet ordinarily in one place for partaking of Word and sacraments as one congregation, for more might convene to prayer and hearing the Word than could meet ordinarily in a congregational-way.</p></blockquote>

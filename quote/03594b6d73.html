<main class="wrap"><figure class="quote" id="q-03594b6d73" data-kw="">
<blockquote><p>Although God knows whatsoever may or can come to pass upon all supposed conditions, yet hath he not decreed anything because he foresaw it as future, or as that which would come to pass upon such conditions.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e44b964dae" data-kw="decrees of God">
<blockquote><p>That there are decrees in God both Scripture testifies (which repeatedly attributes to him foreknowledge, purpose, determinate counsel, good pleasure) and manifold reason evinces. This is true both from the highest perfection of God (to which it pertains that nothing shall take place without his will) and from his omniscience (by which he knows from eternity all his works, not only possible but also future—which he could not behold otherwise than in his decree).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.1.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-decrees-of-god/nature-of-the-decree.html">Nature of the Decree</a> › <a href="../topics/the-decrees-of-god/nature-of-the-decree/eternal-wise-free-immutable-unconditional.html">Eternal, wise, free, immutable, unconditional</a></span></div>

</figure><figure class="quote" id="q-57d6681ec7" data-kw="decrees eternal">
<blockquote><p>Are the decrees of God eternal? We affirm against Socinus. That there are decrees in God both Scripture testifies (which repeatedly attributes to him foreknowledge, purpose, determinate counsel and good pleasure) and manifold reason evinces—from the highest perfection of God (to which it pertains that nothing shall take place without his will) and from his omniscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.1–2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-decrees-of-god/nature-of-the-decree.html">Nature of the Decree</a> › <a href="../topics/the-decrees-of-god/nature-of-the-decree/eternal-wise-free-immutable-unconditional.html">Eternal, wise, free, immutable, unconditional</a></span></div>
<div class="actions"><button class="copy" data-copy="“Are the decrees of God eternal? We affirm against Socinus. That there are decrees in God both Scripture testifies (which repeatedly attributes to him foreknowledge, purpose, determinate counsel and good pleasure) and manifold reason evinces—from the highest perfection of God (to which it pertains that nothing shall take place without his will) and from his omniscience.”

— Francis Turretin, Institutes of Elenctic Theology, 4.1–2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAre%20the%20decrees%20of%20God%20eternal%3F%20We%20affirm%20against%20Socinus.%20That%20there%20are%20decrees%20in%20God%20both%20Scripture%20testifies%20%28which%20repeatedly%20attributes%20to%20him%20foreknowledge%2C%20purpose%2C%20determinate%20counsel%20and%20good%20pleasure%29%20and%20manifold%20reason%20evinces%E2%80%94from%20the%20highest%20perfection%20of%20God%20%28to%20which%20it%20pertains%20that%20nothing%20shall%20take%20place%20without%20his%20will%29%20and%20from%20his%20omniscience.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%204.1%E2%80%932&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F57d6681ec7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/57d6681ec7.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-9998183bd3" data-kw="">
<blockquote><p>The fact that some receive from God the gift of faith within time, and that others do not, stems from his eternal decree. For “all his works are known to God from eternity” (Acts 15:18; Eph. 1:11). In accordance with this decree God graciously softens the hearts, however hard, of the elect and inclines them to believe, but by a just judgment God leaves in their wickedness and hardness of heart those who have not been chosen. And in this especially is disclosed to us God’s act—unfathomable, and as merciful as it is just—of distinguishing between people equally lost. This is the well-known decree of election and reprobation revealed in God’s Word. The wicked, impure, and unstable distort this decree to their own ruin, but it provides holy and godly souls with comfort beyond words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-decrees-of-god/nature-of-the-decree.html">Nature of the Decree</a> › <a href="../topics/the-decrees-of-god/nature-of-the-decree/eternal-wise-free-immutable-unconditional.html">Eternal, wise, free, immutable, unconditional</a></span><span class="t"><a href="../topics/reprobation/hardening.html">Hardening</a> › <a href="../topics/reprobation/hardening/permission-and-hardening.html">Permission and hardening</a></span></div>

</figure><figure class="quote" id="q-c2a182aba8" data-kw="eternal decree foreknowledge">
<blockquote><p>Since the foreknowledge of God is eternal, it is necessary that the decree upon which it is founded should also be eternal (since he does not know things as future except in the decree, through which they pass from a state of possibility to a state of futurition). If the decrees were made only in time, he would take counsel as needed just like men. This agrees neither with his infinite wisdom nor with his most absolute perfection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.2.3–4</span></figcaption>

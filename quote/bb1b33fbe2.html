<blockquote><p>The magistrates sinfully required Christ to pay an Erastian, tribute tax upon the Church (Mt. 17:24–27). Christ, speaking of his example as a precedent for all his disciples for all history, chose the lesser material evil (or rather fulfilled the highest good attainable), submitted to this bondage, here declined the exercise of his (and our) Christian liberty and publicly gave that bond while verbally testifying privately (not publicly) that He was not so subject (Mt. 17:24–27).¹ ¹ See ‘On the Ethics of Paying Specific Taxes designated to a Corrupt Purpose or Imposed by a Usurped Authority or Usurper’ and ‘On the Ethics of Paying the Scottish Cess Near &amp; During the Killing Times’ at ‘On Paying Taxes’ (RBO). Is this a protestatio contraria facto, “a protestation contrary to fact,” as the non-indulged [Scottish ministers] censured the indulged with?² Did Jesus compromise his authority or the exercise of his ministry? ² Wodrow, History, 2.179 &amp; 492. Was the protest God told Samuel to make against the people’s desires having their own human king contrary to the fact when Samuel, per God’s direction, facilitated, anointed and enthroned king Saul for them? (1 Sam. 8:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, p. 151 in English Puritans, A Refutation of the Errors of Separatists (1604; 1644; RBO, 2025)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>8. They [civil magistrates] may and ought to make such [spiritual seducers] incapable of public places of trust, and remove them from such: Because, 1. They cannot be supposed to employ their power singly. 2. Because such trust agreeth not to men and subjects as such, but are voluntarily conferred as tokens of respect put upon men eminently qualified, and as may be for the good of the commonwealth: And therefore it cannot be justly accounted a marring of their liberty as men or subjects. Upon this ground was Maachah the mother of Asa removed from being Queen, or having any government, 1 Kings 15:13; 2 Chron. 15:16, yet it cannot be said she was wronged when she was so dealt with.</p></blockquote>

</figure><figure class="quote" id="q-913596b6c3" data-kw="">
<blockquote><p>1st Conclusion: Fire and sword, or war, or the coactive power of a magistrate is not God’s way of planting the Gospel in a heathen nation which never heard of the gospel before: 1. Because the apostles were commanded by teaching the gospel to all nations, Mt. 28:19-20; Mk. 16:15; Acts 7:8; and not by war to spread the gospel; 2. Because Christ’s Kingdom is not of this world, for then his servants would fight for Him (Jn. 18:36), nor are the weapons of our warfare carnal (2 Cor. 10:4), nor is Christ’s sword any other thing than the Word of God (Rev. 19:15; Gal. 6:17). And in this meaning, and with relation to the internal acts of sound believing, have the learned taught us that, religio suaderi potest, cogi non potest [‘Religion can be persuaded; it cannot be forced.’]. If these be the Constitutions of Clement, let it go for a truth in this sense, that: ‘God has given liberty of will to men, not punishing them with temporal death, but calls them to give an account of their doings in the life to come.’ …and Athanasius meant with us, when he cites that, ‘If any will come after me, let him take up his cross,’ to prove that the will cannot be compelled; and that of Lactantius is approved by all: Defendenda tamen religio est, non occidendo, sed moriendo, non saevitia, sed sapientia, non scelere, sed fide; illa enim malorum sunt, haec bonorum; et necesse est bonum in religione versari, non malum: Nam si sanguine, si tormentis, si malo religionem defendere velis, jam non defendetur illa, sed polluetur, et violabitur. Nihil est tam voluntarium quam religio, in qua si animus sacrificantis est eversus, jam sublata, jam nulla est. (Institutes, bk. 5, ch. 19) [“Religion, however, must be defended not by killing but by dying, not by cruelty but by wisdom, not by crime but by faith; for the former belong to the wicked, the latter to the good. And it is necessary that good, not evil, should be found in religion. For if you wish to defend religion by blood, by tortures, or by evil, it will no longer be defended but polluted and profaned. Nothing is so voluntary as religion; for if the heart of the worshiper is overturned, it is already destroyed—it no longer exists.”] All which tends to this, that religion is like free-will, and free-will like a virgin which cannot be ravished. Let that of Tertullian stand, Lex nostra non se vindicat ultore gladio [‘Our Law does not avenge itself with the avenging sword.’]. Procopius says that Justinian was blamed, because he compelled the Samaritans to embrace the Christian faith. (Procopius, in Arca. Histor.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (London: 1644), pt. 2, ch. 6, p. 353</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>They [Papists] do not only say… that one born in an heretical country may deny his country, but that by heresy a man, nay, a king, is deprived of all his jurisdiction, whether natural, civil or politic… One of their own bishops says, “As soon as a Christian king becomes heretical, forthwith the people are freed from subjection.” A cardinal says, “As long as the prince continues excommunicated (as he must do ever, if he be not a Romanist, for the Pope excommunicates ipso facto all heretics) the subject is freed from the oath of subjection,” but by whom? By the Pope, says a Jesuit, who upon just cause has power to absolve from oaths both himself, (as Gregory the 12th did when he sware that if he were chosen Pope he would give it over) and all others. If he be personally excommunicated, then, says their lawyer, subjects are freed from their allegiance and all his heretical assistants are to be rooted out, and their land to be exposed to be possessed of (strangers) Catholics. Nay, says another lawyer, if he be not excommunicated, yet if his heresy be publicly known, there needs no pronunciation of the sentence of excommunication, so that (says the Jesuit) subjects may lawfully deny him obediencer? How so? For the evidence of the crime, (says their whole school, and make it a matter of certainty and faith) does infer a sentence of condemnations because (as the more common opinion does define it) there must we understand the Pope’s will to have him excommunicated, whom upon the knowledge of his fault he would excommunicate. Nay, suppose that a Protestant prince have a just quarrel: yet, no war can be lawfully denounced or waged by the Queen (being excommunicated by name) though otherwise in itself it were most just: because her power is unlawful.</p></blockquote>

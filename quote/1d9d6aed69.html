<main class="wrap"><figure class="quote" id="q-1d9d6aed69" data-kw="">
<blockquote><p>The mind of the person who does not seek the sight of her Creator is very hard because she persists in a frozen state on account of herself. But if in the present time she starts to burn with the desire to follow him whom she loves, ‘melted’ by the fire of love, she runs. She becomes eager with desire. She reviles all worldly things that used to bring her pleasure. Nothing except her Creator pleases her.

What first delighted her soul afterward becomes grievously burdensome. Nothing consoles her grief as long as she has still not looked upon him whom she desires. Her mind sorrows. Light itself is wearisome. Scorching fire burns away the rust of sin in her mind. The soul is enflamed like gold because gold loses its luster through use but regains its brightness through fire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-the-great.html">Gregory the Great</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Excerpts from the Works of Gregory the Great on the Song of Songs. Compiled by Paterius and Bede</cite>, (1705) in Gregory the Great on the Song of Songs, trans. Mark DelCogliano (Collegeville MN: Liturgical Press, 2012), p. 173.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>The Anatomie of Abuses probably carried additional weight with a certain class, because in its attitude toward the drama it took in the first edition a liberal position. The preface of that edition was careful to explain that its author did not condemn all plays. ‘Who seeth not,’ it read, ‘that some kind of playes, tragedies and enterluds, in their own nature are not onely of great ancientie, but also very honest and very commendable exercyses,’ containing matter ‘both of doctrine, erudition, good example, and wholsome instruction; And may be vsed, in tyme and place conuenient, as conducible to example of life and reformation of maners.’ In thus commending ‘honest &amp; chast playes’ as a Godly recreation of the min,’ and as a ‘good example of life,’ Stubbes advanced close to Lodge’s position. Yet, strange to say, in all subsequent editions this explanatory preface was left out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-stubbes.html">Philip Stubbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Stubbes’ Outlook | Elbert N.S. Thompson, XX. The Controversy Between the Puritans &amp; the Stage in Yale Studies in English PhD diss. (NY: Henry Holt &amp; Co., 1903), pp. 81-82</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-53bee3b9e5" data-kw="">
<blockquote><p>Those who speak out more plainly than bishop [David] Lindsay [d. 1641], do here (section 14) object to us that reverence is due to the sacrament, and that we ourselves do reverence it when we sit uncovered at the receiving of it. But Didoclavius [a pseudonym for the Scottish presbyterian, David Calderwood] does well distinguish betwixt veneration and adoration (Altare Damascenum, 1623, p. 809), because in civility we use[d] to be uncovered, even to inferiors and equals for the regard which we bear to them, yet do we not worship them, as we worship the king on our knees. As, then, in civility there is a respect and reverence different from adoration, so it is in religion also. Yea [Cardinal Robert] Bellarmine himself [a papal apologist] distinguishes the reverence which is due to holy things from adoration. Paybody and Dr. Burgesse [Formalists] will by no means admit this distinction betwixt veneration and adoration. But since neither of them has alleged any reason against it, I hope they will be weighed down by the authority of the [Romanist] Archbishop of Spalato [d. 1624], and the bishop of Edinburgh [David Lindsay], both of which agree to this distinction. So, then, we give no adoration at all to the sacrament, because neither by any outward nor inward action do we perform any worship for the honor of the same. Burgesse himself has noted to us that the first Nicene Council exhorts that men should not be humiliter intenti [basely stretched out] to the things before them. We neither submit our minds nor humble our bodies to the sacrament, yet do we render to it veneration, for as much as we esteem highly of it as a most holy thing, and meddle reverently with it, without all contempt or unworthy usage. Res profecto inanimatae [Surely inanimate things], says the Archbishop of Spalato, sint sacrae quantum placet, alium honorem a nobis non merentur, nisi in sensu negativo [may be sacred so far as it may be fitting, not being deserving of another honor from us except in a negative sense], as that they be not contemned, nor unworthily handled. If it be said that we ought not to contemn the Word, yet has it not that respect given to it which the Sacrament has, at which we are uncovered, so that this veneration given to the sacrament must be somewhat more then non prophanatio [a non-profanation]; I answer: as honor in the positive sense, so also in the negative, has various degrees: and according to the more or less immediate manifestation of divine ordinances to us, so ought the degrees of our veneration to be intended or remitted; which is not so to be understood as if one part of God’s sacred worship were to be less contemned then another (for none of God’s most holy ordinances may be in any sort contemned), but that for the greater regard of those things which are more immediately divine, we are not in the usage of them to take to ourselves so much scope and liberty as otherwise we may lawfully allow to ourselves in meddling with such things as are not merely, but mixedly divine, and which are not from God so immediately as the other, but more by the intervention of means. And thus a higher degree of veneration is due to the sacrament than to the Word preached, not by taking ought from the Word, but by adding more respect to the sacrament than the Word has. The reason hereof is given to be this, because when we come to the sacrament, nihil hic humanum, sed Divina omnia [nothing of this is of man, but is all divine], for Christ’s own Words are, or at least should be, spoken to us when we receive the sacrament, and the elements also are by Christ’s own institution holy symbols of his blessed body and blood. Whereas the Word preached to us is but mixedly and mediately divine, and because of this intervention of the ministry of men, and mixture of their conceptions with the holy Scriptures of God, we are bidden try the spirits [1 Jn. 4:1] and are required after the example of the Bereans to search the Scriptures daily whether these things which we hear preached be so or not. Now we are not in like sort to try the elements and the words of the institution, whether they be of God or not, because this is sure to all who know out of Scripture the first principles of the oracles of God. The consideration hereof warns us that the sacrament given according to Christ’s institution is more merely and immediately divine than is the Word preached.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), 3rd Part, ‘Against the Lawfulness of the Ceremonies’, ch. 4, ‘That the Ceremonies are Idols among Formalists themselves; &amp; that kneeling in the Lord’s Supper before the Bread &amp; Wine in the act of receiving them is formally Idolatry’, pp. 62-63</span></figcaption>

Bereans to search the Scriptures daily whether these things which we hear preached be so or not. Now we are not in like sort to try the elements and the words of the institution, whether they be of God or not, because this is sure to all who know out of Scripture the first principles of the oracles of God. The consideration hereof warns us that the sacrament given according to Christ’s institution is more merely and immediately divine than is the Word preached.”

— George Gillespie, English Popish Ceremonies, (1637), 3rd Part, ‘Against the Lawfulness of the Ceremonies’, ch. 4, ‘That the Ceremonies are Idols among Formalists themselves; &amp; that kneeling in the Lord’s Supper before the Bread &amp; Wine in the act of receiving them is formally Idolatry’, pp. 62-63">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThose+who+speak+out+more+plainly+than+bishop+%5BDavid%5D+Lindsay+%5Bd.+1641%5D%2C+do+here+%28section+14%29+object+to+us+that+reverence+is+due+to+the+sacrament%2C+and+that+we+ourselves+do+reverence+it+when+we+sit+uncovered+at+the+receiving+of+it.+But+Didoclavius+%5Ba+pseudonym+for+the+Scottish+presbyterian%2C+David+Calderwood%5D+does+well+distinguish+betwixt+veneration+and+adoration+%28Altare+Damascenum%2C+1623%2C+p.+809%29%2C+because+in+civility+we+use%5Bd%5D+to+be+uncovered%2C+even+to+inferiors+and+equals+for+the+regard+which+we+bear+to+them%2C+yet+do+we+not+worship+them%2C+as+we+worship+the+king+on+our+knees.+As%2C+then%2C+in+civility+there+is+a+respect+and+reverence+different+from+adoration%2C+so+it+is+in+religion+also.+Yea+%5BCardinal+Robert%5D+Bellarmine+himself+%5Ba+papal+apologist%5D+distinguishes+the+reverence+which+is+due+to+holy+things+from+adoration.+Paybody+and+Dr.+Burgesse+%5BFormalists%5D+will+by+no+means+admit+this+distinction+betwixt+veneration+and+adoration.+But+since+neither+of+them+has+alleged+any+reason+against+it%2C+I+hope+they+will+be+weighed+down+by+the+authority+of+the+%5BRomanist%5D+Archbishop+of+Spalato+%5Bd.+1624%5D%2C+and+the+bishop+of+Edinburgh+%5BDavid+Lindsay%5D%2C+both+of+which+agree+to+this+distinction.+So%2C+then%2C+we+give+no+adoration+at+all+to+the+sacrament%2C+because+neither+by+any+outward+nor+inward+action+do+we+perform+any+worship+for+the+honor+of+the+same.+Burgesse+himself+has+noted+to+us+that+the+first+Nicene+Council+exhorts+that+men+should+not+be+humiliter+intenti+%5Bbasely+stretched+out%5D+to+the+things+before+them.+We+neither+submit+our+minds+nor+humble+our+bodies+to+the+sacrament%2C+yet+do+we+render+to+it+veneration%2C+for+as+much+as+we+esteem+highly+of+it+as+a+most+holy+thing%2C+and+meddle+reverently+with+it%2C+without+all+contempt+or+unworthy+usage.+Res+profecto+inanimatae+%5BSurely+inanimate+things%5D%2C+says+the+Archbishop+of+Spalato%2C+sint+sacrae+quantum+placet%2C+alium+honorem+a+nobis+non+merentur%2C+nisi+in+sensu+negativo+%5Bmay+be+sacred+so+far+as+it+may+be+fitting%2C+not+being+deserving+of+another+honor+from+us+except+in+a+negative+sense%5D%2C+as+that+they+be+not+contemned%2C+nor+unworthily+handled.+If+it+be+said+that+we+ought+not+to+contemn+the+Word%2C+yet+has+it+not+that+respect+given+to+it+which+the+Sacrament+has%2C+at+which+we+are+uncovered%2C+so+that+this+veneration+given+to+the+sacrament+must+be+somewhat+more+then+non+prophanatio+%5Ba+non-profanation%5D%3B+I+answer%3A+as+honor+in+the+positive+sense%2C+so+also+in+the+negative%2C+has+various+degrees%3A+and+according+to+the+more+or+less+immediate+manifestation+of+divine+ordinances+to+us%2C+so+ought+the+degrees+of+our+veneration+to+be+intended+or+remitted%3B+which+is+not+so+to+be+understood+as+if+one+part+of+God%E2%80%99s+sacred+worship+were+to+be+less+contemned+then+another+%28for+none+of+God%E2%80%99s+most+holy+ordinances+may+be+in+any+sort+contemned%29%2C+but+that+for+the+greater+regard+of+those+things+which+are+more+immediately+divine%2C+we+are+not+in+the+usage+of+them+to+take+to+ourselves+so+much+scope+and+liberty+as+otherwise+we+may+lawfully+allow+to+ourselves+in+meddling+with+such+things+as+are+not+merely%2C+but+mixedly+divine%2C+and+which+are+not+from+God+so+immediately+as+the+other%2C+but+more+by+the+intervention+of+means.+And+thus+a+higher+degree+of+veneration+is+due+to+the+sacrament+than+to+the+Word+preached%2C+not+by+taking+ought+from+the+Word%2C+but+by+adding+more+respect+to+the+sacrament+than+the+Word+has.+The+reason+hereof+is+given+to+be+this%2C+because+when+we+come+to+the+sacrament%2C+nihil+hic+humanum%2C+sed+Divina+omnia+%5Bnothing+of+this+is+of+man%2C+but+is+all+divine%5D%2C+for+Christ%E2%80%99s+own+Words+are%2C+or+at+least+should+be%2C+spoken+to+us+when+we+receive+the+sacrament%2C+and+the+elements+also+are+by+Christ%E2%80%99s+own+institution+holy+symbols+of+his+blessed+body+and+blood.+Whereas+the+Word+preached+to+us+is+but+mixedly+and+mediately+divine%2C+and+because+of+this+intervention+of+the+ministry+of+men%2C+and+mixture+of+their+conceptions+with+the+holy+Scriptures+of+God%2C+we+are+bidden+try+the+spirits+%5B1+Jn.+4%3A1%5D+and+are+required+after+the+example+of+the+Bereans+to+search+the+Scriptures+daily+whether+these+things+which+we+hear+preached+be+so+or+not.+Now+we+are+not+in+like+sort+to+try+the+elements+and+the+words+of+the+institution%2C+whether+they+be+of+God+or+not%2C+because+this+is+sure+to+all+who+know+out+of+Scripture+the+first+principles+of+the+oracles+of+God.+The+consideration+hereof+warns+us+that+the+sacrament+given+according+to+Christ%E2%80%99s+institution+is+more+merely+and+immediately+divine+than+is+the+Word+preached.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies%2C+%281637%29%2C+3rd+Part%2C+%E2%80%98Against+the+Lawfulness+of+the+Ceremonies%E2%80%99%2C+ch.+4%2C+%E2%80%98That+the+Ceremonies+are+Idols+among+Formalists+themselves%3B+%26+that+kneeling+in+the+Lord%E2%80%99s+Supper+before+the+Bread+%26+Wine+in+the+act+of+receiving+them+is+formally+Idolatry%E2%80%99%2C+pp.+62-63&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F53bee3b9e5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/53bee3b9e5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-lords-supper#:~:text=Those%20who%20speak%20out%20more%20plainly,divine%20than%20is%20the%20Word%20preached&amp;text=Those%20who%20speak%20out%20more%20plainly%20than%20bishop&amp;text=and%20immediately%20divine%20than%20is%20the%20Word%20preached" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>As for the Love-feasts used in the primitive Church:

1. They had no religious state in divine worship, but were used only as moral signs of mutual charity. The Rhemists [Romanists] will have them called Coenas dominicas. But what-says Cartwright against them? ‘We grant that there were such feasts used in times past, but they were called by the name of [Greek] or Love-feasts, not by the name of the Lord’s Supper: neither could one without sacrilege give so holy a name to a common feast, which never had ground out of the Word, and which after for just cause was thrust out by the Word of God.’

2. If it be thought, that they were used as sacred signs of Christian charity, because they were eaten in the Church. I answer, the eating of them in the Church is forbidden by the apostle. ‘What?’ says he, ‘have ye not houses to eat and to drink in?’ or despise ye the Church of God? Aperte vetat, says [David] Pareus: commessationes in Ecclesia, quocunque fueo pingantur. Vocabant [Greek] charitates: sed nihil minus erant. Erant schismatum fomenta. Singulae enim sectae suas instituebant. And a little after: Aliquae Ecclesiae obtemperasse videntur. Nam Iustini temporibus Romana Ecclesia [Greek] non habuit. (Commentary in that place)</p></blockquote>

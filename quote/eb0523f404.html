<main class="wrap"><figure class="quote" id="q-eb0523f404" data-kw="">
<blockquote><p>Although this blog accepts the basic tenet of theonomy (that the penal sanctions are, for the most part, of perpetual obligation), nevertheless, some dangerous notions concerning the judicial law have been popular in certain American theonomic circles. Among the most perverse is the denial of the Lex Triplex: the threefold division of the law into moral, judicial, and ceremonial categories. While this distinction is not absolute (many divines recognised that various laws fell into both moral and judicial categories), nonetheless, it is a useful way of distinguishing between different types of laws. The early Reformed believed that the moral-judicial laws remained valid. Owing to their emphasis on the Lex Triplex, however, they did not come to the fanatical conclusion that the entire judicial law of Moses was binding on modern states. Many American theonomists recognise this in the abstract, but fall into fallacious reasoning when it comes to applying the law today (for instance, thinking that the Old Testament gleaning-laws can be slavishly followed in modern, industrial society). If they had only properly understood the Lex Triplex such errors could have been easily avoided. To this end, Henry Bullinger warns us that denial of the Lex Triplex is a sign of madness:

Now it is to be marked, that in Moses’ judicial law there are many things proper and peculiar to the Jewish nation, and so ordained, according to the state of the place, time, and persons, that, if we should go about to thrust on and apply them all to other nations, we should seem to shew ourselves more than half mad.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 342.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b854e1dec7" data-kw="">
<blockquote><p>It is clear the question must be thus stated, for all the laws of the old Testament (which we hold in their moral equity to be perpetual) that are touching blasphemies, heresies, solicitation to worship false Gods and the breach of which the Godly Magistrate was to punish, command or forbid only such things as may be proved by two or three witnesses, and which husband and wife are not to conceal, and from which all Israel must abstain for fear of the like punishment. Deut. 13.8, 9, 10, 11. Deut. 17. 5, 6. Levit. 20. 1, 2, 3, 4, 5. But opinions in the Mind, acts of the understanding, can never be proved by witnesses and such as neither Magistrate nor Church can censure.</p></blockquote>

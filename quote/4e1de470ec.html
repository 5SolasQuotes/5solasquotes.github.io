<blockquote><p>On the Reformed side, the concept of fundamental articles appears as early as 1593 in the irenic or ecumenical theology of Francis Junius–as a response to the question of agreement between the Reformed side and the Lutherans despite significant theological differences: Junius argued that the ‘fundamentals’ or ‘fundamental articles’ are those teachings without which the Christian faith cannot be present–among which is the doctrine of God, the immutable object of faith. (Eirenicum, I, Opuscula, p. 440)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peace Token</cite>, [Eirenicum], pt. 1, pp. 440-442 (1593) in Select Smaller Theological Works ed. Abraham Kuyper (Amsterdam, 1882)</span></figcaption>

<blockquote><p>England had a divided church. Even among puritans, fault lines had visibly widened under the pressure of the civil war and its aftermath. After his own traumatic experience of the war, Baxter longed for order and peace, and he developed a lifelong yearning to bring Christians together in unity. He identified four main parties within the English church (Congregationalists, Episcopalians, Erastians, and Presbyterians), but he felt that the moderates within each party held similar views and, more importantly, could work together in practice even if their principles varied. He believed that if England’s ministers simply got on with the work of ministry, they would be too busy to notice how their differing doctrines of church government might otherwise keep them apart. So he formed the Worcestershire Association, a network open to local parish ministers of all stripes who met monthly for the purpose of mutual edification and encouragement. In 1653 they published their agreement to work together, and similar ministerial associations sprang up in other counties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Intro | For background to Baxter’s paradigmatic and influential association of moderates of the differing parties for the sake of the Gospel and pastoral work (during a political and ecclesiastical vacuum), and the other similar associations which were modeled after it, see Tim Cooper, When Christians Disagree: Lessons from the Fractured Relationship of John Owen and Richard Baxter (Crossway, 2024), pp. 23, 91-92, 104. Cooper:, p. 23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-2e1456b782" data-kw="">
<blockquote><p>religious differences should be managed religiously; that is, piously and charitably. This may be; it is possible; for it is prescribed and pressed: ‘Let us not therefore judge one another any more.’ (Rom.14:13) ‘But why dost thou judge thy brother? Or why dost thou set at nought thy brought?’ (Rom. 14:10) and ‘Let us therefore follow after the things which make for peace.’ (Rom. 14:19) And this should be: for charity is a grace of an universal extent; we owe it to all, – to the weak, to the ignorant, to the peevish, to the proud, to the good, and to the bad: ‘Owe no man any thing, but to love one another.’ (Rom. 13:8) And it is of that necessary connection with other saving graces, that we can neither have faith nor hope, unless we have charity; yea, ‘the greatest of these is charity’ (1 Cor. 13:13). And herein the true church of Christ hath ever excelled. The fathers of old, in their dealing with the Donatists, would account them their brethren, when they could not prevail with them for a reciprocation. And it is a golden saying of Bernard: ‘I will cleave to you against your will; I will cleave to you even against my own will: when ye are moved, I will be quiet; I will give place to anger, that I may not give place to the devil.’ And there is great reason for such a temper: for every difference in religion creates not a different religion: while men do hold the Head, they must needs be of the body. Where the same substantial doctrine is avowed, accidental variety is very tolerable, especially where the peace of God’s Church is not infringed. It was worthy bishop [Edward] Reynolds’s conclusion: ‘Where the same straight road to heaven is kept, a small difference of paths hinders not travelers from coming to the same inn at night.’ So neither should they bitterly contest about the next way, who steadily own the same Guide, the same rule, the same end; only, every one has not so clear an eye, nor such opportunity to know the more obscure points pertaining to the Christian religion, which others have. Therefore in these things Luther’s motto is best: ‘Where there is anything of Christ, there is love:’ and this love ‘will cover,’ not one or two, but ‘the multitude of sins’ and infirmities (1 Peter 4:8).</p></blockquote>

ch+is+not+infringed.+It+was+worthy+bishop+%5BEdward%5D+Reynolds%E2%80%99s+conclusion%3A+%E2%80%98Where+the+same+straight+road+to+heaven+is+kept%2C+a+small+difference+of+paths+hinders+not+travelers+from+coming+to+the+same+inn+at+night.%E2%80%99+So+neither+should+they+bitterly+contest+about+the+next+way%2C+who+steadily+own+the+same+Guide%2C+the+same+rule%2C+the+same+end%3B+only%2C+every+one+has+not+so+clear+an+eye%2C+nor+such+opportunity+to+know+the+more+obscure+points+pertaining+to+the+Christian+religion%2C+which+others+have.+Therefore+in+these+things+Luther%E2%80%99s+motto+is+best%3A+%E2%80%98Where+there+is+anything+of+Christ%2C+there+is+love%3A%E2%80%99+and+this+love+%E2%80%98will+cover%2C%E2%80%99+not+one+or+two%2C+but+%E2%80%98the+multitude+of+sins%E2%80%99+and+infirmities+%281+Peter+4%3A8%29.%E2%80%9D%0A%0A%E2%80%94+Richard+Steele%2C+Various+Puritans%2C+The+Morning+Exercises+at+Cripplegate...+vol.+4+%28of+6%29%2C+ed.+James+Nichols%2C+5th+ed.+%281659-1689%3B+London%3A+Tegg%2C+1844%29%2C+pp.+222-23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2e1456b782.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2e1456b782.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=religious%20differences%20should%20be%20managed%20religiously,sins%E2%80%99%20and%20infirmities%20%281%20Peter%204%3A8&amp;text=religious%20differences%20should%20be%20managed%20religiously%3B%20that%20is&amp;text=multitude%20of%20sins%E2%80%99%20and%20infirmities%20%281%20Peter%204%3A8" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>To this faith we ascribe justification and regeneration, inasmuch as it frees from terrors, and brings forth in the heart not only peace and joy, but also a new life.</p></blockquote>

<blockquote><p>2. There can come no good work from man… unless then a man be regenerate and born anew, which is by faith in Christ, he can do no acceptable work. Both these are evident out of Scripture… 2. and that by faith we are regenerate and made the sons of God, Jn. 1:12, ‘As many as receiued Him, to them He gave power to be the sons of God, even to them that believe in his name.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-d49c153858" data-kw="">
<blockquote><p>…so this [spiritual] life is begun by a union between us and Christ: He lives in us by his Spirit, and we live in Him by faith, Gal. 2:20. The Spirit is the principle of life, and faith is the means to receive it; and therefore we are said, Rom. 6:5, to be planted into the likeness of Christ’s resurrection. Planting notes a union, as a bud that is put into a stock; it becomes one with the stock, and bears fruit by virtue of the life of the stock. We no sooner are planted into Christ, but we feel the power of his life, and virtue of his resurrection; He begins to live in us, and we in him, as the graft in the stock, and as the stock in the graft.</p></blockquote>

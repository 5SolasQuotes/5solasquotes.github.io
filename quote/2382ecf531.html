<main class="wrap"><figure class="quote" id="q-2382ecf531" data-kw="">
<blockquote><p>For the transgression of my people was he stricken” (lsa. 53:8). “Thou shalt call his name JESUS: for he shall save his people from their sins” (Matt. 1:21). “The Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many” (Matt. 20:28). “The good Shepherd giveth his life for the sheep” (John’ 10:11). “Christ also loved the church and gave himself for it” (Eph. 5: 25). “Who gave himself for us, that he might redeem us from all iniquity, and purify unto himself a peculiar people” (Titus 2: 14). “To make propitiation for the sins of the people” (Heb. 2: 17). Here are seven passages which gave a clear and simple answer to our question, and their testimony, both singly and collectively, declare plainly that the death of Christ was not an atonement for sin abstractedly, nor a mere expression of Divine displeasure against iniquity, nor an indefinite satisfaction of Divine justice, but instead, a ransom-price paid for the eternal redemption of a certain number of sinners, and a plenary satisfaction for their particular sins. It is the glory of redemption that it does not merely render God placable and man pardonable, but that it has reconciled sinners to God, put away their sins, and forever perfected His set-apart ones.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Gospel of John</cite>, (Zondervan, 1962), 2.219-22 This is early Pink, at his worst. HT: David Ponter | Whenever the Holy Scriptures speak of the sufficiency of redemption, they always place it in the certain efficacy of redemption. The atonement of Christ is sufficient because it is absolutely efficacious, and because it effects the salvation of all for whom it was made. Its sufficiency lies not in affording man a possibility of salvation, but in accomplishing their salvation with invincible power. Hence the Word of God never represents the sufficiency of the atonement as wider than the design of the atonement. How different is the salvation of God from the ideas now popularly entertained of it! “As for thee also, by the blood of thy covenant I have sent forth thy prisoners out of the pit wherein is no water” (Zech. 9:11). Christ, by his death paid the ransom, and made sin’s captives his own. He has a legal right to all of the persons for whom He paid that ransom price, and therefore with God’s own right arm they are brought forth. For whom did Christ die?</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f34c6a4968" data-kw="">
<blockquote><p>XXIII. While Christ’s passion is minimized by the foregoing errors, those who teach that he died for all human beings (pro omnibus et singulis) broaden the object of his passion more than is allowable. Of course, if we take into consideration the magnitude and worthiness of the merit, we admit that it would suffice for the redemption of ten worlds; but if we take the plan of God and the intention of Christ into consideration, then it is false to say that Christ died for every person. For this reason others say that his death was sufficient for all, but not effective for all; that is, the merit of Christ, because of his worthiness, is sufficient for all, but it is not effective for all in its application, because Christ did not die with the intention that his death be applied to all. Why should He die for those for whom He would not pray?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity in</cite>, ed. John Beardslee, Reformed Dogmatics (Grand Rapids: Baker, 1977), pp. 105-6</span></figcaption>

<blockquote><p>At the end of the 17th century, in the so-called Third Antinomian Controversy English and Dutch Reformed theologians discussed the concept of imputation in its interrelationship with forgiveness, punishment, and justice… these same themes had already been extensively discussed in the preceding century in the context of debates against Socinianism, the Antinomian Controversy is framed within an interconfessional and international context, highlighting the significance of Socinians and Hugo Grotius.</p></blockquote>

</figure><figure class="quote" id="q-1e4abf0ed1" data-kw="">
<blockquote><p>Second, we confess that Christ indeed rules now, and possesses all authority, both in heaven and on earth, according to both natures. But not presently, as far as the flesh is concerned. The apostle says that we are absent from Christ now on earth, not at home, and desire to leave the body to be joined to him. On this account we say that he has indeed not yet come nor is present in his flesh, but will certainly appear again, visibly from the invisible, or rather will come for all to see.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586</cite>, 1586, ed. Jeffrey Mallinson (St. Louis: Concordia Publishing House, 2017), ch. 2, ‘Person of Christ’, Response to Thesis 17, pp. 253-54</span></figcaption>

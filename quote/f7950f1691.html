<blockquote><p>Cap. 29. He [Thomas Hobbes] is angry with those who say, [That every private man hath a property in his goods.] Among the Turks [Muslims] indeed no private man hath any property at all; under Christian Princes private men live more happily, who enjoy a property, yet not simply absolute, if we consider that the Prince hath a right to our goods in cases of necessity, as in his own, and Country’s defence, and such like cases, in this regard no man is born for himself, nor hath any man an absolute property in his own life, which he ought when occasion urgeth, lay down for his Country: Dulce &amp; decorum pro patria mori; therefore Plato saith well, That our Country requires a share in our birth; the property then of the subject excludeth not the Princes right in cases of necessity, but only his arbitrary power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Leviathan drawn out with a hook, or, Animadversions upon Mr. Hobbs his Leviathan. Together with some observations upon Sir Walter Raleigh’s History of the World</cite>, (London: Richard Royston, 1653), p. 31.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7fcc491e11" data-kw="">
<blockquote><p>Wherever there is a choice between candidates, where one of those candidates, if elected, will clearly do more to uphold the moral law of God to protect the good and punish evil, you have a moral obligation before God to vote for that candidate. That is how you exercise your God-given authoritative position as voter, to protect the good and punish the evil… Now no one exercises authority perfectly: no parent, police officer, professor, or president. But when you are in any of these or other positions of authority, you are obligated, in every instance, to do what is most good and least evil…. the raison d’être of all authorities: punishing the evil and protecting the good…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ray-e-heiple-jr.html">Ray E. Heiple Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Biblical Case for the Christian Principles of Voting</cite>, (2024) at The Aquila Report</span></figcaption>

</figure><figure class="quote" id="q-850ecbb720" data-kw="">
<blockquote><p>That the heavy hand of God upon a Nation, as it is laid on for sin, so for the most part not merely for punishment and destruction, but to discover to us the evil of our doings, that they may be repented of, and put away. And so there is much mercy in the midst of these Judgments, if they be improved to those ends to which their nature is fitted for, and which we are commanded to make of them.

The greatest of these Calamities to those that remain, are but like the sounding of a Trumpet, the giving an Alarm, the shooting off a Warning-piece, the hanging forth of a white Flag, and all speak to this purpose, That though the Sins of a Nation have been exceeding great and provoking, whereby the Anger of the most holy God is justly kindled against them, which he sends these his Judgments to testify, that yet he is willing to put up all former affronts that have been offered, if now at length they will become a reformed People, and with detestation of their sins turn from them unto God and his holy Ways; but if not, that his anger shall not be turned away, but his hand stretched out still, till he hath made a full end of them, and will follow them with judgment after judgment, till they are cast into the lowest hell.

So that you see plainly the Rod, hath a voice, and is a kind of Sermon, but comes nearer to the sense, and will force an observance more than mere words could do. We could choose whether we would read a Bible or good Book, or regard a Minister or godly Neighbour, giving us this very Lesson as plainly, but in a more gentle manner. We could stop our ears, or turn our backs, or harden our hearts against all the most awakening, startling Truths: We could make a pish of the most dreadful threatenings in the Book of God, denounced against those very sins we committed; we could laugh at our Teachers and Reprovers, and scorn at the offers of their love for our recovery.

And when we were sunk into such a deplorable estate, wanting nothing of falling head-long into Hell, but the withdrawing of that miraculous patience which kept us out every moment, then in infinite mercy did our God, who like a wise Physician, suits his potions to the nature of the disease, and temper of his Patients, make bare his Arm, and reveal himself and his pleasure to us, in a way most likely to affect us, if we who yet survive, be not obstinately bent upon our own destruction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-mead.html">Matthew Mead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Solomon’s prescription for the removal of the pestilence, or, The discovery of the plague of our hearts, in order to the healing of that in our flesh</cite>, (London, 1665), p. 6.</span></figcaption>

</figure><figure class="quote" id="q-95ae612f15" data-kw="">
<blockquote><p>B.—You have not forgotten, I imagine, what is said by the poets of the furies, and by the populace of devils, that they are spirits hostile to the human race, and, in the midst of their own eternal torments, delighting in the torture of men. This is certainly a true picture of tyranny. But, since this picture is discernible only to the mind, and without sensation, I shall offer you another, which will impress not only your mind, but your senses, and rush upon your eyes almost palpably visible. Imagine yourself viewing a ship at sea, tossed by storms, and all the shores around not only destitute of harbours, but full of inveterate enemies.

Imagine also the master of that ship engaged in a mutual contest of hatred with the passengers, and yet having no hopes of safety but in the fidelity of the sailors, and even those not certain, as he cannot be ignorant that his life is in the hands of a barbarous class of men, strangers to all humanity, retained in their duty solely by proffers of money, and easily tempted to his destruction by the prospect of greater hire. Such, positively, is the life embraced by tyrants as a state of beatitude. Abroad they dread open enemies, at home their subjects; and not only their subjects, but their domestics, their relations, their brothers, their wives, their children, and their parents. Accordingly, they always either wage or dread an external war with foreigners, a civil war with their subjects, or a domestic war with their relations, and never expect any assistance but from hirelings, and dare not hire the good nor trust the bad.

What enjoyment then can life be to such men? Dionysius, dreading the application of a razor to his throat, would not permit his daughters, ladies of adult age, to supply the place of a barber. His brother was murdered by Timoleon, the Pheræan Alexander by his wife, and Spurius Cassius by his father. What racks must the man, who has these examples constantly before his eyes, carry in his breast, when he considers himself erected as a mark at which all mankind are to shoot their arrows? when he is tormented by the stings of conscience, not only when awake, but is roused even in his sleep by the terrific images of the living and the dead, and pursued by the furies shaking their torches? For the time assigned by nature to all animals for repose, and to men as a relief from cares, becomes to him all horror and despair?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-buchanan.html">George Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Jure Regni Apud Scotos; A Dialogue Concerning the Rights of the Crown in Scotland</cite>, trans. Robert MacFarlan (1579; Colorado Springs: Portage Publications, 2016), pp 44-45.</span></figcaption>

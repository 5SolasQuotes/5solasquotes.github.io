<blockquote><p>Or whether any sin may become a sin unto death, or the sin against the Holy-Ghost, by reason of such circumstances as may attend it?</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ef21986ea3" data-kw="">
<blockquote><p>It [Heb. 10:26] tells you what sin it is, viz. ‘sinning wilfully after we have received the knowledge of the truth’: It limits to you why it is called a sin unto death, because there is no other way upon the committing of it, but a certain fearful expectation of judgment and fiery indignation. And it gives you some intimation why no praying for it: because [there is] no sacrifice for it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sin Unto Death, a Sermon’ on 1 Jn. 5:16</cite>, (1666) in Whole Works, ed. Pitman (1822), vol. 6, pp. 331-45, p. 1096</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“It [Heb. 10:26] tells you what sin it is, viz. ‘sinning wilfully after we have received the knowledge of the truth’: It limits to you why it is called a sin unto death, because there is no other way upon the committing of it, but a certain fearful expectation of judgment and fiery indignation. And it gives you some intimation why no praying for it: because [there is] no sacrifice for it…”

— John Lightfoot, ‘A Sin Unto Death, a Sermon’ on 1 Jn. 5:16 (1666) in Whole Works, ed. Pitman (1822), vol. 6, pp. 331-45, p. 1096">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+%5BHeb.+10%3A26%5D+tells+you+what+sin+it+is%2C+viz.+%E2%80%98sinning+wilfully+after+we+have+received+the+knowledge+of+the+truth%E2%80%99%3A+It+limits+to+you+why+it+is+called+a+sin+unto+death%2C+because+there+is+no+other+way+upon+the+committing+of+it%2C+but+a+certain+fearful+expectation+of+judgment+and+fiery+indignation.+And+it+gives+you+some+intimation+why+no+praying+for+it%3A+because+%5Bthere+is%5D+no+sacrifice+for+it%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+John+Lightfoot%2C+%E2%80%98A+Sin+Unto+Death%2C+a+Sermon%E2%80%99+on+1+Jn.+5%3A16+%281666%29+in+Whole+Works%2C+ed.+Pitman+%281822%29%2C+vol.+6%2C+pp.+331-45%2C+p.+1096&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fef21986ea3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ef21986ea3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-not-praying-for-the-one-who-has-sinned-unto-death-1-jn-516-17/#:~:text=It%20%5BHeb.%2010%3A26%5D%20tells%20you%20what,there%20is%5D%20no%20sacrifice%20for%20it&amp;text=It%20%5BHeb.%2010%3A26%5D%20tells%20you%20what%20sin%20it&amp;text=it%3A%20because%20%5Bthere%20is%5D%20no%20sacrifice%20for%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-542411a48a" data-kw="degrees">
<blockquote><p>Hence it appears that the question does not concern the equality of sins or gradual inequality, but their essential demerit. The question is not whether all sins are equal to each other (the paradox of the ancient Stoics and falsely charged upon us by our opponents). If all sins agree in being mortal, it does not follow that they are equal in all things because they can differ from each other as to degree of demerit, so as to deserve a greater or lesser punishment. Rather the question is only whether they are equally mortal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.4.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a> › <a href="../topics/sin/degrees-of-sin/great-and-small.html">Great and small</a></span></div>
<div class="actions"><button class="copy" data-copy="“Hence it appears that the question does not concern the equality of sins or gradual inequality, but their essential demerit. The question is not whether all sins are equal to each other (the paradox of the ancient Stoics and falsely charged upon us by our opponents). If all sins agree in being mortal, it does not follow that they are equal in all things because they can differ from each other as to degree of demerit, so as to deserve a greater or lesser punishment. Rather the question is only whether they are equally mortal.”

— Francis Turretin, Institutes of Elenctic Theology, 9.4.3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence%20it%20appears%20that%20the%20question%20does%20not%20concern%20the%20equality%20of%20sins%20or%20gradual%20inequality%2C%20but%20their%20essential%20demerit.%20The%20question%20is%20not%20whether%20all%20sins%20are%20equal%20to%20each%20other%20%28the%20paradox%20of%20the%20ancient%20Stoics%20and%20falsely%20charged%20upon%20us%20by%20our%20opponents%29.%20If%20all%20sins%20agree%20in%20being%20mortal%2C%20it%20does%20not%20follow%20that%20they%20are%20equal%20in%20all%20things%20because%20they%20can%20differ%20from%20each%20other%20as%20to%20degree%20of%20demerit%2C%20so%20as%20to%20deserve%20a%20greater%20or%20lesser%20punishment.%20Rather%20the%20question%20is%20only%20whether%20they%20are%20equally%20mortal.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%209.4.3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F542411a48a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/542411a48a.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-3c8c15e343" data-kw="wages curse">
<blockquote><p>The reasons are: (1) “The wages of sin is death” (Rom. 6:23) and “the soul that sinneth, it shall die” (Ezk. 18:20). These deal not with any sin in particular, but with sin in general. Thus either venial sin is not sin or it deserves death and so is not venial. Second, the terrible formula of the law proves this: “Cursed be he that confirmeth not all the words of this law to do them” (Dt. 27:26; Gal. 3:10). If every deviation from the law deserves a curse and every sin is illegality, no sin can be granted (even the smallest) which does not bring upon it the curse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.4.7-8</span></figcaption>

</figure><figure class="quote" id="q-5497189f15" data-kw="">
<blockquote><p>There is a sin unto death; I have already said that the sin to which there is no hope of pardon left, is thus called… Moreover, as the sin and blasphemy against the Spirit ever brings with it a defection of this kind, there is no doubt but that it is here pointed out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 John</cite>, ch. 5, verse 16</span></figcaption>

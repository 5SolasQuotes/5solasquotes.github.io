<main class="wrap"><figure class="quote" id="q-6d72d73003" data-kw="">
<blockquote><p>The language here employed is cautious and temperate, and is thus well suited to the circumstances of a solemn profession to be made by a numerous body of men, who might not all see their way to concur in stronger and more specific phraseology. Besides, it is to be observed that the profession respects not merely the fundamentals or essentials of Presbyterianism in the abstract, which alone can be reasonably maintained to have the clear and positive sanction of apostolic practice; but ‘the Presbyterian government and discipline of this church,’ including the detailed development of the essential principles of Presbyterianism as exhibited in the actual constitution and arrangements of our church, and of all this in the concrete, or taken complexly, nothing higher or stronger could with propriety be affirmed, than that it is founded upon the word of God, and agreeable thereto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, vol. 1, p. 76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-9f457c32af" data-kw="">
<blockquote><p>As to the charge of schism, they,” viz. the Assembly’s committee, “admit that difference in judgment in some particular points is no schism, nor does an inconformity to some things enjoined deserve that name; but our Brethren” (says that committee) “desire further to set up separate communions, which is a manifest rupture of our societies into others, and is therefore a schism in the body: This is setting up altar against altar, allowing our Churches to be true Churches, as the Independents do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

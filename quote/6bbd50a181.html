<main class="wrap"><figure class="quote" id="q-6bbd50a181" data-kw="">
<blockquote><p>1. Circumcision of the flesh was a seal of the Circumcision of the heart promised in the Covenant of Grace, Deuteronomy 30:6, and of the cutting of the foreskin thereof, Jeremiah 4:4; Jeremiah 9:26; Ezekiel 36:26, 27, and baptism is the same, Colossians 2:11, 12; Titus 3:5.

2. Circumcision is a seal of the righteousness of faith, Romans 4:11, so is baptism, as 1 Peter 3:21; Romans 4:24.

3. Circumcision is a seal of the Covenant, and by a metonymy called the Covenant of God in the flesh, Genesis 17:7, 13, so is baptism a solemn installing of all Samaria, Acts 8, in the Christian Covenant, and so Acts 2:39.

4. Circumcision is a solemn way of instituting any in the Church of Israel, so we are by one Spirit baptized into one body, 1 Corinthians 12:12, 13.

5. The command of Circumcising is as large as Covenanting, but that is with Abraham the father, and his seed, Acts 2:39, make the command of being Baptized, ekasos every one of you be Baptized, as large as the promise of the Christian Covenant, and call: For the promise is to you and to your children, and to as many as the Lord shall call.

6. The command supposes that all Circumcised, the males of eight days old understand not the promise of the Covenant, the nature, use, signification, and end of the seal and the command to be baptized, supposeth that the children to whom the Covenant promise is made do not understand the same as touching baptism and the Covenant promise, Acts 2:39.

7. If the positive command be general that all these in Covenant should be marked with the initiatory seal of the Covenant: As Genesis 17:7-8, I am thy God and the God of thy seed: Therefore old and young be circumcised, then there was no other command in particular, to baptize old or young, but the institution of Baptism in place of Circumcision needful. […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The covenant of life opened; or, a treatise of the covenant of grace</cite>, ed. C. M. McMahon (1654; New Lennox IL, 2005), pp 158-9.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-63ac008ebd" data-kw="">
<blockquote><p>…from whence it will appear that a believing master may present his servant and children to baptism, though it does not follow that a believing master may or will present those of his servants or children that are adult or of years without their consent, yet he may by his authority require them to it as an external duty; he cannot compel them to any duty, or restrain them from any vice without their consent, yet he may correct them, and incline their will to any outward duty by his authority, and having wrought upon them to consent and submit, the commissioner may baptize them that come so presented: the master of a family is a king, a prophet, and a priest, if by any of these offices he can prevail with his houshold, he may bring them to the performance of their duties… …though it be the master or husband’s duty to move his family, yet he cannot always prevail; and special direction concerning the wife is given to suffer her in regard of the bond of matrimony and that under some limited and restrained terms in hope of her conversion [1 Cor. 7]; yet nothing is said concerning servants but that he may either force them or be rid of them if they continue infidels in that sense, that is refuse to list themselves among disciples; the public worship of some God being the bond of all human society, Ps. 101:6, ‘He that walketh in a perfect way, he shall serve me:’ he that keeps any servant that will not be baptized, is not a good Christian; it is true, all men of discretion ought to consent to every duty…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-hussey.html">William Hussey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Mr. Tombes</cite>, [a Baptist], his Sceptical Examination of Infants’-Baptism… (London, 1646), pp. 44-45 Page 43 starts the context. Hussey was the Erastian minister who debated Gillespie on the Mediatorial Kingdom of Christ. Not every particular in the larger context is endorsed.</span></figcaption>

</figure><figure class="quote" id="q-a8d35535aa" data-kw="">
<blockquote><p>The Word of God, Gen. 17:23, acknowledges that one may have a right to the first seal of the covenant, and that coram Deo, that has no saving grace. Ishmael was thirteen years old, verse 25, when he was circumcised, and therefore of age to answer for himself; yet Ishmael had no saving grace, neither was he within the covenant of Isaac–the covenant of absolute and certain salvation, from which he was excluded, verse 19. Yet Ishmael has a right to the first seal of the covenant coram Deo, as is most most evident from the immediate command of God, that he that was born in Abraham’s house, must needs be circumcised, verse 12, and accordingly Abraham understood it. He proceeds upon the command of God to circumcise Ishmael first of all. Now what is it that giveth one right to any ordinance but the command, or at least more evidently than the command of God Himself? And that right which we have from God’s command, is doubtless a right coram Deo, and in his sight.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-fullwood.html">Francis Fullwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Visible Church</cite>, … (1658) as quoted by Thomas Boston, Works, 6:130</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<blockquote><p>XXI. Baptism (with respect to true believers) seals saving grace because it is connected with the internal baptism of the Spirit. But with respect to hypocrites, it does not have the accompanying grace of the Spirit, but is only a badge of profession by which they are distinguished from Jews, Turks and other unbelievers. And then it is administered, not from the force of election, but by reason of the general dispensation by which God determined by the word of the gospel and the administration of the sacraments to gather to himself a church, and by certain signs and marks to distinguish it from other and profane assemblies. Thus the doctrine of perseverance is not at all endangered here, which remains constant with respect to the elect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 19.20.21 (p. 420).</span></figcaption>

<blockquote><p>Numbers may be found who have enjoyed the sacrament of baptism for a long time without any benefit, and yet afterwards being converted to God, have profited much through it.</p></blockquote>

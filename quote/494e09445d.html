<main class="wrap"><figure class="quote" id="q-494e09445d" data-kw="">
<blockquote><p>Liberty is the privilege to do what is right to be done — to teach what is known to be true. Liberty has its controlling laws. Great as is the human mind, and free as it undoubtedly is, it is not great enough, nor can it claim a freedom so irresponsible, to think or pronounce imperfect what God has declared to be “true and righteous altogether.” Belief in a defective Bible is no part of intellectual freedom. And in the oft-uttered and strongly-emphasized declaration that the Bible, freed from the errors of transcribers and translators, and as it came from God, is without error, no restraint is put on reverent scholarship.

It is not necessary to talk boastfully of “the faith that cannot be put into creeds,” or of “the word of God behind the Bible,” in order to assert one’s independence of mind. Scholarship, the profoundest, the loftiest, the widest, the ripest, causing all languages and literatures, all precepts and principles, all faiths and philosophies, to pay tribute to the Lord God of truth and righteousness, is welcome in the Theological Schools of our Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-a-brownson.html">Marcus A. Brownson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Charge in Robert Dick Wilson, The Lower Criticism of the Old Testament as a Preparation for the Higher Criticism. Inaugural Address of the Rev. Robert Dick Wilson, Ph.D., D.D., as Professor of Semitic Philology and Old Testament Criticism in the Theological Seminary of the Presbyterian Church Pr</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

<blockquote><p>None can deny natural arguments to be a part of the Word of God, as is clear, Rom. 1:19; 1 Cor. 15:36–37; 1 Cor. 11:14. Yea, Christ, Mt. 7:12, teaches that this principle of nature, ‘whatsoever ye would men should do to you, do ye so to them,’ is the Law and the prophets, because it is a great part of the Law and the prophets, and therefore they say in effect ‘As it written in the Scripture,’ when they say ‘as it is written in man’s heart by nature.’ 2. Principles of nature are made Scripture by the penmen of the Holy Ghost, and do bind as the Scripture.</p></blockquote>

</figure><figure class="quote" id="q-788f2fe55a" data-kw="Papal infallibility">
<blockquote><p>Thirdly, if Christ asked this for all the Roman pontiffs, that they should be exempt from error, then he did not obtain what he asked. For it is certain that many Roman pontiffs have erred, even when teaching ex cathedra, that is, determining controversies; as Alphonsus asserts, Contra Hæres. Lib. I. c. 4, where he affirms that the pope not only may err, but even be a heretic. The same is written and held by other papists also. Then who, I pray you, will be the supreme judge of the church, when the supreme pontiff hath fallen into heresy? Is he a fit person to be the supreme judge in religion, and one in whose judgment we should acquiesce, who may be, and is a heretic, as the very papists themselves confess? Surely, never. The supreme judge of all controversies must be such a one as can neither err nor prove a heretic: and such is Christ himself, that true High Priest, and the sacred scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, Question 5, ch. 5</span></figcaption>

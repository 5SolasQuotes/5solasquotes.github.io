<blockquote><p>The Covenant of Grace, is that which God made with man after his fall, wherein of his own free Grace and Mercy, he doth promise unto Mankind a blessed Seed of the Woman, which by bruising the Serpents head, that is, destroying the power and works of the Devil, should redeem Mankind, and restore all that believe in that blessed Seed Christ, to a more happy and blessed estate, then that which was lost. In this Covenant the parties were God Almighty offended by Man’s sin, and provoked to just wrath; and man by his wilful transgression now become a Rebel and enemy against God, and deserving eternal death; so that here is great contrariety, separation, opposition, and cause of enmity between the two parties, and between them there was no possibility of peace and reconciliation, without a fit and all sufficient Mediator necessarily coming between.

The things which God promiseth in this Covenant, and for his part performeth, are admirable, far surpassing man’s reason.

The first, is the All-sufficient Mediator Christ, his own eternal Son, whom God promised immediately after man’s fall, and who did then begin, actually, to mediate for man, and did undertake to become Man, and by a full satisfaction made in Man’s nature, to God’s infinite Justice, and just Law, and a perfect and full ransom paid for man’s Redemption to purchase pardon of all man’s sins; to justify, and make him righteous, and to reconcile him to God.

The second, is the Spirit to be given to man, and shed on him through Christ the Mediator, Gal. 3. 14. and Tit. 3. 6.

The third, is spiritual Life, derived from Christ, &amp; wrought in man by his quickening spirit, together with all graces and blessings thereto belonging.

The fourth, is union, and communion with Christ of all his benefits, as of his Son-ship, to make all regenerate men sons of God, and heirs of eternal life, glory, and all blessings, of his satisfaction and sufferings for remission of all their sins; of his righteousness for justification.

The fifth, is a true right to the natural life which Adam lost, to the Creatures made for man’s use, and to all earthly blessings which are given him to possess and enjoy in this life.

The sixth, is sanctification and holiness, whereby man is fitted to see and enjoy God, Matth. 5. 8. and Hebr. 12. 14.

The last, which is the end of all, is the eternal life of glory, in the fruition of God in Heaven.

In this Covenant there is not any condition or Law to be performed on man’s part by man himself, as in the first old Covenant, of Nature; and therefore it is called the free Covenant of Grace, and not of Works. The perfect obedience, righteousness, and satisfaction of Christ, which he performed to the whole Law, for man, in Man’s nature, though it stands in the place of every man’s perfect obedience to God’s Law in his own person, and his subjection to the whole revealed will of God, which was the condition of the Old Covenant of Works, and when man is partaker of it by communion with Christ, he is more perfectly justified, and made worthy of life eternal, than man in the state of nature could have been by his own perfect obedience, and personal righteousness performed in his own person; Yet it cannot so properly be called, A condition of the New Covenant of Grace which God hath made with Mankind (because God imposeth it not as a condition to be performed by every man in his person) but is one of the blessings promised in the New Covenant.

So likewise, the Gifts, Graces, and Works, and Fruits of the Spirit, which are required to be in man, to make him an actual partaker of Christ, and of life and salvation in him, whether they be outward, as the word preached and heard, the Sacraments given and received, and the like; or inward, as Faith, by which Christ is received, and applied; Repentance, Love, Hope, and other saving Graces; they are all free gifts of God, he gives them to us, and by his Spirit works in us both to will and to do; and without his Grace continually assisting us according to his promise, we cannot perform any thing which is mentioned in the Gospel, as a conditional means of life and Salvation in Christ.

And therefore this Covenant is foedus gratuitum, a most free Covenant of Grace, wherein no condition is propounded to man, to be performed by any power of his own, for the obtaining of life: but God of his own free Grace promiseth all blessings, and for his own sake gives them; and also all power to receive and enjoy them. And the end and use of this Covenant, is not any gain which God seeketh to himself, nor any good which he can receive from man, or any creature, but only the making of man perfectly blessed in the fruition of himself and all his goodness, and so gathering to himself all things in Christ.

This Covenant is that which is called, the Covenant of Peace, and is most highly extolled, and commended in all the Scriptures, both of the Old and New Testament. And howsoever the substance of this Covenant hath been always one and the same from the beginning, even from the seventh day of the world, wherein God first promised Christ the blessed Seed, and so shall be for ever; yet because the circumstances are divers, and the manner of revealing the promise, and of sealing it, is far different in the Old, and New Testament; hereupon it comes to pass, that the Spirit of God doth distinguish it into the Old and New Covenant; and as it was revealed, and sealed to the Fathers under the Law, calls it the Old Covenant; and as it is now revealed and sealed under the Gospel, calls it the new Covenant, Jer. 31. 31. &amp; 2 Cor. 3. 6.</p></blockquote>

<blockquote><p>…just as in human beings, the term ‘virtues’ is reserved for ‘excellent and confirmed habits’ or dispositions that conduce to the proper use of the faculties, so also in God is the word ‘virtues’ applied to the workings of the divine essence, with specific reference to the disposition and use of the ‘faculties’ of intellect and will. This approach is analogical, given that the divine virtues are not separable from the divine essence as human virtues are separable from humanity. In short, the virtues of God are the divine moral perfections, specifically the goodness and righteousness of the divine willing. These virtues are also the source of all finite or creaturely goodness and righteousness. (Leigh, Treatise, II.x (pp. 78-79).)</p></blockquote>

</figure><figure class="quote" id="q-06197c4c85" data-kw="">
<blockquote><p>Q. What are the false grounds of the Lord’s making the Covenant of Grace?

A. There are two bastard grounds devised by Arminians. 1. Because the Covenant of Works cannot oblige both to active and passive obedience, but to one of them only (say they) and the Covenant of Works was so rigid, that God could not follow it out, and cast infants in hell for a sin which is theirs, only by imputation, and was pardoned to the first man that committed it. Therefore he was necessitated to make a Covenant of Grace with all mankind, none excepted. But the Covenant of Works is broken, and can now be a way of Justification and salvation to none, but yet it obliges all. And sin cannot make us lawless, for the spiritual Law is of an eternal obligation.

2. They that never heard of Christ, perish by the Law, and not by the Covenant of Grace of which they never heard, and the Gospel is written in the heart of none. 3. The first Covenant was holy and spiritual, and God should unjustly threaten death upon infants, if they be not guilty of eternal condemnation, as Arminius, disp. pub. 7. th. 16.3. and the Scripture saith, infants are guilty of this sin, Eph. 2.3. Rom. 5. Psal. 51.5. Job 14.4. As also Christ must not have died for the sins of Infants, if there be no sin in them, they need not the ransom of Christ’s Blood.

The other bastard ground is, the natural antecedent desire and love of God to have all saved, moved him (say they) to make this Covenant of Grace with all. But this makes away free-grace, and changes God as the blind Talmud, which saith God hath a secret place in which he afflicts himself, because he burnt the Temple, and delivered the Jews to captivity. As also, the Lord remembering the captivity of the Jews, and their desolation, he powers out two tears every day in the Sea or Ocean, and for grief, smites his breasts with both his hands. And the Alcoran saith, that God and the Angels wish well to Mahomet, but cannot free him from death. So made the Heathen their Jupiter to deplore the destinies which he could not amend. And what is this, but to say, God hath passionate desires to have all, Elect, and Reprobate, Men, and Angels, to obey and be eternally saved, but he cannot help the matter; and therefore must upon the same account, be sorrowful and mourn that he cannot get all saved, which destroys the power of grace and restrains the outgoings of free-love.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The covenant of life opened, or, A treatise of the covenant of grace</cite>, (Edinburgh: Robert Brown, 1655), 1.10, pp 56-57.</span></figcaption>

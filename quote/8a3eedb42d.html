<main class="wrap"><figure class="quote" id="q-8a3eedb42d" data-kw="">
<blockquote><p>Christianity proclaims the one sacrifice of Christ to be the great atonement, the only propitiation for sin, and that, being infinitely precious, it needs never to be repeated; but the Church of Rome affirms that this sacrifice does need to be repeated, and is repeated in the celebration of the mass, which service she declares to be the offering up of a “true propitiatory sacrifice, not merely for the living, but also for the dead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-mackray.html">William MacKray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The character and prospects of the Church of Rome: in two discourses</cite>, (Stirling, 1830), p. 11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/the-mass.html">The Mass</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-19a2e6f8a1" data-kw="">
<blockquote><p>What remains but for the blind to see, the deaf to hear, children even to perceive this abomination of the mass, which, held forth in a golden cup, has so intoxicated all the kings and nations of the earth, from the highest to the lowest; so struck them with stupor and giddiness, that, duller than the lower animals, they have placed the vessel of their salvation in this fatal vortex. Certainly Satan never employed a more powerful engine to assail and storm the kingdom of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.18.18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/the-mass.html">The Mass</a></span><span class="t"><a href="../topics/rome/sacraments.html">Rome: Sacraments</a> › <a href="../topics/rome/sacraments/the-mass.html">The mass</a></span></div>

</figure><figure class="quote" id="q-04ea9ba944" data-kw="">
<blockquote><p>I do not know of any satisfactory answer to this problem,” Kenny continued. “If I did, I would give it. Since I do not, I must leave it, as the writers of textbooks say, as an exercise for the reader” (A Path from Rome, 1986, 167–168). These questions may seem abstruse… But the question of Christ’s presence now on the altar is… central to the consecration and adoration of the Eucharist [in Romanism]. It is a question that many others besides Thomas Aquinas sought to answer, and a seriously inquiring intellect might rightly be disturbed, even scandalized, if forbidden to ask it. But for a long time Thomas’s answer was accepted just because it was his… Thomas’s answer to Kenny’s question can, in fact, be found in other Scholastics who variously adopt the principle that “that into which something is converted is where the converted thing was before.” This principle is dubious and was not universally accepted. Since transubstantiation converts only the substance of the bread into Christ’s body and not also the accidents, why should any of the accidents of the bread be kept by Christ’s body if, according to the doctrine, the accidents are not part of the transubstantiation? [Simpson goes on to describe Scotus’s proposed answer to the issue.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-l-p-simpson.html">Peter L.P. Simpson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Have you Tried Scotus? Aquinas Didn’t Know Everything’ in Commonweal</cite>, (June 14, 2019), p. 12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/the-mass.html">The Mass</a></span></div>

<blockquote><p>[W]hosoever would have the ministers of the Christian church to be truly priests, would by that means bring back the pedagogy of Moses, would set up the Antichristian sacrifice of the Mass, denying in deed as the apostle often reasons, that Christ is yet come, or has offered a sufficient sacrifice for redemption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Satan leader in chief of all who resist the reparation of Sion. As is cleared in a sermon to the Honourable House of Commons at their late solemn fast, February 28, 1643/44 in Chris Coldwell (ed.), Sermons preached before the English Houses of Parliament by the Scottish Commissioners to the Westmins</cite></span></figcaption>

— Robert Baillie, Satan leader in chief of all who resist the reparation of Sion. As is cleared in a sermon to the Honourable House of Commons at their late solemn fast, February 28, 1643/44 in Chris Coldwell (ed.), Sermons preached before the English Houses of Parliament by the Scottish Commissioners to the Westmins">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BW%5Dhosoever+would+have+the+ministers+of+the+Christian+church+to+be+truly+priests%2C+would+by+that+means+bring+back+the+pedagogy+of+Moses%2C+would+set+up+the+Antichristian+sacrifice+of+the+Mass%2C+denying+in+deed+as+the+apostle+often+reasons%2C+that+Christ+is+yet+come%2C+or+has+offered+a+sufficient+sacrifice+for+redemption.%E2%80%9D%0A%0A%E2%80%94+Robert+Baillie%2C+Satan+leader+in+chief+of+all+who+resist+the+reparation+of+Sion.+As+is+cleared+in+a+sermon+to+the+Honourable+House+of+Commons+at+their+late+solemn+fast%2C+February+28%2C+1643%2F44+in+Chris+Coldwell+%28ed.%29%2C+Sermons+preached+before+the+English+Houses+of+Parliament+by+the+Scottish+Commissioners+to+the+Westmins&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8aae6f866e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8aae6f866e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2017/08/21/robert-baillie-on-the-romish-mass-a-denial-of-the-work-of-christ/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-ae8f77685b" data-kw="">
<blockquote><p>We loudly maintain that the sacrifice of the Mass is nothing else than an impious profanation of the Lord’s Supper. This we make plain by the clear words of our Lord. For in instituting the sacred Supper, he does not enjoin us to sacrifice, but invites us to partake of the sacrifice which he himself once offered. He commands distribution to be made, and orders all alike to communicate in both symbols. And there is no obscurity in the words; Take, distribute among yourselves; drink ye all of this cup. What resemblance is there between the observance which corresponds to our Lord’s command and the Papal Mass, in which they pretend that Christ offers himself to the Father to expiate the sins of the world by the sacrifice of himself, and not only so, but also to obtain redemption for the dead – in which no invitation is given to partake, but one individual sets himself apart from the whole flock – and where, if any one comes forward to partake, the half is withheld from him?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canons and decrees of the Council of</cite>, Trent, with the antidote (1547) in John Calvin: tracts and letters, trans. and ed. Henry Beveridge (7 vols, Edinburgh, 1851), iii, 59.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/the-mass.html">The Mass</a></span></div>

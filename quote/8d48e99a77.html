<main class="wrap"><figure class="quote" id="q-8d48e99a77" data-kw="">
<blockquote><p>For that determination of God toward concurring with the secondary cause does not arise from a necessity imposed immediately by the action of the secondary cause, but from the reason of providence, by which the universal first cause must concur with the particular secondary causes. And this is clear from the fact that he concurs in this way with all causes, even the necessary ones, for the common reason of providence. But in the mode of concurring, he exhibits necessary concurrence to natural and necessary causes, and contingent concurrence to contingent and free ones.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo &amp; Scotus’s View</cite>, pp. 411-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

ree%20ones" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a58969579b" data-kw="">
<blockquote><p>23. To imagine God either without providence, or with general only, not special, indeed also singular, concerning any entities whatsoever and any acts of entities, is impious and hurls God from his throne. 24. But this providence is either effective of all good, or permissive and directive of evil, nor idle concerning evil but efficacious, although not efficient. 25. Whence those who strive to ascribe to God the efficiency of evil reduplicatively as such to orthodox [Reformed] Churches, do what they do from mere either ignorance or malice, since they constantly teach that God can be neither the physical nor the ethical cause of ethical evil as such. 26. To imagine God also without predestination is both to detract the eternal direction of all things from God, and to establish an uncertain end of the creation of men, and to make primary causes from secondary, and to constitute man the craftsman and architect of his own salvation. 27. Yet the orthodox doctrine of the Reformed Churches concerning predestination neither removes the guilt of the fall from man, nor imputes it to God, nor establishes a necessity of the fall incompossible with the freedom of the one falling or fallen. Nor have those who oppose necessity in every way to freedom well-perceived the nature either of necessity or of freedom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim-the-elder.html">Friedrich Spanheim the Elder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

</figure><figure class="quote" id="q-8520e28d8b" data-kw="Author of sin Free Will">
<blockquote><p>As there is a vast difference between the sun being the cause of the lightsomeness and warmth of the atmosphere, and the brightness of gold and diamonds, by its presence and positive influence; and its being the occasion of darkness and frost, in the night, by its motion, whereby it descends below the horizon. The motion of the sun is the occasion of the latter kind of events; but it is not the proper cause, efficient, or producer of them; though they are necessarily consequent on that motion, under such circumstances: no more is any action of the Divine Being the cause of the evil of men&#x27;s Wills.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Freedom of the Will</cite>, pt. 4, sec. 9</span></figcaption>

</figure><figure class="quote" id="q-e2c0347ac9" data-kw="">
<blockquote><p>I first note that Thomas in this matter taught exactly the same as Scotus with regard to premotion and the determination of the secondary cause by the first, in general. In particular, however, Scotus expressly rejected that physical predetermining quality and a similar influence through something else impressed antecedently in the free will — which many Thomists posited, because Thomas manifestly neither posited nor rejected it, from which they took occasion to introduce it. But Thomas, if my judgment carries any weight, never required it; nor could I find a place in him where he would admit it. And this I have often publicly affirmed in the very presence of Thomists. Therefore I hold that Thomas and Scotus are in agreement on excluding that quality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo’s Judgment</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

<blockquote><p>[Thomas:] ‘God moves all things according to the mode of each… But man, according to his proper nature, has it that he is of free choice; and therefore in one who has the use of free choice, there is no motion from God toward justice without the motion of free choice.&#x27;</p></blockquote>

<main class="wrap"><figure class="quote" id="q-214f9a2c88" data-kw="">
<blockquote><p>…it is well enough known how many heterodox doctrines are maintained by Formalists, who are most zealous for the ceremonies, about universal grace, free-will… Christ’s passion and descending into Hell… etc. Their errors about those heads we will demonstrate, if need be, to such as doubt of their mind. In the meantime, it has been preached [by formalists] from our pulpits among ourselves that Christ died for all alike; that the faithful may fall away from grace… that Christ descended locally unto the place of the damned…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (Naphtali Press, 1993), pt. 2, ch. 3, p. 77</span></figcaption>

<blockquote><p>In 1690, John Tillotson, the Archbishop of Canterbury, preached before Queen Mary II on the subject of hell where he showed an awareness of annihilationism and the arguments used by its proponents. While Tillotson ultimately defended eternal conscious torment, he left the door open for other possibilities…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/river-devereux.html">River Devereux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A History of Alternative Views of Hell in the Church of England’</cite>, (2025)</span></figcaption>

</figure><figure class="quote" id="q-4540f60acb" data-kw="">
<blockquote><p>…with respect to the very obscure and difficult passage in 1 Pet. 3:19, about his going and preaching to the spirits in prison, I must say that I have never met with an interpretation of it that seemed to me altogether satisfactory. Among the many interpretations that have been given of it, there are just two in support of which anything really plausible, as it appears to me, can be advanced–viz., first, that which regards the preaching there spoken of as having taken place in the time of Noah, and through the instrumentality of Noah; and secondly, that which regards it as having taken place after his resurrection, and through the instrumentality of the apostles. The latter view is ably advocated in Dr. John Brown’s Expository Discourses on First Peter [pp. 515-518]. If either of these interpretations be the true one, the passage has no reference to the period of his history between his death and resurrection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, vol. 1, p. 92</span></figcaption>

</figure><figure class="quote" id="q-2d36567035" data-kw="">
<blockquote><p>VII… Now, there are three principal opinions of the theologians. Some think, that Christ by His soul properly descended into hell, that is, the place of the damned: either so that He might there undergo hellish sufferings, or so that He might inaugurate His triumph over defeated death. We repudiate this opinion… IX. Others say, that by the descent of Christ into hell nothing else is signified than the grave… X. Most of the Orthodox, by the descent of Christ into hell, understand His infernal anguish and sufferings, which Christ felt in His soul. In this opinion we also acquiesce.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Parts of Christ’s Office, pt. 2 in Christian Theology 3rd</cite>, ed. (1634)</span></figcaption>

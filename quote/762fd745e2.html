<main class="wrap"><figure class="quote" id="q-762fd745e2" data-kw="">
<blockquote><p>Every oath concerning a lawful and possible thing which can be performed without detriment to religion, to the obedience due to magistrates and the salvation of our neighbour ought to be kept without treachery and deceit; even if extorted by violence or fear, or connected with temporal injury and involving loss to the swearer.

Such an oath was made with the invocation of the divine name, which is not to be profaned. Its truth rests upon the express words of Scripture: “Ye shall not steal, neither deal falsely, neither lie one to another. And ye shall not swear by my name falsely” (Lev. 19:11, 12). “Thou shalt not forswear thyself, but shalt perform unto the Lord thine oaths” (Mt. 5:33). “He that sweareth evil” (i.e., and evil of loss which he sees to be injurious to his property, not of fault) “and changeth not, shall dwell in the mountain of the Lord” (Ps. 15:4). Although the injury done takes away the obligation with respect to the man doing the injury (since no right is founded upon injustice), still the obligation made to God remains (which without irreverence and injury to God cannot be considered as void). …

V. This very thing is confirmed by the example of the Israelites toward the Gibeonites. Although they had confirmed by an oath the covenant made with the former (deceived by their treachery as if they were strangers from most remote places), they did not rescind the oath when their treachery and deceit was afterwards found out, but fulfilled it in good faith (although they belonged to those nations whom God had devoted to destruction) … And when Saul (a hundred years afterwards) put to death certain of the Gibeonites, God testified how greatly he was displeased by sending a famine. This perjury could be atoned for only by the hanging of seven sons of Saul (2 S. 21:1ff.).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 11.11.4, 5.</span></figcaption>

</figure><figure class="quote" id="q-b543c11681" data-kw="">
<blockquote><p>Obj. 12. “The king of Great Britain, &amp;c. is an Erastian king.” That is, the supeme judge in the church, as well as in the state.

Ans. The king has too much power in church matters, but it is not true, that his power in them is supreme.

The oath of allegiance, acknowledging the supremacy of King Charles II. and of his successors, over all persons, and in all causes, was rescinded at the happy Revolution in 1688, both by the English, and Scotch parliament. The English parliament abrogated the oaths of allegiance, and supremacy, which had been sworn to the late king, and framed the two following oaths, to be taken instead of them. –

“I A. B. do sincerely promise and swear, that I will be faithful, and bear true allegiance to their Majesties King WILLIAM and Queen MARY. So help me GOD.” – “I A. B. do swear, that I do from my heart abhor, detest, and abjure, as impious and heretical, this damnable doctrine and position, that princes excommunicate or deprived by the Pope, or any authority of the See of Rome, may be deposed or murdered by the subjects, or any others whatsoever. And I do declare, that no foreign prince, person, prelate, state, or potentate, has, or ought to have any jurisdiction, power, superiority, pre-eminence, or authority, ecclesiastical or spiritual, within this realm. So help me, GOD.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fletcher.html">William Fletcher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scripture-Loyalist: Containing a Vindication of Obedience to the Present Civil Government, in things Lawful</cite>, (Carlisle: John McCarrell, 1806), p. 55.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

1681.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b543c11681.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/07/17/william-fletcher-on-the-glorious-revolution-and-the-modification-of-oaths-of-allegiance/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-72e8445630" data-kw="keep faith lawful oaths">
<blockquote><p>First, to keep faith is an act of truth, justice and fidelity. He that keeps faith does what he says, the characteristic of truth. He does what he has promised and to which he is bound, the characteristic of fidelity. He restores to another what is his due according to the promise, the characteristic of justice. Second, it is lawful to swear faith to infidels, therefore also to keep faith with them as appears from the examples of Abraham making a covenant with Abimelech (Gen. 21:23, 24), of Isaac (Gen. 26:26), of Jacob (Gen. 31:53), of the spies with Rahab (Jos. 6:22), of the Israelites with the Gibeonites (Jos. 9:15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.11.9–10</span></figcaption>

</figure><figure class="quote" id="q-c5973040cd" data-kw="">
<blockquote><p>Question: Is it simply unlawful to play for any money at all, the game being lawful? Answer: No; if the play be for a small matter, the loss whereof is no hurt to him that loses it, and if it be applied to a common good, and be bestowed in some honest meeting for the increase of love, then it is lawful: otherwise not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-elton.html">Edward Elton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s Holy Mind Touching Matters Moral which Himself Uttered in Ten Words</cite>, … in God’s Holy Mind Touching Matters Moral which Himself Uttered in Ten Words… Also Christ’s Holy Mind touching Prayer… (1625), p. 311 Elton (1569-1624) was an English minister near London.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-681c25bdf4" data-kw="">
<blockquote><p>At the Creation the Spirit of God moved upon the face of the waters, Gen. 1.1. So that He was at the framing of this world; and because of that, must be concluded to exist before the world: for when a man in verity can be said to subsist without a soul, the eternity of God shall be allowed, granting Him to abide without his Spirit; which here brooded over the world’s embryo, animating the same for production, infusing such vivifying heat as might capacitate the first confused mass, to bring forth the several forms of things we behold…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-annand.html">William Annand</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Doxologia; or Glory to the Father</cite>, … (London, 1672), Doxologia; or Glory to the Holy Ghost, Reduced to Practice, section 1, p. 124</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8d9a53e58c" data-kw="">
<blockquote><p>Concerning the original of the soul, diverse men have diversly thought… There are three opinions touching this question: The first of those who affirm the traduction of the soul by generation, some of which so affirm because they judged it a corporeal substance, as did Tertullian. Others because they believed that one spirit might as easily proceed from another, as one fire or light be kindled by another: as Apollinarius, Nemesi•…, and diverse in the Western Churches, as St. Jerome witnesses. The second, of those who deny the natural traduction, and say that the soul is •…ion infused into bodies, organized and predisposed to receive them; of which opinion among the ancients were St. Jerome, Hilary, Ambrose, Lactantius, Theodoret, Aeneas Gaz•…us, and of the modern writers, the major part. The third is of those who do haesitare, stick between both, and dare affirme nothing certain on either side, which is the moderation of St. Augustine and Gregory the great, who affirm that this is a question incomprehensible, and unsolvable in this life. Now the only reason which caused St. Austin herein to hesitate, seems to have been the difficulty of traducing original sin from the parents to the children. For says he (writing unto St. Jerome touching the creation of the soul), ‘If this opinion do not oppugne that most fundamental faith of original sin, let it then be mine; but if it do oppugne it, let it not be thine.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Passions &amp; Faculties of the Soul of Man</cite>, (London, 1640), ch. 32, pp. 391-92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-d85c9b58fd" data-kw="">
<blockquote><p>Moreover, the operation of the Holy Spirit signified in coming upon and overshadowing​ had in general the following components, that: (1) He separated some​ particle of the Virgin’s substance, from which the body of Christ was formed​ (Heb. 10:5). (2) He bestowed a molding force upon the separated particle, by​ means of which the Virgin’s seed alone could do in the conception what from the​ order of nature both seeds, the male and female, can do. (3) He as it were cleansed the seed of the Virgin, not indeed from moral impurity or sin, inasmuch as a seed not yet ensouled is not liable to that, but from physical intemperateness, from​ which, in its own time, sin could have resulted, or at the least He preserved the​ birth from all impurity, to the end that what would be born of her would be​ holy (Luke 1:35). (4) He gradually formed that seed of the Virgin into human members, in the way that they are formed in ordinary generation (Heb. 10:5).​ (5) When the body was already formed, He joined to it a rational soul (Zech.​ 12:1). (6) In uniting the soul to the body, at one and the same time he inseparably joined the divine person to both united parts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 4, bk. 5, ch. 10, section 5, pp. 298-99​</span></figcaption>

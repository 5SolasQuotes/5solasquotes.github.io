<blockquote><p>1. The root of the difference between the Old Nonconformists and the Conformists was that one sort thought they should stick to the mere Scripture rule and simplicity, and go far from all additions which were found invented or abused by the Papists, in doctrine, worship and government; and the other side thought that they should show more reverence to the customs of the ancient Church, and retain that which was not forbidden in the Scripture, which was introduced before the ripeness of the Papacy, or before the year 600 at least, and which was found lawful in the Roman Church, and common to them with the Greek, that we might not seem singular, odd and humorous, or to go further from the Papists than reason and necessity drave us. And the laity seemed nowhere so sensible of the difference as between the way of ceremony and unceremonious simplicity, and the way of our many short liturgic prayers and offices and the way of free-praying from the present sense and habits of the speaker; while pacificators thought both seasonably good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood</cite>, … (London, 1679), Section 7, ‘Some Matters of Fact Preparatory…’, p. 120</span></figcaption>

<blockquote><p>We respond: it is further asked whether it be of a Scriptural or ecclesiastical use, or an ancient or new use.” 5 conclusions are given. 2nd Problem, ‘Whether the Old Testament Church from Moses to Ezra began to use and maintained liturgies?’, p. 361 3rd Problem, ‘Whether a liturgy from Ezra and the men of the great Synagogue (that consistory or Sanheidren, as it is termed in the Hebrew, beit deenu) was established, having been prescribed to the people of God, and was publicly used till Christ?’, p. 363 3 conclusions are given on p. 364. 4th Problem, ‘Whether forms &amp; litugies were established in the apostolic Church from the apostles to that Church, such that they have been prescribed to all succeeding churches?’, p. 364 3 conclusions. 5th Problem, ‘Whether a universal liturgy ought to be formed and written, and imposed on all the Churches throughout the whole globe?’, p. 365 3 reasons are given. 6th Problem, ‘Whether one provincial or national liturgy ought to be established, and introduced into all of its consociating churches?’, p. 367 4 conclusions. 7th Problem, ‘Whether liturgies in the national language, whatever is commonly used to write, ought to be taken up in the churches?’, p. 368 8th Problem, ‘Whether a liturgy in Churches already settled, from their first gathering or its introduction at the Reformation, may be changed?, p. 369 1 conclusion. 9th Problem, ‘What is the Gregorian or Roman service (named after Gregory VII) and what is the Mozarabic, or Gothic, and in what place were they used, or are used in the Roman Church?’, p. 370 [No 10th Problem] 11th Problem, ‘How far it is better for a populace having been accustomed to the Roman liturgies and rites from the Papacy to the Reformation, to carry them over, if they had been so engaged initially by the reformers, having purged and yet retained the Missal, Breviary and other liturgical books and rites?’, pp. 372-4 ch. 3, ‘Of Rituals or Ecclesiastical Ceremonies’, pp. 374-384 This chapter is on the general introductory principles of the nature and properties of ceremonies, including (1) their name, (2) their nature and definition, (3) division and (4) opposites. Under (1) Voet also briefly discusses adiaphora on p. 375. Under (2) Voet gives numerous principles and distinctions as to worship (and its kinds) in general (p. 375) before delineating distinctions about ceremonies in general (p. 376). p. 375, Voet distinguishes the following distinctions about worship: It is either natural or instituted. Natural is internal; instituted may be both internal and external. External is either alone or social, or private or public. Public worship is performed by the Church. p. 376, Ceremonies are either divine or human. Divine ceremonies have been immediately instituted by God; therefore their observance is necessary. Divine ceremonies are either political or ecclesiastical. Political are either general and perpetual, observance of natural decorum, or particular, as ceremonies of the judicial law of Moses. Ecclesiastical are sacred, mystical and religious, either of the Old Testament (before or after Moses) or of the New Testament. A human ceremony “which is observed in the practice of men, is called free. It is either civil or ecclesiastical. Civil is some external formality or a mode to be done between men, practiced by law or custom. These things are twofold: Either by a natural reason or necessity supporting, and therefore contributing to the essence or well being of something, such as a natural decorum or many aspects in the instruction of civil manners; or they are received by men as merely arbitrary and instituted. And such free ceremonies are either well-grounded or tolerated, or will be hissed at as vain, inept and rediculous as they may be seen openly in courts, halls, schools, barracks, colleges…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, (Amsterdam, 1663-1676) | vol. 1, pt 1, bk. 2, ‘Of Ecclesiastical Things, or Acts &amp; Exercises’, Tract 1, ‘Of Formularies, or Liturgies &amp; Rituals’ | ch. 2, ‘Some Questions on Liturgies &amp; Liturgical Actions Determined’, pp. 360-374 “We come now to the problems, which are either of sacred [Scriptural] history and are didactic, or of Church history.” | 1st Problem, ‘Whether ‘liturgy’ may designate a sacrifice properly so-called, it even being propitiating, or be a rule or order to be accomplished as like a sacrifice?’, p. 360</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“We respond: it is further asked whether it be of a Scriptural or ecclesiastical use, or an ancient or new use.” 5 conclusions are given. 2nd Problem, ‘Whether the Old Testament Church from Moses to Ezra began to use and maintained liturgies?’, p. 361 3rd Problem, ‘Whether a liturgy from Ezra and the men of the great Synagogue (that consistory or Sanheidren, as it is termed in the Hebrew, beit deenu) was established, having been prescribed to the people of God, and was publicly used till Christ?’, p. 363 3 conclusions are given on p. 364. 4th Problem, ‘Whether forms &amp; litugies were established in the apostolic Church from the apostles to that Church, such that they have been prescribed to all succeeding churches?’, p. 364 3 conclusions. 5th Problem, ‘Whether a universal liturgy ought to be formed and written, and imposed on all the Churches throughout the whole globe?’, p. 365 3 reasons are given. 6th Problem, ‘Whether one provincial or national liturgy ought to be established, and introduced into all of its consociating churches?’, p. 367 4 conclusions. 7th Problem, ‘Whether liturgies in the national language, whatever is commonly used to write, ought to be taken up in the churches?’, p. 368 8th Problem, ‘Whether a liturgy in Churches already settled, from their first gathering or its introduction at the Reformation, may be changed?, p. 369 1 conclusion. 9th Problem, ‘What is the Gregorian or Roman service (named after Gregory VII) and what is the Mozarabic, or Gothic, and in what place were they used, or are used in the Roman Church?’, p. 370 [No 10th Problem] 11th Problem, ‘How far it is better for a populace having been accustomed to the Roman liturgies and rites from the Papacy to the Reformation, to carry them over, if they had been so engaged initially by the reformers, having purged and yet retained the Missal, Breviary and other liturgical books and rites?’, pp. 372-4 ch. 3, ‘Of Rituals or Ecclesiastical Ceremonies’, pp. 374-384 This chapter is on the general introductory principles of the nature and properties of ceremonies, including (1) their name, (2) their nature and definition, (3) division and (4) opposites. Under (1) Voet also briefly discusses adiaphora on p. 375. Under (2) Voet gives numerous principles and distinctions as to worship (and its kinds) in general (p. 375) before delineating distinctions about ceremonies in general (p. 376). p. 375, Voet distinguishes the following distinctions about worship: It is either natural or instituted. Natural is internal; instituted may be both internal and external. External is either alone or social, or private or public. Public worship is performed by the Church. p. 376, Ceremonies are either divine or human. Divine ceremonies have been immediately instituted by God; therefore their observance is necessary. Divine ceremonies are either political or ecclesiastical. Political are either general and perpetual, observance of natural decorum, or particular, as ceremonies of the judicial law of Moses. Ecclesiastical are sacred, mystical and religious, either of the Old Testament (before or after Moses) or of the New Testament. A human ceremony “which is observed in the practice of men, is called free. It is either civil or ecclesiastical. Civil is some external formality or a mode to be done between men, practiced by law or custom. These things are twofold: Either by a natural reason or necessity supporting, and therefore contributing to the essence or well being of something, such as a natural decorum or many aspects in the instruction of civil manners; or they are received by men as merely arbitrary and instituted. And such free ceremonies are either well-grounded or tolerated, or will be hissed at as vain, inept and rediculous as they may be seen openly in courts, halls, schools, barracks, colleges…”

p+in+the+churches%3F%E2%80%99%2C+p.+368+8th+Problem%2C+%E2%80%98Whether+a+liturgy+in+Churches+already+settled%2C+from+their+first+gathering+or+its+introduction+at+the+Reformation%2C+may+be+changed%3F%2C+p.+369+1+conclusion.+9th+Problem%2C+%E2%80%98What+is+the+Gregorian+or+Roman+service+%28named+after+Gregory+VII%29+and+what+is+the+Mozarabic%2C+or+Gothic%2C+and+in+what+place+were+they+used%2C+or+are+used+in+the+Roman+Church%3F%E2%80%99%2C+p.+370+%5BNo+10th+Problem%5D+11th+Problem%2C+%E2%80%98How+far+it+is+better+for+a+populace+having+been+accustomed+to+the+Roman+liturgies+and+rites+from+the+Papacy+to+the+Reformation%2C+to+carry+them+over%2C+if+they+had+been+so+engaged+initially+by+the+reformers%2C+having+purged+and+yet+retained+the+Missal%2C+Breviary+and+other+liturgical+books+and+rites%3F%E2%80%99%2C+pp.+372-4+ch.+3%2C+%E2%80%98Of+Rituals+or+Ecclesiastical+Ceremonies%E2%80%99%2C+pp.+374-384+This+chapter+is+on+the+general+introductory+principles+of+the+nature+and+properties+of+ceremonies%2C+including+%281%29+their+name%2C+%282%29+their+nature+and+definition%2C+%283%29+division+and+%284%29+opposites.+Under+%281%29+Voet+also+briefly+discusses+adiaphora+on+p.+375.+Under+%282%29+Voet+gives+numerous+principles+and+distinctions+as+to+worship+%28and+its+kinds%29+in+general+%28p.+375%29+before+delineating+distinctions+about+ceremonies+in+general+%28p.+376%29.+p.+375%2C+Voet+distinguishes+the+following+distinctions+about+worship%3A+It+is+either+natural+or+instituted.+Natural+is+internal%3B+instituted+may+be+both+internal+and+external.+External+is+either+alone+or+social%2C+or+private+or+public.+Public+worship+is+performed+by+the+Church.+p.+376%2C+Ceremonies+are+either+divine+or+human.+Divine+ceremonies+have+been+immediately+instituted+by+God%3B+therefore+their+observance+is+necessary.+Divine+ceremonies+are+either+political+or+ecclesiastical.+Political+are+either+general+and+perpetual%2C+observance+of+natural+decorum%2C+or+particular%2C+as+ceremonies+of+the+judicial+law+of+Moses.+Ecclesiastical+are+sacred%2C+mystical+and+religious%2C+either+of+the+Old+Testament+%28before+or+after+Moses%29+or+of+the+New+Testament.+A+human+ceremony+%E2%80%9Cwhich+is+observed+in+the+practice+of+men%2C+is+called+free.+It+is+either+civil+or+ecclesiastical.+Civil+is+some+external+formality+or+a+mode+to+be+done+between+men%2C+practiced+by+law+or+custom.+These+things+are+twofold%3A+Either+by+a+natural+reason+or+necessity+supporting%2C+and+therefore+contributing+to+the+essence+or+well+being+of+something%2C+such+as+a+natural+decorum+or+many+aspects+in+the+instruction+of+civil+manners%3B+or+they+are+received+by+men+as+merely+arbitrary+and+instituted.+And+such+free+ceremonies+are+either+well-grounded+or+tolerated%2C+or+will+be+hissed+at+as+vain%2C+inept+and+rediculous+as+they+may+be+seen+openly+in+courts%2C+halls%2C+schools%2C+barracks%2C+colleges%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Ecclesiastical+Politics+%28Amsterdam%2C+1663-1676%29+%7C+vol.+1%2C+pt+1%2C+bk.+2%2C+%E2%80%98Of+Ecclesiastical+Things%2C+or+Acts+%26+Exercises%E2%80%99%2C+Tract+1%2C+%E2%80%98Of+Formularies%2C+or+Liturgies+%26+Rituals%E2%80%99+%7C+ch.+2%2C+%E2%80%98Some+Questions+on+Liturgies+%26+Liturgical+Actions+Determined%E2%80%99%2C+pp.+360-374+%E2%80%9CWe+come+now+to+the+problems%2C+which+are+either+of+sacred+%5BScriptural%5D+history+and+are+didactic%2C+or+of+Church+history.%E2%80%9D+%7C+1st+Problem%2C+%E2%80%98Whether+%E2%80%98liturgy%E2%80%99+may+designate+a+sacrifice+properly+so-called%2C+it+even+being+propitiating%2C+or+be+a+rule+or+order+to+be+accomplished+as+like+a+sacrifice%3F%E2%80%99%2C+p.+360&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F67001ea550.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/67001ea550.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=We%20respond%3A%20it%20is%20further%20asked,in%20courts%2C%20halls%2C%20schools%2C%20barracks%2C%20colleges&amp;text

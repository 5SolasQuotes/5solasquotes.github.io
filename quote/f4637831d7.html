<main class="wrap"><figure class="quote" id="q-f4637831d7" data-kw="">
<blockquote><p>It seems proper, in the mean time, to remark that, amongst the various acts of faith which we are about to describe, there is one which holds the principal place, and in which, as it unites us to Christ and justifies us, we apprehend the essence and formal nature of faith to consist. This must be carefully attended to, particularly in the matter of justification; lest several expressions of love which, in different ways, are involved in the exercise of faith, should be rashly numbered among the causes of our justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacred Dissertations, on What Is Commonly Called the Apostles’ Creed</cite>, 1.37.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ.html">Union with Christ</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-de9c7888de" data-kw="">
<blockquote><p>By the Understanding, Will, and Affection, the Soul doth (as it were) enter into God, and God into the Soul; whence followeth (as it were) a mutual in-being of one in another, and an intimate vital union between God and the Soul. Either the vision, fruition, and love of God, is Blessednesse, or there is no Blessednesse; God is not God, Heaven is not Heaven; the Creature, according to the best, namely, the Gospel-dispensation of God, is capable of no more, needs no more, can have no more; God in Christ doth no more for Man, man needs no more from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, London, 1654, ch. 15, p. 335</span></figcaption>

</figure><figure class="quote" id="q-d4c4f08593" data-kw="">
<blockquote><p>Durand [d. 1296] distinguisheth of a twofold composition: Hujus ex his [of this out of that], &amp; hujus ad hoc [of this to that] (bk. 3, Distinction 7, question 3 [this distinction is from Aristotle]). … ‘There is’ (says he) ‘a second kind of composition, and that is hujus ad hoc, and it is not so properly a composition of a third thing out of the things united, as an adjoining of one of the things united unto the other. And thus the person of the Word after the incarnation may be said to be compounded. For hereby, the human nature is added unto the person of the Word and unto the divine nature in the unity of the same person.’ But now, he also subdivides this composition, which he terms hujus ad hoc. ‘For it is either by inherence of one thing in another, and such is the composition of an accident with its subject: or else by way of a supposital dependance of one thing upon, and relation unto another: so that the one should substantially inexist in the other, and the other should terminate the respect and dependance of the former, which inexists, and after this latter manner the person of the Word is after the incarnation compounded. Because, whereas before, it subsisted only in the divine nature, after the incarnation, it by it’s subsistence terminated the dependance of the human nature.’ Thus he. … A second objection is taken from the completeness of the Word. That which comes unto a thing already complete and perfect, comes thereunto only accidentally, and makes therewith only an aggregation, and not a substantial union. But now the person of the Word, from all eternity, was most perfect, and complete. And therefore the adding or coming of the manhood unto it, is not substantial, but accidental. For answer: The major is true only, when one thing is so added, and comes unto another, as that it pertains not to the same subsistence. And thus a man’s garment is added unto him, and therefore united with him only accidentally; so that homo vestitus is ens unum tantum per accidens. But now the manhood is so added, and comes unto the Word, that it is drawn, or assumed into a communion of subsistence with the word, and it’s divine nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Mixture of Scholastical Divinity, with Practical, in Several Tractates</cite>, … (Oxford, 1656), ‘There dwelleth in Christ all fullness’, pp. 146 &amp; 149-50 Jeanes was an English presbyterian.</span></figcaption>

</figure><figure class="quote" id="q-ed50f0f0ca" data-kw="">
<blockquote><p>Objection: If Christ as God-man be Mediator, then the divine nature subsisting in the relation of the Son, received the Office of Mediator, and consequently something may be added to God, but nothing can be added to God because He is perfection itself? Answer: The divine nature received not the office as considered in itself, but in respect of its voluntary dispensation, as accepting of subsistence with the human nature, i.e. Christ received and sustained the Office of Mediatour, not as God alone, nor as man alone, but as God-man: the divine nature in respect of its voluntary dispensation: the human nature properly. To the divine nature there is not anything added, only a relation: but to the human nature there is added a real change.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-clarke.html">Samuel Clarke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Medulla Theologiæ, or, The Marrow of Divinity contained in Sundry Questions &amp; Cases of Conscience</cite>, (London, 1659), ch. 29, ‘Questions &amp; Cases of Conscience about Christ’, p. 294</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

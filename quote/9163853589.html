<blockquote><p>And it shall be, when you are come in unto the land which the Lord your God gives you for an inheritance, and possess it, and dwell therein; That you shall take of the first of all the fruit of the earth, which you shall bring of your land that the Lord your God gives you, and shall put it in a basket, and shall go unto the place which the Lord your God shall choose to place his name there. And you shall go unto the priest that shall be in those days, and say unto him, ‘I profess this day unto the Lord your God, that I am come unto the country which the Lord swore unto our fathers for to give us.’ And the priest shall take the basket out of your hand, and set it down before the altar of the Lord your God. And you shall speak and say before the Lord your God, ‘A Syrian ready to perish was my father [Jacob], and he went down into Egypt, and sojourned there with a few, and became there a nation, great, mighty, and populous: And the Egyptians evil entreated us, and afflicted us, and laid upon us hard bondage: And when we cried unto the Lord God of our fathers, the Lord heard our voice, and looked on our affliction, and our labor, and our oppression: And the Lord brought us forth out of Egypt with a mighty hand, and with an outstretched arm, and with great terribleness, and with signs, and with wonders: And He has brought us into this place, and has given us this land, even a land that flows with milk and honey. And now, behold, I have brought the firstfruits of the land, which You, O Lord, have given me.’ And you shall set it before the Lord your God, and worship before the Lord your God: And you shall rejoice in every good thing which the Lord your God has given unto you, and unto your house, you, and the Levite, and the stranger that is among you.</p></blockquote>

</figure><figure class="quote" id="q-56d954c30d" data-kw="">
<blockquote><p>Heaven-work and heart-work are the chiefest parts of Christian duty. Christ often gives us his summaries of the Law and inculcates his great Command; Jn. 13:35; Mt. 22:37-39; Lk. 10:27. And so does the apostle, Rom. 13:10; 1 Pet. 1:22; 1 Jn. 3:11, 14, 23 &amp; 4:7, 11-12, 20; 2 Jn. 5. And the fruits of the Spirit are manifest, Gal. 5:22-23. James says that pure religion and undefiled before God, even the Father, is this, to visit the fatherless and widows in adversity and to keep ourselves unspotted of the world, James 1:27. Paul says, 1 Tim. 1:5, ‘The end of the commandment is charity out of a pure heart, and of a good conscience and of faith unfeigned:’ And then adds, ‘From which some having swerved, have turned aside to vain janglings’— In a word: The effectual belief of pardon and eternal glory given through Christ, and the love of God and man, with the denial of ourselves, and fleshly desires, and contempt of all things in the world, which are competitors with God and our salvation, with a humble patient enduring of all which must be suffered for these ends, is the nature and sum of the Christian religion. Do nothing therefore as a duty which is a hinderance to any of this. Contentious preachings and factious sidings which weaken love are not of God. The servant of the Lord must not strive, but be gentle to all men, 2 Tim. 2:24… It is one of the most important things in the world for the resolving of a thousand cases of conscience and the directing of a Christian life to know which duties are the greater and which are the lesser, and so which is to be preferred in competition; For that which is a duty at another time is a sin when it is done instead of a greater! as Christ has resolved in the case of the Sabbath. If good must be loved as good, then the greatest good must be most loved and sought. Sacrifice instead of mercy is a sin: Our gift must be left at the altar while we go to be reconciled to our brother. Mt. 5. Never hearken to those men who would set up their controverted duties or any positives and lesser things against the duties of nature itself or the great substantial parts of godliness.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Heaven-work and heart-work are the chiefest parts of Christian duty. Christ often gives us his summaries of the Law and inculcates his great Command; Jn. 13:35; Mt. 22:37-39; Lk. 10:27. And so does the apostle, Rom. 13:10; 1 Pet. 1:22; 1 Jn. 3:11, 14, 23 &amp; 4:7, 11-12, 20; 2 Jn. 5. And the fruits of the Spirit are manifest, Gal. 5:22-23. James says that pure religion and undefiled before God, even the Father, is this, to visit the fatherless and widows in adversity and to keep ourselves unspotted of the world, James 1:27. Paul says, 1 Tim. 1:5, ‘The end of the commandment is charity out of a pure heart, and of a good conscience and of faith unfeigned:’ And then adds, ‘From which some having swerved, have turned aside to vain janglings’— In a word: The effectual belief of pardon and eternal glory given through Christ, and the love of God and man, with the denial of ourselves, and fleshly desires, and contempt of all things in the world, which are competitors with God and our salvation, with a humble patient enduring of all which must be suffered for these ends, is the nature and sum of the Christian religion. Do nothing therefore as a duty which is a hinderance to any of this. Contentious preachings and factious sidings which weaken love are not of God. The servant of the Lord must not strive, but be gentle to all men, 2 Tim. 2:24… It is one of the most important things in the world for the resolving of a thousand cases of conscience and the directing of a Christian life to know which duties are the greater and which are the lesser, and so which is to be preferred in competition; For that which is a duty at another time is a sin when it is done instead of a greater! as Christ has resolved in the case of the Sabbath. If good must be loved as good, then the greatest good must be most loved and sought. Sacrifice instead of mercy is a sin: Our gift must be left at the altar while we go to be reconciled to our brother. Mt. 5. Never hearken to those men who would set up their controverted duties or any positives and lesser things against the duties of nature itself or the great substantial parts of godliness.”

— Richard Baxter, The Cure of Church Divisions… (London, 1670), pt. 1, Direction 39, ‘Know which are the great duties of a Christian life, and wherein the nature of true Religion does consist; and then pretend not any lesser duty against those greater, though the least when it is indeed a duty, is not to be denied or neglected’, pp. 209-10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHeaven-work+and+heart-work+are+the+chiefest+parts+of+Christian+duty.+Christ+often+gives+us+his+summaries+of+the+Law+and+inculcates+his+great+Command%3B+Jn.+13%3A35%3B+Mt.+22%3A37-39%3B+Lk.+10%3A27.+And+so+does+the+apostle%2C+Rom.+13%3A10%3B+1+Pet.+1%3A22%3B+1+Jn.+3%3A11%2C+14%2C+23+%26+4%3A7%2C+11-12%2C+20%3B+2+Jn.+5.+And+the+fruits+of+the+Spirit+are+manifest%2C+Gal.+5%3A22-23.+James+says+that+pure+religion+and+undefiled+before+God%2C+even+the+Father%2C+is+this%2C+to+visit+the+fatherless+and+widows+in+adversity+and+to+keep+ourselves+unspotted+of+the+world%2C+James+1%3A27.+Paul+says%2C+1+Tim.+1%3A5%2C+%E2%80%98The+end+of+the+commandment+is+charity+out+of+a+pure+heart%2C+and+of+a+good+conscience+and+of+faith+unfeigned%3A%E2%80%99+And+then+adds%2C+%E2%80%98From+which+some+having+swerved%2C+have+turned+aside+to+vain+janglings%E2%80%99%E2%80%94+In+a+word%3A+The+effectual+belief+of+pardon+and+eternal+glory+given+through+Christ%2C+and+the+love+of+God+and+man%2C+with+the+denial+of+ourselves%2C+and+fleshly+desires%2C+and+contempt+of+all+things+in+the+world%2C+which+are+competitors+with+God+and+our+salvation%2C+with+a+humble+patient+enduring+of+all+which+must+be+suffered+for+these+ends%2C+is+the+nature+and+sum+of+the+Christian+religion.+Do+nothing+therefore+as+a+duty+which+is+a+hinderance+to+any+of+this.+Contentious+preachings+and+factious+sidings+which+weaken+love+are+not+of+God.+The+servant+of+the+Lord+must+not+strive%2C+but+be+gentle+to+all+men%2C+2+Tim.+2%3A24%E2%80%A6+It+is+one+of+the+most+important+things+in+the+world+for+the+resolving+of+a+thousand+cases+of+conscience+and+the+directing+of+a+Christian+life+to+know+which+duties+are+the+greater+and+which+are+the+lesser%2C+and+so+which+is+to+be+preferred+in+competition%3B+For+that+which+is+a+duty+at+another+time+is+a+sin+when+it+is+done+instead+of+a+greater%21+as+Christ+has+resolved+in+the+case+of+the+Sabbath.+If+good+must+be+loved+as+good%2C+then+the+greatest+good+must+be+most+loved+and+sought.+Sacrifice+instead+of+mercy+is+a+sin%3A+Our+gift+must+be+left+at+the+altar+while+we+go+to+be+reconciled+to+our+brother.+Mt.+5.+Never+hearken+to+those+men+who+would+set+up+their+controverted+duties+or+any+positives+and+lesser+things+against+the+duties+of+nature+itself+or+the+great+substantial+parts+of+godliness.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Cure+of+Church+Divisions%E2%80%A6+%28London%2C+1670%29%2C+pt.+1%2C+Direction+39%2C+%E2%80%98Know+which+are+the+great+duties+of+a+Christian+life%2C+and+wherein+the+nature+of+true+Religion+does+consist%3B+and+then+pretend+not+any+lesser+duty+against+those+greater%2C+though+the+least+when+it+is+indeed+a+duty%2C+is+not+to+be+denied+or+neglected%E2%80%99%2C+pp.+209-10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F56d954c30d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/56d954c30d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/ethics#:~:text=Heaven%2Dwork%20and%20heart%2Dwork%20are%20the%20chiefest,the%20great%20substantial%20parts%20of%20godliness&amp;text=Heaven%2Dwork%20and%20heart%2Dwork%20are%20the%20chiefest%20parts%20of&amp;text=itself%20or%20the%20great%20substantial%20parts%20of%20godliness" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

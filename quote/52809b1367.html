<main class="wrap"><figure class="quote" id="q-52809b1367" data-kw="">
<blockquote><p>CIVILITY is a very comely thing; but if it be not attended with sanctity, it but gilds a man over, and is not true gold. A man may have civility, and civil honesty, and yet go to hell: but sanctity and purity is the beginning of heaven. The one is not above the sphere of nature, the other is supernatural; for a the earth naturally can bring forth grass, but cannot bring forth corn, except it be plowed and sown; even so, any man may naturally be civil, but he cannot attain to any life of grace, or true holiness, except God plow up the fallow ground of the heart, so the seed of grace, and make it to take root downward, and bring forth fruit upward.

Therefore, trust not to common civility and sobriety, whatever external comeliness and excellency be in it; but rather be afraid of it, lest you mistake it for real grace; why, because the sober devil carries more to hell, than the profane devil; for the profane man, being in a dirty way to hell, he is sooner convinced of his filthiness and misery, and more readily reclaimed but the civil man, being in a more cleanly way to hell, is so conceited with an opinion that he has grace already, that it is hard to bring him to true repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nature and Excellency of Gospel Purity Opened in The Sermons and other Practical Works of the Late Reverend and Learned Mr. Ralph Erskine, A.M. Minister of the Gospel in Dunfermline</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-04f5fdfaeb" data-kw="">
<blockquote><p>We must distinctly understand, that neither here nor elsewhere does the Lord Jesus overthrow the obligation of the fourth commandment. Neither here nor elsewhere is there a word to justify the vague assertions of some modern teachers, that “Christians ought not to keep a Sabbath,” and that it is “a Jewish institution which has passed away.”

The utmost that our Lord does, is to place the claims of the Sabbath on the right foundation. He clears the day of rest from the false and superstitious teaching of the Jews, about the right way of observing it. He shows us clearly that works of necessity and works of mercy are no breach of the fourth commandment.</p></blockquote>

</figure><figure class="quote" id="q-364bdb303f" data-kw="">
<blockquote><p>Dr. [John] Rainolds objected the example of the brazen serpent, demolished and stamped to powder by Ezekiel, because the people abused it to idolatry: wishing, that, in like sort, the cross should be abandoned, because in the time of Popery it had been superstitiously abused. Whereunto the King’s Majesty answered diverse ways: First, quoth he, though I be sufficiently persuaded of the cross in baptism, and the commendable use thereof in the Church so long: yet, if there were nothing else to move me, this very argument were an inducement to me for the retaining of it, as it is now by order established: For, inasmuch, as it was abused, so you say, to superstition in time of popery, it does plainly imply, that it was well used before Popery. I will tell you, I haue lived among this [dissenting] sort of men (speaking to the lords and bishops) ever since I was ten years old, but I may say of myself as Christ did of Himself: Though I lived amongst them, yet since I had ability to judge, I was never of them; neither did anything make me more to condemn and detest their courses than that they did so peremptorily disallow of all things which at all had been used in Popery. For my part, I know not how to answer the objection of the Papists, when they charge us with novelties: but truly to tell them that their abuses are new, but the things which they abused we retain in their primitive use, and forsake only the novel corruption. By this argument we might renounce the Trinity and all that is holy, because it was abused in Popery (and speaking to Doctor Rainolds merely) they used to wear hose and shoes in Popery, therefore, you shall, now, go barefoot. Secondly, quoth his Majesty, what resemblance is there between the brazen serpent, a material visible thing, and the sign of the cross made in the air? Thirdly, I am given to understand by the bishops, and I find it true, that the Papists themselves did never ascribe any power or spiritual grace to the sign of the cross in baptism. Fourthly, you see, that the material crosses, which in time of Popery were made, for men to fall down before them, as they passed by them, to worship them (as the idolatrous Jews did the brazen serpent) are demolished, as you desire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/king-james-i.html">King James I</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ed. William Barlow, The Sum &amp; Substance of the Conference which it pleased his excellent Majesty to have with the Lords, Bishops &amp; other of his Clergy… at Hampton Court, January 14, 1603 (London: Windet, 1604), 2nd Day, pp. 67-74</span></figcaption>

and+speaking+to+Doctor+Rainolds+merely%29+they+used+to+wear+hose+and+shoes+in+Popery%2C+therefore%2C+you+shall%2C+now%2C+go+barefoot.+Secondly%2C+quoth+his+Majesty%2C+what+resemblance+is+there+between+the+brazen+serpent%2C+a+material+visible+thing%2C+and+the+sign+of+the+cross+made+in+the+air%3F+Thirdly%2C+I+am+given+to+understand+by+the+bishops%2C+and+I+find+it+true%2C+that+the+Papists+themselves+did+never+ascribe+any+power+or+spiritual+grace+to+the+sign+of+the+cross+in+baptism.+Fourthly%2C+you+see%2C+that+the+material+crosses%2C+which+in+time+of+Popery+were+made%2C+for+men+to+fall+down+before+them%2C+as+they+passed+by+them%2C+to+worship+them+%28as+the+idolatrous+Jews+did+the+brazen+serpent%29+are+demolished%2C+as+you+desire.%E2%80%9D%0A%0A%E2%80%94+King+James+I%2C+Other+citations+%28work+not+named%29%2C+ed.+William+Barlow%2C+The+Sum+%26+Substance+of+the+Conference+which+it+pleased+his+excellent+Majesty+to+have+with+the+Lords%2C+Bishops+%26+other+of+his+Clergy%E2%80%A6+at+Hampton+Court%2C+January+14%2C+1603+%28London%3A+Windet%2C+1604%29%2C+2nd+Day%2C+pp.+67-74&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F364bdb303f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/364bdb303f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=Dr.%20%5BJohn%5D%20Rainolds%20objected%20the%20example,serpent%29%20are%20demolished%2C%20as%20you%20desire&amp;text=Dr.%20%5BJohn%5D%20Rainolds%20objected%20the%20example%20of%20the&amp;text=the%20brazen%20serpent%29%20are%20demolished%2C%20as%20you%20desire" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

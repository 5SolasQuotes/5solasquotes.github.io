<main class="wrap"><figure class="quote" id="q-0433b9d43f" data-kw="">
<blockquote><p>And here appeareth the abuse of our time, which following rather the phantasy of carers or painters, than the word of God have set up in churches the image (as they call it) of the Trinity, where they portrayed God the father like an old man with a long hairy beard. And what can simple people learn herby, but error, and ignorance?

Have not many thought that God the father is a bodily substance, &amp; that he hath a face, and beard, hands, and feet, because they see him so painted? And for this consideration saith saint Austen [Augustine], it is a detestable thing for Christian men to have any such image of God in the church, whereby it appeareth that in saint Austen’s times, there were no such images in christen churches, but that it is an invention of the papists brought in of later years, which bringeth us not unto the true knowledge of god, but leadeth vs into errors and ignorance of God. …

We have also the holy scriptures which declare unto us the wonderful works of God, by which things we may be led to the knowledge of God without painted or carved images. Now peradventure some will say that Christ hath a body, and likewise have saints, &amp; therefore of them we may have images although of God there can be made no image. And further they will say, that the cause why images were forbid, was peril of idolatry, and worshipping of them. So that where there is no such peril, we may have images.

Yet as I will not utterly deny but they may be had, so I think it more convenient for Christian religion that they should be taken out of Christian men’s churches, then that they should be placed in the temple of God. [1] And of this my opinion I will shew you certain good grounds, to the intent that when you be demanded, why we English men have no images in our churches, you may be able to make thereunto a reasonable answer, and that also in time to come you may declare to your children what abuses have crept into the church by the occasion of images. That if any man shall hereafter god about craftily to bring in images again for his own lucre sake, they may the sooner perceive his Iuglynge [sic], and so the better avoid the peril and danger.

First it is certain, that we neither have commandment, counsel nor example of the scripture, nor of the primitive church in the apostles’ time, nor many years after to set up images in our churches. … It cannot be said that images be necessary, for then we condemn the apostles, and al the holy men in the primitive church, yea and Christ himself also because they used no such thing, nor yet that they be profitable, for if they had, either Christ would have taught it or the holy ghost would have revealed it, unto the apostles which they did not. And if they did, the apostles, were very negligent that would not make some mention of it, and speak some good word for images, seeing that they speak so many against them.

And by this means Antichrist and his holy papists, had more knowledge or fervent zeal to give us godly things, and profitable for us, than had the very holy saints of Christ, yea more than Christ himself, and the holy ghost. Now forasmuch good children, as images be neither necessary nor profitable in our churches and temples, nor were not used at the beginning in Christ nor the apostles time, nor many years after, and that at length they were brought in by Bishops of Rome …, &amp; seeing also that they be very slanderous to Christ’s religion, for by them the name of God is blasphemed among the infidels, Turks, and Jews, which because of our images do call Christian religion Idolatry and worshipping of images.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cranmer.html">Thomas Cranmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechismus, that is to say, a short instruction into Christian religion for the singular commodity and profit of children and young people</cite>, (n.p., 1548), unpaginated.</span></figcaption>

<blockquote><p>Indeed, the true God, who is an infinite and incomprehensible Spirit, and the Persons of the most holy Trinity, whether jointly or separately, must not be fashioned and represented by any visible image, whether of things in heaven, or on earth or in the waters, or of any kind of imagined form whatsoever, either by painting, sculpting, or casting, or any other way, for any end and use, whether political or religious, public or private. But images, appearances, likenesses, figures and forms of this sort are wholly to be foregone, fled from, and abominated, as forbidden by the commandment of God, and contrary to the glory of the divine majesty.</p></blockquote>

<blockquote><p>…external adoration is due two ways:

1. When we approach God in immediate acts of worship, as prayer, and praises.

2. When it pleases God in an extraordinary manner to appear in his glory; the due season then for external signs of inward homage and reverence is when we perform these immediate acts of worship in our assemblies, or if God shall please, to give glorious signs of his extraordinary presence, as he did to Moses when the Bush was burning but not consumed, or as the Lord appeared, after Solomon had made an end of praying, when the fire came down from Heaven and the glory of the Lord filled the house; then all the Children of Israel, beholding the fire and glory of the Lord, bowed themselves and worshipped; whensoever the Lord does thus appear, external adoration is due.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-craghead.html">Robert Craghead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to a Late Book entitled, A Discourse concerning the Inventions of Men</cite>, ... (Edinburgh: Anderson, 1694), ch. 4, ‘Of Bodily Worship’, section 2, p. 96 Craghead (1633–1711) was a presbyterian minister, born in Scotland, who ministered in Ireland.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

1. When we approach God in immediate acts of worship, as prayer, and praises.

2. When it pleases God in an extraordinary manner to appear in his glory; the due season then for external signs of inward homage and reverence is when we perform these immediate acts of worship in our assemblies, or if God shall please, to give glorious signs of his extraordinary presence, as he did to Moses when the Bush was burning but not consumed, or as the Lord appeared, after Solomon had made an end of praying, when the fire came down from Heaven and the glory of the Lord filled the house; then all the Children of Israel, beholding the fire and glory of the Lord, bowed themselves and worshipped; whensoever the Lord does thus appear, external adoration is due.”

— Robert Craghead, An Answer to a Late Book entitled, A Discourse concerning the Inventions of Men, ... (Edinburgh: Anderson, 1694), ch. 4, ‘Of Bodily Worship’, section 2, p. 96 Craghead (1633–1711) was a presbyterian minister, born in Scotland, who ministered in Ireland.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6external+adoration+is+due+two+ways%3A%0A%0A1.+When+we+approach+God+in+immediate+acts+of+worship%2C+as+prayer%2C+and+praises.%0A%0A2.+When+it+pleases+God+in+an+extraordinary+manner+to+appear+in+his+glory%3B+the+due+season+then+for+external+signs+of+inward+homage+and+reverence+is+when+we+perform+these+immediate+acts+of+worship+in+our+assemblies%2C+or+if+God+shall+please%2C+to+give+glorious+signs+of+his+extraordinary+presence%2C+as+he+did+to+Moses+when+the+Bush+was+burning+but+not+consumed%2C+or+as+the+Lord+appeared%2C+after+Solomon+had+made+an+end+of+praying%2C+when+the+fire+came+down+from+Heaven+and+the+glory+of+the+Lord+filled+the+house%3B+then+all+the+Children+of+Israel%2C+beholding+the+fire+and+glory+of+the+Lord%2C+bowed+themselves+and+worshipped%3B+whensoever+the+Lord+does+thus+appear%2C+external+adoration+is+due.%E2%80%9D%0A%0A%E2%80%94+Robert+Craghead%2C+An+Answer+to+a+Late+Book+entitled%2C+A+Discourse+concerning+the+Inventions+of+Men%2C+...+%28Edinburgh%3A+Anderson%2C+1694%29%2C+ch.+4%2C+%E2%80%98Of+Bodily+Worship%E2%80%99%2C+section+2%2C+p.+96+Craghead+%281633%E2%80%931711%29+was+a+presbyterian+minister%2C+born+in+Scotland%2C+who+ministered+in+Ireland.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa88169a2f4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a88169a2f4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/images-of-the-burning-bush-are-unlawful/#:~:text=external%20adoration%20is%20due%20two%20ways,thus%20appear%2C%20external%20adoration%20is%20due&amp;text=external%20adoration%20is%20due%20two%20ways%3A%201.%20When&am

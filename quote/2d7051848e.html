<blockquote><p>For Rutherford if something is essentially good it cannot be said also to be freely good. This is because everything that God freely decrees he is also able not to decree.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6c1d14f854" data-kw="">
<blockquote><p>Finally, it is to be noted that though in some things we may and do commendably refuse obedience to the laws of those whom God has set over us, yet are we ever obliged (and accordingly intend) still to subject ourselves unto them. For to be subject, does signify (as Zanchius shows [Commentary on Eph. 5, on Subject.]) to be placed under, to be subordinate, and so to give honor and reverence to him who is above, which may well stand without obedience to every one of his laws. Yea and Dr. Field [an Anglican] also tells us, that subjection is generally and absolutely required, where obedience is not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies… (1637), | ‘To All &amp; Every One in the Reformed Churches…’, no page number</cite></span></figcaption>

<blockquote><p>1. An unrighteous judge does condemn the cause of God Himself: For every righteous cause is his. 2. …It is a damnable sin not to relieve the innocent and imprisoned in their distress, when we have power… 3. It is a turning of the remedy into a double misery; and taking away the only help of oppressed innocency. What other defense has innocency, but Law and Justice? And when their refuge itself does fall upon them and oppress them, whither shall the righteous fly? 4. It subverts laws and government, and abuses it to destroy the ends which it is appointed for. 5. Thereby it turns human society into a state of misery, like the depredations of hostility. 6. It is a deliberate resolved sin, and not done in a passion by surprise: It is committed in that place, and in that form, as acts of greatest deliberation should be done: As if he should say, upon full disquisition, evidence and deliberation, I condemn this person, and his cause. 7. All this is done as in the Name of God, and by his own commission, by one that pretends to be his officer or minister, Rom. 3:3- 6. For the judgement is the Lord’s; 2 Chron. 19:8-10 &amp; 19:5-7. And how great a wickedness is it thus to blaspheme, and to represent Him as Satan, an enemy to truth and righteousness, to his servants and Himself?… 8. It is sin against the fullest and frequentest prohibitions of God. Read over Ex. 23:1-3, etc.; Lev. 10:15; Dt. 1:16-17 &amp; 16:18; Isa. 1:17, 20, 23; Dt. 24:17 &amp; 27:19, ‘Cursed be he that perverts the judgement of the stranger, the fatherless and widow, and all the people shall say Amen’; Ezra 7:26; Ps. 33:5 &amp; 37:28 &amp; 72:2 &amp; 94:15 &amp; 106:3,30; Prov. 17:27 &amp; 19:28 &amp; 20:8 &amp; 29:4 &amp; 31:5; Eccl. 5:8; Isa. 5:7 &amp; 10:2 &amp; 56:1-2 &amp; 59:14-15; Jer. 5:1 &amp; 7:5 &amp; 9:24; Eze. 18:8 &amp; 45:9; Hos. 12:6; Amos 5:7,15,24 &amp; 6:12; Mic. 3:9; Zech. 7:9 &amp; 8:16; Gen. 18:19; Prov. 21:3,7,15. I cite not the words to avoid prolixity… 9. False judges cause the poor to appeal to God against them, and the cries of the afflicted shall not be forgotten, Lk. 18:5-8. 10. They call for God’s judgement upon themselves, and devolve the work into his hands… Ps. 9:7-9, ‘The Lord hath prepared his throne for judgement, and he shall judge the world in righteousness, he shall minister judgement to the people in uprightness; he will be a refuge for the oppressed;’ Ps. 37:6, ‘He will bring forth righteousness as the light, and thy judgement as the noon day;’ Ps. 89:14, ‘Justice and judgement are the habitation of his throne;’ Ps. 103:6, ‘The Lord executeth righteousness and judgement for all that are oppressed;’ Ps. 146:7. In a word, the sentence of an unjust Judge is passed against his own soul, and he calls to God to condemn him righteously, who unrighteously condemned others. Of all men, he cannot stand in judgement, nor abide the righteous doom of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory… (London, 1673), pt 4, ch. 22, ‘Cases &amp; Directions Against Injurious Law-Suits, Witnessing &amp; Judgment’, § 4, III, ‘The Evil of Unrighteous Judgments’</cite>, p. 150</span></figcaption>

<blockquote><p>God can serve Himself of nothing, yea, that there are not created, locusts, caterpillars more numerous than that all the fruits of the earth can be food to them, preach the glory of the Lord’s goodness to man, and what are never to be, no less than all things that have futurition [come into being], or shall come to pass either absolutely or conditionally, are under the positive decree of God, else we should not owe thanks to the Lord for many evils that never fall out, that the Lord turns away violent death, violence of men and wild beasts, and many possible mischiefs, contrair to Deut. 28:11-12; Lev. 26:6; Ps. 34:20; Ps. 91:5-8. And all these beings or no-beings owe themselves to God to hold forth the glory of goodness, wisdom, mercy, justice, etc. suppone [suppose] there had never been sin: Far more now, who wants matter of meditation, or can write a book of all the pains, achings, convulsions, pests, diseases that the Lord decreed to hold off? so that every bone, joint, lith [limb], hair, member, should write a Psalm Book of praises, Ps. 35:10, ‘All my bones shall say, Lord, ‘Who is like unto thee?”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened… (Edinburgh, 1655)</cite>, pp. 17-18</span></figcaption>

<div class="actions"><button class="copy" data-copy="“God can serve Himself of nothing, yea, that there are not created, locusts, caterpillars more numerous than that all the fruits of the earth can be food to them, preach the glory of the Lord’s goodness to man, and what are never to be, no less than all things that have futurition [come into being], or shall come to pass either absolutely or conditionally, are under the positive decree of God, else we should not owe thanks to the Lord for many evils that never fall out, that the Lord turns away violent death, violence of men and wild beasts, and many possible mischiefs, contrair to Deut. 28:11-12; Lev. 26:6; Ps. 34:20; Ps. 91:5-8. And all these beings or no-beings owe themselves to God to hold forth the glory of goodness, wisdom, mercy, justice, etc. suppone [suppose] there had never been sin: Far more now, who wants matter of meditation, or can write a book of all the pains, achings, convulsions, pests, diseases that the Lord decreed to hold off? so that every bone, joint, lith [limb], hair, member, should write a Psalm Book of praises, Ps. 35:10, ‘All my bones shall say, Lord, ‘Who is like unto thee?””

<blockquote><p>…and it is most true, no man by the instinct of Nature gives consent to penal Laws as penal, for Nature does not teach a man, nor incline his spirit to yield that his life shall be taken away by the sword and his blood shed, except in this remote ground: a man has a disposition that a vein be cut by the physician, or a member of his body cut off, rather than the whole body and life perish by some contagious disease; but here reason in cold blood, not a natural disposition is the nearest prevalent cause and disposer of the business [in making such a penal law].</p></blockquote>

<main class="wrap"><figure class="quote" id="q-96d45ff267" data-kw="">
<blockquote><p>Plead hard with God, but plead with Him upon his own arguments; there are amongst many others, these four grounds on which to bottom your plea… 1. On God Himself. And there are two special things from which you may plead here: 1. His gracious nature. Fetch your arguments by which you plead with God for mercy thence, whence He originally fetched his arguments to persuade Himself to show mercy; from his own bowels, from his gracious nature, from his natural goodness and gracious inclination to mercy, Jn. 3:16, ‘God so loved the world that He gave his only Son, etc.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-alleine.html">Richard Alleine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ pietatis: or a Vindication of Godliness</cite>, … (London: 1665), Sermon on Jn. 1:47, 3. Learn the skill to plead with God in prayer, pp. 222-23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-21f5ef72eb" data-kw="">
<blockquote><p>Thus then is Christ made use of as the way to the Father in the point of justification when the poor weakened sinner, convinced of his sin and misery, of his own inability to help himself, of the insufficiency of all means beside Christ, of Christ’s all-sufficiency, readiness and willingness to help, of the equity and reasonableness of the conditions on which He is offered, and life through Him, is now content and fully satisfied with this way, actually renouncing all other ways whatsoever, and does with heart and hand embrace Jesus Christ and take Him as He is offered in the gospel to make use of Him for all things, to lean to Him and rest upon Him in all hazards; and particularly to refuge itself in his wings and to rest there with complacency, satisfaction and delight; and hide itself from the wrath of God and all accusations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Way the Truth &amp; the Life</cite>, (1677), ch. 6, How Christ is Made Use of for Justification, as a Way</span></figcaption>

</figure><figure class="quote" id="q-36cb0103bc" data-kw="">
<blockquote><p>1. As love stands opposed to hatred and wrath, and enmity. Considering man as God’s creature, he was not hated of God; God hates not the work of his own hand; but considering him as a lapsed creature, as degenerated into the plant of a strange vine, after that God had created him a generous, noble plant… How suitable to us now is it to have a Savior? That is love, and who has loves, considering the aversion in the holy Divine Being from mankind as rebellious seed, a seed of evil-doers? Who could have suited us to have become a Savior unto us, but one who had a kind propension and inclination to us, inclining Him to the great work of man’s redemption and reconciliation to God, especially also considering that there could be no remission of sins without blood…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Intercourses of Divine Love betwixt Christ &amp; his Church</cite>, (London: Snowden, 1683), p. 156</span></figcaption>

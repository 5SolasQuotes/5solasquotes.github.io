<main class="wrap"><figure class="quote" id="q-5de19dbffc" data-kw="">
<blockquote><p>How the Lord threatened plague after plague, and ever the last to be the sorest, till finally he will consume realms and nations if they repent not, read chapter 26 of Leviticus, which chapter oft I have willed you to mark, as yet I do unfeignedly. And think not that it appertaineth to the Jews only. No, brethren; the prophets are the interpreters of the law, and they make the plagues of God common to all offenders, the punishment ever beginning at the house-hold of God. […]

The prophets Isaiah, Jeremiah, Ezekiel, after they had proclaimed plagues to fall upon the people of Israel, and upon the house of Judah, prophesy particularly against certain nations and cities, nor only adjacent in circuit about Jerusalem, but also against such as were far distant; as against Moab, Ammon, Palestine, Egypt, Tyre, Damascus, and Babylon (Isa. 13; 15; 17; 18; 19; 20; 23; Jer. 59; 51; Ezek. 25; 26; 27). And in conclusion, general prophecies are spoken against all inobedient and sinful nations, as in chapter 24 of Isaiah plainly appeareth; as also, the Lord commanding Jeremiah to give the cup of his wrath to all nations, one after another; who should drink of the same, although they refused it of his hand (Jer. 25): that is, albeit they would not believe the voice of the prophet, yet should they not escape the plagues that he spoke: ‘For every nation like unto this, shall I punish, saith the Lord of Hosts’ (Jer. 5). With the same agreeth Amos, saying, ‘The eyes of the Lord are upon every sinful nation, to root it out of the earth’ (Amos 9). These, and many more places, evidently prove, that the plagues spoken of in the law of God, appertain to every rebellious people, be they Jew or be they Gentile, Christians in title, or Turks in profession. And the ground of the prophets was the same, which before I have rehearsed for my assurances that England shall be plagued; which is, God’s immutable and inviolable justice, that cannot spare in one realm and nation, those offences that most severely he hath punished in another: for so were he unequal, and to make differences, as touching execution of his just judgments betwixt person and person; which is most contrarious to the integrity of his justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the faithful in England in R. S. Candlish (ed.), Select practical writings of John Knox</cite></span></figcaption>

</figure><figure class="quote" id="q-be26a1a388" data-kw="">
<blockquote><p>Canon IV: Before the creation of the world, God decreed in Christ Jesus our Lord according to his eternal purpose (Eph 3:11), in which, from the mere good pleasure of his own will, without any prevision of the merit of works or of faith, to the praise of his glorious grace, to elect some out of the human race lying in the same mass of corruption and of common blood, and, therefore, corrupted by sin. He elected a certain and definite number to be led, in time, unto salvation in Christ, their Guarantor and sole Mediator. And on account of his merit, by the mighty power of the regenerating Holy Spirit, he decreed these elect to be effectually called, regenerated and gifted with faith and repentance. So, indeed, God, determining to illustrate his glory, decreed to create man perfect, in the first place, then permit him to fall, and finally pity some of the fallen, and therefore elect those, but leave the rest in the corrupt mass, and finally give them over to eternal destruction. Canon V: Christ himself is also included in the gracious decree of divine election, not as the meritorious cause, or foundation prior to election itself, but as being himself also elect (I Pet 2:4, 6). Indeed, he was foreknown before the foundation of the world, and accordingly, as the first requisite of the execution of the decree of election, chosen Mediator, and our first born Brother, whose precious merit God determined to use for the purpose of conferring, without detriment to his own justice, salvation upon us. For the Holy Scriptures not only declare that election was made according to the mere good pleasure of the divine counsel and will (Eph 1:5, 9; Matt 11:26), but was also made that the appointment and giving of Christ, our Mediator, was to proceed from the zealous love of God the Father toward the world of the elect. Canon VI: Wherefore, we can not agree with the opinion of those who teach: l) that God, moved by philanthropy, or a kind of special love for the fallen of the human race, did, in a kind of conditioned willing, first moving of pity, as they call it, or inefficacious desire, determine the salvation of all, conditionally, i.e., if they would believe, 2) that he appointed Christ Mediator for all and each of the fallen; and 3) that, at length, certain ones whom he regarded, not simply as sinners in the first Adam, but as redeemed in the second Adam, he elected, that is, he determined graciously to bestow on these, in time, the saving gift of faith; and in this sole act election properly so called is complete. For these and all other similar teachings are in no way insignificant deviations from the proper teaching concerning divine election; because the Scriptures do not extend unto all and each God’s purpose of showing mercy to man, but restrict it to the elect alone, the reprobate being excluded even by name, as Esau, whom God hated with an eternal hatred (Rom 9:11). The same Holy Scriptures testify that the counsel and will of God do not change, but stand immovable, and God in the, heavens does whatsoever he will (Ps 115:3; Isa 47:10); for God is in finitely removed from all that human imperfection which characterizes inefficacious affections and desires, rashness repentance and change of purpose. The appointment, also, of Christ, as Mediator, equally with the salvation of those who were given to him for a possession and an inheritance that can not be taken away, proceeds from one and the same election, and does not form the basis of election.</p></blockquote>

or%2C+was+to+proceed+from+the+zealous+love+of+God+the+Father+toward+the+world+of+the+elect.+Canon+VI%3A+Wherefore%2C+we+can+not+agree+with+the+opinion+of+those+who+teach%3A+l%29+that+God%2C+moved+by+philanthropy%2C+or+a+kind+of+special+love+for+the+fallen+of+the+human+race%2C+did%2C+in+a+kind+of+conditioned+willing%2C+first+moving+of+pity%2C+as+they+call+it%2C+or+inefficacious+desire%2C+determine+the+salvation+of+all%2C+conditionally%2C+i.e.%2C+if+they+would+believe%2C+2%29+that+he+appointed+Christ+Mediator+for+all+and+each+of+the+fallen%3B+and+3%29+that%2C+at+length%2C+certain+ones+whom+he+regarded%2C+not+simply+as+sinners+in+the+first+Adam%2C+but+as+redeemed+in+the+second+Adam%2C+he+elected%2C+that+is%2C+he+determined+graciously+to+bestow+on+these%2C+in+time%2C+the+saving+gift+of+faith%3B+and+in+this+sole+act+election+properly+so+called+is+complete.+For+these+and+all+other+similar+teachings+are+in+no+way+insignificant+deviations+from+the+proper+teaching+concerning+divine+election%3B+because+the+Scriptures+do+not+extend+unto+all+and+each+God%E2%80%99s+purpose+of+showing+mercy+to+man%2C+but+restrict+it+to+the+elect+alone%2C+the+reprobate+being+excluded+even+by+name%2C+as+Esau%2C+whom+God+hated+with+an+eternal+hatred+%28Rom+9%3A11%29.+The+same+Holy+Scriptures+testify+that+the+counsel+and+will+of+God+do+not+change%2C+but+stand+immovable%2C+and+God+in+the%2C+heavens+does+whatsoever+he+will+%28Ps+115%3A3%3B+Isa+47%3A10%29%3B+for+God+is+in+finitely+removed+from+all+that+human+imperfection+which+characterizes+inefficacious+affections+and+desires%2C+rashness+repentance+and+change+of+purpose.+The+appointment%2C+also%2C+of+Christ%2C+as+Mediator%2C+equally+with+the+salvation+of+those+who+were+given+to+him+for+a+possession+and+an+inheritance+that+can+not+be+taken+away%2C+proceeds+from+one+and+the+same+election%2C+and+does+not+form+the+basis+of+election.%E2%80%9D%0A%0A%E2%80%94+J.+H.+Heidegger+and+Francis+Turretin%2C+Helvetic+Consensus+Formula%2C+%281675%29&amp;url=https%3A%2F%

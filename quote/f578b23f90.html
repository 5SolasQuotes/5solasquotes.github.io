<main class="wrap"><figure class="quote" id="q-f578b23f90" data-kw="">
<blockquote><p>These movements are named as English Methodism and above all in our day the so-called Sanctification-movement. The language in which they are introduced is very carefully guarded, but what is meant is simply that in these two movements, Methodism and what we know as the Higher Life Movement, with its continuations, we have “reactions” from the Reformation doctrine of the “miserable sinner.” And accordingly we are told clearly a page or two later, where the problem of sin in the Christian life is spoken of, that “Methodism and the Sanctification-movement present therefore a reaction from the solution of Christian miserable-sinnerism which is fostered in Lutheran circles.” This representation is true.

The perfectionist teaching of these several movements, whether in its crasser or in its more guarded forms, is a revolt against the Reformation doctrine not only of the continued imperfection of the Christian in this life where he enjoys only the first fruits of salvation, but of sin and grace in general, which constitutes the pivot on which the whole system of Reformation teaching turns.

And we may count it among the most beneficent results of the discussion of the Biblical teaching on the sins of Christians which we have been reviewing, if we can learn from it this fact; and with it this other fact, that the appeal of these movements to the Scripture in behalf of their teaching has, in the most elaborate effort which has yet been made to validate it, completely failed. The most striking thing about the long continued attempt which has been made to prove that to Paul the Christian is a sinless man is the clearness with which it has come out that Paul knows nothing of a sinless man in this life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Miserable-Sinner Christianity in the Hands of the Rationalists. Article III: Windisch and the End’, Princeton Theological Review</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0f1484223b" data-kw="">
<blockquote><p>IV… The soul, being simple and immaterial—opposite to material things—existing wholly in the whole body and in each of its parts, [in the Garden of Eden] subsisted independently of the body in both being and operation, and it would have persisted independently of the body even after death, contrary to the claims of Socinus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-essenius.html">Andreas Essenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Image of God in Man’ Download</cite>, tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653) Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>
<div class="actions"><button class="copy" data-copy="“IV… The soul, being simple and immaterial—opposite to material things—existing wholly in the whole body and in each of its parts, [in the Garden of Eden] subsisted independently of the body in both being and operation, and it would have persisted independently of the body even after death, contrary to the claims of Socinus.”

</figure><figure class="quote" id="q-e54fea7c48" data-kw="">
<blockquote><p>…the difficulty to do good, proneness to evil, contrariety between the powers and faculties of the soul, and the rebellion of the meaner against the superior and better, are not the conditions of nature, as it was or might have been in itself before the entrance of sin, but that all these proceed from the putting of the powers of the soul, by the loss of grace, out of that course, which by the law of God and nature they were to hold. For does not the condition of man’s nature require that amongst things inquired after, thought of, and known, God should be the first? and amongst things desired and loved, nothing should be desired and loved more or before Him, nor otherwise than for Him? and is it not clear and evident, that if God be the first thing that is thought of, sought after, and loved, and that nothing be sought after or respected, but after and for God, that there will be no proneness to evil, difficultire to do good, contrariety between the powers of the soul, and rebellion of the meaner and inferior against the better and superior? surely there is none that can or will make question of it. Now it is confessed by the best learned amongst the Schoolmen, that howsoever it be not so in the course of our understanding, in this state wherein we are, yet according to the course of the nature of our understanding simply considered, it should be so, that God should be the first thing sought after and known by us. … By this which has ben said [including the quotes by Scotus and Bonaventure], it is evident that according to the course of nature not disordered, nor put out of course, the first thing that is inquired after, thought of and known, is God, and that He is the first good that is desired and loved, and that no other thing is desired or loved but after Him, and for Him. So that none of the things formerly mentioned can be found in the nature of man, unless it be put out of course. Whence grows the contrariety between the meaner and better, superior and inferior faculties of the soul, but from hence, that the soul in this state of her aversion from God, takes the beginning of all her knowledge from the senses, apprehends particular things as good upon the first view, and to be desired, which afterwards upon better consideration, in respects not considered at the first, she finds are not good nor desirable? And whence is the rebellion of the inferior against the superior, but from hence, that the superior having cast off the dependance it formerly had upon God and respect unto Him, the inferior also casts off the respect it had to it? ‘What could have been more just than that he should receive retaliation in kind? God is the life of the soul, and the soul is the life of the body. By sinning the soul willingly lost its power to live; let it unwillingly lose also its power to give life. Having freely driven away life—since it did not wish to live—let it not be able to bestow life on whom, or in what measure, it may wish. The soul would not be ruled by God; let it be unable to rule the body. If it does not obey its superior, why should it command its inferior? The Creator found His creature rebellious against Himself; let the soul likewise find its own handmaid (the body) rebellious against it. Man was found a transgressor of the divine law; let him find another law in his members opposing the law of his mind and bringing him into captivity to the law of sin. And since sin sets a separation between us and God, let death likewise set a separation between our body and ourselves.’ Bernard of Clairvaux, Sermon to the Knights of the Temple, ch. 11, ‘Of the Sepulcher’ From hence likewise is that danger of erring, whereunto man is subject; for apprehending particular things first, his knowledge is imperfect and confused; and not without much labor and danger of erring does he come to the distinct knowledge of any thing. And hence also flows that ignorance that is found in men; for taking the beginning of all the knowledge they have from the senses, they know no more touching anything than may be discerned by the accidents and outward effects of it, and so never come to know anything in the essence of it, or immediately as it is in itself. So that according to that which before I noted, out of the book called Destructorium vitiorum, as a man may know in the dark, the length, breadth and other dimensions of a thing, but not whether it be fair or foul, white or black. So men in this obscurity of discerning, may find out that there is a God, and that He is the beginning and cause of all things: but they cannot know how fair, how good, how merciful, and how glorious He is, that so they may love Him, fear Him, honour Him, and trust in Him as God, unless they have an illumination of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-field.html">Richard Field</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Church (Oxford: Turner, 1628), bk. 3, Answer to Berely, ch. 5, pp. 252-54 Field (1561–1616) was an English ecclesiological theologian associated with the work of Richard Hooker.</span></figcaption>

separation+between+our+body+and+ourselves.%E2%80%99+Bernard+of+Clairvaux%2C+Sermon+to+the+Knights+of+the+Temple%2C+ch.+11%2C+%E2%80%98Of+the+Sepulcher%E2%80%99+From+hence+likewise+is+that+danger+of+erring%2C+whereunto+man+is+subject%3B+for+apprehending+particular+things+first%2C+his+knowledge+is+imperfect+and+confused%3B+and+not+without+much+labor+and+danger+of+erring+does+he+come+to+the+distinct+knowledge+of+any+thing.+And+hence+also+flows+that+ignorance+that+is+found+in+men%3B+for+taking+the+beginning+of+all+the+knowledge+they+have+from+the+senses%2C+they+know+no+more+touching+anything+than+may+be+discerned+by+the+accidents+and+outward+effects+of+it%2C+and+so+never+come+to+know+anything+in+the+essence+of+it%2C+or+immediately+as+it+is+in+itself.+So+that+according+to+that+which+before+I+noted%2C+out+of+the+book+called+Destructorium+vitiorum%2C+as+a+man+may+know+in+the+dark%2C+the+length%2C+breadth+and+other+dimensions+of+a+thing%2C+but+not+whether+it+be+fair+or+foul%2C+white+or+black.+So+men+in+this+obscurity+of+discerning%2C+may+find+out+that+there+is+a+God%2C+and+that+He+is+the+beginning+and+cause+of+all+things%3A+but+they+cannot+know+how+fair%2C+how+good%2C+how+merciful%2C+and+how+glorious+He+is%2C+that+so+they+may+love+Him%2C+fear+Him%2C+honour+Him%2C+and+trust+in+Him+as+God%2C+unless+they+have+an+illumination+of+grace.%E2%80%9D%0A%0A%E2%80%94+Richard+Field%2C+Other+citations+%28work+not+named%29%2C+Of+the+Church+%28Oxford%3A+Turner%2C+1628%29%2C+bk.+3%2C+Answer+to+Berely%2C+ch.+5%2C+pp.+252-54+Field+%281561%E2%80%931616%29+was+an+English+ecclesiological+theologian+associated+with+the+work+of+Richard+Hooker.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe54fea7c48.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e54fea7c48.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-epistemology/#:~:text=the%20difficulty%20to%20do%20good%2C%20proneness,they%20have%20an%20illumination%20of%20

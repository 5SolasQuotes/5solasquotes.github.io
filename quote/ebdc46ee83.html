<main class="wrap"><figure class="quote" id="q-ebdc46ee83" data-kw="">
<blockquote><p>The state of the case turns on the definition. For the children of Reuben, Gad, and Manasseh, explain that they had a different intention, and thus exculpate themselves from the charge, inasmuch as the nature of the proceeding was quite different from what the others supposed… as if they had said, that it will be made palpable by the fact itself, that they never had any intention of devising any new form of worship; and they rightly explain how the altar would have been unlawful, namely, if they had built it for the purpose of offering sacrifice. For the Law did not condemn the mere raising of heaps of stones, but only enjoined that sacrifices should be offered in one place…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary, on Josh. 22 | v. 21</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-389d830e47" data-kw="">
<blockquote><p>They who write on this subject with judgment and understanding, use to distinguish three sorts of modes of men’s actions that are found in religion, viz. circumstances, rites and ceremonies. Circumstances are modifications of actions, as time, place, person; or, a circumstance is any thing that accompanies an action which is not of its essence, but is used with it, relates to it, and is an accident, or adjunct of it: and it may be such, either with respect to the pysical or moral being of the action: Circumstances use to be sorted in these memorial verses: ‘Quis, quid, ubi, quibus auxiliis, cur, quomodo, quando.’ And ‘forma, figura, locus, tempus, stirps, patria, nomen.’ Circumstance is a word of larger extent than rite, and that than ceremony; a rite is the manner of going about any action (chiefly that which is public or solemn) confirmed by law or custom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended… (Edinburgh: 1697), section 12</cite>, p. 276</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-a0e52f9b0e" data-kw="">
<blockquote><p>‘Yea, but’ (say they) ‘our ceremonies are typical and Jewish ceremonies, which hurt our worship.’ They mean (as I conceive) they are teaching ceremonies, not ceremonies of mere order, but significant, to put us in mind of duty. I am sorry that this should be accounted a fault. If they did not signify, how could they edify? (1 Cor. 14:26) Were they types and shadows of the mysteries of the Gospel invented by men, indeed Christ were ill-advised not to ordain them. But being only moral documents and monitors of some duties, I wonder where their guilt lies. If I had an hundred boxes in my house for my uses, and some few of them had a mark upon them to direct me where my money lay, that I might be careful of that, does this savor of want of natural wisdom? So neither does it taste of want of spiritual wisdom to set a mark upon some few ceremonies, to put me in mind of my duty to Christ. ‘What are these’ (say they) ‘but images set up to ourselves for religious use?’ What? to worship? to adore God in or by? No, but to remind us of what we ought to do. And this was the practice of the Church in all ages: Abraham put his servant’s hand under his thigh in swearing, surely to signify his subjection to him in that business about the promised seed (Gen. 24:2). Moses set up an altar when Amalek was overthrown and called it Jehovah-Nissi, to signify that the Lord was their banner (Ex. 17:15). The two tribes and a half built an altar, not to distinguish their borders, but to signify that they were God’s people and that they had all one God, to whom they and their posterity must sacrifice upon his own altar (Josh. 22:24–35). Samuel set up a stone when the Philistines were discomfited and called it Eben-Ezer, to signify that the Lord helped them (1 Sam. 7:12). When Christ the truth was come, he used human significant ceremonies, as the feast of dedication (John 10:22), sitting at the Passover—a sign of rest (Matt. 26:20)—the water pots of the Jewish purifications (John 2:6), the custom of embalming (John 19:39–40), besides other formalities of the synagogue. (Lk. 4:17-20) The Corinthians had the women’s veil in the congregation, to signify subjection (1 Cor. 11:5–6), and the kiss of peace to signify love (Rom. 16:20; 2 Pet. 2:11). Other Christians had agapae [love-feasts] at the sacrament (Jude), in the room whereof the Christians’ offertory was brought in for pious uses, to signify that love they should have one to another. So we have standing at the Belief [Apostles’ Creed], to signify that it is not a prayer and that we are ready to confess our faith; kneeling at the commandments, to signify the honor we have to that God that gave it, and that we must be ready to dart up prayer for our obedience; and kneeling at the sacrament, to signify an humble acknowledgment of God’s love for so great a benefit. And do we and all these saints before us set up images to ourselves in these ceremonies for religious use? God forbid. The practice of these saints, when the laws of God were purely taught and kept, teaches us that though we may not set up an image to worship God by or in, yet may we set up some edifying signs to put us in mind of those duties we owe to God (1 Cor. 14): The patriarchs may build altars, give their children proper names to be admonishing signs of their duties to God; and we may set all our senses on work that way. We may set up a post in a dark and dangerous passage, that when I go that way and touch it, it may signify my danger, and I may avoid it. I may set a watchman in a tower to give a sound when the enemy comes, that he may signify my enemy’s approach, and I may avoid him. I may set up a sea mark to signify a rock near, that I split not upon it. And may not we be as wise for our souls as for our bodies? God forbid. I am sure He has nowhere forbidden it. Therefore it is not against Christ. If it be not against Him, it is for Him, says our Savior (Mk. 9:40).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-abbot.html">Robert Abbot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Trial of our Church-Forsakers... (London: Payne, 1639), sect. 15 Abbot (c. 1588 – c. 1662) was a partially conforming English, puritan divine.</cite>, pp. 204-7</span></figcaption>

<blockquote><p>3. It is strange divinity, ‘That that which is no sin, of itself, cannot be omitted without sin for the sole will and pleasure of men.’ [As the prelates argued] Human authority then may make it sin not to rub our beards, not to claw our heads, when we come to the Church to hear God’s Word. If human authority can make an indifferent act lawful, and the omission of it, sinful, [then] they may make all the indifferent acts in the world lawful acts; they might then make piping, leaping, laughing, acts of divine worship, and might make a Decalogue of their own: And if they may make an indifferent act to be sin, if it be omitted, they may by as good reason make sinful acts, as adultery, incest, murder, robbery, to be lawful acts; For if man’s inhibiting will be the formal reason of sin, then his commanding will must be the formal reason of obedience: And so rulers might command murder, robbery, incest, blasphemy.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“3. It is strange divinity, ‘That that which is no sin, of itself, cannot be omitted without sin for the sole will and pleasure of men.’ [As the prelates argued] Human authority then may make it sin not to rub our beards, not to claw our heads, when we come to the Church to hear God’s Word. If human authority can make an indifferent act lawful, and the omission of it, sinful, [then] they may make all the indifferent acts in the world lawful acts; they might then make piping, leaping, laughing, acts of divine worship, and might make a Decalogue of their own: And if they may make an indifferent act to be sin, if it be omitted, they may by as good reason make sinful acts, as adultery, incest, murder, robbery, to be lawful acts; For if man’s inhibiting will be the formal reason of sin, then his commanding will must be the formal reason of obedience: And so rulers might command murder, robbery, incest, blasphemy.”

— Samuel Rutherford, The Divine Right of Church Government… (1646), p. 652">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+It+is+strange+divinity%2C+%E2%80%98That+that+which+is+no+sin%2C+of+itself%2C+cannot+be+omitted+without+sin+for+the+sole+will+and+pleasure+of+men.%E2%80%99+%5BAs+the+prelates+argued%5D+Human+authority+then+may+make+it+sin+not+to+rub+our+beards%2C+not+to+claw+our+heads%2C+when+we+come+to+the+Church+to+hear+God%E2%80%99s+Word.+If+human+authority+can+make+an+indifferent+act+lawful%2C+and+the+omission+of+it%2C+sinful%2C+%5Bthen%5D+they+may+make+all+the+indifferent+acts+in+the+world+lawful+acts%3B+they+might+then+make+piping%2C+leaping%2C+laughing%2C+acts+of+divine+worship%2C+and+might+make+a+Decalogue+of+their+own%3A+And+if+they+may+make+an+indifferent+act+to+be+sin%2C+if+it+be+omitted%2C+they+may+by+as+good+reason+make+sinful+acts%2C+as+adultery%2C+incest%2C+murder%2C+robbery%2C+to+be+lawful+acts%3B+For+if+man%E2%80%99s+inhibiting+will+be+the+formal+reason+of+sin%2C+then+his+commanding+will+must+be+the+formal+reason+of+obedience%3A+And+so+rulers+might+command+murder%2C+robbery%2C+incest%2C+blasphemy.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%E2%80%A6+%281646%29%2C+p.+652&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F64968dc87b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/64968dc87b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-arbitrary-laws-commands/#:~:text=3.%20It%20is%20strange%20divinity%2C%20%E2%80%98That,might%20command%20murder%2C%20robbery%2C%20incest%2C%20blasphemy." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

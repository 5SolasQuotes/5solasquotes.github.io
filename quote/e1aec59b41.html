<main class="wrap"><figure class="quote" id="q-e1aec59b41" data-kw="">
<blockquote><p>These afternoon services must not be neglected or left out for the reason (which might be offered as an excuse in some villages) that the attendance is low – even if the pastors should be forced at first to preach before a very small audience, to the point indeed of preaching to no one but their own families. If the pastors give an example with their own families, and consistently encourage others to do likewise, in particular those committed to the Reformed faith, there can be no doubt but that, in the course of time, many will end up coming to these sermons regularly.

However, to prevent the people from being drawn away from these afternoon sermons by their involvement in other labours or worldly activities on Sunday afternoons, the government authorities are to be asked to enact strict legislation against all menial and everyday kinds of activity, and in particular against games, drinking parties and other violations of the holiness of the Sabbath, which are the regular Sunday afternoon pastimes especially in the villages. By such measures, too, the people may be more effectively induced to come to these afternoon sermons, and in this way to keep the Sabbath day holy in its entirety.

However, since the combinations of churches or shared pastorates (common in the rural areas in the provinces), do not allow a single pastor to have two sermons in one village every Sunday, efforts must be made in every classis to do away with such combinations if at all possible, so that each church may have its own pastor. But if this proves impossible, then those pastors who serve two churches simultaneously must do their utmost to have afternoon catechism sermons at least every other Sunday.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ade8a532db" data-kw="">
<blockquote><p>What pain and difficulty do men often find in bringing their hearts to religious duties? And what a task is it to the carnal heart to abide at them? It is a pain to it, to leave the world but a little, to converse with God. It is not easy to borrow time from the many things, to bestow it upon the one thing needful. Men often go to God in duties, with their faces towards the world; and when their bodies are on the mount of ordinances, their hearts will be found at the foot of the hill, going after their covetousness, Ezek. xxxiii. 31. They are soon wearied of well-doing; for holy duties are not agreeable to their corrupt nature. Take notice of them at their worldly business, set them down with their carnal company, or let them be sucking the breasts of a lust; time seems to them to fly, and drive furiously, so that it is gone ere they are aware. But how heavily does it drive, while a prayer, a sermon, or a sabbath lasts?

The Lord’s day is the longest day of all the week with many; and therefore they must sleep longer that morning, and go sooner to bed that night, than ordinarily they do; that the day may be made of a tolerable length: for their hearts say within them, when will the sabbath be gone? Amos viii. 5. The hours of worship are the longest hours of that day: hence when duty is over, they are like men eased of a burden; and when sermon is ended, many have neither the grace nor the good manners to stay till the blessing be pronounced, but like the beasts, their head is away as soon as one puts his hand to loose them; why, but because while they are at ordinances, they are, as Doeg, detained before the Lord, 1 Sam. xxii. 7.</p></blockquote>

</figure><figure class="quote" id="q-8252d74455" data-kw="">
<blockquote><p>2. It [the form of sound words] is our godly forefathers bequest which they have conveyed to us their posterity; should not our care be alike to transmit it to ours? Ps. 78:3-4.

3. The martyrs have sealed it with their blood, which we shall prove guilty of through our unfaithfulness, as they are accounted to tread underfoot the Son of God, and to account his blood an unholy thing who desert his truth, and despited the spirit of his grace, Heb. 10:29.

4. It will be the best part of our children’s inheritance: as the Law was Jacob’s, Dt. 33:4. Look to it therefore, that at our last reckoning our forefathers be not ashamed of us, and our posterity at the Resurrection do no not rise up, and, I say not, call us blessed, as Prov. 31:28, but curse us for betraying God’s truth, and our trust, and their and our own souls altogether.

5. And remember from this word [Greek] hold fast, that it is not the catching at what we have not, but only the holding fast what through God’s mercy we yet have; and therefore as Christ says to the Church of Philadelphia, ‘Hold fast what thou hast, let no man take away thy crown.&#x27;</p></blockquote>

<blockquote><p>V. 3… this being the first violation of the law newly given, and committed by those who should have been the strictest observers and assertors of it, did deserve a very severe punishment.” … V. 12… Moses repeats and reinforces the former command… partly to encourage them to go on in their holy services and not to be dejected for the late severity, as if God would no more accept them or their sacrifices. … V. 16. ‘The goat of the sin-offering,’… which he [Moses] inquired into more than into the other sacrifices, because a mistake there was easy and probable, because that matter might seem something doubtful, by reason of two laws concerning it seemingly contrary, the one Lev. 4:21, where it is to be burned, the other Lev. 6:26, where it was to be eaten. But they are thus reconciled: It was to be burnt when the blood of this sacrifice was brought into the holy place, Lev. 4:16, 17; and when that was not done, which Aaron this first time could not do, for the reason expressed in Lev. 10:18, it was to be eaten, and here lay their mistake… he spares Aaron at this time, as overwhelmed with sorrow, and because the rebuking of him before his sons might have exposed him to some contempt. … V.

19. ‘This day have they offered;’ they have done the substance of the thing though they have mistaken this one circumstance. ‘Such things have befallen me;’ whereby, having been oppressed with grief, and almost bereft of my reason, it is not strange nor unpardonable if I have mistaken. ‘Should it have been accepted?’ because it was not to be eaten with sorrow, but with rejoicing and thanksgiving, as appears from Dt. 12:7; Dt. 26:14; Hos. 9:4; and I thought it fitter to burn it, as I did other sacred relics, than to profane it by eating it unworthily. V.

20. He [Moses] rested satisfied with his answer, either because he thought it reasonable, seeing the letter of the law ofttimes yields to necessities or great accidents, 2 Chron. 30:18; Mt. 12:3,Mt. 12:4; or at least because the things alleged were mitigations of his fault, and he would not add affliction to the afflicted, but rather defer the debate of it to a fitter opportunity.</p></blockquote>

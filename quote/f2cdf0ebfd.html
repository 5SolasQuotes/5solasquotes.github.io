<main class="wrap"><figure class="quote" id="q-f2cdf0ebfd" data-kw="">
<blockquote><p>But here the Apostle seems to comprehend a twofold holiness of those that are reconciled; one which consists in the remission of sins, and the imputation of Christ’s righteousness; the other which consists in our renovation, and in the fruits of holiness. For in both ways Christ presents all his people holy before God.

They are now strictly saints by imputation, because they are regarded as one mystical person with Christ their head; but as to inherent holiness, that is not effected instantly, but increases daily, and acquires not the summit of its perfection before we are translated from this life to the life of glory.

Yet we maintain that this incipient sanctification is real, although not complete. And therefore the Apostle adds these words, before God. For he is said to be just and holy before God, who is so in reality, not in appearance only; in rectitude of intention, not in fictitious imitation, as Lyra not inaptly remarks on these words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), 1: 258.</span></figcaption>

</figure><figure class="quote" id="q-43bc48652a" data-kw="">
<blockquote><p>The most usual word to signify, either the upright is Tham, or Thamim, which commonly is translated perfect, as Gen. 17.1. Deut. 18.13. Ps. 15.2.37.37.119.1. or uprightness, is Thom or thamim, which usually is translated perfection whereby not legal perfection is meant (which is absolute and complete, not only in respect of the parts, but also of degrees) but evangelical, according to the covenant of grace; which is nothing else (the Lord accepting in his children the will for the deed) but integrity or uprightness; and is so expounded Ps. 25.21. Jos. 24.14. Job. 1.1.; 2.3. Ps. 27.7. For very many in the scriptures have this perfection attributed to them, who notwithstanding had their imperfections. as Noah, Gen. 6.9. Job. 1.1.8.2.3. Jacob, Gen. 25.27. &amp;c. of Asa it is said 2. Chro. 15.17. that his heart was perfect all his days: and yet in the next Chapter there are recorded three foul sins, which he committed. 2. Chron. 16.7.10.12.</p></blockquote>

</figure><figure class="quote" id="q-e2b293669f" data-kw="">
<blockquote><p>(1) The natural life supposes generation; so does the spiritual, which is therefore expressed by ‘regeneration’, or by ‘being born again’, Jn. 3:3 and 1 Jn. 2:27. Now look, as in natural generation we are first begotten, and then born, so here there is an act qua regeneramur, ‘by which we are begotten again’, and qua renascimur, ‘by which we are born again’. There is an act of God, by which we are begotten again, viz. by the powerful influence of grace upon our hearts, accompanying in the Word, Jm. 1:18; and there is an act of God, by which we are born again, viz. when the new creature is formed in us, and begins to discover itself (“being born again, not of corruptible seed, but of incorruptible”). Effectual calling and sanctification are these two [respective] acts: by the one we are begotten, by the other born; the one may be called our passive, the other our active regeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton</cite>, … (d. 1677; London: Astwood, 1684), Sermons on 2 Cor. 5, Sermon 30, on 2 Cor. 5:15, p. 190</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-5b7edb58ff" data-kw="">
<blockquote><p>Assertion 2. The Gospel-love of Christ frees a captive from under the Law as a curser and delivers him over to the Law as to a pedagogue to lead him to Christ, and as to an instructor to rule and lead him when He is come to Christ. Love is the immediate and nearest lord; law the mediate and remote lord. Love bids the man do all for Christ; the law now of itself, because of our sinfulness, is a bitter and sour thing; but now the law is dipped in Christ’s Gospel-love and is sugared and honeyed, and evangelized with free grace and receives a new form from Christ and is become sweeter than the honey and the honeycomb to draw and persuade: and all the law is made a new commandment of love and a Gospel-yoke, sweet and easy; But still the law obliges justified men to obedience, not only for the matter of it, but for the supreme authority of the Lawgiver; now Christ, who came to fulfill, not to dissolve the law, does not remove this authority, but adds a new bond of obligation, from: [1.] the tie of Redemption in Jesus Christ, and we are freed from the curse of the Law. 2. the rigid exaction of obedience, every way perfect. 3. the seeking of life and justification by the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: J.D., 1647), pt. 3, p. 273</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

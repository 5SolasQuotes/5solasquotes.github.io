<main class="wrap"><figure class="quote" id="q-1daad5e2a6" data-kw="">
<blockquote><p>Therefore, we dismiss these [previously mentioned] opinions, while holding firmly to the popular and more commonly accepted view which maintains that the Pontiff, his rank and his rule, are correctly described by this prophecy. In fact, we may compute his name in either Greek or Hebrew, the two languages by which God gave his oracles and prophecies (shrouding them in mystery), yet the sum of their letters will yield the same result. For, if the computation be made in Greek, which is quite appropriate considering the Revelation was written in Greek to Greeks, no other suitable name occurs than the name Lateinos, as Irenaeus [A.D. 130-202] conjectured. And, if the name Romanus should be counted in the Hebrew characters, it will mean either Roman seat or Roman, as John Foxe [1516-1587] determined. Moreover, the Hebrew term comprises the same meaning as that of the Greek term. For Romanus or Lateinos is the name of the aforementioned Beast and is that name which the Pope imposes on all his disciples [that is, Roman Catholic]. It is on this self-same Beast that all these and additional marks of Antichrist converge; i.e., such marks as causing the whole earth, which follows him, to wonder; his blaspheming the name of God; and the great power he holds over the heads of all people and tongues, etc. That this name contains the number 666 in both Greek and Hebrew is not a point of dispute [the following is in the Greek alphabet]: L – λ – 30 a – α – 1 t – τ – 300 e – ε – 5 i – ι – 10 n – ν – 50 o – ο – 70 s – ς – 200 = 666 Thus the Roman Pontiff and his Seat is undoubtedly indicated. For he is truly Latin who holds the remains of the Latin empire and the ancient seat. By no small coincidence, he does not allow public worship to be conducted in any other language than Latin; nor does he publish his official documents and decrees in any other language. Also, the Eastern Orthodox call the Roman Church by the name Latin Church, as seen in the general councils where this distinction was meticulously made between the western fathers or bishops, called Latins, while the rest were called Greeks. Therefore, the name Lateinos (in Greek) or Romanus (in Hebrew) is fully consistent with the fulfillment of this prophecy, in that it predicts the seat of the Beast to be Rome, where it remains to this day. The truth is out in the open.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-62580bf632" data-kw="">
<blockquote><p>The issue of millennial debate among the Reformed is both highly complicated and rather uniquely related to the confessional issue. The new eschatologies of a future millennium ran counter to the eschatologies of the sixteenth-century Reformed which, from Bullinger’s commentary on the Apocalypse to Franciscus Junius’ annotations, as ensconced in the margins of later editions the Geneva Bible, understood the millennium as past. Although, moreover, the major Reformed confessions had tended to tread lightly concerning the last things, two of them, the Forty-two Articles of Edward VI and the Second Helvetic Confession, had strongly argued against “the fable of the millennium” and notions of a “golden age” on earth prior to the final judgment. What is rather remarkable, then, is the vast revision of Reformed eschatology that took place in the seventeenth century both in England and on the continent without yielding a major confessional confrontation – in fact, both witnessing an increased diversity in the tradition, a significant break with the views of the Reformers on the part of many orthodox Reformed writers evidenced by their acceptance of a doctrine of a future millennium. The spectrum of opinion among the continental Reformed, similar to what Gribben has identified among the English, is evidenced by the millennialism of Wilhelmus à Brakel on the one hand and the anti-millennial views of Francis Turretin on the other. Turretin, significantly, distinguished between the “crass” chiliasm of various heretics and the highly objectionable but not heretical “subtle” chiliasm of Piscator, Alsted, Mede, and Launaeus – an approach parallel to his objection to Amyraldianism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 1, “Diversity in the Reformed Tradition: a Historiographical Introduction” in eds. Haykin &amp; Jones, Drawn into Controversie: Reformed Theological Diversity &amp; Debates within Seventeenth-Century British Puritanism (V&amp;R, 2011)</cite>, pp. 21-22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/second-coming.html">Second Coming</a></span></div>

<blockquote><p>‘And bound him;’ From the open slaughtering of the saints, as he had done by the heathen emperors; or, from molesting and mischiefing of God’s people, otherwise he is not bound one hour, Job 1:6-12 1 Peter 5:8. And how his vicegerent the beast has bestirred him during the thousand years, who knows not? ‘A thousand years;’ Hos explicate fateor trepide me aggredi, says [David] Pareus. He begins the thousand at the destruction of the temple, A.D. 73, and so it ends in Pope Hildebrand, who stepped into that chair of pestilence, A. D. 1073. Others begin it at the birth of Christ, and end in Sylvester II. Others at Christ’s passion, and end in Benedict IX. But they do best, in my opinion, that begin at Constantine and end in Boniface VIII, who is of his own said to have entered like a fox, reigned as a lion, and died as a dog. He excommunicated the French king, and published this decree, that the Bishop of Rome ought to be judged of none, although he should carry innumerable souls with him to hell.</p></blockquote>

<blockquote><p>Those who make it fully past, begin at four periods, 1. some at Christs birth, and end at Pope Sylvester II, a magician. 2. Some at His death, and end at Benedict III, suffocated by the devil. 3. Others, at the destruction of Jerusalem, and so end it in Gregory VII, or Hildebrand. 4. Most begin it at Constantine’s reign, making this contemporary with that of Satan’s being cast from heaven, ch. 12. This is also ended, anno 1300, in Boniface VIII, when the wars against the Waldenses began. [John] Prideaux, De mille annis Apoc. does thus sum those of that opinion.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Those who make it fully past, begin at four periods, 1. some at Christs birth, and end at Pope Sylvester II, a magician. 2. Some at His death, and end at Benedict III, suffocated by the devil. 3. Others, at the destruction of Jerusalem, and so end it in Gregory VII, or Hildebrand. 4. Most begin it at Constantine’s reign, making this contemporary with that of Satan’s being cast from heaven, ch. 12. This is also ended, anno 1300, in Boniface VIII, when the wars against the Waldenses began. [John] Prideaux, De mille annis Apoc. does thus sum those of that opinion.”

<blockquote><p>Some take these thousand years for the total time of the first coming of Christ unto His second coming, as this word thousand signifies sometimes in Scripture a certain number for an uncertain. See Ps. 91:7; 105:8; Dan. 7:10. But forasmuch as verses 7 and 8, Satan is let loose again after those thousand years, the same cannot be, as neither the opinion of some others who desire to have these thousand years end before the coming of the Antichrist. Seeing in verse 4, even during these thousand years mention is made of some who did not worship the beast nor his image, then Antichrist must also needs have been before the end of the thousand years. Therefore others begin the binding of Satan, that he would deceive the nations no more from the time that Christ, by the preaching of the Gospel and the power of His Spirit by His apostles, has brought the pagan nations in the world everywhere unto repentance; which for the most part was fulfilled about the time of the desolation of Jerusalem and the eradication of the Jews, that is, about the year 70, and end them with the time of pope Gregory VII, who was a strong instrument of the devil to bring the Antichrist’s reign to the highest, and to cause all nations to worship him who sat in the chair about the year 1070. Though some, by reason of the persecutions which Satan raised against the Christians more than two hundred and fifty years after the destruction of Jerusalem, begin these thousand years somewhat later, namely, from Constantine’s time, and continue them till about the year 1300, when the antichrist not only caused the state of Christians to decline more and more, when Boniface VIII reigned over this realm, but also the Turks and Tartars were most set on by Satan to subdue the christian nations in the East and West, and destroyed many kingdoms and Christian churches, not only in Asia, but also in Africa and Europe, as the present condition thereof shows.</p></blockquote>

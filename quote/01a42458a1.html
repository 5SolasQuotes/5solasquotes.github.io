<main class="wrap"><figure class="quote" id="q-01a42458a1" data-kw="">
<blockquote><p>Again; it is the duty of Christian magistrates to suppress the open profanation of the holy Sabbath. The fourth commandment seems particularly directed to magistrates, parents, and heads of families. These responsible persons are required not only to rest on the seventh day themselves, but to restrain their children, servants, and domestics of every description, from polluting it. (Exod. xx. 10.)

It should always be kept in mind, that there is a material difference with regard to the duties incumbent on private and public characters. Private individuals are not allowed to execute the law, by resenting their own injuries, but rather, in the meantime, they must suffer wrong. (Mat. v. 39.) In the hands of the magistrate, however, the law must be a law of complete retaliation, as impartial justice requires an eye for an eye, and a tooth for a tooth (Exod. xxi. 24.) Besides the fourth precept of the decalogue, God’s express declaration concerning the Sabbath is this – “Ye shall keep the Sabbath, therefore, for it is holy unto you; every one that defileth it shall surely be put to death; for whosoever doeth any work therein, that soul shall be cut off from among his people.” (Exod. xxxi. 14.)

Christian magistrates, then, who regard the peace of society and the prosperity of their people, should oblige all sabbath-breakers to desist from their unhallowed practices, lest their example be the means of seducing others from the profession of the true religion, and thereby the wrath of heaven fall upon the community at large.

For their encouragement in the discharge of this important duty, they have the approved conduct of good Nehemiah set before them. “Then I contended with the nobles of Judah, and said unto them, what evil thing is this that ye do, and profane the Sabbath-day? Did not your fathers thus, and did not our God bring all this evil upon you, and upon this city? yet ye bring more wrath upon Israel by profaning the Sabbath-day. Then I testified against them, and said unto them, why lodge ye about the wall? If ye do so again, I will lay hands on you. From that time forth came they no more on the Sabbath.” – (Neh. xiii. 17, 18, 21.)</p></blockquote>

</figure><figure class="quote" id="q-729868d934" data-kw="">
<blockquote><p>And to be precise, [Christ instituted the sacrament] ‘after washing their feet,’ as many [sources] say. For when the meal was begun (John 13:2), He rose from the table (verse 4) and washed the feet of his disciples, as was the customary practice of eastern peoples (Luke 7:44). He did so in order that by this exemplary action He might show them the way to humility and love, and testify his favor towards those who are his–that He is certainly the one who cleanses his people from their uncleanness (John 13:8-10, 14). And He did so in order to teach them by means of a comparison (and not a sacrament) with what frame of mind they ought to approach these sacred things. Even so the western church has, elsewhere and sometimes not without abuse, adopted the practice as a sacrament. … Nor do the following facts have any force of being required or observed: that the supper was given to them… after their feet had been washed… (some [things] of which were observed for some time in the early church).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-83386abcb3" data-kw="">
<blockquote><p>Wherefore I conceive the two covenants to have been both delivered on Mount Sinai to the Israelites. First, The covenant of grace made with Abraham, contained in the preface, repeated and promulgate there unto Israel, to be believed and embraced by faith, that they might be saved; to which were annexed the ten commandments, given by the Mediator Christ, the head of the covenant, as a rule of life to his covenant people.

Secondly, The covenant of works made with Adam, contained in the same ten commands, delivered with thunderings and lightnings, the meaning of which was afterwards cleared by Moses, describing the righteousness of the law and sanction thereof, repeated and promulgate to the Israelites there, as the original perfect rule of righteousness, to be obeyed; and yet were they no more bound hereby to seek righteousness by the law than the young man was by our Saviour’s saying to him, Mat. xix. 17, 18, ”If thou wilt enter into life, keep the commandments — Thou shalt do no murder,” &amp;c. The latter was a repetition of the former.

Thus there is no confounding of the two covenants of grace and works; but the latter was added to the former as subservient unto it, to turn their eyes towards the promise, or covenant of grace: “God gave it to Abraham by promise. Wherefore then serveth the law? it was added, because of transgressions, till the Seed should come,” Gal. iii. 18, 19. So it was unto the promise given to Abraham, that this subservient covenant was added; and that promise we have found in the preface to the ten commands. To it, then, was the subservient covenant, according to the apostle, added, put, or set to, as the word properly signifies. So that it was no part of the covenant of grace, the which was entire to the fathers, before the time that it was set to it; and yet is, to the New Testament church, after that it is taken away from it: for, says the apostle, “It was added till the Seed should come.” Hence it appears, that the covenant of grace was, both in itself, and in God’s intention, the principal part of the Sinai transaction: nevertheless the covenant of works was the most conspicuous part of it, and lay most open to the view of the people.

According to this account of the Sinai transaction, the ten commands, there delivered, must come under a twofold notion or consideration; namely, as the law of Christ, and as the law of works: and this is not strange, if it is considered, that they were twice written on tables of stone, by the Lord himself, — the first tables the work of God, Exod. xxxii. 16, which were broken in pieces, verse 19, called the tables of the covenant, Deut. ix. 11, 15,— the second tables the work of Moses, the typical Mediator, Exod. xxxiv. 1; deposited at first (it would seem) in the tabernacle, mentioned chap, xxxiii. 7, afterward, at the rearing of the tabernacle with all its furniture, laid up in the ark within the tabernacle, chap. xxv. 16; and whether or not some such thing is intimated, by the double accentuation of the decalogue, let the learned determine; but to the ocular inspection it is evident, that the preface to the ten commands, Exod. xx. 2, and Deut. v. 6, stands in the original, both as a part of a sentence joined to the first command, and also as an entire sentence separated from it, and shut up by itself.

Upon the whole, one may compare with this the first promulgation of the covenant of grace, by the messenger of the covenant in paradise, Gen. iii. 15, and the flaming sword placed there by the same hand, “turning every way to keep the way of the Tree of Life.</p></blockquote>

<blockquote><p>Under this [Mosaic] Covenant, the natural seed of Abraham bore the face of the Church and state, and God had promised abundance of temporals, and of spiritual, a scantling; But all under the outward administration of the Covenant were not in like manner partakers of the blessings promised in Covenant. For some had their part in temporal blessings only, and the outward ordinances; others were partakers of the spiritual blessings promised. But whatever good thing any of them enjoyed either temporal or spiritual, it was conferred upon them freely according to the Covenant of Grace, and not for the dignity of their works. It is true, the promise is conditional, if they obey, they shall reap the good things of the Land: but obedience was not a causal condition, why they should inherit the Land… So that herein there appears no intexture of the Covenant of works with the Covenant of Grace, nor any moderation of the Law to the strength and power of nature for the obtaining of outward blessings. But rather that God out of his abundant goodness is pleased freely to confer outward blessings promised in the Covenant upon some that did not cleave to him unfeignedly [purely], that he might make good his promise unto the spiritual seed, which by word and oath he had confirmed unto the Fathers.</p></blockquote>

<blockquote><p>10 Q. What is the difference between the law and the gospel? A. The law is a doctrine that God has implanted in human nature and has repeated and renewed in His commandments. In it He holds before us, as if in a manuscript, what it is we are and are not to do, namely, obey Him perfectly both inwardly and outwardly. He also promises eternal life on the condition that I keep the law perfectly my whole life long. On the other hand, He threatens eternal damnation if I do not keep every provision of the law my whole life long but violate it in one or more of its parts. As God says in Deuteronomy 27[:26] and Galatians 3[:10], “Cursed is everyone who does not continue in all things which are written in the book of the law, to do them.” And once the law has been violated, it has no promise that by the help of the law, that is, by works of the law, our sins might be forgiven. Rather, the sentence of condemnation is imposed upon us. The gospel or good news, however, is a doctrine of which even the wisest knew nothing by nature but which is revealed from heaven. In it God does not demand but rather offers and gives us the righteousness that the law requires. This righteousness is the perfect obedience of the suffering and death of Jesus Christ, through which all sin and damnation, made manifest by the law, is pardoned and washed away (Rom. 5; Gal. 3). Furthermore, God does not give us forgiveness of sins in the gospel on the condition that we keep the law. Rather, even though we never have kept it nor will ever be able to keep it perfectly, He still has forgiven our sins and given us eternal life as an unmerited gift through faith in Jesus Christ. John 1[:17] says, “The law was given through Moses, but grace and truth come through Jesus Christ.” And Romans 8[:3, 4]: “What for the law was impossible in that it was weak through the flesh, God did by sending His Son in the likeness of sinful flesh, and condemned sin the flesh through sin, that the righteousness required by the law might be fulfilled in us, who do not walk according to the flesh but according to the Spirit.” Finally, Galatians 3:[12–14]: “The law is not of faith but ‘The man who does it shall live by it.’ Christ, however, redeemed us from the curse of the law when He became a curse for us (for it is written, ‘Cursed is everyone who hangs on a tree’), that the blessing of Abraham might come upon the Gentiles in Christ Jesus and we thus might receive the promised Spirit through faith.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“10 Q. What is the difference between the law and the gospel? A. The law is a doctrine that God has implanted in human nature and has repeated and renewed in His commandments. In it He holds before us, as if in a manuscript, what it is we are and are not to do, namely, obey Him perfectly both inwardly and outwardly. He also promises eternal life on the condition that I keep the law perfectly my whole life long. On the other hand, He threatens eternal damnation if I do not keep every provision of the law my whole life long but violate it in one or more of its parts. As God says in Deuteronomy 27[:26] and Galatians 3[:10], “Cursed is everyone who does not continue in all things which are written in the book of the law, to do them.” And once the law has been violated, it has no promise that by the help of the law, that is, by works of the law, our sins might be forgiven. Rather, the sentence of condemnation is imposed upon us. The gospel or good news, however, is a doctrine of which even the wisest knew nothing by nature but which is revealed from heaven. In it God does not demand but rather offers and gives us the righteousness that the law requires. This righteousness is the perfect obedience of the suffering and death of Jesus Christ, through which all sin and damnation, made manifest by the law, is pardoned and washed away (Rom. 5; Gal. 3). Furthermore, God does not give us forgiveness of sins in the gospel on the condition that we keep the law. Rather, even though we never have kept it nor will ever be able to keep it perfectly, He still has forgiven our sins and given us eternal life as an unmerited gift through faith in Jesus Christ. John 1[:17] says, “The law was given through Moses, but grace and truth come through Jesus Christ.” And Romans 8[:3, 4]: “What for the law was impossible in that it was weak through the flesh, God did by sending His Son in the likeness of sinful flesh, and condemned sin the flesh through sin, that the righteousness required by the law might be fulfilled in us, who do not walk according to the flesh but according to the Spirit.” Finally, Galatians 3:[12–14]: “The law is not of faith but ‘The man who does it shall live by it.’ Christ, however, redeemed us from the curse of the law when He became a curse for us (for it is written, ‘Cursed is everyone who hangs on a tree’), that the blessing of Abraham might come upon the Gentiles in Christ Jesus and we thus might receive the promised Spirit through faith.”

— Caspar Olevianus, A Firm Foundation, trans. Lyle D. Bierma, Texts and Studies in Reformation and Post-Reformation Thought (Carlisle, United Kingdom; Grand Rapids, MI: Paternoster Press; Baker Books, 1995), 9–10.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C10+Q.+What+is+the+difference+between+the+law+and+the+gospel%3F+A.+The+law+is+a+doctrine+that+God+has+implanted+in+human+nature+and+has+repeated+and+renewed+in+His+commandments.+In+it+He+holds+before+us%2C+as+if+in+a+manuscript%2C+what+it+is+we+are+and+are+not+to+do%2C+namely%2C+obey+Him+perfectly+both+inwardly+and+outwardly.+He+also+promises+eternal+life+on+the+condition+that+I+keep+the+law+perfectly+my+whole+life+long.+On+the+other+hand%2C+He+threatens+eternal+damnation+if+I+do+not+keep+every+provision+of+the+law+my+whole+life+long+but+violate+it+in+one+or+more+of+its+parts.+As+God+says+in+Deuteronomy+27%5B%3A26%5D+and+Galatians+3%5B%3A10%5D%2C+%E2%80%9CCursed+is+everyone+who+does+not+continue+in+all+things+which+are+written+in+the+book+of+the+law%2C+to+do+them.%E2%80%9D+And+once+the+law+has+been+violated%2C+it+has+no+promise+that+by+the+help+of+the+law%2C+that+is%2C+by+works+of+the+law%2C+our+sins+might+be+forgiven.+Rather%2C+the+sentence+of+condemnation+is+imposed+upon+us.+The+gospel+or+good+news%2C+however%2C+is+a+doctrine+of+which+even+the+wisest+knew+nothing+by+nature+but+which+is+revealed+from+heaven.+In+it+God+does+not+demand+but+rather+offers+and+gives+us+the+righteousness+that+the+law+requires.+This+righteousness+is+the+perfect+obedience+of+the+suffering+and+death+of+Jesus+Christ%2C+through+which+all+sin+and+damnation%2C+made+manifest+by+the+law%2C+is+pardoned+and+washed+away+%28Rom.+5%3B+Gal.+3%29.+Furthermore%2C+God+does+not+give+us+forgiveness+of+sins+in+the+gospel+on+the+condition+that+we+keep+the+law.+Rather%2C+even+though+we+never+have+kept+it+nor+will+ever+be+able+to+keep+it+perfectly%2C+He+still+has+forgiven+our+sins+and+given+us+eternal+life+as+an+unmerited+gift <blockquote><p>Fifth, the last commandment of lust forbids the first motions to sin that are before consent. … Again, the philosophers knew that lust with consent was evil, even by the light of nature. But Paul, a learned Pharisee, and therefore more than a philosopher, knew not lust to be sin that is forbidden in this commandment [Rom. 7:7]. Lust therefore that is forbidden here, is without consent.</p></blockquote>

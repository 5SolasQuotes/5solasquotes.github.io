<blockquote><p>28. Ministers with their families ought to be maintained with honest and liberal stipends. We also believe that the church cannot well be governed unless such necessary maintenance be bestowed on the ministers as whereby they and their family may live in an honest estate; For no man, except he have whereupon to live (Mt. 10:10), can do his duty; and Christ says, “the workman is worthy of his wages” and the apostle writes largely thereof in more than one place (1 Cor. 9:7 etc.) showing by many reasons that ministers which serve the churches ought to receive of the same church what so is needful for them: (1 Tim. 5:17 etc.) and that they have good right to demand the same: so far from offence is it, that they should take it, as some would cavil: yet notwithstanding covetousness, as well in all other as chiefly in ministers we do with the apostle utterly condemn: (1 Tim. 3:3,8) as also we allow not prodigality: and we teach that both these faults are to be shunned and avoided.

29. The church goods should not be wasted, but be bestowed on the maintenance of ministers, and other godly uses. And whereas many goods have in times past, and yet in some places are given to churches, by the liberality of princes and other godly persons: we judge that if any church have such goods, great care is to be had that the same be not wasted nor converted into profane uses, and much less into sacriligious uses, nor feigned to be so converted: but to be only bestowed upon that purpose whereto they were given, even to a godly intent. And we well allow of that ancient partition of church goods, where one part went to the bishops, that is, to the teachers, (Deu[…] […]) and ministers of the Word and their families; another to the clerks, that is to students and such as were ordained to the ministry of the church and to them that attended on the church: the third part to poor people and travelers: a fourth part to repairing of churches and schools, to which part also, belong not only the houses of ministers, teachers, students, libraries and books, all kinds of instruments and things necessary for churches and schools: but also spittles and hospitals and other such like places, where such live as are peculiarly to be relieved and cared for of the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Body of Christian Religion</cite>, (d. 1590; London, 1659)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9ace4a6900" data-kw="">
<blockquote><p>Further, this power of the keys… The key of the ministry of the Word is set down and established by Christ, Mt. 16:19, ‘I will give unto thee the keys of the kingdom of heaven,’ etc. This ministry of the Word is a key, because it opens and shuts heaven; this it does… Secondly: by applying the promises of the Gospel and the threatening of the Law: For when in the ministry of the Word the promises of remission of sins and life everlasting, are applied to believers that repent, then the kingdom of heaven is opened; and when as in the same ministry of the Word, the curses of the law are denounced against impenitent sinners, then is the kingdom of heaven shut. Yet touching the ministry of the Word, this distinction must be remembered; that otherwhiles the church is certain of the faith and repentance of some men, or some congregation; and then they may pronounce remission of sins absolutely. But otherwhiles they are uncertain of their faith and repentance, or of their impenitency; and then they must accordingly remit or retain men’s sins, that is, conditionally; pronouncing the remission of sins to all that repent: and denouncing damnation to all that repent not. And thus is the word to be publicly handled in God’s Church at this day, because our congregations are mixed companies, consisting of some that repent and believe, and of others that do not truly repent nor believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly &amp; Learned Exposition or Commentary upon the Three First Chapters of the Revelation</cite>, … (London: Islip, 1606), 3rd Chapter, p. 180</span></figcaption>

<blockquote><p>Secondly, Paul requires the elders of the Church of Ephesus to take heed unto and to oversee the whole flock, which did consist of more than did or could then meet together ordinarily into one place for the worship of God, as appears by the Church in the house of Aquila and Priscilla (which was one, but not the only one church assembly at Ephesus) by the great and wonderfull increase of the Gospel at Ephesus… Peter also writing to the churches of the strangers in several provinces, calls them the ‘flock’, not ‘flocks’, and commends unto the elders the feeding and oversight of that flock… No doubt they had the administration of the Word and sacraments partitive, or severally. Nor do I deny but they had a partitive several government: but there was also an union or association of them under one common government, which did denominate them to be one visible, ecclesiastical flock.</p></blockquote>

<blockquote><p>Where these Forms are contended for by men, with respect unto their own use and practice only, as suitable to their experience, and judged by them a serving of God with the best that they have; I shall not take the least notice of them, nor of any dissent about them. But whereas a persuasion not only of their lawfulness but of their necessity is made use of unto other ends and purposes, wherein the peace and edification of believers is highly concerned, it is necessary we should make some inquiry thereinto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Work of the Holy Spirit in Prayer with a Brief Inquiry into the Nature and Use of Mental Prayer and Forms</cite>, (London, 1682) being Book 7 of Pneumatologia: or a Discourse concerning the Holy Spirit in Works, 4.235-350, Ch. 11, ‘Prescribed forms of Prayer Examined’; p. 212</span></figcaption>

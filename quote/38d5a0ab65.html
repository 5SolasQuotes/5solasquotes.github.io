<main class="wrap"><figure class="quote" id="q-38d5a0ab65" data-kw="">
<blockquote><p>2. It is not a bare union of men that makes a Church a true Church, but that union must have truth for its foundation; else you know thieves and robbers and highway-men and pirates, and buccaneers, because they agree among themselves, might lay claim to this title, and the most perverse heretics, because they agree in certain points, might say they are the true Church… … And indeed, that which justifies the Protestant Churches’ separation from her [Rome], or breaking peace and communion with her is: 1. Because she would impose that upon the consciences of men which Christ and his apostles never imposed. 2. Because she has turned the spiritual worship of the Gospel into carnal and mechanical devotion and introduced innumerable superstitions… … 5. Because rejecting the supreme authority of the Scriptures, which are the sole rule of Faith, she has made her pretended head, and such councils as he shall call or approve of, the sole dictators and expositors of the doctrine of Christ, requiring blind obedience to their decisions… The divisions among Protestant Churches are to be deplored so much the more because the points they differ in are inconsiderable and might easily be composed if men had but peaceable tempers and were resolved to lay aside interest and carnal respects, and punctilios of honor and credit, etc. for they all agree in fundamentals, all are satisfied that the Church of Rome has notoriously deviated from the simplicity of the Gospel; and the matters in difference, are things in which salvation is not concerned. And upon that account their labours deserve great commendations, who heretofore and very lately have endeavored to reconcile the Protestant Churches into a perfect union: A blessed work. Blessed are the peacemakers, that endeavor to make peace among the jarring members of Christ’s Body; and though they may fail of success, yet they shall not lose their reward. In the meanwhile those who widen or heighten these differences, and incite the respective parties to hatred, and wrath, and animosities one against another, to be sure are no children of the God of peace, and had need at least before they die make public satisfaction for the dreadful effects their heats and passions do produce. But as this peace among Protestant Churches is very much to be wished and prayed for…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-horneck.html">Anthony Horneck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Blessed Advantages of Peace &amp; Peacemakers In a Sermon preached at the Savoy in London upon the Fifth of St. Matthew</cite>, verse 9, ‘Blessed are the Peace-makers…’ (London: Aylmer, 1697), pp. 29-34</span></figcaption>

</figure><figure class="quote" id="q-38b795f294" data-kw="">
<blockquote><p>…the Church ministerially does judge, so as the obligatory power is from the things themselves, not from the will of human superiors. No necessity of peace which is posterior to truth, no necessity of obedience to authority, no necessity of uniformity in these externals, simply, and as they are such, are necessities obliging us to obedience: For things must first in themselves be necessary, before they can oblige to obedience. I must obey superiors in these things of convenient necessity, because they are convenient, and most convenient in themselves, and so intrinsically most necessary, but they are not necessarily to be done in themselves, because I must obey superiors, and because I must keep uniformity with the Church. The will of superiors do find in things necessity, and good of uniformity, but they do not make necessity, nor the good of uniformity: We should be servants of men if our obedience were ultimately resolved in the mere will of superiors in any the least circumstance of worship: and what I say of actions, holds in matters of mere custom also.</p></blockquote>

</figure><figure class="quote" id="q-41d3a725ae" data-kw="">
<blockquote><p>Reason 2. They that consenting with others in the doctrine of salvation by Christ, do nevertheless separate themselves from them as touching spiritual communion, are schismatics (1 Cor. 1:10-11; Jud. 19)… They that without just cause, renounce all spiritual communion in public with a true Church, are schismatics… The Church of England is a true Church of God… The Gospel of our saluation is the word of truth. The Church of England upholds as a pillar, the Gospel of our salvation. Therefore it upholds the word of truth, and by consequence it is a true Church. Let them not here stand to show a difference between the Church of England and Ephesus. There may be a difference between true Churches: notwithstanding they are all true that maintain the word of truth, the Gospel. … If they are to be accounted true teachers, who keep this foundation (Christ is come in the flesh) and build not upon it any doctrine overthrowing the same, then a Church, as that now of England, is to be held for a true Church, which retains this foundation of the Christian Faith and builds not upon it any doctrines overthrowing the same.</p></blockquote>

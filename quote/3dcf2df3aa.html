<main class="wrap"><figure class="quote" id="q-3dcf2df3aa" data-kw="">
<blockquote><p>For because Paul had taught, that a man is justified by faith without works, hence some inferred, that in whatever manner a man live, it, equally suffices, that he persuade himself that Christ is his Saviour. Which they could have inferred with no plausibility, if that had been evident which the very learned man will have to be so, viz. That Paul, by faith understood evangelical godliness. But because Paul’s words evidently bore that sense, that faith was a thing distinct from all the works of holiness, as in reality it is, hence arose the pretext of calumny. I say, of calumny: for though Paul taught, that works contribute nothing to justification, or to procure a man’s title to salvation; yet he always taught, that they were not only useful, but also necessary to salvation, and that it is impossible, that sanctification should be separated from justification. James treads in the same path, and teaches that it is necessary that he who is justified by faith, should also be justified by works: that is, perform these works which are the evidences and effects of righteousness, and by which it is demonstrated not only before men, but also before God, that he is righteous: according to that of John, “He who doeth righteousness is righteous,” 1 John 3:7. Indeed there is a double justification: one of a man sinful in himself, whereby he is absolved from sin, and declared to have a title to eternal life, on account of Christ’s righteousness apprehended by faith, which Paul inculcated: another of a man, righteous already, sanctified by the Spirit of Christ, and who is declared to be such, by his words and actions. James teaches, that this is so necessary, and so connected with the former, that he is deceived who boasts of that and is destitue of this.</p></blockquote>

<blockquote><p>10. What all the more rigid Protestants affirm for certain, that God, though not in time, yet in the order of nature, first justifies the sinner, or forgives his sins, and afterwards makes him just, or sanctifies him, let them look well to it, I pray, lest perchance they too audaciously and rashly define the order of the divine actions, which has not been manifestly revealed in the Scriptures. In the [Romanist] schools themselves there has been no small contention on this subject, nor is it yet decided: ‘Whether the infusion of grace,’ says [Thomas] Stapleton (Of Justification, bk. 5, ch. 8, sect. Rursum), ‘precedes the forgiveness of sins in the order of nature, as St. Thomas lays down… or whether the contrary be true, as others most strenuously maintain, is rather a scholastic question than one now-a-days controverted, and is one on which neither formerly nor now has the Church defined anything on either side.’ The moderation of Theodore Beza in this matter, in other respects sufficiently rigid, is much to be approved of. He thus writes (Demonstrations against Flacius Illyricus and his Apology, sect. 22, Rursum quaero, tome 2, p. 218 (or p. 171)): ‘If you take justification in a general sense, as it is sometimes used by the apostle, sanctification will not be an effect, but a part or species of it; but if merely for the gift of imputed justice, or the gratuitous forgiveness of sins, than sanctification will be another gift, which always follows that first gift, since whoever is justified gratis in Christ is also sanctified by His Spirit… Nor need we here contend much which of the two precedes in order, since in one and the same moment Christ… justifies us, and by his Spirit begins to sanctify us.’ and (p. 237, sect. 23, Praeterea quum (or p. 185)): ‘When I had said what is quite true, that, provided it is allowed that we must first of all be made partakers of Christ Himself, that in Him we may be justified and sanctified, we need not labor much to find which of these two precedes in order. lIllyricus brings forward against me Calvin, who says (Antidote to the Council of Trent, sess. 6, sect. Neque tamen interea, tome 8, p. 241) that, ‘as soon as any one is justified, renewal also necessarily follows.’ But Calvin here refuting the decisions of the Council of Trent, by which justification is confounded with the gift of sanctification, is not disputing about the order or series of these two, but of their connection; and therefore says, that ‘if anyone is justified renewal also follows, i.e., that it is necessarily concluded that, if any one be justified, he may also be said to be sanctified. But, I pray you, if I say, ‘If anyone lives, it follows that he is endowed with a soul,’ will it be rightly concluded from thence that I make the being endowed with a soul something posterior to life?’ and (p. 238 (or p. 186) around the end, sect. Ego vero inhabitationem) ‘I say that we are simultaneously justified and renewed in Christ, united and applied to us by faith; and I think that we need not trouble ourselves in anyway to determine whether this one or that precedes in order, since we never receive the one without the other, etc.’ Would that this moderation were religiously followed, not only by the more rigid Protestants, but also by very many other theologians of both parties, who now-a-days excite so many and so great disturbanees in the Church about the mode and order of the divine operations.</p></blockquote>

<blockquote><p>2. The predicate [of the verse Rom. 6:7 is], ‘is freed from sin.’ The word [for “freed”] δεδικαιωται, the Vulgar [Vulgate] has, justificatus est a peccato [is justified from sin]: Beza, with many of the ancients, liberatus est [is liberated]. Our translation has both in the text, “freed,” in the margin, “justified”. Whether you take one or the other word, it imports deliverance from the yoke and dominion of sin, so as not to obey its motions and commands. For the apostle does not speak here of the forgiveness of sin, but the abolition of its power and dominion; for it is brought as a reason why those whose old man is crucified with Christ should not serve sin; and the word “justified” is the rather used, because one justified and absolved by his judge, is also released and set free from his bonds; so are we. …

I. The nature of this freedom from sin. I told you before, it is an exemption from the dominion and reign of sin.

      1. We quit the evil disposition and temper of our souls…

      2. We renounce our former course of living, after the habits we are free from the acts, we do not, and durst not to live in sin, the former conversation [conduct] is cast off as well as the former lusts… Now this freedom is expressed by a word that signifies justification, and fitly:

      1. Because of the nature of justification, in which there are two branches; liberatio a poena [liberation from punishment], and acceptatio ad vitam [acceptance to life]. The punishment incurred by the Fall is poena damni and poena sensus, the loss and the pain: Both may be considered as in this life, or the life to come… But in this life we must also consider the loss and pain. The pains are all those miseries and afflictive evils, which came into the world by reason of sin. The loss is loss of God’s image: that threatening, ‘Thou shalt die the death,’ Gen. 2:17, implied spiritual death as well as temporal and eternal. Now we are justified when we are freed from punishment, and among other punishments from the punishment of loss, when God giveth us the blessing, which sin had deprived us of: As for instance, when He gives us the sanctifying Spirit [Rom. 5:5], this is called a receiving the atonement, Rom. 5:11. We had forfeited it by sin, and God being pacified in Christ, does restore it to us. Man brought upon himself spiritual death by sin, and the gift of the sanctifying Spirit is the great and first act of God’s pardoning mercy, and a means to qualify us for other parts of pardon. Though the thing be plain of itself, yet to make it more clear to us:

      2. Let us distinguish of the kinds of justification. There is a twofold justification, it is either constitutive or executive. First, constitutive justification is by the new Covenant, when those who submit to the terms are constituted or made righteous: Jn. 5:24, ‘He that hears my word, and believes in Him that sent Me, has everlasting life, and shall not come into condemnation; but is passed from death to life.’ There is God’s grant, and whosoever can make good his claim, has a right to justification by God’s own grant, according to the law of grace, he is one freed from sin. Secondly, executive, when God accordingly takes off all penalties and evils, and gives us all the good which belongs to the righteous or justified: as in the case in hand, when God gives us the Spirit to break the power and reign of sin: And therefore so often in Scripture is God said to sanctify us as a God of peace, or as a God pacified and reconciled to us in Jesus Christ: Heb. 13:20-21, ‘Now the God of peace that brought again from the dead our Lord Jesus, that great Shepherd of the sheep, through the blood of the everlasting covenant, make you perfect in every good work to do his will, working in you that which is well-pleasing in his sight.’ 1 Thess. 5:23, ‘And the very God of peace sanctify ye wholly, etc.’ 2 Cor. 5:18, ‘And all things are of God, who hath reconciled us to Himself by Jesus Christ.’ This God does as a Judge, acting according to the rules of government constituted in the new Covenant, upon the account of the merit of Christ, and our actual interest in Him.

II. As to the degree, how far we are freed from sin.

      1. All the justified and converted to God are freed from the Reign of it. The flesh, though it remaineth, is made subject to the Spirit, which by degrees doth destroy the reliques of sin: For it is said of the justified, Rom. 8.1. There is no condemnation to them that are in Christ Jesus, who walk not after the flesh, but after the Spirit.

      2. The more obedient we are to the motions of the sanctifying Spirit, the more power we have against sin: Gal. 5.18. If ye be led by the Spirit, ye are not under the Law, under the irritating Power and Curse of it. Many sins are in a great measure left uncured as a part of our punishment. … 4. Where the work is really begun and duly submitted unto, we have hopes of a better estate, it still increases towards that perfect blessedness, when we shall be without spot and blemish, or any such thing, Eph. 5:27. What a life do God’s holy ones live in Heaven, who are wholly freed from sin?… There is none in Heaven by the first Covenant [of Words]; all that are there come thither as sanctified and justified by Jesus Christ, and in the way of his pardoning grace. Surely since we have the same Redeemer, depend upon the merit of the same sacrifice, and wait for the same Spirit in the use of all holy means and endeavours, He will not be strange to us… … IV. How is it a consequent of our dying with Christ?… … 2. It is his privilege, being crucified with Christ; he has a right, and not a right only, but his justification is executed and applied to him by the gift of the sanctifying Spirit, which is the surest token of God’s love, and the true effect of his approbation… … Use 1. To inform us of the intimate connection between all the parts and branches of the grace of the Gospel. We are absolved and discharged from the power of sin as well as from the guilt of it. All will grant that justification respects the guilt of sin; but the apostle tells us here that justification respects the power of sin also. The penalty was the loss of God’s image as well as of his favor: so that pardon is executed and applied when our natures are sanctified and healed. The privation of the Spirit being the great punishment, the gift of the Spirit is a great branch of our absolution, and so Christ’s reconciling and renewing grace fairly accord and agree.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2. The predicate [of the verse Rom. 6:7 is], ‘is freed from sin.’ The word [for “freed”] δεδικαιωται, the Vulgar [Vulgate] has, justificatus est a peccato [is justified from sin]: Beza, with many of the ancients, liberatus est [is liberated]. Our translation has both in the text, “freed,” in the margin, “justified”. Whether you take one or the other word, it imports deliverance from the yoke and dominion of sin, so as not to obey its motions and commands. For the apostle does not speak here of the forgiveness of sin, but the abolition of its power and dominion; for it is brought as a reason why those whose old man is crucified with Christ should not serve sin; and the word “justified” is the rather used, because one justified and absolved by his judge, is also released and set free from his bonds; so are we. …

<blockquote><p>The righteousness by which we are justified and stand righteous before God, is not our own righteousness, but the righteousness of Christ, Phil. 3:8-9; 2 Cor. 5:21, not the righteousness of Christ as God the Second Person in Trinity, but as Mediator, God-man. In which there are two things:

1. The perfect holiness of his humane nature, Heb. 7:26.

2. The perfect righteousness which He performed in doing and suffering according to the Law, this is imputed to us. Christ’s active obedience, his good works and holy life could never have been meritorious for us, nor brought us to Heaven, if he had not died for us, therefore our justification and obtaining of heaven is ascribed to his blood, as if that alone had done both, Rom. 5:9; Heb. 10:19; Rev. 5:6, 9, 11; his intercession and prayers had not been meritorious for us, if he had not died for us.</p></blockquote>

1. The perfect holiness of his humane nature, Heb. 7:26.

2. The perfect righteousness which He performed in doing and suffering according to the Law, this is imputed to us. Christ’s active obedience, his good works and holy life could never have been meritorious for us, nor brought us to Heaven, if he had not died for us, therefore our justification and obtaining of heaven is ascribed to his blood, as if that alone had done both, Rom. 5:9; Heb. 10:19; Rev. 5:6, 9, 11; his intercession and prayers had not been meritorious for us, if he had not died for us.”

<blockquote><p>2. How many sorts of concupiscences there be Before the sin of our first parents, the concupiscence in our nature was simple, natural, orderly (and necessary, like as other affections were, so that it was subject unto no malice: such as that which is in us yet, as when we be hungry we be desire meat; when we thirst, drink; when we be a cold, we desire warmth; when we be too hot, we desire to be cooled; when we be in prison, we desire liberty; when we be sick, we desire health etc. and this we do by the only course of nature, without any matter of sin. But after that our first parents had drunk of the poison of the Serpent, this strength of concupiscence is depraved in our hearts, and thereby it came that (passing the limits of nature and necessity) it extends itself unto those things which it is not lawful to desire: for that it is not lawful to take things away which pertain to others. Therefore the affections of concupiscence are of two sorts, natural and corrupt. The natural be set in us by God, and so much not unlawful, but that they be also necessary. Wherefore they do very unadvisedly teach us which do refer the crying of infants when they be hungry and desire meat unto the forbidden concupiscence and do ascribe them unto original sin. The corrupt affections of concupiscence be they when the limits of necessity are exceeded and men follow pleasures, curiosity, glory, ambition and other vices, and that contrary unto the law of charity and the purity of holiness. This corruption of our concupiscence is gotten of the old serpent, not grafted in our flesh of God. Wherefore we must beware that we do not ascribe our whole concupiscence neither to God, neither to Satan. The strength of desiring is given us from God, the strength of evil desiring from Satan: like as we do take it of God that we do live, and that we live evil we take it of Satan, the beginner of our malice. By this distinction we do foresee that we do not deny the work of God in us for the work of Satan, nor attribute the work of Satan unto God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places of the Christian Religion (1560; London, 1563), The Tenth Precept</cite>, fol. 103.a – 104.a</span></figcaption>

<blockquote><p>[3.] If parents, by refusing to comply with the desire of their children [in desiring to marry someone], plainly, in the judgment of the wisest of men, obstruct their happiness, and the glory of God herein. Or, if they have no reason for their not complying, or the reason given is contrary to the laws of God, or the common sense of all impartial judges; especially if the affair took its first rise from them, and afterwards they changed their mind, without sufficient ground. This, without doubt, lessens, or it may be so circumstanced, that it wholly takes away the charge of sin in the child, in acting contrary to the will of his parents, and fastens the guilt on them.</p></blockquote>

<blockquote><p>§XXVII. With respect to Duration, the human soul is immortal, which Christian Religion teaches against the Sadducees, Epicureans, and Atheists, who think that souls are extinguished with their bodies. This is contradicted by: 1. Scripture, Eccl. 12:7, “The dust returns to its earth from whence it was, and the Spirit returns to God who gave it.” Mt. 10:28, “Fear not them which kill the body, but are not able to kill the soul: but rather fear him, which is able to destroy both soul and body in Hell.” Mt. 22:32, “I am the God of Abraham, and the God of Isaac, and the God of Jacob: God is not the God of the dead, but of the living.” Lk. 16:23, “The rich man in torments saw Abraham afar off, and Lazarus in his bosom,” etc. Lk. 23:43, Christ to the converted thief: “Today you will be with me in Paradise.” v. 46, Christ, expiring, cried out: “Father, into your hands I commend my Spirit.” 2 Cor. 5:8, Paul says: “We are willing rather to be absent from the body, and to be present with the Lord.” Phil. 1:23, “I have a desire to depart, and to be with Christ.” 1 Pet. 3:19, “By which also he went and preached unto the spirits in prison,” etc. add Ps. 49:15, “God will redeem my soul from the power of the grave: for He shall receive me.” 2 Sam. 12:23, “But now he is dead, wherefore should I fast? can I bring him back again? I shall go to him, but he shall not return to me.” 1 Kn. 17:21, “O Lord my God, I pray thee, let this child’s soul come into him again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’ (Frankfurt: Steppinus, 1706), sect. 27</cite>, pp. 13-14 trans. AI Latin</span></figcaption>

%94+Barthold+Holtzfus%2C+%E2%80%98Theological+Dissertation+on+Creation%E2%80%99+%28Frankfurt%3A+Steppinus%2C+1706%29%2C+sect.+27%2C+pp.+13-14+trans.+AI+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7172df1a15.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7172df1a15.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-human-soul/#:~:text=XXVII.%20With%20respect%20to%20Duration%2C%20the,child%E2%80%99s%20soul%20come%20into%20him%20again&amp;text=XXVII.%20With%20respect%20to%20Duration%2C%20the%20human%20soul&amp;text=let%20this%20child%E2%80%99s%20soul%20come%20into%20him%20again" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

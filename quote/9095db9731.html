<blockquote><p>2. Some sins may be of so heinous scandal, that if the person repent of them this day, his absolution and reception may be delayed till the scandal be removed: 1. Because the public good is to be preferred before any man’s personal good. 2. And the Churches, or enemies about, cannot so suddenly know of a man’s repentance. If they hear of a man’s murder, perjury or adultery today, and hear that he is absolved tomorrow, they will think that the Church consists of such, or that it makes very light of sin. Therefore the ancient Churches delayed and imposed penances, partly to avoid such scandal. 3. And partly because that some sins are so heinous that a sudden profession is not a sufficient evidence of repentance, unless there be also some evidence of contrition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Question 94, ‘For what sins may a man be denied communion or [be] excommunicated? Whether for impenitence in every little sin? Or for great sin without impenitence?’ in A Christian Directory: a Sum of Practical Theology and Cases of Conscience (1673), pt. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>
<div class="actions"><button class="copy" data-copy="“2. Some sins may be of so heinous scandal, that if the person repent of them this day, his absolution and reception may be delayed till the scandal be removed: 1. Because the public good is to be preferred before any man’s personal good. 2. And the Churches, or enemies about, cannot so suddenly know of a man’s repentance. If they hear of a man’s murder, perjury or adultery today, and hear that he is absolved tomorrow, they will think that the Church consists of such, or that it makes very light of sin. Therefore the ancient Churches delayed and imposed penances, partly to avoid such scandal. 3. And partly because that some sins are so heinous that a sudden profession is not a sufficient evidence of repentance, unless there be also some evidence of contrition.”

er" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5abcc2c690" data-kw="">
<blockquote><p>But for such as are excommunicated because of some particular scandal, as incest, or a particular heresy, and yet profess the truth, as to all other points, they are members cut off, and yet not cut off, in so far as they retain a profession, yea and to the knowledge of the Church, are visible converts, though in one particular scandal they lie without and give not such evidences of repentance [so] as [that] the Church can pardon them, as may be proven from the 2 Cor. 2:6-9; they are ordinary hearers of the Word, as such as must be reclaimed by the preached Word, as sick children, under the medicinal cure of [lesser] excommunication, and the preached Word that the spirit may be saved in the Day of the Lord (1 Cor. 5), but they are not ordinary hearers as visible professors [simply, who have not been excommunicated], nor are they members complete [communicant] of the Church in the inner court, admitted to the seals; 2. 2 Thess. 3:14-15, They are cut off members, yet not counted as enemies, but to be admonished as brethren. Therefore, though they be [in Greek] as heathens and publicans, Mt. 18, yet are they not simply to be counted pagans, nor occasional hearers, as pagans, but brethren: and though Mr. [John] Robinson [a Separatist], and some say the place, 2 Thess. 3, is not meant of excommunicated persons, beside that it is against the text, against the current of sound interpreters, yet it proves our point, that even such as walk disorderly, [in Greek], verse 11, and obey not the doctrine of the Gospel, and with whom we should not keep company, v. 14, and so ought to be excommunicate, by Mr. [Thomas] Hooker’s doctrine [a congregationalist], yet remain brethren, and are to be counted so by members of the Church, and are to hear the word of admonition, and so are visible professors, and so not utterly cast out of the visible Church, and Mr. Hooker doth no more refute our Protestants, than the Scripture who calls such as are fed, and the hearers of the Lord’s testimonies, the Israel of God, and the sheep of his pasture, his flock, inheritance, his vineyard his garath[?] of red vine, his spouse, and what is this but the Church visible, Ps. 147:19-20; Hos. 8:11. What? because the excommunicated who thus hear ordinarily are not members of the Church, because they are not whole and entire members, it is no more consequently spoken, than if he would say a wounded soldier, because he is wounded, and under cure, is not a member of the army and sworn to the colors, because he cannot march and fight as other soldiers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … wherein the way of the Churches of New England is now Re-Examined (London, 1658), bk. 1, ch. 5, pp. 20-21</span></figcaption>

<blockquote><p>Simon Magus was not so tried [as to his sincerity or hypocrisy], yea when Peter found him in the gall of bitterness, we find not that he cast him out of the visible Church in respect his sin was not that publicly scandalous as to offend the whole Church.</p></blockquote>

</figure><figure class="quote" id="q-85ab1eda9d" data-kw="">
<blockquote><p>2nd Conclusion: Excommunicated persons though they be debarred from the Lord’s Supper and delivered to Satan, and [are] to be accompted [accounted] as heathen and publicans, yet are they not altogether and every way cut off from the visible Church. 2 Thess. 3:14, ‘If any obey not our word by letter, mark such an one, [in Greek,] with the note of excommunication (says Beza), and have no fellowship with him that he may be ashamed; that is, as Calvin well expounds, exclude him out of the company of the faithful and excommunicate him. So also Bullinger, Marlorat and Jodocus Vullichius; v. 15, ‘Yet accompt him not as an enemy, but admonish him as a brother.’ I know Mr. [John] Robinson [a New England, Independent, separatist] denies this place to be understood of any excommunicated person, but he wills the Thessalonians not to countenance, but to show their dislike of idle persons; and his reasons are: 1. Because if Christ bids accompt the excommunicated person as an heathen and a publican, would Paul thereafter accompt him as a brother? 2. Idolaters and heretics are to be excommunicated, and will you have such a brotherhood, as [a] brother-idolater? But I answer: 1. We read not in the New Testament where Christ or his apostles bid break off Christian fellowship with any, but there is excommunication signified. If these words [in Greek], ‘have no fellowship with him, that he may be ashamed,’ signify not to forbear fellowship with him as a cast-out person, but only to show their dislike of the sin, that he may see it and be ashamed, as Robinson says, there is no more punishment to be inflicted on a contumacious person who will not obey the apostle’s words than is inflicted for any sin to which contumacy is not added; for we are to show our dislike of any sin, even the seen infirmities of our brethren. For Augustine says, peccatum tuum est, quic quid tibi non displicet, ‘every sin in another is thine, against which thou showest not thy dislike.’ 2. The Law of nature does enforce (Lev. 19:17) that we should generally rebuke our brethren, and so show our dislike for any sin. 3. ‘Be not mixed in fellowship with such a man,’ is a public abstinence from communion with him, else it does not shame him. For every shown dislike, or not-communion with another in his sin, is not that which will put public shame on him that he may repent, as is intimated here. 2. Christ bids not accompt him a publican, but [in Greek] is a note of similitude. Simile qua simile non est idem. ‘Every thing like is not the same.’ So that he may well be accompted as an heathen, not being altogether an heathen, and yet a brother, whose salvation and gaining you must intend. Nor is it altogether against the comparison of Christ and that gentle waiting on perverse idolaters and excommunicate[d] persons to admonish them as brethren. Seeing it becomes us to be merciful as our heavenly Father is, 2 Tim. 2:24-25; Mt. 5:45. And we must forgive our offending brethren seventy seven times, Mt. 18:22. And therefore though he were twice excommunicated, he is to be dealt with as a brother. And an idolatrous brother is no worse than a Samaritan neighbor or friend. 2. If excommunication be a medicine of the Church toward a sick son, the end whereof is salvation, ‘that the spirit may be saved in the Lord’s Day,’ 1 Cor. 5:5, ‘that he may learn not to blaspheme,’ 1 Tim. 1:12. ‘That be may be gained,’ Mt. 18:15. Therefore, he is not altogether cut off from the Church; for delivering to Satan is medicinal, not vindictive, as the great excommunication is which is called Anathema Maranatha, which we cannot use but against such as have sinned the sin against the Holy Ghost, and is hardly discerned; and I would think, such an one as Julian the Apostate should be debarred from the communion of the Word preached. But these who are ordinarily excommunicated for contumacy and particular faults, and not for universal apostasy, are not altogether excluded from all brotherhood of the Church. 3. If the excommunicate[d] person be excluded from all privileges of Church-fellowship, then also is he excluded from hearing the Word as a sick patient under Church-medicine [and yet greater-excommunicated persons were allowed the hearing of the preached Word in the Church of Scotland]; for it is a pastoral, and so to our [Independent] Brethren a Church-act, that the Shepherd strengthen the diseased, heal that which is sick, bind up that which is broken, bring again that which is driven away, seek that which is lost, Eze. 34. 4. And [it is a pastoral act to] feed the flock with knowledge, as a pastor according to God’s heart and a bishop, Jer. 3:15; Acts 20:28; 1 Pet. 5:2; Jer. 23:1-4; Jer. 50:7; Isa. 56:10; Zech. 11:9-12. It is a pastoral act to preach with all authority, reprove, rebuke, exhort with all long suffering and doctrine, 2 Tim. 4:2. 5. He should as a pastor teach sound doctrine, exhort, convince the gainsayers, and silence heretics, Tit. 1:9. But seeing the excommunicated person is not excluded from hearing the Word, and the pastor has a pastoral care of his soul and is to intend that his spirit may be saved in the day of the Lord, 1 Cor. 5:5, he cannot be utterly cut off from all Church-fellowship. Also this [Independent] Author says that Church-members are to be admonished, and if we do it not, we hate them in our heart, Lev. 19:17; and if we warn not an Achan, his sin is the sin of all Israel. Now if an excommunicated brother remain one whom we are to gain, and whose salvation we are to intend, if he be an ordinary co-worshipper in hearing, the object of pastoral and brotherly teaching and admonishing, he cannot be wholly excluded from all Church-fellowship. And this also proves that these be members of the visible Church in some degree of Church-worship who yet are debarred from the seal of the Covenant. And it cannot be said that the excommunicated person ought not to rebuke his brother and not hate him in his heart, as Lev. 19:17. Penal excommunication looses not from the Law of nature. But our [Independent] brethren make rebuking and mutual exhorting one of another Church duties of watchfulness; then is the excommunicated in some degree of Church-membership. Nor can our brethren here reply with good reason: Indians and Turks may hear the Word as well as the excommunicated person; and therefore hearing of the word is no note of Church communion. I answer: [1.] The Turk and Indian must hear the Word, but at the by, and not professedly; but the excommunicated person by the tie of his Covenant made in baptism, and that relation he has to the Church under whose cure he is for the saving of his spirit, and to that Gospel which he professes, is obliged to the Church-communion of public-hearing [of] the Word; yea, and according to his oath given, to be subject to the ministry of such a man whom he chose for his pastor, to give obedience to him in the Lord, however in that one particular for which he is cast out he has failed against all the foresaid obligations. 2. The Church, as a visible Church, exercises no medicinal acts upon Turks or heathen persons, and does not repute them as heathen, but does repute them to be heathen. Nor have the pastors any pastoral charge of Turks and heathens except [that] they would desire to be baptized and profess the faith. But the Church as the Church exercises medicinal acts of shunning Christian fellowship with the excommunicated, and that with a continuated intention even when he is excommunicated, that his spirit may be saved in the day of God; and the pastor has a pastoral, and so a ministerial care and obligation of pastoral teaching, admonishing and persuading him to return to God. 4. Neither do we mean with Suarez and other schoolmen that excommunication does not so cut off a member as it removes not that baptismal character, or that passive power to receive the sacraments, or that the prayers of the Church are not offered of direct intention for the inwardly humbled and repenting excommunicated person while the sentence of absolution be pronounced by the Church, as Soto, Adrianus and Alanus think, because, forsooth, Innocentius III says [that] the excommunicated person, though repenting and doing what he can to be reconciled to the Church, yet without absolution from the censure, he is mortuus ecclesiastice, ‘dead ecclesiastically’, and so in Heaven also. Though Navar, Turrecremata, Richard [and] Anton. think the penitent, excommunicated person is included in the general desires of the Church in their prayers because it is not the intention of the Church to exclude a true and living member of Christ’s body from a communion-spiritual with Christ. But our meaning is that the excommunicated person is deprived of actual fellowship with Christ in the seals of the Covenant, as the Council of Arausican, A gremio sanctae matris Ecclesiae et consortio totius Christianitatis eliminamus. His sin is bound in Heaven, yet so as the salvation of his spirit is intended by the Church; see for this Augustine. We understand not a baptismal character, except regeneration and remission of sins, which cannot be taken away by excommunication, and therefore a moral claim to the holy things of God, and that for that time and state is rather removed, than any internal right to Christ. Therefore some say, in this he loses rather possessionem quam jus, ‘possession than right’. As a nobleman, for some offence, of three dwelling houses that he has, is confined to one of the three, so as he may not remove from that one; yet does he not lose right to the other two. … 5. All our divines, standing for the certainty of the perseverance of the regenerated, answer Papists and Arminians alleging for the apostasy of the saints, the example of the regenerated who may be excommunicated, that excommunication does never evince [prove] that the person excommunicated is out of the state of grace, but only that he has fallen into a scandalous external fact, which deserves that he should be delivered to Satan; and that one may be a member of the visible Church and converted to God, who is excommunicated. Lastly… But the believer is edified thereby [by excommunication], for he is delivered to Satan for the destruction of the flesh, that the spirit may be saved in the day of the Lord… It were an inconvenience [contradiction] to deliver a [true] member of Christ to Satan morally, as 1 Cor. 6:15. This is [would be] a sinful deliverance, when one is given over to Satan, that Satan may work in him as in his work-house and as in a child of disobedience, Eph. 2:2; a converted soul cannot thus be delivered to Satan; and this [former conception] we abhor to write no less than Robinson [who had opposed it as an objection]. But to deliver to Satan penally, as to a penal torturer who works sorrow and fear in the conscience for sin, to humble the offender, and to save his spirit in the day of Christ, is neither horror by word nor by writ, but [rather it is] the Word of God, 1 Cor. 5:5. … …and Field, ‘Excommunication does not wholly’ (saith he) ‘cut off men from the visible Church;’ and his reason is good, because they may and often do retain, first, the profession of pure truth; secondly, the character of baptism; thirdly, they profess obedience to their pastors; fourthly, they will not join to any other communion. And therefore to say with our [Independent] Author, we dare not, to wit: ‘That though the seed of faith may remain in the excommunicated person; yet to the society of the faithful joined in a particular visible Church, they are not knit, but wholly cut off from their communion. Also, he is delivered unto Satan, and therefore wholly cut off from the communion of the Church; and so from the seals, he and his seed, as heathen and heathen’s seed are.’ …So we are to condemn these who are more rigorous toward such as are excommunicated than Christ is: for Christ keeps them as sick children within his visible Church and uses Satan as the physician’s servant, who [the physician] boils herbs and dresses drugs for them, while he [the servant], by God’s permission, torments his spirit with the conscience of sin. As when a child is sick (says worthy Cartwright) the father calls a college of physicians to consult about medicine to be given to the child. So is the contumacious person under the medicine of excommunication administered by the Church-presbytery. Now this we cannot say of heathen and publicans. And therefore Augustine says excellently, excommunicated persons non esse ethnicos, sed tanquam ethnicos; ‘are not heathen, but esteemed as heathen,’ (ch. 6) and Chrysostom says the same in sense. Yea, I gather this necessary distinction out of the Fathers, as Chrysostom, Theophylactus, Hilarius, that they are not members of the visible Church actu pleno, in a full act, because they want external communion with the Church, yet actu imperfecto, imperfectly they are members. A second distinction I collect from Ireneus, Gregorius, Hieronim., Optatus, Augustine, that they are exclusi ab ecclesia quoad communionem, non ab ecclesia ipsa. ‘They are excluded from the visible communion of the Church, rather than from the Church.’ A third distinction may be drawn from Eugenius, Chrysostom, Gregory Nazianzen, while they call baptism, januam spiritualem, and lavacrum animae, the door of our entry to the Church (for which cause papists, though fondly, place their font at the Church-door) as the lavator of the soul. So as excommunicated persons are within the door of the visible Church, though not admitted to the King’s table. 4. The schoolmen do allow to the excommunicated persons, jus, non consortium; ‘[a] right, but not fellowship.’ 5. Turrecremaeta, Vega., Soto, Canus, insinuat distinctionem inter partes et membra Ecclesiae visibilis, because of some external communion that they have, as teeth are parts of the body in a new born infant, but they are not members; but they deny them to be members because they are cut off. 6. Suarez excellently, privantur quoad communicationemcum aliis membris, non quoad esse membri. ‘They are deprived according to the act of communion with other members, not as if they ceased to be members;’ as a member which cannot receive nourishment is yet still a member. Our divines from Scripture make three degrees of excommunication: 1. A debarring from the Lord’s Supper, Mt. 5:24, but it is not indeed a delivering to Satan or excommunication: this is called the lesser excommunication. 2. A delivering to Satan, the greater excommunication, 1 Cor. 5:3-4, of this we speak here especially. 3. Maranatha in the Syriac an is utter cursing till Christ’s second coming.</p></blockquote>

0%99s+words+than+is+inflicted+for+any+sin+to+which+contumacy+is+not+added%3B+for+we+are+to+show+our+dislike+of+any+sin%2C+even+the+seen+infirmities+of+our+brethren.+For+Augustine+says%2C+peccatum+tuum+est%2C+quic+quid+tibi+non+displicet%2C+%E2%80%98every+sin+in+another+is+thine%2C+against+which+thou+showest+not+thy+dislike.%E2%80%99+2.+The+Law+of+nature+does+enforce+%28Lev.+19%3A17%29+that+we+should+generally+rebuke+our+brethren%2C+and+so+show+our+dislike+for+any+sin.+3.+%E2%80%98Be+not+mixed+in+fellowship+with+such+a+man%2C%E2%80%99+is+a+public+abstinence+from+communion+with+him%2C+else+it+does+not+shame+him.+For+every+shown+dislike%2C+or+not-communion+with+another+in+his+sin%2C+is+not+that+which+will+put+public+shame+on+him+that+he+may+repent%2C+as+is+intimated+here.+2.+Christ+bids+not+accompt+him+a+publican%2C+but+%5Bin+Greek%5D+is+a+note+of+similitude.+Simile+qua+simile+non+est+idem.+%E2%80%98Every+thing+like+is+not+the+same.%E2%80%99+So+that+he+may+well+be+accompted+as+an+heathen%2C+not+being+altogether+an+heathen%2C+and+yet+a+brother%2C+whose+salvation+and+gaining+you+must+intend.+Nor+is+it+altogether+against+the+comparison+of+Christ+and+that+gentle+waiting+on+perverse+idolaters+and+excommunicate%5Bd%5D+persons+to+admonish+them+as+brethren.+Seeing+it+becomes+us+to+be+merciful+as+our+heavenly+Father+is%2C+2+Tim.+2%3A24-25%3B+Mt.+5%3A45.+And+we+must+forgive+our+offending+brethren+seventy+seven+times%2C+Mt.+18%3A22.+And+therefore+though+he+were+twice+excommunicated%2C+he+is+to+be+dealt+with+as+a+brother.+And+an+idolatrous+brother+is+no+worse+than+a+Samaritan+neighbor+or+friend.+2.+If+excommunication+be+a+medicine+of+the+Church+toward+a+sick+son%2C+the+end+whereof+is+salvation%2C+%E2%80%98that+the+spirit+may+be+saved+in+the+Lord%E2%80%99s+Day%2C%E2%80%99+1+Cor.+5%3A5%2C+%E2%80%98that+he+may+learn+not+to+blaspheme%2C%E2%80%99+1+Tim.+1%3A12.+%E2%80%98That+be+may+be+gained%2C%E2%80%99+Mt.+18%3A15.+Therefore%2C+he+is+not+altogether+cut+off+from+the+Church%3B+for+delivering+to+Satan+is+medicinal%2C+not+vindictive%2C+as+the+great+excommunication+is+which+is+called+Anathema+Maranatha%2C+which+we+cannot+use+but+against+such+as+have+sinned+the+sin+against+the+Holy+Ghost%2C+and+is+hardly+discerned%3B+and+I+would+think%2C+such+an+one+as+Julian+the+Apostate+should+be+debarred+from+the+communion+of+the+Word+preached.+But+these+who+are+ordinarily+excommunicated+for+contumacy+and+particular+faults%2C+and+not+for+universal+apostasy%2C+are+not+altogether+excluded+from+all+brotherhood+of+the+Church.+3.+If+the+excommunicate%5Bd%5D+person+be+excluded+from+all+privileges+of+Church-fellowship%2C+then+also+is+he+excluded+from+hearing+the+Word+as+a+sick+patient+under+Church-medicine+%5Band+yet+greater-excommunicated+persons+were+allowed+the+hearing+of+the+preached+Word+in+the+Church+of+Scotland%5D%3B+for+it+is+a+pastoral%2C+and+so+to+our+%5BIndependent%5D+Brethren+a+Church-act%2C+that+the+Shepherd+strengthen+the+diseased%2C+heal+that+which+is+sick%2C+bind+up+that+which+is+broken%2C+bring+again+that+which+is+driven+away%2C+seek+that+which+is+lost%2C+Eze.+34.+4.+And+%5Bit+is+a+pastoral+act+to%5D+feed+the+flock+with+knowledge%2C+as+a+pastor+according+to+God%E2%80%99s+heart+and+a+bishop%2C+Jer.+3%3A15%3B+Acts+20%3A28%3B+1+Pet.+5%3A2%3B+Jer.+23%3A1-4%3B+Jer.+50%3A7%3B+Isa.+56%3A10%3B+Zech.+11%3A9-12.+It+is+a+pastoral+act+to+preach+with+all+authority%2C+reprove%2C+rebuke%2C+exhort+with+all+long+suffering+and+doctrine%2C+2+Tim.+4%3A2.+5.+He+should+as+a+pastor+teach+sound+doctrine%2C+exhort%2C+convince+the+gainsayers%2C+and+silence+heretics%2C+Tit.+1%3A9.+But+seeing+the+excommunicated+person+is+not+excluded+from+hearing+the+Word%2C+and+the+pastor+has+a+pastoral+care+of+his+soul+and+is+to+intend+that+his+spirit+may+be+saved+in+the+day+of+the+Lord%2C+1+Cor.+5%3A5%2C+he+cannot+be+utterly+cut+off+from+all+Church-fellowship.+Also+this+%5BIndependent%5D+Author+says+that+Church-members+are+to+be+admonished%2C+and+if+we+do+it+not%2C+we+hate+them+in+our+heart%2C+Lev.+19%3A17%3B+and+if+we+warn+not+an+Achan%2C+his+sin+is+the+sin+of+all+Israel.+Now+if+an+excommunicated+brother+remain+one+whom+we+are+to+gain%2C+and+whose+salvation+we+are+to+intend%2C+if+he+be+an+ordinary+co-worshipper+in+hearing%2C+the+object+of+pastoral+and+brotherly+teaching+and+admonishing%2C+he+cannot+be+wholly+excluded+from+all+Church-fellowship.+And+this+also+proves+that+these+be+members+of+the+visible+Church+in+some+degree+of+Church-worship+who+yet+are+debarred+from+the+seal+of+the+Covenant.+And+it+cannot+be+said+that+the+excommunicated+person+ought+not+to+rebuke+his+brother+and+not+hate+him+in+his+heart%2C+as+Lev.+19%3A17.+Penal+excommunication+looses+not+from+the+Law+of+nature.+But+our+%5BIndependent%5D+brethren+make+rebuking+and+mutual+exhorting+one+of+another+Church+duties+of+watchfulness%3B+then+is+the+excommunicated+in+some+degree+of+Church-membership.+Nor+can+our+brethren+here+reply+with+good+reason%3A+Indians+and+Turks+may+hear+the+Word+as+well+as+the+excommunicated+person%3B+and+therefore+hearing+of+the+word+is+no+note+of+Church+communion.+I+answer%3A+%5B1.%5D+The+Turk+and+Indian+must+hear+the+Word%2C+but+at+the+by%2C+and+not+professedly%3B+but+the+excommunicated+person+by+the+tie+of+his+Covenant+made+in+baptism%2C+and+that+relation+he+has+to+the+Church+under+whose+cure+he+is+for+the+saving+of+his+spirit%2C+and+to+that+Gospel+which+he+professes%2C+is+obliged+to+the+Church-communion+of+public-hearing+%5Bof%5D+the+Word%3B+yea%2C+and+according+to+his+oath+given%2C+to+be+subject+to+the+ministry+of+such+a+man+whom+he+chose+for+his+pastor%2C+to+give+obedience+to+him+in+the+Lord%2C+however+in+that+one+particular+for+which+he+is+cast+out+he+has+failed+against+all+the+foresaid+obligations.+2.+The+Church%2C+as+a+visible+Church%2C+exercises+no+medicinal+acts+upon+Turks+or+heathen+persons%2C+and+does+not+repute+them+as+heathen%2C+but+does+repute+them+to+be+heathen.+Nor+have+the+pastors+any+pastoral+charge+of+Turks+and+heathens+except+%5Bthat%5D+they+would+desire+to+be+baptized+and+profess+the+faith.+But+the+Church+as+the+Church+exercises+medicinal+acts+of+shunning+Christian+fellowship+with+the+excommunicated%2C+and+that+with+a+continuated+intention+even+when+he+is+excommunicated%2C+that+his+spirit+may+be+saved+in+the+day+of+God%3B+and+the+pastor+has+a+pastoral%2C+and+so+a+ministerial+care+and+obligation+of+pastoral+teaching%2C+admonishing+and+persuading+him+to+return+to+God.+4.+Neither+do+we+mean+with+Suarez+and+other+schoolmen+that+excommunication+does+not+so+cut+off+a+member+as+it+removes+not+that+baptismal+character%2C+or+that+passive+power+to+receive+the+sacraments%2C+or+that+the+prayers+of+the+Church+are+not+offered+of+direct+intention+for+the+inwardly+humbled+and+repenting+excommunicated+person+while+the+sentence+of+absolution+be+pronounced+by+the+Church%2C+as+Soto%2C+Adrianus+and+Alanus+think%2C+because%2C+forsooth%2C+Innocentius+III+says+%5Bthat%5D+the+excommunicated+person%2C+though+repenting+and+doing+what+he+can+to+be+reconciled+to+the+Church%2C+yet+without+absolution+from+the+censure%2C+he+is+mortuus+ecclesiastice%2C+%E2%80%98dead+ecclesiastically%E2%80%99%2C+and+so+in+Heaven+also.+Though+Navar%2C+Turrecremata%2C+Richard+%5Band%5D+Anton.+think+the+penitent%2C+excommunicated+person+is+included+in+the+general+desires+of+the+Church+in+their+prayers+because+it+is+not+the+intention+of+the+Church+to+exclude+a+true+and+living+member+of+Christ%E2%80%99s+body+from+a+communion-spiritual+with+Christ.+But+our+meaning+is+that+the+excommunicated+person+is+deprived+of+actual+fellowship+with+Christ+in+the+seals+of+the+Covenant%2C+as+the+Council+of+Arausican%2C+A+gremio+sanctae+matris+Ecclesiae+et+consortio+totius+Christianitatis+eliminamus.+His+sin+is+bound+in+Heaven%2C+yet+so+as+the+salvation+of+his+spirit+is+intended+by+the+Church%3B+see+for+this+Augustine.+We+understand+not+a+baptismal+character%2C+except+regeneration+and+remission+of+sins%2C+which+cannot+be+taken+away+by+excommunication%2C+and+therefore+a+moral+claim+to+the+holy+things+of+God%2C+and+that+for+that+time+and+state+is+rather+removed%2C+than+any+internal+right+to+Christ.+Therefore+some+say%2C+in+this+he+loses+rather+possessionem+quam+jus%2C+%E2%80%98possession+than+right%E2%80%99.+As+a+nobleman%2C+for+some+offence%2C+of+three+dwelling+houses+that+he+has%2C+is+confined+to+one+of+the+three%2C+so+as+he+may+not+remove+from+that+one%3B+yet+does+he+not+lose+right+to+the+other+two.+%E2%80%A6+5.+All+our+divines%2C+standing+for+the+certainty+of+the+perseverance+of+the+regenerated%2C+answer+Papists+and+Arminians+alleging+for+the+apostasy+of+the+saints%2C+the+example+of+the+regenerated+who+may+be+excommunicated%2C+that+excommunication+does+never+evince+%5Bprove%5D+that+the+person+excommunicated+is+out+of+the+state+of+grace%2C+but+only+that+he+has+fallen+into+a+scandalous+external+fact%2C+which+deserves+that+he+should+be+delivered+to+Satan%3B+and+that+one+may+be+a+member+of+the+visible+Church+and+converted+to+God%2C+who+is+excommunicated.+Lastly%E2%80%A6+But+the+believer+is+edified+thereby+%5Bby+excommunication%5D%2C+for+he+is+delivered+to+Satan+for+the+destruction+of+the+flesh%2C+that+the+spirit+may+be+saved+in+the+day+of+the+Lord%E2%80%A6+It+were+an+inconvenience+%5Bcontradiction%5D+to+deliver+a+%5Btrue%5D+member+of+Christ+to+Satan+morally%2C+as+1+Cor.+6%3A15.+This+is+%5Bwould+be%5D+a+sinful+deliverance%2C+when+one+is+given+over+to+Satan%2C+that+Satan+may+work+in+him+as+in+his+work-house+and+as+in+a+child+of+disobedience%2C+Eph.+2%3A2%3B+a+converted+soul+cannot+thus+be+delivered+to+Satan%3B+and+this+%5Bformer+conception%5D+we+abhor+to+write+no+less+than+Robinson+%5Bwho+had+opposed+it+as+an+objection%5D.+But+to+deliver+to+Satan+penally%2C+as+to+a+penal+torturer+who+works+sorrow+and+fear+in+the+conscience+for+sin%2C+to+humble+the+offender%2C+and+to+save+his+spirit+in+the+day+of+Christ%2C+is+neither+horror+by+word+nor+by+writ%2C+but+%5Brather+it+is%5D+the+Word+of+God%2C+1+Cor.+5%3A5.+%E2%80%A6+%E2%80%A6and+Field%2C+%E2%80%98Excommunication+does+not+wholly%E2%80%99+%28saith+he%29+%E2%80%98cut+off+men+from+the+visible+Church%3B%E2%80%99+and+his+reason+is+good%2C+because+they+may+and+often+do+retain%2C+first%2C+the+profession+of+pure+truth%3B+secondly%2C+the+character+of+baptism%3B+thirdly%2C+they+profess+obedience+to+their+pastors%3B+fourthly%2C+they+will+not+join+to+any+other+communion.+And+therefore+to+say+with+our+%5BIndependent%5D+Author%2C+we+dare+not%2C+to+wit%3A+%E2%80%98That+though+the+seed+of+faith+may+remain+in+the+excommunicated+person%3B+yet+to+the+society+of+the+faithful+joined+in+a+particular+visible+Church%2C+they+are+not+knit%2C+but+wholly+cut+off+from+their+communion.+Also%2C+he+is+delivered+unto+Satan%2C+and+therefore+wholly+cut+off+from+the+communion+of+the+Church%3B+and+so+from+the+seals%2C+he+and+his+seed%2C+as+heathen+and+heathen%E2%80%99s+seed+are.%E2%80%99+%E2%80%A6So+we+are+to+condemn+these+who+are+more+rigorous+toward+such+as+are+excommunicated+than+Christ+is%3A+for+Christ+keeps+them+as+sick+children+within+his+visible+Church+and+uses+Satan+as+the+physician%E2%80%99s+servant%2C+who+%5Bthe+physician%5D+boils+herbs+and+dresses+drugs+for+them%2C+while+he+%5Bthe+servant%5D%2C+by+God%E2%80%99s+permission%2C+torments+his+spirit+with+the+conscience+of+sin.+As+when+a+child+is+sick+%28says+worthy+Cartwright%29+the+father+calls+a+college+of+physicians+to+consult+about+medicine+to+be+given+to+the+child.+So+is+the+contumacious+person+under+the+medicine+of+excommunication+administered+by+the+Church-presbytery.+Now+this+we+cannot+say+of+heathen+and+publicans.+And+therefore+Augustine+says+excellently%2C+excommunicated+persons+non+esse+ethnicos%2C+sed+tanquam+ethnicos%3B+%E2%80%98are+not+heathen%2C+but+esteemed+as+heathen%2C%E2%80%99+%28ch.+6%29+and+Chrysostom+says+the+same+in+sense.+Yea%2C+I+gather+this+necessary+distinction+out+of+the+Fathers%2C+as+Chrysostom%2C+Theophylactus%2C+Hilarius%2C+that+they+are+not+members+of+the+visible+Church+actu+pleno%2C+in+a+full+act%2C+because+they+want+external+communion+with+the+Church%2C+yet+actu+imperfecto%2C+imperfectly+they+are+members.+A+second+distinction+I+collect+from+Ireneus%2C+Gregorius%2C+Hieronim.%2C+Optatus%2C+Augustine%2C+that+they+are+exclusi+ab+ecclesia+quoad+communionem%2C+non+ab+ecclesia+ipsa.+%E2%80%98They+are+excluded+from+the+visible+communion+of+the+Church%2C+rather+than+from+the+Church.%E2%80%99+A+third+distinction+may+be+drawn+from+Eugenius%2C+Chrysostom%2C+Gregory+Nazianzen%2C+while+they+call+baptism%2C+januam+spiritualem%2C+and+lavacrum+animae%2C+the+door+of+our+entry+to+the+Church+%28for+which+cause+papists%2C+though+fondly%2C+place+their+font+at+the+Church-door%29+as+the+lavator+of+the+soul.+So+as+excommunicated+persons+are+within+the+door+of+the+visible+Church%2C+though+not+admitted+to+the+King%E2%80%99s+table.+4.+The+schoolmen+do+allow+to+the+excommunicated+persons%2C+jus%2C+non+consortium%3B+%E2%80%98%5Ba%5D+right%2C+but+not+fellowship.%E2%80%99+5.+Turrecremaeta%2C+Vega.%2C+Soto%2C+Canus%2C+insinuat+distinctionem+inter+partes+et+membra+Ecclesiae+visibilis%2C+because+of+some+external+communion+that+they+have%2C+as+teeth+are+parts+of+the+body+in+a+new+born+infant%2C+but+they+are+not+members%3B+but+they+deny+them+to+be+members+because+they+are+cut+off.+6.+Suarez+excellently%2C+privantur+quoad+communicationemcum+aliis+membris%2C+non+quoad+esse+membri.+%E2%80%98They+are+deprived+according+to+the+act+of+communion+with+other+members%2C+not+as+if+they+ceased+to+be+members%3B%E2%80%99+as+a+member+which+cannot+receive+nourishment+is+yet+still+a+member.+Our+divines+from+Scripture+make+three+degrees+of+excommunication%3A+1.+A+debarring+from+the+Lord%E2%80%99s+Supper%2C+Mt.+5%3A24%2C+but+it+is+not+indeed+a+delivering+to+Satan+or+excommunication%3A+this+is+called+the+lesser+excommunication.+2.+A+delivering+to+Satan%2C+the+greater+excommunication%2C+1+Cor.+5%3A3-4%2C+of+this+we+speak+here+especially.+3.+Maranatha+in+the+Syriac+an+is+utter+cursing+till+Christ%E2%80%99s+second+coming.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries%E2%80%A6+%281644%29+%7C+pt.+1%2C+ch.+9%2C+section+9%2C+pp.+272-283&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F85ab1eda9d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/85ab1eda9d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-excommunication/#:~:text=2nd%20Conclusion%3A%20Excommunicated%20persons%20though%20they,utter%20cursing%20till%20Christ%E2%80%99s%20second%20coming&amp;text=2nd%20Conclusion%3A%20Excommunicated%20persons%20though%20they%20be%20debarred&amp;text=an%20is%20utter%20cursing%20till%20Christ%E2%80%99s%20second%20coming" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

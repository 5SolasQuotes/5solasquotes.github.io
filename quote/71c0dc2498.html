<blockquote><p>In 1834 one of the Belfast newspapers contained the following announcement of the opening of a new covenanting meeting-house in the town. The newspaper was Anglican and politically conservative in outlook, yet it recognised the liberality of the Covenanters:

The new Meeting-house of the Second Congregation of the Reformed Presbyterians, commonly called Covenanters, lately erected in South College-street, in this town, is to be opened for public worship, on Sunday next, at two o’clock afternoon. The congregation, although small, have very spiritedly contributed nearly one-half the cost of the building of this plain, but very neat place of worship. It is not, we believe generally known that the Covenanters support their own poor, and they also very liberally contribute to works of general benevolence. They receive no aid from Government to assist in paying their Clergymen. […]</p></blockquote>

<blockquote><p>…if the laws of the Church obliged the conscience in such a [absolute] manner, as that the transgression of them were a sin, the observance of them would then be a good action… …the persons against whom I dispute, pretend the violation of ecclesiastical laws to be therefore only sinful, because it implies an infraction of the law of God, who has commanded us to obey the Church: but if not to do what the Church enjoins be to violate the law of God, must it not be allowed, that to comply with her injunctions, is to observe the same divine law, and consequently to perform a good and virtuous act?… Lastly, if ecclesiastical laws obliged the conscience, the Church would only have changed her yoke by the establishment of Christianity: she would still continue a slave; and the only difference would be, that whereas under the [Mosaic] Law her servitude was terminated with respect to God, she would now be in bondage to men… …ever since the Reformation, it has been a particular controversy between the Romanists and us, whether ecclesiastical laws oblige the conscience, in other cases besides those of contempt and scandal. The Church of Rome has declared for the affirmative; and Protestant authors, as well Lutherans as Calvinists, for the negative. If any question this, let them give themselves the trouble of reading Bellarmine De Bonis Operibus [Of Good Works], particularly book 2, ch. 7 [‘Ecclesiastical Law Obliges the Faithful in Conscience…’], and the Brothers of Valemborch, tome 1, p. 183; tome 2, p. 187, among the papists; and among those of our communion, the supplement to Chamier, p. 375; Rivet’s Summary of Controversies [in French], tract 2, question 9 [‘Whether the Church may Make Laws?’]; [Jean] Mestrezat, Of the Church, Theses of Salmur, tome 1, disputation 1 [‘Whether Conscience to the Faith is Prior to that of the Church, or that to the Church is Prior to that of the Faith?’]. But this is not all, the Confession of Faith, published by the Reformed Churches of France, is express to the same purpose; see Article 33. So that if I have gone too far in this respect, I have all the Protestant Churches for my vouchers.</p></blockquote>

<blockquote><p>For what purpose, then, does the Reformed Presbyterian Church exist? And what is the advantage of having a Theological Hall in connection with our Church? If we wish only to be Christian in our profession and position as a Church, why not join, or allow ourselves to be absorbed by, some of the Christian Churches around us? Our reply is, We occupy a separate position as a church because we desire, we trust sincerely, to realise a fully Christian ideal of universal subjection to Christ our King on our part, and to extend the knowledge and appreciation of that ideal among the churches around us. We could not join any one of these churches without doing that which would be, from our point of view, equivalent to disobeying some of the Commandments of Christ, or opposing or disregarding some part of His authoritative revelation, and so coming short of the Christian ideal. Not that we charge any of the churches with deliberate or conscious disobedience; but that we find, in point of fact, that some of the most important principles of Christ’s truth – notably the principle of His rightful dominion as Mediator over the Church and over the nation – are allowed to fall into abeyance or into oblivion, at least in all the larger Evangelical Churches.

Passing, in the meantime, the principle of Christ’s absolute authority in His Church – a principle which is being constantly violated by the introduction of audacious inventions of man into Divine worship, and by the pushing of Christ’s own authoritative institutions into a corner – and looking at the principle of His Headship over the nation, we may conclude, without any tedious process of reasoning, that the church which sees Christ’s law set aside by the nation, and His authority rejected, and His Kingly rights trampled in the mire with disdain by every petty enemy, the church that admits and even argues for the principle that enemies of Christ have a right to be constituent members in that society in which God has declared that Christ has a right to be the Head, and in which therefore the will of Christ is the supreme and ultimate authority – the church that sees this monstrous wrong done to Christ, and stands by for generations without uttering one word of fearless denunciation, and without doing one single deed the object of which is to bring the nation back to the throne of Christ in dutiful allegiance, has not, in this respect at least, a broad or intelligent or conscientious conception of Christian duty.

We need, therefore, to maintain our denominational position that we may continue to utter a clear and faithful testimony for Christ the King, and to utter it all the more clearly and faithfully as others continue to become more careless about the fearful rebellion of the nation against Him, or to become more impatient of the restraints of our testimony against their criminal neglect. And as our Church must continue to exist, our Theological Hall must exist, not only that the doctrines of Evangelical Christianity generally may be taught and embraced, but also that the candidates for the ministry on leaving the Hall may go forth under the solemn and joyful conviction that Christ is “King of kings and Lord of lords,” and that minister is the King’s ambassador to be guided by the King’s will, and to labour for the world-wide acknowledgment of the King’s reign.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The authority of Christ over the individual, the church, and the</cite>, nation (Belfast, 1893), pp 4-5.</span></figcaption>

<blockquote><p>Thirdly, the Scripture intimates this difference between ministry and magistracy, that the work of the ministry and the administrations thereof are performed in the name of Jesus Christ, as Mediator and King of the Church: the work of the magistracy not so… Now let our opposites show (if they can) where they find in Scripture that the Christian magistrate is to rule in the name of Christ, to judge in the name of Christ, to make laws in the name of Christ, to make war or peace in the name of Christ, to punish evil-doers with the temporal sword in the name of Christ. Of the ministry I did show that in the name of the Lord Jesus Christ we do assemble ourselves together, Mt. 18:20, in his name do we preach, Lk. 24:47; Acts 4:17-18; 5:28,44; 9:27, in his name do we baptize, Acts 2:38, 8:16; 19:5, in his name do we excommunicate, 1 Cor. 5:5… … A minister of Christ does both preach and baptize in the name of Christ, as Mediator, that is, vice Christi [in the place of Christ], in Christ’s stead, and having authority for that effect from Christ, as Mediator; for Christ, as Mediator, gave us our comission to preach and baptize… So that to preach and baptize epi to onomati Iesou Christou (which we find both of preaching, Lk. 24:47, and of baptizing, Acts 2:38) comprehends a formal commission, power and auhority, given and derived from Christ. … The ministers of Christ do act in the name of Christ, that is, in the name, authority, room and place of Christ: We are ambassadors for Christ, and we preach in Christ’s stead, 2 Cor. 5:20. This… makes good my argument. Why did he [Mr. Hussey, an Erastian] not show us the like concerning magistracy? I suppose he would, if he could…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, (1646), bk. 2, ch. 7, pp. 109-112</span></figcaption>

<blockquote><p>I know that even by some of the Fathers these two places, to wit, Eph. 4:11-12 and 1 Tim. 3:2 with 8, are adduced for the same end [for bishops]: because, in the first place, the apostle reckons out both extraordinary and ordinary preaching-officers, without making any mention of bishops: which could not be, if they were not the same with pastors that are named, as Ambrose on the place asserts.</p></blockquote>

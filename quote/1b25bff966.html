<main class="wrap"><figure class="quote" id="q-1b25bff966" data-kw="">
<blockquote><p>Here someone will ask whether the apostle was right to say that because you have been baptized you have put on Christ, when it is clear that there are all kinds of people who have been baptized but who are strangers to the grace and Spirit of Christ, like Simon Magus for example, whom nobody would claim had ever really put on Christ.

Those who are baptized put on Christ in a sacramental way, but only those who go beyond the sacrament and put him on in actual fact are real Christians. Undoubtedly there were many Galatians who had not really put him on but had only made a profession of Christianity and been sacramentally baptized. Paul was right to say that whoever has been baptized has put on Christ, as long as you understand this in a sacramental sense. This sacramental way of speaking is common in Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolas Apostoli Pauli ad Galatas et Ephesios Commentarii</cite>, (Basel, 1561). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 128.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

Those who are baptized put on Christ in a sacramental way, but only those who go beyond the sacrament and put him on in actual fact are real Christians. Undoubtedly there were many Galatians who had not really put him on but had only made a profession of Christianity and been sacramentally baptized. Paul was right to say that whoever has been baptized has put on Christ, as long as you understand this in a sacramental sense. This sacramental way of speaking is common in Scripture.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b75d15c2e8" data-kw="">
<blockquote><p>This [the promise of the covenant] however by no means implies that all the children of pious parents should be regarded as ordained to salvation by the divine appointment. For it is manifest, both from the indubitable records of the sacred volume and the examples there placed beyond controversy, and from the experience of everyday life, that not infrequently the offspring of the best of men grow up with the worst dispositions, wickedly bent upon their own destruction. Still God has given that pledge to pious parents that they may regard their little ones as the children of God by gracious adoption, until, when further advanced, they betray themselves by indications to the contrary, and that they may feel not less secure regarding their children dying in infancy than did Abraham and Isaac of old.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant</cite>, (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), pp 127-28.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-e4c1b32671" data-kw="">
<blockquote><p>There is no question between us and the Mennonites as to whether the infants of unbelievers, or of those who are outside of the covenant of God, are to be baptized? For to these, both we and they deny baptism. But the question is, whether the infants of those who are in the covenant, or one of whose parents is in the covenant, are to be baptized?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-van-hoeke.html">Peter van Hoeke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lord’s Day 27, Inquiry 74, ‘Whether Infants are to be Baptized Also?’</cite>, p. 310 in Studies in the Palatinate Catechism (Leiden, 1711) See also the first of the three arguments on the same page that he gives to prove the reformed position. As translated in Krauth, p. 33.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-768377af7b" data-kw="">
<blockquote><p>XI. (7) Because the fathers acknowledged the necessity of infant baptism and approved its propriety by their practice. Justin Martyr mentions it (“Quaestiones et Responsiones ad Orthodoxos,” Q. 56 in Opera quae feruntur omnia [ed. J.C.T. de Otto, 1881], v. 3, Pt. 2, p. 81); cf. Origen (Commentariorum in Epistolam … ad Romanos 5.8 [PG 14.1037–42]), Cyprian (Letter 58, “To Fidus” [ANF 5:353–54]), Jerome (Against the Pelagians 3.18 [NPNF2, 6:482]), Cyril of Alexandria (Glaphyrorum in Leviticum [PG 69.558–62]). Augustine, often, where he relates that the Pelagians had not dared to deny the baptism of infants because they saw too clearly that this would place them in opposition to the whole church (The Literal Meaning of Genesis 10.23 [ACW 42:127]; On Original Sin 2.44 [40] [NPNF1, 5:253–54]; On Forgiveness of Sins and Baptism 1.35 [25*] [NPNF1, 5:30]). The same thing was confirmed also by many decrees of Synods: of Carthage, in the year 418* (Hefele, 2:458); of Mileve, in the year 402* (cf. Canon 5, Hefele, 2:429); of Gerunda in the year 517* (cf. Canon 5, Hefele, 4:105) and of others which Pamelius in his notes to Cyprian notices (“Epistola LXIV,” Opera [1682], pp. 158–60).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–1997), 19.20.11 (p. 418).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

<main class="wrap"><figure class="quote" id="q-18b55f64a1" data-kw="providence decree execution">
<blockquote><p>Providence can be viewed either in the antecedent decree or in the subsequent execution. The former is the eternal destination of all things to their ends; the latter is the temporal government of all things according to that decree. The former is an immanent act in God; the latter is a transitive action out of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 6.1.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-in-general.html">Providence in General</a> › <a href="../topics/providence/providence-in-general/against-epicureans-and-chance.html">Against Epicureans and chance</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8fb05937d5" data-kw="Wisdom">
<blockquote><p>Who can trace the motions of God&#x27;s eyes in their race? &#x27;He makes the clouds his chariot,&#x27; Ps. 104:3, in his motions about the earth, and his throne is in the dark. He walks upon the wings of the wind, his providential speed makes it too quick for our understanding. His ways are mysterious, and put the reason and wisdom of men to a stand. The clearest-sighted servants of God do not see the bottom of his works, the motion of God&#x27;s eyes is too quick for ours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite>, Discourse on 2 Chron. 16:9, Doct. 1, Prop. 2</span></figcaption>

</figure><figure class="quote" id="q-ca480713e5" data-kw="">
<blockquote><p>Providence without the word is a dark enigma. None can solve it. The best commentary on Providence is the Bible. The best commentary on the Bible is Providence. The events of a godly man&#x27;s life are to him the fulfillings of the Scriptures. In a thousand ways they teach him the true sense of promises and threatenings, predictions and narratives, precepts and doctrines. They mightily confirm his belief of the truth.</p></blockquote>

</figure><figure class="quote" id="q-9116ca8fe1" data-kw="all things providence">
<blockquote><p>We believe that all things without exception are under divine providence: whether heavenly or sublunary, great or small, necessary and natural or free and contingent. Thus nothing in the nature of things can be granted or happen which does not depend upon it. God created all things, therefore he also takes care of all things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 6.3.1–2</span></figcaption>

</figure><figure class="quote" id="q-c3a4da0f42" data-kw="providence wisdom">
<blockquote><p>That there is a Providence. The wisdom of God would not be so perspicuous, were there not a providence in the world. It is eminent in the creation, but more illustrious in the government of the creatures. A musician discovers more skill in the touching an instrument, and ordering the strings, to sound what notes he pleaseth, than he doth in the first framing and making of it. All God’s providences are but his touch of the strings of this great instrument of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite>, Discourse on Divine Providence</span></figcaption>

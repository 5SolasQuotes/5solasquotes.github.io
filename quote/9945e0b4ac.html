<main class="wrap"><figure class="quote" id="q-9945e0b4ac" data-kw="">
<blockquote><p>The analogical use of terms is crucial to understanding God’s knowledge properly in another respect. I have spoken of various concepts and propositions existing in the divine intellect, but they cannot exist there in exactly the same sense in which they exist in our intellects. For in our intellects they exist as distinct thoughts, and there cannot be any such distinctions in God consistent with his simplicity. To a first approximation, we might think instead in terms of a conjunction of all propositions, and say that there is in the divine intellect something like a single thought with this one gigantic conjunctive proposition as its content. But even that cannot be quite right, because this single conjunctive proposition will itself have component parts. A better, though still imperfect, way to understand the nature of God’s knowledge would be to think in terms of analogies like the following. From a beam of white light, various beams of colored light can be derived by passing it through a prism. Though the colors are not separated out until the beam reaches the prism, they are still in the white light in a unified way. From a lump of dough, cookies of various shapes can be derived by means of cookie cutters. Though the various cookies with their particular shapes are not separated out until the cutters are applied to the dough, they are still in the uncut dough virtually. Now, God is pure actuality, whereas each kind of created thing represents a different way in which actuality might be limited by potentiality. That is to say, each created thing is comparable to one of the different specific colors that might be derived from the white light that contains all of them, or is like one of the many cookie shapes which might be derived from the dough which contains all of them. God’s creation of the world is thus like the passing of white light through a prism or the application of the cutters to the dough. The prism draws out, from the color spectrum which is contained in a unified way in the white light, a particular beam of this color and a particular beam of that color; and the cutters draw out, from the variety of possible cookies contained in a unified way in the lump of dough, a cookie of this particular shape and a cookie of that particular shape… Now, just as if you knew the white light perfectly, you would know all the colors which could be derived from it, and if you knew the lump of dough perfectly, you would know all the shapes which might be carved out of it, so too, perfectly to know that which is pure actuality would entail knowing all the various limited ways of being actual which might be derived from it. And that is how God knows all the various kinds of finitely actual things which exist or might exist—by virtue of perfectly knowing himself as that which is pure or unlimited actuality. That is not to say that his knowledge is exactly like that of someone who grasps the nature of white light or of dough, but it is analogous to that. And even if the analogy is imperfect, that is, as I have said, only to be expected given how very far beyond its ordinary sphere of operation reason has to push itself when seeking ultimate explanations.</p></blockquote>

<blockquote><p>…engages the recent critics and addresses one of their major concerns: that the doctrine of divine simplicity is not a biblical teaching. By analyzing the use of Scripture by key theologians from the early church to Karl Barth, Barrett finds that divine simplicity developed in order to respond to theological errors (e.g., Eunomianism) and to avoid misreading Scripture. Through close attention to Scripture, the work also argues that divine simplicity has two biblical roots: the names of God and the indivisible operations of the Trinity ad extra [outside of Himself]… divine simplicity can be rearticulated by following a formal analogy from the doctrine of the Trinity–the analogia diversitatis (analogy of diversity)–in which the divine attributes are identical to the divine essence but are not identical to each other.</p></blockquote>

<blockquote><p>This thesis presents a case for the traditional doctrine of divine simplicity by construing it along the lines that God exists as actus purus. My formulation of divine simplicity draws upon the medieval insight that God is what He is in virtue of what He does in one, eternal act of will with which He is identical. In chapter I, I survey the contemporary literature on divine simplicity. In chapter II, I critique Alvin Plantinga’s Platonic theory of the divine attributes… In chapter III, I provide rejoinders to all of Plantinga’s defeaters against divine simplicity… In chapter IV, I develop a viable theory of divine simplicity, given an actus purus conception of God, and I formulate a number of arguments supporting it… As such, I seek to demonstrate that the traditional understanding of the divine essence is something that is worthy for theists to embrace and to explore…</p></blockquote>

</figure><figure class="quote" id="q-697e2aa704" data-kw="">
<blockquote><p>This thesis offers a constructive account of the doctrine of divine simplicity in Christian theology. In its methodology, the thesis aims to present this divine perfection as an implicate of the scriptural portrayal of God, to draw upon the insights and conceptual resources of Thomas Aquinas and various Reformed orthodox theologians, and to respond to some objections to divine simplicity…. The case for God’s simplicity is made by examining God’s singularity, aseity, immutability, infinity, and act of creation in Holy Scripture and then tracing the ways in which these descriptions of God imply that he is (negatively) not composed of parts. Rather, he is (positively) actus purus and really identical with his own essence, existence, and attributes, each of which is identical with the whole being of the triune God considered under some aspect. In light of the constructive work, this study then addresses the three most pressing objections to divine simplicity: (1) that it denigrates God’s revelation of his many attributes in the economy; (2) that it eliminates God’s freedom in creating the world and acting in history; and (3) that it does not cohere with the doctrine of the Trinity.</p></blockquote>

</figure><figure class="quote" id="q-ed007f0056" data-kw="">
<blockquote><p>The argument of this thesis is that the explanatory power of the doctrine of divine simplicity has significant ramifications on our understanding of other doctrines of God. I argue that these ramifications can be seen in four distinct theological areas: the doctrine of divine aseity, the doctrine of divine immutability, God’s relationship with moral goodness, and in perfect being theology.</p></blockquote>

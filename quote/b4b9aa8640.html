<main class="wrap"><figure class="quote" id="q-b4b9aa8640" data-kw="">
<blockquote><p>Christ intercedes for us, like the high priest, who, after he had offered the victim on the altar, carried its blood into the holy place, and there prayed for the people. The necessity of this intercession is sufficiently shown, not only because it was not enough to have purchased salvation, unless it were perpetually secured and applied; but also because we are not such characters as can draw near to God of ourselves, and therefore have need of a most influential advocate to plead our cause before God, against the continual accusation of the devil.

But when we say that Christ intercedes, we must not imagine that he falls down at the feet of his Father, or uses any prostration of his body, as a suppliant; for this idea is inconsistent with the glorified state and kingly authority, which he possesses both in heaven and in earth. It simply means, if I may so express it, Christ’s continual appearance in heaven before the Father; for the Father cannot look upon him without being appeased; and thus his appearance is equivalent to intercession, and has the same effect, as if Christ were to fall before his Father covered and stained with his own blood, and display before him his wounds and scars; thus the blood of Abel is said to have spoken or cried out.

It may denote, also, his unchangeable purpose of saving his elect, and also his presentation of our persons and prayers for acceptance before God; thus he is represented as the “angel with the golden censer and incense to be offered with the prayers of the saints,” (Rev. viii. 3.) Now this intercession is opposed to the twofold accusation, which the devil, “the accuser,” brings against us, and which our own sins bring against us, provoking the anger of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 6.15, pp 318-19.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/necessity-of-satisfaction.html">Necessity of Satisfaction</a></span></div>

</figure><figure class="quote" id="q-d9efed039d" data-kw="debt enmity crime satisfaction">
<blockquote><p>First, sin, which renders us guilty and hated of God and binds us over as debtors to punishment, may be viewed under a threefold relation either as a debt, which we are bound to pay to divine justice, in which sense the law is called “a handwriting”; or as enmity, inasmuch as it makes us enemies to God and God to us; or as a crime, on account of which we are exposed to condemnation and death. Corresponding to these, satisfaction ought to be a payment of debt, a reconciliation with God, and a propitiatory covering of the crime.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.10.6</span></figcaption>

</figure><figure class="quote" id="q-17b927d42a" data-kw="">
<blockquote><p>The idea from which the reference to “the many” arises, however, is a very different one: Christ did not die for a few but for many, for a large multitude. He gives his life as a ransom for many; he sheds his blood for many; he will make many righteous. It is not a handful but many who by one man’s obedience will be made righteous [Rom. 5:19]. Scripture is not afraid that too many people will be saved. Therefore, based on that same consideration, it says that God has no pleasure in the death of the wicked and that he wants all humans to repent and be saved, that Christ is the expiation of and has given his life for the world, and that the gospel must be preached to all creatures. But when universalists deduce from this that the atonement is completely universal, they run afoul of both Scripture and reality, for the two seem to vie with each other in teaching that not all but only many learn of the gospel and attain genuine repentance. In all these passages, therefore, we are encountering not “the will of God’s good pleasure,” which is unknown to us and neither can nor may be the rule for our conduct, nor an “antecedent will,” which is anterior to the decision of our will and oriented to it, but the “revealed will,” which tells us by what standard we are to conduct ourselves in the new covenant. It gives us the right and lays on us the duty to bring the gospel to all people without exception. For the universal offer of grace we need no other ground than this clearly revealed will of God. We no more need to know specifically for whom Christ died than we need to know specifically who has been ordained to eternal life. The calling indeed rests on a particular basis, for it belongs to and proceeds from the covenant, but it is addressed—in keeping with God’s revealed will and with the inherently all-sufficient value of Christ’s sacrifice—also to those who are outside the covenant in order that they too may be incorporated into that covenant and in faith itself receive the evidence of their election. In the second place, Scripture implies that the sacrifice and intercession of Christ, hence also the acquisition and application of salvation, are inseparably connected. The sacrifice is the basis for Christ’s intercession; the scope of the latter, accordingly, is as extensive as that of the former. Limborch therefore recognizes that “the intercession is not an act distinct from the sacrifice in and of itself insofar as it [the intercession] is accomplished in heaven.” If then the intercession is particular, as it is (John 17:9, 24; Rom. 8:34; Heb. 7:25; 1 John 2:1–2), so is the sacrifice. Limborch, opposing this position, indeed cites Luke 23:34, but Jesus prays here not for the salvation of his enemies but only for the nonimputation of the appalling crime that they, in their ignorance, were committing when they crucified the Messiah. There is similarly an inseparable connection between the acquisition and the application of salvation. All the benefits of the covenant of grace are linked (Rom. 8:28–34) and find their ground in the death of Christ (Rom. 5:8–11). Atonement in Christ carries with it salvation and blessedness. For Christ is the head and believers are his body, a body that receives its growth from him (Eph. 4:16; Col. 2:19). He is the cornerstone, and we are the building (Eph. 2:20–21). He is the firstborn, and we are his brothers (Rom. 8:29). Believers, accordingly, have objectively died, been crucified, buried, raised, and seated in the heavens with and in him. That is, the church is not an accidental and arbitrary aggregate of individuals that can just as easily be smaller or larger, but forms with him an organic whole that is included in him as the second Adam, just as the whole of humankind arises from the first Adam. The application of salvation must therefore extend just as far as its acquisition. The application is comprehended in it and is its necessary development. This, for that matter, is true in the nature of the case. If Jesus is truly the Savior, he must also really save his people, not potentially but really and in fact, completely and eternally. And this, actually, constitutes the core of the difference between the proponents and the opponents of particular satisfaction (atonement).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, Vol. 3: Sin and Salvation in Christ, trans. John Bolt and John Vriend (Baker Academic, 2006), 466.</span></figcaption>

ted into that covenant and in faith itself receive the evidence of their election. In the second place, Scripture implies that the sacrifice and intercession of Christ, hence also the acquisition and application of salvation, are inseparably connected. The sacrifice is the basis for Christ’s intercession; the scope of the latter, accordingly, is as extensive as that of the former. Limborch therefore recognizes that “the intercession is not an act distinct from the sacrifice in and of itself insofar as it [the intercession] is accomplished in heaven.” If then the intercession is particular, as it is (John 17:9, 24; Rom. 8:34; Heb. 7:25; 1 John 2:1–2), so is the sacrifice. Limborch, opposing this position, indeed cites Luke 23:34, but Jesus prays here not for the salvation of his enemies but only for the nonimputation of the appalling crime that they, in their ignorance, were committing when they crucified the Messiah. There is similarly an inseparable connection between the acquisition and the application of salvation. All the benefits of the covenant of grace are linked (Rom. 8:28–34) and find their ground in the death of Christ (Rom. 5:8–11). Atonement in Christ carries with it salvation and blessedness. For Christ is the head and believers are his body, a body that receives its growth from him (Eph. 4:16; Col. 2:19). He is the cornerstone, and we are the building (Eph. 2:20–21). He is the firstborn, and we are his brothers (Rom. 8:29). Believers, accordingly, have objectively died, been crucified, buried, raised, and seated in the heavens with and in him. That is, the church is not an accidental and arbitrary aggregate of individuals that can just as easily be smaller or larger, but forms with him an organic whole that is included in him as the second Adam, just as the whole of humankind arises from the first Adam. The application of salvation must therefore extend just as far as its acquisition. The application is comprehended in it and is its necessary development. This, for that matter, is true in the nature of the case. If Jesus is truly the Savior, he must also really save his people, not potentially but really and in fact, completely and eternally. And this, actually, constitutes the core of the difference between the proponents and the opponents of particular satisfaction (atonement).”

— Herman Bavinck, Reformed Dogmatics: God and Creation, Vol. 3: Sin and Salvation in Christ, trans. John Bolt and John Vriend (Baker Academic, 2006), 466.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+idea+from+which+the+reference+to+%E2%80%9Cthe+many%E2%80%9D+arises%2C+however%2C+is+a+very+different+one%3A+Christ+did+not+die+for+a+few+but+for+many%2C+for+a+large+multitude.+He+gives+his+life+as+a+ransom+for+many%3B+he+sheds+his+blood+for+many%3B+he+will+make+many+righteous.+It+is+not+a+handful+but+many+who+by+one+man%E2%80%99s+obedience+will+be+made+righteous+%5BRom.+5%3A19%5D.+Scripture+is+not+afraid+that+too+many+people+will+be+saved.+Therefore%2C+based+on+that+same+consideration%2C+it+says+that+God+has+no+pleasure+in+the+death+of+the+wicked+and+that+he+wants+all+humans+to+repent+and+be+saved%2C+that+Christ+is+the+expiation+of+and+has+given+his+life+for+the+world%2C+and+that+the+gospel+must+be+preached+to+all+creatures.+But+when+universalists+deduce+from+this+that+the+atonement+is+completely+universal%2C+they+run+afoul+of+both+Scripture+and+reality%2C+for+the+two+seem+to+vie+with+each+other+in+teaching+that+not+all+but+only+many+learn+of+the+gospel+and+attain+genuine+repentance.+In+all+these+passages%2C+therefore%2C+we+are+encountering+not+%E2%80%9Cthe+will+of+God%E2%80%99s+good+pleasure%2C%E2%80%9D+which+is+unknown+to+us+and+neither+can+nor+may+be+the+rule+for+our+conduct%2C+nor+an+%E2%80%9Cantecedent+will%2C%E2%80%9D+which+is+anterior+to+the+decision+of+our+will+and+oriented+to+it%2C+but+the+%E2%80%9Crevealed+will%2C%E2%80%9D+which+tells+us+by+what+standard+we+are+to+conduct+ourselves+in+the+new+covenant.+It+gives+us+the+right+and+lays+on+us+the+duty+to+bring+the+gospel+to+all+people+without+exception.+For+the+universal+offer+of+grace+we+need+no+other+ground+than+this+clearly+revealed+will+of+God.+We+no+more+need+to+know+specifically+for+whom+Christ+died+than+we+need+to+know+specifically+who+has+been+ordained+to+eternal+life.+The+calling+indeed+rests+on+a+particular+basis%2C+for+it+belongs+to+and+proceeds+from+the+covenant%2C+but+it+is+addressed%E2%80%94in+keeping+with+God%E2%80%99s+revealed+will+and+with+the+inherently+all-sufficient+value+of+Christ%E2%80%99s+sacrifice%E2%80%94also+to+those+who+are+outside+the+covenant+in+order+that+they+too+may+be+incorporated+into+that+covenant+and+in+faith+itself+receive+the+evidence+of+their+election.+In+the+second+place%2C+Scripture+implies+that+the+sacrifice+and+intercession+of+Christ%2C+hence+also+the+acquisition+and+application+of+salvation%2C+are+inseparably+connected.+The+sacrifice+is+the+basis+for+Christ%E2%80%99s+intercession%3B+the+scope+of+the+latter%2C+accordingly%2C+is+as+extensive+as+that+of+the+former.+Limborch+therefore+recognizes+that+%E2%80%9Cthe+intercession+is+not+an+act+distinct+from+the+sacrifice+in+and+of+itself+insofar+as+it+%5Bthe+intercession%5D+is+accomplished+in+heaven.%E2%80%9D+If+then+the+intercession+is+particular%2C+as+it+is+%28John+17%3A9%2C+24%3B+Rom.+8%3A34%3B+Heb.+7%3A25%3B+1+John+2%3A1%E2%80%932%29%2C+so+is+the+sacrifice.+Limborch%2C+opposing+this+position%2C+indeed+cites+Luke+23%3A34%2C+but+Jesus+prays+here+not+for+the+salvation+of+his+enemies+but+only+for+the+nonimputation+of+the+appalling+crime+that+they%2C+in+their+ignorance%2C+were+committing+when+they+crucified+the+Messiah.+There+is+similarly+an+inseparable+connection+between+the+acquisition+and+the+application+of+salvation.+All+the+benefits+of+the+covenant+of+grace+are+linked+%28Rom.+8%3A28%E2%80%9334%29+and+find+their+ground+in+the+death+of+Christ+%28Rom.+5%3A8%E2%80%9311%29.+Atonement+in+Christ+carries+with+it+salvation+and+blessedness.+For+Christ+is+the+head+and+believers+are+his+body%2C+a+body+that+receives+its+growth+from+him+%28Eph.+4%3A16%3B+Col.+2%3A19%29.+He+is+the+cornerstone%2C+and+we+are+the+building+%28Eph.+2%3A20%E2%80%9321%29.+He+is+the+firstborn%2C+and+we+are+his+brothers+%28Rom.+8%3A29%29.+Believers%2C+accordingly%2C+have+objectively+died%2C+been+crucified%2C+buried%2C+raised%2C+and+seated+in+the+heavens+with+and+in+him.+That+is%2C+the+church+is+not+an+accidental+and+arbitrary+aggregate+of+individuals+that+can+just+as+easily+be+smaller+or+larger%2C+but+forms+with+him+an+organic+whole+that+is+included+in+him+as+the+second+Adam%2C+just+as+the+whole+of+humankind+arises+from+the+first+Adam.+The+application+of+salvation+must+therefore+extend+just+as+far+as+its+acquisition.+The+application+is+comprehended+in+it+and+is+its+necessary+development.+This%2C+for+that+matter%2C+is+true+in+the+nature+of+the+case.+If+Jesus+is+truly+the+Savior%2C+he+must+also+really+save+his+people%2C+not+potentially+but+really+and+in+fact%2C+completely+and+eternally.+And+this%2C+actually%2C+constitutes+the+core+of+the+difference+between+the+proponents+and+the+opponents+of+particular+satisfaction+%28atonement%29.%E2%80%9D%0A%0A%E2%80%94+Herman+Bavinck%2C+Reformed+Dogmatics%3A+God+and+Creation%2C+Vol.+3%3A+Sin+and+Salvation+in+Christ%2C+trans.+John+Bolt+and+John+Vriend+%28Baker+Academic%2C+2006%29%2C+466.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F17b927d42a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/17b927d42a.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/12/bavinck-christs-intercession-acquisition-and-application-are-inseparably-linked/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

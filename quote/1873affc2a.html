<main class="wrap"><figure class="quote" id="q-1873affc2a" data-kw="">
<blockquote><p>Application 1: This may first let us see that notwithstanding the reformation of religion, Christ may be pleased rather to live abroad in the fields than at home, where the people would willingly assemble: The house of God was now repaired, and the bed green: and the Church invites Christ to come in unto her, in it, yet He disposes Himself so, as more willing to call her abroad. So we may see that notwithstanding the purity and simplicity of Christ’s worship, yet Christ is not bound to any place; if things were never so reformed, yet He might leave us, and go into the wild field. Rome has long doted on Peter’s Chair, and Jerusalem might as well have bragged of her privileges as any other place, but Christ leaves them: Never rest we then in any outward estate, for Christ may leave us. The Palatinate [Germany] has been as reformed as any Church for doctrine, and though they might say, their bed was green, and their beams were of cedar, and their rafters of fir, yet God has left them: for do we think that if God had been there, these things had befallen them that now are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canticles, or Song of Songs, Opened &amp; Explained</cite>, … (London, 1642), ch. 2, pp. 60-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

ener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d29fc826aa" data-kw="">
<blockquote><p>Let every one of you, brethren, give thanks to God in his own order, living in all good conscience, with becoming gravity, and not going beyond the rule of the ministry prescribed to him. Not in every place, brethren, are the daily sacrifices offered, or the peace-offerings, or the sin-offerings and the trespass-offerings, but in Jerusalem only. And even there they are not offered in any place, but only at the altar before the temple, that which is offered being first carefully examined by the high priest and the ministers already mentioned. Those, therefore, who do anything beyond that which is agreeable to His will, are punished with death [Lev. 10]. You see, brethren, that the greater the knowledge that has been vouchsafed to us, the greater also is the danger to which we are exposed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/clement-of-rome.html">Clement of Rome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistle to the Corinthians</cite>, ch. 41</span></figcaption>

</figure><figure class="quote" id="q-90f0823318" data-kw="">
<blockquote><p>Relationships and behaviors are manipulated by very powerful unspoken rules. These rules are seldom, if ever, said out loud. In fact, when spoken out loud many of them sound ridiculous. No one says out loud, ‘What people think about us is more important than what is really happening.’ Yet the unspoken rules communicate these and other shaming messages. The ‘can’t-talk’ rule keeps people quiet by labeling them as the problem if they notice and confront a problem. Because people feel they cannot talk about an unspoken rule, they learn to talk in ‘code’ to convey what they mean. Coding is an example of verbal manipulation… Messages are sent through a verbal code that others are supposed to decode… ‘Don’t you think it would be better this way?’ means, ‘I want you to do it this way.’ People also code non-verbally with body language–by giving dirty looks, becoming loud or quiet, or leaving the room in a sullen or disconnected attitude. Triangling is another way to act manipulative in relationships. This simply means to send a message to someone through another person instead of delivering it directly. The effects [are]: Great ‘radar’–the ability to pick up tensions in situations and relationships; ability to decode the crooked messages of others; saying things in code instead of saying them straight; talking about people instead of to them; message-carrying for people; expecting others to know your code; difficulty trusting people; reading other meanings into what people say.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/unwritten-rules.html">David Johnson &amp; Jeff VanVonderen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Subtle Power of Spiritual Abuse</cite>, pp. 56-57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

F%2F5solasquotes.github.io%2Fquote%2F90f0823318.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/90f0823318.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cults/#:~:text=Relationships%20and%20behaviors%20are%20manipulated%20by,other%20meanings%20into%20what%20people%20say&amp;text=Relationships%20and%20behaviors%20are%20manipulated%20by%20very%20powerful&amp;text=people%3B%20reading%20other%20meanings%20into%20what%20people%20say" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-27b9fb99a7" data-kw="">
<blockquote><p>There is a twofold worship due only to God, internal and external.… Internal, which consists in the acts of the soul and actions answerable thereto. When the mind is most taken up with an object, and the heart and affections most set upon it, this is soul worship, and this is due only to God.… Now according to this distinction of worship there are two sorts of idolatry, 1. Open, outward idolatry.… 2. Secret and soul idolatry, when the mind and heart is set upon anything more than God; when anything is more valued, more intended; anything more trusted, more loved, or our endeavours more for any other thing than God. Then is that soul worship, which is due only to God … given to other things besides him. And this is as true, as heinous idolatry, as the former, though not so open, discernible, nor so much observed.… Secret idolaters shall have no inheritance in the kingdom of God. Soul idolatry will exclude men out of heaven as well as open idolatry. He that serves his lusts is as uncapable of heaven as he that serves, worships idols of wood or stone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Soul Idolatry Excludes Men Out of Heaven</cite>, on Eph. 5:5 (definition of soul idolatry)</span></figcaption>

</figure><figure class="quote" id="q-3cab06c2d2" data-kw="">
<blockquote><p>Religion needs not any such ornaments, except men would make the worship of God, when naked [as Adam &amp; Eve were in the Garden in purity], under shame, and so under sin (for Justice married shame and sin once). But as roses, lillies, the sun, and other glorious creatures, are most beautiful without garments, and not capable of shame; so is the worship of God.</p></blockquote>

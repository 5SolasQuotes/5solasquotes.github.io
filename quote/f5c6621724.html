<blockquote><p>2. The anger, then, which in the Scripture is assigned to God, we say denotes two things: (1.) His vindictive justice, or constant and immutable will of rendering vengeance for sin.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-973f800a2f" data-kw="">
<blockquote><p>The will of God is also to be viewed in the light of the various ‘affections’ attributed to God. these ‘affections’ are, in man, termed emotions or passions and are associated with human weakness and mutability. In relation to God, however, the ‘affections’: ‘do not designate any passions or emotions, nor are to be understood as diverse divine wills, for this would imply mutation in God, but as acts of the same will, indicating its different relations.’ (Pictet, Theol. chr. I.vii.1) Of course, the immutability of God, like his being unmoved, describes a God who is also actus purus [pure act]: thus neither concept indicates a divine immobility or quiescence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD (Baker, 2003), vol. 3, pt. 2, ch. 5.4, D. The ad intra Distinctions</cite>, p. 454</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

</figure><figure class="quote" id="q-aa620be825" data-kw="">
<blockquote><p>[4] Having proved that these relations have no real existence in God, and yet are predicated of Him, it follows that they are attributed to Him solely in accordance with our manner of understanding, from the fact that other things are referred to Him. For in understanding one thing to be referred to another, our intellect simultaneously grasps the relation of the latter to it, although sometimes that thing is not really related. [5] And so it is evident, also, that such relations are not said of God in the same way as other things predicated of Him. For all other things, such as wisdom and will, express His essence; the aforesaid relations by no means do so really, but only as regards our way of understanding. Nevertheless, our understanding is not fallacious. For, from the very fact that our intellect understands that the relations of the divine effects are terminated in God Himself, it predicates certain things of Him relatively; so also do we understand and express the knowable relatively, from the fact that knowledge is referred to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Contra Gentiles, Bk. 2, On Creation | 13-14. ‘How the aforesaid relations are predicated of God’</cite></span></figcaption>

</figure><figure class="quote" id="q-c55ca8094d" data-kw="">
<blockquote><p>The last of God’s attributes which I shall now mention is his Dreadfulness or Terribleness, to those that are the objects of his wrath. This is the result of his other attributes, especially of his Holiness, and Governing Justice, and Truth in his comminations [threats].</p></blockquote>

</figure><figure class="quote" id="q-e045783a1b" data-kw="">
<blockquote><p>18. Wrath signifies in God the just will to avenge an injury done or thought to Himself or his Church, Jn. 3:36; Rom. 1:18; 2:5. 19. It is attributed to Him not except as an anthropopathism to Himself; it denotes merely an effect, not an affection. … 24. Hatred also is in no way in God as a passion [or as something suffered], but rather this signifies three things: 1. a negation, or subtraction of the grace and benevolence of Himself by which He is compassionate on others and loves them unto eternal life; 2. the detestation of the hateful thing; 3. the decree to punish, and its execution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-tilenus.html">Daniel Tilenus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Ordered Arrangement of Theological Disputations held in the Academy of Sedan, vol. 1 (1607)</cite>, p. 119-20</span></figcaption>

<main class="wrap"><figure class="quote" id="q-4e54975829" data-kw="">
<blockquote><p>Thus you see, what sweet Communion a soul may have with God in the way of his Providences. O that you would thus walk with him! How much of Heaven might be found on Earth this way! And certainly, it will never repent the Lord he hath done you good, when his mercies produce such effects upon your hearts: he will say of every savour thus improved, It was well bestowed, and will rejoyce over you to do you good for ever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Conduct, or the Mystery of Providence</cite>, London, 1678, p. 167</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e2cf359f99" data-kw="Affliction Submission">
<blockquote><p>How kind is God in wisely and mercifully deciding so many things for us! The man who fears God and loves his little daughter, would esteem it a greater affliction to be called on to say when his child should be sick—than he now finds it to nurse her through weeks of disease, close her eyes in death, and then carry her to the grave. God very mercifully bears the heaviest part of all our trials, by marking out our course for us. God is governor. We are servants. To us belong obedience, submission, acquiescence. It is not ours to guide, to decide what is best, to rule the world, to shape the course of events.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-s-plumer.html">William S. Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jehovah-Jireh: A Treatise on Providence</cite>, ch. “The Mysteries of God’s Providence”</span></figcaption>

</figure><figure class="quote" id="q-9c2ff7740d" data-kw="Sovereignty Wisdom Comfort">
<blockquote><p>Our God is not only infinite in power. He is infinite in wisdom and goodness too. And herein is the preciousness of this truth. God wills only that which is good and His will is irreversible and irresistible! God is too wise to err and too loving to cause His child a needless tear. Therefore if God be perfect wisdom and perfect goodness how blessed is the assurance that everything is in His hand and molded by His will according to His eternal purpose!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sovereignty of God</cite>, ch. 12, “The Value of This Doctrine” (6. It supplies comfort in sorrow)</span></figcaption>

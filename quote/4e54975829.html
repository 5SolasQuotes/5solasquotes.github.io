<main class="wrap"><figure class="quote" id="q-4e54975829" data-kw="">
<blockquote><p>And thus you see, what sweet Communion a soul may have with God in the way of his Providences. O that you would thus walk with him! How much of Heaven might be found on Earth this way! And certainly, it will never repent the Lord he hath done you good, when his mercies produce such effects upon your hearts: he will say of every savour thus improved, It was well bestowed, and will rejoyce over you to do you good for ever.</p></blockquote>

<blockquote><p>But men are his especial care. He provides the food of their bodies, and in a peculiar way watches and rules over their souls and lives. This he does with respect to the wicked as well as the good. His care extends to individuals, to families, to nations, and throughout the world. It appears not in great events only, but in those exceeding small, even to the numbering of the hairs of each one&#x27;s head.</p></blockquote>

<blockquote><p>God leaves the sinner so far as he sees meet to the swing of his own lusts, and denies him restraining grace. … And when the restraint is taken off the sinner, he runs furiously, to evil. 3. God bounds sin, and restrains men in their sins, as he does the raging sea, allowing it to go so far, but no further.</p></blockquote>

</figure><figure class="quote" id="q-ba0d123cd8" data-kw="Affliction Love">
<blockquote><p>Affliction is the expression of paternal love. It is from the deepest recess of the fountain of love that sorrow flows down to us. And love cannot wrong us. It blesses, but cannot curse. Its utterances and actions are all of peace and gladness. It wants a larger vessel into which to empty itself, and a deeper channel through which to flow. That is all. It seeks to make us more susceptible of kindness, and then to pour that kindness in. Yes, love is the true, the one origin of the sharpest stroke that ever fell upon a bleeding heart. The truth is, there is no other way of accounting for affliction but this. Anger will not account for it, forgetfulness will not account for it, chance will not account for it. No. It is simply impossible to trace it to any cause but love. Admit this as its spring, and all is harmonious, comely, perfect. Deny it, and all is confusion, cruelty, and darkness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horatius-bonar.html">Horatius Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Night of Weeping</cite>, ch. XIV, “The Consolation,”</span></figcaption>

</figure><figure class="quote" id="q-940c6385f9" data-kw="Affliction Wisdom">
<blockquote><p>It is the discipline of wisdom. He who administers it is the &quot;God only wise.&quot; What deep wisdom then must there be in all His dealings! He knows exactly what we need and how to supply it. He knows what evils are to be found in us, and how these may be best removed. His training is no random work. It is carried on with exquisite skill. The time and the way and the instrument are all according to the perfect wisdom of God. The fittest time is chosen, just the very moment when discipline is called for, and when it would be most profitable. The surest, most direct, and at the same time gentlest method is devised. The instrument which will be surest yet safest, most effectual yet least painful, is brought into operation. For all is wisdom in the discipline of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horatius-bonar.html">Horatius Bonar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Night of Weeping</cite>, ch. IV, “The Family Discipline,”</span></figcaption>

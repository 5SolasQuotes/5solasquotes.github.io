<blockquote><p>Neither have we departed from the doctrine of the Church, in that we teach that faith only justifies. For many of the ancient have used this form of words [though they also affirmed justification involves an inherent righteousness], as: Origen on Rom. 3: Dicit apostolus sufficere solius fidei justificationem, ita ut credens quis tantummodo justificetur, etiamsi nihil ab eo operis fuerit expletum. [The apostle says that the justification of faith alone is sufficient, so that a man is justified by believing alone, even if no work has been performed by him.] Hilary, can. 8. in Matthew: Fides sola justificat. [Faith alone justifies.] Basil, Homily on Humility: Haec est perfecta &amp; integra gloriatio in Deo, quando neque ob justitiam suam quis se iactat, sed novit quidem seipsum verae justitiae indigum, solâ autem fide in Christum justificatum. [This is perfect and complete boasting in God: when a person does not boast on account of his own righteousness, but knows himself indeed to be lacking true righteousness, and is justified by faith alone in Christ.] Ambrose on Rom. 3: Iustificati sunt gratis, quia nihil operantes, neque vicem reddentes, sola fide justificati sunt dono Dei. [They are justified freely, because, doing nothing and rendering nothing in return, they are justified by faith alone, by the gift of God.] Chrysostom, Homily on Faith and the Law of Nature: Eum qui operatur opera iustitiae sine fide non potes probare vivum esse, fidem absque operibus possum monstrare, et vixisse, et regnum coelorum assecutam, nullus sine fide vitam habuit, latro autem credidit tantum, et iustificatus est. [You cannot prove that one who performs works of righteousness without faith is alive; but I can show that faith without works has both lived and attained the kingdom of Heaven. No one has had life without faith; but the thief believed only, and was justified.] Augustine bk. 1, Contra the Two Epistles of Pelagius, ch. 21 Quantaelibet fuisse virtutis antiquos praedices justos, non eos salvos fecit nisi fides mediatoris. [However great you may proclaim the virtue of the righteous of old to have been, it did not save them except the faith of the Mediator.] 83 Questions, q. 76 Si quis cum crediderit mox de hac vita decesserit, iustificatio fidei manet cum illo: nec praecedentibus bonis operibus, quia non merito ad illam, sed gratia pervenit, nec consequentibus, quia in hac vita esse non sinitur. [If anyone, after he has believed, immediately departs from this life, the justification of faith remains with him: not by preceding good works, because he attained to it not by merit but by grace; nor by subsequent works, because he is not permitted to remain in this life.] Theophylact, on Gal. 3: Nunc plane ostendit apostolus, fidem vel solam, iustificandi habere in se virtutem. [Now the apostle plainly shows that faith alone has within itself the power of justifying.] Bernard Sermon 22 on Canticles: Quisquis pro peccatis compunctus, esurit et sitit iustitiam, credat in te qui iustificas impium, at solam iustificatus per fidem, pacem habebitad te. [Whoever, pierced with sorrow for sins, hungers and thirsts for righteousness, let him believe in you who justifies the ungodly; and thus, justified by faith alone, he will have peace with you.] Epistle 77: Qui crediderit et baptizatus fuerit salvus erit. Caute, inquit, non repetiit, qui vero baptizatus non fuerit, condenabitur, sed tantum qui vero non crediderit, innuens nimirum solam fidem interdum sufficere ad salutem, et sine illa sufficere nihil. [He who has believed and has been baptized shall be saved. He carefully did not repeat, ‘but he who has not been baptized shall be condemned,’ but only, ‘he who has not believed,’ clearly indicating that faith alone sometimes suffices for salvation, and that without it nothing suffices.] Sometimes by these phrases of speech they exclude: [1] All that may be without supernatural knowledge, all that may be without a true profession. [2] Sometimes the necessity of good works in act or external good works.

3. The power of nature without illumination and grace.

4. The power of the Law.

5. The sufficiency of anything found in us to make us stand in judgment, to abide the trial, and not to fear condemnation. And in this sense faith only is said to justify, that is, the only mercy of God and merit of Christ apprehended by faith: and then the meaning of their speech is that only the persuasion and assured trust that they have, to be accepted of God for Christ’s sake, is that that makes them stand in judgment, without fear of condemnation. And in this sense all the divines formerly alleged for proof of the insufficiency of all our inherent righteousness, and the trust which we should have in the only mercy of God, and merit of Christ, do teach as we do, that faith only justifies. For neither they nor we exclude from the work of justification, [1] the action of God as the supreme and highest cause of our justification: for it is He that remits sin, and receives us to grace: [2] nor the merit of Christ, as that for which God inclines to show mercy to us, and to respect us: [3] nor the remission of sins, gracious acceptation, and grant of the gift of righteousness, as that by which we are formally justified: [4] nor those works of preventing grace, whereby out of the general apprehension of faith, God works in us dislike of our former condition, desire to be reconciled to God, to have remission of that [which] is past, and grace hereafter to decline the like evils, and to do contrary good things. For by these we are prepared, disposed and fitted for justification; without these none are justified. And in this sense, and to imply a necessity of these to be found in us, sometimes the Fathers and others say that we are not justified by faith only. And we all agree, that it is not our conversion to God, nor the change we find in ourselves, that can any way make us stand in judgment without fear, and look for any good from God, otherwise than in that we find ourselves so disposed and fitted, as is necessary for justification, whence we assure ourselves God will in mercy accept us for Christ’s sake.</p></blockquote>

ved.+He+carefully+did+not+repeat%2C+%E2%80%98but+he+who+has+not+been+baptized+shall+be+condemned%2C%E2%80%99+but+only%2C+%E2%80%98he+who+has+not+believed%2C%E2%80%99+clearly+indicating+that+faith+alone+sometimes+suffices+for+salvation%2C+and+that+without+it+nothing+suffices.%5D+Sometimes+by+these+phrases+of+speech+they+exclude%3A+%5B1%5D+All+that+may+be+without+supernatural+knowledge%2C+all+that+may+be+without+a+true+profession.+%5B2%5D+Sometimes+the+necessity+of+good+works+in+act+or+external+good+works.+3.+The+power+of+nature+without+illumination+and+grace.+4.+The+power+of+the+Law.+5.+The+sufficiency+of+anything+found+in+us+to+make+us+stand+in+judgment%2C+to+abide+the+trial%2C+and+not+to+fear+condemnation.+And+in+this+sense+faith+only+is+said+to+justify%2C+that+is%2C+the+only+mercy+of+God+and+merit+of+Christ+apprehended+by+faith%3A+and+then+the+meaning+of+their+speech+is+that+only+the+persuasion+and+assured+trust+that+they+have%2C+to+be+accepted+of+God+for+Christ%E2%80%99s+sake%2C+is+that+that+makes+them+stand+in+judgment%2C+without+fear+of+condemnation.+And+in+this+sense+all+the+divines+formerly+alleged+for+proof+of+the+insufficiency+of+all+our+inherent+righteousness%2C+and+the+trust+which+we+should+have+in+the+only+mercy+of+God%2C+and+merit+of+Christ%2C+do+teach+as+we+do%2C+that+faith+only+justifies.+For+neither+they+nor+we+exclude+from+the+work+of+justification%2C+%5B1%5D+the+action+of+God+as+the+supreme+and+highest+cause+of+our+justification%3A+for+it+is+He+that+remits+sin%2C+and+receives+us+to+grace%3A+%5B2%5D+nor+the+merit+of+Christ%2C+as+that+for+which+God+inclines+to+show+mercy+to+us%2C+and+to+respect+us%3A+%5B3%5D+nor+the+remission+of+sins%2C+gracious+acceptation%2C+and+grant+of+the+gift+of+righteousness%2C+as+that+by+which+we+are+formally+justified%3A+%5B4%5D+nor+those+works+of+preventing+grace%2C+whereby+out+of+the+general+apprehension+of+faith%2C+God+works+in+us+dislike+of+our+former+condition%2C+desire+to+be+reconciled+to+God%2C+to+have+remission+of+that+%5Bwhich%5D+is+past%2C+and+grace+hereafter+to+decline+the+like+evils%2C+and+to+do+contrary+good+things.+For+by+these+we+are+prepared%2C+disposed+and+fitted+for+justification%3B+without+these+none+are+justified.+And+in+this+sense%2C+and+to+imply+a+necessity+of+these+to+be+found+in+us%2C+sometimes+the+Fathers+and+others+say+that+we+are+not+justified+by+faith+only.+And+we+all+agree%2C+that+it+is+not+our+conversion+to+God%2C+nor+the+change+we+find+in+ourselves%2C+that+can+any+way+make+us+stand+in+judgment+without+fear%2C+and+look+for+any+good+from+God%2C+otherwise+than+in+that+we+find+ourselves+so+disposed+and+fitted%2C+as+is+necessary+for+justification%2C+whence+we+assure+ourselves+God+will+in+mercy+accept+us+for+Christ%E2%80%99s+sake.%E2%80%9D%0A%0A%E2%80%94+Richard+Field%2C+Other+citations+%28work+not+named%29%2C+Of+the+Church...+%28Oxford%3A+Turner%2C+1628%29%2C+bk.+3%2C+appendix%2C+ch.+11%2C+pp.+323-24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F16a6aa85d0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/16a6aa85d0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=Neither%20have%20we%20departed%20from%20the,mercy%20accept%20us%20for%20Christ%E2%80%99s%20sake&amp;text=Neither%20have%20we%20departed%20from%20the%20doctrine%20of&amp;text=will%20in%20mercy%20accept%20us%20for%20Christ%E2%80%99s%20sake" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2. The predicate [of the verse Rom. 6:7 is], ‘is freed from sin.’ The word [for “freed”] δεδικαιωται, the Vulgar [Vulgate] has, justificatus est a peccato [is justified from sin]: Beza, with many of the ancients, liberatus est [is liberated]. Our translation has both in the text, “freed,” in the margin, “justified”. Whether you take one or the other word, it imports deliverance from the yoke and dominion of sin, so as not to obey its motions and commands. For the apostle does not speak here of the forgiveness of sin, but the abolition of its power and dominion; for it is brought as a reason why those whose old man is crucified with Christ should not serve sin; and the word “justified” is the rather used, because one justified and absolved by his judge, is also released and set free from his bonds; so are we. …

I. The nature of this freedom from sin. I told you before, it is an exemption from the dominion and reign of sin.

      1. We quit the evil disposition and temper of our souls…

      2. We renounce our former course of living, after the habits we are free from the acts, we do not, and durst not to live in sin, the former conversation [conduct] is cast off as well as the former lusts… Now this freedom is expressed by a word that signifies justification, and fitly:

      1. Because of the nature of justification, in which there are two branches; liberatio a poena [liberation from punishment], and acceptatio ad vitam [acceptance to life]. The punishment incurred by the Fall is poena damni and poena sensus, the loss and the pain: Both may be considered as in this life, or the life to come… But in this life we must also consider the loss and pain. The pains are all those miseries and afflictive evils, which came into the world by reason of sin. The loss is loss of God’s image: that threatening, ‘Thou shalt die the death,’ Gen. 2:17, implied spiritual death as well as temporal and eternal. Now we are justified when we are freed from punishment, and among other punishments from the punishment of loss, when God giveth us the blessing, which sin had deprived us of: As for instance, when He gives us the sanctifying Spirit [Rom. 5:5], this is called a receiving the atonement, Rom. 5:11. We had forfeited it by sin, and God being pacified in Christ, does restore it to us. Man brought upon himself spiritual death by sin, and the gift of the sanctifying Spirit is the great and first act of God’s pardoning mercy, and a means to qualify us for other parts of pardon. Though the thing be plain of itself, yet to make it more clear to us:

      2. Let us distinguish of the kinds of justification. There is a twofold justification, it is either constitutive or executive. First, constitutive justification is by the new Covenant, when those who submit to the terms are constituted or made righteous: Jn. 5:24, ‘He that hears my word, and believes in Him that sent Me, has everlasting life, and shall not come into condemnation; but is passed from death to life.’ There is God’s grant, and whosoever can make good his claim, has a right to justification by God’s own grant, according to the law of grace, he is one freed from sin. Secondly, executive, when God accordingly takes off all penalties and evils, and gives us all the good which belongs to the righteous or justified: as in the case in hand, when God gives us the Spirit to break the power and reign of sin: And therefore so often in Scripture is God said to sanctify us as a God of peace, or as a God pacified and reconciled to us in Jesus Christ: Heb. 13:20-21, ‘Now the God of peace that brought again from the dead our Lord Jesus, that great Shepherd of the sheep, through the blood of the everlasting covenant, make you perfect in every good work to do his will, working in you that which is well-pleasing in his sight.’ 1 Thess. 5:23, ‘And the very God of peace sanctify ye wholly, etc.’ 2 Cor. 5:18, ‘And all things are of God, who hath reconciled us to Himself by Jesus Christ.’ This God does as a Judge, acting according to the rules of government constituted in the new Covenant, upon the account of the merit of Christ, and our actual interest in Him.

II. As to the degree, how far we are freed from sin.

      1. All the justified and converted to God are freed from the Reign of it. The flesh, though it remaineth, is made subject to the Spirit, which by degrees doth destroy the reliques of sin: For it is said of the justified, Rom. 8.1. There is no condemnation to them that are in Christ Jesus, who walk not after the flesh, but after the Spirit.

      2. The more obedient we are to the motions of the sanctifying Spirit, the more power we have against sin: Gal. 5.18. If ye be led by the Spirit, ye are not under the Law, under the irritating Power and Curse of it. Many sins are in a great measure left uncured as a part of our punishment. … 4. Where the work is really begun and duly submitted unto, we have hopes of a better estate, it still increases towards that perfect blessedness, when we shall be without spot and blemish, or any such thing, Eph. 5:27. What a life do God’s holy ones live in Heaven, who are wholly freed from sin?… There is none in Heaven by the first Covenant [of Words]; all that are there come thither as sanctified and justified by Jesus Christ, and in the way of his pardoning grace. Surely since we have the same Redeemer, depend upon the merit of the same sacrifice, and wait for the same Spirit in the use of all holy means and endeavours, He will not be strange to us… … IV. How is it a consequent of our dying with Christ?… … 2. It is his privilege, being crucified with Christ; he has a right, and not a right only, but his justification is executed and applied to him by the gift of the sanctifying Spirit, which is the surest token of God’s love, and the true effect of his approbation… … Use 1. To inform us of the intimate connection between all the parts and branches of the grace of the Gospel. We are absolved and discharged from the power of sin as well as from the guilt of it. All will grant that justification respects the guilt of sin; but the apostle tells us here that justification respects the power of sin also. The penalty was the loss of God’s image as well as of his favor: so that pardon is executed and applied when our natures are sanctified and healed. The privation of the Spirit being the great punishment, the gift of the Spirit is a great branch of our absolution, and so Christ’s reconciling and renewing grace fairly accord and agree.</p></blockquote>

+branches%3B+liberatio+a+poena+%5Bliberation+from+punishment%5D%2C+and+acceptatio+ad+vitam+%5Bacceptance+to+life%5D.+The+punishment+incurred+by+the+Fall+is+poena+damni+and+poena+sensus%2C+the+loss+and+the+pain%3A+Both+may+be+considered+as+in+this+life%2C+or+the+life+to+come%E2%80%A6+But+in+this+life+we+must+also+consider+the+loss+and+pain.+The+pains+are+all+those+miseries+and+afflictive+evils%2C+which+came+into+the+world+by+reason+of+sin.+The+loss+is+loss+of+God%E2%80%99s+image%3A+that+threatening%2C+%E2%80%98Thou+shalt+die+the+death%2C%E2%80%99+Gen.+2%3A17%2C+implied+spiritual+death+as+well+as+temporal+and+eternal.+Now+we+are+justified+when+we+are+freed+from+punishment%2C+and+among+other+punishments+from+the+punishment+of+loss%2C+when+God+giveth+us+the+blessing%2C+which+sin+had+deprived+us+of%3A+As+for+instance%2C+when+He+gives+us+the+sanctifying+Spirit+%5BRom.+5%3A5%5D%2C+this+is+called+a+receiving+the+atonement%2C+Rom.+5%3A11.+We+had+forfeited+it+by+sin%2C+and+God+being+pacified+in+Christ%2C+does+restore+it+to+us.+Man+brought+upon+himself+spiritual+death+by+sin%2C+and+the+gift+of+the+sanctifying+Spirit+is+the+great+and+first+act+of+God%E2%80%99s+pardoning+mercy%2C+and+a+means+to+qualify+us+for+other+parts+of+pardon.+Though+the+thing+be+plain+of+itself%2C+yet+to+make+it+more+clear+to+us%3A+2.+Let+us+distinguish+of+the+kinds+of+justification.+There+is+a+twofold+justification%2C+it+is+either+constitutive+or+executive.+First%2C+constitutive+justification+is+by+the+new+Covenant%2C+when+those+who+submit+to+the+terms+are+constituted+or+made+righteous%3A+Jn.+5%3A24%2C+%E2%80%98He+that+hears+my+word%2C+and+believes+in+Him+that+sent+Me%2C+has+everlasting+life%2C+and+shall+not+come+into+condemnation%3B+but+is+passed+from+death+to+life.%E2%80%99+There+is+God%E2%80%99s+grant%2C+and+whosoever+can+make+good+his+claim%2C+has+a+right+to+justification+by+God%E2%80%99s+own+grant%2C+according+to+the+law+of+grace%2C+he+is+one+freed+from+sin.+Secondly%2C+executive%2C+when+God+accordingly+takes+off+all+penalties+and+evils%2C+and+gives+us+all+the+good+which+belongs+to+the+righteous+or+justified%3A+as+in+the+case+in+hand%2C+when+God+gives+us+the+Spirit+to+break+the+power+and+reign+of+sin%3A+And+therefore+so+often+in+Scripture+is+God+said+to+sanctify+us+as+a+God+of+peace%2C+or+as+a+God+pacified+and+reconciled+to+us+in+Jesus+Christ%3A+Heb.+13%3A20-21%2C+%E2%80%98Now+the+God+of+peace+that+brought+again+from+the+dead+our+Lord+Jesus%2C+that+great+Shepherd+of+the+sheep%2C+through+the+blood+of+the+everlasting+covenant%2C+make+you+perfect+in+every+good+work+to+do+his+will%2C+working+in+you+that+which+is+well-pleasing+in+his+sight.%E2%80%99+1+Thess.+5%3A23%2C+%E2%80%98And+the+very+God+of+peace+sanctify+ye+wholly%2C+etc.%E2%80%99+2+Cor.+5%3A18%2C+%E2%80%98And+all+things+are+of+God%2C+who+hath+reconciled+us+to+Himself+by+Jesus+Christ.%E2%80%99+This+God+does+as+a+Judge%2C+acting+according+to+the+rules+of+government+constituted+in+the+new+Covenant%2C+upon+the+account+of+the+merit+of+Christ%2C+and+our+actual+interest+in+Him.+II.+As+to+the+degree%2C+how+far+we+are+freed+from+sin.+1.+All+the+justified+and+converted+to+God+are+freed+from+the+Reign+of+it.+The+flesh%2C+though+it+remaineth%2C+is+made+subject+to+the+Spirit%2C+which+by+degrees+doth+destroy+the+reliques+of+sin%3A+For+it+is+said+of+the+justified%2C+Rom.+8.1.+There+is+no+condemnation+to+them+that+are+in+Christ+Jesus%2C+who+walk+not+after+the+flesh%2C+but+after+the+Spirit.+2.+The+more+obedient+we+are+to+the+motions+of+the+sanctifying+Spirit%2C+the+more+power+we+have+against+sin%3A+Gal.+5.18.+If+ye+be+led+by+the+Spirit%2C+ye+are+not+under+the+Law%2C+under+the+irritating+Power+and+Curse+of+it.+Many+sins+are+in+a+great+measure+left+uncured+as+a+part+of+our+punishment.+%E2%80%A6+4.+Where+the+work+is+really+begun+and+duly+submitted+unto%2C+we+have+hopes+of+a+better+estate%2C+it+still+increases+towards+that+perfect+blessedness%2C+when+we+shall+be+without+spot+and+blemish%2C+or+any+such+thing%2C+Eph.+5%3A27.+What+a+life+do+God%E2%80%99s+holy+ones+live+in+Heaven%2C+who+are+wholly+freed+from+sin%3F%E2%80%A6+There+is+none+in+Heaven+by+the+first+Covenant+%5Bof+Words%5D%3B+all+that+are+there+come+thither+as+sanctified+and+justified+by+Jesus+Christ%2C+and+in+the+way+of+his+pardoning+grace.+Surely+since+we+have+the+same+Redeemer%2C+depend+upon+the+merit+of+the+same+sacrifice%2C+and+wait+for+the+same+Spirit+in+the+use+of+all+holy+means+and+endeavours%2C+He+will+not+be+strange+to+us%E2%80%A6+%E2%80%A6+IV.+How+is+it+a+consequent+of+our+dying+with+Christ%3F%E2%80%A6+%E2%80%A6+2.+It+is+his+privilege%2C+being+crucified+with+Christ%3B+he+has+a+right%2C+and+not+a+right+only%2C+but+his+justification+is+executed+and+applied+to+him+by+the+gift+of+the+sanctifying+Spirit%2C+which+is+the+surest+token+of+God%E2%80%99s+love%2C+and+the+true+effect+of+his+approbation%E2%80%A6+%E2%80%A6+Use+1.+To+inform+us+of+the+intimate+connection+between+all+the+parts+and+branches+of+the+grace+of+the+Gospel.+We+are+absolved+and+discharged+from+the+power+of+sin+as+well+as+from+the+guilt+of+it.+All+will+grant+that+justification+respects+the+guilt+of+sin%3B+but+the+apostle+tells+us+here+that+justification+respects+the+power+of+sin+also.+The+penalty+was+the+loss+of+God%E2%80%99s+image+as+well+as+of+his+favor%3A+so+that+pardon+is+executed+and+applied+when+our+natures+are+sanctified+and+healed.+The+privation+of+the+Spirit+being+the+great+punishment%2C+the+gift+of+the+Spirit+is+a+great+branch+of+our+absolution%2C+and+so+Christ%E2%80%99s+reconciling+and+renewing+grace+fairly+accord+and+agree.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+A+Second+Volume+of+Sermons+preached+by+the+late+reverend+and+learned+Thomas+Manton+in+two+parts%3A+the+first+containing+27+Sermons+on+the+Twenty-Fifth+chapter+of+St.+Matthew%2C+%E2%80%A6+%28d.+1677%3B+London%3A+Astwood%2C+1684%29+%7C+Sermons+on+Rom.+6%2C+Sermon+6%2C+pp.+36-41+on+Rom.+6%3A7%2C+%E2%80%9CFor+he+that+is+dead+is+freed+%5B%CE%B4%CE%B5%CE%B4%CE%B9%CE%BA%CE%B1%CE%B9%CF%89%CF%84%CE%B1%CE%B9%2C+justified%5D+from+sin.%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fae8014cdae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ae8014cdae.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=2.%20The%20predicate%20%5Bof%20the%20verse,renewing%20grace%20fairly%20accord%20and%20agree&amp;text=2.%20The%20predicate%20%5Bof%20the%20verse%20Rom.%206%3A7&amp;text=reconciling%20and%20renewing%20grace%20fairly%20accord%20and%20agree" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d0b3da53c9" data-kw="">
<blockquote><p>[On Rom. 4:25, which speaks of justification:] Since we are born in sins, and are able to do nothing of ourselves but offend God, we cannot be restored unless there be some one to make satisfaction for our sins, and also to breathe into us the Spirit of justice: both for these Christ has thoroughly accomplished… Let us always think… that, in the death of Christ, our sins have been expiated by his blood; in his resurrection, whereby He has entered on a heavenly life, and now lives to God… let us recognize that we are called to a life new and well-pleasing to God, and that He Himself will bestow that upon us.</p></blockquote>

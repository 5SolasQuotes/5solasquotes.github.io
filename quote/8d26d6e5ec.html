<main class="wrap"><figure class="quote" id="q-8d26d6e5ec" data-kw="">
<blockquote><p>…as many learned and conscionable divines deliver, our works of recreation, or sports which we find out, though at other times lawful, which take off the heart from holy duties; for God has found us another recreation; chiefly on that day, ‘if any will be merry, let him sing psalms’ (as in Ps. 92, The Title compared with the Psalm) and would have the Sabbath’s duties our delight.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-byfield.html">Richard Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath Vindicated</cite>, ... (London: Kyngston, 1631), ch. 14, p. 62 Byfield was a Westminster divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0ea1859a5e" data-kw="">
<blockquote><p>9. Yet in cases of necessity God has given great liberty unto us, to do many things for the preservation and comforts not only of the beasts and dumb creatures, but especially of man. Not only when he is weak and sick, but being healthful and strong, both in the works of our callings, and also of recreations, without which necessity we are persuaded that men ought ordinarily to cease from them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-bownd.html">Nicholas Bownd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sabbathum Veteris et Novi Testamenti</cite>, (Naphtali Press &amp; Reformation Heritage Books, 2015) | Author’s Preface, pp. 8–9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-de4b2f942e" data-kw="">
<blockquote><p>And Nehemiah, which is the Tirshatha, and Ezra the priest the scribe, and the Levites that taught the people, said unto all the people, ‘This day is holy unto the Lord your God; mourn not, nor weep.’ For all the people wept, when they heard the words of the law. Then he said unto them: ‘Go your way, eat the fat, and drink the sweet, and send portions unto them for whom nothing is prepared: for this day is holy unto our Lord: neither be ye sorry; for the joy of the Lord is your strength.’ So the Levites stilled all the people, saying, ‘Hold your peace, for the day is holy; neither be ye grieved.’ And all the people went their way to eat, and to drink, and to send portions, and to make great mirth, because they had understood the words that were declared unto them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neh., 8:9-12</cite></span></figcaption>

</figure><figure class="quote" id="q-b4356791e6" data-kw="">
<blockquote><p>[Rutherford’s] Answer: [William] Whittaker says indeed universal synods are not simply necessary ([On Scripture] Controversy 1, question 1, pp. 22-23); and [Matthew] Parker [an Anglican] says no more: they are not absolutely necessary, necessitate medii [by a necessity of means], but they are necessary, necessitate praecepti [by a necessity of precept], and conditionally, if some politic-union were amongst all national churches; But hence it follows not that they are not Christ’s ordinances, because they are not this way necessary, necessitate medii; for then baptism and the Lord’s Supper, public preaching of the Word, perfect discipline were not Christ’s ordinances, because in time of persecution, or universal apostasy, many, yea even whole Churches may be saved without these.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, ... (1642), pp. 214-215</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-264e9761c2" data-kw="">
<blockquote><p>For all kinds of bodily labors on the Lord’s day are unlawful, except they be referred to the sanctification of the Sabbath, as the means of it (Mt. 12:5), of which sort are the labors of the minister in the duties appertaining to his ministry, and of the people travailing to the places of God’s worship.</p></blockquote>

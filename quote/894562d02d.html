<main class="wrap"><figure class="quote" id="q-894562d02d" data-kw="">
<blockquote><p>There is no man in the world, never so great, but is a base person in comparison of a Christian. What will all ere be long? If a man be not in Christ, these things will add to our vexation. It will be a misery to have had happiness; the greater will be the misery when they must be parted withal. And therefore raise your hearts to consider of the excellent condition of a Christian when he is once the brother of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Heavenly Conference</cite>, (1654; Edinburgh: Banner of Truth, 2015), p. 48.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life.html">The Christian Life</a></span></div>

<blockquote><p>6th Rule. There is a principal obligation, a less principal, a least principal. Hence these three degrees issue from love: 1. God, 2. ourselves, 3. our neighbor. The love of God is most principal, and is the measure of the love of ourselves: the love of ourself is less principal than the love of God, and so the obligation [is] less. I am to make away, life and all things, yea, eternal glory as divided from holiness, and as it includes only happiness, rather ere I sin against God. The obligation to care for my own salvation is more principal than my obligation to care for the salvation of my brother: for the love of myself is the measure and rule of the love of my neighbor. Now because the obligation of caring for the soul of my brother is only secondary, in compare[ison] of the obligation of caring for my own salvation, I am not to sin myself, or sinfully to omit anything that is commanded me in a positive precept, to prevent the sin of my brother. Yet hence it does not follow that a positive precept is more excellent than the law of Nature, which is, ‘Thou shalt not murder,’ nor ‘scandalize him for whom Christ died.’ Because though to care for the soul of my brother be of the law of nature simpliciter, yet [it] is a secondary obligation, and may cease and yield to a stronger obligation that ties me more principally to care for my own soul; for though the command be positive, yet knowingly to sin by a sinful omission, is no less a destroying of my own soul, and so of the law of nature, in a higher obligation, than the other is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Appendix, pp. 83-84</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-be6ab46634" data-kw="">
<blockquote><p>As corn must not only be threshed out of the straw, but afterwards winnowed out of the chaff: so must a Papist turn not only from his popery, but from his profaneness: he must have Catholic for his name, and Christian for his surname: not only be no Papist, but a zealous Protestant: he must be of those valiant ones in Esay, [Isaiah] and of those violent ones in the Gospel, that take God’s kingdom by main force, as those do that take a strong castle, or a defenced city, or as the people of Israel invaded and surprised the promised land.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-trapp.html">John Trapp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theologia theologiæ, the true treasure, or, A treasury of holy truths, touching God’s word, and God the word. Digged up, and drawn out of that incomparable mine of unsearchable mystery, Heb. I. 1, 2, 3: wherein the divinity of the holy Scriptures is asserted, and applied</cite>, (London: George Badger, 1641), p. 30.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-74979e3bbe" data-kw="">
<blockquote><p>He that despaireth of the forgiveness of his sins, denieth GOD to be merciful, yea he denieth as much as lieth in him that GOD hath love, truth and power, in which three all my comfort consisteth, to wit, in the love of his adoption, in the truth of his promise, and in his power to perform. Let my foolish Cogitation then mutter what it listeth within me, saying, who art thou? or by what merit or worthiness doest thou hope to obtain such great glory? I comfortably will answer I know whom I have believed, and I am sure that in love he hath adopted mee to be his Child, that he is true in his promise, and powerful in performance. And these three so strengthen my heart, that no want of merit, no consideration of my own vileness, no greatness of the future blessedness can cast me down from the height of hope, wherein I am soundly rooted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Comfortable notes upon the books of Exodus and Leviticus, as before upon Genesis Gathered and laid down still in this plain manner, for the good of them that cannot use better helps, and yet are careful to read the Scriptures, and very desirous to find the comfort in them. … With a table of the prin</cite>, (London: Thomas Chard, 1604), p. 285.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>Of three kinds of liberty, and how servitude is agreeable to the Law of Nature. But here it will further be demanded, whether servitude be agreeable to the Law of nature, and how it comes to pass, that the Lord suffered the Israelites being a free people, to be servants one unto another. For the deciding of this doubt, there is a threefold kind of liberty to be considered, a natural liberty, civil, and spiritual. 1. The natural liberty I call that, wherein Adam was created, being subdued to no bondage, neither spiritual of sin, nor corporal in any outward subjection to any creature: but as he had a freedom of will, and was made Lord of his affections within, that he needed not to have sinned, unless he would himself: so he had the dominion of the creatures given unto him. This original liberty of nature considered, servitude and bondage was brought in as a punishment of sin, and so is not simply, and of itself agreeable to the Law of nature. 2. But now since Adam’s fall, there is another kind of civil liberty, and civil servitude opposite unto it. Civil liberty is defined to be a natural faculty, for every man to do as himself likes. . . unless one be hindered by force or in right; for that is no true liberty for a man against right, to do what him likes . . . Now this servitude simply accords not with nature, as the Apostle says, If yet thou mayest be free, use it rather, 1 Cor. 7.21. showing that every one by nature desires liberty and freedom. But after a sort this servitude is agreeable to nature, not simply, or of itself, but as other punishments are said to be natural, as tending to the maintenance of society among men which is properly natural. And if it be objected, why since all men are fallen in Adam, and so brought into subjection, why all likewise become not servants: the answer is, that two things must be considered in this our corrupt state: the one is the Law of corruption, brought in by sin, the other the goodness of God: that although all men are subject by sin to the same bondage and corruption, yet the goodness of God qualifies that slavish condition of nature, as that some do enjoy an outward liberty and freedom: like as in the inward faculties of the soul, the Lord gives unto some more light of understanding, dexterity of wit, profoundness of judgement, and other natural gifts, than unto others. 3. The spiritual liberty is wrought in us by grace in Christ, which is from the subjection of sin, and malediction of the Law; that our conscience is no more terrified with slavish fear, but we are at peace with God: and beside, by this spiritual liberty, the faithful have restored unto them the dominion over all creatures: that though not in external possession, yet in a spiritual right, all things are theirs, whether the world, life, death, things present or things to come, 1 Cor. 3.22. and all things work to the best, to those that love God, Rom. 8.28. So these may very well stand together, external servitude, and spiritual freedom: it is possible for one to bee a freeman to God, and yet a servant in the world, and another to be a bondman to sin, and yet free in the world: for there are divers objects of these two kinds of liberty and bondage; the outward freedom respects this life and state, the free use of riches, and pleasures of this life: the spiritual and internal freedom hath set before it the salvation of the soul, the favor of God, and life eternal. Christian religion then overthrows not the diversity of degrees among men: But as Christ, though he were by his spiritual right, free from all taxes and impositions, yet lest he should offend, payed poll money, Matt. 17. so Christians, though they are made free by faith in the Son, yet for the maintenance of peace and love, and avoiding of offence, in disturbing the temporal State, they are bound as well as others, to be subject unto the powers of this world[.]</p></blockquote>

<blockquote><p>It is agreed on by divines that servitude is a penal fruit of sin, and against nature. Institutt. de jure personarum, Sect. 1, and F. de statu hominum. I. libertas; because all men are born by nature of equal condition. … But to be a master, and to have a masterly and lordly power over slaves and servants is to make use of servants for the owner’s bener fit, not for the good of the slave (I. 2, de leg, I. Servus de servit. expert. Dance polit. I. 1, Tolossan. de Rep. I. 1, c. 1, n. 15, 16), therefore are servants bought and sold as goods (jure belli. F, de statu hominum I. et servorum). 2… not to be under a master as slaves are, is a blessing, seeing freedom is a blessing of God (John 8:33; Ex. 21:2, 26-27; Dt. 15:12); so he that kills Goliath (1 Sam. 17:25), his father’s house shall be free in Israel (Jer. 34:9; Acts 22:28; 1 Cor. 9:19; Gal, 4:26, 31)… 3. Subjects are called the servants of the king (1 Sam. 15:2; 2 Chron. 13:7; 1 Kings 12:7; Ex. 10:1-2; Ex. 9:20) but they are not slaves, because (Dt. 17:20) they are his brethren: “That the king’s heart be not lifted up against his brethren;” and his sons; (Isa. 49:23) and the Lord gave his people a king as a blessing, (1 Kings 10:9; Hos. 1:11; Isa. 1:26; Jer. 17:25), “and brought them out of the house of bondage,” (Ex. 20:2) as out of a place of misery… 4. The master might in some cases sell the servant for money, yea for his own gain he might do it (Neh. 5:8; Eccl. 2:7; 1 Kings 2:32; Gen. 9:25; Gen. 26:14; 2 Kings 4:1; Gen. 20:14, and might give away his servants; and the servants were the proper goods and riches of the master (Eccl. 2:7; Gen. 30:43; Gen. 20:14; Job 1:3, 15); but the king may not sell his kingdom or subjects, or give them away for money…</p></blockquote>

<blockquote><p>Assertion 1. As a man comes into the world a member of a politic society, he is, by consequence, born subject to the laws of that society… Assertion 2. Slavery of servants to lords or masters, such as were of old amongst the Jews, is not natural, but against nature: 1. Because slavery is malum naturae, a penal evil and contrary to nature, and a punishment of sin. 2. Slavery should not have been in the world if man had never sinned, no more than there could have been buying and selling of men, which is a miserable consequent of sin and a sort of death, when men are put to the toiling pains of the hireling, who longs for the shadow, and [are] under iron harrows and saws, and to hew wood, and draw water continually. 3. The original of servitude was when men were taken in war, to eschew a greater evil, even death, the captives were willing to undergo a less evil, slavery, (S. Servitus, 1 de jure. Pers.) 4. A man being created according to God’s image, he is res sacra, ‘a sacred thing,’ and can no more, by nature’s law, be sold and bought than a religious and sacred thing dedicated to God. Servitus, 1. Instit. de inutil. scrupl. I. inter Stipulantem. S. Sacram. F. de verber. Obligat.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Assertion 1. As a man comes into the world a member of a politic society, he is, by consequence, born subject to the laws of that society… Assertion 2. Slavery of servants to lords or masters, such as were of old amongst the Jews, is not natural, but against nature: 1. Because slavery is malum naturae, a penal evil and contrary to nature, and a punishment of sin. 2. Slavery should not have been in the world if man had never sinned, no more than there could have been buying and selling of men, which is a miserable consequent of sin and a sort of death, when men are put to the toiling pains of the hireling, who longs for the shadow, and [are] under iron harrows and saws, and to hew wood, and draw water continually. 3. The original of servitude was when men were taken in war, to eschew a greater evil, even death, the captives were willing to undergo a less evil, slavery, (S. Servitus, 1 de jure. Pers.) 4. A man being created according to God’s image, he is res sacra, ‘a sacred thing,’ and can no more, by nature’s law, be sold and bought than a religious and sacred thing dedicated to God. Servitus, 1. Instit. de inutil. scrupl. I. inter Stipulantem. S. Sacram. F. de verber. Obligat.”

<blockquote><p>Of the Anabaptists’ arguments against the authority of masters, and subjection of servants. … 2. Objection. It is against nature for one to be servant, especially a bond-servant to another. Answer. To grant that it is against that absolute and perfect nature wherein at first God created man, and that it came in by sin, yet is it not against that order and course of nature wherein God has now settled man. God has turned many punishments of sin to be bounden duties: as subjection of wife to husband and man’s eating bread in the sweat of his brow.</p></blockquote>

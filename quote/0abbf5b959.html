<main class="wrap"><figure class="quote" id="q-0abbf5b959" data-kw="Melchizedek true priesthood">
<blockquote><p>Hence it is gathered that this priesthood differs from the Levitical and is far more excellent; but it would be wrong to infer from this that his priesthood is improper and figurative. On the contrary, because it transcends the Levitical priesthood, it ought to be most proper and perfect, just as the priesthood of Melchizedek did not cease to be a true priesthood, although widely differing from the Levitical. (b) All priestly acts are ascribed to him—oblation and intercession (Heb. 7:27; 9:24; 10:7).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.8.5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-082f399509" data-kw="">
<blockquote><p>See the love of Christ, who laid not his bodily life down only, but his soul. ‘The redemption of the soul is precious,’ says the psalmist, Ps. 49:8: precious indeed, when it cost not his precious blood only, but his precious soul also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Christ the Mediator</cite>, bk. 5, ch. 14, “Uses of Christ’s Being Made Sin and a Curse for Us”</span></figcaption>

</figure><figure class="quote" id="q-34326e8cff" data-kw="">
<blockquote><p>God’s reconciliation to us must precede our reconciliation to him. This, as remarked above, is the great doctrine of the Bible. So long as we are under the wrath and curse of God, due to us for sin, we are aliens and enemies, cut off from his favor and fellowship, which are the life of the soul. Therefore until God’s wrath and curse are removed, there is no possibility of holiness and love. It is vain to attempt to secure the favor of God by being holy; we must enjoy his favor before we can be holy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Second Epistle to the Corinthians</cite>, on 5:18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/sacrifice-and-propitiation.html">Sacrifice and Propitiation</a> › <a href="../topics/priestly-office-satisfaction-and-atonement/sacrifice-and-propitiation/reconciliation.html">Reconciliation</a></span></div>

</figure><figure class="quote" id="q-a7f4afc517" data-kw="priesthood satisfaction intercession">
<blockquote><p>The priesthood of Christ is the function of the mediatorial office according to which he performs those things with God which must be performed for sinners; both by offering himself up once as a victim for them and by interceding for them always with the Father. The great excellence of this function appears from the fact that no mystery was either predicted by clearer prophecies or adumbrated by more frequent types.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.8.2</span></figcaption>

</figure><figure class="quote" id="q-750d639e01" data-kw="">
<blockquote><p>You will remember the multitude He has redeemed; not me alone, nor you alone, but “a multitude that no man can number,” which shall as far exceed the stars of heaven for number, as they exceed all mortal reckoning. Christ hath bought for Himself, some out of every kingdom, and nation, and tongue, under heaven; He hath redeemed from among men some of every rank, from the highest to the lowest; some of every colour—black and white; some of every standing in society, the best and the worst. For some of all sorts hath Jesus Christ given Himself a ransom that they might be redeemed unto Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Justification by Grace”</cite>, sermon on Rom. 3:24</span></figcaption>

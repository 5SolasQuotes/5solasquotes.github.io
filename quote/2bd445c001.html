<main class="wrap"><figure class="quote" id="q-2bd445c001" data-kw="">
<blockquote><p>3. If God reprove Samuel’s light for judging according to the eye, 1 Sam. 16:7, far more He rebukes his purpose to anoint a man without his Word, ‘Who giveth kingdoms to whom He pleaseth’: Yet Samuel had a good intention, and God’s Word in general, that one of Jesse’s sons should be king.

4. If that good purpose had remained with David deliberately to build the Lord’s house after the Lord had said Solomon, not David, must build the house, it would have been sinful; yet the reasons upon common equity, and a general warrant that God would have a house had been as good as before…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646) Westminster divine, p. 97</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-58aa8968f2" data-kw="">
<blockquote><p>The act of Perth [1618] about kneeling would draw some commendation to this ceremony [of kneeling before the sacrament], from those words of the Psalm, ‘O come let us worship and bow down. let us kneel before the Lord our maker.’ [Ps. 95:6] Which is as if one should argue thus: We may worship before the lord. Therefore, before a creature. We may kneel in an immediate worship of God, Therefore in a mediate. For who sees not, that the kneeling there spoken of is a kneeling in the action of solemn praise and joyful noise of singing unto the Lord?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 6, p. 96</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-ab0bb2d83a" data-kw="">
<blockquote><p>Hence, adoration is worship, but every worship is not adoration… all bodily worship or expression of our affection to the means of graces (though these means be but creatures) is not adoration properly, either of God, or of these means; it is lawful to tremble at the Word, and for Josiah to weep before the Book of the Law read, and for the martyrs to kiss the stake as the instrument by which they glorified God in dying for the truth; all these being objectam quo, and ‘means by the which’ they conveyed their worship to the true God, and natural and lawful expressions of their affection to God:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646) | Intro, pp. 88-89</span></figcaption>

<blockquote><p>Divine worship is any action or service that is immediately and directly performed unto God Himself, whether the true God or a false, whether commanded by divine authority, imposed by human, or assumed upon our own heads and pleasures. For in this latitude of sense is divine worship to be conceived, that it may comprehend under it both true and false worship.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-362c22aa28" data-kw="">
<blockquote><p>Scotus has well observed that the ultimate root of contingency is free will, for, in the system of absolute determinism, whatever happened would be necessary in its causes. It is plain that the opposite of something could only be when that something in fact comes to be if it depends immediately or at least mediately on a free cause, name on a cause that, when everything is given for acting that must be given, has it in its own power to act or not to act, or to act in this way or in some other way. Hence let a free cause be defined as a cause that in acting is undetermined either by anything outside itself and by its own nature as a being. Therefore, when all conditions outside it for acting are given, it has within it the power to act rather than not to act (liberty of contradictories), or to act in one rather than in another (liberty of contraries). So for us free cause is by definition the same as free will. A cause, therefore, that contingently causes is either such a free cause or is a non-free cause that truly depends for its existing or its causing on a free cause. So we can distinguish between a free cause and a contingently causing cause.¹ For even if a cause depends on a free first cause and thus is a contingent causer, it can be a non-free cause. Such a cause is even called by Scotus a natural cause or a cause that acts by way of nature; for any cause is a natural one that is determined by its nature to one way of acting when all necessary givens are given. It is also called a cause that is hypothetically or in a certain respect necessary. ¹ [Editor:] A cause is a contingently causing cause if it be able not to cause in the moment when it does in fact cause. As such it is opposed to a cause that causes necessarily.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), ch. 5, ‘On Contingent &amp; Necessary’ | Article 2, ‘On the Existence of the Contingent and of its Ultimate Cause’, p. 49</span></figcaption>

<blockquote><p>Edward Bagshaw, p. 18: ‘His own free-will has not the least power to receive the things of God.’ Richard Baxter:

1. What not sanctified free-will?

2. What! not a receiving obediential power? A receiving power is a passive power (as it is strictly taken). Has a free-agent less power to receive grace than a marble to receive the engraving of the workman? Does no man ever receive grace? Or do they receive what they cannot receive? Has a man no more receptive power than a block or stone? I know it’s said ‘The natural man receiveth not, etc.’, that is, understands not, believes not, and loves not in sensu composito [in a combined sense]: But its never said that, ‘Our free-will has not the least power to receive.&#x27;</p></blockquote>

<blockquote><p>Maresius… insists, the Reformed believe that the power of free choice is intrinsic to humanity… It is true that unlike irrational creatures, human beings are not naturally determined to just one course of action. They are free, in other words, from ‘physical necessity’. As a result, when human beings choose to do something under the influence of grace, they nonetheless retain a faculty within them which, were that grace withdrawn, would enable them to pursue another course of action. So if one considers free choice simply as a faculty, in isolation from all the natural and supernatural prerequisites for acting (the ‘divided sense’ [according to the created order]), it does indeed have both the inherent potential to accept or reject a given course of action (‘freedom of contradiction’)… … So for Maresius, free choice is incompatible with both physical necessity and the necessity of coercion: but it is compatible with other kinds of necessity. It is compatible, for example, with the necessity of dependence on God (Maresius 1646-48, 2:12). It is also compatible with ‘moral necessity’. That is the necessity which results from a human being’s moral character. Jesus’s moral character is such that He cannot sin; yet his goodness is still freely chosen. The moral character of the unregenerate is such that their acts are always sinful; yet their sin is still freely chosen (Maresisu 1646-48, 2:14). Free choice is equally compatible with the necessity brought about by the divine decree. Maresius calls this kind of necessity ‘hypothetical necessity’ or the ‘necessity of consequence’ (Maresius 1646-48, 2:15)… Maresius is seeking to preserve the fundamental contingency of human action… that choice is only necessary, given the divine decree–it is not inherently or absolutely necessary… for as Maresius underlines, ‘such is the faculty of the human will that, by its intrinsic constitution and nature, it is equally apt to choose an act plainly contrary to the one it actually chooses’ (Maresius 1646-48, 2:15).</p></blockquote>

<blockquote><p>The Disposition of Man to Grace l. Since the necessary conditions for salvation are impossible for the reprobates, God does not intend to give them salvation, conditionally if they believe and repent, unless one supposes that there is in God some vain, frustrated, and useless intention and will. 2. A good use of natural light, either subjective or objective, cannot lead man to salvation, nor obtain from God any other degree of light destined to salvation. Rejection of the error of those:

1. Who teach a universal and common call to all men to salvation and to the author of salvation, and that each and every man can believe and be saved if he wants.

2. Who teach that God, by his revealed will, wants the salvation of each and everyone.</p></blockquote>

<blockquote><p>If you mean that nature commands them, then God by the Law of nature commands them, and what greater authority can they have?</p></blockquote>

<blockquote><p>…there were no oblations [in the OT, such as free-will offerings] left wholly to the pleasure of men, for though the particulars were not, nor could not be determined by a distinct rule in general, yet they were determined by the circumstances, as our divines are wont to answer the Papists about their vows, counsels, superarrogations: ‘Not by a general law, but by concurrence of circumstances.’ So Dt. 16:10, Moses shows that the freest offerings were to be according as God had blessed them, from whence it follows it had been sin for any Israelite whom God had plentifully blessed to offer a pair of pigeons instead of a bullock, or two, upon his own mere pleasure:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, (Amsterdam: Thorp, 1633), Manuduction, ch. 12, section 2, pp. 152-53</span></figcaption>

</figure><figure class="quote" id="q-e1150b1a98" data-kw="">
<blockquote><p>These Judicial Laws were determinations of the Moral Law. A determination is either Iuris Divini [Divine law] or Humani [human]; these determinations in Moses’ Judicial Laws are Divini Juris; therefore they had greater force to bind the Jew, than any municpal law has to bind the subjects now, in respect they were given by God Himself, and these laws of men which draw nearest to them in equity, are most perfect; although particularly they cannot be fitted to every nation, no more than a shoe of one measure can serve for every foot. … Fourthly, the punishments inflicted by human laws are alterable: so were the punishments in Moses’ Judicial Law; therefore the Jews say of them, ascendunt et descendunt [ascending and desceding], which they understand, not of the greatest and highest transgressions, but of the middle sort of transgressions, which praecepta media, their middle precepts did forbid. Example, Ex. 21:29-36, If a man kept a pushing ox, knowing that he were wont [accustomed] to push, if he kill a man, then the Law ordains that the man shall die, or else to redeem himself with a sum of money; here the law ascended or descended: but if a man had willfully killed a man, that was praeceptum grave [a grave precept], the punishment neither ascended nor descended, but he was to die the death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Explication of the Judicial Laws of Moses</cite>, pp. 1-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

cial%20Laws%20were%20determinations%20of,he%20was%20to%20die%20the%20death&amp;text=These%20Judicial%20Laws%20were%20determinations%20of%20the%20Moral&amp;text=descended%2C%20but%20he%20was%20to%20die%20the%20death" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-dda84bdd5e" data-kw="">
<blockquote><p>4. Let it be remembered that those things we call morally good, [are those] which agree to right reason: those morally evill, which disagree from right reason: and those indifferent, which include nothing belonging to the order of reason, and so are neither consonant unto nor dissonant from the same. [The following shows that no rational action, and hence thing commanded, is simply indifferent, but must be good or bad to some degree, and hence to be done or not done; and if it is bad in any degree, it cannot be absolutely required.]

5. When we speak of the indifferency of an individual action, it may be conceived two ways, either absolute et sine respectu ad aliud [absolute and without respect to another], or, comparate et cum respectu ad aliud [comparatively and with respect to another]. In the free-will offrings, if so be a man offered according as God had blessed and prospered his estate, it was indifferent to offer either a bullock or a sheep, or a goat; but if he choosed to offer any of them, his action of offering could not be indifferent, but either good or evil. When we speak of the indifferency of an action comparate [comparatively], the sense is only this, that it is neither better not worse than another action, and that there is no reason to make us choose to do it more than another thing. But when we speak of the indifferency of an action, considered absolutely and by itself, the simple meaning is whether it be either good or evil, and whether the doing of the same must needs be either sin or evil doing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | pt. 4, ch. 3, p. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-0e86623615" data-kw="">
<blockquote><p>5. Where it is said [in the Westminster Confession of Faith], ch. 21, sect. 7, that: ‘by a positive, moral and perpetual commandment, binding all men in all ages, He has particularly appointed one day in seven for a Sabbath,’ I understand it only of a virtual obligation, as much as belongs to the Law, as enacted before promulgation, but not of a true actual obligation. For no law can bind till it is promulgated; and positives are not promulgated by nature; therefore not to all men in all ages; therefore they bind not all men in all ages.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Confession of his Faith</cite>, … (London: R.W., 1655), ch. 2, sect. 5</span></figcaption>

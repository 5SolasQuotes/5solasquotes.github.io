<main class="wrap"><figure class="quote" id="q-58b8619aac" data-kw="">
<blockquote><p>36. The three divine essential principles [Life of God, his intellect and will], related to the creature, ad extra, are denominated: 1. His Omnipotence, 2. His Omniscience or knowledge of them, 3. His Volition and love of them. He who is Potentissimus [most powerful], perfectly powerful in act, in Himself, is denominated omnipotent, because He can do all things ad extra which belong to power. And he who is Intellectus se intelligens [the intellect understanding Himself] ad intra, is denominated omniscient or knowing all creatures, from the exterior objects. And he who is Voluntas se volens [the will willing itself], or Amor se amans [love loving itself] ad intra, is also denominated willing of exterior things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology (London: White, 1675)</cite>, sect. 4, ‘Of God’s relations to the creature…’; p. 6</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-613556ca5a" data-kw="">
<blockquote><p>Omnipotency is God able to do whatsoever his wisdom does conceive, Gen. 18:14; Mt. 19:26; Isa. 46:10. All contradictions, impossibilities and repugnancies unto the revealed will of God are excluded in this proposition: God is omnipotent, or God can do all things. That things which imply a contradiction, as namely: for the same thing to be and not to be; and impossibilities, as namely, for a man not to be a reasonable creature and the like: fall not under the compass of omnipotency, is not from any defect (it is indeed from the perfection) of power in God, but from the impossibility of the things: so that concerning matters of this nature, it is more convenient to say that they cannot be, which shows their non-possibility to be, than that God cannot do them, which seems to touch upon omnipotency (Unde convenientius dicitur, Ea non possunt fieri, quam quod Deus ea non possit facere [Therefore, it is more fitting to say that these things cannot be done than that God is unable to do them]. Thomas, pt. 1, quest. 25, art. 3). So likewise that God cannot sin, lie or deny Himself, is not from defect, but from the eminency of his power and absolute perfection, whence He is uncapable of being touched with any imperfection. Objection: God cannot destroy Sodom until Lot be gone out of it, Gen. 19:22. Like speeches whereunto are used elsewhere, it seems therefore God is not omnipotent. Answer: The power of God is either absolute and unlimited; by it He is able to do all things that are possible, though He never do them: or ordinate and limited by his decree and revealed Will: according to which God having freely bounded Himself, changes not, being immutable. These words, and the like spoken elsewhere, are to be understood of his limited, not of his unlimited power. Though God be omnipotent, yet He is not omnivolent [all-willing]; that is, though God can do whatsoever He pleases, yet God is not pleased to do whatsoever He can.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’</cite>, p. 19</span></figcaption>

</figure><figure class="quote" id="q-90b2694bf6" data-kw="Sovereignty Satan">
<blockquote><p>The Lord God omnipotent reigneth. His government is exercised over inanimate matter, over the brute beasts, over the children of men, over angels good and evil, and over Satan himself. No revolving world, no shining of star, no storm, no creature moves, no actions of men, no errands of angels, no deeds of Devil—nothing in all the vast universe can come to pass otherwise than God has eternally purposed. Here is a foundation of faith. Here is a resting place for the intellect. Here is an anchor for the soul, both sure and steadfast. It is not blind fate, unbridled evil, man or Devil, but the Lord Almighty who is ruling the world, ruling it according to His own good pleasure and for His own eternal glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sovereignty of God</cite>, ch. 3, “Sovereignty of God in Administration”</span></figcaption>

</figure><figure class="quote" id="q-a87c150997" data-kw="power ability">
<blockquote><p>The power of God is that ability and strength whereby he can bring to pass whatsoever he please, whatsoever his infinite wisdom can direct, and whatsoever the infinite purity of his will can resolve. Power, in the primary notion of it, doth not signify an act, but an ability to bring a thing into act. As God had an ability to create before he did create, he had power before he acted that power without.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Power of God</span></figcaption>

</figure><figure class="quote" id="q-d1bec4d5b6" data-kw="">
<blockquote><p>That God’s power is infinite, quia est ipsa infinita essentia [because He Himself is an infinite essence], is past doubt: But whether it may be called infinite as respecting outward objects, is disputed: And some prove the affirmative by asserting infinite objects, but Gregory of Rimini, n. 1, d. 43, q. 2. has reasons too subtle to be here recited: One of them Vasquez uses in 1. Tho. q. 25, d. 103, ch. 2 &amp; disp. 104. See the opinions of Gabriel, Scotus and Thomas on the rule of the name of divine omnipotentce.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology (London: White, 1675)</cite>, sect. 4, ‘Of God’s relations to the creature…’; p. 7, margin note</span></figcaption>

<main class="wrap"><figure class="quote" id="q-a9a7b7065a" data-kw="">
<blockquote><p>I. Since a division arose among Protestants regarding certain key points of the Christian religion, and those who follow the Helvetic, French, and Belgic Confessions have openly separated from those who adhere more closely to the Augsburg Confession [1530], the former, known specifically as the Reformed, have always tried to reconcile with those [Lutherans] of the Augsburg Confession, and have attempted various ways to establish ecclesiastical peace and remove the schism between the two groups.

II. Although these latter ones have often rejected the offered peace [by the Reformed] and many of them still seem very averse to it, sometimes the effort has met with success. For example, a hundred years ago at the Synod of Sandomierz, ministers who taught the Gospel of Christ according to both the Augsburg Confession and the Confession of the Waldensian Brethren and the Helvetic Churches in both Poland, Lithuania, and Samogitia came together in a common confession and were reconciled. Recently, in the Colloquium of Kassel, between the theologians of Marburg and Rinteln, a mutual communion was agreed upon despite remaining disagreements on what were considered fundamental issues.

III. Furthermore, in this century, there have been among other theologians of the Augsburg Confession some highly learned and celebrated men who publicly declared in their writings their desire for such ecclesiastical peace between the two Protestant parties and outlined the means to achieve it. For instance, Matthias, Bishop of Strängnäs in Sweden, in his book Northern Olive Branch, and George Calixtus, professor of theology at the University of Helmstedt, in his book Judgment on Theological Controversies between the Reformed and Lutherans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), ‘Whether from the proposed Reformed and Lutheran union, union with the Roman Church follows,’, pp. 950-57 Latin</span></figcaption>

<blockquote><p>The ignorance of fundamentals condemns, which is to be understood [in] two ways:

1. The ignorance of fundamentals such as are supernatural fundamentals, condemns all within the visible church as a sin, but it does not formally condemn those who are [outside] the visible church (John 15:22). It only makes those who are without the church incurable, but does not formally condemn them, as medicine not known, and so not refused, makes sick men incurable, as a loss, but does not kill them as a sin.

2. Superstructures, which by consequence arise from fundamentals, are fundamental by consequence, and secondarily, as the second rank of stones that are immediately laid upon the foundation, are a foundation in respect of the higher parts of the wall, and therefore are materially fundamental. And the ignorance of these virtually condemns, and the denying of such, by consequence, is a denying of the foundation.</p></blockquote>

<blockquote><p>…a man may be a schismatic, forsaking communion with a true Church, and yet not be an heretic, in as much as he may rightly believe all the articles of the Faith. … Other divisions there are which are with separation, when men shall withdraw themselves from fellowship and communion with a true Church, so breaking themselves off from the body. And this (says our judicious [William] Ames)¹ by way of special appropriation, deserves most rightly to be called by the name of ‘schism’: in as much as heresy in this division is perfected and brought to a head, as also most clearly manifested, and declared, viz. in refusing of due Church-communion. ¹ Quia autem haec scissio maxime perficitur et apparet in debita communione Ecclesiastica recusanda, idcirco illa separatio per appropriationem singularium recte vocatur Schisma [But because this division is chiefly brought about and becomes evident in the refusing of due ecclesiastical communion, therefore that separation, by the appropriating of things to oneself, is rightly called ‘schism’]. Ames, Cases of Conscience on Schism Which refusal may be either partial, or total. Partial, in some particular acts and exercises, wherein a man cannot (or at least conceives he cannot) communicate without sin. Total, a rejecting, and renouncing of all religious communion. This latter all divines look upon as a schism, and that most properly so called. Which (again) may be either from the Church, or from a Church. From the Church catholic, the whole Church. That was properly Donatism (the direct error of the Seekers at this day): Or from a particular Church; and that is properly Separatism.</p></blockquote>

</figure><figure class="quote" id="q-ca4866a32c" data-kw="">
<blockquote><p>And what shall I say in the conclusion, now I am near to my departure from this contentious world? but sound a retreat to all these unhappy militants, that will not let holiness prosper by the necessary advantage of peace. Cease your proud contendings, O vain-glorious militant clergy! Learn of the Prince of peace and the holy angels that preached Him, to give glory to God in the highest, who gives peace on earth, and well-pleasedness in (or towards) men. Did Christ or his apostles make such work for Christians as you do? The great Shepherd of the flock will take your pretences of order, orthodoxness (or truth) and piety for no excuse for your corrupting order, faith and practice by your tyranny, self-conceitedness and blind zeal and superstition; and for using his name against Himself, to the destroying of that love, and concord and unity which He has bequeathed to his Church; and for serving his enemy, and dividing his people, and hardening infidels and ungodly ones by these scandals. Return to the primitive simplicity, that we may return to unity, love and peace. Dream not of them upon your own corrupting terms. And read and read over again and again James 3, which does describe you, condemn you, and instruct you. If you say, ‘Physicion heal thyself: Who has wrote more of controversies?’ I answer, peruse what I have written and you will see it is of controversies, but against controversies, tending to end and reconcile. If anything be otherwise (except necessary defence of certain necessary faith or duty), I retract it and condemn it: Let it be as not written. I have meddled much with controversies in this book: but it is to end them. The God of Peace give wisdom and peaceable principles, minds and hearts to his servants, that (though I shall not live to see it) true love and piety may revive in the Christian world, by the endeavors of a healing ministry, and the shaming, restraint and reformation of the contentious clergy, whether tyrannical, dogmatical or superstitious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable, for pacification of the dogmatical Word-Warriors who</cite>, ... (London: White, 1675), Preface, n.p.</span></figcaption>

<blockquote><p>Calvin never for a moment ceased to view the Church in its totality and, as Karl Holl has noted, his ecumenicity took root in the Churches organized under his influence, resulting in a strong feeling of unity and an active intercourse between them. In conflicts within Calvinism, national difference has never played a part. In this ecumenical consciousness he sought, in fact, a ‘syncretism’ (a word employed in his Catechism) among Protestants. Calvin never drew the bounds of communion in terms of assent to one confession of faith… He sought to lay the foundation of a Europe-wide communion, with a doctrinal basis clearly but not narrowly defined. He hoped to obtain this by mutual deliberation and conciliar action. Had his aims been achieved, Protestantism would have taken the outlines of a Church ecumenical and conciliar, autonomous vis-a-vis the State though protected by it. The design of Calvin has the grandeur of a world-embracing Christian order… The three Protestantisms [Reformed, Zwinglian and Luthern] had become two [as the Zwinglian and Reformed merged], and Calvin never lost hope that the two would become one.</p></blockquote>

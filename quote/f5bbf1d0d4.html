<main class="wrap"><figure class="quote" id="q-f5bbf1d0d4" data-kw="">
<blockquote><p>we must see why it is that St. Paul praises the Corinthians… Now we note that in the Church of God there is first of all doctrine, and then there is order and policy… As for the rest, other than doctrine, there is also policy, and this policy is left to us in liberty. So, for example, we are presently assembled at eight o’clock; one might well arrange for it to be at seven o’clock, or change the order in some regard. And, indeed, we often see that one Church will by no means have precisely the same order as another… and do we have a different Christianity on that account? Not at all. For what belongs to outward order and policy (as I said) has been left to human liberty. It is true we must proceed with sound-mindedness and modesty, and ever consider what is fitting for the edification of the Church, as we will be exhorted in the fourteenth chapter, and there it will be treated more fully. …he did not inject himself by imposing certain laws, bringing souls into bondage; he did not erect a ‘divine service’ such as one sees in Papistry. None of all that. Rather he conveyed to them an order designed to maintain decency, peace and concord among them… So, when the gospel is preached in any place, and a church is raised up, some particular ordinances must be established, which one will know to be proper and which everyone will use in his liberty. But this (as I said) has nothing to do with adding to the doctrine of faith, nor with making laws that put our souls in bondage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Men, Women &amp; Order in the Church: Three Sermons by John Calvin, trans. Seth Skolnitsky (Dallas, TX: Presbyterian Heritage Publications, 1992)</cite>, pp. 7-10</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-82a48c5391" data-kw="">
<blockquote><p>[Durell:] ‘There was a great irreverence at prayer in their congregations, very few kneeling, many not so much as putting off their hats, and of this,’ he says, he was an eye-witness. …Into how many congregations he went where many did not so much as put off their hats in the time of prayer? And whether he either saw or heard that the ministers of those churches did any way countenance that irreverence? …For ought I know those in whom he observed this irreverence might be sectaries, who did more bitterly inveigh against presbyterians than against any other men whatever; perhaps also they might be episcopal-men, who designed to put an affront upon the presbyterians’ prayers: just as now some are observed to sit upon their breech all the time of pulpit-prayer, unless when just the Lord’s prayer is repeating, because forsooth pulpit-prayer is not allowed by the [establishing Anglican] Church, but only bidding of prayer. I write it with grief, but I must write it, I never in any congregations where I have been observed so much irreverence as I have observed in those in which there is the greatest abundance of such as always pretended a love to the English [Anglican] liturgy; particular stories I might relate…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-hickman.html">Henry Hickman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bonasus vapulans [A Bull being Whipped], or, Some Castigations given to Mr. John Durell for Fouling Himself &amp; Others in his English &amp; Latin Book by a Country Scholar (London, 1672) Hickman (bap.1629-1692) was an English puritan who was ejected in 1662.</cite>, pp. 125-26</span></figcaption>

</figure><figure class="quote" id="q-3feea598b2" data-kw="">
<blockquote><p>2. I hope it will be granted me too, without much begging, that for the woman to come into the congregation of God’s worshippers with her head uncovered, or attired after the manner of the man, is a very uncomely and unchristian-like thing… 3. And I presume upon the observation of all that I have had to do with, that it will not be denied that in praying and in singing of psalms, the man ought to have his head uncovered. I met with none that own these ordinances, but are ready to own it to be their duty to be uncovered in them, and take it as a piece of profane irreverence and contempt of God’s ordinance to be otherwise. Though indeed there be some, who of late have learnt a new fashion of uncovering the head, by hanging their hats half way on one side, or on their brows; these are uncovered by a synecdoche partis, and show their readiness to keep them quite on, if it were but the fashion; as if they were afraid of too much reverence, or of abasing themselves too much in the sight of God. Of whom this fantastical fashion was first learnt, I know not; yet thus much even these seem to grant by that little they do, that in these duties the head ought to be uncovered in whole or in part. And being thus far agreed, that which remains to be tried, is only this: Whether it be the duty of the man to have his head uncovered, while the word of God is read or preached in the congregation of his people?… Objection 1: I hear some allege thus, That it is in itself a matter of indifferency, and to be determined by the custom of those particular churches or people, where any one has his conversation, and not to be positively asserted for a general duty… Objection 2: Others object, That the Reformed Churches in other countries observe no such thing, but generally practice the contrary in their assemblies; but if it were a duty, why should not they practice it as well as we?… Objection 4: Others there be that will allow it to be necessary, by the rules of decency and reverence, to be uncovered in prayer, and in singing and perhaps in reading of the Scriptures too, but not in preaching: And their reason is because in preaching we have not the pure word of God, but mixed with men’s own private opinions and improvements… Objection 5: Others, it seems, argue after this fashion: This uncovering of the head in divine worship, is a thing that has been so abused, and rested in by a company of dead formalists, and so zealously affected by such as dote on foolish and superstitious ceremonies, that to show our dislike of their ways, we think it expedient to act contrary to them in this thing also, and not to symbolize with their superstitions. Answer: Had I not heard it from some that pretended to sobriety… Objection 6: But there are yet others that think they have more to say than all this. Their bodily infirmities are such as that they cannot bear it to be so long uncovered, without hazard of their health: But God will have mercy, and not sacrifice… Objection 7: Others think to say something in this, if this had been such a duty; wherefore have our teachers been so long silent, Why had we not heard of this sooner?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-stoddon.html">Samuel Stoddon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on a Question Relating to Divine Worship viz. Whether it be Contrary to the Apostolical Laws of Decency &amp; Reverence for a Man to have his Head Covered in the Time &amp; Place of God’s Solemn Public Worship?: Affirmative (London: Maxwell, 1682) Stoddon was an English, congregationalist minister.</cite>, pp. 40-44</span></figcaption>

C+and+to+be+determined+by+the+custom+of+those+particular+churches+or+people%2C+where+any+one+has+his+conversation%2C+and+not+to+be+positively+asserted+for+a+general+duty%E2%80%A6+Objection+2%3A+Others+object%2C+That+the+Reformed+Churches+in+other+countries+observe+no+such+thing%2C+but+generally+practice+the+contrary+in+their+assemblies%3B+but+if+it+were+a+duty%2C+why+should+not+they+practice+it+as+well+as+we%3F%E2%80%A6+Objection+4%3A+Others+there+be+that+will+allow+it+to+be+necessary%2C+by+the+rules+of+decency+and+reverence%2C+to+be+uncovered+in+prayer%2C+and+in+singing+and+perhaps+in+reading+of+the+Scriptures+too%2C+but+not+in+preaching%3A+And+their+reason+is+because+in+preaching+we+have+not+the+pure+word+of+God%2C+but+mixed+with+men%E2%80%99s+own+private+opinions+and+improvements%E2%80%A6+Objection+5%3A+Others%2C+it+seems%2C+argue+after+this+fashion%3A+This+uncovering+of+the+head+in+divine+worship%2C+is+a+thing+that+has+been+so+abused%2C+and+rested+in+by+a+company+of+dead+formalists%2C+and+so+zealously+affected+by+such+as+dote+on+foolish+and+superstitious+ceremonies%2C+that+to+show+our+dislike+of+their+ways%2C+we+think+it+expedient+to+act+contrary+to+them+in+this+thing+also%2C+and+not+to+symbolize+with+their+superstitions.+Answer%3A+Had+I+not+heard+it+from+some+that+pretended+to+sobriety%E2%80%A6+Objection+6%3A+But+there+are+yet+others+that+think+they+have+more+to+say+than+all+this.+Their+bodily+infirmities+are+such+as+that+they+cannot+bear+it+to+be+so+long+uncovered%2C+without+hazard+of+their+health%3A+But+God+will+have+mercy%2C+and+not+sacrifice%E2%80%A6+Objection+7%3A+Others+think+to+say+something+in+this%2C+if+this+had+been+such+a+duty%3B+wherefore+have+our+teachers+been+so+long+silent%2C+Why+had+we+not+heard+of+this+sooner%3F%E2%80%9D%0A%0A%E2%80%94+Samuel+Stoddon%2C+An+Essay+on+a+Question+Relating+to+Divine+Worship+viz.+Whether+it+be+Contrary+to+the+Apostolical+Laws+of+Decency+%26+Reverence+for+a+Man+to+have+his+Head+Covered+in+the+Time+%26+Place+of+God%E2%80%99s+Solemn+Public+Worship%3F%3A+Affirmative+%28London%3A+Maxwell%2C+1682%29+Stoddon+was+an+English%2C+congregationalist+minister.%2C+pp.+40-44&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3feea598b2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3feea598b2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=2.%20I%20hope%20it%20will%20be,we%20not%20heard%20of%20this%20sooner%3F" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>(4) …1 Tim. 2:9. And therefore the leaving the breasts naked, in whole or in part, is a transgression of this rule; they uncover their nakedness which they should vail and hide, especially in God’s presence: as the apostle says, 1 Cor. 11:10, ‘The woman ought to have power on her head, because of the angels.’ In the assembly there you meet with angels and devils; angels to observe your garb and carriage, and devils to tempt you; therefore be covered because of the angels. Yet usually women come hither with a shameless impudence into the presence of God, men and angels. This is a practice that neither suits with modesty nor conveniency; nothing can be alleged for it but reasons of pride and wantonness; it feeds your own pride and provokes lust in others. You would think they were wicked women that should offer others poison to drink; they do that which is worse, lay a snare for the soul, uncover that which should be covered; lest you provoke others of your rank to imitate your vanity, if they should not by the fear of God be guarded from unclean thoughts and filthy desires.</p></blockquote>

<blockquote><p>All adult women would have had long hair, the only exceptions being women who habitually wore wigs, slaves who had had their own hair cut off to provide the hair for such wigs and possibly some priestesses, as well as women who had been ill… Women would not have appeared in public with short hair from choice. The hair was always worn pinned up, unless the woman wanted to show distress by not taking care of her appearance, such as at funerals.</p></blockquote>

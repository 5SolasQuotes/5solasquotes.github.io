<main class="wrap"><figure class="quote" id="q-6910a4352e" data-kw="">
<blockquote><p>and keep the ordinances: …The word signifies anything that is doctrinally delivered, or taught men, whether it concerns faith or manners. It is thought, that in this text it doth not signify what the apostle had delivered to them with respect to faith, or their moral conversation, but with respect to matters of order, because such is the next instance which the apostle mentions, about praying or prophesying with the head covered, or uncovered; and undoubtedly any precepts of that nature from one guided by an infallible Spirit ought to be observed. The apostle doth not command them to keep any traditions, which others should to the end of the world deliver to them, he only praises them for keeping those which he had delivered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11</cite>, v. 2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-15a6d09e85" data-kw="">
<blockquote><p>Part III will find the exact ‘covering’ prohibited to men while ‘praying or prophesying’ (11:4) is less certain [compared to the woman’s covering], though it seems Paul proscribed Corinthian men from wearing any dishonoring covering in the assemblies, namely which hung down from their heads, whether material, a hair–bun or long hair, yet not wreaths, helmets, hats or turbans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Part III of 1 Corinthians – Head-Coverings are Not Perpetual &amp; they were Hair-Buns, with or without Material: Proven (RBO, 2022), pp. 232-57, p. 9</span></figcaption>

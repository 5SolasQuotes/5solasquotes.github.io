<main class="wrap"><figure class="quote" id="q-dd5daca24a" data-kw="">
<blockquote><p>Shall we recognise the Apostolic See where we see nothing but horrible apostasy? Shall he be the vicar of Christ who, by his furious efforts in persecuting the Gospel, plainly declares himself to be Antichrist? Shall he be the successor of Peter who goes about with fire and sword demolishing everything that Peter built? Shall he be the Head of the Church who, after dissevering the Church from Christ, her only true Head, tears and lacerates her members? Rome, indeed, was once the mother of all the churches, but since she began to be the seat of Antichrist she ceased to be what she was.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 4.7.24</figcaption>
<div class="meta"><a class="tag" href="../topics/rome/the-papacy.html">Rome: The Papacy</a><a class="tag" href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a><a class="tag" href="../topics/the-return-of-christ-antichrist-and-the-millennium/antichrist.html">Antichrist</a><a class="tag" href="../topics/the-church/true-and-false-church.html">True and False Church</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cb317aa3f1" data-kw="">
<blockquote><p>For that the doctrine there is most impure, we have demonstrated through its several parts. But if it is asked about morals, come, let the very histories of the Roman pontiffs (which the parasites of the pontiffs wrote) be compared with whatever monsters of men ever existed from the founding of the world, and it will be found that in this one seat more was permitted to Satan than in any tyranny that ever oppressed the world.</p></blockquote>
<figcaption>— <a href="../authors/theodore-beza.html">Theodore Beza</a>, <cite>The Christian Faith</cite>, ch. 7</figcaption>
<div class="meta"><a class="tag" href="../topics/rome/the-papacy.html">Rome: The Papacy</a><a class="tag" href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a><a class="tag" href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></div>

<figcaption>— <a href="../authors/john-owen.html">John Owen</a>, <cite>A Vindication of the Animadversions on Fiat Lux</cite>, ch. 8</figcaption>

</figure><figure class="quote" id="q-3d3581611a" data-kw="">
<blockquote><p>Daniel and Paul foretold that Antichrist would sit in the temple of God, (Dan. 9: 27; 2 Thess. 2: 4;) we regard the Roman Pontiff as the leader and standard-bearer of that wicked and abominable kingdom.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 4.2.12</figcaption>

</figure><figure class="quote" id="q-c93bf87ff0" data-kw="">
<blockquote><p>As Christ is the only sovereign Ruler of the Church, His word is the only word that is law in the absolute sense. Consequently, all despotic power is contraband in the Church. There is no ruling power independent of Christ. The Pope of Rome stands condemned in that he, while professing to be Christ&#x27;s vicar on earth, virtually supplants Christ and supersedes His word by human innovations. He not only places tradition on an equal footing with Scripture, but also claims to be the infallible interpreter of both when speaking ex cathedra in matters of faith and morals.</p></blockquote>
<figcaption>— <a href="../authors/louis-berkhof.html">Louis Berkhof</a>, <cite>Systematic Theology</cite>, Part Five, The Doctrine of the Church, ch. III (Government of the Church)</figcaption>

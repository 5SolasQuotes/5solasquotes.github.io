<blockquote><p>1. Such [works] as are of ordinary necessity or convenience. For we are not to think the precept is here tied up to things absolutely necessary, as if nothing might be done but what the creature could not subsist without, but such things as are needful, for the comfortable serving of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Body of Divinity… (Boston, 1726), Sermon 172, Q. 60</cite>, pp. 584-88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

— Samuel Willard, A Complete Body of Divinity… (Boston, 1726), Sermon 172, Q. 60, pp. 584-88">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+Such+%5Bworks%5D+as+are+of+ordinary+necessity+or+convenience.+For+we+are+not+to+think+the+precept+is+here+tied+up+to+things+absolutely+necessary%2C+as+if+nothing+might+be+done+but+what+the+creature+could+not+subsist+without%2C+but+such+things+as+are+needful%2C+for+the+comfortable+serving+of+God.%E2%80%9D%0A%0A%E2%80%94+Samuel+Willard%2C+A+Complete+Body+of+Divinity%E2%80%A6+%28Boston%2C+1726%29%2C+Sermon+172%2C+Q.+60%2C+pp.+584-88&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F63cdd82e9e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/63cdd82e9e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-works-of-necessity-mercy-on-the-sabbath/#:~:text=1.%20Such%20%5Bworks%5D%20as%20are%20of,for%20the%20comfortable%20serving%20of%20God&amp;text=1.%20Such%20%5Bworks%5D%20as%20are%20of%20ordinary%20necessity&amp;text=are%20needful%2C%20for%20the%20comfortable%20serving%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c4c27e5535" data-kw="">
<blockquote><p>That saying of our Savior, that the Sabbath was not made for man etc. was not uttered by Him to show that the action of the disciples in plucking and eating the ears of corn was warranted by necessity against the command of the Sabbath, but that it was not within the prohibition of works on the Sabbath, which ordinarily is restrained to works of a civil or servile nature, not to natural refreshment, which is always indulged on the Sabbath and so that work of mercy is not under the prohibition, for the plucking of the ears of corn, when they were in the field was no more then drawing drink out of a vessel and of this opinion is learned [Martin] Chemnitz: Hoc Christus it a defendit, ut simul ostendat extra casum contempus publici ministry, et turbationis cultus sabati propter otium externum Sabati, hominem ne levi quidē incommodo assiciendum. ‘By this Christ does so defend his disciples, as withal He shows that, out of the case of contempt of the public ministry and disturbance of the worships of the Sabbath, for the external rest of the Sabbath, a man is not to undergo the least damage.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-geree.html">John Geree</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Might Overcoming Right. Or a Clear Answer to Mr. John Goodwin’s Might and Right well met (London: Bostock, 1649), ch. 1, section 3</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

ath&amp;text=man%20is%20not%20to%20undergo%20the%20least%20damage" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-da6a422848" data-kw="sabbath partly moral ceremonial">
<blockquote><p>Whether the first institution of the Sabbath was in the fourth commandment; and whether the commandment is partly moral, partly ceremonial. The former we deny; the latter we affirm. The true derivation of the word is from the verb shbhth (i.e., “to cease” or “to rest”), which relates either to the existence of a thing, when it ceases to be and fails, or to the operation of an agent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.13.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/first-table-commandments-1-4.html">First Table (Commandments 1-4)</a> › <a href="../topics/the-law-of-god/first-table-commandments-1-4/fourth-commandment-sabbath.html">Fourth commandment (Sabbath)</a></span><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a> › <a href="../topics/worship/the-lords-day/sabbath.html">Sabbath</a></span></div>

</figure><figure class="quote" id="q-375ecdb9c1" data-kw="">
<blockquote><p>6. Works of comliness, tending to honest or decent walking… By all which believers have allowance: 1. for piety, 2. for charity, 3. for what is needful for their beasts, 4. what is needful and convenient, or comely for themselves; and more is not necessary: In these the Lord has not straightned them, neither has He pinched and pinned them up to absolute necessity, but has left them to walk by Christian prudence (yet so as they may not exceed) for the disciples possibly might have endured that hunger, and not plucked the ears of corn, or beasts may live a day without water, and not be much the worse, or some sort of victuals may be provided to be set beside men on the Sabbath needing no dressing or preparing; yea, a man may live on little or nothing for one day: but the Lord has thought good not to straighten them, so as to make his day and worship a weariness and burden unto them, seeing He has made the Sabbath for man, to be refreshing to him, and not man for the Sabbath; nor will he have their consciences to be fettered with inextricable scruples: He leaveth it to men on other days how much to eat and drink by a Christian prudence (yet allows them not to exceed even on these) so here there is some latitude left to conscientious reason to walk by; for some may do something at one time, and not at another, yea, one man may take more pains in upholding his body than is called for from another who is stronger, so that it’s impossible to set particular rules which will agree to all, but [that] men would look: 1. to their end, 2. to their need, 3. to what may conveniently attain the end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law Unsealed: or a Practical Exposition of the Ten Commandments... (Glasgow, 1676), 4th Commandment</cite>, p. 171</span></figcaption>

</figure><figure class="quote" id="q-db1e438acd" data-kw="">
<blockquote><p>9. The strong, violent and firm persuasions of conscience in single persons, or in some communities of men, is not a sufficient indication of a moral law. The weak brother of whom St. Paul speaks durst not eat flesh, but thought it an impiety next to unpardonable, but he was abused: and there are at this day some persons, some thousands of persons against whose conscience it is to dress meat upon the Lord’s Day, or to use an innocent permitted recreation: Now when such an opinion makes a sect, and this sect gets firm confidents and zealous defenders, in a little time it will dwell upon the conscience as if it were a native there, whereas it is but a pitiful inmate and ought to be turned out of doors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ductor dubitantium, or, The Rule of Conscience in all her General Measures serving as a great instrument for the determination of cases of conscience… (London, 1660), vol. 1, Of the Rule of Conscience, ch. 2, Rule 6, ‘Every thing in the Decalogue is not obligatory to Christians, is not a portion of the Moral or Natural law’ Taylor (1613–1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He was Arminian in outlook.</cite>, pp. 370-71</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

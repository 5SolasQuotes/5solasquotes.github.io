<main class="wrap"><figure class="quote" id="q-c548ce00e1" data-kw="">
<blockquote><p>2. A second way of your communion of [congregationalist] churches, is, ‘By way of recommendation, as Paul in the behalf of Phoebe, etc.’ But this is so far from being any part of the power of the keys that it is a duty which a church or party owe to any Christian that is godly, not by virtue of any particular church-membership, but by the common interest of Christianity, yea, by the common right of humanity, even to an honest heathen, according to the Ninth Commandment, which requires us to bear true witness to our brother if we be thereto required. The letters are only declarative, of the good behaviour of the party, occasioned to remove to such a place. Was this (think you) a part of the power of the keys delivered to Peter and the rest of the apostles? Besides, if there be any virtue in these letters, to admit a member into communion, is there not a like virtue in them to excommunicate one ungodly? And if these letters dimissory have power to admit a member of one church to be a member of another, without any new covenanting, have they not the like power to admit the pastor of one church, to be a pastor of another Church, without any new ordination? which yet, I believe, you do not practice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Clavium: or, A Vindication of the Keys of the Kingdom of Heaven, into the Hands of the Right Owners. Being some Animadversions upon a Tract of Mr. John Cotton’s Called, ‘The Keys of the Kingdom of Heaven’. As also upon Another Tract of his Called, ‘The Way of the Churches of New England’. Manifesting: 1. The Weakness of his Proofs. 2. The Contradictions to Himself &amp; Others. 3. The Middle-Way</cite>, … (1645), ch. 4, ‘Of the Subject of Church-Liberty’, p. 41 Cawdrey (1588–1664) was a presbyterian Westminster divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-40b9e09dad" data-kw="">
<blockquote><p>14. I would willingly inquire of the Independents, to what church were added so many thousands that were baptized by the apostles and added unto the Church in one day? Whether to a particular congregation, or to a greater ecclesiastical consociation? It could not be to a particular congregation: 1. For the reasons I have already produced. 2. Because the apostles were not particular, but universal ministers, set over the universal militant Church; and therefore, in virtue of their charge, admitted them to be members of all the Churches, whereof they were ministers. 3. Because they were of diverse and sundry countries: neither is it credible that to be a member of the Church, they were bound to quit their countries and to stay at Jerusalem, howsoever so long as they did stay there, they might participate as well of all the rest of God’s ordinances, as of baptism: Ergo, they were added to some greater consociation, viz. to that, and to all those, whereof the apostles were ministers; for out of all doubt, the apostles who baptized them could not refuse to admit them unto the Lord’s Table wherever they celebrated the sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/adam-steuart.html">Adam Steuart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Part of the Duply to M.S. alias Two Brethren: Wherein are Maintained the King’s, Parliament’s, &amp; All Civil Magistrates’ Authority about the Church. Subordination of Ecclesiastical Judicatories. Refuted the Independency of Particular Congregations</cite>, The Second Part of the Duply to M.S. alias Two Brethren: Wherein are Maintained the King’s, Parliament’s, &amp; All Civil Magistrates’ Authority about the Church. Subordination of Ecclesiastical Judicatories. Refuted the Independency of Particular Congregations… (London, 1644), p. 92 Steuart (1591–1654) was a Scottish presbyterian, philosopher, controversialist and professor in both France and the Netherlands.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

<blockquote><p>11. As he that swears and keeps his allegiance to the king is a subject and member of the kingdom, though he be no member of any corporation; so, though he disown a thousand fellow subjects; yea, though he deny the authority of constable, justice, judge; so he that is devoted to Christ truly in the baptismal covenant, is a Christian, and a member of the universal Church, though he were of no particular church, or did disown a thousand members, or any particular officer of the Church.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c72e1d9c25" data-kw="">
<blockquote><p>Although we disagree with our author on festival days outside of the Christian Sabbath, there is still much in the below extract that is relevant to keeping the Lord’s Day holy:

Whether thou bestowedst those days wholly in Godly &amp; virtuous exercises as well at home as abroad, namely in reading the scriptures, in distributing alms, in visiting and comforting the sick, in training and instructing with Godly doctrine, thy family and folks: and in such the like commendable duties: Or whether rather thou hast abused, mis-spent and prophaned the same, in banqueting, tippling, gaming, filthy talking, dissolute dealing, &amp;c. …

¶ Teachers, and school-masters. Whether, thou have suffered the younger sort to be absent from the Church, or have discouraged, dissuaded or called them away from reading the Scriptures and books of Godliness, specially on the Sabbath days.

Whether on the same days thou have given them leave to use games, plays, and exercises, for the time and quality, either unmeet or undecent.

Whether thou have dissuaded any from the study of divinity, and from the Ecclesiastical ministry, which were meet and fit thereunto, and would have profitably proceeded therein, hadst not thou by counsel drawn them from their good purpose.

¶ Scrivener or Notary. Whether he have indited, drawn, or written, or caused to be indited, drawn, or written any bills, bonds, or other writings whatsoever, on the Sabbath days.

Whether he have made any such, whereby Religion or the dignity of the Church, might any way be impaired and diminished.

¶ Taverner. Whether on the Sabbath days, and especially in the time of divine service, he have suffered any disorder in drinking and tippling within his house: and whether he hath made a common practise or custom at such times and on such days, to sell his wines, &amp;c.

¶ Merchant. Whether on the Sabbath day he hath bartered &amp; bargained, cast up his reckonings, and written his accounts.

Chapman. Whether on such days &amp; times, he hath set open his shop, or set his wares to sale.

Stage-player. Whether by his Interludes &amp; Stage-plays, he have drawn the people away from spiritual exercises, and godly meditations.

¶ Musician &amp; Minstrel. Whether he have been the author and occasioner, of wanton dancing, or other unseemly pastimes.

¶ Crafts-men of any trade whatsoever. Whether they have wrought on the Sabbath and holy days, when no necessity enforced them, but only for lucre sake: or whether they have caused their apprentices and servants the same days to work, without either going to church or giving themselves to godly meditations: as the Taylor or Butcher to sow a garment: the husbandman to hedge, ditch, plow, garden, cleanse his Stable, &amp;c. whereas at these times these things, and so of others might &amp; ought to be forborne.

Whether any person whosoever he be, have enticed and procured others to any vain games, unlawful sports, or other light and lewd exercises, as dice-playing and such like.

House-holder. Whether as specially on the Sabbaths and festival days, so also sometimes on the work days he have propounded or caused to be propounded and taught to his children and family, the chief heads of Christian religion, namely such as be taught and contained in the Catechism.

Finally, whether any person by committing any of these aforesaid faults, have thereby given occasion to others to commit the like: and whether he have been a stumbling block and cause of fall unto others, either in word or deed.

And again: whether in seeing others to do ill, thou have not let them understand thy great mislike thereof. For, thine assenting to others sins, loadeth thee a new with more sins, and maketh thee a partaker thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-hyperius.html">Andreas Hyperius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true trial and examination of a man’s own self wherein every faithful Christian, by looking into his conscience, may most plainly behold his spiritual deformity by nature, described, his actual rebellion by disobedience detected, his promise breach at baptism, by ordinary transgression apparentl</cite>, trans. Thomas Newton (London: John Windet, 1587), pp 55, 58-62.</span></figcaption>

<blockquote><p>XLII. Those who walk in a manner worthy of the Lord are those who, throughout the course of their lives, follow the will and guidance of God, denying their own desires and the dictates of the flesh, as befits children of the heavenly Father and imitators of God. The consequences are:

1. There is no legitimate religious worship, no good work, unless it is done according to the will and commandment of God.

2. No matter how great the zeal for worship and works that deviate from the will and commandment of God, they are nothing but a great course leading away from the eternal goal of salvation.</p></blockquote>

<blockquote><p>§19. Question 12. If another man deceive me into a promise or covenant against my good, am I bound to perform it when I have discovered the deceit? Answer: Yes, 1. in case that the law of the land or other reasons for the public good require it; 2. Or in case that you were faulty by negligence, heedlessness, or otherwise guilty of your own deceit, in any considerable and avoidable degree. Otherwise, in that measure that he deceived you, and in those respects you are not obliged. §20. Question 13. If the contracting parties do neither of them understand the other, is it a covenant: or if it be, whose sense must carry it? Answer: If they understand not each other in the essentials of the contract, it is no contract, in point of conscience: except where the laws, for the public safety, do annex the obligation to the bare external act. But if they understand not one another in some circumstances, and be equally culpable or innocent, they must come to a new agreement in those particulars: But if one party only be guilty of the misunderstanding, he must bear the loss if the other insist on it. … §22. Question 15. If I say I will give such or such a one this or that, am I bound thereby to do it? Answer: It is one thing to express your present mind and resolution without giving away the liberty of changing it: And it’s another thing to intend the obliging of yourself to do the thing mentioned, and that obligation is either intended to man or to God only; and that is either in point of rendition and use, or in point of veracity, or the performance of that moral duty of speaking truth. If you meant no more in saying, ‘I will do it,’ or ‘I will give it,’ but that this is your present will and purpose and resolution, yea, though it add the confident persuasion that your will shall not change, yet this no further obliges you than you are obliged to continue in that will: And a man’s confident resolutions may lawfully be changed upon sufficient cause. But if you intended to alienate the title to another, or to give him present right, or to oblige yourself for the future to him by that promise; or to oblige yourself to God to do it by way of peremptory assertion, as one that will be guilty of a lie if you perform it not; or if you dedicate the thing to God by those words as a vow, then you are obliged to do accordingly (supposing nothing else to prohibit it).</p></blockquote>

— Richard Baxter, A Christian Directory, or a Sum of Practical Theology, ... (London, 1673) | pt. 4, ch. 19, title 2, p. 117">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A719.+Question+12.+If+another+man+deceive+me+into+a+promise+or+covenant+against+my+good%2C+am+I+bound+to+perform+it+when+I+have+discovered+the+deceit%3F+Answer%3A+Yes%2C+1.+in+case+that+the+law+of+the+land+or+other+reasons+for+the+public+good+require+it%3B+2.+Or+in+case+that+you+were+faulty+by+negligence%2C+heedlessness%2C+or+otherwise+guilty+of+your+own+deceit%2C+in+any+considerable+and+avoidable+degree.+Otherwise%2C+in+that+measure+that+he+deceived+you%2C+and+in+those+respects+you+are+not+obliged.+%C2%A720.+Question+13.+If+the+contracting+parties+do+neither+of+them+understand+the+other%2C+is+it+a+covenant%3A+or+if+it+be%2C+whose+sense+must+carry+it%3F+Answer%3A+If+they+understand+not+each+other+in+the+essentials+of+the+contract%2C+it+is+no+contract%2C+in+point+of+conscience%3A+except+where+the+laws%2C+for+the+public+safety%2C+do+annex+the+obligation+to+the+bare+external+act.+But+if+they+understand+not+one+another+in+some+circumstances%2C+and+be+equally+culpable+or+innocent%2C+they+must+come+to+a+new+agreement+in+those+particulars%3A+But+if+one+party+only+be+guilty+of+the+misunderstanding%2C+he+must+bear+the+loss+if+the+other+insist+on+it.+%E2%80%A6+%C2%A722.+Question+15.+If+I+say+I+will+give+such+or+such+a+one+this+or+that%2C+am+I+bound+thereby+to+do+it%3F+Answer%3A+It+is+one+thing+to+express+your+present+mind+and+resolution+without+giving+away+the+liberty+of+changing+it%3A+And+it%E2%80%99s+another+thing+to+intend+the+obliging+of+yourself+to+do+the+thing+mentioned%2C+and+that+obligation+is+either+intended+to+man+or+to+God+only%3B+and+that+is+either+in+point+of+rendition+and+use%2C+or+in+point+of+veracity%2C+or+the+performance+of+that+moral+duty+of+speaking+truth.+If+you+meant+no+more+in+saying%2C+%E2%80%98I+will+do+it%2C%E2%80%99+or+%E2%80%98I+will+give+it%2C%E2%80%99+but+that+this+is+your+present+will+and+purpose+and+resolution%2C+yea%2C+though+it+add+the+confident+persuasion+that+your+will+shall+not+change%2C+yet+this+no+further+obliges+you+than+you+are+obliged+to+continue+in+that+will%3A+And+a+man%E2%80%99s+confident+resolutions+may+lawfully+be+changed+upon+sufficient+cause.+But+if+you+intended+to+alienate+the+title+to+another%2C+or+to+give+him+present+right%2C+or+to+oblige+yourself+for+the+future+to+him+by+that+promise%3B+or+to+oblige+yourself+to+God+to+do+it+by+way+of+peremptory+assertion%2C+as+one+that+will+be+guilty+of+a+lie+if+you+perform+it+not%3B+or+if+you+dedicate+the+thing+to+God+by+those+words+as+a+vow%2C+then+you+are+obliged+to+do+accordingly+%28supposing+nothing+else+to+prohibit+it%29.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory%2C+or+a+Sum+of+Practical+Theology%2C+...+%28London%2C+1673%29+%7C+pt.+4%2C+ch.+19%2C+title+2%2C+p.+117&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd635f46709.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d635f46709.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-oaths-vows/#:~:text=19.%20Question%2012.%20If%20another%20man,supposing%20nothing%20else%20to%20prohibit%20it&amp;text=19.%20Question%2012.%20If%20another%20man%20deceive%20me&amp;text=do%20accordingly%20%28supposing%20nothing%20else%20to%20prohibit%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4. It is granted [by the most sober nonconformists] not to be idolatrous. So Mr. [Paul] Baynes: ‘Kneeling is neither an occasion, nor by participation idolatry: Kneeling never bred bread-worship.’ (Christian Letters, Letter 24, p. 201) And [Richard Baxter]: ‘Our doctrine of the sacrament [that one is kneeling to God], known to all the world, does free us from suspicion of adoration in it.’ (Baxter, Christian Directory, p. 616) To these Mr. [John] Tombes [a baptist] adds (Theodulia, p. 256, etc.): ‘1. That the Papists adore not the bread at putting it into their mouths, but at the elevation [of it], it being inconsistent with their principles to worship that which is not above them.

2. That the worship of God not directed to a creature, but before it, as an occasional object of adoration to God, is not idolatry.

3. That yet in the Church of England the elements are not occasionally so, but [rather] the benefits of Christ in the Lord’s Supper [are]. And 4. Kneeling is not to the bread, but as the signification of an humble and grateful mind; as he shows from the rubric [in the Anglican Book of Prayer].’ (T. D., Jerubbaal, p. 41 &amp; Mr. [Zachary] Crofton‘s Answer, p. 28; [William] Ames, Fresh Suit, ch. 4, §4, p. 382; [William] Perkins, Cases) Fifthly, Those that do account it inconvenient, yet account it not to be unlawful. Thus Mr. [Thomas] Cartwright: ‘Kneeling in receiving the sacrament, being incommodious in its own nature, and made far more incommodious by Popish superstition, is not therefore so to be rejected that we should abstain from the sacrament (if we cannot otherwise be partakers of it), because the thing is not in its own nature unlawful.’ (Evangelical Harmony, on Lk. 22:14, etc. Second Reply, p. 262) So it’s said of the old non-conformists: ‘Kneeling at the sacrament was disliked by all, but yet thought tolerable, and that it might be submitted to by some of the most Learned.’ (Troughton, An Apology for the Nonconformists [1681], p. 90) From all which we may conclude with Mr. [Richard] Vines [a Westminster divine], that the posture being a circumstance of action, as well as the time and place, ‘is not of the free-hold of the ordinance’ (On the Sacrament, p. 102); and with Mr. [Richard] Baxter that those that think they must not receive kneeling, ‘think erroneously.’ (Sacrilegious Desertion, p. 19)</p></blockquote>

<blockquote><p>In Francis Turretin’s day, there were some who appealed to the alleged discrepancies in Matthew 27:9 and Mark 1:2 in an attempt to demonstrate that scripture contradicted itself. Turretin was unmoved by their sophistries and provided a perfectly rational explanation as to why Matthew referred to Jeremiah and why Mark referred to Isaiah:

The prophecy concerning the thirty pieces of silver and the field bought with them is cited from Jeremiah (Mt. 27:9), which is certainly found in Zech. 11:12. From this some attribute universal falsehood and slips of the memory (sphalma mnēmonikon) to Matthew. But the difficulty can be cleared up in various ways. Some are of the opinion that the name Jeremiah (leremiou) has crept into the text from the ignorance of transcribers (since zou may have been written as an abbreviation of Zachariou), but that the error is one of small importance (viz., occurring in a proper name the correction of which is easily made from a comparison of the Old and New Testaments). Others (with better reason) maintain that there is here a blending (synchysin) of two prophetical passages from which this testimony is drawn, viz., from Jer. 32 and Zech. 11. Cases similar to this occur in: Mt. 21:5 from Is. 62:11 and Zech. 9:9; Mt. 21:13 from Is. 56:7 and Jer. 7:11; Acts 1:20 from Pss. 69:25 and 109:8; 1 Pet. 2:7, 8 from Ps. 118:22 and Is. 8:14.

Nor is it an unusual thing (when the words or testimonies belong to two persons) to omit one and give only the name of the other (as Mk. 1:2, 3 where the first part is taken from Malachi, the latter from Isaiah, and yet Malachi is omitted and Isaiah alone mentioned). And this can be done with greater propriety when the one who is cited is either more ancient than the other, and the later has drawn many things from him (as is the case here). For Jeremiah was before Zechariah, and Zechariah borrowed many things from him and imitated (as it were) his addresses (as might easily be shown from Zech. 1:14 which is taken from Jer. 18:11 and 35:15; and Zech. 3:8 from Jer. 23:5). Hence the Jews were in the habit of saying, “the spirit of Jeremiah is in Zechariah.”

To this it can be added that from the tradition of the Rabbis in the Babylonion Talmud (Baba Bathra, 14, cf. BT 1:70) which Rabbi David Kimchi quotes in his preface to the prophet Jeremiah, Jeremiah stands at the head of the prophets and is therefore named first (Mt. 16:14). Therefore Matthew (citing these words contained in the book of the prophets) could quote them only under his name because he held the first place there. So in Lk. 24:44, the book of holy writings (Hagiographorum) is mentioned under the name of the Psalms because this is the first of them. Finally, Jeremiah alone might be mentioned here by Matthew because he wished to give an account, not so much of the thirty pieces of silver or of the price for which Christ was bought (about which Zechariah treats), as of the price of the bought field (about which Jeremiah treats). Therefore what is said here of the price is drawn from Zechariah, and what is said of the field from Jeremiah.</p></blockquote>

— Francis Turretin, Institutes of Elenctic Theology, trans. George M. Giger, ed. James T. Dennison (1679-85; 3 vols, Phillipsburg NJ: Presbyterian and Reformed, 1992), 2.5.28.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+Francis+Turretin%E2%80%99s+day%2C+there+were+some+who+appealed+to+the+alleged+discrepancies+in+Matthew+27%3A9+and+Mark+1%3A2+in+an+attempt+to+demonstrate+that+scripture+contradicted+itself.+Turretin+was+unmoved+by+their+sophistries+and+provided+a+perfectly+rational+explanation+as+to+why+Matthew+referred+to+Jeremiah+and+why+Mark+referred+to+Isaiah%3A%0A%0AThe+prophecy+concerning+the+thirty+pieces+of+silver+and+the+field+bought+with+them+is+cited+from+Jeremiah+%28Mt.+27%3A9%29%2C+which+is+certainly+found+in+Zech.+11%3A12.+From+this+some+attribute+universal+falsehood+and+slips+of+the+memory+%28sphalma+mn%C4%93monikon%29+to+Matthew.+But+the+difficulty+can+be+cleared+up+in+various+ways.+Some+are+of+the+opinion+that+the+name+Jeremiah+%28leremiou%29+has+crept+into+the+text+from+the+ignorance+of+transcribers+%28since+zou+may+have+been+written+as+an+abbreviation+of+Zachariou%29%2C+but+that+the+error+is+one+of+small+importance+%28viz.%2C+occurring+in+a+proper+name+the+correction+of+which+is+easily+made+from+a+comparison+of+the+Old+and+New+Testaments%29.+Others+%28with+better+reason%29+maintain+that+there+is+here+a+blending+%28synchysin%29+of+two+prophetical+passages+from+which+this+testimony+is+drawn%2C+viz.%2C+from+Jer.+32+and+Zech.+11.+Cases+similar+to+this+occur+in%3A+Mt.+21%3A5+from+Is.+62%3A11+and+Zech.+9%3A9%3B+Mt.+21%3A13+from+Is.+56%3A7+and+Jer.+7%3A11%3B+Acts+1%3A20+from+Pss.+69%3A25+and+109%3A8%3B+1+Pet.+2%3A7%2C+8+from+Ps.+118%3A22+and+Is.+8%3A14.%0A%0ANor+is+it+an+unusual+thing+%28when+the+words+or+testimonies+belong+to+two+persons%29+to+omit+one+and+give+only+the+name+of+the+other+%28as+Mk.+1%3A2%2C+3+where+the+first+part+is+taken+from+Malachi%2C+the+latter+from+Isaiah%2C+and+yet+Malachi+is+omitted+and+Isaiah+alone+mentioned%29.+And+this+can+be+done+with+greater+propriety+when+the+one+who+is+cited+is+either+more+ancient+than+the+other%2C+and+the+later+has+drawn+many+things+from+him+%28as+is+the+case+here%29.+For+Jeremiah+was+before+Zechariah%2C+and+Zechariah+borrowed+many+things+from+him+and+imitated+%28as+it+were%29+his+addresses+%28as+might+easily+be+shown+from+Zech.+1%3A14+which+is+taken+from+Jer.+18%3A11+and+35%3A15%3B+and+Zech.+3%3A8+from+Jer.+23%3A5%29.+Hence+the+Jews+were+in+the+habit+of+saying%2C+%E2%80%9Cthe+spirit+of+Jeremiah+is+in+Zechariah.%E2%80%9D%0A%0ATo+this+it+can+be+added+that+from+the+tradition+of+the+Rabbis+in+the+Babylonion+Talmud+%28Baba+Bathra%2C+14%2C+cf.+BT+1%3A70%29+which+Rabbi+David+Kimchi+quotes+in+his+preface+to+the+prophet+Jeremiah%2C+Jeremiah+stands+at+the+head+of+the+prophets+and+is+therefore+named+first+%28Mt.+16%3A14%29.+Therefore+Matthew+%28citing+these+words+contained+in+the+book+of+the+prophets%29+could+quote+them+only+under+his+name+because+he+held+the+first+place+there.+So+in+Lk.+24%3A44%2C+the+book+of+holy+writings+%28Hagiographorum%29+is+mentioned+under+the+name+of+the+Psalms+because+this+is+the+first+of+them.+Finally%2C+Jeremiah+alone+might+be+mentioned+here+by+Matthew+because+he+wished+to+give+an+account%2C+not+so+much+of+the+thirty+pieces+of+silver+or+of+the+price+for+which+Christ+was+bought+%28about+which+Zechariah+treats%29%2C+as+of+the+price+of+the+bought+field+%28about+which+Jeremiah+treats%29.+Therefore+what+is+said+here+of+the+price+is+drawn+from+Zechariah%2C+and+what+is+said+of+the+field+from+Jeremiah.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+trans.+George+M.+Giger%2C+ed.+James+T.+Dennison+%281679-85%3B+3+vols%2C+Phillipsburg+NJ%3A+Presbyterian+and+Reformed%2C+1992%29%2C+2.5.28.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F204d50514c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/204d50514c.html">Permalink</a><a class="src" h

<main class="wrap"><figure class="quote" id="q-65f732a516" data-kw="">
<blockquote><p>Obs. VIII. There is infinite grace in every divine covenant, inasmuch as it is established on promises. Infinite condescension it is in God, that he will enter into covenant with dust and ashes, with poor worms of the earth. And herein lies the spring of all grace, from whence all the streams of it do flow. And the first expression of it is in laying the foundation of it in some undeserved promises. And this was that which became the goodness and greatness of his nature, the means whereby we are brought to adhere unto him in faith, hope, trust, and obedience, until we come unto the enjoyment of him; for that is the use of promises, to keep us in adherence unto God, as the first original and spring of all goodness, and the ultimate satisfactory reward of our souls, 2 Cor. vii. 1.

Obs. IX. The promises of the covenant of grace are better than those of any other covenant, as for many other reasons, so especially because the grace of them prevents any condition or qualification on our part. I do not say the covenant of grace is absolutely without conditions, if by conditions we intend the duties of obedience which God requireth of us in and by virtue of that covenant; but this I say, the principal promises thereof are not in the first place remunerative of our obedience in the covenant, but efficaciously assumptive of us into covenant, and establishing or confirming in the covenant.

The covenant of works had its promises, but they were all remunerative, respecting an antecedent obedience in us; (so were all those which were peculiar unto the covenant of Sinai). They were, indeed, also of grace, in that the reward did infinitely exceed the merit of our obedience; but yet they all supposed it, and the subject of them was formally reward only. In the covenant of grace it is not so; for sundry of the promises thereof are the means of our being taken into covenant, of our entering into covenant with God. The first covenant absolutely was established on promises, in that when men were actually taken into it, they were encouraged unto obedience by the promises of a future reward.

But those promises, namely, of the pardon of sin and writing of the law in our hearts, which the apostle expressly insisteth upon as the peculiar promises of this covenant, do take place and are effectual antecedently unto our covenant obedience. For although faith be required in order of nature antecedently unto our actual receiving of the pardon of sin, yet is that faith itself wrought in us by the grace of the promise, and so its precedency unto pardon respects only the order that God had appointed in the communication of the benefits of the covenant, and intends not that the pardon of sin is the reward of our faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations</cite>, ed. W. H. Goold (1680; 7 vols, Edinburgh: Johnston and Hunter, 1854), 6: 68-69.</span></figcaption>

<blockquote><p>Since true believers are already irrevocably interested in the covenant of grace, in the righteousness of Christ, and in the favor of God; and since they have in Christ and on the ground of His righteousness imputed to them a complete security against eternal death and a full title to eternal life, the law as the law of Christ has no sanction of judicial rewards or punishments. It has no promise of eternal life or threatening of eternal death annexed to it. The form of the covenant of works, indeed, is eternally binding on all who live and die under that violated covenant, but because Christ, as last Adam, has answered all the demands of it for believers, they are delivered from the law in that form (Rom. 7:4–6).</p></blockquote>

<blockquote><p>In an extensive sense, God is a Father, and is so revealed in his works as well as his Word. The paternal relation among men aids us in contemplating the loving relation in which God stands to his creatures: it is a shadow and representation of the Divine Fatherhood. Fatherly dispositions and dealings are ascribed to Him. By creation, He is the Father of intelligent beings. Angels are those “sons of God” that shouted for joy when “the morning stars,” at the dawn of creation, “sang together.” (Job 38:7) Men are “his offspring,” and He is “the Father of the spirits of all flesh.</p></blockquote>

<blockquote><p>3. In the moral providence of God, is there a place for an ineffective wish? XIII. It is asked, third, whether in the moral providence of God, there is a place for some ineffective wish or desire of God. The Pelagians and Pelagianizers—Socinians, Jesuits, Arminians, and others—because they argue for a self-determined free choice that God cannot determine, and because likewise they argue for a conditioned antecedent will in God, by which God wills if a person wills, and likewise by which he wills that each and every person be saved, if only they will it, say that there is in God a wish properly so-called, by which God desires that this or that duty be done by man, but he desires it in vain. The Reformed acknowledge no sort of wish and desire in God, except that which coincides with his commandment, different from it in this alone, that whereas a commandment urges a duty only by the authority of the lawgiver, a wish urges it by a motive drawn from a certain eminent advantage which is certainly set to fall from that duty upon him who obeys. We examined the reasons on both sides in book 2, chapter 15, §XXXII.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 3, ch. 11, section 13</span></figcaption>

<div class="actions"><button class="copy" data-copy="“3. In the moral providence of God, is there a place for an ineffective wish? XIII. It is asked, third, whether in the moral providence of God, there is a place for some ineffective wish or desire of God. The Pelagians and Pelagianizers—Socinians, Jesuits, Arminians, and others—because they argue for a self-determined free choice that God cannot determine, and because likewise they argue for a conditioned antecedent will in God, by which God wills if a person wills, and likewise by which he wills that each and every person be saved, if only they will it, say that there is in God a wish properly so-called, by which God desires that this or that duty be done by man, but he desires it in vain. The Reformed acknowledge no sort of wish and desire in God, except that which coincides with his commandment, different from it in this alone, that whereas a commandment urges a duty only by the authority of the lawgiver, a wish urges it by a motive drawn from a certain eminent advantage which is certainly set to fall from that duty upon him who obeys. We examined the reasons on both sides in book 2, chapter 15, §XXXII.”

— Petrus van Mastricht, Theoretical Practical Theology, (RHB), vol. 3, bk. 3, ch. 11, section 13">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+In+the+moral+providence+of+God%2C+is+there+a+place+for+an+ineffective+wish%3F+XIII.+It+is+asked%2C+third%2C+whether+in+the+moral+providence+of+God%2C+there+is+a+place+for+some+ineffective+wish+or+desire+of+God.+The+Pelagians+and+Pelagianizers%E2%80%94Socinians%2C+Jesuits%2C+Arminians%2C+and+others%E2%80%94because+they+argue+for+a+self-determined+free+choice+that+God+cannot+determine%2C+and+because+likewise+they+argue+for+a+conditioned+antecedent+will+in+God%2C+by+which+God+wills+if+a+person+wills%2C+and+likewise+by+which+he+wills+that+each+and+every+person+be+saved%2C+if+only+they+will+it%2C+say+that+there+is+in+God+a+wish+properly+so-called%2C+by+which+God+desires+that+this+or+that+duty+be+done+by+man%2C+but+he+desires+it+in+vain.+The+Reformed+acknowledge+no+sort+of+wish+and+desire+in+God%2C+except+that+which+coincides+with+his+commandment%2C+different+from+it+in+this+alone%2C+that+whereas+a+commandment+urges+a+duty+only+by+the+authority+of+the+lawgiver%2C+a+wish+urges+it+by+a+motive+drawn+from+a+certain+eminent+advantage+which+is+certainly+set+to+fall+from+that+duty+upon+him+who+obeys.+We+examined+the+reasons+on+both+sides+in+book+2%2C+chapter+15%2C+%C2%A7XXXII.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical+Practical+Theology%2C+%28RHB%29%2C+vol.+3%2C+bk.+3%2C+ch.+11%2C+section+13&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe254f824ee.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e254f824ee.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-sincere-free-offer-of-the-gospel/historic-reformed-quotes-on-gods-revealed-will-as-his-desire-wish-and-pleasure/#:~:text=3.%20In%20the%20moral%20providence%20of,in%20book%202%2C%20chapter%2015%2C%20%C2%A7XXXII&amp;text=3.%20In%20

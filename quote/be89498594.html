<main class="wrap"><figure class="quote" id="q-be89498594" data-kw="">
<blockquote><p>Human life being very precious, and the loss of it irrecoverable, capital punishments ought never to be inflicted, when others are adequate to the crime, or can answer the great end of the glory of God in the general advantage of the society. But some malefactors ought to be punished with death.

1. If the common tranquillity ought to be carefully preserved, notorious disturbers of it must be cut off.

2. Notwithstanding of capital punishments threatened or inflicted, some wickedly commit the most shocking enormities against the welfare of their state, and the honour of God, its Supreme Governor.

3. No loss of property, liberty, or honour, is adequate to the criminal depriving others of their precious life, &amp;c.

4. If the more shocking enormities were not severely punished, the commission would become more and more frequent. – Hence the execution of malefactors ought to be as public and solemn as possible, in order more effectually to deter others from the like crimes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Compendious View of Natural and Revealed Religion</cite>, (1782; Fearn: Christian Focus Publications, 2002), pp 25-26.</span></figcaption>

<blockquote><p>Indeed the wages of the laborers who mowed your fields, which you kept back by fraud, cry out; and the cries of the reapers have reached the ears of the Lord of Sabaoth (James 5:5)

In his commentary on the above verse, John Calvin condemns some of the cherished sins of free-market economics and laissez-faire capitalism as acts of tyranny and oppression:

Behold, the hire. He now condemns cruelty, the invariable companion of avarice. But he refers only to one kind, which, above all others, ought justly to be deemed odious. For if a humane and a just man, as Solomon says in Prov. xii. 10, regards the life of his beast, it is a monstrous barbarity, when man feels no pity towards the man whose sweat he has employed for his own benefit. Hence the Lord has strictly forbidden, in the law, the hire of the labourer to sleep with us (Deut. xxiv. 15). Besides, James does not refer to labourers in common, but, for the sake of amplifying, he mentions husbandmen and reapers. For what can be more base than that they, who supply us with bread by their labour should be pined through want? And yet this monstrous thing is common; for there are many of such a tyrannical disposition, that they think that the rest of mankind live only for their benefit alone.

But he says that this hire crieth, for whatever men retain either by fraud or by violence, of what belongs to another; it calls for vengeance as it were by a loud voice. We ought to notice what he adds, that the cries of the poor come to the ears of God, so that we may know that the wrong done to them shall not be unpunished. They, therefore, who are oppressed by the unjust ought resignedly to sustain their evils, because they will have God as their defender. And they who have the power of doing wrong ought to abstain from injustice, lest they provoke God against them, who is the protector and patron of the poor. And for this reason also he calls God the Lord of Sabaoth, or of hosts, intimating thereby his power and his might, by which he renders his judgment more dreadful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the catholic epistles</cite>, trans. and ed. John Owen (1551; n.p., 1855) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, 345.</span></figcaption>

</figure><figure class="quote" id="q-4beebe13c1" data-kw="">
<blockquote><p>The Crimes of persons are grievous, but those of a State are more. The corruption of a member is not so grievous as of the whole Body; and the deformity of the Body Political, is not so unpleasant to the eye of God as of the Church: this is the Body, this is the Bride of Christ; nothing so much provokes the passion of a loving Husband, as the polluting of his Spouse. Church-grievances were the first and main causes of our present Troubles; the righting of these, will open the door of our first hope of deliverance.

Whoso will observe either the spring or progress of our present Woes in all the three Kingdoms, will find that the open Oppression and secret Undermining of the Common-wealth, by the craft and tyranny of the malignant Faction, did highly provoke the wrath of God, and was a great occasion of all this Discord which hath broke out among men: Yet it is evident, that the principal cause which hath kindled the Jealousie of God, and enflamed the spirits of men to shake off and break in pieces those Yokes of Civil Slavery, which ingenuous necks were no more able to bear, was the constuprating [sic] of the Church, the bringing in upon her by violence, and daily multiplying of Errors, Superstitions, Idolatries, and other Spiritual Burdens.

The Method of our Cure, if ever it prove solid, must lead our Physicians to the fountain of our Disease. All Treaties for accommodating State-differences, will be lost, if in the first place Religion be not provided for, according to the mind of God. If once the Temple were builded, and filled with the cloud, the Difficulties would be small in making up the breaches in the house of the Kingdom, and filling it with Peace and Prosperity. So long as the Temple lies desolate, it is not possible to rear up the walls of the City. […]

Interests of private persons and particular Factions, laid over with the colour of pretended State-reasons, may procrastinate days without number, settling of Religion: yet if we trust either ancient or late experience, these States-men provide best for the welfare of their Country, who give to the God of heaven, to his Worship and House, the first and most high place in all their studies and cares.

If we behold either the former, or the later Reformers of the State of Israel; if we consider the practice of Moses, of David, of Hezekiah, of Zerubbabel, and others, it is evident the Tabernacle, the Ark, the Temple, did first and most lie at all their hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dissuasive from the errors of the time</cite>, (London, 1645), pp 2-3.</span></figcaption>

</figure><figure class="quote" id="q-1a450251e5" data-kw="">
<blockquote><p>Who does not see, that this is a common case, among those on whom God has bestowed the riches of this world? The more they are indebted to their great benefactor, the more do they forget him. The more he causes their cup to run over, the more presumptuous, hardened, and ungrateful do they appear.

This is so plainly the fact, that if a man were to ask, where shall I find the best friends of my God? Where shall I find the heart that glows with the warmest sensibility for the common blessings of divine providence? We must for the most part direct him to the humble dwellings of the poor, and often to those who subsist upon the slender charity of their fellow men.

Read what the pious Asaph has said of the rich in the seventy-third Psalm. “Their eyes stand out with fatness; they have more than heart can wish. — They set their mouth against the heavens and their tongue walketh through the earth. They say, how doth God know? And, is there knowledge in the Most High? Behold these are the ungodly, who prosper in the world: they increase in riches.” We know that this is not true of all: we know that there are many who, like Abraham, abound in the good things of this life — and at the same time are rich in faith and heirs of the kingdom. Still it cannot be denied that men who increase in wealth, often increase in pride and self-sufficiency, and forget their dependence on God.</p></blockquote>

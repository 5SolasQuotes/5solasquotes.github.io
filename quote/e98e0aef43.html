<main class="wrap"><figure class="quote" id="q-e98e0aef43" data-kw="">
<blockquote><p>Scripture teaches that the Holy Spirit, in those whom He wishes to convert, first begins to mortify and to take away that corruption which He finds, so far as spiritual impulses and actions are concerned, in the unregenerate mind and will; then He begins to work and to bestow a new strength, ability, and efficacy in mind, will, and heart for beginning and performing spiritual actions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part I, Topic on Free Will, Sec. III</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/sin-and-free-will.html">Rome: Sin and Free Will</a> › <a href="../topics/rome/sin-and-free-will/free-will.html">Free will</a></span></div>
<div class="actions"><button class="copy" data-copy="“Scripture teaches that the Holy Spirit, in those whom He wishes to convert, first begins to mortify and to take away that corruption which He finds, so far as spiritual impulses and actions are concerned, in the unregenerate mind and will; then He begins to work and to bestow a new strength, ability, and efficacy in mind, will, and heart for beginning and performing spiritual actions.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-72b7111168" data-kw="">
<blockquote><p>Fifth, the last commandment of lust forbids the first motions to sin that are before consent. … Again, the philosophers knew that lust with consent was evil, even by the light of nature. But Paul, a learned Pharisee, and therefore more than a philosopher, knew not lust to be sin that is forbidden in this commandment [Rom. 7:7]. Lust therefore that is forbidden here, is without consent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Advertisement to all Favorers of the Roman Religion</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a> › <a href="../topics/sin/concupiscence/concupiscence-is-truly-sin.html">Concupiscence is truly sin</a></span><span class="t"><a href="../topics/rome/sin-and-free-will.html">Rome: Sin and Free Will</a> › <a href="../topics/rome/sin-and-free-will/concupiscence.html">Concupiscence</a></span><span class="t"><a href="../topics/the-law-of-god/law-in-general.html">Law in General</a></span></div>
<div class="actions"><button class="copy" data-copy="“Fifth, the last commandment of lust forbids the first motions to sin that are before consent. … Again, the philosophers knew that lust with consent was evil, even by the light of nature. But Paul, a learned Pharisee, and therefore more than a philosopher, knew not lust to be sin that is forbidden in this commandment [Rom. 7:7]. Lust therefore that is forbidden here, is without consent.”

</figure><figure class="quote" id="q-0bfeb86bf7" data-kw="">
<blockquote><p>Because Andrada pretends that the Council of Trent, because it did not define what original sin is, has left it free to everyone to believe that original sin is what he wants it to be, we set against him the voice of the Holy Spirit Himself, who shows in the Scripture by many testimonies and in various ways, what, of what kind, and how great the corruption of the original human nature is. And when the mouth of the Lord speaks, all flesh ought to be silent, heaven and earth ought to give ear. But Andrada prefers to hold an opinion with the Council of Trent rather than to believe with the Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part I, Topic on Original Sin, Sec. II</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/sin-and-free-will.html">Rome: Sin and Free Will</a> › <a href="../topics/rome/sin-and-free-will/original-sin.html">Original sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“Because Andrada pretends that the Council of Trent, because it did not define what original sin is, has left it free to everyone to believe that original sin is what he wants it to be, we set against him the voice of the Holy Spirit Himself, who shows in the Scripture by many testimonies and in various ways, what, of what kind, and how great the corruption of the original human nature is. And when the mouth of the Lord speaks, all flesh ought to be silent, heaven and earth ought to give ear. But Andrada prefers to hold an opinion with the Council of Trent rather than to believe with the Scripture.”

— Martin Chemnitz, Examination of the Council of Trent, Part I, Topic on Original Sin, Sec. II">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBecause%20Andrada%20pretends%20that%20the%20Council%20of%20Trent%2C%20because%20it%20did%20not%20define%20what%20original%20sin%20is%2C%20has%20left%20it%20free%20to%20everyone%20to%20believe%20that%20original%20sin%20is%20what%20he%20wants%20it%20to%20be%2C%20we%20set%20against%20him%20the%20voice%20of%20the%20Holy%20Spirit%20Himself%2C%20who%20shows%20in%20the%20Scripture%20by%20many%20testimonies%20and%20in%20various%20ways%2C%20what%2C%20of%20what%20kind%2C%20and%20how%20great%20the%20corruption%20of%20the%20original%20human%20nature%20is.%20And%20when%20the%20mouth%20of%20the%20Lord%20speaks%2C%20all%20flesh%20ought%20to%20be%20silent%2C%20heaven%20and%20earth%20ought%20to%20give%20ear.%20But%20Andrada%20prefers%20to%20hold%20an%20opinion%20with%20the%20Council%20of%20Trent%20rather%20than%20to%20believe%20with%20the%20Scripture.%E2%80%9D%0A%0A%E2%80%94%20Martin%20Chemnitz%2C%20Examination%20of%20the%20Council%20of%20Trent%2C%20Part%20I%2C%20Topic%20on%20Original%20Sin%2C%20Sec.%20II&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0bfeb86bf7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0bfeb86bf7.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-27a39a0ec1" data-kw="">
<blockquote><p>Protestants also believe that lust or concupiscence in the regenerate, as including a remaining tendency towards what is sinful, and the first or earliest motions of this tendency in the heart, though not deliberately consented to and followed out, is itself truly and properly sinful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, ch. 19 (The Doctrine of the Fall)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a> › <a href="../topics/sin/concupiscence/concupiscence-is-truly-sin.html">Concupiscence is truly sin</a></span><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a> › <a href="../topics/sin/concupiscence/concupiscence-after-baptism.html">Concupiscence after baptism</a></span><span class="t"><a href="../topics/sin/sin-in-the-regenerate.html">Sin in the Regenerate</a> › <a href="../topics/sin/sin-in-the-regenerate/remaining-sin-in-believers.html">Remaining sin in believers</a></span><span class="t"><a href="../topics/rome/sin-and-free-will.html">Rome: Sin and Free Will</a> › <a href="../topics/rome/sin-and-free-will/concupiscence.html">Concupiscence</a></span></div>
<div class="actions"><button class="copy" data-copy="“Protestants also believe that lust or concupiscence in the regenerate, as including a remaining tendency towards what is sinful, and the first or earliest motions of this tendency in the heart, though not deliberately consented to and followed out, is itself truly and properly sinful.”

</figure><figure class="quote" id="q-5285dd4573" data-kw="">
<blockquote><p>It is not to be feared, if we follow these statements of the Scripture, that we may magnify the corruption of nature too much, which is the worry of the men of Cologne and of Andrada, for this corruption which inheres in us cannot be recognized and deplored sufficiently, but there remains what the Psalm (19:12) says: “Who can discern his errors? Clear Thou me from hidden faults”; and what Jeremiah (17:9) proclaims: “The heart is deceitful above all things, and desperately corrupt; who can understand it?” We do not for this reason join ourselves to the Manichaeans, whose blasphemies we condemn and execrate, but we follow the Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part I, Topic on Original Sin, Sec. II</span></figcaption>

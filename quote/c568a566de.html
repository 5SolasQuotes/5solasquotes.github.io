<main class="wrap"><figure class="quote" id="q-c568a566de" data-kw="">
<blockquote><p>The first thing which must strike any thoughtful reader, after having carefully and studiously perused the Westminster Assembly’s Confession of Faith, is the remarkable comprehensiveness and accuracy of its character, viewed as a systematic exhibition of divine truth, or what is termed a system of theology.

In this respect it may be regarded as almost perfect, both in its arrangement and in its completeness. Even a single glance over its table of contents will show with what exquisite skill its arrangement proceeds from the statement of first principles to the regular development and final consummation of the whole scheme of revealed truth. Nothing essential is omitted; and nothing is extended to a length disproportioned to its due importance.

Nor do we think that a systematic study of theology could be prosecuted on a better plan than that of the Confession of Faith. Too little attention, perhaps, has been shown to the Confession in this respect; and we are strongly persuaded that it might be most advantageously used in our theological halls as a text-book.

This, at least, may be affirmed, that no private Christian could fail to benefit largely from a deliberate and studious perusal and reperusal of the Confession of Faith, for the express purpose of obtaining a clear and systematic conception of sacred truth, both as a whole, and with all its parts so arranged as to display their relative importance, and their mutual bearing upon, and illustration of, each other.

Such a deliberate perusal would also tend very greatly to fortify the mind against the danger of being led astray by crude notions, or induced to attribute undue importance to some favourite doctrine, to the disparagement of others not less essential, and with serious injury to the harmonious analogy of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-hetherington.html">William Hetherington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introductory Essay in Robert Shaw, An Exposition of the Confession of Faith of the Westminster Assembly of Divines</cite></span></figcaption>

<blockquote><p>61. Then he commends his kingdom on its equity when he says, a sceptre of justice is the sceptre of your kingdom.

And this kingdom is fittingly described by the sceptre: for a tyrannical kingdom differs from that of a king because the former exists for the tyrant’s benefit with great harm to the subjects, but a kingdom is particularly ordained to the benefit of the subjects. Consequently, the king is father and shepherd: for a shepherd does not correct with a sword but with a sceptre: I will visit their iniquities with a rod (Ps 89:33). Furthermore, a shepherd uses a rod to direct his flock: feed your people with your rod (Mic 7:14). For a rod sustains the infirm: your rod and your staff have strengthened me (Ps 23:2). Furthermore, it troubles the enemy: a sceptre shall spring up from Israel and shall strike the chiefs of Moab (Num 24:17).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super Epistolam B. Pauli ad Hebraeos lectura</cite>, (c. 1273), C. 1, L. 4, 61.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-40090ed0e8" data-kw="">
<blockquote><p>It should be carefully noted that our criticism of this procedure does not imply that we hold it to be wrong for the Christian church to make formal use of the categories of thought discovered by Aristotle or any other thinker. On the contrary, we believe that in the Providence of God, Aristotle was raised up of God so that he might serve the church of God by laying at its feet the measures of his brilliant intellect. When Solomon built the temple of God he was instructed to make use of the peculiar skill and the peculiar gifts of the pagan nation that was his neighbor. But this was something quite different than to build together with pagan nations. The Samaritans wanted to help the Jews construct the city and the temple. Hence they were rejected by the true Jews. The Phoenicians merely wanted to bring their treasures to Solomon and let him construct the way he saw fit. Hence they were gladly received by Solomon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cornelius-van-til.html">Cornelius Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of Christian Epistemology</cite>, (The Presbyterian and Reformed Publishing Company: Phillipsburg, NJ, 1969).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-5ce5c5fb73" data-kw="">
<blockquote><p>True philosophy, although it also differs very much from the doctrine of the church, yet, it does not array itself against it nor is it a wicked fabrication and device of Satan, as is true of the false doctrines of the sects, but it contains truth and is, as it were, a certain ray of the wisdom of God, impressed upon the mind of man in his creation. It is a doctrine that has respect to God and his creatures and many other things that are good and profitable to mankind and has been drawn out from the light of nature and from principles, in themselves clear and evident, and reduced to a system by wise and earnest men. It follows, therefore, that it is not only lawful but also profitable for Christians to devote themselves to the study of philosophy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Corpus Doctrinae, prolegomena</cite>, III.4</span></figcaption>

</figure><figure class="quote" id="q-b0c8055d1d" data-kw="">
<blockquote><p>I answer that there were in the law some precepts that were purely ceremonial, as circumcision, the immolation of the lamb, and so on. Such laws, since they were only figurative, it is no longer licit to observe, for they were a figure of something to come; hence, anyone who observes them now would be signifying that Christ is still to come. But others were purely moral, and these must be observed now. …

But others were partly ceremonial and partly moral, as the judicial precepts. These laws are no longer to be used in regard to what is ceremonial; but in regard to what is moral, they must be obeyed. Yet it is not necessary that they be observed in their proper form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super Epistolam B. Pauli ad Hebraeos lectura</cite>, (c. 1273), C. 7, L. 2, 339.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<main class="wrap"><figure class="quote" id="q-6faeb11a13" data-kw="">
<blockquote><p>…all natural ceremonies, such as: bowing of the body before superiors, embracing of those who are dear unto us, lifting up the hands and eyes to heaven in ordinary worship, which nature itself does teach all nations to observe without any institution, though not without some government of counsel, nor without such variety, as nature itself is subject unto…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-02ff74f216" data-kw="">
<blockquote><p>…the bishop’s own words. For he says that we kneel before the elements [of the Supper], ‘having them in our sight, or object to our senses, as ordinary signs, means, and memorials, to stir us up, to worship, etc.’ Now if we have them in our sight and before our senses for this purpose, that they may be means, signs, and memorials to stir us up to worship, then (sure) their being really before our senses is not accidental to us when we kneel. Since Dr. Burgess has been so dull and sottish as to write that ‘the signs are but accidentally before the communicants when they receive,’ he is to be ignominiously exsibilat; for making the sacred sacramental signs to be no otherwise present than the walls of the Church, the nails and timber of the material table whereupon the elements are set, or anything else accidentally before the communicants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | pt. 3, ch. 4, p. 58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><figure class="quote" id="q-8acabdb5ab" data-kw="">
<blockquote><p>4. It is ignorance in Burges to prove God may be adored in the elements [of the Supper], because they are as excellent symbols of God’s presence as the ark [in the OT]: for created excellency is no ground of adoring the elements, except it be a Godhead, and uncreated excellency: We condemn Pope Anastasius, who directs reverend bowing at the hearing of the Gospel, and not of the epistles, as if the Gospel were holier than the epistles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Ch. 1, Question 5, Section 3; p. 172</span></figcaption>

</figure><figure class="quote" id="q-ee3d9f351c" data-kw="">
<blockquote><p>In the second place, to supply the defendant his penury, the Rejoynder brings abundance of instances, out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy. But these we absolutely deny to be human inventions. The Rejoinder knew this: and therefore by prevention, replies: to say these are not human inventions, because they partly spring out of natural light, is as much as to say, they are not, because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross, and surplice; the cornered-cap, and tippet; the bishops’ rochet, and coap; with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willful invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time, lay aside right natural invention, and judgement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, … (1633), p. 495</span></figcaption>

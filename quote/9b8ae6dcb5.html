<main class="wrap"><figure class="quote" id="q-9b8ae6dcb5" data-kw="">
<blockquote><p>There is no patrociny intended, nor can be drawn by the most remote consequence, from what is here pleaded upon the point of separation, unto these dreadfully presaging anti-ministerial principles and practices, that several in this land are sadly precipitating themselves into, which, we hope, will be abundantly clear to the understanding peruser of what I have offered upon that head, and the state of the question, as it is exhibited.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders</cite>, 1740</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-01f2840d9d" data-kw="">
<blockquote><p>To be leal and true to the King’s Majesty, and his Highness’s successors, and, to the utmost of their power to maintain his Highness’s right and prerogative in causes ecclesiastical; and that they should be obedient to their ordinary the archbishop, and to all others their superiors in the Church; and that they maintain the present government of the Church and jurisdiction episcopal; and that they should live peaceable ministers in the Church, subjecting themselves to the orders that therein were, or should be established.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-3db040416a" data-kw="">
<blockquote><p>Only let our friends know, that, in setting up distinct congregations and judicatories, they not only withdraw from judicious and eminently godly ministers and private Christians, but do also consequentially go far towards a dooming them to Hell, as owning themselves to be in the communion of a Church that is no true Church, and with which (according to their principles) the Lord Jesus entertains no more any communion; for certainly their setting up separated judicatories and Churches will imply so much, or else they must say that they will have no fellowship with Churches with whom the Lord Jesus does entertain communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-d400a62bf4" data-kw="">
<blockquote><p>The first step towards what might be called the re-organisation of the [United] Societies appears to have been taken by Robert Hamilton, who had been on the Continent from 1679 to 1688, and who had constituted himself the leader in opposition to the movements proposed by the ‘ministers and majority of the people’ during the two years after the [Glorious] Revolution [of 1689]. All who did not approve his views were guilty of ‘gross defections.’ …when the first General Meeting was held after the issue of this paper [in 1691], it was found that there were tares among the wheat. “When gathered and searching into one another’s judgement as to the state of the testimony,” says the writer of the Informatory Vindication [of 1691(?)], ‘We found ourselves to be but a mix’d company,” and consequently, before anything was done, they had to ‘purge their meetings from all such as had sinfully joined with the courses of the times and were defending the same.’… How many were removed at the ‘purging’ is also unknown, but they must have formed a considerable proportion of the body… The Societies seem to have done very little without causing controversy in their own ranks.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-mcmillan.html">William McMillan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Covenanters after the Revolution of 1688’</cite>, (Scottish Church History Society, 1950), pp. 144-45</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

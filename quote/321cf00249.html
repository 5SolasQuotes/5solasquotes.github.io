<main class="wrap"><figure class="quote" id="q-321cf00249" data-kw="">
<blockquote><p>We shall here declare what offences are censurable with this greatest and last censure of excommunication, according to the order that is there prescribed, and which, as it requires, ‘that it be inflicted with great and mature deliberation, and after all other good means have been essayed;’ so it appoints in these express words: ‘That such errours in practice as subvert the Faith, or any other errours which overthrow the power of godliness; if the party who holds them spread them, seeking to draw others after him; and such sins in practice as cause the name and truth of God to be blasphemed, cannot stand with the power of godliness; and such practices, as in their own nature manifestly subvert that order, unity and peace which Christ has established in his Church; and particularly all those scandalous sins, for which any person is to be suspended from the sacrament of the Lord’s Supper, obstinately persisted in; these being publicly known, to the just scandal of the Church; The sentence of excommunication may and ought to proceed, according to the directions after following. But the persons that hold other errors in judgment, about which learned and godly men possibly may and do differ, and which subvert not the faith, nor are destructive to godliness, or that be guilty of such sins of infirmity as are commonly found in the children of God: or being otherwise sound in the Faith and holy in life (and so not falling under censure by the former rules) endeavour to keep the unity of the spirit in the bond of peace; and do yet out of conscience not come up to the observation of all those rules which are or shall be established by authority for regulating the outward worship of God and government of his Church; the sentence of excommunication for these causes shall not be denounced against them.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancaster-presbyterians.html">Lancaster Presbyterians</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Censures of the Church Revived</cite>, … (London: Eversden, 1659) sect. 4, p. 36</span></figcaption>

<blockquote><p>§10.

I. The subject or matter [of a minister] is a man:

II. The necessary Disposition is:…

      3. That he be a Christian.

      4. That he have necessary abilities for the essentials of the office-work. And those are:

      1. The understanding at least of the essentials of religion and ministry.

      2. A will to perform the work of the ministry.

      3. Ability of utterance to do it, and all the necessary executive power.</p></blockquote>

</figure><figure class="quote" id="q-5e965e2a11" data-kw="">
<blockquote><p>‘Private interpretation,’ [2 Pet. 1] is either Praeter fundamentum veritatis, ‘by the ground of verity,’ or Praeter fundamentum salutis, ‘by the ground of salvation;’ circa fundamentum salutis, ‘about the ground of salvation;’ or contra fundamentum salutis, or ‘contrary to the foundation of salvation’.

1. Praeter fundamentum veritatis, is when an interpretation agrees not with the place intreated, although it be not contra fundamentum salutis: these the Greeks called [Greek] aliena a proposito, out of purpose: as those who seek gold in the earth, if they miss the vein, they lose the gold (Chrysostom): so these who interpret Scripture, besides the meaning of the place intreated, they miss the sense of the Scripture.

2. Praeter fundamentum salutis, is that interpretation which is not only besides the verity, but also besides the foundation, Christ: this by the apostle is called hay and stubble, it shall burn, but the builder may be safe. (1 Cor. 3:15)

3. Circa fundamentum salutis, is that interpretation, which weakens the foundation, although it raze it not directly.

4. Contra fundamentum salutis, is that interpretation, which razes the foundation, ‘not holding the head Christ’. (Col. 2:19) … True interpretation is that interpretation which is super fundamentum, upon the foundation, and gives the true interpretation of the place intreated. The doctors of the Jews were called bonim, aedificantes, ‘builders,’ because they were bound to build upon the foundation. (Mk. 12:10)</p></blockquote>

</figure><figure class="quote" id="q-ca4866a32c" data-kw="">
<blockquote><p>And what shall I say in the conclusion, now I am near to my departure from this contentious world? but sound a retreat to all these unhappy militants, that will not let holiness prosper by the necessary advantage of peace. Cease your proud contendings, O vain-glorious militant clergy! Learn of the Prince of peace and the holy angels that preached Him, to give glory to God in the highest, who gives peace on earth, and well-pleasedness in (or towards) men. Did Christ or his apostles make such work for Christians as you do? The great Shepherd of the flock will take your pretences of order, orthodoxness (or truth) and piety for no excuse for your corrupting order, faith and practice by your tyranny, self-conceitedness and blind zeal and superstition; and for using his name against Himself, to the destroying of that love, and concord and unity which He has bequeathed to his Church; and for serving his enemy, and dividing his people, and hardening infidels and ungodly ones by these scandals. Return to the primitive simplicity, that we may return to unity, love and peace. Dream not of them upon your own corrupting terms. And read and read over again and again James 3, which does describe you, condemn you, and instruct you. If you say, ‘Physicion heal thyself: Who has wrote more of controversies?’ I answer, peruse what I have written and you will see it is of controversies, but against controversies, tending to end and reconcile. If anything be otherwise (except necessary defence of certain necessary faith or duty), I retract it and condemn it: Let it be as not written. I have meddled much with controversies in this book: but it is to end them. The God of Peace give wisdom and peaceable principles, minds and hearts to his servants, that (though I shall not live to see it) true love and piety may revive in the Christian world, by the endeavors of a healing ministry, and the shaming, restraint and reformation of the contentious clergy, whether tyrannical, dogmatical or superstitious.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“And what shall I say in the conclusion, now I am near to my departure from this contentious world? but sound a retreat to all these unhappy militants, that will not let holiness prosper by the necessary advantage of peace. Cease your proud contendings, O vain-glorious militant clergy! Learn of the Prince of peace and the holy angels that preached Him, to give glory to God in the highest, who gives peace on earth, and well-pleasedness in (or towards) men. Did Christ or his apostles make such work for Christians as you do? The great Shepherd of the flock will take your pretences of order, orthodoxness (or truth) and piety for no excuse for your corrupting order, faith and practice by your tyranny, self-conceitedness and blind zeal and superstition; and for using his name against Himself, to the destroying of that love, and concord and unity which He has bequeathed to his Church; and for serving his enemy, and dividing his people, and hardening infidels and ungodly ones by these scandals. Return to the primitive simplicity, that we may return to unity, love and peace. Dream not of them upon your own corrupting terms. And read and read over again and again James 3, which does describe you, condemn you, and instruct you. If you say, ‘Physicion heal thyself: Who has wrote more of controversies?’ I answer, peruse what I have written and you will see it is of controversies, but against controversies, tending to end and reconcile. If anything be otherwise (except necessary defence of certain necessary faith or duty), I retract it and condemn it: Let it be as not written. I have meddled much with controversies in this book: but it is to end them. The God of Peace give wisdom and peaceable principles, minds and hearts to his servants, that (though I shall not live to see it) true love and piety may revive in the Christian world, by the endeavors of a healing ministry, and the shaming, restraint and reformation of the contentious clergy, whether tyrannical, dogmatical or superstitious.”

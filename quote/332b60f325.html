<blockquote><p>In the seventeenth century… The intention was to celebrate the eucharist six times a year; however, liturgical freedom led in some cases to an even lower frequency, sometimes only once a year.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a1cfdc4f56" data-kw="">
<blockquote><p>Christ then broke the bread not merely for the purpose of distributing it, but also to signify thereby, 1. The greatness of his sufferings, and the separation of his soul from his body.

2. The communion of many with his own body, and the bond of their union, and mutual love. ‘The bread which we break is it not the communion of the body of Christ; for we being many are one bread, and one body; for we are all partakers of that one bread.’ (1 Cor. 10:16.) The breaking of the bread is, therefore, a necessary ceremony both on account of its signification, and for the confirmation of our faith, and is to be retained in the celebration of the Supper:

1. Because of the command of Christ, ‘Do this.’

2. Because of the authority and example of the church in the times of the Apostles, which in view of this circumstance, termed the whole transaction, the breaking of bread.

3. For our comfort, that we may know that the body of Christ was broken for us, as certainly as we see the bread broken.

4. That the doctrine of transubstantiation and consubstantiation may be rejected, and abandoned.</p></blockquote>

<blockquote><p>A Lasco’s bimonthly Communion took a period of two weeks and even involved a special preparatory service the day before. Thus, an important contributing factor to the differing frequencies of the Lord’s Supper throughout the churches of the Reformation was the balance between the desire for frequent Communion, and the desire for thoroughgoing church discipline.</p></blockquote>

<blockquote><p>The Lord’s Supper is justly considered as peculiarly solemn. All the ordinances of God are holy, as they have a holy God for their author, are to be observed in a holy manner, and are appointed means of promoting holiness. Yet an ordinance may be said to be more solemn in respect of the more sensible manifestation which God makes therein of his glory, in respect of the peculiarly awful warning which He gives against a rash and inconsiderate manner of intermeddling with it, in respect of the variety of holy exercises which concur in the right observation of it, and, lastly, in respect of the more full and public representation of the communion which the people of God have with his whole Church. That the Lord’s Supper has a greater solemnity in these respects than some other ordinances, seems to have been hitherto the sense of the whole New Testament Church. This is expressed by the judicious Mr. Durham, in the first of his communion sermons [The Unsearchable Riches of Christ (1685), A Preparation Sermon, pp. 4-5], where, speaking of the words of institution, he says: ‘Every circumstance speaks out a solemnity in this ordinance, as the night in which it was instituted, the same night in which He was betrayed, and his jealousy of and threatening for the abuse of this ordinance. The Lord’s Supper seems dignified with an eminence above all other gospel ordinances: 1st, in reference to what it exhibits. They all set forth love, but this sets forth love in an eminent degree, for it sets forth the Lord’s death, wherein the most eminent degree of his love shines. It sets forth the great masterpiece of his love, his actual dying. 2ndly, in respect of the excellent benefits communicated in it. It is true there is no other thing, on the matter, communicated in it, than in the Word and baptism; yet if ye look to the words, ‘Take, eat, this is my body’, they hold forth Christ Jesus not so much giving any particular gift, as actually conferring Himself in his death and suffering. 3rdly, in respect of the manner in which our Lord Jesus makes over Himself: For there is herein not only a most clear view of the slain Savior, and of covenanting with God, but also a clear glance of heaven upon earth, Jesus Christ and his people mixing (so to speak) and being familiar together; He condescending not only to keep company with them, but to be their food and refreshment, and giving not only the Word to their faith, but Himself (as it were) to their sense! Insofar as the mean, whereby He communicates Himself, is more sensible; it is by his Spirit that the mean is made effectual. There is not only a fixedness of faith on our part, but a sort of divineness in the ordinance itself, as it were, to the very senses of the believer. ‘I say unto you,’ says our Lord, ‘I will not drink henceforth of the fruit of the vine, until the day when I shall drink it new with you in my Father’s kingdom,’ where He seems to point out, that in this ordinance, He has a more special way of keeping communion with his people, bearing a resemblance to that which He will have with them in Heaven.’ That there is a peculliar solemnity in the partaking of the Lord’s Supper, appears from the concurrence of duties requisite to the right performance of it. ‘If it be a great and difficult work,’ adds the same eminent divine: ‘to carry rightly on an ordinary Sabbath, or in prayer, or in meditation, how difficult must communicating be, in which we ought to have all these joined together/’ If all religious duties were equally solemn, then they would all alike require preparation. An ejaculatory prayer, for example, would require another duty to prepare for it; and that duty would require another, and so on without end. The Old Testament Church had more solemn days, such as that on which the children of Israel stood before the Lord in Horeb. And there were to be such days under the New Testament dispensation also. Hence, in the vision, which we have in the latter part of the prophecy of Ezekiel, and which judicious interpreters allow to be an emblematical representation of the New Testament Church, we have an account of the observation of such solemnities as the Passover and the Feast of Tabernacles, Eze. 45:21,25. And surely sacramental occasions may be said to be such times. A person that duly consideres these things, will not be easily persuaded, that there ought to be no more solemnity in the breaking of the sacramental bread, than in asking a blessing at our ordinary meals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-anderson.html">John Anderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of Humiliation Days Before &amp; Thanksgiving Days After the Administration of the Lord’s Supper’</cite>, pp. 302-305 in Vindiciae Cantus Dominici… (Philadelphia, 1800)</span></figcaption>

— John Anderson, ‘Of Humiliation Days Before &amp; Thanksgiving Days After the Administration of the Lord’s Supper’, pp. 302-305 in Vindiciae Cantus Dominici… (Philadelphia, 1800)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Lord%E2%80%99s+Supper+is+justly+considered+as+peculiarly+solemn.+All+the+ordinances+of+God+are+holy%2C+as+they+have+a+holy+God+for+their+author%2C+are+to+be+observed+in+a+holy+manner%2C+and+are+appointed+means+of+promoting+holiness.+Yet+an+ordinance+may+be+said+to+be+more+solemn+in+respect+of+the+more+sensible+manifestation+which+God+makes+therein+of+his+glory%2C+in+respect+of+the+peculiarly+awful+warning+which+He+gives+against+a+rash+and+inconsiderate+manner+of+intermeddling+with+it%2C+in+respect+of+the+variety+of+holy+exercises+which+concur+in+the+right+observation+of+it%2C+and%2C+lastly%2C+in+respect+of+the+more+full+and+public+representation+of+the+communion+which+the+people+of+God+have+with+his+whole+Church.+That+the+Lord%E2%80%99s+Supper+has+a+greater+solemnity+in+these+respects+than+some+other+ordinances%2C+seems+to+have+been+hitherto+the+sense+of+the+whole+New+Testament+Church.+This+is+expressed+by+the+judicious+Mr.+Durham%2C+in+the+first+of+his+communion+sermons+%5BThe+Unsearchable+Riches+of+Christ+%281685%29%2C+A+Preparation+Sermon%2C+pp.+4-5%5D%2C+where%2C+speaking+of+the+words+of+institution%2C+he+says%3A+%E2%80%98Every+circumstance+speaks+out+a+solemnity+in+this+ordinance%2C+as+the+night+in+which+it+was+instituted%2C+the+same+night+in+which+He+was+betrayed%2C+and+his+jealousy+of+and+threatening+for+the+abuse+of+this+ordinance.+The+Lord%E2%80%99s+Supper+seems+dignified+with+an+eminence+above+all+other+gospel+ordinances%3A+1st%2C+in+reference+to+what+it+exhibits.+They+all+set+forth+love%2C+but+this+sets+forth+love+in+an+eminent+degree%2C+for+it+sets+forth+the+Lord%E2%80%99s+death%2C+wherein+the+most+eminent+degree+of+his+love+shines.+It+sets+forth+the+great+masterpiece+of+his+love%2C+his+actual+dying.+2ndly%2C+in+respect+of+the+excellent+benefits+communicated+in+it.+It+is+true+there+is+no+other+thing%2C+on+the+matter%2C+communicated+in+it%2C+than+in+the+Word+and+baptism%3B+yet+if+ye+look+to+the+words%2C+%E2%80%98Take%2C+eat%2C+this+is+my+body%E2%80%99%2C+they+hold+forth+Christ+Jesus+not+so+much+giving+any+particular+gift%2C+as+actually+conferring+Himself+in+his+death+and+suffering.+3rdly%2C+in+respect+of+the+manner+in+which+our+Lord+Jesus+makes+over+Himself%3A+For+there+is+herein+not+only+a+most+clear+view+of+the+slain+Savior%2C+and+of+covenanting+with+God%2C+but+also+a+clear+glance+of+heaven+upon+earth%2C+Jesus+Christ+and+his+people+mixing+%28so+to+speak%29+and+being+familiar+together%3B+He+condescending+not+only+to+keep+company+with+them%2C+but+to+be+their+food+and+refreshment%2C+and+giving+not+only+the+Word+to+their+faith%2C+but+Himself+%28as+it+were%29+to+their+sense%21+Insofar+as+the+mean%2C+whereby+He+communicates+Himself%2C+is+more+sensible%3B+it+is+by+his+Spirit+that+the+mean+is+made+effectual.+There+is+not+only+a+fixedness+of+faith+on+our+part%2C+but+a+sort+of+divineness+in+the+ordinance+itself%2C+as+it+were%2C+to+the+very+senses+of+the+believer.+%E2%80%98I+say+unto+you%2C%E2%80%99+says+our+Lord%2C+%E2%80%98I+will+not+drink+henceforth+of+the+fruit+of+the+vine%2C+until+the+day+when+I+shall+drink+it+new+with+you+in+my+Father%E2%80%99s+kingdom%2C%E2%80%99+where+He+seems+to+point+out%2C+that+in+this+ordinance%2C+He+has+a+more+special+way+of+keeping+communion+with+his+people%2C+bearing+a+resemblance+to+that+which+He+will+have+with+them+in+Heaven.%E2%80%99+That+there+is+a+peculliar+solemnity+in+the+partaking+of+the+Lord%E2%80%99s+Supper%2C+appears+from+the+concurrence+of+duties+requisite+to+the+right+performance+of+it.+%E2%80%98If+it+be+a+great+and+difficult+work%2C%E2%80%99+adds+the+same+eminent+divine%3A+%E2%80%98to+carry+rightly+on+an+ordinary+Sabbath%2C+or+in+prayer%2C+or+in+meditation%2C+how+difficult+must+communicating+be%2C+in+which+we+ought+to+have+all+these+joined+together%2F%E2%80%99+If+all+religious+duties+were+equally+solemn%2C+then+they+would+all+alike+require+preparation.+An+ejaculatory+prayer%2C+for+example%2C+would+require+another+duty+to+prepare+for+it%3B+and+that+duty+would+require+another%2C+and+so+on+without+end.+The+Old+Testament+Church+had+more+solemn+days%2C+such+as+that+on+which+the+children+of+Israel+stood+before+the+Lord+in+Horeb.+And+there+were+to+be+such+days+under+the+New+Testament+dispensation+also.+Hence%2C+in+the+vision%2C+which+we+have+in+the+latter+part+of+the+prophecy+of+Ezekiel%2C+and+which+judicious+interpreters+allow+to+be+an+emblematical+representation+of+the+New+Testament+Church%2C+we+have+an+account+of+the+observation+of+such+solemnities+as+the+Passover+and+the+Feast+of+Tabernacles%2C+Eze.+45%3A21%2C25.+And+surely+sacramental+occasions+may+be+said+to+be+such+times.+A+person+that+duly+consideres+these+things%2C+will+not+be+easily+persuaded%2C+that+there+ought+to+be+no+more+solemnity+in+the+breaking+of+the+sacramental+bread%2C+than+in+asking+a+blessing+at+our+ordinary+meals.%E2%80%9D%0A%0A%E2%80%94+John+Anderson%2C+%E2%80%98Of+Humiliation+Days+Before+%26+Thanksgiving+Days+After+the+Administration+of+the+Lord%E2%80%99s+Supper%E2%80%99%2C+pp.+302-305+in+Vindiciae+Cantus+Dominici%E2%80%A6+%28Philadelphia%2C+1800%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F69816f4464.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/69816f4464.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-lords-supper#:~:text=The%20Lord%E2%80%99s%20Supper%20is%20justly%20considered,a%20blessing%20at%20our%20ordinary%20meals&amp;text=The%20Lord%E2%80%99s%20Supper%20is%20justly%20considered%20as%20peculiarly&amp;text=in%20asking%20a%20blessing%20at%20our%20ordinary%20meals" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

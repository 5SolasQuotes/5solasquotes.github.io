<main class="wrap"><figure class="quote" id="q-22541cf5ab" data-kw="">
<blockquote><p>A minority within the Societies, such as Hamilton and Earlstoun, would continue to reject William’s kingship, but the majority, including their ministerial leadership, either tacitly or openly accepted it. That split proved to be fundamental and led to the great schism in the Societies in 1690, when Hamilton and a minority of the Societies refused to accept the Revolution settlement of Church and State, and, ultimately, publicly rejected William’s authority in the Sanquhar Declaration of 1692. (Walker, BP, I, 126; Shields, FCD, 411-2, 418-9.)… The Societies also took steps to secure the Revolution by offering military support…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-jardine.html">Mark Jardine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The United Societies: Militancy, Martyrdom &amp; the Presbyterian Movement in Late-Restoration Scotland</cite>, 1679 to 1688 PhD diss. (Univ. of Edinburgh, 2009), Conclusion, p. 240</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-0910074023" data-kw="">
<blockquote><p>…the Romans were guilty of differences in God’s service and despising and judging each other for them; The Corinthians were carnal in making parties and divisions; they defrauded each other and went to law before heathens. They had fornicators, Judaizing envious slanderers of Paul, heretical deniers of the Resurrection, such as eat in idols’ temples, or of their sacrifices: were drunk at, or before the sacrament. The Galatians are yet sharplier charged: Almost all the seven Churches, Rev. 2 and 3, had Nicolatians, or Jezabel’s doctrine, which God hated: and no Christian is called to separate from the communion of any one of all these; but commanded to amend, and live in unity, without divison.</p></blockquote>

</figure><figure class="quote" id="q-5da312d453" data-kw="">
<blockquote><p>We assent to all the Thirty-Nine Articles, except these about bishops and ceremonies; and we would not separate from the Church because of doctrinal mistakes in these things, if the owning of them were not imposed as the terms of our communion with her. But,” says he, “It is not so easy to persuade us that there is no just cause to withdraw from the communion of some particular parishes in England, where Arminianism or Socinianism is commonly taught, where the practice of godliness is ridiculed, and principles striking at the root of it are instilled into the hearers, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

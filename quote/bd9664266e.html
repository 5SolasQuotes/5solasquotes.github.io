<blockquote><p>‘there is a sin unto death’ that is, which certainly brings death with it, which is, the blasphemy against the holy Ghost, when any one denies the truth of the Christian doctrine, whereby he was enlightened and convinced by the Holy Ghost, and maliciously blasphemeth and persecuteth the same.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e4e257a4d2" data-kw="">
<blockquote><p>Hence also is the difference between sin pardonable and unpardonable, whereof the one is said to be a sin which is committed against the Father and the Son, that is every transgression of God’s law, whereunto repentance belongs, and therefore that which is pardonable not by the properties of it own nature, but by the grace and mercy of him against whom it is committed; the other is said to be a sin which is committed against the Holy Ghost, and therefore is called by an excellency in Scriptures the blasphemy of the Spirit and a sin unto death. Now, for the making of this sin, three things concur: First, the denial of the truth against knowledge and conscience. Secondly, a universal backsliding from God, and not a particular sin against the first or second table of the law. Thirdly, a rebellion sprung from a hatred of the truth, conjoined with a tyrannical, sophistical, and hypocritical oppugning (or withstanding). And of these conditions, there is a mutual knitting and sequel of the one with, and after the other. Further, it is called a sin against the Holy Ghost, not in respect of the divine essence, and person of the Spirit, but in respect of his office – that is, of grace, and illumination – whereof the Holy Ghost is properly the worker (or effecter); but it is said to be unpardonable for three causes: first, because of the just judgment of God, who suffers not his Spirit, which is the Spirit of truth, to be reproved of a lie. Secondly, because of impenitency, or the hardness to repent. Thirdly, because of the truth and the dignity of redemption, purchased by Christ. For there remains no other sacrifice after men have forsaken the sacrifice of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius-jr.html">Lucas Trelcatius Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes</cite></span></figcaption>

</figure><figure class="quote" id="q-ef21986ea3" data-kw="">
<blockquote><p>It [Heb. 10:26] tells you what sin it is, viz. ‘sinning wilfully after we have received the knowledge of the truth’: It limits to you why it is called a sin unto death, because there is no other way upon the committing of it, but a certain fearful expectation of judgment and fiery indignation. And it gives you some intimation why no praying for it: because [there is] no sacrifice for it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sin Unto Death, a Sermon’ on 1 Jn. 5:16</cite>, (1666) in Whole Works, ed. Pitman (1822), vol. 6, pp. 331-45, p. 1096</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>

</figure><figure class="quote" id="q-74f9659f55" data-kw="">

</figure><figure class="quote" id="q-24e5cfd6bc" data-kw="">
<blockquote><p>He does not forbid the faithful to pray for such (Estius, similarly Hammond), but unto that he does not venture to urge them, that is, that they might pray for them with the confidence of obtaining (Estius); that is to say, I do not venture to create a certain hope of obtaining (Menochius). I do not command prayers to be poured out for them (Grotius, thus Hammond), for there is no promise upon which such prayers might depend. Here you have the mystical sense of the passages in Jer. 7:16 and Eze. 14:14 (Grotius).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Synopsis of Interpreters, both Critical &amp; Otherwise, of the Sacred Scripture in The Exegetical Labors of the Reverend Matthew Poole</cite>, vol. 79, 1, 2, and 3 John, Jude (d. 1679; VA: Master Poole Publishing, 2013), on 1 John 5:16, p. 171</span></figcaption>

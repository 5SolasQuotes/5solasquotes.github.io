<main class="wrap"><figure class="quote" id="q-73c89c21ee" data-kw="">
<blockquote><p>CANON 21. Concerning nature and grace. As the Apostle most truly says to those who would be justified by the law and have fallen from grace, “If justification were through the law, then Christ died to no purpose” (Gal. 2:21), so it is most truly declared to those who imagine that grace, which faith in Christ advocates and lays hold of, is nature: “If justification were through nature, then Christ died to no purpose.” Now there was indeed the law, but it did not justify, and there was indeed nature, but it did not justify. Not in vain did Christ therefore die, so that the law might be fulfilled by him who said, “I have come not to abolish them but to fulfill them” (Matt. 5:17), and that the nature which had been destroyed by Adam might be restored by him who said that he had come “to seek and to save the lost” (Luke 19:10).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/second-council-of-orange.html">Second Council of Orange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canons And Decrees Of The Second Council Of Orange</cite>, (AD 529)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-e13818fd38" data-kw="">
<blockquote><p>13… And thus far there is the highest consensus among the Orthodox, although a certain dissensus intervenes in the explication of the material cause — some urging both the ἐνεργητική [energētikē, active] and the παθητική [pathētikē, passive] obedience, and conjoining satisfaction through obedience and through suffering; others seeking the material cause of our justification in satisfaction through suffering alone. 14. The foundation is safe among both parties. For both not only admit but also require the obedience of Christ perfectly rendered to the law for our justification; but they differ in the manner of explicating the matter. For some hold it to be the meritorious cause of our justification; others hold it to be the condition of the person and the causa sine qua non [indispensable cause] of meriting justification — namely, that it behoved us to have such a High Priest who was holy and undefiled, Heb. VII.26–27. Concerning which there is a certain dissensus of opinions, the unity of faith and charity being preserved, since both parties apprehend the whole Christ and Christ alone, and in Him whole and alone seek righteousness and life.</p></blockquote>

<blockquote><p>Controversy II: What is justifying faith? … Antithesis [of Romanists]: Justifying faith is one of the dispositions for justification; it is not a certain knowledge of the divine will nor a trust in divine mercy in Christ, but a simple mental assent, by which we accept the whole word of God, even without understanding it, as well as the traditions of the Roman Church. [The Reformed] Censure: 1. The definition of faith and many examples in Hebrews 11 prove that faith is a confident assent, that is, a trust in God that generates obedience. See Romans 4, where Abraham’s faith is discussed. 2. The phrases “believe in God” (Job 12 and 14; 1 Peter 1) and “hope and trust in God,” and similar ones in the Psalms, prove that faith is not a simple assent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio</cite>, (d. 1638) at Nosferatu’s Substack (2024)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

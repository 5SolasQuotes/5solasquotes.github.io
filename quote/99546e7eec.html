<blockquote><p>2. The wife is not to separate a toro &amp; mensa [from bed and table] from the excommunicated husband, nor the son from the excommunicated father; no positive law can cancel the Law of nature…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eded29dfcb" data-kw="">
<blockquote><p>The Judicial Law is entirely abrogated so far as it concerns the distinction of Jews from the Gentiles (Eph. 2:14-15) and the typical signification of the kingdom of Christ (Col. 2:17; Heb. 10:1). However, as far as it concerns a form of civil government, it is abrogated in some particular aspects. For whatever was a particular proper right, such as peculiarly concerned the Jews, of which sort was the law concerning the office of the Levites, as another concerning inheritances not being transferred from one tribe to another, all of this kind have ceased. But insofar as it concerned common right, enacted according to the law of nature for all men together, of which sort are the laws concerning the punishments of crimes, these same all remain. The reason is that it enters into the order of the Moral Law and is thus perpetual. It was prescribed to the Jews, not as Jews, as a peculiar people admitted into Covenant, but as men, by the Law of Nature, subject with the other nations. If the same conclusion is recognized by the rule of common law from other [countries’] legislators, or it is discovered to be framed in view of the precepts of the Decalogue: it is sanctioned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-alting.html">Heinrich Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘7th Place: of the Law of God’ in Common Places in The Scriptural Theology of Heidelberg</cite>, vol. 1, p. 112, trans. Adam Brink &amp; Travis Fentiman</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-f3d7b8db05" data-kw="">
<blockquote><p>Question 12: Must a judge and jury proceed secundum allegata &amp; probata, ‘according to evidence and proof’, when they know the witness to be false and the truth to be contrary to the testimony, but are not able to evince [prove] it? Answer: Distinguish between the negative and the positive part of the verdict or sentence: In the negative they must go according to the evidence and testimonies, unless the Law of the land leave the case to their private knowledge. As for example: They must not sentence a thief or murderer to be punished upon their secret unproved knowledge; They must not adjudge either moneys or lands to the true owner from another without sufficient evidence and proof; They must forbear doing justice because they are not called to it, nor enabled. But positively they may do no injustice upon any evidence or witness against their own knowledge of the truth: As they may not upon known false witness, give away any man’s lands or money, or condemn the innocent: But [they] must in such a case renounce the office: The judge must come off the bench, and the jury protest that they will not meddle or give any verdict (whatever come of it): Because God and the Law of Nature prohibit their injustice. Objection: ‘It is the Law that does it, and not we.’ Answer: It is the Law and you: and the Law cannot justify your agency in any unrighteous sentence. The case is plain and past dispute.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), pt 4, ch. 22, ‘Cases &amp; Directions Against Injurious Law-Suits, Witnessing and Judgment’, p. 149</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

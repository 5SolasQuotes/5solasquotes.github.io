<blockquote><p>XXX. These and many similar points [discussed above on Romanism generally] are elaborated at length by Louis de Molina in his Concord of Free Will with the Gifts of Grace, quest. 14, disp. 26. He first asserts that God concurs with secondary causes in their operations and effects in such a way that just as the secondary cause immediately elicits its operation and produces its term or effect, so God immediately influences with it in the same operation and produces the term or effect through that operation or action. Secondly, he asserts that when God concurs with secondary causes, He influences as a universal cause with an indifferent influence towards various actions and effects. This general influence is determined to specific kinds of actions and effects by the particular influence of the secondary causes, which varies according to the nature of each in acting. Just as the influence of the sun, which is also universal, is determined by the influence of a man to produce a human being, and by the influence of a horse to produce a horse. If the cause is free, it is in its power to influence in such a way that this action rather than that one is produced, such as willing rather than not willing or walking rather than sitting, and this effect rather than that one, namely this artifact rather than another. Or it may even suspend its influence entirely so that there is no action at all. Thirdly, he asserts that the influence of God through universal concurrence is not sufficient for the production of any effect without the particular influence of the secondary cause by which it is determined, nor is the particular influence of the secondary cause sufficient without the influence of God through universal concurrence by which it is assisted, which, according to the ordinary law, He never denies. These two influences mutually depend on each other to exist in nature. Indeed, there are not two actions but one numerically, which as it comes from God influencing in this way is called universal concurrence, but as it comes from the secondary cause, for example from fire causing heat, is called the concurrence or influence of the fire. This action is specified not because it is from God through universal concurrence but because it is from the fire with God cooperating through its particular power. XXXI. The doctors who hold this explanation of divine concurrence think they can easily show how such concurrence can be reconciled with the freedom of human actions. For since two kinds of freedom are usually attributed to the will—one concerning the exercise of the act and the other concerning its specification—this divine concurrence, as explained, prejudices neither. Not the former, which concerns the exercise, since this concurrence does not impose the necessity of acting on the will. For the will does not act because God acts but rather conversely, God acts because the will acts, although they both begin to act at the same moment in time and nature. Scholastic terms express this by saying that the will acts prior in nature to God, not by priority of the instant in which but of the order from which. XXXII. Although the will can do nothing at all without God concurring, according to the law established by God when He created it free, that concurrence is always available to it because God willed and decreed from eternity to concur with every work of the free will when it determines itself to act. Nevertheless, the will is equally free concerning the specification of its act. For that the will acts well or badly, avoids or seeks this rather than that, does not proceed from any power of divine concurrence but from the proper determination of the will, which freely uses the divine concurrence, indifferent in itself, to produce an action of this rather than that kind.</p></blockquote>

</figure><figure class="quote" id="q-8cf68e1dd6" data-kw="">
<blockquote><p>….we have seen that anything that exists or could exist other than God would have potentials that need actualization, parts that need to be combined, and an essence distinct from its existence, and would therefore be contingent. We have also seen that such things can exist, even for an instant, only insofar as they are caused by that which is purely actual, absolutely simple, subsistent existence itself, and absolutely necessary; and we have seen that there cannot in principle be more than one such cause. It follows that anything that exists or could exist other than God depends at every instant on God for its existence. Recall also the principle agere sequitur esse [action follows existence], according to which a thing’s attributes and activities cannot go beyond its nature. When we combine this principle with the thesis that the sheer existence of anything at any moment depends on God’s causing it to exist, we get the result that the operation or activity of anything at any moment also depends on God. For if a thing could not even exist for an instant apart from God, how could it act at any instant apart from God? If the thing has no independent capacity for existence, where could an independent capacity for action possibly come from? Existing, after all, is more fundamental than acting, since it is presupposed by acting. So, if a thing’s essence gives it no capacity even to exist apart from God, it cannot intelligibly give it power to act apart from God. So, everything that exists or could exist other than God depends at every instant not only for its existence, but also for its capacity to do anything, on God.</p></blockquote>

<blockquote><p>…the Thomists, with whom — with one exception — we Scotists who wish to be true disciples of Scotus agree. Therefore all the schools agree that Durand’s [pure free will] opinion is absurd, and they posit that God concurs immediately with the effects of his creatures — both necessary and free — through one and the same action. They likewise assert concordantly the subordination and dependence of created causes upon God, and they do not deny that God concurs in the material element — that is, the physical entity of the sinful act — without concurring in the formal element of sin.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…the Thomists, with whom — with one exception — we Scotists who wish to be true disciples of Scotus agree. Therefore all the schools agree that Durand’s [pure free will] opinion is absurd, and they posit that God concurs immediately with the effects of his creatures — both necessary and free — through one and the same action. They likewise assert concordantly the subordination and dependence of created causes upon God, and they do not deny that God concurs in the material element — that is, the physical entity of the sinful act — without concurring in the formal element of sin.”

— Francisco Macedo, Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Agreements, p. 373">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+Thomists%2C+with+whom+%E2%80%94+with+one+exception+%E2%80%94+we+Scotists+who+wish+to+be+true+disciples+of+Scotus+agree.+Therefore+all+the+schools+agree+that+Durand%E2%80%99s+%5Bpure+free+will%5D+opinion+is+absurd%2C+and+they+posit+that+God+concurs+immediately+with+the+effects+of+his+creatures+%E2%80%94+both+necessary+and+free+%E2%80%94+through+one+and+the+same+action.+They+likewise+assert+concordantly+the+subordination+and+dependence+of+created+causes+upon+God%2C+and+they+do+not+deny+that+God+concurs+in+the+material+element+%E2%80%94+that+is%2C+the+physical+entity+of+the+sinful+act+%E2%80%94+without+concurring+in+the+formal+element+of+sin.%E2%80%9D%0A%0A%E2%80%94+Francisco+Macedo%2C+Collations+of+the+Teachings+of+St.+Thomas+%26+Scotus%2C+with+the+Differences+between+the+Two%3A+with+the+Texts+of+Both+Faithfully+Presented%2C+and+the+Sentences+Subtly+Examined%2C+with+the+Commentaries+of+the+Interpreters%E2%80%A6+vol.+2+tr.+AI+by+Vertias+%28Padua%3A+Frambotti%2C+1671%29%2C+%2C+bk.+2%2C+Collation+9%2C+pp.+361-429+%7C+Agreements%2C+p.+373&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4e185def0a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4e185def0a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=the%20Thomists%2C%20with%20whom%20%E2%80%94%20with,in%20the%20formal%20element%20of%20sin&amp;text=the%20Thomists%2C%20with%20whom%20%E2%80%94%20with%20one%20exception&amp;text=without%20concurring%20in%20the%20formal%20element%20of%20sin" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b7e4f428d6" data-kw="">
<blockquote><p>How may we attribute this same work to God, to Satan, and to man as author, without either excusing Satan as associated with God, or making God the author of evil? Easily, if we consider first the end, and then the manner, of acting. The Lord&#x27;s purpose is to exercise the patience of His servant by calamity; Satan endeavors to drive him to desperation; the Chaldeans strive to acquire gain from another&#x27;s property contrary to law and right. So great is the diversity of purpose that already strongly marks the deed. There is no less difference in the manner. The Lord permits Satan to afflict His servant; He hands the Chaldeans over to be impelled by Satan, having chosen them as His ministers for this task. Satan with his poison darts arouses the wicked minds of the Chaldeans to execute that evil deed. They dash madly into injustice, and they render all their members guilty and befoul them by the crime.</p></blockquote>

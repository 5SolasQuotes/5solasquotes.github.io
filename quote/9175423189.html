<blockquote><p>After Christ, I pray tell me, how long did the churches continue without superstitious mixtures? I doubt you will find the Church has not been long free; but we do not find separation presently and nulling of ministers. As now men should do well to give us a precept or example out of the Word where ordinances have been dispensed true for the substance, though some human mixtures have been joined to them, that therefore they were iterated [repeated].</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cfca42e4d8" data-kw="">
<blockquote><p>But by reason of the short warning that they had, a multitude of the people of Ephraim, and Manasseh, Issachar and Zabulun had not cleansed themselves according to the Law in that behalf provided, Ex. 12; Num. 9, and therefore were in danger to be cut off, Lev. 7:20. In this regard they were in great distress, and in a sore strait, yet they thought it better to receive the sacrament, though they failed in some circumstances of their preparation, than to omit it until the next year, having wanted it so long before, whereupon they adventured to eat the Passover; …Hezekiah, in fear of God’s displeasure and in commiseration of the people that stood in danger of God’s plagues and punishments, falls to prayer for them and is instant with the Lord in that behalf: He saw their great desire to be made partakers of it; the pains that they had taken to come unto Jerusalem for that very purpose; and perceived a strange hand of God inclining their hearts so far… And thus he prayed unto God for them… The word that is translated ‘be merciful’ signifies thus much in effect, as if he had said, ‘The good Lord pardon and supply that which is wanting [lacking] in him that prepares his whole heart.’ And now they wanted not so much willingness, as time to prepare themselves…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper</cite>, (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20, p. 111</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-20727f9d68" data-kw="">
<blockquote><p>For although, as I said, I little approve it, yet I see that sometimes in these indifferent matters some things, although they be grievous and burdensome, are to be born so long as it is not permitted by law to deviate from them; lest, if we contend for them more bitterly than we ought, this may be a hindrance to the advancement of the Gospel, and those things which are in their nature indifferent may, by our vehement contention, be represented as ungodly. Now these things, unless I am deceived, bring with them two most heavy inconveniences. For, if we should first suffer the Gospel both to be spread abroad and to take deep root, men would perhaps be better and more easily persuaded to remove these outward appurtenances. While any one is sick, and is by little and little amending, he takes it very ill that certain slight and trifling things, as well in food as in drink, should be removed from him. But the same person, having recovered his health, rejects those things of his own accord as disagreeable and of little use. If England were first well and diligently instructed and confirmed in the most necessary heads of religion, she would not, in my opinion, at length take it in ill part that these things, however superfluous, should be removed. But at this time, since a change is being introduced in necessary points of religion, and that with so great difficulty, if we should also speak of those things as ungodly which are indifferent, the minds of almost all men would be so turned away from us, that they would no longer show themselves to be attentive and patient hearers of sound doctrine and necessary sermons… Do not however gather from hence that I think a minister of the Gospel should never strive to assert the truth of the Scriptures and of doctrines. This I do not affirm: [those] who daily come forward, both in public and private disputations, in the most weighty controversies for religion. But this I say, that these things which are of less moment ought not to be a hindrance through our contention… Further, if we proceed to oppose these indifferent things as destructive and ungodly, we condemn very many Churches that are not alien from the Gospel, and we too bitterly reprove innumerable Churches which are of old distinguished as most worthy of praise. I do not forget that the authority of Churches, whether present or past, ought not to be of such force, that by them the truth of God’s Word should be overborne: for that ought to remain unshaken and unmoved… But I contend that on account of things indifferent, this ought by no means to come to pass that churches should be condemned, or that we should speak unfavourably of them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gorham, Gleanings of a few scattered ears during the period of the Reformation in England</cite>, (London, 1857), Letter 53, ‘Martyr to Bishop [John] Hooper’, Nov. 4, 1550, pp. 189-90, 92, 94-96</span></figcaption>

</figure><figure class="quote" id="q-bc0b141c28" data-kw="">
<blockquote><p>To bring the lawfulness of known ordinances under dispute for some circumstances affixed has ever been of great advantage to Satan, whether in such disputes he prevails or not: For men are either beaten wholly off from the duty, or perform it with a more remiss and unsuitable spirit, which lies more directly in the way to prevent a blessing than the evils of others we ordinarily object… If for substance the duty be so evident as not to be liable to a dispute in itself (as this of hearing [preaching] is): then Satan fastens scruples about circumstances, which prevailing, we have as little benefit from the ordinance or duty as if it were not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Case of Great &amp; Present Use: Whether we may Lawfully Hear the now Conforming Ministers who are Re-ordained &amp; have Renounced the</cite>, [Solemn League &amp;] Covenant &amp; Some of them [are] Supposed to be Scandalous in their Lives, Considered &amp; Affirmatively Resolved (1672; 1677), Consideration 3, p. 25 Nye was a covenanting Independent, English puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<blockquote><p>Moses was not so well when he was in Midian, as if he had been in Canaan, yet better than when he was in Egypt: for though Jethro had not the worship of God pure in every respect, yet was not he an idolater. For then Moses would not have dwelt with him, nor yet have sacrificed with him, if he had offered to a strange God. Whence we learn two things: The first, that if we have the chief and principal points of religion with us although there may be some wants and defects, yet that we make much of God’s great blessing therein, and labor carefully and diligently to use them, showing ourselves thankful to God for them: so will the Lord in his due time bestow more blessings upon us, and minister that which is wanting unto us. Secondly, that the Lord will always have some to keep his truth, to the glory of his own name, and the condemnation of the wicked. Jethro’s religion may be tried by these notes:

1. That he rejoiced more for the deliverance of God’s people than for the promotion of his son.

2. Because he was careful to confirm his faith by the experience of them which had received greater graces.

3. Because his joy did break out into an open profession of sacrifice.

4. His divine speech and good counsel which he gave to Moses does testify that he was a pure worshipper of God: at the least he held the chiefest, and was not a novice in religion. By Jethro’s example we may learn to try our religion, if it be pure, then: [1.] It works in us a care to use all the means.

2. We take joy in them.

3. We express the fruits of it in our life.

4. We rejoice more at the prosperity of God’s people than at our own preferments or commodity.</p></blockquote>

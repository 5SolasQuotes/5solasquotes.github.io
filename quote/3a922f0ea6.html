<main class="wrap"><figure class="quote" id="q-3a922f0ea6" data-kw="">
<blockquote><p>By person, then, I mean a subsistence in the Divine essence,--a subsistence which, while related to the other two, is distinguished from them by incommunicable properties. By subsistence we wish something else to be understood than essence. For if the Word were God simply and had not some property peculiar to himself, John could not have said correctly that he had always been with God. When he adds immediately after, that the Word was God, he calls us back to the one essence. But because he could not be with God without dwelling in the Father, hence arises that subsistence, which, though connected with the essence by an indissoluble tie, being incapable of separation, yet has a special mark by which it is distinguished from it. Now, I say that each of the three subsistences while related to the others is distinguished by its own properties. Here relation is distinctly expressed, because, when God is mentioned simply and indefinitely the name belongs not less to the Son and Spirit than to the Father. But whenever the Father is compared with the Son, the peculiar property of each distinguishes the one from the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a> › <a href="../topics/the-trinity/the-persons/person-and-subsistence.html">Person and subsistence</a></span><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a> › <a href="../topics/the-trinity/the-persons/personal-properties.html">Personal properties</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c36511e0ac" data-kw="Father unbegotten">
<blockquote><p>However, the Holy Spirit speaking in the Scriptures does not merely propose one God to us but also teaches us the way to approach God. Therefore, God is revealed to us in three persons, namely the Father, the Son, and the Holy Spirit, so that we may know the path by which God is accessible. For if you consider God absolutely as Lord and Judge, that terrifying majesty presents itself to the mind, whose brilliance dazzles the eye, and the most righteous tribunal whose aspect strikes the conscience of men with sheer terror.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, VII</span></figcaption>

<main class="wrap"><figure class="quote" id="q-0fb1611fe8" data-kw="">
<blockquote><p>The Samaritans could show no Scriptural authority, no revelation of God, commanding and sanctioning their worship. Whatever it was, it was purely an invention of man, which God had never formally authorized or accredited. They had no warrant for believing that it was accepted. They had no right to feel sure that their prayers, praises, and offerings were received. … In contrast to the Samaritan religious system, our Lord declares that the Jews at any rate could show divine warrant and scriptural authority for all they did in their religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on the Gospels: John, Volume One</cite>, (1869; Edinburgh: Banner of Truth, 1987), p. 223.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f0574d4095" data-kw="">
<blockquote><p>…2 Chron. 29 [vv. 29-30], out of which no more can be drawn but that the people worshipped while the priests were yet offering the burnt-offering. Now the burnt-offering was but accidentally before the people in their worshipping, and only because it was offered at the same time when the song of the Lord was sung. Verse 27… Verse 36, Since then the song and the sacrifice were performed at the same time, we must note that the people worshipped at that time not because of the sacrifice which was a mediate worship, but because of the song of the Lord, which was an immediate worship. Now we all commend kneeling in an immediate worship. But this cannot content our Opposites, they will needs have it lawful to kneel in the hearing of the Word, purposely and with a respect to the Word preached, though this be a mediate worship only. Their warrants are taken out of Ex. 4:30-31; 12:27; 2 Chron. 20:18; Mt. 17:6. From the first three places no more can be inferred but that these hearers bowed their heads and worshipped after that they had heard the Word of the Lord; Neither shall they ever warrant bowing and worshipping in the act of hearing. In the fourth place we read that the disciples fell on their faces when they heard God’s own immediate voice out of the cloud: What makes this for falling down to worship at the hearing of the Word preached by men? How long shall our Opposites not distinguish betwixt mediate and immediate worship?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4, pp. 72</span></figcaption>

s://reformedbooksonline.com/posture-in-prayer/#:~:text=2%20Chron.%2029%20%5Bvv.%2029%2D30%5D%2C%20out,distinguish%20betwixt%20mediate%20and%20immediate%20worship&amp;text=2%20Chron.%2029%20%5Bvv.%2029%2D30%5D%2C%20out%20of%20which&amp;text=Opposites%20not%20distinguish%20betwixt%20mediate%20and%20immediate%20worship" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-00b42f7285" data-kw="">
<blockquote><p>Although we acknowledge the necessity of good works against the Epicureans, we do not on this account confound the law and the gospel and interfere with gratuitous justification by faith alone. Good works are required not for living according to the law, but because we live by the gospel; not as the causes on account of which life is given to us, but as effects which testify that life has been given to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 2 (P&amp;R Publishing, 1992–97), 17.3.15.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

— Francis Turretin, Other citations (work not named), ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 2 (P&amp;R Publishing, 1992–97), 17.3.15.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlthough+we+acknowledge+the+necessity+of+good+works+against+the+Epicureans%2C+we+do+not+on+this+account+confound+the+law+and+the+gospel+and+interfere+with+gratuitous+justification+by+faith+alone.+Good+works+are+required+not+for+living+according+to+the+law%2C+but+because+we+live+by+the+gospel%3B+not+as+the+causes+on+account+of+which+life+is+given+to+us%2C+but+as+effects+which+testify+that+life+has+been+given+to+us.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Other+citations+%28work+not+named%29%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger%2C+vol.+2+%28P%26R+Publishing%2C+1992%E2%80%9397%29%2C+17.3.15.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F00b42f7285.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/00b42f7285.html">Permalink</a><a class="src" href="https://heidelblog.net/2026/05/turretin-good-works-are-necessary-not-the-instrument-but-as-evidence-of-salvation/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-90fce1a686" data-kw="">
<blockquote><p>A pious Heart hath three happy ways of self-entertainment in solitary; three rare ways of being least alone, when most alone. The first way of self-entertainment, is the Ordinance of reading and searching the Holy Scriptures, the pure, perfect, and infallible Word and Will of Christ concerning us. There Christ hath prepared his rich feast of fat things full of marrow, and his Royal Banquet of heavenly Truths. There he sets forth the great varieties of sure Directions, precious Promises, high Examples, rare Experiences, and the help of all his holy Ordinances to feed and satiate the hungry and thirsty spirit.

The second way of self-entertainment, is Divine Meditation, by either pondering of spiritual things, for improving knowledge, and exciting practice; or by a weighing all other things whatever, for reducing them to a spiritual end and use. The third way of self-entertainment, is private Praying, such as is both bottomed and bounded by Christ’s will in his Word; such as is both prepared and assisted, made wise and warm by serious Meditation.

Meditation stands between the two Ordinances of Reading and Praying, as the grand Improver of the former, and the high Quickner of the latter, to furnish the mind with choice materials for prayer, and to fill the heart with holy fervency in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-ranew.html">Nathanael Ranew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Christian Reader in Solitude improved by divine meditation, or, A treatise proving the duty and demonstrating the necessity, excellency, usefulness, natures, kinds and requisites of divine meditation. First intended for a person of honour, and now published for general use</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-1b6e183838" data-kw="">
<blockquote><p>I confess that there have been wise men, that there have been philosophers of the ancients very eminently distinguished; there were also among them princes and legislators of most respectable genius and celebrated fame. But the principles of their philosophy were deficient, and besides, is there any one who can point out their influence or their efficacy? Can a single country be mentioned, a single city, a village, nay a single man, whom they have taught the true knowledge of God and the pure worship acceptable in his sight?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Revealed Religion</cite>, trans. William Crawford (1737; Belfast: James Magee, 1778), § 1, p. 25.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-03ef5595b5" data-kw="">
<blockquote><p>Many assume that the Continental Reformed had a loose view of the Sabbath, which allowed for people to engage in recreation, whereas the stuffy Puritans and Covenanters were legalists. We have previously pointed out that Henry Bullinger and Martin Bucer did not share this perspective. Johannes Wollebius gives us further reason to believe that the notion of a Continental Sabbath is probably a myth:

The Sabbath is profaned, 1. When we do the works of our outward calling needlessly, as when we make journeys or exact debts then, &amp; c. 2. When we spend the Sabbath in carnal works, as in gaming, dancing, revelling, idle talking, Stage-plays, and such like sins. 3. In idolatrous works.

Such a profanation is a most grievous sin, Exod. 31. 13, 14. Num. 15. 35. Neh. 13. 16. Jer. 17. 27.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The abridgment of Christian divinity</cite>, trans. Alexander Ross (3rd edn, London, 1660), p. 371.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>VI. Will-worship, when God is worshipped with a naked and bare good intention, not warranted by the word of God (Col. 2:23; 1 Sam 13:9,10, 13).1 Hitherto may we add Popish superstitions in sacrifices, meats, holidays, apparel, temporary and bead-ridden prayers,2 indulgences, austere life, whipping, ceremonies, gestures, gate, conversation, pilgrimage, building of altars, pictures, Churches, and all other of that rabble. To these may be added consort in music in divine service, feeding the ears, not edifying the mind (1 Cor 14:15).3 Justin Martyr in his book of Christian Questions and Answers 107: “It is not the custom of the Churches to sing their meter with any such kind of instruments etc. but their man is only to use plainsong.” …VIII. Corrupting of God’s worship, and that order of government, which he hath ordained for his Church: the which is done when anything is added, detracted, or any way against his prescript, mangled (Deut 12:32).4 This condemneth that Popish elevation of bread in the Lord’s Supper, and their administration of it alone to the people without wine, together with that fearful abomination of the Mass.5 NOTES 1. Col 2:23: “These have indeed an appearance of wisdom in promoting self-made religion and asceticism and severity to the body, but they are of no value in stopping the indulgence of the flesh” (ESV). 1 Sam 13:9,10,13: “So Saul said, “Bring the burnt offering here to me, and the peace offerings.” And he offered the burnt offering. As soon as he had finished offering the burnt offering, behold, Samuel came. And Saul went out to meet him and greet him…And Samuel said to Saul, “You have done foolishly. You have not kept the command of the LORD your God, with which he commanded you. For then the LORD would have established your kingdom over Israel forever.” (ESV). 2. “Temporary” may refer to time-serving (temporizing) or perhaps Romanist seasonal prayers in the church calendar. “Bead-ridden” refers to the use of the Romanist rosary. 3. 1 Cor 14:15 “What am I to do? I will pray with my spirit, but I will pray with my mind also; I will sing praise with my spirit, but I will sing with my mind also” (ESV).

4. Deut 12:32 “Everything that I command you, you shall be careful to do. You shall not add to it or take from it.” (ESV).

5. Spelling and punctuation modernized.</p></blockquote>

<blockquote><p>4. Zepperus, On the Sacraments, ch. 13, fol. 324-26, 328.

1. The furious clamors and persecutions of the Papists did not permit this reformation of ceremonies at the first: which were so violent and bloody, that it gave small or no leisure to the teachers and lights of the Church, neither was it safe for them to bend their care or cogitations this way.

2. The people were so drowned in the deep darkeness and idolatry of the Papacy that the amendment of ceremonies, and of external worship could not in those beginnings be undertaken. It was necessary to use doctrine, and to instruct the people of sundry and horrible errors, idolatry, superstitions and abuses, which the whole Papacy and Popish ceremonies have in their departure, that so all those ugly things might first be removed out of their minds, before they were removed from their sight. That which is not the work of one year, but a task of long season: For as ceremonies which are visible things and apprehended by the eyes do more affect and move than the invisible doctrine; So the people did closely stick to their accustomed ceremonies, and opposed themselves vehemently against the reformation of them: Even as we see at this day to come to pass, when as yet sound doctrine has prevailed and flourished for above these 80 years.

3. The Church in Popery was nothing else but a sick body: In which from the sole of the foot to the crown of the head, there was nothing sound and entire: Wherefore at the first beginning of reformation that whole chaos and abomination of error, and of Popish idolatry could not suddenly be perceived, but use and experience did daily manifest and teach every day more, than at the first.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623) | ‘Reformed Practices’, pp. 173-74</span></figcaption>

<blockquote><p>Thirteenthly, [it is superstition] that it is simply unlawful to use a form of prayer or to read a prayer on a book. Fourteenthly, that if a school-master impose a form upon a scholar, or a parent on a child, it makes it become unlawful.</p></blockquote>

<blockquote><p>In the course of time, then, the Father forsooth was born, and the Father suffered,—God Himself, the Lord Almighty, whom in their preaching they declare to be Jesus Christ. We, however, as we indeed always have done (and more especially since we have been better instructed by the Paraclete, who leads men indeed into all truth), believe that there is one only God, but under the following administration, or οἰκονομία, as it is called, that this one only God has also a Son, His Word, who proceeded from Himself, by whom all things were made, and without whom nothing was made. Him we believe to have been sent by the Father into the Virgin, and to have been born of her—being both Man and God, the Son of Man and the Son of God, and to have been called by the name of Jesus Christ; we believe Him to have suffered, died, and been buried, according to the Scriptures, and, after He had been raised again by the Father and taken back to heaven, to be sitting at the right hand of the Father, and that He will come to judge the quick and the dead; who sent also from heaven from the Father, according to His own promise, the Holy Spirit, the Paraclete, the sanctifier of the faith of those who believe in the Father, and in the Son, and in the Holy Spirit. That this rule of faith has come down to us from the beginning of the gospel, even before any of the older heretics, much more before Praxeas, a pretender of yesterday, will be apparent both from the lateness of date which marks all heresies, and also from the absolutely novel character of our new-fangled Praxeas. In this principle also we must henceforth find a presumption of equal force against all heresies whatsoever—that whatever is first is true, whereas that is spurious which is later in date. But keeping this prescriptive rule inviolate, still some opportunity must be given for reviewing (the statements of heretics), with a view to the instruction and protection of divers persons; were it only that it may not seem that each perversion of the truth is condemned without examination, and simply prejudged; especially in the case of this heresy, which supposes itself to possess the pure truth, in thinking that one cannot believe in One Only God in any other way than by saying that the Father, the Son, and the Holy Spirit are the very selfsame Person. As if in this way also one were not All, in that All are of One, by unity (that is) of substance; while the mystery of the dispensation is still guarded, which distributes the Unity into a Trinity, placing in their order the three Persons—the Father, the Son, and the Holy Spirit: three, however, not in condition, but in degree; not in substance, but in form; not in power, but in aspect; yet of one substance, and of one condition, and of one power, inasmuch as He is one God, from whom these degrees and forms and aspects are reckoned, under the name of the Father, and of the Son, and of the Holy Spirit. How they are susceptible of number without division, will be shown as our treatise proceeds.</p></blockquote>

<blockquote><p>71. Fourthly, they [Romanists] accuse us of blasphemy against the Son of God, for denying (as they say) that He is Deus ex Deo, God of God: against the doctrine of the Nicene Creed; and this they call the atheism of Calvin and Beza: a palpable slander: for neither Calvin nor Beza did ever imagine, much less utter the same in that sense which they lay to their charges: for let [Robert] Bellarmine their sworn adversary speak for them: ‘Calvin and Beza teach’ (says he) ‘that the Son is of Himself in respect of his essence, but not in respect of his Person, and they seem to say that the essence of the Deity in Christ is not begotten, but is of itself: which opinion’ (says he) ‘I see not why it may not be called Catholic.’ Here Bellarmine tells us truly what their opinion was, and does acknowledge it to be a true catholic doctrine: and yet in the same chapter he contemns Calvin for his manner of speaking of it and of intolerable sauciness for finding fault with the harshness of the phrase used by the Nicene Council, ‘God of God: Light of light’. Mark (I pray you) his absurdity, it is catholic, and yet it may not be spoken: it is true, and yet it is to be blamed. May not a catholic doctrine be spoken then? or must the truth be smothered? This is such an inconsequence as neither reason nor religion can any ways bear withal: and for his saucy dealing with the Nicene Council, all that ever he says is, that it is durum dictum, ‘a hard phrase’: yet so that he confesses it may receive a good and commodious interpretation if it be understood in the concrete, that Christ who is God, is of the Father that is God: the word being taken personally, and not in the abstract; as if the essence of the Deity of the Son should be from the Father, which is entirely subsisting, in, of, and by its own eternal, incomprehensible, and most glorious nature: and this without question was the true intendement of the Council; for else it had not confuted, but favored the blasphemous heresy of Arius, against whom it was assembled, which Calvin and Beza do not anyways cross, but onely bring unto it a fit and fauourable exposition. Thus we have Bellarmine, Calvin’s and Beza’s patron in this doctrine, though full ill against his will: and not only him, but Ribera and Gregory de Valentia, two other no mean Rabbies, both which do conclude that: ‘the Son as He is a Person, is of another; but as He is a simple ens [being], is not of another: and that the essence does not beget the essence, but the Father the Son;’ so that either they are slanderers of the truth, or their catholic doctrines may be atheism and blasphemy.</p></blockquote>

<blockquote><p>Works of Nature they call those which God produces in Nature by a certain common operation. And they are either of Creation, or of Conservation and Governance. … By this, however, no Persons of the Deity are excluded from creation, but only creatures and fictitious divinities. For the individual Persons are that one, true, living, and everlasting God, and in respect to them this work no less than the other external works is counted indivisible or common. Which the very history of creation openly testifies, when it introduces several Persons consulting and creating, Gen. 1:26. Scripture testifies elsewhere, where concerning the one God the creator it speaks by the name of makers, Isa. 54:5, in the plural number, Job 35:10. Moreover, the work of creation is attributed no less to the Son, John 1:3; Col. 1:16; Heb. 1:2; and to the Holy Spirit, Gen. 1:2; Job 26:13; 33:4; Ps. 104:30, than the Father claims it διὰ ῥητῶν [dia rhētōn, explicitly]. That the Father is sometimes peculiarly called creator and Lord of heaven and earth, Acts 4:24; Mt. 11:25, is all from the order and mode of operation in creation. For He created not from another but from Himself, inasmuch as He is the fountain of the Deity and of divine operations. The Son, however, and the Holy Spirit created not from themselves but from the Father, and the Father through them, 1 Cor. 8:6; Rom. 11:36.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Works of Nature they call those which God produces in Nature by a certain common operation. And they are either of Creation, or of Conservation and Governance. … By this, however, no Persons of the Deity are excluded from creation, but only creatures and fictitious divinities. For the individual Persons are that one, true, living, and everlasting God, and in respect to them this work no less than the other external works is counted indivisible or common. Which the very history of creation openly testifies, when it introduces several Persons consulting and creating, Gen. 1:26. Scripture testifies elsewhere, where concerning the one God the creator it speaks by the name of makers, Isa. 54:5, in the plural number, Job 35:10. Moreover, the work of creation is attributed no less to the Son, John 1:3; Col. 1:16; Heb. 1:2; and to the Holy Spirit, Gen. 1:2; Job 26:13; 33:4; Ps. 104:30, than the Father claims it διὰ ῥητῶν [dia rhētōn, explicitly]. That the Father is sometimes peculiarly called creator and Lord of heaven and earth, Acts 4:24; Mt. 11:25, is all from the order and mode of operation in creation. For He created not from another but from Himself, inasmuch as He is the fountain of the Deity and of divine operations. The Son, however, and the Holy Spirit created not from themselves but from the Father, and the Father through them, 1 Cor. 8:6; Rom. 11:36.”

— Johann H. Alting, The Scriptural Theology of Heidelberg, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWorks+of+Nature+they+call+those+which+God+produces+in+Nature+by+a+certain+common+operation.+And+they+are+either+of+Creation%2C+or+of+Conservation+and+Governance.+%E2%80%A6+By+this%2C+however%2C+no+Persons+of+the+Deity+are+excluded+from+creation%2C+but+only+creatures+and+fictitious+divinities.+For+the+individual+Persons+are+that+one%2C+true%2C+living%2C+and+everlasting+God%2C+and+in+respect+to+them+this+work+no+less+than+the+other+external+works+is+counted+indivisible+or+common.+Which+the+very+history+of+creation+openly+testifies%2C+when+it+introduces+several+Persons+consulting+and+creating%2C+Gen.+1%3A26.+Scripture+testifies+elsewhere%2C+where+concerning+the+one+God+the+creator+it+speaks+by+the+name+of+makers%2C+Isa.+54%3A5%2C+in+the+plural+number%2C+Job+35%3A10.+Moreover%2C+the+work+of+creation+is+attributed+no+less+to+the+Son%2C+John+1%3A3%3B+Col.+1%3A16%3B+Heb.+1%3A2%3B+and+to+the+Holy+Spirit%2C+Gen.+1%3A2%3B+Job+26%3A13%3B+33%3A4%3B+Ps.+104%3A30%2C+than+the+Father+claims+it+%CE%B4%CE%B9%E1%BD%B0+%E1%BF%A5%CE%B7%CF%84%E1%BF%B6%CE%BD+%5Bdia+rh%C4%93t%C5%8Dn%2C+explicitly%5D.+That+the+Father+is+sometimes+peculiarly+called+creator+and+Lord+of+heaven+and+earth%2C+Acts+4%3A24%3B+Mt.+11%3A25%2C+is+all+from+the+order+and+mode+of+operation+in+creation.+For+He+created+not+from+another+but+from+Himself%2C+inasmuch+as+He+is+the+fountain+of+the+Deity+and+of+divine+operations.+The+Son%2C+however%2C+and+the+Holy+Spirit+created+not+from+themselves+but+from+the+Father%2C+and+the+Father+through+them%2C+1+Cor.+8%3A6%3B+Rom.+11%3A36.%E2%80%9D%0A%0A%E2%80%94+Johann+H.+Alting%2C+The+Scriptural+Theology+of+Heidelberg%2C+vol.+1+%28d.+1644%3B+Amsterdam%3A+Jansson%2C+1646%29%2C+Locus+5%2C+%E2%80%98On+Creation%E2%80%99%2C+trans.+AI+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F899d6c24a5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/899d6c24a5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-trinity#:~:text=Works%20of%20Nature%20they%20call%20those,them%2C%201%20Cor.%208%3A6%3B%20Rom.%2011%3A36&amp;text=Works%20of%20Nature%20they%20call%20those%20which%20God&amp;text=Father%20through%20them%2C%201%20Cor.%208%3A6%3B%20Rom.%2011%3A36" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-441a0030a2" data-kw="Trinity fundamental worship">
<blockquote><p>God has revealed himself as one in essence, three in persons (viz., the Father, the Son, and the Holy Spirit). Thus he who does not acknowledge and believe the Trinity has not the true God, but has erected for himself an idol in place of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.24.8</span></figcaption>

</figure><figure class="quote" id="q-738fce26aa" data-kw="">
<blockquote><p>The problem with EFS is not Arianism, but the fact that it entails tritheism. Advocates of EFS are… replacing terms like ‘unbegotten’ and ‘begotten’ with the ideas ‘authority’ and ‘submission’… EFS is more in the line of what might be called polytheistic homoiousianism, whereby the Father and the Son have distinct natures, but each is still eternally divine… Because Chalcedonian Christology insists that Jesus has two natures but only one hypostasis, dyothelitism [the orthodox doctrine that Christ has a divine will and a distinct human will] as a development of Chalcedonian Christology necessitates the recognition that a will must be a property of nature [and not the Person] in order for there to be two wills in Christ. To posit such terms as ‘obedience’ and ‘submission’ that imply a distinction of wills between the Father and the Son while affirming dyothelite Christology entails a distinction of natures between the Father and Son (and Spirit) resulting in tritheism… After this historical account, a word study of the term ‘submission’ will demonstrate that the term clearly implies an activity of the will yielding to another will and should therefore be rejected as an eternal property of a divine hypostasis.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/butner-jr-d-glenn.html">D. Glenn Butner Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Eternal Functional Subordination and the Problem of the Divine Will’ 19</cite>, pp. in JETS 58/1 (2015) 131–49 The article is also here., p. 132-3</span></figcaption>

<main class="wrap"><figure class="quote" id="q-fbae09f509" data-kw="">
<blockquote><p>Sickness, in the very nature of things, can never be anything but trying to flesh and blood. Our bodies and souls are strangely linked together, and that which vexes and weakens the body can hardly fail to vex the mind and soul. But sickness, we must always remember, is no sign that God is displeased with us; nay, more, it is generally sent for the good of our souls.

It tends to draw our affections away from this world, and to direct them to things above. It sends us to our Bibles, and teaches us to pray better. It helps to prove our faith and patience, and shows us the real value of our hope in Christ. It reminds us betimes that we are not to live always, and tunes and trains our hearts for our great change. Then let us be patient and cheerful when we are laid aside by illness. Let us believe that the Lord Jesus loves us when we are sick no less than when we are well.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on John: Volume 2</cite>, (1869; Edinburgh: Banner of Truth, 1987), pp 257-58.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0403f30cb2" data-kw="">
<blockquote><p>For we are as much obliged to believe non-fundamentals that are clear (as that there were eight persons saved in the ark, and the old world drowned with waters, Sodom burnt with fire), as to believe fundamentals, that there is no name whereby men may be saved, but by the name of Jesus, for the Authority of God speaking in his Word and his command does equally oblige to both; but there is no such necessity so absolute in believing non-fundamentals, as in believing these, without the knowledge whereof, we cannot be saved. But it never follows that errors in non-fundamentals published and taught to the ruin of the souls of many, they having such a strong connection and influence on the knowledge of fundamentals, are to be tolerated since our sinning here does as equally and strongly strike against the authority and express command of God (at least in most things of that kind) as in points fundamental; and therefore the magistrate, who is to look to the honor of God as a Christian, and peace of societies in all, is as much obliged to punish clearly opened, non-fundamental, as fundamental, false doctrines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, ... (London, 1649), ch. 10, p. 124</span></figcaption>

</figure><figure class="quote" id="q-f02898842e" data-kw="">
<blockquote><p>Sept, 17, 1585 Lyttis of the deacons [servants] elected. Henry Nesbet and William Nesbet, bailies, Nicoll Uddert, Dean of Guild, James Ros, Thesaurer [Treasurer], William Littill, Androw Sclater, George Smyth, Tailor [Jailor?], of the Council, and Jhonn Stevinsoun, deykin [deacon/servant?] of the weavers, remembering that since the beginning of this present pestilence they have remained within this burgh constantly, sustained the burdening of the offices laid upon them unto this hour, with the loss and death for the most part of diverse of their children, servants, and family, and not without the extreme danger of their own lives, most eminently known unto all men, the rest of their brethren of the council and deykins [deacons/servants], which were no less astricted, oblist [obliged], and sworn to assist and take care of this commonwealth, having deserted their places and forsaken their offices, contrary to their oaths and allegiance made and given, and yet continuing has not repaired to this burgh at this most necessary time, approached and appointed to convene and surrogate others in their room, whereby the whole estate of this burgh is appearing to fall in confusion; Therefore…</p></blockquote>

</figure><figure class="quote" id="q-e6f79cad8b" data-kw="">
<blockquote><p>…neither can he [an opponent] be ignorant of that which he has so often read and learned of your most godly writings, that it pertains not to the prince either to prescribe religion to the kirk or discipline to the pastors thereof, but by his authority to confirm both the one and the other, appointed by God, and sincerely declared out of his Word by the ministry of his servants; to revenge and punish all corrupting of clean doctrine, contempt of holy discipline, and perturbation of lawful order (for which use and purpose he has received the sword), to decore the Assemblies, if need be, with his presence; to arm the innocency of the ministry by his safe-guard and defense; if there arise controversies among the pastors, sometimes to compose and agree the same by his authority interpouned; to promove, by good laws made for that effect these things which are lawfully constituted by the Assemblies, and to do many other things for the weale of the kirk which were long to rehearse, and unneedful. But far otherwise does he sit in the synods among the pastors than he does in the throne of the kingdom among the estates: here to make laws for subjects and command, but there to receive laws from God and to obey. And albeit that some things be called ecclesiastical, and other things civil, and the civil appertain to the commonweal, and the other to the kirk; yet it is not so much to be considered what things are handled, as how, seeing the knowledge of one and the self-same thing one way, and in some respect, appertains to the magistrate, and another way to the senate ecclesiastical. And yet such a matter neither does the kirk civilly, nor the counsel or parliament ecclesiastically entreat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-melville.html">Andrew Melville</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘To Pastors of the Kirk of Geneva &amp; Zurich’</cite>, pp. 165-66 in David Calderwood, History of the Kirk of Scotland, vol. 4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ebe86ae8b9" data-kw="">
<blockquote><p>That making of pictures of creatures, which are visible or may be comprehended, or historical fancies (to speak so) such as the senses and elements use to be holden forth by (which are rather hieroglyphics than real pictures) these I say, are not simply unlawful, but are so when they are abused (so Solomon made images of lions for his use, and thus the gift of engraving and painting as well as others which God has given to men, may be made use of, when (as has been said) it is not abused)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, … (London, 1675), 1st Commandment, p. 54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<blockquote><p>2. We then might well suffer the images of Jupiter, Dagon and Ashtarosh to stand before the people publicly, so [long as] they do no harm, and Papists and Lutherans say the images of Christ and the saints do no harm when the pastors carefully teach the people that there is no deity nor Godhead dwelling in them.</p></blockquote>

</figure><figure class="quote" id="q-e4ce59d60d" data-kw="">
<blockquote><p>All confidence reposed in creatures … is evidently opposed to a correct knowledge of God, since he who places his trust in creatures makes for himself many gods. Hence God expressly condemns in his word all those who repose their confidence either in men, or in power and riches, or in any created object. Avarice, or covetousness, is included in this vice, and condemned.… Idolatry … There are two forms or species of idolatry. One is, when another beside the true God is professedly worshiped, or, when that is worshiped for God which is no God.… The other form of idolatry is when we do not professedly worship another God, but err in the kind of worship we render unto him.… Those who worship God otherwise than he will be worshipped, imagine another God, one differently affected from what the true God is; and in this way they do not worship God, but a figment of their own brain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, on the First Commandment (creature-trust and forms of idolatry)</span></figcaption>

</figure><figure class="quote" id="q-a585a8e6ca" data-kw="">
<blockquote><p>I appeal to the conscience of every Christian, whether we (avoiding the occasion of idolatry) tend any whit to paganism, as the Papists by their devices do, or whether we (by removing all images, and consequently the cross too) do derogate from Christ and from His passion as they do, which, having the material cross, cannot come to the knowledge and faith of The Crucified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-calfhill.html">James Calfhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to John Martiall’s ‘Treatise of the Cross’, ‘To the Reader’</cite>, p. 51</span></figcaption>

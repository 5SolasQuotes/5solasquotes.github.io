<blockquote><p>To the infant seed of the righteous too, this early dedication is an eminent advantage. While in unconscious weakness, they are brought within the pale of that society to which the Lord is a wall of fire round about, and the glory in the midst, they are introduced to the fellowship of “the excellent of the earth,” and commended to their prayers.

A pledge the most solemn is publicly given before many witnesses for their training for heaven. The seal of redeeming love is applied to them, they are placed in the arms of the compassionate Shepherd of Israel, and are taken engaged wholly to be the Lord’s.

Although baptism is not regeneration, we deny not that this great change may sometimes accompany the outward ordinance; and we doubt not, that the God of the families of Israel frequently remembers to his people for good, the covenant of their youth. Like a stream running under ground, blessings springing from this source afterwards encompass their lot, and refresh their souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Commendation of Abraham, or, Parental Duties; and the Blessing Resulting from their Faithful Performance</cite>, (Edinburgh: William Whyte &amp; Co., 1844), pp 25-26.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2c2272def6" data-kw="">
<blockquote><p>We do make &amp; gather the fourth argument upon the strength &amp; force of circumcision, in stead whereof, baptism is in the church of Christ. As many as were the servants of God, did afore all things, labour &amp; endeavour themselves, to circumcise their children. Josu. v. Exo. iiii. The Apostles were the most faithful ministers of god: Then did not they omit or leave the thing, that was not brought in, in stead of the circumcision, Ergo, they did baptise, not only them that were of age, but also children.

Fifthly we do thus reason upon the use &amp; custom of the Apostles. The Apostles of Christ did direct all their doings to the conveniency &amp; example of the old testament.

This we do prove by the iiii. Evangelists, the Acts of the apostles, by the epistles of the Apostles, Rom. xv. ii. Cor. ii. ii. Tim. iii. ii. Peter i. chap. Ergo, they did order baptism after the Analogy and figure of the old Testament. The going through the red sea, was a type &amp; figure of the baptism that was to come i. Cor. x. cha. Children were in the figure (for both men and women went through with their children). Ergo the apostles did not deny baptism unto the children. The custom &amp; manner of the scripture (which custom and manner is used almost among all nations) is not to rehearse by name, women &amp; children, and yet nevertheless it doth include them, for in the name of the father of the family, or of the good man of the house, all his whole family is comprehended, as in the chief or head. If this were not, women should be in no small jeopardy, if therefore they were not of god, because that they be not circumcised. All these things are done, by the means &amp; help of a figure that is called Synecdoche.

The sixth argument shall be taken out of the manifest and express testimonies of the apostles. The apostles did baptise all whole households and families, ergo they did baptise children also, for the children are in the number of the family or household. This we do prove by the xvii of Gene. For Abraham doth circumcise all the male children that were in his house. For he understood the promise of God, that saith. I shall be thy God, &amp; the God of thy seed. Likewise in the new Testament, when the goodman of the house, had herd &amp; believed the gospel, that is to say, that God was his God, &amp; the God of his seed also, he caused all them that were in his house both great and small, to be baptized.

Thus the apostles did baptize whole households and families. That the children do pertain unto the father’s household &amp; family, it is plain &amp; manifest by the xii. of Exodus &amp; ii. of the Acts: this do I inculcate &amp; beat the oftener into men’s heads, because that I see the Anabaptists to be at this point that they do exclude the children from the family &amp; household. for they can not deny but the whole households were baptized by the Apostles. But who doth not see, that this cometh of mere contention?

For though they could prove that there were no children at all in the families &amp; households, that the apostles did baptise, yet had they not proved that all families or households were, or be without children: wherefore we do make again our argument after this manner. The Apostles baptized all whole households, ergo, they did baptise children, saith the children are the principal &amp; chief part of the family &amp; household.

But let us put the case, that there were no children in those families &amp; households, that the Apostles did baptise, yet do they pertain &amp; belong to the household, &amp; are reckoned in it, and if there had been any, they would have baptized them. For they did baptise the whole household. The fault then should not have been in the Apostles nor in the children, that their were not baptized: but this had been the cause that they had been baptized, because that there were none: For if they had had children they would have baptized them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A most sure and strong defence of the baptism of children, against [the] pestiferous sect of the Anabaptists</cite>, trans. John Heron (Worcester: John Oswen, 1551), unpaginated.</span></figcaption>

</figure><figure class="quote" id="q-8ded7cc3b8" data-kw="">
<blockquote><p>With regard to the efficacy of the sacraments, we think that they do not produce grace, nor have any inherent power of conferring or bestowing it, but are only signs and seals, which, lawfully used, seal grace, and exhibit it to the faithful;—God by his Holy Spirit really working the power, and fulfilling in the faithful, whatsoever he promises and signifies by the signs; hence they have no efficacy except towards believers, for whose benefit they were appointed. Now we prove that the sacraments do not bestow grace, first, because grace is the effect of the Spirit only… Secondly, because the sacraments would thus physically contain grace in them, or grace would be tied to the sacraments, which is absurd, for as many are saved without, so many are condemned with, the sacraments,—Simon Magus, for instance. Thirdly, because nothing that is corporeal has power to penetrate to the soul.</p></blockquote>

<blockquote><p>Baptism is not a means of regeneration, as the Lord’s Supper is of sanctification. … Paul, Cornelius, and the eunuch were regenerated before they were baptized.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dogmatic Theology</cite>, on Baptism</span></figcaption>

</figure><figure class="quote" id="q-024d666a76" data-kw="">
<blockquote><p>But frantic fellows do both unskillfully and also wickedly impugn baptizing of infants under colour hereof. Why was it meet that faith should go before baptism in the eunuch? To wit, because seeing that Christ marketh those alone which are of the household of the Church with this note and mark, they must be ingrafted unto the Church who are to be baptized.

And as it is certain that those who are grown up are ingrafted by faith, so I say that the children of the godly are born the children of the Church, and that they are accounted members of Christ from the womb, because God adopteth us upon this condition, that he may be also the Father of our seed. Therefore, though faith be requisite in those which are grown up, yet this is untruly translated unto infants whose estate is far unlike. …

I believe that Jesus Christ. As baptism is grounded in Christ, and as the truth and force thereof is contained there, so the eunuch setteth Christ alone before his eyes. The eunuch knew before that there was one God, who had made the covenant with Abraham, who gave the law by the hand of Moses, which separated one people from the other nations, who promised Christ, through whom he would be merciful to the world. Now he confesseth that Jesus Christ is that Redeemer of the world, and the Son of God; under which title he comprehendeth briefly all those things which the Scripture attributeth to Christ.

This is the perfect faith whereof Philip spake of late, which receiveth Christ, both as he was promised in times past, and also showed at length, and that with the earnest affection of the heart, as Paul will not have this faith to be feigned. Whosoever hath not this when he is grown up, in vain doth he boast of the baptism of his infancy. For to this end doth Christ admit infants by baptism, that so soon as the capacity of their age shall suffer, they may addict themselves to be his disciples, and that being baptized with the Holy Ghost, they may comprehend, with the understanding of faith, his power which baptism doth prefigure.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-d9f8a76d35" data-kw="">
<blockquote><p>7th Problem. Whether therefore out of the natural law, as contradistinguished from supernatural, the rule and way of worshipping God is able to be deduced or subsumed under it? Response: I deny. Indeed, in general and indefinitely in what way God is to be worshipped, and negatively, in what way He is not to be worshipped, in many things it is able to be shown from there; but the natural worship of God, positively and in the species, now as modified after the Fall, is not able to be explicitly and definitively subsumed under it or deduced from it, much less instituted worship. This is to be expected, therefore, from supernatural revelation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, (Utrecht, 1648 ff.), | vol. 1, 21. ‘Appendices to… on the Authority &amp; Righteousness of God, pt. 2’, p. 398, 7th Problem</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-722b31153c" data-kw="">
<blockquote><p>The sorts of this worship are twofold:

1. Solemn.

2. Common. The solemn worship is that whereto men do wholly give themselves, setting themselves apart from all other things to attend it wholly. The common is that which is to be performed to God jointly in and with our other affairs, so far forth as in them we have anything to do with Him or any thing of his.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London: Lee, 1654), bk. 9, ch. 4, ‘3rd Commandment’, p. 789</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-926b5fe04f" data-kw="">
<blockquote><p>First, that God offers to the men of this world, helps and means, either of the knowledge of God in Nature, or of grace in Christ: and that to this end, to lead them to repentance and salvation… Thus God offered to the carnal Israelites means of grace to purge them, to turn them, Prov. 1:13, to gather them, Mt. 23:37, to convince them, Jn. 16:8-9, to draw them with cords of man and bands of love, Hos. 11:4, to dress them to bring forth good fruit, Isa. 5:4. Secondly, that the means God uses for these good ends are in some measure sufficient (if they be not hindered by men) to bring them to the attainment of these ends: for when God says Himself, He uses these means for these ends; for us to say, these means are not sufficient for these ends, seems to me to derogate from the wisdom and sufficiency of God, whose works are all of them perfect, Deut. 32:4, and so sufficient for the ends for which He wrought them. Yet God forbid I should doubt of that which our Savior tells the Jews, ‘No man can come to Christ, except the Father draw him,’ Jn. 6:44, by the same almighty power and authority whereby He sent Christ into the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. Cotton’s clearing certain doubts concerning Predestination together with an Examination thereof</cite>, ... (London, 1646), 5th Doubt, Question 5, pp. 207-8</span></figcaption>

</figure><figure class="quote" id="q-86e20c4717" data-kw="">
<blockquote><p>Of all tyrannies, a tyranny sincerely exercised for the good of its victims may be the most oppressive. It would be better to live under robber barons than under omnipotent moral busybodies. The robber baron’s cruelty may sometimes sleep, his cupidity may at some point be satiated; but those who torment us for our own good will torment us without end for they do so with the approval of their own conscience. They may be more likely to go to Heaven yet at the same time likelier to make a Hell of earth. This very kindness stings with intolerable insult. To be ‘cured’ against one’s will and cured of states which we may not regard as disease is to be put on a level of those who have not yet reached the age of reason or those who never will; to be classed with infants, imbeciles, and domestic animals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-s-lewis.html">C.S. Lewis</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God in the Dock: Essays on Theology</cite>, (Making of Modern Theology)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

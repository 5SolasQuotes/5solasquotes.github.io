<main class="wrap"><figure class="quote" id="q-6d892cd305" data-kw="">
<blockquote><p>We must know God as the Father of Christ; we must know him in that relation to Christ, without which knowledge we can have no right conceptions of the economy of redemption, because all proceeds from the Father through the Son. That which is the greatest stumbling-block in the text is that clause, ‘thee the only true God,’ whereby some would exclude the deity of Christ.

Christ prays to the Father, and acknowledgeth him the only true God; if the Father therefore, say some, be the only true God, then Christ is not God, and they tell us that Christ is Deus factus, Deus constitutus. But to say a made God, is as great nonsense as to say an uncreated creature. Both carry a contradiction in the terms. The Scripture doth frequently and plainly assert the deity of Christ: no creature can be equal with God. But Christ was ‘in the form of God,’ and ‘thought it no robbery to be equal with God,’ Philip, ii. 6.

He was equal to God in his deity, though inferior to God in his humanity; the form of God stooped to the form of a servant, but the form of a servant despoiled him of nothing essential to the form of God; he ceased not to be what he was before, when he became in the womb of the virgin what he was not before. ‘All things that the Father hath are mine,’ saith Christ, John xvi. 15; what is more the Father’s than his essence and deity? The essence, therefore, and deity of the Father is the essence and deity of the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>, A Discourse on the Knowledge of God</cite>, in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-42428f32bf" data-kw="">
<blockquote><p>From this [popish] bondage we were delivered at the Reformation; but though the Fathers of Protestantism escaped the worst errors of the Church of Rome, they were tempted into an imitation of the exclusive spirit of Popery. Luther himself, when he refused to give the right hand of Christian fellowship to the Fathers of the Swiss Church, upon a point which he had not at first regarded as essential, laid the foundaton of the division between the Lutheran and the Reformed Churches.

The example has been followed in breaking down Churches into minor subdivisions throughout Europe and in the New World; and a want of zeal for external as well as internal unity has hitherto been the weakness and the reproach of Protestantism. It has exhibited itself both in the active and passive forms above referred to; the former being chiefly manifest in powerful communities (especially, though not exclusively, in connection with the State), in laying down conditions of communion upon topics which they own to be indifferent, but which are viewed as sinful by others who are thus thrust forth in segregation.

While the passive form has naturally been resorted to by smaller and less influential sects, in erecting, as they have sometimes silently done, partitions of proud or sullen seclusion. And in this way the Reformed Churches, not only in different countries, but even in the same land, present themselves to the eye, rather as separate and independent kingdoms, than as constituting merely different cantons and dependencies of one confederate commonwealth, the united members of one compact body politic.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-welsh.html">David Welsh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Limits and Extent of the Right of Private Judgment: Being the Substance of a Sermon, Preached in the Church of St Giles on Thursday, the 18th day of May, 1843</cite>, (Edinburgh: John Johnstone, 1843), pp 24-25.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

</figure><figure class="quote" id="q-c30b609950" data-kw="Sabellius modalism">
<blockquote><p>Next Sabellius arose, who counted the names of Father, Son, and Holy Spirit, as almost nonentities; maintaining that they were not used to mark out some distinction, but that they were different attributes of God, like many others of a similar kind. When the matter was debated, he acknowledged his belief that the Father was God, the Son God, the Spirit God; but then he had the evasion ready, that he had said nothing more than if he had called God powerful, and just, and wise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.4</span></figcaption>

</figure><figure class="quote" id="q-f4c3cb2fc7" data-kw="">
<blockquote><p>This Truth concerning the blessed and glorious Trinity, being so often insisted on here, and coming so near to the nature of God Himself, it cannot but be exceedingly necessary for Christians to be through in the faith thereof: yet it is questioned of late, whether it be to be accompted a fundamental point of Faith or not?

I say, this of late is questioned by Socinus, and the favourers of a boundless untolerable Toleration: for, of old it was most sacredly received as such, amongst the Ancients, as the Creeds that are called Apostolic, Nicene, and that of Athanasius, do manifest: But this Engine the Devil drives, first, to make the most necessary Truths indifferent, that then he may the more easily engage opposers to quarrel the very Truth of them it self; but we conceive, whatever it was of old before Christ, yet now it is to be looked on, not only as a Truth, which is clear from the Word, but also as a fundamental Truth; which being shaken, would overturn Christianity, and the way of Salvation that the Lord hath revealed in His Gospel.

This is not to be extended to a rigid degree of knowledge in this wonderful Mystery, but to so much clearness in this Truth from the Word, as may be a ground to Faith in the thing it self. And that this is necessary, as a fundamental, we think ariseth clearly from these three grounds. 1. That Truth, without which the true God cannot be taken up, believed in, and worshipped, is a fundamental Truth; but, this Truth of the Trinity of Persons, and Unity of the Godhead, is such, that without it, that God, which is proposed in the Word, and is the only true God, and the object of all Worship, can neither be taken up, believed in, nor worshipped rightly: Ergo, &amp;c. because the true God is One, and yet Three Persons; and as such, hath proposed Himself to be known and worshipped.

2. That Truth without which the work of Redemption would be overturned, is fundamental; But this is such: for, by taking away the Mystery of the Trinity, they take away the Godhead and Personality of the Mediator, and so do enervate His satisfaction. And, as on the former accompt, the true God is otherwise conceived than He is in Himself; so, in this respect, the Mediator is made a quite other thing. And, can any thing be fundamental, if this be not?

3. The way that God hath laid down in His Worship, requireth this, seeing in Baptism there is particular and express mentioning of these Three, the Father, Son and Spirit, as the Superior, to whom they that are Christian Soldiers, should be lifted and enrolled: and so we may accompt of all after-worship; seeing God requires us to honour the Son, as we honour the Father; and seeing these Three equally witness from Heaven, 1 Joh. 5. the Father, Word, and Spirit; all which Three, are One: can their Testimony be received as of Three, or can they be accompted as One God without this? And yet there can neither be one, in Faith, engaged unto in Baptism, or one, whose Testimony we may receive, but He who is God: and can any think but it’s necessary for a Christian, and that, fundamentally, to know to whom they are devoted, whom they are to worship, whose Testimony it is that they receive, whose operations they feel, whom they are to make use of, &amp;c? And therefore it’s necessary to know the Trinity of Persons in that One Godhead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A commentary upon the book of the Revelation. Wherein the text is explained, the series of the several prophecies contained in that book, deduced according to their order and dependence on each other; the periods and succession of times, at, or about which, these prophecies, that are already fulfill</cite>, (Edinburgh: Christopher Higgins, 1658), pp 8-9.</span></figcaption>

of+the+Trinity+of+Persons%2C+and+Unity+of+the+Godhead%2C+is+such%2C+that+without+it%2C+that+God%2C+which+is+proposed+in+the+Word%2C+and+is+the+only+true+God%2C+and+the+object+of+all+Worship%2C+can+neither+be+taken+up%2C+believed+in%2C+nor+worshipped+rightly%3A+Ergo%2C+%26c.+because+the+true+God+is+One%2C+and+yet+Three+Persons%3B+and+as+such%2C+hath+proposed+Himself+to+be+known+and+worshipped.%0A%0A2.+That+Truth+without+which+the+work+of+Redemption+would+be+overturned%2C+is+fundamental%3B+But+this+is+such%3A+for%2C+by+taking+away+the+Mystery+of+the+Trinity%2C+they+take+away+the+Godhead+and+Personality+of+the+Mediator%2C+and+so+do+enervate+His+satisfaction.+And%2C+as+on+the+former+accompt%2C+the+true+God+is+otherwise+conceived+than+He+is+in+Himself%3B+so%2C+in+this+respect%2C+the+Mediator+is+made+a+quite+other+thing.+And%2C+can+any+thing+be+fundamental%2C+if+this+be+not%3F%0A%0A3.+The+way+that+God+hath+laid+down+in+His+Worship%2C+requireth+this%2C+seeing+in+Baptism+there+is+particular+and+express+mentioning+of+these+Three%2C+the+Father%2C+Son+and+Spirit%2C+as+the+Superior%2C+to+whom+they+that+are+Christian+Soldiers%2C+should+be+lifted+and+enrolled%3A+and+so+we+may+accompt+of+all+after-worship%3B+seeing+God+requires+us+to+honour+the+Son%2C+as+we+honour+the+Father%3B+and+seeing+these+Three+equally+witness+from+Heaven%2C+1+Joh.+5.+the+Father%2C+Word%2C+and+Spirit%3B+all+which+Three%2C+are+One%3A+can+their+Testimony+be+received+as+of+Three%2C+or+can+they+be+accompted+as+One+God+without+this%3F+And+yet+there+can+neither+be+one%2C+in+Faith%2C+engaged+unto+in+Baptism%2C+or+one%2C+whose+Testimony+we+may+receive%2C+but+He+who+is+God%3A+and+can+any+think+but+it%E2%80%99s+necessary+for+a+Christian%2C+and+that%2C+fundamentally%2C+to+know+to+whom+they+are+devoted%2C+whom+they+are+to+worship%2C+whose+Testimony+it+is+that+they+receive%2C+whose+operations+they+feel%2C+whom+they+are+to+make+use+of%2C+%26c%3F+And+therefore+it%E2%80%99s+necessary+to+know+the+Trinity+of+Persons+in+that+One+Godhead.%E2%80%9D%0A%0A%E2%80%94+James+Durham%2C+A+commentary+upon+the+book+of+the+Revelation.+Wherein+the+text+is+explained%2C+the+series+of+the+several+prophecies+contained+in+that+book%2C+deduced+according+to+their+order+and+dependence+on+each+other%3B+the+periods+and+succession+of+times%2C+at%2C+or+about+which%2C+these+prophecies%2C+that+are+already+fulfill%2C+%28Edinburgh%3A+Christopher+Higgins%2C+1658%29%2C+pp+8-9.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff4c3cb2fc7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f4c3cb2fc7.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/04/14/james-durham-on-the-fundamental-doctrine-of-the-holy-trinity/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>For in proportion as God is harder to trace out than man, so is the heavenly Generation harder to comprehend than your own. But if you assert that because you cannot comprehend it, therefore He cannot have been begotten, it will be time for you to strike out many existing things which you cannot comprehend; and first of all God Himself. … The Begetting of God must be honoured by silence. It is a great thing for you to learn that He was begotten. But the manner of His generation we will not admit that even Angels can conceive, much less you.</p></blockquote>

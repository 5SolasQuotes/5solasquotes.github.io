<main class="wrap"><figure class="quote" id="q-0e78535fca" data-kw="">
<blockquote><p>…and though excommunicate[d] persons defend and hold all fundamentals sound, and so may be materially a true Church, yet because their profession is no profession, but a denying of the power of godliness, they cannot be formally a visible Church, but are for scandals casten out of the visible Church.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-10e7eb0cf1" data-kw="">
<blockquote><p>It is uncharitable, and against the Word, to teach that when a church is dissolved, by no sin and scandal-visible, but by persecution or pestilence, that the dissolved members, though both real and visible converts, have no right to the ordinances: for if the formal cause, to wit, their confederacy into one visible body, as Mr. [Thomas] Hooker [a congregationalist] says, be removed, their visible and external right is removed. The like is to be said of visible professors, and of members of another congregation, and known godly sojourners [travelers]; these Mr. Hooker [by implication] excommunicates for no scandal, visible and invisible: for impossible it is that they can meet together in one place with their own church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline… (London, 1658), bk. 1 | ch. 19, ‘Mr. [Thomas] Hooker [a congregationalist], his formal cause of a Church visible, or Church confederating, is considered’, pp. 96-104</cite>, p. 96</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

 target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-90684a6b60" data-kw="">
<blockquote><p>12. They [congregationalist puritans] hold that if any member of the congregation having committed a scandalous sin, shall of self forsake the worship of God and the spiritual communion with the Church, that the Church shall then send for the said person, and if he refuse to come they shall (after much seeking and long patience) openly declare that he has no part nor portion in the holy things of God among them; that then the ecclesiastical officers have no authority or jurisdiction over him, but only the civil magistrate, and those unto whom he owes civil subjection, as parents, masters, landlords, etc.</p></blockquote>

</figure><figure class="quote" id="q-7a2bda26c7" data-kw="">
<blockquote><p>When the congregation is dissolved by persecution, the godly pastor [on the supposition of congregationalism] is cast out of his Master’s service by the nature of this [local-church] covenant [of the congregationalists], because he is faithful to Christ, and that by Christ Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker (1658) Rutherford in these passages is arguing against Congregationalism. | [If losing membership in a local congregation makes one not to be a member of the visible Church, then a pastor ceasing to be a pastor of a dissolved congregation would defrock him, as congregationalists held. Yet:]</cite>, Bk. 1; ch. 26, p. 164</span></figcaption>

</figure><figure class="quote" id="q-9cecc7af83" data-kw="">
<blockquote><p>2. …For the power of the keys is not given to the catholic presbytery as to the first subject, to be a mean of edification in an ordinary and constant way; but only in an extraordinary and occasional way, in those things which concern the power of jurisdiction belonging to the whole catholic Church. By ‘extraordinary’ here, I mean not that which is against a particular law of God, and cannot be done without a divine dispensation of providence, but by ‘extraordinary’ I mean that which is raro contingens, and does not oft fall out; as almost it never falls out that the universal Church has need to excommunicate a national Church, for all and every one of a national Church do never fall away from the faith. Yet a remote power for excommunication is in the catholic visible Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644), pt. 1</cite>, p. 299</span></figcaption>

<main class="wrap"><figure class="quote" id="q-64ae077f4d" data-kw="">
<blockquote><p>There are two Sacraments ordained of Christ our Lord in the Gospel, that is to say, Baptism, and the Supper of the Lord. Those five commonly called Sacraments, that is to say, Confirmation, Penance, Orders, Matrimony, and extreme Unction, are not to be counted for Sacraments of the Gospel, being such as have grown partly of the corrupt following of the Apostles, partly are states of life allowed in the Scriptures; but yet have not like nature of Sacraments with Baptism, and the Lord&#x27;s Supper, for that they have not any visible sign or ceremony ordained of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/church-of-england.html">Church of England</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Thirty-Nine Articles</cite>, 1563, Art. 25</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-238d37b732" data-kw="">
<blockquote><p>&quot;Faith had in the Sacraments,&quot; saith Augustine, &quot;doth justify, and not the Sacraments.&quot; And Origen saith, &quot;Christ is the Priest, the Propitiation, and Sacrifice: which Propitiation cometh to every one by means of faith.&quot; So that by this reckoning, we say that the Sacraments of Christ without faith do not once profit these that be alive; a great deal less do they profit those that be dead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/last-things.html">Rome: Last Things</a> › <a href="../topics/rome/last-things/prayers-for-the-dead.html">Prayers for the dead</a></span><span class="t"><a href="../topics/rome/sacraments.html">Rome: Sacraments</a> › <a href="../topics/rome/sacraments/ex-opere-operato.html">Ex opere operato</a></span></div>

</figure><figure class="quote" id="q-42023b3dec" data-kw="">
<blockquote><p>It were a greater work to illustrate these great mysteries as they deserve, and I am unwilling to meddle with their obscene impurities, which are daily before the eyes and faces of all, that it may be understood that the mass, taken in the most choice form in which it can be exhibited, without any appendages, teems from head to foot with all kinds of impiety, blasphemy, idolatry, and sacrilege.</p></blockquote>

</figure><figure class="quote" id="q-6d5df55eca" data-kw="">
<blockquote><p>We justly blame the bishops of Rome, who, without the word of God, without the authority of the holy fathers, without any example of antiquity, after a new guise, do not only set before the people the sacramental bread to be worshipped as God, but do also carry about the same upon an ambling horse, whithersoever themselves journey, as in old times the Persians&#x27; fire, and the relics of the goddess Isis, were solemnly carried about in procession: and have brought the Sacraments of Christ to be used now as a stage play and a solemn sight: to the end, that men&#x27;s eyes should be fed with nothing else but with mad gazings and foolish gauds, in the self-same matter, wherein the death of Christ ought diligently to be beaten into our hearts, and wherein also the mysteries of our redemption ought with all holiness and reverence to be executed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>

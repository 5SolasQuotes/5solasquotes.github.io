<main class="wrap"><figure class="quote" id="q-6ca89021c0" data-kw="">
<blockquote><p>So that the concord between Reason and Revelation might be evident, and the subordination of the former to the latter, these cautions are able to be set down:

1. What is true in Philosophy, Theology does not overturn, but receives it, either simply, or with some distinction and limitation: for example, the Philosopher says, Man consists of a rational soul and a body: Theology receives this simply. The Philosopher says, From nothing comes nothing: Theology says the same, but with a limitation added, From nothing nothing comes by a finite, natural agent. The Philosopher says, A virgin does not bear: Theology acknowledges the same, but with this limitation: she does not bear by reason of intercourse with a man; but she is able to bear extraordinarily, by the miraculous power of God.

2. Philosophy judges of matters under the purview of the senses, pronounces nothing of matters unknown one way or the other; for example, concerning these truths Philosophy does not judge, whether a man is true God; whether in one divine Essence there are three persons.

3. What is true to the Philosopher is able to be false in Theology, because his Philosophy is able to be Pseudo-philosophy. Thus, to some Philosophers of the Gentiles it was truth that the World is eternal; which is false Theologically, indeed even Philosophically. For it was an error of those Philosophers, which ought to be imputed to Philosophy no further than the faults of artisans to their art. But, as wine, good in itself, easily contracts something of corruption from the fetid vessel into which it is poured; so Reason and Natural Theology easily attract something of error from corrupt man, in whom it dwells.

4. A truth in Philosophy is able to be false in Theology, and vice versa; through circumstance, because of a perverse application, or μετάβασιν εἰς ἄλλο γένος, a shifting unto another relation. Thus substance is said to subsist in the accidents: this is true concerning all created substance; but, if you think it of God, it is false.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 21, p. 165.</span></figcaption>

<blockquote><p>The first sort [of objectors] say, ‘It is to no purpose to dispute against such as deny grounded principles.’ And by this means, because one grounded principle is denied them, they break off quite and clean, as though all mean of conference were taken away. Surely this principle of theirs is very true, but yet (in my judgment) it is very ill understood. I grant it is to no purpose to dispute against such as deny grounded principles, by the same principles which they deny: That is very true. But there may be some other principles common to both sides, by the which a man may profitably dispute with them, and by those common principles oftentimes prove and verify his own principles. And that is the thing which I intend to do in this work. As for example: The Christian grounds himself upon the Gospel; the Jew denies it: and therefore it were to no purpose to allege it unto him. But both the Jew and the Christian have one common principle and ground, which is the Old Testament: By this may the Christian profitably dispute against the Jew, yea even to the verifying of the Gospel. … Likewise the Jew is grounded upon the Old Testament, which the Gentile would mock at if he should allege it unto him. But both the Gentile and the Jew have one common nature, which furnishes them both with one common philosophy, and with one common sort of principles; as that there is one God which governs all things; that He is good, and no author of evil; that He is wise, and does not anything in vain. Also that man is born to be immortal; that to be happy he ought to serve God and continue in his favor. And therewithal, that he is subject to passions, inclined to evil, weak unto good and so forth. Of these common principles, the Jew may draw necessary conclusions, which the Gentile shall not perceive at the first, like as when a man understands a proposition, but conceives not yet the drift and consequence thereof… Thus shall the Jew by common principles and conclusions, verify his own ground which is the Old Testament… And what else is all this than that which is commonly done in geometry and logic, which by two lines or by two propositions that are commonly known and certain, do gather… a third proposition (that is to say, a conclusion) that was… either doubted of or hidden, and by means of the other two is evidently found out, and necessarily proved. … To be short, the mark that our faith looks at, is the Author of Nature and principle of all principles. The rules therefore and the principles of nature which He has made cannot be contrary unto Himself. And He is also the very reason and truth itself. All other reason then, and all other truth depends upon Him, and relies upon Him, neither is there, or can there be any reason or truth but in Him: So far off is it, that the thing which is true and reasonable in nature, is or can be false in divinity, which (to speak properly) is not against nature, but against the corruption of nature, and in very deed about nature.</p></blockquote>

<blockquote><p>And this distinction [between actuality and potentiality] is metaphysical, not scientific (in the modern sense of “scientific’”). That is to say, it is a description of reality that is more general and basic than any scientific theory, resting as it does on facts (about change) that science itself takes for granted. Hence it is valid whatever the empirical scientific facts turn out to be; and (to repeat what was said earlier) while that doesn’t mean that it cannot be subjected to rational evaluation or criticism, such criticism can only come from some alternative metaphysical theory, not from empirical science… Aristotelian metaphysical ideas are, as I keep saying and as will be established by the end of the next chapter, unavoidable, whether the early modern philosophers thought so or not… the distinction I am making, between metaphysical ideas and scientific ones, is just an obvious one to make. As noted before, empirical science must take many things for granted, such as the existence of patterns of cause and effect. Thus, while it might be able to establish whether some particular causal relationship exists, it cannot possibly establish whether causation as such is real or not, given that its method presupposes its existence. Nor, at the most general level and for the same reasons, can it tell us what causation per se is or what kinds of causation exist. And so on for notions like actuality, potentiality, substance, attribute, form, and so on. Empirical science of its very nature cannot give us the full story about these matters; but metaphysics just is the rational investigation of them. Hence metaphysics is obviously different from empirical science.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“And this distinction [between actuality and potentiality] is metaphysical, not scientific (in the modern sense of “scientific’”). That is to say, it is a description of reality that is more general and basic than any scientific theory, resting as it does on facts (about change) that science itself takes for granted. Hence it is valid whatever the empirical scientific facts turn out to be; and (to repeat what was said earlier) while that doesn’t mean that it cannot be subjected to rational evaluation or criticism, such criticism can only come from some alternative metaphysical theory, not from empirical science… Aristotelian metaphysical ideas are, as I keep saying and as will be established by the end of the next chapter, unavoidable, whether the early modern philosophers thought so or not… the distinction I am making, between metaphysical ideas and scientific ones, is just an obvious one to make. As noted before, empirical science must take many things for granted, such as the existence of patterns of cause and effect. Thus, while it might be able to establish whether some particular causal relationship exists, it cannot possibly establish whether causation as such is real or not, given that its method presupposes its existence. Nor, at the most general level and for the same reasons, can it tell us what causation per se is or what kinds of causation exist. And so on for notions like actuality, potentiality, substance, attribute, form, and so on. Empirical science of its very nature cannot give us the full story about these matters; but metaphysics just is the rational investigation of them. Hence metaphysics is obviously different from empirical science.”

<blockquote><p>…hylemorphic dualism… takes a human being to be, not a composite of two distinct substances, but one substance with both incorporeal and corporeal operations. And the incorporeal incomplete substance that is the soul is related to the body not as an efficient cause but as its formal cause. Their relationship is as intimate as that between the form and matter of a stone, a tree, or a dog, which is why we experience the body as part of us rather than as some instrument extrinsic to us. Soul and body do not ‘interact’ any more than the substantial form of a stone and the matter that makes up the stone interact. Hence there is no ‘problem’ of explaining how they interact. An ‘interaction problem’ can arise only if, like Descartes, one misconceives them as two distinct substances related by efficient causation.</p></blockquote>

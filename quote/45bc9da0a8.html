<blockquote><p>Again, as to the special point of the origin of man’s body, if it be explained according to the hypothesis of evolution as held and expounded by naturalists … of implying that what we call the spirit or soul of man was evolved out of a germ existing in the brute, thus denying the uniform teaching of Scripture as to the constitution of man. Such a doctrine may by courtesy be called “theistic” evolution; but it certainly could not, with any show of reason, be called “biblical.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-14f9d5ee14" data-kw="">
<blockquote><p>Second, by metonymy and metaphor [metaphoram metonymicam], it can also denote the light of natural knowledge. The latter is twofold: [1.] the one is implanted in us, given from outside, or external, because it is presented and extended to man externally through God’s moral providence, and is nothing but the book of nature and the means, aids, and opportunities in this universe made available for natural knowledge and reasoning, which occurs apart from supernatural revelation; [2.] the other is innate or internal because it is implanted and introduced inside of us. The latter is again twofold: [1.] either it is imprinted on all people from birth, and functions as a principle [ad modum principii] or rather a dispostiion [habitus] of principles, and is called ‘common sense’ [communis sensus] and ‘common notions’ [communes notiones], which we have treated in the disputation On atheism [Select Theological Disputations 1.114-225]; [2.] or else it is acquired and newly added in man after birth by God’s general help, and functions as a science [ad modum scientiae] or a disposition (habitus) of conclusions, by which the mind [mens] is disposed, qualified, and determined to obtain factual knowledge, to form concepts and to draw legitimate [rite] consequences concerning God and divine things from the principles. For this internal or innate light, see Romans 2:14-15; Psalm 19:1, 8; Romans 1:19-20.</p></blockquote>

</figure><figure class="quote" id="q-057b1fe018" data-kw="">
<blockquote><p>Accordingly, the best form of government is in a state or kingdom, where one is given the power to preside over all; while under him are others having governing powers: and yet a government of this kind is shared by all, both because all are eligible to govern, and because the rules are chosen by all. For this is the best form of polity, being partly kingdom, since there is one at the head of all; partly aristocracy, in so far as a number of persons are set in authority; partly democracy, i.e. government by the people, in so far as the rulers can be chosen from the people, and the people have the right to choose their rulers.

Such was the form of government established by the divine law. For Moses and his successors governed the people in such a way that each of them was ruler over all; so that there was a kind of kingdom. Moreover, seventy-two men were chosen, who were elders in virtue: for it is written (Dt. 1:15): “I took out of your tribes wise and honorable, and appointed them rulers”: so that there was an element of aristocracy. But it was a democratical government in so far as the rulers were chosen from all the people; for it is written (Ex. 18:21): “Provide out of all the people wise men,” etc.; and, again, in so far as they were chosen by the people; wherefore it is written (Dt. 1:13): “Let me have from among you wise men,” etc. Consequently it is evident that the ordering of the rulers which the Law provided was the best.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologica</cite>, I-II, Q.105, Art. 1, co.</span></figcaption>

</figure><figure class="quote" id="q-e4ffb2adec" data-kw="">
<blockquote><p>6. Some theological writers dispute whether theology is to be called speculative (speculativa), affective (affectiva), or practical (practica)—as if one were to ask whether fire is motive (motivus), illuminative (illuminativus), or warming (calefactivus), or whether the human soul is vitally active (vitaliter activa), intellective (intellectiva), or volitive (volitiva). But just as this virtue is one in the three essential characters of the soul (animæ), so also true theology is essentially science-affective-practical (scientia-affectiva-practica), adapted to the perfection of the intellect (intellectus), of the will (voluntatis), and of practice (praxeos); although equivocally its purely speculative part, as such, could be called theology.

7. Theology therefore is not fully defined as the doctrine (doctrina) — or science (scientia) — of God; nor as the doctrine of living unto God, nor as the doctrine of glorifying God and saving men, etc. As it is here to be defined, it is the salutary doctrine, science-affective-practical, of the Kingdom of God over men (de Regno Dei super hominibus). By the Kingdom of God we always intend to include dominion and love — (or paternity, paternitatem). Moreover, the Kingdom of God is a paternal kingdom with most absolute dominion: on account of the poverty of a single name and to avoid prolixity, with the rest understood, I most often name it simply the Kingdom of God; but if this name pleases less, it may not ineptly be called the family of God, or the Theocracy (theocratiam).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Method of Christian Theology</cite>, (London: White &amp; Snowden, 1681), pt. 1, ch. 1, pp. 31-32 tr. AI Stiven Peter Latin</span></figcaption>

<div class="actions"><button class="copy" data-copy="“6. Some theological writers dispute whether theology is to be called speculative (speculativa), affective (affectiva), or practical (practica)—as if one were to ask whether fire is motive (motivus), illuminative (illuminativus), or warming (calefactivus), or whether the human soul is vitally active (vitaliter activa), intellective (intellectiva), or volitive (volitiva). But just as this virtue is one in the three essential characters of the soul (animæ), so also true theology is essentially science-affective-practical (scientia-affectiva-practica), adapted to the perfection of the intellect (intellectus), of the will (voluntatis), and of practice (praxeos); although equivocally its purely speculative part, as such, could be called theology.

7. Theology therefore is not fully defined as the doctrine (doctrina) — or science (scientia) — of God; nor as the doctrine of living unto God, nor as the doctrine of glorifying God and saving men, etc. As it is here to be defined, it is the salutary doctrine, science-affective-practical, of the Kingdom of God over men (de Regno Dei super hominibus). By the Kingdom of God we always intend to include dominion and love — (or paternity, paternitatem). Moreover, the Kingdom of God is a paternal kingdom with most absolute dominion: on account of the poverty of a single name and to avoid prolixity, with the rest understood, I most often name it simply the Kingdom of God; but if this name pleases less, it may not ineptly be called the family of God, or the Theocracy (theocratiam).”

— Richard Baxter, Method of Christian Theology, (London: White &amp; Snowden, 1681), pt. 1, ch. 1, pp. 31-32 tr. AI Stiven Peter Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C6.+Some+theological+writers+dispute+whether+theology+is+to+be+called+speculative+%28speculativa%29%2C+affective+%28affectiva%29%2C+or+practical+%28practica%29%E2%80%94as+if+one+were+to+ask+whether+fire+is+motive+%28motivus%29%2C+illuminative+%28illuminativus%29%2C+or+warming+%28calefactivus%29%2C+or+whether+the+human+soul+is+vitally+active+%28vitaliter+activa%29%2C+intellective+%28intellectiva%29%2C+or+volitive+%28volitiva%29.+But+just+as+this+virtue+is+one+in+the+three+essential+characters+of+the+soul+%28anim%C3%A6%29%2C+so+also+true+theology+is+essentially+science-affective-practical+%28scientia-affectiva-practica%29%2C+adapted+to+the+perfection+of+the+intellect+%28intellectus%29%2C+of+the+will+%28voluntatis%29%2C+and+of+practice+%28praxeos%29%3B+although+equivocally+its+purely+speculative+part%2C+as+such%2C+could+be+called+theology.+7.+Theology+therefore+is+not+fully+defined+as+the+doctrine+%28doctrina%29+%E2%80%94+or+science+%28scientia%29+%E2%80%94+of+God%3B+nor+as+the+doctrine+of+living+unto+God%2C+nor+as+the+doctrine+of+glorifying+God+and+saving+men%2C+etc.+As+it+is+here+to+be+defined%2C+it+is+the+salutary+doctrine%2C+science-affective-practical%2C+of+the+Kingdom+of+God+over+men+%28de+Regno+Dei+super+hominibus%29.+By+the+Kingdom+of+God+we+always+intend+to+include+dominion+and+love+%E2%80%94+%28or+paternity%2C+paternitatem%29.+Moreover%2C+the+Kingdom+of+God+is+a+paternal+kingdom+with+most+absolute+dominion%3A+on+account+of+the+poverty+of+a+single+name+and+to+avoid+prolixity%2C+with+the+rest+understood%2C+I+most+often+name+it+simply+the+Kingdom+of+God%3B+but+if+this+name+pleases+less%2C+it+may+not+ineptly+be+called+the+family+of+God%2C+or+the+Theocracy+%28theocratiam%29.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Method+of+Christian+Theology%2C+%28London

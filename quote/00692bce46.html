<main class="wrap"><figure class="quote" id="q-00692bce46" data-kw="">
<blockquote><p>I would therefore wish that there were a law provided in this behalf for adulterers, and that adultery should be punished with death, and that might be a remedy for all this matter. There would not then be so much adultery, whoredom and lechery in England as there is. For the love of God take heed to it, and see a remedy provided for it. I would wish that adultery should be punished with death.

And that the woman being an offender, if her husband would be a suiter for her, she should be pardoned for the first time, but not for the second time. And the man being an offender should be pardoned, if his wife be a suiter for him, for the first time, but not for the second time, not if he offended twice. If this law were made there would not be so much adultery nor lechery used in the realm as there is. Well I trust once yet as old as I am, to see the day that lechery shall be punished. It was never more need, for there was never more lechery used in England as there is at this day, and maintained. …

I would wish that Moses’ law were restored for punishment of lechery, &amp; that the offenders therein might be punished according to the prescription of Moses law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-latimer.html">Hugh Latimer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A most faithful sermon preached before the King’s most excellent Majesty, and his most honourable Council, in his court at Westminster</cite>, (London: John Day, 1550), unpaginated.</span></figcaption>

29/hugh-latimer-on-the-punishment-of-adultery/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

</figure><figure class="quote" id="q-16dc4bd6a2" data-kw="">
<blockquote><p>But among other things which were prudently and happily done by you, the convocation of the Synod of Dort hath obtained the chief place. Then which Synod for many ages past there hath been none more famous, more holy, nor more profitable to the Church.

Whereunto that ye might call most choice men from divers parts, ye spared neither cost, nor labour; wherein all things were done so orderly and gravely, that it hath drawn the people into admiration, and hath stayed those that were staggering, and hath so troubled headstrong and obstinate persons only with the sight thereof, that they which before did seem to be desirous of the conflict, and greedily to call for the encounter, have by contrary practices, (whether fear stroke them, or their conscience affrighted them) begun to shun the hearing of the cause, to hate the light, and to work delays.

To so excellent a thing, both other Princes did exhort you, and especially the most renowned Prince JAMES, King of great Britain, who hath always been most earnest and forward to drive away the errors of all innovators; who as he is rightly styled the Defender of the Faith, so he hath his eyes vigilant on all sides, carefully watching lest Christian faith should any where receive any damage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), xiv-xv.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

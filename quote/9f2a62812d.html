<main class="wrap"><figure class="quote" id="q-9f2a62812d" data-kw="">
<blockquote><p>Duration is either increated, viz. eternity, proper to God, or created, viz. eviternity, the duration of the blessed in glory: or time, which is the duration of the corruptible creature: Eternity is a duration, consisting of an eternal NOW, without beginning, and without ending; there is nothing past, nor to come. Eviternity is a duration, having a continuing NOW, with a beginning, but without ending. The duration of angels and of the blessed, in respect of their persons and substances admit of no instant concerning which it can be said that it is past: but in regard of their operations and other accidents, their duration admits of succession. Time is a successive duration, having a beginning and ending, without any remaining NOW.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 7-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0cfc9f568c" data-kw="">
<blockquote><p>God only is properly and absolutely eternal: Angels and men’s souls are said to be eternal, à posteriori, or à parte post, God à priori et à posteriori, ex parte ante et post, since He has neither beginning, succession, nor end.</p></blockquote>

</figure><figure class="quote" id="q-753214a097" data-kw="against perpetual guardian angel">
<blockquote><p>Is a particular angel assigned as a perpetual guardian to each believer? We deny. From Acts 12:15, where mention is made of Peter’s angel, it can be collected that a certain angel was then present with Peter, but not that a particular and perpetual guardian was given to him. For he is said “to have come upon him”; as when “the physician and servant of the king” is alluded to, not a particular one is understood, but indefinitely he who performs that office (which many can perform successively).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.8</span></figcaption>

<blockquote><p>5. Duration XVII. Fifth, the duration of their existing, and its measure, through which they are not under time, by which such things are measured which by their nature admit of a beginning and end; nor under eternity, which belongs only to him who by nature can experience neither beginning nor end; but under aevum, ‘forever,’20 by which those things are measured which include a beginning by nature, but exclude an end. This aevum is congruent with time, tempus, in this, that not only does it imply a beginning of duration, but also flux or succession; this aevum is congruent with eternity in that it excludes an end of its duration. It differs from time in that it excludes an end, and from eternity in that it includes a beginning and flux. 23 The three measures of duration are tempus, aeternitas, and aevum, also called “aeviternity” or “improper eternity.” Cf. 1.2.11 §VIII.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, ed. Joel Beeke, tr. Todd Rester (RHB, 2021), vol. 3, bk. 3, ch. 7, The Good Angels, p. 184</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/good-angels.html">Good Angels</a></span></div>

ank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-df026d6c02" data-kw="">
<blockquote><p>There is no created holiness sure, stable, and perfect in itself: The glorious angels which are, and ever shall be saints in Heaven, and the saints in Heaven who are like angels, stand not in that holy and happy estate by their own sufficiency, but by the decree and grace of God. Those angels which fell at first were holy, and they who now stand, might have fallen notwithstanding their created holiness, if God had not superadded confirming grace which establishes them forever. Yet this is not all, that the angels are imperfect because they might fall if not supported, there is somewhat more in it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Fifteenth, Sixteenth &amp; Seventeenth Chapters of the Book of Job</cite>, … (London: 1650), sermon on Job 15:15, pp. 62-63</span></figcaption>

<main class="wrap"><figure class="quote" id="q-d2c06fc13a" data-kw="">
<blockquote><p>The extraordinary gifts of the Spirit, such as the gift of tongues, of miracles, of prophecy, etc., are called extraordinary, because cause they are such as are not given in the ordinary course of God’s providence. They are not bestowed in the way of God’s ordinary providential dealing with his children, but only on extraordinary occasions, as they were bestowed on the prophets and apostles to enable them to reveal the mind and will of God before the canon of Scripture was complete, and so on the primitive Church, in order to the founding and establishing of it in the world. But since the canon of the Scripture has been completed, and the Christian Church fully founded and established, these extraordinary gifts have ceased.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Love More Excellent than the Extraordinary Gifts of the Spirit’ on 1 Cor.</cite>, 13:1-2</span></figcaption>

<blockquote><p>Now Libertines turn all our faith in a topic and conjectural opinion, so most of them are turned sceptics and affirm that we know nothing with any certainty; yea the more supernatural and sublime that fundamentals of salvation are, the more indulgence and latitude of liberty is to be yielded to the consciences of all men, because the higher the subject is, the ranker is our propension to err, God having given a thinner and more scarce measure of knowledge in supernaturall things, that do so far transcend the sphere and orb of natural reason, than of knowledge in natural things, our minds being in their own element, and in a capacity to reach their connatural and proper object when they are among natural things knowable by the light of nature; Hence that opinion now so prevailing that all and every religion is to be tolerated, and an indulgence yielding to all in superstructures in fundamentals, though a man should deny that Christ is the Saviour of the world; therefore Saltmarsh takes on him (Sparkles of Glory as pp. 185-188) to reckon out the articles of our faith, especially concerning the first Adam’s sin, sin-original, of Christ born of the virgin Mary, made under the Law, bearing our sins, dead, buried, ascended into Heaven, siting at the right hand etc. and speaks of the highest attaintments of the protestants generally in the mystery of salvation. but speaks not one word of the general resurrection of our bodies, of Christ coming to judge all men, of a Heaven and Hell after this life, as if these were none of the highest attaintments of the protestants generally in the mystery of salvation. And Saltmarsh, as I conceive with Hymeneus and Philetus and other Libertines in the [English] army, doubt of or deny these…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist... (London, 1648) | pt. 1 | ch. 32, ‘What Certainty of Faith the Saints may Attain to Beyond the Familists’ Fluctuation of Faith: of Heresie &amp; Schism’</cite>, pp. 274-5</span></figcaption>

</figure><figure class="quote" id="q-d0667ba983" data-kw="">
<blockquote><p>I. Whether regeneration of the intellect through illumination, both in the first and in the second act, whose terminus or formal effect is knowledge and assent to truth, theological wisdom, ecclesiastical prudence, etc., differs in species and form from that more common aid of illumination which also befalls certain reprobate, or the elect before actual conversion? Response: Affirmatively, from 1 Jn. 5:19–20; Phil. 1:9–10; Col. 1:9; Eph. 1:17–18; Jm. 3:13, 15, 17, where distinctly ἡ ἄνωθεν σοφία [hē anōthen sophia, the wisdom from above]; and Lk. 1:17, φρόνησις δικαίων [phronēsis dikaiōn, the prudence of the righteous]. Concerning which [see] in the Disputation on Simplicity and Hypocrisy. By equal reasoning we think a distinction should be made here, as concerning faith of miracles and other charisms in the regenerate, which are materially common, formally peculiar and proper in the regenerate and truly faithful, Mk. 16:16–17; Jn. 7:28[?]; Acts 19:4–6. Compare the Disputations on Miracles and on Charisms. But whether the habit of theological wisdom or ecclesiastical prudence in the unregenerate ought properly and specifically to be called infused, or indeed acquired, could be inquired. We incline to the latter affirmative, so that we regard such habits in the same estimation as their philosophical, medical, historical, poetic habits, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</cite></span></figcaption>

</figure><figure class="quote" id="q-de4c0b5201" data-kw="">
<blockquote><p>My assurances are not the Marvels of Merlin, nor yet the dark sentences of profane prophesies, but: 1. the plain truth of God’s Word; 2. the invincible justice of the everlasting God, and 3. the ordinary course of his punishments and plagues from the beginning are my assurance and grounds. God’s Word threatens destruction to all unobedient; his immutable justice must require the same. The ordinary punishments and plagues show examples.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works, vol. 3</cite>, pp. 168-9</span></figcaption>

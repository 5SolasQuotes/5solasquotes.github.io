<main class="wrap"><figure class="quote" id="q-f67c48a551" data-kw="">
<blockquote><p>3rd Distinction. There is a formal ordinary power, and there is a virtual or extraordinary power. 1st Conclusion. Christ Jesus has immediately Himself, without the intervening power of the Church or men, appointed offices and officers in his house, and the office of a pastor, and elder is no less immediately from Christ (for men as Christ’s vicars and instruments can appoint no new office in the Church) than the office of the apostles, Eph. 4:11; 1 Cor. 12:28; Mt. 28:19. The offices are all given to the Church immediately, and so absolutely, and so the power of the keys, is given to the Church the same way. But the officers and key-bearers now are given mediately and conditionally, by the intervening mediation of the ruling and ministerial Church, that she shall call such and such, as have the conditions required to the office by God’s Word, 1 Tim. 3:1-3… 2nd Conclusion. I deny not but there is a power virtual, not formal in the Church of believers, to supply the want of ordination of pastors or some other acts of the keys simply necessary, hic &amp; nunc [here and now]; this power is virtual, not formal, and extraordinary not ordinary, not official, not properly authoritative, as in a Church in an island, where the pastors are dead or taken away by pest[ilence] or otherways; the people may ordain pastors or rather do that which may supply the defect of ordination, as David without immediate revelation from Heaven to direct him, by only the Law of nature, did eat showbread; So is the case here, so answer the casuists and the schoolmen, that a positive law may yield in case of necessity to the good of the Church; so Thomas, Molina, Suarez, Vasquez, Vigverius, Sotus, Scotus, Altisiodorensis, Durand, Gabriel; and consider what the learned Voetius says in this: What if in an extreme case of necessity, a private man, endued with gifts and zeal should teach publicly, after the example of the faithful at Samosaten. Yea and Flavianus and Diodorus preached in Antioch, as Theodoret says; yea, says Voetius, an ordinary ministry might be imposed on a laic, or private person by the Church, though the presbytery consent not, in case of necessity. God (says Gerson) may make an immediate intermission of a calling by bishops; yea (says Anton. speaking of necessity’s law) the Pope may commit power of excommunication, quia est de jure positive, pure laico &amp; mulieri, to one mere laic, or a woman; though we justify not this, yet it is hence concluded that God has not tied Himself to one set rule of ordinary, positive laws: a captive woman (as Socrates says) preached the Gospel to the king and queen of Iberranes, and they to the people of the land.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 8</span></figcaption>

<blockquote><p>4th Conclusion is this… Now if a church should be in a remote island, not consociate with other churches, and yet wanting guides [officers], our [congregationalist] brethren say in this case, the power of the keys should be seen to be in believers, and they might choose and ordain their own officers. I grant they have great [Romanist] schoolmen to say with them… But I say in this case necessity is an unbooked and naughty lawyer, and God extraordinarily should supply the want of ordination, as He can do the defect of second causes: so that if God send some pastors to a congregation that were unwilling to choose their own eldership, pastors might ordain themselves pastors in that case to these people, and God should supply their want of popular election…</p></blockquote>

</figure><figure class="quote" id="q-13940a8abf" data-kw="">
<blockquote><p>Mr. Hooker [a congregationalist]: ‘If government by independent congregations be insufficient because it authorizes not persons to be pastors over pagans, government by synods is sick of the same disease.’ [Rutherford’s] Answer: [1.] We judge the essence of a pastor not to stand in the call and choice of those to whom they are pastors; for it makes Paul, Barnabas and the apostles to be no pastors to the gentiles and to the heathen, to whom they preach, and [it] makes the apostles as apostles to be no pastors. [Margin Note:] Evangelists are now ceased as well as apostles. 2. Synods from Acts 15 and Acts 13 may lend men, authorized with pastoral power, to heathens to spread the Gospel; and private men as no pastors, but as private men, are intruders [though] authorized by Mr. Hooker, for they have no promise, such as pastors have by Mt. 28:19-20; Mk. 16:15-17; Jer. 1:6,17-18, to plant Churches among the heathens; nor is there a warrant to say that evangelists are ordinary officers left by Christ to plant Churches. If Richard Hooker have any ground from Eusebius or Scripture for evangelists now, or in Trajan’s time, he must show that they have the gift of tongues: for how could evangelists be fellow-helpers to preach the Gospel to the Churches planted by the apostles if they were not an extraordinary office only? See those divines in the margin, and my learned and dear brother, Mr. George Gillespie, Miscellaneous Questions, ch. 7. If the Church should send any to the heathen any way rip[…] for the Gospel, these could be no other than ordinary pastors to them. [Margin Note:] Tilen, Syntagma, dis. 19, th. 38, Apostolorum vice, ubi res poscebat, fungebantur. Professors of Leided, in Synopsis of Pure Theology, dis. […], thesis 17, p. 605; Bucan, in loc., Com. 42, q. 45; Calvin, Commentary on Eph. 4, Apostolis proximi erant Evangelistae, &amp; munus affine habebant. Bullinger, ibid., In plebe potissimum e […]udienda; Zanchi, Com. ibid. Apostolorum Comites—non immediate mi […]—sed assumebantur. Dr. Robert Boyd from Trochoregia, Commentary on Eph. 4, p. 493, Apostolorum Comites modo huc, modo illuc missi, modo re vocati ab Apostolis, extraordinarii.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (London, 1658), p. 472</span></figcaption>

<blockquote><p>7. A calling to the ministry is either such: [1.] as wants the essentials, as gifts in any messenger and the Church’s consent, or these who occupy the room of the Church, the Church consenting: such a minister is to be reputed for no minister; or 2. an entry to a calling, or a calling where diverse of the apostles’ requisites are wanting, may be a valid calling, as if one enter as Caiphas, who entered by favor and money and contrary to the Law, was High-Priest but for a year: yet was a true High-Priest and prophesied as the High-priest [Jn. 11:49-51].</p></blockquote>

</figure><figure class="quote" id="q-cd39974bed" data-kw="">
<blockquote><p>1. We must distinguish a twofold power of the keys (Trelcatius, Instittutes of Theology, bk. 2, p. 287-88; Pareus on 1 Cor. 5, Of Excommunication): the one is execute in doctrine: the other in discipline: the one concionalis [of preaching]: the other judicialis [of judgment]. Touching the former, we grant it is proper for pastors alone, whose office and vocation it is, by the preaching and publishing of God’s Word, to shut the Kingdom of Heaven against impenitent and disobedient men, and to open it unto penitent sinners, to bind God’s heavy wrath upon the former, and (by application of the promises of mercy) to loose the latter from the sentence and fear of condemnation. When we ascribe the power of binding and loosing to that whole consistory, wherein governing elders are joined together with pastors, we mean only of the Keys of external discipline, which are used in ecclesiastical courts and judicatories.</p></blockquote>

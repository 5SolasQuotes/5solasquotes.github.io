<main class="wrap"><figure class="quote" id="q-c75cb05b76" data-kw="">
<blockquote><p>For the hearers of the law,” etc. This anticipates an objection which the Jews might have adduced. As they had heard that the law was the rule of righteousness, (Deuteronomy 4:1) they gloried in the mere knowledge of it: to obviate this mistake, he declares that the hearing of the law or any knowledge of it is of no such consequence, that any one should on that account lay claim to righteousness, but that works must be produced, according to this saying, “He who will do these shall live in them.” The import then of this verse is the following, — “That if righteousness be sought from the law, the law must be fulfilled; for the righteousness of the law consists in the perfection of works.” They who pervert this passage for the purpose of building up justification by works, deserve most fully to be laughed at even by children. It is therefore improper and beyond what is needful, to introduce here a long discussion on the subject, with the view of exposing so futile a sophistry: for the Apostle only urges here on the Jews what he had mentioned, the decision of the law, — That by the law they could not be justified, except they fulfilled the law, that if they transgressed it, a curse was instantly pronounced on them. Now we do not deny but that perfect righteousness is prescribed in the law: but as all are convicted of transgression, we say that another righteousness must be sought. Still more, we can prove from this passage that no one is justified by works; for if they alone are justified by the law who fulfill the law, it follows that no one is justified; for no one can be found who can boast of having fulfilled the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite></span></figcaption>

6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c75cb05b76.html">Permalink</a><a class="src" href="https://heidelblog.net/2008/11/calvin-on-rom-213/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

</figure><figure class="quote" id="q-5c6831edca" data-kw="">
<blockquote><p>The first commandment teaches us that God wants us to sincerely trust Him. Yet we must fear Him about everything else. … So the good works required by the first commandment are holy and must be obeyed. But who can live up to them? Certainly no one can completely obey the first commandment. Everyone is a sinner except for Christ. Christ, however, comes to us and says, “I have shed my blood for you. My blood cries out on your behalf.” Out of His grace and kindness, He brings us the forgiveness of our sins at no cost to us whatsoever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith Alone: A Daily Devotional</cite>, (p. 210). Zondervan. Kindle Edition.</span></figcaption>

</figure><figure class="quote" id="q-4a36ab43db" data-kw="">
<blockquote><p>And all the prophets saw this, that Christ was to become the greatest thief, murderer, adulterer, robber, desecrator, blasphemer, etc., there has ever been anywhere in the world. He is not acting in His own Person now. Now He is not the Son of God, born of the Virgin. But He is a sinner, who has and bears the sin of Paul, the former blasphemer, persecutor, and assaulter; of Peter, who denied Christ; of David, who was an adulterer and a murderer, and who caused the Gentiles to blaspheme the name of the Lord (Rom. 2:24). In short, He has and bears all the sins of all men in His body—not in the sense that He has committed them but in the sense that He took these sins, committed by us, upon His own body, in order to make satisfaction for them with His own blood. Therefore this general Law of Moses included Him, although He was innocent so far as His own Person was concerned; for it found Him among sinners and thieves. Thus a magistrate regards someone as a criminal and punishes him if he catches him among thieves, even though the man has never committed anything evil or worthy of death. Christ was not only found among sinners; but of His own free will and by the will of the Father He wanted to be an associate of sinners, having assumed the flesh and blood of those who were sinners and thieves and who were immersed in all sorts of sin. Therefore when the Law found Him among thieves, it condemned and executed Him as a thief.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1–4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 277–278.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

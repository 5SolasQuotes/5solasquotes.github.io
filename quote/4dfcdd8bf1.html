<main class="wrap"><figure class="quote" id="q-4dfcdd8bf1" data-kw="">
<blockquote><p>Therefore Divine Faith cannot be reduced or resolved into the authority of the Church, or into other simple external arguments which are wont to be called Motives by persuading and inducing things preparing to Faith; but it is to be resolved into the Scripture it self, and that authority which it hath imprinted upon it from the author God, as into the first and proper cause which causeth the thing to be believed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology</cite>, Book II, ch. V (Of Faith), thesis 29</span></figcaption>

</figure><figure class="quote" id="q-a9307165a8" data-kw="">
<blockquote><p>The Scripture is the best interpreter of Scripture, or the Spirit of God therein; nor are the church or its pastors, nor councils and popes, the infallible interpreters thereof; there is a private interpretation of Scripture, which every Christian may make, according to his ability and light; and there is a public one, by the preacher of the word but both are subject to, and to be determined by the Scripture itself, which is the only certain and infallible rule of faith and practice.</p></blockquote>

</figure><figure class="quote" id="q-a067c1d621" data-kw="">
<blockquote><p>When God&#x27;s Word is by the Fathers expounded, construed, and glossed, then, in my judgment, it is even as when one strains milk through a coal-sack, which must needs spoil and make the milk black; God&#x27;s Word of itself is pure, clean, bright and clear; but, through the doctrines, books, and writings of the Fathers, it is darkened, falsified, and spoiled.</p></blockquote>

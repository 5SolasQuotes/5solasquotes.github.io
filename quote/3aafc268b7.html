<blockquote><p>The Father, Son, and Spirit, (betwixt whom was the council of peace) work out their design in a perfect harmony and consent: as there was no jar in their council, so there can be none in the execution of it: those whom the Father, before all time, did chose; they, and they only, are the persons, whom the Son, when the fulness of time for the execution of that decree was come, died for, John xvii. 6. “I have manifested thy name unto the men, which thou gavest me out of the world; thine they were, and thou gavest them me;” and ver. 19. “For their sakes I sanctify myself;” i.e. consecrate, devote, or set myself apart for a sacrifice for them.

And those for whom Christ died, are the persons to whom the Spirit effectually applies the benefits and purchases of his blood: he comes in the name of the Father and Son. “But the world cannot receive him, for it neither sees, nor knows him,” John xiv. 17. “They that are not of Christ’s sheep, believe not,” John x. 26.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Method of Grace in the Gospel-Redemption</cite>, (1699) in The Works of John Flavel (1820; 6 vols, London: Banner of Truth: 1968), 2: 21.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-50a02e49bd" data-kw="">
<blockquote><p>These persons are so distinct in their peculiar subsistence that distinct actings and operations are ascribed unto them. And these actings are of two sorts:—1. Ad intra, which are those internal acts in one person whereof another person is the object. And these acts ad invicem, or intra, are natural and necessary, inseparable from the being and existence of God. So the Father knows the Son and loveth him, and the Son seeth, knoweth, and loveth the Father.

In these mutual actings, one person is the object of the knowledge and love of the other: John iii. 35, “The Father loveth the Son, and hath given all things into his hand.” Chap. v. 20, “The Father loveth the Son.” Matt. xl 27, “No man knoweth the Son, but the Father; neither knoweth any man the Father, save the Son.” John vi. 46, “None hath seen the Father, save he which is of God, he hath seen the Father.” This mutual knowledge and love of Father and Son is expressed at large, Prov. viii. 22-31; which place I have opened and vindicated elsewhere. And they are absolute, infinite, natural, and necessary unto the being and blessedness of God. So the Spirit is the mutual love of the Father and the Son, knowing them as he is known, and “searching the deep things of God.” And in these mutual, internal, eternal actings of themselves, consists much of the infinite blessedness of the holy God.

Again, 2. There are distinct actings of the several persons ad extra; which are voluntary, or effects of will and choice, and not natural or necessary. And these are of two sorts: — (1.) Such as respect one another; for there are external acts of one person towards another: but then the person that is the object of these actings is not considered absolutely as a divine person, but with respect unto some peculiar dispensation and condescension. So the Father gives, sends, commands the Son, as he had condescended to take our nature upon him, and to be the mediator between God and man. So the Father and the Son do send the Spirit, as he condescends in an especial manner to the office of being the sanctifier and comforter of the church. Now, these are free and voluntary acts, depending upon the sovereign will, counsel, and pleasure of God, and might not have been, without the least diminution of his eternal blessedness.

(2.) There are especial acts, ad extra, towards the creatures.1 This the whole Scripture testifieth unto, so that it is altogether needless to confirm it with particular instances. None who have learned the first principles of the doctrine of Christ, but can tell you what works are ascribed peculiarly to the Father, what to the Son, and what to the Holy Ghost. Besides, this will be manifested afterward in all the distinct actings of the Spirit; which is sufficient for our purpose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ΠΝΕΥΜΑΤΟΛΟΓΙΑ or, A Discourse Concerning the Holy Spirit</cite>, (London, 1674) in William H. Goold (ed.), The Works of John Owen (16 vols, Edinburgh: Banner of Truth, 1965), iii, 66-67.</span></figcaption>

<blockquote><p>So what ensures then that his judgment is true, other than the fact that he is truly the Son? That, after all, is what he said, And if I do pass judgment, my judgment is true, because I am not alone, but it is I and the Father who sent me, as if to say, “My judgment is true, because I am the Son of God.”

How do you prove that you are the Son of God?

Because I am not alone, but it is I and the Father who sent me.

Blush for shame, Sabellian; you hear “Son,” you hear “Father.” The Son is Son, the Father is Father. He did not say, “I am the Father, and I am the same as the Son,” but I am not alone is what he said.

Why are you not alone?

“Because the Father is with me”

It is I and the Father who sent me is what you hear; “it is I and the one who sent me.” Do not jettison a person, distinguish persons. Distinguish intelligently; do not separate them perfidiously, lest, after steering clear of Charybdis, you crash on Scylla. The whirlpool of Sabellian impiety, you see, was about to suck you into saying the Father is the same as the Son; just now you have learned that I am not alone, but it is I and the Father who sent me. You acknowledge that the Father is Father and the Son is Son. You do well to acknowledge this; but do not go on to say, “The Father is greater, the Son is less.” Do not say, “The Father is gold, the Son is silver.” There is one substance, one godhead, one coeternity, perfect equality, not the least unlikeness. I mean, if you only believe that Christ is another, and that he is not the Father, yet you still think that he differs in nature, you have indeed avoided Charybdis but have wrecked yourself on Scylla’s rocks.

Navigate down the middle, avoid each dangerous shore. The Father is Father, the Son is Son. You are now saying, “The Father is Father, the Son is Son”; you have truly avoided the danger of being sucked into the whirlpool. Why do you want to go to the other side, and say, “The Father is one thing, the Son another”? One person, another person, yes, that is right; one thing and another thing, that is wrong. The Son, after all, is another person, because he is not who the Father is; and the Father is another person, because he is not who the Son is; not, however, another thing, but both Father and Son are the very same. What does that mean, the very same? It is one God.

You have heard, I am not alone, but it is I and the Father who sent me; now hear what you must believe about Father and Son; listen to the Son: I and the Father are one (Jn 10:30). He did not say, “I am the Father,” or, “I and the Father are one person;” but when he said, I and the Father are one, you must hear and listen to both one and we are, and you will deliver yourself from both Scylla and Charybdis. Of these two words that he used, one delivers you from Arius; we are delivers you from Sabellius. If one, then not different things; if we are, then both Father and Son. After all, he would not say we are of one person; but neither would he say one of different things.

So then, he says in a word, My judgment is true, so that you may hear, “I am God’s Son.” “But I am persuading you,” he goes on, “that I am God’s Son in such a way that you should understand that the Father is with me; I am not his Son in such a way that I have left him behind; I am not here in such a way that I am not also with him; he is not there in such a way that he is not also with me. I have taken on the form of a slave, but I have not lost the form of God (Phil 2:7).” So then, I am not alone, he says, but it is I and the Father who sent me.</p></blockquote>

— Augustine of Hippo, Homilies on the Gospel of John 1-40, (c. 406-20), trans. Edmund Hill, ed. Allan D. Fitzgerald, The Works of Saint Augustine: A Translation for the 21st Century, Volume 12 (Hyde Park NY: New City Press, 2009), 36.9, pp 560-62.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSo+what+ensures+then+that+his+judgment+is+true%2C+other+than+the+fact+that+he+is+truly+the+Son%3F+That%2C+after+all%2C+is+what+he+said%2C+And+if+I+do+pass+judgment%2C+my+judgment+is+true%2C+because+I+am+not+alone%2C+but+it+is+I+and+the+Father+who+sent+me%2C+as+if+to+say%2C+%E2%80%9CMy+judgment+is+true%2C+because+I+am+the+Son+of+God.%E2%80%9D%0A%0AHow+do+you+prove+that+you+are+the+Son+of+God%3F%0A%0ABecause+I+am+not+alone%2C+but+it+is+I+and+the+Father+who+sent+me.%0A%0ABlush+for+shame%2C+Sabellian%3B+you+hear+%E2%80%9CSon%2C%E2%80%9D+you+hear+%E2%80%9CFather.%E2%80%9D+The+Son+is+Son%2C+the+Father+is+Father.+He+did+not+say%2C+%E2%80%9CI+am+the+Father%2C+and+I+am+the+same+as+the+Son%2C%E2%80%9D+but+I+am+not+alone+is+what+he+said.%0A%0AWhy+are+you+not+alone%3F%0A%0A%E2%80%9CBecause+the+Father+is+with+me%E2%80%9D%0A%0AIt+is+I+and+the+Father+who+sent+me+is+what+you+hear%3B+%E2%80%9Cit+is+I+and+the+one+who+sent+me.%E2%80%9D+Do+not+jettison+a+person%2C+distinguish+persons.+Distinguish+intelligently%3B+do+not+separate+them+perfidiously%2C+lest%2C+after+steering+clear+of+Charybdis%2C+you+crash+on+Scylla.+The+whirlpool+of+Sabellian+impiety%2C+you+see%2C+was+about+to+suck+you+into+saying+the+Father+is+the+same+as+the+Son%3B+just+now+you+have+learned+that+I+am+not+alone%2C+but+it+is+I+and+the+Father+who+sent+me.+You+acknowledge+that+the+Father+is+Father+and+the+Son+is+Son.+You+do+well+to+acknowledge+this%3B+but+do+not+go+on+to+say%2C+%E2%80%9CThe+Father+is+greater%2C+the+Son+is+less.%E2%80%9D+Do+not+say%2C+%E2%80%9CThe+Father+is+gold%2C+the+Son+is+silver.%E2%80%9D+There+is+one+substance%2C+one+godhead%2C+one+coeternity%2C+perfect+equality%2C+not+the+least+unlikeness.+I+mean%2C+if+you+only+believe+that+Christ+is+another%2C+and+that+he+is+not+the+Father%2C+yet+you+still+think+that+he+differs+in+nature%2C+you+have+indeed+avoided+Charybdis+but+have+wrecked+yourself+on+Scylla%E2%80%99s+rocks.%0A%0ANavigate+down+the+middle%2C+avoid+each+dangerous+shore.+The+Father+is+Father%2C+the+Son+is+Son.+You+are+now+saying%2C+%E2%80%9CThe+Father+is+Father%2C+the+Son+is+Son%E2%80%9D%3B+you+have+truly+avoided+the+danger+of+being+sucked+into+the+whirlpool.+Why+do+you+want+to+go+to+the+other+side%2C+and+say%2C+%E2%80%9CThe+Father+is+one+thing%2C+the+Son+another%E2%80%9D%3F+One+person%2C+another+person%2C+yes%2C+that+is+right%3B+one+thing+and+another+thing%2C+that+is+wrong.+The+Son%2C+after+all%2C+is+another+person%2C+because+he+is+not+who+the+Father+is%3B+and+the+Father+is+another+person%2C+because+he+is+not+who+the+Son+is%3B+not%2C+however%2C+another+thing%2C+but+both+Father+and+Son+are+the+very+same.+What+does+that+mean%2C+the+very+same%3F+It+is+one+God.%0A%0AYou+have+heard%2C+I+am+not+alone%2C+but+it+is+I+and+the+Father+who+sent+me%3B+now+hear+what+you+must+believe+about+Father+and+Son%3B+listen+to+the+Son%3A+I+and+the+Father+are+one+%28Jn+10%3A30%29.+He+did+not+say%2C+%E2%80%9CI+am+the+Father%2C%E2%80%9D+or%2C+%E2%80%9CI+and+the+Father+are+one+person%3B%E2%80%9D+but+when+he+said%2C+I+and+the+Father+are+one%2C+you+must+hear+and+listen+to+both+one+and+we+are%2C+and+you+will+deliver+yourself+from+both+Scylla+and+Charybdis.+Of+these+two+words+that+he+used%2C+one+delivers+you+from+Arius%3B+we+are+delivers+you+from+Sabellius.+If+one%2C+then+not+different+things%3B+if+we+are%2C+then+both+Father+and+Son.+After+all%2C+he+would+not+say+we+are+of+one+person%3B+but+neither+would+he+say+one+of+different+things.%0A%0ASo+then%2C+he+says+in+a+word%2C+My+judgment+is+true%2C+so+that+you+may+hear%2C+%E2%80%9CI+am+God%E2%80%99s+Son.%E2%80%9D+%E2%80%9CBut+I+am+persuading+you%2C%E2%80%9D+he+goes+on%2C+%E2%80%9Cthat+I+am+God%E2%80%99s+Son+in+such+a+way+that+you+should+understand+that+the+Father+is+with+me%3B+I+am+not+his+Son+in+such+a+way+that+I+have+left+him+behind%3B+I+am+not+here+in+such+a+way+that+I+am+not+also+with+him%3B+he+is+not+there+in+such+a+way+that+he+is+not+also+with+me.+I+have+taken+on+the+form+of+a+slave%2C+but+I+have+not+lost+the+form+of+God+%28Phil+2%3A7%29.%E2%80%9D+So+then%2C+I+am+not+alone%2C+he+says%2C+but+it+is+I+and+the+Father+who+sent+me.%E2%80%9D%0A%0A%E2%80%94+Augustine+of+Hippo%2C+Homilies+on+the+Gospel+of+John+1-40%2C+%28c.+406-20%29%2C+trans.+Edmund+Hill%2C+ed.+Allan+D.+Fitzgerald%2C+The+Works+of+Saint+Augustine%3A+A+Translation+for+the+21st+Century%2C+Volume+12+%28Hyde+Park+NY%3A+New+City+Press%2C+2009%29%2C+36.9%2C+pp+560-62.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb4bd1e65b6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b4bd1e65b6.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/05/24/augustine-of-hippo-on-sabellianism/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-c4af89eb80" data-kw="">
<blockquote><p>The Father’s appointing him to be a sacrifice, doth not impair his own willingness in undertaking. The Father is said to send him and deliver him, John iii. 84, Rom. viii. 32; not that the Son was over-persuaded, or came only out of obedience, without any inclination of his own. The Father being the root and fountain of the deity, all actions are originally ascribed to him, though common to all; so he is first in order of being, as he is first in order of working.

The Father is said to deliver him, because the first motion of redemption is supposed to arise from the will and motion of the Father; yet the love of Christ was the spring of all mediatory actions, and his taking our nature on him; and therefore he is no less said to give himself, than the Father is said to give him to us and for us. God is said to set him forth, Rom. iii. 25; yet he is said to come, Mat. xx. 28, not thrust out or forced to come. God lays our sins upon him, yet Christ is said to bear them.

His engagement was an act of choice, liberty, and affection. He could not be constrained by his Father to undertake it; his will was as free in consenting, as his Father was in proposing. The Spirit is said to be sent by the Father and the Son, to take of Christ’s and show it to us, to fit those for heaven that are given to Christ; yet his distributions are according to his own will: 1 Cor. xii. 11, ‘Dividing to every man according as he will.’

If you consider Christ as one God with the Father, there is but one and the same will in both. Will belongs to essence or nature; the essence of God being one, there are not in God divers wills, though the Godhead be in divers persons, because the power of willing is the nature, not a personal propriety.

The decree of redemption was joint in Father and Son. What Christ decreed as God, he executed as man; and what he willed from eternity, he began in time to will as man, Christ, as God, gave himself to death with the same will and’ by the same action as the Father gave him; but as man he gave himself by a will inspired by the Father.

Yet for our conception’s sake the Scripture represents things so as if they were distinct wills, which yet we must not imagine, any more than because the Scripture, in condescension to our weakness, represents God with eyes, and ears, and hands, we must conceive God to have a fleshly body like ours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Voluntariness of Christ’s Death</cite>, (1684) in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 543-44.</span></figcaption>

</figure><figure class="quote" id="q-9b3732fb85" data-kw="">
<blockquote><p>Therefore the Scripture calleth him the only begotten son of God, that he may put a necessary difference between Christ and all the faithful. For Christ is called, and indeed is the only everlasting son of the everlasting father, begotten of the substance of the father before all world’s: and therefore is every God in who[m] we ought to believe. Pro. 8. Joh. 1.

Now we are called and are the sons of God, not by nature, but by adoption and grace, through which, God hath vouchsafed to adopt us to be his children, whilst he hath made us through faith engrafted into his son, his true and lively members, who otherwise were the members of Satan, and by nature the sons of wrath. Joh. 8. Ephes. 2. But in the mean time, that same adoption, and name of the sons of God, is not only an empty title; but when we are in truth members of the son of God, we have by his grace a true communion and fellowship with him, in respect of which he is called the first begotten amongst many brethren. Rom. 8.</p></blockquote>

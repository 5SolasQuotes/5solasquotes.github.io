<main class="wrap"><figure class="quote" id="q-7c432b1820" data-kw="">
<blockquote><p>Temptation: God has a double calling of men: an outward calling, by preaching the Word in men’s ears; an inward, by the irresistible work of the Spirit in their hearts. The outward calling is a part of God’s outward will: the inward and effectual calling is a part of his secret will. He calls me only with the outward call: and therefore I cannot be assured of God’s goodwill and meaning that I should believe, repent and be saved. Minister: You misconceive Gods calling. His outward calling by preaching the word in men’s ears is a means to convey the sense of the word preached inwardly to their understandings, and mediante intellectu [the intellect mediating], inwardly to stir up their wills to the doing of such things as they now see would make for their eternal good. And I appeal unto your own knowledge and experience: Did the Word preached never pierce further than your ears? Has it not enlightened your understanding with the wholesome doctrine of the gospel? Has not God’s Spirit at some time or other by the Word inwardly moved you to break off your sinful and lustful courses and to lead a sober, just and religious life? Why do you, contrary to your own conscience, falsely accuse God of affording you a bare outward calling, but no inward? Why do you traduce Him as not willing that you should believe, repent and so be saved? Take it for a certain rule: God always wills men should do those things which by his Word-written He enjoins them to do, and by his Spirit enlightening and inciting He so helps them to do that it is only the voluntary perverseness and stubbornness of their own wills resisting the Word and the Spirit which hinders them from doing those things which they should. It is true that God can make any hard and resisting heart a soft and obedient heart; and He does it where He has an eternal purpose out of special mercy so to do: And it is as true that God may justly leave a stubborn heart to his own resistency and perverseness; and this He does where He has purposed in justice so to do. Deus miseretur cujus vult, et quem vult indurat [God shows mercy to whom He wills, and He hardens whom He wills, Rom. 9:18]. If you long to be assured of this secret meaning or purpose of God towards you in particular before you resolve upon your repentance, I can assure you that it is the Devil who has stirred up in you a longing after a thing impossible that so he may procure your destruction. Strive therefore to bring this foolish and wicked fancy out of your mind and to judge of the meaning of God which belongs unto you according to his Word revealed unto you, leaving his secret and unsearchable will unto Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise entitled, God’s Love to Mankind… (Cambridge, 1641), ‘To his imaginary conference’</cite>, pp. 476-77</span></figcaption>

<blockquote><p>The necessity and contingency of things is not to be attributed to God’s decree, but to the working of his power; contingency is when He uses his resistible power; if He works irresistibly then follows necessity: what is contingent to the second cause is infallible to God’s prescience, but necessary to the work of his omnipotency: his decree is a remote cause, which without his power works not. Christ’s death was contingent to the Jews that crucified Him; infallible to God’s prescience, who foresaw that the Jews would kill Him; but necessary in regard of his decree, working by his power in presenting that bitter cup unto Him.</p></blockquote>

<blockquote><p>53. For just as a physician who abolishes and removes disease and restores health; a master who abolishes and takes away servitude and grants freedom to a slave; a lord who breaks and destroys a prison and releases a captive and exalts him to the highest dignity – these are not said to use force upon the sick man, the slave, or the captive. So neither does God use force upon one to whom He provides that renewing grace. And just as it is foreign to debate whether a sick man is restored to health irresistibly, a slave to liberty, a captive to dignity, so it is foreign to this matter to dispute whether God’s renewing grace operates irresistibly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-c-waser.html">Johann C. Waser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Consideration of a Theological Question: Whether the grace of God is a Force, &amp; Whether it is either Resistible or Irresistible (fl. 1628-1667) 22 pp. tr. AI by Confetti</cite>, pp. 21-22</span></figcaption>

</figure><figure class="quote" id="q-74b4201285" data-kw="">
<blockquote><p>First, whether may a wicked man, a man as yet not called, be able to resist and keep off his own call? And that you may understand the answer hereto, I must lay down this distinction: that there is a twofold calling of Christ: a significative calling, and an operative calling. First, a significative calling, which is such a calling whereby Christ, in the ministry of the Word, signifies and declares what He would have men to do. Now this kind of call wicked men may resist; this call, I say, and this revealed will of God, in declaring what graces he would have men act, and what sins he would have men forbear. Therefore we read, Acts 7:51, “You stiff-necked people, and uncircumcised in heart and ears, you have always resisted the Holy Ghost”; meaning the preaching of the Word by the ministry of his apostles. So Prov. 1:24, ‘I have called, and ye have refused,’ etc. But then secondly, there is an operative calling, and that is such a call whereby God does not only signify to a man what he must do, but with the signification of his will gives a man a power to do what He calls him to do, accompanying the Word with his Spirit, making the heart stoop and yield to Jesus Christ. Now this call no man can resist; grace is irresistible; and this effectual calling, by the operation of the Spirit, a man cannot resist. All the gainsayings of the heart, and all the stoutness of the will, it must stoop and must be brought under subjection to Jesus Christ. Jn. 6:37, ‘All that the Father hath given Me,’ says Christ, ‘shall come unto Me.’ They shall not be able to withstand Jesus Christ, but they shall come in unto Him. So Isa. 55:10–11: ‘As the rain comes down, and the snow from heaven, and returns not thither again, but waters the earth, to make it bring forth… so shall my word be that goes out of my mouth; it shall not return in vain, but shall accomplish that which I intended, and it shall prosper in the thing whereto I sent it.’ As all the world cannot hinder the rain from coming down on the earth, no more can any man in the world, if God has an intent to convert and call him, hinder the benefit of the Word from redounding upon his soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise of Effectual Calling &amp; Election... (London: Rothwell, 1653), Sermon 5, on 2 Pet. 1:10</cite>, pp. 64-65</span></figcaption>

 As all the world cannot hinder the rain from coming down on the earth, no more can any man in the world, if God has an intent to convert and call him, hinder the benefit of the Word from redounding upon his soul.”

— Christopher Love, Treatise of Effectual Calling &amp; Election... (London: Rothwell, 1653), Sermon 5, on 2 Pet. 1:10, pp. 64-65">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst%2C+whether+may+a+wicked+man%2C+a+man+as+yet+not+called%2C+be+able+to+resist+and+keep+off+his+own+call%3F+And+that+you+may+understand+the+answer+hereto%2C+I+must+lay+down+this+distinction%3A+that+there+is+a+twofold+calling+of+Christ%3A+a+significative+calling%2C+and+an+operative+calling.+First%2C+a+significative+calling%2C+which+is+such+a+calling+whereby+Christ%2C+in+the+ministry+of+the+Word%2C+signifies+and+declares+what+He+would+have+men+to+do.+Now+this+kind+of+call+wicked+men+may+resist%3B+this+call%2C+I+say%2C+and+this+revealed+will+of+God%2C+in+declaring+what+graces+he+would+have+men+act%2C+and+what+sins+he+would+have+men+forbear.+Therefore+we+read%2C+Acts+7%3A51%2C+%E2%80%9CYou+stiff-necked+people%2C+and+uncircumcised+in+heart+and+ears%2C+you+have+always+resisted+the+Holy+Ghost%E2%80%9D%3B+meaning+the+preaching+of+the+Word+by+the+ministry+of+his+apostles.+So+Prov.+1%3A24%2C+%E2%80%98I+have+called%2C+and+ye+have+refused%2C%E2%80%99+etc.+But+then+secondly%2C+there+is+an+operative+calling%2C+and+that+is+such+a+call+whereby+God+does+not+only+signify+to+a+man+what+he+must+do%2C+but+with+the+signification+of+his+will+gives+a+man+a+power+to+do+what+He+calls+him+to+do%2C+accompanying+the+Word+with+his+Spirit%2C+making+the+heart+stoop+and+yield+to+Jesus+Christ.+Now+this+call+no+man+can+resist%3B+grace+is+irresistible%3B+and+this+effectual+calling%2C+by+the+operation+of+the+Spirit%2C+a+man+cannot+resist.+All+the+gainsayings+of+the+heart%2C+and+all+the+stoutness+of+the+will%2C+it+must+stoop+and+must+be+brought+under+subjection+to+Jesus+Christ.+Jn.+6%3A37%2C+%E2%80%98All+that+the+Father+hath+given+Me%2C%E2%80%99+says+Christ%2C+%E2%80%98shall+come+unto+Me.%E2%80%99+They+shall+not+be+able+to+withstand+Jesus+Christ%2C+but+they+shall+come+in+unto+Him.+So+Isa.+55%3A10%E2%80%9311%3A+%E2%80%98As+the+rain+comes+down%2C+and+the+snow+from+heaven%2C+and+returns+not+thither+again%2C+but+waters+the+earth%2C+to+make+it+bring+forth%E2%80%A6+so+shall+my+word+be+that+goes+out+of+my+mouth%3B+it+shall+not+return+in+vain%2C+but+shall+accomplish+that+which+I+intended%2C+and+it+shall+prosper+in+the+thing+whereto+I+sent+it.%E2%80%99+As+all+the+world+cannot+hinder+the+rain+from+coming+down+on+the+earth%2C+no+more+can+any+man+in+the+world%2C+if+God+has+an+intent+to+convert+and+call+him%2C+hinder+the+benefit+of+the+Word+from+redounding+upon+his+soul.%E2%80%9D%0A%0A%E2%80%94+Christopher+Love%2C+Treatise+of+Effectual+Calling+%26+Election...+%28London%3A+Rothwell%2C+1653%29%2C+Sermon+5%2C+on+2+Pet.+1%3A10%2C+pp.+64-65&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F74b4201285.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/74b4201285.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-common-operations-of-the-spirit/on-the-compatibility-of-irresistible-and-resistible-grace/#:~:text=First%2C%20whether%20may%20a%20wicked%20man,Word%20from%20redounding%20upon%20his%20soul&amp;text=First%2C%20whether%20may%20a%20wicked%20man%2C%20a%20man&amp;text=of%20the%20Word%20from%20redounding%20upon%20his%20soul" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

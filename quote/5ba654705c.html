<blockquote><p>Now, we do not say that every thing is immediately plain and easy in the scriptures, so as to be intelligible to every one; but we say that those things which at first seem obscure and difficult, are afterwards rendered easy, if one be diligent in reading them, and bring with him a pure and pious mind.</p></blockquote>

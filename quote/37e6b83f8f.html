<main class="wrap"><figure class="quote" id="q-37e6b83f8f" data-kw="">
<blockquote><p>That this Worship of God is to be offered to him according to his Written Word. I say, this Worship that is acceptable to him, is written in his Word; if any man shall worship God by the Precepts of men, it is not according to the Will of God: To the Law and to the Testimony? If any man speak not according to this word, it is because there is no light in them, 2 Tim. 2.16, 17. the whole Scripture (the written Word of God, is of Divine Inspiration, and is profitable for Doctrine, for Reproof, &amp;c. The Scripture is a perfect Rule of Faith and Manners, that is a Foundation of Christian Religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise I. Of faith. II. Twelve fundamental articles of Christian religion. III. A doctrinal conclusion. IV. Questions and answers upon church-government. Taken from written copies long since delivered by the late Reverend Mr. John Cotton, teacher of the First Church in Boston, in New-England</cite>, (Boston, 1713), pp 5-6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>A mean or medium, as it is such, is less than the end, though the thing materially that is a mean may be more excellent. Every mean, as a mean, under that reduplication, has all its goodness and excellency in relation to the end; yet an angel that is a mean (or medium) and a ministering spirit, ordained of God for an heir of life eternal (Heb. 1:13) considered materially, is more excellent than a man (Ps. 8:5; Heb. 2:6-8).</p></blockquote>

</figure><figure class="quote" id="q-4df4feb072" data-kw="">
<blockquote><p>Lastly, Sanctification of the Sabbath, by the whole family, in all or most of the duties aforesaid, publicly and privately, is the care of the chief householder; as in the fourth Commandment: Remember thou keep holy the Sabbath day: Thou Master, and thy son and daughter, manservant and maidservant. What need so particular enumeration, if there were not a great weight in the performance thereof?

But where shall we find the family that doth all this? when the Householders themselves neglect or profane it by their own example; and employ their children and servants in businesses, to keep them from the public Congregation, or leave them to come or go at their own pleasure; or to spend the day in Idleness or Sports &amp; pastimes, that day; How can these men say truly, I and my house, we will serve the Lord? I shall only say more truly, what once was falsely applied to our Saviour; This man is not of God, because he keepeth not the Sabbath day: because he takes no care, that his family with him, do keep the Sabbath day. And thus much of the third Use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Family reformation promoted. In a sermon on Joshua, chap. 24. ver. 15.</cite>, (London: John Wright, 1656), pp 40-41.</span></figcaption>

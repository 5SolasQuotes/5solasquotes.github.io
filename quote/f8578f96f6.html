<blockquote><p>Again; this Son of God is Jesus: “Jesus the Son of God.” Jesus is the name of a man: “She shall bring forth a son, and thou shalt call his name Jesus,” Matt. i. 21. And this our high priest also was to be. “Every high priest,” saith our apostle, “is ordained to offer gifts and sacrifices unto God.” And “therefore of necessity’’ he who would be our high priest “must have somewhat to offer,” and that somewhat of his own.

And what had the Son of God, absolutely considered, of his own to offer? His divine nature or person is not to be offered. All things necessarily required in the matter and form of an offering are eternally incompatible with the infinite excellencies of the divine nature. God cannot be a sacrifice, though he who is God was so to be.

Shall he, then, take an offering out of the works of the creation? Shall he take the blood of bulls and goats for this purpose, as did Aaron? The offering, indeed, of these things might represent the sacrifice that should take away sin, but take away sin itself it could not do. For what wisdom, righteousness, or equity, is in this, that whereas man had sinned, other brute creatures, that were none of his own (for whatever right he had to any creatures of God, belonging to his original dominion over them, after his sin he had none at all), should be accepted a sacrifice in his stead?

Besides, what proportion did the blood of bulls and goats bear to the justice of God, that satisfaction for sin should be made unto it thereby? Should, then, the Son of God have taken and appointed any one man to be a sacrifice for himself and others? Every man being a sinner, the sacrifice of any one would have been a provocation unto God. In the typical sacrifices, he would not admit of a lamb or a kid that had the least blemish in it to be offered unto him. And shall we suppose that he would allow of a real expiatory sacrifice by that which was leprous all over? It would have been so far from yielding “a sweet savour to God,” from being an atonement for all men, for any one man, for the man himself that should have been offered, that it would have been the highest provocation unto the eyes of his glory.

Wherefore the Son of God himself became “Jesus;” that is, he took human nature, “the seed of Abraham,” into union with himself, that he might have of his own to offer unto God. This by its oneness with our nature, the nature that had sinned, being itself not touched with sin, was meet to be offered for us; and by its union with his person was meet and able to make atonement with God for us; and so “God redeemed his church with his own blood,” Acts xx. 28. Thus our high priest is “Jesus, the Son of God.”’ And in these things consists his greatness, which the apostle proposeth for our encouragement unto steadfastness in profession.</p></blockquote>

<blockquote><p>As certainly, then, as we are the descendants of the first man created in the image of God, and by transgression fallen from his primaeval condition of holiness, dignity, and happiness, and thus made liable to misery here and to everlasting destruction from the presence of the Lord and from the glory of his power hereafter, so assuredly we inherit a nature corrupted by the spiritual disease which, prevailing against him, brought him low, and incur the penalty of that doom to which he was adjudged by the sentence pronounced on the very spot which had been the scene of his rebellion. “As by one man sin entered into the world, and death by sin, so death hath passed upon all men, for that all have sinned.”

This doctrine has been often derided and loudly anathematised as unworthy of the belief of any but the slaves of a wretched superstition;—the rational thinker laughs to scorn such an absurdity. But if the Word of God were silent on the subject, instead of being as express on the point as language can be, the existence of moral evil is manifest in the experience of every man born of woman, and proclaimed by the accusings of conscience even before the individual who is the object of their attack has been savingly awakened to a sense of his guilt, and renewed in the spirit of his mind, and before he can joyfully declare that with him old things have passed away, and that all things are become new.</p></blockquote>

<blockquote><p>That he ceased to be God when he became man, he did not, and could not. There was no cessation of the Godhead, in the stooping to the manhood. The human did not become Divine, nor did the Divine become human. There was no coalescing, no blending together of these two extremes of being. Mysteriously, closely, and indissolubly one, they yet were separate and distinct, the peculiar properties of each unaffected and unchanged by its union with the other. This constituted one of the essential wonders in the “great mystery of godliness, God manifest in the flesh.”

The deity of Christ was incapable of change, else deity it could not be. It was incapable, too, of any sympathy or participation in the humiliation and suffering through which the humanity passed. Upholding and strengthening the manhood, it yet remained free from all the pains which it endured. Towering far above the storms which swept over the human soul of Christ — above the sea of suffering and blood through which he waded — above the infirmities, weaknesses, and tears which pressed upon the “incarnate mystery,” the Godhead of Jesus rose untouched, unaffected, and unmoved. The shock which convulsed to its centre his human frame, agitated not for an instant, his essential deity. Here all was calm, serene, and tranquil. The dark clouds which gathered around his inferior nature threw not a shadow athwart the sun of his superior nature.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“That he ceased to be God when he became man, he did not, and could not. There was no cessation of the Godhead, in the stooping to the manhood. The human did not become Divine, nor did the Divine become human. There was no coalescing, no blending together of these two extremes of being. Mysteriously, closely, and indissolubly one, they yet were separate and distinct, the peculiar properties of each unaffected and unchanged by its union with the other. This constituted one of the essential wonders in the “great mystery of godliness, God manifest in the flesh.”

The deity of Christ was incapable of change, else deity it could not be. It was incapable, too, of any sympathy or participation in the humiliation and suffering through which the humanity passed. Upholding and strengthening the manhood, it yet remained free from all the pains which it endured. Towering far above the storms which swept over the human soul of Christ — above the sea of suffering and blood through which he waded — above the infirmities, weaknesses, and tears which pressed upon the “incarnate mystery,” the Godhead of Jesus rose untouched, unaffected, and unmoved. The shock which convulsed to its centre his human frame, agitated not for an instant, his essential deity. Here all was calm, serene, and tranquil. The dark clouds which gathered around his inferior nature threw not a shadow athwart the sun of his superior nature.”

— Octavius Winslow, , The Glory of the Redeemer in his Person and Work, (2nd edn, London: John F. Shaw, 1845), pp 15-16.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+he+ceased+to+be+God+when+he+became+man%2C+he+did+not%2C+and+could+not.+There+was+no+cessation+of+the+Godhead%2C+in+the+stooping+to+the+manhood.+The+human+did+not+become+Divine%2C+nor+did+the+Divine+become+human.+There+was+no+coalescing%2C+no+blending+together+of+these+two+extremes+of+being.+Mysteriously%2C+closely%2C+and+indissolubly+one%2C+they+yet+were+separate+and+distinct%2C+the+peculiar+properties+of+each+unaffected+and+unchanged+by+its+union+with+the+other.+This+constituted+one+of+the+essential+wonders+in+the+%E2%80%9Cgreat+mystery+of+godliness%2C+God+manifest+in+the+flesh.%E2%80%9D%0A%0AThe+deity+of+Christ+was+incapable+of+change%2C+else+deity+it+could+not+be.+It+was+incapable%2C+too%2C+of+any+sympathy+or+participation+in+the+humiliation+and+suffering+through+which+the+humanity+passed.+Upholding+and+strengthening+the+manhood%2C+it+yet+remained+free+from+all+the+pains+which+it+endured.+Towering+far+above+the+storms+which+swept+over+the+human+soul+of+Christ+%E2%80%94+above+the+sea+of+suffering+and+blood+through+which+he+waded+%E2%80%94+above+the+infirmities%2C+weaknesses%2C+and+tears+which+pressed+upon+the+%E2%80%9Cincarnate+mystery%2C%E2%80%9D+the+Godhead+of+Jesus+rose+untouched%2C+unaffected%2C+and+unmoved.+The+shock+which+convulsed+to+its+centre+his+human+frame%2C+agitated+not+for+an+instant%2C+his+essential+deity.+Here+all+was+calm%2C+serene%2C+and+tranquil.+The+dark+clouds+which+gathered+around+his+inferior+nature+threw+not+a+shadow+athwart+the+sun+of+his+superior+nature.%E2%80%9D%0A%0A%E2%80%94+Octavius+Winslow%2C+%2C+The+Glory+of+the+Redeemer+in+his+Person+and+Work%2C+%282nd+edn%2C+London%3A+John+F.+Shaw%2C+1845%29%2C+pp+15-16.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F248867e842.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X< <blockquote><p>44. Christ is similar to us in all things, according to nature, but not according to all the weaknesses of nature. These weaknesses are either culpable such as sins: in these things He is not like us; or they are inculpable , such as the affects of sorrow, grief, tears, hunger, weariness: in these things He is like us. Next, weaknesses are either a general punishment of sin, such as the possibility to die, or they are a particular punishment, such as becoming ill. Christ did take up the weaknesses of the first category, not those of the second.</p></blockquote>

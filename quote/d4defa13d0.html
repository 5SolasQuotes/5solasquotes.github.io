<main class="wrap"><figure class="quote" id="q-d4defa13d0" data-kw="">
<blockquote><p>Profession of Christianity is every man’s Church-title. No man is to prove the sincerity of his own profession; nor may the Church require such proof at his hands; For how can a man prove to another the sincerity of his own heart? But the fuller testimony he gives of it, the better it is: And therefore none should refuse to make his own profession, as fully credible to the church as he is able; nor is the church to be blamed for enquiring after the fullest credibility, so be it they do it but ad melius esse [to the better existence], and not ad esse [to the existence of it]; not laying his title upon it, nor refusing him for want [lack] of it. But every profession as such is credible in some degree, which is not disproved. Because men are, under God, the only competent judges of their own hearts: and the belief of one another is the ground of human converse: And it is an injury to any man to account him a liar, without sufficient proof. He that will disprove a man’s profession must prove first that he does not tolerably understand what he says; secondly, or that he speaks not seriously, but in jest; or not voluntarily, but in hypocrisy by constraint, or for some by end: Thirdly, or that he contradicts his own words by some more credible words or deeds. And if you never yet thus disproved men’s profession of Christianity before the pastors of the church and yet cry out against the pastors for admitting them, you are not true reformers, but disorderly mutineers and peevish censurers in the Church of Christ. Christ’s orders and men’s right, and all church-justice, must not be trodden down and sacrificed to your humor and arbitrary way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 16, pp. 112-13</span></figcaption>

<blockquote><p>3. We grant that there may be an express and solemn covenant, in the presence of God and the Church, upon extraordinary occasions, entered into, by all the members of the visible Church of one nation or kingdom: when the Church in that kingdome or nation has made defection from God and his worship, or some other necessity call for it; for the preserving, or propagating, or restoring of the decayed worship of God. By which covenant notwithstanding there does not acrue to the Church of that kingdom any new right, but that right which before they had to enjoy the ordinances of God, which by reason of their defection, or some other cause, was hindered and as it were suspended, they may now freely and purely again reduce to practise. Thus did the Church of God under the Old Testament often in the time of defection, or extraordinary necessity, enter into a solemn covenant in the presence of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/apollonius.html">Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England, concerning the Government of the Church of God</cite>, (1645), ch. 2, ‘Of a Church-Covenant’ Apollonius was a Dutch presbyterian., pp. 15-16</span></figcaption>

</figure><figure class="quote" id="q-9ab316be07" data-kw="">
<blockquote><p>1. Where persons are esteemed members of churches by external causes without their own consent, or by parochial cohabitation, they may remove from one church unto another by the removal of their habitation according unto their own discretion. For such cohabitation being the only formal cause of any relation to such a church in particular, upon the ceasing of that cause, the relation ceases of its own accord. 2. Where persons are members of churches by mutual confederation, or express personal consent, causeless departure from them is an evil liable unto many aggravations. 3. But whereas the principal end of all particular churches is edification, there may be many just and sufficient reasons why a person may remove himself from the constant communion of one church unto that of another. And of these reasons he himself is judge on whom it is incumbent to take care of his own edification above all other things. Nor ought the church to deny unto any such persons their liberty desired, peaceably and according unto order.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Nature of a Gospel Church and Its Government</cite>, … (London, 1689), ch. 10, pp. 225-26 Owen was a congregationalist puritan.</span></figcaption>

" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f2dcc764c1" data-kw="">
<blockquote><p>Question 3: Whether do you not hold all visible believers to be within the visible Church as members thereof, and not ‘without’, in the apostle’s sense, 1 Cor. 5, and therefore ought so to be acknowledged and accepted in all congregations wheresoever they shall come, and are so known: and ought (if they desire and be not otherwise unfit) of right to be permitted to partake in all God’s ordinances and Church privileges there, so far as they personally concern themselves, although they be not as yet fixed members in particular covenant, either with that congregation where for the present they reside, nor with any other? Question 4: Whether you do not hold that baptism rightly (for substance) partaked does make them that are so baptized, members of the visible Church: and so to have right (at least quoad nos [as far as to us]) to all the privileges thereof (so far as they are otherwise fit) until they be cast out (if they so deserve) by excommunication.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 32 Questions (1639) in Richard Mather, Church-Government &amp; Church-Covenant Discussed, in an Answer of the Elders of the Several Churches in New-England to Two &amp; Thirty Questions Sent Over to Them by Diverse Ministers in England, to Declare their Judgments Therein… (London, 1643) Bernard was an English puritan. These questions were answered by the New England congregationalists, but it does not appear that Bernard ever published a response (at least that is on the internet) to those answers.</span></figcaption>

<blockquote><p>I confess there might be in some towns no greater number of Christians than did meet together in one place, notwithstanding whereof the pastor or pastors and elders of that congregation, might and did manage the government of the same, and exercise jurisdiction therein. I confess also that in those cities wherein there was a greater number of Christians than could meet together into one place for the worship of God, the presbytery did consist of the pastors and elders within such a city: For it cannot be proved that there were at that time any Christian congregations in landward villages (the persecution forcing Christians to choose the shelter of cities, for which reason many are of opinion that the infidels in those days were called pagani, because they alone dwelt in pagis [districts]) and if there had been any such adjacent to cities, we must think the same should have been subject to the common presbytery, their own pastors and elders being a part thereof. Howsoever it cannot be called in question that the presbytery in the apostolic Churches was made up of as many as could conveniently meet together, for managing the ordinary matters of jurisdiction and Church-government. The pastors and elders of diverse cities could not conveniently have such ordinary meetings, especially in the time of persecution; only the pastors and elders within one city had such conveniency. And so to conclude, we do not forsake, but follow the patern, when we join together a number of pastors and elders out of the congregations in a convenient circuit, to make up a common presbytery, which has power and authority to govern those congregations; for if the presbytery which we find in those cities wherein the apostles planted churches, be a sure pattern for our classical presbyteries (as we have proved it to be)…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>
<div class="actions"><button class="copy" data-copy="“I confess there might be in some towns no greater number of Christians than did meet together in one place, notwithstanding whereof the pastor or pastors and elders of that congregation, might and did manage the government of the same, and exercise jurisdiction therein. I confess also that in those cities wherein there was a greater number of Christians than could meet together into one place for the worship of God, the presbytery did consist of the pastors and elders within such a city: For it cannot be proved that there were at that time any Christian congregations in landward villages (the persecution forcing Christians to choose the shelter of cities, for which reason many are of opinion that the infidels in those days were called pagani, because they alone dwelt in pagis [districts]) and if there had been any such adjacent to cities, we must think the same should have been subject to the common presbytery, their own pastors and elders being a part thereof. Howsoever it cannot be called in question that the presbytery in the apostolic Churches was made up of as many as could conveniently meet together, for managing the ordinary matters of jurisdiction and Church-government. The pastors and elders of diverse cities could not conveniently have such ordinary meetings, especially in the time of persecution; only the pastors and elders within one city had such conveniency. And so to conclude, we do not forsake, but follow the patern, when we join together a number of pastors and elders out of the congregations in a convenient circuit, to make up a common presbytery, which has power and authority to govern those congregations; for if the presbytery which we find in those cities wherein the apostles planted churches, be a sure pattern for our classical presbyteries (as we have proved it to be)…”

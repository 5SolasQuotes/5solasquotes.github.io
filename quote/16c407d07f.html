<main class="wrap"><figure class="quote" id="q-16c407d07f" data-kw="">
<blockquote><p>Whether it was a natural conception or a miraculous one? The latter is affirmed. Whether the flesh of Christ was conceived and formed in an instant? It is denied. Whether it was first conceived and formed and then united? It is denied with a distinction. …. Whether the soul of Christ was infused in the first instantiating of the conception of the body, or rather after? The latter is affirmed. Whether and in what way the embryo, or that body not yet animated, was able to be said to be the body of Christ? It is explained. Whether the flesh of Christ had its beginning from Adam? It is affirmed with a distinction. … Whether in the instantiating of the conception or of the union Christ was sactified by grace? It is distinguished. Whether in the same instantiating it had the use of free choice and reason? It is denied. Whether in the same instantiating, He was able to merit? It is denied. Whether from the first moment of conception Christ enjoyed the beatific vision? It is denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Syllabus of Theological Problems… (Utrecht, 1643), Tract 2, On the Person, Offices &amp; States of Christ the Mediator, Title 1, on the Person of Christ the Mediator, Subtitle: On the Assumption &amp; Union of the Human Nature. trans. T. Fentiman | On the Conception &amp; Gestation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

edbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=Whether%20it%20was%20a%20natural%20conception,the%20beatific%20vision%3F%20It%20is%20denied&amp;text=Whether%20it%20was%20a%20natural%20conception%20or%20a&amp;text=Christ%20enjoyed%20the%20beatific%20vision%3F%20It%20is%20denied" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0c98fff008" data-kw="">
<blockquote><p>For example, take the embryo; we affirm that this properly lives as soon as the heart partakes of life, although the other members of the body are not yet developed. Why, then, should we not say, that the spiritual embryo, from that very moment in which the heart is embued with spiritual life, is quickened or regenerated, although many parts of sanctification have not yet acquired their distinct, and, as it were, perfect development.</p></blockquote>

t" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-d85c9b58fd" data-kw="">
<blockquote><p>Moreover, the operation of the Holy Spirit signified in coming upon and overshadowing​ had in general the following components, that: (1) He separated some​ particle of the Virgin’s substance, from which the body of Christ was formed​ (Heb. 10:5). (2) He bestowed a molding force upon the separated particle, by​ means of which the Virgin’s seed alone could do in the conception what from the​ order of nature both seeds, the male and female, can do. (3) He as it were cleansed the seed of the Virgin, not indeed from moral impurity or sin, inasmuch as a seed not yet ensouled is not liable to that, but from physical intemperateness, from​ which, in its own time, sin could have resulted, or at the least He preserved the​ birth from all impurity, to the end that what would be born of her would be​ holy (Luke 1:35). (4) He gradually formed that seed of the Virgin into human members, in the way that they are formed in ordinary generation (Heb. 10:5).​ (5) When the body was already formed, He joined to it a rational soul (Zech.​ 12:1). (6) In uniting the soul to the body, at one and the same time he inseparably joined the divine person to both united parts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (RHB), vol. 4, bk. 5, ch. 10, section 5, pp. 298-99​</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

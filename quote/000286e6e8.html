<main class="wrap"><figure class="quote" id="q-000286e6e8" data-kw="">
<blockquote><p>Thus Christ assented, and from everlasting struck hands with God, to put upon him man’s person, and to take upon him his name, and to enter in his stead in obeying his Father, and to do all for man that he should require, and to yield in man’s flesh the price of the satisfaction of the just judgment of God, and, in the same flesh, to suffer the punishment that man had deserved; and this he undertook under the penalty that lay upon man to have undergone. And thus was justice satisfied, and mercy by the Lord Jesus Christ; and so God took Christ’s single bond; whence Christ is not only called the “surety of the covenant for us,” Heb. vii. 22, but the covenant itself, Isa. xlix. 8. And God laid all upon him, that he might be sure of satisfaction; protesting that he would not deal with us, nor so much as expect any payment from us; such was his grace.

And thus did our Lord Jesus Christ enter into the same covenant of works that Adam did to deliver believers from it: he was contented to be under all that commanding, revenging authority, which that covenant had over them, to free them from the penalty of it; and in that respect, Adam is said to be a type of Christ, as you have it, Rom. v, 14, “Who was the type of him that was to come.” To which purpose, the titles which the apostle gives these two, Christ and Adam, are exceeding observable: he calls Adam the “first man,” and Christ our Lord the “second man,” 1 Cor. xv. 47: speaking of them as if there never had been any more men in the world besides these two; thereby making them the head and root of all mankind, they having, as it were, the rest of the sons of men included in them.

The first man is called the “earthy man;” the second man, Christ, is called the ” Lord from heaven,” 1 Cor. xv. 47. The earthy man had all the sons of men born into the world included in him, and is so called, in conformity unto them, the “first man;” the second man, Christ, is called the “Lord from heaven,” who had all the elect included in him, who are said to be the “first-born,” and to have their “names written in heaven,” Heb. xii. 23, and therefore are oppositely called “heavenly men:” so that these two, in God’s account, stood for all the rest. And thus you see, that the Lord, willing to show mercy to the fallen creature, and withal to maintain the authority of his law, took such a course as might best manifest his clemency and severity. Christ entered into covenant, and became surety for man, and so became liable to man’s engagements: for he that answers as a surety must pay the same sum of money that the debtor oweth.

And thus have I endeavoured to show you, how we are to conceive of God’s eternal purpose in sending of Jesus Christ to help and deliver fallen mankind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1646) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), vii, 184-86.</span></figcaption>

<blockquote><p>3. It is not impossible that one act should be so high and intense in its kind as to induce a habit into the subject, and so Adam’s nature be vitiated by it; and he begot a son in his own likeness. The devils upon one sin became obstinate in all the wickedness that their nature is capable of. (2.) This one act was a breach of covenant with God, upon the tenor and observation whereof depended the enjoyment of all that strength and rectitude with God wherewith, by the law of his creation, man was endued, (3.) All man’s covenant good, for that eternal end to which he was created, depended upon his conformity to God, his subjection to him, and dependence on him; all which, by that one sin, he wilfully cast away for himself and posterity (whose common, natural, and federal head he was), and righteously fell into that condition which we have described. (4.) The apostle is much of a different mind from our catechists, Rom. v. 15, 16, etc., as hath been declared.

4. What is credible concerning God and his goodness with these gentlemen I know not. To me, that is not only in itself credible which lie hath revealed concerning himself, but of necessity to be believed. That he gave man a law, threatening him, and all his posterity in him and with him, with eternal death upon the breach of it; that upon that sin he cast all mankind judicially out of covenant, imputing that sin unto them all unto the guilt of condemnation, seeing it is “his judgment that they who commit sin are worthy of death;” and that ” he is of purer eyes than to behold evil,” — is to us credible, yea, as was said, of necessity to be believed. But they will answer the proofs that are produced from Scripture in the asserting of this original sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Evangelicæ; or, The Mystery of the Gospel Vindicated and Socinianism Examined</cite>, (Oxford, 1655) in William H. Goold (ed.), The Works of John Owen (1850-53; 16 vols, Edinburgh: Banner of Truth, 1966), xii, 165.</span></figcaption>

<blockquote><p>Vers. 3. For I testify again to every man that is circumcised, that he is a debtor to do the whole Law.

Argum. 3. Is established by the same obtestation. The Covenant of Works being abrogated, and the Ceremonial Law now abolished, if any one returns to Circumcision, the Sacrament of initiation to this Legal Covenant, he by this means makes himself a debtor to the whole Law, and consequently obliges himself to the curse, unless he perfectly with his whole strength fulfil the Law, which is the condition of the Covenant of Works. The matter is clear.

Because, although Circumcision by the purpose of God to the faithful, expecting the Messias, until Christ, was a Sacrament of the Righteousness of Faith (as Abraham was circumcised) and although in the time of toleration till the clear manifestation of Christian Liberty to them that were born Jews, Circumcision was accounted amongst things indifferent (so Timothy born of a Jewish Mother is circumcised, and Titus is not) yet to all the Jews and Proselytes of the Gentiles seeking Righteousness by Works, or by the Law, Circumcision is made part of the Legal Righteousness, or of the Obedience of the Covenant of Works, yea, and the Sacrament of that Covenant.

And after this manner the false Apostles did urge Circumcision amongst the Galatians, to whom religious Circumcision was every way unlawful. No wonder then if he said Christ will not profit them, if they bee circumcised, because they that were circumcised, by that very fact did embrace the Covenant of Works.

Vers. 4. Christ is become of no effect unto you, whosoever of you are justified by the Law: yee are fallen from Grace.

Argum. 4. Confirming the former, whosoever of you return to Circumcision, and Legal Customs abolished, seeking Justification by the Law, yet by that same fact renounce Christ, and the Covenant of Grace, because the Covenant of Works, and the Covenant of Grace in Christ, do mutually exclude one another, neither can they consist. For if Justification is by Works, it is not by Grace, and on the contrary: Therefore ye must stand in your liberty, except you would be separated from Grace and Christ.</p></blockquote>

<blockquote><p>I shall confirm this great truth, and evince the being of such a covenant. It is altogether denied by the Arminians that there was any such covenant, and amongst ourselves by Professor [John] Simson, that it was a proper covenant. The weight of this matter lies here, that if the covenant made with Adam was not a proper covenant, he could not be a proper representing head; and if he was not, then there cannot be a proper imputation of Adam’s sin unto his posterity. None could over dream, but there must be a manifest difference betwixt covenants between God and man, and those between men and men. There is no manner of equality betwixt God and man; God could require all duty of men without any covenant; yea, they have nothing but what is from him, and so owe it to him.

But those things do not hinder, that, upon God’s condescending to enter into a covenant with man, there may be a proper covenant betwixt them. Though all similitudes here must halt; yet let us suppose a father to propose to his son, that if he will obey his orders, and especially in one point give him punctual obedience, for instance, labour his vineyard, he will give him a certain sum of money; and the son having nothing to labour it with, the father furnishes him with all things necessary thereto; the son accepts of this proposal. Can any man say that there is not a proper bargain, or covenant, in this case betwixt the father and his son, although the son was tied by the bond of nature to obey his father’s commands in all this antecedently to the bargain, and though he has nothing to labour it with, but what he has from the father? Let him perform his father’s orders now according to the covenant, and he can challenge the sum as a debt, which he could not do before. For proof of this, consider, …

Here is a concurrence of all that is necessary to constitute a true and proper covenant of works. The parties contracting, God and man; God requiring obedience as the condition of life; a penalty fixed in case of breaking; and man acquiescing in the proposal. The force of this cannot be evaded, by comparing it with the consent of subjects to the laws of an absolute prince. For such a law proposed by a prince, promising a reward upon obedience to it, is indeed the proposing of a covenant, the which the subject consenting to for himself and his, and taking on him to obey, does indeed enter into a covenant with the prince, and having obeyed the law may claim the reward by virtue of paction. And so the covenant of works is ordinarily in scripture called ”the law,” being in its own nature a pactional law. …

It is expressly called a covenant in scripture, Gal. iv. 24, “For these are the two covenants, the one from the Mount Sinai,” &amp;c. This covenant from Mount Sinai was the covenant of works as being opposed to the covenant of grace, namely, the law of the ten commandments, with promise and sanction, as before expressed. At Sinai it was renewed indeed, but that was not its first appearance in the world. For there being but two ways of life to be found in scripture, one by works, the other by grace; the latter hath no place, but where the first is rendered ineffectual; therefore the covenant of works was before the covenant of grace in the world; yet the covenant of grace was promulgated quickly after Adam’s fall; therefore the covenant of works behoved to have been made with him before.

And how can one imagine a covenant of works set before poor impotent sinners, if there had not been such a covenant with man in his state of integrity? Hos. vi. 7, “But as for them; like Adam, they have transgressed the covenant.” Our translators set the word Adam on the margin. But in Job xxxi. 33, they translate the very same word, “as Adam.” This word occurs but three times in scripture, and still in the same sense. Job xxxi. 33, “If I covered my transgressions, as Adam,” Psalm Ixxxii. 7, “But ye shall die like Adam.” Compare ver. 6, “I have said. Ye are gods; and all of you are children of the Most High;” compared with Luke iii. 38, “Adam, which was the son of God.” And also here, Hos. vi. 7. While Adam’s hiding his sin, and his death are made an example, how natural is it that his transgression, that led the way to all, be made so too? This is the proper and literal sense of the words; it is so read by several, and is certainly the meaning of it. …

We find a law of works opposed to the law of faith, Rom. iii. 27, “Where is boasting then? It is excluded. By what law? of works? Nay; but by the law of faith.” This law of works is the covenant of works, requiring works, or obedience, as the condition pleadable for life; for otherwise the law as a rule of life requires works too. Again, it is a law that does not exclude boasting, which is the very nature of the covenant of works, that makes the reward to be of debt. And further, the law of faith is the covenant of grace; therefore the law of works is the covenant of works. So Rom. vi. 14, “Ye are not under the law, but under grace.” And this was the way of life without question, which was given to Adam at first. …

There were sacramental signs and seals of this transaction in paradise. As it has pleased the Lord still to deal with man in the way of a covenant, so to append seals to these covenants. God’s covenant with Noah, that he would not destroy the earth again with water, had the rainbow as a sign of it to confirm it. Gen. ix. 12, 13. The covenant with Abraham had circumcision; that with the Israelites, circumcision and the passover; and the new covenant with the New Testament church, baptism and the Lord’s supper. So to the covenant of works God appended the two trees; the tree of life, Gen. iii. 22, ”And now lest he put forth his hand, and take also of the tree of life, and eat, and live for ever;” and the tree of the knowledge of good and evil, mentioned in the words of the text. When we find then confirming seals of this transaction, we must own it to be a covenant. …

Lastly, All mankind are by nature under the guilt of Adam’s first sin; Rom. v. 12, “As by one man sin entered into the world, and death by sin, and so death passed upon all men, for that all have sinned.” And they are under the curse of the law before they have committed actual sin: hence they are said to be “by nature children of wrath,” Eph. ii. 3, which they must needs owe to Adam’s sin, as imputed to them. This must be owing to a particular relation betwixt them and him; which must either be, that he is their natural head simply, from whence they derive their natural being; but then the sins of our immediate parents, and all other mediate ones too, behoved to be imputed rather than Adam’s, because our relation to them is nearer; or because he is our federal head also, representing us in the first covenant. And that is the truth, and evidences the covenant of works made with Adam to have been a proper covenant.</p></blockquote>

+with+man+in+the+way+of+a+covenant%2C+so+to+append+seals+to+these+covenants.+God%E2%80%99s+covenant+with+Noah%2C+that+he+would+not+destroy+the+earth+again+with+water%2C+had+the+rainbow+as+a+sign+of+it+to+confirm+it.+Gen.+ix.+12%2C+13.+The+covenant+with+Abraham+had+circumcision%3B+that+with+the+Israelites%2C+circumcision+and+the+passover%3B+and+the+new+covenant+with+the+New+Testament+church%2C+baptism+and+the+Lord%E2%80%99s+supper.+So+to+the+covenant+of+works+God+appended+the+two+trees%3B+the+tree+of+life%2C+Gen.+iii.+22%2C+%E2%80%9DAnd+now+lest+he+put+forth+his+hand%2C+and+take+also+of+the+tree+of+life%2C+and+eat%2C+and+live+for+ever%3B%E2%80%9D+and+the+tree+of+the+knowledge+of+good+and+evil%2C+mentioned+in+the+words+of+the+text.+When+we+find+then+confirming+seals+of+this+transaction%2C+we+must+own+it+to+be+a+covenant.+%E2%80%A6%0A%0ALastly%2C+All+mankind+are+by+nature+under+the+guilt+of+Adam%E2%80%99s+first+sin%3B+Rom.+v.+12%2C+%E2%80%9CAs+by+one+man+sin+entered+into+the+world%2C+and+death+by+sin%2C+and+so+death+passed+upon+all+men%2C+for+that+all+have+sinned.%E2%80%9D+And+they+are+under+the+curse+of+the+law+before+they+have+committed+actual+sin%3A+hence+they+are+said+to+be+%E2%80%9Cby+nature+children+of+wrath%2C%E2%80%9D+Eph.+ii.+3%2C+which+they+must+needs+owe+to+Adam%E2%80%99s+sin%2C+as+imputed+to+them.+This+must+be+owing+to+a+particular+relation+betwixt+them+and+him%3B+which+must+either+be%2C+that+he+is+their+natural+head+simply%2C+from+whence+they+derive+their+natural+being%3B+but+then+the+sins+of+our+immediate+parents%2C+and+all+other+mediate+ones+too%2C+behoved+to+be+imputed+rather+than+Adam%E2%80%99s%2C+because+our+relation+to+them+is+nearer%3B+or+because+he+is+our+federal+head+also%2C+representing+us+in+the+first+covenant.+And+that+is+the+truth%2C+and+evidences+the+covenant+of+works+made+with+Adam+to+have+been+a+proper+covenant.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+A+View+of+the+Covenant+of+Works%2C+from+the+Sacred+Records%2C+%281772%29+in+The+Whole+Works+of+the+Late+Reverend+Thomas+Boston+of+Ettrick%2C+ed.+Samuel+McMillan+%2812+vols%2C+Aberdeen%3A+George+and+Robert+King%2C+1852%29%2C+11%3A+180-83.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F87c2b677cc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/87c2b677cc.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/03/25/thomas-boston-a-refutation-of-the-arminian-denial-of-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>But the special and principal Covenant which is especially called the Old, and is distinguished from the New Covenant of the Gospel, is God’s making and renewing of the Covenant with Israel, partly by his own mouth, and partly by the ministry of Moses on Mount Horeb, which is mentioned Exod. 19. 20. For that Covenant is a mixt Covenant, partly of the Covenant of Works, which is the Old Covenant, partly of the Covenant of Grace, which was made after the fall.

First, God sent Moses to the people to ask whether they would obey the Lord’s voice, and keep all his Commandments, that they might thereby live and be blessed. They answered all together, and said, All that the Lord hath spoken we will do. Thereupon the Lord came down upon Mount Sinai, in fire and smoke and with terrible Thunders and Lightnings, and the sound of a Trumpet, and spake unto them the words of the Law immediately with his own mouth, promising life to them that kept it, and threatening death to the breakers thereof,

Now this was but a repeating, and renewing of the first Covenant of Works, to be performed by every man in his own person, for the obtaining of life. In this therefore there was no Mediator between God and the people.

The Reasons why the Lord thus began with Israel, and first renewed the Old Covenant, were divers.

The first, was their pride, presumption, and hardness of heart; they presumed that they could do all that the Lord would command them, and therefore he gave them his Law to shew them their duty; that they assaying to fulfil it, and finding their own insufficiency, might be humbled and brought down from vain confidence in their own Works.

Here the Lord did deal with them, as wise fathers deal with their foolish &amp; vain boasting sons, who do promise largely that they will do any thing which their fathers will command them, and that by their merits they will bind their fathers to love them, and to give them the inheritance. In such a case, a wise father will put such a boasting son to the trial, and will put him to a task which he knoweth that he is unable to go through; not because he believes, or hopes that his son can perform it (being through his own intemperance disabled) but for this end, to make him see his own folly and insufficiency. And so the Lord did deal with Israel.

Secondly, the Lord gave the Law, which is the rule of righteousness, and withal shewed the punishment due to the transgressors of it; that it might be as the rod of a Schoolmaster, to drive them to Christ, to learn the saving knowledge, and way of life in him, as the Apostle speaks, Gal. 3. and to make them out of fear renounce themselves, and seek mercy in him.

Thirdly, to teach them and us, that howsoever it is impossible for us to be saved by the Law, by reason of our sinful flesh, and our corruption which hath utterly disabled us, that we cannot obey it; yet the Law is still in force, and requires perfect righteousness; and without the righteousness of the Law fulfilled by Christ for us, we cannot be justified nor saved, according to that saying of the Apostle, Christ is the end of the Law for righteousness to every one that believeth, Rom. 10. 4. For these and such like reasons God gave the Law.

But when the people of Israel heard the Law, which was the Covenant of Works to be performed in their own persons, and that immediately from God himself, it is said that they were sore afraid, and being not able to abide the sight of God’s glory, nor the sound of his voice, they cried out, Why should we die? and hereupon they began to desire a Mediator, even Moses, saying, Go thou &amp; hear the Lord, &amp; speak thou to us, Exod. 20. 19. and Deut. 5. 25, 26, 27. This was some good beginning; the Law began to take effect, and to drive them towards a Mediator.

And therefore the Lord said, They have well spoken all that they have said, to wit, in desiring a Mediator; &amp; added withal, O that there were in them such an heart, that they would fear me, and keep my Commandments always: that it might be well with them and their children! Which words shew the Will and Mind of God, wishing after a sort their increase and continuance in this good mind and fear of him, and seeking to keep his Commandments, in, and by a Mediator. Whereupon he proceeds to deal with them by a Mediator, and to renew the Covenant with them, by appointing divers figures of Christ, as Sacrifices, Rites, Ceremonies, the Tabernacle, the Ark of the Covenant, and the Mercy Seat; in all which, as in Types, he did reveal Christ, though obscurely, unto them, and shewed that sin was to be expiated and purged away by his Death.

Afterward, also when they came into the land of Moab, he did renew the Covenant of Grace in more plain terms, than he did on Mount Horeb; insomuch that by reason of the greater plainness, it is called another Covenant, Deut. 29. 2. There he told them, that Christ should be their Rock, Deut. 32. 4. and that the Word, his Gospel, was among them.

Now because of the first part of this Covenant, to wit, the ten Commandments which God spake first, and after gave them written in two Tables, which are called by the name of Covenant, Deu. 4. 13. and 9. 9. and indeed are the sum of the Old Covenant which God made with men in the Creation;

This Covenant, which God made with Israel, is called the Old Covenant, and the Covenant of the Law, and is opposed to the Covenant of the Gospel, that is, to the Covenant, as it is now revealed in the writings of the Evangelists and Apostles, and plainly preached and published over all the world.

Thus much for the Old Covenant.</p></blockquote>

— George Walker, The manifold wisdom of God In the divers dispensation of grace by Jesus Christ, In the Old New Testament. In the covenant of faith. In the covenant of works. Their agreement and difference, (London: John Bartlet, 1641), pp 66-72.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+the+special+and+principal+Covenant+which+is+especially+called+the+Old%2C+and+is+distinguished+from+the+New+Covenant+of+the+Gospel%2C+is+God%E2%80%99s+making+and+renewing+of+the+Covenant+with+Israel%2C+partly+by+his+own+mouth%2C+and+partly+by+the+ministry+of+Moses+on+Mount+Horeb%2C+which+is+mentioned+Exod.+19.+20.+For+that+Covenant+is+a+mixt+Covenant%2C+partly+of+the+Covenant+of+Works%2C+which+is+the+Old+Covenant%2C+partly+of+the+Covenant+of+Grace%2C+which+was+made+after+the+fall.%0A%0AFirst%2C+God+sent+Moses+to+the+people+to+ask+whether+they+would+obey+the+Lord%E2%80%99s+voice%2C+and+keep+all+his+Commandments%2C+that+they+might+thereby+live+and+be+blessed.+They+answered+all+together%2C+and+said%2C+All+that+the+Lord+hath+spoken+we+will+do.+Thereupon+the+Lord+came+down+upon+Mount+Sinai%2C+in+fire+and+smoke+and+with+terrible+Thunders+and+Lightnings%2C+and+the+sound+of+a+Trumpet%2C+and+spake+unto+them+the+words+of+the+Law+immediately+with+his+own+mouth%2C+promising+life+to+them+that+kept+it%2C+and+threatening+death+to+the+breakers+thereof%2C%0A%0ANow+this+was+but+a+repeating%2C+and+renewing+of+the+first+Covenant+of+Works%2C+to+be+performed+by+every+man+in+his+own+person%2C+for+the+obtaining+of+life.+In+this+therefore+there+was+no+Mediator+between+God+and+the+people.%0A%0AThe+Reasons+why+the+Lord+thus+began+with+Israel%2C+and+first+renewed+the+Old+Covenant%2C+were+divers.%0A%0AThe+first%2C+was+their+pride%2C+presumption%2C+and+hardness+of+heart%3B+they+presumed+that+they+could+do+all+that+the+Lord+would+command+them%2C+and+therefore+he+gave+them+his+Law+to+shew+them+their+duty%3B+that+they+assaying+to+fulfil+it%2C+and+finding+their+own+insufficiency%2C+might+be+humbled+and+brought+down+from+vain+confidence+in+their+own+Works.%0A%0AHere+the+Lord+did+deal+with+them%2C+as+wise+fathers+deal+with+their+foolish+%26+vain+boasting+sons%2C+who+do+promise+largely+that+they+will+do+any+thing+which+their+fathers+will+command+them%2C+and+that+by+their+merits+they+will+bind+their+fathers+to+love+them%2C+and+to+give+them+the+inheritance.+In+such+a+case%2C+a+wise+father+will+put+such+a+boasting+son+to+the+trial%2C+and+will+put+him+to+a+task+which+he+knoweth+that+he+is+unable+to+go+through%3B+not+because+he+believes%2C+or+hopes+that+his+son+can+perform+it+%28being+through+his+own+intemperance+disabled%29+but+for+this+end%2C+to+make+him+see+his+own+folly+and+insufficiency.+And+so+the+Lord+did+deal+with+Israel.%0A%0ASecondly%2C+the+Lord+gave+the+Law%2C+which+is+the+rule+of+righteousness%2C+and+withal+shewed+the+punishment+due+to+the+transgressors+of+it%3B+that+it+might+be+as+the+rod+of+a+Schoolmaster%2C+to+drive+them+to+Christ%2C+to+learn+the+saving+knowledge%2C+and+way+of+life+in+him%2C+as+the+Apostle+speaks%2C+Gal.+3.+and+to+make+them+out+of+fear+renounce+themselves%2C+and+seek+mercy+in+him.%0A%0AThirdly%2C+to+teach+them+and+us%2C+that+howsoever+it+is+impossible+for+us+to+be+saved+by+the+Law%2C+by+reason+of+our+sinful+flesh%2C+and+our+corruption+which+hath+utterly+disabled+us%2C+that+we+cannot+obey+it%3B+yet+the+Law+is+still+in+force%2C+and+requires+perfect+righteousness%3B+and+without+the+righteousness+of+the+Law+fulfilled+by+Christ+for+us%2C+we+cannot+be+justified+nor+saved%2C+according+to+that+saying+of+the+Apostle%2C+Christ+is+the+end+of+the+Law+for+righteousness+to+every+one+that+believeth%2C+Rom.+10.+4.+For+these+and+such+like+reasons+God+gave+the+Law.%0A%0ABut+when+the+people+of+Israel+heard+the+Law%2C+which+was+the+Covenant+of+Works+to+be+performed+in+their+own+persons%2C+and+that+immediately+from+God+himself%2C+it+is+said+that+they+were+sore+afraid%2C+and+being+not+able+to+abide+the+sight+of+God%E2%80%99s+glory%2C+nor+the+sound+of+his+voice%2C+they+cried+out%2C+Why+should+we+die%3F+and+hereupon+they+began+to+desire+a+Mediator%2C+even+Moses%2C+saying%2C+Go+thou+%26+hear+the+Lord%2C+%26+speak+thou+to+us%2C+Exod.+20.+19.+and+Deut.+5.+25%2C+26%2C+27.+This+was+some+good+beginning%3B+the+Law+began+to+take+effect%2C+and+to+drive+them+towards+a+Mediator.%0A%0AAnd+therefore+the+Lord+said%2C+They+have+well+spoken+all+that+they+have+said%2C+to+wit%2C+in+desiring+a+Mediator%3B+%26+added+withal%2C+O+that+there+were+in+them+such+an+heart%2C+that+they+would+fear+me%2C+and+keep+my+Commandments+always%3A+that+it+might+be+well+with+them+and+their+children%21+Which+words+shew+the+Will+and+Mind+of+God%2C+wishing+after+a+sort+their+increase+and+continuance+in+this+good+mind+and+fear+of+him%2C+and+seeking+to+keep+his+Commandments%2C+in%2C+and+by+a+Mediator.+Whereupon+he+proceeds+to+deal+with+them+by+a+Mediator%2C+and+to+renew+the+Covenant+with+them%2C+by+appointing+divers+figures+of+Christ%2C+as+Sacrifices%2C+Rites%2C+Ceremonies%2C+the+Tabernacle%2C+the+Ark+of+the+Covenant%2C+and+the+Mercy+Seat%3B+in+all+which%2C+as+in+Types%2C+he+did+reveal+Christ%2C+though+obscurely%2C+unto+them%2C+and+shewed+that+sin+was+to+be+expiated+and+purged+away+by+his+Death.%0A%0AAfterward%2C+also+when+they+came+into+the+land+of+Moab%2C+he+did+renew+the+Covenant+of+Grace+in+more+plain+terms%2C+than+he+did+on+Mount+Horeb%3B+insomuch+that+by+reason+of+the+greater+plainness%2C+it+is+called+another+Covenant%2C+Deut.+29.+2.+There+he+told+them%2C+that+Christ+should+be+their+Rock%2C+Deut.+32.+4.+and+that+the+Word%2C+his+Gospel%2C+was+among+them.%0A%0ANow+because+of+the+first+part+of+this+Covenant%2C+to+wit%2C+the+ten+Commandments+which+God+spake+first%2C+and+after+gave+them+written+in+two+Tables%2C+which+are+called+by+the+name+of+Covenant%2C+Deu.+4.+13.+and+9.+9.+and+indeed+are+the+sum+of+the+Old+Covenant+which+God+made+with+men+in+the+Creation%3B%0A%0AThis+Covenant%2C+which+God+made+with+Israel%2C+is+called+the+Old+Covenant%2C+and+the+Covenant+of+the+Law%2C+and+is+opposed+to+the+Covenant+of+the+Gospel%2C+that+is%2C+to+the+Covenant%2C+as+it+is+now+revealed+in+the+writings+of+the+Evangelists+and+Apostles%2C+and+plainly+preached+and+published+over+all+the+world.%0A%0AThus+much+for+the+Old+Covenant.%E2%80%9D%0A%0A%E2%80%94+George+Walker%2C+The+manifold+wisdom+of+God+In+the+divers+dispensation+of+grace+by+Jesus+Christ%2C+In+the+Old+New+Testament.+In+the+covenant+of+faith.+In+the+covenant+of+works.+Their+agreement+and+difference%2C+%28London%3A+John+Bartlet%2C+1641%29%2C+pp+66-72.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8c95360e58.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8c95360e58.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/03/30/george-walker-on-the-republication-of-the-covenant-of-works-under-moses/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

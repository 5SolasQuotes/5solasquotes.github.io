<main class="wrap"><figure class="quote" id="q-d26db49126" data-kw="">
<blockquote><p>46. The assumption of the human nature in the divine hypostasis did not cause any change in the divine nature, but only in the human nature. For all change is either generation or corruption or augmentation or diminution or alteration or local motion. Nothing of this kind, however, takes place in the divine nature.

47. The union of both natures of Christ is incomprehensible to us. The reason is that it is a union of the finite with the infinite. Even if the union between Christ and the Church is incomprehensible to us, all the more this mystery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Discourse: The Distinctions &amp; Rules of Theology &amp; Philosophy</cite>, (1644), ch. 11, ‘On the Person &amp; Office of Christ’, p. 233</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

<blockquote><p>[The] Use of all is to press us to this weighty duty of living to God, and not to ourselves. Not to our own will and interest, and according to the will, and for the glory of God. Motives: 1. Christ’s self-denial, who came from heaven not only to expiate our offenses, but to give us an example. And wherein was the example? He tells us He came not to do his own will, but the will of Him that sent Him, Jn. 6:38. And to promote his Father’s glory, Jn. 8:50, ‘I seek not my own Glory’? He was still guided by his Fathers will, and had his orders from heaven for all that He did. Now how did He do the will of God and seek the glory of God? He did it with delight, Jn 4:34, ’twas meat and drink to Him to do his Fathers will. A will wedded to itself, and his own honour and ease, and credit, is most unlike Christ. And He did it with much patience, and self-denial, Rom. 15:3. He pleased not Himself, that is, sought not the interests of that life He had assumed, but contradicted them by his fastings, temptations sufferings, through the reproaches, and ingratitude of men, and outward meanness, and poverty of his condition. And especially by his death, and passion there, he humbled Himself, and made Himself of no reputation, Phil. 2:4-8. That the same mind might be in us; that we might learn that life, and all the comforts of life, should not be so dear to us, as the love of God, and everlasting life; for Christ loved not his life in comparison of love to his Father and his Church. He preferred the pleasing of his Father in the work of redemption, before his own life. Christ emptied himself , that God might be glorified. How unwilling are ye to go back two or three degrees in your pomp or pleasure, or profit, for God’s sake, when the Sun of righteousness went back ten degrees.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton in two parts: the first containing 27 Sermons on the Twenty-Fifth chapter of St. Matthew</cite>, ... (London: Robinson, 1684), Sermons on 2 Cor. 5, sermon 29, on 2 Cor. 5:15, p. 187</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-1195304235" data-kw="">
<blockquote><p>Theodoret does rightly and truly tell us that even the common people are hardly accustomed to speak any otherwise [about Christ’s person and his natures]: for if Peter speak, who would not rather say that Peter speaks, than say that Peter’s body or tongue speaks? and yet notwithstanding, neither does Peter’s mind, nor his foot nor any other member speak, but his tongue or mouth. But because these things have even personally grown up (as it were) together [in the Logos’s assumption of human nature], and are come into one subsistence or being, that is truly in the concrete attributed to, and spoken of the whole, which if it were uttered of the parts of the whole considered severally and by themselves, should be falsely spoken. What more? By reason of this personal union [between a person and his nature], though now it be dissolved through death, Peter shall be said to have died and sat [buried] at Rome, whose soul yet notwithstanding, neither is dead, neither anywhere placed upon the earth. So when I say [that] the eternal Son of God died, I consider and mean Him as He is whole-Christ, although I denominate Him after one of his natures, to wit, his mortal or human nature. So again I say [that] this man forgives sins, and yet not as He is man of Himself (for it belongs only to God to forgive sins), but because He is God and man in one person together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two Very Learned Sermons of Mr. Beza, together with a Short Sum of the Sacrament of the Lord’s Supper</cite>, … (London, 1588), ‘The First Homily… 1574’, pp. 38-9</span></figcaption>

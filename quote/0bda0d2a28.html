</figure><figure class="quote" id="q-6250c7f226" data-kw="">
<blockquote><p>The reason of this assertion [by opponents] is given to be this, that a bodily gesture being necessary, God not determining man upon any one, leaves him at plain liberty. Answer: Whether we be left at plain liberty in all things which being in the general necessary, and are not particularly determined in God’s Word; it shall be treated of elsewhere in this Dispute. In the meantime, whatsoever liberty God leaves man in bodily gestures, he leaves him no liberty of an unlawful and idolatrous gesture, such as kneeling in the instant of receiving a sacrament, when not only we have the outward sign purposely before us, and our minds and senses fastened upon it, for discerning the signification thereof and the analogy betwixt it and the thing signified, but also look upon it as an image of Christ or as a vicarious sign standing there in Christ’s stead. The indifferency of such a gesture in such a mediate worship should have been proved before such a rule (as this here given us for a reason) had been applied to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), pt. 3, ch. 4</cite>, pp. 72-73</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><figure class="quote" id="q-922c48dddd" data-kw="">
<blockquote><p>…we consider things circumstantial, as time, place, etc. And circumstances are either merely physical, or 2. merely moral, or 3. mixed, partly moral, partly physical. Circumstances merely physical are such adjuncts of divine worship as are common and inseparable concomitants of both civil, natural and religious or sacred actions performed by men, and as they are such, contribute no moral goodness or badness to the action or agent in the performance thereof, such as I take to be the seven individuall proprieties of every man: forma, figura, locus, tempus, strips, patria, nomen. Under form and figure, the first two, I comprehend such a proportion of body, a man of a high stature or low, a man beautiful or not beautiful, to which I crave leave to reduce all external forms of habits, as clothes, the head covered or not covered, the situation of the body, as as they are in themselves, mere physical acts, kneeling, sitting, standing, the eyes cast down to the earth or lifted up, the hands lifted up, or not lifted up, the knocking on the breast, or not knocking, motions of the soul, that are natural… 1. All these are common concomitants of civil, natural and religious actions, for all actions performed by man of what kind soever, as natural, to eat, sleep, or civil, to declaim an oration before the people, or religious, to preach or pray, must be done by some persons, John or Thomas, men of some family, in some time, in some place, for they are not actions eternal, and so must be done in time and place, so the agents must have some habit [garment], some gesture in the doing of all these actions, and they are unseparable adjuncts of all these actions because neither actions natural, civil, nor religious can be performed but by some persons in some habit and gesture, in some time, in some place: and lastly, they are mere circumstantials, and contribute no moral goodness or badness to the actions, as they are but common and inseparable circumstances; for because he preaches in time, or in place simply, the preaching is neither morally good, nor ill, better or worse, because Thomas prays in gown or cloak, in this place, rather than that place… the praying is neither the more or the less acceptable to God because of these common and unseparable adjuncts. … I did say that Christ Jesus has set down in the Word a perfect platform of Church-government in all morals; I say ‘in all morals’ because the Word does not teach us anything of circumstances, physical as physical. Scriptura talia non ponit, sed supponit [Scripture does not appoint such things, but supposes them]: The Scripture says not that the Worship of God must have a time, a place, when, and where it’s to be performed, a person, who is to perform it, a habit, or garments on the person that worships; the Scripture teaches none of these, but supposes that they are and must be, because nature teaches that without time, place, person, habit, gesture, it’s impossible that these or any human actions can be; and therefore Prelatical Formalists do without all sense or reason require that we should prove by Scripture, the lawfulness of time, place, person, habit, gesture in God’s worship; for these are presupposed in all actions, natural, civil, religious, private, public, lawful, unlawful, in acts of arts, sciences, of moral conversing and all…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646), Introduction</cite>, pp. 2-5</span></figcaption>

ral%2C+civil%2C+nor+religious+can+be+performed+but+by+some+persons+in+some+habit+and+gesture%2C+in+some+time%2C+in+some+place%3A+and+lastly%2C+they+are+mere+circumstantials%2C+and+contribute+no+moral+goodness+or+badness+to+the+actions%2C+as+they+are+but+common+and+inseparable+circumstances%3B+for+because+he+preaches+in+time%2C+or+in+place+simply%2C+the+preaching+is+neither+morally+good%2C+nor+ill%2C+better+or+worse%2C+because+Thomas+prays+in+gown+or+cloak%2C+in+this+place%2C+rather+than+that+place%E2%80%A6+the+praying+is+neither+the+more+or+the+less+acceptable+to+God+because+of+these+common+and+unseparable+adjuncts.+%E2%80%A6+I+did+say+that+Christ+Jesus+has+set+down+in+the+Word+a+perfect+platform+of+Church-government+in+all+morals%3B+I+say+%E2%80%98in+all+morals%E2%80%99+because+the+Word+does+not+teach+us+anything+of+circumstances%2C+physical+as+physical.+Scriptura+talia+non+ponit%2C+sed+supponit+%5BScripture+does+not+appoint+such+things%2C+but+supposes+them%5D%3A+The+Scripture+says+not+that+the+Worship+of+God+must+have+a+time%2C+a+place%2C+when%2C+and+where+it%E2%80%99s+to+be+performed%2C+a+person%2C+who+is+to+perform+it%2C+a+habit%2C+or+garments+on+the+person+that+worships%3B+the+Scripture+teaches+none+of+these%2C+but+supposes+that+they+are+and+must+be%2C+because+nature+teaches+that+without+time%2C+place%2C+person%2C+habit%2C+gesture%2C+it%E2%80%99s+impossible+that+these+or+any+human+actions+can+be%3B+and+therefore+Prelatical+Formalists+do+without+all+sense+or+reason+require+that+we+should+prove+by+Scripture%2C+the+lawfulness+of+time%2C+place%2C+person%2C+habit%2C+gesture+in+God%E2%80%99s+worship%3B+for+these+are+presupposed+in+all+actions%2C+natural%2C+civil%2C+religious%2C+private%2C+public%2C+lawful%2C+unlawful%2C+in+acts+of+arts%2C+sciences%2C+of+moral+conversing+and+all%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%E2%80%A6+%281646%29%2C+Introduction%2C+pp.+2-5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote% </figure><figure class="quote" id="q-3ffcc16b4a" data-kw="">
<blockquote><p>Where they have read that the people bowed before the altar of God, I know not. Bishop Lindsey indeed would prove from 2 Chron. 6:12-13 and Mic. 6:6 that the people bowed before the altar and the offering. But the first of those places speaks nothing of kneeling before the altar, but only of kneeling before the congregation, that is, in sight of the congregation. And if Solomon had then kneeled before the altar, yet the altar had been but occasionally and accidentally before him in his adoration, for to what end and use could he have purposely set the altar before him whiles he was kneeling and praying? The place of Micah cannot prove that God’s people did kneel before the offerings at all (for it speaks only of bowing before God) far less that they kneeled before them in the very act of offering, and that with their minds and senses fixed upon them, as we kneel [speaking of Gillespie’s opponents] in the very act of receiving the sacrament, and at that instant when our minds and senses are fastened upon the signs, that we may discern the things signified by them, for the exercising of our hearts in a thankful meditation upon the Lord’s death.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>
<div class="actions"><button class="copy" data-copy="“Where they have read that the people bowed before the altar of God, I know not. Bishop Lindsey indeed would prove from 2 Chron. 6:12-13 and Mic. 6:6 that the people bowed before the altar and the offering. But the first of those places speaks nothing of kneeling before the altar, but only of kneeling before the congregation, that is, in sight of the congregation. And if Solomon had then kneeled before the altar, yet the altar had been but occasionally and accidentally before him in his adoration, for to what end and use could he have purposely set the altar before him whiles he was kneeling and praying? The place of Micah cannot prove that God’s people did kneel before the offerings at all (for it speaks only of bowing before God) far less that they kneeled before them in the very act of offering, and that with their minds and senses fixed upon them, as we kneel [speaking of Gillespie’s opponents] in the very act of receiving the sacrament, and at that instant when our minds and senses are fastened upon the signs, that we may discern the things signified by them, for the exercising of our hearts in a thankful meditation upon the Lord’s death.”

— George Gillespie, English-Popish Ceremonies (1637) | pt. 3, ch. 4, p. 69">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhere+they+have+read+that+the+people+bowed+before+the+altar+of+God%2C+I+know+not.+Bishop+Lindsey+indeed+would+prove+from+2+Chron.+6%3A12-13+and+Mic.+6%3A6+that+the+people+bowed+before+the+altar+and+the+offering.+But+the+first+of+those+places+speaks+nothing+of+kneeling+before+the+altar%2C+but+only+of+kneeling+before+the+congregation%2C+that+is%2C+in+sight+of+the+congregation.+And+if+Solomon+had+then+kneeled+before+the+altar%2C+yet+the+altar+had+been+but+occasionally+and+accidentally+before+him+in+his+adoration%2C+for+to+what+end+and+use+could+he+have+purposely+set+the+altar+before+him+whiles+he+was+kneeling+and+praying%3F+The+place+of+Micah+cannot+prove+that+God%E2%80%99s+people+did+kneel+before+the+offerings+at+all+%28for+it+speaks+only+of+bowing+before+God%29+far+less+that+they+kneeled+before+them+in+the+very+act+of+offering%2C+and+that+with+their+minds+and+senses+fixed+upon+them%2C+as+we+kneel+%5Bspeaking+of+Gillespie%E2%80%99s+opponents%5D+in+the+very+act+of+receiving+the+sacrament%2C+and+at+that+instant+when+our+minds+and+senses+are+fastened+upon+the+signs%2C+that+we+may+discern+the+things+signified+by+them%2C+for+the+exercising+of+our+hearts+in+a+thankful+meditation+upon+the+Lord%E2%80%99s+death.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English-Popish+Ceremonies+%281637%29+%7C+pt.+3%2C+ch.+4%2C+p.+69&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3ffcc16b4a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3ffcc16b4a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-kneeling-in-receiving-the-lords-supper/#:~:text=Where%20they%20have%20read%20that%20the,thankful%20meditation%20upon%20the%20Lord%E2%80%99s%20death&amp;text=Where%20they%20have%20read%20that%20the%20people%20bowed&amp;text=in%20a%20thankful%20meditation%20upon%20

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e00e8196c8" data-kw="">
<blockquote><p>For what the law could not do, in that it was weak through the flesh, God sending his own Son, in the likeness of sinful flesh, and for sin, condemned sin in the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bridge.html">William Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of Justification by Faith, Opened &amp; Applied from Rom. 3:24-25…’ in Works (London: Tegg, 1845), vol. 5, pp. 378-79 | By Christ’s redemption, the guilt of sin is taken away, and by his active obedience, the believing person is made completely righteous, in the sight of God; and although these always go together, yet are they to be distinguished one from the other: for as it is one thing to obey the command, and another to suffer the penalty, even so it is one thing to be fread from hell, by the merit of Christ’s death, and another thing to be entitled to heaven by the merit of his obedience, Rom. 8:3. Here we have the end and design of the Father’s sending of Christ asserted.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-f6cbf50387" data-kw="Justification">
<blockquote><p>Those whom God effectually calls, he also freely justifies, not by infusing righteousness into them, but by pardoning their sins, and by accounting and accepting their persons as righteous; not for anything wrought in them, or done by them, but for Christ&#x27;s sake alone; not by imputing faith itself, the act of believing, or any other evangelical obedience to them, as their righteousness; but by imputing Christ&#x27;s active obedience unto the whole law, and passive obedience in his death for their whole and sole righteousness by faith, which faith they have not of themselves; it is the gift of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 11.1</span></figcaption>

</figure><figure class="quote" id="q-86d39f2348" data-kw="">
<blockquote><p>1. That righteouseness whereby we are justified before God is the fulfilling of God’s law. 2. Legal justice is the fulfilling of the law, performed by him which is named just. 3. Evangelical justice is the punnishment of our sins, which Christ endured for us, freely imputed by God to them that believe. 4. Since the fall of man no man besides Christ alone in this life is justified before God by the righteouseness of the law. 5. We are justified only by faith in Christ. 6. And yet the righteousness of the law must in this life be begun in all that will be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rules &amp; Axions of Certain Chief Points of Christianity in A Collection of Certain Learned Discourses… (d. 1587; Oxford, 1600), 22. ‘Of Man’s Justification before God’</cite>, pp. 271-72</span></figcaption>

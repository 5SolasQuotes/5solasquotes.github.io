</figure><figure class="quote" id="q-ab6f29151c" data-kw="">
<blockquote><p>But I hope the parliament will observe this great principle you were first acted by, and still are in all your Church-way, and will see how dangerous the tolerating of your way will be; for though you should for present hold nothing much different from the established rule, yet being allowed what may you not come to; according to this principle, how shall any State be sure of you long what you will hold: What if you should bring in community of goods, baptizing in rivers, the holy kiss into your assemblies at the beginning and ending of your ordinances, anointing sick persons with oil? It is but according to your principle: And we see you make so much of this principle and are so in love with it, that you wish it next to your first principle, enacted as the most sacred Law of all other[s], to live and walk by it in Christian States and Churches throughout the world;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge, members of the Assembly of Divines wherein is Handled Many of the Controversies of These Times</cite>, [the Independents] Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge… (London, 1644), p. 86</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

ne · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1e7198fc15" data-kw="">
<blockquote><p>First of all, I hold that it is proper for the ceremonies in the church to be absolutely as few and as pure as possible. For besides the fact that we must now worship the Lord in Spirit and truth, even plain experience, that teacher of fools, ought to warn us not to imitate the example of those who–while setting no limit on their ceremonies–do not increase the worship of God, but completely undermine it. And so we determined that we should take thought how to do away with ceremonies rather than establishing them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Clear &amp; Simple Treatise on the Lord’s Supper</cite>, (RHB, 2016), p. 143</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

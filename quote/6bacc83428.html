<main class="wrap"><figure class="quote" id="q-6bacc83428" data-kw="">
<blockquote><p>As little does the view of those command itself to whom the majority of liberations recorded in the Book of Judges seen so foreign and strange that they are of opinion that these can in no way be adduced as examples. For however true it may be that those Judges of the people of Israel were moved and stirred to the performance of the performance of those famous deeds by some divine and exceptional instinct, yet it does not immediately follow that the Israelites themselves, whether holding office or even as private citizens, could not in accordance with their ordinary right have expelled the tyranny of strangers who had been neither elected nor approved by the people.

But that those liberations were effected by means of those men alone whom God summoned forth in a special way, does not go to disprove my contention, but rather demonstrates that the spirit of the Israelites had for their transgressions been stunned and broken by the just judgment of God. Therefore to follow those examples rightly and lawfully, I am of opinion that the following true means should be held fast, namely: if anyone strives to seize or has already usurped an unjust tyranny over others, whether he be a stranger or whether as a viper he leaps from the womb of his country that by his birth he may cause her death, then shall private citizens before all else approach their legitimate magistrates in order that it may be the public enemy he cast forth by the public authority and common consent of all.

But if the magistrate connives (at the attempt) or in some way refuses to perform his duty, then let each private citizen bestir himself with all his power to defend the lawful constitution of his country, to whom after God he owes his entire existence, against him who cannot be deemed a lawful magistrate since he either has already usurped that rank in violation of the public laws or is endeavouring to usurp it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Concerning the Rights of Rulers over their Subjects and the Duty of Subjects Towards their Rulers: A Brief and Clear Treatise Particularly Indispensable to Either Class in these Troubled Times</cite>, (1572), trans. Henry Louis Gonin, ed. Patrick S. Poole in Journal of Christian Reconstruction, 14.1 (1996), p. 112.</span></figcaption>

<blockquote><p>In this treatise Hemmingsen [a Lutheran] argues that all particular rules of ethical conduct can be derived from immutable axioms or first principles. Though moral philosophy works according to its own rules, Hemmingsen shows that its conclusions, far from being at odds with the divine revelation of the moral law, are identical with the ethical commandments of Scripture. Thus Hemmingsen includes a section on the Decalogue, along with a lengthy account of the traditional cardinal virtues, supported by a myriad of quotations from classical Greek and Roman sources. This important treatise looks both backward to classical and medieval philosophy and forward to developments in the seventeenth century and beyond.</p></blockquote>

<blockquote><p>XVI. Second, the necessity of the case makes many things lawful which otherwise would not be lawful, in domestic affairs as well as in politics. If the doorkeeper of a house is overcome by a lethargy or by apoplexy, he cannot prevent the entrance of thieves, even though it is lawful for any servant to take the keys and to close the gates against them. If he to whom the care of supporting a family is committed denies bread to his children, who would say that it is not lawful for anyone of the domestics to supply them with bread if he can so that they may not perish with hunger? If the father himself rages for the destruction of his children, should not his arms be wrested from him, his children removed and entrusted to a guardian, not waiting for the judgment of a magistrate? Nay, a friend and neighbor can take this upon himself until the public authority has made some provision for them. When a fire is raging, who doubts that it is the duty of all to bring water to extinguish it, especially when they cease to whom this care pertained? Thus in a republic, if the rulers and prefects snore while the enemy approaches; if the gatekeepers open the gates to him; will it not be lawful for any citizen to snatch the keys from the hand of the betrayer in order to shut the gates against the enemy and to call to arms?… When the thing itself calls, what need is there to seek an external call? Nay, if they should cease form a regard to obedience, unmindful of the oath given to their prince, they would be deservedly convicted of perfidy and treachery because here the consciousness of wickedness alone pollutes, from which no one purges himself, unless according to his ability he resists the inrushing evil.</p></blockquote>

</figure><figure class="quote" id="q-9d23c2a78f" data-kw="">
<blockquote><p>That our Conversations must be such as is beyond such as live under the Law, for the Law of God goes higher than the light of Nature, for there’s more revealed there than in the light of Nature. It’s true, that that you call the moral Law, the light of Nature, if it be clear it is suitable to it, to the most part of it, only there is some part that is positive, but most part is but suitable to the principles of Nature if they were clear and pure; but now because, since the fall of Man, the light of Nature is darkened, and the principles of Nature are much corrupted, therefore God hath given His Law, that is as it were a glass of His Will, that is, the clear glass of what was written in the heart of man in Innocence, that’s the Law: Only there is that of the limitation of the seventh Day particularly from the Creation that hath somewhat positive in it, but take all the other and (I say) it is nothing but as a glass of what was written in the heart of man in the time of Innocency:

There was written in man’s heart to keep some solemn time for the worship of God, only the specification was by revelation, but the substance of all those ten Commandments (I say) is the glass of what was written in the heart of man in Innocency: And because God saw that this writing was so much blotted out, almost all obliterated, therefore God wrote it in Tables of stone, whereas it was written in the Table of man’s heart at first; But now when He comes to bring men to the Gospel there He writes over that Law again in the Tables of their hearts: At first it was written in the heart of Adam, but he falling, doth blot it out in a great measure, then God writes it over fair again, but how? He writes it over in a fair Copy, but it is in Tables of stone: but when God receives any soul in the Gospel He writes it over again in the Tables of their hearts[.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel-conversation: wherein is shewed, I. How the conversation of believers must be above what could be by the light of nature. II. Beyond those that lived under the law. III. And suitable to what truths the Gospel holds forth</cite>, (London: Peter Cole, 1650), p. 41.</span></figcaption>

+of+their+hearts%3A+At+first+it+was+written+in+the+heart+of+Adam%2C+but+he+falling%2C+doth+blot+it+out+in+a+great+measure%2C+then+God+writes+it+over+fair+again%2C+but+how%3F+He+writes+it+over+in+a+fair+Copy%2C+but+it+is+in+Tables+of+stone%3A+but+when+God+receives+any+soul+in+the+Gospel+He+writes+it+over+again+in+the+Tables+of+their+hearts%5B.%5D%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+Gospel-conversation%3A+wherein+is+shewed%2C+I.+How+the+conversation+of+believers+must+be+above+what+could+be+by+the+light+of+nature.+II.+Beyond+those+that+lived+under+the+law.+III.+And+suitable+to+what+truths+the+Gospel+holds+forth%2C+%28London%3A+Peter+Cole%2C+1650%29%2C+p.+41.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9d23c2a78f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9d23c2a78f.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/11/18/jeremiah-burroughs-on-the-natural-and-revealed-law/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>In the sixteenth century, the narrowest views of politics and of popular education everywhere prevailed, even in Reformed countries. All political power was lodged, and was everywhere deemed to be rightly lodged, in the hands of princes, and all liberal knowledge was regarded as the prerogative of the few, and was withheld from the many.

The rights and interests of the masses were almost wholly ignored in the governmental and educational economy of nations; the champions of popular rights and education were extremely few; and the men who attained to enlightened views on such questions may justly claim to be regarded by the men of this present age as having been enlightened indeed — lights shining in a dark place — heralds and precursors of the politics and economics of the nineteenth century.

On questions of political principle and right, the views of [John] Knox and [George] Buchanan are before the world, and can be compared with the opinions which prevailed in their own and subsequent times. They contended for the principle of limited monarchy, and the supremacy of law; the prince, they urged, had his duties as well as his rights, and the people their rights as well as their duties. In opposition to the long-descended tradition of the divine and indefeasible right of princes, they held the principle (if they were not, indeed, the very first to put it forward) of a mutual compact between prince and people, as lying at the foundation of the political order and relations of society.</p></blockquote>

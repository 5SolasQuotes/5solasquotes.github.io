<blockquote><p>VII. This appears more clearly when we come to the thing itself and the controversy is not carried on coldly and unfeelingly in scholastic cloud and dust (as if from a distance), but in wrestling and agony—when the conscience is placed before God and terrified by a sense of sin and of the divine justice, it seeks a way to stand in the judgment and to flee from the wrath to come. It is indeed easy in the shades of the schools to prattle much concerning the worth of inherent righteousness and of works to the justification of men; but when we come into the sight of God, it is necessary to leave such trifles because there the matter is conducted seriously and no ludicrous disputes about words (logomachia) are indulged. Hither our eyes must be altogether raised if we wish to inquire profitably concerning true righteousness; in what way we may answer the heavenly Judge, when he shall have called us to account. Truly while among men the comparison holds good; each one supposes he has what is of some worth and value. But when we rise to the heavenly tribunal and place before our eyes that supreme Judge (not such as our intellects of their own accord imagine, but as he is described to us in Scripture [namely, by whose brightness the stars are darkened; at whose strength the mountains melt; by whose anger the earth is shaken; whose justice not even the angels are equal to bear; who does not make the guilty innocent; whose vengeance when once kindled penetrates even to the lowest depths of hell]), then in an instant the vain confidence of men perishes and falls and conscience is compelled (whatever it may have proudly boasted before men concerning its own righteousness) to deprecate the judgment and to confess that it has nothing upon which it can rely before God. And so it cries out with David, “Lord, if thou marked iniquity, who can stand?”; and elsewhere, “Enter not into judgment with thy servant, because no flesh will be justified in thy sight.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ed27b9bc75" data-kw="">
<blockquote><p>For what is vainer than regarding someone as righteous who has not kept the law? Yet the law not only forbids that anything be done which it condemns (to which is attached a threatening with death) but also prescribes the outcome of what it enjoins (to which is attached the promise of life). Thus, whoever in Christ is judged to be ‘no sinner’ has indeed evaded death; but on the grounds of what other right would anyone demand life, other than that he has in Christ fulfilled all the righteousness of the law?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistolae theologicae: liber unus</cite>, (Geneva: Vignon, 1573), Epistle 35, to Olevianus (1560), p. 200 as trans. G.A. van den Brink, The Transfer of Sin… (Brill, 2024), p. 219 cf. Epistle 45, p. 228</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

<blockquote><p>16. And indeed, as among the external instrumental causes of justification there is both the Word of the Gospel, Rom. I.16, and the sacraments, Tit. III.5; 1 Pet. III.21: so the internal instrumental cause is not hope, charity, fear, repentance, etc., but faith alone among causes of its own order — and alone indeed not by reason of its existence, but by reason of its apprehension and the faculty of apprehending — inasmuch as it alone is the analogous instrument suited to the apprehension of the righteousness of Christ. 17. Faith, moreover, is considered in the act of justification neither dispositively, nor habitually, nor formally, nor meritoriously, nor in the genus of a work, but partly organically by reason of its own act, and partly correlatively by reason of its object [i.e. Christ]. Whence the apostle wisely says that we are justified πίστει [pistei, by faith], ἐκ πίστεως [ek pisteōs, out of faith], διὰ τῆς πίστεως [dia tēs pisteōs, through faith] — but never διὰ τὴν πίστιν [dia tēn pistin, on account of faith].</p></blockquote>

96309.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ff83496309.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/justification#:~:text=16.%20And%20indeed%2C%20as%20among%20the,t%C4%93n%20pistin%2C%20on%20account%20of%20faith&amp;text=16.%20And%20indeed%2C%20as%20among%20the%20external%20instrumental&amp;text=%CF%80%CE%AF%CF%83%CF%84%CE%B9%CE%BD%20%5Bdia%20t%C4%93n%20pistin%2C%20on%20account%20of%20faith" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e83ff2c72e" data-kw="">
<blockquote><p>Although hypocrites and other unregenerate men may vainly deceive themselves with false hopes and carnal presumptions of being in the favor of God, and estate of salvation (which hope of theirs shall perish): yet such as truly believe in the Lord Jesus, and love him in sincerity, endeavoring to walk in all good conscience before him, may, in this life, be certainly assured that they are in the state of grace, and may rejoice in the hope of the glory of God, which hope shall never make them ashamed.</p></blockquote>

</figure><figure class="quote" id="q-f7715e2f2a" data-kw="Works follow justification">
<blockquote><p>A person is justified freely by faith without works (Rom. 3:24); yea, justification is of the wicked (Rom. 4:5; 5:6). No good works can be granted which precede his justification as causes, but only which follow as the effects and fruits springing from the faith of remission (Lk. 7:47; 1 Tim. 1:5).</p></blockquote>

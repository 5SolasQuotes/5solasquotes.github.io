<blockquote><p>1st Use. This shows the reason why the preaching of the Word and all the dispensations of grace are so ineffectual and do so little good upon the hearts of most men: why there are so few converted and brought home to God: the heart is hard, hard by nature, hardened more by custom in sinning… 2nd Use. The ministers of God should from hence learn to use all their might and skill in dispensing the Word of God’s grace to the sons of men.</p></blockquote>

</figure><figure class="quote" id="q-ef4bec73dc" data-kw="will irresistible precept">
<blockquote><p>The decretive will relates to the futurition and the event of things and is the rule of God’s external acts; the preceptive is concerned with precepts and promises and is the rule of our action. The former cannot be resisted and is always fulfilled: “Who hath resisted his will?” (Rom. 9:19). The latter is often violated by men: “How often would I have gathered you together, and ye would not” (Mt. 23:37).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.15.2</span></figcaption>

</figure><figure class="quote" id="q-2f386bf031" data-kw="">
<blockquote><p>Thus then the morality of our actions must not be measured by any decree concerning the futurition of events, but by some other rule, in which must concur God’s will and appointment, setting bounds unto us and designing our duty, and discovering what is well-pleasing and acceptable to God, honest and laudable in itself, and profitable and comfortable to us in the issue; and thus we have the Word of God for our direction and have his laws and testimonies to be our rule: Dt. 29:29; Isa. 8:20; Dt. 30:10-12; Dt. 5:29; Ps. 147:19; Rom, 12:2; 1 Thess. 4:2; 1 Pet. 4:2, etc. and we may take notice of these three things as necessarily requisite and concurring in that which is a warrant unto and rule of our actions and petitions: 1. The good-pleasure and decree of God, not concerning what shall come to pass, but concerning the quality and moral goodness of human actions, and which does limit and set bounds to reasonable creatures and prescribes unto them their duty; and this is the fountain and first spring (yea and by many judicious and sober divines is judged to be the supreme adequate and first rule) of moral rectitude. Hence we may conceive that God’s laws in Scripture are called ‘decrees,’ ‘statutes’ and ‘ordinances’. 2. From this decree and appointment, does (to our apprehension) flow divine approbation, complacency and delight in what is thus appointed to be our work and duty: hence that appointment is called the good, acceptable and perfect will of God, Rom. 12:2, and our actions when conform[ed] to that rule, are said to be well-pleasing in his sight, Heb. 13:2; yea the Lord does not only declare his love of his complacency, and delight in these when they are performed, but also He is said to will and desire (though not according to the Jesuitical and Arminian gloss)¹ those works while He is speaking to the rebellious and disobedient who have slighted his laws and casten all his statutes behind their backs: Eze. 18:23, 32; 33:11; Hos. 6:6; 1 Sam. 15:22; Isa. 61:8; Mt. 9:13; 2 Pet. 3:9, etc. ¹ Arminians, Socinians and Jesuits from thence would collect a frustratable and inefficacious will and desire in God, but this phrase does only import God’s serious approbation of the works of righteousness and detestation of the contrary. 3. There must be an intimation and promulgation of this decree and appointment, and a declaration of those things that would be well pleasing, and acceptable to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-pitcarne.html">Alexander Pitcarne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spiritual Sacrifice, or a Treatise wherein several Weighty Questions and Cases concerning the saints’ communion with God in prayer are propounded and practically improved</cite>, (Edinburgh: Brown, 1664), pt. 1, pp. 146-47 Pitcarne (1622?–1695) was a partially conforming Scottish minister and academic.</span></figcaption>

Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c0a4ae340a" data-kw="">
<blockquote><p>A second set of distinctions can be made between the voluntas Dei absoluta et antecedens, the absolute and antecedent will, of God and the voluntas Dei ordinata et consequens. The Lutheran orthodox argue this distinction as a description of the effective will of God ad extra and juxtapose it with the previous distinction between the revelative will of God and the hidden will. The voluntas absoluta et antecedens, sometimes called voluntas prima, first or primary will, is the eternal divine will in and of itself, according to which the ultimate end or final good is willed by God apart from consideration of conditions, circumstances, and means to be encountered or used proximately in the achievement of the divine purpose. The voluntas ordinata et consequens, sometimes called voluntas secunda, second or secondary will, is the will of God according to which he orders proximate causes and effects both in terms of the universal order and its laws and in terms of the circumstances that arise out of the contingent events and the creaturely free wills resident in the order. The voluntas ordinata, therefore, corresponds with the potentia ordinata (q.v.), or ordained power of God, whereas the voluntas consequens is a distinct willing that rests on the divine foreknowledge. In the systems of Lutheran orthodoxy, the voluntas consequens is the will of God that elects intuitu fidei (q.v.), in view of faith. The Reformed deny the distinction between voluntas antecedens and voluntas consequens on the ground that it amounts to a denial of the freedom and independence of the divine will and implies contingency in God himself. They accept, however, the distinction between voluntas absoluta and voluntas ordinata in conjunction with that between potentia absoluta and potentia ordinata, and subsume both voluntas absoluta and voluntas ordinata under the voluntas decreti vel beneplaciti considered as the ultimate voluntas Dei decernens, the deciding will of God. … Finally, the Protestant scholastics argue a series of distinctions in the voluntas signi vel praecepti. The voluntas signi vel praecepti is, first, synonymous with voluntas revelata and voluntas moralis. As such, several of the Lutheran orthodox argue that the voluntas signi is not truly the will of God but an effect of his will or a subsidiary willing resting on the voluntas antecedens and, formally, on the voluntas consequens. In other words, it is an effect or object of the divine will that provides a sign of what is willed in and by God. The voluntas revelata can be distinguished into a voluntas legalis, according to which God demands obedience to his will, and a voluntas evangelica, according to which God wills to save through grace in Christ. The Reformed occasionally allow here a distinction between voluntas antecedens and voluntas consequens. The former refers to the commands of God, the voluntas legalis, which ordains the conditions of human life absolutely; the latter refers to the voluntas evangelica, which establishes the conditions under which fallen mankind can be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st</cite>, ed. (Baker, 1985), voluntas Dei, pp. 332-33</span></figcaption>

he deciding will of God. … Finally, the Protestant scholastics argue a series of distinctions in the voluntas signi vel praecepti. The voluntas signi vel praecepti is, first, synonymous with voluntas revelata and voluntas moralis. As such, several of the Lutheran orthodox argue that the voluntas signi is not truly the will of God but an effect of his will or a subsidiary willing resting on the voluntas antecedens and, formally, on the voluntas consequens. In other words, it is an effect or object of the divine will that provides a sign of what is willed in and by God. The voluntas revelata can be distinguished into a voluntas legalis, according to which God demands obedience to his will, and a voluntas evangelica, according to which God wills to save through grace in Christ. The Reformed occasionally allow here a distinction between voluntas antecedens and voluntas consequens. The former refers to the commands of God, the voluntas legalis, which ordains the conditions of human life absolutely; the latter refers to the voluntas evangelica, which establishes the conditions under which fallen mankind can be saved.”

— Richard Muller, Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st ed. (Baker, 1985), voluntas Dei, pp. 332-33">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+second+set+of+distinctions+can+be+made+between+the+voluntas+Dei+absoluta+et+antecedens%2C+the+absolute+and+antecedent+will%2C+of+God+and+the+voluntas+Dei+ordinata+et+consequens.+The+Lutheran+orthodox+argue+this+distinction+as+a+description+of+the+effective+will+of+God+ad+extra+and+juxtapose+it+with+the+previous+distinction+between+the+revelative+will+of+God+and+the+hidden+will.+The+voluntas+absoluta+et+antecedens%2C+sometimes+called+voluntas+prima%2C+first+or+primary+will%2C+is+the+eternal+divine+will+in+and+of+itself%2C+according+to+which+the+ultimate+end+or+final+good+is+willed+by+God+apart+from+consideration+of+conditions%2C+circumstances%2C+and+means+to+be+encountered+or+used+proximately+in+the+achievement+of+the+divine+purpose.+The+voluntas+ordinata+et+consequens%2C+sometimes+called+voluntas+secunda%2C+second+or+secondary+will%2C+is+the+will+of+God+according+to+which+he+orders+proximate+causes+and+effects+both+in+terms+of+the+universal+order+and+its+laws+and+in+terms+of+the+circumstances+that+arise+out+of+the+contingent+events+and+the+creaturely+free+wills+resident+in+the+order.+The+voluntas+ordinata%2C+therefore%2C+corresponds+with+the+potentia+ordinata+%28q.v.%29%2C+or+ordained+power+of+God%2C+whereas+the+voluntas+consequens+is+a+distinct+willing+that+rests+on+the+divine+foreknowledge.+In+the+systems+of+Lutheran+orthodoxy%2C+the+voluntas+consequens+is+the+will+of+God+that+elects+intuitu+fidei+%28q.v.%29%2C+in+view+of+faith.+The+Reformed+deny+the+distinction+between+voluntas+antecedens+and+voluntas+consequens+on+the+ground+that+it+amounts+to+a+denial+of+the+freedom+and+independence+of+the+divine+will+and+implies+contingency+in+God+himself.+They+accept%2C+however%2C+the+distinction+between+voluntas+absoluta+and+volu

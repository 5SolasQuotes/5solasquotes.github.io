<main class="wrap"><figure class="quote" id="q-52239e55d2" data-kw="">
<blockquote><p>I affirm that such things as be proper to the Godhead may be attributed to man, though not to the manhood. Wherefore this proposition is true: This man is God, or this: The eternal Word of the Father is man… Wherefore, whether He be called man, He is yet notwithstanding understood to be God, or whether He be called God, He is like wise understood to be man. But when we speak of the natures themselves, to wit, either the manhood or the Godhead, by these abstracted names there is nothing else signified or meant but the several natures in and by themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two Very Learned Sermons of Mr. Beza, together with a Short Sum of the Sacrament of the Lord’s Supper</cite>, … (London, 1588), ‘The First Homily… 1574’, pp. 36-37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-58c1fdd9d1" data-kw="">
<blockquote><p>Whether Christ is one or two? The prior is affirmed. … Whether Christ is able to be called a composite? It is denied. Whether a whole? It is distinguished. … Whether there are two beings [esse] in Christ, or a twofold existence and individualness? It is affirmed with a distinction. Whether a twofold life? It is affirmed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Subtitle II, ‘Of the Consequences &amp; Effects of the Union’, ‘Of Christ the Theanthropos’ in Tract 2, ‘Of the Person, Offices &amp; States of Christ the Mediator’ in A Syllabus of Theological Problems</cite>, … (Utrecht, 1643) n.p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>
<div class="actions"><button class="copy" data-copy="“Whether Christ is one or two? The prior is affirmed. … Whether Christ is able to be called a composite? It is denied. Whether a whole? It is distinguished. … Whether there are two beings [esse] in Christ, or a twofold existence and individualness? It is affirmed with a distinction. Whether a twofold life? It is affirmed.”

</figure><figure class="quote" id="q-a0c02fe67f" data-kw="Communion Faith Submission">

</figure><figure class="quote" id="q-d04c21ab00" data-kw="Grace">
<blockquote><p>It is supernatural, being altogether beyond the powers of the creature to effectuate. It is wholly of the wisdom, grace, and power of God. All the unions we have in the natural world come infinitely short of this. The union of the body and soul in man puzzles and baffles the greatest philosophers, but the union of Christ and His Church is a far greater mystery: that persons so distant, so divided, should be made one, is a profundity which no finite intelligence can fully comprehend. We had known nothing whatever about it if God had not revealed it to us in His Word, and even now we discern it “through a glass darkly.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Union and Communion</cite>, Introduction (nature of the union, 1)</span></figcaption>

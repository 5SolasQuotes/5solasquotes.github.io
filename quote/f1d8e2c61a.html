<main class="wrap"><figure class="quote" id="q-f1d8e2c61a" data-kw="">
<blockquote><p>[1.] A twofold revelation of God is given to wayfarers [persons in this life], one in the sphere of nature, another in the sphere of grace. 2. Revelation in the sphere of nature is either Objective in the works of creation, or Subjective in the consciences of men. 3. The revelation alone exhibited in the sphere of nature cannot be salutary, nor has any mortal through it alone either been led to salvation or been able to be led. 4. To those therefore to whom the grace of superior revelation in the sphere of grace after sin introduced into the world has not been made, salvation was never destined by God: for the wise one does not will the end for him to whom he by no means grants the necessary means, without which it cannot come to pass that he should attain the end, when those can be had only by his giving. 5. And since the sphere of nature exhibits only τὸ γνωστὸν τοῦ θεοῦ [the knowledge of God], by no means indeed σοφίαν τοῦ θεοῦ ἐν μυστηρίῳ [the wisdom of God in mystery], that is, the Gospel and doctrine concerning Christ the Savior and faith in Him, who, without knowledge of Him who alone is the way, can come to life? 6. Therefore the revelation alone exhibited to sinners in the sphere of grace through God’s word can be salutary, which reveals both the actual expiation of sin, and the mode of it, and him through whom it is expiated, and the means of applying that expiation to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/disputationum-theologicarum-miscellaneorum-pars-prima.html">Disputationum Theologicarum Miscellaneorum Pars Prima</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-19d46ee560" data-kw="natural">
<blockquote><p>We find in man a natural law written upon each one’s conscience excusing and accusing them in good and bad actions, which therefore necessarily implies the knowledge of God, the legislator, by whose authority it binds men to obedience and proposes rewards or punishments. “The Gentiles, which have not the law” (i.e., the law of Moses) “do by nature the things contained in the law, these, having not the law, are a law unto themselves: which show the work of the law written in their hearts, their conscience also bearing witness, and their thoughts the meanwhile accusing or else excusing one another” (Rom. 2:14, 15). This could not be said if conscience did not dictate to each one that there is a deity who approves of good actions and disapproves and punishes evil deeds. Nor are these objections of force: (1) the work of the law and not the law itself is said to be inscribed because with the apostle these are synonymous—“to be a law unto themselves” (v. 14) and “to have the work of the law written in their hearts” (v. 15).</p></blockquote>

ked</span></div>
</figure><figure class="quote" id="q-8394b46f2c" data-kw="insufficient">
<blockquote><p>Rom. 1:19, 20 (concerning that which may be known of God, gnōstō tou Theou) does not favor a common religion by which all may be saved and which is sufficient for salvation. (1) Only that which may be known (gnōstō) is there spoken of and not that which is to be believed (pistō), which alone is saving. (2) Paul says the knowledge (to gnōston) of God is manifest in the Gentiles, but not all knowledge (pan gnōston) (viz., what may be learned from the book of nature, but not all that may be known of him from his word and which must be known in order to salvation, such as the mystery of the Trinity, and of Christ the Redeemer, etc.). (3) This knowledge (gnōston) which is restricted by the apostle to his “power and godhead” (i.e., to the knowledge of his existence and of those attributes which strike our senses in the works of creation and providence) is usually referred to natural theology; but is not extended to the knowledge of his will and mercy in Christ which can be derived only from his word, and not at all from his works and without which there can be no salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.4</span></figcaption>

</figure><figure class="quote" id="q-74cb50ad6f" data-kw="">
<blockquote><p>The means for the knowledge of God: The more general means XIX. Now, concerning the supports by which we arrive at the knowledge of God, they are observed to be of two kinds. In the first more general kind are enumerated three ways to arrive at the knowledge of God, namely: (1) the way of causality, whereby having moved through various second causes as if by Jacob’s ladder, we finally arrive at the highest step, where God is, according to the mode which we described above in §VI. And this knowledge is what the apostle seems to indicate in Romans 1:19. (2) The way of eminence, by which whatever there is of absolute perfection in creatures we attribute with the highest eminence to the Creator, because of the fact that no one can confer on another what he does not have either formally or eminently, nor can an effect be conceived such that it is on the whole more excellent than its own cause. The psalmist seems to use this way in Psalm 94:9. Indeed, it is fitting by this support to interpret all anthropopathic and metaphorical expressions. (3) The way of negation, by which we entirely remove from him any imperfection that occurs in the creatures, for example, corporality, mortality, finitude, and the like. Scripture seems to follow this way in Numbers 23:19 and Psalm 90:2–3. And indeed in this manner, we arrive by this threefold way at the knowledge of God, such that (1) the first way chiefly leads to his relative attributes, through which he is called Creator, preserver, governor, and mover; (2) the second way leads to his communicable and affirmative attributes, for example, wisdom, righteousness, and so forth, which we will discuss in their own place; and (3) the third leads to his incommunicable and negative attributes, such as infinity, immutability, and so forth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 2, bk. 2, ch. 2, sect. 19, p. 56 The more specific means Mastricht lists as: (1) the divine names in Scripture, (2) the divine attributes in Scripture, (3) the works of God, (4) the Word of God.</span></figcaption>

nd+affirmative+attributes%2C+for+example%2C+wisdom%2C+righteousness%2C+and+so+forth%2C+which+we+will+discuss+in+their+own+place%3B+and+%283%29+the+third+leads+to+his+incommunicable+and+negative+attributes%2C+such+as+infinity%2C+immutability%2C+and+so+forth.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical+Practical+Theology+%28RHB%29%2C+vol.+2%2C+bk.+2%2C+ch.+2%2C+sect.+19%2C+p.+56+The+more+specific+means+Mastricht+lists+as%3A+%281%29+the+divine+names+in+Scripture%2C+%282%29+the+divine+attributes+in+Scripture%2C+%283%29+the+works+of+God%2C+%284%29+the+Word+of+God.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F74cb50ad6f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/74cb50ad6f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/natural-theology/#:~:text=The%20means%20for%20the%20knowledge%20of,as%20infinity%2C%20immutability%2C%20and%20so%20forth&amp;text=The%20means%20for%20the%20knowledge%20of%20God%3A%20The&amp;text=attributes%2C%20such%20as%20infinity%2C%20immutability%2C%20and%20so%20forth" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

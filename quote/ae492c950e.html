<blockquote><p>If I shall speak something of the Mahometish religion, I think the truth of the Christian religion will appear so much the more; for when black and white are laid together, the white carrieth the greater estimation and glory with it. And beside, Mahomet himself testifieth of Christ to be a great prophet of God, and a great worker of miracles; and that the same Jesus Christ was born of the virgin Mary, that he lived without sin among men, that he was a prophet, and more than a prophet, and that he ascended into the heavens. And therefore he reproveth the Jews, for that they would not believe him to be born of a virgin. But, on the other side, because he would not have Christ to bear credit above him, he disliked that he should be called or reputed the Son of God. But beside, the testimony of all the former prophets of the world, both Jews and Gentiles, as is afore shewed, do all teach that he should be the Son of God.

Suidas doth moreover confute this false prophet, who reporteth in his History that the Pharisees at Jerusalem called a council to find out the father of Jesus; they enjoined certain women to search his mother; the women affirmed they found her a virgin; then was it recorded in the famous register book of the temple, Jesus the Son of God, and of Mary the virgin. This proveth, not only that the mother of Jesus was a virgin (which Mahomet truly held), but also that Jesus was the Son of God, which Mahomet alloweth not. And indeed Mahomet’s religion is a patched religion, mixed partly with Judaism, partly with Gentilism, partly with Papism, partly with Christianism, being subtilely contrived for the erecting of the same, and to bring followers after him, whereof shall be spoken more hereafter.</p></blockquote>

<blockquote><p>Whether a prince or magistrate may tolerate Jews in his city or province? Three things may be considered in the Jews. First, the sect and Jewish exercise. Second, usury. Third, hatred toward Christians. All these are evil and prohibited. The question is therefore whether a prince or magistrate may permit or tolerate these evils; and what may be a legitimate cause for permitting and tolerating them? I answer through the following conclusions: First Conclusion. A magistrate may permit the rites and exercises of the Jews if a sufficient cause is present. The Pope of Rome does this, as do many princes in their provinces. The cause may be threefold. First, that through Jewish rites the Christian truth may be shadowed forth and confirmed: St. Augustine, Of the City of God, bk. 18, ch. 46 and St. Thomas in pt. 2 of 2, quest. 10, art. 11, approve this cause. Second, that Jews who practice their rites and understand from the Christians among whom they dwell that those rites were merely shadows and figures of the Christian religion may more easily be converted to the Faith of Christ. St. Thomas, in the cited place, also approves this. Third, that Christian princes or magistrates, under the pretext of permission, may receive money and other gifts from the Jews to whom they permit the exercise. This is not lawful. For public sins, by which God is offended, cannot be permitted for the sake of temporal gain alone, which is hoped for from the permission. Second Conclusion. A magistrate may permit the usuries of the Jews if a sufficient cause is present. The Pope and other Christian princes also do this. The cause may be twofold. One, to prevent a greater evil. For if, as I said above, usuries were not permitted, many thefts, robberies, oppressions of the poor and similar inconveniences would occur. Therefore, to avoid these evils, usuries may be permitted as a lesser evil. The other, that Christian princes and magistrates who permit the usuries of the Jews may be participants in the profit. This is not lawful. For it is certain that usury is prohibited by natural and divine law; and the profit that is acquired through usury is mere theft. Just as, therefore, the Jews sin against justice by receiving usurious profit, so do the Christians who are participants in that profit. They are considered to be participants, however, when they permit usuries for the purpose of being able to receive profit therefrom. This conclusion must be limited in two ways: First, that common usuries may be permitted which do not exceed the profit permitted by law and custom, but not exorbitant usuries, of which I shall speak shortly. Second, that a Christian magistrate may not receive profit from usuries on account of the mere permission of usuries: although they may receive it under another title. And indeed under a double title: First, the title of punishment; because he may punish the Jews on account of usuries; and the profit that has been unjustly acquired from usuries he may either restore to its owners or convert to public utility. Then, the title of exaction; because he may exact an annual tribute or tax from the Jews, not by reason of the permission of usuries, but by reason of the granted habitation in a Christian place. Third Conclusion. A Christian magistrate or prince cannot with a good conscience permit or leave unpunished the hatred of Jews toward Christians. Note: Hatred is twofold: The one is internal; because since it is hidden, the magistrate cannot punish it. The other is external, which breaks out into open injury. This ought to be coerced by the magistrate. We say, therefore, that such hatred, when it is exercised by Jews against Christians, can in no way be permitted or tolerated, but must be severely punished: and the prince sins gravely if he does not punish those who commit offenses. The reason is that a prince is bound by his office to punish every public injury, if he is able, so that justice may be preserved: therefore, he is also bound to punish the injury which the Jews commit against Christians. This is, indeed, manifold: First, because they exact immoderate and intolerable usury from citizens, country folk, and the poor. Whatever they exact beyond the principal is theft. Therefore, they commit intolerable theft. Second, by exacting such usury, they harm the republic or the community greatly. For a republic cannot stand or flourish when the people are oppressed and exhausted by usury. Third, besides usury, another injury is added. For whatever is for sale in the market, the Jews snatch away from the Christians by offering a higher price to the sellers than other buyers are accustomed to offer; and afterwards, which is most iniquitous, Christians are forced to pay double the price to the Jews if they wish to buy what is necessary for feeding their families. Fourth, so that they may do all these things with impunity, they distribute gifts to the officials of princes so that they may be protected by them. Fifth, from this it happens that the people, who bear such injuries with difficulty, become prone to inciting sedition, both against the Jews themselves and against their defenders and patrons. Against the Jews, indeed, because they are thieves and plunderers; against the patrons, because they are partners of thieves and plunderers. If a prince or magistrate does not prevent or punish these great evils (to say nothing of the rest), he is a participant in the crime and is bound to restitution. He can, however, prevent them in three ways. First, if he expels the Jews entirely from his province or city. Second, if he does not indeed expel them, but forces them to agriculture, or to mechanical arts, or to exercise other works; and does not allow them to live in idleness and luxury, as they now live. Third, if he deprives them of all the money and wealth which they have received through usury. Would that these things were brought into practice. You will say, if the Jews are either expelled or do not accept usury, two inconveniences will follow: First, because Christian princes in time of necessity will not have money for war. For they are accustomed to seek this from the Jews. Then, the subjects of the princes, who are in need of money, will not be able to borrow. I respond: The contrary follows: First, because once the Jews are expelled, the citizens will be able to contribute more support than the Jews are accustomed to. For whatever the Jews contribute, they receive from the citizens through unjust usury. And not only this, but also whatever is necessary for them to sustain their lives. Therefore, they take two portions from the citizens: one, which they give to the prince; the other, by which they live. Certainly, if the Jews were expelled, the citizens would be prepared to give either both portions to their prince, or at least no less than they give to the Jews. Next, the subjects of princes are in greater need of money when the Jews are present than when they are absent. For when they are present and demanding intolerable usury, they are completely drained. If they were absent, or at least did not demand such immoderate usury, the subjects would be less drained, and consequently would be in less need of money. Our Adam Contzen has written extensively on this subject in his Politics.</p></blockquote>

.+The+other+is+external%2C+which+breaks+out+into+open+injury.+This+ought+to+be+coerced+by+the+magistrate.+We+say%2C+therefore%2C+that+such+hatred%2C+when+it+is+exercised+by+Jews+against+Christians%2C+can+in+no+way+be+permitted+or+tolerated%2C+but+must+be+severely+punished%3A+and+the+prince+sins+gravely+if+he+does+not+punish+those+who+commit+offenses.+The+reason+is+that+a+prince+is+bound+by+his+office+to+punish+every+public+injury%2C+if+he+is+able%2C+so+that+justice+may+be+preserved%3A+therefore%2C+he+is+also+bound+to+punish+the+injury+which+the+Jews+commit+against+Christians.+This+is%2C+indeed%2C+manifold%3A+First%2C+because+they+exact+immoderate+and+intolerable+usury+from+citizens%2C+country+folk%2C+and+the+poor.+Whatever+they+exact+beyond+the+principal+is+theft.+Therefore%2C+they+commit+intolerable+theft.+Second%2C+by+exacting+such+usury%2C+they+harm+the+republic+or+the+community+greatly.+For+a+republic+cannot+stand+or+flourish+when+the+people+are+oppressed+and+exhausted+by+usury.+Third%2C+besides+usury%2C+another+injury+is+added.+For+whatever+is+for+sale+in+the+market%2C+the+Jews+snatch+away+from+the+Christians+by+offering+a+higher+price+to+the+sellers+than+other+buyers+are+accustomed+to+offer%3B+and+afterwards%2C+which+is+most+iniquitous%2C+Christians+are+forced+to+pay+double+the+price+to+the+Jews+if+they+wish+to+buy+what+is+necessary+for+feeding+their+families.+Fourth%2C+so+that+they+may+do+all+these+things+with+impunity%2C+they+distribute+gifts+to+the+officials+of+princes+so+that+they+may+be+protected+by+them.+Fifth%2C+from+this+it+happens+that+the+people%2C+who+bear+such+injuries+with+difficulty%2C+become+prone+to+inciting+sedition%2C+both+against+the+Jews+themselves+and+against+their+defenders+and+patrons.+Against+the+Jews%2C+indeed%2C+because+they+are+thieves+and+plunderers%3B+against+the+patrons%2C+because+they+are+partners+of+thieves+and+plunderers.+If+a+prince+or+magistrate+does+not+prevent+or+punish+these+great+evils+%28to+say+nothing+of+the+rest%29%2C+he+is+a+participant+in+the+crime+and+is+bound+to+restitution.+He+can%2C+however%2C+prevent+them+in+three+ways.+First%2C+if+he+expels+the+Jews+entirely+from+his+province+or+city.+Second%2C+if+he+does+not+indeed+expel+them%2C+but+forces+them+to+agriculture%2C+or+to+mechanical+arts%2C+or+to+exercise+other+works%3B+and+does+not+allow+them+to+live+in+idleness+and+luxury%2C+as+they+now+live.+Third%2C+if+he+deprives+them+of+all+the+money+and+wealth+which+they+have+received+through+usury.+Would+that+these+things+were+brought+into+practice.+You+will+say%2C+if+the+Jews+are+either+expelled+or+do+not+accept+usury%2C+two+inconveniences+will+follow%3A+First%2C+because+Christian+princes+in+time+of+necessity+will+not+have+money+for+war.+For+they+are+accustomed+to+seek+this+from+the+Jews.+Then%2C+the+subjects+of+the+princes%2C+who+are+in+need+of+money%2C+will+not+be+able+to+borrow.+I+respond%3A+The+contrary+follows%3A+First%2C+because+once+the+Jews+are+expelled%2C+the+citizens+will+be+able+to+contribute+more+support+than+the+Jews+are+accustomed+to.+For+whatever+the+Jews+contribute%2C+they+receive+from+the+citizens+through+unjust+usury.+And+not+only+this%2C+but+also+whatever+is+necessary+for+them+to+sustain+their+lives.+Therefore%2C+they+take+two+portions+from+the+citizens%3A+one%2C+which+they+give+to+the+prince%3B+the+other%2C+by+which+they+live.+Certainly%2C+if+the+Jews+were+expelled%2C+the+citizens+would+be+prepared+to+give+either+both+portions+to+their+prince%2C+or+at+least+no+less+than+they+give+to+the+Jews.+Next%2C+the+subjects+of+princes+are+in+greater+need+of+money+when+the+Jews+are+present+than+when+they+are+absent.+For+when+they+are+present+and+demanding+intolerable+usury%2C+they+are+completely+drained.+If+they+were+absent%2C+or+at+least+did+not+demand+such+immoderate+usury%2C+the+subjects+would+be+less+drained%2C+and+consequently+would+be+in+less+need+of+money.+Our+Adam+Contzen+has+written+extensively+on+this+subject+in+his+Politics.%E2%80%9D%0A%0A%E2%80%94+Martin+Becanus%2C+Manual+of+Controversies+of+this+Time%2C+%28Wurzburg%2C+1623%29%2C+bk.+5%2C+ch.+18%2C+%E2%80%98Is+a+prince+or+magistrate+able+to+tolerate+Jews+in+his+city+or+province%3F%E2%80%99+tr.+AI+by+The+Faith+Received+Becanus+%281563%E2%80%931624%29+was+a+Dutch-born%2C+Roman+Catholic%2C+Jesuit+priest%2C+known+as+a+theologian+and+controversialist.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1ca8f987c1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1ca8f987c1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=Whether%20a%20prince%20or%20magistrate%20may,on%20this%20subject%20in%20his%20Politics&amp;text=Whether%20a%20prince%20or%20magistrate%20may%20tolerate%20Jews&amp;text=written%20extensively%20on%20this%20subject%20in%20his%20Politics" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>IT is of some difficulty to know certainly what was the opinion of Mahomet, the Author of the Turkish Religion, concerning this Question, Whether the Profession of all Religions be Indifferent? For he seems sometimes to affirm it: as when he says in the Chapter of the Fable, That Jews, Samaritans, Christians, all that shall have trusted in God and believed the Resurrection of the Dead, and done good Works, shall be exempt from affliction, and they shall have nothing to fear at the day of Judgement. Sometimes again he denies it: as when in the same Chapter and Page he says, Certainly they which say that Jesus the son of Mary, is God, are impious; and the entrance into Paradise is forbidden to him that says God hath a companion equal to himself, but hell shall be his habitation. Which Assertions are manifestly contradictory.

And he is otherwise alike unconstant and fluctuating. For sometimes he promises the grace of God to all those that do good works, provided they believe the unity of the Deity; a thing which he is very instant in recommending. And sometimes he says that his Law is the only way of truth and salvation, and almost every where he teaches to promote it by force of Arms; which does not well consist with his former maxim. For if all Religions equally endear to God and his favour, what necessity is there of so many bloody wars for the propagation of Mahometism? In truth it would be a strange thing if a good Musulman should think his salvation secured in the profession of the Christian Religion, which censures Mahomet for the greatest and most abominable Deceiver, that ever lived upon the Earth, and his Alcoran for a piece of unparalleled imposture and execrable impiety; or if he should partake in a communion where they pray continually for the destruction of the Empire of the Turk, and the extirpation of the Mahometan Religion.

It is possible he might dextrously explicate his meaning by this distinction, whereof there are some shadows frequently in his book; That if a person who once embraced the faith, afterwards happen to relapse from or renounce the same by constraint, yet he shall not be condemned, provided he retain the same in his heart: but if he do it voluntarily and without any violence, he shall never be redressed or restored into the right way by God, but shall be adjudged unto eternal pains. And it is well known, that whatever the Alcoran says to the contrary, The Turks hold the Persians for eternally damned, as heretics of their Law, though they consent in the principal points of the same, and both unanimously hold that impostor for a supreme Prophet.

But as to matter of life and ordinary practise, there is no people under the Sun more scrupulous in observation of things which they account as making part of their Religion, or come near it within a hundred leagues; as not to employ any paper to unclean uses, because the Alcoran is written in it, and other such niceties, which speak them indeed sufficiently foolish, but otherwise exact observers of their most minute ceremonies. Their public prayers are constantly frequented, &amp; their private never neglected. Their Fasts are strict and inviolable; and seeing they condemn the use of Wine as abominable, how can they be indifferent in other things more essential and important to Religion?

Certainly though Christians have without comparison better grounds for this pretension, that the truth is on their side, yet they are nothing near so passionate for the promoting of Christianity, as the Turks are for the propagation of the Law of Mahomet. For they invite Christians to them by great rewards; they favour and advance renegades: and when a war is undertaken, they are wonderfully zealous and ardent therein, if there be hope of extending their Belief, further thereby, and planting it amongst the Nations which they invade. Which also themselves are so obstinate in retaining, that it is very ordinary to find amongst them great numbers of persons that have abandoned the name of Christ; but to see converted Turks in Christendom, is a thing then which nothing is more rare: Yea there have been some who have rather chosen to suffer an ignominious death, then to accept of a pardon for notorious crimes committed by them, on condition of being baptised.</p></blockquote>

hey+are+nothing+near+so+passionate+for+the+promoting+of+Christianity%2C+as+the+Turks+are+for+the+propagation+of+the+Law+of+Mahomet.+For+they+invite+Christians+to+them+by+great+rewards%3B+they+favour+and+advance+renegades%3A+and+when+a+war+is+undertaken%2C+they+are+wonderfully+zealous+and+ardent+therein%2C+if+there+be+hope+of+extending+their+Belief%2C+further+thereby%2C+and+planting+it+amongst+the+Nations+which+they+invade.+Which+also+themselves+are+so+obstinate+in+retaining%2C+that+it+is+very+ordinary+to+find+amongst+them+great+numbers+of+persons+that+have+abandoned+the+name+of+Christ%3B+but+to+see+converted+Turks+in+Christendom%2C+is+a+thing+then+which+nothing+is+more+rare%3A+Yea+there+have+been+some+who+have+rather+chosen+to+suffer+an+ignominious+death%2C+then+to+accept+of+a+pardon+for+notorious+crimes+committed+by+them%2C+on+condition+of+being+baptised.%E2%80%9D%0A%0A%E2%80%94+Moses+Amyraut%2C+A+treatise+concerning+religions%2C+in+refutation+of+the+opinion+which+accounts+all+indifferent.+Wherein+is+also+evinced+the+necessity+of+a+particular+revelation%2C+and+the+verity+and+preeminence+of+the+Christian+religion+above+the+pagan%2C+Mahometan%2C+and+Jewish+rationally+demonstrated%2C+%28London%3A+Will.+Nealand%2C+1660%29%2C+Part+3.3%2C+pp+340-43.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8e8107aaac.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8e8107aaac.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/07/20/moise-amyraut-is-islam-compatible-with-religious-indifference/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>We grant that these prophecies [Isaiah 59:20; Amos 9:11] contain evident arguments for a future restoration of Israel, if you will acknowledge that which is before clearly proved by the testimonies of the Apostles, and by experience, that is, that they are begun already in part: we grant also, that they have such correspondence with these texts of Esaie and Amos and many more to: but we deny 1. your manner of restoration, and we hold that the spiritual restoration is more glorious for the honour of God and weal of Israel. 2. we deny that the Apostle James alledgeth the prophecy of Amos for such a conversion of the Jews: for he speaks expressly of visiting the gentiles, to take out of them a people unto His name Act. 15.14. and of this visiting he expones the words of Amos and the other Prophets: he speaks not only of Amos, but saith generally, and to this agree the words of the Prophets.

3 we deny that the Apostle Paul alledgeth the prophecy of Elaie to that pretended purpose, for he saith not, and then all Israel shall be saved, but, and so all Israel shall be saved: he shows no order or difference in time, but makes a conclusion out of the former words, where he saith, Blindness in part is happened to Israel, until the fullness of the gentiles shall come in: and then he inferreth, And so all Israel shall be saved: and therefore the conclusion must be exponed according to the proceeding words, that is, all Israel are the called of Israel and of the gentiles: there is a distinction twixt Israel, and all Israel; and all Israel is more than Israel, seeing it includes likewise the faithful gentiles: and in this signification the proof following in the cited testimony must necessarily be understood, and not of a calling of the Jews after the full calling of the gentiles: and far less of that calling, which (he saith) shall perhaps be (not in part but) of all the gentiles that shall be left. Yea these conjectures destroy one another: for if the calling of the Jews shall be after the fullness of the calling of the gentiles, then all the gentiles that shat be left cannot be called through the wonderful deliverance of the Jews.

And this last conjecture destroyeth a many tenet of the Millenaries, who say, that the Jews shall rule over all the nations, and hold them in subjection till the end of the 1000 years, and then these profane nations shall rise again in arms against the Jews. Now seeing betwixt these above named prophecies of Jere. 23. and 31, &amp;c. and these two of Esaie and Amos, there is not any material difference, and no other difference them betwixt a brief intimation and a large explication of the same thing: and seeing these prophecies of Esaie and Amos are to be understood of the Christian Church and estate thereof from the beginning till the end, as the Apostles James and Paul expone them, this conclusion follows, These above named prophecies give no ground for the earthly monarchy of the Jews.</p></blockquote>

ml">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/05/10/alexander-petrie-against-the-monarchy-of-the-jews/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>First, we need to keep in mind the Fregean point that a difference in sense does not entail a difference in reference. To use Frege’s famous example, the sense of the expression “the morning star” is different from the sense of the expression “the evening star.” But these two expressions refer to one and the same thing, viz. the planet Venus. Similarly, expressions like “the God of the Christians” and “the God of the Muslims” differ in sense, but it doesn’t follow from that alone that they don’t refer to the same God… Second, even a speaker’s erroneous beliefs don’t entail that he is not referring to the same thing that speakers with correct beliefs are referring to… Similarly, the fact that Muslims have what Christians regard as a number of erroneous beliefs about God does not by itself entail that Muslims and Christians are not referring to the same thing when they use the expression “God.</p></blockquote>

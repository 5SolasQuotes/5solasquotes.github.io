<main class="wrap"><figure class="quote" id="q-584e893f2c" data-kw="">
<blockquote><p>The Lord’s Day is therefore to be observed, as one in things that are in themselves Moral and Rational: Nor will this give any Scope to the Libertinism of those who would willingly indulge themselves, either in Worldly Affairs, or loose Recreations on this Day. For it is Moral and Rational that the whole of that Day, which is set apart for the Worship of God, should be employed in his Worship. This likewise is Moral, and of Spiritual Obligation, that we do not our own Pleasure, nor speak our own Words on his Holy Day, as the Prophet expresseth it, Isa. 58.13. This obligeth Christians, as well as the Jews.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Ten Commandments: With Other Sermons</cite>, (London, 1692), p. 225.</span></figcaption>

<blockquote><p>Q. 11. Is all use of images unlawful? A. God did so much hate idolatry and the neighborhood of the idolaters made it so dangerous to the Israelites that He did not only forbid the worshipping of images, but all such making or using of them as might become a snare or temptation to any. So that though it be lawful to make images for civil uses, and when they are made, to fetch holy thoughts or meditation from them, as from all other creatures or things in the world, yet in any case when they become a snare or danger (being not necessary things, they become a sin to those that so use them as [a] snare to others or themselves. Ex. 34:13-15; Num. 33:52; Dt. 7:2; Kn. 11:18 &amp; 23; 14:24. Q. 12. Is it lawful to make any picture of God? A. No: for pictures are the signs of corporeal things, and it is blasphemy to think God like a bodily substance: But it is lawful to make such pictures (as of a glorious light) from which occasion may be taken of good thoughts concerning God. Ex. 25:18, 1•… 20; 1 Sam. 4:4; Ps. 18:1; Eze. 10:2. Q. 13. Is it lawful to make the picture of Christ as man, or as crucified? A. The doing it as such is not forbidden, nor the right use of it when done: But the abuse, i.e. the worshipping of it or of Christ by it, is forbidden and the making or using such when it tends to such abuse and has more of snare than profit.</p></blockquote>

189a7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/53cb2189a7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/images-of-christ/#:~:text=Q.%2011.%20Is%20all%20use%20of,has%20more%20of%20snare%20than%20profit&amp;text=Q.%2011.%20Is%20all%20use%20of%20images%20unlawful&amp;text=abuse%20and%20has%20more%20of%20snare%20than%20profit" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f0a8b9fe31" data-kw="">
<blockquote><p>The liberty and edification of Christ’s people, the grand aim and end of Church power, are inconsistent with that exercise of it which ordains ecclesiastical holidays.

In drawing near to God in holy things, as emphatically as in other matters, “whatsoever is not of faith is sin.” It is of the very essence of acceptable worship, that men “be fully persuaded in their own minds,” and that the conscience, out of a sense of duty, lend its free and willing consent to the acts of worship, as authorized and required by that God who has a right to bind the conscience, and to lay upon it the sense of obligation.

The appointment of ecclesiastical holidays, as parts of worship addressed to God, is inconsistent with the right exercise of conscience in the matter; and that whether the conscience is offended and grieved by the introduction of human and uncommanded ordinances in Divine service, or whether the conscience, deluded and ignorant as to the sin, has no sense of the injury and wrong done to it.

In the one case,—if the conscience is hurt and aggrieved by the imposition, in a matter so nearly concerning it as God’s worship, of unwarranted and uncommanded rites, and is forced, although wounded and offended, to submit against its felt conviction, it is plain that here there can be no liberty left to it at all, but that its Christian rights and freedom in the very matter of approaching to God are trampled under foot.

The oppression upon the conscience in such a case is both great and painfully felt. But even in the other case,— when the conscience is not forced to stifle its own convictions, because no convictions of the wrong done to it are felt,—when, knowing them to be no more than human or ecclesiastical ordinances, they are yet made use of in God’s worship at the bidding of the Church, without any feeling of being offended by the unlawful imposition, still Christian liberty is taken away not the less, and the conscience is enthralled as much, or rather all the more, because it is unconscious of the thraldom.

That the conscience should be taught and trained, in a matter of conscience, to yield a passive and unconscious submission,—that in the very worship of God the conscience should be instructed to own the obligation, not of God’s authority, but of man’s,—that the act of religious service should be a homage, done, not to Christ, but to the Church,—this is to destroy true and intelligent liberty of conscience; and the deed is all the worse, and not the better, because the conscience is made to feel no wrong, but rather to love the yoke that binds it.

It matters not whether, in the appointment and observance of human and uncommanded days, as part of God’s worship, by ecclesiastical authority, the conscience of those on whom they are enforced feels the chain or not. In either case, the imposition is inconsistent with the true liberty wherewith Christ has made His people free.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, ed. D. Douglas Bannerman (2 vols, Edinburgh: T &amp; T Clark, 1868), 1: 417-18.</span></figcaption>

— James Bannerman, The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church, ed. D. Douglas Bannerman (2 vols, Edinburgh: T &amp; T Clark, 1868), 1: 417-18.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+liberty+and+edification+of+Christ%E2%80%99s+people%2C+the+grand+aim+and+end+of+Church+power%2C+are+inconsistent+with+that+exercise+of+it+which+ordains+ecclesiastical+holidays.%0A%0AIn+drawing+near+to+God+in+holy+things%2C+as+emphatically+as+in+other+matters%2C+%E2%80%9Cwhatsoever+is+not+of+faith+is+sin.%E2%80%9D+It+is+of+the+very+essence+of+acceptable+worship%2C+that+men+%E2%80%9Cbe+fully+persuaded+in+their+own+minds%2C%E2%80%9D+and+that+the+conscience%2C+out+of+a+sense+of+duty%2C+lend+its+free+and+willing+consent+to+the+acts+of+worship%2C+as+authorized+and+required+by+that+God+who+has+a+right+to+bind+the+conscience%2C+and+to+lay+upon+it+the+sense+of+obligation.%0A%0AThe+appointment+of+ecclesiastical+holidays%2C+as+parts+of+worship+addressed+to+God%2C+is+inconsistent+with+the+right+exercise+of+conscience+in+the+matter%3B+and+that+whether+the+conscience+is+offended+and+grieved+by+the+introduction+of+human+and+uncommanded+ordinances+in+Divine+service%2C+or+whether+the+conscience%2C+deluded+and+ignorant+as+to+the+sin%2C+has+no+sense+of+the+injury+and+wrong+done+to+it.%0A%0AIn+the+one+case%2C%E2%80%94if+the+conscience+is+hurt+and+aggrieved+by+the+imposition%2C+in+a+matter+so+nearly+concerning+it+as+God%E2%80%99s+worship%2C+of+unwarranted+and+uncommanded+rites%2C+and+is+forced%2C+although+wounded+and+offended%2C+to+submit+against+its+felt+conviction%2C+it+is+plain+that+here+there+can+be+no+liberty+left+to+it+at+all%2C+but+that+its+Christian+rights+and+freedom+in+the+very+matter+of+approaching+to+God+are+trampled+under+foot.%0A%0AThe+oppression+upon+the+conscience+in+such+a+case+is+both+great+and+painfully+felt.+But+even+in+the+other+case%2C%E2%80%94+when+the+conscience+is+not+forced+to+stifle+its+own+convictions%2C+because+no+convictions+of+the+wrong+done+to+it+are+felt%2C%E2%80%94when%2C+knowing+them+to+be+no+more+than+human+or+ecclesiastical+ordinances%2C+they+are+yet+made+use+of+in+God%E2%80%99s+worship+at+the+bidding+of+the+Church%2C+without+any+feeling+of+being+offended+by+the+unlawful+imposition%2C+still+Christian+liberty+is+taken+away+not+the+less%2C+and+the+conscience+is+enthralled+as+much%2C+or+rather+all+the+more%2C+because+it+is+unconscious+of+the+thraldom.%0A%0AThat+the+conscience+should+be+taught+and+trained%2C+in+a+matter+of+conscience%2C+to+yield+a+passive+and+unconscious+submission%2C%E2%80%94that+in+the+very+worship+of+God+the+conscience+should+be+instructed+to+own+the+obligation%2C+not+of+God%E2%80%99s+authority%2C+but+of+man%E2%80%99s%2C%E2%80%94that+the+act+of+religious+service+should+be+a+homage%2C+done%2C+not+to+Christ%2C+but+to+the+Church%2C%E2%80%94this+is+to+destroy+true+and+intelligent+liberty+of+conscience%3B+and+the+deed+is+all+the+worse%2C+and+not+the+better%2C+because+the+conscience+is+made+to+feel+no+wrong%2C+but+rather+to+love+the+yoke+that+binds+it.%0A%0AIt+matters+not+whether%2C+in+the+appointment+and+observance+of+human+and+uncommanded+days%2C+as+part+of+God%E2%80%99s+worship%2C+by+ecclesiastical+authority%2C+the+conscience+of+those+on+whom+they+are+enforced+feels+the+chain+or+not.+In+either+case%2C+the+imposition+is+inconsistent+with+the+true+liberty+wherewith+Christ+has+made+His+people+free.%E2%80%9D%0A%0A%E2%80%94+James+Bannerman%2C+The+Church+of+Christ%3A+A+Treatise+on+the+Nature%2C+Powers%2C+Ordinances%2C+Discipline%2C+and+Government+of+the+Christian+Church%2C+ed.+D.+Douglas+Bannerman+%282+vols%2C+Edinburgh%3A+T+%26+T+Clark%2C+1868%29%2C+1%3A+417-18.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff0a8b9fe31.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f0a8b9fe31.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.

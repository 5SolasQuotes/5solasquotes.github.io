<main class="wrap"><figure class="quote" id="q-52bfadfa69" data-kw="">
<blockquote><p>(6) The Antinomians do not even have faith as a prerequisite for justification, but require it only for this purpose, that it may provide a testimony to the conscience that justification has already happened, because they say that actual justification happened in the satisfaction that Christ offered on the cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’, p. 128</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

<blockquote><p>Whoever prays to God to forgive their sins, trusting that they are among those for whom Christ died and that God will hear their prayers because of Christ, undoubtedly obtains forgiveness of sins. Thus, there is no need to assert that the act of saving faith, which is the instrumental cause of our justification, is the confidence in obtained forgiveness.</p></blockquote>

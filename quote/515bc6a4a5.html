<main class="wrap"><figure class="quote" id="q-515bc6a4a5" data-kw="">
<blockquote><p>We see this in marriage, published in the face of the Church, solemnized by consent of parties and parents, ratified by the action of the minister, and celebrated in the presence of many friends; the knot cannot be untied, no not by agreement of the parents, of the parties, of the minister, of the friends, and of the whole congregation, because marriage is not of the nature of a civil contract, but God is a party and hath a special hand in it, and whom God hath joined together let no man put asunder, or separate again without his consent. (Mt. 19:6)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Numbers</cite>, ch. 30, pp. 704-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>…if I drew not up a fair contract of marriage betwixt you and Christ, if I went not with offers betwixt the bridegroom and you, and your conscience did bear you witness, your mouths confessed that there were many fair trysts and meetings drawn on betwixt Christ and you at communion-feasts and other occasions; there were bracelets, jewels, rings, and love-letters sent to you by the Bridegroom, it was told you what a fair dowry you should have and what a house your husband and ye should dwell in, and what was the bridegroom’s excellency, sweetness, might, power. The eternity, and glory of his Kingdom, the exceeding deepness of his love, who sought his black wife through pain, fires, shame, death and the grave; and swimmed the salt sea for her, undergoing the curse of the law, and then was made a curse for you, and you then consented and said, ‘Even so I take Him’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Joshua Redivivus, or Mr. Rutherford’s Letters</cite>, (1664) | To his Parishoners (2), p. 6</span></figcaption>

</figure><figure class="quote" id="q-1d8c041065" data-kw="">
<blockquote><p>Some have upon these words made a question whether it be lawful for the husband or the wife separated for adultery to marry again while each other lives. As to the party offending, it may be a question; but as to the innocent person offended, it is no question, for the adultery of the person offending has dissolved the knot of marriage by the Divine law. It is true that the knot cannot be dissolved without the freedom of both persons each from another, but yet it seemeth against reason that both persons should have the like liberty to a second marriage. For: 1. The adulteress is by God’s law a dead woman, and so in no capacity to a second marriage. 2. It is unreasonable that she should make an advantage of her own sin and error. 3. This might be the occasion of adultery, to give a wicked person a legal liberty to satisfy an extravagant lust. But for the innocent person, it is as unreasonable that he or she should be punished for the sin of another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on Matthew</cite>, ch. 19, v. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>§11. Of the Cross in Baptism Some nonconformists say that they deny not the civil use of the cross in coins and banners. Others of them say they dare not reprove the ancient Christians that used the sign of the cross merely as a professing, signal action to show to the heathen that they did believe in Christ crucified. Indeed that usage thereof was not an act of worship, but an informing of men touching their faith. It seems lawful to signify, as by words so by other signs, that we are Christ’s and his devoted servants, for words are but a kind of signs. The grounds of scrupling the sign of the cross in baptism are these: 1. That it is not a mere circumstance, but an ordinance of worship, as important as an external rite can be. 2. That being a solemn and stated, symbolic sign of a divine mystery and devised of men, it is of that classis or rank of things which are not necessary in genere, and so not allowed to be determined and imposed by men as things necessary in genere are allowed. 3. That either the whole nature of a sacrament, or at least a part thereof, is in it. That it is a sacrament is thus proved: It is an outward and visible sign of inward and spiritual grace. The outward sign is the representation of the cross, the instrument of Christ’s sufferings, and the inward spiritual grace is fortitude in the Christian warfare, according to the words of the Liturgy. Here is a signification of grace to be given us of God and of our duty according to that grace. Likewise this sign has assigned unto it the moral efficacy of a sacrament for working grace, by teaching and exciting us to the spiritual warfare and minding us of Christ crucified. Also it signifies and seals our relation to Christ, or the grace of being a Christian. And the Liturgy so speaks, “We receive this child into the Congregation of Christ’s Flock, and sign him, etc. in token, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Divine Worship, pt. 3, sect. 11 in Remains (London: Parkhurst, 1684), pp. 220-21</span></figcaption>

<blockquote><p>3. That the ordinance of superiors cannot make the ceremonies [which were claimed to be indifferent, to be] necessary, I have proven in the first part of this Dispute. This is given for one of the chief marks of the man of sin [in 1 Tim. 4:1-5], ‘That which is indifferent, he by his laws and prohibitions maketh to be sin;’ (Morney, Mister. of Iniq., in the Conclusion) and shall they who profess to take part with Christ against Antichrist [such as the prelates] do no less than this? It will be replyed that the ceremonies are not thought necessary in themselves, nor non-conformity unlawful in itself, but only in respect of the Church’s ordinance. Just so the Papists profess that the omission of their rites and observances is not a sin in itself, but only in respect of contemning the Church’s customs and commandments. How comes it then that they [the prelates] are not ashamed to pretend such a necessity for the stumbling blocks of those offending ceremonies among us, as Papists pretend for the like among them?</p></blockquote>

<blockquote><p>If any thing be altered or added which is not commanded of God, being not essential, but accidental, and not as necessary, but as indifferent, appertaining to decency, or to order, or to edification, we cannot hence conclude that anything is altered of the appointed worship, or that there is another worship erected. As for example, Christ performed his Supper at night. The apostles were wont to perform it also in the morning, and the Church followed afterwards this time. Should a man hereupon say that anything is derogated from the Supper of the Lord? Surely no, because Christ commanded not the same to be celebrated in the night, as Himself observed it, but only ‘hoc facite,‘ that we should do that (for the matter or substance) which He did, but not at that time wherein He did it. Also to that the primitive Church (as appears in Justin Martyr) did mingle water with the wine in the Lord’s Supper; it is not a sufficient ground to say they altered or changed the institution of the Lord’s Supper, and that for two reasons: One, because it may be that the wine which Christ Jesus gave to his disciples was mingled with water, seeing the apostles do not report the contrary and it is probable that the primitive Church might receive this from the apostles. Another reason is because the primitive Church did not add water as a matter altogether necessary, and so as appertaining to the substance of the Lords Supper, but only to signify a mystery. But if any did commend it as necessary, they did undoubtedly deprave the Lord’s Supper. But they much more, who used only water in the Lord’s Supper, as the Aquarii did, against whom Cyprian did write: for it is evident, that Christ our Sauior used wine, and commanded that we also should do the like. To this add, in that the ancient bishops in the celebration of the Lord’s Supper did put on another garment than that they usually did wear, appertains nothing to the alteration of the Lord’s Supper: For Christ commanded not that we should celebrate his Supper with our usual garments, as He did, but only that we should do that which He did Himself. The like may be affirmed of sundry other things, as well in baptism as in the Supper of the Lord. The sum of all is this: Such things as are added, but yet as matters indifferent, for order, for decency and to edification, such matters do not change the substance of the sacraments, and therefore alter not the worship. But such things as are taken from the institution of Christ, or else are added as necessary, and appertaining to the substance, those things do corrupt the institution of the Lord, and so do establish another kind of worship. To this kind of addition appertain the places of forbidding to add to God’s Word, Dt. 4:1-2. Note that which he there says, ‘Ye shall not add to the Word which I command you,’ the Word of the Lord is necessary, it ties the conscience, and delivers the substance of the worship, and has nothing adiaphoral or indifferent therein: wherefore to add unto the Word is to ordain or appoint in God’s worship some thing as necessary, and as appertaining to the essence or worship of God, and which does so bind men’s consciences, even as the Word of God itself; wherefore he adds not unto the Word of God, which by the consent of the Church ordains anything, not as necessary, but as indifferent, and free for order only, or for decency, and unto edification, not binding the conscience of any by such an ordinance.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“If any thing be altered or added which is not commanded of God, being not essential, but accidental, and not as necessary, but as indifferent, appertaining to decency, or to order, or to edification, we cannot hence conclude that anything is altered of the appointed worship, or that there is another worship erected. As for example, Christ performed his Supper at night. The apostles were wont to perform it also in the morning, and the Church followed afterwards this time. Should a man hereupon say that anything is derogated from the Supper of the Lord? Surely no, because Christ commanded not the same to be celebrated in the night, as Himself observed it, but only ‘hoc facite,‘ that we should do that (for the matter or substance) which He did, but not at that time wherein He did it. Also to that the primitive Church (as appears in Justin Martyr) did mingle water with the wine in the Lord’s Supper; it is not a sufficient ground to say they altered or changed the institution of the Lord’s Supper, and that for two reasons: One, because it may be that the wine which Christ Jesus gave to his disciples was mingled with water, seeing the apostles do not report the contrary and it is probable that the primitive Church might receive this from the apostles. Another reason is because the primitive Church did not add water as a matter altogether necessary, and so as appertaining to the substance of the Lords Supper, but only to signify a mystery. But if any did commend it as necessary, they did undoubtedly deprave the Lord’s Supper. But they much more, who used only water in the Lord’s Supper, as the Aquarii did, against whom Cyprian did write: for it is evident, that Christ our Sauior used wine, and commanded that we also should do the like. To this add, in that the ancient bishops in the celebration of the Lord’s Supper did put on another garment than that they usually did wear, appertains nothing to the alteration of the Lord’s Supper: For Christ commanded not that we should celebrate his Supper with our usual garments, as He did, but only that we should do that which He did Himself. The like may be affirmed of sundry other things, as well in baptism as in the Supper of the Lord. The sum of all is this: Such things as are added, but yet as matters indifferent, for order, for decency and to edification, such matters do not change the substance of the sacraments, and therefore alter not the worship. But such things as are taken from the institution of Christ, or else are added as necessary, and appertaining to the substance, those things do corrupt the institution of the Lord, and so do establish another kind of worship. To this kind of addition appertain the places of forbidding to add to God’s Word, Dt. 4:1-2. Note that which he there says, ‘Ye shall not add to the Word which I command you,’ the Word of the Lord is necessary, it ties the conscience, and delivers the substance of the worship, and has nothing adiaphoral or indifferent therein: wherefore to add unto the Word is to ordain or appoint in God’s worship some thing as necessary, and as appertaining to the essence or worship of God, and which does so bind men’s consciences, even as the Word of God itself; wherefore he adds not unto the Word of God, which by the consent of the Church ordains anything, not as necessary, but as indifferent, and free for order only, or for decency, and unto edification, not binding the conscience of any by such an ordinance.”

— Jerome Zanchi, Of Redemption, ch. 19, fol. 447, as quoted in John Sprint, Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1618), ‘Reformed Practices’, ‘Practice’, pp. 177-79">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+any+thing+be+altered+or+added+which+is+not+commanded+of+God%2C+being+not+essential%2C+but+accidental%2C+and+not+as+necessary%2C+but+as+indifferent%2C+appertaining+to+decency%2C+or+to+order%2C+or+to+edification%2C+we+cannot+hence+conclude+that+anything+is+altered+of+the+appointed+worship%2C+or+that+there+is+another+worship+erected.+As+for+example%2C+Christ+performed+his+Supper+at+night.+The+apostles+were+wont+to+perform+it+also+in+the+morning%2C+and+the+Church+followed+afterwards+this+time.+Should+a+man+hereupon+say+that+anything+is+derogated+from+the+Supper+of+the+Lord%3F+Surely+no%2C+because+Christ+commanded+not+the+same+to+be+celebrated+in+the+night%2C+as+Himself+observed+it%2C+but+only+%E2%80%98hoc+facite%2C%E2%80%98+that+we+should+do+that+%28for+the+matter+or+substance%29+which+He+did%2C+but+not+at+that+time+wherein+He+did+it.+Also+to+that+the+primitive+Church+%28as+appears+in+Justin+Martyr%29+did+mingle+water+with+the+wine+in+the+Lord%E2%80%99s+Supper%3B+it+is+not+a+sufficient+ground+to+say+they+altered+or+changed+the+institution+of+the+Lord%E2%80%99s+Supper%2C+and+that+for+two+reasons%3A+One%2C+because+it+may+be+that+the+wine+which+Christ+Jesus+gave+to+his+disciples+was+mingled+with+water%2C+seeing+the+apostles+do+not+report+the+contrary+and+it+is+probable+that+the+primitive+Church+might+receive+this+from+the+apostles.+Another+reason+is+because+the+primitive+Church+did+not+add+water+as+a+matter+altogether+necessary%2C+and+so+as+appertaining+to+the+substance+of+the+Lords+Supper%2C+but+only+to+signify+a+mystery.+But+if+any+did+commend+it+as+necessary%2C+they+did+undoubtedly+deprave+the+Lord%E2%80%99s+Supper.+But+they+much+more%2C+who+used+only+water+in+the+Lord%E2%80%99s+Supper%2C+as+the+Aquarii+did%2C+against+whom+Cyprian+did+write%3A+for+it+is+evident%2C+that+Christ+our+Sauior+used+wine%2C+and+commanded+that+we+also+should+do+the+like.+To+this+add%2C+in+that+the+ancient+bishops+in+the+celebration+of+the+Lord%E2%80%99s+Supper+did+put+on+another+garment+than+that+they+usually+did+wear%2C+appertains+nothing+to+the+alteration+of+the+Lord%E2%80%99s+Supper%3A+For+Christ+commanded+not+that+we+should+celebrate+his+Supper+with+our+usual+garments%2C+as+He+did%2C+but+only+that+we+should+do+that+which+He+did+Himself.+The+like+may+be+affirmed+of+sundry+other+things%2C+as+well+in+baptism+as+in+the+Supper+of+the+Lord.+The+sum+of+all+is+this%3A+Such+things+as+are+added%2C+but+yet+as+matters+indifferent%2C+for+order%2C+for+decency+and+to+edification%2C+such+matters+do+not+change+the+substance+of+the+sacraments%2C+and+therefore+alter+not+the+worship.+But+such+things+as+are+taken+from+the+institution+of+Christ%2C+or+else+are+added+as+necessary%2C+and+appertaining+to+the+substance%2C+those+things+do+corrupt+the+institution+of+the+Lord%2C+and+so+do+establish+another+kind+of+worship.+To+this+kind+of+addition+appertain+the+places+of+forbidding+to+add+to+God%E2%80%99s+Word%2C+Dt.+4%3A1-2.+Note+that+which+he+there+says%2C+%E2%80%98Ye+shall+not+add+to+the+Word+which+I+command+you%2C%E2%80%99+the+Word+of+the+Lord+is+necessary%2C+it+ties+the+conscience%2C+and+delivers+the+substance+of+the+worship%2C+and+has+nothing+adiaphoral+or+indifferent+therein%3A+wherefore+to+add+unto+the+Word+is+to+ordain+or+appoint+in+God%E2%80%99s+worship+some+thing+as+necessary%2C+and+as+appertaining+to+the+essence+or+worship+of+God%2C+and+which+does+so+bind+men%E2%80%99s+consciences%2C+even+as+the+Word+of+God+itself%3B+wherefore+he+adds+not+unto+the+Word+of+God%2C+which+by+the+consent+of+the+Church+ordains+anything%2C+not+as+necessary%2C+but+as+indifferent%2C+and+free+for+order+only%2C+or+for+decency%2C+and+unto+edification%2C+not+binding+the+conscience+of+any+by+such+an+ordinance.%E2%80%9D%0A%0A%E2%80%94+Jerome+Zanchi%2C+Of+Redemption%2C+ch.+19%2C+fol.+447%2C+as+quoted+in+John+Sprint%2C+Cassander+Anglicanus%2C+showing+the+Necessity+of+Conformity+to+the+Prescribed+Ceremonies+of+our+Church+in+Case+of+Deprivation+%28London%3A+Bill%2C+1618%29%2C+%E2%80%98Reformed+Practices%E2%80%99%2C+%E2%80%98Practice%E2%80%99%2C+pp.+177-79&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4c214d30fa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4c214d30fa.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-regulative-principle-of-worship/#:~:text=If%20any%20thing%20be%20altered%20or,of%20any%20by%20such%20an%20ordinance&amp;text=If%20any%20thing%20be%20altered%20or%20added%20which&amp;text=the%20conscience%20of%20any%20by%20such%20an%20ordinance" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

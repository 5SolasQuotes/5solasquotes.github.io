<main class="wrap"><figure class="quote" id="q-e2cf359f99" data-kw="Affliction|Submission" data-pol="">
<blockquote><p>How kind is God in wisely and mercifully deciding so many things for us! The man who fears God and loves his little daughter, would esteem it a greater affliction to be called on to say when his child should be sick—than he now finds it to nurse her through weeks of disease, close her eyes in death, and then carry her to the grave. God very mercifully bears the heaviest part of all our trials, by marking out our course for us. God is governor. We are servants. To us belong obedience, submission, acquiescence. It is not ours to guide, to decide what is best, to rule the world, to shape the course of events.</p></blockquote>
<figcaption>— <a href="../authors/william-s-plumer.html">William S. Plumer</a>, <cite>Jehovah-Jireh: A Treatise on Providence</cite>, ch. “The Mysteries of God’s Providence”</figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-940c6385f9" data-kw="Affliction|Wisdom" data-pol="">
<blockquote><p>It is the discipline of wisdom. He who administers it is the &quot;God only wise.&quot; What deep wisdom then must there be in all His dealings! He knows exactly what we need and how to supply it. He knows what evils are to be found in us, and how these may be best removed. His training is no random work. It is carried on with exquisite skill. The time and the way and the instrument are all according to the perfect wisdom of God. The fittest time is chosen, just the very moment when discipline is called for, and when it would be most profitable. The surest, most direct, and at the same time gentlest method is devised. The instrument which will be surest yet safest, most effectual yet least painful, is brought into operation. For all is wisdom in the discipline of God.</p></blockquote>
<figcaption>— <a href="../authors/horatius-bonar.html">Horatius Bonar</a>, <cite>Night of Weeping</cite>, ch. IV, “The Family Discipline,”</figcaption>

</figure><figure class="quote" id="q-710a173bd5" data-kw="Affliction|Comfort" data-pol="">
<blockquote><p>Furthermore, all who are disposed to betake themselves to God, under the crook in their lot may take comfort in this, let them know that there is no crook in their lot but they may be made straight; for God made it, surely then He can mend it. He himself can make straight what He has made crooked, though none other can.</p></blockquote>
<figcaption>— <a href="../authors/thomas-boston.html">Thomas Boston</a>, <cite>The Crook in the Lot</cite>, Doct. I, Use 2 (consolation)</figcaption>

</figure><figure class="quote" id="q-dac24ced2c" data-kw="Affliction" data-pol="">
<blockquote><p>The truth is, the crook in the lot is the great engine of Providence for making men appear in their true colours, discovering both their ill and their good. And if the grace of God is in them, it will bring it out, and cause it to display itself. It so puts the Christian to his shifts, that however it makes him stagger for awhile, yet it will at length evidence both the reality and the strength of grace in him.</p></blockquote>
<figcaption>— <a href="../authors/thomas-boston.html">Thomas Boston</a>, <cite>The Crook in the Lot</cite>, Doct. I, head III (why God makes a crook)</figcaption>

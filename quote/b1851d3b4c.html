<main class="wrap"><figure class="quote" id="q-b1851d3b4c" data-kw="">
<blockquote><p>Who is one of you.] Lastly then, the Apostle wishes also by this consideration to render Onesimus more acceptable to the Colossians, because he was sprung from Colosse, that is to say, of their people and a countryman. For although this does not make much for the praise of this man, yet it conduces something to inflame the Colossians with the love of him: for what is a person’s own and is peculiar to him, is wont to be more loved by every one.

Observations.

1. It is proper to treat them with peculiar affection, to whom we are more near and bound in any peculiar respect; for example, if they should be of the same blood, affinity, or country with us, or of the same society.

2. That affection, therefore, is vicious, which in many begets contempt, or at least, a neglect of their own, namely, because they are of our kin. For as in things, so also in persons; the things which are produced at home are nearest to dis-esteem, but all distant and foreign things are extolled with wonderful encomiums. Christ himself experienced this folly of his own countrymen, and seriously complained of it, Matt. xiii. 57, A prophet is not without honour, save in his own country and in his own house. And thus much of the person extolled, and of his commendation. …

Who is one of you.] That is, your fellow-citizen, born and educated among you, and finally given and devoted to your advantage. This especially conduces to conciliate love for him. For all love (as the Schools express it) is founded in some communication or participation of the same thing: therefore, they who are participants of the same country and city, are united together as by a certain closer bond of love. For as their native soil is used to be dear to all, so it renders all things which spring from it even more dear to the wise and sober.

Corollaries.

1. They are deservedly to be blamed as vain and void of natural affection, who despise their own kindred and all their home concerns, being in the mean time addicted beyond what is just and good, to things and persons foreign to the house.

2. They who by a participation of country and city, or any like cause, are united with us, all other things corresponding, ought to be more dear than strangers. Hence says the Apostle, 1 Tim. v. 8, If any provide not for his own, and especially for those of his own house, he hath denied the faith, and is worse than an infidel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1832), 2: 275-76, 287-88.</span></figcaption>

<blockquote><p>The subject of national education furnishes a plain and striking illustration of this branch of national duty. It is, perhaps, universally admitted by judicious men, that the interests of education are within the province of civil authorities: that it is the duty of the state to make ample provision for the instruction of its youth. The question occurs, should this be of a Christian character and tendency, or not? Ought schemes for public instruction be so framed and executed as to impress upon the tender minds of youth a conviction of the being, and a sense of the glory and claims of Christ, or is every thing tending to this to be carefully excluded? Should the Bible be read or not? Should prayer in Christ’s name accompany public instruction or not? The reply of every Christian mind and heart, not sealed by prejudice, may be anticipated: “Let us have systems of education imbued with the principles and instinct with the spirit of the Christian religion.” Every intelligent man knows that the cultivation of the intellect, promotes neither happiness nor usefulness, unless that of the heart go along with it. And no Christian will say that any means to accomplish the latter can be effectual, but the doctrines of the Bible; Christ must be known. We must then deny that the care of providing for national instruction devolves upon the public authorities, assent to the monstrous proposition that national instruction may be, without sin, a moral blank, or admit that nations in their national character are bound “to serve the Lord Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-m-willson.html">J. M. Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bible magistracy: or Christ’s dominion over the nations: with an examination of the civil institutions of the</cite>, United States (Philadelphia, 1842), pp 59-61.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>4. That which is the garland and proper flower of the King of kings, as He is absolute above his creatures, and not tied to any law, without Himself that regulates his will, that must be given to no mortal man or king except we would communicate that which is God’s proper due to a sinful man, which must be idolatry. But to do royal acts out of an absolute power above law and reason, is such a power as agrees to God, as is evident in positive laws and in acts of God’s mere pleasure, where we see no reason without the Almighty for the one side rather than for the other, as God’s forbidding the eating of the Tree of Knowledge makes the eating sin and contrary to reason; but there is no reason in the object; for if God should command eating of that tree, not to eat should also be sin. So God’s choosing Peter to glory and his refusing Judas, is a good and a wise act, but not good or wise from the object of the act, but from the sole wise pleasure of God; because, if God had chosen Judas to glory and rejected Peter, that act had been no less a good and a wise act than the former. For when there is no law in the object but only God’s will, the act is good and wise, seeing infinite wisdom cannot be separated from the perfect will of God; but no act of a mortal king, having sole and only will, and neither law nor reason in it, can be a lawful, a wise, or a good act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, … (1646), Question 23, pp. 106-7</span></figcaption>

<blockquote><p>The Gibbites in 1681, and Russelites in 1682, and for some years, did maintain the same unhappy principles and practices [as the later M’Millianites after 1689]; and stated their testimonies against paying of excise and customs, and other fool things, not only for themselves, but separation from all that durst not go their lengths, even when imprisoned together going as far from us as the walls of the prison would allow them, and stopping their ears when we went about publick worship three times a day, which was our ordinary in each room… It is a piece of demented infatuation to make little or no difference betwixt that period [before 1689] and this [period after 1689 during toleration], and to follow the same methods that the Lord’s people were obliged to take against tyranny and defections.</p></blockquote>

<blockquote><p>Secondly: neither is there any contradiction in these words, of themselves: for to know which are the canonical books may be held to be a substantial point and belonging to the faith, and yet not simply necessary to salvation: he knows little if he cannot distinguish between a simple and absolute necessity, and a necessity not absolute: as some things are absolutely necessary to salvation without the which a man cannot be saved: as Heb. 10:36… But in another sense the apostles write, Acts 15:28, “It seemed good, etc. to lay no more burden upon you than these necessary things”: yet was it not simply necessary to abstain from blood and things strangled, but convenient and profitable for that time because of offence: so to know which books are canonical, though it be not simply necessary to salvation, if a man hold the foundation: yet is it necessary, as a profitable mean for the increase of faith: and though it be not so substantial as the foundation of faith, yet is it substantial, as many necessary parts in an house are beside the foundation.</p></blockquote>

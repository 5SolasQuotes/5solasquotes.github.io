<blockquote><p>1. Concerning metaphysics to be produced by the Reformed, long before me the most learned men from all sides have thought much; and who, if even the least leisure had been theirs from their affair, would here easily have borne off the prize. [William] Twisse pities the fate of Christianity that until now the students of our [reformed] academies have used no other instructors but Jesuits: and they hope to be able to aspire to the arduous progress of things where it lies open by natural light by such masters. Yet who would have been more fit than him to undertake this labor for the sake of the theological youth? Who would have more suitably cleansed that Augean stable of the Jesuits; and thus through natural reason would have paved for us the royal way to the innermost parts of sacred theology? lest the enemies of the Orthodox religion through first philosophy, defiled and polluted by them, should make a straight attack on pure and sacred theology. But that most famous man has departed; and what others would have not undeservedly demanded from him, he in vain desired in others. Must therefore so great a work be put off to the coming of Elijah or of Christ the Savior? Not indeed. Provision must especially be made for those who will one day propose the mysteries of God to the people. Provision must be made as quickly as possible, lest like the Israelites the students be perpetually compelled to borrow arms from the Philistines, the enemies of divine truth. I designate the writings of the Jesuits, which certainly are not traversed safely enough by studious youth, because they prepare the way to Pelagianism, Skepticism, Libertinism and many other things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-voet.html">Paul Voet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>First Philosophy Reformed</cite>, tr. by AI by Onku (Utrecht: Johann Waesberg, 1657) Latin, ch. 1 ch. 2, pt. 1, 2; ch. 1</span></figcaption>

<blockquote><p>A distinction is formal (real in a certain respect) according to Scotists and others, if it exists between realities and formalities, for example between the soul and its faculties, between the faculties themselves, between the metaphysical essence and its properties, between the various perfections or metaphysical degrees, between the attributes of God, between the divine nature and the divine Persons, between the principle of individuation and the specific essence. A formality (or reality) is something positive included in a real being which, although it does not and cannot exist by itself, can be conceived in a clear and distinct concept in abstraction from any other formality of the same thing that it belongs to [it]. The sign of a formal distinction includes three things: a) ability to be conceived in a concept that is not only distinct but also complete and exclusive; b) such that what is conceived is not a thing but something of a thing; c) inseparability from the thing it belongs to. A formal distinction is fully defined as “a distinction in the nature of the thing that comes between several formalities identified in reality, one of which can be conceived without the other before any work of the intellect, although it cannot exist without the other even by divine power. … On the Formal Distinction Specifically This distinction is not admitted by everyone, especially among Thomists. Although it is often called a ‘Scotistic’ distinction, such a distinction was not an innovation on the part of Scotus. It is found in the whole Augustinian tradition. It is contained implicitly in the distinction ‘of attribution’ of St. Bonaventure, and explicitly in Olivi, William of Ware, Matthew of Aquasparta, William of Macclesfield, Roger Marston, Alexander of Alexandria, etc.² Scotus himself merely reduced the distinction to a scientific system, and used it as a powerful instrument of metaphysical explication. ² B. Jansen, “Beiträge zür geschichtlichen Entwicklung der Distinctio formalis,” Zeitschrift für katholische Theologie, LIII (1929) 317 ff. M. Grajewski, op. cit. ch. 6. What are the arguments commonly adduced in favor of the formal distinction? The more powerful arguments are drawn from theology. Among philosophical arguments the following can be numbered:

1. Man, on the part of the thing, formally agrees in animality with the brute; the same man, again on the part of the thing, does not agree in rationality with the same brute. Therefore animality and rationality in man, on the part of the thing, is not one and the same undistinguished perfection; otherwise man would, on the part of the thing, agree and not agree with the brute at the same time and according to altogether the same idea, which is absurd. The same argument holds if the comparison is made between man and angel or pure spirit.

2. If animality and rationality, on the part of the thing and intrinsically, were one and the same perfection, they would be absolutely inseparable; for nothing can be separated from itself; hence one would never be found without the other. But in fact they are found separated, for animality is found in the true without rationality; in an angel rationality is found without animality; and in each case formally and on the part of the thing. Therefore even in man they cannot be formally and on the part of the thing one and the same perfection.

3. Animality can be conceived and defined not only distinctly but also completely and exclusively without rationality; the same has to be said of rationality. But if our knowledge is valid and real definitions are possible, that which is conceived, even on the part of the thing, in one concept cannot be identical with what is conceived in another concept; therefore etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), ch. 2, On the Attributes in General &amp; on ‘One”, Article 4, ‘On Identity &amp; Distinction’, pp. 30-31</span></figcaption>

<blockquote><p>We can distinguish between adequate and inadequate distinction. The first is if the things said to be distinct are as it were equal or equivalent, as is the case with all the distinctions above adduced. A distinction is inadequate if the distinct things are not equal, so that one includes the other but not conversely. Such inadequate distinctions flourish, for example, between the whole and its part, or between a subject and its mode, for a mode includes the subject it modifies and the whole includes its parts. These sort of inadequate distinctions, as is plain, can be real (for example between the human body and an arm), or formal (for example between soul and intellect, between animality and sense feeling, between formality and its mode, as between divine wisdom and the same thing’s infinity), or logical (for instance between the rays of the sun and their power of heating). Also here can be added real negative distinctions, which flourish not between thing and thing but between a thing and a negation of it (for example between man and blindness).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“We can distinguish between adequate and inadequate distinction. The first is if the things said to be distinct are as it were equal or equivalent, as is the case with all the distinctions above adduced. A distinction is inadequate if the distinct things are not equal, so that one includes the other but not conversely. Such inadequate distinctions flourish, for example, between the whole and its part, or between a subject and its mode, for a mode includes the subject it modifies and the whole includes its parts. These sort of inadequate distinctions, as is plain, can be real (for example between the human body and an arm), or formal (for example between soul and intellect, between animality and sense feeling, between formality and its mode, as between divine wisdom and the same thing’s infinity), or logical (for instance between the rays of the sun and their power of heating). Also here can be added real negative distinctions, which flourish not between thing and thing but between a thing and a negation of it (for example between man and blindness).”

— Alan B. Wolter, Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958), ch. 2, On the Attributes in General &amp; on ‘One”, Article 4, ‘On Identity &amp; Distinction’, p. 32">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+can+distinguish+between+adequate+and+inadequate+distinction.+The+first+is+if+the+things+said+to+be+distinct+are+as+it+were+equal+or+equivalent%2C+as+is+the+case+with+all+the+distinctions+above+adduced.+A+distinction+is+inadequate+if+the+distinct+things+are+not+equal%2C+so+that+one+includes+the+other+but+not+conversely.+Such+inadequate+distinctions+flourish%2C+for+example%2C+between+the+whole+and+its+part%2C+or+between+a+subject+and+its+mode%2C+for+a+mode+includes+the+subject+it+modifies+and+the+whole+includes+its+parts.+These+sort+of+inadequate+distinctions%2C+as+is+plain%2C+can+be+real+%28for+example+between+the+human+body+and+an+arm%29%2C+or+formal+%28for+example+between+soul+and+intellect%2C+between+animality+and+sense+feeling%2C+between+formality+and+its+mode%2C+as+between+divine+wisdom+and+the+same+thing%E2%80%99s+infinity%29%2C+or+logical+%28for+instance+between+the+rays+of+the+sun+and+their+power+of+heating%29.+Also+here+can+be+added+real+negative+distinctions%2C+which+flourish+not+between+thing+and+thing+but+between+a+thing+and+a+negation+of+it+%28for+example+between+man+and+blindness%29.%E2%80%9D%0A%0A%E2%80%94+Alan+B.+Wolter%2C+Little+Summary+of+Metaphysics+%28Milwaukee%3A+Bruce+Publishing+Co.%2C+1958%29%2C+ch.+2%2C+On+the+Attributes+in+General+%26+on+%E2%80%98One%E2%80%9D%2C+Article+4%2C+%E2%80%98On+Identity+%26+Distinction%E2%80%99%2C+p.+32&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4c950bed6a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4c950bed6a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-particular-metaphysical-issues/#:~:text=We%20can%20distinguish%20between%20adequate%20and,for%20example%20between%20man%20and%20blindness&amp;text=We%20can%20distinguish%20between%20adequate%20and%20inadequate%20distinction&amp;text=of%20it%20%28for%20example%20between%20man%20and%20blindness" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cab4c34008" data-kw="">
<blockquote><p>In light of all of these problems with Van Til’s thought, it is clear that when twentieth-century Reformed Christians followed Van Til and adopted his presuppositionalism in place of the traditional apologetics and theology of the sixteenth- and seventeenth-century Reformed scholastic theologians, they let go of an invaluable and precious birthright. What replaced that birthright has been uniquely detrimental to the contemporary Reformed church… If we would take the time to go back and carefully reread the Reformed scholastics, we would discover that it is they, and not Van Til, who provide us with an approach to theology and a foundation for apologetical work that is biblical, clear, precise, and internally self-consistent.</p></blockquote>

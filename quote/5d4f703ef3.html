<blockquote><p>Why have any religion at all? Is it not enough to have a good, sensible philosophy?” No. If this had been enough, clericalism would have been driven to the wall long ago. The experiment has been thoroughly tried in France for eighty years, and has failed. The power of the priesthood tends to increase, and the superstitions of the Roman church grow worse and worse.

No doubt atheism in its various forms — materialism, pantheism, positivism has advanced and spread; but the bourgeoisie — the bulk of the well-to-do citizens — have a horror and dread of atheism, and by this very fact are impelled to support the only church they know of; and so superstition is made fashionable. “Man cannot live by bread alone.” All his higher cravings are famished when he attempts to subsist only on what he can find in atheism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-woolsey-bacon.html">Leonard Woolsey Bacon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s Wonderful Work in France: An Introduction of the Deputation from the Protestants of France to the American Churches</cite>, (New York: American Tract Society, 1880), pp 17-18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>Therefore, our doctrine is that in elenctic theology, or in the refutation of falsehood, e.g. Purgatory, indulgences, etc, discourse and consequences are to be employed. And if it is the case that a resolute adversary denies them, then the proving of consequences is also to be employed, not only from the Holy Bible, but also from the axioms and principles of the light of nature, known either naturally or technically, from Philosophy and Logic, so that the suitable connection of the middle term with the major term is apparent. The truth of doctrines, rather, or of middle terms, and the connection of the middle term with the minor, is to be demonstrated either from the express words, or equivalent ones, or the good consequence, of Scripture alone (except if the doctrines belong to natural theology, which are proven from Scripture primarily, and also from the light of nature secondarily).</p></blockquote>

<blockquote><p>I have often wished that one of the veteran theologians would have developed a form of logic like the one I have outlined here, though I have only sketched rather than fully worked it out. Even though Andreas Hyperius published Theological Topics in the previous century, he did not use the method that scholars desire. A theological logic should be crafted such that it first demonstrates a method of argumentation in general and then provides rules for forming judgments in individual common places of theological debate. Here, I have broken the first ice. Kindly judge, reader, what I have accomplished, and make this handbook richer through your own efforts.</p></blockquote>

</figure><figure class="quote" id="q-17509e63f2" data-kw="">
<blockquote><p>On the Natures of Things &amp; Substantial Forms 1. We do not introduce these things to the students so that they will all now immediately necessarily believe in forms with their appendices, or contend tooth and nail for them, but so that they may at least for a time abstain from a peremptory judgment and its execution, by which the miserable and innocent beings are cast down from their ancient possession, until they have learned thoroughly, if not most accurately, at least moderately the philosophy of the schools, specifically logic, metaphysics, physics and these few notes which we subjoin, having been solidly determined, and they see that they are satisfied in them. However they will finally judge, we will not have wasted our labor if in the meantime we will have recalled them from a fierce contempt and flight of the philosophical study, moreover from an idiotic rustic and proud ignorance, so that at least it could sometime be said concerning those dissenting elsewhere what is boasted among the Arabs: A wise man when he errs, errs with learned error. Moreover our notes are threefold:

1. Certain prejudgments which I [approvingly] suggest to the disputants.

2. Reasons for forms, which are to be clearly solved.

3. Reasons against forms and for those vicarious accidents which certain more recent [mechanical] authors wish to be substituted for forms, which forms and their doubts, with their principles and consequences, are fittingly to be defended.

2. The notes of the first kind are:

I. Let them consider whether they satisfy themselves in the reconciliation of this opinion [of forms] with sacred scripture. For it indeed harmonizes with truth: and Christian philosophers will profess learned ignorance a thousand times rather than that they bring even the least appearance of prejudice to divine truth. See Gen. 1:11, 21-22, 24-25; Prov. 30:24-27, where we think permanent natures, faculties and distinct species of things are implied.

II. It is to be seen whether from the denying opinion there would be at least an easier lapse than from the affirming into doubt. [Put the question forth:] Whether there are any substantial forms which actuate the body of man and constitute one composite with it? But if someone denies this, and substitutes the krasin of Galen, or a particle of divine breath or soul of the world, or the universal intellect of Averroes, or the mind of Plato, thrust into the workshop of the body as a genial pipor and bound to it, as Prometheus the Caucasian, if someone I say substitutes such a thing, by what reasons would you more successfully and safely rebut him than [those by which] the assertors of forms [do].

III. It is to be seen how with this opinion standing the distinction between the being of substance and of accident can be conveniently explained and defended. For there would be, according to them, no substantial difference between a wolf, a sheep, a whale, an elephant, a serpent, a stone, a monk’s hood, aconite, wheat, the sun, the moon, the earth; add also a clock, the wooden Trojan horse, the bronze bull of Phalaris, the flying dove of Archytas, the bronze head of Pope Sylvester, the speaking statue of Albertus Magnus, a house, a chair, a garment etc. But perhaps they would retort that those substances differ essentially through those five accidents motion, rest, position, figure and quantity. I respond: Granting this to be so (about which we do not now dispute), the difficulty is nevertheless not removed by this escape. It nevertheless remains [on this view] that substances are distinguished from substances in no other way than accidents from substances and accidents among themselves, for both the former and the latter are distinguished by accidents.

IV. It is to be seen whether from here there is not an easier lapse, when someone is pressed by reasons and consequences into this absurd [occasionalist] opinion: ‘Secondary causes endowed with their own causality are not given, but only the first and universal cause acts in the presence and disposition of secondary causes.’ See the absurdity of this opinion shown by the Scholastics and more recent metaphysicians and theologians in the topic on Providence, on the concourse of God with creatures. Let the consequences [of their position], by which they could be pressed, be these:

      1. That the concourse of God is not given, nor the motion of the first mover accommodated to the natures and properties of secondary causes, whether they are necessary or contingent.

      2. That there is not in created substances an intrinsic mover and a substantial principle of internal and proper motion: for the disposition of the mobile thing to motion from quantity, figure, position is not the activity or causality of the efficient cause, but only a required condition, and a cause sine qua non (‘without which nothing’).

      3. Consequently, since no mobile thing can move itself in potency to act or determine itself to motion, it remains that some external mover is to be sought which may lead the potency into act. But what will they give here? The Platonic-Virgilian soul of the world, or intelligences, or God, or atoms, or celestial globules. Here something will have to be said [by them].

V. It is to be seen lest the negation of proper qualities, which internally emanate from the form and substance of a thing (the negation of which follows the negation of forms, just as one error drags another), drive us into these absurdities:

      1. That created substances are the immediate principle of their own operation, since there are no active qualities by which substances operate as a means: which see shaken out by the metaphysicians and theologians when they treat of the simplicity of God and of the distinction of the divine attributes.

      2. That there are no qualities altogether, as neither of the second, or third, so also not of the first species; that is, there are no habits, against the common school of philosophers and theologians. I would like to see how those who deny natural faculties or powers will vindicate habits against the atheists, skeptics and infidels (the necessity of which Scripture and reason persuades), lest they be likewise shut up in that pentagon-workshop of motion, rest, quantity, position and figure.

VI. From this opinion it follows that no definitions of substances are given, since there are no forms or proper first and internal essentials from which the difference can be taken. How this may savor to the sons of the logicians of whatever sect, and to all acroamatic minds, and to the professors of whatever disciplines, they themselves will see.

VII. This absurdity also follows: That all created substances, even man himself (and why not angels and separate souls?), are beings per accidens [through accident], collective and aggregate: but not essences or natures, one per se [through itself]. So that no essence seems to be per se, except perhaps atoms, or ethereal globules, or insensible particles, or Platonic ideas (which he called αυτοάνθρωπον, αυτοίππον, etc.) or chimeras buzzing in the void, etc. But that man ought to be called a being and one per se, we will teach below.

VIII. It would follow that there are no proper and intrinsic faculties, nor are their principles in animals of another kind than in automata or Daedalean statues; and consequently the works of God and nature produced through creation or generation are essentially and univocally the same with works of art: which how it may agree well enough with Ps. 104:29; 7:14-15; Num. 16:22; 27:16; Heb. 11:9-10; Hab. 2:19, I confess I do not see the knot.

IX. It would follow that there is no generation or corruption of natural things. But more on this in Thesis 4 [below].

X. Since efficiency and motion, which is usually attributed to forms and their active qualities, is attributed to quantity and figure, it is to be seen lest young men at some time imprudently admit through consequence that magical axiom rejected by all Christian theology and philosophy: “There is some efficacy of quantity and figure, and it either per se or with others things concurs as an active principle of transmutation.</p></blockquote>

2. The notes of the first kind are:

I. Let them consider whether they satisfy themselves in the reconciliation of this opinion [of forms] with sacred scripture. For it indeed harmonizes with truth: and Christian philosophers will profess learned ignorance a thousand times rather than that they bring even the least appearance of prejudice to divine truth. See Gen. 1:11, 21-22, 24-25; Prov. 30:24-27, where we think permanent natures, faculties and distinct species of things are implied.

II. It is to be seen whether from the denying opinion there would be at least an easier lapse than from the affirming into doubt. [Put the question forth:] Whether there are any substantial forms which actuate the body of man and constitute one composite with it? But if someone denies this, and substitutes the krasin of Galen, or a particle of divine breath or soul of the world, or the universal intellect of Averroes, or the mind of Plato, thrust into the workshop of the body as a genial pipor and bound to it, as Prometheus the Caucasian, if someone I say substitutes such a thing, by what reasons would you more successfully and safely rebut him than [those by which] the assertors of forms [do].

III. It is to be seen how with this opinion standing the distinction between the being of substance and of accident can be conveniently explained and defended. For there would be, according to them, no substantial difference between a wolf, a sheep, a whale, an elephant, a serpent, a stone, a monk’s hood, aconite, wheat, the sun, the moon, the earth; add also a clock, the wooden Trojan horse, the bronze bull of Phalaris, the flying dove of Archytas, the bronze head of Pope Sylvester, the speaking statue of Albertus Magnus, a house, a chair, a garment etc. But perhaps they would retort that those substances differ essentially through those five accidents motion, rest, position, figure and quantity. I respond: Granting this to be so (about which we do not now dispute), the difficulty is nevertheless not removed by this escape. It nevertheless remains [on this view] that substances are distinguished from substances in no other way than accidents from substances and accidents among themselves, for both the former and the latter are distinguished by accidents.

IV. It is to be seen whether from here there is not an easier lapse, when someone is pressed by reasons and consequences into this absurd [occasionalist] opinion: ‘Secondary causes endowed with their own causality are not given, but only the first and universal cause acts in the presence and disposition of secondary causes.’ See the absurdity of this opinion shown by the Scholastics and more recent metaphysicians and theologians in the topic on Providence, on the concourse of God with creatures. Let the consequences [of their position], by which they could be pressed, be these:

      1. That the concourse of God is not given, nor the motion of the first mover accommodated to the natures and properties of secondary causes, whether they are necessary or contingent.

      2. That there is not in created substances an intrinsic mover and a substantial principle of internal and proper motion: for the disposition of the mobile thing to motion from quantity, figure, position is not the activity or causality of the efficient cause, but only a required condition, and a cause sine qua non (‘without which nothing’).

      3. Consequently, since no mobile thing can move itself in potency to act or determine itself to motion, it remains that some external mover is to be sought which may lead the potency into act. But what will they give here? The Platonic-Virgilian soul of the world, or intelligences, or God, or atoms, or celestial globules. Here something will have to be said [by them].

V. It is to be seen lest the negation of proper qualities, which internally emanate from the form and substance of a thing (the negation of which follows the negation of forms, just as one error drags another), drive us into these absurdities:

      1. That created substances are the immediate principle of their own operation, since there are no active qualities by which substances operate as a means: which see shaken out by the metaphysicians and theologians when they treat of the simplicity of God and of the distinction of the divine attributes.

      2. That there are no qualities altogether, as neither of the second, or third, so also not of the first species; that is, there are no habits, against the common school of philosophers and theologians. I would like to see how those who deny natural faculties or powers will vindicate habits against the atheists, skeptics and infidels (the necessity of which Scripture and reason persuades), lest they be likewise shut up in that pentagon-workshop of motion, rest, quantity, position and figure.

VI. From this opinion it follows that no definitions of substances are given, since there are no forms or proper first and internal essentials from which the difference can be taken. How this may savor to the sons of the logicians of whatever sect, and to all acroamatic minds, and to the professors of whatever disciplines, they themselves will see.

VII. This absurdity also follows: That all created substances, even man himself (and why not angels and separate souls?), are beings per accidens [through accident], collective and aggregate: but not essences or natures, one per se [through itself]. So that no essence seems to be per se, except perhaps atoms, or ethereal globules, or insensible particles, or Platonic ideas (which he called αυτοάνθρωπον, αυτοίππον, etc.) or chimeras buzzing in the void, etc. But that man ought to be called a being and one per se, we will teach below.

VIII. It would follow that there are no proper and intrinsic faculties, nor are their principles in animals of another kind than in automata or Daedalean statues; and consequently the works of God and nature produced through creation or generation are essentially and univocally the same with works of art: which how it may agree well enough with Ps. 104:29; 7:14-15; Num. 16:22; 27:16; Heb. 11:9-10; Hab. 2:19, I confess I do not see the knot.

IX. It would follow that there is no generation or corruption of natural things. But more on this in Thesis 4 [below].

X. Since efficiency and motion, which is usually attributed to forms and their active qualities, is attributed to quantity and figure, it is to be seen lest young men at some time imprudently admit through consequence that magical axiom rejected by all Christian theology and philosophy: “There is some efficacy of quantity and figure, and it either per se or with others things concurs as an active principle of transmutation.”

— Gisbertus Voetius, ‘On the Natures of Things &amp; Substantial Forms’, pp. 369-76 in Select Theological Disputations, vol. 1, pt. 2 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), ‘On Creation’, pt. 8 Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COn+the+Natures+of+Things+%26+Substantial+Forms+1.+We+do+not+introduce+these+things+to+the+students+so+that+they+will+all+now+immediately+necessarily+believe+in+forms+with+their+appendices%2C+or+contend+tooth+and+nail+for+them%2C+but+so+that+they+may+at+least+for+a+time+abstain+from+a+peremptory+judgment+and+its+execution%2C+by+which+the+miserable+and+innocent+beings+are+cast+down+from+their+ancient+possession%2C+until+they+have+learned+thoroughly%2C+if+not+most+accurately%2C+at+least+moderately+the+philosophy+of+the+schools%2C+specifically+logic%2C+metaphysics%2C+physics+and+these+few+notes+which+we+subjoin%2C+having+been+solidly+determined%2C+and+they+see+that+they+are+satisfied+in+them.+However+they+will+finally+judge%2C+we+will+not+have+wasted+our+labor+if+in+the+meantime+we+will+have+recalled+them+from+a+fierce+contempt+and+flight+of+the+philosophical+study%2C+moreover+from+an+idiotic+rustic+and+proud+ignorance%2C+so+that+at+least+it+could+sometime+be+said+concerning+those+dissenting+elsewhere+what+is+boasted+among+the+Arabs%3A+A+wise+man+when+he+errs%2C+errs+with+learned+error.+Moreover+our+notes+are+threefold%3A+1.+Certain+prejudgments+which+I+%5Bapprovingly%5D+suggest+to+the+disputants.+2.+Reasons+for+forms%2C+which+are+to+be+clearly+solved.+3.+Reasons+against+forms+and+for+those+vicarious+accidents+which+certain+more+recent+%5Bmechanical%5D+authors+wish+to+be+substituted+for+forms%2C+which+forms+and+their+doubts%2C+with+their+principles+and+consequences%2C+are+fittingly+to+be+defended.+2.+The+notes+of+the+first+kind+are%3A+I.+Let+them+consider+whether+they+satisfy+themselves+in+the+reconciliation+of+this+opinion+%5Bof+forms%5D+with+sacred+scripture.+For+it+indeed+harmonizes+with+truth%3A+and+Christian+philosophers+will+profess+learned+ignorance+a+thousand+times+rather+than+that+they+bring+even+the+least+appearance+of+prejudice+to+divine+truth.+See+Gen.+1%3A11%2C+21-22%2C+24-25%3B+Prov.+30%3A24-27%2C+where+we+think+permanent+natures%2C+faculties+and+distinct+species+of+things+are+implied.+II.+It+is+to+be+seen+whether+from+the+denying+opinion+there+would+be+at+least+an+easier+lapse+than+from+the+affirming+into+doubt.+%5BPut+the+question+forth%3A%5D+Whether+there+are+any+substantial+forms+which+actuate+the+body+of+man+and+constitute+one+composite+with+it%3F+But+if+someone+denies+this%2C+and+substitutes+the+krasin+of+Galen%2C+or+a+particle+of+divine+breath+or+soul+of+the+world%2C+or+the+universal+intellect+of+Averroes%2C+or+the+mind+of+Plato%2C+thrust+into+the+workshop+of+the+body+as+a+genial+pipor+and+bound+to+it%2C+as+Prometheus+the+Caucasian%2C+if+someone+I+say+substitutes+such+a+thing%2C+by+what+reasons+would+you+more+successfully+and+safely+rebut+him+than+%5Bthose+by+which%5D+the+assertors+of+forms+%5Bdo%5D.+III.+It+is+to+be+seen+how+with+this+opinion+standing+the+distinction+between+the+being+of+substance+and+of+accident+can+be+conveniently+explained+and+defended.+For+there+would+be%2C+according+to+them%2C+no+substantial+difference+between+a+wolf%2C+a+sheep%2C+a+whale%2C+an+elephant%2C+a+serpent%2C+a+stone%2C+a+monk%E2%80%99s+hood%2C+aconite%2C+wheat%2C+the+sun%2C+the+moon%2C+the+earth%3B+add+also+a+clock%2C+the+wooden+Trojan+horse%2C+the+bronze+bull+of+Phalaris%2C+the+flying+dove+of+Archytas%2C+the+bronze+head+of+Pope+Sylvester%2C+the+speaking+statue+of+Albertus+Magnus%2C+a+house%2C+a+chair%2C+a+garment+etc.+But+perhaps+they+would+retort+that+those+substances+differ+essentially+through+those+five+accidents+motion%2C+rest%2C+position%2C+figure+and+quantity.+I+respond%3A+Granting+this+to+be+so+%28about+which+we+do+not+now+dispute%29%2C+the+difficulty+is+nevertheless+not+removed+by+this+escape.+It+nevertheless+remains+%5Bon+this+view%5D+that+substances+are+distinguished+from+substances+in+no+other+way+than+accidents+from+substances+and+accidents+among+themselves%2C+for+both+the+former+and+the+latter+are+distinguished+by+accidents.+IV.+It+is+to+be+seen+whether+from+here+there+is+not+an+easier+lapse%2C+when+someone+is+pressed+by+reasons+and+consequences+into+this+absurd+%5Boccasionalist%5D+opinion%3A+%E2%80%98Secondary+causes+endowed+with+their+own+causality+are+not+given%2C+but+only+the+first+and+universal+cause+acts+in+the+presence+and+disposition+of+secondary+causes.%E2%80%99+See+the+absurdity+of+this+opinion+shown+by+the+Scholastics+and+more+recent+metaphysicians+and+theologians+in+the+topic+on+Providence%2C+on+the+concourse+of+God+with+creatures.+Let+the+consequences+%5Bof+their+position%5D%2C+by+which+they+could+be+pressed%2C+be+these%3A+1.+That+the+concourse+of+God+is+not+given%2C+nor+the+motion+of+the+first+mover+accommodated+to+the+natures+and+properties+of+secondary+causes%2C+whether+they+are+necessary+or+contingent.+2.+That+there+is+not+in+created+substances+an+intrinsic+mover+and+a+substantial+principle+of+internal+and+proper+motion%3A+for+the+disposition+of+the+mobile+thing+to+motion+from+quantity%2C+figure%2C+position+is+not+the+activity+or+causality+of+the+efficient+cause%2C+but+only+a+required+condition%2C+and+a+cause+sine+qua+non+%28%E2%80%98without+which+nothing%E2%80%99%29.+3.+Consequently%2C+since+no+mobile+thing+can+move+itself+in+potency+to+act+or+determine+itself+to+motion%2C+it+remains+that+some+external+mover+is+to+be+sought+which+may+lead+the+potency+into+act.+But+what+will+they+give+here%3F+The+Platonic-Virgilian+soul+of+the+world%2C+or+intelligences%2C+or+God%2C+or+atoms%2C+or+celestial+globules.+Here+something+will+have+to+be+said+%5Bby+them%5D.+V.+It+is+to+be+seen+lest+the+negation+of+proper+qualities%2C+which+internally+emanate+from+the+form+and+substance+of+a+thing+%28the+negation+of+which+follows+the+negation+of+forms%2C+just+as+one+error+drags+another%29%2C+drive+us+into+these+absurdities%3A+1.+That+created+substances+are+the+immediate+principle+of+their+own+operation%2C+since+there+are+no+active+qualities+by+which+substances+operate+as+a+means%3A+which+see+shaken+out+by+the+metaphysicians+and+theologians+when+they+treat+of+the+simplicity+of+God+and+of+the+distinction+of+the+divine+attributes.+2.+That+there+are+no+qualities+altogether%2C+as+neither+of+the+second%2C+or+third%2C+so+also+not+of+the+first+species%3B+that+is%2C+there+are+no+habits%2C+against+the+common+school+of+philosophers+and+theologians.+I+would+like+to+see+how+those+who+deny+natural+faculties+or+powers+will+vindicate+habits+against+the+atheists%2C+skeptics+and+infidels+%28the+necessity+of+which+Scripture+and+reason+persuades%29%2C+lest+they+be+likewise+shut+up+in+that+pentagon-workshop+of+motion%2C+rest%2C+quantity%2C+position+and+figure.+VI.+From+this+opinion+it+follows+that+no+definitions+of+substances+are+given%2C+since+there+are+no+forms+or+proper+first+and+internal+essentials+from+which+the+difference+can+be+taken.+How+this+may+savor+to+the+sons+of+the+logicians+of+whatever+sect%2C+and+to+all+acroamatic+minds%2C+and+to+the+professors+of+whatever+disciplines%2C+they+themselves+will+see.+VII.+This+absurdity+also+follows%3A+That+all+created+substances%2C+even+man+himself+%28and+why+not+angels+and+separate+souls%3F%29%2C+are+beings+per+accidens+%5Bthrough+accident%5D%2C+collective+and+aggregate%3A+but+not+essences+or+natures%2C+one+per+se+%5Bthrough+itself%5D.+So+that+no+essence+seems+to+be+per+se%2C+except+perhaps+atoms%2C+or+ethereal+globules%2C+or+insensible+particles%2C+or+Platonic+ideas+%28which+he+called+%CE%B1%CF%85%CF%84%CE%BF%CE%AC%CE%BD%CE%B8%CF%81%CF%89%CF%80%CE%BF%CE%BD%2C+%CE%B1%CF%85%CF%84%CE%BF%CE%AF%CF%80%CF%80%CE%BF%CE%BD%2C+etc.%29+or+chimeras+buzzing+in+the+void%2C+etc.+But+that+man+ought+to+be+called+a+being+and+one+per+se%2C+we+will+teach+below.+VIII.+It+would+follow+that+there+are+no+proper+and+intrinsic+faculties%2C+nor+are+their+principles+in+animals+of+another+kind+than+in+automata+or+Daedalean+statues%3B+and+consequently+the+works+of+God+and+nature+produced+through+creation+or+generation+are+essentially+and+univocally+the+same+with+works+of+art%3A+which+how+it+may+agree+well+enough+with+Ps.+104%3A29%3B+7%3A14-15%3B+Num.+16%3A22%3B+27%3A16%3B+Heb.+11%3A9-10%3B+Hab.+2%3A19%2C+I+confess+I+do+not+see+the+knot.+IX.+It+would+follow+that+there+is+no+generation+or+corruption+of+natural+things.+But+more+on+this+in+Thesis+4+%5Bbelow%5D.+X.+Since+efficiency+and+motion%2C+which+is+usually+attributed+to+forms+and+their+active+qualities%2C+is+attributed+to+quantity+and+figure%2C+it+is+to+be+seen+lest+young+men+at+some+time+imprudently+admit+through+consequence+that+magical+axiom+rejected+by+all+Christian+theology+and+philosophy%3A+%E2%80%9CThere+is+some+efficacy+of+quantity+and+figure%2C+and+it+either+per+se+or+with+others+things+concurs+as+an+active+principle+of+transmutation.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+%E2%80%98On+the+Natures+of+Things+%26+Substantial+Forms%E2%80%99%2C+pp.+369-76+in+Select+Theological+Disputations%2C+vol.+1%2C+pt.+2+tr.+by+AI+by+Onku+%28Utrecht%3A+Johannes+a+Waesberg%2C+1648%29%2C+%E2%80%98On+Creation%E2%80%99%2C+pt.+8+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F17509e63f2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/17509e63f2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hylemorphism/#:~:text=On%20the%20Natures%20of%20Things,as%20an%20active%20principle%20of%20transmutation&amp;text=On%20the%20Natures%20of%20Things%20%26%20Substantial%20Forms&amp;text=things%20concurs%20as%20an%20active%20principle%20of%20transmutation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-a87c150997" data-kw="power ability">
<blockquote><p>The power of God is that ability and strength whereby he can bring to pass whatsoever he please, whatsoever his infinite wisdom can direct, and whatsoever the infinite purity of his will can resolve. Power, in the primary notion of it, doth not signify an act, but an ability to bring a thing into act. As God had an ability to create before he did create, he had power before he acted that power without.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Power of God</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/power.html">Power</a> › <a href="../topics/attributes-of-god/power/absolute-and-ordained-power.html">Absolute and ordained power</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ef4bec73dc" data-kw="will irresistible precept">
<blockquote><p>The decretive will relates to the futurition and the event of things and is the rule of God’s external acts; the preceptive is concerned with precepts and promises and is the rule of our action. The former cannot be resisted and is always fulfilled: “Who hath resisted his will?” (Rom. 9:19). The latter is often violated by men: “How often would I have gathered you together, and ye would not” (Mt. 23:37).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.15.2</span></figcaption>

</figure><figure class="quote" id="q-3906a14668" data-kw="foreknowledge contingents">
<blockquote><p>Do all things fall under the knowledge of God, both singulars and future contingencies? We affirm against Socinus. He knows all things perfectly, undividedly, distinctly and immutably. Perfectly because he knows all things by himself or by his essence. Undividedly, because he knows all things intuitively and noetically, not discursively and dianoetically.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.12.1–2</span></figcaption>

</figure><figure class="quote" id="q-ef49ade55e" data-kw="eternity perpetual">
<blockquote><p>Eternity is a perpetual duration, which hath neither beginning nor end. Time hath both. Those things we say are in time, that have beginning, grow up by degrees, have succession of parts. Eternity is contrary to time, and is therefore a permanent and immutable state, a perfect possession of life without any variation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Eternity of God</span></figcaption>

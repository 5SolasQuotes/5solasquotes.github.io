<main class="wrap"><figure class="quote" id="q-a6f298e8b6" data-kw="">
<blockquote><p>For the observance of the sabbath belonged to the moral law as to the requirement that rest be placed in God and sometimes freed for divine affairs by abstaining from other things; but it belonged to the ceremonial law as to the determination of the time.

Now, for them, the seventh day was determined because of the work of creation, which had as yet been surpassed by nothing worthier; for us, the first day, or the eighth, is determined because of the mystery of the resurrection, in which created nature was restored to something better: remember that you keep holy the sabbath day (Exod 20:8); take heed to your souls, and carry no burdens on the sabbath day (Jer 17:21). And as to moral precepts, that keeps his hands from doing any evil: I will wash my hands among the innocent (Ps 25[26]:6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expositio super Isaiam ad litteram</cite>, (c. 1252), C.56.n998.2-3.</span></figcaption>

<blockquote><p>49 Q. What reasons may be given of the Lord’s days beginning in the morning?

A. Other days then begin.

That they do so with us, is evident by the account of our hours. For midnight ended, we begin with one a clock: then the first hour of the day beginneth. And it appears to be so among the Jews: for when Aaron proclaimed (Exod. 32. 5, 6.) To morrow shall be a feast to the Lord, They rose up early on the morrow. I deny not but that sundry of the Jewish feasts began in the evening: as the Passover (Exod. 12.6.) But it cannot be proved that their weekly Sabbaths so began. There were special reasons for the beginning of those feasts in the evening, which did then begin. As for the supposed beginnings of the first days gathered out of this phrase, (the evening and the morning were the first day) they cannot be necessarily concluded to be at evening. For the evening and the morning there importeth the moment of the evening and morning parting one from another, and the return to the same period: which moment is rather at the beginning of the morning then of evening. The evening useth to be referred to the end of the day, and the morning to the beginning, as Exod. 29. 38, 39. I. Sam. 17. 16. and 30.12. Joh. 20.19.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s sanctification</cite>, (London, 1641), p. 25.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>3. Labour or pains for the enjoyment of the benefit and advantage of the solemn assemblies of the church, and in them of the appointed worship of God, is so far from entrenching on the rest of this day that it belongs unto its due observance. A mere bodily rest is no part of religious worship in itself; nor does it belong unto the sanctification of this day any farther than as it is a means for the due performance of the other duties belonging to it. We have no bounds under the gospel for a Sabbath-day’s journey, provided it be for Sabbath ends. In brief, all pains or labour that our station and condition in this world, that our troubles which may befall us, or any thing else, make necessary, as that without which we cannot enjoy the solemn ends and uses of this holy day of rest, are no way inconsistent with the due observance of it. It may be the lot of one man to take so much pains and to travel so far for, and in the due celebration of the Lord’s day, as if another should do the like without his occasions and circumstances, it would be a profanation of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, (d. 1683), vol. 1 (of 4), p. 749</span></figcaption>

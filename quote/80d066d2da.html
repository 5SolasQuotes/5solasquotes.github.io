<main class="wrap"><figure class="quote" id="q-80d066d2da" data-kw="">
<blockquote><p>The British Baptists held to a high view of the magistrate and followed largely in the Magisterial Protestant tradition in terms of constitutional monarchy, the two kingdoms, and, to varying degree, the magistrate’s care of religion… the English Baptist theologian John Gill exemplifes this political perspective. Judging from his statements about the duties of a magistrate, that include securing right religious worship in the commonwealth and enforcing virtue using the two tables of the Decalogue, it is apparent that Gill would not have agreed with Jeferson’s wall of separation, nor with the Baptists who followed him. The “frst care of government” is of divine things. Though the Second London Confession does not stipulate the magistrate’s responsibility for care of religion, it does not argue against it, and so Gill is not in violation of this doctrinal standard for maintaining this view held by the Magisterial Reformers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ian-clary.html">Ian Clary</a></span><span class="wk"><span class="lbl">Work:</span> <cite>”The First Care of Government’: John Gill on the Magistrate &amp; the Church’ The Hanover Review (2024), pp. 4-23</cite>, p. 23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

nline · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d34c7ca491" data-kw="">
<blockquote><p>…obstinate heretics… scandalous and incorrigible sinners, after one and another admonition are suspended from the use of the sacraments and if they persevere in their contumacy and rebellion, they are ejected from the church, so that it is not lawful for them to join with believers in the exercise of piety. This ought not to be extended to political society… or other things due and necessary from our vocation in the economic or political state, as the Romanists wish; as if wives should be prohibited from their husbands, children from parents, servants from masters, subjects from rendering obedience to excommunicated princes, to which they are bound by the law of nature. For excommunication cannot sever the natural and moral bonds by which men are mutually held together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, vol. 3, 18th Topic, ‘The Church’, 32nd Question, ‘Ecclesiastical Discipline and Excommunication’, section V</cite>, p. 294</span></figcaption>

<blockquote><p>1. We do not question the duty of obeying the king and all his officers, governing as magistrates by the power of the swords which the king may commit to them. If bishops or lay-chancellors be made magistrates, we will obey them as such: And therefore when they summon us, we appear and answer, because the king authorizes them. And many non-conformists have defended the taking the promise [of canonical obedience to a bishop or ordinary in things lawful and honest] as supposing that the word ‘ordinary’ signifies only the judge of a court set up by the king as supreme governor by the sword in matters and over persons ecclesiastical as well as civil, according to the true sense of the Oath of Supremacy.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-420b76fc28" data-kw="">
<blockquote><p>But besides the morning and evening sacrifice, which the duty of every day requires, the wisdom of God, for the preserving and securing of divine worship in the world, has instituted and appointed a particular time for the special solemnities of it, which is one day in seven. The body of a seventh day, that is, the working hours of it, are by this institution appointed to be spent in the acts of religion and devotion, as the other days of the week are intended for secular business, and the works of our particular calling.

Now this instrumental part of religion (give me leave to call it so), though it be not equally necessary with the essentials of it—the love of God, and faith in Christ—yet it is undoubtedly necessary, both as a duty in obedience to the divine law, which requires us thus to consecrate a seventh day to the services of religion, and as a means of keeping up communion with God in holy ordinances, and preparing ourselves, by His grace, for the vision and fruition of Him. It is so necessary, that revealed religion, and with it all religion, would in all probability have been lost and forgotten long ere this if it had not been kept up by the observation of Sabbaths.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath: A Serious Address to those that Profane the Lord’s Day</cite>, (1713; Grand Rapids MI: Torwood Press, 2013), pp 5-6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b06d50b6f0" data-kw="">
<blockquote><p>And Elijah came unto all the people, and said: How long halt ye between two opinions? If the Lord be God, follow him; but if Baal, then follow him: and the people answered him not a word.

Observe the Prophet’s courage: he feared neither Ahab’s greatness, nor the peoples number: but he came unto all the people, and said, How long halt ye, &amp;c. Why are you thus irresolute, and inconstant? Why do ye fluctuate and waver thus? The Hebrew word that is here translated halt, signifieth (as some observe) a lameness on both feet, and it is the same that is used 2 Sam. 4.4. to express Mephibosheth his lameness, who was lame on both feet. Jacob had but one side lame, and another word is used to signify his lameness, Gen. 32.31. These Idolaters were lame on both feet. Hereunto the Septuagint agreeth.

They had never a good foot, they divided between God, and Baal, they served neither cordially. They halted between two opinions, as it is expressed in the Text, or between two thoughts, as it may be read; probably the false Prophets had corrupted their judgements by their false Doctrine. Error in opinion causeth halting in practise. It is evident that they halted practically. How long halt ye? they had for a long time continued in their halting, which made their sin the greater, and the cure the more difficult. Frustra medicina paratur, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-salwey.html">Arthur Salwey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Halting stigmatized in a sermon preached to the Honorable House of Commons on the monthly fast day, Octob. 25. 1643. at Margaret’s Westminster</cite>, (London: Christopher Meredith, 1644), pp 3-4.</span></figcaption>

<blockquote><p>We profess a difference between ourselves and the unrenewed, as radical as that between light and darkness, almost as wide as that between heaven and hell. But in all the visible and practical concerns which interest the unrenewed heart, we nearly resemble them. Our words say that we believe riches to be vanity and emptiness. Our acts seem to say that we love and seek them as intensely as those do who make them their all and their god. We say in words that ‘we have here no continuing city,’ but in act are as eager to adorn our dwellings here as though they were our only home…</p></blockquote>

</figure><figure class="quote" id="q-27e7cc0633" data-kw="">
<blockquote><p>The question is not whether reason is the instrument by which or the medium through which we can be drawn to faith. For we acknowledge that reason can be both: the former indeed always and everywhere; the later with regard to presupposed articles. Rather the question is whether it is the first principle from which the doctrines of faith are proved; or the foundation upon which they are built, so that we must hold to be false in things of faith what the nature light or human reason cannot comprehend. This we deny. . . . If reason is the principle of faith, then first it would follow that all religion is natural and demonstrable by natural reason and natural light. Thus nature and grace, natural and supernatural revelation would be confounded. . . . A ministerial and organic relation is quite different from a principial and despotic. . . . We must observe the distinction between an instrument of faith and the foundation of faith. . . . The Lutherans falsely object to us that we hold reason to be the principle and rule of demonstration in controversies because we sometimes draw arguments from reason, and argue from reason against the ubiquity of Christ’s body. For we assign to reason only a ministerial and instrumental, not a principal office. And if, in compound questions, we use reason for the purpose of proof, it bears the relation not of a principle but of means from which theologian argues; and the are not with us primary arguments, but only secondary and auxiliary forces. Besides, while theologian uses arguments drawn from reason, he does it rather as a philosopher rather than as a theologian. As to the ubiquity of the body of Christ, we reject this doctrine both philosophically and theologically, because it is absurd and contradicts the first principles of theology and philosophy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.8.4, 5, 6, 24</span></figcaption>

<main class="wrap"><figure class="quote" id="q-179a785f18" data-kw="">
<blockquote><p>Ma. What meaneth this word, Sabbath?

Sch. Sabbath by interpretation signifieth rest. And that day (for that it is appointed only for the worshipping of God) the godly must lay aside all worldly business, that they may the more diligently intent to Religion and Godliness.

Ma. Why hath God set herein before us an example of Himself, for us to follow.

Sch. Because notable and noble examples do more thoroughly stir up and sharpen men’s minds. For Servants do willingly follow their Masters, and Children their Parents. And nothing is more to be desired of men, than to frame themselves to the example and following of God.

Ma. After what manner is the Sabbath day to be kept holy?

Sch. The people must assemble together, to hear the doctrine of Christ, to yield confession of their faith, to make public prayers to God, to keep the memory of God’s works, and to render thanks unto him for his benefits, and to celebrate the holy Sacraments which he hath left us.

Ma. Is there no more required of us for the keeping holy of the Sabbath day?

Sch. This is the outward rest and keeping holy of the Sabbath day; besides the which, there is a spiritual rest and sanctifying of it.

Ma. What is that?

Sch. That is, when resting from worldy business, and from our own works and studies, we yield our selves wholly to God’s governance, that he may do his works in us; and when (as the Scripture termeth it) we crucify our flesh, we bridle the forward desires and motions of our heart, restraining our own nature, that we may obey the will of God, for thus doing, our Sabbath day here upon earth, shall most aptly express a figure and likeness of eternal &amp; most holy Rest, which we shall forever enjoy in Heaven.

Ma. Shall it be enough to have done those things every seventh day?

Sch. These things indeed every man privately ought to record and think upon every day: But for our negligence and weakness sake, one certain special day is by public order appointed for this matter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-nowell.html">Alexander Nowell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechism, or Instruction of Christian Religion, to be learned of all youth, next after the little Catechism: Appointed in the Book of Common Prayer</cite>, (London: John Day, 1572), unpaginated.</span></figcaption>

<blockquote><p>Here by “schoolmaster” understand one that teaches little children or [minors] the first rudiments or elements, A, B, C. And the law is “a schoolmaster to Christ,” for two causes. One, because it points out and shadows forth unto us Christ by bodily rudiments of ceremonies and sacrifices. The second is because the law, specially the moral law, urges and compels men to go to Christ. For it shows us our sins, and that without remedy. It shows us the damnation that is due unto us. And by this means, it makes us despair of salvation in respect of ourselves. And thus it enforces us to seek for help out of ourselves in Christ. The law is then our schoolmaster not by the plain teaching, but by stripes and correction. In this verse, Paul sets down the manner and way of our salvation, which is on this manner: first, the law prepares us by humbling us; then comes the gospel, and it stirs up faith. And faith wrought in the heart apprehends Christ for justification, sanctification, and glorification. Paul sets this forth by a fit similitude. They that would be the servants and children of God must come into the school of God and be taught of Him. In this school are two forms and two masters. In the first form, the teacher and master is the law. And he teaches men to know their sin and their deserved damnation, and he causes us to despair of our salvation in respect of ourselves. And when men have been well schooled by the law and are brought to acknowledge their sins and that they are slaves of sin and Satan, then must they be taken up to a higher form and be taught by another schoolmaster, which is faith or the gospel. The lesson of the gospel is that men after they are humbled must fly to the throne of grace, believe in Christ, and with all their hearts turn unto God that they may be justified and glorified. When we have by the teaching of this second master learned this good lesson, we are become children and servants of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 204–05.</span></figcaption>

<blockquote><p>The silence of scripture about the observance of Sabbath in antediluvian and patriarchal times, conjoined with the expressions God gave Israel His Sabbath, and such like, are not sufficient to set aside a plain assertion of inspired history, although unsupported by other evidence. But in conjoining the institution of Sabbath with the finishing of creation, the inspired penman is borne out by other facts and arguments.

The reason why Sabbath was instituted, is one of these: the inspired penman tells us, that God blessed the seventh day and sanctified it, because that on it God had rested from all His work which He had created and made. The reason why the Sabbath was appointed, thus existed in full force from the beginning.

Now, is it not most improbable, that an institution should be first appointed to commemorate a fact two thousand years after it had taken place? Is it not more reasonable to suppose, that the fact, and the institution founded upon the fact, were coeval in time, and are conjoined in this narrative, because they were so? This conclusion seems to be established beyond all controversy, by the fact, that time was measured from the beginning, by weeks of seven days, which could only arise from the Sabbath being instituted at the period we have asserted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-white.html">William White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Three Sermons on the Sabbath, Preached in September 1838</cite>, (Haddington: Neill &amp; Sons, 1838), p. 7.</span></figcaption>

<blockquote><p>1. The word ‘church’ [say the Independents] signifies always a gathered together church, or such as may gather together, Acts 11:26, a whole year they assembled with the Church, Acts 20:7, the disciples came together to break bread; so Acts 1:10; 2:44,46; Acts 5:12; 15:25. [Rutherford’s] Answer: [1.] Our brother Mr. [George] Gillespie (Assertion of the Government of the Church of Scotland, pt. 2, ch. 3, p. 141-42) says many interpreters expound [in Greek], ‘they were together’, that is, of one accord in love and amity: and also [physical] churches not being builded, and they meeting in private houses, as in Mary’s house, Acts 12, school of Tyrranus, Acts 19:9, in an upper chamber, Acts 20:8, Paul’s lodging at Rome, Acts 28:13. What private houses (Acts 10:9) could ordinarily contain so many thousands?

2. The Scripture speaks so [as] to give us an example of the public meeting for public worship where it is not needful that all met in one place collectively; it is enough they meet all distributively.

3. Neither does the word ‘church’ always signify a meeting of one single congregation, as Acts 12:5; prayers were made [for Peter in jail] by the church, that is by all professors [throughout Jerusalem]. Herod vexed the church, Acts 8:3. Saul made havoc of the church; ‘I persecuted the Church.’ (1 Cor. 15:9) There is no necessity to expound these of people meeting ordinarily to worship God; for Herod and Saul persecuted all, whither apostles or professors in houses, not respecting their meeting in one place; Also [that] it shall follow that prayers were not made in private, but only in the church, that is, in the convened congregation for Peter, which is absurd: And that they were a visible-church is clear, else Herod and Saul could not persecute them.</p></blockquote>

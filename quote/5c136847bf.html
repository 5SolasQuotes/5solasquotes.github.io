<blockquote><p>VI. That our very concupiscence and corruption of nature is a sin.

But if by God’s law be condemned whatsoever offence is repugnant to that first image of God, that is, to justice, holiness, and righteousness, wherein man was created, we hold that in man not only his actions committed with consent of his will against the law of God, but even the motions also of lust, yea, the concupiscence it self and the whole corruption of his nature is sin and by the law of God condemned, because it is repugnant to that uprightness and justice wherein man was created and wherein he ought and might have kept himself, if he would.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), X.VI, 1: 193.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

<blockquote><p>Q. What are the degrees of Concupiscence forbidden here?

A. The first is, wandering and evil thoughts, though we never like of them: for even the very rising of such thoughts in our minds, argueth our corruption of nature: for were it not for that inborn corruption, such thoughts could not once enter into our souls, further then they were offered unto us by some outward tentation of the devil, or of the world, as it was unto our Saviour Christ.

And although in the incorrupt state of man, he might dutifully have thought of the transgression of the Commandment, with a perfect hatred of it; yet the same should not have been (as now it is) suddenly rising in the mind, without thinking or meditation of the naughtiness and hatefulness thereof; where now these thoughts rise suddenly, and the hatred and detestation cometh after, and is not in such perfection as then it should have been. Whereas the Lord our God hath the eyes of his glory so pure, that he will not allow of the least corruption in the temple of our hearts, where he seateth himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or, the whole body and substance of divinity</cite>, (2nd edn, London: Thomas Man, 1616), pp 160-61.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

<blockquote><p>Maybe you say they are mild sins. But the Lord says: They are answerable to the fire of hell.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition on Ps. 129</cite>, (130):5</span></figcaption>

</figure><figure class="quote" id="q-a706c93de0" data-kw="">
<blockquote><p>And this also lies in it as it is enmity, that every part and parcel of it, if we may so speak, the least degree of it that can possibly remain in any one, whilst and where there is any thing of its nature, is enmity still. It may not be so effectual and powerful in operation as where it has more life and vigor, but it is enmity still. As every drop of poison is poison, and will infect, and every spark of fire is fire, and will burn; so is every thing of the law of sin, the last, the least of it, — it is enmity, it will poison, it will burn. That which is any thing in the abstract is still so whilst it has any being at all. Our apostle, who may well be supposed to have made as great a progress in the subduing of it as any one on the earth, yet after all cries out for deliverance, as from an irreconcilable enemy, Rom. 7:24. The meanest acting, the meanest and most imperceptible working of it, is the acting and working of enmity. Mortification abates of its force, but does not change its nature. Grace changeth the nature of man, but nothing can change the nature of sin. Whatever effect be wrought upon it, there is no effect wrought in it, but that it is enmity still, sin still.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nature, Power, Deceit &amp; Prevelancy of the Remainders of Indwelling Sin in Believers</cite>, ch. 4</span></figcaption>

<blockquote><p>The Jesuit, whose aim is to involve everything, almost never distinguishes, nor explains ambiguous terms, which is nevertheless necessary for him who wishes to proceed in right order in teaching, or disputing. The name of concupiscence here does not signify that natural faculty of desiring as such, or the concupiscible power, as they call it, implanted in the soul by God Himself, to whom injury would be done, if it in itself and as such, were considered a vice, since He is the author of all the faculties and powers of the soul, which pertain to the constitution of nature, apart from the reason of corruption which has been added. Nor also under the name of vicious concupiscence do we understand all the movements and actions of that power [of concupiscence simply], because many are in themselves considered, or in their own kind, good; many indifferent: nor do we deny that that faculty of desiring goods, even sensible ones, was in Adam, in the state of innocence. It is also certain that we are not dealing with spiritual concupiscence, which the apostle mentions saying, “the Spirit desires against the flesh.” For natural concupiscence, when it is carried to the due object and in the due manner, is from God, much more spiritual, which tends to heavenly things. The question is therefore about concupiscence which the Spirit of God calls carnal, indeed flesh [e.g. in Rom. 8].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Catholic Opposite the Papist Catholic</cite>, (1630), Question 14, ‘On Concupiscence’, pp. 2-3 trans. AI</span></figcaption>

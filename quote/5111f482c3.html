<main class="wrap"><figure class="quote" id="q-5111f482c3" data-kw="">
<blockquote><p>The Law of Nature, as it is impressed upon our hearts, so in the goodness of God, it is expressed in his Word, wherein He has not only holden forth these Sacred Mysteries, which could only be known by Revelation, as having no principles in Nature from whence they are deducible, but also, because through sin and evil custom, the Natural Law in man’s heart was much defaced, disordered and erroneously deduced: He has therefore reprinted the Law of Nature in a viver [more vivid and lively] character, in the Scripture, not only having the moral principles, but many conclusions thence flowing particularly set forth. This analogy of the Law of Nature even in the heats of heathens and as it is set down in the Law of God evidences sufficiently, that both of them proceed from the same Omniscient Author.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/viscount-of-stair-james-dalrymple.html">Viscount of Stair James Dalrymple</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Institutions of the Law of Scotland, vol. 1</cite>, p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-057c8549ea" data-kw="">
<blockquote><p>Besides the moral law, God gave to Israel ceremonial and judicial laws; the two latter are of limited and temporary use; the former is of universal and perpetual obilgation. … 2. The judicial law respected the Jews in their political capacity, or as a nation, and consisted of those institutions which God prescribed to them for their civil government. This law, as far as the Jewish polity was peculiar, has also been entirely abolished; but as far as it contains any statute founded in the law of nature common to all nations, it is still obligatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-shaw.html">Robert Shaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Confession of Faith, 19.4</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-4d1d3a3eeb" data-kw="">
<blockquote><p>What is the Theft of Persons?

It is a heinous sin punished by the Law of God with death: (Exod. 21. 16. Deut. 24. 7.) being so much worse than the theft of goods, as the persons of men are better than they. Mat. 6. 25. And this is committed by such as steal men or children, to sell them for slaves; and by lustful or covetous wooers, who steal men’s daughters to make them their wives.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity: or, The Sum and Substance of Christian Religion</cite>, ed. Michael Nevarr (1648; Herndon VA: Solid Ground Christian Books, 2007), p. 266.</span></figcaption>

<blockquote><p>Cap. 29. He [Thomas Hobbes] is angry with those who say, [That every private man hath a property in his goods.] Among the Turks [Muslims] indeed no private man hath any property at all; under Christian Princes private men live more happily, who enjoy a property, yet not simply absolute, if we consider that the Prince hath a right to our goods in cases of necessity, as in his own, and Country’s defence, and such like cases, in this regard no man is born for himself, nor hath any man an absolute property in his own life, which he ought when occasion urgeth, lay down for his Country: Dulce &amp; decorum pro patria mori; therefore Plato saith well, That our Country requires a share in our birth; the property then of the subject excludeth not the Princes right in cases of necessity, but only his arbitrary power.</p></blockquote>

</figure><figure class="quote" id="q-d27615bfc7" data-kw="">
<blockquote><p>And hereunto divines and casuists give their concurrence; among them one that is resolute both for monarchy and lineal succession [of royalty], thus expresses his judgment, both for seeking of right and justice from a usurper (whom he calls a tyrant, in regard of an unjust title, not in respect of tyranical oppression [only]) and for obeying his commands. First, that subjects may lawfully seek justice of him…¹ ¹ ‘Dicendum est, licite subditos ab eo (qui•y rannus jure et titulo est) jus petere, quia quamvis jus et titulum non habeat, respublica tamen tacite consemit in hoc ut civibus ipsi tyranno, facto, non jure subditis, jus dicat, ac si esset competens judex et legitimus superior’… Juan Azor, Moral Institutions [d. 1603; Hierat, 1608], pt. 2, bk. 11, ch. 5 [col. 1675]. ‘Non peceat subditus tyranni, qui dominium et jurisdictionem alicujus di•ionis usurpavit, petendo ab eo justitiae administrationem, etc. Si quidem dat operem ut qui pe••at jurisdictionem usurpando, non peccet etiam justitiae administrationem praetermittendo;’ Martin de Azpilcueta Navarro, Manual de Confessores [c. 1557], ch. 1•, n. 41.</p></blockquote>

</figure><figure class="quote" id="q-e5e5c0a235" data-kw="">
<blockquote><p>It has sometimes been argued that George Gillespie modified his strongly theonomic views in Wholesome severity reconciled with Christian liberty (1644/5) when he wrote his famous work Aaron’s rod blossoming (1646). This assumption is based on an aside comment in the opening chapter of the latter book, where he merely expresses sympathy with those who hold that the penal sanctions of the Mosaic judicials remain valid (posted here). On its own, this is a very weak basis upon which to build a thesis of radical discontinuity in the thought of George Gillespie. It is, however, fundamentally refuted by a close examination of the main text of Aaron’s rod blossoming. In it, Gillespie states that the capital punishments are part of the law of nature and are common to all nations. Thus they are in no way abrogated in the New Testament:

As touching the capital punishment of malefactors by the hand of the magistrate, it being founded upon the very law of nature, and common to all nations without as well as within the church (so that very often those from whom a malefactor is cut off are not so much as by profession the church and people of God), it cannot so fitly resemble the separation of casting out of a man from having part or portion of the inheritance of the saints in light.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s rod blossoming; or, the divine ordinance of church government vindicated</cite>, (1646; Edinburgh, 1844), p. 29.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-1d8c041065" data-kw="">
<blockquote><p>Some have upon these words made a question whether it be lawful for the husband or the wife separated for adultery to marry again while each other lives. As to the party offending, it may be a question; but as to the innocent person offended, it is no question, for the adultery of the person offending has dissolved the knot of marriage by the Divine law. It is true that the knot cannot be dissolved without the freedom of both persons each from another, but yet it seemeth against reason that both persons should have the like liberty to a second marriage. For:

1. The adulteress is by God’s law a dead woman, and so in no capacity to a second marriage.

2. It is unreasonable that she should make an advantage of her own sin and error.

3. This might be the occasion of adultery, to give a wicked person a legal liberty to satisfy an extravagant lust. But for the innocent person, it is as unreasonable that he or she should be punished for the sin of another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11</cite>, ch. 19, v. 9</span></figcaption>

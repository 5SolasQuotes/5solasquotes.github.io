<blockquote><p>If we consider the position of the Christian man we can have no difficulty admitting that Christ has a right to rule over him, for he is Christ’s by the right of creation, of the Father’s covenant gift, of redemption, and of the new creation. And in this case, as in all other cases, the authority is over the whole man without any limitation or modification whatsoever. The man is literally not his own – his own master or his own property. Above him and around him, to meet him in every upward and outward movement of his life, there are the union, was called non-essential, and that is now treated as non-existent. Thus there is a species of unity secured, but it is a unity with diminished attachment to the Saviour’s truth. Probably this thought about non-essential doctrines is connected in men’s minds or in their professions with the intention of advancing more effectually some doctrine or principle that is called essential. But Christ does not require any individual under heaven to let go one doctrine of the Christian system in order the better to promote the acceptance of another. It is not true thought but sentimental blundering that makes any one suppose such a thing possible. And it is not true morality or true obedience which can call any part of Christ’s truth non-essential: it is disobedience and immorality.

The folly of it and the presumption of it can be discerned at once if we lay it bare by simply supposing the sinner presenting the distinction to Christ Himself. Christ gives His word, and says to the sinner, “This is My will. If a man love Me he will keep My words.” And the sinner replies, “Yes, Lord, this is Thy word, I admit; but there are many things in it that I need not profess or hold; there are doctrines that will greatly hinder Evangelistic work; they are not essential. I will hold all the essential doctrines, and it will be far better to say nothing at all about the rest; Thy work will go on much more successfully if I select the most popular doctrines and so avoid exciting prejudice.” We can hardly suppose any man daring enough to speak to Christ in this way. And yet precisely in this way, though, of course, in a different form, many a man speaks of Christ’s truth to his fellow-men, and they agree among themselves to the deliberate mutilation of that body of truth which the Saviour authoritatively reveals, and which He has commanded His servants to maintain and defend even unto death.

He has revealed no truth that is not essential for His purpose; and His purpose in giving the truth must be our purpose in receiving and professing it. There is not a trace of hint or suggestion in His Word itself that any man in any age of the world may for any purpose profess and maintain one truth less than Christ has revealed. Such a hint would be on Christ’s part the virtual renunciation of His authority. And no man can adopt such a distinction among the doctrines of Christ without first renouncing Christ’s authority in general, and then renouncing the authority that is behind the particular doctrines rejected. Christ requires authoritatively the acceptance and maintenance of all the doctrines of His revealed will, and all His authority is in every single doctrine. The duty of every individual Christian is to listen reverently to every word that Christ speaks, to learn, and to obey.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The authority of Christ over the individual, the church, and the</cite>, nation (Belfast, 1893), pp 9-10.</span></figcaption>

<blockquote><p>Now it is certain that in the Law there is prescribed to men a rule by which they ought to regulate their life, so as to obtain salvation in the sight of God. That the Law can do nothing else than condemn, and is therefore called the doctrine of death, and is said by Paul to increase transgressions, (Rom. 7:13,) arises not from any fault of its doctrine, but because it is impossible for us to perform what it enjoins. Therefore, though no man is justified by the Law, yet the Law itself contains the highest righteousness, because it does not falsely hold out salvation to its followers, if any one fully observed all that it commands. Nor ought we to look upon this as a strange manner of teaching, that God first demands the righteousness of works, and next offers a gratuitous righteousness without works; for it is necessary that men should be convinced of their righteous condemnation, that they may betake themselves to the mercy of God. Accordingly, Paul (Rom. 10:5, 6) compares both kinds of righteousness, in order to inform us that the reason why we are freely justified by God is, that we have no righteousness of our own. Now Christ in this reply accommodated himself to the lawyer, and attended to the nature of his question; for he had inquired not how salvation must be sought, but by what works it must be obtained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, trans. William Pringle, (repr. Bellingham, WA: Logos Bible Software, 2010), 3.56–57.</span></figcaption>

<blockquote><p>What is desired ceases to be beautiful to the extent that it is desired. The starry heaven is unspeakably beautiful, said Schopenhauer, because it is desired by no one. Beauty delights us not because it is profitable to us. Our delight in beauty is entirely disinterested. Beauty awakens the kind of movement within our faculty of desiring that creates enjoyment in pure, disinterested, beholding, whether such beholding is physical or spiritual. Truth satisfies our understanding. The good fulfills our desires and awakens our love. Beauty provides rest and delight. Materially and objectively they are one. The true, the good, and the beautiful form one unbreakable triad. All that is, in the same measure that it is, is also true, good and beautiful. This unity can disintegrate only temporarily, in this world of disharmonies… Nonetheless, these three are materially one… The true, the good, and the beautiful differ only formally, insofar as the same thing exists in a varied relationship to the rich organization of our spirit. After all, God Himself is also the truth, the holy [good], and the glory [beautiful].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 157-66 of ch. 7, H. ‘Conscience &amp; the Idea of Beauty’ in Foundations of Psychology trans. Born, Kloosterman &amp; Bolt 2nd ed. (1897; 1921), p. 165</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>Also this power is given to certain ends: and if it be used against those ends, so that either the ends or that means must be forsaken, it is easy to see that it is means and not the ends. For the means are not always the same, God having [a] store [of means] if any one fail. Especially the means is of positive morality and the ends [are] of natural morality: For when two duties come together, and both cannot be chosen, the choosing of the less (which must give place to the greater) is a sin: and positives are less (caeteris paribus [all things being equal]) than naturals: And the substantials of positives [are] more necessary than the circumstantials:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653), ‘Objections Answered’, pp. 83-84</span></figcaption>

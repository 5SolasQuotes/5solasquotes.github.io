<main class="wrap"><figure class="quote" id="q-0730397c08" data-kw="">
<blockquote><p>The fifth position that I lay down is, that the duty of the state thus to recognise, and, in so far as circumstances permit, to endow the Church, is undeniably countenanced by the whole tenor of Scripture.

It is a striking fact, in confirmation of the views already laid down, that the only form of civil polity ever framed and established by God Himself should stand markedly in connection with the Church of God; and that although many of the circumstances attending the alliance of Church and state among the Jews were peculiar to that people, yet the alliance itself cannot be regarded as ceremonial or peculiar, but must be held as intimating the Divine will as to the lawfulness of such a connection.

Add to this fact that, beyond the case of the Jews, we have express examples in Scripture of the countenance given by pecuniary support, and otherwise, to the Church of God by heathen magistrates, and the deed so done sanctioned by the approbation of God. Still further, this evidence of the Divine sanction given to the support and recognition of the Church by the state might be very greatly augmented by a consideration of those predictions in regard to the future or millennial state of the Church, in which kings and kingdoms are especially represented as in the latter days bringing their gold and their honour unto it, and becoming the great instruments of promoting its spiritual interests.

Nor is the doctrine of the duty of the state to recognise and aid the Church invalidated by the absence of an express command in the New Testament Scriptures, confirmatory of the duty as announced in the Old. On the contrary, the absence of an express prohibition repealing the law, and superseding the principles acted on in Old Testament times, is the strongest of all evidence that the doctrine and duty remain the same as before. The circumstances are sufficient to account for the absence of any express precept there, bearing on the duty of the civil magistrate to countenance and endow the Christian society.

But the circumstances of the primitive Church will not account for the absence of an express prohibition repealing the law of the Old Testament on the subject, had that law been really intended to be superseded or set aside as regards the Christian Church. The very fact of the total silence of the New Testament in regard to any such repeal is, in the circumstances, the strongest confirmation of the express countenance given in the Old to the right and duty of the state to enter into friendly alliance with the Church.

The testimony of Scripture, then, seems to be decisive of the question, and rightly to shut up the whole argument. If, as we have endeavoured to demonstrate, the state is a moral agent, responsible directly to God; if, in virtue of that responsibility, the state be bound, like every other agent in his own place, to receive and submit to the revealed will of God, when made known to it; if the state, by a regard to its own existence and welfare, is imperatively called upon to promote the religious interests of its subjects; if, by a regard to the Church, as the ordinance of God, the state lie under an obligation, in so far as is in its power, to advance its wellbeing, the inference would seem unavoidable, that it is the duty of the state to seek a friendly alliance with the Church.

It is not possible to avoid this conclusion, unless there can be produced, in contradiction to all such arguments, an express prohibition of God forbidding such an alliance as incompetent, and explicitly exempting the state from the duty that otherwise would lie upon it. But instead of any such exception being made in the case of the state, as alone of all the creatures of God exempted from allegiance to Him, and licensed to disown Him, instead of any such prohibition laid upon the civil governments of the world, forbidding them to do what all else are commanded to do, to bring their homage and help to the Church of Christ,–we find the very opposite to be the case.

We find the whole tenor of Scripture bearing testimony to the duty and responsibility of the state in the matter, and lending not a contradiction but a confirmation to the dictates of nature and reason, which declare that nations and communities, like the individuals that compose them, are the subjects of Christ, and as such bound to bring their honour and glory to His Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, ed. D. Douglas Bannerman (2 vols, Edinburgh: T &amp; T Clark, 1868), 1: 133-35.</span></figcaption>

<blockquote><p>4. the king’s power is accumulative [Rom. 13:4], in giving to the Church, and aiding and helping; God has given to the king the Ten Commandments, and the Gospel, as a pupil is given to a tutor: The King holds his sword above the Law of God, to ward off the strokes of wicked men who do hurt the Law; but the king’s power is not privative, to take any privilege from the Law and the Church: so his power is as a tutor to keep, not as a father who may both give and take away from his son the inheritance; his power is defensive, not offensive.</p></blockquote>

<blockquote><p>…the King has sufficient power to oppose wasters of his kingdom and to require homage of his subjects. Suppose he have not an unlimited power to forbid these of other nations and Churches, and his own, to go to a synod, within or without his nation, for the settling of the Churches in necessary peace and truth, if the Churches must seek liberty and counsel for their souls good, and edification: nor has he any lawful power from God to hinder his own subjects to send commissioners to sound and godly synods for counsel and synodical light, more than Jeroboam could lawfully forbid the people to go and worship at Jerusalem, upon pretense that they might be persuaded to cleave to Rehoboam their lawful prince, and waste his new kingdom: nor hath the prince an unlimited and absolute power to exact such absolute homage of his people; nor such a power over their moving from place: ([Margin note:] The Lord of Life has principally in the First Table laid a law upon our locomotive, and all our actings, to honor and love Him first, and the prince only secondarily and subordinately to God; if God charge us first to go to public meetings to honor Him, the Prince under pretense of peace cannot forbid the people to go up to Jerusalem to worship; we are to obey God rather than man.) for so the [claimed] Church Independent of Jerusalem consisting of ten thousand, if not more, should have no intrinsic power to meet for the public worship of God; but the prince must have a lawful power to hinder their meeting, or then the Church cannot have a lawful power to meet; for the convening of ten thousands, if abused, is as dangerous for wasting of a kingdom in its own way, as the convening of a national synod, is, or may be destructive to peace.</p></blockquote>

<blockquote><p>First, I said that the magistrate is the guardian of the divine law, which includes not only the second table, but the first also. Therefore he is the guardian of both the one and the other. I also mentioned the words of Augustine who said that both private men and kings should serve the Lord. It is written in the Psalms, When peoples gather together and kingdoms, to worship the Lord. In another place, Now therefore, O kings, be wise; be warned, O rulers of the earth. Serve the LORD with fear, with trembling. Augustine adds that a private man serves the Lord by confessing His name and living rightly. This, however, is not sufficient for a king or magistrate. He should serve the Lord with his authority and power by punishing those who oppose Him. Unless he does this, the magistrate appears to give his assent to blasphemy and heresy. When the king sees and suffers these men, he joins himself to them and promotes their shameful acts. When Nebuchadnezzar first came to know God, he proposed a decree promising capital punishment for those who should blaspheme against the God of Daniel. Darius later made a similar decree. Our magistrate should stamp out all idolatry, blasphemy and superstition. […] The law of God states that blasphemers should be put to death not by a private man or by priests, but by the magistrate. [Leviticus 24:16]</p></blockquote>

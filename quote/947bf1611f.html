<blockquote><p>Thirdly, howsoever an absolution shall be completed at the Day of Judgment, yet our justification shall not abide in such a way as it is in this life. Now our justification is by pardon of sin, and a righteousness without us imputed to us, which is instrumentally applied by faith; but this way shall then cease, for having perfect righteousness inherent in ourselves, we shall need no covering. It is true, the glory and honour of all this will redound upon Christ, and He shall not be the less glorified because He has then brought us to the full end of all his sufferings. I know some may doubt whether any righteousness but that which is infinite can please God, and therefore, as some think, the angels were accepted of God through Christ, though perfect; so it may be of the saints in heaven. But I see no ground for this. This seems to be undoubted, that the way of justification by faith in Christ arises because of our imperfection and sinfulness remaining in us, and therefore is justificatio viae, not patriae—’a justification’ of us ‘in our way,’ not when we come to ‘our home’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, (London: Miller, 1651), Lecture 29, on Acts 3:19, p. 258</span></figcaption>

eformedbooksonline.com/the-extent-of-christs-mediatorial-kingdom-2/#:~:text=Thirdly%2C%20howsoever%20an%20absolution%20shall%20be,when%20we%20come%20to%20%E2%80%98our%20home&amp;text=Thirdly%2C%20howsoever%20an%20absolution%20shall%20be%20completed%20at&amp;text=way%2C%E2%80%99%20not%20when%20we%20come%20to%20%E2%80%98our%20home" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-38fdad974a" data-kw="">
<blockquote><p>I. What was the will and intention of the Father and the Son in undergoing the death of the cross? Arminians: The will and intention of the Father in delivering the Son to death, and of the Son in undergoing it, was that reconciliation and remission of sins might be obtained for all and every one, both those that perish and those that are to be saved, but applied only to believers. Therefore, although those things are obtained for all and every one, yet they are applied only to believers. Censure: The will and intention of the Father in delivering the Son to death, and of the Son in undergoing it, was that the Son, through the ransom of his precious blood, might both obtain and apply remission of sins and eternal life to those whom the Father gave to him from eternity. Matthew 20:28; Hebrews 9:28; 1 Peter 2:24; Romans 3:25; 2 Corinthians 5:19; Colossians 1:21-22. To this pertain also those passages of Scripture, where Christ is said to have laid down his life for his sheep, to have given himself for his Church, to have redeemed the Church with his own blood. John 10:15; Ephesians 5:23, 25; Matthew 1:21; Acts 20:28.

II. Whether Christ died for all men universally? Arminians. Christ underwent death for all individuals both of the perishing and of those to be saved, as to the obtaining of salvation, as much for Cain and Judas, as for Abel and Peter: not however for the former, as such or about to perish, nor for the latter, as believers; but indiscriminately for these and those considered in the common lot of the fall and sin.. Censure. Christ is the expiation for the sins of the whole world, as to the worth and sufficiency of the λύτρον [ransom]. But by reason of efficacy, and the application of faith by him, according to the gratuitous election of God, he is the Savior of the elect only. John 10:15. But in Scripture Christ is said to have died for all, 1 Tim. 2:6, Heb. 2:9, and for many, namely the elect, sons of God and believers. Matt. 20:28, John 17:9, 19, Rom. 3:22. Which ἐναντιοφανές [seeming contradiction] that it may be taken away, it is to be held, that Christ is said to have died for all in three ways: In the beginning he died efficaciously for all his sheep. John 10:15. And in these all and alone there is a certain special universality, as is in Ambrose lib. 1 de vocat. gent. c. 3. The Apostle expresses that universality of believers in Rom. 3:22. Then in certain places of Scripture by the word “all” is understood the indeterminate and universal object of the death of Christ: which are all men, without exception of peoples, condition and sex: so that by this phrase the amplitude of grace in the New Testament is signified. Finally Christ is said to have died for all, if the sufficiency or magnitude of the price is regarded. For indeed the death of the Son of God, and of the immaculate lamb, is the one, perfect, and sufficient λύτρον [ransom], sufficient for expiating and deleting all the sins of the whole world: by which sufficiency all the reprobate are rendered inexcusable.

III. Whether the death of Christ and his resurrection, and also his intercession, are of equal extent? Arminians: Christ died adequately for all sinners, he rose again and intercedes with the intention of saving adequately for believers. Censure: As Christ died adequately for all and only the elect, so for them alone did he intercede in his state of humiliation, for them alone he rose again, and for them alone he now intercedes in heaven. Isaiah 53:17; John 10:15; 17:9; Hebrews 9:24.</p></blockquote>

<blockquote><p>Let us then see what the kingdom of Christ is, which begins in the faithful in this world… The kingdom of Christ in this world is the administration of salvation, whereby Jesus Christ the king Himself, outwardly gathers to Himself through the Gospel and sacrament of baptism, a people or visible Church (in which many hypocrites are mingled) and calls them to salvation, and administers and gives Himself the same salvation to which He calls them, in those whom He accounts for his elect in this congregation…</p></blockquote>

<blockquote><p>Universal redemption must be denied in the very sense of Calvinists themselves [New Lights?], whether predestination is acknowledged or no, if we acknowledge that Christ knows all things. For if Christ certainly knows all things to come, he certainly knew, when he died, that there were such and such men that would never be the better for his death. And therefore, it was impossible that he should die with an intent to make them (particular persons) happy. For it is a right-down contradiction [to say that] he died with an intent to make them happy, when at the same time he knew they would not be happy-Predestination or no predestination, it is all one for that. This is all that Calvinists mean when they say that Christ did not die for all, that he did not die intending and designing that such and such particular persons should be the better for it; and that is evident to a demonstration. Now Arminians, when [they] say that Christ died for all, cannot mean, with any sense, that he died for all any otherwise than to give all an opportunity to be saved; and that, Calvinists themselves never denied. He did die for all in this sense; ’tis past all contradiction.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Universal redemption must be denied in the very sense of Calvinists themselves [New Lights?], whether predestination is acknowledged or no, if we acknowledge that Christ knows all things. For if Christ certainly knows all things to come, he certainly knew, when he died, that there were such and such men that would never be the better for his death. And therefore, it was impossible that he should die with an intent to make them (particular persons) happy. For it is a right-down contradiction [to say that] he died with an intent to make them happy, when at the same time he knew they would not be happy-Predestination or no predestination, it is all one for that. This is all that Calvinists mean when they say that Christ did not die for all, that he did not die intending and designing that such and such particular persons should be the better for it; and that is evident to a demonstration. Now Arminians, when [they] say that Christ died for all, cannot mean, with any sense, that he died for all any otherwise than to give all an opportunity to be saved; and that, Calvinists themselves never denied. He did die for all in this sense; ’tis past all contradiction.”

— Jonathan Edwards, The “Miscellanies” (1722), WJE Online vol. 13, t. ‘Universal Redemption’, p. 174">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CUniversal+redemption+must+be+denied+in+the+very+sense+of+Calvinists+themselves+%5BNew+Lights%3F%5D%2C+whether+predestination+is+acknowledged+or+no%2C+if+we+acknowledge+that+Christ+knows+all+things.+For+if+Christ+certainly+knows+all+things+to+come%2C+he+certainly+knew%2C+when+he+died%2C+that+there+were+such+and+such+men+that+would+never+be+the+better+for+his+death.+And+therefore%2C+it+was+impossible+that+he+should+die+with+an+intent+to+make+them+%28particular+persons%29+happy.+For+it+is+a+right-down+contradiction+%5Bto+say+that%5D+he+died+with+an+intent+to+make+them+happy%2C+when+at+the+same+time+he+knew+they+would+not+be+happy-Predestination+or+no+predestination%2C+it+is+all+one+for+that.+This+is+all+that+Calvinists+mean+when+they+say+that+Christ+did+not+die+for+all%2C+that+he+did+not+die+intending+and+designing+that+such+and+such+particular+persons+should+be+the+better+for+it%3B+and+that+is+evident+to+a+demonstration.+Now+Arminians%2C+when+%5Bthey%5D+say+that+Christ+died+for+all%2C+cannot+mean%2C+with+any+sense%2C+that+he+died+for+all+any+otherwise+than+to+give+all+an+opportunity+to+be+saved%3B+and+that%2C+Calvinists+themselves+never+denied.+He+did+die+for+all+in+this+sense%3B+%E2%80%99tis+past+all+contradiction.%E2%80%9D%0A%0A%E2%80%94+Jonathan+Edwards%2C+The+%E2%80%9CMiscellanies%E2%80%9D+%281722%29%2C+WJE+Online+vol.+13%2C+t.+%E2%80%98Universal+Redemption%E2%80%99%2C+p.+174&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1b869e136d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1b869e136d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/limited-atonement/#:~:text=Universal%20redemption%20must%20be%20denied%20in,this%20sense%3B%20%E2%80%99tis%20past%20all%20contradiction&amp;text=Universal%20redemption%20must </figure><figure class="quote" id="q-39e34c7d9b" data-kw="">
<blockquote><p>This notion, as if the justification, righteousness, and life spoken of in Rom. v. implied the resurrection of damnation, is not only without ground from Scripture, but contrary to reason. For those are there spoken of as great benefits, by the grace and free gift of God: but this is the contrary, in the highest degree possible; the most consummate calamity. To obviate this, our author supposes the resurrection of all to be a great benefit in itself, though turned into a calamity by the sin and folly of obstinate sinners, who abuse God&#x27;s goodness. But the far greater part of mankind, since Adam, have never had opportunity to abuse this goodness, it having never been made known to them. Men cannot abuse a kindness, which they never had either in possession, promise, offer, or some intimation: but a resurrection is made known only by divine revelation which few comparatively have enjoyed. So that as to such wicked men as die in lands of darkness, if their resurrection comes at all by Christ, it comes from him, and to them, only is a curse, and not a blessing; for it never comes to them at all by any conveyance, grant, promise, or offer, or any thing by which they can claim it, or know any thing of it, till it comes as an infinite calamity, past all remedy.</p></blockquote>

<blockquote><p>Either those laws which God gave to Moses, respecting the punishment of crimes, are in force, or God has left the civil magistrate without any rule for the administration of justice. This last hypothesis may do very well for an infidel; but certainly not for those who know that civil government is the ordinance of God for good. Rom. xiii. 1. We can hardly suppose that God would institute an ordinance, and leave us without any rule for its administration.</p></blockquote>

<blockquote><p>45. The second difference [between civil and church power] is in the object, or matter about which: The power politic or civil is occupied about the outward man and civil or earthly things, about war, peace, conservation of justice and good order in the commonwealth; also about the outward business or external things of the Church, which are indeed necessary to the Church, or profitable, as touching the outward man, yet not properly and purely spiritual, for they do not reach unto the soul, but only to the external state and condition of the ministers and members of the Church.

46. For the better understanding whereof, tis to be observed that so far as the ministers and members of the Church are citizens, subjects or members of the commonwealth, it is in the power of the Magistrate to judge, determine and give sentence concerning the disposing of their bodies or goods; As also concerning the maintenance of the poor, sick, the banished and of others in the Church which are afflicted; To regulate (so far as concerns the civil order) marriages, burials, and other circumstances which are common both to holy and also to honest civil societies; to afford places fit for holy assemblies and other external helps by which the sacred matters of the Lord may be more safely, commodiously and more easily in the Church performed: To remove the external impediments of divine worship or of ecclesiastical peace, and to repress those which exalt themselves against the true Church and her Ministers, and do raise up trouble against them. … 66. Fourthly, they [the Church and magistrate] differ in the[ir] end [design]: The immediate nearest end of civil power is that the good of the commonwealth may be provided for and procured, whether it be in time of peace, according to the rules of law and counsel of judges; or in time of war according to the rules of military prudence; and so the temporal safety of the subjects may be procured, and that external peace and civil liberty may be preserved, and being lost may be again restored.</p></blockquote>

<blockquote><p>5. ‘The persons are proposed (Rom. 13) to be the object of our obedience,’ says Dr. Ferne [an erastian royalist]. This is very true: but he is ignorant of our mind in expounding the word ‘person’. We never meant that fear, honor, royalty, tribute, must be due to the abstracted accident of kingly authority [a righteous rule that a bad king may not be exercising], and not to the man who is king; nor is it our meaning that royalty, in abstracto is crowned king [the office apart from the particular king], and is anointed, but that the person is crowned and anointed. But, again, by a ‘person’ we mean nothing less than the man Nero wasting Rome, burning, crucifying Paul and torturing Christians; and that we owe subjection to Nero and to his person in concreto [materially as a specific man], as [distinguished from and compared] to God’s ordinance, God’s minister, God’s sword-bearer, in that notion of a ‘person’, is that only that we deny. Nay, in that Nero, in concreto [as a man, and that sinful], to us is no power ordained of God, no minister of God, but a minister of the devil, and Satan’s armour-bearer, and therefore we owe not fear, honor, subjection, or tribute to the person of Nero. But the person thus far is the object of our obedience, that fear, honor, subjection and tribute must be due to the man in concreto [in particular], to his person who is prince, but not because he is a man, or a person simply, or a sword-bearer of papists, but for his office,- for that eminent place of royal dignity that God has conferred on his person… so here we honor and submit to the man who is king, not because he is a man, that were treason; not because he uses his sword against the church, that were impiety; but because of his royal dignity, and because he uses it for the Lord. …Subjection is due to Nero as an emperor, but not any subjection is due to him in the burning of Rome, and torturing of Christians… Because some believed Christians were free from the yoke of magistracy, and that the dignity itself was unlawful; and because (ch. 12) he had set down the lawful church rulers, and in this and the following chapter, the duties of brotherly love of one toward another; so here ([Rom.] ch. 13) he teaches that all magistrates, suppose [they be] heathen, are to be obeyed and submitted unto in all things, so far as they are ministers of God.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“5. ‘The persons are proposed (Rom. 13) to be the object of our obedience,’ says Dr. Ferne [an erastian royalist]. This is very true: but he is ignorant of our mind in expounding the word ‘person’. We never meant that fear, honor, royalty, tribute, must be due to the abstracted accident of kingly authority [a righteous rule that a bad king may not be exercising], and not to the man who is king; nor is it our meaning that royalty, in abstracto is crowned king [the office apart from the particular king], and is anointed, but that the person is crowned and anointed. But, again, by a ‘person’ we mean nothing less than the man Nero wasting Rome, burning, crucifying Paul and torturing Christians; and that we owe subjection to Nero and to his person in concreto [materially as a specific man], as [distinguished from and compared] to God’s ordinance, God’s minister, God’s sword-bearer, in that notion of a ‘person’, is that only that we deny. Nay, in that Nero, in concreto [as a man, and that sinful], to us is no power ordained of God, no minister of God, but a minister of the devil, and Satan’s armour-bearer, and therefore we owe not fear, honor, subjection, or tribute to the person of Nero. But the person thus far is the object of our obedience, that fear, honor, subjection and tribute must be due to the man in concreto [in particular], to his person who is prince, but not because he is a man, or a person simply, or a sword-bearer of papists, but for his office,- for that eminent place of royal dignity that God has conferred on his person… so here we honor and submit to the man who is king, not because he is a man, that were treason; not because he uses his sword against the church, that were impiety; but because of his royal dignity, and because he uses it for the Lord. …Subjection is due to Nero as an emperor, but not any subjection is due to him in the burning of Rome, and torturing of Christians… Because some believed — Samuel Rutherford, Lex Rex, Question 29, p. 146; p. 148">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C5.+%E2%80%98The+persons+are+proposed+%28Rom.+13%29+to+be+the+object+of+our+obedience%2C%E2%80%99+says+Dr.+Ferne+%5Ban+erastian+royalist%5D.+This+is+very+true%3A+but+he+is+ignorant+of+our+mind+in+expounding+the+word+%E2%80%98person%E2%80%99.+We+never+meant+that+fear%2C+honor%2C+royalty%2C+tribute%2C+must+be+due+to+the+abstracted+accident+of+kingly+authority+%5Ba+righteous+rule+that+a+bad+king+may+not+be+exercising%5D%2C+and+not+to+the+man+who+is+king%3B+nor+is+it+our+meaning+that+royalty%2C+in+abstracto+is+crowned+king+%5Bthe+office+apart+from+the+particular+king%5D%2C+and+is+anointed%2C+but+that+the+person+is+crowned+and+anointed.+But%2C+again%2C+by+a+%E2%80%98person%E2%80%99+we+mean+nothing+less+than+the+man+Nero+wasting+Rome%2C+burning%2C+crucifying+Paul+and+torturing+Christians%3B+and+that+we+owe+subjection+to+Nero+and+to+his+person+in+concreto+%5Bmaterially+as+a+specific+man%5D%2C+as+%5Bdistinguished+from+and+compared%5D+to+God%E2%80%99s+ordinance%2C+God%E2%80%99s+minister%2C+God%E2%80%99s+sword-bearer%2C+in+that+notion+of+a+%E2%80%98person%E2%80%99%2C+is+that+only+that+we+deny.+Nay%2C+in+that+Nero%2C+in+concreto+%5Bas+a+man%2C+and+that+sinful%5D%2C+to+us+is+no+power+ordained+of+God%2C+no+minister+of+God%2C+but+a+minister+of+the+devil%2C+and+Satan%E2%80%99s+armour-bearer%2C+and+therefore+we+owe+not+fear%2C+honor%2C+subjection%2C+or+tribute+to+the+person+of+Nero.+But+the+person+thus+far+is+the+object+of+our+obedience%2C+that+fear%2C+honor%2C+subjection+and+tribute+must+be+due+to+the+man+in+concreto+%5Bin+particular%5D%2C+to+his+person+who+is+prince%2C+but+not+because+he+is+a+man%2C+or+a+person+simply%2C+or+a+sword-bearer+of+papists%2C+but+for+his+office%2C-+for+that+eminent+place+of+royal+dignity+that+God+has+conferred+on+his+person%E2%80%A6+so+here+we+honor+and+submit+to+the+man+who+is+king%2C+not+because+he+is+a+man%2C+that+were+treason%3B+not+because+he+uses+his+sword+against+the+church%2C+that+were+impiety%3B+but+because+of+his+royal+dignity%2C+and+because+he+uses+it+for+the+Lord.+%E2%80%A6Subjection+is+due+to+Nero+as+an+emperor%2C+but+not+any+subjection+is+due+to+him+in+the+burning+of+Rome%2C+and+torturing+of+Christians%E2%80%A6+Because+some+believed+Christians+were+free+from+the+yoke+of+magistracy%2C+and+that+the+dignity+itself+was+unlawful%3B+and+because+%28ch.+12%29+he+had+set+down+the+lawful+church+rulers%2C+and+in+this+and+the+following+chapter%2C+the+duties+of+brotherly+love+of+one+toward+another%3B+so+here+%28%5BRom.%5D+ch.+13%29+he+teaches+that+all+magistrates%2C+suppose+%5Bthey+be%5D+heathen%2C+are+to+be+obeyed+and+submitted+unto+in+all+things%2C+so+far+as+they+are+ministers+of+God.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex%2C+Question+29%2C+p.+146%3B+p.+148&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbea784873e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bea784873e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-separation-from-impure-civil-governments/#:~:text=5.%20%E2%80%98The%20persons%20are%20proposed%20%28Rom,as%20they%20are%20ministers%20of%20God&amp;text=5.%20%E2%80%98The%20persons%20are%20proposed%20%28Rom.%2013%29%20to&amp;text=so%20far%20as%20they%20are%20ministers%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Whereas some object that the care both of temporal good and spiritual good belongs to the magistrate, therefore he must have a power to make Church laws. See [David] Pareus. For his care cannot be supreme, if he must rule at the nod and beck of Church-men. I Answer, the connection is weak: he who has the care of both the temporal and spiritual good of the people, he has a nomothetic [law-making] power to procure both these two goods: it follows [in] no way, for then might he have a power in his own person to preach, and administrate the sacraments; this power [of the magistrate] procures the spiritual good, but such as is the care, such is the power: the care is politic and civil; Therefore the power to procure the spiritual good, must bee politic and civil [circa sacra, not in sacra].</p></blockquote>

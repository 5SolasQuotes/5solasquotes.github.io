<main class="wrap"><figure class="quote" id="q-b1b1dc4900" data-kw="">
<blockquote><p>Now concerning the outward form and manner of admitting Professors unto the holy Communion, and distinguishing them from those that are without; we find nothing distinctly enjoined in the Word, or extant in the practice of the Apostles: Therefore that which may concern this matter, is conceived to be left free unto the discretion of the Eldership, as they shall think it most fit, for the edification and capacity of those with whom they have to do.

And herein the customs of the Reformed churches, in respect of circumstantials, are found to be different; yet, in the main, their agreement is this—

1. That every one who for the first time is to be admitted unto the Holy communion, is to be examined in respect of his knowledge and conversation; although from his infancy he hath been born, baptized, and bred in the Congregation.

2. If he come from abroad; having years of discretion and judgement fit to examine himself, it is expected he should have a testimonial of his former life and conversation, and of his diligence in attending the Ordinances in the place where he hath lived. And being found knowing in the fundamental truths of Christianity, he is desired

First, to declare that his purpose is to live and die in the communion of the Reformed churches.

Secondly, to promise, that if he should conceive any scruples of the Doctrine that is taught in the Reformed churches, he shall not conceal his doubts, and fall away from the Fellowship into which he is received; but make the same known unto his Teachers, to receive satisfaction therein.

Thirdly, to oblige himself to use all careful diligence to honour and adorn his profession with his life and conversation, and to avoid all occasion of scandal.

Fourthly and lastly, to promise to submit himself unto the Rules of Church-discipline, according to the Word; and to respect those that are set over him in the Lord.

All which he is engaged to do by word of mouth, and by giving his hand unto the Eldership.

In some places, this admission of Members is left to the Pastor, to be performed in private; yet so, as the reception of the party must be notified unto, and ratified by the Eldership. In some places, all is done before the whole Eldership. In some places also, the names of those that are admitted, are published unto the whole Congregation from the Pulpit.</p></blockquote>

<blockquote><p>WHAT THE LORD’S SUPPER IS.

The Lord’s Supper is an holy and heavenly banquet, in which the faithful Christians, besides the corporal earing of the bread, and the outward drinking of the wine, do spiritually through faith both eat the body of Christ and drink his blood, unto the confirmation of their faith, the comfort of their conscience, and the salvation of their souls. …

Secondly, to stir us up unto thanksgiving, while we consider how precious, great, and inestimable benefits we have received of God the Father by the death of his Son; as deliverance from Satan, freedom from the curse of the law, forgiveness of sins, the favour and good-will of God, quietness of conscience, the Holy Ghost, righteousness, victory against sin, death, and hell, salvation, and finally everlasting life.

That we should not be unthankful, but rather joyfully brast out into all kind of spiritual praises, lauding and magnifying God the Father for these his most high and singular free gifts, the Lord Christ did institute this holy supper. Therefore is it called of the ancient doctors Sacramentum Eucharistæ: “The sacrament of thanksgiving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-becon.html">Thomas Becon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to be Known of the Faithful Newly set Forth to the Great Profit of all the Readers (1569) in The Catechism of Thomas Becon … with other pieces written by him in the Reign of King Edward the Sixth, ed. John Ayre (Cambridge: The Parker Society, 1844), pp 508-09.</cite></span></figcaption>

<blockquote><p>[I]f you are very despondent and leaning towards melancholy, and you proceed to partake of the Lord’s Supper, see to it that you do not dwell on the disturbing and unsettling thoughts regarding your sins and failures. To you who are in a state of despondency, we say that we do not wish to apply this rule categorically, as if they who partake of the Lord’s Supper should refrain from reflecting upon their sins.

On the contrary! We believe that if someone comes to the Lord’s Table in a somewhat sluggish and dull heart to be broken so that the balm of grace may be all the more effective (Matt. 12:20). Nevertheless, concerning you who are of a melancholy and weak disposition, we believe that now, namely, the time of preparation for the Lord’s Supper, is not the time to prune and carve even more, but rather that you should solely pursue the healing and refreshing of your soul.

The reason why you so frequently leave the Lord’s Table without fruit and joy is because you have been wrongly engaged, having focused more on your sins and abominations than on the grace of Jesus Christ. Such a melancholy reflections will so oppress you and engulf your heart that the sunshine of God’s comfort cannot penetrate. The best way for you and all that are of a similar disposition is but to cast your souls, as wounded and broken as they may be, before the cross of Christ, longing and craving for the sweet efficacy of His healing blood. Do so before you inflict new wounds in your soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guiljelmus-saldenus.html">Guiljelmus Saldenus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Efficacy of the Lord’s Supper to the Comfort and Sanctification of God’s Children</cite>, (1664), trans. Bartel Elshout in James A. De Jong (ed.), In Remembrance of Him: Profiting from the Lord’s Supper (Grand Rapids MI: Reformation Heritage Books, 2012), p. 31.</span></figcaption>

<blockquote><p>After the thanksgiving, it is very clear that our Divine Lord broke the bread. We scarcely know what kind of bread was used on that occasion; it was probably the thin passover cake of the Jews; but there is nothing said in Scripture about the use of leavened or unleavened bread, and therefore it matters not which we use. Where there is no ordinance, there is no obligation; and we are, therefore, left free to use the bread. which it is our custom to eat.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b1c19e5acd" data-kw="">
<blockquote><p>Vers. 20. Wherefore if ye be dead with Christ from the Rudiments of the world; why, as though living in the world, are ye subject to Ordinances?

The third Admonition follows with a reprehension, because they had subjected themselves to decrees or human traditions and doctrines of men, determining Religion, in those things which God hath not determined. There are five Arguments of the Admonition or Reprehension: (1) Because ye are freed by the death of Christ from all carnal rudiments of Religion, such as Judaical ceremonies, so that you have no further to do with them, ye ought not to admit the decrees and precepts of men, as if as yet after the manner of children under Rudiments, ye were obnoxious to such sort of Elements.

The force of this first Argument consisteth in these five things: (1) Christ hath fulfilled that which was prefigured by Moses his ceremonies, and by his death hath abrogated those typical ceremonies, and that shadowy manner of teaching the Church and worshipping God, so that the legal Covenant cannot exact anything more from him, than that which was paid and perfected in his death.

(2) Christ dying, all in Covenant are dead judicially with him, whose person Christ hath born: Therefore the legal Covenant could exact nothing more from them, for whose sake Christ died, than the Laws of men required of those that are dead: For all in him are reckoned as dead.

(3) All ceremonial Precepts in respect of the authority commanding, were divine and heavenly until Christ: But now abolished through Christ, they cease to be divine, and begin to be human elements, or rudiments worldly and carnal, not so much in respect to the things commanded, as to the mundane authority commanding them.

(4) So long as the Colossians were not converted to Christ, but did live in the world as worldlings free from righteousness, so they were slaves to devils and men, obnoxious to all manner of servitude, and to all kind of evil.

(5) But now after they were one body with Christ, they were made free by faith, and also were set at liberty from all evil, neither ought they to submit themselves to any yoke, unless to that which Christ would have them subjugated, and consequently they ought not to be subject in the business of Religion to the opinions and traditions of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 141.</span></figcaption>

</figure><figure class="quote" id="q-4939dbe389" data-kw="">
<blockquote><p>Every art has its basic ingredients. Grammar has the alphabet. Geometry has a few simple illustrations. These basics are important to know, but they are not the whole story. Likewise the elements of the world are not the finished product, but only those things out of which the rest are put together. Similarly, righteousness has its basic elements, its own alphabet. This elementary ABC level of righteousness has its place, in the law of Moses.

But perfect righteousness is that which is found in Christ by faith. When Christ is known by faith, relapsing into a search for righteousness by observing the feasts of the law is nothing other than if someone who was a most learned professor and master of arts should lapse back into learning the alphabet. Who would not be astonished at such stupidity?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-brenz.html">Johannes Brenz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Explicatio Epistolae Pauli ad Galatas</cite>, (Frankfurt, 1546). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 145.</span></figcaption>

</figure><figure class="quote" id="q-0287d0d964" data-kw="">
<blockquote><p>8. The non-necessaries, or such things as need not be in the worship of God, which do bring scandal, must 1. be such as are neither necessary in specie, nor in individuo, in kind, or in specie or nature, or in their individuals and particulars, as the whole category of men’s devices, as:

1. Unwritten traditions—not necessary, not written.

2. Human mystical, symbolical signs and ceremonies—not necessary, not written.

3. Human holy days, crossing, kneeling to elements, altars, crossing, surplice, rochets, etc.—not necessary, not written.

4. This and this human holy day, this crossing—not necessary, not written.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-dc59e7e6ed" data-kw="">
<blockquote><p>…for they teach, that a man may publish that which by consequence destroys the faith of fundamentals, and so subvert the faith of others, which to do is a sin; but because the man follows the indictment [conviction] of his erroneous conscience, it is no sin to the man that so teaches; yea, he may innocently suffer persecution for his conscience, thus erroneous; yea, and die a martyr for it. Therefore, if the following of an erroneous conscience shall make a less sin to be no sin but innocency, it shall make a greater sin, to wit, killing of his son to his heavenly father [as an erroneous sacrifice, modeled off of Gen. 22], no sin, and so he may lawfully do it [though this is murder]. Nor will it suffice to say, to offer a man to God and kill him, is against the light of nature, and [in]vincibly a sin; what then? if the man believe he is commanded to kill him, his erroneous conscience must bind, as the offering of whole burnt offerings to God, to us is a sin, against the light of nature, in regard the law of nature can no more warrant it, than it can warrant Christ to offer up himself to God [Christ needed the positive command from his Father]. But upon the supposition of Libertines, its no murder; nor is it punishable at all, because the father may, yea, and lawfully, ought to worship God according to the indictment of his conscience, whither the conscience be right or bloody and erroneous, and yet he is not punishable for blood-shed, by their way for merely, and simply, without any malignancy or hatred to the child; he believes, he ought to prefer his Maker to his dearest child’s life as well as Abraham, and the conscience does naturally, and as under no Law, simply believe it is the like service, and worship that Abraham would have gratefully performed unto God, if God in reward of that love, had not forbidden him again to kill his Son. And this answer presupposes also, that it is impossible for a father to have such a conscience, as may stimulate, and command to kill his son, and that in the authority, and name of God, as he erroneously, yea, and as he invincibly holds, as Socinians, Familists, Papists, believe purgatory, merits, justification by works, who yet are not to be punished for their conscience, according to Libertines. Again, there is no intrinsic malignancy [in intention] in the act of naticide, or son-sacrificing, but what it has from the Lord’s Law forbidding to kill, now those that killed their sons to Molech, yea, to God, as they thought, strongly, yea, invincibly believed God commanded them, to do Him such bodily service, as is clear from Jer. 7:31; 15:5. And that this is invincible ignorance (I take the word invincible in the Libertines’ sense) Libertines grant, for in our condemning son-sacrificing, they will say we are not infallible. Yea, the understanding, being spiritual, cannot be restrained, says Dr. [Jeremy] Taylor, sect. 13, n. 6, and no man can change his opinion when he will, says he, ibid., n. 7, and so should not be punished for it, and n. 13, there is nothing under God Almighty that has power over the soul of man, so as to command a persuasion. If he be then persuaded, that he ought to kill his son, he ought unpunishably so to do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, ... (London, 1649), pp. 348-9</span></figcaption>

<blockquote><p>Such as stand against a strong and mighty tentation [trial], being pressed out of measure, above strength, as Paul was (2 Cor. 1:8-9) insomuch (saith he) that we despaired even of life. But we had the sentence of death in ourselves, do prevail to the being taught of God, not to trust in ourselves, but in God who quickens the dead: For here there comes real strength from fighting: As he who, by strength of nature, lives and convalesceth after a running botch and strong pestilence, goes through pest-houses [asylums for plague victims] and is never infected again. So the worthies by faith who overcame strong temptations (Heb. 11 to the end), keep the fields and prevail till death.</p></blockquote>

<blockquote><p>[1. The Rule of Reformation.] The rule of building the house of God, and of the reformation of religion is the same and perpetual: the commandment of God, and not the commandment of man one or more, whether they be civil or ecclesiastical persons. It is their part to provide according to their places and callings, to command and direct that the Commandment of God be obeyed. This King commands not that his will be done, but what God has commanded. Neither King nor Parliament can command otherwise. Civil powers have great authority, not only in things civil, but in matters of Religion; and they sin against God, if they use not the authority which God hath put in their hands, for the good of Religion. To them belongs inspection and watching over, not only ecclesiasticos [ecclesiastical persons], but ecclesiastica [that which is ecclesiastical]. Ecclesiastical persons are subject to civil authority no less than others; and in respect of things-ecclesiastical, or matters of religion, Eusebius brings in Constantine the great, saying: ‘Vos Episcopi in Ecclesia, ego extra Ecclesiam seu templum Episcopus a Deo constitutus sum‘ [Ye are overseers in the Church; I am constituted of God an overseer outside of the Church Church]: Not that any mortal man whether Pope or Prince, can be properly Head of the Church, or vice-gerent [regent] unto Christ the Mediator in his special and economical Kingdom of Grace: for princes are vice-gerents to God, and to his Son Jesus Christ as He is God, in his universal Kingdom of Providence; and this watching and inspection of princes and magistrates, is objective ecclesiastica [objectively ecclesiastical], but formaliter civilis [formally civil], it is about matters of religion in a civil manner, and in a way suitable to the nature and quality of their place and power. The faithful custody and preservation of religion, is a part of their office: for they are not only keepers of the Second, but of the First Table of the Law… Religion also expects from them the civil sanction, that the worship of God, and the wholesome constitutions of the Church about religion, be confirmed and settled by their Laws. Coaction [coercion] also is theirs, for they by their power [in a Christian nation] are to constrain their subjects to the duties of religion, and to coerce and stop them that they do nothing to the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Sermon Preached To the Honorable House of Commons, at Their late Solemn Fast, Wed., Dec. 27</cite>, 1643’ (London, 1644)</span></figcaption>

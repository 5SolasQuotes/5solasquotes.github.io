<main class="wrap"><figure class="quote" id="q-b68b133225" data-kw="">
<blockquote><p>Now these words (which are the known division of David’s psalms, and expressly answering to the Hebrew words Shurim, Tehillim, and Mizmorim, by which his psalms are distinguished and entitled), being so precisely used by the apostle in both places, do plainly point us to the Book of Psalms.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-06d5cd28d0" data-kw="">
<blockquote><p>Why then will they [the Church of Rome] reprehend our singing? ‘Be ye’ (sayeth he) ‘fulfilled with the spirit, speaking amongst yourselves in Psalmes, Hymns and spiritual songs, singing and making melody unto the Lord in your hearts.’ You hear what the apostle of Christ willeth us to do. ‘My songs’ (sayth the prophet David) ‘will I make of thy name, O thou most highest.’ Whosoever therefore rebuketh us for singing of Psalms, the same doth withstand the Scriptures and holy Ghost. But if they themselves do allow their own singings, why then disallow they ours?… Yea, they themselves thus write: ‘Concerning the singing of Hymns, we have the example of our Savior, and of the apostles.’ Be not therefore any longer obstinate, the Psalms of David we sing, never go about to carp our singing. Many other things there be, which in us they do blame.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-evans.html">Lewis Evans</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Castle of Christianity detecting the long erring estate, as well of the Roman Church, as of the Bishop of Rome: together with the defence of the catholic faith</cite>, … (London, 1568), ‘A Plain Demonstration of the Erring Estate of the Roman Church’, pp. 49-50. Evans (fl. 1574). This book was dedicated to Queen Elizabeth.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

c" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=Why%20then%20will%20they%20%5Bthe%20Church,which%20in%20us%20they%20do%20blame&amp;text=Why%20then%20will%20they%20%5Bthe%20Church%20of%20Rome&amp;text=there%20be%2C%20which%20in%20us%20they%20do%20blame" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-43d87fcc7d" data-kw="">
<blockquote><p>I should be too tedious if I should stand to reckon up the manifold mercies that God hath bestowed on this our land, beyond all the world besides, our peace, and plenty, with the Gospel of Christ, our many, and great deliverances… God hath delivered us from the Spanish invasion, and the Gun-powder treason, and hath placed us in a wealthy land. ‘Be ye therefore filled with the Spirit’ (saith our prophet David) ‘speaking to yourselves in Psalms, and Hymns, and spiritual songs’: and here I might speak of the godly care of our Church, which hath ordained singing of Psalms, both before, and after sermon, and indeed are very fitting to be sung in order, for the better stirring up of our affections. And here I have a just cause to task them of the Separation, who will not admit of any set form of prayer, for that (as they say) is cursing of the Spirit; but why then should we have a set form of singing? For my part it shall ever have my allowance and I think that these their ex tempore prayers sounds as harshly in the ears of heaven, as diverse Psalms sung together in several tunes would in ours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cheshire.html">Thomas Cheshire</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon Preached in Saint Paul’s Church the Tenth of October</cite>, 1641… wherein are many memorable passages most worthy of serious observations in these times (London, 1641), pp. 10-11</span></figcaption>

</figure><figure class="quote" id="q-f31f72356f" data-kw="">
<blockquote><p>He falls next on the doxology… We [Scottish presbyterians] do not use it, but we never laid such weight on using it as to forbear all communion with a congregation where it is used; I called it a ‘human composure’… for I think neither ancient nor modern divines will call them schismatics who cordially join with the Church where they live in all of her worship, except this;</p></blockquote>

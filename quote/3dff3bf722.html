<main class="wrap"><figure class="quote" id="q-3dff3bf722" data-kw="">
<blockquote><p>2. As to the question on which you wish my opinion, whether it is lawful to fast on the seventh day of the week, I answer, that if it were wholly unlawful, neither Moses nor Elijah, nor our Lord Himself, would have fasted for forty successive days. But by the same argument it is proved that even on the Lord’s day fasting is not unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Nicene &amp; Post-Nicene Fathers, First Series</cite>, vol. 1, ed. Schaff (Buffalo, NY: Christian Literature Publishing Co., 1887), Letters of St. Augustine of Hippo, 2nd Division, Letter 36, ch. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-ea6137d763" data-kw="">
<blockquote><p>We think to deny the lawfulness of public fasting on the Lord’s day, as if the Christian Sabbath were a day only of spiritual feasting and rejoicing, because that day Christ ended the work of redemption and second creation, is a wronging of the Christian Sabbath, which is ordained for the whole public worship of God, joying, sorrowing for sin, learning God’s will in all and every point, as the Jewish Sabbath was not ordained only for meditation on the work of creation, but for worships of all kinds: The worship of this day, Acts 20:7, is as large as preaching, and being in the Spirit, on the Lord’s day, and seeing the visions of God, Rev. 1:10-12, and the whole ordinary public worship. It is then too narrow to restrict all our Sabbath-worship to one single act of festival rejoicing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, ch. 20, Article 7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-8b1d1819a1" data-kw="">
<blockquote><p>…in the Ten Commandments, in which one of seven is a Sabbath to the Lord, it will be found that many positives Moral are in the Covenant of Works… But man being considered as endued with the Image of God, so the Holy God made with him a Covenant of life, with Commandments, though positive and moral, yet not deduced from the Law of Nature, in the strictest sense, as to observe such a Sabbath, the seventh from the Creation…</p></blockquote>

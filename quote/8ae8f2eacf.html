<blockquote><p>Many other arguments for the existence of God have been worked out in the course of time, among which the following come to mind: Aristotle’s argument from motion (Physics 8.5), St. Augustine’s proof from truth (On Free Choice 2.12-15), the famous argument of St. Anselm, the triple way of St. Bonaventure (Disputed Question on the Mystery of the Trinity q.1 a.1), the five ways of St. Thomas, the very fine demonstration of Scotus, Ockham’s proof from conservation (see Boehner, ‘Zu Ockhams Beweis der Existenz Gottes’, Franz. Stud. 32, 1950, 50ff), and the argument of Peter Auriol (see Schmücker, ‘Propositio per se nota, Gottesbeweis und ihr Verhältnis nach Petrus Aureoli, Franz. Forsch., Heft 8, Werl i., Westf., 1941).</p></blockquote>

</figure><figure class="quote" id="q-fa7c31e8f3" data-kw="">
<blockquote><p>It would also seem well to observe that sensible things, from which human reason derives the source of its knowledge, retain a certain trace of likeness to God, but so imperfect that it proves altogether inadequate to manifest the substance itself of God. For effects resemble their causes according to their own mode, since like action proceeds from like agent; and yet the effect does not always reach to a perfect likeness to the agent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, bk. 1, ch. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span><span class="t"><a href="../topics/existence-and-knowledge-of-god/existence-of-god.html">Existence of God</a></span></div>

</figure><figure class="quote" id="q-db2b631032" data-kw="">
<blockquote><p>I answer that, The existence of God can be proved in five ways… The second way is from the nature of the efficient cause. In the world of sense we find there is an order of efficient causes. There is no case known (neither is it, indeed, possible) in which a thing is found to be the efficient cause of itself; for so it would be prior to itself, which is impossible. Now in efficient causes it is not possible to go on to infinity, because in all efficient causes following in order, the first is the cause of the intermediate cause, and the intermediate is the cause of the ultimate cause, whether the intermediate cause be several, or only one. Now to take away the cause is to take away the effect. Therefore, if there be no first cause among efficient causes, there will be no ultimate, nor any intermediate cause. But if in efficient causes it is possible to go on to infinity, there will be no first efficient cause, neither will there be an ultimate effect, nor any intermediate efficient causes; all of which is plainly false. Therefore it is necessary to admit a first efficient cause, to which everyone gives the name of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aquinas.html">Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, q. 2, article 3, ‘Whether God Exists’, ‘I answer that’</span></figcaption>

God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c80bf07373" data-kw="">
<blockquote><p>For the possibility of thinking that He does not exist is not on account of the imperfection of his being, or the uncertainty of it—since in itself his being is supremely manifest—but is the result of the weakness of our mind, which is able to see Him only in his effects and not in Himself, so that it is led by reasoning to know that He is.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-57754a76e9" data-kw="">
<blockquote><p>Such as truly believe in Christ, and endeavour to walk in all good conscience before him (1 John 2:3), may, without extraordinary revelation, by faith grounded upon the truth of God’s promises, and by the Spirit enabling them to discern in themselves those graces to which the promises of life are made (1 Cor. 2:12; 1 John 3:14, 18–19, 21, 24; 4:13, 16; Heb. 6:11–12), and bearing witness with their spirits that they are the children of God (Rom. 8:16), be infallibly assured that they are in the estate of grace…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Larger Catechism</cite>, Q. 80</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a> › <a href="../topics/assurance-peace-and-joy/assurance-of-salvation/assurance-of-grace-and-salvation.html">Assurance of grace and salvation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bca1995867" data-kw="">
<blockquote><p>Himself he may doubt, — he may doubt his ability to save himself, — he may doubt his power to better his condition, to make himself more worthy and acceptable, but never let him doubt that Christ is all that a poor, lost, convinced sinner wants. Let him not doubt that Jesus is the Friend of sinners, the Savior of sinners, and that he was never known to cast out one who in lowliness and brokenness of heart, sought his compassionate grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/octavius-winslow.html">Octavius Winslow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Personal Declension and Revival of Religion in the Soul</cite>, p. 80</span></figcaption>

</figure><figure class="quote" id="q-094fd40078" data-kw="">
<blockquote><p>Who teach: That without a special revelation we can have no certainty of future perseverance in this life. For by this doctrine the sure comfort of the true believers is taken away in this life, and the doubts of the papist are again introduced into the Church, while the Holy Scriptures constantly deduce this assurance, not from a special and extraordinary revelation, but from the marks proper to the children of God and from the very constant promises of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 5, Rejection of Errors, ¶5</span></figcaption>

</figure><figure class="quote" id="q-763c635995" data-kw="">
<blockquote><p>It is not great faith, but true faith, that saves; and the salvation lies not in the faith, but in the Christ in whom faith trusts. Faith as a grain of mustard seed will bring salvation. It is not the measure of faith, but the sincerity of faith, which is the point to be considered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>All of Grace</cite>, p. 55</span></figcaption>

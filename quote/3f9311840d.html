<blockquote><p>The Reverend Fathers of our Church [of England] call Mr [John] Calvin one of the best writers: A reverend Father, &amp; a worthy ornament of the church of God, not only defending the same doctrine, but also discharging him of slanderous reports wrongfully laid against him, knowing that by defaming the persons of christians, and especially of Ministers, the Devil of old time laboured to overthrow the Gospel of Christ. How greatly all Christian churches are to praise God for that man’s faithful labours, and how instantly therefore all sorts of papists have and do endeavour and strive to diminish his credit, all the Christian world most aboundly both by word and by writing, do testify.

Wherefore we wonder not a little. What moved you [Richard Hooker] to make choice of that worthy pillar of the church above all other, to traduce him and to make him a spectacle before all Christians. Wherefore we crave your favour that with truth and patience you would answer our doubts &amp; scruples which by the preface of your first book you have made in us concerning him. And first, what Master Calvin hath done against our Church, that you should single him out as an adversary: Which of our Reverend Fathers of this land hath wished you thereunto; or else tell us plainly whether our adversaries (in whose mouths you are a most invincible champion) have not provoked you against him?

And open unto us without deceit ingenuously, whether all the learned men of our country, who have written and disputed for discipline, be not too base and mean persons, that on them only so mighty a man should spend his sharp arrows and coals of Juniper? but you will pass over the Seas, and search the sepulchres of the strangers, and finding no man alive worthy your combat, you call Master Calvin out of his sweet bed of rest, and him that is entered into peace, you challenge again into the field. Will no man fit you but he that was (as you bravely affirm) incomparably the wisest man that ever the French church did enjoy, since the hour it did enjoy him, to whom thousands were debtors: and who for his exceeding pains in composing the institutions of Christian Religion, &amp; exposition of holy scripture, gained the advantage of prejudice against all gainsayers following him, and of glory above all that consented to him.

How unlike are you unto that great &amp; mighty Goliath, who defied the whole Host of God, and made challenge of a man out of them all: he was so proud that he demanded but chose not: he sought for one that was alive and vaunted not himself over one that was dead? And here we most instantly beseech you, whether your weapons be the words of righteousness and the faithful pen of truth. Where learned you, and how prove you that Mai. Calvin was the founder of discipline? And herein declare unto us, what moved that Reverend and learned man Mai. D. [John] Whitgift to spend so many leaves to shew that the parts of Discipline might be altered by the civil Magistrate, as serving more fitly for the Apostles time, and the time of persecution, then for us, having the Magistrate to friend, and living in peace and quietness.

If Master Calvin (as the true story reporteth) obtained the consent of the towns men of Geneva, not only by demonstration out of the holy scriptures, but also by shewing the mind of very learned men of his age, out of their writings, as of Oecolampadius, Swinglius, Suychius, Philip, Bucer, Capito and Miconius, who was the founder of the discipline? Where had these notable men their judgement? Did he teach them? or write before them? Was it not one founder even the Lord Christ, the author and builder of his Church, who raised up divers men in divers places, and taught them by the same spirit out of the same holy scripture, the same doctrine and commandment of truth and righteousness?

Shew us also we pray you before our God which searcheth the heart, whether we have not just cause to judge, that in penning this story, you make of Calvin, your purpose were not to deceive your reader by an artificial entwining of some part of the truth with the hollow &amp; glittering thread of your own witty conjectures and peremptory censures; as namely when you begin to tell of the repentance of the people of Geneva, irefully champing upon the bit: you suddenly fall into a discourse of the rising up of those reformed churches; you besprinkle them with likelihood of desire of glory of their own enterprises; you blame then that in that troublesome time they wanted common conference, and that afterwards least they should derogate from their credit, they became ever after resolute to maintained that which they had done, and so leaving the churches all bespotted with levity and self pride, and eased of all conscience and honesty; you closely thrust in Calvin with this word, therefore: that he and his associates (as partners of the same self weening) stiffly refusing to administer the holy Communion, were banished the town.

After speaking of his restoring and re-establishing of Discipline, you have in one place, Many things might lead them &amp;c. And in other place, He rightly considered, &amp;c. This devise I see not how the wisest, &amp;c. And again: This sort it may be, &amp;c. Therefore we pray you to teach us how such might lead &amp; may bees, such entering into his thought and cross commending that for his devise which he simply propounded as out of the Scriptures of God; may not drop into your readers heart such unheeded impressions, as may make him highly admire R. H. great gravity and judicious wisdom and J. Calvin’s carnal policy, fine hypocrisy and peremptory folly. …

We desire you therefore in the name of our Lord Jesus Christ, who shall judge all men at his coming and make manifest the intents &amp; thoughts of the heart, to shew unto us without all artificial glozing whether all this your treatise of Calvin, be not polished armour, and a sharper razor, prepared for the use and help of the enemies of the Gospel, and that it may not rather be called a prejudicial commentary; and a Popish paraphrase; then a story true plain and without partiality, and that men have not just cause to think the better of Maister Calvin and the cause of discipline, when they see so little plain and faithful dealing in your writing. Read therefore his preface before his comment on the Psalmes, and Beza his story of his life, and the French or any other stories or monuments of faithful honest Christians and then answer faithfully the truth and show your honest meaning.</p></blockquote>

<blockquote><p>Now particularly to you (Honoured and Worthy) that are Members of the Honourable House of Commons, as you are single persons, search your selves, consider your ways; Is there any thing in your hands to be cleansed? You are to purge the corrupt leaven out of your own houses, your selves, your families, your places of office and trust are the proper sphere of your activity; you are for Ecclesiastical reformation, and the sweeping out of corruptions out of the house of God: but are you as intent upon personal reformation of your own ways? do your own houses lie clean? have you real principles of godliness in your own hearts? or are you carried merely by the Parliamentary genius or stream, by a rapt motion? In one word: are you not afraid of holiness?

These are things sadly to be considered. For can you think that in good earnest one black-more should go about to wash another? would you not say, Why doth not he first make himself white, that the other may thereby be persuaded he can make him so too? If any of you should lie in known sins or lusts, can you comfortably, conscientiously, and zealously contribute to the reformation of others? you may indeed do that which is right in the sight of God, but where is your comfort, if it be not done with a perfect heart? He must needs be afraid to hedge in the Sacrament, and to make it inaccessible to the scandalous and prophane, or to settle a faithful and searching ministry in the place he lives in, that knows he shall but thereby make a rod for himself.

I beseech you therefore to search your selves, that you may not be Carpenters to build an Ark for others, and your selves be lost. It is a great honour to be a Member of this Parliament, but it is as great a burthen too, as ever English men underwent: and I shall crave leave to tell you further, that you may become the greatest sinners in the world by it, for now the sins of the Kingdom: may become yours; the Heresies, blasphemies, and crying wickedness of oppression and injustice may become yours; they are other men’s sins by commission, they are your other men’s sins by your omission of that opportunity, and duty of your place to provide for remedies preventive and removal of them, so far as they may come within your knowledge, and the reach of your power.

That which Scripture calls partaking in other men’s sins, adds more guilt to men of all sorts, especially Ministers and Magistrates, then is generally thought of. Take heed of making your selves partakers of those sins and abominations, which you hate the thought of: and the Lord keep alive your zeal by this quickening consideration.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Now particularly to you (Honoured and Worthy) that are Members of the Honourable House of Commons, as you are single persons, search your selves, consider your ways; Is there any thing in your hands to be cleansed? You are to purge the corrupt leaven out of your own houses, your selves, your families, your places of office and trust are the proper sphere of your activity; you are for Ecclesiastical reformation, and the sweeping out of corruptions out of the house of God: but are you as intent upon personal reformation of your own ways? do your own houses lie clean? have you real principles of godliness in your own hearts? or are you carried merely by the Parliamentary genius or stream, by a rapt motion? In one word: are you not afraid of holiness?

These are things sadly to be considered. For can you think that in good earnest one black-more should go about to wash another? would you not say, Why doth not he first make himself white, that the other may thereby be persuaded he can make him so too? If any of you should lie in known sins or lusts, can you comfortably, conscientiously, and zealously contribute to the reformation of others? you may indeed do that which is right in the sight of God, but where is your comfort, if it be not done with a perfect heart? He must needs be afraid to hedge in the Sacrament, and to make it inaccessible to the scandalous and prophane, or to settle a faithful and searching ministry in the place he lives in, that knows he shall but thereby make a rod for himself.

I beseech you therefore to search your selves, that you may not be Carpenters to build an Ark for others, and your selves be lost. It is a great honour to be a Member of this Parliament, but it is as great a burthen too, as ever English men underwent: and I shall crave leave to tell you further, that you may become the greatest sinners in the world by it, for now the sins of the Kingdom: may become yours; the Heresies, blasphemies, and crying wickedness of oppression and injustice may become yours; they are other men’s sins by commission, they are your other men’s sins by your omission of that opportunity, and duty of your place to provide for remedies preventive and removal of them, so far as they may come within your knowledge, and the reach of your power.

That which Scripture calls partaking in other men’s sins, adds more guilt to men of all sorts, especially Ministers and Magistrates, then is generally thought of. Take heed of making your selves partakers of those sins and abominations, which you hate the thought of: and the Lord keep alive your zeal by this quickening consideration.”

— Richard Vines, The purifying of unclean hearts and hands: opened in a sermon preached before the Honourable House of Commons, at their solemn fast, January 28. 1645 in Margaret’s Westminster, (London: Abel Roper, 1646), pp 17-19.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+particularly+to+you+%28Honoured+and+Worthy%29+that+are+Members+of+the+Honourable+House+of+Commons%2C+as+you+are+single+persons%2C+search+your+selves%2C+consider+your+ways%3B+Is+there+any+thing+in+your+hands+to+be+cleansed%3F+You+are+to+purge+the+corrupt+leaven+out+of+your+own+houses%2C+your+selves%2C+your+families%2C+your+places+of+office+and+trust+are+the+proper+sphere+of+your+activity%3B+you+are+for+Ecclesiastical+reformation%2C+and+the+sweeping+out+of+corruptions+out+of+the+house+of+God%3A+but+are+you+as+intent+upon+personal+reformation+of+your+own+ways%3F+do+your+own+houses+lie+clean%3F+have+you+real+principles+of+godliness+in+your+own+hearts%3F+or+are+you+carried+merely+by+the+Parliamentary+genius+or+stream%2C+by+a+rapt+motion%3F+In+one+word%3A+are+you+not+afraid+of+holiness%3F%0A%0AThese+are+things+sadly+to+be+considered.+For+can+you+think+that+in+good+earnest+one+black-more+should+go+about+to+wash+another%3F+would+you+not+say%2C+Why+doth+not+he+first+make+himself+white%2C+that+the+other+may+thereby+be+persuaded+he+can+make+him+so+too%3F+If+any+of+you+should+lie+in+known+sins+or+lusts%2C+can+you+comfortably%2C+conscientiously%2C+and+zealously+contribute+to+the+reformation+of+others%3F+you+may+indeed+do+that+which+is+right+in+the+sight+of+God%2C+but+where+is+your+comfort%2C+if+it+be+not+done+with+a+perfect+heart%3F+He+must+needs+be+afraid+to+hedge+in+the+Sacrament%2C+and+to+make+it+inaccessible+to+the+scandalous+and+prophane%2C+or+to+settle+a+faithful+and+searching+ministry+in+the+place+he+lives+in%2C+that+knows+he+shall+but+thereby+make+a+rod+for+himself.%0A%0AI+beseech+you+therefore+to+search+your+selves%2C+that+you+may+not+be+Carpenters+to+build+an+Ark+for+others%2C+and+your+selves+be+lost.+It+is+a+great+honour+to+be+a+Member+of+this+Parliament%2C+but+it+is+as+great+a+burthen+too%2C+as+ever+English+men+underwent%3A+and+I+shall+crave+leave+to+tell+you+further%2C+that+you+may+become+the+greatest+sinners+in+the+world+by+it%2C+for+now+the+sins+of+the+Kingdom%3A+may+become+yours%3B+the+Heresies%2C+blasphemies%2C+and+crying+wickedness+of+oppression+and+injustice+may+become+yours%3B+they+are+other+men%E2%80%99s+sins+by+commission%2C+they+are+your+other+men%E2%80%99s+sins+by+your+omission+of+that+opportunity%2C+and+duty+of+your+place+to+provide+for+remedies+preventive+and+removal+of+them%2C+so+far+as+they+may+come+within+your+knowledge%2C+and+the+reach+of+your+power.%0A%0AThat+which+Scripture+calls+partaking+in+other+men%E2%80%99s+sins%2C+adds+more+guilt+to+men+of+all+sorts%2C+especially+Ministers+and+Magistrates%2C+then+is+generally+thought+of.+Take+heed+of+making+your+selves+partakers+of+those+sins+and+abominations%2C+which+you+hate+the+thought+of%3A+and+the+Lord+keep+alive+your+zeal+by+this+quickening+consideration.%E2%80%9D%0A%0A%E2%80%94+Richard+Vines%2C+The+purifying+of+unclean+hearts+and+hands%3A+opened+in+a+sermon+preached+before+the+Honourable+House+of+Commons%2C+at+their+solemn+fast%2C+January+28.+1645+in+Margaret%E2%80%99s+Westminster%2C+%28London%3A+Abel+Roper%2C+1646%29%2C+pp+17-19.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc941b26741.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c941b26741.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/11/23/richard-vines-on-the-personal-reformation-of-the-members-of-parliament/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>An incident which took place at this time between Hamilton and [Donald] Cargill provides another example of Cargill’s spirit of Christian chairty and his desire to avoid division. The Rotterdam Church, though generally favorable to the exiles, decided to debar [David] Hackston from the communion, presumably because of his involvement in the death of the archbishop [James Sharp, on May 3, 1679]. Cargill was due to officiate at the communion service the following day, 22 October [1679], and Hamilton, on hearing of the church’s decision, immediately went to tell Cargill of it, apparently expecting that he would refuse to take part. ‘But’, says Hamilton, ‘he, with other friends, though resolving to resent it, yet could not determine on such a sudden to withdraw from the church, this being the first step of their ever appearing against us.’ The next day, Cargill gave the communion as planned… an unfortunate disagreement which broke out in the Rotterdam congregation and which split the loyalties of the exiles into two camps. The dispute centered around Robert Fleming, an old fellow-student of Cargill’s at St. Andrews, who was now minister of the Rotterdam Church. Fleming, previously minister of Cambuslang, had been deprived of his charge because of his refusal to conform to the new ecclesiastical order in Scotland, and he was settled in Rotterdam in December, 1677. On revisiting Scotland in 1679 he was arrested and imprisoned in the Edinburgh Tolbooth. Some time after Bothwell [1679], however, he was set at liberty and in October of the same year, shortly after the other exiles arrived, he returned to his charge in Holland. Fleming, a man of judgement and moderation, could not bring himself to condemn those ministers who complied with the Indulgence, though remaining firmly opposed to it himself, and he pleaded with his congregation that such ministers should not be debarred from fellowship. Several of the newly arrived exiles, Robert Hamilton in particular, were highly critical of Fleming’s attitude and refused to countenance his ministry. [Robert] M’Ward, though equally resolute against Fleming’s position, continued to hear him and, instead of condemning him outright, tried by friendly argument to persuade him to change his views. As a result, M’Ward too was ostracized by Hamilton and by some others who sided with him. The disagreement caused M’Ward much distress and mauy well have hastened his end.¹ ¹ In a letter to the church at home [in Scotland] in late 1679 or early 1680 M’Ward wrote, ‘I was so confounded with these cause-destroying excesses… if the principle whereby they defend their practice owned, it would not only infer the dissolution of the united visible church, but also of all Christian society.’… it is clear that the reference is to Hamilton, who himself admits, in a letter dated 15 August 1682, that his fellowship with M’Ward, which had previously been close, ended with the arrival of Fleming. Says Hamilton, ‘Mr M’Ward continued extraordinarily kind until Mr Fleming came over, and then we differing in judgment he became greatly against me, to the making of me so far as possible odious in the whole provinces’…</p></blockquote>

<blockquote><p>We make not the naked presence of Word and sacraments true marks of the Church; but a settled, professed, erected, feeding by shepherds, feeding with knowledge, we make a mark of the shepherds’ tents; which way neither Philistines nor Indians have the Word of God: and for the Church of Rome, we cannot deny but she retains so much of the essence of a ministerial Church as makes baptism administrated by them to be true baptism, that is, a valid seal, though she cannot be called a true ministerial Church.</p></blockquote>

<blockquote><p>May the lies you believed make you wise to achieve The aims broken trust tried to steal. May the watches you keep in the sloughs where you weep Remind you that truth remains real. May integrity bless you while deceits that distress you Unravel as they strive to conceal. May fears that devour you unwillingly empower you As endurance adds knowledge to zeal. May hope now deferred and vision now blurred Behold, in tear-stained time, a heart that is ready to heal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rut-etheridge-iii.html">Rut Etheridge III</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“A Blessing for Beleaguered Believers” (2025) at Gentle Reformation</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c84d53d055" data-kw="">
<blockquote><p>In conforming to the righteousness and holiness enjoined in God’s Word men cannot be too strict and precise; But when men out of an opiniative confidence in their own judgment shall be violently bent upon the doing of anything which by the Word of God they are no way bound to do, or shall scruple that which the Word of God does nowhere forbid, though they may do it conscientiously and upon opinion of duty, then they are overwise and righteous overmuch. That which therefore Solomon here enjoins God’s people is a prudent and pious moderation of their behavior in all things that they should be wise unto sobriety, not resting too much upon their own understanding and judgement, but advising with others, Rom. 12:3, and that they should temper their zeal with godly wisdom and prudence, according to that, Phil. 4:5, ‘Let your moderation be known unto all men;’ And the reason whereby this is pressed is, lest by doing otherwise men should involve themselves in desperate dangers, as by such courses men often do: ‘Why shouldest thou destroy thyself?’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-jackson.html">Arthur Jackson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon Job, the Psalms, the Proverbs, Ecclesiastes &amp; the Song of Solomon (1658), ch. 7</cite>, p. 67</span></figcaption>

</figure><figure class="quote" id="q-4b22b2f2f4" data-kw="">
<blockquote><p>The sins forbidden in the sixth commandment are… the neglecting or withdrawing the lawful and necessary means of preservation of life… all excessive passions,[m] distracting cares;[n]… oppression,[t]… and whatsoever else tends to the destruction of the life of any.[x] [m] Rom. 12:19. [n] Eph. 4:31. [t] Ezek. 18:18. Exod. 1:14. [x] Exod. 21:18-36.</p></blockquote>

</figure><figure class="quote" id="q-ea82d63427" data-kw="">
<blockquote><p>You will say, ‘Yet it seems more happy to depart sooner out of this wretched life unto the heavenly rest than by long living to abide continual trouble and to lack that wished quiet the longer.’ I answer, If life of itself is the gift of God, then it is certainly good. If it be good, surely it is good of itself to enjoy it long. And for that, that sometimes in this life chances to come afflictions and many troubles, it is to be referred unto the accidents, and not to the substance itself of this goodness. Neither is the gift of God to be wished away, wherein He grants us to live and to tarry long in this life: and I speak not of the rest of the benefits wherewith God does both spiritually and corporally augment and garnish this our present life with all. Neither it follows that it is therefore evil to live because it is better to live in heaven than in earth. This present state, and the state of our life to come be not contraries, but of subordinate things one to another, as earth is also and heaven. The earth is good; heaven is better. It is in a sort good of itself to live; it is better if a man live honestly and uprightly; it is best of all, if it be given us to live in best sort and most happily, as we shall live in the country of Heaven. It takes not away that which is chiefly good, but does accomplish the goodness of those things which be of an inferior order [are] and conveniently set in order by God’s ordinance. The condition and nature of our soul is more noble than that of our body. And yet he must be worthy to have not body, nor soul whosoever will say the body is evil because the soul is better. Gold passes silver, yet silver is good, though gold be better. He is not worthy to have silver that in respect of gold sets nothing by silver. So likewise we must judge of our life. Let us acknowledge the gift of God, not only in the life to come, but also in this present life and in the long continuance thereof, if it come by the benefit of God. Let us not be wayward in God’s gifts, but kind. It is the part of a grateful mind so to commend the chief and best benefits, that withal he despise not the meaner and inferior. It is the voice of holy, not of carnal men that says, We have life, bless the Lord. And the Scripture rehearses among the benefits of God bestowed upon Abraham the father of the believers that he died in a good age, old and full of days.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places of the Christian Religion (1560; London, 1563) | 5th Commandment</cite>, fol. 75.a-b</span></figcaption>

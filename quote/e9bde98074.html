<main class="wrap"><figure class="quote" id="q-e9bde98074" data-kw="">
<blockquote><p>16. Upon what principles will his judgment be dispensed? The judge is figuratively represented (Rev. 20:12), after the analogy of human tribunals, as opening “books” in judgment, according to the things written in which the dead are to be judged, and also “another book,” “which is the book of life.” The books first mentioned doubtless figuratively represent the law or standard according to which each one was to be judged, and the facts in his case, or “the works which he had done.” The “book of life” (see also Phil. 4:3; Rev. 3:5; 13:8; 20:15) is the book of God’s eternal electing love. Those whose names are found written in the “book of life” will be declared righteous on the ground of their participation in the righteousness of Christ. Their holy characters and good deeds, however, will be publicly declared as the evidences of their election, of their relation to Christ, and of the glorious work of Christ in them.—Matt. 13:43; 25:34–40. Those whose names are not found written in “the book of life” will be condemned on the ground of the evil “deeds they have done in the body,” tried by the standard of God’s law, not as that law has been ignorantly conceived of by each, but as it has been more or less fully and clearly revealed by the Judge himself to each severally. The heathen who has sinned without the written law “shall be judged without the law,” i.e., by the law written upon his heart, which made him a law unto himself.—Luke 12:47, 48; Rom. 2:12–15. The Jew, who “sinned in the law, shall be judged by the law.”—Rom. 2:12. Every individual dwelling under the light of the Christian revelation shall be judged in strict accordance with the whole will of God as made known to him, all of the special advantages of every kind enjoyed by him individually modifying the proportion of his responsibility.—Matt. 11:20–24; John 3:19. The secrets of all hearts, the inward states and hidden springs of action, will be brought in as the subject matter of judgment, as well as the actions themselves, Eccle. 12:14; 1 Cor. 4:5; and publicly declared to vindicate the justice of the Judge, and to make manifest the shame of the sinner.—Luke 8:17; 12:2, 3; Mark 4:22. Whether the sins of the saints will be brought forward at the judgment or not is a question not settled by the Scriptures, though debated by theologians. If they should be, we are sure that it will be done only with the design and effect of enhancing the glory of the Saviour and the comfort of the saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology</cite>, (New York: Hodder &amp; Stoughton, 1878), 574–75.</span></figcaption>

<blockquote><p>III. However, the received opinion among the orthodox is that the promise given to Adam was not only of a happy life to be continued in paradise, but of a heavenly and eternal life (to which he was to be carried after the course of perfect obedience and perseverance had been run and which God had prescribed to him as a trial of his faith). Hence it is evident that the question is not whether Adam had the privilege of immortality in his upright state (which we have proved before against Socinus). The question is not whether the promise was given to him of happiness and life perpetually to endure, if he had persisted integrity (which the learned men, with whom we here dispute, do not deny). Rather the question is whether that happiness and life were to be passed in heaven or only upon the earth and in paradise. The latter, they affirm; we the former.

IV. The reasons are: (1) The law of works had the promise of heavenly and eternal life; therefore also the law prescribed to Adam. In each instance, it is the same law as to substance. The former is evident from “who doeth these things, shall live by them” (Lev. 18:5); “if thou wilt enter into life” (namely, the heavenly) “keep the commandments” (Mt. 19:16, 17); and “the commandment was ordained to life” (Rom. 7:10) assuredly, not earthly, but heavenly. Since however, after the fall, the law can justify no one, this promise must necessarily have had place in upright Adam.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“III. However, the received opinion among the orthodox is that the promise given to Adam was not only of a happy life to be continued in paradise, but of a heavenly and eternal life (to which he was to be carried after the course of perfect obedience and perseverance had been run and which God had prescribed to him as a trial of his faith). Hence it is evident that the question is not whether Adam had the privilege of immortality in his upright state (which we have proved before against Socinus). The question is not whether the promise was given to him of happiness and life perpetually to endure, if he had persisted integrity (which the learned men, with whom we here dispute, do not deny). Rather the question is whether that happiness and life were to be passed in heaven or only upon the earth and in paradise. The latter, they affirm; we the former.

IV. The reasons are: (1) The law of works had the promise of heavenly and eternal life; therefore also the law prescribed to Adam. In each instance, it is the same law as to substance. The former is evident from “who doeth these things, shall live by them” (Lev. 18:5); “if thou wilt enter into life” (namely, the heavenly) “keep the commandments” (Mt. 19:16, 17); and “the commandment was ordained to life” (Rom. 7:10) assuredly, not earthly, but heavenly. Since however, after the fall, the law can justify no one, this promise must necessarily have had place in upright Adam.”

— Francis Turretin, Institutes of Elenctic Theology, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.6.3–4 [p. 583].">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIII.+However%2C+the+received+opinion+among+the+orthodox+is+that+the+promise+given+to+Adam+was+not+only+of+a+happy+life+to+be+continued+in+paradise%2C+but+of+a+heavenly+and+eternal+life+%28to+which+he+was+to+be+carried+after+the+course+of+perfect+obedience+and+perseverance+had+been+run+and+which+God+had+prescribed+to+him+as+a+trial+of+his+faith%29.+Hence+it+is+evident+that+the+question+is+not+whether+Adam+had+the+privilege+of+immortality+in+his+upright+state+%28which+we+have+proved+before+against+Socinus%29.+The+question+is+not+whether+the+promise+was+given+to+him+of+happiness+and+life+perpetually+to+endure%2C+if+he+had+persisted+integrity+%28which+the+learned+men%2C+with+whom+we+here+dispute%2C+do+not+deny%29.+Rather+the+question+is+whether+that+happiness+and+life+were+to+be+passed+in+heaven+or+only+upon+the+earth+and+in+paradise.+The+latter%2C+they+affirm%3B+we+the+former.+IV.+The+reasons+are%3A+%281%29+The+law+of+works+had+the+promise+of+heavenly+and+eternal+life%3B+therefore+also+the+law+prescribed+to+Adam.+In+each+instance%2C+it+is+the+same+law+as+to+substance.+The+former+is+evident+from+%E2%80%9Cwho+doeth+these+things%2C+shall+live+by+them%E2%80%9D+%28Lev.+18%3A5%29%3B+%E2%80%9Cif+thou+wilt+enter+into+life%E2%80%9D+%28namely%2C+the+heavenly%29+%E2%80%9Ckeep+the+commandments%E2%80%9D+%28Mt.+19%3A16%2C+17%29%3B+and+%E2%80%9Cthe+commandment+was+ordained+to+life%E2%80%9D+%28Rom.+7%3A10%29+assuredly%2C+not+earthly%2C+but+heavenly.+Since+however%2C+after+the+fall%2C+the+law+can+justify+no+one%2C+this+promise+must+necessarily+have+had+place+in+upright+Adam.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger%2C+vol.+1+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%9397%29%2C+8.6.3%E2%80%934+%5Bp.+583%5D.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2b06ea9ba9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2b06ea9ba9.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/09/turretin-leviticus-185-is-proof-that-god-promised-eternal-blessedness-to-adam/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>22. On the other hand, I can scarce satisfy myself in my attempts to remove some difficulties. For since (as we before proved) God does, by virtue of his natural goodness, most ardently love a holy creature, as the lively image of Himself, how can this his goodness destroy that image and undo his own work? “Is it good unto thee that thou shouldst despise the work of thine hands” without deserving such treatment? Job 10:3. If it was good and for the glory of God to have made a creature to glorify Him, will it be good and for the glory of God to annihilate that creature who thus glorifies Him; and thus in fact to say, ‘Thou shalt not glorify me forever?’ Besides, as God Himself has created the most intense desire of eternity in the soul, and at the same time has commanded it to be carried out towards Himself as its eternal good; is it becoming God to frustrate such a desire, commanded and excited by Himself? Further, we have said it was a contradiction to suppose God addressing Himself to a holy soul in the manner following: ‘Hunger after me, but thou shalt not enjoy me.’ Yet in the moment we conceive the holy creature just sinking into annihilation, it would, in consequence of that divine command, hunger and thirst after God without any hope of ever enjoying Him again. Unless we should choose to affirm, that God at length would say to that soul: ‘Cease longing for me any more; acquiesce in this instance of my supreme dominion, by which I order thee to return to nothing.’ But I own it surpasses my comprehension how it is possible a holy creature should not be bound to consider God as its supreme good, and consequently pant after the enjoyment of Him.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-008959d7e1" data-kw="">
<blockquote><p>So the love-tokens and testimonial rings and bracelets of the Husband, my love to the saints, my keeping of his word, my holy walking in Christ, being the works of his Spirit, which dwelt in Jesus Christ, are actu primo [the first act], in themselves, as infallible signs of the Bridegroom’s love to me; as the Beloved’s word who spake and said, ‘Arise, my love’: And if the spirations and breathings of the Spirit go not along, both the voice and the love-bracelets (for Christ is no more counterfeit in his love-tokens than in his word when He speaks as a Husband) are alike ineffectual to persuade the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (1647), pp. 98-99</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5f8500454e" data-kw="">
<blockquote><p>The donation of Ananias and Sapphira was made to God for the use of the poor, it lay not now in their power nor in the Churches to revoke and reverse that grant, wherein God became now to be interessed. We see this in marriage, published in the face of the Church, solemnized by consent of parties and parents, ratified by the action of the minister, and celebrated in the presence of many friends; the knot cannot be untied, no not by agreement of the parents, of the parties, of the minister, of the friends, and of the whole congregation, because marriage is not of the nature of a civil contract, but God is a party and hath a special hand in it, and whom God hath joined together let no man put asunder, or separate again without his consent. (Mt. 19:6)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Numbers</cite>, (London, 1618), pp. 704-705</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

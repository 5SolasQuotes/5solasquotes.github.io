<main class="wrap"><figure class="quote" id="q-ae6cf81d75" data-kw="">
<blockquote><p>Jesus comes, and what does John say? Look, there is the Lamb of God. If a lamb is innocent, then John too is a lamb. Was he not innocent as well? But then who is innocent? How innocent? All of us come from that transplant and that cutting, about which David sighs as he chants, In iniquity was I conceived, and in sins did my mother nourish me in the womb (Ps 50:7). Only that Lamb, therefore, did not come in such a way.

For, he was not conceived in iniquity, because he was not conceived from mortality, nor did his mother nourish him in sins in the womb; he whom a virgin conceived was born by a virgin, because she conceived by faith and accepted him by faith. So then, Look, there is the Lamb of God. This one does not have Adam’s heritage: he took Adam’s flesh, but he did not carry Adam’s sin. The one who did not take on sin from the lump that we are is the one who takes away our sin. Look, there is the Lamb of God; look, there is the one who takes away the sin of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies on the Gospel of John 1-40</cite>, (c. 406-20), trans. Edmund Hill, ed. Allan D. Fitzgerald, The Works of Saint Augustine: A Translation for the 21st Century, Volume 12 (Hyde Park NY: New City Press, 2009), 4.10, pp 93-94.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome.html">Rome</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eb601da6ae" data-kw="Sola fide Faith alone">
<blockquote><p>The reader now perceives with what fairness the Sophists of the present day cavil at our doctrine, when we say that a man is justified by faith alone (Rom. 4:2). They dare not deny that he is justified by faith, seeing Scripture so often declares it; but as the word alone is nowhere expressly used they will not tolerate its being added. … Does he not plainly enough attribute everything to faith alone when he disconnects it with works?</p></blockquote>

</figure><figure class="quote" id="q-5b5bb0e3ba" data-kw="Upon this rock">

</figure><figure class="quote" id="q-96e9c4f20c" data-kw="">
<blockquote><p>That objection of Durandus would have force if God rendered the reward to good works out of commutative justice; but since God has decreed to give rewards to those who work well out of distributive justice, it is not necessary that we properly give him anything. For neither do those who run for the prize give anything to the king, and yet the king is bound to give the prize to him who has outstripped the rest in the race. Let it stand, therefore, that the good works of the just merit eternal life out of justice, and so ex condigno.</p></blockquote>

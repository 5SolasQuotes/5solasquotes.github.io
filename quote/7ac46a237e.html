<main class="wrap"><figure class="quote" id="q-7ac46a237e" data-kw="">
<blockquote><p>God makes his Church a praise by ruling it accordingly to his own order: τάξιν, are the two great destroyers of the Church of God; it is equally prejudicial to the Church, not to be ordered at all, as to be ordered after the lusts &amp; wills of men; God (who is the God of order, &amp; not the author of confusion, but of peace, as in all the Churches of the Saints, 1 Cor. 14.33.) would have all things in all Churches, be done decently and in order, v. 40. now when all ordinances and offices are administered in the Church according as God hath ordered, then is that Church a praise in heaven and earth, with God and Saints. 1 Cor. 11.2. Now I praise you brethren that you remember me in all things, and keep the ordinances as I delivered them unto you.

And on the other side disorder or deflection from the rule of Christ, though but in one administration, is a blemish and doth detract from the Churches praise, as appears in the same chapter, v. 17. Now in this that I declare unto you, I praise you not, that you come together not for the better, but for the worse, and v. 22. What, have you not houses to eat and to drink in: or despise you the Church of God, and shame them that have not? what shall I say to you? shall I praise you in this? I praise you not; one aberration from the rule of Christ in the administration of this one ordinance of the supper of the Lord, casts a cloud upon this Churches glory, and causes a great diminution of their praise, therefore we must pray that God would help his Church in all things to keep the ordinances as they are delivered unto us: Ye that are the Lord’s Remembrancers, keep no silence, give him no rest, till he make his Church thus a praise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-newcomen.html">Matthew Newcomen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jerusalem’s Watch-men, the Lord’s Remembrancers: A Sermon Preached at the Abbey at Westminster, before both Houses of Parliament, and the Assembly of Divines, upon their Solemn Fast, July 7, 1643</cite>, (London: Christopher Meredith, 1643), pp 15-16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f7398ec5b3" data-kw="">
<blockquote><p>…take heed that you not act like the weak in Rom. 14. Those who were weak in the Christian Faith (v. 1) held excessive religious strictures and scruples, especially in practical matters, however inconvenient (v. 2). Their simplistic beliefs determined their actions, which set them apart from other Christians. They prided themselves in their strict living, self-denial and high standard (v. 2), taking what they thought was righteous grief, offense and scandal at things actually lawful (vv. 20–21), they not thinking them best or godly enough (vv. 4–5). They spoke ill of their Christian brothers, judged them (vv. 3–4, 16, even Paul implicitly), whom they saw as worldly, licentious and not devoted enough, though their brethren were equally devoted (v. 6) and actually stronger and more understanding in the truth than they (v. 14). The weak’s distinctives exemplified misplaced priorities, valuing certain external practices they considered to be religiously necessary above their brethren’s fellowship, and hence also above the fundamentals of “righteousness, and peace, and joy in the Holy Ghost,” in which the kingdom of God consists. (v. 17) The weak practically valued what they considered to be sanctification, and that in others, above other Christians’ faith and justification (v. 18), that they are accepted with God forever in Christ, and He will make them stand. (v. 4) It was not only the strong, but the weak as well that were deficient in following “after the things which make for peace, and things wherewith one may edify another.” (v. 19) If such a weak person began to teach their distinctives and seek to bind them on others, would not he be sectarian?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Extended Editor’s Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), pp. 185-86</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-e53542150b" data-kw="">
<blockquote><p>The Reformed acknowledge that the error of the Lutherans [consubstantiation], although it is quite crass, yet is not fundamental (like that of the papists is in their Mass), nor is it such that it ought to impede ecclesiastical communion among themselves and them, because it is acknowledged on both sides that all those communicating according to Christ’s precept receive spiritual communion with the whole Christ.</p></blockquote>

<blockquote><p>…but [nonconformists] will keep all loving correspondence with them [parish churches], and seasonably sometimes communicate with them to show their principles by their practice. For the benefit of Christian love and concord, may make it best for certain seasons to join even in defective modes of worship, as Christ did in the synagogues [such as with forms of prayer] and Temple in his time. Though the least defective must be chosen when no such accidental reasons sway the other way. And perhaps some nonconformists’ own administrations may be as defective as the Liturgy… 6. They prefer their own manner of worshipping God, as better than the Liturgy in their opinion, and therefore to be chosen when they may choose; but they account it not the only acceptable worship, but are present with you in spirit, desiring a part in the prayers of all true Christians in the world.</p></blockquote>

<blockquote><p>…hereafter at the great Day of Judgment it will be a part of the glory of God to manifest before men and angels how He did accept of those holy services that thou didst tender up to Him; when hypocrites shall be cast away and abhorred, and thou who hadst an upright, sincere heart shall be owned before God, and before men and angels at that great Day; and God shall say, ‘Well, it is a part of the glory of my holiness to make it appear that I have accepted of these holy things that these my poor servants have tendered up to Me.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Worship</cite>, ... (London: 1647) | Sermon 7, on Lev. 10:3, “I will be sanctified in them that come nigh Me.”, p. 120</span></figcaption>

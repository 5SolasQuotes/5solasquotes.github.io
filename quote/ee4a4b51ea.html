<main class="wrap"><figure class="quote" id="q-ee4a4b51ea" data-kw="">
<blockquote><p>Regarding the nature of free will; it suffices that from the previous judgment of the practical intellect, it chooses one of the opposites, while still being able to choose the other from a different judgment of the same intellect; because, namely, the root and foundation of free will lie in the intellect, insofar as it can consider various aspects of good in opposites and propose them to the will. But the nature of free will does not include that while the free agent chooses from previous judgment, it is not moved by a superior cause to judge and choose so. Therefore, since the divine motion predetermining the will does not hinder a person from having full and perfect judgment of reason and judging that one means is contingent and the other is necessarily connected to the end, and could also choose otherwise from a different judgment, it follows that such a motion does not harm the freedom of our will. For it is proper to the uncreated will to have its choice from no prior cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan</cite>, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘How Divine Concurrence can be Reconciled with Free Will’, pp. 339-42 Latin Le Blanc (1614-1675) was a French reformed professor of theology at Sedan. | XXIII. To this, he responds:</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-858e5287fa" data-kw="Author of sin">
<blockquote><p>There is a fallacy of the accident in the minor proportion; for the actions of the wicked are sins, not (per se) in themselves, in as far as they are actions; but by an accident on account of the want of righteousness, and of the perversity of the will of the ungodly, who do not observe this so as to follow in the action the will of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, Q. 27 (on providence)</span></figcaption>

</figure><figure class="quote" id="q-e2c0347ac9" data-kw="">
<blockquote><p>I first note that Thomas in this matter taught exactly the same as Scotus with regard to premotion and the determination of the secondary cause by the first, in general. In particular, however, Scotus expressly rejected that physical predetermining quality and a similar influence through something else impressed antecedently in the free will — which many Thomists posited, because Thomas manifestly neither posited nor rejected it, from which they took occasion to introduce it. But Thomas, if my judgment carries any weight, never required it; nor could I find a place in him where he would admit it. And this I have often publicly affirmed in the very presence of Thomists. Therefore I hold that Thomas and Scotus are in agreement on excluding that quality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo’s Judgment</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

<blockquote><p>[Thomas:] ‘God moves all things according to the mode of each… But man, according to his proper nature, has it that he is of free choice; and therefore in one who has the use of free choice, there is no motion from God toward justice without the motion of free choice.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-fa89377c4b" data-kw="">
<blockquote><p>It is asked, do the Remonstrants rightly ascribe to us that God forsakes us before we forsake Him? I respond: Calumniously. For if the discussion is about desertion by way of merit, we forsake God first: 1. Because the merit of sin precedes punishment. 2. Because God, punishing antecedent sins by subsequent ones, punishes by forsaking sinners. But if the discussion is about desertion purely negative and not culpable, by which God denies predetermining grace, which he owes to no one; then God forsakes us before we forsake Him: 1. Because God withdrew from Adam predetermining grace (or as Calvin calls it in his Response to the Calumnies of a Certain Worthless Fellow, p. 1016, ‘fortitude and constancy’), which, if given, he would have stood. 2. Because grace would not be grace, if it depended on the nod of free will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. by AI by Onku (1639-1642; 1668), ch. 13, on Rom. 7:17, p. 380</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

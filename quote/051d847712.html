<blockquote><p>[I]n this present life there is no greater joy or contentment, nothing more certain or necessary for rising above all the difficulties we face, than to know and feel that we are children of God. When this foundation is laid, we can be sure that all that happens to us in some way a blessing of the heavenly Father. It is a means, an aid, a path that in his providence he has prepared either to lead us toward eternal life or to increase our glory in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-taffin.html">Jean Taffin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marks of God’s Children</cite>, trans. Peter Y. De Jong, ed. James A. De Jong (1588; Grand Rapids MI: Reformation Heritage Books, 2003), p. 35.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2c3f0e6b60" data-kw="">
<blockquote><p>Some confine faith to the understanding, and make it no more but a firm assent of the understanding to the truth of God. It is the faint and languid definition which Bellarmine and too many with him give to faith — a definition which barreth confidence and personal application from the nature of faith.

Others will acknowledge no other faith but a certain confidence, without the least wavering that Christ is ours and his merits, and exclude from the number of the faithful all such as doubt. Both are in fault and run to opposite extremes.

As for that faith confined to the assent of the understanding, if we must only believe that St. Luke and St. John have truly related the history of Christ’s passion, and must not attempt to lay our whole trust on the merit of it, nor apply it to ourselves for fear of presumption, certainly we are in an ill case—in no better case than the devil, for he believeth the truth of God’s promises, but dares not apply them to himself.

And as for the full confidence in God’s mercy through Jesus Christ without any doubting, it is indeed the highest degree of faith, if it be upon good ground. Blessed and holy is he that hath that right confidence. And then it will be right when it worketh love, humility and repentance in the heart. That full confidence we must all aim unto and never leave till we obtain it. But as handsomeness and strength are not the essence but the perfection of man’s body, likewise a full confidence of our salvation upon good ground is not the essence but the perfection of faith.

So that as you would not deny a child or a lame man to be a true man; likewise you must not deny a trembling or a halting faith to be a true faith when a good soul saith, “Lord, I believe, help thou my unbelief” [Mark 9:24]. For observe that he that spake so, obtained of the Lord what he would have. To teach us that the humble penitent soul that can but take his recourse unto Christ hath faith enough to obtain his mercy.

These two acts of faith must be distinguished: the direct act, which embraceth the mercy of God through Jesus Christ; and the reflected act, which is the assurance and comfort that the soul feeleth by embracing the mercy of God in Jesus Christ.

The justifying act of faith is the direct act, not the reflected. For it is evident that we are justified before God because we embrace the mercy of God through the merits of Jesus Christ, not by the assurance and comfort arising out of it in our consciences. Wherefore it is a very ill consequence to say, I have no comfort, therefore I have no faith; for you are not justified by your comfort in God’s mercy through Jesus Christ but by our recourse to it. Were this well apprehended, it would ease many troubled consciences. “Come unto me,” saith Christ, “all ye that labour and are heavy laden” Matth. 11:28. Coming to Christ with a contrite heart, labouring and heavy laden, is believing on him; and many believe to salvation that believe not yet to comfort.

In effect coming to Christ in the style of Christ is believing on him. “Him that cometh to me, I will in no wise cast out,” saith he, John 6:37. And two verses before, “He that cometh to me shall never hunger, and he that believeth in me shall never thirst.” So in the sense of the Lord Jesus, coming to him and believing on him are all one. And they that come to him as the true and sole object of their faith are certainly justified, though they be not presently comforted. They are justified by faith when they believe not their own faith.

Let us be disciples of the disciples of Christ, learning of them to pray to him: “Lord increase our faith” [Luke 17:5]—there being no essential want in the world (either for the spiritual or the temporal) but comes for want of faith. Let him that mistrusteth God’s mercy have recourse nevertheless unto that mercy. Let him hope against hope. Let him wrestle, as Jacob, by a holy obstinacy, and not let the Lord go till he hath got a blessing</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-du-moulin.html">Peter Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Add to Your Faith Virtue (1684) in Mid-American Journal of Theology</cite></span></figcaption>

</figure><figure class="quote" id="q-8e85739b7f" data-kw="">
<blockquote><p>A man may be really justified before God, and yet not have the evidence or assurance of it in his own mind; wherefore that evidence or assurance is not of the nature or essence of that faith whereby we are justified, nor does necessarily accompany our justification. But this manifestation of a man’s own justification unto himself, although it depend on many especial causes, which are not necessary unto his justification absolutely before God, is not a second justification when it is attained; but only the application of the former unto his conscience by the Holy Ghost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>

</figure><figure class="quote" id="q-21abc6618b" data-kw="">
<blockquote><p>Now he gave us that sure communion with himself, when he testified through the preaching of the gospel that he had been given to us by the Father to be ours with all his benefits [Rom. 8:32]. We are said to put on him [Rom. 13:14], to grow together into him [Eph. 4:15], that we may live because he lives. Frequently this doctrine is repeated: that the Father did not spare his only-begotten Son [cf. Rom. 8:32; John 3:15] “that whoever believes in him may not perish” [John 3:16]. But “he who believes in him” is said to have “passed out of death into life” [John 5:24]. In this sense, he calls himself “the bread of life” [John 6:35]; he who eats this bread will never die [John 6:51, 58]. He, I say, was our witness that the Heavenly Father will count as his sons all those who have received him in faith. If we desire anything more than to be reckoned among God’s sons and heirs, we have to rise above Christ. If this is our ultimate goal, how insane are we to seek outside him what we have already obtained in him, and can find in him alone? Moreover, since he is the eternal wisdom of the Father, his unchangeable truth, his firm counsel, we ought not to be afraid of what he tells us in his Word varying in the slightest from that will of the Father which we seek. Rather, he faithfully reveals to us that will as it was from the beginning and ever shall be. The practice of this doctrine ought also to flourish in our prayers. For even though faith in election prompts us to call upon God, still, when we frame our prayers, it would be preposterous to thrust this upon God or to bargain upon this condition: “O Lord, if I have been chosen, hear me.” For it is his will that we be content with his promises, and not inquire elsewhere whether he will be disposed to hear us. This prudence will free us from many traps if we know how to apply to a right use what has been rightly written; but let us not inconsiderately draw out hither and thither what ought to be kept within limits.</p></blockquote>

— John Calvin, Institutes of the Christian Religion, ed. John T. McNeill, trans. Ford Lewis Battles, vol. 1 &amp; 2, The Library of Christian Classics (Westminster John Knox Press, 2011), 3.24.5.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+he+gave+us+that+sure+communion+with+himself%2C+when+he+testified+through+the+preaching+of+the+gospel+that+he+had+been+given+to+us+by+the+Father+to+be+ours+with+all+his+benefits+%5BRom.+8%3A32%5D.+We+are+said+to+put+on+him+%5BRom.+13%3A14%5D%2C+to+grow+together+into+him+%5BEph.+4%3A15%5D%2C+that+we+may+live+because+he+lives.+Frequently+this+doctrine+is+repeated%3A+that+the+Father+did+not+spare+his+only-begotten+Son+%5Bcf.+Rom.+8%3A32%3B+John+3%3A15%5D+%E2%80%9Cthat+whoever+believes+in+him+may+not+perish%E2%80%9D+%5BJohn+3%3A16%5D.+But+%E2%80%9Che+who+believes+in+him%E2%80%9D+is+said+to+have+%E2%80%9Cpassed+out+of+death+into+life%E2%80%9D+%5BJohn+5%3A24%5D.+In+this+sense%2C+he+calls+himself+%E2%80%9Cthe+bread+of+life%E2%80%9D+%5BJohn+6%3A35%5D%3B+he+who+eats+this+bread+will+never+die+%5BJohn+6%3A51%2C+58%5D.+He%2C+I+say%2C+was+our+witness+that+the+Heavenly+Father+will+count+as+his+sons+all+those+who+have+received+him+in+faith.+If+we+desire+anything+more+than+to+be+reckoned+among+God%E2%80%99s+sons+and+heirs%2C+we+have+to+rise+above+Christ.+If+this+is+our+ultimate+goal%2C+how+insane+are+we+to+seek+outside+him+what+we+have+already+obtained+in+him%2C+and+can+find+in+him+alone%3F+Moreover%2C+since+he+is+the+eternal+wisdom+of+the+Father%2C+his+unchangeable+truth%2C+his+firm+counsel%2C+we+ought+not+to+be+afraid+of+what+he+tells+us+in+his+Word+varying+in+the+slightest+from+that+will+of+the+Father+which+we+seek.+Rather%2C+he+faithfully+reveals+to+us+that+will+as+it+was+from+the+beginning+and+ever+shall+be.+The+practice+of+this+doctrine+ought+also+to+flourish+in+our+prayers.+For+even+though+faith+in+election+prompts+us+to+call+upon+God%2C+still%2C+when+we+frame+our+prayers%2C+it+would+be+preposterous+to+t

<main class="wrap"><figure class="quote" id="q-653a77f1d8" data-kw="">
<blockquote><p>Whereas there be extant many Editions of the Bible in divers languages, as the Hebrew, Greek, and Latin, &amp; other proper tongues, it is a question which of these must be reputed for authentical? I answer, the Hebrew edition of the old, and the Greek of the new Testament, is authentical; &amp; so must be accounted: so that all things are to be determined by these, &amp; all other editions must be approved so far as they agree with these. We will therefore first speak of the Hebrew edition of the old Testament: we avouch then, that the Hebrew edition of the old testament is authentical. This proposition shall have his confirmation, after we have given a short preface touching the Hebrew tongue, and the writing of the old testament in that language, and the preservation of these books of the old testament, written in the Hebrew tongue to this day.

The Hebrew tongue was the first, and the only language on earth to the flood, and to the building of the tower of Babel, Gen. 11. 1. 9. The whole earth was of one language, and of one speech, or had the same words. At the building of Babel began the confusion of languages, and from the Hebrew, as from the mother of all the rest, all other tongues had their first beginning: for all other languages are nothing else in a manner, but as Dialects to the Hebrew tongue, of which some resemble their mother more then other: some be more estranged from her.

In that confusion of tongues, the Hebrew was preserved as the womb or mother (as Hierome speaketh) of all the rest; this was preserved (I say) in the family of Heber, who was the fourth from Noah, and lived that very time that the tower of Babel was built, and when the confusion of languages began. The Hebrew tongue then was so called first of Heber, &amp; from him it came to his posterity, not to all, but to them only of whom came Abraham: and from him continued to the very last of all the Prophets: for Haggai, Zacharias &amp; Malachi wrote their prophecies in this very language. Thus far of the Hebrew tongue.

The old testament was written first in this Hebrew and holy tongue. The first writer was Moses: the prophets followed him: of whom some wrote before the captivity; some in the captivity; some after the captivity: and they writ all in Hebrew, except Daniel and Ezra, which wrote some things in the Chaldee tongue. And this letteth not but that we may say, that all the old testament was written in the Hebrew tongue, for that the Chaldee and Hebrew have no great diversity.

Now to speak of the preservation of these books of the old Testament: the books of Moses &amp; the prophets, that is, the old Testament written in Hebrew, was kept by the admirable providence of almighty God unto this day. They were preserved (I say) in most perilous &amp; hard times, as in the burning of the city and of the temple of Jerusalem, in the captivity, &amp; in that most grievous persecution of Antiochus Epiphanes: for he raged also against these very books; &amp; in the great persecutions which were after Christ, under the Roman Emperors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of God’s effectual calling</cite>, trans. Henry Holland (London: Felix Kingston, 1603), pp 90-92.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6165730314" data-kw="">
<blockquote><p>Ever since the Scripture was written, the generality of the church was obliged to attend thereunto alone, as their only rule of faith and obedience. And although God reserved unto himself a liberty under the Old Testament, and until the completing of all the books of the New, to add new revelations as he pleased, yet he always bound up the faith and obedience of the present church unto what he had already revealed. And he hath now, by the Spirit of his Son, put an end unto all expectation of any new, of any other revelations, wherein the faith or obedience of the church should be concerned; at least, we take it for granted in this inquiry that infallible inspirations in the discovery of things not before revealed are ceased in the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, ch. 2</span></figcaption>

</figure><figure class="quote" id="q-4c3c4a994e" data-kw="">
<blockquote><p>You have, moreover, before you can consistently reject the divine authority of the Bible, to account for the fact that so many different persons as were concerned in writing it, living in different ages, in various states of society, and in circumstances to preclude the possibility of collusion, could have produced a book between whose various parts there is the most perfect, though evidently on their part the most undesigned, harmony.

If all the letters of which the Bible is composed were to be separated from each other, and thrown promiscuously into the air, and should fall to the earth in precisely the order which they originally held, making a regular and complete book, it would not be a greater anomaly in human experience, than would be found in the fact that such a book as the Bible is, in respect to the harmony of its parts, should have been made in the circumstances in which it was made, independently of divine inspiration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-sprague.html">William Sprague</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Young People (3rd edn, New York: D. Appleton &amp; Co., 1835), p. 66.</cite></span></figcaption>

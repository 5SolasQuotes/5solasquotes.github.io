<main class="wrap"><figure class="quote" id="q-11aad528b3" data-kw="">
<blockquote><p>Assertion 7. Not any protestant divines I know make true repentance a work of the Law, going before faith in Christ. 1. The Law speaks not one word of repentance, but says either do or die. Repentance is an evangelic ingredient in a saint. 2. Christ was made a Prince and exalted to give repentance, Acts 5:31, and the Law, as the Law, has not one word of Christ, though it cannot contradict Christ, except we say that there be two contradictory wills in Christ, which were blasphemy; but some dispositions before conversion I conceive Antinomians yield to us. For one says, speaking of the manner of his conversion: ‘One main thing, I am sure, was to get some soul-saving-comfort; that moved me to reveal my troubled conscience to godly ministers, and not in general to allay my trouble.’ Yet I can make good from Scripture that this desire can be in no unconverted soul; a physician that mistakes the cure doctrinally will prove a cousening [deceiving] comforter. And another says: ‘The persons capable of justification are such as truly feel what lost creatures they are in themselves and in all their works: this is all the preparative condition that God requires on our part to this high and heavenly work, for hereby is a man truly humbled in himself, of whom God speaks, saying, ‘I dwell with him that is of an humble spirit, etc. [Isa. 57:15]’ To make persons capable of justification, here is required a true feeling that they are lost in themselves and in all their works. But this can be no preparative condition of justification, as Eaton says, because: [1.] True feeling must follow faith, not go before it. 2. And true feeling is proper to justified persons, nothing going before justification, and so, [that] which is found in unjustified persons, can be proper to justified persons only. 3. Antinomians say, ‘Sinners as Sinners, and consequently all sinners’ are to believe justification in Christ, without any foregoing preparation. This man says, ‘Prepared and feeling persons that are sensible of sin, are only capable of justification.’ 4. To truly feel a lost condition cannot be all the preparative condition, for the Word has annexed no promise of justification to the unjustified who shall feel his lost condition. For the place Isa. 57 speaks of a justified sinner, not of an unjustified [person] who is only prepared for justification: 1. Because God dwells in this humbled soul, then He must be justified and converted. Eph. 3:17, ‘That Christ may dwell in your heart by faith.’ 2. This is a liver by faith, and so justified; ‘The just shall live by faith,’ Hab. 2:4; Rom. 1:17; Gal. 3:11; Heb. 10:38; and he must live by faith whom the high and lofty One revives.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), pp. 244-45</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2fbccd16de" data-kw="">
<blockquote><p>Hence it [repentance, resipiscentia] partly precedes faith and partly follows it. It precedes with regard to the knowledge of sin and punishment, contrition from each sense and the despairing of one’s own powers (Isa. 66:1-2; Mt. 5:2-6; Acts 2:37). It follows [faith] with regard to conversion, or the change from bad to good (2 Cor. 7:10; Acts 20:21; 26:18).</p></blockquote>

</figure><figure class="quote" id="q-9aa4368dc7" data-kw="">
<blockquote><p>And therefore, lastly, in answer to diverse places of the ancients which are produced to confirm the modern sense of justification by faith alone, I answer in a word: That it is true, their words seem to attest so much, but their meaning was plainly no more than this: That faith many times does justify without works, that is, any outward manifestation of their faith, by such fruits: but never without inward acts of repentance and charity distinct from this special faith: nor without such a devotion to good works, which wants nothing but opportunity to exert them; which is by an extraordinary clemency and grace of God, accepted for the thing itself. This appears by the example by them given, to manifest their meaning, of the thief on the cross; who was so justified and saved by faith alone, without good works answerable thereunto, because his sudden faith was prevented by sudden death. Nevertheless, that his faith was so much alone as to exclude repentance, and such graces as were compatible to one in his condition, from a proportionable concurrence to that effect, is nowhere said, nor intended by any of the fathers whose judgment is of account in the Church of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-scrivener.html">Matthew Scrivener</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Course of Divinity</cite>, ... (London: Roycroft, 1674), pt. 1, bk. 1, ch. 20, p. 76</span></figcaption>

0answer%20to%20diverse%20places&amp;text=is%20of%20account%20in%20the%20Church%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Metanoia-inchoate is anterior to faith, completed posterior. Thus metanoia considered according to the act of contrition is anterior to faith, according to the act of conversion, posterior. And so in a diverse respect metanoia is and is not anterior to faith, without contradiction.</p></blockquote>

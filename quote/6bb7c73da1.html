<main class="wrap"><figure class="quote" id="q-6bb7c73da1" data-kw="">
<blockquote><p>What shall I speak of such a clergy? who instead of praying that God would make his Church a praise, have endeavoured nothing more then to rob the Church of all that might make it praiseworthy, instead of desiring that the Church might enjoy fullness of ordinances, endeavouring to strip the Church of them all; to abolish Sabbaths, to bring the delight of days, the Queen of days under the curse of Job’s birthday, Let it not be joined to the days of the year, let it not come into the number of the months; to excommunicate preaching and praying, and cast them quite out of the Church; to turn the sacrament of the Lord’s supper into a sacrifice of the altar; Instead of praying that all ordinances and offices might be administered according to Christ’s rule and order, would have all things in God’s house &amp; worship done according to their own fancy, will, lust, humour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-newcomen.html">Matthew Newcomen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jerusalem’s Watch-men, the Lord’s Remembrancers: A Sermon Preached at the Abbey at Westminster, before both Houses of Parliament, and the Assembly of Divines, upon their Solemn Fast, July 7, 1643</cite>, (London: Christopher Meredith, 1643), pp 22-23.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

>Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7a683267a2" data-kw="">
<blockquote><p>There is in Isaiah 58:13, a passage which embraces in a few words, a summary exposition of that part of the law, which requires abstinence from the ordinary employments of the week. It consists in “not doing thine own ways, nor finding thine own pleasure, nor speaking thine own words.” Six days are ours in distinction from the seventh, which God calls his own, because on those days we are permitted to give our attention to what is necessary for our temporal well-being and comfort. Our “own ways,” therefore, are not those which are at all times sinful, but those lawful ways which we pursue by God’s authority six days of the week. These are to be suspended on the Sabbath, that we may devote ourselves to those ways which are God’s distinctively from our own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-holmes-agnew.html">John Holmes Agnew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Manual on the Christian Sabbath</cite>, (Philadelphia PA: Presbyterian Board of Publication, 1852), p. 142.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-4d15f33f96" data-kw="">
<blockquote><p>But mark what a cure God in wisdom and mercy has provided for us: As it is but one day in seven which is thus to be wholly employed with God, and as much of this day is taken up with the bodily necessaries aforesaid, so for the rest, God appoints us variety of exercises, that when we are weary of one, another may be our recreation. When we have heard we must pray, and when we have prayed we must hear again: We must read, we must sing and speak God’s praises, we must celebrate the memorial of Christ’s death in the sacrament; we must meditate; we must confer, we must instruct our families: and we have variety of subjects for each of these. As a student that is weary has variety of books and studies to recreate his mind, so has every Christian variety of holy employment on the Lord’s day. And all of it [is] excellent profitable and delightful!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 110-27 of ch. 10, ‘How the Lords day should not be spent: Or, What is unlawful on it?’ in The Divine Appointment of the Lords’ Day Proved (1671), pp. 122-23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

l="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c62361e910" data-kw="">
<blockquote><p>It should always be seen to that the song should not be light and frivolous, but that it have weight and majesty, as saith St. Augustine; and also that there is a great difference between the music that is employed for the enjoyment of men at table, and in their houses, and the psalms which they sing in church in the presence of God and his angels. But when the form here given is rightly judged of, we hope that it will be found holy and pure; seeing that it is simply constructed for the edification of which we have spoken, as well as that the use of singing may be greatly extended. So that even in the houses and in the fields, it may be to us an incitement and an instrument or means to praise God and raise our hearts to him; and to console us in meditating on his power, goodness, wisdom, and justice, which is more necessary for us than we know how to express. …This present book [the Genevan Psalter, 1543], for this cause, besides what otherwise has been said, ought to be particularly acceptable to every one who desires, without reproach, and according to God, to rejoice in seeing his own salvation, and the good of his neighbours; and thus has no need to be much recommended by me, as it carries in itself its own value and praise. Only let the world be well advised, that instead of songs partly vain and frivolous, partly foolish and dull, partly filthy and vile, and consequently wicked and hurtful, which it has heretofore used, it should accustom itself hereafter to sing these heavenly and divine songs, with good king David.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Preface to the 1543 Genevan Psalter</span></figcaption>

<blockquote><p>9. Yet in cases of necessity God has given great liberty unto us, to do many things for the preservation and comforts not only of the beasts and dumb creatures, but especially of man. Not only when he is weak and sick, but being healthful and strong, both in the works of our callings, and also of recreations, without which necessity we are persuaded that men ought ordinarily to cease from them.</p></blockquote>

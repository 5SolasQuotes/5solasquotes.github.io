<blockquote><p>…and therefore because they missed of the time, their misery was great on them… there is a time for a man to come in and take the offer that Christ makes, a time when He is kind and gentle, and ready to receive us; if we know not this time, and so overslip it, our misery will be great upon us. Now then it is very requisite to know and find out this time, because if we choose God’s time, God will join with us in the work, and so it will be done with ease… Now if you will open when Christ knocks at the door, hearken to the motions of the Spirit, and blow them and nourish them, and it will be done with much ease; but if you miss this time, your misery is great; you may desire, and cry, and pray, and never the better, Eccl. 9:12. For a man also knows not his time…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-preston.html">John Preston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Saints’ Infirmities, Delivered in Several Sermons</cite>, ... (London: Okes, 1636), 2nd Sermon, on Mt. 12:18-20, pp. 132-36</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-afc27d8b3a" data-kw="">
<blockquote><p>II. Secondly, there is a conviction of conscience that brings with it some overpowering, some more, some less, some for one end, some for another. I say, some overpowering. In that dispute about the resistibility or irresistibility of grace, as far as I can see into the dispute, this distinction might be useful and advantageous toward the determining of it, viz. to consider what the Spirit of God does to the heart by way of trying it, and what it does with intent and resolution to overpower it. The former part of the distinction you have in Ex. 20:20, ‘Fear not, for the Lord is come to prove,’ or try, ‘you.’ The latter in Isa. 26:11, ‘They will not see, but they shall see and be ashamed.’ The former in Rev. 3:17, Christ stands at the door and knocks, to try whether He shall be entertained. The latter in Eze. 22:14, ‘How can thy heart endure and thy hands be strong in the day that I shall deal with thee, when I break in resolved to overpower thee?’ As in that blasted conviction I spake of before, there was a trying but no overpowering, so there is some overpowering conviction also, that is but for trial…. So that was a very overpowering conviction upon the conscience of Herod, that made him reverence John Baptist, and to hear him gladly and to do many things according to his doctrine; but it was far from attaining the utmost end of conviction: it was only by way of trial, whether he would come up to the utmost end or no. This conviction neither they in the text, nor Herod could resist, for conviction brake in, whether they would or no; but the ultimate operation of conviction they resisted; because in this conviction the Spirit of God did only try them, not resolved to overpower them to the utmost fruit and effect of conviction… For the first, it is well known how God tried the hearts and consciences of Pharaoh and the Egyptians, by Moses’ words and miracles, and how again and again He in some degree did overpower them; but still they resisted and came not up to the proper and ultimate effect of conviction, to own and to do their duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of the Reverend &amp; Learned John Lightfoot</cite>, … (London: Scot, 1684), ‘A Sermon preached at Hertford Assize, March 17, 1664’, on Jn. 8:9, pp. 1083-84</span></figcaption>

</figure><figure class="quote" id="q-d966461caf" data-kw="">
<blockquote><p>It is the voice of my beloved that knocketh, saying, Open to me. This is another sudden apprehension, and sensible acknowledgement of the Church’s, to which she is quickened and excited by the strong and mighty calls and pulsations, by which Christ endeavors to awaken her; whose voice she cannot but know and confess, though she be not so dutiful as she ought to be in obeying it; and therefore she does here aggravate and bewail her fault, which is so much the greater because of his importunity, and tender vehemency for admission: For when Christ calls, and knocks, and begs at the door of our souls to enter, what vile ingratitude is it to shut Him out? When He solicits and entreats so many ways; by his Word and ministers; by his rods and corrections (which have their voice, Mic. 6:9) by his mercies and kindness, but chiefly by the constant admonitions, and provocations, and motions of his Spirit; what inexcusable, obstinate madness is it to deny and drive Him away? Is anything so worthy to be harbored there, as He is? And is it not an incomparable honor, that He will vouchsafe to come under our roof? Whosoever is shut out, sure he deserves an hospitable reception, who will come and sup with such as we are, and brings his feast along with him. Aperi Christo sed extraneis claude, seculo claude, etc. [‘Open to Christ, but to outsiders, shut, shut the world’], drive away and banish all things else, but give Him the best lodging. It is demanded, Can we open? Is it in our power? Has not He the keys Himself, and is not He the door Himself? Does not He shut and none can open? Yes, but when He bids you to open, He lends you a key; and when He infuses grace and says He enables you to open, it is his gift, but your grace; his inspiration, but your improvement: And oh! How blessed are they that are but his turn-keys, his door-keepers. Is there a greater honor, or happiness than to co-operate with God, in that which of all others is the most God-like work, the salvation of souls?</p></blockquote>

<blockquote><p>The second way He presses it, verse 20, is, by a most instant and importunate pursuing of His offer, with a protestation of his being there, and of his making the same. This is done four ways;

1. By showing His work and posture, I stand at the door and knock. Hearts are naturally as castles shut and guarded by the Devil against Christ: When He comes with His ordinances, He does thereby, as it were, lay a siege at them, and by His word knock at the doors thereof to gain their consent; and the more pungently he presses by His ordinances, He is said to knock the more: And in this respect, Song 5:2, His voice is said to knock at the believer’s door in their sleepy condition. Here these two things are imported:

1. Christ’s continuing to deal with His Church, and to wait upon her in His ordinances, notwithstanding of her many former refusals. Thus, He is said to stand at the door: Whereby is holden forth their ingratitude to him, in keeping of Him out, and His patience that still waits on.

2. In this, by the other word, is imported His growing more instant in His dealing with them: Therefore He is said to knock. And indeed if the former sharp threatening and charge, and the sweet free offer be considered, it may well be said that now His knocks are doubled. 2. The second way He presses in this verse, is, by making His offer particular, as it were, bringing it to every man’s door, If any man hear My voice, and open the door, etc.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The second way He presses it, verse 20, is, by a most instant and importunate pursuing of His offer, with a protestation of his being there, and of his making the same. This is done four ways;

1. By showing His work and posture, I stand at the door and knock. Hearts are naturally as castles shut and guarded by the Devil against Christ: When He comes with His ordinances, He does thereby, as it were, lay a siege at them, and by His word knock at the doors thereof to gain their consent; and the more pungently he presses by His ordinances, He is said to knock the more: And in this respect, Song 5:2, His voice is said to knock at the believer’s door in their sleepy condition. Here these two things are imported:

1. Christ’s continuing to deal with His Church, and to wait upon her in His ordinances, notwithstanding of her many former refusals. Thus, He is said to stand at the door: Whereby is holden forth their ingratitude to him, in keeping of Him out, and His patience that still waits on.

2. In this, by the other word, is imported His growing more instant in His dealing with them: Therefore He is said to knock. And indeed if the former sharp threatening and charge, and the sweet free offer be considered, it may well be said that now His knocks are doubled. 2. The second way He presses in this verse, is, by making His offer particular, as it were, bringing it to every man’s door, If any man hear My voice, and open the door, etc.”

— James Durham, Commentary on Revelation, 3:20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+second+way+He+presses+it%2C+verse+20%2C+is%2C+by+a+most+instant+and+importunate+pursuing+of+His+offer%2C+with+a+protestation+of+his+being+there%2C+and+of+his+making+the+same.+This+is+done+four+ways%3B+1.+By+showing+His+work+and+posture%2C+I+stand+at+the+door+and+knock.+Hearts+are+naturally+as+castles+shut+and+guarded+by+the+Devil+against+Christ%3A+When+He+comes+with+His+ordinances%2C+He+does+thereby%2C+as+it+were%2C+lay+a+siege+at+them%2C+and+by+His+word+knock+at+the+doors+thereof+to+gain+their+consent%3B+and+the+more+pungently+he+presses+by+His+ordinances%2C+He+is+said+to+knock+the+more%3A+And+in+this+respect%2C+Song+5%3A2%2C+His+voice+is+said+to+knock+at+the+believer%E2%80%99s+door+in+their+sleepy+condition.+Here+these+two+things+are+imported%3A+1.+Christ%E2%80%99s+continuing+to+deal+with+His+Church%2C+and+to+wait+upon+her+in+His+ordinances%2C+notwithstanding+of+her+many+former+refusals.+Thus%2C+He+is+said+to+stand+at+the+door%3A+Whereby+is+holden+forth+their+ingratitude+to+him%2C+in+keeping+of+Him+out%2C+and+His+patience+that+still+waits+on.+2.+In+this%2C+by+the+other+word%2C+is+imported+His+growing+more+instant+in+His+dealing+with+them%3A+Therefore+He+is+said+to+knock.+And+indeed+if+the+former+sharp+threatening+and+charge%2C+and+the+sweet+free+offer+be+considered%2C+it+may+well+be+said+that+now+His+knocks+are+doubled.+2.+The+second+way+He+presses+in+this+verse%2C+is%2C+by+making+His+offer+particular%2C+as+it+were%2C+bringing+it+to+every+man%E2%80%99s+door%2C+If+any+man+hear+My+voice%2C+and+open+the+door%2C+etc.%E2%80%9D%0A%0A%E2%80%94+James+Durham%2C+Commentary+on+Revelation%2C+3%3A20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd16b64007b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d16b64007b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=The%20second%20way%20He%20presses%20it,voice%2C%20and%20open%20the%20door%2C%20etc&amp;text=The%20second%20way%20He%20presses%20it%2C%20verse%2020&amp;text=hear%20My%20voice%2C%20and%20open%20the%20door%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>3. The next thing we exhort you to do, is to make choice for your own souls. That is Moses makes of it: Deut. 30:19, ‘Therefore choose life, that both thou and thy seed may live.’ Hearing, believing, considering, are all in order to choice; and without choice, and a determined, fixed, bent of the heart, you will never walk evenly in heaven’s ways. Determine not only that you must, but you will, walk in the way which God has set forth for you. God’s ways must be chosen: Ps. 119:30, ‘I have chosen the way of truth;’ and verse 173, ‘I have chosen your precepts;’ Josh. 24:15, ‘If it seem evil to you to serve the Lord, choose you this day whom you will serve.’ Not as if it were indifferent, but to set an edge upon their appetite. There is much strength in the bond, when a man binds himself freely, and makes the more inexcusable if he does not observe it. All will choose life before death, but they are out in the means; they do not choose good before evil, the good of holiness before the evil of sin. Every man desires some good. It is as natural for the reasonable creature to desire to be happy, as it is for the fire to bring us to that happiness that we desire. They would be happy, but they choose means quite contrary to happiness. Oh, then, choose the ways of God; let life be your motive, and holiness your choice. This is the way to live forever, to avoid hell beneath. As soon as we come to years of discretion, we should make our choice to go on in the ways of life. To this we are obliged by the most weighty reasons, urged by the enforcements of the word, and by the sad and numerous examples of young people, who make an ill choice in the beginning, and go on, and are hardened therein, and perish forever.</p></blockquote>

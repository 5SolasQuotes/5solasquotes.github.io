<main class="wrap"><figure class="quote" id="q-378a173592" data-kw="">
<blockquote><p>If the smelter in a foundry takes several days to reach its proper temperature, then it cannot be shut down every Lord’s day without shutting down the whole steel industry. Thus, at least a minimal crew is needed to keep the operation running through Sunday. But the benefits of steel for mankind (e.g., safer cars and buildings, the need for steel for the military) render it a necessity (wooden sailing ships would not have fared well against Japanese destroyers in the battles of the Pacific). Another example would be certain types of shipping. An oil tanker could not reach Japan from a port in Alaska in less than a week and thus would be in transit on the Sabbath (the shipping of oil is a necessity, since energy is needed for large populations to heat buildings and for generating electricity). God does not require people to deforest the countryside or freeze to death in order to keep the Sabbath. Power and electric utilities and telephone companies must maintain service on the Lord’s day. Hospitals, churches, homes, retirement communities and nursing homes need heat and electricity to preserve life and minister to the sick… The percentage of people working on the Lord’s day should be very small compared to those who work on a given week day. The vast majority of economic activities on the Sabbath in America are totally unnecessary and sinful (e.g., shopping malls, sporting events, restaurants, movie complexes, newspapers, retail outlets). Those industries which require sabbath labor should rotate staff…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brian-schwertley.html">Brian Schwertley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Sabbath &amp; Modern Industrial Civilization: A Critique of Gary North’s ‘The Economics of Sabbath Keeping”</cite>, (1999) 6 pp., p. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-16bd4886a2" data-kw="">
<blockquote><p>And in the seventh chapter [Jn. 7:23], He defends this fact of his, saying, ‘If a man upon the Sabbath receive circumcision, that the law of Moses should not be broken; be ye angry with Me, because I haue made a man every whit whole on the Sabbath day?’ If the law of circumcision do bind men to minister and receive it upon the Sabbath, then much more does the law of love bind men to show mercy upon the Sabbath, seeing that it is appointed of God, not to hinder us from, but to further us in all his works, among which the relieving of them that be in necessity, is one of the chief and principal. And as the Lord Jesus Christ came not to destroy the law, but to fulfill it, so He observed it very carefully in this point, and being most full of compassion, did declare it abundantly, by taking all oportunity to succour them that were in misery, even upon the Sabbath, as the fittest time for it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-bownd.html">Nicholas Bownd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath Plainly Laid forth</cite>, … (London, 1595), | pt. 2, p. 249</span></figcaption>

</figure><figure class="quote" id="q-210141a3e0" data-kw="">
<blockquote><p>Therefore, if the activity is conducive to worship, then it is lawful. We cannot ignore the human conscience here either, since an activity that might be conducive for worship to one person may not be conducive to worship for someone else. To take one example, it is certainly wise to let small children let loose some of their excess energy on the Sabbath (contrary to Laura Ingalls Wilder’s Farmer Boy! [below]). Otherwise, they will not be able to sit still and pay attention in worship. One does not have to take the attitude of Almanzo Wilder’s father [in Farmer Boy] in order to have a Puritan view of what is acceptable on the Sabbath! It is certainly a work of necessity to do something about the energy of small children. We must avoid both extremes of legalism and antinomianism here, as well as everywhere in our treatment of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lane-keister.html">Lane Keister</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Sabbath Day &amp; Recreations on the Sabbath</cite>, …’ in Confessional Presbyterian, #5 (2009), p. 323</span></figcaption>

<blockquote><p>164th Session on May 17, 1619: 1. There is in the fourth commandment of the divine law a ceremonial and a moral element. 2. The ceremonial element is the rest of the seventh day after creation, and the strict observance of that day imposed especially on the Jewish people. 3. The moral element consists in the fact that a certain definite day is set aside for worship and so much rest as is needful for worship and hallowed meditation. 4. The Sabbath of the Jews having been abolished, the day of the Lord must be solemnly hallowed by Christians. 5. Since the times of the apostles this day has always been observed by the old catholic church. 6. This day must be so consecrated to worship that on that day we rest from all servile works, except those which charity and present necessity require; and also from all such recreations as interfere with worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/continental-primary-sources.html">Continental Primary Sources</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Synod of Dort</cite>, As cited in Howard B. Spaan, Christian Reformed Church Government (Grand Rapids, MI: Kregel Publications, 1968), p. 208</span></figcaption>

</figure><figure class="quote" id="q-c461bfde6e" data-kw="">
<blockquote><p>…as to the duties wherein the Sabbath is to be spent, which are shortly, all duties of immediate worship, whether they be inward, as meditation, self-examination, heart-prayer, either ejaculatory or more continued, heart-sorrow for sins, etc. or outward, as vocal prayer and singing of psalms, reading the Scriptures and other pious books, hearing the Word, etc.; or whether they be secret which may be both inward and outward, or private in families, as reading of the Word, confering on it, repeating sermons, praying together, etc. or public, as joining with the congregation in prayers and praises, hearing the Word read and the sense given, hearing of sermons, participating of the sacraments when dispensed, joining in solemn humiliations and thanksgivings when they fall necessarily or more conveniently to be on the Sabbath; All which and such like are proper duties for that day; to which liberal laying up and giving for the relief of the poor according to ability and as God blesses every man would be added as a suitable duty of it, though it be no duty of immediate worship.</p></blockquote>

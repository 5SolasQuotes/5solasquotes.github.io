<main class="wrap"><figure class="quote" id="q-68f750ca2d" data-kw="">
<blockquote><p>If they object that place of James, ‘We are not justified by faith, but by works’: I answer that there is a double justification, there is a justification of the person: so was Abraham justified by faith, as Paul expresses it, Rom. 4. But then there is a second justification, a justification of the faith that Abraham had: he justified his faith by his works; he showed that he had not a dead faith, a liveless faith, a faith without works, but that he had a lively effectual faith: for he added works to his faith, his works wrought together with his faith. So that, if the question be, Whether Abraham was an hypocrite? his works justified him that he was none. If the question be, Whether Abraham was a sinner? his faith justifies him, and shows that he was made righteous through faith. So, there is a justification of the person, and a justification of the faith of the person: as when a man is said to justify such an action or such a cause, the meaning is not that he will make that just which was unjust before, but he will make it appear to be just; so Abraham was declared to have a justifying faith by that power and efficacy it wrought in him, in offering up his son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-preston.html">John Preston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Breastplate of Faith &amp; Love</cite>, … (London: for Bourne, 1630), 2nd Sermon, ‘Of Effectual Faith’, p. 68</span></figcaption>

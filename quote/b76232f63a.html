<main class="wrap"><figure class="quote" id="q-b76232f63a" data-kw="">
<blockquote><p>All the blessings purchased and bought by Christ’s blood, are bequeathed to us, and left, by him that shed it. Christ’s blood is a testamentary bequeathing blood: and believers in their coming to the throne of grace may come as suers for the execution and fulfilment of the last will and testament of our Lord Jesus. For Christ by his death turned the gospel and new covenant into a testament, Heb. ix. 15, 16, 17.

His death confirms his testament. His last will is, that all the blessings his blood purchased, might be secured and laid up for, and in due time given forth to them they were purchased for, and bequeathed to. The whole legacy of grace and glory, and all the legatees, are and were well known to the testator and executor, (though not to us particularly); and the testament will be punctually fulfilled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-traill.html">Robert Traill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons Concerning the Throne of Grace</cite>, (1696) in The Works of Robert Traill, A.M. Minister of the Gospel in London (4 vols, Edinburgh: J. Ogle, 1810), 1: 99.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

</figure><figure class="quote" id="q-f2eced120a" data-kw="">
<blockquote><p>Whether Christ suffered and died for every single man, none excepted? It is denied. Whether and in what sense the distinction between the sufficiency and efficacy of Christ’s death in this matter is to be admitted? It is explained. Whether therefore it is rightly able to be said that Christ died and satisfied as mediator and a sponsor for all sufficiently? It is denied. Whether Christ so died for all and every single man that he procured [impetrarit] for those reconciliation with God and the remission of sins? It is denied. Whether the death of Christ expiated the sin of Adam and original sin in all men, and even through that the whole human genus was assumed into the Covenant of Grace, and lastly sufficient grace was being acquired and communicated for faith and regeneration for all and every single man? It is denied, contra the Anabaptists, Puccius, Huber [a Lutheran], etc. Whether all and every single man is given from the Father to Christ? It is denied. Whether Christ on the cross bore up [in] the person of the elect ones? It is affirmed. Whether He neither was able or ought to have died for the elect? It is denied. Whether Christ was a priest for all men, even Pharaoh? It is denied. Whether the intercession of Christ is twofold, one, universal for all men, even unbelievers, the other for the particular faithful ones? It is denied. Whether Christ always achieves the end of his death? It is affirmed. Whether the proper and thus truly spoken end of Christ’s death is the application of reconciliation and the remission of sins? It is affirmed. Whether the procuring and application of reconciliation are not of equally wide extent, but are separable, so that reconciliation may not be applied to all for whom procuring has been wrought? It is denied contra the Remonstrants. … Whether the efficacy of the death of Christ in the production of faith and regeneration, or with respect to the event, stands wholly within us? It is denied. Whether God has prepared on his part to propose the word of reconciliation, secured through the death of Christ, to all and every man? It is denied. Whether the ransom (lutron) of Christ is sufficient even to redeem devils? It is denied. Whether all and every man ought to believe Christ has died for him, whether absolutely or even hypothetically? The latter is affirmed. [This might mean that every person ought to believe that Christ died for him on a certain hypothesis being posited, namely if he believes.] Whether, hence, all the impious are condemned because they did not believer Christ died for them? It is denied. Whether Christ’s death has been accomplishing out of the greatest love which He loved all those for which He died? It is affirmed. Whether the fruit of Christ’s resurrection, even of his ascension and session at the right hand, pertains to all and every one for whom He died? It is affirmed. Whether unbeleivers or impenitents are able to console themselves in the death of Christ? It is denied. Whether the Remonstrants [Arminians] in their second article defend the laud and glory of divine grace, and further, the efficacy of Christ’s merit, against us? It is denied: certainly they nowhere greatly overturn. Whether Christ fulfilled the law in our place by holy living? It is affirmed against the Socinians. Whether Christ fulfilled the law even for Himself, and was bound to fulfill, and further, hence, He merited for Himself? The former is affirmed, the latter is distinguished. … Whether the satisfaction for us being looked into is able to be the end of our faith? It is distinguished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems</cite>, (Utrecht, 1643), pt. 1, section 2 Abbr. | tract 3 | Of the Types of the Satisfaction of Christ On the End to Which of the Satisfaction &amp; Merit</span></figcaption>

<blockquote><p>It is enough to show it to be good and acceptable to God to pray for all that He is best pleased with, and prefers the salvation of all, as He at the first made all, and since sent his Son into the world to give Himself, as a ransom for all. But how can it be thus said either, seeing that if the ransom be payed for all, all are not delivered? To this it is generally answered, that Christ’s giving of Himself to the death was a ransom sufficient to save all men, according to the signification of the word αντίλυτρον [redemption], used to set forth the ransoming of captives, when one is given to death for the delivering of another. For Christ alone was worth all the world, and his death equivalent to the dying of all men by everlasting death. When therefore He gave himself to the death for us, He suffered on his part so much as was sufficient to save all men, that neither on the part of God, nor of Christ Jesus there might be any want [lack], but the want might be altogether in themselves in such as are damned. Christ died for all [in the sense of sufficiency described above], the Gospel is preached to all, and all enjoy the holy Sacraments, which are the means of salvation; but such, as are not hereby moved to faith and repentance, shall perish not withstanding through their own default…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Whole Bible</cite>, (London, 1631), vol. 1, pp. 495–98 on 1 Tim. 2:4-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is enough to show it to be good and acceptable to God to pray for all that He is best pleased with, and prefers the salvation of all, as He at the first made all, and since sent his Son into the world to give Himself, as a ransom for all. But how can it be thus said either, seeing that if the ransom be payed for all, all are not delivered? To this it is generally answered, that Christ’s giving of Himself to the death was a ransom sufficient to save all men, according to the signification of the word αντίλυτρον [redemption], used to set forth the ransoming of captives, when one is given to death for the delivering of another. For Christ alone was worth all the world, and his death equivalent to the dying of all men by everlasting death. When therefore He gave himself to the death for us, He suffered on his part so much as was sufficient to save all men, that neither on the part of God, nor of Christ Jesus there might be any want [lack], but the want might be altogether in themselves in such as are damned. Christ died for all [in the sense of sufficiency described above], the Gospel is preached to all, and all enjoy the holy Sacraments, which are the means of salvation; but such, as are not hereby moved to faith and repentance, shall perish not withstanding through their own default…”

— John Mayer, Commentary on the Whole Bible, (London, 1631), vol. 1, pp. 495–98 on 1 Tim. 2:4-6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+enough+to+show+it+to+be+good+and+acceptable+to+God+to+pray+for+all+that+He+is+best+pleased+with%2C+and+prefers+the+salvation+of+all%2C+as+He+at+the+first+made+all%2C+and+since+sent+his+Son+into+the+world+to+give+Himself%2C+as+a+ransom+for+all.+But+how+can+it+be+thus+said+either%2C+seeing+that+if+the+ransom+be+payed+for+all%2C+all+are+not+delivered%3F+To+this+it+is+generally+answered%2C+that+Christ%E2%80%99s+giving+of+Himself+to+the+death+was+a+ransom+sufficient+to+save+all+men%2C+according+to+the+signification+of+the+word+%CE%B1%CE%BD%CF%84%CE%AF%CE%BB%CF%85%CF%84%CF%81%CE%BF%CE%BD+%5Bredemption%5D%2C+used+to+set+forth+the+ransoming+of+captives%2C+when+one+is+given+to+death+for+the+delivering+of+another.+For+Christ+alone+was+worth+all+the+world%2C+and+his+death+equivalent+to+the+dying+of+all+men+by+everlasting+death.+When+therefore+He+gave+himself+to+the+death+for+us%2C+He+suffered+on+his+part+so+much+as+was+sufficient+to+save+all+men%2C+that+neither+on+the+part+of+God%2C+nor+of+Christ+Jesus+there+might+be+any+want+%5Black%5D%2C+but+the+want+might+be+altogether+in+themselves+in+such+as+are+damned.+Christ+died+for+all+%5Bin+the+sense+of+sufficiency+described+above%5D%2C+the+Gospel+is+preached+to+all%2C+and+all+enjoy+the+holy+Sacraments%2C+which+are+the+means+of+salvation%3B+but+such%2C+as+are+not+hereby+moved+to+faith+and+repentance%2C+shall+perish+not+withstanding+through+their+own+default%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+John+Mayer%2C+Commentary+on+the+Whole+Bible%2C+%28London%2C+1631%29%2C+vol.+1%2C+pp.+495%E2%80%9398+on+1+Tim.+2%3A4-6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6337527b5a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6337527b5a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-suf

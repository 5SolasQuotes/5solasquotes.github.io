<main class="wrap"><figure class="quote" id="q-cf0d788d9c" data-kw="">
<blockquote><p>It is certain, that in this the Roman Religion hath not the Character of an Evangelical Religion, in that to bring Men to Sanctity, she makes too much use of Terror. The Spirit of the Gospel is a Spirit of Sweetness. The Law of Moses had a hundred Threats for one Promise; but the Gospel hath a hundred Promises for one Threatening. Its Character is that of Debonairty. Men’s Souls must be drawn by Love, to oblige them to Love God. That is the true Principle of Sanctification. Though it were true, That Purgatory were capable of restraining Men, God hath no need of a Lie, for his help, to uphold his Truth, and to settle his Justice. …

We are obliged to nourish the peace of honest and pure Consciences, and of Souls truly penitent. They accuse us of lulling them asleep, and plunging them into Security. God is our Witness therein: We present to them just and lawful Terrors, by the sight of the Pains of Hell; but when they have escaped those Pains by a true Repentance, we would account a Cruelty to present to them other Pains of the same Nature, and declare them to be unavoidable.

If the Roman Church should teach this Dogma in good earnest, and that it were so believed: I maintain, it would be Impossible for their Faithful People to die without unimaginable Anguishes. A Moment in Purgatory is something more cruel than whole Years of the Gout, or Gravel, Colic, and all other Pains gathered together in some wretched Creature. How could a Man die with any tranquillity, being assured to fall into Torments so horrible and of so long continuance? If we must consider it as a Capital Crime, to make a poor Wretch suffer, without the Magistrates Order, Racks and dolorous Torments; We cannot behold it as a light thing to torment Souls so cruelly, without God’s Order, by the fear of an Imaginary Evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-jurieu.html">Pierre Jurieu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A preservative against the change of religion, or, A just and true idea of the Roman Catholick religion, opposed to the flattering portraictures made thereof, and particularly to that of my Lord of Condom</cite>, trans. Claudius Gilbert (London: Thomas Cockerill, 1683), pp 112-13.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-91c4cd3b52" data-kw="">

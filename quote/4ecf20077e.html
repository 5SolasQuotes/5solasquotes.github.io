<main class="wrap"><figure class="quote" id="q-4ecf20077e" data-kw="">
<blockquote><p>[Job 15:15] ‘For God finds not steadfastness in his saints (that is to say in his angels), neither are the heavens clean in his sight:’… For first and foremost they [men] had need to be cleaner and purer than the angels, and they had need to surmount the brightness of the sun and the stars, seeing that the heavens themselves are infected before God, if comparison should be made between them and Him… But there is another higher righteousness in God, which surmounts all creatures, insomuch as no angel is able to satisfy it. And no wonder at all: for what comparison is there between an infinite thing and a thing that has bounds? Behold, although the angels have great glory in them: yet are they but creatures. And what is God? He is an infinite thing, insomuch that when we think upon Him, we ought to be ravished into astonishment. So then let us not think it strange, that God’s righteousness should be so high that when all creatures come to that point, all that is to be found in them shall be nothing at all, but they shall deserve to be utterly wiped out… And so far are we unable to stand upright that the very angels of heaven are confounded there. And why? Because the very heavens themselves are not clean. For whereas God has created the sun to give light to the world, and given some brightness to the stars also: it follows not therefore that they have a divine perfection. We must remember what has been said afore: namely that all the creatures that God made do keep still some marks of his grace. But if a man would compare that which is in the creatures with that which is in God: he shall find that the one is all and the other is nothing. Thus ye see how the heavens are not clean, that is to say, that there is always some imperfection in the creatures, so as they have not the power to stand before God, as in respect of the infinite glory that is in Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Job</cite>, … upon the Book of Job (London: 1574), 2nd sermon on ch. 15, 58th Sermon, pp. 298-99</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3801e70079" data-kw="">
<blockquote><p>Must not he who will forbear communion with a Church till it be altogether freed from mixtures, tarry till the day of Judgment, till when we have no promise that Christ will gather out of his Church whatsoever does offend? This was it that amongst other reasons conquered the prejudices of that good man Mr. J. Allen and kept him from separation, of which we have this account. He knew of how great moment it was that the public worship of God should be maintained, and that its assemblies should not be relinquished, though some of its administrations did not clearly approve themselves unto him; because upon the account of some imperfections and pollutions in them, supposed, or real, to withdraw communion, is evidently to suppose ourselves joined before our time to the heavenly Assembly, or to have found such an one upon earth exempt from all mixtures and imperfections of worshippers and worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkins.html">William Jenkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jude</cite>, verse 19 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’, p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

%20who%20will%20forbear,and%20imperfections%20of%20worshippers%20and%20worship&amp;text=Must%20not%20he%20who%20will%20forbear%20communion%20with&amp;text=all%20mixtures%20and%20imperfections%20of%20worshippers%20and%20worship" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9659be1e80" data-kw="">
<blockquote><p>But if you will indeed continue as I see that you have begun, I now declare to you beforehand that it will come to pass that what has happened to other disturbers of the Churches may happen also to you and to all your followers (if there should be any)… namely, that you may learn too late that you have harmed no one more than yourself.</p></blockquote>

</figure><figure class="quote" id="q-b4b7c5b1a8" data-kw="">
<blockquote><p>Even after Joseph had died, they observed circumcision (as seems must be gathered from Ex. 4:25), and were also intent upon prayers (Ex. 2:23); they certainly desired sacrifices, but did not sacrifice, being deterred by fear of the Egyptians (Ex. 8:26), yet at the same time when about to flee they sacrificed the Passover in Egypt (Ex. 12). Besides those points, hardly anything is mentioned about their divine worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), bk. 8, ch. 2, sect. 25</span></figcaption>

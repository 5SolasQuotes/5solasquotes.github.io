<main class="wrap"><figure class="quote" id="q-ae450bebdf" data-kw="">
<blockquote><p>The upright man will love his native country. A country every man has. For every one there is some tract of land to which he can point with more than ordinary pleasure, and say, “there is my country.” He may call himself a citizen of the world, and such he may be as far as possible, but still there is one land, which his mind and memory favour above all others.

Famine may waste it, and the sword may devour, nevertheless “the magnet of his soul” will point to it. Brothers may prove to be monsters, and the archers may shoot at him, and hate him, but nothing can take away the magic from the words; “the land of my fathers.” So thought Joseph. Although he sat on the throne next to the King, he could not refrain from tears as his brethren led his mind over the scenes of his youth. …

Be interested in the political affairs of the nation, and see to it that your first and last votes are given in the fear of God, and for men who do not oppress, and enslave their fellow men. Refuse to vote for those, who will give honour to oppressors. O, brethren be faithful to your duty at the ballot box. There give expression to your prayers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/north-star.html">North Star</a></span><span class="wk"><span class="lbl">Work:</span> <cite>North Star</cite>, 12 May 1848.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dcb6304b89" data-kw="">
<blockquote><p>Instead then of listening to infidel counsel, and shutting up our churches at any of the wonted [accustomed] times of worship, let their doors be invitingly opened, and with frequency let sincere supplication, with humiliation and fasting, be presented to our merciful God. This is a duty which ought not to be perfunctorily performed; but one to which individuals, and families, and fellowships, and all other religious associations, are bound to attend, and in which they ought to abound, praying that a spirit of grace and of supplication may be poured out upon all; and that, by repentance and reliance on the efficacious atonement of our blessed Redeemer, God may be graciously pleased to hear and to heal. Jesus has given every encouragement to believing social prayer in his name: “ If two of you shall agree on earth as touching any thing that they shall ask. it shall be done for them of my Father which is in heaven.” Mat. xviii. 19. Let united, fervent, and believing supplication be sent up then to the throne of God, and we shall have reason to rejoice in the issue. Let it not be said of us as it is written against Asa, King of Judah, after all the Lord had done for him, who “ was diseased in Iris feel, until his disease was exceeding great; Yet in his disease lie sought to the Lord, but to the physicians.” 2 Chron. xvi. 12. But in the midst of abounding sin and alarming indifference, it is matter of the greatest consolation to each individual believer, that whatever becomes of the nation, his own faith and repentance will not pass unrewarded, if he truly put his trust and dependence on the living God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Cause of the Prevalence of Pestilence, and other judgments of God</cite>, (Paisley, 1832), p. 34. Begg (1808–1883)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-28a5d737cb" data-kw="">
<blockquote><p>I judge a free Parliament, the most natural Ordinance (and the nearest that Divine government which once was) for the true good of a Nation that would not be slaves to sin and man’s will, of any yet known, or in use in the world; and if my Judgement were of any weight in a business of this nature, I would think those the more unnatural to themselves and others, who otherwise speak and act amongst us. Our lusts would be Laws and Judges of them too, and may, as well one as tother; ’tis thus with us, ’tis thus with you; ’tis so in Divinity, ’tis so in morality, ’tis so in the first Table, ’tis so in the second.

Christ meant civil Government really, when he bade us submit to it, and pray for it, and practised it himself by giving to Caesar the things which were Caesars; if in these last and worst days we need it less than then, I do not yet understand it. Wild beasts love no bound, but if this should be, then all the world would be a wilderness, and where should we live without tearing in pieces? I think just Government in a Turk to be a beam of God, and we admire it abroad, and trample upon it at home.</p></blockquote>

<blockquote><p>Christians have been known to spend much time debating who was technically right in the American Civil War/War Between the States. While not an entirely useless endeavour, this approach is in danger of missing the bigger picture. Isaac Nelson, of the Irish Presbyterian Church, reminds us of how the war demonstrated what happens when a nation abandons biblical justice:

His judgment long ago was – that slavery was entirely opposed to all justice. The pulpit had not done its duty in the matter, when it might have done so. The Churches of America had filled the cup of God’s indignation, and the people had now drunk it to the dregs. We find fault with the men who are corrupting the Word of the living God. It was quite possible for a nation as well as an individual to sin away its days of grace; and let us beware that as a nation we are not doing so. The lesson we have to learn from America is this – that they took to their bosom an adder of which we have to mourn, and learn the lesson that to do justice, to love mercy, to walk humbly with God is the only security for national prosperity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-nelson.html">Isaac Nelson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Banner of Ulster</cite>, 22 Apr. 1865</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>Realizing that his comrades’ lives depend upon his silence he consumes the cyanide and dies in a few moments. Is his action lawful?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-canon-mccarthy.html">John Canon McCarthy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Direct &amp; Indirect Suicide’ in Problems in Theology II</cite>, (Dublin, 1959), sect. 5, 5th Commandment, pp. 119-22 | McCarthy was a Romanist professor of moral theology. He here takes up the case of a secret agent being dropped into enemy territory by parachute, and is captured:</span></figcaption>

<main class="wrap"><figure class="quote" id="q-013b0de4a2" data-kw="Councils can err">
<blockquote><p>As matters usually become worse and worse, it is easy to see in more modern councils how much the Church gradually degenerated from the purity of that golden age. I doubt not, however, that even in those more corrupt ages, councils had their bishops of better character. But it happened with them as the Roman senators of old complained in regard to their decrees. Opinions being numbered, not weighed, the better were obliged to give way to the greater number.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.9.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/infallibility-of-the-church.html">Infallibility of the Church</a> › <a href="../topics/the-church/infallibility-of-the-church/the-church-can-err.html">The church can err</a></span><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a> › <a href="../topics/the-church/creeds-confessions-and-councils/ecumenical-councils.html">Ecumenical councils</a></span></div>

</figure><figure class="quote" id="q-60822eb805" data-kw="Councils">
<blockquote><p>Wherefore, though our opponents should name councils of thousands of bishops it will little avail them; nor will they induce us to believe that they are, as they maintain, guided by the Holy Spirit, until they make it credible that they assemble in the name of Christ: since it is as possible for wicked and dishonest to conspire against Christ, as for good and honest bishops to meet together in his name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.9.2</span></figcaption>

</figure><figure class="quote" id="q-3e0ab16df0" data-kw="Seat of infallibility">
<blockquote><p>They are not yet agreed among themselves on the seat of this infallibility, nor is it known as yet with whom it ought to be—with the pope or with a council. Some claim this privilege for a council, as is done by all those who believe the pope to be fallible and who on that account wish the council to be above him (as it was decreed in the councils of Constance and Basil and is constantly believed by the French church). Others ascribe it to the pope, as those who maintain that he is superior to a council (as the Council of Trent determined and with it the canonists and Scholastics).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/infallibility-of-the-church.html">Infallibility of the Church</a> › <a href="../topics/the-church/infallibility-of-the-church/against-rome.html">Against Rome</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/infallibility.html">Infallibility</a></span></div>

— Francis Turretin, Institutes of Elenctic Theology, 18.11.19">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThey+are+not+yet+agreed+among+themselves+on+the+seat+of+this+infallibility%2C+nor+is+it+known+as+yet+with+whom+it+ought+to+be%E2%80%94with+the+pope+or+with+a+council.+Some+claim+this+privilege+for+a+council%2C+as+is+done+by+all+those+who+believe+the+pope+to+be+fallible+and+who+on+that+account+wish+the+council+to+be+above+him+%28as+it+was+decreed+in+the+councils+of+Constance+and+Basil+and+is+constantly+believed+by+the+French+church%29.+Others+ascribe+it+to+the+pope%2C+as+those+who+maintain+that+he+is+superior+to+a+council+%28as+the+Council+of+Trent+determined+and+with+it+the+canonists+and+Scholastics%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+18.11.19&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3e0ab16df0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3e0ab16df0.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-d931506157" data-kw="Infallibility of the church">
<blockquote><p>For if the church ought to be infallible, the Holy Spirit would undoubtedly somewhere have told believers of it, as of a thing of the greatest importance to confirm the faith of the pious and to guard them against all seductions. Otherwise he would appear to have been wanting in a thing the most necessary of all and which it was of the greatest moment for the church to know. But nowhere is mention made of this privilege having been given to any certain church; for it will be shown hereafter that the many passages adduced by our opponents to prove this thing do not prove it. So far from its being said that this was granted to the Roman church (as ought to have been said by all means, if any such thing belonged to it), on the contrary Paul earnestly admonishes it of the danger of defection and of their impending fall: “Because of unbelief they were broken off, and thou standest by faith. Be not highminded, but fear: For if God spared not the natural branches, take heed lest he also spare not thee” (Rom. 11:20, 21).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.10</span></figcaption>

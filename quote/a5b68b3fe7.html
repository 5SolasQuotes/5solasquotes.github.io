</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1125fa090f" data-kw="">
<blockquote><p>Regeneration is a benefit of God, by which our corrupted nature is renewed to the image of God by the Holy Spirit, 2 Pet. 1:4; Tit. 3:5; Gal. 4:6; 2 Cor. 3:7. That same is also called sanctification, and the gift of grace. Rom. 5. Also of schoolemen it is called an infused grace. Regeneration is either begun, or perfected: the former belongs to this life, the latter to the life to come… Regeneration of the soul is that whereby the powers of the soul are renewed. Tit. 3:5; Gal. 4:6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Substance of Christian Religion Soundly set forth in Two Books, by Definitions &amp; Partitions</cite>, … (London, 1595), ‘Regeneration’, pp. 94-95</span></figcaption>

</figure><figure class="quote" id="q-8d7e9a9d55" data-kw="">
<blockquote><p>Question: ‘Who are they who are to believe God shall give them a new heart?’ Answer: No man is positively to believe it while God work it in Him, for no man is to believe that he is predestinated to glory while he first have the effects thereof in him, ‘the hid Manna’, ‘the white Stone’, ‘the new Name’. But no man is to despair or to create fatal inferences that he is reprobate, since God begins kindly with him with a Gospel call.</p></blockquote>

</figure><figure class="quote" id="q-9b19d09ea6" data-kw="">
<blockquote><p>Wherfore here after it shall be declared to you what is to be understood and meant by this words ‘to be delivered from the Law,’ purposing now in few words to show that they which be regenerated and new born by faith as I have said, do receive the Holy Ghost, that there may be begun in them a new obedience or better manner of living, a new light and life-eternal, which is a beginning and an entrance into the law of God.</p></blockquote>

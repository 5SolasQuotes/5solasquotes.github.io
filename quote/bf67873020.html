<main class="wrap"><figure class="quote" id="q-bf67873020" data-kw="">
<blockquote><p>First, I require the B[ishop] to shew us a difference betwixt the keeping of holy days by formalists, &amp; their keeping of the Lord’s day: for upon holy days they enjoin a cessation from work, and a dedicating of the day to Divine worship, even as upon the Lord’s day. The Bishop alledgeth five respects of difference, but they are not true. First, he saith, that the Lord’s day is commanded to be observed of necessity, for conscience of the Divine ordinance, as a day sanctified and blessed by God himself.

Answ. 1. so have we heard from [Richard] Hooker, that holy days are sanctified by God’s extraordinary works, but because the B[ishop] dare not say so much, therefore I say. 2. This difference cannot shew us, that they observe holy days only for order and policy, and that they place no worship in the observing of them, as in the observing of the Lord’s day, (which is the point that we require) for worship is placed in the observing of human, as well as of Divine ordinances; otherwise worship hath never been placed in the keeping of Pharisaical and Popish traditions. This way is worship placed in the keeping of holy days, when for conscience of an human ordinance, they are both kept as holy, and thought necessary to be so kept. 3. The B[ishop] contradicteth himself, for elsewhere he defendeth, that the Church hath power to change the Lord’s day.

Secondly, he giveth us this difference, that the Lord’s day is observed, as the Sabbath of Jehovah, and as a day whereon God himself did rest after the creation. Ans. 1. This is false of the Lord’s day, for after the creation, God rested upon the seventh day, not upon the first. 2. Dr [George] Downame saith, that festival days also are to be consecrated as Sabbaths to the Lord. Thirdly, the B[ishop] tells us, that the Lord’s day is observed in memory of the Lord’s Resurrection.

Ans. 1. He shall never make this good, for, we observe the Lord’s day in memory of the whole work of Redemption. 2. If it were so, this could make no difference, for just so Christmass is observed in memory of the Lord’s Nativity, Good-Friday, in memory of his Passion, &amp;c. His fourth &amp; fifth respects of difference, are certain mysteries in the Lord’s day. But we shall see by and by, how his fellow Formalists who are more ingenuous then himself, shew us mysteries in the Festival days also. Lastly, albeit the B[ishop] have told us that there is no worship appropriated unto the Festival days, which may not be performed at any other time, yet this cannot with him make a difference betwixt them and the Lord’s day: for in his Epistle which I have quoted, he declareth his judgment to be the same of the Lord’s day, and teacheth us, that the worship performed on it, is not so appropriated to that time, but lawfully the same may be performed at any other convenient time, as the Church shall think fit. Now as the worship performed on the Lord’s day, is appropriated (in his judgment) to that time, so long as the Church altereth it not, and no longer, just as much thinks he, of the appropriating to Festival days, the worship performed on the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dispute against the English-popish ceremonies, obtruded upon the Church of Scotland</cite>, (n.p., 1637), Part III, pp 10-11.</span></figcaption>

<blockquote><p>DEATH OF HUGH MARTIN.

The Rev. Dr Hugh Martin died Edinburgh on Sabbath evening. Born in Aberdeen in 1822, he was educated at the Grammar School and Marischal College. He became a prominent member of the Mathematical Society of London, and was for three years Mathematical Examiner to the Edinburgh University.

He went with the Free Church at the Disruption, and his first charge was at Panbride. Carnoustie and Panbride were at the time becoming resorts of the people of Dundee, and many of these supported the young minister. The Earl of Dalhousie granted a site, and a handsome church and comfortable manse were reared.

Soon afterwards Mr Martin succeeded the late minister of Free Greyfriars, Edinburgh, where had a large congregation, and many students attended his church. He took a keen interest in ecclesiastical questions, and was often heard on the floor the General Assembly of the Free Church, especially in the debates on union and education. His leanings were generally to the Conservative view.

He was the author of “Christ’s Presence in the Gospel History,” “The Atonement,” “The Prophet Jonah,” and “The Shadows of Calvary.” In recognition of these the University of Edinburgh conferred on him the degree of D.D. Dr Martin, who has been delicate health for some years, leaves a widow and five of a family, including an only son, who is a clergyman in Edinburgh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aberdeen-evening-express.html">Aberdeen Evening Express</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aberdeen Evening Express</cite>, 16 June 1885.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>I am not, however, so superstitious as to think that all visible representations of every kind are unlawful. But as sculpture and paintings are gifts of God, what I insist for is, that both shall be used purely and lawfully, that gifts which the Lord has bestowed upon us, for his glory and our good, shall not be preposterously abused, nay, shall not be perverted to our destruction. We think it unlawful to give a visible shape to God, because God Himself has forbidden it… Visible representations are of two classes, viz., historical, which give a representation of events, and pictorial, which merely exhibit bodily shapes and figures. The former are of some use for instruction or admonition…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I am not, however, so superstitious as to think that all visible representations of every kind are unlawful. But as sculpture and paintings are gifts of God, what I insist for is, that both shall be used purely and lawfully, that gifts which the Lord has bestowed upon us, for his glory and our good, shall not be preposterously abused, nay, shall not be perverted to our destruction. We think it unlawful to give a visible shape to God, because God Himself has forbidden it… Visible representations are of two classes, viz., historical, which give a representation of events, and pictorial, which merely exhibit bodily shapes and figures. The former are of some use for instruction or admonition…”

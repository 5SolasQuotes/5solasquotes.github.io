<main class="wrap"><figure class="quote" id="q-37629f4e18" data-kw="">
<blockquote><p>Objection 2: Further, hypostasis is nothing more than a ‘particular substance,’ as Boethius says (De Duab. Nat.). But it is plain that in Christ there is another particular substance beyond the hypostasis of the Word, viz. the body and the soul and the resultant of these. Therefore there is another hypostasis in Him besides the hypostasis of the Word. … Reply to Objection 2: Hypostasis signifies a particular substance, not in every way, but as it is in its complement. Yet as it is in union with something more complete, it is not said to be a hypostasis, as a hand or a foot [is, as joined to a person’s body]. So likewise the human nature in Christ, although it is a particular substance, nevertheless cannot be called a hypostasis or suppositum, seeing that it is in union with a completed thing, viz. the whole Christ, as He is God and man. But the complete being with which it concurs is said to be a hypostasis or suppositum.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aquinas.html">Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 3, question 2, ‘Of the Mode of Union of the Word Incarnate’ | article 3, ‘Whether the union of the Word Incarnate took place in the suppositum or hypostasis?’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-08698ac439" data-kw="">
<blockquote><p>The consubstantiality (homoousion) of Christ with us consists in identity of nature and essential properties, but not in the relation of subsistence which was wanting to the human nature. Therefore, the singular human nature of Christ was complete physically in its substantial being as to its integral parts, but not metaphysically as to the mode of subsistence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology (P&amp;R), vol. 2 | Question 5, section 13</cite>, p. 309</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-4dff76414d" data-kw="">
<blockquote><p>A threefold being is usually distinguished: of essence, of existence, and of subsistence… Therefore, concerning this being of existence, the present question is whether in Christ there is one existence of the divine nature and another of the human nature, or rather there is only a single being of existence, namely the uncreated existence of the Word itself, by which the assumed humanity is also said to exist… In this controversy there are two opposed opinions. The first is common in the school of Thomists, denying that in the humanity of Christ there is any created existence, and affirming that by union it was assumed not only to the subsistence of the Word but also to existence… And so the Thomists commonly teach in the cited place: Cajetan, Capreolus, Ferrara, Medina, Cabrera, Alvarez, and other notable followers of the same school. The opposed opinion is common outside the school of St. Thomas, affirming that the assumed humanity has its own created existence by which it exists. For although it was assumed to the subsistence of the Word, nevertheless [it was] not [assumed] to [his] existence. So Scotus holds (Ordinatio 3, d. 6, q. 1), St. Bonaventure (Sent. 3, d. 5, a. 3, q. 3), and the Scotists commonly follow, and all the more recent [theologians], some of whom strive to benignly interpret St. Thomas and draw him into this opinion as well.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bartolomeo-mastrius.html">Bartolomeo Mastrius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>bk. 3, Of the Incarnation of the Lord (d. 1673), Disputation 1 tr. by AI by OmegaPoint99 | quest. 6, ‘Whether the human nature in Christ has its own existence, or rather exists by the existence of the Word’ 140 | art. 1, Resolution of the question 141 art. 2, The foundations of the opposing opinion are overthrown 152-58</cite>, pp. 140-41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

<blockquote><p>XI. Therefore all Christ is everywhere, although his human nature, since his ascension untill the day of the Last Judgment, be nowhere but in Heaven. Mt. 28:6, ‘He is risen, he is not here,’ Mt. 26:11, ‘Me ye have not always with you.’ Jn. 16:28; ‘I leave the world and go unto my Father.’ Acts 3:21, ‘Whom the heavens must contain, until the time of restoring of all things. XII. And the godly in what place of heaven or earth so ever they abide, are united to the human nature assumed by the Son of God, as members to their head, the same Holy Spirit dwelling in Christ by unity of essence with the Word, and in the godly by grace. 1. Cor. 12:13, ‘By one Spirit we are all baptized into one body.’ Eph. 4:4, ‘There is one body and one Spirit.’ 1 Jn. 4:13, ‘By this we know that we abide in Him and He in us, because He hath given us of his Spirit.’ Rom. 8:11, ‘If the Spirit of Him who hath raised etc. dwell in you etc.’ Irenaeus, bk. 3, ch. 19, ‘As of dry meal one lump cannot be made, nor one bread: so neither could we which are many, be made one in Christ Jesus, without that water which is from Heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of the Office &amp; Person of Christ the Only Mediator’ in A Collection of Certain Learned Discourses… (Oxford, 1600)</cite>, p. 245</span></figcaption>

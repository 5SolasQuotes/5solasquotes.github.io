<main class="wrap"><figure class="quote" id="q-77bbf58820" data-kw="">
<blockquote><p>As domestic society is by nature’s instinct, so is civil society natural, in radice, ‘in the root’, and voluntary, in modo, ‘in the manner’ of coalescing. Politic power of government agrees not to man, singly, as one man, except in that root of reasonable nature; but supposing that men be combined in societies, or that one family cannot contain a society, it is natural that they join in a civil society, though the manner of union in a politic body, as Bodine says, be voluntary, Gen. 10:10; 15:7 and Suarez says (tome 1, On Laws, bk. 3, ch. 3), That a power of making laws is given by God as a property flowing from nature, Qui dat formam, dat consequentia ad formam, Not by any special action or grant different from creation; nor will he have it to result from nature while men be united into one politic body: which union being made, that power follows without any new action of the will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex… (London: Field, 1644), Question 2, ‘Whether or not government be warranted by the Law of nature’</cite>, p. 2</span></figcaption>

</figure><figure class="quote" id="q-33dc49d682" data-kw="">
<blockquote><p>…it’s possible to articulate Christian doctrine without formally invoking concepts like “essence,” “substance” and so on. Instead of saying, for example, that in the incarnation there is one hypostasis subsisting in two distinct natures, one can say that there is just Jesus and not someone else and that Jesus always remains both truly God and truly human. However, the fact that the use of the metaphysical language is not absolutely necessary does not mean that the metaphysical resources in question are detached from reality. It does not mean that what they offer us is just a set of coherent rules for saying things – rules that we might either take or leave. On the contrary, the classical metaphysical tradition developed by Christian thinkers like John of Damascus, Thomas Aquinas or the early Reformed theologians and philosophers involves a knowledge of how things are. Indeed, it is fundamentally an exposition of things human beings know to be true prior to engaging in any formal academic work. For example, things do have natures by virtue of which they are similar to other things. There really are substances in which accidents inhere… As we seek ways to express what God is like according to scriptural teaching, we should look to this philosophical tradition, not Kant or Hegel, because it sheds light on reality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/steven-j-duby.html">Steven J. Duby</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘In Defense of Christian Philosophy: A Response to Peter Leithart’ (2018) 22 paragraphs</cite></span></figcaption>

<blockquote><p>We should not immediately reject a doctrine, or even doubt it, just for the sake of mental exercise… Problem 1. In order to do theology freely and skillfully, should we clear our minds of all preconceptions to the point that we doubt everything we have learned through diligent study, meditation, and the teaching of our instructors, and treat it all as false (even if it is not), until the truth is inscribed anew on our minds like a blank slate, after proper and methodical inquiry and demonstration based on certain principles? Answer: No. The Remonstrants wanted the National Synod to revise the Confession and Catechism, and they wanted the Synod members to be released from affirming the Belgic Catechism and Confession in the meantime, supposedly so they would not be hindered by any preconceptions in perceiving and judging the truth. Therefore, should we have temporarily suspended our agreement with, belief in, and profession of the truths attested by our affirmation (e.g., in articles 1 and 2 of the Confession)? Therefore, should the Reformed Synod have re-examined and investigated the article or thesis ‘That there is a God?’ I ask the same about the truths and theses of natural theology or philosophy concerning God, his attributes and works, providence, the distinction between moral good and evil, the honorable and the base, etc. I ask the same about the basic catechetical elements instilled and proven from God’s word in infancy, childhood, and adolescence, before someone devoted himself to theological studies in an academic program.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation On the Ways of Knowing God’, pt. 2 tr. Michael Lynch (1665; 2024) at Translationes Lyncei</cite></span></figcaption>

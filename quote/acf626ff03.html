<blockquote><p>3. The wooings of Christ to gain your hearts: Consider Him bowing the heavens and coming down, and laying aside his robes of majesty, and putting on your filthy garments: Consider Him going about from place to place, on no other errand, but to gain your hearts and win your souls: And, whoever spake such effectual words as Christ spake when He was upon the earth? Who ever gave such precious jewels to a bride, as Christ gave to his spouse? Who ever put on such apparel as Christ did, when He wooed his Church?… Ah! poor Sinners, see your Jesus hanging on the cross, dropping out his last blood, breathing out his last breath, stretching out his dying arms to encircle sinners; and come, Oh come and throw yourselves into his bleeding arms! Away with all prejudicate opinions! Who shall say Christ is not willing to save him, and not blaspheme eternal love? Speak truth: Corrupt hearts speak truth; say not Christ is unwilling, but you are unwilling; ‘I would, but ye would not.’ [Mt. 23:37] 4. The weepings of Christ if He cannot prevail. Thus we find Him in the Gospel expressing Himself, not only in words, but in tears. And when He was come near Jerusalem, He beheld the city, and wept over it, Lk. 19:41… What? Christ to weep for you, over you? Methinks, if you had hearts of stone, it should melt your hearts.</p></blockquote>

<blockquote><p>2. He has a love, not only of benevolence, but of beneficence; He not only wishes you well, but does well unto you. O Sirs! many a good turn has He done you, particularly you who are members of the visible church; He gives you line upon line, precept upon precept; He makes you to hear the joyful sound, the voice of the turtle[-dove]; many a minister has He sent you; many an offer of Christ, and of life through Him, has He made to you; many a time has He knocked at thy door, by word, by conscience, and the motions and whispers of his Spirit; so that He may say to us, as He did of his vineyard, Isa. 5:4, “What could have been done more for them, that I have not done?”… Thus, I say, God’s love of benevolence and beneficence is, in some respects, extended unto all.</p></blockquote>

<blockquote><p>’If any man hear my voice, and open the door, I will come in and sup with him.’ Rev. 3:20 Great and precious are the promises which Christ makes to them who hearken to his voice in the gospel-offers, and open their heart to receive Him as offered to them in all his offices: I will come in, and bring all the benefits of my purchase with Me, to entertain and feast that soul, even pardon, peace, light, life, grace and glory. 1. Observe, the duty called for is to hear Christ’s voice, and open the door to Him; that is, to accept and embrace the free gospel-offers, and heartily to acquiesce in the gospel-method of a sinner’s reconciliation and sanctification through the righteousness of our glorious Immanuel, and willingly receive and submit to Him as our Prophet, Priest, and King. What is the preaching of the gospel, but Christ’s charming voice calling lost sinners home to Himself? What is it, but Christ’s following them with invitations and entreaties to come to Him and live? This is Christ’s voice which He would have sinners to hear, Come and live; though they generally refuse to hear the voice of his sovereign offering him his life, as condemned sinners do? Jn. 5:40, “Ye will not come to Me that ye may have life.” Yet behold, after many refusals, He follows his offers with arguments, strong arguments, to prevail with sinners; and after the greatest obstinancy He is loth to break off his treaty with them, Hos. 11:8, “How shall I give thee up, Ephraim? Why will ye die?” What reason can you give for refusing life, or for choosing death? 2. Observe who it is that Christ calls to hear his voice and open their doors to Him: It is not this or that man only, or any particular sort of men, it is any man, every man that sits under the gospel. “If any man will hear my voice and open the door, (says Christ), I will come in.” “If any man will open (be he old man or young man), I will come in.” If the greatest sinner, the most crimson-colored sinner, will open, I will come in. “Any man,” if the swearer will open, if the sabbath-breaker, if the murderer, if the drunkard, if the unclean, if the thief, if the cheat, if the liar, if the mocker, if the prayerless man, if the man that hates God and godliness, will open to Me, “I will come in and sup with him.” O what encouragement does this word, “if any man,” give to ever sinner to flee to Christ! If any man, whoever he be, whatever he has done, if he will welcome Me, receive Me in the gospel-offers, I will come in to him. 3. Observe, Christ requires sinners to open the door, that He may come in to teach them; however unable they be, this is their duty; they must mint, and use all means to do it, and look up to Him for strength. He will have the sinner’s consent, and the soul made willing to receive Him. O then cast open the door, open it wide, receive Christ wholly, receive Him without reserve, open before him the “two-leaved gates,” not the wicker, or one leaf only, but both leaves of the door! Let Christ have the full and free consent of the soul, an abundant entrance into it. There are some resolving to open the door to Christ, others perhaps are beginning to open it: O let them not halt in doing it! With some the door is half open, and there they stop. They are almost, but not altogether Christians. O almost Christian! why do you halt? Why would you lose all the pains you have been at? A little more would cast the door wide open, and make you an altogether Christian. Go then a little further, O sinner! to save your soul. Open to Christ all the powers and faculties of your soul. Open to Him fully here, as you would have Him to open freely to you hereafter. Oh! what mean you to open to Christ by halves? Alas! the half open door will be ready to go to again, and if so, it may never open for the future. Let this be your concern then to go a little further than the almost Christian, and rest not in fair beginnings. 4. Observe, how great the advantage is of opening the door to Christ: Why? I will come into the house, says He; even the friend of sinners, the King of glory will come in, the best guest that ever came into a poor man’s house: How honorable, how profitable, how happy and blessed, must such a visit be! Question: For what end will Christ come in? Answer: He will come in to enlighten the house; for the soul is a dark dungeon while Christ is shut out: He will come in to adorn and enrich the soul with the ornaments and treasures of his grace: He will come in to reign in the soul, and pull down the tyrant that has long oppressed you: As in the text, He will come in and sup with you, and cause you to sup with Him: And, because you have no fitting provision in the house, He will bring it with Him. And O how rare are Christ’s dainties, his hidden manna, the fruits of the tree of life, the grapes of Canaan, the bread that comes down from heaven! How excellent is the water of life! One drop of it would be an everlasting spring in your soul, that would keep you from thirsting after the creature anymore. What a rich feast are the graces of the Spirit quickened to a lively exercise! What a blessed feast is pardon of sin, peace with justice, peace with the law, an interest in Christ’s purchase, intimations of Christ’s love, gospel-promises applied, communion with God, views of eternal life, well-grounded hopes of immortal glory! etc. O how precious and delicate are those gospel-rarities which are set before you on the communion-table, and freely tendered to everyone that opens the door to Christ! Who would not welcome such a Guest, that brings such glorious provision with Him? Had poor sinners spiritual appetites sharpened for Christ’s feast, there would not be so many shut doors against Him. 5. Observe, how solemnly Christ offers these gospel-blessings to you, with a Behold I stand, etc. Christ takes witnesses upon it, witnesses against the refusers: Behold, ye angels, and witness for me how kind and bountiful my offers are to Adam’s rebellious children! Behold, ye ministers, and witness against those who shut Me out! Behold, ye stones and timber of the house, ye elements and communion-tables, bear witness for me and against them! Behold, ye fellow-communicants and hearers, bear witness one against another, that I knocked, I called, I knocked loud, I knocked long, but ye kept your doors bolted against Me. \ It is a melancholy thought for those who are ministers to entertain, that they will one day be brought in as witnesses against those who shut out their Savior; but when called, they must witness against such, though never so dear to them now, that Christ called, but they refused; He made kind and large offers, but they regarded them not. O, then, let every soul set about sweeping and washing all the rooms, and case open all the doors, as wide as they can, to the King of Glory, and receive Him with acclamations and praise! Take the crown off the head of self, and put it on the head of Christ, ascribing all the glory of your salvation to Him, and nothing to free-will, or your own doings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-willison.html">John Willison</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacramental Meditations, in The Whole Works of John Willison</cite>, 1816, vol. 3 | Advice 3, pp. 317-19</span></figcaption>

— John Willison, Sacramental Meditations, in The Whole Works of John Willison, 1816, vol. 3 | Advice 3, pp. 317-19">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%99If+any+man+hear+my+voice%2C+and+open+the+door%2C+I+will+come+in+and+sup+with+him.%E2%80%99+Rev.+3%3A20+Great+and+precious+are+the+promises+which+Christ+makes+to+them+who+hearken+to+his+voice+in+the+gospel-offers%2C+and+open+their+heart+to+receive+Him+as+offered+to+them+in+all+his+offices%3A+I+will+come+in%2C+and+bring+all+the+benefits+of+my+purchase+with+Me%2C+to+entertain+and+feast+that+soul%2C+even+pardon%2C+peace%2C+light%2C+life%2C+grace+and+glory.+1.+Observe%2C+the+duty+called+for+is+to+hear+Christ%E2%80%99s+voice%2C+and+open+the+door+to+Him%3B+that+is%2C+to+accept+and+embrace+the+free+gospel-offers%2C+and+heartily+to+acquiesce+in+the+gospel-method+of+a+sinner%E2%80%99s+reconciliation+and+sanctification+through+the+righteousness+of+our+glorious+Immanuel%2C+and+willingly+receive+and+submit+to+Him+as+our+Prophet%2C+Priest%2C+and+King.+What+is+the+preaching+of+the+gospel%2C+but+Christ%E2%80%99s+charming+voice+calling+lost+sinners+home+to+Himself%3F+What+is+it%2C+but+Christ%E2%80%99s+following+them+with+invitations+and+entreaties+to+come+to+Him+and+live%3F+This+is+Christ%E2%80%99s+voice+which+He+would+have+sinners+to+hear%2C+Come+and+live%3B+though+they+generally+refuse+to+hear+the+voice+of+his+sovereign+offering+him+his+life%2C+as+condemned+sinners+do%3F+Jn.+5%3A40%2C+%E2%80%9CYe+will+not+come+to+Me+that+ye+may+have+life.%E2%80%9D+Yet+behold%2C+after+many+refusals%2C+He+follows+his+offers+with+arguments%2C+strong+arguments%2C+to+prevail+with+sinners%3B+and+after+the+greatest+obstinancy+He+is+loth+to+break+off+his+treaty+with+them%2C+Hos.+11%3A8%2C+%E2%80%9CHow+shall+I+give+thee+up%2C+Ephraim%3F+Why+will+ye+die%3F%E2%80%9D+What+reason+can+you+give+for+refusing+life%2C+or+for+choosing+death%3F+2.+Observe+who+it+is+that+Christ+calls+to+hear+his+voice+and+open+their+doors+to+Him%3A+It+is+not+this+or+that+man+only%2C+or+any+particular+sort+of+men%2C+it+is+any+man%2C+every+man+that+sits+under+the+gospel.+%E2%80%9CIf+any+man+will+hear+my+voice+and+open+the+door%2C+%28says+Christ%29%2C+I+will+come+in.%E2%80%9D+%E2%80%9CIf+any+man+will+open+%28be+he+old+man+or+young+man%29%2C+I+will+come+in.%E2%80%9D+If+the+greatest+sinner%2C+the+most+crimson-colored+sinner%2C+will+open%2C+I+will+come+in.+%E2%80%9CAny+man%2C%E2%80%9D+if+the+swearer+will+open%2C+if+the+sabbath-breaker%2C+if+the+murderer%2C+if+the+drunkard%2C+if+the+unclean%2C+if+the+thief%2C+if+the+cheat%2C+if+the+liar%2C+if+the+mocker%2C+if+the+prayerless+man%2C+if+the+man+that+hates+God+and+godliness%2C+will+open+to+Me%2C+%E2%80%9CI+will+come+in+and+sup+with+him.%E2%80%9D+O+what+encouragement+does+this+word%2C+%E2%80%9Cif+any+man%2C%E2%80%9D+give+to+ever+sinner+to+flee+to+Christ%21+If+any+man%2C+whoever+he+be%2C+whatever+he+has+done%2C+if+he+will+welcome+Me%2C+receive+Me+in+the+gospel-offers%2C+I+will+come+in+to+him.+3.+Observe%2C+Christ+requires+sinners+to+open+the+door%2C+that+He+may+come+in+to+teach+them%3B+however+unable+they+be%2C+this+is+their+duty%3B+they+must+mint%2C+and+use+all+means+to+do+it%2C+and+look+up+to+Him+for+strength.+He+will+have+the+sinner%E2%80%99s+consent%2C+and+the+soul+made+willing+to+receive+Him.+O+then+cast+open+the+door%2C+open+it+wide%2C+receive+Christ+wholly%2C+receive+Him+without+reserve%2C+open+before+him+the+%E2%80%9Ctwo-leaved+gates%2C%E2%80%9D+not+the+wicker%2C+or+one+leaf+only%2C+but+both+leaves+of+the+door%21+Let+Christ+have+the+full+and+free+consent+of+the+soul%2C+an+abundant+entrance+into+it.+There+are+some+resolving+to+open+the+door+to+Christ%2C+others+perhaps+are+beginning+to+open+it%3A+O+let+them+not+halt+in+doing+it%21+With+some+the+door+is+half+open%2C+and+there+they+stop.+They+are+almost%2C+but+not+altogether+Christians.+O+almost+Christian%21+why+do+you+halt%3F+Why+would+you+lose+all+the+pains+you+have+been+at%3F+A+little+more+would+cast+the+door+wide+open%2C+and+make+you+an+altogether+Christian.+Go+then+a+little+further%2C+O+sinner%21+to+save+your+soul.+Open+to+Christ+all+the+powers+and+faculties+of+your+soul.+Open+to+Him+fully+here%2C+as+you+would+have+Him+to+open+freely+to+you+hereafter.+Oh%21+what+mean+you+to+open+to+Christ+by+halves%3F+Alas%21+the+half+open+door+will+be+ready+to+go+to+again%2C+and+if+so%2C+it+may+never+open+for+the+future.+Let+this+be+your+concern+then+to+go+a+little+further+than+the+almost+Christian%2C+and+rest+not+in+fair+beginnings.+4.+Observe%2C+how+great+the+advantage+is+of+opening+the+door+to+Christ%3A+Why%3F+I+will+come+into+the+house%2C+says+He%3B+even+the+friend+of+sinners%2C+the+King+of+glory+will+come+in%2C+the+best+guest+that+ever+came+into+a+poor+man%E2%80%99s+house%3A+How+honorable%2C+how+profitable%2C+how+happy+and+blessed%2C+must+such+a+visit+be%21+Question%3A+For+what+end+will+Christ+come+in%3F+Answer%3A+He+will+come+in+to+enlighten+the+house%3B+for+the+soul+is+a+dark+dungeon+while+Christ+is+shut+out%3A+He+will+come+in+to+adorn+and+enrich+the+soul+with+the+ornaments+and+treasures+of+his+grace%3A+He+will+come+in+to+reign+in+the+soul%2C+and+pull+down+the+tyrant+that+has+long+oppressed+you%3A+As+in+the+text%2C+He+will+come+in+and+sup+with+you%2C+and+cause+you+to+sup+with+Him%3A+And%2C+because+you+have+no+fitting+provision+in+the+house%2C+He+will+bring+it+with+Him.+And+O+how+rare+are+Christ%E2%80%99s+dainties%2C+his+hidden+manna%2C+the+fruits+of+the+tree+of+life%2C+the+grapes+of+Canaan%2C+the+bread+that+comes+down+from+heaven%21+How+excellent+is+the+water+of+life%21+One+drop+of+it+would+be+an+everlasting+spring+in+your+soul%2C+that+would+keep+you+from+thirsting+after+the+creature+anymore.+What+a+rich+feast+are+the+graces+of+the+Spirit+quickened+to+a+lively+exercise%21+What+a+blessed+feast+is+pardon+of+sin%2C+peace+with+justice%2C+peace+with+the+law%2C+an+interest+in+Christ%E2%80%99s+purchase%2C+intimations+of+Christ%E2%80%99s+love%2C+gospel-promises+applied%2C+communion+with+God%2C+views+of+eternal+life%2C+well-grounded+hopes+of+immortal+glory%21+etc.+O+how+precious+and+delicate+are+those+gospel-rarities+which+are+set+before+you+on+the+communion-table%2C+and+freely+tendered+to+everyone+that+opens+the+door+to+Christ%21+Who+would+not+welcome+such+a+Guest%2C+that+brings+such+glorious+provision+with+Him%3F+Had+poor+sinners+spiritual+appetites+sharpened+for+Christ%E2%80%99s+feast%2C+there+would+not+be+so+many+shut+doors+against+Him.+5.+Observe%2C+how+solemnly+Christ+offers+these+gospel-blessings+to+you%2C+with+a+Behold+I+stand%2C+etc.+Christ+takes+witnesses+upon+it%2C+witnesses+against+the+refusers%3A+Behold%2C+ye+angels%2C+and+witness+for+me+how+kind+and+bountiful+my+offers+are+to+Adam%E2%80%99s+rebellious+children%21+Behold%2C+ye+ministers%2C+and+witness+against+those+who+shut+Me+out%21+Behold%2C+ye+stones+and+timber+of+the+house%2C+ye+elements+and+communion-tables%2C+bear+witness+for+me+and+against+them%21+Behold%2C+ye+fellow-communicants+and+hearers%2C+bear+witness+one+against+another%2C+that+I+knocked%2C+I+called%2C+I+knocked+loud%2C+I+knocked+long%2C+but+ye+kept+your+doors+bolted+against+Me.+%5C+It+is+a+melancholy+thought+for+those+who+are+ministers+to+entertain%2C+that+they+will+one+day+be+brought+in+as+witnesses+against+those+who+shut+out+their+Savior%3B+but+when+called%2C+they+must+witness+against+such%2C+though+never+so+dear+to+them+now%2C+that+Christ+called%2C+but+they+refused%3B+He+made+kind+and+large+offers%2C+but+they+regarded+them+not.+O%2C+then%2C+let+every+soul+set+about+sweeping+and+washing+all+the+rooms%2C+and+case+open+all+the+doors%2C+as+wide+as+they+can%2C+to+the+King+of+Glory%2C+and+receive+Him+with+acclamations+and+praise%21+Take+the+crown+off+the+head+of+self%2C+and+put+it+on+the+head+of+Christ%2C+ascribing+all+the+glory+of+your+salvation+to+Him%2C+and+nothing+to+free-will%2C+or+your+own+doings.%E2%80%9D%0A%0A%E2%80%94+John+Willison%2C+Sacramental+Meditations%2C+in+The+Whole+Works+of+John+Willison%2C+1816%2C+ <blockquote><p>Christ makes the feast, Lk. 15:23, and the angels make the music, verse 7. But if men will not receive the tenders of grace, Christ grieves, Mk. 3:5. He is like a judge that passes the sentence with tears in his eyes, Lk. 19:42, ‘And when He came nigh the city, He wept.’ ‘Ah sinners, I come to save you, but you put away salvation from you (Acts 13). I come with healing under my wings, but you bolt out your Physician; I would have you but open your hearts to receive Me, and I will open Heaven to receive you, but you will rather stay with your sins and die, than come to Me and live, Ps. 81:11, ‘Israel would none of me.’ Well sinners, I will weep at your funerals.’ Oh how lovely is Christ in his disposition! He comes with his supplying oil to pour into sinners’ wounds; He would fain break their hearts with his mercies, He labors to overcome their evil with his good.</p></blockquote>

<blockquote><p>Here you see how the waters of free grace rise higher and higher; an invitation is much, a promise of welcome is more; but the actual grants of mercy is most satisfying of all. Come on poor trembling soul, don’t be discouraged, stretch out the small weak arms of thy faith to that great and gracious Redeemer; open thy heart wide to receive Him, He will not refuse to come in; He has sealed thousands of pardons to as vile wretches as thyself; He never yet shut the door of mercy upon a willing, hungering soul.</p></blockquote>

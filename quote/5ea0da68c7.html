<main class="wrap"><figure class="quote" id="q-5ea0da68c7" data-kw="">
<blockquote><p>Secondly, let me instance in the Lord’s Day; a day which is a sign betwixt God and his people, that He is their God that sanctifieth them. That as Idol-worshippers are known by keeping holidays to their Gods: So God’s people are known to be his people, by observing of his Holy day.

It is most true, that our ancient Doctrine established is purer in this point than can be found in most of the Churches, and excellent Laws we have for the backing of it: but I believe there hath not been in all the Christian World such high affronts offered to the Lord’s day, as of late hath been in England, and (I am confident) they all lie in the Deck charged, as the sin of the Nation, till by some public Act, the fourth Commandment be restored to its due place and honour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-marshall.html">Stephen Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached before the Honourable House of Commons, now assembled in Parliament, at their public fast, November 17. 1640</cite>, (London: Samuel Man, 1641), pp 32-33.</span></figcaption>

<blockquote><p>…as to the duties wherein the Sabbath is to be spent, which are shortly, all duties of immediate worship, whether they be inward, as meditation, self-examination, heart-prayer, either ejaculatory or more continued, heart-sorrow for sins, etc. or outward, as vocal prayer and singing of psalms, reading the Scriptures and other pious books, hearing the Word, etc.; or whether they be secret which may be both inward and outward, or private in families, as reading of the Word, confering on it, repeating sermons, praying together, etc. or public, as joining with the congregation in prayers and praises, hearing the Word read and the sense given, hearing of sermons, participating of the sacraments when dispensed, joining in solemn humiliations and thanksgivings when they fall necessarily or more conveniently to be on the Sabbath; All which and such like are proper duties for that day; to which liberal laying up and giving for the relief of the poor according to ability and as God blesses every man would be added as a suitable duty of it, though it be no duty of immediate worship.</p></blockquote>

</figure><figure class="quote" id="q-9d45030d56" data-kw="">
<blockquote><p>The festivals of the Old Testament Church are done away in Christ (Col. ii. 16, 17); and although when Providence calls for fasting or thanksgiving, a period of time sufficient for the duty may be lawfully appointed, yet there is no day holy except the Sabbath of the Lord (Exod. xx. 9, 10).

The evil of observing holy days of human appointment is very great. It reflects on the wisdom of God (Col. ii. 23); is a direct violation of the Divine law (Ezek. xliii. 8); is a part of Antichristian superstition (Dan. vii. 25); and it also tends to banish true religion, by diminishing respect for the Lord’s day.</p></blockquote>

</figure><figure class="quote" id="q-06a51df51a" data-kw="">
<blockquote><p>Her existence is independent of her civil establishment. Even her increase and prosperity may be attained in the midst of persecution. Yet her Establishment is a blessing, and every lawful means is to be employed for its maintenance. No principle must be sacrificed for it – but it is to be prized if it can be had consistently with principle.

We [the Irish Presbyterians] are to seek to procure for her what we enjoy ourselves, the patronage and support of the State, with uncontrolled freedom and independence. Let us ask our rulers to consider what they have done, and still do for us, and enquire why they should not do the same for them.

Do not our rulers know that our principles and practices are maintained without detriment to the State, and why should the same be refused to them? – Have not the rulers acknowledged, time after time, that to the Presbyterianism of Ireland they are mainly indebted for the security and peace of the country, and why should our privileges be denied to our parent Church of Scotland? We ask nothing for her which we have not ourselves enjoyed, and which we have not shown it is good for the State we should enjoy.

The voice of Irish Presbyterians should be heard in this question, and I trust that, for the sake of our rulers, as well as for our own, and for the Church of our Fathers, it shall be heard. Presbyterians are the friends of the Government, and they expect friendship in return. It would be a blunder in legislation to injure the Church of Scotland, which many years of regret and retraction might fail to correct. …

Presbyterians have their politics, but they value their religion more. And be the ruling powers who or what they may, the support of Presbyterian Ulster will be given to none who oppress the Church of their Fathers, and seek to suppress the fundamental principles of their ecclesiastical polity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-morgan.html">James Morgan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belfast News-Letter</cite>, 18 March 1842.</span></figcaption>

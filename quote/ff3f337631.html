<blockquote><p>What is the purpose of human existence? Both Christianity and classical philosophy in the Platonic and Aristotelian traditions answer that our highest end is to know God. But there is, according to Roman Catholic theology, a crucial difference between the knowledge of God that philosophy makes possible, and the kind that Christian revelation promises. Unaided human reason can establish that there exists a divine first cause of the world. It can infer God’s unity, perfect goodness, omnipotence, omniscience, and many other divine attributes. But it cannot afford us a direct (as opposed to merely inferential) knowledge of God’s very essence or nature. For example, it cannot reveal the Trinitarian inner life of God as three divine Persons. The direct apprehension of God’s essence is known as the beatific vision, and Catholic teaching holds that it is not something we are naturally capable of. Attaining it requires grace or supernatural assistance in the sense of special divine action to raise us above or beyond (hence the prefix “super-”) what our nature makes possible. Since it is not an end we are naturally capable of achieving, neither is it an end we are by nature made for. Rather, it is a supernatural end (again, in the sense of above or beyond our nature), to which God has graciously raised us. By nature alone we are aimed only toward an incomplete knowledge of God, such as the kind that philosophy provides. By grace we are directed toward the most intimate knowledge of him that is possible for a created thing. I have left out various nuances and details… On one side [of the 20th century Romanist debate] were Thomist theologians (that is to say, followers of St. Thomas Aquinas) such as Reginald Garrigou-Lagrange (1877–1964), who developed and defended the account just summarized. … …human beings are not, by nature, completely closed off to the beatific vision. They do by nature have what is called an “obediential potency” for it, a built-in capacity to have a supernatural end added to them. But Hart [who is Eastern Orthodox] dismisses this notion as doubletalk. If we really have such a capacity, he says, then this would after all amount to a natural orientation toward the beatific vision; whereas if it would not amount to that, then we are back to the problem that, by raising us to that end, God would be replacing us with some other kind of creature rather than transforming us. The notion of an “obediential potency” is supposed to be a middle ground between these options, but, Hart insists, there is no such middle ground. Yet that Hart is wrong about this is clear even from simple analogies drawn from everyday modern life. Consider the laptop computer on which you might be reading this. There is an obvious sense in which it is complete all by itself, with its operating system, other software installed in the factory, built-in Wi-Fi capability, and so on. Yet it has the capacity to have added to it all sorts of new software and accessories (via download, or through USB and HDMI ports and the like)—including, if it is old enough, some that had not even been invented at the time the computer was designed and manufactured. Since software and accessories of the latter sort were not even in view when the computer was designed, they cannot be said to be ends for which the computer was made. All the same, they are ends that might be added to it, because it does at least have the inherent capacity to have such ends added to it. This is analogous to the notion of an “obediential potency,” and it indicates the sense in which there is indeed a middle ground of just the sort Hart claims is impossible. In what Thomists call a state of “pure nature,” human beings would not have the beatific vision as an end to which they are directed, any more than a computer is oriented toward running some application that did not even exist when it was manufactured. But just as a computer does nevertheless have a capacity to have such applications added to it, so too are human beings made in such a way that an orientation toward the beatific vision might be imparted to them. Hart’s second main objection is that any rational creature would, just by virtue of being rational, desire to know the very essence of the first cause of all things, so that such knowledge would be its natural end. There is a sense in which the premise is true, but the conclusion does not follow. To borrow an example from the philosopher Thomas Nagel, consider that there is an obvious sense in which a human being might desire to know what it is like to be a bat—to fly through the air the way a bat does, to get around via echolocation, and so on. Yet there is also an obvious sense in which it is simply not part of our nature to do these things, so that human beings can live complete lives as the kind of creatures we are without doing them. For that reason, our curiosity about what it is like to be a bat does not entail a sense of deprivation or loss in the way that, say, a missing limb would. In an analogous way, had human beings been created in a state of “pure nature,” without a divinely imparted orientation toward the supernatural end of the beatific vision, they might in a sense nevertheless wish that they could have a direct knowledge of God’s very essence. But they would also judge that this is simply no more possible for them than it is possible for them to know what it is like to be a bat, and thus they would not feel this impossibility as a deprivation of something they were by nature made for. The indirect knowledge of God that they are capable of would suffice. Now, like other critics of the Thomist position, Hart insists that an orientation toward the supernatural end of the beatific vision is natural to us. Taken at face value, this is simply incoherent. If an orientation toward a certain end really is natural to us, then it makes no sense to describe it as supernatural (that is to say, beyond our nature). Or, if it really is supernatural, then it makes no sense to describe it as natural. However, in fairness to Hart, I don’t think he is actually guilty of this particular sort of incoherence. In order to be guilty of it, you have to acknowledge that there really is a distinction in reality between the natural order and the supernatural order. Catholic thinkers like de Lubac do acknowledge this, which is why it is difficult for them to formulate a coherent alternative to the Thomist position. But Hart does not acknowledge it. He insists on collapsing the distinctions between natural and supernatural, between nature and grace, and between God’s creating us and his orienting us to the beatific vision. And this is where his position becomes truly radical—indeed, as I have said, pantheistic. To understand how and why Hart goes in the extreme direction he does, it is useful to note that one of the motivations for the Thomist position he rejects is the thesis that the vision of God’s very essence is natural only to God himself, and not to any created thing (as Aquinas says in Question 27, Article 2 of De Veritate). This implies that to attribute to human beings a natural capacity to know God’s very essence would be to identify them with God.</p></blockquote>

vation+of+something+they+were+by+nature+made+for.+The+indirect+knowledge+of+God+that+they+are+capable+of+would+suffice.+Now%2C+like+other+critics+of+the+Thomist+position%2C+Hart+insists+that+an+orientation+toward+the+supernatural+end+of+the+beatific+vision+is+natural+to+us.+Taken+at+face+value%2C+this+is+simply+incoherent.+If+an+orientation+toward+a+certain+end+really+is+natural+to+us%2C+then+it+makes+no+sense+to+describe+it+as+supernatural+%28that+is+to+say%2C+beyond+our+nature%29.+Or%2C+if+it+really+is+supernatural%2C+then+it+makes+no+sense+to+describe+it+as+natural.+However%2C+in+fairness+to+Hart%2C+I+don%E2%80%99t+think+he+is+actually+guilty+of+this+particular+sort+of+incoherence.+In+order+to+be+guilty+of+it%2C+you+have+to+acknowledge+that+there+really+is+a+distinction+in+reality+between+the+natural+order+and+the+supernatural+order.+Catholic+thinkers+like+de+Lubac+do+acknowledge+this%2C+which+is+why+it+is+difficult+for+them+to+formulate+a+coherent+alternative+to+the+Thomist+position.+But+Hart+does+not+acknowledge+it.+He+insists+on+collapsing+the+distinctions+between+natural+and+supernatural%2C+between+nature+and+grace%2C+and+between+God%E2%80%99s+creating+us+and+his+orienting+us+to+the+beatific+vision.+And+this+is+where+his+position+becomes+truly+radical%E2%80%94indeed%2C+as+I+have+said%2C+pantheistic.+To+understand+how+and+why+Hart+goes+in+the+extreme+direction+he+does%2C+it+is+useful+to+note+that+one+of+the+motivations+for+the+Thomist+position+he+rejects+is+the+thesis+that+the+vision+of+God%E2%80%99s+very+essence+is+natural+only+to+God+himself%2C+and+not+to+any+created+thing+%28as+Aquinas+says+in+Question+27%2C+Article+2+of+De+Veritate%29.+This+implies+that+to+attribute+to+human+beings+a+natural+capacity+to+know+God%E2%80%99s+very+essence+would+be+to+identify+them+with+God.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+%E2%80%98David+Bentley+Hart%E2%80%99s+Post-Christian+Pantheism%E2%80%99+%282022%29+at+Public+Discourse&amp;url=https%3A%2F%2F5solasquotes.github.io%2 <blockquote><p>Second, by metonymy and metaphor [metaphoram metonymicam], it can also denote the light of natural knowledge. The latter is twofold: [1.] the one is implanted in us, given from outside, or external, because it is presented and extended to man externally through God’s moral providence, and is nothing but the book of nature and the means, aids, and opportunities in this universe made available for natural knowledge and reasoning, which occurs apart from supernatural revelation; [2.] the other is innate or internal because it is implanted and introduced inside of us. The latter is again twofold: [1.] either it is imprinted on all people from birth, and functions as a principle [ad modum principii] or rather a dispostiion [habitus] of principles, and is called ‘common sense’ [communis sensus] and ‘common notions’ [communes notiones], which we have treated in the disputation On atheism [Select Theological Disputations 1.114-225]; [2.] or else it is acquired and newly added in man after birth by God’s general help, and functions as a science [ad modum scientiae] or a disposition (habitus) of conclusions, by which the mind [mens] is disposed, qualified, and determined to obtain factual knowledge, to form concepts and to draw legitimate [rite] consequences concerning God and divine things from the principles. For this internal or innate light, see Romans 2:14-15; Psalm 19:1, 8; Romans 1:19-20.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Second, by metonymy and metaphor [metaphoram metonymicam], it can also denote the light of natural knowledge. The latter is twofold: [1.] the one is implanted in us, given from outside, or external, because it is presented and extended to man externally through God’s moral providence, and is nothing but the book of nature and the means, aids, and opportunities in this universe made available for natural knowledge and reasoning, which occurs apart from supernatural revelation; [2.] the other is innate or internal because it is implanted and introduced inside of us. The latter is again twofold: [1.] either it is imprinted on all people from birth, and functions as a principle [ad modum principii] or rather a dispostiion [habitus] of principles, and is called ‘common sense’ [communis sensus] and ‘common notions’ [communes notiones], which we have treated in the disputation On atheism [Select Theological Disputations 1.114-225]; [2.] or else it is acquired and newly added in man after birth by God’s general help, and functions as a science [ad modum scientiae] or a disposition (habitus) of conclusions, by which the mind [mens] is disposed, qualified, and determined to obtain factual knowledge, to form concepts and to draw legitimate [rite] consequences concerning God and divine things from the principles. For this internal or innate light, see Romans 2:14-15; Psalm 19:1, 8; Romans 1:19-20.”

— Gisbertus Voetius, ‘The Use of Reason in Matters of Faith’ in Willem J. van Asselt, Introduction to Reformed Scholasticism (RHB, 2011), Appendix 2, pp. 226-27">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSecond%2C+by+metonymy+and+metaphor+%5Bmetaphoram+metonymicam%5D%2C+it+can+also+denote+the+light+of+natural+knowledge.+The+latter+is+twofold%3A+%5B1.%5D+the+one+is+implanted+in+us%2C+given+from+outside%2C+or+external%2C+because+it+is+presented+and+extended+to+man+externally+through+God%E2%80%99s+moral+providence%2C+and+is+nothing+but+the+book+of+nature+and+the+means%2C+aids%2C+and+opportunities+in+this+universe+made+available+for+natural+knowledge+and+reasoning%2C+which+occurs+apart+from+supernatural+revelation%3B+%5B2.%5D+the+other+is+innate+or+internal+because+it+is+implanted+and+introduced+inside+of+us.+The+latter+is+again+twofold%3A+%5B1.%5D+either+it+is+imprinted+on+all+people+from+birth%2C+and+functions+as+a+principle+%5Bad+modum+principii%5D+or+rather+a+dispostiion+%5Bhabitus%5D+of+principles%2C+and+is+called+%E2%80%98common+sense%E2%80%99+%5Bcommunis+sensus%5D+and+%E2%80%98common+notions%E2%80%99+%5Bcommunes+notiones%5D%2C+which+we+have+treated+in+the+disputation+On+atheism+%5BSelect+Theological+Disputations+1.114-225%5D%3B+%5B2.%5D+or+else+it+is+acquired+and+newly+added+in+man+after+birth+by+God%E2%80%99s+general+help%2C+and+functions+as+a+science+%5Bad+modum+scientiae%5D+or+a+disposition+%28habitus%29+of+conclusions%2C+by+which+the+mind+%5Bmens%5D+is+disposed%2C+qualified%2C+and+determined+to+obtain+factual+knowledge%2C+to+form+concepts+and+to+draw+legitimate+%5Brite%5D+consequences+concerning+God+and+divine+things+from+the+principles.+For+this+internal+or+innate+light%2C+see+Romans+2%3A14-15%3B+Psalm+19%3A1%2C+8%3B+Romans+1%3A19-20.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+%E2%80%98The+Use+of+Reason+in+Matters+of+Faith%E2%80%99+in+Willem+J.+van+Asselt%2C+Introduction+to+Reformed+Scholasticism+%28RHB%2C+2011%29%2C+Appendix+2%2C+pp.+226-27&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F14f9d5ee14.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/14f9d5ee14.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-light-of-nature/#:~:text=Second%2C%20by%20metonymy%20and%20metaphor%20%5Bmetaphoram,2%3A14%2D15%3B%20Psalm%2019%3A1%2C%208%3B%20Romans%201%3A19%2D20." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The God that philosophy seeks, theology finds, and religion possesses.</p></blockquote>

</figure><figure class="quote" id="q-5c737ab3c4" data-kw="">
<blockquote><p>I here consider Francis Turretin’s approach to Natural Theology through an analysis of his response to Five important questions. First of all, what, according to Turretin, Natural Theology is and isn’t (as well as the contents of Natural Theology). Secondly, whether humans (fallen or regenerated) are able to engage in Natural Theology, and how. Thirdly, the relationship between Natural theology and the articles of faith. Fourthly, the uses and limitations of natural theology. Fifthly, the effect of Natural Theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-joseph-white.html">Thomas Joseph White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wisdom in the Face of Modernity: A Study in Thomistic Natural Theology (Ave Maria, FL: Sapienta Press, 2009) 340 pp. ToC | ‘Francis Turretin and Natural Theology’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><figure class="quote" id="q-2744cc85f0" data-kw="">
<blockquote><p>Bullinger (1504-1575), a Swiss reformer, was the successor of Heidrich Zwingli. He was one of the most influential of the earlier reformers… He was educated in the via antiqua [old way], learning from such greats as Aquinas and Scotus. In what follows, I provide quotes from Bullinger on the following subjects: Faith, Nature, Natural Reason, Natural Theology, and Natural Law. The quotes are accompanied only by short comments to help situate them or better understand them.” – Haines ‘John Calvin’s View of Natural Theology’ Abstract: “I will, therefore, consider Calvin’s claims about man’s natural knowledge of God under five headings: (1) What Calvin means by “knowledge of God”, (2) The possibility of knowledge of God, (3) The sources of man’s knowledge of God, (4) The content of this knowledge, and (5) the what man does with this knowledge (or, the effect of this knowledge on man).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-joseph-white.html">Thomas Joseph White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wisdom in the Face of Modernity: A Study in Thomistic Natural Theology (Ave Maria, FL: Sapienta Press, 2009) 340 pp. ToC | ‘Heinrich Bullinger on Natural Reason, Theology &amp; Law’</cite></span></figcaption>

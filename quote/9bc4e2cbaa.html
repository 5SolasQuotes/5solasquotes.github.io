<main class="wrap"><figure class="quote" id="q-9bc4e2cbaa" data-kw="">
<blockquote><p>10. The true and the lawful inward service of God is especially contained in the First Commandment, which is nothing else but the worshipping of the true God according unto the prescript of his Law.

11. The end of the First Commandement… He enjoins Himself to be worshipped and adored of us in the true practice of godliness.

12. Furthermore, although that the duties which we owe unto God be innumerable, yet they may be not unproperly referred unto four heads: The first is the inward acknowledging, whereunto is joined as an addition, the spiritual obedience of the conscience: the second is an assured trust: the thrid is, invocation, or prayer. The fourth and last, is thanksgiving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Propositions &amp; Principles of Divinity Propounded and Disputed</cite>, (London: 1591), ch. 29, pp. 67-68</span></figcaption>

</figure><figure class="quote" id="q-32dd884dec" data-kw="">
<blockquote><p>The worship (or service) of God is a work commanded of God, wrought through faith (principally) to the setting forth of the glory of God. In this definition there be three things, which in the true worship of God are necessarily joined together: First: The matter (or material part), which is a work commanded of God. Secondly: The cause, namely that the same work be done of faith, in Jesus Christ. Thirdly: The end, namely the glory of God, which the worker respects, that by this means he may declare himself obedient to his heavenly father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/niels-hemmingsen.html">Niels Hemmingsen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Way of Life A Christian, &amp; Catholic Institution comprehending Principal Points of Christian Religion</cite>, … (London: Jones, 1578), ‘Of the Worship (or Service) of God’, p. 180 Hemmingsen was a Lutheran.</span></figcaption>

</figure><figure class="quote" id="q-0c167cbccd" data-kw="">
<blockquote><p>Truth is opposed to a ceremony and shadow. The ceremonies of old were shadows, or the external body of religion, in which the soul and spirit of godliness should have been enclosed, but the Lord did always urge more earnestly the substance and truth than the ceremony, the weightier matters of the Law, piety, equity, and sobriety, than these lighter external ceremonies: He sets an higher account upon mercy than sacrifice, and upon obedience than ceremonies; But this people turned just contrary; they summed up all their religion in some ceremonial performance, and separated those things God had so nearly conjoined; they would be devout men in offering sacrifices in their washings in their rites, and yet made no conscience of heart and soul-piety toward God, and upright just dealing with men: Therefore the Lord so often quarrels them and rejects all their service as being a device and invention of their own which never entered in his heart, Isa. 1, from 10 to 16; Jer. 7 throughout; Isa. 66 to 6; Isa. 28. Now if you will examine it impartially it is even just so with us, there are some external things in religion which in comparison with the weightier things of faith, and obedience are but ceremonial; in these you place the most part, if not all your religion, and think yourselves good Christians if you be baptized and hear the Word, and partake of the Lord’s table and such like, though in the mean time you be not given to secret prayer and reading, and do not inwardly judge and examine yourselves, that you may flee unto a Mediator, though your conversation be unjust and scandalous among men; I say unto such souls, as the Lord to the Jews, Who hath required this at your hands? who commanded you to hear the Word, to be baptized, to wait on publick ordinances? Away with all this, it is abomination to his Majesty; though it please you never so well, the more it displeases Him; If you say, why commands He us to hear? etc. I say the Lord never commanded these external ordinances for the sum of true religion; that was not the great thing which was in his heart that He had most pleasure unto, but the weightier matters of the Law, piety, equity and sobriety, a holy and godly conversation adorning the Gospel: ‘What hath the Lord required of thee, but this, O man, To do justly, and walk humbly with thy God?’ So then thou dost not worship him in truth, but in shadow; the truth is holiness and righteousness; that external profession is but a ceremony; while you separate these external ordinances from these weighty duties of piety and justice, that they are but as dead body without a soul. If the Lord required truth of old, much more now, when He has abolished the multitude of ceremonies that the great things of his Law may be more seen and loved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of Christian Religion</cite>, … ([Glasgow] 1666 / 1667), 2nd Sermon on Jn. 4:24, pp. 134-35</span></figcaption>

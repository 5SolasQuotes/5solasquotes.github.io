<main class="wrap"><figure class="quote" id="q-ff1f25b0d8" data-kw="">
<blockquote><p>When she was baptized. Hereby it appeareth how effectually God wrought in Lydia even in a short moment. For it is not to be doubted but that she received and embraced the faith of Christ sincerely, and gave him her name, before Paul would admit her unto baptism. This was a token of mere readiness; also, her holy zeal and godliness do therein show themselves, in that she doth also consecrate her family to God. And, surely, all the godly ought to have this desire, to have those who are under them to be partakers of the same faith.

For he is unworthy to be numbered among the children of God, and to be a ruler over others, whosoever is desirous to reign and rule in his own house over his wife, children, servants, and maids, and will cause them to give no place to Christ. Therefore, let every one of the faithful study to govern and order his house so, that it may be an image of the Church. I grant that Lydia had not in her hand the hearts of all those which were of her household, that she might turn unto Christ whomsoever she would; but the Lord did bless her godly desire, so that she had her household obedient.

The godly (as we have already said) must endeavour, with might and main, to drive from their houses all manner of superstition; secondly, that they have not profane families, but that they keep them under the fear of the Lord. So Abraham, the father of the faithful, was commanded to circumcise all his servants with him; and he is commanded for the care he had to govern his house, and to instruct his family. Furthermore, if this duty be required at the hands of the householder, much more of a prince, that he suffer not so much as in him lieth the name of God to be profaned in his realm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Acts of the Apostles</cite>, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 19a: 104-05.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-335407d66a" data-kw="">
<blockquote><p>You therefore are changed from that sect by which you are separated, although the sacraments which you have are holy, since they are the same in all. That is why we wish you to be won away from your false position, so that your cut-off branches may be again rooted. The sacraments, which you have not changed, are approved by us as you have them; so, when we wish to correct your aberration, we must guard against doing a sacrilegious wrong to those mysteries of Christ which have not been vitiated by your vice. For, Saul did not vitiate the anointing which he had received, when King David, the devout servant of God, did such honour to it.

We do not rebaptize you when we wish to restore you to the root, because we approve the form of the lopped-off branch, if it is not changed, which, however, even when intact, is anything but fruitful without a root. It is one question about the persecutions which you say you suffered even under our mildness and tolerance, when your adherents individually committed such gravely unlawful acts, but baptism is another question, since we do not look to see where it is, but where it is validly. Wherever it is, it is itself, but the one who receives it is not himself wherever he is.

Therefore, in schism, we detest the individual wickedness of men, but we honour the baptism of Christ everywhere; so, for example, if deserters from an army carry off with them the standards of their commander, if the standards have remained safe they are recovered whether the deserters have been condemned to punishment or won back by clemency.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 87 to Emeritus, c. 405 in Letters: Volume II</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-c0133e5e55" data-kw="">
<blockquote><p>They went down into the water. Here we see the rite used among the men of old time in baptism; for they put all the body into the water. Now the use is this, that the minister doth only sprinkle the body or the head. But we ought not to stand so much about such a small difference of a ceremony, that we should therefore divide the Church, or trouble the same with brawls. We ought rather to fight even an hundred times to death for the ceremony itself of baptism, inasmuch as it was delivered us by Christ that we should suffer the same to be taken from us.

But forasmuch as we have as well a testimony of our washing, as of newness of life, in the figure of water; forasmuch as Christ representeth unto us his blood in the water as in a glass, that we may get our cleanness thence; forasmuch as he teacheth that we are fashioned again by his Spirit, that being dead to sin, we may live to righteousness; it is certain that we want nothing which maketh to the substance of baptism.

Wherefore the Church did grant liberty to herself, since the beginning, to change the rites somewhat, excepting this substance. For some dipped them thrice, some but once. Wherefore there is no case why we should be so straitlaced in matters which are of no such weight; so that external pomp do no whit pollute the simple institution of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Acts of the Apostles</cite>, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 18a: 364-65.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-a0f85afa30" data-kw="">
<blockquote><p>In fine, as each person is not admitted to baptism from respect or regard to one of his parents alone, but on account of the perpetual covenant of God; so in like manner, no just reason suffers children to be debarred from their initiation into the church in consequence of the bad conduct of only one parent. In the mean time we confess that it is indispensable for them to have sponsors. For nothing is more preposterous than that persons should be incorporated with Christ, of whom we have no hopes of their ever becoming his disciples. Wherefore if none of its relations present himself to pledge his faith to the church that he will undertake the task of instructing the infant, the rite is a mockery and baptism is prostituted. […]

[I]f we exclude from baptism those whom we have had proofs of having been domesticated, as it were, in the church, the exclusion would be too rigorous. In the mean time, therefore, waiting till greater progress have been made, and discipline have gained strength, let children be admitted to baptism on the condition we have mentioned, viz: that their sponsors engage that they will make it their business to have them brought up in the principles of a pious and uncorrupted religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to John Knox, 7 Nov. 1559 in John Calvin: tracts and letters, ed. Jules Bonnet, trans. M. R. Gilchrist (1858; 7 vols, Edinburgh, 2009), vii, 74-5.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

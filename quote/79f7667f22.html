<main class="wrap"><figure class="quote" id="q-79f7667f22" data-kw="">
<blockquote><p>Is there any other way the end or goal might exist already [as it must]? There would seem to be only four possibilities: It might exist in the natural object itself; it might exist in a Platonic “third realm”; it might exist in some human intellect, or in another intellect within the natural world; or it might exist in an intellect outside the natural world altogether. But it obviously doesn’t exist in the natural object itself; if the form of an oak were already in the acorn itself, it would be an oak, and it’s not. It cannot exist in a Platonic “third realm” either, at least not if one endorses (as the Scholastic teleological realist does) the Aristotelian realist critique of Platonic realism about universals. Nor can it exist in some human or other intellect within the natural order, at least not without a vicious regress. Humans obviously are not the ones directing acorns and other natural objects (including human beings themselves) to their natural ends… The only possibility remaining, then, is the last one: Final causation in the natural world is intelligible because there is an intelligence altogether outside the natural order that directs natural objects to their ends. To the “How can something non-existent be a cause?” objection to final causation, then, the Thomist’s reply is to say “It can’t. That’s why the final cause of a natural object must exist already as an idea or form in an intellect existing altogether outside the natural order.”</p></blockquote>

<blockquote><p>Objection 5… But sin unto death is sin against the Holy Spirit, as the Master [Peter Lombard] says…. Reply to Objection 5… so also among sins it is only those sins among mortal sins that are called “sins unto death” that, as far as they themselves go, are unforgivable. Therefore, sin is called “mortal” from the first death, but “unto death” because of the second death.” (Sentences, bk. 2, dist. 43, q. 1, art. 2; the ‘Exposition of the Text’ on this Distinction confirms this) For the Reformed: ‘That the Sin unto Death is the Same as the Sin Against the Holy Spirit’. . Disagreements What it is Thomas: “to sin through malice is to sin against the Holy Ghost.” (Summa, pt. 2 of 2, q. 14, art. 1) Turretin: “We say it is a universal apostasy from true Christianity or of the truth of the Gospel (of which one is convicted in his conscience); a total and persevering denial, hatred and resistance (whether sophistical or tyrannical) proceeding not from a common human weakness, but from special and deliberate wickedness and direct, diabolical hatred of it, joined with a contempt for all the means of salvation and final impenitency.” (1.647) Turretin’s view was the dominant view of the Reformed: ‘Of the Sin Against the Holy Spirit’. . Sin unto Death: Not to be Prayed for Thomas: “‘I do not say that anyone should pray for him.’ [1 Jn. 5:16]… then it must be understood in the sense that not just anyone should pray for such a sinner, since the conversion of these kinds of sinners is, as it were, miraculous. Hence just as not just anyone should pray for miracles to be performed, except great and holy men, neither should just anyone pray for the conversion of these kinds of sinners. Even so, according to the form of the words, it is not forbidden for there to be prayer for such a person.” (Sentences, bk. 2, dist. 43, ‘Exposition of the Text’) WCF 21.4: “Prayer is to be made for things lawful,[n] and for all sorts of men living… but not for… those of whom it may be known that they have sinned the sin unto death.[q] [n] 1 John 5:14 [q] 1 John 5:16</p></blockquote>

<blockquote><p>7. In Corollary 1 I had said that the opinion of Taurellus and Gorlaeus about man as a being per accidens stumbles in many ways. The argument by which they are moved is such. Two beings or complete substances make one per accidens and not per se: but the body and soul of man are two complete substances. Therefore. I respond: The major is not universally true; and the minor is denied. That in the presence of the disputation itself it may be aired to many and to the end, we now cursorily indicate these hypotheses: I. That man is a species of substance and animal created into one essence or nature from soul and body, we think is implied in Gen. 3:7, 1 Cor. 15:45, compared with Gen. 1:26-27. II. Christ-Theanthropos [God-man] (in whom there are two natures or complete substances) is one per se and not per accidens: for the union of natures was made into one suppositum, [Greek]. See the theologians on the person of Christ: Much more therefore substantially and per se the union was made between the soul and body of man, which indeed are not so far distant, nor are they such complete substances as divinity and humanity. III. The true human nature of Christ would not be more one substance through itself than in the death of the same … [These articles are about Christ, man, the soul and angels] … IX. This opinion even impinges on many metaphysical dogmas… … 5. That man is not a substance nor does he directly pertain to the predication of substance: but only indirectly, and per accidens is referred to it, since he is a being per accidens and collective. 6. That one man is no more one per se, than an army, a city, etc. where there are many men collectively. 7. That consequently man cannot be defined by an essential and perfect definition. 8. That the matter and form of a composite are properly matter, and its form is the union, that is an accident, or pure mode, namely a relation. See Gorlaeus, Exercit. 14, p. 266. 9. That the union of the human soul with its body is to be sought in some mere accident from those five, and indeed in position or posture: as some seem to concede. 10. That the body is not the nature of man, but only his instrument, through which the soul existing in the body operates.</p></blockquote>

<blockquote><p>Our intellect understands nothing except in virtue of the first light and truth, so every act of the intellect involved in thinking that something does not exist obtains in virtue of the first light. But it is impossible to think in virtue of the first light, that the first light or truth does not exist. Therefore, it is in no way possible to think that the first truth does not exist.</p></blockquote>

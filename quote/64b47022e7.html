<blockquote><p>Argument 5— When Paul commands us to pay tribute to princes (Rom. 13:6) because they are the ministers of God, he lays this ground, that the king has not all, but that the subjects are to give to him of their goods.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 68 rt col top</span></figcaption>

<blockquote><p>The Gibbites in 1681, and Russelites in 1682, and for some years, did maintain the same unhappy principles and practices [as the later M’Millianites after 1689]; and stated their testimonies against paying of excise and customs, and other fool things, not only for themselves, but separation from all that durst not go their lengths, even when imprisoned together going as far from us as the walls of the prison would allow them, and stopping their ears when we went about publick worship three times a day, which was our ordinary in each room… It is a piece of demented infatuation to make little or no difference betwixt that period [before 1689] and this [period after 1689 during toleration], and to follow the same methods that the Lord’s people were obliged to take against tyranny and defections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-walker.html">Patrick Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Six Saints of the Covenant in 2 vols., ed. David H. Fleming (London: Hodder &amp; Stoughton, 1901), vol. 1, Alexander Peden’s Life, Postscript</cite>, p. 143</span></figcaption>

</figure><figure class="quote" id="q-1e1630c6fb" data-kw="">
<blockquote><p>1 Cor. 6:12, ‘All things (indifferent) are lawful in themselves, but they are not expedient,’ if we be brought under the power or band of them by law. Therefore, in the means of worship, not only must we see what is lawful, but also what is profitable and conducing to the end… 1 Cor. 7:6, ‘But this I speak by permission, not of commandment.’ Therefore in things in which God has granted us liberty, to do or not to do, permission has place, not obliging necessity or penal laws. 13th Proposition. There cannot be commanding laws in things that are politicly good or evil according to the individual complexion, temperature, or gifts of singular men: [for example] to marry or not to marry, cannot be commanded, for where God looses, no power on earth can bind, v. 33. 1 Cor. 8:7, Paul condemns them in the use of their Christian liberty, ‘Howbeit there be not in every man this knowledge;’ then that rulers may make laws in things indifferent, without scandal, they must remove ignorance. 2. If there be but one person weak in knowledge (there is not in every man that knowledge), a law obliging all in things indifferent cannot be made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (London, 1646), Appendix, Question 1</cite>, pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

<blockquote><p>It is poor hungry skill… to say that any laws are made for private interests and the good of some individuals. Laws are not laws if they be not made for the safety of the people.</p></blockquote>

— Samuel Rutherford, Lex Rex... (1644; Edinburgh: Ogle, 1843), p. 124">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+poor+hungry+skill%E2%80%A6+to+say+that+any+laws+are+made+for+private+interests+and+the+good+of+some+individuals.+Laws+are+not+laws+if+they+be+not+made+for+the+safety+of+the+people.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex...+%281644%3B+Edinburgh%3A+Ogle%2C+1843%29%2C+p.+124&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5f64d52a4a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5f64d52a4a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/civil-government/#:~:text=It%20is%20poor%20hungry%20skill%E2%80%A6%20to,for%20the%20safety%20of%20the%20people." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cf842d1c29" data-kw="">
<blockquote><p>Objection 4 [by an Erastian]: When its required that the magistrates be men fearing God, hating coveteousness, etc. (Ex. 18:21; Dt. 1:16-17; 17:19-20), is not this an essential ingredient of a king as a king, that he read in the book of the Law, that he may fear God, Deut. 17? [Rutherford’s] Answer: There is a twofold goodness here to be considered: one of the magistrate as a magistrate, another as a good and Christian magistrate. The former is an official goodness, or a magistratical prudence, justice, and goodness; this is required of all magistrates, as such, to judge the people: so the acts of a heathen magistrate done according to common natural equity, by Nebuchadnezzar, Pilate, Caesar, Felix, Festus, are to be acknowledged as acts of a lawful magistrate, valid and no less essentially magistratical than if performed by King David; and of this goodness the Scriptures speak not as essential to a magistrate as a magistrate. But there is another goodness required of magistrates as they are members of the Jewish Church, and as they are Christians, and of these the Scripture speaks; and so magistrates not as magistrates, but as good and Christian, are to be such as fear God, hate covetousness, respect not the face and favor of men; so its denied that the fear of God, hating of covteousness, are essential ingredients of kings as kings. For kings as kings intend justice, peace, godliness, materially considered, both ex conditione operis [out of the nature of the work], and operantium [of those working]. But for justice and righteous judgment in a spiritual and an evangelic way, that belongs not to the essence of a magistrate, nec ex conditione seu ex intentione operis, nec ex conditione operantis [neither out of the nature or the intention of the work, nor out of the nature of the one working]: The Holy Ghost requires it of judges, as they would approve themselves as truly holy and religious, and would be accepted of God; And in this sense kings as kings do not serve God, nor the mediator Christ, nor yet as men; only they serve God and the mediator Christ as Christian Kings, or as Christian men rather.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (London, 1646), ch. 24, Question 20</cite>, pp. 547-48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

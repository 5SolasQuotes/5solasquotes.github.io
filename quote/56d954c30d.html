<main class="wrap"><figure class="quote" id="q-56d954c30d" data-kw="">
<blockquote><p>Heaven-work and heart-work are the chiefest parts of Christian duty. Christ often gives us his summaries of the Law and inculcates his great Command; Jn. 13:35; Mt. 22:37-39; Lk. 10:27. And so does the apostle, Rom. 13:10; 1 Pet. 1:22; 1 Jn. 3:11, 14, 23 &amp; 4:7, 11-12, 20; 2 Jn. 5. And the fruits of the Spirit are manifest, Gal. 5:22-23. James says that pure religion and undefiled before God, even the Father, is this, to visit the fatherless and widows in adversity and to keep ourselves unspotted of the world, James 1:27. Paul says, 1 Tim. 1:5, ‘The end of the commandment is charity out of a pure heart, and of a good conscience and of faith unfeigned:’ And then adds, ‘From which some having swerved, have turned aside to vain janglings’— In a word: The effectual belief of pardon and eternal glory given through Christ, and the love of God and man, with the denial of ourselves, and fleshly desires, and contempt of all things in the world, which are competitors with God and our salvation, with a humble patient enduring of all which must be suffered for these ends, is the nature and sum of the Christian religion. Do nothing therefore as a duty which is a hinderance to any of this. Contentious preachings and factious sidings which weaken love are not of God. The servant of the Lord must not strive, but be gentle to all men, 2 Tim. 2:24… It is one of the most important things in the world for the resolving of a thousand cases of conscience and the directing of a Christian life to know which duties are the greater and which are the lesser, and so which is to be preferred in competition; For that which is a duty at another time is a sin when it is done instead of a greater! as Christ has resolved in the case of the Sabbath. If good must be loved as good, then the greatest good must be most loved and sought. Sacrifice instead of mercy is a sin: Our gift must be left at the altar while we go to be reconciled to our brother. Mt. 5. Never hearken to those men who would set up their controverted duties or any positives and lesser things against the duties of nature itself or the great substantial parts of godliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1, Direction 39, ‘Know which are the great duties of a Christian life, and wherein the nature of true Religion does consist; and then pretend not any lesser duty against those greater, though the least when it is indeed a duty, is not to be denied or neglected’</cite>, pp. 209-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-798a5a79a7" data-kw="">
<blockquote><p>Thus, to return to the Scriptural example in Acts 21:20–26 (with 16:3 &amp; 18:21), when new Christians with serious misconceptions about what God required for public worship thought that Paul (a mature Christian teacher) taught against their way of worship, which was seriously defective, Paul, without a fuss, at the instigation of other Christian leaders, publicly led and performed that defective worship to prevent scandal to the erring, for the sake of visible Christian unity. Rather than dissent and abstain, Paul publicly led and participated in that defective, burdensome worship for the greater good. If that was true for inferior, carnal ordinances with no spiritual efficacy (2 Cor. 3:6–17; Heb. 7:18–19; 8:13; 9:10; 10:1–4), how much more does it pertain to impurities in the greater, spiritual, efficacious and enduring ordinances of God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, p. 81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

<blockquote><p>To put forward a more refined and true principle in alternative to [George] Gillespie’s: Things less than fully good, or impure, not inherently wrong, may in some circumstances, especially according to the degree of necessity, be personally, materially done, even in worship, public worship and Church government (though they occasion passive scandal in some), for the good in the things themselves and for attaining higher and weightier goods (in proportion to that degree), while seeking to avoid the greater hurt and scandal, without approving the impurities or what may be deficient in them. [John] Sprint essentially affirmed this principle, while Gillespie essentially denied it.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-cbbcc12bef" data-kw="">
<blockquote><p>Aquinas holdeth with Isidore, that a human Law (among other conditions of it) must both be necessary for removing of some evil, and likewise profitable for guiding us to some good. … Human Laws (in Mr. [Richard] Hooker’s judgment) must teach what is good, and be made for the benefit of men. Demosthenes describeth a Law, to be such a thing cui convenit omnibus parere, which it is convenient for every one to obey. Camero [John Cameron] not only alloweth us to seek a reason of the Church’s Laws (non enim (saith he) verae Ecclesiae libet leges ferre quarum non reddat rationem. It pleaseth not the true Church to make and publish Laws whereof she giveth not a reason:) but he will likewise have us, in such things as concern the glory and honour of God, not to obey the Laws of any Magistrate, blindly and without a reason. …

From Scripture we learn that neither hath the Magistrate any power, but for our good only [Romans 13:4], nor yet hath the Church any power, but for our edification only [Ephesians 4:12]. Law-makers therefore may not enjoin quod-libet, that which liketh them, nay nor always quod licet, that which is in itself lawful, but only quod expedit, that which is expedient and good for edifying.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dispute against the English-popish ceremonies, obtruded upon the Church of Scotland</cite>, (n.p., 1637), prefatory epistle.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>Also, in the Queries Touching the Ordination of Ministers [1647], written in opposition to the learned and much-approved book entitled Jus Divinum Regiminis Ecclesiastici [The Divine-Right of Church Government], the same controversy is touched upon frequently with more railing than reason by that furious Erastian [William Aspinwall, †1662] who composed the Grallae [Stilts] against [Willem] Apollnius [1602-1657]…</p></blockquote>

</figure><figure class="quote" id="q-4a1d55b285" data-kw="">
<blockquote><p>Papists exempt their clergy from the judgment of the civil power (though they be delinquents against it) and their [e]states, both civil and spiritual, from civil taxes, tributes, and penalties, both which [papal positions] we deny to ours, for: (1) This is repugnant to the law of nature, that church officers and members, as parts and members of the commonwealth, should not be subject to the government of that commonwealth whereof they are parts. (2) [This is] repugnant to the laws and practices of the Old Testament, under which we read of no such exemptions. Yea, we have instance of Abiathar the highpriest, who, for his partnership with Adonijah in his rebellion, was exiled by king Solomon, and so consequently deprived of the exercise of his office (1 Kings 2:26-27). (3) [This is] inconsistent with our Savior’s example, who, as subject to the law, held himself obliged to pay tribute to avoid offence (Mt. 17:26), which was an active scandal; and He confesses Pilate’s power to condemn or release Him was given Him from above (John 19:11). (4) And finally, [this is] contrary to the apostolical precepts, enjoining all to be subject to superior powers (Rom. 13:1-4; 1 Pet. 2:13-15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/degrees-of-impurities.html">London Ministers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jus Divinum</cite>, Jus Divinum, the Divine Right of Church Government, … (1646, 1647, 1654; NY: Robert Martin &amp; Co., 1844), pt. 2, ch. 9, section 1, ‘Of the Proper Receptacle &amp; Distinct Subject of All this Power &amp; Authority of Church Government… That the Political Magistrate is Not the Proper Subject of this Power’</span></figcaption>

</figure><figure class="quote" id="q-8abda43efa" data-kw="">
<blockquote><p>…princes, and all who hold the office of magistracy, are here reminded of their duty. It is not enough, if, by giving to every one what is due, they restrain all acts of violence, and maintain peace; but they must likewise endeavor to promote religion, and to regulate morals by wholesome discipline. The exhortation of David (Psalm 2:12) to “kiss the Son,” and the prophecy of Isaiah, that they shall be nursing — fathers of the Church, (Isaiah 49:23) are not without meaning; and, therefore, they have no right to flatter themselves, if they neglect to lend their assistance to maintain the worship of God.</p></blockquote>

<blockquote><p>Section 10. …the house of representatives… each member, before he takes his seat, shall make and subscribe the following declaration, viz: ‘I do believe in one God, the creator and governor of the universe, the rewarder of the good and the punisher of the wicked. And I do acknowledge the Scriptures of the Old and New Testament to be given by Divine inspiration.’ … Section 45. …And all religious societies or bodies of men heretofore united or incorporated for the advancement of religion or learning, or for other pious and charitable purposes, shall be encouraged and protected in the enjoyment of the privileges, immunities and estates which they were accustomed to enjoy, or could of right have enjoyed, under the laws and former constitution of this state.</p></blockquote>

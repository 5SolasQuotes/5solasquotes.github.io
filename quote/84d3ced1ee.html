<blockquote><p>Again, observe that great severity goes along with the greatest mercy. The Gospel is the greatest mercy that ever came into the world, and there is the greatest severity with the Gospel, that ever came with any mercy into the world; now is the axe laid, when the Gospel is coming. Funcuius observes that John began his Ministry in the fifteenth year of Tiberius, Augustus died the twentieth of August, Tiberius succeeded him, whose reign is reckoned from that of August, and not from January; on the first of September, which was the feast of Trumpets, and on which day was the promulgation of the year of Jubilee, then was the voice of the Cryer first heard: At this time, which was very festival, John preached and said, Now the axe is laid to the root of the tree, at the year of Jubilee, and coming of the Gospel it’s done. Here was the acceptable year, and the day of vengeance together; the acceptable year of Christ’s coming, and the day of vengeance, the axe is laid to the root of the tree.

To give more light and strength to this point, be pleased to take into your thoughts these passages in the Gospel, Mark 16. 16. Go (saith Christ) preach the Gospel, he that believes shall be saved, he that believes not shall be damned: upon non-believing presently is damnation entailed. John 3. 18. he that believeth not is condemned already. Matth. 10. 14. Shake off the dust of your feet against that City and Town that doth not receive you: Shake off the dust of your feet against them, that shall be a testimony against them: It shall be more easy for Sodom and Gomorrah in that day, then for that Town, that City, that, People, that Christian, that refuseth the means of grace, and the Gospel of Christ.

Is not here the greatest severity with the greatest mercy in the world? And the reason is, because the Gospel is the height of God’s mercy; the Angels they had simplicem misericordiam, bare and naked mercy; but men have divitias miserioordiae, the riches of mercy: in the Gospel, as there is plenitudo gratiae, so plenitudo irae, plenty of mercy, and plenty of wrath too: If there were a sword on Moses’ thigh, there is an axe in Christ’s hand; if there be fire in the Law, there is fire and brimstone in the Gospel. In the Law God kept Assizes once a year; in the Gospel he keeps Sessions every month: If he died without mercy that despised Moses’ Law, he must die with all severity that despises Christ; Luk. 19. 27. Bring those mine enemies, that will not that I should reign over them, and stay them before me: Rev. 8. 13.

Dread fuller woes are pronounced under the Gospel then under the Law, Woe, Woe, Woe, to the inhabitants of the earth: so Mat. 18. 7. Woe to the world: there was never a general Woe pronounced upon the world before this time; but now, Woe unto the world: and the plagues since the coming of Christ have been greater upon the world then before as the Trumpets and Vials in the Revelation do manifest. Till Christ was come, and the blessings of the Gospel were tendered to the Jews, they never had a perfect bill; but after he was come, and the grace of the Gospel refused, then the bill of Divorce was perfected, Thes. 2. 16. they cast out of God’s family, and his wrath came upon them to the utmost, … to the utmost, even to perfection: God would bear no more, but cut them off presently, and with as much severity as ever we read of any.</p></blockquote>

<blockquote><p>Another very heinous sin amongst us, is Profanation of the Lord’s Day, and neglect of the Worship of God. How many are idling away their time at home, or which is worse, sinning it away in Tipling-houses, whilst they should be attending the Public Service of God? Or if they afford their bodily presence there for an hour or two, how soon after do they betake themselves to their pleasures, as if the rest of the day were their own? Or as if when they had prayed to God, to keep them that day without sin, they might boldly commit it? As if when they had begged of God, to teach them to keep (amongst the rest) the Fourth Commandment, they might then take Liberty to break it? And by their after-practice, one would judge their prayer had been, Lord have mercy upon us, and give us leave to break this thy Law.

Some go to their Drunken Companions, some to their Sports; others to walk idly in the streets or fields; and the most to their common, vain and worldly discourse: To any thing, rather than to private meditation, or Family-repetition of what they have heard. How far are men from spending this day, as beseems those who have Immortal Souls to care for, and can spare but little time on week-days for such employments? Oh how exceeding few are there that are willing rightly to inform themselves of the nature, use and end of this day, and accordingly to improve it?

As it is a day set apart to commemorate not only the work of Creation, but chiefly of Redemption by Christ our Lord, and especially his Resurrection, that being to him as a kind of rest from his Labours: And moreover, as it may be to us a Type and a Resemblance of the Eternal Sabbatism we shall enjoy in the Heavens: When we shall rest from all sinful, troublesome, and bodily works, and be wholly employed in the admiration, and praise of that Divine Love, which contrived and wrought our Redemption and Salvation. To have leave thus to spend a day with and for God, would be sufficient to engage holy and ingenious Souls, with all alacrity and thankfulness to embrace the opportunity.

Such would be ashamed to stand reasoning and enquiring whether they might not halve it with God, and rob him and themselves of a good part. What a strange tedious thing is it for poor Creatures, that know not God, nor their own necessities, to be obliged to consecrate One day in Seven to spiritual Services, for which, awakened and experienced Souls think their whole Life-time little enough? How many have we had crying, like those, Amos 8. 5. When will the New Moon be gone, and the Sabbath over? That they might again to their pleasures, or enjoyments! Nay, our People have been in more haste than so, they could not stay till the Sabbath was over, but must to their bargaining, their buying and selling. How frequent is this with many Shop-keepers in the City, when no necessity requires it? Well, if indeed you are so eagerly bent on your business, that you will not keep a Sabbath which God commands you, he’ll force you to another kind of Sabbath than this, which you shall have more reason to cry out, When will it be over?

You shall be made to rest from your works longer than this comes to, if you cannot afford God that small space of time he affords you: And you that were wont to be so weary of the Prayer and Sermon, and shift postures, first up, and then down, peeping at the Glass, or your Watch; Is it not equal that you should be held with those pains which shall make you weary for somewhat? when you shall turn from side to side, but get no ease, and count all the tedious hours of the night, expecting every moment to sink into that woeful state, where are no more days, or nights, or hours, where you shall never have a moments rest through a whole Eternity!

And then say whether the Service of God, or the Sufferings you feel from God, be the more tedious. If wicked wretches thus loosely encroach upon the Lord’s own day, may we not well fear lest God should depopulate our Land, that so at length it may enjoy its Sabbaths? And is it not just they should be seized with a disease, which admits not of a Minister to visit them, who in the time of life and health did so little care for their Minister? How many who have been shut up from all converse with men, were wont formerly to excommunicate themselves from the Public Congregation?

And if they would not stir over their Threshold to the Church, ’tis just they should not stir out at all. And may we not see many doors praying now, whose owners were not before wont to pray either in Public, or with their Families, on the Lord’s Day, or any other time? Nay, perhaps, might be deriders of all serious praying, and only use to take God’s Name in vain with their Formalities: Is it not just then, that those who were utterly unacquainted with, and it may be jeered at, praying by the Spirit, should be taught by the feeling of their flesh, to groan out an hearty Lord have mercy upon us.</p></blockquote>

<blockquote><p>There is one department of this subject which is usually discussed under the head of the history of the text, and with which you ought to possess some acquaintance. It may be said to be occupied practically with the investigation of these questions, what is the origin and what is the value of that text of the Greek Testament which has been in most general use since the invention of printing, and from which most of the translations of the New Testament into modern languages have been made, and whether there be any other text which is upon the whole preferable to it.

The investigation of this subject has produced much interesting information as to the sources from which the first printed editions of the Greek Testament were derived, the number and value of the MSS. so far as they can be ascertained, which were employed by the original editors, the different editions professing to rest upon critical foundations, which have since been published, the additional light that has been cast upon the state of the text, and the decision of the litigated questions about particular various readings applied, with the view of settling as the practical result of all, what is upon the whole the best and purest text of the Greek Testament that is now accessible.

The text that long prevailed in Europe, and from which most of the existing translations were made, commonly known as the textus receptus, is based chiefly upon editions published by Stephens [Robert Estienne] and [Theodore] Beza from MSS., and very closely resembling each other. This continued to be in general use, though the correctness of some of its readings had been doubted and questioned, till the publication of [Johann Jakob] Griesbach’s New Testament, of which, in the second or complete edition of it, the first volume was published in 1796 and the second in 1806. Griesbach laboured to shew that the textus receptus had been derived from a very small number of MSS., and these of no great antiquity or value, and that now there were materials for producing a decidedly purer and more correct text.

Most of the editions of the Greek Testament which have since been published in this country or upon the Continent have been based mainly upon Griesbach’s, or at least have in some form or other exhibited the principal of his various readings. Most of those who have examined this subject with attention have been of opinion that, upon the whole, Griesbach’s text is more pure and correct, approaches nearer to the original text of the inspired authors than the textus receptus, and I am disposed to think that this opinion is correct. At the same time I do not know anything which is better fitted to give a distinct and vivid impression of the substantial identity of all MSS. of the New Testament, of the extremely narrow range within which the investigation of the various readings from the application of all existing materials lies, and of the insignificance of the results which have been derived from the researches of critics as distinguished from interpreters, than just to run the eye over the inner margin of Griesbach’s New Testament.

There you have at one view all the words and phrases which he has removed from the textus receptus to make room for his own emendations, and you cannot fail to be struck with their utter insignificance, both in number and importance. And you will thus be very decidedly confirmed in your convictions of the purity and integrity of the text of the New Testament. And while it may be admitted that upon the whole and in general Griesbach’s text is preferable to the textus receptus, this does not hold in the case of each particular reading with respect to which they differ. There are several cases, and these of considerable comparative importance, as for example, the two passages to which we referred in the preceding part of this lecture, in which Scholz, the author of the latest critical edition of the New Testament, prefers, and apparently upon satisfactory grounds, the reading of the textus receptus, and of our common version, to that which Griesbach has substituted.</p></blockquote>

<blockquote><p>It is most agreeable to reason, that after six work days, one day should be consecrated to divine worship. The least division of days is into a week, the next greater division is into a month, the next into a year. Now by the light of nature it seems far more reasonable, that one day in seven should be imployed [sic] in God’s service, than one day in a month. And if a seventh part of our time be consecrated unto God, better a seventh day, than a seventh part of every day, because the worldly occupations of each of those days, must needs cause miserable distraction. Thus reason may discourse in probable manner, when God hath gone before us to open a way unto us. Certainly, when God hath once determined the proportion of time, it is so far from being accounted moral, as perpetual, and still to hold, until God himself shall alter it.</p></blockquote>

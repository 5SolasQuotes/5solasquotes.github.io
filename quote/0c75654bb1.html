<blockquote><p>We must examine ourselves to see whether we are willing to forgive our neighbours for the offences they have committed against us. If we desire God’s forgiveness of our sins, we will receive our neighbours’ words in such a way that we are willing to forgive them. Matthew 6:14 says, “For if you forgive men their trespasses, your heavenly Father will also forgive you.” Futhermore, we must not just forgive with our mouths but also with sincere hearts (Matt. 18:35).

To know whether our forgiveness comes from the heart, we should look for these signs. First, do we have true compassion for the neighbours who have offended us? Second, can we address them in kindness and live in close fellowship with them as much as possible? Third, are we prepared to do them good in soul and body and to pray for them with compassionate hearts? Joseph forgave in this way (Gen. 45:5; 50:21), as did Stephen, the first martyr (Acts 7:60), and Paul the apostle (Rom. 9:3).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/godefridus-udemans.html">Godefridus Udemans</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Faith, Hope, and Love</cite>, trans. Annemie Godbehere, ed. Joel R. Beeke (1621; Grand Rapids MI: Reformation Heritage Books, 2012), p. 151.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life.html">The Christian Life</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ad9458481a" data-kw="">
<blockquote><p>It is necessary that theological topics be blended in our discourses on the gospel with the rules of practical godliness; that the doctrines should lead to the precepts, and that precepts should always flow from the doctrines, that the former may enlighten, and that the latter may stir up, and so quicken the heart, or to speak more correctly, these two must be so commingled as every where to pervade our preaching.

As the precious stones in the breastplate of the great high priest were distinct and separate, and so arranged that the one could easily be distinguished from the other, but nevertheless, as they all at once, threw out one common light, in which their individual lustre and brilliancy were confounded, so in the sermons of the ministers of Jesus Christ, the subjects which are introduced, however different, and however arranged in the order which distinguishes them, ought to constitute one blaze of light in which the truth of the doctrines is so completely mixed with the holiness of the virtues, that they may come into view at the same time, and that there may be found at one point the shining of the Urim and Thummim, (i.e.,) the splendour of instruction with the soundness of good regulations.

As the lightning and the thunder accompany each other in such a way that you cannot tell which goes first, the eye supposing the lightning, and reason, on the contrary, (in the opinion of many) the thunder, so ought it to be with the doctrines and the precepts in sermons, — they should be so arranged that one hardly knows to which of the two to give his attention, that when you notice them, almost at the same time, and in the same instant, if possible, the eye may be struck with the lightning of the one, and the ear with the noise and thunder of the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-bosc.html">Pierre Du Bosc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protestantism. Being a Series of Discourses on a Portion of the Epistle to the Ephesians</cite>, trans. J. B. Law (1699; London: A. Hall, Virtue, &amp; Co., 1853), pp 275-77.</span></figcaption>

<blockquote><p>As the seal stamps its print and likeness upon the wax, so does God stamp the print and effigy of his own beauty upon his children.​</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beatitudes</cite>, p. 226</span></figcaption>

</figure><figure class="quote" id="q-2763b92bb8" data-kw="">
<blockquote><p>That direction, in this kind, which with me is instar omnium, is for a diligent endeavour to have the power of the truths professed and contended for abiding upon our hearts, that we may not contend for notions, but what we have a practical acquaintance with in our own souls. When the heart is cast indeed into the mould of the doctrine that the mind embraceth; when the evidence and necessity of the truth abides in us; when not the sense of the words only is in our heads, but the sense of the things abides in our hearts; when we have communion with God in the doctrine we contend for, — then shall we be garrisoned, by the grace of God, against all the assaults of men.

And without this all our contending is, as to ourselves, of no value. What am I the better if I can dispute that Christ is God, but have no sense or sweetness in my heart from hence that he is a God in covenant with my soul? What will it avail me to evince, by testimonies and arguments, that he hath made satisfaction for sin, if, through my unbelief, the wrath of God abideth on me, and I have no experience of my own being made the righteousness of God in him, — if I find not, in my standing before God, the excellency of having my sins imputed to him and his righteousness imputed to me?

Will it be any advantage to me, in the issue, to profess and dispute that God works the conversion of a sinner by the irresistible grace of his Spirit, if I was never acquainted experimentally with the deadness and utter impotency to good, that opposition to the law of God, which is in my own soul by nature, with the efficacy of the exceeding greatness of the power of God in quickening, enlightening, and bringing forth the fruits of obedience in me? It is the power of truth in the heart alone that will make us cleave unto it indeed in an hour of temptation.

Let us, then, not think that we are any thing the better for our conviction of the truths of the great doctrines of the gospel, for which we contend with those men, unless we find the power of the truths abiding in our own hearts, and have a continual experience of their necessity and excellency in our standing before God and our communion with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Evangelicæ; or, The Mystery of the Gospel Vindicated and Socinianism Examined</cite>, (Oxford, 1655) in William H. Goold (ed.), The Works of John Owen (1850-53; 16 vols, Edinburgh: Banner of Truth, 1966), xii, 52.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/spiritual-duties.html">Spiritual Duties</a></span></div>

<blockquote><p>Now, my friend, the question is not, whether you have any sin, or the whole body of sin within you; but, whether you have a principle of grace, lusting against it, and acting in opposition to it. I say, a principle of grace, for I believe that persons unrenewed may experience the strivings, and the powerful workings of the Spirit of God. But the real Christian has a holy principle implanted in every faculty of the soul, in opposition to the body of sin, called by the apostle, “the law of the mind,” — “his mind,” — “the spirit,” — “the divine nature,” — “the new creature,” — “the new man.” Now this is the knot, I apprehend, you want to be untied, and the difficulty which perplexes you. You want to have solved, the difference between the workings of this principle against sin, and the workings of natural conscience enlightened, and of every thing else which an unrenewed man may experience.

Consider attentively the following observations: 1. Conscience unrenewed condemns sin and the sinner; but grace mortifies sin and saves the sinner. 2. Conscience is partial and blind, condemning only some sins; but grace is universal in its aim, at least, and endeavour in mortifying every sin and the whole body of sin. 3. Conscience acts only at intervals, and is temporary; but grace is permanent and lasting. 4. Conscience may condemn with real hatred any one sin as sin; but grace hates it altogether and irreconcilably; therefore nothing will satisfy it less than the total destruction of sin.

5. There is an impotency in the workings of the natural conscience, and it is soon discouraged; but grace deals much with Christ and his gospel, finds strength to help in time of need, and is unwearied as well as courageous, in its lusting and warring against sin. The language of grace is evermore, “In the Lord have I righteousness and strength.” It will not therefore yield or give over until it has obtained a complete victory and deliverance. 6. There is nothing of true genuine humility in the workings of natural conscience; but it is peevish, and murmuring, and at variance with God, His law, and His Providence: but grace is supple, rolls in the dust, and is sweetly humble, and falls in, as it were naturally, with God and His ways, with His law, Gospel, and Providence.</p></blockquote>

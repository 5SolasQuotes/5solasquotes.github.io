<blockquote><p>We are no Brownists, to think a church can be perfect in this life and must be deserted for faults, but it is sin to be coagents with the errors of a church. Howbeit we lie in one bed with our mother kirk and touch her whole skin, yet it is a sinful society to lay our skin to her boils and scabs.</p></blockquote>

<blockquote><p>The common outcry is that it is the setting up of ‘altar against altar,’ which is not so, for at the most it is but altar by altar; and though I have often read of one Body, and one Spirit, and one Hope, and one Lord, and one Faith, and one Baptism, and one God and Father (Eph. 4:4-6), yet I could never find a word in all the New Testament of one altar, except Jesus Christ, Heb. 13:10, the Altar that sanctifies every gift, in whom we all centre. And if there be any of the dissenters who are schismatical, i.e. contentious, bitter, and uncharitable in their separation, let them bear their own burden; but by my presence with them I encourage that in them no more than I do too much of a like spirit in too many of those who are called the Church of England men, by my adherence to them. To conclude, by all this it is evident that unity of affection is the thing to be labored after more than uniformity in modes and ceremonies. We have been long enough trying to root schism out of the Church, vi et armis, by impositions, fines, and penalties, choking our brethren because their throats have not been so wide as ours; and it has been found ineffectual, even in the judgment of our great Sanhedrim, who have declared that giving ease to scrupulous consciences is the likeliest way to unite their Majesty’s protestant subjects in interest and affection. What if we should now try another method, and turn the stream of our endeavors into another channel? Hitherto we have been as it were striving which should hate one another most; what if we should now strive which should love one another best, and be most ready to do all offices of true charity and kindness, and bury all our little feuds and animosities in that blessed grave of Christian love and charity? What if we should every one of us of each party (as we have been too often called) set ourselves by our preaching to promote and propagate the Gospel of peace, and by our prayers to prevail with God for a more plentiful pouring out of the Spirit of peace, that the dividing names of Baalim may be taken out of our mouths, and that however it goes with uniformity of ceremony, we may keep the unity of the Spirit; and then I doubt not but we should soon see our English Jerusalem established a praise in the midst of the earth. And yet I am afraid even saints will be men; there will be remainders even of those corruptions which are the seed of schism, in the best, till we all come to the perfect man. And that is the comfort of my soul, that if we can but once get to heaven we shall be forever out of the noise and hurry of this quarrelsome, contentious, dividing world, and the Church Triumphant shall be no more militant; but that happy world of everlasting light will be a world of everlasting love.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Enquiry into the True Nature of Schism: or a Persuasive to Christian Love &amp; Charity</cite>, … (London: Parkhurst, 1690) 34 pp., pp. 32-34</span></figcaption>

<blockquote><p>Union may also be consistent with many particular failings and defects in the exercise of government; and possibly the sparing of so corrupt officers and members, yea, the censuring of some unjustly, or the admission of some that are unfit for the ministry, and such like. These indeed are faults, but they are not such as make a Church to be no Church. And though these have sometimes been pretended to be the causes of schisms and divisions in the Church in practice, yet were they never defended to be just grounds of schisms and divisions, but were ever condemned by all councils and fathers, and cannot be in reason sustained. Sure there were such corrupt acts of all kinds among the Jews’ Church officers: Yet is it clear that Nicodemus and Joseph of Arimathea did continue to govern jointly notwithstanding thereof, who yet cannot be counted accessory to any of their deeds, because (which is a third reason) men in such cases have access, even when they are present, to discountenance such corrupt acts by not consenting thereto, and testifying against the same; yea, they may by so doing stand in the way of many wicked acts, which by dividing they cannot do, which is sufficient for their exoneration both before God and men: As we may see in the instances of Joseph and Nicodemus mentioned, who continued united in the government, kept the meetings even when sentences pass against those who will acknowledge Christ, and orders for persecuting Him and them. And yet they are declared free, because they dissented from, and testified against the same: Yea, their freedom and exoneration, by virtue of their dissent, being present, is more solemnly recorded to their honor in the Gospel, than if they had divided.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

<blockquote><p>But that is expressly restricted to that broken and declining state of the Church, Informatory Vindication, page 73, and tantum pro tempore [so far as the time], while they continued in that course, Testimony, page 30. Now the ministry of these with whom we are pleading to unite [the established Church of Scotland in 1690], is not so circumstantiated; it is not subject to strange lords, nor have they any holding, new or old upon any usurped power; nor are they by any confederacy servants of men: nor is our hearing of them a submitting unto any encroachment made upon the privileges of this Church, or liberties of this kingdom… But as that is restricted to the then broken and declining state in three several repetitions, Informatory Vindication, page 74 and 76. So now it cannot be applied to the generality of the present ministers, who now neither condemn the then testimony in their preaching, nor if they did in some things differ from it, would it be a sufficient ground of withdrawing, when that now is not the testimony, and they are faithful in the present testimony againft Popery, Prejacy, Erastianism and tyranny, etc… But whatever might be said for justifying that then in that broken and declining state of the Church, page 78, when these compliances were snares and stumbling-blocks persisted in and defended, that cannot be an argument now for withdrawing from all these compliers, when now the Church is not so declining but recovering her freedom from fetters, when now these cease to be snares and stumbling-blocks, when they are not persisted in, seeing also all these compliances are not alike, nor do they all deserve deposition.</p></blockquote>

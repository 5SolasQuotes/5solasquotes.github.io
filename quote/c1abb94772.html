<main class="wrap"><figure class="quote" id="q-c1abb94772" data-kw="">
<blockquote><p>To this knowledge must be joined assent, which is the second act of faith, whereby a person receives and acknowledges as truths, those things which he knows, &quot;receiving the testimony of God, and thus setting to his seal that God is true,&quot; John 3:33. This assent is principally founded on the infallible veracity of God, who testifies of himself and of his Son, 1 John 5:9, 10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity</cite>, 3.7.11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a> › <a href="../topics/faith/nature-of-saving-faith/knowledge-assent-trust-fiducia.html">Knowledge, assent, trust (fiducia)</a></span><span class="t"><a href="../topics/faith/faith-as-instrument.html">Faith as Instrument</a> › <a href="../topics/faith/faith-as-instrument/faith-receives-christ.html">Faith receives Christ</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1cf054deb8" data-kw="knowledge assent trust fiducia acts of faith">
<blockquote><p>As to the acts, they are explained by theologians in different ways—some making more, others fewer. Some make only one, namely assent or persuasion. Others acknowledge only two—knowledge and assent. Others add a third (to wit, trust). Others a fourth also (to wit, confidence or the acquiescence of the will). These different opinions do not so much change the nature of faith as unfold it in different ways. And hence it is that some place faith equally in the intellect and the will; others only in the intellect formally and in the will only energetically or effectively and consequently.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.8.1b</span></figcaption>

</figure><figure class="quote" id="q-4c8b9ec505" data-kw="">
<blockquote><p>The third is faith, which is a miraculous and supernatural faculty of the heart, apprehending Christ Jesus, being applied by the operation of the Holy Ghost, and receiving Him to itself. … Christ is received when each individual person particularly applies to himself, Christ with His merits, by an inward persuasion of the heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Golden Chaine, or The Description of Theologie Containing the Order of the Causes of Salvation and Damnation</cite>, ch. 36</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The third is faith, which is a miraculous and supernatural faculty of the heart, apprehending Christ Jesus, being applied by the operation of the Holy Ghost, and receiving Him to itself. … Christ is received when each individual person particularly applies to himself, Christ with His merits, by an inward persuasion of the heart.”

</figure><figure class="quote" id="q-f4b62f779a" data-kw="">
<blockquote><p>Justifying faith is properly that which is defined in the catechism; according to which definition, the general nature of saving faith consists in knowledge and an assured confidence; for there can be no faith in a doctrine that is wholly unknown. … The difference, or formal character of saving faith, is the confidence and application which every one makes to himself, of the free remission of sins by and for the sake of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, Q. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a> › <a href="../topics/faith/nature-of-saving-faith/knowledge-assent-trust-fiducia.html">Knowledge, assent, trust (fiducia)</a></span></div>

</figure><figure class="quote" id="q-209fbb2df4" data-kw="">
<blockquote><p>To doubt the love, the wisdom, and the faithfulness of God; to doubt the perfection of the work of Christ; to doubt the operation of the Spirit on the heart, what can tend more to the weakening and decay of this precious and costly grace? Every time the soul sinks under the pressure of a doubt of its interest in Christ, the effect must be a weakening of the soul&#x27;s view of the glory, perfection, and all-sufficiency of Christ&#x27;s work. But imperfectly may the doubting Christian be aware what dishonor is done to Jesus, what reflection is cast upon his great work, by every unbelieving fear he cherishes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/octavius-winslow.html">Octavius Winslow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Personal Declension and Revival of Religion in the Soul</cite>, p. 74</span></figcaption>

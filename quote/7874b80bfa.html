<main class="wrap"><figure class="quote" id="q-7874b80bfa" data-kw="">
<blockquote><p>…yet it is certain that the immediate apostles of Christ did set certain orderly observances in the Church for decency’s sake: and it was justly allowable: As concerning the order of the exercise of their supernatural gifts, concerning women’s speaking in the Church, concerning men’s being covered in the Church, and women vailed, concerning the manner and order of receiving the Sacrament, and the like.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-hale.html">Matthew Hale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Judgment of the Late Lord Chief Justice Sir Matthew Hale, of the Nature of True Religion</cite>, … (London, 1684), pt. 2, p. 30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-d6eadf723f" data-kw="">
<blockquote><p>Let us, however, bear in mind, that in this matter the error is merely in so far as decorum is violated, and the distinction of rank which God has established, is broken in upon. For we must not be so scrupulous as to look upon it as a criminal thing for a teacher to have a cap on his head, when addressing the people from the pulpit. Paul means nothing more than this — that it should appear that the man has authority, and that the woman is under subjection, and this is secured when the man uncovers his head in the view of the Church, though he should afterwards put on his cap again from fear of catching cold. In fine, the one rule to be observed here is το πρέπον — decorum If that is secured, Paul requires nothing farther.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 11, | v. 4</span></figcaption>

</figure><figure class="quote" id="q-67d3f536c8" data-kw="">
<blockquote><p>Some of the interpreters refer these words [1 Cor. 11:16] to the question in hand, and think that the apostle is here opposing the custom of the Churches to these that contended for men covering their heads in public meetings: but the better sort take this to be spoken against the study of contention, and think the apostle his meaning here is only to show that it is not his fashion, nor the fashion of the Churches of God, to be contentious for matters of such indifferency as those were of.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-lindsay.html">David Lindsay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Ceremonies of the Church</cite>, … (London, 1625), p. 23 Lindsay was a prominent bishop and defender of the Articles of Perth (1618).</span></figcaption>

</figure><figure class="quote" id="q-0bb30d911a" data-kw="">
<blockquote><p>Sundry religious ordinances are appointed in the New Testament: that there should be every Lord’s Day a collection for the poor: that the man being after a more excellent manner the image of God should pray bare-headed, not being ashamed to show his head, but having a kind of headship over the woman; and the woman should cover her head, when she prays… no Christian Church can consist without some external rites and ceremonies, which if they be not repugnant to the Word of God, are to be observed by us, as these ordinances of religion were by the Jews. …In these indifferent things which in their own nature are neither good, nor evil, we must not contend, breaking the peace and unity of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jones.html">William Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Philemon and Hebrews</cite>, (London, 1635), on Heb. 9:1, pp. 327-28</span></figcaption>

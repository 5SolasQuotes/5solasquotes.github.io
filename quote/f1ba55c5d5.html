<main class="wrap"><figure class="quote" id="q-f1ba55c5d5" data-kw="">
<blockquote><p>Hence our Fifth Conclusion: when there is an equal rupture in the body, nothing extraordinary would be attempted if ordinary ways can be had: if Saul the ordinary magistrate had at God’s commandment killed Hagag, Samuel the prophet should not have drawn his sword; And therefore in this case [of a major and irresolvable rupture in the Church] the magistrate would first seek help from other Churches, as that learned Apollonius says. But if that cannot be conveniently had, as in a national Church it may fall out, then the magistrate, as a preserver of peace and truth, may command the sincerer part [of the ministry] to convene in a synod, and do their duty, as the good kings of the people of God did: 2 Chron. 15. Asa gathered together a people who entered in Covenant to seek the Lord God with all their heart, and laid an obligation of punishment to death on the rest, vv. 12-13, and Jehoshaphat, 2 Chron. 23:4, he laid charge on Hilkiah the High Priest, and the priests of the second order, whom he knew to be better affected to the work, to bring out the vessels made for Baal; which proves that the king should put the sincerest to do that, which in common belongs to the whole; In which case of the erring of the most part of the Church, the prince indirectly condemns the erring part of the synod, because it is his place to forbid and to punish with the sword, the transgressors of God’s Law. But because his power is accumulative, not privative, under that pretense he has not power to hinder the sincerer part to meet and determine according to the Word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Pt. 2, p. 411</span></figcaption>

<blockquote><p>2. The Church of believers have no authority ecclesiastical, nor power of the keys, if all the pastors on earth were removed from the Church by death; and in that case the keys should indeed be only in Christ’s hand, and the case being extraordinary, Christ [would be] behoved extraordinarily to supply the want of ordination, which Timothy, Titus and other elders do ordinarily give, for the Church of believers could not give that which they have not…</p></blockquote>

</figure><figure class="quote" id="q-eb03f0b236" data-kw="">
<blockquote><p>First, he that is not at all able to do the essential works of the ministry, that is, to teach the people the Christian faith and a holy life, and to pray and praise God with them, and administer the sacraments, and in some measure oversee the manners of the flock, is no minister, nor to be owned: For he wants [lacks] the essential qualifications: As an illiterate man can be no schoolmaster, nor he a physician, a pilot, an architect, who is utterly ignorant of their work. Secondly, he that preaches heresy, that is, denies any essential point of Christianity or godliness, after the first and second admonition is to be avoided. Thirdly, he that in his application endeavors to disgrace a godly life and to dissuade the people from it on false pretenses and encourages them to a life of wickedness, is a traitor to Christ and not to be owned in the ministry. In a word, any one whose ministry is such as tends to destruction more than to edification and to do more harm than good. But then remember that it is not partiality and passion that must here be judge: nor is everyone an opposer of godliness who opposes the errors of a party or the faults or follies of godly men. Fourthly, that pastor or church who will not let you have communion with them unless you will say or subscribe some falsehood or commit any sin of willful choice, does drive you from their communion by their unlawful terms; and it is not you that are the Separatists, but they.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1 | Direction 36, pp. 202-4</span></figcaption>

6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/pastors#:~:text=First%2C%20he%20that%20is%20not%20at,that%20are%20the%20Separatists%2C%20but%20they&amp;text=First%2C%20he%20that%20is%20not%20at%20all%20able&amp;text=not%20you%20that%20are%20the%20Separatists%2C%20but%20they" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f67c48a551" data-kw="">
<blockquote><p>3rd Distinction. There is a formal ordinary power, and there is a virtual or extraordinary power. 1st Conclusion. Christ Jesus has immediately Himself, without the intervening power of the Church or men, appointed offices and officers in his house, and the office of a pastor, and elder is no less immediately from Christ (for men as Christ’s vicars and instruments can appoint no new office in the Church) than the office of the apostles, Eph. 4:11; 1 Cor. 12:28; Mt. 28:19. The offices are all given to the Church immediately, and so absolutely, and so the power of the keys, is given to the Church the same way. But the officers and key-bearers now are given mediately and conditionally, by the intervening mediation of the ruling and ministerial Church, that she shall call such and such, as have the conditions required to the office by God’s Word, 1 Tim. 3:1-3… 2nd Conclusion. I deny not but there is a power virtual, not formal in the Church of believers, to supply the want of ordination of pastors or some other acts of the keys simply necessary, hic &amp; nunc [here and now]; this power is virtual, not formal, and extraordinary not ordinary, not official, not properly authoritative, as in a Church in an island, where the pastors are dead or taken away by pest[ilence] or otherways; the people may ordain pastors or rather do that which may supply the defect of ordination, as David without immediate revelation from Heaven to direct him, by only the Law of nature, did eat showbread; So is the case here, so answer the casuists and the schoolmen, that a positive law may yield in case of necessity to the good of the Church; so Thomas, Molina, Suarez, Vasquez, Vigverius, Sotus, Scotus, Altisiodorensis, Durand, Gabriel; and consider what the learned Voetius says in this: What if in an extreme case of necessity, a private man, endued with gifts and zeal should teach publicly, after the example of the faithful at Samosaten. Yea and Flavianus and Diodorus preached in Antioch, as Theodoret says; yea, says Voetius, an ordinary ministry might be imposed on a laic, or private person by the Church, though the presbytery consent not, in case of necessity. God (says Gerson) may make an immediate intermission of a calling by bishops; yea (says Anton. speaking of necessity’s law) the Pope may commit power of excommunication, quia est de jure positive, pure laico &amp; mulieri, to one mere laic, or a woman; though we justify not this, yet it is hence concluded that God has not tied Himself to one set rule of ordinary, positive laws: a captive woman (as Socrates says) preached the Gospel to the king and queen of Iberranes, and they to the people of the land.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<main class="wrap"><figure class="quote" id="q-2e1456b782" data-kw="">
<blockquote><p>religious differences should be managed religiously; that is, piously and charitably. This may be; it is possible; for it is prescribed and pressed: ‘Let us not therefore judge one another any more.’ (Rom.14:13) ‘But why dost thou judge thy brother? Or why dost thou set at nought thy brought?’ (Rom. 14:10) and ‘Let us therefore follow after the things which make for peace.’ (Rom. 14:19) And this should be: for charity is a grace of an universal extent; we owe it to all, – to the weak, to the ignorant, to the peevish, to the proud, to the good, and to the bad: ‘Owe no man any thing, but to love one another.’ (Rom. 13:8) And it is of that necessary connection with other saving graces, that we can neither have faith nor hope, unless we have charity; yea, ‘the greatest of these is charity’ (1 Cor. 13:13). And herein the true church of Christ hath ever excelled. The fathers of old, in their dealing with the Donatists, would account them their brethren, when they could not prevail with them for a reciprocation. And it is a golden saying of Bernard: ‘I will cleave to you against your will; I will cleave to you even against my own will: when ye are moved, I will be quiet; I will give place to anger, that I may not give place to the devil.’ And there is great reason for such a temper: for every difference in religion creates not a different religion: while men do hold the Head, they must needs be of the body. Where the same substantial doctrine is avowed, accidental variety is very tolerable, especially where the peace of God’s Church is not infringed. It was worthy bishop [Edward] Reynolds’s conclusion: ‘Where the same straight road to heaven is kept, a small difference of paths hinders not travelers from coming to the same inn at night.’ So neither should they bitterly contest about the next way, who steadily own the same Guide, the same rule, the same end; only, every one has not so clear an eye, nor such opportunity to know the more obscure points pertaining to the Christian religion, which others have. Therefore in these things Luther’s motto is best: ‘Where there is anything of Christ, there is love:’ and this love ‘will cover,’ not one or two, but ‘the multitude of sins’ and infirmities (1 Peter 4:8).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-steele.html">Richard Steele</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Various Puritans, The Morning Exercises at Cripplegate... vol. 4 (of 6), ed. James Nichols, 5th ed. (1659-1689; London: Tegg, 1844)</cite>, pp. 222-23</span></figcaption>

</figure><figure class="quote" id="q-e518acecc7" data-kw="">
<blockquote><p>I deny that want [lack] of future obedience in personal transgessions does argue that no Covenant has been made, or then to be disanulled: if so be, first, that the fundamental points of the Covenant be held by us, that is, that we do profess Him our God and no other; hold his Word to be our rule and none other; his sacraments to be the seals and none other: for in these three is the foundation of the Covenant, the persons one and the same, the writings one and the same, the seals one and the same: this binds each party to [the] other to perform the particulars of the Covenant thus made, and the party offending in some things for matter of fact, not disanulling any of these three, is only liable to reproof and punishment, but yet the Covenant does stand firm. A man and a woman do covenant together lawfully in marriage, the word of mutual promise passes solemnly between them to performe mutual duties, and the man gives a token to confirm the profession of his love and truth therein, which she receives: now she after is a very disobedient wife, and breaks the particulars of the covenant; but herein is she just, she holds none other [than] her husband; she stands unto the general covenant, and she keeps the token thereof: Though she be disobedient otherwise in many things, yet is there a covenant made and remains, so as yet there is true man and wife. And thus is it with his Church, as the example of the Israelites does show; of whom it is said that they were a stiff-necked people, Dt. 9:6, who often provoked God to anger, Ps. 95, and always resisted the Holy Ghost: Acts 7:51, yet had they covenanted with God, as Dt. 26:17, Moses tells them. Secondly, if the Lord on his part break not, the Covenant holds: for though the Lord complain that Israel had broken Covenant, yet were they for all that his people, until He cast them off and chose another to serve Him. It cannot be proved therefore that a people have not covenanted with God because of their personal evils in the Church; nor that therefore they be none of the Lord’s people, except it can be also proved that God has cast them off and chosen others. Now also I assume the latter part of the consequence, which is this: We have visibly covenanted with God to have Him for our God. We do hear the Word preached, we do profess faith to that Word, we entertain it as God’s Word; and we do receive the sacraments; our words, writings, and practice show this to be true. And therefore if these have made other people to be in Covenant with God, then the same do so make us in Covenant with God. And therefore also have we the form of a true Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Plain Evidences the Church of England is Apostolical, the Separation Schismatical... (London: 1610) | 8th Error of the Brownists</cite>, pp. 279-81</span></figcaption>

— Richard Bernard, Plain Evidences the Church of England is Apostolical, the Separation Schismatical... (London: 1610) | 8th Error of the Brownists, pp. 279-81">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+deny+that+want+%5Black%5D+of+future+obedience+in+personal+transgessions+does+argue+that+no+Covenant+has+been+made%2C+or+then+to+be+disanulled%3A+if+so+be%2C+first%2C+that+the+fundamental+points+of+the+Covenant+be+held+by+us%2C+that+is%2C+that+we+do+profess+Him+our+God+and+no+other%3B+hold+his+Word+to+be+our+rule+and+none+other%3B+his+sacraments+to+be+the+seals+and+none+other%3A+for+in+these+three+is+the+foundation+of+the+Covenant%2C+the+persons+one+and+the+same%2C+the+writings+one+and+the+same%2C+the+seals+one+and+the+same%3A+this+binds+each+party+to+%5Bthe%5D+other+to+perform+the+particulars+of+the+Covenant+thus+made%2C+and+the+party+offending+in+some+things+for+matter+of+fact%2C+not+disanulling+any+of+these+three%2C+is+only+liable+to+reproof+and+punishment%2C+but+yet+the+Covenant+does+stand+firm.+A+man+and+a+woman+do+covenant+together+lawfully+in+marriage%2C+the+word+of+mutual+promise+passes+solemnly+between+them+to+performe+mutual+duties%2C+and+the+man+gives+a+token+to+confirm+the+profession+of+his+love+and+truth+therein%2C+which+she+receives%3A+now+she+after+is+a+very+disobedient+wife%2C+and+breaks+the+particulars+of+the+covenant%3B+but+herein+is+she+just%2C+she+holds+none+other+%5Bthan%5D+her+husband%3B+she+stands+unto+the+general+covenant%2C+and+she+keeps+the+token+thereof%3A+Though+she+be+disobedient+otherwise+in+many+things%2C+yet+is+there+a+covenant+made+and+remains%2C+so+as+yet+there+is+true+man+and+wife.+And+thus+is+it+with+his+Church%2C+as+the+example+of+the+Israelites+does+show%3B+of+whom+it+is+said+that+they+were+a+stiff-necked+people%2C+Dt.+9%3A6%2C+who+often+provoked+God+to+anger%2C+Ps.+95%2C+and+always+resisted+the+Holy+Ghost%3A+Acts+7%3A51%2C+yet+had+they+covenanted+with+God%2C+as+Dt.+26%3A17%2C+Moses+tells+them.+

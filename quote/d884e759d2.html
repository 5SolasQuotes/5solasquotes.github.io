<main class="wrap"><figure class="quote" id="q-d884e759d2" data-kw="">
<blockquote><p>[T]he law, Deut. 13. 6, 7, 8, 9. concerning the stoning and killing of him, who shall secretly entice people, saying, Let us go after other gods. If it be said, that this law did bind the Jews only, and is not moral nor perpetual. I answer, Jacobus Acontius, though he be of another opinion concerning this question then I am, yet he candidly and freely confesseth, that he seeth nothing in that law, which doth not belong to the New Testament, as well as the Old; for saith he, the reason and ground of the law, the use and end of it, is moral and perpetual, ver. 11. All Israel shall hear and fear, and shall doe no more any such wickedness, as this is among you.

But yet, saith Acontius, this law doth not concern Heretics, who believe and teach errors concerning the true God or his worship; but only Apostates who fall away to other gods: In this I shall not much contend with him; only thus far, if Apostates are to be stoned and killed according to that law, then surely seducing Heretics are also to receive their measure and proportion of punishment; The moral equity of the law requireth thus much at least, that if we compare Heresy and Apostasy together, look how much less the evil of sin is in Heresy, so much and no more is to be remitted of the evil of punishment, especially the danger of contagion and seducement, being as much or rather more in Heresy then in Apostasy; yea, that which is called Heresy being oftentimes a real following after other gods.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wholesome Severity reconciled with Christian liberty, or, The true resolution of a present controversy concerning liberty of conscience here you have the question stated, the middle way betwixt popish tyranny and schismatizing liberty approved and also confirmed from Scripture and the testimonies of</cite>, (London: Christopher Meredith, 1645), p. 5.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-445d4bb9b7" data-kw="">
<blockquote><p>As for such who not only withdraw from this Church [of Scotland] but also have disowned the [Scottish] civil government always since this late happy [Glorious] Revolution [of 1689], and yet take the name of presbyterians to themselves [such as the United Societies and later Reformed Presbyterians], it is to be feared some of them may be under some bad Influence of Jacobites [those loyal to the previous king, James II and the House of the Stuarts], or else to be so weak as not to discern the absurdity of such a practice: And it is more remarkable that since King William came to the throne, these people have neither had minister nor preacher under the name of a presbyterian to countenance them in their sinful courses. And, in the year 1688 and 1689 we were so far from giving any countenance to such courses that we encouraged the publishing the Prince of Orange’s Declaration at Glasgow before it was published in any other place of the kingdom; we prayed publicly for success to his enterprise even before his landing in England; we swore (in the National Covenant renewed at Lesmahagow, March 3, 1689) that we would stand to the defense of his Highness, his person and authority when lawfully chosen and established as king or supreme magistrate over us. The people we preached to, in consequence of this, went to Edinburgh with others and guarded the Convention of Estates, anno 1689, and mustered in one day 1,140 men as a regiment under the command of the right honorable, the late Earl of Angus, to fight for religion and liberty under the authority of King William of glorious memory. All which make it evident that our former testimony against tyranny was from no disloyal principle to magistracy; and consequently that these people never had any encouragement to live as they do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-lining.html">Thomas Lining</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Epistle to the Reader’</cite>, p. vii in Alexander Shields, An Enquiry into Church-Communion, or a Treatise against Separation from the Revolution Settlement of this National Church, as it was Settled anno 1689 &amp; 1690… 2nd ed. (1706; Edinburgh: William Gray, 1747) Lining was one of the last three Cameronian ministers, all of whom joined the 1690 Church of Scotland.</span></figcaption>

<blockquote><p>But the sword is a means negatively to punish acts of false worship in those that are under the Christian Magistrate and profess Christian society, insofar as these acts come out to the eyes of men and are destructive to the souls of these in a Christian religion. Tis even so (and not otherwise punishable by the Magistrate), for he may punish omissions of hearing the doctrine of the Gospel and other external performances of worship, as these omissions by ill example or otherwise are offensive to the souls of these that are to lead a quiet and peaceable life in all godliness and honesty; Nor does it follow that the sword is a kindly means to force outward performances, for the Magistrate as the Magistrate does not command these outward performances as service to God, but rather forbids the omissions of them as destructive to man. For example, a physician commands fasting; pastors after the example of James commands fasting when judgments are on us; the physician commands it insofar as eating troubles the common society of humors, members and temper of the body, and the physician forbids eating so as he will have no more to do with the patient if he will disobey and so trouble the temper of the body, which is the only object the physician works on. Pastors command fasting to be in sincerity for afflicting and humbling the soul under the mighty hand of God. So the Magistrate forbids cutting of a vein or shedding of blood as a thing troubling the peace of human society, yet his command is not a direct means of preventing diseases in the body of a subject and for healthy living. But the physician commands to cut a vein and to shed blood for health and to prevent a disease, and sins neither against the Magistrate nor God in so doing: so does the Magistrate not directly command going to Church as a worship to God, so as his commands have influence on the conscience as the pastor’s commands have, but he commands going to church and hearing so as the omission of hearing hurts the society where of God has made him a civil and politic head.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), Ch. 4, pp. 51-2</span></figcaption>

<blockquote><p>The State, considered in its corporate character, is a MORAL PERSON, with a moral standing and responsibility. It is not the creation of the so-called social compact or of the popular will, but a divine institution based on natural religion. It coheres by a moral and religious bond; and its rulers are the lieutenants of God. If the State is a moral person, capable of performing duty, of committing sin, and suffering punishment, which everyone must own who traces the fate of nations according to the divine word, it follows that a nation, acting by its rulers, can accept Christianity and make a public profession of it as the national rule and guide. It had been held together previous to the recognition of Christianity by some form of religion however impure, without which it could not have existed. And the first duty of the civil ruler when brought in contact with Christianity and persuaded of its divine origin is to RECEIVE THE BIBLE AS A REVELATION in a national way. The immediate effect of this is that it constitutes the State a Christian State, and pledges it to purge out its previous religion in the same way as Pagan and Mahommedan nations constituted themselves, according to their false religions, or as the atheistic state was constituted, or rather attempted to be constituted, by the French Convention. A nation must have a religion, and the only question is, which it will adopt. And when Christianity comes to the nation, or to the family, it does not frown on either of these institutions, which also are divine in origin, but enters into them with an elevating purifying power, and sweetly coalesces with all that is purely human in both. These ordinances of God now became vessels by which Christianity is diffused. The national recognition of the Bible as a revelation subjecting the nation to its authority, though a great step gained, does not exhaust the nation’s duty, as widely diverging views prevail upon the right interpretation of the Bible. The State must by the necessity of the case ADOPT A CREED which will commonly be prepared by the Church. The same duty that devolves upon an individual Christian confronts a Christian State, and it naturally appends the civil sanction to the Church’s creed. It must distinguish between scripture truth and its perversion. The State, by the adoption of a creed, gives utterance to the self-consciousness of a Christian community. It confesses the Christianity it has adopted.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The State, considered in its corporate character, is a MORAL PERSON, with a moral standing and responsibility. It is not the creation of the so-called social compact or of the popular will, but a divine institution based on natural religion. It coheres by a moral and religious bond; and its rulers are the lieutenants of God. If the State is a moral person, capable of performing duty, of committing sin, and suffering punishment, which everyone must own who traces the fate of nations according to the divine word, it follows that a nation, acting by its rulers, can accept Christianity and make a public profession of it as the national rule and guide. It had been held together previous to the recognition of Christianity by some form of religion however impure, without which it could not have existed. And the first duty of the civil ruler when brought in contact with Christianity and persuaded of its divine origin is to RECEIVE THE BIBLE AS A REVELATION in a national way. The immediate effect of this is that it constitutes the State a Christian State, and pledges it to purge out its previous religion in the same way as Pagan and Mahommedan nations constituted themselves, according to their false religions, or as the atheistic state was constituted, or rather attempted to be constituted, by the French Convention. A nation must have a religion, and the only question is, which it will adopt. And when Christianity comes to the nation, or to the family, it does not frown on either of these institutions, which also are divine in origin, but enters into them with an elevating purifying power, and sweetly coalesces with all that is purely human in both. These ordinances of God now became vessels by which Christianity is diffused. The national recognition of the Bible as a revelation subjecting the nation to its authority, though a great step gained, does not exhaust the nation’s duty, as widely diverging views prevail upon the right interpretation of the Bible. The State must by the necessity of the case ADOPT A CREED which will commonly be prepared by the Church. The same duty that devolves upon an individual Christian confronts a Christian State, and it naturally appends the civil sanction to the Church’s creed. It must distinguish between scripture truth and its perversion. The State, by the adoption of a creed, gives utterance to the self-consciousness of a Christian community. It confesses the Christianity it has adopted.”

<blockquote><p>After some overtures of a Match in the Reign of King Henry the Eighth, the Reformed Church in this Kingdom was solemnly married to Jesus Christ, when the Sceptre was swayed by Edward the Sixth: that godly young Prince (as became the Bridegroom’s friend) rejoicing greatly because of the Bridegroom’s voice.

The famous nine and thirty Articles of her Confession then framed, were an evident sign of her being with child, and that a thorough Reformation was then conceived, though but conceived. Many and fore were the breeding fits she conflicted with in Queen Mary’s days, and such as gave occasion to fear that she would have miscarried.

But God sent her ease from heaven under the succeeding Princes: in which condition she went on for a long while, drawing still nearer and nearer her time. Six years ago, after this Parliament had sate a while it was generally believed that she was false into her travel. And, in the midst of all those sorrows which have befallen England since, her friends encouraged themselves with this hope, that the quicker and sharper her pains grew, the liker she was to be speedily delivered of that man-child, which was by them so greedily expected.

But, behold, as if all these had been but fore-runners of her labour, not bearing-throws, she continues still in pain: insomuch as they now begin to think she has not gone her full time, and earnestly to desire she may; because they fear nothing more than an abortive Reformation. However, evident it is, not only that her pains are multiplied, but that they are caused, partly by the malignity of her enemies, who have embroiled her in a bloody Civil War …</p></blockquote>

<main class="wrap"><figure class="quote" id="q-f6d80689e0" data-kw="">
<blockquote><p>Uncovering of the head: Though this last be not adoration, but a national sign of reverence, and is not every where adoration; yet Abulensis says, the Jews did pray and sacrifice with covered heads: So says Virgil, and Lod. Vives: Therefore the Corinthians had this from the Grecians as a civil sign of gravity, which should not be banished from God’s worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), ch. 1, p. 144</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-53ba2a652c" data-kw="">
<blockquote><p>The custom in these parts [in France] is, to put off the hat, when in public acts the king is named: Moreover the Protestants [Anglicans] in England do ordain that men put off their hats at sermons when they hear the name of Jesus. In like manner all countries haue their customs: that which is ridiculous and superstitious in one place, is held and esteemed comely and religious in another. The most expedient way would be, instead of calling one another idolaters and heretics, to exhort one another charitably to do all to edification, to avoid the appearance of evil and excess, and not to scandalize the infidels and unbelievers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/morton-eudes.html">Morton Eudes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Traditions, or a Treatise of the Belief of the Christians of Asia, Europa &amp; Africa in the Principal Controversies of our Time</cite>, … (London, 1609), Question 42, Annotation Eudes was a Romanist., p. 217</span></figcaption>

</figure><figure class="quote" id="q-93f1f5ab83" data-kw="">
<blockquote><p>First then David’s piety appears in these two actions:… 2. By the manner of his going barefoot. 3. With his head covered [2 Sam. 15:30-32]. Which was the Jewish custom of mourners, as we see, v. 32, and ch. 13:19… 2. His piety appears in his prayer which he made to God, v. 31…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-guild.html">William Guild</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Throne of David, or an Exposition of the Second of Samuel</cite>, … (Oxford, 1659), on 2 Sam. 15:30 to the end, p. 214</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“First then David’s piety appears in these two actions:… 2. By the manner of his going barefoot. 3. With his head covered [2 Sam. 15:30-32]. Which was the Jewish custom of mourners, as we see, v. 32, and ch. 13:19… 2. His piety appears in his prayer which he made to God, v. 31…”

</figure><figure class="quote" id="q-f25aa18f93" data-kw="">
<blockquote><p>But beware that you take not decent or comely ceremonies for essential parts of worship. The apostle urging women in the Church of Corinth to be covered, 1 Cor. 11:6, that which they might think was too much preciseness in him (for we may be apt to suppose he discontented them that did otherwise) was decent in his eyes, and commanded to be done; but not making it a point of worship, nor pressing it upon them as part of God’s service, declares that ceremonies may be used in, but ought ever to be differenced from the worship performed. In brief, whatever Ceremony of what nature or kind soever that is enjoined, that is not contrary to the Word of God, and by the officers of the Church thought comely to be used, as tending to make that worship then used to be the more reverenced and esteemed by the performers, is not to be opposed. This age discovers, what a disrespect, contempt, undervaluinig thoughts most men have (even good men in a great measure) of the house of God, table of God, service of God and servants of God, since decent and comely ceremonies were banished from the Church of God: and where such ceremonies are enjoined, and thou separatest, thou art guilty of renting the seamless coat, there being no cause for making that separation justifiable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-annand.html">William Annand</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fides Catholica, or, The Doctrine of the Catholic Church in Eighteen Grand Ordinances</cite>, … (London, 1661), ch. 1, question 6, p. 82 Annand (1633–1689) was born and educated in Scotland (University of Aberdeen, 1649) and took another degree at Oxford in 1655. He was ordained by an Irish bishop and wrote the following as an Anglican minister against the English puritans upon the restoration of King Charles II. He then served as a Scottish minister from 1663-1689.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-ecd50798a7" data-kw="">
<blockquote><p>3. We do not in the least doubt to affirm that some of these are empty quibbles, and that in most of them the disagreement arises, not from a real dissent of the Churches themselves, but partly from the preposterous zeal of certain ministers indulging too much in their own affections and genius, partly from not observing the pattern (ὑποτυπώσιν) of sound words, partly from not correctly understanding the mutual opinions of the dissenting parties, partly from a different mode of explaining, when there is consent in the thing explained. So that it is probable, if the matters themselves are more diligently weighed by pious, learned, candid, and moderate men of both parties, either in a synod or otherwise in friendly conference, a not insignificant, nay, a very great hope (with divine favor) may rightly be conceived, that these controversies will be settled, and a perfect concord in matters of faith may be entered into.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Determinations, ‘The Reformed Churches do not Dissent in the Fundamentals of the Faith’ in Works of Samuel Ward</cite>, pp. 149-53 in Theological Determinations, ‘The Reformed Churches do not Dissent in the Fundamentals of the Faith’ in Works of Samuel Ward… ed. Seth Ward (d. 1643; Gallibrand, 1658), p. 150</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4fbf76523b" data-kw="">
<blockquote><p>XIII. What chiefly prevents the Reformed from uniting with the Roman Church, while they are ready to reconcile with those who follow the Augsburg Confession, is that in the public and external worship of those singularly devoted to the Augsburg Confession, there is nothing that could gravely scandalize the Reformed and prevent them from attending in good conscience. Conversely, there is nothing in the Reformed worship that could reasonably offend the conscience of other Protestants or be a stumbling block to them. In neither case is anything publicly adored that is not believed and professed by both to be God. But the public and external worship of the Roman Church primarily consists of practices that the Reformed cannot, in good conscience, either perform or approve.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), ‘Whether from the proposed Reformed and Lutheran union, union with the Roman Church follows’, p. 952 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-84bad06d13" data-kw="">
<blockquote><p>Paul Stein, one of Landgrave Maurice’s chaplains at Kassel, made his debut as an irenicist when he published a sermon on Lutheran-Reformed unity which he had earlier delivered before the landgrave and Duke Frederick-Ulrich of Brunswick-Luneburg. He also authored a three-volume treatise entitled Evangelical Church Unity, printed in 1622/23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-stein.html">Paul Stein</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evangelischer Kirchen Briiderschaft</cite>, [Evangelical Church Unity], das ist: Ausfuhrlicher sonnenklarer Beweis, das beiderseits Evangelische im Grund der Seligkeit einig und ungeachtet deren zwischen ihnen noch schwebenden Streitigkeiten und Irrungen einander gar wohl mit gutem Gewissenfur Briider in Christo erkennen konnen, auch billig dafiir erkennen und halten sollen, vol. 1, 2, 3 (1622/1623)</span></figcaption>

</figure><figure class="quote" id="q-55588076c4" data-kw="">
<blockquote><p>§ 9. I now come to consider what apprehensions modern writers have had of schism… I choose one, whom, I think my [episcopal] antagonist will not except against, the learned Bishop of Worcester, in his Irenic. p. 109, the sum of whose discourse is: all are bound to join into some Church society; and being so joined, should continue in that society till his communion with them becomes sin. Now for what makes it sin to continue in Church communion, and consequently warrants separation; he supposes that corruption in the essentials of the constitution of the Church may warrant it…</p></blockquote>

<blockquote><p>Reply; How often have we shewed that this Text proves not that any Children, quatenus as such, should be baptized, nor, as such, that they are in the Covenant of Grace, or have the Promise made to them; the Promise runs to the Jews and to their Offspring, and not to them only, but to Gentiles also, who were said to be afar off: But pray observe, &#x27;tis to no more of the Jews and their Children or Offspring, and such who were afar off, than the Lord shall call or make Disciples by the Word and effectual Operations of the Holy Spirit. My Sons and Daughters are as much my Children when they are twenty or thirty Years old, as well as when Babes. Dr. Hammond also grants, Children in this Text doth not refer to Insants as such, but to the Posterity of the Jews, p. 490. Sect. 81. If ye be Christ&#x27;s, then you are Abraham&#x27;s Seed, and Heirs accordi</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-93fca1848a" data-kw="parties">
<blockquote><p>Now there is not the same signification attached to God’s covenant in the Scriptures. It denotes properly a pact and agreement entered into between God and man, consisting partly in a stipulation of duty (or of the thing to be done) and partly in the promise of a reward (which is the meaning in Gen. 17:2 where God is said to wish to make a covenant with Abraham). At one time it is taken improperly for a simple promise (as the promise not to destroy the world again by a flood is called a covenant, Gen. 9:9). At another time, it is taken metonymically for the symbols and sacraments of a covenant: as circumcision is called a covenant (Gen. 17); the eucharistic “cup” is said to be “the new testament in the blood of Christ” (Lk. 22:20), i.e., a sign and seal of it; then for “the tables of the covenant” laid up in the ark (1 K. 8:21); again for the “covenanted people,” as the people of God are called “the holy covenant” (Dan. 11:28, 30); and for the Messiah, the foundation of that covenant, in whom it is made with us (“I will give thee for a covenant of the people,” Is. 49:8). But we, dism</p></blockquote>

ml&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/93fca1848a.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-ee48a721c6" data-kw="unity">
<blockquote><p>From these things the state of the question can clearly be gathered. The question is not: (1) whether the covenant of grace was various as to accidentals and the different modes and degrees of dispensation and manifestation (for we confess that under this relation [schesei] there is a multiple difference between the Old and New Testament or the old and new economy, as will be proved in its proper place). Rather the question is whether it was the same as to substance and the essential parts of the covenant, i.e., both as to the covenanted themselves and as to the federal pact consisting in the mutual obligation of the parties. Whether the same Mediator (Christ) in both; the same faith in Christ; promises of the same spiritual and heavenly blessings; the same way of reconciliation and salvation—the economy and administration only of the covenant varying. This our opponents deny; we affirm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.5.5</span></figcaption>

</figure><figure class="quote" id="q-71eec92229" data-kw="surety">
<blockquote><p>Moreover, here at the outset, we ought to come back to what we before observed—that this covenant of grace (instituted between an offended God and sinful, guilty man) could not have been ratified except by the intervention of a mediator, to reconcile the parties at variance with each other and perform the office of a surety, not only in the name of God (promising that he would fulfill the promises of the covenant, if we would fulfill its conditions—as, following Socinus, Curcellaeus falsely quibbles); but also to God for us—that he will fulfill all those conditions for us, which being performed, the inheritance according to the testament will come to us (most especially as to the fullest satisfaction to be given to divine justice for our sins). Nor does any controversy exist here among the orthodox, but only with the Socinians and their associates (against whom we will argue when we treat of the satisfaction). Statement of the question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.9.2</span></figcaption>

</figure><figure class="quote" id="q-d728e80f6a" data-kw="abraham">
<blockquote><p>The reasons are: First, in general, the Scriptures teach that the covenant of grace (which God contracted with us in the New Testament) is the same with the covenant previously made with Abraham. Hence Zachariah says in his song, “God visited and redeemed his people, as he spake by the mouth of his holy prophets, which have been since the world began: to perform the mercy promised to our fathers, and to remember his holy covenant; the oath which he sware to our father Abraham” (Lk. 1:68, 70, 72, 73). And Peter addressing the Jews concerning the days of Christ (which had been predicted by all the prophets) says, “Ye are the children of the prophets, and of the covenant which God made with our fathers, saying unto Abraham, And in thy seed shall all the kindreds of the earth be blessed” (Acts 3:25). Paul mentions by name the promise of the gospel: “The Scripture, foreseeing that God would justify the heathen through faith, preached before the gospel unto Abraham, saying, In thee shall all nations be blessed” (Gal. 3:8).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.5.7</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The reasons are: First, in general, the Scriptures teach that the covenant of grace (which God contracted with us in the New Testament) is the same with the covenant previously made with Abraham. Hence Zachariah says in his song, “God visited and redeemed his people, as he spake by the mouth of his holy prophets, which have been since the world began: to perform the mercy promised to our fathers, and to remember his holy covenant; the oath which he sware to our father Abraham” (Lk. 1:68, 70, 72, 73). And Peter addressing the Jews concerning the days of Christ (which had been predicted by all the prophets) says, “Ye are the children of the prophets, and of the covenant which God made with our fathers, saying unto Abraham, And in thy seed shall all the kindreds of the earth be blessed” (Acts 3:25). Paul mentions by name the promise of the gospel: “The Scripture, foreseeing that God would justify the heathen through faith, preached before the gospel unto Abraham, saying, In thee shall all nations be blessed” (Gal. 3:8).”

— Francis Turretin, Institutes of Elenctic Theology, 12.5.7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20reasons%20are%3A%20First%2C%20in%20general%2C%20the%20Scriptures%20teach%20that%20the%20covenant%20of%20grace%20%28which%20God%20contracted%20with%20us%20in%20the%20New%20Testament%29%20is%20the%20same%20with%20the%20covenant%20previously%20made%20with%20Abraham.%20Hence%20Zachariah%20says%20in%20his%20song%2C%20%E2%80%9CGod%20visited%20and%20redeemed%20his%20people%2C%20as%20he%20spake%20by%20the%20mouth%20of%20his%20holy%20prophets%2C%20which%20have%20been%20since%20the%20world%20began%3A%20to%20perform%20the%20mercy%20promised%20to%20our%20fathers%2C%20and%20to%20remember%20his%20holy%20covenant%3B%20the%20oath%20which%20he%20sware%20to%20our%20father%20Abraham%E2%80%9D%20%28Lk.%201%3A68%2C%2070%2C%2072%2C%2073%29.%20And%20Peter%20addressing%20the%20Jews%20concerning%20the%20days%20of%20Christ%20%28which%20had%20been%20predicted%20by%20all%20the%20prophets%29%20says%2C%20%E2%80%9CYe%20are%20the%20children%20of%20the%20prophets%2C%20and%20of%20the%20covenant%20which%20God%20made%20with%20our%20fathers%2C%20saying%20unto%20Abraham%2C%20And%20in%20thy%20seed%20shall%20all%20the%20kindreds%20of%20the%20earth%20be%20blessed%E2%80%9D%20%28Acts%203%3A25%29.%20Paul%20mentions%20by%20name%20the%20promise%20of%20the%20gospel%3A%20%E2%80%9CThe%20Scripture%2C%20foreseeing%20that%20God%20would%20justify%20the%20heathen%20through%20faith%2C%20preached%20before%20the%20gospel%20unto%20Abraham%2C%20saying%2C%20In%20thee%20shall%20all%20nations%20be%20blessed%E2%80%9D%20%28Gal.%203%3A8%29.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2012.5.7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd728e80f6a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d728e80f6a.html">Permalink</a><span class="src none">No free online copy linked</span></div>

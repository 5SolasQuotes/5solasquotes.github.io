<blockquote><p>17. As God has not tied us to words in prayer or preaching (though he have recorded many forms in Scripture), but left all to choose what words, time and circumstances make fit (by book, or without) so the conveniences and inconveniences both of set forms and of free speaking are on each part so great and undeniable that we have no cause to censure that Church which uses both; that is, which agrees on a set form to show what the Church professes to own, if the minister should blutter out any error or indecency, and yet not restrain ministers from the due use of free speech. 18. It is a great sin out of a fond conceit of the excellency of either way above its due value to think and speak with unjust vilifying of the other way when God has tied us to neither alone: It is contrary to knowledge, love, peace and concord out of a self-conceitedness, peevishness or false prejudice received from others to think and speak worse of other men’s words in prayer than they deserve and to frighten the ignorant from lawful communion by calling that sin or false worship that is not so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, Detailed | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2, pp. 9-14 | On Free Prayer with Forms</span></figcaption>

<blockquote><p>Objection 2: There is much error mixed with the few truths they preach, as Popery, Arminianism, etc. There are also invective reflections, yea railings against the people of God. Answer 1: What is morally good will bear the mixture of a great deal of evil, and yet retain its goodness still: the goodness being from God, who is a greater good than Satan or sin is an evil. Answer 2: We cannot expect from men of ordinary gifts that truth be preached without the mixture of errors more or less: We know but in part, therefore are to prove all things, and hold fast that which it good, Heb. 5:14. A saint, as other creatures, though weak and newly born, has a raft of what is food suitable and what sincere. Answer 3: As for those intemperate expressions and reflections on the people of God: I confess it is sad, but were there not such against Paul and his party? (Phil. 1:15) Yet notwithstanding they are to be heard even by the same persons they enveighed against, for the truth’s sake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Case of Great &amp; Present Use: Whether we may Lawfully Hear the now Conforming Ministers who are Re-ordained &amp; have Renounced the</cite>, [Solemn League &amp;] Covenant &amp; Some of them [are] Supposed to be Scandalous in their Lives, Considered &amp; Affirmatively Resolved (1672; 1677), Consideration 2, pp. 12-13</span></figcaption>

<blockquote><p>…and their fear toward me is taught by the precept of men: therefore, behold, I will proceed to do a marvellous work among the people, even a marvellous work and a wonder; for the wisdom of their wise men shall perish, and the understanding of their prudent men shall be hid” (Isa. 29:13-14). And in another place, “But in vain do they worship Me, teaching for doctrines the commandments of men” (Mt. 15:9)… pious princes are repeatedly praised (2 Kings 22:1, etc.) for acting according to all his precepts, and not declining either to the right hand or the left. I go further: although there be no open manifestation of impiety in fictitious worship, it is strictly condemned by the Spirit, inasmuch as it is a departure from the command of God… And the more clearly the will of God has been manifested to us, the less excusable is our petulance in attempting anything.</p></blockquote>

<blockquote><p>The Church may be corrupted many ways, in doctrine, ordinances, worship, etc. And there are degrees of this corruption; the doctrine in some remote points, the worship in some rituals of man’s invention or custom. How many Churches do we find thus corrupted, and yet no separation of Christ from the Jewish Church, nor any commandment to the godly of Corinth, etc. to separate. I must in such a case avoid the corruption, hold the communion—But if corruptions invade the fundamentals, the foundation of doctrine is destroyed, the worship is become idolatrous; and what is above all, if the Church impose such laws of her communion as there is a necessity of doing or approving things unlawful, in that case, ‘Come out of Babylon.’ The Churches of Protestants so separated from Rome.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Sacrament, p. 239 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’, p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

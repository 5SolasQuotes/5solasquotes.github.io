<blockquote><p>How great a man indeed Job was, we are not told; but we know that he was a just man; we know, too, that in the endurance of terrible afflictions and trials he was great; and we know that it was not on account of his sins, but for the purpose of demonstrating his righteousness, that he had to bear much suffering.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ac4d4d3d72" data-kw="">
<blockquote><p>Secondly; a mournful sense of Afflictions sent from God is consistent with a dutiful resignation of our selves to his Will. ‘Twas the vain boast of the Philosophers, that their Instructions would fortify Men with such magnanimous Principles, and generous Spirits, as with an equal calm tranquillity of Mind to encounter all the fierce and sorrowful Accidents to which they might be exposed here: They speak high against Fortune and Fate, and resolve stubbornly, that no misery, whether Poverty or Disgrace, Torments or Death, should extort from them a confession that it was Misery. ‘Twas one of their Axioms, That a Wise Man is not subject to the vicissitudes and instability of things here below; That he suffers no conflict of contrary Passions in his Breast; that he is always above in the Serene, where no Tempests can disturb, no Eclipse can darken his Mind: But these proud pretensions were empty of reality.

Indeed such a perfect exemption from all afflicting Passions is neither possible nor regular in our present state: not possible, for the best Men are not all Spirit, but united to Flesh; and when the Body is under strong pains, the Soul suffers in its sufferings; and while we are thus compounded, the loss of those Comforts that support and sweeten the present Life, must cause Grief. ‘Tis easy to utter brave Expressions, and lay down severe Precepts in contempt of Evils when they are at a distance, but hard to sustain the Spirit under the actual feeling of them; ’tis one thing to discourse of a Battle, and another to be engaged in the heat of it. But supposing by a Philosophical Charm the Heart were so hardened as to be proof against the most piercing afflictions, such a forced insensibility is not regular, but proceeds from the extinction of Humanity and Piety, and that will appear by considering Afflictions in a natural or moral respect.

First, in a natural respect, for so they are destructive or oppressive Evils, and a pensive feeling of them is suitable to the Law of our Creation: for the Human Nature is framed with such Senses and Passions, as according to God’s intention should be affected suitably to the quality of their objects; and if the Soul acts rationally, ’tis moved accordingly. A Saint on Earth is not a Saint in Heaven, raised above all Disasters and Troubles, freed from all hurtful impressions from without, and sorrowful impressions within, but is liable to afflicting evils: And it is becoming his Duty to have his passions pliable to his condition, but without excess; the Eyes must not be drowned, nor dry, but tenderly affected.

Secondly; Considered in a moral respect, as they are sent from the high and just Providence of God, it is absolutely necessary there should be an humble resentment of his Displeasure. This is a consequent of the former; for if our affections are seared up, that we do not feel the stroke, how shall we regard the hand that smites us? If we are not sensible of Affliction, we are secure in our Sins. Natural Sorrow is introductive of Godly Sorrow. There are two extremes to be avoided by the afflicted, according to the direction of Solomon in the person of Wisdom, and repeated by the Apostle: My Son, despise not thou the chastening of the Lord, nor faint when thou art rebuked of him.

Some are discouraged and over-born by Afflictions as insupportable: others are stubborn and careless, and never lay them to heart: they never look upward to the original efficient Cause, an Offended God; nor inward to the impulsive deserving Cause, their Sins; but esteem them fortuitous Events that happen in this mutable state, without a design to correct and reform Sinners; or to proceed from a blind necessity, things of course; or merely regard the second Causes and Instruments of their Troubles: accordingly, when they meet with Calamities, all their care is by a perverse shift to seek for relief only in Temporal Comforts; without serious applying themselves to God, whose end in sending Troubles, is to reclaim us from Sin to Holiness, from Earth to Heavens, from the Creatures to himself.

This secret Atheism, like a benumbing Opium, stupefies the Conscience; and the insensibility of God’s hand inflicting Evils, is as different from Christian Patience and Constancy, as a mortal Lethargy is from the quiet, soft Sleep of Health: Nothing kindles his Anger more than neglecting it; ’tis equally provoking with the despising of his Love: It is a symptom of a wretched state of Soul; if there proceed no sighs and groans, no signs of grief from the sense of God’s displeasure, it is a sad evidence there is no Spiritual Life. Indolence under the effects of God’s Anger, is like the stillness of the Dead Sea, whose Calm is a Curse. The Jews, though intitled the People of God, are deeply charged for this prodigious Madness; O Lord, thou hast struck them, but they have not grieved; thou hast consumed them, but they refused to receive correction: they have made their faces harder than a Rock, they have refused to return. Jer. 5. 3.

We have whole Quarries of such obdurate Wretches amongst us; this impenitent disregard of God’s hand is a dreadful presage of future and more heavy Judgments. Who ever hardened himself against the Lord, and prospered? Do we provoke the Lord to Jealousy, are we stronger than he? The most refractory Sinner he can compel to acknowledge with bitter lamentations his Wickedness, and weakness, how unable he is to contend with his Judge. But supposing a respite from Punishment here, there is an Hell prepared for stubborn Sinners, where is Weeping and Wailing for ever. Whom the Rods do not awaken, the Scorpions shall.</p></blockquote>

<blockquote><p>First; an earnest deprecation of an impending Judgment, is reconcilable with our Submission to the pleasure of God, declared by the Event. Our Saviour with humility and importunity desired the removing of the Cup of Bitterness. We must distinguish between God’s Law, and his Decree and Counsel; The Law is the Rule of our Duty, and requires an entire exact subjection in all our Faculties, even in our internal Desires, in the first motions of the Will; the least velleity, or rising of the Heart against the Divine Command, is irregular and culpable; for not only the acts of Sin are forbidden in every Command respectively, but all the incitations of Concupiscence, before the deliberate judgment of the Mind, or the actual consent of the Will. But the Decree of God is not the Rule of our Duty, and Secret, till manifested by the event of things. This being premised, the Reasons are evident why we may pray against an Affliction that threatens us, without violating our Duty.

First; Because Afflictions are Evils which the Will naturally declines, and are not desirable things in themselves. They are not beneficial and productive of our good by any proper efficacy and operation, but by the over-ruling Providence of God, and the gracious assistance of his Spirit. When Aaron‘s Rod was put into the Sanctuary, and became green and flourishing with Blossoms and Almonds, ’twas not from any inherent virtue of its own, but from the special influence of the Divine Power; for the other Rods remained dead and dry: thus the happy effects of the Afflicting Rod are from Divine Grace.

Secondly; There are proper Temptations that attend the afflicted State. Many are encompassed in a sad Circle, their Sins procure Afflictions, and their Afflictions occasion many Sins. Indeed, Tribulation that is sanctified, by a happy gradation worketh Patience; and Patience, Experience of the Divine Mercy; and Experience, Hope, and Hope maketh not ashamed. But when it meets with a stubborn Spirit, there are fearful descents of Sin: Tribulation excites Impatience, and Impatience causeth Perplexity, and that Despair, and Despair Confusion.

The Devil lays his trains in every condition, and sometimes by immoderate Sorrow, sometimes by inordinate Joy, doth mischief to the Soul. And as more perish by Surfeits than Abstinence, yet the Diseases that are caused by emptiness, are more dangerous and incurable than those that proceed from fullness: So more are ruined by Prosperity than Adversity: But the guilty Passions that ferment and rage in Adversity, are more pernicious, and more hardly tempered and subdued, than the Luxurious Appetites that are fomented and drawn forth by Prosperity. We are directed by our Saviour to pray, that we may not be led into Temptation, and to be delivered from all Evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bates.html">William Bates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The great duty of resignation to the divine will in afflictions, enforced from the example of our suffering Saviour</cite>, (London: Brabazon Aylmer, 1684), pp 6-9.</span></figcaption>

</figure><figure class="quote" id="q-feaede9d94" data-kw="">
<blockquote><p>A holy, a prudent silence under affliction doth not exclude and shut out a sense and feeling of our afflictions. Ps. xxxix. 9, though he ‘was dumb, and laid his hand upon his mouth,’ yet he was very sensible of his affliction: verses 10, 11, ‘Remove thy stroke away from me, I am consumed by the blow of thine hand. When thou with rebukes dost correct man for iniquity, thou makest his beauty to consume away like a moth: surely every man is vanity.’ He is sensible of his pain as well as of his sin; and having prayed off his sin in the former verses, he labours here to pray off his pain. Diseases, aches, sicknesses, pains, they are all the daughters of sin, and he that is not sensible of them as the births and products of sin, doth but add to his sin and provoke the Lord to add to his sufferings, Isa. xxvi. 9-11.

No man shall ever be charged by God for feeling his burden, if he neither fret nor faint under it. Grace doth not destroy nature, but rather perfect it. Grace is of a noble offspring; it neither turneth men into stocks nor to stoics. The more grace, the more sensible of the tokens, frowns, blows, and lashes of a displeased Father. Though Calvin, under his greatest pains, was never heard to mutter nor murmur, yet he was heard often to say, ‘How long, Lord, how long?’ A religious commander being shot in battle, when the wound was searched, and the bullet cut out, some standing by, pitying his pain, he replied, Though I groan, yet I bless God I do not grumble. God allows his people to groan, though not to grumble. It is a God-provoking sin to be stupid and senseless under the afflicting hand of God. God will heat that man’s furnace of affliction sevenfold hotter, who is in the furnace but feels it not …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mute Christian under the Smarting Rod</cite>, (1684) in The Works of Thomas Brooks, ed. Alexander B. Grosart (6 vols, Edinburgh: Banner of Truth, 1980), i, 306-07.</span></figcaption>

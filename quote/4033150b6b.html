<blockquote><p>1. God by a virtual or ordinative will does will the turning and salvation of all men within the bosom of the church; for they have Jesus Christ set before their eyes, and what was the true end of Christ’s coming, but to turn every one from his iniquities, (Acts 3:26)… Neither will it salve the business, to say, there is a voluntas signi [will of sign] in all this; for what is voluntas signi, if it be not signum voluntatis [asign of the will]? If it be only an outward sign or appearance, and there be no counterpane or prototype thereof, within the divine will, how is it a true sign? which way could it be breathed out from God’s heart? When God makes his great gospel supper, and says, ‘Come, for all things are ready;’ he is not, he cannot be like him with the evil eye, who says, Eat and drink, but his heart is not with thee, (Prov.xxiii.6.7.) No, God’s heart goes along with every offer of grace; he never calls, but in a serious manner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-polhill.html">Edward Polhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Edward Polhill (1622-1694) on Matthew 23:37’ in “The Divine Will Considered in its Eternal Decrees” in The Works of Edward Polhill (Morgan, PA.: Soli Deo Gloria Publications, 1998)</cite>, pp. 208-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>114. Ex. 4:21; 7:3; 10:27; 11:10, ‘But I will harden Pharoah’s heart.’ Ch. 8:15, 32, ‘Pharaoh hardened his heart, and was hardened, etc.’ God hardens permissively, not effectively, by no antecedent will (for He will not the death of a sinner), but by a consequent will, when he punishes by just judgment, and uses evil to a good end. ‘Satan,’ says Augustine, ‘hardens by persuading, man by consenting, God by forsaking.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-thaddaeus.html">Johannes Thaddaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reconciler of the Bible… (London: Miller, 1662) | Exodus</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-bad5963280" data-kw="">
<blockquote><p>Election and rejection or reprobation, and in general the will of God, may be considered either quoad actum voluntis, ‘as touching the act of’ God ‘willing,’ or as touching the things willed. Of this distinction, this author [Samuel Hoard] takes no notice; It is fit for some and advantageous to fish in troubled waters. Now as touching the act of God willing, both Aquinas has proved that there can be no cause thereof and withal professes that never was any so mad as to say that merits can be the cause of predestination, quoad actum praedestinantis, ‘as touching the act of’ God ‘predestinating’. And Bradwardine has curiously disputed this way, that no will of God is conditional, to will quoad actum volentis; and [Johannes] Piscator against Vorstius has proved the same after his way; and by variety of demonstration this way may be convinced, as in part I have showed in this discourse, both on the part of election and on the part of reprobation. And both Dr. [Thomas] Jackson [an Arminian] in his book of Providence, professes that the distinction of Voluntas antecedens and consequens, or antecedent and consequent will in God, is to be understood quoad res volitas, ‘as touching the things willed’, as much as to say, non quoad actum volentis. And Gerardus Vossius [an Arminian], drawing the distinction of will antecedent and will consequent unto the distinction of will absolute and will conditional, applies it only quoad res volitas, and so interprets Fathers’ discourse[s] thereof; And of a conditional will gives this instance: God will have men to be saved in case they believe, where faith is clearly made the condition of salvation, a temporal thing, the condition of a temporal thing, not the condition of God’s will to save, it being no way fit that a temporal thing should be made the condition of a thing eternal, such as is God’s will to save. And this is more apparent by the reading of Vossius himself, History of Pelagianism, bk. 7, treating of God’s will to save all. Now if we speak thus of God’s will quoad res volitas, ‘as touching the things willed,’ these things willed being very different, we have reason to consider them distinctly also. Now these things are either grace or glory, commonly called salvation; and as touching grace, to wit, the grace of regeneration, the grace of faith and repentance, we willingly confess that God’s will to confer them is so absolute that He has determined to confer them according to the mere pleasure of his will, not according to man’s works (which is plain Pelagianism and condemned in the Synod of Palestine above 1200 years ago); and as He gives them to whom He will, so He denies them to whom He will, according to that Rom. 9:18, ‘He hath mercy on whom He will, and whom He will He hardneth.’ But as touching salvation or damnation, in which respect this author usually speaks of the absolute or conditional will of God, we utterly deny that God in the dispensation or administration, or execution of these proceeds or ever did decree to proceed according to the mere pleasure of his own will, but altogether according to their works. For albeit God has made no law according whereto He means to proceed in giving or denying grace, yet has He made a law according whereto He proceeds in bestowing salvation and inflicting damnation. And the law is this: ‘Whosever believeth shall be saved; whosoever believeth not shall bedamned.’ 2 Cor. 5:10, ‘We must all appear before the judgment seat of Christ, that every man may receive the things, which are done in his body according to that he hath done, whether good or evil.’ So that according to that sense wherein this author usually speaks of the absolute and conditional will of God, we utterly deny that God does absolutely elect any man to salvation or reject any man unto damnation, though He does absolutely elect some unto grace, that is to the grace of regeneration, to the grace of faith and repentance, and absolutely reject others therefrom. For as much as He bestows these graces on some and denies them unto others not according to their works, but according to the mere pleasure of his own will, but he does not inflict damnation or bestow salvation according to the mere pleasure of his will, but according unto man’s works. And as he carries himself in the execution of salvation and damnation, after the same manner He did from everlasting decree to carry Himself, namely to save no man of ripe years but by way of reward of their faith, repentance and good works, [and] so to damn none but for their infidelity, impenitency and evil works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy consistent with his Absolute Hatred or Reprobation of the Vessels of Wrath... (d. 1646; Oxford, L.L., 1653), bk. 1, pt. 2, Discourse, 3rd Sort of Reasons</cite>, pp. 250-51</span></figcaption>

ives+this+instance%3A+God+will+have+men+to+be+saved+in+case+they+believe%2C+where+faith+is+clearly+made+the+condition+of+salvation%2C+a+temporal+thing%2C+the+condition+of+a+temporal+thing%2C+not+the+condition+of+God%E2%80%99s+will+to+save%2C+it+being+no+way+fit+that+a+temporal+thing+should+be+made+the+condition+of+a+thing+eternal%2C+such+as+is+God%E2%80%99s+will+to+save.+And+this+is+more+apparent+by+the+reading+of+Vossius+himself%2C+History+of+Pelagianism%2C+bk.+7%2C+treating+of+God%E2%80%99s+will+to+save+all.+Now+if+we+speak+thus+of+God%E2%80%99s+will+quoad+res+volitas%2C+%E2%80%98as+touching+the+things+willed%2C%E2%80%99+these+things+willed+being+very+different%2C+we+have+reason+to+consider+them+distinctly+also.+Now+these+things+are+either+grace+or+glory%2C+commonly+called+salvation%3B+and+as+touching+grace%2C+to+wit%2C+the+grace+of+regeneration%2C+the+grace+of+faith+and+repentance%2C+we+willingly+confess+that+God%E2%80%99s+will+to+confer+them+is+so+absolute+that+He+has+determined+to+confer+them+according+to+the+mere+pleasure+of+his+will%2C+not+according+to+man%E2%80%99s+works+%28which+is+plain+Pelagianism+and+condemned+in+the+Synod+of+Palestine+above+1200+years+ago%29%3B+and+as+He+gives+them+to+whom+He+will%2C+so+He+denies+them+to+whom+He+will%2C+according+to+that+Rom.+9%3A18%2C+%E2%80%98He+hath+mercy+on+whom+He+will%2C+and+whom+He+will+He+hardneth.%E2%80%99+But+as+touching+salvation+or+damnation%2C+in+which+respect+this+author+usually+speaks+of+the+absolute+or+conditional+will+of+God%2C+we+utterly+deny+that+God+in+the+dispensation+or+administration%2C+or+execution+of+these+proceeds+or+ever+did+decree+to+proceed+according+to+the+mere+pleasure+of+his+own+will%2C+but+altogether+according+to+their+works.+For+albeit+God+has+made+no+law+according+whereto+He+means+to+proceed+in+giving+or+denying+grace%2C+yet+has+He+made+a+law+according+whereto+He+proceeds+in+bestowing+salvation+and+inflicting+damnation.+And+the+law+is+this%3A+%E2%80%98Whosever+believeth+shall+be+saved%3B+whosoever+believeth+not+shall+bedamned.%E2%80%99+2+Cor.+5%3A10%2C+%E2%80%98We+must+all+appear+before+the+judgment+seat+of+Christ%2C+that+every+man+may+receive+the+things%2C+which+are+done+in+his+body+according+to+that+he+hath+done%2C+whether+good+or+evil.%E2%80%99+So+that+according+to+that+sense+wherein+this+author+usually+speaks+of+the+absolute+and+conditional+will+of+God%2C+we+utterly+deny+that+God+does+absolutely+elect+any+man+to+salvation+or+reject+any+man+unto+damnation%2C+though+He+does+absolutely+elect+some+unto+grace%2C+that+is+to+the+grace+of+regeneration%2C+to+the+grace+of+faith+and+repentance%2C+and+absolutely+reject+others+therefrom.+For+as+much+as+He+bestows+these+graces+on+some+and+denies+them+unto+others+not+according+to+their+works%2C+but+according+to+the+mere+pleasure+of+his+own+will%2C+but+he+does+not+inflict+damnation+or+bestow+salvation+according+to+the+mere+pleasure+of+his+will%2C+but+according+unto+man%E2%80%99s+works.+And+as+he+carries+himself+in+the+execution+of+salvation+and+damnation%2C+after+the+same+manner+He+did+from+everlasting+decree+to+carry+Himself%2C+namely+to+save+no+man+of+ripe+years+but+by+way+of+reward+of+their+faith%2C+repentance+and+good+works%2C+%5Band%5D+so+to+damn+none+but+for+their+infidelity%2C+impenitency+and+evil+works.%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+The+Riches+of+God%E2%80%99s+Love+unto+the+Vessels+of+Mercy+consistent+with+his+Absolute+Hatred+or+Reprobation+of+the+Vessels+of+Wrath...+%28d.+1646%3B+Oxford%2C+L.L.%2C+1653%29%2C+bk.+1%2C+pt.+2%2C+Discourse%2C+3rd+Sort+of+Reasons%2C+pp.+250-51&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbad5963280.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bad5963280.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=Election%20and%20rejection%20or%20reprobation%2C%20and,their%20infidelity%2C%20impenitency%20and%20evil%20works." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>[Margin note:] How far the will of sign may be a will Question 33, Whether the will of sign may improperly and metonymically be the will of God? Response: The will of sign, according as it designates what is the pleasing and acceptable revealed will of God to us, that which is of our duty, so it is called the approving will, contradistinguished from the will of good-pleasure [of decree], and refers to two things: 1. To that which we ought to believe or do, inasmuch as that is obliging of consciences, since we ought to will to please God and will the reward of obedience following. 2. It refers to obedience, and this so far as God displays that to us by an act, either through special grace or a common concursus. The first will is of complacency and is properly called will, whose object is the duty of the rational creature. In this way God sincerely [serio] approves and wills obedience, and is pleased in this moral good as a rule and norm, and it is not less a will than that which is called of good-pleasure [or the will of decree]. But the latter way is not an executing will as the will of good-pleasure is, nor does God will, intend or decree through grace or concursus, to work in the creatures that which He commands or prohibits, because He commands or prohibits it. And in this way the will of sign is so far improperly called ‘the will of sign’; indeed, the punishment is called the wrath of God, because assuredly God punishes that which is done, as men are accustomed to do such being angry and in the passion of wrath, being aroused and agitated, although nonetheless, passions do not occur in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Scholastic Disputation on Divine Providence (Edinburgh, 1649), Metaphysical Inquiries, p. 605 Trans. T. Fentiman. A ‘metonymy’ is something that is indirectly named by something closely related to it. Rutherford here delineates the eternal foundation of the will of sign, namely what Rollock had elucidated, the will of approval in God, which wills the goodness of things in and of themselves.</cite></span></figcaption>

<blockquote><p>48. That which God wills, that is, swears to be, is not in diverse times, nor does He swear [jubet, commandingly oblige] and call by distinct actions, but by one most simple act. And therefore diverse decrees ought not to be discerned in God. Nor is it true with [amidst, apud] God ‘that which is last in execution, that is the first in intention’, unless we may assuredly so interpret this phrase, ‘that which is last in execution, that is the first in intention’ in the manner that every good most evidently shines forth from preceding acts.</p></blockquote>

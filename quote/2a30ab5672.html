<blockquote><p>In directing your attention to the consideration that from the vast extent of theological science, and the number of different subjects it embraces, there is required much laborious study before you can become theologians, it is right to warn you against a temptation to which some of you might be exposed upon this subject, that, viz., of dissipating your time and even injuring your faculties, by the indiscriminate perusal of a great number of books.

The extent of theological literature is so vast, the number of works that have been produced upon theological subjects by men of the highest talents, learning, and celebrity is so great, that students who have access to libraries are in some danger of being tempted to become mere devourers of books, without prosecuting a regular plan of study, or giving due time and attention to digesting the books they read, or seeking to exercise their own judgment, or to form their own opinions upon the various subjects which their reading may bring under their notice.

This practice is unfavourable to the culture of the mental powers, which ought to be one object of all our studies, and it does not in the long run tend to promote the acquisition of any knowledge that is really valuable. A mere devourer of books will never become really skilled in any science, and will not be able to apply the knowledge he may have acquired to any really useful purpose. And there is perhaps scarcely any science where students are more strongly tempted than in theology to indulge in a wide range of indiscriminate and miscellaneous reading, without giving due attention to regulate their reading upon a systematic plan, and to exercise their powers of judgment and reflection upon the subject of their reading.

Luther was accustomed to say that there were three things that were necessary to make a theologian, viz., prayer, meditation, and temptation or experience. Under the head of meditation he, of course, comprehended reading, to which the apostle enjoined Timothy to give attendance, but by including it under the head of meditation he shewed very emphatically the strength of his conviction that it was not the mere perusal of books that was in itself of any very great value, unless men’s faculties were really brought to bear upon the subjects of the books read.

There must be reading, much reading, but this reading must not be the mere devouring of books, it must be accompanied with such a careful weighing and digesting of what is read, that it should rather be called meditation than reading. There are two errors upon this subject to be guarded against — First, indiscriminate reading of whatever theological books may happen to come in your way, or may be most agreeable to your inclination; and second, mere reading, unaccompanied in due measure with meditation and reflection.

You are not to imagine that it would be warrantable or safe for you to plunge without premeditation or system into the immense ocean of theological literature, following wherever accident or fancy might lead you. At a subsequent period of your lives you may perhaps (as we have said) be more at liberty to gratify your inclination in selecting some particular department of theological literature, and giving it a prominent place in your ordinary studies. But during the period of your attendance in this place, in the prosecution of what is technically called the study of theology, you have distinct and definite objects which you are bound to aim at, and to accomplish, and must therefore adopt and follow out a definite plan.

You must during your theological studies acquire a respectable acquaintance with theological science in its leading departments; and this can be fully secured only by first of all getting some general notions of its leading divisions, and their connection with each other (such as we have endeavoured to lay before you), and then following out some regular plan in prosecuting the study of them, based upon a right view of their mutual relations, and sufficiently comprehensive to include everything of primary importance, and especially everything indispensable to a creditable preparation for entering upon the work of the ministry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, (New York: Robert Carter and Brothers, 1878), Lecture IV, pp 59-60.</span></figcaption>

<blockquote><p>But you will say: ‘England is not a true Church, and therefore you separate; adhere to the true Church.’ I answer: Our Church is easily proved to be a true Church of Christ: First, because it has all the essentials necessary to the constitution of a true Church: as sound preaching of the gospel, right dispensation of the sacraments, prayer religiously performed, and evil persons justly punished (though not in that measure as some criminals and malefactors deserve); and therefore a true Church. … But I hear you reply: ‘Our Church is corrupted with ceremonies and pestered with profane persons. What then?’ Must we therefore separate for ceremonies, which many think may be lawfully used? But admit they be evils, must we make a rent in the Church for ceremonious rites, for circumstantial evils? That were a remedy worse than the disease. Besides, had not all the true Churches of Christ their blemishes and deformities, as you may see in the seven Asian Churches (Rev. 2–3)? And though you may find some Churches beyond sea free from ceremonies, yet notwithstanding they are more corrupt in preachers (which is the main), as in profanation of the Lord’s Day, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consolatory Letter to an Afflicted Conscience</cite>, … (London: Coules, 1641), pp. 4-5</span></figcaption>

<blockquote><p>For the three early centuries the Church was entirely without it. The members of the Church made a profession of their faith at baptism. But this was in the simplest form; it was not a precautionary assent to a variety of intellectual propositions, but a profession of service under a new Master, and of entrance into a new life. No deacon, no presbyter, no bishop, made any subsequent profession. The distinction between the requirements of belief from clergy and from laity was as yet wholly unknown. The first subscription to a series of dogmatical propositions as such, was that enforced by Constantine at the Council of Nicea. It was the natural but rude expedient of a half-educated soldier to enforce unanimity in the Church, as he had by the sword enforced it in the empire. It was accompanied then by the same casuistry, by the same ambiguity, by the same inoperative results as at present [in the Church of England]. At each [subsequent] council the same process was repeated by the bishops who were present. But the practice, as far as appears, never extended to the clergy generally or to the laity; and, as it was then in the Ancient Church, so on the whole has it been in those portions of Christendom which have clung most tenaciously to Catholic usages, and been most steadfast in the defence of Orthodoxy. The Roman Catholic clergy and the clergy of the Eastern Church neither formerly nor now are bound by any definite forms of subscription. The unity of the State is preserved everywhere, not by preliminary promises or oaths, but by the general laws of discipline and order, and by the general public sentiment of the whole community.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-p-stanley.html">Arthur P. Stanley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Letter to the Lord Bishop of London on the State of Subscription</cite>, (Oxford: Henry &amp; Parker, 1863), pp. 35-36</span></figcaption>

he+State+of+Subscription%2C+%28Oxford%3A+Henry+%26+Parker%2C+1863%29%2C+pp.+35-36&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8eeb831bbe.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8eeb831bbe.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=For%20the%20three%20early%20centuries%20the,public%20sentiment%20of%20the%20whole%20community&amp;text=For%20the%20three%20early%20centuries%20the%20Church%20was&amp;text=the%20general%20public%20sentiment%20of%20the%20whole%20community" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5c8d5afc64" data-kw="">
<blockquote><p>The voluntary and unnecessary dividing and separation from a true Church is schismatical. When we put bounds and partitions between it and ourselves, we sin (say some) as did these seducers here taxed by Jude. If the Church be not heretical or idolatrous, or do not by excommunication, persecution, etc. thrust us out of its communion; if it be such an one as Christ the head has communion with, we the members ought not by separation to rend and divide the body. To separate from congregations where the word of truth and Gospel of salvation are held forth in an ordinary way (1 Tim. 3:15), as the proclamations of princes are held forth upon pillars to which they are affixed; where the light of the truth is set up as upon a candlestick to guide passengers to heaven. (Rev. 1:13) To separate from them to whom belong the covenants, and where the sacraments, the seals of the Covenant, and for substance rightly dispensed, where Christ walks in the midst of his golden candlesticks, and discovers his presence in his ordinances, whereby they are made effectual to the conversion and edification of souls, in an ordinary way; where the members are saints by a professed subjection to Christ and his Gospel, and haply have promised this explicitly and openly; where there are sundry who in the judgment of charity may be conceived to have the work of grace really wrought in their hearts by walking in some measure answerable to their profession: I say to separate from these, as those with whom Church communion is not to be held and maintaind, is unwarrantable and schismatical.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkyn.html">William Jenkyn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Jude</cite>, (London: Maxey, 1654), on vv. 17-19, pp. 589-90</span></figcaption>

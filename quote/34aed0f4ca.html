<main class="wrap"><figure class="quote" id="q-34aed0f4ca" data-kw="">
<blockquote><p>Many cover their sins themselves and cannot prosper (Prov. 28:13). [They] cover them with fig-leaves, excuses, pretences, [they] hide it as Adam. God covers it when he pardons it as with the coats of skin, the robe of Christ’s righteousness which hides all our deformities.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on the Covenant of Grace</cite>, ed. Allan Harman (1692; Fearn: Christian Focus, 2002), p. 36.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

<blockquote><p>Q. 220 But how can you apply the promised grace to yourself through faith when you have been stained in so many ways by so many sins?

A. First, because God has thus revealed his mercy, that he desires to forgive all the sins of the believer, no matter how many and how great. Second, because the merit of Christ is infinitely greater than all sins, not only mine but also those of all people. Third, because God commands me to believe in Christ, no matter how much I have sinned. And, at the same time, he affirms that not to believe is a greater sin than any other that could be committed by anyone. Therefore, just because I have offended my God with so many and such great sins, I ought not to add this, by far the greatest of all sins, so that I ungratefully trample on God’s mercy and the blood of his Son which was shed for me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Large Catechism</cite>, (1561), trans. Fred H. Klooster and John Medendrop; http://links.christreformed.org/doctrinevision/ursinus_project.pdf.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-079141024f" data-kw="">
<blockquote><p>[You must distinguish:]

20. Betwixt pardon and justification conditional, which is an immediate effect of Christ’s death and resurrection, or rather of the making of the new Covenant. 2. And pardon and justification absolute, when we have performed all the conditions.

21. Betwixt conditional pardon and justification, which is only potential (such is that which immediately follows the enacting of the new Covenant to men before faith, or before they have sinned). 2. And conditional justification, which is actual, and of which the person has true possession, such is our justification after faith, till the Last Judgment, which is ours actually, but yet upon condition of perseverance in faith and sincere obedience. … 25. Betwixt the accusation of the Law (from [which] Christ does justify believers). 2. And the accusation of the Gospel or new Covenant, for not performing its conditions at all (from which no man can be justified, and for which there is no sacrifice). … 27. Betwixt our first possession of justification, which is upon our contract with Christ or mere faith. 2. And the confirmation, continuation and accomplishment of it (whose condition is also sincere obedience and perseverance).</p></blockquote>

inguish%3A%5D%2020.%20Betwixt%20pardon%20and%20justification&amp;text=whose%20condition%20is%20also%20sincere%20obedience%20and%20perseverance" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cdab6e30b1" data-kw="">
<blockquote><p>4. The Holy Ghost speaks generally of all men, whether regenerate or unregenerate, and of all works, whether going before faith or following it, that a man, that is, every one, who is justified, is justified by faith without the works of the law, Rom. 3:28, that a man is not justified (that is, that no man is justified) by the works of the Law, but by the faith of Jesus Christ, for by the works of the Law no flesh, that is, as the Psalmist speaks, no man living shall be justified, Gal. 2:16. For as in the first act of justification we are justified by faith without respect of works, so our justification is continued unto us without respect of our works. And this appears most plainly in the examples of Abraham, of Job, of David, of Paul, etc. as I showed before, who, though they abounded with good works which they wrought by faith, yet were not justified by them, but by faith only. For that which Chrysostom says of Abraham is also verified of all the godly: for, says he, that a man having not works should be justified by faith, it is no unlikely thing: [Greek], but this, that a man flourishing in good works, should not thereby be justified, but by faith, it was wonderful, and very much sets forth the force of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Justification</cite>, (London: 1633), ch. 2, ‘That we are not justified by works’, pp. 446-47</span></figcaption>

<blockquote><p>Our justification means not only that our sins are forgiven and that we have been declared to be righteous by God Himself, not merely that we were righteous at the moment when we believed, but permanently righteous. For justification means this also, that we are given by God the positive righteousness of His own Son, the Lord Jesus Christ.</p></blockquote>

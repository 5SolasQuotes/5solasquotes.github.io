<blockquote><p>We feel that this inchoate righteousness is indeed a true and living righteousness, a splendid and excellent gift of God, and that the new life in Christ consists in this righteousness, and that all saints are just by this very righteousness also, both before God and before men; and on account of it the saints are also justified by God with a justification of works, that is, they are approved by God, praised and rewarded. However, although this righteousness is true and living, and in its own way also justifying, yet it is not of such a kind, not so true, living, and solid, that any of the saints could be justified by it with the justification of life, much less that it be the righteousness or justification of life itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludovicus-de-dieu.html">Ludovicus de Dieu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions on Romans</cite>, … to which is added, a Gleaning on the rest of the same Apostle’s, as well as the Catholic Epistles (Leiden: Elzeviers, 1646) de Dieu (1590-1642) was a Dutch reformed minister and a leading orientalist. | on Rom. 8:4, pp. 67-73 | Then on, p. 313:</span></figcaption>

<blockquote><p>6th Objection: The Messiah brings everlasting justice and righteousness. Imputed righteousness is not eternal. Therefore we are not thereby justified. Answer: It is said that Christ’s righteousness shall be an everlasting righteousness; but after a diverse manner. For in the life to come we shall be just after another manner than in this life. For although we shall then be just by the same righteousness, even by the righteousness of Christ imputed unto us: yet with this shall also the legal justice and righteousness be continued, so that then also by the legal righteousness we shall be perfectly just, because now only we are, as concerning that, but in part and beginning just. Each justice, both the justice of the Law, and the justice of the Gospel, is eternal, by continuation: And the justice and righteousness of the Gospel, that is, the justice of Christ imputed unto us, is eternal by continuation of the imputation: The justice of the Law is eternal by continuation of good works, even as it is continued by good works, first, and beginning in this life, until at length after this life it be perfected, and become perfect, and so continue to all eternity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered</cite>, … in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), ‘Of Justification’, 7. ‘Why Christ’s satisfaction is made ours by faith only’, ‘Objections against this Doctrine of Justification’, p. 687</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

<blockquote><p>There is no grace, no duty, for the substance of them, nor for the manner of their performance, that are required either by the Law or the gospel, but they [justified persons] are obliged unto them. Where they are omitted, we acknowledge that the guilt of sin is contracted, and that attended with such aggravations, as some will not own or allow to be confessed unto God Himself. Hence in particular the faith and grace of believers, do constantly and deeply exercise themselves in godly sorrow, repentance, humiliation for sin, and confession of it before God, upon their apprehensions of its guilt. And these duties are so far necessary unto the continuation of our justification as that a justified estate cannot consist with the sins and vices that are opposite unto them. So the apostle affirms, that if we live after the flesh, we shall die, Rom. 8:13. He that does not carefully avoid falling into the fire or water, or other things immediately destructive of life natural, cannot live. But these are not the things whereon life does depend. Nor have the best of our duties any other respect unto the continuation of our justification, but only as in them we are preserved from those things which are contrary unto it, and destructive of it. If this be that which is intended in this position, the continuation of our justification depends on our own obedience and good works, or that our own obedience and good works are the condition of the continuation of our justification, namely that God does indispensably require good works and obedience in all that are justified, so that a justified estate is inconsistent with the neglect of them, it is readily granted, and I shall never contend with any about the way whereby they choose to express the conceptions of their minds. … All other works and duties of obedience do accompany faith in the continuation of our justified estate, as necessary effects and fruits of it, but not as causes, means, or conditions whereon that effect is suspended. It is patient waiting by faith that brings in the full accomplishment of the promises, Heb. 6:12, 16.</p></blockquote>

<blockquote><p>4. We are justified by works, and not by faith only; by which are meant the fruits of sanctification: for true faith and true holiness will show itself by good works; faith gives us the first right, but works continue it, for otherwise a course of sin would put us into a state of damnation again: therefore at the Last Judgment these are considered, Rev. 20:12, ‘And the dead were judged out of those things which were written in the books, according to their works.’ Mt. 25:35-36: ‘For I was an hungry, and ye gave me meat; I was thirsty, and ye gave me drink; I was a stranger, and ye took me in; naked, and ye cloathed me; I was sick, and ye visited me; I was in prison, and ye came unto me.’ Faith is our consent, but obedience verifies it, or is our performance of what we consented unto; the one as covenant-making, the other as covenant-keeping; we are admitted by covenant-making, but continued in our privileges by covenant-keeping, Ps. 25:10, ‘All the paths of the Lord are mercy and truth unto such as keep his Covenant.’</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>
<div class="actions"><button class="copy" data-copy="“4. We are justified by works, and not by faith only; by which are meant the fruits of sanctification: for true faith and true holiness will show itself by good works; faith gives us the first right, but works continue it, for otherwise a course of sin would put us into a state of damnation again: therefore at the Last Judgment these are considered, Rev. 20:12, ‘And the dead were judged out of those things which were written in the books, according to their works.’ Mt. 25:35-36: ‘For I was an hungry, and ye gave me meat; I was thirsty, and ye gave me drink; I was a stranger, and ye took me in; naked, and ye cloathed me; I was sick, and ye visited me; I was in prison, and ye came unto me.’ Faith is our consent, but obedience verifies it, or is our performance of what we consented unto; the one as covenant-making, the other as covenant-keeping; we are admitted by covenant-making, but continued in our privileges by covenant-keeping, Ps. 25:10, ‘All the paths of the Lord are mercy and truth unto such as keep his Covenant.’”

— Thomas Manton, A Second Volume of Sermons… (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33, p. 336">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+We+are+justified+by+works%2C+and+not+by+faith+only%3B+by+which+are+meant+the+fruits+of+sanctification%3A+for+true+faith+and+true+holiness+will+show+itself+by+good+works%3B+faith+gives+us+the+first+right%2C+but+works+continue+it%2C+for+otherwise+a+course+of+sin+would+put+us+into+a+state+of+damnation+again%3A+therefore+at+the+Last+Judgment+these+are+considered%2C+Rev.+20%3A12%2C+%E2%80%98And+the+dead+were+judged+out+of+those+things+which+were+written+in+the+books%2C+according+to+their+works.%E2%80%99+Mt.+25%3A35-36%3A+%E2%80%98For+I+was+an+hungry%2C+and+ye+gave+me+meat%3B+I+was+thirsty%2C+and+ye+gave+me+drink%3B+I+was+a+stranger%2C+and+ye+took+me+in%3B+naked%2C+and+ye+cloathed+me%3B+I+was+sick%2C+and+ye+visited+me%3B+I+was+in+prison%2C+and+ye+came+unto+me.%E2%80%99+Faith+is+our+consent%2C+but+obedience+verifies+it%2C+or+is+our+performance+of+what+we+consented+unto%3B+the+one+as+covenant-making%2C+the+other+as+covenant-keeping%3B+we+are+admitted+by+covenant-making%2C+but+continued+in+our+privileges+by+covenant-keeping%2C+Ps.+25%3A10%2C+%E2%80%98All+the+paths+of+the+Lord+are+mercy+and+truth+unto+such+as+keep+his+Covenant.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+A+Second+Volume+of+Sermons%E2%80%A6+%28London%3A+Astwood%2C+1684%29%2C+Sermons+on+Rom.+8%2C+Sermon+43%2C+on+Rom.+8%3A33%2C+p.+336&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4041cf2e7b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4041cf2e7b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=4.%20We%20are%20justified%20by%20works,unto%20such%20as%20keep%20his%20Covenant&amp;text=4.%20We%20are%20justified%20by%20works%2C%20and%20not&amp;text=and%20truth%20unto%20such%20as%20keep%

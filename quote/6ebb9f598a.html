</figure><figure class="quote" id="q-5e9b967c80" data-kw="">
<blockquote><p>…we conceive that God has given to some one single pastor, and far more to a synod of pastors and doctors a power to rebuke, teach, exhort with all authority, 2 Tim. 4:1-2, to charge, Tit. 2:15, them before the Lord, 1 Tim. 6:17, to lay on burdens and decrees, Acts 15:28; 16:4, and that all that hear them believe and receive as true what they speak in the Name of the Lord, according to that, ‘he that heareth you heareth Me; he that despiseth you, despiseth Me.’ [Lk. 10:16] He that will not hear an ambassador as an ambassador speaking from his master and prince, refuses to hear the prince that sent him; yet we say not that they are to be heard without controversy as they [Libertines] object, that is, peremptorily, absolutely as if their word were the very oracle of God, but they are to be heard, but not but after trying and searching, and not but conditionally, insofar as they carry the mind of God along with them, so that there may be an appeal to the Scripture and place left for examining and trying of their doctrine whether it be so or not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), ch. 2, pp. 39-40</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

· Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a9db13165e" data-kw="">
<blockquote><p>The other two are ordinary office-bearers, pastors and teachers; I say two, though the disjunctive particle “some,” be not cast in between them; for they are distinguished, Rom. 12:7, 8, and the exercise of their respective offices is distinguished also, 1 Cor. 12:8; so that by pastors are meant those who, besides their ability to open up the text of Scripture in some measure, are chiefly gifted with the word of wisdom, wisely and powerfully to apply the word for working upon the affections, as the matter requires; and the teacher is he who is gifted with the word of knowledge, or ability to open up the mind of God in Scripture, establishing truth, and confuting error, without insisting much upon particular application; which office, because of the church’s poverty, is confined to the schools, and the ordinary exercise of it before the people left upon the pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, 4:11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

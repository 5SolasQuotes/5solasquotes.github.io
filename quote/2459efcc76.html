<main class="wrap"><figure class="quote" id="q-2459efcc76" data-kw="">
<blockquote><p>Let us pay careful attention to the words of the apostle who says, “that you should appoint priests in every city, just as I arranged for you.” He discusses what sort of priest [presbyter in Latin] ought to be ordained in what follows when he says, “If anyone is without fault, a husband of one wife,” and so on. Later he added, “For a bishop must be without fault, as a steward of God.” It is therefore the very same priest, who is a bishop, and before there existed men who are slanderers by instinct, [before] factions in the religion, and [before] it was said to the people, “I am of Paul, I am of Apollos, but I am of Cephas,” the churches were governed by a common council of the priests [the Latin reads, “communi presbyterorum consilio, Ecclesiæ gubernahantur”]. But after each one began to think that those whom he had baptized were his own and not Christ’s, it was decreed for the whole world that one of the priests should be elected to preside over the others, to whom the entire care of the church should pertain, and the seeds of schism would be removed.

If someone thinks that this is our opinion, but not that of the Scriptures—that bishop and priest are one, and that one is the title of age, the other of his duty—let him reread the apostle’s words to the Philippians when he says, “Paul and Timothy, slaves of Jesus Christ, to all the saints in Christ Jesus who are in Philippi, with the bishops and deacons, grace to you and peace,” and so on. Philippi is a single city in Macedonia, and at least in one city several were not able to be bishops, as they are now thought. But because at that time they called the same men bishops whom they also called priests, therefore he has spoken indifferently of bishops as if of priests.

This may still seem doubtful to someone unless it is proven by another testimony. In the Acts of the Apostles it is written that when the apostle came to Miletus, he sent to Ephesus and summoned the priests of that church to whom later he said among other things, “Watch yourselves, and the whole flock in which the Holy Spirit appointed you bishops to feed the church of God, which he acquired through his own blood.” And observe here very carefully how, by summoning the priests of the single city of Ephesus, later he has spoken of the same men as bishops.

If anyone wants to receive that epistle which is written in Paul’s name to the Hebrews, even there care for the church is shared equally by many. For indeed he writes to the people, “Obey your leaders, and be in subjection; for they are the ones who watch over your souls, as those who will give a reckoning. Let them not do this with sighing; for indeed this is advantageous to you.” And Peter, who received his name from the firmness of his faith, speaks in his own epistle and says, “As a fellow priest, then, I plead with the priests among you, and as a witness of Christ’s sufferings, I who am a companion also of his glory that is to be revealed in the future, tend the Lord’s flock that is among you, not as though by compulsion but voluntarily.”

These things [have been said] in order to show that to the men of old the same men who were the priests were also the bishops; but gradually, as the seed beds of dissensions were eradicated, all solicitude was conferred on one man. Therefore, just as the priests know that by the custom of the church they are subject to the one who was previously appointed over them, so the bishops know that they, more by custom than by the truth of the Lord’s arrangement, are greater than the priests. And they ought to rule the Church commonly, in imitation of Moses who, when he had under his authority to preside alone over the people of Israel, he chose the seventy by whom he could judge the people. Therefore let us see what sort of priest, or bishop, ought to be ordained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on Galatians, Titus, and Philemon</cite>, trans. Thomas P. Scheck (c. 386-88; Notre Dame IN: University of Notre Dame, 2010), pp 288-90 (emphases added).</span></figcaption>

<blockquote><p>It seems to be solidly argued from 1 Tim. v. 17. that there were in the primitive church some elders, who did not use to preach: nothing very express is said concerning them: only it seems to be intimated James v. 14. that they prayed with the flock. It may be very expedient, even on the principles of human prudence, to appoint some of the more grave and honourable members of the society to join with the pastor in the over-sight of it, who may constitute a kind of council with him, to deliberate of affairs in which the society is concerned, and prepare them for being brought before the church for its decision, to pray with the sick, to reconcile differences, &amp;c.

[B]ut there does not seem any sufficient warrant for making them a kind of judicatory, to whose decisions the rest of the society is to submit; and those rules relating to presbyteries, classes, provincials, and general assemblies, which are determined by the constitution of the church of Scotland, most evidently appear to be at best merely matters of human discretion, and to have no express foundation in the word of God; nor can we trace the existence of such ruling elders higher than Constantine’s time.</p></blockquote>

<blockquote><p>1. God never did, nor ever will, justify and save a wicked Jew that lived and died impenitent, though he was of the seed of Abraham, and a Hebrew of the Hebrews, and had all the honour and advantages that attended circumcision. He does and will render indignation and wrath, tribulation and anguish, upon every soul of man that doeth evil; and of the Jew first, whose privileges and professions, instead of screening him from the judgment of God, will but aggravate his guilt and condemnation. See Rom. 2:3, 8–9, 17. Though God has favoured the Jews, above other nations, with the dignities of visible church-membership, yet He will not therefore accept of any particular persons of that dignity, if they allow themselves in immoralities contradictory to their profession; and particularly in persecution, which was now, more than any other, the national sin of the Jews.

2. He never did, nor ever will, reject or refuse an honest Gentile, who, though he has not the privileges and advantages that the Jews have, yet, like Cornelius, fears God, and worships Him, and works righteousness, that is, is just and charitable towards all men, who lives up to the light he has, both in a sincere devotion and in a regular conversation. Whatever nation he is of, though ever so far remote from kindred to the seed of Abraham, though ever so despicable, nay, though in ever so ill a name, that shall be no prejudice to him. God judges of men by their hearts, not by their country or parentage; and, wherever He finds an upright man, He will be found an upright God, Ps. 18:25. Observe, Fearing God, and working righteousness, must go together; for, as righteousness towards men is a branch of true religion, so religion towards God is a branch of universal righteousness. Godliness and honesty must go together, and neither will excuse for the want of the other. But, where these are predominant, no doubt is to be made of acceptance with God. Not that any man, since the fall, can obtain the favour of God otherwise than through the mediation of Jesus Christ, and by the grace of God in Him; but those that have not the knowledge of Him, and therefore cannot have an explicit regard to Him, may yet receive grace from God for his sake, to fear God and to work righteousness; and wherever God gives grace to do so, as He did to Cornelius, He will, through Christ, accept the work of his own hands. Now: (1) This was always a truth, before Peter perceived it, that God respecteth no man’s person; it was the fixed rule of judgment from the beginning: If thou doest well, shalt thou not be accepted? And, if not well, sin, and the punishment of it, lie at the door, Gen. 4:7. God will not ask in the great day what country men were of, but what they were, what they did, and how they stood affected towards Him and towards their neighbors; and, if men’s personal characters received neither advantage nor disadvantage from the great difference that existed between Jews and Gentiles, much less from any less difference of sentiments and practices that may happen to be among Christians themselves, as those about meats and days, Rom. 14:1-23. It is certain the kingdom of God is not meat and drink, but righteousness, and peace, and joy in the Holy Ghost; and he that in these things serveth Christ is accepted of God, and ought to be approved of men; for dare we reject those whom God doth not? (2) Yet now it was made more clear than it had been; this great truth had been darkened by the covenant of peculiarity made with Israel, and the badges of distinction put upon them; the ceremonial law was a wall of partition between them and other nations; it is true that in it God favoured that nation (Rom. 3:1–2; 9:4), and thence particular persons among them were ready to infer that they were sure of God’s acceptance, though they lived as they listed, and that no Gentile could possibly be accepted of God. God had said a great deal by the prophets to prevent and rectify this mistake, but now at length he does it effectually, by abolishing the covenant of peculiarity, repealing the ceremonial law, and so setting the matter at large, and placing both Jew and Gentile upon the same level before God; and Peter is here made to perceive it, by comparing the vision which he had with that which Cornelius had. Now in Christ Jesus, it is plain, neither circumcision availeth any thing, nor uncircumcision,Gal. 5:6; Col. 3:11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, ch. 10, v. 35, “But in every nation he that feareth Him, and worketh righteousness, is accepted with Him.”</span></figcaption>

<blockquote><p>Out of all which, I conclude that no law as a law does oblige the conscience, but that which has from the matter moral equity, and not from the intention of the lawgiver, as Cajetan, Silvester, Angelus and Corduba teach, which intention must take a rule from the matter of the law, and not give a rule. Gerson, no law (says he) is a law to be called as necessary to salvation (as all good laws should be) but that which de jure divino, is according to God’s law… And therefore his [Durandus’s] mind is that all obligation of conscience in human commandments comes from God’s will and law, that is, from the just and necessary matter of the law, not from the will of men.</p></blockquote>

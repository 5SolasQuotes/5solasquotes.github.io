<blockquote><p>Conversion is not repairing the old building; instead, it takes everything down and erects a new structure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-alleine.html">Joseph Alleine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Alarm to the Unconverted</cite>, ch. 2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f4e6a838b4" data-kw="">
<blockquote><p>The heart in Scripture is that which thinks, feels, wills, and acts. It is the soul; the self. A new heart is, therefore, a new self, a new man. It implies a change of the whole character. It is a new nature. Out of the heart proceed all conscious, voluntary, moral exercises. A change of heart, therefore, is a change which precedes these exercises and determines their character. A new heart is to a man what goodness is to the tree in the parable of our Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, pt. 3, ch. 15, “Regeneration,” “A New Heart”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a> › <a href="../topics/regeneration/nature-of-regeneration/new-creation.html">New creation</a></span></div>

</figure><figure class="quote" id="q-2cfa4393d8" data-kw="Mary Queen of Heaven Satan Grace">
<blockquote><p>Hence we see how widely the Papists differ from her, who idly adorn her with their empty devices, and reckon almost as nothing the benefits which she received from God. They heap up an abundance of magnificent and very presumptuous titles, such as, &quot;Queen of Heaven, Star of Salvation, Gate of Life, Sweetness, Hope, and Salvation.&quot; Nay more, to such a pitch of insolence and fury have they been hurried by Satan, that they give her authority over Christ; for this is their pretty song, &quot;Beseech the Father, Order the Son.&quot; None of these modes of expression, it is evident, proceeded from the Lord. All are disclaimed by the holy virgin in a single word, when she makes her whole glory to consist in acts of the divine kindness. If it was her duty to praise the name of God alone, who had done to her wonderful things, no room is left for the pretended titles, which come from another quarter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 1:48-49</span></figcaption>

</figure><figure class="quote" id="q-76fc53ecbc" data-kw="Regeneration Sanctification">
<blockquote><p>Union with Christ is the foundation of all spiritual blessings, so that if there had been no connection with Him, there could be no regeneration, no justification, no sanctification, no glorification. It is so in the natural world—adumbrating the spiritual: sever one of the members from my physical body, and it is dead; only by its union with my person does it partake of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Union and Communion</cite>, Introduction</span></figcaption>

<main class="wrap"><figure class="quote" id="q-7d8442c03d" data-kw="intention elect only">
<blockquote><p>Did Christ die for each and every man universally or only for the elect? The former we deny; the latter we affirm. The question hinges upon this—not what is the nature and power of Christ’s death in itself, but what was the purpose of the Father in appointing him and the intention of Christ in undergoing it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.14.1,9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a> › <a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement/definite-atonement.html">Definite atonement</a></span><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a> › <a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement/for-whom-did-christ-die.html">For whom did Christ die?</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-da5636a070" data-kw="">
<blockquote><p>That Christ Jesus by His death did bring forth salvation and reconciliation only for the elect (John 15:13; Rom. 8:32–34; 5:11; 3:25), which were those which God the Father gave Him (Job 17:2; 6; 37); and that the gospel which is to be preached to all men as the ground of faith, is, that Jesus is the Christ, the Son of the ever-blessed God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>First London Baptist Confession</cite>, 1644, Art. 21</span></figcaption>

— Particular Baptists, First London Baptist Confession, 1644, Art. 21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+Christ+Jesus+by+His+death+did+bring+forth+salvation+and+reconciliation+only+for+the+elect+%28John+15%3A13%3B+Rom.+8%3A32%E2%80%9334%3B+5%3A11%3B+3%3A25%29%2C+which+were+those+which+God+the+Father+gave+Him+%28Job+17%3A2%3B+6%3B+37%29%3B+and+that+the+gospel+which+is+to+be+preached+to+all+men+as+the+ground+of+faith%2C+is%2C+that+Jesus+is+the+Christ%2C+the+Son+of+the+ever-blessed+God%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Particular+Baptists%2C+First+London+Baptist+Confession%2C+1644%2C+Art.+21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fda5636a070.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/da5636a070.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-19c4498eb6" data-kw="sufficient efficient">
<blockquote><p>It is not asked with respect to the value and sufficiency of the death of Christ—whether it was in itself sufficient for the salvation of all men. For it is confessed by all that since its value is infinite, it would have been entirely sufficient for the redemption of each and every one, if God had seen fit to extend it to the whole world. And here belongs the distinction used by the fathers and retained by many divines—that Christ “died sufficiently for all, but efficiently for the elect only.” For this being understood of the dignity of Christ’s death is perfectly true (although the phrase would be less accurate if referred to the will and purpose of Christ).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.14.9</span></figcaption>

</figure><figure class="quote" id="q-750d639e01" data-kw="">
<blockquote><p>You will remember the multitude He has redeemed; not me alone, nor you alone, but “a multitude that no man can number,” which shall as far exceed the stars of heaven for number, as they exceed all mortal reckoning. Christ hath bought for Himself, some out of every kingdom, and nation, and tongue, under heaven; He hath redeemed from among men some of every rank, from the highest to the lowest; some of every colour—black and white; some of every standing in society, the best and the worst. For some of all sorts hath Jesus Christ given Himself a ransom that they might be redeemed unto Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Justification by Grace”</cite>, sermon on Rom. 3:24</span></figcaption>

</figure><figure class="quote" id="q-d3db059f0b" data-kw="">
<blockquote><p>The motive (so to speak) of God in sending his Son is not, as this theory assumes, general benevolence or that love of which all men are equally the objects, but that peculiar, mysterious, infinite love in which God, in giving his Son, gives Himself and all conceivable and possible good.</p></blockquote>

<blockquote><p>Q. 293 Then are infants rightly baptized since they have not yet been given faith?

A. Yes. For in adults faith and its confession are required before baptism because they cannot be included in the covenant of grace in any other way. But for infants it is enough to be sanctified by the Spirit of Christ in proportion to their age.

Q. 294 But why is it necessary that they be baptized?

A. First, because God requires that whomever he embraces in his covenant be marked with baptism. And the children of believers are and remain members of the covenant of grace if they do not exclude themselves from it by their unbelief when they get older. For God affirms that he will be their God also and Christ affirms that the kingdom of heaven is theirs. Second, because baptism replaces circumcision; therefore, since infants were circumcised in the Old Testament, and since the grace of God was not restricted by the coming of Christ but was poured out more fully, they also ought to be baptized now.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae:</cite>, Large Catechism (1561), trans. Fred H. Klooster and John Medendrop:</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d87622f9f0" data-kw="">
<blockquote><p>Q. What is Baptism?

A. A Sacrament of Regeneration, wherein by the outward washing of the body with water in the name of the Father, the Son, and the Holy Ghost, the inward cleansing of our souls by the blood of Christ is represented and sealed up unto us.

Q. Who are to be baptized?

A. They who in charity may be thought to be in the Covenant.

[Q.] Who are they?

A. Both all that profess themselves to be of the Christian faith, and also their children.

Q. What ground have we to judge the children of Christians to be in the Covenant?

A. The extent of God’s promise which reacheth even to them.

Q. How oft may one be baptized?

A. Only once: for once only we are born again and engrafted into Christ.</p></blockquote>

</figure><figure class="quote" id="q-2a58eef5f2" data-kw="">
<blockquote><p>The children of those that are indeed in the church, but, because of their unclean way of living, declare that they are not indeed of the church; if they be offered to baptism, they cannot be debarred therefrom, nor ought they. The reason is, because though the parents be wicked, yet their impiety ought not to prejudge their children which are born within the church. But if you say, only the children of the faithful are to be baptized, because those infants only are judged to be within the covenant, and they only holy; I answer, the impiety of their nearest parents is not to be considered here, but the piety of the church in which they are born;—as also their ancestors who have lived godly and holily.</p></blockquote>

</figure><figure class="quote" id="q-b0ce3af63c" data-kw="">
<blockquote><p>From the union of the outward elements, and the things which they denote, arises sacramental phraseology, by which the terms denoting the sign and the things signified are used interchangeably. Thus Christ is termed “our passover;” circumcision is called “the covenant,” the bread in the Lord’s Supper is named the “body” of Christ. [1 Cor. 5:7; Gen. 17:11; Matt. 26:26] The sacramental union so connects the objects that, by a figure of speech common to all languages, the one may be predicated of the other.

Hence, throughout the Scriptures, we find the sign designated by the thing signified, as when sanctification of heart is called circumcision. [Rom. 11:29] The effect of the thing signified is ascribed to the sign, as to baptism is ascribed to regeneration, [Tit. 3:5] and what is proper to the sign, or to the thing signified, is interchanged in the application. The breaking of the bread is applied to Christ’s body, and remission of sins, which is the fruit of grace communicated, is ascribed to external baptism. [Acts 22:16]

This phraseology, which, when understood figuratively, is proper and expressive, has often been grossly misapplied, in a literal sense, to support the dogma of baptismal regeneration, and even to make out the change of the material elements into the substance of the spiritual objects, in transubstantiation. Such a mode of interpretation is utterly opposed to the received usage of all languages, and amounts to a manifest perversion of the sacred writers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Treatise on Christian Baptism</cite>, (1853) in Works: Doctrinal and Practical of the Rev. Thomas Houston, D.D., Knockbracken (4 vols, Edinburgh: Andrew Elliot, 1876), 3: 13.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-576f4001d4" data-kw="">
<blockquote><p>However, we do not therefore exclude form the fellowship of this sacrament those children who were born of Christian stock and baptized parents–even though their own parents through their wicked lives or impure faith cause the efficacy of the covenant sealed in their own baptism to be ineffective for themselves–if those same parents or the relatives who have authority over them present them for baptism according to the customary order in our churches. For in the new covenant the son does not bear the iniquity of the father, and of such children God remains God just the same, as He Himself bears witness in Ezekiel 16 and 23. There He calls the children of the godless Israelites his own sons, whom they had begotten for God, although they were sacrificing them to Molech. And it is from these children that God also normally gathers his church through the ordinary preaching of the Word. And for this reason he also commanded the children of such Israelites (of whom many had died in their ungodliness) to be circumcised, no less than those of the godly ones (Joshua 5:4 and 6)–which necessary deed also the Israelite and the early Christian church always have considered beyond debate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, (Brill, 2020), vol. 3, Disputation 44, ‘On the Sacrament of Baptism’, section 50, p. 167</span></figcaption>

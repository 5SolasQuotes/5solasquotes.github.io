<main class="wrap"><figure class="quote" id="q-5c958fc60f" data-kw="">
<blockquote><p>Perfection is God all-sufficient and all-excellent: not having need of anything, giving sufficience unto, and having in Him the perfection of all things, Gen. 17:1-2; Ex. 6:3. This attribute renders God as that infinite sea of all happiness. Perfection is increated glory: that is, all the attributes in one word; as happiness is the sum of man’s good, so glory is the sum of all God’s attributes. The perfection of God is essential, independent, unlimited, without increase or decrease: As the power of subordinate causes is contained in the first cause virtually: and as the authority of under-officers is in the prince after a more excellent manner, so the virtue of all second causes is contained in the first cause eminently. The word eminently taken in its strict and proper sense seems to intend the effect to be in the cause, not only in a more excellent manner than in itself, but also in a super-created manner. Things are in God agreeable to the nature of God: in themselves according to their proper natures. … The essential perfection of God is increated glory, eternal, always the same, from which nothing can be taken, to which nothing can be added. The acknowledgement of the manifested perfections of God, is glorification: viz. The act of the creature done in time, admitting more or less according as God is known or acknowledged.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’</cite>, pp. 19-20</span></figcaption>

</figure><figure class="quote" id="q-26ebf9e579" data-kw="">
<blockquote><p>Liberty is God willing Himself freely and necessarily, but whatever is besides Himself not necessarily, but freely: that is, not of any necessity of nature, but of his mere good pleasure,† Ps. 115:3; Isa. 49:3; Dan. 4:5. † Scotus, bk. 1, dist. 39: Libera terminatio divinae voluntatis in creaturum potuit adesse vel abesse sine ulla mutabilitate subjectiva in Deo [The free determination of the divine will toward creatures could be present or absent without any subjective change in God.]. [Francis] Smising [Tract on the One God?], tract 2, disp. 3, quest. 1, num. 23. Though nothing be more manifest than that God wills freely and not necessarily whatsoever is besides Himself: yet the manner of his willing thereof exceeds our capacities. Created acts of liberty being limited and bounded by their objects, cannot tend unto diverse objects, without tending to diverse acts: but increated liberty, being infinite, is illimited by its objects and tends unto diverse objects by one and the same act. Increated liberty is not to be looked at as consisting in an indifferency to diverse acts of willing or nilling: For that would argue imperfection in God: but it is clearly seen in respect of its diverse created objects, which, as they have their being from God’s good pleasure, so had He so pleased, they had never been, but continued forever in their nothing, Himself notwithstanding eternal, all blessed and all glorious. Omnipotency is God able to do whatsoever his wisdom does conceive, Gen. 18:14; Mt. 19:26; Isa. 46:10. All contradictions, impossibilities and repugnancies unto the revealed Will of God are excluded in this proposition…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’</cite>, pp. 18-19</span></figcaption>

<blockquote><p>But, on account of the impossibility of a fully adequate comprehension of God, nevertheless all conception of God is not to be denied to man, as if finite man is in no way able to form a concept of the infinite, as [Thomas] Hobbes [d. 1679] maintains, against whom Cocquius¹ disputes concerning this matter, in his Anatome Hobbesianismi, locus VI, chapter XII, pages 114-118… ¹ Gisbertus Cocquius (1630-1708) of Utrecht was a Reformed thinker and doctor of philosophy; he opposed Hobbes. Compare also Heidanus² in his Consideratien, etc., pages 134-138, upon occasion of this thesis, proscribed by the curators of the Academy of Leiden, that ‘Men have an adequate idea of God.’ ² Abraham Heidanus (1597-1678) was a Dutch Reformed minister and Cocceian theologian. He served as professor of theology at Leiden from 1648 to 1676, but he was ultimately dismissed for his Cartesianism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernard De Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>11. ‘Incomprehensibility of God’ in Continuous Commentary, ch. 4, ‘On God’</cite></span></figcaption>

<blockquote><p>On page 174, I also address the issue of the senses—whether and how they can be considered the source (as they are commonly called by philosophers and theologians, specifically by Alting as cited above) of our natural knowledge of God. The role of sense knowledge needs to be clarified, both against the skeptics on one side, and against Vorstius and the anthropomorphites who make God an object of physical vision on the other.</p></blockquote>

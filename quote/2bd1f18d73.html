<main class="wrap"><figure class="quote" id="q-2bd1f18d73" data-kw="">
<blockquote><p>In prayer there are real desires of what we seek of God, which desires are offered to the Lord. The mouth must not speak out anything but what is the desire of the heart. It is dangerous to mock God, who knows the heart; to confess sin, and not have the heart affected with it; to seek supply of wants from him, and not have the heart impressed with a due sense of the want of them. There are two sorts of desires.

(1.) There are natural desires, which are the mere product of our own spirits, offered unto God, but not regarded as prayer (Hos. vii. 14.) by the Lord. These may be not only for temporal things but for spiritual also, as those who said to Christ, “Lord evermore give us this bread,” A natural man, from a gift of prayer, may seek grace and glory, as a bridge to lead him over the waters of wrath; but coming only from their own spirits, such a prayer is not acceptable.

(2.) There are spiritual desires, Zech. xii. 10; which the saints breathe out unto God, having them first breathed into them by the Spirit, Rom. viii. 26. And these may be for temporal things, as well as spiritual, accepted, seeing they are put up in a spiritual manner. These are always sincere and fervent, so as the soul earnestly craves the things sought.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourses on Prayer</cite>, (1727) in The Whole Works of the Late Reverend Thomas Boston of Ettrick, ed. Samuel McMillan (12 vols, Aberdeen: George and Robert King, 1852), 11: 11.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-df9f78d294" data-kw="">
<blockquote><p>We are to think the same thing concerning prayer, as concerning the labour and endeavour of good works: For we do rightly and piously ask of God those things which are determined by his certain purpose: For God who hath determined to do good to us, will give that good to our prayers, and not to slothfulness and security, Jehoshaphat did not in vain pray before the fight, 2 Chro. 20 although he was not ignorant that God had already decreed what should be the event of the battle.

The Apostles knew well enough that their sins were forgiven them by God, and yet they did daily pray Forgive us our trespasses. Christ did not doubt of his resurrection, and of the obtaining of glory after the combat, and yet he did pray by night, and went aside into the country to pray.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 20.33, p. 168.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

</figure><figure class="quote" id="q-a71d56be65" data-kw="">
<blockquote><p>Prayer is not a smooth expression, or a well-contrived form of words; not the product of a ready memory, or of a rich invention exerting itself in the performance. These may draw a neat picture of it, but still, the life is wanting. The motion of the heart God-wards, holy and divine affection, makes prayer real, and lively, and acceptable to the Living God, to whom it is presented; the pouring out of thy heart to Him who made it, and therefore hears it, and understands what it speaks, and how it is moved and affected in calling on Him.

It is not the gilded paper and good writing of a petition, that prevails with a king, but the moving sense of it. And to that King who discerns the heart, heart-sense is the sense of all, and that which only He regards: He listens to hear what that speaks, and takes all as nothing where that is silent. All other excellence in Prayer, is but the outside and fashion of it; this is the life of it.

Though prayer, precisely taken, is only petition, yet, in its fuller and usual sense, it comprehends the venting of our humble sense of vileness and sin, in sincere confession, and the extolling and praising of the holy name of our God, His excellency and goodness, with thankful acknowledgment of received mercies. Of these sweet ingredient perfumes is the incense of Prayer composed, and by the Divine fire of love it ascends unto God, the heart and all with it; and when the hearts of the saints unite in joint prayer, the pillar of sweet smoke goes up the greater and the fuller. …

And, indeed, the sincerity and unfeignedness of prayer, makes it go up as a straight pillar, no crookedness in it, tending straight towards heaven, and bowing to no side by the way. Oh ! the single and fixed viewing of God, as it, in other ways, is the thing which makes all holy and sweet, so particularly does it in this Divine work of prayer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary Upon the First Epistle General of Saint Peter</cite>, (1693-94) in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 1: 512.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

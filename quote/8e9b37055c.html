<main class="wrap"><figure class="quote" id="q-8e9b37055c" data-kw="">
<blockquote><p>Baptism is fully and formally God’s ordinance, though the [sign of the] cross be needlessly and superstitiously added thereunto [on the baby’s head] and the parent (by virtue of whose interest in God’s Covenant, the child receives the seal) is unjustly excluded [in the Anglican practice], and a deputation of godfathers and godmothers is groundlessly imposed:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation</cite>, … in a Letter, written July 20, 1661… (1662) Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland., p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Baptism is fully and formally God’s ordinance, though the [sign of the] cross be needlessly and superstitiously added thereunto [on the baby’s head] and the parent (by virtue of whose interest in God’s Covenant, the child receives the seal) is unjustly excluded [in the Anglican practice], and a deputation of godfathers and godmothers is groundlessly imposed:”

— Zachary Crofton, Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church… in a Letter, written July 20, 1661… (1662) Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland., p. 24">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBaptism+is+fully+and+formally+God%E2%80%99s+ordinance%2C+though+the+%5Bsign+of+the%5D+cross+be+needlessly+and+superstitiously+added+thereunto+%5Bon+the+baby%E2%80%99s+head%5D+and+the+parent+%28by+virtue+of+whose+interest+in+God%E2%80%99s+Covenant%2C+the+child+receives+the+seal%29+is+unjustly+excluded+%5Bin+the+Anglican+practice%5D%2C+and+a+deputation+of+godfathers+and+godmothers+is+groundlessly+imposed%3A%E2%80%9D%0A%0A%E2%80%94+Zachary+Crofton%2C+Reformation%2C+Not+Separation%2C+or%2C+Mr.+Crofton%E2%80%99s+Plea+for+Communion+with+the+Church%E2%80%A6+in+a+Letter%2C+written+July+20%2C+1661%E2%80%A6+%281662%29+Crofton+%281626-1672%29+was+a+presbyterian+and+puritan+born+and+raised+in+Ireland.%2C+p.+24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8e9b37055c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8e9b37055c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Baptism%20is%20fully%20and%20formally%20God%E2%80%99s,godfathers%20and%20godmothers%20is%20groundlessly%20imposed&amp;text=Baptism%20is%20fully%20and%20formally%20God%E2%80%99s%20ordinance%2C%20though&amp;text=deputation%20of%20godfathers%20and%20godmothers%20is%20groundlessly%20imposed" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d4fd6b8c0f" data-kw="">
<blockquote><p>The scribes and Pharisees in the days of our Savior said but did not; laid heavy burdens on the people, which themselves would not touch with one of their fingers… yet the Lord Himself, who reproved them, heard them and charged his disciples to hear them, because they sat in Moses’s seat. Let it be observed and remembered: the authority may, but the quality of the minister does not add to or abstract from the entity or efficacy of God’s ordinances; he may preach to my salvation who is himself a castaway.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation</cite>, … in a Letter, written July 20, 1661… (1662) Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland., p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-89d3562958" data-kw="">
<blockquote><p>Now in this that I declare unto you I praise you not, that ye come together not for the better, but for the worse. For first of all, when ye come together in the church, I hear that there be divisions among you; and I partly believe it. For there must be also heresies among you, that they which are approved may be made manifest among you. When ye come together therefore into one place, this is not to eat the Lord’s supper. For in eating every one taketh before other his own supper: and one is hungry, and another is drunken. What? have ye not houses to eat and to drink in? or despise ye the church of God, and shame them that have not? what shall I say to you? shall I praise you in this? I praise you not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>1 Cor., 11:17-22</cite></span></figcaption>

</figure><figure class="quote" id="q-4f192e6f26" data-kw="">
<blockquote><p>For there were many in the congregation that were not sanctified: therefore the Levites had the charge of the killing of the passovers for every one that was not clean, to sanctify them unto the Lord. For a multitude of the people, even many of Ephraim, and Manasseh, Issachar, and Zebulun, had not cleansed themselves, yet did they eat the passover otherwise than it was written. But Hezekiah prayed for them, saying, ‘The good Lord pardon every one that prepareth his heart to seek God, the Lord God of his fathers, though he be not cleansed according to the purification of the sanctuary.’ And the Lord hearkened to Hezekiah, and healed the people. And the children of Israel that were present at Jerusalem kept the feast of unleavened bread seven days with great gladness:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>2 Chron., 30:17-21</cite></span></figcaption>

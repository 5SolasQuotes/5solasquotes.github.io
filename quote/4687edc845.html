<blockquote><p>…those [who err] who imagine that a faithful and regenerate man, by committing any crime or grievous sin, does for a sin loose his faith and justification. And of this first assertion there seem also to be two degrees. For when they say that a faithful man by committing a grievous sin does loose his faith, they mean either the act of faith only or the habit [the abiding principle of it] also. If the act only, which is [for the person] to believe [the] remission of [his] sin, and namely of that crime which he has committed, and whereof he has not as yet repented, we acknowledge that that act of faith when a man is fallen into a great sin is interrupted, until he rise again by repentance. But here is their error in that they think, because the act of faith is interrupted, that therefore there is an intercession of justification and reconciliation with God, and a falling from the state of grace and salvation, into the fearful state of damnation. Unless for the qualifying of their opinion they shall say that they speak not of justification in foro caelesti, ‘in the court of heaven,’ but in foro conscientiae, ‘in the court of their conscience,’ and of falling for a time from the assurance of salvation into the guilt of damnation, which if they shall avouch, there shall not need to be any controversy betwixt us. For we do confess that a man cannot be assured of the remission of any crime whilst he continues in it without repentance: and that howsoever there is no condemnation to them that are in Christ Jesus; yet a faithful man by committing any crime incurs the anger of God and provokes his judgments and not only deserves damnation, and is in himself guilty, or contracts the guilt of death, but many times also by the terror and trouble of his own conscience, aggravated partly by afflictions, partly by spiritual desertions and partly by the temptation of Satan, is, in his own opinion, in the state of damnation. But if we will speak properly, justification is to be considered an act of God, for it is God that justifies, and such an act as depends upon his eternal counsel and proceed[s] from his grace given unto us in Christ before all secular times [before the foundation of the world]. For whom He elects, them He calls, and whom He calls according to his purpose, them and no other He justifies, and whom He justifies, them and all them He glorifies. This act of God, which from our effectual vocation is continued to our glorification, is not interrupted, though the act of faith, which is the apprehension of it, be interrupted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Grace, or an Exposition upon Luke 1:73-75</cite>, (Dublin, 1631), ch. 5, pp. 290-91</span></figcaption>

<blockquote><p>to dispute what works are worth in themselves, another in what place they are to be held after the righteousness of faith has been established. If a price is to be set for works according to their dignity, we say they are unworthy to come into the sight of God: therefore man has nothing of works by which to glory before God. Thence, stripped of all aid of works, he is justified by faith alone. With the remission of sins presupposed, the good works which now follow have a different estimation than from their own merit: because whatever in them is imperfect is covered by the perfection of Christ. Therefore, with the guilt of all transgressions by which men are hindered from bringing forth anything pleasing to God being obliterated, and the fault of imperfection, which is wont to defile even good works, being buried: the good works which are done by the faithful are judged just: or (which is the same thing) are imputed for righteousness.</p></blockquote>

<blockquote><p>It must be diligently observed, that though justification be but one individual act in respect of the Father, Son and Holy Ghost, in the first act of faith, and conversion of a sinner, whereby the person of a man stands justified before God, and shall, without intercision of justification and loss of this favor of God, stand before the barre of God’s tribunal, and is, and always shall be absolutely justified and acquitted from all sins past, present and to come, because all obligations and handwritings against him, are in that act cancelled and blotted out: he forgiving all trespasses, Col. 2:13-14. Yet it must be known, that of this act there is (as it were) a double sentence: First, in court of heaven, at which time the elect in Christ have their names enrolled in the book of God’s effectual calling, and are numbered among the just, which sentence can never be revoked or blotted out: this is that which was passed with God (that I may so speak, after the manner of men) in the first act of conversion. Secondly, this sentence of forgiveness is passed in the court of the conscience of him that had the former sentence pronounced for him in heaven. This sentence is the second act of the holy Ghost, wrought in this manner. First, after that a sinner is cōvinced of his guiltiness of sin, and of his damnable condition because of his sin, then forgiveness is offered, and pronounced to the ear in that gracious promise of salvation to all that believe in Christ Jesus, which promise is proclaimed in the ministry of the Gospel, in which light of the Gospel, he shows unto a man possibility of salvation, setting before him (I speak of men of years and understanding) Christ the means of salvation; and by this means the Holy Ghost works faith in Christ; then confession and grief for sin; then prayer to ask forgiveness; and grace to live godly, and then does witness to his spirit that he is accepted of God. Thus sentence is pronounced in the conscience: from whence arises sense of God’s love, which is called the shedding abroad of the love of God in our hearts by the Holy Ghost, Rom. 5:5, also sense of the loving countenance of God, which is the sign of his loving kindness, and is that speech of God, by which he does say to our souls, he is our salvation, and then arises in our hearts peace of conscience, and joy in the Holy Ghost. This sentence of forgiveness unto the conscience has different degrees: it is sometimes more clear in the apprehension of the soul, sometimes more dim, yea sometimes quite blotted out in the counterpane of our release, or copy of our acquittance; as it was with David, Ps. 51, so that a person perfectly just before God, has sometime little or no sense or apprehension of it in his own conscience, but doubts whether he be in state of grace or no. Which happens because of the stain and guilt of new sins, which guilt abides in the conscience, until a man do confess his sins, repent, and ask forgiveness, and, by a renewed faith, apply forgiveness: by which means the evidence of his pardon is again by the Holy Ghost exemplified, and sentence by this new application is again pronounced in his conscience; whence arises new assurance of salvation, and renewed joy in the Holy Ghost. This is that justification, which for distinction sake, Divines call justification by parts, or continued, or repeated justification, or new application of one and the same justification: which justification though in respect of the sentence pronounced in heaven, is one individual act, whereby a man standeth alwayes just before God; yet in respect of the pronouncing of that sentence to the heart, it is not actually applied; neither can a particular sinne be said to be everie way actually forgiven, until after it have beene committed, is confessed, and repented of; nor untill forgivenesse be asked, and until the holy Ghost hath made new application thereof unto the conscience, through renewing of faith, by which a man doth again and again, as new sins are committed, apply the merits of the blood of Christ unto his soul. Also it must be known that the sentence of pardon which is passed in heaven with God, is not fully executed until the last degree of it, when sentence of absolution shall be pronounced by Christ Jesus: Come ye blessed of my Father, inherit the kingdom prepared for you from the foundation of the world, Matt. 25.34. It must moreover be conceived and held, that notwithstanding this distinction of justification between an absolute justification in respect of God, and a justification by parts in respect of application to mans conscience, there are not two kinds of justification, a first and a second, as the Papists hold: but one and the same justification, considered in different respects. In respect of God’s actual acceptation of a man’s person, justification is absolute; but in respect of the actual application and manifestation of God’s acceptation unto a mans conscience, justification is by parts and degrees. When a man already justified asks forgiveness, he doth not ask a new justification, but a second or new application of pardon unto the conscience of those particular sins which are daily committed, together with continuance of God’s favor, and more clear evidence that he is sealed up unto the day of redemption. The third thing to be spoken of for the better understanding the word [forgive] concerns the effects following the apprehension thereof; these are peace of conscience, and joy in the holy Ghost. These things touching justification and remission of sins being opened, we may understand what is prayed for, when we say, Forgive sins. We pray… Secondly, we pray that ourselves and others being justified and accepted into favor, it would please the Lord to continue this his favor, and that he would signify and make the same known to our hearts and consciences daily, by a new testification of the holy Ghost, accompanied with a new application of pardon for new sins daily committed, and that we may have more and more assurance of our perfect redemption at the day of judgment; and that we may have peace of conscience, and joy in the Holy Ghost, in the meantime.</p></blockquote>

ation of pardon for new sins daily committed, and that we may have more and more assurance of our perfect redemption at the day of judgment; and that we may have peace of conscience, and joy in the Holy Ghost, in the meantime.”

vation%3B+and+by+this+means+the+Holy+Ghost+works+faith+in+Christ%3B+then+confession+and+grief+for+sin%3B+then+prayer+to+ask+forgiveness%3B+and+grace+to+live+godly%2C+and+then+does+witness+to+his+spirit+that+he+is+accepted+of+God.+Thus+sentence+is+pronounced+in+the+conscience%3A+from+whence+arises+sense+of+God%E2%80%99s+love%2C+which+is+called+the+shedding+abroad+of+the+love+of+God+in+our+hearts+by+the+Holy+Ghost%2C+Rom.+5%3A5%2C+also+sense+of+the+loving+countenance+of+God%2C+which+is+the+sign+of+his+loving+kindness%2C+and+is+that+speech+of+God%2C+by+which+he+does+say+to+our+souls%2C+he+is+our+salvation%2C+and+then+arises+in+our+hearts+peace+of+conscience%2C+and+joy+in+the+Holy+Ghost.+This+sentence+of+forgiveness+unto+the+conscience+has+different+degrees%3A+it+is+sometimes+more+clear+in+the+apprehension+of+the+soul%2C+sometimes+more+dim%2C+yea+sometimes+quite+blotted+out+in+the+counterpane+of+our+release%2C+or+copy+of+our+acquittance%3B+as+it+was+with+David%2C+Ps.+51%2C+so+that+a+person+perfectly+just+before+God%2C+has+sometime+little+or+no+sense+or+apprehension+of+it+in+his+own+conscience%2C+but+doubts+whether+he+be+in+state+of+grace+or+no.+Which+happens+because+of+the+stain+and+guilt+of+new+sins%2C+which+guilt+abides+in+the+conscience%2C+until+a+man+do+confess+his+sins%2C+repent%2C+and+ask+forgiveness%2C+and%2C+by+a+renewed+faith%2C+apply+forgiveness%3A+by+which+means+the+evidence+of+his+pardon+is+again+by+the+Holy+Ghost+exemplified%2C+and+sentence+by+this+new+application+is+again+pronounced+in+his+conscience%3B+whence+arises+new+assurance+of+salvation%2C+and+renewed+joy+in+the+Holy+Ghost.+This+is+that+justification%2C+which+for+distinction+sake%2C+Divines+call+justification+by+parts%2C+or+continued%2C+or+repeated+justification%2C+or+new+application+of+one+and+the+same+justification%3A+which+justification+though+in+respect+of+the+sentence+pronounced+in+heaven%2C+is+one+individual+act%2C+whereby+a+man+standeth+alwayes+just+before+God%3B+yet+in+respect+of+the+pronouncing+of+that+sentence+to+the+heart%2C+it+is+not+actually+applied%3B+neither+can+a+particular+sinne+be+said+to+be+everie+way+actually+forgiven%2C+until+after+it+have+beene+committed%2C+is+confessed%2C+and+repented+of%3B+nor+untill+forgivenesse+be+asked%2C+and+until+the+holy+Ghost+hath+made+new+application+thereof+unto+the+conscience%2C+through+renewing+of+faith%2C+by+which+a+man+doth+again+and+again%2C+as+new+sins+are+committed%2C+apply+the+merits+of+the+blood+of+Christ+unto+his+soul.+Also+it+must+be+known+that+the+sentence+of+pardon+which+is+passed+in+heaven+with+God%2C+is+not+fully+executed+until+the+last+degree+of+it%2C+when+sentence+of+absolution+shall+be+pronounced+by+Christ+Jesus%3A+Come+ye+blessed+of+my+Father%2C+inherit+the+kingdom+prepared+for+you+from+the+foundation+of+the+world%2C+Matt.+25.34.+It+must+moreover+be+conceived+and+held%2C+that+notwithstanding+this+distinction+of+justification+between+an+absolute+justification+in+respect+of+God%2C+and+a+justification+by+parts+in+respect+of+application+to+mans+conscience%2C+there+are+not+two+kinds+of+justification%2C+a+first+and+a+second%2C+as+the+Papists+hold%3A+but+one+and+the+same+justification%2C+considered+in+different+respects.+In+respect+of+God%E2%80%99s+actual+acceptation+of+a+man%E2%80%99s+person%2C+justification+is+absolute%3B+but+in+respect+of+the+actual+application+and+manifestation+of+God%E2%80%99s+acceptation+unto+a+mans+conscience%2C+justification+is+by+parts+and+degrees.+When+a+man+already+justified+asks+forgiveness%2C+he+doth+not+ask+a+new+justification%2C+but+a+second+or+new+application+of+pardon+unto+the+conscience+of+those+particular+sins+which+are+daily+committed%2C+together+with+continuance+of+God%E2%80%99s+favor%2C+and+more+clear+evidence+that+he+is+sealed+up+unto+the+day+of+redemption.+The+third+thing+to+be+spoken+of+for+the+better+understanding+the+word+%5Bforgive%5D+concerns+the+effects+following+the+apprehension+thereof%3B+these+are+peace+of+conscience%2C+and+joy+in+the+holy+Ghost.+These+things+touching+justification+and+remission+of+sins+being+opened%2C+we+may+understand+what+is+prayed+for%2C+when+we+say%2C+Forgive+sins.+We+pray%E2%80%A6+Secondly%2C+we+pray+that+ourselves+and+others+being+justified+and+accepted+into+favor%2C+it+would+please+the+Lord+to+continue+this+his+favor%2C+and+that+he+would+signify+and+make+the+same+known+to+our+hearts+and+consciences+daily%2C+by+a+new+testification+of+the+holy+Ghost%2C+accompanied+with+a+new+application+of+pardon+for+new+sins+daily+committed%2C+and+that+we+may+have+more+and+more+assurance+of+our+perfect+redemption+at+the+day+of+judgment%3B+and+that+we+may+have+peace+of+conscience%2C+and+joy+in+the+Holy+Ghost%2C+in+the+meantime.%E2%80%9D%0A%0A%E2%80%94+Henry+Scudder%2C+A+Key+of+Heaven+the+Lord%E2%80%99s+Prayer+Opened+%26+so+Applied%E2%80%A6+%28London%2C+1633%29%2C+5th+Petition%2C+pp.+424-32&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F441e778cae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/441e778cae.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=It%20must%20be%20diligently%20observed%2C%20that,the%20Holy%20Ghost%2C%20in%20the%20meantime&amp;text=It%20must%20be%20diligently%20observed%2C%20that%20though%20justification&amp;text=joy%20in%20the%20Holy%20Ghost%2C%20in%20the%20meantime" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Neither have we departed from the doctrine of the Church, in that we teach that faith only justifies. For many of the ancient have used this form of words [though they also affirmed justification involves an inherent righteousness], as: Origen on Rom. 3: Dicit apostolus sufficere solius fidei justificationem, ita ut credens quis tantummodo justificetur, etiamsi nihil ab eo operis fuerit expletum. [The apostle says that the justification of faith alone is sufficient, so that a man is justified by believing alone, even if no work has been performed by him.] Hilary, can. 8. in Matthew: Fides sola justificat. [Faith alone justifies.] Basil, Homily on Humility: Haec est perfecta &amp; integra gloriatio in Deo, quando neque ob justitiam suam quis se iactat, sed novit quidem seipsum verae justitiae indigum, solâ autem fide in Christum justificatum. [This is perfect and complete boasting in God: when a person does not boast on account of his own righteousness, but knows himself indeed to be lacking true righteousness, and is justified by faith alone in Christ.] Ambrose on Rom. 3: Iustificati sunt gratis, quia nihil operantes, neque vicem reddentes, sola fide justificati sunt dono Dei. [They are justified freely, because, doing nothing and rendering nothing in return, they are justified by faith alone, by the gift of God.] Chrysostom, Homily on Faith and the Law of Nature: Eum qui operatur opera iustitiae sine fide non potes probare vivum esse, fidem absque operibus possum monstrare, et vixisse, et regnum coelorum assecutam, nullus sine fide vitam habuit, latro autem credidit tantum, et iustificatus est. [You cannot prove that one who performs works of righteousness without faith is alive; but I can show that faith without works has both lived and attained the kingdom of Heaven. No one has had life without faith; but the thief believed only, and was justified.] Augustine bk. 1, Contra the Two Epistles of Pelagius, ch. 21 Quantaelibet fuisse virtutis antiquos praedices justos, non eos salvos fecit nisi fides mediatoris. [However great you may proclaim the virtue of the righteous of old to have been, it did not save them except the faith of the Mediator.] 83 Questions, q. 76 Si quis cum crediderit mox de hac vita decesserit, iustificatio fidei manet cum illo: nec praecedentibus bonis operibus, quia non merito ad illam, sed gratia pervenit, nec consequentibus, quia in hac vita esse non sinitur. [If anyone, after he has believed, immediately departs from this life, the justification of faith remains with him: not by preceding good works, because he attained to it not by merit but by grace; nor by subsequent works, because he is not permitted to remain in this life.] Theophylact, on Gal. 3: Nunc plane ostendit apostolus, fidem vel solam, iustificandi habere in se virtutem. [Now the apostle plainly shows that faith alone has within itself the power of justifying.] Bernard Sermon 22 on Canticles: Quisquis pro peccatis compunctus, esurit et sitit iustitiam, credat in te qui iustificas impium, at solam iustificatus per fidem, pacem habebitad te. [Whoever, pierced with sorrow for sins, hungers and thirsts for righteousness, let him believe in you who justifies the ungodly; and thus, justified by faith alone, he will have peace with you.] Epistle 77: Qui crediderit et baptizatus fuerit salvus erit. Caute, inquit, non repetiit, qui vero baptizatus non fuerit, condenabitur, sed tantum qui vero non crediderit, innuens nimirum solam fidem interdum sufficere ad salutem, et sine illa sufficere nihil. [He who has believed and has been baptized shall be saved. He carefully did not repeat, ‘but he who has not been baptized shall be condemned,’ but only, ‘he who has not believed,’ clearly indicating that faith alone sometimes suffices for salvation, and that without it nothing suffices.] Sometimes by these phrases of speech they exclude: [1] All that may be without supernatural knowledge, all that may be without a true profession. [2] Sometimes the necessity of good works in act or external good works.

3. The power of nature without illumination and grace.

4. The power of the Law.

5. The sufficiency of anything found in us to make us stand in judgment, to abide the trial, and not to fear condemnation. And in this sense faith only is said to justify, that is, the only mercy of God and merit of Christ apprehended by faith: and then the meaning of their speech is that only the persuasion and assured trust that they have, to be accepted of God for Christ’s sake, is that that makes them stand in judgment, without fear of condemnation. And in this sense all the divines formerly alleged for proof of the insufficiency of all our inherent righteousness, and the trust which we should have in the only mercy of God, and merit of Christ, do teach as we do, that faith only justifies. For neither they nor we exclude from the work of justification, [1] the action of God as the supreme and highest cause of our justification: for it is He that remits sin, and receives us to grace: [2] nor the merit of Christ, as that for which God inclines to show mercy to us, and to respect us: [3] nor the remission of sins, gracious acceptation, and grant of the gift of righteousness, as that by which we are formally justified: [4] nor those works of preventing grace, whereby out of the general apprehension of faith, God works in us dislike of our former condition, desire to be reconciled to God, to have remission of that [which] is past, and grace hereafter to decline the like evils, and to do contrary good things. For by these we are prepared, disposed and fitted for justification; without these none are justified. And in this sense, and to imply a necessity of these to be found in us, sometimes the Fathers and others say that we are not justified by faith only. And we all agree, that it is not our conversion to God, nor the change we find in ourselves, that can any way make us stand in judgment without fear, and look for any good from God, otherwise than in that we find ourselves so disposed and fitted, as is necessary for justification, whence we assure ourselves God will in mercy accept us for Christ’s sake.</p></blockquote>

3. The power of nature without illumination and grace.

4. The power of the Law.

5. The sufficiency of anything found in us to make us stand in judgment, to abide the trial, and not to fear condemnation. And in this sense faith only is said to justify, that is, the only mercy of God and merit of Christ apprehended by faith: and then the meaning of their speech is that only the persuasion and assured trust that they have, to be accepted of God for Christ’s sake, is that that makes them stand in judgment, without fear of condemnation. And in this sense all the divines formerly alleged for proof of the insufficiency of all our inherent righteousness, and the trust which we should have in the only mercy of God, and merit of Christ, do teach as we do, that faith only justifies. For neither they nor we exclude from the work of justification, [1] the action of God as the supreme and highest cause of our justification: for it is He that remits sin, and receives us to grace: [2] nor the merit of Christ, as that for which God inclines to show mercy to us, and to respect us: [3] nor the remission of sins, gracious acceptation, and grant of the gift of righteousness, as that by which we are formally justified: [4] nor those works of preventing grace, whereby out of the general apprehension of faith, God works in us dislike of our former condition, desire to be reconciled to God, to have remission of that [which] is past, and grace hereafter to decline the like evils, and to do contrary good things. For by these we are prepared, disposed and fitted for justification; without these none are justified. And in this sense, and to imply a necessity of these to be found in us, sometimes the Fathers and others say that we are not justified by faith only. And we all agree, that it is not our conversion to God, nor the change we find in ourselves, that can any way make us stand in judgment without fear, and look for any good from God, otherwise than in that we find ourselves so disposed and fitted, as is necessary for justification, whence we assure ourselves God will in mercy accept us for Christ’s sake.”

— Richard Field, Other citations (work not named), Of the Church... (Oxford: Turner, 1628), bk. 3, appendix, ch. 11, pp. 323-24">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNeither+have+we+departed+from+the+doctrine+of+the+Church%2C+in+that+we+teach+that+faith+only+justifies.+For+many+of+the+ancient+have+used+this+form+of+words+%5Bthough+they+also+affirmed+justification+involves+an+inherent+righteousness%5D%2C+as%3A+Origen+on+Rom.+3%3A+Dicit+apostolus+sufficere+solius+fidei+justificationem%2C+ita+ut+credens+quis+tantummodo+justificetur%2C+etiamsi+nihil+ab+eo+operis+fuerit+expletum.+%5BThe+apostle+says+that+the+justification+of+faith+alone+is+sufficient%2C+so+that+a+man+is+justified+by+believing+alone%2C+even+if+no+work+has+been+performed+by+him.%5D+Hilary%2C+can.+8.+in+Matthew%3A+Fides+sola+justificat.+%5BFaith+alone+justifies.%5D+Basil%2C+Homily+on+Humility%3A+Haec+est+perfecta+%26+integra+gloriatio+in+Deo%2C+quando+neque+ob+justitiam+suam+quis+se+iactat%2C+sed+novit+quidem+seipsum+verae+justitiae+indigum%2C+sol%C3%A2+autem+fide+in+Christum+justificatum.+%5BThis+is+perfect+and+complete+boasting+in+God%3A+when+a+person+does+not+boast+on+account+of+his+own+righteousness%2C+but+knows+himself+indeed+to+be+lacking+true+righteousness%2C+and+is+justified+by+faith+alone+in+Christ.%5D+Ambrose+on+Rom.+3%3A+Iustificati+sunt+gratis%2C+quia+nihil+operantes%2C+neque+vicem+reddentes%2C+sola+fide+justificati+sunt+dono+Dei.+%5BThey+are+justified+freely%2C+because%2C+doing+nothing+and+rendering+nothing+in+return%2C+they+are+justified+by+faith+alone%2C+by+the+gift+of+God.%5D+Chrysostom%2C+Homily+on+Faith+and+the+Law+of+Nature%3A+Eum+qui+operatur+opera+iustitiae+sine+fide+non+potes+probare+vivum+esse%2C+fidem+absque+operibus+possum+monstrare%2C+et+vixisse%2C+et+regnum+coelorum+assecutam%2C+nullus+sine+fide+vitam+habuit%2C+latro+autem+credidit+tantum%2C+et+iustificatus+est.+%5BYou+cannot+prove+that+one+who+performs+works+of+righteousness+without+faith+is+alive%3B+but+I+can+show+that+faith+without+works+has+both+lived+and+attained+the+kingdom+of+Heaven.+No+one+has+had+life+without+faith%3B+but+the+thief+believed+only%2C+and+was+justified.%5D+Augustine+bk.+1%2C+Contra+the+Two+Epistles+of+Pelagius%2C+ch.+21+Quantaelibet+fuisse+virtutis+antiquos+praedices+justos%2C+non+eos+salvos+fecit+nisi+fides+mediatoris.+%5BHowever+great+you+may+proclaim+the+virtue+of+the+righteous+of+old+to+have+been%2C+it+did+not+save+them+except+the+faith+of+the+Mediator.%5D+83+Questions%2C+q.+76+Si+quis+cum+crediderit+mox+de+hac+vita+decesserit%2C+iustificatio+fidei+manet+cum+illo%3A+nec+praecedentibus+bonis+operibus%2C+quia+non+merito+ad+illam%2C+sed+gratia+pervenit%2C+nec+consequentibus%2C+quia+in+hac+vita+esse+non+sinitur.+%5BIf+anyone%2C+after+he+has+believed%2C+immediately+departs+from+this+life%2C+the+justification+of+faith+remains+with+him%3A+not+by+preceding+good+works%2C+because+he+attained+to+it+not+by+merit+but+by+grace%3B+nor+by+subsequent+works%2C+because+he+is+not+permitted+to+remain+in+this+life.%5D+Theophylact%2C+on+Gal.+3%3A+Nunc+plane+ostendit+apostolus%2C+fidem+vel+solam%2C+iustificandi+habere+in+se+virtutem.+%5BNow+the+apostle+plainly+shows+that+faith+alone+has+within+itself+the+power+of+justifying.%5D+Bernard+Sermon+22+on+Canticles%3A+Quisquis+pro+peccatis+compunctus%2C+esurit+et+sitit+iustitiam%2C+credat+in+te+qui+iustificas+impium%2C+at+solam+iustificatus+per+fidem%2C+pacem+habebitad+te.+%5BWhoever%2C+pierced+with+sorrow+for+sins%2C+hungers+and+thirsts+for+righteousness%2C+let+him+believe+in+you+who+justifies+the+ungodly%3B+and+thus%2C+justified+by+faith+alone%2C+he+will+have+peace+with+you.%5D+Epistle+77%3A+Qui+crediderit+et+baptizatus+fuerit+salvus+erit.+Caute%2C+inquit%2C+non+repetiit%2C+qui+vero+baptizatus+non+fuerit%2C+condenabitur%2C+sed+tantum+qui+vero+non+crediderit%2C+innuens+nimirum+solam+fidem+interdum+sufficere+ad+salutem%2C+et+sine+illa+sufficere+nihil.+%5BHe+who+has+believed+and+has+been+baptized+shall+be+saved.+He+carefully+did+not+repeat%2C+%E2%80%98but+he+who+has+not+been+baptized+shall+be+condemned%2C%E2%80%99+but+only%2C+%E2%80%98he+who+has+not+believed%2C%E2%80%99+clearly+indicating+that+faith+alone+sometimes+suffices+for+salvation%2C+and+that+without+it+nothing+suffices.%5D+Sometimes+by+these+phrases+of+speech+they+exclude%3A+%5B1%5D+All+that+may+be+without+supernatural+knowledge%2C+all+that+may+be+without+a+true+profession.+%5B2%5D+Sometimes+the+necessity+of+good+works+in+act+or+external+good+works.+3.+The+power+of+nature+without+illumination+and+grace.+4.+The+power+of+the+Law.+5.+The+sufficiency+of+anything+found+in+us+to+make+us+stand+in+judgment%2C+to+abide+the+trial%2C+and+not+to+fear+condemnation.+And+in+this+sense+faith+only+is+said+to+justify%2C+that+is%2C+the+only+mercy+of+God+and+merit+of+Christ+apprehended+by+faith%3A+and+then+the+meaning+of+their+speech+is+that+only+the+persuasion+and+assured+trust+that+they+have%2C+to+be+accepted+of+God+for+Christ%E2%80%99s+sake%2C+is+that+that+makes+them+stand+in+judgment%2C+without+fear+of+condemnation.+And+in+this+sense+all+the+divines+formerly+alleged+for+proof+of+the+insufficiency+of+all+our+inherent+righteousness%2C+and+the+trust+which+we+should+have+in+the+only+mercy+of+God%2C+and+merit+of+Christ%2C+do+teach+as+we+do%2C+that+faith+only+justifies.+For+neither+they+nor+we+exclude+from+the+work+of+justification%2C+%5B1%5D+the+action+of+God+as+the+supreme+and+highest+cause+of+our+justification%3A+for+it+is+He+that+remits+sin%2C+and+receives+us+to+grace%3A+%5B2%5D+nor+the+merit+of+Christ%2C+as+that+for+which+God+inclines+to+show+mercy+to+us%2C+and+to+respect+us%3A+%5B3%5D+nor+the+remission+of+sins%2C+gracious+acceptation%2C+and+grant+of+the+gift+of+righteousness%2C+as+that+by+which+we+are+formally+justified%3A+%5B4%5D+nor+those+works+of+preventing+grace%2C+whereby+out+of+the+general+apprehension+of+faith%2C+God+works+in+us+dislike+of+our+former+condition%2C+desire+to+be+reconciled+to+God%2C+to+have+remission+of+that+%5Bwhich%5D+is+past%2C+and+grace+hereafter+to+decline+the+like+evils%2C+and+to+do+contrary+good+things.+For+by+these+we+are+prepared%2C+disposed+and+fitted+for+justification%3B+without+these+none+are+justified.+And+in+this+sense%2C+and+to+imply+a+necessity+of+these+to+be+found+in+us%2C+sometimes+the+Fathers+and+others+say+that+we+are+not+justified+by+faith+only.+And+we+all+agree%2C+that+it+is+not+our+conversion+to+God%2C+nor+the+change+we+find+in+ourselves%2C+that+can+any+way+make+us+stand+in+judgment+without+fear%2C+and+look+for+any+good+from+God%2C+otherwise+than+in+that+we+find+ourselves+so+disposed+and+fitted%2C+as+is+necessary+for+justification%2C+whence+we+assure+ourselves+God+will+in+mercy+accept+us+for+Christ%E2%80%99s+sake.%E2%80%9D%0A%0A%E2%80%94+Richard+Field%2C+Other+citations+%28work+not+named%29%2C+Of+the+Church...+%28Oxford%3A+Turner%2C+1628%29%2C+bk.+3%2C+appendix%2C+ch.+11%2C+pp.+323-24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F16a6aa85d0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/16a6aa85d0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=Neither%20have%20we%20departed%20from%20the,mercy%20accept%20us%20for%20Christ%E2%80%99s%20sake&amp;text=Neither%20have%20we%20departed%20from%20the%20doctrine%20of&amp;text=will%20in%20mercy%20accept%20us%20for%20Christ%E2%80%99s%20sake" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

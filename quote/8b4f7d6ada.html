<blockquote><p>As for the desire of the Repentance and life of Reprobates which you attribute unto God, you keep your course I confess in strange expressions, manifestly contradictious to the nature of God, and to your self.

Can you persuade your self that ever the world will be brought about to believe, or any intelligent or sober man amongst them, that God desires the repentance and life of them, whom he hath determined from everlasting to deprive of those helps without which no man can repent and bee saved? yet that he doth deprive them hereof, it is your own most express profession in the former Section.

As for hardening them; doth he not harden whom he will? and hath he not from everlasting ordained all Reprobates unto destruction? As for any desire hereof in God, I account it a very absurd thing, to treat of any will in God under the notion of desire in proper speech; Speak we of the desires of weak men, who cannot effect what they will; but be advised to spare to attribute any desires to God in proper speech, as you would spare to attribute to him, eyes and ears, and hands, and heart, in proper speech, and though God bee pleased in condescension to our capacities to take upon him our infirmities, let us not recompense his goodness so ill, as to conceive of his nature as obnoxious to the same imperfections whereto our natures are</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Mr. Cotton’s, Clearing certain doubts concerning predestination. Together with an examination thereof</cite>, (London: Andrew Crook, 1646), p. 233.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-14e1689bee" data-kw="">
<blockquote><p>By the gospel-lamp there is a discovery made of a new and better covenant established in Christ as a second Adam, than that which was made with the first Adam, even a covenant of grace and promise; which being confirmed by the death of Christ, is now set out in its last and best edition, viz., as a testamentary deed. Everything in and about this covenant is wonderful and mysterious. The Trinity transacted in it with Christ as a second Adam from eternity: “I have made a covenant with my chosen; I have sworn unto David my servant,” Psalm Ixxxix. 3.

The gradual manifestation of this covenant unto us, and the variety of dispensations that it has undergone under the Old and New Testament, and yet still the same covenant. The absolute freedom of this covenant unto us, no conditions or qualifications required on our part to interest us in it, the proper condition of it being already fulfilled in the obedience and death of Christ, it comes out to us absolutely free, “I will be their God. I will sprinkle them with clean water, and they shall be clean. I will take away the heart of stone,” &amp;c.

The way how a sinner is brought within the bonds of this covenant is only owing to the gospel-lamp or light, namely, by faith, not of the operation of man, but of the operation of God in a day of power. He just makes the sinner willing to be saved without money and without price, upon the footing of free grace reigning in and through an imputed righteousness, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Lamp Ordained for God s Anointed. Being the Substance of Two Sermons. The First Preached at the Admission of the Rev. James Fisher, late Minister of the Gospel at Kinclaven, to be Minister of the Dissenting Associate Congregation in and about Glasgow, October 8, 1741; the other preached at Stirlin</cite></span></figcaption>

<blockquote><p>1. The first ground is the Lord’s disposition and nature of mercy and placableness towards a poor sinner, which gives him footing for his hope abundantly in any particular case, as: (1.) From his Name and attributes, whereby He has made Himself known to his people. God proclaims his Name to Moses to be ‘the Lord, the Lord God, the powerful, the mighty Jehovah’ (Ex. 34 [vv. 6-7]), which ministers comfort when annexed to his manifestation of Himself in this way of mercy. ‘Merciful,’ inclined to pity the sin and misery of his people, ready to relieve them in their distress and not only just to require the due service and punish the defaults; ‘Gracious,’ of an affable condescending descending nature, not standing upon the distance that He is in as a great King above all his creatures; He may be petitioned, sought unto and prevailed with by his poor suitors. ‘Long-suffering,’ that is, not hasty to use severity with the worst of sinners, usually taking all other ways first with them, willing that all men should repent and come to the knowledge of the truth (1 Tim. 2:4): Trying many that repent not with much goodness to draw them to it. Enduring with much patience the very vessels of wrath before He brings destruction on them (Rom. 9:22). In all cases He forgives iniquity, transgression and sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-newcome.html">Henry Newcome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sinner’s Hope</cite>, ... (London: E.C., 1660 [1659]), ch. 4, pp. 25-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>Upon all the glory of believers, there is that covering, the defence of the everlasting covenant, that is ordered in all things and sure. There are two covenants, that of grace, made with believers in Christ, and that of redemption, made with Christ himself, which is the foundation of the other; and these two make a strong covering and defence for that beauty and glory, which believers have from Christ: we have a summary of the covenant of redemption, in as far as we are concerned in it, Psa. 89:28, and onwards, there God engages thus, ‘his seed will make to endure forever, and if his children forsake my law, break my statutes, and keep not my commandments, then I will visit their transgressions with the rod, and their iniquity with stripes. Nevertheless, my loving kindness will I not utterly take from him, my covenant will I not break; but his seed shall endure for ever.’

The like account we have of the covenant of grace, Jer. 32:38, and downwards ‘they shall be my people, and I will be their God: And I will give them one heart, and one way, that they may fear me for ever, for the good of them, and of their children after them: And I will make an everlasting covenant with them, that I will not turn away from them, to do them good; but I will put my fear in their hearts, that they shall not depart from me.’ To which add what is in the parallel chapter, Jer. 31: 34, ‘I will forgive their iniquity, and remember their sins no more.’

Here indeed is a glorious covering stretched out over all the glory. Who will rob believers of that which is so well secured to them by that everlasting covenant of grace founded upon that eternal, and no less sure covenant of redemption? Now, that ye may know how sure it is made by this covenant, that they who were upon God’s heart from eternity, shall have Christ, how sure they, who have him once, are made, that they shall not lose him, him who is their glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-halyburton.html">Thomas Halyburton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Communion Sermons (1770) in Faith and Justification</cite></span></figcaption>

<blockquote><p>3. According to the good pleasure and everlasting counsels of the Father, Son, and Holy Spirit, and for the manifestation of the divine glory in the salvation of sinners, the Father, from eternity, entered into a covenant with Son, the Lord Jesus Christ, promising to Him great mediatorial glory, and the eternal life of the elect, upon condition of His fulfilling all righteousness as their Surety.

To the terms of this covenant, the Lord Jesus voluntarily and graciously acceded, and, being accepted as the head and representative of the elect, was invested, with mediatorial offices, and by the oath of God constituted the Surety of the everlasting covenant.

The Holy Spirit participated with the Father and the Son in the formation of the covenant, and graciously undertook to sustain an infinitely important part in its execution. In this covenant there is not only a display of the perfections of the Godhead, but a display of these perfections as subsisting in the persons of the Father, Son, and Holy Spirit, the mystery of trinity in unity being exhibited in a peculiarly convincing and glorious manner in the federal economy.

4. This covenant is sometimes called by the church the covenant of redemption, but more commonly the covenant of grace. The former name is applied to it when it is viewed as an agreement between the Father and the Son that Christ should redeem the elect by satisfying, in their room, all the demands that divine justice had upon them. The latter name is applied to it when it is viewed as originating solely in the sovereign love of the Godhead, and as freely conveying Christ and all blessings in Him to elect sinners, notwithstanding their absolute unworthiness.</p></blockquote>

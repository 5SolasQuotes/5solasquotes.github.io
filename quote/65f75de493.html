<main class="wrap"><figure class="quote" id="q-65f75de493" data-kw="">
<blockquote><p>Thus, from the beginning, our Lord God was not content with announcing to Adam the grace by which He had purposed to save His Church through His Son; He willed to add sacrifices, as living figures of the future sacrifice of Jesus Christ, to strengthen the faith of the children of God in the redemption which they were awaiting (Heb 11:4).

Then afterwards, renewing this covenant of grace and of mercy to Abraham, He added thereto the sacrament of circumcision (Gen 17:10, 11), and many other ceremonies (Exod 12); these were Sacraments representing to them what Jesus Christ would accomplish in HIs time, that is to say, all the mystery of their salvation; the Apostle declares this amply in the Epistle to the Hebrews.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, trans. James Clark (1558; Edinburgh, 2016), 4.30, pp 45-46.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3d18ff0399" data-kw="">
<blockquote><p>Vers. 14. For sin shall not have dominion over you; for ye are not under the Law, but under Grace.

Argum. 4. If you contend and fight against sin, the Tyrant shall not recover his dominion over you, which he hath lost, neither shall sin reign over you, but you shall become Conquerors through Christ; therefore ought you to labour after Holiness.

For you are not] Argum. 5. Confirming the former, you are not under the Law, under the Covenant of works, wherein the Commandment exacted strict obedience, but affords no strength to assist in our obedience; but you are under Grace, or the Covenant of Grace, wherein the Grace of God, with the Command, confers life to Believers, and strength to obey; therefore certain of the victory against sin, ye ought to endeavour after Holiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 15.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-d5e3d138cd" data-kw="">
<blockquote><p>Their heavenly adoption ought to excite them to the exercise of beneficence, that they may imitate their Father’s disposition, “who makes his sun to rise on the evil and on the good,” (Mt. 5:45) There is nothing in which men resemble God more truly than in doing good to others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 30:4</span></figcaption>

</figure><figure class="quote" id="q-d40176382a" data-kw="">
<blockquote><p>Now although God does not at all intend the salvation of the non-elect, yet he deals with the greatest truth and seriousness when he calls them, nor can any charge of mockery or deceit be brought against him. All that are called by the gospel, says the Synod of Dort, are seriously called, for God seriously and truly shews in his word what is acceptable to him, and also seriously promises rest for their souls, and eternal life, to all that come to him by faith.

Those who reject the word are very severely reproved in scripture, and will be punished for that rejection, (Isaiah 1. 2, 3; Ixv 2, 3; Matt. xi. 16; John v. 40; Proverbs i. 24-1 26); whereas those who obey the divine calling and receive the word, are commended, and will be rewarded. (John xiv. 21; Acts xvii. ii.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 7.2, p. 338.</span></figcaption>

</figure><figure class="quote" id="q-e207580d7a" data-kw="">
<blockquote><p>2. God’s common providence towards mankind teaches us that God is inclined to mercy and is willing to be reconciled, that he is not implacable… By these things, it plainly appears that God hasn’t utterly forsaken the world of mankind as to any favor or merciful regards. This was the witness which God gave all mankind, and even the heathen, that had direct revelation of his disposition to a reconciliation. Acts 14:16–17, ‘Who in times past suffered all nations to walk in their own ways. Nevertheless He left not Himself without witness, in that He did good, and gave us rain from heaven, and fruitful seasons, filling our hearts with food and gladness.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons &amp; Discourses: 1723–1729</cite>, (1723; WJE Online, vol. 14), ed. Kenneth P. Minkerma</span></figcaption>

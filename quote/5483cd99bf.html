<main class="wrap"><figure class="quote" id="q-5483cd99bf" data-kw="">
<blockquote><p>Now we must treat of going aside; for so I had rather call it, than flying; though I think it the part of a wise-man to fly peril with reason. There are some therefore, which do without exception find fault with going aside for the plague, that they count it a very heinous offence, though they think that those which tarry ought not to use rashness. There are on the other side which hold that every man, so soon as the plague cometh, ought to provide for himself, having no regard, or but very small of the fellowship and duties which Christian Charity doth command. Now I for my part do dissent from both these and especially from the latter, as having most lawful causes:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Learned &amp; Pithy Treatise of the Plague, Wherein are Handled These Two Questions: the One, Whether the Plague Be Infectious, Or No: the Other, Whether and How Far it May of Christians Be Shunned by Going Aside (1580; London, 1665)</cite>, p. 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-0f3186eb5d" data-kw="">
<blockquote><p>If any man before the time prescribed shall go out of his house without license and thrust himself into the company of others, he shall be bound to begin afresh the time of shutting in and be punished beside[s] with an arbitrary [appointed] punishment. But if the same part being infected before and yet scarce well recovered, or but meetly recovered, shall adventure to do the like, he is to be accused of great unthankfulness and to be deprived of all benefits usual to be done unto him, and besides [this] to be restrained with [a] longer keeping in. But if being now in very deed infected with the plague, he shall be found to have committed this heinous offence upon notorious and wicked boldness, as a murderer after the loss of his goods [being set to die and having nothing further to lose], if he be without children, let him be delivered over unto the hangman.</p></blockquote>

r%20unto%20the%20hangman" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b7047b830e" data-kw="">
<blockquote><p>XVII. As extraordinary evils require extraordinary helps, so the Magistrate may do many things in a time of the Church’s gathering, backsliding or corruption which he cannot do so long as the Church is in a well constitut[ed] &amp; reformed condition: But from this to infer that he may demolish the established order and fabric of a right[ly] constitut[ed] and reformed Church, on purpose to give a proof of his extraordinary power, by reducing the same into order again; Or that he may make use of this extraordinary power, when the ordinary and appointed means are to be had, and also in case to effectuate the cure; to infer this (I say) were both impious and incongruous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Banders Disbanded… (1681)</cite>, p. 45</span></figcaption>

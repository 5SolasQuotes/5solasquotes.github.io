<main class="wrap"><figure class="quote" id="q-7297847466" data-kw="">
<blockquote><p>First, that there have been violent assaults upon the persons of the Saints for the truth’s sake, I need not fetch an argument from far to demonstrate unto you: Every one that we meet withal is able to tell us of those primitive persecutions, and to relate unto us rueful stories of the bloody massacres that have been abroad. Who amongst us is ignorant of those Smithfield Butcheries, and those whole-burnt-offerings of holy men, which the bloody priests of Rome did offer to their great idol?

What shall we say to this day’s rehearsal of those not invincible armadas, those powder-plots and conspiracies, those armies and insurrections, those wars and tumults, which have threatened as with open mouth, to swallow up and devour whole nations and commonwealths, where Jesus Christ hath had his worshippers?

Certainly nothing herein is so wonderful as this, that Christ hath yet a name in the world, that he hath yet a name in England. And that which hath secured truth and her subjects from the mischief of these designs hath been the powerful providence of the Almighty. He that holdeth the reins of government in his hand, who is the great and supreme Moderator of this world hath taken to himself his great power, and hath reigned.

Behold, God hath been to his churches, and holy ones as a refuge from the storm, and as a shadow from the heat of their persecuting adversaries, whilst the blast of the terrible ones hath been as a storm against the wall; so that, as we have cause this day, in our anniversary commemoration of these never to be forgotten deliverances, we may take up that angelical doxology, and say, blessing, honour, glory and power, be given to him that sits upon the throne, and to the Lamb for ever, amen, hallelujah.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saint’s Security Against Seducing Spirits. Or, The Anointing from the Holy One the Best Teaching. Delivered in a Sermon at Paul’s before the Lord Major, Alderman, and Commonality of the City of London, upon the Fifth of November, 1651</cite>, ed. John Palmer and Christian Herring (1651; Purely Presbyterian Publications, 2019), pp 2-3.</span></figcaption>

<blockquote><p>18 The Office of a Magistrate is seen or considered either in Peace or War.

19 In the time of Peace let him administer Justice and Judgement.

20 By Justice we understand external obedience to both Tables of the commandments.

21 For it is the Magistrates charge and care to see that both the Tables of the commandments he kept and observed, as far as it concerns External Discipline.

22 He may and must hinder false and blasphemous opinions from being spread abroad: He may and must punish those which are seducers of Souls, especially such as are seditious: He may and must hinder the profanation of the Sabbath.

23 But yet he must not take upon him authority and power over the Consciences of men, whereof God only is King.

24 Therefore neither must the Magistrate compel the Subjects to any false religion, neither must the Subjects obey if he goes about to compel them.

25 Unto the Administration of Justice there belongeth also the power of making Civil Laws, to be the determination of the law of nature.

26 For Christian Commonwealths are not simply tied and bound to the Judicial Laws of Moses.</p></blockquote>

<blockquote><p>2. How many sorts of concupiscences there be Before the sin of our first parents, the concupiscence in our nature was simple, natural, orderly (and necessary, like as other affections were, so that it was subject unto no malice: such as that which is in us yet, as when we be hungry we be desire meat; when we thirst, drink; when we be a cold, we desire warmth; when we be too hot, we desire to be cooled; when we be in prison, we desire liberty; when we be sick, we desire health etc. and this we do by the only course of nature, without any matter of sin. But after that our first parents had drunk of the poison of the Serpent, this strength of concupiscence is depraved in our hearts, and thereby it came that (passing the limits of nature and necessity) it extends itself unto those things which it is not lawful to desire: for that it is not lawful to take things away which pertain to others. Therefore the affections of concupiscence are of two sorts, natural and corrupt. The natural be set in us by God, and so much not unlawful, but that they be also necessary. Wherefore they do very unadvisedly teach us which do refer the crying of infants when they be hungry and desire meat unto the forbidden concupiscence and do ascribe them unto original sin. The corrupt affections of concupiscence be they when the limits of necessity are exceeded and men follow pleasures, curiosity, glory, ambition and other vices, and that contrary unto the law of charity and the purity of holiness. This corruption of our concupiscence is gotten of the old serpent, not grafted in our flesh of God. Wherefore we must beware that we do not ascribe our whole concupiscence neither to God, neither to Satan. The strength of desiring is given us from God, the strength of evil desiring from Satan: like as we do take it of God that we do live, and that we live evil we take it of Satan, the beginner of our malice. By this distinction we do foresee that we do not deny the work of God in us for the work of Satan, nor attribute the work of Satan unto God.</p></blockquote>

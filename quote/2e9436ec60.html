<main class="wrap"><figure class="quote" id="q-2e9436ec60" data-kw="">
<blockquote><p>By the worship of God inquired after [in this treatise], not that which is natural or moral, which is required in the First Commandment is intended. Such is our faith and confidence in Him, our fear of Him, our subjection of soul and conscience unto Him as the great Soveraign Lord, first cause, last end, Judge and Rewarder of all men; the Law whereof was originally written in the heart of man, and has been variously improved and directed by new revelations and institutions. And this worship is called natural upon a double account. First, because it depends on the nature of God, a due perception and understanding whereof makes all this worship indispensibly necessary: for none can know God but it is his duty to glorify Him as God, that is, to believe in Him, love Him, trust Him, and call upon Him, which all are therefore cursed that do not, Ps. 79:6; 2 Thess. 1:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667) | Question 1, pp. 1-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ee9c14edcf" data-kw="">
<blockquote><p>Herein it [the 2nd Commandment] differs from the First Commandment, that commanded the worship of God which is natural, this the worship which is by divine institution. Downame Sum of Divinity. Cultus naturalis [natural worship] is that which nature directs all people to, or which arises from the nature of God. This belongs to all reasonable creatures. He that acknowledges there is a God, will acknowledge that He is to be be believed, feared, trusted, loved and prayed to: this was performed by Adam in Paradise and by the angels in Heaven, Isa. 6:3; Heb. 1:6. Cultus institutus, ‘instituted worship’ depends on the revelation of the will of God, this was commanded Adam in his innocency, as the Tree of Knowledge of Good and Evil, and the Tree of Life show. Natural worship is the chief, instituted worship may be interrupted. A time of worship is juris naturalis [of the law of nature], the seventh day juris positivi [of positive law]. Some in these days say all institutions are mere forms, and men may use or not use them at their pleasure according to their light: Qui non est religiosus non est Christianus. Cultus institutus est medium ex Dei voluntate ordinatum, ad cultum naturalem exercendum et pro nov•ndum. indica•tur hujusmodi media omnia à Deo instituta, in secundò praecepto per prohibitionem oppositorum mediorum omnium cultus ab hominibus excogitatorum, sub titulo sculptilis et imaginis, que cum praecipua fuerunt olim▪ hominum inventa, cultum Dei depravantia, aptissimè proponuntur (per Syn••dochen in Decalogo praecipuam) loco omnium humani ingenii commentorum ad cu••um spectantium. Ames, Marrow of Theology, bk. 2, ch. 13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London: A.M., 1654), bk. 9, ch. 3, ‘2nd Commandment’, p. 767 margin note on Dt., 4:15-19</span></figcaption>

</figure><figure class="quote" id="q-6201f5bc82" data-kw="">
<blockquote><p>It is an untruth which Raphael de la Torres [a Dominican Romanist], with other schoolmen say, that with the same religion by which we honor holy men, we honor God; upon this reason, because holiness in them is a participation of the divine nature, therefore God must be the intrinsical end, and formal reason for which we honor the saints. [1.] For holiness in saints is a participation of the divine nature; but it is a temporary and a created participation, it is not the same very holiness that is in God; but the created effect thereof: and so the love I bear to any creature, because there is somewhat of God in every creature; and the love to our neighbor, commanded in the Second Table of the Law, should be the love of God, commanded in the First Table of the Law. 2. When I bow to the gray-haired, and to the king, I then do an act of obedience to the Fifth Commandment: No man can say that when I bow to the king or to a holy man, that I am then bowing to the God of heaven and Worshipping God: No acts terminated upon saints living or dead are acts of worshipping God; yea, reverencing of the ordinances of God, as the delighting in or trembling at the Word, are not properly acts of adoring God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Introduction, section 6, pp. 83-84</span></figcaption>

<blockquote><p>4. When a man, finding that God is a free and intellectual Agent, and sees, as he may by natural reason, everything ordered to a suitable end to his Being, and by a suitable means or rule conducing to that end, and finds a higher degree of being in himself than in other creatures, and consequently an higher end, and consequently an higher rule conducing to that end, he does most naturally resolve this rule into that law, which by the will of God is given to man conducing to that end, the subject of which rule must be all his internal and external actions, both in reference to God, to himself and to others: but here then is the next question, and the next degree of ignorance in men, viz. What that law or will of God is concerning man? and from hence grow those varieties and errors in worship of God. And though haply most men, knowing the true God, may by the same Light of Nature concur in the general and fundamentals of worship, viz. That God is to be feared with all reverence, loved with all intention, obeyed with all sincerity, cheerfulness and exactness: all which are but natural conclusions from the nature of God, the nature of Man, and the relation that he bears to God, as his Creator, Lord, and Preserver…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-hale.html">Matthew Hale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Knowledge of God, &amp; of Ourselves I. by the Light of Nature, II. by the Sacred Scriptures</cite>, (London: 1688), pt. 1, ‘By the Light of Nature’, ch. 5, pp. 87-88</span></figcaption>

<div class="actions"><button class="copy" data-copy="“4. When a man, finding that God is a free and intellectual Agent, and sees, as he may by natural reason, everything ordered to a suitable end to his Being, and by a suitable means or rule conducing to that end, and finds a higher degree of being in himself than in other creatures, and consequently an higher end, and consequently an higher rule conducing to that end, he does most naturally resolve this rule into that law, which by the will of God is given to man conducing to that end, the subject of which rule must be all his internal and external actions, both in reference to God, to himself and to others: but here then is the next question, and the next degree of ignorance in men, viz. What that law or will of God is concerning man? and from hence grow those varieties and errors in worship of God. And though haply most men, knowing the true God, may by the same Light of Nature concur in the general and fundamentals of worship, viz. That God is to be feared with all reverence, loved with all intention, obeyed with all sincerity, cheerfulness and exactness: all which are but natural conclusions from the nature of God, the nature of Man, and the relation that he bears to God, as his Creator, Lord, and Preserver…”

— Matthew Hale, A Discourse of the Knowledge of God, &amp; of Ourselves I. by the Light of Nature, II. by the Sacred Scriptures (London: 1688), pt. 1, ‘By the Light of Nature’, ch. 5, pp. 87-88">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+When+a+man%2C+finding+that+God+is+a+free+and+intellectual+Agent%2C+and+sees%2C+as+he+may+by+natural+reason%2C+everything+ordered+to+a+suitable+end+to+his+Being%2C+and+by+a+suitable+means+or+rule+conducing+to+that+end%2C+and+finds+a+higher+degree+of+being+in+himself+than+in+other+creatures%2C+and+consequently+an+higher+end%2C+and+consequently+an+higher+rule+conducing+to+that+end%2C+he+does+most+naturally+resolve+this+rule+into+that+law%2C+which+by+the+will+of+God+is+given+to+man+conducing+to+that+end%2C+the+subject+of+which+rule+must+be+all+his+internal+and+external+actions%2C+both+in+reference+to+God%2C+to+himself+and+to+others%3A+but+here+then+is+the+next+question%2C+and+the+next+degree+of+ignorance+in+men%2C+viz.+What+that+law+or+will+of+God+is+concerning+man%3F+and+from+hence+grow+those+varieties+and+errors+in+worship+of+God.+And+though+haply+most+men%2C+knowing+the+true+God%2C+may+by+the+same+Light+of+Nature+concur+in+the+general+and+fundamentals+of+worship%2C+viz.+That+God+is+to+be+feared+with+all+reverence%2C+loved+with+all+intention%2C+obeyed+with+all+sincerity%2C+cheerfulness+and+exactness%3A+all+which+are+but+natural+conclusions+from+the+nature+of+God%2C+the+nature+of+Man%2C+and+the+relation+that+he+bears+to+God%2C+as+his+Creator%2C+Lord%2C+and+Preserver%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Matthew+Hale%2C+A+Discourse+of+the+Knowledge+of+God%2C+%26+of+Ourselves+I.+by+the+Light+of+Nature%2C+II.+by+the+Sacred+Scriptures+%28London%3A+1688%29%2C+pt.+1%2C+%E2%80%98By+the+Light+of+Nature%E2%80%99%2C+ch.+5%2C+pp.+87-88&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F43fbd6a599.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/43fbd6a599.html">Pe

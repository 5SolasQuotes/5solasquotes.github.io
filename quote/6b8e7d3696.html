<main class="wrap"><figure class="quote" id="q-6b8e7d3696" data-kw="">
<blockquote><p>Although God is “an infinite and limitless ocean of substance” in which all pure perfections are unitedly and most simply contained, some of these perfections, according to our way of conceiving, are more essential, others existential, others attributal. So a question is proposed by philosophers, especially neo-Scholastics, namely about what the essence of God is, or what in God must be conceived after the likeness of essence. … The most perfect concept (namely the concept of all perfections simply at the highest level), which Scotus is speaking of, seems to express what is commonly called the physical essence of God. But a simpler and more perfect concept (because it does not seem to be merely a description by accumulation of perfections) is that of infinite being. This notion expresses essential or quidditative perfection rather than existential perfection; but from-itselfness or necessary existence, like from-anotherness or possible existence, express existential modes. Further, this notion of infinite being satisfies perfectly the three requisites of metaphysical essence, namely that: … 3) It is as it were the root from which the rest of the perfections flow. But, as Scotus well said, “of all the concepts conceivable by us, this one (of infinite being) includes virtually more things,” namely “every perfection simply under the idea of the infinite.” It is more difficult or impossible to prove immediately from any other perfection, as the perfection of from-itselfness, all other attributes or perfections, as unicity, intelligence, life etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), pp. 93-95</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-35ced3f6a9" data-kw="">
<blockquote><p>In his comprehensive series of disputations on creation that were originally held in 1638-1639, Voetius does not omit a discussion on how creation took place. In this context not much attention is given to the issue of the six days as such (although the work of creation is explained in its six days order), but Voetius maintains that creation took place in six days. He therefore rejects the ancient theory that the world was created at once (in instanti).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aza-goudriaan.html">Aza Goudriaan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 3.1 ‘Creation in 6 Days’ in ch. 2, ‘Creation, Mosaic Physics, Copernicanism &amp; Divine Accommodation’ in Reformed Orthodoxy and Philosophy, 1625-1750: Gisbertus Voetius, Petrus Van Mastricht, and Anthonius Driessen Pre (Boston: Brill, 2006), pp. 105-13, p. 105</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-0c7c550bcb" data-kw="">
<blockquote><p>the Chaldeans are daily refuted. How many things I remember being said by the Chaldeans to Pompey, how many to Crassus, how many to Caesar himself; that none of them would die except in old age, except at home, except with clarity, so that it seems very strange to me that anyone still exists who believes those whose predictions he sees refuted daily by fact and events”; yet all of these were taken away by a violent death, which is confirmed by the examples of Julian the Apostate, Ludovico Sforza, Prince of Milan, Edward VI, King of England, the son of Cardanus, and others, to whom things far different from what had been predicted happened. Hence 10 emperors, princes, and lawgivers have forbidden this art of divining from the stars, and wise men and the fathers have disapproved of it. Maecenas, in Dio, bk. 52, Oration to Augustus, said that “diviners should not be tolerated in a republic.” Augustus expelled the astrologers from the city, Tiberius and Claudius from Italy; Vitellius also severely judged that they should be deprived of the world and of life. See Code, bk. 9, Tit. 18; bk. 2, 5, 7, and Tacitus, bk. 2, Annals, ch. 32, in whose judgment, “mathematicians are a race of men untrustworthy to the powerful, deceitful to the hopeful: which in our state will always be both forbidden and retained.” Cf. Valerius Maximus, bk. 1, ch. 3; Curtius, bk. 4, ch. 10; bk. 7, ch. 7. If an event has corresponded to some predictions, this should be attributed either to the shrewdness of the diviners, who had knowledge of the morals, counsels, and studies of those consulting them; or to the credulity of those consulting, who have turned fortuitous chances into the fulfillment of the thing predicted; or to the work of the devil, from whose suggestion or inspiration such prophets can draw many things; or to the just judgment of God, who chastises the vain minds of men with those mockeries, and permits the superstition of men to feel the scourge of Satan.</p></blockquo

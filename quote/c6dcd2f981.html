<main class="wrap"><figure class="quote" id="q-c6dcd2f981" data-kw="">
<blockquote><p>Subservient to God’s election of some is each covenant. The covenant of works to humble them, not only upon the consideration of their sins, whereby they have merited eternal death; but especially upon consideration how their natural corruption is so far from being mastered and corrected by the Law, as that on the contrary it is irritated and exasperated so much the more.

Then the covenant of grace to comfort them, considering how the condition of life is adduced and tempered, being from exact and strict obedience changed into faith and repentance; but chiefly upon consideration that the word of this covenant is a word of power mastering their corruption, and enabling to perform faith, repentance, and Evangelical obedience in an acceptable manner unto the Lord.

Subservient to the purpose of reprobation may be the Law, only written in men’s hearts, which very obscurely, intimateth (if at all) any covenant made of everlasting life between God and man. Where the word is revealed, that in general comprehending both Law and Gospel, is subservient thereunto in the way of instruction and exhortation, and the like, thereby taking away all excuse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Mr. Cotton’s, Clearing certain doubts concerning predestination. Together with an examination thereof</cite>, (London: Andrew Crook, 1646), p. 262.</span></figcaption>

</figure><figure class="quote" id="q-327c36d75d" data-kw="">
<blockquote><p>Thesis 3. Many, being scrupulous, have erred with the term “predestination,” arguing it denotes election alone and is spoken just about good things—this despite the fact the Holy Spirit used the same term in speaking about evil things (Acts 4:23). This is because predestination of a thing is the determination of it to its end. But these people deny this is the sort of end that is the destruction of the reprobate (seeing that such is an evil thing) and further that the term “predestination” is applied wrongly to them. Answer. Though we concede it is indeed an evil thing with respect to those reprobate, still, with respect to God reprobating, which is their final destruction or end, he without doubt intends the declaration of his righteousness and power (Prov. 16:4; Rom. 9:17, 21–22). …

Thesis 8. The means tending to this end are effectual calling, justification, and sanctification, and the opposite for the reprobate: the privation of effectual grace, continuation in the state of condemnation, and just blinding and hardening, all which presuppose the Fall and condition of sin. We will deal with all this further in what follows.

Thesis 9. So, our adversaries charge us falsely that we establish predestination absolute in every way, because we say it is only absolute with respect to the impelling cause existing in man, or a cause differing from God’s good pleasure. This is because, if it were some impulsive cause that moved God toward this or that thing about to be done, thus God would be the cause who depends with respect to that cause by which he is moved. This is absurd. Furthermore, predestination is not absolutized from the end and means (as is clear in the preceding thoughts), because God, absolutely wise, wills nothing without an end. So he decreed to render sinners saved, so that he might manifest his grace in them with respect to his mercy, but to condemn the reprobate, so that he might manifest his glory in them under the concept of his justice. Nothing is without means. Thus, he decreed to save the faithful, but through and on account of Christ; and he decreed to condemn the reprobate, but on account of sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Theological Disputation De Divina Hominum Praedestinatione</cite>, (1643), with Johannes Maccovius Presiding and Johannes Fridericus Herbst Responding’, trans. R. M. Hurd in Mid-America Journal of Theology, no. 30 (2019), pp 89, 90.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election.html">Election</a></span></div>

</figure><figure class="quote" id="q-8817d6b4d7" data-kw="">
<blockquote><p>This same election took place, not on the basis of foreseen faith, of the obedience of faith, of holiness, or of any other good quality and disposition, as though it were based on a prerequisite cause or condition in the person to be chosen, but rather for the purpose of faith, of the obedience of faith, of holiness, and so on. Accordingly, election is the source of every saving good. Faith, holiness, and the other saving gifts, and at last eternal life itself, flow forth from election as its fruits and effects. As the apostle says, “He chose us” (not because we were, but) “so that we should be holy and blameless before him in love” (Eph. 1:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 9</span></figcaption>

</figure><figure class="quote" id="q-2c2e9da758" data-kw="election separation">
<blockquote><p>Election is the separation of some from others: “Many are called,” said Christ, “but few chosen” (Mt. 20:16); and Paul, “The election hath obtained it, and the rest were blinded” (Rom. 11:7). Hence Paul uses the verb heileto to designate election, which implies the separation of some from others: “God from the beginning hath taken out and separated you to salvation through sanctification of the Spirit and belief of the truth” (2 Thess. 2:13).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.10</span></figcaption>

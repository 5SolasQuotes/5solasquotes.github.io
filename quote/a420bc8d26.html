<main class="wrap"><figure class="quote" id="q-a420bc8d26" data-kw="">
<blockquote><p>4. Do all people who claim to have assurance of their own salvation have a right to do so? By no means. Many people claim that they are saved when they have no valid basis for such a claim. In particular, there are three classes of people who, if they claim to have assurance, are basing their claim on a foundation of shifting sand: (a) Legalists (also called Moralists), who trust in their own good works, good life, good character, “doing the best they can,” etc. (b) Formalists, who put their trust in the observance of external forms, ceremonies, and ordinances, such as church membership, baptism, the Lord’s Supper, etc.

(c) Emotionalists (including also all Mystics), who trust their own feelings and emotions, who somehow just “feel” they are saved, or who base their assurance on dreams, visions, or special direct revelations from God. All of the above are trusting in what the Scripture calls refuges of lies when they base their conviction of assurance of salvation on such grounds as these. In studying the true scriptural grounds of assurance we shall see the reason why this is so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Larger Catechism: A Commentary</cite>, ed. G. I. Williamson (Phillipsburg NJ: P&amp;R, 2002), p. 186.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-600f2829ab" data-kw="">
<blockquote><p>Faith and assurance are then still found as it pertains to the root, the ground, the state, and the possession of it, as well as to some of the activities that flow from that possession, but not as it pertains to the outflow and influence of the manifestation and assurance, the emotions, the consolation, the joy and serenity, as it was experienced earlier. …

[T]his assurance of faith is not always present. For it can happen and often does, either as a consequence of impaired judgment or of various temptations and disturbances of the mind, that the one who truly believes and is justified before God by faith nevertheless thinks for a time – in keeping with what he feels – that he does not truly believe and is not reconciled with God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius-and-johannes-hoornbeeck.html">Gisbertus Voetius and Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Desertion</cite>, trans. John Vriend and Harry Boonstra, ed. M. Eugene Osterhaven (1659; Grand Rapids MI: Reformation Heritage Books, 2003), p. 37.</span></figcaption>

</figure><figure class="quote" id="q-685f4674f0" data-kw="">
<blockquote><p>These good works, done in obedience to God’s commandments, are the fruits and evidences of a true and lively faith; and by them believers manifest their thankfulness, strengthen their assurance, edify their brethren, adorn the profession of the gospel, stop the mouths of the adversaries, and glorify God, whose workmanship they are, created in Christ Jesus thereunto, that having their fruit unto holiness they may have the end eternal life.</p></blockquote>

</figure><figure class="quote" id="q-11ff0d4a49" data-kw="">
<blockquote><p>This infallible assurance does not so belong to the essence of faith, but that a true believer may wait long, and struggle with many difficulties before he be partaker of it; yet being enabled by the Spirit to know the things which are freely given him of God, he may, without extraordinary revelation, in the right use of means, attain thereunto: and therefore it is the duty of every one to give all diligence to make his calling and election sure, that thereby his heart may be enlarged in peace and joy in the Holy Spirit, in love and thankfulness to God, and in strength and cheerfulness in the duties of obedience, the proper fruits of this assurance; so far is it from inclining men to looseness.</p></blockquote>

</figure><figure class="quote" id="q-6ec4f2af8a" data-kw="">
<blockquote><p>True believers may have the assurance of their salvation divers ways shaken, diminished, and intermitted; as, by negligence in preserving of it, by falling into some special sin which woundeth the conscience and grieveth the Spirit; by some sudden or vehement temptation, by God’s withdrawing the light of his countenance, and suffering even such as fear him to walk in darkness and to have no light: yet are they never utterly destitute of that seed of God, and life of faith, that love of Christ and the brethren, that sincerity of heart, and conscience of duty, out of which, by the operation of the Spirit, this assurance may, in due time, be revived; and by the which, in the meantime, they are supported from utter despair.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 18.4</span></figcaption>

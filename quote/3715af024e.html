<blockquote><p>…yet when Jehovah appeared in that flaming bush, the text says, Ex. 3:6, that Moses hid his face, for he was afraid to look upon God; holy Moses could not bear that glory.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-268fbb81ca" data-kw="">
<blockquote><p>And can a man devise to tear the majesty of our Lord Jesus Christ and to deface his glory more than by the things that the Papists do? Behold, they paint and portray Jesus Christ, who (as we know) is not only man, but also God manifested in the flesh: and what a representation is that? He is God’s eternal son, in whom dwells the fulness of the Godhead, yea even substantially. Seeing it is said, substantially, should we have portraitures and images whereby the only flesh may be represented? Is it not a wiping away of that which is chiefest in our Lord Jesus Christ, that is to wit, of his divine majesty? Yes: and therefore whensoever a crucifix stands mopping and mowing in the Church, it is all one as if the Devil had defaced the Son of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Deuteronomy</cite>, The Sermons of… Calvin upon the Fifth Book of Moses… (London: Middleton, 1583), Sermon 23, the 5th upon Dt. 4, p. 138</span></figcaption>

</figure><figure class="quote" id="q-a14e2c7a2f" data-kw="">
<blockquote><p>…will I join a most godly ancient bishop, whose Greek epistle being sent to John, bishop of Jerusalem, Jerome did translate into Latin; his name is Epiphanius. The words of the epistle are these: ‘…Wherein we do learn all these godly lessons: First, that no place ought to be given in the church of Christ to those things that are against the authority of the holy Scriptures. Secondly, that to give place in the church of Christ unto images, it is against the authority of the holy Scriptures, that is, of that law, which says: Thou shalt not make to thyself any graven image. Thirdly that not only graven and molten images, and such as be set up on high, upon or over the altars, but also the painted images ought to be cast out of the churches. Fourthly that the image of Christ Himself ought in no wise to stand in the church, because that of all other it is most perilous and breeds the greatest idolatry. Fifthly that the images ought to be caste out of the church of Christ, not only by sedulity and diligence of doctrine, but also by very fact and deed. Sixthly, that they ought not coldly, but with a fervent and earnest zeal of the true religion be put done, defaced, and broken all to pieces, as we do see this holy man of God Epiphanius to have rent and torn in pieces the vail that had the image of Christ painted, which he did being moved with the zeal of God. Seventhly, that it is the part and duty of bishops, to see that images be not set up in the church of Christ. Last of all, that it is a mere scrupulosity and superstition, unseemly for the church and the faithful people of God to have images.’ Here may we see that this godly ancient bishop did much differ in judgment from those fond persons that think it to be a profitable thing for the people of God to have images standing in the churches. Let them weigh these things that have always the fathers in their mouths, and so let them learn that it is more honesty for us to be called iconoclastae, that is, image breakers, than to be called iconoplastae, that is, image makers, and that we do approach nearer to the example of the old ancient church than they do, although they brag and boast themselves to be catholic and apostolic.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-veron.html">John Veron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Strong Battery against the Idolatrous Invocation of the Dead Saints, and Against the having or setting up of Images in the House of Prayer or in any other place where there is any peril of iIolatry</cite>, … (London: Sutton, 1562), pp. 92-93</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-8f75f43af8" data-kw="">
<blockquote><p>Obiection 2: Secondly, Christ took on Him man’s nature; He became man like to us: therefore, say some, He may be resembled, and an image of Him may be made. Question: How is this to be answered? Answer: Thus, Christ being both God and Man, the chief thing that makes him Christ is his Godhead, and that cannot be expressed by an image; and therefore an image made to resemble whole-Christ must needs be a living image, leaving out the chief part of Christ, which is his Godhead: so that an image made of Christ, either separates his Godhead from his manhood, or else it makes his Godhead to be such as may be circumscribed: both which are gross errors; therefore there may no image of Christ be made. Objection 3: May not Christ as well be painted with colors as set before us with words in a sermon? Question: How is this to be answered? Answer: No: the one God allows in his Word, namely the describing of Christ in speech, in the preaching of the Word and administration of the sacraments, but not the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-elton.html">Edward Elton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s Holy Mind Touching Matters Moral which Himself Uttered in Ten Words, or Ten Commandments. Also Christ’s Holy Mind touching Prayer</cite>, … (d. 1624; London: Robert Mylbourne, 1625), God’s Holy Mind touching matters Moral, which Himself uttered in Ten Words, or Ten Commandments…, p. 30</span></figcaption>

<blockquote><p>More than this cannot be sought at the hands of God or Christ. The Virgin Mary is to her worshippers what Christ is to us. She is the object of all religious affections; the ground of confidence; and the source whence all the blessings of salvation are expected and sought.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3 (Mariolatry)</span></figcaption>

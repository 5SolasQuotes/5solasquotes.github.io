<blockquote><p>6. Our prayers unto God should be joined with submissiveness of spirit, self-denial and hopeful dependance on God: for so much does the gesture of lifting up of the hands in prayer of its own nature signify, and therefore here the gesture is put for the prayer, which should be joined with such an inward disposition; ‘Let the lifting up of my hands be as evening sacrifice.&#x27;</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-40215b5bd6" data-kw="">
<blockquote><p>And as for his [Jesus’] gesture in teaching, that He sat down, it was their custom in these times, and a testimony of the respect that is due to them that carry the mind of God; and we find Christ sometime[s] preach[ing] sitting, Lk. 4:20-21, sometime standing, Jn. 7:37, and at this time his weariness with night watching might call for it. Nor is it much to be stood upon which of these gestures men use in preaching, but preachers ought in these things [to] accommodate themselves to seek the benefit of hearers and that they be heard and seen by them.</p></blockquote>

%20decent%20gesture%20they%20desire&amp;text=VI.%20If%20any%20member%20of%20this%20Church%20do&amp;text=receiving%20it%20in%20any%20decent%20gesture%20they%20desire" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4. It is granted [by the most sober nonconformists] not to be idolatrous. So Mr. [Paul] Baynes: ‘Kneeling is neither an occasion, nor by participation idolatry: Kneeling never bred bread-worship.’ (Christian Letters, Letter 24, p. 201) And [Richard Baxter]: ‘Our doctrine of the sacrament [that one is kneeling to God], known to all the world, does free us from suspicion of adoration in it.’ (Baxter, Christian Directory, p. 616) To these Mr. [John] Tombes [a baptist] adds (Theodulia, p. 256, etc.): ‘1. That the Papists adore not the bread at putting it into their mouths, but at the elevation [of it], it being inconsistent with their principles to worship that which is not above them.

2. That the worship of God not directed to a creature, but before it, as an occasional object of adoration to God, is not idolatry.

3. That yet in the Church of England the elements are not occasionally so, but [rather] the benefits of Christ in the Lord’s Supper [are]. And 4. Kneeling is not to the bread, but as the signification of an humble and grateful mind; as he shows from the rubric [in the Anglican Book of Prayer].’ (T. D., Jerubbaal, p. 41 &amp; Mr. [Zachary] Crofton‘s Answer, p. 28; [William] Ames, Fresh Suit, ch. 4, §4, p. 382; [William] Perkins, Cases) Fifthly, Those that do account it inconvenient, yet account it not to be unlawful. Thus Mr. [Thomas] Cartwright: ‘Kneeling in receiving the sacrament, being incommodious in its own nature, and made far more incommodious by Popish superstition, is not therefore so to be rejected that we should abstain from the sacrament (if we cannot otherwise be partakers of it), because the thing is not in its own nature unlawful.’ (Evangelical Harmony, on Lk. 22:14, etc. Second Reply, p. 262) So it’s said of the old non-conformists: ‘Kneeling at the sacrament was disliked by all, but yet thought tolerable, and that it might be submitted to by some of the most Learned.’ (Troughton, An Apology for the Nonconformists [1681], p. 90) From all which we may conclude with Mr. [Richard] Vines [a Westminster divine], that the posture being a circumstance of action, as well as the time and place, ‘is not of the free-hold of the ordinance’ (On the Sacrament, p. 102); and with Mr. [Richard] Baxter that those that think they must not receive kneeling, ‘think erroneously.’ (Sacrilegious Desertion, p. 19)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-williams.html">John Williams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London</cite>, (London, 1685), vol. 1, ‘The Non-Conformists’ Plea for Lay-Communion with the Church of England’, pp. 73-72 Williams (d. 1709) was an Anglican bishop.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><figure class="quote" id="q-fea30d9bc7" data-kw="">
<blockquote><p>And by this posture [lifting up his eyes] did [Christ] testify the heavenly and depending frame of his spirit. 4. Albeit the Lord know the most secret desires of the heart, and do respect and hear the very thoughts of his people, yet it is their duty, as they have opportunity, to make use of their tongue in prayer, that so they may do Him homage with the whole man, may, by that means (among others) excite their own affections in prayer and may edify others in their place and station, for some (at least) of these causes it is that Christ in prayer spake in the audience of his disciples, ‘He lift up his eyes, and said,’ and by his practice and example would teach us our duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-hutcheson.html">George Hutcheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Gospel of Jesus Christ, according to John</cite>, (London, 1657) | on Jn., 17:1</span></figcaption>

<main class="wrap"><figure class="quote" id="q-923e9c979d" data-kw="">
<blockquote><p>…there is a two-fold will of God; one that is revealed in Scripture, or the Law of Nature, and that is the Moral good that God approves and enjoins to us, rather than the will of God; this the Familists call the exterior or accidental will of God, because God’s will, as his essence, should have been entire and self-sufficient, though God had never revealed any such will to men or angels, yea though He had never made the world, or men, or angel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying</cite>, pp. 349-50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3f0a411569" data-kw="">
<blockquote><p>In vain [it is] to participate of those mysteries of our salvation, the body and blood of our Lord, till first by self-examination we have cast out the venom of our sinful doings by repentance and steadfast purposes of amendment. In a word, it is our sins unrepented that make void and ineffectual all the blessed means of grace and of the Spirit; by those it is we quench the Spirit, we grieve the Spirit, we resist the Spirit, we provoke the Spirit (1 Thess. 5:19; Eph. 4:30), and poison the blessed nature of life; so that all the conveyances of the Spirit are barren and unfruitful whilst they reflect upon hardened and impenitent hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sherlock.html">Richard Sherlock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Quakers’ Wild Questions Objected against the Ministers of the Gospel… with Brief Answers Thereunto... (London: Cotes, 1654) Sherlock (1612–1689) was an Anglican clergyman.</cite>, p. 155</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-394835e485" data-kw="">
<blockquote><p>1224. Rom. 9:18, ‘God has mercy on whom He will have mercy, and whom He will He hardens.’ Ch. 11:32, ‘God has concluded them all in unbelief, that He might have mercy upon all.’ The first place is concerning the most free will and power of God, who may have mercy on whom He please; his antecedent will reaches to all men, his consequent will is restrained to the believers and unbelievers, and so He will have mercy of the faithful, that they may be saved, but he justly punishes and hardens the unbelievers and wicked men who resist his grace freely offered unto them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-thaddaeus.html">Johannes Thaddaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reconciler of the Bible… (London: Miller, 1662) | Romans</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“1224. Rom. 9:18, ‘God has mercy on whom He will have mercy, and whom He will He hardens.’ Ch. 11:32, ‘God has concluded them all in unbelief, that He might have mercy upon all.’ The first place is concerning the most free will and power of God, who may have mercy on whom He please; his antecedent will reaches to all men, his consequent will is restrained to the believers and unbelievers, and so He will have mercy of the faithful, that they may be saved, but he justly punishes and hardens the unbelievers and wicked men who resist his grace freely offered unto them.”

— Johannes Thaddaeus, The Reconciler of the Bible… (London: Miller, 1662) | Romans">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1224.+Rom.+9%3A18%2C+%E2%80%98God+has+mercy+on+whom+He+will+have+mercy%2C+and+whom+He+will+He+hardens.%E2%80%99+Ch.+11%3A32%2C+%E2%80%98God+has+concluded+them+all+in+unbelief%2C+that+He+might+have+mercy+upon+all.%E2%80%99+The+first+place+is+concerning+the+most+free+will+and+power+of+God%2C+who+may+have+mercy+on+whom+He+please%3B+his+antecedent+will+reaches+to+all+men%2C+his+consequent+will+is+restrained+to+the+believers+and+unbelievers%2C+and+so+He+will+have+mercy+of+the+faithful%2C+that+they+may+be+saved%2C+but+he+justly+punishes+and+hardens+the+unbelievers+and+wicked+men+who+resist+his+grace+freely+offered+unto+them.%E2%80%9D%0A%0A%E2%80%94+Johannes+Thaddaeus%2C+The+Reconciler+of+the+Bible%E2%80%A6+%28London%3A+Miller%2C+1662%29+%7C+Romans&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F394835e485.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/394835e485.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=1224.%20Rom.%209%3A18%2C%20%E2%80%98God%20has%20mercy,his%20grace%20freely%20offered%20unto%20them." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-53e29e8e2c" data-kw="">
<blockquote><p>The will of God,¹ as to all things, must always be fulfilled, – because as the Almighty can do everything possible, so, when the divine will is determined for positing something in being with final determination, it will be; but to will that with will of being well-pleased is to will it with the last determination that can be posited on the part of the omnipotent will willing the effect into being; therefore, in respect of whatever effect God is thus willing, it will be. ¹ The Vatican editors say this is against Scotus’ doctrine, and they refer to Rep. IA d. 46 nn. 17-18, 12-14, and to nn. 7-8 here below. … 7. To the first argument [n.1] I say that although the saying of the apostle [1 Tim. 2:4] could be expounded with a distribution accommodated for all those who will be saved – yet it could much better be expounded of antecedent will, thus: ‘he wills to save all men and that all are saved’, namely as far as concerns his own part and by his antecedent will, forasmuch as he has given them natural gifts and right laws and common aids sufficient for salvation. 8. Just as of a king, establishing good laws and prefixing ministers to guard those laws, it could be said that he wills all his subjects to live peaceably and quietly, as far as in him, and yet, if he see someone being unjustly oppressed, it would not be necessary that the king at once involve himself, to make him live quietly, unless he were turned over to him by a complaint of fact (he does indeed antecedently will everyone to live peaceably and quietly, but he does not will everyone immediately so to live), – so I say in the matter at hand, that although God [does] not have a will of being well-pleased to save this person, yet he wills for him the common aids to salvation, by which he too can live sufficiently well and be saved; on account of which it can be said that, as far as is on his part, he wills all to be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-duns-scotus.html">John Duns Scotus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ordinatio, bk. 1, dist. 26-48 tr. Peter Simpson (2013 / 2023), dist. 46, Whether God’s Will of Good-Pleasure is always fulfilled? II. To the Principal Arguments</cite>, p. 197</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

ay+in+the+matter+at+hand%2C+that+although+God+%5Bdoes%5D+not+have+a+will+of+being+well-pleased+to+save+this+person%2C+yet+he+wills+for+him+the+common+aids+to+salvation%2C+by+which+he+too+can+live+sufficiently+well+and+be+saved%3B+on+account+of+which+it+can+be+said+that%2C+as+far+as+is+on+his+part%2C+he+wills+all+to+be+saved.%E2%80%9D%0A%0A%E2%80%94+John+Duns+Scotus%2C+Ordinatio%2C+bk.+1%2C+dist.+26-48+tr.+Peter+Simpson+%282013+%2F+2023%29%2C+dist.+46%2C+Whether+God%E2%80%99s+Will+of+Good-Pleasure+is+always+fulfilled%3F+II.+To+the+Principal+Arguments%2C+p.+197&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F53e29e8e2c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/53e29e8e2c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=The%20will%20of%20God%2C%C2%B9%20as%20to,he%20wills%20all%20to%20be%20saved." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e86649f96e" data-kw="">
<blockquote><p>Christ therefore as God willed and approved the gathering of the Jerusalemites to Himself and their obedience as a thing so intensely dear to Him and morally pleasing, as is the care of a hen for her chicks, which she cherishes and nourishes by the expansion of her wings, although the Jerusalemites held that blandishing invitation of the Savior as cheap; meanwhile He denied to the same the grace which would have most sweetly procured their most free obedience, with liberty unimpaired, which is an invincible argument that God decreed that their obedience should never exist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Scholastic Disputation on Divine Providence, chs. 1-10 tr. by AI by Onku (Edinburgh, 1649), ch. 2. ‘What is the nature of the permissive will of God, and of the will of good pleasure and sign. The Remonstrants, Arminians are called to the discussion’ Latin</cite>, p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>That from that time henceforth no sort of person of whatsoever quality or degree be permitted to speak or write against the said [National] Confession, this Assembly, or any act of this Assembly; and that under the pain of incurring the censures of this Kirk.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2719866a3b" data-kw="">
<blockquote><p>Right from the beginning of the Revolution [of 1688-1689], there was an awareness by elements of the Societies’ leadership that the age of protests and remonstrances had come to an end and had been replaced by one of deft diplomatic manoeuvres and influencing outcomes. Instead of directly petitioning Orange for a Covenanted settlement, the Societies would renew the Covenants themselves in early March I689 and press other presbyterians to accept a Covenanted settlement through negotiation. Ultimately, that strategy failed. The pursuit of a Covenanted settlement within the fractured denominational landscape of post-Revolutionary Scotland was unrealistic, and in I69o, Shields, Boyd and Linning would lead the majority of the Societies to accept a uncovenanted presbyterian settlement of the Church under protest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-jardine.html">Mark Jardine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The United Societies: Militancy, Martyrdom &amp; the Presbyterian Movement in Late-Restoration Scotland, 1679 to 1688 PhD diss. (Univ. of Edinburgh, 2009), Conclusion</cite>, pp. 235-36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-c02d3587ac" data-kw="">
<blockquote><p>But because he conceives the dissenting churches to be true churches also, their ministers generally men of real piety, good learning, and zealously active to save immortal souls… And… because he finds the discipline of the Established Church defective… on the other hand [he] finds the preaching of the dissenting ministers generally more close, methodical, and lively; their ministrations more pure, without those human mixtures… the power of practical religion is more visibly kept up among them… These, and other considerations of the like nature, determine him to hold stated communion with some dissenting congregation, where he thinks himself better edified than in the parochial assemblies. He judges himself obliged to get the best helps he can for his soul, and thinks he ought not to be more restrained in the choice of a spiritual guide for the benefit of his soul than he is in the choice of a lawyer or physician for the preserving of his estate and bodily health.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-owen.html">James Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Moderation a Virtue, or, The Occasional Conformist Justified from the Imputation of Hypocrisy… (London: Baldwin, 1703), pp. 11-12 Owen (1654-1706) was an English, congregationalist puritan.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

senting%20churches%20to&amp;text=the%20preserving%20of%20his%20estate%20and%20bodily%20health" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-918b01b664" data-kw="">
<blockquote><p>And for the command, ‘Come out from among them and be ye separate,’ it’s pity that any Christian should need to be told that it speaks only to the Church to come out of the heathen, infidel world (such as are Jews and Mohammedans, and heathens); but there is never a word in all the Bible that bids you ‘Come out of the Church and be ye separate!’ Wonderful! that God should be so abused by misunderstanding Christians! Because He commands men to come out of the infidel world into the Church, they plead it as if He commanded them to come out of the Church into a separated sect. The Church is the House of Christ: Forsake it not, while he stays in it: Forsake it not, for He has promised never to forsake it. Particular Churches indeed he may cast off, but never the universal: Dwell therefore where He dwells.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Catholic, &amp; Catholic Church Described… (London: A.M., 1660)</cite>, pp. 205-6</span></figcaption>

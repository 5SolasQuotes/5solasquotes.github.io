<main class="wrap"><figure class="quote" id="q-66b7d80cb8" data-kw="">
<blockquote><p>A particular church, gathered and completely organized according to the mind of Christ, consists of officers and members; and the officers appointed by Christ to be chosen and set apart by the church (so called and gathered), for the peculiar administration of ordinances, and execution of power or duty, which he intrusts them with, or calls them to, to be continued to the end of the world, are bishops or elders, and deacons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 26.8</span></figcaption>

</figure><figure class="quote" id="q-636237e129" data-kw="">
<blockquote><p>If &quot;elders&quot; and &quot;bishops&quot; be not the same persons, having the same office, the same function, and the same duties, and the same names, it is impossible, So far as I understand, how it should be expressed: for these elders are they whom the Holy Ghost made bishops, they were many of them in the same church, their duty it was to attend unto the flock and to feed the church, which comprise all the duties, the whole function of elders and bishops; which must therefore be the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Nature of a Gospel Church and Its Government</cite>, ch. 4 (Works 16)</span></figcaption>

</figure><figure class="quote" id="q-0d368330bf" data-kw="">
<blockquote><p>In the churches, we know that there were many ἐπισκοποι (Acts 20:17, 28; Phil. 1:1), and this work of overseeing was specifically charged to the πρεσβυτεροι (Acts 20:17, 28; 1 Tim. 3:1–7; 5:17; Titus 1:5, 7; 1 Pet. 5:1–3). In line with this, Peter also calls himself an elder (πρεσβυτερος, 1 Pet. 5:1). Of a special institution of the episcopate alongside the presbyterate, accordingly, the New Testament knows nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 4</cite>, §502</span></figcaption>

<main class="wrap"><figure class="quote" id="q-534cd63b5e" data-kw="">
<blockquote><p>Shall there be no difference in the examination of the Elect and the Reprobate? Yes. For, 1. The Elect shall not have their sins, for which Christ satisfied, but only their good works, remembered. 2. Being in Christ, they and their works shall not undergo the strict trial of the Law simply in it self; but as the obedience thereof doth prove them to be true partakers of the grace of the Gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, Divinity 8th, ed. (London: R. J.; Jonathan Robinson; A. and J. Churchill; J. Taylor; J. Wyatt, 1702), 468.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state.html">Judgment and the Final State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8872bfd394" data-kw="">
<blockquote><p>Although pardon of sin be compleated at that great day, yet this is not to be understood, as if Gods pardon of any sin were imperfect, and something of sinne did still remain to be done away. No, those expressions of forgivenes of sin in the Scripture, denote such a full and plenary pardon, that a sin cannot be more remitted then it is. But because we commit new sinnes daily, and so need pardon daily, Therefore it is that we are not compleatly pardoned till then. As also because the perfect pardon we have here, shall then solemnly and publikely be declared to all the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, London, 1651, Lecture 29, pp. 258–259</span></figcaption>

</figure><figure class="quote" id="q-cb7c5fe5d9" data-kw="">
<blockquote><p>VII. Christ will be the judge in that very visible nature in which he was condemned for us. For although judiciary Power is common to the whole Trinity, still it will be specially exercised by the incarnate son. Judgment is said to have been given him by the father… as being the king of his church, the avenger of his elect, the most strict punisher of the wicked and rebellious, the Lord of all. The former belong to grace, the latter to power and both pertain the office of Mediator. This he will do especially both for the greater consolation of the pious (who will look upon him as their defender and Advocate instead of their judge) and for the greater terror and confusion of the wicked, while they will see him reigning gloriously whom they barbarously and cruelly persecuted. …XVII. Further, if it is asked here whether the sins of the pious equally as well as of the wicked will be revealed, we answer that the negative seems more probable to us. (1) On account of the judge, who, since he has been most fully satisfied for us and now intercedes for us in heaven, will then become as their Redeemer and Savior, not to reproach them for their sins, but to fulfill his promises in them and to manifest the wonders of his grace. (2) The process of the judgment is such that mention may indeed be made of good works, but not of their evil works…. The pious will not hear the publication of their sins, but the reward of their love and beneficence. (3) The gratuitous mercy of God does not wish our sins to be remembered anymore, but casts them behind its back. Now what God has once wished to be covered in this life, he will not reveal in the other. (4) If their sins were to be made known, it would lead to the disgrace and confusion of the pious from which they are to be free. For Christ will return for this and–that he may be glorious in his saints and be admired in believers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George Musgrave Giger, 3 vol. (Phillipsburg: P&amp;R Publishing, 1992–97), 3.599, 602 (20th topic, Q. 6).</span></figcaption>

</figure><figure class="quote" id="q-b099d3196c" data-kw="">
<blockquote><p>Shall men know one another in this eternal life? Yea verily, for they shall be full of the Holy Spirit, and of wisdom, as Adam before his Fall, keeping as then the integrity of God’s image, acknowledged Eve, whom he had never seen, and whence she was, being told of no man, Gen. 2:23. As Peter on the mountain, receiving only a certain taste of life-eternal in his mortal body, knew by inward revelation Moses and Elias, whom he never saw, Mt. 17:3-4, yet this shall not be a carnal, but a spiritual knowledge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, ... (London, 1610), ch. 39, ‘Of Eternal Life’, p. 488</span></figcaption>

<blockquote><p>The resurrection of souls pertains to merit, which is the effect of justification; but the resurrection of bodies is ordained for punishment or reward, which are the effects of Him who judges. Now it belongs to Christ, not to justify all men, but to judge them: and therefore He raises up all as to their bodies, but not as to their souls.</p></blockquote>

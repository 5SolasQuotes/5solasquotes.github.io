<main class="wrap"><figure class="quote" id="q-1cc8942230" data-kw="">
<blockquote><p>Although Codex Alexandrinus was not published until 1786, various Westminster Divines had access to either the manuscript itself or collations of its readings. It is extensively cited in the ‘Westminster Annotations’ (a Bible commentary commissioned by the same Parliament that summoned the Westminster Assembly), while leading Westminster Divine Thomas Goodwin preferred its readings to the TR in a number of places in his published Works. The enthusiastic – and uncontroversial – use of this new manuscript by these Divines is one strand of evidence that, contrary to modern claims, Westminster Confession of Faith (and London Baptist Confession) 1:8 do not require the use of the Textus Receptus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-steele.html">Stephen Steele</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Westminster Divines &amp; the Alexandrian Codex’</cite>, (2023)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-0e132c236f" data-kw="">
<blockquote><p>There was a certain Count of your [Reformed] confession who possessed common jurisdiction in a certain church with a certain Prince of our [Lutheran] religion. Therefore since the Associate was judging that he [the reformed Count] had more of right in that church, he made sure that the altar was destroyed and that a table be built [for the Lord’s Supper] in the temple [church building]. The Prince found out later about this, and ordered that the table be removed and an altar be constructed again. The Count in return took care a second time in return that the altar be destroyed, and the table restored. The Prince likewise a second time ordered that the table be taken away and the altar restored. I do not know whether this happened a third time. But the [reformed] Count later heeded the [Lutheran] Prince’s strictness, and left off from his course, such that the altar remained in the temple in place of the table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jacob-andreae.html">Jacob Andreae</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism</cite>, (Concordia Publishing House, 2017), ch. 4, ‘On the Reformation of Temples, Images &amp; Organs’, p. 497 Andreae (1528–1590) was a leading Lutheran theologian debating Theodore Beza.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

0in%20place%20of%20the%20table&amp;text=There%20was%20a%20certain%20Count%20of%20your%20%5BReformed&amp;text=in%20the%20temple%20in%20place%20of%20the%20table" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ab6f29151c" data-kw="">
<blockquote><p>But I hope the parliament will observe this great principle you were first acted by, and still are in all your Church-way, and will see how dangerous the tolerating of your way will be; for though you should for present hold nothing much different from the established rule, yet being allowed what may you not come to; according to this principle, how shall any State be sure of you long what you will hold: What if you should bring in community of goods, baptizing in rivers, the holy kiss into your assemblies at the beginning and ending of your ordinances, anointing sick persons with oil? It is but according to your principle: And we see you make so much of this principle and are so in love with it, that you wish it next to your first principle, enacted as the most sacred Law of all other[s], to live and walk by it in Christian States and Churches throughout the world;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge, members of the Assembly of Divines wherein is Handled Many of the Controversies of These Times</cite>, [the Independents] Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge… (London, 1644), p. 86</span></figcaption>

ne · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8483e69a21" data-kw="">
<blockquote><p>First, the power claimed by the governors of the Christian Church is not an arbitrary or capricious authority, to be wielded at will by them, in disregard of the rights or consciences of the members. There are certain limitations of a most important nature affixed to that power, and certain principles of a definite kind laid down for the use and administration of it, which set bounds round about it, and bring it into harmony with the liberty of conscience, rightfully belonging to every private individual of the Christian society. … 3rd. Church power is limited by the rule prescribed for its exercise, or by the Word of God. This third limitation ties down the administration of Church power to certain fixed principles and a certain definite law, and excludes the possibility of its becoming a wayward and arbitrary authority, to be wielded at the will or caprice of man. It forbids the unauthorized addition or subtraction of anything in the constitution, doctrine, worship, or discipline of the Church, such as Christ has not sanctioned in His Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ</cite>, vol. 1 (Edinburgh, 1868), pp. 241-2, 248</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

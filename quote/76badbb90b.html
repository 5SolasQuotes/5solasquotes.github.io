<main class="wrap"><figure class="quote" id="q-76badbb90b" data-kw="">
<blockquote><p>…he [Paul] speaks of many special positive precepts and rules of policy, as of poor widows, the alms to be given to them; the not rebuking of an elder, the office of elders governing, and of elders laboring in the Word and doctrine, the not receiving an accusation against an elder, but under two or three witnesses, the public rebuking of those who offend publicly, the not admitting to the ministry raw and green soldiers not tried, and many other particulars of policy, of all which he says gravely, [1 Tim. 5] v. 21, ‘I charge thee before God and the Lord Jesus Christ, and the elect angels, that thou observe these things, etc.’ Certainly, [in Greek] these things were not one commandment, but all the precepts of faith and of Church-Government spoken of in this epistle; and truly I shall think that Paul who particularizes that Timothy should not drink water, but a little wine because of his infirmity, and of bringing with him the cloak that he left at Troas, and the parchments, 2 Tim. 4, does far more specify all the positives of policy and writ how all the Timothies and pastors are to behave themselves in the Church of God… … …for other positive things of policy that should be of perpetual use, and not all of the same kind, and of equal necessity…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646), Introduction, Section 1</cite>, pp. 11-12</span></figcaption>

0%5BPaul%5D%20speaks%20of%20many%20special,same%20kind%2C%20and%20of%20equal%20necessity%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4cf11c097b" data-kw="">
<blockquote><p>As for the prelate, who is pretended to be the pastor of pastors and an ecclesiastical creature, having majority of power, both of order and jurisdiction above the pastor and doctor, the Church of Scotland did ever repute such an one the fifth element, and the sixth finger in the hand, as having no warrant in the Word, and therefore unlawful, Ex. 25:9; Heb. 8:5; 1 Chron. 8. 19. 11, 12, 13; 1 Kings 6:38, as also expressly condemned, Lk 22:24-26; 1 Pet. 5:3-4; Mt. 18:18; 1 Cor. 5:4-6; Acts 1:23; 15:24. In the first constitution and infancy of our Church there were some visitors and superintendents for planting of churches, because breasts and hair of our churches were not grown, after the example of the apostles, who sent such to plant and visit churches, and appoint elders in congregations, Acts 8:14-16; 13:14-16; 14:23; Tit. 1:5-9; 21:17-18, but after the Church was planted there was no need of such. Titular doctors, who were pastors only, and taught not in the schools, but were only previous dispositions to episcopacy, as [the] blue color prepares a cloth for purple, our Church never allowed, upon the grounds allowing lawful doctors, as the Scripture does, Rom. 12:7-8; 1 Cor. 12:28; Eph. 4:11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea… (1642), ch. 20, 2nd Article, ‘Officers of the Church’</cite></span></figcaption>

</figure><figure class="quote" id="q-9c118d4939" data-kw="">
<blockquote><p>2. A representative Church may be thought a number sent by a community and elected to give laws absolutely tying, as if believers should say, ‘We resign our faith and conscience to you, to hold good whatever you determine without repeal or trial;’ that is blind faith; that we disclaim: all our rulers’ acts in our assemblies do bind, 1. conditionally, if they be lawful and convenient, 2. matters to be enacted are first to be referred to the congregations and elderships of particular congregations before they be enacted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea... (1642), ch. 7</cite>, p. 83</span></figcaption>

— Samuel Rutherford, A Peaceable &amp; Temperate Plea... (1642), ch. 7, p. 83">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+A+representative+Church+may+be+thought+a+number+sent+by+a+community+and+elected+to+give+laws+absolutely+tying%2C+as+if+believers+should+say%2C+%E2%80%98We+resign+our+faith+and+conscience+to+you%2C+to+hold+good+whatever+you+determine+without+repeal+or+trial%3B%E2%80%99+that+is+blind+faith%3B+that+we+disclaim%3A+all+our+rulers%E2%80%99+acts+in+our+assemblies+do+bind%2C+1.+conditionally%2C+if+they+be+lawful+and+convenient%2C+2.+matters+to+be+enacted+are+first+to+be+referred+to+the+congregations+and+elderships+of+particular+congregations+before+they+be+enacted.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Peaceable+%26+Temperate+Plea...+%281642%29%2C+ch.+7%2C+p.+83&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9c118d4939.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9c118d4939.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/the-ruling-of-the-church#:~:text=2.%20A%20representative%20Church%20may%20be,particular%20congregations%20before%20they%20be%20enacted." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c1164c614a" data-kw="">
<blockquote><p>It is obvious that the Puritans, who obtained the charter of the Massachusetts Bay Company from Charles I and came to New England in 1630, were not Separatists. They, though being non-conformists, considered themselves as loyal members of the Church of England. Secession or separation from the national church, for them, was a sin of schism. Nevertheless, in less than seven years, Puritans in the mother country began to hear that their brethren in New England actually followed the ways of the Separatists. Accordingly, in 1637, a formal and written communication was made, in which Puritans in England put forward “Nine Propositions,” to which their “Reverend and beloved Brethren” in the New World replied in 1639. This early debate was compiled by Simeon Ash and William Rathband and, four years later, published with John Ball’s ‘Reply’, under the title ‘A Letter of Many Ministers in Old England’… The main purpose of these propositions was to find whether or not the New England brethren actually adopted the methods of the Separatists which they once denounced before they left England… Many ministers in Old England… were surprised at the rumor about their brethren’s sudden turn to Separatism. Particularly, they were frightened when they received a report that the above nine propositions were practiced by New Englander ‘as the only Church way, wherein the Lord is to be worshipped.’ Of course, this report seemed to be exaggerated. Thus, John Cotton, representing “the Elders of the Churches in New England,” provided an answer to this letter in which he assured them that New England Congregational churches had nothing to do with “the ways of rigid separation.”… Cotton’s above answer was sent to England in 1639 and Ball’s comments and reply were finished by 1640. For some reason, however, their works were not published until 1643.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Trial of the New-Church Way in New-England &amp; in Old… Sent Over to the New England Ministers, 1637, as a Reply to an Answer of Theirs in Justification of the Said Positions… IA (1640 &amp; 1643 / 1644) 90 pp.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-f2fe5b8374" data-kw="">
<blockquote><p>…therefore all the former circumstances, as they are clothed with either moral conveniency and expediency, or with some religious positive goodness, must be warranted by the Word of God, or the rules of sinless and spiritual prudence, which cannot deviate from the Word of God… And as touching things of prudence, they are things properly mixed, as at what hour sermon shall begin in such a church, at eight, or nine, or ten of the clock; how the worship shall be ordered, whether you should begin the worship with a word of prayer, or a word of praising, or a word of exhorting to stir up for the duty of the day, is a matter of prudence; and because God has not laid the band of a precept on us, to begin with either of the three; therefore it would seem, that though the things themselves be moral, and must be warranted by a Word of God; yet the order is not moral, but prudential, and so cannot fall under a command of the Church; For to me it is hard that men and the Church should lay on a tie or bond of a precept where God has laid on no such bond; The Church, in these mixed things, where the morality is not clear, at farthest can but go on to directive advices, as Paul does, 1 Cor. 7:6,12, not to [the] imposing of laws, nor to injunctions or commandments under the pain of Church-censures; for Christ must bind and ratify in Heaven all Church-censures on earth, and so the Church cannot command nor censure but as Christ Himself would command or censure.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>
<div class="actions"><button class="copy" data-copy="“…therefore all the former circumstances, as they are clothed with either moral conveniency and expediency, or with some religious positive goodness, must be warranted by the Word of God, or the rules of sinless and spiritual prudence, which cannot deviate from the Word of God… And as touching things of prudence, they are things properly mixed, as at what hour sermon shall begin in such a church, at eight, or nine, or ten of the clock; how the worship shall be ordered, whether you should begin the worship with a word of prayer, or a word of praising, or a word of exhorting to stir up for the duty of the day, is a matter of prudence; and because God has not laid the band of a precept on us, to begin with either of the three; therefore it would seem, that though the things themselves be moral, and must be warranted by a Word of God; yet the order is not moral, but prudential, and so cannot fall under a command of the Church; For to me it is hard that men and the Church should lay on a tie or bond of a precept where God has laid on no such bond; The Church, in these mixed things, where the morality is not clear, at farthest can but go on to directive advices, as Paul does, 1 Cor. 7:6,12, not to [the] imposing of laws, nor to injunctions or commandments under the pain of Church-censures; for Christ must bind and ratify in Heaven all Church-censures on earth, and so the Church cannot command nor censure but as Christ Himself would command or censure.”

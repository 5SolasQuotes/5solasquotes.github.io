<blockquote><p>Those whom God effectually calls, he also freely justifies, not by infusing righteousness into them, but by pardoning their sins, and by accounting and accepting their persons as righteous; not for anything wrought in them, or done by them, but for Christ&#x27;s sake alone; not by imputing faith itself, the act of believing, or any other evangelical obedience to them, as their righteousness; but by imputing Christ&#x27;s active obedience unto the whole law, and passive obedience in his death for their whole and sole righteousness by faith, which faith they have not of themselves; it is the gift of God.</p></blockquote>

</figure><figure class="quote" id="q-7cb199e3ab" data-kw="Forensic">
<blockquote><p>The Hebrew word to which the Greek dikaioun answers and the Latin justificare, is used in two ways in the Scriptures—properly and improperly. Properly the verb is forensic, put for “to absolve” anyone in a trial or “to hold” and to declare “just”; as opposed to the verb “to condemn” and “to accuse” (Ex. 23:7; Dt. 25:1; Prov. 17:15; Lk. 18:14; Rom. 3–5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 16.1.4</span></figcaption>

<main class="wrap"><figure class="quote" id="q-0902f1baa4" data-kw="">
<blockquote><p>goodness (bonitas) is that act of the divine will, by which he is disposed to self-communication. Love (amor), that by which God is moved toward created things and bestows blessings on them. Grace (gratia), that by which God is moved to communicate himself to creatures of his own accord, not on grounds of merit or debt. Mercy (misericordia) is the disposition of the divine will to help the wretched, not because of any external cause, but solely of the divine goodness. Hatred (odium) in God indicates either the disapproval of sin, or the will to punish sinners that follows sin, or the denial of those salutary benefits that flow from the divine will. Longing (desiderium) in God indicates that the obedience of human beings is exceedingly pleasing to him, and not without future reward. Hope and expectation (spes et expectatio) in God signify that something is owed. God is said to rejoice (gaudere) when something is pleasing to him. Dread (metus) is something attributed to him, in order to indicate that he desires to prevent evil. Sorrow (tristia) in God indicates something that is exceedingly displeasing to God and contrary to his virtues.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-rijssen.html">Leonard Rijssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as translated in Richard Muller, Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3, ch. 6.3, Divine Affections &amp; Virtues, A. General Considerations, 3. Doctrinal Conclusions</cite>, pp. 560-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-533414df6f" data-kw="">
<blockquote><p>God shows here, by his prophet, that He was constrained by urgent necessity to deal sharply and roughly with the people. Nothing, we know, is more pleasing to God than to treat us kindly; for there is not found a father in the world who cherishes his children as tenderly: but we, being perverse, suffer Him not to follow the inclination of his nature. He is therefore constrained to put on, as it were, a new character, and to chide us severely, according to the way in which He here says, He had treated the Israelites; ‘I have cut them,’ He says, ‘by my prophets, and killed them by the words of my mouth.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hosea</cite>, 6:5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-9e10921dfd" data-kw="">
<blockquote><p>I. How God delights not in the death of a sinner… If God has more pleasure in the conversion of sinners than their destruction, why are there not more converted than we find to be? The greatest part of mankind are perishing in their unbelief and impenitency. Answer: (1) I might answer, that this text speaks not absolutely, but comparatively. God rejoices in the execution of his justice, as well as in all his other works; but if you compare things with things, He rejoices rather in acts of mercy than in acts of vengeance. His disposition inclines Him to mercy rather than to wrath: ‘Mercy pleases Him,’ Mic. 7:18; and mercy rejoices over judgment in the conflict. Justice is alienum opus, ‘his strange work,’ Isa. 28:21; Lam. 3:33, ‘He does not afflict willingly, nor grieve the children of men;’ not with his heart. Mercy, like live honey, drops of its own accord. He is forced to the other [judgment]; it [judgment] is wrested from Him. Though the properties are equally infinite in God, yet they do diversely exert themselves towards men as to the effects. Now the world is upon its trial. God’s primary end is the conversion of a sinner; his secondary end the honor of his vindictive justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works, vol. 21, Two sermons on Eze. 18:23</cite>, pp. 463-79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

ead it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4e53e27cae" data-kw="">
<blockquote><p>In God it [‘mercy’] notes his readiness to do good to the miserable, notwithstanding sin. The motion comes from within, from his own breast and bowels. For our God is pitiful and of tender mercy, James 5:11, and the act of it is extended and reached out unto the creature in seasonable relief. For the throne of grace was erected for this purpose, Heb. 4:11. Two things there are in mercy: First, a propension and inclination to commiserate the afflicted. Secondly, a ready relief and succour of them according to our power, affectus and effectus. First, there is a compassion or a being affected with the misery of others. This properly cannot be in God, in whom as there is no passion, so strictly speaking there is no compassion; yet something analagous there is, a taking notice of our misery. Something like a pity arising in his heart upon the sight of it; which the Scripture frequently ascribes to God, and we can best understand as we consider the divine perfections shining forth in the human nature of Christ. Ex. 2:24, ‘He heard their groaning;’ and Isa. 63:4, ‘In all their afflictions He was afflicted.’ Judges 10:16, ‘His soul was grieved for the misery of Israel.’ Forms of speech taken from the manner of men, who use to be thus affected when they see a miserable object. God in his simple and perfect nature cannot be said either to joy or grieve: but He carries Himself as one thus affected. Or these expressions were laid in aforehand to suit with the divine perfections as manifested in Christ, who is touched with a feeling of our infirmities. Secondly, mercy notes the actual exhibition of help and relief to the miserable…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>One Hundred &amp; Ninety Sermons on the Hundred &amp; Nineteenth Psalm… (London: T.P., 1681) | sermon 84, on Ps. 119:76, “Let, I pray thee, thy merciful kindness be for my comfort”</cite>, p. 512</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>XXVIII. From these things, however, it is now sufficiently clear that that vindicatory justice is not a free and arbitrary act that depends solely upon the will of God, but an essential property to the exercise of which the will, once sin is posited, is necessarily impelled. And indeed, if it befits the nature of God that He does not suffer him who repents of sin to perish, because He is good and clement, it will no less befit Him that He does not allow sin to go unpunished, because He is just; for as the former arises from a certain natural ῥοπῇ [inclination] and propensity of goodness and mercy toward repentance, so the latter also flows from a certain natural hatred and detestation of sin. Indeed, if we consider the matter accurately, the latter seems to be somewhat more fitting. For when He pardons sin, He does so out of a certain abundance of goodness, but He is bound by no right, by no law, to perform this; therefore, in that, He follows only the lead of his nature, while the creature has no merit. But in administering justice, besides that ῥοπῇ [inclination] of nature by which He inclines toward the hatred of sin, He also has regard for the order of which He is the guardian and avenger, and whose law, once enacted, He can by no means abrogate. Regarding the former, He sees no quality in the subject by which He could be moved to benefit it, or if He sees any, He sees one contrary to his holiness, and of such a kind that He could justly refrain from every benefit; but with respect to the latter, the subject, He sees it clothed in that quality which incites justice to exercise and propels it by a certain inevitable necessity, whence the act of mercy is plainly arbitrary if you abstract it from the decree, because it has no foundation in the subject concerning which it is exercised, whereas the act of justice is necessary, because it depends not only on the will, but on the very nature of God who punishes and the thing to be punished.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“XXVIII. From these things, however, it is now sufficiently clear that that vindicatory justice is not a free and arbitrary act that depends solely upon the will of God, but an essential property to the exercise of which the will, once sin is posited, is necessarily impelled. And indeed, if it befits the nature of God that He does not suffer him who repents of sin to perish, because He is good and clement, it will no less befit Him that He does not allow sin to go unpunished, because He is just; for as the former arises from a certain natural ῥοπῇ [inclination] and propensity of goodness and mercy toward repentance, so the latter also flows from a certain natural hatred and detestation of sin. Indeed, if we consider the matter accurately, the latter seems to be somewhat more fitting. For when He pardons sin, He does so out of a certain abundance of goodness, but He is bound by no right, by no law, to perform this; therefore, in that, He follows only the lead of his nature, while the creature has no merit. But in administering justice, besides that ῥοπῇ [inclination] of nature by which He inclines toward the hatred of sin, He also has regard for the order of which He is the guardian and avenger, and whose law, once enacted, He can by no means abrogate. Regarding the former, He sees no quality in the subject by which He could be moved to benefit it, or if He sees any, He sees one contrary to his holiness, and of such a kind that He could justly refrain from every benefit; but with respect to the latter, the subject, He sees it clothed in that quality which incites justice to exercise and propels it by a certain inevitable necessity, whence the act of mercy is plainly arbitrary if you abstract it from the decree, because it has no foundation in the subject concerning which it is exercised, whereas the act of justice is necessary, because it depends not only on the will, but on the very nature of God who punishes and the thing to be punished.”

— Francis Turretin, Disputations on the Satisfaction of Christ… (Geneva, 1666), Disputation 1, sect. 28 tr. AI at The Received Faith">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXVIII.+From+these+things%2C+however%2C+it+is+now+sufficiently+clear+that+that+vindicatory+justice+is+not+a+free+and+arbitrary+act+that+depends+solely+upon+the+will+of+God%2C+but+an+essential+property+to+the+exercise+of+which+the+will%2C+once+sin+is+posited%2C+is+necessarily+impelled.+And+indeed%2C+if+it+befits+the+nature+of+God+that+He+does+not+suffer+him+who+repents+of+sin+to+perish%2C+because+He+is+good+and+clement%2C+it+will+no+less+befit+Him+that+He+does+not+allow+sin+to+go+unpunished%2C+because+He+is+just%3B+for+as+the+former+arises+from+a+certain+natural+%E1%BF%A5%CE%BF%CF%80%E1%BF%87+%5Binclination%5D+and+propensity+of+goodness+and+mercy+toward+repentance%2C+so+the+latter+also+flows+from+a+certain+natural+hatred+and+detestation+of+sin.+Indeed%2C+if+we+consider+the+matter+accurately%2C+the+latter+seems+to+be+somewhat+more+fitting.+For+when+He+pardons+sin%2C+He+does+so+out+of+a+certain+abundance+of+goodness%2C+but+He+is+bound+by+no+right%2C+by+no+law%2C+to+perform+this%3B+therefore%2C+in+that%2C+He+follows+only+the+lead+of+his+nature%2C+while+the+creature+has+no+merit.+But+in+administering+justice%2C+besides+that+%E1%BF%A5%CE%BF%CF%80%E1%BF%87+%5Binclination%5D+of+nature+by+which+He+inclines+toward+the+hatred+of+sin%2C+He+also+has+regard+for+the+order+of+which+He+is+the+guardian+and+avenger%2C+and+whose+law%2C+once+enacted%2C+He+can+by+no+means+abrogate.+Regarding+the+former%2C+He+sees+no+quality+in+the+subject+by+which+He+could+be+moved+to+benefit+it%2C+or+if+He+sees+any%2C+He+sees+one+contrary+to+his+holiness%2C+and+of+such+a+kind+that+He+could+justly+refrain+from+every+benefit%3B+but+with+respect+to+the+latter%2C+the+subject%2C+He+sees+it+clothed+in+that+quality+which+incites+justice+to+exercise+and+propels+it+by+a+certain+inevitable+necessity%2C+whence+the+act+of+mercy+is+plainly+arbitrary+if+you+abstract+it+from+the+decree%2C+because+it+has+no+foundation+in+the+subject+concerning+which+it+is+exercised%2C+whereas+the+act+of+justice+is+necessary%2C+because+it+depends+not+only+on+the+will%2C+but+on+the+very+nature+of+God+who+punishes+and+the+thing+to+be+punished.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Disputations+on+the+Satisfaction+of+Christ%E2%80%A6+%28Geneva%2C+1666%29%2C+Disputation+1%2C+sect.+28+tr.+AI+at+The+Received+Faith&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb444816480.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b444816480.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=XXVIII.%20From%20these%20things%2C%20however%2C%20it,and%20the%20thing%20to%20be%20punished." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

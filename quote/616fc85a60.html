<main class="wrap"><figure class="quote" id="q-616fc85a60" data-kw="">
<blockquote><p>…a negative separation, that is, a non-communion with the Church in a lawful and commanded worship is unlawful… For the antecedent [above] I shall refer you to all that write against the Separation, who generally distinguish separation into Negative and Positive; Negative, is a non-communion in ordinances. Positive, when we gather and grow into another body, and they conclude them both to be unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want of Church-Government… (London, 1650)</cite>, p. 41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0fa862c215" data-kw="">
<blockquote><p>As for the Sanquhar declaration [1680], in so far as it denies the king’s authority and declares a war against him, it is a mere madness… it is no Christian duty to debate about these and the like things, and for such causes to raise a schism. Oh how sad is it that so many do place godliness in maintaining the Sanquhar declaration, and in separating from them who in their judgment are not so zealous in these or other circumstances. I admonish them to cease from these and such like courses, if they be lovers of Christ and his cause and love not their own bodily and spiritual ruin. I pray therefore, do not make such feckless things grounds of schism; do not I pray stain piety with such a blot. Why do you sport with God, religion and the church? Leave things of the state to statesmen. Leave off such debates; God’s anger is kindled against Scotland; do not kindle it more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Maurice Grant, Preacher to the Remnant: The Story of James Renwick (Blue Banner Productions, 2009)</cite>, pp. 140-41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-de5de93308" data-kw="">
<blockquote><p>Where these causes are not, [viz. the being constrained to profess, believe or practice contrary to the Rule of Faith, or being deprived of means altogether necessary, or most expedient to salvation] but men may communicate without sin, professing the truth, and enjoy all ordinances as the freemen of Christ: Men must not separate from a Church, though there be corruption in it, to gather into a new Church, which may be more pure, and in some respects more comfortable.</p></blockquote>

</figure><figure class="quote" id="q-4a8114a6e3" data-kw="">
<blockquote><p>Paul could not endure the divisions of one and the same Church of Corinth, though they pretended not to be different Churches; for those that said they were of Paul, professed they could not be disciples of Peter: But he sharply rebuked them as carnal men, nd such as divided Christ, and by consequence must say Paul was crucified for them, and was their redeemer: and so, if obstinately they had proceeded in that separation, Paul would have gone on to higher censures of the Church. Far more could he not endure gathering of true Churches out of true Chuches, which is the professed practice of Independents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-0d68aa6d6c" data-kw="">
<blockquote><p>To those who, in a narrow spirit, insist on having divine prescription for the most insignificant details of religious life and public worship, this appeal to ‘nature itself,’ [v. 14] as a great guide in relation to the decencies of public worship, should read a wholesome lesson. Nature, though uniform in its essential features, varies in all that is subordinate in different regions and at different periods. In matters of feeling, taste, and decorum, as to the way in which the relation of the sexes should be expressed, eastern and western ideas notoriously and widely differ, and they should be allowed their natural and proper development.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-brown.html">David Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1 Cor. 11 in A Popular Commentary on the New Testament, ed. Philip Schaff, p. 203</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1d5a0c0a0c" data-kw="">
<blockquote><p>Paul… his traditions were the Gospel of Christ and honest manners and living, and such a good order as becomes the doctrine of Christ. As that a woman obey her husband, have her head covered, keep silence, and go womanly and christianly apparelled: that children and servants be in subjection: and that the young obey their elders, that no man eat but he that labours and works, and that men make an earnest thing of God’s Word, and of his holy Sacraments: and to watch, fast, and pray, and such like, as the Scripture commands. Which things he that would break were no christian man… There were also certain customs alway which were not commanded in pain of hell or everlasting damnation, as to watch all night, and to kiss one another: which as soon as the people abused, then they brake them. For which cause the bishops might break many things now in like manner. Paul also in many things which God had made free, gave pure and faithful counsel without tangling of any man’s conscience, and without all manner commanding under pain of cursing, pain of excommunication, pain of heresy, pain of burning, pain of deadly sin, pain of hell, and pain of damnation. As thou mayst see. 1 Cor. 7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Obedience of a Christian Man, and how Christian Rulers ought to Govern in The Whole Works of W. Tyndall, John Frith &amp; Doctor Barnes, Three Worthy Martyrs &amp; Principal Teachers of this Church of England, Collected &amp; Compiled in One Tome Together</cite>, The Obedience of a Christian Man, and how Christian Rulers ought to Govern in The Whole Works of W. Tyndall, John Frith &amp; Doctor Barnes, Three Worthy Martyrs &amp; Principal Teachers of this Church of England, Collected &amp; Compiled in One Tome Together… (d. 1536; London, 1573), pp. 128-29</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-cdfc0eea12" data-kw="">
<blockquote><p>All that outward reverence which we show towards God in his worship and service must be measured and estimated according to the customs and usage of places and countries; so that what they use as a sign and expression of honor to their superiors, they ought much more to use it in the presence of the great God, the King of Kings and Lord of Lords. And therefore uncovering of the head [for men], bowing of the body, an humble submiss and settled composure of the whole man, which among us are but fitting signs of respect and reverence, when we appear in the presence of those who are much our superiors, ought likewise to be used by us in the presence of God, who is infinitely such, not indeed that they are essential parts of worship, but signs and testimonies of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Ten Commandments with other Sermons</cite>, … (London, 1691) | Second Commandment</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-1dd061a1b1" data-kw="">
<blockquote><p>I answer: that for men to pray or prophesy with their heads covered, or with long hair, and women uncovered, were things in their own nature indifferent (unless you make it necessary, as a moral duty for men to pray or prophesy uncovered, and women contra; which no interpreters upon that text do) and yet the apostle enjoins the Corinthians so to do… …in the use of things indifferent; whereas there are at least five [rules] to that purpose: And by the same reason, that the apostle enjoins men to keep decency, he enjoins to keep order; and so other rules, concerning things indifferent. Does not the apostle complain of disorder in the Corinthians preaching covered? yet the contrary order was not necessary, but in itself indifferent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Clavium: or, A Vindication of the Keys of the Kingdom of Heaven, into the Hands of the Right Owners. Being some Animadversions upon a Tract of Mr. John Cotton’s Called, ‘The Keys of the Kingdom of Heaven’. As also upon Another Tract of his Called, ‘The Way of the Churches of New England’. Manifesting: 1. The Weakness of his Proofs. 2. The Contradictions to Himself &amp; Others. 3. The Middle-Way</cite>, ... (London, 1645), ch. 6, pp. 57-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-7b2bea5a5e" data-kw="">
<blockquote><p>II. Answerable to a servant’s obeisance must be his whole behavior before his master, seasoned and ordered with such modesty and humility, as may manifest an honorable respect to his master: as … 2. By uncovering their heads in their master’s presence: this in our days, and in the parts of the world where we dwell, is in the male kind a sign and token of subjection.</p></blockquote>

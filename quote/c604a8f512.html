<main class="wrap"><figure class="quote" id="q-c604a8f512" data-kw="">
<blockquote><p>I am Jehovah.” This name expresses, fundamentally, self-existence, and therefore conveys the idea that he to whom it belongs is the author of all finite being. The people to whom the law is given are hereby reminded that they are the creatures of God, living, moving, having their being in him, and that this absolute physical dependence involves an absolute moral dependence also.

This name serves to show that this law was not given to the Hebrews, as Hebrews, but as men, and, consequently, that it belongs not to those elements of the Mosaic institute which are provisional and temporary, but to those which are permanent and eternal. The sum of this law is love; and love to God is absolutely essential to the perfection and happiness of men. The law has been dispensed under many different forms, but in its essence it is as immutable as the nature of God and the relation of creature to creator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Moral Law in Miscellanies of Rev. Thomas E. Peck, D.D., LL.D., Professor of Theology in the Union Theological Seminary in Virginia</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a0ff0d7b1d" data-kw="">
<blockquote><p>The Church of Rome in a manner confounds the law and the gospel, saying that the gospel, which is the new law, reveals Christ more clearly than Moses’ law did, which they call the old law. But this is a wicked opinion, which overturns all religion, being the cause of many gross points in popery, which could not stand, if they would acknowledge a true distinction between the law and the gospel. They say for their defense that the precepts of both are the same in substance; that both require righteousness; both promise life, and threaten death; both command faith, repentance, and obedience; and therefore they are the same. Answer . First, the laws and precepts Answer . First, the laws and precepts of the law and gospel are not the same, for Adam in his innocence knew the law, but he knew nothing then of believing in Christ. And though both require righteousness, promise life, and threaten death, yet the manner is far different, as before was noted, so likewise they differ in the commanding of faith, for the gospel commands faith, not as a work done, as the law does, but as an instrument laying hold on Christ. Again, the law commands faith generally, as to believe in God, and to believe His Word to be true; but besides this, the gospel requires a particular faith in Christ the Redeemer, whom the law never knew. Thirdly, the law commands not repentance, for the knowledge of the law was in Adam’s heart, when he needed no repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on Christ’s Sermon on the Mount, in Works</cite>, 1:244–45.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-7536d9eabe" data-kw="">
<blockquote><p>The Ten Commandments, accordingly, were published from Sinai in the form of a covenant, or federal, transaction. The Sinai transaction was a mixed dispensation. In it, the covenant of grace was repeated and published; the covenant of works was awfully displayed in subservience thereto; and a national covenant between God and the Israelites was also made as an appendage to the covenant of grace. Accordingly, the law of the Ten Commandments was thence promulgated by the Son of God, the glorious Mediator, as a rule of life to believers in a manner suited to the covenant of grace. The same law was repeated and displayed to the Israelites in the form of the covenant of works, and it was published to them as the matter of a national covenant, or covenant of peculiarity, between God and them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 46.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-874faebf03" data-kw="">
<blockquote><p>God had before given the covenant of works, or perfect obedience, unto all mankind, in the law of creation. But this covenant at Sinai did not abrogate or disannul that covenant, nor any way fulfill it. And the reason is, because it was never intended to come in the place or room thereof, as a covenant, containing an entire rule of all the faith and obedience of the whole church. God did not intend in it to abrogate the covenant of works, and to substitute this in the place thereof; yea, in sundry things it re-enforced, established, and confirmed that covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 93</span></figcaption>

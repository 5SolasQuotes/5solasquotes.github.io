<main class="wrap"><figure class="quote" id="q-5befdc3ee6" data-kw="">
<blockquote><p>And as evil is to be controlled by Law, so that which is good is also by Law to be procured. God hath made us many ways rich. For what we have, freely at his hands we have it. But he himself is become very poor: in so much that, for want of relief, he is forced to beg; and, for want of lodging and meat, he lieth and dieth in our streets. This great ingratitude God cannot but revenge.

Oh what shame is this to a Christian common wealth, in a reformed country? Obstinate Jews would never shew themselves so unthankful. Their ancient Law forbidding beggars is even to this day most straitly kept amongst them. Laws in this behalf have been provided: but as they wanted perfection, so have they in manner in no point or any where had execution.

Serve God in truth, provide that Christ crave not. Such as will not feed him here: he will never feed in his kingdom. Thus have I, point by point, let you see disorders and wants in the common wealth. Ye have authority by Law to reform them. Consider dutifully of it, and serve God truly as ye ought, always remembering the saying of the Prophet Esay, Woe be to them that make wicked Laws.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edwin-sandys.html">Edwin Sandys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons made by the most reverend Father in God, Edwin, Archbishop of York, primate of England and metropolitan</cite>, (London: Henry Midleton, 1585), pp 40-41.</span></figcaption>

lank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9534986baf" data-kw="">
<blockquote><p>For nature itself presupposes the following: (1) There is a God, or some first being, by whom all things exist, who is the ultimate end to whom all things aim, and who consequently is above all things.

(2) He must be worshipped, or, what is the same thing, life must be lived for him. For if we have all things from him, and we have them so that we may give them back to him, and if likewise he is over all things and more perfect than all things, certainly it is evidently that all these truths must be acknowledged with due reverence, and in doing so the worship of God is performed.

(3) This worship of God is not a work of nature, such as seeing, hearing, and walking, which accordingly do not require a rule to direct them. Rather, the worship of God is a certain art that must be directed by certain rules.

(4) The rule is not reason, because it is corrupted, as anyone who is rich in reason acknowledges, and something that is corrupt cannot be the measure of right. Neither is the rule the statutes of the wise, for they depend upon reason alone (which we have already excluded from this axiom), and from it they borrow their authority.

Neither is it the sayings of the church fathers, for all of them were men just as we are and, to that extent, not only were they bound to a certain rule in the same way that we are, but they were also fallible and, what is more, often wrong. So they cannot compose any rule except a pliable one, which is not one at all, since the rule ought to be infallible.

Neither is the rule the Jewish Talmud, since, due to the unwritten tradition through which it has been handed down from Moses to the Jews, not only is its truth uncertain, but also, on account of the fables with which it overflows, its falsity is certain. Neither is it the Qur’an of the Muslims, since it too readily reveals its own ineptitude by its superstitious and scurrilous nonsense. So then, there is no rule that remains standing except our Holy Scriptures, and thus we declare it to be our axiom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology Volume 1: Prolegomena</cite>, trans. Todd M. Rester, ed. Joel R. Beeke (1699; Grand Rapids MI: Reformation Heritage Books, 2018), 1.1.2, IV, pp 117-18.</span></figcaption>

</figure><figure class="quote" id="q-e5c71266e4" data-kw="">
<blockquote><p>But there is another intention not religious: if a child read a chapter of the Bible that he may learn to read and spell, that is an action of art, not of worship; because the object of the child’s reading is not Scripture as Scripture, but only the printed characters as they are, signa rerum ut rerum, non ut rerum sacrarum, ‘signs of things, not of holy things’; And here the object, not being religious, the intrinsic operation cannot raise up any religious intention of the child. Upon this ground it is easy to determine whether or no[t] an intention of worship be essential to worship or not. The former intention, which is intrinsic, and intentio operis [the intention of the operation], may be essential, it resulting from the object; but the latter intention of the worker, is so far extraneous to worship, as whether it be or be not the nature of worship, [that it] is not impaired, nor violated.</p></blockquote>

<blockquote><p>Let us now see what is meant by the due worship of God. Its chief foundation is to acknowledge Him to be, as He is, the only source of all virtue, justice, holiness, wisdom, truth, power, goodness, mercy, life, and salvation; in accordance with this, to ascribe and render to Him the glory of all that is good, to seek all things in Him alone, and in every want have recourse to Him alone. Hence arises prayer, hence praise and thanksgiving — these being attestations to the glory which we attribute to Him. This is that genuine sanctification of His name which He requires of us above all things. To this is united adoration, by which we manifest for Him the reverence due to his greatness and excellency, and to this ceremonies are subservient, as helps or instruments, in order that, in the performance of divine worship, the body may be exercised at the same time with the soul. Next after these comes self-abasement, when, renouncing the world and the flesh, we are transformed in the renewing of our mind, and living no longer to ourselves, submit to be ruled and actuated by Him. By this self-abasement we are trained to obedience and devotedness to his will, so that his fear reigns in our hearts, and regulates all the actions of our lives. That in these things consists the true and sincere worship which alone God approves, and in which alone He delights, is both taught by the Holy Spirit throughout the Scriptures and is also, antecedent to discussion, the obvious dictate of piety. Nor from the beginning was there any other method of worshipping God, the only difference being, that this spiritual truth, which with us is naked and simple, was under the former dispensation wrapt up in figures. And this is the meaning of our Savior’s words, “The hour cometh, and now is, when the true worshippers shall worship the Father in spirit and in truth,” (John 4:23.) For by these words he meant not to declare that God was not worshipped by the fathers in this spiritual manner, but only to point out a distinction in the external form, viz., That while they had the Spirit shadowed forth by many figures, we have it in simplicity. But it has always been an acknowledged point, that God, who is a Spirit, must be worshipped in spirit and in truth. Moreover, the rule which distinguishes between pure and vitiated worship is of universal application, in order that we may not adopt any device which seems fit to ourselves, but look to the injunction of Him who alone is entitled to prescribe. Therefore, if we would have Him to approve our worship, this rule, which he everywhere enforces with the utmost strictness, must be carefully observed. For there is a twofold reason why the Lord, in condemning and prohibiting all fictitious worship, requires us to give obedience only to his own voice. First, it tends greatly to establish His authority that we do not follow our own pleasures but depend entirely on his sovereignty; and, secondly, such is our folly, that when we are left at liberty, all we are able to do is to go astray. And then when once we have turned aside from the right path, there is no end to our wanderings, until we get buried under a multitude of superstitions. Justly, therefore, does the Lord, in order to assert his full right of dominion, strictly enjoin what he wishes us to do, and at once reject all human devices which are at variance with his command. Justly, too, does he, in express terms, define our limits that we may not, by fabricating perverse modes of worship, provoke His anger against us. I know how difficult it is to persuade the world that God disapproves of all modes of worship not expressly sanctioned by His Word. The opposite persuasion which cleaves to them, being seated, as it were, in their very bones and marrow, is, that whatever they do has in itself a sufficient sanction, provided it exhibits some kind of zeal for the honor of God. But since God not only regards as fruitless, but also plainly abominates, whatever we undertake from zeal to His worship, if at variance with His command, what do we gain by a contrary course? The words of God are clear and distinct, “Obedience is better than sacrifice.” “In vain do they worship me, teaching for doctrines the commandments of men,” (1 Samuel 15:22; Matthew 15:9.) Every addition to His word, especially in this matter, is a lie. Mere “will worship” ἐθελοθρησκία, a is vanity. This is the decision, and when once the judge has decided, it is no longer time to debate.</p></blockquote>

 by the fathers in this spiritual manner, but only to point out a distinction in the external form, viz., That while they had the Spirit shadowed forth by many figures, we have it in simplicity. But it has always been an acknowledged point, that God, who is a Spirit, must be worshipped in spirit and in truth. Moreover, the rule which distinguishes between pure and vitiated worship is of universal application, in order that we may not adopt any device which seems fit to ourselves, but look to the injunction of Him who alone is entitled to prescribe. Therefore, if we would have Him to approve our worship, this rule, which he everywhere enforces with the utmost strictness, must be carefully observed. For there is a twofold reason why the Lord, in condemning and prohibiting all fictitious worship, requires us to give obedience only to his own voice. First, it tends greatly to establish His authority that we do not follow our own pleasures but depend entirely on his sovereignty; and, secondly, such is our folly, that when we are left at liberty, all we are able to do is to go astray. And then when once we have turned aside from the right path, there is no end to our wanderings, until we get buried under a multitude of superstitions. Justly, therefore, does the Lord, in order to assert his full right of dominion, strictly enjoin what he wishes us to do, and at once reject all human devices which are at variance with his command. Justly, too, does he, in express terms, define our limits that we may not, by fabricating perverse modes of worship, provoke His anger against us. I know how difficult it is to persuade the world that God disapproves of all modes of worship not expressly sanctioned by His Word. The opposite persuasion which cleaves to them, being seated, as it were, in their very bones and marrow, is, that whatever they do has in itself a sufficient sanction, provided it exhibits some kind of zeal for the honor of God. But since God not only regards as fruitless, but also plainly abominates, whatever we undertake from zeal to His worship, if at variance with His command, what do we gain by a contrary course? The words of God are clear and distinct, “Obedience is better than sacrifice.” “In vain do they worship me, teaching for doctrines the commandments of men,” (1 Samuel 15:22; Matthew 15:9.) Every addition to His word, especially in this matter, is a lie. Mere “will worship” ἐθελοθρησκία, a is vanity. This is the decision, and when once the judge has decided, it is no longer time to debate.”

— John Calvin, The Necessity of Reforming the Church, (1543)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CLet+us+now+see+what+is+meant+by+the+due+worship+of+God.+Its+chief+foundation+is+to+acknowledge+Him+to+be%2C+as+He+is%2C+the+only+source+of+all+virtue%2C+justice%2C+holiness%2C+wisdom%2C+truth%2C+power%2C+goodness%2C+mercy%2C+life%2C+and+salvation%3B+in+accordance+with+this%2C+to+ascribe+and+render+to+Him+the+glory+of+all+that+is+good%2C+to+seek+all+things+in+Him+alone%2C+and+in+every+want+have+recourse+to+Him+alone.+Hence+arises+prayer%2C+hence+praise+and+thanksgiving+%E2%80%94+these+being+attestations+to+the+glory+which+we+attribute+to+Him.+This+is+that+genuine+sanctification+of+His+name+which+He+requires+of+us+above+all+things.+To+this+is+united+adoration%2C+by+which+we+manifest+for+Him+the+reverence+due+to+his+greatness+and+excellency%2C+and+to+this+ceremonies+are+subservient%2C+as+helps+or+instruments%2C+in+order+that%2C+in+the+performance+of+divine+worship%2C+the+body+may+be+exercised+at+the+same+time+with+the+soul.+Next+after+these+comes+self-abasement%2C+when%2C+renouncing+the+world+and+the+flesh%2C+we+are+transformed+in+the+renewing+of+our+mind%2C+and+living+no+longer+to+ourselves%2C+submit+to+be+ruled+and+actuated+by+Him.+By+this+self-abasement+we+are+trained+to+obedience+and+devotedness+to+his+will%2C+so+that+his+fear+reigns+in+our+hearts%2C+and+regulates+all+the+actions+of+our+lives.+That+in+these+things+consists+the+true+and+sincere+worship+which+alone+God+approves%2C+and+in+which+alone+He+delights%2C+is+both+taught+by+the+Holy+Spirit+throughout+the+Scriptures+and+is+also%2C+antecedent+to+discussion%2C+the+obvious+dictate+of+piety.+Nor+from+the+beginning+was+there+any+other+method+of+worshipping+God%2C+the+only+difference+being%2C+that+this+spiritual+truth%2C+which+with+us+is+naked+and+simple%2C+was+under+the+former+dispensation+wrapt+up+in+figures.+And+this+is+the+meaning+of+our+Savior%E2%80%99s+words%2C+%E2%80%9CThe+hour+cometh%2C+and+now+is%2C+when+the+true+worshippers+shall+worship+the+Father+in+spirit+and+in+truth%2C%E2%80%9D+%28John+4%3A23.%29+For+by+these+words+he+meant+not+to+declare+that+God+was+not+worshipped+by+the+fathers+in+this+spiritual+manner%2C+but+only+to+point+out+a+distinction+in+the+external+form%2C+viz.%2C+That+while+they+had+the+Spirit+shadowed+forth+by+many+figures%2C+we+have+it+in+simplicity.+But+it+has+always+been+an+acknowledged+point%2C+that+God%2C+who+is+a+Spirit%2C+must+be+worshipped+in+spirit+and+in+truth.+Moreover%2C+the+rule+which+distinguishes+between+pure+and+vitiated+worship+is+of+universal+application%2C+in+order+that+we+may+not+adopt+any+device+which+seems+fit+to+ourselves%2C+but+look+to+the+injunction+of+Him+who+alone+is+entitled+to+prescribe.+Therefore%2C+if+we+would+have+Him+to+approve+our+worship%2C+this+rule%2C+which+he+everywhere+enforces+with+the+utmost+strictness%2C+must+be+carefully+observed.+For+there+is+a+twofold+reason+why+the+Lord%2C+in+condemning+and+prohibiting+all+fictitious+worship%2C+requires+us+to+give+obedience+only+to+his+own+voice.+First%2C+it+tends+greatly+to+establish+His+authority+that+we+do+not+follow+our+own+pleasures+but+depend+entirely+on+his+sovereignty%3B+and%2C+secondly%2C+such+is+our+folly%2C+that+when+we+are+left+at+liberty%2C+all+we+are+able+to+do+is+to+go+astray.+And+then+when+once+we+have+turned+aside+from+the+right+path%2C+there+is+no+end+to+our+wanderings%2C+until+we+get+buried+under+a+multitude+of+superstitions.+Justly%2C+therefore%2C+does+the+Lord%2C+in+order+to+assert+his+full+right+of+dominion%2C+strictly+enjoin+what+he+wishes+us+to+do%2C+and+at+once+reject+all+human+devices+which+are+at+variance+with+his+command.+Justly%2C+too%2C+does+he%2C+in+express+terms%2C+define+our+limits+that+we+may+not%2C+by+fabricating+perverse+modes+of+worship%2C+provoke+His+anger+against+us.+I+know+how+difficult+it+is+to+persuade+the+world+that+God+disapproves+of+all+modes+of+worship+not+expressly+sanctioned+by+His+Word.+The+opposite+persuasion+which+cleaves+to+them%2C+being+seated%2C+as+it+were%2C+in+their+very+bones+and+marrow%2C+is%2C+that+whatever+they+do+has+in+itself+a+sufficient+sanction%2C+provided+it+exhibits+some+kind+of+zeal+for+the+honor+of+God.+But+since+God+not+only+regards+as+fruitless%2C+but+also+plainly+abominates%2C+whatever+we+undertake+from+zeal+to+His+worship%2C+if+at+variance+with+His+command%2C+what+do+we+gain+by+a+contrary+course%3F+The+words+of+God+are+clear+and+distinct%2C+%E2%80%9CObedience+is+better+than+sacrifice.%E2%80%9D+%E2%80%9CIn+vain+do+they+worship+me%2C+teaching+for+doctrines+the+commandments+of+men%2C%E2%80%9D+%281+Samuel+15%3A22%3B+Matthew+15%3A9.%29+Every+addition+to+His+word%2C+especially+in+this+matter%2C+is+a+lie.+Mere+%E2%80%9Cwill+worship%E2%80%9D+%E1%BC%90%CE%B8%CE%B5%CE%BB%CE%BF%CE%B8%CF%81%CE%B7%CF%83%CE%BA%E1%BD%B7%CE%B1%2C+a+is+vanity.+This+is+the+decision%2C+and+when+once+the+judge+has+decided%2C+it+is+no+longer+time+to+debate.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+The+Necessity+of+Reforming+the+Church%2C+%281543%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F17833f3261.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/17833f3261.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/10/calvins-first-reformation-priority-worship-sola-scriptura/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>A wive’s outward reverence consists in her reverend gesture, speech. For the first, that a reverend gesture and carriage of herself to her husband, and in her husband’s presence, beseems a wife, was of old implied by the vail which the woman used to put on, when she was brought unto her husband, as is noted in the example of Rebekah (Gen. 24:65): whereunto the apostle alludes in these words, ‘the woman ought to have power on her head.’ (1 Cor. 11:10) That cover on the woman’s head, as in general it implied subjection, so in particular this kind of subjection, viz. a reverend carriage and gesture. But most expressly is this duty set down by Saint Peter who exhorts wives to order their conversation [conduct] before their husbands, so as it be pure, with reverence. This reverend conversation [conduct] consists in a wive-like sobriety, mildness, courtesy and modesty. [Gouge does not go on to mention veils]</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-951a1cfe7c" data-kw="">
<blockquote><p>Me thinks it is somewhat a strange kind of reasoning, because the rod of discipline is wanting [lacking], the children should be denied bread; yea, but you will say, dogs will eat the children’s bread: Why, will you therefore starve the children because dogs without your default may snatch the children’s portion? Shall the children be debarred (as I may say) their daily bread, because it will become accidentally poison unto dogs?… As it is better for God’s sheep to feed upon pasture where some weeds grow rather than starve for want [lack] of food: So it is better for God’s shepherds to suffer some weeds to grow in the sheeps’ pastures if they cannot prevent it, than to starve their flocks; yea, and as it is better for the sheep to feed among goats rather than starve, so it is better the shepherds should suffer the goats to feed upon the sheeps’ pasture though it should poison them, than for the sheep to be kept from it;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want</cite>, [Lack] of Church-Government [is] No Warrant for a Total Omission of the Lord’s Supper… (London, 1650) Jeanes (1611–1662) was a presbyterian minister in London., pp. 32-35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

r%20the%20sheep%20to%20be%20kept%20from%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d473f1181c" data-kw="">
<blockquote><p>But if one avoid more ordinary communion with a church, as judging it, though not essentially defective, yet to want [lack] or err in some circumstances so considerable as that he counts [that] another church comes nearer the common Christian rule, the Holy Scriptures, and finds its administrations more conducing to his spiritual advantage; he may be led, by the judgment of his conscience, both, sometimes upon weighty and important reasons to communicate with the former [defective Church], and continue therein, according as those reasons shall continue urgent upon him; and yet, sometimes, as the cessant or diminished weight of such reasons shall allow, to communicate with the other [more spiritually advantageous church].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe</cite>, vol. 5, Containing the Treatises: On Divine Prescience &amp; the Trinity… (Religious Tract Society, 1863) Howe (1630-1705) was an English puritan and presbyterian theologian., pp. 275-76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

0ordinary%20communion%20with&amp;text=communicate%20with%20the%20other%20%5Bmore%20spiritually%20advantageous%20church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d8d0ceedf7" data-kw="">
<blockquote><p>…superstition is the opposite vice to religion, in the excess, as our divines describe it; for it exhibits more in the worship of God than He requires in his worship… We see he [Jonas Porree referencing Zanchi] accounts superstition to be in the addition of ceremonies not instituded by Christ, as well as in the addition of more substantial matters… Now our ceremonies, though they exhibit worship to God, yet this is done inordinately, and they make the worship to be otherwise performed than it should be; for example, though God be worshipped by the administration of the sacraments in private places, yet not so as He should be worshipped… …ceremonies… have no necessary nor profitable use in the Church (as has been proved) which kind of things, cannot be used without superstition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 1, pp. 1-2</span></figcaption>

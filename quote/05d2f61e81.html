<main class="wrap"><figure class="quote" id="q-05d2f61e81" data-kw="">
<blockquote><p>38. Although therefore in some assembly, either in doctrine, or in the administration of the sacraments, the worship of God, and morals, some vice may creep in, nevertheless the assembly does not cease to be in the Church of God, as long as it retains the foundation, which is Christ. Just as Paul does not take away the name of the Church of God from the Corinthians and Galatians, even though false doctrines had begun to be spread among them, and some lived dissolutely. Nor is the Church to be denied immediately because of the neglect or cessation of ecclesiastical discipline.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System of Christian Theology</cite>, tr. ChatGPT-4 (Hanau, 1609-1610), bk. 7, Church &amp; its Government, p. 309</span></figcaption>

<blockquote><p>But though you have not been able to distinguish betwixt an adversary to your way, and an adversary to your person, but have thought every blow that was given to your error, was a mortal wound to your dear self, yet many others can, and do. If in exposing your errors, your reputation be exposed, you must blame them for occasioning it, and not us. It gives no pleasure that I and others have bestowed upon you labor in vain…</p></blockquote>

</figure><figure class="quote" id="q-4fd8fffa64" data-kw="">
<blockquote><p>Comprehended in the salutation or apostolic benediction: Because Paul, the author of this epistle, would not that the dignity of the Church of Corinth should in any ways be eclipsed (although he knew there were most corrupt persons among them, not only which lay hid, but openly showed themselves enemies to the apostle), but constantly accounted the Church at Corinth a true Church, to which, by his authority, he applied the benediction of the Gospel, and doubted not to wish them all good things.</p></blockquote>

</figure><figure class="quote" id="q-5c8d5afc64" data-kw="">
<blockquote><p>The voluntary and unnecessary dividing and separation from a true Church is schismatical. When we put bounds and partitions between it and ourselves, we sin (say some) as did these seducers here taxed by Jude. If the Church be not heretical or idolatrous, or do not by excommunication, persecution, etc. thrust us out of its communion; if it be such an one as Christ the head has communion with, we the members ought not by separation to rend and divide the body. To separate from congregations where the word of truth and Gospel of salvation are held forth in an ordinary way (1 Tim. 3:15), as the proclamations of princes are held forth upon pillars to which they are affixed; where the light of the truth is set up as upon a candlestick to guide passengers to heaven. (Rev. 1:13) To separate from them to whom belong the covenants, and where the sacraments, the seals of the Covenant, and for substance rightly dispensed, where Christ walks in the midst of his golden candlesticks, and discovers his presence in his ordinances, whereby they are made effectual to the conversion and edification of souls, in an ordinary way; where the members are saints by a professed subjection to Christ and his Gospel, and haply have promised this explicitly and openly; where there are sundry who in the judgment of charity may be conceived to have the work of grace really wrought in their hearts by walking in some measure answerable to their profession: I say to separate from these, as those with whom Church communion is not to be held and maintaind, is unwarrantable and schismatical.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkyn.html">William Jenkyn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Jude</cite>, (London: Maxey, 1654), on vv. 17-19, pp. 589-90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-3a56eab2b9" data-kw="">
<blockquote><p>…the controversy of our ceremonies; the sparkles of which difference have grown unto great flames in this our [Anglican] Church. Where the fault is, as God knows, so the day will try and God will one day judge. But difference of apprehensions has brought forth difference of judgments, and difference of judgments has brought forth difference of practice and disagreement in affection. The difference of practice has moved [civil / Church] Authority to silence and suppress refusers of conformity: The disagreement in affection, has moved the ministers deprived to speak evil of persons in authority and of conformers: Whereby in the event, the course of the Gospel is interrupted, and [the course] of Popery enlarged; the friends of Sion are grieved, the enemies reioiced, the Devil gratified, and God not pleased. The Church is rent with schism, the truth scandalized by dissention, and the ministers undone by loss of living, and the unity of brethren living in the same house, professing the same Faith, and rejoicing in the same hope, is pulled in pieces: And this [is] like[ly] to continue God knows how long; but all men know: the longer the worse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623) | ‘To the Reader’ no page number</span></figcaption>

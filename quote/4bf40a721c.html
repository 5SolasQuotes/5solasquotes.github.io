<main class="wrap"><figure class="quote" id="q-4bf40a721c" data-kw="">
<blockquote><p>Some had thought that your Love and Charity extended a little to[o] far beyond the Scripture-Rule in some Instances, such as Journal last p. 59. when you say, “The Quakers’ Notions about walking and being led by the Spirit, you think are right and good;” unless they be Quakers of another Stamp than the rest, whose dangerous Tenets are inconsistent with the right Notion of walking and being led by the Spirit, while, beside other Things, they deny Justification by the imputed Righteousness of CHRIST, or his active and passive Obedience received by Faith, to be the only Ground of Justification before GOD; and while thus they cannot receive CHRIST JESUS, they consequently cannot walk in him, nor be led by his Spirit, who is the Spirit of Truth, testifying of CHRIST, according to the Revelation made of him in the Word, which they contradict. Whatever Duties of Love you perform toward these Men, yet I’ll never believe you mean or intend to justify their Principles and delusive Notions, nor think well of them, till once the LORD convince and convert them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Letter from the Reverend Mr. Ralph Erskine to the Reverend Mr. Geo. Whitefield</cite>, (Philadelphia: B. Franklin, 1741), p. 8.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beatitudes</cite>, p. 174</span></figcaption>

</figure><figure class="quote" id="q-c945ac4a0f" data-kw="">
<blockquote><p>I answer that, Anger, as stated above (Article 1), is properly the name of a passion. A passion of the sensitive appetite is good in so far as it is regulated by reason, whereas it is evil if it set the order of reason aside. Now the order of reason, in regard to anger, may be considered in relation to two things. First, in relation to the appetible object to which anger tends, and that is revenge. Wherefore if one desire revenge to be taken in accordance with the order of reason, the desire of anger is praiseworthy, and is called “zealous anger” [Cf. Gregory, Moral. v, 45. On the other hand, if one desire the taking of vengeance in any way whatever contrary to the order of reason, for instance if he desire the punishment of one who has not deserved it, or beyond his deserts, or again contrary to the order prescribed by law, or not for the due end, namely the maintaining of justice and the correction of defaults, then the desire of anger will be sinful, and this is called sinful anger. Secondly, the order of reason in regard to anger may be considered in relation to the mode of being angry, namely that the movement of anger should not be immoderately fierce, neither internally nor externally; and if this condition be disregarded, anger will not lack sin, even though just vengeance be desired.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, question 158, ‘Anger’ in Summa, 2nd pt. of 2nd pt.</span></figcaption>

<blockquote><p>…where both [both things to be preserved] cannot be jointly put out of danger: but all this amounts not to a disobligement from the endeavor of preserving them all; nor to a liberty upon any emergency of active, direct and purposed making away or removing of any of them, though under pretense of securing the other. I have read of one Alcon, who finding his son fast on sleep upon the grass, and a serpent creeping upon his breast, he not apprehending how otherwise it was possible to save his son, took his bow and shot at the serpent upon the boys breast, which (though to the manifest endangering of his life) yet he chose rather to take that course than by suffering the serpent to leave his life to a more certain destruction; And either his art or good hap was such as that he prevented and slew the serpent and preserved his son: those whom we are bound and most solicitous to preserve, we may upon an extreme exigence put in some hazard that we may preserve them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-gee.html">Edward Gee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation concerning Usurped Powers</cite>, … (London, 1650), ch. 4, pp. 30-31</span></figcaption>

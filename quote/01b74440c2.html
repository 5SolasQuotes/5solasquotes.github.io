<main class="wrap"><figure class="quote" id="q-01b74440c2" data-kw="">
<blockquote><p>Now the Independents will admit of none but such as can give a particular account of their conversion. But this can never be, for the devil will have his tares amongst Christ’s wheat, until the harvest of the Lord.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-66a6fa8b73" data-kw="">
<blockquote><p>Cessation from labor for prayers or preaching on those appointed days of the week [by the Church], at some occasions, may be omitted… 3. …to leave work to come to the ordinary weekly meetings, they are only exhorted… for in one place where his [the bishop’s] antagonist maintains truly that the craftsman cannot be lawfully commanded nor compelled to leave his work and to go to public divine service, except on the day that the Lord has sanctified… …the 9th Head of the [Scottish] First Book of Discipline [1560], which says: ‘In great towns, we think expedient that every day there be either sermon or common prayers, etc.’ where there is nothing of compulsion or a forcing command; only there is an exhortation.</p></blockquote>

</figure><figure class="quote" id="q-08da34f00d" data-kw="">
<blockquote><p>Eleventhly, [it is superstition] that he that is a member of one church may not communicate with any other but by the consent of the pastor and people of that one. Twelfthly, that he that is a member of a church may not remove his relation to another church (when his occasions and personal benefit require it and the public good of many is not hurt by it) without the consent of the pastor and people of that church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1 | Direction 58, p. 290</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>
<div class="actions"><button class="copy" data-copy="“Eleventhly, [it is superstition] that he that is a member of one church may not communicate with any other but by the consent of the pastor and people of that one. Twelfthly, that he that is a member of a church may not remove his relation to another church (when his occasions and personal benefit require it and the public good of many is not hurt by it) without the consent of the pastor and people of that church.”

— Richard Baxter, The Cure of Church Divisions, … (London, 1670), pt. 1 | Direction 58, p. 290">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEleventhly%2C+%5Bit+is+superstition%5D+that+he+that+is+a+member+of+one+church+may+not+communicate+with+any+other+but+by+the+consent+of+the+pastor+and+people+of+that+one.+Twelfthly%2C+that+he+that+is+a+member+of+a+church+may+not+remove+his+relation+to+another+church+%28when+his+occasions+and+personal+benefit+require+it+and+the+public+good+of+many+is+not+hurt+by+it%29+without+the+consent+of+the+pastor+and+people+of+that+church.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Cure+of+Church+Divisions%2C+%E2%80%A6+%28London%2C+1670%29%2C+pt.+1+%7C+Direction+58%2C+p.+290&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F08da34f00d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/08da34f00d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-leaving-a-congregation/#:~:text=Eleventhly%2C%20%5Bit%20is%20superstition%5D%20that%20he,pastor%20and%20people%20of%20that%20church&amp;text=Eleventhly%2C%20%5Bit%20is%20superstition%5D%20that%20he%20that%20is&amp;text=of%20the%20pastor%20and%20people%20of%20that%20church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6cbd577fcb" data-kw="">
<blockquote><p>That all the members of the catholic Church should meet together to hear one sermon, to partake of one sacrament, etc. as it was possible once, when their number was but an 120, Acts 1, so they are bound still, but that the multitude makes it impossible. That the particular congregations should join together in the same specifical ordinances, and have officers over them alike, is certainly an institution of Jesus Christ, as well, as to make the same profession of faith, and hope. Indeed, that, being so numerous, they should have one officer over them all, and join to hear one sermon, or receive the same sacrament numerical (as he [Owen] speaks) is a ridiculous fancy; and not only false, but impossible. But I would gladly know a reason why 40 or more members of no particular church, but only of the catholic, meeting together, and having a minister among them, may not join together to worship God in prayer, preaching and partaking of the sacrament, as well as the members of several particular churches, and himself [Owen] among them, may do the same; as they do often at London and Oxford when he preaches, unless he will count those ordinances then and there administered no acts of instituted worship; And if he grant them to be worship, how can he deny [on his principles] that assembly to be a particular church, though it be not fixed nor gathered and united by any explicit covenant, or consent to live and die together [as congregationalists held]. I shall only note again, that herein he deserts his [congregationalist] friends in New England…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Independency a Great Schism, Proved Against Dr</cite>, [John] Owen… (London, 1657), ch. 5, pp. 89-90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

%2C+pp.+89-90&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6cbd577fcb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6cbd577fcb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/local-church-membership-is-not-necessary-to-partake-of-the-sacraments/#:~:text=That%20all%20the%20members%20of%20the,his%20%5Bcongregationalist%5D%20friends%20in%20New%20England&amp;text=That%20all%20the%20members%20of%20the%20catholic%20Church&amp;text=he%20deserts%20his%20%5Bcongregationalist%5D%20friends%20in%20New%20England" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-db606a2cdc" data-kw="">
<blockquote><p>And upon the first day of the week, when the disciples came together to break bread, Paul preached unto them… and continued his speech until midnight… And there sat in a window a certain young man named Eutychus, being fallen into a deep sleep: and as Paul was long preaching, he sunk down with sleep, and fell down from the third loft, and was taken up dead. And Paul went down, and fell on him, and embracing him said, Trouble not yourselves; for his life is in him. When he therefore was come up again, and had broken bread, and eaten, and talked a long while, even till break of day, so he departed.” (Acts 20:7[-11]) Where we see that upon the Lord’s Day, when this casualty fell out even in the midst of God’s worship, and a little before the sacrament, that the congregation was for a time dissolved, and Paul the preacher, and the rest of the people, the hearers, came forth to succor this man, and then returned to perform the rest of God’s service that remained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-bownd.html">Nicholas Bownd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of the Sabbath</cite>, …</span></figcaption>

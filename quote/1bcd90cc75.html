<blockquote><p>Evan. In this commandment the Lord forbiddeth idleness or sleeping more on the Lord’s day in the morning, than is of necessity, (Matt 20:6); and he also forbiddeth us to labour in our particular callings, (Exo 16:28-30); and he also forbiddeth us to talk about our worldly affairs and business on that day, (Amos 8:5, Isa 58:13); and he also forbiddeth us to travel any journey about our worldly business on that day, (Matt 24:20); or keep any fairs or markest on that day, (Neh 13:16,17); or to labour in seed time and harvest on that day. In a word, the Lord on that day forbiddeth all worldly works and labours, except works of mercy and instant necessity, which were mentioned before. And thus have I also declared, both what the Lord requires and what he forbids in the fourth commandment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1646) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), vii, 418-19.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-132618e73c" data-kw="">
<blockquote><p>A second sort of works allowed to be done on the Lord’s day: are bodily works and labors which are so necessary for the fitting and enabling of Christians to sanctify that day, and for bringing them unto holy and public assemblies and places of prayer and of God’s worship and holy service, that without such working and laboring even on that day they neither can be so fit and able to serve God joyfully, and to worship Him with cheerful hearts… And because men cannot be so cheerful in the service of God, nor so heartily rejoice before Him, not with strength and delight spend the whole day in Sabbath duties, without warm and wholesome food, and plentiful refreshing of their weak bodies, therefore the dressing, boiling, baking and roasting of meat is lawful on the Lord’s day, so far as it more helps than hinders holy duties and the service of God. This is manifest by the words of the law, Ex. 12:16, where the Lord forbidding all manner of work on his holy Sabbaths, excepts labour and work about that which people were to eat, and which was necessary for the upholding of an holy moderate feasting on those days. This was practised by the Pharisees and by our Saviour and his apostles who on the Sabbath day came to a feast to the house of a chief Pharisee, Lk. 14:1.2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath</cite>, … (Amsterdam, 1638), ch. 21, p. 152. Walker was a Westminster divine.</span></figcaption>

<blockquote><p>Therefore we shall learn out of this Scripture what things may lawfully be done of us without the breach of the commandment of rest. First of all such bodily labors are permitted, as do immediately and directly concern the worship of God, and without the which He cannot be served of us according to his Word: For this cause it was permitted unto the priests, nay they were commanded to slay beasts, and to prepare them for sacrifices, and offer them up according to the law, about the which they took so much the more pains upon that day than upon any other [day] of the week by how much the sacrifices were increased: for besides the daily sacrifices, morning and evening, there was a special sacrifice for the Sabbath, and all this being commanded in the law, our Savior Christ says [that] they in doing of it were blameless; therefore, whereas He says that the priests in the Temple break the Sabbath, He does not mean that they did so indeed: (For He affirms that they are blameless), but speaking according to the meaning of the Pharisees, who would condemn the fact of his disciples in gathering the ears of corn to satisfy their hunger, says, if every bodily labor be a breach of the Sabbath, then the priests in the temple brake it, but they are blameless in so doing; therefore they brake it not. Thus we do grant that men may travail [put forth work] to the places of Gods worship, where the public assemblies and meetings of the Church be, because otherwise they cannot join with them in the communion of the Word, sacraments and prayer, and though they be far distant in situation of dwelling from the common place of meeting, yet it is permitted unto them to travail by land, or by water, on horseback, or on foot thereunto; nay they are commanded to do it, and they may not under the color of a long journey tarry at home idly taking their ease. For even as the slaying of beasts is merely in its own nature a worldly and bodily labor, yet the temple which was sanctified did change the nature of it, and made it holy: so to travail and to ride, or go to and fro upon the Sabbath is altogether painful, and laborsome to the body, but to take this pains, to preach or to hear the word, makes it an holy work, and is warranted by the Scripture: as in this very place [Mt. 12:1-9], we see how our Savior Christ and his disciples travail from town to town to preach the Gospel, and take such pains that they are hungry and faint in the way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-bownd.html">Nicholas Bownd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath Plainly Laid forth</cite>, … (London, 1595), pt. 1, pp. 104-5</span></figcaption>

<blockquote><p>…young men who would ‘endure long and hard labor in so much that after twelve hours hard work they will go in the evening to football, stoole ball, cricket, prison-base, wrestling, cugel throwing, or some such like vehement exercise.&#x27;” 7 Richard Baxter maintained that the argument from lack of spare time on week-days was a “sad argument to be used by them that by racking of rents do keep them (laboring people) in poverty.”8 The Puritan protest against Sabbath profanation was also a protest against overwork on the other six days of the week. But the truth is, it is not the minds of poor laboring men, that are overworked and tired on week-days, but it is their bodies; and therefore there is no recreation so suitable to them as the ease of the body, and the holy and joyful exercise of the mind, upon their Creator, and their Redeemer, and their everlasting rest.9 1 Bownd, Sabbathum Veteris, p. 271; cf. Dudley Fenner, A Short and Profitable Treatise, of lavvful and unlavvful Recreations; William Perkins, 1558-1602: English Puritanist, ed. by Thomas F. Merrill (Nieuwkoop, 1966), pp. 217-22 with extracts from Perkins’ The Whole Treatise of Cases of Conscience, Book 3. 2 Elton, An Exposition of the Ten Commandments, pp. 54-56; George Walker, The Doctrine of the Holy Weekly Sabbath (London, 1641), p. 157; Richard Baxter, The Divine Appointment of the Lord’s Day, pp. 440, 444-445. 3 Cf. Nicolas Bifield (Byfield), The Beginning of the Doctrine of Christ, or, A Catalogue of Sinnes (London, 1636), p. 63. 4 For a survey of the relative truth of this point, see Carl Bridenbaugh, Vexed and Troubled Englishmen, 1590-1642 (New York, 1968), pp. 109-118. 5 John Dod and Robert Cleaver, A Plaine and Familiar Exposition of the Ten Commandments (London, 1628), p. 140. 6 Percy Scholes (The Puritans and Music in England and New England(London, 1934), pp. 104-111) mentions the provisions of a bill presented to Parliament in 1647 which allowed every other Tuesday to be designated as a holiday. Scholes’ judicious treatment of the Puritan attitude toward recreation is refreshing as well as accurate; cf. also pp. 302-331. Compare Hugh Martin, Puritanism and Richard Baxter (London, 1954), pp. 101-106. 7 Bridenbaugh, Vexed, p. 115. 8 Baxter, Divine Appointment, p. 444. 9 Ibid., p. 445.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-44c5e69a32" data-kw="">
<blockquote><p>Thesis VIII: In the meantime, we do not agree with Nominalists who think that universals are purely nominal. For not only do we admit that things exist before the operation of the mind, which are called universals, as they also concede, but we also admit that there is in things the foundation of universality without the operation of the mind, namely, that exact similarity of many individuals of the same species in formal unity, which they do not concede. In this, we also differ from Scotus, who wants that exact similarity of many individuals in formal unity to be true unity, and thus, universal unity itself. However, we assert that, as singular individuals are per se one thing, and this not only by numerical unity but also by formal unity, we genuinely deny that the natures of many individuals without the operation of the mind are one nature. We acknowledge some similarity and agreement but not unity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/franco-burgersdijk.html">Franco Burgersdijk</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutionum Metaphysicarum</cite>, ch. 13, “On Universal Unity” tr. T.J. Floyd</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-438aa6076f" data-kw="">
<blockquote><p>Material and formal cause, properly so called, does not have place in accidents, although by some all beings promiscuously, whether substances or accidents, are wont to be explained through four kinds of causes. Yet if anyone wishes to form analogical concepts of it [regeneration] after the manner of physical generation, let him consider:

I. The Holy Spirit as the one generating, 1 Jn. 5:1.

II. The transient matter or matter of generation, the Word of God, which is compared to seed, 1 Pet. 1:23.

III. The proximate constituting matter, the intellect.

IV. The form, faith or the new creature.

V. The composite from man’s intellect with will and from the image of God or new creature: let it be the new man, the man of God, the spiritual man.

VI. That introduced form informs and actuates the matter, and thus renders man active for spiritual life; moreover constitutes him in a certain kind of things and distinguishes him from all other men not regenerate; finally renders him fit for every good work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 432-65 Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-8a2d08d603" data-kw="">
<blockquote><p>I do not think he [the Romanist Leiden philosopher, David Stuart] wanted to stop our theologians, whether his or ours, from dealing with any questions that can be demonstrated not just from God’s Word, the first principle, but also from the light of nature and right reason, the second principle… Our [reformed] theologians should not be excluded from dealing with these same questions, since they never set aside the sciences and arts, especially logic and metaphysics, which they intensely studied in school and at home. Nor do they, above the Papists, become dull to the use of reason and the knowledge of first philosophy out of reverence for and study of the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation on the Ways of Knowing God, pt. 1</cite>, tr. Michael Lynch (1665)</span></figcaption>

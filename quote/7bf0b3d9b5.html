<main class="wrap"><figure class="quote" id="q-7bf0b3d9b5" data-kw="">
<blockquote><p>John Calvin argued that, prior to the Reformation,

Satan lay idle and luxuriated in deep repose. For what else had he to do but jest and sport, in tranquil and peaceable possession of his kingdom? Yet when the light shining from on high in a measure shattered his darkness, when that “strong man” had troubled and assailed his kingdom [cf. Luke 11:22], he began to shake off his accustomed drowsiness and to take up arms. And, first, indeed, he stirred up men to action that thereby he might violently oppress the dawning truth. And when this profited him nothing, he turned to stratagems: he aroused disagreements and dogmatic contentions through his catabaptists and other monstrous rascals in order to obscure and at last extinguish the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian religion</cite>, ed. J. T. McNeill, trans. F. L. Battles (Westminster Press edn, Philadelphia, 1960), prefatory address to the King of France, p. 28.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-98e749d745" data-kw="">
<blockquote><p>Naturally, therefore, this sign and seal belongs only to those who are the Lord’s. Or, to put it rather in the positive form, this sign and seal belongs to all those who are the Lord’s. There are no distinctions of race or station, sex or age; there is but one prerequisite—that we are the Lord’s. What it means is just this and nothing else: that we are the Lord’s. What it pledges is just this and nothing else: that the Lord will keep us as his own. We need not raise the question, then, whether infants are to be baptized. Of course they are, if infants, too, may be the Lord’s. Naturally, as with adults, it is only the infants who are the Lord’s who are to be baptized; but equally naturally as with adults, all infants that are the Lord’s are to be baptized. Being the Lord’s they have a right to the sign that they are the Lord’s and to the pledge of the Lord’s holy keeping. Circumcision, which held the place in the old covenant that baptism holds in the new, was to be given to all infants born within the covenant. Baptism must follow the same rule. This and this only can determine its conference: Is the recipient a child of the covenant, with a right therefore to the sign and seal of the covenant? We cannot withhold the sign and seal of the covenant from those who are of the covenant.</p></blockquote>

</figure><figure class="quote" id="q-2b3f2cfaf8" data-kw="">
<blockquote><p>But we do exclude from baptism the children of those who clearly are strangers to the covenant, such as the children of heathens, Muslims, Jews, and of similar people… And for this reason we should leave them–like foreigners–to the judgement of God… unless they happen through lawful adoption or through the just and properly-designated status of slaves to be enrolled and taken up into the families of believers as though belonging to them.† For in this case many Reformed churches do baptize those children, because they deem that God has adopted them into the fellowship of his covenant in this manner, that is to say by the covenant of Genesis 17:12-13, which in the early church was so far beyond debate that from it Augustine on several occasions deduced a powerful argument against the Pelagians for election by grace. [On the Grace of Christ &amp; on Original Sin 2.35 in NPNF1 5.249-50] † This is a remarkable position, given the fact that the Synod of Dort had decided negatively on the issue in response to a question from East-India if it was allowed to baptize a child from pagan parents adopted into a Christian family. At the synod, the professors and the delegates from Zeeland, Friesland and Utrecht did not object to baptism, together with the majority of foreign delegates, but the delegates from Holland and Gelderland objected because human adoption does not imply divine adoption. Adopted children first had to profess faith and only then could be baptized, though as infants they could be commended to God’s gracious care by the laying-on of hands. See Acta of the Synod of Dordt, eds. Donald Sinnema, Christian Moser, and Herman Selderhuis (Gottingen: Vandenhoeck &amp; Ruprecht), 30-32.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, (1625; Brill, 2020), vol. 2, Disputation 44, ‘On the Sacrament of Baptism’, section 49, p. 165</span></figcaption>

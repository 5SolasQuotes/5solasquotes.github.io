<main class="wrap"><figure class="quote" id="q-c0b7e3aec0" data-kw="">
<blockquote><p>Legal and of Works, which stands in that conformity unto God’s law, which is inherent within ourselves, when in our own persons and works we possess and practise that righteousness which is required of the Law. …

Evangelical, and of Faith, which is such a conformity to God’s Law as is not inherent in our own persons; but being in another is imputed unto us and reckoned ours. The righteousness of the Law, and of the Gospel, are not two several kinds of righteousness; but the same in regard of the matter and substance thereof: only they differ in the Subject and Manner of application. The righteousness of works is that holiness and obedience which is inherent in our own persons and performed by ourselves: the righteousness of Faith is the same holiness and obedience inherent in the person of Christ and performed by him; but embraced by our faith, and accepted by God, as done in our stead, and for our benefit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae fidei, or A treatise of justification by faith wherein that point is fully cleared, and vindicated from the cavils of it’s adversaries. Delivered in certain lectures at Magdalen Hall in Oxford</cite>, (Oxford: John Lichfield, 1625), pp 2, 3.</span></figcaption>

<blockquote><p>…and it is most certain that angelical persons have a limited presence, because they have a finite essince [as opposed to God]… I need say no more concerning angels than what is commonly said, ‘Angeli sunt alicuoi definitive; sunt enim in suo ubi non per operationem vel circumscriptionem, sed per designationem definitivam,’ angels are naturally somewhere; though they are not in any place by extension of parts, yet their finite nature is contained within certain bounds and limits. Hence it is that some learned men affirm that it is improper to say, that God is somewhere because He is everywhere; somewhere is a definitive word.</p></blockquote>

</figure><figure class="quote" id="q-8e8de8874b" data-kw="">
<blockquote><p>VIII. Furthermore, the nature of this eternity [of God] will be made further known to us if we consider that there are, in total, three measures of duration. The first belongs to things that by their nature are mutable and that wear out. It possesses a beginning and an end, and it is called ‘time’. Its nature consists in a continuous succession of moments, such that properly speaking not but one moment exists at a time, and only when the preceding moments have ceased to exist and the following moments do not yet exist. In this measure of duration it is proper to observe periods: the past, the present, and the future. The second measure of duration belongs to things that by their essence are incorruptible or immaterial. It has a beginning but it is without end, and it is named ‘forever’ [aevum]. The third measure is simply immutable, and thus it lacks beginning, end and succession. And only this measure is that eternity which the Scholastics define as “interminable, indivisible, and independent duration”: “interminable,” meaning that it lacks both outer boundaries; “indivisible,” meaning that it also lacks succession; and finally, “independent,” meaning that it lacks all imperfection and change. Thus in this eternity, three things come together: the absence of a beginning, the absence of an end (which all admit), and the absence of succession. This last absence Vorstius [an Arminian] as well as the Socinians deny, and we will demonstrate and vindicate it in the elenctic part.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, ed. Joel Beeke, tr. Todd Rester (RHB, 2021), vol. 2, bk. 2, ch. 11, The Eternity of God, p. 217</span></figcaption>

</figure><figure class="quote" id="q-cdcba31500" data-kw="">
<blockquote><p>Q. 23. Is it lawful, as some plead, to have images or pictures in churches, though not for worship, yet for instruction, and raising the affections? No; because God has expressly prohibited not only the worshipping but the MAKING of any image whatever on a religious account; and the setting them up in churches, cannot but have a natural tendency to beget a sacred veneration for them; and therefore ought to be abstained from, as having at least an “appearance of evil,” Isa. 45:9-18; 1 Thess. 5:22. Q. 24. May they not be placed in churches for beauty and ornament? No; the proper ornament of churches is the sound preaching of the gospel, and the pure dispensation of the sacraments, and other ordinances of divine institution. Q. 25. Were not the images of the cherubims placed in the tabernacle and temple, by the command of God himself? Yes; but out of all hazard of any abuse, being placed in the holy of holies, where none of the people ever came: they were instituted by God Himself, which images are not; and they belonged to the typical and ceremonial worship, which is now quite abolished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fisher.html">James Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Assembly’s Shorter Catechism Explained</cite>, (1753)</span></figcaption>

<blockquote><p>Evangelical,” on the other hand, although it is a fine term, does not quite seem to designate clearly enough the position of those who hold specifically to the system of doctrine taught in the Westminster Confession of Faith, as distinguished from other systems which are near enough to the truth in order that they may be called “evangelical” but which yet fall short of being the system that is contained in God’s Word.</p></blockquote>

<blockquote><p>Though a penitentiary kneel to God purposely in the presence and sight of the congregation, that he may make known to them his repentance for the sin whereby he has scandalized them, yet is the confessing of his sin to God kneeling there upon his knees, an immediate worship, neither does the congregation come betwixt him and God as belonging to the substance of this worship, for he kneels to God as well and makes confession of his sin when the congregation is not before him. But I suppose our kneelers themselves will confess that the elements come so betwixt God and them when they kneel that they belong to the essence of the worship in hand, and that they would not, nor could not worship the flesh and blood of Christ in the sacrament if the elements were not before them. To be short, the case of a penitentiary stands thus, that not in his kneeling simpliciter, but in his kneeling publicly and in sight of the congregation, he sets them before him, purposely and with a respect to them: Whereas our kneelers do kneel in such sort that their kneeling simpliciter, and without an adjection or adjunct, has a respect to the elements purposely set before them, neither would they at all kneel, for that end and purpose for which they do kneel, namely, for worshipping the flesh and blood of Christ in the sacrament, except the elements were before the eyes both of their minds and bodies; as the penitentiary does kneel, for making confession of his sin to God, when the congregation is not before him. … For the very kneeling itself (simply considered) before the elements, respects them as then purposely set in our sight, that we may kneel before them: whereas in the case of the penitentiary, it is not his kneeling to confess his sin to God, which has a respect to the congregation as set in his sight for that purpose; But some circumstances of his kneeling only, to wit, When? At that time when the congregation is assembled; and where? Publicly in sight of the congregation. In regard of these circumstances, he has the congregation purposely in his sight, and so respects them; But in regard of the kneeling itself simply, the presence of the congregation is but accidental to him who kneels, and confesses his sin before God. As touching giving thanks before the meat set on our common tables, though a man should do it kneeling, yet this speaks not home to the point now in controversy, except a man so kneel before his meat, that he have a religious respect to it, as a thing separated from a common use and made holy, and likewise have both his mind and his external senses of seeing, touching, and tasting fastened upon it in the act of his kneeling. And if a man should thus kneel before his meat, he were an idolater. Lastly, giving thanks before the elements of bread and wine in the beginning of the holy action, is as far from the purpose: For this giving of thanks is an immediate worship of God wherein we have our minds and senses not upon the bread &amp; wine, as upon things which have a state in that worship of the Lord’s Supper, and belong to the substance of the same (for the very consecration of them to this use, is but then in fieri), but we worship God immediately by prayer and giving of thanks: Which is all otherwise in the act of receiving [the bread and wine].</p></blockquote>

<blockquote><p>§41. 2. And for kneeling at the sacrament, I doubt not at all but the imposing it, and that on such rigorous terms, tying all to it and casting all out of the communion of the Church or from the participation of the sacrament that durst not use it, was a very grievous sin and tended to persecution, injustice and Church-dividing. It is certainly in a doubtful case the safest way to do as Christ and his apostles, and the universal Church did for many hundred years. That none should kneel in public worship on the Lord’s Day, no not in prayer, much less in receiving the eucharist, was a Custom so ancient and universal in the Church, that it was everywhere observed before general councils were made use of; and in the first general Council of Nicea it was made the last canon; and other general councils afterward renewed it; so that I know not how any ceremony can possibly pretend to greater ecclesiastical authority than this had. And to cast out all from Church communion in sacraments that dare not go against the examples of Christ and his apostles, and all the primitive Church (who long received the eucharist in another gesture) and against the canons of the first and most famous, and other succeeding general councils, this is a most inhumane part. Either the gesture is indifferent in itself or not: If it be, how dare they thus divide the Church by it and cast out Christians that scruple it when they have these and many other reasons of their scruples (which for brevity I omit). If they say that kneeling is of itself necessary, and not indifferent, because it is reverent etc. then: 1. They make Christ an imperfect Lawgiver: 2. They make Himself or his apostles, or both to have been sinners. 3. They condemn the catholic Church of sin. 4. They condemn the canons of the chief general councils. 5. And then if the bishops themselves in council should change the gesture, it were unlawful to obey them. All which are consequents that I suppose they will disown. What a perverse preposterous reverence is this? when they have leave to lie in the dust before and after the very act of receiving, through all their confessions and prayers, yet they will at other times stand, and many of them sit at prayer, and sit at singing Psalms of Prayer and Praise to God, and yet when Christ doth invite them to a feast, they dare not imitate his apostles and universal Church in their gesture, lest they should be sinfully unreverent. §42. But yet, as sinfully as this gesture was imposed, for my part I did obey the imposer and would do if it were to do again, rather than disturb the peace of the Church, or be deprived of its communion. For God having made some gesture necessary and confined me to none, but left it to humane determination, I shall submit to magistrates in their proper work, even when they miss it in the manner. I am not sure that Christ intended the example of Himself and his apostles as obligatory to us that shall succeed. I am sure it proves sitting lawful: but I am not sure that it proves it necessary: (though very convenient). But I am sure He has commanded me obedience and peace.</p></blockquote>

<blockquote><p>4. As in serious prayer, specially in secret, the affections of the heart do utter themselves in the answerable gestures of the body, as well as in the voice and words of the mouth: so those gestures have their own speech unto God, no less than the words of the mouth have; as here, ‘I have stretched out my hands unto Thee,’ is brought forth to express his submissive rendering up of himself unto God and his dependance upon him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Explication of the Last Fifty Psalms from Ps. 100 to the End</cite>, (London, 1653), on Ps., 88:9</span></figcaption>

<div class="actions"><button class="copy" data-copy="“4. As in serious prayer, specially in secret, the affections of the heart do utter themselves in the answerable gestures of the body, as well as in the voice and words of the mouth: so those gestures have their own speech unto God, no less than the words of the mouth have; as here, ‘I have stretched out my hands unto Thee,’ is brought forth to express his submissive rendering up of himself unto God and his dependance upon him.”

— David Dickson, A Brief Explication of the Other Fifty Psalms, from Ps. 50 to Ps. 100 (London, 1653), on Ps., 88:9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+As+in+serious+prayer%2C+specially+in+secret%2C+the+affections+of+the+heart+do+utter+themselves+in+the+answerable+gestures+of+the+body%2C+as+well+as+in+the+voice+and+words+of+the+mouth%3A+so+those+gestures+have+their+own+speech+unto+God%2C+no+less+than+the+words+of+the+mouth+have%3B+as+here%2C+%E2%80%98I+have+stretched+out+my+hands+unto+Thee%2C%E2%80%99+is+brought+forth+to+express+his+submissive+rendering+up+of+himself+unto+God+and+his+dependance+upon+him.%E2%80%9D%0A%0A%E2%80%94+David+Dickson%2C+A+Brief+Explication+of+the+Other+Fifty+Psalms%2C+from+Ps.+50+to+Ps.+100+%28London%2C+1653%29%2C+on+Ps.%2C+88%3A9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff63f38128e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f63f38128e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/posture-in-prayer/#:~:text=4.%20As%20in%20serious%20prayer%2C%20specially,God%20and%20his%20dependance%20upon%20him&amp;text=4.%20As%20in%20serious%20prayer%2C%20specially%20in%20secret&amp;text=himself%20unto%20God%20and%20his%20dependance%20upon%20him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-eb76668911" data-kw="">
<blockquote><p>As for adoring of the ark and footstool of God: 1. Joan Gisenius, a Lutheran says, The Jews had precept and promise to worship God before the ark; we have no command to tie external adoration to any place or creature. 2. Didoclavius [David Calderwood] says, It is lawful to adore God before the ark, and the symbols of his immediate presence, because God is there to receive his own worship Himself, by an immediate indwelling presence: For says Mr. [John] Weames, He appeared in glory above the ark, betwixt the cherubims, and it was a type of Christ who dwelt in our flesh; but it is not lawful to worship Him before the symbols of his grace [the sacraments]. 3. The ark was a type in the act of teaching, we grant; but that it was in the act of adoring God who was immediately present, and a symbol vice-gerent of God, we read not. There is no need of mediate signs where God is immediately present and adored as He was in the ark; they were to fix both senses and thoughts immediately upon God. 4. They were to worship, not the ark, but the precept is, et incurvate vos scabello, Worship toward the ark. Arias Montanus turns it, ‘Worship to the ark’: The Greek fathers of the second Nicene Council, ignorant of the Hebrew Tongue, would have the Lord commanding to adore his footstool; whereas the particle [Hebrew] is a note of the dative case, and often it signifies motion to a thing, or at a place, [Hebrew] ad dextram, and does not absolutely signify the accusative case. Musculus, ‘ad Scabellum‘, he makes it the ark of the testament. Calvin, the Temple. Junius makes it well to signify the measure of bowing, bow to the footstool, or ground, or pavement of the Temple where the Lord’s feet are, as he sat on the cherubims, 1 Chron. 28:1. For there is no ground for adoring the ark, but the words are to be read, ‘Exalt the Lord our God, and bow yourselves’, (to wit, to Jehovah, who shows Himself, or dwells at his footstool), that is, betwixt the cherubims, 2 Sam. 6:1. For the word [Hebrew] at his footstool, is not constructed with the verb, [Hebrew] incurvate vos: Jesuits and Formalists devised that construction, but it is to be constructed with the word, which is to be repeated from the former part of the verse, Bow yourselves to Jehovah who dwelleth in the ark, or in the Temple: A familiar elipsis to the Hebrews, Ps. 5:8. I will bow myself (to the Jehovah dwelling) in the temple of thy holiness, as we are taught, ‘Our Father which art in Heaven’: So [Greek or Hebrew] and it is a description of God from the place where He dwelt, and exhibited his presence to his rude people. 4. It is ignorance in Burges to prove God may be adored in the elements, because they are as excellent symbols of God’s presence as the ark: for created excellency is no ground of adoring the elements, except it be a Godhead, and uncreated excellency: We condemn Pope Anastasius, who directs reverend bowing at the hearing of the Gospel, and not of the Epistles, as if the Gospel were holier than the Epistles.</p></blockquote>

%20of%20the%20ark%20and%20footstool&amp;text=if%20the%20Gospel%20were%20holier%20than%20the%20Epistles" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>It is not in the adorer’s power that kneeling should be a sign of lesse worship, as referred to the image, and of greater, as referred to God; for the same material kissing and religious rostration which would immediatly be conveyed to Christ if He were in person present in the image and elements, is done to the image and elements; and religious kissing and religious kneeling signifies internal divine submission of heart to God, as the First Author of all and the last end, not by man’s will, but by divine institution.</p></blockquote>

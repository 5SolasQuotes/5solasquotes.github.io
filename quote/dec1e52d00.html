<main class="wrap"><figure class="quote" id="q-dec1e52d00" data-kw="">
<blockquote><p>No man was ever questioned by God for having too much grace; we may all complain of too little: More grace is the constant desire of every holy soul as there is a propensity in God to give it; ‘To him that has, more shall be given’: God loves to accumulate his favors, to load us with his benefits; he gives liberally that He may draw out our hope to follow Him for more and more still. ‘Let us then abound in hope, holding fast our confidence firm unto the end.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cole.html">Thomas Cole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Christian Religion... (London: R.R., 1692), Christ the Hope of Glory, ch. 6</cite>, p. 112</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>2. The next thing in God is love, and that arises from goodness. The goodness that is in God inclines Him to love, and to be the most profuse lover. You read in 1 John 4:7-8, ‘God is love.’ The question is whether this speech does not import that He is love in Himself, as well as that He shows love. There are these reasons why it imports what He is in Himself, when He says, ‘God is love.’ Says He, verse 7, ‘Every one that loves is born of God, and knows God,’ that is the affirmative; and verse 8, ‘He that loves not knows not God, for God is love’; that is, he knows not God in what is most proper to Him, as to what does most abound in Him, for God is love. We ordinarily say of a man that is of such a disposition, I know him, he is so and so; so the believer knows God to be love… He speaks it of his love, which none sees but as manifest by effects; but God is love essentially. Says Aquinas, Whoever has a will, has a proneness to love. Says Musculus, As every one is in goodness, so in love. If God then has a will inclined to anything, it is to love; He has hatred in Him to sin, He has the opposite: He has a love also to something, only it is guided by his will towards creatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Object &amp; Acts of Justifying Faith, pt. 1, bk. 1, ch. 8, on Ex. 34:6-7 in The Works (d. 1680; Edinburgh: James Nichol, 1864), vol. 8</cite>, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-ba65e7d881" data-kw="">
<blockquote><p>The sum of this study of these passages in Matthew and Luke [6:35-36] is simply this, that presupposed in God’s gifts bestowed upon the ungodly there is in God a disposition of love, kindness, mercifulness, and that the actual gifts and the blessing accruing therefrom for the ungodly must not be abstracted from the lovingkindness of which they are the expression. And, of course, we must not think of this lovingkindness as conditioned upon a penitent attitude in the recipients. The lovingkindness rather is exercised towards them in their ungodly state and is expressed in the favours they enjoy. What bearing this may have upon the grace of God manifested in the free offer of the gospel to all without distinction remains to be seen. But we are hereby given a disclosure of goodness in the heart of God and of the relation there is between gifts bestowed and the lovingkindness from which they flow. And there is indicated to us something respecting God’s love or benevolence that we might not or could not entertain if we concentrated our thought simply on the divine decree of reprobation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Report of the Committee on the Free Offer of the Gospel presented to the Fifteenth (1948) General Assembly of the Orthodox Presbyterian Church’ | Matthew</cite>, 5:44–48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

probation&amp;text=The%20sum%20of%20this%20study%20of%20these%20passages&amp;text=thought%20simply%20on%20the%20divine%20decree%20of%20reprobation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>1. The first ground is the Lord’s disposition and nature of mercy and placableness towards a poor sinner, which gives him footing for his hope abundantly in any particular case, as: (1.) From his Name and attributes, whereby He has made Himself known to his people. God proclaims his Name to Moses to be ‘the Lord, the Lord God, the powerful, the mighty Jehovah’ (Ex. 34 [vv. 6-7]), which ministers comfort when annexed to his manifestation of Himself in this way of mercy. ‘Merciful,’ inclined to pity the sin and misery of his people, ready to relieve them in their distress and not only just to require the due service and punish the defaults; ‘Gracious,’ of an affable condescending descending nature, not standing upon the distance that He is in as a great King above all his creatures; He may be petitioned, sought unto and prevailed with by his poor suitors. ‘Long-suffering,’ that is, not hasty to use severity with the worst of sinners, usually taking all other ways first with them, willing that all men should repent and come to the knowledge of the truth (1 Tim. 2:4): Trying many that repent not with much goodness to draw them to it. Enduring with much patience the very vessels of wrath before He brings destruction on them (Rom. 9:22). In all cases He forgives iniquity, transgression and sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-newcome.html">Henry Newcome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sinner’s Hope... (London: E.C., 1660 [1659]), ch. 4</cite>, pp. 25-27</span></figcaption>

<blockquote><p>But God (says Simon Magus) would not that Adam should have eaten of the forbidden fruit, who nevertheless did eat of that fruit; it follows therefore that he remained not as his Creator would have had him to have remained; how then can God be omnipotent, or his will always fulfilled? It were necessary, if we should fully satisfy this argument, to entreat more largely of the will of God than were convenient for this place: wherefore, that we may briefly answer this objection, we must presuppose with the school-divines a threefold distinction of the will of God, according to the diversity of their proper objects:¹ the first they call his efficient, effectual, or working will, by which God does so effectually intend anything that He performs it actually by some external operation and work, either actually produced or to be produced. ¹ Aquinas, [Summa] pt. 1, quest. 19; the same: Molina, Vasquez, Suarez, Sumel, Bannez and many others. The other kind of will which the divines distinguish in God, in regard of some objects which He does not really produce, is called inefficax voluntas, a kind of propension or inclination of his divine will to the effectuating of any good effect, which might redound to the felicity of man: yet for the attaining of the end, which out of his unsearchable wisdom He has prefixed, He oftentimes permits the contrary to this his divine inclination and will; the which therefore is called God’s permissive will. As for example, God would that all men should be saved, according to that of the apostle [1 Tim. 2:4], Deus vult omnes homines saluos fieri; to wit, in his universal grace, calling and inspirations and other general means, offered to all, so that out of his infinite goodness He wishes and wills in this sort all to be saved; and that He might the more manifest his infinite mercy by the efficacy of his working will, He actually saves some; even so, to manifest his justice by his other permissive decree, He permits others to work their own ruin and eternal damnation.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But God (says Simon Magus) would not that Adam should have eaten of the forbidden fruit, who nevertheless did eat of that fruit; it follows therefore that he remained not as his Creator would have had him to have remained; how then can God be omnipotent, or his will always fulfilled? It were necessary, if we should fully satisfy this argument, to entreat more largely of the will of God than were convenient for this place: wherefore, that we may briefly answer this objection, we must presuppose with the school-divines a threefold distinction of the will of God, according to the diversity of their proper objects:¹ the first they call his efficient, effectual, or working will, by which God does so effectually intend anything that He performs it actually by some external operation and work, either actually produced or to be produced. ¹ Aquinas, [Summa] pt. 1, quest. 19; the same: Molina, Vasquez, Suarez, Sumel, Bannez and many others. The other kind of will which the divines distinguish in God, in regard of some objects which He does not really produce, is called inefficax voluntas, a kind of propension or inclination of his divine will to the effectuating of any good effect, which might redound to the felicity of man: yet for the attaining of the end, which out of his unsearchable wisdom He has prefixed, He oftentimes permits the contrary to this his divine inclination and will; the which therefore is called God’s permissive will. As for example, God would that all men should be saved, according to that of the apostle [1 Tim. 2:4], Deus vult omnes homines saluos fieri; to wit, in his universal grace, calling and inspirations and other general means, offered to all, so that out of his infinite goodness He wishes and wills in this sort all to be saved; and that He might the more manifest his infinite mercy by the efficacy of his working will, He actually saves some; even so, to manifest his justice by his other permissive decree, He permits others to work their own ruin and eternal damnation.”

— John Salkeld, A Treatise of Paradise… (London: Griffin, 1617), ch. 64, pp. 319-21 Salkeld (1576–1660) was born in England, studied with Jesuits in the university of Coimbra and in Portugal, but had become a protestant again living in England by the time of this work.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+God+%28says+Simon+Magus%29+would+not+that+Adam+should+have+eaten+of+the+forbidden+fruit%2C+who+nevertheless+did+eat+of+that+fruit%3B+it+follows+therefore+that+he+remained+not+as+his+Creator+would+have+had+him+to+have+remained%3B+how+then+can+God+be+omnipotent%2C+or+his+will+always+fulfilled%3F+It+were+necessary%2C+if+we+should+fully+satisfy+this+argument%2C+to+entreat+more+largely+of+the+will+of+God+than+were+convenient+for+this+place%3A+wherefore%2C+that+we+may+briefly+answer+this+objection%2C+we+must+presuppose+with+the+school-divines+a+threefold+distinction+of+the+will+of+God%2C+according+to+the+diversity+of+their+proper+objects%3A%C2%B9+the+first+they+call+his+efficient%2C+effectual%2C+or+working+will%2C+by+which+God+does+so+effectually+intend+anything+that+He+performs+it+actually+by+some+external+operation+and+work%2C+either+actually+produced+or+to+be+produced.+%C2%B9+Aquinas%2C+%5BSumma%5D+pt.+1%2C+quest.+19%3B+the+same%3A+Molina%2C+Vasquez%2C+Suarez%2C+Sumel%2C+Bannez+and+many+others.+The+other+kind+of+will+which+the+divines+distinguish+in+God%2C+in+regard+of+some+objects+which+He+does+not+really+produce%2C+is+called+inefficax+voluntas%2C+a+kind+of+propension+or+inclination+of+his+divine+will+to+the+effectuating+of+any+good+effect%2C+which+might+redound+to+the+felicity+of+man%3A+yet+for+the+attaining+of+the+end%2C+which+out+of+his+unsearchable+wisdom+He+has+prefixed%2C+He+oftentimes+permits+the+contrary+to+this+his+divine+inclination+and+will%3B+the+which+therefore+is+called+God%E2%80%99s+permissive+will.+As+for+example%2C+God+would+that+all+men+should+be+saved%2C+according+to+that+of+the+apostle+%5B1+Tim.+2%3A4%5D%2C+Deus+vult+omnes+homines+saluos+fieri%3B+to+wit%2C+in+his+universal+grace%2C+calling+and+inspirations+and+other+general+means%2C+offered+to+all%2C+so+that+out+of+his+infinite+goodness+He+wishes+and+wills+in+this+sort+all+to+be+saved%3B+and+that+He+might+the+more+manifest+his+infinite+mercy+by+the+efficacy+of+his+working+will%2C+He+actually+saves+some%3B+even+so%2C+to+manifest+his+justice+by+his+other+permissive+decree%2C+He+permits+others+to+work+their+own+ruin+and+eternal+damnation.%E2%80%9D%0A%0A%E2%80%94+John+Salkeld%2C+A+Treatise+of+Paradise%E2%80%A6+%28London%3A+Griffin%2C+1617%29%2C+ch.+64%2C+pp.+319-21+Salkeld+%281576%E2%80%931660%29+was+born+in+England%2C+studied+with+Jesuits+in+the+university+of+Coimbra+and+in+Portugal%2C+but+had+become+a+protestant+again+living+in+England+by+the+time+of+this+work.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2d590d39b0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2d590d39b0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=But%20God%20%28says%20Simon%20Magus%29%20would,their%20own%20ruin%20and%20eternal%20damnation&amp;text=But%20God%20%28says%20Simon%20Magus%29%20would%20not%20that&amp;text=to%20work%20their%20own%20ruin%20and%20eternal%20damnation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

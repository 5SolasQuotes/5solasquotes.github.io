<main class="wrap"><figure class="quote" id="q-ed8e95db28" data-kw="">
<blockquote><p>In an article on capital punishment in the Philadelphia Covenanter periodical (not to be confused with the Belfast Covenanter), edited by James M. Willson, the author contrasted the Gnostic or Marcionite view of the Old Testament’s penal laws held by John Paul, with the true Covenanter position adhered to by Thomas Houston:

Were the law which God gave to Moses admitted authority, there would be an end of this controversy [over capital punishment]; but the prevailing sentiment of the present day seems to be that of the Gnostics, who taught that the God of Israel was the devil, and that Jesus Christ came to destroy his power, and deliver men from his tyranny! The editor of the New York Tribune is wonderfully scandalized at being charged with infidelity; and yet he quotes, without remark, a passage from the Lynn Record, in which an “eye for an eye,” &amp;c., is termed infernal policy! Dr. Paul, of Ireland, (once a Covenanter,) calls the laws of the Old Testament Thomas Houston’s bloody laws! In this he offers a double insult to the Divine Majesty; first, in calling his laws bloody; secondly, by calling them Thomas Houston’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Jan. 1847, pp 163-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-54003c0f60" data-kw="">
<blockquote><p>The practice of the ancient heathen rulers furnishes an argument for the public support of religion that ought not to be ignored. Ignorant as they were of supernatural revelation, they were necessarily thrown on the light of nature for direction. In such circumstances we have a right to apply the principle laid down by the Apostle Paul, when arguing with the Corinthians – “Doth not even nature teach you?”

Ignorant as they were of the true religion, the ancient heathen nations had an idea of the value and influence as a means of social improvement. However much their false religions may have failed as to the end proposed, their example shows at least that even the light of nature, dim as it is, suggests the obligation, to provide for the religious instruction of the community. …

The argument from the light of nature may not consistently be set aside as irrelevant by those who reject the authority of Scripture, claiming that civil government is founded in the law of nature, and that the light of nature is adequate for its administration. Mistaken as such are on this latter point, their own avowed principles demand of them an admission of the obligation of the civil magistrate to provide for the instruction of the people, as indicated by the light of nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Public Support of Religion in Reformed Presbyterian and Covenanter</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</a></div>
</figure><figure class="quote" id="q-258c414b3b" data-kw="">
<blockquote><p>But this right [of the civil government], as far as [it] pertains to its exercise in respect of the infliction of punishment, either tends to the good of the whole republic, as in ordinary cases, or, as in some extraordinary cases, gives place to its hurt; for it is possible that even the exaction of punishment, in a certain condition of a state, may be hurtful. In such a situation of things, the ruler or magistrate has a power not to use his right of government in respect of particular crimes; or rather, he ought to use it in such a manner as is the most likely to attain the end; for he is bound to regard principally the good of the whole and the safety of the people ought to be his supreme law. But he who affirms that in ordinary cases, a magistrate may renounce his right, when that renunciation cannot but turn out to the hurt of the public good, is a stranger to all right.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertation on Divine Justice</cite>, pp. 567-8 of A Dissertation on Divine Justice... ch. 9 in Works, vol. 10</span></figcaption>

</figure><figure class="quote" id="q-6c1d14f854" data-kw="">
<blockquote><p>Finally, it is to be noted that though in some things we may and do commendably refuse obedience to the laws of those whom God has set over us, yet are we ever obliged (and accordingly intend) still to subject ourselves unto them. For to be subject, does signify (as Zanchius shows [Commentary on Eph. 5, on Subject.]) to be placed under, to be subordinate, and so to give honor and reverence to him who is above, which may well stand without obedience to every one of his laws. Yea and Dr. Field [an Anglican] also tells us, that subjection is generally and absolutely required, where obedience is not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, … (1637), | ‘To All &amp; Every One in the Reformed Churches…’, no page number</span></figcaption>

<main class="wrap"><figure class="quote" id="q-25831a8bc0" data-kw="">
<blockquote><p>The practices of many decent worldly men in our community, who, though they make no profession of practical piety, yet claim to be cordial respecters of religion, and to be friendly to the Sabbath; and the habits of some inconsistent professors of religion, in regard to the observance of this sacred day; are such as well deserve their serious consideration. They allow that the Sabbath is a divine institution, and of inestimable importance. That, as it secures a regular suspension, one day in seven, of worldly labour; a careful cleansing from the dust and dirt of the week, and appearing in decent habiliments; a serious and orderly attendance on public worship; and an opportunity of the most favourable kind for meditating on moral and spiritual subjects; it ought to be countenanced and maintained by every well-wisher to human happiness.

Yet they argue and act upon the principle, that what is called the “strict” method of sanctifying the Sabbath is not binding upon Christians at present. But that, after the usual attendance on public worship, it is innocent and useful to indulge in a little relaxation—in social visiting—in riding abroad for health and pleasure—and in moderate, well-regulated feasting with select friends. To these things they frequently add, the perusal of newspapers and novels, the writing of letters on business, and the various forms of private and social amusement which are adapted to kill time, and to obviate the intolerable weariness which the exercises of religion are apt to induce in the minds of those who have but little taste for them.

Could such persons take even a glance, with Christian eyes, at the natural and unavoidable consequences of their conduct; could they trace with intelligence and candour the immediate and obvious effects of the indulgences which they think so innocent; they could not possibly fail of coming to the conclusion, that their habits are essentially hostile to the best interests of religion and society. Are not their social visiting, their rides of pleasure, and their luxurious feasting, adapted to turn away their minds from the spiritual employments which ought to occupy the day, and to diminish their taste for such occupations?

When such amusements immediately follow the public service of the sanctuary, Do they not tend to banish from the mind all those serious impressions which that service may have induced? Do not all these dissipating employments necessarily occupy servants, and compel them to be absent from the house of God, to engage in servile labour, often as great, and sometimes much greater, than is common on the secular days of the week, and thus cut them off from all the advantages of the Sabbath? And can any one doubt that even the short hours which those who indulge in these habits actually spend in the sanctuary of God, are rendered much less profitable, if their profit be not wholly destroyed, by the dissipating influence of social amusements, or by the heaviness which is the natural consequence of luxurious feasting?

In short, is it not evident that these encroachments on the appropriate sanctification of the Sabbath, are not merely adapted to rob God of a large part of that holy time which he claims as his own; but also to unfit those who indulge in them for employing in a suitable manner even the remaining hours which they professedly devote to his service? Thus they “wrong their own souls;” injure their servants; set an example to their neighbours which can scarcely fail of exerting a mischievous influence to an undefinable extent; and render the Sabbath as an appointment of God, less beneficial to all around them.

Besides, every thinking and conscientious man, as he will endeavour to “do to others as he would that they should do to him” so he will feel bound to act, in all cases, upon principles which he would be willing should be THE PRINCIPLES OR UNIVERSAL ACTION. Now, suppose every member of this nominally Christian community were to spend his Sabbaths, as is actually done by those of whom I have just spoken. Suppose all were to employ a large part of every Lord’s-day in visiting, in riding abroad, in feasting, and in the various forms of more decent dissipation in which thousands of nominal Christians think it harmless to indulge: who does not see that the Sabbath would be the most busy, stirring, and even laborious day in the week? Who does not see that all the domestics in society, all the animals which serve us, and all the individuals who live by ministering to the wants and the comforts of others, as well as those to whom they minister, would find the Sabbath the most busy day in the week, and little, very little, either of time or of heart left for its appropriate employments?</p></blockquote>

<blockquote><p>Because it is a day of blessings. -When God instituted the Sabbath in paradise, it is said, “God blessed the Sabbath day and sanctified it” (Gen. ii. 3). He not only set it apart as a sacred day, but made it a day of blessing. Again, when the Lord Jesus rose from the dead on the first day of the week before dawn, He revealed Himself the same day to two disciples going to Emmaus, and made their hearts burn within them (Luke xxiv. 13). The same evening He came and stood in the midst of the disciples, and said, “Peace be unto you;” and He breathed on them and said, “receive ye the Holy Ghost” (John xx. 19). Again, after eight days, – that is, the next Lord’s day, – Jesus came and stood in the midst, and revealed Himself with unspeakable grace to unbelieving Thomas (John xx. 26).

It was on the Lord’s day also that the Holy Spirit was poured out at Pentecost (Acts ii. 1; compare Lev. xxiii. 15, 16). That beginning of all spiritual blessings, that first revival of the Christian Church, was on the Lord’s day. It was on the same day that the beloved John, an exile on the sea-girt isle of Patmos, far away from the assembly of the saints, was filled with the Holy Spirit, and received his heavenly revelation.

So that in all ages, front the beginning of the world, and in every place where there is a believer, the Sabbath has been a day of double blessing. It is so still, and will be, though all God’s enemies should gnash their teeth at it. True, God is a God of free grace, and confines His working to no time or place; but it is equally true, and all the scoffs of the infidel cannot alter it, that it pleases Him to bless His word most on the Lord’s day. All God’s faithful ministers in every land can bear witness that sinners are converted most frequently on the Lord’s day – that Jesus comes in and shows Himself through the lattice of ordinances oftenest on His own day. Saints, like John, are filled with the Spirit on the Lord’s day, and enjoy their calmest, deepest views into the eternal world.

Unhappy men, who are striving to rob our beloved Scotland of this day of double blessing, “ye know not what you do.” You would wrest from our dear countrymen the day when God opens the windows of heaven and pours down a blessing. You want to make the heavens over Scotland like brass, and the hearts of our people like iron. Is it the sound of the golden bells of our ever-living High Priest on the mountains of our land, and the breathing of His Holy Spirit over so many of our parishes, that has roused up your satanic exertions to drown the sweet sound of mercy by the deafening roar of railway carriages?

Is it the returning vigour of the revived and chastened Church of Scotland that has opened the torrents of blasphemy which you pour forth against the Lord of the Sabbath? Have your own withered souls no need of a drop from heaven? May it not be the case that some of you are blaspheming the very day on which your own soul might have been saved? Is it not possible that some of you may remember, with tears of anguish in hell, the exertions which you are now making, against light and against warning, to bring down a withering blight on your own souls and on the religion of Scotland?</p></blockquote>

— Robert Murray M’Cheyne, I Love the Lord’s Day, (1841) in Andrew A. Bonar (ed.), Memoir and Remains of Robert Murray McCheyne, Minister of St. Peter’s Free Church, Dundee (Edinburgh: Oliphant Anderson &amp; Ferrier, 1892), pp 597-98.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBecause+it+is+a+day+of+blessings.+-When+God+instituted+the+Sabbath+in+paradise%2C+it+is+said%2C+%E2%80%9CGod+blessed+the+Sabbath+day+and+sanctified+it%E2%80%9D+%28Gen.+ii.+3%29.+He+not+only+set+it+apart+as+a+sacred+day%2C+but+made+it+a+day+of+blessing.+Again%2C+when+the+Lord+Jesus+rose+from+the+dead+on+the+first+day+of+the+week+before+dawn%2C+He+revealed+Himself+the+same+day+to+two+disciples+going+to+Emmaus%2C+and+made+their+hearts+burn+within+them+%28Luke+xxiv.+13%29.+The+same+evening+He+came+and+stood+in+the+midst+of+the+disciples%2C+and+said%2C+%E2%80%9CPeace+be+unto+you%3B%E2%80%9D+and+He+breathed+on+them+and+said%2C+%E2%80%9Creceive+ye+the+Holy+Ghost%E2%80%9D+%28John+xx.+19%29.+Again%2C+after+eight+days%2C+%E2%80%93+that+is%2C+the+next+Lord%E2%80%99s+day%2C+%E2%80%93+Jesus+came+and+stood+in+the+midst%2C+and+revealed+Himself+with+unspeakable+grace+to+unbelieving+Thomas+%28John+xx.+26%29.%0A%0AIt+was+on+the+Lord%E2%80%99s+day+also+that+the+Holy+Spirit+was+poured+out+at+Pentecost+%28Acts+ii.+1%3B+compare+Lev.+xxiii.+15%2C+16%29.+That+beginning+of+all+spiritual+blessings%2C+that+first+revival+of+the+Christian+Church%2C+was+on+the+Lord%E2%80%99s+day.+It+was+on+the+same+day+that+the+beloved+John%2C+an+exile+on+the+sea-girt+isle+of+Patmos%2C+far+away+from+the+assembly+of+the+saints%2C+was+filled+with+the+Holy+Spirit%2C+and+received+his+heavenly+revelation.%0A%0ASo+that+in+all+ages%2C+front+the+beginning+of+the+world%2C+and+in+every+place+where+there+is+a+believer%2C+the+Sabbath+has+been+a+day+of+double+blessing.+It+is+so+still%2C+and+will+be%2C+though+all+God%E2%80%99s+enemies+should+gnash+their+teeth+at+it.+True%2C+God+is+a+God+of+free+grace%2C+and+confines+His+working+to+no+time+or+place%3B+but+it+is+equally+true%2C+and+all+the+scoffs+of+the+infidel+cannot+alter+it%2C+that+it+pleases+Him+to+bless+His+word+most+on+the+Lord%E2%80%99s+day.+All+God%E2%80%99s+faithful+ministers+in+every+land+can+bear+witness+that+sinners+are+converted+most+frequently+on+the+Lord%E2%80%99s+day+%E2%80%93+that+Jesus+comes+in+and+shows+Himself+through+the+lattice+of+ordinances+oftenest+on+His+own+day.+Saints%2C+like+John%2C+are+filled+with+the+Spirit+on+the+Lord%E2%80%99s+day%2C+and+enjoy+their+calmest%2C+deepest+views+into+the+eternal+world.%0A%0AUnhappy+men%2C+who+are+striving+to+rob+our+beloved+Scotland+of+this+day+of+double+blessing%2C+%E2%80%9Cye+know+not+what+you+do.%E2%80%9D+You+would+wrest+from+our+dear+countrymen+the+day+when+God+opens+the+windows+of+heaven+and+pours+down+a+blessing.+You+want+to+make+the+heavens+over+Scotland+like+brass%2C+and+the+hearts+of+our+people+like+iron.+Is+it+the+sound+of+the+golden+bells+of+our+ever-living+High+Priest+on+the+mountains+of+our+land%2C+and+the+breathing+of+His+Holy+Spirit+over+so+many+of+our+parishes%2C+that+has+roused+up+your+satanic+exertions+to+drown+the+sweet+sound+of+mercy+by+the+deafening+roar+of+railway+carriages%3F%0A%0AIs+it+the+returning+vigour+of+the+revived+and+chastened+Church+of+Scotland+that+has+opened+the+torrents+of+blasphemy+which+you+pour+forth+against+the+Lord+of+the+Sabbath%3F+Have+your+own+withered+souls+no+need+of+a+drop+from+heaven%3F+May+it+not+be+the+case+that+some+of+you+are+blaspheming+the+very+day+on+which+your+own+soul+might+have+been+saved%3F+Is+it+not+possible+that+some+of+you+may+remember%2C+with+tears+of+anguish+in+hell%2C+the+exertions+which+you+are+now+making%2C+against+light+and+against+warning%2C+to+bring+down+a+withering+blight+on+your+own+souls+and+on+the+religion+of+Scotland%3F%E2%80%9D%0A%0A%E2%80%94+Robert+Murray+M%E2%80%99Cheyne%2C+I+Love+the+Lord%E2%80%99s+Day%2C+%281841%29+in+Andrew+A.+Bonar+%28ed.%29%2C+Memoir+and+Remains+of+Robert+Murray+McCheyne%2C+ <blockquote><p>The shadow or image of this glory of Christ is drawn in the Gospel, and therein we behold it as the likeness of a man represented unto us in a glass; and although it be obscure and imperfect in comparison of his own real, substantial glory, which is the object of vision in heaven, yet is it the only image and representation of himself which he hath left, and given unto us in this world. That woful, cursed invention of framing images of him out of stocks and stones, however adorned, or representations of him by the art of painting, are so far from presenting unto the minds of men any thing of his real glory, that nothing can be more effectual to divert their thoughts and apprehensions from it. But by this figurative expression of seeing in a glass, the apostle declares the comparative imperfection of our present view of the glory of Christ.

But the allusion may be taken from an optic glass or tube also, whereby the sight of the eye is helped in beholding things at a great distance. By the aid of such glasses, men will discover stars or heavenly lights, which, by reason of their distance from us, the eye of itself is no way able to discern. And those which we do see are more fully represented, though remote enough from being so perfectly. Such a glass is the Gospel, without which we can make no discovery of Christ at all; but in the use of it we are far enough from beholding him in the just dimensions of his glory. …

Should the Lord Jesus appear now to any of us in his majesty and glory, it would not be unto our edification nor consolation. For we are not meet nor able, by the power of any light or grace that we have received, or can receive, to bear the immediate appearance and representation of them. His beloved apostle John had leaned on his bosom probably many a time in his life, in the intimate familiarities of love; but when he afterward appeared unto him in his glory, “he fell at his feet as dead,” Rev. i. 1 7. And when he appeared unto Paul, all the account he could give thereof was, “that he saw a light from heaven, above the brightness of the sun;” whereon he, and all that were with him, “fell to the ground,” Acts xxvi. 13, 14.

And this was one reason why, in the days of his ministry here on earth, his glory was veiled with the infirmities of the flesh, and all sorts of sufferings, as we have before related. The church in this life is no way meet, by the grace which it can be made partaker of, to converse with him in the immediate manifestations of his glory.

And therefore those who dream of his personal reign on the earth before the day of judgment, unless they suppose that all the saints shall be perfectly glorified also (which is only to bring down heaven to the earth for a while, to no purpose), provide not at all for the edification or consolation of the church. For no present grace, advanced unto the highest degree whereof in this world it is capable, can make us meet for an immediate converse with Christ in his unveiled glory.

How much more abominable is the folly of men, who would represent the Lord Christ in his present glory by pictures and images of him! When they have done their utmost with their burnished glass and gildings, an eye of flesh can not only behold it, but, if it be guided by reason, see it contemptible and foolish. But the true glory of Christ, neither inward nor outward sight can bear the rays of it in this life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations and Discourses on the Glory of Christ, in his Person, Office, and Grace: with the Differences between Faith and Sight; Applied unto the use of them that Believe</cite>, (1684) in William H. Goold (ed.), The Works of John Owen, D.D. (24 vols, Edinburgh: T. &amp; T. Clark, 1850-53), 1: 376, 380.</span></figcaption>

<blockquote><p>And in the seventh chapter [Jn. 7:23], He defends this fact of his, saying, ‘If a man upon the Sabbath receive circumcision, that the law of Moses should not be broken; be ye angry with Me, because I haue made a man every whit whole on the Sabbath day?’ If the law of circumcision do bind men to minister and receive it upon the Sabbath, then much more does the law of love bind men to show mercy upon the Sabbath, seeing that it is appointed of God, not to hinder us from, but to further us in all his works, among which the relieving of them that be in necessity, is one of the chief and principal. And as the Lord Jesus Christ came not to destroy the law, but to fulfill it, so He observed it very carefully in this point, and being most full of compassion, did declare it abundantly, by taking all oportunity to succour them that were in misery, even upon the Sabbath, as the fittest time for it.</p></blockquote>

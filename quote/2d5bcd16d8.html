<blockquote><p>XXX. The demand is ‘repent’ (Mt. 3:2), and “believe in my Son whom I have sent” (Mt. 17:5; Jn. 3:16). Man indeed fulfills this condition, but in such a way that God has already worked that very thing in him before, and thus being converted, he converts himself; having been made faithful, he believes.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0c28f715af" data-kw="">
<blockquote><p>We deny that regenerating grace is infused into slothful men, but into souls subdued by God’s Word and law, and after a manner disposed by the foregoing actions; yet we say that even these forgoing actions have their first motions from God; and the question is whether God does not first work a sight and sense of sin and an humiliation for it by his exciting grace, before He comes with his regenerating, quickening and saving grace into the soul; we say He does in his ordinary course of his dispensations. (Only I must here be safely understood that I speak according to man’s apprehension; for in respect of God, nothing is first or last; He works all in an instant, all graces together in the soul; but the question lies not whether God works the habit of repentance before the habit of faith, or no; for without question He works together all his works; but whether God makes humiliation act before faith, which we say he does. Esau and Jacob may be in their mother’s womb together, but Esau may come out and be seen in the world before Jacob: yet not tying up the Almighty to this method, who can and will work any way, even which way it pleases Him:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spouse’s Hidden Glory &amp; Faithful Leaning upon her Well-Beloved, wherein is laid down the soul’s glory in Christ and the way by which the soul comes to Christ, delivered in two lecture sermons</cite>, … (London: 1646), pp. 25-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

<blockquote><p>Q. But is justifying faith solitary without all attendants? A. No, justifying faith has two daughters that inseparably attend her. 1. Repentance: Here sinful man retracts and undoes his faults, acknowledges his transgressions, rents his heart weeps, smites upon his breast, and cries ‘What have I done?’ laments after the Lord and abhors himself in dust and ashes: He executes the Law upon himself; and since God excuses him from the punishment, he accuses himself of the guilt, and condemns himself to the shame of his sin; and hereby the sinner honors the equity of the threatening by his tears, acknowledging that his blood was due. 2. Newness of life: Here the sinner acknowledges perfect obedience to be still his duty, which honors the equity of God’s commandments. (Rom. 16:26)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Explicatory Catechism: or an Explanation of the</cite>, [Westminster] Assembly’s Shorter Catechism… (London: Mortlock, 1675), pp. 68-69</span></figcaption>

<blockquote><p>19. Because of this receiving, calling is termed conversion, Acts 26:20. All who obey the call of God are completely turned from sin to grace and from the world to follow God in Christ. It is also called regeneration or the very beginning of a new life, a new creation, a new creature–and it is often described in the Scriptures, Jn. 1:13; 3:6; 1 Jn. 3:9; 1 Pet. 1:23 and 2:2… 20. As for man, receiving is either passive or active. Phil. 3:12, ‘I apprehend, because I have been apprehended.’ 21. The passive receiving of Christ is the process by which a spiritual principle of grace is generated in the will of man. Eph. 2:5, ‘He has quickened.’ … 30. Repentance has the same causes and principles as faith, for they are both free gifts of God. Eph. 2:8, ‘Faith is the gift of God;’ 2 Tim. 2:25, ‘Whether God may at some time give them repentance.’ They have the same subject; both have their seat in the heart or will of man. Rom. 10:9; 1 Kn. 8:48, ‘With the heart man believes.’ ‘They shall come back with all their heart.’ They are also begotten at the same time. But, first, they have diverse objects, for faith is properly directed to Christ and through Christ to God, but repentance is directed to God Himself who has been offended by the sin. Acts 20:21, ‘Turning towards God and faith in our Lord Jesus Christ.’ Second, they have diverse ends, for faith properly seeks reconciliation with God but repentance compliance with the will of God. Rom. 3:25, ‘A reconciliation through faith in his blood;’ Acts 26:20, ‘That they should… turn to God doing works fit for repentance.’ 31. Repentance, so far as it comprises the care, anxiety, and terror connected with the law, precedes faith in order of nature, as a preparing and disposing cause, and is even found in the unregenerate; but insofar as it turns man away effectively and genuinely from sin, by which God is offended, it follows faith and depends upon it as an effect upon its cause and so belongs to those who have faith. … 34. Repentance is likely to be known before faith, because a sinner cannot easily persuade himself that he is reconciled to God in Christ before he feels himself to have left those sins which separated him from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, ed. tr. John Eusden (Labyrinth Press, 1983), bk. 1, ch. 26, ‘Calling’, pp. 158-60</span></figcaption>

<blockquote><p>I will not stand in argument, whether faith be a part of repentance, or does by any other means depend upon it. It seems to me a notable point of folly to go about to tie matters of divinity to precepts of logic: for we learn not that of the Lord’s apostles.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-d33d89c272" data-kw="">
<blockquote><p>Vers. 7. So that contrariwise, ye ought rather to forgive him, and comfort him, lest perhaps such an one should be swallowed up with overmuch sorrow.

That he might shew his meekness towards the penitent Incestuous person, he adviseth that he may by the Corinthian Church be again received into favour, for these six Reasons annexed.

Reason 1. Because they are bound to forgive the penitent, and to comfort him, no less than they were bound to excommunicate him, being impenitent.

Lest perhaps] Reason 2. Because otherwise it was dangerous, lest he should be swallowed up with overmuch sorrow, except they should now receive the penitent into favour again.

Vers. 8. Wherefore I beseech you, that you would confirm your love towards him.

Reason 3. Because (especially they were so desired by the Apostle) they are bound to testify their love towards him, to wit, by shewing themselves to have excommunicated that man, not that they might destroy him, but that by repentance, they might save him.

Vers. 9. For to this end also did I write, that I might know the proof of you, whether you bee obedient in all things.

Reason 4. Because by this means they were about to shew themselves obedient to the command of the Apostle in all things, as before in excommunicating, so now also, by absolving him from the bond of excommunication, wherein the Apostle did prove their obedience.

Vers. 10. To whom eye forgive any thing, I forgive also, for if I forgave any thing, to whom I forgave it, for your sakes forgave I it in the person of Christ.

11. Lest Satan should get an advantage of us: for we are not ignorant of his devices.

Reason 5. Because the Apostle, for the sake of the Corinthians, had granted him pardon, and was about to forgive him: Therefore it was meet that they for the Apostles sake should forgive this man also.

Get an advantage] Reason 6. Lest through the craftiness of Satan, the Church should suffer harm: except now they should forgive him repenting; for by ever much severity sinners may be brought into desperation, or a departing from the Church, because of Satan, whose arts and deceits to do harm are not unknown to the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 74.</span></figcaption>

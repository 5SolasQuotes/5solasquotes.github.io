<main class="wrap"><figure class="quote" id="q-ae8aafe112" data-kw="">
<blockquote><p>Thus we see how the Lord granteth us six days for our bodies, and the seventh day for our souls: not that we must think, that other days are to be separated from this use, but that this day must be wholly severed from other for that use. For, if it were possible, or could be convenient, either in respect of our calling, or the places where we dwell, twice to meet every week day, as it is yet used in some places, though more of custom and fashion, then in faith and of conscience in most of those places, it were nothing but equal. For look what proportion is from six days to the seventh, the same may be gathered from nine, or rather twelve hours to the tenth: whereby the tithe at the least may be afforded for the Lord.

And herein is the only difference between the six days and the seventh, that the worship of God must in the six days be used at such seasons, as in wisdom are so separated and divided to that end, without any hindrance of our lawful and necessary callings, as it doth not take up the principal, but shreds and overplus of our vocation: but on the seventh day we must make such a separation from other days, that what we did but in part, in the week, or working days, we may do in whole on the seventh and Sabbath day.

True it is, that this equity of twice meeting every day, is more convenient for Cities and populous towns, where many dwell together, than in other places and situations, which for distance of place have not the congregation so dwelling together. Here our common distinction of calling the week days working days, and the Sabbath days holy days, taketh away their frivolous assertion, who think that every day should be our Sabbath day, as though we should confound and shuffle together our working days and resting days.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-greenham.html">Richard Greenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Sabbath in The Works of Richard Greenham – Volume Two</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-76e3df8a2d" data-kw="">
<blockquote><p>The irregularities they were guilty of in this solemnity. The substance was well managed, and with a great deal of devotion… 2. Many were permitted to eat the passover who were not purified according to the strictness of the law, 2 Chron. 30:18. This was the second month, and there was not warrant to put them off further to the third month… And they were loth to forbid them communicating at all, lest they should discourage new converts, and send those away complaining whom they desired to send away rejoicing. [Hugo] Grotius observes from this that ritual institutions must give way, not only to a public necessity, but to a public benefit and advantage… ‘The good Lord pardon every one’ in the congregation that has fixed, engaged, or ‘prepared, his heart’ to those services, though the ceremonial preparation be wanting. Note: (1) The great thing required in our attendance upon God in solemn ordinances is that we prepare our hearts to seek Him, that we be sincere and upright in all we do, that the inward man be engaged and employed in it, and that we make heart-work of it, it is all nothing without this. ‘Behold, thou desirest truth in the inward part.’… For this is the ‘one thing needful,’ that we ‘seek God,’ his favour, his honour, and that we set our hearts to do it. (2) Where this sincerity and fixedness of heart are there may still be many defects and infirmities, both the frame of the spirit and the performance of the service may be short of ‘the purification of the sanctuary.’ Corruptions may not be so fully conquered, thoughts not so closely fixed, affections not so lively, faith not so operative, as they should be. Here is a defect in sanctuary purification. There is nothing perfect under the sun, nor ‘a just man that doeth good, and sinneth not.’ (3) These defects need pardoning healing grace; for omissions in duty are sins as well as omissions of duty. If God should deal with us in strict justice according to the best of our performances, we should be undone. (4) The way to obtain pardon for our deficiencies in duty, and all the iniquities of our holy things, is to seek it of God by prayer; it is not so a pardon of course but that it must be obtained by petition through the blood of Christ. (5) In this prayer we must take encouragement from the goodness of God: ‘The good Lord pardon;’ for, when He proclaimed his goodness, He insisted most upon this branch of it, ‘forgiving iniquity, transgression, and sin.’… 2. A successful prayer… not only [He] did not lay their sin to their charge, but graciously accepted their services notwithstanding; for healing denotes not only forgiveness (Isa. 6:10; Ps. 103:3), but comfort and peace, Isa. 57:18; Mal. 4:2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the While Bible</cite>, on 2 Chron. 30, vv. 13-20</span></figcaption>

<blockquote><p>The great importance of simplicity in preaching, is apparent from various considerations. It is impossible without it to interest deeply the common people. By abstract and excessively analytic discourse, they are little moved, and less profited. They may admire, vaguely, the preacher’s profoundness, but they understand him not, and weariness soon ensues.

They care much less, indeed, for the recondite qualities of things, than for their obvious and practical nature. If truth interests them at all, it is in the living and palpable forms which the Bible gives it. If the water of life allures them, it is not as decomposed, but as it flows from the throne of God and the Lamb.

And the common people, be it remembered, are the great mass of the people, the great majority of our hearers, and withal the most hopeſul subjects of ministerial labour. It was so in the days of Christ. His ministry was chiefly attended by the plain people, and of that class were most of his followers. He had good reason, then, for adapting his preaching to such. And so have his ministers now. He of whom it cannot be said that the common people hear him gladly, may look for little success as a preacher of the gospel. He may be distinguished as a poet, or a critic, as a historian, an antiquarian, or a metaphysician, as deeply versed in theology even—but not as winning souls to Christ.

The wisdom of our Lord’s example, in respect to the point in hand, may be still further evinced. Simplicity of discourse is quite as effective with the truly intellectual, as with the common people. It is no indication of feebleness or poverty of mind, but the very reverse. It is easy enough to make a plain subject dark, by pedantic and profitless distinctions and definitions; but it is one of the highest achievements of intellect to make a dark subject so plain, that all shall wonder it ever seemed otherwise.

Never is learning so magnified, as when she passes over her processes, and gives you her simple results. So the truly learned judge. Hence they respect most highly the preacher who, other things being equal, is most eminent for simplicity of discourse. And the preaching of such a man, is to them, as well as the common people, the most impressive. The truth is, the commonest sympathies of our race, the most ordinary springs of action, are ever the mightiest. Ascertain what chord is of deepest tone in the hearts of the multitude, and you have learned what chord will vibrate most powerfully in the bosoms of the intellectual few.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/asa-d-smith.html">Asa D. Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Preacher s Model’, American Biblical Repository</cite></span></figcaption>

<blockquote><p>Should we hesitate to embrace a faithful witness for the cause of truth, and one, too, suffering in that cause? Surely not. It is not the cause of a party. The question between us and our antagonists is, in my opinion, come to this—Is the Testament of our Lord and Saviour Jesus Christ one Testament? Is it given by the inspiration of God, or not? Did holy men of God speak as moved by their own passions and local prejudices, or as moved by the Holy Ghost? If the book of Psalms be such as many represent it, and if it must be set aside from the peculiar use for which the Lord and Saviour Jesus Christ intended it, I see not but it is a thrust at the whole Bible, and implicitly dishonours and subverts the whole.

I believe the men have no such intention, they mean not so. But they appear to me to be under the influence of most dreadful and dangerous temptations; and to yield to them would be the greatest evil we could do to them, the greatest cruelty and injustice to themselves and their posterity, as well as unfaithfulness to the Lord. This has been long my opinion, and I yet see no cause to alter it. The cunning adversary of the church is never at rest. By various artifices and deceptions he endeavours to subvert the faith of Christians, and weaken their attachment to the Word of God. I cannot help ranking the present opposition to the pure scriptural Psalmody in the same class with Deism, Socinianism, Arianism, Arminianism, Universal Salvation, Antinomianism, and that it is a trial of the faith and patience of the saints. May the Lord enable us to stand fast, and to keep clean garments.

Conscious of much unworthiness, and that I am less than the least of all saints, yet I should shudder to chime in with the prevailing defamation, not to say blaspheming of that part of the Word of God, the book of Psalms, which indeed falls equally, though indirectly, on the whole of the Old Testament, and from that rebounds with equal force on the New Testament; for without faith in the one, I cannot see how there can be a true and saving faith in the other. The saying of the apostle respecting the law, is equally applicable here — “He that offends in one point, is guilty of all.” Whoever lifted up a tool on God’s altar, was guilty of polluting it. But what impure tools have proud, carnal, daring mortals, lifted against the Bible, with the pretext, as they say, of smoothing and polishing the rough stones thereof! But they have by their foolish and sinful attempts diminished its majesty, sublimity, grandeur, and dignity, and made ‘it like the works of men, and not of God. If those men could with equal ease form our globe into a smooth surfaced ball, no doubt they would try their hands on it, and imagine they had greatly improved it. But it is not as easy to spoil God’s works, as it is to reproach and blaspheme his Word.

I pretend not to be wiser than others, much less to infallibility; but I must judge for myself, and I see no great danger of being too strongly attached to the Word of God, or any part of it, not even to what they call the old, obsolete Jewish Psalms. The danger is all on the other side. Often, too often, my carnal heart has started objections against the book of God; and had not the Lord made me frequently taste the goodness and sweetness of it, I might have been a Deist. And what good fruits have proceeded from those men’s innovations and polishings?

Now, who were the first offended with the scriptural Psalmody, and most forward to introduce the new? To my certain knowledge, in New York, (where it first began in the Presbyterian churches,) they were the carnal and worldly part of professors, who could find no spiritual delight in any part of Divine worship. And have their attempts been blessed? Have conversions been promoted? Have saints been more edified, united, and sanctified, by their improvements? Is the worship of God more spiritual, heavenly, and holy? Let the fruits declare it.</p></blockquote>

<blockquote><p>This is an advertisement very needful; because many are apt to skip over the lesson concerning the means (that will fill up this whole treatise) as superfluous and useless. When once they know the nature and excellency of the duties of the law, they account nothing wanting but diligent performances; and they rush blindly on immediate practice, making more haste than good speed. They are quick in promising, ‘All that the Lord has spoken, we will do,’ (Exod. 19:8), without sitting down and counting the cost. They look on holiness as only the means of an end, of eternal salvation: not as an end itself, requiring any great means for attaining the practice of it. The enquiry of most, when they begin to have a sense of religion, is ‘What good thing shall I do, that I may have eternal life?’ (Matt. 19:16); not, ‘How shall I be enabled to do anything that is good?’ Yea, many that are accounted powerful preachers spend all their zeal in the earnest pressing the immediate practice of the law, without any discovery of the effectual means of performance – as if the works of righteousness were like those servile employments that need no skill and artifice at all, but industry and activity. That you may not stumble at the threshold of a religious life by this common oversight, I shall endeavor to make you sensible that it is not enough for you to know the matter and reason of your duty, but that you are also to learn the powerful and effectual means of performance before you can successfully apply yourselves to immediate practice. And, for this end, I shall lay before you the considerations following. …Sanctification, by which our hearts and lives are conformed to the law, is a grace of God communicated to us by means, as well as justification, and by means of teaching, and learning something that we cannot see without the Word (Acts 26:17, 18). There are several things pertaining to life and godliness that are given through knowledge (2Peter 1:2, 3). There is a form of doctrine made use of by God to make people free from sin, and servants of righteousness (Rom. 6:17, 18). And there are several pieces of the whole armor of God necessary to be known and put on, that we may stand against sin and Satan in the evil day (Eph. 6:13). Shall we slight and overlook the way of sanctification, when the learning the way of justification has been accounted worth so many elaborate treatises?</p></blockquote>

med+to+the+law%2C+is+a+grace+of+God+communicated+to+us+by+means%2C+as+well+as+justification%2C+and+by+means+of+teaching%2C+and+learning+something+that+we+cannot+see+without+the+Word+%28Acts+26%3A17%2C+18%29.+There+are+several+things+pertaining+to+life+and+godliness+that+are+given+through+knowledge+%282Peter+1%3A2%2C+3%29.+There+is+a+form+of+doctrine+made+use+of+by+God+to+make+people+free+from+sin%2C+and+servants+of+righteousness+%28Rom.+6%3A17%2C+18%29.+And+there+are+several+pieces+of+the+whole+armor+of+God+necessary+to+be+known+and+put+on%2C+that+we+may+stand+against+sin+and+Satan+in+the+evil+day+%28Eph.+6%3A13%29.+Shall+we+slight+and+overlook+the+way+of+sanctification%2C+when+the+learning+the+way+of+justification+has+been+accounted+worth+so+many+elaborate+treatises%3F%E2%80%9D%0A%0A%E2%80%94+Walter+Marshall%2C+The+Gospel+Mystery+of+Sanctification%2C+%28An+interview+on+this+work.+More+resources+on+sanctification%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F88d4f9e359.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/88d4f9e359.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/07/marshall-meditate-before-you-rush-into-law-keeping/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

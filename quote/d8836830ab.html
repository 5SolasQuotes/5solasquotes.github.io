<main class="wrap"><figure class="quote" id="q-d8836830ab" data-kw="">
<blockquote><p>…we considered each chapter by itself, and left nothing unexplored, and diligently examined everything respecting God, the sacred laws and rights of the Church, and it is impossible to express the exceeding delight we derived from that work, when we clearly perceived that in your little book was most faithfully, holily, piously, and indeed divinely explained, and that briefly whatever we have been constantly teaching these eight years, and still by the grace of God, continued to teach, in our Churches, in the schools, and in the pulpit. We are therefore altogether compelled, as well by our consciences, as from a sense of duty, to undertake its patronage, and not only to express our approval, but also our exceeding commendation of every chapter and every sentence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/affirmation-of.html">Affirmation of</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The 2nd Helvetic Confession (1562-66) &amp; the Church of Scotland (1566) | Intro | The General Assembly of the Church of Scotland in 1566 sent a letter to Theodore Beza approving the Confession, with only the one of its teaching about keeping the evangelical festivals. However, “[e]verything else, as we have said, we teach, approve, and most willingly embrace.” In fact, they said just previously to this:</cite></span></figcaption>

<blockquote><p>[The means of happiness are reckoned among] Those pious acts of man which are necessary for the obtaining thereof, especially those that directly and immediately have God for their object. Whether these actions have a relation of efficiency to that happiness, under which notion we conceive of means ordinarily, and perhaps not amiss in this case, if we speak of happiness as it signifies that future state of glory: Or whether rather those actions are parts of it, etc. happiness itself, etc.</p></blockquote>

<blockquote><p>5. They are a condition, without which a man cannot be saved. So that although a man cannot by the presence of them gather a cause of his salvation; yet by the absence of them he may conclude his damnation: so that it is an inexcusable speech of the Antinomian, Good works do not profit us, nor bad hinder us; thus Islebius. Now the Scripture, how full is it to the contrary? Rom. 8:13, ‘If ye live after the flesh, ye shall die.’ So, ‘Except ye repent, ye shall all likewise perish.’ Such places are so frequent, that it’s a wonder an Antinomian can pass them all over, and always speak of those places which declare God’s grace to us, but not our duty to Him. Without holiness no man can see God: now, by the Antinomians’ argument, as a man may be justified while he is wicked, and does abide so; so also he may be glorified and saved: for this is their principle, that, Christ has purchased justification, glory, and salvation for us, even though sinners and enemies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures 3 &amp; 4, on 1 Tim. 8-9 of Vindiciae Legis, or, A vindication of the moral law and the covenants, from the errors of Papists, Arminians, Socinians, and more especially, Antinomians in 30 Lectures</cite>, (London, 1647), pp. 42-43</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

tion%2C%20without,us%2C%20even%20though%20sinners%20and%20enemies&amp;text=5.%20They%20are%20a%20condition%2C%20without%20which%20a&amp;text=salvation%20for%20us%2C%20even%20though%20sinners%20and%20enemies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d93e854d06" data-kw="">
<blockquote><p>First therefore take notice what we mean by good works. We take not good works strictly, for the works of charity or liberality; nor for any external actions of religion, which may be done where the heart is not cleansed; much less for the Popish good works of supererogation: but for the graces of God’s Spirit in us, and the actions flowing from them: For, usually, with the Papists and Popish persons, good works are commonly called those superstitious and supererogant works, which God never commanded: or, if God has commanded them, they mean them as external and sensible; such as coming to church and receiving of sacraments; not internal and spiritual faith, and a contrite spirit, which are the soul of all duties: and if these be not there, the outward duties are like clothes upon a dead man, that cannot warm him, because there is no life within. Therefore much is required even to the essence of a godly work, though it be not perfect in degrees: As: 1. It must be commanded by God. 2. It must be wrought in us by the Spirit of God. All the unregenerate man’s actions, his prayers, and services are sins. 3. It must flow from an inward principle of grace, or a supernatural being in the soul, whereby a man is a new creature. 4. The end must be God’s glory. That which the most refined man can do is but a glow-worm, not a star: So that then only is the work good, when, being answerable to the rule, it’s from God, and through God, and to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis, or a Vindication of the Moral Law &amp; the Covenants</cite>, … (London: Young, 1647), Lecture 4, p. 39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

d93e854d06.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d93e854d06.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-good-works/#:~:text=First%20therefore%20take%20notice%20what%20we,and%20through%20God%2C%20and%20to%20God&amp;text=First%20therefore%20take%20notice%20what%20we%20mean%20by&amp;text=from%20God%2C%20and%20through%20God%2C%20and%20to%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b3d711adc6" data-kw="">
<blockquote><p>By setting aside the contrary supposition, he proves his statement, that by grace we are saved, — that we have no remaining works by which we can merit salvation; for all the good works which we possess are the fruit of regeneration. Hence it follows, that works themselves are a part of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians and Ephesians</cite>, Ephesians 2:10</span></figcaption>

</figure><figure class="quote" id="q-5757b1131c" data-kw="">
<blockquote><p>Wherefore good works are necessary to salvation, certainly not as an efficient or meritorious cause, by an efficient principle; yet they are necessary by a principle of being present, and so a testimony of our living faith, without which faith is dead; and they are required to salvation, not as a cause of ruling, but as a way to the kingdom.</p></blockquote>

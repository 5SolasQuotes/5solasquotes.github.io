<main class="wrap"><figure class="quote" id="q-12a7c3447d" data-kw="">
<blockquote><p>The most significant attempts to overcome religious division between the old church and those desiring reformation were those colloquies that the emperor called at the level of the Holy Roman Empire of the German Nation. They took place in a twenty-year period beginning in 1540. Thereafter this type of imperial colloquy faded because the Religious Peace of Augsburg (1555) guaranteed adherents of the Augsburg Confession legal protection within the boundaries of their own territories. This essentially rendered further Catholic-Evangelical colloquies superfluous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/irene-dingel.html">Irene Dingel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 19, ‘Christian Ecumenical Efforts’ in eds. Appold &amp; Minnich, The Cambridge History of Reformation Era Theology (Cambridge University Press, 2023), pp. 372-84, p. 375</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>Rutherford, Brown, Gillespie, Durham, and generally all the best men of that school seek to multiply reasons against separation, and show themselves willing to bear the heaviest burdens and submit to the severest strain rather than take what to them is the most painful step in separation from communion with any body with which they had previously held church fellowship.</p></blockquote>

</figure><figure class="quote" id="q-097c7b8d46" data-kw="">
<blockquote><p>But they would make some clearing here by telling us that: ‘All who are acquainted with the principles and practices of our worthy predecessors, and of the learned and godly non-conformists in England, will easily see how far they are from their judgments and practices who follow the ways of separation.’ [1.] Bel•ke they still dwell beside evil neighbors, but which is worse, they are hardly believed, when men call to mind and consider how now of a long time still they took the patrociny [patronage] of all that were suspected to follow those ways. 2. What progress some of their chief and cried up men have made in those ways. 3. What affection they still carry to them and how familiarly they converse with them, even although excommunicated. 4. But especially how unavoidable separation is upon their grounds: For if it be a matter of conscience for them to join with others in civil duties that necessarily belong to the incorporation whereof both are members, sure much more in ecclesiastic [affairs].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scottish-resolutioners.html">Scottish Resolutioners</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Member of the General Assembly</cite>, The Protestation given in by the Dissenting Brethren, to the General Assembly, July 21, 1652, Reviewed &amp; Refuted (Leith: Tyler, 1652), p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

fairs&amp;text=But%20they%20would%20make%20some%20clearing%20here%20by&amp;text=are%20members%2C%20sure%20much%20more%20in%20ecclesiastic%20%5Baffairs" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-91a9b3e084" data-kw="">
<blockquote><p>To depart from the Church of England is a departing from the Church of God: let them consider, the Church of Corinth had many faults in it, as many as the Church of England has, and as great ones too; and yet [it] was God’s Church for their faults. St. Paul blames some there for their civil jars impetuously, they traffering them and their suits to the courts of infidels, 1 Cor. 6:7. Others for their wicked connivence and indulgence towards the incestuous, 1 Cor. 5; others for their vile profaneness in their sacred assemblies, 1 Cor. 11:32. Yea, others for heresy, 1 Cor. 15… But the example of Christ Himself writing to the seven Churches of Asia may be our best direction, charging five of them with several faults, and with crimes of a large size, yet he does call them Churches. Moreover, is not the forsaking the Church of God, a forsaking of God Himself?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ephraim-pagitt.html">Ephraim Pagitt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heresiography, or a Description of the Heretics &amp; Sectaries of these Latter Times</cite>, (London: Wilson, 1645), ‘Of the Brownists’ | 23. ‘Schism a great sin’, p. 72</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

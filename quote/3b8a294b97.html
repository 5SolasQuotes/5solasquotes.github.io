<main class="wrap"><figure class="quote" id="q-3b8a294b97" data-kw="">
<blockquote><p>Now because not in this place only but otherwhere often we hear it repeated Fear not, it is by some made a long question, whether a man may fear destruction or vexation without sinning. First, the reproof wherewith Christ checketh his Disciples more then once, O men of little faith wherefore are ye afraid? Secondly the punishment threatened in the 21. of Revelations, to wit, the lake, and fire, &amp; brimstone, not only to murtherers, unclean persons, sorcerers, Idolators, liars, but also to the fearful and fainthearted, this seemeth to argue that fearfulness cannot but be sin.

On the contrary side we see that he which never felt motion unto sin had of this affection more then a slight feeling. How clear is the evidence of the spirit that in the days of his flesh he offered up prayers and supplications with strong cries and tears unto him that was able to save him from death, and was also heard in that which he feared? Heb. 5. 7. Whereupon it followeth that fear in it self is a thing not sinful.

For is not fear a thing natural and for men’s preservation necessary, implanted in us by the provident and most gracious giver of all good things, to the end that we might not run headlong upon those mischiefs wherewith we are not able to encounter, but use the remedy of shunning those evils which we have not ability to withstand?

Let that people therefore which receive a benefit by the length of their princes days, that Father or Mother that rejoiceth to see the offspring of their flesh grow like green and pleasant plants, let those children that would have their parents, those men that would gladly have their friends and brethren’s days Prolonged on earth, (as there is no natural hearted man but gladly would,) let them bless the Father of lights, as in other things, so even in this that he hath given man a fearful heart and settled naturally that affection in him which is a preservation against so many ways of death. Fear then in it self being mere nature cannot in it self be sin, which sin is not nature, but thereof an accessary deprivation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Remedy Against Sorrow and Fear, Delivered in a Funeral Sermon</cite>, (Oxford: Joseph Barnes, 1612), pp 10-11.</span></figcaption>

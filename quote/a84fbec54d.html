<main class="wrap"><figure class="quote" id="q-a84fbec54d" data-kw="">
<blockquote><p>The advice of the Committee is that the Synod accede to the overture of Classic Grand Rapids East, that is a) ‘To amend Article 69 of our Church Order….so that a synodically approved collection of hymns may be added which may be used in our public worship and regular services; b)’To take the required steps to procure such a collection of hymns which may be used in our divine worship.’ As reasons for this advice the Committee adduces that which Classic Grand Rapids East has submitted to the Synod, and which is re-affirmed by Classis Hackensack. In addition to the material brought by these Classes your Committee would call the attention of the Synod to the following matters: 1. There is a need for definite action. Our people are using hymns. Our churches in some localities sing hymns in song services held immediately before the public worship. The demand for hymns has gained great momentum. Your committee feels that Synod should exercised a guiding hand before this demand can no longer be controlled….. …Not to encourage hymns would cause increasing discontent among our people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/acta-der-synode-1928-van-christelijke-gereformeerde-kerk.html">Acta der Synode 1928 van Christelijke Gereformeerde Kerk</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 11–29 Juni, 1928, Holland, Michigan. Artikel 57.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-36b994a00c" data-kw="">
<blockquote><p>These thanksgivings [the NT ‘evangelical hymns’, or Bible songs, such as the song of Mary, Simeon, etc.] were made by occasion of certain particular benefits, and are no more to be used for ordinary Prayers than the Ave Maria [Hail Mary, used by Papists]. So that both for this cause, and the other before alledged of the Psalms, it is not convenient to make ordinary Prayers of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Polity</cite>, As quoted in Richard Hooker, Book 5 (1597), section 40 in Works (London, 1676). Hooker gives as the reference: Cartwright, Book 3, p. 208., p. 241, margin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-fe91d3a304" data-kw="">
<blockquote><p>Next you say, ‘Why may not the Christian Church compose new Hymnes, as they of Corinth did?’ And this you judge to be the more necessary because that David‘s Psalms have not such full and clear Hymns upon the great mysteries of the Christian belief: And you think the liberty which we plead for in prayer should much persuade it. ‘Tis answered, if you consider that Scripture, 1 Cor. 14, and particularly the 26th verse, you may understand that as the apostle’s business in the place is to set an order to the use of extraordinary gifts, wherein that Church abounded; so, the Psalms, doctrine, tongue, revelation, and interpretation there spoken of, appear to be inspired and afflatitious motions, which will not found you any argument: And you yourself do so plainly observe that these Psalms of the Corinthians were framed by private persons, that I marvel that your remembering of the thing to be extraordinary did not stop your translation of it by way of privilege to the Churches in our days. 2. Seeing the Lord hath provided us with a plentiful variety of Psalms and Hymns; and beside, hath allowed us as full a liberty of praising in prose, as of prayer, I think it doth fully remove all that is here by you objected, and abundantly warrant us both to abide content with God’s institutions, and refuse a superfluous mixture of humane odes with these divine Psalms, which He hath appointed, for the matter of our more solemn praises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … ([Amsterdam], 1671), The Fifth Dialogue Answered. MacWard was the protege of Samuel Rutherford. He does not explicitly cite Eph. 5:19 &amp; Col. 3:16 below, but the allusions to those passages are obvious. He appears to allow for singing Scripture songs in some respect., p. 278</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>2. Some about the time of receiving the communion are very devout, will make a show of religion, of prayer, of repentance, of charity, and love; they will not swear much that day, perhaps not play, but read, and (it may be) sing Psalms: A man would think (for so do they) that the devil is quite gone. But it is but for a season…</p></blockquote>

</figure><figure class="quote" id="q-8ed0f09344" data-kw="">
<blockquote><p>Until the Civil War the various Presbyterian bodies used psalms predominantly, singing hymns only now and then, especially in informal gatherings. Their songbook, Psalms and Hymns, had a clearly defined psalter section. After the Civil War the use of hymns increased greatly. In the Presbyterian Hymnal published in 1874 by the northern branch of the church, psalms were mixed in with hymns. The 1901 Psalms and Hymns of the southern church followed suit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/various.html">Various</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘We Used to Sing Only Psalms — What Happened?’</cite>, (1987)</span></figcaption>

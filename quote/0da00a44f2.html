<main class="wrap"><figure class="quote" id="q-0da00a44f2" data-kw="">
<blockquote><p>I saw the evil of legal preaching, which lies in one of two things, or in both. 1. In laying too much stress upon the works of the law, our duties and strength: Or, 2. In pressing evangelical doctrines without an eye to that which is the spring of the church’s edification, the Spirit of the Lord… O Lord, thou knowest how much of it is in this poor church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-halyburton.html">Thomas Halyburton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Of Legal Preaching” in Memoirs of the Rev. Thomas Halyburton</cite>, (William Collins, 1838), 261-62.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>

</figure><figure class="quote" id="q-ef288582a1" data-kw="">
<blockquote><p>In the preaching of the Word, the external minister holds forth the vocal word, and it is received by the ears. The internal minister, the Holy Spirit, truly communicates the thing proclaimed through the Word, that is Christ, to the souls of all who will, so that it is not necessary that Christ or for that matter his Word be received through the organs of the body, but the Holy Spirit effects this union by his secret virtue, by creating faith in us, by which he makes us living members of Christ, true God and true man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvin: Theological Treatises</cite>, J. K. S. Reid, Calvin: Theological Treatises (Louisville, KY; London: Westminster John Knox Press, 1954), 173.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>

</figure><figure class="quote" id="q-2be9b15777" data-kw="">
<blockquote><p>It is most probable that no gift, no pains a man takes to fit himself for preaching, shall ever do good to the people or himself, except a man labor to have and keep his heart in a spiritual condition before God, depending on Him always for furniture and the blessing. Earnest faith and prayer, a single aim at the glory of God, and good of people, a sanctified heart and carriage, shall avail much for right preaching. There is sometime somewhat in preaching that cannot be ascribed either to the matter or expression, and cannot be described what it is, or from whence it comes, but with a sweet violence, it pierces into the heart and affections, and comes immediately from the Lord. But if there be any way to attain to any such thing, it is by a heavenly disposition of the speaker.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-livingstone.html">John Livingstone</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Remarks on Preaching and Praying in Public by John Livingstone’, in Scottish Puritans: Select Biographies</cite>, vol. 1, p. 287</span></figcaption>

</figure><figure class="quote" id="q-9be10c6f93" data-kw="">
<blockquote><p>In matter of hearing, it is not so hard to discern who are to be accounted to speak without God’s commission: because ordinarily, such have either no warrantable call at all (no not in the outward form; and so cannot be accounted but to run unsent) or, by palpable defection from the truth, and commission given them in that call, they have forfeited their commission, and so no more are to be accounted ambassadors to Christ, or watchmen of His flock, than a watchman of the city, is to be accounted an observer thereof, when he has publicly made defection to the enemy, and taken on with him. For we are here to rest in the external call, and not to dispute that which is inward: because it passes our reach; and Christ has furnished his House with external ordinances, for the warranting of his people’s peace in reference to these things: there is therefore great difference to be placed here between one that is called, and one whom we think not worthy to be called: it’s the first that warrants hearing…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 1, Lecture 9, ‘Of Reading &amp; Hearing’ in A Commentary upon the Book of the Revelation… (Edinburgh, 1658), pp. 64-66</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>

<main class="wrap"><figure class="quote" id="q-919db0404a" data-kw="">
<blockquote><p>Ma. What is the seventh Commandment?

Sch. Thou shalt not commit adultery.

Ma. What dost thou think to be contained therein?

Sch. By this commandment is forbidden all kind of filthy lusts, all unchasteness of speech, all wantonness of countenance, and gesture, and all outward show of unchastity, whatsoever it be. Idleness likewise, excess of meat, drink, apparel, wanton plays, and pastimes and whatsoever else may occasion any uncleanness, either of body or mind, are forbidden by this commandment. For by this commandment, we are charged to keep our minds also clean from unchaste thoughts and desires, because as well our souls as our bodies, are the temples of the holy Ghost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-nowell.html">Alexander Nowell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechism, or Instruction of Christian Religion, to be learned of all youth, next after the little Catechism: Appointed in the Book of Common Prayer</cite>, (London: John Day, 1572), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-86affd6944" data-kw="">
<blockquote><p>That it repeals the decision of the Synod of 1926 regarding choir~singing, and declare that there shall be no singing in our public services except by the congregation as a whole, on the ground: a) That there is no place for such singing according to our Reformed conception of public worship. Since God meets and fellowships with His Church in public worship, every element must be either an act of God (through the Minister) having the congregation as its object or an act of the congregation (directly or through the minister) having God as its object. Anthem-singing by a choir or a soloist is neither. It is in reality a usurpation of the privilege and duty of the whole congregation to sing praise to God; b) It conflicts with Article 69 of the Church Order which permits the singing of only a few hymns specifically mentioned; c) It conflicts with the basic principle of Article 69 of the Church Order, namely, that the Church as a whole. through the Synod, shall determine what shall be sung in our churches…. Respectfully. Your Committee. W. HEYNS. H. J. KUIPER. L. TRAP. D. ZWIER. J. V AN LONKHUYZEN W. STUART Y. P. DE JONG</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/acta-der-synode-1928-van-christelijke-gereformeerde-kerk.html">Acta der Synode 1928 van Christelijke Gereformeerde Kerk</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 11–29 Juni, 1928, Holland, Michigan. Supplement XIV</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-7b6f423734" data-kw="">
<blockquote><p>In all religious commands there must appear to the person that obeys some reason from a divine command; either particularly or generally requiring the thing. The mere will and authority of an another in these things is not reason enough to justify our obedience. In matters of that nature we must be very wary of idle and superfluous actions. To be of no use and insignificant is enough in worship to make a gesture or action sinful, yea, and an appropriated habit [garment] too. There lies no necessity upon the superior to command any such things, nay, to do it will be a sin unto him, as Gideon’s ephod was a snare to his house, Judg. 8:27.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reasonable Account why some Pious, Nonconforming Ministers in England Judge it Sinful for them to perform their ministerial acts</cite>, … (London: 1679), ch. 4, p. 89</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-d24cf8f421" data-kw="">
<blockquote><p>We believe that these Holy Scriptures fully contain the will of God, and that whatsoever man ought to believe unto salvation, is sufficiently taught therein. For since the whole manner of worship which God requires of us is written in them at large, it is unlawful for any one, though an Apostle, to teach otherwise than we are now taught in the Holy Scriptures; nay, though it were an angel from, heaven, as the Apostle Paul saith. For since it is forbidden to add unto or take away any thing from the Word of God, it doth thereby evidently appear that the doctrine thereof is most perfect and complete in al respects. Neither may we compare any writings of men, though ever so holy, with those divine Scriptures; nor ought we to compare custom, or the great multitude, or antiquity, or succession of times or persons, or councils, decrees, or statutes, with the truth of God, for the truth is above all: for all men are of themselves liars, and more vain than vanity itself. Therefore we reject with all our hearts whatsoever doth not agree with this infallible rule, which the Apostles have taught us, saying, Try the spirits whether they are of God; likewise, If there come any unto you, and bring not this doctrine, receive him not into your house.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/belgic-confession.html">Belgic Confession</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Creeds of Christendom</cite>, vol. 3 (New York: Harper &amp; Brothers, 1882), 389.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-5916053771" data-kw="">
<blockquote><p>If it be here replied that the actions which make up mediate worship, must be actions of the Second Table, not of the First… I answer: It is the verdict of the Word and the common consent of all divines that all the actions and duties which concern our brother as the next object and end, and so determine upon him are required, and regulated by the Second Table: since therefore these things of comliness and order are of this nature, by the Rejoinder’s grant, I do not see how it can be avoided with any colour of reason but they must be commanded in the Second Table, and so come under the definition of mediate worship…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, (Amsterdam: Thorp, 1633), Manuduction, ch. 12, ‘Concerning Worship’, p. 137</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

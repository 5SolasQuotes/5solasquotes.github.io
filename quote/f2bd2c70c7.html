<main class="wrap"><figure class="quote" id="q-f2bd2c70c7" data-kw="">
<blockquote><p>In what continual danger are we everywhere of running into extremes! While some, blinded and hardened by sin, never bestow one serious thought about their souls, — insensible of the malady within, they despise the physician and disregard the means of recovery, — there are others who think or at least talk of nothing else but of their disorder, saying how bad they are.

Fruitless complaints, complaints of themselves and of their condition, is the sum and substance of their religion. If they can conjure up doubts respecting themselves, and form desponding complaints of their uncomfortable condition, they fancy that they have done their duty. I have myself known several who have spent a good part of their time in such spiritual gossiping, — I know not what else to call it, in going up and down from one to another with their melancholy complaints and objections. But such conduct is utterly contrary to the life of faith.

Had they spent half this time in pouring out their complaints before the Lord, or employed it in doing good to others, they would have been long ago fat and well liking, thriving daily in holiness, and comfort, life and joy. I say not but that it is good, in our soul’s concerns and spiritual difficulties, to apply to them who are furnished with the tongue of the learned, and who know how to speak a word in season to the weary: but what I say is, that for persons to fill their minds with their own complaints and objections, without endeavouring to mix with faith and practice what is spoken for their relief, and to go on still in their own slothful and obstinate way, that this is of no sort of use or advantage, but I fear of much real hurt to the soul.

And yet some, I am apt to think, may even please themselves in such a course, as if it had somewhat in it of eminency in religion. But can they think to mend their condition by wishing it were better, or by complaining that it is so bad? If they do, they will most assuredly be disappointed. None of us will think so absurdly about worldly things. In such things we readily take an industrious course. The husbandman well knows, that if he be idle and slothful in seed-time, it will be in vain to form any expectations as to the time of harvest. “The sluggard will not sow by reason of cold;” and what return hath he in harvest? He must “beg in harvest and have nothing.” Prov. xx. 4.

So it is in spiritual things. The hand of the diligent alone maketh rich. Tell me how a man employs his time, whether he is slothful or industrious, and I will tell you what progress he makes in grace; for you may as soon gather grapes of thorns or figs of thistles, as enjoy those fruits of the Spirit, — love, joy, and peace, whilst you live after the flesh, in self-indulgence, ease, and sloth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-charles.html">Thomas Charles</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The means to be used for obtaining peace (1782) in Edward Morgan (ed.), Essays, Letters, and Interesting Papers of the Late Rev. Thomas Charles, A.B. Bala, Merionethshire</cite></span></figcaption>

<blockquote><p>I do not desire to reflect upon our fathers for bringing home Charles Stuart to get the crown; indeed, some of them, and amongst others the reverend and worthy Mr [John] Livingstone, did regret and go mourning to the grave for it. Yea, his actions since, and the connivances of those who had his favour or any power under him, evidence that it is impossible to manifest or maintain the royal prerogatives of Jesus Christ and yet maintain the king’s civil rights.

Since it is so declared that we must either quit him as king or Christ, indeed for my part I am for no king but Jesus Christ, since they will have none but Caesar. When Christ is seated upon His throne and His crown upon His head, let such magistrates be appointed in every particular station as will employ their power for the advancement of His kingdom, and for destroying the kingdom of darkness in this land and in every place where Christ shall reign; and then let them be owned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cameron.html">Richard Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Good News to Scotland, 8 July 1680 in Sermons in Times of Persecution in Scotland, by Sufferers for the Royal Prerogatives of Jesus Christ</cite></span></figcaption>

</figure><figure class="quote" id="q-c314e5a7d1" data-kw="">
<blockquote><p>But if that cannot be conveniently had, as in a national Church it may fall out, then the Magistrate as a preserver of peace and truth, may command the sincerer part [of the Church] to convene in a synod, and do their duty, as the good kings of the people of God did: 2 Chron. 15, Asa gathered together a people who entered in covenant to seek the Lord God with all their heart, and laid an obligation of punishment to death on the rest, vv. 12-13; and Jehoshaphat, 2 Chron. 23:4, he laid charge on Hilkiah the High Priest, and the priests of the second order, whom he knew to be better affected to the work, to bring out the vessels made for Baal; which proves that the king should put the sincerest to do that, which in common belongs to the whole, in which case of the erring of the most part of the Church, the prince indirectly condemns the erring part of the [ecclesiastical] synod, because it is his place to forbid and to punish with the sword, the transgressors of God’s Law. But because his power is accumulative [to build up, according to the truth], not privative [to take away], under that pretense he has not power to hinder the sincerer part to meet and determine according to the Word of God. … …but the king’s power cannot make Church-canons [determinations], for it is a part of the ministerial calling to make canons, and therefore he [the magistrate] cannot annul and dissolve canons: but some greater kingly power is due to the king in the case of the Church’s aberring, than in the case of the Church’s right administration; and as our divines do justly give to the prince an extraordinary kingly power in the case of universal apostasy of the Church, as Jehoshaphat, Hezekiah, Josiah, and other worthy reformers in the Church of the Jews, did warrantably use their kingly power, when the Church-men were corrupted and negligent in their duty; so in a particular case of a particular error of the synod, the king as king, may use his kingly power in this fact, that is, secundum quid extraordinarie [according to that which you must do extraordinarily], for the king is obliged as king to add his accumulative power of a civil sanction to all just and necessary Church constitutions, and if the canon or Church constitution be wicked and popish, he is obliged to deny his civil sanction, and not that only, (for he that is not with Christ is against him) but he is to employ his kingly power against such canons, and so is to deliver the Church of God in that, and in denying his accumulative power to unjust canons, he adds his kingly power accumulative to the true Church, in saving them from these unjust canons.</p></blockquote>

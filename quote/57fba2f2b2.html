<main class="wrap"><figure class="quote" id="q-57fba2f2b2" data-kw="">
<blockquote><p>A heathen writer, no base author, I wis, made this definition of law; that it is an especial reason, placed in nature, commanding what is to be done, and forbidding the contrary. And verily the law is nothing but a declaration of God’s will, appointing what thou hast to do, and what thou oughtest to leave undone.

The beginning and cause of laws is God himself, who is the fountain of all goodness, equity, truth, and righteousness. Therefore all good and just laws come from God himself, although they be, for the most part, published and brought to light by men. Touching the laws of men, we must have a peculiar consideration of them by themselves. …

The laws of men (for my promise was, that in my second part I would speak of them) are those which are by men ordained and published to the preservation of the common weal and l church of God. Touching these they are of divers kinds. For there are politic laws, there are ecclesiastical laws, and men’s traditions. Politic laws are those which the magistrate, according to the state of times, places, and per sons, doth ordain for the preserving of public peace and civility. Of this sort there are an innumerable company of examples in the civil law and constitutions of the emperors, especially of Justinian. All which ought to come as near as may be to the laws of God and nature, and not to be contrary to them, or to have any smack of impiety or cruel tyranny.

To such laws St Peter willeth us to obey, where he saith: “Submit yourselves unto all manner ordinance of man for the Lord’s sake ; whether it be to the king, as having the pre-eminence, or unto rulers, as they that are sent by him for the punishment of evil doers, but for the praise of them that do well.” For although the apostle by ordinances, or men’s constitutions, doth inclusively mean the kings and magistrates themselves, as in the second clause of the sentence he doth immediately declare; yet, notwithstanding, he doth bid us therefore obey good laws and just, because by them the magistrates support and rule the commonweal.

Moreover, just and honest politic laws are an help to love and tranquillity; do preserve fellowly society among men; do defend the good, bring inordinate persons into better order; and lastly, do not make a little only to the setting forward of religion, but do also abrogate evil customs, and utterly banish unlawful mischiefs. Hereof we have examples in the deeds of Nabuchodonosor, Cyrus, Darius, Artaxerxes, and other princes more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty Godly and Learned Sermons Divided into the Five Decades Containing the Chief and Principal Points of Christian Religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids MI: Reformation Heritage Books, 2004), 2.1, i, 193, 206-07 (emphases added).</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5111f482c3" data-kw="">
<blockquote><p>The Law of Nature, as it is impressed upon our hearts, so in the goodness of God, it is expressed in his Word, wherein He has not only holden forth these Sacred Mysteries, which could only be known by Revelation, as having no principles in Nature from whence they are deducible, but also, because through sin and evil custom, the Natural Law in man’s heart was much defaced, disordered and erroneously deduced: He has therefore reprinted the Law of Nature in a viver [more vivid and lively] character, in the Scripture, not only having the moral principles, but many conclusions thence flowing particularly set forth. This analogy of the Law of Nature even in the heats of heathens and as it is set down in the Law of God evidences sufficiently, that both of them proceed from the same Omniscient Author.</p></blockquote>

<blockquote><p>God can serve Himself of nothing, yea, that there are not created, locusts, caterpillars more numerous than that all the fruits of the earth can be food to them, preach the glory of the Lord’s goodness to man, and what are never to be, no less than all things that have futurition [come into being], or shall come to pass either absolutely or conditionally, are under the positive decree of God, else we should not owe thanks to the Lord for many evils that never fall out, that the Lord turns away violent death, violence of men and wild beasts, and many possible mischiefs, contrair to Deut. 28:11-12; Lev. 26:6; Ps. 34:20; Ps. 91:5-8. And all these beings or no-beings owe themselves to God to hold forth the glory of goodness, wisdom, mercy, justice, etc. suppone [suppose] there had never been sin: Far more now, who wants matter of meditation, or can write a book of all the pains, achings, convulsions, pests, diseases that the Lord decreed to hold off? so that every bone, joint, lith [limb], hair, member, should write a Psalm Book of praises, Ps. 35:10, ‘All my bones shall say, Lord, ‘Who is like unto thee?”</p></blockquote>

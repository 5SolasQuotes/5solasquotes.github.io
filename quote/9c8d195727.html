<blockquote><p>Now if faith be so necessary, and unbelief so dangerous, it concerns us to know what it is to believe. It comprises, 1, knowledge; 2, assent; 3, dependence, or relying on the Lord Jesus Christ. 1. Knowledge. Faith is expressed by knowledge, Isa. 53:11. If knowledge be not faith, yet there can be no faith without knowledge. That blind faith of the papists is good for nothing but to lead them into the ditch. That ignorance is the mother of devotion, is one of the principles of the father of lies. Sure it is the nurse of unbelief. It is Satan’s muffler, which he makes use of to lead sinners blindfold into hell; it brings them there before they know where they are. Ignorant persons are like the Syrians, struck with blindness, 2 Kings 6:20. They thought they were going on a hopeful design, but when their eyes were opened, they found themselves in the midst of Samaria, in the midst of their enemies.

The first step to conversion is to open the eyes, to scatter darkness, Acts 26:18. He begins the new creation as he did the creation of the world: ‘Let there be light,’ Gen. 1. The first thing he produces is light. There is a dawning of the day before the day-star arise; some light goes before the sun rising. Such a dawning of knowledge there is before the Sun of righteousness arise, before Christ dwell in the heart by faith; some light from the law discovering sin and misery; some light from the gospel discovering Christ’s excellency and all-sufficiency. There is a competent knowledge of the mysteries of the gospel, a knowledge more distinct, more convincing, more affecting, than that which he had in the state of unbelief.

2. Assent. As to the principles of the doctrine of Christ, so especially to these two truths: 1, that he has a necessity of a Saviour; 2, that Christ is the only all-sufficient Saviour. (1.) There is an absolute necessity of a Saviour, which the Scripture declares upon three grounds: 1, the sinfulness of a natural man; 2, his misery; 3, his inability to free himself from it. There must be a full and effectual assent to, and belief of, what the Lord declares concerning his sinful, miserable, impotent state.

3. Recumbence, relying upon Christ. To rely upon Christ alone for salvation is saving faith. It is not to believe him, but to believe on him; which the New Testament expresses by a peculiar phrase, not used by heathen authors: πιστεύειν εἰς τὸν Χριστὸν, Acts 19:4; ἐις ἐμὲ, Mat. 9:2; ἐπὶ τὸν, or, ἐπὶτῶ, Acts 16:31, ἐπὶτὸν Κύριον; Rom. 9:33, πιστεύων ἐπʼ αὐτῷ; Mark 1:15, ἐν τῷ εὐαγγελίῳ; Rom. 3:25, ἐν τῷ αἵματι; Gal. 3:24, εἰς Χριστὸν; Eph. 1:15; εἰς τὸ ὄνομα, John 1:12, &amp;c. It is not to give credit to him, but to rely on him; it is to trust in him. To trust in him is more than to believe him, to assent to his word as true.

It is, as [Peter] Lombard explains it, lib. 3, dist. 23, credendo in eum ire, credendo ei adhærere, to adhere, depend, rely on him; not credere, but fidere, fiduciam ponere. This is the essence, the formality of saving faith. There cannot be justifying faith without knowledge and assent, but there may be knowledge and assent without it; these are as the body to faith, this relying is the soul; without this, knowledge and assent are but a carcase. The devils and hypocrites may have more knowledge, and they may have as firm an assent, but this act is above their reach, and they never attain it.

Now because there is some difference amongst divines about the nature and essence of faith, some placing it in assent, some in assurance, &amp;c.; And because there are mistakes amongst ordinary Christians, many concluding they rely on Christ when indeed they do not; And because mistakes are here dangerous, it being a matter of life and death eternal, of salvation or damnation,—faith being the first stone on which the structure of salvation is raised, and an error in the foundation threatens ruin to the whole; It behoves to be diligent in inquiring what this faith is, what the nature of this dependence and relying on Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Faith in The Practical Works of David Clarkson, B.D., Fellow and Tutor of Clare Hall, Cambridge</cite></span></figcaption>

<blockquote><p>This imposing [of Church courts] takes not away judicious believing [by individuals]… If imposing were a commanding that we receive absolutely what they say, be it good, or ill, without examining [whether] the argument were concludent, as God himself requires Abraham to kill his son, Abraham was without examination to give absolute obedience, and this proves God to be Lord of the conscience, for knowing his Word to be his Word, we are not to examine it by the Scripture or Law of Nature, because if we know who speaks, we are not to examine what is spoken. But though we know who speaks among creatures, be it a prophet, an apostle, an angel, yet must we examine both who speaks and what is spoken.</p></blockquote>

<blockquote><p>A politic writer admonishes, retinere antiqua [retain that which is ancient], only with this caution: Si proba [if it is proved]. Calvin (speaking against human ceremonies) says: Si objiciatur, etc. ‘If’, says he, ‘antiquity be objected (albeit they who are too much addicted to custom and to received fashions, do boldly use this buckler to defend all their corruptions), the refutation is easy: For the ancients also themselves with heavy complaints have abundantly testified that they did not approve of anything which was devised by the will of men.’… 3. …If then it be enough to pitch upon custom, why ought not those customs to have been commended and continued? But if they were commendably changed, then ought we not to follow blindly the bare custom of the Church, but examine the equity of the same, and demand grounds of reason for it. St. Paul (says Dr. Fulke) does give reasons for that order of covering women’s heads: By whose example the preachers are likewise to endeavor to satisfy by reason both men and women, that humbly desire their resolution for quiet of their conscience, and not to beat them down with the club of custom only.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“A politic writer admonishes, retinere antiqua [retain that which is ancient], only with this caution: Si proba [if it is proved]. Calvin (speaking against human ceremonies) says: Si objiciatur, etc. ‘If’, says he, ‘antiquity be objected (albeit they who are too much addicted to custom and to received fashions, do boldly use this buckler to defend all their corruptions), the refutation is easy: For the ancients also themselves with heavy complaints have abundantly testified that they did not approve of anything which was devised by the will of men.’… 3. …If then it be enough to pitch upon custom, why ought not those customs to have been commended and continued? But if they were commendably changed, then ought we not to follow blindly the bare custom of the Church, but examine the equity of the same, and demand grounds of reason for it. St. Paul (says Dr. Fulke) does give reasons for that order of covering women’s heads: By whose example the preachers are likewise to endeavor to satisfy by reason both men and women, that humbly desire their resolution for quiet of their conscience, and not to beat them down with the club of custom only.”

— George Gillespie, A Dispute Against the English-Popish Ceremonies, ... (1637), pt. 3, ch. 6, pp. 104-6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+politic+writer+admonishes%2C+retinere+antiqua+%5Bretain+that+which+is+ancient%5D%2C+only+with+this+caution%3A+Si+proba+%5Bif+it+is+proved%5D.+Calvin+%28speaking+against+human+ceremonies%29+says%3A+Si+objiciatur%2C+etc.+%E2%80%98If%E2%80%99%2C+says+he%2C+%E2%80%98antiquity+be+objected+%28albeit+they+who+are+too+much+addicted+to+custom+and+to+received+fashions%2C+do+boldly+use+this+buckler+to+defend+all+their+corruptions%29%2C+the+refutation+is+easy%3A+For+the+ancients+also+themselves+with+heavy+complaints+have+abundantly+testified+that+they+did+not+approve+of+anything+which+was+devised+by+the+will+of+men.%E2%80%99%E2%80%A6+3.+%E2%80%A6If+then+it+be+enough+to+pitch+upon+custom%2C+why+ought+not+those+customs+to+have+been+commended+and+continued%3F+But+if+they+were+commendably+changed%2C+then+ought+we+not+to+follow+blindly+the+bare+custom+of+the+Church%2C+but+examine+the+equity+of+the+same%2C+and+demand+grounds+of+reason+for+it.+St.+Paul+%28says+Dr.+Fulke%29+does+give+reasons+for+that+order+of+covering+women%E2%80%99s+heads%3A+By+whose+example+the+preachers+are+likewise+to+endeavor+to+satisfy+by+reason+both+men+and+women%2C+that+humbly+desire+their+resolution+for+quiet+of+their+conscience%2C+and+not+to+beat+them+down+with+the+club+of+custom+only.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+A+Dispute+Against+the+English-Popish+Ceremonies%2C+...+%281637%29%2C+pt.+3%2C+ch.+6%2C+pp.+104-6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9bbfb27e69.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9bbfb27e69.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-implicit-faith-obedience/#:~:text=A%20politic%20writer%20admonishes%2C%20retinere%20antiqua,with%20the%20club%20of%20custom%20only&amp;text=A%20politic%20writer%20admonishes%2C%20retinere%20antiqua%20%5Bretain%20that&amp;text=them%20down%20with%20the%20club%20of%20custom%20only" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-722a0ddd3a" data-kw="">
<blockquote><p>Though this [Syro-Phoenician / Canaanite] woman had not been regularly educated by any teacher, yet her faith in Christ was not a notion adopted by her at random, but was formed out of the law and the prophets. It was therefore not less absurd than wicked in that dog, Servetus, to abuse this example for the purpose of proving that faith may exist without promises. I do not deny that, in this sense, there may sometimes be a sort of implicit faith, that is, a faith which is not accompanied by a full and distinct knowledge of sound doctrine; provided we also hold that faith always springs from the word of God, and takes its origin from true principles, and therefore is always found in connection with some light of knowledge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Gospels</cite></span></figcaption>

</figure><figure class="quote" id="q-c1abb94772" data-kw="">
<blockquote><p>To this knowledge must be joined assent, which is the second act of faith, whereby a person receives and acknowledges as truths, those things which he knows, &quot;receiving the testimony of God, and thus setting to his seal that God is true,&quot; John 3:33. This assent is principally founded on the infallible veracity of God, who testifies of himself and of his Son, 1 John 5:9, 10.</p></blockquote>

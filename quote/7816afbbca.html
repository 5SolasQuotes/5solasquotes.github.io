<blockquote><p>This rule is the law of nature, first planted and grafted only in the mind of man, than after for that his mind was through sin defiled, filled with darkness, and encumbered with many doubts) set further in writing in the Decalogue or ten commandments: and after reduced by Christ our saviour in to these two words: Thou shalt love thy lord God above all things, and thy neighbour as thy self. The latter part whereof he also thus expoundeth: what so ever ye will that men do unto you, do ye even so to them.

In this law is comprehended all justice, the perfect way to serve and glorify God, and the right mean to rule every man particularly, and all men generally: and the only stay to maintain every common wealth. This is the touchstone to try every man’s doings (be he king or beggar) whether they be good or evil. By this all man’s laws be discerned, whether they be just or unjust, godly or wicked. As for an example. Those that have authority to make laws in a common wealth, make this law, that no pins shall be made, but in their own country. It seemeth but a trifle. Yet if by this means the people may be kept from idleness, it is a good and just law and pleaseth God. For idleness is a vice wherewith God is offended: …

On the other side, if the people be well in other things, and the people of an other country live by pin making, and uttering that if there should be a law made, that they not sell them to their neighbours of the country, otherwise well occupied, it were a wicked and an unjust law. Taking away the mean, whereby they live, a mean is devised to kill them with famine, and so is not only this commandment broken: Thou shalt not kill, but also the general law, that sayeth: Thou shalt love thy neighbour as thy self. And, what so ever ye will that men do unto you, even so do you unto thee. For you your selves would not be killed with hunger.

Likewise if there be a law made, utterly prohibiting any man that can not live chaste, to marry: this is an unjust, an ungodly and a wicked law. For it is an occasion, that where with marrying, he might avoid sin: he not marrying doth commit whoredom in act or thought contrary to God’s will and commandment: Thou shalt not commit whoredom.

Again, a prince forceth his subjects (under the name of request) to lend him that they have, which they do unwillingly: and yet for fear of a worse turn, they must seem to be content therewith. Afterward he causeth to be assembled in a Parliament such as per chance lent nothing, or else such as dare not displease him. They to please him, remit this general debt. This is a wicked, ungodly, and unjust law.

For they do not, as they would be done unto, but be an occasion, that a great [number of people] be undone, their children for lack of sustenance perish through famine, and their servants forced to steal, and perchance to commit murder. So that if men will weigh well this order and law that God hath prescribed to man, Thou shalt love thy lord God above all things, and thy neighbour as thy self. And, what so ever ye will that men do unto you, do ye even the same unto them: they may sone learn to try good from evil, godliness from ungodliness, right from wrong. And it is so plain and easy to be understood, that no ignorance can or will excuse him that therein offendeth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ponet.html">John Ponet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A short treatise of politick power and of the true obedience which subjects owe to kings and other civil governors, with an exhortation to all true natural English men</cite>, (Strasbourg: The heirs of W. Köpfel, 1556), unpaginated.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0403f30cb2" data-kw="">
<blockquote><p>For we are as much obliged to believe non-fundamentals that are clear (as that there were eight persons saved in the ark, and the old world drowned with waters, Sodom burnt with fire), as to believe fundamentals, that there is no name whereby men may be saved, but by the name of Jesus, for the Authority of God speaking in his Word and his command does equally oblige to both; but there is no such necessity so absolute in believing non-fundamentals, as in believing these, without the knowledge whereof, we cannot be saved. But it never follows that errors in non-fundamentals published and taught to the ruin of the souls of many, they having such a strong connection and influence on the knowledge of fundamentals, are to be tolerated since our sinning here does as equally and strongly strike against the authority and express command of God (at least in most things of that kind) as in points fundamental; and therefore the magistrate, who is to look to the honor of God as a Christian, and peace of societies in all, is as much obliged to punish clearly opened, non-fundamental, as fundamental, false doctrines.</p></blockquote>

<blockquote><p>I suppose none will deny, but that the Church of Israel had such Governors: instance their Priests and Levites. In Jehoshaphat’s time there is an express distinction made betwixt Ecclesiastical and Civil Governors under these two phrases, matters of the Lord, and matters of the King. If Church-Governors were an evidence of God’s good Providence under the Law, surely his Providence in this kind, would not be more scanty to the Church under the Gospel: for he hath promised to do better then at her beginnings. A change of Governors there may be, and that for the better; but an utter abolishing of all Governors, proper and peculiar to the Church, cannot be to the better. We expressly read that God hath set in his Church, among other good functions, Governments.

If it be said, that under that word, Governments, civil Magistrates are understood: I answer, that first this phrase, God hath set in the Church, and then the other particulars, among which Governments are reckoned, being all proper and peculiar to the Church, admit not such an interpretation thereof. To them which ask where any mention is made of a ruling Elder, I allege these words of an Apostle, (1 Tim. 5. 17.) The Elders that rule well, &amp;c. Apply them as you please, to Ministers or others: there are ruling Elders.

The word ἡγουμένων twice used by an Apostle, (Heb. 13. 7, 17.) and translated by our last and best Translators of the Bible, them that have rule, sheweth, that Ministers of the Gospel are Church-Governors: for Christians are required to obey them. And that Ministers are there meant, is evident by these phrases, They have spoken unto you the word of God, and they watch for your souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The progress of divine providence, set out in a sermon preached in the Abbey Church of Westminster before the House of Peers, on the 24th of September, 1645. being the day of their monthly fast</cite>, (London: Joshua Kirton, 1645), pp 24-25.</span></figcaption>

equired+to+obey+them.+And+that+Ministers+are+there+meant%2C+is+evident+by+these+phrases%2C+They+have+spoken+unto+you+the+word+of+God%2C+and+they+watch+for+your+souls.%E2%80%9D%0A%0A%E2%80%94+William+Gouge%2C+The+progress+of+divine+providence%2C+set+out+in+a+sermon+preached+in+the+Abbey+Church+of+Westminster+before+the+House+of+Peers%2C+on+the+24th+of+September%2C+1645.+being+the+day+of+their+monthly+fast%2C+%28London%3A+Joshua+Kirton%2C+1645%29%2C+pp+24-25.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F12342aaba7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/12342aaba7.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/06/06/william-gouge-on-ecclesiastical-government-in-the-old-and-new-testaments/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The real alternative placed before the country is that the Government shall become absolutely neutral, and assuredly you never are entitled on scriptural grounds to put that alternative to statesmen, or to any men.

You may put the alternative, no doubt, of giving money to one class or more class; for the mode of countenancing religion may vary with circumstances, but you never lawfully can put the alternative to nations or individuals, of being entirely neutral and indifferent in regard to the cause of Christ; for “he that is not with Christ is against Him.”

Every man is bound to support the cause of Christ, and to oppose that of antichrist. All statesmen are bound to support the cause of Christ, and we must tell them so. No doubt, there may be different forms in which that duty may be discharged, but the duty itself is unalterable and universal. (Hear, hear.) There cannot therefore be lawfully any such alternative as is alleged. It may be, and I believe it is, a more aggravated sin to endow all than to endow none, but to be indifferent to the cause of Christ or to oppose it are always sins. …

But I say, Suppose you get the matter your own way, and that all these endowments of Protestantism in Ireland are overthrown, how is the Government then to support the truth in Ireland? Suppose you disendow Protestantism in Ireland, what of disestablishing it? Does that mean anything else than simply disowning it practically? (Hear, hear.) And when this is done — and done not because Protestantism is untrue, but because it is in a minority — does it not imply that the Government is to become utterly indifferent in regard to religion? I just ask the question. In these circumstances, how is your Establishment principle, or any defensible form of an Establishment principle, to be carried out in Ireland by the Government of this country? …

Well, I would just ask these gentlemen. If you sweep away the Established Church and the Presbyterian Church [in Ireland], as far as the Government is concerned — if you publicly disown both, and the truth which they maintain — if you treat Protestant truth and Popish falsehood as if they were precisely alike, how are those principles to be developed and manifested in regard to Ireland? (Hear, hear.)

This is a very important practical question, and I think, if clearly answered, it would go farther to make us understand what the principles of our friends are than anything else that has occurred. In the absence of any information of that sort, it seems to me that what they and some amongst us are prepared to maintain is this, that the Government are under an obligation to support neither truth nor falsehood, but to be entirely neutral in regard to these in so far as Ireland is concerned. This is a thoroughly indefensible position, and yet this is your ground, as far as I can understand it; and if this be not your ground, I am very anxious that some one should rise up and clearly explain what your doctrine, and that of your allies, is; for there is an immense amount of ambiguity in the statements that are made on the subject. If this be the ground that is taken, I maintain that it is utterly untenable ground, and in a Christian Church, monstrous.

We are no doubt bound to protest to the uttermost against indiscriminate endowments; and I, for my part, would go the length of saying that it is more impious to endow all than to endow none, and that the greatest calamity that could befall the country is the support of Popery by the Government in Ireland, I repudiate such a result in every shape and form. But, on the other hand, I do not see — I have not been able to see — that the Government of this country, especially looking at it as the Government of the United Kingdom, a Protestant kingdom, of which Ireland is merely a part, are entitled to speak of having no alternative but to endow Popery, or to be neutral, or that we, as a Christian Church, are entitled to tell them that any such alternative is presented to them. Will any man take his Bible, and show me out of that Bible, that there is any such principle in the Word of God, before we go an inch farther in that direction? (Hear, hear.)</p></blockquote>

<blockquote><p>That whatsoever Law of GOD, or command of His, we find recorded in the Lawbook, in either of the volumes of God’s statute, the N. T. or the Old, remains obligatory to us, unless we can prove it to be expired, or repealed. So it is with the statute-law of this nation [England], or of any nation; What I can prove to be once enacted, I may urge as still in force, unless any one can answer me with a just proof that it is now out of date, or repealed by a latter Law.</p></blockquote>

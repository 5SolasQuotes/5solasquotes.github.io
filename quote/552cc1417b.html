<main class="wrap"><figure class="quote" id="q-552cc1417b" data-kw="">
<blockquote><p>To the punctual completion of “the third part of uniformity”, that is to say, the preparation of a new Confession of Faith for the contracting churches, the Divines were urged by no immediately pressing necessity in the situation of the Church of England. The existing Thirty-Nine Articles were recognized by them as a soundly Reformed Creed, the doctrine of which required only to be vindicated and cleared from the false interpretations which the reactionary party was already endeavouring to foist upon it With the internal needs of the Church of England alone in view, they might possibly have felt contented with a simple revision of these articles, somewhat more thorough than that they had been engaged upon early in their labours.

The duty of preparing an entirely new Creed was imposed on them solely by the Solemn League and Covenant, by which a common Confession of Faith was made one of the bases of the uniformity in religion which the contracting nations had bound themselves to institute. It was not supposable that either Church would be content simply to accept and make its own the existing Creed of the other. Indeed, neither Church possessed a Creed which it could seriously propose to the other as suitable to the purpose or adequate to the needs of the times.

The old Scotch Confession of 1560, breathing as it does the fervour of the Reformation era and full of noble expressions as it is, is too much of an occasional document, too disproportionate in its development of its topics, and too little complete in its scope or precise in its phraseology to serve as the permanent expression of the faith of a great and comprehensive Church; and the new Confession brought forward by the prelatical party in 1616, though sound in doctrine and in parts finely wrought out, suffered from the same defects.

The Scots themselves recognized that they had no Creed which they could ask the English to adopt as the common Confession of the unified churches, and therefore, when contemplating seeking such unification had it in mind to undertake the preparation of a new Creed for the purpose. There was greater reason for the English to feel similarly with regard to their own formularies. The Thirty-Nine Articles had, in their past experience, proved an inadequate protection against the most dangerous doctrinal reactions. It was therefore that the ecclesiastical authorities had been compelled to put forth, a half-century earlier, those “orthodoxal assertions” which have come down to us under the name of the Lambeth Articles (1595).

It had long been the desire of the Puritans that these Articles should be set alongside of the Thirty-Nine Articles, as an authoritative exposition of their real meaning. This desire had been given expression at the Hampton Court Conference (1604), and had been met in the Church of Ireland by the incorporation of the Lambeth Articles along with the Thirty-Nine Articles into those Irish Articles of 1615, to which we may be sure the Westminster Divines would have turned rather than to the Thirty-Nine Articles, had they thought of recommending the simple adoption of an existing Creed as the doctrinal standard of the unified Churches, and which indeed they did make the basis of their own new Creed.

Although the necessity of a new Creed was a result of the new conditions brought about by the Solemn League and Covenant, therefore, these conditions imposed an absolute necessity for the preparation of such a document; and as time passed on the demand for the accomplishment of the task became ever more urgent. The “woeful longsomeness’’ of the Assembly in all its work was bringing the fulfilment of the engagements into which the nations had entered into jeopardy, and the Scots, who had paid the price of the covenant on the faith of the fulfilment of its provisions, not unnaturally began uneasily to urge their more speedy fulfilment. It was accordingly under pressure from Scotland that the Divines at length entered actively upon the accomplishment of this “third part of uniformity”.</p></blockquote>

<blockquote><p>The similarity [of the determination of the synod in the morning] to the Irish [Pacific] Act [1720] is apparent [which expressly allowed for exceptions], and in the context, especially given [Thomas] Craighead’s involvement, it is certain that it served as the source for the Committee’s proposal… in light of the actual overture by [John] Thomson, which stipulated the two needs [of subscription and adopting a confession], it makes more sense to see the morning session establishing the requirement and terms of subscription and the afternoon session as the formal adoption by the Synod [of the Westminster Confession]. In other words, the Synod’s adopting of the Confession is distinguished from the requirement for subscription and later debates in the American Church has been the result of not recognizing the distinction. The ‘preliminary’ or morning session is the only one to explicitly require subscription. Moreover, allowing presbyteries to judge scruples would be nonsense had the Synod intended to decide what scruples would be allowed in the afternoon session.</p></blockquote>

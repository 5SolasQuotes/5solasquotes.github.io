</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-918b01b664" data-kw="">
<blockquote><p>And for the command, ‘Come out from among them and be ye separate,’ it’s pity that any Christian should need to be told that it speaks only to the Church to come out of the heathen, infidel world (such as are Jews and Mohammedans, and heathens); but there is never a word in all the Bible that bids you ‘Come out of the Church and be ye separate!’ Wonderful! that God should be so abused by misunderstanding Christians! Because He commands men to come out of the infidel world into the Church, they plead it as if He commanded them to come out of the Church into a separated sect. The Church is the House of Christ: Forsake it not, while he stays in it: Forsake it not, for He has promised never to forsake it. Particular Churches indeed he may cast off, but never the universal: Dwell therefore where He dwells.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Catholic, &amp; Catholic Church Described</cite>, … (London: A.M., 1660), pp. 205-6</span></figcaption>

</figure><figure class="quote" id="q-102ae20223" data-kw="">
<blockquote><p>Usually we find the weakest spirits are most violent, there being nothing of judgment to counterbalance affliction. Men are all flame and rage. Liquors, when they run low, and are upon the dregs, they grow more tart and sour: So ’tis usually with the dregs of men; for, when they are weak and run low in parts, their opposition is most troublesome. What ado in the ministry have we with young heady professors, that have more heat than light?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-9f1e6a1d66" data-kw="">
<blockquote><p>The first particular is (as they [the Resolutioners] call it) “The declining the authority of the supreme Church-judicatories of this nation once and again”; They mean the protestations [by the Protesters] against the two late pretended Assemblies at St. Andrews, and Dundee, and Edinburgh… …they [the Protesters] have learned to distinguish betwixt the government of the Church, and the male-administrations and corruptions of the Church-governors; and not to condemn the one [the former] when they are necessarily called to give a testimony against the other [the latter]; Yea, the duty and care they owe to the preservation of the government [of the Church] constrains them to testify against the abusing and corrupting of it: So did our fathers of old, whose protestations against corrupt National Church assemblies are upon record to this day, and so far have they been by men of sound judgments, from being judged because thereof to be against the government, that they are honored amongst the greatest patrons and preservers thereof… …neither do they [the Protesters] think that testifying against the corruptions of many of these that are now in the exercise of the government of the Church, is to dissent from, or to do injury to the government it self;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them</cite>, … (1658), pp. 17-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<main class="wrap"><figure class="quote" id="q-424ca05084" data-kw="">
<blockquote><p>and though there be errors of number, genealogies, etc. of writing in the Scripture, as written or printed, yet we hold providence watches so over it that in the body of articles of faith and necessary truths we are certain with the certainty of faith, it is that same very word of God, having the same special operations of enlightening the eyes, converting the soul, making wise the simple, as being lively, sharper then a two-edged sword, full of divinity, life, majesty, power, simplicity, wisdom, certainty, etc. which the prophets of old and the writings of the evangelists and apostles had.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, (London, 1649), ch. 27, p. 366</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-cb1630fbc8" data-kw="">
<blockquote><p>Though these [circumstances of worship] also, when they have a religious respect put on them, are made essential, and come under the things our Saviour here refers to [Mat. 15:9]. But a thing may then be said to be made a part of worship, when it hath such an holiness put upon it, as to be reputed a medium of our communion with God. And this is not to be judged of by what men say of it, but by the necessary consequence of the usage of it.</p></blockquote>

</figure><figure class="quote" id="q-47f204e9ad" data-kw="">
<blockquote><p>6. Hence follows that all actions and circumstances of their nature indifferent, must lose that indifferency and receive from God some goodness and aptness to edify before they can be the reasonable and nearest matter of any civil or ecclesiastical constitution; Because what rulers can in law and reason command, that they must will as good and apt to edify before they can bind others to will it. But neither the will of a ruler, nor the will of any other can lawfully will a thing indifferent, as it is such: For a thing indifferent, as it is such, is neither good nor evil, and the object of the will is always good. 3. Rulers command as God’s ministers for our good, Rom. 13:4. Ergo [Therefore], the means and actions enjoined for the compassing of this end must be good; for if the end be good, the means as the means must be good; Ergo, they cannot be indifferent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), p. 648</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a501e0525a" data-kw="">
<blockquote><p>Compeared David Balfour of Ballo, giving in a supplication, craving that the parishoners of Portmoak they might not be altogether excluded from having a vote in the list for a minister to them. The presbytery demanded of sir William Douglas, ruling elder of the said parish, what they meant thereby? Who declared that they might have the nomination of three of the six to be listed, which the presbytery thought not agreeable to the act of the General Assembly; and therefore, according to their former act, presented the list to them, craving their consent thereto.</p></blockquote>

</figure><figure class="quote" id="q-4efb55a7e7" data-kw="">
<blockquote><p>It is one thing most requisite, that the true Kirk is discerned from the filthy synagogues by clear and perfect notes, lest we, being deceived, receive and embrace to our condmenation the one for the other. The notes therefore of the true Church of God, we believe, confess and avow to be: First, the true preaching of the Word of God, wherein God has revealed Himself to us, as the writings of the prophets and apostles do declare. Secondly, the right administration of the sacraments of Jesus Christ, which must be annexed unto the Word and promise of God, to seal and confirm the same in our hearts. Lastly, ecclesiastical discipline uprightly administered as God’s Word prescribes, whereby vice is repressed and virtue nourished. Wheresoever then these former notes are seen, and of any time continue (be the number never so few, about two or three) there, without all doubt, is the true Church of Christ, who, according to his promise, is in the midst of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-f4347ee5eb" data-kw="">
<blockquote><p>The most that these [particular] arguments of our [separatist] Brethren do prove, is but that it is lawful to go, and dwell in a congregation where Christ is worshiped in all his ordinances, rather than to remain in that congregation where He is not worshipped in all his ordinances and where the Church censures are neglected, which to us is no separation from the visible Church, but [only] a removal from one part of the visible Church to another, as he separates not out of the house, who removes from the gallery, to remain and lie and eat in the chamber of the same house, because the gallery is cold and smokey, and the chamber not so, for he has not made a vow never to set his foot in the gallery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (London, 1644), pt. 1, ch. 4, section 4, question 5, p. 73</span></figcaption>

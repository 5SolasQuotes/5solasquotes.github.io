<main class="wrap"><figure class="quote" id="q-09f8fd9819" data-kw="Laity reading Scripture">
<blockquote><p>Our opinion is, that the scriptures are not so difficult, but that those who read them attentively may receive from thence advantage and the greatest edification, even laymen, plebeians and the common mass of mankind. … But we affirm that it may be understood by all who desire to know it, and bestow the pains they ought; even as a lamp may be seen by all who choose to open their eyes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 4, ch. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../topics/holy-scripture/perspicuity/reading-by-the-laity.html">Reading by the laity</a></span><span class="t"><a href="../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../topics/holy-scripture/perspicuity/clarity.html">Clarity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-122c26acb8" data-kw="Perspicuity">
<blockquote><p>For we never said that every thing in scripture is easy, perspicuous, and plain; that there is nothing obscure, nothing difficult to be understood; but we confess openly that there are many obscure and difficult passages of scripture … We hold the contrary, that the scriptures are not so difficult but that they may be read with advantage, and ought to be read, by the people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 4, ch. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../topics/holy-scripture/perspicuity/clarity.html">Clarity</a></span><span class="t"><a href="../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../topics/holy-scripture/perspicuity/reading-by-the-laity.html">Reading by the laity</a></span></div>
<div class="actions"><button class="copy" data-copy="“For we never said that every thing in scripture is easy, perspicuous, and plain; that there is nothing obscure, nothing difficult to be understood; but we confess openly that there are many obscure and difficult passages of scripture … We hold the contrary, that the scriptures are not so difficult but that they may be read with advantage, and ought to be read, by the people.”

— William Whitaker, A Disputation on Holy Scripture, Question 4, ch. 1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor%20we%20never%20said%20that%20every%20thing%20in%20scripture%20is%20easy%2C%20perspicuous%2C%20and%20plain%3B%20that%20there%20is%20nothing%20obscure%2C%20nothing%20difficult%20to%20be%20understood%3B%20but%20we%20confess%20openly%20that%20there%20are%20many%20obscure%20and%20difficult%20passages%20of%20scripture%20%E2%80%A6%20We%20hold%20the%20contrary%2C%20that%20the%20scriptures%20are%20not%20so%20difficult%20but%20that%20they%20may%20be%20read%20with%20advantage%2C%20and%20ought%20to%20be%20read%2C%20by%20the%20people.%E2%80%9D%0A%0A%E2%80%94%20William%20Whitaker%2C%20A%20Disputation%20on%20Holy%20Scripture%2C%20Question%204%2C%20ch.%201&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F122c26acb8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/122c26acb8.html">Permalink</a><a class="src" href="https://archive.org/details/disputationonhol00whituoft" rel="noopener" target="_blank">Read it online · Internet Archive</a></div>
</figure><figure class="quote" id="q-47ac56c75b" data-kw="perspicuity">
<blockquote><p>The question is not whether things essential to salvation are everywhere in the Scriptures perspicuously revealed. We acknowledge that there are some things hard to be understood (dysnoēta) and intended by God to exercise our attention and mental powers. The question is whether things essential to salvation are anywhere revealed, at least so that the believer can by close meditation ascertain their truth (because nothing can be drawn out of the more obscure passages which may not be found elsewhere in the plainest terms). As Augustine remarks: “Admirable and healthily the Spirit has so arranged the Scriptures that by the plainer passages he might meet our desires and by the obscurer remove our contempt” (CI 2.6 [FC 2:66; PL 34.39]); and, “We feed in the open places, we are exercised by the obscure; there hunger is driven away, here contempt” (Sermon 71, “De Verbis Domini,” 7.11 [PL 38.450]).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.17.5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/perspicuity.html">Perspicuity</a> › <a href="../topics/holy-scripture/perspicuity/the-vernacular.html">The vernacular</a></span><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/literal-and-spiritual-sense.html">Literal and spiritual sense</a></span></div>

</figure><figure class="quote" id="q-5ba654705c" data-kw="Perspicuity">
<blockquote><p>We do not say that every thing is immediately plain and easy in the scriptures, so as to be intelligible to every one; but we say that those things which at first seem obscure and difficult, are afterwards rendered easy, if one be diligent in reading them, and bring with him a pure and pious mind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 4, ch. 3</span></figcaption>

— William Whitaker, A Disputation on Holy Scripture, Question 4, ch. 3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow%2C%20we%20do%20not%20say%20that%20every%20thing%20is%20immediately%20plain%20and%20easy%20in%20the%20scriptures%2C%20so%20as%20to%20be%20intelligible%20to%20every%20one%3B%20but%20we%20say%20that%20those%20things%20which%20at%20first%20seem%20obscure%20and%20difficult%2C%20are%20afterwards%20rendered%20easy%2C%20if%20one%20be%20diligent%20in%20reading%20them%2C%20and%20bring%20with%20him%20a%20pure%20and%20pious%20mind.%E2%80%9D%0A%0A%E2%80%94%20William%20Whitaker%2C%20A%20Disputation%20on%20Holy%20Scripture%2C%20Question%204%2C%20ch.%203&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5ba654705c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5ba654705c.html">Permalink</a><a class="src" href="https://archive.org/details/disputationonhol00whituoft" rel="noopener" target="_blank">Read it online · Internet Archive</a></div>
</figure><figure class="quote" id="q-b5a60802d9" data-kw="">
<blockquote><p>Take away assertions, and you take away Christianity. … The Holy Spirit is not a Skeptic, nor are what he has written on our hearts doubts or opinions, but assertions more certain, and more firm, than life itself and all human experience.</p></blockquote>

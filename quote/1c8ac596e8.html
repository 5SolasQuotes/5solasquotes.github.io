<main class="wrap"><figure class="quote" id="q-1c8ac596e8" data-kw="">
<blockquote><p>The Christian women appeared open, and in public uncovered, from a phantastical imitation of the she-priests and prophetesses of the gentiles when they showed their idols, as their Pythiae, Bacchae, or Menadae, and the like, who used when they uttered their oracles or celebrated the rites and sacrifices of their gods, to put themselves into a wild and extatical guise, having their faces discovered, their hair disheveled etc. The Corinthian women conceiting themselves, when they prayed or prophesied in the Church, to be acting the parts of the priests, or celebrating sacrifice, were so fond as to imitate them and accordingly cast off their veils, and discovered their faces immodestly in the congregation, and thereby dishonoured their head, that is, were unseemly accontred and dressed on their head. Master Mede on 1 Cor. 11.5, vide [see] Grotius.¹ ¹ In Tertullian’s time, those that professed virginity, took upon them to sit with their faces unveiled in the Church, taking it for a privilege of their rank to disclaim the subjection of the sex, and profess freedom. This is the occasion of his book, De velandis virginibus. Thorndike, Of the Service of God at Religious Assemblies, ch. 6 [p. 190], see more there.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon all the New Testament, Philological &amp; Theological… (London, 1654), on 1 Cor. 11 | v. 5</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-87f72e989e" data-kw="">
<blockquote><p>This thesis argues that in 1 Corinthians 11:2-16 Paul asserts most centrally that women should wear head coverings while praying and prophesying in the Corinthian Christian assembly. I examine the honor and shame value system of the Greco-Roman world, both generally and in specific reference to head adornment, since head coverings and hairstyles were connected to honor and status. Then I look at Paul’s treatment of honor and shame throughout 1 Corinthians, which denounces the worldly value system of status seeking in favor of the value system of the cross. Paul’s stance leads him to subject cultural norms to gospel values…</p></blockquote>

</figure><figure class="quote" id="q-1dd061a1b1" data-kw="">
<blockquote><p>I answer: that for men to pray or prophesy with their heads covered, or with long hair, and women uncovered, were things in their own nature indifferent (unless you make it necessary, as a moral duty for men to pray or prophesy uncovered, and women contra; which no interpreters upon that text do) and yet the apostle enjoins the Corinthians so to do… …in the use of things indifferent; whereas there are at least five [rules] to that purpose: And by the same reason, that the apostle enjoins men to keep decency, he enjoins to keep order; and so other rules, concerning things indifferent. Does not the apostle complain of disorder in the Corinthians preaching covered? yet the contrary order was not necessary, but in itself indifferent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ clavium: or, A Vindication of the Keys of the Kingdom of Heaven, into the Hands of the Right Owners... (London, 1645), ch. 6</cite>, pp. 57-58</span></figcaption>

</figure><figure class="quote" id="q-739251e0d1" data-kw="">
<blockquote><p>Question. But if we see a fashion used in other countries that we like, may we not take it up? Answer. No… Paul taxes it as a great disorder in the Corinthians that men wore long hair, and women went uncovered, 1 Cor. 11.13-14.</p></blockquote>

</figure><figure class="quote" id="q-ccf1687a01" data-kw="">
<blockquote><p>But where find we that women which were prophetesses and immediately inspired were allowed to deliver their prophesy in the Church [according to Gillespie’s objector]? I suppose he had a respect to 1 Cor: 11:5, ‘But every woman that prayeth or prophesieth with her head covered, dishonoureth her head,’ which is meaned of the public assembly, for the apostle is speaking of covering or uncovering the head in the Church. [The argument of the last statement is that one can know that the context in 1 Cor. 11 is of public assemblies of the Church (as opposed to private) because it mentions the practice of headcoverings. That is, headcoverings had a distinctively public function, likely to all such societal, public functions. This is confirmed below.] But diverse interpreters understand here by a woman that prays or prophesies, a woman that joins as a hearer in the public assembly: and so verse 4, by a man that prays or prophesies [signifies] a man that is a hearer and joins in the ordinances. So that the Geneva annotation upon verse 5 gives a good sense of that text: that women which show themselves in public and ecclesiastical assemblies without the sign and token of their subjection, that is to say, uncovered, shame themselves. See more for this in Junius, his annotations on the Arabic version in that place. If the apostle by ‘prophesying’, 1 Cor. 11:4-5, understand prophesying by immediate inspiration, then the objection may be retorted and turned into an argument against the objectors [who advocated for regular lay preaching]: For the sense of the word ‘prophesying’ in the 11th chapter may give light to the word prophesying in the 14th chapter, verse 3. Peter Martyr (Common Places, eccles. 4, ch. 1) is indeed of opinion that women which were prophetesses and extraordinarily inspired might speak in the Church, provided that their heads were covered, in token of feminine subjection, and that the forbidding of women to speak in the Church extends to such, and so he reconciles, 1 Cor. 14:34; 1 Tim. 2:13 with 2 Cor. 11:5. I doubt his opinion in this particular is not well grounded, only so far I make use of it: that if 1 Cor. 11:5 be meant of prophetesses praying or prophesying in the Church (which the Objector has to prove). Then certainly the forbidding of women to speak in the Church cannot be understood universally, but with a reserve and exception of extraordinary cases. But how can this exception of prophetesses consist with the text, ‘Let your women keep silence in the Church,’ Why [Greek] your women, they had prophesying women, as is supposed by these of the other opinion, from 1 Cor. 11:5. Nay, even your women must be silent says the apostle; and the reasons which he adds are so universal as to comprehend even prophetesses, they are commanded to be under obedience, and to be in subjection (which Martyr himself notes), holds true of prophesying women as well as others; and that for that cause their heads were to be covered. Another reason is added, 1 Tim. 2:14, Adam was not deceived; but the woman being deceived, was in the transgression. It might be feared, says Peter Martyr, if women were permitted to speak in the Church, Satan should return to his first wile and deceive the man by the woman. Surely he that made use of Eve might also make use of a prophesying woman to deceive, and so much the more, because, now since the fall, both man and woman are more subject to tentation. So that both the apostle’s command and the reasons of it seem plainly to exclude even prophesying women from speaking in the Church; and if they be allowed to deliver extraordinary prophesies and revelations in the Church, why not also to prophesy as other gifted members? If that which is greater be allowed them, why not that which is less? And if prophetesses be excepted from the rule, 1 Cor. 14:34, why not also other women of excellent gifts?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions… (Edinburgh, 1649), | ch. 5, ‘Whether these prophets and prophesyings in the primitive Church, 1 Cor. 14; 12:28; Eph. 4:11, were extraordinary…’</cite>, pp. 75-76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“But where find we that women which were prophetesses and immediately inspired were allowed to deliver their prophesy in the Church [according to Gillespie’s objector]? I suppose he had a respect to 1 Cor: 11:5, ‘But every woman that prayeth or prophesieth with her head covered, dishonoureth her head,’ which is meaned of the public assembly, for the apostle is speaking of covering or uncovering the head in the Church. [The argument of the last statement is that one can know that the context in 1 Cor. 11 is of public assemblies of the Church (as opposed to private) because it mentions the practice of headcoverings. That is, headcoverings had a distinctively public function, likely to all such societal, public functions. This is confirmed below.] But diverse interpreters understand here by a woman that prays or prophesies, a woman that joins as a hearer in the public assembly: and so verse 4, by a man that prays or prophesies [signifies] a man that is a hearer and joins in the ordinances. So that the Geneva annotation upon verse 5 gives a good sense of that text: that women which show themselves in public and ecclesiastical assemblies without the sign and token of their subjection, that is to say, uncovered, shame themselves. See more for this in Junius, his annotations on the Arabic version in that place. If the apostle by ‘prophesying’, 1 Cor. 11:4-5, understand prophesying by immediate inspiration, then the objection may be retorted and turned into an argument against the objectors [who advocated for regular lay preaching]: For the sense of the word ‘prophesying’ in the 11th chapter may give light to the word prophesying in the 14th chapter, verse 3. Peter Martyr (Common Places, eccles. 4, ch. 1) is indeed of opinion that women which were prophetesses and extraordinarily inspired might speak in the Church, provided that their heads were covered, in token of feminine subjection, and that the forbidding of women to speak in the Church extends to such, and so he reconciles, 1 Cor. 14:34; 1 Tim. 2:13 with 2 Cor. 11:5. I doubt his opinion in this particular is not well grounded, only so far I make use of it: that if 1 Cor. 11:5 be meant of prophetesses praying or prophesying in the Church (which the Objector has to prove). Then certainly the forbidding of women to speak in the Church cannot be understood universally, but with a reserve and exception of extraordinary cases. But how can this exception of prophetesses consist with the text, ‘Let your women keep silence in the Church,’ Why [Greek] your women, they had prophesying women, as is supposed by these of the other opinion, from 1 Cor. 11:5. Nay, even your women must be silent says the apostle; and the reasons which he adds are so universal as to comprehend even prophetesses, they are commanded to be under obedience, and to be in subjection (which Martyr himself notes), holds true of prophesying women as well as others; and that for that cause their heads were to be covered. Another reason is added, 1 Tim. 2:14, Adam was not deceived; but the woman being deceived, was in the transgression. It might be feared, says Peter Martyr, if women were permitted to speak in the Church, Satan should return to his first wile and deceive the man by the woman. Surely he that made use of Eve might also make use of a prophesying woman to deceive, and so much the more, because, now since the fall, both man and woman are more subject to tentation. So that both the apostle’s command and the reasons of it seem plainly to exclude even prophesying women from speaking in the Church; and if they be allowed to deliver extraordinary prophesies and revelations in the Church, why not also to prophesy as other gifted members? If that which is greater be allowed them, why not that which is less? And if prophetesses be excepted from the rule, 1 Cor. 14:34, why not also other women of excellent gifts?”

— George Gillespie, A Treatise of Miscellany Questions… (Edinburgh, 1649), | ch. 5, ‘Whether these prophets and prophesyings in the primitive Church, 1 Cor. 14; 12:28; Eph. 4:11, were extraordinary…’, pp. 75-76">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+where+find+we+that+women+which+were+prophetesses+and+immediately+inspired+were+allowed+to+deliver+their+prophesy+in+the+Church+%5Baccording+to+Gillespie%E2%80%99s+objector%5D%3F+I+suppose+he+had+a+respect+to+1+Cor%3A+11%3A5%2C+%E2%80%98But+every+woman+that+prayeth+or+prophesieth+with+her+head+covered%2C+dishonoureth+her+head%2C%E2%80%99+which+is+meaned+of+the+public+assembly%2C+for+the+apostle+is+speaking+of+covering+or+uncovering+the+head+in+the+Church.+%5BThe+argument+of+the+last+statement+is+that+one+can+know+that+the+context+in+1+Cor.+11+is+of+public+assemblies+of+the+Church+%28as+opposed+to+private%29+because+it+mentions+the+practice+of+headcoverings.+That+is%2C+headcoverings+had+a+distinctively+public+function%2C+likely+to+all+such+societal%2C+public+functions.+This+is+confirmed+below.%5D+But+diverse+interpreters+understand+here+by+a+woman+that+prays+or+prophesies%2C+a+woman+that+joins+as+a+hearer+in+the+public+assembly%3A+and+so+verse+4%2C+by+a+man+that+prays+or+prophesies+%5Bsignifies%5D+a+man+that+is+a+hearer+and+joins+in+the+ordinances.+So+that+the+Geneva+annotation+upon+verse+5+gives+a+good+sense+of+that+text%3A+that+women+which+show+themselves+in+public+and+ecclesiastical+assemblies+without+the+sign+and+token+of+their+subjection%2C+that+is+to+say%2C+uncovered%2C+shame+themselves.+See+more+for+this+in+Junius%2C+his+annotations+on+the+Arabic+version+in+that+place.+If+the+apostle+by+%E2%80%98prophesying%E2%80%99%2C+1+Cor.+11%3A4-5%2C+understand+prophesying+by+immediate+inspiration%2C+then+the+objection+may+be+retorted+and+turned+into+an+argument+against+the+objectors+%5Bwho+advocated+for+regular+lay+preaching%5D%3A+For+the+sense+of+the+word+%E2%80%98prophesying%E2%80%99+in+the+11th+chapter+may+give+light+to+the+word+prophesying+in+the+14th+chapter%2C+verse+3.+Peter+Martyr+%28Common+Places%2C+eccles.+4%2C+ch.+1%29+is+indeed+of+opinion+that+women+which+were+prophetesses+and+extraordinarily+inspired+might+speak+in+the+Church%2C+provided+that+their+heads+were+covered%2C+in+token+of+feminine+subjection%2C+and+that+the+forbidding+of+women+to+speak+in+the+Church+extends+to+such%2C+and+so+he+reconciles%2C+1+Cor.+14%3A34%3B+1+Tim.+2%3A13+with+2+Cor.+11%3A5.+I+doubt+his+opinion+in+this+particular+is+not+well+grounded%2C+only+so+far+I+make+use+of+it%3A+that+if+1+Cor.+11%3A5+be+meant+of+prophetesses+praying+or+prophesying+in+the+Church+%28which+the+Objector+has+to+prove%29.+Then+certainly+the+forbidding+of+women+to+speak+in+the+Church+cannot+be+understood+universally%2C+but+with+a+reserve+and+exception+of+extraordinary+cases.+But+how+can+this+exception+of+prophetesses+consist+with+the+text%2C+%E2%80%98Let+your+women+keep+silence+in+the+Church%2C%E2%80%99+Why+%5BGreek%5D+your+women%2C+they+had+prophesying+women%2C+as+is+supposed+by+these+of+the+other+opinion%2C+from+1+Cor.+11%3A5.+Nay%2C+even+your+women+must+be+silent+says+the+apostle%3B+and+the+reasons+which+he+adds+are+so+universal+as+to+comprehend+even+prophetesses%2C+they+are+commanded+to+be+under+obedience%2C+and+to+be+in+subjection+%28which+Martyr+himself+notes%29%2C+holds+true+of+prophesying+women+as+well+as+others%3B+and+that+for+that+cause+their+heads+were+to+be+covered.+Another+reason+is+added%2C+1+Tim.+2%3A14%2C+Adam+was+not+deceived%3B+but+the+woman+being+deceived%2C+was+in+the+transgression.+It+might+be+feared%2C+says+Peter+Martyr%2C+if+women+were+permitted+to+speak+in+the+Church%2C+Satan+should+return+to+his+first+wile+and+deceive+the+man+by+the+woman.+Surely+he+that+made+use+of+Eve+might+also+make+use+of+a+prophesying+woman+to+deceive%2C+and+so+much+the+more%2C+because%2C+now+since+the+fall%2C+both+man+and+woman+are+more+subject+to+tentation.+So+that+both+the+apostle%E2%80%99s+command+and+the+reasons+of+it+seem+plainly+to+exclude+even+prophesying+women+from+speaking+in+the+Church%3B+and+if+they+be+allowed+to+deliver+extraordinary+prophesies+and+revelations+in+the+Church%2C+why+not+also+to+prophesy+as+other+gifted+members%3F+If+that+which+is+greater+be+allowed+them%2C+why+not+that+which+is+less%3F+And+if+prophetesses+be+excepted+from+the+rule%2C+1+Cor.+14%3A34%2C+why+not+also+other+women+of+excellent+gifts%3F%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+A+Treatise+of+Miscellany+Questions%E2%80%A6+%28Edinburgh%2C+1649%29%2C+%7C+ch.+5%2C+%E2%80%98Whether+these+prophets+and+prophesyings+in+the+primitive+Church%2C+1+Cor.+14%3B+12%3A28%3B+Eph.+4%3A11%2C+were+extraordinary%E2%80%A6%E2%80%99%2C+pp.+75-76&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fccf1687a01.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ccf1687a01.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/head-coverings-in-public-worship/gillespie-rutherford-on-headcoverings-in-public-worship/#:~:text=But%20where%20find%20we%20that%20women,also%20other%20women%20of%20excellent%20gifts%3F" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

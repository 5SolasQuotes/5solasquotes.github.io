<main class="wrap"><figure class="quote" id="q-f9b552319a" data-kw="">
<blockquote><p>Next to the enactment of just and wholesome laws, the due administration of them is of the highest importance to a community. This has accordingly engaged the particular attention of every people who have attained to any considerable degree of civilisation.

The most enlightened nations have separated the judicial from the legislative authority, rendered judges, in the discharge of their functions, independent of the supreme executive magistrate in the state, and adopted other precautions, with the view of keeping the channels by which justice is dispensed through all the departments of society pure and uncorrupted.

Nor is the jealousy which they manifested on this head to be censured as excessive. By the wise and impartial administration of justice a people have been reconciled to the rule of a usurper, and tyranny itself has become tolerable; whereas the neglect or perversion of justice has made them unhappy and discontented under the best form of political government.

The salutary effects of righteous judgment are not confined to the securing of individual rights, the repressing of the bad, and the protecting of the good and peaceable. Under its fostering shade every useful art and every liberal science flourish; the honour of the laws being preserved unsullied, a cheerful obedience is yielded to their authority; morality is promoted by an exhibition of the connexion which subsists between its essential principles and the temporal welfare of men; and piety is indirectly, but powerfully, strengthened by the thoughts being irresistibly raised to the fountain of all justice, and by the representation, faint indeed, but not scenic, which is given of the great assize before which all must at last appear.</p></blockquote>

<blockquote><p>1. Thou shalt not hurt thy own body. One may be guilty of self-murder… (1.) Indirectly and occasionally, as: First, When a man thrusts himself into danger which he might prevent; as if a company of archers were shooting, and one should go and stand in the place where the arrows fly, if the arrow did kill him, he is accessory to his own death. In the law, God would have the leper shut up, to keep others from being infected. Lev. 23:4. Now, if any would be so presumptuous as to go in to the leper, and get the plague of leprosy, he might thank himself; he occasioned his own death. Secondly, A person may be in some sense guilty of his own death, by neglecting the use of means. If sick, and use no physic, if he has received a wound and will not apply balsam, he hastens his own death. God appointed Hezekiah to lay a ” lump of figs upon the boil,” Isa. 38:21. If he had not used the lump of figs, he had been the cause of his own death.</p></blockquote>

</figure><figure class="quote" id="q-fb6fa0c07c" data-kw="">
<blockquote><p>The obligation which all are under individually, to maintain the honour, and support the worship of God, attaches in an especial manner to nations and those who are in public authority over them. “Let us begin with God,” is a maxim applicable to the formation of civil society and laws, as well as to other important undertakings. Men are not to herd together like a number of cattle, making provision merely for their external protection, accommodation and order, forgetting the God that is above. A constitution which did not recognize religion, nor make any provision for its maintenance and defence, would be, in so far, an atheistical constitution. – As magistracy is an ordinance of God, and those invested with it, though chosen by men, are “the ministers of God,” such persons must be under special obligations to maintain his honour. This they are bound to do, not merely by the preservation of justice and peace, but by promoting his worship in their official station, and by resenting open indignities and contempt offered to the Majesty of heaven, by whom they rule, and decree justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie.html">Thomas M’Crie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On church establishments. Extracts from Statement of the difference between the profession of the Reformed Church of Scotland, as adopted by Seceders; and the profession contained in the New Testimony and other acts, as adopted by the General Associate Synod; particularly on the power of civil magis</cite>, (Glasgow, 1832), p. 9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

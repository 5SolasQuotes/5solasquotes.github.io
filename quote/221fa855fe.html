<main class="wrap"><figure class="quote" id="q-221fa855fe" data-kw="">
<blockquote><p>There are many cases in which local separation may be lawful: First, as if our callings justly remove us to another place or country. Secondly, if our spiritual advantage bind us to remove to a better minister and more suitable society when we are free. Thirdly, if our lawful pastors be turned out of the place, and we follow them, and turn away but from usurpers. Fourthly, if the pastors turn heretics or wolves. Fifthly, if the public good of the churches require my removal. Sixthly, if any sin be imposed on me, and I be refused by the Church unless I will commit it. In these and some other such cases a remove is lawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1 | Direction 59</cite>, p. 238</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-271f39cb1b" data-kw="">
<blockquote><p>The whole Sabbath is not to be spent in public, nor yet in private ordinarily, except when the providence of God prevents the opportunity of public assemblies, which is wont [accustomed] to fall out in times of persecution… 2. Such as fall out extraordinarily, or on special occasions, which put unavoidable necessity of intermitting the proper duties of the Day; and if we do not attend them, we shall be further exposed. And of this sort are: (1.) To fight or fly from an invading enemy: if not to be aggressors on such a Day, yet to stand on their own defense, when assaulted. The law of self-preservation calls for it, and the thing itself puts by duties of worship, and if this were not a duty, but unlawful, we should by it become a prey to them that hate us. And as to flying, when oppressed on a Sabbath by a prevailing foe, against whom we cannot defend ourselves, our Savior supposes it lawful, though afflictive, in Mt. 24:20, ‘Pray that your flight be not on the Sabbath Day.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Body of Divinity… (d. 1707; Boston, 1726), Sermon 172, Q. 60</cite>, pp. 584-88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-f2dcc764c1" data-kw="">
<blockquote><p>Question 3: Whether do you not hold all visible believers to be within the visible Church as members thereof, and not ‘without’, in the apostle’s sense, 1 Cor. 5, and therefore ought so to be acknowledged and accepted in all congregations wheresoever they shall come, and are so known: and ought (if they desire and be not otherwise unfit) of right to be permitted to partake in all God’s ordinances and Church privileges there, so far as they personally concern themselves, although they be not as yet fixed members in particular covenant, either with that congregation where for the present they reside, nor with any other? Question 4: Whether you do not hold that baptism rightly (for substance) partaked does make them that are so baptized, members of the visible Church: and so to have right (at least quoad nos [as far as to us]) to all the privileges thereof (so far as they are otherwise fit) until they be cast out (if they so deserve) by excommunication.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>32 Questions (1639) in Richard Mather, Church-Government &amp; Church-Covenant Discussed, in an Answer of the Elders of the Several Churches in New-England to Two &amp; Thirty Questions Sent Over to Them by Diverse Ministers in England, to Declare their Judgments Therein… (London, 1643) Bernard was an English puritan. These questions were answered by the New England congregationalists, but it does not appear that Bernard ever published a response (at least that is on the internet) to those answers.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

<blockquote><p>Nor is it any sinful separation or disorder for the members of one church to communicate occasionally with other churches of Christ, seeing our relation to the universal Church is more strict and inviolable than to any particular church as such.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Church Concord, containing: I. a Dissuasive from Unnecessary Division &amp; Separation, &amp; the Real Concord of the Moderate Independents with the Presbyterians… (London: Parkhurst, 1691), pt. 2, Question 2</cite>, pp. 67-68</span></figcaption>

</figure><figure class="quote" id="q-8a69526e11" data-kw="">
<blockquote><p>That this covenant is not dissolved without the consent of this Church. Distinguish here direct dissolution from indirect, or that which consequently accompanies something else. The former is when someone decides to migrate elsewhere of his own accord; cessation of actual and explicit communion with and in that particular Church follows migration. Here, a free person is subject to the judgment of no Church; nor do the Bin and Luc. 12, D. 14, 14, which pertain directly to the Church. Unless someone extends ecclesiastical unity and power with the Pontificals to all secular matters, in order, as they say, to spiritual matters. … Furthermore, another departure is different from renunciation and separation or division, from exchange: just as one moves from one room to another in the same house, or from house to house in the same city. The former is directly subordinated to the judgment and authority of the Church; the latter is not at all. For he does not depart from Christ and ecclesiastical communion who migrates from one church to another. But he does depart who through migration forsakes all external communion of the Church or even passes over to sects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbert-voetius.html">Gisbert Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics tr. by AI (Amsterdam: Joannes à Waesberge, 1663–1676), vol. 1, ‘The Nature of the Instituted Church’</cite>, pp. 62-63 (PDF p. 67)</span></figcaption>

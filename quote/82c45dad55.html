<main class="wrap"><figure class="quote" id="q-82c45dad55" data-kw="">
<blockquote><p>Discipline and all branches of it are compared to a spiritual rod, 1 Cor. 4:21. The Lord’s Supper is compared to spiritual food or bread; Now it is unlikely that a rod should be a necessary antecedent to food or bread, that is, that children be kept without bread until a rod be provided to whip the dogs and swine… So the commandment for the celebration of the Lord’s Supper is more clear, express, and evident than that for the exercise of discipline.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want</cite>, [Lack] of Church-Government [is] No Warrant for a Total Omission of the Lord’s Supper… (London, 1650) Jeanes (1611–1662) was a presbyterian minister in London., pp. 32-35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ed6c390d0" data-kw="">
<blockquote><p>For if we should suppose that the rites and ceremonies were as expressly set down in the Gospel to be used or forborne in the public worship of God, as the rites and circumstances concerning sacrifices were in the ceremonial law: yet as the sacrifices themselves, much more the modes of preparing and offering them, might be used or omitted for the performance of moral duties, so doubtless, if things of an external, ceremonial nature had been commanded or forbidden in express terms, they might yet be observed or omitted as the substantial service of God and obedience to his greater commands, for charity and peace, might be best performed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-long.html">Thomas Long</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Character of a Separatist, or Sensuality the ground of Separation</cite>, (London: Kettilby, 1677), Preface concerning the Ceremonies of the Church. Long was a conformist.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-e8c1086815" data-kw="">
<blockquote><p>24. The religion that keeps possession of the parish churches¹ will be the national religion: Mourn therefore before God that ever any men professing godliness should either labor to get all sound Protestants to desert the parish churches or that any such have been against the restoring of nonconformists by that called a ‘comprehension’, which was but the withdrawing of such impositions as these very men thought sinful, and all this, lest it should diminish the number and strength of the private churches. By this we see what we are doing against ourselves, if God save us not.</p></blockquote>

</figure><figure class="quote" id="q-4bce4e3a71" data-kw="">
<blockquote><p>Let the prayer, thanksgiving, or blessing of the bread and wine, be to this effect: ‘With humble and hearty acknowledgment of the greatness of our misery, from which neither man nor angel was able to deliver us, and of our great unworthiness of the least of all God’s mercies; to give thanks to God for all his benefits… and for this sacrament in particular, by which Christ, and all his benefits, are applied and sealed up unto us, which, notwithstanding the denial of them unto others, are in great mercy continued unto us, after so much and long abuse of them all…&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Directory for Public Worship</cite>, Of the Celebration of the Communion, or Sacrament of the Lord’s Supper</span></figcaption>

</figure><figure class="quote" id="q-103454afe4" data-kw="">
<blockquote><p>If we ‘stretch out our hands towards Him,’ we must ‘put iniquity far away from us’ (Job 11:13-14); the fruits of all service will else drop off to nothing. ‘Then shall the offering of Judah and Jerusalem be pleasant to the Lord;’ When? when the heart is ‘purged’ by Christ sifting as a ‘purifier of silver’. (Mal. 3:3-4)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God</cite>, (London, 1682), ‘On the Holiness of God’, p. 564</span></figcaption>

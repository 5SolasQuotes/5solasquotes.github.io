<main class="wrap"><figure class="quote" id="q-675e2d1989" data-kw="">
<blockquote><p>From which testimonies [of Jerome], these things are clear: 1. That there was no difference betwixt the names and offices of bishops and presbyters in the days of the apostles; 2 That the difference was not begun by any apostolic constitution; but upon Church-custom, the decrees of Councils and such other grounds. 3. That although he acknowledges some difference for the time, as that bishops were to ordain, from which presbyters were restricted, yet that is clearly asserted by him not to flow from any divine constitution (for there can be none imagined after the apostles days) but from some human or Church constitution…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lecture 3, ‘Concerning the Identity of Angel, Bishop &amp; Presbyter’ in A Commentary upon the Book of the Revelation</cite>, (Edinburgh, 1658), pp. 223-33, p. 226</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-01d9c7d1bc" data-kw="">
<blockquote><p>4. They that distinguish between the key of order and the key of jurisdiction do without question allow the former to the presbyters. Now the key of order (as rightly understood, as Spalatensis has largely opened it) comprehends all that power whereby we do immediately work on the conscience, and so is exercised in foro interno, and not directly in externo. Now that which we have agreed on [in Baxter’s Association] is only so much as belongs to order, or to a presbyter as the ambassador of Christ and [as] his watchman over the souls of those people; and it is to be no further effectual than they conscientiously submit to it, voluntarily, without external force. It is but our preaching and applying God’s Word to the consciences of the hearers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘Objections Answered’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

ad it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-947e6d6c05" data-kw="">
<blockquote><p>Ordinary Ministers follow the form of the Church that is instituted; they are not Ecumenical, National, Provincial, or Diocesan Bishops, but Elders of one Congregation, who in the same sense are also called Bishops in the Scriptures. 29. Those transcendent members of the Hierarchy were merely human creations, brought into the Church without any Divine precept or example.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, 1.39.28–29</span></figcaption>

</figure><figure class="quote" id="q-f58a39d4cf" data-kw="">
<blockquote><p>…for the key of knowledge and the power of pastoral preaching is given, uni subjective, non unitati nisi objective, ‘to one man as to the subject,’ and to the Church, for her salvation and good, as for the end and object; and the pastor being once ordained a pastor, may use these keys, quoad specificationem, independently, for he may preach mercy and wrath, not waiting the Church’s suffrages. Et potestas clavium quoad jurisdictionem data est ecclesiae et subjective et objective, et data est non uni, sed unitati: ‘but the power of the keys,’ in censures, for binding and loosing ‘is given to no one mortal man, but to the Church, both as to the subject, and the object.’ I mean the ministerial Church; and not one man pastor, Pope, or prelate may use the keys; the Church has them and can only validly use them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (London, 1644), pt. 1, ch. 7, section 7, ‘A More Special consideration of Ruling Elders, Deacons &amp; Widows’, p. 154</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-71da08c643" data-kw="">
<blockquote><p>Article 32. We believe that it is expedient, that they who be chosen superintendents in the Church, should wisely consult among themselves, by what means the whole body may conveniently be ruled, yet so as they do not swerve from that which our Lord Jesus Christ has instituted. And this does not hinder but that in some churches there may be those particular constitutions, which will be more convenient for them than for others.</p></blockquote>

<blockquote><p>201. There is in the very essence of the natural power or faculty, besides the vis vel virtus agendi, a certain natural inclination to some things, which is inseparable from it, from which the schoolmen say even of the will that it is quaedam natura, et pondus animae. So the soul is inclined or propense (and not only able) to activity as such, to intellection as such, to volition as such; and objectively to truth as such, and to natural good and felicity as such. And there is an inclination of the soul, which is not essential and inseparable, but is much under the power of the will, and may be got and lost. 202. This adventitious disposition is found in the soul in various degrees: 1. When it is in such a degree only, as that immediately and properly without any other power added, the will may be said to be able to act thus or thus, then it is called a moral power: [2.] But when it is in such a degree as that we are disposed to act promptly and easily, it is called a habit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable, for pacification of the dogmatical Word-Warriors who</cite>, ... (London: White, 1675), sect. 10, ‘Of Natural &amp; Moral Power as Foreseen’; pp. 36-37</span></figcaption>

<blockquote><p>But I add, that, as the Son was the common head [by creation] both of men and angels, so the dignity which was conferred on man belonged to the angels also. For when we hear them called the sons of God (Ps. lxxxii. 6) it would be incongruous to deny that they were endued with some quality in which they resembled the Father. But if He was pleased that his glory should be represented in men and angels, and made manifest in both natures, it is ignorant trifling in Osiander to say that angels were postponed to men, because they did not bear the image of Christ. They could not constantly enjoy the immediate presence of God if they were not like to Him; nor does Paul teach (Col. iii. 10) that men are renewed in the image of God in any other way than by being associated with angels, that they may be united together under one head. In fine, if we believe Christ our felicity will be perfected when we shall have been received into the heavens, and made like the angels. But if Osiander is entitled to infer that the primary type of the image of God was in the man Christ, on the same ground may anyone maintain that Christ behoved to partake of the angelic nature, seeing that angels also possess the image of God.</p></blockquote>

<blockquote><p>Some infer from this passage that men were content with herbs and fruits until the deluge, and that it was even unlawful for them to eat flesh. And this seems the more probable, because God confines, in some way, the food of mankind within certain limits. Then after the deluge [Gen. 9], He expressly grants them the use of flesh. These reasons, however are not sufficiently strong: for it may be adduced on the opposite side, that the first men offered sacrifices from their flocks [Gen. 4]. This, moreover, is the law of sacrificing rightly, not to offer unto God anything except what He has granted to our use. Lastly men were clothed in skins [Gen. 3:21]; therefore it was lawful for them to kill animals. For these reasons, I think it will be better for us to assert nothing concerning this matter. Let it suffice for us, that herbs and the fruits of trees were given them as their common food; yet it is not to be doubted that this was abundantly sufficient for their highest gratification. For they judge prudently who maintain that the earth was so marred by the deluge, that we retain scarcely a moderate portion of the original benediction. Even immediately after the fall of man, it had already begun to bring forth degenerate and noxious fruits, but at the deluge, the change became still greater. Yet, however this may be, God certainly did not intend that man should be slenderly and sparingly sustained; but rather, by these words, He promises a liberal abundance, which should leave nothing wanting to a sweet and pleasant life. For Moses relates how beneficent the Lord had been to them, in bestowing on them all things which they could desire, that their ingratitude might have the less excuse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 1, verse 28</span></figcaption>

olasquotes.github.io%2Fquote%2F8a312a8286.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8a312a8286.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-mans-original-state-in-righteousness/#:~:text=Some%20infer%20from%20this%20passage%20that,ingratitude%20might%20have%20the%20less%20excuse&amp;text=Some%20infer%20from%20this%20passage%20that%20men%20were&amp;text=that%20their%20ingratitude%20might%20have%20the%20less%20excuse" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>One one version [of traducianism], the soul derives form the bodies of the parents. But it is at best difficult to ee how something incorporeal could arise from something corporeal… The other way to interpret traducianism is to hold that the oul derives from the souls of the parents… But it faces another problem. Again, for the reasons considered in chapter 8, the soul is simple or without parts. So how can one’s soul come from the souls of one’s parents? That would seem to require that a part of one’s fatehr’s soul and a part of one’s mother’s soul be passed down to their offspring. But, again, souls do not have parts. It would also seem to require that those parts be combined in order to make up the soul of the child. But souls cannot be made up of parts, because, once again, they lack parts. So it seems that traducianism, on either interpretation, fails. Creationism is the alternative view that… God and the parents together produce the new human being… …Hence, suppose that the existence of God can be independently established… Suppose it can also be established that only God can create something ex nihilo. And suppose that… it can be established that there is no way in principle for a soul to come into being except by being created ex nihilo. Then the appeal to divine action [in creating the soul] will by no means be either ad hoc or a “God of the gaps” explanation. It will be the only possible explanation. My own view is that it is indeed the only possible explanation.</p></blockquote>

<blockquote><p>We therefore come to show the properties of this righteousness and holiness that was thus fixed in Adam’s heart: 1. It’s called original, to difference it from actual holiness; as we call it ‘original sin’, to distinguish it from actual: and therefore the learned call it original, partly in regard of itself, because it was the first righteousness; partly because of Adam, who had it as soon as he was created. As the schools say of original sin, Quam primum originatur homo, originatur itidem peccatum; so we may of Adam in his righteousness, In ortu virtus, as the father said, In ortu vitium est: and partly in regard of his posterity, for it should have been propagated to them. 2. Another property of this righteousness is that it is universal, comprehending the rectitude of all the parts and faculties of the soul: so that Adam was, for his soul, as Absalom is said to be comely for his body, from the head to the foot no blemish at all: so that this was not a perfection in one part only, but all over; as our corruption makes us, as he said of the martyr wounded in many places, totum vulnus. 3. It was harmonious: there was not only rectitude in every part, but a sweet correspondency one with the other; there was no rebellion or fight between the inferiour appetite and the understanding. Therefore some learned men say, This righteousness is not to be conceived as an aggregation of several habits, but as an inward rectitude of all faculties: Even as the exact temperament of the body is not from any superadded habit, but from the natural constitution of the parts. 4. This righteousness and holiness, it was a perfection due to Adam, supposing the end to which God made him. If God required obedience of Adam to keep the law, and happinesse thereupon, it was due not by way of merit, but condecency to God’s goodness, to furnish him with abilities to perform it; as the soul of Adam was a due to him, supposing the end for which God made him. Indeed, now it’s of grace to us, and in a far different consideration made ours, because we lost it. Lastly, this was to be a propagated righteousness; for, as it is to be proved hereafter, God did all this in a way of covenant with Adam, as a public person: And howsoever every thing that Adam did personally was not made ours, (we did not eat in his eating, nor drink in his drinking, we did not dress the garden in his dressing of it) yet that which he did federally, as one in convenant with God, that is made ours; so his sin and misery is made ours, then his righteousness and happiness: As it is now, By one man sin entred into the world, and death by sin; so then it would have been by one man righteousness, and life by righteousness. Questions to be made: 1. Whether this righteousness was natural to Adam, or no? Howsoever some have thought this a mere contention of words, and therefore if they were well explained, there would be no great difference; yet the Papists make this a foundation for other great errors: for, grant this righteousness to be supernatural to Adam, as it is to us, then: 1. It will follow that all the motions rising in the appetite against reason, are from the constitution of our nature; and so no more sin than hunger and thirst is. 2. That freewill is still in us, and that we have lost nothing but that which is merely superadded to us. Or they compare this righteousness Adam had, sometimes to an antidote, which preserves against the deadly effect of poison: sometimes to a bridle, that rules the horse; so that they suppose man’s nature would of itself rebel, but only this was given to Adam to check it: sometimes to Sampson’s hair, whereby he had supernatural strength, but when that was cut off, he had only natural: So that by this doctrine, man, now fallen, should be weaker than he was, but not corrupted. Therefore we must necessarily conclude that this righteousness was natural to him; not indeed flowing from the principles of nature, for so it was of God, but it was a perfection suitable or connatural to him; it was not above him, as it is now in us. As a blind man that was made to see, though the manner was supernatural, yet to see was a natural perfection.</p></blockquote>

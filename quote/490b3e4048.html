</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f980f0e3eb" data-kw="" data-pol="">
<blockquote><p>God freely justifies the persons whom he effectually calls. He does this, not by infusing righteousness into them but by pardoning their sins and by accounting them, and accepting them as righteous. This He does for Christ’s sake alone and not for anything wrought in them or done by them. The righteousness which is imputed to them, that is, reckoned to their account, is neither their faith nor the act of believing nor any obedience to the gospel which they have rendered, but Christ’s obedience alone. Christ’s one obedience is twofold – His active obedience rendered to the entire divine law, and His passive obedience rendered in his death.</p></blockquote>
<figcaption>— <a href="../authors/westminster-assembly.html">Westminster Assembly</a>, <cite>Westminster Confession of Faith</cite>, 11.1 (modern English)</figcaption>
<div class="meta"><a class="tag" href="../topics/salvation/justification.html">Justification</a><a class="tag" href="../topics/salvation/imputation.html">Imputation</a></div>

</figure><figure class="quote" id="q-e399ae0de2" data-kw="Imputation Forgiveness" data-pol="">
<blockquote><p>Sin, however, though it ceases to reign, ceases not to dwell in them. … We admit that these remains, just as if they had no existence, are not imputed, but we, at the same time, contend that it is owing to the mercy of God that the saints are not charged with the guilt which would otherwise make them sinners before God.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 3.3.11</figcaption>

<main class="wrap"><figure class="quote" id="q-d3c9cedb8f" data-kw="">
<blockquote><p>The finally lost are not to be conceived of as having faint desires and aspirations for a holy and heavenly state, and as feebly but really inclined to sorrow for their sin, but are kept in hell contrary to their yearning and petition. They are sometimes so described by the opponent of the doctrine, or at least so thought of.

There is not a single throb of godly sorrow, or a single pulsation of holy desire, in the lost spirit. The temper toward God in the lost is angry and defiant. “They hate both me and my father,” says the Son of God, “without a cause” (John 15:24, 25). Satan and his followers “love darkness rather than light,” hell rather than me heaven, “ because their deeds are evil ” (John 3:19). Sin ultimately assumes a fiendish form, and degree. It is pure wickedness without regret or sorrow, and with a delight in evil for evil’s sake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Endless Punishment</cite>, (New York: Charles Scribner’s Sons, 1886), p. 155.</span></figcaption>

<blockquote><p>VII. Third, the thief is admitted into paradise before the ascension of Christ according to his promise, “Today shalt thou be with me in paradise” (Lk. 23:43). Nor should it be said here that “today” must be construed with the preceding verb (“I say”) and not with what follows (“shalt thou be with me”) so that the meaning is “today I say unto thee, thou shalt be with me in paradise” (to wit, at the last judgment) because the construction will not suffer this. In vain would this be added because no one speaks except in the present time and it is clear that Christ refers to the words of the thief, “Remember me when thou comest into thy kingdom” (v. 42). Nor should it be said that paradise is limbo (as Maldonatus holds), because it appears from Scripture that paradise is located in heaven as a place of delight and of eternal happiness (2 Cor. 12:2, 4; Rev. 2:7). Nor should it be said that the thief requested only this—that Christ should remember him in paradise—because it is not absurd to say that Christ gave more to him than he asked, as the most kind Father is accustomed to do above what we seek. Nor is this a privilege peculiar to the thief and not common to others since faith and repentance (to whom this is given by Christ) is common to all true believers. Hence Bellarmine rightly proves from this passage that the saints immediately after death enjoy the vision of God (“De Sanctorum Beatitudine,” 1.7 Opera [1857], 2:437–38).

VIII. Fourth, Enoch and Elijah were translated to heaven (Heb. 11:5; 2 K. 2:11). For although this was peculiar to them that they were bodily whirled into heaven, it was not singular that they were spiritually admitted into it; yea, they were the solemn pledges to the pious of the heavenly glory to be at length obtained. Nor if the letter said to have been written from Elijah to Jehoram (2 Ch. 21:12) was handed to the king only after Elijah’s death, does it follow that it was written after his translation. It is one thing for it to have been written after his translation; another to have been given only then. The emptiness of the figment concerning the translation of Enoch and Elijah to a terrestrial paradise, also concerning their return to war against Antichrist has been elsewhere exposed (Volume I, Topic VIII, Question 7, Section 9).

IX. Fifth, the ancient believers waited for a heavenly city (Heb. 11:10) and had a great consolation and certain hope of glory in death (which would not have been the case if they had as yet to be hurled into hell). How could Jacob have testified that he waited with such earnestness the salvation of the Lord (Gen. 49:18) and David that he committed his spirit into the hand of the Lord (Ps. 31:5), if they should still be far off from the face of God and were to be glorified only after many ages? Nor can it be said that David thus commended to God the perfection of life because the words can bear no other meaning according to the style of Scripture than to deliver the soul to God (as is evident from the example of Stephen, Acts 7:59).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.11.7–9;, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 2 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 259–60.</span></figcaption>

+2%3A11%29.+For+although+this+was+peculiar+to+them+that+they+were+bodily+whirled+into+heaven%2C+it+was+not+singular+that+they+were+spiritually+admitted+into+it%3B+yea%2C+they+were+the+solemn+pledges+to+the+pious+of+the+heavenly+glory+to+be+at+length+obtained.+Nor+if+the+letter+said+to+have+been+written+from+Elijah+to+Jehoram+%282+Ch.+21%3A12%29+was+handed+to+the+king+only+after+Elijah%E2%80%99s+death%2C+does+it+follow+that+it+was+written+after+his+translation.+It+is+one+thing+for+it+to+have+been+written+after+his+translation%3B+another+to+have+been+given+only+then.+The+emptiness+of+the+figment+concerning+the+translation+of+Enoch+and+Elijah+to+a+terrestrial+paradise%2C+also+concerning+their+return+to+war+against+Antichrist+has+been+elsewhere+exposed+%28Volume+I%2C+Topic+VIII%2C+Question+7%2C+Section+9%29.+IX.+Fifth%2C+the+ancient+believers+waited+for+a+heavenly+city+%28Heb.+11%3A10%29+and+had+a+great+consolation+and+certain+hope+of+glory+in+death+%28which+would+not+have+been+the+case+if+they+had+as+yet+to+be+hurled+into+hell%29.+How+could+Jacob+have+testified+that+he+waited+with+such+earnestness+the+salvation+of+the+Lord+%28Gen.+49%3A18%29+and+David+that+he+committed+his+spirit+into+the+hand+of+the+Lord+%28Ps.+31%3A5%29%2C+if+they+should+still+be+far+off+from+the+face+of+God+and+were+to+be+glorified+only+after+many+ages%3F+Nor+can+it+be+said+that+David+thus+commended+to+God+the+perfection+of+life+because+the+words+can+bear+no+other+meaning+according+to+the+style+of+Scripture+than+to+deliver+the+soul+to+God+%28as+is+evident+from+the+example+of+Stephen%2C+Acts+7%3A59%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+12.11.7%E2%80%939%3B%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger%2C+vol.+2+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%9397%29%2C+259%E2%80%9360.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff4007d5c72.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" hr

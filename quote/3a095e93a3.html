<main class="wrap"><figure class="quote" id="q-3a095e93a3" data-kw="">
<blockquote><p>We, on the other hand, teach and comfort an afflicted sinner this way: “Brother, it is impossible for you to become so righteous in this life that your body is as clear and spotless as the sun. You still have spots and wrinkles (Eph 5:27), and yet you are holy.” But you say: “How can I be holy when I have sin and am aware of it?” “That you feel and acknowledge sin—this is good. Thank God, and do not despair. It is one step toward health when a sick man admits and confesses his disease.” “But how will I be liberated from sin?” “Run to Christ, the Physician, who heals the contrite of heart and saves sinners. Believe in Him. If you believe, you are righteous, because you attribute to God the glory of being almighty, merciful, truthful, etc. You justify and praise God. In short, you attribute divinity and everything to Him. And the sin that still remains in you is not imputed but is forgiven for the sake of Christ, in whom you believe and who is perfectly righteous in a formal sense. His righteousness is yours; your sin is His.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 233.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“We, on the other hand, teach and comfort an afflicted sinner this way: “Brother, it is impossible for you to become so righteous in this life that your body is as clear and spotless as the sun. You still have spots and wrinkles (Eph 5:27), and yet you are holy.” But you say: “How can I be holy when I have sin and am aware of it?” “That you feel and acknowledge sin—this is good. Thank God, and do not despair. It is one step toward health when a sick man admits and confesses his disease.” “But how will I be liberated from sin?” “Run to Christ, the Physician, who heals the contrite of heart and saves sinners. Believe in Him. If you believe, you are righteous, because you attribute to God the glory of being almighty, merciful, truthful, etc. You justify and praise God. In short, you attribute divinity and everything to Him. And the sin that still remains in you is not imputed but is forgiven for the sake of Christ, in whom you believe and who is perfectly righteous in a formal sense. His righteousness is yours; your sin is His.”

og.net/2023/08/luther-christ-the-physician/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-86e2524294" data-kw="">
<blockquote><p>Though we do good works, we do not found our salvation upon them; for we can do no work but what is polluted by our flesh, and also punishable; and although we could perform such works, still the remembrance of one sin is sufficient to make God reject them. Thus, then, we would always be in doubt, tossed to and fro without any certainty, and our poor consciences would be continually vexed if they relied not on the merits of the suffering and death of our Savior.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Belgic Confession Art. 34”</cite>, Art. 24</span></figcaption>

</figure><figure class="quote" id="q-a56619ff23" data-kw="">
<blockquote><p>For 2. I add, it is by the satisfaction of Christ the Redeemer, wherein are contained both the matter and form of the justification of a sinner. The matter is Christ’s satisfaction, his obedience in his life, in his death; in fulfilling the law, and in suffering for our not fulfilling it; and the merit of all manifested in his resurrection and glorious ascension. The form is the imputing of that obedience whereby the righteousness of Christ does now become the believer’s as truly and really by imputation as it was Christ’s own in action.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-taylor.html">Thomas Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Titus</cite>, (Cambridge: Greene, 1612), on chapter 3, v. 7, p. 666 Taylor (1576-1632) was partially conforming English puritan.</span></figcaption>

</figure><figure class="quote" id="q-c64ad2cf9a" data-kw="">
<blockquote><p>The word “Gospel” is Greek and signifies “joyous news,” because it proclaims the wholesome doctrine of life by divine promise and offers grace and forgiveness of sin. Therefore, works do not belong to the Gospel, for it is not Law; rather, only faith [belongs to the Gospel], for it is altogether a promise and an offer of divine grace. Whoever now believes the Gospel receives grace and the Holy Spirit. This causes the heart to rejoice and find delight in God, and [the heart] then keeps the Law voluntarily, gratuitously, without fear of punishment, without seeking reward, since the heart is perfectly satisfied with God’s grace, by which the Law has been fulfilled. But all these promises from the beginning of the world are founded on Christ; God promises no one this grace except in Christ and through Christ, who is the messenger of the divine promise to the whole world. For this reason He came and through the Gospel brought into all the world these promises, which before this had been proclaimed by the prophets. Therefore, there is nothing that anyone (like the Jews) should expect of the divine promises apart from Christ. Everything is drawn together and enclosed in Christ. Whoever does not hear Him hears no promises of God. For just as God acknowledges no law besides the Law of Moses and the writings of the prophets, so He makes no promises except through Christ alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Year in the Gospels with Martin Luther</cite>, (p. 64). Concordia Publishing. Kindle Edition.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

<blockquote><p>Nothing but the merit of Christ can be our righteousness in the sight of God, either as a whole, or a part only. We are justified only by believing, and receiving the righteousness of another, and not by our own works, or merit.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c1d30d17d5" data-kw="">
<blockquote><p>Q. 26. Are our forefathers to be blamed for pulling down altars, images, and other monuments of idolatry, from places of public worship at the Reformation? No; they had Scripture precept and warrant for what they did, Num. 33:52, and Deut. 7:5 — “Ye shall destroy their altars, and break down their images, and cut down their groves, and burn their graven images with fire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fisher.html">James Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Assembly’s Shorter Catechism Explained</cite>, (1753)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | pt. 3, ch. 2, p. 16</span></figcaption>

</figure><figure class="quote" id="q-65efbc49b5" data-kw="">
<blockquote><p>As for the veils wherewith the apostle would have women covered whileas they were praying (that is in their hearts following the public and common prayer) or prophesying (that is singing, 1 Sam. 10:10; 1 Chron. 25:1) they are worthy to be covered with shame as with a garment, who allege this example for sacred significant ceremonies of human institution. This covering was a moral sign, for that comely and orderly distinction of men and women which civil decency required in all their meetings: wherefore, that distinction of habits [garments], which they used for decency and comliness in their common behavior and conversation, the apostle will have them, for the same decency and comeliness still to retain in their holy assemblies. And further the apostle shows, that it is also a natural sign, and that nature itself teaches it: therefore he urges it both by the inferiority or subjection of the woman vv. 3. 8-9 (For covering was then a sign of subjection) and by the long hair which nature gives to a woman v. 15. Where he would have the artificial covering, to be fashioned in imitation of the natural. What need we anymore? Let us see nature’s institution, or the apostles’ recommendation for the controverted ceremonies (as we have seen them for women’s veils) and we yield the argument. Last of all, the sign of imposition of hands, helps not the cause of our Opposites, because it the example of Christ, and the apostles, and their disciples, which our ceremonies have not: yet we think not imposition of hands to be any sacred or mystical sign, but only a moral, for designation of a person: let them who think more highly or honorably of it, look to their warrants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies, pt. 3</cite>, ch. 5, pp. 90-91</span></figcaption>

</figure><figure class="quote" id="q-edbc3687c1" data-kw="">
<blockquote><p>I respond that it was a part of the obedience to the divinely given ceremonial laws until the death of Christ, and a fulfilling of the time of correction (Col. 2; Heb. 9). But by the death of Christ, it being one with the other ceremonials, became defunct as to observing it in conscience, yet not however until it had an honest funeral, but from reason of the scandal of the weak from amongst the circumcision, some of them were to observe them in parts till the Jews may be fully and plainly convicted of the cessation of the ceremonial law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, (Amsterdam, 1663-1676) | vol. 1, pt 1, bk. 2, ‘Of Ecclesiastical Things, or Acts &amp; Exercises’, Tract 1, ‘Of Formularies, or Liturgies &amp; Rituals’ | ch. 8. ‘Questions on Some Rituals in Particular: on the Laying on of Hands, the [Holy] Kiss, Abstinence from Things Strangled &amp; Blood, the Marriage Rite, Anointing, Shaking the Feet of Dust, Love Feasts, the Rite of Covenanting &amp; of the Washing of Feet.’, pp. 460-81 3 sections | Section 3 | Problem 3, ‘What ought to be made of abstinence from suffocated things and blood (Acts 15)?, p. 471</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

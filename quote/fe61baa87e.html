<blockquote><p>Distinction 2. If the sins be against the worship of God, as idolatry, or sins of a wicked conversation, the worship of God remaining pure and sound, at least in professed fundamentals. 3. If the idolatry be essential idolatry, as the adoring of the work of men’s hands, or only idolatry by participation, as Popish ceremonies, the surplice and cross, being as means of worship, but not adored, and so being idols by participation, as [William] Ames and Mr. [John] Ball do well distinguish (Fresh Suit Against Ceremonies [pt. 2, ch. 2, sect. 10-14, p. 207, says 107]; Answer to Mr. Cann, pt. 2, p. 23), and before them, so does the learned [John] Reynolds (De [romanae ecclesiae] idololatria, bk. 2, ch. 2) and [Thomas] Bilson (of Chri. Ar. Subject., part 4, pp. 321-22) make use of the distinction. … 5. Diverse degrees of separation are to be considered: hence these considerations: … 2. If the whole and most part of the Church turn idolatrous and worship idols (which is essential idolatry), we are to separate from that Church: the Levites and the two tribes did well, as Mr. Ball says, to make a separation from Jeroboam’s calves; and the godly, laudably, 2 Kings 16:11, did not separate from the Israel and Church of God because the altar of Damascus was set up, and because of the high places. Things dedicated unto idols, as Lutheran images, may be called, and are called, 1 Cor. 10:34 [vv. 14, 28], idolatry, yet are they idolatry by participation, and so the cup of devils, 1 Cor. 10 [v. 21]. Paul does not command separation from the Church of Corinth and the Table of the Lord there. … 5th Consideration. I see not but we may¹ separate from the Lord’s Supper where bread is adored and from baptism where the sign of the Cross is added to Christ’s ordinances, and yet are we not separated from the Church, for we professedly hear the Word, and visibly allow truth of the doctrine maintained by that Church, which do pollute the sacraments, and we are ready to seal it with our blood, and it is an act of visible profession of a Church to suffer for the doctrine mentioned by that Church. ¹ [Note that Rutherford says we “may”, and not that it is a necessity. As Samuel Bolton says on this page, one might be physially forced to attend the mass, yet this is without guilt. Baxter, also on this page, argues that one may submit to one’s baby being baptized with the sign of the cross in certain necessary conditions.] 6. We may well hold that [Pseudo?] Ambrose says well that a Church wanting the foundation of the apostles, is to be forsaken (Commentary on Luke, bk. 6, ch. 1 [This work is not in Patrologia Latina vols. 14-17 and may not be rightly attributed, yet see this reference for it]). … 8. There may be causes of non-union with a Church, which are not sufficient causes of separation: Paul would not separate from the Church of the Jews though they rejected Christ, till they openly blasphemed, Acts 13:44-46; Acts 18:6. And when they opposed themselves and blasphemed, Paul shook his raiment and said unto them, ‘Your blood be upon your own heads, I am clean; from henceforth I will go to the Gentiles.’ There is a lawful separation, and yet before the Jews came to this, there was no just cause why any should have joined to the Church of the Jews who denied the Messiah and persecuted his servants, Acts 4; Acts 5, seeing there was a cleaner Church to which converts might join themselves, Acts 2:40-42. 9. There is no just cause to leave a less clean Church (if it be a true Church) and to go to a purer and cleaner, though one who is a member of no Church have liberty of election to join to that Church which he conceives to be purest and cleanest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644) | pt. 2, ch. 4, sect. 5, pp. 252-55</span></figcaption>

<blockquote><p>Moses was not so well when he was in Midian, as if he had been in Canaan, yet better than when he was in Egypt: for though Jethro had not the worship of God pure in every respect, yet was not he an idolater. For then Moses would not have dwelt with him, nor yet have sacrificed with him, if he had offered to a strange God. Whence we learn two things: The first, that if we have the chief and principal points of religion with us although there may be some wants and defects, yet that we make much of God’s great blessing therein, and labor carefully and diligently to use them, showing ourselves thankful to God for them: so will the Lord in his due time bestow more blessings upon us, and minister that which is wanting unto us. Secondly, that the Lord will always have some to keep his truth, to the glory of his own name, and the condemnation of the wicked. Jethro’s religion may be tried by these notes: 1. That he rejoiced more for the deliverance of God’s people than for the promotion of his son. 2. Because he was careful to confirm his faith by the experience of them which had received greater graces. 3. Because his joy did break out into an open profession of sacrifice. 4. His divine speech and good counsel which he gave to Moses does testify that he was a pure worshipper of God: at the least he held the chiefest, and was not a novice in religion. By Jethro’s example we may learn to try our religion, if it be pure, then: [1.] It works in us a care to use all the means. 2. We take joy in them. 3. We express the fruits of it in our life. 4. We rejoice more at the prosperity of God’s people than at our own preferments or commodity.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Moses was not so well when he was in Midian, as if he had been in Canaan, yet better than when he was in Egypt: for though Jethro had not the worship of God pure in every respect, yet was not he an idolater. For then Moses would not have dwelt with him, nor yet have sacrificed with him, if he had offered to a strange God. Whence we learn two things: The first, that if we have the chief and principal points of religion with us although there may be some wants and defects, yet that we make much of God’s great blessing therein, and labor carefully and diligently to use them, showing ourselves thankful to God for them: so will the Lord in his due time bestow more blessings upon us, and minister that which is wanting unto us. Secondly, that the Lord will always have some to keep his truth, to the glory of his own name, and the condemnation of the wicked. Jethro’s religion may be tried by these notes: 1. That he rejoiced more for the deliverance of God’s people than for the promotion of his son. 2. Because he was careful to confirm his faith by the experience of them which had received greater graces. 3. Because his joy did break out into an open profession of sacrifice. 4. His divine speech and good counsel which he gave to Moses does testify that he was a pure worshipper of God: at the least he held the chiefest, and was not a novice in religion. By Jethro’s example we may learn to try our religion, if it be pure, then: [1.] It works in us a care to use all the means. 2. We take joy in them. 3. We express the fruits of it in our life. 4. We rejoice more at the prosperity of God’s people than at our own preferments or commodity.”

— Richard Greenham, The Works of… Richard Greenham… (d. 1594?; London: Welby, 1612), pt. 4, ‘Godly Instructions’, ch. 66, ‘Of God’s Worship, &amp; of Religion True &amp; False’, p. 803">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMoses+was+not+so+well+when+he+was+in+Midian%2C+as+if+he+had+been+in+Canaan%2C+yet+better+than+when+he+was+in+Egypt%3A+for+though+Jethro+had+not+the+worship+of+God+pure+in+every+respect%2C+yet+was+not+he+an+idolater.+For+then+Moses+would+not+have+dwelt+with+him%2C+nor+yet+have+sacrificed+with+him%2C+if+he+had+offered+to+a+strange+God.+Whence+we+learn+two+things%3A+The+first%2C+that+if+we+have+the+chief+and+principal+points+of+religion+with+us+although+there+may+be+some+wants+and+defects%2C+yet+that+we+make+much+of+God%E2%80%99s+great+blessing+therein%2C+and+labor+carefully+and+diligently+to+use+them%2C+showing+ourselves+thankful+to+God+for+them%3A+so+will+the+Lord+in+his+due+time+bestow+more+blessings+upon+us%2C+and+minister+that+which+is+wanting+unto+us.+Secondly%2C+that+the+Lord+will+always+have+some+to+keep+his+truth%2C+to+the+glory+of+his+own+name%2C+and+the+condemnation+of+the+wicked.+Jethro%E2%80%99s+religion+may+be+tried+by+these+notes%3A+1.+That+he+rejoiced+more+for+the+deliverance+of+God%E2%80%99s+people+than+for+the+promotion+of+his+son.+2.+Because+he+was+careful+to+confirm+his+faith+by+the+experience+of+them+which+had+received+greater+graces.+3.+Because+his+joy+did+break+out+into+an+open+profession+of+sacrifice.+4.+His+divine+speech+and+good+counsel+which+he+gave+to+Moses+does+testify+that+he+was+a+pure+worshipper+of+God%3A+at+the+least+he+held+the+chiefest%2C+and+was+not+a+novice+in+religion.+By+Jethro%E2%80%99s+example+we+may+learn+to+try+our+religion%2C+if+it+be+pure%2C+then%3A+%5B1.%5D+It+works+in+us+a+care+to+use+all+the+means.+2.+We+take+joy+in+them.+3.+We+express+the+fruits+of+it+in+our+life.+4.+We+rejoice+more+at+the+prosperity+of+God%E2%80%99s+people+than+at+our+own+preferments+or+commodity

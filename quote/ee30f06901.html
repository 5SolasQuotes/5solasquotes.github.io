<blockquote><p>Our fathers were exposed to great peril, when they entered into covenant with God, 1643, London, in that immortal bond, known as the Solemn League and Covenant. The Pope, Urban VIII, had engaged all the Roman Catholic powers of Continental Europe in an impious confederacy against the Protestant church, and the cause of liberty in Britain. God blessed the Solemn League and Covenant to defeat their plans.

Our own times are fraught with danger to the church. The complexion, animating spirit, and administration of every civil government in the world is adverse to the government of Messiah, the Prince of the kings of the earth. “The Devil has come down, having great wrath, for he knoweth he hath but a short time.” All the organized systems of worship, as systems which are confederated with these bad thrones, give their power to the beast, in the war which the dragon wages with’ the Lamb. Messiah calls on all his followers to unite in solemn covenanting for the city of our God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-renwick-willson.html">James Renwick Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Seasons of Covenanting , 6, no. 5, Covenanter</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>The earliest discussions upon this subject, in the seventeenth century, were connected with the rise and progress of the Arminian controversy in Holland, and arose out o the interference of the civil authorities in the theological disputes which the views of Arminius and his followers produced –so much so, that it has been said that this might be regarded as a sixth point or article in the Arminian controversy. The Arminians generally adopted Erastian views… The cause of this was partly, no doubt, because they found that, during the earlier stages of the controversy, previous to the calling of the Synod of Dort, the civil authorities generally favored them, and were disposed to promote their views… But their leaning to Erastianism had a deeper foundation than this, in the general character and tendency of their doctrinal views, especially in their latitudinarianism, which implied or produced a want of an adequate sense of responsibility connected with the discovery and the maintenance of all God’s truth; and thus tended to dispose them towards an allowance or toleration of the interference of a foreign and incompetent authority in the decision of religious controversies, and in the regulation of ecclesiastical affairs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>§23. 15. In civil actions that are religious only finally, and by participation, and not any acts of special worship, it is lawful to use symbolical rites that are in their kind near of kin to sacraments in their kind, and may be called ‘civil sacraments’, such as: the sealing and delivery of indentures, or other covenant writings: and the delivery of possession of a house by a key, and of the temple by a book and bell-rope, and of land by a twig and turf; and of civil government by a crown, or scepter, or sword, etc. And such is the use of a ring in marriage. … §43. 3. And for the ring in marriage, I see no reason to scruple the lawfulness of it: For though the Papists make a sacrament of marriage, yet we have no reason to take it for any ordinance of divine worship anymore than the solemnizing of a contract between a prince and people. All things are sanctified and pure to the pure: but that does not confound the two Tables [of the Ten Commandments], nor makes all things to be parts of worship that are sanctified. The coronation of a king is sanctified as well as marriage, and is as much a sacrament as marriage, and the ceremonies of it might as well be scrupled: especially when God does seem to go before them by the example of anointing, as if He would confine them to that ceremony, which yet was none of his intent, nor is it much scrupled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, p. 406 &amp; 411</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>4. Distinguish between the Moral, and Ceremonial, and Judicial Law: [1.] The first concerns manners, and the right ordering of a godly conversation; and because these things are of perpetual equity and rectitude, the obligation of this Law as to that is perpetual; and therefore in the expounding of it, these two terms, Moral, and of Perpetual Authority, are all one, and to be taken so.

2. The Judical Law is for regulating outward society, and for government, and does generally (excepting what was peculiar to the people of Israel) agree with the Moral Law; this as given to them is not perpetual, their policy being at an end.

3. The Ceremonial Law is in ceremonies, types, and shadows, pointing at a Savior to come; this is also abrogate[d], the substance being come; but there is this difference, that the Judicial Law is but mortua, ‘dead’; and may, where ’tis thought fit, with the foregoing caution, be used under the New Testament; but the Ceremonial Law is mortifera, ‘deadly’, and cannot without falling from grace, Gal. 5:2,4, be revived.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law Unsealed</cite>, (1676), Preface, pp. 4-5</span></figcaption>

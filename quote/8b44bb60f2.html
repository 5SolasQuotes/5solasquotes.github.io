<main class="wrap"><figure class="quote" id="q-8b44bb60f2" data-kw="">
<blockquote><p>Still farther, coming to Christ implies a renouncing of self. This follows of necessity from what has been said, for self-trusting and self- seeking are sin. So long as we trust in our own arm to save, we will never seek after the salvation which Christ offers; and so long as we follow out our selfish ends, we are abiding far, and wandering farther from him. What saith the Lord? “If any man will come after me, let him deny himself” As the soul goes out from the Babylon of sin, so it also goes out from the tottering tabernacle of self-sufficiency, in fleeing unto Christ as the strong tower. We cannot betake ourselves to him without seeing our own emptiness.

Coming to receive all from him implies our feeling of needing all. We must come like the prodigal—yonder “is bread, enough, and to spare, while I perish with hunger.” It is for lack of this that many come to ordinances, as we have seen, and yet come not to Christ. In self-sufficiency they verily think that, some how or other, their reading, their worship, their prayers, are to save them; that these, their own doings, are in some manner to help them to acceptance with God.

It is as if they said, “I will not be cast out because I do these things,” while all the time the true and only because stares them in the face—because Christ hath done all for us, I put it to your consciences, brethren, is not this the natural reasoning of the heart? Even the conscience of the renewed man must answer, that he is often tempted of the old man to feel as if observance of duties were to win his way to Jesus, and bring down blessings from on high. And yet I put it to the commonest understanding, if this be not robbing Christ of His glory, and thinking to take His sceptre of salvation into our own hands.

Coming to Christ is just a casting ourselves upon him, that He may save, for he alone can. It is not our reading, but finding Christ in the word read, which profits. It is not our worshipping, but the surrender of ourselves to Christ in the worship, that realizes the blessing. It is not our praying, but Christ’s merits pled in the prayer, that brings down the answer. O that men remembered this, and so, coming out of themselves, would come to Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller-of-monifieth.html">Samuel Miller of Monifieth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Coming unto Jesus in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a95583f4ab" data-kw="">
<blockquote><p>A very little reflection may suffice to convince us of the advantages accruing to revelation from being cast in such a form — though at present we can do little more than glance at them. First of all, it humanises (if we may so speak) the communications of God to men — does to some extent for the revelations generally of His mind and will what was specially and pre-eminently done by the Incarnation. The divine word spoken from the invisible heights, from the secret place of Godhead, and the same word uttered from the midst of earthly transactions, linked to the susceptibilities and experience of human bosoms — though they might perfectly coincide in substance — yet in form how necessarily different! and in the one how much more than in the other fitted to touch the sympathies of men, and sound the depths of their hearts!

It is at bottom, a recognising and acting on the great truth, that man was made in the image of God, and that only by laying hold of what remains of this image, and sanctifying it for higher uses, can the Spirit of God effectually disclose divine things, and win for them a place in the soul; the rays of the eternal sun must reach it, not by direct effulgence, but “through the luminous atmosphere of created minds.” Then, think how well this plan accords with, and secures that fullness and variety which is necessary to Scripture as the book, which from its very design, was to provide the seed-corn of spiritual thought and instruction for all times — a book for the sanctification of humanity, and the developing in the soul of a higher life than that of nature.

An end like this could never have been served by some general announcements from Heaven, or even by the most orderly systematic exhibition of divine truth — though written as with a sunbeam from the Upper Sanctuary. No; there was needed just what we find in Scripture — from its partaking so largely of the historical element — a rich and various treasury of knowledge, ample materials for meditation and inquiry, resembling more the freedom and fullness of nature, than the formality and precision of art.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-fairbairn.html">Patrick Fairbairn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Historical Character of Revelation, Particular in Method and Form, but Universal in Design and Application in Patrick Fairbairn et al., Divine Revelation Explained and Vindicated: A Course of Lectures for the Times, Delivered in Glasgow in the Spring of 1866</cite></span></figcaption>

</figure><figure class="quote" id="q-d75588582f" data-kw="">
<blockquote><p>Worship is as large as the Commandment, nay as the whole Word of God. For so it is ordinarily defined, a work commanded, done in faith, and then it must needs extend itself as far as the Commandment. And if to obey God in conscience of his Commandment, in all actions, civil and sacred, of piety, justice or mercy, be to worship Him, then to believe whatsoever the Lord has taught, relying upon the truth and credit of the Revealer, is worship also. And hence it is, that the worship of God is usually divided into immediate and mediate worship: which comprehends all duties which we owe to God or Man.</p></blockquote>

<blockquote><p>In general, it is certain that God intended to declare hereby that the work which Moses had to do, —the tabernacle he was to erect, and the worship thereof, —was not, either in the whole, or in any part of it, or any thing that belonged unto it, a matter of his own invention or contrivance, nor what he set upon by chance; but an exact representation of what God had instructed him in and showed unto him. This was the foundation of all the worship of God under the old testament, and the security of the worshippers. Hence, at the finishing of this work, it is eight times repeated in one chapter, that all things were done “as the LORD commanded Moses.” And herein was that truth fully consecrated unto the perpetual use of the church in all ages, that the will and command of God are the sole reason, rule, and measure, of all religious worship.</p></blockquote>

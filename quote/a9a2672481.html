<main class="wrap"><figure class="quote" id="q-a9a2672481" data-kw="against chiliasm">
<blockquote><p>Besides the universal resurrection, is there a particular resurrection of the saints or of the martyrs which will precede the last by a thousand years? We deny. This controversy is urged by the Chiliasts, who as they hold to a millenarian reign of Christ with the saints before the end of the world, so they maintain that the saints and especially the martyrs will be raised up that they may possess that kingdom with Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 20.3.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/the-millennium.html">The Millennium</a> › <a href="../topics/the-return-of-christ-antichrist-and-the-millennium/the-millennium/amillennial-postmillennial-premillennial-chiliasm.html">Amillennial, postmillennial, premillennial (chiliasm)</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3d3581611a" data-kw="">
<blockquote><p>Daniel and Paul foretold that Antichrist would sit in the temple of God, (Dan. 9: 27; 2 Thess. 2: 4;) we regard the Roman Pontiff as the leader and standard-bearer of that wicked and abominable kingdom.</p></blockquote>

</figure><figure class="quote" id="q-8c5fe3bfc8" data-kw="">
<blockquote><p>For it is a certain mystery of iniquity, which in words establishes Christ, but in fact destroys him. This is the very antichristianism of the papists, who leave indeed the natures of Christ intact, but make away with the offices of Christ, and consequently Christ himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, p. 41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/antichrist.html">Antichrist</a> › <a href="../topics/the-return-of-christ-antichrist-and-the-millennium/antichrist/the-papacy-as-antichrist.html">The papacy as Antichrist</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/the-pope-as-antichrist.html">The pope as Antichrist</a></span></div>

</figure><figure class="quote" id="q-a379eef0ab" data-kw="">
<blockquote><p>But since popery is nothing else but mere antichristianism, it is evident that both must fall under the same rule and method, and that popery must have in it all the heresies which belong to antichristianism.</p></blockquote>

</figure><figure class="quote" id="q-89510b8bf5" data-kw="">
<blockquote><p>So with respect to the Antichrist, it is most appropriate he be traced back to the idolatry of Rome, for he honors and worships the wafer-God of the Mass, who was truly unknown to the Fathers. Indeed, he worships the Angels and the Saints as protectors, helpers, and defenders, honoring them magnificently with gold, silver and precious things, in ornate external displays, and by building immense shrines for their veneration.</p></blockquote>

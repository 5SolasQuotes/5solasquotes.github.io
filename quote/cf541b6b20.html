<blockquote><p>God has revealed His method of evangelism, and His true servants must humbly learn what His method is, and conscientiously adopt it. Original methods, however startling and however likely to be successful in “drawing” the multitude, must be regarded as insulting to the wisdom of Christ, and therefore as incurring His frown. The intrusion of human wisdom, with its attractive and plausible devices, is as impertinent now as it was under the Old Testament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Evangelism: With Criticism of some Prevalent Errors</cite>, (Belfast, 1898), p. 15.</span></figcaption>

<blockquote><p>What is stressed here, however, is that when these preachers appeared in Scotland they gave impetus to a type of preaching and practice which hitherto had been little known in the land. One would not say that [D. L.] Moody was an Arminian of the pronounced order, but this fact only gave him the larger opportunity to introduce his doctrines into circles which would have repudiated a more positive form of Arminianism.

The outcome was a pronounced swing from the Calvinism, now regarded as severe, which had hitherto prevailed in Scotland. Along with this came the introduction of practices which were themselves expressive of an underlying conception, distinctively Arminian, which would have been utterly inconceivable under a Calvinistic regime. But most hurtful of all was the introduction of hymn-singing on a large scale into the public worship of the Free Church. It was, in fact, almost a death-blow to the Psalm-singing, which hitherto had been almost a universal feature of public worship throughout Scotland.

Dr John Kennedy, of Dingwall, with his massive mind and keen discernment, perceived all these things and the dangers attendant upon them and sounded loudly the trumpet of warning. But, apart from those Highlanders who had learned to know his value and to esteem his judgment, he was little regarded, unless it were to be roundly abused as one who had little or no sympathy with the proclamation of a “free” Gospel. After events, however, verified his forecast and gave to him the place of the prophet who speaks unheeded to the ears of an unbelieving generation.

The working of the new leaven in the Free Church of Scotland speedily revealed itself. Up till then, whatever measure of approval the new German Higher Criticism had won for itself the response had been practically inaudible. Now, however, with the rise of what Dr Kennedy called the “Hyper-Evangelistic” party in the Free Church, it became no longer necessary for those who favoured the Higher Criticism to conceal their antipathy to the strict and binding terms of the Confession and Formula of the church under which they exercised their ministry.

It is not for a moment contended that this new Evangelistic party had the slightest sympathy with the attitude of the Higher Critics towards the Scriptures, but the two parties found common ground in their antipathy to much in that to which they had sworn their allegiance. And now that it had become fashionable to express dissatisfaction with the old formulas, the Higher Critics felt it safe to emerge from their hiding-holes.

To the Arminian party, as we may now call the Evangelists, the stout, uncompromising Calvinism of the standards of the Church had become intolerable, and, under the leadership of Dr [Robert] Rainy, what was known as the Declaratory Act was prepared and duly passed by the General Assembly of 1892—although not without the strongest possible protest on the part of the conservative elements in the Church.

By this Act the terms of the most Calvinistic articles of the Confession of Faith were explained away and made to mean what they did not mean, and what they were never meant to mean. The Act, therefore, was a most unworthy and dishonest measure, aimed, not, as several responsible parties nowadays seek to maintain, at finding vantage ground in the Church for the Higher Criticism—Principal Rainy was no Higher Critic—but at the Calvinistic articles of the Confession, which were so obnoxious to the Arminians. A perusal of the Declaratory Act itself will fully bear this out.

It was the intention of Dr Rainy and his party, with whom the Higher Critics naturally allied themselves, to follow up the Declaratory Act with a corresponding adjustment of the Formula of Subscription signed by all ministers and office-bearers of the Church, so as to make the measure binding upon all who might henceforth be ordained or inducted to office in the Church, but, taking fright at the unexpected secession of the Revs Donald Macfarlane, of Raasay, and Donald Macdonald, of Shieldaig, in 1893—the founders of the Free Presbyterian Church — they proceeded no further until, by the Union of 1900 with the United Presbyterian Church, they succeeded in making their measure operative with the introduction of a Formula which no longer bound ordinands and office-bearers uncompromisingly to the Calvinistic doctrines of the Confession.

The new United Free Church, as it was called, was confessedly Arminian in doctrine, and it was upon this issue, together with their Voluntaryism, or rejection of the Establishment Principle, that they lost their case by the famous House of Lords’ decision in 1904. Higher Criticism had absolutely nothing to do with it. This fact is worth emphasising in view of the fact that efforts are now being made to teach the younger generation of Free Church people that the 1900 struggle was fought on the Higher Criticism, and that the question of Arminianism did not enter into the picture at all. That contention is simply not correct, and it only indicates the extent to which Arminianism is favoured in certain Free Church circles today.

The Highlands split directly over the real issue. Where the people adhered to the old Calvinism of the Confession they remained faithful to the Free Church; where they sympathised with the newer doctrines the United Free Church sprang up. The division was clean. The Free Church was Calvinistic; the United Free Church was Arminian. At that date, so far as the Highlands were concerned, neither church was Modernistic. Such was the bitter fruit of the Moody-Sankey Revival, as against the impetus to Evangelical religion, which has been so largely claimed for it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/kenneth-a-macrae.html">Kenneth A. Macrae</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Resurgence of Arminianism</cite>, (1955; eBook reprint), pp 6-8.</span></figcaption>

<blockquote><p>The design of Christ was not like Mahomet’s, to get himself an earthly kingdom and numerous followers merely to cry up his name: and therefore He will not indulge men in their sin, nor abate or alter the conditions of his Covenant to win disciples: He will have his ministers deal plainly with all to whom they preach, and let them know that without self-denial and forsaking all (in estimation and resolution) and a willing exchange of earth for heaven, they cannot be his true disciples: Nor without a professed consent to thus much, they cannot be his visible professed disciples. But all that will not repent must perish. And therefore in their baptism they must profess a renunciation of all competitors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 13, p. 106</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The design of Christ was not like Mahomet’s, to get himself an earthly kingdom and numerous followers merely to cry up his name: and therefore He will not indulge men in their sin, nor abate or alter the conditions of his Covenant to win disciples: He will have his ministers deal plainly with all to whom they preach, and let them know that without self-denial and forsaking all (in estimation and resolution) and a willing exchange of earth for heaven, they cannot be his true disciples: Nor without a professed consent to thus much, they cannot be his visible professed disciples. But all that will not repent must perish. And therefore in their baptism they must profess a renunciation of all competitors.”

— Richard Baxter, The Cure of Church Divisions, … (London, 1670), pt. 1, Direction 13, p. 106">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+design+of+Christ+was+not+like+Mahomet%E2%80%99s%2C+to+get+himself+an+earthly+kingdom+and+numerous+followers+merely+to+cry+up+his+name%3A+and+therefore+He+will+not+indulge+men+in+their+sin%2C+nor+abate+or+alter+the+conditions+of+his+Covenant+to+win+disciples%3A+He+will+have+his+ministers+deal+plainly+with+all+to+whom+they+preach%2C+and+let+them+know+that+without+self-denial+and+forsaking+all+%28in+estimation+and+resolution%29+and+a+willing+exchange+of+earth+for+heaven%2C+they+cannot+be+his+true+disciples%3A+Nor+without+a+professed+consent+to+thus+much%2C+they+cannot+be+his+visible+professed+disciples.+But+all+that+will+not+repent+must+perish.+And+therefore+in+their+baptism+they+must+profess+a+renunciation+of+all+competitors.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Cure+of+Church+Divisions%2C+%E2%80%A6+%28London%2C+1670%29%2C+pt.+1%2C+Direction+13%2C+p.+106&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F181a41f7a4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/181a41f7a4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/evangelism#:~:text=The%20design%20of%20Christ%20was%20not,profess%20a%20renunciation%20of%20all%20competitors&amp;text=The%20design%20of%20Christ%20was%20not%20like%20Mahomet%E2%80%99s&amp;text=they%20must%20profess%20a%20renunciation%20of%20all%20competitors" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Christ preached the Gospel to those that He knew sinned against the Holy Ghost, to the Pharisees who persecuted Christ to death and others, Mt. 12:31-34; Jn. 15:22-25; Jn. 7:28-29; Jn. 12:35-38; Jn. 10:31-32; Jn. 11:47-48… the word is a converting ordinance out of question, and preached to heathen and to the non-converted, though they refuse to embrace and believe the Gospel, and refuse to entertain the preachers of it: as is clear, Acts 19:22-25; Tit. 1:10-13; 2 Tim. 3:25-27. The texts that Master Prynne alledges, that the Gospel should not be preached to heathen who refuse to embrace and believe the Gospel, to wit, Mt. 10:14-15; Lk. 9:5; Acts 13:46, are to no purpose, for Mt. 10; Lk. 9, is but a temporary commandment, given for a time, that the disciples should depart from those houses of Judea (there is nothing of the heathen; but by the contrary the apostles are forbidden to go to Samaritans or gentiles at all, Mt. 10:5-6 [which was unique to those circumstances]) who would not receive the peace of God in the Gospel, which precept the apostles in the story of the Acts did not observe, but preached the Gospel to many heathen who refused to embrace and believe the Gospel: As Acts 16 and 17, and 19:2. The place Acts 13:15 is meant of the blaspheming Jews, to whom Paul preached long after they persecuted and stoned the prophets, and had killed the Lord of life, Acts▪2 and 4, and 8, and 9; Mt. 23:37-38. 3. Those places, are to better color of purpose brought by Arminians and Socinians to prove that the Gospel is preached to people for their good entertainment thereof, and denied to others for their unworthiness, and because they will not welcome it; So the Arminians in the conference at Hague, pp. 87-89, God sends the Gospel not according to his absolute will, sed ob alias causas in homine latent•s, for secret causes in man. Arminius, Against Perkins, p. 199, ‘The will of God in sending the Gospel has causes in the will of man according to that,’ habenti dabitur: So Corvinus, Ad Wallachros, p. 44. Socinus, Commentary on 1 Jn. 4, p. 307 says the same: and Mr. Prynne is pleased in the same sense to cite them, I conceive imprudently, for I believe that Reverend and learned man does hate those impious sects, the enemies of the grace of God; but truly if this be a rule to pastors to spread the Gospel, that they are to offer and give the pearl of the preached Gospel to those that willingly receive it and harbour the preachers, and presently to depart and preach no more the Word of the Kingdom to those who refuse it, as the places Mt. 10:14 and Lk. 9:5 carry that sense, because they are heathens who refuse to embrace and believe the Gospel, and harbor the preachers, as (the worthy divine says) conceiving that to be a casting of pearls to dogs and swine; I see not how the preachers and spreaders of the Gospel to the heathen are to believe that God out of mere grace and the good pleasure of his will, without respect to good or bad deserving, sends the Gospel to some and denies it to others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), ch. 23, pp. 516-18</span></figcaption>

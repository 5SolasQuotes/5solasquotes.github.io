<main class="wrap"><figure class="quote" id="q-6be503fe2d" data-kw="">
<blockquote><p>I have heard also one of their doctors [of the Independents] deliver it as his opinion that it was expedient for the minister in preaching to have his head covered, and the people in time of preaching [for the people] to sit uncovered: But in the holy Communion, that it was expedient the minister should celebrate that sacrament uncovered unto the people covered. I do not deny my suspicion of the spirit of these men, who are not afraid in so short a time to vent such a multitude of strange novelties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map</cite>, (London, 1645) | ch. 4, ‘The carriage of the Independents in Holland, at Rotterdam &amp; Arnhem’, p. 82</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“I have heard also one of their doctors [of the Independents] deliver it as his opinion that it was expedient for the minister in preaching to have his head covered, and the people in time of preaching [for the people] to sit uncovered: But in the holy Communion, that it was expedient the minister should celebrate that sacrament uncovered unto the people covered. I do not deny my suspicion of the spirit of these men, who are not afraid in so short a time to vent such a multitude of strange novelties.”

— Robert Baillie, A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, especially of the Independents, are Drawn together in one Map (London, 1645) | ch. 4, ‘The carriage of the Independents in Holland, at Rotterdam &amp; Arnhem’, p. 82">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+have+heard+also+one+of+their+doctors+%5Bof+the+Independents%5D+deliver+it+as+his+opinion+that+it+was+expedient+for+the+minister+in+preaching+to+have+his+head+covered%2C+and+the+people+in+time+of+preaching+%5Bfor+the+people%5D+to+sit+uncovered%3A+But+in+the+holy+Communion%2C+that+it+was+expedient+the+minister+should+celebrate+that+sacrament+uncovered+unto+the+people+covered.+I+do+not+deny+my+suspicion+of+the+spirit+of+these+men%2C+who+are+not+afraid+in+so+short+a+time+to+vent+such+a+multitude+of+strange+novelties.%E2%80%9D%0A%0A%E2%80%94+Robert+Baillie%2C+A+Dissuasive+from+the+Errors+of+the+Time%2C+wherein+the+Tenets+of+the+Principal+Sects%2C+especially+of+the+Independents%2C+are+Drawn+together+in+one+Map+%28London%2C+1645%29+%7C+ch.+4%2C+%E2%80%98The+carriage+of+the+Independents+in+Holland%2C+at+Rotterdam+%26+Arnhem%E2%80%99%2C+p.+82&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6be503fe2d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6be503fe2d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=I%20have%20heard%20also%20one%20of,such%20a%20multitude%20of%20strange%20novelties&amp;text=I%20have%20heard%20also%20one%20of%20their%20doctors&amp;text=to%20vent%20such%20a%20multitude%20of%20strange%20novelties" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c7f59003ee" data-kw="">
<blockquote><p>Argument 9. If any perhaps should not be moved by these arguments, but should contend, the apostle opposes to their contentious apologies the received and established custom of the Jews and the rest of the Churches: Other Churches have no such custom that women should be present at public assemblies with their heads uncovered, and the man with his head covered: Therefore your custom not agreeing with decency, either according to natural use, or of the Churches, is altogether unseemly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>(London</cite>, 1659), on 1 Cor. 11, ‘The Seventh Article concerning Order &amp; Decency’ | On v. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-cdfc0eea12" data-kw="">
<blockquote><p>All that outward reverence which we show towards God in his worship and service must be measured and estimated according to the customs and usage of places and countries; so that what they use as a sign and expression of honor to their superiors, they ought much more to use it in the presence of the great God, the King of Kings and Lord of Lords. And therefore uncovering of the head [for men], bowing of the body, an humble submiss and settled composure of the whole man, which among us are but fitting signs of respect and reverence, when we appear in the presence of those who are much our superiors, ought likewise to be used by us in the presence of God, who is infinitely such, not indeed that they are essential parts of worship, but signs and testimonies of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Ten Commandments with other Sermons</cite>, … (London, 1691) | Second Commandment</span></figcaption>

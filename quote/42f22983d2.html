<blockquote><p>1st Assertion: The Magistrate as the Magistrate is to procure that there be preachers and Church-officers to dispense Word, Sacraments, and Discipline; For: …

2. The difference between the Magistrates and other callings, is, that the Magistrate was to take care of old, that there were Levites who bare the Ark, and, priests who should burn incense before the Lord, and sacrifice; and yet it was unlawful for the Magistrate to bear the Ark on his own shoulders, or in his own person to burn incense or sacrifice…

3. But the magistrate as the magistrate does not command [the spiritual affect of] sincere, hearty, zealous, and affectionate dispensing of Word, sacraments and discipline: But only the dispensing of those without the qualification of the spiritual, or sincere exercise of the power, because:

1. The Magistrate cannot command that as a magistrate, which he cannot judge of, whether the thing commanded be consonant to his command or not: But the magistrate as the magistrate cannot judge of the spirituallity, sincerity, zealousness, affectionateness of that obedience, which the Church yields to his command: for if the pastors dispense Word and sacraments, and bind and loose by the keys following the rules of the Word, the magistrate cannot judge the heart or intention, whether they do those with conscience to God, and reverence and subjection of spirit to his holy Law, nor can the manner of doing be proved by witnesses to the magistrate.

2. The Magistrate as Magistrate does not command what he does not praise or reward, for well doing is the object of the Magistrate’s praising and rewarding power, Rom. 13:3. But as a Magistrate he does not praise and reward the qualification, or spirituality, or sincerity of pastors dispensing of Word and seals; if they feed the flock, the Magistrate is to take care they be rewarded with wages, nor can the Magistrate as the magistrate withhold praise or wages from labourers in the vineyard because they preach Christ out of envy, as some did Phil. 1:15, or because they feed not the lambs out of a love to Christ, as they ought to do, Jn. 21:15-17; It is true, magistrates as godly men, may love and commend sincerity in faithful labourers, and hate the contrary, but this they do as Christian men, not as magistrates, not by their office, and authoritatively.

3. Magistrates command that as magistrates, the not doing of which they can as magistrates punish with the sword, for the object of their vindicative and revenging power is ill-doing, Rom. 13:4. But if pastors feed the flock and rule them, the magistrate cannot use the sword against the feeders for that they want sincerity, love, cheerfulness in the manner of doing these things, for the sword of the magistrate does only reach men for their external facts, not for opinions in the mind, not for crooked intentions, not for hollow-heartedness, hypocrisy, infidelity in the manner, or inward principles of the actions. 2nd Assertion. When magistrates command Churchmen to do their duty, and to feed the flock, sincerely, and in the fear of the Lord, they do it not as magistrates [from their office]; but as touching the manner, they may exhort them to do their duty sincerely, cordially, and zealously as godly men; hence that charge that King Jehoshaphat gave to the priests and Levites, 2 Chron. 19:9, ‘This shall ye do in the fear of the Lord faithfully, and with a perfect heart,’ is a mixed command as touching the judging of the people in all causes and controversies that should come before them; the king as king commanded them to do this: But for the manner of the doing of it, that they should do it faithfully in the fear of the Lord, and with a perfect heart; this he commanded them not as a king, but exhorted them to it as a godly and religious man, for:

1. Any godly man might have said this, and the King might have punished the Levites and priests if they had not judged the causes according to the Law. But though they had not judged in the fear of the Lord, and with a perfect heart, yet could not the king as king have punished them therefore; nor can any say that the spiritual exhortation of Hezekiah, 2 Chron. 29 to the priests and Levites came from him as king, but as from a graced and religious man; as king he might command them to sanctify themselves legally, for so they were to do by office; and he might use the sword against them, if they failed in that; and as king he may command all external duties, not only to Churchmen, but to all others, only he cannot punish them for failings in the spiritual manner of doing external duties;

2. A spiritual and Christian exhortation ex conditione operis [out of the nature of the work], and intrinsically, has influence on the conscience to turn the soul to God. But nothing that the magistrate can do as a magistrate, has such an influence on the conscience; all that he does as a magistrate and directly, is toward the outward man, by rewards and punishments; if the magistrate remove false teachers and wolves, which would devour the flock, and if that work upon the conscience, it is indirectly and by accident, for, quoad actus imperatos [as far as the acts having been commanded], he can command that the Gospel, which has a kindly [in-kind] and intrinsic power to work upon the conscience, be preached; if the magistrate convince the conscience of a murderer, that he has failed against the Law of God, he does not that as a magistrate, but as a godly and religious man he may convince him as a magistrate, that he has failed against the laws of the State and bands of human society, and external peace… Answer [to an objection]: We never denied but the magistrate commands both the exercise of Church power simply, and the manner and such qualifications as are external and obvious to the knowledge of the magistrate, such as blasphemous and false doctrine is; But we deny that as a magistrate he does command those things that are internal and invisible, that is, the spirituality of the actions; he can exhort and stir men up to the spirituality and sincerity of doing as a godly and Christian man. … Answer 1 [to another objection]: …for [ecclesiastical] elders may command as elders more than the not doing of which they can censure, which the magistrate cannot do; for elders have committed to them the Word of reconciliation, as the ambassadors of Christ. Now the Word has an immediate influence on the conscience, on the thoughts and intents of the heart: 2 Cor. 5:18-20; 1 Cor. 3:5; 1 Cor. 4:15; Ps. 19:7; Heb. 4:12-13. And therefore their ministry has action on the thoughts; yet can they not in the external court of the Church censure the thoughts, as not being able to see them, but the Gospel which they preach can arraign the conscience and thoughts, 2 Cor. 10:4-5. But the Magistrate carries not such a message, and therefore his magistratical command can reach no farther than his temporal praise and reward, and his sword; and that is commensurable and of equal latitude with those. … Answer [to another objection]: It is true, the magistrate as the magistrate does care for the supernatural good of subjects, and the duties of religion, and the First Table, but how? Intrinsically and as a magistrate, that is, that men worship God according to his Word: But:

1. The magistrate as such has nothing to do with the spirit, nor can he command the sincerity of the worship; his care is that there be a divine worship, that is, materially and externally right and consonant, externally to the rules of the Word; and for this cause learned divines make the external man the object of the magistrate’s office; but not the external man as doing the duties of the Second Table only, but also as serving God in the duties of the First Table: for which cause I said Augustine meant the same, when he said that kings serve God as men and as kings. (Augustine contra literas petilian., bk. 2, ch. 92 &amp; contra Cresconi., bk. 8, ch. 5)

2. Magistrates as magistrates are to extend their power for Christ; that is, that not only there be justice and peace amongst men, but also that there be religion in the land, yea, that the Gospel be preached; so all our divines make the king to be custos ut vindex utriusque tabulae [Keeper &amp; Vindicator of both Tables]: Yea, I think he is a keeper and preserver of the Gospel also, and is to command men to serve Christ, and profess the Gospel, and to punish the blaspheming of Jesus Christ: and this is royal and magistratical service that the King as King performs to God, and to Jesus Christ the Mediator, ex conditione operis [out of the nature of the work], in regard that good which he procures as King, materially and externally, is consonant to the supernatural Law of the Gospel, but it is not magistratical service to Christ ex intentione operantis [out of the intention of the work]. … 3rd Assertion …The unjust and evil exercise of the ministerial power is obnoxious to the magistrate as the magistrate; thus, in that he bears the sword against all evil doers, Rom. 13:1, the magistrate as the magistrate does only command well doing in order to praise and a good name, or temporal reward amongst men, Rom. 13:3, “Do that which is good and thou shalt have praise of the power;” 1 Tim. 5:17; Mt. 10:10. Nor can the magistrate as the magistrate promise, or command the [ecclesiastical] elders to feed the flock with the promise of the reward that Peter promises, 1 Pet. 5:4, to wit, that when the Chief Shepherd shall appear, they shall receive a crown of glory that fades not away. … Yet my sense is not that the magistrate can lawfully command obedience in matters of religion not understood or known by the subjects; that were to exact blind obedience; but my meaning is, that the Magistrate as the Magistrate holds not forth his commandments to teach and inform the conscience, as pastors do, but he presupposes that his mandates are known to be agreeable to the Word of God, and proposes them to the subjects to be obeyed. … 5th Assertion. When the Magistrate commands painful and sound administration in preaching and governing, with provision of the praising and rewarding of well doing, he does not subordinate to himself the ministry in its exercise, because [Rutherford gives, expounds and defends two reasons for this]… 6th Assertion. Though the magistrate may both threaten to inflict, and actually inflict the ill of temporal punishment on ministers, if they be either idle or unsound in their administration; yet thence can only be concluded that the mal-administration of the ministry is subjected to the magistrate as such, but not the ministry itself, or the exercise thereof:

1. The mal-administration of any office is accidental to the office.

2. This subjects the erring person, not the teaching minister [as such], to the civil magistrate… 7th Assertion. There is a twofold subordination of the exercise of mal-administration of ministers; one civil, another ecclesiastical: These two differ, so as the former must be subordinate to the magistrate who is to inflict bodily punishment; but the latter is only subject to the Church. The judicial determination according to the Word of God, for the informing of the conscience and gaining to the truth the erring ministers, is proper to the college [presbytery] of ministers; and in this, if the college of ministers err, they are also punishable; and the magistrate is to command them to judge and determine, de novo, over again: The magistrate in a constitute[d] church is to determine civilly [in distinction from the above, of seeking to gain erring ministers to the truth], and sentence, and civilly punish the ministers that either are dumb dogs and will not bark, or that pervert the souls of people with false doctrine; and where the Church is constituted, it is presumed that the priests, whose lips should preserve knowledge, have determined in an ecclesiastical way the very same [thing] which the judge civilly is to determine, [and that] not because the Church has so determined [already], but because he judges, in his conscience, it to be according to the Word of God. … 9th Assertion… Even as the magistrate may command the pastors to preach and dispense the sacraments aright; but the magistrate himself can neither preach nor dispense the sacraments; so the [Medieval] schoolmen say that the actions of the understanding depend on the will, quoad excercitium [as far as the exercise]: the will may set the mind to think on this or that truth, but not quoad specificationem [as far as the determination]. The will itself can neither assent, nor dissent from a truth, nor can the will command the mind to assent to a known untruth, or dissent from a known truth; the mind or understanding naturally does both; and this distinction holds in acts of the civil power and in acts merely ecclesiastical [they being coordinate].</p></blockquote>

2. This subjects the erring person, not the teaching minister [as such], to the civil magistrate… 7th Assertion. There is a twofold subordination of the exercise of mal-administration of ministers; one civil, another ecclesiastical: These two differ, so as the former must be subordinate to the magistrate who is to inflict bodily punishment; but the latter is only subject to the Church. The judicial determination according to the Word of God, for the informing of the conscience and gaining to the truth the erring ministers, is proper to the college [presbytery] of ministers; and in this, if the college of ministers err, they are also punishable; and the magistrate is to command them to judge and determine, de novo, over again: The magistrate in a constitute[d] church is to determine civilly [in distinction from the above, of seeking to gain erring ministers to the truth], and sentence, and civilly punish the ministers that either are dumb dogs and will not bark, or that pervert the souls of people with false doctrine; and where the Church is constituted, it is presumed that the priests, whose lips should preserve knowledge, have determined in an ecclesiastical way the very same [thing] which the judge civilly is to determine, [and that] not because the Church has so determined [already], but because he judges, in his conscience, it to be according to the Word of God. … 9th Assertion… Even as the magistrate may command the pastors to preach and dispense the sacraments aright; but the magistrate himself can neither preach nor dispense the sacraments; so the [Medieval] schoolmen say that the actions of the understanding depend on the will, quoad excercitium [as far as the exercise]: the will may set the mind to think on this or that truth, but not quoad specificationem [as far as the determination]. The will itself can neither assent, nor dissent from a truth, nor can the will command the mind to assent to a known untruth, or dissent from a known truth; the mind or understanding naturally does both; and this distinction holds in acts of the civil power and in acts merely ecclesiastical [they being coordinate].”

— Samuel Rutherford, The Divine Right of Church Government, … (1646), pp. 543-561">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1st+Assertion%3A+The+Magistrate+as+the+Magistrate+is+to+procure+that+there+be+preachers+and+Church-officers+to+dispense+Word%2C+Sacraments%2C+and+Discipline%3B+For%3A+%E2%80%A6+2.+The+difference+between+the+Magistrates+and+other+callings%2C+is%2C+that+the+Magistrate+was+to+take+care+of+old%2C+that+there+were+Levites+who+bare+the+Ark%2C+and%2C+priests+who+should+burn+incense+before+the+Lord%2C+and+sacrifice%3B+and+yet+it+was+unlawful+for+the+Magistrate+to+bear+the+Ark+on+his+own+shoulders%2C+or+in+his+own+person+to+burn+incense+or+sacrifice%E2%80%A6+3.+But+the+magistrate+as+the+magistrate+does+not+command+%5Bthe+spiritual+affect+of%5D+sincere%2C+hearty%2C+zealous%2C+and+affectionate+dispensing+of+Word%2C+sacraments+and+discipline%3A+But+only+the+dispensing+of+those+without+the+qualification+of+the+spiritual%2C+or+sincere+exercise+of+the+power%2C+because%3A+1.+The+Magistrate+cannot+command+that+as+a+magistrate%2C+which+he+cannot+judge+of%2C+whether+the+thing+commanded+be+consonant+to+his+command+or+not%3A+But+the+magistrate+as+the+magistrate+cannot+judge+of+the+spirituallity%2C+sincerity%2C+zealousness%2C+affectionateness+of+that+obedience%2C+which+the+Church+yields+to+his+command%3A+for+if+the+pastors+dispense+Word+and+sacraments%2C+and+bind+and+loose+by+the+keys+following+the+rules+of+the+Word%2C+the+magistrate+cannot+judge+the+heart+or+intention%2C+whether+they+do+those+with+conscience+to+God%2C+and+reverence+and+subjection+of+spirit+to+his+holy+Law%2C+nor+can+the+manner+of+doing+be+proved+by+witnesses+to+the+magistrate.+2.+The+Magistrate+as+Magistrate+does+not+command+what+he+does+not+praise+or+reward%2C+for+well+doing+is+the+object+of+the+Magistrate%E2%80%99s+praising+and+rewarding+power%2C+Rom.+13%3A3.+But+as+a+Magistrate+he+does+not+praise+and+reward+the+qualification%2C+or+spirituality%2C+or+sincerity+of+pastors+dispensing+of+Word+and+seals%3B+if+they+feed+the+flock%2C+the+Magistrate+is+to+take+care+they+be+rewarded+with+wages%2C+nor+can+the+Magistrate+as+the+magistrate+withhold+praise+or+wages+from+labourers+in+the+vineyard+because+they+preach+Christ+out+of+envy%2C+as+some+did+Phil.+1%3A15%2C+or+because+they+feed+not+the+lambs+out+of+a+love+to+Christ%2C+as+they+ought+to+do%2C+Jn.+21%3A15-17%3B+It+is+true%2C+magistrates+as+godly+men%2C+may+love+and+commend+sincerity+in+faithful+labourers%2C+and+hate+the+contrary%2C+but+this+they+do+as+Christian+men%2C+not+as+magistrates%2C+not+by+their+office%2C+and+authoritatively.+3.+Magistrates+command+that+as+magistrates%2C+the+not+doing+of+which+they+can+as+magistrates+punish+with+the+sword%2C+for+the+object+of+their+vindicative+and+revenging+power+is+ill-doing%2C+Rom.+13%3A4.+But+if+pastors+feed+the+flock+and+rule+them%2C+the+magistrate+cannot+use+the+sword+against+the+feeders+for+that+they+want+sincerity%2C+love%2C+cheerfulness+in+the+manner+of+doing+these+things%2C+for+the+sword+of+the+magistrate+does+only+reach+men+for+their+external+facts%2C+not+for+opinions+in+the+mind%2C+not+for+crooked+intentions%2C+not+for+hollow-heartedness%2C+hypocrisy%2C+infidelity+in+the+manner%2C+or+inward+principles+of+the+actions.+2nd+Assertion.+When+magistrates+command+Churchmen+to+do+their+duty%2C+and+to+feed+the+flock%2C+sincerely%2C+and+in+the+fear+of+the+Lord%2C+they+do+it+not+as+magistrates+%5Bfrom+their+office%5D%3B+but+as+touching+the+manner%2C+they+may+exhort+them+to+do+their+duty+sincerely%2C+cordially%2C+and+zealously+as+godly+men%3B+hence+that+charge+that+King+Jehoshaphat+gave+to+the+priests+and+Levites%2C+2+Chron.+19%3A9%2C+%E2%80%98This+shall+ye+do+in+the+fear+of+the+Lord+faithfully%2C+and+with+a+perfect+heart%2C%E2%80%99+is+a+mixed+command+as+touching+the+judging+of+the+people+in+all+causes+and+controversies+that+should+come+before+them%3B+the+king+as+king+commanded+them+to+do+this%3A+But+for+the+manner+of+the+doing+of+it%2C+that+they+should+do+it+faithfully+in+the+fear+of+the+Lord%2C+and+with+a+perfect+heart%3B+this+he+commanded+them+not+as+a+king%2C+but+exhorted+them+to+it+as+a+godly+and+religious+man%2C+for%3A+1.+Any+godly+man+might+have+said+this%2C+and+the+King+might+have+punished+the+Levites+and+priests+if+they+had+not+judged+the+causes+according+to+the+Law.+But+though+they+had+not+judged+in+the+fear+of+the+Lord%2C+and+with+a+perfect+heart%2C+yet+could+not+the+king+as+king+have+punished+them+therefore%3B+nor+can+any+say+that+the+spiritual+exhortation+of+Hezekiah%2C+2+Chron.+29+to+the+priests+and+Levites+came+from+him+as+king%2C+but+as+from+a+graced+and+religious+man%3B+as+king+he+might+command+them+to+sanctify+themselves+legally%2C+for+so+they+were+to+do+by+office%3B+and+he+might+use+the+sword+against+them%2C+if+they+failed+in+that%3B+and+as+king+he+may+command+all+external+duties%2C+not+only+to+Churchmen%2C+but+to+all+others%2C+only+he+cannot+punish+them+for+failings+in+the+spiritual+manner+of+doing+external+duties%3B+2.+A+spiritual+and+Christian+exhortation+ex+conditione+operis+%5Bout+of+the+nature+of+the+work%5D%2C+and+intrinsically%2C+has+influence+on+the+conscience+to+turn+the+soul+to+God.+But+nothing+that+the+magistrate+can+do+as+a+magistrate%2C+has+such+an+influence+on+the+conscience%3B+all+that+he+does+as+a+magistrate+and+directly%2C+is+toward+the+outward+man%2C+by+rewards+and+punishments%3B+if+the+magistrate+remove+false+teachers+and+wolves%2C+which+would+devour+the+flock%2C+and+if+that+work+upon+the+conscience%2C+it+is+indirectly+and+by+accident%2C+for%2C+quoad+actus+imperatos+%5Bas+far+as+the+acts+having+been+commanded%5D%2C+he+can+command+that+the+Gospel%2C+which+has+a+kindly+%5Bin-kind%5D+and+intrinsic+power+to+work+upon+the+conscience%2C+be+preached%3B+if+the+magistrate+convince+the+conscience+of+a+murderer%2C+that+he+has+failed+against+the+Law+of+God%2C+he+does+not+that+as+a+magistrate%2C+but+as+a+godly+and+religious+man+he+may+convince+him+as+a+magistrate%2C+that+he+has+failed+against+the+laws+of+the+State+and+bands+of+human+society%2C+and+external+peace%E2%80%A6+Answer+%5Bto+an+objection%5D%3A+We+never+denied+but+the+magistrate+commands+both+the+exercise+of+Church+power+simply%2C+and+the+manner+and+such+qualifications+as+are+external+and+obvious+to+the+knowledge+of+the+magistrate%2C+such+as+blasphemous+and+false+doctrine+is%3B+But+we+deny+that+as+a+magistrate+he+does+command+those+things+that+are+internal+and+invisible%2C+that+is%2C+the+spirituality+of+the+actions%3B+he+can+exhort+and+stir+men+up+to+the+spirituality+and+sincerity+of+doing+as+a+godly+and+Christian+man.+%E2%80%A6+Answer+1+%5Bto+another+objection%5D%3A+%E2%80%A6for+%5Becclesiastical%5D+elders+may+command+as+elders+more+than+the+not+doing+of+which+they+can+censure%2C+which+the+magistrate+cannot+do%3B+for+elders+have+committed+to+them+the+Word+of+reconciliation%2C+as+the+ambassadors+of+Christ.+Now+the+Word+has+an+immediate+influence+on+the+conscience%2C+on+the+thoughts+and+intents+of+the+heart%3A+2+Cor.+5%3A18-20%3B+1+Cor.+3%3A5%3B+1+Cor.+4%3A15%3B+Ps.+19%3A7%3B+Heb.+4%3A12-13.+And+therefore+their+ministry+has+action+on+the+thoughts%3B+yet+can+they+not+in+the+external+court+of+the+Church+censure+the+thoughts%2C+as+not+being+able+to+see+them%2C+but+the+Gospel+which+they+preach+can+arraign+the+conscience+and+thoughts%2C+2+Cor.+10%3A4-5.+But+the+Magistrate+carries+not+such+a+message%2C+and+therefore+his+magistratical+command+can+reach+no+farther+than+his+temporal+praise+and+reward%2C+and+his+sword%3B+and+that+is+commensurable+and+of+equal+latitude+with+those.+%E2%80%A6+Answer+%5Bto+another+objection%5D%3A+It+is+true%2C+the+magistrate+as+the+magistrate+does+care+for+the+supernatural+good+of+subjects%2C+and+the+duties+of+religion%2C+and+the+First+Table%2C+but+how%3F+Intrinsically+and+as+a+magistrate%2C+that+is%2C+that+men+worship+God+according+to+his+Word%3A+But%3A+1.+The+magistrate+as+such+has+nothing+to+do+with+the+spirit%2C+nor+can+he+command+the+sincerity+of+the+worship%3B+his+care+is+that+there+be+a+divine+worship%2C+that+is%2C+materially+and+externally+right+and+consonant%2C+externally+to+the+rules+of+the+Word%3B+and+for+this+cause+learned+divines+make+the+external+man+the+object+of+the+magistrate%E2%80%99s+office%3B+but+not+the+external+man+as+doing+the+duties+of+the+Second+Table+only%2C+but+also+as+serving+God+in+the+duties+of+the+First+Table%3A+for+which+cause+I+said+Augustine+meant+the+same%2C+when+he+said+that+kings+serve+God+as+men+and+as+kings.+%28Augustine+contra+literas+petilian.%2C+bk.+2%2C+ch.+92+%26+contra+Cresconi.%2C+bk.+8%2C+ch.+5%29+2.+Magistrates+as+magistrates+are+to+extend+their+power+for+Christ%3B+that+is%2C+that+not+only+there+be+justice+and+peace+amongst+men%2C+but+also+that+there+be+religion+in+the+land%2C+yea%2C+that+the+Gospel+be+preached%3B+so+all+our+divines+make+the+king+to+be+custos+ut+vindex+utriusque+tabulae+%5BKeeper+%26+Vindicator+of+both+Tables%5D%3A+Yea%2C+I+think+he+is+a+keeper+and+preserver+of+the+Gospel+also%2C+and+is+to+command+men+to+serve+Christ%2C+and+profess+the+Gospel%2C+and+to+punish+the+blaspheming+of+Jesus+Christ%3A+and+this+is+royal+and+magistratical+service+that+the+King+as+King+performs+to+God%2C+and+to+Jesus+Christ+the+Mediator%2C+ex+conditione+operis+%5Bout+of+the+nature+of+the+work%5D%2C+in+regard+that+good+which+he+procures+as+King%2C+materially+and+externally%2C+is+consonant+to+the+supernatural+Law+of+the+Gospel%2C+but+it+is+not+magistratical+service+to+Christ+ex+intentione+operantis+%5Bout+of+the+intention+of+the+work%5D.+%E2%80%A6+3rd+Assertion+%E2%80%A6The+unjust+and+evil+exercise+of+the+ministerial+power+is+obnoxious+to+the+magistrate+as+the+magistrate%3B+thus%2C+in+that+he+bears+the+sword+against+all+evil+doers%2C+Rom.+13%3A1%2C+the+magistrate+as+the+magistrate+does+only+command+well+doing+in+order+to+praise+and+a+good+name%2C+or+temporal+reward+amongst+men%2C+Rom.+13%3A3%2C+%E2%80%9CDo+that+which+is+good+and+thou+shalt+have+praise+of+the+power%3B%E2%80%9D+1+Tim.+5%3A17%3B+Mt.+10%3A10.+Nor+can+the+magistrate+as+the+magistrate+promise%2C+or+command+the+%5Becclesiastical%5D+elders+to+feed+the+flock+with+the+promise+of+the+reward+that+Peter+promises%2C+1+Pet.+5%3A4%2C+to+wit%2C+that+when+the+Chief+Shepherd+shall+appear%2C+they+shall+receive+a+crown+of+glory+that+fades+not+away.+%E2%80%A6+Yet+my+sense+is+not+that+the+magistrate+can+lawfully+command+obedience+in+matters+of+religion+not+understood+or+known+by+the+subjects%3B+that+were+to+exact+blind+obedience%3B+but+my+meaning+is%2C+that+the+Magistrate+as+the+Magistrate+holds+not+forth+his+commandments+to+teach+and+inform+the+conscience%2C+as+pastors+do%2C+but+he+presupposes+that+his+mandates+are+known+to+be+agreeable+to+the+Word+of+God%2C+and+proposes+them+to+the+subjects+to+be+obeyed.+%E2%80%A6+5th+Assertion.+When+the+Magistrate+commands+painful+and+sound+administration+in+preaching+and+governing%2C+with+provision+of+the+praising+and+rewarding+of+well+doing%2C+he+does+not+subordinate+to+himself+the+ministry+in+its+exercise%2C+because+%5BRutherford+gives%2C+expounds+and+defends+two+reasons+for+this%5D%E2%80%A6+6th+Assertion.+Though+the+magistrate+may+both+threaten+to+inflict%2C+and+actually+inflict+the+ill+of+temporal+punishment+on+ministers%2C+if+they+be+either+idle+or+unsound+in+their+administration%3B+yet+thence+can+only+be+concluded+that+the+mal-administration+of+the+ministry+is+subjected+to+the+magistrate+as+such%2C+but+not+the+ministry+itself%2C+or+the+exercise+thereof%3A+1.+The+mal-administration+of+any+office+is+accidental+to+the+office.+2.+This+subjects+the+erring+person%2C+not+the+teaching+minister+%5Bas+such%5D%2C+to+the+civil+magistrate%E2%80%A6+7th+Assertion.+There+is+a+twofold+subordination+of+the+exercise+of+mal-administration+of+ministers%3B+one+civil%2C+another+ecclesiastical%3A+These+two+differ%2C+so+as+the+former+must+be+subordinate+to+the+magistrate+who+is+to+inflict+bodily+punishment%3B+but+the+latter+is+only+subject+to+the+Church.+The+judicial+determination+according+to+the+Word+of+God%2C+for+the+informing+of+the+conscience+and+gaining+to+the+truth+the+erring+ministers%2C+is+proper+to+the+college+%5Bpresbytery%5D+of+ministers%3B+and+in+this%2C+if+the+college+of+ministers+err%2C+they+are+also+punishable%3B+and+the+magistrate+is+to+command+them+to+judge+and+determine%2C+de+novo%2C+over+again%3A+The+magistrate+in+a+constitute%5Bd%5D+church+is+to+determine+civilly+%5Bin+distinction+from+the+above%2C+of+seeking+to+gain+erring+ministers+to+the+truth%5D%2C+and+sentence%2C+and+civilly+punish+the+ministers+that+either+are+dumb+dogs+and+will+not+bark%2C+or+that+pervert+the+souls+of+people+with+false+doctrine%3B+and+where+the+Church+is+constituted%2C+it+is+presumed+that+the+priests%2C+whose+lips+should+preserve+knowledge%2C+have+determined+in+an+ecclesiastical+way+the+very+same+%5Bthing%5D+which+the+judge+civilly+is+to+determine%2C+%5Band+that%5D+not+because+the+Church+has+so+determined+%5Balready%5D%2C+but+because+he+judges%2C+in+his+conscience%2C+it+to+be+according+to+the+Word+of+God.+%E2%80%A6+9th+Assertion%E2%80%A6+Even+as+the+magistrate+may+command+the+pastors+to+preach+and+dispense+the+sacraments+aright%3B+but+the+magistrate+himself+can+neither+preach+nor+dispense+the+sacraments%3B+so+the+%5BMedieval%5D+schoolmen+say+that+the+actions+of+the+understanding+depend+on+the+will%2C+quoad+excercitium+%5Bas+far+as+the+exercise%5D%3A+the+will+may+set+the+mind+to+think+on+this+or+that+truth%2C+but+not+quoad+specificationem+%5Bas+far+as+the+determination%5D.+The+will+itself+can+neither+assent%2C+nor+dissent+from+a+truth%2C+nor+can+the+will+command+the+mind+to+assent+to+a+known+untruth%2C+or+dissent+from+a+known+truth%3B+the+mind+or+understanding+naturally+does+both%3B+and+this+distinction+holds+in+acts+of+the+civil+power+and+in+acts+merely+ecclesiastical+%5Bthey+being+coordinate%5D.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%2C+%E2%80%A6+%281646%29%2C+pp.+543-561&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F652a314578.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/652a314578.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-civil-magistrates-just-authority-for-quarantining-and-restraining-the-congregating-of-citizens-even-the-church-with-sufficient-natural-warrant/#:~:text=1st%20Assertion%3A%20The%20Magistrate%20as%20the,acts%20merely%20ecclesiastical%20%5Bthey%20being%20coordinate&amp;text=1st%20Assertion%3A%20The%20Magistrate%20as%20the%20Magistrate%20is&amp;text=and%20in%20acts%20merely%20ecclesiastical%20%5Bthey%20being%20coordinate" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…it is the duty of a Christian Magistrate to provide that those things which either breed or nourish the plague, so far as they may, be taken away, and that regard may be had of those that be visited with this sickness, that all be not driven to be careful for all. But how they that serve in any public civil office may leave their charge in the time of the plague, I do not see; … But if in such calamities the magistrate do not in time provide, as much as may be, both by such lawful means as are not repugnant unto Christian charity, that the infection may be prevented, and also that the sick of the plague want [lack] nothing; he shall doubtless do very well both for the sick and the whole, and shall take away many questions which in this argument are wont [accustomed] to be raised:</p></blockquote>

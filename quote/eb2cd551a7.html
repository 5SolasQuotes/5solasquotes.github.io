<main class="wrap"><figure class="quote" id="q-eb2cd551a7" data-kw="">
<blockquote><p>I believe that whatsoever is sin, and so called, whether it be original, or by birth, as transgression in the loins of Adam, &amp; the corruption that followed of it, which I bear about in my flesh: or whether it be actual sin, as thoughts, words, and wicked deeds, which spring from thence: I believe I say, that all that through faith, whereby I am engrafted and dwell in Christ, in the free and undeserved goodness of God, is freely forgiven me, and so freely, that all memory, as well of the fault, as of the punishment, like as if I had never sinned, or had no sin, is taken away from before God: and therefore I trust that I am now already blessed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol of the Apostles</cite>, trans. John Field (London: Thomas Man, 1581), p. 242.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c7993e6b31" data-kw="">
<blockquote><p>Beauty and goodness in a thing are identical fundamentally; for they are based upon the same thing, namely, the form; and consequently goodness is praised as beauty. But they differ logically, for goodness properly relates to the appetite (goodness being what all things desire); and therefore it has the aspect of an end (the appetite being a kind of movement towards a thing). On the other hand, beauty relates to the cognitive faculty; for beautiful things are those which please when seen. Hence beauty consists in due proportion; for the senses delight in things duly proportioned, as in what is after their own kind—because even sense is a sort of reason, just as is every cognitive faculty. Now since knowledge is by assimilation, and similarity relates to form, beauty properly belongs to the nature of a formal cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1, q. 5, art. 4, reply to obj. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-ba1a071221" data-kw="">
<blockquote><p>The third consolation which Moses here describes is gladness at beauty bestowed — ‘Let the beauty of the Lord our God be upon us.’ Sorrow mars the countenance and clothes the body with sackcloth; but if the Lord will come to us and adorn us with his beauty, then the stains of mourning will speedily disappear. Brethren, what a beauty is this which the Lord giveth— ‘the beauty of the Lord our God!’ This comeliness is the beauty of his grace; for our covenant God is the God of all grace. If the Lord makes us to know that we are his our faces shine. If He fills us with his life and love, then brightness flashes from the eyes, and there is a grace about every movement. This ‘beauty’ means holiness; for holiness is the beauty of God. If the Holy Spirit works in you the beauty of holiness, you will rise superior to your afflictions. If this church shall be made the holier by its bereavements, we shall gain much by our losses. This beauty of the Lord must surely mean his presence with us. As the sun beautifies all things, so does God’s presence. When we know that Jesus is with us, when we feel that he is our helper, when we bask in his love, when he abides with us in power, this is the beauty of the saints. If we have Christ in us, Christ with us, we can bear any amount of trouble. ‘I can do all things, or can bear All suffering if my Lord be there.’ This beauty gives to the believer an attractiveness in the eyes of men: they perceive that we have been with Jesus, and they behold our faces shining like the faces of angels. It is a great thing when a Christian is so happy, so holy, and so heavenly that he attracts others to Christ, and people seek his company because they perceive that he has been in the company of the blessed Lord. God give you this, and if you have it, dear friend, you may forget your sorrows: they are transfigured into joy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-h-spurgeon.html">Charles H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Gladness for Sadness’ on Ps. 90:15-17</cite>, (Jan. 14, 1883) in Metropolitan Tabernacle Pulpit, vol. 29</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-8e355cfba8" data-kw="">
<blockquote><p>Let’s examine whether we are a people in Covenant with God. I know special care has been taken that these Nations should not be God’s people in Covenant; Men are afraid of an Association, but it will do them no harm if God be not the bond of it, and his honour, and interest the great end of it: But this we may assure our selves, that if we send away our God we may as wisely disband our Forces, and lay up our Ships; we must be God’s vineyard if we expect his special protection. Isa. 27. 2, 3. In that day sing ye unto her, A vineyard of red wine: I the Lord do keep it; I will water it every moment; left any hurt it, I will keep it night and day: That is, I will neither slumber nor sleep.</p></blockquote>

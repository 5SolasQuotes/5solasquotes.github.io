<blockquote><p>But God usually chastises men for such disorders, and suffers those same professors [professing Christians] to be our heart’s-grief and scourges (by turning to doctrinal or practical evils) who break God’s order and the churches’ unity in the over-valuing of our parts.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>4. What if many churches, yea all the churches, should offend one, should that one church gather all the rest together, judge them all, and in case of not submitting themselves to her judgement, separate herself from them all? If so, we should have separations and schismes enough, which should be continued to all posterity to come. … 7. What if the churches in their judgements should differ one from another, in such a case should they all by schisms separate themselves one from another?</p></blockquote>

</figure><figure class="quote" id="q-59b1a16d1e" data-kw="">
<blockquote><p>17. For there are two kinds of errors: some which consist only in belief, others which, besides belief, add some outward action. Of the first kind are the errors concerning the nature of Jesus Christ, concerning Predestination and concerning Free Will. Of the second are: Communion under one kind, adoration of the Host, and prayer in a tongue not understood by him that prays. The errors of this latter kind, although very often less grave than the former, yet divide minds far more sharply, and often cause schism. For if I communicate in the sacrament with one who errs concerning predestination or the nature of Jesus Christ, or who believes that the body of the Lord is everywhere—though the error be great—nevertheless it does not disturb him who communicates with him. But if I should come to communicate with one who adores the bread, or pretends to sacrifice Jesus Christ, such an action would scandalize me and drive me away for fear of participating in idolatry or in a false sacrifice. Now we have this advantage: that with the Lutheran Churches all our differences are of the first kind; and that, as to the external matters which they practice in the Church, we have no disagreement which is not easy to compose.</p></blockquote>

</figure><figure class="quote" id="q-7e085b9b29" data-kw="">
<blockquote><p>The Church of Corinth was defiled with many sins, and horrible outrages, both in life and doctrine, they were deriders, sectaries, incestuous, profaners of the Lord’s Supper, deniers of the most essential article of the resurrection; yet so long as the ministry of the Word and sacraments was not utterly rejected, Paul acknowledges them a glorious Church. Certainly tares and unclean vessels are in the Church, yet let us endeavor ourselves to be good corn, and not go out of the Church, but follow the counsel of Augustine: Corripiat homo, quod potest, quod non potest, patienter ferat; Let a man reprove what he can (without danger of schism) and what he cannot, let him patiently suffer, but let him never make separation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-otes.html">Samuel Otes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Explanation of the General Epistle of Saint Jude</cite>, (London: Purslow, 1633), sermon 19, p. 227</span></figcaption>

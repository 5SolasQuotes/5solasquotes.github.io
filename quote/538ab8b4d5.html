<main class="wrap"><figure class="quote" id="q-538ab8b4d5" data-kw="">
<blockquote><p>Having his head covered; i.e. with a hat or cap, or such covering of the head as is in use in the country wherein he lives. It is not to be understood of the natural covering of the head, which is our hair; nor yet of any other covering which is necessary for the preservation of life and health; but such a covering as he might spare, and is ornamental to him according to the fashion of the country… Dishonoureth his head; …Interpreters rightly agree, that this and the following verses are to be interpreted from the customs of countries; and all that can be concluded from this verse is, that it is the duty of men employed in divine ministrations, to look to behave themselves as those who are to represent the Lord Jesus Christ, behaving themselves with a just authority and gravity that becometh his ambassadors, which decent gravity is to be judged from the common opinion and account of the country wherein they live. So as all which this text requires of Christian ministers, is authority and gravity, and what are external ludications of it. Our learned Dr. Lightfoot observes, that the Jewish priests were wont in the worship of God to veil their heads; so that Christian ministers praying or prophesying with their heads covered, Judaized, which he judges the reason of the apostle’s assertion. The heathens also, both Romans and Grecians, were wont to minister in their sacred things with their heads covered. Some think this was the reason why the Christians used the contrary gesture; but the apostle’s arguing from the man’s headship, seems to import that the reason of this assertion of the apostle was, because in Corinth the uncovered head was a sign of authority. At this day the Mahometans (or Turks) speak to their superiors covered, and so are covered also in their religious performances. The custom with us in these western parts is quite otherwise; the uncovering of the head is a sign or token of subjection: hence ministers pray and preach with their heads uncovered, to denote their subjection to God and Christ: but yet this custom is not uniform, for in France the Reformed ministers preach with their heads covered; as they pray uncovered, to express their reverence and subjection to God, so they preach covered, as representing Christ, the great Teacher, from whom they derive, and whom they represent. Nothing in this is a further rule to Christians, than that it is the duty of ministers, in praying and preaching, to use postures and habits that are not naturally, nor according to the custom of the place where they live, uncomely and irreverent, and so looked upon. It is only the general observation of decency (which cannot by any be created, but arises either from nature, or custom, and prescription) which this text of the apostle makes to be the duty of all Christians; though as to the Corinthians, he particularly required the man’s ministering in sacred things with his head uncovered, either to avoid the habit or posture used by Jews and pagans; or for the showing of his dignity and superiority over the woman, (whom we shall by and by find commanded to pray or prophesy covered), or that he represented Christ who was the Head of the church. The uncovering of the head being with them as much a sign of subjection, as it is with us of superiority and pre-eminence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11 | v. 4</cite></span></figcaption>

<blockquote><p>Wherefore let it be set down that it is lawful for the Church to make to itself either canons or laws, or decrees, or statutes, or call them by what name thou wilt. For the Church is a company, and must be ruled by the Word of God, especially because it belongs to the salvation thereof, and to the worshiping of God. But there be other things which belong only unto outward discipline. For there is need of certain outward bonds, to the end that the fellowship of the people may be retained. So the apostle decreed that women ought to pray with the head covered, and men uncovered. And the apostles in the Acts, decreed that we should abstain from blood, from strangled, and from things dedicated unto idols. And always in councils after they had done with doctrine, they began to entreat of discipline. Finally so did all the fathers as Tertullian, Origen, Basil, Augustine and Jerome. The end of these laws must be edifying and good order. But for so much as they be not of necessity, they may be changed according to the times and places.</p></blockquote>

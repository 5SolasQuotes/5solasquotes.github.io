<main class="wrap"><figure class="quote" id="q-6225698499" data-kw="">
<blockquote><p>Regarding ministers, if one today comes to believe it is most proper, apart from necessity, to sit at a table for the Supper, or to do it with a common cup, and that’s not going to happen in the next few weeks or several months, must a minister abstain from dispensing an impure Supper (with the attendant consequences) or resign his charge to his congregation and go elsewhere? Do you have a framework in which to deal with this, while maintaining a clear and undoubting conscience? If Church officers cannot ever comply with things not fully right, regarding worship or otherwise, then officers can never remain in the Church while seeking her reform. Most all the reformers were against Gillespie’s principle as they continued in the Church (maintaining her unity) while performing practices they did not believe were fully right, while seeking to reform them to the Word, which largely occurred. That was a great good, only able to be attained through that means and our principle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-14ec447b49" data-kw="">
<blockquote><p>VI. Fifth, ‘the precepts of the first table take the preference of those of the second’ as to necessary internal and external acts, when they both cannot have place at the same time. Thus the love of our neighbor ought to be subjected to the love of God. We are bound to hate father and mother for Christ’s sake (Lk. 14:26), when the love of parents is incompatible (asystatos) with the love of Christ. Human commands are to be neglected when opposed to the commands of God (Mt. 10:37; Acts 4:19). But in turn ‘the ceremonial of the first table yields to the moral of the second because God desires mercy and not sacrifice’ (Hos. 6:6), i.e., moral worship principally and primarily as better and of itself necessary; the ceremonial, however, only secondarily on account of the moral. Hence we ought not to be so anxious about the former as about the latter. … VIII. Seventh, ‘the beginning and end of all the precepts is love.’… However as the object of love is twofold (God and our neighbor), so a twofold love is commanded: of God in the first table of the law; of our neighbor in the second. That is called ‘the first and great commandment’; this ‘the second like to it.’ The love of God is rightly called the ‘first’ commandment because as there is nothing before God, so his worship ought first to be attended to by us in order that all things may begin from and end in it. It is called ‘great’ (a) with regard to the object because conversant with the greatest and infinite object (viz., God)… The second is said to be ‘like’ unto it, not with regard to importance, but (1) with regard to quality because both in the love of God and of our neighbor sincerity and purity of heart are required; (2) with regard to authority because each is commanded by God and tends to his glory; (3) with regard to punishment because the violation of either table exposes to eternal death; (4) with regard to connection and dependence because they are so strictly connected with each other that neither can be fulfilled without the other (for as God cannot be loved without the love of God, who created him)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 11th Topic, ‘The Law of God’, Question 6, ‘The Rules of Explanation and of Observance of the Decalogue’, Sections VI &amp; VIII, pp. 35-37</span></figcaption>

</figure><figure class="quote" id="q-35fe3c05b1" data-kw="">

</figure><figure class="quote" id="q-19d9bdc409" data-kw="">
<blockquote><p>…he takes from this ground that when two duties commanded of God do meet in one practice, so as we can not do them both, in this case we must performe the greatter duty and neglect the lesser. Now, whereas he says when two duties do meet, etc., he means not that both may be duties at once, for then a man shall be so straitened that he must needs commit a sin, in that he must needs omit one of the duties. But (as he explains himself) he calls them duties being considered apart: as to hear a sermon at the Church on the Sabbath, and to tend a sick person ready to die at home at the same time; both are duties being considered apart, but meeting together in our practice at one time, there is but one duty, because the lesser work binds not for that present.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 1, pp. 3-4</span></figcaption>

</figure><figure class="quote" id="q-c40c632b2a" data-kw="">
<blockquote><p>The third innovation is that the word of promise, ‘This is my body,’ ‘This cup is the new testament, etc.’ is not uttered demonstratively when the elements are delivered to every communicant. It is not enough that the words of the institution were rehearsed before by way of history narratively, or materially. This sacrament is an imitation of Christ, not a recital of his words and actions; it is to do as He did, and not to report what He did, says Pierre du Moulin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute upon Communicating at our Confused Communions</cite>, ch. 4, ‘Of the Words Uttered at the Delivery of the Elements’ in A Dispute upon Communicating at our Confused Communions (Amsterdam, 1624), pp. 24-28</span></figcaption>

<blockquote><p>Others (Rodr., Sum., Tome 1, ch. 5, de Abort.) more probably hold that if the case be utterly desperate, and it be certain that both mother and child must undoubtedly perish if some speedy remedy be not had, it may then be lawful to make use of such receits [receiving treatments] as may possibly give some hopes to save the mother, though not without some peril of the child. But all this while the intentions and indeavours must be no other than preservatory, however it pleases God to order the events: Shortly, no man that purposely procures an abortion, as such, can wash his hands from blood; No woman that willfully acts, or suffers it (however the secrecy may exempt her from the danger of human laws) can think to avoid those judgments of the righteous God, which he has charged upon murderers. … But withal, let me advise you, (with Martinus Vivaldus, Mart. Alphons. Vivald., Expli. Bull Crue.) that what I have herein written against the procurers of abortions may not be extended to the practice of those discrete physicians and chirurgeans [surgeons], who, being called to for their aid in difficult and hopeless child-births, prescribe to the woman in travail such receits as may be like to hasten her delivery (whether the child be alive or dead); forasmuch as the conception is now at the full maturity and the endeavor of these artists is not to force an abortment, but to bring forward a natural birth to the preservation of the mother, or the child, or both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times</cite>, 2nd Decade, Case 3, ‘Whether may it be Lawful, in Case of Extremity, to Procure the Abortion of the Child, for the Preservation of the Mother?’ in Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times (London, 1654), pp. 96-7, 100</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3c7ee5eca1" data-kw="">

</figure><figure class="quote" id="q-0c98fff008" data-kw="">
<blockquote><p>For example, take the embryo; we affirm that this properly lives as soon as the heart partakes of life, although the other members of the body are not yet developed. Why, then, should we not say, that the spiritual embryo, from that very moment in which the heart is embued with spiritual life, is quickened or regenerated, although many parts of sanctification have not yet acquired their distinct, and, as it were, perfect development.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Determinations, or Resolutions of Certain Theological Questions, Publicly Discussed in the University of Cambridge</cite>, p. 266 of Determination 9, ‘Free-will is not granted to the unregenerate for their spiritual good’ inThe Determinations, or Resolutions of Certain Theological Questions, Publicly Discussed in the University of Cambridgetrans. Josiah Allport (1634; 1846) bound at the end of John Davenant, A Treatise on Justification, or the Disputatio de Justitia... trans. Josiah Allport (1631; London, 1846), vol. 2</span></figcaption>

t" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5e345233f7" data-kw="">
<blockquote><p>1. There be some preparations which go before faith: Faith is a seed of heaven… so does the Lord set up a new world of faith in a soul void of faith by degrees: There’s a time when there’s neither perfect night, nor perfect day: but the twilight of the morning… There’s a half summer, and a half spring in the close of the spring which God made. The embryo, or birth not yet animated, is neither seed only, nor a man-child only… … 3. Its true, the new creation and life of God is virtually seminaliter [seminally] in these preparations, as the seed is a tree in hope, the blossom an apple, the foundation a palace in its beginning; so half a desire in the non-converted is love sickness for Christ in the seed, legal humiliation is in hope evangelic repentance and mortification: But as the seed and the growing tree differ not gradually only, but in nature and specifically, as a thing without life is not of that same nature and essence with a creature that has a vegetative life and growth, so the preparatory good affections of desire, hunger sorrow, humiliation going before conversion, differ specifically from those renewed affections which follow after…</p></blockquote>

</figure><figure class="quote" id="q-c7be8869db" data-kw="">
<blockquote><p>When He creates a human soul and pours it into an organized body, it is not that it should be there as water in a vessel, or as a king in his palace: it lives not thereas an assisting form, or as an outward cause of the body’s operations, but it is united to it by a very strict union, and serves as an essential form; It is the principle of our life, the internal cause of motion of sense, and of understanding: So that if we will speak properly, man cannot be said to be altogether of a spiritual nature, as the holy angels, nor a single body, as the sun, and the stars; but, he is made up of both:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-drelincourt.html">Charles Drelincourt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Defense against the Fears of Death</cite>, … (London, 1675), ch. 23, pp. 443-44</span></figcaption>

<blockquote><p>2. Nor do we want to absolutely reject that judgment which distinguishes between the sufficiency and efficacy of Christ’s death, so that it extends to individuals; [but] here it [1 Tim. 2:6] is restricted to only the elect and believing. We know indeed this distinction was constantly received in the schools from the time of Lombard (Sentences, bk. 3, distinction 20, letter ‘c’) and Pope Innocent III (On the Mystical Mass, bk. 2, ch. 41), in which things already has shined not only Primasius, Prosper and others of the ancients, but even so at some time Augustine himself, To the false articles imputed to himself, article 1… Indeed the Synod of Dort itself evidently intimates that in the Second Head of Doctrine, sections 3 &amp; 8… But yet we choose fairly enough not to bring this distinction to the place of Paul upon which we treat. That is to be demonstrated shortly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-maresius.html">Samuel Maresius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Theological Judgment on the Questions of Grace &amp; Universal Redemption, Partly Refutative, containing 10 Exercitations, Against the Apology of John Daille, published in Belgium, contra the Common &amp; Constant Judgment of the Reformed Churches &amp; Schools of the Belgic Federation, and All Others, to which is Appended Brief Strictures to the Recent Vindications of the Same Daille, which are Most Wordy &amp; Contumacious</cite>, A Theological Judgment on the Questions of Grace &amp; Universal Redemption, Partly Refutative, containing 10 Exercitations, Against the Apology of John Daille, published in Belgium, contra the Common &amp; Constant Judgment of the Reformed Churches &amp; Schools of the Belgic Federation, and All Others, to which is Appended Brief Strictures to the Recent Vindications of the Same Daille, which are Most Wordy &amp; Contumacious… (Groningen, 1658) | Exercitation 2. Places customarily used to support universal redemption are weighed: 1 Tim. 2:6, the distinction between the sufficiency and efficacy of the death of Christ; Rom. 5:18; Heb. 2:9, ‘every man’, what it is; Jn. 1:9 &amp; 1 Jn. 2:2, in which the true sense is propounded and vindicated: other testimonies on the term ‘world’ 58-102</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dd1fec55c9" data-kw="">
<blockquote><p>They [the anti-predestinarians] also grant that ‘Christ died for us all’ and infer from this that his benefits are common to everyone. We gladly grant this, too, if we are considering only the worthiness of the death of Christ, for it might be sufficient for all the world’s sinners. Yet even if in itself it is enough, yet it did not have, nor has, nor will have effect in all men. The [Medieval] Scholastics also acknowledge the same thing when they affirm that Christ redeemed all men sufficiently but not effectually.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Predestination &amp; Justification</cite>, tr. Frank A. James (Kirksville, Missouri: Sixteenth Century Essays &amp; Studies, 2003), vol. 8, p. 62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-3060066d73" data-kw="">
<blockquote><p>VIII. …We acknowledge that Christ died for all; but we deny that by his death salvation and forgiveness of sin is obtained for all men: or that reconciliation is made for Cain, Pharaoh, Saul, Judas, etc. Neither do we think that remission of sins is obtained for anyone whose sins are not remitted; or that salvation was purchased for him, whom God from eternity hath decreed to condemn: for this were a vain purchase… IX. And when we say that Christ died for all, we take it thus, to wit, that the death of Christ is sufficient to save whosoever do believe, yea, and that it is sufficient to save all men, if all men in the whole world did believe in Him: and that the cause why all men are not saved, is not in the insufficiency of the death of Christ, but in the wickedness and incredulity of man. Finally, Christ may be said to reconcile all men to God by his death, after the same manner, that we say that the sun doth enlighten the eyes of all men, although many are blind, many sleep, and many are hid in darkness: Because if all and several men had their eyes, and were awake, and were in the midst of the light, the light of the sun were sufficient to enlighten them. Neither is it any doubt but that it may be said, not only that Christ died for all men, but also that all men are saved by Christ, because among men, there is none saved but by Christ: after the same manner that the apostle saith, 1 Cor. 15:20, that ‘all men are made alive by Christ’, because no man is made alive but by Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism</cite>, ch. 27, ‘How Far, &amp; in What Sense Christ Died for All? The Opinions of the Parties’ in The Anatomy of Arminianism… (1619; London, 1635), p. 196 ff. | Moulin first surveys the opinions and statements of the Arminians and then concludes the chapter with a positive statement of his (and others’) position:, pp. 198-199</span></figcaption>

</figure><figure class="quote" id="q-f271ecd378" data-kw="">
<blockquote><p>As early as 1595 Piscator, the longtime professor of theology at Herborn whose commentaries on Scripture were generally admired by the Reformed, argued that Christ in no way died for the reprobate. In England, the controversial Peter Baro picked up on this teaching and publicly rejected it in his sermon on the Lambeth Articles in January 1596. Baro had good reason to be alarmed for, in 1594, a Church of England minister named William Burton similarly denied that the death of Christ was sufficient for the nonelect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-baro.html">Peter Baro</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Michael Lynch, John Davenant’s Hypothetical Universalism: a Defense of Catholic &amp; Reformed Orthodoxy</cite>, (Oxford Univ. Press, 2021), p. 57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<blockquote><p>II. We believe also that this death of Christ alone, is a perfect and sufficient ransom, to expiate and abolish all the sins of the whole world, that the merit of his justice is immense, that the medicine of his death is universal, the ever-flowing and inexhausted spring of life eternal.</p></blockquote>

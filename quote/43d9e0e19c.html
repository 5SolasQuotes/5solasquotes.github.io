<main class="wrap"><figure class="quote" id="q-43d9e0e19c" data-kw="">
<blockquote><p>From this it follows, that subjects are no farther bound to obey the magistrate because of conscience, than in as far as he himself presides and enjoins with a good conscience, and on the authority of the Word of God: and besides, it is worthy of observation, that the wrath of the magistrate, unless directed against the disobedient, refusing to do their duty according to the injunction of Jehovah, is neither just, nor lawful, nor to be feared by his subjects, but Christians, in the Christian warfare, must pass through the midst of it to victory in Christ, by the power of the Spirit of God; as we see in the case of Daniel, who rose to victory through the lions’ den, with his three friends, who esteemed the wrath of the king as nothing in comparison with their duty to God, although the disobedient were threatened with a fiery furnace, the heat of which had been increased seven times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-ferme.html">Charles Ferme</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Logical Analysis of Romans (†1617) on Rom. 13:5, p. 293. Ferme (1565-1617) was a reformed Scottish divine.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-52baa4154a" data-kw="">
<blockquote><p>2. We must believe none that speak against the Light of Nature and common notices of all mankind: for that were to renounce humanity: And the Law of Nature is God’s first Law. But it is not the sentiments of nature as depraved which is this Law. 3. We must believe no men against the common senses of mankind, exercised on their duly qualified objects. Faith contradicts not common sense, though it go above it. We are men before we are Christians, and sense and reason are presupposed to faith… For if sense be not to be trusted, we know not that there is a Church, or a man, or a Bible or any thing in the world, and so nothing can be believed. Whether all sound senses may be deceived or not, God has given us no surer way of certainty. 4. Nothing is to be believed against the certain interest of all mankind and tending to their destruction; That which would damn souls, or deny their immortality and future hope, or ruin the Christian world or nations, is not to be believed to be duty or lawful: For truth is for good, and faith is for felicity; and no man is bound to such destructive things. 5. Nothing is to be believed as absolutely certain which depends on the mere honesty of the speakers: For all men are liable to mistake or lie. 6. The more ignorant, malicious, unconscionable, factious, siding, any man is, the less credible he is. And the wiser and nearer to the action any man is, and the more conscionable, peaceable and impartial he is, the more credible he is. An enemy speaking well of a man, is so far more credible than a friend: Multitudes, as capable and honest, are more credible than one. 7. As that certainty which is called moral, as depending on men’s free-will, is never absolute, but has many degrees, as the witness is more or less credible; so there is a certainty by men’s report, tradition or history which is physical and wholly infallible: As that there is such a place as Rome, Paris, etc. and that the statutes of the land were made by such kings and parliaments to whom they are ascribed; and that there have been such kings, etc. For proof of which know: 1. That besides the free acts, the will has some acts as necessary as it is to the fire to burn, viz. To Love ourselves and felicity, and more such. 2. That when all men of contrary interest, friends and foes, agree in a matter that has sensible evidence, it is the effect of such a necessitating cause. 3. And there is no cause in nature that can make them so agree in a lie. Therefore it is a natural certainty. Look back to the sixth chapter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catechizing of Families... (London, 1683), ch. 42, ‘Of the 9th Commandment’</cite>, pp. 361-62</span></figcaption>

</figure><figure class="quote" id="q-72c5a026dc" data-kw="">
<blockquote><p>Did the Lord by Moses give to the Jews as a body politic sundry judicial laws which expired with their state? Yes. Do they oblige any other now, further than the general equity thereof may require? No (Ex. 21; 22:1-29; Gen. 49:10; 1 Cor. 9:8-10; 1 Pet. 2:13-14; Mt. 5:17,38-39). Well then, do not some err, though otherwise orthodox, who maintain that the whole judicial law of the Jews is yet alive and binding all of us who are Christian gentiles? Yes. By what reasons are they confuted? 1. Because the judicial law was delivered by Moses to the Israelites to be observed, as to a body politic (Ex. 21). 2. Because this law, in many things which are of particular right, was accommodated to the commonwealth of the Jews, and not to other nations also (Ex. 22:3; 21:2; Lev. 25:2-3; Dt. 24:1-3; 25:5-7). 3. Because, in other things which are not of particular right, it is neither from the law of nature obliging by reason; neither is it pressed upon believers under the gospel to be observed. 4. Because believers are appointed under the gospel to obey the civil law and commands of those under whose government they live, providing they be just, and that for conscience’ sake (Rom. 13:1; 1 Pet. 2:13-14; Titus 3:1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth’s Victory Over Error, ch. 19, question 4 (the first commentary defending the Westminster Confession)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-a7deb7955d" data-kw="">
<blockquote><p>But our [prelate] doctors will have the commandments-positive of men to stand [upon the Church of Scotland], and the commandments of God, which are expressly of the law of nature to fall before their Dagon, and to lose all obligatory power, whereas God’s own positive-law yields, and loses obligatory power, when God’s natural commandment of mercy comes in competition with it, as is clear as the noon-day, in David famishing, who eat[s] the showbread, which by a positive law, was not lawful to any save the priests only, to eat, yet must man’s law stand and God’s law of nature fall at the pleasure of these Doctors.</p></blockquote>

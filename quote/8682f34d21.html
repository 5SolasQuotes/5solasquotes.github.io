<main class="wrap"><figure class="quote" id="q-8682f34d21" data-kw="">
<blockquote><p>Fourthly, that the principal work for the highest ministers in the Church to do is to preach the Gospel. Fifthly, that the doctrine of our reconciliation with God in Jesus Christ, is the principal doctrine to be taught or learned. Sixtly, that grace and mercy in Jesus Christ from God is offered to every creature upon condition of faith and repentance: None is excepted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rule of Faith, or an Exposition of the Apostles’ Creed</cite>, … (London: Stephens, 1626), 5th Article, p. 472</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

— Nicholas Byfield, The Rule of Faith, or an Exposition of the Apostles’ Creed… (London: Stephens, 1626), 5th Article, p. 472">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFourthly%2C+that+the+principal+work+for+the+highest+ministers+in+the+Church+to+do+is+to+preach+the+Gospel.+Fifthly%2C+that+the+doctrine+of+our+reconciliation+with+God+in+Jesus+Christ%2C+is+the+principal+doctrine+to+be+taught+or+learned.+Sixtly%2C+that+grace+and+mercy+in+Jesus+Christ+from+God+is+offered+to+every+creature+upon+condition+of+faith+and+repentance%3A+None+is+excepted.%E2%80%9D%0A%0A%E2%80%94+Nicholas+Byfield%2C+The+Rule+of+Faith%2C+or+an+Exposition+of+the+Apostles%E2%80%99+Creed%E2%80%A6+%28London%3A+Stephens%2C+1626%29%2C+5th+Article%2C+p.+472&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8682f34d21.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8682f34d21.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relation-of-repentance-to-saving-faith-justification/#:~:text=Fourthly%2C%20that%20the%20principal%20work%20for,faith%20and%20repentance%3A%20None%20is%20excepted&amp;text=Fourthly%2C%20that%20the%20principal%20work%20for%20the%20highest&amp;text=condition%20of%20faith%20and%20repentance%3A%20None%20is%20excepted" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3b2ffcfa31" data-kw="">
<blockquote><p>Whether some movement of free choice and faith is required? It is affirmed with a distinction. Whether a movement of free choice contra sin? It is disintinguished. Whether the remission of sins is to number the premises and prerequisites of justification? It is denied. Whether the infusion of grace is by order of nature first amongst those things which are required for justification? It is distinguished. … Whether inhering righteousness is the cause of justification? It is denied. … Whether the righteousness of the justified is inhering or imputed? The latter is affirmed contra the Papists. … Whether we deny all inherent righteousness? It is denied. … Whether sanctification or regeneration precedes justification, or the contrary? It is distinguished. … Whether it [justification] precedes repentance? It is distinguished. … Whether and in what way the law and penitence are able to be said to concur unto our justification? It is explained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems</cite>, 9. ‘Justification’, Of Justification in General in Syllabus of Theological Problems (Utrecht, 1643), pt. 1, section 2, tract 3 Abbr.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-cf04129731" data-kw="">
<blockquote><p>4… More rightly, therefore, do other Protestants, who are more sound and moderate, willingly concede that various disposing and preparing acts, produced in us through the Holy Ghost assisting, and not by the sole powers of our free-will, are required before justification, though most of them deny to these acts any power of justifying. (Pareus contra Bellarmine on Justification, bk. 1, ch. 3, p. 35, sect. secundo tenendum ff.; with many others) 5. Although not everything which has been said and written, and is commonly cited by Romanists and others for each of these disposing acts (e.g. ‘We are saved by hope,’ [Rom. 8:24] ‘Her sins, which are many, are forgiven, for she loved much,’ [Lk. 7:47] and some others), fully proves the point in question, yet they greatly err who, on that account, deny the thing itself, which is most certain from innumerable other passages of Scripture. 6. All Protestants rightly deny that these disposing acts done by faith and preventing grace, merit justification in any way, even in that of congruity; but very many Romanists also deny this, in opposition to the opinion of Bellarmine…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Considerationes Modestae et Pacificae Controversiarum de Justificatione</cite>, ... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 1, ch. 3, p. 27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-dfc07c88cd" data-kw="">
<blockquote><p>I answer: though the Lord give us no particular promise in his Word, yet He gives us that which is equally effectual, and of like force; namely his general promise without any limitation, exception or condition, but the condition of faith and repentance, with a commaundment to apply the same. And because naturally we are unable in ourselves to perform this, therefore He has ordained the ministry of the Word, and the use of the sacraments, which He makes effectual by the inward operation of his Spirit, for the begetting and confirming of our faith, and stirring us up to repentance; which being wrought in us, we may as certainly be persuaded that the general promises belong unto us, as if they were made unto us particularly and by name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Warfare</cite>, … (London, 1604), bk. 2, ch. 12, ‘The reasons alledged against the assurance ofour salvation, answered’, p. 271</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

<main class="wrap"><figure class="quote" id="q-45464faf15" data-kw="">
<blockquote><p>Mat. x. 37, ‘He that loveth father or mother more than me, is not worthy of me.’ And to love anything more than Christ, is to hate him. A less degree of love is called hatred in Scripture, Gen. xxix. 30, 31. Because he loved Leah less than Rachel, he is said to hate her. Even as you may be said to hate your relations, enjoyments, lives, when you love them less than Christ, so much less as you will be content to part with them for his sake, whenever he requires it. And in this sense you must be able to hate them, or else you cannot be the disciples of Christ, or else you are not Christians; for upon these terms, and no other, will he own you for such.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Taking up the Cross in The Practical Works of David Clarkson, B.D., Fellow and Tutor of Clare Hall, Cambridge</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god.html">Attributes of God</a></span></div>

<blockquote><p>voluntas Dei, ‘the will of God’ … The Reformed further argue the distinction of the voluntas decreti vel beneplaciti [will of decree or good-pleasure] or voluntas decernens [decreeing will] into the categories of voluntas efficiens, effecting will, and voluntas permittens, permitting will. Under the former category, God is viewed as directly or indirectly through instrumental causes effecting his positive will, whereas under the latter category God is understood as permitting both contingent events and acts of free will even when such events and acts go against his revealed will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms</cite>, ed. 1</span></figcaption>

</figure><figure class="quote" id="q-7292ee5fa0" data-kw="">
<blockquote><p>Again, some school-divines following Damascene make and ascribe to God an applied or depending [consequent] will, on this manner: God for his part [antecedently] would have all men without exception to be saved: why then are they not saved? They themselves will not. And because they will not, God therefore [consequently] chooses some and refuses others. But according to the former doctrine, I take this kind of applied will to be an invention of man’s brain. For the contrary is the truth, namely that man’s will wholly depends on the will of God. That vessels be some of honor, some of dishonor, it is not in the power of the clay, but in the will of the potter. The first cause orders the second, and not the second the first. To make God’s will depend on man’s will, is to put God out of his throne of majesty, and to set the creature in his room. Others set forth the depending will of God on this manner: God (say they) decrees nothing in particular of things that are casual and contingent, but He foresees within Himself what the will of the creature will do or not do, when things are thus or thus ordered: and upon this foresight He consequently determines what shall be done. (Bellarmine, bk. 4, ch. 15, Of Grace &amp; Free Will; Richard Tapper) But this opinion, as it gives unto God a common or general providence, so it takes away the certain determination of God touching all particular events. And it is absurd to think that God should foresee the future acts of man’s freewill, when as yet He has determined nothing: for things that shall be, are therefore to come to pass, because God by decree has determined their being. And therefore the foreknowledge of things that shall be follows the decree of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of God’s Free Grace &amp; Man’s Free Will</cite>, (Cambridge, 1601), pp. 146-48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-63da9bcc6a" data-kw="">
<blockquote><p>A second reason to believe humans cannot grasp infinity is that the concept must contain an infinite number of sub-concepts, which is too many for our finite minds. A counter to this reason is to defend the psychological claim that if a person succeeds in thinking about infinity, it does not follow that the person needs to have an actually infinite number of ideas in mind at one time… Here is a simple argument that we can: If we understand negation and have the concept of finite, then the concept of infinite is merely the concept of not-finite.</p></blockquote>

</figure><figure class="quote" id="q-07a072d47b" data-kw="">
<blockquote><p>We assert that the eternal law is above the nature of all other laws (as we just now said). For when we call the eternal law the immutable concept and form of reason, we demonstrate that it is pure, unadulterated act, just as God is a simple actuality on whom, as the universal principle, entirely all things depend. Moreover, when we say that that form of reason has been conceived by God and in God for the common good, we manifestly distinguish the eternal law of God from the rest of the reason of the divine wisdom that acts and occupies itself with created things. For the reason of that divine wisdom, which is prominent in acting, moving, and sustaining created things, is occupied with all things all the time.</p></blockquote>

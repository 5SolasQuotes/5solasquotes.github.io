<main class="wrap"><figure class="quote" id="q-267606c00b" data-kw="">
<blockquote><p>6. The Word is God’s mean to work supernatural effects, to convert the soul, Ps. 19:7, to work faith, Jn. 20:3, to edify, Acts 20:32, to save, Rom. 1:16. The obedience to God’s Word, brings peace, Ps. 119:165, comfort, v. 50; Gen. 49:18; Isa. 38:3. But ceremonies, being apt to stir up the dull mind, must be apt to remove natural dullness, which is a supernatural effect, and so to bring, peace, joy, comfort: Organs are now holden by the same right, that they were in Moses’ Law, then they must stir up supernatural joy: There must be peace and comfort in practicing them. Hear how this sounds: ‘This is my comfort, O Lord, in my affliction, that thy surplice, organs, and holy-days have quickened my dull heart.’ Now what comfort [is there], except comfort in the Scriptures? Rom. 15:4. Ceremonies be innocent of all Scriptures [have nothing of the Scriptures in them]. What joy (a proper fruit of the Kingdom of Heaven, Rom. 14:17) can be in sapless ceremonies? Yea, observe: 1. Who truly converted from Popery, who [is] inwardly humbled in soul, does not abhor ceremonies by the instinct of the new birth? 2. What slave of hell and profane person call not for ceremonies? 3. Who has peace in dying that ceremonies were their joy? 7. All lawful ordinances may by prayer be recommended to God for a blessed success as all the means of salvation, Ps. 119:18; Mt. 26:26; Acts 4:29-30. 2. We may thank God for a blessed success, which they have by the working of the spirit of Grace, 2 Cor. 2:24; 1 Cor. 1:4-5; 2 Thess. 1:2-3; Eph. 1:3. 3. We are to have heat of zeal against profaning of Word, sacraments, prayer, or other ordinances of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), Question 3, ‘Whether Ceremonies Have any Divinity in Them’, p. 132</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-44a6cfa9e1" data-kw="">
<blockquote><p>…considerable inconveniences, which follow from the introduction, affectation and imposition of a ceremonial way of worship under the Gospel… 2. There is a great obstruction to edification and the salvation of souls [due to the obstructing of spiritual worship and knowing God truly: spiritually as a Spirit]: Beloved, that man understands little of the worth of a soul, that does not value the salvation of one soul, before ten thousand of those unnecessary ceremonies. Better all the organs in the world broken, all material temples leveled with the ground, all sacred garments (as they are accounted) of ministers, cast into a fire, than one soul lost.</p></blockquote>

</figure><figure class="quote" id="q-9ddbd7b749" data-kw="">
<blockquote><p>Fifthly, some consider instruments to be a mere circumstance rather than a real element of worship, so the Church can use them or not, as it sees fit. That there are such circumstances the Westminster Confession acknowledges: “There are some circumstances concerning the worship of God . . . common to human actions and societies, which are to be ordered by the light of nature, and Christian prudence, according to the general rules of the word, which are always to be observed” (1:6). However, God did not treat instruments as mere circumstances. They had no place in Old Testament worship until He put them in it by His express command. And He has never put them into New Testament worship. Plus, to class something as a mere circumstance rather than an element of worship, it must be common to human society and necessary. Appointing a suitable time and place to meet for public worship is a circumstance of worship, because without that no gathering of people could be possible, and is done for all orderly public meetings. But singing with instruments is not necessary: it may be done, but it does not need to be done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/k-m-watkins.html">K.M. Watkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rev. Watkins is a minister in the Free Presbyterian Church of Scotland. ‘Musical Instruments in Worship’</cite>, p. 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><figure class="quote" id="q-ee2867da8e" data-kw="">
<blockquote><p>This cathedral music introduces to the Church of God a rabble of church-officers which the Lord never appointed, and which never came into His heart, the choristers and singing-men, and that is a very great evil. It is not in the power of men, but it is the great prerogative of Jesus Christ to appoint officers in His church who has appointed none but pastors and teachers, elders and deacons.</p></blockquote>

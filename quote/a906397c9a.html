<blockquote><p>1. We begin with the most ancient father, Justin [Martyr]. He, in the book inscribed… an Exposition of the Faith, has these words: ‘The Son of God, as man, passed a life removed from all crime, and underwent a voluntary death; [Greek] that is, obliterating sin by a perfect and sinless conversation [conduct], and abolishing our debt by a debt that he owed not. Justin Martyr here plainly teaches, not only that the death and satisfaction of Christ are imputed to us for the blotting out of our punishment, but that his conversation itself, or active obedience, is imputed to us, for the obliteration of our sin. 2. Irenaeus, Against Heresies, bk. 5… in ch. 18: ‘The Lord has restored us to friendship by his incarnation, being made the Mediator between God and man; both propitiating the Father for us, against whom we had sinned, and making amends for our disobedience; bestowing moreover upon us that conversation [conduct] and obedience which is due to our Maker.’ …What else is this than the obedience of Christ both active and passive, made ours by imputation and bestowal?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Justification: or The Disputatio de justitia habituali et actuali…, vol. 1 trans. Josiah Allport (d. 1641; London: Hamilton, 1844/1846), ch. 29</cite>, p. 254</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e00e8196c8" data-kw="">
<blockquote><p>For what the law could not do, in that it was weak through the flesh, God sending his own Son, in the likeness of sinful flesh, and for sin, condemned sin in the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bridge.html">William Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of Justification by Faith, Opened &amp; Applied from Rom. 3:24-25…’ in Works (London: Tegg, 1845), vol. 5, pp. 378-79 | By Christ’s redemption, the guilt of sin is taken away, and by his active obedience, the believing person is made completely righteous, in the sight of God; and although these always go together, yet are they to be distinguished one from the other: for as it is one thing to obey the command, and another to suffer the penalty, even so it is one thing to be fread from hell, by the merit of Christ’s death, and another thing to be entitled to heaven by the merit of his obedience, Rom. 8:3. Here we have the end and design of the Father’s sending of Christ asserted.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

<blockquote><p>5. Are we justified on account of the essential righteousness of Christ’s divine nature? XXIII. Fifth, it is asked whether the dikaioma [righteousness] on account of which we are justified is the essential righteousness of Christ’s divine nature. Andreas Osiander [a Lutheran], as we have often said, affirms it, because he rejected the procured righteousness of Christ, which nonetheless his son Lucas Osiander, a professor at Tübingen, does not acknowledge; at least it is certain that he has to reject it, from his hypotheses, because: (1) this essential righteousness of the divine nature, through its infinite value, would be so sufficient that it would make the other undoubtedly void. This is not even to mention that (2) the essential union of believers with Christ (which he presupposes) is blasphemous in not just one way, as we taught elsewhere (1.6.5 §XX). And (3) it is false that he is the Messiah only according to the divine nature. Moreover, (4) that the fellowship of that essential righteousness is understood (2 Peter 1:4), we have already shown to be absurd (cf. bk. 5, ch. 2 §XXII; ch. 18, §§XIV, XXXVI; ch. 5 of this book, §XX; likewise §XI of this chapter.) Nor does there remain anything that they may say for themselves, except that the righteousness on account of which we are justified is called the righteousness of God (Rom. 1:17; 3:21–22; 10:3; 2 Cor. 5:21; 2 Peter 1:1). To which we respond that: (1) the [Greek; dikaiosune theou], ‘the righteousness of God’, sometimes designates procured righteousness (James 1:20). (2) Christ’s procured righteousness is the righteousness of God, insofar as the one who procured it is the God man, and thus is God (Acts 20:28). (3) The procured righteousness of Christ is called the righteousness of God because it was constituted by God, and is admitted for us by God (Rom. 3:25; 2 Cor. 5:21). … XXV… Protestants, although they leave essential righteousness to Christ alone, as a prerequisite for his mediatorial function, yet affirm that the righteousness that was procured by his satisfaction and merit (insofar as they teach that on account of it we are delivered from our guilt and obtain the right to life) is altogether imputed to us, or transferred to our account.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’</cite>, p. 131</span></figcaption>

</figure><figure class="quote" id="q-95f67b534e" data-kw="">
<blockquote><p>Our justice or righteousness, that is, the justice or righteousness of the Gospel, whereby we are just in the sight of God, is not our conformity with the Law: but it is Christ’s satisfaction performed unto the Law for us, or the punishment, which He sustained for us, and so his whole humiliation (that is, his taking of flesh, his undertaking of servitude, penury, ignominy, and infirmity: his suffering of that bitter passion and death: all which He did undergo for us, but willingly) and that humiliation and satisfaction freely of God imputed unto us his faithful and believers. 1 Cor. 2:2, ‘I esteemed not to know anything among you, save Jesus Christ and Him crucified.’ Col. 2:10, ‘Ye are complete in Him.’ Rom. 5:19, ‘By the obedience of one shall many be made righteous.’ Isa. 53:5-6, ‘With his stripes we are healed. The Lord hath laid upon him the iniquity of us all.’ Now that Christ might perform obedience and satisfy for us, it behoved Him to be our Mediator, being by Himself just and holy, Heb. 7:26, ‘For such an High-Priest it became us to have, holy, harmeless, undefiled, separate from sinners, and made higher than the heavens.’ All these things are true perfectly and wholly in Christ. For He has perfectly fulfilled the Law for us: 1. by the holiness of his human nature. 2.by his obedience: for He became obedient unto the death, even the death of the cross: And the former fulfilling of the law, namely, the holiness of Christ’s human nature, was requisite for the other, even for his obedience. This obedience and satisfaction of Christ is our satisfaction, and our proper iustice, for which we please God, for which we are received into favor with God the Father, and which is imputed unto us. That former fulfilling of the Law is indeed imputed also unto us, namely the humiliation and justice or righteousness of Christ’s human nature, that we may be reputed holy before God: but this holiness of Christ is imputed unto us for his obedience or satisfaction sake: because He satisfied for us God’s justice, in sustaining eternal punishment and pains, which we should have sustained everlastingly. Hence is it, that the effusion of Christ’s blood (as being the complement and consummation of Christ’s satisfaction) is only said to be our justice and righteousness. 1 Jn. 1:7, ‘The blood of Jesus Christ cleanseth us from all sin,’ that is, not only from that which is past, but also from that which is to come. … 5. How Christ’s satisfaction is made our justice and righteousness: This question is adjoined because it seems absurd that we should be justified by that which is another man’s, and not ours. The satisfaction or justice of Christ is made ours, or applied unto us, two ways, that is, by a double application. The former application is God’s, who in respect of that fulfilling of the Law performed by Christ, accepts us, and applies the same unto us; that is, He imputes it, no less than if we had never sinned, or at least had paid and suffered sufficient punishment for our sins. For albeit to justify signifies to make just, yet in the Church it signifies another thing, and is taken in another sense. Or God does apply it, when He imputes the fulfilling of the Law performed by Christ unto us, even as if it were performed by us, neither will at all punish us. But to impute, is, to accept Christ’s satisfaction, performed to this end, that it might be our justice and righteousness. We then also apply unto us the fulfilling of the Law performed by Christ, when we are steadfastly persuaded, that God does impute, apply and give it unto us, and for it reputes us for just, absolving us from all guilt… That which we have now spoken of both applications, both God’s, and ours, does manifestly show what is meant in this place by justifying: Which is, that, to justify, is not to make one just who is uniust: but to repute him for just and righteous who is uniust, and to absolve the unjust and unrighteous from all guilt, and not to punish him, and this for another’s justice and righteousness imputed by faith unto us.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Our justice or righteousness, that is, the justice or righteousness of the Gospel, whereby we are just in the sight of God, is not our conformity with the Law: but it is Christ’s satisfaction performed unto the Law for us, or the punishment, which He sustained for us, and so his whole humiliation (that is, his taking of flesh, his undertaking of servitude, penury, ignominy, and infirmity: his suffering of that bitter passion and death: all which He did undergo for us, but willingly) and that humiliation and satisfaction freely of God imputed unto us his faithful and believers. 1 Cor. 2:2, ‘I esteemed not to know anything among you, save Jesus Christ and Him crucified.’ Col. 2:10, ‘Ye are complete in Him.’ Rom. 5:19, ‘By the obedience of one shall many be made righteous.’ Isa. 53:5-6, ‘With his stripes we are healed. The Lord hath laid upon him the iniquity of us all.’ Now that Christ might perform obedience and satisfy for us, it behoved Him to be our Mediator, being by Himself just and holy, Heb. 7:26, ‘For such an High-Priest it became us to have, holy, harmeless, undefiled, separate from sinners, and made higher than the heavens.’ All these things are true perfectly and wholly in Christ. For He has perfectly fulfilled the Law for us: 1. by the holiness of his human nature. 2.by his obedience: for He became obedient unto the death, even the death of the cross: And the former fulfilling of the law, namely, the holiness of Christ’s human nature, was requisite for the other, even for his obedience. This obedience and satisfaction of Christ is our satisfaction, and our proper iustice, for which we please God, for which we are received into favor with God the Father, and which is imputed unto us. That former fulfilling of the Law is indeed imputed also unto us, namely the humiliation and justice or righteousness of Christ’s human nature, that we may be reputed holy before God: but this holiness of Christ is imputed unto us for his obedience or satisfaction sake: because He satisfied for us God’s justice, in sustaining eternal punishment and pains, which we should have sustained everlastingly. Hence is it, that the effusion of Christ’s blood (as being the complement and consummation of Christ’s satisfaction) is only said to be our justice and righteousness. 1 Jn. 1:7, ‘The blood of Jesus Christ cleanseth us from all sin,’ that is, not only from that which is past, but also from that which is to come. … 5. How Christ’s satisfaction is made our justice and righteousness: This question is adjoined because it seems absurd that we should be justified by that which is another man’s, and not ours. The satisfaction or justice of Christ is made ours, or applied unto us, two ways, that is, by a double application. The former application is God’s, who in respect of that fulfilling of the Law performed by Christ, accepts us, and applies the same unto us; that is, He imputes it, no less than if we had never sinned, or at least had paid and suffered sufficient punishment for our sins. For albeit to justify signifies to make just, yet in the Church it signifies another thing, and is taken in another sense. Or God does apply it, when He imputes the fulfilling of the Law performed by Christ unto us, even as if it were performed by us, neither will at all punish us. But to impute, is, to accept Christ’s satisfaction, performed to this end, that it might be our justice and righteousness. We then also apply unto us the fulfilling of the Law performed by Christ, when we are steadfastly persuaded, that God does impute, apply and give it unto us, and for it reputes us for just, absolving us from all guilt… That which we have now spoken of both applications, both God’s, and ours, does manifestly show what is meant in this place by justifying: Which is, that, to justify, is not to make one just who is uniust: but to repute him for just and righteous who is uniust, and to absolve the unjust and unrighteous from all guilt, and not to punish him, and this for another’s justice and righteousness imputed by faith unto us.”

ite+for+the+other%2C+even+for+his+obedience.+This+obedience+and+satisfaction+of+Christ+is+our+satisfaction%2C+and+our+proper+iustice%2C+for+which+we+please+God%2C+for+which+we+are+received+into+favor+with+God+the+Father%2C+and+which+is+imputed+unto+us.+That+former+fulfilling+of+the+Law+is+indeed+imputed+also+unto+us%2C+namely+the+humiliation+and+justice+or+righteousness+of+Christ%E2%80%99s+human+nature%2C+that+we+may+be+reputed+holy+before+God%3A+but+this+holiness+of+Christ+is+imputed+unto+us+for+his+obedience+or+satisfaction+sake%3A+because+He+satisfied+for+us+God%E2%80%99s+justice%2C+in+sustaining+eternal+punishment+and+pains%2C+which+we+should+have+sustained+everlastingly.+Hence+is+it%2C+that+the+effusion+of+Christ%E2%80%99s+blood+%28as+being+the+complement+and+consummation+of+Christ%E2%80%99s+satisfaction%29+is+only+said+to+be+our+justice+and+righteousness.+1+Jn.+1%3A7%2C+%E2%80%98The+blood+of+Jesus+Christ+cleanseth+us+from+all+sin%2C%E2%80%99+that+is%2C+not+only+from+that+which+is+past%2C+but+also+from+that+which+is+to+come.+%E2%80%A6+5.+How+Christ%E2%80%99s+satisfaction+is+made+our+justice+and+righteousness%3A+This+question+is+adjoined+because+it+seems+absurd+that+we+should+be+justified+by+that+which+is+another+man%E2%80%99s%2C+and+not+ours.+The+satisfaction+or+justice+of+Christ+is+made+ours%2C+or+applied+unto+us%2C+two+ways%2C+that+is%2C+by+a+double+application.+The+former+application+is+God%E2%80%99s%2C+who+in+respect+of+that+fulfilling+of+the+Law+performed+by+Christ%2C+accepts+us%2C+and+applies+the+same+unto+us%3B+that+is%2C+He+imputes+it%2C+no+less+than+if+we+had+never+sinned%2C+or+at+least+had+paid+and+suffered+sufficient+punishment+for+our+sins.+For+albeit+to+justify+signifies+to+make+just%2C+yet+in+the+Church+it+signifies+another+thing%2C+and+is+taken+in+another+sense.+Or+God+does+apply+it%2C+when+He+imputes+the+fulfilling+of+the+Law+performed+by+Christ+unto+us%2C+even+as+if+it+were+performed+by+us%2C+neither+will+at+all+punish+us.+But+to+impute%2C+is%2C+to+accept+Christ%E2%80%99s+satisfaction%2C+performed+to+this+end%2C+that+it+might+be+our+justice+and+righteousness.+We+then+also+apply+unto+us+the+fulfilling+of+the+Law+performed+by+Christ%2C+when+we+are+steadfastly+persuaded%2C+that+God+does+impute%2C+apply+and+give+it+unto+us%2C+and+for+it+reputes+us+for+just%2C+absolving+us+from+all+guilt%E2%80%A6+That+which+we+have+now+spoken+of+both+applications%2C+both+God%E2%80%99s%2C+and+ours%2C+does+manifestly+show+what+is+meant+in+this+place+by+justifying%3A+Which+is%2C+that%2C+to+justify%2C+is+not+to+make+one+just+who+is+uniust%3A+but+to+repute+him+for+just+and+righteous+who+is+uniust%2C+and+to+absolve+the+unjust+and+unrighteous+from+all+guilt%2C+and+not+to+punish+him%2C+and+this+for+another%E2%80%99s+justice+and+righteousness+imputed+by+faith+unto+us.%E2%80%9D%0A%0A%E2%80%94+Zacharias+Ursinus%2C+The+Sum+of+Christian+Religion%3A+Delivered%E2%80%A6+in+his+Lectures+upon+the+Catechism%E2%80%A6+tr.+Henrie+Parrie+%28Oxford%2C+1587%29%2C+%E2%80%98Of+Justification%E2%80%99%2C+4+What+is+our+iustice+%26+5+How+Christ%E2%80%99s+satisfaction+is+made+our+justice+and+righteousness%2C+pp.+680-82&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F95f67b534e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/95f67b534e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=Our%20justice%20or%20righteousness%2C%20that%20is,righteousness%20imputed%20by%20faith%20unto%20us&amp;text=Our%20justice%20or%20righteousness%2C%20that%20is%2C%20the%20justice&amp;text=justice%20and%20righteousness%20imputed%20by%20faith%20unto%20us" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>15. Did Christ redeem us only by his passive righteousness? The difference of opinions XXXVII. Fifteenth, it is asked whether Christ redeemed us only by his passive righteousness, or in addition also his active righteousness. Johannes Piscator, otherwise an outstanding theologian, together with several others, because they thought that the necessity of passive righteousness and death would be abolished if it were stated that in our place he most exactly kept the divine law, because one who kept the law exactly could not be punished with death, chose the prior. Protestants commonly prefer the latter, and certainly correctly, but not all in one way. Some divide the passive and active righteousness of Christ in such a way that only by his passive righteousness did he satisfy in our place for the law that was not observed, and by it delivered us only from the guilt of punishment, and likewise, only by his active righteousness did he keep the law perfectly in our place, and by keeping it, acquire for us the right of eternal life. Others, with that more subtle division laid aside, prefer to state that Christ devoted both these kinds of righteousness to us, to the end that he might satisfy for the divine law that was not observed by us, and by satisfying, also merit for us the right of life, in such a way that by this satisfaction he at the same time delivered us from every evil and gained the right of every good. The difficulties raised by Piscator are removed We have adduced the reasons for this view in §XX: with them presupposed, it is not so difficult to respond to the difficulties raised by Piscator. For if (1) it should be alleged that the law demands nothing but one or the other, either obedience or punishment, we will respond that the law, first from man in his integrity, demands only obedience under threat of punishment, but from the sinner, it demands punishment for past sin and obedience in the future, because punishment cannot deliver from the obedience owed to God. Wherefore the Redeemer had to supply both. If (2) it should be alleged that the necessity and use of the death and passive righteousness are removed when he has most fully kept the law on our behalf, we will respond that it is by no means removed, because both kinds of righteousness were necessary for him to satisfy for the injury we inflicted upon the divine majesty and his law, and in satisfying, to merit for us the right of eternal life. If (3) it should be alleged that Scripture refers the consummation of our salvation to his one and only sacrifice accomplished on the cross, we will respond that by that sacrifice is understood by synecdoche his entire satisfaction, the outstanding part of which his death on the cross supplied, just as by the same synecdoche, the blood of Christ designates the same satisfacation (1 John 1:7; Acts 20:28). If one should proceed (4) to allege that obedience was necessary for his own self as a man, and thus could not be expended for us, we will respond that (a) the obedience, insofar as it resulted from the God-man, was not necessary for him, because the law obligates not the God-man to obedience, but a mere man; (b) that obedience of the God-man is of infinite value, whereby it was able to suffice both for himself and for us, because an obedience greater than infinite could not be demanded or supplied for him, or at the same time for us.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-93bcfc0f7e" data-kw="">
<blockquote><p>And so judgement-like is [men’s] withdrawing [from God], and smells so of vengeance, that God plagues withdrawing with withdrawing: Hos. 5:4, ‘They will not frame their doings to turn unto their God.’ And what is the issue of that? ‘They shall go with their flocks and herds to seek the Lord, but they shall not find Him; for He hath withdrawn Himself from them.’ Prov. 1:24, ‘I called, and ye refused;’ Verse 26, then this must follow, verse 28 (as also Jn. 8:21, the like is) ‘they shall call upon Me, but I will not answer.’ Use 6. It’s a terrible plague of God, which we would eschew as hell, to wit, provoking of God by such sins as may procure that God should in his judgement mar the lock of the heart, the will, that the door should neither shut nor open; and cast poison into the soul, so as angels and men, heaven and earth cannot help or cure it: Christ is good at opening hearts, and drawing sinners; and He is as good at judicial closing of hearts: If He but put his finger in the eye, and snap in pieces the optic nerves, all the world cannot restore sight, or open the heart. He that is nearest to be drawn to Christ, and yet never drawn, is deepest in hell: An evangelic-fire of God’s fury is worse than a Sinai-fire, though it burn up to mid-heaven:

1. Sinning against the light of nature and the known will of God, as idolatry and the principles of your own religion, true and known to be so, brings delivering up to judicial blindness, Rom. 1:21.

2. If ye put your finger in nature’s eye, and blow out that candle, God will give you up to vile affections, Rom. 1:24 and a reprobate mind, vv. 26-28. Some blow out the candle of nature, and God blows out the sun of the Gospel, that it is to them like sack-cloth of hair, and a moon like blood.

3. Resisting of the call of God, brings on the plague of hardness of heart; Pro. 1:24-27; Acts 28:23-27; Jn. 8:21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, ... (London, 1647), pp. 332-3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f02898842e" data-kw="">
<blockquote><p>Sept, 17, 1585 Lyttis of the deacons [servants] elected. Henry Nesbet and William Nesbet, bailies, Nicoll Uddert, Dean of Guild, James Ros, Thesaurer [Treasurer], William Littill, Androw Sclater, George Smyth, Tailor [Jailor?], of the Council, and Jhonn Stevinsoun, deykin [deacon/servant?] of the weavers, remembering that since the beginning of this present pestilence they have remained within this burgh constantly, sustained the burdening of the offices laid upon them unto this hour, with the loss and death for the most part of diverse of their children, servants, and family, and not without the extreme danger of their own lives, most eminently known unto all men, the rest of their brethren of the council and deykins [deacons/servants], which were no less astricted, oblist [obliged], and sworn to assist and take care of this commonwealth, having deserted their places and forsaken their offices, contrary to their oaths and allegiance made and given, and yet continuing has not repaired to this burgh at this most necessary time, approached and appointed to convene and surrogate others in their room, whereby the whole estate of this burgh is appearing to fall in confusion; Therefore…</p></blockquote>

<blockquote><p>In the siege of Leyden we have a thrilling example of their sufferings and heroism. Three months after the commencement of the siege the food-supply was exhausted. A fearful famine began to rage. For seven weeks the inhabitants had no bread to eat and multitudes perished of hunger. On the heels of the famine came the plague or black death, which carried off a third part of the citizens. The apparently doomed survivors subsisted on dogs and cats. To the summons to surrender, they replied: ” As long as you hear the mew of a cat or the bark of a dog you may know that the city holds out. And when all have perished but ourselves, we will devour our left arms, retaining our right to defend our women, our liberty, and our religion against the foreign tyrant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/netherlands-leiden.html">Egbert Watson Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Creed of the Presbyterians</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-888559a1bd" data-kw="">
<blockquote><p>It’s now high time that every crime be brought to punishment: Wrath long contained, and oft refrained, at last must have a vent. Justice severe cannot forbear to plague sin any longer; But must inflict with hand most strict mischief upon the wronger. … Eternal smart is the desert ev’n of the least offence; Then wonder not if I allot to you this recompence: But wonder more that, since so sore and lasting plagues are due To every sin, you liv’d therein, who well the danger knew. .. Die feign they would, if die they could but death will not be had; God’s direful wrath their bodies hath for ev’r immortal made. They live to lie in misery. and bear eternal woe: And live they must whil’st God is just, that He may plague them so. … O love the Lord, all ye his saints, who hath Redeemed you from everlasting wrath: Who hath by dying made your souls to live, And what He dearly bought doth freely give. Give up your selves to walk in all his ways, And study how to live unto his praise. The time is short you have to serve Him here: The day of your deliverance draweth near. Lift up your heads, ye upright ones in heart, Who in Christ’s Purchase have obtain’d a part; Behold! He rides upon a shining cloud, With angel’s voice, and trumpet sounding loud. He comes to save his folk from all their foes, And plague the men that holiness oppose. So come, Lord Jesus, quickly come we pray, Yea come and hasten our Redemption Day.</p></blockquote>

<blockquote><p>…external and vocal preaching, and a visible administration of the sacrament in such an orderly way, as Christ has instituted, is an external ruling of Church members according to the law of Christ as King, an external ordaining of the worship, is an external ordering of the worshippers according to the acts of worship thus ordered, as sense teaches us: but the external ordaining of the worship, to preach, this, not this, to celebrate [the sacrament] in both kinds [bread and wine], by prayer and the words of institution, and not in one kind only [a wafer, as the Papists], is an external ordering of God’s worship: therefore as kings cannot administrate the sacraments, nor preach, so neither can they have the external government of the Church in their hands. … 2… John Reynolds [the English puritan] answers [the fore-stated Popish and Erastian opinion] that, from two offices [of external government and inward, spiritual government] of the head [Christ], which is to give life and influence of motion to the members, and also to guide and moderate the actions external of the body [the Church], we cannot make two heads [the king for the outward and Christ for the inward, as in Anglicanism]; and because the king has some civil government about the Church, we cannot make two heads over the Church, Christ one, and the King another under him. [Reynolds is saying, Rutherford approving, that because the king, on presbyterianism, rightfully has ‘some civil government about the Church’, it does not follow that the king is therefore a head of the Church, under Christ or otherwise. If the king legitimately ruled in sacra, in sacred things, this would be the case; but he does not, and it cannot be the case.]

3. This [Erastian Anglican tenet] is Anabaptistical; for because the visible government of the Church is external, we are not to cut off all necessity of the ministry to feed and rule with ecclesiastical authority, and because the prince is gifted and a Christian, to give all to him, for a calling there must be from God, for the king to govern the Church of Christ by laws, and prescribing external worship therein, for Christ has left, Eph. 4; 1 Cor. 12; 1 Tim. 3; men to be feeders and governors of his Church by office, whose it is to be answerable for souls, Heb. 13:18.

4. It is tyrannical, because [1.] it puts power into the magistrate’s hand to take from the Church, that inbred and intrinsic power of external and visible government over herself and members, which all civil incorporations by instinct of nature have, and the magistrate, as such, not being a member of the Church has [would have] a headship, even being a heathen magistrate, over the redeemed body of Christ. 2. By this reason, the Lord Jesus as King has no pastors in his name to use the laws of his kingdom, by binding and loosing; for discipline being an external thing, (say they) is not a part of Christs kingly power, but the King as Christ’s civil vicar has this power [which Rutherford denies]…</p></blockquote>

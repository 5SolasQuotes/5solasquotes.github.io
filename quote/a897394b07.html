<main class="wrap"><figure class="quote" id="q-a897394b07" data-kw="">
<blockquote><p>That they acknowledged the king to be the only supreme governor in this kingdom, over all persons and in all causes… and that at their utmost power they should defend, assist and maintain his majesty’s jurisdiction foresaid against all deadly, and never to decline his majesty’s power and jurisdiction by this their oath upon the holy evangel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-4a9d17945f" data-kw="">
<blockquote><p>There was also a paper, entitled An information against Mr Renwick’s party, given in to ministers… the papers had been left by Alexander Gordon… There was nothing on the face of the ‘information’ paper to suggest that it had not been compiled by the Carrick men themselves, but the style and substance of it pointed directly to Robert Langlands… The Societies, it charged… had imposed restrictions on ministers and cast off the whole suffering ministry… they had made ‘canons’ laying down the qualifications of those fitted to be members of their meetings, forbidding association with those they regarded as unfaithful, even to the extent of servants joining in family worship with their masters, or children with their parents;¹ and, not least, they had ‘cast off most part of the societies in the shires of Ayr and Galloway, chiefly upon these two heads, that they would not disown and condemn the [civil] declaration published by Argyle, and because they were clear to call and hear faithful suffering ministers’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preacher to the Remnant: The Story of James Renwick (Blue Banner Productions, 2009)</cite>, p. 137</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Saints by profession are bound to maintain an holy fellowship and communion in the worship of God, and in performing such other spiritual services as tend to their mutual edification; which communion as God offers opportunity, is to be extended to all those who in every place call upon the name of the Lord Jesus.</p></blockquote>

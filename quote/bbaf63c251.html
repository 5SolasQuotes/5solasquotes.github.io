<main class="wrap"><figure class="quote" id="q-bbaf63c251" data-kw="">
<blockquote><p>Without any fallacy or ambiguity, this state does not involve the certainty of divine faith; because Bellarmine does not distinguish between the levels of certainty with respect to principles that are directly revealed and the conclusions clearly drawn from them, and between the certainty of faith itself and that which comes from faith, either in perception or hope. But with these distinctions understood, we accept this question and will defend the affirmative against the negative of the Papists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘On Justifying Faith’, pt. 1, pp. 142-45, 171-75 Latin | CXL. Then, in agreement with the British theologians in this matter, Ames clearly shows his perspective in words that the learned man cites to support his argument. Bellarmine had defined the question of the certainty one can or should have of their justification and the forgiveness of their sins—if it is established without fallacy or ambiguity—as whether one can or should be as certain, without special revelation, of the forgiveness of their sins as they are of any divinely revealed truth. Ames responds:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span></div>

</figure><figure class="quote" id="q-d0b90c6748" data-kw="">
<blockquote><p>This infallible assurance doth not so belong to the essence of faith, but that a true believer may wait long, and conflict with many difficulties before he be partaker of it: yet, being enabled by the Spirit to know the things which are freely given him of God, he may, without extraordinary revelation, in the right use of ordinary means, attain thereunto. And therefore it is the duty of everyone to give all diligence to make his calling and election sure, that thereby his heart may be enlarged in peace and joy in the Holy Ghost, in love and thankfulness to God, and in strength and cheerfulness in the duties of obedience, the proper fruits of this assurance; so far is it from inclining men to looseness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 18.3</span></figcaption>

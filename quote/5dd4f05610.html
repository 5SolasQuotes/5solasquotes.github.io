<blockquote><p>CHAP. XVI. Of the Covenant of Works. Righteousness thus set forth in his several parts and branches, has of God’s free goodness a reward belonging to it, (whereupon the same called the Law, or covenant of works;) as contrariwise a punishment in his Justice to those that sin against it: both more or less, as the righteousness or sin abounds. The reward is blessedness, which is the having of all things that make the creature happy, and stands in the fruition of God’s love, or, from thence coming, a conjunction and communion with him. Conjunction is the enjoying of his personal presence. Communion is a participation (in some sort) of his blessedness both kingdom power and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dudley-fenner.html">Dudley Fenner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sacred Doctrine of Divinitie</cite>, (London, 1599, repr. 1613), 9. [Spelling modernized]</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-242b7b10a2" data-kw="natural symbolic law">
<blockquote><p>The duty was partly general, partly special (according to the twofold law given to him: the moral or natural and the symbolic). The general was the knowledge and worship of God, justice towards his neighbor and every kind of holiness; the special was abstinence from the forbidden fruit (in which obedience to the whole law was contained as in a compendium and specimen). The former was founded on the law of nature not written in a book, but engraven and stamped upon the heart of man; the latter upon a symbolic and positive law, added to the natural for the trial of his obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.3.12</span></figcaption>

<blockquote><p>XXXIII. And the thing speaks for itself, For, as there is a covenant between the Father and the Son; “when thou shalt make his soul (if the soul of the Son shall devote himself) an offering for sin,” Is. 53:10, upon performing the condition, the Son acquired a right to the reward, and so has a merit according to the covenant. Nay, as it is not the obedience of a mere man, but of Christ, God-man, an infinite person, it is also of an infinite value, consequently bears the justest proportion to the greatest corresponding glory; and thus far it is a merit of condignity, as it is called; such as no mere creature is capable to acquiring.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity</cite>, trans. William Crookshank, vol. 1 (London: T. Tegg &amp; Son, 1837), vol. 1. 162 (2.3.33).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“XXXIII. And the thing speaks for itself, For, as there is a covenant between the Father and the Son; “when thou shalt make his soul (if the soul of the Son shall devote himself) an offering for sin,” Is. 53:10, upon performing the condition, the Son acquired a right to the reward, and so has a merit according to the covenant. Nay, as it is not the obedience of a mere man, but of Christ, God-man, an infinite person, it is also of an infinite value, consequently bears the justest proportion to the greatest corresponding glory; and thus far it is a merit of condignity, as it is called; such as no mere creature is capable to acquiring.”

</figure><figure class="quote" id="q-7f6f7dd38c" data-kw="">
<blockquote><p>With regard to the covenant itself, we must observe, what was the duty required by God; what was the promise made to the performance of that duty; what was the threat denounced against the neglect of it. Now the duty consisted in all that knowledge of God which could be derived from contemplating the divine work, and from revelation, as much as could be acquired by a perfectly upright mind; but especially in obedience to the law of God, both the natural law, which was engraven on man’s heart, and any special commandments, which God might choose to impose (such as was the command to abstain from the fruit of the tree of the knowledge of good and evil;) in short, such an obedience was required, as was true and sincere (having respect not merely to some, but to all and each of God’s commands) constant and persevering, perfect and complete in all its parts. Moreover, man had sufficient power given him by his Creator to perform this obedience. The threatening denounced against the neglect of this obedience, was death, (Gen. 2:17,) by which we understand the death of the body, (Gen. 3:19,) together with all the miseries and calamities of life preceding; the death of the soul, on its separation from God, and from communion with him, (Ephes. 3:1,) and eternal death, consisting of the most dreadful torments both of soul and body. With regard to the promise of the covenant, though it is not expressly laid down, it is sufficiently clear from the threatening of death, which is opposed to it; for although God owes nothing to his creature, yet as the whole scripture sets him forth to us as slow to anger and abundant in mercy, it is not at all probable, that God denounced upon man the threat of eternal punishment, and at the same time gave him no promise. But if any one wonder why God should speak about punishment, and be silent concerning reward, we may give this as the probable reason of it, viz. that innocent Adam needed to have distinct mention made to him both of sin forbidden, and of death its consequence, seeing that in his upright state he was ignorant of death and sin, but it was not so necessary to make mention to him of the life which was to be bestowed upon him, on condition of his persevering in holiness; for he already enjoyed a most blessed life, from which he could very easily judge of the life that was to come. We must therefore form a judgment of the reward, from the punishment, and therefore, as the former comprehended all evil, especially eternal death, so the latter contained all that was good, particularly eternal life, and the most intimate communion with God in unchangeable holiness. This is further confirmed from the covenant of nature being the same as the covenant of works, as we shall see hereafter. Now the covenant of works promised eternal life, saying, “Do this, and live.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (Philadelphia: Presbyterian Board of Publication, n.d.), 140–41.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-d30289b10e" data-kw="">
<blockquote><p>The Covenant of Works, wherein God covenanted with man to give him eternal life upon condition of perfect obedience in his own person. The Covenant of Grace, which God made with man promising eternal life upon condition of believing…This Covenant [of works] God made with man without a Mediator for there needed no no middle person to bring man into favor and friendship with God, because man did bear the image of God, and had not offended: nor to procure acceptance to man’s service because it was pure and spotless. God did love man being made after his Image and promised to accept of his obedience performed freely, willingly, entirely, according to his Commandment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (London, 1645), 8, 9.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Covenant of Works, wherein God covenanted with man to give him eternal life upon condition of perfect obedience in his own person. The Covenant of Grace, which God made with man promising eternal life upon condition of believing…This Covenant [of works] God made with man without a Mediator for there needed no no middle person to bring man into favor and friendship with God, because man did bear the image of God, and had not offended: nor to procure acceptance to man’s service because it was pure and spotless. God did love man being made after his Image and promised to accept of his obedience performed freely, willingly, entirely, according to his Commandment.”

<blockquote><p>3rd Distinction. It is one thing to receive ordination from a Prelate lawfully and another thing to receive lawful ordination. The former we deny; ministers sin who receive ordination from a prelate, as they sin who receive baptism from the Romish Church; yet is the ordination lawful and valid, because prelacy, though different in nature from the office of a true pastor, is consistent in the same subject with the pastor’s office.</p></blockquote>

</figure><figure class="quote" id="q-6af922f56b" data-kw="">
<blockquote><p>Papists hold fundamentals, and so do Jews hold all the Old Testament, and Papists hold both New and Old, but we know they so hold fundamentals that by their doctrine they overturn them; and though there be fundamentals taught in the Popish Church which may save if they were believed, yet they are not a true and ministerial Church simply, because, though they teach that there is one God, they teach also there is a thousand Gods whom they adore, and though they teach [that] there is one Mediator, yet do they substitute infinite Mediators with and besides Christ, so that the truth is, not a formal, ministerial and visible active external calling is in the Church of Rome, as it is a visible Church, in the which we can safely remain, though fundamentals be safe in Rome, and the books of the Old and New Testament be there, yet are they not there ministerially as in a mother whose breasts we can suck; for fundamental points falsely exponed, cease to be fundamental points; yea as they be ministerially in Rome, they be destructive of the foundation, though there be some ministerial acts valid in that Church, for the which the Church of Rome is called a true Church, [in Greek], in some respect, according to something essential to the true Church, yet never sine adjecto [without the adjunct], as if it were a true Church where we can worship God. Fundamentals are safe in Rome materially in themselves, so as some may be saved who believe these fundamentals; but fundamentals are not safe in Rome, Ecclesiastice, Ministeraliter, Pastoraliter [ecclesiastically, ministerially, pastorally], in a Church way, so as by believing these from their chairs so exponed, they can be saved who do believe them.</p></blockquote>

</figure><figure class="quote" id="q-824010ec1c" data-kw="">
<blockquote><p>I answer that [if] the true Church was only at Jerusalem radically [during the time Israel was divided in the O.T.], as you [the Separatist John Robinson] say, [then it] would import that the 10 Tribes revolting from David’s house ceased to be a Church, which is false: [1.] Israel, though all the land were in Covenant with God, had circumcision and the Passover, and so were a true visible Church, even when they did meet in their synagogues. The altar, sacrifices, Temple, are not the essentials of a visible Church; they were a Church and did pray toward the Temple even in Babylon, and were to profess the true God before the heathen, Jer. 10:11. 2. There be typical reasons to hinder men why they cannot be capable of the priesthood [1 Kings 12:31], that did not exclude them from Church-state; but this hinders not but if the seals administered by a minister be true seals, then is the minister thereof catenus, insofar, a true minister.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (1644), | pt. 1, p. 236</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a></span></div>

</figure><figure class="quote" id="q-3068990442" data-kw="">
<blockquote><p>Question 2. May a Papist or a heretic by his knowledge be a lover of God as God? Answer: What is said to the former question is here to be reviewed. And further: 1. A Papist and such heretic as positively holds all the essentials of Christianity, and sees not the opposition of his false opinions hereto, and holds Christianity more practically than those false opinions, may be saved in that state, for he is a lover of God: But no other Papists or heretics can be saved but by a true conversion. 2. There is a sufficiency in the doctrine of Christianity which they hold, to save them, as to objective sufficiency. And that God gives not subjective grace (of sanctification) to any such, notwithstanding their errors, is a thing that no man can prove, nor any sober charitable Christian easily believe: And experience of the piety of many makes it utterly improbable, though we know not certainly the heart of another. There are many murmurings against me in this city (behind my back: for never one man of them to my remembrance to this day, did ever use any charitable endeavor to my face to convince me of my supposed error) as one that holds that a Papist may be saved, yea, that we are not certain that none in the world are saved besides Christians; and the sectaries whisper me to one another to be like Origen, a person in these dangerous opinions, forsaken of God, in comparison of them: What really I assert about these questions, I have here briefly hinted, but more largely opened in my Catholick Theology: But I will confess that I find no inclination in my soul to desire that their doctrine may prove true, who hide the glorified love of God, and would contract his mercy and man’s salvation into so narrow a room as to make it hardly discernable by man, and the Church to be next to no Church, and a Savior to save so very few, as seem scarce considerable among the rest that are left remediless. And who would make us believe that the way appointed to bring men to the love of God is to believe that He has elected that particular person, and left almost all the world (many score or hundreds to one) unredeemed, and without any promise or possibility of salvation: I am sure that the Covenant of Innocency [of Works] is ceased; and I am sure that all the world was brought under a Law of Grace made after the fall to Adam and Noah: and that this Law is still in force to those that have not the more perfect edition in the Gospel. And that Christ came not to bring the world that never hear of Him, nor can do, into a worse condition than Jews and Gentiles were in before: nor has He repealed that Law of Grace which He before made them; nor has God changed that gracious Name which he proclaimed even to Moses, Ex. 34:6-7. And I am sure that Abraham, the father of the faithful, conjectured once, even when God told him that Sodom was ripe for destruction, that yet there might be fifty righteous persons in it; by which we may conjecture what he thought of all the world (read Mal. 1:14 with all the old translations in the polyglot Bible, and consider it). And I know that in every nation he that fears God and works righteousness is accepted of Him [Acts 10:35]; and that he that comes to God must believe that God is, and that He is the rewarder of them that diligently seek Him, and therefore without faith none can please God: And that men shall be judged by that same law which they were under and obliged by, whatever it be. And they that have sinned under the Law (of Moses) shall be judged by it; and they that sinned without that Law shall be judged without it. And I know that God is love itself and infinitely good; and will show us his goodness in such glorious effects to all eternity as shall satisfy us and fill us with joyful praise: And as for the Papists, I know that they are seduced by a worldly clergy, and that by consequence many of the errors in that Church do subvert the fundamentals; and so do many errors of the antinomians and others among us that are taken for religious persons; yea and as notoriously as any doctrines of the Popish councils do: But I know that as a logical faith or orthodoxness, which consists in holding right notions and words, deceives thousands that have no sound belief of the things themselves expressed by these words; So also logical errors about words, notions and sentences, may in unskilful men consist with a sound belief of the things which must necessarily be believed. And that Christ and grace may be thankfully received by many that have false names and notions, and sayings about Christ and grace. And I know the great power of education and converse, and what advantage an opinion has even with the upright, which is commonly extolled by learned, godly, religious men, especially if by almost all. Therefore I make no doubt but God has many among the Papists and the Antinomians (to name no others) who are truly godly, though they logically or notionally hold such errors as if practically held would be their damnation, and if the consequents were known and held: Much more when thousands of the common people, hold not the errors of the Church which they abide in. And it shall not be my way of persuading my own soul or others to love God, by first persuading them that He loves but few besides them. And when such have narrowed God’s love and mercy to all save their own party, and made themselves easily believe that He will damn the rest of the world, even such as are desirous to please God as they are, they have but prepared a snare for their own consciences, which may perhaps, when it is awakened, as easily believe that He will damn themselves. Let us give all diligence to make our own calling and election sure, and leave others to the righteous God, to whose judgment they and we must stand or fall. Who art thou that judgest anothers servant [Rom. 14]? As the [Mosaic] Covenant of Peculiarity was made only with the Israelites, though the Common Law of Grace (made to Adam and Noah) was in force to other nations of the world; So the more excellent Covenant of Peculiarity is since Christ’s incarnation made only with the Christian Church, though the foresaid Common Law of Grace be not repealed to all others: Nor can it be said that they sin not against a Law of Grace; or mercy leading to repentance. And as the Covenant of Peculiarity was not repealed to the ten [Northern] tribes (though the benefits were much forfeited by their violation), but God had still thousands among them in Elijah’s time that bowed not the knee to Baal, and such as Obadiah to hide the prophets; though yet the Jews were the more orthodox: Even so though the Reformed Churches, as the two tribes, stick closer to the truth, the kingdoms where Popery prevails, have yet many thousands that God will save; and notwithstanding their errors and corrupt additions, they have the same articles of Faith and Baptismal Covenant as we. And if any man think himself the wiser or the happier man than I, for holding the contrary, and thinking so many are hated of God more than I do (and consequently rendering Him less lovely to them), I envy not such the honor nor comfort of their wisdom.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Question 2. May a Papist or a heretic by his knowledge be a lover of God as God? Answer: What is said to the former question is here to be reviewed. And further: 1. A Papist and such heretic as positively holds all the essentials of Christianity, and sees not the opposition of his false opinions hereto, and holds Christianity more practically than those false opinions, may be saved in that state, for he is a lover of God: But no other Papists or heretics can be saved but by a true conversion. 2. There is a sufficiency in the doctrine of Christianity which they hold, to save them, as to objective sufficiency. And that God gives not subjective grace (of sanctification) to any such, notwithstanding their errors, is a thing that no man can prove, nor any sober charitable Christian easily believe: And experience of the piety of many makes it utterly improbable, though we know not certainly the heart of another. There are many murmurings against me in this city (behind my back: for never one man of them to my remembrance to this day, did ever use any charitable endeavor to my face to convince me of my supposed error) as one that holds that a Papist may be saved, yea, that we are not certain that none in the world are saved besides Christians; and the sectaries whisper me to one another to be like Origen, a person in these dangerous opinions, forsaken of God, in comparison of them: What really I assert about these questions, I have here briefly hinted, but more largely opened in my Catholick Theology: But I will confess that I find no inclination in my soul to desire that their doctrine may prove true, who hide the glorified love of God, and would contract his mercy and man’s salvation into so narrow a room as to make it hardly discernable by man, and the Church to be next to no Church, and a Savior to save so very few, as seem scarce considerable among the rest that are left remediless. And who would make us believe that the way appointed to bring men to the love of God is to believe that He has elected that particular person, and left almost all the world (many score or hundreds to one) unredeemed, and without any promise or possibility of salvation: I am sure that the Covenant of Innocency [of Works] is ceased; and I am sure that all the world was brought under a Law of Grace made after the fall to Adam and Noah: and that this Law is still in force to those that have not the more perfect edition in the Gospel. And that Christ came not to bring the world that never hear of Him, nor can do, into a worse condition than Jews and Gentiles were in before: nor has He repealed that Law of Grace which He before made them; nor has God changed that gracious Name which he proclaimed even to Moses, Ex. 34:6-7. And I am sure that Abraham, the father of the faithful, conjectured once, even when God told him that Sodom was ripe for destruction, that yet there might be fifty righteous persons in it; by which we may conjecture what he thought of all the world (read Mal. 1:14 with all the old translations in the polyglot Bible, and consider it). And I know that in every nation he that fears God and works righteousness is accepted of Him [Acts 10:35]; and that he that comes to God must believe that God is, and that He is the rewarder of them that diligently seek Him, and therefore without faith none can please God: And that men shall be judged by that same law which they were under and obliged by, whatever it be. And they that have sinned under the Law (of Moses) shall be judged by it; and they that sinned without that Law shall be judged without it. And I know that God is love itself and infinitely good; and will show us his goodness in such glorious effects to all eternity as shall satisfy us and fill us with joyful praise: And as for the Papists, I know that they are seduced by a worldly clergy, and that by consequence many of the errors in that Church do subvert the fundamentals; and so do many errors of the antinomians and others among us that are taken for religious persons; yea and as notoriously as any doctrines of the Popish councils do: But I know that as a logical faith or orthodoxness, which consists in holding right notions and words, deceives thousands that have no sound belief of the things themselves expressed by these words; So also logical errors about words, notions and sentences, may in unskilful men consist with a sound belief of the things which must necessarily be believed. And that Christ and grace may be thankfully received by many that have false names and notions, and sayings about Christ and grace. And I know the great power of education and converse, and what advantage an opinion has even with the upright, which is commonly extolled by learned, godly, religious men, especially if by almost all. Therefore I make no doubt but God has many among the Papists and the Antinomians (to name no others) who are truly godly, though they logically or notionally hold such errors as if practically held would be their damnation, and if the consequents were known and held: Much more when thousands of the common people, hold not the errors of the Church which they abide in. And it shall not be my way of persuading my own soul or others to love God, by first persuading them that He loves but few besides them. And when such have narrowed God’s love and mercy to all save their own party, and made themselves easily believe that He will damn the rest of the world, even such as are desirous to please God as they are, they have but prepared a snare for their own consciences, which may perhaps, when it is awakened, as easily believe that He will damn themselves. Let us give all diligence to make our own calling and election sure, and leave others to the righteous God, to whose judgment they and we must stand or fall. Who art thou that judgest anothers servant [Rom. 14]? As the [Mosaic] Covenant of Peculiarity was made only with the Israelites, though the Common Law of Grace (made to Adam and Noah) was in force to other nations of the world; So the more excellent Covenant of Peculiarity is since Christ’s incarnation made only with the Christian Church, though the foresaid Common Law of Grace be not repealed to all others: Nor can it be said that they sin not against a Law of Grace; or mercy leading to repentance. And as the Covenant of Peculiarity was not repealed to the ten [Northern] tribes (though the benefits were much forfeited by their violation), but God had still thousands among them in Elijah’s time that bowed not the knee to Baal, and such as Obadiah to hide the prophets; though yet the Jews were the more orthodox: Even so though the Reformed Churches, as the two tribes, stick closer to the truth, the kingdoms where Popery prevails, have yet many thousands that God will save; and notwithstanding their errors and corrupt additions, they have the same articles of Faith and Baptismal Covenant as we. And if any man think himself the wiser or the happier man than I, for holding the contrary, and thinking so many are hated of God more than I do (and consequently rendering Him less lovely to them), I envy not such the honor nor comfort of their wisdom.”

— Richard Baxter, A Treatise of Knowledge &amp; Love… (London: Parkhurst, 1689), pt. 2, ch. 14, pp. 267-69">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQuestion+2.+May+a+Papist+or+a+heretic+by+his+knowledge+be+a+lover+of+God+as+God%3F+Answer%3A+What+is+said+to+the+former+question+is+here+to+be+reviewed.+And+further%3A+1.+A+Papist+and+such+heretic+as+positively+holds+all+the+essentials+of+Christianity%2C+and+sees+not+the+opposition+of+his+false+opinions+hereto%2C+and+holds+Christianity+more+practically+than+those+false+opinions%2C+may+be+saved+in+that+state%2C+for+he+is+a+lover+of+God%3A+But+no+other+Papists+or+heretics+can+be+saved+but+by+a+true+conversion.+2.+There+is+a+sufficiency+in+the+doctrine+of+Christianity+which+they+hold%2C+to+save+them%2C+as+to+objective+sufficiency.+And+that+God+gives+not+subjective+grace+%28of+sanctification%29+to+any+such%2C+notwithstanding+their+errors%2C+is+a+thing+that+no+man+can+prove%2C+nor+any+sober+charitable+Christian+easily+believe%3A+And+experience+of+the+piety+of+many+makes+it+utterly+improbable%2C+though+we+know+not+certainly+the+heart+of+another.+There+are+many+murmurings+against+me+in+this+city+%28behind+my+back%3A+for+never+one+man+of+them+to+my+remembrance+to+this+day%2C+did+ever+use+any+charitable+endeavor+to+my+face+to+convince+me+of+my+supposed+error%29+as+one+that+holds+that+a+Papist+may+be+saved%2C+yea%2C+that+we+are+not+certain+that+none+in+the+world+are+saved+besides+Christians%3B+and+the+sectaries+whisper+me+to+one+another+to+be+like+Origen%2C+a+person+in+these+dangerous+opinions%2C+forsaken+of+God%2C+in+comparison+of+them%3A+What+really+I+assert+about+these+questions%2C+I+have+here+briefly+hinted%2C+but+more+largely+opened+in+my+Catholick+Theology%3A+But+I+will+confess+that+I+find+no+inclination+in+my+soul+to+desire+that+their+doctrine+may+prove+true%2C+who+hide+the+glorified+love+of+God%2C+and+would+contract+his+mercy+and+man%E2%80%99s+salvation+into+so+narrow+a+room+as+to+make+it+hardly+discernable+by+man%2C+and+the+Church+to+be+next+to+no+Church%2C+and+a+Savior+to+save+so+very+few%2C+as+seem+scarce+considerable+among+the+rest+that+are+left+remediless.+And+who+would+make+us+believe+that+the+way+appointed+to+bring+men+to+the+love+of+God+is+to+believe+that+He+has+elected+that+particular+person%2C+and+left+almost+all+the+world+%28many+score+or+hundreds+to+one%29+unredeemed%2C+and+without+any+promise+or+possibility+of+salvation%3A+I+am+sure+that+the+Covenant+of+Innocency+%5Bof+Works%5D+is+ceased%3B+and+I+am+sure+that+all+the+world+was+brought+under+a+Law+of+Grace+made+after+the+fall+to+Adam+and+Noah%3A+and+that+this+Law+is+still+in+force+to+those+that+have+not+the+more+perfect+edition+in+the+Gospel.+And+that+Christ+came+not+to+bring+the+world+that+never+hear+of+Him%2C+nor+can+do%2C+into+a+worse+condition+than+Jews+and+Gentiles+were+in+before%3A+nor+has+He+repealed+that+Law+of+Grace+which+He+before+made+them%3B+nor+has+God+changed+that+gracious+Name+which+he+proclaimed+even+to+Moses%2C+Ex.+34%3A6-7.+And+I+am+sure+that+Abraham%2C+the+father+of+the+faithful%2C+conjectured+once%2C+even+when+God+told+him+that+Sodom+was+ripe+for+destruction%2C+that+yet+there+might+be+fifty+righteous+persons+in+it%3B+by+which+we+may+conjecture+what+he+thought+of+all+the+world+%28read+Mal.+1%3A14+with+all+the+old+translations+in+the+polyglot+Bible%2C+and+consider+it%29.+And+I+know+that+in+every+nation+he+that+fears+God+and+works+righteousness+is+accepted+of+Him+%5BActs+10%3A35%5D%3B+and+that+he+that+comes+to+God+must+believe+that+God+is%2C+and+that+He+is+the+rewarder+of+them+that+diligently+seek+Him%2C+and+therefore+without+faith+none+can+please+God%3A+And+that+men+shall+be+judged+by+that+same+law+which+they+were+under+and+obliged+by%2C+whatever+it+be.+And+they+that+have+sinned+under+the+Law+%28of+Moses%29+shall+be+judged+by+it%3B+and+they+that+sinned+without+that+Law+shall+be+judged+without+it.+And+I+know+that+God+is+love+itself+and+infinitely+good%3B+and+will+show+us+his+goodness+in+such+glorious+effects+to+all+eternity+as+shall+satisfy+us+and+fill+us+with+joyful+praise%3A+And+as+for+the+Papists%2C+I+know+that+they+are+seduced+by+a+worldly+clergy%2C+and+that+by+consequence+many+of+the+errors+in+that+Church+do+subvert+the+fundamentals%3B+and+so+do+many+errors+of+the+antinomians+and+others+among+us+that+are+taken+for+religious+persons%3B+yea+and+as+notoriously+as+any+doctrines+of+the+Popish+councils+do%3A+But+I+know+that+as+a+logical+faith+or+orthodoxness%2C+which+consists+in+holding+right+notions+and+words%2C+deceives+thousands+that+have+no+sound+belief+of+the+things+themselves+expressed+by+these+words%3B+So+also+logical+errors+about+words%2C+notions+and+sentences%2C+may+in+unskilful+men+consist+with+a+sound+belief+of+the+things+which+must+necessarily+be+believed.+And+that+Christ+and+grace+may+be+thankfully+received+by+many+that+have+false+names+and+notions%2C+and+sayings+about+Christ+and+grace.+And+I+know+the+great+power+of+education+and+converse%2C+and+what+advantage+an+opinion+has+even+with+the+upright%2C+which+is+commonly+extolled+by+learned%2C+godly%2C+religious+men%2C+especially+if+by+almost+all.+Therefore+I+make+no+doubt+but+God+has+many+among+the+Papists+and+the+Antinomians+%28to+name+no+others%29+who+are+truly+godly%2C+though+they+logically+or+notionally+hold+such+errors+as+if+practically+held+would+be+their+damnation%2C+and+if+the+consequents+were+known+and+held%3A+Much+more+when+thousands+of+the+common+people%2C+hold+not+the+errors+of+the+Church+which+they+abide+in.+And+it+shall+not+be+my+way+of+persuading+my+own+soul+or+others+to+love+God%2C+by+first+persuading+them+that+He+loves+but+few+besides+them.+And+when+such+have+narrowed+God%E2%80%99s+love+and+mercy+to+all+save+their+own+party%2C+and+made+themselves+easily+believe+that+He+will+damn+the+rest+of+the+world%2C+even+such+as+are+desirous+to+please+God+as+they+are%2C+they+have+but+prepared+a+snare+for+their+own+consciences%2C+which+may+perhaps%2C+when+it+is+awakened%2C+as+easily+believe+that+He+will+damn+themselves.+Let+us+give+all+diligence+to+make+our+own+calling+and+election+sure%2C+and+leave+others+to+the+righteous+God%2C+to+whose+judgment+they+and+we+must+stand+or+fall.+Who+art+thou+that+judgest+anothers+servant+%5BRom.+14%5D%3F+As+the+%5BMosaic%5D+Covenant+of+Peculiarity+was+made+only+with+the+Israelites%2C+though+the+Common+Law+of+Grace+%28made+to+Adam+and+Noah%29+was+in+force+to+other+nations+of+the+world%3B+So+the+more+excellent+Covenant+of+Peculiarity+is+since+Christ%E2%80%99s+incarnation+made+only+with+the+Christian+Church%2C+though+the+foresaid+Common+Law+of+Grace+be+not+repealed+to+all+others%3A+Nor+can+it+be+said+that+they+sin+not+against+a+Law+of+Grace%3B+or+mercy+leading+to+repentance.+And+as+the+Covenant+of+Peculiarity+was+not+repealed+to+the+ten+%5BNorthern%5D+tribes+%28though+the+benefits+were+much+forfeited+by+their+violation%29%2C+but+God+had+still+thousands+among+them+in+Elijah%E2%80%99s+time+that+bowed+not+the+knee+to+Baal%2C+and+such+as+Obadiah+to+hide+the+prophets%3B+though+yet+the+Jews+were+the+more+orthodox%3A+Even+so+though+the+Reformed+Churches%2C+as+the+two+tribes%2C+stick+closer+to+the+truth%2C+the+kingdoms+where+Popery+prevails%2C+have+yet+many+thousands+that+God+will+save%3B+and+notwithstanding+their+errors+and+corrupt+additions%2C+they+have+the+same+articles+of+Faith+and+Baptismal+Covenant+as+we.+And+if+any+man+think+himself+the+wiser+or+the+happier+man+than+I%2C+for+holding+the+contrary%2C+and+thinking+so+many+are+hated+of+God+more+than+I+do+%28and+consequently+rendering+Him+less+lovely+to+them%29%2C+I+envy+not+such+the+honor+nor+comfort+of+their+wisdom.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Treatise+of+Knowledge+%26+Love%E2%80%A6+%28London%3A+Parkhurst%2C+1689%29%2C+pt.+2%2C+ch.+14%2C+pp.+267-69&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3068990442.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3068990442.html">Permalink</

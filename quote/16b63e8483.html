<main class="wrap"><figure class="quote" id="q-16b63e8483" data-kw="">
<blockquote><p>…for if we speak of a constant rule, as now we must do, when apostles are removed, if the Church of believers be a visible Church, having the Keys and using them, even to admit officers [as in Congregationalism], and to excommunicate them, they: 1. Dispense censures and govern, who have no call to carry on censures and government, by preaching the Word, or exhorting and praying, for there are no officers as yet, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Survey of the Survey of that Sum of Church Discipline</cite>, p. 179</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

— Rutherford, Survey of the Survey of that Sum of Church Discipline, p. 179">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6for+if+we+speak+of+a+constant+rule%2C+as+now+we+must+do%2C+when+apostles+are+removed%2C+if+the+Church+of+believers+be+a+visible+Church%2C+having+the+Keys+and+using+them%2C+even+to+admit+officers+%5Bas+in+Congregationalism%5D%2C+and+to+excommunicate+them%2C+they%3A+1.+Dispense+censures+and+govern%2C+who+have+no+call+to+carry+on+censures+and+government%2C+by+preaching+the+Word%2C+or+exhorting+and+praying%2C+for+there+are+no+officers+as+yet%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Rutherford%2C+Survey+of+the+Survey+of+that+Sum+of+Church+Discipline%2C+p.+179&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F16b63e8483.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/16b63e8483.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/congregational-prayer-is-to-be-by-ministers/#:~:text=for%20if%20we%20speak%20of%20a,are%20no%20officers%20as%20yet%2C%20etc&amp;text=for%20if%20we%20speak%20of%20a%20constant%20rule&amp;text=for%20there%20are%20no%20officers%20as%20yet%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8e97531428" data-kw="">
<blockquote><p>This was it, which is here said to be according to the law: and that the judicial, ceremonial and moral law:

1. By the judicial law the Levites had not their portion in Canaan for their inheritance, as other tribes had: therefore in lieu thereof, by the said law they had the tenth of the rest of the people.

2. The holy services which they performed to the Lord for the people were ceremonial. Therefore the recompence given was by a like law.

3. The general equity that they who communicate unto us spiritual matters should partake of our temporals, and that they who are set apart wholly to attend God’s service should live upon that service, is moral.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, vol. 2, p. 108, section 40, ‘Of the law of paying tithes,’ on Heb. 7:5-7 Gouge (d. 1653) was an English puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-6ccc9b4c4f" data-kw="">
<blockquote><p>The particle wde, ‘here’, if referred to time, notes during Moses’s economy, while the Levitical law lasted; if it refer to place, it notes Jerusalem in the land of Canaan, where the temple was: in that habitation of the Israelitish church the Levitical priests were not only as to their nature and persons withering and decaying, ceasing to be on earth, though they had the honor to decimate their brethren, but as to their order and office, mortal, they were no better than the tithed and blessed by them, in prospect of death. Aaron himself, the first of the order, died, and so did all his successors, as well as Israel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations</cite>, On Mt. 23:23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-d261b36d0a" data-kw="">
<blockquote><p>…and since Christ prayed for infants and blessed them, which is a praying for them, Gen. 48:15,16; Deut. 33:1.6-8, etc.; Eph. 1:2; Gal. 1:3; 1 Cor. 1:3; 1 Tim. 1:2; 2 Tim. 1:3; see Mk. 10:16; He must own them as blessed in Christ in whom all the nations of the earth are blessed, and so Covenanted with God in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, (1655), p. 91</span></figcaption>

</figure><figure class="quote" id="q-18be386f2f" data-kw="">
<blockquote><p>Yea the fallible church may determine infallible points. This is a principle that Libertines proceed upon, that men who are not infallible may err, and therefore can hold forth to others no infallible truth, which is most false, for prophets and apostles, Nathan, Samuel, David, Peter, being deserted of the immediately inspiring Spirit, did err, as well as the Church and pastors now deserted of the ordinary Spirit can and do err. For ‘all men’, prophets and apostles, ‘are liars’, Rom. 3, yet they may and do carry infallible truth to others; a blind man may hold a candle to others.

3. By this reason [of the Libertines] pastors can preach nothing certain in fundamentals [which is absurd], though faith come by hearing and faith is of a certain and determinate fixed truth of God, more permanent than heaven or earth; Why? because by this reason pastors in preaching fundamentals are not infallible.

4. Nor is this a good reason: It is believed the Church may err in synods, ergo [therefore], it does err and determines nothing that is infallible and certain in synods; no more than this is a good consequence: David may sin in praying, ergo, he does sin in praying: a potentia ad actum non valet consequentia [a consequence from potential to an act is not valid].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), ch. 2, pp. 24-5</span></figcaption>

<main class="wrap"><figure class="quote" id="q-650ec40c91" data-kw="">
<blockquote><p>…the Lord’s Supper, to be observed in his church unto the end of the world, for the perpetual remembrance of the sacrifice of himself in his death, the sealing all benefits thereof unto true believers, their spiritual nourishment and growth in him, their further engagement… unto Him, and to be a bond and pledge of their communion with Him, and with each other, as members of his mystical body.[a] [a] 1 Cor. 11:23-26. 1 Cor. 10:16,17,21. 1 Cor. 12:13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Confession of Faith 1646</cite>, 29.1, ‘Of the Lord’s Supper’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b884325095" data-kw="">
<blockquote><p>…that such who were known to be godly might not come to the sacrament of the Lord’s Supper, unless they were members of some particular congregation, and so, in their partaking with you, they must yield that grand Brownistical principle, the foundation of other errors among the Separatists, namely, that sacraments belong not to visible believers, but as they are members of some particular congregation… And let me entreat you, in your reply you [will] give to this answer, to give me a Scripture to prove that all men who come to the Lord’s Supper must profess their membership and their retaining to such a particular congregation: I profess myself of another judgement, and cast the glove to any of you five, or to you all; That it is lawful for the ministers of Christ to receive such whom they know to be godly to the Lord’s Supper, though they be not members of a particular church, and to receive those who are members without any [of them] professing themselves to be so: Suppose some godly merchants or marriners, who all their days travel and never stay long in any one place, yet in all places where they come, desire to join in the ordinances, ought not such to be received? The standing rule of coming to the Lord’s Supper will be found to be faith and godliness shown forth, rather than the formality of membership: …so I find Mr. Batchelour (one of you) writing from Rotterdam of your churches, that they will not keep back the sacrament from any of the godly of such churches in England, as Mr. Goodwin’s and Mr. Calamy’s are (always provided that their own pastors do consent unto it). Now the godly who are gone into Holland, and especially to New-England, not finding any such word in Scripture of bringing a ticket from their ministers, and so coming into those countries without it, may be long kept from the sacrament of the Lord’s Supper till they either go [back] into England and fetch it, or till they send for it over, and have a return back of the consent of their own pastors (which may be, was the reason, that though you offered to receive into the Communion of the Lord’s Supper some godly that came to visit you in your exile, yet for want of bringing their pastor’s consent unto it, returned into England without partaking in the Lord’s Supper with you). Which (by the way) will be a good warning for all that henceforth go over into Holland or New-England, to carry their minister’s consents over with them, lest otherwise they be not admitted to the Lord’s Supper…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or a Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge</cite>, … (London, 1644), p. 52</span></figcaption>

</figure><figure class="quote" id="q-32857107a2" data-kw="">

<blockquote><p>Now not to be in membership of such a particular congregation is not a sin, nor a just ground of Paul’s estrangement of his ministerial power from them [as the congregationalists would have it], it may be caused by persecution when the flock are scattered by wolves.</p></blockquote>

</figure><figure class="quote" id="q-b515383e4b" data-kw="">
<blockquote><p>We reject the opinion of those [English Independants and congregationalists] who think that in the Church none are to be admitted as members into the external fellowship of the Church, but such as have been by a strict examination first tried by other believers, or the elders of the Church, in the exercises of piety… and have manifested to them evident signs of regeneration: and have afterwards, before the whole body of the Church, publicly professed a sincere confession of faith; and have either by a continued speech, or by questions and answers, made manifest by evident signs the saving grace of God in them… and [are of] such a spirit that in a church covenant sincerely, faithfully, and godlily in the presence of God and the whole church, they both can and will walk in the ways of God. For we read not that in the apostolical Church this manner of admitting church members was in use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England concerning the Government of the Church of God</cite>, (London: 1645), ch. 1, ‘Of the Qualification of Church-members’, pp. 10-11</span></figcaption>

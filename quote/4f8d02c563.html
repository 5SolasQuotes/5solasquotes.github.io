<main class="wrap"><figure class="quote" id="q-4f8d02c563" data-kw="immutability">
<blockquote><p>Immutability is an incommunicable attribute of God by which is denied of him not only all change, but also all possibility of change, as much with respect to existence as to will. With the orthodox, we maintain that every kind of immutability is to be ascribed to him both as to nature and as to will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.11.1–2</span></figcaption>

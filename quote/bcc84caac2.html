<main class="wrap"><figure class="quote" id="q-bcc84caac2" data-kw="">
<blockquote><p>But it must be shew’d thirdly, how long this rest must continue, to which the answer is For a whole natural day, for of what quantity the foregoing six are, of that must the seventh be which cometh betwixt six in numbering, even four and twenty hours. If it be demanded at what time the day must begin and end: it is answered, when the first of the six following beginneth, and seeing God’s intention was not to bind all Nations to begin and end their days at one period, and that we cannot tie the seventh day, but we must in like manner tie the days before, and after, to a set period of beginning and ending; it is apparent that by this Commandment we are not tied to any set beginning or ending, but must follow the common computation and reckoning of other days which is amongst us, from twelve of the clock at night to twelve the next night, for we say twelve at night, and one a clock in the morning.

Neither is it any inconvenience that in some Countries the Sabbath shall be in being before and after the being of it in others, for the same inconvenience must needs follow upon any kind of beginning or ending either by Sun-set or Sun-rising (unless God had named a special hour which he hath not) for the Sun riseth and setteth in some places three or four, five or six hours sooner then in others, for a good space of the year at least. Yea in some Countries they have but two Sun-risings and Sun-settings in one year, that is, one half-year day, the other night. See Cartw. [Thomas Cartwright] Catechism.</p></blockquote>

<blockquote><p>We fear, that the tale we are about to tell labours under this disadvantage. It is recent; for the catastrophe occurred last month. And it is too true; for in little more than a day’s journey the reader may see for himself all its sad details of desolate sanctuaries and forsaken homes and weeping families.

But it is co-temporary history. It is a tale of the times, and the russet light of antiquity is not fading over it. And, therefore, some who garnish the sepulchres of the Covenanters, and build the tombs of the Puritans, may grudge a stone to this modern cairn.

But when we reflect a little longer, and remember that it is not so much a tale of ruin as of restoration — when we consider that this disruption of the northern Establishment is the resuscitation of the National Church, the revival of the Kirk in the energy of its first reformation, in the purity of its second reformation, and in the catholicity of this, its third, reformation, we almost forget the privations with which it has been purchased, and rejoice that it is such a modern story.</p></blockquote>

<blockquote><p>First of all, then, on behalf of human hymns, it has been said, “We live now under a better and brighter dispensation than that of the Old Testament, therefore the inspired Psalms of David, and other Psalms in Holy Scripture, are insufficient.”

But the question is not whether the dispensation under which we now live is better and brighter than that which preceded it; but whether, under this better and brighter dispensation, there is any security for better and brighter hymns than the Psalms of David, and whether there is a promise given to any man, or any body of men, of a richer unction of the Spirit – and not a richer unction only, but a specifically inspiring action of the Spirit – for the purpose of composing hymns for the public worship of God in the Church than was given to him, of whom it is written, that in his blessed swan song he spoke as follows:– “David, the son of Jesse, said, and the man who was raised up on high, the anointed of the God of Jacob, and the sweet Psalmist of Israel, said, The Spirit of the Lord spoke by me, and His Word was in my tongue.” Is there any modern hymnologist in circumstances to say that? Dr. Adam must tell us who he is, before his argument from the greater brightness of the New Testament dispensation is of any worth, otherwise it is an argument not only on behalf of hymns, but against the Book of Psalms.

Further, we are told that “it would be strange if we were never to rise in this respect above the dispensation which had passed away.” Yes, no doubt, when the fulness of the times was come, the Church rose above the dispensation which then passed away. But the question is not whether we are to rise above the Old Testament dispensation, but whether we are, by the help of uninspired hymnologists, to rise above the Spirit and Word of God in the mouth of “David, the son of Jesse, the man who was raised up on high, the anointed of the God of Jacob, the sweet Psalmist of Israel.”

Is it modest to talk of rising above the height to which he who was “raised up on high” was raised? Still further, it has been said, “It would be strange if we were always to walk in the morning dawn, and never pass into the sunshine of the perfect day.” Sir, who can fail to admire the ingenuity which has discovered the resplendent fulness of noontide glory in uninspired songs, and nothing but twilight in the Psalms of David! Was it an uninspired modern hymnologist whose pen produced the following, or was it the Psalmist of Israel?

“Because of life the fountain pure Remains alone with thee, And in that purest light of thine We clearly light shall see.”

If the Psalms are but twilight, and human hymns the sunshine of the perfect day, then walk always in the perfect light … Sing nothing but human hymns, for that is perfect sunshine; and sing no Psalms of David, for that is going back to twilight. Excuse me, however, if I think that this argument of our friends is moonshine, and the logic of it is the logic of the twilight, and suited for those only who are of weaker vision. I say the Psalms are the full noonday light of Messianic glory, and the hymns are but the twilight – likely, if you trust to them, or put them on a level with the Word of God, to prove an evening and not a morning twilight, and you know the fatal difference there.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms and Uninspired Hymns. Extracts from Speech by Dr. Hugh Martin, in the General Assembly of the Free Church, 3rd June, 1872 in Free Presbyterian Magazine</cite></span></figcaption>

— Hugh Martin, The Psalms and Uninspired Hymns. Extracts from Speech by Dr. Hugh Martin, in the General Assembly of the Free Church, 3rd June, 1872 in Free Presbyterian Magazine">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst+of+all%2C+then%2C+on+behalf+of+human+hymns%2C+it+has+been+said%2C+%E2%80%9CWe+live+now+under+a+better+and+brighter+dispensation+than+that+of+the+Old+Testament%2C+therefore+the+inspired+Psalms+of+David%2C+and+other+Psalms+in+Holy+Scripture%2C+are+insufficient.%E2%80%9D%0A%0ABut+the+question+is+not+whether+the+dispensation+under+which+we+now+live+is+better+and+brighter+than+that+which+preceded+it%3B+but+whether%2C+under+this+better+and+brighter+dispensation%2C+there+is+any+security+for+better+and+brighter+hymns+than+the+Psalms+of+David%2C+and+whether+there+is+a+promise+given+to+any+man%2C+or+any+body+of+men%2C+of+a+richer+unction+of+the+Spirit+%E2%80%93+and+not+a+richer+unction+only%2C+but+a+specifically+inspiring+action+of+the+Spirit+%E2%80%93+for+the+purpose+of+composing+hymns+for+the+public+worship+of+God+in+the+Church+than+was+given+to+him%2C+of+whom+it+is+written%2C+that+in+his+blessed+swan+song+he+spoke+as+follows%3A%E2%80%93+%E2%80%9CDavid%2C+the+son+of+Jesse%2C+said%2C+and+the+man+who+was+raised+up+on+high%2C+the+anointed+of+the+God+of+Jacob%2C+and+the+sweet+Psalmist+of+Israel%2C+said%2C+The+Spirit+of+the+Lord+spoke+by+me%2C+and+His+Word+was+in+my+tongue.%E2%80%9D+Is+there+any+modern+hymnologist+in+circumstances+to+say+that%3F+Dr.+Adam+must+tell+us+who+he+is%2C+before+his+argument+from+the+greater+brightness+of+the+New+Testament+dispensation+is+of+any+worth%2C+otherwise+it+is+an+argument+not+only+on+behalf+of+hymns%2C+but+against+the+Book+of+Psalms.%0A%0AFurther%2C+we+are+told+that+%E2%80%9Cit+would+be+strange+if+we+were+never+to+rise+in+this+respect+above+the+dispensation+which+had+passed+away.%E2%80%9D+Yes%2C+no+doubt%2C+when+the+fulness+of+the+times+was+come%2C+the+Church+rose+above+the+dispensation+which+then+passed+away.+But+the+question+is+not+whether+we+are+to+rise+above+the+Old+Testament+dispensation%2C+but+whether+we+are%2C+by+the+help+of+uninspired+hymnologists%2C+to+rise+above+the+Spirit+and+Word+of+God+in+the+mouth+of+%E2%80%9CDavid%2C+the+son+of+Jesse%2C+the+man+who+was+raised+up+on+high%2C+the+anointed+of+the+God+of+Jacob%2C+the+sweet+Psalmist+of+Israel.%E2%80%9D%0A%0AIs+it+modest+to+talk+of+rising+above+the+height+to+which+he+who+was+%E2%80%9Craised+up+on+high%E2%80%9D+was+raised%3F+Still+further%2C+it+has+been+said%2C+%E2%80%9CIt+would+be+strange+if+we+were+always+to+walk+in+the+morning+dawn%2C+and+never+pass+into+the+sunshine+of+the+perfect+day.%E2%80%9D+Sir%2C+who+can+fail+to+admire+the+ingenuity+which+has+discovered+the+resplendent+fulness+of+noontide+glory+in+uninspired+songs%2C+and+nothing+but+twilight+in+the+Psalms+of+David%21+Was+it+an+uninspired+modern+hymnologist+whose+pen+produced+the+following%2C+or+was+it+the+Psalmist+of+Israel%3F%0A%0A%E2%80%9CBecause+of+life+the+fountain+pure+Remains+alone+with+thee%2C+And+in+that+purest+light+of+thine+We+clearly+light+shall+see.%E2%80%9D%0A%0AIf+the+Psalms+are+but+twilight%2C+and+human+hymns+the+sunshine+of+the+perfect+day%2C+then+walk+always+in+the+perfect+light+%E2%80%A6+Sing+nothing+but+human+hymns%2C+for+that+is+perfect+sunshine%3B+and+sing+no+Psalms+of+David%2C+for+that+is+going+back+to+twilight.+Excuse+me%2C+however%2C+if+I+think+that+this+argument+of+our+friends+is+moonshine%2C+and+the+logic+of+it+is+the+logic+of+the+twilight%2C+and+suited+for+those+only+who+are+of+weaker+vision.+I+say+the+Psalms+are+the+full+noonday+light+of+Messianic+glory%2C+and+the+hymns+are+but+the+twilight+%E2%80%93+likely%2C+if+you+trust+to+them%2C+or+put+them+on+a+level+with+the+Word+of+God%2C+to+prove+an+evening+and+not+a+morning+twilight%2C+and+you+know+the+fatal+difference+there.%E2%80%9D%0A%0A%E2%80%94+Hugh+Martin%2C+The+Psalms+and+Uninspired+Hymns.+Extracts+from+Speech+by+Dr.+Hugh+Martin%2C+in+the+General+Assembly+of+the+Free+Church%2C+3rd+June%2C+1872+in+Free+Presbyterian+Magazine&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff72725eb53.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f72725eb53.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/09/16/hugh-martin-on-the-psalms-and-the-noonday-light-of-the-messianic-glory/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-aff4a3ff44" data-kw="">
<blockquote><p>Not only the covetous, but the unclean, are idolaters; for the apostle, who here makes covetousness to be idolatry, counts voluptuous persons idolaters also, where he speaks of some who make their belly their God, Philip. 3. Indeed, every reigning lust is an idol, and every person in whom it reigns is an idolater. ‘The lust of the flesh, the lust of the eye, and the pride of life,’ i.e. pleasures, and riches, and honours, are the carnal man’s trinity, the three great idols of worldly men, to which they prostrate their souls; and giving that to them which is due only to God, they hereby become guilty of idolatry.… Idolatry is … to give that honour and worship to the creature which is due only to God.… Now this worship due to God only is not only given by heathens to their false gods, and by papists to angels, saints, images, &amp;c., but also by carnal men to their lusts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Soul Idolatry Excludes Men Out of Heaven</cite>, on Eph. 5:5 (Practical Works)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-27b9fb99a7" data-kw="">
<blockquote><p>There is a twofold worship due only to God, internal and external.… Internal, which consists in the acts of the soul and actions answerable thereto. When the mind is most taken up with an object, and the heart and affections most set upon it, this is soul worship, and this is due only to God.… Now according to this distinction of worship there are two sorts of idolatry, 1. Open, outward idolatry.… 2. Secret and soul idolatry, when the mind and heart is set upon anything more than God; when anything is more valued, more intended; anything more trusted, more loved, or our endeavours more for any other thing than God. Then is that soul worship, which is due only to God … given to other things besides him. And this is as true, as heinous idolatry, as the former, though not so open, discernible, nor so much observed.… Secret idolaters shall have no inheritance in the kingdom of God. Soul idolatry will exclude men out of heaven as well as open idolatry. He that serves his lusts is as uncapable of heaven as he that serves, worships idols of wood or stone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Soul Idolatry Excludes Men Out of Heaven</cite>, on Eph. 5:5 (definition of soul idolatry)</span></figcaption>

</figure><figure class="quote" id="q-07640ab15d" data-kw="">
<blockquote><p>Many a one thinks that he has God and everything in abundance when he has money and possessions; he trusts in them and boasts of them with such firmness and assurance as to care for no one. Lo, such a man also has a god, Mammon by name, i.e., money and possessions, on which he sets all his heart, and which is also the most common idol on earth.… So, too, whoever trusts and boasts that he possesses great skill, prudence, power, favor, friendship, and honor has also a god, but not this true and only God.… Therefore I repeat that the chief explanation of this point is that to have a god is to have something in which the heart entirely trusts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Large Catechism</cite>, First Commandment (Mammon and creature-trust)</span></figcaption>

</figure><figure class="quote" id="q-e4ce59d60d" data-kw="">
<blockquote><p>All confidence reposed in creatures … is evidently opposed to a correct knowledge of God, since he who places his trust in creatures makes for himself many gods. Hence God expressly condemns in his word all those who repose their confidence either in men, or in power and riches, or in any created object. Avarice, or covetousness, is included in this vice, and condemned.… Idolatry … There are two forms or species of idolatry. One is, when another beside the true God is professedly worshiped, or, when that is worshiped for God which is no God.… The other form of idolatry is when we do not professedly worship another God, but err in the kind of worship we render unto him.… Those who worship God otherwise than he will be worshipped, imagine another God, one differently affected from what the true God is; and in this way they do not worship God, but a figment of their own brain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, on the First Commandment (creature-trust and forms of idolatry)</span></figcaption>

</figure><figure class="quote" id="q-48f84ab3d4" data-kw="">
<blockquote><p>Do we not see with our eyes that in the Roman Church the people is denied the Communion of the cup? Do we not see pictures of the Trinity, and the people bowing the knee before images? Do we not hear public service and prayers in an unknown tongue? And if these things be formally prohibited in the holy Scripture, are they not unto us sensible marks of a false and erroneous Church?</p></blockquote>

<main class="wrap"><figure class="quote" id="q-e1cdea8129" data-kw="">
<blockquote><p>Also, it should be pointed out again that the doctrinal difference between the Saumur theologians and Turretin do not involve any of the fundamental tenets of the Reformed faith. Turretin himself mentions this fact in a letter to Jean Claude which we shall consider later in this thesis. As we have seen various times in this chapter, Turretin refers to the Salmurians as fellow Reformed pastors and theologians, and the Salmurians certainly view themselves as being within the Reformed tradition. In fact, Amyraut goes to great lengths in attempting to prove that the orthodox Reformed theologians are in agreement with him. Thus, even though this controversy was a serious and lengthy one, nevertheless it was entirely an internal dispute within the Reformed churches concerning non-fundamental matters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/genevan.html">Donald Davis Grohman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Genevan Reactions to the Saumur Doctrines of Hypothetical Universalism: 1635-1685 Th.D. diss</cite>, (Knox College in cooperation with Toronto School of Theology, 1971), p. 120</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2c726bebc9" data-kw="">
<blockquote><p>“There are others, who, rejecting that first absolute decree, and rightly so, make the conditional decree so common to all men that they assert that the counsel of God the Father in delivering the Son to death and of the Son in undergoing the same, and their intention and scope, was to acquire, impetrate and merit for all and every sinful man by that most precious death and passion, that, if they repent, when they are capable of doctrine and believe in Christ, they might be able to be reconciled with God and receive the remission of sins. They deny, however, that actual reconciliation with God or the remission of sins or eternal life was actually acquired or impetrated for those who remain in impenitence. 11. Since these deny that Christ died equally for the impious and the pious, and affirm that only the pious may glory in the satisfaction of Christ, because the principal fruit and efficacy of the satisfaction comes to them, they agree in sense with all other Orthodox on that point, even if they differ in their mode of speaking; especially since they acknowledge a certain special decree, according to which He died specially for the elect alone, by which they are brought not only to the common, but also to the singular benefits, namely the grace of regeneration and of efficacious calling, of justification and of glorification; and to the merit of Christ’s death they assign the true and efficacious communion, bestowal and application of saving grace, and the donation of faith itself, by which the application is made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, (d. 1651), vol. 2, Thirteen Disputations on the Just &amp; Gracious Dispensation of God concerning the Salvation of the Human Race, Disputation 6, Theses 9-11 in Barthold Holtzfus, Theological Treatise on Predestination, Election &amp; Reprobation of Men 3rd ed. tr. by AI by Nosferatu (Leiden, 1705), p. 121 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

<blockquote><p>we affirm, that, according to the same Scripture, these precious fruits do belong to all the elect, and to them alone: but, as for the incredulous and impious, so long as they remain such, we exclude them from these benefits… As for the wicked, and such as want [lack] justifying faith, why should they partake so much happiness, who please not God?… Who belong not to Christ, who are not heirs, neither have right to, or in that life, how can Christ or his benefits belong to them?… For, if infidels belong not to Christ, they are none of Christ’s: We conclude strongly from the correlative, that Christ and his benefits belong not to the wicked: and as they are not Christs, so neither is Christ theirs. And how, I pray, should Christ belong to them whom He will, in the Last Judgment, pronounce before all the world, to be strangers from Himself, from his benefits, from his Kingdom?… But, you will say, ‘Christ died for all, therefore rose again for all.’ The answer is double: One is, as often as the Gospel extends the fruits of the works and benefits of Christ to all, this is to be understood of all those that believe in Christ: for, this is the perpetual and constant voice of the Gospel… Therefore, the Gospel debars from the benefits of Christ, all infidels; not only by a plain exclusion, but also by that condition of faith and repentance… So then, Christ is said to die for all, to wit, all that do or shall believe in Him; for whom alone He prayed, and in whom alone He finds the faith of his death: but as for infidels and reprobates, for whom Christ prayed not, whom He never acknowledged for his own, upon whom the wrath of God abides forever, to extend, I say on these the benefits of Christ, what is it else but against his own command to give that which is holy unto dogs, and to cast pearls before swine? These [things] we could solidly defend by authority of Scripture and orthodox Fathers… There is another answer usual in the schools, by which we may gratify the contentious, that Christ absolutely died for all, if you consider the amplitude and sufficiency of his price and merit: for, it is out of controversy, that the death of the Son of God is of that value, that it suffices to expiate the sins, not only of one, but of millions of worlds, if so be they had faith to apply this physic to their sins. But the question is properly of the efficacy and participation itself of these fruits, when we demand if Christ died for all: because, to die for another, is properly to die in the stead and place of another, so that he is freed from death, and saved alive; as when David, weeping, cried out, ‘I wish I had died for thee, O Absalom’; that is, I wish I had died in thy stead, that thou mightest have lived. But we utterly deny that this participation of Christ’s merits is common to all unbelievers, as well as to those that believe; or that this is promised or exhibited in the Gospel: for, in this regard, we conclude that Christ did not die properly for all, even for unbelievers and reprobates. But here some unlucky patrons of infidels, taking it ill that we do not divide the pearls equally amongst sheep and swine, cry out, that we deny the blood of Christ… But first, we protest against such bitter calumnies, making our appeal to the unanimous consent of the orthodoxal Church, and the perpetual voice of the Gospel, that we deny not, but honor the blood of Christ, when we say, it is poured out, not for those that slight it, and tread Christ under their feet; but for those who by faith are justified through it… They contend that Christ died for all. Who denies this? for this is the Scripture phrase. They add that He died for all and singular. Neither do we simply deny this; to wit, in that sense which we showed a little before: although we do not find the Scripture speak so. They go on: that He died for all and singular alike; for the elect and reprobate, for Cain and David, for Judas and Peter, for the damned, as well as for those that are saved, without any respect of faith or infidelity. This is hard. They proceed, finally, that He died for all and singular, not only in respect of sufficiency, but also in regard of the efficacy of the price. But what is this? to wit, that Christ by his death has truly delivered from death, purged from sin, sanctified, and reconciled to God all absolutely, even those who are not saved, but have been damned ever since Cain, and are damned, and furthermore are to be damned; all those, they say, He has received into his favor. This is that impious monster, by which they conclude another, no less impious and false: to wit, that wicked men, whosoever have perished, do, or shall perish, that they have perished, do, and shall perish not for their sins (for they were expiated by the blood of Christ), but only for their incredulity [unbelief]…. but how monstrous are these to Christian ears?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Piece of a Speech concerning that Question, To whom properly do the benefits of Christ’s sufferings and death belong? And how Christ is said to die for all</cite>, …’ in Zachary Ursinus, Sum of Christian Religion… (London: Young, 1645) Pareus (d. 1622), pp. 807-9</span></figcaption>

, for the damned, as well as for those that are saved, without any respect of faith or infidelity. This is hard. They proceed, finally, that He died for all and singular, not only in respect of sufficiency, but also in regard of the efficacy of the price. But what is this? to wit, that Christ by his death has truly delivered from death, purged from sin, sanctified, and reconciled to God all absolutely, even those who are not saved, but have been damned ever since Cain, and are damned, and furthermore are to be damned; all those, they say, He has received into his favor. This is that impious monster, by which they conclude another, no less impious and false: to wit, that wicked men, whosoever have perished, do, or shall perish, that they have perished, do, and shall perish not for their sins (for they were expiated by the blood of Christ), but only for their incredulity [unbelief]…. but how monstrous are these to Christian ears?”

— David Pareus, ‘A Piece of a Speech concerning that Question, To whom properly do the benefits of Christ’s sufferings and death belong? And how Christ is said to die for all…’ in Zachary Ursinus, Sum of Christian Religion… (London: Young, 1645) Pareus (d. 1622), pp. 807-9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9Cwe+affirm%2C+that%2C+according+to+the+same+Scripture%2C+these+precious+fruits+do+belong+to+all+the+elect%2C+and+to+them+alone%3A+but%2C+as+for+the+incredulous+and+impious%2C+so+long+as+they+remain+such%2C+we+exclude+them+from+these+benefits%E2%80%A6+As+for+the+wicked%2C+and+such+as+want+%5Black%5D+justifying+faith%2C+why+should+they+partake+so+much+happiness%2C+who+please+not+God%3F%E2%80%A6+Who+belong+not+to+Christ%2C+who+are+not+heirs%2C+neither+have+right+to%2C+or+in+that+life%2C+how+can+Christ+or+his+benefits+belong+to+them%3F%E2%80%A6+For%2C+if+infidels+belong+not+to+Christ%2C+they+are+none+of+Christ%E2%80%99s%3A+We+conclude+strongly+from+the+correlative%2C+that+Christ+and+his+benefits+belong+not+to+the+wicked%3A+and+as+they+are+not+Christs%2C+so+neither+is+Christ+theirs.+And+how%2C+I+pray%2C+should+Christ+belong+to+them+whom+He+will%2C+in+the+Last+Judgment%2C+pronounce+before+all+the+world%2C+to+be+strangers+from+Himself%2C+from+his+benefits%2C+from+his+Kingdom%3F%E2%80%A6+But%2C+you+will+say%2C+%E2%80%98Christ+died+for+all%2C+therefore+rose+again+for+all.%E2%80%99+The+answer+is+double%3A+One+is%2C+as+often+as+the+Gospel+extends+the+fruits+of+the+works+and+benefits+of+Christ+to+all%2C+this+is+to+be+understood+of+all+those+that+believe+in+Christ%3A+for%2C+this+is+the+perpetual+and+constant+voice+of+the+Gospel%E2%80%A6+Therefore%2C+the+Gospel+debars+from+the+benefits+of+Christ%2C+all+infidels%3B+not+only+by+a+plain+exclusion%2C+but+also+by+that+condition+of+faith+and+repentance%E2%80%A6+So+then%2C+Christ+is+said+to+die+for+all%2C+to+wit%2C+all+that+do+or+shall+believe+in+Him%3B+for+whom+alone+He+prayed%2C+and+in+whom+alone+He+finds+the+faith+of+his+death%3A+but+as+for+infidels+and+reprobates%2C+for+whom+Christ+prayed+not%2C+whom+He+never+acknowledged+for+his+own%2C+upon+whom+the+wrath+of+God+abides+forever%2C+to+extend%2C+I+say+on+these+the+benefits+of+Christ%2C+what+is+it+else+but+against+his+own+command+to+give+that+which+is+holy+unto+dogs%2C+and+to+cast+pearls+before+swine%3F+These+%5Bthings%5D+we+could+solidly+defend+by+authority+of+Scripture+and+orthodox+Fathers%E2%80%A6+There+is+another+answer+usual+in+the+schools%2C+by+which+we+may+gratify+the+contentious%2C+that+Christ+absolutely+died+for+all%2C+if+you+consider+the+amplitude+and+sufficiency+of+his+price+and+merit%3A+for%2C+it+is+out+of+controversy%2C+that+the+death+of+the+Son+of+God+is+of+that+value%2C+that+it+suffices+to+expiate+the+sins%2C+not+only+of+one%2C+but+of+millions+of+worlds%2C+if+so+be+they+had+faith+to+apply+this+physic+to+their+sins.+But+the+question+is+properly+of+the+efficacy+and+participation+itself+of+these+fruits%2C+when+we+demand+if+Christ+died+for+all%3A+because%2C+to+die+for+another%2C+is+properly+to+die+in+the+stead+and+place+of+another%2C+so+that+he+is+freed+from+death%2C+and+saved+alive%3B+as+when+David%2C+weeping%2C+cried+out%2C+%E2%80%98I+wish+I+had+died+for+thee%2C+O+Absalom%E2%80%99%3B+that+is%2C+I+wish+I+had+died+in+thy+stead%2C+that+thou+mightest+have+lived.+But+we+utterly+deny+that+this+participation+of+Christ%E2%80%99s+merits+is+common+to+all+unbelievers%2C+as+well+as+to+those+that+believe%3B+or+that+this+is+promised+or+exhibited+in+the+Gospel%3A+for%2C+in+this+regard%2C+we+conclude+that+Christ+did+not+die+properly+for+all%2C+even+for+unbelievers+and+reprobates.+But+here+some+unlucky+patrons+of+infidels%2C+taking+it+ill+that+we+do+not+divide+the+pearls+equally+amongst+sheep+and+swine%2C+cry+out%2C+that+we+deny+the+blood+of+Christ%E2%80%A6+But+first%2C+we+protest+against+such+bitter+calumnies%2C+making+our+appeal+to+the+unanimous+consent+of+the+orthodoxal+Church%2C+and+the+perpetual+voice+of+the+Gospel%2C+that+we+deny+not%2C+but+honor+the+blood+of+Christ%2C+when+we+say%2C+it+is+poured+out%2C+not+for+those+that+slight+it%2C+and+tread+Christ+under+their+feet%3B+but+for+those+who+by+faith+are+justified+through+it%E2%80%A6+They+contend+that+Christ+died+for+all.+Who+denies+this%3F+for+this+is+the+Scripture+phrase.+They+add+that+He+died+for+all+and+singular.+Neither+do+we+simply+deny+this%3B+to+wit%2C+in+that+sense+which+we+showed+a+little+before%3A+although+we+do+not+find+the+Scripture+speak+so.+They+go+on%3A+that+He+died+for+all+and+singular+alike%3B+for+the+elect+and+reprobate%2C+for+Cain+and+David%2C+for+Judas+and+Peter%2C+for+the+damned%2C+as+well+as+for+those+that+are+saved%2C+without+any+respect+of+faith+or+infidelity.+This+is+hard.+They+proceed%2C+finally%2C+that+He+died+for+all+and+singular%2C+not+only+in+respect+of+sufficiency%2C+but+also+in+regard+of+the+efficacy+of+the+price.+But+what+is+this%3F+to+wit%2C+that+Christ+by+his+death+has+truly+delivered+from+death%2C+purged+from+sin%2C+sanctified%2C+and+reconciled+to+God+all+absolutely%2C+even+those+who+are+not+saved%2C+but+have+been+damned+ever+since+Cain%2C+and+are+damned%2C+and+furthermore+are+to+be+damned%3B+all+those%2C+they+say%2C+He+has+received+into+his+favor.+This+is+that+impious+monster%2C+by+which+they+conclude+another%2C+no+less+impious+and+false%3A+to+wit%2C+that+wicked+men%2C+whosoever+have+perished%2C+do%2C+or+shall+perish%2C+that+they+have+perished%2C+do%2C+and+shall+perish+not+for+their+sins+%28for+they+were+expiated+by+the+blood+of+Christ%29%2C+but+only+for+their+incredulity+%5Bunbelief%5D%E2%80%A6.+but+how+monstrous+are+these+to+Christian+ears%3F%E2%80%9D%0A%0A%E2%80%94+David+Pareus%2C+%E2%80%98A+Piece+of+a+Speech+concerning+that+Question%2C+To+whom+properly+do+the+benefits+of+Christ%E2%80%99s+sufferings+and+death+belong%3F+And+how+Christ+is+said+to+die+for+all%E2%80%A6%E2%80%99+in+Zachary+Ursinus%2C+Sum+of+Christian+Religion%E2%80%A6+%28London%3A+Young%2C+1645%29+Pareus+%28d.+1622%29%2C+pp.+807-9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff4cb1cf30b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f4cb1cf30b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=we%20affirm%2C%20that%2C%20according%20to%20the,monstrous%20are%20these%20to%20Christian%20ears&amp;text=we%20affirm%2C%20that%2C%20according%20to%20the%20same%20Scripture&amp;text=but%20how%20monstrous%20are%20these%20to%20Christian%20ears" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d45da0a230" data-kw="">
<blockquote><p>Especially since Robert Godfrey’s dissertation on the British delegation’s moderating influence at the Synod of Dordt, most scholars have accepted the fact that the Second Main Doctrine at Dordt responding to the Remonstrants’ Second Article [on the Atonement] was written in such a way as to make room for English hypothetical universalism. To be sure, it did not positively countenance such a view, but it allowed someone like Davenant to subscribe to the Canons. We know that all the British delegates signed the Canons and publicly supported their publication. Ten years after the Synod, Davenant confessed, ‘As for the Synod of Dort, wee may bouldly affirm, that there is no one of the 5 points there determined, but iumps with the doctrine w[hi]ch our Professors in the Chair, &amp; our Preachers in the pulpit have commonly taught with the approbation of our church.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-lynch.html">Michael Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John Davenant’s Hypothetical Universalism: a Defense of Catholic &amp; Reformed Orthodoxy Pre</cite>, (Oxford Univ. Press, 2021), p. 85</span></figcaption>

</figure><figure class="quote" id="q-65c6534128" data-kw="">
<blockquote><p>The doctrine of hypothetical universalism acted as a corrosive factor in the French Reformed Church. Tolerated at first because it was felt that an outright condemnation would lead to schism, it slowly undermined respect for the confessional standards and disrupted internal unity and cohesion… it did provide a bridge toward Arminianism and perhaps toward the Semi-Pelagian tendencies of the Church of Rome. The advantages that Amyraut had envisioned failed to materialize, and the dangers against which his opponents had warned did in fact eventuate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/roger-r-nicole.html">Roger R. Nicole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Standing Forth: Collected Writings of Roger Nicole</cite>, (Mentor, 2018), p. 326</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

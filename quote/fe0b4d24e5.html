<main class="wrap"><figure class="quote" id="q-fe0b4d24e5" data-kw="">
<blockquote><p>Indeed it was the divisions and heights run into by some who joined in that rising, contrary to the inclinations of the better and greater part, with the indiscretion rashness, and ill conduct, not to say cowardice of Robert Hamilton, who took the command upon him, which ruined that design, and effectually broke all their measures, much more than any opposition which was or could he made by the king’s troops. And the terrible handle made of this rising by the bishops and violent party in the government, in severities, circuits, aud oppression of all presbyterians for many years after it was over…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution</cite>, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3, pp. 51-52</span></figcaption>

</figure><figure class="quote" id="q-3a911fc282" data-kw="">
<blockquote><p>Fifthly, when you are to choose what minister or church you will statedly have your ordinary communion with, you should not prefer a less reformed church or a less worthy pastor, or one that is erroneous, before a better, but choose that which is most to your true edification. Sixthly, if you live under a worse and unreformed Church, or unprofitable minister, if necessity hinder not, you may remove your dwelling to a better. Seventhly, and where churches are near and there is no great hurt or disorder [that] will follow it, you may join with another church without removing your dwelling: But this you may not do when the hurt to the public is like to be greater than the good to you. Eighthly, and you must not conclude that the more faulty church and minister may not lawfully be communicated with though for your benefit you choose a better, for this is the true crime of sinful separation. But surely a man’s soul is so precious that all men should prefer the greatest helps for their salvation before the less; and think no just means too dear to purchase them.</p></blockquote>

</figure><figure class="quote" id="q-ad44db6a3d" data-kw="">
<blockquote><p>3. Unity consists in joining with and cleaving to the Church in all these acts of communions with her that the Lord has made our duty, so that it is not only schism to depart from a Church (without just cause) that we have been joined to, but not to join with some society of Christians when it is possible for us and when we can do it without sin; the former may be called a positive, this [latter] a negative separation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), sect. 10 Rule was a Scottish divine-right presbyterian., p. 247</span></figcaption>

</figure><figure class="quote" id="q-9f457c32af" data-kw="">
<blockquote><p>As to the charge of schism, they,” viz. the Assembly’s committee, “admit that difference in judgment in some particular points is no schism, nor does an inconformity to some things enjoined deserve that name; but our Brethren” (says that committee) “desire further to set up separate communions, which is a manifest rupture of our societies into others, and is therefore a schism in the body: This is setting up altar against altar, allowing our Churches to be true Churches, as the Independents do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

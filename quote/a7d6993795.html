<main class="wrap"><figure class="quote" id="q-a7d6993795" data-kw="">
<blockquote><p>First here observe, that the Law of God is made perpetual and unchangeable: If any man ask how this can be, seeing the Apostle saith, The Law is changed?

Answer. The Law is threefold; Ceremonial, Judicial, and Moral, as hath been said: now that place is principally to be understood of the Ceremonial law, which indeed is abrogated, in regard of the observation of it in God’s worship; but in the scope and substance of it, which is Christ crucified, with his benefits, whom it shadowed out, it remaineth still, and is now more plain then ever it was.

As for the Judicial law, though it be abrogated unto us, so far forth as it was peculiar to the Jews; yet, as it agrees with common equity, and serves directly to establish the precepts of the Moral law, it is perpetual. If it be said, that Christ changed the Moral law, in changing the Sabbath day, from the seventh day to the eight: I answer, Christ did so indeed by his Apostles, but that is no change of the substance, but of the ceremony of the Sabbath: for the substance of that law is, the enjoining of a seventh day’s rest unto the Lord. Now though the seventh day from the creation be not kept, yet a seventh day is kept still.

If it be further said, that the Law it self is abrogated; for that every one that breaketh the Law is not accursed, according to the sentence thereof, Deut. 27. 26.

Answer. We must know that the Law is but one part of God’s word, and the Gospel another, revealing another part of Gods will, besides that which the Law made known; for it adds a qualification to the Law, moderating the rigour thereof, after this manner: He is accursed (saith the Law) that faileth in any commandment, except (saith the Gospel) he be reconciled again in Christ, and in him have the pardon of his transgressions. And yet the Moral law remains for ever a rule of obedience to every child of God, though he be not bound to bring the same obedience for his justification before God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A godly and learned exposition of Christ’s Sermon in the Mount</cite>, (Cambridge: University of Cambridge, 1608), pp 74-75.</span></figcaption>

<blockquote><p>The basic principle in application is to know whether the passage is a statement of the law or of the gospel. For when the Word is preached, the law and the gospel operate differently. The law exposes the disease of sin, and as a side-effect, stimulates and stirs it up. But it provides no remedy for it. However the gospel not only teaches us what is to be done, it also has the power of the Holy Spirit joined to it….A statement of the law indicates the need for a perfect inherent righteousness, of eternal life given through the works of the law, of the sins which are contrary to the law and of the curse that is due them…. By contrast, a statement of the gospel speaks of Christ and his benefits, and of faith being fruitful in good works</p></blockquote>

<blockquote><p>There be some which divide the holy Scriptures into four parts, and describe some books as well of the Old Testament as of the New to laws, some to histories, some to prophecies, and other some again to wisdom. But it is not meet to divide the books of the holy Scriptures from one another, because that in the books of Exodus, Leviticus, Numbers, and Deuteronomy, in which they appoint laws to be contained, are found almost as many histories as laws. Besides that in the books which they assign to prophets, laws of living uprightly are sometimes written and clearly expounded. Neither can we properly separate the books of Solomon and other of the kind (which they will have proper to wisdom) from laws and prophecies. For there are in them sentences here and there written, which serving for the instruction of life, have also without controversy the nature of laws. Further for the that in them are very many secrets opened unto the church by the inspiration of the Spirit of God, they pour undoubtedly into the attentive hearers, oracles of things to come, It may easily be granted, that all these things which they make mention of, are found in the holy books: I mean the precepts of living, notable histories, prophecies of things to come, and also most wise sentences and sayings: but in such […], that in manner in every book they are set forth unto us dispersedly, neither yet would I that these holy books should be divided from one another by these ends and limits. I would rather think as the learned […] do also judge, that whatsoever things are contained in the holy scriptures should be referred unto to principal heads, the law I mean and the gospel. For everywhere are declared unto us either the precepts of God of upright living, as when we are reproved to have strayed from them by reason of weakness or else of malice, gospel is lay forth before us, wherein by Christ that thing wherein we have offended is pardoned and the strength and power of the Holy Spirit promises us, to restore us again to the image of God, which we had lost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Master Peter Martyr Vermigli upon the Book of Judges</cite>, ….(London, 1564), fol. 1.. Spelling modernized.</span></figcaption>

</figure><figure class="quote" id="q-b7433537d5" data-kw="">
<blockquote><p>Since the moral law is the rule of life and conduct, which law is comprised in the decalogue, or ten commandments, it will be necessary to give an exposition of it. But first we must make a few preliminary observations. This law is divided into two tables, one of which contains the sum of the obedience we owe to God, the other of that which we owe to man; it is also divided into ten commandments, of which the first four relate to the first, the last six to the second table.

Again, there are certain rules for explaining the decalogue. The first rule is, that the negative are included in the affirmative, and the affirmative in the negative precepts, for what is good cannot be performed, without the opposite evil being avoided, nor the forbidden evil be avoided, without the opposite good being performed.

The second rule is, that under one species, which is expressed, all the species of the same genus are comprehended; and where one fault is prohibited, all others of the same kind, and analogous to it, together with every thing that tends or leads to it are also prohibited.

The third rule is, that the cause is included in the effect, the species in the genus, the correlative in the relative.

The fourth rule is that the law regulates not only the outward actions. but also the inward thoughts of the mind. “For the law is spiritual,” as St. Paul says; (Rom. vii. 14,) nor is the case the same with the heavenly Lawgiver, who searcheth the reins and the heart, as with an earthly lawgiver, who only takes cognizance of that which meets the senses.

The fifth rule is, that love is the sum and end of all the commandments.

The sixth rule is, that the affirmative precepts are not always binding, but admit of various interpretations and modifications according to time and place; for instance, a son is not always bound to obey his father; but the negative precepts are always binding, at all times, and in all places, without any regard to circumstances.

Moreover, there are certain rules of the obedience which is due to the law—it must be sincere, universal, perfect, and persevering. It must be performed by the whole man—the love of our neighbour must be subject to the love of God—and we must pay greater obedience to the moral precepts of the second table, than to the ceremonial precepts of the first, because God will have mercy, and not sacrifice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 8.8, pp 389-90.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Since the moral law is the rule of life and conduct, which law is comprised in the decalogue, or ten commandments, it will be necessary to give an exposition of it. But first we must make a few preliminary observations. This law is divided into two tables, one of which contains the sum of the obedience we owe to God, the other of that which we owe to man; it is also divided into ten commandments, of which the first four relate to the first, the last six to the second table.

Again, there are certain rules for explaining the decalogue. The first rule is, that the negative are included in the affirmative, and the affirmative in the negative precepts, for what is good cannot be performed, without the opposite evil being avoided, nor the forbidden evil be avoided, without the opposite good being performed.

The second rule is, that under one species, which is expressed, all the species of the same genus are comprehended; and where one fault is prohibited, all others of the same kind, and analogous to it, together with every thing that tends or leads to it are also prohibited.

The third rule is, that the cause is included in the effect, the species in the genus, the correlative in the relative.

The fourth rule is that the law regulates not only the outward actions. but also the inward thoughts of the mind. “For the law is spiritual,” as St. Paul says; (Rom. vii. 14,) nor is the case the same with the heavenly Lawgiver, who searcheth the reins and the heart, as with an earthly lawgiver, who only takes cognizance of that which meets the senses.

The fifth rule is, that love is the sum and end of all the commandments.

The sixth rule is, that the affirmative precepts are not always binding, but admit of various interpretations and modifications according to time and place; for instance, a son is not always bound to obey his father; but the negative precepts are always binding, at all times, and in all places, without any regard to circumstances.

Moreover, there are certain rules of the obedience which is due to the law—it must be sincere, universal, perfect, and persevering. It must be performed by the whole man—the love of our neighbour must be subject to the love of God—and we must pay greater obedience to the moral precepts of the second table, than to the ceremonial precepts of the first, because God will have mercy, and not sacrifice.”

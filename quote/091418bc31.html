<main class="wrap"><figure class="quote" id="q-091418bc31" data-kw="">
<blockquote><p>Sixthly, as things are yet with us [congregationalist churches], there is no such great reason of that outcry there is amongst us against gathering of churches [out of other churches] as so great a dividing practice as many seem to make it. How can this practice be so very offensive when almost all of you [non-Independents] think it lawful for a man for any commodiousness to remove from that church of which now he is, to join with another, sobeit he will remove his dwelling?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum, to the Lovers of Truth and Peace. Heart-Divisions Opened</cite>, … (London, 1653), ch. 23, p. 164</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-236068a358" data-kw="">
<blockquote><p>Consider that a separation, when not upon clear and just grounds, is a greater sin before God, and more piercing to the heart of Christ, than either murder or adultery, etc. because this is to dissolve the union of his Church and to divide Christian societies. Whosoever shall be found to plead for this, I dare affirm he blows that fire with his breath, which Christ would quench with his blood. My dear friends, weigh seriously, as before the Lord, how Jesus Christ will take it at any man or woman’s hand to tear the commission of any of his ambassadors, whom he will still own as an ambassador, and as negotiating a peace between God and sinners: Sure I need neither tell you that withdrawing from hearing such is a tearing their commission; nor need I tell you that this will be found a sin more hateful and heinous in the sight of Jesus Christ than many others that appear more black.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-6962706faa" data-kw="">
<blockquote><p>5. Whereas ye [David Dickson and Alexander Henderson] alledge, that if some members of this Kirk had not cared more kindly in this time of common danger than others have done, the whole body had been ere now dangerously, if not desperately, diseased. We answer that we most heartily wish, any disease of this Church, to be timeously prevented and cured. But withal we wish this to bee done without a rupture, and such a dangerous division: chiefly seeing our Church is not infected with any such errors, nor is in such dangers as may give just occasion of so fearful a division: which in itself is a sore disease, and from which in holy Scripture we are often and very earnestly dehorted. Dionysius Bishop of Alexandria, in his Epistle to Novatus, recorded by Eusebius, Histories, bk. 6, ch. 45, worthily says: ‘You ought rather to have suffered anything whatsoever for avoiding of cutting asunder the Kirk of God: and martyrdom for keeping the Kirk from schism is no less glorious than which is suffered for not committing idolatry. And in my opinion also it is greater: for in suffering martyrdom for not committing idolatry, a man suffers for one, even for his own soul; but here a man suffers martyrdom for the whole Kirk.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scottish-aberdeen-doctors.html">Aberdeen Doctors</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Duplies of the Ministers &amp; Professors of Aberdeen to Second Answers of some Reverend Brethren, concerning the Late</cite>, [National] Covenant (Aberdeen: Raban, 1638), p. 11</span></figcaption>

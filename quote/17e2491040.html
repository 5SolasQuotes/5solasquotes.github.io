<main class="wrap"><figure class="quote" id="q-17e2491040" data-kw="">
<blockquote><p>GOD therefore is all places at once, not only by his virtue and power, but in his whole infinite essence; yet we must not imagine grossly of him, to think that either he is mixed with the Creatures (for that is contrary to his most perfect, single nature) or that by the filth and contagion of the creature himself can be polluted: (for that is contrary to his most perfect holy nature:) but in such a sort he is present, as is heavenly and spiritual, and incomprehensible.

And albeit, by nature we seek God in the Heavens, and our Saviour Christ hath taught us to say, Our Father which art in Heaven, that is not in respect of his essence; and as I may say, of his very presence, that he is rather in Heaven then in Earth, or dwelleth rather in his Church, then in prophane Synagogues; in the hearts of his Saints, then in the wicked: but in respect of his working, and more special grace, or of the clearer manifestation of his glory, as he saith, In Heaven is my Throne. And the Prophet DAVID, In his Temple he uttereth all his glory. And that this every-where-presence doth only belong to God, appeareth in that by this note, he differenceth himself from all other Creatures.

For when he saith, Do not I fill Heaven and Earth? he meaneth, that none other doth so. It is to be observed, that he saith there, Am I a God near at hand (saith JEHOVAH) and am I not a God far off? Do I not fill Heaven and Earth? As if he had said that, which none but God can challenge. God therefore is only Infinite: He only is that Circle, whose Centre is every where, and Circumference no where, who alone measureth the Waters in his fist, and counteth the Heavens with a span. As the Prophet would have us to understand, when he setteth the same, as a spell to any whatsoever, that foolish men shall dare to make like unto him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Sacred Divinity Briefly &amp; Methodically Propounded: More Largely &amp; Clearly Handled and Explained</cite>, (London: William Stansby, [1625]), 1.1, pp 20-21.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ea4e2273a8" data-kw="">
<blockquote><p>The most fundamental reason [for Thomas] why God’s perfection is infinite is that act is limited only insofar as it is received in a potency. ‘But God is act in no way existing in another, for neither is He a form in matter… nor does His esse inhere in some form or nature, since He is His own esse… It remains, then, that God is infinite” (prgr. 5). In other words: “…God, Who is pure act (actus purus) is infinite in His actuality (in sua actualitate)” (prgr. 6). He possesses esse, goodness, perfection not as participated, but by essence (his very esse in His goodness) and, therefore, He is infinite in goodness (prgr. 8-9). A further argument… proceeds from the fact that our ‘intellect… extends to the infinite in understanding…. But this ordination of the intellect would be in vain unless an infinite intelligible existed” (prgr. 10).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-l-balas.html">David L. Balas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Thomist View on Divine Infinity’ in Proceedings of the American Catholic Philosophical Association</cite>, vol. 55 (1981), pp. 91-98, pp. 93-94</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/infinity-and-immensity.html">Infinity and Immensity</a></span></div>

</figure><figure class="quote" id="q-7f9e890881" data-kw="omnipresence purity">
<blockquote><p>What place can defile a spirit? Is light polluted by shining upon a dunghill, or a sunbeam tainted by darting upon a quagmire? What can steam from the most noisome body, to pollute the spiritual nature of God? As he is of purer eyes than to behold iniquity, so he is of a more spiritual substance than to contract any physical pollution from the places where he doth diffuse himself.</p></blockquote>

<blockquote><p>A second reason to believe humans cannot grasp infinity is that the concept must contain an infinite number of sub-concepts, which is too many for our finite minds. A counter to this reason is to defend the psychological claim that if a person succeeds in thinking about infinity, it does not follow that the person needs to have an actually infinite number of ideas in mind at one time… Here is a simple argument that we can: If we understand negation and have the concept of finite, then the concept of infinite is merely the concept of not-finite.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/internet-encyclopedia-of-philosophy.html">Internet Encyclopedia of Philosophy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Infinite’</cite></span></figcaption>

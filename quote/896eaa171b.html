<main class="wrap"><figure class="quote" id="q-896eaa171b" data-kw="">
<blockquote><p>…our principle is that a man should part with what is dearest to him in the world to redeem the peace and unity of the Church; yea, that nothing can warrant or excuse it but the necessity of shuning sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), sect. 10 Rule was a Scottish divine-right presbyterian., p. 249</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>
<div class="actions"><button class="copy" data-copy="“…our principle is that a man should part with what is dearest to him in the world to redeem the peace and unity of the Church; yea, that nothing can warrant or excuse it but the necessity of shuning sin.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-acd534d569" data-kw="">
<blockquote><p>For some went a great length in compliance with the defections of these times [1662-1688]; others durst not comply… ministers and people were obliged to withdraw from these courses which they were convinced in their conscience to be sinful… But this was without any design ever to own these things to be sufficient grounds of separation in a constitute Church, or when with personal safety application could be made to settled Church judicatories who were not under the tyrannical influence of enemies to the work of God… Also there are many alive to this day who know when the Informatory Vindication [1687] was to be printed, that it was sent to Holland to be showed to some of us who were then abroad; and that we declared we could never own the grounds of separation laid down therein to justify a separation from a settled Church in a peaceable state [such as after 1690]… and for this cause it is often added as a qualification to the grounds of withdrawing that they were to be understood ‘in the case of such differences and so circumstantiate[d].’ Informatory Vindication, page 67, ‘In this broken and declining sate of the Church,’ ibid., page 73, 76, 78, 80, 82, 84, 86, 87, 88. To which also the worthy martyr Mr. James Renwick, minister of the Gospel, assented.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-shields.html">Alexander Shields</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Enquiry into Church-Communion, or a Treatise against Separation from the Revolution Settlement of this National Church, as it was settled anno 1689 and 1690</cite>, ed. (1706; Edinburgh: William Gray, 1747) 154 pp. no ToC, pp. v-vi</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>
<div class="actions"><button class="copy" data-copy="“For some went a great length in compliance with the defections of these times [1662-1688]; others durst not comply… ministers and people were obliged to withdraw from these courses which they were convinced in their conscience to be sinful… But this was without any design ever to own these things to be sufficient grounds of separation in a constitute Church, or when with personal safety application could be made to settled Church judicatories who were not under the tyrannical influence of enemies to the work of God… Also there are many alive to this day who know when the Informatory Vindication [1687] was to be printed, that it was sent to Holland to be showed to some of us who were then abroad; and that we declared we could never own the grounds of separation laid down therein to justify a separation from a settled Church in a peaceable state [such as after 1690]… and for this cause it is often added as a qualification to the grounds of withdrawing that they were to be understood ‘in the case of such differences and so circumstantiate[d].’ Informatory Vindication, page 67, ‘In this broken and declining sate of the Church,’ ibid., page 73, 76, 78, 80, 82, 84, 86, 87, 88. To which also the worthy martyr Mr. James Renwick, minister of the Gospel, assented.”

— Alexander Shields, An Enquiry into Church-Communion, or, A Treatise Against Separation from the Revolution Settlement of this National Church, as it was settled in 1689 2nd ed. (1706; Edinburgh: William Gray, 1747) 154 pp. no ToC, pp. v-vi">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+some+went+a+great+length+in+compliance+with+the+defections+of+these+times+%5B1662-1688%5D%3B+others+durst+not+comply%E2%80%A6+ministers+and+people+were+obliged+to+withdraw+from+these+courses+which+they+were+convinced+in+their+conscience+to+be+sinful%E2%80%A6+But+this+was+without+any+design+ever+to+own+these+things+to+be+sufficient+grounds+of+separation+in+a+constitute+Church%2C+or+when+with+personal+safety+application+could+be+made+to+settled+Church+judicatories+who+were+not+under+the+tyrannical+influence+of+enemies+to+the+work+of+God%E2%80%A6+Also+there+are+many+alive+to+this+day+who+know+when+the+Informatory+Vindication+%5B1687%5D+was+to+be+printed%2C+that+it+was+sent+to+Holland+to+be+showed+to+some+of+us+who+were+then+abroad%3B+and+that+we+declared+we+could+never+own+the+grounds+of+separation+laid+down+therein+to+justify+a+separation+from+a+settled+Church+in+a+peaceable+state+%5Bsuch+as+after+1690%5D%E2%80%A6+and+for+this+cause+it+is+often+added+as+a+qualification+to+the+grounds+of+withdrawing+that+they+were+to+be+understood+%E2%80%98in+the+case+of+such+differences+and+so+circumstantiate%5Bd%5D.%E2%80%99+Informatory+Vindication%2C+page+67%2C+%E2%80%98In+this+broken+and+declining+sate+of+the+Church%2C%E2%80%99+ibid.%2C+page+73%2C+76%2C+78%2C+80%2C+82%2C+84%2C+86%2C+87%2C+88.+To+which+also+the+worthy+martyr+Mr.+James+Renwick%2C+minister+of+the+Gospel%2C+assented.%E2%80%9D%0A%0A%E2%80%94+Alexander+Shields%2C+An+Enquiry+into+Church-Communion%2C+or%2C+A+Treatise+Against+Separation+from+the+Revolution+Settlement+of+this+National+Church%2C+as+it+was+settled+in+1689+2nd+ed.+%281706%3B+Edinburgh%3A+William+Gray%2C+1747%29+154+pp.+no+ToC%2C+pp.+v-vi&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Facd534d569.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/acd534d569.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cameronianism/#:~:text=For%20some%20went%20a%20great%20length,Renwick%2C%20minister%20of%20the%20Gospel%2C%20assented&amp;text=For%20some%20went%20a%20great%20length%20in%20compliance&amp;text=Mr.%20James%20Renwick%2C%20minister%20of%20the%20Gospel%2C%20assented" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4ae8fece6a" data-kw="">
<blockquote><p>And when Robert Hamilton came from abroad [from the Netherlands] among them, they got a brow of brass, calling him [i.e. Alexander Shields, one of the last three Cameronian ministers] a liar, and upbraided him to his face, saying, although he used these arguments [to join the 1690 Church of Scotland] to draw them out of the way of the Lord, yet you dare not publish them. I well remember he said, ‘Dare I not? dare I not? I promise before you all, I both dare and will, and avow it before the world.’ [which he did] But alas they still gave us a deaf ear, and now will not be spoken to nor plead with; however it stands for our mite of testimony… But, if the Lord spare, I resolve to give the world a more surprising account of the rude treatment and unheard-of ingratitude Mr. Shields, [Thomas] Linning [another of the last three Cameronian ministers, which joined the 1690 Church of Scotland], and others received at that time, and since, at their hands… …all know that it was the fewest number of the United Societies, that was led off with Robert Hamilton to the disowning of King William as King of Britain and his Government; the greater part [of the Cameronians] reckoned it their duty to take a legal unite way of witnessing, by humble pleadings, representations, and protestations, pleading for and with their mother to put away her whoredoms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-walker.html">Patrick Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Six Saints of the Covenant in 2 vols</cite>, ed. David H. Fleming (London: Hodder &amp; Stoughton, 1901), vol. 1, Alexander Peden’s Life, Postscript, pp. 146-47</span></figcaption>

</figure><figure class="quote" id="q-e62e1697b8" data-kw="">
<blockquote><p>Many will tell how Church officers should walk, that never look on themselves as obliged to follow their steps in the way of holiness; yet the way of holiness is but one to ministers and people, though many are ready to make two of them, and take the broadest to themselves.</p></blockquote>

</figure><figure class="quote" id="q-5f4e797454" data-kw="">
<blockquote><p>It is no new thing to see men (happy in the greatest attainments of human learning, and blessed with the influences and graces of the Spirit of God while in this militant state, where great fogs of ignorance cloud the understandings of the best) differ in their judgments about sin and duty; since one way of thinking, and an entire harmony of judgments is reserved as a valuable jewel of that crown of glory which shall encircle the happy heads of the Church triumphant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-2764fbc164" data-kw="">
<blockquote><p>…suppose the 〈◊〉 of churches in a city meet at nine of the clock for God’s 〈◊〉, and in the country parishes adjoining, where many people live at a great distance from their churches, they meet at ten or half an hour after nine, nay in the same church at one and the same time [as they have feed animals, etc. and can’t leave sooner], whilst the Word of God is read or preached, those that sit in seats may have their heads uncovered, and those that stand in allies may keep on their hats the whole sermon〈◊〉, because the crowd or throng may render it inconvenient to keep them off. Now in both these instances there is not uniformity in the same circumstances, and yet there may be order observed, and confusion may very well, notwithstanding, be avoided in all the parts of God’s worship and service.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Uniformity in Human Doctrinal Ceremonies ungrounded on 1 Cor. 14:40</cite>, p. 79 in A Second Part of the Mixture of Scholastical Divinity... (Oxford, 1660) Jeanes was an English presbyterian.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<blockquote><p>[Durell:] ‘In all Reformed churches men use to enter into the places of public worship with their hats off.’ This is a most notorious — nothing being more usual in some Reformed churches than to pass through and through the places of worship, never stirring their hats: But if he would have the saying understood of men’s putting off their hats when they enter into the place of public worship, whilst the congregation is worshipping, then must this speech be placed where it is already placed, among the gentleman’s impertinencies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-hickman.html">Henry Hickman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bonasus vapulans</cite>, [A Bull being Whipped], or, Some Castigations given to Mr. John Durell for Fouling Himself &amp; Others in his English &amp; Latin Book by a Country Scholar (London, 1672) Hickman (bap.1629-1692) was an English puritan who was ejected in 1662., pp. 82-83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

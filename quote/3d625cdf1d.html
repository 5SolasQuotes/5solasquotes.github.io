<main class="wrap"><figure class="quote" id="q-3d625cdf1d" data-kw="">
<blockquote><p>I will utter My judgments against them concerning all their wickedness, because they have forsaken Me, burned incense to other gods, and worshipped the works of their own hands. (Jeremiah 1:16)

A friend of mine recently published a post on The contradiction of Christian Reconstruction, which highlighted the inconsistency of those who claim to be upholding the law of God in society while they refuse to uphold the regulative principle of worship. Despite the good intentions of many Reconstructionists [1], their failure to adopt the Reformed approach to worship means that if they were to come to power they would quickly provoke the wrath of God against society.

As John Calvin explains when commenting on the above text, ‘The Jews had, indeed, in various ways, provoked his vengeance; but he mentions here one kind of wickedness, because it was the very fountain of evils, – they had departed from the law and the pure worship of God’. [2] Since most Christian Reconstructionists reject the requirements of God’s law in relation to worship (which is the most important part), Reconstructionism is self-contradictory and self-defeating. In the name of upholding God’s law, they reject God’s law in the sphere of worship. In the name of bringing society under Christian standards, they promote humanism in the realm of what most intimately pertains to Christ’s glory. Hence all that Christian Reconstructionism will ultimately achieve is the provocation of Divine wrath against the society in which it is embraced.

[1] Some Reconstructionists do affirm the regulative principle of worship, but they are a minority. I accept the basic aims of Reconstructionism (God’s law and postmillennialism), but eschew their Kuperianism, Neo-Calvinism, liturgical antinomianism, low views of the church, non-confessionalism, latitudinarianism, small governmentism, and American morality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the book of the prophet Jeremiah and the Lamentations</cite>, trans. and ed. John Owen (Geneva, 1589) in Calvin’s commentaries (22 vols, Grand Rapids, 1993), ix, 59.</span></figcaption>

<blockquote><p>4. Pride and contempt are only seen to God: Prelates have no place to punish heart-acts; they are to prove by two witnesses the malice, and pride, and contempt of authority; but this is invisible to men’s eyes. Refusal of obedience to canons touching indifferent things, the necessity whereof (as the doctor must say) comes only from man’s will, cannot be contempt: The neglect of a command of God is indeed a virtual contempt of the majesty, authority, power and justice of God, because a command of God has essentially, equity and justice in it, from God’s commanding Will: But a command of a thing indifferent, that may as well, without sin, be left undone, as done (as our doctor says of our ceremonies) can never have equity or goodness from human authority; and I never contemn human authority except I contemn the just laws made by human authority.</p></blockquote>

</figure><figure class="quote" id="q-b9b8cf2032" data-kw="">
<blockquote><p>Unless they will abolish their laws and ordinances and restore to Christ’s churches their liberty and have it taught among them, they are guilty of all the souls that perish under this miserable captivity, and the papacy is truly the kingdom of Babylon and of the very Antichrist. For who is “the man of sin” and “the son of perdition” [II Thess. 2:3] but he who with his doctrines and his laws increases the sins and perdition of souls in the church, while sitting in the church as if he were God? [II Thess. 2:4]. All this the papal tyranny has fulfilled, and more than fulfilled, these many centuries. It has extinguished faith, obscured the sacraments and oppressed the gospel; but its own laws, which are not only impious and sacrilegious, but even barbarous and foolish, it has decreed and multiplied without end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Babylonian captivity of the church</cite>, (1520) in Luther’s works, trans. A. T. Steinhauser, ed. A. R. Wentz (55 vols, Philadelphia, 1959), xxxvi, 72-3.</span></figcaption>

</figure><figure class="quote" id="q-3143010d1a" data-kw="">
<blockquote><p>17. It having been the custom of the Church in the apostles’ days, to have ordinarily many officers in a Church, and the private part of the ministerial duty being so exceeding great and of indispensible necessity where it can be performed, and also because it is less satisfactory and convenient for one minister alone to try cases where more may be had, we therefore judge it needful to use all lawful means to procure more ministers or elders than one in each church, even proportionable to the number of souls and greatness of the Word; And if for want [lack] of men or maintenance, there cannot learned men be obtained, we judge it fit to take the assistance of sober, orthodox, judicious persons of competent ability for private instruction and oversight, and ordained to this work, though defective in learning and less able to publicly teach, and who may leave public speaking to him that is more able and do the more of the less public work, and that such if other maintenance be wanting, may lawfully and fitly labor with their hands: And as long as we agree that these elders are ordained church officers, and what shall be their work, there needs to be no breach among us, though we determined not of their power in sacraments and whether their office be the same with the teaching elders: Whilst we agree in practice, we may leave men’s several principles in such a difficult controverted point to their own judgments…</p></blockquote>

<blockquote><p>Therefore, though it is to be wished and endeavored that all elders may have due qualifications for all these things and though special care is to be taken everywhere to choose the most qualified, yet in particular congregations men may be chosen elders who have not such a measure of all these qualifications, they being otherwise men of a blameless and Christian conversation and having such a measure of knowledge and prudence as is fit for governing that congregation and judging of the things that are handled in the session thereof, which for the most part are matters of scandal and trying and admitting of penitents; but if there be any who are not of a blameless and Christian conversation and have not some measure of these qualifications required by the Word of God in a ruling elder, no congregation ought to choose any such, nor any session or presbytery to admit them to the charge…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Ruling Elders &amp; Deacons</cite>, … (d. 1661; Edinburgh: Anderson, 1690), ch. 7, pp. 60-61</span></figcaption>

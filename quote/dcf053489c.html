<main class="wrap"><figure class="quote" id="q-dcf053489c" data-kw="">
<blockquote><p>But seeing the Law cannot contradict the Gospel, and speaketh nothing of a Surety and Mediator, and so is negatively diverse from the Gospel, yet positively it is not contrary, nor denyeth that there ought to be a Mediator (for so should there be two contrary wills in God, and so it had been injustice, and against a just law, that God should send his Son to die for sinners.)

It is the same very obedience commanded in the Law, as a strict covenant of works, to be done by strength from our own nature, and for the authority of the Law-giver, and the love of God, and now enjoined in a mild covenant of grace, from the strength of the grace of Christ, and now not only acteth on us by Legal motives, the love of God, the authority of the Law-giver, (which the Gospel excludeth not) but upon the love of a free Redeemer and Ransom-payer: as it may be the same debt, which a man payeth of his own proper goods, and of the money borrowed from a rich friend.

1 Perfect obedience, which the Law requireth, and imperfect obedience which the Gospel accepteth (for it requireth perfection as well as the Law doth) are but gradually differences; as the same sum of gold, though clipped, if accepted by the creditor as full payment, the rest which is wanting being pardoned, may in grace and value, bee as good as the full payment. It is the Law that commandeth the love of God, under pain of eternal death, for the least fail, and by way of a covenant of works. Now the tenure of a covenant of works is an accident of the Law.

2 A new obligation of obedience varieth not the nature of it; as it is the same moral obedience that God commanded to the heathen, and the Jews, but that it was written and preached to Jews, addeth more guiltiness, when they disobey, and these same duties that Moses commanded of righteousness, holiness, and sobriety, Exod. 20. doth the grace of the Gospel enjoin. Tit. 3.11. and the Apostles command as acts of sanctification; and though Moses should not command them by the motives of the grace of Redemption (which yet is false, except when he presseth the Law as a covenant of works) yet Gospel-motives vary not the nature of duties: as a Master may command the same duties to his son and his servant, upon different grounds.

3 The Gospel abateth nothing of the height of perfection, in commanding what ever the law commandeth in the same perfection; for tis as holy, pure, and spiritual in commanding, we be perfect as our heavenly Father, and holy, as he is holy, as the Law is. In acceptation of grace, the Gospel accepteth less then the law, but commandeth no less, therefore the Gospel granteth pardons, but no dispensations; the Law though it deny not pardons, nor forbid them positively, yet it granteth neither.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 2.7, pp 7-8.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-feec0879c4" data-kw="">
<blockquote><p>If the things themselves are promised in the covenant, then all those with whom this covenant is made must be really and effectually made partakers of them. But this is not so; they are not all actually sanctified, pardoned, and saved, which are the things here promised.&#x27; Ans. The making of this covenant may be considered two ways:

1. As unto the preparation and proposition of its terms and conditions.

2. As unto the internal stipulation between God and the souls of men. In this sense alone God is properly said to make this covenant with any. The preparation and proposition of laws are not the making of the covenant. And therefore all with whom this covenant is made are effectually sanctified, justified, and saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:10; Works, vol. 22, p. 179</span></figcaption>

</figure><figure class="quote" id="q-e15b92bbbb" data-kw="">
<blockquote><p>The covenant of grace is, properly speaking, an unconditional covenant. The conditions have been fulfilled for us by Christ, the covenant head of elect humanity (though we can refer to saving faith as a condition, but only in an improper sense). As Ralph Erskine argues:

This is the condition of the New Covenant. The Covenant of Works had only the active obedience of the first Adam for its condition; but the condition of the Covenant of Grace properly, is both the active and passive obedience of the second Adam, his doing and dying. Now, Lord, have respect to that blood that sealed the covenant; since the condition is fulfilled to thy infinite satisfaction, let the promised good be conferred upon me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith’s Plea Upon God’s Covenant: A Sermon on Psalm LXXIV. 20</cite>, (Falkirk: T. Johnston, 1821), p. 8.</span></figcaption>

</figure><figure class="quote" id="q-93fca1848a" data-kw="parties">
<blockquote><p>There is not the same signification attached to God’s covenant in the Scriptures. It denotes properly a pact and agreement entered into between God and man, consisting partly in a stipulation of duty (or of the thing to be done) and partly in the promise of a reward (which is the meaning in Gen. 17:2 where God is said to wish to make a covenant with Abraham). At one time it is taken improperly for a simple promise (as the promise not to destroy the world again by a flood is called a covenant, Gen. 9:9). At another time, it is taken metonymically for the symbols and sacraments of a covenant: as circumcision is called a covenant (Gen. 17); the eucharistic “cup” is said to be “the new testament in the blood of Christ” (Lk. 22:20), i.e., a sign and seal of it; then for “the tables of the covenant” laid up in the ark (1 K. 8:21); again for the “covenanted people,” as the people of God are called “the holy covenant” (Dan. 11:28, 30); and for the Messiah, the foundation of that covenant, in whom it is made with us (“I will give thee for a covenant of the people,” Is. 49:8). But we, dismissing the improper significations, attend here to the proper signification, when we dispute concerning the covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.1.8</span></figcaption>

</figure><figure class="quote" id="q-38cceed04f" data-kw="">
<blockquote><p>Is it not a point worth our learning to know the constancy of God’s love, with whom we are in a gracious covenant? And then again, we learn much wisdom how to manage our life hereby, even in the intercourse of our changes, to be now rich, now poor, now high, now low in estate. Wisdom is gotten by experience in variety of estates. He that is carried on in one condition, ho hath no wisdom to judge of another’s estate, or to carry himself to a Christian in another condition, because he was never abased himself. He looks very big at him. He knows not how to tender another, that hath not been in another’s condition. And therefore to furnish us, that we may carry our selves as Christians, meekly, lovingly, and tenderly to others, God will have us go to heaven in variety, not in one uniform condition in regard of outward things.

Use. Learn hence not to quarrel with God’s government; for though he alters our conditions, yet he never alters his love. A Christian is unmoveable in regard of the favour of God to him, and in regard of sanctifying grace. …

[W]e must learn the doctrine of the covenant of grace, that God in Christ is become a Father to us, and carries a fatherly mind to us. In what condition soever we are, he is a father still, and intends us well, and will provide for us in the hardest condition. Having took the relation of a father upon him, do you think that he will fail in the carriage of a father towards us? He is pitiful to us, he respects us in the basest condition. He that knows God to be his father, cast him into what condition you will, knows he hath a good portion. …

What a blessed thing is it to be in the covenant of grace, to have God to be our father, to be in Christ, that let our condition outwardly be what it will be, we shall have grace to carry ourselves in it, God will go along with us by his Holy Spirit!</p></blockquote>

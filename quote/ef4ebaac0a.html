<main class="wrap"><figure class="quote" id="q-ef4ebaac0a" data-kw="">
<blockquote><p>I Fear many of you come hither to gaze rather then to be edified by the carriage and last words of a dying man, but if any have an ear to hear, as I hope some of this great Confluence have, I desire your audience as to a few words: I am come hither to lay down this earthly tabernacle and mortal flesh of mine; and I bless God I do it willingly, and not by constraint, I say I suffer willingly, if I had been otherwise minded I might have made a diversion, and not been a prisoner, but I being conscious to my self of nothing worthy of death or bonds, I would not stain my conscience with the suspicion of guiltiness by my withdrawing. Neither have I wanted opportunity nor advantages to escape since I was a Prisoner: Not by the fault of my Keeper, God knows, but otherwise. But neither for this had I light or liberty, least I should reflect upon the Lord’s Name, and offend the Generation of the Righteous.

And if these men have not been mistaken or dealt deceitfully in telling me so, I might have avoided, not only the severity of the Sentence, but also had favour and countenance by complying with the course of the times: But durst not redeem my Life with the loss of my Integrity, God knows I durst not. And that since I was a Prisoner the Lord hath so held me by the hand, that he never suffered me to bring to debate in my inward thoughts, much less to propound or hearken to any Overtures in that kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true and perfect speech of Mr. James Guthrey, late minister of Sterling as it was delivered by himself immediately before his execution on June 1, 1661 at Edinburgh. Sent from Edinburgh, and printed for public satisfaction, and to prevent the dispersing of false copies</cite>, (Edinburgh, 1661), pp 3-5.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0214bc5af0" data-kw="">
<blockquote><p>God from eternity either approves or disapproves of something. Approval in general is either bare and without the decree, or it is with the decree. Approval without the decree is when God approves something simply, yet He does not decree that it be chosen or followed after. Approval without the decree belongs to all good things with respect to themselves, though they are not at any time realized, of which sort are the conversion, faith, and salvation of reprobates; which God surely approves of simply, but does not decree to come about; thus He decrees them not to come about… Concerning approval without the decree, see Dt. 5:29, “O that there were such a heart in them, that they would fear me and keep all my commandments always, that it might be well with them, and with their children forever!” 1 Tim. 2:4, “Who will have all men to be saved, and to come unto the knowledge of the truth.” 1 Tim. 4:10, “…who is the Savior of all men, specially of those that believe.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Brief Instruction on the Eternal Approval &amp; Disapproval of the Divine Mind’</cite>, trans. Charles Johnson &amp; Travis Fentiman (1593/4; ReformedBooksOnline, 2020), p. 3 Rollock here positis an eternal foundation for the revealed will of God, namely God’s will of approval and disapproval. This paradigm would continue through Rutherford and others.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>[Margin note:] How far the will of sign may be a will Question 33, Whether the will of sign may improperly and metonymically be the will of God? Response: The will of sign, according as it designates what is the pleasing and acceptable revealed will of God to us, that which is of our duty, so it is called the approving will, contradistinguished from the will of good-pleasure [of decree], and refers to two things:

1. To that which we ought to believe or do, inasmuch as that is obliging of consciences, since we ought to will to please God and will the reward of obedience following.

2. It refers to obedience, and this so far as God displays that to us by an act, either through special grace or a common concursus. The first will is of complacency and is properly called will, whose object is the duty of the rational creature. In this way God sincerely [serio] approves and wills obedience, and is pleased in this moral good as a rule and norm, and it is not less a will than that which is called of good-pleasure [or the will of decree]. But the latter way is not an executing will as the will of good-pleasure is, nor does God will, intend or decree through grace or concursus, to work in the creatures that which He commands or prohibits, because He commands or prohibits it. And in this way the will of sign is so far improperly called ‘the will of sign’; indeed, the punishment is called the wrath of God, because assuredly God punishes that which is done, as men are accustomed to do such being angry and in the passion of wrath, being aroused and agitated, although nonetheless, passions do not occur in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Scholastic Disputation on Divine Providence, chs. 1-10</cite>, (Edinburgh, 1649), Metaphysical Inquiries, p. 605 Trans. T. Fentiman. A ‘metonymy’ is something that is indirectly named by something closely related to it. Rutherford here delineates the eternal foundation of the will of sign, namely what Rollock had elucidated, the will of approval in God, which wills the goodness of things in and of themselves.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>48. In whatever God wills He is universally effectual; He is not hindered or frustrated in obtaining what He wills. For if He should properly will anything and not attain it He would not be wholly perfect and blessed. … 53. Those means through which that will is revealed are the ‘intention of the sign’ [voluntas signi]–rightly so called not only by metaphor because they show men what they mean, but also by metonymy because they are the effects or adjuncts or partial declarations of God’s own will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, (d. 1633; 1997), bk. 1, ch. 7, pp. 99-100</span></figcaption>

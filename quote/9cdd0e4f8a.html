<main class="wrap"><figure class="quote" id="q-9cdd0e4f8a" data-kw="">
<blockquote><p>Be sure to remember the interest of your Sovereign, the great Lord-protector of heaven and earth. And as ever you will make him a comfortable account of your power, abilities, and opportunities of serving him, see that you prefer his interest before your own, or any man’s on earth. If you go not thither as sent by Him, with a firm resolution to serve him first, you were better sit at home. Forget not that he hath laid claim to you, and to all that you have, and all that you can do.

I am bold with all possible earnestness to entreat you, yea, as Christ’s minister to require you, in his name, to study and remember his business and interest, and see that it have the chief place in all your consultations. Watch against the encroachments of your own carnal interests, consult not with flesh and blood, nor give it the hearing when it shall offer you its advice. How subtly will it insinuate! How importunately will it urge you! How certainly will it mar all, if you do not constantly and resolvedly watch! Oh how hard, but how happy is it to conquer this carnal self!

Remember still that you are not your own; that you have an unseen Master that must be pleased, whoever be displeased, and an unseen kingdom to be obtained, and an invisible soul that must be saved, though all the world be lost. Fix your eyes still on him that made and redeemed you, and upon the ultimate end of your christian race, and do nothing wilfully unworthy such a Master and such an end.

Often renew your self-resignation, and devote yourself to him; sit close at his work, and be sure that it be his, both in the matter, and in your intent. If conscience should at any time ask, Whose work are you now doing? or a man should pluck you by the sleeve, and say, Sir, whose cause are you now pleading? see that you have the answer of a christian at hand; delay not God’s work till you have done your own, or any one’s else.

You will best secure the commonwealth, and your own interest, by looking first to his. By neglecting this, and being carnally wise, we have wheeled about so long in the wilderness, and lost those advantages against the powers of darkness, which we know not whether we shall ever recover again. It is the great astonishment of sober men, and not the least reproach that ever was cast on our holy profession, to think with what a zeal for the work of Christ men seemed to be animated in the beginning of our disagreements, and how deeply they did engage themselves to him in solemn vows, protestations, and covenants, and what advantages carnal self hath since got, and turned the stream another way! So that the same men have since been the instruments of our calamity, in breaking in pieces and dishonouring the churches of Christ, yea, and gone so near to the taking down, as much as in them lay, the whole ministry that stand approved in the land.

O do not, by trifling, give advantage to the tempter to destroy your work and you together: Take warning by the sad experiences of what is past; bestir you speedily and vigorously for Christ, as knowing your opposition, and the shortness of your time. Blessed is that servant whom his Lord, when he cometh, shall find so doing. If you ask me wherein this interest of Christ doth consist, I shall tell you, but in a few unquestionable particulars.

1. In the main, that truth, godliness, and honesty be countenanced and encouraged, and their contraries by all fit means suppressed. 2. In order to this, that unworthy men be removed from magistracy and ministry, and the places supplied with the fittest that can be had. 3. That a competent maintenance may be procured where it is wanting, especially for cities and great towns, where more teachers are so necessary in some proportion to the number of souls, and on which the country doth so much depend. Shall an age of such high pretences to reformation and zeal for the churches, alienate so much, and then leave them destitute, and say it cannot be had? 4. That right means be used, with speed and diligence, for the healing of our divisions and the uniting of all the true churches of Christ at last, in these nations; and oh that your endeavours might be extended much further!

To which end I shall mention but these two means of most evident necessity. 1. That there be one Scripture creed, or confession of faith, agreed on by a general assembly of able ministers, duly and freely chosen hereunto, which shall contain nothing but matter of evident necessity and verity. This will serve, 1. For a test to the churches to discern the sound professors from the unsound, (as to their doctrine,) and to know them with whom they may close as brethren, and whom they must reject. 2. For a test to the magistrate of the orthodox to be encouraged, and of the intolerably heterodox, which it seems is intended in the 37th article of the late formed government, where all that will have liberty must profess faith in God by Jesus Christ, which, in a christian sense, must comprehend every true fundamental or article of our faith: and, no doubt, it is not the bare speaking of those words in an unchristian sense that is intended; as if a ranter should say, that himself is God and his mate is Jesus Christ.

2. That there be a public establishment of the necessary liberty of the churches, to meet by their officers and delegates on all just occasions, in assemblies smaller or greater, (even national, when it is necessary,) seeing, without such associations and communion in assemblies, the unity and concord of the churches is not like to be maintained. I exclude not the magistrates’ interest, or oversight, to see that they do not transgress their bounds. As you love Christ, and his church, and gospel, and men’s souls, neglect not these unquestionable points of his interest, and make them your first and chiefest business, and let none be preferred before him until you know them to be of more authority over you, and better friends to you, than Christ is.

Should there be any among you that cherish a secret root of infidelity, after such pretences to the purest christianity, and are zealous of Christ lest he should over-top them, and do set up an interest inconsistent with his sovereignty, and thereupon grow jealous of the liberties and power of his ministers, and of the unity and strength of his church, and think it their best policy to keep under his ministers, by hindering them from the exercise of their office, and to foment divisions, and hinder our union, that they may have parties ready to serve their ends; I would not be in the case of such men, when God ariseth to judge them, for all the crowns and kingdoms on earth!

If they stumble on this stone, it will break them in pieces, but if it fall upon them, it will grind them to powder. They may seem to prevail against him awhile, when their supposed success is but a prosperous self-destroying; but mark the end, when his wrath is kindled, yea, but a little; and when these, his enemies that would not he should reign over them, are brought forth and destroyed before him, then they will be convinced of the folly of their rebellion. In the mean time, let wisdom be justified of her children.</p></blockquote>

<blockquote><p>First, the state and the Church are essentially different in regard to their origin. The state, or the ordinance of civil government, owes its origin to God as the universal Sovereign and Ruler among the nations.

The Church, as the visible society of professing Christians in the world, with its outward provision of authority and order and government, owes its origin to Christ as Mediator. This difference is a most important one, as it involves and implies other differences characteristic of the two bodies. The civil government is an ordinance of God, founded not in grace, but in nature, and therefore intended for human society as subsisting in all nations, whether Christian or not, and carrying with it the authority and sanction of a Divine appointment wherever human society is found.

As an appointment of God, in His character of universal Sovereign, the authority of the state, and the duty of subjects in regard to it, are entirely independent of the Christianity of rulers or subjects; and the rights and responsibilities of the two parties are as valid and as binding in heathen as in Christian lands.

On the other hand, the Church, as an ordinance of Christ, is founded in grace, not in nature, and is limited to those nations where Christianity is actually professed. As an appointment of the Mediator, in His character of special Ruler or Head over His own people, it carries with it His authority, and is restricted in its jurisdiction to those who profess their subjection to Him, and join themselves to the Christian society which He has established.

Different in their origin, and in the source from which they derive their authority, the state and the Church are thus based on distinct and separate foundations, and are entirely independent of each other. Nor is this fundamental difference cancelled or overruled by the fact that the state or civil government is now put under the dominion of Christ in the character of Mediator, as well as the Church.

It is true that the civil governments of the world, like everything else, are subordinated to the Redeemer, that He may make use of them for promoting His own mediatorial purposes, and that Christ is not only “Head of the Church,” but “Head over all things to the Church.” But this authority of Christ over the civil governments of the earth is a thing superinduced upon their original character as the ordinance of God, in His capacity of universal Sovereign.

It does not in the least affect or supersede that character. The state, although it is now delegated to Christ to be under His authority for the good of His Church, has not ceased to be what it originally was—an appointment of God as the God of nature—any more than the creation of God has ceased to be the creation of God, because it also is now subordinated to the dominion of Christ for the interests of His people. In their origin, and in the basis on which they rest, the civil society and the Christian society are two ordinances essentially independent and distinct. …

In the first place, there is a foundation laid for a friendly alliance between the Church and state, in the fact of the twofold character which Christ sustains of Head of the Church, and also of Head over all things to the Church.

That civil government is an ordinance of God, as the God of nature and not of grace, is a most important truth, and one that lies at the foundation of the essential difference between the state and the Church, which owes its origin to Christ as Mediator. But it is no less true that God has handed over to Christ, as Mediator, the ordinance of civil government, to be employed by Him in subordination to the great purposes of His mediatorial reign.

Among “the all things” over which Christ is now made Head to the Church, is to be numbered the ordinance of magistracy or civil government in this world,—a truth which seems unquestionably to draw with it the conclusion that, in the hands of Christ, and under His control, the civil government of nations may be made instrumental in advancing the interests and promoting the well-being of the Church. …

It is an ordinance of God, both good in itself and appointed for good. The very end for which it has been placed under subjection to the Messiah is, that it may be instrumental, under Him, for securing the spiritual interests and promoting the welfare of His kingdom of grace; and it approaches very nearly to the assertion that Christ has failed in the object for which He has been set over it as Head, to assert that the state, from its nature or constitution, cannot in any manner be converted into a willing and conscious instrument for promoting the prosperity of the Church, and advancing the cause of Christianity. In the common subordination to Christ which the body politic and body ecclesiastical alike underlie, and in the object which is to be promoted by that subordination, we see the foundation laid for a friendly alliance and co-operation between Church and state.

Distinct and separate in their essential character, they are yet brought into one through their mutual subjection to the same Divine Head, and their mutual subserviency to the same gracious purpose. Fundamentally unlike in their character on earth, they are resolved into a higher unity through means of one Head in heaven. The Church and the state, because equally the servants of Christ, are helps made and meet for each other.</p></blockquote>

<blockquote><p>4. That which is the garland and proper flower of the King of kings, as He is absolute above his creatures, and not tied to any law, without Himself that regulates his will, that must be given to no mortal man or king except we would communicate that which is God’s proper due to a sinful man, which must be idolatry. But to do royal acts out of an absolute power above law and reason, is such a power as agrees to God, as is evident in positive laws and in acts of God’s mere pleasure, where we see no reason without the Almighty for the one side rather than for the other, as God’s forbidding the eating of the Tree of Knowledge makes the eating sin and contrary to reason; but there is no reason in the object; for if God should command eating of that tree, not to eat should also be sin. So God’s choosing Peter to glory and his refusing Judas, is a good and a wise act, but not good or wise from the object of the act, but from the sole wise pleasure of God; because, if God had chosen Judas to glory and rejected Peter, that act had been no less a good and a wise act than the former. For when there is no law in the object but only God’s will, the act is good and wise, seeing infinite wisdom cannot be separated from the perfect will of God; but no act of a mortal king, having sole and only will, and neither law nor reason in it, can be a lawful, a wise, or a good act.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“4. That which is the garland and proper flower of the King of kings, as He is absolute above his creatures, and not tied to any law, without Himself that regulates his will, that must be given to no mortal man or king except we would communicate that which is God’s proper due to a sinful man, which must be idolatry. But to do royal acts out of an absolute power above law and reason, is such a power as agrees to God, as is evident in positive laws and in acts of God’s mere pleasure, where we see no reason without the Almighty for the one side rather than for the other, as God’s forbidding the eating of the Tree of Knowledge makes the eating sin and contrary to reason; but there is no reason in the object; for if God should command eating of that tree, not to eat should also be sin. So God’s choosing Peter to glory and his refusing Judas, is a good and a wise act, but not good or wise from the object of the act, but from the sole wise pleasure of God; because, if God had chosen Judas to glory and rejected Peter, that act had been no less a good and a wise act than the former. For when there is no law in the object but only God’s will, the act is good and wise, seeing infinite wisdom cannot be separated from the perfect will of God; but no act of a mortal king, having sole and only will, and neither law nor reason in it, can be a lawful, a wise, or a good act.”

— Samuel Rutherford, Lex Rex, … (1646), Question 23, pp. 106-7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+That+which+is+the+garland+and+proper+flower+of+the+King+of+kings%2C+as+He+is+absolute+above+his+creatures%2C+and+not+tied+to+any+law%2C+without+Himself+that+regulates+his+will%2C+that+must+be+given+to+no+mortal+man+or+king+except+we+would+communicate+that+which+is+God%E2%80%99s+proper+due+to+a+sinful+man%2C+which+must+be+idolatry.+But+to+do+royal+acts+out+of+an+absolute+power+above+law+and+reason%2C+is+such+a+power+as+agrees+to+God%2C+as+is+evident+in+positive+laws+and+in+acts+of+God%E2%80%99s+mere+pleasure%2C+where+we+see+no+reason+without+the+Almighty+for+the+one+side+rather+than+for+the+other%2C+as+God%E2%80%99s+forbidding+the+eating+of+the+Tree+of+Knowledge+makes+the+eating+sin+and+contrary+to+reason%3B+but+there+is+no+reason+in+the+object%3B+for+if+God+should+command+eating+of+that+tree%2C+not+to+eat+should+also+be+sin.+So+God%E2%80%99s+choosing+Peter+to+glory+and+his+refusing+Judas%2C+is+a+good+and+a+wise+act%2C+but+not+good+or+wise+from+the+object+of+the+act%2C+but+from+the+sole+wise+pleasure+of+God%3B+because%2C+if+God+had+chosen+Judas+to+glory+and+rejected+Peter%2C+that+act+had+been+no+less+a+good+and+a+wise+act+than+the+former.+For+when+there+is+no+law+in+the+object+but+only+God%E2%80%99s+will%2C+the+act+is+good+and+wise%2C+seeing+infinite+wisdom+cannot+be+separated+from+the+perfect+will+of+God%3B+but+no+act+of+a+mortal+king%2C+having+sole+and+only+will%2C+and+neither+law+nor+reason+in+it%2C+can+be+a+lawful%2C+a+wise%2C+or+a+good+act.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex%2C+%E2%80%A6+%281646%29%2C+Question+23%2C+pp.+106-7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3dca8c4bdb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3dca8c4bdb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-positive-laws-ordinances/#:~:text

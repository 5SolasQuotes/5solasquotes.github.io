<main class="wrap"><figure class="quote" id="q-9490e704dd" data-kw="">
<blockquote><p>It’s [the light of nature is] altogether insufficient to prescribe or set down any worship of God. Hence God does so often forbid us to walk after our own imaginations and to do that which we shall choose. The apostle calls it will-worship, when a man’s will is the mere cause of it. Now, it’s true, men are more apt to admire this, as we see in the Pharisees and Papists; they dote upon their traditions more then God’s institutions… It’s true indeed, even in worship, light of Nature and prudence is instrumentally required to order the institutions of God; but as reason may not make a new article of faith, so neither a new part of worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis, or a Vindication of the Moral Law &amp; the Covenants</cite>, … (London, 1647), Lecture 7, pp. 74</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9c0a7ab7f1" data-kw="">
<blockquote><p>And besides, all such as enjoy the means of grace, and yet have not felt this visitation of God, should be much allured to the care of attending upon the means, and be made desirous to receive the grace of God, and that effectually: it should much move them that God has now sent them the means, and keeps his public visitation; and that God stands not upon desert, nor does He make exception of them, but offers his grace unto all, and desires not the death of any sinner, yea beseeches them to be reconciled [see 2 Cor. 5:20]; and to that end has committed the Word of reconciliation to his servants, with express commandment that they should be instant, and with all patience instruct men, and call upon them, and persuade them to save their souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Peter</cite>, (1637), p. 420</span></figcaption>

</figure><figure class="quote" id="q-26081e435a" data-kw="">
<blockquote><p>With regard to the form to be observed in receiving the sacraments, it is not without reason that you entertain doubts and scruples, for nothing is better than to abide by that pure simplicity which we hold from the Son of God, whose ordinance ought to be our single rule, to which also the usage of the apostles was perfectly conformable. And indeed the moment we deviate ever so little from it, our admixture of human invention cannot fail to be a corruption. But it seems to us that your condition is different from that of the pastors of the place and the great body of the people. If the pastors did their duty, they would employ all their endeavours to retrench those superfluities which do not tend to edification, or rather which serve to obscure the clearness of the gospel. The [civil] governors on their part would also do well to see to it. It is a vice to be condemned so far as they are concerned, that they keep up these unmeaning mummeries — which are as it were a residue of Popish superstitions, the recollection of which we should strive as much as in us lies to exterminate. But in your capacity of private individuals, not only you may lawfully, but what is more, you should support and suffer such abuses as it is not in your power to correct. We do not hold lighted candles in the celebration of the eucharist, nor figured bread to be such indifferent things that we would willingly consent to their introduction, or approve of them, though we object not to accommodate ourselves to the use of them, where they have been already established, when we have no authority to oppose them. If we were called upon to receive such ceremonies, we should hold ourselves bound according to the position in which God has placed us, to admit of no compromise in resisting their introduction, and in maintaining constantly the purity which the church confided to us already possesses. But should our lot be cast in some place where a different form prevails, there is not one of us who from spite against a candle or a chasuble [a ministerial vestment] would consent to separate himself from the body of the church, and so deprive himself of the use of the sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters</cite>, vol 3 (Philadelphia: Presbyterian Board of Publication), Letter 346, ‘To the Brethren of Wezel’, pp. 30-31. Calvin is speaking to reformed refugees attending Lutheran churches. See the whole letter in general.</span></figcaption>

</figure><figure class="quote" id="q-6dd71bd322" data-kw="">
<blockquote><p>He certainly did not suspect the Corinthians of such a degree of ignorance or carelessness as to think that they worshipped idols in their heart. But as they made no scruple of frequenting the assemblies of the wicked, and observing along with them certain rites instituted in honor of idols, he condemns this liberty taken by them, as being a very bad example. It is certain, then, that when he here makes mention of idolatry, he, speaks of what is outward, or, if you prefer it, of the profession of idolatry. For as God is said to be worshipped by the bending of the knee, and other tokens of reverence, while the principal and genuine worship of Him is inward, so is it also as to idols, for the case holds the same in things opposite. It is to no purpose that very many in the present day endeavor to excuse outward actions on this pretext, that the heart is not in them, while Paul convicts of idolatry those very acts, and assuredly with good reason. For, as we owe to God not merely the secret affection of the heart, but also outward adoration, the man who offers to an idol an appearance of adoration takes away so much of the honor due to God. Let him allege as he may that his heart is quite away from it. The action itself is to be seen, in which the honor that is due to God is transferred to an idol.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 10, verse 14</span></figcaption>

<blockquote><p>…the word ‘worship’ is taken for the inward worship of God commanded in the First Commandment, also comprehending our fear, love of God and joy in Him, issuing from the knowledge of the true God. All our obedience issuing herefrom is worship of God, including our duties to man, in obedience and relation to God’s Commandment. The ground of this obedience and worship is the relation between God and the reasonable creature, being the image of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Third Chapter of the Epistle of St. Paul to the Philippians</cite>, … (London: Cotes, 1639), verse 3, ‘which worship God’, p. 44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-0dc953a165" data-kw="">
<blockquote><p>8. When Christ knocks and presses hardest, it’s for our own good, and it’s a token of love in Him to do so; for, there is nothing more deplorable, than when He says to one under indisposition, and in an evil case, ‘Let him alone.’ … 10. Christ may call very pressingly, and his Word may have some work on the conscience and affections of hearers, and they be some-way affected with it, and yet the Word be rejected, and the heart not made open to Christ; as here she sleeps still notwithstanding; and the following verse confirms it. 11. There are some operations of the Spirit, which though they be more than a common work on the generality of hearers, yet are not saving, and may be, and often are, even by believers frustrated for a time, and by others for ever; for, this knocking gets a refusal, verse 3. So deceiving, beguiling and dangerous are common motions to rest on, when the finger of gracious Omnipotency is not applied, as verse 4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Song of Solomon</cite>, 5:2</span></figcaption>

</figure><figure class="quote" id="q-30cbe3f315" data-kw="">
<blockquote><p>The third theological foundation of the Genevan Psalter was the doctrine of common grace. By this it was recognized that there are two types of divine gifts — supernatural and natural. The former are the virtues wrought in the soul by a special work of grace; the latter are those which pertain to secular matters and are distributed to all, not to saints only; as a matter of fact, often to sinners. But, wherever they were, Calvin recognized these and used them for his purposes. Skill in music is a natural rather than a supernatural skill, but Calvin was ever on the alert to capture this for the worship of God. Thus, at his Academy in Geneva, he made music required four hours each week. The choir thereby trained in this skill was to lead the people so they could, under its leadership, cultivate the same skill. Acting on this same principle, Calvin was quick to appreciate the able — though not excessively orthodox — Marot, and to stand by the gifted composer, Bourgeois, who was thrown into prison for breaking some of the rigid disciplines of Geneva of which Calvin was himself the main author. Abraham Kuyper, in his admirable Lectures on Calvinism, so aptly remarks, “Music…would flourish, henceforth, not within the narrow limitation of particular grace, but in the wide and fertile fields of common grace.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Singing the Words God Has Put in Our Mouths”</cite>, (originally published in The Hymn, January 1953), in John H. Gerstner: The Early Writings, vol. 1, pp. 204-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“The third theological foundation of the Genevan Psalter was the doctrine of common grace. By this it was recognized that there are two types of divine gifts — supernatural and natural. The former are the virtues wrought in the soul by a special work of grace; the latter are those which pertain to secular matters and are distributed to all, not to saints only; as a matter of fact, often to sinners. But, wherever they were, Calvin recognized these and used them for his purposes. Skill in music is a natural rather than a supernatural skill, but Calvin was ever on the alert to capture this for the worship of God. Thus, at his Academy in Geneva, he made music required four hours each week. The choir thereby trained in this skill was to lead the people so they could, under its leadership, cultivate the same skill. Acting on this same principle, Calvin was quick to appreciate the able — though not excessively orthodox — Marot, and to stand by the gifted composer, Bourgeois, who was thrown into prison for breaking some of the rigid disciplines of Geneva of which Calvin was himself the main author. Abraham Kuyper, in his admirable Lectures on Calvinism, so aptly remarks, “Music…would flourish, henceforth, not within the narrow limitation of particular grace, but in the wide and fertile fields of common grace.””

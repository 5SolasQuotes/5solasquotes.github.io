<blockquote><p>In the particular sense of a distinction between the voluntas beneplaciti as the decree and the voluntas signi as the divine command, the distinction is little different than the correctly understood distinction between the absolute and the conditional will of God. (Leigh, Body of Divinity, II.vii (p. 198); Cocceius, Summa theol., III.x47.)</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-62c04b20e0" data-kw="">
<blockquote><p>‘Thou wilt say then unto me: why doth he yet complain? For who can resist his will?’… And forasmuch as not all which hear the Gospel are inwardly with efficacy moved of God, thereof it comes that Paul says to the Corinthians, that it is to some the savor of life to life, and to other some the savor of death to death. This is a plain and simple conciliation of that contrariety which appears to be in the will of God. And because that in these vocations and promises seems to be expressed some will of God which yet takes not effect, certain divines have not unskillfully said that there is one will of the sign, or of the antecedent: another will of efficacy, or of the consequent. For it oftentimes happens, that God either threatens or promises a thing, which yet shall not come to pass. And yet does not God therefore lie, or deceive. For He pronounces those things, either as nature was then ordered, or as through ill deserts it might come to pass, unless some change were had in the mean time. So was Ezekiel told that he should die: because that disease whereof he was sick was by nature deadly. Wherefore the prophet in those threats pronounced, God’s will of the sign: that is, so much as could be known by the force of nature. But the changing came of the will of God which is of efficacy, which they call the consequent. Nineveh also for the grievous sins thereof was worthy to be destroyed. Wherefore Jonah showed unto them the antecedent will of God, which they call the will of the sign: Wherefore when God calls Pharaoh or any other reprobate, by that vocation or outward promise we understand the antecedent will, or the will of the sign, but that other hidden will, which they call the will of efficacy, or the consequent, we understand not. Wherefore God cannot deny Himself, neither does He in these wills strive against Himself. But by his doctrine and promises being in differently and generally set forth, He stirs up the minds of the ministers of the Church, cheerfully to preach the word and that unto all men: which thing doubtless they would not do, if He had made them assured of his hidden will. For if they knew that they had to deal with men reprobate, they would utterly be discouraged, and give over.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most Learned &amp; Fruitful Commentaries</cite>, … upon… Romans... (London: Daye, 1568), ch. 9, pp. 269-70</span></figcaption>

</figure><figure class="quote" id="q-c77fc470bc" data-kw="">
<blockquote><p>XXIV. All these [previous] things are not therefore spoken that we should reject this distinction of the will of God into his antecedent and consequent will: For we know that among the decrees of God, some are before and some are after in order. But we deny that there are two decrees of God, between which man’s will steps in, as if man’s will came between the decree of creating man and the decree of condemning certain men. But we deny that the will of man does so come between the two decrees of God that the first, or antecedent decree, is broken off by the will of man and that God is compelled to absist from that end which He had propounded to Himselfe and which He did seriously intend: We deny also in the work of our election, the precise will of God to depend on the foreseeing of any power or action of man’s free-will, or the consequent will of God to be suspended on man’s will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism</cite>, ch. 5, ‘Of the Antecedent &amp; Consequent Will of God’ in The Anatomy of Arminianism… (London: Snodham, 1620), pp. 27-41, pp. 40-41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>3. Voluntas efficax and voluntas inefficax…. But what of the possibility that God’s will can be distinguished into voluntas efficax [an effective will] and voluntas inefficax [an ineffective will]? This latter distinction is ill chosen, but will stand if it refers to the effectual will of God to the decree and the ineffectual will to the divine precepts, the former being incapable of resistance and the latter resisted successfully by all evildoers. If a distinction between effective and ineffective will is sought in the voluntas decreti [will of decree] itself, this is repugnant and deeply in error…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms</cite>, ed. 1 | PRRD, vol. 3, p. 470</span></figcaption>

</figure><figure class="quote" id="q-e86649f96e" data-kw="">
<blockquote><p>Christ therefore as God willed and approved the gathering of the Jerusalemites to Himself and their obedience as a thing so intensely dear to Him and morally pleasing, as is the care of a hen for her chicks, which she cherishes and nourishes by the expansion of her wings, although the Jerusalemites held that blandishing invitation of the Savior as cheap; meanwhile He denied to the same the grace which would have most sweetly procured their most free obedience, with liberty unimpaired, which is an invincible argument that God decreed that their obedience should never exist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Scholastic Disputation on Divine Providence, chs. 1-10</cite>, tr. by AI by Onku (Edinburgh, 1649), ch. 2. ‘What is the nature of the permissive will of God, and of the will of good pleasure and sign. The Remonstrants, Arminians are called to the discussion’ Latin, p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Christ therefore as God willed and approved the gathering of the Jerusalemites to Himself and their obedience as a thing so intensely dear to Him and morally pleasing, as is the care of a hen for her chicks, which she cherishes and nourishes by the expansion of her wings, although the Jerusalemites held that blandishing invitation of the Savior as cheap; meanwhile He denied to the same the grace which would have most sweetly procured their most free obedience, with liberty unimpaired, which is an invincible argument that God decreed that their obedience should never exist.”

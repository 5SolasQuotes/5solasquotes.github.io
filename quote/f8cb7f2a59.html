<main class="wrap"><figure class="quote" id="q-f8cb7f2a59" data-kw="">
<blockquote><p>8th Distinction… yet will it not follow that these few fundamentals [such as in the Apostles’ Creed] received by all Christians, Papists, Lutherans, Arians, Verstians, Sabellians, Macedonians, Nestorians, Eutychanes, Socinians, Anabaptists, Treithitae, Antitrinitarii (for all these be Christians and validly baptized) do essentially constitute a true Church, and a true Religion. Because all Christians agree that the Old and New Testament is the truth and Word of God, and the whole faith of Christian Religion is to be found in the Old Testament, acknowledged both by Jews and Christians; for that is not the Word of God indeed in the Old Testament which the Jews say is the Word of God in the Old Testament. Yea the Old and New Testament, and these few uncontroverted points received universally by all Christians, are not God’s Word as all these Christians expone them, but [rather are] the dreams and fancies of the Jews saying that the Old Testament teaches that Christ the Messiah is not yet come in the flesh, the Treithitae [Tritheists] say there be three Gods, yet are the Treithitae Christians in the sense of Doctor [Christopher] Potter [a Laudian Anglican]: So that one principal as that, There is one God, and Christ is God and man, and God is only to be adored, not one of these are uncontraverted, in [the] respect [that] every society of sectaries have contrary expositions upon these common fundamentals, and so [they have] contrary religions. Who doubts but all Christians will subscribe and swear with us Protestants the Apostolic Creed, but will it follow that all Christians are of one true Religion, and do believe the same fundamentals? [2.] Now these fundamentals are the object of faith according as they signify things. To us and to the Treithitae this first article, ‘I believe in God’, as I conceive, does not signify one and the same thing; now join this, ‘I believe in God’ with holy obedience, as we expone it, and as the Treithitae expone it: it could never be a step to everlasting salvation; for it should have this meaning: ‘I believe there is one only true God, and that there be also three Gods,’ and what kind of obedience joined with a faith made up of contradictions can be available to salvation? 3. One general catechism and confession of faith made up of the commonly received and agreed upon fundamentals would not make us nearer peace, though all Christians should swear and subscribe this common Christian catechism, no more than if they should swear and subscribe the Old and New Testament, as all Christians will do, and this day do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644), pt. 2</cite>, pp. 228-9</span></figcaption>

<blockquote><p>V. Those parishioners that desire us to baptize their children, or to be themselves admitted to the Lord’s Supper, and are not members of this church (because they will not), we desire to come to us, some days before that so we may be satisfied of their faith and life: And if they seem true Christians, and either bring a certificate that they are members of any other church, with (which we are to hold communion, or show that it is not from ungodliness that they refuse to live under order and discipline, we shall baptize their children, and occasionally admit them to our communion. But if they are scandalous, we shall require them first to profess their serious repentance: And if they return to scandal, we shall after stay till we see their reformation (or of one of the parents in case of baptism).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Religion expressed: I, briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II, more largely in a Profession taken out of the Holy Scriptures, containing 1, the articles of the Christian Belief, 2, our consent to the Gospel Covenant, 3, the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660), The Order &amp; Discipline of this Church, agreeable to the Word of God</cite></span></figcaption>

<blockquote><p>We may consider a visible Church either metaphysically or politically. It is one thing to consider men as living creatures endued with reason; another thing to consider them as magistrates, masters, fathers, children, servants, etc. So is it one thing to consider a visible Church as a society of men and women separated from the blind world by divine vocation [calling], and professing together the gospel of Jesus Christ; and another thing to consider it as a political body, in which the power of spiritual government and jurisdiction is exercised–some governing and some governed. These are very different considerations; for first, a visible Church being taken entitatively or metaphysically, her members do ordinarily communicate together in those holy things which fall under the power of order, which I may call sacra mystica [sacred, mystical rites]; but being taken politically, her members communicate together in such holy things as fall within the compass of the power of jurisdiction, which I may call sacra politica [sacred politics]. Secondly, infants under age, being initiated in baptism, are actually members of the Church in the former consideration, but potentially only in the latter; for they neither govern, nor yet have the use of reason to be subject and obedient to those that do govern.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland… (1641; Edinburgh, 1646), 2nd part, ch. 11</cite>, p. 62</span></figcaption>

<blockquote><p>…in favor of the baptism of infant servants, from the cessation of the Jewish Church to the times of Augustine, we can only say that Augustine speaks of it as a custom in existence; that it resulted, in his day, from the conviction that baptism came in place of circumcision, a conviction which we can trace up through the earliest fathers… …we commend the resolutions of the Synod of South Carolina… ‘1. Resolved, That it is the duty of believing masters to train up their servants, as well as their children, in the nurture and admonition of the Lord. 2. Resolved, That the principles of the Abrahamic covenant, as to the cirucmcision of servants, is till in force in reference to the infant offspring of those who stand to us in this relation; and that as baptism succeeds to circumcision, it is the duty of masters to dedicate such servants to God in the ordinance of baptism, and to do all in their power to train them up in a knowledge of the truth and in the way of salvation through Christ. 3. Resolved, That though there are great and manifest dificulties in carrying out the principles of these resolutions, these difficulties have chiefly resulted from the long continued neglect of believing masters and of the church, and that these difficulties must be gradually overcome by continued and persevering efforts.&#x27;</p></blockquote>

ne.com/infant-baptism/#:~:text=in%20favor%20of%20the%20baptism%20of,overcome%20by%20continued%20and%20persevering%20efforts&amp;text=in%20favor%20of%20the%20baptism%20of%20infant%20servants&amp;text=be%20gradually%20overcome%20by%20continued%20and%20persevering%20efforts" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

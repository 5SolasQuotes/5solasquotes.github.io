<main class="wrap"><figure class="quote" id="q-8896018667" data-kw="">
<blockquote><p>Just as soldiers in formation or in watchtowers are expected to hold their position without flinching and not to desert it treacherously or out of cowardice, so it is with Christians, who are expected to defend the noble rank to which we have been raised by Christ with undaunted faith and strong dedication. Just as in military life, Christians need to remember that they cannot do without constant strength of mind and unflagging vigilance if we are not going to allow ourselves to be dislodged from the position assigned to us. For although Christ has set us free, the remains of our evil nature still cling to us and remain present in our flesh. Because of that, our common enemy, Satan, seizes the opportunity to invade us, and if he sees some people more attracted to the flesh than others, he tries to take them away from the pathway of godliness by showing them the example and enticements of the world, in order to transform their Christian freedom into an unbridled license capable of anything.

Others, though, whom he realizes have not yet abandoned the feeling of godliness and who are still influenced by the terrors of conscience, he tempts with newfangled superstitions under the guise of religion, by which he traps the unwary and takes them away from Christ, in whom alone salvation is found. After all, what would that wicked creature not attempt, when he was not afraid to attack our first parents in paradise? Did he not wage war against Jesus Christ, the eternal Son of God, and attempt to overturn his faith and take him away from the obedience that he owed to the Father of our redemption? The apostle is right therefore to warn us that we must stand fearless and unmoved in that freedom that he has won for us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), pp 169-70.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-987261b4ba" data-kw="">
<blockquote><p>[I]f any party whatever, but especially if the State, or civil power, shall claim the right of controlling the government which Christ has appointed in the hands of Church office-bearers, they must refuse obedience to that claim, must make up their minds to suffer, if need be, the loss of all things, rather than yield to it. And this because they are only servants, ministers, stewards, entrusted by the alone Master and King with a certain authority and duty.

Were they princes — as Rome’s ecclesiastics claim to be — then might they be free to consider the question, at least, whether it were not expedient, in certain circumstances, to resign the government of the Church into other hands. But they are stewards only, mere administrators, and have no discretion in any such matter. They hear the voice of the Master, “The flock over which the Holy Ghost hath made you overseers” — “put away from among yourselves that wicked person” — “whatsoever ye shall bind on earth, shall be bound in heaven; and whatsoever ye shall loose on earth, shall be loosed in heaven.”

And the government which they have thus received, they must discharge on their responsibility to Christ alone. But especially, to yield it up into the hands of the State, were to yield it, as we have seen, into the hands of another king, another master, and so were nothing less than treason against the only King and Head of the Church.</p></blockquote>

<blockquote><p>Out of this depravity of the Graeco-Roman world came a licentious madness of uncontrolled and superfluous incentives to lust. The entire structuring of nature was disarranged and destroyed by the depravity and wicked perversions of men who had only the uncontrolled vice of unrelenting desire. These destroy the natural order of things.</p></blockquote>

</figure><figure class="quote" id="q-7b42ef7128" data-kw="">
<blockquote><p>For they [the Independents] hold that although a congregation increase so much as that they cannot, or be so persecuted that they may not, meet safely in one place for the Word and sacraments, and supposing the Church of Jerusalem before the dispersion, Acts 8:1, to have been so numerous and to have accressed to so many thousands as could not receive the sacrament of the Lord’s Supper, nor ordinarily assemble into one place for the worship of God (that they received the Lord’s Supper in several companies and several houses is ordinarily collected from Acts 2:46, and breaking bread from house to house, which the Syriac expounds expressely of the Eucharist), Yet all this (say they) breaks not the Church, but they are still one particular church. Now if several companies of the same church assembled and receaving the Lord’s Supper in several places be not a breaking or dividing of the congregation, nor a deviation from the example of Christ, much less can they with any reason, charge our communicating by several companies at successive tables, in the same meeting place or assembly to be a breaking of the congregation or a deviation from Christ’s example.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, pp. 221-22 of ch. 18, ‘Of the Use of a Table in the Lord’s Supper. And of the Communicants their Coming to &amp; Receiving at the Table’ in A Treatise of Miscellany Questions… (1649)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“For they [the Independents] hold that although a congregation increase so much as that they cannot, or be so persecuted that they may not, meet safely in one place for the Word and sacraments, and supposing the Church of Jerusalem before the dispersion, Acts 8:1, to have been so numerous and to have accressed to so many thousands as could not receive the sacrament of the Lord’s Supper, nor ordinarily assemble into one place for the worship of God (that they received the Lord’s Supper in several companies and several houses is ordinarily collected from Acts 2:46, and breaking bread from house to house, which the Syriac expounds expressely of the Eucharist), Yet all this (say they) breaks not the Church, but they are still one particular church. Now if several companies of the same church assembled and receaving the Lord’s Supper in several places be not a breaking or dividing of the congregation, nor a deviation from the example of Christ, much less can they with any reason, charge our communicating by several companies at successive tables, in the same meeting place or assembly to be a breaking of the congregation or a deviation from Christ’s example.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-39a2584e2a" data-kw="">
<blockquote><p>4. [God justifies] By way of Execution, when the sentence is executed. This is in part done here, as God takes off the penalties and fruits of sin, either in the way of his internal or external government, and gives us many blessings, as the pledge of his love, and above all, the gift of the Holy Spirit, whereby He sanctifies us more thoroughly, and works in us that which is pleasing in his sight: This He gives as the God of peace, as reconciled to us in Christ, Heb. 13:20-21: ‘Now the God of peace that brought again from the dead our Lord Jesus, that great shepherd of the sheep, through the blood of the everlasting Covenant, make you perfect in every good work, to do his will, working in you that which is pleasing in his sight, through Jesus Christ.’ 1 Thess. 5:23: ‘And the very God of peace sanctify you wholly: and I pray God your whole spirit, and soul, and body, be preserved blameless unto the coming of our Lord Jesus Christ;’ Faithful is he that calls you, who will do it: but more fully at the Last Day, when we enter into everlasting glory; and the wicked are turned into Hell with the Devil and his angels, Mt. 25:46, ‘And these shall go into everlasting punishment; but the righteous into life eternal’: then is the full and final execution, a perfect freedom from all misery, and a possession of all happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons… (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33</cite>, p. 334</span></figcaption>

584e2a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/sanctification#:~:text=4.%20%5BGod%20justifies%5D%20By%20way%20of,and%20a%20possession%20of%20all%20happiness&amp;text=4.%20%5BGod%20justifies%5D%20By%20way%20of%20Execution%2C%20when&amp;text=all%20misery%2C%20and%20a%20possession%20of%20all%20happiness" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>For good works are fruitful not only in reference to an ample and manifold reward, but in reference to good works:¹ as the parable of our Savior in the twenty-fifth of Matthew plainly informs us, where it is said: ‘Then he that had received the five talents went and traded with the same and made them other five talents.’ (Mt. 25:16) ¹ Serva ergo mandata Dei-Sanctifica cor tuum ut Deus inhabitet in te. Et quotidie magis &amp; magis invenies Deum [Therefore keep the commandments of God—sanctify your heart so that God may dwell in you. And every day you will find God more and more]. [Ps. Chrysostom,] Imperfect Work on Matthew, Homily 4. These five talents acquired to the first five cannot be interpreted [as] the reward ultimate; for that is expressed afterward to be the joy of the Lord [vv. 21, 23]: but they were the intermediate effects of the stock of grace treasured up in the soul, and exhorting and improving itself by the continual supply of the Spirit of Christ, according to the doctrine of St. Paul to the Corinthians, saying: ‘Insomuch that we desired Titus, that as he had begun, so he would also finish in you the same grace also: Therefore as ye abound in everything, in faith, in utterance, in knowledge, and in all diligence, and in your love to us, see that ye abound in this grace also.’ [2 Cor. 8:6-7] Of this influence of Christ’s Spirit to the augmentation of grace in the hearts of the true believers, speaks the same apostle to the Colossians, thus: ‘The Head from which all the body by joints and bands having nourishment, ministered and knit together, encreases with the increase of God.’ (Col. 2:19) … That God therefore accepted their burnt-offering (Jud. 13:23), it is a sign He approved their persons, but the reason antecedent of God’s acceptation of their sacrifice, was because He first approved their persons. And yet, notwithstanding the goodness of the person is the original of the goodness of the work, nothing hinders but the goodness of the work may add value, favour, and estimation unto the person. As (to use Luther’s comparison and others after and before him) the tree bears the fruit, and not the fruit the tree: And the goodness of the tree is the cause of the goodness of the fruit, and not the goodness of the fruit the cause of the goodness of the tree: Yet the fruit does procure an esteem and valuation from the owner to the tree; and endears it to him, to the cultivating the ground and dressing it and conferring much more on that than others. In like manner, the person sanctified and justified produces good works, and not those good works, him: but some actions accompanied with God’s grace, antecedent and inferior to the fruit itself: Yet does the fruit of good works add much of esteem and honor from God to such a person; and render him capable of an excellent reward: for St. Paul to the Philippians assures them and us, when he says, ‘I desire fruit that may abound to your account.’ (Phil. 2:7)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-scrivener.html">Matthew Scrivener</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Course of Divinity... (London: Roycroft, 1674), pt. 1, bk. 1, ch. 17</cite>, pp. 62-63</span></figcaption>

<blockquote><p>3. He [the Arminian Conrad Vorstius] first says that ‘Scripture does not call God infinite.’ This is false. For Scripture thus says in Psalm 144:3: “Great is the Lord, exceedingly praiseworthy, whose magnitude has no end.” And Baruch 3:25: “It is great and has no bounds, immeasurable and highly-exalted.” These witnesses are not able to be interpreted as about magnitude of mass or quantity, which is not in God. But [it must be interpreted] as respecting his magnitude of perfection or virtue. Therefore, this is the sense: God is so great in virtue and perfection that he does not have an end or terminus of his virtue and perfection. From this, I reason thus: just as the end in virtue and perfection is that which has an end or terminus of its virtue and perfection, so on the opposite side, an infinite in virtue and perfection is that which does not have an end or terminus of its virtue and perfection. But God does not have an end or terminus of his virtue and perfection. Therefore, he is infinite in virtue and perfection. What shall Vorstius say at this point? The major premise is per se known by implication. The minor premise is openly expressed in Scripture. The conclusion is legitimately inferred.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-becanus.html">Martin Becanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae Scolasticae (d. 1624; Leiden, 1683), First Tract on God &amp; the Divine Attributes, ch. 5, ‘Infinity of God’, pt. 1 tr. Michael Lynch Becanus is a Romanist.</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“3. He [the Arminian Conrad Vorstius] first says that ‘Scripture does not call God infinite.’ This is false. For Scripture thus says in Psalm 144:3: “Great is the Lord, exceedingly praiseworthy, whose magnitude has no end.” And Baruch 3:25: “It is great and has no bounds, immeasurable and highly-exalted.” These witnesses are not able to be interpreted as about magnitude of mass or quantity, which is not in God. But [it must be interpreted] as respecting his magnitude of perfection or virtue. Therefore, this is the sense: God is so great in virtue and perfection that he does not have an end or terminus of his virtue and perfection. From this, I reason thus: just as the end in virtue and perfection is that which has an end or terminus of its virtue and perfection, so on the opposite side, an infinite in virtue and perfection is that which does not have an end or terminus of its virtue and perfection. But God does not have an end or terminus of his virtue and perfection. Therefore, he is infinite in virtue and perfection. What shall Vorstius say at this point? The major premise is per se known by implication. The minor premise is openly expressed in Scripture. The conclusion is legitimately inferred.”

— Martin Becanus, Summa Theologiae Scolasticae (d. 1624; Leiden, 1683), First Tract on God &amp; the Divine Attributes, ch. 5, ‘Infinity of God’, pt. 1 tr. Michael Lynch Becanus is a Romanist.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+He+%5Bthe+Arminian+Conrad+Vorstius%5D+first+says+that+%E2%80%98Scripture+does+not+call+God+infinite.%E2%80%99+This+is+false.+For+Scripture+thus+says+in+Psalm+144%3A3%3A+%E2%80%9CGreat+is+the+Lord%2C+exceedingly+praiseworthy%2C+whose+magnitude+has+no+end.%E2%80%9D+And+Baruch+3%3A25%3A+%E2%80%9CIt+is+great+and+has+no+bounds%2C+immeasurable+and+highly-exalted.%E2%80%9D+These+witnesses+are+not+able+to+be+interpreted+as+about+magnitude+of+mass+or+quantity%2C+which+is+not+in+God.+But+%5Bit+must+be+interpreted%5D+as+respecting+his+magnitude+of+perfection+or+virtue.+Therefore%2C+this+is+the+sense%3A+God+is+so+great+in+virtue+and+perfection+that+he+does+not+have+an+end+or+terminus+of+his+virtue+and+perfection.+From+this%2C+I+reason+thus%3A+just+as+the+end+in+virtue+and+perfection+is+that+which+has+an+end+or+terminus+of+its+virtue+and+perfection%2C+so+on+the+opposite+side%2C+an+infinite+in+virtue+and+perfection+is+that+which+does+not+have+an+end+or+terminus+of+its+virtue+and+perfection.+But+God+does+not+have+an+end+or+terminus+of+his+virtue+and+perfection.+Therefore%2C+he+is+infinite+in+virtue+and+perfection.+What+shall+Vorstius+say+at+this+point%3F+The+major+premise+is+per+se+known+by+implication.+The+minor+premise+is+openly+expressed+in+Scripture.+The+conclusion+is+legitimately+inferred.%E2%80%9D%0A%0A%E2%80%94+Martin+Becanus%2C+Summa+Theologiae+Scolasticae+%28d.+1624%3B+Leiden%2C+1683%29%2C+First+Tract+on+God+%26+the+Divine+Attributes%2C+ch.+5%2C+%E2%80%98Infinity+of+God%E2%80%99%2C+pt.+1+tr.+Michael+Lynch+Becanus+is+a+Romanist.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F72af1225e4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/72af1225e4.html

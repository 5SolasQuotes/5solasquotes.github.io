<main class="wrap"><figure class="quote" id="q-5f4989fd79" data-kw="">
<blockquote><p>Let me remind you, in vindication of the glory of Immanuel, that going and telling Jesus, implies on His part, no ignorance of, or indifference to your case. He who redeemed us is God — “God manifest in the flesh.” All persons, all things, all events are known to Him from the end to the beginning. When, therefore, you stand in the presence chamber of Jesus you prefer no request, breathe into His ear no sorrow, unveil to His eye no infirmity, with which, in all its most minute detail, He was not already infinitely better acquainted than yourself.

Long ere the sadness had shaded your brow, or a tear had dimmed your eye, or the burden had pressed your spirit, or the perplexity had woven its web around your path, or the archer had bent his bow and winged his shaft — Jesus knew it all, had appointed it all, had anticipated it all. It was no surprise to Him! Precious truth! Christ had entwined my perplexity with His thoughts, had wrapped my grief around His heart, had provided a pavilion for my safety ere a pebble had paved, or a cloud had shaded, or a whisper of the storm had breathed over my path.

“O Lord! Thou knowest my down-sitting and mine uprising; Thou understandest my thoughts afar off, Thou compassest my path and my lying down, and art acquainted with all my ways.” Satisfied with such a fact, cheered by such a truth, animated by such a thought, you may unhesitatingly advance into the unknown history of another year; firm in the belief that Jesus will be faithful in fulfilling the promise, “I will bring the blind by a way that they knew not; I will lead them in paths that they have not known; I will make darkness light before them, and crooked things straight. These things will I do unto them, and not forsake them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/octavius-winslow.html">Octavius Winslow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Go and Tell Jesus</cite>, (75th edn, New York: A. D. F. Randolph &amp; Co., 1869), pp 23-26.</span></figcaption>

<blockquote><p>5. The Efficient Cause, I mean the first and Principal Efficient of true worship, is the Holy Ghost, by whom we are moved and stirred up to worship and honor God.

6. For the Spirit is He which gives us faith itself from whence flows worship, and excites us to do the works of piety, both internal and external. He works in us both the will and the deed, after the good pleasure of his will, as the apostle speaks.

7. The Secondary and Less Principal Efficient Cause of worship, are we ourselves, who adore and honor God.

8. The Material Cause is the work itself commanded by God, whereby we serve Him, adoring Him with the greatest reverence we possibly may: for no creature has any right of instituting the worship of God.

9. Hereupon is excluded all will-worship, and the figment of good intention, to wit, when men do evil, that good may come thereof, or when they themselves do invent works, which they obtrude unto God for worship, not works evil in themselves, but yet not commanded by God, 1 Sam. 15:22; Eze. 20:19; Mt. 15:9; Isa. 29:13.

10. For it is not sufficient, for worship that some work be not evil, or not forbidden, but it ought to be commanded by God, 1 Sam. 15:22; Eze. 20:19; Mt. 15:9; Isa. 29:13.

11. The Formal Cause is faith. For good works and just actions do not only flow from faith as from the Efficient Cause; even as all human actions proceed from the soul: but also those works have their being from faith, as from a form, whereby they are godly, holy and therefore acceptable unto God.

12. The Final Cause is the glory of God, whereunto must be referred all the whole worship of God.</p></blockquote>

<blockquote><p>[E]ssential to religion is the revelation of God’s will as the regulative principle according to which man, as a servant, must engage himself. It has not been left to man to determine the manner in which he would serve God, for then he would stand above God. Anyone who engages himself in this way exalts himself above God and displeases the Lord in all his activity. “But in vain they do worship Me, teaching for doctrines the commandments of men” (Mat. 15:9).

Rather, the Lord Himself establishes for and reveals to man the regulative principle, indicating what He requires man to do and in which manner He wishes this to be accomplished. “Should not a people seek unto their God … To the law and to the testimony: if they speak not according to this Word, it is because there is no light in them” (Isa 8:19-20); “That ye may prove what is that good, and acceptable, and perfect, will of God” (Rom 12:2).</p></blockquote>

</figure><figure class="quote" id="q-549edd2a96" data-kw="">
<blockquote><p>Delight not to be in bad places and company; to delight in such argues you are bad yourself. We are to hate the garment spotted with the flesh. Some expound this, “to avoid the occasions of sin,” but Mr [William] Perkins gives this sense: “to hate bad company.” He alludes to the ceremonial law that said that if a man had a leprous garment, or a garment otherwise made unclean, his company was to be avoided. God therefore gave that command not to plough with an ox and an ass together; the ass was an unclean creature, and the ox was one of the clean beasts, and they must not be in the same yoke. This notes (say divines) that God’s people and profane persons must not be yoked together. Though they may occasionally meet together, yet they must not be yoked together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-love.html">Christopher Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Grace: the truth, growth, and different degrees in fifteen sermons</cite>, ed. Don Kistler (Morgan, 1997), pp 12-13.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Delight not to be in bad places and company; to delight in such argues you are bad yourself. We are to hate the garment spotted with the flesh. Some expound this, “to avoid the occasions of sin,” but Mr [William] Perkins gives this sense: “to hate bad company.” He alludes to the ceremonial law that said that if a man had a leprous garment, or a garment otherwise made unclean, his company was to be avoided. God therefore gave that command not to plough with an ox and an ass together; the ass was an unclean creature, and the ox was one of the clean beasts, and they must not be in the same yoke. This notes (say divines) that God’s people and profane persons must not be yoked together. Though they may occasionally meet together, yet they must not be yoked together.”

— Christopher Love, Grace: the truth, growth, and different degrees in fifteen sermons, ed. Don Kistler (Morgan, 1997), pp 12-13.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDelight+not+to+be+in+bad+places+and+company%3B+to+delight+in+such+argues+you+are+bad+yourself.+We+are+to+hate+the+garment+spotted+with+the+flesh.+Some+expound+this%2C+%E2%80%9Cto+avoid+the+occasions+of+sin%2C%E2%80%9D+but+Mr+%5BWilliam%5D+Perkins+gives+this+sense%3A+%E2%80%9Cto+hate+bad+company.%E2%80%9D+He+alludes+to+the+ceremonial+law+that+said+that+if+a+man+had+a+leprous+garment%2C+or+a+garment+otherwise+made+unclean%2C+his+company+was+to+be+avoided.+God+therefore+gave+that+command+not+to+plough+with+an+ox+and+an+ass+together%3B+the+ass+was+an+unclean+creature%2C+and+the+ox+was+one+of+the+clean+beasts%2C+and+they+must+not+be+in+the+same+yoke.+This+notes+%28say+divines%29+that+God%E2%80%99s+people+and+profane+persons+must+not+be+yoked+together.+Though+they+may+occasionally+meet+together%2C+yet+they+must+not+be+yoked+together.%E2%80%9D%0A%0A%E2%80%94+Christopher+Love%2C+Grace%3A+the+truth%2C+growth%2C+and+different+degrees+in+fifteen+sermons%2C+ed.+Don+Kistler+%28Morgan%2C+1997%29%2C+pp+12-13.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F549edd2a96.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/549edd2a96.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/09/03/christopher-love-on-unequal-yokes/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Many a one thinks that he has God and everything in abundance when he has money and possessions; he trusts in them and boasts of them with such firmness and assurance as to care for no one. Lo, such a man also has a god, Mammon by name, i.e., money and possessions, on which he sets all his heart, and which is also the most common idol on earth.… So, too, whoever trusts and boasts that he possesses great skill, prudence, power, favor, friendship, and honor has also a god, but not this true and only God.… Therefore I repeat that the chief explanation of this point is that to have a god is to have something in which the heart entirely trusts.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-45698d906a" data-kw="">
<blockquote><p>The Papists repeat the Apostles’ Creed, but they do not believe it in the Apostles’ meaning. Now it is evident that a new sense doth make a new Creed. But they are not so modest as to content themselves with this grand corruption, though weak delusion, for they have added new Articles of faith to our old Creed, they have composed a Trent-Creed, and they will not admit any man into their Communion, who believes the Apostles’ Creed, unless he will believe this Trent-Creed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sion’s memento, and Gods alarum. In a sermon at Westminster, before the Honourable House of Commons, on the 31. of May 1643. the solemn day of their monthly fast</cite>, (London: Samuel Gellibrand, 1643), p. 21.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><figure class="quote" id="q-4309f79060" data-kw="">
<blockquote><p>…He had always the preference given him in their synods, and was twice honored with the supreme government and headship of the university; namely, in the years 1686, and 1697. Nor must we omit, that when, in the year 1685, the states of Holland sent a splendid embassy to James the Second, king of Great Britain, who at that time was pursuing measures, which at last justly ended in his total ruin; and Wassenar, lord of Duvenwarden, and Weedius, lord of Dykeveldt, and Citerius, were the person nominated to execute sumptuous commission; the second of these noble personages easily convinced the other two, that none was so proper to attend them to England, in quality of chaplain, as Witsius; who might not only, y his uncommon knowledge in religious and civil matters, be of great service to them in both respects; but also, be no small credit to the reformed churches of Holland, by letting the English nation see what great divines flourished there. The design being intimated to Witisus, he cheerfully closed with it; though he was at that time very ill and weak in body. After some months’ stay in England, he confessed, on his return, that he had conversed with the archbishop of Canterbury, the bishop of London, and many other divines, both conformist and dissenters: “by which conversations,: he would say, “I was much furthered in learning, experience, and moderation.” From that period forward, the principal prelates and clergymen in England did not conceal the respect and esteem in which they held this great man; especially,m as he came to be more and more known to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-marck.html">Johannes Marckius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Some Account of the Life of Herman Witsius, D.D.” transl. Augustus M. Toplady</cite>, 4:60–84. London: William Baynes and Son, 1825.</span></figcaption>

ccount+of+the+Life+of+Herman+Witsius%2C+D.D.%E2%80%9D+transl.+Augustus+M.+Toplady%2C+4%3A60%E2%80%9384.+London%3A+William+Baynes+and+Son%2C+1825.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4309f79060.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4309f79060.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/08/johannes-marckius-on-witsius-embassy-to-england/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-772336f067" data-kw="">
<blockquote><p>Therefore, I again ask them, Why they say that the Church perished among the Greeks, among whom there never was any interruption in the succession of bishops - a succession, in their opinion, the only guardian and preserver of the Church? They make the Greeks schismatic. Why? because, by revolting from the Apostolic See, they lost their privilege. What? Do not those who revolt from Christ much more deserve to lose it? It follows, therefore, that the pretence of succession is vain, if posterity do not retain the truth of Christ, which was handed down to them by their fathers, safe and uncorrupted, and continue in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.2.2</span></figcaption>

</figure><figure class="quote" id="q-66a6fa8b73" data-kw="">
<blockquote><p>Cessation from labor for prayers or preaching on those appointed days of the week [by the Church], at some occasions, may be omitted… 3. …to leave work to come to the ordinary weekly meetings, they are only exhorted… for in one place where his [the bishop’s] antagonist maintains truly that the craftsman cannot be lawfully commanded nor compelled to leave his work and to go to public divine service, except on the day that the Lord has sanctified… …the 9th Head of the [Scottish] First Book of Discipline [1560], which says: ‘In great towns, we think expedient that every day there be either sermon or common prayers, etc.’ where there is nothing of compulsion or a forcing command; only there is an exhortation.</p></blockquote>

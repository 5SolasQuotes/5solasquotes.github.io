<main class="wrap"><figure class="quote" id="q-2c44db3fe2" data-kw="">
<blockquote><p>And this distinction [between actuality and potentiality] is metaphysical, not scientific (in the modern sense of “scientific’”). That is to say, it is a description of reality that is more general and basic than any scientific theory, resting as it does on facts (about change) that science itself takes for granted. Hence it is valid whatever the empirical scientific facts turn out to be; and (to repeat what was said earlier) while that doesn’t mean that it cannot be subjected to rational evaluation or criticism, such criticism can only come from some alternative metaphysical theory, not from empirical science… Aristotelian metaphysical ideas are, as I keep saying and as will be established by the end of the next chapter, unavoidable, whether the early modern philosophers thought so or not… the distinction I am making, between metaphysical ideas and scientific ones, is just an obvious one to make. As noted before, empirical science must take many things for granted, such as the existence of patterns of cause and effect. Thus, while it might be able to establish whether some particular causal relationship exists, it cannot possibly establish whether causation as such is real or not, given that its method presupposes its existence. Nor, at the most general level and for the same reasons, can it tell us what causation per se is or what kinds of causation exist. And so on for notions like actuality, potentiality, substance, attribute, form, and so on. Empirical science of its very nature cannot give us the full story about these matters; but metaphysics just is the rational investigation of them. Hence metaphysics is obviously different from empirical science.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Last Superstition: a Refutation of the New Atheism</cite>, (St. Augustine’s Press, 2008), ch. 5, pp. 172-73</span></figcaption>

<blockquote><p>How wrongly most of the Scholastic authors have thought concerning original sin can be obscure to no one who is moderately versed in their books. Nor have they recently imbibed this error of opinion, but they have retained it as drawn from ancient times and masters. For Lombard, who has held the first place in the school for now five hundred years, testifies that certain theologians before him taught that original sin is nothing but the guilt of punishment for the sin of the first man, by which his posterity are liable and subject to temporal and eternal punishment for the actual sin of Adam, so that it is neither a fault nor a punishment (Lombard, dist. 30, ch. 5). And although he not obscurely signifies that so insane an opinion is displeasing to him, he was nevertheless unable to persuade his disciples from being devolved into the same or a greater absurdity of opinion. For Scotus did not fear to affirm that after any sin whatsoever has been committed, nothing remains in us except the guilt of punishment (Scotus, in 2, d. 34, q. 1, art. 2). And Biel, a blind man, follows this blind man (Biel in 2, d. 30, q. 1). But if nothing inhered in Adam after the fall except the guilt of punishment, certainly not a fault, but a bare guilt, passed to his posterity by propagation. Durandus also makes original sin nothing other than mere guilt, when he disputes that Adam’s will is considered ours in no other way than because Adam, by sinning voluntarily, brought destruction and the privation of original justice upon us all; wherefore he denies that this sin ought to be called a fault (Durandus, in 2, d. 30, q. 2). William, Bishop of Paris, also taught this, when he proceeded so far as to defend that this natural vice is worthy of no punishment (Wilhelmus Paris, De vitiis et peccat.). Ockham professes that he would have gone into that opinion which posits that original sin is nothing but divine non-acceptance on account of some preceding demerit in another, if he were not prohibited by the authorities of certain fathers, which seemed to him to say that original fault is the lack of justice that ought to be present (Occamus, in 2, q. 14). Thus for this man, original sin would be only the non-acceptance of God on account of Adam’s offense, if he did not wish to seem to depart from the diverse opinion of the saints. Are these men ever to be thought to have even dreamed of the contagion and magnitude of original sin?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Original Sin</cite>, … against the three first books of Thomas Stapleton on the Whole Doctrine of Justification presently controverted (d. 1595; Legat, 1600), bk. 1, ch. 1 trans. AI Latin, p. 1</span></figcaption>

</figure><figure class="quote" id="q-e09ff66d19" data-kw="">
<blockquote><p>When discussing the brain Aquinas showed that he was clearly aware of its importance for the functions he analyzed… He wrote in several passages of the ‘turning back’ of the intellect within itself (reflectio), suggesting that he comprehended and dealt with what is now often called ‘circular causality’.</p></blockquote>

</figure><figure class="quote" id="q-d4371b9201" data-kw="">
<blockquote><p>The idea that no philosophies are better than [an]other has also only become less plausible in the last ten years… The idea that there are no gradations among secular thinkers with regard to natural theology and natural law or even the hidden things is empirically disproven by Jordan Peterson and like thinkers… Cornelius Van Til and Karl Barth both argued that, among all the various positions of philosophers, we should not acknowledge that some are better and others worse. They are all equally the wisdom of this age to which the hidden wisdom of Christ is opposed. Emil Brunner came back with a rebuttal, affirming the betterness of the kind of anti-materialist and moral realist philosophy of Socrates, Plato, and Aristotle and their modern successors, as opposed to the naturalism of Darwin, Marx, Freud, and Nietzsche. I would say the same for Jordan Peterson with respect to the New Atheists.</p></blockquote>

<blockquote><p>Seeing, then, that we intend by the way of reason to pursue those things about God which human reason is able to investigate…</p></blockquote>

<blockquote><p>XIII. Third, as to place, the question can be understood in two ways. It may be understood definitely concerning the certain and constant seat of the church (such as Rome is) and in that continued series of bishops or pastors which the Romanists would wish. But this is false.(a) The church of the New Testament is bound to know fixed place as in the Old, but is ambulatory and migrates from place to place, as appears from the example of the Asiatic churches spoken of in Rev. 2 and 3 And many others which have perished. (b) It Is not bound to have that succession, since it either wholly fails with the churches themselves or is changed into a succession of walls who devour the flock (Acts 20:29) Or who impiously domineer over it (2 Thess. 2:3, 4). Or it may be understood indefinitely of a seat and domicile in general, which, according to the dispensation of God, it has obtained in various places, now here and then there. XIV. In this sense, we say the true church before Luther and Zwingli was already in various assemblies separated from the Roman church, many of which, it is certain, existed both in the east and in the west. The arrogance (authadeia) and tyranny of the Roman bishop, in the corruption of doctrine as well as in the depravation of worship and innovations upon the order and government of the church, so displeased them that they not only never wished to subject themselves to him, but did not hesitate openly to oppose and turn away from him. It is well known that the Waldenses and Albigenses were particularly such. As long as they either relied upon the authority of princes or trusted to their own numbers, these could hold public assemblies and save us rendered the church visible and conspicuous, as in Bohemia, in certain parts of England and in the provinces of southern France—Aquitania, Occitania (Languedoc)—and in the Narbonne Region of France as far as the Alps. But afterword the princes, excited by the fury and arts of the Roman bishop and fascinated by a blind zeal, persecuted those pious believers with arms in order to gratify him, ejected them (wasted vicarious defeats and most cruelly treated) from their cities and natural habitations and endeavored to destroy them by fire and the sword. Then the external appearance of that part of the church was indeed so obscured that it seemed to have altogether failed. In the meantime, the monuments of history testify that a remnant of them still survived (although disbursed and scattered) in various places, especially in the pier in the end for us and the enclosed valleys at the basis of the Alps. Even this single fact would be sufficient to rebut the unjust crimination of our opponents—that we cannot show where our church was before Luther—since it is evident that those purer Christians who held the same faith with us in essentials existed in various places and have their segregated assemblies, although somewhat concealed. And since no mention is made by historians of their secession from the Roman church, it is reasonable to infer that they never had any communion with her, but always lived separated from her and had preserved pure and uncontaminated the truth handed down to them by the preaching of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.10.13–14.</span></figcaption>

<blockquote><p>Answer: 1. The word ‘Church’ usually signifies among Christians a Christian society, or a company of Christians associated for God’s worship and mutual edification; sometime any company of Christians whether so associated or not; sometime those are called ‘Christians’—as distinct from infidels—who profess most of the substance of Christianity but deny some part, or who profess the whole substance or the fundamentals, though they contradict it again by plain consequence in other superadded points, though these, as compared with the orthodox, are wont to be called heretics. We deny not but that the greatest Papists are such Christians, and that as the word ‘Church’ is applicable to combinations or companies consisting of such materials, so far the Romanists are a true Church, supposing that we only speak of metaphysical truth. But as the word ‘Christian’ is taken for one that so holds the fundamentals of Christian faith as not to subvert them by plain consequence after he has professed them, so it is yet under dispute whether the Romanists be a true Church, and therefore not to be taken as granted. However, those Protestant divines that grant them to be a true Church do say that it is but by a metaphysical verity, convertible with the essence; but that morally it is a false Church and not a true one, as a thief is a true man, that is, truly a man, but he is not a true man, that is, not an honest faithful man. 2. The thing called ‘The Church of Rome’ does not consist of homogeneous parts, or at least that word signifies several sorts of persons. There are some that with the Pope and his cardinals entertain the full body of Popery and enslave the rest. There are multitudes of the people that silently live under them and let them alone, and are defiled by them in many things, but receive not the great and most dangerous part of their corruption. These are not equally to be called the ‘Church,’ nor are they equally in danger of damnation. 3. I deny the consequence of the major proposition. For if the Church of Rome be a ‘true Church,’ it is because they are true Christians, and not because they are Papists: so that to argue, ‘The Church of Rome is a true Church, therefore Popery is a safe way to salvation,’ is as unsound as to argue: Gehazi the leper is a living man, therefore the leprosy is a thing safe or profitable to man’s life. Popery is the disease of their Church, and Christianity is what makes them a Church. You may well therefore conclude that Christianity is a safe way to heaven, but not that Popery is so. To the confirmation I answer that the religion of Papists has two parts: the Christian religion, as they are Christians, and that makes them a true Church if they be one; and the Popish corruptions, which denominate them Papists, and that makes them not a true Church, nor is a safe way to salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Safe Religion, or Three Disputations for the Reformed catholic religion against Popery proving that Popery is against the Holy Scriptures, the unity of the catholic Church, the consent of the ancient doctors, the plainest reason and common judgment of sense itself</cite>, ... (London: Miller, 1657), ‘Query: Whether Popery be a safe way to salvation?’, p. 177</span></figcaption>

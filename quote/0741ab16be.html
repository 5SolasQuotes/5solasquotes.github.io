<main class="wrap"><figure class="quote" id="q-0741ab16be" data-kw="">
<blockquote><p>Objection [arguing for Purgatory]: ‘Verily I say unto thee, thou shalt not come out thence, till thou hast paid the utmost farthing.’ Answer: In the first of St. Matthew it is said that Joseph knew not his wife, till she had brought forth her firstborn son. Augustine expounds that place by the raven that Noah did send forth: and saith that the raven did never return again: even so Joseph never knew the virgin Mary, for she is a virgin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Staff of Christian Faith</cite>, … (d. 1567; 1577), ‘Of Purgatory’, p. 150</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9b699ede97" data-kw="">
<blockquote><p>In the ninth place, he [Bellarmine] frames this objection: It is necessary to believe that Mary continued a virgin always. But this is not certain from the scriptures: therefore [according to Bellarmine], some necessary things are known from some other source besides the Scripture… I answer: As to the perpetual virginity of Mary, it is no business of mine to meddle with that dispute. I content myself with saying that the fathers who managed the controversy with Helvidius, adduced not only some obscure traditions, which no one would rank very high, but made use also of testimonies from Scripture. So Proclus Cyzicenus alleges a passage from Ezekiel about the gate which should be closed [Eze. 44:2]. So Ambrose (Sermon 4 and 5). So also Ambrose (Epistle 31 and 79) proves the same from John, where Christ commends his mother to John’s care; which He would not have done if she had a family of children. Epiphanius prosecutes this argument still more copiously against the Antidico-Marianites. Jerome contends against Helvidius with many passages of Scripture; and in like manner other fathers. Therefore, if these fathers determined aright, this opinion is not absolutely without scriptural authority. Now, as to the Jesuit’s assertion that it is an article of faith to believe the perpetual virginity of the blessed Mary, I say that Basil thought otherwise: for, in his Homily on Christ’s nativity, he says that we should not curiously dispute upon this subject, but that it is enough to know that she had no children before Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, … (d. 1595; Cambridge: Parker Society, 1849), pp. 538-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-33fb3b11d1" data-kw="">
<blockquote><p>We make our prayers in that tongue which all our people, as meet is, may understand, to the end they may (as Paul counselleth us) take common commodity by common prayer, even as all the holy fathers and Catholic bishops, both in the Old and New Testament, did used to pray themselves, and taught the people to pray too, lest, as Augustine saith, &quot;like parrots and ousels we should seem to speak that we understand not.&quot; Neither have we any other mediator and intercessor, by whom we may have access to God the Father, than Jesus Christ, in whose only Name all things are obtained at His Father&#x27;s hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>

</figure><figure class="quote" id="q-61a2efa655" data-kw="Mary Queen of Heaven Mediator">
<blockquote><p>Except for those honorary titles which belong to God the Lord and to our only Saviour, one may give her the highest and most glorious titles. … But that we do not name her a Goddess, a Mediator between God and men, an all-knowing and almighty Queen of Heaven, a Gate of the Heavenly Paradise, a Redeemer, a Reconciler of the human race, and more suchlike honorary titles which were raised by men, comes solely therefrom, that suchlike honorary titles are adverse to the honour of God and of Our Saviour.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-0adcdeda30" data-kw="">
<blockquote><p>God has appointed no lawful calling, such as trafficking by seas and frequent travelling ordinary to transient members of the visible Church, to be inconsistent with the lawful partaking of the ordinances of grace and seals of the Covenant; for only those who do not try and examine themselves and are profanely scandalous are excluded as swine from the holy things of God and from the Lord’s Supper, not men, because they are necessarily busied in a lawful calling and must ordinarily travel to far countries and so cannot be members of a single parish: 1. This is a physical impediment and not a sin, nor a moral impediment, excluding any from the seals of grace, yea and [such a prohibition is] an unwritten tradition. 2. I speak against that difference which the author makes betwixt the seals of grace in the Old Testament and the seals of grace in the New Testament, for there were physical and civil defects in the Old Testament which by a divine law made some incapable of the Passover, as if any were lepers, bastards, born Moabites and Ammonites or typically unclean, or had touched the dead, they could not eat the Passover though otherwise they did believe in Christ to come and were morally clean; but by the contrary under the New Testament there be no physical or ceremonial defects, no callings, no civil relations, but only moral defects and sinful scandals which do exclude men from the seals of grace, except you bring in ceremonies in the New Testament of your own devising for all nations, so they believe in Christ, Jew, or Gentile, Barbarian, or Scythian, bond or free, male or female, are to be baptized, Mt. 28:19; ‘God is no accepter of persons,’ or nations, or callings, Acts 10:34-35; compare this with verses 46-47 and Gal. 3:27, ‘For as many of you as have been baptized unto Christ, have put on Christ,’ v. 28, ‘There is neither Jew nor Greek, there is neither bond nor free, there is neither male nor female, for you are all one in Christ Jesus;’ so Gal. 6:15, ‘For in Christ Jesus neither circumcision avails any thing, nor uncircumcision, but a new creature.’ I must then say, it is boldness in men to say that there is a lawful calling in the New Testament which our Brethren are pleased to call ‘the strong hand of God’, which makes persons who are new creatures and baptized unto Christ uncapable of the seals of grace. Dear [congregationalist] Brethren, yield to the clear and evident truth of God.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d81995a250" data-kw="">
<blockquote><p>First Argument [of Rutherford]: In the first receiving of members by the apostles, there was but a professed willingness to receive the Gospel, howbeit some received it not from the heart. Mr. Hooker answereth: ‘There was not only a professed willingness, but a practical reformation, that in the judgement of charity giveth grounds of hope that there is something real, before the contrary appear; Therefore, Peter who received Magus upon his approbation of the truth and outward conformity thereunto in the course of his life, rejected him as one in the gall of bitterness, who had no share in Christ, and therefore certainly would not suffer him in the privileges of communion, so persisting without repentance.’ [Rutherford’s] Answer 1: [Hooker says:] ‘Not professed willingness, but also practical reformation is required.’ But is not professed willingness in murderers of Christ, who said, ‘What shall we doe to be saved?’ some practical reformation? There is nothing but conjectures that the apostles did not admit all and every one of the three thousand until they had experience of their state of grace and judicially determined so of them all. ([Margin note:] Mr. Hooker neither proves, nor can prove that the apostles had habitual experience in so few hours, all and every one of the 3,000 (Acts 2) gave evidence of real conversion to the apostles.) (2). This practical reformation was not an experience of their practice of savory walking, required by Mr. Hooker (p. 1. ch. 2, pp. 14-15) in visible saints before admission, except some four or five hours time may create an habitual experience, for the same very day they were baptized (Acts 2:41). (3) Mr. Hooker should prove that the apostles found this practical reformation in all, Ananias, Saphira, and the whole 3000; and that the apostles tried and smelled the savouriness of saving grace in all; in Saphira; the text giveth not the least jot of this, we must take it upon the naked assertion of Mr. Hooker (4) That this practical reformation gave to the apostles’ judgement of charity ground of hope that there was something real, that is, the whole number, about three thousand (none excepted, for all were made Church-saints visible) gave grounds of hope that they were all really (otherwise their speaking and hearing the word was real, that is, not imaginary) internally and effectually called, and born over again of the spirit, and so chosen to life eternal from eternity, before the apostles durst, without the offending of God, admit them to Church-fellowship and visible communion; those [things] (I say) must be proven. If I durst [dare], I am not far from judging the godly and judicious in cold-blood, free of heat of dispute, dare not so judge of the text, Acts 2 or Acts 8. (5) There is no shadow, Acts 8, that Peter (Mr. Hooker should say Philip) admitted not Magus while he saw such grounds of the sorcerer’s real conversion and real predestination to glory. (6) Peter said that Magus had no share in Christ. True, but said he that he was an unbaptized man who had no share in the visible Church? No. (7) But he would not suffer Magus to share in the privileges of communion, he persisting without repentance. True, but it is no answer to the argument from the manner of receiving in, this is something to the casting out, (8) that Peter reproveth him in the gall of bitterness [and] 2. Exhorts him to repent, to pray for pardon, [these last two things] were great privileges of Church-communion bestowed upon Magus.</p></blockquote>

<blockquote><p>II. We own all those as visible Christians and members of the universal Church that make a credible profession of Christianity and destroy it not by heresy or ungodly lives. III. So many of these as also consent to hold communion with this church as members of it, submitting to the ministers and discipline of Christ, we shall esteem our flock and special charge, and faithfully perform the duties of our office for their good, as we are able.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Religion expressed: I, briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II, more largely in a Profession taken out of the Holy Scriptures, containing 1, the articles of the Christian Belief, 2, our consent to the Gospel Covenant, 3, the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660), The Order &amp; Discipline of this Church, agreeable to the Word of God</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“II. We own all those as visible Christians and members of the universal Church that make a credible profession of Christianity and destroy it not by heresy or ungodly lives. III. So many of these as also consent to hold communion with this church as members of it, submitting to the ministers and discipline of Christ, we shall esteem our flock and special charge, and faithfully perform the duties of our office for their good, as we are able.”

— Richard Baxter, The Christian Religion expressed: I, briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II, more largely in a Profession taken out of the Holy Scriptures, containing 1, the articles of the Christian Belief, 2, our consent to the Gospel Covenant, 3, the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660), The Order &amp; Discipline of this Church, agreeable to the Word of God">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CII.+We+own+all+those+as+visible+Christians+and+members+of+the+universal+Church+that+make+a+credible+profession+of+Christianity+and+destroy+it+not+by+heresy+or+ungodly+lives.+III.+So+many+of+these+as+also+consent+to+hold+communion+with+this+church+as+members+of+it%2C+submitting+to+the+ministers+and+discipline+of+Christ%2C+we+shall+esteem+our+flock+and+special+charge%2C+and+faithfully+perform+the+duties+of+our+office+for+their+good%2C+as+we+are+able.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Christian+Religion+expressed%3A+I%2C+briefly+in+the+Ancient+Creeds%2C+the+Ten+Commandments+%26+the+Lord%E2%80%99s+Prayer%2C+and%2C+II%2C+more+largely+in+a+Profession+taken+out+of+the+Holy+Scriptures%2C+containing+1%2C+the+articles+of+the+Christian+Belief%2C+2%2C+our+consent+to+the+Gospel+Covenant%2C+3%2C+the+Sum+of+Christian+Duty+according+to+the+primitive+simplicity%2C+purity%2C+and+practice%2C+fitted+to+the+right+instruction+of+the+ignorant%2C+the+promoting+of+holiness%2C+and+the+charitable+concord+of+all+true+believers%E2%80%A6+%28London%3A+1660%29%2C+The+Order+%26+Discipline+of+this+Church%2C+agreeable+to+the+Word+of+God&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feab77032b0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eab77032b0.html">Permalink</ </figure><figure class="quote" id="q-0ee44f02bd" data-kw="">
<blockquote><p>It is a common infirmity with many men to wish their opinions turned into laws. They think certain things right and expedient, and instead of being content to act on their own judgment, and allow others to act on theirs, they desire their view of the matter to be made obligatory on all their brethren… Another thinks that a regular dismission of a Church member should be given only in certain cases, and he wishes his private judgment to be turned into a public law. In an extended Church like ours, there are few evils which ought to be more sedulously avoided than excessive legislation. Leave as much liberty to all concerned as possible, if you wish to preserve peace or union. As to this question of communion, it is well known that there are two very different views arising out of different theories of the nature and design of the Church. The one view is that of the great body of the Christian world, and is the clear doctrine of our standards. It assumes that the terms of Christian communion are unalterably fixed in the Word of God, and can be neither increased nor diminished by any human authority. This is one great principle. Another is, that nothing can justly be required as a term of Christian communion, which Christ has not made necessary to admission to heaven. In other words, that we are bound to receive and treat as Christian brethren all whom Christ receives as disciples. We are not to make ourselves stricter or holier than He… Every Church must receive, in fact, all whom she regards as the true followers of Christ. Therefore, the lowest terms of salvation are the highest admissible terms of communion. If these principles are correct, it follows that however restrictive are the conditions a Church may see fit to establish as the terms of ministerial fellowship, it must recognize as a sister Church every body which holds and teaches the fundamental doctrines of the gospel, however erroneous it may be in other respects; and, therefore, it cannot with any consistency refuse either to receive members from such Church, or to dismiss them to it. That is, so far as general principles are concerned. For there may be particular cases in which, for special reasons, it is proper to refuse to receive a member from another Presbyterian church, belonging to our own body… The other radically different view of Christian communion is that which is characteristic of our Scotch brethren, and especially of the secession portion of them. They regard the Church so much as a witness for the truth, that they overlook its wider aspect as a “congregation of faithful men,” or ” the communion of saints.” They consider themselves, therefore, as joining in the testimony of any Church with which they commune; and they require all who wish to commune with them to join in their peculiar testimony, whatever it may be. Of course they cannot consistently commune themselves, nor allow their members to commune with any other than their own churches. Even some of the leaders of the Free Church of Scotland seemed, at first, in danger of falling into this false theory. They were in their zeal for cutting off all communion with the Established Church [of Scotland], lest, as they said, they should vitiate their testimony. Happily for them and the cause of Christ, this was a passing cloud. That Church has adhered to the scriptural doctrine, which has ever been held sacred by the great body of Protestants. Christian communion is communion of men as Christians, not as Presbyterians, Methodists, or Episcopalians. We recognize those with whom we commune, or to whom we dismiss our members, as Christians, and as nothing more. We give no sanction to their peculiarities, whatever they may be… We have so often heard the strongest feeling expressed by our pastors on this subject, that we are persuaded that any attempt of the General Assembly to prevent their enjoying on this subject the liberty wherewith Christ hath made them free, would be followed by the most unhappy consequences. We rejoice, therefore, in the wise disposition of this matter recorded above.</p></blockquote>

<blockquote><p>Among the Scottish Commissioners at the Westminster Assembly, Samuel Rutherford was the foremost representative of this type of piety, and in the Assembly debate on fixed congregations, he supported the Independents to some degree. He said that being in the vicinity was not an adequate basis for determining church membership, but that the consent of the people was also necessary. While he rejected the necessity of a church covenant on the local level, he did advocate a “voluntary agreement” on the part of church members in order to form a congregation.1 It may be that his views had something to do with the mildness with which the Assembly treated the gathering of churches. 1. MS, II, fol. 30.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wayne-spear.html">Wayne Spear</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanted Uniformity in Religion: The Influence of the Scottish Commissioners Upon the Ecclesiology of the Westminster Assembly</cite>, p. 217.</span></figcaption>

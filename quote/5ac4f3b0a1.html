<main class="wrap"><figure class="quote" id="q-5ac4f3b0a1" data-kw="">
<blockquote><p>The Scriptures Divine are the most ancient Records in the World; but it follows not, that because the Scriptures do not Record how the Patriarchs did observe the Sabbath, therefore they observed it not; but much rather, because, the Scriptures Record, that The Lord blessed the seventh Day, and sanctified it, therefore the Patriarchs did observe it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Morality of the Fourth Commandment, as still in force to bind Christians</cite>, (London, 1641), p. 57.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eb9354003c" data-kw="">
<blockquote><p>Chrysostom shows that it was the manner of the heathen Grecians to come to prayer covered thus, and Beza alleges Plutarch speaking of the Romans, that they worshipped their gods being covered and bowing their heads. Wherefore it was necessary for the apostle to admonish them hereof, there being some doubtless, who notwithstanding the order before settled at Corinth, did cleave to this their superstitious manner still… Here is no ground then for being bareheaded in the congregation, as some imagine, nor yet for the preachers being bareheaded, but that he may wear a little cap to defend him from the cold, as Calvin allows, or a hat, where the order of the Church is such in token of authority, as Beza contends, and is the manner of the French Church, because howsoever it was then, now it is a sign of authority amongst men to be covered, and of subjection to be uncovered. The only thing to be gathered hence is that all should be held with such reverence of the public place, as that they should do nothing unseemly there, of what sex or condition soever they be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon All the Epistles of the Apostle Saint Paul</cite>, ... (London, 1631), on 1 Cor. 11 Mayer (1583–1664) was an English clergyman, who, it appears, conformed at 1662. | Question 2</span></figcaption>

<blockquote><p>‘Occasional‘, properly, is that which has a reason, not from the nature of the thing itself, but from such occasional occurrences of providence, as God will not alter, and its that which has no moral nor sacred conveniency with the nature of worship, but has only a conveniency for such a time and place, as Christ’s preaching in a ship, when He is at the sea side, and a multitude are to hear Him, the ship has no agreement with the nature of preaching, more than a house has. Time, place, and persons are clearly such as agreed with that [Last] Supper, as [a supper] first, not as a sacred worship; and therefore [these particulars] were merely occasional, and so not imitable [by us]; and though Christ might have altered them, yet had they been occasional, and they have no sacred conveniency with this Supper, as this Supper; and if Christ had altered these for mere will, upon no reasons that concerns all suppers, they had not been occasional, but positive points of worship, and so had obliged us;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), p. 193</span></figcaption>

%20obliged%20us" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5a974ade61" data-kw="">
<blockquote><p>Now this Captivity of the people of the Jews, as it was res gesta, a thing real and done, an affliction brought upon them for their sinning against the Lord: So I find it in Scripture applied to three things, as a resemblance and type thereof. First, It is applied to the natural estate of all men, who were at first created free, being subject to none, but only to him who is Lord over all, but are now by sin like the Jews in an estate of bondage. This application I find made by the Apostle, 2 Cor. 6.17. Come out from among them, touch no unclean thing. Which words were first spoken to and of the Jews, in Esay 52. ver. 4.11. calling them out of their Captivity. But the Apostle applies them to all, whether Jews or Gentiles in their natural uncleanness, calling upon them to come out of the sinful pollution of the world.

Secondly, It is applied to the state of the Church under the tyranny of Antichrist; for as that Eastern Babel did afflict and oppress the Jews, which were then the Church of God; so Rome the Western Babel doth keep under the Church of God now, and long time hath done, and therefore the people of God are called to come out of her, as the Jews were called to come forth from the Eastern Babel, Jer. 51.6.8. Jeremie speaks it of Eastern Babel, John applies it to the Western, yet not mis-applying, because the one was a type of the other.

Thirdly, It is applied to the present miserable forsaken condition of the Jews, in which they now lie, they being now a refuse people, cast off by God, for their casting off of Christ. He came to his own, but his own received him not; he would have gathered them, but they would not be gathered, they rejected him, therefore he also rejected them: so that they are now scattered abroad again, and become a vassal, a captive people, having no free State of their own, but living under the dominion of other people. This estate of theirs, Esay [Isaiah] sets forth in words not much differing from my text; This people (saith he) is robbed and spoiled, and shall be snared in dungeons; they shall be hid in prison-houses; they shall be for a prey, and none shall deliver, for a spoil, and none shall say, restore.

And this their present bondage is typed out by their captivity in Babylon; as we may see by comparing Rom. 11.26. with Esay 59.20. That which was in the letter of it, spoken of their deliverance out of Babylon, from under the Chaldeans, the same doth the Apostle apply to their last deliverance, which is yet to come. The redeemer shall come to Sion, and turn ungodliness from Jacob. As their captivity in Babel, resembled their present captive condition now, so their deliverance out of Babel then, typed out their deliverance which shall come unto them out of their present misery, when the Redeemer shall again come unto Sion, and turn away ungodliness from them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-bulkeley.html">Peter Bulkeley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The gospel-covenant; or The covenant of grace opened</cite>, (London: Benjamin Allen, 1646), pp 2-3.</span></figcaption>

<blockquote><p>The 72d Psalm is an eminent instance of Christ being the subject matter of praise; the person spoken of. To apply it exclusively to David or to Solomon would contradict the facts of history and be little short of impiety. An infinitely greater than David or Solomon is here. While the petition with which the Psalm begins can apply to them both, in a far higher sense it applies to him who is both David’s Son and Lord. In this song the Old Testament worshipper prayed for the establishment and perpetuity of the kingdom of the Messiah before he came into the world. We in singing it and other Messianic songs celebrate the greatness of the kingdom and the glory of the King.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-sproull.html">Thomas Sproull</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Psalms in Reformed Presbyterian and Covenanter</cite></span></figcaption>

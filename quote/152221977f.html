<main class="wrap"><figure class="quote" id="q-152221977f" data-kw="">
<blockquote><p>Obj: 1: The First Objection is grounded on the 2 Cor. 6 17. Wherefore come out from among them, and be ye separate &amp;c. This is the strongest of their Arguments: The Lord commands the Corinthians to come from among them and Separate; And therefore (say they) when there are wicked men coming together with the Godly, the Godly ought to separate from them.

But to shew you the vanity of the Argument we shall Answer it by reading out the rest of the verse; For it is clear what the Apostle aims at—Be ye separate, saith the Lord, and touch not the unclean thing &amp;c. He bids them only Separate from Sinful Actions, and not from Lawful Duties.

That ye may see yet further the vanity of this Reason, Know, It was the custom in the Church of Corinth 1 Cor. 10. When Idolaters would invite some of their Christian neighbours, they would go with them, and eat with them at their Idol Feasts, and they thought they might lawfully do it, because they knew their Idols were not true Gods, and so by their eating they intended no worship to the Idol, as these Idolaters did who did eat with them, but did it only to satisfy their hunger and keep up common Friendship:

Now Paul discharges them from this kind of Communion, and this is it he points at here, Be separate, Do not meddle with their Idol Feasts because it was indeed Communion with them in their Idolatry: And so it doth not follow, because Paul bids the Corinthians be separate from Heathens, in doing a thing sinful, That therefore he forbids Christians to join in a lawful Worship with the Church of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief refutation of the errors toleration, Erastianism, Independency and separation delivered in some sermons from I Joh. 4. I, preached in the year 1652: to which are added four sermons preached on several occasions</cite>, (Edinburgh: George Mosman, 1692), pp 226-27.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-be7807c081" data-kw="">
<blockquote><p>It is very much abused, if it be offered to any such thing as that we must come out from among the ministers, and be separated from them, for:

1. This separation here commanded is from infidels, unrighteousness, darkness, Belial, idols. The Corinthians did very ill in eating and sitting at the idols’ tables of the gentiles, which gave great offense to the weak, 1 Cor. 10:17, 20.

2. This was not a separation from the Church of Corinth, nor from the ministers thereof; though there were many corruptions entertained among them, yet they were to have communion in public ordinances, as is proved above: Only it is a separation from the idolatry in it. There may be a separation from the corruptions of a Church, very well consistent with abiding in the communion of that Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

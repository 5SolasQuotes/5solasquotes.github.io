<main class="wrap"><figure class="quote" id="q-691f2912ce" data-kw="">
<blockquote><p>The Antinomians made a very Early Appearance, I see, among the Depravers and Subverters of the Faith once delivered unto the Saints. There are indeed very few New Errors broached in our Later-Days; the most of them, which now disturb the Churches of the Faithful, are only from I scarce know what Enchantments, raising the Ghosts of such as were Dead and Damn’d many Ages ago.

The Impious, and Mischievous Men, against whom the Inspired Writer is now Engaged, have their Impiety here declared. First, The Ungodly Men stand charged with Filthiness. They were, that I may use the most agreeable Term, which the French Translation Leads me to, A very Dissolute Generation. I take notice by the way, that the Greek Term, here used for, Lasciviousness, or Wantonness, is derived from the Name of the Town Selga; a Place infamous for such Dissolute Practices. It makes me wish, that no Town of ours, may in our Days, have any Vice abounding in it, so as with a lasting Infamy to derive a Name unto it. I am loathe here to Explain my self too particularly!</p></blockquote>

<blockquote><p>[T]he Antinomian is to be abominated, that derogates from the value and validity of the Law: and contends, that it is to all purposes extinct unto believers, even so much as to its perceptive and regulating power … But this is a most pestilent doctrine, which plucks down the fence of the Law, and opens a gap for all manner of licentiousness and libertinism to rush upon the Christian world; for seeing the Moral Law is no other than the Law of Nature written upon man’s heart at the first, some positives only being superadded; upon the same account as we are men, upon the same we owe obedience to the dictates of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Ten Commandments: With Other Sermons</cite>, (London, 1692), p. 22.</span></figcaption>

</figure><figure class="quote" id="q-23748f47af" data-kw="">
<blockquote><p>In 1534 Philip Melancthon, perhaps in conjunction with lectures on Colossians delivered around the same time, produced a third edition of the Scholia. In it for the first time, he increased the number of functions, or uses, of the law from two to three… …It involved the persistent emphasis on the necessity of good works… …The notion that the law has uses or functions is a peculiarly Protestant concept with origins deep within Martin Luther’s theology. Gerhard Ebeling has demonstrated how the distinction between law and gospel and Luther’s insistence that God works on human beings through the Word resulted in Luther developing a twofold use of the Law… …Definitions of two uses of the law first appeared in an exposition of the epistle lesson for New Year’s Day; this sermon was published in 1522 as part of Luther’s Weihnachtspostil and seen through the presses by Melancthon. … Luther never saw a need to increase the uses of the law above two and thus create a separate use for believers… For Luther, the human being encountered the law in the two realms of human existence: coram Deo [before the presence of God] and coram hominibus [before the presence of men]. Thus, there was never any need for more than two uses of the law. In his theology the law never had an independent existence that demanded definition, but it was always a part of the human encounter with God. The 1527 and 1528 Scholia were the first publications in which Melancthon explicitly defined two functions of the law… …in 1534 Melancthon altered this section [of his Scholia on Col. 2:17] to read: “…God gave the law for these three reasons: to coerce the flesh and to terrify or humble. The third reason pertains to the righteous, that they may practice obedience.”… …The conscience, made good by God’s gracious declaration, must by necessity use the law to please God. No wonder Melancthon’s theology now needed a third use of the law! … For what reasons did this shift occur in Melancthon’s theology? As Rolf Schafer and others have pointed out, Melancthon’s focus on the law and its third use actually had its roots in his earliest published theology… But the very fact that Melancthon somehow felt constrained to change these earlier comments to reflect even more clearly his developing position suggests that something must have happened in the meantime. A crucial factor is the memory of Melancthon’s encounter with John Agricola. There is little doubt that Agricola’s denigration of the Decalogue–itself a reaction to Melancthon’s theology–caused Melancthon to strengthen his defense of the role of the law in the Christian’s life… … There was no question, too, that some of the changes in the Scholia–one thinks particularly of the third use of the law–were refined by Melancthon in his second edition of the Loci [Common Places] and in turn employed by a young French exile, John Calvin, in the first edition of his Institutes of the Christian Religion [1536].</p></blockquote>

.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/antinomianism/#:~:text=In%201534%20Philip%20Melancthon%2C%20perhaps%20in,Institutes%20of%20the%20Christian%20Religion%20%5B1536&amp;text=In%201534%20Philip%20Melancthon%2C%20perhaps%20in%20conjunction%20with&amp;text=of%20his%20Institutes%20of%20the%20Christian%20Religion%20%5B1536" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8cc1f36030" data-kw="">
<blockquote><p>It is most surprising to me that anyone can claim that I reject the law or the Ten Commandments, since there is available, in more than one edition, my exposition of the Ten Commandments, which furthermore are daily preached and practiced in our churches. (I am not even mentioning the Confession and the Apology and our other books). Furthermore, the commandments are sung in two versions, as well as painted, printed, carved, and recited by the children morning, noon, and night. I know of no manner in which we do not use them, unless it be that we unfortunately do not practice and paint them with our deeds and our life as we should. I myself, as old and as learned as I am, recite the commandments daily word for word like a child. So if anyone perchance gained some other impression from my writings and yet saw and perceived that I stressed the catechism so greatly, he might in all fairness have addressed me and said, “Dear Dr. Luther, how is it that you emphasize the Ten Commandments so much, though your teaching is that they are to be discarded?” That is what they should have done, and not worked secretly behind my back and waited for my death, after which they could make of me what they would. Ah well, let them be forgiven who cease doing this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Against the Antinomians’ in Luther’s Works</cite>, vol. 47: The Christian in Society IV, ed. Pelikan, Oswald &amp; Lehmann (Philadelphia: Fortress Press, 1999), pp. 109–110</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It is most surprising to me that anyone can claim that I reject the law or the Ten Commandments, since there is available, in more than one edition, my exposition of the Ten Commandments, which furthermore are daily preached and practiced in our churches. (I am not even mentioning the Confession and the Apology and our other books). Furthermore, the commandments are sung in two versions, as well as painted, printed, carved, and recited by the children morning, noon, and night. I know of no manner in which we do not use them, unless it be that we unfortunately do not practice and paint them with our deeds and our life as we should. I myself, as old and as learned as I am, recite the commandments daily word for word like a child. So if anyone perchance gained some other impression from my writings and yet saw and perceived that I stressed the catechism so greatly, he might in all fairness have addressed me and said, “Dear Dr. Luther, how is it that you emphasize the Ten Commandments so much, though your teaching is that they are to be discarded?” That is what they should have done, and not worked secretly behind my back and waited for my death, after which they could make of me what they would. Ah well, let them be forgiven who cease doing this.”

— Martin Luther, ‘Against the Antinomians’ in Luther’s Works, vol. 47: The Christian in Society IV, ed. Pelikan, Oswald &amp; Lehmann (Philadelphia: Fortress Press, 1999), pp. 109–110">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+most+surprising+to+me+that+anyone+can+claim+that+I+reject+the+law+or+the+Ten+Commandments%2C+since+there+is+available%2C+in+more+than+one+edition%2C+my+exposition+of+the+Ten+Commandments%2C+which+furthermore+are+daily+preached+and+practiced+in+our+churches.+%28I+am+not+even+mentioning+the+Confession+and+the+Apology+and+our+other+books%29.+Furthermore%2C+the+commandments+are+sung+in+two+versions%2C+as+well+as+painted%2C+printed%2C+carved%2C+and+recited+by+the+children+morning%2C+noon%2C+and+night.+I+know+of+no+manner+in+which+we+do+not+use+them%2C+unless+it+be+that+we+unfortunately+do+not+practice+and+paint+them+with+our+deeds+and+our+life+as+we+should.+I+myself%2C+as+old+and+as+learned+as+I+am%2C+recite+the+commandments+daily+word+for+word+like+a+child.+So+if+anyone+perchance+gained+some+other+impression+from+my+writings+and+yet+saw+and+perceived+that+I+stressed+the+catechism+so+greatly%2C+he+might+in+all+fairness+have+addressed+me+and+said%2C+%E2%80%9CDear+Dr.+Luther%2C+how+is+it+that+you+emphasize+the+Ten+Commandments+so+much%2C+though+your+teaching+is+that+they+are+to+be+discarded%3F%E2%80%9D+That+is+what+they+should+have+done%2C+and+not+worked+secretly+behind+my+back+and+waited+for+my+death%2C+after+which+they+could+make+of+me+what+they+would.+Ah+well%2C+let+them+be+forgiven+who+cease+doing+this.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+%E2%80%98Against+the+Antinomians%E2%80%99+in+Luther%E2%80%99s+Works%2C+vol.+47%3A+The+Christian+in+Society+IV%2C+ed.+Pelikan%2C+Oswald+%26+Lehmann+%28Philadelphia%3A+Fortress+Press%2C+1999%29%2C+pp.+109%E2%80%93110&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8cc1f36030.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href=" <blockquote><p>THE Case handled in the following Discourse is of as great Moment as almost any thing that I know of; a right understanding of this Truth is necessary, &amp; the disputes of the present times call unto a more accurate and distinct enquiry into it. The danger is great, whiles some in pretence of honouring free Grace, despise the Command, and open a door of Licentiousness; and others to avoid this, verge as much to the Contrary extreme, and bring in a New-Covenant of Works: the keeping a due distance between both of these is a Christian’s wisdom: which is done, when we give to the LAW what is it’s due, and to GRACE that which belongs to it. If what is here offered, may Contribute any thing to the Information, or Establishment of any so as to help them to steer steady between these Rocks; the Publication of it will not be unseasonable: which that it may, I Commend it to the Divine Blessing,</p></blockquote>

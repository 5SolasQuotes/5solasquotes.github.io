<blockquote><p>THE NATURE OF GOD. John 17.3. This is life eternal, that they might know thee, the only true God.

Princ. It is life eternal, to know the only true God. God is a Spiritual Being, infinite in all Perfections. A Spiritual Being; and so without Body, Parts, or Passions. Infinite; and so without Cause, without defect, and without limit. In all Perfections; so remove all imperfection from anything, and you see God. And conceive a Spiritual Being, abounding with all Perfections, and that is God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-steele.html">Richard Steele</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A scheme and abstract of the Christian religion. Comprized in fifty two heads, with the texts of scripture, on which they are grounded. And some short indications, how they were more largely handled. By a lover of truth and peace</cite>, (London: Samuel Sprint, 1684), p. 3.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1cd715af93" data-kw="">
<blockquote><p>Effects arisen and dependent from faith considered organically are:

I. Real and passive, or received, union with Christ, and ingrafting into the new covenant, and thus communion of all goods in Christ.

II. Passive reconciliation and justification (as they call it), or rather internal, in us—from which is distinguished external or active justification, which is concerning us. Furthermore, this necessary distinction [between active and passive justification] has been illustrated above all others, and clearly and solidly defended by Dr. [Johannes] Maccovius in his Theological Collection, pt. 4, Disputation 9, compared with pt. 3, Disputation 16, and his particular syllabus of disputations on Justification. And we in the Problems on Justification shall vindicate it ἐν παρόδῳ [en parodō, in passing] from certain objections. There is no reason therefore to pursue it here at greater length. Only I add these three things for the sake of younger students:

      1. That intrinsic or passive justification is viewed in a twofold manner: either as without sense, or as with sense. In the latter manner it is viewed in adults already actually and in the second act converted. In the former manner, both in regenerate infants departing in the state of grace and in adults constituted in the first moment of conversion—where, with the habit of faith impressed, immediately a relative change of state and with it passive or intrinsic justification must be thought to be present: Not otherwise than dominion over creatures was present to the image of God in the first moment of creation, or rather flowed from it by natural resultance or necessary connection, and followed upon it. Or as a firstborn son of a king has and receives in his person such and such a principality, although in the first moment of birth he does not sense this nor actually rejoice in it.

      2. That active justification is distinguished from the decree of justification, as the execution of a decree from the decree, and the emanating action of God from the immanent. Just as the decree of creation must necessarily be distinguished from creation itself.

      3. That the same was accomplished fundamentally and κατ’ ἐπαγγελίαν [kat’ epangelian, according to promise] in the first institution, contracting, and promulgation of the new covenant, Gen. 3 [v. 15]; consummatively in the cross and resurrection of Christ, Rom. 8:32–33; 2 Cor. 5:18–19.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 447 ff. Latin at Confessionally Reformed Theology</span></figcaption>

</figure><figure class="quote" id="q-4e53e27cae" data-kw="">
<blockquote><p>In God it [‘mercy’] notes his readiness to do good to the miserable, notwithstanding sin. The motion comes from within, from his own breast and bowels. For our God is pitiful and of tender mercy, James 5:11, and the act of it is extended and reached out unto the creature in seasonable relief. For the throne of grace was erected for this purpose, Heb. 4:11. Two things there are in mercy: First, a propension and inclination to commiserate the afflicted. Secondly, a ready relief and succour of them according to our power, affectus and effectus. First, there is a compassion or a being affected with the misery of others. This properly cannot be in God, in whom as there is no passion, so strictly speaking there is no compassion; yet something analagous there is, a taking notice of our misery. Something like a pity arising in his heart upon the sight of it; which the Scripture frequently ascribes to God, and we can best understand as we consider the divine perfections shining forth in the human nature of Christ. Ex. 2:24, ‘He heard their groaning;’ and Isa. 63:4, ‘In all their afflictions He was afflicted.’ Judges 10:16, ‘His soul was grieved for the misery of Israel.’ Forms of speech taken from the manner of men, who use to be thus affected when they see a miserable object. God in his simple and perfect nature cannot be said either to joy or grieve: but He carries Himself as one thus affected. Or these expressions were laid in aforehand to suit with the divine perfections as manifested in Christ, who is touched with a feeling of our infirmities. Secondly, mercy notes the actual exhibition of help and relief to the miserable…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>One Hundred &amp; Ninety Sermons on the Hundred &amp; Nineteenth Psalm</cite>, … (London: T.P., 1681) | sermon 84, on Ps. 119:76, “Let, I pray thee, thy merciful kindness be for my comfort”, p. 512</span></figcaption>

</figure><figure class="quote" id="q-bb11e456c3" data-kw="">
<blockquote><p>The Lord God said, or, had said, to wit, upon the sixth day, on which the woman was made, Genesis i. 27-28. Not good; not convenient either for my purpose of the increase of mankind, or for man’s personal comfort, or for the propagation of his kind. Meet for him; a most emphatical phrase, signifying thus much, one correspondent to him, suitable both to his nature and necessity, one altogether like to him in shape and constitution, disposition and affection; a second self; or one to be at hand and near to him, to stand continually before him, familiarly to converse with him, to be always ready to succour, serve, and comfort him; or one whose eye, respect, and care, as well as desire, Genesis iii. 16, should be to him, whose business it shall be to please and help him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Holy Bible</cite>, (1685; 3 vols, London: Banner of Truth, 1962), 1: 7.</span></figcaption>

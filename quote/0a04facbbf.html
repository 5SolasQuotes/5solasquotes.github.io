<main class="wrap"><figure class="quote" id="q-0a04facbbf" data-kw="">
<blockquote><p>Dr. [Thomas] Jackson [d. 1640] in his Original of Unbelief [1625], pp. 334-35, very aptly to this purpose notes that some expressions may sometime be used, and observed well, which to use ordinarily (much more to institute) would be ridiculous or impious. As Jacob did unblameablely kiss his son Joseph’s coat, yet to have hanged it about his bed or table that it might receive such salutations evening and morning or at every meal time, might have countenanced many branches of superstition: once and use it not, may be discretion of those things whose continual use degenerates into abuse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship… (Amsterdam: Thorp, 1633), Manuduction, ch. 4, ‘Concerning the nature and definition of a ceremony’</cite>, pp. 26-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fa41c71b05" data-kw="">
<blockquote><p>The Argument of Scripture is true Religion, which is the Right Manner of coming to know and of worshipping/serving God unto the salvation of man as sinner and the glory of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernard De Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology</cite>, ch. 2, Holy Scripture</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Argument of Scripture is true Religion, which is the Right Manner of coming to know and of worshipping/serving God unto the salvation of man as sinner and the glory of God…”

— Bernard De Moor, Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology, ch. 2, Holy Scripture">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Argument+of+Scripture+is+true+Religion%2C+which+is+the+Right+Manner+of+coming+to+know+and+of+worshipping%2Fserving+God+unto+the+salvation+of+man+as+sinner+and+the+glory+of+God%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Bernard+De+Moor%2C+Continuous+Commentary+on+Johannes+Marckius%E2%80%99+Didactico-Elenctic+Compendium+of+Christian+Theology%2C+ch.+2%2C+Holy+Scripture&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffa41c71b05.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fa41c71b05.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-religion/#:~:text=The%20Argument%20of%20Scripture%20is%20true,sinner%20and%20the%20glory%20of%20God&amp;text=The%20Argument%20of%20Scripture%20is%20true%20Religion%2C%20which&amp;text=man%20as%20sinner%20and%20the%20glory%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3750c533ad" data-kw="">
<blockquote><p>The Papists say indeed that all additions corrupting the worship of God are forbidden, but such as further adorn and preserve it are not so, which implies a contradiction, for whereas every addition is principally a corruption because it is an addition, under which notion it is forbidden (and that in the worship of God which is forbidden, is a corruption of it), there can be no such preserving, adorning addition, unless we will allow a preserving and adorning corruption. Neither is it of more force which is pleaded by them that the additions which they make belong not unto the substance of the worship of God, but unto the circumstances of it, for every circumstance observed religiously, or to be observed in the worship of God, is of the substance of it, as were all those ceremonious observances of the [Mosaic] Law which had the same respect in the prohibitions of adding with the most weighty things whatsoever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God… (London: 1667), Question 14, ‘May not the Church find out and appoint to be observed such religious rites, as being adjoined unto the celebration of God’s instituted worship, may farther the devotion of the worshippers and render the worship itself in its performance more decent, beautiful and orderly…?’</cite>, pp. 64-65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Papists say indeed that all additions corrupting the worship of God are forbidden, but such as further adorn and preserve it are not so, which implies a contradiction, for whereas every addition is principally a corruption because it is an addition, under which notion it is forbidden (and that in the worship of God which is forbidden, is a corruption of it), there can be no such preserving, adorning addition, unless we will allow a preserving and adorning corruption. Neither is it of more force which is pleaded by them that the additions which they make belong not unto the substance of the worship of God, but unto the circumstances of it, for every circumstance observed religiously, or to be observed in the worship of God, is of the substance of it, as were all those ceremonious observances of the [Mosaic] Law which had the same respect in the prohibitions of adding with the most weighty things whatsoever.”

class="perma" href="../quote/3750c533ad.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-definition-of-worship/#:~:text=The%20Papists%20say%20indeed%20that%20all,with%20the%20most%20weighty%20things%20whatsoever&amp;text=The%20Papists%20say%20indeed%20that%20all%20additions%20corrupting&amp;text=of%20adding%20with%20the%20most%20weighty%20things%20whatsoever" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5791856475" data-kw="">
<blockquote><p>I beseech you therefore, brethren, by the mercies of God, that ye offer up your bodies a living sacrifice, holy, and acceptable unto God, which is your reasonable worshipping… He desires us to offer ourselves unto God. And this oblation he says shall have the nature of a sacrifice… A sacrifice is a voluntary action, wherein we worship God and offer unto Him somewhat, whereby we testify his chief dignity and dominion, and our servitude and submission towards Him. In this definition are expressed all the causes. The matter is the oblation: the form is the action, not a natural action, but that which is done with election, and inspired by the Holy Ghost: neither is it a political or economical action but a religious action: for that pertains to the worshipping of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most Learned &amp; Fruitful Commentaries… upon… Romans… trans. H.B. (London: Daye, 1568), | on Romans 12</cite>, pp. 410-11, 413</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-fe5f29ba12" data-kw="">
<blockquote><p>We complain that the whole doctrine of godliness is adulterated by impious dogmas; that the whole worship of God is vitiated by foul and disgraceful superstitions; that the pure institution of the sacraments has been supplanted by horrible sacrilege; that their use has been converted into a profane trafficking; that poor souls, which ought to have been ruled by the doctrine of Christ, are oppressed by cruel bondage; that nothing is seen in the Christian Church that is not deformed and debased; that the grace of Christ not only lies half-buried, but is partly torn to pieces, partly altogether extinguished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, p. 20</span></figcaption>

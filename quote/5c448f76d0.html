<main class="wrap"><figure class="quote" id="q-5c448f76d0" data-kw="">
<blockquote><p>[A]n untruth, namely, that we are justified only by the passion of Christ. But if this were so, we should be justified without fulfilling the law. For (as I have said) we owe to God a double debt: one by creation, namely, the fulfilling of the law in all things from our first beginning; the second, since the fall of Adam, namely, a satisfaction for the breach of the law. Now the passion of Christ is a payment of the second debt, but not of the first; whereas both must be answered. For ‘cursed is he that doth not continue in all things written in the law, to do them.” (See Gal. 3:10) The passion of Christ procures deliverance from hell, but alone by itself considered, it does not purchase a right to eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians in Works, 2:115 (HT: Inwoo Lee)</cite></span></figcaption>

<blockquote><p>f. It is both conditional and unconditional. … In a sense it may be said that God Himself fulfills the condition in the elect. That which may be regarded as a condition in the covenant, is for those who are chosen unto everlasting life also a promise, and therefore a gift of God. Finally, the covenant is not conditional in the sense that the reception of every separate blessing of the covenant is dependent on a condition. We may say that faith is the conditio sine qua non [condition without which: nothing] of justification, but the reception of faith itself in regeneration is not dependent on any condition, but only on the operation of the grace of God in Christ.</p></blockquote>

<blockquote><p>27. By the righteousness of Christ imputed to us we cannot be said absolutely or in every respect to be righteous, as if, on account of it, God regarded us as though we had performed all things required of us by his law. For then, after that righteousness of Christ had been admitted and accepted, God could demand no obedience to his law from us on our part. But by the righteousness of Christ imputed to us God esteems us righteous insofar as we have been transgressors of the divine law; so that we are said to be made righteous by that righteousness of Christ insofar as by our disobedience we had been constituted unrighteous. For Christ did not satisfy for all those things which we were bound to do by the law (for He would then have come into the world to dissolve the law), but only for those things which we had done against the law, or which, when we ought to have done them, we did not do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bradshaw.html">William Bradshaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertation on the Doctrine of Justification, in which a plain way is built up to the concord of them which vary on this thing (d. 1618; Leiden, 1684), ch. 24, ‘Of the Effects of Justification’, sect. 27</cite>, pp. 115-16 trans. ChatGPT-5</span></figcaption>

<blockquote><p>2. That which is exhibited whither by doing or suffering, or both in way of satisfaction and so accepted, being such as makes a plenary compensation for an offence formerly committed; because it utterly extinguishes and abolishes the wrong, so takes it away, as if it never had been; it justly procures a guiltlessness, a blamelessness unto the delinqent, in whose behalf it is performed; and makes him therefore to be reputed in the eye of law and justice, as now no delinqent, but as guiltless, faultless and just: there being no medium between these two just and unjust, nor between guiltless and just. See Dt. 25:1. This guiltlessness therefore is justly termed justice; and the party conseqently by plea thereof upon any emergent occasion may be truly justified, and such guiltlessness achieved by Christ’s satisfaction made to God’s Law and his justice, makes the party unto whom the same is imputed, and who has interest therein, truly named and justly deemed just, and to be in the state of justification, or in a justifiable condition, 2 Cor. 5:21; and this is that, not the satisfaction itself, but the guiltlessness thereby procured, that is so oft in his argument termed ‘justice’ or ‘righteousness’, called the ‘Justice of God’, Rom. 1:17, and 3:21-22, and 2 Cor. 5:21, not, as some, for that the satisfaction was made by Christ, who is God, but because contrived, prepared, propounded and appointed us by God, for God as the party wronged, and Christ as the party satisfying, for the wrong, are in this argument distinguished, Rom. 3:24-25 and 2 Cor. 5:19, 21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Antidote Against Error Concerning Justification… (d. 1654; London: Brome, 1670)</cite>, p. 34</span></figcaption>

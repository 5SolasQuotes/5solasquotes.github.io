<main class="wrap"><figure class="quote" id="q-07466e7fed" data-kw="">
<blockquote><p>Faith in Christ crucified is not commanded in the Law. For the apostle in Rom. 4:4–5 and 10:5–6, 11 sets faith in opposition to the Law; and in Gal. 3:12 he says that ‘The Law is not of faith,’ because the Law promises life to those who do the things contained in it. Therefore, faith is not comprehended under the Law. Nor indeed can there be any commerce between the Law and Christ as Mediator: “You are severed from Christ, you who are justified by the Law; you have fallen from grace” (Gal. 5:4). Faith in Christ crucified is a certain kind of righteousness: for it is obedience, and as it were a conformity to the command of God, as in 1 Jn. 3:23, “This is his commandment, that we should believe on the name of his Son,” and Jn. 3:36, “He who believes in the Son has eternal life; but he who does not obey the Son shall not see life, but the wrath of God abides on him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-wotton.html">Anthony Wotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Reconciliation of a Sinner… in which the Doctrine of the Anglican Church on the Justification of the Ungodly is explicated and defended (Basil, 1624), bk. 1, ch. 6</cite>, p. 138</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c52c042edb" data-kw="">
<blockquote><p>Some would suppose our union to Christ, and consequently, by virtue of that, our justification by Christ, to be before actual faith, even in adult persons, and consequently without it; they insist upon a priority in nature and time, and build positions upon that distinction that will not hold… They who hold justification before faith are afraid lest they should be betrayed into a justification by works, if they should hold otherwise; and therefore choose rather to plead for a justification before faith, and without faith, lest they should seem to be justified by anything in and from themselves; but how contrary is this to Scripture, ‘He that believeth not, is condemned’? (Jn. 3:18) But he that believes not, is justified, is nowhere written in my Bible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cole.html">Thomas Cole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Regeneration, Faith &amp; Repentance... (London: Cockerill, 1692), Discourse of Regeneration, ch. 4, ‘Manner of Regeneration’</cite>, p. 92</span></figcaption>

</figure><figure class="quote" id="q-08d6a514fe" data-kw="Faith alone">
<blockquote><p>Man is justified by faith without works; therefore by faith alone. The reason of the consequence is manifest because there are not more modes of justifying than these two—by faith and by works. Thus, one being removed, the other must not only necessarily be left, but also left alone. Otherwise the enumeration would not be legitimate. … Now why would the apostle so often and so expressly institute an antithesis between faith and works in this matter, if works could concur with faith in any way to the act of justification? Would he not in this particular have occasioned believers to err by removing works absolutely and simply from it, if they contribute anything towards it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 16.8.8</span></figcaption>

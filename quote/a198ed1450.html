<main class="wrap"><figure class="quote" id="q-a198ed1450" data-kw="">
<blockquote><p>The creation of the world is an external, temporal, and universal action of God, by which He alone made and perfected the whole universe, by the power of His omnipotent will, in the space of six days; for His own glory, and the utility of creatures, especially intelligent ones, and the eternal salvation of the elect in heaven. … The adjunct of time is that God created the world in the space of six natural days, Gen. 2:3, Ex. 20:11. For although God could have created it in a moment, yet He willed to use these intervals: that He might more openly declare that the creation of the world was not made from eternity, but in time; and that He might render men more attentive in the particular meditation of distinct works, as appears especially from Ps. 104 &amp; 136.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epitome of Theological Common Places (d. 1641; Amsterdam: Jansson, 1653), Locus 6, ‘On the Creation of the World’, trans. AI at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d9be3d7a32" data-kw="">
<blockquote><p>I. What is Creation, the second special work of God (as you affirmed) that we are to inform ourselves of out of the Scriptures? B. It is a most powerful work of God the Father, the Son, and the Holy Ghost, by which in the beginning, in the space of six days, by his Word only, out of nothing, He made the heavens and the earth, with all things in them visible and invisible; to the praise of his infinite power, wisdom and goodness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-broughton.html">John Broughton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God &amp; Man, or a Treatise Catechistical, wherein the saving knowledge of God and man is plainly and briefly declared… (London, 1623)</cite>, pp. 31-32</span></figcaption>

</figure><figure class="quote" id="q-53b2323259" data-kw="">
<blockquote><p>The philosophers, among whom was Aristotle, because being devoid of revelation, they could not reach to the first man, thought of an infinite subordination of men, and at the same time, of the eternity of the world. Democritus is reported to have stated that men crawled forth from the earth like maggots. Epicurus said that man was a composite of the fortuitous confluence of atoms, and in addition that they arose from the earth like fungi, and are daily animated by the certain position of the stars. Paracelsus [d. 1541], besides the human posterity of Adam, numbered four other non-Adamic races of men, and assigned them to each of the elements…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Do All Men Owe their Origin to the One Adam?’ in Theoretical-Practical Theology (RHB), vol. 3, ch. 9, section 13</cite></span></figcaption>

</figure><figure class="quote" id="q-462d67949a" data-kw="">
<blockquote><p>IX… VII. The [medieval] Scholastics rightly state indeed that God created the world. Some of them, however, following Avicenna, bk. 9, Metaphysics, ch. 4, who thought that in the creation of things there is a golden chain, and that the first intelligence created the second, the second produced the third, and so on down to the last, admitted that the power of creating could be communicated to a creature as a principal cause, such as Durandus, Gabriel Biel, also d’Ailly, de Raconis, Arriaga, Franciscus Bonae Spei. X. Others rightly deny indeed that the power of creating can be communicated to a creature as a principal cause; yet they affirm that the power of creating can be communicated to the same as a physical instrumental cause; which they assert in favor of the sacraments: such as Suarez, Metaphysical Disputations 20, sect. 5-7; Hurtado de Mendoza, Disputation 12, Physics, sect. 2, n. 62; into which opinion they allege Thomas himself, in pt.1 of 2, quest. 2, art. 3; With whom, from the Lutherans, Ebelius, Disp. 5, Metaph., Part. Spec. §4, art. 5, and Slevogt, Disp. Acad. 20, which is the third on Creation, are partly in favor. But more rightly do Scotus and the Scotists teach that a creature can create neither as a principal cause nor as an instrumental one. For: 1. Creation is an action of God alone, as Scripture testifies: Job 9:8, “Which alone spreads out the heavens.” Isa. 44:24, “I am the Lord that makes all things; that stretches forth the heavens alone; that spreads abroad the earth by myself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’ (Frankfurt: Steppinus, 1706), trans. AI Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

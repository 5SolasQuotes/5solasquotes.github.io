<main class="wrap"><figure class="quote" id="q-aa1144a6d8" data-kw="">
<blockquote><p>Another notable schism was that made by the ten tribes, 1 Kings 12, where two things are very remarkable: 1st, the rise of it, their dissatisfaction with the civil government whereupon they refused to own Rehoboam as their king, and also separated from the church of Jerusalem, who owned his authority, though he was very far degenerate from the piety and wisdom of David and Solomon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Evil, Nature &amp; Danger of Schism: a Sermon’</cite>, (1708)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-fe2728c0b7" data-kw="">
<blockquote><p>After the Restoration of the English monarchy in the person of Charles II in 1660, the new king and his first Parliament declared the anniversary of the beheading of his father Charles I (January 30, 1649) a religious holiday with a special commemoration in the Book of Common Prayer, naming the late monarch a saint and martyr. This holiday was not generally celebrated in Massachusetts until the emergence of several Anglican churches there in the early eighteenth century. In 1750, Jonathan Mayhew, the twenty-nine-year old pastor of the West (Congregational) Church in Boston, took occasion to dispute the first Charles’ credentials to saintship, martyrdom, and even his kingship as well. Mayhew’s Discourse is an extremely interesting bridge between the radical Puritan past and the American Revolutionary future. His sermon contains the language, rhetoric, symbolism, typology, and religious and philosophical arguments that would be used extensively in the agitation for American independence twenty-five years later. Mayhew (1720-1766) would subsequently take a leading role in the resistance to the Stamp Act of 1765, and his sermons and writings had an enormous impact on the evolution of New England Puritanism into American republican ideology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-mayhew.html">Jonathan Mayhew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse Concerning Unlimited Submission &amp; Non-Resistance to the Higher Powers: With some Reflections on the Resistance made to King Charles I</cite>, (1750) 55 pp. Mayhew was liberal both in his religion and politics. This famous sermon was credited by John Adams with being greatly influential in leading to the commencement of the War of American Independence. | The University of Nebraska abstract:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-57e53dffa1" data-kw="">
<blockquote><p>…for though the people of God deserved devastation and captivity by the heathen in regard of their sins before the throne of divine justice, yet the heathen grievously sinned in conquering them, Zech. 1:15, ‘And I am very sore displeased with the heathen that are at ease; for I was but a little displeased, and they helped forward the affliction.’ So though Judah deserved to be made captives and a conquered people because of their idolatry and other sins, as Jeremiah had prophecied, yet God was highly displeased at Babylon for their unjust and bloody conquest, Jer. 1:17-18, 33-34; 51:35, ‘The violence done to me and to my flesh be upon Babylon, shall the inhabitants of Zion say; and my blood upon the inhabitants of Chaldea, shall Jerusalem say.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 48</span></figcaption>

</figure><figure class="quote" id="q-e363b7ec35" data-kw="">
<blockquote><p>XXVII. Self-interest, self-government and family-government are all antecedent to public government, which rules them for the common good, but has no authority to destroy them: No king or prelate can bind a man to do that which would damn his soul, nor to omit that which is needful to his salvation: All power is for edification: They are God’s ministers for God. XXVIII. As it belongs to self-government to choose our own diet, and clothes, and wives, and physicians, (though we may be restrained from doing public hurt on such pretences); And it belong to family government to educate our own children, and choose their tutors, callings, wives, etc. so it more nearly belongs to self-government to choose the most safe and profitable means of our own salvation, which no man may forbid us; and to avoid that which is pernicious or hurtful; and to family-government to do the like for our children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684), ch. 4, p. 26</span></figcaption>

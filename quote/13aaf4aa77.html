<blockquote><p>Ethical philosophers and theologians generally use it [the term “nature”] to refer to what reflects the flourishing or proper development of creatures of our nature… … Women and the inclination to nurture For the fact that most women are more nurturing than most men is much more than an accident. It arises from a genuine difference in the underlying reality, the difference between womanhood and manhood as such. This difference is so powerful that men and women are influenced by it even when they defy it. For example, we say women are more nurturing. Yet some young women conceal their pregnancies, give birth in secret, then do away with the babies. Nothing more opposed to nurturance could be imagined. But wait: Consider the ways in which these young women do away with their babies. How often they place them in trash cans and dumpsters, still alive! Why don’t they just kill them? That is what a man usually does if he wants to do away with a child. Perhaps a young woman imagines her baby resting in the dumpster, quietly and painlessly slipping into a death that is something like sleep. Or perhaps she imagines a fairy tale ending in which some other woman finds her baby in the dumpster and brings him up as her own. No, the act is not nurturing, but even so, the inclination to nurture hasn’t precisely been destroyed; under the influence of other strong motives, it has been perverted. I dare say that such data are not captured by our psychological instruments. It is not enough to count things with a survey. One must see with the eyes of the heart. … What are men and women for? In one respect they are for the same thing: Being rational, they are for the knowledge of the truth, especially the truth about God. But there is a difference. A man is a rational being of that sex whose members are potentially fathers, and a woman is a rational being of that sex whose members are potentiality mothers. Potentiality for fatherhood and motherhood is at the bottom of manhood and womanhood The idea of potentiality needs explanation, because potentiality is not the same thing as physical possibility. Consider a man who is infertile because of some disease. Although it is not physically possible for him to be a father, we should not say that he lacks the potentiality for fatherhood; as a man, he has the potentiality, but the disease has blocked its realization. It is just because he is a man, just because he is endowed with the potentiality for fatherhood, that the block to its physical realization is such an occasion for sorrow. … We can carry this line of reasoning still further. A potentiality is something like a calling. It wants, so to speak, to develop; it demands, so to speak, a response. It is like an arrow, notched in the string and aimed at the target, even if it never takes flight. It intimates an inbuilt meaning and expresses an inbuilt purpose, which cannot help but influence the mind and will of every person imbued with them. Alice von Hildebrand has remarked that although not every woman is called to marry and bear physical children, ‘every woman, whether married or unmarried, is called upon to be a biological, psychological or spiritual mother.’ … Obviously I cannot speak from inside experience of womanhood, because I am a man. Yet even a man can see that it is a very different thing to be a woman than to be a man. A man may deeply love his child, but he does not have a womb with which to carry the child in his body for nine months, or milk with which to nourish the child from his breasts. These experiences connect the mother with her child in an intimate, physical bond which we men can easily recognize, but which we cannot experience. In subtle ways they condition her emotional responses not only toward the child, but also toward herself and even toward everyone else. They also make sense of certain other differences between men and women, differences for which each sex is sometimes wrongly criticized. For example, are women in general more protective of their bodies than men, and men less careful about their bodily safety than women? Of course they are. Women, who carry children, need to be more protective of their bodies. Men, to protect them, need to be less careful about their safety. It isn’t that men, by being men, are more virtuous, or that women, by being women, are more virtuous. However, their most typical temptations are somewhat different than those of the other sex, and although they can have all the same virtues, their virtues have different inflections. A man’s and a woman’s courage are not the same, but they are both courage. The other sexual differences make sense in this light too. As Edith Stein reminds us, men are more prone to abstraction, and women more prone to focus on the concrete. Men don’t mind what is impersonal, but women are more attuned to the nuances of relationships. A man tends to be a specialist and single-tasker; he develops certain qualities to an unusually high pitch, using them to do things in the world. A woman tends to be a generalist and multitasker; she inclines to a more rounded development of her abilities, using them to nurture the life around her. The woman’s potentiality for motherhood ties all her qualities together and makes sense of her contrast with men. Consider just that multitasking capacity. In view of what it takes to run a home, doesn’t it make sense for her to have it? A woman must be a center of peace for her family, even though a hundred things are happening at once. But a man is designed more for the protection of the hearth and the people who surround it than for their nurture. In speaking of the hearth it may sound as though I am saying that women should never leave the kitchen. No. Although men gravitate to careers and women to motherhood, not all women will pursue an exclusively domestic life. Even so, the potentiality for motherhood explains why women who do pursue a career, and who have free choice of career, tend to choose careers that allow them to give first place to caring for their children. It also explains why they tend to choose careers that give greater scope to maternal qualities. In fact, even when a well-balanced woman chooses a traditionally masculine career, she also tends to perform it in ways that give scope to maternal qualities. A male lawyer tends to focus on the properties of the task itself. This is worthy, but it is all too easy for him to lose sight of the humanity of his clients. Can he learn to remember their humanity? Of course he can, but he is more likely to need the reminder in the first place. A female lawyer may find the abstract quality of the law somewhat alienating, even though it is necessary. On the other hand, she is much less likely to forget that she is dealing with human beings… Manhood in general is outward-directed, and womanhood inward-directed. This is no cliché; the distinction is quite subtle. Outward-directedness, for example, is not the same as other-directedness, for many men prefer dealing with things. Inward-directedness is not same as self-directedness, for the genius of women includes caring for the local circle… In speaking of outward- and inward-directedness… It is a good thing that an unmarried man pursues the beloved, whereas an unmarried woman makes herself attractive to pursuit; it is a good thing that a husband protects the home, whereas a wife establishes it on the hearth; it is a good thing that a father represents the family and oversees it, whereas a mother conducts the family and manages it. Although the directive geniuses of the father and the mother are not the same, both of them truly rule the home. We may compare the father with a king reigning over a commonwealth, the mother with a queen. These potent archetypes express different inflections of glory, nobility, and self-command. Men joke about their wives telling them what to do. The joke would have no point unless two things were true: On one hand, they would not want their wives to be kings; on the other hand, they know they are really queens… In one of the letters of St. Paul to Timothy, we find him using a curious pair of words — a verb, proistemi [1 Tim. 3:4-5], for what a husband characteristically does, and a noun, oikodespotes [1 Tim. 5:14], for what a wife characteristically is. Both words indicate authority, but with a difference. The term used for the husband has a range of meanings that include standing before, presiding, superintending, protecting, maintaining, helping, succoring, and acting in the capacity of a patron — very much like a chairman of the board. But the term used for the woman means “ruler of the house” – literally, “despot of the house” — very much like the chief executive officer… When all goes well, fathers and mothers also exemplify and specialize in different aspects of wisdom. A wise father teaches his wife and family that in order to love you must be strong; a wise mother teaches her husband and family that in order to be strong you must love. She knows that even boldness needs humility; he knows that even humility needs to be bold. He is an animate symbol to his children of that justice which is tempered by mercy, she a living emblem of that mercy which is tempered by justice. A wise father knows when to say, “ask your mother,” a wise mother when to say, “ask your father.” When they do this, they are not passing the buck, but sharing sovereignty. Each of them refracts a different hue from the glowing light of royalty… May it be needless to say that mothers and fathers must also recover the conviction of their need for each other. They must do this not only for their own sakes, but for their young. Every child needs both kinds of love. It is not enough to provide an intermediate love that is half motherly and half fatherly, or an inconsistent love that is motherly at some times, fatherly at others. Nor is it enough to give one kind of love for real, while giving only a pretense or simulacrum of the other kind. Even though the two loves resemble each other, they are distinct, and neither can be imitated by anything else. Yes, it may be true heroism when through no fault of one’s own, a father or a mother raises a child all alone; yet it is better not to be alone. No woman can fully take the place of a father, any more than any man can substitute for a mother… A woman may resist temptation, but a man thinks of making war against it. A woman may seek to reside in the citadel of virtue, but a man thinks of capturing it… Once upon a time the differences between men and women were not thought so strange. We have a long quest and a difficult journey before we can speak of them again with ease and gaiety. There are so many sweet and lovely things that our ears can no longer hear without odium, so many blameless things that can hardly be discussed without scandal… And if I were to compound the offense by pointing out that every last one of us, both man and woman, is feminine with respect to God…</p></blockquote>

ence.+A+man+is+a+rational+being+of+that+sex+whose+members+are+potentially+fathers%2C+and+a+woman+is+a+rational+being+of+that+sex+whose+members+are+potentiality+mothers.+Potentiality+for+fatherhood+and+motherhood+is+at+the+bottom+of+manhood+and+womanhood+The+idea+of+potentiality+needs+explanation%2C+because+potentiality+is+not+the+same+thing+as+physical+possibility.+Consider+a+man+who+is+infertile+because+of+some+disease.+Although+it+is+not+physically+possible+for+him+to+be+a+father%2C+we+should+not+say+that+he+lacks+the+potentiality+for+fatherhood%3B+as+a+man%2C+he+has+the+potentiality%2C+but+the+disease+has+blocked+its+realization.+It+is+just+because+he+is+a+man%2C+just+because+he+is+endowed+with+the+potentiality+for+fatherhood%2C+that+the+block+to+its+physical+realization+is+such+an+occasion+for+sorrow.+%E2%80%A6+We+can+carry+this+line+of+reasoning+still+further.+A+potentiality+is+something+like+a+calling.+It+wants%2C+so+to+speak%2C+to+develop%3B+it+demands%2C+so+to+speak%2C+a+response.+It+is+like+an+arrow%2C+notched+in+the+string+and+aimed+at+the+target%2C+even+if+it+never+takes+flight.+It+intimates+an+inbuilt+meaning+and+expresses+an+inbuilt+purpose%2C+which+cannot+help+but+influence+the+mind+and+will+of+every+person+imbued+with+them.+Alice+von+Hildebrand+has+remarked+that+although+not+every+woman+is+called+to+marry+and+bear+physical+children%2C+%E2%80%98every+woman%2C+whether+married+or+unmarried%2C+is+called+upon+to+be+a+biological%2C+psychological+or+spiritual+mother.%E2%80%99+%E2%80%A6+Obviously+I+cannot+speak+from+inside+experience+of+womanhood%2C+because+I+am+a+man.+Yet+even+a+man+can+see+that+it+is+a+very+different+thing+to+be+a+woman+than+to+be+a+man.+A+man+may+deeply+love+his+child%2C+but+he+does+not+have+a+womb+with+which+to+carry+the+child+in+his+body+for+nine+months%2C+or+milk+with+which+to+nourish+the+child+from+his+breasts.+These+experiences+connect+the+mother+with+her+child+in+an+intimate%2C+physical+bond+which+we+men+can+easily+recognize%2C+but+which+we+cannot+experience.+In+subtle+ways+they+condition+her+emotional+responses+not+only+toward+the+child%2C+but+also+toward+herself+and+even+toward+everyone+else.+They+also+make+sense+of+certain+other+differences+between+men+and+women%2C+differences+for+which+each+sex+is+sometimes+wrongly+criticized.+For+example%2C+are+women+in+general+more+protective+of+their+bodies+than+men%2C+and+men+less+careful+about+their+bodily+safety+than+women%3F+Of+course+they+are.+Women%2C+who+carry+children%2C+need+to+be+more+protective+of+their+bodies.+Men%2C+to+protect+them%2C+need+to+be+less+careful+about+their+safety.+It+isn%E2%80%99t+that+men%2C+by+being+men%2C+are+more+virtuous%2C+or+that+women%2C+by+being+women%2C+are+more+virtuous.+However%2C+their+most+typical+temptations+are+somewhat+different+than+those+of+the+other+sex%2C+and+although+they+can+have+all+the+same+virtues%2C+their+virtues+have+different+inflections.+A+man%E2%80%99s+and+a+woman%E2%80%99s+courage+are+not+the+same%2C+but+they+are+both+courage.+The+other+sexual+differences+make+sense+in+this+light+too.+As+Edith+Stein+reminds+us%2C+men+are+more+prone+to+abstraction%2C+and+women+more+prone+to+focus+on+the+concrete.+Men+don%E2%80%99t+mind+what+is+impersonal%2C+but+women+are+more+attuned+to+the+nuances+of+relationships.+A+man+tends+to+be+a+specialist+and+single-tasker%3B+he+develops+certain+qualities+to+an+unusually+high+pitch%2C+using+them+to+do+things+in+the+world.+A+woman+tends+to+be+a+generalist+and+multitasker%3B+she+inclines+to+a+more+rounded+development+of+her+abilities%2C+using+them+to+nurture+the+life+around+her.+The+woman%E2%80%99s+potentiality+for+motherhood+ties+all+her+qualities+together+and+makes+sense+of+her+contrast+with+men.+Consider+just+that+multitasking+capacity.+In+view+of+what+it+takes+to+run+a+home%2C+doesn%E2%80%99t+it+make+sense+for+her+to+have+it%3F+A+woman+must+be+a+center+of+peace+for+her+family%2C+even+though+a+hundred+things+are+happening+at+once.+But+a+man+is+designed+more+for+the+protection+of+the+hearth+and+the+people+who+surround+it+than+for+their+nurture.+In+speaking+of+the+hearth+it+may+sound+as+though+I+am+saying+that+women+should+never+leave+the+kitchen.+No.+Although+men+gravitate+to+careers+and+women+to+motherhood%2C+not+all+women+will+pursue+an+exclusively+domestic+life.+Even+so%2C+the+potentiality+for+motherhood+explains+why+women+who+do+pursue+a+career%2C+and+who+have+free+choice+of+career%2C+tend+to+choose+careers+that+allow+them+to+give+first+place+to+caring+for+their+children.+It+also+explains+why+they+tend+to+choose+careers+that+give+greater+scope+to+maternal+qualities.+In+fact%2C+even+when+a+well-balanced+woman+chooses+a+traditionally+masculine+career%2C+she+also+tends+to+perform+it+in+ways+that+give+scope+to+maternal+qualities.+A+male+lawyer+tends+to+focus+on+the+properties+of+the+task+itself.+This+is+worthy%2C+but+it+is+all+too+easy+for+him+to+lose+sight+of+the+humanity+of+his+clients.+Can+he+learn+to+remember+their+humanity%3F+Of+course+he+can%2C+but+he+is+more+likely+to+need+the+reminder+in+the+first+place.+A+female+lawyer+may+find+the+abstract+quality+of+the+law+somewhat+alienating%2C+even+though+it+is+necessary.+On+the+other+hand%2C+she+is+much+less+likely+to+forget+that+she+is+dealing+with+human+beings%E2%80%A6+Manhood+in+general+is+outward-directed%2C+and+womanhood+inward-directed.+This+is+no+clich%C3%A9%3B+the+distinction+is+quite+subtle.+Outward-directedness%2C+for+example%2C+is+not+the+same+as+other-directedness%2C+for+many+men+prefer+dealing+with+things.+Inward-directedness+is+not+same+as+self-directedness%2C+for+the+genius+of+women+includes+caring+for+the+local+circle%E2%80%A6+In+speaking+of+outward-+and+inward-directedness%E2%80%A6+It+is+a+good+thing+that+an+unmarried+man+pursues+the+beloved%2C+whereas+an+unmarried+woman+makes+herself+attractive+to+pursuit%3B+it+is+a+good+thing+that+a+husband+protects+the+home%2C+whereas+a+wife+establishes+it+on+the+hearth%3B+it+is+a+good+thing+that+a+father+represents+the+family+and+oversees+it%2C+whereas+a+mother+conducts+the+family+and+manages+it.+Although+the+directive+geniuses+of+the+father+and+the+mother+are+not+the+same%2C+both+of+them+truly+rule+the+home.+We+may+compare+the+father+with+a+king+reigning+over+a+commonwealth%2C+the+mother+with+a+queen.+These+potent+archetypes+express+different+inflections+of+glory%2C+nobility%2C+and+self-command.+Men+joke+about+their+wives+telling+them+what+to+do.+The+joke+would+have+no+point+unless+two+things+were+true%3A+On+one+hand%2C+they+would+not+want+their+wives+to+be+kings%3B+on+the+other+hand%2C+they+know+they+are+really+queens%E2%80%A6+In+one+of+the+letters+of+St.+Paul+to+Timothy%2C+we+find+him+using+a+curious+pair+of+words+%E2%80%94+a+verb%2C+proistemi+%5B1+Tim.+3%3A4-5%5D%2C+for+what+a+husband+characteristically+does%2C+and+a+noun%2C+oikodespotes+%5B1+Tim.+5%3A14%5D%2C+for+what+a+wife+characteristically+is.+Both+words+indicate+authority%2C+but+with+a+difference.+The+term+used+for+the+husband+has+a+range+of+meanings+that+include+standing+before%2C+presiding%2C+superintending%2C+protecting%2C+maintaining%2C+helping%2C+succoring%2C+and+acting+in+the+capacity+of+a+patron+%E2%80%94+very+much+like+a+chairman+of+the+board.+But+the+term+used+for+the+woman+means+%E2%80%9Cruler+of+the+house%E2%80%9D+%E2%80%93+literally%2C+%E2%80%9Cdespot+of+the+house%E2%80%9D+%E2%80%94+very+much+like+the+chief+executive+officer%E2%80%A6+When+all+goes+well%2C+fathers+and+mothers+also+exemplify+and+specialize+in+different+aspects+of+wisdom.+A+wise+father+teaches+his+wife+and+family+that+in+order+to+love+you+must+be+strong%3B+a+wise+mother+teaches+her+husband+and+family+that+in+order+to+be+strong+you+must+love.+She+knows+that+even+boldness+needs+humility%3B+he+knows+that+even+humility+needs+to+be+bold.+He+is+an+animate+symbol+to+his+children+of+that+justice+which+is+tempered+by+mercy%2C+she+a+living+emblem+of+that+mercy+which+is+tempered+by+justice.+A+wise+father+knows+when+to+say%2C+%E2%80%9Cask+your+mother%2C%E2%80%9D+a+wise+mother+when+to+say%2C+%E2%80%9Cask+your+father.%E2%80%9D+When+they+do+this%2C+they+are+not+passing+the+buck%2C+but+sharing+sovereignty.+Each+of+them+refracts+a+different+hue+from+the+glowing+light+of+royalty%E2%80%A6+May+it+be+needless+to+say+that+mothers+and+fathers+must+also+recover+the+conviction+of+their+need+for+each+other.+They+must+do+this+not+only+for+their+own+sakes%2C+but+for+their+young.+Every+child+needs+both+kinds+of+love.+It+is+not+enough+to+provide+an+intermediate+love+that+is+half+motherly+and+half+fatherly%2C+or+an+inconsistent+love+that+is+motherly+at+some+times%2C+fatherly+at+others.+Nor+is+it+enough+to+give+one+kind+of+love+for+real%2C+while+giving+only+a+pretense+or+simulacrum+of+the+other+kind.+Even+though+the+two+loves+resemble+each+other%2C+they+are+distinct%2C+and+neither+can+be+imitated+by+anything+else.+Yes%2C+it+may+be+true+heroism+when+through+no+fault+of+one%E2%80%99s+own%2C+a+father+or+a+mother+raises+a+child+all+alone%3B+yet+it+is+better+not+to+be+alone.+No+woman+can+fully+take+the+place+of+a+father%2C+any+more+than+any+man+can+substitute+for+a+mother%E2%80%A6+A+woman+may+resist+temptation%2C+but+a+man+thinks+of+making+war+against+it.+A+woman+may+seek+to+reside+in+the+citadel+of+virtue%2C+but+a+man+thinks+of+capturing+it%E2%80%A6+Once+upon+a+time+the+differences+between+men+and+women+were+not+thought+so+strange.+We+have+a+long+quest+and+a+difficult+journey+before+we+can+speak+of+them+again+with+ease+and+gaiety.+There+are+so+many+sweet+and+lovely+things+that+our+ears+can+no+longer+hear+without+odium%2C+so+many+blameless+things+that+can+hardly+be+discussed+without+scandal%E2%80%A6+And+if+I+were+to+compound+the+offense+by+pointing+out+that+every+last+one+of+us%2C+both+man+and+woman%2C+is+feminine+with+respect+to+God%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+J.+Budziszewski%2C+%E2%80%98What+makes+Men+Men%3F%E2%80%99+%282019%29+Budziszewski+is+a+Thomist.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F13aaf4aa77.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/13aaf4aa77.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/ladies/#:~:text=Ethical%20philosophers%20and%20theologians%20generally%20use,is%20feminine%20with%20respect%20to%20God%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

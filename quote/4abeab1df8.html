<main class="wrap"><figure class="quote" id="q-4abeab1df8" data-kw="liberty decree free">
<blockquote><p>The eternity of God’s decrees does not take away his liberty in decreeing. Although no moment can be assigned in which God was actually indifferent to decreeing this or that thing, still it is certain that the nature of God was in itself indifferent to decreeing this or that thing. For there was no necessary connection between God and creatures as exists between the Father and the Son (whom he could not but beget). On the other hand, he might (if he had willed) have abstained from any production of things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.2.13</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a923204566" data-kw="Permission Author of sin The Fall">
<blockquote><p>God acted nothing, but only ceased to act, and therefore could not be the efficient cause of man’s sin. As God is not the author of good but by willing and effecting it, so he is not the author of evil but by willing and effecting it. But he doth not positively will evil, nor effect it by any efficacy of his own. Permission is no action, nor the cause of that action which is permitted, but the will of that person who is permitted to do such an action is the cause.</p></blockquote>

</figure><figure class="quote" id="q-f36de3147a" data-kw="Author of sin Satan">
<blockquote><p>Yet we deny that He is the author of sin, or that the blame of things done amiss can be laid upon Him, seeing His will is the sovereign and infallible rule of all righteousness and equity: but this we confess that He has those admirable means as whereby He makes the devils and the ungodly, as His instruments to serve Him and to turn the evil which they do and whereof they are guilty into good.</p></blockquote>

</figure><figure class="quote" id="q-0e430d2cf9" data-kw="conditional thing not decree">
<blockquote><p>It is one thing for the thing decreed to be conditional; another for the decree itself. The former we grant, but not the latter. There can be granted an antecedent cause or condition of the thing willed, but not immediately of the volition itself. Thus God wills salvation to have the annexed condition of faith and repentance in the execution, but faith and repentance are not the condition or cause of the act of willing in God, nor of the decree to save in the intention.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.3.9</span></figcaption>

</figure><figure class="quote" id="q-360e80a51b" data-kw="Author of sin The Fall Permission">
<blockquote><p>To make God the author of sin is such foul blasphemy, that it can never enter any Christian man’s mind without a shudder. It is indeed true that God had made man mutably good, had infallibly foreseen his sin, had foreordained the permission of the sin and given man no doubt sufficient strength to shun sin, but inoperable without His influx; that meanwhile He had inflowed into man’s faculties for natural actions by not inflowing into the moral entity of such actions. … But it is not less true, that God neither is nor could in any way become the author of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants</cite>, 1.8.28 (as quoted in Heinrich Heppe, Reformed Dogmatics)</span></figcaption>

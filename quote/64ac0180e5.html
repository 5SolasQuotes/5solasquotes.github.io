<main class="wrap"><figure class="quote" id="q-64ac0180e5" data-kw="">
<blockquote><p>[I]t is a principal function of kings and of governors to search and explore what function of life has been designed by God for each citizen, and to take care that each one is initiated, prepared, and helped toward this end from childhood, so certainly the same persons ought to exercise utmost interest and a primary concern among their subjects, and, wherever possible, to seek and find those whom the Lord seems to have appointed to this supremely salutary work, necessary before all others, of preaching the gospel. So Paul glories that he had been “separated for this work from his mother’s womb” (Gal. 1:15). They should take care that such of these as they can discover be initiated and trained from childhood for this most holy office, and that those who have been duly tested and proved be used in their good time for this function. This is certainly necessary before all things else, to be realized with utmost zeal by all kings and princes of the people of God who pray from their hearts, “Thy Kingdom come” (Matt. 6:10).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Christi</cite>, (1550) in Wilhelm Pauck (ed.), The library of Christian classics: Melanchthon and Bucer (Philadelphia, 1969), p. 227.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-8c060526c1" data-kw="">
<blockquote><p>It is lawful for all sorts of people to marry, who are able with judgment to give their consent. Yet it is the duty of Christians to marry only in the Lord. And therefore such as profess the true reformed religion should not marry with infidels, papists, or other idolaters: neither should such as are godly be unequally yoked, by marrying with such as are notoriously wicked in their life, or maintain damnable heresies. (Westminster Confession 24.3)

The minutes of the Westminster Assembly give us an interesting glimpse into how this section of the Confession was eventually formulated:

Report was made from the committee of that committed about marriage. …

The Assembly debated the Report of that committed about marriage, and upon debate it was

Resolved upon the Q: The former proposition about consent of parents be waved.

Resolved upon the Q: that mention be made concerning papists and other Idolators.

Resolved upon the Q: that some others besides papists and other Idolators be mentioned.

Resolved upon the Q: such as profess the true Reformed Religion ought not to marry with papists, Infid[e]ls and other Idolators.

Resolved upon the Q: nor ought such as are godly to be unequally yoaked with such as are notoriously wicked in their life.

Resolved upon the Q: ther[e] shall be a further addition.

Resolved upon the Q: These words shall be added, ‘or maintain damnable Heresies’.</p></blockquote>

asquotes.github.io%2Fquote%2F8c060526c1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8c060526c1.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/08/08/the-minutes-of-the-westminster-assembly-and-marriage/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>They are not only such as shall be happy, but they are very useful and beneficial in the world, they are those for whose sake the world was made, they are the great common blessings of the world, like fire and water, they are those for whose sake God spares the world.

</figure><figure class="quote" id="q-b22076a49e" data-kw="">
<blockquote><p>Some have tried to argue that when the Old Testament law refers to people being “cut off” from the people of Israel, it is referring to capital punishment. This error usually arises due to confusion concerning civil punishment and excommunication in the Old Testament, with people thinking that the two were conflated. George Gillespie helpfully corrects this error when commenting on 1 Corinthians 5 and points out that it originates in the teachings of the tolerationist, Roger Williams:

Wherefore I conclude that the cutting off in the law, and especially in the ceremonial law, can be nothing else but excommunication from the Church, and communion in the holy things. Which as it is most received among our expositors, so the apostle (1 Cor. 5), does give us a hint of it. For it is plain from verses 6-8 that he alludes to the history of the Passover (Exod. 12), so when he says (verse 13), Put away from among yourselves that wicked person, he has respect to Ex. 12:19, where it is said, Whosoever eats that which is leavened, even that soul shall be cut off from the congregation of Israel. All this I conclude with a passage of Mr. Williams’ Bloody Tenet, cap. 121, where he does not acknowledge a spiritual excommunication in the Jewish Church, yet he acknowledges such a coercive power in cutting off, as has for the anti-type and parallel of it excommunication in the Christian Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Late Dialogue between a Civilian and a Divine</cite>, (London, 1644) in The Anonymous Writings of George Gillespie, ed. Chris Coldwell (Dallas TX: Naphtali Press, 2008), pp 127-28.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

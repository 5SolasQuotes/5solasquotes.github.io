<main class="wrap"><figure class="quote" id="q-20014c7035" data-kw="">
<blockquote><p>But you [a congregationalist] will say, in a church in an island, one may be a pastor without any ordination if the people elect him and there be no elders to ordain. I answer: it is true: but so many pastors send a pastor to be a pastor to a congregation, though that congregation never choose him, as possibly they be for the most part Popish or unwilling; yet both cases are extraordinary and the Church [is in the case of] not [being] constituted and established.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644) | pt. 1, p. 493</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-df48ea1b24" data-kw="">
<blockquote><p>But they differ, in that the pastor labors in the word of exhortation, that is, by the gift of wisdom applies the word to the manners of his flock, and that in season and out of season, as he knows their particular cases to require. The doctor labors in the word of doctrine, that is, without such applications as the pastor uses; by simple teaching he preserves the truth and sound interpretation of the Scriptures, against all heresy and error. The ruling elder doth neither of these, but labors in the government and policy of the church only. The Apostle has distinguished these three sorts of elders, 1 Tim. 5.17, “Let elders that rule well be counted worthy of double honor, especially they who labor in the word and doctrine.” Where, as [Theodore] Beza notes, he distinguished the word, which is the pastor’s part, from doctrine, which is the doctor’s part. Even as Rom. 12:7,8, he distinguishes teaching from exhortation; and 1 Cor. 12:8, puts “the word of wisdom,” and “the word of knowledge,” for two different things. Now, besides those elders which labor in the word, and those which labor in doctrine, Paul speaks to Timothy of a third sort of elders, which labor neither in the word nor doctrine, but in ruling well. Hence it appears how truly the Book of Policy, ch. 2, says, That there are four ordinary, perpetual, and necessary offices in the church, the office of the pastor, the doctor, the elder, and the deacon; and that no other office, which is not one of these four, ought to be received, or suffered in the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, ch. 2:</span></figcaption>

<blockquote><p>4. In this expression of ‘the Covenant,’ the spiritual good things promised therein are limited to Abraham and to his seed. But all infants whatsoever are not comprehended under the seed of Abraham. To say many thousands are excluded from the seals and outward administration of the Covenant, when yet everyone is partaker of the good promised in the Covenant, is to speak of ourselves, and not according to the Word of God. We will not tie the grace of God to outward means: but ordinarily we cannot affirm they pertain to the Covenant of Grace, and obtain the highest blessings promised therein, whom God does not vouchsafe so much as outwardly to receive into Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645), ch. 6, ‘Of the Covenant of Grace as it was made and manifested to Abraham’, p. 92</span></figcaption>

<main class="wrap"><figure class="quote" id="q-b3583c5570" data-kw="">
<blockquote><p>Observation not only consists in resting — as if that were the whole or part of its observance. It also does not consist in serving God in a more spiritual manner than on other days. Neither does it consist in a narrow-minded “touch not and taste not,” nor in asking, “May I do this or may I do that?” The sabbath is not a snare, but rather a day of delight — not, however, for sinful flesh. Those who are spiritually minded will almost always know what either favours or impedes the spirituality of the sabbath and the hallowing of this day. Sabbath observance consists, first of all, in focusing upon the commandment and example of God which are held before us to be followed. This must be accompanied by obedient subjection and a love to imitate this.

Secondly, it consists in spending this day in holy resting and being completely withdrawn from the world, in being elated and joyful in God, and in holy jubilation.

Thirdly, it consists in occupying one‘s self in beholding the works of God in creation, preservation, and government. It furthermore consists in meditating upon the great work of redemption through Christ, in all this acknowledging and rejoicing in God’s goodness, wisdom, power, truth, omnipotence (and of all that is revealed of God of this in our hearts), and thus glorifying and praising God. It is to be occupied with that sweet work of angels!

Fourthly, it consists in attending the public gatherings of God’s people, as well as in rejoicing in the fact that one may be among them and with them, appear together before God’s countenance, sing His praises, worship Him, hear the voice of the Lord come to our ears and hearts, and receive the benediction.

Fifthly, it consists in visiting the sick and the destitute, to bestow something of which they are deprived, to read something out of God’s Word, and furthermore if they are unconverted, to convince them of sin and judgment and make them acquainted with the Lord Jesus. It also consists in comforting the converted and in stirring them up to be patient.

Sixthly, it consists in exercising the communion of saints; that is, in having sweet fellowship with godly acquaintances in private gatherings where they occupy themselves with the reading of God’s Word, the singing of psalms and spiritual songs, and in mutual conversations, exhorting and comforting each other.

Seventhly, it consists in contributing, with a joyful and compassionate heart, something of one’s profit — earned in the previous workdays (or else something of one’s belongings) — to the poor, the common fund of the deacons, individuals with whom one is acquainted, and others whom the Lord causes us to encounter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 3: 145-46.</span></figcaption>

<blockquote><p>Answer: This [argument of Rutherford’s Independent opponent] speaks against glebes [contracted lands] of ministers, but the New Testament speaks not of manses or houses, or of moneys for ministers; yet a wage we know is due, Matt 10:10; 1 Cor. 9:8-10; Gal. 6:6, and the Levites were not to be distracted from the most necessary work of the Tabernacle and service of God more than ministers, yet they had lands and towns assigned of God to them; though the less distractous the wages be, the better and the more convenient they are, 2 Tim. 2:3-5. As for the tithes, we think quotta decimarum, or a sufficient maintenance of tithes or what else may conduce for food and raiment, of divine right, Matt 10:16; 1 Cor. 9:8-9, tithes formally as tithes are not necessary, so [as long as] the ministers be provided and a stipend be allowed to them, not as an alms but as a debt, Luke 10:7. But the stinting [frugal restricting] of maintenance for ministers the author [Rutherford’s opponent] condemns, because when Constantine gave large rents to the Church, it proved the bane of the Church. But I answer, stinting makes not this, but excess, for mountains of rents may be stinted no less than mole-hills.</p></blockquote>

<blockquote><p>For the persons and duties of men may be accepted with God, when they walk and act in sincerity according to their light, though in many things, and those of no small importance, sundry irregularities are found, both in what they do, and in the manner of doing it. Where persons walk before God in their integrity, and practice nothing contrary to their light and conviction in his worship, God is merciful unto them, although they order not everything according to the rule and measure of the Word. So was it with them who came to the Passover in the days of Hezekiah: they had not cleansed themselves, but did eat the Passover otherwise than it was written, 2 Chron. 30:18; for whom the good king made the solemn prayer suited to their occasion: ‘The good Lord pardon every one that prepareth his heart to seek the Lord God of his fathers, though he be not cleansed according to the purification of the sanctuary; and the Lord hearkened unto Hezekiah and healed the people,’ vv. 18-20. Here was a duty for the substance of it appointed of God, but in the manner of its performance there was a failure: they did it not according to what was written, which is the sole rule of all religious duties. This God was displeased withal, yet graciously passed by the offence, and accepted them whose hearts were upright in what they did.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Work of the Holy Spirit in Prayer with a Brief Inquiry into the Nature and Use of Mental Prayer and Forms</cite>, (London: 1682), ch. 11, pp. 232-33</span></figcaption>

<blockquote><p>This chapter responds to J. Delobel’s critique of the thesis developed in ch. 10. His objections and positive observations prompted the clarification and simplification of a number of important points. He showed convincingly that v. 10 can only be translated ‘a woman must exercise control over her head’, i.e. must dress her hair properly. Given the subjectivity of the interpretations of ‘because of the angels’ based on the assumption that they are heavenly beings, it is suggested that Paul has in mind human ‘messengers’ from other churches. The Postscript devotes particular attention to the pros and cons of the proposed meanings of kephale, ‘head,’ ‘ruler,’ ‘source,’ and ‘person’ in various contexts in this passage, while also dealing in detail with the archaeological and literary evidence for sartorial customs in Corinth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-murphy-o-connor.html">Jerome Murphy-O’Connor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘1 Corinthians 11:2-16 Once Again’ Pre Abstract in The Catholic Biblical Quarterly</cite>, vol. 50, no. 2 (April, 1988), pp. 265-74</span></figcaption>

<div class="actions"><button class="copy" data-copy="“This chapter responds to J. Delobel’s critique of the thesis developed in ch. 10. His objections and positive observations prompted the clarification and simplification of a number of important points. He showed convincingly that v. 10 can only be translated ‘a woman must exercise control over her head’, i.e. must dress her hair properly. Given the subjectivity of the interpretations of ‘because of the angels’ based on the assumption that they are heavenly beings, it is suggested that Paul has in mind human ‘messengers’ from other churches. The Postscript devotes particular attention to the pros and cons of the proposed meanings of kephale, ‘head,’ ‘ruler,’ ‘source,’ and ‘person’ in various contexts in this passage, while also dealing in detail with the archaeological and literary evidence for sartorial customs in Corinth.”

<blockquote><p>We have no such custom, of women’s praying or prophesying with their heads uncovered, or men’s praying or prophesying with their heads covered; or we have no such custom of contending for these little frivolous things; neither any of the churches of God; and good Christians, in their practices, ought, in things of this nature, to have an eye and regard to the custom of their own church, and also of other Christian churches. Thus the apostle closes this discourse, and proceeds in the next verses to tax other abuses which were crept into this famous church.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-6428ca8b93" data-kw="">
<blockquote><p>As for all other sins which we call actual, they are, as I said, natural only, and not supernatural; and therefore no man wants [lacks] liberty, as to do them, so to abstain from them; Only he wants a moral and spiritual liberty to abstain from them in a gracious manner, according to that of Aquinas (Summa, pt. 1, q. 23, art. 7, to the 3rd): Licet aliquis non possit gratiam adipisci qui reprobatur a Deo, tamen quod in hoc peccatum vel illud labatur, ex ejus libero arbitrio contingit. Though a man who is reprobated of God cannot obtain grace, yet that he falls into this or that sin, it comes to pass of his own free will. It is true also even in God’s providence concerning acts natural, there is a great mystery. For as God foretold David that his neighbor should lie with his wives (2 Sam. 12:11-12); and though he sinned secretly, yet the Lord would do this openly. So he foretold that upon that altar which Jeroboam erected, a child that should be born of the house of David, Josiah by name, should burn the prophets’ bones. And that Cyrus also should build him a city and let go his captives. (1 Kn. 13:2; Isa. 45:13; Ezra 1; 2 Kn. 23:16; 2 Sam. 16:22) Yet who doubts but that Cyrus did freely deliver the Jews out of Babylon? and Josiah did as freely burn the prophets’ bones upon the altar in Bethel, as ever they did [any] action in their lives? So Absalom did as freely defile his father’s concubines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath</cite>, … (d. 1646; Oxford, 1653), bk. 2, An Examination of Certain Passages inserted into Mr. Hord’s Discourse, Answer to the Additions, sect. 7, p. 101</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a541fa9b54" data-kw="">
<blockquote><p>It is true that people, through corruption of nature, are averse to submit to governors ‘for conscience sake, as unto the Lord,’ because the natural man, remaining in the state of nature, can do nothing that is truly good, but it is false that men have no active moral power to submit to superiors, but only a passive capacity to be governed. He [John Maxwell] quite contradicts himself; for he said before (ch. 4, p. 49) that there is an ‘innate fear and reverence in the hearts of all men naturally, even in heathens, toward their sovereign;’ yea, as we have a natural moral active power to love our parents and superiors (though it be not evangelically, or legally in God’s court, good) and so to obey their commandments, only we are averse to penal laws of superiors. But this proves no way that we have only by nature a passive capacity to government; for heathens have, by instinct of nature, both made laws morally good, submitted to them, and set kings and judges over them, which clearly proves that men have an active power of government by nature. Yea, what difference makes the Prelate betwixt men and beasts? for beasts have a capacity to be governed, even lions and tigers; but here is the matter, if men have any natural power of government, the Popish Prelate would have it, with his brethren the Jesuits and Arminians, to be not natural, but done by the help of universal grace; for so do they confound nature and grace. But it is certain our power to submit to rulers and kings, as to rectors, and guides, and fathers, is natural;</p></blockquote>

</figure><figure class="quote" id="q-4d9204281e" data-kw="">

</figure><figure class="quote" id="q-a4c588ba16" data-kw="">
<blockquote><p>Maresius… insists, the Reformed believe that the power of free choice is intrinsic to humanity… It is true that unlike irrational creatures, human beings are not naturally determined to just one course of action. They are free, in other words, from ‘physical necessity’. As a result, when human beings choose to do something under the influence of grace, they nonetheless retain a faculty within them which, were that grace withdrawn, would enable them to pursue another course of action. So if one considers free choice simply as a faculty, in isolation from all the natural and supernatural prerequisites for acting (the ‘divided sense’ [according to the created order]), it does indeed have both the inherent potential to accept or reject a given course of action (‘freedom of contradiction’)… … So for Maresius, free choice is incompatible with both physical necessity and the necessity of coercion: but it is compatible with other kinds of necessity. It is compatible, for example, with the necessity of dependence on God (Maresius 1646-48, 2:12). It is also compatible with ‘moral necessity’. That is the necessity which results from a human being’s moral character. Jesus’s moral character is such that He cannot sin; yet his goodness is still freely chosen. The moral character of the unregenerate is such that their acts are always sinful; yet their sin is still freely chosen (Maresisu 1646-48, 2:14). Free choice is equally compatible with the necessity brought about by the divine decree. Maresius calls this kind of necessity ‘hypothetical necessity’ or the ‘necessity of consequence’ (Maresius 1646-48, 2:15)… Maresius is seeking to preserve the fundamental contingency of human action… that choice is only necessary, given the divine decree–it is not inherently or absolutely necessary… for as Maresius underlines, ‘such is the faculty of the human will that, by its intrinsic constitution and nature, it is equally apt to choose an act plainly contrary to the one it actually chooses’ (Maresius 1646-48, 2:15).</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Maresius… insists, the Reformed believe that the power of free choice is intrinsic to humanity… It is true that unlike irrational creatures, human beings are not naturally determined to just one course of action. They are free, in other words, from ‘physical necessity’. As a result, when human beings choose to do something under the influence of grace, they nonetheless retain a faculty within them which, were that grace withdrawn, would enable them to pursue another course of action. So if one considers free choice simply as a faculty, in isolation from all the natural and supernatural prerequisites for acting (the ‘divided sense’ [according to the created order]), it does indeed have both the inherent potential to accept or reject a given course of action (‘freedom of contradiction’)… … So for Maresius, free choice is incompatible with both physical necessity and the necessity of coercion: but it is compatible with other kinds of necessity. It is compatible, for example, with the necessity of dependence on God (Maresius 1646-48, 2:12). It is also compatible with ‘moral necessity’. That is the necessity which results from a human being’s moral character. Jesus’s moral character is such that He cannot sin; yet his goodness is still freely chosen. The moral character of the unregenerate is such that their acts are always sinful; yet their sin is still freely chosen (Maresisu 1646-48, 2:14). Free choice is equally compatible with the necessity brought about by the divine decree. Maresius calls this kind of necessity ‘hypothetical necessity’ or the ‘necessity of consequence’ (Maresius 1646-48, 2:15)… Maresius is seeking to preserve the fundamental contingency of human action… that choice is only necessary, given the divine decree–it is not inherently or absolutely necessary… for as Maresius underlines, ‘such is the faculty of the human will that, by its intrinsic constitution and nature, it is equally apt to choose an act plainly contrary to the one it actually chooses’ (Maresius 1646-48, 2:15).”

— Stephen Hampton, 1. ‘Free Choice’ in ‘Sin, Grace &amp; Free Choice in Post-Reformation Reformed Theology’ in Lehner, Muller &amp; Roeber, The Oxford Handbook of Early Modern Theology, 1600-1800 (Oxford, 2016), pp. 229-31">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMaresius%E2%80%A6+insists%2C+the+Reformed+believe+that+the+power+of+free+choice+is+intrinsic+to+humanity%E2%80%A6+It+is+true+that+unlike+irrational+creatures%2C+human+beings+are+not+naturally+determined+to+just+one+course+of+action.+They+are+free%2C+in+other+words%2C+from+%E2%80%98physical+necessity%E2%80%99.+As+a+result%2C+when+human+beings+choose+to+do+something+under+the+influence+of+grace%2C+they+nonetheless+retain+a+faculty+within+them+which%2C+were+that+grace+withdrawn%2C+would+enable+them+to+pursue+another+course+of+action.+So+if+one+considers+free+choice+simply+as+a+faculty%2C+in+isolation+from+all+the+natural+and+supernatural+prerequisites+for+acting+%28the+%E2%80%98divided+sense%E2%80%99+%5Baccording+to+the+created+order%5D%29%2C+it+does+indeed+have+both+the+inherent+potential+to+accept+or+reject+a+given+course+of+action+%28%E2%80%98freedom+of+contradiction%E2%80%99%29%E2%80%A6+%E2%80%A6+So+for+Maresius%2C+free+choice+is+incompatible+with+both+physical+necessity+and+the+necessity+of+coercion%3A+but+it+is+compatible+with+other+kinds+of+necessity.+It+is+compatible%2C+for+example%2C+with+the+necessity+of+dependence+on+God+%28Maresius+1646-48%2C+2%3A12%29.+It+is+also+compatible+with+%E2%80%98moral+necessity%E2%80%99.+That+is+the+necessity+which+results+from+a+human+being%E2%80%99s+moral+character.+Jesus%E2%80%99s+moral+character+is+such+that+He+cannot+sin%3B+yet+his+goodness+is+still+freely+chosen.+The+moral+character+of+the+unregenerate+is+such+that+their+acts+are+always+sinful%3B+yet+their+sin+is+still+freely+chosen+%28Maresisu+1646-48%2C+2%3A14%29.+Free+choice+is+equally+compatible+with+the+necessity+brought+about+by+the+divine+decree.+Maresius+calls+this+kind+of+necessity+%E2%80%98hypothetical+necessity%E2%80%99+or+the+%E2%80%98necessity+of+consequence%E2%80%99+%28Maresius+1646-48%2C+2%3A15%29%E2%80%A6+Maresius+is+seeking+to+preserve+the+fundamental+contingency+of+human+action%E2%80%A6+that+choice+is+only+necessary%2C+given+the+divine+decree%E2%80%93it+is+not+inherently+or+absolutely+necessary%E2%80%A6+for+as+Maresius+underlines%2C+%E2%80%98such+is+the+faculty+of+the+human+will+that%2C+by+its+intrinsic+constitution+and+nature%2C+it+is+equally+apt+to+choose+an+act+plainly+contrary+to+the+one+it+actually+chooses%E2%80%99+%28Maresius+1646-48%2C+2%3A15%29.%E2%80%9D%0A%0A%E2%80%94+Stephen+Hampton%2C+1.+%E2%80%98Free+Choice%E2%80%99+in+%E2%80%98Sin%2C+Grace+%26+Free+Choice+in+Post-Reformation+Reformed+Theology%E2%80%99+in+Lehner%2C+Muller+%26+Roeber%2C+The+Oxford+Handbook+of+Early+Modern+Theology%2C+1600-1800+%28Oxford%2C+2016%29%2C+pp.+229-31&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa4c588ba16.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a4c588ba16.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-reformed-freedom-of-the-will-vs-philosophical-necessity/#:~:text=insists%2C%20the%20Reformed%20believe%20that%20the,it%20actually%20chooses%E2%80%99%20%28Maresius%201646%2D48%2C%202%3A15&amp;text=insists%2C%20the%20Reformed%20believe%20that%20the%20power%20of&amp;text=the%20one%20it%20actually%20chooses%E2%80%99%20%28Maresius%201646%2D48%2C%202%3A15" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

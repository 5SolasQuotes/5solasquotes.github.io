<main class="wrap"><figure class="quote" id="q-111a30126c" data-kw="">
<blockquote><p>These things being granted, the only way of life and salvation by Jesus Christ, under the old testament and the new, is secured; which is the substance of the truth wherein we are now concerned. On these grounds we may proceed with our inquiry. The judgment of most reformed divines is, that the church under the old testament had the same promise of Christ, the same interest in him by faith, remission of sins, reconciliation with God, justification and salvation by the same way and means, that believers have under the new. And whereas the essence and the substance of the covenant consists in these things, they are not to be said to be under another covenant, but only a different administration of it. But this was so different from that which is established in the gospel after the coming of Christ, that it hath the appearance and name of another covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 86</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f47dc6baee" data-kw="">
<blockquote><p>With respect hereunto it is that the Lord Christ is said to be the “mediator of a better covenant;” that is, of another distinct from it, and more excellent.</p></blockquote>

</figure><figure class="quote" id="q-b0039051eb" data-kw="old new">
<blockquote><p>However, we readily grant that the Old Testament and the Mosaic covenant taken strictly and absolutely as to the legal relation (schesin) differ in entire substance from the New. Hence the law and Moses are opposed to grace and to Christ (Jn. 1:17) and by Paul the letter and the Spirit, the ministration of condemnation and of righteousness (2 Cor. 3:6, 7). So we maintain that taken broadly and with the other evangelical relation (schesei) (clothed, namely, with its pedagogical circumstances), it did not differ as to substance, but only as to manner of dispensation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.8.8</span></figcaption>

</figure><figure class="quote" id="q-4ce0cb580a" data-kw="new cov">
<blockquote><p>The new covenant is also taken in a twofold manner either broadly, inasmuch as it stands for the covenant of grace in general made with sinners, which existed under the Old Testament as well before Christ appeared as under the New after he had been manifested; or strictly, for the covenant of grace promulgated after the manifestation of Christ in the flesh, which should continue to the end of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.8.5</span></figcaption>

</figure><figure class="quote" id="q-ed7e8b1e1e" data-kw="">
<blockquote><p>On this consideration it is said, that the two covenants mentioned, the new and the old, were not indeed two distinct covenants, as unto their essence and substance, but only different administrations of the same covenant, called two covenants from some different outward solemnities and duties of worship attending of them.  […] But on the other hand, there is such express mention made, not only in this, but in sundry other places of the Scripture also, of two distinct covenants, or testaments, and such different natures, properties, and effects, ascribed unto them, as seem to constitute two distinct covenants.</p></blockquote>

<blockquote><p>30. To what is appeal made to support the nonliteral interpretation? a) To the fact that sun and moon (or rather the rotation of the earth around its axis in relation to the sun) were not yet present. As we know, the length of an ordinary day is determined by this rotation. b) To the indefinite use of the term “day” in other places in Scripture (Gen 2:4; 5:1; 2 Sam 21:12; Isa 11:16), also to the expression “day of the Lord” (= day of judgment) in the prophets, and to Psa 90:4; 2 Pet 3:8. c) To the analogy with other things of God. Here we have to do with God’s days. Now the “things of God” are certainly archetypical (exemplars) for the things of men, but they are not completely identical. Thus we have no right, it is thought, to judge that God‘s days are like the days of men. d) To the fact that the duration of God‘s Sabbath is eternal. That is one of the days here, the seventh day. If the seventh day is not limited to 24 hours, then the six previous days need not be limited to that time span. On these grounds many, including those who are not intent on a reconciliation of the Scripture with science, accept an extraordinary length for the creation days. This includes many church fathers and theologians of the Middle Ages, and, among more recent theologians, even Charles Hodge inclines to this view.

31. What supports the interpretation that takes “day” in its ordinary meaning? a) The entire creation aimed at man as its completion. It is difficult to accept that preparing for this goal took thousands of years. b) All the creation days must have been of the same length. Who can accept, however, that a day on which nothing else occurred than the separation between light and darkness was a day of thousands of years? c) The fact that the sun and moon, as measures of time, were not present, does not mean that there was no time. Already from the beginning God ordained a rhythm and created the light so that it would alternate with the darkness. When later this light was concentrated in the sun and the other bodies, we are told nothing about it being only then that the 24-hour day began. There was no change at that point. Therefore we have a reason for assuming that before that time the rotation of the earth took place at the same speed and that light was so positioned as was necessary for an alternation of day and night within 24 hours. d) From v. 14 on the days are unquestionably ordinary days of 24 hours. There God says emphatically of the lights in the expanse that they will be “for days and years.” One might rescue the nonliteral view by assuming for the fourth to the sixth days an extremely slow rotation of the earth about its axis, but what about plant life during those long nights? The night has to have been half of the full day. e) It is not accurate to say that the days are God‘s days. God ad intra does not have days. Creation is an act proceeding outwardly from God. Appealing to the eternal Sabbath is also of no avail. Although God’s Sabbath is certainly endless, that cannot be said of the first Sabbath (after the six-day creation) for mankind. f) The use of the term “day” in Gen 9:4 is figurative, but in Gen 1 figurative language is not used. What one must show is another place in Scripture where a first, a second, a third day, etc., are just as sharply separated and nevertheless describe periods of time. The “day of the Lord” in the prophets refers to a specific day, that is, a day on which the Lord appears for judgment, even though His judgment may last longer than one day.

32. Must someone who holds that the days are long time periods be regarded a heretic? No, in this sense the question is not an essential one. It would only become so if it provided the occasion for granting priority in principle over the Word of God to the so-called results of science.</p></blockquote>

<blockquote><p>As to the second part of my reflections, wherein I doubt concerning the earth’s moving about its axis, it may be I differ from you [John Woodward, a professor of physics, to whom the work is dedicated], and from the generality of Virtuosos [New Philosophers] at this day. But truly I am not so much a [Brahe] Tychonian as to forswear the Copernican Hypothesis: But the truth of the matter is this, when I was treating of the most substantial points of divinity, that is, when I was asserting and vindicating the being and providence of God, I was unwilling to found these or anything belonging to them upon an infirm and unstable basis, upon a dubious and disputable doctrine, and which had not long prevailed in the learned world. Such I take the opinion of the circumgyration of the earth to be: and therefore till I could be absolutely satisfied about the reality of it, I thought it was safest to aquiesce at present in the other doctrine, and the rather because it is suitable to the mundane system which Moses presents us with, whose literal sense of the account of it is not to be slighted by Christian philosophers.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“As to the second part of my reflections, wherein I doubt concerning the earth’s moving about its axis, it may be I differ from you [John Woodward, a professor of physics, to whom the work is dedicated], and from the generality of Virtuosos [New Philosophers] at this day. But truly I am not so much a [Brahe] Tychonian as to forswear the Copernican Hypothesis: But the truth of the matter is this, when I was treating of the most substantial points of divinity, that is, when I was asserting and vindicating the being and providence of God, I was unwilling to found these or anything belonging to them upon an infirm and unstable basis, upon a dubious and disputable doctrine, and which had not long prevailed in the learned world. Such I take the opinion of the circumgyration of the earth to be: and therefore till I could be absolutely satisfied about the reality of it, I thought it was safest to aquiesce at present in the other doctrine, and the rather because it is suitable to the mundane system which Moses presents us with, whose literal sense of the account of it is not to be slighted by Christian philosophers.”

— John Edwards, Brief Remarks upon Mr. [William] Whiston’s New Theory of the Earth &amp; upon an other Gentleman’s Objections Against Some Passages in a Discourse of the Existence &amp; Providence of God, Relating to the Copernican Hypothesis (London, 1697)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+to+the+second+part+of+my+reflections%2C+wherein+I+doubt+concerning+the+earth%E2%80%99s+moving+about+its+axis%2C+it+may+be+I+differ+from+you+%5BJohn+Woodward%2C+a+professor+of+physics%2C+to+whom+the+work+is+dedicated%5D%2C+and+from+the+generality+of+Virtuosos+%5BNew+Philosophers%5D+at+this+day.+But+truly+I+am+not+so+much+a+%5BBrahe%5D+Tychonian+as+to+forswear+the+Copernican+Hypothesis%3A+But+the+truth+of+the+matter+is+this%2C+when+I+was+treating+of+the+most+substantial+points+of+divinity%2C+that+is%2C+when+I+was+asserting+and+vindicating+the+being+and+providence+of+God%2C+I+was+unwilling+to+found+these+or+anything+belonging+to+them+upon+an+infirm+and+unstable+basis%2C+upon+a+dubious+and+disputable+doctrine%2C+and+which+had+not+long+prevailed+in+the+learned+world.+Such+I+take+the+opinion+of+the+circumgyration+of+the+earth+to+be%3A+and+therefore+till+I+could+be+absolutely+satisfied+about+the+reality+of+it%2C+I+thought+it+was+safest+to+aquiesce+at+present+in+the+other+doctrine%2C+and+the+rather+because+it+is+suitable+to+the+mundane+system+which+Moses+presents+us+with%2C+whose+literal+sense+of+the+account+of+it+is+not+to+be+slighted+by+Christian+philosophers.%E2%80%9D%0A%0A%E2%80%94+John+Edwards%2C+Brief+Remarks+upon+Mr.+%5BWilliam%5D+Whiston%E2%80%99s+New+Theory+of+the+Earth+%26+upon+an+other+Gentleman%E2%80%99s+Objections+Against+Some+Passages+in+a+Discourse+of+the+Existence+%26+Providence+of+God%2C+Relating+to+the+Copernican+Hypothesis+%28London%2C+1697%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4f8dce999b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4f8dce999b.html">Pe

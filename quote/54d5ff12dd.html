<blockquote><p>The first man who, as far as I know, invented and proposed it [the ubiquity of Christ’s human nature] to the Christian world was Jacobus Faber Stapulensis [d. 1536]…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7677c611c5" data-kw="">
<blockquote><p>Even now, however, the proper apple of discord was only the doctrine of the Supper. The party of Flacius was of one mind on the question of predestination with those who subsequently were denominated the ‘Reformed’; and the Flacians employed predestination as a weapon to fight against the Melanchthonians, who long maintained themselves in the electorate of Saxony [which was dominated by the strict Lutherans]. Nor till a later time, during the strife about Crypto-Calvinism, did this electorate succeed in detaching itself from the moderate party in the empire. In a word, about the time of the origin of the Formula of Concord between 1570-1580, there were only two different parties; the one consisting of people who would let themselves be reasoned with on the doctrine of the Supper; and the other of such as would hear no reason on the subject. Those who were weary of the vexatious strifes, as Hesse, Anhalt and other States of the empire, joined the party led by the inhabitants of the [reformed] Palatinate, and, finally, did not accept the Formula of Concord [1570/1580]. The others shut themselves off, and formed a body that took for its shibboleth the unaltered Confession of Augsburg. It was after the Formula of Concord that the evangelicals [in Germany] clearly separated into two churches; that is, one part went its own ways and abandoned the other, which then, by rejecting the Formula of Concord but retaining the Confession of Augsburg, was gradually consolidated in the empire into churches which for the first time testified by a great historical act at Dort that they belonged to the Reformed Church, that meanwhile had arisen outside of Germany.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edouard-bohl.html">Edouard Bohl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Separation of the Lutheran Church from the Reformed in the Sixteenth Century” in Presbyterian &amp; Reformed Review</cite>, vol. 5, no. 19 (July, 1894), pp. 415-33, p. 423</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-f9804783ca" data-kw="">
<blockquote><p>My design is to indicate how slowly the process ran out its course, by which a Lutheran and a Reformed Church arose in Germany in the sixteenth century… These [Lutheran and Reformed] reformations are then [popularly] thought of as like two circles, which merely touch each other; or, according to others, which really intersect, and have large segments in common, but which yetnever cover exactly the same space, or were drawn from one center… It is easy to refute this false opinion…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edouard-bohl.html">Edouard Bohl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Separation of the Lutheran Church from the Reformed in the Sixteenth Century” in Presbyterian &amp; Reformed Review</cite>, vol. 5, no. 19 (July, 1894), pp. 415-33, p. 415</span></figcaption>

<blockquote><p>§6. There is another sort of unity much regarded among the ancients, which though the breach of it had as bad influence on all, or most Churches, and so on the catholic Church: yet it properly respected neighbor Churches, either which were united by the bond of one government, a provincial, or lesser synod, being made up of them: or only living in the vicinity of one another, or having frequent occasion of correspondence; they who were not under any uniting bonds, but these commune to all the parts of the catholic Church, yet had an unity of kind correspondence, mutual assistance, as occasion offered, acquainting one another with their affairs so far as it was of any advantage: admitting the members of other Churches to communion with them on occasion, refusing communion with such members of other Churches as were by them excommunicated: and this unity was then broken when these acts of friendship were shunned or refused, especially when they who were cast out by one were received to another: or when occasional communion was either shuned by them who so joined in another Church or denied to such sojourners if they desired it: or when one Church showed rage, fury and bitterness against another because of what they differed about.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, (Edinburgh: Anderson, 1697), sect. 10, ‘Of Schism’ Rule was a Scottish, divine-right presbyterian minister., pp. 251-52</span></figcaption>

<blockquote><p>[Eckhardi says:] This we accept of infants, who are so in the covenant due to the faith of the parents, that they are justified by the faith of the parents. …I respond 1. not all infants of pious parents are received in the Covenant of God: so it was said of Ishmael which was the son of Abraham; and of Esau which was the son of Isaac. 2. Of the impious, or such as the Turks and other heathens, and their infants passing away in infancy, they all are certainly condemned, as is evident from 1 Cor. 7:14, indeed they are such as are unclean. If, however, it is understood that the impious are in the Covenant as far as the external society, I say even that God may not only look to this, but to the grandfather and the grandfather’s grandfather, so that it may be indeed such children frequently are in the Covenant with God, and the Covenant has been taken hold of for them by previous parents. …but where they are already adolescents, they having their own faith, then this faith [of others] is the more not necessary for them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Johannes Maccovius Revived, or Manuscripts of his</cite>, … ed. Nicolaas Arnoldi (Amsterdam, 1659) | ‘Anti-Eckhardus’ [Heinrich Eckhardi 1580-1624] | 17. On Justification 671 | III. ‘Whether anyone is able to be justified by the faith of another, being destitute of their own?’ 672</span></figcaption>

<div class="actions"><button class="copy" data-copy="“[Eckhardi says:] This we accept of infants, who are so in the covenant due to the faith of the parents, that they are justified by the faith of the parents. …I respond 1. not all infants of pious parents are received in the Covenant of God: so it was said of Ishmael which was the son of Abraham; and of Esau which was the son of Isaac. 2. Of the impious, or such as the Turks and other heathens, and their infants passing away in infancy, they all are certainly condemned, as is evident from 1 Cor. 7:14, indeed they are such as are unclean. If, however, it is understood that the impious are in the Covenant as far as the external society, I say even that God may not only look to this, but to the grandfather and the grandfather’s grandfather, so that it may be indeed such children frequently are in the Covenant with God, and the Covenant has been taken hold of for them by previous parents. …but where they are already adolescents, they having their own faith, then this faith [of others] is the more not necessary for them.”

— Johannes Maccovius, Johannes Maccovius Revived, or Manuscripts of his… ed. Nicolaas Arnoldi (Amsterdam, 1659) | ‘Anti-Eckhardus’ [Heinrich Eckhardi 1580-1624] | 17. On Justification 671 | III. ‘Whether anyone is able to be justified by the faith of another, being destitute of their own?’ 672">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BEckhardi+says%3A%5D+This+we+accept+of+infants%2C+who+are+so+in+the+covenant+due+to+the+faith+of+the+parents%2C+that+they+are+justified+by+the+faith+of+the+parents.+%E2%80%A6I+respond+1.+not+all+infants+of+pious+parents+are+received+in+the+Covenant+of+God%3A+so+it+was+said+of+Ishmael+which+was+the+son+of+Abraham%3B+and+of+Esau+which+was+the+son+of+Isaac.+2.+Of+the+impious%2C+or+such+as+the+Turks+and+other+heathens%2C+and+their+infants+passing+away+in+infancy%2C+they+all+are+certainly+condemned%2C+as+is+evident+from+1+Cor.+7%3A14%2C+indeed+they+are+such+as+are+unclean.+If%2C+however%2C+it+is+understood+that+the+impious+are+in+the+Covenant+as+far+as+the+external+society%2C+I+say+even+that+God+may+not+only+look+to+this%2C+but+to+the+grandfather+and+the+grandfather%E2%80%99s+grandfather%2C+so+that+it+may+be+indeed+such+children+frequently+are+in+the+Covenant+with+God%2C+and+the+Covenant+has+been+taken+hold+of+for+them+by+previous+parents.+%E2%80%A6but+where+they+are+already+adolescents%2C+they+having+their+own+faith%2C+then+this+faith+%5Bof+others%5D+is+the+more+not+necessary+for+them.%E2%80%9D%0A%0A%E2%80%94+Johannes+Maccovius%2C+Johannes+Maccovius+Revived%2C+or+Manuscripts+of+his%E2%80%A6+ed.+Nicolaas+Arnoldi+%28Amsterdam%2C+1659%29+%7C+%E2%80%98Anti-Eckhardus%E2%80%99+%5BHeinrich+Eckhardi+1580-1624%5D+%7C+17.+On+Justification+671+%7C+III.+%E2%80%98Whether+anyone+is+able+to+be+justified+by+the+faith+of+another%2C+being+destitute+of+their+own%3F%E2%80%99+672&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe6ee3afac0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perm

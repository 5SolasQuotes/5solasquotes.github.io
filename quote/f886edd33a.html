<main class="wrap"><figure class="quote" id="q-f886edd33a" data-kw="">
<blockquote><p>Whether doth not the Covenant of grace require works, as well as doth the Covenant of works? I answer, It doth; as is evident Titus 2.11.14. The grace of God that bringeth salvation, teacheth us to be zealous of good works; and Mat. 5.16. Let men see your good works, saith Christ; though Christ preached not a Covenant of works, but of grace, yet he calls for good works. But mark the difference.

1. The Covenant of works doth not require works for the same end, as the Covenant of grace, for that requires works as the matter of our justification before God; so saith Moses, (understanding him in a Legal way) Deut. 6. last, This is your righteousness; but the Covenant of grace requires works not as a part of our righteousness, but that thereby we should glorify God, and manifest it that we are made righteous by Christ, James 2. we are thereby declared to be righteous; the godly conversation of a Christian maketh it evident to the consciences of men, that he is a justified man.

2. The works that are required in the Covenant of grace, are not required from the same beginning; the Covenant of works requires works to be performed from our own strength and ability received in the Creation, it presupposeth ability in our selves to do what it requireth. But the Covenant of grace requireth works to be done by the help of the Spirit of Jesus Christ. Phil. 4.13. I can do all things, saith the Apostle, through Christ strengthening mee, that is, the power which the Covenant of grace directs us unto.

3. The Covenant of grace doth not require works in the same order as the Covenant of works doth, for the Covenant of works requires works first, and then faith to believe our selves beloved unto life; but the Covenant of grace requireth faith first, and then that we bring forth good works; therefore saith the Apostle (Titus 3.8.) Let them which have believed, be careful to shew forth good works: He doth not say, Let them which have done good works, believe; but first believe and then doe good works, he placeth faith before works; and hence it is that the obedience of the Gospel, is called the obedience of faith, Rom. 16.26. as following faith and springing from it. Thus then this difference of the condition of the Covenants remaineth; the one Covenant commanding works, the other faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-bulkeley.html">Peter Bulkeley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The gospel-covenant; or The covenant of grace opened</cite>, (London: Benjamin Allen, 1646), p. 55.</span></figcaption>

<blockquote><p>Reply; How often have we shewed that this Text proves not that any Children, quatenus as such, should be baptized, nor, as such, that they are in the Covenant of Grace, or have the Promise made to them; the Promise runs to the Jews and to their Offspring, and not to them only, but to Gentiles also, who were said to be afar off: But pray observe, &#x27;tis to no more of the Jews and their Children or Offspring, and such who were afar off, than the Lord shall call or make Disciples by the Word and effectual Operations of the Holy Spirit. My Sons and Daughters are as much my Children when they are twenty or thirty Years old, as well as when Babes. Dr. Hammond also grants, Children in this Text doth not refer to Insants as such, but to the Posterity of the Jews, p. 490. Sect. 81. If ye be Christ&#x27;s, then you are Abraham&#x27;s Seed, and Heirs according to the Promise.</p></blockquote>

</figure><figure class="quote" id="q-2a2daaae1f" data-kw="">
<blockquote><p>The end which God aimed at in giving the law of Moses, was not, that any should ever attain to holiness or salvation by condition of perfect or sincere obedience to it; though, if there had been any such way of salvation at that time, it must have consisted in the performance of that law, which was then given to the church, to be a rule of life, as well as a covenant. There was another covenant made before that time with Abraham, Isaac, and Jacob, a covenant of grace, promising all blessings freely through Christ, the promised seed, by which only they were to be saved. And the covenant of the law was added, that they might see their sinfulness, and subjection to death and wrath, and the impossibility of attaining to life or holiness by their works, and be forced to trust on the free promise only for all their salvation, and that sin might be restrained by the spirit of bondage, until the coming of that promised seed Jesus Christ, and the more plentiful pouring out of the sanctifying Spirit, by him. This the apostle Paul shows largely (Gal. 3:15-24; Rom. 5:20,21 and 10:3,4). None of the Israelites under the Old Testament were ever saved by the Sinai covenant; neither did any of them ever attain to holiness by the terms of it. Some of them did indeed perform the commandments of it sincerely, though imperfectly: but those were first justified, and made partakers of life and holiness, by virtue of that better covenant made with Abraham, Isaac, and Jacob, which was the same in substance with the new covenant or testament established by the blood of Christ. Had it not been for the better covenant, the Sinai covenant would have proved to them an occasion of no happiness , but only of sin, despair, and destruction. Of itself it was only a killing letter, the ministration of death and condemnation: and therefore it is now abolished, 2 Cor. 3:6,8,9,11. – We have cause to praise God, for delivering His church, by the blood of Christ, from this yoke of bondage; and we have cause to abhor the device of those that would lay upon us a more grievous and terrible yoke, by turning our very new covenant in a covenant of sincere works, and leaving us no such better covenant, as the Israelites had under their yoke, to relieve us in our extremity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-marshall.html">Walter Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gospel Mystery of Sanctification</cite>, 51</span></figcaption>

<blockquote><p>But, ye’ll say, they explain themselves and say [that] though faith is the condition of salvation, yet they are not saved because of it as a work, but only a condition. But to this I say, I cannot think of any intelligible meaning of the word “work” in divinity, but something to be done as a condition; what Adam was to do was a work no otherwise. Talking thus, whether it be truly or falsely, is doubtless the foundation of Arminianism and neonomianism, and tends very much to make men value themselves for their own righteousness. …

But it seems to me, all this confusion arises from the wrong distinction men make between the covenant of grace and the covenant of redemption. It seems to me to be true, that as the first covenant was made with the first Adam, so the second covenant was made with the second Adam; as the first covenant was made with the seed of the first Adam no otherwise than as it was made with them in him, so the second covenant is not made with the seed of the second Adam any otherwise than as it was made with them in him. It was not one covenant that was made with Adam, and another, that he had nothing to do with, that was made with his seed; so neither was it one covenant that was made with Christ, and another, that Christ had nothing to do with, with believers. But then, in all respects wherein Adam was a common head and representative of men, so Christ is a common head and representative of believers; as Adam was only the first created of men, so Christ is eldest brother of believers.

As the condition of the first covenant was Adam’s standing, so the condition of the second covenant is Christ’s standing. Christ has performed the condition of the new covenant. There is nothing more to be done; all is done already. We have nothing to do, upon the account of which we are to be saved; we are to do nothing but only to receive Christ and what he has done already. Salvation is not offered to us upon any condition, but freely and for nothing. We are to do nothing for it, we are only to take it. This taking and receiving is faith. It is not said, “If you will do so and so you may have salvation, you may have the water of life,” but “Come and take it; whosoever will, let him come” [Revelation 22:17].

It is very improper to say that a covenant is made with men any otherwise than in Christ, for there is vast difference between a free offer and a covenant. The covenant was made with Christ, and in him with his mystical body; and the condition of this covenant is Christ’s perfect obedience and sufferings. And that [covenant] that is made to men is a free offer; that which is commonly called the covenant of grace is only Christ’s open and free offer of life, whereby he holds it out in his hand to sinners and offers it without any condition. Faith can’t be called the condition of receiving, for it is the receiving itself; Christ holds out and believers receive. There was no covenant made, or agreement upon something that must be done, before they might receive. ‘Tis true, those that don’t believe are not saved, and all that do believe are saved: that is, all that do receive Christ and salvation, they receive it; and all that will not receive salvation, never do receive it and never have it. But faith, or the reception of it, is not the condition of receiving of it. It is not proper, when a man holds out his gift to a beggar that he may take it without any manner of preliminary conditions, [to say] that he makes a covenant with the beggar. No more proper is it to say, that Christ’s holding forth life in his hand to us that we may receive it, is making a covenant with us.

But I must confess after all, that if men will call this free offer and exhibition a covenant, they may; and if they will call the receiving of life the “condition” of receiving of life, they are at their liberty. But I believe it is much the more hard to think right, for speaking so wrong. Christ and his church are one in law; that is, they are one in respect of the covenant. By Christ’s performing the condition of the covenant, the condition is as if it were performed by them. If you divide Christ and the church in covenant, and say that one covenant is made with one and another with the other, you make them two in law. This making faith a condition of life fills the mind with innumerable difficulties about faith and works and how to distinguish them, tends to make us apt to depend on our own righteousness, tends to lead men into neonomianism, and gives the principal force to their arguments. Whereas, if we would leave off distinguishing the covenant of grace and the covenant of redemption, we should leave all these matters plain and unperplexed.</p></blockquote>

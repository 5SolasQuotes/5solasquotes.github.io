<main class="wrap"><figure class="quote" id="q-1cac9130be" data-kw="">
<blockquote><p>Now it appears, that it was the will of our Lord and Saviour Christ, that we should, since his resurrection, keep for our Sabbath that first day of the week; forasmuch as he arose on that day, John xx. 1-19, and appeared divers times on this our Lord’s day to his disciples before his ascension; and did on this day, being the day of Pentecost, Acts ii. 1-4, fill his disciples with the gifts of the Holy Ghost, they being assembled together; all which gives a pre-eminence to this day, and a probability to the point.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-scudder.html">Henry Scudder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Daily Walk in Holy Security and Peace</cite>, (1627; Philadelphia, 1800), p. 86.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-d25546976b" data-kw="">
<blockquote><p>The things that are said of the burning bush, do wonderfully agree with the Old-Testament representations of the Messiah. It was not a high tree, but a bush; as the Messiah is called the low tree; Eze. 17:24, and elsewhere, the twig and the tender plant. This bush was a root out of dry ground; for it was a bush that grew in mount Horeb, which was so called for the remarkable dryness of the place. The word signifies ‘dryness;’ there was no spring about the mountain, till Moses there fetched water out of the dry rock. It was in a thirsty wilderness, where was wont to be no rain… That bush was the growth of the earth, as the human nature of Christ in the Old Testament is represented to be. Yet it had the divine nature of Christ in it; for this angel of the Lord that is said to appear in the bush, has been proved to be the same with the Messiah from the Old Testament, in my discourse on the prophecies of the Messiah. This angel is said to ‘dwell’ in this bush, Dt. 33:16, the more to represent the divine nature of the Messiah dwelling in the human nature. This bush burnt with fire, agreeably to what the prophecies speak of the sufferings of Christ; great calamity and affliction in the Old Testament are often called fire. This was especially a resemblance of the wrath of God, that is often called fire in the Old Testament, and which the prophecies represent the Messiah as enduring… The bush was preserved from being consumed, though it burnt with fire, agreeably to the prophecies of the preservation and upholding of the Messiah, God’s not suffering his Holy One to see corruption, etc. The bush emerged alive and frech out of the fire, agreeably to the prophecies of the Messiah’s resurrection from the dead, and deliverance from all his sufferings. The angel that dwelt out of that bush, who was the Messiah, comes out of the fire, and appears in the bush, and delivered alive from the flames, to work redemption for his people. See Ex. 3:8. So the prophecies represent the Messiah rising from the dead, and exalted out of his state of humiliation, to work salvation for his people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works</cite>, … ed. Edward Hickman (London: Ball, 1840) | Types of the Messiah, p. 653, vol. 2</span></figcaption>

</figure><figure class="quote" id="q-dce8773883" data-kw="">
<blockquote><p>But suppose the statute is immoral, requiring of the citizen an act of omission properly a sin; how shall a free conscience then act? I answer: It asserts its higher law by refusing to be accessory to the sin.</p></blockquote>

</figure><figure class="quote" id="q-c1b9f9054e" data-kw="">
<blockquote><p>It is granted by all sober Protestants that the Church has power of making canons and constitutions for decency and order in the public worship of God; and not only to prescribe the necessary circumstances of time and place, but also to continue and establish those ancient rites of the Christian Church which were practiced in the primitive times and are in themselves of an indifferent nature; which authority of the Church was asserted in the Augustan [Augsburg] Confession [art. 7, 15, 21, 24, Conclusion], and particularly by Mr. Calvin (Institutes, bk. 4, ch. 10, sect. 27. See Thomas Cartwright, [A Reply to an Answer,] bk. 1, [Answer to pp. 20-22,] p. 27), and other worthy persons in the Reformation. Which our [Anglican] reformers also did assume to themselves, as is declared in the 20th Article [of the 39 Articles]; and has been practised and defended against all Dissenters, as well by Scripture (Acts 15:28; 1 Cor. 11:16), as by antiquity and right reason… And the Royal Martyr [King Charles I] was so tender of their reputation that in his answer to the Parliament’s remonstrance, he promises to reform the ceremonies with these cautions:

1. That the reformation were pursued with such modesty and submission that the quiet of the kingdom were not disturbed;

2. Nor the decency and comeliness of God’s service discountenanced;

3. Nor the pious, sober and devout actions of those reverend persons who were the first laborers in the blessed Reformation be scandalized and defamed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-long.html">Thomas Long</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Preface concerning the Ceremonies of the Church’ in Misericordiam Volo</cite>, ‘The Preface concerning the Ceremonies of the Church’ in Misericordiam Volo: or the Pharisees’ Lesson, showing the Impiety &amp; Unreasonableness of contending for Outward Forms &amp; Ceremonies to the Violation of Obedience, Charity &amp; the Public Peace in The Character of a Separatist, or Sensuality the Ground of Separation... (London: Kettilby, 1677)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

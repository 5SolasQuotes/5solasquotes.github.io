<main class="wrap"><figure class="quote" id="q-a421e261ee" data-kw="">
<blockquote><p>Cyril Lukaris (1572-1638) has often been described as the Calvinist Patriarch of Constantinople. His Confession of 1629/31 sets out his agreement with the Reformed view of unconditional election:

Chapter III

We believe that the most good God to have, before the foundation of the world, predestined unto glory those whom He has chosen, without having in any wise regard to their works, and having no actuating cause for this election, except His good pleasure, the divine mercy. In like manner to have, before the world was, rejected those whom He has rejected; and of this rejection, if any one will look to the absolute power and authority of God, he will find the undoubted cause to be the divine will; and, if again any one will turn to the laws and rules of good order which the providence above uses in the governing of the world, he will perceive the cause to be His righteousness. For God is merciful and withal righteous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jr-james-t-dennison.html">James T. Dennison Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Confessions of the 16th and 17th Centuries in English Translation</cite>, (Grand Rapids MI: Reformation Heritage Books, 2014), 4: 156-57.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election.html">Election</a></span></div>

</figure><figure class="quote" id="q-f91a5a36b0" data-kw="">
<blockquote><p>The expression of our Savior, &quot;Many are called, but few are chosen,&quot; (Mt. 22:14), is also very improperly interpreted (see Book 3, chap. 2, sec. 11, 12). There will be no ambiguity in it, if we attend to what our former remarks ought to have made clear--viz. that there are two species of calling: for there is an universal call, by which God, through the external preaching of the word, invites all men alike, even those for whom he designs the call to be a savor of death, and the ground of a severer condemnation. Besides this there is a special call which, for the most part, God bestows on believers only, when by the internal illumination of the Spirit he causes the word preached to take deep root in their hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.24.8</span></figcaption>

</figure><figure class="quote" id="q-c9e0c178a3" data-kw="">
<blockquote><p>In election, believers were from all eternity given to Jesus Christ. As believers were chosen from all eternity, so Christ was from eternity chosen and appointed to be their redeemer, and he undertook the work of redeeming them. But there was a covenant about it between the Father and Son. Christ, as we have already observed, loved them. This is the account he gives of himself, how it was with him before the world, and one thing is that then he rejoiced in the habitable parts of God’s earth and his delights were with the sons of men [Proverbs 8:31].

And when he undertook for them, he knew what success he should have. God promised him a certain number, and he had their names, as it were, written in a book; and therefore the book of life is called the Lamb’s book; Revelation 21:27, “but they that are written in the Lamb’s book of life.” And he bears their names upon his heart, as the high priest of old did the names of the tribes of the children of Israel on his breastplate [Exodus 28:29].

Christ often calls the elect those that God had given him; John 17:2, “As thou hast given him power over all flesh, that he should give eternal life to as many as thou hast given him”; and again, in John 17:9, “I pray not for the world, but for them which thou hast given me”; John 17:11, “Keep through thy name those whom thou hast given me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christians a Chosen Generation</cite>, (1731) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), p. 282.</span></figcaption>

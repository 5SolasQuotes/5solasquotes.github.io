<main class="wrap"><figure class="quote" id="q-fe280a08e1" data-kw="">
<blockquote><p>14. No man is saved or justified but by the proper merit of Christ’s perfect obedience; yea, and his habitual holiness and satisfactory sufferings, advanced in dignity by his divine perfection.

15. This merit, as related to us, supposes that Christ, as a sponsor, was the Second Adam, the Root of the justified, the reconciling Mediator, who obeyed perfectly with that intent that by his obedience we might be justified; and who suffered for our sins, in our room and stead; and so was in tantum [to that extent] our Vicarius poenae, as some phrase it, or substitute; and was made a curse for us, that we might be healed by his stripes; as He was obedient, that his righteousness might be the reason as a meritorious cause of our justification: which supposes the relation of an undertaking Redeemer, in our nature doing this, and in our stead so far forth, as that therefore perfect obedience should not be necessary to be performed by ourselves: And righteousness therefore is imputed to us, that is, we are truly reputed righteous, because we, as believing members of Christ, have right to impunity and life, as merited by his righteousness, and freely given to all penitent believers. And Christ’s own righteousness may be said so far to be imputed to us, as to be reckoned or reputed the meritorious cause of our right or justification, as aforesaid.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable</cite>, ... (London: White, 1675), ‘An Appendix to this Premonition,’ n.p.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f635f317d4" data-kw="">
<blockquote><p>Justification goes beyond forgiveness. Not only are we forgiven because of Christ, but God also declares us righteous because of Christ. God requires two things of us: punishment for our sins and perfection in our lives. Our sins must be punished, and our lives must be righteous. But we cannot bear our own punishment (Ps. 49:7-8), and we cannot provide our own righteousness. “None is righteous; no, not one” (Rom. 3:10). Therefore, God, out of His immeasurable love for us, provided His own Son to do both. Christ bears our punishment, and Christ performs our righteousness. And when we receive Christ (John 1:12), all of His punishment and all of His righteousness is counted as ours (Rom. 4:4-6; 5:1, 19; 8:1; 10:4; 2 Cor. 5:21; Phil. 3:8-9).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-piper.html">John Piper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This Momentary Marriage</cite>, p. 46</span></figcaption>

</figure><figure class="quote" id="q-080a24a856" data-kw="">
<blockquote><p>The righteousness by which we are justified and stand righteous before God, is not our own righteousness, but the righteousness of Christ, Phil. 3:8-9; 2 Cor. 5:21, not the righteousness of Christ as God the Second Person in Trinity, but as Mediator, God-man. In which there are two things:

1. The perfect holiness of his humane nature, Heb. 7:26.

2. The perfect righteousness which He performed in doing and suffering according to the Law, this is imputed to us. Christ’s active obedience, his good works and holy life could never have been meritorious for us, nor brought us to Heaven, if he had not died for us, therefore our justification and obtaining of heaven is ascribed to his blood, as if that alone had done both, Rom. 5:9; Heb. 10:19; Rev. 5:6, 9, 11; his intercession and prayers had not been meritorious for us, if he had not died for us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, A.M., 1654), bk. 7, ch. 6, ‘Of Justification’, pp. 513-14</span></figcaption>

<blockquote><p>XXX. We are justified by that righteousness alone by which our Surety was freed from our guilt. But He was fully freed from our guilt by the power of the satisfaction which He rendered on our behalf; therefore, by that same righteousness alone, we too are fully justified. Who would deny that, when the debt owed by us is paid, the handwriting that was against us (Col. 2:14) is erased, and we are no longer liable to our creditor? That by the same righteousness by which we are redeemed from condemnation and the curse of the law (Gal. 3:13), we are also justified? That by the same satisfaction by which divine justice was perfectly satisfied for us, and by which we were so reconciled to God that He adopted us as sons and heirs, God is now completely propitiated toward us? That by the same propitiation by which our sins were fully expiated and cleansed, we now obtain the right of access into the Temple of God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joshua-placeus.html">Joshua Placeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on the Justification of Man before God’</cite>, (1634), p. 6</span></figcaption>

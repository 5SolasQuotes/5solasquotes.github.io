<blockquote><p>The daring attack that is now made by some of the directors of the Edinburgh and Glasgow Railway on the law of God and the peace of our Scottish Sabbath – the blasphemous motion which they mean to propose to the shareholders in February next – and the wicked pamphlets which are now being circulated in thousands, full of all manner of lies and impieties- call loudly for the calm, deliberate testimony of all faithful ministers and private Christians in behalf of God’s holy day. … (1) The keeping open of Reading-Rooms – In this town, and in all the large towns of Scotland, I am told, you may find in the public reading-rooms many of our men of business turning over the newspapers and magazines at all hours of the Lord’s day… (2) The keeping open Public-Houses – Public-houses are the curse of Scotland. I never see a sign, “Licensed to sell spirits,” without thinking that it is a licence to ruin souls. (3) Sunday Trains upon the Railway – A majority of the directors of the Edinburgh and Glasgow Railway have shown their determination, in a manner that has shocked all good men, to open the railway on the Lord’s day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-murray-m-cheyne.html">Robert Murray M’Cheyne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘I Love the Lord’s Day’</cite>, (1841)</span></figcaption>

<blockquote><p>Question. Wherein stands the eternity of the Covenant of Grace? And what other properties there be of the Covenant? Answer. The Law and Covenant of Works is a rule of everlasting righteousness, and so may be called an everlasting righteousness, containing precepts of the Law of nature intrinsically good, such as to know love, fear, trust in Him as the only true God: and in this sense it is an eternal Covenant. But 1. it is not eternal in the positives of the Second, and Fourth, and Fifth Commands, the way of worship, the means, as ceremonies, Sabbath, magistracy, and such like, which are not to continue in the life to come, and so neither faith nor hope in God through Christ, 1 Cor. 13:13; Rom. 8:24-25; 2 Cor. 5:7, nor a Temple, nor ordinances, nor the Kingdom of Christ as now dispensed are to be the binding rule for eternity to such as are confederates of the Covenant of Grace, Rev. 21:22,23; 1 Cor. 15:24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, … (Edinburgh, 1655), p. 214</span></figcaption>

<blockquote><p>…as [John] Cameron notes, it is ordinary to call that necessary which is very profitable and expedient. Beside this (I say), we further maintain that in the use of things indifferent, that which we deliberate upon to do is never lawful to be done except it be also necessary, though not necessitate absoluta seu consequentis [by an absolute necessity, of the consequence], yet necessitate consequentiae seu ex supposition [by a necessity of the consequent, or from the supposition]. Paul’s circumcising of Timothy was lawful only because it was necessary, for he behooved by this means to win the goodwill of the people of Lystra who had once stoned him, otherwise he could not safely have preached the Gospel among them. Therefore he had done wrong if he had not circumcised Timothy, since the circumcising of him was according to the rules of the Word, and it was expedient to circumcise him and unexpedient to do otherwise. And (because de paribus idem est judicium [from the parts, so is the judgment]) whensoever the use of any indifferent thing is according to the rules of the Word, that is, when it is profitable for God’s glory and man’s edification, and the doer is persuaded of so much, I say, putting this case, then (for so much as not only it may, but ought to be done) the use of it is not only lawful, but necessary: and (for so much as not only it needs not, but ought not to be omitted) the omission of it is not only unnecessary, but also unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, (1637) | pt. 4, ch. 3, ‘Whether there be anything indifferent in actu exercito [in the exercised act]’, p. 17 While Gillespie’s teaching here is not in the context of the Sabbath, it is very relevant.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-16bd4886a2" data-kw="">
<blockquote><p>And in the seventh chapter [Jn. 7:23], He defends this fact of his, saying, ‘If a man upon the Sabbath receive circumcision, that the law of Moses should not be broken; be ye angry with Me, because I haue made a man every whit whole on the Sabbath day?’ If the law of circumcision do bind men to minister and receive it upon the Sabbath, then much more does the law of love bind men to show mercy upon the Sabbath, seeing that it is appointed of God, not to hinder us from, but to further us in all his works, among which the relieving of them that be in necessity, is one of the chief and principal. And as the Lord Jesus Christ came not to destroy the law, but to fulfill it, so He observed it very carefully in this point, and being most full of compassion, did declare it abundantly, by taking all oportunity to succour them that were in misery, even upon the Sabbath, as the fittest time for it.</p></blockquote>

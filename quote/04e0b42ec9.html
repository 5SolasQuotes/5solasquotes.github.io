<main class="wrap"><figure class="quote" id="q-04e0b42ec9" data-kw="">
<blockquote><p>We acknowledge there be two Sacraments, which, we judge, properly ought to be called by this name; that is to say, Baptism and the Sacrament of thanksgiving. For thus many we say were delivered and sanctified by Christ, and well allowed of the old fathers, Ambrose and Augustine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/sacraments.html">Rome: Sacraments</a> › <a href="../topics/rome/sacraments/seven-sacraments.html">Seven sacraments</a></span></div>

— John Jewel, An Apology of the Church of England, Part 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+acknowledge+there+be+two+Sacraments%2C+which%2C+we+judge%2C+properly+ought+to+be+called+by+this+name%3B+that+is+to+say%2C+Baptism+and+the+Sacrament+of+thanksgiving.+For+thus+many+we+say+were+delivered+and+sanctified+by+Christ%2C+and+well+allowed+of+the+old+fathers%2C+Ambrose+and+Augustine.%E2%80%9D%0A%0A%E2%80%94+John+Jewel%2C+An+Apology+of+the+Church+of+England%2C+Part+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F04e0b42ec9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/04e0b42ec9.html">Permalink</a><a class="src" href="https://anglicanhistory.org/jewel/apology/" rel="noopener" target="_blank">Read it online · Project Canterbury</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b9c1dc3608" data-kw="">
<blockquote><p>We affirm that bread and wine are holy and heavenly mysteries of the body and blood of Christ, and that by them Christ Himself, being the true bread of eternal life, is so presently given unto us as that by faith we verily receive his body and his blood. Yet say we not this so, as though we thought that the nature and substance of the bread and wine is clearly changed and goeth to nothing: as many have dreamed in these later times, which yet could never agree among themselves, of this their dream.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/sacraments.html">Rome: Sacraments</a> › <a href="../topics/rome/sacraments/transubstantiation.html">Transubstantiation</a></span></div>

— John Jewel, An Apology of the Church of England, Part 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe%20affirm%20that%20bread%20and%20wine%20are%20holy%20and%20heavenly%20mysteries%20of%20the%20body%20and%20blood%20of%20Christ%2C%20and%20that%20by%20them%20Christ%20Himself%2C%20being%20the%20true%20bread%20of%20eternal%20life%2C%20is%20so%20presently%20given%20unto%20us%20as%20that%20by%20faith%20we%20verily%20receive%20his%20body%20and%20his%20blood.%20Yet%20say%20we%20not%20this%20so%2C%20as%20though%20we%20thought%20that%20the%20nature%20and%20substance%20of%20the%20bread%20and%20wine%20is%20clearly%20changed%20and%20goeth%20to%20nothing%3A%20as%20many%20have%20dreamed%20in%20these%20later%20times%2C%20which%20yet%20could%20never%20agree%20among%20themselves%2C%20of%20this%20their%20dream.%E2%80%9D%0A%0A%E2%80%94%20John%20Jewel%2C%20An%20Apology%20of%20the%20Church%20of%20England%2C%20Part%202&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb9c1dc3608.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b9c1dc3608.html">Permalink</a><a class="src" href="https://anglicanhistory.org/jewel/apology/" rel="noopener" target="_blank">Read it online · Project Canterbury</a></div>
</figure><figure class="quote" id="q-9728b127f4" data-kw="against mass">
<blockquote><p>Thus we determine that in the Christian church no true, real and properly so called propitiatory sacrifice is granted, except the sacrifice of Christ once offered on the cross. This we think neither can nor ought to be repeated. And so we reject and detest the sarifice of the Mass as diametrically opposed to the sacred Scriptures and to the Christian faith and highly injurious and derogatory to Christ. The reasons why we thus determine are many. Proof that no sacrifice of the Mass is granted: (1) from the silence of the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.29.5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/the-mass.html">The Mass</a> › <a href="../topics/the-lords-supper/the-mass/mass-for-the-dead.html">Mass for the dead</a></span><span class="t"><a href="../topics/rome/sacraments.html">Rome: Sacraments</a> › <a href="../topics/rome/sacraments/seven-sacraments.html">Seven sacraments</a></span></div>

— Francis Turretin, Institutes of Elenctic Theology, 19.29.5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus%20we%20determine%20that%20in%20the%20Christian%20church%20no%20true%2C%20real%20and%20properly%20so%20called%20propitiatory%20sacrifice%20is%20granted%2C%20except%20the%20sacrifice%20of%20Christ%20once%20offered%20on%20the%20cross.%20This%20we%20think%20neither%20can%20nor%20ought%20to%20be%20repeated.%20And%20so%20we%20reject%20and%20detest%20the%20sarifice%20of%20the%20Mass%20as%20diametrically%20opposed%20to%20the%20sacred%20Scriptures%20and%20to%20the%20Christian%20faith%20and%20highly%20injurious%20and%20derogatory%20to%20Christ.%20The%20reasons%20why%20we%20thus%20determine%20are%20many.%20Proof%20that%20no%20sacrifice%20of%20the%20Mass%20is%20granted%3A%20%281%29%20from%20the%20silence%20of%20the%20Scriptures.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%2019.29.5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9728b127f4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9728b127f4.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-ff93b48a27" data-kw="">
<blockquote><p>Hence Romanists and Ritualists have inferred that the sign is inseparable from the grace signified, and that these spiritual effects are due to the outward ordinance. Hence the doctrine of baptismal regeneration. But it must be observed that the Scriptures do not assert these spiritual attributes of water baptism in itself considered, but of water baptism as the sign or emblem of baptism by the holy Ghost. These spiritual attributes belong only to baptism by the Spirit, and they accompany the sign only when the sign is accompanied by that which it signifies. It does not follow, however, that the sign is inseparable from the grace. The grace is sovereign; and experience teaches us that it is often absent from the sign, and that the sign is least frequently honoured by the presence of the grace when it is itself most implicitly relied upon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, chs. 27–28 (on baptismal regeneration)</span></figcaption>

</figure><figure class="quote" id="q-d12fdf0e2d" data-kw="">
<blockquote><p>Bishops, Priests, and Deacons, are not commanded by God&#x27;s Law, either to vow the estate of single life, or to abstain from marriage: therefore it is lawful for them, as for all other Christian men, to marry at their own discretion, as they shall judge the same to serve better to godliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/church-of-england.html">Church of England</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Thirty-Nine Articles</cite>, 1563, Art. 32</span></figcaption>

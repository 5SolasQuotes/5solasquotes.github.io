<blockquote><p>4. They, who truly fear the name of God [and refuse the ceremonies], are indeed scandalized by the prelates, their depriving of ministers for refusing to conform: but by the ministers, their suffering of deprivation for this cause, they are not scandalized, but edified. But fiftly saith Mr. [John] Sprint, it offends the magistrate, by provoking him (persuaded and resolved as he is [as to the lawfulness of the ceremonies]) to disgrace these otherwise well deserving ministers, and to strike them with the sword of authority. Answer: Our refusal to conform to inconvenient ceremonies, being a necessary duty, if the magistrate be provoked therewith, we are blameless: neither can it any otherwise provoke him to disgrace those well deserving ministers than Moses his seeking of liberty for Israel to go and serve God according to his will provoked Pharaoh the more to oppress them, or than Christ’s preaching of the truth and his abstaining from the superstitious ceremonies of the Pharisees provoked them to disgrace Him and plot his hurt. Howbeit we are not ignorant that the magistrate is not provoked by our refusing to conform, except as it is misreported, misdeemed, and misconstructed to him by the false calumnies of our adversaries: which being so, he is not incited by our deed, but by theirs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 1, p. 7</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d0c5795f6d" data-kw="">
<blockquote><p>As the relatively strict confessionalism of the sixteenth and seventeenth centuries gave way to various patterns of deconfessionalization, it became increasingly difficult to justify and sustain a strict understanding of the fundamental articles. Among the Reformed themselves, the half century from 1675 to 1725 saw a shift from the attempt to define confessional orthodoxy in the strictest terms in the Formula Consensus Helvetica to the passing of strict confessional subscription throughout nearly all of Protestant Switzerland. At the same time, in England, the Dissenting clergy [after 1662] were unable to maintain any sort of standardized confessional subscription and the Anglican Church had reached the conclusion that both Reformed and Arminian constructions of the doctrine of salvation could be legitimate under subscription to the Thirty-Nine Articles–and some even argued the legitimacy of non-Nicene understandings of the Trinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD</cite>, (2003) 1.428-9</span></figcaption>

</figure><figure class="quote" id="q-d28781669c" data-kw="">
<blockquote><p>2nd Proposition. There may be different sentiments without separation. And hence the apostle exhorts all to “forbear one another in love” (Eph. 4:1-6), and to “walk by the same rule whereunto we have already attained.” [Phil. 3:15-16] If the sentiments of all were the same, there had not been need for any such exhortation. As long as we see but in part, as we think others should allow us to differ from them, we ought to forbear such as differ from us, I mean in things not fundamental.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland, in which the Chief Things in the Testimonies of these Reverend Brethren who lately made a Secession from her are considered &amp; shown to be no Ground of Separation or Secession</cite>, An Essay on Separation: or a Vindication of the Church of Scotland, in which the Chief Things in the Testimonies of these Reverend Brethren who lately made a Secession from her are considered &amp; shown to be no Ground of Separation or Secession (1738) | ch. 2, In which sundry propositions anent separation are laid down</span></figcaption>

</figure><figure class="quote" id="q-a9d41009ae" data-kw="">
<blockquote><p>It is true indeed, the apostle in his epistle to the Galatians, is very severe against some false teachers; which yet does not weaken, but really confirm the necessity of this forbearance and toleration. For those teachers were themselves against tolerating others, and would have the ceremonies of the Law imposed upon all Christians, as things necessary to salvation; by which means the Christian faith would have been greatly corrupted. And at the same time that he so sharply inveighs against these teachers, he is very large in recommending charity and forbearance, even in so freat a diversity of opinions as this was; and commands that “they who were overtaken in a fault, should be restored in the spirit of meekness;” (Gal. 5:13-15) and that “they should bear one another’s burdens.” (Gal. 6:1-2) And at last, when he had told them that the essence of Christianity did not consist in circumcision, or uncircumcision, i.e. in observing or omitting the ceremonies of the Law, but “in the new creature,” i.e. in true and real holiness; he adds these words, wherein he most affectionately desires, as well as commands, a mutual forbearance among persons who differ in things not fundamental; “and as many as walk according to this rule,” i.e. that agree in the essentials of Christianity, and form their lives according to this rule, “Peace be upon them, and mercy, and upon the Israel of God.” (Gal. 6:15-16)… And if we turn out thoughts to the following circumstances, we shall plainly perceive of how great weight these things are to recommend the like forbearance among Christians in these days:

1. The apostles were infallible, and if they would not attempt to compose these differences by exerting their authority, but chose to recommend forbearance on both sides, how much more should we take the like course, who have not the least pretences to infallibility?

2. The dispute was not about a trifle, but a very weighty affair, even the difference between the Law and the Gospel; a thing that did not consist in mere speculation, but had a great influence both upon practice and worship. Alas! How many trivial controversies in comparison of this do sour the minds of Christians in these days?

3. Both sides were furnished with very considerable arguments, the one a Law given by God, the other the defense of Christian liberty.

4. St. Paul himself, who so strenuously urged this forbearance, had before such a flaming zeal for the Law, that he was even mad for it.

5. Lastly, these precepts of forbearance were given after the vision from Heaven to Peter, and after the apostolic synod; so that these controversies had been sufficiently determined already, by this vision, and by the decree of the apostles. Whoever therefore shall seriously consider these circumstances, and weigh them impartially, can’t surely but conclude that these apostolical precepts of forbearance, if they had any weight in their times, ought to have much more in our times, and in the present controversies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Fundamental Articles in Religion</cite>, (London: Darby, 1720), ch. 7, ‘Church communion ought to be had among those not differing in fundamentals’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

rbearance+among+Christians+in+these+days%3A+1.+The+apostles+were+infallible%2C+and+if+they+would+not+attempt+to+compose+these+differences+by+exerting+their+authority%2C+but+chose+to+recommend+forbearance+on+both+sides%2C+how+much+more+should+we+take+the+like+course%2C+who+have+not+the+least+pretences+to+infallibility%3F+2.+The+dispute+was+not+about+a+trifle%2C+but+a+very+weighty+affair%2C+even+the+difference+between+the+Law+and+the+Gospel%3B+a+thing+that+did+not+consist+in+mere+speculation%2C+but+had+a+great+influence+both+upon+practice+and+worship.+Alas%21+How+many+trivial+controversies+in+comparison+of+this+do+sour+the+minds+of+Christians+in+these+days%3F+3.+Both+sides+were+furnished+with+very+considerable+arguments%2C+the+one+a+Law+given+by+God%2C+the+other+the+defense+of+Christian+liberty.+4.+St.+Paul+himself%2C+who+so+strenuously+urged+this+forbearance%2C+had+before+such+a+flaming+zeal+for+the+Law%2C+that+he+was+even+mad+for+it.+5.+Lastly%2C+these+precepts+of+forbearance+were+given+after+the+vision+from+Heaven+to+Peter%2C+and+after+the+apostolic+synod%3B+so+that+these+controversies+had+been+sufficiently+determined+already%2C+by+this+vision%2C+and+by+the+decree+of+the+apostles.+Whoever+therefore+shall+seriously+consider+these+circumstances%2C+and+weigh+them+impartially%2C+can%E2%80%99t+surely+but+conclude+that+these+apostolical+precepts+of+forbearance%2C+if+they+had+any+weight+in+their+times%2C+ought+to+have+much+more+in+our+times%2C+and+in+the+present+controversies.%E2%80%9D%0A%0A%E2%80%94+Jean-Alphonse+Turretin%2C+A+Discourse+concerning+Fundamental+Articles+in+Religion%2C+%28London%3A+Darby%2C+1720%29%2C+ch.+7%2C+%E2%80%98Church+communion+ought+to+be+had+among+those+not+differing+in+fundamentals%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa9d41009ae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a9d41009ae.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-controversies/#:~:text=It%20is%20true%20indeed%2C%20the%20apostle,times%2C%20and%20in%20the%20present%20controversies&amp;text=It%20is%20true%20indeed%2C%20the%20apostle%20in%20his&amp;text=in%20our%20times%2C%20and%20in%20the%20present%20controversies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>During his formative years, while studying at Herborn and Heidelberg, Comenius came under the influence of teachers who strengthened his ecumenical predisposition. This is particularly true of the period of study at Heidelberg, where he became acquainted with David Pareus, whose house, ‘Pareanum’, served as the center for those who worked for Protestant union. Two years after his return to his native land, Comenius was ordained priest of the Unity, and became pastor at Fulnek in Moravia. But with the outbreak of the Thirty Years War, Fulnek fell a prey to the fury of the Imperial armies. Comenius was compelled to take refuge on the Bohemian estates of one of the most important members of the Unity, Count Charles of Zerotin… There he wrote his celebrated Labyrinth of the World, a book in which the ecumenical theme found expression in condemnation of the fanaticism and bigotry of the confessional groups…” – Martin Schmidt in A History of the Ecumnical Movement, vol. 1, p. 89 Various – Good Counsels for the Peace of Reformed Churches by some reverend &amp; learned Bishops &amp; other Divines (Oxford: 1641) 150 pp. ToC King James I, To Cardinal Perron Richard Hooker, Answer to Travers Edwin Sandys, View of the State of Religion in the Western World John Davenent, Opinion of Thomas Morton, On the Peace of the Church Joseph Hall Opinion of To John Dury James Ussher Opinion of Sermon before King James Some French Reformed Divines, Opinion of Dury, John A Summary Discourse Concerning the Work of Peace-Ecclesiastical, how it may Concur with the Aim of a Civil Confederation Amongst Protestants (Cambrdige, 1641) 50 pp. A Motion Tending to the Public Good of this Age &amp; of Posterity, or, The Copies of Certain Letters Written by Mr. John Dury to a Worthy Knight at his Earnest Desire, Showing Briefly what a Public Good is &amp; how by the best Means of Reformation in learning &amp; religion it may be Advanced to Some Perfection (1642) 50 pp. Giles Firmin – Separation Examined: or a Treatise wherein the Grounds for Separation from the Ministry &amp; Churches of England are weighed and found too light… Also an humble request presented to the congregational divines, that since the differences between them and the classical [presbyterial]-divines are very small, they would please to strike in with the classical-divines in carrying on the work of reformation… (London: R.I., 1652) 111 pp. Firmin (1614–1697) was a puritan English minister who appeared to lean congregationalist, but could submit to episcopacy and presbyterianism. He actively promoted Baxter’s model of persons of different persuasions in Church government uniting in a consensus practice (as Phil. 3:15-16 says Christians ought to do). Firmin was ejected in the Great Ejection of 1662. Baxter, Richard Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653) 145 pp. ToC See the second part of this, ‘An Explication of some Passages in the foregoing Propositions.. with an Answer to some Objections’ at EEBO. For background to Baxter’s paradigmatic and influential association of moderates of the differing parties for the sake of the Gospel and pastoral work (during a political and ecclesiastical vacuum), and the other similar associations which were modeled after it, see Tim Cooper, When Christians Disagree: Lessons from the Fractured Relationship of John Owen and Richard Baxter (Crossway, 2024), pp. 23, 91-92, 104. For the creedal Profession and 20 Propositions of the discipline of the Association, typed out, see below. See also ‘A Brief Explication of Some Passages in the Profession’. ‘An Explication of Some Passages in the Propositions’ gives a lot more of the philosophy of the whole. Cooper: “England had a divided church. Even among puritans, fault lines had visibly widened under the pressure of the civil war and its aftermath. After his own traumatic experience of the war, Baxter longed for order and peace, and he developed a lifelong yearning to bring Christians together in unity. He identified four main parties within the English church (Congregationalists, Episcopalians, Erastians, and Presbyterians), but he felt that the moderates within each party held similar views and, more importantly, could work together in practice even if their principles varied. He believed that if England’s ministers simply got on with the work of ministry, they would be too busy to notice how their differing doctrines of church government might otherwise keep them apart. So he formed the Worcestershire Association, a network open to local parish ministers of all stripes who met monthly for the purpose of mutual edification and encouragement. In 1653 they published their agreement to work together, and similar ministerial associations sprang up in other counties.</p></blockquote>

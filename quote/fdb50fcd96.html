<main class="wrap"><figure class="quote" id="q-fdb50fcd96" data-kw="">
<blockquote><p>…natura identifies the concrete substance (substantia, q.v.) of a species both in essence (essentia) and existence (esse): e.g., not merely humanitas or natura humana as the quiddity of human beings, but natura humana as the substance of a particular human being, such as that nature assumed by the person of Christ…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-37de2859da" data-kw="">
<blockquote><p>Such as is the substance of everything, such also is the manner of being: but there is but one substance of Christ’s body: therefore but one manner of being, which is proper to bodies; that is, circumscriptive: not definitive, which is proper to the spirits, nor repletive, which is proper unto God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity 2nd</cite>, … (London, 1610), 2nd bk., ‘Of the Person of Christ’, p. 176</span></figcaption>

</figure><figure class="quote" id="q-c793e4c932" data-kw="">
<blockquote><p>§V. This Son was made man. The divine person assumed a human nature, lacking its own personality (persona), not a divine nature assuming a human nature or person, nor a person assuming a person. Therefore, Christ remains only one person, a divine one (1 Tim. 3:16). … §VII. This union is not a conjunction of parts, like soul and body, but an assumption of the human nature into unity with the person without change, confusion, division, or separation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary</cite>, trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 11, ‘Christ’, p. 114</span></figcaption>

</figure><figure class="quote" id="q-88ac8bbca2" data-kw="">
<blockquote><p>The orthodox therefore define the unio mystica as the spiritual conjunction (conjunctio spiritualis) of the Triune God with the believer in and following justification. It is a substantial and graciously effective indwelling. In relation to the ordo salutis (q.v.), or order of salvation, the Protestant scholastics distinguish the initial unitio (q.v.), or uniting, of the unio mystica, which is the basis for the imputation of Christ’s righteousness to the believer and which corresponds with the adoption (adoptio) of the believer, and the ongoing unio, or union, of the unio mystica, which continues concurrent with sanctification throughout the life of the believer…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘unio mystica sive praesentia gratiae tantum’ in Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st</cite>, ed. (Baker, 1985), pp. 314-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>
<div class="actions"><button class="copy" data-copy="“The orthodox therefore define the unio mystica as the spiritual conjunction (conjunctio spiritualis) of the Triune God with the believer in and following justification. It is a substantial and graciously effective indwelling. In relation to the ordo salutis (q.v.), or order of salvation, the Protestant scholastics distinguish the initial unitio (q.v.), or uniting, of the unio mystica, which is the basis for the imputation of Christ’s righteousness to the believer and which corresponds with the adoption (adoptio) of the believer, and the ongoing unio, or union, of the unio mystica, which continues concurrent with sanctification throughout the life of the believer…”

</figure><figure class="quote" id="q-335170807d" data-kw="">
<blockquote><p>Reply to Objection 3: …Yet we must bear in mind that not every individual in the genus of substance, even in rational nature, is a person, but that alone which exists by itself, and not that which exists in some more perfect thing. Hence the hand of Socrates, although it is a kind of individual, is not a person, because it does not exist by itself, but in something more perfect, viz. in the whole [of Socates, who has a suppositum]. And hence, too, this is signified by a ‘person’ being defined as ‘an individual substance,’ for the hand is not a complete substance, but part of a substance. Therefore, although this human nature is a kind of individual in the genus of substance, it has not its own personality, because it does not exist separately, but in something more perfect, viz. in the Person of the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 3</cite>, question 2, ‘Of the Mode of Union of the Word Incarnate’ | article 2, ‘Whether the union of the Incarnate Word took place in the Person?’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

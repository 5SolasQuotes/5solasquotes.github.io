<main class="wrap"><figure class="quote" id="q-82dcf6a70a" data-kw="Spirit personality agent">
<blockquote><p>He is an intelligent, voluntary, divine agent; he knoweth, he worketh as he will: which things, if, in their frequent repetition, they are not sufficient to evince an intelligent agent, a personal subsistence, that hath being, life, and will, we must confess that the Scripture was written on purpose to lead us into mistakes and misapprehensions of what we are, under penalty of eternal ruin, rightly to apprehend and believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Declaration and Vindication of the Doctrine of the Trinity</cite>, Of the Holy Ghost</span></figcaption>

</figure><figure class="quote" id="q-eedfe4cad5" data-kw="Son generation">
<blockquote><p>Therefore, Scripture considers three persons in God, who are one God. The Father is indeed the source and principle of divinity, the Son is the Word and Wisdom of the Father, begotten from eternity and without beginning in time, and the Holy Spirit is the divine power proceeding from the Father and the Son.</p></blockquote>

</figure><figure class="quote" id="q-67d7d97470" data-kw="">
<blockquote><p>It is the special office of the Spirit to convince the world of sin; to reveal Christ, to regenerate the soul, to lead men to the exercise of faith and repentance; to dwell in those whom He thus renews, as a principle of a new and divine life. By this indwelling of the Spirit, believers are united to Christ, and to one another, so that they form one body. This is the foundation of the communion of saints, making them one in faith, one in love, one in their inward life, and one in their hopes and final destiny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, pt. 1, ch. 8, “The Holy Spirit”</span></figcaption>

</figure><figure class="quote" id="q-fdb18aed36" data-kw="Filioque from Son">
<blockquote><p>Although the Greeks ought not to have been charged with heresy on account of their opinion … still the opinion of the Latins may be properly retained as more agreeable to the words of Scripture and the truer. (1) The Holy Spirit is sent from the Son as well as from the Father (Jn. 16:7). He therefore ought to proceed from him because he cannot be sent by the Son unless he proceeds from him. (2) He is called the Spirit of the Son as well as the Father (Gal. 4:6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.31.5</span></figcaption>

<blockquote><p>I will restore your judges as at the first, and your counsellors as at the beginning.” (Isaiah 1:26)

First, of the Person promising, I will restore; In which observe, how in promising to give Judges and Counsellors, he owns this order of Magistracy as lawful, yea, claims it as his Ordinance. Whence note. Magistracy is an Order and Office, which God himself sets up, yea, which he will have up in his Church, when in its best purity, as here he speaks of a time of more Reformation then ordinary. In that time he will restore.

Here is Divinity stamped upon the face of it. ‘Tis called indeed an Ordinance of man, 1 Pet. 2.13., not as if it were man’s invention: for all Powers are of God, but because ’tis discharged by men, and intended for man’s good. And truly it is so distasteful to the ungodly world, because it lays their lusts in chains, and so torments them before their time, that if God had not been in this bush (so oft on fire) it had been consumed before this. There has been old tugging to pluck this plant up, but being of God’s planting, it stands too sure for man’s hand to root up.

We may use the same Argument to prove the Divinity of Magistracy, which sometime we do the Divinity of Scripture, viz. the strange preservation of it in all the revolutions and changes that have come over the head of times, by wars, and the confusions that accompany them. Some have indeed thrown off their Governors, but never could a Government, as soon almost as one is off, another is in the saddle; yea, so connatural it is to the principles and notions of man’s mind, that a Government is found, where no Scripture is found to teach it.

[Use 1] First, then let us bless God for a Government, as though it should be none of the best. It is a very bad Government indeed, that is worse then none at all. Where there is a Magistracy some may be opprest and wronged under it, but none can be righted where there is none. If might be right, then right will be wrong, and better poor people should sit under a scratching bramble, then have no hedge at all to shelter them from wind and weather, storms I mean of popular fury.

The Persians had a custom, that when their Prince died, some days (five as I remember) of misrule, were indulged the people, in which they might do what they would without control, that by the rapines and outrages, which might well be thought would be committed therein, they might be brought in love the more with the Person and Government of their succeeding Prince. It is a sad way I confesse, but a sure one, to know the happinesse of a Government, by experimenting the confusion of an Anarchy.</p></blockquote>

<blockquote><p>Nor is it of importance to inquire curiously at what time the soul was united to the body, the Logos (Logos) to the flesh. It is enough for us to believe that the human nature from the time it began to be never existed apart from the Logos (Logo), but was assumed by and hypostatically united to him. And if the soul could not be poured into the body unless already organized and completely formed (a point on which physicians are not agreed among themselves), it does not follow that the Logos (Logon) could not at once unite the flesh to himself, since his work could not be constrained either with the soul present or absent. Nor is it more absurd for the body of Christ (not as yet animated) to be united to the Logos (Logo), then for the same (when lifeless in the sepulcher) to remain conjoined with the same (as theologians acknowledge was done in the death of Christ).</p></blockquote>

<blockquote><p>And as the Prince hath no more power then what is communicated from the community; so the people or community cannot give away from themselves the power of self-preservation. Because the same Commandment that faith, Thou shalt not kill: doth also say, Thou shalt preserve.

Precepts that forbid evil, do command the contrary good. Now the moral natural Law of God forbids a man to kill himself, and therefore commands him to preserve himself: and as by a positive act men cannot make a Law to kill themselves, no more can they not to preserve themselves; the one being as strongly commanded by the moral Law, and as deeply seated in Nature as the other. Secondly, because if the community should give away the power of self-preservation, the state should not be in a better but in a worser condition then before.

The King and Prince is taken into Office for the good of the people, therefore called Pater patriae, &amp; Pastor gregis: not because he may arbitrarily rule in the Common wealth as a Father doth in his family; but because of his tender care that he is to have over his people; and that the people might live more secure and peaceably in all godliness and honesty: But if the community should give such a trust to any one that they might not at all defend themselves beyond his actual appointment, they should be infinitely in a worser condition then before, because before such trust they should be freemen; but after the trust they should be slaves, unless it pleases the King through his own gracious condescension to let them be free still: for what is a slave but such a one who is so absolutely at the power of another’s command, that he may be spoiled, or sold, or put under the Galleys, and there beaten daily, having no power to make any resistance or self-defence.

Thirdly, it is agreeable to the Law of Nations and Reason, that no inferior Court can undo what a superior Court hath done, As where an estate is settled upon children by Act of Parliament, no inferior Court of Justice can cut off the intayle. Now self-preservation is enacted in the Court of Nature, as he that hath read but Magirus unbound, I mean common natural principles, will grant, and therefore no act of a community can cut off this intayle from their posterity, or make such a deed of Conveyance whereby themselves and their children should be spoiled of self-preservation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bridge.html">William Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The truth of the times vindicated whereby the lawfulness of Parliamentary proceedings in taking up of arms, is justified, Doctor Ferne’s reply answered, and the case in question more fully resolved</cite>, (London: Ben. Allen, 1643), p. 14.</span></figcaption>

— William Bridge, The truth of the times vindicated whereby the lawfulness of Parliamentary proceedings in taking up of arms, is justified, Doctor Ferne’s reply answered, and the case in question more fully resolved, (London: Ben. Allen, 1643), p. 14.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+as+the+Prince+hath+no+more+power+then+what+is+communicated+from+the+community%3B+so+the+people+or+community+cannot+give+away+from+themselves+the+power+of+self-preservation.+Because+the+same+Commandment+that+faith%2C+Thou+shalt+not+kill%3A+doth+also+say%2C+Thou+shalt+preserve.%0A%0APrecepts+that+forbid+evil%2C+do+command+the+contrary+good.+Now+the+moral+natural+Law+of+God+forbids+a+man+to+kill+himself%2C+and+therefore+commands+him+to+preserve+himself%3A+and+as+by+a+positive+act+men+cannot+make+a+Law+to+kill+themselves%2C+no+more+can+they+not+to+preserve+themselves%3B+the+one+being+as+strongly+commanded+by+the+moral+Law%2C+and+as+deeply+seated+in+Nature+as+the+other.+Secondly%2C+because+if+the+community+should+give+away+the+power+of+self-preservation%2C+the+state+should+not+be+in+a+better+but+in+a+worser+condition+then+before.%0A%0AThe+King+and+Prince+is+taken+into+Office+for+the+good+of+the+people%2C+therefore+called+Pater+patriae%2C+%26+Pastor+gregis%3A+not+because+he+may+arbitrarily+rule+in+the+Common+wealth+as+a+Father+doth+in+his+family%3B+but+because+of+his+tender+care+that+he+is+to+have+over+his+people%3B+and+that+the+people+might+live+more+secure+and+peaceably+in+all+godliness+and+honesty%3A+But+if+the+community+should+give+such+a+trust+to+any+one+that+they+might+not+at+all+defend+themselves+beyond+his+actual+appointment%2C+they+should+be+infinitely+in+a+worser+condition+then+before%2C+because+before+such+trust+they+should+be+freemen%3B+but+after+the+trust+they+should+be+slaves%2C+unless+it+pleases+the+King+through+his+own+gracious+condescension+to+let+them+be+free+still%3A+for+what+is+a+slave+but+such+a+one+who+is+so+absolutely+at+the+power+of+another%E2%80%99s+command%2C+that+he+may+be+spoiled%2C+or+sold%2C+or+put+under+the+Galleys%2C+and+there+beaten+daily%2C+having+no+power+to+make+any+resistance+or+self-defence.%0A%0AThirdly%2C+it+is+agreeable+to+the+Law+of+Nations+and+Reason%2C+that+no+inferior+Court+can+undo+what+a+superior+Court+hath+done%2C+As+where+an+estate+is+settled+upon+children+by+Act+of+Parliament%2C+no+inferior+Court+of+Justice+can+cut+off+the+intayle.+Now+self-preservation+is+enacted+in+the+Court+of+Nature%2C+as+he+that+hath+read+but+Magirus+unbound%2C+I+mean+common+natural+principles%2C+will+grant%2C+and+therefore+no+act+of+a+community+can+cut+off+this+intayle+from+their+posterity%2C+or+make+such+a+deed+of+Conveyance+whereby+themselves+and+their+children+should+be+spoiled+of+self-preservation.%E2%80%9D%0A%0A%E2%80%94+William+Bridge%2C+The+truth+of+the+times+vindicated+whereby+the+lawfulness+of+Parliamentary+proceedings+in+taking+up+of+arms%2C+is+justified%2C+Doctor+Ferne%E2%80%99s+reply+answered%2C+and+the+case+in+question+more+fully+resolved%2C+%28London%3A+Ben.+Allen%2C+1643%29%2C+p.+14.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F387567a70d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/387567a70d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/01/04/william-bridge-on-resistance-to-tyranny-and-the-law-of-self-preservation/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>[T]he law, Deut. 13. 6, 7, 8, 9. concerning the stoning and killing of him, who shall secretly entice people, saying, Let us go after other gods. If it be said, that this law did bind the Jews only, and is not moral nor perpetual. I answer, Jacobus Acontius, though he be of another opinion concerning this question then I am, yet he candidly and freely confesseth, that he seeth nothing in that law, which doth not belong to the New Testament, as well as the Old; for saith he, the reason and ground of the law, the use and end of it, is moral and perpetual, ver. 11. All Israel shall hear and fear, and shall doe no more any such wickedness, as this is among you.

But yet, saith Acontius, this law doth not concern Heretics, who believe and teach errors concerning the true God or his worship; but only Apostates who fall away to other gods: In this I shall not much contend with him; only thus far, if Apostates are to be stoned and killed according to that law, then surely seducing Heretics are also to receive their measure and proportion of punishment; The moral equity of the law requireth thus much at least, that if we compare Heresy and Apostasy together, look how much less the evil of sin is in Heresy, so much and no more is to be remitted of the evil of punishment, especially the danger of contagion and seducement, being as much or rather more in Heresy then in Apostasy; yea, that which is called Heresy being oftentimes a real following after other gods.</p></blockquote>

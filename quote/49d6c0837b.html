<main class="wrap"><figure class="quote" id="q-49d6c0837b" data-kw="">
<blockquote><p>II. Among the ancients, it appears that the universality of redemption was contended for by the Pelagians and Semipelagians. Hence Prosper [of Aquitaine, c. 390 – c. 455 AD] (concerning the remains of the Pelagian heresy) says, ‘This is their definition and profession that Christ died for the whole human race and that no one is excluded from the redemption effected by his blood’ (Letter to Augustine 6 [ACW 32:43; PL 33.1005]). And among the damnable errors which they boasted of having found in Augustine was this also: ‘The Savior was not crucified for the redemption of the whole world.’ Faustus (Rhegiensis) [a semi-pelagian prelate, d. c. 485 A.D.] says, ‘They wander far from the path of piety who say that the Savior did not die for all’ (De Gratia Dei et Libero Arbitrio 1.4 [PL 58.789])</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 14th Topic, ‘The Mediatorial Office of Christ’, Question 14, p. 455</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-947bf1611f" data-kw="">
<blockquote><p>Thirdly, howsoever an absolution shall be completed at the Day of Judgment, yet our justification shall not abide in such a way as it is in this life. Now our justification is by pardon of sin, and a righteousness without us imputed to us, which is instrumentally applied by faith; but this way shall then cease, for having perfect righteousness inherent in ourselves, we shall need no covering. It is true, the glory and honour of all this will redound upon Christ, and He shall not be the less glorified because He has then brought us to the full end of all his sufferings. I know some may doubt whether any righteousness but that which is infinite can please God, and therefore, as some think, the angels were accepted of God through Christ, though perfect; so it may be of the saints in heaven. But I see no ground for this. This seems to be undoubted, that the way of justification by faith in Christ arises because of our imperfection and sinfulness remaining in us, and therefore is justificatio viae, not patriae—’a justification’ of us ‘in our way,’ not when we come to ‘our home’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, (London: Miller, 1651), Lecture 29, on Acts 3:19, p. 258</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

eformedbooksonline.com/the-extent-of-christs-mediatorial-kingdom-2/#:~:text=Thirdly%2C%20howsoever%20an%20absolution%20shall%20be,when%20we%20come%20to%20%E2%80%98our%20home&amp;text=Thirdly%2C%20howsoever%20an%20absolution%20shall%20be%20completed%20at&amp;text=way%2C%E2%80%99%20not%20when%20we%20come%20to%20%E2%80%98our%20home" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1b869e136d" data-kw="">
<blockquote><p>Universal redemption must be denied in the very sense of Calvinists themselves [New Lights?], whether predestination is acknowledged or no, if we acknowledge that Christ knows all things. For if Christ certainly knows all things to come, he certainly knew, when he died, that there were such and such men that would never be the better for his death. And therefore, it was impossible that he should die with an intent to make them (particular persons) happy. For it is a right-down contradiction [to say that] he died with an intent to make them happy, when at the same time he knew they would not be happy-Predestination or no predestination, it is all one for that. This is all that Calvinists mean when they say that Christ did not die for all, that he did not die intending and designing that such and such particular persons should be the better for it; and that is evident to a demonstration. Now Arminians, when [they] say that Christ died for all, cannot mean, with any sense, that he died for all any otherwise than to give all an opportunity to be saved; and that, Calvinists themselves never denied. He did die for all in this sense; ’tis past all contradiction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The “Miscellanies”</cite>, (1722), WJE Online vol. 13, t. ‘Universal Redemption’, p. 174</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-7d8442c03d" data-kw="intention elect only">
<blockquote><p>Did Christ die for each and every man universally or only for the elect? The former we deny; the latter we affirm. The question hinges upon this—not what is the nature and power of Christ’s death in itself, but what was the purpose of the Father in appointing him and the intention of Christ in undergoing it.</p></blockquote>

</figure><figure class="quote" id="q-f8f191fe0f" data-kw="">
<blockquote><p>All the Reformed agree in this, that there is such a great value and price in the death of Christ, from the infinite dignity of the person, that it could be sufficient for saving each and every person, but because neither the Father nor the Son willed that death to be destined for redeeming each and every person, it cannot be fittingly said that Christ died for each and every person…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 4, bk. 5, ch. 12, section 27, p. 427</span></figcaption>

<main class="wrap"><figure class="quote" id="q-b1fea260f6" data-kw="">
<blockquote><p>XVII. OF THE USE AND ABROGATING OF GOD’S LAW.

1 The ceremonial and judicial laws of Moses in respect of obedience due to them, are abrogated by the coming of the Messiah.

2 The moral law is abrogated in respect of the curse, not in respect of obedience due to it.

3 Uses of the ceremonial and judicial laws of Moses, partly were, &amp; partly are these. First a schooling or leading us unto Christ, that is, a signifying, or shadowing of spiritual and heavenly things in the kingdom of Christ.

4 Secondly, a distinction of God’s people from other nations.

5 Thirdly, an execution or putting in practise the law moral, which requireth a limitation of many circumstances, both in church &amp; commonweal.

6 Fourthly, testifying of our obedience toward God.

7 Fiftly, the sealing of God’s covenant by ceremonies, which were sacramental signs.

8 Sixtly, a preservation of the Mosaical policy, till Christ’s coming, by judicial laws, which were the sinews and form of the common weal.

9 Lastly, a confirmation of the new testament, by comparing the fulfilling of all things with the types.

10 The moral law, in time of our innocency, had other uses, then now it hath, as, a perfect conforming of the life of man to GOD’S will, a good conscience, and sure confidence in God’s love &amp; favour.

11 In this our corrupt nature these uses it hath first a maintaining of discipline within and without the church.

12 Secondly, an acknowledgement of our sins, which two uses pertain unto all men, and are that pedagogue or schooling of the law, whereby we are led unto Christ.

13 Thirdly, an information to the true worship of God, which use is peculiar to the renewed or regetate [sic].

14 And these are the principal uses; besides which there are also some others as namely, a testimony that there is a God, &amp; what manner of God he is.

15 A note of the church, which is distinguished by integrity &amp; purity of the law from all other sects.

16 A testimony of that excellency of man’s nature which was before the fall, &amp; which is restored unto us by Christ.

17 A testimony of eternal life, wherein the law shall be fulfilled, seeing in this life it is not fulfilled, and God made it not that it should never attain its proper and principal end.</p></blockquote>

<blockquote><p>It is hard to resist the conclusion that the inspired writers meant to convey the idea that the legislation at Sinai might be resolved into several codes. We believe that there were three, all differing in their predestined term of endurance. The ceremonial law is universally admitted to have fulfilled its function when Christ made his atoning sacrifice. The ordinary civil and criminal code of the Jews required to be adapted, like the corresponding laws in other countries, to the exact state of intellectual and moral development which the Hebrew nation had reached at the time of its promulgation, and necessarily became, in some particulars, antiquated whenever they rose above that position.

It is only in regard to the moral law, as summed up in the decalogue, that any dispute exists. It in several respects stood on a different footing from the remaining parts of the Mosaic law. While the other precepts were given to the people through the instrumentality of Moses, it was proclaimed from the top of Sinai by the voice of Jehovah himself, amid lightning, and thunder, and tempest, and every accompaniment fitted to inspire awe. While the other precepts were committed to whatever materials were then used for writing on, skins of animals perhaps, and were preserved, no one knows where, the decalogue was traced by the finger of God on two tables of stone, cut doubtless from the enduring granite of the mountain peak, and then laid up in the ark of the covenant in the holiest part of the tabernacle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-hunter.html">Robert Hunter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Literature of the Sabbath Question in British and Foreign Evangelical Review</cite></span></figcaption>

<blockquote><p>Then the true state of the question is not [1.] whether the sword be a means of conversion of men to the true faith [which its not], nor 2. whether heathen by fire and sword are to be compelled to embrace the truth [they’re not], nor 3. whether violence without instruction and arguing from light of scriptures, should be used against false teachers [its not], nor 4. whether the Magistrate can punish the opinions of the mind, and strain internal liberty [it can’t]. But whether or not ought the godly and Christian prince [to] restrain and punish with the sword false teachers, publishers of heretical and pernicious doctrines, which may be proved by witness, and tends to the injuring of the souls of the people of God, in a Christian society, and are dishonorable to God, and contrary to sound doctrine; and so coerce men for external misdemeanors flowing from a practical conscience sinning against the second table, as well as from a speculative conscience (to borrow these terms here) when they profess and are ready to swear they perform these externals merely from and for conscience.</p></blockquote>

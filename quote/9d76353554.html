<main class="wrap"><figure class="quote" id="q-9d76353554" data-kw="">
<blockquote><p>§VIII. The external means are the Word (James 1:18, “Of his own will begat he us with the word of truth.” v. 21, “receive with meekness the engrafted word, which is able to save your souls.” 1 Pet. 1:23, “Being born again… by the word of God, which liveth.” Lk. 8:15; Gal. 3:2) and the sacraments (Jn. 3:5; Tit. 3:5; Gal. 3:27; Rom. 6:4; Lk. 22:20). The internal is faith (Gal. 5:6), hence in Acts 15:9, hearts are said to be purified by faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Sanctification’ trans. AI (Frankfurt: Zeitler, 1709), p. 3 Holtzfus (1659-1717) was a German, reformed professor of philosophy and theology at Frankfurt.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><figure class="quote" id="q-425a07252a" data-kw="">
<blockquote><p>Sanctification then may be described [as] The grace of God infused into the soul of a sinner, and purifying it by faith… Thirdly, both sanctification and justification are alike owing to faith as their immediate cause, next under God’s Spirit, as may be gathered from the prayer of Christ for his disciples: ‘Sanctify them through thy truth: thy word is truth,’ [Jn. 17:17] that is, the doctrine of Faith, received. To which faith, the effect of sanctification is ascribed by St. Peter in the Acts, whereby the hearts of the gentiles were purified or sanctified. (Acts 15:9 [‘And put no difference between us and them, purifying their hearts by faith.’])</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-scrivener.html">Matthew Scrivener</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Course of Divinity... (London: Roycroft, 1674), pt. 1, bk. 1, ch. 17</cite>, pp. 61-62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><figure class="quote" id="q-a1b0a92aaf" data-kw="">
<blockquote><p>Whether sanctification precede justification. Bishop [George] Downame in his appendix to the Covenant of Grace, does oppose my worthy tutor Mr. [William] Pemble for holding this opinion, but perhaps a distinction may solve all. As sanctification is taken for the act of the Holy Ghost working holiness into us, so it goes before faith and justification, so the apostle puts it before justifying, saying 1 Cor. 6:11, ‘But ye are sanctified, justified;’ but as it is taken for the exercise of holiness in regard of amendment of heart and life, so it follows justification in nature, but it is joined with it in time. The apostle Rom. 8:30, places vocation before justification, which vocation is the same thing with the first sanctification or regeneration. See Acts 26:18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity... (London, 1654), bk. 7, ch. 10, ‘Whether Faith Alone does Justify?’</cite>, p. 530</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

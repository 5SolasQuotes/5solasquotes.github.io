<blockquote><p>2. And as to the last edition of the Covenant of Grace by Christ [in the New Testament]: 1. The tenor of it extends to all; as is visible Mt. 28:19; Mk. 16:16; Jn. 3:16. 2. And Christ has made it the office of his ministers by his commission to promulgate and offer it to all. 3. And whereas providence concurs not to the universal execution, we must all confess, that Christ came not to put the world into a worse condition than He found them in. If He did any no good by his incarnation, He would do them no harm. Therefore they that never hear the Gospel, are still under the first edition of the Covenant made with Adam and Noah, so far as it is unaltered. I add that word [“so far as it is unaltered”], because, that so far as the promise was to give salvation by the Messiah hereafter to be incarnate, none is now bound to expect his future incarnation, because it is past. But the same benefits that were due to believers before Christs incarnation, are due since upon the true performance of so much of the condition as is still in force, and not repealed. … 4. And also, that more was required then, to be known particularly by the Jews that had the Scripture and tradition to acquaint them with the Messiah to come, than of the rest of the world, that had not those distinct discoveries, nor Abraham’s promises made known unto them: And how much Gen. 3:15 might cause them to understand, we may conjecture by the words. At least this much was required of all, that they believe that their sin deserves punishment and misery, and yet that God of his abundant mercy, by his wisdom securing his truth and justice, will pardon sin and grant salvation to all that truly believe and trust in that his wisdom and mercy, and repent of their sins, and unfeignedly give up themselves to God as their merciful Redeemer. Thus far we are agreed about the grace of the Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Catholic Theology… (1675), Preface</cite>, pp. 5-6</span></figcaption>

<blockquote><p>…for all argument they come at last to this,’By what authority doest thou these things; and who gave thee this authority?’ where the Lord answering for Himself, then, and for us now in the like case, most plainly and at length shows that, howsoever in the ordinary course of a constitute Church, a careful regard must be had to the ordinary calling, yet when (as sometime it falls) that the ordinary husband-men become murderers, and the ordinary builders become destroyers, there God extraordinarily stirs up men whose ministry proves itself to be from Heaven and not from men, even by this, that they come in the way of righteousness: and sinners are converted by them, that, so the Lord of the vineyard may report fruit thereof, even when the ordinary husbandmen rebel, and that the stone, rejected, even of the ordinary builders, may yet be made the head of the corner: which, howsoever it be marvelous in our eyes, yet it is the Lord his doing.</p></blockquote>

ine</a></div>

<blockquote><p>3. And He has described the persons that he will have to be the officers by their requisite qualifications [e.g. 1 Tim. 3]. All this is done in his laws already. 4. There is nothing therefore left to be done but to determine which are the individual persons that are fittest according to God’s description. This God Himself also will do, but has not tied himself to one way in doing it: In general, some sign of God’s will that this is the man must be had; At first in calling the apostles his own immediate nomination was the sign. Now the most notable sign is the most eminent unquestionable qualification of the person, which when God confers so notably or discernably, that man must be taken as chosen by God, and they that reject him do sin: These qualifications lie both in abilities, willingness, conveniency of habitation or other externals and interest in the people; and if God bow their minds to consent, there is the fuller signification of his will; yet lest any by intrusion should abuse the Church, God has made the pastors and overseers judges of men’s fitness, or the ordinary discerners of it, for the guidance of the Church in their consent.</p></blockquote>

<blockquote><p>XXXVI… For as to the laying on of hands, it cannot be considered as a sign. (a) It is not an element, but an action. (b) It is common with confirmation and many other things and was practiced even under the Old Testament. (c) It was not instituted by Christ by any command, but is a free ceremony, which we read indeed of having been employed, but not of having been instituted; what has been employed, however, ought not at once to be said to have been instituted. Thus the washing of feet and breathing upon the apostles were employed by Christ (Jn. 13:5; Jn. 20:22); yet they were not on that account instituted. (d) Imposition of hands does not pertain to all the orders [of Church office], but only to some.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Eclenctic Theology, vol. 3, Topic 19, Question 31, ‘The Five False Sacraments of the Romanists’, section 36, ‘Proof that the Orders [of Church Office] are not Sacraments’</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“XXXVI… For as to the laying on of hands, it cannot be considered as a sign. (a) It is not an element, but an action. (b) It is common with confirmation and many other things and was practiced even under the Old Testament. (c) It was not instituted by Christ by any command, but is a free ceremony, which we read indeed of having been employed, but not of having been instituted; what has been employed, however, ought not at once to be said to have been instituted. Thus the washing of feet and breathing upon the apostles were employed by Christ (Jn. 13:5; Jn. 20:22); yet they were not on that account instituted. (d) Imposition of hands does not pertain to all the orders [of Church office], but only to some.”

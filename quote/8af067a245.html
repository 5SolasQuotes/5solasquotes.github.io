<main class="wrap"><figure class="quote" id="q-8af067a245" data-kw="">
<blockquote><p>When the gospel was first recovered in its purity, there was no one who was not extremely fervent and dedicated both to the doctrine and to those who taught it. But now, how much coldness is there, how much boredom, how much neglect? This verse [Galatians 4:14] is typical of the fervor and dedication that people had toward the rediscovery of the pure gospel and toward those who taught it.

We are reminded by the example of the Galatians how easy it is to fall away from true doctrine and embrace what is false, how easy it is to fall into boredom and neglect when the gospel has been preached for some time, and how we must never put our trust in the mass of those who hear the gospel, because there are many who subscribe to the doctrine of the gospel for the wrong reasons and who neglect it for trivial reasons, or at least pay less attention to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/erasmus-sarcerius.html">Erasmus Sarcerius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolas Divi Pauli ad Galatas et Ephesios Annotationes</cite>, (Frankfurt, 1542). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 149.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ba5de452bc" data-kw="">
<blockquote><p>Adhere constantly, cordially, and honestly, to the covenanted principles of the church of Scotland, and to that testimony which hath been lifted up for them. I fear a generation is rising up, which will endeavour silently to let slip these matters, as if they were ashamed to hold them fast, or even to speak of them. May the Lord forbid, that any of you should ever enter into this confederacy against Jesus Christ and his cause! – This from a dying father and minister, and a witness for Christ.

JOHN BROWN</p></blockquote>

</figure><figure class="quote" id="q-06015b364f" data-kw="">
<blockquote><p>The Church may be corrupted many ways, in doctrine, ordinances, worship, etc. And there are degrees of this corruption; the doctrine in some remote points, the worship in some rituals of man’s invention or custom. How many Churches do we find thus corrupted, and yet no separation of Christ from the Jewish Church, nor any commandment to the godly of Corinth, etc. to separate. I must in such a case avoid the corruption, hold the communion—But if corruptions invade the fundamentals, the foundation of doctrine is destroyed, the worship is become idolatrous; and what is above all, if the Church impose such laws of her communion as there is a necessity of doing or approving things unlawful, in that case, ‘Come out of Babylon.’ The Churches of Protestants so separated from Rome.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Sacrament, p. 239 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’, p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

%20many,of%20Protestants%20so%20separated%20from%20Rome&amp;text=The%20Church%20may%20be%20corrupted%20many%20ways%2C%20in&amp;text=The%20Churches%20of%20Protestants%20so%20separated%20from%20Rome" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7126c0e937" data-kw="">
<blockquote><p>On the other hand, we must labour for humility, prudence, gentleness, meekness. A man may be very zealous and resolute, and yet very meek and merciful: Jesus Christ was a Lion and yet a Lamb also; in one place, He telleth them He cometh to send “fire on the earth:” and, in another place, rebuketh His disciples “for their fiery spirits.” There was the composition in Moses, and in Paul; and it is of great use, especially in this work of reformation.

I have not observed any disputes carried on with more bitterness in men’s writings, and with a more unsanctified heat of spirit, yea, and by godly men too, than in controversies about discipline, church government, ceremonies, and the like. Surely, to argue about government with such ungoverned passions, to argue for reformation with a spirit so unreformed, is very uncomely.

Let us be zealous, as Christ was, to cast out all, to extirpate and root out every plant His heavenly Father hath not planted; and yet let us do it in an orderly way, and with the Spirit of Christ, whose servants we are. “The servant of the Lord must not strive, but be gentle to all men, apt to teach, patient, in meekness instructing those that oppose.” We solemnly engage this day our utmost endeavours for reformation; let us remember this, that too much heat, as well as too much coldness, may harden men in their ways, and hinder reformation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Solemn League and Covenant. Exhortation at Westminster (1643) in James Kerr (ed.), The Covenants and the Covenanters: Covenants, Sermons, and Documents of the Covenanted Reformation</cite></span></figcaption>

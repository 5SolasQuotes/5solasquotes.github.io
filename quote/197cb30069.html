<main class="wrap"><figure class="quote" id="q-197cb30069" data-kw="">
<blockquote><p>VII. The power of free choice in the regenerate is yet weak, so that we have still need of the help of God, neither can we do all that we would.

But, because our regeneration is as it were only begun and not as yet perfect, so that whereas we were before wholly flesh, now we consist partly of the Spirit and partly of the flesh, which do continually fight the one against the other, that what good things we would, them we cannot perform; but in our spirit we serve the law of God, but in our flesh the law of sin.

Therefore we believe that which we also know by experience in the regenerate, that much bondage still remaineth, much darkness in the soul and perverseness in the heart and weakness in all the faculties of mind and body, that we have still need of new help from God and new grace, whereby both our minds may be more and more enlightened and our wills made better and better, and our strength to do good more increased and perfected.

And therefore, while we remain in this flesh, our free choice is never truly and merely free, that is, never able enough of it self to avoid ill and do good, especially sith the event of all things is not in our power, but in the hand of God; and that it must needs be that all those things come to pass, not which we think, but whatsoever his hand and purpose hath decreed shall be done.</p></blockquote>

<blockquote><p>§VIII. The external means are the Word (James 1:18, “Of his own will begat he us with the word of truth.” v. 21, “receive with meekness the engrafted word, which is able to save your souls.” 1 Pet. 1:23, “Being born again… by the word of God, which liveth.” Lk. 8:15; Gal. 3:2) and the sacraments (Jn. 3:5; Tit. 3:5; Gal. 3:27; Rom. 6:4; Lk. 22:20). The internal is faith (Gal. 5:6), hence in Acts 15:9, hearts are said to be purified by faith.</p></blockquote>

</figure><figure class="quote" id="q-f2cdf0ebfd" data-kw="">
<blockquote><p>But here the Apostle seems to comprehend a twofold holiness of those that are reconciled; one which consists in the remission of sins, and the imputation of Christ’s righteousness; the other which consists in our renovation, and in the fruits of holiness. For in both ways Christ presents all his people holy before God.

They are now strictly saints by imputation, because they are regarded as one mystical person with Christ their head; but as to inherent holiness, that is not effected instantly, but increases daily, and acquires not the summit of its perfection before we are translated from this life to the life of glory.

Yet we maintain that this incipient sanctification is real, although not complete. And therefore the Apostle adds these words, before God. For he is said to be just and holy before God, who is so in reality, not in appearance only; in rectitude of intention, not in fictitious imitation, as Lyra not inaptly remarks on these words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), 1: 258.</span></figcaption>

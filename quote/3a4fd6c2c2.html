<main class="wrap"><figure class="quote" id="q-3a4fd6c2c2" data-kw="">
<blockquote><p>…but as for that which no hypocrite or unsound professor can attain to, a broken, hungry, self-deined heart, that Christ and his grace might enter and dwell there, oh, how harsh is it?… what shall they look for that despise the grace of the Gospel, and that offer which God has honored by so many miracles, and such abundance of sermons, and the powerful ministry of so many preachers? Beware of refusing such salvation, as being a more spiritual wickedness than any moral offense. Thirdly, its reproof to all cavillers that descant upon this free, plain and simple-hearted offer of God. Being urged to receive it, they answer so they would if they knew themselves elected. But (say they) we are afraid God means it us not. If we be chosen, we are sure to be called to believe it: if not, none of their preachers can give it us. It must be God (say they) and not man that must work our hearts and draw us. But, oh vain jangler, tell me, has not God revealed his will in his offer? Dost thou know his secrets? Is not his offer ingenuous? Say not in thine heart, ‘Who shall go up to Heaven or descend, etc? Lo, the Word is in thy mouth, it is neare thee.’ (Dt. 29:19) If Jeremiah in the dungeon had told Ebedmelech [Jer. 38] he knew not whether he meant to help him out or no, and so have refused to come out, had he not justly been left there still? So, when the Lord lets down the ladder of his offer, into thy dungeon, casts thee his cords and rags to put under thy armholes, that He may draw thee out, dost thou cavil and say, ‘Lord, I know not whether thou meanst me well or no; perhaps Thou wilt pull me out a little way, and then let me fall back again; perhaps I am not elected!’ Is not this a woeful dishonor to the simplicity of the offer? Was he ever tied at all to offer it? and dost thou distrust his ingenuous meaning in it? Thy blood be upon thy own head, in that thou choosest rather to smite the Lord to thy own destruction than to set thy foot in his ladder and put on his cords, that thou mightst come out! The way for thee is first to step upward that thou mayst come to the top than to leap to the top at first, to break thy neck backward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rogers.html">Daniel Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Catechism</cite>, ... (London: Norton, 1632), pt. 2, 4th Article, pp. 182-83</span></figcaption>

<blockquote><p>Hereby also the Lord allures the Laodiceans to repentance, showing that every time is meet for conversion and that God is evermore ready to receive sinners, and provokes them always that they should amend and live. And this matter he expounds in an allegorical and goodly speech taken out of the fifth chapter of the book of Canticles. For he fains the Lord to stand at the door and knock, yea and to promise to them that open the greatest familiarity and joys unspeakeable. First, therefore is declared the benevolence of God towards sinners and his most ready will always to receive the same, yea and his infinite study to move men to repentance [Rom. 2:4] that they might live. For the Lord stands at the door and knocks. The word of ‘standing’ does signify that God is always prepared, always watches over our salvation. For He sits not still, nor lies not on the one side like a sluggard: He stands busily to his work. And ‘I stand’ says He, not ‘I stood’, or ‘shall stand’: But ‘I stand’ evermore ready, evermore loving and gentle. What does He? He knocks, and that indeed at the door, desiring to be let in. For like as he that knocks at the door seriously covets to be let in: so God desires earnestly to be of us received. And God uses sundry kinds of knocking. For He warns and excites with his Word by the prophets, again by signs and wonders, and also by sundry chances and movings. These things may be seen in the city of Jerusalem. He sends to them his prophets and apostles. He shows diverse wonders. He brings on them sorrowful chances that they might admonish them: Such as are reported, Lk. 13, of the Galileans, and of those whom the tower of Siloh had overwhelmed. We may see the like at this day how the Lord knocks. Therefore He said truly, ‘Jerusalem, Jerusalem, etc.’ Mt. 23. These are doubtless the parts and doings of God which will not that a sinner should die, but rather convert and live. Then must we see what is required of us, verily that we should hear the knocking and noise of the Knocker, and that also we open and receive such as desire to come in. Here are they confuted which speak of man as though he were a block and image, ‘I know not what manner of drawing,’ sayng: ‘It is neither in the runner, nor in the willer, etc.’ Certain [persons] altogether abstain from well-doing, saying, ‘If I be chosen, it is enough.’ But the Scripture requires everywhere hearing and obedience. We know that the elect are only saved, and that the elect in Christ: In Christ to be they that believe: That faith is of hearing, hearing by the Word of God. Therefore says the prophet, ‘This day if you heare his voice. etc.’ [Ps. 95] This same is recited of the apostle, Heb. 4. The apostle also, 2 Tim. 2, ‘In a great house there be not only vessels of gold, but of earth also. If any purge himself, etc.’ And therefore the Lord says, ‘I knock’: It shall be thy part not to despise Him that knocks, but to open unto Him. And he recites indeed two things, [1] to hear, which both in the 8th and 9th of John is required of the children of God and of the true sheep: And [2] to open, that is to receive the Lord, or believe, to obey, and to frame themselves after the will of God and to do penance. Notwithstanding we must here beware, that we think not that man has power of himself to receive the Lord. The Lord illumines his elect, and by Him we can do all things, without whom we can do nothing. Other places must be conferred with this as Jn. 15; 2 Cor. 3; Phil. 2. They therefore that open, do open by the grace of God. They that open not being wrapped in their sins, through their own fault open not, and not through any fault of God. Let us hear moreover what the Lord promises to them that open, that is to say, to such as receive Christ with true faith. The Lord promises to them two things chiefly. First, ‘I will go into him’, says He. The scripture signifies that Christ dwells everywhere through faith in the hearts of the faithful and with a most straight knot to be joined unto them… And in the 14th chapter [of John] He says, ‘He that loves Me, will keep my Word: And my Father and I will come unto him, and will make abode with him.’ St. Paul says that he lives not now, but that Christ lives in him. [Gal. 2:20] The same affirms that Christ through faith dwells in the hearts of the faithful. And so the Lord enters the hearts of them that let Him in. Not the least part of felicity consists in this conjunction. For to be united with God is blessedness, which begins here, and is made perfect in another life. And therefore in the second place the Lord says: ‘And I will sup with him, and he with Me.’ Whereby he notes not only again a most dear friendship and familiarity (for the table is consecrated to amity) but rather the fruition of eternal glory. For by the supper are signified the joys, celestial, greatest and unspeakeable, which after their souls the godly receive immediately after death: but more fully in the end of times when the bodies shall arise again. Therefore is it not applied to a dinner, but to a supper, as it is also in the 14th of Luke. Then if we receive Christ, we shall have Him dwelling with us continually whilst we live in this world. And in the world to come we shall have the full fruition of all the joys celestial. These things be certain and true.</p></blockquote>

uired of us, verily that we should hear the knocking and noise of the Knocker, and that also we open and receive such as desire to come in. Here are they confuted which speak of man as though he were a block and image, ‘I know not what manner of drawing,’ sayng: ‘It is neither in the runner, nor in the willer, etc.’ Certain [persons] altogether abstain from well-doing, saying, ‘If I be chosen, it is enough.’ But the Scripture requires everywhere hearing and obedience. We know that the elect are only saved, and that the elect in Christ: In Christ to be they that believe: That faith is of hearing, hearing by the Word of God. Therefore says the prophet, ‘This day if you heare his voice. etc.’ [Ps. 95] This same is recited of the apostle, Heb. 4. The apostle also, 2 Tim. 2, ‘In a great house there be not only vessels of gold, but of earth also. If any purge himself, etc.’ And therefore the Lord says, ‘I knock’: It shall be thy part not to despise Him that knocks, but to open unto Him. And he recites indeed two things, [1] to hear, which both in the 8th and 9th of John is required of the children of God and of the true sheep: And [2] to open, that is to receive the Lord, or believe, to obey, and to frame themselves after the will of God and to do penance. Notwithstanding we must here beware, that we think not that man has power of himself to receive the Lord. The Lord illumines his elect, and by Him we can do all things, without whom we can do nothing. Other places must be conferred with this as Jn. 15; 2 Cor. 3; Phil. 2. They therefore that open, do open by the grace of God. They that open not being wrapped in their sins, through their own fault open not, and not through any fault of God. Let us hear moreover what the Lord promises to them that open, that is to say, to such as receive Christ with true faith. The Lord promises to them two things chiefly. First, ‘I will go into him’, says He. The scripture signifies that Christ dwells everywhere through faith in the hearts of the faithful and with a most straight knot to be joined unto them… And in the 14th chapter [of John] He says, ‘He that loves Me, will keep my Word: And my Father and I will come unto him, and will make abode with him.’ St. Paul says that he lives not now, but that Christ lives in him. [Gal. 2:20] The same affirms that Christ through faith dwells in the hearts of the faithful. And so the Lord enters the hearts of them that let Him in. Not the least part of felicity consists in this conjunction. For to be united with God is blessedness, which begins here, and is made perfect in another life. And therefore in the second place the Lord says: ‘And I will sup with him, and he with Me.’ Whereby he notes not only again a most dear friendship and familiarity (for the table is consecrated to amity) but rather the fruition of eternal glory. For by the supper are signified the joys, celestial, greatest and unspeakeable, which after their souls the godly receive immediately after death: but more fully in the end of times when the bodies shall arise again. Therefore is it not applied to a dinner, but to a supper, as it is also in the 14th of Luke. Then if we receive Christ, we shall have Him dwelling with us continually whilst we live in this world. And in the world to come we shall have the full fruition of all the joys celestial. These things be certain and true.”

<main class="wrap"><figure class="quote" id="q-0bbb181b61" data-kw="">
<blockquote><p>I. The acknowledgment of the Scriptures of the Old and New Testaments to be the Word of God, and the only infallible rule of faith and practice.

II. The acknowledgment of the Westminster Confession of Faith, and Catechisms, Larger and Shorter, to be founded upon, and agreeable to, the Word of God.

III. The owning of the Divine right and original of the Presbyterian form of Church Government.

IV. The acknowledgment of the perpetual obligation of our Covenants, National and Solemn League; and, consistently with this, the obligation arising from the renovation of these Covenants by the Reformed Presbyterian Church.

V. The owning of the Scriptural testimonies and earnest contendings of Christ’s faithful witnesses, whether those who suffered under the last persecution, or such as have succeeded them in maintaining the same cause, and especially the Testimony of the Reformed Presbyterian Church.

VI. Practically adorning the doctrine of God our Saviour, by walking in all His commandments and ordinances blamelessly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reformed-presbyterian-church-of-ireland.html">Reformed Presbyterian Church of Ireland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Testimony of the Reformed Presbyterian Church of Ireland. Part I. Doctrinal and practical (1901; Belfast, 1912), iv.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-83af03d9b1" data-kw="">
<blockquote><p>V. That what God forbids, is at no time to be done; what He commands, is always our duty, and yet every particular duty is not to be done at all times. Thus sin is, under no pretense, to be committed. Accordingly, Moses, when he was in a prosperous condition in Pharaoh’s court, though he might have pretended that his greatness and the advantages which Israel might have expected from it, would be an excuse for his continuing to enjoy the pleasures of sin there; yet he was sensible that these considerations would not exempt him from guilt. Hence, ‘he forsook Egypt, and chose rather to suffer affliction with the people of God, than to enjoy the pleasures of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, … (New York: Robert Carter, 1855), vol. 2, p. 313</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-9a918b2c43" data-kw="">
<blockquote><p>Aquinas affirms that the celebration of the Eucharist is called the immolation of Christ for two reasons: because it is, ‘a kind of representative image of the passion of Christ,’ and because the, ‘effects of the passion of Christ’ are received in it. This no one on our side contradicts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Adversus axioma catholicum in Nicholas Thompson, Eucharistic Sacrifice Pre</cite>, (Brill, 2005), p. 185</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>
<div class="actions"><button class="copy" data-copy="“Aquinas affirms that the celebration of the Eucharist is called the immolation of Christ for two reasons: because it is, ‘a kind of representative image of the passion of Christ,’ and because the, ‘effects of the passion of Christ’ are received in it. This no one on our side contradicts.”

</figure><figure class="quote" id="q-dee51bbe6b" data-kw="">
<blockquote><p>But I know for certain that Your Excellency has such great expertise in this controversy that it would be difficult for anyone to find its equal in any other person. Indeed, there is not one of the Fathers that you have not carefully examined. There is no book by an author old or new in which with these eyes of mine I have not seen annotations in your own hand about all that pertains to this whole disputation. You yourself with intense labour have digested under the main headings the councils, canons, and papal decrees which pertain to this question so that, unless I had witnessed these things with my own eyes, I would never have given a ready belief to other people who related this.

You have committed this sort of work, devotion, and labour not just to this question of the Eucharist; I have observed that you have also done the same regarding almost all other doctrines most subject to controversy in this age of ours. For this reason I need not have shown this little book of mine to you so that you might learn something new from it (since I rather have drawn the greater part of my teaching from your labours …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on the Sacrament of the Eucharist</cite>, (1549), trans. and ed. Joseph C. McLelland in The Peter Martyr Library: Volume 7 (Kirksville MO: Sixteenth Century Essays &amp; Studies, 2000), dedication, p. 7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-ba8921f8dc" data-kw="">

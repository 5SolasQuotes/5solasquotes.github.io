<main class="wrap"><figure class="quote" id="q-b75d1598ae" data-kw="">
<blockquote><p>To this add, in that the ancient bishops in the celebration of the Lord’s Supper did put on another garment than that they usually did wear, appertains nothing to the alteration of the Lord’s Supper: For Christ commanded not that we should celebrate his Supper with our usual garments, as He did, but only that we should do that which He did Himself. The like may be affirmed of sundry other things, as well in baptism as in the Supper of the Lord. The sum of all is this: Such things as are added, but yet as matters indifferent, for order, for decency and to edification, such matters do not change the substance of the sacraments, and therefore alter not the worship. But such things as are taken from the institution of Christ, or else are added as necessary, and appertaining to the substance, those things do corrupt the institution of the Lord, and so do establish another kind of worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Redemption, ch. 19, fol. 447, as quoted in John Sprint, Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1618), ‘Reformed Practices’, ‘Practice’, pp. 177-79</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2eee176501" data-kw="">
<blockquote><p>A. 3: And God’s prohibition, Deut. 12, of adding or diminishing, is not washed away so easily as your words would make men believe. You say, It reaches to the whole duty of man, and government of the Church, etc. Answer: There be some things in the duty of man and church-matters that God has left to man: To do those is no addition to God’s laws: But to do the like work that God by his Law has done, which He never left to man, seems to me the addition there forbidden: e.g. If men had made another Tabernacle, another ark of the Covenant, another holy vestment for Aaron, another sacrament like circumcision or the Passover, He that so reproved their worshiping in the high places would have reproved these.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Baxter held</cite>, (per Joseph Bingham, Works, 10.124) that ministerial ‘ornaments’ are not unlawful in themselves, but rather that they should not be imposed by authority on ministers, with such dissenting ministers being deposed for this. Here are some excerpts from Baxter: | The Defence of the Nonconformists’ Plea for Peace (1680), Ch. 18, pp. 41-42</span></figcaption>

<blockquote><p>§9. Of Wearing the Surplice As touching the surplice, the wearing of a garment of this or that color, or of this or that form or shape in divine worship, is neither commanded nor forbidden of God. But though as to its material it may be indifferent, yet as to its formal state, it may not be also. If the surplice be made a holy garment, as the priestly garments under the law, if it be used to make him that wears it more holy, and the service more acceptable for obtaining divine grace, it is superstitious. If it be made a symbol of sanctity, it may raise a scruple. But a distinctive habit [garment] of a minister, whether used as his ordinary garb, or only in sacred administrations, I cannot see to be superstitious or forbidden. But a habit that is not superstitious may be too gaudy or too theatrical. What is the formal state or reason of the surplice is to be judged by the authoritatively declared meaning of those that enjoin it, touching its end and use. But whatsoever the nature and reason of this garment be, I cannot approve the enforcing of it upon such ministers and in such congregations to whom by reason of invincible prejudice, it is either odious or ridiculous, yea though their prejudice be supposed culpable. Wise rulers give way to the immovable averseness of inferiors in things unnecessary and of no great moment, though of good intention. And as I should be loath to wear a fool’s coat in divine service upon the command of a superior, so I should be loath to appear in a congregation in a habit which I knew would be to them as ridiculous as a fool’s coat, though it were their great folly so to think.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Divine Worship, pt. 3, sect. 9 in Remains (London: Parkhurst, 1684), pp. 219-20</span></figcaption>

</figure><figure class="quote" id="q-d5c4fbf3c4" data-kw="">
<blockquote><p>As for those who allege some conveniency in the ceremonies, they say more than can abide the proof of reason, which the induction [enumeration] of some particulars shall demonstrate. Dr. [Thomas] Morton (Particular Defense, ch. 1, sect. 1 [1618]) alleges for the surplice that the difference of outward garments cannot but be held convenient for the distinguishing of ministers from laics [laity] in the discharge of their function. Answer: This conveniency is as well seen to without the surplice. If a man having a black gown upon him be seen exercising the function of a minister, it is very strange if any man think it not sufficiently distinguished from laics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (Naphtali Press, 1993) | Part 2, Ch. 2, p. 73</span></figcaption>

</figure><figure class="quote" id="q-cb9bb6fc0d" data-kw="">
<blockquote><p>Although a thing may have its origin in Scripture, if it is to be indifferent, it is nevertheless required that there be no positive precept by which it is ordered, nor any negative one by which it is prohibited, but that it be left to us as something free, to use or not to use, as shall seem useful… Indifferent things must have a manifest and open usefulness, known in the Church, lest they may seem to be received for no purpose, or to be forced into the Church by treachery and deceit… power is given to edification and not to destruction (1 Cor. 14)… …the writings of the apostles and evangelists, which place before us most clearly the annulment of the rituals of Aaron, his ceremonies, priesthood, images, and peculiar figures, and the institution of the new and perfect priesthood of Christ. They must demonstrate to us from these books the grounds and occasion when some peculiar and special vestments should be worn in the ministry, for the adornment of the ministry itself, or for the preferring of its decorum, or for some distinctive mark, by which the minister can be distinguished from the people, as once was ordained by the Lord in the ministry of Aaron’s priesthood. But the statutes, canons and decrees of the apostles and evangelists make no mention of this matter… …What is prohibited by God can in no way be indifferent, as we have given warning above. For this is the doctrine of Paul in Gal. 2, that whatever re-establishes things that have been annulled in Christ, transgresses the will of God… Neither is it without its mystery that our Saviour Jesus Christ hung naked from the Cross. For Aaron’s priests used vestments in their own ministry because the reality of their priesthood, Christ Himself, had not yet come. But when Christ Himself was to be sacrificed, stripped of all clothing, displaying in this way his own priesthood, which since He was Reality itself, now had no further need of veils or semblances…</p></blockquote>

— John Hooper, ‘The Regulative Principle &amp; Things Indifferent’ (1550) in ed. Iain Murray, The Reformation of the Church: a Collection of Reformed &amp; Puritan Documents on Church Issues">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlthough+a+thing+may+have+its+origin+in+Scripture%2C+if+it+is+to+be+indifferent%2C+it+is+nevertheless+required+that+there+be+no+positive+precept+by+which+it+is+ordered%2C+nor+any+negative+one+by+which+it+is+prohibited%2C+but+that+it+be+left+to+us+as+something+free%2C+to+use+or+not+to+use%2C+as+shall+seem+useful%E2%80%A6+Indifferent+things+must+have+a+manifest+and+open+usefulness%2C+known+in+the+Church%2C+lest+they+may+seem+to+be+received+for+no+purpose%2C+or+to+be+forced+into+the+Church+by+treachery+and+deceit%E2%80%A6+power+is+given+to+edification+and+not+to+destruction+%281+Cor.+14%29%E2%80%A6+%E2%80%A6the+writings+of+the+apostles+and+evangelists%2C+which+place+before+us+most+clearly+the+annulment+of+the+rituals+of+Aaron%2C+his+ceremonies%2C+priesthood%2C+images%2C+and+peculiar+figures%2C+and+the+institution+of+the+new+and+perfect+priesthood+of+Christ.+They+must+demonstrate+to+us+from+these+books+the+grounds+and+occasion+when+some+peculiar+and+special+vestments+should+be+worn+in+the+ministry%2C+for+the+adornment+of+the+ministry+itself%2C+or+for+the+preferring+of+its+decorum%2C+or+for+some+distinctive+mark%2C+by+which+the+minister+can+be+distinguished+from+the+people%2C+as+once+was+ordained+by+the+Lord+in+the+ministry+of+Aaron%E2%80%99s+priesthood.+But+the+statutes%2C+canons+and+decrees+of+the+apostles+and+evangelists+make+no+mention+of+this+matter%E2%80%A6+%E2%80%A6What+is+prohibited+by+God+can+in+no+way+be+indifferent%2C+as+we+have+given+warning+above.+For+this+is+the+doctrine+of+Paul+in+Gal.+2%2C+that+whatever+re-establishes+things+that+have+been+annulled+in+Christ%2C+transgresses+the+will+of+God%E2%80%A6+Neither+is+it+without+its+mystery+that+our+Saviour+Jesus+Christ+hung+naked+from+the+Cross.+For+Aaron%E2%80%99s+priests+used+vestments+in+their+own+ministry+because+the+reality+of+their+priesthood%2C+Christ+Himself%2C+had+not+yet+come.+But+when+Christ+Himself+was+to+be+sacrificed%2C+stripped+of+all+clothing%2C+displaying+in+this+way+his+own+priesthood%2C+which+since+He+was+Reality+itself%2C+now+had+no+further+need+of+veils+or+semblances%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+John+Hooper%2C+%E2%80%98The+Regulative+Principle+%26+Things+Indifferent%E2%80%99+%281550%29+in+ed.+Iain+Murray%2C+The+Reformation+of+the+Church%3A+a+Collection+of+Reformed+%26+Puritan+Documents+on+Church+Issues&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcb9bb6fc0d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cb9bb6fc0d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-black-genevan-gowns/#:~:text=Although%20a%20thing%20may%20have%20its,further%20need%20of%20veils%20or%20semblances&amp;text=Although%20a%20thing%20may%20have%20its%20origin%20in&amp;text=had%20no%20further%20need%20of%20veils%20or%20semblances" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

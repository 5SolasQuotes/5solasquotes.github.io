<main class="wrap"><figure class="quote" id="q-4fb0f1e51d" data-kw="">
<blockquote><p>The modern doctrine of evolution is in obvious conflict with the teaching of Scripture on the subject of creation, and has never yet been shown to rest on a basis of fact. […] There is no scientific reason for our acceptance of such a theory. The whole doctrine is a mere hypothesis. […] It is a dream that, for wildness, surpasses anything in the whole history of religious belief.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reformed-presbyterian-church-of-ireland.html">Reformed Presbyterian Church of Ireland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Testimony of the Reformed Presbyterian Church of Ireland. Part I. Doctrinal and practical (1901; Belfast, 1912), pp 15-16.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6c1e88d86a" data-kw="">
<blockquote><p>While we would not fully agree with all of the Seceder Adam Gib’s sentiments with respect to errors in church government, he was correct to oppose the reductionist notion that the Bible is only concerned with salvation and not with church order. For various reasons, not least the fact that the keys of the kingdom are given to the church, and that there is no ordinary salvation outside the visible church, this idea is highly untenable:

But let us consider of how much Importance the visible Constitution of the Church is unto the Doctrines of Grace and Salvation. The Church is the Pillar and Ground of Truth, I Tim. iii. 15. Not that the Authority of the Church is that which determines the Truth, but the Constitution of the Church is that which maintains the Purity and Publication of the Truth, as Pillars were once used to preserve and expose the Roman Laws. It is of such Use to saving Truth, as a Man’s Feet are unto the rest of his Body, while needful to carry him up out of the Mire, or carry him out unto publick View.

The Manner wherein our catholick Men regard and use the Constitution of the visible Church, is, as if one seeing a Man sit, and rashly thinking all the under Part of his Body useless, should thereupon chop it off, and throw it away; and indeed he might throw away the rest at the same Time, as he’ll soon find it useless too. When Mr. W——d [George Whitefield] backs thro’ the Body of Truth and throws away the Doctrine of Church-Government, the Pillar or Feet whereby the whole is born up and out, it is the same Thing, in its Tendency, as if he should throw away the whole Bible; and thus our present Plea is, indirectly, a Plea for the whole Bible.

The Constitution of the Church, as it provides for the Preservation and Propagation of Truth, is like the Conduct where through Water runs clean into a City: Tho’ the Cistern be presently full, if you break the Conduit, you lay a Foundation for sudden Drought Church-Government is the Vessel wherein the sincere Waters of Truth are preserved, while swimming upon the salt Sea of Error that overflows this Earth if the Vessel be broke, the sweet Water must be lost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/adam-gib.html">Adam Gib</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Warning Against Countenancing the Ministrations of Mr. George Whitefield, Published in the New Church at Bristow, upon Sabbath, June 6. 1742</cite>, (Edinburgh: David Duncan, 1742), pp 42-43.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-a3da0233f0" data-kw="">
<blockquote><p>This I do infinitely grieve at, that many most wholesome precepts of divine Scripture are little regarded, and in the meantime all is so full of many presumption, that he is more grievously found fault with who during this octaves touches the earth with his naked foot than he that shall bury his soul in drunkenness. And after, I cannot approve them, and I think they are to be cut off wheresoever we have power. Many of these things, for fear of scandalizing many holy persons, or provoking those that are turbulent, I dare not freely disallow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Friendly Trial of the Grounds tending to Separation</cite>, As quoted in John Ball, ... (Cambridge: Daniel, 1640), ch. 9, “It is lawful for a Christian to be present at that service which is read out of a book in some things faulty both for form and matter”, pp. 161-63</span></figcaption>

</figure><figure class="quote" id="q-c706a32821" data-kw="">
<blockquote><p>…administration of the Lord’s Supper is a more important and necessary duty than exclusion [from it], etc. or any other part of the exercise of discipline; for it is more properly and immediately the worship of God than the exercise of discipline, as may be seen in the place before quoted out of Ames, bk. 2, [Marrow of] Theology, ch. 13, n. 17-18. God is more worshipped by the administration of the sacraments than by Church censures; the sacraments are a principal worship of God; Church censures and the exercise of discipline less principal. Now it is improbable that a less principal worship of God should be a necessary antecedent to a principal worship. There is says Rada: duplex ordo naturae; alius ordo essentialis dependendentiae; alius est ordo essentialis eminentiae et perfectionis; qualis est inter excedens, &amp; excessum. Now exclusion (and we may say the like of all other acts of discipline) is not before the Lord’s Supper in regard of the order, either of essential dependency, or of essential eminency and perfection. The Lord’s Supper has not an essential dependency upon exclusion, or any other acts of discipline: and it is in ratione cultus of more essential eminency and perfection; as being more immediatly and properly the worship of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want</cite>, [Lack] of Church-Government… (London, 1650), p. 31 Jeanes was an English presbyterian.</span></figcaption>

-of-the-church#:~:text=administration%20of%20the%20Lord%E2%80%99s%20Supper%20is,and%20properly%20the%20worship%20of%20God&amp;text=administration%20of%20the%20Lord%E2%80%99s%20Supper%20is%20a%20more&amp;text=more%20immediatly%20and%20properly%20the%20worship%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a1a48e9131" data-kw="">
<blockquote><p>Holding the distinction of natural and moral ability and inability, decides nothing in this behalf, because these terms are used by different men in different senses. Some mean by natural ability, plenary [complete] ability, in the full Pelagian sense; others mean, a partial, or gracious; an Arminian, or Semi-Pelagian ability. The orthodox, however, use it, if at all, simply to denote the natural faculties of understanding, desire, and will, which are essential to moral agency and responsibility, and belong to man, as such, whether unfallen, fallen, or renewed by grace. So, by moral inability, the former class [of Pelagians and Arminians] mean merely an aversion or unwillingness which the sinner can remove by his own will. The old Calvinists mean by moral inability, that indeed which characterizes fallen man; but still that which is real, which the subject of it cannot, while the Almighty power of God can, remove.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lyman-atwater.html">Lyman Atwater</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Witherspoon’s Theology’, The Biblical Repertory &amp; Princeton Review (1863)</cite>, pp. 598-99</span></figcaption>

</figure><figure class="quote" id="q-4d9204281e" data-kw="">
<blockquote><p>We ought to take care, on the other hand, lest, by proving that it is not the lack of members, senses, or faculties that accounts for man’s inability to act in a spiritual manner, we should set forth that weakness as something small, and that man may remove it by some endeavor of his own…</p></blockquote>

</figure><figure class="quote" id="q-a88ab6465b" data-kw="">
<blockquote><p>The words: ‘No man can come to Me, except the Father which has sent Me draw him,’ [John 6:44] present only the converse aspect of those [words spoken] to the disciples: ‘All that which the Father gives Me shall come to Me, and him that comes to Me I will in no wise cast out.’ For, far from being a judgment on, it would have been an excuse of, Jewish unbelief, and, indeed, entirely discordant with all Christ’s teaching, if the inability to come were regarded as other than personal and moral, springing from man’s ignorance and opposition to spiritual things. No man can come to the Christ—such is the condition of the human mind and heart, that coming to Christ as a disciple is, not an outward, but an inward, not a physical, but a moral impossibility—except the Father ‘draw him’. And this, again, not in the sense of any constraint, but in that of the personal, moral, loving influence and revelation, to which Christ afterwards refers when He says: ‘And I, if I be lifted up from the earth, will draw all men unto Myself’ (John 12:32).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alfred-edersheim.html">Alfred Edersheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Life &amp; Times of Jesus the Messiah, Complete &amp; Unabridged in One Volume (Hendrickson, 1993), Book 3, Chapter 32</cite>, p. 497</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“The words: ‘No man can come to Me, except the Father which has sent Me draw him,’ [John 6:44] present only the converse aspect of those [words spoken] to the disciples: ‘All that which the Father gives Me shall come to Me, and him that comes to Me I will in no wise cast out.’ For, far from being a judgment on, it would have been an excuse of, Jewish unbelief, and, indeed, entirely discordant with all Christ’s teaching, if the inability to come were regarded as other than personal and moral, springing from man’s ignorance and opposition to spiritual things. No man can come to the Christ—such is the condition of the human mind and heart, that coming to Christ as a disciple is, not an outward, but an inward, not a physical, but a moral impossibility—except the Father ‘draw him’. And this, again, not in the sense of any constraint, but in that of the personal, moral, loving influence and revelation, to which Christ afterwards refers when He says: ‘And I, if I be lifted up from the earth, will draw all men unto Myself’ (John 12:32).”

come,all%20men%20unto%20Myself%E2%80%99%20%28John%2012%3A32&amp;text=The%20words%3A%20%E2%80%98No%20man%20can%20come%20to%20Me&amp;text=will%20draw%20all%20men%20unto%20Myself%E2%80%99%20%28John%2012%3A32" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a4c588ba16" data-kw="">
<blockquote><p>Maresius… insists, the Reformed believe that the power of free choice is intrinsic to humanity… It is true that unlike irrational creatures, human beings are not naturally determined to just one course of action. They are free, in other words, from ‘physical necessity’. As a result, when human beings choose to do something under the influence of grace, they nonetheless retain a faculty within them which, were that grace withdrawn, would enable them to pursue another course of action. So if one considers free choice simply as a faculty, in isolation from all the natural and supernatural prerequisites for acting (the ‘divided sense’ [according to the created order]), it does indeed have both the inherent potential to accept or reject a given course of action (‘freedom of contradiction’)… … So for Maresius, free choice is incompatible with both physical necessity and the necessity of coercion: but it is compatible with other kinds of necessity. It is compatible, for example, with the necessity of dependence on God (Maresius 1646-48, 2:12). It is also compatible with ‘moral necessity’. That is the necessity which results from a human being’s moral character. Jesus’s moral character is such that He cannot sin; yet his goodness is still freely chosen. The moral character of the unregenerate is such that their acts are always sinful; yet their sin is still freely chosen (Maresisu 1646-48, 2:14). Free choice is equally compatible with the necessity brought about by the divine decree. Maresius calls this kind of necessity ‘hypothetical necessity’ or the ‘necessity of consequence’ (Maresius 1646-48, 2:15)… Maresius is seeking to preserve the fundamental contingency of human action… that choice is only necessary, given the divine decree–it is not inherently or absolutely necessary… for as Maresius underlines, ‘such is the faculty of the human will that, by its intrinsic constitution and nature, it is equally apt to choose an act plainly contrary to the one it actually chooses’ (Maresius 1646-48, 2:15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-hampton.html">Stephen Hampton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>1. ‘Free Choice’ in ‘Sin, Grace &amp; Free Choice in Post-Reformation Reformed Theology’ in Lehner, Muller &amp; Roeber, The Oxford Handbook of Early Modern Theology, 1600-1800 (Oxford, 2016)</cite>, pp. 229-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

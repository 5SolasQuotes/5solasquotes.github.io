<blockquote><p>First, I said that the magistrate is the guardian of the divine law, which includes not only the second table, but the first also. Therefore he is the guardian of both the one and the other. I also mentioned the words of Augustine who said that both private men and kings should serve the Lord. It is written in the Psalms, When peoples gather together and kingdoms, to worship the Lord. In another place, Now therefore, O kings, be wise; be warned, O rulers of the earth. Serve the LORD with fear, with trembling. Augustine adds that a private man serves the Lord by confessing His name and living rightly. This, however, is not sufficient for a king or magistrate. He should serve the Lord with his authority and power by punishing those who oppose Him. Unless he does this, the magistrate appears to give his assent to blasphemy and heresy. When the king sees and suffers these men, he joins himself to them and promotes their shameful acts. When Nebuchadnezzar first came to know God, he proposed a decree promising capital punishment for those who should blaspheme against the God of Daniel. Darius later made a similar decree. Our magistrate should stamp out all idolatry, blasphemy and superstition. […] The law of God states that blasphemers should be put to death not by a private man or by priests, but by the magistrate. [Leviticus 24:16]</p></blockquote>

<blockquote><p>The Covenant of Grace before Christ’s coming was administered under the Law. And here of the LAWS of GOD. Rom. 7.12. Wherefore the Law is holy, and the Commandment holy, just and good.

1. God hath revealed his Will. 1. By his Law ingraven in Man’s Heart. 2. By the Law Written, which is either Moral, or Mosaical; and This Ceremonial and Judicial. 2. An Abstract of these Laws. 1. Of the Ceremonial in Sacred Persons, and Sacred Things, and Sacred Times. 2. Of the Judicial, being reducible to the Commandments, which do make up 3. The Moral. 3. [sic] The use of these Laws severally. 4. The Excellency of them: Holy, Just, Good. 5. Duration of them. The Ceremonial, to the Death of Christ; The Judicial, to the destruction of Jerusalem; The Moral, to the end of the World.</p></blockquote>

iv>
</figure><figure class="quote" id="q-5fd50f4490" data-kw="">
<blockquote><p>But how does this oath, or the act of parliament requiring ministers to take this oath, make ministers dependent on the magistrate in the exercise of their ministry, when the oath only contains the duty of a subject, and speaks nothing either of the ministry or exercise of the ministry? ‘Yea, but the act enjoining it, makes it an essential requisite to a minister of this national Church.’ Answer: There is no such metaphysical term in the act as essential, but only that ministers of this national Church shall take it. The Church is considered not simply as a Church, but as national, having national and legal privileges, which they are deprived of that refuse this oath. It does not say he shall not be a minister if he take it not, but he shall not have the countenance and protection of civil authority, he shall not enjoy his benefice, shall not have allowance form the magistrate for, and encouragement in the exercise of his ministry. He shall not enjoy the peaceable public exercise of his ministry. And what wonder that the magistrate will not countenance them as ministers who will not bind themselves to him as subjects? that he will not let them preach to his subjects if he can hinder them, who will not promise and swear when required that they will not preach treason and rebellion against him, when they should teach them subjection and obedience to Christ? that he will not let them teach others what they call their duty to God who will not do their duty to their sovereign, but separate these things which God has conjoined, ‘Fear God, honor the king’? See more of this in the Seasonable Admonition and Exhortation of the Commission of the General Assembly, anno 1698, which you have neither obeyed neither yet given a reason of your disobedience; and in a Treatise against Separation, by Mr. Alexander Shields, one of your teachers, to whom you became his enemy, because he told you the truth… …But [the magistrate] shows by this act whom he will countenance and protect in the exercise of the ministry, to whom he will give or allow the stipends and legal maintenance to encourage them in the exercise of the ministry, whom he will suffer to pass and repass, and exercise their ministry without hazard or molestation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gavin-hamilton.html">Gavin Hamilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Just Reflections upon a Pamphlet entitled, A Modest Reply to a Letter from a Friend to Mr. John M’millan</cite>, ([Edinburgh] 1712) Hamilton was a Church of Scotland minister., p. 35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-cf842d1c29" data-kw="">
<blockquote><p>Objection 4 [by an Erastian]: When its required that the magistrates be men fearing God, hating coveteousness, etc. (Ex. 18:21; Dt. 1:16-17; 17:19-20), is not this an essential ingredient of a king as a king, that he read in the book of the Law, that he may fear God, Deut. 17? [Rutherford’s] Answer: There is a twofold goodness here to be considered: one of the magistrate as a magistrate, another as a good and Christian magistrate. The former is an official goodness, or a magistratical prudence, justice, and goodness; this is required of all magistrates, as such, to judge the people: so the acts of a heathen magistrate done according to common natural equity, by Nebuchadnezzar, Pilate, Caesar, Felix, Festus, are to be acknowledged as acts of a lawful magistrate, valid and no less essentially magistratical than if performed by King David; and of this goodness the Scriptures speak not as essential to a magistrate as a magistrate. But there is another goodness required of magistrates as they are members of the Jewish Church, and as they are Christians, and of these the Scripture speaks; and so magistrates not as magistrates, but as good and Christian, are to be such as fear God, hate covetousness, respect not the face and favor of men; so its denied that the fear of God, hating of covteousness, are essential ingredients of kings as kings. For kings as kings intend justice, peace, godliness, materially considered, both ex conditione operis [out of the nature of the work], and operantium [of those working]. But for justice and righteous judgment in a spiritual and an evangelic way, that belongs not to the essence of a magistrate, nec ex conditione seu ex intentione operis, nec ex conditione operantis [neither out of the nature or the intention of the work, nor out of the nature of the one working]: The Holy Ghost requires it of judges, as they would approve themselves as truly holy and religious, and would be accepted of God; And in this sense kings as kings do not serve God, nor the mediator Christ, nor yet as men; only they serve God and the mediator Christ as Christian Kings, or as Christian men rather.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646), ch. 24, Question 20, pp. 547-48</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Objection 4 [by an Erastian]: When its required that the magistrates be men fearing God, hating coveteousness, etc. (Ex. 18:21; Dt. 1:16-17; 17:19-20), is not this an essential ingredient of a king as a king, that he read in the book of the Law, that he may fear God, Deut. 17? [Rutherford’s] Answer: There is a twofold goodness here to be considered: one of the magistrate as a magistrate, another as a good and Christian magistrate. The former is an official goodness, or a magistratical prudence, justice, and goodness; this is required of all magistrates, as such, to judge the people: so the acts of a heathen magistrate done according to common natural equity, by Nebuchadnezzar, Pilate, Caesar, Felix, Festus, are to be acknowledged as acts of a lawful magistrate, valid and no less essentially magistratical than if performed by King David; and of this goodness the Scriptures speak not as essential to a magistrate as a magistrate. But there is another goodness required of magistrates as they are members of the Jewish Church, and as they are Christians, and of these the Scripture speaks; and so magistrates not as magistrates, but as good and Christian, are to be such as fear God, hate covetousness, respect not the face and favor of men; so its denied that the fear of God, hating of covteousness, are essential ingredients of kings as kings. For kings as kings intend justice, peace, godliness, materially considered, both ex conditione operis [out of the nature of the work], and operantium [of those working]. But for justice and righteous judgment in a spiritual and an evangelic way, that belongs not to the essence of a magistrate, nec ex conditione seu ex intentione operis, nec ex conditione operantis [neither out of the nature or the intention of the work, nor out of the nature of the one working]: The Holy Ghost requires it of judges, as they would approve themselves as truly holy and religious, and would be accepted of God; And in this sense kings as kings do not serve God, nor the mediator Christ, nor yet as men; only they serve God and the mediator Christ as Christian Kings, or as Christian men rather.”

<blockquote><p>In the dispute which resulted in the schism of 1840 over the civil magistrate’s power circa sacra, it was alleged that Thomas Houston was arguing for the entire judicial law to be upheld by the Christian ruler. This was a complete straw-man, yet, in modern debates over Theonomy, we hear this very same straw-man repeated again and again. No matter how many times you tell people that this is not the case, they persist in spreading such misrepresentation. Instead, our position is that the judicial laws which are part of the moral law continue to oblige all nations; as Dr Houston puts it:

Again, the authors of the Declinature obviously represent Mr. Houston, as teaching that the whole Judicial Code is still obligatory on Christian civil rulers, whereas, even in the passages which they have quoted, the writer limits the laws, as do the eminent Divines, to those which guard the Decalogue, which are moral in their nature, and which are susceptible of application, to nations in different ages, and under every dispensation.</p></blockquote>

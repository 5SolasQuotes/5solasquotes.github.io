<main class="wrap"><figure class="quote" id="q-ddb61c2d7e" data-kw="">
<blockquote><p>I told some of my parishoners that I must wear the surplice, or loose my place, and they, me, requiring to know of them how they would accept my ministry if I wore it (for my judgment [that it was tolerable] they knew). They answered that they should never profit by it. Here upon I resolved not to stumble them, admonished them of their error, told them they would repent it ere the year went about; And indeed so did they with many tears, wishing that I had rather worn ten surplices than to have left them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-burges.html">John Burges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer Rejoined to that much Applauded Pamphlet of a Nameless Author, bearing this Title</cite>, … (London: Matthewes, 1631), p. 16</span></figcaption>

</figure><figure class="quote" id="q-798a5a79a7" data-kw="">
<blockquote><p>Thus, to return to the Scriptural example in Acts 21:20–26 (with 16:3 &amp; 18:21), when new Christians with serious misconceptions about what God required for public worship thought that Paul (a mature Christian teacher) taught against their way of worship, which was seriously defective, Paul, without a fuss, at the instigation of other Christian leaders, publicly led and performed that defective worship to prevent scandal to the erring, for the sake of visible Christian unity. Rather than dissent and abstain, Paul publicly led and participated in that defective, burdensome worship for the greater good. If that was true for inferior, carnal ordinances with no spiritual efficacy (2 Cor. 3:6–17; Heb. 7:18–19; 8:13; 9:10; 10:1–4), how much more does it pertain to impurities in the greater, spiritual, efficacious and enduring ordinances of God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thus, to return to the Scriptural example in Acts 21:20–26 (with 16:3 &amp; 18:21), when new Christians with serious misconceptions about what God required for public worship thought that Paul (a mature Christian teacher) taught against their way of worship, which was seriously defective, Paul, without a fuss, at the instigation of other Christian leaders, publicly led and performed that defective worship to prevent scandal to the erring, for the sake of visible Christian unity. Rather than dissent and abstain, Paul publicly led and participated in that defective, burdensome worship for the greater good. If that was true for inferior, carnal ordinances with no spiritual efficacy (2 Cor. 3:6–17; Heb. 7:18–19; 8:13; 9:10; 10:1–4), how much more does it pertain to impurities in the greater, spiritual, efficacious and enduring ordinances of God?”

</figure><figure class="quote" id="q-d7a94b00e0" data-kw="">
<blockquote><p>Things inconvenient, even in matters of religion, may be commanded in some cases: as when it is to redeem a far worse inconvenience. For of two evils of punishments, the magistrate may take the less as well as any other private man. And if that subjects, to prevent worse inconveniences, may use inconvenient ceremonies, then may the Magistrate, to prevent worse inconveniences, command inconvenient ceremonies. If the apostles may use the inconvenient Jewish ceremonies, then the apostles may enjoin for a time the use of inconvenient ceremonies: as they did make ordinances about things which yet they called burdens, Acts 15. (Circumcision was a burden, Acts 15:10, and these burthens were necessary things, v. 28, and they were said to do well if they observe them, v. 29.) And Moses may make an ordinance about the use of a bill of divorcement, which yet was a grievous inconvenience to redeem a worse inconvenience. But if magistrates do appoint inconvenient things, and burden the Church with them, when there would be no great inconvenience to the Church if such things were not, then such magistrates must give their account to Christ for so doing; but yet the people are bound to obey still, because we cannot be freed from our subjection laid upon us by God, except it appear to us that they command not only an inconvenience, but a sin, as all sound divines confess.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Peter</cite>, (London, 1637), on 1 Tim. 2:13, pp. 434-35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-21d7debf01" data-kw="">
<blockquote><p>Besides, arguments drawn from scandal in things neither unlawful nor (setting the reason of scandal aside) inexpedient, as they are subject to sundry frailties otherwise, so they are manifestly of no weight at all when they are counterpoised with the apparent danger of evil consequents on the other side. For in such cases there is commonly equal danger (if not rather something more) of scandal to be taken from the example the quite contrary way.</p></blockquote>

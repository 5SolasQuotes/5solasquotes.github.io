<main class="wrap"><figure class="quote" id="q-62ee3c0aac" data-kw="">
<blockquote><p>Yea a conditional covenant agreed unto and accepted, is a covenant, if we shall (as in reason we ought) distinguish between a covenant, in its essence and nature, and a covenant broken or fulfilled. A covenant or threatening is a covenant and threatening obliging Adam, if it shall be agreed unto by silence, as Adam accepted the threatening, Gen. 2:17, by silence; and professors within the visible church, by their professing of the doctrine of the Gospel or covenant of grace, their receiving of the seals and professed hearing of the word, are under the covenant of grace, and engage themselves to obey commands, promises, threatenings; and therefore promises are as properly made to them, Acts 2:39, as commands, and threatenings, exhortations, invitations, and Gospel requests are made to them. But though the Anabaptists ignorantly confound the promise and the thing promised, the covenant and benefits covenanted: the promise is to you, and so are the commands and threatenings, whether ye believe or not; the command is to you, and lays an obligation on you, whether ye obey or obey not, and the threatenings are to you, whether ye transgress or transgress not. It is true indeed, the promise, that is, the blessing promised, righteousness and eternal life, is not given to you until ye first believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenant of Life Opened… (Edinburgh: Anderson, 1655), pt. 1</cite>, ch. 13; p. 90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-160b4491ad" data-kw="">
<blockquote><p>4th Conclusion: There be three sorts that have communion rightly with our Church: 1. Infants baptized, for baptism is a seal of their fellowship with Christ, and therefore of communion with the Church. Because Separatists will have none members of the Church while [except] they can give proofs thereof by signs of regeneration, infants must be without the Church, as infidels and Turks, for none are the Church to them but the royal generation, partakers of the holy faith, taught of God, called and separated from the world: the rest are without. Hence baptism shall either seal no entering of infants in the Church, contrary to God’s Word, or the baptizing of infants is not lawful, as Anabaptists teach. 2. The hearers of the Word have a communion with the Church, as is clear seeing these that eat of one bread are one body, these that profess in the hearing of the Word, that same faith, are also that same body in profession; yet excommunicated persons are admitted as hearers of the Word. Hence only the extreme and great excommunication, 1 Cor. 16:22, cuts off men from being simply no members of the Church, that excommunication that makes the party as a heathen and publican supposes him still to be a brother and hearer of the Word, 2 Thess. 3:14-15. And all these are members of the Church and yet not necessarily converted. 3. The regenerate and believers that communicate of one bread and one cup at the Lord’s Table, are most nearly and properly members of one visible body, and none of these are to separate from Christ’s body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea… (London, 1642), ch. 10</cite>, p. 132</span></figcaption>

</figure><figure class="quote" id="q-e8163bee18" data-kw="">
<blockquote><p>The Gospel, however taken, has conditional promises. The Papists here assent to us, but not without calumny. For they feign that we make the Gospel promises to be absolute. Proposition 2: The Gospel most largely taken has the promise of eternal life, on condition either of faith only [for justification], or faith and new obedience together [for final salvation], or of fulfilling the perfect Law by our own strength (as rehearsing the Law of works): and so it makes mention not only of the evangelical condition and righteousness, but of the legal too. Proposition 3: The Gospel largely taken, has the promise of eternal life on condition of faith and new obedience [for final salvation]. Of the condition of faith there is no doubt: nor of the condition of new obedience conjunct with faith, Rom. 8:13; Heb. 12:14.</p></blockquote>

<blockquote><p>22. There is no Church on earth so sound and orthodox as to want [lack] no integral part of Christian religion. Proved: There is no man on earth, much less any multitude, so sound as to want no integral part: But all Churches consist only of men; And therefore if all the men be so far defective, all the Churches are so. … All things in Scripture proposed to our faith, hope and practice, are the integrals of our religion: But no Christian understands all these proposals or words of Scripture: Therefore no Christian explicitly believes them all, or practices all. To hold the contrary, is to hold that some Church is perfect in understanding, faith, hope and practice, without ignorance, errour or sin: that is, not to know what a man or a Christian on earth is.</p></blockquote>

</figure><figure class="quote" id="q-677425ee04" data-kw="">
<blockquote><p>Externally this covenant is made with every member of the Church, even with the parents and their children, so many as hear and embrace the promises of salvation, and give and dedicate their children unto God according to his direction; for the sacraments—what are they but seals of the covenant? But savingly, effectually, and in a special manner it is made only with them who are partakers of the benefits promised. And as the covenant is made outwardly or effectually, so some are the people of God externally, others internally and in truth. For they are the people of God with whom God has contracted a covenant, and who in like manner have sworn to the words of the covenant, God stipulating and the people receiving the condition; which is done two ways: [1] for either the covenant is made extrinsically, God by some sensible token gathering the people, and the people embracing the condition in the same manner, and so an external consociation of God and the people is made; [2] or the covenant is entered after an invisible manner, by the intervention of the Spirit, and that with so great efficacy that the condition of the covenant is received after an invisible manner, and so an internal consociation of God and the people is made up.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace… (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’</cite>, p. 24</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Externally this covenant is made with every member of the Church, even with the parents and their children, so many as hear and embrace the promises of salvation, and give and dedicate their children unto God according to his direction; for the sacraments—what are they but seals of the covenant? But savingly, effectually, and in a special manner it is made only with them who are partakers of the benefits promised. And as the covenant is made outwardly or effectually, so some are the people of God externally, others internally and in truth. For they are the people of God with whom God has contracted a covenant, and who in like manner have sworn to the words of the covenant, God stipulating and the people receiving the condition; which is done two ways: [1] for either the covenant is made extrinsically, God by some sensible token gathering the people, and the people embracing the condition in the same manner, and so an external consociation of God and the people is made; [2] or the covenant is entered after an invisible manner, by the intervention of the Spirit, and that with so great efficacy that the condition of the covenant is received after an invisible manner, and so an internal consociation of God and the people is made up.”

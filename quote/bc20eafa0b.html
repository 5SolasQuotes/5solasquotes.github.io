<main class="wrap"><figure class="quote" id="q-bc20eafa0b" data-kw="" data-pol="">
<blockquote><p>And that is not the essential righteousness of God, as Andreas Osiander contended … And it is not partly composed of Christ’s righteousness and partly of ours, which the sophists invent, whom Calvin refutes in the same chapter. But it is only by the righteousness of Jesus Christ, our Mediator and Savior</p></blockquote>
<figcaption>— <a href="../authors/amandus-polanus.html">Amandus Polanus</a>, <cite>The Free Justification of Man the Sinner before God</cite>, section on the righteousness by which we are justified</figcaption>

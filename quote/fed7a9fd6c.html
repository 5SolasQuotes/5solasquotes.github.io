<blockquote><p>1. The first decree, then, is about restoring the divine image upon the creature, in a way wherein the justice of God remains intact. 2. The second is about sending the Son who saves each and every one of those who believe in him, that is, who are his members. 3. The third is about rendering men fit to believe. 4. The fourth is about saving those who believe.</p></blockquote>

</figure><figure class="quote" id="q-8bf94214ce" data-kw="">
<blockquote><p>Amyraut intended to soften the edges of the traditional Reformed view and thus to relieve difficulties in the controversy with Roman Catholics and facilitate a reunion of Protestants in which Reformed and Lutheran could join ranks… [it] tended to weaken the unity of Reformed thought and to open the door to increasing departures from Reformed orthodoxy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/roger-r-nicole.html">Roger R. Nicole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Amyraldism’ in eds. Sinclair B. Ferguson &amp; David F. Wright, New Dictionary of Theology</cite>, (Leicester: IVP, 1988), p. 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>
<div class="actions"><button class="copy" data-copy="“Amyraut intended to soften the edges of the traditional Reformed view and thus to relieve difficulties in the controversy with Roman Catholics and facilitate a reunion of Protestants in which Reformed and Lutheran could join ranks… [it] tended to weaken the unity of Reformed thought and to open the door to increasing departures from Reformed orthodoxy.”

— Roger R. Nicole, ‘Amyraldism’ in eds. Sinclair B. Ferguson &amp; David F. Wright, New Dictionary of Theology (Leicester: IVP, 1988), p. 17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAmyraut+intended+to+soften+the+edges+of+the+traditional+Reformed+view+and+thus+to+relieve+difficulties+in+the+controversy+with+Roman+Catholics+and+facilitate+a+reunion+of+Protestants+in+which+Reformed+and+Lutheran+could+join+ranks%E2%80%A6+%5Bit%5D+tended+to+weaken+the+unity+of+Reformed+thought+and+to+open+the+door+to+increasing+departures+from+Reformed+orthodoxy.%E2%80%9D%0A%0A%E2%80%94+Roger+R.+Nicole%2C+%E2%80%98Amyraldism%E2%80%99+in+eds.+Sinclair+B.+Ferguson+%26+David+F.+Wright%2C+New+Dictionary+of+Theology+%28Leicester%3A+IVP%2C+1988%29%2C+p.+17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8bf94214ce.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8bf94214ce.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=Amyraut%20intended%20to%20soften%20the%20edges,to%20increasing%20departures%20from%20Reformed%20orthodoxy&amp;text=Amyraut%20intended%20to%20soften%20the%20edges%20of%20the&amp;text=the%20door%20to%20increasing%20departures%20from%20Reformed%20orthodoxy" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b59e97c5ff" data-kw="">
<blockquote><p>It has been maintained that the [Westminster] Assembly formulated at least one section so as to allow for an Amyraldian doctrine of the atonement. The Minutes of the Assembly give no support to this contention. There are three principles enunciated in the [Westminster] Confession that exclude the Amyraldian view. The first is that redemption has been purchased for the elect. ‘The Lord Jesus, by His perfect obedience, and sacrifice of Himself… purchased, not only reconciliation, but an everlasting inheritance in the kingdom of heaven, for all those whom the Father hath given unto him’ (8:5). The second is that impetration and application are coextensive. ‘To all those for whom Christ hath purchased redemption, he doth certainly and effectually apply and communicate the same’ (8:8). This excludes any form of universal atonement. The redemption purchased includes, as the preceding quotation implies, the purchase of an everlasting inheritance, and this is therefore said to be communicated to all for whom redemption was purchased. If all were included then all would be the partakers of the everlasting inheritance in the kingdom of heaven, a position clearly denied in the Confession elsewhere. The third principle is the exclusiveness of redemption. ‘Neither are any other redeemed by Christ, effectually called, justified, adopted, sanctified, and saved, but the elect only’ (3:4). In the preceding sentence the elect are said to have been ‘redeemed by Christ’; now it is said that they alone are redeemed. Other lines of argument could be elicited from the Confession to show that it allowed for no form of universal atonement, not even the hypothetical universalism propounded on the floor of the Assembly. But the foregoing principles are sufficient to show that the particularism in terms of which the whole doctrine of salvation is constructed is not sacrificed at the point of the atonement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collected Writings of John Murray</cite>, (Edinburgh: Banner, 1982), vol. 4, pp. 255-256</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-7b8c12bba8" data-kw="">
<blockquote><p>…the Westminster Assembly consistently maintains particularism. I deny that the universalists at Westminster ‘were able to restrain the final codification sufficiently for there to be some significant ambiguity at crucial places’ (148). I do not deny that the issue of particularism versus universalism was debated at Westminster nor that contemporary universalists claimed their teaching compatible and remained active at the synod. But the mere presence of a plurality of views in session does not imply a plurality of views in confession. Clearly, the final formulation should interpret (the outcome of) the earlier discussion and not the earlier discussion the final formulation. Although WCF could be ambiguous or alternatively rendered on this subject (as on some other ones), it is actually precise and clear about the strictly particular divine intention.” – Rehnman . Quotes 1800’s Robert Shaw Exposition of the Westminster Confession, pp. 112-113, commenting on WCF 8.8, “To all those for whom Christ hath purchased redemption, he doth certainly and effectually apply and communicate the same:</p></blockquote>

<main class="wrap"><figure class="quote" id="q-7d0ed34133" data-kw="">
<blockquote><p>They accuse us of profanity for entertaining lofty conceptions about the Holy Spirit. All that we, in following the teachings of the Fathers, confess as to the Spirit, they take in a sense of their own, and make it a handle against us, to denounce us for profanity. We, for instance, confess that the Holy Spirit is of the same rank as the Father and the Son, so that there is no difference between them in anything, to be thought or named, that devotion can ascribe to a Divine nature.

We confess that, save His being contemplated as with peculiar attributes in regard of Person, the Holy Spirit is indeed from God, and of the Christ, according to Scripture, but that, while not to be confounded with the Father in being never originated, nor with the Son in being the Only-begotten, and while to be regarded separately in certain distinctive properties, He has in all else, as I have just said, an exact identity with them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-nyssen.html">Gregory of Nyssa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Holy Spirit. Against the Followers of Macedonius</cite>, (c. 380) in Nicene and Post-Nicene Fathers 2, 5: 315-16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0e37a7d645" data-kw="one God unity">
<blockquote><p>The Scriptures recognize a single omnipotent, infinite, eternal, and supremely perfect God, and this is supported by reason. Since the creation, maintenance, and governance of the world require infinite power, if there were two or more gods, none of them would be infinite. One would limit the other and set boundaries to its power. Hence, it is necessary for the supreme and greatest being to be singular.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Trinity, Thesis I</span></figcaption>

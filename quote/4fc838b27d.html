<main class="wrap"><figure class="quote" id="q-4fc838b27d" data-kw="">
<blockquote><p>But as Augustine was swallowed up, by the admiration of God’s Majesty: so am I with the consideration of this mercy; I say of this mercy, which is given us by the father, purchased by the son, assured by the holy ghost, offered in the word, sealed in the sacraments, apprehended by faith, tried by tribulation, and, though not deserved by us, yet reserved for us in the highest heavens.

Is God our father? behold our dignity, are we his children? learn we our duty. The consideration of this dignity, made Theodosius to thank God more, that he was a Christian then a King, Moses to refuse the crown of Aegypt, David to desire the place of God’s doorkeeper, and Paul to make a base account of all things in this world.

The consideration of this duty made Abel to sacrifice his sheep, Abraham to sacrifice his son, and the Romans to sacrifice themselves, Joseph to flee adultery, the three children to flee idolatry, Nehemiah to fly tyranny, and all God’s children to abandon impiety. Now then, If we call him father, which without respect of persons judgeth according to every man’s work, let us pass the time of our dwelling here in fear, knowing that we were not redeemed with corruptible things, as silver and gold, from our vain conversation, received by the tradition of the fathers, but with the precious blood of Christ, as of a Lamb undefiled, and without spot. …

I have spoken of our dignity, but what is our duty? by this we must learn to admire this mercy of God the father, to adore this love in God the son, to keep this assurance in God the holy ghost: and that the more favours he hath shewed to us, the more we are indebted to him. By this, we must learn, to have this adoption written in our hearts, sealed in our consciences, &amp; to esteem it the greatest blessing in the world.

By this we must learn, to love him who thus loved us: for amante non amato, nihil est miserius: and to love all such as belong unto God, for, he that loveth him which begat, loveth also him who is begotten. In a word, are we God’s children, we must love his house, not sell our inheritance, desire to be with him, pray only unto him, depend upon his providence, be patient with his corrections, content with his allowance, and as glad to see his great name honoured, as we would be sorry to see the King’s name abused.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-hill.html">Robert Hill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistle dedicatory in Guillaume Bucanus, Institutions of Christian religion framed out of God’s word, and the writings of the best divines, methodically handled by questions and answers, fit for all such as desire to know, or practise the will of God</cite></span></figcaption>

</figure><figure class="quote" id="q-72c5a026dc" data-kw="">
<blockquote><p>Did the Lord by Moses give to the Jews as a body politic sundry judicial laws which expired with their state? Yes. Do they oblige any other now, further than the general equity thereof may require? No (Ex. 21; 22:1-29; Gen. 49:10; 1 Cor. 9:8-10; 1 Pet. 2:13-14; Mt. 5:17,38-39). Well then, do not some err, though otherwise orthodox, who maintain that the whole judicial law of the Jews is yet alive and binding all of us who are Christian gentiles? Yes. By what reasons are they confuted?

1. Because the judicial law was delivered by Moses to the Israelites to be observed, as to a body politic (Ex. 21).

2. Because this law, in many things which are of particular right, was accommodated to the commonwealth of the Jews, and not to other nations also (Ex. 22:3; 21:2; Lev. 25:2-3; Dt. 24:1-3; 25:5-7).

3. Because, in other things which are not of particular right, it is neither from the law of nature obliging by reason; neither is it pressed upon believers under the gospel to be observed.

4. Because believers are appointed under the gospel to obey the civil law and commands of those under whose government they live, providing they be just, and that for conscience’ sake (Rom. 13:1; 1 Pet. 2:13-14; Titus 3:1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth’s Victory Over Error</cite>, ch. 19, question 4 (the first commentary defending the Westminster Confession)</span></figcaption>

<blockquote><p>XII. Tenth, we must always distinguish between the state of the church constituted and the state of the church to be constituted; the tranquil and well-ordered state and the same perturbed and corrupted. Many things are lawful in a disturbed condition of the state which would not be lawful in a peaceful and well-composed condition, where all things are rightly ordered and done according to the laws. For then necessity (which knows no law) does many lawful things which (if the necessity was removed) would have to be blamed.</p></blockquote>

<blockquote><p>Note, the rules of a strict discipline must not be made too strict, but so as to admit of a dispensation when the necessity of a case calls for it, which therefore, in making vows of that nature, it is wisdom to provide expressly for, that the way may be made the more clear, and we may not afterwards be forced to say, ‘It was an error,’ Eccl. 5:6. Commands of that nature are to be understood with such limitations. These Rechabites would have tempted God, and not trusted Him, if they had not used proper means for their own safety in a time of common calamity [which they did, Jer. 35:11], notwithstanding the law and custom of their family [Jer. 35:7-10].</p></blockquote>

<blockquote><p>Fourth, if election is from foreseen faith, God would not have elected man, but rather man would have elected God, and so predestination should rather be called postdestination; the first cause would be made the second, and God would depend of man (the falsity of which, both the thing itself exclaims and Christ expressly testifies: “Ye have not chosen me, but I have chosen you,” (Jn. 15:16).</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e3aa993b37" data-kw="">
<blockquote><p>John Davenant wrote to his fellow member of the British delegation to the Synod of Dort, Joseph Hall, to correct false aspersion of Arminianism cast upon the latter divine and to affirm that Arminianism was contrary to the doctrine of the Church of England:

As for the aspersion of Arminianism, I can testify that in our joint employment at the Synod of Dort you [Joseph Hall] were as far from it as myself. And I know that no man can embrace it in the Doctrine of Predestination and Grace but he must first desert the Articles agreed upon by the Church of England, nor in the point of perseverance but he must vary from the common Tenet and received opinion of our best approved Doctors in the English Church. And therefore be no more troubled with other men’s groundless suspicions, then you would be in like case, with their idle dreams. Thus I have enlarged my self beyond my first intent. But my love to your self, and the assurance of your constant love unto the Truth, enforced me thereunto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Joseph Hall, 30 January 1628 in Joseph Hall, The Reconciler, or An epistle pacificatory of the seeming differences of opinion concerning the true being and visibility of the Roman Church Enlarged with the addition of letters of resolution, for that purpose, from some famous divines of our </cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

</figure><figure class="quote" id="q-2b1fae712e" data-kw="">
<blockquote><p>The Arminians (who bring popery and Pelagianism in by the back door) have struck against the same rock [as the modern Lutherans]. For although they endeavour with great labour to prove that they do not make faith the cause of election (in order to shun the odium of semi-Pelagianism deservedly charged upon them), still they do not deny that it is the cause sine qua non or the prerequisite condition necessary in those to be elected. Yea, not obscurely can we gather that they proceed further and attribute a certain causality to faith, so that God is moved by its foresight to choose this rather than that one. Otherwise why would they say so often that election is founded on the foresight of faith unless they meant that the consideration of faith influenced the election of one before another? …

Moreover, they make a twofold decree of election: the first general, of saving believers; the second special, of saving individuals by name whom God foresaw would believe. They hold that no other cause of the first can be given than the pure will of God, but as to the second (although it also is founded upon the divine will), they hold it supposes the consideration and regard of faith, so that God is moved by it to elect one rather than another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Philipsburgh, 1992), 4.11.7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

</figure><figure class="quote" id="q-edd9b2e278" data-kw="">
<blockquote><p>In a debate at the Westminster Assembly, Edmund Calamy explained the difference between English hypothetical universalist and Arminian views on the extent of the atonement. I am most definitely not a hypothetical universalist but instead a strict particularist, but in order to avoid attacking straw-men, it is important to understand what this view is so that it is not conflated with the Arminian notion of universal atonement.

It is also important to remember that neither the Synod of Dort nor the Westminster Assembly condemned English hypothetical universalism as outside the bounds of Reformed orthodoxy. The strict particularlists and the hypothetical universalists were seen as different regiments in the army of true religion. We do not have to like these facts, but it is good to keep them in mind in order to deal charitably with differing brethren:

I am far from universal redemption in the Arminian sense; but that that I hold is in the sense of our divines in the Synod of Dort, that Christ did pay a price for all, – absolute intention for the elect, conditional intention for the reprobate in case they do believe, – that all men should be salvabiles, non obstant lapsu Adami … that Jesus Christ did not only die sufficiently for all, but God did intend, in giving of Christ, and Christ in giving Himself, did intend to put all men in state of salvation in case they do believe. … I argue from the iii. of Joh[n] 16, in which words a ground of God’s intention of giving Christ, God’s love to the world, a philanthropy the world of elect and reprobate, and not of elect only …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-f-mitchell-and-john-struthers.html">Alexander F. Mitchell and John Struthers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Minutes of the Sessions of the Westminster Assembly of Divines</cite>, (Edinburgh: William Blackwood and Sons, 1874), Sess. 522, 22 Oct. 1645, pp 152, 154.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

<blockquote><p>For the answering of this, we must make a double distinction: one of errors, the other of persons that err. Of errors, some are destroyers of the Faith, some only weakeners of it: A destroyer is that which overturns any fundamental point of religion, which is of that nature, that if it be denied, religion itself is overturned, as the denial of the death of Christ, and the immortality of the soul, justification by works, and such like; And the sum of these fundamental points is comprised in the Creed of the Apostles and the Decalogue. A weakening error is that the holding whereof does not overturn any point in the foundation of salvation, as the error of freewill and sundry such like. This distinction is made by the Holy Ghost, who says expressly that the doctrines of repentance, and faith, and baptisms, and laying on of hands, and the resurrection, and the last Judgment, are the foundation, namely of religion: and again, that Christ is the foundation, and that other doctrines consonant to the Word are as gold and silver laid thereupon. Secondly, persons erring, are of two sorts: Some err of weakness, being carried away by others, or of simple ignorance, not yet being convicted and informed concerning the truth. Some again err of obstinacy or affected ignorance, which having been admonished and convicted, still persevere in their forged opinions. This being said, we now come to the point: If any man or Church shall hold an error of the lighter kind, he still remains a member of the Church of God, and so must be reputed of us. As when a Lutheran shall hold that images are still to be retained in the church, that there is an universal election of all men, etc.; for these and such like opinions may be maintained, the foundation of salvation unrazed. This which I say is flatly avouched by Paul. ‘If any man’ (says he): ‘build on this foundation gold, silver, precious stones, timber, hay, or stubble, his work shall be made manifest by the fire, etc. and if any man’s work burn, he shall loose, but yet he shall be safe himself.’ And therefore the hay and stubble of men’s errors that are beside the foundation, on which they are laid, do not debar them from being Christians or members of the Church. A man breaks down the windows of his house; the house stands: he breaks down the roof or the walls, the house yet stands, though deformed. He pulls up the foundation, the house itself falls and ceases to be a house. Now religion which we profess is like a house or building: and some points thereof are like windows, doors, walls, roofs, and some are the very foundation: and the former may be battered, the foundation standing. Again, if the error be directly or by necessary consequent, even in common sense against the foundation, consideration must be had whether the Church or party errs of weakness or malice: If of weakness, the party is to be esteemed as a member of the catholic Church. And thus Paul writes unto the Church of Galatia, as to a church of God, though by false teachers it had been turned away to another Gospel, and embraced the fundamental error of justification by works. But when any man or church shall hold fundamental errors in obstinacy or affected ignorance, we are not then bound to repute them any longer as churches or Christians, but as such to whom condemnation belongs, as Paul shows by the example of Jannes and Jambres. And as Jannes and Jambres, says he, withstood Moses, so do these also resist the truth, men of corrupt minds, reprobate concerning the faith. Yet withal, this caveat must ever be remembered, that we rather condemn the error than the person that errs, because God’s mercy is like a bottomless sea, whereby He works what He will and when He will in the hearts of miserable sinners.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“For the answering of this, we must make a double distinction: one of errors, the other of persons that err. Of errors, some are destroyers of the Faith, some only weakeners of it: A destroyer is that which overturns any fundamental point of religion, which is of that nature, that if it be denied, religion itself is overturned, as the denial of the death of Christ, and the immortality of the soul, justification by works, and such like; And the sum of these fundamental points is comprised in the Creed of the Apostles and the Decalogue. A weakening error is that the holding whereof does not overturn any point in the foundation of salvation, as the error of freewill and sundry such like. This distinction is made by the Holy Ghost, who says expressly that the doctrines of repentance, and faith, and baptisms, and laying on of hands, and the resurrection, and the last Judgment, are the foundation, namely of religion: and again, that Christ is the foundation, and that other doctrines consonant to the Word are as gold and silver laid thereupon. Secondly, persons erring, are of two sorts: Some err of weakness, being carried away by others, or of simple ignorance, not yet being convicted and informed concerning the truth. Some again err of obstinacy or affected ignorance, which having been admonished and convicted, still persevere in their forged opinions. This being said, we now come to the point: If any man or Church shall hold an error of the lighter kind, he still remains a member of the Church of God, and so must be reputed of us. As when a Lutheran shall hold that images are still to be retained in the church, that there is an universal election of all men, etc.; for these and such like opinions may be maintained, the foundation of salvation unrazed. This which I say is flatly avouched by Paul. ‘If any man’ (says he): ‘build on this foundation gold, silver, precious stones, timber, hay, or stubble, his work shall be made manifest by the fire, etc. and if any man’s work burn, he shall loose, but yet he shall be safe himself.’ And therefore the hay and stubble of men’s errors that are beside the foundation, on which they are laid, do not debar them from being Christians or members of the Church. A man breaks down the windows of his house; the house stands: he breaks down the roof or the walls, the house yet stands, though deformed. He pulls up the foundation, the house itself falls and ceases to be a house. Now religion which we profess is like a house or building: and some points thereof are like windows, doors, walls, roofs, and some are the very foundation: and the former may be battered, the foundation standing. Again, if the error be directly or by necessary consequent, even in common sense against the foundation, consideration must be had whether the Church or party errs of weakness or malice: If of weakness, the party is to be esteemed as a member of the catholic Church. And thus Paul writes unto the Church of Galatia, as to a church of God, though by false teachers it had been turned away to another Gospel, and embraced the fundamental error of justification by works. But when any man or church shall hold fundamental errors in obstinacy or affected ignorance, we are not then bound to repute them any longer as churches or Christians, but as such to whom condemnation belongs, as Paul shows by the example of Jannes and Jambres. And as Jannes and Jambres, says he, withstood Moses, so do these also resist the truth, men of corrupt minds, reprobate concerning the faith. Yet withal, this caveat must ever be remembered, that we rather condemn the error than the person that errs, because God’s mercy is like a bottomless sea, whereby He works what He will and when He will in the hearts of miserable sinners.”

— William Perkins, An Exposition of the Creed, on the Church in A Golden Chain, (Cambridge, 1600), pp. 493-94">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+the+answering+of+this%2C+we+must+make+a+double+distinction%3A+one+of+errors%2C+the+other+of+persons+that+err.+Of+errors%2C+some+are+destroyers+of+the+Faith%2C+some+only+weakeners+of+it%3A+A+destroyer+is+that+which+overturns+any+fundamental+point+of+religion%2C+which+is+of+that+nature%2C+that+if+it+be+denied%2C+religion+itself+is+overturned%2C+as+the+denial+of+the+death+of+Christ%2C+and+the+immortality+of+the+soul%2C+justification+by+works%2C+and+such+like%3B+And+the+sum+of+these+fundamental+points+is+comprised+in+the+Creed+of+the+Apostles+and+the+Decalogue.+A+weakening+error+is+that+the+holding+whereof+does+not+overturn+any+point+in+the+foundation+of+salvation%2C+as+the+error+of+freewill+and+sundry+such+like.+This+distinction+is+made+by+the+Holy+Ghost%2C+who+says+expressly+that+the+doctrines+of+repentance%2C+and+faith%2C+and+baptisms%2C+and+laying+on+of+hands%2C+and+the+resurrection%2C+and+the+last+Judgment%2C+are+the+foundation%2C+namely+of+religion%3A+and+again%2C+that+Christ+is+the+foundation%2C+and+that+other+doctrines+consonant+to+the+Word+are+as+gold+and+silver+laid+thereupon.+Secondly%2C+persons+erring%2C+are+of+two+sorts%3A+Some+err+of+weakness%2C+being+carried+away+by+others%2C+or+of+simple+ignorance%2C+not+yet+being+convicted+and+informed+concerning+the+truth.+Some+again+err+of+obstinacy+or+affected+ignorance%2C+which+having+been+admonished+and+convicted%2C+still+persevere+in+their+forged+opinions.+This+being+said%2C+we+now+come+to+the+point%3A+If+any+man+or+Church+shall+hold+an+error+of+the+lighter+kind%2C+he+still+remains+a+member+of+the+Church+of+God%2C+and+so+must+be+reputed+of+us.+As+when+a+Lutheran+shall+hold+that+images+are+still+to+be+retained+in+the+church%2C+that+there+is+an+universal+election+of+all+men%2C+etc.%3B+for+these+and+such+like+opinions+may+be+maintained%2C+the+foundation+of+salvation+unrazed.+This+which+I+say+is+flatly+avouched+by+Paul.+%E2%80%98If+any+man%E2%80%99+%28says+he%29%3A+%E2%80%98build+on+this+foundation+gold%2C+silver%2C+precious+stones%2C+timber%2C+hay%2C+or+stubble%2C+his+work+shall+be+made+manifest+by+the+fire%2C+etc.+and+if+any+man%E2%80%99s+work+burn%2C+he+shall+loose%2C+but+yet+he+shall+be+safe+himself.%E2%80%99+And+therefore+the+hay+and+stubble+of+men%E2%80%99s+errors+that+are+beside+the+foundation%2C+on+which+they+are+laid%2C+do+not+debar+them+from+being+Christians+or+members+of+the+Church.+A+man+breaks+down+the+windows+of+his+house%3B+the+house+stands%3A+he+breaks+down+the+roof+or+the+walls%2C+the+house+yet+stands%2C+though+deformed.+He+pulls+up+the+foundation%2C+the+house+itself+falls+and+ceases+to+be+a+house.+Now+religion+which+we+profess+is+like+a+house+or+building%3A+and+some+points+thereof+are+like+windows%2C+doors%2C+walls%2C+roofs%2C+and+some+are+the+very+foundation%3A+and+the+former+may+be+battered%2C+the+foundation+standing.+Again%2C+if+the+error+be+directly+or+by+necessary+consequent%2C+even+in+common+sense+against+the+foundation%2C+consideration+must+be+had+whether+the+Church+or+party+errs+of+weakness+or+malice%3A+If+of+weakness%2C+the+party+is+to+be+esteemed+as+a+member+of+the+catholic+Church.+And+thus+Paul+writes+unto+the+Church+of+Galatia%2C+as+to+a+church+of+God%2C+though+by+false+teachers+it+had+been+turned+away+to+another+Gospel%2C+and+embraced+the+fundamental+error+of+justification+by+works.+But+when+any+man+or+church+shall+hold+fundamental+errors+in+obstinacy+or+affected+ignorance%2C+we+are+not+then+bound+to+repute+them+any+longer+as+churches+or+Christians%2C+but+as+such+to+whom+condemnation+belongs%2C+as+Paul+shows+by+the+example+of+Jannes+and+Jambres.+And+as+Jannes+and+Jambres%2C+says+he%2C+withstood+Moses%2C+so+do+these+also+resist+the+truth%2C+men+of+corrupt+minds%2C+reprobate+concerning+the+faith.+Yet+withal%2C+this+caveat+must+ever+be+remembered%2C+that+we+rather+condemn+the+error+than+the+person+that+errs%2C+because+God%E2%80%99s+mercy+is+like+a+bottomless+sea%2C+whereby+He+works+what+He+will+and+when+He+will+in+the+hearts+of+miserable+sinners.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+An+Exposition+of+the+Creed%2C+on+the+Church+in+A+Golden+Chain%2C+%28Cambridge%2C+1600%29%2C+pp.+493-94&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fada79be336.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ada79be336.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/arminianism/#:~:text=For%20the%20answering%20of%20this%2C%20we,in%20the%20hearts%20of%20miserable%20sinners&amp;text=For%20the%20answering%20of%20this%2C%20we%20must%20make&amp;text=He%20will%20in%20the%20hearts%20of%20miserable%20sinners" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

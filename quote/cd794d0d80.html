<main class="wrap"><figure class="quote" id="q-cd794d0d80" data-kw="">
<blockquote><p>Ingrossers; that hoard up commodities, and by stopping their propagation raise the price; these are thieves. Many Block-houses in the city, monopolies in the court, garners in the country, can testify, there are now such thieves abroad: we complain of a dearth; sure the heavens are too merciful to us, that are so unmerciful one to another: scarcity comes without God’s sending: who brings it then? even the Devil and his brokers, engrossing misers.

The Common-wealth may often blow her nails, unless she sit by an engrossers fire: her limbs may be faint with hunger, unless she buy graine at an engrosses price. I confess, this is a sin, which the Law takes notice of, but not in the full nature, as theft. The pick-purse (in my opinion) doth not so much hurt, as this general robber; for they rob millions.

These do not with Joseph, buy up the superfluity of plenty, to prevent a dearth; but hoard up the store of plenty, to procure a dearth. Rebels to God, trespassers to nature, thieves to the Common-wealth: if these were apprehended and punished, neither City nor Country should complain as they do. Mean time, the people’s curse is upon them, and I doubt not but God’s plague will follow it; if repentance turn it not away: till when, they are private thieves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-adams.html">Thomas Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The white devil, or The hypocrite uncased: In a sermon preached at Paul’s Cross, March 7. 1612</cite>, (London: Melchisedech Bradwood, 1613), p. 46.</span></figcaption>

<blockquote><p>[F]or it is obvious to every observation, that Families are the Seminaries of Towns, Churches, Countries, and Nations; and are as it were, the Hives, out of which do swarm the materials of greater assemblies; if therefore they be not well Principled therein all their Relations, the rest must needs miscarry. And here I observed, was the true Original of all our Miscarriages and mischiefs abroad; that when young people went out thence, to constitute new families, either as servant, or by marriage, they knew not the particular duties of their New Relations; as Husbands and Wives, as Parents and Children, as Masters and Servants: because for the most part, they were never taught them in the Families from whence they were transplanted. Remove a Crabstock from a barren to a fruitful soil, it will still be a Crabstock, without change of nature.

It is a certain Truth, a thousand times exemplified, That (without special converting grace) he or she shall never be good parents to their children, that were not good children to their parents: Nor they good Governors of servants that were not good servants to their Governors; nor they good Husband or Wife, in their own families that were not good in their former family Relations, as children or servants; Nor lastly, will those who are naughy in their Family Relations be good Neighbours in a Town, good Members of a Church, or good Subjects, or Magistrates in the State: A good man is the proper subject of the goodness of all other Relations: And he only is a good man, that is good in his first Relations; The Spring then of all Reformation, in Townes, Churches, Nations, (next to personal Reformation, where everyone mends one, that is himself) is that which is found in Families. If they were but either well constituted, or well-ordered and reformed, the whole work were done.</p></blockquote>

<blockquote><p>The same multiplication of relics has prevailed in the case of Anthony. By pretending that he is passionate and mischievous, and inflames those who may have given him offence, they have made him an object of dread; from this dread has arisen a superstitious desire to possess his body, and so have a security against harm. Accordingly, the city of Arles had a keen and tedious litigation on the subject with the monks of St Anthony at Vienne. The result was just that which usually takes place in controversies of this description; that is, the whole matter still remains in darkness. Indeed, had any thing been actually proved on the subject, and the truth been made manifest, it would not have been to the advantage of either party. To these two bodies they have added a knee, which is in the Vivarais, in the possession of the Augustins; besides various members which exist at Bourges, Mascon, Dijon, Chalons, Ovron, and Besançon, and others, which are everywhere hawked about by travelling impostors. Of these the number is not small. See what it is to get a name for doing mischief. But for this, that good saint would still be in his tomb, or, at least, concealed in some corner. I have omitted St Petronilla, Peter’s daughter, whose entire body is in the church dedicated to her father, besides some separate remains in the church of Saint Barbara; nevertheless, another body is in the possession of the people of La Maine, in the monastery of the Dominicans, and is held in the very highest repute, because alleged to cure fever. As there were various saints of the name of Susanna, I cannot say whether they have thought proper to give two bodies to any one of them. There is one body of a Susanna at Rome, in the church which bears her name, and there is another at Toulouse. Helen has not been so highly favoured. The Venetians have the body, but in addition to it, she has not gained any superfluous part, with the exception of another head which exists at Cologne in the church of Grisgon. In this respect St Ursula has the advantage of her. For, first, she has her body in the church of St John the Angel; then she has one head at Cologne, and part of another with the Dominicans of La Maine, as also the Dominicans of Tours, and at Bergers. Of her companions, to whom they give the name of the Eleven Thousand Virgins, whatever may be thought, it must, at least, be admitted, that by feigning them to be so numerous, they have enabled themselves to lie with greater freedom. Beside the bones which are at Cologne, and which would be quite sufficient to load an hundred waggons, there is scarcely a city in Europe which does not possess them as the ornament of one or more of their churches. Were I to take a survey of the common herd of saints, I should get entangled in a forest out of which I should never be able to escape. It will be sufficient, therefore, to adduce some specimens, from which a judgment may be formed in regard to the rest. There are two churches in Poictou which contend for the body of Hilary, viz., the cathedral church dedicated to him, and that of the Monks at Selle. The controversy is at present awaiting the visitation which is to take place. In the interval, the idolaters will be forced to worship two bodies as those of the same individual; whereas true believers, feeling no anxiety whatever about his body, will allow it to rest, be it where it may. The body of St Honoratus is at Arles, and is also in the Island of Lerins near Antiboul. Ægidius has one of his bodies at Toulouse, and another in a town at Aquitaine, which is named after him. William is in a monastery of Aquitaine, which is called St William in the Desert, and also in a town of Holstein, which is called Ecrichum, where also his head exists separately, although he has also another head in the suburb of Tours, among the Williamites. What shall I say of Symphorianus, whose body and bones exist in so many places? Also of Lupus, which is at Auxerre, at Sienna, at Lyons, and which they have also pretended to be at Geneva? What likewise shall I say of Ferreolus, whose whole body is at Uzes in Aquitaine, and also at Brioude in Auvergne? Not to betray their lies so openly, they ought, at least, to enter into an arrangement, as the monks of Treves have done, as to their dispute with those of Lodi about the head of Lambert. They have agreed as to the offerings, by compounding, for a certain sum of money, with this condition, however, that the body possessed by the former shall not be publicly exhibited, lest suspicion might be excited by both being seen in two cities so near each other. Thus it is, as I mentioned before at the outset; they never supposed that any observer would appear who would ever dare to open his lips in exposure of such impudence. But any one may ask, how have these fabricators of relics omitted the many notable things connected with the Old Dispensation, since, without any regard to reason, they have heaped up all that ever came into their mind, and, as it were with a breath, called into existence whatever they pleased? To this question I can give no other answer than that they did not think it worth their while, because they had no prospect of deriving much advantage from such relics; and yet they have not forgotten them entirely, for at Rome they gave out that they have the bones of Abraham, Isaac, and Jacob, in the church of Mary supra Minerva. They also boast that in the church of Joannes Lateranensis they have the ark of the covenant and Aaron’s rod within it. The same rod, however, is at Paris in the Holy Chapel, while some fragment of it also is in St Salvator’s in Spain. I omit the inhabitants of Bourdeaux, who maintain that the rod of St Martial, which is exhibited in the church of Severinus, is the identical rod of Aaron. It would seem that they had wished to perform a new miracle as in rivalship of God; for whereas He, by his power, turned the rod into a serpent, so they have now turned it into three rods. Very probably they have many other toys of the same description, but let it suffice merely to have mentioned this, in order to make it manifest that they have been as honest here as in other matters. Now, I would entreat my readers to remember what I said at the outset, viz., that I have not searchers at hand to examine the sacraria of all the regions which I have here mentioned. Wherefore, what I have said of relics must not be taken as if it were a perfect inventory of all the things which might be discovered. I have mentioned only six German cities, or thereabouts, three, as far as I know, of Spain, fifteen of Italy, and between thirty or forty of France; nor am I even acquainted with all the relics that are in them. Let every one, therefore, consider with himself what a farrago there would be if we saw the multitude of relics existing throughout the world described in order, or only in the regions which are known to us, or in which we live. For it is to be particularly observed, that all the relics of Christ and the Apostles exhibited in Europe exist also in Greece, Asia, and other countries where Christian churches are found. Now, I ask, when the Christians of the Eastern Church say that all these things which we pretend to have are in their possession, what decision can we come to upon the subject? If, in answer to them, we aver that this body was brought thither by merchants—that one by monks—and that other by a bishop—that part of the crown of thorns was sent by the Emperor of Constantinople to the King of France—that another was obtained in war—and so on of each, they will laugh and shake their heads. How will the controversy be decided? In doubtful matters we must trust to conjecture, and, therefore, in this respect, they will always get the better of us. For what they produce in their behalf is much more probable than what we can produce in ours. Those who defend relics have certainly a very difficult knot to loose. To draw to a conclusion, I beseech my readers, in the name of God, to give heed to the truth while it lies plainly before them, and recognise how Divine Providence has wonderfully provided, that those who thus wished to mislead the meanest of the people have been so blind that they never thought of using a cloak for their lies, but moving blindfolded, like the Midianites, have set about slaughtering one another. As we see how they are still warring among themselves, and charging each other with falsehood, every man, who is not obstinately determined against the truth, though he may not yet clearly perceive that the worship of any relics, of whatever kind they be, whether genuine or spurious, is execrable idolatry, yet seeing how clear their falsehood is, will have no desire to kiss them any more, and whatever reverence they may have previously inspired, will cease to have any relish for them. The best thing, indeed, would be, as I mentioned at the outset, if, among us who profess the name of Christ, this heathenish custom were abolished, whether they be relics of Christ or of the saints. In as much as they do degenerate into idols, the pollution and defilement which they occasion ought not on any account to be tolerated in the Church. This we have already demonstrated, both by argument and by the testimony of Scripture. If any one is not satisfied with this, let him look to the manner and practice of the ancient fathers, and conform to their example. Many patriarchs, prophets, kings, and other faithful worshippers, existed under the Old Testament. More ceremonies were then appointed by God than it becomes us to observe in the present day. Nay, even burial itself required more show than it now does, because by its figures it represented the resurrection, which was not so clearly revealed to them as it has been to us. But do we read that the saints were ever dug out of their graves, in order that they might be converted into a kind of puppets for children? Was Abraham, the father of all the faithful, thus carried in state, or was Sarah, a princess in the Church of God, taken out of her coffin? Were they not left in quiet along with the other saints, and was not the body of Moses so concealed, by the express will of God, that it never could be discovered? Did not Satan, as Jude tells us, contend for it with the angels? The Lord then withdrew it from the sight of men, and the devil tried to bring it back. God confessedly took it away, in order that it might not become an occasion of idolatry to the Jewish people; and the devil would have brought it back, that he might make it an occasion of idolatry. But that people, it will perhaps be said, was prone to superstition; and what, pray, are we? Is there not in this respect greater perversity among Christians than there was among the Jews? And what do we find to have been the practice of the ancient Church? The faithful, it is true, always exerted themselves to rescue the bodies of martyrs, and prevent their being torn by wild beasts and ravenous birds, so as to secure for them an honourable burial. This they did in the case of John the Baptist and Stephen. They did it, however, for the purpose of committing them to the earth, that they might there rest till the resurrection—not that they might be brought forward into public view in order that all might prostrate themselves before them. This unhappy pomp of consecrating was never introduced into the Church until all things were subverted, and, as it were, profaned, partly by the stupidity or avarice of some prelates and pastors, and partly by the inability of others to withstand a practice which had already begun to prevail. Nay, even the people themselves courted deception, by giving their mind to mere frivolities rather than to the pure worship of God. Wherefore, if a complete reformation of this corrupt practice is desired, it will be necessary to begin at the very foundation, and abolish a practice which was at first instituted improperly, and against all reason. But if any one is not able at one step to make such an advance towards true understanding, let him at least proceed gradually. And, in the first place, let him open his eyes, and exercise his judgment upon any relics which may be presented to him. No one inclined to make the attempt will find it at all difficult; for among the many transparent lies, such as those to which I have already adverted, where will any relics be found whose genuineness amounts to anything like certainty? Nay, at the very time when this little book was passing through the press, I was informed of a third prepuce, which I had not mentioned, and which is shown at Hildesheim. The number of similar follies is indeed infinite, and a careful inspection would discover more than it is possible to enumerate. Let every one, then, be on his guard, and not allow himself to be led along like an irrational animal, and as if he were incapable of discerning any way or path by which he might be guided safely. I recollect when I was a boy how they were wont to do with the images of our parish. When the feast of Stephen drew near, they adorned them all alike with garlands and necklaces, just decking the murderers who stoned Stephen in the same way as they decked Stephen himself. When the old women saw the murderers thus adorned, they imagined that they were Stephen’s companions. Accordingly, every one was presented with his candle. Nay, the same honour was conferred on the devil who contended with Michael, and so on with the rest. And so completely, are they all mixed up and huddled together, that it is impossible to have the bones of any martyr without running the risk of worshipping the bones of some thief or robber, or, it may be, the bones of a dog, or a horse, or an ass. Nor can the Virgin Mary’s ring, or comb, or girdle, be venerated without the risk of venerating some part of the dress of a strumpet. Let every one, therefore, who is inclined, guard against this risk. Henceforth no man will be able to excuse himself by pretending ignorance. John Calvin, Theodore Beza, and Henry Beveridge, Tracts Relating to the Reformation, vol. 1 (Edinburgh: Calvin Translation Society, 1844), 334–341. John Calvin, Theodore Beza, and Henry Beveridge, Tracts Relating to the Reformation, vol. 1 (Edinburgh: Calvin Translation Society, 1844), 332–334.</p></blockquote>

r head which exists at Cologne in the church of Grisgon. In this respect St Ursula has the advantage of her. For, first, she has her body in the church of St John the Angel; then she has one head at Cologne, and part of another with the Dominicans of La Maine, as also the Dominicans of Tours, and at Bergers. Of her companions, to whom they give the name of the Eleven Thousand Virgins, whatever may be thought, it must, at least, be admitted, that by feigning them to be so numerous, they have enabled themselves to lie with greater freedom. Beside the bones which are at Cologne, and which would be quite sufficient to load an hundred waggons, there is scarcely a city in Europe which does not possess them as the ornament of one or more of their churches. Were I to take a survey of the common herd of saints, I should get entangled in a forest out of which I should never be able to escape. It will be sufficient, therefore, to adduce some specimens, from which a judgment may be formed in regard to the rest. There are two churches in Poictou which contend for the body of Hilary, viz., the cathedral church dedicated to him, and that of the Monks at Selle. The controversy is at present awaiting the visitation which is to take place. In the interval, the idolaters will be forced to worship two bodies as those of the same individual; whereas true believers, feeling no anxiety whatever about his body, will allow it to rest, be it where it may. The body of St Honoratus is at Arles, and is also in the Island of Lerins near Antiboul. Ægidius has one of his bodies at Toulouse, and another in a town at Aquitaine, which is named after him. William is in a monastery of Aquitaine, which is called St William in the Desert, and also in a town of Holstein, which is called Ecrichum, where also his head exists separately, although he has also another head in the suburb of Tours, among the Williamites. What shall I say of Symphorianus, whose body and bones exist in so many places? Also of Lupu .+William+is+in+a+monastery+of+Aquitaine%2C+which+is+called+St+William+in+the+Desert%2C+and+also+in+a+town+of+Holstein%2C+which+is+called+Ecrichum%2C+where+also+his+head+exists+separately%2C+although+he+has+also+another+head+in+the+suburb+of+Tours%2C+among+the+Williamites.+What+shall+I+say+of+Symphorianus%2C+whose+body+and+bones+exist+in+so+many+places%3F+Also+of+Lupus%2C+which+is+at+Auxerre%2C+at+Sienna%2C+at+Lyons%2C+and+which+they+have+also+pretended+to+be+at+Geneva%3F+What+likewise+shall+I+say+of+Ferreolus%2C+whose+whole+body+is+at+Uzes+in+Aquitaine%2C+and+also+at+Brioude+in+Auvergne%3F+Not+to+betray+their+lies+so+openly%2C+they+ought%2C+at+least%2C+to+enter+into+an+arrangement%2C+as+the+monks+of+Treves+have+done%2C+as+to+their+dispute+with+those+of+Lodi+about+the+head+of+Lambert.+They+have+agreed+as+to+the+offerings%2C+by+compounding%2C+for+a+certain+sum+of+money%2C+with+this+condition%2C+however%2C+that+the+body+possessed+by+the+former+shall+not+be+publicly+exhibited%2C+lest+suspicion+might+be+excited+by+both+being+seen+in+two+cities+so+near+each+other.+Thus+it+is%2C+as+I+mentioned+before+at+the+outset%3B+they+never+supposed+that+any+observer+would+appear+who+would+ever+dare+to+open+his+lips+in+exposure+of+such+impudence.+But+any+one+may+ask%2C+how+have+these+fabricators+of+relics+omitted+the+many+notable+things+connected+with+the+Old+Dispensation%2C+since%2C+without+any+regard+to+reason%2C+they+have+heaped+up+all+that+ever+came+into+their+mind%2C+and%2C+as+it+were+with+a+breath%2C+called+into+existence+whatever+they+pleased%3F+To+this+question+I+can+give+no+other+answer+than+that+they+did+not+think+it+worth+their+while%2C+because+they+had+no+prospect+of+deriving+much+advantage+from+such+relics%3B+and+yet+they+have+not+forgotten+them+entirely%2C+for+at+Rome+they+gave+out+that+they+have+the+bones+of+Abraham%2C+Isaac%2C+and+Jacob%2C+in+the+church+of+Mary+supra+Minerva.+They+also+boast+that+in+the+church+of+Joannes+Lateranensis+they+have+the+ark+of+the+covenant+and+Aaron%E2%80%99s+rod+within+it.+The+same+rod%2C+however%2C+is+at+Paris+in+the+Holy+Chapel%2C+while+some+fragment+of+it+also+is+in+St+Salvator%E2%80%99s+in+Spain.+I+omit+the+inhabitants+of+Bourdeaux%2C+who+maintain+that+the+rod+of+St+Martial%2C+which+is+exhibited+in+the+church+of+Severinus%2C+is+the+identical+rod+of+Aaron.+It+would+seem+that+they+had+wished+to+perform+a+new+miracle+as+in+rivalship+of+God%3B+for+whereas+He%2C+by+his+power%2C+turned+the+rod+into+a+serpent%2C+so+they+have+now+turned+it+into+three+rods.+Very+probably+they+have+many+other+toys+of+the+same+description%2C+but+let+it+suffice+merely+to+have+mentioned+this%2C+in+order+to+make+it+manifest+that+they+have+been+as+honest+here+as+in+other+matters.+Now%2C+I+would+entreat+my+readers+to+remember+what+I+said+at+the+outset%2C+viz.%2C+that+I+have+not+searchers+at+hand+to+examine+the+sacraria+of+all+the+regions+which+I+have+here+mentioned.+Wherefore%2C+what+I+have+said+of+relics+must+not+be+taken+as+if+it+were+a+perfect+inventory+of+all+the+things+which+might+be+discovered.+I+have+mentioned+only+six+German+cities%2C+or+thereabouts%2C+three%2C+as+far+as+I+know%2C+of+Spain%2C+fifteen+of+Italy%2C+and+between+thirty+or+forty+of+France%3B+nor+am+I+even+acquainted+with+all+the+relics+that+are+in+them.+Let+every+one%2C+therefore%2C+consider+with+himself+what+a+farrago+there+would+be+if+we+saw+the+multitude+of+relics+existing+throughout+the+world+described+in+order%2C+or+only+in+the+regions+which+are+known+to+us%2C+or+in+which+we+live.+For+it+is+to+be+particularly+observed%2C+that+all+the+relics+of+Christ+and+the+Apostles+exhibited+in+Europe+exist+also+in+Greece%2C+Asia%2C+and+other+countries+where+Christian+churches+are+found.+Now%2C+I+ask%2C+when+the+Christians+of+the+Eastern+Church+say+that+all+these+things+which+we+pretend+to+have+are+in+their+possession%2C+what+decision+can+we+come+to+upon+the+subject%3F+If%2C+in+answer+to+them%2C+we+aver+that+this+body+was+brought+thither+by+merchants%E2%80%94that+one+by+monks%E2%80%94and+that+other+by+a+bishop%E2%80%94that+part+of+the+crown+of+thorns+was+sent+by+the+Emperor+of+Constantinople+to+the+King+of+France%E2%80%94that+another+was+obtained+in+war%E2%80%94and+so+on+of+each%2C+they+will+laugh+and+shake+their+heads.+How+will+the+controversy+be+decided%3F+In+doubtful+matters+we+must+trust+to+conjecture%2C+and%2C+therefore%2C+in+this+respect%2C+they+will+always+get+the+better+of+us.+For+what+they+produce+in+their+behalf+is+much+more+probable+than+what+we+can+produce+in+ours.+Those+who+defend+relics+have+certainly+a+very+difficult+knot+to+loose.+To+draw+to+a+conclusion%2C+I+beseech+my+readers%2C+in+the+name+of+God%2C+to+give+heed+to+the+truth+while+it+lies+plainly+before+them%2C+and+recognise+how+Divine+Providence+has+wonderfully+provided%2C+that+those+who+thus+wished+to+mislead+the+meanest+of+the+people+have+been+so+blind+that+they+never+thought+of+using+a+cloak+for+their+lies%2C+but+moving+blindfolded%2C+like+the+Midianites%2C+have+set+about+slaughtering+one+another.+As+we+see+how+they+are+still+warring+among+themselves%2C+and+charging+each+other+with+falsehood%2C+every+man%2C+who+is+not+obstinately+determined+against+the+truth%2C+though+he+may+not+yet+clearly+perceive+that+the+worship+of+any+relics%2C+of+whatever+kind+they+be%2C+whether+genuine+or+spurious%2C+is+execrable+idolatry%2C+yet+seeing+how+clear+their+falsehood+is%2C+will+have+no+desire+to+kiss+them+any+more%2C+and+whatever+reverence+they+may+have+previously+inspired%2C+will+cease+to+have+any+relish+for+them.+The+best+thing%2C+indeed%2C+would+be%2C+as+I+mentioned+at+the+outset%2C+if%2C+among+us+who+profess+the+name+of+Christ%2C+this+heathenish+custom+were+abolished%2C+whether+they+be+relics+of+Christ+or+of+the+saints.+In+as+much+as+they+do+degenerate+into+idols%2C+the+pollution+and+defilement+which+they+occasion+ought+not+on+any+account+to+be+tolerated+in+the+Church.+This+we+have+already+demonstrated%2C+both+by+argument+and+by+the+testimony+of+Scripture.+If+any+one+is+not+satisfied+with+this%2C+let+him+look+to+the+manner+and+practice+of+the+ancient+fathers%2C+and+conform+to+their+example.+Many+patriarchs%2C+prophets%2C+kings%2C+and+other+faithful+worshippers%2C+existed+under+the+Old+Testament.+More+ceremonies+were+then+appointed+by+God+than+it+becomes+us+to+observe+in+the+present+day.+Nay%2C+even+burial+itself+required+more+show+than+it+now+does%2C+because+by+its+figures+it+represented+the+resurrection%2C+which+was+not+so+clearly+revealed+to+them+as+it+has+been+to+us.+But+do+we+read+that+the+saints+were+ever+dug+out+of+their+graves%2C+in+order+that+they+might+be+converted+into+a+kind+of+puppets+for+children%3F+Was+Abraham%2C+the+father+of+all+the+faithful%2C+thus+carried+in+state%2C+or+was+Sarah%2C+a+princess+in+the+Church+of+God%2C+taken+out+of+her+coffin%3F+Were+they+not+left+in+quiet+along+with+the+other+saints%2C+and+was+not+the+body+of+Moses+so+concealed%2C+by+the+express+will+of+God%2C+that+it+never+could+be+discovered%3F+Did+not+Satan%2C+as+Jude+tells+us%2C+contend+for+it+with+the+angels%3F+The+Lord+then+withdrew+it+from+the+sight+of+men%2C+and+the+devil+tried+to+bring+it+back.+God+confessedly+took+it+away%2C+in+order+that+it+might+not+become+an+occasion+of+idolatry+to+the+Jewish+people%3B+and+the+devil+would+have+brought+it+back%2C+that+he+might+make+it+an+occasion+of+idolatry.+But+that+people%2C+it+will+perhaps+be+said%2C+was+prone+to+superstition%3B+and+what%2C+pray%2C+are+we%3F+Is+there+not+in+this+respect+greater+perversity+among+Christians+than+there+was+among+the+Jews%3F+And+what+do+we+find+to+have+been+the+practice+of+the+ancient+Church%3F+The+faithful%2C+it+is+true%2C+always+exerted+themselves+to+rescue+the+bodies+of+martyrs%2C+and+prevent+their+being+torn+by+wild+beasts+and+ravenous+birds%2C+so+as+to+secure+for+them+an+honourable+burial.+This+they+did+in+the+case+of+John+the+Baptist+and+Stephen.+They+did+it%2C+however%2C+for+the+purpose+of+committing+them+to+the+earth%2C+that+they+might+there+rest+till+the+resurrection%E2%80%94not+that+they+might+be+brought+forward+into+public+view+in+order+that+all+might+prostrate+themselves+before+them.+This+unhappy+pomp+of+consecrating+was+never+introduced+into+the+Church+until+all+things+were+subverted%2C+and%2C+as+it+were%2C+profaned%2C+partly+by+the+stupidity+or+avarice+of+some+prelates+and+pastors%2C+and+partly+by+the+inability+of+others+to+withstand+a+practice+which+had+already+begun+to+prevail.+Nay%2C+even+the+people+themselves+courted+deception%2C+by+giving+their+mind+to+mere+frivolities+rather+than+to+the+pure+worship+of+God.+Wherefore%2C+if+a+complete+reformation+of+this+corrupt+practice+is+desired%2C+it+will+be+necessary+to+begin+at+the+very+foundation%2C+and+abolish+a+practice+which+was+at+first+instituted+improperly%2C+and+against+all+reason.+But+if+any+one+is+not+able+at+one+step+to+make+such+an+advance+towards+true+understanding%2C+let+him+at+least+proceed+gradually.+And%2C+in+the+first+place%2C+let+him+open+his+eyes%2C+and+exercise+his+judgment+upon+any+relics+which+may+be+presented+to+him.+No+one+inclined+to+make+the+attempt+will+find+it+at+all+difficult%3B+for+among+the+many+transparent+lies%2C+such+as+those+to+which+I+have+already+adverted%2C+where+will+any+relics+be+found+whose+genuineness+amounts+to+anything+like+certainty%3F+Nay%2C+at+the+very+time+when+this+little+book+was+passing+through+the+press%2C+I+was+informed+of+a+third+prepuce%2C+which+I+had+not+mentioned%2C+and+which+is+shown+at+Hildesheim.+The+number+of+similar+follies+is+indeed+infinite%2C+and+a+careful+inspection+would+discover+more+than+it+is+possible+to+enumerate.+Let+every+one%2C+then%2C+be+on+his+guard%2C+and+not+allow+himself+to+be+led+along+like+an+irrational+animal%2C+and+as+if+he+were+incapable+of+discerning+any+way+or+path+by+which+he+might+be+guided+safely.+I+recollect+when+I+was+a+boy+how+they+were+wont+to+do+with+the+images+of+our+parish.+When+the+feast+of+Stephen+drew+near%2C+they+adorned+them+all+alike+with+garlands+and+necklaces%2C+just+decking+the+murderers+who+stoned+Stephen+in+the+same+way+as+they+decked+Stephen+himself.+When+the+old+women+saw+the+murderers+thus+adorned%2C+they+imagined+that+they+were+Stephen%E2%80%99s+companions.+Accordingly%2C+every+one+was+presented+with+his+candle.+Nay%2C+the+same+honour+was+conferred+on+the+devil+who+contended+with+Michael%2C+and+so+on+with+the+rest.+And+so+completely%2C+are+they+all+mixed+up+and+huddled+together%2C+that+it+is+impossible+to+have+the+bones+of+any+martyr+without+running+the+risk+of+worshipping+the+bones+of+some+thief+or+robber%2C+or%2C+it+may+be%2C+the+bones+of+a+dog%2C+or+a+horse%2C+or+an+ass.+Nor+can+the+Virgin+Mary%E2%80%99s+ring%2C+or+comb%2C+or+girdle%2C+be+venerated+without+the+risk+of+venerating+some+part+of+the+dress+of+a+strumpet.+Let+every+one%2C+therefore%2C+who+is+inclined%2C+guard+against+this+risk.+Henceforth+no+man+will+be+able+to+excuse+himself+by+pretending+ignorance.+John+Calvin%2C+Theodore+Beza%2C+and+Henry+Beveridge%2C+Tracts+Relating+to+the+Reformation%2C+vol.+1+%28Edinburgh%3A+Calvin+Translation+Society%2C+1844%29%2C+334%E2%80%93341.+John+Calvin%2C+Theodore+Beza%2C+and+Henry+Beveridge%2C+Tracts+Relating+to+the+Reformation%2C+vol.+1+%28Edinburgh%3A+Calvin+Translation+Society%2C+1844%29%2C+332%E2%80%93334.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+An+Admonition+Showing+the+Advantages+Which+Christendom+Might+Derive+From+an+Inventory+of+Relics%2C+Vol.+1+%7C+Edinburgh%3A+Calvin+Translation+Society%2C+1844%2C+pp.+334%E2%80%9341&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa279dce91a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a279dce91a.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/05/calvin-time-for-an-inventory-14/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

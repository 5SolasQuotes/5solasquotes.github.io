<main class="wrap"><figure class="quote" id="q-1ee1a05ede" data-kw="">
<blockquote><p>Christ Jesus has so far forth set down and stablished a perfect platform of Church-government in all morals, not only both for the inward, but also for the outward and external government of his House, that He has left no liberty or latitude to magistrates or Churches whatsoever to choose and settle such an orderly form of Church-government or discipline, as is most suitable to their particular civil-government, laws, manners and customs, so this form be not repugnant to the Word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/degrees-of-impurities.html">London Ministers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jus Divinum, or The Divine Right of Church Government (London, 1646)</cite>, The Divine Right of Church Government, … (London, 1646), Introduction | Section 1, p. 1</span></figcaption>

</figure><figure class="quote" id="q-d4a1f8a400" data-kw="">
<blockquote><p>Divine worship is any action or service that is immediately and directly performed unto God Himself, whether the true God or a false, whether commanded by divine authority, imposed by human, or assumed upon our own heads and pleasures. For in this latitude of sense is divine worship to be conceived, that it may comprehend under it both true and false worship.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-6efcea5a25" data-kw="Mary Queen of Heaven Idolatry Paganism">

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b48112252c" data-kw="Mary Queen of Heaven Mediator">
<blockquote><p>In brief, there is scarcely one title given to Jesus Christ, nor one which prophesies of Him, which they do not attribute to her, calling her Queen of Heaven, Porter of Paradise, their life, their sweetness, treasurer of grace, the refuge and advocate of sinners—thus dishonoring Him and also making the poor people understand that they honor her contrary to the whole Word of God and the writings of the most ancient teachers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, 1560, Point 7, §4: The Papists Abolish the True Intercession of Jesus Christ</span></figcaption>

— Theodore Beza, The Christian Faith, 1560, Point 7, §4: The Papists Abolish the True Intercession of Jesus Christ">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+brief%2C+there+is+scarcely+one+title+given+to+Jesus+Christ%2C+nor+one+which+prophesies+of+Him%2C+which+they+do+not+attribute+to+her%2C+calling+her+Queen+of+Heaven%2C+Porter+of+Paradise%2C+their+life%2C+their+sweetness%2C+treasurer+of+grace%2C+the+refuge+and+advocate+of+sinners%E2%80%94thus+dishonoring+Him+and+also+making+the+poor+people+understand+that+they+honor+her+contrary+to+the+whole+Word+of+God+and+the+writings+of+the+most+ancient+teachers.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+The+Christian+Faith%2C+1560%2C+Point+7%2C+%C2%A74%3A+The+Papists+Abolish+the+True+Intercession+of+Jesus+Christ&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb48112252c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b48112252c.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-972b5259c7" data-kw="Mary Queen of Heaven Submission">

<blockquote><p>That is, they sacrifice to the sun, moon and stars, which they called the queen of heaven, Jer 44:17, 2Ki 23:5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geneva-translators.html">Geneva translators</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Geneva Bible</cite>, 1599, marginal note on Jeremiah 7:18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a> › <a href="../topics/rome/mary-and-the-saints/mary-is-not-the-queen-of-heaven.html">Mary is not the queen of heaven</a></span></div>

</figure><figure class="quote" id="q-5b36801b03" data-kw="Mary Queen of Heaven">
<blockquote><p>In fact it contradicts the nature of deceased saints that they should be present in and care for diverse and widely scattered places at one and the same time, as when the [papal teachers] want to put one and the same saint in charge of diverse and widely scattered places. Think of Saint James for the Spanish, who dwell in Europe, India, and America. Or Saints Dominic and Francis, etc., for all their monasteries spread across the whole globe. Or even the blessed Virgin, whom they call Queen of Heaven, Mistress of the Earth, and Star of the Sea (Stella Maris)—even though this is a wrong rendering of Drop of the Sea (Stilla maris)—since it is fitting only for God to “look down from the heavens and behold all the sons of men, and from his dwelling-place to look forth upon all the inhabitants of the earth” (Psalm 33:13–14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, Disp. 40, On the Church (vol. 2)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a> › <a href="../topics/worship/idolatry-and-images/worship-of-saints-mary-and-angels-latria-dulia-hyperdulia.html">Worship of saints, Mary and angels (latria, dulia, hyperdulia)</a></span><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a> › <a href="../topics/rome/mary-and-the-saints/mary-is-not-the-queen-of-heaven.html">Mary is not the queen of heaven</a></span></div>

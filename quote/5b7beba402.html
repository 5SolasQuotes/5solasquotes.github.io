<main class="wrap"><figure class="quote" id="q-5b7beba402" data-kw="">
<blockquote><p>As for repentance and new obedience; there is as much difference between them and faith, in regard of its peculiar office, in this latter [New] Covenant; so much more between them and works in the former [Old Covenant]. 1. Between them and faith, in the point of justification, or the discharge of a sinner from the guilt of his sins; for that, howsoever they are both required as conditions to be necessarily performed by all those that expect life, or pardon of sin, and salvation by Christ; yet neither of them comes in, as having any hand in the business of our justification, or discharge of us from the guilt of our sin; because that neither do they cast ought in toward the discharge of our debt, nor have they any peculiar act in the application of, or special relation unto, that whereby our debt is discharged. Whereas our faith, though it afford not the least mite of itself toward the making up of that price wherewith our debt is to be discharged, yet it is that whereby we receive Jesus Christ (Jn. 1:12) and in Him and with Him the price by Him paid for us, and whereby we trust to Him and rely upon Him for the discharge of our debt by the merit of his sufferings: in regard whereof it is called, as ‘faith on Christ’ (Acts 20:21; 26:18), so more specially, on his blood. (Rom. 3:25)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Shadows without Substance, or Pretended New Lights: together with the impieties and blasphemies that lurk under them, further discovered and drawn forth into the light: in way of rejoinder unto Mr. John Saltmarsh’s Reply entitled Shadows Flying Away… (London: Bostock, 1646)</cite>, p. 47</span></figcaption>

<blockquote><p>The second head is the will of God, who will have us justified with the alone condition of faith. The Adversary [Bellarmine] answers that it contradicts the Scripture, which lays down also the condition of repentance. Answer: 1. Repentance is the condition of faith and of the person justified, but not properly of justification. 2. It is one thing to treat of the condition of justification, but another thing of the cause and instrument thereof: for a condition notes a consequent, or effect: but a cause, the antecedent or efficient.</p></blockquote>

<blockquote><p>2nd Problem: Whether faith precedes regeneration, at least repentance? Response: The former is denied; the latter is affirmed concerning faith in the first act, which in the order of nature precedes repentance considered both in the first act and in the second act. But it is denied concerning faith in the second act, at least the complete or formed second act. For such faith is necessarily preceded in the order of nature and of time by certain acts of repentance. This distinction observed will contribute not a little to reconciling the dogmatic and practical theologians.</p></blockquote>

</figure><figure class="quote" id="q-0b63c82837" data-kw="">
<blockquote><p>First, the word [justificare] does imply an accounting just: And this is acknowledged by the Papists themselves as more frequent though they plead much for such a sense as to make just. Now the truth is there needs not much quarrel even about that signification, though the Scripture does not manifest it: For we confess that he is made just, who is justified, and that not only in respect of the inward renovation of a man, but also in respect of justification; for God does not account him just who is not so, and certainly to esteem a man just without righteousness, is as absurd as to account a man learned without learning, or the wall white without whiteness; only we say this righteousness that does to make a man just, is not inherent in him, but reckoned to him by the satisfaction of another: for a man is accounted righteous two ways, either when he is not guilty of the crime charged upon him, or when he does make satisfaction; and in this latter sense by Christ we become righteous. 2. So that if the word should signify as much as to make righteous, as to sanctify does signify to make holy, still we could grant it, though not in the Popish way; and indeed the apostle, Rom. 5, says many are made righteous by the second Adam, which if not meant of inherent holiness, does imply that the righteousness we have by Christ is not merely declarative, but also constitutive; and indeed one is in order before the other, for a man must be righteous before he can be pronounced or declared so to be. But the Hebrew word does not signify this sense primarily; for whereas the Hebrew word in [the tense] qal does signify to be righteous by a positive quality; The word in hiphil, according to that rule in grammar, signifies to attribute and account this righteousness unto a man by some words, or other testimony, even as the word that in qal signifies to be wicked, does in hiphil signify to condemn and judge a man as wicked, so that there are these two things in justifying, whereof one is the ground of the other, first to make righteous, and then to pronounce or declare so. From these two follows a third, which is to deal with a man so justified as a just man, so that condemnation, crimes, reproach and fear shall be taken away from him. This declares the admirable benefit of being justified before God, for when this is done, Rom. 5:1, we have peace with God, Eph. 3, we come with boldness into his presence, and open face; so that unbelief and slavish fears in the godly are great enemies to this grace of justification; yea, they are a reproach and dishonor to it. Thou thinkest if thy heart were not conscious to sin, if nothing but holiness were in thee, thou wouldest be bold, thou wouldst not fear or be troubled, but thou dost not consider that God walks towards thee as a righteous man, looks upon thee as so, so that if Christ be bold thou mayst, if God will not reject Christ, or thy sins cannot condemn Him, so neither will God reject thee, or shall thy sins overwhelm thee; this is the sweet consolation of the Gospel, to a sinner broken-hearted, who would give a world for a perfect righteousness to make him accepted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated... (London: Miller, 1651), Lecture 1</cite>, pp. 6-8</span></figcaption>

ignifies+to+attribute+and+account+this+righteousness+unto+a+man+by+some+words%2C+or+other+testimony%2C+even+as+the+word+that+in+qal+signifies+to+be+wicked%2C+does+in+hiphil+signify+to+condemn+and+judge+a+man+as+wicked%2C+so+that+there+are+these+two+things+in+justifying%2C+whereof+one+is+the+ground+of+the+other%2C+first+to+make+righteous%2C+and+then+to+pronounce+or+declare+so.+From+these+two+follows+a+third%2C+which+is+to+deal+with+a+man+so+justified+as+a+just+man%2C+so+that+condemnation%2C+crimes%2C+reproach+and+fear+shall+be+taken+away+from+him.+This+declares+the+admirable+benefit+of+being+justified+before+God%2C+for+when+this+is+done%2C+Rom.+5%3A1%2C+we+have+peace+with+God%2C+Eph.+3%2C+we+come+with+boldness+into+his+presence%2C+and+open+face%3B+so+that+unbelief+and+slavish+fears+in+the+godly+are+great+enemies+to+this+grace+of+justification%3B+yea%2C+they+are+a+reproach+and+dishonor+to+it.+Thou+thinkest+if+thy+heart+were+not+conscious+to+sin%2C+if+nothing+but+holiness+were+in+thee%2C+thou+wouldest+be+bold%2C+thou+wouldst+not+fear+or+be+troubled%2C+but+thou+dost+not+consider+that+God+walks+towards+thee+as+a+righteous+man%2C+looks+upon+thee+as+so%2C+so+that+if+Christ+be+bold+thou+mayst%2C+if+God+will+not+reject+Christ%2C+or+thy+sins+cannot+condemn+Him%2C+so+neither+will+God+reject+thee%2C+or+shall+thy+sins+overwhelm+thee%3B+this+is+the+sweet+consolation+of+the+Gospel%2C+to+a+sinner+broken-hearted%2C+who+would+give+a+world+for+a+perfect+righteousness+to+make+him+accepted.%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+The+True+Doctrine+of+Justification+Asserted+%26+Vindicated...+%28London%3A+Miller%2C+1651%29%2C+Lecture+1%2C+pp.+6-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0b63c82837.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0b63c82837.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=First%2C%20the%20word%20%5Bjustificare%5D%20does%20imply,perfect%20righteousness%20to%20make%20him%20accepted&amp;text=First%2C%20the%20word%20%5Bjustificare%5D%20does%20imply%20an%20accounting&amp;text=for%20a%20perfect%20righteousness%20to%20make%20him%20accepted" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Repentance goes before justification, even as faith and hope; for of the Baptist it is said, that he preached the baptism of repentance for the remission of sins, Mk. 1:4; Lk. 3:3. But regeneration follows justification; for, being justified, we receive the Spirit of sanctification, whereby we are renewed, and, as it were, find a new creature begun even in this life. Repentance is the cause, regeneration is the effect; for therefore God does renew us in Christ, and make us new men, because we repent us of our old life, and begin to be wise after sin committed. Notwithstanding in the middle place, betwixt repentance and regeneration, comes in justification, when as God does of his mere mercy account and repute us as just. The name of repentance implies sorrow, but the name of regeneration gladness. To conclude, the points of repentance, as whence it proceeds and whereunto it tends, they are deeds, the evil or sin committed, and the good which ought to be practised; but the bounds of regeneration are qualities — inherent corruption, and sanctity or holiness, which is wrought in us; the old man and new man renewed in Christ. …For every change of the mind is not to be deemed forthwith regeneration, but there are certain changes of man’s mind which go before regeneration, and which prepare the mind, and so the whole man, unto regeneration, and to that new creation; in which kind repentance is a special grace. These things are to be distinguished not in time but in nature; for at that very same instant, we believe, and be effectually called, and do repent, and be justified, and be regenerate.</p></blockquote>

<blockquote><p>Preach the word.” 2 Timothy 4:2.

THE theme presented in this clause of the great Apostle’s charge to Timothy, has suggested itself to my mind as eminently appropriate to the present occasion. The Gospel ministry, whether viewed with reference to the Divine warrant upon which it rests; the influence of the Holy Spirit upon which its efficiency depends; the transcendent importance of those truths which comprise its subject-matter; or the momentous issues suspended upon their reception or rejection, – rises in dignity and importance above all other functions exercised by man.

Any theory of preaching, which fails to assert its superiority to all other institutions, or which would subordinate it to any other agency whatever, we reject, as not only essentially defective, but impious and dishonouring to God, in its attempt to degrade that ordinance which Himself has instituted, for the accomplishment formed by the Creator merely to enhance, by the comparison, the grandeur of its ampler proportions, so does the preaching of the Word rise above all other instrumentalities of moral and spiritual power — shining among them not as the “Moon amid the lesser fires of the night,” but like the sun, in whose glory that of the stars is obscured — in the splendour of whose burning their feebler radiance is quenched.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-r-w-sloane.html">J. R. W. Sloane</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Word: A Discourse, Delivered at the Opening of the Reformed Presbyterian Synod, in Allegheny, Pa., on Tuesday Evening, May 24, 1859</cite>, (New York: Thomas Holman, 1859), pp 3-4.</span></figcaption>

<blockquote><p>If Paul in preaching had either substituted human wisdom for the doctrine of the cross, or had so presented that doctrine as to turn it into a philosophy, his preaching would have been powerless. It would lose its divine element and become nothing more than human wisdom. Whatever obscures the cross deprives the gospel of its power.</p></blockquote>

<blockquote><p>The presbyterians deny not but private men may preach in some cases. None that fear God do desire any to bury their talent, nor would hinder men from doing the work of God. But they would have bona bene [good things done well], God’s work done in God’s order. On these conditions we [congregationalists of Baxter’s stripe] allow private men to preach.

1. If they do it but ex charitate [out of charity], and pretend not to the ministerial office.

2. And if they do it occasionally, and not as men separated to that work as their calling (for then they become ministers indeed while they disclaim it in name).

3. If they do it not needlessly, to a proud ostentation of their parts, but only when abler men, or ministers, are not to be had or else [are] on some urgent weighty cause.

4. If they make not themselves the judges of their own fitness, but expect the approbation of the judicious, faithful, concordant ministers that know them.

5. If they undertake no more than they can perform, and suppose not themselves fitter than they are, and so run not beyond their knowledge, nor dishonor not the work of God.

6. If they thrust not themselves into any church to preach without a call, nor ordinarily without the pastor’s consent.

7. If they do it not unseasonably when by offending they are likely to do more hurt than good.

8. If in the manner, season and continuance they submit to the guidance of the pastors of the Church (if it be more than ordinary teaching, and not such as every able master of a family may there do). With these cautions we grant that private men may preach; many episcopal divines grant it: and the presbyterians ordinarily permit it in their expectants that are trained up for the ministry… And, says Dr. Fulke, Demetrius himself does seem to allow that when no bishop was present, a layman might preach: Eusebius, Ecclesiastical History, bk. 6, ch. 19 [sect. 15-18]. But that every proud unworthy man and every seducing heretick should preach, yea and thrust himself into other men’s charges, or that any should preach besides the forementioned rules, this we deny, and take it for a dangerous usurpation. But are we not agreed [with the presbyterians] in this? Hear and judge: Mr. [John] Cotton so downright denies ordinary private men to prophesy, interpreting 1 Cor. 14:31 of extraordinarily gifted prophets (of which see his Keys, pp. 20-21) that Mr. [Thomas] Goodwin and Mr. [Philip] Nye thought meet to signify some dissent, ‘Preface’, p. 6. And yet they grant, that this must be performed by private men:

1. Only occasionally, not in an ordinary course.

2. By men of such abilities as are fit for office.

3. And not assuming this of themselves, but judged such by those that have the power, and so allowed and designed to it. And, 4. So as their doctrine be subjected (for the judging of it) in an especial manner to the teaching elders of that church. And I think that this is enough to signify that here we shall have no cause of a breach with them [presbyterians]. Mr. [John] Norton speaks to the same purpose, pp. 123-25, and joins with Mr. Cotton in denying prophesy to private men and expounding 1 Cor. 14 of extraordinarily gifted prophets only: In this therefore doctrinally we agree [with the presbyterians].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Church Concord</cite>, … (1655 / 1667; London: 1691), ch. 10, difference 8, pp. 38-39</span></figcaption>

<blockquote><p>2. It [the form of sound words] is our godly forefathers bequest which they have conveyed to us their posterity; should not our care be alike to transmit it to ours? Ps. 78:3-4.

3. The martyrs have sealed it with their blood, which we shall prove guilty of through our unfaithfulness, as they are accounted to tread underfoot the Son of God, and to account his blood an unholy thing who desert his truth, and despited the spirit of his grace, Heb. 10:29.

4. It will be the best part of our children’s inheritance: as the Law was Jacob’s, Dt. 33:4. Look to it therefore, that at our last reckoning our forefathers be not ashamed of us, and our posterity at the Resurrection do no not rise up, and, I say not, call us blessed, as Prov. 31:28, but curse us for betraying God’s truth, and our trust, and their and our own souls altogether.

5. And remember from this word [Greek] hold fast, that it is not the catching at what we have not, but only the holding fast what through God’s mercy we yet have; and therefore as Christ says to the Church of Philadelphia, ‘Hold fast what thou hast, let no man take away thy crown.&#x27;</p></blockquote>

%20It%20%5Bthe%20form%20of%20sound,no%20man%20take%20away%20thy%20crown&amp;text=2.%20It%20%5Bthe%20form%20of%20sound%20words%5D%20is&amp;text=hast%2C%20let%20no%20man%20take%20away%20thy%20crown" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>1. Jesus preached peace (Eph. 2:17); don’t be a better preacher than Jesus.

2. Preach first to yourself.

3. Preach from your heart, not only to their heart.

4. Leverage your own distress.

5. How much do you have to hate the people to try to impress them rather than help them?

6. A pervasive tone of encouragement.

7. Vivid imagery. Visceral, sensory. Littered with analogues.

8. They’re more distressed than they’re revealing.

9. The power is in the Word, not your cleverness.

10. The Spirit works with your weakness and need, not our strength and sufficiency.

11. Think yourself full, pray yourself aglow.

12. Be concrete, not abstract.

13. Specificity communicates universality.

14. Be clear. Lewis: sheep. If you given them a route to misunderstand, they’ll take it.

15. Be simple but not simplistic.

16. Ruthlessly cut everything extraneous.

17. Smile. And mean it. Preaching is an act of pastoral love.

18. Doctrine is not enough; but, people do want to know doctrine.

19. Regularly reveal something of your own weakness.

20. Let them know of exegetical discoveries new to you.

21. Don’t ask adjectives to do the work verbs should be doing.

22. Make the gospel clear at some point.

23. Both unbelievers and believers are present.

24. Both eager and stagnant belieers are present.

25. Remember, and speak directly to, the kids.

26. Speak in your natural everyday voice; resist every form of ‘the preacher’s voice’.

27. Handle objections.

28. When on the fence, shorter is better.

29. Quit preaching while you still have them.

30. You don’t look as happy as you are; so stretch for joy.

31. If they feel loved by you (Phil. 4:1), they will feel hurt with you (Phil. 4:14).

32. ‘We will hear you again about this’ (Acts 17:32). Intrigue them with Jesus, even if they haven’t collapsed into his arms yet.

33. Don’t let your main points be transposable onto any other text in the Bible.

34. Slow down to notice every actual word of the text–what it says, and doesn’t say.

35. Calm down and be yourself.

36. Be a farmer, not a penny stock trader. Crock pot, not microwave.

37. They don’t need eloquence; they need radiance.

38. T.F. Tenney: ‘Preach every sermon like your son is sitting on the last row and giving church one last chance.’

39. Tincture. Give them a taste of what Jesus himself is like. Rutherford.</p></blockquote>

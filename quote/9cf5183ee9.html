<blockquote><p>§3. That this will or volition must be acknowledged by us in the greatest and most worthy being (that is, God) is established: 1. Because to act voluntarily is the most noble and plainly absolute perfection of all perfections of which we have an idea, conceived with and under the ratio of the most perfect spontaneity [spontaneitas], whereby He acts spontaneously and according to His own good pleasure: for it is among all other perfections the highest, to be the most free lord of one’s own actions by a certain supreme αὐτεξουσία [self-determination], compelled by no external cause or brute necessity of nature to do anything. And accordingly that free will, or spontaneity, is pre-eminently comprehended in the idea of the supremely perfect being. … §9. According to this diversity of objects, the will of God is partly necessary, partly free. It is necessary because God, beholding Himself, takes delight in Himself in His sufficiency and absolute perfection: and it is called necessary because He has its object so intimately present to Himself in His nature that without this thought God cannot even be conceived. Free is the will of the decree, whereby He determines concerning possible things: and it is called free because it is occupied with things depending purely upon the judgment [arbitrium] of God. … §.13… 3. The will of God is also most free, inasmuch as it is determined by no cause outside God, and this on account of the independence of the divine essence. Nor does it stand in the way that we have a little before distinguished a certain necessary will from the free: since there we regard only the necessary existence of God, and that it effects that the will of God, inasmuch as it regards Himself, cannot be removed from the concept of the Deity. Otherwise, that very will of God by which He loves Himself is supremely free with the freedom of complacency and spontaneous approbation. Meanwhile it is inquired concerning the will of God tending toward creatures (which we have called free, because in them alone a possible existence can be conceived) whether God has willed and wills them with a freedom of indifference. We, if anyone by the indifference of God understands that the will of God in decreeing was not determined by the objects regarded in the decree, acknowledge that all things which are proposed to the decree as possible must in themselves be conceived as indifferent toward futurition, involving no necessity in their concept that they should be made, or compelling God to determine anything. If also by the indifference of the freedom of God anyone understands the sufficiency of God, whereby, being in need of nothing outside Himself, He did not need to seek the supply of any deficiency outside Himself, and therefore to deliberate concerning the production of creatures—in this respect also we acknowledge that God acted with a freedom of indifference. Which, however, is not to be extended so far as though, the will to manifest His glory being posited, His freedom was not determined by His own decency [decentia], which did not admit that He should will otherwise than what is consonant with His glory and virtues. But whether God was so indifferent to creation itself and the manifestation of His glory, considered antecedently to the decree, that He could decently also not create, or not will to manifest His glory, is a problem which is debated among learned men, worthy of further investigation. You may see here the celebrated Wittichius of blessed memory and the celebrated Roëllius disagreeing. 4. We also urge that the will or volition of the eternal God is eternal, because God is a pure act, by no means passing from not willing to willing—which itself also extends to the will of the decree: for unless it were eternal, a change would befall God, which is absurd; or at least a succession of thoughts and anterior and posterior acts, thoughts mutually following one another—which imperfections we have shown, under the heading on the eternity of God, must be removed from God. But if anyone objects that this opinion strips God of all indifference in willing, since the state of indifference must necessarily be conceived before the determination of things made by the decree: I reply: (a.) That indifference is still in question. (b.) Nor does the consequence proceed, since a priority of order suffices for the matter, and a priority of time is not precisely required. Indeed, the freedom of indifference suffices for us, insofar as it excludes determination by objects, or by a necessity of nature, or even by a demand of indigence—since the determination made must be conceived from the eternal good pleasure of God, willing to manifest His glory, and that in the most wise and prudent manner: without which decree we do not conceive that God existed even for a moment.</p></blockquote>

<blockquote><p>Perfection is God all-sufficient and all-excellent: not having need of anything, giving sufficience unto, and having in Him the perfection of all things, Gen. 17:1-2; Ex. 6:3. This attribute renders God as that infinite sea of all happiness. Perfection is increated glory: that is, all the attributes in one word; as happiness is the sum of man’s good, so glory is the sum of all God’s attributes. The perfection of God is essential, independent, unlimited, without increase or decrease: As the power of subordinate causes is contained in the first cause virtually: and as the authority of under-officers is in the prince after a more excellent manner, so the virtue of all second causes is contained in the first cause eminently. The word eminently taken in its strict and proper sense seems to intend the effect to be in the cause, not only in a more excellent manner than in itself, but also in a super-created manner. Things are in God agreeable to the nature of God: in themselves according to their proper natures. … The essential perfection of God is increated glory, eternal, always the same, from which nothing can be taken, to which nothing can be added. The acknowledgement of the manifested perfections of God, is glorification: viz. The act of the creature done in time, admitting more or less according as God is known or acknowledged.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Perfection is God all-sufficient and all-excellent: not having need of anything, giving sufficience unto, and having in Him the perfection of all things, Gen. 17:1-2; Ex. 6:3. This attribute renders God as that infinite sea of all happiness. Perfection is increated glory: that is, all the attributes in one word; as happiness is the sum of man’s good, so glory is the sum of all God’s attributes. The perfection of God is essential, independent, unlimited, without increase or decrease: As the power of subordinate causes is contained in the first cause virtually: and as the authority of under-officers is in the prince after a more excellent manner, so the virtue of all second causes is contained in the first cause eminently. The word eminently taken in its strict and proper sense seems to intend the effect to be in the cause, not only in a more excellent manner than in itself, but also in a super-created manner. Things are in God agreeable to the nature of God: in themselves according to their proper natures. … The essential perfection of God is increated glory, eternal, always the same, from which nothing can be taken, to which nothing can be added. The acknowledgement of the manifested perfections of God, is glorification: viz. The act of the creature done in time, admitting more or less according as God is known or acknowledged.”

— John Norton, The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 19-20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CPerfection+is+God+all-sufficient+and+all-excellent%3A+not+having+need+of+anything%2C+giving+sufficience+unto%2C+and+having+in+Him+the+perfection+of+all+things%2C+Gen.+17%3A1-2%3B+Ex.+6%3A3.+This+attribute+renders+God+as+that+infinite+sea+of+all+happiness.+Perfection+is+increated+glory%3A+that+is%2C+all+the+attributes+in+one+word%3B+as+happiness+is+the+sum+of+man%E2%80%99s+good%2C+so+glory+is+the+sum+of+all+God%E2%80%99s+attributes.+The+perfection+of+God+is+essential%2C+independent%2C+unlimited%2C+without+increase+or+decrease%3A+As+the+power+of+subordinate+causes+is+contained+in+the+first+cause+virtually%3A+and+as+the+authority+of+under-officers+is+in+the+prince+after+a+more+excellent+manner%2C+so+the+virtue+of+all+second+causes+is+contained+in+the+first+cause+eminently.+The+word+eminently+taken+in+its+strict+and+proper+sense+seems+to+intend+the+effect+to+be+in+the+cause%2C+not+only+in+a+more+excellent+manner+than+in+itself%2C+but+also+in+a+super-created+manner.+Things+are+in+God+agreeable+to+the+nature+of+God%3A+in+themselves+according+to+their+proper+natures.+%E2%80%A6+The+essential+perfection+of+God+is+increated+glory%2C+eternal%2C+always+the+same%2C+from+which+nothing+can+be+taken%2C+to+which+nothing+can+be+added.+The+acknowledgement+of+the+manifested+perfections+of+God%2C+is+glorification%3A+viz.+The+act+of+the+creature+done+in+time%2C+admitting+more+or+less+according+as+God+is+known+or+acknowledged.%E2%80%9D%0A%0A%E2%80%94+John+Norton%2C+The+Orthodox+Evangelist%E2%80%A6+%28London%3A+Macock%2C+1654%29%2C+ch.+1%2C+%E2%80%98Of+the+Divine+Essence%E2%80%99%2C+pp.+19-20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5c958fc60f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5c958fc60f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/god#:~:text=Perfection%20is%20God%20all%2Dsufficient%20and%20all%2Dexcellent,as%20God%20is%20known%20or%20acknowledged&amp;text=Perfection%20is%20God%20all%2Dsufficient%20and%20all%2Dexcellent%3A%20not%20having&amp;text=less%20according%20as%20God%20is%20known%20or%20acknowledged" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>It is a great dispute with the Schoolmen: Whether God’s power be anything but his intellect and will, that is, a necessary, distinct, conceptus inadaequatus [inadequate concept] of God (for He is one simple essence). Durandus, bk. 1, dist. 38, quest. 1, justly affirms it. Vasquez, in I. Thom. quest. 23, dist. 102, c. 2, says, Haec sententia nonnullis recentioribus mirum in modum probatur [This opinion is approved in a remarkable manner by several more recent authors]; yet he is against it, though Suarez be for it. But it is partly by misconceiving of the potentia vitalis in man, as if it were only executive ad extra [unto external things], or in the inferior faculties, and partly on such frivolous reasons as tend also to a denial of his intellection and volition. Methinks, they that acknowledge God’s understanding and will to be analogically so called (man’s being the first which the word signifies, though God’s infinitely more excellent) should on the same reason grant, that vita and potentia activa are terms as applicable to God: for which denomination many reasons and cogent may be given. And I am sure the language of the Scripture and our [Apostles’] Creed will warrant this conception.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable, for pacification of the dogmatical Word-Warriors who</cite>, (London: White, 1675), sect. 3, ‘The several inadequate conceptions which in order make up our knowledge of God’ | p. 4, margin note Baxter is arguing that the life of God is more fundamental than his intellect and will.</span></figcaption>

<blockquote><p>5. That it is not an office to be taken up on trial, and for a limited time (as servants are bound to their masters by the year); but as marriage, it is for life (unless God shall disable us), and as we say for better and for worse; and not to be laid by at pleasure. And therefore those Schoolmen that interpret the indelible character of the relation seem not to differ from us at all.</p></blockquote>

</figure><figure class="quote" id="q-c19b347d3b" data-kw="">
<blockquote><p>The admission of ministers to their offices must consist in consent of the people and kirk whereto they shall be appointed, and in approbation of the learned ministers appointed for their examination. … Other ceremony than the public approbation of the people, and declaration of the chief minister, that the person there presented is appointed to serve that kirk, we cannot approve; for albeit the apostles used the imposition of hands, yet seeing the miracle is ceased, the using of the ceremony we judge is not necessary.</p></blockquote>

</figure><figure class="quote" id="q-294f84affd" data-kw="">
<blockquote><p>1. God never did, nor ever will, justify and save a wicked Jew that lived and died impenitent, though he was of the seed of Abraham, and a Hebrew of the Hebrews, and had all the honour and advantages that attended circumcision. He does and will render indignation and wrath, tribulation and anguish, upon every soul of man that doeth evil; and of the Jew first, whose privileges and professions, instead of screening him from the judgment of God, will but aggravate his guilt and condemnation. See Rom. 2:3, 8–9, 17. Though God has favoured the Jews, above other nations, with the dignities of visible church-membership, yet He will not therefore accept of any particular persons of that dignity, if they allow themselves in immoralities contradictory to their profession; and particularly in persecution, which was now, more than any other, the national sin of the Jews. 2. He never did, nor ever will, reject or refuse an honest Gentile, who, though he has not the privileges and advantages that the Jews have, yet, like Cornelius, fears God, and worships Him, and works righteousness, that is, is just and charitable towards all men, who lives up to the light he has, both in a sincere devotion and in a regular conversation. Whatever nation he is of, though ever so far remote from kindred to the seed of Abraham, though ever so despicable, nay, though in ever so ill a name, that shall be no prejudice to him. God judges of men by their hearts, not by their country or parentage; and, wherever He finds an upright man, He will be found an upright God, Ps. 18:25. Observe, Fearing God, and working righteousness, must go together; for, as righteousness towards men is a branch of true religion, so religion towards God is a branch of universal righteousness. Godliness and honesty must go together, and neither will excuse for the want of the other. But, where these are predominant, no doubt is to be made of acceptance with God. Not that any man, since the fall, can obtain the favour of God otherwise than through the mediation of Jesus Christ, and by the grace of God in Him; but those that have not the knowledge of Him, and therefore cannot have an explicit regard to Him, may yet receive grace from God for his sake, to fear God and to work righteousness; and wherever God gives grace to do so, as He did to Cornelius, He will, through Christ, accept the work of his own hands. Now: (1) This was always a truth, before Peter perceived it, that God respecteth no man’s person; it was the fixed rule of judgment from the beginning: If thou doest well, shalt thou not be accepted? And, if not well, sin, and the punishment of it, lie at the door, Gen. 4:7. God will not ask in the great day what country men were of, but what they were, what they did, and how they stood affected towards Him and towards their neighbors; and, if men’s personal characters received neither advantage nor disadvantage from the great difference that existed between Jews and Gentiles, much less from any less difference of sentiments and practices that may happen to be among Christians themselves, as those about meats and days, Rom. 14:1-23. It is certain the kingdom of God is not meat and drink, but righteousness, and peace, and joy in the Holy Ghost; and he that in these things serveth Christ is accepted of God, and ought to be approved of men; for dare we reject those whom God doth not? (2) Yet now it was made more clear than it had been; this great truth had been darkened by the covenant of peculiarity made with Israel, and the badges of distinction put upon them; the ceremonial law was a wall of partition between them and other nations; it is true that in it God favoured that nation (Rom. 3:1–2; 9:4), and thence particular persons among them were ready to infer that they were sure of God’s acceptance, though they lived as they listed, and that no Gentile could possibly be accepted of God. God had said a great deal by the prophets to prevent and rectify this mistake, but now at length he does it effectually, by abolishing the covenant of peculiarity, repealing the ceremonial law, and so setting the matter at large, and placing both Jew and Gentile upon the same level before God; and Peter is here made to perceive it, by comparing the vision which he had with that which Cornelius had. Now in Christ Jesus, it is plain, neither circumcision availeth any thing, nor uncircumcision,Gal. 5:6; Col. 3:11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts, ch. 10, v. 35, “But in every nation he that feareth Him, and worketh righteousness, is accepted with Him.”</cite></span></figcaption>

is+a+branch+of+true+religion%2C+so+religion+towards+God+is+a+branch+of+universal+righteousness.+Godliness+and+honesty+must+go+together%2C+and+neither+will+excuse+for+the+want+of+the+other.+But%2C+where+these+are+predominant%2C+no+doubt+is+to+be+made+of+acceptance+with+God.+Not+that+any+man%2C+since+the+fall%2C+can+obtain+the+favour+of+God+otherwise+than+through+the+mediation+of+Jesus+Christ%2C+and+by+the+grace+of+God+in+Him%3B+but+those+that+have+not+the+knowledge+of+Him%2C+and+therefore+cannot+have+an+explicit+regard+to+Him%2C+may+yet+receive+grace+from+God+for+his+sake%2C+to+fear+God+and+to+work+righteousness%3B+and+wherever+God+gives+grace+to+do+so%2C+as+He+did+to+Cornelius%2C+He+will%2C+through+Christ%2C+accept+the+work+of+his+own+hands.+Now%3A+%281%29+This+was+always+a+truth%2C+before+Peter+perceived+it%2C+that+God+respecteth+no+man%E2%80%99s+person%3B+it+was+the+fixed+rule+of+judgment+from+the+beginning%3A+If+thou+doest+well%2C+shalt+thou+not+be+accepted%3F+And%2C+if+not+well%2C+sin%2C+and+the+punishment+of+it%2C+lie+at+the+door%2C+Gen.+4%3A7.+God+will+not+ask+in+the+great+day+what+country+men+were+of%2C+but+what+they+were%2C+what+they+did%2C+and+how+they+stood+affected+towards+Him+and+towards+their+neighbors%3B+and%2C+if+men%E2%80%99s+personal+characters+received+neither+advantage+nor+disadvantage+from+the+great+difference+that+existed+between+Jews+and+Gentiles%2C+much+less+from+any+less+difference+of+sentiments+and+practices+that+may+happen+to+be+among+Christians+themselves%2C+as+those+about+meats+and+days%2C+Rom.+14%3A1-23.+It+is+certain+the+kingdom+of+God+is+not+meat+and+drink%2C+but+righteousness%2C+and+peace%2C+and+joy+in+the+Holy+Ghost%3B+and+he+that+in+these+things+serveth+Christ+is+accepted+of+God%2C+and+ought+to+be+approved+of+men%3B+for+dare+we+reject+those+whom+God+doth+not%3F+%282%29+Yet+now+it+was+made+more+clear+than+it+had+been%3B+this+great+truth+had+been+darkened+by+the+covenant+of+peculiarity+made+with+Israel%2C+and+the+badges+of+distinction+put+upon+them%3B+the+ceremonial+law+was+a+wall+of+partition+between+them+and+other+nations%3B+it+is+true+that+in+it+God+favoured+that+nation+%28Rom.+3%3A1%E2%80%932%3B+9%3A4%29%2C+and+thence+particular+persons+among+them+were+ready+to+infer+that+they+were+sure+of+God%E2%80%99s+acceptance%2C+though+they+lived+as+they+listed%2C+and+that+no+Gentile+could+possibly+be+accepted+of+God.+God+had+said+a+great+deal+by+the+prophets+to+prevent+and+rectify+this+mistake%2C+but+now+at+length+he+does+it+effectually%2C+by+abolishing+the+covenant+of+peculiarity%2C+repealing+the+ceremonial+law%2C+and+so+setting+the+matter+at+large%2C+and+placing+both+Jew+and+Gentile+upon+the+same+level+before+God%3B+and+Peter+is+here+made+to+perceive+it%2C+by+comparing+the+vision+which+he+had+with+that+which+Cornelius+had.+Now+in+Christ+Jesus%2C+it+is+plain%2C+neither+circumcision+availeth+any+thing%2C+nor+uncircumcision%2CGal.+5%3A6%3B+Col.+3%3A11.%E2%80%9D%0A%0A%E2%80%94+Matthew+Henry%2C+Commentary+on+Acts%2C+ch.+10%2C+v.+35%2C+%E2%80%9CBut+in+every+nation+he+that+feareth+Him%2C+and+worketh+righteousness%2C+is+accepted+with+Him.%E2%80%9D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F294f84affd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/294f84affd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-calling/#:~:text=1.%20God%20never%20did%2C%20nor%20ever,thing%2C%20nor%20uncircumcision%2CGal.%205%3A6%3B%20Col.%203%3A11&amp;text=1.%20God%20never%20did%2C%20nor%20ever%20will%2C%20justify&amp;text=availeth%20any%20thing%2C%20nor%20uncircumcision%2CGal.%205%3A6%3B%20Col.%203%3A11" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

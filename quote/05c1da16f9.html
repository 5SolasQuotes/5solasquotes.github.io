<main class="wrap"><figure class="quote" id="q-05c1da16f9" data-kw="">
<blockquote><p>In Baptism, the external minister baptizes with an external element, that is water, which is received bodily. The internal minister, the Holy Spirit, baptizes with the blood of the spotless Lamb, so that he that is baptized is endowed with the whole Christ, true God and true man (Gal. 3:27); thus it is not necessary to receive Christ by the organs of the body, in order that our souls be washed by his blood; but the secret and most potent operation of the Holy Spirit suffices.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvin: Theological Treatises</cite>, J. K. S. Reid, Calvin: Theological Treatises (Louisville, KY; London: Westminster John Knox Press, 1954), 173–74.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

<blockquote><p>Unless they are to be esteemed as members of the Church, they ought not to be baptized. For Baptism is, in its own nature, the seal of an ingrafting already made into Christ, and, consequently, into His Church.</p></blockquote>

</figure><figure class="quote" id="q-2a58eef5f2" data-kw="">
<blockquote><p>The children of those that are indeed in the church, but, because of their unclean way of living, declare that they are not indeed of the church; if they be offered to baptism, they cannot be debarred therefrom, nor ought they. The reason is, because though the parents be wicked, yet their impiety ought not to prejudge their children which are born within the church. But if you say, only the children of the faithful are to be baptized, because those infants only are judged to be within the covenant, and they only holy; I answer, the impiety of their nearest parents is not to be considered here, but the piety of the church in which they are born;—as also their ancestors who have lived godly and holily.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/girolamo-zanchi.html">Girolamo Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, 226. As quoted by Thomas Boston, Works, vol. 6, ‘Miscellaneous Questions’, Question 6, pp. 139-140</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-ab2d9d02b6" data-kw="">
<blockquote><p>…use the best skill you have to instruct your children and servants, yet this is no reason to withdraw them from public instructions: nor can any man, who understands his religion, think he discharges his duty to God and the Church, merely by his private instruction of his family, when he neglects, or refuses to bring them to public instructions. 3. For he must consider, that his children and servants, who are baptized, are members of the Christian Church, and therefore ought to be subject to the instructions and discipline of it, as far as their age and capacity will permit. They do not only belong to his private care, but to the public care of the Church, who is to provide for the instruction of her children; and to deny the Church liberty to instruct her children, or not to interpose their own authority to make them submit to it, is to withdraw their children from the communion of the Church, after a solemn dedication of them to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-sherlock.html">William Sherlock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Discourse of Religious Assemblies</cite>, … (London, 1681), pt. 2, ch. 5, pp. 303-4 Sherlock was an Anglican.</span></figcaption>

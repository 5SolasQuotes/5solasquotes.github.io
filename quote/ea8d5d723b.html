<main class="wrap"><figure class="quote" id="q-ea8d5d723b" data-kw="">
<blockquote><p>And to the same purpose is that which Bonaventure has: Since non-being is a privation of being, it does not fall within the intellect except through being. But being does not fall (within the intellect) through something else; because everything that is understood is understood either as non-being, or as being in potency, or as being in act. If, therefore, non-being cannot be understood except through being, and being in potency cannot be understood except through being in act, and since being names the pure act of that which is, therefore being is that which first falls within the intellect. And that being is the pure act; but this is not particular being, which is being narrowed (or restricted), because that is mixed with potency; nor analogical being, because that has the least degree of act, inasmuch as it is the least actual. It remains, therefore, that that being is the divine being. Therefore remarkable is the blindness of the intellect, which does not consider that which it sees first, and without which it can know nothing. For just as the eye, intent upon the various differences of colors, does not see the light by which it sees the rest—and if it sees it, nevertheless does not notice it—so the eye of our mind, intent upon these particular and universal beings, does not take notice of being itself, which is outside of every genus, although it first presents itself to the mind and through it the others. Whence it very truly appears that, just as the eye of a bat is related to the light, so is the eye of our mind related to the most manifest things of nature. For being accustomed to the darkness of beings and the phantasms of sensible things, when it gazes upon the very light of the highest Being, it seems to itself to see nothing—failing to understand that this very darkness is the supreme illumination of our mind; just as when the eye sees pure light, it seems to itself to see nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Journey of the Mind to God, ch. 5, tr. ChatGPT-5 as the Latin is given in Richard Field, Of the Church (Oxford: Turner, 1628), bk. 3, Answer to Berely, ch. 5</cite>, p. 253</span></figcaption>

</figure><figure class="quote" id="q-a730717dcd" data-kw="">
<blockquote><p>How wrongly most of the Scholastic authors have thought concerning original sin can be obscure to no one who is moderately versed in their books. Nor have they recently imbibed this error of opinion, but they have retained it as drawn from ancient times and masters. For Lombard, who has held the first place in the school for now five hundred years, testifies that certain theologians before him taught that original sin is nothing but the guilt of punishment for the sin of the first man, by which his posterity are liable and subject to temporal and eternal punishment for the actual sin of Adam, so that it is neither a fault nor a punishment (Lombard, dist. 30, ch. 5). And although he not obscurely signifies that so insane an opinion is displeasing to him, he was nevertheless unable to persuade his disciples from being devolved into the same or a greater absurdity of opinion. For Scotus did not fear to affirm that after any sin whatsoever has been committed, nothing remains in us except the guilt of punishment (Scotus, in 2, d. 34, q. 1, art. 2). And Biel, a blind man, follows this blind man (Biel in 2, d. 30, q. 1). But if nothing inhered in Adam after the fall except the guilt of punishment, certainly not a fault, but a bare guilt, passed to his posterity by propagation. Durandus also makes original sin nothing other than mere guilt, when he disputes that Adam’s will is considered ours in no other way than because Adam, by sinning voluntarily, brought destruction and the privation of original justice upon us all; wherefore he denies that this sin ought to be called a fault (Durandus, in 2, d. 30, q. 2). William, Bishop of Paris, also taught this, when he proceeded so far as to defend that this natural vice is worthy of no punishment (Wilhelmus Paris, De vitiis et peccat.). Ockham professes that he would have gone into that opinion which posits that original sin is nothing but divine non-acceptance on account of some preceding demerit in another, if he were not prohibited by the authorities of certain fathers, which seemed to him to say that original fault is the lack of justice that ought to be present (Occamus, in 2, q. 14). Thus for this man, original sin would be only the non-acceptance of God on account of Adam’s offense, if he did not wish to seem to depart from the diverse opinion of the saints. Are these men ever to be thought to have even dreamed of the contagion and magnitude of original sin?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Original Sin… against the three first books of Thomas Stapleton on the Whole Doctrine of Justification presently controverted (d. 1595; Legat, 1600), bk. 1, ch. 1 trans. AI Latin</cite>, p. 1</span></figcaption>

</figure><figure class="quote" id="q-b57d481466" data-kw="">
<blockquote><p>Another issue concerned substantial forms. Here, Voetius and others defended a neo-Aristotelian concept because they found it to be more compatible with the Physica Mosaica [Mosaic physics] than early modern alternatives. The substantial forms could not only explain the classification of ‘kinds’ in the biblical creation account, but also constituted the internal principles of activity in secondary causes. In contrast, the Cartesian mechanistic worldview with its rejection of substantial form seemed to create more difficulties than it might solve. In particular, it implied a denial of genuine secondary causality, leading either to occasionalism or Spinozistic pantheism, as Voetius noted with remarkable foresight (Van Ruler 1995; Goudriaan 2006, 113-33; Beck 2007, 65-69).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-beck.html">Andreas Beck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 13, ‘God, Creation &amp; Providence in Post-Reformation Reformed Theology’, p. 206 in eds. Lehner, Muller, Roeber, The Oxford Handbook of Early Modern Theology, 1600-1800 (Oxford, 2016)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>
<div class="actions"><button class="copy" data-copy="“Another issue concerned substantial forms. Here, Voetius and others defended a neo-Aristotelian concept because they found it to be more compatible with the Physica Mosaica [Mosaic physics] than early modern alternatives. The substantial forms could not only explain the classification of ‘kinds’ in the biblical creation account, but also constituted the internal principles of activity in secondary causes. In contrast, the Cartesian mechanistic worldview with its rejection of substantial form seemed to create more difficulties than it might solve. In particular, it implied a denial of genuine secondary causality, leading either to occasionalism or Spinozistic pantheism, as Voetius noted with remarkable foresight (Van Ruler 1995; Goudriaan 2006, 113-33; Beck 2007, 65-69).”

<blockquote><p>15. But when and in what sort and degree Christ gives the actual operations of the Spirit to all covenanted infants, it is wonderful hard for us to know. But this much seems clear: 1. That Christ may when he please work on the soul of an infant to change its disposition, before he come to the use of reason. 2. That Christ and his Spirit as in Covenant with infants, are ready to give all necessary assistance to infants for their inherent sanctification in the use of those means, and on those further conditions, on which we must wait for it and expect it. For the Holy Ghost is not so engaged to us in our Covenant or baptism, as to be obliged presently to give us all the grace that we want; but only to give it us on certain further conditions, and in the use of certain means. … In that also they are by Covenant and their parents promise, engaged to use those means which Christ has appointed for sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory... (London: 1673) | Question 42, ‘But the great question is, How the Holy Ghost is given to infants in baptism?…’</cite>, p. 819</span></figcaption>

<blockquote><p>5. When we teach the perseverance of the saints in a state of justification once obtained, we do not deny that the quality, or exercise of the faithful or righteous man is mutable or may be lost, by reason of the subject matter; but we affirm that the special love of God does not permit, that he who by believing in Christ shall have been justified and adopted as a son of God, by losing that faith and holiness should cease to be a child of God and perish for ever.</p></blockquote>

</figure><figure class="quote" id="q-655a1793c9" data-kw="">
<blockquote><p>Then, because to whomsoever the promise appertains, to them also belongs the sign, as therefore baptism is bestowed upon infants, is likewise the Supper of the Lord to be administered unto them? Certain of the fathers have thought so, as Cyprian (Sermon 5, De Lapsis [Of Falls]) and Augustine (Lib. de Eccle. dogmat., ch. 52), being moved by these words, Jn. 6:53, ‘Except ye shall eat the flesh of the son of man, and drink his blood, you shall have no life in you.’ But we deny the consequent. For this place speaks not of a sacramental eating, but of a spiritual eating, or of faith, by which the faithful are quickened, which are annexed unto Christ, who offered his body and shed his blood for us. And by this means the flesh of Christ is made unto us meat indeed, and his blood drink indeed. Secondly, that to whomsoever the promise appertains, to them also belongs the sign, is true, but according to the divine determination, appropriated to every sacrament: to wit, so that the sacrament of ingrafting be bestowed as well upon infants as those of years, but upon male children only, and that not before the eighth day, in the old Testament: but in the new, both to the male and female without any prefixed time. But the sacrament of nourishment to them of years only, and that for a certain peculiar end, and the diversity of the circumstance of the action. So the Eucharist hath his proper end, that the death of the Lord should be declared in the public congregation in the using thereof. It is also commanded, that everyone which comes to the Lord’s Supper should examine himself: yea and peculiar actions belong to the external rite, to wit, to eat and to drink, which are not fit for little children. So under the Old Testament circumcision was appointed for infants but the Passover to them only which by reason of their age were able to ask of the signification thereof. Hereupon came those vulgar verses: ‘Ebrius, infamis, erroneus, atque furentes, Cum pueris, Domini non debent sumere corpus.’ ‘To drunkards and thin-famous sort, to men misled and mad: To children, Christ’s body to give, it were an action bad.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of the Christian Religion trans. Robert Hill (London, 1606), Locus 47, ‘Who are to be Baptized?’</cite>, pp. 720-1</span></figcaption>

</figure><figure class="quote" id="q-c7a8c38437" data-kw="">
<blockquote><p>Of all these great difficulties I have said what I know in my Appendix to Infant Baptism to Mr. Bedford and Dr. Ward, and of Bishop Davenant’s judgement. And I confess that my judgment agrees more in this with Davenant’s than any others, saving that he does not so much appropriate the benefits of baptism to the children of sincere believers as I do. And though by a Letter in pleading Davenant’s cause, I was the occasion of good Mr. [Thomas] Gataker’s printing of his answer to him, yet I am still most inclined to his judgement; Not that all the baptized, but that all the baptized seed of true Christians are pardoned, justified, adopted, and have a title to the Spirit and salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Question 42, ‘But the great question is, How the Holy Ghost is given to infants in baptism? And whether all the children of true Christians have inward sanctifying grace? Or whether they can be said to be justified, and to be in a state of salvation, that are not inherently sanctified? And whether any fall from this infant state of salvation?’ in A Christian Directory... (London: 1673), pp. 817-21</cite>, pp. 817-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

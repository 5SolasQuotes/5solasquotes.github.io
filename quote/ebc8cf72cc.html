<main class="wrap"><figure class="quote" id="q-ebc8cf72cc" data-kw="">
<blockquote><p>They sympathize with the condition of all distressed saints, wherever they are, and thereby hold communion with all saints in the world, all Churches of Christ throughout the universe. And from this compassion and love it is, that they feel an ineffable pleasure and satisfaction in their souls whenever they understand and hear of, or behold the success of the family of God, the prosperity of his people, and the spreading of his kingdom in the world. … Those that hold communion with God and his Son Jesus Christ… do necessarily maintain a Communion and Society with those that are the children of God, and the members of Jesus Christ… …When Peter was cast into prison, ‘Prayer was made without ceasing of the Church unto God for him,’ Acts 12:5. There is a continual stock of prayers, a common bank, whereby a constant traffic and exchange is kept up among the saints. This is called by the apostle, ‘supplication for all saints,’ Eph. 6:18, whereby they are ever partaking of the benefit of the petitions and addresses that are put up to the Divine Majesty throughout the whole world. And accordingly the fellowship of all Christians dispersed over the whole earth is preserved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theologia Reformata</cite>, … (London: 1713), ‘The Latter Part of the 9th Article, Namely, the Communion of Saints, where the Nature of this Communion is Explained…’, pp. 747-48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>

</figure><figure class="quote" id="q-cf0f47a498" data-kw="">
<blockquote><p>Another ground of love among friends, is societas periculi, et 〈◊〉, when men partake of the same danger or deliverance, as captives under the Turk delivered by the same ransom. This ground of love we have, who being all in danger of hell and become captives of Satan, are delivered by the same ransom, by Christ. This makes friendship and causes love in men that never saw one another before.

3. Now for proximus, it is defined ab use, of the use and benefit that one has by another. God has not given to any man such gifts, but that he needs the gifts of his brother. God has not given all his gifts to any one, and therefore there is none but has need of another: and therefore 〈◊〉 et utilitas, use and utility, are the grounds of propinquity, and make men become proximi, neighbors.

4. Lastly, there is 〈◊〉 instituti; both amongst 〈◊〉, friends and neighbors, all do tendere ad idem, tend to one and the same end; that is, to be partakers of the blessedness, which the angels of God enjoy: for this is institutum 〈◊〉, et proximi 〈◊〉, et amici, et nostrum omnium, the end and scope of my brother, neighbor, friend, and myself, and of all of us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-andrewes.html">Lancelot Andrewes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Pattern of Catechistical Doctrine at Large</cite>, (d. 1626; 1675), 5th Commandment, p. 315</span></figcaption>

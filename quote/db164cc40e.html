<main class="wrap"><figure class="quote" id="q-db164cc40e" data-kw="">
<blockquote><p>The prophets did neither erect to themselves new Churches, nor build up new altars, on which they might have separate sacrifices.” And he affirms, “Had the prophets thouht they contracted any infection, they would rather have died an hundred times than joined with them.</p></blockquote>

<blockquote><p>Being deeply impressed with the sense of the dismal effects and fatal consequences of division and alienation of mind and affection among the Lord’s servants, and of the indispensable necessity of mutual harmony in the Lord among the ambassadors of the Gospel of peace; and being much weighted with the present situation this Church is now in on many accounts, it was no small satisfaction to us to understand that our worthy and dear Brethren, whom we judge in charity have acted according to their light and conscience in taking the said oath, do evidence such brotherly regard to us, and such tenderness to the peace and welfare of this Church, in expressing their readiness to contribute their best endeavors for removing all differences among such as fear the Lord in this Church, in addressing the government for our relief, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-e4304c57e2" data-kw="">
<blockquote><p>I know what dreadful consequences would attend a needless separation from the established Church, however I am treated by the corrupt members and ministers of it; for I judge of the state of a Church, not from the practice of its members, but its primitive and public constitution; and so long as I think the articles of the Church of England are agreeable to Scripture, I’m resolved to preach them up, without either bigotry or party-zeal; for I love all that love the Lord Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders</cite>, 1740</span></figcaption>

</figure><figure class="quote" id="q-f2de4a259d" data-kw="">
<blockquote><p>…and every party pretending to be the only Anti’s [anti-Erastian, anti-Popish, etc. persons] in the kingdom, against all evil things, and for all good; maintaining and transmitting the testimony, as it was handed down to the [Glorious] Revolution [1689]: yet they all agree in these two Anti-Presbyterian principles in such a period: [1.] In a positive proclaiming their disowning of the State, and separation from the Church and [from] all ministers and members that dare not go up with them in every jot in their over-stretched consequences. 2. They all agree against paying of all Crown-dues, even under this peaceable [civil] government under which we enjoy religion, life, and liberty. Which never any of our ministers, martyrs, did preach or witness against… It is a piece of demented infatuation to make little or no difference betwixt that period and this, and to follow the same methods that the Lord’s people were obliged to take against tyranny and defections.</p></blockquote>

0every%20party%20pretending%20to%20be%20the%20only&amp;text=were%20obliged%20to%20take%20against%20tyranny%20and%20defections" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d6edf4bb27" data-kw="">
<blockquote><p>For some say they [presbyterians] are not to do so [practice occasional communion] because we are bound always to do that in the worship of God which is best, and there cannot be two bests. Therefore since they judge their own way to be best, they ought always to go in it and never to join with any others, neither with the Church by law established [in England], or any others. This is somewhat plausible, seems a strong argument to some, but is far from it. For persons and churches that are better than others are to own others, if built on the true foundation, and [are] to impose no intolerable things for true, though [on] distempered churches, and to strive to hold an outward communion with them, the stronger and better with the weaker, and (much more) the weaker [ought to hold outward communion] with the better and stronger. Therefore the presbyterians think themselves bound to join sometimes with the conformists, though they judge their own way better than theirs; and that in doing so sometimes, they do that which is best.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-tallents.html">Francis Tallents</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short History of Schism: for the Promoting of Christian Moderation &amp; the Communion of Saints</cite>, (London: Parkhurst, 1705) 128 pp. ToC, p. 110</span></figcaption>

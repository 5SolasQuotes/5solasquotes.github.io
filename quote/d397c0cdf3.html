<main class="wrap"><figure class="quote" id="q-d397c0cdf3" data-kw="">
<blockquote><p>It was a very remarkable campaign which was conducted by Robert Pearsall Smith in Great Britain and Germany during the years 1873–1875 in the interests of what is known as “the Higher Christian Life.” It has left behind it two imposing monuments. One of them, the great “Keswick Movement,” is known wherever the English language is spoken. The other, a parallel movement in Germany, spoken of there as “Die Heiligungsbewegung,” the “Sanctification Movement,” deserves to be better known than it appears to be.

It took a peculiar form, which was given it by the circumstance that it made its way primarily in, and always by means of, “the Fellowships” (Gemeinschaften) which had come down from the times of Pietistic ascendency, and were now given new life and set upon a career of rapid self-propagation, by the impulse received from Pearsall Smith. Thus the “Sanctification Movement” inaugurated by him became in its form a great “Fellowship Movement,” which has spread throughout Germany and has extended itself everywhere in a stable organization and numerous instruments of activity. The center of its public manifestation is the great Gnadau Conference.

One of the remarkable features of this “Sanctification Movement” has been that it took its colour very largely from the teachings of one man. This man was Theodor Jellinghaus, who received his Higher Life doctrine from Smith and his colleagues at the great Oxford Union Meeting for the Promoting of Scriptural Holiness, in the early days of September, 1874, and who returned thence to Germany having before him his life-work of propagating it. In 1880 he published the work which became very much the doctrinal text book of the movement, under the title of “The Complete, Present Salvation through Christ.”

Through this book, in its successive editions, and the Bible school which he founded for the training of workers for the movement, Jellinghaus was able to give to the movement its doctrinal character. This doctrinal character, while following in the main, and at first very closely, the teachings of Smith, did not exactly coincide with them in all its details, and departed more and more from them as time went on, though never fundamentally. This was clearly marked in the successive editions of the book. A particular quality of its own was thus acquired by the German Sanctification Movement, which differentiated it as a distinct species of Higher Life teaching, while it retained its generic character.

Its development on these lines proceeded with great and fruitful quietness throughout the last quarter of the nineteenth century. With the twentieth century, however, a period of turmoil set in. Fanatical tendencies showed themselves, with ever increasing violence. A consequent Perfectionism endeavoured to substitute itself for the moderate Perfectionism of the Higher Life teachers, and especially of Jellinghaus, the most discreet of them all. The excesses of the Welsh Revival were imported into Germany.

Worst of all, the Fellowship circles were invaded by the fanaticisms of the “Pentecost Movement” — the “Los Angeles Revival,” which brought ruin in their train. The ultimate result was an immense revulsion of feeling. The whole Higher Life system which had supported the doctrinal basis of the movement from its beginning was undermined and discredited. Jellinghaus himself, who had given his life to its propagation, published, in a remarkable book, his recantation of it. When the Great War lowered its curtain over the land and shut off observation of the course of religious events in it, it looked very much as if the Fellowship Movement had definitely ceased to be a Higher Life movement and had returned with happy decisiveness to the Reformation for its doctrinal basis.</p></blockquote>

<blockquote><p>Q133 Therefore, explain fully this sanctification of ours in Christ. A133 Something is said to be sanctified which is segregated from common pollution, so that it is most pure, and wholly consecrated to God the greatest adversary of all filth. Therefore, in this way our nature is sanctified in Christ from the very moment of conception, and so He sanctifies us. Furthermore it happens in two ways. First, as I have said, we are reckoned righteous by the imputed righteousness of Christ fully before God, not in ourselves, but in Him to whom we are united through faith. So also I say that our persons, by the imputation of His perfect holiness and integrity, are reckoned holy and whole and thus acceptable to the Father, not in ourselves, but in Christ. Finally, the force and energy of this most pure holiness which is in the flesh of Christ, I say it flows also into us by the working of the Holy Spirit in us, so that we become holy in ourselves, that is, segregated from the defilements of this world, and we serve God in spirit and body; which benefit in the scriptures is often termed sanctification, regeneration, illumination, new man, new creature, and spirituality. Q134 Therefore, you say that this latter sanctification is not something outside of us, and is not ours by imputation alone, but is a new endowment truly ingrafted and clinging in us, by the mere grace of the heavenly Father, and by the power of the Holy Spirit, diffused in us. A134 I say so. Q135 Therefore, to what end is the other sanctification of our nature which is imputed to us? A135 Because this sanctification which is inherent in us is unfinished in us, as is apparent by the perpetual warfare between the flesh and the spirit in us, even in the best men. Therefore, in order that our persons might be acceptable to God, and consequently so that which comes forth from us might please Him (for the life of the saints is as a kind of continual offering up of oneself,* to which the apostle exhorted us), another sanctification must intervene; clearly, another which is most full and whole in Christ, in whom our most kind Father, looking, might acquiesce, He who is a perpetual enemy to all uncleanness, and is the most just and merciful. Q136 But why does He not completely sanctify us immediately? A136 No, instead marvel at His goodness, in that He instills any little drop of regenerating grace in man. Yet why He defers the full sanctification of us into another age, there are many reasons, and chiefly two. One, because we are of little faith, and therefore, as much as is in us, we impede the inworking of the Holy Spirit. The second, so that, as we are saved by grace alone, and not by works, he who glories, should glory only in God. For if this sanctification were complete in us, our righteousness would also be complete, or inherent in us, and then Christ would not be wholly and properly our Saviour, but only the tool and instrument for disposing us in such a way that we might justify ourselves by our own righteousness, which is plainly the foul and detestable error of the Semi-Pelagian Sophists.37 37. Semi-Pelagianism was revived in the 16th Century by the Jesuit theologian Luis Molina, and emphasized man’s free will in obtaining his own salvation.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Q133 Therefore, explain fully this sanctification of ours in Christ. A133 Something is said to be sanctified which is segregated from common pollution, so that it is most pure, and wholly consecrated to God the greatest adversary of all filth. Therefore, in this way our nature is sanctified in Christ from the very moment of conception, and so He sanctifies us. Furthermore it happens in two ways. First, as I have said, we are reckoned righteous by the imputed righteousness of Christ fully before God, not in ourselves, but in Him to whom we are united through faith. So also I say that our persons, by the imputation of His perfect holiness and integrity, are reckoned holy and whole and thus acceptable to the Father, not in ourselves, but in Christ. Finally, the force and energy of this most pure holiness which is in the flesh of Christ, I say it flows also into us by the working of the Holy Spirit in us, so that we become holy in ourselves, that is, segregated from the defilements of this world, and we serve God in spirit and body; which benefit in the scriptures is often termed sanctification, regeneration, illumination, new man, new creature, and spirituality. Q134 Therefore, you say that this latter sanctification is not something outside of us, and is not ours by imputation alone, but is a new endowment truly ingrafted and clinging in us, by the mere grace of the heavenly Father, and by the power of the Holy Spirit, diffused in us. A134 I say so. Q135 Therefore, to what end is the other sanctification of our nature which is imputed to us? A135 Because this sanctification which is inherent in us is unfinished in us, as is apparent by the perpetual warfare between the flesh and the spirit in us, even in the best men. Therefore, in order that our persons might be acceptable to God, and consequently so that which comes forth from us might please Him (for the life of the saints is as a kind of continual offering up of oneself,* to which the apostle exhorted us), another sanctification must intervene; clearly, another which is most full and whole in Christ, in whom our most kind Father, looking, might acquiesce, He who is a perpetual enemy to all uncleanness, and is the most just and merciful. Q136 But why does He not completely sanctify us immediately? A136 No, instead marvel at His goodness, in that He instills any little drop of regenerating grace in man. Yet why He defers the full sanctification of us into another age, there are many reasons, and chiefly two. One, because we are of little faith, and therefore, as much as is in us, we impede the inworking of the Holy Spirit. The second, so that, as we are saved by grace alone, and not by works, he who glories, should glory only in God. For if this sanctification were complete in us, our righteousness would also be complete, or inherent in us, and then Christ would not be wholly and properly our Saviour, but only the tool and instrument for disposing us in such a way that we might justify ourselves by our own righteousness, which is plainly the foul and detestable error of the Semi-Pelagian Sophists.37 37. Semi-Pelagianism was revived in the 16th Century by the Jesuit theologian Luis Molina, and emphasized man’s free will in obtaining his own salvation.”

— Theodore Beza, A Little Book of Christian Questions and Responses, ed. Dikran Y. Hadidian, trans. Kirk M. Summers, vol. 9, Princeton Theological Monograph Series (Eugene, OR: Pickwick Publications, 2009), 51–53.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQ133+Therefore%2C+explain+fully+this+sanctification+of+ours+in+Christ.+A133+Something+is+said+to+be+sanctified+which+is+segregated+from+common+pollution%2C+so+that+it+is+most+pure%2C+and+wholly+consecrated+to+God+the+greatest+adversary+of+all+filth.+Therefore%2C+in+this+way+our+nature+is+sanctified+in+Christ+from+the+very+moment+of+conception%2C+and+so+He+sanctifies+us.+Furthermore+it+happens+in+two+ways.+First%2C+as+I+have+said%2C+we+are+reckoned+righteous+by+the+imputed+righteousness+of+Christ+fully+before+God%2C+not+in+ourselves%2C+but+in+Him+to+whom+we+are+united+through+faith.+So+also+I+say+that+our+persons%2C+by+the+imputation+of+His+perfect+holiness+and+integrity%2C+are+reckoned+holy+and+whole+and+thus+acceptable+to+the+Father%2C+not+in+ourselves%2C+but+in+Christ.+Finally%2C+the+force+and+energy+of+this+most+pure+holiness+which+is+in+the+flesh+of+Christ%2C+I+say+it+flows+also+into+us+by+the+working+of+the+Holy+Spirit+in+us%2C+so+that+we+become+holy+in+ourselves%2C+that+is%2C+segregated+from+the+defilements+of+this+world%2C+and+we+serve+God+in+spirit+and+body%3B+which+benefit+in+the+scriptures+is+often+termed+sanctification%2C+regeneration%2C+illumination%2C+new+man%2C+new+creature%2C+and+spirituality.+Q134+Therefore%2C+you+say+that+this+latter+sanctification+is+not+something+outside+of+us%2C+and+is+not+ours+by+imputation+alone%2C+but+is+a+new+endowment+truly+ingrafted+and+clinging+in+us%2C+by+the+mere+grace+of+the+heavenly+Father%2C+and+by+the+power+of+the+Holy+Spirit%2C+diffused+in+us.+A134+I+say+so.+Q135+Therefore%2C+to+what+end+is+the+other+sanctification+of+our+nature+which+is+imputed+to+us%3F+A135+Because+this+sanctification+which+is+inherent+in+us+is+unfinished+in+us%2C+as+is+apparent+by+the+perpetual+warfare+between+the+flesh+and+the+spirit+in+us%2C+even+in+the+best+men.+Therefore%2C+in+order+that+our+persons+might+be+acceptable+to+God%2C+and+consequently+so+that+which+comes+forth+from+us+might+please+Him+%28for+the+life+of+the+saints+is+as+a+kind+of+continual+offering+up+of+oneself%2C%2A+to+which+the+apostle+exhorted+us%29%2C+another+sanctification+must+intervene%3B+clearly%2C+another+which+is+most+full+and+whole+in+Christ%2C+in+whom+our+most+kind+Father%2C+looking%2C+might+acquiesce%2C+He+who+is+a+perpetual+enemy+to+all+uncleanness%2C+and+is+the+most+just+and+merciful.+Q136+But+why+does+He+not+completely+sanctify+us+immediately%3F+A136+No%2C+instead+marvel+at+His+goodness%2C+in+that+He+instills+any+little+drop+of+regenerating+grace+in+man.+Yet+why+He+defers+the+full+sanctification+of+us+into+another+age%2C+there+are+many+reasons%2C+and+chiefly+two.+One%2C+because+we+are+of+little+faith%2C+and+therefore%2C+as+much+as+is+in+us%2C+we+impede+the+inworking+of+the+Holy+Spirit.+The+second%2C+so+that%2C+as+we+are+saved+by+grace+alone%2C+and+not+by+works%2C+he+who+glories%2C+should+glory+only+in+God.+For+if+this+sanctification+were+complete+in+us%2C+our+righteousness+would+also+be+complete%2C+or+inherent+in+us%2C+and+then+Christ+would+not+be+wholly+and+properly+our+Saviour%2C+but+only+the+tool+and+instrument+for+disposing+us+in+such+a+way+that+we+might+justify+ourselves+by+our+own+righteousness%2C+which+is+plainly+the+foul+and+detestable+error+of+the+Semi-Pelagian+Sophists.37+37.+Semi-Pelagianism+was+revived+in+the+16th+Century+by+the+Jesuit+theologian+Luis+Molina%2C+and+emphasized+man%E2%80%99s+free+will+in+obtaining+his+own+salvation.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+A+Little+Book+of+Christian+Questions+and+Responses%2C+ed.+Dikran+Y.+Hadidian%2C+trans.+Kirk+M.+Summers%2C+vol.+9%2C+Princeton+Theological+Monograph+Series+%28Eugene%2C+OR%3A+Pickwick+Publications%2C+2009%29%2C+51%E2%80%9353.&amp;url=https%3A%2F%2F5solasquotes.gi

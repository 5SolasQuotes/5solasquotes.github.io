<main class="wrap"><figure class="quote" id="q-640fec49e5" data-kw="">
<blockquote><p>If any say that I derogate much from the authority of the Church when I do nothing which she prescribes except I see it lawful and expedient, because I should do this much for the exhortation and admonition of a brother. Answer:

1. I give far more reverence to the direction of the Church than to the admonition of a brother, because that is ministerial, this fraternal: that comes from authority, this only from charity: that is public, this private: that is given by many, this by one: And finally, the Church has a calling to direct me in some things wherein a brother has not.

2. If it be still instanced that in the point of obedience, I do no more for the Church than for any brother because I am bound to do that which is made evident to be lawful and expedient, though a private Christian do but exhort me to it, or, whether I be exhorted to it or not. For answer to this I say that I will obey the directions of the Church in many things rather than the directions of a brother; for in two things which are in themselves indifferent, and none of them inexpedient, I will do that which the Church requires, though my brother should exhort me to the contrary. But always I hold me at this sure ground, that I am never bound in conscience to obey the ordinances of the Church except they be evidently lawful and expedient. This is that, sine quo non obligant [without which they do not bind], and also that which does chiefly bind, though it be not the only thing which binds. Now for making the matter more plain we must consider that the constitutions of the Church are either lawful or unlawful: if unlawful, they bind not at all: if lawful, they are either concerning things necessary as Acts 15:28, and then the necessity of the things do bind, whether the Church ordain them or not; or else concerning things indifferent, as when: the Church ordains that in great towns there shall be sermon on such a day of the week and public prayers every day at such an hour, here it is not the bare authority of the Church that binds, without respect to the lawfulness or expediency of the thing itself which is ordained (else we were bound to do everything which the Church ordains, were it never so unlawful, for quod competit alicui qua tali, competit omni tali. We behold the authority of the Church making laws, as well in unlawful ordinances as in lawful, not yet is it the lawfulness or expediency of the thing itself without respect to the ordinance of the Church (for possibly other times and diets were as lawful and expedient too for such exercises, as those ordained by the Church), but it is the authority of the Church prescribing a thing lawful or expedient. In such a case then neither does the authority of the Church bind except the thing be lawful and expedient, not does the lawfulness and expediency of the thing bind except the Church ordain it, but both these jointly do bind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, ... (Edinburgh, 1637), pt. 1, ch. 4, pp. 10-11</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ff2a372682" data-kw="">
<blockquote><p>For it is certain that many Roman pontiffs have erred, even when teaching ex cathedra, that is, determining controversies … Then who, I pray you, will be the supreme judge of the church, when the supreme pontiff hath fallen into heresy? Is he a fit person to be the supreme judge in religion, and one in whose judgment we should acquiesce, who may be, and is a heretic, as the very papists themselves confess? Surely, never. The supreme judge of all controversies must be such a one as can neither err nor prove a heretic: and such is Christ himself, that true High Priest, and the sacred scripture.</p></blockquote>

</figure><figure class="quote" id="q-38b795f294" data-kw="">
<blockquote><p>…the Church ministerially does judge, so as the obligatory power is from the things themselves, not from the will of human superiors. No necessity of peace which is posterior to truth, no necessity of obedience to authority, no necessity of uniformity in these externals, simply, and as they are such, are necessities obliging us to obedience: For things must first in themselves be necessary, before they can oblige to obedience. I must obey superiors in these things of convenient necessity, because they are convenient, and most convenient in themselves, and so intrinsically most necessary, but they are not necessarily to be done in themselves, because I must obey superiors, and because I must keep uniformity with the Church. The will of superiors do find in things necessity, and good of uniformity, but they do not make necessity, nor the good of uniformity: We should be servants of men if our obedience were ultimately resolved in the mere will of superiors in any the least circumstance of worship: and what I say of actions, holds in matters of mere custom also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646) | Question 5, p. 59</span></figcaption>

t="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a9ddcc0e66" data-kw="">
<blockquote><p>Say that the decision of the synod be agreeable to the Word: the Lord lays on the coaction [coercion] to all, to believe and accordingly profess the truth, and that by a synod, as Christ says, ‘he that heareth you heareth Me’: so the coaction, such as it is, must come principally from God, instrumentally from the synod; but it flows from both by accident [that is, it does not occur necessarily], and through men’s abuse, who receive not the truth in love, but for fear of shame, lest they should by the godly go for perverters of souls, Acts 15, that they do hypocritically profess what they ought sincerely to believe and profess; may we not say many men of corrupt minds believed circumcision to be necessary, and yet for fear of the apostles’ censure that they should be judged troublers of souls, liars and false teachers, as they are judged to be, Acts 15:24, would dissemble?… For there be but two ways of working on the mind to drive men to be of another opinion, one by fear either of shame, reproach or censures civil or ecclesiastical, another by mere teaching and instructing.</p></blockquote>

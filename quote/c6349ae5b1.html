<main class="wrap"><figure class="quote" id="q-c6349ae5b1" data-kw="">
<blockquote><p>And surely no Context of Holy Scripture can be solidly explicated, No Common Place of Divinity can be rightly handled, No Polemical or Controversal point can be dextrously descided, No Case of Conscience or Practical Question can be accurately resolved, No Christian Duty can be skilfully urged or advised, without due respect and Scope had to the COVENANT of GOD…. And so should every faithful and skilful Minister have it principally in Design, To be a Preacher of Gods Covenant; and every prudent Christian to be an Hearer and Practitioner of Gods Covenant: Gods Covenant Calling for most intentive respect from them both. So that whilst we are ignorant of the mysteries of Gods Covenant; we are Ignorant of Scriptures, of Christ, and of all Gods gracious Administrations to his Church.</p></blockquote>

</figure><figure class="quote" id="q-b0b9a3104d" data-kw="">
<blockquote><p>For here I observe, that men of learning in other respects have stumbled, who, when explaining the nature of those Sacraments, too incautiously blend things belonging to a quite different covenant. Nothing is here to be brought in which does not belong to the covenant of works, the promises of that covenant, and the duties of man under the same; all which are most distinct from the covenant of grace. Here we are to say nothing of Christ, nothing of justifying faith in him, nothing of our ceasing from our own works as impure, nor any thing of that rest after the miseries of this life. All these belong to another covenant. I do not, however, deny, that the unsearchable wisdom of God did appoint and order these symbols in such a manner that the remembrance of them, after the fall, might be able to instruct man in many things relating to the covenant of grace and its mediator. As that, according to Paul, the first Adam himself was a type of the second; Eve, curiously formed out of Adam’s rib while asleep, was a type of the church, as it were, taken from Christ in virtue of his death; and that the first marriage represented that great mystery which regards Christ and the church. These things, however, were neither known nor thought of in a state of nature; nor to be mentioned in a discourse on the Sacraments of the covenant of works. Having premised these things, let us now inquire into each particular with all the care possible, beginning with Paradise.</p></blockquote>

<blockquote><p>3rdly, Some natural good wishes for his welfare are implied in this love [to the rich young ruler]. There is in every wise and good man a hearty desire of the happiness of his fellow-creatures; he loves them all in this sense, even the foolish and the wicked. Human nature that has any goodness in it, is ready to wish well to any person, though he be an utter stranger and unknown, especially if he has some agreeable qualities. There may be an innocent inclination to see all men happy, though we know this shall not be brought to pass; for the Word of God declares that the most part of men walk in the broad way, and shall go down to hell. You know how passionately St. Paul longed for the salvation of all his countrymen the Jews [Rom. 9]. This is called a love of benevolence; and it is evident, by the following particulars, that the Lord expressed this good-will toward the young man in my text.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-watts.html">Isaac Watts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Sermon VII: A hopeful Youth falling short of Heaven” in Sermons on Various Subjects</cite>, (London: A. Macpherson, 1811), vol. 1, p. 160</span></figcaption>

<main class="wrap"><figure class="quote" id="q-f5c6b28c66" data-kw="">
<blockquote><p>In summary, then, the thrust of the Fifth Way [of Aquinas] is this: (1) Irreducible teleology is immanent to the natural order; (2) But such teleology is unintelligible unless there is an intellect outside the natural order; so (3) There is an intellect outside the natural order. The argument differs from [William] Paley [early-1700’s] style design arguments and the arguments of ID [Intelligent Design] theorists in ways other than those already mentioned. For example, since the entities comprising the natural world have the final causes they have as long as they exist, the intellect in question has to exist as long as the natural world itself does, so as continually to direct things to their ends. The deistic notion that God might have “designed” the world and then left it to run independently is ruled out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, ch. 2, ‘Teleology: a Shopper’s Guide’ in Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015), pp. 28-49, p. 47</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-177272d502" data-kw="">
<blockquote><p>In general, Wittich tried to refute Spinoza’s monism by mobilizing Cartesian principles, which is particularly perspicuous in his discussion of God’s being. However, once he turned to the issue of the divine will, he openly contradicted Descartes’ teaching and approached Spinoza’s necessitarianism. He chose to do so to remain orthodox, evading the accusation of Socinian heresy, which the conservative theologian Petrus van Mastricht had made against his Theologia pacifica (1671). This paper concludes that the widespread fear concerning Socinianism deeply conditioned the way theologians reacted to the Cartesian philosophy in the Netherlands in the late seventeenth century.” – Abstract Sangiacomo, Andrea – ‘Divine Action &amp; God’s Immutability: a Historical Case Study on how to Resist Occasionalism’ European Journal of Philosophy of Religion, 7/4 (Summer 2015), pp. 115-135 Sangiacomo is an associate professor at the faculty of philosophy at the University of Groningen (NL). Abstract: “Today’s debates present ‘occasionalism’ as the position that any satisfying account of divine action must avoid. In this paper I discuss how a leading [French] Cartesian author of the end of the seventeenth century, Pierre-Sylvain Régis [1632–1707], attempted to avoid occasionalism. Régis’s case is illuminating because it stresses both the difficulties connected with the traditional alternatives to occasionalism (so-called ‘concurrentism’ and ‘mere-conservationism’) and also those aspects embedded in the occasionalist position that should be taken into due account. The paper focuses on Régis’s own account of secondary causation in order to show how the challenge of avoiding occasionalism can lead to the development of new accounts of divine action.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/yoshi-kato.html">Yoshi Kato</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Between Cartesianism &amp; Orthodoxy: God &amp; the Problem of Indifference in Christoph Wittich’s Anti-Spinoza</cite>, [1690]’ in Intellectual History Review (2020)</span></figcaption>

<blockquote><p>8. The mode of creation is explained by us with these adjuncts… 3. It is not formally the divine volition, nor the relation of Creator to creature, but it is God Himself creating, denominated by way of principle from Himself and active outside Himself. See Thomas with his own ST, pt. 1, q. 45, articles 2 and 3. But [the act of] creation passively taken is something in the created thing, not really as [yet] having its own entity, but distinguished from it ex natura rei [from the nature of the thing] as its mode. See Suárez, Metaphysical Disputations, disp. 20, sect. 5, and Thomas in the Disputed Questions on Creation, art. 3.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-cd38ed66ee" data-kw="">
<blockquote><p>Now let us see how both these kinds of sorrow belong unto sound repentance. That first sorrow, which is of the law, and is conceived by reason of the punishment which follows sin, I confess it is no part of this holy change and conversion unto God, for of its own nature it does rather estrange us from God, than convert us to God; and, in very deed, it does altogether alienate the wicked from God as from a terrible judge. Notwithstanding, in repentance it has his use, for it prepares the elect by giving them sense of their misery, to that grace and mercy which is propounded in the Gospel. The latter sorrow, which is according to God, and is effected by the Gospel, is properly a part of repentance, and does effect that change of the mind and reason before specified. And, therefore, the apostle says, 2 Cor. 7:10, that the sorrow which is according to God causes repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Works of Robert Rollock</cite>, ed. Gunn (d. 1599; Edinburgh: Wodrow Society, 1849), vol. 1, A Treatise of God’s Effectual Calling, ch. 34, ‘Of Repentance’, p. 242</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

</figure><figure class="quote" id="q-cd558758bf" data-kw="">
<blockquote><p>In man’s conversion to God we urge not the necessity of anything that is unnecessary. We stand not on certain modes, methods and circumstances, in which it may be brought about, wherein the wisdom of God proceeds variously towards several persons, according to the different circumstances of their condition. As for instance, we assert not a general necessity of this or that measure of humiliation, much less of a dismal despairing horror (as some have said of us); we press conviction and humiliation no farther than to make a sinner restless till he come to Christ, and find rest to his soul in Him.</p></blockquote>

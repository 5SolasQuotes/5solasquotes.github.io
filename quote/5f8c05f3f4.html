<main class="wrap"><figure class="quote" id="q-5f8c05f3f4" data-kw="">
<blockquote><p>For besides the moral precepts (in which all mankind are concerned) we have an account of the laws of the Israelites by which they were to be governed in their own land: And though it be true, that these judicial laws were given to the Hebrews, and that they were concerned in them, and that other nations must be governed by the laws of their several countries, yet, certain it is, that the justice and the equity, on which these laws are founded, and which they recommend, are worthy the consideration and imitation too of other nations. And if inquisitive persons think it worth their while to look into the laws of Sparta, and Athens, of Rome and other kingdoms and commonwealths, certainly they must judge the laws of Moses, which came from God Himself, are well worthy their looking into, and their serious consideration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-kidder.html">Richard Kidder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Five Books of Moses</cite>, vol. 1, p. 272</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5111f482c3" data-kw="">
<blockquote><p>The Law of Nature, as it is impressed upon our hearts, so in the goodness of God, it is expressed in his Word, wherein He has not only holden forth these Sacred Mysteries, which could only be known by Revelation, as having no principles in Nature from whence they are deducible, but also, because through sin and evil custom, the Natural Law in man’s heart was much defaced, disordered and erroneously deduced: He has therefore reprinted the Law of Nature in a viver [more vivid and lively] character, in the Scripture, not only having the moral principles, but many conclusions thence flowing particularly set forth. This analogy of the Law of Nature even in the heats of heathens and as it is set down in the Law of God evidences sufficiently, that both of them proceed from the same Omniscient Author.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/viscount-of-stair-james-dalrymple.html">Viscount of Stair James Dalrymple</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Institutions of the Law of Scotland</cite>, vol. 1, p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-6030fd28ab" data-kw="">
<blockquote><p>Learned politicians, as Bartholomeus Romulus, (Defens. part 1, n. 153, and Joannes de Anania (in c. fin. de his qui fil. occid.) teach that “the father is not obliged to reveal the conspiracy of his son against his prince; nor is he more to accuse his son, than to accuse himself, because the father loves the son better than himself,” (D. Listi quidem. Sect. Fin. quod, met. caus, et D. L. fin. c. de cura furiosi) and certainly a father had rather die in his own person, as choose to die in his son’s, in whom he affects a sort of immortality, in specie, quando non potest in individuo [in kind when not able in the individual]; but a king does not love his subjects with a natural or fatherly love thus; and if the affections differ, the power which seconds the affection, for the conservation either of being, or well-being, must also differ proportionally.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-0c1508adb3" data-kw="">
<blockquote><p>9. It seems to threaten a snare when inquiry about the duty of the time is pursued without respect to the present case and circumstances thereof. For thus a snare may wait in a thing at other times indifferent, the neglect whereof under some special circumstances may be a quitting their duty; and the doing also, or yielding to something in another case warrantable, at sometimes may fall under a moral prohibition. As this, when a thing in itself indifferent, circa sacra et cultum Dei [around sacred things and the worship of God], is pressed by the magistrate as necessary by virtue of his sole command, and to the subjecting the godly in things wherein they are not subject, and to the prejudice of an other jurisdiction; can there be an inquiry about this in the general, without a particular application to the complex case? It may be said a snare is then on the entry when that consideration of the prophet is not much regarded in the present question, ‘Is this a time for such a thing?’ For the disciples to refresh themselves with sleep was a piece of innocent duty; but that they could not watch this one hour with their Master in his sufferings, must needs vary the case, for it was in so far a deserting Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-fleming.html">Robert Fleming</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fulfilling of the Scripture</cite>, … (Boston, 1743), Appendix, pp. 508-9</span></figcaption>

<blockquote><p>2. What rulers think good is not a rule for constitutions and for peoples obedience in matters circumstantial; but the rule of rulers here in making laws, and of people in obeying laws, is goodness itself, order, decency, aptitude to edify, in things that they command… 3. Scripture and the Law of nature, and right reason, which is a deduction from Scripture, is able sufficiently in all canons and constitutions to regulate both rulers and people, and to determine what is convenient in circumstances; and the Lord here is an infallible Judge, speaking in his Word, as he is in all matters…</p></blockquote>

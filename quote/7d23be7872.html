<blockquote><p>We have no new calves, new altars, new feasts, but profess, and really do hazard life and estate to put away the Prelate’s calves, images, tree-worship, altar-worship, saints, feast-days, idolatry, masses; and nothing is said here but Jesuits, and Canaanites, and Baalites, might say (though falsely) against the reformation of Josiah. Truth and purity of worship this year is new in relation to idolatry last year, but it is simpliciter older.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 32</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-55f07de450" data-kw="">
<blockquote><p>If one would participatingly accommodate a measure of indecency in a civil assembly for the good in it and out of respect and submission to public order, how much more ought one to do so in charity for the Church’s public worship, as such common and legitimately applied civil principles do not need a Scripture precedent and “God is not the author of confusion, but of peace.” (1 Cor. 14:33)? Often doing something that is inconvenient and less than fully decent or in the best order, given the larger context, is more decent, orderly¹ (1 Cor. 14:40) and conducive to peace,² and less confusing, than not, especially for leaders. ¹ Such as in a person eating the distasteful and questionable food at another’s house so as to prevent offense rather than abstain. How much more in the House of God? ² Zanchi: “Wherefore many things are to be tolerated by the ministers that the peace of churches be not rent and that schisms may be avoided, so that they be not such things or doctrines which do fight with the foundation and do heave at it;” On Philippians, ch. 1, fol. 45, as trans. by Sprint, Cassander Anglicanus, ‘Reformed Practices’, p. 167. Are not peace, love and mercy weightier matters of the Law (Mt. 23:23; Mk. 12:33; Rom. 14:19; 1 Cor. 13:13)? and external ceremonial observances are to give way to moral law? (Hos. 6:6; Mk. 12:33) “But if ye had known what this meaneth, ‘I will have mercy, and not sacrifice,’ ye would not have condemned the guiltless.” (Mt. 12:7)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Extended Editor’s Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, p. 88</span></figcaption>

</figure><figure class="quote" id="q-30672bf3d8" data-kw="">
<blockquote><p>Because it may be thought expedient that these things for a time be borne withal; for it may perhaps produce this effect, that these contentions may be avoided, by the which contentions there is great peril, lest greater and far more important benefits be hindered; and lest the minds of men be at the first beginning turned from the Gospel, as we see it come to pass; Martyr. ibid., fol. 1085 [p. 119]. Because, if the parity of doctrine and of faith do remain entire, the pastors may openly teach and press unto their flocks such doctrine as may serve to take away offenses arising by the use of these ceremonies; Beza, Epist. 12, fol. 99. … Because if some things in their nature indifferent be imposed it is not meet too eagerly to contend about such matters; especially when as we see those magistrates by whom the light of the Gospel is much furthered in England, and by whose authority it may much more be furthered, to oppose themselves against us; Peter Martyr, ibid., fol. 1085 [p. 120], to Hooper.</p></blockquote>

t%20expedient%20that%20these&amp;text=Martyr%2C%20ibid.%2C%20fol.%201085%20%5Bp.%20120%5D%2C%20to%20Hooper" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-74d20fc2b2" data-kw="">
<blockquote><p>I find her Majesty’s [Queen Elizabeth I’s] proceedings to have been grounded upon two principles. The one, that consciences are not to be forced, but to be won and reduced by force of truth, with the aid of time, and use of all good means of instruction and persuasion. The other, that causes of consciences when they exceed their bounds, and grow to be matter of faction, loose their nature, and that soveriegn princes ought distinctly to punish their practices and contempt, though colored with the pretence of conscience and religion. According to these principles, her majesty at her coming to the crown, utterly disliking the tyranny of Rome, which had used by terror and rigor to settle commandments of men’s faiths and consciences. Though as a princess of great wisdom and magnanimity, she suffered but the exercise of one religion; yet her proceedings towards the Papists, was with great lenity: expecting the good effects which time might work in them… her Majesty not liking to make windows into men’s hearts and secret thoughts, except the abundance of them did overflow into overt and express acts or affirmations, tempered her law so… and that… the humors of most Papists were altered, and that they were no more Papists in conscience, and of softness, but Papists in faction: Then were there new laws made for the punishment of such as should submit themselves to such reconcilements, or renunciation of obedience… For the other party, which have been offensive to the State, though in another degree, which named themselves Reformers, and we commonly call ‘Puritans,’ this has been the proceeding towards them: A great while, when they inveighed against such abuses in the Church as pluralities [of benefices], non-residence [of ministers] and the like, their zeal was not condemned, only their violence was sometime censured. When they refused the use of some ceremonies and rites, as superstitious, they were tolerated with much connivancy and gentleness; yea, when they called in question the superiority of bishops, and pretended to a democracy into the Church [many were congregationalists]; yet their propositions were here considered, and by contrary writings debated and discussed. Yet all this while, it was perceived that their course was dangerous and very popular: as because Papistry was odious, therefore it was ever in their mouths that they sought to purge the Church from the relics of Papistry; a thing acceptable to the people, who love ever to run from one extreme to another. Because multitude of rogues and poverty was an eye-sore, and a dislike to every man; therefore they put into the people’s head that if discipline were planted, there should be no vagabonds nor beggars, a thing very plausible: and in like manner they promised the people many of the impossible wonders of their discipline; besides, they opened to the people a way to government by their consistory and presbytery [through ruling elders]; a thing, though in consequence no less prejudicial to the liberties of private men, than to the sovereignty of princes; yet in first show very popular. Nevertheless this, except it were in some few that entered into extreme contempt, was born with, because they pretended in dutiful manner to make propositions, and to leave it to the providence of God, and the authority of the magistrate. But now of later years, when there issued from them that affirmed the consent of the magistrate was not to be attended; when under pretense of a confession, to avoid slander and imputations, they combined themselves by classes and subscriptions, when they descended into that vile and base means of defacing the government of the Church, by ridiculous pasquils [works of satire], when they begun to make many subjects in doubt to take oaths, which is one of the fundamental parts of justice in this land, and in all places; when they began both to vaunt of their strength and number of their partisans and followers, and to use cominations [threatenings] that their cause would prevail, through uproar and violence, then it appeared to be no more zeal, no more conscience, but mere faction and division: and therefore though the State were compelled to hold somewhat a harder hand to retrain them than before, yet was it with as great moderation, as the peace of the State or Church could permit. And therefore, sir, to conclude, consider uprightly of these matters, and you shall see her Majesty is no more a temporizer in religion: It is not the success abroad, nor the change of servants here at home, can alter her; only as the things themselves alter, she applied her religious wisdom to methods correspondent unto them; still retaining the two rules before mentioned, in dealing tenderly with consciences, and yet in discovering faction from conscience, and softness from singularity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-walsingham.html">Francis Walsingham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Monsier Critoy, in Gilbert Burnet, The History of the Reformation of the Church of England 2nd ed. (London: T.H., 1683), vol. 2, pt. 2, bk. 3, pp. 418-20 Walsingham (c. 1532 – 1590) was principal secretary to Queen Elizabeth I of England from 1573 till his death.</cite></span></figcaption>

— Francis Walsingham, Letter to Monsier Critoy, in Gilbert Burnet, The History of the Reformation of the Church of England 2nd ed. (London: T.H., 1683), vol. 2, pt. 2, bk. 3, pp. 418-20 Walsingham (c. 1532 – 1590) was principal secretary to Queen Elizabeth I of England from 1573 till his death.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+find+her+Majesty%E2%80%99s+%5BQueen+Elizabeth+I%E2%80%99s%5D+proceedings+to+have+been+grounded+upon+two+principles.+The+one%2C+that+consciences+are+not+to+be+forced%2C+but+to+be+won+and+reduced+by+force+of+truth%2C+with+the+aid+of+time%2C+and+use+of+all+good+means+of+instruction+and+persuasion.+The+other%2C+that+causes+of+consciences+when+they+exceed+their+bounds%2C+and+grow+to+be+matter+of+faction%2C+loose+their+nature%2C+and+that+soveriegn+princes+ought+distinctly+to+punish+their+practices+and+contempt%2C+though+colored+with+the+pretence+of+conscience+and+religion.+According+to+these+principles%2C+her+majesty+at+her+coming+to+the+crown%2C+utterly+disliking+the+tyranny+of+Rome%2C+which+had+used+by+terror+and+rigor+to+settle+commandments+of+men%E2%80%99s+faiths+and+consciences.+Though+as+a+princess+of+great+wisdom+and+magnanimity%2C+she+suffered+but+the+exercise+of+one+religion%3B+yet+her+proceedings+towards+the+Papists%2C+was+with+great+lenity%3A+expecting+the+good+effects+which+time+might+work+in+them%E2%80%A6+her+Majesty+not+liking+to+make+windows+into+men%E2%80%99s+hearts+and+secret+thoughts%2C+except+the+abundance+of+them+did+overflow+into+overt+and+express+acts+or+affirmations%2C+tempered+her+law+so%E2%80%A6+and+that%E2%80%A6+the+humors+of+most+Papists+were+altered%2C+and+that+they+were+no+more+Papists+in+conscience%2C+and+of+softness%2C+but+Papists+in+faction%3A+Then+were+there+new+laws+made+for+the+punishment+of+such+as+should+submit+themselves+to+such+reconcilements%2C+or+renunciation+of+obedience%E2%80%A6+For+the+other+party%2C+which+have+been+offensive+to+the+State%2C+though+in+another+degree%2C+which+named+themselves+Reformers%2C+and+we+commonly+call+%E2%80%98Puritans%2C%E2%80%99+this+has+been+the+proceeding+towards+them%3A+A+great+while%2C+when+they+inveighed+against+such+abuses+in+the+Church+as+pluralities+%5Bof+benefices%5D%2C+non-residence+%5Bof+ministers%5D+and+the+like%2C+their+zeal+was+not+condemned%2C+only+their+violence+was+sometime+censured.+When+they+refused+the+use+of+some+ceremonies+and+rites%2C+as+superstitious%2C+they+were+tolerated+with+much+connivancy+and+gentleness%3B+yea%2C+when+they+called+in+question+the+superiority+of+bishops%2C+and+pretended+to+a+democracy+into+the+Church+%5Bmany+were+congregationalists%5D%3B+yet+their+propositions+were+here+considered%2C+and+by+contrary+writings+debated+and+discussed.+Yet+all+this+while%2C+it+was+perceived+that+their+course+was+dangerous+and+very+popular%3A+as+because+Papistry+was+odious%2C+therefore+it+was+ever+in+their+mouths+that+they+sought+to+purge+the+Church+from+the+relics+of+Papistry%3B+a+thing+acceptable+to+the+people%2C+who+love+ever+to+run+from+one+extreme+to+another.+Because+multitude+of+rogues+and+poverty+was+an+eye-sore%2C+and+a+dislike+to+every+man%3B+therefore+they+put+into+the+people%E2%80%99s+head+that+if+discipline+were+planted%2C+there+should+be+no+vagabonds+nor+beggars%2C+a+thing+very+plausible%3A+and+in+like+manner+they+promised+the+people+many+of+the+impossible+wonders+of+their+discipline%3B+besides%2C+they+opened+to+the+people+a+way+to+government+by+their+consistory+and+presbytery+%5Bthrough+ruling+elders%5D%3B+a+thing%2C+though+in+consequence+no+less+prejudicial+to+the+liberties+of+private+men%2C+than+to+the+sovereignty+of+princes%3B+yet+in+first+show+very+popular.+Nevertheless+this%2C+except+it+were+in+some+few+that+entered+into+extreme+contempt%2C+was+born+with%2C+because+they+pretended+in+dutiful+manner+to+make+propositions%2C+and+to+leave+it+to+the+providence+of+God%2C+and+the+authority+of+the+magistrate.+But+now+of+later+years%2C+when+there+issued+from+them+that+affirmed+the+consent+of+the+magistrate+was+not+to+be+attended%3B+when+under+pretense+of+a+confession%2C+to+avoid+slander+and+imputations%2C+they+combined+themselves+by+classes+and+subscriptions%2C+when+they+descended+into+that+vile+and+base+means+of+defacing+the+government+of+the+Church%2C+by+ridiculous+pasquils+%5Bworks+of+satire%5D%2C+when+they+begun+to+make+many+subjects+in+doubt+to+take+oaths%2C+which+is+one+of+the+fundamental+parts+of+justice+in+this+land%2C+and+in+all+places%3B+when+they+began+both+to+vaunt+of+their+strength+and+number+of+their+partisans+and+followers%2C+and+to+use+cominations+%5Bthreatenings%5D+that+their+cause+would+prevail%2C+through+uproar+and+violence%2C+then+it+appeared+to+be+no+more+zeal%2C+no+more+conscience%2C+but+mere+faction+and+division%3A+and+therefore+though+the+State+were+compelled+to+hold+somewhat+a+harder+hand+to+retrain+them+than+before%2C+yet+was+it+with+as+great+moderation%2C+as+the+peace+of+the+State+or+Church+could+permit.+And+therefore%2C+sir%2C+to+conclude%2C+consider+uprightly+of+these+matters%2C+and+you+shall+see+her+Majesty+is+no+more+a+temporizer+in+religion%3A+It+is+not+the+success+abroad%2C+nor+the+change+of+servants+here+at+home%2C+can+alter+her%3B+only+as+the+things+themselves+alter%2C+she+applied+her+religious+wisdom+to+methods+correspondent+unto+them%3B+still+retaining+the+two+rules+before+mentioned%2C+in+dealing+tenderly+with+consciences%2C+and+yet+in+discovering+faction+from+conscience%2C+and+softness+from+singularity.%E2%80%9D%0A%0A%E2%80%94+Francis+Walsingham%2C+Letter+to+Monsier+Critoy%2C+in+Gilbert+Burnet%2C+The+History+of+the+Reformation+of+the+Church+of+England+2nd+ed.+%28London%3A+T.H.%2C+1683%29%2C+vol.+2%2C+pt.+2%2C+bk.+3%2C+pp.+418-20+Walsingham+%28c.+1532+%E2%80%93+1590%29+was+principal+secretary+to+Queen+Elizabeth+I+of+England+from+1573+till+his+death.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F74d20fc2b2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="pe <blockquote><p>X. If I say that God, pitying mankind, who through their own crime and the devil’s deceit have fallen into sin and destruction, sent His only-begotten Son. He became man for the sake of men, suffered and died, rose again, and ascended into heaven, obtaining remission of sins and eternal life for them. This great benefit of His Son, God makes known and proclaims to men through the preaching of the Gospel. Those who acknowledge and grieve over their sins, assent to the Gospel, believe in the Son, and trust in His merit and death, are reconciled to God, obtain remission of sins, and are transferred from a state of wrath and damnation to a state of glory and salvation, in which they will remain and surely become partakers of eternal glory, if, since they have believed and been reconciled to God, they strive to observe the divine commandments, do not live according to the flesh, and, with the help of divine grace, avoid committing sins against conscience. Thus, a man will be justified in this life and glorified in the future. If, I say, we use such words, taken from common usage and easily understood by anyone, there can be no disagreement among pious and gentle Christians about the doctrine. No one of them, unless afflicted by a vile and malicious urge to contend and quibble, will question this. But if I say, this is the principal efficient cause; this is the proximate principal cause; this is instrumental on the part of God, this on the part of man; this is merely a disposition; this is the formal cause itself; this is material, this necessary per se, this according to the hypothesis, if I start speaking this way, then it may easily happen that some will misunderstand or plainly not understand me, or interpret me differently than I intend; and thus, a controversy will arise over the use and application of such terms, which is purely scholastic and should not be given such importance that it disrupts the bond of Christian love and concord.</p></blockquote>

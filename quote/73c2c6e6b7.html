<main class="wrap"><figure class="quote" id="q-73c2c6e6b7" data-kw="">
<blockquote><p>And yet I will not deny but that there have been and are mistakes in this matter leaning towards the other extreme. Directions have been given, and that not by a few, for the observation of a day of holy rest, which, either for the matter of them or the manner prescribed, have had no sufficient warrant or foundation in the Scripture.

For whereas some have made no distinction between the Sabbath as moral and as Mosaical, unless it be merely in the change of the day, they have endeavoured to introduce the whole practice required on the latter into the Lord’s day. But we have already showed that there were sundry additions made unto the command, as to the manner of its observance, in its accommodation unto the Mosaical pedagogy, besides that the whole required a frame of spirit suited thereunto.

Others, again, have collected whatever they could think of that is good, pious, and useful in the practice of religion, and prescribed it all, in a multitude of instances, as necessary to the sanctification of this day; so that a man can scarcely in six days read over all the duties that are proposed to be observed on the seventh. And it hath been also no small mistake, that men have laboured more to multiply directions about external duties, giving them out as it were by number or tale, than to direct the mind or inward man in and unto a due performance of the whole duty of the sanctification of the day, according to the spirit and genius of gospel obedience.

And, lastly, it cannot be denied but that some, it may be measuring others by themselves and their own abilities, have been apt to tie them up unto such long, tiresome duties, and rigid abstinences from refreshments, as have clogged their minds, and turned the whole service of the day into a wearisome bodily exercise, that profiteth little.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercitations Concerning the Name, Original, Nature, Use, and Continuance of a Day of Sacred Rest</cite>, (1671), Ex. 6, § 6 in An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations, ed. W. H. Goold (7 vols, Edinburgh: Johnston and Hunter, 1854), 2: 441.</span></figcaption>

<blockquote><p>§50. Yea more, I would not only give men their liberty in this [observing evangelical feast days, which Baxter was not for], but if I lived under a government that peremptorily commanded it, I would observe the outward rest of such a holy day, and I would preach on it, and join with the assemblies in God’s worship on it. Yea I would thus observe the day, rather than offend a weak brother, or hinder any man’s salvation, much more rather than I would make any division in the Church. I think in as great matters as this did Paul condescend when he circumcised Timothy and resolved to eat no flesh while he lived rather than offend his brother, and to become all things to all men for their good. Where a thing is evil but by accident, the greatest accidents must weigh down the less. I may lawfully obey and use the day, when another does unlawfully command it: And I think this is the true case.</p></blockquote>

<blockquote><p>The very condescending of the second person, who natively and essentially is so great, to assume man’s nature, although in this form of God described, invested with all that manifestative glory spoken of, and this from and upon the first moment of his assuming it; if this act of assuming had been done and undertaken principally in order and with intention to satisfy God, by bringing in a new glory to him, greater than that which he lost by him, and this without the least humbling of himself; I ask, why might not this in just reason have been accounted satisfaction?

For (1.) he had thereby lessened himself to give glory to God. For in that assumption, and in that communication of himself to a creature, he takes on him such relations as do in some respects abate of the height of his native personal glory, as he is considered merely as second person; and in respect to this assumption, he is made less than what before he was. For now it may be said of him, as it was by himself, that ‘his Father is greater than he,’ John xiv. 28, whereas he might have kept himself in a foil equality to him in all respects for ever, and to have had no such diminishing respect affixed to him.

And (2.) by this voluntary act alone he had brought in unto God a new and further revelation of the Godhead than ever was obscured by sin; and it is certain that he had never assumed man’s nature, and thus lessened himself, but that so he might manifest the glory of the Godhead in such a manner as otherwise it never should have been. Therefore for him thus to lessen himself, to the end to manifest and exalt the glory of the Godhead the utmost way it could be, or more than otherwise it should have been, might not this make amends for the glory that sin would take from God?

And the reason of this is, that satisfaction being a return of as much glory as was lost, and that by this means (if no other were added) more manifestative glory would come in unto God than either was or ever could have been debased or impaired by sin, why therefore might it not have been accounted satisfactory, if it had been ordered simply unto this end? And further also, even this would have served to fill up many of those disproportions found in the evil of sin.

For as the evil of Adam’s sin (which was the first sin) lay in this, that he who was a creature affected and aspired to be as God — He is become as one of us, said God, Gen. iii. 22 — so Christ’s obedience, in assuming our nature, would herein have answered it, that he that is God becomes a creature, and on the other side is become as one of us men; so to bring in a new honour unto God. So that, look how high our nature would have ascended, so low doth he descend; and as sin is a turning from God to the creature, so in this act the Creator descends from the height of his glory to become a creature, and join himself in a nearer union with us than wherein we in sinning affected to join ourselves to the Creator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Christ the Mediator</cite>, (London, 1642) in The Works of Thomas Goodwin (12 vols, Edinburgh: James Nisbet, 1861-66), 5: 109.</span></figcaption>

And the reason of this is, that satisfaction being a return of as much glory as was lost, and that by this means (if no other were added) more manifestative glory would come in unto God than either was or ever could have been debased or impaired by sin, why therefore might it not have been accounted satisfactory, if it had been ordered simply unto this end? And further also, even this would have served to fill up many of those disproportions found in the evil of sin.

For as the evil of Adam’s sin (which was the first sin) lay in this, that he who was a creature affected and aspired to be as God — He is become as one of us, said God, Gen. iii. 22 — so Christ’s obedience, in assuming our nature, would herein have answered it, that he that is God becomes a creature, and on the other side is become as one of us men; so to bring in a new honour unto God. So that, look how high our nature would have ascended, so low doth he descend; and as sin is a turning from God to the creature, so in this act the Creator descends from the height of his glory to become a creature, and join himself in a nearer union with us than wherein we in sinning affected to join ourselves to the Creator.”

— Thomas Goodwin, A Discourse of Christ the Mediator, (London, 1642) in The Works of Thomas Goodwin (12 vols, Edinburgh: James Nisbet, 1861-66), 5: 109.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+very+condescending+of+the+second+person%2C+who+natively+and+essentially+is+so+great%2C+to+assume+man%E2%80%99s+nature%2C+although+in+this+form+of+God+described%2C+invested+with+all+that+manifestative+glory+spoken+of%2C+and+this+from+and+upon+the+first+moment+of+his+assuming+it%3B+if+this+act+of+assuming+had+been+done+and+undertaken+principally+in+order+and+with+intention+to+satisfy+God%2C+by+bringing+in+a+new+glory+to+him%2C+greater+than+that+which+he+lost+by+him%2C+and+this+without+the+least+humbling+of+himself%3B+I+ask%2C+why+might+not+this+in+just+reason+have+been+accounted+satisfaction%3F%0A%0AFor+%281.%29+he+had+thereby+lessened+himself+to+give+glory+to+God.+For+in+that+assumption%2C+and+in+that+communication+of+himself+to+a+creature%2C+he+takes+on+him+such+relations+as+do+in+some+respects+abate+of+the+height+of+his+native+personal+glory%2C+as+he+is+considered+merely+as+second+person%3B+and+in+respect+to+this+assumption%2C+he+is+made+less+than+what+before+he+was.+For+now+it+may+be+said+of+him%2C+as+it+was+by+himself%2C+that+%E2%80%98his+Father+is+greater+than+he%2C%E2%80%99+John+xiv.+28%2C+whereas+he+might+have+kept+himself+in+a+foil+equality+to+him+in+all+respects+for+ever%2C+and+to+have+had+no+such+diminishing+respect+affixed+to+him.%0A%0AAnd+%282.%29+by+this+voluntary+act+alone+he+had+brought+in+unto+God+a+new+and+further+revelation+of+the+Godhead+than+ever+was+obscured+by+sin%3B+and+it+is+certain+that+he+had+never+assumed+man%E2%80%99s+nature%2C+and+thus+lessened+himself%2C+but+that+so+he+might+manifest+the+glory+of+the+Godhead+in+such+a+manner+as+otherwise+it+never+should+have+been.+Therefore+for+him+thus+to+lessen+himself%2C+to+the+end+to+manifest+and+exalt+the+glory+of+the+Godhead+the+utmost+way+it+could+be%2C+or+more+than+otherwise+it+should+have+been%2C+might+not+this+make+amends+for+the+glory+that+sin+would+take+from+God%3F%0A%0AAnd+the+reason+of+this+is%2C+that+satisfaction+being+a+return+of+as+much+glory+as+was+lost%2C+and+that+by+this+means+%28if+no+other+were+added%29+more+manifestative+glory+would+come+in+unto+God+than+either+was+or+ever+could+have+been+debased+or+impaired+by+sin%2C+why+therefore+might+it+not+have+been+accounted+satisfactory%2C+if+it+had+been+ordered+simply+unto+this+end%3F+And+further+also%2C+even+this+would+have+served+to+fill+up+many+of+those+disproportions+found+in+the+evil+of+sin.%0A%0AFor+as+the+evil+of+Adam%E2%80%99s+sin+%28which+was+the+first+sin%29+lay+in+this%2C+that+he+who+was+a+creature+affected+and+aspired+to+be+as+God+%E2%80%94+He+is+become+as+one+of+us%2C+said+God%2C+Gen.+iii.+22+%E2%80%94+so+Christ%E2%80%99s+obedience%2C+in+assuming+our+nature%2C+would+herein+have+answered+it%2C+that+he+that+is+God+becomes+a+creature%2C+and+on+the+other+side+is+become+as+one+of+us+men%3B+so+to+bring+in+a+new+honour+unto+God.+So+that%2C+look+how+high+our+nature+would+have+ascended%2C+so+low+doth+he+descend%3B+and+as+sin+is+a+turning+from+God+to+the+creature%2C+so+in+this+act+the+Creator+descends+from+the+height+of+his+glory+to+become+a+creature%2C+and+join+himself+in+a+nearer+union+with+us+than+wherein+we+in+sinning+affected+to+join+ourselves+to+the+Creator.%E2%80%9D%0A%0A%E2%80%94+Thomas+Goodwin%2C+A+Discourse+of+Christ+the+Mediator%2C+%28London%2C+1642%29+in+The+Works+of+Thomas+Goodwin+%2812+vols%2C+Edinburgh%3A+James+Nisbet%2C+1861-66%29%2C+5%3A+109.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0e7142fc0f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0e7142fc0f.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/08/06/thomas-goodwin-on-the-condescension-of-christ/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-653b7211b4" data-kw="">
<blockquote><p>It is storied of Caius Marius Victorius, who lived about three hundred years after Christ, and to his old age continued a Pagan; but at last being convinced of the Christian verity, he came to Simplicianus, and told him he would be a Christian; but neither he nor the church could believe it, it being so rare an example for any to be converted at his age; but at last seeing it was real, there was a shouting and gladness, and singing of psalms in all churches; the people crying, Caius Marius Victorius. is become a Christian!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Flavel on the Content of Singing Public Praise to God</cite>, vol. 1; vol. 5, ‘Husbandry Spiritualized’, p. 120</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c3d1f9c44c" data-kw="">
<blockquote><p>…while admitting the metrical translations of other portions of the Bible are not to be compared with mere human hymns, the fact of God’s having gathered the Psalms, Songs, and Hymns of various inspired writers into one Book of Psalms, seems conclusively to show that that book alone was meant to serve as our manual of praise… There must be some reason why the Prayer or Psalm of Moses in the 90th Psalm found a place in that Book, though his Song in the 15th chapter of Exodus did not; why David’s Psalm of thanksgiving, when the ark was brought to Zion (1 Chron. 16:8-36), is reproduced in the 105th, 96th, and 106th Psalms; why the 14th and 53rd PSalms are almost exactly the same; and why the 108th Psalm is embodied in the 57th and 60th. The reason given above seems most satisfactory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-hay-fleming.html">David Hay Fleming</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Hymnology of the Scottish Reformation’</cite>, Part 1, p. 7 in Shorter Writings of David Hay Fleming, vol. 1 (Naphtali Press, 2007)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-3e8fffde8a" data-kw="">
<blockquote><p>1. Because the apostles require us to sing ‘Psalms, Hymns and Spiritual Songs’ (Jm. 5:13; Eph. 5:19; Col. 3:16). Which three are known to be the usual titles of the Scripture Psalms ([Greek &amp; Hebrew] See Ainsworth on the title of Psalm 3).

2. Because these, doubtless, best deserve the title of Spiritual Songs, which were endited by the immediate inspiration of the Holy Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-allen.html">Richard Allen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay to Prove the Singing of Psalms with Conjoined Voices, a Christian Duty</cite>, (London, 1696), p. 59. Allen was likely a baptist as at least two of the ministers recommending his book in the preface were baptists and as he is mainly arguing against the position that held that the psalms in meter ought not to be sung at all. He argues for majority psalm singing in the work.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

2. Because these, doubtless, best deserve the title of Spiritual Songs, which were endited by the immediate inspiration of the Holy Spirit.”

</figure><figure class="quote" id="q-87cc47f55f" data-kw="">
<blockquote><p>Q. 12. What is the duty of worthy receivers, after the sacra- ment? A. Their duty is, heartily to bless God for Christ, and the benefits of his blood, Mt. 26:30, ‘And when they had sung an hymn, they went out into the mount of Olives;’ to double their care and watchfulness against sin; Eph. 4:30…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Flavel on the Content of Singing Public Praise to God</cite>, Exposition of the Assembly’s Catechism, p. 291, vol. 1; vol. 6</span></figcaption>

</figure><figure class="quote" id="q-17d2591676" data-kw="">
<blockquote><p>And the best recreation to a spiritual mind, when it is weary of worldly employments, is to walk into Christ’s garden, and there, by reading and meditating, singing of Psalms (Col. 3:16) and holy conference, you may solace yourself with the sweet comforts of the holy Spirit, and may work your heart to joy in God, even to joy in the holy Ghost, and to a delight in the Commandments and Word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-scudder.html">Henry Scudder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Daily Walk in Holy Security and Peace</cite>, … (London, 1631), ch. 9, ‘Of keeping Company, as in the sight of God’, section 3, p. 236-7. While Scudder in the passage immediately below allows Col. 3:16 to speak of uninspired compositions in the context of private or social conference, yet the only reference in the book to the content of the Church’s public praise is to ‘psalms’ simply, as is documented below., pp. 64-65</span></figcaption>

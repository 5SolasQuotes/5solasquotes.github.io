<blockquote><p>[T]he Antinomians, who seem to deny all the preparatory works upon the heart of man; holding, that Christ immediately communicateth himself to gross sinners abiding so: and though they hold us passive at the first receiving of Christ, which all orthodox do; yet they express it in an unsound sense, comparing God unto a Physician, that doth violently open the sick man’s throat, and pour down his physick whether he will or no …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis: or, a vindication of the moral law and the covenants, from the errors of the papists, Arminians, Socinians, and more especially, Antinomians. In XXX lectures, preached at Laurence-Jury,</cite>, London (2nd edn, London, 1647), p. 84.</span></figcaption>

<blockquote><p>In man’s conversion to God we urge not the necessity of anything that is unnecessary. We stand not on certain modes, methods and circumstances, in which it may be brought about, wherein the wisdom of God proceeds variously towards several persons, according to the different circumstances of their condition. As for instance, we assert not a general necessity of this or that measure of humiliation, much less of a dismal despairing horror (as some have said of us); we press conviction and humiliation no farther than to make a sinner restless till he come to Christ, and find rest to his soul in Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Account given of the Principles &amp; Practices of Several Nonconformists</cite>, … (London: Parkhurst, 1682), pp. 19-20</span></figcaption>

<blockquote><p>V. Restoration or restitution, in the case of a lapse, or of prolonged custom in some sin, or of spiritual relapse—which can be called a kind of second regeneration and specifically a renovation (Galatians 4:19; 2 Corinthians 2:7–8). Problem I. Whether in such a case the habits were diminished, or rather only the acts impeded? Eighteen years ago we inclined to the affirmative of the latter, and we wiped away the cavils of the Remonstrant darkener against this our assertion in the Thersites Heautontimorumenos [Thersites the Self-Tormentor]. Nor did any of the most distinguished theologians who attested in letters sent to me that they had read that writing see anything heterodox in it. Problem II. Whether the habit is restored through infusion or apposition of a degree or augmentation, which happens at once and simultaneously through the practice of renewed faith and repentance; or rather gradually and successively through frequent and repeated actions? [No answer is given in the English]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

<blockquote><p>Doct. II. That it is in vain for any sinful persons to expect Gods turning to them in mercy and favour, who do not turn unto him with true repentance and reformation; but while they continue in their sins, they must expect that God will come forth against them, as the Lord of Hosts, commanding and ordering all his Creatures against them for their hurt. …

First, Turning to the Lord, implies, 1. That by sin continued in, men turn from the Lord, and against the Lord: as when men turn from one another in enmity, they turn their backs one to another, and their faces to opposite objects; so it is in this case, continuers in sin turn from God and his Word, to Sin, and the World, and Satan, which are opposite to God in his holy and righteous Laws; and God turns his face and favour from them, and his wrath and indignation against them. Hence it is that the Lord saith of those that disobey the instructions of his word, that they have turned the back to him, and not the face, Jerem. 32. 33. and accordingly he threatneth them, that he will shew them his back, and not his face, in the day of their calamity. Thus you see what this turning to the Lord implies.

Secondly, This turning to the Lord imports two things; Repentance for, and from all their evil ways; and Reformation of them: A hearty turning to God, through faith in Christ, and unfeigned love to God in Christ, with an universal conformity to his holy and righteous Rules and ways; as they resolved in Isa. 26.13. It is true, that we cannot turn unto God of our selves, till he turn us unto himself, as you may see in Deut. 29.2, 3, 4. yet, when God calleth the vessels of mercy to turn unto him, and addeth his Promise for their encouragement thereunto, his Spirit in and by the promise, works converting grace in them: which works in them 1. Hearty prayer unto God to convert them, as Isai. 63.17. Jerem. 31.18. Lam. 5.31. 2. Actual Conversion to God, in answer to God’s calling them thereunto, Psal. 27.8. as in Jer. 31.22. This turning to God is right,

1. When it ariseth from right motives. The right motives of turning to God, are not Temporal, only for removing of some temporal Affliction, whether felt or feared; or for obtaining some temporal good, which we want and desire: for such a turning is not to the Lord, but to our selves, as you may see in Hos. 7.16. with Zech. 7.5. But the right motives of turning to God are Eternal, viz. A serious and fixed apprehension of Eternal life and death, in relation to God, and his everlasting favour and wrath, in the incomprehensible greatness and vastness of them: when these are not transient and vanishing, but fixed in the heart by the Spirit, and when they are looked at, not as far off, but as present; Then they work an effectual and present conversion to God. Therefore Christ taught his Disciples to use this motive in preaching the Gospel, for the conversion of sinners to God, Mark 16.16. and Christ himself used the same motive, Joh. 3.18, 36. and the reason is, because then a man seeth better and stronger reasons for his turning to God, then the world can give for his continuing in sin, 2 Cor. 4.18. from love to God, Psal. 97.10. Ye that love the Lord, hate evil.

2. When it’s done in a right manner, with the whole heart, Joel 2.12. that is, when a full resolution of turning to God, follows a full illumination and conviction; otherwise, when men have some motives to turn, but not enough, they are not fully convinced, and so they turn but by halves, and feignedly, Jer. 3.10. Hence a right turning to God, is described as the Effect opening men’s eyes, Acts 26.18. wherein is included the opening of their hearts, as in Acts 16.14. Lydia.

3. When it produceth suitable effects: 1. That sin, which had dominion in them, is dispossessed, and grace is made Master of the house; so as though sin gets in and dwells in them, yet it is by intrusion and usurpation, as a Thief or Enemy, which are expelled as soon as they are discovered, and sufficient strength is gained. 2. That sin is hated; as the Lord commanded Israel to do against Amalek, 1 Sam. 15.3. this appears,

1. By their thrusting out the motions and lusts of sin out of their hearts with indignation, Isa. 30.22. and shutting the doors of the Soul, the Eyes and Ears, against temptations to it. They say in effect, as Ephraim did, in Hos. 14.8. What have I to do any more with Idols? Thus Amnon dealt with Tamar, 1 Sam. 13.15, 17.

2. By their seeking the utter destruction and full mortification of sin: for, hatred is implacable against the whole kind, as we see in a Wolf against all Sheep; nothing will satisfy but the death of its object, as the Lord commanded Israel to do against Amalek, 1 Sam. 15.3.

3. By a continual fight against sin, till it be fully subdued. Gal. 5.17. The flesh lusteth against the Spirit, and the Spirit against the flesh. 1 Pet. 2.11. Dearly beloved, I beseech you as strangers and pilgrims, abstain from fleshly lusts, which war against the soul. Hence they will account them their best friends that help them against sin, their worst enemy.</p></blockquote>

y+halves%2C+and+feignedly%2C+Jer.+3.10.+Hence+a+right+turning+to+God%2C+is+described+as+the+Effect+opening+men%E2%80%99s+eyes%2C+Acts+26.18.+wherein+is+included+the+opening+of+their+hearts%2C+as+in+Acts+16.14.+Lydia.%0A%0A3.+When+it+produceth+suitable+effects%3A+1.+That+sin%2C+which+had+dominion+in+them%2C+is+dispossessed%2C+and+grace+is+made+Master+of+the+house%3B+so+as+though+sin+gets+in+and+dwells+in+them%2C+yet+it+is+by+intrusion+and+usurpation%2C+as+a+Thief+or+Enemy%2C+which+are+expelled+as+soon+as+they+are+discovered%2C+and+sufficient+strength+is+gained.+2.+That+sin+is+hated%3B+as+the+Lord+commanded+Israel+to+do+against+Amalek%2C+1+Sam.+15.3.+this+appears%2C%0A%0A1.+By+their+thrusting+out+the+motions+and+lusts+of+sin+out+of+their+hearts+with+indignation%2C+Isa.+30.22.+and+shutting+the+doors+of+the+Soul%2C+the+Eyes+and+Ears%2C+against+temptations+to+it.+They+say+in+effect%2C+as+Ephraim+did%2C+in+Hos.+14.8.+What+have+I+to+do+any+more+with+Idols%3F+Thus+Amnon+dealt+with+Tamar%2C+1+Sam.+13.15%2C+17.%0A%0A2.+By+their+seeking+the+utter+destruction+and+full+mortification+of+sin%3A+for%2C+hatred+is+implacable+against+the+whole+kind%2C+as+we+see+in+a+Wolf+against+all+Sheep%3B+nothing+will+satisfy+but+the+death+of+its+object%2C+as+the+Lord+commanded+Israel+to+do+against+Amalek%2C+1+Sam.+15.3.%0A%0A3.+By+a+continual+fight+against+sin%2C+till+it+be+fully+subdued.+Gal.+5.17.+The+flesh+lusteth+against+the+Spirit%2C+and+the+Spirit+against+the+flesh.+1+Pet.+2.11.+Dearly+beloved%2C+I+beseech+you+as+strangers+and+pilgrims%2C+abstain+from+fleshly+lusts%2C+which+war+against+the+soul.+Hence+they+will+account+them+their+best+friends+that+help+them+against+sin%2C+their+worst+enemy.%E2%80%9D%0A%0A%E2%80%94+John+Davenport%2C+God%E2%80%99s+call+to+his+people+to+turn+to+him%3B+together+with+his+promise+to+turn+unto+them.+Opened+and+applied+in+II.+Sermons+at+public+fasting-days+appointed+by+authority%2C+%28Cambridge%3A+John+Usher%2C+1669%29%2C+pp+11-14.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5cd0997c2c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5cd0997c2c.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/06/16/john-davenport-on-turning-unto-god-in-true-repentance/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>IV. Problem: Whether in all or in some to be converted there are preparatory dispositions which concur by some causality of their own to regeneration? Response: The Pelagianizers say affirmatively. See Cornelius à Lapide on Acts 10:2. Of the orthodox, some seem to concede something similar, but in a far different manner and scope. We say absolutely negatively, as we gather above from the explanation of the terminus a quo, and further from these reasons and distinctions:

      1. Because man is destitute of all faculty, habit, disposition, and spiritual act, being indeed natural, not fit, dead, etc., 1 Corinthians 2:14; and 2 Corinthians 3 [3:5]; Ephesians 2 [2:1-5]; Colossians 2 [2:13]; John 14:18–19 [This should be 15:5]; sin reigns in him, Romans 6:12–14.

      2. Because these absurdities would follow: that there is an intermediate state between regenerate and unregenerate; that man in the first moment conducts himself actively; that always the better are regenerated, that is, those making better use of natural gifts and aids and other ecclesiastical aids, and thus finally merit de congruo [of congruity]; that restraining or coercing grace is salvific and of itself ordained to salvation, indeed has an infallible connection with it—which is the same as if it were regenerating and converting grace, and consequently the unregenerate would be regenerate.

      3. Because, briefly, from this discourse the truth of our assertion is evident, and at the same time the sources of solutions are indicated, by which objections can be met and very many things in the Practical writers can be explained and reconciled. That man who is said to be disposed before regeneration either is regenerate in infancy only, without any actual conversion; or moreover from infancy was educated in faith and repentance and thus gradually actually converted; or has persisted without any regeneration and actual conversion up to the point of his regeneration in advanced or at least adult age. If the first or second is posited, we already have one regenerate or first converted, and consequently whatever good he does is not a cause and preparation for first regeneration, but its effect. But if the third is posited, I now ask whether those acts and dispositions have an infallible connection with salvation or not. If the former is said: I now reply that they are acts and effects of salvific grace and of the regenerating Spirit—for example, grief for sins, salvific despair, desire for grace, salvific desire for the Word and its hearing, sighs, groans, aspirations, searchings for means, etc., Mt. 5:3–4, 6; Ps. 51:17 and 119:40, 67, compared with 2 Cor. 7:9–10; Acts 2:37; and 9:6, 9 (with 22:16); and 16:29–30. I say they are effects of the Spirit for a twofold reason: First, because He gave and impressed the new creature, from which as from a principle those acts are elicited. Then, by second grace He moved and excited the man now regenerate to those homogeneous acts. Therefore all those motions are effects and acts of regeneration, and thus pertain to its second moment or to the practice of repentance. But we here inquire concerning regeneration itself properly and strictly so called, which is the action of God alone, or concerning the first moment of conversion: namely, whether dispositions precede it. But that those motions of first actual conversion and repentance are called by some practical writers preparatory, initial, preliminary, by this very fact it is not denied that they are from special grace of the regenerating Spirit. As in natural things both preparatory dispositions and the introduced form itself are from the one generating. Then they are not called such as compared with the first moment of regeneration and its proper and formal terminus, namely, the new dispositions or habits then infused and impressed; but as compared with the second acts in the second moment of conversion. Third, indeed they are not even called dispositive in relation to all second acts or to the whole conversion in the second act (for nothing can simultaneously be cause and effect in the same respect); but they are specifically called such in relation to the direct act of faith by which Christ is apprehended and applied; indeed most specifically in relation to the reflexive act of faith, by which one evidently concludes and perceives that he is in a state of grace. Fourth, every preceding act in the whole practice of conversion is by its nature ordained to the following act as something preparatory, or as an elicited aid. Indeed, of each disposition or habit—for example, of repentance, hope, faith, etc.—the preceding, initial, incomplete, or unformed act (if one may so speak) prepares and disposes for a homogeneous following, complete, formed act. And thus the practice and theology of the practical writers is best reconciled with the dogmatics. But if the latter is said, I now reply that common restraining grace through natural aids is no more a preparatory disposition inhering in the man to be converted than genius, memory, or hearing granted to man. For nature in man is not grace, nor preparation for grace. External occasions presented, such as miracles, judgments of God, the setting forth of the Word, of themselves place no disposition or aptitude in man.

V. Problem: Whether restraining grace through common ecclesiastical aids, if not in itself, at least with respect to the divine intention, is a disposition to regeneration? Response: Negative. It can be a simple antecedent occasion, and a cause (which they call) sine qua non [without which not], and that from the special intention of God; but that one thing is ordained to another as cause to effect, as active potency productive of regeneration, or as passive potency or disposition habilitating the subject to receive its impression, must by no means be conceded, Jn. 3:5–6; and 6:44–45; 14:17; 2 Cor. 3:5; Eph. 2:12–13. And it would follow that human nature, for example in David or Peter, or the rational intellect, could be called a preparatory disposition of their regeneration: because God, when He intended to create it as author of nature, at the same time intended to produce in that nature regeneration as author of grace. Nowhere has God revealed that grace is from and of nature as from a cause, and that He as author of nature is the author of grace, and that the terminus or formal effect of both operations is the same, or that the latter depends on the former as on a cause.

VI. Problem: Whether the Word of God is heard savingly before conversion? Response: Negative, from Rom. 14 [v. 23]; Heb. 4:1–2; and 11:2, 6; Titus 1:15. Compare Catechism Question 8, and the particular Disputation of Dr. Maccovius on this question in his Collection of Disputations, pt. 4, Disputation 1, and in his Miscellaneous Disputations, vol. 2; and Vedelius in his treatise On the God of the Synagogue, pp. 40–41; and Stechman’s Photinianism, Disputation 28, Question 2. Ames seems to have dissented here, whom compare in his Cases, especially in the disputation appended at the end to his Rescription against Grevinckhovius, 12mo edition, pp. 49, 66. But it is objected: Objection 1. Therefore the Word is not to be heard by the unregenerate. Response: Negative. It is to be heard, and indeed duly. But if they omit that condition and manner, they do wrong. Furthermore, the Word is per se [in itself] good, as also the hearing of the Word; if per accidens [accidentally] it becomes evil to men by their own fault, they ought not hence to deliberate about omitting that which is per se good and commanded by God, but rather about omitting their own evil, by which per accidens that good is polluted and rendered evil to them. See that distinction of per se and per accidens inculcated, if not ἀντιλεκτικῶς [antilektikōs, contradistinctively], at least ἰσοδυναμούντως [isodynamountōs, equivalently], in Rom. 7:10–13. A similar objection could be raised concerning unbelievers, namely, Gentiles, Jews, etc., that they should not be stimulated and guided by our precepts, admonitions, and examples to ethical, economic, and political virtues, because their virtues are splendid sins, as Augustine speaks. Indeed, concerning the regenerate and faithful themselves, someone could thus argue sophistically that they should not be stimulated to good works: that no good works should be done because per accidens they are polluted by sins of the indwelling flesh, according to our Catechism, Question 62. Objection 2. Therefore the Word is not to be preached to them, because we do not know whether and who will hear it savingly and who will turn it to their own evil. Response: Negatively, from 2 Tim. 2:25–26 with 1 Cor. 3:6–7. Something similar Tilenus objected in a sacrilegious and satirical booklet published in French against the orthodox doctrine concerning grace, which we refuted in the vernacular language. This objection presupposes this false hypothesis: that the Gospel is to be preached by us to no one unless by the judgment of faith we are certain of the following conversion and salvific hearing. To the contrary, see the texts just cited, and Eze. 2; Ex. 7.</p></blockquote>

VI. Problem: Whether the Word of God is heard savingly before conversion? Response: Negative, from Rom. 14 [v. 23]; Heb. 4:1–2; and 11:2, 6; Titus 1:15. Compare Catechism Question 8, and the particular Disputation of Dr. Maccovius on this question in his Collection of Disputations, pt. 4, Disputation 1, and in his Miscellaneous Disputations, vol. 2; and Vedelius in his treatise On the God of the Synagogue, pp. 40–41; and Stechman’s Photinianism, Disputation 28, Question 2. Ames seems to have dissented here, whom compare in his Cases, especially in the disputation appended at the end to his Rescription against Grevinckhovius, 12mo edition, pp. 49, 66. But it is objected: Objection 1. Therefore the Word is not to be heard by the unregenerate. Response: Negative. It is to be heard, and indeed duly. But if they omit that condition and manner, they do wrong. Furthermore, the Word is per se [in itself] good, as also the hearing of the Word; if per accidens [accidentally] it becomes evil to men by their own fault, they ought not hence to deliberate about omitting that which is per se good and commanded by God, but rather about omitting their own evil, by which per accidens that good is polluted and rendered evil to them. See that distinction of per se and per accidens inculcated, if not ἀντιλεκτικῶς [antilektikōs, contradistinctively], at least ἰσοδυναμούντως [isodynamountōs, equivalently], in Rom. 7:10–13. A similar objection could be raised concerning unbelievers, namely, Gentiles, Jews, etc., that they should not be stimulated and guided by our precepts, admonitions, and examples to ethical, economic, and political virtues, because their virtues are splendid sins, as Augustine speaks. Indeed, concerning the regenerate and faithful themselves, someone could thus argue sophistically that they should not be stimulated to good works: that no good works should be done because per accidens they are polluted by sins of the indwelling flesh, according to our Catechism, Question 62. Objection 2. Therefore the Word is not to be preached to them, because we do not know whether and who will hear it savingly and who will turn it to their own evil. Response: Negatively, from 2 Tim. 2:25–26 with 1 Cor. 3:6–7. Something similar Tilenus objected in a sacrilegious and satirical booklet published in French against the orthodox doctrine concerning grace, which we refuted in the vernacular language. This objection presupposes this false hypothesis: that the Gospel is to be preached by us to no one unless by the judgment of faith we are certain of the following conversion and salvific hearing. To the contrary, see the texts just cited, and Eze. 2; Ex. 7.”

— Gisbertus Voetius, Disputation 29, ‘On Regeneration’, pt. 1, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 432-65 Latin at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIV.+Problem%3A+Whether+in+all+or+in+some+to+be+converted+there+are+preparatory+dispositions+which+concur+by+some+causality+of+their+own+to+regeneration%3F+Response%3A+The+Pelagianizers+say+affirmatively.+See+Cornelius+%C3%A0+Lapide+on+Acts+10%3A2.+Of+the+orthodox%2C+some+seem+to+concede+something+similar%2C+but+in+a+far+different+manner+and+scope.+We+say+absolutely+negatively%2C+as+we+gather+above+from+the+explanation+of+the+terminus+a+quo%2C+and+further+from+these+reasons+and+distinctions%3A+1.+Because+man+is+destitute+of+all+faculty%2C+habit%2C+disposition%2C+and+spiritual+act%2C+being+indeed+natural%2C+not+fit%2C+dead%2C+etc.%2C+1+Corinthians+2%3A14%3B+and+2+Corinthians+3+%5B3%3A5%5D%3B+Ephesians+2+%5B2%3A1-5%5D%3B+Colossians+2+%5B2%3A13%5D%3B+John+14%3A18%E2%80%9319+%5BThis+should+be+15%3A5%5D%3B+sin+reigns+in+him%2C+Romans+6%3A12%E2%80%9314.+2.+Because+these+absurdities+would+follow%3A+that+there+is+an+intermediate+state+between+regenerate+and+unregenerate%3B+that+man+in+the+first+moment+conducts+himself+actively%3B+that+always+the+better+are+regenerated%2C+that+is%2C+those+making+better+use+of+natural+gifts+and+aids+and+other+ecclesiastical+aids%2C+and+thus+finally+merit+de+congruo+%5Bof+congruity%5D%3B+that+restraining+or+coercing+grace+is+salvific+and+of+itself+ordained+to+salvation%2C+indeed+has+an+infallible+connection+with+it%E2%80%94which+is+the+same+as+if+it+were+regenerating+and+converting+grace%2C+and+consequently+the+unregenerate+would+be+regenerate.+3.+Because%2C+briefly%2C+from+this+discourse+the+truth+of+our+assertion+is+evident%2C+and+at+the+same+time+the+sources+of+solutions+are+indicated%2C+by+which+objections+can+be+met+and+very+many+things+in+the+Practical+writers+can+be+explained+and+reconciled.+That+man+who+is+said+to+be+disposed+before+regeneration+either+is+regenerate+in+infancy+only%2C+without+any+actual+conversion%3B+or+moreover+from+infancy+was+educated+in+faith+and+repentance+and+thus+gradually+actually+converted%3B+or+has+persisted+without+any+regeneration+and+actual+conversion+up+to+the+point+of+his+regeneration+in+advanced+or+at+least+adult+age.+If+the+first+or+second+is+posited%2C+we+already+have+one+regenerate+or+first+converted%2C+and+consequently+whatever+good+he+does+is+not+a+cause+and+preparation+for+first+regeneration%2C+but+its+effect.+But+if+the+third+is+posited%2C+I+now+ask+whether+those+acts+and+dispositions+have+an+infallible+connection+with+salvation+or+not.+If+the+former+is+said%3A+I+now+reply+that+they+are+acts+and+effects+of+salvific+grace+and+of+the+regenerating+Spirit%E2%80%94for+example%2C+grief+for+sins%2C+salvific+despair%2C+desire+for+grace%2C+salvific+desire+for+the+Word+and+its+hearing%2C+sighs%2C+groans%2C+aspirations%2C+searchings+for+means%2C+etc.%2C+Mt.+5%3A3%E2%80%934%2C+6%3B+Ps.+51%3A17+and+119%3A40%2C+67%2C+compared+with+2+Cor.+7%3A9%E2%80%9310%3B+Acts+2%3A37%3B+and+9%3A6%2C+9+%28with+22%3A16%29%3B+and+16%3A29%E2%80%9330.+I+say+they+are+effects+of+the+Spirit+for+a+twofold+reason%3A+First%2C+because+He+gave+and+impressed+the+new+creature%2C+from+which+as+from+a+principle+those+acts+are+elicited.+Then%2C+by+second+grace+He+moved+and+excited+the+man+now+regenerate+to+those+homogeneous+acts.+Therefore+all+those+motions+are+effects+and+acts+of+regeneration%2C+and+thus+pertain+to+its+second+moment+or+to+the+practice+of+repentance.+But+we+here+inquire+concerning+regeneration+itself+properly+and+strictly+so+called%2C+which+is+the+action+of+God+alone%2C+or+concerning+the+first+moment+of+conversion%3A+namely%2C+whether+dispositions+precede+it.+But+that+those+motions+of+first+actual+conversion+and+repentance+are+called+by+some+practical+writers+preparatory%2C+initial%2C+preliminary%2C+by+this+very+fact+it+is+not+denied+that+they+are+from+special+grace+of+the+regenerating+Spirit.+As+in+natural+things+both+preparatory+dispositions+and+the+introduced+form+itself+are+from+the+one+generating.+Then+they+are+not+called+such+as+compared+with+the+first+moment+of+regeneration+and+its+proper+and+formal+terminus%2C+namely%2C+the+new+dispositions+or+habits+then+infused+and+impressed%3B+but+as+compared+with+the+second+acts+in+the+second+moment+of+conversion.+Third%2C+indeed+they+are+not+even+called+dispositive+in+relation+to+all+second+acts+or+to+the+whole+conversion+in+the+second+act+%28for+nothing+can+simultaneously+be+cause+and+effect+in+the+same+respect%29%3B+but+they+are+specifically+called+such+in+relation+to+the+direct+act+of+faith+by+which+Christ+is+apprehended+and+applied%3B+indeed+most+specifically+in+relation+to+the+reflexive+act+of+faith%2C+by+which+one+evidently+concludes+and+perceives+that+he+is+in+a+state+of+grace.+Fourth%2C+every+preceding+act+in+the+whole+practice+of+conversion+is+by+its+nature+ordained+to+the+following+act+as+something+preparatory%2C+or+as+an+elicited+aid.+Indeed%2C+of+each+disposition+or+habit%E2%80%94for+example%2C+of+repentance%2C+hope%2C+faith%2C+etc.%E2%80%94the+preceding%2C+initial%2C+incomplete%2C+or+unformed+act+%28if+one+may+so+speak%29+prepares+and+disposes+for+a+homogeneous+following%2C+complete%2C+formed+act.+And+thus+the+practice+and+theology+of+the+practical+writers+is+best+reconciled+with+the+dogmatics.+But+if+the+latter+is+said%2C+I+now+reply+that+common+restraining+grace+through+natural+aids+is+no+more+a+preparatory+disposition+inhering+in+the+man+to+be+converted+than+genius%2C+memory%2C+or+hearing+granted+to+man.+For+nature+in+man+is+not+grace%2C+nor+preparation+for+grace.+External+occasions+presented%2C+such+as+miracles%2C+judgments+of+God%2C+the+setting+forth+of+the+Word%2C+of+themselves+place+no+disposition+or+aptitude+in+man.+V.+Problem%3A+Whether+restraining+grace+through+common+ecclesiastical+aids%2C+if+not+in+itself%2C+at+least+with+respect+to+the+divine+intention%2C+is+a+disposition+to+regeneration%3F+Response%3A+Negative.+It+can+be+a+simple+antecedent+occasion%2C+and+a+cause+%28which+they+call%29+sine+qua+non+%5Bwithout+which+not%5D%2C+and+that+from+the+special+intention+of+God%3B+but+that+one+thing+is+ordained+to+another+as+cause+to+effect%2C+as+active+potency+productive+of+regeneration%2C+or+as+passive+potency+or+disposition+habilitating+the+subject+to+receive+its+impression%2C+must+by+no+means+be+conceded%2C+Jn.+3%3A5%E2%80%936%3B+and+6%3A44%E2%80%9345%3B+14%3A17%3B+2+Cor.+3%3A5%3B+Eph.+2%3A12%E2%80%9313.+And+it+would+follow+that+human+nature%2C+for+example+in+David+or+Peter%2C+or+the+rational+intellect%2C+could+be+called+a+preparatory+disposition+of+their+regeneration%3A+because+God%2C+when+He+intended+to+create+it+as+author+of+nature%2C+at+the+same+time+intended+to+produce+in+that+nature+regeneration+as+author+of+grace.+Nowhere+has+God+revealed+that+grace+is+from+and+of+nature+as+from+a+cause%2C+and+that+He+as+author+of+nature+is+the+author+of+grace%2C+and+that+the+terminus+or+formal+effect+of+both+operations+is+the+same%2C+or+that+the+latter+depends+on+the+former+as+on+a+cause.+VI.+Problem%3A+Whether+the+Word+of+God+is+heard+savingly+before+conversion%3F+Response%3A+Negative%2C+from+Rom.+14+%5Bv.+23%5D%3B+Heb.+4%3A1%E2%80%932%3B+and+11%3A2%2C+6%3B+Titus+1%3A15.+Compare+Catechism+Question+8%2C+and+the+particular+Disputation+of+Dr.+Maccovius+on+this+question+in+his+Collection+of+Disputations%2C+pt.+4%2C+Disputation+1%2C+and+in+his+Miscellaneous+Disputations%2C+vol.+2%3B+and+Vedelius+in+his+treatise+On+the+God+of+the+Synagogue%2C+pp.+40%E2%80%9341%3B+and+Stechman%E2%80%99s+Photinianism%2C+Disputation+28%2C+Question+2.+Ames+seems+to+have+dissented+here%2C+whom+compare+in+his+Cases%2C+especially+in+the+disputation+appended+at+the+end+to+his+Rescription+against+Grevinckhovius%2C+12mo+edition%2C+pp.+49%2C+66.+But+it+is+objected%3A+Objection+1.+Therefore+the+Word+is+not+to+be+heard+by+the+unregenerate.+Response%3A+Negative.+It+is+to+be+heard%2C+and+indeed+duly.+But+if+they+omit+that+condition+and+manner%2C+they+do+wrong.+Furthermore%2C+the+Word+is+per+se+%5Bin+itself%5D+good%2C+as+also+the+hearing+of+the+Word%3B+if+per+accidens+%5Baccidentally%5D+it+becomes+evil+to+men+by+their+own+fault%2C+they+ought+not+hence+to+deliberate+about+omitting+that+which+is+per+se+good+and+commanded+by+God%2C+but+rather+about+omitting+their+own+evil%2C+by+which+per+accidens+that+good+is+polluted+and+rendered+evil+to+them.+See+that+distinction+of+per+se+and+per+accidens+inculcated%2C+if+not+%E1%BC%80%CE%BD%CF%84%CE%B9%CE%BB%CE%B5%CE%BA%CF%84%CE%B9%CE%BA%E1%BF%B6%CF%82+%5Bantilektik%C5%8Ds%2C+contradistinctively%5D%2C+at+least+%E1%BC%B0%CF%83%CE%BF%CE%B4%CF%85%CE%BD%CE%B1%CE%BC%CE%BF%CF%8D%CE%BD%CF%84%CF%89%CF%82+%5Bisodynamount%C5%8Ds%2C+equivalently%5D%2C+in+Rom.+7%3A10%E2%80%9313.+A+similar+objection+could+be+raised+concerning+unbelievers%2C+namely%2C+Gentiles%2C+Jews%2C+etc.%2C+that+they+should+not+be+stimulated+and+guided+by+our+precepts%2C+admonitions%2C+and+examples+to+ethical%2C+economic%2C+and+political+virtues%2C+because+their+virtues+are+splendid+sins%2C+as+Augustine+speaks.+Indeed%2C+concerning+the+regenerate+and+faithful+themselves%2C+someone+could+thus+argue+sophistically+that+they+should+not+be+stimulated+to+good+works%3A+that+no+good+works+should+be+done+because+per+accidens+they+are+polluted+by+sins+of+the+indwelling+flesh%2C+according+to+our+Catechism%2C+Question+62.+Objection+2.+Therefore+the+Word+is+not+to+be+preached+to+them%2C+because+we+do+not+know+whether+and+who+will+hear+it+savingly+and+who+will+turn+it+to+their+own+evil.+Response%3A+Negatively%2C+from+2+Tim.+2%3A25%E2%80%9326+with+1+Cor.+3%3A6%E2%80%937.+Something+similar+Tilenus+objected+in+a+sacrilegious+and+satirical+booklet+published+in+French+against+the+orthodox+doctrine+concerning+grace%2C+which+we+refuted+in+the+vernacular+language.+This+objection+presupposes+this+false+hypothesis%3A+that+the+Gospel+is+to+be+preached+by+us+to+no+one+unless+by+the+judgment+of+faith+we+are+certain+of+the+following+conversion+and+salvific+hearing.+To+the+contrary%2C+see+the+texts+just+cited%2C+and+Eze.+2%3B+Ex.+7.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Disputation+29%2C+%E2%80%98On+Regeneration%E2%80%99%2C+pt.+1%2C+%281639%29+tr.+AI+by+Roman+Prestarri+in+Select+Theological+Disputations+%281655%29%2C+vol.+2%2C+pp.+432-65+Latin+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F761fd0e3b7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/761fd0e3b7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-preparation-unto-salvation/#:~:text=IV.%20Problem%3A%20Whether%20in%20all%20or,cited%2C%20and%20Eze.%202%3B%20Ex.%207&amp;text=IV.%20Problem%3A%20Whether%20in%20all%20or%20in%20some&amp;text=texts%20just%20cited%2C%20and%20Eze.%202%3B%20Ex.%207" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

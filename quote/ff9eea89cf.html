<main class="wrap"><figure class="quote" id="q-ff9eea89cf" data-kw="">
<blockquote><p>See hence that they run a very dangerous risk who do injury to his subjects, or strip them of any of the rights, privileges, or immunities he has granted them, and purchased for them with the price of his blood. Among other privileges which Zion’s King hath allowed his subjects, this is none of the least, that they should have the choice of their pastors; for which cause he hath required them to try the spirits and gifts, ministers are endowed with, whether they be calculated for the edification of their souls, 1 John iv. 1.

It is a command not given unto heritors and elders only, but even to little children, young men and fathers; “Beloved (says he), believe not every spirit, but try the spirits,” viz., of ministers and preachers, “whether they are of God:” and the reason he gives is remarkable in the close of the verse, ” Because many false prophets are gone abroad into the world.”

And in a suitableness to this trying of the spirits of the prophets, we find, Acts vi. that it was “the multitude of disciples,” that by express order are commanded to choose out from among them “men full of the Holy Ghost and wisdom.” The apostles, the extraordinary officers in the church, and who, one would think, were the most competent judges of men full of the Holy Ghost and wisdom; yet they would not take that power upon them, which is now lodged in heritors and elders.

I fear, the partiality shown in our public acts, in preferring the great, the noble, the rich man with the gay clothing, before the poor of this world, whom generally God hath chosen, rich in faith, and heirs of the kingdom, lay a foundation for a controversy between God and this nation, which will not soon be at an end. Christ’s little ones are but little regarded now-a-days; but they who maltreat them, to gratify the greatest upon earth, will smart for it in the issue.

It is an awful word uttered by him upon whose shoulders the government is laid. Matt, xviii. 6, 7, “But whoso shall offend one of these little ones which believe in me, it were better for him that a mill-stone were hanged about his neck, and that he were drowned in the depth of the sea.” “Wo unto the world because of offences: for it must needs be that offences come: but wo to that man by whom the offence cometh.” …

These professed Presbyterians, who, under that disguise exercise a lordly prelacy and dominion over the church of Christ, in thrusting in men upon congregations without, and contrary to, the free choice their King has allowed them. I fear there shall be a sad reckoning ere all be done, for the violent rapes which are committed upon the spouse of Christ up and down the land. Christ mystical is wounded in the house of his professed friends: and it will be a wonder if there be not wounds for wounds, before the scene be ended.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Government upon Christ s Shoulder. A Sermon Preached on Sabbath Evening after the Sacrament at Stirling, June 4, 1732’ in The Whole Works of Ebenezer Erskine</cite></span></figcaption>

<blockquote><p>Neither can it be ground enough to plead for such decisions in preaching, that the thing they preach-for is truth, and the thing they condemn is error. Because:

1. It is not the lawfulness of the thing simply that is in question, but the necessity and expediency thereof in such a case: Now, many things are lawful that are not expedient, 1 Cor. 10:23.

2. In these differences that were in the primitive times concerning meats, days, genealogies, etc. there was a truth or an error upon one of the sides, as there is a right and a wrong in every contradiction of such a kind, yet the apostle thinks fitter, for the Church’s peace, that such be altogether refrained, rather than any way (at least in public) insisted upon or decided.

3. Because no minister can bring forth every truth at all times, he must then make choice; And I suppose some ministers may die, and all do so, who have not preached every truth, even which they knew, unto the people. Beside, there are (no question) many truths hid to the most learned. Neither can this be thought inconsistent with a minister’s fidelity, who is to reveal the whole counsel of God; because, that counsel is to be understood of things necessary to men’s salvation, and is not to be extended to all things whatsoever; for, we find the great apostle expounding this in that same sermon, Acts 20, verse 20, ‘I have keeped back nothing that was profitable unto you;’ which evidenceth that ‘the whole counsel of God,’ or the things which he showed unto them, is the whole, and all that was profitable for them, and that for no by-respect or fear whatsoever he shunned to reveal that unto them. [4.] Also, it is clear, that there are many truths which are not decided by any judicial act; and amongst other things, sparingness to decide truths that are not fundamental judicially has been ever thought no little mean[s] of the Church’s peace, as the contrary has been of division.</p></blockquote>

<blockquote><p>II. Moral actions of God, whose efficiency is metaphorical and are by way of object, by which He objectively moves and intelligibly instructs the elect (namely, adults or those using reason), by setting forth and offering the goods acquired, adjudicated, and assigned by Christ the Redeemer, and thus inviting to the acceptance of them, which happens through the contracting of the covenant. And such a moral action is of one single species, called Calling—calling, I say, to the contracting of the covenant of grace: so that I may distinguish it from the Calling which demands the performance of the law and summons all men to the obedience due to God from the right which He has over rational creatures. Which we also concede is directed to all the reprobate; but we deny that it can properly be called salvific, or a calling to salvation.

III. Real actions operating really or physically (as the more recent speak), and producing a real and inhering change in the subject, are those by which God makes the elect participants of real possession of goods and inhering gifts. And they are: Regeneration; Beatification in the state of grace; Beatification of the soul after this life; Resurrection to glory; Final glorification. Of these, the three latter pertain to the future life; the two former to the present life.</p></blockquote>

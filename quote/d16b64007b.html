<blockquote><p>The second way He presses it, verse 20, is, by a most instant and importunate pursuing of His offer, with a protestation of his being there, and of his making the same. This is done four ways;

1. By showing His work and posture, I stand at the door and knock. Hearts are naturally as castles shut and guarded by the Devil against Christ: When He comes with His ordinances, He does thereby, as it were, lay a siege at them, and by His word knock at the doors thereof to gain their consent; and the more pungently he presses by His ordinances, He is said to knock the more: And in this respect, Song 5:2, His voice is said to knock at the believer’s door in their sleepy condition. Here these two things are imported:

1. Christ’s continuing to deal with His Church, and to wait upon her in His ordinances, notwithstanding of her many former refusals. Thus, He is said to stand at the door: Whereby is holden forth their ingratitude to him, in keeping of Him out, and His patience that still waits on.

2. In this, by the other word, is imported His growing more instant in His dealing with them: Therefore He is said to knock. And indeed if the former sharp threatening and charge, and the sweet free offer be considered, it may well be said that now His knocks are doubled. 2. The second way He presses in this verse, is, by making His offer particular, as it were, bringing it to every man’s door, If any man hear My voice, and open the door, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, 3:20</span></figcaption>

-come-into-your-heart/#:~:text=The%20second%20way%20He%20presses%20it,voice%2C%20and%20open%20the%20door%2C%20etc&amp;text=The%20second%20way%20He%20presses%20it%2C%20verse%2020&amp;text=hear%20My%20voice%2C%20and%20open%20the%20door%2C%20etc" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…but as for that which no hypocrite or unsound professor can attain to, a broken, hungry, self-deined heart, that Christ and his grace might enter and dwell there, oh, how harsh is it?… what shall they look for that despise the grace of the Gospel, and that offer which God has honored by so many miracles, and such abundance of sermons, and the powerful ministry of so many preachers? Beware of refusing such salvation, as being a more spiritual wickedness than any moral offense. Thirdly, its reproof to all cavillers that descant upon this free, plain and simple-hearted offer of God. Being urged to receive it, they answer so they would if they knew themselves elected. But (say they) we are afraid God means it us not. If we be chosen, we are sure to be called to believe it: if not, none of their preachers can give it us. It must be God (say they) and not man that must work our hearts and draw us. But, oh vain jangler, tell me, has not God revealed his will in his offer? Dost thou know his secrets? Is not his offer ingenuous? Say not in thine heart, ‘Who shall go up to Heaven or descend, etc? Lo, the Word is in thy mouth, it is neare thee.’ (Dt. 29:19) If Jeremiah in the dungeon had told Ebedmelech [Jer. 38] he knew not whether he meant to help him out or no, and so have refused to come out, had he not justly been left there still? So, when the Lord lets down the ladder of his offer, into thy dungeon, casts thee his cords and rags to put under thy armholes, that He may draw thee out, dost thou cavil and say, ‘Lord, I know not whether thou meanst me well or no; perhaps Thou wilt pull me out a little way, and then let me fall back again; perhaps I am not elected!’ Is not this a woeful dishonor to the simplicity of the offer? Was he ever tied at all to offer it? and dost thou distrust his ingenuous meaning in it? Thy blood be upon thy own head, in that thou choosest rather to smite the Lord to thy own destruction than to set thy foot in his ladder and put on his cords, that thou mightst come out! The way for thee is first to step upward that thou mayst come to the top than to leap to the top at first, to break thy neck backward.</p></blockquote>

<blockquote><p>Now the Son of the ever blessed God tenders Himself to you with many entreaties, goes after you up and down, night and day, knocking at the door of your heart, with all his graces, comforts, and fruits of his death, by the ministry of his word, the motions of his Spirit, multitudes of temporal and spiritual mercies; but you, unworthy wretch, slights both Him and his precious attendants, and esteems your shop and stock, your corn and carnal comforts, far before Him…</p></blockquote>

<blockquote><p>3. You must open your hearts and give entertainment unto Christ, if you ever expect to have the gate of Heaven opened unto you, and to be entertained by Christ in his Kingdom. Such as shut the door of their hearts against Christ when they are young, will find (if Christ does not withdraw, and leave knocking) that the door will be faster bolted and barred within against Him; the longer you hold it out, the more will Satan strengthen the fort against Christ, and more easily beat off whatever assaults are made upon you by the Word and Spirit. Christ will come in most willingly to them that open to Him presently; and the match will quickly be made up, if in youth you hearken to the motion. Let me beseech you, therefore, my dearly beloved young ones, to open the door to Christ without any further delay; by me He stands now and knocks for entertainment; what answer shall I return, that you have harbored lusts there, where his lodging should be, and would not part with them? that you put me off till a further day, until you had a little longer tasted the sweets of sin: O take heed of such carriage of heart towards Christ, Qui non est hodie, cras minus aptus erit, if you be not willing to open to Christ now, you will be more unwilling tomorrow: do it then presently; may I be instrumental to join the Lord Jesus Christ and you together in marriage; receive Him into your hearts, and accept of Him, to love, honor, and obey Him, and do it heartily and resolvedly, and He is yours.</p></blockquote>

— Thomas Vincent, Words of Advice to Young Men delivered in Two Sermons… (London: Parkhurst, 1668), sermon 1, sect. 5, pp. 25-26">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+You+must+open+your+hearts+and+give+entertainment+unto+Christ%2C+if+you+ever+expect+to+have+the+gate+of+Heaven+opened+unto+you%2C+and+to+be+entertained+by+Christ+in+his+Kingdom.+Such+as+shut+the+door+of+their+hearts+against+Christ+when+they+are+young%2C+will+find+%28if+Christ+does+not+withdraw%2C+and+leave+knocking%29+that+the+door+will+be+faster+bolted+and+barred+within+against+Him%3B+the+longer+you+hold+it+out%2C+the+more+will+Satan+strengthen+the+fort+against+Christ%2C+and+more+easily+beat+off+whatever+assaults+are+made+upon+you+by+the+Word+and+Spirit.+Christ+will+come+in+most+willingly+to+them+that+open+to+Him+presently%3B+and+the+match+will+quickly+be+made+up%2C+if+in+youth+you+hearken+to+the+motion.+Let+me+beseech+you%2C+therefore%2C+my+dearly+beloved+young+ones%2C+to+open+the+door+to+Christ+without+any+further+delay%3B+by+me+He+stands+now+and+knocks+for+entertainment%3B+what+answer+shall+I+return%2C+that+you+have+harbored+lusts+there%2C+where+his+lodging+should+be%2C+and+would+not+part+with+them%3F+that+you+put+me+off+till+a+further+day%2C+until+you+had+a+little+longer+tasted+the+sweets+of+sin%3A+O+take+heed+of+such+carriage+of+heart+towards+Christ%2C+Qui+non+est+hodie%2C+cras+minus+aptus+erit%2C+if+you+be+not+willing+to+open+to+Christ+now%2C+you+will+be+more+unwilling+tomorrow%3A+do+it+then+presently%3B+may+I+be+instrumental+to+join+the+Lord+Jesus+Christ+and+you+together+in+marriage%3B+receive+Him+into+your+hearts%2C+and+accept+of+Him%2C+to+love%2C+honor%2C+and+obey+Him%2C+and+do+it+heartily+and+resolvedly%2C+and+He+is+yours.%E2%80%9D%0A%0A%E2%80%94+Thomas+Vincent%2C+Words+of+Advice+to+Young+Men+delivered+in+Two+Sermons%E2%80%A6+%28London%3A+Parkhurst%2C+1668%29%2C+sermon+1%2C+sect.+5%2C+pp.+25-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff0de67ec8a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f0de67ec8a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=3.%20You%20must%20open%20your%20hearts,and%20resolvedly%2C%20and%20He%20is%20yours&amp;text=3.%20You%20must%20open%20your%20hearts%20and%20give&amp;text=it%20heartily%20and%20resolvedly%2C%20and%20He%20is%20yours" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>And he ran before, and climbed up into a sycomore tree to see him: for he was to pass that way. And when Jesus came to the place, he looked up, and saw him, and said unto him, ‘Zacchaeus, make haste, and come down; for to day I must abide at thy house.’ And he made haste, and came down, and received Him joyfully. And when they saw it, they all murmured, saying, That he was gone to be guest with a man that is a sinner. And Zacchaeus stood, and said unto the Lord: Behold, Lord, the half of my goods I give to the poor; and if I have taken any thing from any man by false accusation, I restore him fourfold. And Jesus said unto him, ‘This day is salvation come to this house, forsomuch as he also is a son of Abraham. For the Son of man is come to seek and to save that which was lost.&#x27;</p></blockquote>

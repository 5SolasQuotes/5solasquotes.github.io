<main class="wrap"><figure class="quote" id="q-270ede2d5e" data-kw="">
<blockquote><p>The Westminster Assembly instructed the Houses of Parliament to see that Anabaptist and Antinomian errorists were restrained:

[…] (4) That all Ministers who teach or divulge, Baptizing of Infants to bee unlawful, The Morall law to be no rule for a Christian to walke by, That the Ministers of the Church of England are no true Ministers, &amp; their churches no true churches, That Seperation from them is necessary, &amp; churches to be gathered out of those churches, That power of Ordination belongeth to the people without officers, That fixed Assemblies &amp; a settled ministry in them are not necessary, That liberty is to bee given to all opinions &amp; sorts of Worship, &amp; That the Civill Magistrate hath noe power to restrain them, or any other points of Anabaptisme &amp; Antinomianisme, bee commanded to bring in the grounds &amp; reasons of their opinions in a brief &amp; compendious manner in writing under their hands unto the Assembly, or such as the Honourable Houses of Parliament shall appoint to be examined according to the Word of God: &amp; in the mean time be commanded to forbear all teaching, printing, or other wise divulging of them. […]

Henry Robrough Scriba.

Adoniram Byfield scriba</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/the-westminster-divines.html">The Westminster divines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The humble Advise of the Assembly of divines, for preventing the mischiefes that will arise from, &amp; follow upon the divulging the dangerous opinions of Antinomianisme &amp; Anabaptisme, 5 Sep. 1644 in The minutes and papers of the Westminster Assembly 1643-1652</cite>, ed. Chad VanDixhoorn (5 vols, Oxford: Oxford University Press, 2012), v, 87-8.</span></figcaption>

<blockquote><p>The earliest known example of a Catechetical work is the “Teaching of the Twelve Apostles,” which Athanasius names among the “books not included in the Canon, but appointed by the Fathers to be read by those who are just recently coming to us, and wish to be instructed in the word of godliness (κατηχεῖσθαι τὸν τῆς εὐσεβείας λόγον).” This use of the Didache for the instruction of recent converts from Paganism agrees with its original purpose as stated in the longer title, “Teaching of the Lord through the Twelve Apostles for the Gentiles.” The first six chapters are evidently adapted for those who need elementary instruction, more particularly for Catechumens of Gentile descent, as distinct from Jewish candidates for Baptisms. The remaining chapters of the Didaché relate chiefly to the administration of Baptism, to Prayer, Fasting, and the services of the Lord’s Day, and to the celebration of the Agape and Eucharist. This same division of subjects is observed in the two classes of S. Cyril’s Catechetical Lectures: the first class, including the Procatechesis, consists of XIX Lectures addressed to candidates for Baptism, and these are followed by five “Mystagogic” Lectures, so called as being explanations of the Sacramental Mysteries to the newly-baptized.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-hamilton-gifford.html">Edward Hamilton Gifford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Catechetical Lectures of S. Cyril</cite>, ed. Philip Schaff and Henry Wace, vol. 7, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, Second Series (New York: Christian Literature Company, 1894), xii.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

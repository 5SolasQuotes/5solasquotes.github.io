<main class="wrap"><figure class="quote" id="q-563564bba0" data-kw="">
<blockquote><p>ALTHOUGH I am persuaded that nothing hath a greater Tendency to strengthen the Hands of Infidels, than the too frequent Altercations between the Professors of Christianity; yet there are certain Occasions wherein the necessary Defence of the Principles of our holy Religion, as well as the Practice of it, renders public Remonstrances of the greatest Use and Importance. The sacred Pages afford us many Examples of this Nature.

When Aaron was prevailed on by the Israelites to make a golden Calf, and offer Sacrifice to it, what a holy Indignation did Moses express both against him and them! — When Peter and Barnabas were carried away with the Dissimulation of the Jews, how openly did the Apostle Paul withstand them to the Face and reprove them before all, because they were to be blamed! and when this same Apostle saw the Churches of Corinth and Galatia in Danger of being drawn away from the Simplicity of the Gospel, what a fervent Testimony did he bear against the Authors and Abetters of such a destructive Scheme.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-whitefield.html">George Whitefield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An expostulatory letter addressed to Nicholas Lewis, Count Zinzendorff, and lord advocate of the Unitas Fratrum</cite>, (3rd edn, Philadelphia: William Bradford, 1753), pp 3-4.</span></figcaption>

<blockquote><p>Q. What is summarily required in this [Fourth] Commandment?

A. The setting apart of a special day, every week, wherein we are to separate our selves from our worldly businesses, and ordinary callings concerning this life, that we may wholly attend to the service and worship of God alone.

Q. What need is there of one whole day in a week, to serve God in, seeing we may serve him every day?

A. To the end, that we should not plunge our selves so deeply into the affairs of the world, as that we should not recover our selves; the wisdom of God hath thought it good, that one day in seven, there should be an intermission from them; that we might wholly separate our selves to the service of God, and with the more freedom of spirit perform the same.

Secondly, for that a whole day is needful, for the performance of all the parts of God’s worship; as hearing of public Prayer, and the Word preached, Catechizing, administration of the Sacraments, exercise of holy Discipline, &amp; consideration of the glory of God in the creatures. Thirdly, If Adam in his perfection had need of this help, much more have we, who are so grievously corrupted.

Q. Is there any one special day of the week, set apart by God himself?

A. Yea.

Q. What day is that?

A. The first day in the week, called the Lord’s day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or, the whole body and substance of divinity</cite>, (2nd edn, London: Thomas Man, 1616), pp 108-09.</span></figcaption>

<blockquote><p>This thesis is an examination of the eucharistic doctrine of ten Scottish theological writers in the tradition of Scottish Episcopacy… The argument of this thesis is that all of the writers, rejecting the Tridentine, Lutheran, Bezan-Calvinist, and Zwinglian definitions of the Eucharist, maintained a material sacrifice in the Eucharist, which is an offering to God the Father of bread and wine as the propitiatory memorial of Christ’s death on the Cross, commanded by Christ Himself at the Last Supper. The sacrifice is propitiatory because it is the means of representing the one sacrifice of Christ on the cross to God the Father, thereby pleading the benefits of the cross for the communicants. The bread and wine do not change substance, but become effectively the body and blood of Christ.</p></blockquote>

<blockquote><p>Some make a mockery of the holy things of God. One part of the year they will be holy; a rotten, foolish affection of people that are popish. In Lent they will use a little austerity, oh! they will please God wondrously! but before and after they are devils incarnate. So they make that part of the year as a good parenthesis, in an unlearned and unwitty speech. A good parenthesis is unseemly in a wicked speech, and a good piece is unseemly in a ragged garment; so their lives that make a good show then (and there are few that do so, they are scarce among us; men are such atheists that there is not outward reformation, but if there be), if they give themselves leave to be civil, and to respect holy things a little time, afterward they return to their looseness again. Doth this patching out of a holy life please God? No, no! ‘I have sworn, and I will perform it, that I will keep thy righteous statutes,’ saith David, Ps. 119:106. And St Paul, ‘I have resolved to be so to the end;’ I will be myself still. So where grace is, there is a resolution against all sin for the time to come. If you entertain not this resolution, to walk ‘in holiness and righteousness all the days of your life,’ Luke 1:75, acknowledge no benefit by Christ’s redemption, and come not near the holy things of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Complete Works of Richard Sibbes</cite>, vol. 3 (Edinburgh; London; Dublin: James Nichol; James Nisbet and Co.; W. Robertson, 1862), 313.</span></figcaption>

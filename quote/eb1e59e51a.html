<main class="wrap"><figure class="quote" id="q-eb1e59e51a" data-kw="">
<blockquote><p>What does the success of this false Plymouthistic and Arminian teaching amount to? There is first, a false faith, a mere belief of a supposed fact. Then there is a false conception of the atonement, a conception which robs Christ’s death of all its unfailing efficacy as an actual saving atonement for every one for whom it was offered, and so takes away the glory of its saving power, and places that glory on the head of man’s faith, – the “Evangelistic” doctrine in effect being that Christ could not make His atonement saving, but that the sinner while simply a sinner does make it saving by a faith which is wholly in his own power. Then, as the result of this false faith in a false doctrine, there is so-called peace, and there is “assurance” never to be disturbed in this world, unless God in the Sovereignty of His grace, which they despise, reveal to the self-righteous “converts” the grossness of their self-deception and presumption.

It is true that the doctrines of grace, being profoundly humbling doctrines, will cause many sinners to go away. So sinners went away from the Saviour Himself, when He taught them the doctrines of His gospel. But He never thought on that account of modifying His doctrines to conciliate gain-sayers or to meet their self-righteousness tastes. He never softened down a single hard saying so as to keep objectors from going away. If He had adopted another course, and appealed to the self-complacency of sinners He might have made many more converts of a kind. But He wished not false conversions or mere apparent and showy successes, and so He declared the whole counsel of God.

His apostles and prophets followed a similar course. They preached the preaching that He bade them, and left all results to Him. Those who wish to follow the course of a true evangelism must fearlessly and faithfully deliver Christ’s message. They must have sufficient faith in the wisdom of their Lord and Master, to believe that His truth, without any modification or any flattering concession to the carnal mind, is the great need of the world. And they must have sufficient spiritual perception to understand that one genuine convert made by the truth and Spirit of God is better than a million spurious converts made by the preaching of error. God’s truth, they may be sure, will be successful in accomplishing all His purposes; and error, they may be equally sure, however plausible the reason may be for its use, will prove a disastrous and eternal failure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Evangelism: With Criticism of some Prevalent Errors</cite>, (Belfast, 1898), pp 13-14.</span></figcaption>

<blockquote><p>But what can be the reason, may some man say, why the Scripture has not itself determined these kinds of assemblies [synods, general assemblies, etc.] particularly? I answer, three reasons may begiven for it:

1. Because it was not necessary, the general rules of the word, together with nature’s light, which directeth commonwealths in things of the same kind, being sufficient to direct the church therein.

2. As seasons and times for the meeting of assemblies , so the just bounds thereof in so many different places of the world are things of that kind which were not determinable in Scripture, unless the world had been filled with volumes thereof; for, individua sunt infinita.

3. Because this constitution of synods, provincial and national, is not universal for all times and places; for example, there may bein a remote island ten or twelve Christian congregations, which, beside their particular elderships, have a common presbytery, but are not capable of synods, either provincial or national. Again, let there be an island containing forty or fifty Christian congregations, there shall be therein, beside presbyteries, one kind of a synod, but not two kinds. Besides, the reformed congregations within a great nation may haply [by chance] be either so few, or so dispersed and distant, or so persecuted, that they can neither have provincial nor national assemblies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, (1641), p. 53</span></figcaption>

<blockquote><p>4th Distinction. There is a call to an habitual and ordinary prophesying; here is required not only a calling by gifts, but also a collation of authority to the office, either immediately by God, or mediately by the Church, and there is a call to some particular or occasional acts of exhorting, as the martyrs and Stephen [Acts 7] are called to give confession of their faith, and a king in battle, to exhort his army, or a prince his subjects to piety, and to this latter there is no other call required but the place and profession of the exhorter, though he bee not by office a pastor. … 6th Distinction. Gifted Christians may occasionally admonish, warn, rebuke and exhort one another: 1. privately; 2. without any pastoral care of souls as they are a Church, but only as they occasionally converse with them; 3. ex communi officio charitatis [out of the common office and charity], by the Law of nature, charity tying one member to help another;

4. Not authoritatively by special office; but all authority here is from the Word occasionally spoken. The pastor is to preach, 1. publicly; 2. to the Church as the Church. 3. with a pastoral obligation to all alike, whether he converse daily with them or not. 4. not only by the tie of common charity, but by a virtue of a special office.

5. With authority both objective from the Word and official from his charge. 6. and is obliged to separate himself for this charge allanerly [singly, especially or wholly], as a watchman who must give an account in a special manner to Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 2, p. 272</span></figcaption>

<blockquote><p>Mr. Hooker [a congregationalist]: ”The Apostles’ (says Mr. Rutherford) ‘stand in the room of the whole catholic ministerial guides when they revealed the keys.’ [Hooker’s] Answer [to Rutherford]: The apostles in that commission were extraordinary persons sent to all the world to lay the foundation of the Gospel, by an apostolic power; and in this sense they have no successors, nor stand in the room of any.’ [Rutherford’s] Answer: [1.] If the apostles represent none in this sense, Mt. 28:19; Mk. 16:15; Jn. 20:21, ‘Go and teach, etc.’, ‘Whose sins ye remit, etc.’, then none succeed the apostles to teach, baptize, remit and retain sins; pastors then must do these without a commission from Christ, or these ordinances must cease. 2. Mt. 28; Jn. 20, He sends the apostles and says, ‘Behold, I am with you to the end of the world,’ in preaching and baptizing. The apostles, Mt. 28:19-20; Jn. 20:21-22, when they received power to preach and baptize, did represent all ordinary teachers to the end of the world, or then ordinary teachers want [lack] all calling. But the apostles do not live to preach and baptize to the end of the world; therefore that ministerial presence of Christ must be promised to some represented by the apostles. So the English Divines, Calvin, Beza, Diodati [held], as apostles gifted with power of working miracles, etc., they represented none, nor had they any successors. So [in] Mt. 28, the pastors have the power of the keys and of office given them…</p></blockquote>

<blockquote><p>Our Saviour sat one day by the well. He talked with a sinful woman, and laid His finger upon the sore spot in her life. “Thou hast had five husbands,” He said; “and he whom thou now hast is not thy husband.” The woman then apparently sought to evade the consideration of the sin in her own life by asking a theological question regarding the right place in which to worship God. What did Jesus do with her theological question? Did He brush it aside after the manner of modern religious workers? Did He say to the woman: “You are evading the real question; do not trouble yourself about theological matters, but let us return to the consideration of the sin in your life.”

Not at all. He answered that theological question with the utmost fulness as though the salvation of the woman’s soul depended on her obtaining the right answer. In reply to that sinful woman, and to what modern religious workers would have regarded as an evasive question, Jesus engaged in some of the profoundest theological teaching in the whole New Testament. A right view of God, according to Jesus, is not something that comes merely after salvation, but it is something important for salvation.</p></blockquote>

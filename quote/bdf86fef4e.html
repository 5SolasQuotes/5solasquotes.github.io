<main class="wrap"><figure class="quote" id="q-bdf86fef4e" data-kw="">
<blockquote><p>1… And the first word ‘vocation’ is taken often for God’s act of calling when it has no success, and this is called uneffectual calling. So it is used, Prov. 1:24, ‘Because I called and ye refused, I have stretched forth my hands and no man regarded; But ye have set at nought all my counsel, and would none of my reproof.’ So Isa. 65:12; Jer. 7:13, ‘I called, but ye answered not,’ and many other places: Sometimes it is taken for the act of God when it is successful; as 1 Thess. 2:12 and many more places: 2. This success itself is termed our calling in a passive sense: and it is twofold: 1. Common; when men are brought but to outward profession and common gifts; and so the word is used often. 2. Special; when men are savingly converted to Christ; The former is common effectual calling; the latter is special effectual calling: and this last is the same with conversion:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Conversion</cite>, … (London: R.W., 1657), ch. 1, sect. 3, pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span><span class="t"><a href="../topics/effectual-calling/external-and-internal-call.html">External and Internal Call</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ba7f845a30" data-kw="">
<blockquote><p>Eighthly, [it is superstition] that the people do not only choose the persons who shall be their pastors, but also give them their office or power. Ninthly, that the people have the power of the keys, or of Church-government, by vote. Tenthly, that the people of a particular church, do give authority to men to be ministers in the universal Church, and to preach and baptize among those that are without [the Church].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 58, p. 290</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-090b207887" data-kw="">
<blockquote><p>XXV. As every escape, error, or act of unfaithfulness (even known and continued in) whether in a minister’s entry to the ministry, or in his doctrine or deportment, does not non-minister him, nor give sufficient ground to withdraw from, or reject him as a minister of Christ: So neither does every enormity, mis-demeanure or act of tyranny, injustice, perfidy or profanity etc. in the civil magistrate, whether as to his way of entry to that office or in the execution of it, or in his private and personal behavior, denominate him a tyrant or an usurper, or give sufficient ground to divest him of his magistratical power, and reject him as the lawful magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Banders Disbanded</cite>, (1681), p. 47 McWard was a protege of Rutherford and leader of the Scottish covenanters.</span></figcaption>

</figure><figure class="quote" id="q-7ac968f88a" data-kw="">
<blockquote><p>But beside, suppose there were some petty defects or irregularities in their entry to the exercise of their ministry… yet ye should know it is not every lighter fault of that nature which will warrant Separation; but only such attrocious crimes as either destroys the essence of the ministry and makes it null and void (as your Reverend Mr. [Robert] Brown teaches in the Preface to his Book against Wolrogen, and excellent Mr. [Oliver] Bowels in his Pastor Evangelicus, bk. 1, ch. 4), for recte fieri is one thing, and ratum esse is another, and multa impediunt matrimonium contrahendum, quae non dirimunt contractum; or else does so vitiate their ministry as people cannot join therewith in its ministerial acts without real and native participating in the sin, in God’s account and in the construction of his holy Law: Otherwise if there be any pollution adherent to their ministry, which neither evacuates the essence thereof, nor so intrinsically leprosies it, but ye may communicate in its acts abstractly from and without touching the spot; the sin rests on the men themselves, and ye are not concerned therein farther than to lament it, but not to be scared and debarred by it from joining in their ministerial administrations, they being to you clean, whatever they be to the men themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland</cite>, (1674; London: Cockerill, 1681), p. 176</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-f423a7e4c7" data-kw="">
<blockquote><p>7. A calling to the ministry is either such as wants the essentials, as gifts in any messenger, and the Churches’ consent, or these who occupy the room of the Church, the Church consenting, such a minister is to be reputed for no minister. Or. 2. An entry to a calling, or a calling, where diverse of the apostles’ requisites are wanting, may be a valid calling, as if one enter as Caiphas who entered by favor and money, and contrary to the Law was High-Priest but for a year: yet was a true High-Priest, and prophesied as the High-Priest. 8. If the Church approve by silence, or countenance the ministry of a man who opened the Church door to himself, by a silver key, having given the prelate a bud, the ordinance of God is conferred upon him and his calling ceases not to be God’s calling because of the sins of the instruments both taking and giving.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 165 | pt. 2, p. 228</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

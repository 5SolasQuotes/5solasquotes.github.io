<blockquote><p>XIV. Although the philosopher may be allowed to begin with a doubt in order to a safer investigation of natural things, yet this cannot be introduced into subjected of theology and faith. They are founded upon certain and indubitable principles and truths known per se, to doubt concerning which is impious (as concerning the existence of God) unless we wish to strip ourselves of conscience and the moral dependence on the Creator (which cannot be shaken off or for a moment rejected without crime) and thus to introduce philosophical doubt (epochen) into religion and render the whole of theology sceptical.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes (P&amp;R), vol. 1, 1st Topic, Q. 13, ‘Is there any use of Philosophy in Theology? We Affirm’, section 14</cite>, pp. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2c44db3fe2" data-kw="">
<blockquote><p>And this distinction [between actuality and potentiality] is metaphysical, not scientific (in the modern sense of “scientific’”). That is to say, it is a description of reality that is more general and basic than any scientific theory, resting as it does on facts (about change) that science itself takes for granted. Hence it is valid whatever the empirical scientific facts turn out to be; and (to repeat what was said earlier) while that doesn’t mean that it cannot be subjected to rational evaluation or criticism, such criticism can only come from some alternative metaphysical theory, not from empirical science… Aristotelian metaphysical ideas are, as I keep saying and as will be established by the end of the next chapter, unavoidable, whether the early modern philosophers thought so or not… the distinction I am making, between metaphysical ideas and scientific ones, is just an obvious one to make. As noted before, empirical science must take many things for granted, such as the existence of patterns of cause and effect. Thus, while it might be able to establish whether some particular causal relationship exists, it cannot possibly establish whether causation as such is real or not, given that its method presupposes its existence. Nor, at the most general level and for the same reasons, can it tell us what causation per se is or what kinds of causation exist. And so on for notions like actuality, potentiality, substance, attribute, form, and so on. Empirical science of its very nature cannot give us the full story about these matters; but metaphysics just is the rational investigation of them. Hence metaphysics is obviously different from empirical science.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Last Superstition: A Refutation of the New Atheism (St. Augustine’s Press, 2008), ch. 5</cite>, pp. 172-73</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-44c5e69a32" data-kw="">
<blockquote><p>Thesis VIII: In the meantime, we do not agree with Nominalists who think that universals are purely nominal. For not only do we admit that things exist before the operation of the mind, which are called universals, as they also concede, but we also admit that there is in things the foundation of universality without the operation of the mind, namely, that exact similarity of many individuals of the same species in formal unity, which they do not concede. In this, we also differ from Scotus, who wants that exact similarity of many individuals in formal unity to be true unity, and thus, universal unity itself. However, we assert that, as singular individuals are per se one thing, and this not only by numerical unity but also by formal unity, we genuinely deny that the natures of many individuals without the operation of the mind are one nature. We acknowledge some similarity and agreement but not unity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/franco-burgersdijk.html">Franco Burgersdijk</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutionum Metaphysicarum, ch. 13, “On Universal Unity” tr. T.J. Floyd</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-77bbf58820" data-kw="">
<blockquote><p>As domestic society is by nature’s instinct, so is civil society natural, in radice, ‘in the root’, and voluntary, in modo, ‘in the manner’ of coalescing. Politic power of government agrees not to man, singly, as one man, except in that root of reasonable nature; but supposing that men be combined in societies, or that one family cannot contain a society, it is natural that they join in a civil society, though the manner of union in a politic body, as Bodine says, be voluntary, Gen. 10:10; 15:7 and Suarez says (tome 1, On Laws, bk. 3, ch. 3), That a power of making laws is given by God as a property flowing from nature, Qui dat formam, dat consequentia ad formam, Not by any special action or grant different from creation; nor will he have it to result from nature while men be united into one politic body: which union being made, that power follows without any new action of the will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex… (London: Field, 1644), Question 2, ‘Whether or not government be warranted by the Law of nature’</cite>, p. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

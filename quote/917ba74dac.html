<main class="wrap"><figure class="quote" id="q-917ba74dac" data-kw="">
<blockquote><p>The reasons why secret prayer is the mark of a sincere heart are as follows: A sincere heart busies itself about heart work to mortify sin, to quicken grace, to observe and resist temptation, to secure and advance his evidences; therefore, it is much conversant with secret prayer. … The more a saint converses with his own heart, the more he searches his spirit. He labours to walk before God, as being always in His sight, but especially when he presents himself at the footstool of mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-lee.html">Samuel Lee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Secret Prayer Successfully Managed</cite>, (1676) in Don Kistler (ed.), The Puritans on Prayer (Morgan PA: Soli Deo Gloria, 1995), p. 247.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

<blockquote><p>II. Should saints and angels be invoked? No.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Practical Theological Disputation on Sin, pt. 2’</cite>, tr. Onku with AI (Leiden: Johann Elsevir, 1660), Corollaries Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer/nature-and-necessity-of-prayer.html">Nature and Necessity of Prayer</a></span></div>
<div class="actions"><button class="copy" data-copy="“II. Should saints and angels be invoked? No.”

— Johannes Hoornbeeck, ‘A Practical Theological Disputation on Sin, pt. 2’, tr. Onku with AI (Leiden: Johann Elsevir, 1660), Corollaries Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CII.+Should+saints+and+angels+be+invoked%3F+No.%E2%80%9D%0A%0A%E2%80%94+Johannes+Hoornbeeck%2C+%E2%80%98A+Practical+Theological+Disputation+on+Sin%2C+pt.+2%E2%80%99%2C+tr.+Onku+with+AI+%28Leiden%3A+Johann+Elsevir%2C+1660%29%2C+Corollaries+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcb0ae0c511.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cb0ae0c511.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/prayer#:~:text=II.%20Should%20saints%20and%20angels%20be%20invoked%3F%20No" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e5e2944920" data-kw="">
<blockquote><p>Prayer is a natural worship, and is incumbent upon all men, as they are created by God. Prayer is a duty which the very law of nature, as well as the law of the word, lays upon men. And this you may see in those pagans, Jonah i. 5, ‘The mariners cried every man to his god.’ That there is a God, and that this God is to be called upon, are lessons that are taught in nature’s school: Isa. xlv. 20, ‘They pray to a god that cannot save.’

For any man to say a wicked man ought not to pray, is to say a wicked man ought not to worship God, nor acknowledge him to be his maker; and who but such who are either blind or mad dare speak such language? Certainly they that live in the neglect of prayer under the gospel sin against a double light, the light of nature and the light of the gospel, and therefore they shall be double-damned. There is no hell to these men’s hell who sin against a double light, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crown and Glory of Christianity; or Holiness, the only way to Happiness. Discovered in LVIII Sermons from Heb. 12. 14</cite>, (1662) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 4: 234.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

formed Covenanter</a></div>
</figure><figure class="quote" id="q-c2c21cce4c" data-kw="">
<blockquote><p>Faith is the key that opens the treasure chests of our God; prayer is the hand by which we grasp the treasures and are made rich. Prayer lifts our hearts from earth to heaven. It refreshes our memories of God’s promises in order to strengthen us. It brings assurance and safety against anything that causes us to fear. By it we receive from his hand all that we desire. Prayer supplies rest and peace for our souls. It maintains and strengthens reverence for the Lord. It increases the desire to turn to him who is the fountain and fullness of all things.

Prayer teaches us to forsake the world and to crucify our flesh. In prayer we see our heavenly and everlasting benefits for whose enjoyment we sigh. Nothing is more desirable as having fellowship with him apart from whom we cannot be blessed. Would you keep company with God, then you must either pray or read, for when we pray, we are speaking with God, and when we read, God is speaking to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-taffin.html">Jean Taffin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marks of God’s Children</cite>, trans. Peter Y. De Jong, ed. James A. De Jong (1588; Grand Rapids MI: Reformation Heritage Books, 2003), p. 139.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

</figure><figure class="quote" id="q-38a909b283" data-kw="kingdom come">
<blockquote><p>The second petition is: that God&#x27;s Kingdom come [Matt. 6:10]. Even though it contains nothing new, it is with good reason kept separate from the first petition; for if we consider our languor in the greatest matters of all, it behooves us to extend our discussion in order to drive home something that ought to have been thoroughly known of itself. … God reigns where men, both by denial of themselves and by contempt of the world and of earthly life, pledge themselves to his righteousness in order to aspire to a heavenly life. Thus there are two parts to this Kingdom: first, that God by the power of his Spirit correct all the desires of the flesh which by squadrons war against him; second, that he shape all our thoughts in obedience to his rule.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.20.42</span></figcaption>

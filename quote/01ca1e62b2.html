<blockquote><p>Autopistia offers a historical survey and a theological evaluation of the self-convincing character of Scripture in Reformed theology. Calvin adopted the term autopistos from ancient Greek philosophy and used it to express that faith does not rest on the human authority of the church but on Scripture as the living voice of God. After discussing the meaning of the term in Reformed Orthodoxy and analyzing the theological position of Benjamin B. Warfield and Herman Bavinck on this issue… Van den Belt draws his theological conclusions in this study, advocating a revitalization of the autopistia of Scripture…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hendrik-van-den-belt.html">Hendrik van den Belt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Autopistia: the Self-Convincing Authority of Scripture in Reformed Theology PhD diss. (Leiden Univ., 2006) 345</cite>, pp. ToC</span></figcaption>

</figure><figure class="quote" id="q-33a7000fe4" data-kw="">
<blockquote><p>In the order of eminence he [Scotus] shows that 1) some eminent nature is simply first in perfection; 2) a supreme nature is uncausable; 3) a supreme nature actually exists. Next Scotus shows that this triple primacy, namely of efficiency, finality, and eminence, belongs to the same quiddity or nature. Having proved these relative properties of the first being, he proceeds further to prove the infinity of the first being. Having proved infinity, he demonstrates that God is unique in nature, using six (or seven) arguments…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alan-b-wolter.html">Alan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958)</cite>, p. 86</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

— Alan B. Wolter, Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958), p. 86">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+the+order+of+eminence+he+%5BScotus%5D+shows+that+1%29+some+eminent+nature+is+simply+first+in+perfection%3B+2%29+a+supreme+nature+is+uncausable%3B+3%29+a+supreme+nature+actually+exists.+Next+Scotus+shows+that+this+triple+primacy%2C+namely+of+efficiency%2C+finality%2C+and+eminence%2C+belongs+to+the+same+quiddity+or+nature.+Having+proved+these+relative+properties+of+the+first+being%2C+he+proceeds+further+to+prove+the+infinity+of+the+first+being.+Having+proved+infinity%2C+he+demonstrates+that+God+is+unique+in+nature%2C+using+six+%28or+seven%29+arguments%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Alan+B.+Wolter%2C+Little+Summary+of+Metaphysics+%28Milwaukee%3A+Bruce+Publishing+Co.%2C+1958%29%2C+p.+86&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F33a7000fe4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/33a7000fe4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-particular-metaphysical-issues/#:~:text=In%20the%20order%20of%20eminence%20he,nature%2C%20using%20six%20%28or%20seven%29%20arguments&amp;text=In%20the%20order%20of%20eminence%20he%20%5BScotus%5D%20shows&amp;text=unique%20in%20nature%2C%20using%20six%20%28or%20seven%29%20arguments" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-badf2ca8b8" data-kw="">
<blockquote><p>Spiritual substance is distinguished from matter by the characteristic of self-motion, or motion ab intra [from inside]. Matter must be moved from without, by another material substance impinging upon it. But mind moves from within. Its motion is not from external impact, but is self-motion. Adam was created a spirit. The instant, therefore, that he was created, he had all the characteristics that distinguish spirit from matter. One of these, and one of the most important, is self-motion. But self-motion is self-determination, and self-determination is inclination. The Scripture asserts that Adam was created a ‘living soul.’ Life implies motion; and the motion in this case was not mechanical or material, but the motion of mind. Thus in creating a rational spirit, God creates a self-moving essence, and this is a self-determining will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dogmatic Theology (NY: Charles Scribner’s Sons, 1888), vol. 2, ch. 2, ‘Man’s Primitive State’</cite>, p. 100</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

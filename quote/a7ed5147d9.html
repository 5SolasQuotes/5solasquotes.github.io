<main class="wrap"><figure class="quote" id="q-a7ed5147d9" data-kw="">
<blockquote><p>While our hearts are warmed with prosperity, we think many times small sins can do no great harm; but herein we do wofully deceive ourselves. For besides that the least sin hath the nature of sin in it, as the least drop of poison is poison; and that in smaller sins there is the greater contempt of God, inasmuch as we stand out with God for a trifle, (as we count it,) and venture his displeasure for a little sensual satisfaction.

I say, besides these and many other considerations, which may render our small sins great provocations, this is one unspeakable mischief, that small sins intercept our communion with God, as much as great sins, and sometimes more. For whereas great sins by making deep wounds upon conscience, make the soul go bleeding to the throne of grace, and there to mourn and lament, and never to give God rest, till he gives rest to the soul, and by a fresh sprinkling of the blood of Christ, to recover peace and communion with God.

Smaller sins not impressing such horror upon the conscience, are swallowed in silence with less regret, and so do insensibly alienate and estrange the heart from Jesus Christ. The least hair casts its shadow; a barley-corn laid upon the sight of the eye will keep out the light of the sun, as well as a mountain. The eye of the soul must be kept very clear that will see God: “Blessed are the pure in heart, for they shall see God,” Matt. v. 8. Little sins, though they do not disturb reason so much as great sins, yet they defile conscience, and the conscience under defilement (unlamented) is shy of God, and God shy of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-case.html">Thomas Case</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Correction, Instruction; or A Treatise of Afflictions</cite>, (1671; London: Religious Tract Society, 1836), pp 38-39.</span></figcaption>

<blockquote><p>2. The second precept is a rule of our whole worship of God, that we worship not God with any kind of worship besides that wherewith he commanded Himself to be worshipped: wherefore it commands the true and forbids all the fained and false worship of God, especially idols and images made to represent and worship God: also negligence of magistrates, whereby images or other instruments, which either do or may easily serve to idolatry, are tolerated in places subject to their authority, much more the worship of them; also hypocricy and prophaness.</p></blockquote>

<blockquote><p>It has become almost an adage, that the Church has developed her theology mainly through conflict with error. This must be so from the nature of the case. Attention is not apt to be specially directed to what is undisputed, and our clearest judgments are derived from comparison. The contrast of truth and error, induced by the assertion of the latter, enhances our comprehension of both. The doctrine of the covenants constitutes no exception to this law.

It was not brought distinctly under investigation and formally developed until the period succeeding the Reformation. Luther grandly elucidated the cardinal doctrine of justification by faith alone. Justification he saw clearly. Imputation he perceived less distinctly; and he stopped short of the controlling principle of federal representation. Even Calvin, magnificently endowed as he was by his abilities and learning for a systematic treatment of revealed truth, although he produced a theological work distinguished for its comprehensive grasp of the doctrines of religion in their relation to each other, did not seem to have had his mind definitely turned to the federal scheme.

It was when Placæus [Joshua De La Place] broached his theory of the mediate imputation of Adam’s sin, that the attention of the Reformed Church was thoroughly aroused to the importance and scope of the federal theology. The theologians of the Dutch School, in their massive works, subjected it to a full, if not an exhaustive, consideration; and their example was followed by some of the most illustrious divines of England and Scotland.

And while Cunningham, Hodge, and our own Thornwell have trodden in their footsteps, and evinced in their discussions their sense of the importance of the federal system—a fact for which the present generation of Calvinists should be devoutly thankful—it is to be feared that indications are beginning to manifest themselves of a growing tendency towards a departure from this type of theology. Especially would it be for a lamentation should it disappear from the pulpit—the grand organ by which divine truth is brought into contact with the masses.

And as surely as the pulpit drifts away from it, will it more and more cast its instructions in the mould of a wretched legalism; or, losing the influence of this pervading genius of theological truth, and so lapsing from any thoroughgoing inculcation of doctrine, it will more and more neglect its heavenly call to be an instructor of Christ’s people, and sink its high didactic office into that of a vapid and sensational haranguer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Federal Theology: Its Import and its Regulative Influence in Memorial Volume of the Semi-Centennial of the Theological Seminary at Columbia, South Carolina</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-e854102423" data-kw="">
<blockquote><p>Thankfulness for grace received is one of the principal duties that is incumbent on believers in this world. Now, how can a man in faith bless God for that which he is utterly uncertain whether he have received it from him or no? I know some men run on in a rote in this matter. They will bless God in a formal way for regeneration, sanctification, justification, and the like; but if you ask them whether themselves are regenerate or no, they will be ready to scoff at it, or at least to profess that they know no such thing. What is this but to mock God, and in a presumptuous manner to take his name in vain? But if we will praise God as we ought for his grace, as we are guided and directed in the Scripture, as the nature of the matter requires, with such a frame of heart as may influence our whole obedience, surely it cannot but be our duty to know the grace that we have received.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 6 (Edinburgh: T&amp;T Clark, n.d.), 592.</span></figcaption>

<blockquote><p>5. He that mistakingly thinks any thing is good or bad, duty or sin, which is not so, will be zealous in pursuit of his mistake, if he be serious for God: A good principle will hasten him on in a wrong way, whatever it cost him.

6. Ignorance and timerousness cause superstition, which is a conceit that God is [thought to be] pleased by overdoing in external things, and observances and laws of their own making, and so they that make part of their own religion superstitiously (as most good people do in some things through ignorance) will censure all others as good or bad, by the measure of their own mistakes.

7. He that thus mistakingly thinks that men sin when they do not, will have a proportionable dislike of them and aversation from them: And will be ready to speak as he thinks of them and so will be guilty of calumny and calling evil good, and good evil. …

18. And the Church will always have many hypocrites, who quiet their consciences by adhering to the strictest ministers and churches, instead of a mortified, holy and heavenly heart and conversation [conduct].

19. And lastly, persecution and hatred from others, and the due love of godly persons, tempts too many ministers to over-run their own judgments and follow the more censorious sort of persons further than they ought (at least by connivence) and to be ruled by those whom they should rule. And thus divisions are occasioned even by piety itself.</p></blockquote>

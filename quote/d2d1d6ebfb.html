<main class="wrap"><figure class="quote" id="q-d2d1d6ebfb" data-kw="">
<blockquote><p>Upon the first day of the week, everyone lays by in store, as God prospers him, giving it into a broad [collection plate] at the church door, for the relief of the poor, as 1 Cor. 16:2. It is provided that ministers have competent stipends, as 1 Cor. 9:13, and that hospitals be upholden, Matt 25:35,36; Eccl. 11:1,2, and that the fabric [buildings and external furniture] of the Church be upholden by the [civil] patron and free-holders [civil town citizens],¹ as Mal. 1:10; Hag. 1:4; Hag. 2:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, 1642, London | Ch. 20, Whether or not the government of the Church of Scotland can be proved by God’s Word to be lawful? | 11th Article, Elders and Deacons</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Upon the first day of the week, everyone lays by in store, as God prospers him, giving it into a broad [collection plate] at the church door, for the relief of the poor, as 1 Cor. 16:2. It is provided that ministers have competent stipends, as 1 Cor. 9:13, and that hospitals be upholden, Matt 25:35,36; Eccl. 11:1,2, and that the fabric [buildings and external furniture] of the Church be upholden by the [civil] patron and free-holders [civil town citizens],¹ as Mal. 1:10; Hag. 1:4; Hag. 2:16.”

</figure><figure class="quote" id="q-1160723795" data-kw="">
<blockquote><p>Some worship God with their good meaning, some with their good dealing, some with the babbling of a few words, as namely, of the Apostles Creed, and Ten Commandments for prayers. This service of God is very common, but alas, it is poor service. For the rule of divine honor is not the will of him that honors, but the will of Him which is honored. Secondly, here we learn to detest the service and worship which is performed to God in the Church of Rome. For it contains many parts and points of will-worship, having no warrant from God, either by commandment or promise. . . . For these and many other practices, let them bring forth the Word of God, if they can. They plead for many things, that they have the word of traditions. I answer, that traditions ecclesiastical are no word of God, but the word of man. And traditions which are called apostolical, are either of no moment, or doubtful. For how shall we know certainly, that they were the traditions of the apostles, considering none has said so, but some of the Fathers, whose testimonies are not sufficient, because they are subject to error?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (1626), vol. 1, p. 699.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-1aff900802" data-kw="">
<blockquote><p>The second point is that the outward worship does not please God of itself, but by means of the inward before described. Again, it is spiritual, not by itself, because it stands in bodily actions; but by reason of the inward worship, whence it proceeds and whereof it is a sign. Moreover, being severed from inward worship, it is worship in show, and not worship in truth. If they eye be evil, the whole body is dark. (Mt. 6:13) Christ bids the Pharisees to wash the inside of the cup and platter, and then all shall be clean (Mt. 23:25-26).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (London: Legatt, 1626), vol. 1, p. 707</span></figcaption>

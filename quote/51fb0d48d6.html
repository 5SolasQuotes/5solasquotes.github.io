<main class="wrap"><figure class="quote" id="q-51fb0d48d6" data-kw="">
<blockquote><p>But every man is tempted, when he is drawn away of his own lust, and enticed. Then when lust hath conceived, it bringeth forth sin: and sin, when it is finished, bringeth forth death.’ John in 1 Jn. 2:12, 16, “The lust of the flesh, and the lust of the eyes, and the pride of life, is not of the Father, but is of the world.” Add. Gal. 5:17.

2. Actual sins, which flow from this impure font: Mt. 15:19, “For out of the heart proceed evil thoughts, murders, adulteries, fornications, thefts, false witness, blasphemies: These are the things which defile a man.” Jam. 1:15. To these [latter, phsycial evils,] pertain:

3. Punishments of every kind: calamities, diseases, and finally temporal and eternal death (Rom. 5:12, 14; 7:10-14; Eph. 2:3). Thomas in Summa, pt. 1 of 2, q. 85, art. 3, recounts four wounds of nature: ignorance, malice, concupiscence and infirmity, of which he constitutes the first in the intellect, the second in the will, the third in the concupiscible appetite, and the fourth in the irascible, which Bellarmine expounds diffusely and pathetically in On the Loss of Grace &amp; the State of Sin., bk. 6, ch. 9-12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Schwartz, 1712), ch. 2, ‘On Original Sin’, pp. 14-15 Latin | “§40. The effects [of original sin] are either moral or physical evils. To the former is to be referred: | 1. Concupiscence, not that natural and innate faculty by which, for our ordinate conservation, we desire necessary things like food, drink, sleep, etc.—for this was instilled in man by God—but the pravitious concupiscence derived into posterity through the fall, otherwise called the concupiscence of the flesh (Eph. 2:3; 1 Jn. 2:16; Gen. 8:21), which by its inordinate movements irritates man to evils, and is the cause, fuel, and fodder of sin and of all vices and outrages, concerning which Paul says in Rom. 7:7, “I had not known lust, except the law had said, ‘Thou shalt not covet.&#x27;” James 1:14:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5cbf7cd3e2" data-kw="">
<blockquote><p>The will of God is one and the same, but it is distinguished: 1. In respect of the object into voluntatem beneplaciti et placiti. God wills good things and good effects with the will of his good pleasure, approving them first of all, and by Himself, He intends their end and means, Eph. 1:5; but evil and evil effects as they are evil, he nils, disapproves and dislikes. Yet he voluntarily permits evil, and as there is a good end of it, He wills it with the will of his pleasure, for it is good that there should be evil, Ps. 81:12; Acts 14:16; 1 Cor. 10:5. Divines thus distinguish, there is volitio mala et mali [an evil volition and a volition of evil], to will sin to be, is not sinful; it had never come into the world if God had not willed it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, 1654), bk. 2, ch. 7, ‘Of God’s Understanding that He is Omniscient, and of his Will’, p. 165</span></figcaption>

<blockquote><p>Then when we say all things to have been created by God, we include not those things which are evil, as they are evil. For those things are not from God, but from Satan, the parent of all evils. Execrable is the error of the Manichees, who contend that evil is from God, whom blessed Augustine very strongly repressed. And evil spirits, although they are from God, as spirits, yet from Him they are not, as evil spirits. For God saw all things which He had made, and they were very good (Gen. 1). But that we read, Isa. 45: ‘I am the Lord, and there is no other, forming light, and creating darkness, making peace, and creating evil,’ is not to be understood concerning the evil of iniquity and impiety, but concerning the evil of adversity and calamity: just as also that word, Amos 3: ‘If there is evil in the city, have I not done it?’ Thus ‘evil days’ are spoken of, in which we are pressed with some calamity and tribulation: which manner of speaking is common and vulgar, which also Christ used, saying: ‘Sufficient unto the day is the evil thereof.’ (Mt. 6) … That place, Prov. 16, where Solomon says: ‘The Lord works all things for Himself, and the impious also unto the evil day,’ is not to be adduced unto this operation of creation. For Solomon speaks there not concerning creation, although God Himself the principle and end of all things created all things for Himself: but concerning His providence and government, by which He so governs all things, even the minds of the impious, that they make unto His glory. Therefore it is to be taken heed, lest anyone from the words of Solomon badly understood and applied, should gather that God created the impious, as impious. For the impious as impious is not from God, but from the father the devil (Jn. 8).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Loci Communes Sacrae Theologiae 3rd</cite>, ed. (Basel: Hervagius, 1564), ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>

+badly+understood+and+applied%2C+should+gather+that+God+created+the+impious%2C+as+impious.+For+the+impious+as+impious+is+not+from+God%2C+but+from+the+father+the+devil+%28Jn.+8%29.%E2%80%9D%0A%0A%E2%80%94+Wolfgang+Musculus%2C+Loci+Communes+Sacrae+Theologiae+3rd+ed.+%28Basel%3A+Hervagius%2C+1564%29%2C+%E2%80%98On+Creation%E2%80%99%2C+trans.+AI+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6ed08fe31b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6ed08fe31b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/god-is-not-the-author-of-evil/#:~:text=Then%20when%20we%20say%20all%20things,the%20father%20the%20devil%20%28Jn.%208&amp;text=Then%20when%20we%20say%20all%20things%20to%20have&amp;text=but%20from%20the%20father%20the%20devil%20%28Jn.%208" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

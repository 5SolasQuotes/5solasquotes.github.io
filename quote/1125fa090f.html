<main class="wrap"><figure class="quote" id="q-1125fa090f" data-kw="">
<blockquote><p>Regeneration is a benefit of God, by which our corrupted nature is renewed to the image of God by the Holy Spirit, 2 Pet. 1:4; Tit. 3:5; Gal. 4:6; 2 Cor. 3:7. That same is also called sanctification, and the gift of grace. Rom. 5. Also of schoolemen it is called an infused grace. Regeneration is either begun, or perfected: the former belongs to this life, the latter to the life to come… Regeneration of the soul is that whereby the powers of the soul are renewed. Tit. 3:5; Gal. 4:6.</p></blockquote>

<blockquote><p>1. In respect of its first moment regeneration comes about in another way than in respect of its progression. Regarding the first moment of regeneration man is purely passive; regarding its progression man cooperates with God. … 13. In this life regeneration is by degrees: these degrees do not only concern regeneration by itself but also the subjects. Some people are more regenerate than others; hence older people are more regenerated than the young ones.</p></blockquote>

</figure><figure class="quote" id="q-9dbf374903" data-kw="">
<blockquote><p>‘Born again’. Being turned unto God by true faith and repentance: A metaphorical term. We are born again four ways: 1. Sacramentally, by Baptism. 2. Spiritually, by the Word. 3. Corporally, in the Resurrection. 4. Eternally, in our Glorification. Question: But why is our repentance likened to a new birth? Answer: [1] To distinguish true repentance, from that which is false and fained: for it imports five differences. … 2. That in true repentance there is a total change in the whole nature of man: He has grace in every part; a new mind and a new heart, a new memory, and a new conscience, a new language, and a new carriage both to God and man: for birth is the producing of all essential parts of man. 3. That in true repentance there is the pain of contrition, a broken spirit, the throws and pains of travail, there is true godly sorrow and grief in the birth of grace. 4. That there is in true repentance a daily hunger and thirst after the sincere milk of the Word, 1 Pet. 2:2. 5. That in the things of God’s Kingdom there is new life, and sense, and feeling, and motion. Secondly, to show the privilege of the penitent: for it signifies he gets more by his new birth than any child in nature can do by pleading his birthright: For if in repentance we be born unto God, then it shows: 1. That we have received power to be the sons of God, Jn. 1:2. 2. That with our adoption we enjoy the privileges of sons. 1. The favor of God, as a father. 2. The care of God to maintain us, Mt. 6:33. 3. The pardon of God in saving us from condemnation, Rom. 8:1. 4. The portion of God, even the inheritance which God gives as a Father, which is spoken of Rom. 8:17; Gal. 4:7. The use should be twofold: 1. That wee try ourselves carefully in the businesse of our repentance by the former signes:* 1.2 and secondly, that we comfort ourselves in the privileges of our new birth, rejoicing in our portion, and the favor of our heavenly Father. And thus of the reason of the phrase. Concerning the new birth, here we have occasion to consider of two things: 1. That it is needful often to be remembered of the doctrine of regeneration: the apostle having spoken of it before, falls upon it here again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Three First Chapters of the First Epistle General of St. Peter... (London: Flesher, 1637), on 1 Peter 1:23</cite>, pp. 184-85</span></figcaption>

</figure><figure class="quote" id="q-058361cce0" data-kw="passive first moment">
<blockquote><p>Rather the question concerns the first moment when he is converted and receives new life by regeneration. We contend that he is merely passive in this, as a receiving subject and not as an acting principle. Again, the question is not whether man is able to convert himself without grace. Rather the question is whether he is able to cooperate with that exciting grace.</p></blockquote>

</figure><figure class="quote" id="q-dd631f1209" data-kw="">
<blockquote><p>This will I briefly show, when that I have spoken of justification, the which precedes regeneration, from whom we may discern it, but not divide it, no more than heat from the fire. Justification in Scripture is taken for the forgiveness of our sins, and consists in the forgiveness of our sins. This is only God’s work, and we nothing else but patients and not agents. After this work, in respect of us and our sense, comes regeneration, which altogether is God’s work also: for, as to our first birth we bring nothing (bring, quoth I? yes, we bring to let [prevent] it many things, but to further it nothing at all)…</p></blockquote>

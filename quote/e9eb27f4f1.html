<main class="wrap"><figure class="quote" id="q-e9eb27f4f1" data-kw="">
<blockquote><p>‘The first day’ Here the error of those is manifestly refuted who maintain that the world was made in a moment. For it is too violent a cavil to contend that Moses distributes the work which God perfected at once into six days, for the mere purpose of conveying instruction. Let us rather conclude that God Himself took the space of six days, for the purpose of accommodating his works to the capacity of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, (1554 / 1563), on ch. 1, verse 5 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-3674505d20" data-kw="">
<blockquote><p>Now you are to meditate how God brought forth all his works in the space of six days, before He finished them; He did not create the world all at once, but took time for the creation of it, to teach us to take special time duly and orderly to consider and meditate on the works of God: if He that could have made the Heavens and the earth, the sun, moon and stars, and all creatures, in a moment; yet it pleased Him to take time for the creating of them; this should teach us to select some space of time for the meditation of them: We must not think it enough to look upon them at one view, but to pass from part to part, from one creature to another, and in every creature to admire the workmanship, power, wisdom and goodness of the Creator, as we are taught, Ps. 92:4-5… which psalm as the title tells us, was a meditation penned for the Sabbath day: therefore I say, God would spend six days about the creation of the world, whereas He might have done it in an instant, and in a moment of time, to the end that we might the better meditate upon it from point to point, for which purpose He presently ordained the Sabbath… The eternal power and Godhead is seen by the things that are made; but most of us have great cause to be ashamed, that we have spent so little time in meditating on the works of God; yea who can truly say he has spent so much time in meditating on God’s works as God spent in making them? How few are there that have set apart so much time ever since they were born, as (if it were all laid together) will make up six days one entire week? What a shame is it for man whom God made on purpose to view his works, and by them to glorify Him, not to spend so much time in meditating upon them as God spent in making of them;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gearing.html">William Gearing</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mount of Holy Meditation: or a Treatise</cite>, … (London: Tyton, 1662), ch. 8, pp. 54-56</span></figcaption>

</figure><figure class="quote" id="q-f14b20fcab" data-kw="">
<blockquote><p>‘My Father worketh hitherto, etc.’ God having finished that work of Creation in the space of six days, rested from that work on the seventh day; but from the work of his providence, and governing the things He has made, He never rested one day from the Creation of the world. In six days the Creation of the world was finished, but the government thereof is perpetual, and God continually works in preserving and maintaining the order thereof, even as the apostle says…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gearing.html">William Gearing</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Eye &amp; Wheel of Providence, or a Treatise Proving that there is a Divine Providence</cite>, (London: Tyton, 1662), ch. 1, pp. 5-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-1d8131c49f" data-kw="">
<blockquote><p>Fourthly, if it be asked when God created all things, nothing else can be responded, than in the beginning of time. For Moses also thus begins the history of creation: ‘In the beginning God created heaven and earth.’ And the question concerning time cannot have place there, where time was not yet. But time was not yet, when none were yet created, which the spaces of times should serve. Yet also distinct times are assigned in the Scriptures, in which by order this world with all things which exist in it has been created.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Loci Communes Sacrae Theologiae 3rd</cite>, ed. (Basel: Hervagius, 1564), ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

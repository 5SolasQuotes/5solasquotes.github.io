<main class="wrap"><figure class="quote" id="q-9f1520403f" data-kw="">
<blockquote><p>In the first covenant [the Covenant of Works], faith was required as a work and a part of the inherent righteousness to which life was promised. But in the second [the Covenant of Grace], it is demanded―not as a work on account of which life is given, but as a mere instrument apprehending the righteousness of Christ (on account of which alone salvation is granted to us). In the one, faith was a theological virtue from the strength of nature, terminating on God, the Creator; in the other, faith is an evangelical condition after the manner of supernatural grace, terminating on God, the Redeemer. As to works, they were required in the first as an antecedent condition by way of a cause for acquiring life; but in the second, they are only the subsequent condition as the fruit and effect of the life already acquired.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, 3 vol. (Phillipsburg, NJ: P&amp;R Publishing, 1992–1997), 2:291–92.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-ad601a4a8b" data-kw="">
<blockquote><p>Disputing in his Panstrat. vol. iii. book xv. chap. iii. against Bellarmine, [Chamier] teaches that the true and determinate difference between the law of works and that of faith, is the condition of works and of faith; that is, that the law of works proposes salvation, upon condition of performing the law. But the law of faith proposes it, upon condition only of believing in Christ. Lest, however he should leave any thing unexplained, he observes, that conditions in contracts are of two kinds; some of which may be called antecedent, others consequent. He calls these antecedent, which give rise to the contract, according to the maxim, I give, that thou mayest give, as when one sells a field for a certain sum of money. But the consequent conditions are added to the antecedent, as following from them: which indeed are mutual between the parties, but oblige the one only: so that the other is bound to do no more on their account: As if one having given or sold a plot of ground, should assign an annuity to be laid out upon the poor. Now conditions of that kind, when not performed, usually disannul the contract: and yet they do not constitute it. Nay, there would be no annuity, except the sale were already full and complete. This distinction that very learned divine applies to the present purpose, in the following manner: The law of works requires the fulfilling of the law as an antecedent condition, without which, not only no man can enter upon the possession of eternal life, but cannot so much as have a right to it. But the law of faith does not admit of works as a condition p 151 in this sense, but only in the other: viz. that by virtue of the life already given through faith, works are necessary, so that he who shows no works, falls from every right which he had, or rather seemed to have, on account of his external vocation; although otherwise, works are not the causes of the life to be given. Thus far Chamier: compare Tuckney in his Theological Prelections, p. 233.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conciliatory or Irenical Animadversions on the Controversies Agitated in Britain</cite>, trans. Thomas Bell (Glasgow: W. Lang, 1807), 149–51.</span></figcaption>

</figure><figure class="quote" id="q-f19f85dc6a" data-kw="">
<blockquote><p>It is asked whether a reward is promised to works as signs of faith. We judge that those say too much who think it is promised to works as a meritorious cause; nor do we think they say enough who suppose the promise is made only to them as signs of faith. For there are many passages of Scripture by which it is plainly established that our works, in the matter of salvation, are regarded as a cause without which not, or as a preceding condition, which has the reward of eternal life inseparably connected with it (Mt. 25:34; Rev. 7:14, etc.).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gerhard-j-vossius.html">Gerhard J. Vossius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theses on the Merit of Good Works as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith</cite>, … (London: 1655), ch. 3, pp. 375-76, trans. ChatGPT-5 Vossius (1577-1649) was an Arminian professor of history and politics at Amsterdam. | Thesis 10, p. 79</span></figcaption>

<blockquote><p>See how it is that we do not justify men before God by works, but say, that all who are of God are regenerated and made new creatures, so that they pass from the kingdom of sin into the kingdom of righteousness. In this way they make their calling sure, and, like trees, are judged by their fruits.</p></blockquote>

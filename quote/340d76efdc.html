<main class="wrap"><figure class="quote" id="q-340d76efdc" data-kw="">
<blockquote><p>It is therefore evident that according to the Romish Church the mass is presented as a continual and oft repeated sacrifice of Christ, offered up by the priests, and that this repeated sacrifice is indeed necessary for the forgiveness of sins, both of those that are living on the earth and of the departed souls that are still in purgatory. According to the Roman Catholics the mass has all the essential elements of a true sacrifice. It is offered by a priest, Jesus Christ through the ministry of His earthly representative, the Roman Catholic priest. It has its victim, again Jesus Christ, as He is really present under the appearance of bread and wine. And it is offered up as a real sacrifice through the mystic rite of consecration.

In the mass there is, therefore, a continuation of the bloody sacrifice of Christ on the cross in an unbloody manner. The Romish Church does indeed maintain that this sacrifice of the mass is necessary, and they deny that it is quite sufficient that Christ once for all and forever shed His blood for the blotting out of all the sins of His people. This element of the mass, together with the element that the transubstantiated signs are to be worshipped by the church, the Heidelberg Catechism in Question 80 rightly calls an accursed idolatry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-hoeksema.html">Herman Hoeksema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, ed. Homer C. Hoeksema (Grand Rapids MI: Reformed Free Publishing Association, 1966), p. 724.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a14377ed13" data-kw="">
<blockquote><p>That doctrine which maintains a change of the substance of bread and wine, into the substance of Christ&#x27;s body and blood (commonly called transubstantiation) by consecration of a priest, or by any other way, is repugnant, not to Scripture alone, but even to common sense, and reason; overthroweth the nature of the sacrament, and hath been, and is, the cause of manifold superstitions; yea, of gross idolatries.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 29.6</span></figcaption>

</figure><figure class="quote" id="q-9728b127f4" data-kw="against mass">
<blockquote><p>Thus we determine that in the Christian church no true, real and properly so called propitiatory sacrifice is granted, except the sacrifice of Christ once offered on the cross. This we think neither can nor ought to be repeated. And so we reject and detest the sarifice of the Mass as diametrically opposed to the sacred Scriptures and to the Christian faith and highly injurious and derogatory to Christ. The reasons why we thus determine are many. Proof that no sacrifice of the Mass is granted: (1) from the silence of the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.29.5</span></figcaption>

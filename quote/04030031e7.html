</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a9beea392e" data-kw="">
<blockquote><p>When a sanctified man reads David’s psalms, or Paul’s epistles, how is he surprised with wonder to find the very workings of his own heart so exactly deciphered and fully expressed there! O, saith he, this is my very case, these holy men speak what my heart hath felt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Flavel on the Content of Singing Public Praise to God | Method of Grace, p. 309</cite>, vol. 1; vol. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-fe91d3a304" data-kw="">
<blockquote><p>Next you say, ‘Why may not the Christian Church compose new Hymnes, as they of Corinth did?’ And this you judge to be the more necessary because that David‘s Psalms have not such full and clear Hymns upon the great mysteries of the Christian belief: And you think the liberty which we plead for in prayer should much persuade it. ‘Tis answered, if you consider that Scripture, 1 Cor. 14, and particularly the 26th verse, you may understand that as the apostle’s business in the place is to set an order to the use of extraordinary gifts, wherein that Church abounded; so, the Psalms, doctrine, tongue, revelation, and interpretation there spoken of, appear to be inspired and afflatitious motions, which will not found you any argument: And you yourself do so plainly observe that these Psalms of the Corinthians were framed by private persons, that I marvel that your remembering of the thing to be extraordinary did not stop your translation of it by way of privilege to the Churches in our days. 2. Seeing the Lord hath provided us with a plentiful variety of Psalms and Hymns; and beside, hath allowed us as full a liberty of praising in prose, as of prayer, I think it doth fully remove all that is here by you objected, and abundantly warrant us both to abide content with God’s institutions, and refuse a superfluous mixture of humane odes with these divine Psalms, which He hath appointed, for the matter of our more solemn praises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist… ([Amsterdam], 1671), The Fifth Dialogue Answered. MacWard was the protege of Samuel Rutherford. He does not explicitly cite Eph. 5:19 &amp; Col. 3:16 below, but the allusions to those passages are obvious. He appears to allow for singing Scripture songs in some respect.</cite>, p. 278</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“Next you say, ‘Why may not the Christian Church compose new Hymnes, as they of Corinth did?’ And this you judge to be the more necessary because that David‘s Psalms have not such full and clear Hymns upon the great mysteries of the Christian belief: And you think the liberty which we plead for in prayer should much persuade it. ‘Tis answered, if you consider that Scripture, 1 Cor. 14, and particularly the 26th verse, you may understand that as the apostle’s business in the place is to set an order to the use of extraordinary gifts, wherein that Church abounded; so, the Psalms, doctrine, tongue, revelation, and interpretation there spoken of, appear to be inspired and afflatitious motions, which will not found you any argument: And you yourself do so plainly observe that these Psalms of the Corinthians were framed by private persons, that I marvel that your remembering of the thing to be extraordinary did not stop your translation of it by way of privilege to the Churches in our days. 2. Seeing the Lord hath provided us with a plentiful variety of Psalms and Hymns; and beside, hath allowed us as full a liberty of praising in prose, as of prayer, I think it doth fully remove all that is here by you objected, and abundantly warrant us both to abide content with God’s institutions, and refuse a superfluous mixture of humane odes with these divine Psalms, which He hath appointed, for the matter of our more solemn praises.”

formist%E2%80%A6+%28%5BAmsterdam%5D%2C+1671%29%2C+The+Fifth+Dialogue+Answered.+MacWard+was+the+protege+of+Samuel+Rutherford.+He+does+not+explicitly+cite+Eph.+5%3A19+%26+Col.+3%3A16+below%2C+but+the+allusions+to+those+passages+are+obvious.+He+appears+to+allow+for+singing+Scripture+songs+in+some+respect.%2C+p.+278&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffe91d3a304.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fe91d3a304.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=Next%20you%20say%2C%20%E2%80%98Why%20may%20not,matter%20of%20our%20more%20solemn%20praises&amp;text=Next%20you%20say%2C%20%E2%80%98Why%20may%20not%20the%20Christian&amp;text=for%20the%20matter%20of%20our%20more%20solemn%20praises" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c14dc0bdcb" data-kw="">
<blockquote><p>I have enterprised (Christian reader) this work, with regard of God’s honor, and comfort of his people; that his Word might dwell in us richly, in all wisdom; and that we might teach and admonish ourselves, in psalms and hymns and songs spiritual. This I have labored to effect, by setting over into our tongue the Psalms in meter… … Psalms of holy Scripture, are perpetually to be sung in the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-ainsworth.html">Henry Ainsworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Book of Psalms: Englished both in Prose &amp; Meter. With Annotations, Opening the Words and Sentences, by Conference with Other Scriptures (Amsterdam, 1612)</cite></span></figcaption>

<blockquote><p>Christ and his disciples sang psalms: the Church in her purest ages used it, yea when persecution hindered the more public service of God, they sung Psalms before day… [likely referring to Pliny’s letter]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David’s Soliloquy Containing many comforts for Afflicted Minds. As they were delivered in sundry sermons at Saint Mary’s in Dover (London, 1627) These sermons of the reformed and conforming Anglican, John Reading (c.1587-1667) on Ps. 42:11 contain 42 references to a psalm or psalms. As is seen from below, the few times Reading refers to ‘hymns’, the term refers to psalms from the book of psalms. Note Reading’s interpretation of the early letter of Pliny as referring to the early Christians singing psalms to Christ.</cite>, p. 21</span></figcaption>

<main class="wrap"><figure class="quote" id="q-f3251ccd01" data-kw="">
<blockquote><p>In this way only we attain to what is not to say difficult but altogether against nature, to love those that hate us, render good for evil, and blessing for cursing, remembering that we are not to reflect on the wickedness of men, but look to the image of God in them, an image which, covering and obliterating their faults, should by its beauty and dignity allure us to love and embrace them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.7.6 (Beveridge transl.)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“In this way only we attain to what is not to say difficult but altogether against nature, to love those that hate us, render good for evil, and blessing for cursing, remembering that we are not to reflect on the wickedness of men, but look to the image of God in them, an image which, covering and obliterating their faults, should by its beauty and dignity allure us to love and embrace them.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3a7a08b9ad" data-kw="">
<blockquote><p>Farther this Pigghius reasons and says that this desire which Augustine calls concupisence is a work of nature and of God: and therefore it cannot be counted sin. But we have before answered that it comes not from the grounds of nature as it was instituted by God, but of nature corrupted. For man, when he was created, was made right and (and as the scripture says) to the image of God. Wherefore that desire of things pleasant and preservative in Adam, when he was first created, was not outrageous or vehement, to be against right reason and the word of God: for, that followed afterward. Wherefore we ought not to call it the work of God (as Pigghius says) but the wickedness of sin and corruption of affections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, ch. 5, p. 123 in Most Learned &amp; Fruitful Commentaries of Dr. Peter Martyr Vermilius... (d. 1562; London: 1568)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-24bbbd78f5" data-kw="">
<blockquote><p>…in the case of a rational substance, an end toward which it is directed can be known intellectually, and that the will or rational appetite just is that power by virtue of which such a subtance can aim at an end qua grasped by the intellect.ª ª We can, of course, also aim at ends that are not grasped by the intellect. For example, any human being aims at the end of circulating blood through his body, just by virtue of having a heart and blood vessels, and does so even if he is completely unaware of the existence of this circulatory system. It is precisely because we can iam at such ends without the intellect being cognizent of them that their pursuit is not the subject of the will. A will that was not of its nature directed toward what the intellect takes to be good would be like an acorn that was not of its nature directed toward becoming an oak. The latter just wouldn’t really be an acorn, and the former just wouldn’t really be a will.¹ ¹ For further discussion and defense of the thesis that the will always aims at what the intellect takes to be good, see Edward Feser, ‘Being, the Good, and the Guise of the Good,’ in Daniel D. Novotny and Lukas Novak, eds., Neo-Aristotelian Perspectives in Metaphysics (London: Routledge, 2012). …A tree that did not aim at getting its branches toward the sun would not be a freer tree, but just a defective tree. And a will that did not aim at the good would not be a freer will, but just a defective will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, (Editiones Scholasticae, 2024), pt. 1, ch. 4, ‘The Will’; pp. 137-38</span></figcaption>

</figure><figure class="quote" id="q-9620be16ed" data-kw="">
<blockquote><p>The short answer is that the will is the power or capacity of a rational substance to pursue what the intellect judges to be good. (Not necessarily morally good, but at least good in the broad sense of being suitable or desirable in some way.) It is also traditionally known as the ‘rational appetite.’ It is an appetite insofar as it involves an inclination or tendency toward some object or end. It is a rational appetite insofar as the object is pursued as something conceptualized in a certain way, and thus as something about which we might reason and come to know true propositions. This distinguishes the will from the appetites that non-human animals possess, which involve inclinations toward non-conceptualized objects of sensory perception; and from the sorts of inclinations or tendencies that a plant or an inanimate substance might exhibit, which are not even conscious, let alone conceptualized… A human being, by contrast, can not only perceive and desrie water, but can know that it is water and desire it precisely as something conceptualized… To be able to do that sort of thing is just what it is to have a will. This is, in any even, the account fo the will famously associated with Aquinas…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, (Editiones Scholasticae, 2024), pt. 1, ch. 4, ‘The Will’; p. 111</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

<blockquote><p>‘to you it shall be for meat’: which is generally thought to be the food of the antediluvians, it not being proper, at least very soon, to kill any of the animals until they were multiplied and increased, lest their species should be destroyed, though here is no prohibition of eating flesh; nor is it said that this only should be for meat which is before mentioned; and by the early employment of some in keeping sheep, and by the sacrifice of creatures immediately after the Fall, part of which used to be eaten by the offerers; and by the distinction of clean and unclean creatures before the Flood, it looks probable that flesh might be eaten: and Bochart refers this clause to what goes before in the preceding verse, as well as to what is in this, and takes the sense to be that the fishes of the sea and fowls of the air, and every living creature man had dominion over, as well as herbs and fruits, were given him for his food: but the Jews are of opinion that the first man might not eat flesh, but it was granted to the sons of Noah.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Bible</cite>, (d. 1771), on Gen. 1, v. 29</span></figcaption>

<main class="wrap"><figure class="quote" id="q-5f064b23ae" data-kw="">
<blockquote><p>There are several cases in which separation from the Church of England is sinful, as: 1. If any separate as the Papists do, because they are against sound doctrine or any good that is in the Church. 2. If any renounce communion with all the parish-churches under the name of the Church of England. 3. If any renounce communion with the Church of England as it is a Christian kingdom, headed by one Christian protestant king. 4. If they renounce communion with the Church of England as it is called one from the association or concord of its pastors or Church governors. 5. If any renounce communion with faulty bishops or worship, or discipline, simply and absolutely, and not only secundum quid [according to what; that is in a qualified manner], and so forsake the good that is in them for the sake of the evil. In a word, 1. all that separate for a wrong cause, 2. or further than they separate from Christ, or than Christ would have them separate, do sin. 2. But they that renounce any corruption as such, and the Church no further than secundum quid [according to that], as it is faulty, do well: For we must so renounce the faults of all Churches and Christians in the world (and our own first), but not the Churches and Christians for any tolerable faults, so that we commit no sin ourselves, which they impose as the condition of their communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen (1684; RBO, 2024)</cite>, p. 85</span></figcaption>

<blockquote><p>XXVII. Self-interest, self-government and family-government are all antecedent to public government, which rules them for the common good, but has no authority to destroy them: No king or prelate can bind a man to do that which would damn his soul, nor to omit that which is needful to his salvation: All power is for edification: They are God’s ministers for God. XXVIII. As it belongs to self-government to choose our own diet, and clothes, and wives, and physicians, (though we may be restrained from doing public hurt on such pretences); And it belong to family government to educate our own children, and choose their tutors, callings, wives, etc. so it more nearly belongs to self-government to choose the most safe and profitable means of our own salvation, which no man may forbid us; and to avoid that which is pernicious or hurtful; and to family-government to do the like for our children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation… (London: 1684), ch. 4</cite>, p. 26</span></figcaption>

<blockquote><p>Beware of division yourselves, and give your help to recover, in all tenderness, these that have withdrawn, and encourage them not in their way. I’m persuaded that if they were not so much countenanced and encouraged by these that are hearers, the number of such would not be so great as it is. Let not that itching ear get place with you, so as to run away to their meetings whenever you have opportunity, and so to cast yourselves into a snare, and to do what in you lies to strengthen the division.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders, 1740</cite></span></figcaption>

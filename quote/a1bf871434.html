<blockquote><p>It need not be told how closely the policy of European nations corresponds to the system of ancient Rome. The spirit of the Roman dominion is transfused into modern governments: might is frequently taken to constitute right, and the people are held in subjection by standing armies […]</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-410f54fa7e" data-kw="">
<blockquote><p>As for those psalms which contain DENUNCIATIONS of divine vengeance upon the enemies of God and his church, we are to consider, that these expressions were dictated by the infallible Spirit of God; that the objects of them were foreseen to be irreconcilable enemies of Christ and his church; that those who sing them, only applaud the equity of the doom which God hath justly pronounced upon such offenders; and that they are to be sung with a full persuasion of the event, as a certain, awful and just display of the glory and tremendous justice of JEHOVAH. Though we ought, therefore, never to apply them to particular parties or persons who have injured us, yet to decline using them, out of a pretence of charity, is to suppose ourselves wiser than him whose understanding is infinite, and more merciful than the Father of mercies, who is full of compassion, and delighteth in mercy. Moreover, as these external enemies, devoted to destruction, were in some sense emblematic of our spiritual enemies, within or without the passages may be sung with application to ourselves, as directed against these principalities and powers, and spiritual wickedness, in high places, with whom we have to wrestle, while on earth, Eph. vi. 10-19. I Pet. v. 8, 9, Rom. viii. 13, Gal. v. 17-24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms of David, in metre: allowed by the authority of the General Assembly of the Church of Scotland, and of the Presbyterian Churches in</cite>, America. With notes exhibiting the connexion, explaining the sense, and for directing and animating devotion (Pittsburgh, 1812), v-vi.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-0ca812e071" data-kw="">
<blockquote><p>To these may be added dances (but the dances of pious girls must be separate from the dances of young boys) which may be danced to pure and holy songs (Plato, Laws II, 654 ff.), with chaste and modest motion befitting those who profess piety, as Miriam, the sister of Moses, danced and the matrons of Israel when they had crossed the Red Sea and sang the praises of God for such a wonderful delivery of their nation from the slavery of Egypt (Ex. 15:20-21). Such was the dance of the holy girls who celebrated David and Saul in a song of victory when they returned from the slaughter of the Philistines (1 Sam. 18:6), the kind of dance the Holy Spirit requires in Ps. 149:3 and 150:4 when he says, ‘Praise the Lord with timbrel and dance.’ … In pious singing, therefore, we are reminded of these gifts from such an immense goodness of God. And should the spirit not rightly leap with joy and gladness and excite the body to bear witness to this joy and impel it to express this gladness, by action, however, becoming to every age and nation? Certainly a deeper recollection of divine blessings strongly moved David, although he was a king, when he was bringing in the Ark of the Lord, so that he danced before it (II Sam. 6:12-15). He was a Palestinian, I admit, of a nation far more emotional and uninhibited than our European people. But since our young people delight in dancing, why are such dances not introduced among us too, who have become citizens of heaven through the blood of Christ, so that they spring forth from a pious and holy exultation of the mind over the goodness of God and strengthen and increase that exultation and inflame the spirit with a desire for all piety? … For this reason, no singing nor any kind of dancing should be allowed, either privately or publicly, which has not been approved by wise and religious men to whom this responsibility will be referred by Your Majesty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Reign of Christ, bk. 2, ch. 54, ‘Honest Games’ in Melanchthon &amp; Bucer, ed. Wilhelm Pauck (Philadelphia: Westminster Press, 1969), pp. 347-48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-25fa7ad2a5" data-kw="">
<blockquote><p>Thus far the old dispensation; the new succeeds, the administration of the covenant without the law and ceremonies after the appearance of Christ. It is called “new” not as to the substance of the covenant (which is the same in both) but: (1) as to the circumstances and mode, being manifested without a veil and the law (in which way that covenant appeared as if new or renewed), also because it sets forth Christ not to be exhibited but as exhibited, in which way it can be called new both intensively as to degree of light and extensively as to amplitude, extending itself indiscriminately to all nations; (2) as to the excellence and glory of this dispensation which far surpasses the old (2 Cor. 3:9, 10), as new is elsewhere taken for what is remarkable and superior (Rev. 5:9; Ps. 33:3); (3) as to perpetual duration, by which it happens that it is as it were always new, while those things which ought to cease are called old.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.7.46, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 2 (P&amp;R Publishing, 1992–97), 232.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-f4c9a982ea" data-kw="">
<blockquote><p>13. It [prayer] is likewise held forth by several expressions, pointing forth the posture and gesture of the body, such as ‘spreading forth of the hands’ (Ex. 9:29), ‘stretching out of the hands,’ (Job 11:13) ‘lifting up of the hands’ (Ex. 17:11; 1 Tim. 2:8; Ps. 28:2 and 63:4), ‘bowing the knee’ (Eph. 3:14), and ‘falling down’ (Dt. 9:18), mainly to point forth thereby the frame of the soul, and of the whole man, in prayer, to wit, that we should approach in humility, self-loathing, prostrating ourselves before the Lord, and in faith, earnestness, single dependence, hope, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Pious &amp; Elaborate Treatise Concerning Prayer &amp; the Answer of Prayer</cite>, (d. 1679), ch. 3, ‘Of the Nature of Prayer’, p. 33</span></figcaption>

<div class="actions"><button class="copy" data-copy="“13. It [prayer] is likewise held forth by several expressions, pointing forth the posture and gesture of the body, such as ‘spreading forth of the hands’ (Ex. 9:29), ‘stretching out of the hands,’ (Job 11:13) ‘lifting up of the hands’ (Ex. 17:11; 1 Tim. 2:8; Ps. 28:2 and 63:4), ‘bowing the knee’ (Eph. 3:14), and ‘falling down’ (Dt. 9:18), mainly to point forth thereby the frame of the soul, and of the whole man, in prayer, to wit, that we should approach in humility, self-loathing, prostrating ourselves before the Lord, and in faith, earnestness, single dependence, hope, etc.”

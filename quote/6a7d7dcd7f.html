<main class="wrap"><figure class="quote" id="q-6a7d7dcd7f" data-kw="">
<blockquote><p>If you ask, what are these hinderances? I answer, 1. Ignorance; many think they are not in so strait a manner to be accountable for time. It is a general opinion of the grossly ignorant, that if they can but pass away in time without doing any harm (as they say) they are well enough; as if no account of time might be given at all: they are ignorant of this principle, that they are to improve, and to redeem the time.

2. Slothfulness; this makes men heedless, or careless of their time: As it is with the sluggard, Yet a little more sleep, a little more slumber, a little more folding of the arms is sleep. So it is with the idle person, Let this hour, and this day be spent in doing nothing. O the many golden hours, and days, and years that many thousands spend, and yet cannot give the least account wherein either they have glorified God, or served their generations.

3. Love of fleshly liberty: Alas, what care they for redeeming time who are set on their lusts and liberties to sin? All the care they have, it is merely to eat, and drink, and play: sensual pleasures are the whole study of these men, and if they can but enjoy them, let time slip away as it will, they never regard it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Redeeming the time a sermon preached at Preston in Lancashire, January 4th, 1657 at the funeral of the honourable lady, the Lady Margaret Houghton</cite>, (London: Rowland Reynolds, 1657), p. 2.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f1c92274d4" data-kw="">
<blockquote><p>All this, it is obvious, must be implied in sanctifying or keeping holy the Sabbath of the Lord; and consequently, that this day is profaned if we neglect, or carelessly perform, its sacred duties; if we spend it in idleness, sloth, and sinful indulgence; or if we are occupied with “unnecessary thoughts, words, or works, about our worldly employments or recreations.”

And if so, then who can estimate the amount of guilt which is every Sabbath contracted, even in this professedly Christian community? — for who does not know, that besides the amusement and idleness to which countless multitudes systematically devote that day, it is with not a few a season of more gross and flagrant wickedness than any other day of the week?

It is appalling to think that a day which was mercifully designed to be a respite from the bodily toil and the mental anxieties inseparable from the ordinary avocations of men in this world of sin and sorrow, should be spent in the most debasing slavery — the service of sin and Satan; and that a season which was graciously intended to raise the soul to things holy and heavenly, and to prepare it for the joys of an eternal inheritance, should be employed in sinking it deeper in spiritual degradation and misery.

I fear, my friends, that even Christians, by being so familiar with the sight of Sabbath profanation, regard it with less horror and alarm than it is befitting they should; and that they are not always forward to use the influence which they might exercise in arresting or preventing a sin which, when it becomes so common as to be characteristic of a nation, will assuredly, as all past experience testifies, bring down the judgments of God in national calamities.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-gordon.html">Robert Gordon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sanctification of the Sabbath: A Discourse in Christian Miscellany</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>[A]nything borrowed from heathenism or the abolished temple-service — as pretended priests, altars, altar-cloths, incense, symbolical vestments, or instrumental music — are entirely without divine warrant, and therefore unlawful. The same thing may be said of all man-pleasing, sensationalism, solo-singing, with any of the peculiarities of the theatre transferred without divine warrant into the worship of the Christian Church.

The worship of the New Testament Church, unlike that of the temple, is based on the worship of the synagogue. That worship consisted of singing, prayer, with reading and expounding the Scriptures. All priests, incense, instruments of music, and sacrifices were discarded; and our worship, now that the temple is completely destroyed, must be the simple worship of the synagogue under the clearer light of the New Testament, conducted in the name and by the authority of Christ, and under the solemn impression that “God is a Spirit, and they that worship Him must worship Him in spirit and in truth.</p></blockquote>

<blockquote><p>I cannot, saith the Christian, discourse with that fluency, nor pray with that elegancy as others.

Answ. 1. Grace is beyond gifts; Thou comparest thy grace with another’s gifts, there is a vast difference; Grace without gifts is infinitely better then gifts without grace; in Religion, the vitals are better then the intellectuals: Gifts are a more extrinsically and common work of the Spirit, which is incident to reprobates; grace is a more distinguishing work, and is a jewel hung only upon the Elect. Hast thou and seed of God, the holy anointing? be content.

I. Thou sayest, thou canst not discourse with that fluency as others.

Answ. Experiments in Religion are beyond notions, and impressions beyond expressions. Judas no doubt could make a learned discourse of Christ; but welfare the woman in the Gospel, that felt virtue coming out of him. A sanctified heart is better then a silver tongue. There is as much difference between gifts and grace, as between a Tulip painted on the wall, and one growing in the Garden.

II. Thou sayest, thou canst not pray with that elegancy as others.

Answ. Prayer is a matter more of the heart then the head. In prayer it is not so much fluency prevails, as fervency; nor is God so much taken with the elegancy of speech, as the efficacy of the Spirit. Humility is better then volubility; here the mourner is the orator, sighs and groans are the best Rhetorique.

2. Be not discontented; For God doth usually proportion a man’s parts to the place where he calls him: Some are set in an higher sphere and function, their place requires more parts and abilities; but the most inferior member is useful in its place, and shall have a power delegated for the discharge of its peculiar office.</p></blockquote>

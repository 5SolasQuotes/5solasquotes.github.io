<main class="wrap"><figure class="quote" id="q-30dfc94394" data-kw="">
<blockquote><p>The method of recovery must be adapted to the form of the disease. You will not by the same means cure the polytheism of the Greek, and the unbelief of the Jew as to the Only-begotten God: nor as regards those who have wandered into heresy will you, by the same arguments in each case, upset their misleading romances as to the tenets of the Faith. No one could set Sabellius right by the same instruction as would benefit the Anomœan. The controversy with the Manichee is profitless against the Jew.

It is necessary, therefore, as I have said, to regard the opinions which the persons have taken up, and to frame your argument in accordance with the error into which each has fallen, by advancing in each discussion certain principles and reasonable propositions, that thus, through what is agreed upon on both sides, the truth may conclusively be brought to light. When, then, a discussion is held with one of those who favour Greek ideas, it would be well to make the ascertaining of this the commencement of the reasoning, i.e. whether he presupposes the existence of a God, or concurs with the atheistic view. Should he say there is no God, then, from the consideration of the skilful and wise economy of the Universe he will be brought to acknowledge that there is a certain overmastering power manifested through these channels.

If, on the other hand, he should have no doubt as to the existence of Deity, but should be inclined to entertain the presumption of a plurality of Gods, then we will adopt against him some such train of reasoning as this: “does he think Deity is perfect or defective?” and if, as is likely, he bears testimony to the perfection in the Divine nature, then we will demand of him to grant a perfection throughout in everything that is observable in that divinity, in order that Deity may not be regarded as a mixture of opposites, defect and perfection. But whether as respects power, or the conception of goodness, or wisdom and imperishability and eternal existence, or any other notion besides suitable to the nature of Deity, that is found to lie close to the subject of our contemplation, in all he will agree that perfection is the idea to be entertained of the Divine nature, as being a just inference from these premises.

If this, then, be granted us, it would not be difficult to bring round these scattered notions of a plurality of Gods to the acknowledgment of a unity of Deity. For if he admits that perfection is in every respect to be ascribed to the subject before us, though there is a plurality of these perfect things which are marked with the same character, he must be required by a logical necessity, either to point out the particularity in each of these things which present no distinctive variation, but are found always with the same marks, or, if (he cannot do that, and) the mind can grasp nothing in them in the way of particular, to give up the idea of any distinction.

For if neither as regards “more and less” a person can detect a difference (in as much as the idea of perfection does not admit of it), nor as regards “worse” and “better” (for he cannot entertain a notion of Deity at all where the term “worse” is not got rid of), nor as regards “ancient” and “modern” (for what exists not for ever is foreign to the notion of Deity), but on the contrary the idea of Godhead is one and the same, no peculiarity being on any ground of reason to be discovered in any one point, it is an absolute necessity that the mistaken fancy of a plurality of Gods would be forced to the acknowledgment of a unity of Deity.

For if goodness, and justice, and wisdom, and power may be equally predicated of it, then also imperishability and eternal existence, and every orthodox idea would be in the same way admitted. As then all distinctive difference in any aspect whatever has been gradually removed, it necessarily follows that together with it a plurality of Gods has been removed from his belief, the general identity bringing round conviction to the Unity.</p></blockquote>

<blockquote><p>XVI. Second, the necessity of the case makes many things lawful which otherwise would not be lawful, in domestic affairs as well as in politics. If the doorkeeper of a house is overcome by a lethargy or by apoplexy, he cannot prevent the entrance of thieves, even though it is lawful for any servant to take the keys and to close the gates against them. If he to whom the care of supporting a family is committed denies bread to his children, who would say that it is not lawful for anyone of the domestics to supply them with bread if he can so that they may not perish with hunger? If the father himself rages for the destruction of his children, should not his arms be wrested from him, his children removed and entrusted to a guardian, not waiting for the judgment of a magistrate? Nay, a friend and neighbor can take this upon himself until the public authority has made some provision for them. When a fire is raging, who doubts that it is the duty of all to bring water to extinguish it, especially when they cease to whom this care pertained? Thus in a republic, if the rulers and prefects snore while the enemy approaches; if the gatekeepers open the gates to him; will it not be lawful for any citizen to snatch the keys from the hand of the betrayer in order to shut the gates against the enemy and to call to arms?… When the thing itself calls, what need is there to seek an external call? Nay, if they should cease form a regard to obedience, unmindful of the oath given to their prince, they would be deservedly convicted of perfidy and treachery because here the consciousness of wickedness alone pollutes, from which no one purges himself, unless according to his ability he resists the inrushing evil.</p></blockquote>

<blockquote><p>It follows not, because, though I say every thing may defend it self by nature, yet I say also it must do it modo suo &amp; naturae suae convenienti; we say that all creatures do defend themselves, and it is natural so to do; yet we do not therefore say that a beast defends himself in the same manner as a man doth, or a man as a beast, but in a way suitable to every nature.

Now if a private person be in danger to be oppressed by a Prince, flying is more fit defence for him, and therefore saith our Saviour, If they persecute thee in one City, flee to another: but if the State be wronged and oppressed, which is a public grievance, then the State, and those that represent them are more fit to take up Arms for its preservation.

For Nature in general teacheth self-preservation; Nature specificated teacheth this or that preservation: now the nature of a community, and of a particular person are distinct, and therefore though I say a community is to defend it self because sui tutela is natural to every thing; yet I do not say, that a particular private person may ordinarily defend himself in that way which is most suitable to the community as the taking up of Arms is, yet I suppose no moderate man will deny this that the Subjects (though) not invested with authority have a power to keep out an enemy from landing in case of foreign invasion, yea though the King’s Officers should be negligent therein; or so malicious and treacherous as to forbid them to defend themselves and their Country.</p></blockquote>

— William Bridge, The truth of the times vindicated whereby the lawfulness of Parliamentary proceedings in taking up of arms, is justified, Doctor Ferne’s reply answered, and the case in question more fully resolved, (London: Ben. Allen, 1643), p. 19.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+follows+not%2C+because%2C+though+I+say+every+thing+may+defend+it+self+by+nature%2C+yet+I+say+also+it+must+do+it+modo+suo+%26+naturae+suae+convenienti%3B+we+say+that+all+creatures+do+defend+themselves%2C+and+it+is+natural+so+to+do%3B+yet+we+do+not+therefore+say+that+a+beast+defends+himself+in+the+same+manner+as+a+man+doth%2C+or+a+man+as+a+beast%2C+but+in+a+way+suitable+to+every+nature.%0A%0ANow+if+a+private+person+be+in+danger+to+be+oppressed+by+a+Prince%2C+flying+is+more+fit+defence+for+him%2C+and+therefore+saith+our+Saviour%2C+If+they+persecute+thee+in+one+City%2C+flee+to+another%3A+but+if+the+State+be+wronged+and+oppressed%2C+which+is+a+public+grievance%2C+then+the+State%2C+and+those+that+represent+them+are+more+fit+to+take+up+Arms+for+its+preservation.%0A%0AFor+Nature+in+general+teacheth+self-preservation%3B+Nature+specificated+teacheth+this+or+that+preservation%3A+now+the+nature+of+a+community%2C+and+of+a+particular+person+are+distinct%2C+and+therefore+though+I+say+a+community+is+to+defend+it+self+because+sui+tutela+is+natural+to+every+thing%3B+yet+I+do+not+say%2C+that+a+particular+private+person+may+ordinarily+defend+himself+in+that+way+which+is+most+suitable+to+the+community+as+the+taking+up+of+Arms+is%2C+yet+I+suppose+no+moderate+man+will+deny+this+that+the+Subjects+%28though%29+not+invested+with+authority+have+a+power+to+keep+out+an+enemy+from+landing+in+case+of+foreign+invasion%2C+yea+though+the+King%E2%80%99s+Officers+should+be+negligent+therein%3B+or+so+malicious+and+treacherous+as+to+forbid+them+to+defend+themselves+and+their+Country.%E2%80%9D%0A%0A%E2%80%94+William+Bridge%2C+The+truth+of+the+times+vindicated+whereby+the+lawfulness+of+Parliamentary+proceedings+in+taking+up+of+arms%2C+is+justified%2C+Doctor+Ferne%E2%80%99s+reply+answered%2C+and+the+case+in+question+more+fully+resolved%2C+%28London%3A+Ben.+Allen%2C+1643%29%2C+p.+19.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F51256b9a2e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/51256b9a2e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/10/08/william-bridge-on-the-law-of-self-preservation-applied-to-individuals-and-communities/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>XIII… But, so that we may perceive this more easily and correctly, it must be maintained that: (1) good works, simply, confer entirely nothing to obtain for us the right to eternal life, because that is the pure, unadulterated [Greek; charisma], gift, of God (Rom. 6:23), impetrated by only the righteousness of Christ; but at the same time (2) their presence is required for many reasons, if not before all justification, at least with justification and after it. Hence, three stages of justification should be diligently observed here, namely: (1) Its constitution, wherein a person is first justified. Here is excluded not only the efficacy of good works to procure justification, but even their very presence, insofar as God justifies the sinner (Rom. 3:23) and the ungodly (Rom. 4:5). (2) Its continuation. Here though no efficacy of good works is admitted for justification, yet their presence is required (Gal. 5:6). And in this sense perhaps, James denies that we are justified by faith alone, but requires works in addition (James 2:14, 17–18, 20–22, 24–26). Finally, (3) Its consummation, wherein the right of eternal life conferred in the first stage and continued in the second is advanced also to its possession. Here, not only the presence of good works is required, but also some sort of efficacy of them, insofar at least as God does not will to confer the possession of eternal life, the right of which we already obtain by Christ’s merit alone, except, besides faith, with good works going before (Heb. 12:14; Matt. 7:21; 25:34–36; Rom. 2:7, 10).</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-82485833f0" data-kw="">
<blockquote><p>We do not deny (as the Papists falsely slander us) all inherent righteousness, 2 Cor. 5:17, nor all justification before God by inherent righteousness, 1 Kn. 8:32 [“Then hear thou in heaven, and do, and judge thy servants, condemning the wicked, to bring his way upon his head; and justifying the righteous, to give him according to his righteousness.”]. But this we teach, that this inherent righteousness is not that righteousness whereby any poor sinner in this life can be justified before God’s Tribunal, for which he is pronounced to be innocent, absolved from death and condemnation, and adjudged unto eternal life. … Whether inherent justice be actual or habitual? Bishop Davenant, ch. 3, Of Habitual Righteousness, says a certain habitual or inherent justice is infused into all that are justified, Jn. 1:13; 2 Cor. 5:17; Gal. 6:15; 1 Cor. 6:11, 19; 2 Pet. 1:4. All those that are justified do supernatural works; Therefore, it is certain that they are endued with supernatural grace and holiness. We are said to be righteous, from this inherent justice we are said to be just, and that by God Himself, Gen. 6:9; Heb. 11:4; Lk. 1:61 &amp; 2:25; 1 Pet. 4:18.</p></blockquote>

<blockquote><p>20. Justification does not free from sin and death directly by taking away the blame or stain or all the effects of sin; rather it removes the guilty obligation to undergo eternal death. Rom. 8:1, 33-34, ‘There is no condemnation… Who shall lay anything to their charge?… who shall condemn? 21. Nor does it take away guilt so that the deserving of punishment is removed from sin. This cannot be taken away as long sin itself remains. But justification does take away guilt so that its haunting or deadly effects vanish. … 23. Not only are past sins of justified persons remitted but also those to come, Num. 23:25. God sees no iniquity in Jacob or perverseness in Israel. Justification has left no place for condemnation. John 5:24, ‘He who believes has eternal life and shall not come into condemnation’ — justification gives eternal life surely and immediately. It also makes the whole remission obtained for us in Christ actually ours. Neither past or present sins can be altogether fully remitted unless sins to come are in some way remitted. 24. The difference is that past sins are remitted specifically and sins to come potentially. Past sins are remitted in themselves, sins to come in the subject or the person sinning. 25. Yet those who are justified need daily the forgiveness of sins. This is true because the continuance of grace is necessary to them; the consciousness and manifestation of forgiveness increases more and more as individual sins require it; and the execution of the sentence which is pronounced in justification may thus be carried out and completed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology (Baker, 1997), ch. 27, ‘Justification’</cite>, pp. 163-64</span></figcaption>

quotes.github.io%2Fquote%2Fdc9dafded1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dc9dafded1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=20.%20Justification%20does%20not%20free%20from,thus%20be%20carried%20out%20and%20completed&amp;text=20.%20Justification%20does%20not%20free%20from%20sin%20and&amp;text=justification%20may%20thus%20be%20carried%20out%20and%20completed" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>How have we used the mercies which are taken from us? Yea God Himself will judge us according to our works! He will not justify us, if we have been unfaithful in our little, and have been such as Satan and his instruments, the accusers of the brethren, do report us. But if we have been faithful we may expect his double justification: 1 By pardon He will justify us from our sins. 2. By plea and righteous sentence He will justify us against the false accusations of our enemies. And that’s enough. How small a thing should it seem to us, to be judged of man, who must stand or fall to the final sentence of the Almighty God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Farewell Sermon prepared to have been preached to his hearers at Kidderminster at his Departure, but Forbidden (1660; London: 1683)</cite>, pp. 3-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>
<div class="actions"><button class="copy" data-copy="“How have we used the mercies which are taken from us? Yea God Himself will judge us according to our works! He will not justify us, if we have been unfaithful in our little, and have been such as Satan and his instruments, the accusers of the brethren, do report us. But if we have been faithful we may expect his double justification: 1 By pardon He will justify us from our sins. 2. By plea and righteous sentence He will justify us against the false accusations of our enemies. And that’s enough. How small a thing should it seem to us, to be judged of man, who must stand or fall to the final sentence of the Almighty God?”

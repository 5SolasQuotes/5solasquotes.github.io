<main class="wrap"><figure class="quote" id="q-4b238971e4" data-kw="">
<blockquote><p>Among the Hebrews, as indeed in most nations, particular faculties were connected with particular parts of the body; and we read of ‘bowels’ the seat of sympathy; of the ‘reins’ the seat of deep and anxious thought; and of the ‘heart’ the seat of all inward reflection.

And here we think it of some importance to call attention to the circumstance that the Scriptures do not distinguish, as we do, the heart from the head; and do not make the heart signify mere emotion, but use it to include all that passes through the mind prior to action; and we read of the ‘imaginations’ and of the ‘thoughts’ of man’s heart,—hence the absurdity of arguing that faith consists in feeling, from the fact that we are said to believe with the heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-mccosh.html">James McCosh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introduction to, The Complete Works of Stephen Charnock, B.D.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0aa6637311" data-kw="">
<blockquote><p>The Scribes &amp; Pharisees that came from Jerusalem, picked a quarrel against him, because his disciples did eat with unwashed hands, whereby they transgressed the tradition of the Elders: our saviour Christ in defence of his disciples, chargeth the Scribes &amp; Pharisees which were so zealous to maintain their own ceremonies, then they were careless to break the commandment of God.

And so it cometh to pass always, that they which are most earnest in upholding &amp; defending traditions &amp; ceremonies invented by man, are most forgetful in keeping the commandments of God. But this is the just judgment of God against those that invent a new worship of their own brain: That first they lose their labour, that so seek to please God: &amp; secondly that they are deprived of all right understanding, because they have presumed to be wiser then God.</p></blockquote>

</figure><figure class="quote" id="q-68230d520e" data-kw="">
<blockquote><p>And now, coming down to the time of the giving of the law, we find the Sabbath here, in this Fourth Commandment, “enshrined,” in the often-quoted words of Dr. [Thomas] Chalmers, “among the eternal sanctities of piety, and truth, and justice.” It stands associated with duties which are clearly and confessedly of permanent moral obligation, and no intimation is given that the requirement is only temporary. Is this fourth precept, then, to be regarded as an exception to the general principle, — as nothing more than a positive enactment, having no foundation in the nature of man as a moral being, and admitting, therefore, of being repealed at the will of the Lawgiver?

Surely the duties of worshipping God, cultivating holiness, preparing for the rest of heaven, are duties of a moral nature, and can there be anything more directly and properly moral than the setting apart of a certain portion of time for giving special attention to these duties? It is founded in man’s moral constitution. And what if the very proportion of time, which He who knows our frame has appointed for the purpose of rest — a seventh, rather than a sixth or an eighth part — should be, as eminent physiologists have told us, exactly the proportion that is requisite to restore the balance of the circulation, so as to secure a long life? Then the Fourth Commandment would have nothing positive in it at all; even the very proportion of time which God has fixed is moral, if such an arrangement be founded in the nature of man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-symington.html">William Symington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath; The Grounds of its Obligation, and its Proper Place in Relation to Christian Life and Duty in Patrick Fairbairn et al., Divine Revelation Explained and Vindicated: A Course of Lectures for the Times, Delivered in Glasgow in the Spring of 1866</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-3a21169bb9" data-kw="">
<blockquote><p>About refraining a moral duty for the evil mixed with it, or in the persons performing it:

1. As we are not to do evil that good may come of it, no more ought we to leave what is morally good undone for the evil that is some way mixed with it. Zeal for good is to be preferred to that which is against evil. The greatest good is better than the greatest evil is bad. Whatever good thing we do tends towards our union with the chiefest Good, the refraining of evil not so immediately.

2. Betwixt things indifferent and what is morally good, you have this difference: If there be any mixture of evil with the one, it becomes wholly evil; there is nothing of good in it to give stop or preponderate; but what is morally good will remain so still, though mixed with evil. We may allay the worth of it, as baser metals mixed with gold, but yet it is gold still, and may be perfectly severed.

3. ‘When I would do good,’ says the apostle, ‘evil is present with me.’ [Rom. 7:21] I cannot hear, or read or pray, and the rest, but with a mixture of sin; yet upon this account I may not cease from or neglect a known duty, not though materially considered the evil accompanying being greater than the good; as in meditation, when blasphemous thoughts arise, etc. To omit a known duty is a sin of wilfulness; the evil from me in it is but infirmity only; The least wilful sin is greater and more provoking than the greatest sin of infirmity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Case of Great &amp; Present Use</cite>, [Solemn League &amp;] Covenant &amp; Some of them [are] Supposed to be Scandalous in their Lives, Considered &amp; Affirmatively Resolved (1672; 1677), Consideration 2, pp. 8-10</span></figcaption>

</figure><figure class="quote" id="q-4ddeaf76d2" data-kw="">
<blockquote><p>It is well known, that in the last century Mr. Rouse’s and Mr. Barton’s versions of the Psalms were much in use and highly esteemed and recommended by many; several other versions were also in use; but the New England and the Scotch were sung by many congregations, much recommended, being preferred by them as the closest versions and most agreeable to the original. For it was then the concurrent judgement of the dissenting churches, that nothing ought to be sung in public worship, but those psalms, hymns, and spiritual songs which God has provided his Church with in his inspired Word. But of late years these versions have been much despised by some, and laid aside by many congregations which formerly used them; because of the roughness of the lines… and other versions, or rather paraphrases on the psalms are made use of by them. Many others use hymns of mere human composure as preferable to the inspired ones. But there are yet many serious Christians, and some churches, that adhere to the sentiments of our godly ancestors in preferring Scripture psalms, hymns and songs to any mere human composures, lest they should incur the guilt of bringing strange fire to God’s altar…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-pike.html">Samuel Pike</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Book of Psalms in Metre. Fitted to the Various Tunes in Common Use</cite>, … (London, 1751), ‘The Preface’, p. iii. Pike (1717?–1773) was an Independent minister in London, known for his work on cases of conscience. He argues for inspired Bible-song singing in the Preface.</span></figcaption>

— Samuel Pike, The Book of Psalms in Metre. Fitted to the Various Tunes in Common Use, … (London, 1751), ‘The Preface’, p. iii. Pike (1717?–1773) was an Independent minister in London, known for his work on cases of conscience. He argues for inspired Bible-song singing in the Preface.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+well+known%2C+that+in+the+last+century+Mr.+Rouse%E2%80%99s+and+Mr.+Barton%E2%80%99s+versions+of+the+Psalms+were+much+in+use+and+highly+esteemed+and+recommended+by+many%3B+several+other+versions+were+also+in+use%3B+but+the+New+England+and+the+Scotch+were+sung+by+many+congregations%2C+much+recommended%2C+being+preferred+by+them+as+the+closest+versions+and+most+agreeable+to+the+original.+For+it+was+then+the+concurrent+judgement+of+the+dissenting+churches%2C+that+nothing+ought+to+be+sung+in+public+worship%2C+but+those+psalms%2C+hymns%2C+and+spiritual+songs+which+God+has+provided+his+Church+with+in+his+inspired+Word.+But+of+late+years+these+versions+have+been+much+despised+by+some%2C+and+laid+aside+by+many+congregations+which+formerly+used+them%3B+because+of+the+roughness+of+the+lines%E2%80%A6+and+other+versions%2C+or+rather+paraphrases+on+the+psalms+are+made+use+of+by+them.+Many+others+use+hymns+of+mere+human+composure+as+preferable+to+the+inspired+ones.+But+there+are+yet+many+serious+Christians%2C+and+some+churches%2C+that+adhere+to+the+sentiments+of+our+godly+ancestors+in+preferring+Scripture+psalms%2C+hymns+and+songs+to+any+mere+human+composures%2C+lest+they+should+incur+the+guilt+of+bringing+strange+fire+to+God%E2%80%99s+altar%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Pike%2C+The+Book+of+Psalms+in+Metre.+Fitted+to+the+Various+Tunes+in+Common+Use%2C+%E2%80%A6+%28London%2C+1751%29%2C+%E2%80%98The+Preface%E2%80%99%2C+p.+iii.+Pike+%281717%3F%E2%80%931773%29+was+an+Independent+minister+in+London%2C+known+for+his+work+on+cases+of+conscience.+He+argues+for+inspired+Bible-song+singing+in+the+Preface.&amp;url=https

<blockquote><p>[399] But a great many Reformed theologians believed otherwise and answered the above question in the affirmative. In their opinion, the answer to Christ’s prayer (John 11:42; Heb. 5:7) and especially the entire state of exaltation from the resurrection to his coming again for judgment is a reward for the work that he accomplished as the Servant of the Lord in the days of his humiliation. And, given the teaching of Scripture, no other answer is possible. For over and over it presents the state of humiliation as the way and the means by which alone Christ can attain his exaltation (Isa. 53:10–12; Matt. 23:12; Luke 24:26; John 10:17; 17:4–5; Phil. 2:9; Heb. 2:10; 12:2). The preposition διο (therefore) in Philippians 2:9 refers not to the order and logic but specifically to the meritorious cause of the exaltation. Because Christ humbled himself so deeply, therefore God has so highly exalted him. Especially the Letter to the Hebrews repeatedly puts a heavy accent on this meritorious connection between Christ’s humiliation and exaltation (1:3; 2:9–10; 5:7–10; 10:12; 12:2). Christ himself was “sanctified” by suffering. This does not mean that he was consecrated to God or made morally perfect; it means “perfected, brought to full wisdom and maturity,” made τελειος, which consists in his now being crowned with honor and glory (2:9), being seated as high priest at the right hand of Majesty in the highest heaven (8:1), having attained the joy for which he endured the cross and despised the shame (12:2), and becoming the source of eternal salvation to all who obey him (5:9).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: Sin and Salvation in Christ</cite>, vol. 3, trans. John Bolt and John Vriend, (Grand Rapids: Baker Academic, 2006), 433–34.</span></figcaption>

<blockquote><p>Eternal life is rendered not as something due, or a wage, but as a gift.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-morton.html">Thomas Morton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antidote against Merit of Condignity</cite>, citing Basil</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>
<div class="actions"><button class="copy" data-copy="“Eternal life is rendered not as something due, or a wage, but as a gift.”

— Thomas Morton, Antidote against Merit of Condignity, citing Basil">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEternal+life+is+rendered+not+as+something+due%2C+or+a+wage%2C+but+as+a+gift.%E2%80%9D%0A%0A%E2%80%94+Thomas+Morton%2C+Antidote+against+Merit+of+Condignity%2C+citing+Basil&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9e6d01be9f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9e6d01be9f.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-6e68777508" data-kw="">
<blockquote><p>Controversy XIV: Do good works truly merit eternal salvation? Orthodox Position: No one can be saved without merits; but the root, source, and origin of these merits is Christ. Although God adorns and rewards our works, both in this life and the next, with the most abundant rewards, not only by His mercy but also by justice, due to the previous promise or covenant, however, speaking properly, we do not merit eternal life with them. [Romanist] Position of Bellarmine: Good works are properly meritorious, and this by merit of congruence or condign. The merit of congruence is in relation to moral works performed before justification. For these, by their nature, do not merit salvation, except concerning what is promised to them by God’s goodness. The merit of condign is that by which the reward is entirely due. And this is attributed to good works after justification. The works of the righteous merit eternal life by condign in two ways: first, in reason of the covenant or justice, which makes God our debtor; second, in reason of the intrinsic dignity of these works; for they are proportional to the reward in an arithmetical proportion, as seen in commutative justice. Confirmation of the Thesis: 1. God’s grace and our merit are contrary (Romans 4, 11). 2. Christ merited for us the beginning, middle, and end of salvation (John 2; Acts 3, 4). 3. Good works do not meet the conditions of proper merit, which are contained in this verse: Gratia, si non debes, est gratia. Good works are the fruits of the Holy Spirit, and for that reason, we owe them to God. There is no proportion between our works and eternal life, for here everything is perfect and infinite, there everything is imperfect, as admitted by Scotus and Durandus. 4. The Church Fathers teach this. Bernard says that our merits, that is, our works, are the way to the kingdom, not the cause of the kingdom. And Augustine: “In your justice, Lord, not in mine. Not because I deserved it, but because you had mercy.” And also: “All my hope is in the death of my Lord. His death is my merit, my life, and resurrection. My merit is the mercy of the Lord. I will not lack merit as long as the Lord of mercies does not lack me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio</cite>, (d. 1638) at Nosferatu’s Substack (2024)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><figure class="quote" id="q-ae28ff4efe" data-kw="">
<blockquote><p>For though it may be easy to object, that the reward was laid up with a view to their future merits, any person who will candidly examine the words must acknowledge that there is an implied commendation of the grace of God. Nay more, Christ does not simply invite believers to possess the kingdom, as if they had obtained it by their merits, but expressly says that it is bestowed on them as heirs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Matthew 25:34</span></figcaption>

</figure><figure class="quote" id="q-f4a613b9b6" data-kw="">
<blockquote><p>Thus good works please God, and are not without fruit to their authors, since, by way of recompense, they obtain more ample blessings from God, not because they so deserve, but because the divine benignity is pleased of itself to set this value upon them. Such, however is our malignity, that not contented with this liberality on the part of God, which bestows rewards on works that do not at all deserve them, we with profane ambition maintain that that which is entirely due to the divine munificence is paid to the merit of works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.15.3</span></figcaption>

<blockquote><p>I. Doctrine. The foundation whereupon our faith in Christ does stay, are the revelations sent of God to the godly, or the Church. For by this means were taught and instructed the shepherds, Simeon, Anna, Zacharias, Elizabeth and many other more inflamed with the Holy Ghost, which all confessed and testified that Jesus is the promised Messiah and Savior of our souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-hyperius.html">Andreas Hyperius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Preaching… (d. 1564; London: East, 1577)</cite>, p. 86</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8eeb831bbe" data-kw="">
<blockquote><p>For the three early centuries the Church was entirely without it. The members of the Church made a profession of their faith at baptism. But this was in the simplest form; it was not a precautionary assent to a variety of intellectual propositions, but a profession of service under a new Master, and of entrance into a new life. No deacon, no presbyter, no bishop, made any subsequent profession. The distinction between the requirements of belief from clergy and from laity was as yet wholly unknown. The first subscription to a series of dogmatical propositions as such, was that enforced by Constantine at the Council of Nicea. It was the natural but rude expedient of a half-educated soldier to enforce unanimity in the Church, as he had by the sword enforced it in the empire. It was accompanied then by the same casuistry, by the same ambiguity, by the same inoperative results as at present [in the Church of England]. At each [subsequent] council the same process was repeated by the bishops who were present. But the practice, as far as appears, never extended to the clergy generally or to the laity; and, as it was then in the Ancient Church, so on the whole has it been in those portions of Christendom which have clung most tenaciously to Catholic usages, and been most steadfast in the defence of Orthodoxy. The Roman Catholic clergy and the clergy of the Eastern Church neither formerly nor now are bound by any definite forms of subscription. The unity of the State is preserved everywhere, not by preliminary promises or oaths, but by the general laws of discipline and order, and by the general public sentiment of the whole community.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-p-stanley.html">Arthur P. Stanley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Letter to the Lord Bishop of London on the State of Subscription in the Church of England and in the University of Oxford (Oxford: Henry &amp; Parker, 1863)</cite>, pp. 35-36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-55464edf05" data-kw="">
<blockquote><p>A catechism is a brief doctrine, framed for youth and the ruder sort, containing in it the sum of the doctrine of the law and gospel, or of Christian religion… Catechumeni in the primitive Church, were those who learned the catechism: that is to say, such as were now of the Church, and were instructed in Christian doctrine… This catechising doctrine has ever been in the Church. For in the Old Testament God Himself in brief-wise delivered the doctrine of the Law and Gospel, the Decalogue and the promises, as when He says, ‘Walk before Me, and be thou perfect.’ Likewise, ‘In thy seed shall all nations of the earth be blessed.’ Now these things God would that Abraham and his posterity should teach their children, and their whole family: and therefore this doctrine was framed fit for the capacity of children, and the ruder sort… In the New Testament, in the apostles’ time, there was likewise a catechising doctrine: as the author of the epistle to the Hebrews reports [Heb. 6:1-2]: ‘Therefore, leaving the doctrine of the beginning of Christ, let us be led forward unto perfection, not laying again the foundation of repentance:’ that is the beginning of Christian doctrine, which comprehends repentance and faith. These first beginnings or principles of Christian doctrine are called in the same place the doctrine of baptisms, because they that were of some years before they came to Christ, were first instructed, before they were baptised. It is called also the doctrine of laying on of hands, because the catechism was required at their hands (that they should be able to answer in it) on whom hands were laid, that is to say, of the children of Christians, who were baptised in their infancy. The parts of these rudiments of Christian doctrine, which they call catechism, are the Law and the Gospel, or (as it is said in the place aforenamed unto the Hebrews) repentance and faith in Christ. Similarly the fathers also write brief sums of doctrine… Now it behoves that the youth be by and by instructed in this doctrine, and do know the foundation: 1. Because of the commandment of God, ‘Thou shalt tell them unto thy children.’… 3. Because we are to hold the foundation, upon which we may build…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of the Christian Religion… in his Lectures upon the Catechism... (d. 1583; Oxford: Barnes, 1587), 2 ‘How many things are necessary’, ‘Three parts of the study of divinity’</cite>, pp. 2-4</span></figcaption>

<blockquote><p>The 1868 Old School Assembly declared that the New School pronouncement of ‘true doctrines’ in the 1837 Auburn Declaration ’embrace all the fundamentals of the Calvinistic creed.’ The New School version of Calvinism was vindicated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-donald-fortson-iii.html">S. Donald Fortson III</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘New School Calvinism &amp; the Presbyterian Creed’ in The Journal of Presbyterian History (1997-), vol. 82, no. 4 (Winter 2004), pp. 221-43</cite>, p. 238</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-3e453359e8" data-kw="">
<blockquote><p>Wherefore we suffer not ourselves, in controversies about religion, or matters of faith, to be pressed with the bare testimonies of Fathers, or Decrees of Councils; much less with received customs, or with the multitude of men being of one judgment, or with prescription of long time. Therefore, in controversies of religion, or matters of faith, we cannot admit any other judge than God himself, pronouncing by the holy Scriptures, what is true, what is false, what is to be followed, or what to be avoided.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, 1566, ch. 2</span></figcaption>

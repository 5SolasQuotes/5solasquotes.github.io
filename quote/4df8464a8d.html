<main class="wrap"><figure class="quote" id="q-4df8464a8d" data-kw="">
<blockquote><p>Accordingly, although it excludes a necessity that is intrinsic from nature, and extrinsic from compulsion, yet it does not exclude a necessity of dependence, infallibility, and divine predetermination, for it would become independent, to this extent at least, and thus, God.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-40d2bfc068" data-kw="">
<blockquote><p>Man, by making bad use of free will, destroyed both himself and it. For just as he who kills himself, does not live by killing himself, nor can he resuscitate himself when he has killed himself: so, when sin was committed by a free will, with sin being the victor, free will also was lost. For by whom a man is overcome, to this one also is he addicted as a servant: whence he will not be free for doing justly, unless, being freed from sin, he has begun to be a servant of justice. But from where will this liberty be for a man who is addicted and sold, unless He redeem him, whose is that voice: ‘If the Son shall make you free, you shall be free indeed.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in Barthold Holtzfus, ‘Theological Dissertation on the Free Will of Man’ trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), ch. 2, sect. 9, pp. 23-24 Latin | Enchiridion to Laurentius, ch. 30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-5a93869256" data-kw="">
<blockquote><p>XXII. The subject in which it [original sin] resides is not only the lower faculties, namely of sensing and appetition, nor only the superior faculties, namely of understanding and willing, but the whole man, both soul and body, with all their powers. Besides experience, these passages testify: Gen. 6:5; Jer. 17:9; 1 Cor. 2:14; Eph. 4:17-18; Rom. 6:12-13, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-tronchin.html">Theodore Tronchin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on Original Sin</cite>, trans. AI (Geneva: de la Planche, 1625), pp. 6-7 Tronchin (1582-1657) was a professor of Hebrew and theology at Geneva.</span></figcaption>

— Barthold Holtzfuz, ch. 2, sect. 6-8 in ‘Theological Dissertation on the Free Will of Man’ trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), pp. 21-23 Latin, p. 23">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A7VIII%E2%80%A6+8.+And+this+defect+of+free+will+in+spiritual+matters+was+acknowledged+by+the+Council+of+Arausica+%5BOrange%5D+II%2C+chs.+5-7+and+9%3B+nor+does+the+Council+of+Trent+deny+it%2C+session+6%2C+canon+3.%E2%80%9D%0A%0A%E2%80%94+Barthold+Holtzfuz%2C+ch.+2%2C+sect.+6-8+in+%E2%80%98Theological+Dissertation+on+the+Free+Will+of+Man%E2%80%99+trans.+AI+by+Nosferatu+%28Frankfurt%3A+Zeitler%2C+1707%29%2C+pp.+21-23+Latin%2C+p.+23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F67db852e35.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/67db852e35.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/calvinism/total-depravity/#:~:text=8.%20And%20this%20defect%20of%20free,deny%20it%2C%20session%206%2C%20canon%203&amp;text=8.%20And%20this%20defect%20of%20free%20will%20in&amp;text=of%20Trent%20deny%20it%2C%20session%206%2C%20canon%203" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e7d5eaa632" data-kw="">
<blockquote><p>What makes it the case that I do in fact act or refrain from acting on the reasons in question? Doesn’t a choice to act require a cause, and if the act is to be a free and thus self-determined one, doesn’t that entail that the cause must be some further choice on my part? If that is the case, doesn’t that further choice itself require yet another choice as a cause, and so on ad infinitum? The answer is that this does not follow. Just as the will’s ultimate ends in the order of final causes are simply given rather than pursued for the sake of yet further ends, so too its ultimate acts in the order of efficient causes can bring about effects (such as bodily movements) without themselves being caused. The will is in this sense an uncaused cause or unmoved mover.† † …as Cuypers goes on to note, this is consistent with holding that the will is ultimately moved by God, just as, for the Thomist, everything other than God ultimately exists and acts at any moment only insofar as God conserves it in being and concurs with its causal activity. If we acccept this theological picture (as I happen to), the will would count as an unmoved mover only in a relative sense, with God alone being an unmoved mover in an absolute sense… In my view, how divine causality related to the will is in any event more a question about the nature of divine causality than it is a question about the nature of the will. This does not entail that its operation is random, either in the snese of being an exception to the principle of causality or in the sense of being unintelligible or devoid of explanation. It is not an exception to the principle of causality, because events require causes insofar as they contain some passive potentiality that requires actualization… The exertion of the will by contrast, is entirely active rather than passive. It is a bringing about that is not itself brought about by anything else. Yet it is not unintelligible or devoid of explanation, because it is done for a reason–in particular, for the sake of the end grasped by the intellect–and something done for a reason is the opposite of unintelligible. Hence the defender of agent-causal free will [which Aquinas’s view more or less fits into] is not stuck with the dilemma of having to posit either ‘an infinite regress or a nonrational flip-flop.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature Ref</cite>, (Editiones Scholastica, 2024), ch. 4, ‘The Will’ Feser is an Anyltical Thomist, writing in the Thomist tradition. What is said below is consistent with divine, physical predetermination., pp. 169-70</span></figcaption>

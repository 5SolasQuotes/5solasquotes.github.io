<blockquote><p>Yea, he had power over the angel, and prevailed: he wept, and made supplication unto him: he found him in Bethel, and there he spake with us;

He; your famous progenitor of whom you boast. Had power; behaved himself as a prince with God, Genesis 32:28. Over; with: the angel was willing to be conquered, or Jacob could not have gotten the victory. The angel; called God, Hosea 12:3, and, Hosea 12:5, is Jehovah, Lord of hosts. He was no created angel, but the uncreated Angel Christ, the Messiah, eternal God by nature and essence, angel by office and voluntary undertaking.

And prevailed; got the victory, went out of the field a conqueror, but not by such arms and methods as you use. You are conquered by man because of your sins, he conquered with God by faith and prayer. He, not the angel, as some through mistake, but your father Jacob, wept: by this we know he prayed with tears, though the story say not so, with sense of his own unworthiness, with earnestness for the mercy he desired, and apprehensive of the majesty of him with whom he wrestled. But you, quite contrary, proud as if worthy, regardless of the best part of the blessing, and earnest only for the meaner part, seek it not of God, but idols.

And made supplication unto him: it is Christ who is here intended; it was no mere creature, Jacob might not have prayed to such, but it was the Creator of angels and the Redeemer of man, the blessed Jesus, to whom every knee ought to bow, Philippians 2:10.

He, God, found him, Jacob, full of weariness, fears, and solicitude on his journey to Laban, Genesis 28:12,20, when prayers obtained a blessing; but with this, and more directly, when on his return after this wrestling bout, Genesis 35:1, &amp;c., God appeared to him, Genesis 35:7-15, and blessed him. Bethel; formerly called Luz, but by Jacob new named and called Bethel, Genesis 28:19.

There he, God, spake, renewed his promise and confirmed the blessing, with us: by the current of the words in their grammatical order it should be, he spake to him; but it is, not without good reason, changed to the plural first person, us, as posterity were in Jacob’s loins, and blessed with him. Yet more, where God appeared to Jacob he commanded him to build an altar there to God, to restore religion and reform his family from idolatry, which he did, Genesis 35:4. But you, children of this Jacob by natural descent, are of another and far different humour; though you have been called and exhorted to leave your idols, yet these two hundred years you have kept them, and will, I see, keep them: this is your sin, and in it you are obstinate, and I will punish such a Jacob as you.

Even the LORD God of hosts; the LORD is his memorial.

Even, or and, he that appeared and spake, who promised the blessing, and commanded the reformation at Beth-el, was the Lord, Jehovah, the eternal and unchangeable God, who still promiseth with like commands. God of hosts; who can both perform his promise and execute his threat, who is a most terrible enemy and most desirable friend, all being to us as he is. The Lord, Jehovah, repeated for confirmation, is his memorial; by this he will be known, by this name, by such methods of his sovereignty and grace, Exodus 3:15.

Therefore turn thou to thy God: keep mercy and judgment, and wait on thy God continually.

Therefore; no more vainly boast of Jacob; but, as he, do you approve yourselves to God. Turn thou to thy God; repent, leave idols, and all sins. He worshipped God alone, do you so; he cast idols out of his family, do you so too, be Jacob’s children herein. Keep mercy; show kindness to all who need it, cast off cruelty and inhumanity, and be merciful to the afflicted: this contains all the duties we owe to any that are in straits.

And judgment; wrong none, but with justice in dealings, in judicatures, and public offices, render to every one their due. Acquit the innocent, and condemn the guilty, and let none have just cause to complain of injuries. Wait on thy God; in public worship, and private duties of prayer, and seeking God, him only serve and, trust, let not idols have either sacrifice, prayer, praise, or trust from you.

Continually: and let your hope and worship be perpetuated, for ever continued towards God, till he save and rescue; trust, pray, and resign yourselves to him, who will be yours as he was Jacob’s God, on these terms and no other. This short phrase, wait on they God, includes all duties of the first table of the law, all religions worship of the true God; do this, and the Lord will be to you. as to Jacob, defence against danger and fullness in your wants.</p></blockquote>

<blockquote><p>This argument proves that veneration is not due to the images, as to books of the Trinity, because that the veneration of the image is an honoring of God, there must be a union betwixt the images and God or Christ, betwixt the tree and Christ [in the case of a crucifix]. 1. There is no union-lawful that can be a warrant of honoring anything but a union warranted of God, [to give false examples] betwixt crossing in the air and dedication to Christ’s service, betwixt surplice and pastoral sanctity; There is no union, nor is there a personal union betwixt Christ and the image: Nor 2. a union of parts, as betwixt the shoulders and the head. Nor 3. is there a divine relative union, as betwixt the mean or the end, the servant or the lord: for as John White says well [a puritan, d. 1648], and the Scripture proves, all union betwixt God and the means of worship, which are to be reverenced as means of worship in relation to God, is by divine institution (Mt. 10:14, 42; 2 Cor. 8:4; Gal. 4:14; Acts 10:34; Ps. 119:97, 159, 147, 82, 103, 111, 113, 114, 120, 127, 128, 140, 143, 167, 174); now certainly if by divine ordination there had been a union betwixt the image and God, then had it been lawful to lay the image in the heart, to say: ‘How love I thy image? The painted pictures and wooden portraits of Christ, the wood of the cross are my delight’, ‘I hope in the wood,’ ‘I have taken images for my heritage, they are sweeter to me, nor the honey or the honey comb,’ ‘How pleasant are the wooden feet of these dead and senseless ambassadors of Christ, who bring to my soul news of God, or of my Redeemer Jesus.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-cefd8913c0" data-kw="">
<blockquote><p>4. Although political Cunning is to be acknowledged in established Paganism and Mohammadanism, it is impossible for true Christianity to owe its origin to the deceits of Politicians: for nothing is more adverse to the pride of impious Politicians, desiring to govern all things according to their pleasure, than that precept in Acts 5:29, Πειθαρχεῖν δεῖ Θεῷ μᾶλλον ἢ ἀνθρώποις, we ought to obey God rather than men, and in Luke 12:4, 5, λέγω δὲ ὑμῖν τοῖς φίλοις μου, Μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων τὸ σῶμα, καὶ μετὰ ταῦτα μὴ ἐχόντων περισσότερόν τι ποιῆσαι. Ὑποδείξω δὲ ὑμῖν τίνα φοβηθῆτε· φοβήθητε τὸν μετὰ τὸ ἀποκτεῖναι ἐξουσίαν ἔχοντα ἐμβαλεῖν εἰς τὴν γέενναν· ναί, λέγω ὑμῖν, τοῦτον φοβήθητε, And I say unto you my friends, Be not afraid of them that kill the body, and after that have no more that they can do: But I will forewarn you whom ye shall fear: Fear Him, which after He hath killed hath power to cast into hell; yea, I say unto you, Fear Him.

Indeed, unless this Religion came from God Himself, truly Existing, it would have been exterminated a long time ago by the power of Politicians, frequently persecuting and being eager to annihilate Christians: which is the pious observation, suited to our use, of the Eminent NIEUWENTYT, Cosmotheoria, chapter XXI, § 43, pages 490, 491. 5. The opinion of Hobbes, insofar as he traces the Worship and veneration of God from the fear of a superior Power only, is exceedingly injurious to God, inasmuch as he, depriving Him of the natural right of requiring worship, and actually turning it into Tyranny, also destroys the true character of Religion, which men, only when compelled by force and fear, will observe; indeed which they will easily abjure again, thinking that God according to His own right is able to punish even His pious worshippers, indeed actually to dispense evils to good men: see VAN DE WYNPERSSE, in his Dissertatione de Libertinismo, pages 32-35.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 11, p. 106.</span></figcaption>

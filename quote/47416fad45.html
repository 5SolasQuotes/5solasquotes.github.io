</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5f100654c4" data-kw="">
<blockquote><p>…notwithstanding the reformation of religion, Christ may be pleased rather to live abroad in the fields than at home, where the people would willingly assemble: The house of God was now repaired, and the bed green: and the Church invites Christ to come in unto her, in it, yet He disposes Himself so, as more willing to call her abroad. So we may see that notwithstanding the purity and simplicity of Christ’s worship, yet Christ is not bound to any place; if things were never so reformed, yet He might leave us, and go into the wild field.</p></blockquote>

</figure><figure class="quote" id="q-968ee9543b" data-kw="">
<blockquote><p>Any positives not warranted by some special word of God shall be additions to the Word of God: But these are expressly forbidden, Dt. 4:2; 12:32; Prov. 30:6; Rev. 22:18-19. To this Formalists [Anglicans, etc.] answer: 1. They have a general commandment of God, though not a special. Answer: So have all the unwritten traditions of Papists; hear the Church, she is Magistra fidei [Teacher of the Faith]; so does the Papist Horantius answer Calvin, that the Spirit of God has given a general and universal knowledge of mysteries of Faith and ceremonies belonging to religion, but many particulars are to be received by tradition from the Church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646) Westminster divine | Introduction, section 4, pp. 51-2</span></figcaption>

</figure><figure class="quote" id="q-630b9d1cd4" data-kw="">
<blockquote><p>[Error:] To cry down the very being and use of these external ordinances as being but forms, and the spiritual frame of the heart is made all in all. Thus there are blasphemous heretics that cry down the sacraments, the ministry, yea, the Scripture itself, yea Christ Himself, as being but forms, and we ought to have communion with God immediately. But it is elsewhere to be showed that Christ has appointed an external form of communion in his Church, which consists in reading, and preaching of the Word, administration and receiving of sacraments, prayer, and Church-government and censures, with a ministry from Him, all which are of a perpetual institution for the substantials of them, and to cry down these forms which God has appointed as means to beget and increase grace, which are in the gracious use of them a solemn acknowledging and owning of God, is a Beelzebub error as I may so say and a false doctrine in the first magnitude: we are therefore to sail between these extremes neither resting upon externals in religion, as enough without Christ and regeneration, or on the contrary abolishing and neglecting the use of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, … (London, 1652), section 3, sermon 19, p. 105</span></figcaption>

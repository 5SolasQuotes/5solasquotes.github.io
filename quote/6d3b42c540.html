<main class="wrap"><figure class="quote" id="q-6d3b42c540" data-kw="">
<blockquote><p>7. We take it that the 15th Proposition contains the true mean between the usurped power of some pastors to bind the people, by a known erring sentence, to go against God’s Word; and the usurped power which many pretend to, of ruling the Church by their major vote. But how far the congregation should first have cognisance of the matter, or be heard in the debate; or how far the ministers must endeavor their consent, or suspend their own actions for want of their consent, we do not determine. And therefore all moderate presbyterians and Independents may well agree with us in this; because it’s no power that we deny the pastors, but a power of binding men to go against God’s Word; and it is not any of their liberty that we deny the people, but only ruling ministerial authority, which God never gave them, we must needs deny them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653) | An Explication of Some Passages in the Propositions, p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5111f482c3" data-kw="">
<blockquote><p>The Law of Nature, as it is impressed upon our hearts, so in the goodness of God, it is expressed in his Word, wherein He has not only holden forth these Sacred Mysteries, which could only be known by Revelation, as having no principles in Nature from whence they are deducible, but also, because through sin and evil custom, the Natural Law in man’s heart was much defaced, disordered and erroneously deduced: He has therefore reprinted the Law of Nature in a viver [more vivid and lively] character, in the Scripture, not only having the moral principles, but many conclusions thence flowing particularly set forth. This analogy of the Law of Nature even in the heats of heathens and as it is set down in the Law of God evidences sufficiently, that both of them proceed from the same Omniscient Author.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/viscount-of-stair-james-dalrymple.html">James Dalrymple</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Institutions of the Law of Scotland</cite>, vol. 1, p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Law of Nature, as it is impressed upon our hearts, so in the goodness of God, it is expressed in his Word, wherein He has not only holden forth these Sacred Mysteries, which could only be known by Revelation, as having no principles in Nature from whence they are deducible, but also, because through sin and evil custom, the Natural Law in man’s heart was much defaced, disordered and erroneously deduced: He has therefore reprinted the Law of Nature in a viver [more vivid and lively] character, in the Scripture, not only having the moral principles, but many conclusions thence flowing particularly set forth. This analogy of the Law of Nature even in the heats of heathens and as it is set down in the Law of God evidences sufficiently, that both of them proceed from the same Omniscient Author.”

</figure><figure class="quote" id="q-c42b46fc70" data-kw="">
<blockquote><p>The officers that rule the world in God’s stead, as father mother, master, husband, lord and prince, are honoured, when the law, which Almighty God has committed unto them to rule with, is obeyed. Thy neighbour that is out of office is honored, when thou (as God has commanded thee) lovest Him as thyself, countest him as good as thyself, thinkest him as worthy of any thing as thyself, and comest lovingly to help him at all his need, as thou wouldest be holp thyself; because God hath made him like unto his own image, as well as thee, and Christ hath bought him as well as thee. If I hate the law, so I break it in mine heart; and both hate and dishonour God, the maker thereof. If I break it outwardly, then I dishonour God before the world, and the officer that ministers it. If I hurt my neighbour, then I dishonor my neighbor and Him that made him, and him also that bought him with his blood… If I be not ready to help my neighbor at his need, so I take his due honour from him, and dishonour him, and him that made him, and Him also that bought him with his blood, whose servant he is… In like manner, if the officer, abusing his power, compel the subject to do that which God forbiddeth, or to leave undone that which God commandeth, so he dishonoureth God in withdrawing his servant from him, and maketh an idol of his own lusts, in that he honoureth them above God; and he dishonoureth his brother in that he abuseth him, contrary unto the right use which God hath created him for, and Christ hath bought him for, which is to wait on God’s commandments. For if the officer be otherwise minded than this, the worst of these subjects is made by the hands of Him that made me, and bought with the blood of Him that bought me, and therefore, my brother; and I but his servant only, to defend him, and to keep him in the honour that God and Christ has set him, that no man dishonors him: he dishonours both God and man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Sir Thomas More’s Dialogue, the Supper of the Lord</cite>, … (d. c. 1536; Cambridge: Parker Society, 1850), pp. 56-57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-75d589fef3" data-kw="">
<blockquote><p>The improper binder [of the conscience] is that which has no power or virtue in itself to bind conscience: but does it only by virtue of God’s Word or of some part of it. It is threefold: human laws, an oath, a promise.</p></blockquote>

<blockquote><p>Whatever is committed against right reason, the same is committed against God and divine law (Rom. 2:12, 14–15), insofar as the law of God made known through nature is identical with the law which is published by a living voice or writing, for which reason the law of nature once obligated our first parents to obedience in the state of integrity.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-638a1c48a3" data-kw="">
<blockquote><p>Nothing can truly be said to appertain to the priesthood of Aaron so far forth as it is abolished, but that which is used with such like superstition as if it were now (after Christ revealed) needful to salvation, or profitable of itself, or whereby some occasion is given to a man to assume or to retain this superstition with himself, or of troubling the peace and quiet of brethren; Bucer, Script. Anglican, fol. 707, to [John] Hooper.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>John Sprint, assander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623), ‘Reformed Practices’, p. 179</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-65efbc49b5" data-kw="">
<blockquote><p>As for the veils wherewith the apostle would have women covered whileas they were praying (that is in their hearts following the public and common prayer) or prophesying (that is singing, 1 Sam. 10:10; 1 Chron. 25:1) they are worthy to be covered with shame as with a garment, who allege this example for sacred significant ceremonies of human institution. This covering was a moral sign, for that comely and orderly distinction of men and women which civil decency required in all their meetings: wherefore, that distinction of habits [garments], which they used for decency and comliness in their common behavior and conversation, the apostle will have them, for the same decency and comeliness still to retain in their holy assemblies. And further the apostle shows, that it is also a natural sign, and that nature itself teaches it: therefore he urges it both by the inferiority or subjection of the woman vv. 3. 8-9 (For covering was then a sign of subjection) and by the long hair which nature gives to a woman v. 15. Where he would have the artificial covering, to be fashioned in imitation of the natural. What need we anymore? Let us see nature’s institution, or the apostles’ recommendation for the controverted ceremonies (as we have seen them for women’s veils) and we yield the argument. Last of all, the sign of imposition of hands, helps not the cause of our Opposites, because it the example of Christ, and the apostles, and their disciples, which our ceremonies have not: yet we think not imposition of hands to be any sacred or mystical sign, but only a moral, for designation of a person: let them who think more highly or honorably of it, look to their warrants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, 3, ch. 5, pp. 90-91</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-8af35392ec" data-kw="">
<blockquote><p>And here, that we may not be drawn aside by the prevalence of vulgar error, it should be understood that ceremonies are not, therefore, unlawful, because they are significant. For the holy kiss, respecting which mention is made in Rom. 16:16, was a sign by which they wished to signify the fraternal love and union of all Christians. And even the learned Peter Martyr, is so far from rejecting ceremonies because they are significant, that he says, ‘they are the more laudable, if, in the way of sermons, they admonish us of some duty.’ (on 1 Cor. 11)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Determinations</cite>, tr. Josiah Allport (1634; 1846), Determination 20, ‘The English Church is fully competent to bind to the observance of ceremonies’, p. 331 bound at the end of John Davenant, A Treatise on Justification, or the Disputatio de Justitia... trans. Josiah Allport (1631; London, 1846), vol. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-832f706667" data-kw="">
<blockquote><p>The Catalogue of the Errors, Heresies, Blasphemies, is as follows: … 140. This has been lately practiced in London among some of the Sectaries, that love-feasts, or feasts of love (with which the Lord’s Supper is to be administered also) is a perpetual ordinance of Christ, at which only Church-members are to be present, and to partake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First &amp; Second Part of Gangræna</cite>, (London, 1646), pp. 15, 27</span></figcaption>

</figure><figure class="quote" id="q-d6816a2724" data-kw="">
<blockquote><p>The gross impiety of which they had been accused was now well refuted; and yet they seem not to have been in every respect free from blame, because the Law forbids the erection of any kind of statues. It is easy, however, to excuse this by saying, that no kind of statues are condemned except those which are intended to represent God. To erect a heap of stones as a trophy, or in testimony of a miracle, or a memorial of some signal favor of God, the Law has nowhere prohibited. (Exodus 20:4; Leviticus 26:1; Deuteronomy 5:8) Otherwise, Joshua and many holy judges and kings after him, would have defiled themselves by profane innovation. But the only thing displeasing to God was to see the minds of men drawn hither and thither, so as to worship him in a gross and earthly manner. The children of Reuben, Gad, and Manasseh do all that is required for their exculpation, when they declare that they would use the altar only as a bond of brotherly union; and add a sufficient reason…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Joshua</cite>, 22 | v. 26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>[A]nd so it is generally, that when the false Prophet doth arise among the People of God, it is because of God’s people that are the cause of it: and it is they that do set them up, and maintain them, and would have pillows laid under their elbows: and why is it so? why (my Brethren) even since it was that Eve did hearken to the voice of the Serpent: And also the children of God are much given to novelties; these are things that they never heard of before: and if they may have these and those things spoken which they never heard of before, this is all many care for, though they are such things as came not out of the mouth of God: yet because they are new things, and that please their humours, therefore they affect them: thus the Apostle Paul, one would think an Apostle good enough; yet there were many that were unsatisfied with him, as in the Epistle to the Galatians we read, &amp; bewitched with the false Teachers; these give us (say they) the Gospel in this and that way, &amp;c. however they did once look at the Apostle Paul as an Angel of God, even as Christ Jesus: but now the case was altered: and now Paul was no body: and come of him what would, he might starve for all them: they were carried away after those that vented their new things.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ade22ca82" data-kw="">
<blockquote><p>Where persons do cherish secret predominant lusts in their hearts and lives, God is not in their thoughts as he ought to be. He may be, he often is, much in the words of such persons, but in their thoughts he is not, he cannot be, in a due manner. And such persons no doubt there are. Ever and anon we hear of one and another whose secret lusts break forth into a discovery. They flatter themselves for a season, but God ofttimes so orders things in his holy providence that their iniquity shall be found out to be hateful. Some hateful lust discovers itself to be predominant in them: one is drunken, another unclean, a third an oppressor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The grace and duty of being spiritually minded declared and practically improved</cite>, (London, 1681) in W. H. Goold (ed.), The works of John Owen (16 vols, Edinburgh, 1965), vii, 357.</span></figcaption>

</figure><figure class="quote" id="q-1135cadf87" data-kw="">
<blockquote><p>Not but that a Christian ought prudentially to clear himself from slanders. When the apostle Paul was charged to be mad he vindicated himself. ‘I am not mad, most noble Festus’ (Acts 26:25). Though a Christian’s retorts must not be vulnerating [wounding], they may be vindicating. Though he may not scandalise another, yet he may apologise for himself.

There must be Christian prudence, as well as Christian meekness. It is not mildness but weakness to part with our integrity (Job 27:6). To be silent when we are slanderously traduced, is to make ourselves appear guilty. We must so affect meekness as not to lose the honour of innocence. It is lawful to be our own defenders. The fault lies only in this when we retort injuries with reproachful terms, which is to pay a man back in the devil’s coin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beatitudes: An Exposition of Matthew 5:1-12</cite>, (1660; Edinburgh: Banner of Truth, 1971), p. 110.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-f0182f7c69" data-kw="">
<blockquote><p>Nobody should trust in his zeal for religious matters to the extent of believing that good intentions will automatically lead to right actions. Unless our zeal is controlled by the Word of God it will do more harm than good. The person who is addicted to superstitions and false doctrine will be a determined enemy of the truth and will probably turn out to be a fierce persecutor of those who worship it. That kind of zeal derives from an excessive devotion to ancestral traditions.

It is characteristic of such traditions of people that they invent a different God from the one who really exists but who appears to be close enough to ours that he takes pleasure in the things that we glorify. Before long, mixed forms of worship appear that are defended on the ground of their antiquity, the example of the masses and above all on the authority of their ancestors, which is sacrosanct for many and from which it would be wrong to depart. If they see other people who think and believe differently, they start to hate them and think that they should not be allowed to do anything, because they are considered to be enemies of religion and very dangerous people.

Furthermore, as Christ predicted, they think that they are better worshipers of God if they persecute such people and torture them with all kinds of torments. Paul provides us with an example of this because his zeal drove him to persecute the church. He took godly worshipers of both sexes to prison and forced them to deny their faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 37.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

ted+in+Gerald+L.+Bray%2C+Timothy+F.+George%2C+Scott+M.+Manetsch+%28eds%29%2C+Reformation+Commentary+on+Scripture+X%3A+Galatians%2C+Ephesians+%28Downers+Grove+IL%3A+IVP+Academic%2C+2011%29%2C+p.+37.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff0182f7c69.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f0182f7c69.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/11/05/rudolf-gwalther-on-dangerous-zeal/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-fd4f2691ea" data-kw="">
<blockquote><p>For the preaching of error is like the selling of poisoned pestied [sic] bread, that slays the eater of it, and infects with the breath every man that comes near hand; and albeit the Lord hath brought in wholesome food in his house, and lies held his table long covered, yet the malice of Satan, and the business of the Pope to recover his kingdom, and the dalliance of worldly men, lies set instruments on foot to trouble our Church again; and God, in his deep wisdom and justice, has suffered, the matter to go that far on, that we might see what a fearful sin it was to put the keys of the house of God in wrong hands, and what evil freicks [sic], errors in discipline would bring forth, and also that he might punish the unsanctified and proud wits of men that would take upon them to govern his Kirk, as also he would have these ministers in this land corrected for their negligence who are like the rest of the country, who thinks of arms whilst they are in peace. So have we done. In time of peace we were all secure, and dreamed not of straits, and studied for no more but to get any sermon in the week; yet blessed be our God, who has also many painful and faithful servants as will be sufficient to clear his truth of his Kirk against all that will say the contrary.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“For the preaching of error is like the selling of poisoned pestied [sic] bread, that slays the eater of it, and infects with the breath every man that comes near hand; and albeit the Lord hath brought in wholesome food in his house, and lies held his table long covered, yet the malice of Satan, and the business of the Pope to recover his kingdom, and the dalliance of worldly men, lies set instruments on foot to trouble our Church again; and God, in his deep wisdom and justice, has suffered, the matter to go that far on, that we might see what a fearful sin it was to put the keys of the house of God in wrong hands, and what evil freicks [sic], errors in discipline would bring forth, and also that he might punish the unsanctified and proud wits of men that would take upon them to govern his Kirk, as also he would have these ministers in this land corrected for their negligence who are like the rest of the country, who thinks of arms whilst they are in peace. So have we done. In time of peace we were all secure, and dreamed not of straits, and studied for no more but to get any sermon in the week; yet blessed be our God, who has also many painful and faithful servants as will be sufficient to clear his truth of his Kirk against all that will say the contrary.”

— David Dickson, Arminianism Discussed. Address to the General Assembly of 1638 in Select Biographies. Edited for the Wodrow Society, Chiefly from Manuscripts in the Library of the Faculty of Advocates">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+the+preaching+of+error+is+like+the+selling+of+poisoned+pestied+%5Bsic%5D+bread%2C+that+slays+the+eater+of+it%2C+and+infects+with+the+breath+every+man+that+comes+near+hand%3B+and+albeit+the+Lord+hath+brought+in+wholesome+food+in+his+house%2C+and+lies+held+his+table+long+covered%2C+yet+the+malice+of+Satan%2C+and+the+business+of+the+Pope+to+recover+his+kingdom%2C+and+the+dalliance+of+worldly+men%2C+lies+set+instruments+on+foot+to+trouble+our+Church+again%3B+and+God%2C+in+his+deep+wisdom+and+justice%2C+has+suffered%2C+the+matter+to+go+that+far+on%2C+that+we+might+see+what+a+fearful+sin+it+was+to+put+the+keys+of+the+house+of+God+in+wrong+hands%2C+and+what+evil+freicks+%5Bsic%5D%2C+errors+in+discipline+would+bring+forth%2C+and+also+that+he+might+punish+the+unsanctified+and+proud+wits+of+men+that+would+take+upon+them+to+govern+his+Kirk%2C+as+also+he+would+have+these+ministers+in+this+land+corrected+for+their+negligence+who+are+like+the+rest+of+the+country%2C+who+thinks+of+arms+whilst+they+are+in+peace.+So+have+we+done.+In+time+of+peace+we+were+all+secure%2C+and+dreamed+not+of+straits%2C+and+studied+for+no+more+but+to+get+any+sermon+in+the+week%3B+yet+blessed+be+our+God%2C+who+has+also+many+painful+and+faithful+servants+as+will+be+sufficient+to+clear+his+truth+of+his+Kirk+against+all+that+will+say+the+contrary.%E2%80%9D%0A%0A%E2%80%94+David+Dickson%2C+Arminianism+Discussed.+Address+to+the+General+Assembly+of+1638+in+Select+Biographies.+Edited+for+the+Wodrow+Society%2C+Chiefly+from+Manuscripts+in+the+Library+of+the+Faculty+of+Advocates&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffd4f2691ea.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/

<main class="wrap"><figure class="quote" id="q-5a9ff143d4" data-kw="">
<blockquote><p>Again, when Christ speaks of being lifted up, that he might draw all men unto him, it implies that there was a fitness in this for compassing the design, or that his crucifixion was the most apt, powerful, and effective means for producing such a result, as the drawing of men to him. Wonderful as the goodness was which distinguished his course on earth, and bright as were the rays of glory which shone around his whole career, he still made little progress in winning the hearts of men. Knowing, as he well did, the hardness and obstinacy of these hearts, he knew it was not enough—that something must yet be done much more fitted to attract and move; but it shall be done, says he, when I am lifted up. When I have been bruised to death on the accursed tree, then other effects shall begin to flow, the glory of the Lord shall be seen to shine from me with surpassing brightness, and even the hardest hearts shall be melted and subdued.

This entirely accords with all Christ’s dealings towards men, whom he ever treats as rational and thinking creatures; not as machines that are simply to be impelled by the strong hand of power, but as possessed of wills that are to be consulted, influenced, persuaded; and so requiring to be addressed by arguments or motives fitted to produce the desired result. And such means, whatever the result may be toward which they are directed, being chosen by infinite wisdom, are always the very best that could be selected or devised. If this be the case generally, especially must it be so here, where his grandest work lies, and his highest glory is concerned.

The end here is, to have sinners drawn to him with the cords of love, and united in an everlasting fellowship of peace and blessing; and the chosen means for attaining it is, the exhibition of a crucified Redeemer, lifted up and dying for sinners on a malefactor’s cross. Where, we may well exclaim, could any thing be found so well adapted for such a purpose? What could even be conceived more admirably fitted to reach the inmost feelings of the heart, and move it out of all the thoughts and devices which naturally tend to keep it in alienation from the life of God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-fairbairn.html">Patrick Fairbairn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ on the Cross Drawing all Men to Him in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3d90ee188b" data-kw="">
<blockquote><p>…there remains a necessary distinction to be attended unto of God’s call, that it is twofold: either external only, or external and internal also; or an effectual and ineffectual calling. For though this distinction be hated by some men, yet the Scripture is very clear that there are many called, who yet are not chosen: and when he says called, it is not meant only actively on God’s part, as some were called, but yet refused and would not so much as outwardly profess obedience, but ‘called’ is to be understood passively on man’s part, so that he gives some outward conformity to Gods call. There is an external reception and submission to it, but yet there is no true inward sanctification: Insomuch that some who are called the children of the Kingdom shall be cast forth; and they are said not to be all Israel who are of Israel. In the Old Testament we read of many who outwardly submitted to the profession of God’s commands, who yet were not found at heart; and therefore our Savior in the course of his ministry did not direct his preaching more to any subject almost than this, viz. to have the internals of grace as well as externals; so that we may say, There is a called and elected Church, and a called Church only, not elected; and this is to take off all Churches from idolizing and doting upon the ordinances and external administrations which are in a Church, as the Jews did, and as most Christians do. We are to go further and to see whether we be indeed and really Christ’s body, as well as seemingly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Expository Comment, Doctrinal, Controversial &amp; Practical upon the Whole First Chapter to the Second Epistle of St. Paul to the Corinthians</cite>, (London: A.M., 1661), sermon 13, p. 54</span></figcaption>

<blockquote><p>CANON 6. If anyone says that God has mercy upon us when, apart from his grace, we believe, will, desire, strive, labor, pray, watch, study, seek, ask, or knock, but does not confess that it is by the infusion and inspiration of the Holy Spirit within us that we have the faith, the will, or the strength to do all these things as we ought; or if anyone makes the assistance of grace depend on the humility or obedience of man and does not agree that it is a gift of grace itself that we are obedient and humble, he contradicts the Apostle who says, “What have you that you did not receive?” (1 Cor. 4:7), and, “But by the grace of God I am what I am” (1 Cor. 15:10). CANON 7. If anyone affirms that we can form any right opinion or make any right choice which relates to the salvation of eternal life, as is expedient for us, or that we can be saved, that is, assent to the preaching of the gospel through our natural powers without the illumination and inspiration of the Holy Spirit, who makes all men gladly assent to and believe in the truth, he is led astray by a heretical spirit, and does not understand the voice of God who says in the Gospel, “For apart from me you can do nothing” (John 15:5), and the word of the Apostle, “Not that we are competent of ourselves to claim anything as coming from us; our competence is from God” (2 Cor. 3:5).1</p></blockquote>

<blockquote><p>The words ‘in love’ [in Eph. 1:4] allow of two senses: either of our kindness and love towards our neighbor through which imitating God Himself as best we can through his Spirit dwelling within us, we eagerly do good to all men; or of the love of us in an objective sense, the love wherewith God has loved us–so that we have a further mention of the cause of our election, which is solely the boundless love of God with which he embraces us in his Son.</p></blockquote>

<blockquote><p>8. [Baxter complains:] The [Anglican] rubric [post-1662] to which we [ministers] must declare our assent, approbation and consent [upon pain of defrocking], has this article of faith: ‘It is certain by God’s Word that children which are baptized, dying before they commit actual sin are undoubtedly saved.’ [1.] And the rubric at burial excepts all the unbaptized from Christian Burial, according to the office. …

12. There is no one Word of God cited in the rubric which tells us that it is certain by the Word of God.

13. Among Christian divines there are all these various opinions about the salvation of infants:

1. Some hold that the Covenant being to the faithful and their seed, and their children being holy, all the children of sincere Christians are certainly in a state of salvation, being by the parents intentionally dedicated to God, before or without baptism: And that baptism is but their solemn investiture in that state which was theirs by right before.

2. Others think that this right to salvation belongs to the children of all professed Christians godly and ungodly.

3. Others think that it belongs to all infants in the world.

4. Others think that it belongs only to sincere believers’ children that are baptized.

5. Others that it belongs to sound and unsound Christians’ baptized infants.

6. Others that it belongs to all baptized infants whose soever.

7. Others hold that it belongs also to the children of sincere adopters or proprieters.

8. Others that it belongs to such as even bad Christians adopt or own.

9. Others that they that have sincere godfathers, though not proprieters, are saved.

10. Others that even unsound or hypocritical Christian godfathers may suffice to their salvation.

11. Others that the ministers or the Church’s sincere (or professed) Faith is hereto sufficient.

12. And others think that only the elect are saved, of whom some are baptized and some unbaptized, but no man knows who they are. Out of all these opinions the Convocation has chosen one as an article of Faith of undoubted certainty by the Word of God.

13. The non-conformists know of no Word of God which ascertains salvation to any known determinate infants but the great Covenant of Grace, ‘I will be thy God, and the God of thy seed;’ which seed God uses as if they were parts of the parents, Ex. 34:6-7, and Second Commandment, and says to believers, ‘Else were your children unclean, but now, etc.’ [1 Cor. 7:14].</p></blockquote>

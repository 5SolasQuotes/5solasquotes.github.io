<blockquote><p>Q. What else is condemned [in the 7th Commandment]? A. The occasions of uncleaneness, as idlenes, pride and fulness of bread, prattling and gadding from house to house, lascivious dancings, books, songs, pictures, and stage-plays, the companying with fornicators, the resorting to lewd houses, the maintaining of stews [whore-houses], the making light of others’ fornication, and the not marrying when we have not the gift of continency.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6649a5160f" data-kw="">
<blockquote><p>…for rulers in making laws, and creating by their sole pleasure goodness-moral, in particular matters without the Word of God, are not God’s servants, nor is human authority as human, the nearest cause of obligation of conscience, instamped in these laws, nor is it the cause at all, and therefore to resist them, is not to resist God. They be God’s instruments and ministers in: 1. Propounding and expounding God’s laws. 2. In executing them and defending them from the violence of men. 3. In making positive and directory civil laws for civil government that are laws improperly so called, which bind the conscience as above is said, insofar as they have dependence upon God’s Law; For James says, ‘There is but one Lawgiver’ [James 4:12]. As for Church-canons, all, except physical circumstances in them, are to be warranted by the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Ch. 2, Question 2, p. 208</span></figcaption>

</figure><figure class="quote" id="q-29427d960a" data-kw="">
<blockquote><p>It is wont to be excepted against this that Christian Liberty stands not in the freedom of outward actions, but only in the freedom of conscience. As long therefore as there is no doctrinal necessity put upon the conscience to limit the lawfulness of the use of outward things, Christian Liberty is preserved, though the use and practise of outward things be limitted. Whereto I answer 1. that the apostle in this case leaves the people of God at liberty, not only in point of conscience for lawfulness to marry [1 Cor. 7], but even in outward actions and practise, ‘Let him do’ (says he) ‘what he will; he sins not, let him be married,’ verses 30 &amp; 38, as who should say, the conscience being free from sin in it, I will put no tie on the outward practice to restrain it. 2. That true Christian Liberty consists principally in the free, actual use of things lawful and indifferent in themselves, and the prohibition of their free, actual use to Christians is expressly censured as anti-evangelical, a badge of false apostles, of apostates from the faith, hypocrites, men of seared consciences, anti-Christian usurpers, 1 Tim. 4:1,3-4: ‘Now the Spirit speaks expresly that in the later times some shall depart from the faith, giving heed to seducing spirits and doctrines of devils, speaking lies in hypocrisy, having their consciences seared with a hot Iron, forbidding to marry, and commanding to abstain from meats which God has created to be received with thanksgiving: for every creature of God is good, and nothing to be refused if it be received with thanksgiving; For it is sanctified by the Word of God and prayer.’ Col. 2:20-21: ‘Wherefore if ye be dead with Christ from the rudiments of the world; why as though living in this world are ye subject to ordinances?’ (or canons) ‘touch not, taste not, handle not’ (no not God’s ordinances, sacraments, creatures but in such vestiments, gestures, postures) ‘which all are to perish with the using; which things have indeed a show of wisdom in will-worship and punishing of the body.’ 1 Cor. 4:5-6: ‘Have we not power to eat and to drink? Have we not power to lead about a sister, wife, as well as other apostles, and as the brethren of the Lord and Cephas?’ compared with verses 19 to 24. Rom. 14:2-3: ‘For one believeth that he may eat all things another who is weak eateth herbs; Let not him that eateth despise him that eateth not; and let not him which eateth not, judge him that eateth; For God hath received him. Who art thou that judgest another man’s servant? To his own master he standeth and falleth. But why dost thou judge thy brother’ (or refrain him in the use of things indifferent) ‘or why dost thou set at nought thy brother? We shall all stand before the judgement seat of Christ? etc. Let us not therefore iudge one another any more, but judge this rather that no man put a stumbling block or an occasion to fall in his brother’s way, etc.’ to wit, by any restraints, canons, inhibitions, censures, in or concerning things or ceremonies that are but indifferent, and not absolutely necessary by God’s prescription, or the nature of the things themselves. Therefore to prohibit any ministers of the gospel who are able and faithfull to preach the Word, or to excommunicate or cast them, or any other consciencious Christians out of the Church, or debar them from the sacrament, because they cannot wear a surplice, kneel at the Lord’s Table or Supper, or conform to every punctilio in the Liturgy or Canons, and to deny them their Christian Liberty in the free use or forbearing of ceremonies which are only decent and indifferent, indirectly repugnant to Christian Liberty, the Gospel of Christ, and to Acts 4:18-20; ch. 5:27-29, 41-42; 1 Thess. 2:14-16; 3 John 9-10; Rev. 13:16-17; 1 Cor. 7:8-9, 25-28, 35-40; Gal. 5:13-14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief, Pithy Discourse upon 1 Corinthians 14:40</cite>, … (London, 1661), pp. 8-9</span></figcaption>

<blockquote><p>§7. Of Bowing at the Name of Jesus It is rationally supposed that in this act, not the name, but the Person so named is made the object of adoration; the name pronounced is only the occasion of the present adoration of the Person. Nothing in reason or Scripture does evince that it is simply evil to adore Christ by incurvation of the body or other reverent gesture upon occasion of the pronouncing of the name “Jesus.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“§7. Of Bowing at the Name of Jesus It is rationally supposed that in this act, not the name, but the Person so named is made the object of adoration; the name pronounced is only the occasion of the present adoration of the Person. Nothing in reason or Scripture does evince that it is simply evil to adore Christ by incurvation of the body or other reverent gesture upon occasion of the pronouncing of the name “Jesus.”

— John Corbet, Of Divine Worship, pt. 3, sect. 7 in Remains (London: Parkhurst, 1684), pp. 218-19">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A77.+Of+Bowing+at+the+Name+of+Jesus+It+is+rationally+supposed+that+in+this+act%2C+not+the+name%2C+but+the+Person+so+named+is+made+the+object+of+adoration%3B+the+name+pronounced+is+only+the+occasion+of+the+present+adoration+of+the+Person.+Nothing+in+reason+or+Scripture+does+evince+that+it+is+simply+evil+to+adore+Christ+by+incurvation+of+the+body+or+other+reverent+gesture+upon+occasion+of+the+pronouncing+of+the+name+%E2%80%9CJesus.%E2%80%9D%0A%0A%E2%80%94+John+Corbet%2C+Of+Divine+Worship%2C+pt.+3%2C+sect.+7+in+Remains+%28London%3A+Parkhurst%2C+1684%29%2C+pp.+218-19&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F52a9903a00.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/52a9903a00.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=7.%20Of%20Bowing%20at%20the%20Name,the%20pronouncing%20of%20the%20name%20%E2%80%9CJesus&amp;text=7.%20Of%20Bowing%20at%20the%20Name%20of%20Jesus&amp;text=occasion%20of%20the%20pronouncing%20of%20the%20name%20%E2%80%9CJesus" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>7. That Word of God was first ἄγραφον [unwritten], afterward ἔγγραφον [enscripturated], materially the same in both cases, even if not formally; [it was the same] intensively, even if not extensively. 8. It alone today is the rule of things to be believed and done, and therefore adequate to its regulated object. 9. As it has its authority comparatively from itself, so also it has it in itself, and although it can be persuaded to us through other means, yet it cannot be persuaded except through that very light which it has in itself, just as also the sun can be seen only by its own light. 10. The authority of the Church, whatever it may be, can be here εἰσαγωγική [introductory] and διηγητική [expository], but cannot be αὐθεντική [self-authorizing] or αὐτοπιστική [self-credentialing]; for although the Holy Spirit uses both the intrinsic light of Scripture and the extrinsic light of the Church in impressing faith concerning Scripture upon us, yet the former is the primary medium and motive, the latter only secondary. 11. The Church can use unwritten traditions whether public of councils or private of fathers, but ought not to rely upon them. And traditions subalternate to Scripture must always be distinguished from those opposed to it; the former to be admitted, the latter to be rejected. 12. All dogmatic traditions of the Roman Church fabricated outside God’s word are opposed to God’s word, ritual ones for the greatest part of them. 13. Neither the constitution of the [Biblical] canon nor the interpretation of the constituted canon ultimately rests on the authority of the Church. 14. The αὐτοκρατορικός [absolute ruler], judge of controversies, is the one Spirit of God, the κανονικός [normative] judge is sacred Scripture, the ὀργανικός [instrumental] or λειτουργικός [ministerial] judge is the Church, but the one which is true, not the one which merely professes itself to be true. 15. But Scripture is a real Judge, not personal, whence vain are the argumentations which are drawn against the real judge from the characteristics of a personal judge.</p></blockquote>

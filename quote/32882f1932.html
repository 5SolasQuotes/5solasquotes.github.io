<main class="wrap"><figure class="quote" id="q-32882f1932" data-kw="">
<blockquote><p>The reason why it is believed, that regeneration does not usually accompany baptism, is simply because no evidences of spiritual life appear in baptized children more than in those which remain unbaptized. The education of children should proceed on the principle that they are in an unregenerate state, until evidences of piety clearly appear, in which case, they should be sedulously cherished and nurtured. These are Christ’s lambs — ” little ones, who believe in Him” whom none should offend or mislead upon the peril of a terrible punishment. But though the religious education of children should proceed on the ground that they are destitute of grace, it ought ever to be used as a means of grace. Every lesson, therefore, should be accompanied with the lifting up of the heart of the instructer to God for a blessing on the means. “Sanctify them through thy truth; thy word is truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-alexander.html">A.A. Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts on Religious Experience (Philadelphia: Presbyterian Board of Publication, 1841)</cite>, pp. 26-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b3d2f9abff" data-kw="">
<blockquote><p>2. That private Christians in an extraordinary case, in a Church to be erected or that is decayed and ruined, may sometimes publicly preach the Word of God for the planting a Church when there are not such as by God’s ordinary call have received from God power to preach the Word. For the positive ritual law of God gives place to the moral law of God when necessity requires it. 3. We grant also that private Christians in some special cases, and upon a particular occasion, may sometimes speak the Word of God in public by a special calling from God: as martyrs are called to a public confession of the faith. But all this does not infer that there is an exercise of prophesy constantly and ordinarily to be observed in the Church, whereby the Word should by private Christians in the Name of Christ and with all authority be publicly preached for the edification of the Church. And therefore we maintain the negative of the question proposed, and deny that there is such an exercise to be perpetually retained in the Church of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England, Concerning the Government of the Church of God (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’</cite>, pp. 77-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

That%20private%20Christians%20in%20an,retained%20in%20the%20Church%20of%20Christ." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f8ef288f53" data-kw="">
<blockquote><p>Mr. Hooker [wrote]: ”An eminently gifted man in an island, where no pastors are, is no less (says Mr. Rutherford) tied in conscience in the extraordinary employment of his calling than if he were formally ordained and chosen their pastor. In some extraordinary cases a gift and Christian love ties even as much to onerousness [difficulty] in using means to save as the office itself.’ See what I add in that place,’ (Mr. Hooker says) ‘then this gifted man in an island, in using his general calling as a Christian, destroys his particular [calling] as a merchant, and turn[s] minister. 2. This is to confound the general and particular calling.’ [Rutherford’s] Answer: Not at all, for in this case, the extraordinary necessity of gaining souls, when other pastors cannot be had, and ordination and election by that means are invincibly wanting hic &amp; nunc [hear and now], turns his Christian calling in place and room of the particular calling of a pastor; and so Mr. Rutherford said well, that in some extraordinary case like this, ‘The naked relation of jurisdiction adds nothing to [the] care and onerousness in point of labor by preaching the Gospel.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum… (1658).</cite>, pp. 217-8</span></figcaption>

<main class="wrap"><figure class="quote" id="q-ca9e3f6cd5" data-kw="">
<blockquote><p>The strict observance of the Sabbath has ever been followed by blessings manifold to individuals and families and communities; while, on the contrary, Sabbath-profanation has never failed to bring down Divine judgments upon a people who set at nought the most beneficent appointment of heaven. A vicious community can never be long prosperous or happy. Sabbath-breaking, when extensively prevalent, tends directly and powerfully to weaken and destroy the sense of moral obligation, and to set wide open the flood-gates of immorality. God in righteous indignation against a people that spurns his best gift, and sets at nought his authority, gives them up, as He did the ancient Jewish nation, to wander in their own vain counsels; and national judgments attest the displeasure of the Moral Governor of the world against such as contemn his laws, and impiously throw away the shield of a nation’s defence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The races: the evils connected with horse-racing and the steeple-chase and their demoralizing effects</cite>, (1853) in Works doctrinal and practical of the Rev. Thomas Houston, D.D, Knockbracken (4 vols, Edinburgh, 1876), iv, 366.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>3. That the ordinance of superiors cannot make the ceremonies [which were claimed to be indifferent, to be] necessary, I have proven in the first part of this Dispute. This is given for one of the chief marks of the man of sin [in 1 Tim. 4:1-5], ‘That which is indifferent, he by his laws and prohibitions maketh to be sin;’ (Morney, Mister. of Iniq., in the Conclusion) and shall they who profess to take part with Christ against Antichrist [such as the prelates] do no less than this? It will be replyed that the ceremonies are not thought necessary in themselves, nor non-conformity unlawful in itself, but only in respect of the Church’s ordinance. Just so the Papists profess that the omission of their rites and observances is not a sin in itself, but only in respect of contemning the Church’s customs and commandments. How comes it then that they [the prelates] are not ashamed to pretend such a necessity for the stumbling blocks of those offending ceremonies among us, as Papists pretend for the like among them?</p></blockquote>

<blockquote><p>…ye are full Donatists [early Church heretics]… you do agree with them in the sum and substance of all the fowlest things…: …

2. That ye condemn all the Churches in Europe which profess the Gospel… that their worship is blasphemous idolatry, in as much as they have liturgies… …

3. That ye confound errors and heresies, as to make all errors heresies… … 5. That ye deny the distinction of errors fundamental and not fundamental… … 13. That ye deny men are to join in that worship where any errors whatsoever do appear, and are not reformed, and so open a most wide gap unto all schisms… … 28. That ye maintain that no fault is to be tolerated in the church: but if any private man do espy a fault and reprove it, if they will not amend it, he is to forsake that church.</p></blockquote>

<blockquote><p>Friday, Oct. 12. — Kept a family fast this day, that we might afflict ourselves before our God; to seek of Him a right way for us and for our little ones, and for all our substance: I trust it was such a fast as the Lord would choose: His divine presence was amongst us, and we had good reason to hope and believe, that the Lord was entreated of us, Oh that we may find more and more reason to say so, when we come on shore. I dread going into the world. But wherefore do I fear? Lord, I believe, O help my unbelief, that Thou wilt keep me unspotted from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-whitefield.html">George Whitefield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Continuation of Whitefield’s Journal During the Time He was Detained in England, by the Embargo</cite>, vol. 2</span></figcaption>

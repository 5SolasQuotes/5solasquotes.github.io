<main class="wrap"><figure class="quote" id="q-2a36df257d" data-kw="">
<blockquote><p>Christ, by dying, satisfied God on behalf and in place of sinners, just as if they had themselves died in their own person. Christ, by dying and obeying the Father, acquired righteousness, not merely a personal righteousness but that of a surety. For he is the righteous one who fully paid the penalties owed for sin and fulfilled the law of God by obeying. And he paid them not for himself but for others, and he obeyed the Father both for himself and for us. And the righteousness of a surety and a guarantor belongs to those for whom the bail and surety are met. It is expressly stated in the Scriptures that Christ became our righteousness by dying for us and obeying the Father. He became a victim for us, was made a curse and a sacrifice for our sins (2 Cor. 5:21; Rom. 3:25; 5:6-7, 10; John I5:I3; 509) 1 Peter 3:I8; Isa. 53:12). But it is nowhere written that Christ died and obeyed the Father so that our good works, done with the help of grace, would satisfy the law’s righteousness and be considered our own righteousness before the dreadful judge’s tribunal. In other words, it is nowhere written that Christ’s act in justifying, redeeming, and saving means Christ, by his own merits, made us our own justifiers, redeemers, and saviors. For then the power of Christ’s merits would be his communicating to our works the meritorious power of justification, remission of sins, and eternal life. Nowhere in all Scripture is this found to be a fruit of Christ’s death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Samuel Rutherford: Arminianism: A Systematic and Theological Response</cite>, ed. Chad Van Dixhoorn, trans. David C. Noe (Reformation Heritage Books, 226), 1:556–57.</span></figcaption>

<blockquote><p>They formerly asserted in their decrees that the righteousness of God was the only formal cause of Justification; now they anathematize those who say that we are formally righteous by the obedience of Christ. … if any one were to teach that we are righteous formally, i.e., not by quality but by imputation, meaning that our righteousness is in relation merely, there would be nothing worthy of censure.</p></blockquote>

<blockquote><p>XXIII. This Orthodox doctrine of the justification of sinful man before God having been asserted from the Word of God, the following errors are overthrown: … III. Of the Socinians: 1. Who overthrow justification through and on account of Christ the Mediator and His λύτρον [lutron, ransom]; who admit no redemption and satisfaction of Christ except a metaphorical one. 2. Who contend that Christ is our Saviour only on account of His prophetic and kingly office — inasmuch as He vindicated this title to Himself only by announcing salvation, confirming it, and communicating it, but not by meriting it. These and other portentous errors of this sort are both contrary to sacred Scripture and to the salutary doctrine of justification drawn and derived therefrom.</p></blockquote>

<blockquote><p>We affirm on the other side [from the Papists], that the testimony of the Spirit of God in the Word itself–witnessing it to be of God, by that stamp and impress, or, which comes to the same, by those notes and marks of divinity, which everywhere appear in it–is the immediate and principal, and a sufficient, reason of our believing it to be the Word of God, and the medium [which] the Spirit, working inwardly in our hearts, moves as the efficient of our faith, so the Scripture itself, in its own intrinsical beauty, luster, power and excellency, is that which moves us, in the way of an object or medium, to yield our assent to its being of God. By this the Spirit of God; and, by an internal application of this to our minds, induceth us to assent to its so being…. This they [the Papists] deny; and this we shall first, though more briefly prove…</p></blockquote>

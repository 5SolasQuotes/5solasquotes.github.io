<main class="wrap"><figure class="quote" id="q-e94577c488" data-kw="">
<blockquote><p>Masters are to have regard to the moral and religious character of those in their employment (Gen. xxxix. 3, 4; Ps. ci. 2-5); and while careful to assign them suitable wages for their work (Jas. v. 1-4), they are also to treat them in a kindly spirit, allowing them sufficient time for the exercises of religion, and endeavouring to train them up in the fear of the Lord (Gen. xviii. 19).

On the other hand, servants ought to perform the work assigned to them conscientiously, honestly, diligently, and cheerfully (Prov. xviii. 9; Titus. ii. 9, 10). They are also to entertain a respectful regard for their masters, to pray for them (I Tim. vi. 1; I Pet. ii. 18); and submit with meekness when rebuked for their faults (I Pet. ii. 18-20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bible, the Church, and Terms of Communion: Together with the Terms of Communion of the Reformed Presbyterian Church in</cite>, Ireland. To which is Appended the Cameronian Dream (Belfast, 1879), pp 43-44.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-3552d56983" data-kw="">
<blockquote><p>Assertion 4. A conditional and a submissive desire, though not agreeable to a positive law and commandment of God, is no sin, nor does the Law require a conformity in all our inclinations and the first motions of our desires to every command of God, though most contrary to nature and our natural and sinless inclinations: 1. If God command Abraham to kill his only begotten son and offer him in a sacrifice to God, which was a mere positive commandment; for it’s not a command of the law of nature (nor any other than positive) for the father to kill the son; if yet Abraham retain a natural inclination and love commanded also in the law of nature to save his son’s life and to desire that he may live, this desire and inclination, though contradictory to a positive command of God, is no sin; because the Fifth Command, grounded on the law of nature, does command it. Nor did Gods precept (‘Abraham, kill now thy son, even Isaac thine only begotten son’) ever include this, ‘Abraham, root out of thine heart all desire and inclination-natural in a father to preserve the life of the child. So the positive command of the Father, that the Son of God should lay down his life for his sheep, did never root out of the sinless nature of the man-Christ a natural desire to preserve his own being and life, especially He desiring it with special reservation of the will of God commanding that He should die.</p></blockquote>

</figure><figure class="quote" id="q-c945248121" data-kw="">
<blockquote><p>I enact this for Laymen too, and I enjoin it also upon all Priests [elders; Greek: πρεσβυτέροις], and upon those commissioned to rule. Come to the aid of the Word, all of you to whom God has given power to aid. It is a great thing to check murder, to punish adultery, to chastise theft; much more to establish piety by law, and to bestow sound doctrine. My word will not be able to do as much in fighting for the Holy Trinity as your Edict, if you will bridle the ill disposed, if you will help the persecuted, if you will check the slayers, and prevent people from being slain. I am speaking not merely of bodily but of spiritual slaughter. For all sin is the death of the soul.</p></blockquote>

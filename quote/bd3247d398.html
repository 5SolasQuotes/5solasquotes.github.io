<main class="wrap"><figure class="quote" id="q-bd3247d398" data-kw="">
<blockquote><p>For in every little transgression of the divinely commanded law, God’s authority is set aside… [S]ince God has explained his will in the Law, every thing contrary to the Law is displeasing to Him. Will they feign that the wrath of God is so disarmed that the punishment of death will not forthwith follow upon it? He has declared … “The soul that sinneth it shall die,” (Ezek. 18:20). Again, in the passage lately quoted, “The wages of sin is death.”… [L]et the children of God remember that all sin is mortal, because it is rebellion against the will of God, and necessarily provokes his anger; and because it is a violation of the Law, against every violation of which, without exception, the judgment of God has been pronounced. The faults of the saints are indeed venial, not, however, in their own nature, but because, through the mercy of God, they obtain pardon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, II.8.59</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-31ad792516" data-kw="">
<blockquote><p>The Reformed on the contrary state that all concupiscence, which certainly inclines toward evil, is sin, insofar as (1) all such concupiscence is against the law (Rom. 7:7) and thus is lawlessness, in which sin fully consists (1 John 3:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology</cite>, 4.2.28</span></figcaption>

— Petrus van Mastricht, Theoretical-Practical Theology, 4.2.28">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Reformed+on+the+contrary+state+that+all+concupiscence%2C+which+certainly+inclines+toward+evil%2C+is+sin%2C+insofar+as+%281%29+all+such+concupiscence+is+against+the+law+%28Rom.+7%3A7%29+and+thus+is+lawlessness%2C+in+which+sin+fully+consists+%281+John+3%3A4%29.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical-Practical+Theology%2C+4.2.28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F31ad792516.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/31ad792516.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-dfac016fde" data-kw="">
<blockquote><p>That a man should duly, and as he ought, believe, and receive the decision of a synod, it must be both true and he must believe and know that it is true; but [on the other hand,] that it may oblige him and does oblige him, whether his conscience be erroneous, or no[t], is as true, for then this Commandment, ‘Thou shalt not kill’, ‘Honor thy father and thy mother’, should lay no obligation on a man that believes it is service to God to kill the apostles, as, John 16, some do. For no man is exempted from an obligation to obey God’s Law because of his own sinful and culpable ignorance, for we speak not now of invincible ignorance of these things which we are not obliged to know or believe. But if our sinful and erroneous conscience free us from actual obligation to be tied by a law, then our erroneous conscience frees us from sinning against a law, and so from punishment; for whatever frees a man from actual obligation frees him also from actual sinning: for all sin is a doing against a Law-obligation; and if so, then are none to be led by any rule but their own conscience: the written Law and Gospel is not henceforth our rule any more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience… (1649)</cite>, ch. 2, p. 34</span></figcaption>

0duly%2C%20and%20as%20he&amp;text=Gospel%20is%20not%20henceforth%20our%20rule%20any%20more" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-ec4fee703a" data-kw="">
<blockquote><p>The design and end of this [10th] commandment is the internal obedience and regulation of all our affections towards God, and our neighbor and his goods… it is not superfluous, seeing that it is added to the other commandments, as a general rule and interpretation, according to which the internal obedience of all the other commandments must be understood, because this is spoken of the whole Decalogue generally. This commandment, therefore, enjoins original righteousness towards God and our neighbor, which consists in a true knowledge of God in the mind, with an inclination in the will to obey the will of God as known. It also forbids concupiscence, which is an inordinate desire or corrupt inclination, coveting those things which God has forbidden.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism (d. 1583; 1852; repr. P&amp;R)</cite>, p. 606</span></figcaption>

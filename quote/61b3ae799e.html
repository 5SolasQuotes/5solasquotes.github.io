<main class="wrap"><figure class="quote" id="q-61b3ae799e" data-kw="">
<blockquote><p>But the Jesuit deceives us by the ambiguity of a word. For there is both a public and a private interpretation. We confess that all have not the gift of publicly interpreting the scriptures; but in private all the faithful, taught by the Holy Ghost, can understand the scriptures and recognise the true sense of scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Controversy 1, Q. 5, ch. 5 (p. 433)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3e0068a0fa" data-kw="">
<blockquote><p>They did only examine Paul&#x27;s doctrine by the rule and square of the Scripture … for the Scripture is the true touchstone whereby all doctrines must be tried. If any man say that this kind of trial is doubtful, forasmuch as the Scripture is oftentimes doubtful, and is interpreted divers ways, I say, that we must also add judgment of the Spirit, who is, not without cause, called the Spirit of discretion, [discernment.] But the faithful must judge of every doctrine no otherwise then out of, and according to, the Scriptures, having the Spirit for their leader and guide.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, Acts 17:11</span></figcaption>

</figure><figure class="quote" id="q-a9307165a8" data-kw="">
<blockquote><p>The Scripture is the best interpreter of Scripture, or the Spirit of God therein; nor are the church or its pastors, nor councils and popes, the infallible interpreters thereof; there is a private interpretation of Scripture, which every Christian may make, according to his ability and light; and there is a public one, by the preacher of the word but both are subject to, and to be determined by the Scripture itself, which is the only certain and infallible rule of faith and practice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Doctrinal Divinity</cite>, Book I, ch. 2, p. 51</span></figcaption>

</figure><figure class="quote" id="q-07abf794c2" data-kw="">

</figure><figure class="quote" id="q-6de32a9617" data-kw="">

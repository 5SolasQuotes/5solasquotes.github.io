<main class="wrap"><figure class="quote" id="q-c1cfe68768" data-kw="">
<blockquote><p>The communion and fellowship of man with God, was first founded on a covenant of works made with Adam in paradise. If he did obey, and did not eat of the forbidden fruit, he should have life both for himself and his posterity; the which covenant, because God would not have forgotten, he afterward renewed in the delivery of the ten Commandments, requiring from man obedience to them in his own person, exactly, at all times, perpetually: promising life on the obedience, and threatening death and cursing if he continued not in everything the law required to do. But this fellowship being places in man’s own freedom, and having so weak a foundation, he lost both himself and it, so that now by the first covenant of works, Adam and all his posterity are under a curse; for we cannot fulfill the law that requireth personal obedience, perfect obedience, and exact obedience. He that ‘continueth not in all is cursed,’ Gal. iii. 10. The law then findeth us dead and killeth us. It findeth us dead before, and not only leaves us dead still, but makes us more dead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Richard Sibbes</cite>, 6.3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-41092742c7" data-kw="">
<blockquote><p>Therefore the nature of the human race, generated from the flesh of the one transgressor, if it is self-sufficient for fulfilling the law and for perfecting righteousness, ought to be sure of its reward, that is, of everlasting life, even if in any nation or at any former time faith in the blood of Christ was unknown to it. For God is not so unjust as to defraud righteous persons of the reward of righteousness… Man’s nature, indeed, was created at first faultless and without any sin; but that nature of man in which every one is born from Adam, now wants the Physician, because it is not sound. … This grace, however, of Christ, without which neither infants nor adults can be saved, is not rendered for any merits, but is given gratis, on account of which it is also called grace. ‘Being justified,’ says the apostle, ‘freely through His blood.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Nature and Grace, Against Pelagius</cite>, (415), 2, 3, 4 in NPNF1, 5: 122.</span></figcaption>

</figure><figure class="quote" id="q-86a6f25ed5" data-kw="covenant reward">
<blockquote><p>By his own right, God could indeed have prescribed obedience to man (created by him) without any promise of reward. But in order to temper that supreme dominion with his goodness, he added a covenant consisting in the promise of a reward and the stipulation of obedience. As he wished to assert more strongly his own right over man, so he demonstrated the highest benignity in this—that he (himself in need of nothing) willed to invite to a nearer communion with him the creature already subject to him by right of creation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.3.2</span></figcaption>

</figure><figure class="quote" id="q-ef5dce598c" data-kw="">
<blockquote><p>At present there is gneral agreement that the doctrine of the covenants is a peculiarly Reformed doctrine. It emerged in Reformed theology where it was assured of a permanent place and in a way that has also remained confined within these bounds. It is true that towards the end fo the seventeenth century this doctrine was taken over by several Lutheran theologians,¹ but this apparently took place by way of imitation, the doctrine being unknown within the genuine Lutheran framework. ¹ Diestel (Jahrbucher fur Deutsche Theologie, 10, 266) lists those Lutheran theologians who gave a place to the covenant in their system, viz., Calixtus, Wolfgang Jager of Tubingen, Caspar, Exner, Reuter, and others. Cocceius enjoyed a good reputation in Germany, especially as an exegete, even among the Lutherans. The covenant of works was emphasized. This is strange since there is no place for it in a consistent Lutheran system. Federal and natural unity were placed side by side in the covenant of works without subordinating the one to the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of the Covenant in Reformed Theology’ in Redemptive History &amp; Biblical Interpretation: the Shorter Writings of Geerhardus Vos</cite>, ed. Richard Gaffin (d. 1949; Presbyterian &amp; Reformed, 1980), p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works/nature-of-the-covenant.html">Nature of the Covenant</a></span></div>
<div class="actions"><button class="copy" data-copy="“At present there is gneral agreement that the doctrine of the covenants is a peculiarly Reformed doctrine. It emerged in Reformed theology where it was assured of a permanent place and in a way that has also remained confined within these bounds. It is true that towards the end fo the seventeenth century this doctrine was taken over by several Lutheran theologians,¹ but this apparently took place by way of imitation, the doctrine being unknown within the genuine Lutheran framework. ¹ Diestel (Jahrbucher fur Deutsche Theologie, 10, 266) lists those Lutheran theologians who gave a place to the covenant in their system, viz., Calixtus, Wolfgang Jager of Tubingen, Caspar, Exner, Reuter, and others. Cocceius enjoyed a good reputation in Germany, especially as an exegete, even among the Lutherans. The covenant of works was emphasized. This is strange since there is no place for it in a consistent Lutheran system. Federal and natural unity were placed side by side in the covenant of works without subordinating the one to the other.”

bordinating%20the%20one%20to%20the%20other&amp;text=At%20present%20there%20is%20gneral%20agreement%20that%20the&amp;text=works%20without%20subordinating%20the%20one%20to%20the%20other" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bf93ad94bf" data-kw="">
<blockquote><p>If Adam by his great sin condemned all the human race in common, can an infant be born otherwise than condemned? And through whom except Christ is he freed from this condemnation? And if even in Lazarus he says that mortality, cast out from eternity, loved the world of the dead, who of mortals is not touched by this fault and mischance by which the first man fell from everlasting life, which he would have received if he had not sinned? If the Devil made mortal all who could have been immortal, why do even infants die if they are not subject to the sin of the first man? And even infants be saved from the power of death except through Him in whom all shall be made to live?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Julian</cite>, (c. 420), 1.6.24 in The Fathers of the Church: A New Translation, 35:28-29</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works/nature-of-the-covenant.html">Nature of the Covenant</a></span></div>

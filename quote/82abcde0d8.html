<blockquote><p>VII. An example is [the Lutheran] Matthias Flacius Illyricus, who, in a dispute against Victorinus Strigelius in the sixties of the last century, asserted that original sin is substantial and continued to assert it. He did not realize this implied that God, if not the author of sin as he denied, was not the Creator of all substances and things, thus implying two creators and two gods. Flacius did not understand or admit that this followed from his premises. It is unjust to say that Flacius held there were two gods, although this could be deduced from his opinions by sound consequences.</p></blockquote>

</figure><figure class="quote" id="q-4585167369" data-kw="Unity">
<blockquote><p>Since there are various species of union—some in evil, others in good and the truth—that unity only is to be proved which rests upon the truth. Hence unity is to be estimated by faith, not faith by unity. And thus the truth of doctrine, on which all true and saving union is founded, must first be known before the church can be evident.</p></blockquote>

</figure><figure class="quote" id="q-30672bf3d8" data-kw="">
<blockquote><p>Because it may be thought expedient that these things for a time be borne withal; for it may perhaps produce this effect, that these contentions may be avoided, by the which contentions there is great peril, lest greater and far more important benefits be hindered; and lest the minds of men be at the first beginning turned from the Gospel, as we see it come to pass; Martyr. ibid., fol. 1085 [p. 119]. Because, if the parity of doctrine and of faith do remain entire, the pastors may openly teach and press unto their flocks such doctrine as may serve to take away offenses arising by the use of these ceremonies; Beza, Epist. 12, fol. 99. … Because if some things in their nature indifferent be imposed it is not meet too eagerly to contend about such matters; especially when as we see those magistrates by whom the light of the Gospel is much furthered in England, and by whose authority it may much more be furthered, to oppose themselves against us; Peter Martyr, ibid., fol. 1085 [p. 120], to Hooper.</p></blockquote>

t%20expedient%20that%20these&amp;text=Martyr%2C%20ibid.%2C%20fol.%201085%20%5Bp.%20120%5D%2C%20to%20Hooper" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-52ab39d3bb" data-kw="">
<blockquote><p>[Johannes G.] Vos says taking the [Scottish, civil] indulgence [in 1669-1688] involved ‘becoming Episcopalians’ and was ‘a compromise with an unscriptural form of Church government…’ Such ‘must be regarded as a sacrifice of principle… they compromised with prelacy.’ This is to confound material actions with their formal ends. The indulged ministers did not necessarily sacrifice or compromise any principle or become anything but presbyterians acting under limitations of a partially unscriptural form of external Church government. If Vos’s slurs were true, that anyone who materially accommodates and cooperates with rulers acting under erroneous principles, sinfully sacrifices principles and becomes as their rulers: would not the old Jewish Church of God, with intrinsic, divine-right Church government, ruled by their Erastian Babylonian rulers in their captivity (in a broken and declining state), have been in sin for so accepting that Erastian supremacy, at the very command of God (Jer. 27:12–13; 29:4–7)? The Erastian, absolutist, civil rulers over the Jews in Christ’s time dictated and changed who was the Jewish, episcopal high priest at their will, contrary to God’s ordinance (Lev. 16:32; Num. 20:25–28; 35:25). Yet they allowed Christ and the apostles to otherwise exercise their ministry freely while practicing presbyterianism (Lk. 7:3; Mt. 18:15–20), alongside the overseeing priests, or bishops (Mt. 26:3, 57; Mk. 11:27; Lk. 20:1). Though Christ and the apostles suffered greatly under these bishops (Mt. 16:21; 27:1; Mk. 8:31), yet without fleeing (Mt. 26:47–57; Jn. 18:4–8; Acts 16:25–30; 21:13), they appeared at their courts (Mt. 21:23; 26:59; Acts 21:13; 25:11) in that broken and declining state of the Church. Question: On Vos’s premise, were not Christ, the apostles and the whole Jewish Church in sin for cooperating under these restrictions? Would not churches today which cooperate under American rulers acting under erroneous principles be guilty of all their rulers’ errors? Say if churches limit (or do not exercise) their own liberty in some ways to comply with over-reaching government restrictions about a spreading disease, so churches may prevent worse things (such as being shut down, or scandalizing unbelievers they are seeking to win to the Gospel), are they therefore guilty of their rulers’ errors? Perhaps some will affirm this, as many have. When you accommodate your boss’s unnecessary restrictions at work for the greater good, are you sacrificing God’s divine-right of governance over you and you are guilty of your boss’s errors? Are you divinely obliged to suffer the consequences of getting fired and hazarding your family’s survival every time your company wants you to do something not fully in accord with God-prescribed, right reason?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), pp. 133-34</span></figcaption>

1%29%2C+yet+without+fleeing+%28Mt.+26%3A47%E2%80%9357%3B+Jn.+18%3A4%E2%80%938%3B+Acts+16%3A25%E2%80%9330%3B+21%3A13%29%2C+they+appeared+at+their+courts+%28Mt.+21%3A23%3B+26%3A59%3B+Acts+21%3A13%3B+25%3A11%29+in+that+broken+and+declining+state+of+the+Church.+Question%3A+On+Vos%E2%80%99s+premise%2C+were+not+Christ%2C+the+apostles+and+the+whole+Jewish+Church+in+sin+for+cooperating+under+these+restrictions%3F+Would+not+churches+today+which+cooperate+under+American+rulers+acting+under+erroneous+principles+be+guilty+of+all+their+rulers%E2%80%99+errors%3F+Say+if+churches+limit+%28or+do+not+exercise%29+their+own+liberty+in+some+ways+to+comply+with+over-reaching+government+restrictions+about+a+spreading+disease%2C+so+churches+may+prevent+worse+things+%28such+as+being+shut+down%2C+or+scandalizing+unbelievers+they+are+seeking+to+win+to+the+Gospel%29%2C+are+they+therefore+guilty+of+their+rulers%E2%80%99+errors%3F+Perhaps+some+will+affirm+this%2C+as+many+have.+When+you+accommodate+your+boss%E2%80%99s+unnecessary+restrictions+at+work+for+the+greater+good%2C+are+you+sacrificing+God%E2%80%99s+divine-right+of+governance+over+you+and+you+are+guilty+of+your+boss%E2%80%99s+errors%3F+Are+you+divinely+obliged+to+suffer+the+consequences+of+getting+fired+and+hazarding+your+family%E2%80%99s+survival+every+time+your+company+wants+you+to+do+something+not+fully+in+accord+with+God-prescribed%2C+right+reason%3F%E2%80%9D%0A%0A%E2%80%94+Travis+Fentiman%2C+%E2%80%9CEditor%E2%80%99s+Extended+Introduction%E2%80%9D+in+English+Puritans%2C+A+Refutation+of+the+Errors+of+Separatists+%281604%3B+RBO%2C+2025%29%2C+pp.+133-34&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F52ab39d3bb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/52ab39d3bb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-reformation/#:~:text=Johannes%20G.%5D%20Vos%20says%20taking%20the,in%20accord%20with%20God%2Dprescribed%2C%20right%20reason&amp;text=Johanne

<blockquote><p>§50. And whereas the king’s party usually say that it was the seditious preachers that stirred up the people, and were the cause of all this, I answer:

1. It is partly true and partly not: It is not true that they stirred them up to war (except an inconsiderable number of them, one perhaps in a county, if so much). But it is true that they discovered their dislike of the Book of Sports and bowing to altars, and diminishing preaching, and silencing ministers and such like; and were glad that the parliament attempted a reformation of them.

2. But then it is as true that almost all these were conformable ministers, the laws and bishops having cast out the nonconformists long enough before; insomuch that I know not of two nonconformists in a county. But those that made up the Assembly at Westminster, and that through the land were the honor of the parliament’s party, were almost all such as had till then conformed and took those things to be lawful in case of necessity, but longed to have that necessity removed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reliquiæ Baxterianæ</cite>, (London: Parkhurst, 1696), bk. 1, pt. 1, p. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

whereas%20the%20king%E2%80%99s%20party%20usually%20say&amp;text=necessity%2C%20but%20longed%20to%20have%20that%20necessity%20removed" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e7983f8bfd" data-kw="">
<blockquote><p>Besides, there were in the first churches continued for a while certain extraordinary gifts, that had their effects visibly on the outward senses of men, and tended not immediately unto the edification of the church in their faith, but unto the conviction of others, and vindication of the authority of them by whom the gospel was preached and propagated. Such was that gift of healing the sick, which being an especial effect of the Holy-Ghost for the advantage of the Church in those days, in some places it was accompanied by anointing with oil; but this being no universal practice, and used only in the exercise of a gift extraordinary, whose use and being are long since ceased, it never was appointed nor intended to be of continuance in the Church, which is not tied by the Lord Christ to the empty signs and shadows of things whose substance is not enjoyed: besides, no spiritual grace of the Covenant was ever intimated, sealed, or exhibited by that usage of anointing with oil. The first mention of it is, Mark 6:13 where its practice is reckoned among the effects of that extraordinary power which the Lord Christ committed unto his twelve disciples on their first sending out, and is referred unto the same series of miracles which they wrought in pursuit, and by virtue thereof, they cast out many devils, and anointed with oil many that were sick, and healed them. And by what is there recorded, the subsequent mention of it, James 5:14 is to be regulated, but now unto a real evangelical institution of worship, it is required: (1.) That it be a command of Christ manifested by his Word, or example proposed unto our imitation, Mt. 28:20. (2.) That it be given and enjoined unto the whole Church with the limitation of its administration expressed in the Word, 1 Cor. 11:25. (3.) That unto the due performance of it, Gospel grace be required in them that attend unto it. (4.) That it teach, or represent, or seal, or improve some grace of the Covenant, and have a promise of acceptation annexed unto it, and whatever is thus appointed, the Church is indispensably to continue in the observation of, unto the end of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Short Catechism on Worship</cite>, Question #13 1667 For the fuller context, see Owen above on the holy kiss, which section immediately precedes this section.</span></figcaption>

</figure><figure class="quote" id="q-0e132c236f" data-kw="">
<blockquote><p>There was a certain Count of your [Reformed] confession who possessed common jurisdiction in a certain church with a certain Prince of our [Lutheran] religion. Therefore since the Associate was judging that he [the reformed Count] had more of right in that church, he made sure that the altar was destroyed and that a table be built [for the Lord’s Supper] in the temple [church building]. The Prince found out later about this, and ordered that the table be removed and an altar be constructed again. The Count in return took care a second time in return that the altar be destroyed, and the table restored. The Prince likewise a second time ordered that the table be taken away and the altar restored. I do not know whether this happened a third time. But the [reformed] Count later heeded the [Lutheran] Prince’s strictness, and left off from his course, such that the altar remained in the temple in place of the table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jacob-andreae.html">Jacob Andreae</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism</cite>, (Concordia Publishing House, 2017), ch. 4, ‘On the Reformation of Temples, Images &amp; Organs’, p. 497 Andreae (1528–1590) was a leading Lutheran theologian debating Theodore Beza.</span></figcaption>

<blockquote><p>Now the King Himself, the Lord who reigns in this external policy [of the Church], must be the only Lawgiver, James 4:12; Isa. 33:22. There can be no rabbis or doctors on earth who as little kings can make laws under Him, Mt. 23:8-10. Yea, not apostles, who can teach how the worship should externally be ordered, but what they receive of the King of the Church, 1 Cor. 11:23; Acts 15:13-18, how the house should be governed, Heb. 3:1-2; 4:5. Yea, nothing [is] more reasonable than that whatsoever is commanded by the God of Heaven, should be done in and for the house of the God of Heaven under the pain of his wrath, Ezra 7:23; 1. That there should be officers in a Kingdom, and laws to govern the subjects, beside the will of the prince or judges of the Land, or that the members of a family, or soldiers in an army should be governed by any rule, custom or law, beside[s] or without the will of the Master of the House, and of the general and commanders, is all one, as if subjects, families and soldiers should be ruled and governed by their own will and wisdom, and not by their king, judges, masters and commanders; For the question is upon this undeniable supposition, that Christ is the only Head and King of his Church, and so the Head and King of Prelates (if they be of the body) and of the rulers, guides and pastors of the Church, which are to be governed and ruled by certain laws, no less than the people, whether or no this representative Church of rulers, being subjects and members of the Head and King of the Church, are to be ruled by the wisdom, laws and commandments of this King, the Lord Jesus; or if they have granted to them a vast arbitrary power to govern both themselves and the people, by adding positive mandates of arbitrary commanders, such as Prelates are (in the mind of those who think they have no patent of any divine-right) and of surplice, crossing, kneeling for reverence to wood, to bread and wine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646) | Intro, Section 2, pp. 17-18</span></figcaption>

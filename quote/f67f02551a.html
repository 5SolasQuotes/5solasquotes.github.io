</figure><figure class="quote" id="q-b946668c3a" data-kw="">
<blockquote><p>Naturally the honour of worship does not belong to Christ’s humanity as such, but because the divine Logos has taken it up into his personality, which is by nature adorabilis. Wolleb 68: ‘The honor which results from the personal union is the adoration of the human nature; not however of the flesh qua flesh, nor of the creature, but of God in the created flesh.’ Keckermann 322: ‘It is because of the union that the whole person of Christ is worshipped, although the direct object of worship is the divinity alone.’ Zanchius 71: ‘The union of natures in the person of Christ brings it about that we cannot worship the Deity in Christ, unless at the same time we also worship the human nature in him, and that both the human and the divine nature in him must be worshipped by us altogether with the one worship only.’ Voetius devoted an explicit section to the discussion of this doctrinal point ([Disputations] I, 520-552), ‘anent the question whether Christ as the Mediator should be worshipped.’ Voetius distinguishes between ‘worship’ and ‘worshipfulness’. ‘Christ as mediator or under the formula qua est mediator is not worshipful’; for only God is ‘worshipful’. But since Christ qua person is God it follows that ‘in and along with the flesh, in and along with the office of mediator Christ is to be worshipped, so that the object of our consideration is Christ’s person, together with everything that is in it.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics rev. Ernst Bizer</cite>, ed. Bizer (1950; Wipf &amp; Stock), ch. 17, section 21, pp. 438-39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b946668c3a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-grounds-of-christ-the-mediator-receiving-divine-worship/#:~:text=Naturally%20the%20honour%20of%20worship%20does,with%20everything%20that%20is%20in%20it&amp;text=Naturally%20the%20honour%20of%20worship%20does%20not%20belong&amp;text=person%2C%20together%20with%20everything%20that%20is%20in%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-43ffeddcd5" data-kw="">
<blockquote><p>The flesh, that is, the humanity of Christ, is worshipped relatively, but worship is not directed to the flesh itself, but rather to the Deity of the Son, who hears the prayers and witnesses the groaning of our hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jakob Andreae &amp; Theodore Beza, Lutheranism vs. Calvinism</cite>, ed. Jeffrey Mallinson tr. Clinton J. Armstrong (Concordia Publishing House, 2017), p. 425</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

</figure><figure class="quote" id="q-37fc0c2ee2" data-kw="">
<blockquote><p>3. Yet we must not imagine any such active power in God, which is a diverse thing from his essence.

4. For God in his own most simple essence is such, whatsoever He be: just, good, or almighty.

5. And although there be indeed but one only power in God: yet for the diverse respects wherein He is considered, it may be said (not impiously) to be manifold.

6. For it is one respect when it is considered as God works always in Himself in understanding, willing, loving: and another respect when we behold it as God has wrought outwardly or without himself in creating the world: and as He evermore works in governing the same: and as He could work innumerable things, if He would.

7. Therefore as the actions of God are not unfittly distinguished into abiding actions and passing: so the power of God may not unjustly be called twofold, one, wherein He ever from all eternity did work and does work in himself: the other, wherein He did not only make, rules, and works all things in time without Himself: but also can bring to pass infinite things, which He never will do.

8. Whereupon it is also that the same is usually divided into actual power, which works whatsoever He will: and into absolute power, whereby he can also do infinite things which He will not: because otherwise He could not be said to be simply omnipotent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>H. Zanchius his Confession of Christian Religion</cite>, Of the Eternal Omnipotency of One True God, year 1575 in H. Zanchius his Confession of Christian Religion… (1599), pp. 377-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

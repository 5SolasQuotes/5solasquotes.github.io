<main class="wrap"><figure class="quote" id="q-3fbf2cbbd5" data-kw="">
<blockquote><p>The O. S. [Old School] Assembly in 1853 decided that in some cases the Session may dismiss a member without specifying the church with which he is to unite. But the reunited Church in 1871 urged upon Sessions the importance of giving to members who remove from them either letters of dismission and recommendation to a particular church, or, in case of uncertain destination, letters of credence. The O. S. Assembly in 1869 recommended that the Session should furnish any member removing from their bounds, whether in full communion or member by baptism only, with testimonials of his standing, which should be presented as soon as possible to some church of our connection, and that such person be advised to transfer his relation at the earliest opportunity… … May a member connect himself with another church on profession of faith? If the church with which he unites [by profession of faith] be one of another denomination, the Session may order his name to be struck from the roll of communicants, or may, by process of discipline, suspend him from church privileges. The N. S. [New School] Assembly in 1839 recommended that no other action should be taken than to strike his name from the roll. This action was reaffirmed by the Assemblies of 1879 and 1882, and was in 1884 embodied in the revised Book of Discipline. How are absent members to be treated? … When one has been absent for years and his residence unknown, the Session should make record of the fact, and declare that he has forfeited his good standing until he returns and accounts for his absence. The O. S. As- sembly in 1865 passed a similar order. That body had in 1856 required that the names of absentees, whose whereabouts are unknown, be placed on a reserved list, and not be reported among the communicants until they return and satisfy the Session. The Assembly of the reunited Church ratified the above in 1872 by declaring, “It may nevertheless be well for each church to record on a separate list the names of those who have been absent for more than two years from their church relations, and whose residence is unknown; and the names thus recorded may be omitted in the statistical returns of the church. The ‘Book of Discipline’ adopted in 1884 authorized the Session to erase the names of absentees after three years and place them on the reserved list.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-aspinwall-hodge.html">J. Aspinwall Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What is Presbyterian Law as Defined by the Church Courts? (1882; 1899), pp. 147, 151-52, 152-54 | “May a certificate of dismission be indefinite?</cite></span></figcaption>

</figure><figure class="quote" id="q-ba378cd46f" data-kw="">
<blockquote><p>4. Concerning the tenth Proposition (which will be most questioned), I desire it may be observed: 1. That we meddle not with the term ‘excommunication.’ 2. And therefore they that say we meddle with the thing, must define excommunication, and show that the work that we here agree on does reach that definition. 3. Which if they do, then they will make excommunication to be no more than this application of Christ’s doctrine to a particular person and case, which every minister of the Gospel may perform: For we mention in our Agreement no more. 4. I am sure that delivering up to Satan, and the great anathematizing excommunication is commonly taken to go much further and contain more than we here conclude on. 5. Yet observe that we here suppose the fact and faultiness proved beyond doubt: and when we speak of ministers applicatory requiring the avoidance of such persons, if any think we wrongfully authorize him to do this without the presbytery, congregation, or bishop; remember that we speak not here of examining witnesses, much less giving them their oaths, or the like preparation for discovery of the guilt. How far people or any others may have a hand in this we do not determine. 6. Nor do we determine whether it must needs be more ministers than one that must agree in this before the public application: yet afterward we have limited ourselves in this for unity, peace and avoiding of rash applications.</p></blockquote>

</figure><figure class="quote" id="q-6670386a33" data-kw="">
<blockquote><p>Our divines from Scripture make three degrees of excommunication: 1. A debarring from the Lord’s Supper, Mt. 5:24, but it is not indeed a delivering to Satan or excommunication: this is called the lesser excommunication. 2. A delivering to Satan, the greater excommunication, 1 Cor. 5:3-4, of this we speak here especially. 3. Maranatha in the Syriac, is an utter cursing till Christ’s Second Coming.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644), pt. 1</cite>, Ch. 9, section 9, p. 283</span></figcaption>

</figure><figure class="quote" id="q-037c6a57b4" data-kw="">
<blockquote><p>Many martyrs faithfully perform congregational duties, yet does not Christ make good this promise [to build them on the Rock, Mt. 16], for when members are dissolved by banishment, they are thrown off the rock [Hooker had defined a local congregationalist church as those built on the Rock]. That which by our Savior is set down, as contrary to their comfortable union with and building upon Christ their rock, is being foiled [by governments banishing faithful local church members out of the local church] with the temptations of Satan and Hell, and being thrown off the rock [on the congregationalists’ definition], like the hypocrite, Mt. 7, who is the house built on the sand… and so by this interpretation the Lord’s dissolving of a church, which often is a work of mercy, and putting of his children to an honorable condition of martyrdom, and glorifying of God by suffering and scattering of his Church, as Acts 8:12, must be a throwing them off the rock Christ and a prevailing of the ports of Hell against them: contrary to the scope and intent of Christ in the text.</p></blockquote>

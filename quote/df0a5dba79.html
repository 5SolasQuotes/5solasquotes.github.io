<main class="wrap"><figure class="quote" id="q-df0a5dba79" data-kw="">
<blockquote><p>Irenaeus of Lyon observed that while the Gnostics or Valentinians claimed to get their notions from the Bible, their assertion should be viewed as fraudulent since the did not acknowledge the “consent of all the parts” of scripture (Westminster Confession 1.5):

In doing so, however, they disregard the order and the connection of the Scriptures, and so far as in them lies, dismember and destroy the truth. By transferring passages, and dressing them up anew, and making one thing out of another, they succeed in deluding many through their wicked art in adapting the oracles of the Lord to their opinions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/irenaeus-of-lyons.html">Irenaeus of Lyons</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Heresies</cite>, (c. 175-85), 1.8.1 in Ante-Nicene Fathers, 1: 326.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

<blockquote><p>And although ordinary believers are obliged to make diligent and conscientious use of the ministry of the church, among other things, as a means appointed of God to lead, guide, and instruct them in the knowledge of his mind and will revealed in the Scripture, which is the principal end of that ordinance; yet is not their understanding of the truth, their apprehension of it and faith in it, to rest upon or to be resolved into their authority, who are not appointed of God to be lords of their faith, but helpers of their joy.</p></blockquote>

</figure><figure class="quote" id="q-f43796151a" data-kw="">
<blockquote><p>It must be observed, however, that the teachings and prescriptions of Scripture are not confined by the Confession to what is “expressly set down in Scripture.” Men are required to believe and to obey not only what is “expressly set down in Scripture,” but also what “by good and necessary consequence may be deduced from Scripture.” This is the strenuous and universal contention of the Reformed theology against Socinians and Arminians, who desired to confine the authority of Scripture to its literal asseverations; and it involves a characteristic honoring of reason as the instrument for the ascertainment of truth. We must depend upon our human faculties to ascertain what Scripture says; we cannot suddenly abnegate them and refuse their guidance in determining what Scripture means. This is not, of course, to make reason the ground of the authority of inferred doctrines and duties. Reason is the instrument of discovery of all doctrines and duties, whether “expressly set down in Scripture” or “by good and necessary consequence deduced from Scripture”: but their authority, when once discovered, is derived from God, who reveals and prescribes them in Scripture, either by literal assertion or by necessary implication. The Confession is only zealous, as it declares that only Scripture is the authoritative rule of faith and practice, so to declare that the whole of Scripture is authoritative, in the whole stretch of its involved meaning. It is the Reformed contention, reflected here by the Confession, that the sense of Scripture is Scripture, and that men are bound by its whole sense in all its implications. The reëmergence in recent controversies of the plea that the authority of Scripture is to be confined to its expressed declarations, and that human logic is not to be trusted in divine things, is, therefore, a direct denial of a fundamental position of Reformed theology, explicitly affirmed in the Confession, as well as an abnegation of fundamental reason, which would not only render thinking in a system impossible, but would discredit at a stroke many of the fundamentals of the faith, such e.g. as the doctrine of the Trinity, and would logically involve the denial of the authority of all doctrine whatsoever, since no single doctrine of whatever simplicity can be ascertained from Scripture except by the use of the processes of the understanding. It is, therefore, an unimportant incident that the recent plea against the use of human logic in determining doctrine has been most sharply put forward in order to justify the rejection of a doctrine which is explicitly taught, and that repeatedly, in the very letter of Scripture; if the plea is valid at all, it destroys at once our confidence in all doctrines, no one of which is ascertained or formulated without the aid of human logic.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Benjamin B. Warfield</cite>, vol. 6 (Bellingham, WA: Logos Bible Software, 2008), 226–27.</span></figcaption>

</figure><figure class="quote" id="q-1a2f3820bb" data-kw="">
<blockquote><p>Moreover, the dignity of the sacred writings greatly arouses minds keen for the highest goods. For if the other esteemed arts are much sought after, how desirable is that which no one can praise enough? And if you compare the one with the others, you will be convinced that the others are profane and untrustworthy, but only [the Scripture itself] is most holy and incomparably fruitful.

For only Scripture itself exposes all the errors of all the ages, disproves and refutes them. It alone teaches the highest virtue free from any hypocritical disguise. It alone brings firm hope of blessedness and of life, true and eternal. It alone makes known the hidden treasures of divinity. The other sciences, however, are not to be despised. They are ancillary to Scripture, if they fall upon good minds. Even so, they never arrive at the point where they fly so high [i.e., as Scripture], bring forth such results, or shine with such a rosy brightness.

Now since in the other sciences nothing succeeds well without hard work, and the disciplines are mastered only after much effort by one who has been attracted either by a bit of glory or to profit an estate, what then would we not bear or do, how would we not burn the midnight oil which we had saved so that we might pursue those things which are most holy, most honourable and blessed beyond all measure?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-oecolampadius.html">Johann Oecolampadius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of Genesis</cite>, trans. Mickey Mattox, Reformation Texts with Translation, no. 13 (1531; Milwaukee WI: Marquette University Press, 2013), pp 39-41.</span></figcaption>

</figure><figure class="quote" id="q-0018e6f6fd" data-kw="">
<blockquote><p>The reason why these books were separated from canonical authority is not a secret. Some of them were written after the time of the prophets, when the people of Israel no longer had prophets such as the old ones had been; and they were written by men who did not have divine testimonies like the prophets for the certainty and authority of their doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part I, Topic on the Holy Scripture, Sec. VI</span></figcaption>

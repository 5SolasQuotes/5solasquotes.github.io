<blockquote><p>But now, whether I pray in such or such a place, whether with eyes lift up or cast down, whether kneeling or standing, whether with mine head covered or uncovered, these are certain points of solemnity, as it were adjuncts of the exercise. And here it is sufficient, that I use no such circumstance as is condemned, nor neglect any that is commanded, but if I do esteem it a matter of religious necessity to God-ward, to pray in such a place rather than such, and conceive that my prayers shall be more effectual for my good there rather than elsewhere, not having any such warrant from God, I do now turn the circumstance into a part of worship, and seeing it is not from God, of false worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Divinity, II.xvi</cite>, (1654), Second Commandment, p. 772</span></figcaption>

<blockquote><p>4. It is granted [by the most sober nonconformists] not to be idolatrous. So Mr. [Paul] Baynes: ‘Kneeling is neither an occasion, nor by participation idolatry: Kneeling never bred bread-worship.’ (Christian Letters, Letter 24, p. 201) And [Richard Baxter]: ‘Our doctrine of the sacrament [that one is kneeling to God], known to all the world, does free us from suspicion of adoration in it.’ (Baxter, Christian Directory, p. 616) To these Mr. [John] Tombes [a baptist] adds (Theodulia, p. 256, etc.): ‘1. That the Papists adore not the bread at putting it into their mouths, but at the elevation [of it], it being inconsistent with their principles to worship that which is not above them. 2. That the worship of God not directed to a creature, but before it, as an occasional object of adoration to God, is not idolatry. 3. That yet in the Church of England the elements are not occasionally so, but [rather] the benefits of Christ in the Lord’s Supper [are]. And 4. Kneeling is not to the bread, but as the signification of an humble and grateful mind; as he shows from the rubric [in the Anglican Book of Prayer].’ (T. D., Jerubbaal, p. 41 &amp; Mr. [Zachary] Crofton‘s Answer, p. 28; [William] Ames, Fresh Suit, ch. 4, §4, p. 382; [William] Perkins, Cases) Fifthly, Those that do account it inconvenient, yet account it not to be unlawful. Thus Mr. [Thomas] Cartwright: ‘Kneeling in receiving the sacrament, being incommodious in its own nature, and made far more incommodious by Popish superstition, is not therefore so to be rejected that we should abstain from the sacrament (if we cannot otherwise be partakers of it), because the thing is not in its own nature unlawful.’ (Evangelical Harmony, on Lk. 22:14, etc. Second Reply, p. 262) So it’s said of the old non-conformists: ‘Kneeling at the sacrament was disliked by all, but yet thought tolerable, and that it might be submitted to by some of the most Learned.’ (Troughton, An Apology for the Nonconformists [1681], p. 90) From all which we may conclude with Mr. [Richard] Vines [a Westminster divine], that the posture being a circumstance of action, as well as the time and place, ‘is not of the free-hold of the ordinance’ (On the Sacrament, p. 102); and with Mr. [Richard] Baxter that those that think they must not receive kneeling, ‘think erroneously.’ (Sacrilegious Desertion, p. 19)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-williams.html">John Williams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London</cite>, (London, 1685), vol. 1, ‘The Non-Conformists’ Plea for Lay-Communion with the Church of England’, pp. 73-72 Williams (d. 1709) was an Anglican bishop.</span></figcaption>

0kneeling%2C%20%E2%80%98think%20erroneously.%E2%80%99%20%28Sacrilegious%20Desertion%2C%20p.%2019" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f0574d4095" data-kw="">
<blockquote><p>…2 Chron. 29 [vv. 29-30], out of which no more can be drawn but that the people worshipped while the priests were yet offering the burnt-offering. Now the burnt-offering was but accidentally before the people in their worshipping, and only because it was offered at the same time when the song of the Lord was sung. Verse 27… Verse 36, Since then the song and the sacrifice were performed at the same time, we must note that the people worshipped at that time not because of the sacrifice which was a mediate worship, but because of the song of the Lord, which was an immediate worship. Now we all commend kneeling in an immediate worship. But this cannot content our Opposites, they will needs have it lawful to kneel in the hearing of the Word, purposely and with a respect to the Word preached, though this be a mediate worship only. Their warrants are taken out of Ex. 4:30-31; 12:27; 2 Chron. 20:18; Mt. 17:6. From the first three places no more can be inferred but that these hearers bowed their heads and worshipped after that they had heard the Word of the Lord; Neither shall they ever warrant bowing and worshipping in the act of hearing. In the fourth place we read that the disciples fell on their faces when they heard God’s own immediate voice out of the cloud: What makes this for falling down to worship at the hearing of the Word preached by men? How long shall our Opposites not distinguish betwixt mediate and immediate worship?</p></blockquote>

<blockquote><p>1. Bowing of the knee, physically or civilly, is indifferent and is not adoration: for we bow to kings, and artificers may bow the knee to drive a nail in a bed, and yet are not adoring; but religious adoration, whether ye will or not, by nature’s impression, is a religious note of religious submission. 2. I consider four acts of the soul that may convey external adoration: 1. One of the mind, a consideration of the excellency of what we adore; 2. A will to submit to this excellency; 3. The judgments diting this to be honest to submit; 4. A purpose or intention habitual or actual of adoring; many of these may be where there is no adoring: and the religious external bowing of the body is essentially adoring, when that bowing is in a state of worship: kneeling before consecrated elements for reverence of either God or the elements, must be adoration, though we should wash it with foul water and say that there is no intention to tender God’s glory to these elements. 3. Let it be considered what is said by the Jesuit Joannes de Lugo, the Pope’s professor at Rome, which I propound with some change: 1. There is a purpose of external adoring, with an inward submission of the heart; whether this be an habitual or actual intention, it is sure it is an adoration when it comes forth in a gesture of adoring. 2. A will to bow the body in scorn and derision, as the soldiers bowed the knee before Jesus; and this being not in a state of worshipping, but in a state and case of disgracing, is not religious bowing or adoration: This is not a natural expression of inward submission, but rather of disgrace. 3. There is a willed or voluntary religious bowing for fear, for gain, or for glory; yet without any internal estimation of the excellency of the thing adored. This Suarez denies to be worshipping, it being only a feigning of worship, not a worshipping. 4. If religious kneeling require that we intend to worship everything before which, as an object, we do religiously kneel, then religious kneeling should not signify internal submission of the heart by nature’s impression or divine institution, but by the voluntary and the free institution of him that kneels: But this latter is absurd, for if kneeling should signify what it does signify by our free and voluntary appointment, then we might: 1. Put upon natural gestures what signification we pleased, and were not to stand to the signification which God and nature have put upon kneeling. 2. So it were in man’s power to impose upon religious kneeling to God civil courtesy, such as a subject expresses to his prince, or a son to his father; and it were free to us to kneel to a stock, and that religiously, and yet put upon kneeling the negative reverence that we give to the Bible; and it were in the three children’s will to kneel to Nebuchadnezzar’s image, and impose this signification on the gesture, that they were kneeling to God only, all which are manifestly false: so Field says kneeling has institution from the instinct of nature.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. Bowing of the knee, physically or civilly, is indifferent and is not adoration: for we bow to kings, and artificers may bow the knee to drive a nail in a bed, and yet are not adoring; but religious adoration, whether ye will or not, by nature’s impression, is a religious note of religious submission. 2. I consider four acts of the soul that may convey external adoration: 1. One of the mind, a consideration of the excellency of what we adore; 2. A will to submit to this excellency; 3. The judgments diting this to be honest to submit; 4. A purpose or intention habitual or actual of adoring; many of these may be where there is no adoring: and the religious external bowing of the body is essentially adoring, when that bowing is in a state of worship: kneeling before consecrated elements for reverence of either God or the elements, must be adoration, though we should wash it with foul water and say that there is no intention to tender God’s glory to these elements. 3. Let it be considered what is said by the Jesuit Joannes de Lugo, the Pope’s professor at Rome, which I propound with some change: 1. There is a purpose of external adoring, with an inward submission of the heart; whether this be an habitual or actual intention, it is sure it is an adoration when it comes forth in a gesture of adoring. 2. A will to bow the body in scorn and derision, as the soldiers bowed the knee before Jesus; and this being not in a state of worshipping, but in a state and case of disgracing, is not religious bowing or adoration: This is not a natural expression of inward submission, but rather of disgrace. 3. There is a willed or voluntary religious bowing for fear, for gain, or for glory; yet without any internal estimation of the excellency of the thing adored. This Suarez denies to be worshipping, it being only a feigning of worship, not a worshipping. 4. If religious kneeling require that we intend to worship everything before which, as an object, we do religiously kneel, then religious kneeling should not signify internal submission of the heart by nature’s impression or divine institution, but by the voluntary and the free institution of him that kneels: But this latter is absurd, for if kneeling should signify what it does signify by our free and voluntary appointment, then we might: 1. Put upon natural gestures what signification we pleased, and were not to stand to the signification which God and nature have put upon kneeling. 2. So it were in man’s power to impose upon religious kneeling to God civil courtesy, such as a subject expresses to his prince, or a son to his father; and it were free to us to kneel to a stock, and that religiously, and yet put upon kneeling the negative reverence that we give to the Bible; and it were in the three children’s will to kneel to Nebuchadnezzar’s image, and impose this signification on the gesture, that they were kneeling to God only, all which are manifestly false: so Field says kneeling has institution from the instinct of nature.”

— Rutherford’s Considerations, The Divine Right of Church Government (London, 1646), ch. 1, question 5, section 1, pp. 145-47">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+Bowing+of+the+knee%2C+physically+or+civilly%2C+is+indifferent+and+is+not+adoration%3A+for+we+bow+to+kings%2C+and+artificers+may+bow+the+knee+to+drive+a+nail+in+a+bed%2C+and+yet+are+not+adoring%3B+but+religious+adoration%2C+whether+ye+will+or+not%2C+by+nature%E2%80%99s+impression%2C+is+a+religious+note+of+religious+submission.+2.+I+consider+four+acts+of+the+soul+that+may+convey+external+adoration%3A+1.+One+of+the+mind%2C+a+consideration+of+the+excellency+of+what+we+adore%3B+2.+A+will+to+submit+to+this+excellency%3B+3.+The+judgments+diting+this+to+be+honest+to+submit%3B+4.+A+purpose+or+intention+habitual+or+actual+of+adoring%3B+many+of+these+may+be+where+there+is+no+adoring%3A+and+the+religious+external+bowing+of+the+body+is+essentially+adoring%2C+when+that+bowing+is+in+a+state+of+worship%3A+kneeling+before+consecrated+elements+for+reverence+of+either+God+or+the+elements%2C+must+be+adoration%2C+though+we+should+wash+it+with+foul+water+and+say+that+there+is+no+intention+to+tender+God%E2%80%99s+glory+to+these+elements.+3.+Let+it+be+considered+what+is+said+by+the+Jesuit+Joannes+de+Lugo%2C+the+Pope%E2%80%99s+professor+at+Rome%2C+which+I+propound+with+some+change%3A+1.+There+is+a+purpose+of+external+adoring%2C+with+an+inward+submission+of+the+heart%3B+whether+this+be+an+habitual+or+actual+intention%2C+it+is+sure+it+is+an+adoration+when+it+comes+forth+in+a+gesture+of+adoring.+2.+A+will+to+bow+the+body+in+scorn+and+derision%2C+as+the+soldiers+bowed+the+knee+before+Jesus%3B+and+this+being+not+in+a+state+of+worshipping%2C+but+in+a+state+and+case+of+disgracing%2C+is+not+religious+bowing+or+adoration%3A+This+is+not+a+natural+expression+of+inward+submission%2C+but+rather+of+disgrace.+3.+There+is+a+willed+or+voluntary+religious+bowing+for+fear%2C+for+gain%2C+or+for+glory%3B+yet+

<main class="wrap"><figure class="quote" id="q-1d7699be7b" data-kw="">
<blockquote><p>1st Assertion: The magistrate as the magistrate is to procure that there be preachers and Church-officers to dispense Word, sacraments and discipline, for: 1. His end is, that people under him may lead a quiet and a peaceable life in godliness and honesty, 1 Tim. 2:2. And the Magistrate attains his end as a Magistrate, if there be simple exercise of religion in the quiet and peaceable way, that may consist with the subjects indemnity, and immunity, from rapine, injuries, and violence. … 4th Assertion. The magistrate de jure is obliged not only to permit, but also to procure the free exercise of the ministry in dispensing Word, sacraments and discipline, and owe his accumulative power, to convene synods, to add his sanction to the lawful and necessary constitutions and ordination of worthy, and to the deposition of unworthy officers in the Church, because: 1. He is a nurse-father in the Church, Isa. 49:23. 2. And by office, as a public father, to procure the good of the souls of the subjects in his coactive [coercive] way, that we may lead a quiet and peaceable life in all godliness and honesty, 1 Tim. 2:2. 3. He is not only to permit, but also positively to procure all peace, in the exercise of all lawful and profitable trades and arts; therefore, far more that glory may dwell in the land, and that the peace thereof may be as a river, Isa. 48:18, by the presence of Christ walking in the midst of the golden candlesticks.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), ch. 24, pp. 543 &amp; 552</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dfcdf3c447" data-kw="">
<blockquote><p>Then church and state are like[ly] to flourish when Moses and Aaron, Zerubbabel and Joshua, Zech 4:14, go hand in hand together. When the minister reproves sin, and the magistrate punishes it; when the magistrate makes use of the minister’s direction, and the minister enjoys the magistrate’s protection; when Joshua joins with Eleazar, and David consults with Nathan and Gad, the prophets of the Lord; and Josiah with Huldah, and Uzziah with Zechariah the priest, then, and never till then, can we look to prosper, 2 Chron 26:5. It is Aaron’s office to speak, but it is Moses’s rod that works the wonders. Ministers must preach, and magistrates must punish offenders.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beauty of Magistracy in an Exposition of the 82nd Psalm</cite>, pp. 76-82 in The Beauty of Magistracy in an Exposition of the 82nd Psalm, where is set forth the necessity, utility, dignity, duty, and mortality of magistrates… (London, 1660)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-15dd484b94" data-kw="">
<blockquote><p>54. That the Pope can forbid subjects to keep the oath of fidelity to Christian kings, if they be such as acknowledge not the Roman sea. 55. That the Pope can absolve subjects from the oath of fidelity. 56. That the Pope has power to depose princes. 57. That the subjects of such princes are bound to obey such a sentence, if it be published. 58. That if grave and learned men (such as the Jesuits especially are) shall judge any prince to be a tyrant, it is lawful for their subjects to overthrow them, and if they want [lack] power, to poison them. 59. That the subjects of the most Christian kings, whom they call Lutherans and Sacramentarians, are free from all bonds, and that they may lawfully destroy their kings. 60. That ’tis not lawful for Christians to tolerate a king that is an infidel or a heretic endeavoring to draw men to his sect, but they are bound to depose him. 61. That the ancient Christians did not depose such because they wanted [lacked] power. 62. That the Pope may give the kingdoms and principalities, and lordships of all those whom he judges heretics unto his Roman Catholics, or may adjudge them to those that can lay hold of them. 63. That ’tis not only lawful, but meritorious to kill princes that are excommunicated by the Pope.</p></blockquote>

<blockquote><p>Following the Revolutionary war, religious diversity in Connecticut continued to increase. In 1784, Connecticut finally passed an “Act for Securing the Rights of Conscience,” that secured religious freedom for those “professing the Christian religion,” of whatever denomination, and decreed they no longer be taxed to support the Congregational church. But non-Christians could be taxed to support the established church, and Congregationalism remained the established state religion until 1818, when Connecticut passed a new state constitution, replacing the laws of the old colonial charter obtained in 1662. This was not the end of the power and influence of the descendants of the Puritans, however…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nancy-finlay.html">Nancy Finlay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Importance of Being Puritan: Church and State in Colonial Connecticut’</cite></span></figcaption>

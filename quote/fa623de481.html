<main class="wrap"><figure class="quote" id="q-fa623de481" data-kw="">
<blockquote><p>2. Elections of governors would be performed as in the sight of God, and, in my weak apprehension, the person coming nearest to God’s judge, fearing God, hating covetousness, and to Moses’ king (Deut. 17), one who shall read in the book of the law; and it would seem now that gracious morals are to us instead of God’s immediate designation.

3. The genuine and intrinsical end of making kings is not simply governing, but governing the best way, in peace, honesty, and godliness (1 Tim. 2), therefore, these are to be made kings who may most expeditely procure this end. Neither is it my purpose to make him no king who is not a gracious man, only here I compare title with title.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 44</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8e381f417c" data-kw="">
<blockquote><p>But a king, by a sort of contingency, succeeds to kings; for nature does not ascertain us there must be kings to the world’s end, because the essence of governors is kept safe in aristocracy and democracy, though there were no kings; and that kings should necessarily have been in the world, if man had never fallen in sin, I am not, by any cogent argument, induced to believe. I conceive there should have been no government but those of fathers and children, husband and wife, and (which is improperly government) some more gifted with supervenient additions to nature, as gifts and excellencies of engines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 79 lt col top</span></figcaption>

</figure><figure class="quote" id="q-e7d02b7932" data-kw="">
<blockquote><p>…an official goodness, or a magistratical prudence, justice, and goodness; this is required of all magistrates, as such, to judge the people: so the acts of a heathen magistrate done according to common natural equity, by Nebuchadnezzar, Pilate, Caesar, Felix, Festus, are to be acknowledged as acts of a lawful magistrate, valid and no less essentially magistratical than if performed by King David; and of this goodness the Scriptures speak not as essential to a magistrate as a magistrate. [That is, a magistrate not doing these ennumerated things is still a valid magistrate.] For kings as kings intend justice, peace, godliness, materially considered, both ex conditione operis [from the nature of the magisterial work], and operantium [from the nature of the persons working by the office]. But for justice and righteous judgment in a spiritual and an evangelic way, that belongs not to the essence of a magistrate, nec ex conditione seu ex intentione operis, nec ex conditione operantis [neither from the nature or the intention of the work of magistracy, nor from the nature of the magistrate working]…</p></blockquote>

gistrate%20working" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2dbf753d25" data-kw="">
<blockquote><p>For the subject of royal power, we affirm, the first and ultimate, and native subject of all power is the community, as reasonable men naturally inclining to a society; but the ethical and political subject, or the legal and positive receptacle of this power is various, according to the various constitutions of the policy. In Scotland and England, it is the three estates of parliament; in other nations, some other judges or peers of the land.</p></blockquote>

</figure><figure class="quote" id="q-c1a9a1236c" data-kw="">
<blockquote><p>Man’s natural liberty is this: privilege of having and doing those things only to which the individual has a moral right. Consequently, the natural liberty of two men in the same commonwealth may be different, because under Providence, their natural endowments and relations may differ. Were it possible to frame a government thoroughly equitable, each person’s civic liberty would be identical with his natural: the privilege of having and doing all those things, and those only, to which each has a moral right.</p></blockquote>

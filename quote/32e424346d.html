<main class="wrap"><figure class="quote" id="q-32e424346d" data-kw="">
<blockquote><p>7. …Indeed the soul (as is aforesaid) is wholly hypostasis to the head, giving life to it and sustaining it: but where? not in every part of the body, but only in that where the head itself is: and out of the head [the soul] is also wholly hypostasis to the feet, sustaining them too: not where the head is, but where the feet themselves are. Is then the union which the soul has with the head dissolved because out of the head it is wholly also in the feet? 8. Finally, that all things which have been spoken of this personal union [of Christ in two natures], may more plainly be declared, I add these also: The soul is hypostasis to the eyes: to what eyes? such as they are: namely instruments used for sight, not for hearing: on the other side, to the ears, for hearing, not for seeing. So the Word was hypostasis to the human nature, not to destroy death, which was a property of the Word: but to suffer death, which was a property of the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>H. Zanchius his Confession of Christian Religion… (d. 1590; Cambridge, 1599), ‘Observations of the same Zanchius upon his Own Confession’, pp. 289-90 The context in point 7 is Zanchi arguing the validity of the extra Calvinisticum, that they person, or hypostasis of the Son exists outside of the human flesh according to his divinity. In point 8 it is the denial of the real communication of properties, via the Person, of the natures (contra the Lutherans).</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-dc78cdef29" data-kw="">
<blockquote><p>A distinction is real (simply real) if it exists between thing and thing, for example between body and soul, between the members of the body, between cause and effect, between a faculty and its operation, between substance and accidents. A thing, at least according to Scotists, is whatever exists or can exist per se (i.e. through its own existence), and hence, if it is created, it can be directly and immediately produced by physical causality. The sign of a real distinction is separability or actual separation. Thomists, on the contrary, deny that separability is required for having a real distinction. So they say, for example, that faculties are really distinct from the soul though they cannot be separated from it. One must say the like of their real distinction between essence and existence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alan-b-wolter.html">Alan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958), ch. 2, On the Attributes in General &amp; on ‘One”, Article 4, ‘On Identity &amp; Distinction’</cite>, p. 30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-de4599187b" data-kw="">
<blockquote><p>1. Theology is usually divided into the Theology of the Laity and the Theology of the Doctors, which they call argumentative and Scholastic. The former is a bare knowledge of the credibilia (as they call them) necessary for salvation. The latter is not a bare knowledge of the credibilia, but is the faculty by which we are able to explain, defend, and confirm the articles of faith, and to instruct others concerning their truth. 2. Argumentative or Scholastic Theology is said to exceed the Theology of the Laity in a twofold respect: first, because it extends itself to more credibilia; for learned men in spiritual matters understand more than the Laity and the simple. Secondly, because it is able to explain to others those things which are to be believed, and to defend and confirm them against Atheists, Jews, Mohammedans, and Pagans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baron.html">Robert Baron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Philosophy, the Handmaiden of Theology 2nd ed. trans. AI (1621; Robinson &amp; Davis, 1658), 3rd Exercise, art. 7</cite>, p. 91 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-000930b8b9" data-kw="">
<blockquote><p>The theology of Christians approves the teachings of philosophy if they are true, correct, and salutary. It uses them by its own right and makes them catholic. If they are too unclear, it sheds light on them; if they are mixed with harmful errors, it separates the precious from the cheap and keeps the one and destroys the other.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1a3b112e91" data-kw="">
<blockquote><p>Whosoever mistakes holy Scripture, does err. But the Church of Rome mistakes holy Scripture: Therefore the Church of Rome does err. Whosoever understands more or less in Scripture than the text does express, mistakes the Scripture. But the Church of Rome understands more in Scripture than the text does express:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anon.html">Anon.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘An Invincible Argument to Prove the Church of Rome to Err’ in Six Demands (from an Unlearned Protestant to a Learned Papist) so Forcible Against all Obstinate Papists that not any of Them are able to Reply without Absurd Equivocation… (London, 1609)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>
<div class="actions"><button class="copy" data-copy="“Whosoever mistakes holy Scripture, does err. But the Church of Rome mistakes holy Scripture: Therefore the Church of Rome does err. Whosoever understands more or less in Scripture than the text does express, mistakes the Scripture. But the Church of Rome understands more in Scripture than the text does express:”

— Anon., ‘An Invincible Argument to Prove the Church of Rome to Err’ in Six Demands (from an Unlearned Protestant to a Learned Papist) so Forcible Against all Obstinate Papists that not any of Them are able to Reply without Absurd Equivocation… (London, 1609)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhosoever+mistakes+holy+Scripture%2C+does+err.+But+the+Church+of+Rome+mistakes+holy+Scripture%3A+Therefore+the+Church+of+Rome+does+err.+Whosoever+understands+more+or+less+in+Scripture+than+the+text+does+express%2C+mistakes+the+Scripture.+But+the+Church+of+Rome+understands+more+in+Scripture+than+the+text+does+express%3A%E2%80%9D%0A%0A%E2%80%94+Anon.%2C+%E2%80%98An+Invincible+Argument+to+Prove+the+Church+of+Rome+to+Err%E2%80%99+in+Six+Demands+%28from+an+Unlearned+Protestant+to+a+Learned+Papist%29+so+Forcible+Against+all+Obstinate+Papists+that+not+any+of+Them+are+able+to+Reply+without+Absurd+Equivocation%E2%80%A6+%28London%2C+1609%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1a3b112e91.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1a3b112e91.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-doctrine-of-the-infallibility-of-the-papacy-councils-or-the-church/#:~:text=Whosoever%20mistakes%20holy%20Scripture%2C%20does%20err,Scripture%20than%20the%20text%20does%20express&amp;text=Whosoever%20mistakes%20holy%20Scripture%2C%20does%20err.%20But%20the&amp;text=more%20in%20Scripture%20than%20the%20text%20does%20express" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c73ac8b118" data-kw="">
<blockquote><p>At an earlier moment during the [Hague] Conference [1611], the attending Counter-Remonstrants—Ruard Acronius (d. 1611), Joannes Bogardus (d. 1614), Petrus Plancius (1552–1622), Joannes Becius (1558– 1626), Libertus Fraxinus (c.1547–c.1621), and Festus Hommius (1576– 1642)—had noted that the word “irresistible” was ambiguous and that even Jesuits were able to accommodate it within their theory of grace and human free choice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/irresistible-grace.html">Irresistible Grace</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aza Goudriaan, “Defending Grace: References to Dominicans, Jesuits &amp; Jansenists in Seventeenth-Century Dutch Reformed Theology” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019)</cite>, p. 284</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>
<div class="actions"><button class="copy" data-copy="“At an earlier moment during the [Hague] Conference [1611], the attending Counter-Remonstrants—Ruard Acronius (d. 1611), Joannes Bogardus (d. 1614), Petrus Plancius (1552–1622), Joannes Becius (1558– 1626), Libertus Fraxinus (c.1547–c.1621), and Festus Hommius (1576– 1642)—had noted that the word “irresistible” was ambiguous and that even Jesuits were able to accommodate it within their theory of grace and human free choice.”

— Irresistible Grace, Aza Goudriaan, “Defending Grace: References to Dominicans, Jesuits &amp; Jansenists in Seventeenth-Century Dutch Reformed Theology” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), p. 284">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAt+an+earlier+moment+during+the+%5BHague%5D+Conference+%5B1611%5D%2C+the+attending+Counter-Remonstrants%E2%80%94Ruard+Acronius+%28d.+1611%29%2C+Joannes+Bogardus+%28d.+1614%29%2C+Petrus+Plancius+%281552%E2%80%931622%29%2C+Joannes+Becius+%281558%E2%80%93+1626%29%2C+Libertus+Fraxinus+%28c.1547%E2%80%93c.1621%29%2C+and+Festus+Hommius+%281576%E2%80%93+1642%29%E2%80%94had+noted+that+the+word+%E2%80%9Cirresistible%E2%80%9D+was+ambiguous+and+that+even+Jesuits+were+able+to+accommodate+it+within+their+theory+of+grace+and+human+free+choice.%E2%80%9D%0A%0A%E2%80%94+Irresistible+Grace%2C+Aza+Goudriaan%2C+%E2%80%9CDefending+Grace%3A+References+to+Dominicans%2C+Jesuits+%26+Jansenists+in+Seventeenth-Century+Dutch+Reformed+Theology%E2%80%9D+in+eds.+Ballor%2C+Gaetano+%26+Sytsma%2C+Beyond+Dordt+%26+De+Auxiliis%3A+the+Dynamics+of+Protestant+%26+Catholic+Soteriology+in+the+Sixteenth+%26+Seventeenth+Centuries+%28Brill%2C+2019%29%2C+p.+284&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc73ac8b118.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c73ac8b118.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-jesuits/#:~:text=At%20an%20earlier%20moment%20during%20the,of%20grace%20and%20human%20free%20choice&amp;text=At%20an%20earlier%20moment%20during%20the%20%5BHague%5D%20Conference&amp;text=their%20theory%20of%20grace%20and%20human%20free%20choice" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-01dbabec62" data-kw="">
<blockquote><p>The state and condition of the church with respect unto them has utterly ceased; and nothing can be more vain than to pretend any succession unto them, in the whole or any part of their office, unless men can justify their claim unto it by any or all of those things which concurred unto it in the apostles, which they cannot do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Inquiry into the Original, Nature, Institution, Power, Order, and Communion of Evangelical Churches</cite>, ch. 3 (Works 15)</span></figcaption>

</figure><figure class="quote" id="q-ed477133ac" data-kw="">
<blockquote><p>Nor do I regard that as an honour whereby I know that my brethren lose their honour. For my honour is the honour of the universal Church: my honour is the solid vigour of my brethren. Then am I truly honoured when the honour due to all and each is not denied them. For if your Holiness calls me Universal Pope, you deny that you are yourself what you call me universally. But far be this from us. Away with words that inflate vanity and wound charity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-the-great.html">Gregory the Great</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters</cite>, bk. 8, ep. 30 (to Eulogius of Alexandria)</span></figcaption>

</figure><figure class="quote" id="q-743e53a7ea" data-kw="">
<blockquote><p>Objection 6. That is not the true religion nor a safe way to Heaven, which men can have no infallible certainty of. But the Protestant religion is such: For they all profess their Church to be fallible. Answer: [1.] We must distinguish between a man that may be deceived, and a man that is deceived: and between infallibility in the object, and in the subject or intellect. And between infallibility in the absolutely necessary points, and in some inferior smaller matters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Safe Religion, or Three Disputations for the Reformed catholic religion against Popery proving that Popery is against the Holy Scriptures, the unity of the catholic Church, the consent of the ancient doctors, the plainest reason and common judgment of sense itself (London: Miller, 1657) | Query: ‘Whether the Reformed Catholic Christian religion, commonly called Protestant, be a safe way to salvation?’</cite>, pp. 43-44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>

<blockquote><p>Concerning the humanity of our blessed Savior, that being a creature he might be depicted, I mean it was naturally capable of it: it was the great instrument of many actions, it conversed with mankind above thirty years together, it was the subject of great changes, and the matter of a long story, and the conduit of many excellent instructions, and therefore might without all question be described as well as Caesar’s or Meletius, Marc Anthony or the kings of the gentiles. It might be done: and the question being here only of the making or having of it, abstractedly from all other appendages or collateral considerations, I need say no more of it under this title; but that it is neither impious nor unreasonable of itself to have or to make the picture or image of Christ’s humanity, or rather of his human body. For against this there is neither reason nor religion; and if it be made accidentally unlawful, that is not of present consideration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ductor dubitantium</cite>, … (London, 1660), vol. 1, Of the Rule of Conscience, ch. 2, Rule 6, ‘Every thing in the Decalogue is not obligatory to Christians, is not a portion of the Moral or Natural law’ Taylor (1613–1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He was Arminian in outlook., p. 334</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8994f6114d" data-kw="">
<blockquote><p>As the religious homage done to an image, or even to elements, is in itself an external act of idolatry, insofar as the act is concerned, although the intention of such homage may be directed to God the Great First Cause, —so the act of kneeling to a piece of bread, seeing that, according to the ordinance, the whole man, internal and external, ought to be engaged in the elementary signs, is a relative act of worship and an adoration of the bread itself. The reason is: an intention to worship a material object is not of the essence of external adoration, as appears in a religious act of homage. Thus, the bending of the knee before the Babylonish image is an external act of worship, even though the three youths had no intention to worship any but the true God; and in like manner, those who, from fear or the hope of reward or vain-glory, bend the knee to Jeroboam’s golden calf (which the text clearly enough proclaims to have been done by the king himself, from no religious motive but the mere desire to rule), do pay ad- oration to the calf by the external act, although, no doubt, they may suppose the calf a mere created object and unworthy of honor,—because the act of homage, whether we mean it or not, is, from the ordinance of God and nature, a symbol of worship. Therefore, as the bread [in the Lord’s Supper] denotes the body of Christ (even though that idea be not present to the mind), so in like manner, kneeling, when used as a religious service, is the external adoration of that bread, in presence of which we bow as before the delegated representative of God, be our intention what it may.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters</cite>, (Edinburgh, 1894), pp. 193-94 Also reprinted by Banner of Truth. Rutherford is here quoting from some other public document, possibly from the Latin of David Calderwood’s Altar of Damascus, p. 595. | Letter 91, to Robert Gordon of Knockbrex</span></figcaption>

<blockquote><p>(2) To LOVE anything more than God, is to make it a god. If we love our ESTATE more than God, we make it a god.… The covetous man is called an idolater. Eph 5:5. Why so? Because he loves his estate more than God, and so makes it his god. Though he does not bow down to an idol, if he worships the engraved image in his coins, he is an idolater. That which has most of the heart, we make a god of. If we love our PLEASURE more than God, we make a god of it.… If we love our BELLY more than God, we make a god of it. “Whose god is their belly.” Phil 3:19.… But to mind nothing but the indulging of the appetite, is idolatry.… If we love a CHILD more than God, we make a god of it.… This is to make an idol of a child, and to set it in God’s place. Thus God is often provoked to take away our children. If we love the jewel more than him who gave it, God will take away the jewel, that our love may return to him again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, First Commandment (love as heart idolatry)</span></figcaption>

<blockquote><p>The reasons the man adds of this his assertion contain the grand plea of all idolaters, heathenish and antichristian: &quot;Whatever is given to them,&quot; saith he, &quot;who are in that subordination is given to God.&quot; So said the Pagans of old, so say the Papists at this day; all redounds to the glory of God, when they worship stocks and stones, because he appoints them so to do. And so said the Israelites when they worshipped the golden calf: &quot;It is a feast to Jehovah.&quot;</p></blockquote>

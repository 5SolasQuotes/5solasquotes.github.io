<main class="wrap"><figure class="quote" id="q-6f49634363" data-kw="">
<blockquote><p>There are a great many young men merchants who come from your parts, soberly (I believe) educated &amp; brought up at home, who, when they arrive here, are mere rakes, stop or stand at no sin or vice almost that falls in their way, swearing whoring Sabbath breaking drunkenness are as common vices, with a great many of them, as if they thought there was no evil in the commission of any of these; and as to their countenance of ministers that are of the principles of the church of Scotland, they are so far from it that they carry as if they were ashamed of their mother Church her principles &amp; ways, whatever is the religion of their pot &amp; lascivious companions that is theirs.

So that really a great many of them (yet are some, though very few, exceptions) are a perfect scandal to all religion &amp; a disgrace to that part of the world from whence they come, from which other &amp; better things had been here expected; I am sure if the parents &amp; principals of some of them knew their carriage &amp; behaviour in these parts it would be matter of very great sorrow &amp; grief to them. I propose this not out of any disregard I have to them, I am sure it is out of love to their souls.

I am glad to see my countrymen in these parts, neither do I speak so because of any particular affront or incivility received. I never met with any such, from any of them, but on the contrary, with very much civility &amp; respect, But I propose it, that some method might be fallen upon whereby this dreadful &amp; offensive grievance might be rectified. Query whether or not their parents &amp; employers could not oblige them to bring certificates of their inoffensive behaviour during their abode in these parts from ministers here to their own ministers &amp;c. at home.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-anderson.html">James Anderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Principal John Sterling, Newcastle upon Delaware, August 1716 in Charles Augustus Briggs, American Presbyterianism: Its Origin and Early History, Together with an Appendix of Letters and Documents of which have been Recently Discovered (New York: Charles Scribner’s Sons, 1885), lxxii-iii.</cite></span></figcaption>

<blockquote><p>In the midst of distinguishing biblical penal servitude from American slavery, the Synod of the Reformed Presbyterian Church of Scotland argued that the moral-judicial laws would form the basis for the civil codes of Christian nations during the church’s latter-day glory:

Those Hebrews alone were subjected to the servitude prescribed who had been convicted of some moral offence. There were especially, two crimes that were visited with this form of punishment – theft, for which they could make restitution, and the contraction of debt which they were unable to pay. How different the way which you act! It is not persons who have been guilty of offences deserving punishment, at the hand of the civil courts, that you are bringing into slavery, or keeping in it. Were you to seize upon all the incorrigible thieves, and all the fraudulent bankrupts that you could find in the Union, and carry them off to the plantations, to perform the labours you now exact from unoffending Africans, there would have been no ground for a charge of injustice. We would rather rejoice in your reviving the spirit of that sacred jurisprudence which was given in the volume of revelation by the Israelites, and which, we have no doubt, will yet furnish, in its great moral principles, the basis of that high judicial code which christian nations shall enjoy, when God will “make their officers peace, and their exactors righteousness.</p></blockquote>

<blockquote><p>In 1834 one of the Belfast newspapers contained the following announcement of the opening of a new covenanting meeting-house in the town. The newspaper was Anglican and politically conservative in outlook, yet it recognised the liberality of the Covenanters:

The new Meeting-house of the Second Congregation of the Reformed Presbyterians, commonly called Covenanters, lately erected in South College-street, in this town, is to be opened for public worship, on Sunday next, at two o’clock afternoon. The congregation, although small, have very spiritedly contributed nearly one-half the cost of the building of this plain, but very neat place of worship. It is not, we believe generally known that the Covenanters support their own poor, and they also very liberally contribute to works of general benevolence. They receive no aid from Government to assist in paying their Clergymen. […]</p></blockquote>

<blockquote><p>As Baillie explained, there were certain cases of necessity in which a presbytery could deem it expedient to appoint a temporary bishop, either to prevent schism schism and preserve the unity of the national church or to preside over an ecclesiastical assembly as moderator… The type of ‘superintendent’ of which Baillie approved in the ancient church was never granted powers of order or jurisdiction that were not also given to preaching presbyters… Ordination was given by divine right to the presbytery of Ephesus–not just the meeting of presbyters but the ‘office and grade of presbyter’ as described by St Jerome and Calvin–which continued to exist even after the ordination of Timothy as a bishop; a delegation, rather than relegation of powers of jurisdiction. Acts 20:17 and 28 both outlined the divine warrant of temporary, ambulatory pastors who were ‘given the power of determining doctrine and expelling heretics from the church by the Sacred Spirit’. Yet Baillie quickly affirmed that the superiority maintained in these loci were during periods when the church’s polity was in flux.</p></blockquote>

<blockquote><p>27. But ordinances about such circumstances as place, time and the like are rightly said by the best authorities to be partly divine and partly human. They are grounded in part upon the will of God because of their chief and primary purpose, and partly upon man’s prudence, insofar as a special observation agreeable to God’s will is concerned. If no human error is made in this matter, the ordinance is to be held as wholly divine. It is the will of God that the church meet at the most convenient hour of the day, all circumstances considered. If, therefore, no error occurs in estimating the circumstances, the hour assigned for meeting after due consideration must be acknowledged as if appointed by God.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2e02cb66de" data-kw="">
<blockquote><p>Others with my self hold that there is but two Covenants, the one a Covenant of Works, and the tree of life, was a Sacrament or sign and token of it, this was made with Adam before his fall and to all his posterity who come under it as soon as they take upon them his nature, for he did bear an Image for himself and all his posterity, so that if he had stood in his integrity he had conveyed his righteousness and holiness to all his posterity, and when he by sin defiled his nature, the whole race of mankind was polluted by him, and also he received a Covenant both for himself and all his posterity, and in case he had been faithful to it, all his posterity had stood with him, but he breaking that Covenant brought not only guilt upon himself but upon all his posterity with him, so that now there is none clean, no not one; how can he be clean that is born of a woman? Job 25:4. thus man’s nature is polluted.

And in regard of the Covenant, let every mouth be stopped, for all the world is become guilty before God, Rom. 3:29. for all have sinned and come short of the glory of God, Rom. 3:23. by one man sin entered into the world, and death by sin, and so death passed upon all men for that all have sinned, Rom. 5:12. so then all men by nature lie under the pollution and guilt of Adam’s sin, and liable to all the curses and penalties due unto them for breach of that Covenant.

But then there was a Covenant of grace which God the Father made with Jesus Christ from all eternity to save some of the posterity of Adam, and had not this Covenant been prepared ready against the fall of Adam to take place at the very moment of his fall, the Justice of God had immediately seized upon the whole Creation under Heaven, and consumed them to their first nothing, but then came Jesus Christ with the covenant in his hand saying, be gracious unto him, and deliver him from going down to the pit, I have found a ransom, Job 33:24. … the covenant of grace was made with Jesus Christ from all eternity, being a contract or plot of God the Father with God the Son from all eternity as mediator for the salvation of the Elect.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ae749ac6db" data-kw="">
<blockquote><p>Besides, consider this, that the covenant [of grace] is made in Jesus Christ. There are two Adams, he made a covenant with both: with the first Adam, he made a covenant, as with the common root of all mankind; but Adam brake the covenant, and so did all his members. But there is a second Adam, and all that are saved, are members of him as truly as we are of the first Adam: and he kept the covenant, and therefore if he stand, they shall stand also.</p></blockquote>

</figure><figure class="quote" id="q-0c9a8c1a34" data-kw="">
<blockquote><p>VI. Episcopius, and with him the Remonstrants, deny that a covenant of nature was made with Adam (“Institutiones theologica,” 2.1 in Opera theologica [1678], p. 23); but it can be proved. (1) There are granted the essential parties of a covenant, God and man. God, who as the Creator of man, must also be his governor and from this, his legislator, and because good in his own nature, the rewarder also of those who seek him (Heb. 11:6), so that he would not only give him a law for his direction, but also hold forth a reward to him for keeping it (although bound by no right to that). Man who, because a creature, must also wholly depend upon God and, because upright, could keep the inscribed law, and because rational, ought not otherwise than in a rational manner (i.e., by the intellect and will) be governed, both by the prescription of a law, the promise of rewards and the threatening of punishment. Also since he was created after the image of divine holiness, he ought to have been led to a communion of that happiness also which is the inseparable attendant of holiness.

VII. Second, a law was imposed upon Adam, which necessarily implies a federal agreement and contract. For he who receives it, binds himself officially to obedience under the punishment denounced through the same; he who gives it (for the very reason that he exacts obedience) is bound to furnish indemnity and security to the one obeying. Although Moses sets forth only one part of that federal sanction (referring to punishment, Gen. 2:17), still he proves that the former concerning the promise should not be excluded, both from the sacrament of the tree of life (by which it was sealed) and from the threatening of death (which by reason of contraries had the implied promise of life and from the various passages of Scripture which express more clearly the nature and sanction of the law, as Lev. 18:5—“If a man do these, he shall live in them,” cf. Dt. 27:26; Ezk. 20:11; Mt. 19:17; Gal. 3:12).

VIII. Third, the passage in Hos. 6:7 seems not obscurely to intimate this: the Israelites are said to have “transgressed the covenant like Adam” (hmh k’dhm ‘bhrv bhryth). For although these words may also be explained of the inconstancy of men (that they may be said to have transgressed the covenant as men are wont to do, who are naturally false and fickle, and often deceive expectation), still nothing prevents their being referred also to Adam (that they may be said to have violated the covenant like Adam, their first parent, who miserably broke the covenant contracted with him by God). A similar locution occurs in Job 31:33: “If I covered,” says he, “my transgressions as Adam [k’dhm].” Here is a manifest reference to the fact of Adam’s endeavoring to excuse and hide his sin (Gen. 3:12).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg: P&amp;R Publishing, 1992–97), 575–76 (8.3.6–8).</span></figcaption>

<blockquote><p>7. Lastly, In his person. Being a sinful man under the covenant of works, he is a cursed man; For it is written, “Cursed is every one that continueth not in all things which are written in the book of the law to do them.” The curse fixeth not only on what is his, but on himself; and it is for his sake that it is laid on other things. The curse, as you have heard, is on his soul, and on his body; for wherever sin is found under this covenant, there the curse also is And, (1.) The man is under the power of Satan, Acts 26:18. Into the hand of this enemy man fell, when he broke the covenant of works. Satan having waged war against heaven, set on man, heaven’s confederate, and gained the unhappy victory, gained him by temptation to renounce his allegiance to his rightful Lord by breaking the covenant, and so he fell under his power, as his captive taken in war, Isa. 49:24, was brought under bondage to this worst of masters, 2 Pet. 2:19, and is ruled by him at his pleasure, 2 Tim. 2 ult. The curse of the covenant falling on the covenant-breaker, he is thereby laid under condemnation, and adjudged to death according to the threatening; and so he falls under the power of him that has the power of death, that is the devil, Heb. 2:14. Every natural man is shut up as in a prison, in his natural state; and there he lies in bonds, Isa. 61:1. There are God’s bands on him, the bands of the curse binding him over to death; and the devil’s bands are on him, viz, the bands of strong lusts and corruptions, with which they are laden, as a malefactor in prison is laden with irons. And Satan has the power of gaoler over them. He keeps the keys of the prison, and narrowly watches the prisoners that none of them escape. They are not all kept alike close; but none of them can move beyond the bounds of his jurisdiction, more than the prisoner can get out of the dungeon. Even when the king’s word comes to deliver the elect, he will not yield them up; but the prison doors must be broke open, and they forcibly taken out of his hand by a stronger than he. (3.) The natural man being under the curse is continually in hazard of utter destruction, of having the copestone put on his misery, and being set beyond all possibility of help. If his eyes were opened he would see himself every moment in danger of dropping down into the pit of hell; Psalm 7:12, “If he turn not, he will whet his sword; he hath bent his bow, and made it ready.” The man is constantly standing before God’s bent bow, and has nothing to secure him one moment from the drawing of it. The sentence of death is passed against him, John 3:18, but there is no day intimated for the execution, but every day the dead warrant may be signed against him, and he led forth to death. His name may be “Magor-missabib,” a terror round about, Jer. 20:3. Whither can he look where he will not see his enemies ready to ruin him, on a word of command from that God under whose curse he lies? And what can he do for himself amidst his armed enemies? He is quite naked, Rev. 3:17, and cannot fight them; he is without strength, Rom. 5:6, and cannot wield armour, though he had it; he is bound hand and foot, Isa. 61:1, and cannot flee; and if he could, whither could he flee for safety? Heaven’s gates are shut upon him; in the utmost parts of the earth, or the most remote rock in the sea, God’s hand would find him out. Justice is pursuing the criminals under the curse, crying for vengeance on the traitors, and their foot shall certainly slide in due time; the law is continually throwing the fire-balls of its curses on them, and will at length set them on fire round about; death is on the pursuit after them, and has gained much ground of them already, and the cloud of wrath hangs over their heads continually in the curse, and the small rain of God’s wrath is still falling on them; how soon death may overtake them, they know not; and then the cloud breaks, and the great rain of his strength falls down upon them, and sweeps them away without hope for ever and ever.</p></blockquote>

<blockquote><p>All natural and unregenerate men function entirely within the context of the covenant of works, and regardless of what their religious mindset may be, their singular objective is to be justified before God by their own merits and by the works of the law. Therefore, if they hear any mention made of a covenant that is purely and freely gracious in and through the crucified surety and mediator Christ Jesus, or if they are directed to anything other than this covenant of grace and to this mediator, being called upon to lay aside and fully to forsake all their own strength and righteousness, and admonished from the Holy Scriptures that they are to believe alone in Him who justifies the ungodly because they are unable to accomplish anything themselves—I say, the moment this occurs, these people are of the opinion that such a faith will render them careless, whereby sin will then necessarily have dominion over them. Natural men have always thus judged the doctrine of salvation by grace alone.</p></blockquote>

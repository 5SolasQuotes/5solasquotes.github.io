<main class="wrap"><figure class="quote" id="q-d91f707b5a" data-kw="">
<blockquote><p>1 John iv. 16, “God is love,” not only subjectively, infinitely loving; but objectively, wholly lovely. And so he is in the eyes of all who live to his praise. To them the Father is lovely, the Son lovely, the Holy Spirit lovely. Every attribute of God is lovely. The holiness and purity of his nature, the great eye-sore of carnal men, is most lovely to them: Exod. xv. 11, “Who is like unto thee, Lord, glorious in holiness, fearful in praises, doing wonders?” Psalm xxx. 4, “Sing unto the Lord, ye saints of his, and give thanks at the remembrance of his holiness.” His works are lovely. The creation of the world is a lovely work; the guiding of it by providence a lovely work; but the most lovely is the redemption of the world by the blood of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Peculiar Mercy and Business of Life, Opened Up, and Applied (1727) in The Works of Thomas Boston</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god.html">Attributes of God</a></span></div>

<blockquote><p>Now, in the cross of Christ, all the divine attributes are perfectly harmonized. Here it is, and only here, that “mercy and truth have met together, righteousness and peace have kissed each other.” By the cross, every attribute of the Deity is shown immaculate, and beaming with a splendour nowhere else to be seen.

The highest display of the glory of God ever made to the universe, was made by the cross of Christ. This glory is here seen, not only to be consistent with the salvation of penitent offenders, but to shine the brightest of all, in the very act of saving the chief of sinners— “Where sin abounded, grace did much more abound.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ashbel-green.html">Ashbel Green</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ crucified, the characteristic of Apostolic preaching: a sermon delivered in the First Presbyterian Church of Philadelphia, at the opening of the General Assembly of the Presbyterian Church in the United States, May 19, 1825</cite>, (Philadelphia: Clark &amp; Raser, 1825), p. 21.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god.html">Attributes of God</a></span></div>

</figure><figure class="quote" id="q-3a779fe462" data-kw="">
<blockquote><p>Do you contemplate, O man, the most immaculate Lord, hanging on the cross: and do you dare, O impudent and unhappy man, to spend your whole time of your life on earth in delights and laughter? Do you not know, O miserable and impudent one, that He who was crucified for you as Lord will demand an account from you for all these negligences and contempts? Now indeed, while you hear this, you neglect it, you laugh in delights; and free from all care, you see yourself as free: but that terrible day will surely come, the day of vengeance, and you will mourn without end and cry out because of your pains in the eternal fire: and there will be absolutely no one there to answer and to have mercy on your soul.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-3f0a411569" data-kw="">
<blockquote><p>In vain [it is] to participate of those mysteries of our salvation, the body and blood of our Lord, till first by self-examination we have cast out the venom of our sinful doings by repentance and steadfast purposes of amendment. In a word, it is our sins unrepented that make void and ineffectual all the blessed means of grace and of the Spirit; by those it is we quench the Spirit, we grieve the Spirit, we resist the Spirit, we provoke the Spirit (1 Thess. 5:19; Eph. 4:30), and poison the blessed nature of life; so that all the conveyances of the Spirit are barren and unfruitful whilst they reflect upon hardened and impenitent hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sherlock.html">Richard Sherlock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Quakers’ Wild Questions Objected against the Ministers of the Gospel</cite>, … with Brief Answers Thereunto... (London: Cotes, 1654) Sherlock (1612–1689) was an Anglican clergyman., p. 155</span></figcaption>

</figure><figure class="quote" id="q-7292ee5fa0" data-kw="">
<blockquote><p>Again, some school-divines following Damascene make and ascribe to God an applied or depending [consequent] will, on this manner: God for his part [antecedently] would have all men without exception to be saved: why then are they not saved? They themselves will not. And because they will not, God therefore [consequently] chooses some and refuses others. But according to the former doctrine, I take this kind of applied will to be an invention of man’s brain. For the contrary is the truth, namely that man’s will wholly depends on the will of God. That vessels be some of honor, some of dishonor, it is not in the power of the clay, but in the will of the potter. The first cause orders the second, and not the second the first. To make God’s will depend on man’s will, is to put God out of his throne of majesty, and to set the creature in his room. Others set forth the depending will of God on this manner: God (say they) decrees nothing in particular of things that are casual and contingent, but He foresees within Himself what the will of the creature will do or not do, when things are thus or thus ordered: and upon this foresight He consequently determines what shall be done. (Bellarmine, bk. 4, ch. 15, Of Grace &amp; Free Will; Richard Tapper) But this opinion, as it gives unto God a common or general providence, so it takes away the certain determination of God touching all particular events. And it is absurd to think that God should foresee the future acts of man’s freewill, when as yet He has determined nothing: for things that shall be, are therefore to come to pass, because God by decree has determined their being. And therefore the foreknowledge of things that shall be follows the decree of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of God’s Free Grace &amp; Man’s Free Will</cite>, (Cambridge, 1601), pp. 146-48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“Again, some school-divines following Damascene make and ascribe to God an applied or depending [consequent] will, on this manner: God for his part [antecedently] would have all men without exception to be saved: why then are they not saved? They themselves will not. And because they will not, God therefore [consequently] chooses some and refuses others. But according to the former doctrine, I take this kind of applied will to be an invention of man’s brain. For the contrary is the truth, namely that man’s will wholly depends on the will of God. That vessels be some of honor, some of dishonor, it is not in the power of the clay, but in the will of the potter. The first cause orders the second, and not the second the first. To make God’s will depend on man’s will, is to put God out of his throne of majesty, and to set the creature in his room. Others set forth the depending will of God on this manner: God (say they) decrees nothing in particular of things that are casual and contingent, but He foresees within Himself what the will of the creature will do or not do, when things are thus or thus ordered: and upon this foresight He consequently determines what shall be done. (Bellarmine, bk. 4, ch. 15, Of Grace &amp; Free Will; Richard Tapper) But this opinion, as it gives unto God a common or general providence, so it takes away the certain determination of God touching all particular events. And it is absurd to think that God should foresee the future acts of man’s freewill, when as yet He has determined nothing: for things that shall be, are therefore to come to pass, because God by decree has determined their being. And therefore the foreknowledge of things that shall be follows the decree of God.”

+the+decree+of+God.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Treatise+of+God%E2%80%99s+Free+Grace+%26+Man%E2%80%99s+Free+Will%2C+%28Cambridge%2C+1601%29%2C+pp.+146-48&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7292ee5fa0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7292ee5fa0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=Again%2C%20some%20school%2Ddivines%20following%20Damascene%20make,be%20follows%20the%20decree%20of%20God&amp;text=Again%2C%20some%20school%2Ddivines%20following%20Damascene%20make%20and%20ascribe&amp;text=that%20shall%20be%20follows%20the%20decree%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

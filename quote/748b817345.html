</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-744a60eec1" data-kw="">
<blockquote><p>5. He that mistakingly thinks any thing is good or bad, duty or sin, which is not so, will be zealous in pursuit of his mistake, if he be serious for God: A good principle will hasten him on in a wrong way, whatever it cost him.

6. Ignorance and timerousness cause superstition, which is a conceit that God is [thought to be] pleased by overdoing in external things, and observances and laws of their own making, and so they that make part of their own religion superstitiously (as most good people do in some things through ignorance) will censure all others as good or bad, by the measure of their own mistakes.

7. He that thus mistakingly thinks that men sin when they do not, will have a proportionable dislike of them and aversation from them: And will be ready to speak as he thinks of them and so will be guilty of calumny and calling evil good, and good evil. …

18. And the Church will always have many hypocrites, who quiet their consciences by adhering to the strictest ministers and churches, instead of a mortified, holy and heavenly heart and conversation [conduct].

19. And lastly, persecution and hatred from others, and the due love of godly persons, tempts too many ministers to over-run their own judgments and follow the more censorious sort of persons further than they ought (at least by connivence) and to be ruled by those whom they should rule. And thus divisions are occasioned even by piety itself.</p></blockquote>

</figure><figure class="quote" id="q-96cc71b43c" data-kw="">
<blockquote><p>Almost all our contentions and divisions are caused by the ignorance and injudiciousness of Christians, especially the most self-conceited. They are for the most as children, that yet need to be taught the very principles of the divine oracles, and to be fed with milk when they think themselves fit to be teachers of others, Heb. 5:11-12, and therefore [are] as children they are tossed to and fro and caried about with every wind of doctrine, Eph. 4:14. And when they have many years together been crying up an opinion and vilifying dissenters, at last they turn to some other opinion and confess that they did all this upon mistake. And was it not a pitiful life that they lived that while? and a pitiful zeal which did set them on? and a pitiful kind of worship which they thus offered to God? Alas to hear a man pray and preach up Antinomianism one year, and Arminianism the next, and Socinianism the next! To hear a man make Separation and Anabaptistry a great part of his business to men in preaching and to God in prayer for seven and seven years together; and at last confess that all this was his error and his sin (or if he confess it not, it is so much the worse). Is it not sad that ignorance and hasty rashness should so much injure the Church and men’s souls that so many well-meaning people should put evil for good and good for evil, darkness for light and light for darkness, Isa. 5:20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 40, ‘Labour for a sound judgment to know good from evil, lest you trouble yourselves and others by mistakes: And till you grow so judicious, forsake not the guidance of a judicious teacher, nor the company of the agreeing generality of the Godly’, pp. 212-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-51018e08f6" data-kw="">
<blockquote><p>There be two happy things (worthy Reader), as one says, ‘The one is not to err, the other is to escape from the power of error.’ (Cassian, De incarnatione, bk. 1, ch. 4) Time’s womb brings forth many truths, though truth be not a debtor to time, because time puts new robes on old Truth; but truth is God’s debtor and owes her being to Him only. It is a great evil under the sun and the sickness of man’s vanity that the name of holy men should be a web to make garments of for new opinions, but the errors of holy men have no whiteness, nor holiness from men. And it is a wrong that men’s praise should be truth’s prejudice, and men’s gain, truth’s loss. Yet I shall heartily desire that men herein observe the art of deep providence, for the Creator commands darkness to bring forth her birth of light, and God does so over-awe, with a wise super-dominion, men’s errors, that contrary to nature’s way, from collision of opinions, results truth; and disputes, as stricken flint, cast fire for light, God raising out of the dust and ashes of errors a new living truth. What mistakes, errors, or heresies have been anent Church government, that vigilant and never slumbering wisdom of providence has thence made to appear the sound doctrine of God’s Kingdom. So here Satan shapes and God sews and makes the garment. Error is but dregs, by the artifice of all compassing Providence, from whence are distilled strong and cordial waters. And what Antichrist has conceived for a hierarchy and human ceremonies, has put Christ in his two witnesses in Britain to advocate for the truth and native simplicity of his own Kingdom. But I heartily desire not to appear as an adversary to the holy, reverend and learned [congregationalist] Brethren who are sufferers for the truth, for there be wide marches betwixt striving and disputing. Why should we strive? for we be brethren, the sons of one father, the born citizens of one mother Jerusalem. To dispute is not to contend. We strive as we are carnal, we dispute as we are men, we war from our lusts, we dispute from diversity of starlight and daylight. Weakness is not wickedness, a roving of wit must not be deemed a rebellion of will, a broken engine may part with a dead child and yet be a mother of many healthy children. And while our reverend and dear Brethren, fleeing the coast of Egypt and Babylon’s wicked borders, aim to shore upon truth, wind may deceive good sailors; natural land-motions (as when heavy bodies move downward toward their own (clay country) are upon a straight line. But sea-motions of sailing are not by right lines, but rather by sea-circles. We often argue and dispute as we sail. Where grace and weight of Scripture make motion, we walk in a right line toward God. But where opinion, a messenger only sent to spy the Land of lies and truth, usurps to conduct us, what marvel then we go about truth rather than lodge with truth. And Christ his Kingdom, scepter, glory, Babylon’s fall, be the material object of opinions, on both sides; and yet the Word of God has a right lith [joint], that cannot suffer division. In God’s matters there be not as in grammar the positive and comparative degrees: there are not here truth, and more true, and most true. Truth is in an indivisible line, which has no latitude and cannot admit of splitting. And therefore we may make use of the Philosopher’s word, amicus Socrates, amicus Plato, sed magis amica veritas [Socrates a friend, Plato a friend, but most of all, truth is a friend]. Though Peter and Paul be our beloved friends, yet the truth is a dearer friend: The sons of Babylon make outcries of divisions and diversity of religions amongst us, but every opinion is not a new religion. … But I leave off, and beg from the Reader candor and ingenuous and fair dealing; from Formalists, men in the way to Babylon, I may wish this, I cannot hope it. Farewell.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (London, 1644) | ‘To the Reader’</span></figcaption>

<div class="actions"><button class="copy" data-copy="“There be two happy things (worthy Reader), as one says, ‘The one is not to err, the other is to escape from the power of error.’ (Cassian, De incarnatione, bk. 1, ch. 4) Time’s womb brings forth many truths, though truth be not a debtor to time, because time puts new robes on old Truth; but truth is God’s debtor and owes her being to Him only. It is a great evil under the sun and the sickness of man’s vanity that the name of holy men should be a web to make garments of for new opinions, but the errors of holy men have no whiteness, nor holiness from men. And it is a wrong that men’s praise should be truth’s prejudice, and men’s gain, truth’s loss. Yet I shall heartily desire that men herein observe the art of deep providence, for the Creator commands darkness to bring forth her birth of light, and God does so over-awe, with a wise super-dominion, men’s errors, that contrary to nature’s way, from collision of opinions, results truth; and disputes, as stricken flint, cast fire for light, God raising out of the dust and ashes of errors a new living truth. What mistakes, errors, or heresies have been anent Church government, that vigilant and never slumbering wisdom of providence has thence made to appear the sound doctrine of God’s Kingdom. So here Satan shapes and God sews and makes the garment. Error is but dregs, by the artifice of all compassing Providence, from whence are distilled strong and cordial waters. And what Antichrist has conceived for a hierarchy and human ceremonies, has put Christ in his two witnesses in Britain to advocate for the truth and native simplicity of his own Kingdom. But I heartily desire not to appear as an adversary to the holy, reverend and learned [congregationalist] Brethren who are sufferers for the truth, for there be wide marches betwixt striving and disputing. Why should we strive? for we be brethren, the sons of one father, the born citizens of one mother Jerusalem. To dispute is not to contend. We strive as we are carnal, we dispute as we are men, we war from our lusts, we dispute from diversity of starlight and daylight. Weakness is not wickedness, a roving of wit must not be deemed a rebellion of will, a broken engine may part with a dead child and yet be a mother of many healthy children. And while our reverend and dear Brethren, fleeing the coast of Egypt and Babylon’s wicked borders, aim to shore upon truth, wind may deceive good sailors; natural land-motions (as when heavy bodies move downward toward their own (clay country) are upon a straight line. But sea-motions of sailing are not by right lines, but rather by sea-circles. We often argue and dispute as we sail. Where grace and weight of Scripture make motion, we walk in a right line toward God. But where opinion, a messenger only sent to spy the Land of lies and truth, usurps to conduct us, what marvel then we go about truth rather than lodge with truth. And Christ his Kingdom, scepter, glory, Babylon’s fall, be the material object of opinions, on both sides; and yet the Word of God has a right lith [joint], that cannot suffer division. In God’s matters there be not as in grammar the positive and comparative degrees: there are not here truth, and more true, and most true. Truth is in an indivisible line, which has no latitude and cannot admit of splitting. And therefore we may make use of the Philosopher’s word, amicus Socrates, amicus Plato, sed magis amica veritas [Socrates a friend, Plato a friend, but most of all, truth is a friend]. Though Peter and Paul be our beloved friends, yet the truth is a dearer friend: The sons of Babylon make outcries of divisions and diversity of religions amongst us, but every opinion is not a new religion. … But I leave off, and beg from the Reader candor and ingenuous and fair dealing; from Formalists, men in the way to Babylon, I may wish this, I cannot hope it. Farewell.”

— Samuel Rutherford, The Due Right of Presbyteries... (London, 1644) | ‘To the Reader’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+be+two+happy+things+%28worthy+Reader%29%2C+as+one+says%2C+%E2%80%98The+one+is+not+to+err%2C+the+other+is+to+escape+from+the+power+of+error.%E2%80%99+%28Cassian%2C+De+incarnatione%2C+bk.+1%2C+ch.+4%29+Time%E2%80%99s+womb+brings+forth+many+truths%2C+though+truth+be+not+a+debtor+to+time%2C+because+time+puts+new+robes+on+old+Truth%3B+but+truth+is+God%E2%80%99s+debtor+and+owes+her+being+to+Him+only.+It+is+a+great+evil+under+the+sun+and+the+sickness+of+man%E2%80%99s+vanity+that+the+name+of+holy+men+should+be+a+web+to+make+garments+of+for+new+opinions%2C+but+the+errors+of+holy+men+have+no+whiteness%2C+nor+holiness+from+men.+And+it+is+a+wrong+that+men%E2%80%99s+praise+should+be+truth%E2%80%99s+prejudice%2C+and+men%E2%80%99s+gain%2C+truth%E2%80%99s+loss.+Yet+I+shall+heartily+desire+that+men+herein+observe+the+art+of+deep+providence%2C+for+the+Creator+commands+darkness+to+bring+forth+her+birth+of+light%2C+and+God+does+so+over-awe%2C+with+a+wise+super-dominion%2C+men%E2%80%99s+errors%2C+that+contrary+to+nature%E2%80%99s+way%2C+from+collision+of+opinions%2C+results+truth%3B+and+disputes%2C+as+stricken+flint%2C+cast+fire+for+light%2C+God+raising+out+of+the+dust+and+ashes+of+errors+a+new+living+truth.+What+mistakes%2C+errors%2C+or+heresies+have+been+anent+Church+government%2C+that+vigilant+and+never+slumbering+wisdom+of+providence+has+thence+made+to+appear+the+sound+doctrine+of+God%E2%80%99s+Kingdom.+So+here+Satan+shapes+and+God+sews+and+makes+the+garment.+Error+is+but+dregs%2C+by+the+artifice+of+all+compassing+Providence%2C+from+whence+are+distilled+strong+and+cordial+waters.+And+what+Antichrist+has+conceived+for+a+hierarchy+and+human+ceremonies%2C+has+put+Christ+in+his+two+witnesses+in+Britain+to+advocate+for+the+truth+and+native+simplicity+of+his+own+Kingdom.+But+I+heartily+desire+not+to+appear+as+an+adversary+to+the+holy%2C+reverend+and+learned+%5Bcongregationalist%5D+Brethren+who+are+sufferers+for+the+truth%2C+for+there+be+wide+marches+betwixt+striving+and+disputing.+Why+should+we+strive%3F+for+we+be+brethren%2C+the+sons+of+one+father%2C+the+born+citizens+of+one+mother+Jerusalem.+To+dispute+is+not+to+contend.+We+strive+as+we+are+carnal%2C+we+dispute+as+we+are+men%2C+we+war+from+our+lusts%2C+we+dispute+from+diversity+of+starlight+and+daylight.+Weakness+is+not+wickedness%2C+a+roving+of+wit+must+not+be+deemed+a+rebellion+of+will%2C+a+broken+engine+may+part+with+a+dead+child+and+yet+be+a+mother+of+many+healthy+children.+And+while+our+reverend+and+dear+Brethren%2C+fleeing+the+coast+of+Egypt+and+Babylon%E2%80%99s+wicked+borders%2C+aim+to+shore+upon+truth%2C+wind+may+deceive+good+sailors%3B+natural+land-motions+%28as+when+heavy+bodies+move+downward+toward+their+own+%28clay+country%29+are+upon+a+straight+line.+But+sea-motions+of+sailing+are+not+by+right+lines%2C+but+rather+by+sea-circles.+We+often+argue+and+dispute+as+we+sail.+Where+grace+and+weight+of+Scripture+make+motion%2C+we+walk+in+a+right+line+toward+God.+But+where+opinion%2C+a+messenger+only+sent+to+spy+the+Land+of+lies+and+truth%2C+usurps+to+conduct+us%2C+what+marvel+then+we+go+about+truth+rather+than+lodge+with+truth.+And+Christ+his+Kingdom%2C+scepter%2C+glory%2C+Babylon%E2%80%99s+fall%2C+be+the+material+object+of+opinions%2C+on+both+sides%3B+and+yet+the+Word+of+God+has+a+right+lith+%5Bjoint%5D%2C+that+cannot+suffer+division.+In+God%E2%80%99s+matters+there+be+not+as+in+grammar+the+positive+and+comparative+degrees%3A+there+are+not+here+truth%2C+and+more+true%2C+and+most+true.+Truth+is+in+an+indivisible+line%2C+which+has+no+latitude+and+cannot+admit+of+splitting.+And+therefore+we+may+make+use+of+the+Philosopher%E2%80%99s+word%2C+amicus+Socrates%2C+amicus+Plato%2C+sed+magis+amica+veritas+%5BSocrates+a+friend%2C+Plato+a+friend%2C+but+most+of+all%2C+truth+is+a+friend%5D.+Though+Peter+and+Paul+be+our+beloved+friends%2C+yet+the+truth+is+a+dearer+friend%3A+The+sons+of+Babylon+make+outcries+of+divisions+and+diversity+of+religions+amongst+us%2C+but+every+opinion+is+not+a+new+religion.+%E2%80%A6+But+I+leave+off%2C+and+beg+from+the+Reader+candor+and+ingenuous+and+fair+dealing%3B+from+Formalists%2C+men+in+the+way+to+Babylon%2C+I+may+wish+this%2C+I+cannot+hope+it.+Farewell.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries...+%28London%2C+1644%29+%7C+%E2%80%98To+the+Reader%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F51018e08f6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/51018e08f6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-truth/#:~:text=There%20be%20two%20happy%20things%20%28worthy,this%2C%20I%20cannot%20hope%20it.%20Farewell&amp;text=There%20be%20two%20happy%20things%20%28worthy%20Reader%29%2C%20as&amp;text=may%20wish%20this%2C%20I%20cannot%20hope%20it.%20Farewell" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-48053d5be3" data-kw="">
<blockquote><p>He who is clean of hands, and pure of heart. Under the purity of the hands and of the heart, and the reverence of God’s name, he comprehends all religion, and denotes a well ordered life. True purity, no doubt, has its seat in the heart, but it manifests its fruits in the works of the hands. The Psalmist, therefore, very properly joins to a pure heart the purity of the whole life; for that man acts a ridiculous part who boasts of having a sound heart, if he does not show by his fruits that the root is good. On the other hand, it will not suffice to frame the hands, feet, and eyes, according to the rule of righteousness, unless purity of heart precede outward continence.

If any man should think it absurd that the first place is given to the hands, we answer without hesitation, that effects are often named before their causes, not that they precede them in order, but because it is sometimes advantageous to begin with things which are best known. David, then, would have the Jews to bring into the presence of God pure hands, and these along with an unfeigned heart. To lift up, or to take his soul, I have no doubt is here put for to swear. It is, therefore, here required of the servants of God, that when they swear, they do it with reverence and in good conscience, and, under one particular, by synecdoche, is denoted the duty of observing fidelity and integrity in all the affairs of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of Psalms</cite>, (1557), trans. James Anderson in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 4b: 405-06.</span></figcaption>

<blockquote><p>Q. 11. Is all use of images unlawful? A. God did so much hate idolatry and the neighborhood of the idolaters made it so dangerous to the Israelites that He did not only forbid the worshipping of images, but all such making or using of them as might become a snare or temptation to any. So that though it be lawful to make images for civil uses, and when they are made, to fetch holy thoughts or meditation from them, as from all other creatures or things in the world, yet in any case when they become a snare or danger (being not necessary things, they become a sin to those that so use them as [a] snare to others or themselves. Ex. 34:13-15; Num. 33:52; Dt. 7:2; Kn. 11:18 &amp; 23; 14:24. Q. 12. Is it lawful to make any picture of God? A. No: for pictures are the signs of corporeal things, and it is blasphemy to think God like a bodily substance: But it is lawful to make such pictures (as of a glorious light) from which occasion may be taken of good thoughts concerning God. Ex. 25:18, 1•… 20; 1 Sam. 4:4; Ps. 18:1; Eze. 10:2. Q. 13. Is it lawful to make the picture of Christ as man, or as crucified? A. The doing it as such is not forbidden, nor the right use of it when done: But the abuse, i.e. the worshipping of it or of Christ by it, is forbidden and the making or using such when it tends to such abuse and has more of snare than profit.</p></blockquote>

<blockquote><p>In his book, English Popish Ceremonies, George Gillespie points out that the English Puritans and the Scottish Covenanters were not the only people in the Reformed world who opposed the religious observance of extra-biblical festivals (holy days were called holidays in Gillespie’s time):

As touching the judgment of divines, we say 1. Many divines disallow of festival days, and wish the church, were free of them. For the Belgic churches, in their synod, anno 1578, wished that the six days might be wrought upon, and that the Lord’s day alone might be celebrated. And Luther in his book, de Bonis Operibus, wished that there were no feast-days among Christians but the Lord’s day. […] The old Waldenses also, whose doctrine was restored and propagated by John Huss, and Jerome of Prague, after Wicklif, and that with the congratulation of the church of Constantinople, held, that they were to rest from labour upon no day but upon the Lord’s day, whereby it appeareth that holidays have had adversaries before us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dispute against the English Popish ceremonies obtruded on the Church of Scotland</cite>, (1637; Edinburgh, 1844), p. 22.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

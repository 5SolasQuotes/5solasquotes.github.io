</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4528bb1e4b" data-kw="">
<blockquote><p>XIV. Works can be considered three ways: either with reference to justification or sanctification or glorification. They are related to justification not antecedently, efficiently and meritoriously, but consequently and declaratively. They are related to sanctification constitutively because they constitute and promote it. They are related to glorification antecedently and ordinatively because they are related to it as the means to the end; yea, as the beginning to the complement because grace is glory begun, as glory is grace consummated.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-48366ee3a0" data-kw="">
<blockquote><p>§V. As to liberty itself; there remained in the will of lapsed man: 1. Immunity from the necessity of coaction, or external violence, by reason of elicited acts. 2. Immunity from internal physical necessity. 3. The liberty of exercise or of contradiction, which is between willing or not willing; loving or not loving; acting or not acting. 4. The liberty of specification, by which the will, from two or more things or species which can be recalled to the sphere of doable things in the state of corruption, can choose one and neglect another. §VI. The objects which pertain to the sphere of doable things in the state of reigning corruption, before conversion, are all those things which are subject to the senses and to natural reason, and do not surpass human grasp. And they are: 1. Actions merely natural and animal, e.g., to eat, to drink, to be awake, to sleep, to be moved from a place, to rest. 2. The inventions or apprehensions of sciences and arts, concerning which see Calvin, Institutes, bk. 2, ch. 2, §14. 3. Civil and economic actions, such as to care for a family and the commonwealth, and in them to do or omit one’s duty. 4. Moral actions of the natural order, and those which pertain to common ethics, Rom. 2:14-15… Hence the virtues of the gentiles, produced by the general aid of God, as to their substance, are true moral virtues of the natural order, consisting of the same internal form, object, means and acts; although by reason of their mode, adjuncts, circumstances, and also their end, they often had notable defects, in respect of which Augustine calls them, by a broad signification, ‘sins’, although elsewhere he commends the virtues of the gentiles, as in Of the Spirit &amp; the Letter, ch. 27; Epistle 99 to Evodius; also Epistle 130; and the book, On the Grace of Christ, ch. 24. See Dn. D. Samuel Strimesius, Praxiologia Apodictica, ch. 7, §5; D. Johann Fabricius, Systema Theologicum, locus 3, aphorism 2, p. 277. Nor does the passage Rom. 14:23 stand in the way, for there Paul by ‘faith’ does not understand saving faith, but the dictate of conscience, by which something is judged to be licit or illicit. §VII. But to this sphere in no way pertain spiritual actions, which cannot be elicited and performed except by the Spirit of God vivifying, illuminating, acting, operating, regenerating and sanctifying in certain degrees. In respect of these, we rightly teach that the natural powers of free will are not only bound, attenuated, impeded, wounded and broken, but plainly lost, destroyed, extinguished, and null, against the Pelagians, Semi-Pelagians, Socinians, Remonstrants, Mennonites; and in part also the Greeks, Synergists and Pontificists, of whom see Bellarmine, bk. 6 of On the Loss of Grace &amp; the State of Sin, ch. 16; Coster, Enchiridion, ch. 5, p. 190. §VIII. Against whom we assert that unregenerate man in the state of dominant corruption, or before his conversion, has from himself no natural powers, whether in the intellect or in the will, for… keep[ing] the precepts of God, and do[ing] good works, pleasing to God and saving for himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on the Free Will of Man’ trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), ch. 2, pp. 20-22 Latin Holtzfus was a German reformed divine.</cite></span></figcaption>

</figure><figure class="quote" id="q-2d653748b1" data-kw="">
<blockquote><p>Answer 2. Necessary, though not necessitate efficientiae as causes; yet necessitate presentiae, as necessary consequents of justification, and as necessary antecedents of glorification. They are necessary, I say, by a necessity not only privative (if I may so speak) but also positive… Answer 3. They are necessary also by a positive necessity, and that manifold. As first by the necessity of infallibility, in respect of God’s decree, Word, oath. … Answer 6. Secondly, they are necessary necessitate pracepti, imposing a necessity of duty, towards God, our neighbor, ourselves. … Argument 8. Thirdly, they are necessary, necessitate signi, as necessary signs and evidences, whereby we are to gather assurance to ourselves of our justification, whereby our faith is to be demonstrated, whereby we are to make our calling, and our election sure. … Argument 9. Lastly, they are necessary necessitate medii, and as that, which, though it be no cause, is called causa sine qua non. And thus they are necessary: First, as the way, which leadeth to life eternal, via qua nos perducturus est ad finem itsum quem promisit (Aug. in Ps. 109), the way by which He will bring us unto that end which He hath promised, saith Augustine. For those that are justified, and by justification entitled to the Kingdom of Heaven, they are to go in the way of sanctification towards their glorification, Eph. 2:10; good works therefore, though they be not the cause of reigning yet they are the way to the Kingdom. Secondly, as necessary fruits of our election, for we are elected to that end that we should be holy, Eph. 1:4, as necessary fruits of faith, without which it is judged to be dead, James 2:26, as unseparable consequents of our redemption and justification, Luk. 1:74. And as they are necessary consequents of our justification, so they are necessary forerunners of salvation, by which we are fitted for God’s Kingdom, because no unclean thing can enter into the Kingdom of heaven, Apoc. 21:27, and finally so necessary is a godly life that without it no man shall see God, Heb. 12:14. I conclude with Bernard (De Gratia et Libero Arbitrio) that good works are… of our secret predestination, presages of our future happiness, the way to the Kingdom, but not the cause of our obtaining that Kingdom. For howsoever good works are necessary in many respects, as I have showed, necessitate presentiae; yet they are not necessary necessitate efficientiae, as causes of our justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Justification (London, 1633) Book 7, ‘Concerning Good Works’ | Ch. 1 – To avoid Popish calumniations, it is shewed, that we doe hold the necessity of good works, and do urge the same by better arguments than the Popish religion doth afford.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“Answer 2. Necessary, though not necessitate efficientiae as causes; yet necessitate presentiae, as necessary consequents of justification, and as necessary antecedents of glorification. They are necessary, I say, by a necessity not only privative (if I may so speak) but also positive… Answer 3. They are necessary also by a positive necessity, and that manifold. As first by the necessity of infallibility, in respect of God’s decree, Word, oath. … Answer 6. Secondly, they are necessary necessitate pracepti, imposing a necessity of duty, towards God, our neighbor, ourselves. … Argument 8. Thirdly, they are necessary, necessitate signi, as necessary signs and evidences, whereby we are to gather assurance to ourselves of our justification, whereby our faith is to be demonstrated, whereby we are to make our calling, and our election sure. … Argument 9. Lastly, they are necessary necessitate medii, and as that, which, though it be no cause, is called causa sine qua non. And thus they are necessary: First, as the way, which leadeth to life eternal, via qua nos perducturus est ad finem itsum quem promisit (Aug. in Ps. 109), the way by which He will bring us unto that end which He hath promised, saith Augustine. For those that are justified, and by justification entitled to the Kingdom of Heaven, they are to go in the way of sanctification towards their glorification, Eph. 2:10; good works therefore, though they be not the cause of reigning yet they are the way to the Kingdom. Secondly, as necessary fruits of our election, for we are elected to that end that we should be holy, Eph. 1:4, as necessary fruits of faith, without which it is judged to be dead, James 2:26, as unseparable consequents of our redemption and justification, Luk. 1:74. And as they are necessary consequents of our justification, so they are necessary forerunners of salvation, by which we are fitted for God’s Kingdom, because no unclean thing can enter into the Kingdom of heaven, Apoc. 21:27, and finally so necessary is a godly life that without it no man shall see God, Heb. 12:14. I conclude with Bernard (De Gratia et Libero Arbitrio) that good works are… of our secret predestination, presages of our future happiness, the way to the Kingdom, but not the cause of our obtaining that Kingdom. For howsoever good works are necessary in many respects, as I have showed, necessitate presentiae; yet they are not necessary necessitate efficientiae, as causes of our justification.”

— George Downame, A Treatise of Justification (London, 1633) Book 7, ‘Concerning Good Works’ | Ch. 1 – To avoid Popish calumniations, it is shewed, that we doe hold the necessity of good works, and do urge the same by better arguments than the Popish religion doth afford.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnswer+2.+Necessary%2C+though+not+necessitate+efficientiae+as+causes%3B+yet+necessitate+presentiae%2C+as+necessary+consequents+of+justification%2C+and+as+necessary+antecedents+of+glorification.+They+are+necessary%2C+I+say%2C+by+a+necessity+not+only+privative+%28if+I+may+so+speak%29+but+also+positive%E2%80%A6+Answer+3.+They+are+necessary+also+by+a+positive+necessity%2C+and+that+manifold.+As+first+by+the+necessity+of+infallibility%2C+in+respect+of+God%E2%80%99s+decree%2C+Word%2C+oath.+%E2%80%A6+Answer+6.+Secondly%2C+they+are+necessary+necessitate+pracepti%2C+imposing+a+necessity+of+duty%2C+towards+God%2C+our+neighbor%2C+ourselves.+%E2%80%A6+Argument+8.+Thirdly%2C+they+are+necessary%2C+necessitate+signi%2C+as+necessary+signs+and+evidences%2C+whereby+we+are+to+gather+assurance+to+ourselves+of+our+justification%2C+whereby+our+faith+is+to+be+demonstrated%2C+whereby+we+are+to+make+our+calling%2C+and+our+election+sure.+%E2%80%A6+Argument+9.+Lastly%2C+they+are+necessary+necessitate+medii%2C+and+as+that%2C+which%2C+though+it+be+no+cause%2C+is+called+causa+sine+qua+non.+And+thus+they+are+necessary%3A+First%2C+as+the+way%2C+which+leadeth+to+life+eternal%2C+via+qua+nos+perducturus+est+ad+finem+itsum+quem+promisit+%28Aug.+in+Ps.+109%29%2C+the+way+by+which+He+will+bring+us+unto+that+end+which+He+hath+promised%2C+saith+Augustine.+For+those+that+are+justified%2C+and+by+justification+entitled+to+the+Kingdom+of+Heaven%2C+they+are+to+go+in+the+way+of+sanctification+towards+their+glorification%2C+Eph.+2%3A10%3B+good+works+therefore%2C+though+they+be+not+the+cause+of+reigning+yet+they+are+the+way+to+the+Kingdom.+Secondly%2C+as+necessary+fruits+of+our+election%2C+for+we+are+elected+to+that+end+that+we+should+be+holy%2C+Eph.+1%3A4%2C+as+necessary+fruits+of+faith%2C+without+which+it+is+judged+to+be+dead%2C+James+2%3A26%2C+as+unseparable+consequents+of+our+redemption+and+justification%2C+Luk.+1%3A74.+And+as+they+are+necessary+consequents+of+our+justification%2C+so+they+are+necessary+forerunners+of+salvation%2C+by+which+we+are+fitted+for+God%E2%80%99s+Kingdom%2C+because+no+unclean+thing+can+enter+into+the+Kingdom+of+heaven%2C+Apoc.+21%3A27%2C+and+finally+so+necessary+is+a+godly+life+that+without+it+no+man+shall+see+God%2C+Heb.+12%3A14.+I+conclude+with+Bernard+%28De+Gratia+et+Libero+Arbitrio%29+that+good+works+are%E2%80%A6+of+our+secret+predestination%2C+presages+of+our+future+happiness%2C+the+way+to+the+Kingdom%2C+but+not+the+cause+of+our+obtaining+that+Kingdom.+For+howsoever+good+works+are+necessary+in+many+respects%2C+as+I+have+showed%2C+necessitate+presentiae%3B+yet+they+are+not+necessary+necessitate+efficientiae%2C+as+causes+of+our+justification.%E2%80%9D%0A%0A%E2%80%94+George+Downame%2C+A+Treatise+of+Justification+%28London%2C+1633%29+Book+7%2C+%E2%80%98Concerning+Good+Works%E2%80%99+%7C+Ch.+1+%E2%80%93+To+avoid+Popish+calumniations%2C+it+is+shewed%2C+that+we+doe+hold+the+necessity+of+good+works%2C+and+do+urge+the+same+by+better+arguments+than+the+Popish+religion+doth+afford.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2d653748b1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2d653748b1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=Answer%202.%20Necessary%2C%20though%20not%20necessitate,efficientiae%2C%20as%20causes%20of%20our%20justification." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-6e03fbc1c5" data-kw="">
<blockquote><p>Our Lord Jesus Christ has instituted a government and governors ecclesiastical in his House, with power to meet for the order and government thereof; and to that purpose the apostles did immediately receive the keys from the hands of their Lord and Master Jesus Christ, and did use and exercise the same upon all occasions: And Christ has from time to time furnished some in his Church with gifts for government, and with commission to exercise it when called thereunto, and has promised his presence to be with them to the end of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c722f2b7b9" data-kw="">
<blockquote><p>There is so great a difference of men and cases that it’s gross sottishness to think that their duties and sins are the same in mutable circumstances: It’s a sin to preach or pray when we should be quenching a fire, saving men’s lives. Christians, as well as Pharisees, are yet to learn what that means, “I will have mercy and not sacrifice, and therefore accuse the guiltless.” [Mt. 12:7] Some men have no possibility of any other church-worship but in the parish-churches. Some have no other possibility but what is worse. Some may have abler teachers, but at the cost of imprisonment and ruin. It is not lawful to lie in prison merely for refusing to hear a weak nonconformist when you might hear an abler: and so it is in the case of conformists, else all were bound to a few men. Some have liberty to hear fitter men, or at the least, more agreeable to them, without greater hurt than good (as the Dutch and French here have). Some are commanded by husbands, parents and masters to one church, and some to another. Some have more able and godly ministers in the parish-churches, and some have such as I would never own or encourage in the ministry by seeming to own them. Some can remove their dwelling and some cannot. Some had liberty the last year that cannot have it this year without more hurt than their benefit will compensate. In these cases where God has not at all tied us to a [Service-]book, or no book, to this church or to that, he that can truly tell which way he shall do and get most good or hurt, may by that better know his duty than by these arguments or men’s censures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), pp. 77-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-2becefca19" data-kw="">
<blockquote><p>The horror of this scene strikes me almost quite dumb; I must halt, and give way to some awful ideas that cannot find vent in language. Obstupui steteruntque come, et vox faucibus haesit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, of the Church of Scotland, contra the Seceders’ Covenant, &amp; that as a Term of Communion, 1744</span></figcaption>

</figure><figure class="quote" id="q-4a8114a6e3" data-kw="">
<blockquote><p>Paul could not endure the divisions of one and the same Church of Corinth, though they pretended not to be different Churches; for those that said they were of Paul, professed they could not be disciples of Peter: But he sharply rebuked them as carnal men, nd such as divided Christ, and by consequence must say Paul was crucified for them, and was their redeemer: and so, if obstinately they had proceeded in that separation, Paul would have gone on to higher censures of the Church. Far more could he not endure gathering of true Churches out of true Chuches, which is the professed practice of Independents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-a787f58d8f" data-kw="">
<blockquote><p>But yet let me freely tell you, that there is one step in Mr. Erskine’s conduct that I am not able to justify; it is, When the synod of Perth and Stirling resolved to give him a modest rebuke, he did not silently receive it. I should never have advised my worthy brother Mr. Erskine to have made any confession of a fault even in his expressions, when his conscience justified him in the same; but I cannot think that his silence at the time that either the synod or General Assembly rebuked him, when they resolved thereby to finish the process, would be construed an acknowledgment of a fault: I am sure that the history of our blessed Lord’s sufferings bears expressly, that, when He was accused of many things before Pilate, He answered nothing; and when he was urged by the self-condemned heathen judge, He still continued silent; and I am persuaded that no good Christian can allege that his silence did import any confession of a fault, yea, it was a fulfilling of the Scripture, Isa. 53:7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-a8c9ebcdf4" data-kw="">
<blockquote><p>Now we are to speak of the concurrence of these two graces. For when the Lord sweareth, that to those whom he redeemeth and justifieth, he will give grace to worship him in holiness and righteousness; from hence we doe necessarily collect, that sanctification is an unseparable companion of justification; and that no man can have assurance, that he is justified, unless he be in some measure sanctified.

Let no man therefore deceive himself with a vain profession of an idle and dead faith, for unless thou doest, at the least, desire and endeavour to worship God in holiness and righteousness; it is as certain. as the oath of the Lord is true, that as yet thou art not justified, nor actually made partaker of the redemption wrought by Christ. It is true, that our Saviour Christ in the days of his flesh, did redeem us meritoriously, paying a ransom sufficient for all that should believe in him: but none are actually made partakers of this Redemption, but they to whom it is applied; and it is applied only to those that truly believe; and true faith purifieth the heart, and worketh by love, and is to be demonstrated by good works. …

The reason hereof is evident. For 1. they who are engraffed into CHRIST by faith, as all those are which truly believe in him, in them CHRIST dwelleth by his spirit (for they are not his, who have not his spirit) applying unto them not only the merit of his death, to their redemption, &amp; the benefit of his resurrection to their justification, but also the virtue &amp; efficacy of his death to mortify their sins, &amp; of his resurrection to raise them to newness of life; so that for whose sins CHRIST died, they die to their sin; and for whose justification he arose, they also rise to newness of life The Apostle Rom. 6.3.4. affirmeth, that those who have been baptized into CHRIST, were baptized into his death, and resurrection; that as CHRIST did die and rise again; so they also die to sin, &amp; rise to newness of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Grace or An Exposition upon Luke 1. 73.74.75</cite>, (Dublin, 1631), pp 35-36.</span></figcaption>

<blockquote><p>Faith therefore justifies because it is an instrument to apprehend and apply that which justifies, namely, Christ and His obedience. As the Israelites stung of fiery serpents were cured, so are we saved (John 3:14). The Israelites did nothing at all, but only look upon the brazen serpent; so are we to do nothing for our justification and salvation, but to fix the eye of our faith on Christ.</p></blockquote>

— William Perkins, Commentary on Galatians, 2:122.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFaith+therefore+justifies+because+it+is+an+instrument+to+apprehend+and+apply+that+which+justifies%2C+namely%2C+Christ+and+His+obedience.+As+the+Israelites+stung+of+fiery+serpents+were+cured%2C+so+are+we+saved+%28John+3%3A14%29.+The+Israelites+did+nothing+at+all%2C+but+only+look+upon+the+brazen+serpent%3B+so+are+we+to+do+nothing+for+our+justification+and+salvation%2C+but+to+fix+the+eye+of+our+faith+on+Christ.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+Commentary+on+Galatians%2C+2%3A122.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff15e88832a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f15e88832a.html">Permalink</a><a class="src" href="https://heidelblog.net/2021/02/william-perkins-both-justification-and-salvation-are-through-faith-alone/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-f8cccbc26c" data-kw="">
<blockquote><p>In this way we can admit not only that there is a partial righteousness in works (as our adversaries maintain), but that they are approved by God as if they were absolutely perfect. If we remember on what foundation this is rested, every difficulty will be solved. The first time when a work begins to be acceptable is when it is received with pardon. And whence pardon, but just because God looks upon us and all that belongs to us as in Christ? Therefore, as we ourselves when ingrafted into Christ appear righteous before God, because our iniquities are covered with his innocence; so our works are, and are deemed righteous, because every thing otherwise defective in them being buried by the purity of Christ is not imputed. Thus we may justly say, that not only ourselves, but our works also, are justified by faith alone. Now, if that righteousness of works, whatever it be, depends on faith and free justification, and is produced by it, it ought to be included under it and, so to speak, made subordinate to it, as the effect to its cause; so far is it from being entitled to be set up to impair or destroy the doctrine of justification. Thus Paul, to prove that our blessedness depends not on our works, but on the mercy of God, makes special use of the words of David, “Blessed is he whose transgression is forgiven, whose sin is covered;” “Blessed is the man unto whom the Lord imputeth not iniquity.” Should any one here obtrude the numberless passages in which blessedness seems to be attributed to works, as, “Blessed is the man that feareth the Lord;” “He that has mercy on the poor, happy is he;” “Blessed is the man that walketh not in the counsel of the ungodly,” and “that endureth temptation;” “Blessed are they that keep judgment,” that are “pure in heart,” “meek,” “merciful,”, they cannot make out that Paul’s doctrine is not true. For seeing that the qualities thus extolled never all so exist in man as to obtain for him the approbation of God, it follows, that man is always miserable until he is exempted from misery by the pardon of his sins. Since, then, all the kinds of blessedness extolled in the Scripture are vain so that man derives no benefit from them until he obtains blessedness by the forgiveness of sins, a forgiveness which makes way for them, it follows that this is not only the chief and highest, but the only blessedness, unless you are prepared to maintain that it is impaired by things which owe their entire existence to it. There is much less to trouble us in the name of righteous which is usually given to believers. I admit that they are so called from the holiness of their lives, but as they rather exert themselves in the study of righteousness than fulfill righteousness itself, any degree of it which they possess must yield to justification by faith, to which it is owing that it is what it is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.17.10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

<blockquote><p>V. Hence arises the question with the Romanists concerning the acceptation of this word—whether it is to be taken precisely in a forensic sense in this affair; or whether it ought also to be taken in a physical and moral sense for the infusion of righteousness and justification, if it is allowable (so to speak) either by the acquisition or the increase of it. For they do not deny that the word justificatio and the verb justificare are often taken in a forensic sense, even in this matter, as Bellarmine (“De Justificatione,” 1.1 Opera [1858], 4:461–62), Tirinus (Theologiae elenchticae … controversarium fidei, Cont. 15, number 1 [1648], pp. 217–21) and Toletus (Commentarii et annotationes in epistolam … ad Romanos, Annot. 13 [1602], pp. 117–22) and not a few others. Yet they do not wish this to be the constant meaning, but that it often signifies a true production, acquisition or increase of righteousness; this is especially the case when employed about the justification of man before God. Hence they distinguish justification into “first and second.” The first is that by which the man who is unjust is made just; the second is that by which a just man is made more just. Hence Bellarmine says: “Justification undoubtedly is a certain movement from sin to righteousness, and takes its name from the terminus to which it leads, as all other similar motions, illumination, calefaction; that is true justification, where some righteousness is aquired beyond the remission of sin.” Thomas Aquinas says, “Justification taken passively implies a motion to making righteous, just as calefaction a motion to heat” (ST, I–II, Q. 113, Art. 1, p. 1144). Now although we do not deny that this word has more than one signification and is taken in different ways in the Scriptures (now properly, then improperly, as we have already said), still we maintain that it is never taken for an infusion of righteousness, but as often as the Scriptures speak professedly about our justification, it always must be explained as a forensic term.</p></blockquote>

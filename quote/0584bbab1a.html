<blockquote><p>It is Christ’s glory, that he is the King of the Saints (in a peculiar manner) and it is his grace, that he exerciseth that Kingly power in a sweet way. How ever he ruleth the Nation with a rod of iron, yet he ruleth the Saints with a golden Sceptre. Hence it is, that although in wrath, his iron rod break the Nations in pieces, yet his golden Sceptre is still stretched out in love, to entertain the Saints. You read in Cant. 3. that Solomon made a Chariot of the wood of Lebanon, he made the pillars thereof of silver, the bottom of gold, the covering of it of purple, the midst being [PAVED WITH LOVE] Cant. 3. v. 10. That Chariot which Solomon made for himself, and in which hee rode, might well set out the Chariot in which Christ rideth up and down the world of believers, whom he governs.

Indeed it is very glorious, and it glitters with beams of light, but withal it is very gracious, as being paved with stones of love; Love is the throne in which he sits, love is the Sceptre with which he ruleth, and all his government is managed in such a way, as that believers may say, that he is the Lord of love even in his ruling of them. Absolom did but flatter, when he stood by the way of the gate, and kissed all that passed by (and by it insinuated how sweetly hee would govern, if he came to the Kingdome) but that which was flattery in Absolom, is reality in Christ, When any of the spiritual pilgrims come (as believers do) to do him obeysance (as they ought to do, being under his commands) he putteth forth his hands, and taketh them, and kisseth them, and doth not only promise, but perform transcendent love in all his commands over them. But to read this more particularly, you will see the transcendency of Christ’s love discovered in his command over believers, if you consider three things.

First, Christ layeth no commands upon believers, but such as are full of love &amp; sweetness. He reduceth all the Decalogue to these two heads, Thu shalt love the Lord thy God with all thy heart; and with all thy soul, and with al thy mind: and thou shalt love thy neighbour as thy self, Mat. 22.37.39. Well might John say, That his Commandments are not grievous, 1 Joh. 5.3. (the word is burthensome) and indeed what burthen is there in the commands of Christ, unless love be a burden? Indeed he might have commanded (which is his peculiar Prerogative) what he pleased, but he commanded nothing but what is pleasant in it self, and will be so to a sanctified soul (which is the transcendency of his love) A new Commandment (saith he) do I give unto you, that ye love one another, as I have loved you, that ye also love one another, Joh. 13. v. 34.

Well may the Commandment be called New, it being such as was never given by any King besides himself: And surely there was great love in his bosom to believers, when he only laid a burthen, or a command of Love upon their shoulders. All her ways are ways of pleasantness, Prov. 3.17. The ways of Christ (which are his Commands) are ways of pleasantness (for I take it, that Solomon there by wisdom understandeth Christ.) Believers, if you could but live in love, you would fulfil the Law of your Lord; for he being a Lord of love to you, Love is the fulfilling of the Law he layeth upon you. Yea such is the transcendency of his love to believers, that he layeth no Commandment upon them, to do any thing, which he did not himself.

Flesh and Blood may think it a hard, and a harsh Command, to wash the feet of a poor believer, a fellow servant: But grace will see the Command to be sweet, and lovely? (and Jesus Christ to be loving in laying this Command) because it is no other than what himself hath done before: Ask the servant whether his Lord be loving, who layeth no Commandment upon him, but that which is sweet in its self, and sweet in its fruit, and no worse than his Lord himself will undertake. Believers, it is your case, all the Commands of your Lord Christ are sweet in themselves, and sweet in their fruit; and they are such as he himself (while he lived) stooped unto. Doth not this declare transcendent love?

Secondly, Christ layeth all his commands in a way of love; that which he biddeth believers do (who are under his command) it is in a loving way: As the command is, so is the manner of its imposing, i. e. sweet and loving. It is possible, that a sweet thing may be enjoined in a harsh way: An easy commandment in it self may be burthensome in the way of its imposal. To command with a bended fist, and a frowning forehead, is not to command in a loving way: but now Jesus Christ, when ever he commandeth, he commandeth sweetly, and smilingly: he doth not lift up his voice, and cry (as some understand that place) Esa. 42. v. 2. He doth not speak in an austere, rough, rugged manner: But as the Lord is, so is his language, loving. Observe with what love he layeth his commands on believers; You are my friends, if you do whatsoever I command you, Joh. 15 14. He doth not threaten, and say, I will be your Foe, if you will not obey; but if you do, you shall be my Friends. And so again, If you love me, keep my Commandments.

It is worth the noting, that grace may be said to come in this respect by Christ: He gave not his Law (as Moses did) with thundering and lightning, in a dreadful manner; But he gave the Law to his Disciples himself, in a sweet and loving way. He beginneth his Sermons, with Blessed are ye: And all his commands drop from him like the drops of dew upon the tender grass; He shall come down (saith the Psalmist, Psal. 72. v. 6.) like rain upon the mown grass, as showers that water the earth, i. e. He shall come down, both softly and sweetly; this is spoke of Christ’s coming as a King; so that you may see the transcendency of Christ’s love unto you, in the manner in which he layeth his Commandments on you.

Thirdly, Consider the end that Christ doth aim at in all his Commandments, and that will also discover the transcendency of his love to believers. He seeks not himself, but them, in all his Commands. He biddeth the believer work, not that he may reap any thing himself, but that the believer may get all; he putteth them to labour in his Vineyard, that they may have all the harvest. As it is inconsistent with his Deity, to have any thing added to him, so also it is inconsistent with his love; He putteth his servants to reap, that they may have all the corn, and he setteth them to work, rather that he may give them wages, than that himself shall get any thing by their workings. Take my yoke upon you (saith he) and you shall find rest unto your souls. Christ layeth a yoke upon their necks, not to burthen them, but to ease them; not to break their backs, but to refresh their bosoms.

Many Kings, and Rulers, aim at themselves in their commands, and they seek too often, rather their own greatness, than their Subjects good. But (believe it) Jesus Christ your King, is not such an one; All that he aims at in his government is your good: The end of his Commandments are your comfort; As his government increaseth over you, so his peace increaseth in you: This is the effect, and fruit of all his Commandments, not so much that others may take notice of his glory in commanding, as that you may find his grace in obeying. Indeed, love is the work and wages of his Commandment; he therefore bids you do so, that he may love you; therefore it is, that though you are frail, and weak, and cannot obey, he will be kind to love you, notwithstanding all.

So that now the Commands of Christ, being as it were love materially (in the substance) and love formally (in their imposals) and love finally (in their aim) what can you conclude from all this, but that the love of Christ, even to believers, is declared to be transcendent in the exercise of his command over them?</p></blockquote>

thundering+and+lightning%2C+in+a+dreadful+manner%3B+But+he+gave+the+Law+to+his+Disciples+himself%2C+in+a+sweet+and+loving+way.+He+beginneth+his+Sermons%2C+with+Blessed+are+ye%3A+And+all+his+commands+drop+from+him+like+the+drops+of+dew+upon+the+tender+grass%3B+He+shall+come+down+%28saith+the+Psalmist%2C+Psal.+72.+v.+6.%29+like+rain+upon+the+mown+grass%2C+as+showers+that+water+the+earth%2C+i.+e.+He+shall+come+down%2C+both+softly+and+sweetly%3B+this+is+spoke+of+Christ%E2%80%99s+coming+as+a+King%3B+so+that+you+may+see+the+transcendency+of+Christ%E2%80%99s+love+unto+you%2C+in+the+manner+in+which+he+layeth+his+Commandments+on+you.%0A%0AThirdly%2C+Consider+the+end+that+Christ+doth+aim+at+in+all+his+Commandments%2C+and+that+will+also+discover+the+transcendency+of+his+love+to+believers.+He+seeks+not+himself%2C+but+them%2C+in+all+his+Commands.+He+biddeth+the+believer+work%2C+not+that+he+may+reap+any+thing+himself%2C+but+that+the+believer+may+get+all%3B+he+putteth+them+to+labour+in+his+Vineyard%2C+that+they+may+have+all+the+harvest.+As+it+is+inconsistent+with+his+Deity%2C+to+have+any+thing+added+to+him%2C+so+also+it+is+inconsistent+with+his+love%3B+He+putteth+his+servants+to+reap%2C+that+they+may+have+all+the+corn%2C+and+he+setteth+them+to+work%2C+rather+that+he+may+give+them+wages%2C+than+that+himself+shall+get+any+thing+by+their+workings.+Take+my+yoke+upon+you+%28saith+he%29+and+you+shall+find+rest+unto+your+souls.+Christ+layeth+a+yoke+upon+their+necks%2C+not+to+burthen+them%2C+but+to+ease+them%3B+not+to+break+their+backs%2C+but+to+refresh+their+bosoms.%0A%0AMany+Kings%2C+and+Rulers%2C+aim+at+themselves+in+their+commands%2C+and+they+seek+too+often%2C+rather+their+own+greatness%2C+than+their+Subjects+good.+But+%28believe+it%29+Jesus+Christ+your+King%2C+is+not+such+an+one%3B+All+that+he+aims+at+in+his+government+is+your+good%3A+The+end+of+his+Commandments+are+your+comfort%3B+As+his+government+increaseth+over+you%2C+so+his+peace+increaseth+in+you%3A+This+is+the+effect%2C+and+fruit+of+all+his+Commandments%2C+not+so+much+that+others+may+take+notice+of+his+glory+in+commanding%2C+as+that+you+may+find+his+grace+in+obeying.+Indeed%2C+love+is+the+work+and+wages+of+his+Commandment%3B+he+therefore+bids+you+do+so%2C+that+he+may+love+you%3B+therefore+it+is%2C+that+though+you+are+frail%2C+and+weak%2C+and+cannot+obey%2C+he+will+be+kind+to+love+you%2C+notwithstanding+all.%0A%0ASo+that+now+the+Commands+of+Christ%2C+being+as+it+were+love+materially+%28in+the+substance%29+and+love+formally+%28in+their+imposals%29+and+love+finally+%28in+their+aim%29+what+can+you+conclude+from+all+this%2C+but+that+the+love+of+Christ%2C+even+to+believers%2C+is+declared+to+be+transcendent+in+the+exercise+of+his+command+over+them%3F%E2%80%9D%0A%0A%E2%80%94+John+Durant%2C+A+discovery+of+glorious+love%2C+or%2C+The+love+of+Christ+to+believers+opened%2C+in+the+truth%2C+transcendency%2C+and+sweetness+thereof+together+with+the+necessity+that+lies+upon+every+believer%2C+to+strive+after+the+spiritual+and+experimental+knowledge+of+it%3A+being+the+sum+of+VI+sermons+preached+upon+Ephesians+%2C+%28London%3A+W.+Gilbertson%2C+1655%29%2C+pp+125-33.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0584bbab1a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0584bbab1a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/08/06/john-durant-on-the-loving-commands-of-the-king-of-saints/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Oh believe it, God has not one drop of mercy for the finally obstinate and rebellious sinner. In this world, God’s mercy (as it were) goes a begging to them, ‘tis brought to their very doors and offered to them; Christ stands at the door and knocks for entrance. They actually enjoy many outward mercies, and spiritual eternal mercies are offered to them and urged on them; but when God’s patience is ended, let them cry and pray as long as they will, not the least drop of mercy shall be obtained for them. And as they shall not have the least drop of mercy, so they shall have wrath and misery without mixture; pain without mitigation or intermission.</p></blockquote>

<blockquote><p>Lastly, justifying faith is such a faith whereby we embrace, entertain, receive, admit Christ, not into our houses, but into our hearts; and whereby conseqently we are united unto Christ, so as that He is said to be in us, and we in Him. ‘To as many as received Him,’ says He, ‘He gave this priviledge to become the sons of God, even to those that beleive in his name.’ Where to ‘receive Him,’ is to give Him entertainment, not so much in their houses, which Matthew, Zacheus, and others of them also did, as in their hearts: according to that of the apostle, ‘that Christ may dwell in your hearts by faith,’ Eph. 3:17. Whence it is that they that are in the faith, are said to have Christ in them. ‘Examine yourselves,’ says the apostle, ‘whether ye be in the Faith: do you not know that Christ is in you?’ 2 Cor. 13:5, thereby implying that if they be in the faith, then Christ is in them… we cannot with any good ground rely on Him or trust Him for the discharge of us from the guilt of our sins, unless we be content to receive, and do willingly embrace Him, on such terms as God offers Him, and as He offers Himself unto us, and on no other terms than these is He offered unto any. But a man may believe that Christ is the Savior of the world, yea that he cannot be saved but by Christ, and yet for all that may refuse to receive Him and yield himself up unto Him, because he mislikes the conditions on which He is tendered unto Him, or delay to do it at present, in hope that he may timely enough do it hereafter. As when a company of rebels are up in arms against their leige lord, and a proclamation of pardon and impunity is published by him unto all such of them as will lay down their arms, put themselves upon his mercy, acknowledge their offence and by solemn oath engage themselves to due allegiance and constant obedience for the future; albeit that they all know him to be their lawful sovereign, and believe that he will be as good as his word to all that so accept of it, nor know which way to escape, but that first or last they shal be surprised, if they do stand out, and have execution done upon them; yet there may be diverse among them that will choose rather to persist in their rebellious courses, or refuse at least to yield themselves up to him and to accept of his gracious offer, either out of a stoutness of stomach and a stifness of self-will, or out of an extreme malice and inveterate hatred against the person of their prince, or out of a strong affection to some adverse party, or out of a fond conceit that they may keep for some good space of time out of the way, undiscovered and unsurprised, or that when they perceive themselves near to be attached, they may then by a tender of themselves attain the benefit of the offer, there being no limitation of time mentioned in it. In the same manner: although a man do beleive that Jesus is the Savior of mankind, and that there is no way for him to attain salvation but by Christ, yet for all that may he refuse to receive Christ for his Lord and Savior or to accept of salvation by Christ, because he mislikes the conditions upon and under which Christ and salvation by Christ is offered and tendred unto him, and without which it cannot be had. But what are those terms, that are so necessarily reqired, and with so much difficulty received? Why these are: ‘If any man will come after me, says our Savior, [Greek], let him utterly deny himself,’ Mt. 16:24… he must not be his own man anymore, but he must in resolution at least be Christ’s alone, wholly at his command, will and disposal… This word or saying, that Christ came to save sinners, it is a sure saying, such as we may write and rest upon it, we may with good ground afford credit unto it, yea and it is withal a very acceptable saying, a saying worthy of all acceptance, 1 Tim. 1:15, and indeed who would not accept of such a gracious offer? would not willingly and gladly entertain such tidings, the glad tidings of salvation, and of salvation not temporal, but eternal? See Isa. 52:7; Nah. 1:15; Rom. 10:15, yea but what is the reason then that this so acceptable message finds so little acceptance in the world, that so few do accept of it? that when this Savior came unto his own, He found so sorry welcome among them, his own refused to receive Him? Jn. 1:11. It is not in the thing offered; that no damned wretch in Hell would refuse to accept; but it is in the terms whereupon the offer is made and tendred, which mans corrupt nature will in no wise condescend unto… The stoutness, or hautiness of the flesh, of man’s carnal heart or mind (and there is an emphasis also in the word ‘flesh’, which of itself has an intimation of infirmity and weakness, Gen. 6:3; Heb. 5:7, yea sometime of a pliable and yeilding disposition, apt to receive any but slight impression, Eze. 36:26; 2 Cor. 3:3, that such a sorry peice of flesh as man’s heart is, should be so stiff, and so stubborn) is enmity against God; not averse to him, but enmity itself against him; stands out in such defiance against Him, and whatsoever He wills and enjoins, that it neither does submit itself, nor can be subjected unto his law…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Lastly, justifying faith is such a faith whereby we embrace, entertain, receive, admit Christ, not into our houses, but into our hearts; and whereby conseqently we are united unto Christ, so as that He is said to be in us, and we in Him. ‘To as many as received Him,’ says He, ‘He gave this priviledge to become the sons of God, even to those that beleive in his name.’ Where to ‘receive Him,’ is to give Him entertainment, not so much in their houses, which Matthew, Zacheus, and others of them also did, as in their hearts: according to that of the apostle, ‘that Christ may dwell in your hearts by faith,’ Eph. 3:17. Whence it is that they that are in the faith, are said to have Christ in them. ‘Examine yourselves,’ says the apostle, ‘whether ye be in the Faith: do you not know that Christ is in you?’ 2 Cor. 13:5, thereby implying that if they be in the faith, then Christ is in them… we cannot with any good ground rely on Him or trust Him for the discharge of us from the guilt of our sins, unless we be content to receive, and do willingly embrace Him, on such terms as God offers Him, and as He offers Himself unto us, and on no other terms than these is He offered unto any. But a man may believe that Christ is the Savior of the world, yea that he cannot be saved but by Christ, and yet for all that may refuse to receive Him and yield himself up unto Him, because he mislikes the conditions on which He is tendered unto Him, or delay to do it at present, in hope that he may timely enough do it hereafter. As when a company of rebels are up in arms against their leige lord, and a proclamation of pardon and impunity is published by him unto all such of them as will lay down their arms, put themselves upon his mercy, acknowledge their offence and by solemn oath engage themselves to due allegiance and constant obedience for the future; albeit that they all know him to be their lawful sovereign, and believe that he will be as good as his word to all that so accept of it, nor know which way to escape, but that first or last they shal be surprised, if they do stand out, and have execution done upon them; yet there may be diverse among them that will choose rather to persist in their rebellious courses, or refuse at least to yield themselves up to him and to accept of his gracious offer, either out of a stoutness of stomach and a stifness of self-will, or out of an extreme malice and inveterate hatred against the person of their prince, or out of a strong affection to some adverse party, or out of a fond conceit that they may keep for some good space of time out of the way, undiscovered and unsurprised, or that when they perceive themselves near to be attached, they may then by a tender of themselves attain the benefit of the offer, there being no limitation of time mentioned in it. In the same manner: although a man do beleive that Jesus is the Savior of mankind, and that there is no way for him to attain salvation but by Christ, yet for all that may he refuse to receive Christ for his Lord and Savior or to accept of salvation by Christ, because he mislikes the conditions upon and under which Christ and salvation by Christ is offered and tendred unto him, and without which it cannot be had. But what are those terms, that are so necessarily reqired, and with so much difficulty received? Why these are: ‘If any man will come after me, says our Savior, [Greek], let him utterly deny himself,’ Mt. 16:24… he must not be his own man anymore, but he must in resolution at least be Christ’s alone, wholly at his command, will and disposal… This word or saying, that Christ came to save sinners, it is a sure saying, such as we may write and rest upon it, we may with good ground afford credit unto it, yea and it is withal a very acceptable saying, a saying worthy of all acceptance, 1 Tim. 1:15, and indeed who would not accept of such a gracious offer? would not willingly and gladly entertain such tidings, the glad tidings of salvation, and of salvation not temporal, but eternal? See Isa. 52:7; Nah. 1:15; Rom. 10:15, yea but what is the reason then that this so acceptable message finds so little acceptance in the world, that so few do accept of it? that when this Savior came unto his own, He found so sorry welcome among them, his own refused to receive Him? Jn. 1:11. It is not in the thing offered; that no damned wretch in Hell would refuse to accept; but it is in the terms whereupon the offer is made and tendred, which mans corrupt nature will in no wise condescend unto… The stoutness, or hautiness of the flesh, of man’s carnal heart or mind (and there is an emphasis also in the word ‘flesh’, which of itself has an intimation of infirmity and weakness, Gen. 6:3; Heb. 5:7, yea sometime of a pliable and yeilding disposition, apt to receive any but slight impression, Eze. 36:26; 2 Cor. 3:3, that such a sorry peice of flesh as man’s heart is, should be so stiff, and so stubborn) is enmity against God; not averse to him, but enmity itself against him; stands out in such defiance against Him, and whatsoever He wills and enjoins, that it neither does submit itself, nor can be subjected unto his law…”

— Thomas Gataker, An Antidote Against Error Concerning Justification, … (d.1654; London: Brome, 1670), pp. 50-54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CLastly%2C+justifying+faith+is+such+a+faith+whereby+we+embrace%2C+entertain%2C+receive%2C+admit+Christ%2C+not+into+our+houses%2C+but+into+our+hearts%3B+and+whereby+conseqently+we+are+united+unto+Christ%2C+so+as+that+He+is+said+to+be+in+us%2C+and+we+in+Him.+%E2%80%98To+as+many+as+received+Him%2C%E2%80%99+says+He%2C+%E2%80%98He+gave+this+priviledge+to+become+the+sons+of+God%2C+even+to+those+that+beleive+in+his+name.%E2%80%99+Where+to+%E2%80%98receive+Him%2C%E2%80%99+is+to+give+Him+entertainment%2C+not+so+much+in+their+houses%2C+which+Matthew%2C+Zacheus%2C+and+others+of+them+also+did%2C+as+in+their+hearts%3A+according+to+that+of+the+apostle%2C+%E2%80%98that+Christ+may+dwell+in+your+hearts+by+faith%2C%E2%80%99+Eph.+3%3A17.+Whence+it+is+that+they+that+are+in+the+faith%2C+are+said+to+have+Christ+in+them.+%E2%80%98Examine+yourselves%2C%E2%80%99+says+the+apostle%2C+%E2%80%98whether+ye+be+in+the+Faith%3A+do+you+not+know+that+Christ+is+in+you%3F%E2%80%99+2+Cor.+13%3A5%2C+thereby+implying+that+if+they+be+in+the+faith%2C+then+Christ+is+in+them%E2%80%A6+we+cannot+with+any+good+ground+rely+on+Him+or+trust+Him+for+the+discharge+of+us+from+the+guilt+of+our+sins%2C+unless+we+be+content+to+receive%2C+and+do+willingly+embrace+Him%2C+on+such+terms+as+God+offers+Him%2C+and+as+He+offers+Himself+unto+us%2C+and+on+no+other+terms+than+these+is+He+offered+unto+any.+But+a+man+may+believe+that+Christ+is+the+Savior+of+the+world%2C+yea+that+he+cannot+be+saved+but+by+Christ%2C+and+yet+for+all+that+may+refuse+to+receive+Him+and+yield+himself+up+unto+Him%2C+because+he+mislikes+the+conditions+on+which+He+is+tendered+unto+Him%2C+or+delay+to+do+it+at+present%2C+in+hope+that+he+may+timely+enough+do+it+hereafter.+As+when+a+company+of+rebels+are+up+in+arms+against+their+leige+lord%2C+and+a+proclamation+of+pardon+and+impunity+is+published+by+him+unto+all+such+of+them+as+will+lay+down+their+arms%2C+put+themselves+upon+his+mercy%2C+acknowledge+their+offence+and+by+solemn+oath+engage+themselves+to+due+allegiance+and+constant+obedience+for+the+future%3B+albeit+that+they+all+know+him+to+be+their+lawful+sovereign%2C+and+believe+that+he+will+be+as+good+as+his+word+to+all+that+so+accept+of+it%2C+nor+know+which+way+to+escape%2C+but+that+first+or+last+they+shal+be+surprised%2C+if+they+do+stand+out%2C+and+have+execution+done+upon+them%3B+yet+there+may+be+diverse+among+them+that+will+choose+rather+to+persist+in+their+rebellious+courses%2C+or+refuse+at+least+to+yield+themselves+up+to+him+and+to+accept+of+his+gracious+offer%2C+either+out+of+a+stoutness+of+stomach+and+a+stifness+of+self-will%2C+or+out+of+an+extreme+malice+and+inveterate+hatred+against+the+person+of+their+prince%2C+or+out+of+a+strong+affection+to+some+adverse+party%2C+or+out+of+a+fond+conceit+that+they+may+keep+for+some+good+space+of+time+out+of+the+way%2C+undiscovered+and+unsurprised%2C+or+that+when+they+perceive+themselves+near+to+be+attached%2C+they+may+then+by+a+tender+of+themselves+attain+the+benefit+of+the+offer%2C+there+being+no+limitation+of+time+mentioned+in+it.+In+the+same+manner%3A+although+a+man+do+beleive+that+Jesus+is+the+Savior+of+mankind%2C+and+that+there+is+no+way+for+him+to+attain+salvation+but+by+Christ%2C+yet+for+all+that+may+he+refuse+to+receive+Christ+for+his+Lord+and+Savior+or+to+accept+of+salvation+by+Christ%2C+because+he+mislikes+the+conditions+upon+and+under+which+Christ+and+salvation+by+Christ+is+offered+and+tendred+unto+him%2C+and+without+which+it+cannot+be+had.+But+what+are+those+terms%2C+that+are+so+necessarily+reqired%2C+and+with+so+much+difficulty+received%3F+Why+these+are%3A+%E2%80%98If+any+man+will+come+after+me%2C+says+our+Savior%2C+%5BGreek%5D%2C+let+him+utterly+deny+himself%2C%E2%80%99+Mt.+16%3A24%E2%80%A6+he+must+not+be+his+own+man+anymore%2C+but+he+must+in+resolution+at+least+be+Christ%E2%80%99s+alone%2C+wholly+at+his+command%2C+will+and+disposal%E2%80%A6+This+word+or+saying%2C+that+Christ+came+to+save+sinners%2C+it+is+a+sure+saying%2C+such+as+we+may+write+and+rest+upon+it%2C+we+may+with+good+ground+afford+credit+unto+it%2C+yea+and+it+is+withal+a+very+acceptable+saying%2C+a+saying+worthy+of+all+acceptance%2C+1+Tim.+1%3A15%2C+and+indeed+who+would+not+accept+of+such+a+gracious+offer%3F+would+not+willingly+and+gladly+entertain+such+tidings%2C+the+glad+tidings+of+salvation%2C+and+of+salvation+not+temporal%2C+but+eternal%3F+See+Isa.+52%3A7%3B+Nah.+1%3A15%3B+Rom.+10%3A15%2C+yea+but+what+is+the+reason+then+that+this+so+acceptable+message+finds+so+little+acceptance+in+the+world%2C+that+so+few+do+accept+of+it%3F+that+when+this+Savior+came+unto+his+own%2C+He+found+so+sorry+welcome+among+them%2C+his+own+refused+to+receive+Him%3F+Jn.+1%3A11.+It+is+not+in+the+thing+offered%3B+that+no+damned+wretch+in+Hell+would+refuse+to+accept%3B+but+it+is+in+the+terms+whereupon+the+offer+is+made+and+tendred%2C+which+mans+corrupt+nature+will+in+no+wise+condescend+unto%E2%80%A6+The+stoutness%2C+or+hautiness+of+the+flesh%2C+of+man%E2%80%99s+carnal+heart+or+mind+%28and+there+is+an+emphasis+also+in+the+word+%E2%80%98flesh%E2%80%99%2C+which+of+itself+has+an+intimation+of+infirmity+and+weakness%2C+Gen.+6%3A3%3B+Heb.+5%3A7%2C+yea+sometime+of+a+pliable+and+yeilding+disposition%2C+apt+to+receive+any+but+slight+impression%2C+Eze.+36%3A26%3B+2+Cor.+3%3A3%2C+that+such+a+sorry+peice+of+flesh+as+man%E2%80%99s+heart+is%2C+should+be+so+stiff%2C+and+so+stubborn%29+is+enmity+against+God%3B+not+averse+to+him%2C+but+enmity+itself+against+him%3B+stands+out+in+such+defiance+against+Him%2C+and+whatsoever+He+wills+and+enjoins%2C+that+it+neither+does+submit+itself%2C+nor+can+be+subjected+unto+his+law%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Thomas+Gataker%2C+An+Antidote+Against+Error+Concerning+Justification%2C+%E2%80%A6+%28d.1654%3B+London%3A+Brome%2C+1670%29%2C+pp.+50-54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F819f2324f3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/819f2324f3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=Lastly%2C%20justifying%20faith%20is%20such%20a,can%20be%20subjected%20unto%20his%20law&amp;text=Lastly%2C%20justifying%20faith%20is%20such%20a%20faith%20whereby&amp;text=itself%2C%20nor%20can%20be%20subjected%20unto%20his%20law" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>It may be observed, in passing, that there is a double sense in which we may speak of Christ’s purchase; First, Strictly and properly, when we regard Him as purchasing men; and secondly, More improperly, when we consider Him as purchasing benefits for men. This last view [the second], as we have hinted, is rather figurative and metaphorical than real and literal; for the idea of his purchasing benefits from the Father for mankind, must ever be understood in consistency with the Father’s sovereignty, and his pre-existing love to the children of men. The Father is not induced or persuaded to bestow benefits on men by a price paid to Him; but being antecedently full of compassion to all…</p></blockquote>

<blockquote><p>He knocks, to awaken us to come and let Him in, knocks by his Word and Spirit, knocks by afflictions and by our own consciences; though this is not expressly quoted, yet probably it is referred to (Rev. 3:20), ‘Behold, I stand at the door, and knock.’ He calls sinners into covenant with Him and saints into communion with Him… … III. The excuse she made to put off her compliance with this call (Song 5:3): ‘I have put off my coat; how shall I put it on again?’ She is half asleep; she knows the voice of her beloved; she knows his knock, but cannot find in her heart to open to Him… Making excuses (Lk. 14:18) is interpreted making light of Christ (Mt. 22:5), and so it is. Those put a great contempt upon Christ that cannot find in their hearts to bear a cold blast for him, or get out of a warm bed. IV. The powerful influences of divine grace, by which she was made willing to rise and open to her beloved. When He could not prevail with her by persuasion He put in his hand by the hole in the door, to unbolt it, as one weary of waiting, Song 5:4. This intimates a work of the Spirit upon her soul, by which she was unwilling made willing, Ps. 110:3. The conversion of Lydia is represented by the opening of her heart (Acts 16:14) and Christ is said to open his disciples’ understandings, Lk. 24:45. He that formed the spirit of man within him knows all the avenues to it, and which way to enter into it; he can find the hole of the door at which to put in his hand for the conquering of prejudices and the introducing of his own doctrine and law. He has the key of David (Rev. 3:7), with which He opens the door of the heart in such a way as is suited to it, as the key is fitted to the wards of the lock, in such a way as not to put a force upon its nature, but only upon its ill nature. V. Her compliance with these methods of divine grace at last: ‘My bowels were moved for Him.’ The will was gained by a good work wrought upon the affections: My bowels were moved for Him, as those of the two disciples were when Christ made their hearts to burn within them. She was moved with compassion to her beloved, because his head was wet with dew. Note, Tenderness of spirit, and a heart of flesh, prepare the soul for the reception of Christ into it… Note, When we apply ourselves to our duty, in the lively exercises of faith, under the influence of divine grace, we shall find it will go on much more readily and sweetly than we expected. If we will but rise up, to open to Christ, we shall find the difficulty we apprehended in it strangely overcome, and shall say with Daniel, ‘Now let my Lord speak, for thou hast strengthened me,’ Dan. 10:19… Those that open the doors of their hearts to Christ, those everlasting doors, must meet Him with the lively exercises of faith and other graces, and with these must anoint Him. … 1. She did not open to Him at his first knock, and now she came too late, when afterwards she would have inherited this blessing. Christ will be sought while He may be found; if we slip our time, we may lose our passage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Whole Bible</cite>, On Song 5, verses 2-8</span></figcaption>

<blockquote><p>2. He has a love, not only of benevolence, but of beneficence; He not only wishes you well, but does well unto you. O Sirs! many a good turn has He done you, particularly you who are members of the visible church; He gives you line upon line, precept upon precept; He makes you to hear the joyful sound, the voice of the turtle[-dove]; many a minister has He sent you; many an offer of Christ, and of life through Him, has He made to you; many a time has He knocked at thy door, by word, by conscience, and the motions and whispers of his Spirit; so that He may say to us, as He did of his vineyard, Isa. 5:4, “What could have been done more for them, that I have not done?”… Thus, I say, God’s love of benevolence and beneficence is, in some respects, extended unto all.</p></blockquote>

<blockquote><p>‘Behold, I stand at the door and knock, If any man will open…’ (Rev. 3:20). Alas, we cannot open the door, it is so locked and barred and bolted that it is impossible for us to open it. True, it is so, but yet there is a way to open, and that is to be opening when God would help us to open. When God offers to help you to open the door, then set upon opening the door, and whatever the bolts, bars and locks are, you shall be sure to have it open. Ah, but when does God offer to help us to open it? Then when His Spirit knocks, when in the motions of it He solicits us to open, then God offers His help to help us to open. Take that time and then set on the work and the door shall be opened. But if that time is neglected we may strive to open but cannot open, because then that power is gone that would have helped us to open. See Eccl. 9:12, ‘For man also knoweth not his time.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-dyke.html">Jeremiah Dyke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of Quenching &amp; Not Quenching of the Spirit’</cite>, (d. 1620; 1640; RBO, 2018), p. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

<blockquote><p>And from hence let us be instructed, upon what sad terms every child of the devil is damned, and such especially as live in places where the Lord Jesus Christ is preached; they will be damned for not receiving Christ, for not opening the door of their hearts, and stretching out their hearts in the desires and pantings after Christ, for not closing with an offered Christ and promise; your damnation will not be (sirs) for not meriting Christ; No, God never required that at your hands. God never required you should earn Him, He requires nothing but that you should receive Him, that you should be willing, and your hearts should be open to let in the Lord Jesus Christ, and that you should hunger and thirst after Him, and close with Him, not pay a penny, only take, and that freely. … Sinners, your damnation is of yourselves: if you will be saved you may. Heaven goes a begging this day, whosoever will let him drink of the water of life freely; it may be some of you have been great sinners, some of you old corrupted sinners: yet if you will, I say, if you will, you may be the Sons of God, heirs, joint heirs with the Lord Jesus Christ. You that are children of wrath, if you will, you may be heirs of grace. Behold Christ stands at the door and knocks: this day He knocks once more; He cries, ‘whosoever will’… Remember (sirs) Jerusalem might have been gathered, even as a hen gathers her chickens under her wings, but she would not; if you will not, Christ has washed his hands of your blood: your damnation is of yourselves. And ah! think, (poor creatures) think what bad terms these are to be damned upon: what a gnawing upon your conscience in Hell another day will it be to think, If I would I might have been saved; Heaven and glory might have been mine if I would, but now I am tormented, and shall be so forever, because I would not have the Lord Jesus Christ; this makes damnation the heavier, to think, there is no more required but only to open the door to receive the Lord Jesus Christ. … Behold! He stands at the door and knocks: He is willing, He is willing, He stands at the door: thy opening is after his knocking; He knocks this day, He calls to thee (Ah Lord! Break open the door that will not open!) thou are prevented with love, He stands at the door, and knocks before thou canst have the least thought of opening; Hark (sinner!) hear Him knocking; ‘Turn, turn, why will ye die O house of Israel?’ Hear Him calling, drunkard, vain person, swearer, Sabbath breaker, turn, open the doors of your hearts.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“And from hence let us be instructed, upon what sad terms every child of the devil is damned, and such especially as live in places where the Lord Jesus Christ is preached; they will be damned for not receiving Christ, for not opening the door of their hearts, and stretching out their hearts in the desires and pantings after Christ, for not closing with an offered Christ and promise; your damnation will not be (sirs) for not meriting Christ; No, God never required that at your hands. God never required you should earn Him, He requires nothing but that you should receive Him, that you should be willing, and your hearts should be open to let in the Lord Jesus Christ, and that you should hunger and thirst after Him, and close with Him, not pay a penny, only take, and that freely. … Sinners, your damnation is of yourselves: if you will be saved you may. Heaven goes a begging this day, whosoever will let him drink of the water of life freely; it may be some of you have been great sinners, some of you old corrupted sinners: yet if you will, I say, if you will, you may be the Sons of God, heirs, joint heirs with the Lord Jesus Christ. You that are children of wrath, if you will, you may be heirs of grace. Behold Christ stands at the door and knocks: this day He knocks once more; He cries, ‘whosoever will’… Remember (sirs) Jerusalem might have been gathered, even as a hen gathers her chickens under her wings, but she would not; if you will not, Christ has washed his hands of your blood: your damnation is of yourselves. And ah! think, (poor creatures) think what bad terms these are to be damned upon: what a gnawing upon your conscience in Hell another day will it be to think, If I would I might have been saved; Heaven and glory might have been mine if I would, but now I am tormented, and shall be so forever, because I would not have the Lord Jesus Christ; this makes damnation the heavier, to think, there is no more required but only to open the door to receive the Lord Jesus Christ. … Behold! He stands at the door and knocks: He is willing, He is willing, He stands at the door: thy opening is after his knocking; He knocks this day, He calls to thee (Ah Lord! Break open the door that will not open!) thou are prevented with love, He stands at the door, and knocks before thou canst have the least thought of opening; Hark (sinner!) hear Him knocking; ‘Turn, turn, why will ye die O house of Israel?’ Hear Him calling, drunkard, vain person, swearer, Sabbath breaker, turn, open the doors of your hearts.”

<blockquote><p>And he ran before, and climbed up into a sycomore tree to see him: for he was to pass that way. And when Jesus came to the place, he looked up, and saw him, and said unto him, ‘Zacchaeus, make haste, and come down; for to day I must abide at thy house.’ And he made haste, and came down, and received Him joyfully. And when they saw it, they all murmured, saying, That he was gone to be guest with a man that is a sinner. And Zacchaeus stood, and said unto the Lord: Behold, Lord, the half of my goods I give to the poor; and if I have taken any thing from any man by false accusation, I restore him fourfold. And Jesus said unto him, ‘This day is salvation come to this house, forsomuch as he also is a son of Abraham. For the Son of man is come to seek and to save that which was lost.&#x27;</p></blockquote>

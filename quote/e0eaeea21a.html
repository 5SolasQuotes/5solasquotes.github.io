<main class="wrap"><figure class="quote" id="q-e0eaeea21a" data-kw="">
<blockquote><p>The Puritan objection to the oath ex officio loomed large in the controversy of the time, and lawyers as well as divines vigorously denounced its use as illegal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, eds. Peel &amp; Carlson, Cartwrightiana (London: Halley Stewart, 1951) | 3. ‘The Imprisoned Ministers and the Oath Ex Officio [out of duty]’, pp. 28-30 Cartwright authored this with eight other English presbyterian ministers., p. 28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Puritan objection to the oath ex officio loomed large in the controversy of the time, and lawyers as well as divines vigorously denounced its use as illegal.”

— Thomas Cartwright, eds. Peel &amp; Carlson, Cartwrightiana (London: Halley Stewart, 1951) | 3. ‘The Imprisoned Ministers and the Oath Ex Officio [out of duty]’, pp. 28-30 Cartwright authored this with eight other English presbyterian ministers., p. 28">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Puritan+objection+to+the+oath+ex+officio+loomed+large+in+the+controversy+of+the+time%2C+and+lawyers+as+well+as+divines+vigorously+denounced+its+use+as+illegal.%E2%80%9D%0A%0A%E2%80%94+Thomas+Cartwright%2C+eds.+Peel+%26+Carlson%2C+Cartwrightiana+%28London%3A+Halley+Stewart%2C+1951%29+%7C+3.+%E2%80%98The+Imprisoned+Ministers+and+the+Oath+Ex+Officio+%5Bout+of+duty%5D%E2%80%99%2C+pp.+28-30+Cartwright+authored+this+with+eight+other+English+presbyterian+ministers.%2C+p.+28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe0eaeea21a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e0eaeea21a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-jurisprudence/#:~:text=The%20Puritan%20objection%20to%20the%20oath,vigorously%20denounced%20its%20use%20as%20illegal&amp;text=The%20Puritan%20objection%20to%20the%20oath%20ex%20officio&amp;text=as%20divines%20vigorously%20denounced%20its%20use%20as%20illegal" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The universal moral law either impressed by God upon the mind of all people or immediately discerned by the reason in its encounter with the order of nature. The natural law was therefore available even to those pagans who did not have the advantage of the Sinaitic revelation and the lex Mosaica [Law of Moses], with the result that they were left without excuse in their sins, convicted by conscientia [conscience]. The scholastics argue the identity of the lex naturalis [Natural Law] with the lex Mosaica or lex moralis [Moral Law] quod substantiam, according to substance, and distinguish them quod formam, according to form. The lex naturalis is inward, written on the heart and therefore obscure, whereas the lex Mosaica is revealed externally and written on tablets and thus of greater clarity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Greek and Latin Theological Terms 1st</cite>, ed. (Baker, 1985), pp. 174-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-d330f3a329" data-kw="">
<blockquote><p>§ 10, Direction 7. Meddle not with lawsuits till you have offered an equal arbitration of indifferent men, or used all possible means of love to prevent them. Lawsuits are not the first, but the last remedy. Try all others before you use them. § 11, Direction 8. When you must needs go to law, compose your minds to unfeigned love towards him that you must contend with, and watch over your hearts with suspicion and the strictest care, lest secret disaffection get advantage by it; And go to your neighbor and labor to possess his heart also with love, and to demulce [pacify] his mind, that you may not use the courts of justice as soldiers do their weapons, to do the worst they can against another, as an enemy: but as loving friends do use an amicable arbitration, resolving contentedly to stand to what the judge determines, without any alienation of mind or abatement of brotherly love. § 12, Direction 9. Be not too confident of the righteousness of your own cause, but ask counsel of some understanding, godly and impartial men; and hear all that can be said, and patiently consider of the case, and do as you would have others do by you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), pt. 4, ch. 22, ‘Cases &amp; Directions Against Injurious Law-Suits, Witnessing and Judgment’, p. 151</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

o%20by%20you&amp;text=10%2C%20Direction%207.%20Meddle%20not%20with%20lawsuits&amp;text=as%20you%20would%20have%20others%20do%20by%20you" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5801a9a2c8" data-kw="">
<blockquote><p>In substance, the lex moralis [moral law] is identical with the lex naturalis [natural law], but, unlike the natural law, it is given by revelation in a form which is clearer and fuller than that otherwise known to the reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Greek and Latin Theological Terms 1st</cite>, ed. (Baker, 1985), pp. 173-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“In substance, the lex moralis [moral law] is identical with the lex naturalis [natural law], but, unlike the natural law, it is given by revelation in a form which is clearer and fuller than that otherwise known to the reason.”

— Richard Muller, Dictionary of Greek and Latin Theological Terms 1st ed. (Baker, 1985), pp. 173-4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+substance%2C+the+lex+moralis+%5Bmoral+law%5D+is+identical+with+the+lex+naturalis+%5Bnatural+law%5D%2C+but%2C+unlike+the+natural+law%2C+it+is+given+by+revelation+in+a+form+which+is+clearer+and+fuller+than+that+otherwise+known+to+the+reason.%E2%80%9D%0A%0A%E2%80%94+Richard+Muller%2C+Dictionary+of+Greek+and+Latin+Theological+Terms+1st+ed.+%28Baker%2C+1985%29%2C+pp.+173-4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5801a9a2c8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5801a9a2c8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/natural-law/#:~:text=In%20substance%2C%20the%20lex%20moralis%20%5Bmoral,that%20otherwise%20known%20to%20the%20reason&amp;text=In%20substance%2C%20the%20lex%20moralis%20%5Bmoral%20law%5D%20is&amp;text=fuller%20than%20that%20otherwise%20known%20to%20the%20reason" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-020063863f" data-kw="">
<blockquote><p>Answer: Though the violation of the general [moral] law hurts the conscience, it being against the Fifth Commandment; it follows not that the violation of every particular law, even that that is merely positive, hurts the conscience before God: For then the carrying of armor in the night [which is suspicious of violence and may be dangerous to a town], suppose no ruler on earth make a law there anent, should be a sin before God, which no wise-man can say. 2. The other reason is more important, and draws with it that school-question agitated by [civil] jurists also and [ecclesiastical] canonists, An ulla detur lex pure paenalis; ‘If there be a law purely penal,’ without sin in it: And if the law of rulers in things merely positive be merely penal and co-active, and not formally obliging [connected] to sin. But I Answer: Rulers do justly punish the transgression of a positive law, not as particularly human and positive: But as:

1. It has connection with the moral reason of the law.

2. As the particular transgression is scandalous and against order, in which case the formal object of the just punishment inflicted by the ruler, is in very deed not the simple omission of the positive act of a particular human law, but the violation of the moral goodness annexed to it, and of the scandal given. Now in this meaning, the transgression of the positive human law is not kindly [in its kind], per se, of itself punishable, but by accident, and so it binds the conscience by accident; and in this sense, great doctors, as Ambrose, Anselm, Theodoret, Chrysostom, Navarra, Felinus, Taraquel, say that human laws oblige the conscience. But the most learned of the [ecclesiastical] canonists aver that not to obey civil laws, laying aside the evil of scandal, is no mortal sin, and so does not involve the conscience in guiltiness before God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), ch. 2, pp. 216-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

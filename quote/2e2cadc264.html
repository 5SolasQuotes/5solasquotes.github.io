<main class="wrap"><figure class="quote" id="q-2e2cadc264" data-kw="">
<blockquote><p>Yea also according to public extremities and necessities must our prayers be ordered, as in time of drought, for when fair weather is seasonable, for fair weather (1 Kings 18:42; Jam. 5:18): in time of plague (2. Sam. 24:25), etc. famine (Joel 1:14), war (Ex. 17:10-11), or any other like distress, for succor against those messengers of death: that thus so long as God hath appointed us to live in this world, we may comfortably pass over that time of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Go to God: or, an Explanation of the Perfect Pattern of Prayer, the Lord’s Prayer</cite>, (London, 1626) 1625 was a plague year in London., p. 118</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<blockquote><p>2. He [the king] is the head of the persons who make the Church, and so is a politic-head, but he is not the head of the Church-visible, as it is such. The head-visible and members are of one nature; the king as king is a politic and civil head; the visible Church is not a politic and civil, but an ecclesiastic body… Nathan as a man was David’s servant, but as a prophet he was God’s servant, and not David’s servant.</p></blockquote>

</figure><figure class="quote" id="q-6dd88f4c74" data-kw="">
<blockquote><p>7th Conclusion. When the representative Church is universally apostatical, then may the prince use the help of the Church-essential of found believers, for a reformation; and if they also be apostatic (which cannot be, except the Lord utterly have removed his candlestick) we see not what he can do but hear witness against them, but if there be any secret seeker of God in whose persons the essence of a true Church is conserved. The king by a royal power, and the law of charity is obliged to reform the land, as the godly kings with a blessed success have hitherto done, Asa, Josiah, Jehoshaphat, in which case the power of reformation and of performing many acts, of due belonging to the Church officers, are warrantably performed by the king, as in a diseased body, in an extraordinary manner power recurs from the members to the politic head and Christian prince, who both, as a King, in an authoritative way is obliged to do more then ordinary, and as a Christian member of the Church, in a charitative and common way, is to care for the whole body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), p. 419</span></figcaption>

t="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-678f7064e9" data-kw="">
<blockquote><p>…hereafter we must see concerning the selling and buying of things necessary… it is a thing doubtless greatly material that not only things hurtful be not brought into the city, but also the things good and profitable should be brought, but with such a proviso that the things that are to be brought in be set abroad and sold with least danger. Here therefore laws are to be made [of] what kinds of meats [foods] may be lawful to be sold and what not… and a certain penalty by the Preservers [civil health officials appointed for the time of the plague] to be set upon the offenders. … Lastly, also as touching the place wherein all things pertaining unto meat and drink are to be sold, something must be added. For it seems not convenient that all things should be brought into one market. For so it must needs be that a mighty multitude of people should come together… the infection must with all diligence be shunned, as has been often said already. There must therefore be ordained many places in sundry parts of the city where those things must be set which pertain unto food and are needful for everyone. Let there also be a several [different] market for flesh and fish, for herbs and fruits, that all discommodities which may arise by the mingling together of a multitude of people and bringing of things sellable, may with all diligence be avoided.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection in the Time of the Plague or Pestilence, Two Books</cite>, (London, 1583), bk. 1, ch. 7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

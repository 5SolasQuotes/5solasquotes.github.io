<main class="wrap"><figure class="quote" id="q-46f3a3b215" data-kw="">
<blockquote><p>In the very morning of the creation, God revealed himself to man as a holy and just God, whose eyes could behold no iniquity; and therefore he made him upright, and made a covenant of life and peace with him, to give him immortal and eternal life,—to continue him in his happy estate, if so be he continued in well-doing; Rom. 10.5, “do this and live.”

In which covenant, indeed, there were some outbreakings of the glorious grace and free condescendency of God; for it was no less free grace and undeserved favour to promise life to his obedience, than now to promise life to our faith. So that if the Lord had continued that covenant with us, we ought to have called it grace, and would have been saved by grace as well as now; though it be true, that there is some more occasion given to man’s nature to boast and glory in that way, yet not at all before God, Rom. 4.2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of the Christian Religion, Clearly Proved, and Singularly Improved. Or, A Practical Catechism</cite>, (1672) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), i, 61.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f25284b93f" data-kw="">
<blockquote><p>And herein is a solemn prefiguration of the implanting of believers of all nations into the covenant and faith of Abraham; for this name he received upon the solemn establishment of the covenant with him, as the apostle explains the place, Rom. 4:11–17. All, then, that believe are taken into the covenant of Abraham; and as unto the privileges of it, and inheritance to be obtained by it, they are no less his children and heirs than those who proceeded from his loins according to the flesh; as hath been manifested in our Exercitation concerning the oneness of the church. And herein also God manifested what was his design in his call and separation unto himself, even to make and constitute him and his posterity the means of bringing forth the promised Seed, wherein all nations were to be blessed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 1.450.</span></figcaption>

<blockquote><p>80 Thesis.

The Covenant of Nature is that whereby God, by right of Creation, doth require a perfect obedience of all mankind, and promises a most blessed life to as many as do give it him, to be lived in Paradise: but against those that deny him this perfect obedience, he doth denounce eternal death; and that for this end, that it may appear to all, how greatly he is in love with virtue, and how infinitely he hateth vice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Theses, or, Positions Concerning the Three-Fold Covenant of God with Man</cite>, in Samuel Bolton, The True Bounds of Christian Freedom (London, 1656), p. 400.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-6d9ae7c8f5" data-kw="">
<blockquote><p>In the Hebrew it is, ‘He does not afflict from his heart,’ that is, with pleasure and delight; or (which seems the best sense to me) not from his own mere motion without a cause given Him from the persons afflicted. Hence judgment is called God’s ‘strange work‘ [Isa. 28:21]. Showing mercy is his proper natural work, which flows from Himself without any cause in the creature. Judgment is his strange work, to which He never proceeds but when provoked, and as it were forced from the creature, whence it follows that He cannot delight in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11</cite>, on Lamentations 3, verse 33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>I am not a huge fan of the term “Christian Reconstruction”, owing primarily to its associations with Kuyperianism, Voluntaryism and Libertarian Theology. However, it should be recognised that the points that American Theonomists/Reconstructionists have made about the need for civil government to be reconstructed upon the principles of biblical law is perfectly in accord with Reformed and Covenanter views of the state (there are differences in application, but there is no debate about the need for civil government to submit to biblical law). We find a rather interesting, establishmentarian approach to the reconstruction of civil government in the extract below from the Revd Peter MacIndoe (a Scottish Reformed Presbyterian minister):

But we are strongly persuaded, that when God speaks to the members of civil society, they are bound to hear; that the laws he delivers to them for governing their social interests, are much superior to any they can extract from a human source; and that all orders of the state, from the humblest citizen to the reigning prince, are under obligations to obey those laws, whatsoever the line of policy they prescribe. Such, I repeat, is our fundamental principle, – a principle to which we attach supreme importance, and of which we entertain a deep-rooted conviction, – a principle the efficient application of which in the re-construction of governments, would secure to states universal prosperity, and to the statesmen immortal renown.

It is very true, the practical application of the divine law, to “all the political governments of Europe,” would show the necessity of great changes. Whatever in them is opposed to justice, benevolence, humanity, honour, equality of rights, protection of property, general education, and true religion, would be condemned. Purified from innumerable abuses, they would no longer oppress their subjects, withhold political rights, restrain commercial enterprise, prefer the evils of popular ignorance to the blessings of useful knowledge, nor squander, on the votaries of superstition, the millions they ought to give for the support of pure christianity. A new era, indeed, would arrive in their history. Approaching, as far as human infirmities will allow, the grand model of perfect excellence presented in the scriptures, they would attract esteem by moral attributes which they have never before accomplished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-macindoe.html">Peter MacIndoe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Defence of the Reformed Presbyterian Church, from attacks in “Statement of the Berwickshire Bible Society”</cite>, (Edinburgh, 1835), p. 9.</span></figcaption>

<blockquote><p>This quotation is useful for understanding the rationale behind the descending obligation of national covenants:

By the term nation, as it is employed in common speech, and as we design to use it in the discussion of this subject, is intended an organised community, placed under a system of political government, capable of intercourse with other communities, and the subject of reward and punishment. It is hardly necessary to remark that the term does not refer to one generation merely. Both by the common consent of mankind, and by Jehovah, the moral Governor of the universe, a nation is regarded as a permanent body, having a continued moral identity, notwithstanding various physical changes, so that the political body remains the same, though the persons who compose it successively pass off the stage of time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of Nations favoured with Divine Revelation to promote Scriptural Education: In Two Discourses</cite>, (Belfast, 1840), p. 8.</span></figcaption>

<blockquote><p>1. That the government of the Church is not Monarchical, no Monarch save Christ alone is Head and King of the Church, though every Monarch that’s truly Christian be a King in the Church; For it is one thing to be a King in the Church, and another to be King over the Church.

2. Every King as a member of the Church, is in an Ecclesiastical sense subject to the discipline of the Church; for such a kind of subjection will well consist with his Civil Sovereignty, because it is not a Civil Subjection. Judicious [John] Camero[n] was a man very tender of pitching upon any conclusion which might be prejudicial unto Kingly power, and he useth an excellent similitude to illustrate this point: As it is in the cure of the body, so is it in the cure of the Soul; now a King for the Cure of his body, must patiently yield himself to his College of Physicians, for though he rule over them as a King, yet he must be ruled by them as a patient. In like manner a wise King will (and every King ought to) be persuaded by the College Ecclesiastical in point of discipline to obey the Rules and orders of Jesus Christ; for the King in this point doth not obey the College, but Christ himself.

3. It is well known that Kings and Emperors have been subjected to Episcopal, and too often enslaved by Prelatical power. Who knows not that the Bishop [Ambrose] of Milan would not admit the Emperor to the Communion till he had repented of that outrage, and bloodshed at Thessalonica, which was occasioned by the Emperor’s passionate Command? It is generally confessed, that Ambrose did well in rejecting the Emperor from the Communion, and that the Emperor was no less an Emperor, and a far better man by submitting to a Minister of the Gospel, preaching, and administering some part of the discipline of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sion’s memento, and Gods alarum. In a sermon at Westminster, before the Honourable House of Commons, on the 31. of May 1643. the solemn day of their monthly fast</cite>, (London: Samuel Gellibrand, 1643), pp 30-31.</span></figcaption>

<blockquote><p>4. It is, therefore, a diabolical opinion, which has possessed the minds of almost all those who lay claim to gentility, that they cannot bear, even a reproachful word, without the loss of their honour and their reputation; but are under the necessity of seeking revenge in a duel, at the manifest peril of their own lives, and a plain attack upon the life of another.

This more than heathenish opinion can be refuted by many arguments:

1. We pull down the very foundation of what we are striving to build, by laying down this maxim. It is not a sign of a cowardly or ignoble mind, nor disgraceful or mean in a Christian, to bear injuries, but to inflict them. This was briefly proved above, when we were reasoning on meekness, patience, and their acts: we will now add, that this was even approved by the very heathens, especially the wiser among them.

Socrates, as we find in Plato (in his Gorgia) draws the conclusion, that every injury is dishonourable and infamous to the inflictor of it, not to him who suffers it; and that, as he says himself, for the strongest and most solid reasons … Aristotle follows the same opinion in his Ethics 5. cap. 11, giving this reason; To inflict an injury is the effect of dishonesty; and on that account dishonourable and infamous: but to suffer one with equanimity is the effect of virtue, and therefore glorious.

Seneca, in that book where he professedly considers whether an injury can affect a wise man, writes; We ought to despise injuries, and what I may call the shadow of injuries, contumely, whether they fall deservedly or undeservedly upon us. If deservedly, it is not contumely, but judgment given; if undeservedly, it is for him who did the injury, and not for me to be ashamed of it. That we may not accumulate more from profane authors, we have the opinion of Christ himself, Matt. v. 11, Blessed are ye when men shall revile you.

2. Should we grant that injury or contumely has been cast upon us, and that to do this is criminal; nevertheless it by no means follows, that it is lawful to repel it by means of a duel: and that for these reasons;

1. No one ought to be judge in his own cause; and, least of all, one who is disturbed with anger, violence, and the passion of revenge. Tertullian, De patient, says, What have I to do with a passion, which 1 cannot govern through impatience?

2. Individuals do injury to God and his vicarious representative, the magistrate, when they seek to revenge themselves by private means. Vengeance is mine, and I will repay, saith the Lord, Deut. xxxii. 35; and Rom. xiii. 14, Paul says of the magistrate, He beareth not the sword in vain. But he would bear it in vain, if it was allowed to an individual to draw the sword at his own pleasure.

3. Duellists would punish every injury with the same punishment, namely, death; which is not the judgment of a generous man, but of a madman. Now every punishment inflicted by one possessed of all his faculties, ought to be commensurate with the offence.

We shall conclude with the saying of Christ. Matt. xxvi. 52, All they that take the sword shall perish with the sword; that is, as Augustine interprets it, Every one who without legitimate authority granted to him, or enjoining him so to do, shall arm himself against the life of any man, shall perish either by the sword of man, or that of Divine vengeance. From all these reasons it appears clear, that they are absolutely madmen, who follow the opinions of the many, renouncing the doctrine of Christ: so that they may retain the name of Gentlemen, they do not fear the title of homicide; and, finally, so that they may avoid a suspicion of false infamy, they leap into the very pit of hell itself.</p></blockquote>

Socrates, as we find in Plato (in his Gorgia) draws the conclusion, that every injury is dishonourable and infamous to the inflictor of it, not to him who suffers it; and that, as he says himself, for the strongest and most solid reasons … Aristotle follows the same opinion in his Ethics 5. cap. 11, giving this reason; To inflict an injury is the effect of dishonesty; and on that account dishonourable and infamous: but to suffer one with equanimity is the effect of virtue, and therefore glorious.

Seneca, in that book where he professedly considers whether an injury can affect a wise man, writes; We ought to despise injuries, and what I may call the shadow of injuries, contumely, whether they fall deservedly or undeservedly upon us. If deservedly, it is not contumely, but judgment given; if undeservedly, it is for him who did the injury, and not for me to be ashamed of it. That we may not accumulate more from profane authors, we have the opinion of Christ himself, Matt. v. 11, Blessed are ye when men shall revile you.

2. Should we grant that injury or contumely has been cast upon us, and that to do this is criminal; nevertheless it by no means follows, that it is lawful to repel it by means of a duel: and that for these reasons;

1. No one ought to be judge in his own cause; and, least of all, one who is disturbed with anger, violence, and the passion of revenge. Tertullian, De patient, says, What have I to do with a passion, which 1 cannot govern through impatience?

2. Individuals do injury to God and his vicarious representative, the magistrate, when they seek to revenge themselves by private means. Vengeance is mine, and I will repay, saith the Lord, Deut. xxxii. 35; and Rom. xiii. 14, Paul says of the magistrate, He beareth not the sword in vain. But he would bear it in vain, if it was allowed to an individual to draw the sword at his own pleasure.

3. Duellists would punish every injury with the same punishment, namely, death; which is not the judgment of a generous man, but of a madman. Now every punishment inflicted by one possessed of all his faculties, ought to be commensurate with the offence.

We shall conclude with the saying of Christ. Matt. xxvi. 52, All they that take the sword shall perish with the sword; that is, as Augustine interprets it, Every one who without legitimate authority granted to him, or enjoining him so to do, shall arm himself against the life of any man, shall perish either by the sword of man, or that of Divine vengeance. From all these reasons it appears clear, that they are absolutely madmen, who follow the opinions of the many, renouncing the doctrine of Christ: so that they may retain the name of Gentlemen, they do not fear the title of homicide; and, finally, so that they may avoid a suspicion of false infamy, they leap into the very pit of hell itself.”

— John Davenant, An Exposition of the Epistle of St. Paul to the Colossians, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1832), 2: 116-18.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+It+is%2C+therefore%2C+a+diabolical+opinion%2C+which+has+possessed+the+minds+of+almost+all+those+who+lay+claim+to+gentility%2C+that+they+cannot+bear%2C+even+a+reproachful+word%2C+without+the+loss+of+their+honour+and+their+reputation%3B+but+are+under+the+necessity+of+seeking+revenge+in+a+duel%2C+at+the+manifest+peril+of+their+own+lives%2C+and+a+plain+attack+upon+the+life+of+another.%0A%0AThis+more+than+heathenish+opinion+can+be+refuted+by+many+arguments%3A%0A%0A1.+We+pull+down+the+very+foundation+of+what+we+are+striving+to+build%2C+by+laying+down+this+maxim.+It+is+not+a+sign+of+a+cowardly+or+ignoble+mind%2C+nor+disgraceful+or+mean+in+a+Christian%2C+to+bear+injuries%2C+but+to+inflict+them.+This+was+briefly+proved+above%2C+when+we+were+reasoning+on+meekness%2C+patience%2C+and+their+acts%3A+we+will+now+add%2C+that+this+was+even+approved+by+the+very+heathens%2C+especially+the+wiser+among+them.%0A%0ASocrates%2C+as+we+find+in+Plato+%28in+his+Gorgia%29+draws+the+conclusion%2C+that+every+injury+is+dishonourable+and+infamous+to+the+inflictor+of+it%2C+not+to+him+who+suffers+it%3B+and+that%2C+as+he+says+himself%2C+for+the+strongest+and+most+solid+reasons+%E2%80%A6+Aristotle+follows+the+same+opinion+in+his+Ethics+5.+cap.+11%2C+giving+this+reason%3B+To+inflict+an+injury+is+the+effect+of+dishonesty%3B+and+on+that+account+dishonourable+and+infamous%3A+but+to+suffer+one+with+equanimity+is+the+effect+of+virtue%2C+and+therefore+glorious.%0A%0ASeneca%2C+in+that+book+where+he+professedly+considers+whether+an+injury+can+affect+a+wise+man%2C+writes%3B+We+ought+to+despise+injuries%2C+and+what+I+may+call+the+shadow+of+injuries%2C+contumely%2C+whether+they+fall+deservedly+or+undeservedly+upon+us.+If+deservedly%2C+it+is+not+contumely%2C+but+judgment+given%3B+if+undeservedly%2C+it+is+for+him+who+did+the+injury%2C+and+not+for+me+to+be+ashamed+of+it.+That+we+may+not+accumulate+more+from+profane+authors%2C+we+have+the+opinion+of+Christ+himself%2C+Matt.+v.+11%2C+Blessed+are+ye+when+men+shall+revile+you.%0A%0A2.+Should+we+grant+that+injury+or+contumely+has+been+cast+upon+us%2C+and+that+to+do+this+is+criminal%3B+nevertheless+it+by+no+means+follows%2C+that+it+is+lawful+to+repel+it+by+means+of+a+duel%3A+and+that+for+these+reasons%3B%0A%0A1.+No+one+ought+to+be+judge+in+his+own+cause%3B+and%2C+least+of+all%2C+one+who+is+disturbed+with+anger%2C+violence%2C+and+the+passion+of+revenge.+Tertullian%2C+De+patient%2C+says%2C+What+have+I+to+do+with+a+passion%2C+which+1+cannot+govern+through+impatience%3F%0A%0A2.+Individuals+do+injury+to+God+and+his+vicarious+representative%2C+the+magistrate%2C+when+they+seek+to+revenge+themselves+by+private+means.+Vengeance+is+mine%2C+and+I+will+repay%2C+saith+the+Lord%2C+Deut.+xxxii.+35%3B+and+Rom.+xiii.+14%2C+Paul+says+of+the+magistrate%2C+He+beareth+not+the+sword+in+vain.+But+he+would+bear+it+in+vain%2C+if+it+was+allowed+to+an+individual+to+draw+the+sword+at+his+own+pleasure.%0A%0A3.+Duellists+would+punish+every+injury+with+the+same+punishment%2C+namely%2C+death%3B+which+is+not+the+judgment+of+a+generous+man%2C+but+of+a+madman.+Now+every+punishment+inflicted+by+one+possessed+of+all+his+faculties%2C+ought+to+be+commensurate+with+the+offence.%0A%0AWe+shall+conclude+with+the+saying+of+Christ.+Matt.+xxvi.+52%2C+All+they+that+take+the+sword+shall+perish+with+the+sword%3B+that+is%2C+as+Augustine+interprets+it%2C+Every+one+who+without+legitimate+authority+granted+to+him%2C+or+enjoining+him+so+to+do%2C+shall+arm+himself+against+the+life+of+any+man%2C+shall+perish+either+by+the+sword+of+man%2C+or+that+of+Divine+vengeance.+From+all+these+reasons+it+appears+clear%2C+that+they+are+absolutely+madmen%2C+who+follow+the+opinions+of+the+many%2C+renouncing+the+doctrine+of+Christ%3A+so+that+they+may+retain+the+name+of+Gentlemen%2C+they+do+not+fear+the+title+of+homicide%3B+and%2C+finally%2C+so+that+they+may+avoid+a+suspicion+of+false+infamy%2C+they+leap+into+the+very+pit+of+hell+itself.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+An+Exposition+of+the+Epistle+of+St.+Paul+to+the+Colossians%2C+trans.+Josiah+Allport+%281627%3B+2+vols%2C+London%3A+Hamilton%2C+Adams%2C+and+Co.%2C+1832%29%2C+2%3A+116-18.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F345243a23f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/345243a23f.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/08/04/john-davenant-on-the-evil-of-duels/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

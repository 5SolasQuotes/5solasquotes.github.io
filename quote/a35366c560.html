<blockquote><p>A question here ariseth about infants; Whether they are to be baptized, or not, seeing they cannot be taught or instructed about faith? I answer that the children, or infants of believers ought to be baptized, because while they are yet infants, as to the external privileges of the Covenant with God, they are accounted both persons and parties of, or belonging to their parents; and therefore they are of the family of Christ, or of the number of his disciples. For if the Covenant made with Abraham be the same for substance, by which we are saved, and belongeth as much to us and to our children as it did to Abraham and his posterity, then not only we, but our children also ought to be partakers of the seal of this Covenant. But the first is true, as appeareth by Rom. 4 and other places; and therefore the latter also is true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Christian Religion, or, A Plain and Easy Draught of the Christian Catechism in 52 Lectures… (London, 1659), The 26-27th Lord’s Days</cite>, p. 180</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

>Read it online · Reformed Books Online</a></div>

<blockquote><p>Objection [from a baptist]: The sanctification of the wife is but a civil sanctification in that place, i.e. she is sanctified to his use, that he ought not to put her away. Again, the holiness there spoken of is a fruit of that sanctification of the wife, whereof it will follow, that seeing [as] the effect cannot be greater then the cause, the cause cannot produce a greater effect than itself, the cause being only a civil sanctification, the holiness of the children must be the same; thus argues Thomas Collier. Answer 1: The question [in the text] was, Whether the believer were polluted by his unbelieving wife? The apostle says, ‘No’, quia pluris est pietas unius ad sanctificandum conjugium,quàm alterius impietas ad inquinandum, i.e. the faith of the believer is of greater force to sanctify their present cohabitation, than the unbelief of the other to pollute it. This he proves from a greater effect and fruit of the husband’s faith, viz. the holiness of the children born of such a husband by such a woman. The children are holy, not only civilly, as being born of lawful wedlock, but federally as being severed from all children of unbelievers by special prerogative, holy to the Lord, consecrated unto Him, whereas by nature they were aliens and unclean; according to that of Paul, Rom. 11:16, ‘if the root be holy, so are the branches.’ The faith of the believing party sanctifies the unbelieving wife to bear not only a lawful, but a holy seed; yea, it sanctifies the children and severs them from the common condition of other children, which are profane and unclean without the Church, without God in the world. 2. Note that the holiness of the child received from one of the parents believing is more than the sanctification of the wife by her believing husband, because such a wife is not taken into Covenant with her husband, but the child is; and therefore the apostle says not that such as is the sanctification of the wife, such is the holiness of the child: But thus, Such as is the holiness of the believing party, such is the child’s holiness in respect of Church-membership; and so the faith of the believing husband is the cause of both these effects, viz. That his coupling with his wife is not impure, and also that his children are holy: And this latter [is] an evidence of the former. And thus the holiness of the child is a sign of the mother’s sanctification to holy cohabitation, and an effect of the father’s faith by virtue of God’s Covenant. To have said, ‘That their children were lawful’, was no more than to have said, ‘That their marriage was lawful’, which was not the question; But to say, that the children of their lawful marriage were holy, this did infer not only the lawfulness of their marriage but the sanctified use: As Mr Baily has well observed, Of Anabaptism, p. 138. 3. Lastly, If by holy, be only meant a civil holiness, then on the contray, by ‘unclean’, must be meant a civil uncleanness. But when Paul says (else were your children unclean) his intent is not to make them all as an unclean birth and impure offspring, which were born at Corinth of unbelieving parents, but to show that they are not comprehended within God’s Covenant: And so when he says ‘but now are they holy’, he notes some preeminence of the children of Christians above the heathens’ children: Though in civil respects, in respect of a lawful birth, both sorts of children were equal, yet that civil holiness being common to both, there is a preeminence of the Christian’s child above the heathen’s. The child of an infidel at Corinth is today unclean and the next day holy in case his parents turn Christians; And what’s the reason of this so sudden alteration? It must needs be in regard of the Covenant into which the party now believing is taken with his children, his unbelieving neighbor with his children still remaining unclean: Hence I conclude with Calvin, in location, Seeing our children are exempted from the common condition of lost mankind, and admitted into God’s Church and family, Cur eos a signo arceamus? upon what reason can we drive them from the sign of their admittance?</p></blockquote>

</figure><figure class="quote" id="q-29e4908f08" data-kw="">
<blockquote><p>…we do not suppose that our salvation depends upon the sacrament of baptism, but upon our adoption according to the formula: “I will be your God and that of your seed.” [Gen. 17:7] We diligently attend to this adoption in the children of the saints according to the Word of the Lord since it has been sealed upon them through the sacrament of baptism… …little corruptions have arisen from no other source than from the understanding that baptism is necessary for salvation, which we consider entirely false. We hold this view to be false because adoption by God must take place before anyone can be baptized rightly. Otherwise, why is a confession of faith required of adults before thy are baptized? We believe, however, that the children of the saints have already been adopted right in the womb according to the covenantal formula. And so we baptize them. …We count as nonsense his assertion that children are holy–that is, in the outward company of the church–before their baptism. For the opposite is true: those children whom (we claim) the Lord has already truly adopted before, according to the covenantal formula, are introduced into the outward company of the church through baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain and Simple Treatise on the Lord’s Supper (1559, RHB, 2016)</cite>, p. 146-7</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…we do not suppose that our salvation depends upon the sacrament of baptism, but upon our adoption according to the formula: “I will be your God and that of your seed.” [Gen. 17:7] We diligently attend to this adoption in the children of the saints according to the Word of the Lord since it has been sealed upon them through the sacrament of baptism… …little corruptions have arisen from no other source than from the understanding that baptism is necessary for salvation, which we consider entirely false. We hold this view to be false because adoption by God must take place before anyone can be baptized rightly. Otherwise, why is a confession of faith required of adults before thy are baptized? We believe, however, that the children of the saints have already been adopted right in the womb according to the covenantal formula. And so we baptize them. …We count as nonsense his assertion that children are holy–that is, in the outward company of the church–before their baptism. For the opposite is true: those children whom (we claim) the Lord has already truly adopted before, according to the covenantal formula, are introduced into the outward company of the church through baptism.”

— Theodore Beza, A Plain and Simple Treatise on the Lord’s Supper (1559, RHB, 2016), p. 146-7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6we+do+not+suppose+that+our+salvation+depends+upon+the+sacrament+of+baptism%2C+but+upon+our+adoption+according+to+the+formula%3A+%E2%80%9CI+will+be+your+God+and+that+of+your+seed.%E2%80%9D+%5BGen.+17%3A7%5D+We+diligently+attend+to+this+adoption+in+the+children+of+the+saints+according+to+the+Word+of+the+Lord+since+it+has+been+sealed+upon+them+through+the+sacrament+of+baptism%E2%80%A6+%E2%80%A6little+corruptions+have+arisen+from+no+other+source+than+from+the+understanding+that+baptism+is+necessary+for+salvation%2C+which+we+consider+entirely+false.+We+hold+this+view+to+be+false+because+adoption+by+God+must+take+place+before+anyone+can+be+baptized+rightly.+Otherwise%2C+why+is+a+confession+of+faith+required+of+adults+before+thy+are+baptized%3F+We+believe%2C+however%2C+that+the+children+of+the+saints+have+already+been+adopted+right+in+the+womb+according+to+the+covenantal+formula.+And+so+we+baptize+them.+%E2%80%A6We+count+as+nonsense+his+assertion+that+children+are+holy%E2%80%93that+is%2C+in+the+outward+company+of+the+church%E2%80%93before+their+baptism.+For+the+opposite+is+true%3A+those+children+whom+%28we+claim%29+the+Lord+has+already+truly+adopted+before%2C+according+to+the+covenantal+formula%2C+are+introduced+into+the+outward+company+of+the+church+through+baptism.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+A+Plain+and+Simple+Treatise+on+the+Lord%E2%80%99s+Supper+%281559%2C+RHB%2C+2016%29%2C+p.+146-7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F29e4908f08.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/29e4908f08.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/baptism/infant-baptism/children-of-professing-believers-are-baptized-because-they-are-in-the-covenant/#:~:text=we%20do%20not%20suppose%20that%20our,company%20of%20the%20church%20through%20baptism&amp;text=we%20do%20not%20suppose%20that%20our%20salvation%20depends&amp;text=the%20outward%20company%20of%20the%20church%20through%20baptism" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

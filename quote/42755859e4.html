<main class="wrap"><figure class="quote" id="q-42755859e4" data-kw="">
<blockquote><p>Here [London] you may likewise see a Reverend Assembly of grave and learned Divines, who daily wait upon the Angel in the Mount, to receive from him the lively Oracles, and the pattern of God’s house, to present unto you. All these are of our own Nation; and with them you may see the Honourable, reverend, and learned Commissioners of the Church of Scotland; and in them behold the wisdom and affection of their whole Church and Nation, willing to live and die with us.

All these you may behold in one view; and which is more, you may behold them all of one heart, and one mind, after so many plots and conspiracies to divide them one from another, and thereby to ruin them all: And which is yet more, you may see them all met together this day on purpose, both to praise God for this union, and to rejoice in it, and to hold it out to all the world, and thereby to testify, that as one man they will live and die together in this common cause of God, of our Lord Jesus Christ, his Church, and these three kingdoms. O beloved! how beautiful is the face of this Assembly?</p></blockquote>

<blockquote><p>[John Owen:] ‘To make men members of any particular churches, their own consent is required.’ If he mean this of an explicit consent (as I suppose he does, or he says nothing) it is fully disproved above; and implicit confessed [consent is] sufficient. A man that removes his habitation (as both he and we grant, it’s free for him to do) may, by setting down in another congregation and submitting himself to all the ordinances of Christ there, with performance of all offices of love to the members of that congregation, implicitly and yet sufficiently consent[s] to be a member thereof. And on the other hand, a man may not remove his habitation from a congregation wherein he has long consented to communicate, and yet remove his consent to be a member of another, as we see too much, in this loose and wandering age.</p></blockquote>

<blockquote><p>In the earlier years of this blog, we advocated the traditional Reformed Presbyterian (RP) doctrine of political dissent. Further study has convinced us that this view, as far as it pertains to Britain, is at odds with the original Covenanter and Westminster doctrine of civil magistracy. Thomas Boston – who was a Covenanter, but not an RP – helpfully pointed out that the early RP position actually contradicted the original intent of the National Covenant of 1638 and the Solemn League and Covenant of 1643. We realise that modern RPs have modified this position somewhat, yet Boston’s comments are still worthy of consideration:

I find, that at the first taking of the covenant, they swear to maintain the King’s authority: as also, when, with additions, it was renewed in the year 1638, they swear to stand to the defence of his majesty’s person and authority. How agrees our dissenters’ principle, rejecting the authority of the Queen, with this part of the covenant? O, say they, “she is not a covenanted Queen, and therefore cannot be Queen of a covenanted land.”

Strange prejudices! Was not Scotland a covenanted land long ere the Solemn League and Covenant was heard tell of? Was not king Charles I. King of a covenanted land at that time when the covenant was renewed, and his authority sworn to be defended? But was he a covenanted king? Did he own their covenant? No, no; upon the contrary; he obliged some of their nobles at London to abjure it, declared the covenanters rebels, and brought down an army against them to force them from it. See Apologetical Relation, page 53.

As for the Solemn League and Covenant, we find them guilty the same way. It binds us expressly against schism, as well as Prelacy, superstition, and heresy. And that they are guilty of schism has been proven before. It also bound to the maintaining of the king’s authority, it being far from the mind of the covenanters to cast off the authority of the magistrate, though it was entered into without the king’s consent. Was it ever the mind of the covenanters that they would own no king, but one that had taken this covenant? I am sure the Parliament of Scotland thought not so, when in the year 1649 they proclaimed and declared to all the world, That Charles II was king of Great Britain, etc., their sovereign lord and king; and this was a full year before he took the covenant: for which see the Apologetical Relation, pp. 64, 65.

Nor did the General Assembly 1649 think so, when in their letter to the King’s Majesty (to be found amongst the printed Acts of the Assembly, in their last session), before he was come home, or had taken the Covenant, they call him “Most gracious Sovereign,” and subscribe the letter thus, “Your Majesty’s most loyal subjects, and humble servants, the Ministers and Elders convened in this national Assembly of the Kirk of Scotland:” While, in the mean time they tell him in the same letter, “That he had settled a peace with the Irish Papists, the murderers of so many thousands of his Protestant subjects, and granted to them (contrary to the standing laws of his royal progenitors) a full liberty of their abominable idolatry; which, say they, cannot be otherwise judged, but a giving of your royal power to the Beast;” and they exhort him to lay aside the service-book.

And several other things may be there found, that may make men blush to talk of their agreeing with the Church of Scotland in her principles in these times, and yet rejecting the authority of the present Queen. And, which is most lamentable, even those worthies that laid down their lives for the covenants, whose testimonies are recorded in Naphtali, having owned the King’s authority, and prayed for him on the scaffolds, must by this new doctrine be reputed to die as fools, who understood not the covenants they were laying down their precious lives for.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Evil and Danger of Schism. A Sermon, by the late Learned and Pious Mr. Thomas Boston, Minister of the Gospel at Etterick</cite>, (1708; 3rd edn, Oxnam, 1756), pp 22-24.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

r+the+Solemn+League+and+Covenant%2C+we+find+them+guilty+the+same+way.+It+binds+us+expressly+against+schism%2C+as+well+as+Prelacy%2C+superstition%2C+and+heresy.+And+that+they+are+guilty+of+schism+has+been+proven+before.+It+also+bound+to+the+maintaining+of+the+king%E2%80%99s+authority%2C+it+being+far+from+the+mind+of+the+covenanters+to+cast+off+the+authority+of+the+magistrate%2C+though+it+was+entered+into+without+the+king%E2%80%99s+consent.+Was+it+ever+the+mind+of+the+covenanters+that+they+would+own+no+king%2C+but+one+that+had+taken+this+covenant%3F+I+am+sure+the+Parliament+of+Scotland+thought+not+so%2C+when+in+the+year+1649+they+proclaimed+and+declared+to+all+the+world%2C+That+Charles+II+was+king+of+Great+Britain%2C+etc.%2C+their+sovereign+lord+and+king%3B+and+this+was+a+full+year+before+he+took+the+covenant%3A+for+which+see+the+Apologetical+Relation%2C+pp.+64%2C+65.%0A%0ANor+did+the+General+Assembly+1649+think+so%2C+when+in+their+letter+to+the+King%E2%80%99s+Majesty+%28to+be+found+amongst+the+printed+Acts+of+the+Assembly%2C+in+their+last+session%29%2C+before+he+was+come+home%2C+or+had+taken+the+Covenant%2C+they+call+him+%E2%80%9CMost+gracious+Sovereign%2C%E2%80%9D+and+subscribe+the+letter+thus%2C+%E2%80%9CYour+Majesty%E2%80%99s+most+loyal+subjects%2C+and+humble+servants%2C+the+Ministers+and+Elders+convened+in+this+national+Assembly+of+the+Kirk+of+Scotland%3A%E2%80%9D+While%2C+in+the+mean+time+they+tell+him+in+the+same+letter%2C+%E2%80%9CThat+he+had+settled+a+peace+with+the+Irish+Papists%2C+the+murderers+of+so+many+thousands+of+his+Protestant+subjects%2C+and+granted+to+them+%28contrary+to+the+standing+laws+of+his+royal+progenitors%29+a+full+liberty+of+their+abominable+idolatry%3B+which%2C+say+they%2C+cannot+be+otherwise+judged%2C+but+a+giving+of+your+royal+power+to+the+Beast%3B%E2%80%9D+and+they+exhort+him+to+lay+aside+the+service-book.%0A%0AAnd+several+other+things+may+be+there+found%2C+that+may+make+men+blush+to+talk+of+their+agreeing+with+the+Church+of+Scotland+in+her+principles+in+these+times%2C+and+yet+rejecting+the+authority+of+the+present+Queen.+And%2C+which+is+most+lamentable%2C+even+those+worthies+that+laid+down+their+lives+for+the+covenants%2C+whose+testimonies+are+recorded+in+Naphtali%2C+having+owned+the+King%E2%80%99s+authority%2C+and+prayed+for+him+on+the+scaffolds%2C+must+by+this+new+doctrine+be+reputed+to+die+as+fools%2C+who+understood+not+the+covenants+they+were+laying+down+their+precious+lives+for.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+The+Evil+and+Danger+of+Schism.+A+Sermon%2C+by+the+late+Learned+and+Pious+Mr.+Thomas+Boston%2C+Minister+of+the+Gospel+at+Etterick%2C+%281708%3B+3rd+edn%2C+Oxnam%2C+1756%29%2C+pp+22-24.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6973bade2b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6973bade2b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/08/26/thomas-boston-on-the-original-covenanters-and-the-hyper-covenanter-error-of-political-dissent/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

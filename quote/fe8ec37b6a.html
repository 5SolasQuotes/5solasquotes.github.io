<blockquote><p>Concerning the matter of the Church, the Independents have learned all their unjust scrupulosity from the other; as the Brownists require every Church member to be a Saint, really regenerate and justified, who at their admission have publikely satisfied the whole Congregation by convincing signs of their true holiness: the other requires the same.</p></blockquote>

<blockquote><p>First Argument [of Rutherford]: In the first receiving of members by the apostles, there was but a professed willingness to receive the Gospel, howbeit some received it not from the heart. Mr. Hooker answereth: ‘There was not only a professed willingness, but a practical reformation, that in the judgement of charity giveth grounds of hope that there is something real, before the contrary appear; Therefore, Peter who received Magus upon his approbation of the truth and outward conformity thereunto in the course of his life, rejected him as one in the gall of bitterness, who had no share in Christ, and therefore certainly would not suffer him in the privileges of communion, so persisting without repentance.’ [Rutherford’s] Answer 1: [Hooker says:] ‘Not professed willingness, but also practical reformation is required.’ But is not professed willingness in murderers of Christ, who said, ‘What shall we doe to be saved?’ some practical reformation? There is nothing but conjectures that the apostles did not admit all and every one of the three thousand until they had experience of their state of grace and judicially determined so of them all. ([Margin note:] Mr. Hooker neither proves, nor can prove that the apostles had habitual experience in so few hours, all and every one of the 3,000 (Acts 2) gave evidence of real conversion to the apostles.) (2). This practical reformation was not an experience of their practice of savory walking, required by Mr. Hooker (p. 1. ch. 2, pp. 14-15) in visible saints before admission, except some four or five hours time may create an habitual experience, for the same very day they were baptized (Acts 2:41). (3) Mr. Hooker should prove that the apostles found this practical reformation in all, Ananias, Saphira, and the whole 3000; and that the apostles tried and smelled the savouriness of saving grace in all; in Saphira; the text giveth not the least jot of this, we must take it upon the naked assertion of Mr. Hooker (4) That this practical reformation gave to the apostles’ judgement of charity ground of hope that there was something real, that is, the whole number, about three thousand (none excepted, for all were made Church-saints visible) gave grounds of hope that they were all really (otherwise their speaking and hearing the word was real, that is, not imaginary) internally and effectually called, and born over again of the spirit, and so chosen to life eternal from eternity, before the apostles durst, without the offending of God, admit them to Church-fellowship and visible communion; those [things] (I say) must be proven. If I durst [dare], I am not far from judging the godly and judicious in cold-blood, free of heat of dispute, dare not so judge of the text, Acts 2 or Acts 8. (5) There is no shadow, Acts 8, that Peter (Mr. Hooker should say Philip) admitted not Magus while he saw such grounds of the sorcerer’s real conversion and real predestination to glory. (6) Peter said that Magus had no share in Christ. True, but said he that he was an unbaptized man who had no share in the visible Church? No. (7) But he would not suffer Magus to share in the privileges of communion, he persisting without repentance. True, but it is no answer to the argument from the manner of receiving in, this is something to the casting out, (8) that Peter reproveth him in the gall of bitterness [and] 2. Exhorts him to repent, to pray for pardon, [these last two things] were great privileges of Church-communion bestowed upon Magus.</p></blockquote>

<blockquote><p>Cessation from labor for prayers or preaching on those appointed days of the week [by the Church], at some occasions, may be omitted… 3. …to leave work to come to the ordinary weekly meetings, they are only exhorted… for in one place where his [the bishop’s] antagonist maintains truly that the craftsman cannot be lawfully commanded nor compelled to leave his work and to go to public divine service, except on the day that the Lord has sanctified… …the 9th Head of the [Scottish] First Book of Discipline [1560], which says: ‘In great towns, we think expedient that every day there be either sermon or common prayers, etc.’ where there is nothing of compulsion or a forcing command; only there is an exhortation.</p></blockquote>

<blockquote><p>And upon the first day of the week, when the disciples came together to break bread, Paul preached unto them… and continued his speech until midnight… And there sat in a window a certain young man named Eutychus, being fallen into a deep sleep: and as Paul was long preaching, he sunk down with sleep, and fell down from the third loft, and was taken up dead. And Paul went down, and fell on him, and embracing him said, Trouble not yourselves; for his life is in him. When he therefore was come up again, and had broken bread, and eaten, and talked a long while, even till break of day, so he departed.” (Acts 20:7[-11]) Where we see that upon the Lord’s Day, when this casualty fell out even in the midst of God’s worship, and a little before the sacrament, that the congregation was for a time dissolved, and Paul the preacher, and the rest of the people, the hearers, came forth to succor this man, and then returned to perform the rest of God’s service that remained.</p></blockquote>

<blockquote><p>We have spoken at large of the participation of the grace of Christ and the benefits of the Gospel: Now we are come unto the means whereby God does effect these things. Show therefore how and in what manner God does offer and communicate the Covenant of Grace unto mankind? By vocation or calling, Rom. 8:30; Heb. 3:1, when God, by the means of his Word and Spirit acquainting men with his gracious purpose of salvation by Christ, invites them to come unto Him, Hos. 2:14, and revealing unto them his Covenant of grace, Mt. 11:27; 16:17; Jn. 14:21; Ps. 25:14, brings them out of darkness to light, Acts 26:18. Is this calling of one sort only? No: there is an external gathering common to all, together with some light of the Spirit and certain fruits of the same, attained unto by some that are not heirs of the promise: for many are called with this outward and ineffectual calling, who are not chosen, Isa. 48:12; Mt. 22:14. And there is an internal and effectual calling, peculiar to those few that are elect; whereby unfeigned faith and true repentance is wrought in the heart of God’s chosen; and God (become in Christ their Father) does not only outwardly by his Word invite, but inwardly also, and powerfully by his Spirit allure and win their hearts to cleave to Him inseparably unto salvation, Gen. 9:27; Ps. 25:14; 60:6. 5. 4; Joel 2:32; Acts 2:39. How do both these kinds of callings differ? Howsoever we are to judge charitably of all outwardly called, 1 Cor. 1:2, because who among them is also inwardly called, is only known to God, 2 Tim. 2:19, yet does this outward calling differ from the inward.

1. In that it is wrought only by outward means, and common illumination, Heb. 4:2, without the spirit of regeneration, Jude verse 19, or any portion of saving faith, Lk. 8:13.

2. In that they are admitted only to an outward and temporary league of formal profession, Acts 8:13; Rom. 9:4-5, not to that entire fellowship with Christ required unto salvation, 1 Jn. 2:19; 1 Cor. 1:8-9. What are the means which God has appointed to call us by? They are partly inward, and partly outward, 1 Thess. 5:19-20; Acts 10:44. What are the inward? The Spirit of God, which is given by the outward things, Gal. 3:2-3; 1 Tim. 1:14. What mean you by the Spirit of God in this place? That power of God which works in the hearts of men things which the natural discourse of reason is not able to attain unto. Being incomprehensible, how may we come to some understanding and sense of it? By the things whereunto it is compared:

1. To wind, Acts 2, to show the marvelous power of it in operation.

2. To oil, Heb. 1:9, that is of a hot nature that pierces and supplies.

3. To water, Jn. 4, that cools, scours and cleanses.

4. To fire, Mt. 3; Acts 2, that severs dross and good metal. How is the operation of it? Diverse; as softening and hardening, enlightening and darkening, which it works after a diverse manner, by the Word in the hearts of the elect and reprobate, according to the good pleasure of God’s secret will only, and after that, according to the good pleasure of his revealed will; so that the lawful use thereof is rewarded with a gracious increase of blessing, and the abuse punished with further hardness to condemnation. What then does the Spirit work in the wicked? Finding them hard, it hardens them more to their further condemnation. What does the same Spirit work in the godly? Faith, whereby they take hold on Christ with all his benefits, Eph. 2:8. What are the outward things which God has given to call us by? They are either common to the whole world, or proper to the Church. What are the things common to the whole world? God’s works not unprofitably given, although not sufficient to salvation. Is not the knowledge of the wisdom, power and goodness of God in the creation and government of the heaven and earth, with the things that are in them, sufficient to make us wise to salvation? No: First, it serves rather for further condemnation without the Word, Rom. 1:19-21. Secondly, as by and with the Word, the due meditation and consideration of God’s works is a good help to further us in religion and in the graces of God’s Spirit, 1 Cor. 1:21-22.</p></blockquote>

<blockquote><p>[19] Q. What is the outward theological calling? An. It is medium ad salitem [a means to salt], as the word and sacraments and the members of the visible church belong unto it. [20] Q. What is that inward theological calling? An. It is when God’s word brings [God’s word’s ring?] does not rest in our outward ears but comes into the heart and works somewhat there. [21] Q. How many ways [is] this taken? An. It is either effectual or ineffectual. [22] Q. What is the inward ineffectual calling? An. When it comes into the heart and falls as on stony ground. [23] Q. How far may this inward ineffectual calling bring us? An. To these four degrees of grace principally. 1. It may bring a man to see his own sin &amp; misery. 2ly. It may so work upon him, as it may bring him to have a desire after the thing persuaded [for?] 3ly It may bring him to some kind of degree of possession of the thing called for. 4ly It may bring him to some outward correspondence, as to reform many sins. [24] Q. Why then is it called an ineffectual calling? An. Because it does not fully persuade [the] heart to come in. … [30] Q. By what wording in scripture is our vocation expressed? An. By many expressions: as first by alluring and persuading. Hos. 2:14. 2ly by inviting and compelling. Math 22:4. 3ly by stretching out of the hand. Rom. 10:21. 4ly by beseeching, 2 Cor. 5:20. 5ly by drawing us. John 6.44. Lastly by apprehending. [31] Q. Do all these properly belong to effectual calling? An. No, the four first may be applied to ineffectual calling. … [38] Q. Whither do effectual and ineffectual calling differ in this respect or no, do not both come from God? An. They agree in this that both proceed from God, yet they differ in regard of the manner of work, for God does the work not secundum propositum [according to the purpose], but secundum obviam [according to the thing encountered]. … [55] Q. What and how many are the instrumental causes of our vocation? An. They are of two sorts either primary or secondary? [56] Q. What were the primary? An. The word. [57] Q. In what propositions was that expressed? An. James 5:11 [1:21?] suggests the word is the ordinary means whereby He calls and so by consequence the ministry of it. 2d. That it was but an instrumental cause under God and so it’s called the [sassed?] of God, the arm of god and sometime the power of God. 3ly. That as it’s but an instrumental cause so it did only belong to those which are adults, for infants may be said to be sanctified but not called. 4. That it was but a separable instrument. [58] Q. How can we say if the converting word is a separable means? An. For two reasons: Because the word may be without the Spirit. 2. Because the Spirit may be and may call some without the word. … [86] Q. Now you have spoken of the primary instruments of salvation as the word and sacraments. What are the secondary instruments? An. They are many as: 1. The mercies and favors of God common to all. Rom. 10:21 [“But to Israel he saith, All day long I have stretched forth my hands unto a disobedient and gainsaying people.”]. Bounty is one thing that may cause love so that one main instrument or means God uses to call us home which is to draw us with the thick cords of love [Hos. 11:4]. … [95] Q. Whether do effectual and ineffectual calling differ in this [Q: 94: ‘who are they whom God is thus pleased to call’]? An. Yes, for the ineffectual calling, many are called but few are chosen.</p></blockquote>

— Anthony Tuckney, A Brief &amp; Pithy Catechism (1628)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5B19%5D+Q.+What+is+the+outward+theological+calling%3F+An.+It+is+medium+ad+salitem+%5Ba+means+to+salt%5D%2C+as+the+word+and+sacraments+and+the+members+of+the+visible+church+belong+unto+it.+%5B20%5D+Q.+What+is+that+inward+theological+calling%3F+An.+It+is+when+God%E2%80%99s+word+brings+%5BGod%E2%80%99s+word%E2%80%99s+ring%3F%5D+does+not+rest+in+our+outward+ears+but+comes+into+the+heart+and+works+somewhat+there.+%5B21%5D+Q.+How+many+ways+%5Bis%5D+this+taken%3F+An.+It+is+either+effectual+or+ineffectual.+%5B22%5D+Q.+What+is+the+inward+ineffectual+calling%3F+An.+When+it+comes+into+the+heart+and+falls+as+on+stony+ground.+%5B23%5D+Q.+How+far+may+this+inward+ineffectual+calling+bring+us%3F+An.+To+these+four+degrees+of+grace+principally.+1.+It+may+bring+a+man+to+see+his+own+sin+%26+misery.+2ly.+It+may+so+work+upon+him%2C+as+it+may+bring+him+to+have+a+desire+after+the+thing+persuaded+%5Bfor%3F%5D+3ly+It+may+bring+him+to+some+kind+of+degree+of+possession+of+the+thing+called+for.+4ly+It+may+bring+him+to+some+outward+correspondence%2C+as+to+reform+many+sins.+%5B24%5D+Q.+Why+then+is+it+called+an+ineffectual+calling%3F+An.+Because+it+does+not+fully+persuade+%5Bthe%5D+heart+to+come+in.+%E2%80%A6+%5B30%5D+Q.+By+what+wording+in+scripture+is+our+vocation+expressed%3F+An.+By+many+expressions%3A+as+first+by+alluring+and+persuading.+Hos.+2%3A14.+2ly+by+inviting+and+compelling.+Math+22%3A4.+3ly+by+stretching+out+of+the+hand.+Rom.+10%3A21.+4ly+by+beseeching%2C+2+Cor.+5%3A20.+5ly+by+drawing+us.+John+6.44.+Lastly+by+apprehending.+%5B31%5D+Q.+Do+all+these+properly+belong+to+effectual+calling%3F+An.+No%2C+the+four+first+may+be+applied+to+ineffectual+calling.+%E2%80%A6+%5B38%5D+Q.+Whither+do+effectual+and+ineffectual+calling+differ+in+this+respect+or+no%2C+do+not+both+come+from+God%3F+An.+They+agree+in+this+that+both+proceed+from+God%2C+yet+they+differ+in+regard+of+the+manner+of+work%2C+for+God+does+the+work+not+secundum+propositum+%5Baccording+to+the+purpose%5D%2C+but+secundum+obviam+%5Baccording+to+the+thing+encountered%5D.+%E2%80%A6+%5B55%5D+Q.+What+and+how+many+are+the+instrumental+causes+of+our+vocation%3F+An.+They+are+of+two+sorts+either+primary+or+secondary%3F+%5B56%5D+Q.+What+were+the+primary%3F+An.+The+word.+%5B57%5D+Q.+In+what+propositions+was+that+expressed%3F+An.+James+5%3A11+%5B1%3A21%3F%5D+suggests+the+word+is+the+ordinary+means+whereby+He+calls+and+so+by+consequence+the+ministry+of+it.+2d.+That+it+was+but+an+instrumental+cause+under+God+and+so+it%E2%80%99s+called+the+%5Bsassed%3F%5D+of+God%2C+the+arm+of+god+and+sometime+the+power+of+God.+3ly.+That+as+it%E2%80%99s+but+an+instrumental+cause+so+it+did+only+belong+to+those+which+are+adults%2C+for+infants+may+be+said+to+be+sanctified+but+not+called.+4.+That+it+was+but+a+separable+instrument.+%5B58%5D+Q.+How+can+we+say+if+the+converting+word+is+a+separable+means%3F+An.+For+two+reasons%3A+Because+the+word+may+be+without+the+Spirit.+2.+Because+the+Spirit+may+be+and+may+call+some+without+the+word.+%E2%80%A6+%5B86%5D+Q.+Now+you+have+spoken+of+the+primary+instruments+of+salvation+as+the+word+and+sacraments.+What+are+the+secondary+instruments%3F+An.+They+are+many+as%3A+1.+The+mercies+and+favors+of+God+common+to+all.+Rom.+10%3A21+%5B%E2%80%9CBut+to+Israel+he+saith%2C+All+day+long+I+have+stretched+forth+my+hands+unto+a+disobedient+and+gainsaying+people.%E2%80%9D%5D.+Bounty+is+one+thing+that+may+cause+love+so+that+one+main+instrument+or+means+God+uses+to+call+us+home+which+is+to+draw+us+with+the+thick+cords+of+love+%5BHos.+11%3A4%5D.+%E2%80%A6+%5B95%5D+Q.+Whether+do+effectual+and+ineffectual+calling+differ+in+this+%5BQ%3A+94%3A+%E2%80%98who+are+they+whom+God+is+thus+pleased+to+call%E2%80%99%5D%3F+An.+Yes%2C+for+the+ineffectual+calling%2C+many+are+called+but+few+are+chosen.%E2%80%9D%0A%0A%E2%80%94+Anthony+Tuckney%2C+A+Brief+%26+Pithy+Catechism+%281628%29&amp;url=https%3A%2F%2F <blockquote><p>Fifthly, if thou art a holy person, if thou art one that hast that real holiness without which there is no happiness, then know for thy comfort, that thy holiness is a glorious witness and evidence of thy effectual vocation, 1 Pet. 1:15, ‘As He who hath called you is holy, so be ye holy in all manner of conversation.’ Many are externally called that are not internally called, and many are ineffectually called that are not effectually called. But now real holiness that speaks out an internal call, an effectual call, a call out of darkness into marvelous light… The Author of this call is a holy God; our holy calling depends upon the purpose of God, the power of God, and the grace and good pleasure of God; the means of our holy calling are the Spirit of God and the Word of God; and the ends of our calling are holiness and the glory of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crown and Glory of Christianity</cite>, ... (London: Crips, 1662), The Necessity, Excellency, Rarity &amp; Beauty of Holiness, Use 3, pp. 623-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/external-and-internal-call.html">External and Internal Call</a></span></div>

 it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b114ded39c" data-kw="">
<blockquote><p>Oh! it is a grievous thing for Christ to call and we to refuse his gracious calling… And thus we see how all under the gospel are called by the Word: Secondly, all under the gospel are called by the Spirit working within as well as by the Word preached without… Question 3. Whether the call of the Spirit be ineffectual or not?… Answer. All this [unquoted here, including Bible verses] is true of the effectual operation of the Holy Spirit, because that is certain and eternal; but there is a general work of the Spirit, which ends in perdition; that is, many may and do fall finally and totally into sin, and consequently into eternal destruction, in whom sometimes there has been some good motions, and general operations of the blessed Spirit; this is clear from these places, to wit, Mt. 7:22; 13:20; Heb. 6:4; 10:26; 2 Pet. 2:20. Now this general call and operation of the Holy Spirit has these degrees following: viz. First, an understanding of the Word, for the mere natural man cannot understand it, Mt. 16:23 &amp; 1 Cor. 2:14. Here observe two things, to wit, First, there are many in the places of the Gospel who hear the Word preached all the days of their lives and yet understand nothing, but remain children in understanding; now these never were made partakers so much as of common or general grace: Secondly, there are some who live under the Word, and do dogmatically understand the Word; now these must remember that knowledge is not enough, God having given them knowledge for practice’s sake, yea to know and not to obey will aggravate their punishment. Secondly, a taste of spiritual things and the heavenly gift, Heb. 6:4: this is to receive the Word with joy. Mt. 13:20, and there are few ordinary hearers, but at some time or other have these affecting motions, although for the most part the reprobate rather rejoices in the newness than in the trueness of that which he hears. Thirdly, obedience in part, forsaking some sins and doing God some service, Mk. 6:20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canterbury’s Doom</cite>, 73. ‘Passages razed out concerning our effectual vocation’ in Canterbury’s Doom, or the first part of a complete history of the commitment, charge, trial, condemnation, execution of William Laud... (London: Macock, 1646), pp. 344-45</span></figcaption>

</figure><figure class="quote" id="q-0f42ee50a7" data-kw="">
<blockquote><p>Doctrine 3. All those, and those alone, make their election sure that make their calling sure. These two God has joined together, as the apostle does in this place, so that no man ought or may disjoin them. Hence election and calling are taken sometimes in the Scriptures for one and the same, as 1 Cor. 1:26-27, that which is called ‘calling,’ verse 26, is called ‘election,’ verse 27. There is indeed an outward and ineffectual calling, which is many times separated from election, as when it is said, ‘Many are called, but few are chosen.’ But effectual and saving calling has always a sure connection with election, Rom. 8:3•[30?] and 11:28-29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Analytical Exposition of both the Epistles of the Apostle Peter</cite>, ... (London: E.G., 1641), on 2 Pet. 1:10-11, p. 164</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Doctrine 3. All those, and those alone, make their election sure that make their calling sure. These two God has joined together, as the apostle does in this place, so that no man ought or may disjoin them. Hence election and calling are taken sometimes in the Scriptures for one and the same, as 1 Cor. 1:26-27, that which is called ‘calling,’ verse 26, is called ‘election,’ verse 27. There is indeed an outward and ineffectual calling, which is many times separated from election, as when it is said, ‘Many are called, but few are chosen.’ But effectual and saving calling has always a sure connection with election, Rom. 8:3•[30?] and 11:28-29.”

<main class="wrap"><figure class="quote" id="q-59dd07b4c9" data-kw="">
<blockquote><p>A difference exists between a furnished and destitute state. The one is of the law considered in itself and its own nature; the other, in relation to us. The law was given to man in the beginning (before the fall) for life and by itself also led to life according to the sanction “do this and thou shalt live” (cf. Rom. 2:13). But after the fall, being destitute of strength through the flesh, it is not given for life, but for a mirror of sin and misery to render the sinner inexcusable (Rom. 3:19, 20). [1.4.15] …So God seriously wills (i.e., commands man to obey the law that he may live, according to the brief clause of the covenant of works: “Do this and thou shalt live”). [4.17.45] IV. (2) If Adam was righteous, he ought to have been immortal because there is a necessary connection between righteousness and life. (a) From the order of God who has joined righteousness and life in the law by an indissoluble bond (as he joined closely together sin and death: “Do this and thou shalt live; the soul that sinneth it shall die”). [5.12.4] XVII. There is not the same relation of justification and of the covenant through all things. To the former, faith alone concurs, but to the observance of the latter other virtues also are required besides faith. These conduce not only to the acceptance of the covenant, but also to its observance. For these two things ought always to be connected—the acceptance of the covenant and the keeping of it when accepted. Faith accepts by a reception of the promises; obedience keeps by a fulfillment of the commands. “Be ye holy, for I am holy.” And yet in this way legal and evangelical obedience are not confounded because the legal is prescribed for the meriting of life, the evangelical, however, only for the possession of it. The former precedes as the cause of life (“Do this and thou shalt live”); the latter follows as its fruit, not that you may live but because you live. The former is not admitted unless it is perfect and absolute; the latter is admitted even if imperfect, provided it be sincere. That is only commanded as man’s duty; this is also promised and given as the gift of God. [12.3.17]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George Musgrave Giger, ed. James T. Dennison Jr. (Phillipsburg, NJ: P&amp;R Publishing, 1992–97).</span></figcaption>

<blockquote><p>However, the received opinion among the orthodox is that the promise given to Adam was not only of a happy life to be continued in paradise, but of a heavenly and eternal life (to which he was to be carried after the course of perfect obedience and perseverance had been run). The law of works had the promise of heavenly and eternal life; therefore also the law prescribed to Adam. In each instance, it is the same law as to substance.</p></blockquote>

<blockquote><p>7. Lastly, In his person. Being a sinful man under the covenant of works, he is a cursed man; For it is written, “Cursed is every one that continueth not in all things which are written in the book of the law to do them.” The curse fixeth not only on what is his, but on himself; and it is for his sake that it is laid on other things. The curse, as you have heard, is on his soul, and on his body; for wherever sin is found under this covenant, there the curse also is And, (1.) The man is under the power of Satan, Acts 26:18. Into the hand of this enemy man fell, when he broke the covenant of works. Satan having waged war against heaven, set on man, heaven’s confederate, and gained the unhappy victory, gained him by temptation to renounce his allegiance to his rightful Lord by breaking the covenant, and so he fell under his power, as his captive taken in war, Isa. 49:24, was brought under bondage to this worst of masters, 2 Pet. 2:19, and is ruled by him at his pleasure, 2 Tim. 2 ult. The curse of the covenant falling on the covenant-breaker, he is thereby laid under condemnation, and adjudged to death according to the threatening; and so he falls under the power of him that has the power of death, that is the devil, Heb. 2:14. Every natural man is shut up as in a prison, in his natural state; and there he lies in bonds, Isa. 61:1. There are God’s bands on him, the bands of the curse binding him over to death; and the devil’s bands are on him, viz, the bands of strong lusts and corruptions, with which they are laden, as a malefactor in prison is laden with irons. And Satan has the power of gaoler over them. He keeps the keys of the prison, and narrowly watches the prisoners that none of them escape. They are not all kept alike close; but none of them can move beyond the bounds of his jurisdiction, more than the prisoner can get out of the dungeon. Even when the king’s word comes to deliver the elect, he will not yield them up; but the prison doors must be broke open, and they forcibly taken out of his hand by a stronger than he. (3.) The natural man being under the curse is continually in hazard of utter destruction, of having the copestone put on his misery, and being set beyond all possibility of help. If his eyes were opened he would see himself every moment in danger of dropping down into the pit of hell; Psalm 7:12, “If he turn not, he will whet his sword; he hath bent his bow, and made it ready.” The man is constantly standing before God’s bent bow, and has nothing to secure him one moment from the drawing of it. The sentence of death is passed against him, John 3:18, but there is no day intimated for the execution, but every day the dead warrant may be signed against him, and he led forth to death. His name may be “Magor-missabib,” a terror round about, Jer. 20:3. Whither can he look where he will not see his enemies ready to ruin him, on a word of command from that God under whose curse he lies? And what can he do for himself amidst his armed enemies? He is quite naked, Rev. 3:17, and cannot fight them; he is without strength, Rom. 5:6, and cannot wield armour, though he had it; he is bound hand and foot, Isa. 61:1, and cannot flee; and if he could, whither could he flee for safety? Heaven’s gates are shut upon him; in the utmost parts of the earth, or the most remote rock in the sea, God’s hand would find him out. Justice is pursuing the criminals under the curse, crying for vengeance on the traitors, and their foot shall certainly slide in due time; the law is continually throwing the fire-balls of its curses on them, and will at length set them on fire round about; death is on the pursuit after them, and has gained much ground of them already, and the cloud of wrath hangs over their heads continually in the curse, and the small rain of God’s wrath is still falling on them; how soon death may overtake them, they know not; and then the cloud breaks, and the great rain of his strength falls down upon them, and sweeps them away without hope for ever and ever.</p></blockquote>

ld them up; but the prison doors must be broke open, and they forcibly taken out of his hand by a stronger than he. (3.) The natural man being under the curse is continually in hazard of utter destruction, of having the copestone put on his misery, and being set beyond all possibility of help. If his eyes were opened he would see himself every moment in danger of dropping down into the pit of hell; Psalm 7:12, “If he turn not, he will whet his sword; he hath bent his bow, and made it ready.” The man is constantly standing before God’s bent bow, and has nothing to secure him one moment from the drawing of it. The sentence of death is passed against him, John 3:18, but there is no day intimated for the execution, but every day the dead warrant may be signed against him, and he led forth to death. His name may be “Magor-missabib,” a terror round about, Jer. 20:3. Whither can he look where he will not see his enemies ready to ruin him, on a word of command from that God under whose curse he lies? And what can he do for himself amidst his armed enemies? He is quite naked, Rev. 3:17, and cannot fight them; he is without strength, Rom. 5:6, and cannot wield armour, though he had it; he is bound hand and foot, Isa. 61:1, and cannot flee; and if he could, whither could he flee for safety? Heaven’s gates are shut upon him; in the utmost parts of the earth, or the most remote rock in the sea, God’s hand would find him out. Justice is pursuing the criminals under the curse, crying for vengeance on the traitors, and their foot shall certainly slide in due time; the law is continually throwing the fire-balls of its curses on them, and will at length set them on fire round about; death is on the pursuit after them, and has gained much ground of them already, and the cloud of wrath hangs over their heads continually in the curse, and the small rain of God’s wrath is still falling on them; how soon death may overtake them, they know not; and then the cloud breaks, and the great rain of his strength falls down upon them, and sweeps them away without hope for ever and ever.”

— Thomas Boston, The Whole Works of Thomas Boston: Discourses on Prayer, ed. Samuel M‘Millan, vol. 11 (Aberdeen: George and Robert King, 1852), 303–04.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C7.+Lastly%2C+In+his+person.+Being+a+sinful+man+under+the+covenant+of+works%2C+he+is+a+cursed+man%3B+For+it+is+written%2C+%E2%80%9CCursed+is+every+one+that+continueth+not+in+all+things+which+are+written+in+the+book+of+the+law+to+do+them.%E2%80%9D+The+curse+fixeth+not+only+on+what+is+his%2C+but+on+himself%3B+and+it+is+for+his+sake+that+it+is+laid+on+other+things.+The+curse%2C+as+you+have+heard%2C+is+on+his+soul%2C+and+on+his+body%3B+for+wherever+sin+is+found+under+this+covenant%2C+there+the+curse+also+is+And%2C+%281.%29+The+man+is+under+the+power+of+Satan%2C+Acts+26%3A18.+Into+the+hand+of+this+enemy+man+fell%2C+when+he+broke+the+covenant+of+works.+Satan+having+waged+war+against+heaven%2C+set+on+man%2C+heaven%E2%80%99s+confederate%2C+and+gained+the+unhappy+victory%2C+gained+him+by+temptation+to+renounce+his+allegiance+to+his+rightful+Lord+by+breaking+the+covenant%2C+and+so+he+fell+under+his+power%2C+as+his+captive+taken+in+war%2C+Isa.+49%3A24%2C+was+brought+under+bondage+to+this+worst+of+masters%2C+2+Pet.+2%3A19%2C+and+is+ruled+by+him+at+his+pleasure%2C+2+Tim.+2+ult.+The+curse+of+the+covenant+falling+on+the+covenant-breaker%2C+he+is+thereby+laid+under+condemnation%2C+and+adjudged+to+death+according+to+the+threatening%3B+and+so+he+falls+under+the+power+of+him+that+has+the+power+of+death%2C+that+is+the+devil%2C+Heb.+2%3A14.+Every+natural+man+is+shut+up+as+in+a+prison%2C+in+his+natural+state%3B+and+there+he+lies+in+bonds%2C+Isa.+61%3A1.+There+are+God%E2%80%99s+bands+on+him%2C+the+bands+of+the+curse+binding+him+over+to+death%3B+and+the+devil%E2%80%99s+bands+are+on+him%2C+viz%2C+the+bands+of+strong+lusts+and+corruptions%2C+with+which+they+are+laden%2C+as+a+malefactor+in+prison+is+laden+with+irons.+And+Satan+has+the+power+of+gaoler+over+them.+He+keeps+the+keys+of+the+prison%2C+and+narrowly+watches+the+prisoners+that+none+of+them+escape.+They+are+not+all+kept+alike+close%3B+but+none+of+them+can+move+beyond+the+bounds+of+his+jurisdiction%2C+more+than+the+prisoner+can+get+out+of+the+dungeon.+Even+when+the+king%E2%80%99s+word+comes+to+deliver+the+elect%2C+he+will+not+yield+them+up%3B+but+the+prison+doors+must+be+broke+open%2C+and+they+forcibly+taken+out+of+his+hand+by+a+stronger+than+he.+%283.%29+The+natural+man+being+under+the+curse+is+continually+in+hazard+of+utter+destruction%2C+of+having+the+copestone+put+on+his+misery%2C+and+being+set+beyond+all+possibility+of+help.+If+his+eyes+were+opened+he+would+see+himself+every+moment+in+danger+of+dropping+down+into+the+pit+of+hell%3B+Psalm+7%3A12%2C+%E2%80%9CIf+he+turn+not%2C+he+will+whet+his+sword%3B+he+hath+bent+his+bow%2C+and+made+it+ready.%E2%80%9D+The+man+is+constantly+standing+before+God%E2%80%99s+bent+bow%2C+and+has+nothing+to+secure+him+one+moment+from+the+drawing+of+it.+The+sentence+of+death+is+passed+against+him%2C+John+3%3A18%2C+but+there+is+no+day+intimated+for+the+execution%2C+but+every+day+the+dead+warrant+may+be+signed+against+him%2C+and+he+led+forth+to+death.+His+name+may+be+%E2%80%9CMagor-missabib%2C%E2%80%9D+a+terror+round+about%2C+Jer.+20%3A3.+Whither+can+he+look+where+he+will+not+see+his+enemies+ready+to+ruin+him%2C+on+a+word+of+command+from+that+God+under+whose+curse+he+lies%3F+And+what+can+he+do+for+himself+amidst+his+armed+enemies%3F+He+is+quite+naked%2C+Rev.+3%3A17%2C+and+cannot+fight+them%3B+he+is+without+strength%2C+Rom.+5%3A6%2C+and+cannot+wield+armour%2C+though+he+had+it%3B+he+is+bound+hand+and+foot%2C+Isa.+61%3A1%2C+and+cannot+flee%3B+and+if+he+could%2C+whither+could+he+flee+for+safety%3F+Heaven%E2%80%99s+gates+are+shut+upon+him%3B+in+the+utmost+parts+of+the+earth%2C+or+the+most+remote+rock+in+the+sea%2C+God%E2%80%99s+hand+would+find+him+out.+Justice+is+pursuing+the+criminals+under+the+curse%2C+crying+for+vengeance+on+the+traitors%2C+and+their+foot+shall+certainly+slide+in+due+time%3B+the+law+is+continually+throwing+the+fire-balls+of+its+curses+on+them%2C+and+will+at+length+set+them+on+fire+round+about%3B+death+is+on+the+pursuit+after+them%2C+and+has+gained+much+ground+of+them+already%2C+and+the+cloud+of+wrath+hangs+over+their+heads+continually+in+the+curse%2C+and+the+small+rain+of+God%E2%80%99s+wrath+is+still+falling+on+them%3B+how+soon+death+may+overtake+them%2C+they+know+not%3B+and+then+the+cloud+breaks%2C+and+the+great+rain+of+his+strength+falls+down+upon+them%2C+and+sweeps+them+away+without+hope+for+ever+and+ever.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+The+Whole+Works+of+Thomas+Boston%3A+Discourses+on+Prayer%2C+ed.+Samuel+M%E2%80%98Millan%2C+vol.+11+%28Aberdeen%3A+George+and+Robert+King%2C+1852%29%2C+303%E2%80%9304.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa93b5fd0b1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a93b5fd0b1.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/07/boston-man-under-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

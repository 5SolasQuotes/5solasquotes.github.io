<main class="wrap"><figure class="quote" id="q-4722776abd" data-kw="">
<blockquote><p>This law, as unto the substance of it, was the only law of creation, the rule of the first covenant of works; for it contained the sum and substance of that obedience which is due unto God from all rational creatures made in his image, and nothing else. It was the whole of what God designed in our creation unto his own glory and our everlasting blessedness. What was in the tables of stone was nothing but a transcript of what was written in the heart of man originally; and which is returned thither again by the grace of the new covenant, Jer. xxxi. 33; 2 Cor. iii. 3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations</cite>, ed. W. H. Goold (1680; 7 vols, Edinburgh: Johnston and Hunter, 1854), 6: 215.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6c6c4f289d" data-kw="">
<blockquote><p>It is asked, eighth, whether the covenant of grace was promulgated in the Decalogue. The famous Cameron, because he did not distinguish carefully enough between the use of the Decalogue and its nature, stated that the Decalogue was neither the covenant of works nor the covenant of grace, but a certain subservient covenant, insofar as like a pedagogue, it drove the elect to seek Christ (Gal. 3:24; Rom. 10:4–5). The celebrated Cocceius with his followers, since he stated that by its violation the covenant of works was plainly abolished, nor did anything remain except the eternal and universal testament of grace until the Israelites’ making of the calf, after which the Decalogue, with the adding of the twofold formula, “Do this and you will live,” and “Cursed be the one who will not remain in all things which are written in the book of the law,” accepted not indeed the essence of the covenant of works, but yet the appearance of it, stated that the Decalogue is the pure, unadulterated covenant of grace. On the contrary, the rest of the Reformed state that in the Decalogue there is no promulgation of the covenant of grace, but only the renewal of the covenant of works, although that renewal, at least in relation to the elect, had an evangelical use, that it would drive them to embrace Christ. This is so because: (1) the Decalogue has nothing of Christ, nothing of faith in Christ. (2) Even if it did set forth Christ and faith in Christ, which yet we do not grant, yet it still has in addition all moral good works; accordingly we would not be justified by faith alone, because without any doubt we are justified by the observance of the covenant of grace. (3) The Decalogue has all those things (with only the positive commandment excepted, concerning not eating the forbidden fruit) which God stipulated from our first parents in the covenant of works. (4) It is also sanctioned with threats and promises, in the same way as the covenant of works. Therefore nothing prohibits saying that it properly presents the covenant of works again, although in relation to the elect, for an evangelical end and use. Nor is it any hindrance that in it mention is made of that formula which pertains to the covenant of grace, “I am your God,” because entirely nothing is repugnant to urging obedience to the covenant of works by arguments and motives taken from the benefits of the covenant of grace. But we will set aside this argument for its proper place, concerning the dispensation of the covenant of grace under Moses (bk. 8, ch. 2).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, vol. 4, trans. Todd Rester (Reformation Heritage Books, 2023), 45–46.</span></figcaption>

</figure><figure class="quote" id="q-0c0ab4d26c" data-kw="priesthood changed Melchizedek">
<blockquote><p>Hence the apostle infers, “The priesthood being changed, there is made of necessity a change also of the law” (Heb. 7:12, 13). “For if,” says he, “perfection were by the Levitical priesthood, what further need was there that another priest should rise after the order of Melchizedek, and not be called after the order of Aaron?” (Heb. 7:11).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.25.5</span></figcaption>

</figure><figure class="quote" id="q-db215012fe" data-kw="Lord&#x27;s day apostolic institution">
<blockquote><p>Others ascend to a divine ordination, so that either Christ himself may be said to have immediately and expressly instituted that day, which Junius holds and some others with him; or mediately only inasmuch as the apostles inspired of God sanctioned it in the Christian church by precept, example and their own practice. This is the more common opinion of the orthodox and to this we adhere.</p></blockquote>

</figure><figure class="quote" id="q-d06d978e9d" data-kw="">
<blockquote><p>It revived the promise of that covenant, —that of eternal life upon perfect obedience. So the apostle tells us that Moses thus describeth the righteousness of the law, “That the man which doeth those things shall live by them,” Romans 10:5; as he doth, Leviticus 18:5. Now this is no other but the covenant of works revived. Nor had this covenant of Sinai any promise of eternal life annexed unto it, as such, but only the promise inseparable from the covenant of works which it revived, saying, “Do this, and live.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 94</span></figcaption>

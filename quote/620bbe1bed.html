<main class="wrap"><figure class="quote" id="q-620bbe1bed" data-kw="">
<blockquote><p>(2) Of the seed and blood of the V. Mary was formed Christ’s flesh, the H. Spirit adding quickening force to this material. Of course the seed and blood of the virgin Mary also possessed their own vital and animal spirits, as other men’s seed usually has. But these were by no means sufficient for the plastic or formative force of the foetus in question. And so the H. Spirit’s extraordinary shadowing and quickening were addded: whence also it is said to have been conceived of the H. Spirit, a phrase and manner of speaking which is human and metaphorical, not strictly appropriate. (3) Thus Christ’s incarnation was at once ordinary and extraordinary: ordinary as regards the material supplied by the V. Mary, extraordinary as regards the formative force added to this material.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bartholomaus-keckermann.html">Bartholomaus Keckermann</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in Heinrich Heppe, Reformed Dogmatics, Person of Christ</cite>, section 12, p. 425</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9bef223640" data-kw="">
<blockquote><p>A person so great, so high, so glorious, as this Jesus Christ was, should have love for us, that passes knowledge. It is common for equals to love, and for superiors to be beloved; but for the King of princes, for the Son of God, for Jesus Christ to love man thus: this is amazing, and that so much the more, for that man the object of this love, is so low, so mean, so vile, so undeserving, and so inconsiderable, as by the scriptures, everywhere he is described to be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints’ Knowledge of Christ’s Love</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-states-of-christ/state-of-humiliation.html">State of Humiliation</a></span></div>

</figure><figure class="quote" id="q-c28bff1c27" data-kw="">
<blockquote><p>Consider therefore, his infinite condescension, grace, and love herein. Why all this towards you? Does he stand in need of you? Have you deserved it at his hands? Did you love him first? Cannot he be happy and blessed without you? Has he any design upon you, that he is so earnest in calling you unto him? Alas! it is nothing but the overflowing of mercy, compassion, and grace, that moves and acts him herein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations &amp; Discourses on the Glory of Christ</cite>, pt. 2, ch. 1, “Application … an Exhortation unto Such as Are Not Yet Partakers of Him”</span></figcaption>

</figure><figure class="quote" id="q-b75b7256b9" data-kw="virgin birth Holy Spirit">
<blockquote><p>The conception is that by which Christ was invisibly formed in the womb of the blessed virgin, without the concurrence of man, but by the power and overshadowing of the Holy Spirit alone: “That which is conceived in her is of the Holy Ghost” (Mt. 1:20). In this a twofold principle must be remarked: an active—the Holy Spirit; a passive—the blessed virgin. The active principle was not a man (as in ordinary generation) because the conception should be such as to permit the virginity of the blessed virgin to remain pure and inviolate. It was also one by which Christ should be free from all taint of sin, which is usually propagated and contracted by ordinary generation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.11.2–3</span></figcaption>

</figure><figure class="quote" id="q-ffe185d668" data-kw="descent paradise not local hell">
<blockquote><p>Was the soul of Christ, after its separation from the body, translated to paradise immediately? Or did it descend locally to hell? The former we affirm; the latter we deny against the papists and Lutherans. The papists maintain that the soul of Christ really and by presence descended into hell and remained there just as long as his body was in the sepulchre, for the purpose of freeing the souls of the fathers of the Old Testament detained in limbo. We reject a local descent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.15.1–2</span></figcaption>

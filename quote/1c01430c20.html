<main class="wrap"><figure class="quote" id="q-1c01430c20" data-kw="">
<blockquote><p>The covenant of grace, then, was made with Jesus Christ, as the second Adam, party-contractor: Psalm lxxxix. 3, “I have made a covenant with my chosen.” Compared with 1 Cor. xv. 45, “The last Adam was made a quickening spirit.” Gal. iii. 16, “Now to Abraham and his seed were the promises made. He saith not, And to seeds, as of many; but as of one, And to thy seed, which is Christ.” Rom. v. 15, to the end.

And Christ in this covenant represented all the elect, as his spiritual seed, the parties contracted for: Gal. iii. 16, forecited. Isa. liii. 10, 11, “Yet it pleased the Lord to bruise him, he hath put him to grief: when thou shalt make his soul an offering for sin, he shall see his seed, he shall prolong his days, and the pleasure of the Lord shall prosper in his hand. He shall see of the travail of his soul, and shall be satisfied: by his knowledge shall my righteous servant justify many; for he shall bear their iniquities.”

Then the covenant of redemption, and the covenant of grace, are not two distinct covenants, but two names of one covenant, under different considerations. That appears, in that the number of the covenants in Scripture is but two, whereof the covenant of works is one: Gal. iv. 24, “For these are the two covenants; the one from the mount Sinai, which gendereth to bondage, which is Agar.” By a covenant of redemption is meant a bargain of buying and selling; and the second covenant was such a covenant to Christ only: 1 Pet. i. 18, 19, “Forasmuch as ye know that ye were not redeemed with corruptible things, as silver and gold, from your vain conversation received by tradition from your fathers; but with the precious blood of Christ, as of a Lamb without blemish and without spot.”

By a covenant of grace is meant a bargain, whereby all is to be had freely; and it is such a covenant to poor sinners only: Is. lv. 1, “Ho, every one that thirsteth, come ye to the waters, and he that hath no money; come ye, buy and eat, yea, come, buy wine and milk without money, and without price.” The covenant of grace was made from eternity; Tit. i. 2, “In hope of eternal life, which Clod that cannot lie, promised before the world began.” Yet is it the second covenant, in respect of order and manifestation to the world, though it was first in being.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Explication of the First Part of the Assembly’s Shorter Catechism</cite>, (1727) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), 7: 39-40 (emphasis added).</span></figcaption>

<blockquote><p>(1.) The life which he now led was a life of faith with respect unto things spiritual and eternal. For he had for the foundation and object hereof, [1.] The promise of the blessed Seed, and the spiritual blessing of all nations in him, as a confirmation of the first fundamental promise to the church, concerning the Seed of the woman that was to break the serpent’s head. And [2] God entered expressly into covenant with him, confirming it with the seal of circumcision, wherein he obliged himself to be his God, his God almighty, or all-sufficient, for his temporal and eternal good. To suppose that Abraham saw nothing in this promise and covenant but only things confined unto this life, nothing of spiritual grace or mercy, nothing of eternal reward or glory, is so contrary to the analogy of faith, to express testimony of Scripture, so destructive of all the foundations of religion, so unworthy of the nature and properties of God, rendering his title of “the father of the faithful,” and his example in believing, so useless, as that it is a wonder men of any tolerable sobriety should indulge to such an imagination.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, ed. W. H. Goold, Works of John Owen (Edinburgh: Johnstone and Hunter, 1854), 24.67.</span></figcaption>

<blockquote><p>And now, before we close, let us once more entreat you who are unconverted to turn to Jesus. Could ministers but give you some faint idea of Christ’s willingness to save you! If any soul here can declare that it is willing to receive Christ, let it know that Christ is yet more willing to save and to bless. He does not wish you to remain an hour longer a stranger to his love. Why did He suffer? Why did He die? Oh! not merely that He might be glorified in your destruction.</p></blockquote>

<blockquote><p>Q. 30 Where then do you get your hope of eternal life?

A. From the gracious covenant which God newly established with those who believe in Christ.

Q. 31 What is that covenant?

A. It is the reconciliation with God gained by the mediation of Christ in which God, because of Christ, promises those who believe in him that he will always be a gracious father and will give them eternal life.

They in return respond to him by accepting his blessings in true faith and, as is fitting for thankful and obedient children, by glorifying him forever.

And both parties publicly confirm this mutual promise by visible signs which we call sacraments.</p></blockquote>

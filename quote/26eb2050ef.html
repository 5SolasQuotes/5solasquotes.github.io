<main class="wrap"><figure class="quote" id="q-26eb2050ef" data-kw="">
<blockquote><p>Calvin observes… ‘There is in man a twofold government: the one spiritual, whereby the conscience is instructed unto piety and the worship of God: the other political, whereby a man is taught the duties of humanity and civility…’… For whatever is a trespass against the revealed Will of God for duty in moral obedience or instituted worship, is a sin; not but that instituted worship is fundamentally moral obedience, but is therefore in some sense distinguished from it (the serving of God according to his own appointment being the principal part of the Moral Law) because God has, according to the several states of his Church, altered the mode and manner of his worship, as he has thought it best in his wisdom, and as has been most suitable to the several ages and states of his Church; which alterable or altered circumstances, being the product of Christ’s prerogative alone, are called his instituted worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-chauncy.html">Isaac Chauncy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Hierarchy: or the Divine Right of a Sacred Dominion in Church &amp; Conscience… (London: Crouch, 1681), ch. 1</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4184c61452" data-kw="">
<blockquote><p>…that which these and the like [Scripture] testimonies unanimously speak unto us, is this, that the will of God is the sole rule of his worship, and all the concernment of it, and that his authority is the sole principle and cause of the relation of any thing to his worship, in a religious manner; and consequently that He never did, nor ever will allow that the wills of his creatures should be the rule or measure of his honor or worship, nor that their authority should cause any thing to hold a new relation unto Him, or any other but what it has by the law of its creation. As this is the sum and substance of the Second Commandment…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Liturgies &amp; their Imposition (London, 1662), ch. 7</cite>, p. 46</span></figcaption>

</figure><figure class="quote" id="q-6037e57a04" data-kw="">
<blockquote><p>If we compare the two Tables together as to the matter contained in them and the immediate object of each duty commanded, the duties of the First Table are greater and the duties of the Second Table lesser, the one relating more immediately, the other more mediately to religion, in which respect they express peculiarly our love to God, which is called the first and great command; For the first four commands require that which in its own nature is worship, and is in an immediate way to be given to God; but the duites required in the other six, are not properly, formally and immediately called for as parts of worship to God, though, as they are acknowledgments of Him, they may be consequentially thereto referred.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law Unsealed: or a Practical Exposition of the Ten Commandments… (Glasgow: Sanders, 1676), 5th Commandment</cite>, pp. 188-89</span></figcaption>

</figure><figure class="quote" id="q-07e45058e2" data-kw="">
<blockquote><p>…there is also required, that we have Him outwardly in our bodies and external actions; and that is, when as with the outward man we serve and worship Him. The which also we owe unto God, seeing He has created and redeemed both our souls and bodies, that we should in both perform service unto Him…. the Lord require it with the other, and that with the sweet incense of the heart and mind, we offer our bodies also a living sacrifice, holy and acceptable unto Him [Rom. 12:1-2]… Our Sauior also requires, not only that we have in us the heat of spiritual graces, but that also that we cause their light to shine out before men, that they seeing our good works, may glorify our Father which is in heaven… Now this external honour is either in outward signs or actions… Of the other sort is the outward service of God, in calling upon Him, vowing unto Him, swearing by his Name, celebrating feasts to his honor, and all outward obedience to the Law, which, in respect of the person to whom they are to be performed, namely, God alone and no other, are all required in the First Commandment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Godliness, or a Treatise of a Christian Life... (London: Kingstone, 1622), bk. 2, ch. 6, section 7, ‘Of External Worship with our Bodies’</cite>, pp. 122-23</span></figcaption>

hat%20we,all%20required%20in%20the%20First%20Commandment." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-160d84e036" data-kw="">
<blockquote><p>Concerning the Worship of God We call upon God in Spirit and in truth, in true faith, in accordance with the Word of the Lord in Christ Jesus, and worship Him inwardly and outwardly with the deeds commanded by God. For God is not worshipped by human doctrines, mandates, and works, but only by those which He Himself commands and effects by His Holy Spirit through faith and the Word (John 4; Matt. 5; Isa. 29; Rom. 14). We, therefore, confess that the worship of God is the work commanded by God, performed by the Holy Spirit in the elect, with confidence in the Mediator, in Spirit and in truth that we should obey God, celebrate, and acknowledge God (Rom. 12). So the fathers and the councils teach (Ex. 34; Matt. 4; Deut. 6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hungarian-confessio-catholica.html">Hungarian Confessio Catholica</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Confessions of the 16th &amp; 17th Centuries, ed. James Dennison, Jr. (RHB, 2010), vol. 2</cite>, pp. 559-60</span></figcaption>

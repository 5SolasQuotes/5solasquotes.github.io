</figure><figure class="quote" id="q-3de698be83" data-kw="">
<blockquote><p>We who are here providentially convened in our own defence, for preventing and removing the mistakes and misapprehensions of all, especially of those whom we wish to be, and hope are friends, do declare our present purposes and endeavours to be only in vindication and defence of the true reformed religion in its profession and doctrine, as we stand obliged thereunto by our national and solemn league and covenants, and that solemn acknowledgment of sins, and engagement to duties, made and taken in the year 1648, declaring against popery, prelacy, Erastianism, and all things depending thereupon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution</cite>, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3 | At the beginning of the gathering, that week in which the attempt was made upon Glasgow, when they came to deliberate upon a declaration to be emitted, most part by far, in the meeting for consultation, were of Mr. Hamilton and Mr. Douglas’s sentiments, Mr. Welsh and a few others excepted; so that it was carried almost without a struggle that the indulgence should be testified against in the declaration agreed to. All that Mr Welsh and those of his sentiments could do, was to get the passage relative thereunto kept in general terms. The paper at this time before them is but short, and follows., pp. 90-95</span></figcaption>

</figure><figure class="quote" id="q-de3a7d083a" data-kw="">
<blockquote><p>That is, the General Assembly decided that appeals cannot lie except in judicial cases… We have had a superior judicatory in our Church for more than a hundred and twenty years. During about seventy years of this period, our discipline was conducted according to the Westminster Directory. In 1789 our present constitution went into operation; which was submitted to an extensive revision and alteration, as to matters of detail, in 1821. Under these several systems, appeals and complaints were allowed, without hindrance or contradiction, from any kind of decision in an inferior judicatory by a person who felt himself aggrieved, until 1834. Then, for the first time in our history, as far as we know, the idea was started that appeals and complaints could be made only in cases strictly judicial. …That this novel doctrine was not at that time the doctrine of the synod, which the Rev. gentleman defended, is plain… Though the synod was thus free from this new doctrine in May 1834, it grew in such sudden favour, that when that body met the following autumn, they decided not merely that appeals and complaints could not lie except in judicial cases, but even that protests were in the same predicament. This is an instructive illustration of the fact that the wisest and best men sometimes allow themselves to be run away with by a plausible idea, though contrary to all their own previous professions and practice. This, however, was a mere temporary delusion. The members of that synod who had signed or allowed protests in all kinds of cases before, still continued to sign or allow them, with equal freedom, their own decision to the contrary notwithstanding… We found its very authors and advocates disregarding it the very next year; acting as though no such doctrine had ever been broached. If they practically abandoned it as untenable… The Synod of Philadelphia extended the [new] doctrine to appeals, complaints and protests. Thus putting minorities completely under the feet of majorities, not allowing them even the right of recording their dissent with the reasons for it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discussions in Church Polity</cite>, … (NY: Scribner’s Sons, 1878), pt. 2, ch. 16, ‘Discipline’, section 3, ‘Appeals &amp; Complaints’, a. ‘Appeals in Cases Not Judicial’, pp. 470-72</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

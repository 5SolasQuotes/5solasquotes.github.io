<main class="wrap"><figure class="quote" id="q-e135556f38" data-kw="">
<blockquote><p>XLVI. The FOURTH COMMANDMENT. Exod. 20.8, 9, 10, 11. Remember the Sabbath day to keep it holy, &amp;c.

Princ. There is by God’s moral and perpetual Law, a set Time, which is One Day in seven for an holy Rest and holy Worship; which under the Gospel is every first day of the Week.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-steele.html">Richard Steele</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A scheme and abstract of the Christian religion. Comprized in fifty two heads, with the texts of scripture, on which they are grounded. And some short indications, how they were more largely handled. By a lover of truth and peace</cite>, (London: Samuel Sprint, 1684), p. 21.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

<blockquote><p>XII. Fourth [Rule of Obedience], as the precepts do not have an equal degree of importance and necessity, so neither is the obedience to be reckoned of the same order and value… The omission of a command is one thing; opposition to it another; forgetfulness, neglect and contempt are different. Neglect proceeds from the langor of slothfulness…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 11th Topic, ‘The Law of God’, Question 6, ‘The Rules of Explanation and of Observance of the Decalogue’, Sections VII &amp; XII, p. 37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>
<div class="actions"><button class="copy" data-copy="“XII. Fourth [Rule of Obedience], as the precepts do not have an equal degree of importance and necessity, so neither is the obedience to be reckoned of the same order and value… The omission of a command is one thing; opposition to it another; forgetfulness, neglect and contempt are different. Neglect proceeds from the langor of slothfulness…”

</figure><figure class="quote" id="q-443581e996" data-kw="">
<blockquote><p>For honest games and pass-times, howbeit honest, may be [an] impediment to spiritual exercises, and distract the mind as much as the lawful works of our calling. Refreshment by meat and drink was allowed by God Himself, when He provided for the seventh day, and by Christ Himself, who being invited, went to the pharisee’s house upon the sabbath to dinner. A man may recreate himself with the free air of his garden or the fields, if family duties or the like hinder him not, providing he spend the time in holy exercises, or holy conference with some other. But games and pass-times cannot consist with such holy exercises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Re-examination of the Five Articles enacted at Perth, anno 1618</cite>, ... (1636), ‘Of the Sabbath’, pp. 185-86</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

<blockquote><p>Mr. [Henry] Wilkinson, sen[ior]. put this query, how we should regulate iron works and glass works? but this was answered by the next proposition: Second Proposition, ‘To abstain from all unnecessary labors, worldly sports, and recreations.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-29dfe35b27" data-kw="">
<blockquote><p>Question: Is it lawful to drink wine, or other strong drink, or to eat delicates and dainties on the Sabbath or no? Answer: If men have these things provided, and ready at hand of their own, or in the house where they are on the Sabbath, they may use them on the Sabbath; so as they use them moderately, and for the better enabling of them to perform holy duties both in public and private. Eccl. 10:17, Solomon would haue princes to eat in time, and for strength, and not for drunkenness. Much more then other men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-elton.html">Edward Elton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s Holy Mind Touching Matters Moral which Himself Uttered in Ten Words</cite>, … (London: 1625), p. 105</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

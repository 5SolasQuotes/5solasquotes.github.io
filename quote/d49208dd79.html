<blockquote><p>‘Rebuke not an Elder.’ Do not handle him roughly, and as it were strike him, as the Greek word signifies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Tim.</cite>, 5:1</span></figcaption>

— Edward Leigh, Annotations on 1 Tim., 5:1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98Rebuke+not+an+Elder.%E2%80%99+Do+not+handle+him+roughly%2C+and+as+it+were+strike+him%2C+as+the+Greek+word+signifies.%E2%80%9D%0A%0A%E2%80%94+Edward+Leigh%2C+Annotations+on+1+Tim.%2C+5%3A1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd49208dd79.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d49208dd79.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/ruling-elders#:~:text=%E2%80%98Rebuke%20not%20an%20Elder.%E2%80%99%20Do%20not,him%2C%20as%20the%20Greek%20word%20signifies." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-acd0b817f0" data-kw="">
<blockquote><p>Nor are women, sons, servants, debarred from voicing in election because it is a Church-power, for it is no power of jurisdiction. For: 1. Their tacit [understood or implied without being stated] voices and consents are not excluded, because they must try the spirits, and not upon trust and fide implicita [implicit faith] believe every teacher more than men, or believe as the Church believes, more than their husbands, nor must they take doctrines as truth upon their husband’s word; nor are women so excluded from speaking in the Church as [that] they may upon no occasion: confess their faith, 2. profess vocally repentance, 3. depose as witnesses, [or] 4. accuse the guilty before the binding Church. 4. Nor may a [civil] corporation cast out a major [an official] by an authoritative power such as binding and loosing is, Mt. 18 [that is, the power by which they do it is not of the same kind as ecclesiastical power]. 5. We seek a warrant why the votes of women in choosing their pastors must more be included in the votes of the male than their being essential parts of the redeemed Church is included in the males, or their confessing publicly that Jesus is the Christ, as many women martyrs and sons and servants have gloriously done; and yet their confession of Christ to the death must be personal, and not included in the confession of husband or parents, as Mt. 10:32.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church Discipline Penned by Mr. Thomas Hooker… (London, 1658)</cite>, p. 257</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

uote/acd0b817f0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/whether-ladies-have-the-right-to-vote-for-church-officers/#:~:text=Nor%20are%20women%2C%20sons%2C%20servants%2C%20debarred,husband%20or%20parents%2C%20as%20Mt.%2010%3A32." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4ded594794" data-kw="">
<blockquote><p>In giving the name of bishops, presbyters, and pastors, indiscriminately to those who govern churches, I have done it on the authority of Scripture, which uses the words as synonymous. To all who discharge the ministry of the word it gives the name of bishops. Thus Paul, after enjoining Titus to ordain elders in every city, immediately adds, &quot;A bishop must be blameless,&quot; &amp;c., (Tit. 1: 5, 7.) So in another place he salutes several bishops in one church, (Phil. 1: 1.) And in the Acts, the elders of Ephesus, whom he is said to have called together, he, in the course of his address, designates as bishops, (Acts 20: 17.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.3.8</span></figcaption>

</figure><figure class="quote" id="q-1a4b24394f" data-kw="">
<blockquote><p>…though it be ordinarily most convenient that the office of attending the sick be committed to women, yet it is not essentially necessary to the office: And as Aretius notes upon the place (Common Places, class 4, ch. 1, p. 746), we may under [Greek] comprehend not only widows appointed to attend the sick, but old men appointed to receive and entertain strangers: Which is also judiciously observed by [Peter] Martyr. Besides, when the apostle, 1 Tim. 5, teaches what is required in widows, who should be made diaconesses, this he requires among other things, that they be not such as live in pleasures and idleness, and take not care to provide for their own houses, verse 6,8, [Greek], which though Erasmus and Beza turn in the feminine, quod si qua, yet our English translators, and many good interpreters, turn it in the masculine. And surely it shall have more weight if it agree to men as well as women, says Calvin upon that place. Now they who read in the masculine, that which the apostle says there of widows, will not, we suppose, blame us for reading, Rom. 12:8 in the masculine also, ‘He that sheweth mercie’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland… (Edinburgh, 1641), pt. 1</cite>, ch. 5, on Rom. 12:8, pp. 38-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-ab52f3e053" data-kw="">
<blockquote><p>The question that remains to be answered is: are these widows placed on a list in order to receive aid or in order to serve the church? All the evidence indicates that what Paul clearly had in mind was an order of widows set apart in order to serve the church. There are a number of reasons why this interpretation is superior.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brian-schwertley.html">Brian Schwertley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>II. ‘The Biblical Evidence’, pp. 63-70 in A Historical &amp; Biblical Examination of Women Deacons</cite>, p. 63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

<main class="wrap"><figure class="quote" id="q-9c76f5e336" data-kw="">
<blockquote><p>And just.] Hereby is meant, that he shewed and made proof of that simplicity and uprightness of his heart, outwardly by his just and honest dealing, as Job by the importunity of his friends’ accusations is driven afterwards to witness of him self in the 29. &amp; 31. Chapters. For that which James speaketh of faith, that that only is a true and lively faith which sheweth it self by good works, must also be applied to all other virtues. Wherefore Aristotle in his first book of Ethics did herein very well (although otherwise he neither knew the chief virtues nor the true cause and the true effects of the rest) that he imagined the chief good not to consist in bare virtue by it self, but rather in the operation and action of virtue.

But peradventure you will say, if he be an upright man who walketh in the right way, and the right way be the Law of the Lord, which was not yet given when these things happened unto Job, how is it that he is called an upright man? Hereunto the Apostle maketh answer in the second to the Romans and the fourteenth verse, that to the Gentiles their conscience was a Law accusing or excusing the deeds of everyone of them. And surely so it is.

For whereas God in the Mount Sinai delivered to his people the ten Commandments contained in two tables, we are not thereof to gather, that then and not before, God prescribed what duties men were to perform to God and their neighbours, but rather, that he then renewed that immutable law of Nature, which was from the beginning written in the hearts of all men, and from whence all good laws have been derived; partly to the end the Israelites might be shut out from all excuse, as who had been twice taught, that is, first of Nature, as all other nations, and then more specially of God him self; and partly because at the same time the true religion of God, intreated of in the first table, was turned into idolatry and worshipping of many Gods: yea the duties of honest behaviour and justice to be observed, kept, and maintained between man and man, which belong to the second table, began to be forgotten and to be quite perverted; as may appear by the laws and customs of divers countries.

For with the Lacedemonians it was accounted no dishonesty to steal; with the Egyptians it was lawful for the brother to join in marriage with his own sister: that I say nothing of the incestuous pollutions of the Canaanites, whereof the Lord him self witnesseth unto his servant Moses. Hereunto may be added the having of more wives at once, as also divorcements; both which God did bear in the Jews almost (that I may so speak) against his will, for the hardness of their hearts. Job therefore walked not in this sort, but, no doubt, he was in that country a most notable and singular example of all true godliness and virtue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Job Expounded … Partly in Manner of a Commentary, Partly in Manner of a Paraphrase. Faithfully Translated out of Latin into English</cite>, (Cambridge: John Legatt, 1589), unpaginated.</span></figcaption>

<blockquote><p>Q. How is man by sin in the state of death?

A. By the just sentence of God, delivering him for sin, into the power both of corporal and eternal death; signified by expelling our parents out of Paradise, and debarring them of the Sacramental tree of Life.

Q. What are we to understand by corporal death?

A. The separation of the soul, and body, with all evils that attend thereon, or make way thereto, as sorrow sickness, shame, servitude, penury, &amp;c. yea even blessings are cursed, and prosperity causeth ruin.

Q. What is eternal death?

A. It is the final separation of the whole man in hell for ever, from God’s favourable presence and fellowship; together with present bondage under Satan, hellish horrors, and such like fore-runners of damnation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-crooke.html">Samuel Crooke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The guide unto true blessedness. Or, A body of the doctrine of the Scriptures, directing man to the saving knowledge of God</cite>, (London: John Pindley, 1613), pp 29-30.</span></figcaption>

<blockquote><p>It [the plague] appears to have been brought into Leith by a passenger from England, on 14th October, 1574, and several persons died of it there, before its existence was generally known; it entered Edinburgh on the 24th of the same month [A History of Epidemics in Britain, by Charles Creighton, M.D., I., p. 366], and five days later, viz., on 29th October, the town council of Glasgow prohibited all persons from Leith, Kirkcaldy, Dysart, Burntisland, and other places in which its existence was suspected, from coming to the city; inhabitants of Glasgow were also prohibited from going to these places. In Edinburgh the only place suspected is stated to have been Bell’s Wynd, and inhabitants of Glasgow were prohibited from going to that city without a testimonial, or from returning without a certificate from the magistrates that they had not associated with suspected persons there. Residenters in the town were prohibited from receiving strangers in their houses, except such as were licensed by the magistrates or their officers; and even residenters in houses outside of the ports were subjected to a similar restriction. Travellers from places unsuspected were also required, before being received within the city, to produce a testimonial from the magistrates of the burgh or the minister of the parish beyond a burgh. [Council Records, I., pp. 27–8] Two days later the privy council issued an order from Dalkeith to check the spreading of the plague landwards “through the departure of sick folk and foul persons;” it prohibited concealment of the existence of the malady, and commanded infected persons “to cloise thame selffis in.” [Privy Council Register, II., p. 415]</p></blockquote>

<blockquote><p>…first I say that death of its own nature is evil: for God threatens the same and does cast it upon us as a punishment. Moreover, it is put as contrary unto life, which we doubt not but is good… But now I only ask this: If death be evil, why is it sometime wished for: for nothing can be desired but has some consideration of good? But you will say that even this has then some consideration of good, when men are thereby delivered from the grievous evils which they think that either they be not able to bear, or that in abiding of them they shall be grievously troubled: or else, when by the same they obtain some notable good thing. Wherefore, though it sometime appear lawful to wish death for any of these, yet is it a doubt whether one may kill himself for those things… But I speak nothing hear of them which slay themselves through frenzy and madness [insanity]… it may rather seem hear that they should be pitied… And we will use this proposition: It is not lawful for one to kill himself for any of those things which I have showed… And when the Amalechite had said that he stood upon the body of Saul while he was dying and did press him down that he might die the more easily, David answered, ‘Thou art the son of death.’ (2 Sam. 1:16) But if it had been lawful for Saul to have killed himself, how could the young man, which hastened his death, be worthy of death? For it is lawful for one to help another in an honest matter, and especially his prince. And if the law forbid thee to kill another man, it much rather forbids thee to kill thyself, since that which is not lawful for thee to do to another, is unlawful for thee to do to thyself. For the rule of charity must be taken from that charity wherewith we love ourselves.</p></blockquote>

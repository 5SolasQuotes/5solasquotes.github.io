<main class="wrap"><figure class="quote" id="q-8dc4bf9297" data-kw="">
<blockquote><p>But the words of Luke give rise to another question; for Christ does not order us to grant forgiveness, till the offender turn to us and give evidence of repentance. I reply, there are two ways in which offenses are forgiven. If a man shall do me an injury, and I, laying aside the desire of revenge, do not cease to love him, but even repay kindness in place of injury, though I entertain an unfavorable opinion of him, as he deserves, still I am said to forgive him. For when God commands us to wish well to our enemies, He does not therefore demand that we approve in them what He condemns, but only desires that our minds shall be purified from all hatred. In this kind of pardon, so far are we from having any right to wait till he who has offended shall return of his own accord to be reconciled to us, that we ought to love those who deliberately provoke us, who spurn reconciliation, and add to the load of former offenses. A second kind of forgiving is, when we receive a brother into favor, so as to think favorably respecting him, and to be convinced that the remembrance of his offense is blotted out in the sight of God. And this is what I have formerly remarked, that in this passage Christ does not speak only of injuries which have been done to us, but of every kind of offenses; for he desires that, by our compassion, we shall raise up those who have fallen. This doctrine is very necessary, because naturally almost all of us are peevish beyond measure; and Satan, under the pretense of severity, drives us to cruel rigor, so that wretched men, to whom pardon is refused, are swallowed up by grief and despair. But here another question arises. As soon as a man by words makes profession of repentance, are we bound to believe him? Were this done, we must of necessity go willingly and knowingly into mistake; for where will be discretion, if any man may freely impose on us, even to the hundredth offense? I answer, first, the discourse relates here to daily faults, in which every man, even the best, needs forgiveness. Since, then, amidst such infirmity of the flesh, our road is so slippery, and snares and attacks so numerous what will be the consequence if, at the second or third fall, the hope of forgiveness is cut off? We must add, secondly, that Christ does not deprive believers of the exercise of judgment, so as to yield a foolish readiness of belief to every slight expression, but only desires us to be so candid and merciful, as to stretch out the hand to offenders, provided there be evidence that they are sincerely dissatisfied with their sins. For repentance is a sacred thing, and therefore needs careful examination; but as soon as the offender gives probable evidence of conversion, Christ desires that he shall be admitted to reconciliation, lest, on being repulsed, he lose courage and fall back. Thirdly, It must be observed that, when any man, through his light and unsteady behavior, has exposed himself to suspicion, we may grant pardon when he asks it, and yet may do so in such a manner as to watch over his conduct for the future, that our forbearance and meekness, which proceed from the Spirit of Christ, may not become the subject of his ridicule. For we must observe the design of our Lord himself, that we ought, by our gentleness, to assist those who have fallen to rise again. And certainly we ought to imitate the goodness of our heavenly Father, who meets sinners at a distance to invite them to salvation. Besides, as repentance is a wonderful work of the Spirit, and is the creation of the new man, if we despise it, we offer an insult to God himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Mt. ch. 18, verse 21</cite></span></figcaption>

<blockquote><p>As your heavenly Father has a common love, which he extends to all mankind… so ought you to have: though you are not obliged to take your enemies into your bosom, yet you ought to love them in their order. And as your heavenly Father, though he will one day have a satisfaction from sinners, for the wrong done to his majesty, unless they repent; yet, to heap coals of fire on their heads, gives them good things of common providence, that he might not leave them without witness, yea, and affords them the outward means of grace for their souls: so, although you are bound to seek some satisfaction for God’s honor and glory from flagitious sinners, and though you may in an orderly course seek a moderate satisfaction for the wrong done to yourselves, yet you ought to love them with a love consistent with these things; that so you may imitate your heavenly Father, and approve yourselves to be his children.</p></blockquote>

<blockquote><p>Of the premises ye may gather some definition of faith, as namely that ‘love is a holy endeavor for the preservation of that which is beloved, whether God or man, with an earnest desire to be united unto it.’ For love is that bond, as the apostle speaks, whereby the members of the body are knit together. And it serves also in some sort and place to unite us unto God and Christ, notwithstanding that the communion of Christ, the head of his body the Church, be principally to be ascribed unto faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Works of Robert Rollock ed. Gunn (d. 1599; Edinburgh: Wodrow Society, 1849), vol. 1, A Treatise of God’s Effectual Calling, ch. 33, ‘Of Charity or Love’</cite>, pp. 236-37</span></figcaption>

<blockquote><p>2. And secondly, as we must do no evil to any, so there is a necessity of doing good to all men, as far as we may; and because it is impossible to have 〈◊〉 motum, a particular affection to love every particular man, to rejoice at his good or to have a care of him, our nature and estate being finite, and not sufficient for it: therefore for our actions we are only enjoined to these towards all: 1. First, the duty of prayer, even for our enemies, this is like to the sunbeams, that radius charitatis, which we send to heaven for all men. And this is imposed upon every man, and to be performed for every man. 2. The second action is, to be done in a case of necessity, and is that which is intimated in the parable in the Gospel, of the man that fell among thieves; even the succour we owe to every man in necessity, which is 〈◊〉, that rather than we should fail in this case to help him, we are adimere 〈◊〉 multa non necessaria, take from our own all that is not necessary, to relieve his necessity; which is expressed by the wise man, ‘If thine enemy hunger, give him bread; and if he thirst, give him water to drink.’ If we do not, we make a breach of the First Table, according to that of St. John: 〈◊〉 has this world’s good, and see his brother has need, and 〈◊〉 up his bowels of compassion from him, how dwells the love of God in him?’ Now by the world’s good is meant sufficiency, or abundance with superfluity, and his need not without extremity. The secound Councel of Arelat. sets down, Quae quis salvo statu 〈◊◊〉, pro superfluis haberi debent concurrente fratris necessitate: those things which a man may bestow, saving his estate or condition of life, are to be accounted as things superfluous, if his brother’s necessity be present. And under this is comprehended also the charitable performing of the works of our vocation for the good of all that are in necessity. As the lawyer is not to deny his counsel to any one that shall ask it: nor the physician his help to any that shall require it in case of necessity. And a further injunction then prayer and parting with our superfluity is commanded by the conjunction copulative in the three first verses of the Gospel: where a man is charged, if his cloak be taken from him, to part with his coat too; and if he be struck on the one cheek, to offer the other: which is nothing, but: 1. The habitual patience of the mind, whereby a man should be ready to part with such things and bear such injuries if the glory of God require it, otherwise he is not bound. And 2. rather to suffer more wrong than to seek revenge or return evil for evil. 2. The second thing proposed is the object of this love, which is our neighbor. Of which word ‘neighbor’ in our Savior’s time there was a strict acception, it was reduced to a narrow room. For the Pharisees counted none neighbors but their friends, and those of their own country and kindred, and so they expounded the Law, Thou 〈◊〉 thy neighbour, by restraing it to such: but our Savior makes the word to be of a larger extent, and forces the lawyer to confess that it extends to enemies, even to Samaritans, which were such deadly enemies to the Jews that they would not 〈◊〉 Christ, because his face was towards 〈◊〉; for every one from whom we may receive mercy, or to whom too we may shew mercy are neighbors, and so our Savior proves that the Samaritan was a neighbor to him that fell among thieves, because he shewed him mercy, though otherwise he were an enemy to the Jews, and of another nation, for as Saint Augustine says, he is proximus, a neighbour, Qui est proximo 〈◊〉, that is near to another in works of mercy, and therefore it is not cognatio 〈◊◊〉, kindred or cohabitation, but mercy that 〈◊〉 a man to be a neighbor, and seeing every man, even an enemy, may be an object of mercy, therefore every man, even an enemy is a neighbor. And it is not Christ’s exposition only, but the Law says the very same, in the case of a stray ox or ass. If thy brothers ox or ass go astray, etc. which brother in another place is said to be even an enemy, for there is in the same Law, 〈◊〉 23. 4, 5. where it is said, ‘If thy enemy’s ox or ass go astray, etc.’ He that is the object of our love is expressed in Scripture by three words, which are distinguished in the Hebrew, as well as in the Latin: 1. Amicus, a friend or fellow. 2. Proximus, a neighbour. 3. Frater, a brother; which is used by St. John constantly in his first Epistle. In all which are motives and grounds of love. For: 1. In brethren there is identitas naturae, etc. identity of nature, which makes all creatures love one another; one beast delighting in another of the same kind, and little children delighting in their image in the glass, show this. 2. Now as this similitude is a 〈◊〉 of love, so is identitas originis, identity of beginning; therefore it is a natural thing, for brethren born to love one another, because they have the same original; and nothing so unnatural, as one brother not to love another. 2. Between Friends, love is the cause of love, for it will be mutual and reciprocal. 〈◊〉 amoris magnes, love is a loadstone to love. Our Savior knew this well, and therefore in the commandment of love He expresses it is thus, ‘That ye love one another;’ it must be amor mutuus, mutual love. Another ground of love among friends is societas periculi, et 〈◊〉, when men partake of the same danger or deliverance, as captives under the Turk delivered by the same ransom. This ground of love we have, who being all in danger of hell, and become captives of Satan, are delivered by the same ransom, by Christ. This makes friendship, and causes love in men that never saw one another before. 3. Now for proximus, it is defined ab use, of the use and benefit that one has by another. God has not given to any man such gifts, but that he needs the gifts of his brother. God has not given all his gifts to any one, and therefore there is none but has need of another: and therefore 〈◊〉 et utilitas, use and utility, are the grounds of propinquity, and make men become proximi, neighbors. 4. Lastly, there is 〈◊〉 instituti; both amongst 〈◊〉, friends and neighbors, all do tendere ad idem, tend to one and the same end; that is, to be partakers of the blessedness, which the angels of God enjoy: for this is institutum 〈◊〉, et proximi 〈◊〉, et amici, et nostrum omnium, the end and scope of my brother, neighbor, friend, and myself, and of all of us. These then are the reasons of God’s using those words, and the reasons also of our love. … 2. We must know, that in proximitate, neighborhood, there are degrees of nearness, whereby one is nearer than another. In which respect that affection which causes us to remember some before others in our prayers is not from any corruption of our nature, because omission of duty to one is a greater sin than to another; for the duty to a father is greater than to a stranger. But as in natural things there is major 〈◊〉, a stronger motion, where there is major 〈◊〉, a stronger inclination; so where there is a greater duty owing, there God will have a greater affection. Because the earth is to come 〈◊〉 to the center than the water, therefore it has majorem gravitatem, a greater degree of 〈◊〉, to draw it thither; and so where the greater actions or duties are required, there greater affections or a greater measure of love, which is a weight pressing to the 〈◊〉, is necessary: not only charitas, but also ordo charitatis cadit sub 〈◊〉, as the 〈◊〉 determine. As therefore the affection of love is required, so our love must be ordered, as the Schools speak. The demonstration stands thus: If wheresoever there is principium, a beginning; there whatsoever is 〈◊〉 principio, 〈◊〉 to it, is 〈◊〉 first, and so consequently there is an order, and so every thing, as it is 〈◊〉 or 〈◊〉 off, must first or latter be intended. Now there are two causes or principles of love; God and ourselves, and therefore the nearer any are to these principles (as some men are nearer to ourselves, as fathers, mothers, etc. so are nearer to God by grace) the more they are to be loved. Let us see then this order in our charity, that it may be ordinata charitas, charity well ordered. To which purpose it must stand thus: 1. God. 2. Our own souls. 3. Our brother’s soul. 4. Our bodies. 5 The body of our neighbor or brother. 1. God is to be loved especially, and in the first place, because He is that chiefest good, by the communication whereof we are all made good. So says St. Augustine, 〈◊〉 vera et summa vita, in quo, a quo, et per quem, bona sunt omnia, 〈◊〉 bona sunt, ‘God is the true and chief life; in, from and by whom are all good things. And as another, Cum 〈◊〉 Deum 〈◊〉 in ipso 〈◊〉, by loving God we find all things: God is the universal nature, to whom all things give place. He must have the first place in our love; as in policy the public good is preferred before all private respects: and therefore a good citizen will be content to lose his own goods, thereby to redeem peace to the public. We see in nature that heavy things will move upwards, contrary to their own particular nature, propter salutem universi, for the good of the universe, as that ne detur 〈◊〉: so in religion, God and our love to Him, 〈◊〉 dilectionis in 〈◊〉, does overcome and drown all other loves to ourselves, or any other particular object; as we see it did in St. Paul, who out of his love to God (that he might be glorified in the salvation of the Jews) 〈◊〉 to be separated from Christ, if it had been possible [Rom. 9:4], and not incompatible with his love to God which was as a motion against a particular nature, for the good of the general or universe. 2. The next is ourselves, and ourselves before our brethren. The reason is because in the one there is an unity, in the other, at the most is but a union: and major 〈◊〉 habenda est unitatis, quam 〈◊〉, there is a greater regard to be had of the 〈◊〉, than of the latter. And again, seeing it is not lawful for any to commit a sin to prevent his brother 〈◊〉 sinning, nay not to save the whole world, it shows plainly, we are to prefer the love of ourselves before our brother, and in ourselves our own souls before our brother’s soul. Now in the case between the health or good of our own body and of our brother’s soul, it thus stands: There can come no participation of the glory of God to our bodies, nisi per redundantiam, as it were by an overflowing, when the soul being full communicates it to the body. But the soul of our brother is capable of divine glory, and the universal good, immediately by itself, and therefore ought to be preferred before the body of any which participates only per redundantiam, by the overflowing of the soul, and so at the second hand as it were; besides one soul is worth all bodily creatures in the world: a man therefore may endanger his body, for the saving his brother’s soul. 3. Then in the next place we are to seek the good of our neighbor’s body: and of neighbors: 1. 〈◊〉 est omnibus, we are generally to love, and succour all that need, any whomsoever, if they be in extrema necessitate, in extreme necessity. 2. And in the next place, of those that be in need, maxime 〈◊〉, especially we are to do good to them that are of the household of faith, as the apostle directs, that are of the same religion with us, we are to relieve such before others, if we cannot relieve both, believers before infidels. 3. And thirdly, among the faithful, to them that are of our own country, before the children of strangers. 4. Fourthly among those of our own country, 〈◊〉, to our own, to those that have some relation to us, for he that regards not his own, says the apostle, is worse than an 〈◊〉. 5. Fiftly, of our own, to them that are of our own house or kindred. 6. Sixthly, in the house, to the wife on 〈◊〉, rather than to father, mother or children; for a man must leave father and mother, and cleave to his wife; and that the husband ought to be preferred before children appears by 〈◊〉speech to 〈◊〉, ‘Am not I better to thee than many sons? And therefore the children are not to lay up for the 〈◊〉, but the fathers for the children, as the apostle says, yet everyone should have respect both upwards and downwards. Now for strangers, or those that are not nostri, ours, either they be rich or poor, of which the poor are rather to be regarded than the rich; and for the rich, they are either such as we have received benefits from, or to whom we have done good; and because 〈◊〉 est 〈◊〉 et maximum 〈◊◊〉, the work is the chief 〈◊〉 of the 〈◊〉 of anything, and bestowing of good is, 〈◊◊〉, 〈◊◊〉 which makes 〈◊〉 virtue 〈◊◊〉 visible; and in that respect it is, that a man is apt to love his own work or his own creature, as we say; yet we ought to prefer him of whom we have received benefits before him on whom we have bestowed any, because a benefactor is more like a 〈◊〉 to us than the other like a son. T〈◊〉 2. 2. q. 26. a. 12, Ex. Arist. 9. Eth. But if (as Saint 〈◊〉 〈◊〉 it) there are two persons, who in all respects are equal, and we have something that would help either of them, and that it cannot be divided. What is then to be done? There being nothing in the one why I should pleasure him more than the other, quid 〈◊〉 sorte eligerim, nothing, but to choose one by lot. The same may be the case of every man that is to do good to another, who in 〈◊〉 all are of finite nature, and therefore are not able to do good to all or to satisfy all, therefore when we are joined in the like relation to us, or the degree of 〈◊〉 or propinquity, if we must help both, there remains nothing but 〈◊〉, to 〈◊〉 it by 〈◊〉. Further we are to know that in love there is a double respect: 1. Of the object or party loved. 2. of the subject, or party that loves. 1. 〈◊〉 dilecti, in 〈◊〉 of the 〈◊〉 loved, we are to respect 〈◊◊〉, and to love him more in whom the more excellent gifts of grace appear, so as to take more complacency in him, and to wish him the more excellent good, as the greater degree of glory; because the more excellent anything is, the nearer it comes to God, and if he be better, we ought to wish him better. Thus spiritual conjunction or nearness is to be preferred, 〈◊〉 objecti, in respect of the object. 2. Ratione 〈◊〉, 〈◊〉 of the 〈◊〉 loving, and here natural and 〈◊〉 propinquity or conjunction may be preferred before spiritual, as founded in nature, and therefore more firm and immutable: and hence it is that in temporal things, a man may prefer one that is nearer by nature, before one that is only conjoined with us by grace. Thus if a man have money or estate to give; he is not bound to bestow it upon the best man in the world, but may prefer one that’s nearer in nature, though not so excellent in grace. And thus far de ordine 〈◊〉, of the order of our love. The third general proposed is the 〈◊〉 of this love, 〈◊◊〉. ‘As thyself’. This is sicut te, ‘as thyself’; not 〈◊〉 te, as 〈◊〉 as thyself, it signifies a respect, but not a quantity. The Hebrew 〈 Hebrew 〉 signifies not 〈◊〉 but 〈◊〉, as Job 12:3, for as we said before, every man ought to have a greater regard to his own soul than to his brothers. Now this 〈◊〉 or manner of love must appear in four things: 1. the end. 2. the means. 3. the manner. 4. the order. 1. The first in 〈◊〉 te 〈◊〉, is in respect of the end, for which thou lovest thyself, or for the same cause, And thou lovest thyself, because thou lovest God, and so consequently, all 〈◊◊〉 Dei, that are Gods; because thou thyself art aliquid Dei, ‘something of God’; therefore thou lovest thyself, and so consequently thou must love thy neighbour propter 〈◊〉 for God; and 〈◊〉 for this cause thou lovest thy brother, thou 〈◊〉 him as thyself, in respect of the end. So also and in this 〈◊〉 thou must love thy brother. 2. The second is the 〈◊〉, the applying this love to that end. And that is, that inasmuch as I love myself, I wish myself good, and that not in my 〈◊〉 but best part, which is my reasonable soul: and therefore I wish more especially the chiefest good of it, 〈◊〉 bonum 〈◊◊〉, which is, eternal blessedness and this is it which I must look to in my brother. If I love him as myself, I must love him ad 〈◊◊〉 partis, for the good of his better part, and that is the good of the inward man (of which the apostle speaks), whereas the most love only the outward man; now the chiefest good of the inward man consists in 〈◊〉 Dei in the sight and fruition of God. But because none can come to this except the impediments be removed, which is sin; Saint Augustine 〈◊〉, 〈◊◊〉 diligit proximum hoc cum 〈◊〉 debet 〈◊〉, 〈◊◊〉 ipse 〈◊〉 toto corde 〈◊◊〉, 〈◊〉 that truly 〈◊〉 his 〈◊〉, must work upon him so, 〈◊〉 he also love God with all his heart. Take care to remove his sins, and as for a man’s self, 〈◊〉 his will do 〈◊◊◊〉, 〈◊〉 him to some sin, non 〈◊◊〉, be must 〈◊◊〉, because it would hinder 〈◊◊〉 the 〈◊〉 good, so ought he to love his neghbour, as not to consent to the evil will of his neighbor in any bad action, because that would hinder his chief good. The Scripture speaks of things not always as they are, but as they ought to be, and so requiring us to love others as ourselves, it is not meant of ourself love, 〈◊〉 it is corrupt, but as we ought to love ourselves specimen naturae capiendum ex optima natura, a pattern in nature must be taken from nature pure and 〈◊〉 in its integrity; so that a man ought not to love his neighbor as he does himself, but as he should love himself. For saint Augustine says, when I love myself, either I love myself because I am or should be blessed: the very same rule we should observe in our brother: I must love him, aut quia est 〈◊〉 ut sit, either because he is, or because he should be good. Which I cannot do unless I win him ab impedimentis, from the impediments, and set him in via in 〈◊〉 right way: for as saint Augustine says, Non 〈◊〉 proximum tanquam seipsum si non ad id 〈◊〉 ad quod ipse tendis, adducis. Thou lovest not thy neighbor as thyself, if thou 〈◊〉 him not to that good, to which thou thyself tends. And he says in another place, 〈◊〉 est regula 〈◊〉, it is the only rule of love, ut 〈◊〉 sibi 〈◊〉 bona pervenire, et illi velit, that he would have the same good come to his neighbor, that he wishes to himself. 3. The third is the manner. In loving anything that is good there are two motives: First, either it is for the sole and alone good of him that loves it, or Secondly, for the good of the thing itself, that is loved he that loves anything, not for itself, but for himself, does not love it as himself, this is not diligere 〈◊〉 seipsum, but propter seipsum; this is not, ut faciat bonum, sed ut potiatur quis bono, not to seek his good whom we love, but to make use of what good is in him for ourselves, as men love their instruments, merely for the use they have of them and not otherwise; thus a man loves his shooing horn, to make use of it, to serve his turn in the morning, and casts it away all the day after: but our love to our neighbor should be gratuitus, without hope of recompence, and that he that we love may have the sole good by it. Otherwise if we love him not as ourselves, for no man loves himself, ut se potiatur, that he may make use of himself, as he loves meat, drink, etc. and therefore must he love his neighbor, not to make use of him for his own ends, but propter seipsum, for himself, seeking and desiring his good. 4. The last is the order. It is sicut teipsum, not sicut 〈◊〉, as ourselves, not as we love God; we must beware of loving Him so, for we must love ourselves infra Deum, in a pitch below God; and by consequence we must love our neighbour infra Deum, after God. Therefore we must not 〈◊〉 the will of any man, be he of never so great excellency, before the will of God. God’s will must not give place to ours. God is not so unwise as to bring in the Second Table to overthrow the first, but his scope in it was, that it should be a table to direct and help us in performing the duties of the first. 1. So that if our love to our neighbor, in the first place be for God alone, then it is Sancta dilectio. 2. If it be to bring him to that end we aim at our 〈◊〉, then it is amor justus, a just love. 3. If it be merely for our neighbors, without respect to ourselves then it is verus amor, true love. 4. and lastly if we prefer the love of God in the first place then it is ordinata dilectio, well ordered love. Now God in both these tables proceeds further than earthly princes; he takes order for the regulating of the heart and soul even for restraint of concupisence that there be no entertainment of sin within us and that we conceive no delight in it. And this is the internal obedience of the Second Table, to entertain no concupiscence prejudicial to our neighbour, and it is the sum or substance of the Tenth Commandment, which God has placed last, not first that those two, the First Commandment and the Last, the one concerning the inward worship of God, the other the inward love and duty to our neighbor, might be the bounds of his law.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2. And secondly, as we must do no evil to any, so there is a necessity of doing good to all men, as far as we may; and because it is impossible to have 〈◊〉 motum, a particular affection to love every particular man, to rejoice at his good or to have a care of him, our nature and estate being finite, and not sufficient for it: therefore for our actions we are only enjoined to these towards all: 1. First, the duty of prayer, even for our enemies, this is like to the sunbeams, that radius charitatis, which we send to heaven for all men. And this is imposed upon every man, and to be performed for every man. 2. The second action is, to be done in a case of necessity, and is that which is intimated in the parable in the Gospel, of the man that fell among thieves; even the succour we owe to every man in necessity, which is 〈◊〉, that rather than we should fail in this case to help him, we are adimere 〈◊〉 multa non necessaria, take from our own all that is not necessary, to relieve his necessity; which is expressed by the wise man, ‘If thine enemy hunger, give him bread; and if he thirst, give him water to drink.’ If we do not, we make a breach of the First Table, according to that of St. John: 〈◊〉 has this world’s good, and see his brother has need, and 〈◊〉 up his bowels of compassion from him, how dwells the love of God in him?’ Now by the world’s good is meant sufficiency, or abundance with superfluity, and his need not without extremity. The secound Councel of Arelat. sets down, Quae quis salvo statu 〈◊◊〉, pro superfluis haberi debent concurrente fratris necessitate: those things which a man may bestow, saving his estate or condition of life, are to be accounted as things superfluous, if his brother’s necessity be present. And under this is comprehended also the charitable performing of the works of our vocation for the good of all that are in necessity. As the lawyer is not to deny his counsel to any one that shall ask it: nor the physician his help to any that shall require it in case of necessity. And a further injunction then prayer and parting with our superfluity is commanded by the conjunction copulative in the three first verses of the Gospel: where a man is charged, if his cloak be taken from him, to part with his coat too; and if he be struck on the one cheek, to offer the other: which is nothing, but: 1. The habitual patience of the mind, whereby a man should be ready to part with such things and bear such injuries if the glory of God require it, otherwise he is not bound. And 2. rather to suffer more wrong than to seek revenge or return evil for evil. 2. The second thing proposed is the object of this love, which is our neighbor. Of which word ‘neighbor’ in our Savior’s time there was a strict acception, it was reduced to a narrow room. For the Pharisees counted none neighbors but their friends, and those of their own country and kindred, and so they expounded the Law, Thou 〈◊〉 thy neighbour, by restraing it to such: but our Savior makes the word to be of a larger extent, and forces the lawyer to confess that it extends to enemies, even to Samaritans, which were such deadly enemies to the Jews that they would not 〈◊〉 Christ, because his face was towards 〈◊〉; for every one from whom we may receive mercy, or to whom too we may shew mercy are neighbors, and so our Savior proves that the Samaritan was a neighbor to him that fell among thieves, because he shewed him mercy, though otherwise he were an enemy to the Jews, and of another nation, for as Saint Augustine says, he is proximus, a neighbour, Qui est proximo 〈◊〉, that is near to another in works of mercy, and therefore it is not cognatio 〈◊◊〉, kindred or cohabitation, but mercy that 〈◊〉 a man to be a neighbor, and seeing every man, even an enemy, may be an object of mercy, therefore every man, even an enemy is a neighbor. And it is not Christ’s exposition only, but the Law says the very same, in the case of a stray ox or ass. If thy brothers ox or ass go astray, etc. which brother in another place is said to be even an enemy, for there is in the same Law, 〈◊〉 23. 4, 5. where it is said, ‘If thy enemy’s ox or ass go astray, etc.’ He that is the object of our love is expressed in Scripture by three words, which are distinguished in the Hebrew, as well as in the Latin: 1. Amicus, a friend or fellow. 2. Proximus, a neighbour. 3. Frater, a brother; which is used by St. John constantly in his first Epistle. In all which are motives and grounds of love. For: 1. In brethren there is identitas naturae, etc. identity of nature, which makes all creatures love one another; one beast delighting in another of the same kind, and little children delighting in their image in the glass, show this. 2. Now as this similitude is a 〈◊〉 of love, so is identitas originis, identity of beginning; therefore it is a natural thing, for brethren born to love one another, because they have the same original; and nothing so unnatural, as one brother not to love another. 2. Between Friends, love is the cause of love, for it will be mutual and reciprocal. 〈◊〉 amoris magnes, love is a loadstone to love. Our Savior knew this well, and therefore in the commandment of love He expresses it is thus, ‘That ye love one another;’ it must be amor mutuus, mutual love. Another ground of love among friends is societas periculi, et 〈◊〉, when men partake of the same danger or deliverance, as captives under the Turk delivered by the same ransom. This ground of love we have, who being all in danger of hell, and become captives of Satan, are delivered by the same ransom, by Christ. This makes friendship, and causes love in men that never saw one another before. 3. Now for proximus, it is defined ab use, of the use and benefit that one has by another. God has not given to any man such gifts, but that he needs the gifts of his brother. God has not given all his gifts to any one, and therefore there is none but has need of another: and therefore 〈◊〉 et utilitas, use and utility, are the grounds of propinquity, and make men become proximi, neighbors. 4. Lastly, there is 〈◊〉 instituti; both amongst 〈◊〉, friends and neighbors, all do tendere ad idem, tend to one and the same end; that is, to be partakers of the blessedness, which the angels of God enjoy: for this is institutum 〈◊〉, et proximi 〈◊〉, et amici, et nostrum omnium, the end and scope of my brother, neighbor, friend, and myself, and of all of us. These then are the reasons of God’s using those words, and the reasons also of our love. … 2. We must know, that in proximitate, neighborhood, there are degrees of nearness, whereby one is nearer than another. In which respect that affection which causes us to remember some before others in our prayers is not from any corruption of our nature, because omission of duty to one is a greater sin than to another; for the duty to a father is greater than to a stranger. But as in natural things there is major 〈◊〉, a stronger motion, where there is major 〈◊〉, a stronger inclination; so where there is a greater duty owing, there God will have a greater affection. Because the earth is to come 〈◊〉 to the center than the water, therefore it has majorem gravitatem, a greater degree of 〈◊〉, to draw it thither; and so where the greater actions or duties are required, there greater affections or a greater measure of love, which is a weight pressing to the 〈◊〉, is necessary: not only charitas, but also ordo charitatis cadit sub 〈◊〉, as the 〈◊〉 determine. As therefore the affection of love is required, so our love must be ordered, as the Schools speak. The demonstration stands thus: If wheresoever there is principium, a beginning; there whatsoever is 〈◊〉 principio, 〈◊〉 to it, is 〈◊〉 first, and so consequently there is an order, and so every thing, as it is 〈◊〉 or 〈◊〉 off, must first or latter be intended. Now there are two causes or principles of love; God and ourselves, and therefore the nearer any are to these principles (as some men are nearer to ourselves, as fathers, mothers, etc. so are nearer to God by grace) the more they are to be loved. Let us see then this order in our charity, that it may be ordinata charitas, charity well ordered. To which purpose it must stand thus: 1. God. 2. Our own souls. 3. Our brother’s soul. 4. Our bodies. 5 The body of our neighbor or brother. 1. God is to be loved especially, and in the first place, because He is that chiefest good, by the communication whereof we are all made good. So says St. Augustine, 〈◊〉 vera et summa vita, in quo, a quo, et per quem, bona sunt omnia, 〈◊〉 bona sunt, ‘God is the true and chief life; in, from and by whom are all good things. And as another, Cum 〈◊〉 Deum 〈◊〉 in ipso 〈◊〉, by loving God we find all things: God is the universal nature, to whom all things give place. He must have the first place in our love; as in policy the public good is preferred before all private respects: and therefore a good citizen will be content to lose his own goods, thereby to redeem peace to the public. We see in nature that heavy things will move upwards, contrary to their own particular nature, propter salutem universi, for the good of the universe, as that ne detur 〈◊〉: so in religion, God and our love to Him, 〈◊〉 dilectionis in 〈◊〉, does overcome and drown all other loves to ourselves, or any other particular object; as we see it did in St. Paul, who out of his love to God (that he might be glorified in the salvation of the Jews) 〈◊〉 to be separated from Christ, if it had been possible [Rom. 9:4], and not incompatible with his love to God which was as a motion against a particular nature, for the good of the general or universe. 2. The next is ourselves, and ourselves before our brethren. The reason is because in the one there is an unity, in the other, at the most is but a union: and major 〈◊〉 habenda est unitatis, quam 〈◊〉, there is a greater regard to be had of the 〈◊〉, than of the latter. And again, seeing it is not lawful for any to commit a sin to prevent his brother 〈◊〉 sinning, nay not to save the whole world, it shows plainly, we are to prefer the love of ourselves before our brother, and in ourselves our own souls before our brother’s soul. Now in the case between the health or good of our own body and of our brother’s soul, it thus stands: There can come no participation of the glory of God to our bodies, nisi per redundantiam, as it were by an overflowing, when the soul being full communicates it to the body. But the soul of our brother is capable of divine glory, and the universal good, immediately by itself, and therefore ought to be preferred before the body of any which participates only per redundantiam, by the overflowing of the soul, and so at the second hand as it were; besides one soul is worth all bodily creatures in the world: a man therefore may endanger his body, for the saving his brother’s soul. 3. Then in the next place we are to seek the good of our neighbor’s body: and of neighbors: 1. 〈◊〉 est omnibus, we are generally to love, and succour all that need, any whomsoever, if they be in extrema necessitate, in extreme necessity. 2. And in the next place, of those that be in need, maxime 〈◊〉, especially we are to do good to them that are of the household of faith, as the apostle directs, that are of the same religion with us, we are to relieve such before others, if we cannot relieve both, believers before infidels. 3. And thirdly, among the faithful, to them that are of our own country, before the children of strangers. 4. Fourthly among those of our own country, 〈◊〉, to our own, to those that have some relation to us, for he that regards not his own, says the apostle, is worse than an 〈◊〉. 5. Fiftly, of our own, to them that are of our own house or kindred. 6. Sixthly, in the house, to the wife on 〈◊〉, rather than to father, mother or children; for a man must leave father and mother, and cleave to his wife; and that the husband ought to be preferred before children appears by 〈◊〉speech to 〈◊〉, ‘Am not I better to thee than many sons? And therefore the children are not to lay up for the 〈◊〉, but the fathers for the children, as the apostle says, yet everyone should have respect both upwards and downwards. Now for strangers, or those that are not nostri, ours, either they be rich or poor, of which the poor are rather to be regarded than the rich; and for the rich, they are either such as we have received benefits from, or to whom we have done good; and because 〈◊〉 est 〈◊〉 et maximum 〈◊◊〉, the work is the chief 〈◊〉 of the 〈◊〉 of anything, and bestowing of good is, 〈◊◊〉, 〈◊◊〉 which makes 〈◊〉 virtue 〈◊◊〉 visible; and in that respect it is, that a man is apt to love his own work or his own creature, as we say; yet we ought to prefer him of whom we have received benefits before him on whom we have bestowed any, because a benefactor is more like a 〈◊〉 to us than the other like a son. T〈◊〉 2. 2. q. 26. a. 12, Ex. Arist. 9. Eth. But if (as Saint 〈◊〉 〈◊〉 it) there are two persons, who in all respects are equal, and we have something that would help either of them, and that it cannot be divided. What is then to be done? There being nothing in the one why I should pleasure him more than the other, quid 〈◊〉 sorte eligerim, nothing, but to choose one by lot. The same may be the case of every man that is to do good to another, who in 〈◊〉 all are of finite nature, and therefore are not able to do good to all or to satisfy all, therefore when we are joined in the like relation to us, or the degree of 〈◊〉 or propinquity, if we must help both, there remains nothing but 〈◊〉, to 〈◊〉 it by 〈◊〉. Further we are to know that in love there is a double respect: 1. Of the object or party loved. 2. of the subject, or party that loves. 1. 〈◊〉 dilecti, in 〈◊〉 of the 〈◊〉 loved, we are to respect 〈◊◊〉, and to love him more in whom the more excellent gifts of grace appear, so as to take more complacency in him, and to wish him the more excellent good, as the greater degree of glory; because the more excellent anything is, the nearer it comes to God, and if he be better, we ought to wish him better. Thus spiritual conjunction or nearness is to be preferred, 〈◊〉 objecti, in respect of the object. 2. Ratione 〈◊〉, 〈◊〉 of the 〈◊〉 loving, and here natural and 〈◊〉 propinquity or conjunction may be preferred before spiritual, as founded in nature, and therefore more firm and immutable: and hence it is that in temporal things, a man may prefer one that is nearer by nature, before one that is only conjoined with us by grace. Thus if a man have money or estate to give; he is not bound to bestow it upon the best man in the world, but may prefer one that’s nearer in nature, though not so excellent in grace. And thus far de ordine 〈◊〉, of the order of our love. The third general proposed is the 〈◊〉 of this love, 〈◊◊〉. ‘As thyself’. This is sicut te, ‘as thyself’; not 〈◊〉 te, as 〈◊〉 as thyself, it signifies a respect, but not a quantity. The Hebrew 〈 Hebrew 〉 signifies not 〈◊〉 but 〈◊〉, as Job 12:3, for as we said before, every man ought to have a greater regard to his own soul than to his brothers. Now this 〈◊〉 or manner of love must appear in four things: 1. the end. 2. the means. 3. the manner. 4. the order. 1. The first in 〈◊〉 te 〈◊〉, is in respect of the end, for which thou lovest thyself, or for the same cause, And thou lovest thyself, because thou lovest God, and so consequently, all 〈◊◊〉 Dei, that are Gods; because thou thyself art aliquid Dei, ‘something of God’; therefore thou lovest thyself, and so consequently thou must love thy neighbour propter 〈◊〉 for God; and 〈◊〉 for this cause thou lovest thy brother, thou 〈◊〉 him as thyself, in respect of the end. So also and in this 〈◊〉 thou must love thy brother. 2. The second is the 〈◊〉, the applying this love to that end. And that is, that inasmuch as I love myself, I wish myself good, and that not in my 〈◊〉 but best part, which is my reasonable soul: and therefore I wish more especially the chiefest good of it, 〈◊〉 bonum 〈◊◊〉, which is, eternal blessedness and this is it which I must look to in my brother. If I love him as myself, I must love him ad 〈◊◊〉 partis, for the good of his better part, and that is the good of the inward man (of which the apostle speaks), whereas the most love only the outward man; now the chiefest good of the inward man consists in 〈◊〉 Dei in the sight and fruition of God. But because none can come to this except the impediments be removed, which is sin; Saint Augustine 〈◊〉, 〈◊◊〉 diligit proximum hoc cum 〈◊〉 debet 〈◊〉, 〈◊◊〉 ipse 〈◊〉 toto corde 〈◊◊〉, 〈◊〉 that truly 〈◊〉 his 〈◊〉, must work upon him so, 〈◊〉 he also love God with all his heart. Take care to remove his sins, and as for a man’s self, 〈◊〉 his will do 〈◊◊◊〉, 〈◊〉 him to some sin, non 〈◊◊〉, be must 〈◊◊〉, because it would hinder 〈◊◊〉 the 〈◊〉 good, so ought he to love his neghbour, as not to consent to the evil will of his neighbor in any bad action, because that would hinder his chief good. The Scripture speaks of things not always as they are, but as they ought to be, and so requiring us to love others as ourselves, it is not meant of ourself love, 〈◊〉 it is corrupt, but as we ought to love ourselves specimen naturae capiendum ex optima natura, a pattern in nature must be taken from nature pure and 〈◊〉 in its integrity; so that a man ought not to love his neighbor as he does himself, but as he should love himself. For saint Augustine says, when I love myself, either I love myself because I am or should be blessed: the very same rule we should observe in our brother: I must love him, aut quia est 〈◊〉 ut sit, either because he is, or because he should be good. Which I cannot do unless I win him ab impedimentis, from the impediments, and set him in via in 〈◊〉 right way: for as saint Augustine says, Non 〈◊〉 proximum tanquam seipsum si non ad id 〈◊〉 ad quod ipse tendis, adducis. Thou lovest not thy neighbor as thyself, if thou 〈◊〉 him not to that good, to which thou thyself tends. And he says in another place, 〈◊〉 est regula 〈◊〉, it is the only rule of love, ut 〈◊〉 sibi 〈◊〉 bona pervenire, et illi velit, that he would have the same good come to his neighbor, that he wishes to himself. 3. The third is the manner. In loving anything that is good there are two motives: First, either it is for the sole and alone good of him that loves it, or Secondly, for the good of the thing itself, that is loved he that loves anything, not for itself, but for himself, does not love it as himself, this is not diligere 〈◊〉 seipsum, but propter seipsum; this is not, ut faciat bonum, sed ut potiatur quis bono, not to seek his good whom we love, but to make use of what good is in him for ourselves, as men love their instruments, merely for the use they have of them and not otherwise; thus a man loves his shooing horn, to make use of it, to serve his turn in the morning, and casts it away all the day after: but our love to our neighbor should be gratuitus, without hope of recompence, and that he that we love may have the sole good by it. Otherwise if we love him not as ourselves, for no man loves himself, ut se potiatur, that he may make use of himself, as he loves meat, drink, etc. and therefore must he love his neighbor, not to make use of him for his own ends, but propter seipsum, for himself, seeking and desiring his good. 4. The last is the order. It is sicut teipsum, not sicut 〈◊〉, as ourselves, not as we love God; we must beware of loving Him so, for we must love ourselves infra Deum, in a pitch below God; and by consequence we must love our neighbour infra Deum, after God. Therefore we must not 〈◊〉 the will of any man, be he of never so great excellency, before the will of God. God’s will must not give place to ours. God is not so unwise as to bring in the Second Table to overthrow the first, but his scope in it was, that it should be a table to direct and help us in performing the duties of the first. 1. So that if our love to our neighbor, in the first place be for God alone, then it is Sancta dilectio. 2. If it be to bring him to that end we aim at our 〈◊〉, then it is amor justus, a just love. 3. If it be merely for our neighbors, without respect to ourselves then it is verus amor, true love. 4. and lastly if we prefer the love of God in the first place then it is ordinata dilectio, well ordered love. Now God in both these tables proceeds further than earthly princes; he takes order for the regulating of the heart and soul even for restraint of concupisence that there be no entertainment of sin within us and that we conceive no delight in it. And this is the internal obedience of the Second Table, to entertain no concupiscence prejudicial to our neighbour, and it is the sum or substance of the Tenth Commandment, which God has placed last, not first that those two, the First Commandment and the Last, the one concerning the inward worship of God, the other the inward love and duty to our neighbor, might be the bounds of his law.”

is+salvo+statu+%E3%80%88%E2%97%8A%E2%97%8A%E3%80%89%2C+pro+superfluis+haberi+debent+concurrente+fratris+necessitate%3A+those+things+which+a+man+may+bestow%2C+saving+his+estate+or+condition+of+life%2C+are+to+be+accounted+as+things+superfluous%2C+if+his+brother%E2%80%99s+necessity+be+present.+And+under+this+is+comprehended+also+the+charitable+performing+of+the+works+of+our+vocation+for+the+good+of+all+that+are+in+necessity.+As+the+lawyer+is+not+to+deny+his+counsel+to+any+one+that+shall+ask+it%3A+nor+the+physician+his+help+to+any+that+shall+require+it+in+case+of+necessity.+And+a+further+injunction+then+prayer+and+parting+with+our+superfluity+is+commanded+by+the+conjunction+copulative+in+the+three+first+verses+of+the+Gospel%3A+where+a+man+is+charged%2C+if+his+cloak+be+taken+from+him%2C+to+part+with+his+coat+too%3B+and+if+he+be+struck+on+the+one+cheek%2C+to+offer+the+other%3A+which+is+nothing%2C+but%3A+1.+The+habitual+patience+of+the+mind%2C+whereby+a+man+should+be+ready+to+part+with+such+things+and+bear+such+injuries+if+the+glory+of+God+require+it%2C+otherwise+he+is+not+bound.+And+2.+rather+to+suffer+more+wrong+than+to+seek+revenge+or+return+evil+for+evil.+2.+The+second+thing+proposed+is+the+object+of+this+love%2C+which+is+our+neighbor.+Of+which+word+%E2%80%98neighbor%E2%80%99+in+our+Savior%E2%80%99s+time+there+was+a+strict+acception%2C+it+was+reduced+to+a+narrow+room.+For+the+Pharisees+counted+none+neighbors+but+their+friends%2C+and+those+of+their+own+country+and+kindred%2C+and+so+they+expounded+the+Law%2C+Thou+%E3%80%88%E2%97%8A%E3%80%89+thy+neighbour%2C+by+restraing+it+to+such%3A+but+our+Savior+makes+the+word+to+be+of+a+larger+extent%2C+and+forces+the+lawyer+to+confess+that+it+extends+to+enemies%2C+even+to+Samaritans%2C+which+were+such+deadly+enemies+to+the+Jews+that+they+would+not+%E3%80%88%E2%97%8A%E3%80%89+Christ%2C+because+his+face+was+towards+%E3%80%88%E2%97%8A%E3%80%89%3B+for+every+one+from+whom+we+may+receive+mercy%2C+or+to+whom+too+we+may+shew+mercy+are+neighbors%2C+and+so+our+Savior+proves+that+the+Samaritan+was+a+neighbor+to+him+that+fell+among+thieves%2C+because+he+shewed+him+mercy%2C+though+otherwise+he+were+an+enemy+to+the+Jews%2C+and+of+another+nation%2C+for+as+Saint+Augustine+says%2C+he+is+proximus%2C+a+neighbour%2C+Qui+est+proximo+%E3%80%88%E2%97%8A%E3%80%89%2C+that+is+near+to+another+in+works+of+mercy%2C+and+therefore+it+is+not+cognatio+%E3%80%88%E2%97%8A%E2%97%8A%E3%80%89%2C+kindred+or+cohabitation%2C+but+mercy+that+%E3%80%88%E2%97%8A%E3%80%89+a+man+to+be+a+neighbor%2C+and+seeing+every+man%2C+even+an+enemy%2C+may+be+an+object+of+mercy%2C+therefore+every+man%2C+even+an+enemy+is+a+neighbor.+And+it+is+not+Christ%E2%80%99s+exposition+only%2C+but+the+Law+says+the+very+same%2C+in+the+case+of+a+stray+ox+or+ass.+If+thy+brothers+ox+or+ass+go+astray%2C+etc.+which+brother+in+another+place+is+said+to+be+even+an+enemy%2C+for+there+is+in+the+same+Law%2C+%E3%80%88%E2%97%8A%E3%80%89+23.+4%2C+5.+where+it+is+said%2C+%E2%80%98If+thy+enemy%E2%80%99s+ox+or+ass+go+astray%2C+etc.%E2%80%99+He+that+is+the+object+of+our+love+is+expressed+in+Scripture+by+three+words%2C+which+are+distinguished+in+the+Hebrew%2C+as+well+as+in+the+Latin%3A+1.+Amicus%2C+a+friend+or+fellow.+2.+Proximus%2C+a+neighbour.+3.+Frater%2C+a+brother%3B+which+is+used+by+St.+John+constantly+in+his+first+Epistle.+In+all+which+are+motives+and+grounds+of+love.+For%3A+1.+In+brethren+there+is+identitas+naturae%2C+etc.+identity+of+nature%2C+which+makes+all+creatures+love+one+another%3B+one+beast+delighting+in+another+of+the+same+kind%2C+and+little+children+delighting+in+their+image+in+the+glass%2C+show+this.+2.+Now+as+this+similitude+is+a+%E3%80%88%E2%97%8A%E3%80%89+of+love%2C+so+is+identitas+originis%2C+identity+of+beginning%3B+therefore+it+is+a+natural+thing%2C+for+brethren+born+to+love+one+another%2C+because+they+have+the+same+original%3B+and+nothing+so+unnatural%2C+as+one+brother+not+to+love+another.+2.+Between+Friends%2C+love+is+the+cause+of+love%2C+for+it+will+be+mutual+and+reciprocal.+%E3%80%88%E2%97%8A%E3%80%89+amoris+magnes%2C+love+is+a+loadstone+to+love.+Our+Savior+knew+this+well%2C+and+therefore+in+the+commandment+of+love+He+expresses+it+is+thus%2C+%E2%80%98That+ye+love+one+another%3B%E2%80%99+it+must+be+amor+mutuus%2C+mutual+love.+Another+ground+of+love+among+friends+is+societas+periculi%2C+et+%E3%80%88%E2%97%8A%E3%80%89%2C+when+men+partake+of+the+same+danger+or+deliverance%2C+as+captives+under+the+Turk+delivered+by+the+same+ransom.+This+ground+of+love+we+have%2C+who+being+all+in+danger+of+hell%2C+and+become+captives+of+Satan%2C+are+delivered+by+the+same+ransom%2C+by+Christ.+This+makes+friendship%2C+and+causes+love+in+men+that+never+saw+one+another+before.+3.+Now+for+proximus%2C+it+is+defined+ab+use%2C+of+the+use+and+benefit+that+one+has+by+another.+God+has+not+given+to+any+man+such+gifts%2C+but+that+he+needs+the+gifts+of+his+brother.+God+has+not+given+all+his+gifts+to+any+one%2C+and+therefore+there+is+none+but+has+need+of+another%3A+and+therefore+%E3%80%88%E2%97%8A%E3%80%89+et+utilitas%2C+use+and+utility%2C+are+the+grounds+of+propinquity%2C+and+make+men+become+proximi%2C+neighbors.+4.+Lastly%2C+there+is+%E3%80%88%E2%97%8A%E3%80%89+instituti%3B+both+amongst+%E3%80%88%E2%97%8A%E3%80%89%2C+friends+and+neighbors%2C+all+do+tendere+ad+idem%2C+tend+to+one+and+the+same+end%3B+that+is%2C+to+be+partakers+of+the+blessedness%2C+which+the+angels+of+God+enjoy%3A+for+this+is+institutum+%E3%80%88%E2%97%8A%E3%80%89%2C+et+proximi+%E3%80%88%E2%97%8A%E3%80%89%2C+et+amici%2C+et+nostrum+omnium%2C+the+end+and+scope+of+my+brother%2C+neighbor%2C+friend%2C+and+myself%2C+and+of+all+of+us.+These+then+are+the+reasons+of+God%E2%80%99s+using+those+words%2C+and+the+reasons+also+of+our+love.+%E2%80%A6+2.+We+must+know%2C+that+in+proximitate%2C+neighborhood%2C+there+are+degrees+of+nearness%2C+whereby+one+is+nearer+than+another.+In+which+respect+that+affection+which+causes+us+to+remember+some+before+others+in+our+prayers+is+not+from+any+corruption+of+our+nature%2C+because+omission+of+duty+to+one+is+a+greater+sin+than+to+another%3B+for+the+duty+to+a+father+is+greater+than+to+a+stranger.+But+as+in+natural+things+there+is+major+%E3%80%88%E2%97%8A%E3%80%89%2C+a+stronger+motion%2C+where+there+is+major+%E3%80%88%E2%97%8A%E3%80%89%2C+a+stronger+inclination%3B+so+where+there+is+a+greater+duty+owing%2C+there+God+will+have+a+greater+affection.+Because+the+earth+is+to+come+%E3%80%88%E2%97%8A%E3%80%89+to+the+center+than+the+water%2C+therefore+it+has+majorem+gravitatem%2C+a+greater+degree+of+%E3%80%88%E2%97%8A%E3%80%89%2C+to+draw+it+thither%3B+and+so+where+the+greater+actions+or+duties+are+required%2C+there+greater+affections+or+a+greater+measure+of+love%2C+which+is+a+weight+pressing+to+the+%E3%80%88%E2%97%8A%E3%80%89%2C+is+necessary%3A+not+only+charitas%2C+but+also+ordo+charitatis+cadit+sub+%E3%80%88%E2%97%8A%E3%80%89%2C+as+the+%E3%80%88%E2%97%8A%E3%80%89+determine.+As+therefore+the+affection+of+love+is+required%2C+so+our+love+must+be+ordered%2C+as+the+Schools+speak.+The+demonstration+stands+thus%3A+If+wheresoever+there+is+principium%2C+a+beginning%3B+there+whatsoever+is+%E3%80%88%E2%97%8A%E3%80%89+principio%2C+%E3%80%88%E2%97%8A%E3%80%89+to+it%2C+is+%E3%80%88%E2%97%8A%E3%80%89+first%2C+and+so+consequently+there+is+an+order%2C+and+so+every+thing%2C+as+it+is+%E3%80%88%E2%97%8A%E3%80%89+or+%E3%80%88%E2%97%8A%E3%80%89+off%2C+must+first+or+latter+be+intended.+Now+there+are+two+causes+or+principles+of+love%3B+God+and+ourselves%2C+and+therefore+the+nearer+any+are+to+these+principles+%28as+some+men+are+nearer+to+ourselves%2C+as+fathers%2C+mothers%2C+etc.+so+are+nearer+to+God+by+grace%29+the+more+they+are+to+be+loved.+Let+us+see+then+this+order+in+our+charity%2C+that+it+may+be+ordinata+charitas%2C+charity+well+ordered.+To+which+purpose+it+must+stand+thus%3A+1.+God.+2.+Our+own+souls.+3.+Our+brother%E2%80%99s+soul.+4.+Our+bodies.+5+The+body+of+our+neighbor+or+brother.+1.+God+is+to+be+loved+especially%2C+and+in+the+first+place%2C+because+He+is+that+chiefest+good%2C+by+the+communication+whereof+we+are+all+made+good.+So+says+St.+Augustine%2C+%E3%80%88%E2%97%8A%E3%80%89+vera+et+summa+vita%2C+in+quo%2C+a+quo%2C+et+per+quem%2C+bona+sunt+omnia%2C+%E3%80%88%E2%97%8A%E3%80%89+bona+sunt%2C+%E2%80%98God+is+the+true+and+chief+life%3B+in%2C+from+and+by+whom+are+all+good+things.+And+as+another%2C+Cum+%E3%80%88%E2%97%8A%E3%80%89+Deum+%E3%80%88%E2%97%8A%E3%80%89+in+ipso+%E3%80%88%E2%97%8A%E3%80%89%2C+by+loving+God+we+find+all+things%3A+God+is+the+universal+nature%2C+to+whom+all+things+give+place.+He+must+have+the+first+place+in+our+love%3B+as+in+policy+the+public+good+is+preferred+before+all+private+respects%3A+and+therefore+a+good+citizen+will+be+content+to+lose+his+own+goods%2C+thereby+to+redeem+peace+to+the+public.+We+see+in+nature+that+heavy+things+will+move+upwards%2C+contrary+to+their+own+particular+nature%2C+propter+salutem+universi%2C+for+the+good+of+the+universe%2C+as+that+ne+detur+%E3%80%88%E2%97%8A%E3%80%89%3A+so+in+religion%2C+God+and+our+love+to+Him%2C+%E3%80%88%E2%97%8A%E3%80%89+dilectionis+in+%E3%80%88%E2%97%8A%E3%80%89%2C+does+overcome+and+drown+all+other+loves+to+ourselves%2C+or+any+other+particular+object%3B+as+we+see+it+did+in+St.+Paul%2C+who+out+of+his+love+to+God+%28that+he+might+be+glorified+in+the+salvation+of+the+Jews%29+%E3%80%88%E2%97%8A%E3%80%89+to+be+separated+from+Christ%2C+if+it+had+been+possible+%5BRom.+9%3A4%5D%2C+and+not+incompatible+with+his+love+to+God+which+was+as+a+motion+against+a+particular+nature%2C+for+the+good+of+the+general+or+universe.+2.+The+next+is+ourselves%2C+and+ourselves+before+our+brethren.+The+reason+is+because+in+the+one+there+is+an+unity%2C+in+the+other%2C+at+the+most+is+but+a+union%3A+and+major+%E3%80%88%E2%97%8A%E3%80%89+habenda+est+unitatis%2C+quam+%E3%80%88%E2%97%8A%E3%80%89%2C+there+is+a+greater+regard+to+be+had+of+the+%E3%80%88%E2%97%8A%E3%80%89%2C+than+of+the+latter.+And+again%2C+seeing+it+is+not+lawful+for+any+to+commit+a+sin+to+prevent+his+brother+%E3%80%88%E2%97%8A%E3%80%89+sinning%2C+nay+not+to+save+the+whole+world%2C+it+shows+plainly%2C+we+are+to+prefer+the+love+of+ourselves+before+our+brother%2C+and+in+ourselves+our+own+souls+before+our+brother%E2%80%99s+soul.+Now+in+the+case+between+the+health+or+good+of+our+own+body+and+of+our+brother%E2%80%99s+soul%2C+it+thus+stands%3A+There+can+come+no+participation+of+the+glory+of+God+to+our+bodies%2C+nisi+per+redundantiam%2C+as+it+were+by+an+overflowing%2C+when+the+soul+being+full+communicates+it+to+the+body.+But+the+soul+of+our+brother+is+capable+of+divine+glory%2C+and+the+universal+good%2C+immediately+by+itself%2C+and+therefore+ought+to+be+preferred+before+the+body+of+any+which+participates+only+per+redundantiam%2C+by+the+overflowing+of+the+soul%2C+and+so+at+the+second+hand+as+it+were%3B+besides+one+soul+is+worth+all+bodily+creatures+in+the+world%3A+a+man+therefore+may+endanger+his+body%2C+for+the+saving+his+brother%E2%80%99s+soul.+3.+Then+in+the+next+place+we+are+to+seek+the+good+of+our+neighbor%E2%80%99s+body%3A+and+of+neighbors%3A+1.+%E3%80%88%E2%97%8A%E3%80%89+est+omnibus%2C+we+are+generally+to+love%2C+and+succour+all+that+need%2C+any+whomsoever%2C+if+they+be+in+extrema+necessitate%2C+in+extreme+necessity.+2.+And+in+the+next+place%2C+of+those+that+be+in+need%2C+maxime+%E3%80%88%E2%97%8A%E3%80%89%2C+especially+we+are+to+do+good+to+them+that+are+of+the+household+of+faith%2C+as+the+apostle+directs%2C+that+are+of+the+same+religion+with+us%2C+we+are+to+relieve+such+before+others%2C+if+we+cannot+relieve+both%2C+believers+before+infidels.+3.+And+thirdly%2C+among+the+faithful%2C+to+them+that+are+of+our+own+country%2C+before+the+children+of+strangers.+4.+Fourthly+among+those+of+our+own+country%2C+%E3%80%88%E2%97%8A%E3%80%89%2C+to+our+own%2C+to+those+that+have+some+relation+to+us%2C+for+he+that+regards+not+his+own%2C+says+the+apostle%2C+is+worse+than+an+%E3%80%88%E2%97%8A%E3%80%89.+5.+Fiftly%2C+of+our+own%2C+to+them+that+are+of+our+own+house+or+kindred.+6.+Sixthly%2C+in+the+house%2C+to+the+wife+on+%E3%80%88%E2%97%8A%E3%80%89%2C+rather+than+to+father%2C+mother+or+children%3B+for+a+man+must+leave+father+and+mother%2C+and+cleave+to+his+wife%3B+and+that+the+husband+ought+to+be+preferred+before+children+appears+by+%E3%80%88%E2%97%8A%E3%80%89speech+to+%E3%80%88%E2%97%8A%E3%80%89%2C+%E2%80%98Am+not+I+better+to+thee+than+many+sons%3F+And+therefore+the+children+are+not+to+lay+up+for+the+%E3%80%88%E2%97%8A%E3%80%89%2C+but+the+fathers+for+the+children%2C+as+the+apostle+says%2C+yet+everyone+should+have+respect+both+upwards+and+downwards.+Now+for+strangers%2C+or+those+that+are+not+nostri%2C+ours%2C+either+they+be+rich+or+poor%2C+of+which+the+poor+are+rather+to+be+regarded+than+the+rich%3B+and+for+the+rich%2C+they+are+either+such+as+we+have+received+benefits+from%2C+or+to+whom+we+have+done+good%3B+and+because+%E3%80%88%E2%97%8A%E3%80%89+est+%E3%80%88%E2%97%8A%E3%80%89+et+maximum+%E3%80%88%E2%97%8A%E2%97%8A%E3%80%89%2C+the+work+is+the+chief+%E3%80%88%E2%97%8A%E3%80%89+of+the+%E3%80%88%E2%97%8A%E3%80%89+of+anything%2C+and+bestowing+of+good+is%2C+%E3%80%88%E2%97%8A%E2%97%8A%E3%80%89%2C+%E3%80%88%E2%97%8A%E2%97%8A%E3%80%89+which+makes+%E3%80%88%E2%97%8A%E3%80%89+virtue+%E3%80%88%E2%97%8A%E2%97%8A%E3%80%89+visible%3B+and+in+that+respect+it+is%2C+that+a+man+is+apt+to+love+his+own+work+or+his+own+creature%2C+as+we+say%3B+yet+we+ought+to+prefer+him+of+whom+we+have+received+benefits+before+him+on+whom+we+have+bestowed+any%2C+because+a+benefactor+is+more+like+a+%E3%80%88%E2%97%8A%E3%80%89+to+us+than+the+other+like+a+son.+T%E3%80%88%E2%97%8A%E3%80%89+2.+2.+q.+26.+a.+12%2C+Ex.+Arist.+9.+Eth.+But+if+%28as+Saint+%E3%80%88%E2%97%8A%E3%80%89+%E3%80%88%E2%97%8A%E3%80%89+it%29+there+are+two+persons%2C+who+in+all+respects+are+equal%2C+and+we+have+something+that+would+help+either+of+them%2C+and+that+it+cannot+be+divided.+What+is+then+to+be+done%3F+There+being+nothing+in+the+one+why+I+should+pleasure+him+more+than+the+other%2C+quid+%E3%80%88%E2%97%8A%E3%80%89+sorte+eligerim%2C+nothing%2C+but+to+choose+one+by+lot.+The+same+may+be+the+case+of+every+man+that+is+to+do+good+to+another%2C+who+in+%E3%80%88%E2%97%8A%E3%80%89+all+are+of+finite+nature%2C+and+therefore+are+not+able+to+do+good+to+all+or+to+satisfy+all%2C+therefore+when+we+are+joined+in+the+like+relation+to+us%2C+or+the+degree+of+%E3%80%88%E2%97%8A%E3%80%89+or+propinquity%2C+if+we+must+help+both%2C+there+remains+nothing+but+%E3%80%88%E2%97%8A%E3%80%89%2C+to+%E3%80%88%E2%97%8A%E3%80%89+it+by+%E3%80%88%E2%97%8A%E3%80%89.+Further+we+are+to+know+that+in+love+there+is+a+double+respect%3A+1.+Of+the+object+or+party+loved.+2.+of+the+subject%2C+or+party+that+loves.+1.+%E3%80%88%E2%97%8A%E3%80%89+dilecti%2C+in+%E3%80%88%E2%97%8A%E3%80%89+of+the+%E3%80%88%E2%97%8A%E3%80%89+loved%2C+we+are+to+respect+%E3%80%88%E2%97%8A%E2%97%8A%E3%80%89%2C+and+to+love+him+more+in+whom+the+more+excellent+gifts+of+grace+appear%2C+so+as+to+take+more+complacency+in+him%2C+and+to+wish+him+the+more+excellent+good%2C+as+the+greater+degree+of+glory%3B+because+the+more+excellent+anything+is%2C+the+nearer+it+comes+to+God%2C+and+if+he+be+better%2C+we+ought+to+wish+him+better.+Thus+spiritual+conjunction+or+nearness+is+to+be+preferred%2C+%E3%80%88%E2%97%8A%E3%80%89+objecti%2C+in+respect+of+the+object.+2.+Ratione+%E3%80%88%E2%97%8A%E3%80%89%2C+%E3%80%88%E2%97%8A%E3%80%89+of+the+%E3%80%88%E2%97%8A%E3%80%89+loving%2C+and+here+natural+and+%E3%80%88%E2%97%8A%E3%80%89+propinquity+or+conjunction+may+be+preferred+before+spiritual%2C+as+founded+in+nature%2C+and+therefore+more+firm+and+immutable%3A+and+hence+it+is+that+in+temporal+things%2C+a+man+may+prefer+one+that+is+nearer+by+nature%2C+before+one+that+is+only+conjoined+with+us+by+grace.+Thus+if+a+man+have+money+or+estate+to+give%3B+he+is+not+bound+to+bestow+it+upon+the+best+man+in+the+world%2C+but+may+prefer+one+that%E2%80%99s+nearer+in+nature%2C+though+not+so+excellent+in+grace.+And+thus+far+de+ordine+%E3%80%88%E2%97%8A%E3%80%89%2C+of+the+order+of+our+love.+The+third+general+proposed+is+the+%E3%80%88%E2%97%8A%E3%80%89+of+this+love%2C+%E3%80%88%E2%97%8A%E2%97%8A%E3%80%89.+%E2%80%98As+thyself%E2%80%99.+This+is+sicut+te%2C+%E2%80%98as+thyself%E2%80%99%3B+not+%E3%80%88%E2%97%8A%E3%80%89+te%2C+as+%E3%80%88%E2%97%8A%E3%80%89+as+thyself%2C+it+signifies+a+respect%2C+but+not+a+quantity.+The+Hebrew+%E3%80%88+Hebrew+%E3%80%89+signifies+not+%E3%80%88%E2%97%8A%E3%80%89+but+%E3%80%88%E2%97%8A%E3%80%89%2C+as+Job+12%3A3%2C+for+as+we+said+before%2C+every+man+ought+to+have+a+greater+regard+to+his+own+soul+than+to+his+brothers.+Now+this+%E3%80%88%E2%97%8A%E3%80%89+or+manner+of+love+must+appear+in+four+things%3A+1.+the+end.+2.+the+means.+3.+the+manner.+4.+the+order.+1.+The+first+in+%E3%80%88%E2%97%8A%E3%80%89+te+%E3%80%88%E2%97%8A%E3%80%89%2C+is+in+respect+of+the+end%2C+for+which+thou+lovest+thyself%2C+or+for+the+same+cause%2C+And+thou+lovest+thyself%2C+because+thou+lovest+God%2C+and+so+consequently%2C+all+%E3%80%88%E2%97%8A%E2%97%8A%E3%80%89+Dei%2C+that+are+Gods%3B+because+thou+thyself+art+aliquid+Dei%2C+%E2%80%98something+of+God%E2%80%99%3B+therefore+thou+lovest+thyself%2C+and+so+consequently+thou+must+love+thy+neighbour+propter+%E3%80%88%E2%97%8A%E3%80%89+for+God%3B+and+%E3%80%88%E2%97%8A%E3%80%89+for+this+cause+thou+lovest+thy+brother%2C+thou+%E3%80%88%E2%97%8A%E3%80%89+him+as+thyself%2C+in+respect+of+the+end.+So+also+and+in+this+%E3%80%88%E2%97%8A%E3%80%89+thou+must+love+thy+brother.+2.+The+second+is+the+%E3%80%88%E2%97%8A%E3%80%89%2C+the+applying+this+love+to+that+end.+And+that+is%2C+that+inasmuch+as+I+love+myself%2C+I+wish+myself+good%2C+and+that+not+in+my+%E3%80%88%E2%97%8A%E3%80%89+but+best+part%2C+which+is+my+reasonable+soul%3A+and+therefore+I+wish+more+especially+the+chiefest+good+of+it%2C+%E3%80%88%E2%97%8A%E3%80%89+bonum+%E3%80%88%E2%97%8A%E2%97%8A%E3%80%89%2C+which+is%2C+eternal+blessedness+and+this+is+it+which+I+must+look+to+in+my+brother.+If+I+love+him+as+myself%2C+I+must+love+him+ad+%E3%80%88%E2%97%8A%E2%97%8A%E3%80%89+partis%2C+for+the+good+of+his+better+part%2C+and+that+is+the+good+of+the+inward+man+%28of+which+the+apostle+speaks%29%2C+whereas+the+most+love+only+the+outward+man%3B+now+the+chiefest+good+of+the+inward+man+consists+in+%E3%80%88%E2%97%8A%E3%80%89+Dei+in+the+sight+and+fruition+of+God.+But+because+none+can+come+to+this+except+the+impediments+be+removed%2C+which+is+sin%3B+Saint+Augustine+%E3%80%88%E2%97%8A%E3%80%89%2C+%E3%80%88%E2%97%8A%E2%97%8A%E3%80%89+diligit+proximum+hoc+cum+%E3%80%88%E2%97%8A%E3%80%89+debet+%E3%80%88%E2%97%8A%E3%80%89%2C+%E3%80%88%E2%97%8A%E2%97%8A%E3%80%89+ipse+%E3%80%88%E2%97%8A%E3%80%89+toto+corde+%E3%80%88%E2%97%8A%E2%97%8A%E3%80%89%2C+%E3%80%88%E2%97%8A%E3%80%89+that+truly+%E3%80%88%E2%97%8A%E3%80%89+his+%E3%80%88%E2%97%8A%E3%80%89%2C+must+work+upon+him+so%2C+%E3%80%88%E2%97%8A%E3%80%89+he+also+love+God+with+all+his+heart.+Take+care+to+remove+his+sins%2C+and+as+for+a+man%E2%80%99s+self%2C+%E3%80%88%E2%97%8A%E3%80%89+his+will+do+%E3%80%88%E2%97%8A%E2%97%8A%E2%97%8A%E3%80%89%2C+%E3%80%88%E2%97%8A%E3%80%89+him+to+some+sin%2C+non+%E3%80%88%E2%97%8A%E2%97%8A%E3%80%89%2C+be+must+%E3%80%88%E2%97%8A%E2%97%8A%E3%80%89%2C+because+it+would+hinder+%E3%80%88%E2%97%8A%E2%97%8A%E3%80%89+the+%E3%80%88%E2%97%8A%E3%80%89+good%2C+so+ought+he+to+love+his+neghbour%2C+as+not+to+consent+to+the+evil+will+of+his+neighbor+in+any+bad+action%2C+because+that+would+hinder+his+chief+good.+The+Scripture+speaks+of+things+not+always+as+they+are%2C+but+as+they+ought+to+be%2C+and+so+requiring+us+to+love+others+as+ourselves%2C+it+is+not+meant+of+ourself+love%2C+%E3%80%88%E2%97%8A%E3%80%89+it+is+corrupt%2C+but+as+we+ought+to+love+ourselves+specimen+naturae+capiendum+ex+optima+natura%2C+a+pattern+in+nature+must+be+taken+from+nature+pure+and+%E3%80%88%E2%97%8A%E3%80%89+in+its+integrity%3B+so+that+a+man+ought+not+to+love+his+neighbor+as+he+does+himself%2C+but+as+he+should+love+himself.+For+saint+Augustine+says%2C+when+I+love+myself%2C+either+I+love+myself+because+I+am+or+should+be+blessed%3A+the+very+same+rule+we+should+observe+in+our+brother%3A+I+must+love+him%2C+aut+quia+est+%E3%80%88%E2%97%8A%E3%80%89+ut+sit%2C+either+because+he+is%2C+or+because+he+should+be+good.+Which+I+cannot+do+unless+I+win+him+ab+impedimentis%2C+from+the+impediments%2C+and+set+him+in+via+in+%E3%80%88%E2%97%8A%E3%80%89+right+way%3A+for+as+saint+Augustine+says%2C+Non+%E3%80%88%E2%97%8A%E3%80%89+proximum+tanquam+seipsum+si+non+ad+id+%E3%80%88%E2%97%8A%E3%80%89+ad+quod+ipse+tendis%2C+adducis.+Thou+lovest+not+thy+neighbor+as+thyself%2C+if+thou+%E3%80%88%E2%97%8A%E3%80%89+him+not+to+that+good%2C+to+which+thou+thyself+tends.+And+he+says+in+another+place%2C+%E3%80%88%E2%97%8A%E3%80%89+est+regula+%E3%80%88%E2%97%8A%E3%80%89%2C+it+is+the+only+rule+of+love%2C+ut+%E3%80%88%E2%97%8A%E3%80%89+sibi+%E3%80%88%E2%97%8A%E3%80%89+bona+pervenire%2C+et+illi+velit%2C+that+he+would+have+the+same+good+come+to+his+neighbor%2C+that+he+wishes+to+himself.+3.+The+third+is+the+manner.+In+loving+anything+that+is+good+there+are+two+motives%3A+First%2C+either+it+is+for+the+sole+and+alone+good+of+him+that+loves+it%2C+or+Secondly%2C+for+the+good+of+the+thing+itself%2C+that+is+loved+he+that+loves+anything%2C+not+for+itself%2C+but+for+himself%2C+does+not+love+it+as+himself%2C+this+is+not+diligere+%E3%80%88%E2%97%8A%E3%80%89+seipsum%2C+but+propter+seipsum%3B+this+is+not%2C+ut+faciat+bonum%2C+sed+ut+potiatur+quis+bono%2C+not+to+seek+his+good+whom+we+love%2C+but+to+make+use+of+what+good+is+in+him+for+ourselves%2C+as+men+love+their+instruments%2C+merely+for+the+use+they+have+of+them+and+not+otherwise%3B+thus+a+man+loves+his+shooing+horn%2C+to+make+use+of+it%2C+to+serve+his+turn+in+the+morning%2C+and+casts+it+away+all+the+day+after%3A+but+our+love+to+our+neighbor+should+be+gratuitus%2C+without+hope+of+recompence%2C+and+that+he+that+we+love+may+have+the+sole+good+by+it.+Otherwise+if+we+love+him+not+as+ourselves%2C+for+no+man+loves+himself%2C+ut+se+potiatur%2C+that+he+may+make+use+of+himself%2C+as+he+loves+meat%2C+drink%2C+etc.+and+therefore+must+he+love+his+neighbor%2C+not+to+make+use+of+him+for+his+own+ends%2C+but+propter+seipsum%2C+for+himself%2C+seeking+and+desiring+his+good.+4.+The+last+is+the+order.+It+is+sicut+teipsum%2C+not+sicut+%E3%80%88%E2%97%8A%E3%80%89%2C+as+ourselves%2C+not+as+we+love+God%3B+we+must+beware+of+loving+Him+so%2C+for+we+must+love+ourselves+infra+Deum%2C+in+a+pitch+below+God%3B+and+by+consequence+we+must+love+our+neighbour+infra+Deum%2C+after+God.+Therefore+we+must+not+%E3%80%88%E2%97%8A%E3%80%89+the+will+of+any+man%2C+be+he+of+never+so+great+excellency%2C+before+the+will+of+God.+God%E2%80%99s+will+must+not+give+place+to+ours.+God+is+not+so+unwise+as+to+bring+in+the+Second+Table+to+overthrow+the+first%2C+but+his+scope+in+it+was%2C+that+it+should+be+a+table+to+direct+and+help+us+in+performing+the+duties+of+the+first.+1.+So+that+if+our+love+to+our+neighbor%2C+in+the+first+place+be+for+God+alone%2C+then+it+is+Sancta+dilectio.+2.+If+it+be+to+bring+him+to+that+end+we+aim+at+our+%E3%80%88%E2%97%8A%E3%80%89%2C+then+it+is+amor+justus%2C+a+just+love.+3.+If+it+be+merely+for+our+neighbors%2C+without+respect+to+ourselves+then+it+is+verus+amor%2C+true+love.+4.+and+lastly+if+we+prefer+the+love+of+God+in+the+first+place+then+it+is+ordinata+dilectio%2C+well+ordered+love.+Now+God+in+both+these+tables+proceeds+further+than+earthly+princes%3B+he+takes+order+for+the+regulating+of+the+heart+and+soul+even+for+restraint+of+concupisence+that+there+be+no+entertainment+of+sin+within+us+and+that+we+conceive+no+delight+in+it.+And+this+is+the+internal+obedience+of+the+Second+Table%2C+to+entertain+no+concupiscence+prejudicial+to+our+neighbour%2C+and+it+is+the+sum+or+substance+of+the+Tenth+Commandment%2C+which+God+has+placed+last%2C+not+first+that+those+two%2C+the+First+Commandment+and+the+Last%2C+the+one+concerning+the+inward+worship+of+God%2C+the+other+the+inward+love+and+duty+to+our+neighbor%2C+might+be+the+bounds+of+his+law.%E2%80%9D%0A%0A%E2%80%94+Lancelot+Andrewes%2C+A+Pattern+of+Catechistical+Doctrine+at+Large%3B+or+a+Learned+%26+Pious+Exposition+of+the+10+Commandments+%28d.+1626%3B+1675%29+5th+Commandment%2C+ch.+1%2C+pp.+314-19&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F31904058e3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/31904058e3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-love-charity/#:~:text=2.%20And%20secondly%2C%20as%20we%20must,be%20the%20bounds%20of%20his%20law&amp;text=2.%20And%20secondly%2C%20as%20we%20must%20do%20no&amp;text=neighbor%2C%20might%20be%20the%20bounds%20of%20his%20law" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

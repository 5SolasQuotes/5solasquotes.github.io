<main class="wrap"><figure class="quote" id="q-91353cdc8a" data-kw="">
<blockquote><p>…the love we feel for Christ our head should flow forth to all our fellow-members of his holy body; and his love to us make them dear to us for his sake… We should delight to meditate on the many members of Christ’s elect body with whom we are joined, though they are scattered throughout the world. Our hearts should make voyages and journeys of discovery after them; and, remembering that they may be in affliction, and must be in temptation, we should pray for them and delight to hold them in the embraces of our faith. Is it not a most pleasant thought, that, from whatever spot on earth a Christian prays, his prayers go up to the one heart of Christ, and there meet with our prayers and the prayers of all other Christians; and so when blessings for each of us are sent, they all flow out from the same fountain of infinite love!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geroge-w-bethune.html">Geroge W. Bethune</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Lectures on the Heidelberg Catechism (NY, 1864/1866), vol. 2</cite>, p. 74</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c4f841cb25" data-kw="">
<blockquote><p>Now this communion consists in the following things, 1st, That having one God and one Savior, and animated by the same Spirit, they constitute one body, whose parts are indeed widely separated from each other with regard to distance of local situation, but maintained in close mutual connection by the same Spirit of Christ. 2ndly, That the souls of the blessed, although they be entirely ignorant of the particular persons of believers on earth, and of their necessities, yet by their earnest prayers unite with us in soliciting, and, so to speak, accelerating, the day of the complete redemption of the Church; whilst the saints on earth are associated with those in heaven, in spirit, affection, and desire, having their conversation in heaven. XLV. But we are chiefly to attend to the communion which believers have with each other on the earth… 1st, That intimate union, by which, how far removed soever as to place, they are mutually joined together by the Spirit; not merely as brethren, but, what we have already often inculcated, as members of one mystical body… That we recognize and celebrate the admirable power of God, which unites believers of every nation, age, condition and sex, often separated from one another by such vast intervening spaces of land and sea, of such disimilar capacities and tempers, and engaged in such diversified pursuits; and so closely conjoins them by one Spirit, that they most harmoniously concur in the same sentiments and feelings respecting God and Christ, and in the same devout prayers and praises, and discern in each other, with mutual congratulation and applause, the same effects of the same divine grace; so that, even at their first meeting, a most delightful interchange of love arises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacred Dissertations on what is Commonly Called the Apostles’ Creed trans. Donald Fraser (1681; Glasgow, 1823), vol. 2, Dissertation 24, ‘On the Church &amp; the Communion of Saints…’</cite>, pp. 380-81</span></figcaption>

</figure><figure class="quote" id="q-761439a811" data-kw="">
<blockquote><p>Also this word ‘communion’ is very evident and comfortable. For first, the meaning thereof is, that betwixt God and us there is a communion, that is, a fellowship and participation, and so, consequently, a parting betwixt us of all good and heavenly things. And then also we understand, that we are fellows and partakers with all the saints that are living either in heaven or on earth: for we are members of them under one head, Christ. For the apostle John says: “That which we have seen and heard we declare unto you, that ye also may have fellowship with us, and that your fellowship may be with the Father, and his Son Jesus Christ… …What can be more delightful to our ears than to hear that all the saints, as well in heaven as in earth, are our brethren, and that we again are members, partners, and fellows with them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Decades</cite>, p. 163</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>

</figure><figure class="quote" id="q-f07d136d95" data-kw="">
<blockquote><p>…when the Creed speaks of the ‘Catholic church,’ meaning true saints, that serve God in truth, it speaks not ‘multitude,’ though it mean ‘universal’. But it speaks, that such are scattered up and down the world; here some in one nation, there some in another; here one in one city, there another in another. II. Therefore, ‘communion of saints’ cannot mean personal or local union, or communion: saints in one place, or in one lump, together: not a college of all saints in one place, but a communion betwixt them, as scattered here and there, all the world over. As there is a communion betwixt two friends, one in Turkey, another in England; one in New England, another in Old [England]… How would you understand that, Mt. 24:31, ‘And he shall send his angels with a great sound of a trumpet, and they shall gather together his elect from the four winds, from one end of heaven to the other.’ By the ‘angels,’ he means his messengers the ministers; by the ‘sound of a trumpet,’ he means the gospel; by the whole he means, that, after the destruction of Jerusalem, of which the speech is in the verses before,–God, by the preaching of the Gospel, would fetch in his elect among all nations, or call home the gentiles. But how gather them together? What, into any one place, or country, or city? No, but into such a communion, as we are speaking of, in the several nations or countries, where they lived: one saint in Judea, another in Assyria, another in Greece: all staying in the place where they receive the gospel, and yet all gathered together into one communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>3. ‘The Communion of Saints’ in An Exposition of Three Articles… (d. 1675)</cite>, pp. 64-65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>

</figure><figure class="quote" id="q-ebc8cf72cc" data-kw="">
<blockquote><p>They sympathize with the condition of all distressed saints, wherever they are, and thereby hold communion with all saints in the world, all Churches of Christ throughout the universe. And from this compassion and love it is, that they feel an ineffable pleasure and satisfaction in their souls whenever they understand and hear of, or behold the success of the family of God, the prosperity of his people, and the spreading of his kingdom in the world. … Those that hold communion with God and his Son Jesus Christ… do necessarily maintain a Communion and Society with those that are the children of God, and the members of Jesus Christ… …When Peter was cast into prison, ‘Prayer was made without ceasing of the Church unto God for him,’ Acts 12:5. There is a continual stock of prayers, a common bank, whereby a constant traffic and exchange is kept up among the saints. This is called by the apostle, ‘supplication for all saints,’ Eph. 6:18, whereby they are ever partaking of the benefit of the petitions and addresses that are put up to the Divine Majesty throughout the whole world. And accordingly the fellowship of all Christians dispersed over the whole earth is preserved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theologia Reformata: or the Body &amp; Substance of the Christian Religion… (London: 1713), ‘The Latter Part of the 9th Article, Namely, the Communion of Saints, where the Nature of this Communion is Explained…’</cite>, pp. 747-48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>
<div class="actions"><button class="copy" data-copy="“They sympathize with the condition of all distressed saints, wherever they are, and thereby hold communion with all saints in the world, all Churches of Christ throughout the universe. And from this compassion and love it is, that they feel an ineffable pleasure and satisfaction in their souls whenever they understand and hear of, or behold the success of the family of God, the prosperity of his people, and the spreading of his kingdom in the world. … Those that hold communion with God and his Son Jesus Christ… do necessarily maintain a Communion and Society with those that are the children of God, and the members of Jesus Christ… …When Peter was cast into prison, ‘Prayer was made without ceasing of the Church unto God for him,’ Acts 12:5. There is a continual stock of prayers, a common bank, whereby a constant traffic and exchange is kept up among the saints. This is called by the apostle, ‘supplication for all saints,’ Eph. 6:18, whereby they are ever partaking of the benefit of the petitions and addresses that are put up to the Divine Majesty throughout the whole world. And accordingly the fellowship of all Christians dispersed over the whole earth is preserved.”

— John Edwards, Theologia Reformata: or the Body &amp; Substance of the Christian Religion… (London: 1713), ‘The Latter Part of the 9th Article, Namely, the Communion of Saints, where the Nature of this Communion is Explained…’, pp. 747-48">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThey+sympathize+with+the+condition+of+all+distressed+saints%2C+wherever+they+are%2C+and+thereby+hold+communion+with+all+saints+in+the+world%2C+all+Churches+of+Christ+throughout+the+universe.+And+from+this+compassion+and+love+it+is%2C+that+they+feel+an+ineffable+pleasure+and+satisfaction+in+their+souls+whenever+they+understand+and+hear+of%2C+or+behold+the+success+of+the+family+of+God%2C+the+prosperity+of+his+people%2C+and+the+spreading+of+his+kingdom+in+the+world.+%E2%80%A6+Those+that+hold+communion+with+God+and+his+Son+Jesus+Christ%E2%80%A6+do+necessarily+maintain+a+Communion+and+Society+with+those+that+are+the+children+of+God%2C+and+the+members+of+Jesus+Christ%E2%80%A6+%E2%80%A6When+Peter+was+cast+into+prison%2C+%E2%80%98Prayer+was+made+without+ceasing+of+the+Church+unto+God+for+him%2C%E2%80%99+Acts+12%3A5.+There+is+a+continual+stock+of+prayers%2C+a+common+bank%2C+whereby+a+constant+traffic+and+exchange+is+kept+up+among+the+saints.+This+is+called+by+the+apostle%2C+%E2%80%98supplication+for+all+saints%2C%E2%80%99+Eph.+6%3A18%2C+whereby+they+are+ever+partaking+of+the+benefit+of+the+petitions+and+addresses+that+are+put+up+to+the+Divine+Majesty+throughout+the+whole+world.+And+accordingly+the+fellowship+of+all+Christians+dispersed+over+the+whole+earth+is+preserved.%E2%80%9D%0A%0A%E2%80%94+John+Edwards%2C+Theologia+Reformata%3A+or+the+Body+%26+Substance+of+the+Christian+Religion%E2%80%A6+%28London%3A+1713%29%2C+%E2%80%98The+Latter+Part+of+the+9th+Article%2C+Namely%2C+the+Communion+of+Saints%2C+where+the+Nature+of+this+Communion+is+Explained%E2%80%A6%E2%80%99%2C+pp.+747-48&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Febc8cf72cc.html&amp;via=5Solas" ta

<main class="wrap"><figure class="quote" id="q-ffe939c855" data-kw="">
<blockquote><p>Q. What are the sins forbidden in the first commandment? A. The sins forbidden in the first commandment, are, Atheism, in denying or not having a God; Idolatry, in having or worshipping more gods than one, or any with or instead of the true God; the not having and avouching him for God, and our God; the omission or neglect of any thing due to him, required in this commandment; ignorance, forgetfulness, misapprehensions, false opinions, unworthy and wicked thoughts of him; … selflove, selfseeking, and all other inordinate and immoderate setting of our mind, will, or affections upon other things, and taking them off from him in whole or in part; … distrust … trusting in lawful means; carnal delights and joys; … ascribing the praise of any good we either are, have, or can do, to fortune, idols, ourselves, or any other creature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Larger Catechism</cite>, Q. 105</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-07640ab15d" data-kw="">
<blockquote><p>Many a one thinks that he has God and everything in abundance when he has money and possessions; he trusts in them and boasts of them with such firmness and assurance as to care for no one. Lo, such a man also has a god, Mammon by name, i.e., money and possessions, on which he sets all his heart, and which is also the most common idol on earth.… So, too, whoever trusts and boasts that he possesses great skill, prudence, power, favor, friendship, and honor has also a god, but not this true and only God.… Therefore I repeat that the chief explanation of this point is that to have a god is to have something in which the heart entirely trusts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Large Catechism</cite>, First Commandment (Mammon and creature-trust)</span></figcaption>

</figure><figure class="quote" id="q-89510b8bf5" data-kw="">
<blockquote><p>So with respect to the Antichrist, it is most appropriate he be traced back to the idolatry of Rome, for he honors and worships the wafer-God of the Mass, who was truly unknown to the Fathers. Indeed, he worships the Angels and the Saints as protectors, helpers, and defenders, honoring them magnificently with gold, silver and precious things, in ornate external displays, and by building immense shrines for their veneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Whether It Can Be Proven the Pope Is the Antichrist</cite>, 7th Disputation, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/antichrist.html">Antichrist</a> › <a href="../topics/the-return-of-christ-antichrist-and-the-millennium/antichrist/the-papacy-as-antichrist.html">The papacy as Antichrist</a></span><span class="t"><a href="../topics/the-lords-supper/the-mass.html">The Mass</a> › <a href="../topics/the-lords-supper/the-mass/adoration-of-the-host.html">Adoration of the host</a></span><span class="t"><a href="../topics/rome/sacraments.html">Rome: Sacraments</a> › <a href="../topics/rome/sacraments/the-mass.html">The mass</a></span></div>
<div class="actions"><button class="copy" data-copy="“So with respect to the Antichrist, it is most appropriate he be traced back to the idolatry of Rome, for he honors and worships the wafer-God of the Mass, who was truly unknown to the Fathers. Indeed, he worships the Angels and the Saints as protectors, helpers, and defenders, honoring them magnificently with gold, silver and precious things, in ornate external displays, and by building immense shrines for their veneration.”

— Francis Turretin, Whether It Can Be Proven the Pope Is the Antichrist, 7th Disputation, p. 59">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSo+with+respect+to+the+Antichrist%2C+it+is+most+appropriate+he+be+traced+back+to+the+idolatry+of+Rome%2C+for+he+honors+and+worships+the+wafer-God+of+the+Mass%2C+who+was+truly+unknown+to+the+Fathers.+Indeed%2C+he+worships+the+Angels+and+the+Saints+as+protectors%2C+helpers%2C+and+defenders%2C+honoring+them+magnificently+with+gold%2C+silver+and+precious+things%2C+in+ornate+external+displays%2C+and+by+building+immense+shrines+for+their+veneration.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Whether+It+Can+Be+Proven+the+Pope+Is+the+Antichrist%2C+7th+Disputation%2C+p.+59&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F89510b8bf5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/89510b8bf5.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-7d61bfb3e3" data-kw="">
<blockquote><p>What is it to have other gods besides the true God? I fear upon search, we have more idolaters among us than we are aware of. (1) To TRUST in anything more than God, is to make it a god. If we trust in our RICHES, we make riches our God.… Money is his creator, redeemer, comforter: his creator, for if he has money, he thinks he is made; his redeemer, for if he is in danger, he trusts to his money to redeem him; his comforter, for if he is sad, money is the golden harp to drive away the evil spirit. Thus by trusting to money, we make it a god.… If we trust in THE ARM OF FLESH, we make it a god.… If we trust in our WISDOM, we make it a god.… If we trust in our MORALITY, we make it a god.… If we trust to our DUTIES to save us, we make them a god.… Use duty—but do not trust to it; for then you make it a god.… If we trust in our GRACE, we make a god of it. Grace is but a creature; if we trust to it we make it an idol.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, First Commandment (trust as heart idolatry)</span></figcaption>

</figure><figure class="quote" id="q-0602870132" data-kw="Mary Queen of Heaven Idolatry">
<blockquote><p>This saying of Christ openly and manifestly warns men to beware lest, by too superstitiously elevating the honor of the name of mother in the Virgin Mary, they transfer to her what belongs exclusively to God. … For Mary has been constituted the Queen of Heaven, the Hope, the Life, and the Salvation of the world; and, in short, their fury and madness proceeded so far that they stripped Christ of his spoils, and left him almost naked.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-aa9fa3eea1" data-kw="">
<blockquote><p>And we must note these three degrees, that the promise was first made to the Jews, and then to their children, and last of all, that it is also to be imparted to the Gentiles. We know the reason why the Jews are preferred before other people; for they are, as it were, the first begotten in God’s family, yea, they were then separated from other people by a singular privilege. Therefore Peter observeth a good order, when he giveth the Jews the pre-eminence. Whereas he adjoineth their children unto them, it dependeth upon the words of the promise: I will be thy God, and the God of thy seed after thee, (Gen. 17:7,) where God doth reckon the children with the fathers in the grace of adoption. This place, therefore, doth abundantly refute the manifest error of the Anabaptists, which will not have infants, which are the children of the faithful, to be baptized, as if they were not members of the Church. They espy a starting hole in the allegorical sense, and they expound it thus, that by children are meant those which are spiritually begotten. But this gross impudency doth nothing help them. It is plain and evident that Peter spake thus because God did adopt one nation peculiarly. And circumcision did declare that the right of adoption was common even unto infants. Therefore, even as God made his covenant with Isaac, being as yet unborn, because he was the seed of Abraham, so Peter teacheth, that all the children of the Jews are contained in the same covenant, because this promise is always in force, I will be the God of your seed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, trans. Henry Beveridge (repr. Bellingham, WA: Logos Bible Software, 2010), 1,122–23.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e4c1b32671" data-kw="">
<blockquote><p>There is no question between us and the Mennonites as to whether the infants of unbelievers, or of those who are outside of the covenant of God, are to be baptized? For to these, both we and they deny baptism. But the question is, whether the infants of those who are in the covenant, or one of whose parents is in the covenant, are to be baptized?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-van-hoeke.html">Peter van Hoeke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lord’s Day 27, Inquiry 74, ‘Whether Infants are to be Baptized Also?’</cite>, p. 310 in Studies in the Palatinate Catechism (Leiden, 1711) See also the first of the three arguments on the same page that he gives to prove the reformed position. As translated in Krauth, p. 33.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<blockquote><p>What is contrary to this Doctrine? … 3. The error of the common people, which in the behalf of the newborn infant say to the pastor of the Church, ‘God hath given me an ethnic, I desire that you would make him a Christian;’ whereas baptism doth not make a Christian, but signifieth a Christian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of the Christian Religion</cite>, trans. Robert Hill (London, 1606), Locus 47, ‘Who are to be Baptized?’, p. 738</span></figcaption>

</figure><figure class="quote" id="q-e56cd54781" data-kw="">
<blockquote><p>First, their ecclesiasticall errors, such as peculiarly concern the doctrine or discipline of the Church are: First, that Christ took not flesh from the Virgin Mary, but that he passed through her as the sun beams do through glass, or rain through a spout. Secondly, that there is no original sin. Thirdly, that children ought not to be baptized. Fourthly, that such as have been baptized in their infancy ought to be re-baptized when they come to years of discretion. Fifthly, that lay-people may preach and administer the sacraments… Sixthly, that men have free will, not only in natural and moral, but also in spiritual actions. Seventhly, that absolution and the church-peace ought to be denied to such who are fallen into any grievous sin; yea, though they repent of it. Eighthly, that Luther’s doctrine is worse than the Pope’s. Secondly, their politicall errors, or in matter of state, are: First, that the people may depose their magistrates and chief rulers… Secondly, that a Christian with a good conscience may not take upon him, or bear the office of a magistrate, or keep any court of justice. Thirdly, that none may administer an oath to another. Fourthly, that no malefactors ought to be put to death. Thirdly, their economical errors [about the family] are: First, that no man has a propriety in his goods, but that all things ought to be held in common. Secondly, that it is lawful to have more wives than one at once. Thirdly, that a man may put away his wife if she differ from him in point of religion, and be not of their sect. … All the errors of the Anabaptists are of two sorts: First, such as they hold in common with other heretics. Secondly, such as are peculiar to their sect. First, concerning the common errors [not mentioned above]… First, with the Millenaries and their joint issue is, that Christ before the day of judgement shall come down from Heaven, and reign with the saints upon earth a thousand years; in which time they shall destroy all the wicked, binding their kings in chains, and their nobles in links of iron. … Thirdly, with the Donatists and their joynt issue is that in the true church there are no scandals, or lewd and vicious livers; that the church of Christ is confined to their sect; that we ought to separate from all assemblies of Christians wherein there are any abuses or scandals, yea, though the church allows them not, but seeks to reform them; that all such as have been baptized by any other than those of their sect, ought to be rebaptized. … Seventhly, with the Enthusiasts and their joint issue is that the Scripture is not our only rule of faith and manners, but that God reveals his will to his children at this day by visions and dreams… … Ninthly, with the Arminians and their joint issue is, that there is no original sin, or at least, that none is damned for it alone; that election is upon foreseen faith and repentance; that God gives all men sufficient grace to be saved; that man has free-will of himself either to accept or refuse God’s grace; that Christ died indifferently for all; that a true beleever, who is in the state of grace, may fall away totally and finally. Tenthly, with the Brownists or Barrowists and their joint issue is, that there ought to be a parity in the church… that in regard of these and such like abuses and corruptions [in ceremonies and governemnt] the church of England is no true Church of Christ, and consequently, that all that have a care of their soules must of necessity separate from her. Eleventhly, with a peculiar sect, called the Separati and their joint issue is, that no Christian may go to law, or in any case to right himself by arms or violent means. Secondly, such [errors] as are peculiar to their sect, and these are six: … Thirdly, that there ought to be no set form of Liturgy or prayer by the book, but only by the Spirit. Fourthly, that there ought to be no distinction by the Word of God between the clery and the laity, but that all who are gifted may preach the Word and administer the sacraments. Fifthly, that it is not lawful to take an oath at all, no, not though it be demanded by the magistrate…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dippers Dipped, or, the Anabaptists Ducked &amp; Plunged</cite>, … (London, 1645), Ch. 2, ‘Of the Errors of the Anabaptists, both common to other sects, and those which are peculiarly their own’, pp. 28-32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

two+sorts%3A+First%2C+such+as+they+hold+in+common+with+other+heretics.+Secondly%2C+such+as+are+peculiar+to+their+sect.+First%2C+concerning+the+common+errors+%5Bnot+mentioned+above%5D%E2%80%A6+First%2C+with+the+Millenaries+and+their+joint+issue+is%2C+that+Christ+before+the+day+of+judgement+shall+come+down+from+Heaven%2C+and+reign+with+the+saints+upon+earth+a+thousand+years%3B+in+which+time+they+shall+destroy+all+the+wicked%2C+binding+their+kings+in+chains%2C+and+their+nobles+in+links+of+iron.+%E2%80%A6+Thirdly%2C+with+the+Donatists+and+their+joynt+issue+is+that+in+the+true+church+there+are+no+scandals%2C+or+lewd+and+vicious+livers%3B+that+the+church+of+Christ+is+confined+to+their+sect%3B+that+we+ought+to+separate+from+all+assemblies+of+Christians+wherein+there+are+any+abuses+or+scandals%2C+yea%2C+though+the+church+allows+them+not%2C+but+seeks+to+reform+them%3B+that+all+such+as+have+been+baptized+by+any+other+than+those+of+their+sect%2C+ought+to+be+rebaptized.+%E2%80%A6+Seventhly%2C+with+the+Enthusiasts+and+their+joint+issue+is+that+the+Scripture+is+not+our+only+rule+of+faith+and+manners%2C+but+that+God+reveals+his+will+to+his+children+at+this+day+by+visions+and+dreams%E2%80%A6+%E2%80%A6+Ninthly%2C+with+the+Arminians+and+their+joint+issue+is%2C+that+there+is+no+original+sin%2C+or+at+least%2C+that+none+is+damned+for+it+alone%3B+that+election+is+upon+foreseen+faith+and+repentance%3B+that+God+gives+all+men+sufficient+grace+to+be+saved%3B+that+man+has+free-will+of+himself+either+to+accept+or+refuse+God%E2%80%99s+grace%3B+that+Christ+died+indifferently+for+all%3B+that+a+true+beleever%2C+who+is+in+the+state+of+grace%2C+may+fall+away+totally+and+finally.+Tenthly%2C+with+the+Brownists+or+Barrowists+and+their+joint+issue+is%2C+that+there+ought+to+be+a+parity+in+the+church%E2%80%A6+that+in+regard+of+these+and+such+like+abuses+and+corruptions+%5Bin+ceremonies+and+governemnt%5D+the+church+of+England+is+no+true+Church+of+Christ%2C+and+consequently%2C+that+all+that+have+a+care+of+their+soules+must+of+necessity+separate+from+her.+Eleventhly%2C+with+a+peculiar+sect%2C+called+the+Separati+and+their+joint+issue+is%2C+that+no+Christian+may+go+to+law%2C+or+in+any+case+to+right+himself+by+arms+or+violent+means.+Secondly%2C+such+%5Berrors%5D+as+are+peculiar+to+their+sect%2C+and+these+are+six%3A+%E2%80%A6+Thirdly%2C+that+there+ought+to+be+no+set+form+of+Liturgy+or+prayer+by+the+book%2C+but+only+by+the+Spirit.+Fourthly%2C+that+there+ought+to+be+no+distinction+by+the+Word+of+God+between+the+clery+and+the+laity%2C+but+that+all+who+are+gifted+may+preach+the+Word+and+administer+the+sacraments.+Fifthly%2C+that+it+is+not+lawful+to+take+an+oath+at+all%2C+no%2C+not+though+it+be+demanded+by+the+magistrate%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Daniel+Featley%2C+The+Dippers+Dipped%2C+or%2C+the+Anabaptists+Ducked+%26+Plunged%E2%80%A6+%28London%2C+1645%29%2C+Ch.+2%2C+%E2%80%98Of+the+Errors+of+the+Anabaptists%2C+both+common+to+other+sects%2C+and+those+which+are+peculiarly+their+own%E2%80%99%2C+pp.+28-32&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe56cd54781.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e56cd54781.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-anabaptism/#:~:text=First%2C%20their%20ecclesiasticall%20errors%2C%20such%20as,it%20be%20demanded%20by%20the%20magistrate&amp;text=First%2C%20their%20ecclesiasticall%20errors%2C%20such%20as%20peculiarly%20concern&amp;text=not%20though%20it%20be%20demanded%20by%20the%20magistrate" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>From all this it follows clearly, that the children of Christian parents are Church-members; and, being Church-members, they have a right to Baptism, which is appointed by Christ to be the standing ordinance for solemn admission into the visible Church. So that, when they are in our Catechism said to be made members of Christ in their Baptism, the meaning only is, that now they are owned and publicly acknowledged to be such, by their solemn admission into the society of Christians. They are Christians nati; born Christians, by the covenant; Christianity is their birthright, and their native privilege.</p></blockquote>

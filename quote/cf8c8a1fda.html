<main class="wrap"><figure class="quote" id="q-cf8c8a1fda" data-kw="">
<blockquote><p>Being is what is called in A[ristotelian]-T[homistic] metaphysics a transcendental, something above every genus, common to all beings and thus not restricted to any category or individual. The other transcendentals are thing, one, something, true, and good, and each is ‘convertible’ with being in the sense that each designates one and the same thing—namely being—under a different aspect. (To put the point in terms made familiar by Frege, the transcendentals differ in sense but not in reference, referring to the same thing under different names just as ‘Superman’ and ‘Clark Kent’ do.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>III. ‘The Transcendentals’ in Neo-Scholastic Essays</cite>, (South Bend, IN: St. Augustine’s Press, 2015), pp. 303-7, pp. 304-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>XIV. Although the philosopher may be allowed to begin with a doubt in order to a safer investigation of natural things, yet this cannot be introduced into subjected of theology and faith. They are founded upon certain and indubitable principles and truths known per se, to doubt concerning which is impious (as concerning the existence of God) unless we wish to strip ourselves of conscience and the moral dependence on the Creator (which cannot be shaken off or for a moment rejected without crime) and thus to introduce philosophical doubt (epochen) into religion and render the whole of theology sceptical.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 1, 1st Topic, Q. 13, ‘Is there any use of Philosophy in Theology? We Affirm’, section 14, pp. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-a11e73fba7" data-kw="">
<blockquote><p>As a result, our faith and theology can be called completely rational, not in that it a priori demonstrates its truth necessarily with arguments in opposition to those who deny the basic assumptions of the Christian religion, but in that it demonstrates its conclusions from the authority of Scripture and with arguments derived from Scripture in opposition to those who accept something [aliquod] of the things that are revealed in a divine manner; and in that it at least refutes the arguments of those who accept nothing of it, namely those arguments by which they charge our faith with contradiction and absurdity, as Thomas [Aquinas] correctly distinguishes in his Summa theologiae, part I, quaestio 1, article 8 [‘Whether Sacred Doctrine is a Matter of Argument’]. Add to this that [reason], by directly attacking false theology, consequently and indirectly defends true theology, that is, by clearing away impediments and prejudices, and so paving the way to the truth. A similar defense of the fatih can be seen in Athenagoras, Justin Martyr, Clement of Alexandria, Origen, Tertullian, Arnobius, Lactantius, Augustine, Theodoret, Cyril of Alexandria, and so forth; in the medieval writers Thomas Against the Pagans and the other scholastics, if one with discretion and discernment takes the more solid excerpts; as well as Savonarola in The Triumph of the Cross; Raymond of Sabunde [d. 1436] in On Natural Theology; Cardinal Cusanus, Dionysius the Carthusian and others who wrote against the Muslims; and finally, more recent writers such as Louis Vives [d. 1540], Agostino Steuco [d. 1548], Charron [d. 1603], the scholastics who treat quaestiones and the commentators on Lombard and Thomas, but especially Du Plessis [Mornay] [1623] in his excellent treatise On the Truth of the Christian Religion. To this list we could add the adversaries of the Socinians whom we have already cited elsewhere [previously in the disputation].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Willem J. van Asselt, Introduction to Reformed Scholasticism</cite>, (RHB, 2011), Appendix 2, ‘The Use of Reason in Matters of Faith’, pp. 229-30</span></figcaption>

</figure><figure class="quote" id="q-439c4aef4d" data-kw="">
<blockquote><p>XIII… And a little later: “As the soul is in the body, so Christians are in the world.” The soul, although dispersed throughout all the members of the body, is nonetheless present in it; likewise, Christians, though they dwell in the world, are not of the world. The invisible soul is established as if in a garrison within the visible body; similarly, Christians are recognized while they sojourn in the world, but their divine worship is invisible. And a little later: Although the soul is enclosed in the body, it still preserves the body; likewise, although Christians are detained in the world as if in custody, they also preserve the world.</p></blockquote>

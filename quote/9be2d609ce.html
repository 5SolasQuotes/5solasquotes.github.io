<blockquote><p>§66… There is a second thing unlawful also, and that is the misdetermining of those same modes and circumstances which he is authorized to determine. For he is (as is said) to do it by God’s General Rule. Here therefore we must thus conclude: 1. That every misordering of such great affairs is the sin of them that do it. 2. But yet that the subject is not exempted from obedience by every such mistake of the governor: but by some, he is. §67. If the mischoosing of such circumstances by Church-governors be but an inconvenience and do not destroy the ordinance itself, or frustrate the ends of it, we are to obey: 1. For he is the judge in his own work, and not we: 2. the thing is not sinful, though inconvenient. 3. Obedience is commanded to our lawful governors… §68. But if a governor so misdetermine but a mode or circumstance as will overthrow the substance and ends of the worship, I would not obey, except some greater evil were likely to follow my not obeying at that particular season than the frustrating of the duty itself would come to. As for example: If a governor make a new sacrament, I will not obey, because his command is null and the thing [is] simply evil. If he miscommand a circumstance of time or place, or gesture, I will consider the consequents. If he command the solemn assemblies to be held a mile or two or three from the people, I will obey him, if it be but as far as I can go without frustrating the work itself. But if he command us all to go ten miles or twenty miles to worship, I would obey for some time to avoid a greater evil, but ordinarily I would no more obey than if he forbade all Christian assemblies, for it comes all to one. So if he command the assemblies to be at break of day or after sun-setting, I would obey. But if he command that we assemble only at midnight, what should I do then? The thing is not simply unlawful: He does but misdo his own work. And therefore for some times I would obey, if it were necessary to avoid a greater evil. But if he make it the ordinary case, I would not obey: because it destroys the worship itself in a manner, as if he simply forbade it, and this he has no power to do. An inconvenient gesture I would use in obedience and to avoid a greater evil: But I would not obey him that would command me to stand on my head always in hearing. An unhandsome vesture I would use in obedience to a lawful governor and to avoid a greater evil: But not so ridiculous a vesture as would set all the people on laughing so as to frustrate the work that we assemble for. §69. In all such cases where governors act not as usurpers in a matter that they have no authority in, but only misdo their own work, it much concerns the subjects to foresee what’s likely to be the consequents of their obeying or disobeying, and accordingly to do that which tends most to the ends of the work: still holding to this rule, that we must obey in all things lawful. §70. And when we do obey in a case of miscommanding, it is not a doing evil that good may come of it, as some do misconceive: But it is only a submitting to that which is ill commanded, but not evil in him that does submit. It is the determiner that is the cause of the inconvenience, and not the obeyer. Nor is it inconvenient for me to obey, though it be worse perhaps to him that commands. While he sins in commanding, he may make it my duty to obey.</p></blockquote>

<blockquote><p>So that before this text [Mal. 1:14, “cursed be the deceiver, which hath in his flock a male, and voweth, and sacrificeth unto the Lord a corrupt thing:”] can be opposed to what has been said, it must be proved: 1. That the things in question are corruptions, as much prohibited as the blind and lame under the Law. 2. That they are such as a person does choose, and it is in his power to help, and offers it when he has a male in his flock. 3. That such a corruption as affects not the substance of worship, does yet alter the nature of it, and makes the whole to be a corrupt thing and abominable to God.</p></blockquote>

</figure><figure class="quote" id="q-95eab27e0c" data-kw="">
<blockquote><p>Verse 5… But David was not the man he had appointed for this work, and therefore though the Lord commended David for this holy intention, as is evident, 1 Kings 8:18, ‘And the Lord said unto David my father, ‘Whereas it was in thine heart to build an house unto my name, thou didst well that it was in thine heart,” and made many gracious promises unto him at this time, vv. 10-12, etc. to testify how well He took it that he had such a purpose in his mind: yet withal He made known to him that He meant not that it should be done by him, but by his son… Verse 6… Though David’s intent was generally in itself good, insomuch that the Lord Himself commended him for it, as is manifest in that place before cited, 1 Kings 8:18, yet it was not without some mixture of error: for herein he failed, because he undertook to do it without any particular direction or warrant from God, led hereto only by the judgment of his own reason, that it was not fit God should dwell within curtains, when He dwelt in an house of cedar; and therefore though the Lord told him that his purpose was in the general commendable, yet withall He rejected his purpose and discovered thereby that he should have waited his leasure and direction, and disproved his reason…</p></blockquote>

— Arthur Jackson, Annotations upon the Remaining Historical Part of the Old Testament... (Cambridge, 1646) Jackson (1593?-1666) was an English clergyman of strong presbyterian and royalist views; he was ejected in the Great Ejection of 1662. | on 2 Sam. 7, p. 361">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVerse+5%E2%80%A6+But+David+was+not+the+man+he+had+appointed+for+this+work%2C+and+therefore+though+the+Lord+commended+David+for+this+holy+intention%2C+as+is+evident%2C+1+Kings+8%3A18%2C+%E2%80%98And+the+Lord+said+unto+David+my+father%2C+%E2%80%98Whereas+it+was+in+thine+heart+to+build+an+house+unto+my+name%2C+thou+didst+well+that+it+was+in+thine+heart%2C%E2%80%9D+and+made+many+gracious+promises+unto+him+at+this+time%2C+vv.+10-12%2C+etc.+to+testify+how+well+He+took+it+that+he+had+such+a+purpose+in+his+mind%3A+yet+withal+He+made+known+to+him+that+He+meant+not+that+it+should+be+done+by+him%2C+but+by+his+son%E2%80%A6+Verse+6%E2%80%A6+Though+David%E2%80%99s+intent+was+generally+in+itself+good%2C+insomuch+that+the+Lord+Himself+commended+him+for+it%2C+as+is+manifest+in+that+place+before+cited%2C+1+Kings+8%3A18%2C+yet+it+was+not+without+some+mixture+of+error%3A+for+herein+he+failed%2C+because+he+undertook+to+do+it+without+any+particular+direction+or+warrant+from+God%2C+led+hereto+only+by+the+judgment+of+his+own+reason%2C+that+it+was+not+fit+God+should+dwell+within+curtains%2C+when+He+dwelt+in+an+house+of+cedar%3B+and+therefore+though+the+Lord+told+him+that+his+purpose+was+in+the+general+commendable%2C+yet+withall+He+rejected+his+purpose+and+discovered+thereby+that+he+should+have+waited+his+leasure+and+direction%2C+and+disproved+his+reason%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Arthur+Jackson%2C+Annotations+upon+the+Remaining+Historical+Part+of+the+Old+Testament...+%28Cambridge%2C+1646%29+Jackson+%281593%3F-1666%29+was+an+English+clergyman+of+strong+presbyterian+and+royalist+views%3B+he+was+ejected+in+the+Great+Ejection+of+1662.+%7C+on+2+Sam.+7%2C+ <blockquote><p>19. Not meddling with ministers subscribing, declaring, swearing, nor with the discipline, by-offices, baptizing as by our sort of godfathers’ covenanting without the parents, crossing and undue application of words at burial and such like, I know nothing in the common [Anglican] Lord’s-Day worship [1661] spoken in the name of the Church which a godly Christian may not join in with the exercise of the spirit of prayer with faith and comfort,¹ if prejudice and false apprehensions of it affright him not or put not his soul out of relish with it. (As on the other side: prejudice distastes many too much with the faulty methods and words of many men’s extemporate prayers.)</p></blockquote>

<main class="wrap"><figure class="quote" id="q-fb6fa0c07c" data-kw="">
<blockquote><p>The obligation which all are under individually, to maintain the honour, and support the worship of God, attaches in an especial manner to nations and those who are in public authority over them. “Let us begin with God,” is a maxim applicable to the formation of civil society and laws, as well as to other important undertakings. Men are not to herd together like a number of cattle, making provision merely for their external protection, accommodation and order, forgetting the God that is above. A constitution which did not recognize religion, nor make any provision for its maintenance and defence, would be, in so far, an atheistical constitution. – As magistracy is an ordinance of God, and those invested with it, though chosen by men, are “the ministers of God,” such persons must be under special obligations to maintain his honour. This they are bound to do, not merely by the preservation of justice and peace, but by promoting his worship in their official station, and by resenting open indignities and contempt offered to the Majesty of heaven, by whom they rule, and decree justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie.html">Thomas M’Crie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On church establishments. Extracts from Statement of the difference between the profession of the Reformed Church of Scotland, as adopted by Seceders; and the profession contained in the New Testimony and other acts, as adopted by the General Associate Synod; particularly on the power of civil magis</cite>, (Glasgow, 1832), p. 9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1c7f1ad299" data-kw="">
<blockquote><p>Magistracy (saith he, p. 135.) is a power ordained of God, an Image of the power and judgement committed to Christ; Scripture and the gift of wisdom, justice and righteousness, are his unction now. Page 138. They are set up more specially to minister peace and judgement to Gods people in the flesh.

Then Nero, the great Turk, the Indian Kings, being ordained of God, Rom. 3.1. as the image of Christ, must be his submediators and under Deputies, little spiritual Kings, and Prophets, and Priests under Christ as Mediator. And who gave the Scriptures, the Law, written Gospel, and such an unction to the Indian Kings? for they are Magistrates. The man cannot speak of Christian Magistrates; for Rom. 13. which he citeth, speaketh of Nero, whose head was dry from all unction of the Gospel, or new Testament.

If the Magistrate be an Image of Christ’s power, and that power committed to him; they may under the Mediator Christ, ministerially judge of the doctrine preached by Ministers, if true or false. And if they be set up to minister justice more specially to God’s people in the flesh; then the people of God in the Spirit, and in all Spirit, as Saltmarsh saith most of them all are, shall be under no Magistrate; but this he saith of all, page 288, 293, 200, 201, 202, &amp;c. And by this every Magistrate must be a Christian of an image of the Mediator’s power; or then no Christian, or spiritual man can be a Magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 1.21, pp 215-16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>§. 44. Direction 5. Make haste away from the occasions of thy sin, and the company which ensnares thee in it. If thou knewest that they were robbers that intended to murder thee, thou wouldst be gone: If thou knewest that they had plague sores running on them thou wouldst be gone: And wilt thou not be gone when thou knowest that they are the servants of the Devil, that would infect thee with sin, and cheat thee of thy salvation? Say not, Is not this company lawful, and that pleasure lawful? etc. If it be like to entice thy heart to sin, it is unlawful to thee, whatever it is to others: It is not lawful to undo thy soul.</p></blockquote>

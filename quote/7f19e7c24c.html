<main class="wrap"><figure class="quote" id="q-7f19e7c24c" data-kw="">
<blockquote><p>You are going to receive your king in communion. And when your king comes into your soul, it must be very tranquil and still. Your thoughts must be marked with the deepest peace. But you were treated most unjustly and you cannot bear to put aside your anger.

Why, then, do you do even greater wrong and more serious harm to yourself? Whatever your enemy may do to you, he will not treat you as badly as you treat yourself if you refuse to be reconciled to him and if you keep trampling underfoot the laws of God.

Did your foe outrage you? Tell me, is that why you outrage God? To refuse to be reconciled to the enemy who has caused you pain is not the act of a man who is taking revenge on his foe. It is the act of a man who is outraging God, who gave us these laws. Therefore, do not look back on the foe who is your fellow servant; do not look back on how deeply he has harmed you.

Rather, put God before your mind and the fear of him which you should feel. Force yourself to be reconciled to the enemy whose countless evil acts have caused you pain. Then, consider that the greater the violence you will endure in your own soul, the greater will be the honour you will enjoy from God, who gave these commandments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Incomprehensible Nature of God</cite>, (c. 386-98), trans. Paul W. Harkins, The Fathers of the Church: A New Translation, Volume 72 (Washington D.C.: The Catholic University of America Press, 1982), 6.39-40, p. 183.</span></figcaption>

<blockquote><p>Truth is the daughter of time, was the saying of old, and our daily experience gives in evidence and proof hereof, to every man’s ordinary observation. Only as in other births, so here, the barrenness and fruitfulness of several ages, depend merely upon God’s good pleasure; who opens and shuts the womb of truth from bearing, as He sees fit, according to the counsel of his own will. Not that there is any change in the truth, but the alteration grows, according to men’s apprehensions, to whom it is more or less discovered, according to God’s most just judgment and their own deservings. Sometimes God makes an eclipse of the truth at midday, that so He might express his wrath from Heaven against the unthankfulness, prophaness and atheism of a malignant world. … Sometimes when men entertain the truth in profession, but not in the love of it and that endeared affection that is due thereunto, the Lord gives men up to the activity of error, as the apostle speaks, because they did not love that the trutb should be truth, they embraced falsehood instead of truth, that so they might be deluded and damned… He that will estrange his affection [to others] because of the difference of apprehension in things difficult, he must be a stranger to himself one time or other. If men would be tender and careful to keep off offensive expressions, they might keep some distance in opinion, in some things, without hazard to truth or love. But when men set up their sheaves (though it be but in a dream, as Joseph’s was) and fall out with every one that will not fall down and adore them, they will bring much trouble into the world, but little advantage to the truth or peace. Again, the Reader must know for his direction in this inquiry, my aim only was, and is, to lay down, and that briefly, the grounds of our practice, according to that measure of light I have received, and to give answer to such reasons which might seem to weaken the evidence thereof: declining purposely, for the present, the examination of such answers which are made to the arguments alledged by some of our reverend Brethren touching the same subject: because I would neither prejudice nor prevent their proper defense, which I do suppose in the fittest season they will so present unto the world as shall be fully satisfactory to such as love and desire the knowledge of the truth. The sum is, we doubt not what we practise, but it’s beyond all doubt that all men are liars and we are in the number of those poor feeble men; either we do, or may err, though we do not know it; what we have learned we do profess and yet profess still to live that we may learn. And therefore the errand upon which this present discourse is sent, is summarily to show these two things unto the world:

1. That there must be more said (than yet it has been my happiness to see) before the principles we profess will be shaken, and consequently it cannot be expected, that we should be unsetled in our practice.

2. That I might occasion men eminently gifted to make further search, and to dig deeper, that if there be any vein of reason which lies yet lower, it might be brought to light, and we profess and promise, not only a ready ear to hear it, but a heart willing to welcome it. It’s the perfection of a man, amidst these many weaknesses we are surrounded withal, by many changes to come to perfection. It’s the honour and conquest of a man truly wise to be conquered by the truth: and he has attained the greatest liberty that suffers himself to be led captive thereby. … In the handling of all these particulars, so full of difficulty and obscurity, I am not such a stranger at home, but that I am easily sensible of the weight of the matter and mine own weakness: and therefore I can professe in a word of truth that against mine own inclination and affection I was haled by importunity to this so hard a task, to kindle my rush candle, to join with the light of others, at least to occasion them to set up their lamps. Now He that is the way, the truth, and the life, pave out all the ways of his people and make their paths plain before them: Lead us all into that truth which will lead us unto eternall life: bring us once unto that impotency and impossibility that we can do nothing against the truth, but for it, that so our congregations may not only be styled as Ezekiel’s temple, but be really what was prophesied the Churches should be in these last days, Jehovah Shammah [the Lord is There]. In the arms of his everlasting mercy I leave thee…</p></blockquote>

<blockquote><p>§1. Question 1: Must I always do as I would be done by? Or has this rule any exceptions? Answer: The rule intends no more but that your just self-denial and love to others be duly exercised in your dealings with all. And:

1. It supposes that your own will or desires be honest and just, and that God’s Law be their rule. For a sinful will may not be made the rule of your own actions or of other men’s. He that would have another make him drunk, may not therefore make another drunk: And he that would abuse another man’s wife, may not therefore desire that another man would lust after or abuse his wife. He that would not be instructed, reproved or reformed, may not therefore forbear the instructing or reproving others. And he that would kill himself, may not therefore kill another. But he that would have no hurt done to himself injuriously should do none to others: And he that would have others do him good, should be as willing to do good to them.

2. It supposes that the matter be to be varied according to your various conditions. A parent that justly desires his child to obey him, is not bound therefore to obey his child; nor the prince to obey his subjects; nor the master to do all the work for his servants, which he would have his servants do for him. But you must deal by another as you would (regularly) have them deal by you, if you were in their case, and they in yours. And on these terms it is a rule of righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, (London, 1673), pt. 4, ch. 19, title 2, p. 114</span></figcaption>

1. It supposes that your own will or desires be honest and just, and that God’s Law be their rule. For a sinful will may not be made the rule of your own actions or of other men’s. He that would have another make him drunk, may not therefore make another drunk: And he that would abuse another man’s wife, may not therefore desire that another man would lust after or abuse his wife. He that would not be instructed, reproved or reformed, may not therefore forbear the instructing or reproving others. And he that would kill himself, may not therefore kill another. But he that would have no hurt done to himself injuriously should do none to others: And he that would have others do him good, should be as willing to do good to them.

r">Share on X</a><a class="perma" href="../quote/1f1a3318c8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-love-righteousness-toward-our-neighbor/#:~:text=1.%20Question%201%3A%20Must%20I%20always,it%20is%20a%20rule%20of%20righteousness&amp;text=1.%20Question%201%3A%20Must%20I%20always%20do%20as&amp;text=these%20terms%20it%20is%20a%20rule%20of%20righteousness" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>A sentiment that it matters not what a man believes, so that he is sincere, is as unscriptural as it is absurd. Sincerity of belief has no more effect in warding off evil in the spiritual, than in the natural kingdom.

If the teachings and persuasions of a reputed chemist should prevail on you “to believe” that arsenic is harmless, would it therefore be harmless? Could you mix it with your bread, and you or your children eat it without injury to health and life? Oh, no!

Neither will the sincerity of your belief save you from the consequence of error in religious faith. Right belief, truth, God’s truth, my brethren, is the only foundation on which you can safely rest your hopes. But true belief is not a mere act of the understanding, it involves exercises of the heart; the emotions are purified, and love pervades the soul.</p></blockquote>

<blockquote><p>…the duels which have been fought between princes, which have determined their quarrels by the monomachy of man to man. The crown of England was sometimes in that sort disputed, between Edmund Iron-side, and Canute the Dane: Edward III offered as much to the king of France; the French king to the Emperor Charles V; and Henry the Great, father of our most illustrious queen, made offer to the Duke of Guise his competitor to put a period to their difference by point of spear, his person against his, six against six, or hundred against hundred. I will not say that it is lawful to a prince so to hazard the head of the commonwealth, and in his person, all the body of his estate, but when this way is permitted them, it is, because sovereign princes have not any judge above them who can do them right, so that to obtain reason from their hands who are elevated to as high a pitch of dignity as themselves, there is not any other way but by arms; and these their doings have an outward show of charity: for a prince will say, that he likes better to expose his own person to danger than to see a bloody war that should swallow up many thousands of men and give occasion of an infinite slaughter. And it may be that some people desirous to avoid a general conflict of nation against nation, have sometimes remitted their quarrel to a certain number of men, to be chosen by either side by them to be decided by combat. So three hundred Lacedemonians fought against a like number of the Argiens; three Romans against three Latins; and when David and Ishboseth stood competitors for the royalty, the two generals Joab and Abner caused a combat between twelve soldiers of the tribe of Judah against twelve of the tribe of Beniamin [2 Sam. 2:12-17]. This kind of duel is as it were an abridgement of the war, and yet not very justifiable. There is more appearance in this case than in any of the cases aforementioned: Two armies are ready to fight, he that has the right on his side finds himself inferior in forces, so that if they come to handy-strokes we must all die of necessity: The enemy makes an offer of a single fight, one to one, and offers to stand to the event of this duel; why should we all perish and not rather make legal of this way and expedient, which perchance may give us the victory, or at least will save six thousand men’s lives, and there can but one be slain? But this example has no correspondence with the [private] duel, whereof we now treat, and one may not draw into consequence particular actions which are exploited in war or in the consequence of war, especially in heat of battle…</p></blockquote>

<blockquote><p>[T]here are some stupid preachers among us Germans (as I am sorry to hear) who are making the people believe that we ought not and must not fight against the Turks. Some are even so foolish as to say that it is not proper for Christians to bear the temporal sword or to be rulers. Furthermore, some actually want the Turk to come and rule because they think our German people are wild and uncivilized – indeed, that they are half-devil and half-man. …

Moreover, I hear it said that in Germany there are those who desire the coming of the Turk and his government because they would rather be under him than under the emperor or princes. It would be hard to fight against the Turk with such people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On War Against the Turk</cite>, trans. Charles M. Jacobs (1528) in Luther’s Works, 46: 161, 193.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-441de85a57" data-kw="">
<blockquote><p>The visible Church under the Old Testament, the charter of which was God’s covenant with Abraham, is likened by the Apostle Paul to a stately, wide-spreading olive tree. [Rom. 11] The race of Israel, incorporated in the Church, were the natural branches; converted Gentiles are the branches grafted in; and when Israel shall turn to the Lord, the natural branches shall be again restored; and the one goodly olive tree, verdant and beautiful, shall overspread all lands, and shall embrace, under its shadow, the people of all nations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Treatise on Christian Baptism</cite>, (1853) in Works: Doctrinal and Practical of the Rev. Thomas Houston, D.D., Knockbracken (4 vols, Edinburgh, 1876), iii, 39-40.</span></figcaption>

</figure><figure class="quote" id="q-dff893c0ef" data-kw="">
<blockquote><p>To stir up every one to help forward this glorious work of the Jews’ conversion; they were sometimes the chief, and the first born; though now their dignity is gone, and they are as prisoners in the pit; help we to restore them to their former liberty, lift them out of the pit into which they are fallen; If it were but our enemies beast, we were bound to help it out, how much more these that have been the people of God, and have such promises made unto them?

What shall we do to help forward their calling and conversion?

Take away (as much as in us lies) the stumbling block, which hinders their coming in; and these blocks are two; First, The one is the Idolatry of Christian Churches, especially that of Rome, whiles we do anything to uphold these Idolatries, we doe put the stumbling block before them, to hinder them; but take away these stones and blocks which they stumble at, and then their way will be more easy and plain. Secondly, The other is the carnalness and licentiousness of the lives of Christians, this is a great stumbling block unto them; remove this from before them, let them see a spirit of grace shining upon us, and appearing in our lives: and then we shall make plain the way of the Lord for them to return to Sion, see Esay 57.14.

Intreat the Lord for them, that he would visit them in due time, be we their remembrancers before the Lord; they have long lain in the dungeon, as Esa. 42.22. and been made a prey of, and there hath been none to say, restore, let us therefore speak unto God in their behalf, and say, Lord restore thy ancient people, bring them back to the fellowship of thy Church; take to you the words of Micah, Chap. 7.14. Feed thy people with thy rod, and the flock of thine inheritance in the midst of Carmel; let them feed in Bashan and Gilead, as in old time; commend their estate unto God, and the rather should we do this, Because

1. They prayed for us when we were no people, that we might be the people of God, Psal. 67.1, 2. When the salvation of God was revealed to them, they prayed that it might be revealed unto us; We have a little sister (said they) Cant. 8.8. They took thought for us, we being then that little sister, and so let us do for them.

2. It is from them that the means of salvation is come to us, the Law is called their Law, Joh. 10.34. It was given as an inheritance to the children of Israel, Deut. 33.4. And the spiritual things of the Gospel, are called their spiritual things, Rom. 15.27. And thence is that in Esa. 2.3. The Law shall go forth of Sion, and the word of the Lord from Jerusalem: yea, and of them came Christ concerning the flesh, Rom. 9. All the means of grace and salvation, are theirs first, and from them they come unto us; and thence it is that Christ himself tells us, That salvation is of the Jews, Joh. 4.22. We owe them this therefore, as a requital unto them.

3. Consider a further good that shall come unto ourselves by their calling unto Christ, there shall be an increase of blessing coming to ourselves. Great light shall be manifested, and knowledge shall increase, Esa. 24. ult. The light of the Sun, and of the Moon shall be darkened, by the light which shall come from that Church, the light of the Jewish Church which was but as the light of the Moon, and the light of the Gentile Churches, which is as the Sun, shall both be dim in comparison of the light which shall be in that Church, when the glory of the Lord is risen upon them. See Esa. 60.1.2. which speaks of the estate of the Jewish Church after their calling, as appears by that which goes before, Chap. 59. end. Many of those dark Prophecies, which now lie hid in obscurity, shall then be brought to light; the accomplishment of them will then give us the interpretation.

4. Admit we neither had received benefit from them hitherto, nor could expect any further blessing hereafter, yet consider the glory which shall then come to Christ by their coming in, the glory of his kingdom shall be enlarged, Jerusalem shall be a throne of glory to him, Jer. 3.17. then shall the Lord be glorified in them, all the house of Israel shall glory in the Lord, Esa. 45.25. and shall draw others of the Gentiles unto them.

5. If there were neither good to ourselves, nor glory to Christ by their calling, yet even pity and compassion should move us; consider who they are, even the children of Abraham our father, and Sarah our mother; they are our brethren, and our flesh; and how should it pity us to see the children of our father in the dungeon, and prison-pit? Oh pray for them, that the blessing of Abraham their father may come upon them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-bulkeley.html">Peter Bulkeley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The gospel-covenant; or The covenant of grace opened</cite>, (London: Benjamin Allen, 1646), pp 19-21.</span></figcaption>

</figure><figure class="quote" id="q-6af5fa0590" data-kw="">
<blockquote><p>In the religion of the Mahumetans I find much good, viz. a confession of one only God, and most of the natural parts of religion; a vehement opposition to all idolatry; a testimony to the veracity of Moses, and of Christ; that Christ is the Word of God, and a great prophet, and the writings of the apostles true: All this therefore where Christianity is approved, must be embraced. And there is no doubt but God has made use of Mahumet as a great scourge to the idolaters of the world; as well as to the Christians who had abused their sacred privileges and blessings: Wherever his religion does prevail, he casts down images, and fills men’s minds with a hatred of idols, and all conceit of multitude of Gods, and brings men to worship one God alone, and does that by the sword in this, which the preaching of the Gospel had not done in many obstinate nations of idolaters.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“In the religion of the Mahumetans I find much good, viz. a confession of one only God, and most of the natural parts of religion; a vehement opposition to all idolatry; a testimony to the veracity of Moses, and of Christ; that Christ is the Word of God, and a great prophet, and the writings of the apostles true: All this therefore where Christianity is approved, must be embraced. And there is no doubt but God has made use of Mahumet as a great scourge to the idolaters of the world; as well as to the Christians who had abused their sacred privileges and blessings: Wherever his religion does prevail, he casts down images, and fills men’s minds with a hatred of idols, and all conceit of multitude of Gods, and brings men to worship one God alone, and does that by the sword in this, which the preaching of the Gospel had not done in many obstinate nations of idolaters.”

<blockquote><p>The law of Mahomet claimed to be a revelation from Heaven, and though, in accordance with its pretensions, it demanded faith, yet, as it presented no rational grounds of conviction, its policy was to intimidate or bribe the understanding, according as fear, prejudice, or lust was the predominant principle of action.

Where it could not extort a blind credulity, it made the passions the vehicles of its doctrines—the timid it frightened to submission, the profligate it allured to acquiescence, and the heretic and skeptic it wheedled and cajoled by a partial patronage of their errors. Exclusively a system of authority, it gave no scope to discussion. Its great argument was the word of its Prophet, its decisive sanction the sword of its soldiers, and its strongest attractions, the licence it gave to voluptuous indulgences. Paganism wore the “face of error, and Mohammedanism of imposture.” [Lord Bacon]

Christianity, on the contrary, attaches preeminent importance to truth, and acknowledges no faith but that which is founded in conviction. At the same time it professes to be from God, and therefore, as becomes it, speaks with authority. As a system claiming to be Divine, it invites the fullest discussion. As a system proved to be Divine, it demands implicit submission.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a51d317f19" data-kw="">
<blockquote><p>For we are said to be capable of many things which it is much better not to have been capable of than to be capable of. We are to able to decline, we are able to die, we are able to be destroyed and to return to nothingness. Concerning whatever is of this kind, it is entirely greater not to be able [to do] each of these than to be able [to do them]. For these are indicators of infirmity rather than signs of majesty.

And so God can do all those things, and certainly only those, whose capacity is some potency, as we have already said. And therefore we call him omnipotent the more correctly and rightly by withdrawing from his potency all arguments of infirmity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-of-saint-victor.html">Richard of Saint Victor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Trinitate:</cite>, On the Trinity, trans. Jonathan Couser (c. 1162-73; n.p., 1999), I.XXI.</span></figcaption>

</figure><figure class="quote" id="q-a88ab6465b" data-kw="">
<blockquote><p>The words: ‘No man can come to Me, except the Father which has sent Me draw him,’ [John 6:44] present only the converse aspect of those [words spoken] to the disciples: ‘All that which the Father gives Me shall come to Me, and him that comes to Me I will in no wise cast out.’ For, far from being a judgment on, it would have been an excuse of, Jewish unbelief, and, indeed, entirely discordant with all Christ’s teaching, if the inability to come were regarded as other than personal and moral, springing from man’s ignorance and opposition to spiritual things. No man can come to the Christ—such is the condition of the human mind and heart, that coming to Christ as a disciple is, not an outward, but an inward, not a physical, but a moral impossibility—except the Father ‘draw him’. And this, again, not in the sense of any constraint, but in that of the personal, moral, loving influence and revelation, to which Christ afterwards refers when He says: ‘And I, if I be lifted up from the earth, will draw all men unto Myself’ (John 12:32).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alfred-edersheim.html">Alfred Edersheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Life &amp; Times of Jesus the Messiah, Complete &amp; Unabridged in One Volume</cite>, (Hendrickson, 1993), Book 3, Chapter 32, p. 497</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

n%20come,all%20men%20unto%20Myself%E2%80%99%20%28John%2012%3A32&amp;text=The%20words%3A%20%E2%80%98No%20man%20can%20come%20to%20Me&amp;text=will%20draw%20all%20men%20unto%20Myself%E2%80%99%20%28John%2012%3A32" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>However, God’s activity differs from an artisan’s activity in two ways. The first way is on the part of the matter. For since an artisan does not produce matter but rather works with a given matter, he does not confer on the matter the potency to receive the forms that he introduces to the matter, nor can he put this into the matter. But God, who is the author of the entire thing, conferred not only natural forms and powers on things but also the potency for receiving that which he would make in the matter. The second way is on the part of the form, because the forms that the artisan introduces do not reproduce themselves; for a couch that putrefies does not sprout into a couch but into a plant, as is clear from the Physics 1. But natural forms [of living things] can reproduce themselves. Thus, they have the property of a seed and are called ‘seedlike.’ Now, the forms of things as existing in the divine art are called ‘primordial’ because they are, simply speaking, the first principles of things to be produced. The potency that has been implanted in things for receiving into themselves that which the will of God decrees is called ‘obediential principles’ by some, based on which matter has the ability to become what God wills it to be. Finally, the actual powers placed in matter, which give rise to natural effects, are called ‘seedlike principles.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, distinction 18, Creation of Woman, quest. 1, art. 2, I answer that, bk. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<main class="wrap"><figure class="quote" id="q-a01a06ae7a" data-kw="">
<blockquote><p>The date of its publication is almost all that has been ascertained in regard to the circumstances in which this “Peace-offering” appeared. We are inclined to attach to it considerable value; and of all the writings of Owen in defence of Nonconformity, in the trying and critical period of its history when this tract was published (1667), there is none in which the case of the Nonconformists is more simply and conclusively argued, or more likely to produce a greater effect on the modern reader. Very earnest in its tone, and yet very moderate in its language,—calm, and yet most impressive in the appeal which it contains,—it affords a pleasing illustration alike of the meekness of wisdom and the wisdom of meekness.

It seems impossible to read it without a mingled feeling of regret and indignation that there ever should have been a time when men breathing the spirit which our author here breathes should have been denied religious freedom and the rights of conscience on the soil of Britain. The chief fault of the tract is its very moderation, as “a humble plea,”—for an “indulgence,” too, in the exercise of those rights which no government is either able to confer or entitled to withhold, and the protection of which is one of the highest ends of government.</p></blockquote>

</figure><figure class="quote" id="q-79b6badac1" data-kw="">
<blockquote><p>If someone asks how can men daily repeat the same form of words, as they do in the reading of public prayer, without being cold and so abominable to God, I answer that it is not frequently praying for the same things that is odious to God, but when this is done with an irreverent, unprepared, and corrupt heart – when it is done for custom, rather than fervently and in faith.

For do not the best people pray daily for faith, meekness, humility, peace, and such things (seeing we have daily need of them), and yet without weariness? To further satisfy them, they may know that in all churches, even the best reformed churches, there is a prescribed form of prayer used. Therefore, those who are of the mind that this should not be must separate themselves from all churches. Furthermore, if a set form of prayer were unlawful, then even the Lord’s Prayer (which is a set form of prayer prescribed by our Saviour Himself) should not be used.</p></blockquote>

<blockquote><p>Donald Cargill’s theonomic views of the judicial law are further explicated in the Queensferry Paper of 1680, a document which was owned by many of the covenanting martyrs in their dying testimonies (for more on this see A cloud of witnesses for the royal prerogatives of Jesus Christ ). The teachings of the Queensferry Paper are thus part of the covenanted testimony for which the martyrs laid down their lives. Any divergence from its view of biblical penology, therefore, represents a serious departure from Covenanter principles.

In the third article of the Queensferry Paper, the adherents, in accordance with the National Covenant (1638) and Solemn League and Covenant (1643), bound themselves to extirpate gross sins and crimes against the first table of the law:

That we shall endeavour to our utmost, the extirpation of the kingdom of Darkness, and whatsoever is contrary to the kingdom of Christ, and especially Idolatry, and Popery in all the Articles of it, as we are bound in our National Covenant; and Superstition, Will-Worship, and Prelacy, with its Hierarchy, as we are bound in our Solemn League and Covenant; And that we shall with the same sincerity, endeavour (God giving us assistance) the overthrow of that Power that hath established that Prelacy and Erastianism over the Church, and exercises such a lustful and arbitrary Tyranny over the Subjects, seeking again to introduce Idolatry and Superstition in these Lands, contrary to our Covenants: And in a word, that we shall endeavour the extirpation of all the works of Darkness, and the Relics of Idolatry and Superstition, (which are both much enlarged and revived in our times,) and execute righteous judgment impartially (according to the word of God, and degree of offences) upon committers of those things, especially, to wit, the blasphemy, idolatry, atheism, sorcery, perjury, uncleanness, profanation of the Lord’s day, oppression, and malignancy, that thus being zealous of God’s glory, he may delight to dwell in the midst of us. [1]

What is important about this extract, for our present purposes, is that it demonstrates to us that the strictest Covenanters believed that the civil magistrate was to execute righteous judgment by punishing a multiplicity of crimes in accordance with biblical law – a central tenet of theonomy. Since many of the crimes listed above were punished in scripture with the death sentence, it is stretching credulity to think that Cargill would have consented to the modern notion that capital punishment only applies to murder.

Cargill also complained about the covenant-breaking regime in Scotland not upholding biblical jurisprudence:

So that it can no more be called a Government, but a lustful Rage, exercised with as little right reason, and with more cruelty then in Beasts, and they themselves can be no more called Governors, but publick Grassators, and publick Judgments, which all Men ought as earnestly to labour to be free of, as of Sword, Famine, or Pestilence raging amongst us; and besides, hath stopped (instead of punishing) the course of Law and Justice against Idolaters, Blasphemers, Atheists, Murderers, Incestuous and Adulterous, and other Malefactors; and instead of rewarding the Good, hath made Butcheries and Murthers on the Lords People, sold them as Slaves, Imprisoned, Forfaulted, Banished and Fined them, upon no other account, but for maintaining the Lords Right to rule Consciences, against the usurpations of Men, for fulfilling their Vows, and repelling unjust Violence, which innocent Nature allows to all; of which, and more particulars, we can give (we speak as before God) innumerable and sure instances …[2]

Obviously, he could not have said this if he had believed that the Mosaic judicials had been entirely set aside or that capital punishment was to be reserved for the single crime of murder. Instead, Cargill taught the magistrates of covenanted Scotland were to govern in accordance with biblical civil law:

Moreover, we declare that these Men whom we shall set over us, shall be engaged to govern us principally by that Civil or Judicial Law, given by God to His People of Israel, especially in matters of Life and Death, and in all other things also, so far as they teach, excepting only that Law, (viz. anent Slaves,) which does not agree with that Christian Liberty established in all Christendom (only violated by our Tyrants, and some others of late,) [obviously he is not saying that the Old Testament authorised chattel slavery, based on manstealing] and that of Divorces and Polygamy; the one being not a Law, but a permission granted upon the account of the hardness of their Hearts, the other being a sinful custom contrary to the first institution of Marriage, crept into the Church …[3]

Cargill avoids the extremist opinion that the entire judicial law of Moses remains binding, recognising that specifically Jewish laws have expired. Laws such as those permitting the heathen to be used by Israelites as unpaid bondservants were deemed to be incongruous with the inclusion of the Gentiles into the New Testament church (Colossians 4:1 teaches that servants are to be paid wages, which is not consistent even with voluntary bondservice). Nevertheless, Cargill does recognise that the parts of the judicial law which are also part of the moral law, especially those dealing with crime and punishment, are to be followed by the Christian magistrate.

[1] A true and exact copy of a treasonable and bloody-paper called, the fanticks new-covenant: which was taken from Mr. Donald Cargill at Queens-Ferry, the third day of June, 1680 (Edinburgh, 1680), p. 4.

[2] Ibid., p, 5. The reference to slavery reveals that the early Covenanters, in common with their later heirs, condemned chattel slavery as a form of manstealing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/donald-cargill.html">Donald Cargill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ibid.</cite>, pp 6-7</span></figcaption>

— Donald Cargill, Ibid., pp 6-7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDonald+Cargill%E2%80%99s+theonomic+views+of+the+judicial+law+are+further+explicated+in+the+Queensferry+Paper+of+1680%2C+a+document+which+was+owned+by+many+of+the+covenanting+martyrs+in+their+dying+testimonies+%28for+more+on+this+see+A+cloud+of+witnesses+for+the+royal+prerogatives+of+Jesus+Christ+%29.+The+teachings+of+the+Queensferry+Paper+are+thus+part+of+the+covenanted+testimony+for+which+the+martyrs+laid+down+their+lives.+Any+divergence+from+its+view+of+biblical+penology%2C+therefore%2C+represents+a+serious+departure+from+Covenanter+principles.%0A%0AIn+the+third+article+of+the+Queensferry+Paper%2C+the+adherents%2C+in+accordance+with+the+National+Covenant+%281638%29+and+Solemn+League+and+Covenant+%281643%29%2C+bound+themselves+to+extirpate+gross+sins+and+crimes+against+the+first+table+of+the+law%3A%0A%0AThat+we+shall+endeavour+to+our+utmost%2C+the+extirpation+of+the+kingdom+of+Darkness%2C+and+whatsoever+is+contrary+to+the+kingdom+of+Christ%2C+and+especially+Idolatry%2C+and+Popery+in+all+the+Articles+of+it%2C+as+we+are+bound+in+our+National+Covenant%3B+and+Superstition%2C+Will-Worship%2C+and+Prelacy%2C+with+its+Hierarchy%2C+as+we+are+bound+in+our+Solemn+League+and+Covenant%3B+And+that+we+shall+with+the+same+sincerity%2C+endeavour+%28God+giving+us+assistance%29+the+overthrow+of+that+Power+that+hath+established+that+Prelacy+and+Erastianism+over+the+Church%2C+and+exercises+such+a+lustful+and+arbitrary+Tyranny+over+the+Subjects%2C+seeking+again+to+introduce+Idolatry+and+Superstition+in+these+Lands%2C+contrary+to+our+Covenants%3A+And+in+a+word%2C+that+we+shall+endeavour+the+extirpation+of+all+the+works+of+Darkness%2C+and+the+Relics+of+Idolatry+and+Superstition%2C+%28which+are+both+much+enlarged+and+revived+in+our+times%2C%29+and+execute+righteous+judgment+impartially+%28according+to+the+word+of+God%2C+and+degree+of+offences%29+upon+committers+of+those+things%2C+especially%2C+to+wit%2C+the+blasphemy%2C+idolatry%2C+atheism%2C+sorcery%2C+perjury%2C+uncleanness%2C+profanation+of+the+Lord%E2%80%99s+day%2C+oppression%2C+and+malignancy%2C+that+thus+being+zealous+of+God%E2%80%99s+glory%2C+he+may+delight+to+dwell+in+the+midst+of+us.+%5B1%5D%0A%0AWhat+is+important+about+this+extract%2C+for+our+present+purposes%2C+is+that+it+demonstrates+to+us+that+the+strictest+Covenanters+believed+that+the+civil+magistrate+was+to+execute+righteous+judgment+by+punishing+a+multiplicity+of+crimes+in+accordance+with+biblical+law+%E2%80%93+a+central+tenet+of+theonomy.+Since+many+of+the+crimes+listed+above+were+punished+in+scripture+with+the+death+sentence%2C+it+is+stretching+credulity+to+think+that+Cargill+would+have+consented+to+the+modern+notion+that+capital+punishment+only+applies+to+murder.%0A%0ACargill+also+complained+about+the+covenant-breaking+regime+in+Scotland+not+upholding+biblical+jurisprudence%3A%0A%0ASo+that+it+can+no+more+be+called+a+Government%2C+but+a+lustful+Rage%2C+exercised+with+as+little+right+reason%2C+and+with+more+cruelty+then+in+Beasts%2C+and+they+themselves+can+be+no+more+called+Governors%2C+but+publick+Grassators%2C+and+publick+Judgments%2C+which+all+Men+ought+as+earnestly+to+labour+to+be+free+of%2C+as+of+Sword%2C+Famine%2C+or+Pestilence+raging+amongst+us%3B+and+besides%2C+hath+stopped+%28instead+of+punishing%29+the+course+of+Law+and+Justice+against+Idolaters%2C+Blasphemers%2C+Atheists%2C+Murderers%2C+Incestuous+and+Adulterous%2C+and+other+Malefactors%3B+and+instead+of+rewarding+the+Good%2C+hath+made+Butcheries+and+Murthers+on+the+Lords+People%2C+sold+them+as+Slaves%2C+Imprisoned%2C+Forfaulted%2C+Banished+and+Fined+them%2C+upon+no+other+account%2C+but+for+maintaining+the+Lords+Right+to+rule+Consciences%2C+against+the+usurpations+of+Men%2C+for+fulfilling+their+Vows%2C+and+repelling+unjust+Violence%2C+which+innocent+Nature+allows+to+all%3B+of+which%2C+and+more+particulars%2C+we+can+give+%28we+speak+as+before+God%29+innumerable+and+sure+instances+%E2%80%A6%5B2%5D%0A%0AObviously%2C+he+could+not+have+said+this+if+he+had+believed+that+the+Mosaic+judicials+had+been+entirely+set+aside+or+that+capital+punishment+was+to+be+reserved+for+the+single+crime+of+murder.+Instead%2C+Cargill+taught+the+magistrates+of+covenanted+Scotland+were+to+govern+in+accordance+with+biblical+civil+law%3A%0A%0AMoreover%2C+we+declare+that+these+Men+whom+we+shall+set+over+us%2C+shall+be+engaged+to+govern+us+principally+by+that+Civil+or+Judicial+Law%2C+given+by+God+to+His+People+of+Israel%2C+especially+in+matters+of+Life+and+Death%2C+and+in+all+other+things+also%2C+so+far+as+they+teach%2C+excepting+only+that+Law%2C+%28viz.+anent+Slaves%2C%29+which+does+not+agree+with+that+Christian+Liberty+established+in+all+Christendom+%28only+violated+by+our+Tyrants%2C+and+some+others+of+late%2C%29+%5Bobviously+he+is+not+saying+that+the+Old+Testament+authorised+chattel+slavery%2C+based+on+manstealing%5D+and+that+of+Divorces+and+Polygamy%3B+the+one+being+not+a+Law%2C+but+a+permission+granted+upon+the+account+of+the+hardness+of+their+Hearts%2C+the+other+being+a+sinful+custom+contrary+to+the+first+institution+of+Marriage%2C+crept+into+the+Church+%E2%80%A6%5B3%5D%0A%0ACargill+avoids+the+extremist+opinion+that+the+entire+judicial+law+of+Moses+remains+binding%2C+recognising+that+specifically+Jewish+laws+have+expired.+Laws+such+as+those+permitting+the+heathen+to+be+used+by+Israelites+as+unpaid+bondservants+were+deemed+to+be+incongruous+with+the+inclusion+of+the+Gentiles+into+the+New+Testament+church+%28Colossians+4%3A1+teaches+that+servants+are+to+be+paid+wages%2C+which+is+not+consistent+even+with+voluntary+bondservice%29.+Nevertheless%2C+Cargill+does+recognise+that+the+parts+of+the+judicial+law+which+are+also+part+of+the+moral+law%2C+especially+those+dealing+with+crime+and+punishment%2C+are+to+be+followed+by+the+Christian+magistrate.%0A%0A%5B1%5D+A+true+and+exact+copy+of+a+treasonable+and+bloody-paper+called%2C+the+fanticks+new-covenant%3A+which+was+taken+from+Mr.+Donald+Cargill+at+Queens-Ferry%2C+the+third+day+of+June%2C+1680+%28Edinburgh%2C+1680%29%2C+p.+4.%0A%0A%5B2%5D+Ibid.%2C+p%2C+5.+The+reference+to+slavery+reveals+that+the+early+Covenanters%2C+in+common+with+their+later+heirs%2C+condemned+chattel+slavery+as+a+form+of+manstealing.%E2%80%9D%0A%0A%E2%80%94+Donald+Cargill%2C+Ibid.%2C+pp+6-7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff67007f663.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f67007f663.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/04/02/donald-cargill-on-the-scottish-covenanters-and-the-judicial-law-2/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>That this Worship of God is to be offered to him according to his Written Word. I say, this Worship that is acceptable to him, is written in his Word; if any man shall worship God by the Precepts of men, it is not according to the Will of God: To the Law and to the Testimony? If any man speak not according to this word, it is because there is no light in them, 2 Tim. 2.16, 17. the whole Scripture (the written Word of God, is of Divine Inspiration, and is profitable for Doctrine, for Reproof, &amp;c. The Scripture is a perfect Rule of Faith and Manners, that is a Foundation of Christian Religion.</p></blockquote>

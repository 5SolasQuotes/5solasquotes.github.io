<main class="wrap"><figure class="quote" id="q-800cd4d1d5" data-kw="">
<blockquote><p>Our third and last exception relates to the recompence of works — we maintaining that it depends not on their own value or merit, but rather on the mere benignity of God. Our opponents, indeed, admit that there is no proportion between the merit of the work and its reward; but they do not attend to what is of primary moment in the matter, viz., that the good works of believers are never so pure as that they can please without pardon.

They consider not, I say, that they are always sprinkled with some spots or blemishes, because they never proceed from that pure and perfect love of God which is demanded by the Law. Our doctrine, therefore, is, that the good works of believers are always devoid of a spotless purity which can stand the inspection of God; nay, that when they are tried by the strict rule of justice, they are, to a certain extent, impure.

But, when once God has graciously adopted believers, he not only accepts and loves their persons, but their works also, and condescends to honour them with a reward. In one word, as we said of man, so we may say of works, — they are justified not by their own desert, but by the merits of Christ alone; the faults by which they would otherwise displease being covered by the sacrifice of Christ.

This consideration is of very great practical importance, both in retaining men in the fear of God, that they may not arrogate to their works that which proceeds from his fatherly kindness; and also in inspiring them with the best consolation, and so preventing them from giving way to despondency, when they reflect on the imperfection or impurity of their works, by reminding them that God, of his paternal indulgence, is pleased to pardon it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Necessity of Reforming the Church, Presented to the Imperial Diet at Spires, A.D. 1544, in the name of all who want Christ to Reign</cite>, (1544) in Tracts and Letters relating to the Reformation, trans and ed. Henry Beveridge, (7 vols, Edinburgh: Calvin Translation Society, 1844), 1: 164-65.</span></figcaption>

<blockquote><p>(6) They [good works] are necessary to the attainment of salvation, not in any sense as a prerequisite to justification, nor in any stage of the believer’s progress meriting the divine favor, but as essential elements of that salvation, the consubstantial fruits and means of sanctification and glorification. A saved soul is a holy soul, and a holy soul is one whose faculties are all engaged in works of loving obedience. Grace in the heart cannot exist without good works as their consequent. Good works cannot exist without the increase of the graces which are exercised in them. Heaven could not exist except as a society of holy souls mutually obeying the law of love in all the good works that law requires. Eph. v. 25 — 27; 1 Thess. iv. 6, 7; Rev. xxi. 27.</p></blockquote>

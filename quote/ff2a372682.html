<main class="wrap"><figure class="quote" id="q-ff2a372682" data-kw="">
<blockquote><p>For it is certain that many Roman pontiffs have erred, even when teaching ex cathedra, that is, determining controversies … Then who, I pray you, will be the supreme judge of the church, when the supreme pontiff hath fallen into heresy? Is he a fit person to be the supreme judge in religion, and one in whose judgment we should acquiesce, who may be, and is a heretic, as the very papists themselves confess? Surely, never. The supreme judge of all controversies must be such a one as can neither err nor prove a heretic: and such is Christ himself, that true High Priest, and the sacred scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, q. 5, ch. 5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ed477133ac" data-kw="">
<blockquote><p>Nor do I regard that as an honour whereby I know that my brethren lose their honour. For my honour is the honour of the universal Church: my honour is the solid vigour of my brethren. Then am I truly honoured when the honour due to all and each is not denied them. For if your Holiness calls me Universal Pope, you deny that you are yourself what you call me universally. But far be this from us. Away with words that inflate vanity and wound charity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-the-great.html">Gregory the Great</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters</cite>, bk. 8, ep. 30 (to Eulogius of Alexandria)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/papal-supremacy.html">Papal supremacy</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/the-popes-claims.html">The Pope&#x27;s claims</a></span></div>

</figure><figure class="quote" id="q-dd5daca24a" data-kw="">
<blockquote><p>Shall we recognise the Apostolic See where we see nothing but horrible apostasy? Shall he be the vicar of Christ who, by his furious efforts in persecuting the Gospel, plainly declares himself to be Antichrist? Shall he be the successor of Peter who goes about with fire and sword demolishing everything that Peter built? Shall he be the Head of the Church who, after dissevering the Church from Christ, her only true Head, tears and lacerates her members? Rome, indeed, was once the mother of all the churches, but since she began to be the seat of Antichrist she ceased to be what she was.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.7.24</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Shall we recognise the Apostolic See where we see nothing but horrible apostasy? Shall he be the vicar of Christ who, by his furious efforts in persecuting the Gospel, plainly declares himself to be Antichrist? Shall he be the successor of Peter who goes about with fire and sword demolishing everything that Peter built? Shall he be the Head of the Church who, after dissevering the Church from Christ, her only true Head, tears and lacerates her members? Rome, indeed, was once the mother of all the churches, but since she began to be the seat of Antichrist she ceased to be what she was.”

</figure><figure class="quote" id="q-1aa6efdfbb" data-kw="Pope judge in own cause">
<blockquote><p>It is unjust that he who is the subject of the controversy should be the judge of the controversy; and I am in greater doubt of the pope’s authority than of the sense of this passage. There is need, therefore, of some other and more impartial judge. For who could say this was a legitimate interpretation;— since the pope says that infallibility is promised to him in this text, therefore he is infallible? Surely he needs some greater authority and testimony than his own word to prove that such a promise hath been made to him. Besides, the papists themselves acknowledge, that the pope may not only err, but even be a heretic, and so completely overturn this interpretation of the passage. Finally, councils, fathers, popes, are men; and scripture testifies that all men are deceitful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 8</span></figcaption>

<main class="wrap"><figure class="quote" id="q-829edfe447" data-kw="">
<blockquote><p>5. Although through this call salvation becomes the possession of only a few, as everyone must admit, it nevertheless retains its great value and significance also for those who reject it… Frequently, even for those who harden themselves in their unbelief, it is a source of various blessings. The enlightenment of the mind, a taste of the heavenly gift, partaking of the Holy Spirit, enjoyment of the Word of God, the experience of the powers of the age to come–these have sometimes even come to those who later fell away and held the Son of God in contempt (Heb. 6:4–6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, 4:37-38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c9f458036e" data-kw="">
<blockquote><p>And, in the third place, this external calling is not without results. In general it can be said of it that God achieves His purpose by means of it… Among the heathen there is great difference between the ways in which they react to the calling of nature. Socrates and Plato are not to be named in one breath with Caligula and Nero. And so it is by no means the same thing whether the gospel is mocked and blasphemed, on the one hand, or accepted with an historical or temporary belief, on the other. True, between these two kinds of faith and a saving faith of the heart there is an essential difference. But that is not to equate them with total unbelief. On the contrary, they are fruits of God’s common grace and they carry with them many temporal blessings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Our Reasonable Faith: A Survey of Christian Doctrine</cite>, trans. Henry Zylstra (Eerdmans, 1956), ch. 20, ‘The Christian Calling,’, pp. 415-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-e424c5b52a" data-kw="">
<blockquote><p>‘You will not come unto Me that ye may have life,’ you will have none of my counsel, you will not return, you are a stiff-necked people, obstinate and rebellious, whence the common assistances of Gods Spirit proves ineffectual and if God did not glorify free-grace any further, none, not the elect would return unto God, for although common grace given unto all is sufficient to leave all men without excuse, their non-improvement being their sin, yet none are thereby effectually engaged to turn unto God in faith, no not the elect, who, while unregenerate, are as sinfully obstinate as any;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-lobb.html">Stephen Lobb</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Glory of Free Grace Displayed</cite>, ... (London, 1680), ch. 7, p. 72</span></figcaption>

</figure><figure class="quote" id="q-5363ba0ffb" data-kw="">
<blockquote><p>[1] If you interpret it of his divine love, the difficulty will not be great; for there is a general and common love, and a special love. With the first, God loves all his creatures, especially mankind, and amongst them those that have any strictures of his image in them more than others. But then there is a special love, and so all those are saved whom God thus loves…. Now this will easily solve the matter; there was a general love, or a liking and approbation of those moral virtues and good things which He saw in him [the rich young ruler], but not that special love which brings grace and salvation along with it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 16, p. 457 on Mk. 10:21-23, “Then Jesus beholding him loved him, and said unto him… And he was sad at that saying, and went away grieved.”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-76f5cff49e" data-kw="">
<blockquote><p>…our Lord also taught the universality of the love of God in the numerical sense of appropriating it to every individual man… …in the second place, that the work of redemption itself bears in our Lord’s representation a broad cosmical character… Especially the doctrine of the kingdom in its eschatological aspect clearly reveals that the divine love sets for its goal not the saving of isolated individuals out of the world, but the salvation of the world as an organic whole… There is, however, still a third sense, in which Jesus leads us to ascribe universality to the divine love. This is done not so much in explicit form as by the implications of His attitude toward sinful men in general.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Scriptural Doctrine of the Love of God” in The Presbyterian &amp; Reformed Review</cite>, pp. 13-14 of “The Scriptural Doctrine of the Love of God” in The Presbyterian &amp; Reformed Review, no. 13 (1902)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

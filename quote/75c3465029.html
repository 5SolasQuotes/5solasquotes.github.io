<main class="wrap"><figure class="quote" id="q-75c3465029" data-kw="">
<blockquote><p>That Council, because it supports idolatry, the Papists deem holy and lawful. Hence, according to their axiom, it cannot have erred in the exposition of Scripture. But if such interpreters of sacred things are to be listened to, (it is abominable to say they are,) the religion of the Egyptians will be preferable to the Christian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to Session IV</span></figcaption>

</figure><figure class="quote" id="q-a6d63b8e1f" data-kw="">

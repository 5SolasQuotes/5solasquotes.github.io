<main class="wrap"><figure class="quote" id="q-75c3465029" data-kw="" data-pol="">
<blockquote><p>That Council, because it supports idolatry, the Papists deem holy and lawful. Hence, according to their axiom, it cannot have erred in the exposition of Scripture. But if such interpreters of sacred things are to be listened to, (it is abominable to say they are,) the religion of the Egyptians will be preferable to the Christian.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to Session IV</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-images.html">Rome: Images &amp; Idolatry</a><a class="tag" href="../topics/worship/idolatry.html">Idolatry</a></div>

</figure><figure class="quote" id="q-a6d63b8e1f" data-kw="" data-pol="">
<blockquote><p>It reproves and condemns the church of Rome, who from the Alpha of their religion to the Omega, are wholly idolatrous. They make images of God the Father,—painting him in their church windows as an old man,—and an image of Christ on the crucifix; and, because it is against the letter of this commandment, therefore they sacrilegiously blot out the second commandment out of their catechises, dividing the tenth commandment into two.</p></blockquote>
<figcaption>— <a href="../authors/thomas-watson.html">Thomas Watson</a>, <cite>The Ten Commandments</cite>, Second Commandment, p. 96</figcaption>
<div class="meta"><a class="tag" href="../topics/polemics/rome-images.html">Rome: Images &amp; Idolatry</a><a class="tag" href="../topics/worship/idolatry.html">Idolatry</a></div>

</figure><figure class="quote" id="q-bf239b6292" data-kw="Mary Queen of Heaven Mediator Idolatry Invocation of saints" data-pol="">

<figcaption>— <a href="../authors/william-perkins.html">William Perkins</a>, <cite>A Reformed Catholic</cite>, An Advertisement to all Favorers of the Roman Religion</figcaption>

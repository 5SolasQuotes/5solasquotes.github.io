<main class="wrap"><figure class="quote" id="q-81ce495dfe" data-kw="">
<blockquote><p>Though Christ in regard of his divine nature, and by virtue of his eternal generation be the only begotten Son of his Father; and in regard of his humane nature, by reason of the perpetual virginity of his mother, her only begotten Son; yet may He well be said to have brethren, and that in two especial respects: 1. Because the Son of God and Son of men are of one, even of one and the same nature: Therefore He is not ashamed to call them brethren, Heb. 2:11. 2. Because He has adopted them to be Sons of his Father; For we children of men are said to have the adoption of children by Jesus Christ, Eph. 1:5. In this respect Christ stiles his disciples whom He had adopted, ‘brethren’, Mt. 28:10. For He Himself renders this reason of calling them brethren, ‘My Father is their Father’, Jn. 20:17.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned &amp; Very Useful Commentary on the Whole Epistle to the Hebrews</cite>, … (London, 1655), §. 67. ‘Of Christ the first-begotten’, p. 49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-33fb3b11d1" data-kw="">
<blockquote><p>We make our prayers in that tongue which all our people, as meet is, may understand, to the end they may (as Paul counselleth us) take common commodity by common prayer, even as all the holy fathers and Catholic bishops, both in the Old and New Testament, did used to pray themselves, and taught the people to pray too, lest, as Augustine saith, &quot;like parrots and ousels we should seem to speak that we understand not.&quot; Neither have we any other mediator and intercessor, by whom we may have access to God the Father, than Jesus Christ, in whose only Name all things are obtained at His Father&#x27;s hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>

</figure><figure class="quote" id="q-aaad13be61" data-kw="">
<blockquote><p>If the soul of the blessed Virgin had never been stained with the contagion of original sin, this would derogate from the dignity of Christ, according to which He is the universal Savior of all.</p></blockquote>

</figure><figure class="quote" id="q-475301f5c2" data-kw="">
<blockquote><p>If the question brought before the Vatican Council had been of a purely spiritual nature, had the bishops been only required to affirm such a doctrine as the Assumption of the Virgin Mary—that is to say, to assert a historical fact without a particle of evidence—I do not think many would have rebelled. It was because the doctrine of the Pope&#x27;s personal Infallibility had bearings on the practical business of this world; because its assertion was supposed to be intended for the preservation or recovery of the Pope&#x27;s temporal sovereignty; because the claim would enable him to interfere with more effect on questions of toleration, civil liberty, marriage, and education, that so much difficulty was made about conceding it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Infallibility of the Church</cite>, Lecture VI</span></figcaption>

</figure><figure class="quote" id="q-39d0e4e023" data-kw="">
<blockquote><p>I have never thought, still less taught, or declared publicly, anything concerning the subject of the ever Virgin Mary, Mother of our salvation, which could be considered dishonourable, impious, unworthy or evil… I believe with all my heart according to the word of holy gospel that this pure virgin bore for us the Son of God and that she remained, in the birth and after it, a pure and unsullied virgin, for eternity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ulrich-zwingli.html">Ulrich Zwingli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon on ‘Mary, ever virgin, mother of God’, as quoted in Max Thurian</cite>, [a Protestant], Mary: Mother of All Christians, trans. Nevill B. Cryer (New York: Herder &amp; Herder, 1963), p. 76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

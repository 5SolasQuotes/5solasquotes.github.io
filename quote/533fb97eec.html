<main class="wrap"><figure class="quote" id="q-533fb97eec" data-kw="">
<blockquote><p>. . . b. A usus elenchticus or pedagogicus. In this capacity the law serves the purpose of bring man under conviction of sin, and of making him conscious of his inability to meet the demands of the law. In that way the law becomes his tutor to lead him unto Christ, and thus becomes subservient to God’s gracious purpose of redemption.</p></blockquote>

</figure><figure class="quote" id="q-07640ab15d" data-kw="">
<blockquote><p>Many a one thinks that he has God and everything in abundance when he has money and possessions; he trusts in them and boasts of them with such firmness and assurance as to care for no one. Lo, such a man also has a god, Mammon by name, i.e., money and possessions, on which he sets all his heart, and which is also the most common idol on earth.… So, too, whoever trusts and boasts that he possesses great skill, prudence, power, favor, friendship, and honor has also a god, but not this true and only God.… Therefore I repeat that the chief explanation of this point is that to have a god is to have something in which the heart entirely trusts.</p></blockquote>

</figure><figure class="quote" id="q-ffaa63822b" data-kw="civil pedagogical conviction restraint">
<blockquote><p>In the destitute state of sin, the use of the law cannot be “justification” because it was weak in the flesh. It is not said to have been given for life, but “because of transgressions” (Gal. 3:19). Still there is a threefold use of the law. (a) For conviction, when it brings man to a knowledge of sin and convinces him of his guilt—“by the law is the knowledge of sin” (Rom. 3:20). Thus it is like a mirror in which we see our blemishes. (b) For restraint, restraining and checking men by its commands and threatenings, so that they who feel no regard for justice and rectitude unless compelled (while they hear its direful sanctions) may be restrained at least by the fear of punishment. In this respect, Paul says “the law is not made for a righteous man, but for lawless and disobedient, for the ungodly and for sinners” (1 Tim. 1:9).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.22.9</span></figcaption>

</figure><figure class="quote" id="q-ea1baf7f9a" data-kw="two tables four and six">
<blockquote><p>Some assign five precepts to each table: as Josephus, “Moses brings forward two tables containing ten written precepts, five on each,” whom Philo follows and, of the fathers, Irenaeus. But this is false because Christ comprehends the fifth precept under the second table (Mt. 19:18); and Paul also when he calls it the first commandment of the second table with promise (Eph. 6:2). For in the first table, a promise is given in the second precept. Also the nature of the thing proves it because some are duties of religion towards God (prescribed in the first table), others of love and reverence for superiors (prescribed in the second table).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.5.2</span></figcaption>

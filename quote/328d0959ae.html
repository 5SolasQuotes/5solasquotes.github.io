<blockquote><p>…notwithstanding the reformation of religion, Christ may be pleased rather to live abroad in the fields than at home, where the people would willingly assemble: The house of God was now repaired, and the bed green: and the Church invites Christ to come in unto her, in it, yet He disposes Himself so, as more willing to call her abroad. So we may see that notwithstanding the purity and simplicity of Christ’s worship, yet Christ is not bound to any place; if things were never so reformed, yet He might leave us, and go into the wild field.</p></blockquote>

</figure><figure class="quote" id="q-17c8f5d1fa" data-kw="">
<blockquote><p>If truly the consequence is made good only by the will of governors, then this consequence will be valid: All such things are orderly and decent; therefore, let the calf of Aaron be made and openly worshiped, for worship in such a visible way is by [the will of] the governors. A good consequence is one which stands indivisible: then it is a good consequence or not a good consequence. This consequence, however, where the truth has been mixed, depending partly on reason and partly on the will of men, is nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rutherford’s Examination of Arminianism: the Tables of Contents with Excerpts from Every Chapter</cite>, tr. Charles Johnson &amp; Travis Fentiman (1638-1642; 1668; RBO, 2019), ch. 1, section 17, p. 48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-447a4bfa17" data-kw="">
<blockquote><p>Too high an estimation of any peculiar way of worship is apt to entice the minds of some into a hurtful confidence in these things. Having an apprehension that they alone have attained unto the right way of gospel worship and the administration of its ordinances, and that, perhaps, on such accounts as wherein they are eminently deceived, they begin first greatly to value themselves, and then to despise all others, and, if they can, to persecute them. This insensibly works them into a trust in that which they esteem so excellent, and that unto an open neglect of things of a greater weight and moment. Thus is it not unusual to see persons who are under the power of some singular opinion and practice in religion to make one thing almost their whole business, the measure of other things and persons, the rule of communion and of all sincere love;—to value and esteem themselves and others according unto their embracing or not embracing of that opinion… Wherefore, although we ought greatly to prize and to endeavour after the true order of the church of Christ, the purity of worship, and regular administration of ordinances, yet let us take heed that we prize not ourselves too much on what we have attained; for if we do so, we shall be very apt to countenance ourselves in other neglects thereby, which will certainly bring us into a spiritual sickness and declension.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, (NY: Robert Carter, 1852), vol. 7, Nature &amp; Causes of Apostasy from the Gospel, ch. 12, pp. 252-53</span></figcaption>

17.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/#:~:text=Too%20high%20an%20estimation%20of%20any,into%20a%20spiritual%20sickness%20and%20declension&amp;text=Too%20high%20an%20estimation%20of%20any%20peculiar%20way&amp;text=bring%20us%20into%20a%20spiritual%20sickness%20and%20declension" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-74b6e0f3c8" data-kw="">
<blockquote><p>Lawfulnesse is an essential property of divine worship resulting from God’s particular approving will in his Word, as is clear, Hosea 8:5; 1 Chron. 15:13; Lev. 10:1; 2 Sam. 7:7; Jer. 7:30; Acts 15:24… …for it [arbitrary worship] cannot have its warrant from God’s general will whereby the proposition of a syllogism is warranted, but not the assumption, for thus the golden calfe of Jeroboam, the worshipping of Satan, should be lawful: for I can form a syllogism to it from Scripture (All worship commanded in the Word is lawful, but Jeroboam’s golden calf is commanded in the Word; Therefore, it is lawful… If ceremonies come partly from men’s will, partly from the light of reason, then do they conclude the lawfulness of ceremonies either fallibly or necessarily: If the former be said, we have little warrant of conscience to practice them; nor can God be honored, nor these things lawful, good, and edificative, more than unlawful, evil and unapt to edify, seeing there be no light of Scripture or nature to make them good to us; and because a fallible and unnecessary consequence is over fallible and unnecessary, and stands (as Aristotle says well) in an indivisible point. It is a non-consequence, and so men’s will is the best house that ceremonies are descended of. If they can be proved by a necessary and infallible consequence, we desire to hear it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646) Westminster divine, pp. 120-21</span></figcaption>

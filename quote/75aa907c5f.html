<main class="wrap"><figure class="quote" id="q-75aa907c5f" data-kw="">
<blockquote><p>V. When I can have better, caeteris paribus [other things being equal], without greater hurt than good, I prefer it; and only use occasional local communion with the [Anglican] liturgy-churches, as I would do with strangers were I in foreign lands.

VI. Where I can have no better without more hurt than good, I communicate constantly and only with the parish-church where I live, as to local-communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689), ch. 58, ‘Whether Communion with so Faulty a Church be Lawful’, pp. 225-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>
<div class="actions"><button class="copy" data-copy="“V. When I can have better, caeteris paribus [other things being equal], without greater hurt than good, I prefer it; and only use occasional local communion with the [Anglican] liturgy-churches, as I would do with strangers were I in foreign lands.

VI. Where I can have no better without more hurt than good, I communicate constantly and only with the parish-church where I live, as to local-communion.”

— Richard Baxter, The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued, (1683; London: Parkhurst, 1689), ch. 58, ‘Whether Communion with so Faulty a Church be Lawful’, pp. 225-26">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CV.+When+I+can+have+better%2C+caeteris+paribus+%5Bother+things+being+equal%5D%2C+without+greater+hurt+than+good%2C+I+prefer+it%3B+and+only+use+occasional+local+communion+with+the+%5BAnglican%5D+liturgy-churches%2C+as+I+would+do+with+strangers+were+I+in+foreign+lands.+VI.+Where+I+can+have+no+better+without+more+hurt+than+good%2C+I+communicate+constantly+and+only+with+the+parish-church+where+I+live%2C+as+to+local-communion.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+English+Nonconformity+as+under+King+Charles+II+%26+King+James+II+Truly+Stated+%26+Argued%2C+%281683%3B+London%3A+Parkhurst%2C+1689%29%2C+ch.+58%2C+%E2%80%98Whether+Communion+with+so+Faulty+a+Church+be+Lawful%E2%80%99%2C+pp.+225-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F75aa907c5f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/75aa907c5f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-separatism/#:~:text=V.%20When%20I%20can%20have%20better,where%20I%20live%2C%20as%20to%20local%2Dcommunion&amp;text=V.%20When%20I%20can%20have%20better%2C%20caeteris%20paribus&amp;text=the%20parish%2Dchurch%20where%20I%20live%2C%20as%20to%20local%2Dcommunion" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-22541cf5ab" data-kw="">
<blockquote><p>A minority within the Societies, such as Hamilton and Earlstoun, would continue to reject William’s kingship, but the majority, including their ministerial leadership, either tacitly or openly accepted it. That split proved to be fundamental and led to the great schism in the Societies in 1690, when Hamilton and a minority of the Societies refused to accept the Revolution settlement of Church and State, and, ultimately, publicly rejected William’s authority in the Sanquhar Declaration of 1692. (Walker, BP, I, 126; Shields, FCD, 411-2, 418-9.)… The Societies also took steps to secure the Revolution by offering military support…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-jardine.html">Mark Jardine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The United Societies</cite>, 1679 to 1688 PhD diss. (Univ. of Edinburgh, 2009), Conclusion, p. 240</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-b2fbd67552" data-kw="">
<blockquote><p>…if those justly called Separatists, and who think parish communion under honest ministers [in the Anglican churches] to be idolatry, or unlawful, will but without prejudice read what is written to prove it lawful by the old, godly, judicious nonconformists, especially John Ball‘s Trial of Separation [1640], Mr. [Arthur] Hildersham [A Treatise of the Ministry of the Church of England, 1595], Mr. [William] Bradshaw [The Unreasonableness of the Separation, 1640, with William Ames], Dr. [William] Ames, Mr. [Thomas] Cartwright [A Letter of T.C. to Richard Harrison concerning Separation; note that EEBO has misidentified the author’s dates], Mr. [George] Gifford [whose three books are above], Mr. John Paget [An Arrow Against the Separation of the Brownists, 1618], Mr. [Thomas] Brightman [on Rev. 3, pp. 131-32], Mr. [William] Rathband [his three works above], etc. they will need no more to save them from this scandalous Schism.</p></blockquote>

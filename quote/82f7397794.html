</figure><figure class="quote" id="q-6ac70eebd0" data-kw="">
<blockquote><p>Should anyone attempt to weaken the truth of natural theology by this argument, that nothing of certainty can be discovered in human affairs, or that what is certain cannot possibly be distinguished from that which is doubtful, a confutation of the first of these puerilities does not belong to this part of the subject; for it is not our business here to demonstrate the principles of human knowledge, but to take them for granted–Let these who are so thoroughly possessed of such skeptical opinions in order to be cured of their folly apply to the metaphysicians, I had almost said to the physicians–all that our subject requires of us is to show that there is as great certainty to be found in matters of a divine nature as can possibly be met with in human affairs. For to add only this one remark, what end can it serve to confute those by argument who attempt to destroy all reasoning, nay the very foundations of it, and who, on their own principles, are equally refuted, whether they prove their own opinion to be true, or do not prove it, whether they overcome in their disputations, or are defeated? But that certainty is often confounded with doubt, and truth with falsehood, in every subject of our enquiry, more particularly such enquiries as have divine things for their object, cannot be denied. For this reason in particular, the candid enquirer after truth should determine nothing without caution, nothing precipitately, nothing from prejudice, from anger, from hatred, or any improper disposition. But to assert that nothing, in any of our enquiries, can be known with certainty, even when the utmost caution, sincereity and attention guide our researches, is perfectly absurd and quite inconsistent with the first principles of reason.</p></blockquote>

</figure><figure class="quote" id="q-69092f7def" data-kw="">
<blockquote><p>Man is a personal body created in God’s image. The Bible makes quite clear that man’s hope is in resurrection of the body, not release from the body (John 2:19-22; Lk. 24:40; Rom. 8:23; 1 Cor; 15:3-4, 44, 48-49; 2 Cor. 5:1-5; Isa. 26:19; 66:22-23; Dan. 12:2). Moreover, it is embodied existence which is the criterion of future judgment (2 Cor. 5:10; Heb. 9:27). We may not know all the answers with respect to the intermediate state…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/greg-bahnsen.html">Greg Bahnsen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Mind / Body Problem in Biblical Perspective’</cite>, (Covenant Media Foundation, 1972) 10 pp. | Yet Bahnsen is seriously weak on death and the intermediate state (if his view can even adequately explain these things, which it is not clear it can):</span></figcaption>

</figure><figure class="quote" id="q-577c12eebf" data-kw="">
<blockquote><p>For we both are, and know that we are, and delight in our being, and our knowledge of it. Moreover, in these three things no true-seeming illusion disturbs us; for we do not come into contact with these by some bodily sense, as we perceive the things outside of us—colors, e.g., by seeing, sounds by hearing, smells by smelling, tastes by tasting, hard and soft objects by touching—of all which sensible objects it is the images resembling them, but not themselves which we perceive in the mind and hold in the memory, and which excite us to desire the objects. But, without any delusive representation of images or phantasms, I am most certain that I am, and that I know and delight in this. In respect of these truths, I am not at all afraid of the arguments of the Academicians, who say, ‘What if you are deceived?’ For if I am deceived, I am. For he who is not, cannot be deceived; and if l am deceived, by this same token I am. And since I am if I am deceived, how am I deceived in believing that I am? for it is certain that I am if I am deceived. Since, therefore, I, the person deceived, should be, even if I were deceived, certainly I am not deceived in this knowledge that I am. And, consequently, neither am I deceived in knowing that I know. For, as I know that I am, so I know this also, that I know. And when I love these two things, I add to them a certain third thing, namely, my love, which is of equal moment. For neither am I deceived in this, that I love, since in those things which I love I am not deceived; though even if these were false, it would still be true that I loved false things. For how could I justly be blamed and prohibited from loving false things, if it were false that I loved them? But, since they are true and real, who doubts that when they are loved, the love of them is itself true and real? Further, as there is no one who does not wish to be happy, so there is no one who does not wish to be. For how can he be happy, if he is nothing?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>City of God</cite>, bk. 11, ch. 26 in NPNF1 2.220</span></figcaption>

<main class="wrap"><figure class="quote" id="q-652eea1381" data-kw="">
<blockquote><p>The eighth question is, whether Christ by his obedience merited anything for Himself. Here Quenstedt attacks Lombard, Thomas, Socinus, and others, That Christ merited only for us follows not only from the dignity of his Person, but from the communicatio idiomatum, whereby his human nature (except so far as our redemption required) lacked nothing. Besides, if He merited worship for Himself, how then could He have been worshipped in his earthly life? Moreover, as his merit and satisfaction are really one, if He merited for Himself, then He also satisfied for Himself. As to the name above every name, He had it already by right. Quenstedt repeats against the Romanists the argument of Calvin, that they confound the relation of antecedent and consequent with that of cause and effect. To the Socinian argument, that if Christ did not merit for Himself He could not merit for us, he replies that He could do this, just because He was not mere man, but God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/english.html">English</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Quenstedt | As quoted in Robert Franks, A History of the Doctrine of the Work of Christ (Wipf &amp; Stock, 2001), Part 3, ch. 6</cite>, p. 425</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-96e9c4f20c" data-kw="">
<blockquote><p>That objection of Durandus would have force if God rendered the reward to good works out of commutative justice; but since God has decreed to give rewards to those who work well out of distributive justice, it is not necessary that we properly give him anything. For neither do those who run for the prize give anything to the king, and yet the king is bound to give the prize to him who has outstripped the rest in the race. Let it stand, therefore, that the good works of the just merit eternal life out of justice, and so ex condigno.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.16 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-83223a61ea" data-kw="">
<blockquote><p>There is nothing in the term reward to justify the inference that our works are the cause of salvation. First, let it be a fixed principle in our hearts, that the kingdom of heaven is not the hire of servants, but the inheritance of sons (Eph. 1:18); an inheritance obtained by those only whom the Lord has adopted as sons, and obtained for no other cause than this adoption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.2</span></figcaption>

</figure><figure class="quote" id="q-b9de188dcd" data-kw="">
<blockquote><p>For I admit not the distinction laid down by otherwise learned and pious men, that good works merit the favors which are conferred upon us in this life, whereas eternal life is the reward of faith only. … Therefore, every help to salvation bestowed upon believers, and blessedness itself, are entirely the gift of God, and yet in both the Lord testifies that he takes account of works, since to manifest the greatness of his love toward us, he thus highly honors not ourselves only, but the gifts, which he has bestowed upon us.</p></blockquote>

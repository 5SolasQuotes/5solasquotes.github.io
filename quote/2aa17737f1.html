<main class="wrap"><figure class="quote" id="q-2aa17737f1" data-kw="">
<blockquote><p>And it came to pass, as He went into the house of one of the chief Pharisees to eat bread on the sabbath day, that they watched Him… 7 And he put forth a parable to those which were bidden, when he marked how they chose out the chief rooms; saying unto them. 8 When thou art bidden of any man to a wedding, sit not down in the highest room; lest a more honourable man than thou be bidden of him… 12 Then said he also to him that bade him, When thou makest a dinner or a supper, call not thy friends, nor thy brethren, neither thy kinsmen, nor thy rich neighbours; lest they also bid thee again, and a recompence be made thee. 13 But when thou makest a feast, call the poor, the maimed, the lame, the blind… 15 And when one of them that sat at meat with him heard these things, he said unto him, Blessed is he that shall eat bread in the kingdom of God. 16 Then said he unto him, A certain man made a great supper, and bade many: 17 And sent his servant at supper time to say to them that were bidden, Come; for all things are now ready… 23 And the lord said unto the servant, Go out into the highways and hedges, and compel them to come in, that my house may be filled. 24 For I say unto you, That none of those men which were bidden shall taste of my supper.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/new-testament.html">New Testament</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lk. 14:1</cite>, 7-8, 12-13, 15-17, 23-24</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-443581e996" data-kw="">
<blockquote><p>For honest games and pass-times, howbeit honest, may be [an] impediment to spiritual exercises, and distract the mind as much as the lawful works of our calling. Refreshment by meat and drink was allowed by God Himself, when He provided for the seventh day, and by Christ Himself, who being invited, went to the pharisee’s house upon the sabbath to dinner. A man may recreate himself with the free air of his garden or the fields, if family duties or the like hinder him not, providing he spend the time in holy exercises, or holy conference with some other. But games and pass-times cannot consist with such holy exercises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Re-examination of the Five Articles enacted at Perth, anno 1618</cite>, ... (1636), ‘Of the Sabbath’, pp. 185-86</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

<blockquote><p>For all kinds of bodily labors on the Lord’s day are unlawful, except they be referred to the sanctification of the Sabbath, as the means of it (Mt. 12:5), of which sort are the labors of the minister in the duties appertaining to his ministry, and of the people travailing to the places of God’s worship.</p></blockquote>

</figure><figure class="quote" id="q-712e5cf219" data-kw="">
<blockquote><p>I take it we are not denied to rejoice and solace ourselues upon this day. For to some men, at some times, recreation may be more necessary than meat, in case of weakness, for present preservation of health. And though not in that regard, yet being well used, it may be a furtherance to men, in the performance of the duties of godliness, as well as in the duties of their calling. But this rejoicing must be such as was the rejoicing of the Jews, Neh. 8:12, which was only spiritual, and in the Lord. For they reioyced only for this, that they understood the law of God that was taught them. But as for the recreations and pastimes aforenamed, as bowling and such like, they are not at this time to be used…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Treatise of the Cases of Conscience</cite>, (Cambridge: John Legat, 1606), ch. 16, ‘How the Sabbath of the New Testament is to be observed?’, section 1, case 1, p. 460</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-eb0567b629" data-kw="">
<blockquote><p>And yet so far only to exercise it [the body on the Lord’s Day] as not to tire and weary it, if urgent occasion do not require, lest wearisomeness require some such recreation thereof as is nor [not] meet. … Whence it follows that all bodily recreations that do not further us to divine worship, are unlawful on the Lord’s Day: Because they serve only to refresh the body after labor; which is restrained therefrom; otherwise I say, then they shall make us fitter to serve God, when we have any liberty to labor upon case of necessity, though we may use that liberty to wearisomeness, yet this is to be relieued specially with spiritual recreation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cooper.html">Thomas Cooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wilie Beguile Ye, or The Worldling’s Gain</cite>, … (London, 1621), Conclusion to the Reader, pp. 53-54 Cooper (1569/70 – 1626 or later) was an English puritan; works.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

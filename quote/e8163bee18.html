<blockquote><p>The Gospel, however taken, has conditional promises. The Papists here assent to us, but not without calumny. For they feign that we make the Gospel promises to be absolute. Proposition 2: The Gospel most largely taken has the promise of eternal life, on condition either of faith only [for justification], or faith and new obedience together [for final salvation], or of fulfilling the perfect Law by our own strength (as rehearsing the Law of works): and so it makes mention not only of the evangelical condition and righteousness, but of the legal too. Proposition 3: The Gospel largely taken, has the promise of eternal life on condition of faith and new obedience [for final salvation]. Of the condition of faith there is no doubt: nor of the condition of new obedience conjunct with faith, Rom. 8:13; Heb. 12:14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, bk. 1, ch. 19, pp. 395-96 in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 402</span></figcaption>

t online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a938100c5b" data-kw="">
<blockquote><p>Objection: But is not this an approven distinction, that persons are within the Covenant, either externally, professedly, visibly, or internally, really, or according to the intention of God? Therefore, such as are externally within the Covenant, are not really and indeed within the Covenant of Grace. Answer: The adverb really relates to the real fruit of the fulfilled covenant, and so such as are only externally within the covenant are not really within the covenant, for God never directed, nor intended to bestow the blessing covenanted, nor grace to perform the condition of the covenant upon them. But they are really covenanted and engaged by their consented profession to fulfill the covenant. And as the commands and threatenings of the covenant of grace lay on a real obligation upon such as are only externally in covenant, either to obey or suffer, so the promise of the covenant imposes an engagement and obligation upon such to believe the promise; but sometimes we say the promises of the covenant of grace are not really made to the reprobate within the visible church, because God intends and decrees to, and for them, neither the blessing promised, nor the saving grace to fulfill the condition or to believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, … (Edinburgh: Anderson, 1655), pt. 1, ch. 13; pp. 92-93</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

<blockquote><p>Question: Whether are there rarer threatenings of temporal evils under the New Covenant than under the Old? Answer: It cannot be denied, except the threatenings of the sword, famine, pestilence on Jerusalem and the desolation upon the Jews, Mt. 23-24. But in place of all the diseases of Egypt, Lev. 26, and the long roll of dreadful judgments and curses temporal, Dt. 28, denounced against the transgressors of the former covenant, Christ and the apostles are more sparing in denouncing temporal plagues in the New Testament. (Threatenings under the New Testament more spiritual than under the Old) Christ says the worm never dies, the fire never goes out, the hypocrite is to be bound hand and foot and casten into utter darkness, Mt. 22:12, and the Holy Ghost, such shall not inherit the kingdom of heaven, 1 Cor. 6:9; Eph. 5:5; the apostate is near a curse, his end burning, Heb. 8:6; he is to look for judgment and fiery indignation, Heb. 10:27; to some is reserved the blackness of darkness for ever, Jude 7; the lake that burns with fire and brimstone, which is the second death, Rev. 21:8. Because: (1) temporal blessings and curses are more legal, and more easily believed, when the light was dimmer than now; when light is larger, convictions stronger, and men are more apt to believe everlasting wrath. (2) It is a more Gospel-way to bear in the threatening of everlasting wrath than of temporal rods. (3) Desertions and trials under the Law were more legal and sharp and sad upon David, Hezekiah, Job, Jeremiah, Heman, Ps. 6; 38; 77; 102; 88; Isa. 38; Jer. 20. But it is to be thought that in regard the day now has dawned, the Gospel desertions, ceteris paribus [all things being equal], for the abundance of light, are more sharp, nearer to despair; see 2 Cor. 1:8, ‘We were pressed out of measure above strength, in so much that we despaired even of life, having received the sentence of death.’ It is a doubt if Paul should be so pressed by a sentence of temporary death. Though there be a larger measure of faith, to bear up the soul under the New Testament; but it would appear there is more of Hell now than under that dispensation, and that the gospel-despair of Judas, and of these that cry for mountains and hills to cover them, Lk. 23:29-30, is more intolerable under the Gospel. (The saints are stronger to suffer under the New Testament than under the Old) (4) There is a more numerous company of these who have not loved their lives to the death, and the martyrs that suffered more exquisite torments for Christ under the persecuting emperors and reign of Antichrist than ever before; the constraining love of Christ, which is stronger than death or hell, has so swallowed up all temporary sufferings, the Spirit has such influence on the flesh. (A larger number of godly, of the rude and unlearned, than of the wise and learned according to the flesh) (5) When the world seeks wisdom, 1 Cor. 1, and Rabbis of the Jews and learning and arts abound all the world over, as the profound philosophers of the gentiles, the wonders of nature prove, yet not many wise are called, 1 Cor. 1:21, 26-27; and unlettered and ignorant are, in number, for godly spiritual knowledge, far beyond the godly learned, and make that true, Isa. 11:9, ‘The earth shall be filled with the knowledge of the Lord, as the waters cover the sea,’ and Isa. 30:26, ‘And the light of the moon shall be as the light of the sun, and the light of the sun shall be as the light of seven days;’ so hath the Lord darkened carnal learning, though of itself the good gift of God, with the shining of spiritual wisdom in the fools of the world, for so are they judged, 1 Cor. 1:27.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, … (Edinburgh: Anderson, 1655), pt. 1, ch. 12, pp. 66-67</span></figcaption>

<blockquote><p>Out of all this my answer is that the essential form of a visible church is the covenant of God, or true faith made visible by profession;</p></blockquote>

</figure><figure class="quote" id="q-6d3d08eca5" data-kw="">
<blockquote><p>The third use is for reproof of those that hold outward government essentially necessary to the Church, as if the Church without this could have no being at all. I for my part desire, and would gladly go as far as I see Christ and his apostles have gone before me; and where they stay, there would I stay too. I find that the Church can never be long nor well without government, but yet it may be sometimes without it, and yet be a true Church. It is true of the inward government, for where that is not, it is not possible that the Church should have any being at all, but it is not so of the outward. Therefore we must rightly distinguish betwixt the inward and the outward government, otherwise we shall run into many absurdities: First, the inward is merely spiritual, the outward is for the most part bodily, that is, such as affects the ear, or the eye, or some other parts; only it is thus far spiritual, in regard of the end it aims at, that is, to make us spiritually minded. Secondly, the inward is proper to God, and reserued to Him only; the outward, though it be from God too, yet it is committed to the administration of men. Thirdly, the inward is peculiar to the faithful and elect alone, God rules in their hearts and consciences, justifying and sanctifying them, and none others; the outward is common to all that profess themselves to be members, though they be hypocrites. Fourthly, the inward is the highest and principal, the outward is but a serviceable dispensation fitted to the inward. Fifthly, the inward seconds the outward, and makes it effectual and fruitful; the outward does but lead vs by the hand (as it were) to the inward. I note this difference the rather, because many men do clamorously exclaim that Christ is robbed of the one half of his kingdom when that outward form which they pretend is not observed. And this is the Brownists’ exception: ‘You’ (say they) ‘deny Christ to be your King, because you own not his discipline which He has prescribed.’ I am with the apostle: God’s kingdom consists not of meats and drinks, and of outward rites, but of righteousnesse and peace, and joy in the Holy Ghost. [Rom. 14] The principal part of God’s kingdom is when He rules by his Spirit in the hearts of his children: and therefore if there were any such discipline prescribed by the Word as they pretend, yet we should not lose the one half of Christ’s kingdom, though it were not observed. Happily it is not known to them that do not observe it; and then it is no rebellion; if it be knowne by them, the sin is much the greater, if it be not observed. But yet Christ may still exercise his Kingdom in the hearts of many members of the Church by his Spirit, though this were wanting. The case may seem to be well paralleled by our outward and inward worship in prayer: The outward worship is but an appurtenance to the inward, for the inward may be true without the outward. And so discipline is rather an appurtenance to God’s kingdom, than the kingdom itself; so that we see that God’s Church may be without discipline, though it cannot be well nor long without it; where outward government is wanting, the Church may be defective and maimed, yea half-dead in outward show at least, and yet a true Church still. Yet, but are not the Word and the sacraments parts of the outward government, and they are necessary to the very being of the Church. Therefore some part of the outward government is essential to the Church. I answer: That they are not necessary to themselves, but by accident, because they 〈…〉to the inward, as that it cannot be without this. And besides, the Word and the sacraments are not so much of the outward government of themselves, but rather the carriage and manner of using of them is of the outward government. Lastly, I answer, they are simply necessary, as they are the causes and gathering of the Church, but not as they are parts of outward government. As Moses his message and gathering of the Israelites to the Lord was one thing, his governing of them another. So that the Word and sacraments must be considered in both these respects, and so in respect of gathering the Church, they are simply necessary, not in respect of governing of it. So that outward government is not simply necessary to the being of the Church, but to the well-being only.</p></blockquote>

<blockquote><p>X. Nevertheless, that we may not seem to shun the question (as if it were insoluble [alytos] by us), we can answer directly that the question puts on a fourfold relation or has reference to four things: (1) the doctrine and faith of the elect, who constitute the church; (2) their persons and condition; (3) the place where they were; (4) the form of government under which They lived and the external worship which they had. As to the first, if we treat of the Christian faith, we say the substance of the things to be believed and done in order to salvation was always in the Scriptures, in the Apostles’ Creed, in the law of God and the Lord’s Prayer, sealed by the sacraments, which by a special providence he willed to preserve always in the church for sustaining the alack, although that doctrine was frequently mixed with various errors. So that we must hear accurately distinguish the substance of faith from the corrupting accidents in doctrine and worship, in the midst of which God knew how to preserve his elect in that purity which was necessary for salvation until the age of the Reformation.

XI. Second, if we trees of the persons themselves (i.e., Of the church properly so called, inasmuch as it denotes the mystical body of Christ, constituted of the elect alone), we say that it subsisted in all the elect who were from the time of the apostles, who is all ages have believed in Christ according to the publicly preached truth of the gospel, who separated the substance of saving doctrine in the public ministry from the errors repeatedly creeping in. These we are no more bound to show to them that Elijah was bound to show the 7000 men who have not bowed their knees to bail, although they were truly in Israel.

XII. The condition of this church was miserable and afflicted, both because it was obscure and destitute of splendor (which was adumbrated by the woman flying into the wilderness [Rev. 12:6], small in number and reduced to great paucity, designated by the “two witnesses” [Rev. 11:3], because they were very few when compared with the multitude of those wandering in error) and because it was partly corrupt, partaking in some measure of the errors of the papacy, although it always retained the foundation of salvation and so seceded from the papacy (if not positively, yet negatively; if not in place still in faith and religion), disapproving of her errors and opposing themselves to them as far as they could.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.10.10–12.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-15e78e36c0" data-kw="">
<blockquote><p>Conclusion 2. That a real and approved holiness is a sure-note that the error which they hold is not a damning, destroying error. I say, though the holiness of those men that maintain an opinion, be not a sure note that the opinion they maintain is a truth, yet it is a certain evidence that it is not an undoing and destructive error. Christ says that the elect shall not be deceived, Mt. 24:24, that is, though they may be carried aside with some sinful, yet they shall not be drawn away with undoing errors. And we have all the harmony of Scripture for that: He tells us that they who do his will, shall know his doctrine, that we shall all be taught of God, that we shall hear his voice, and shall not follow the voice of strangers, and that we have received an anointing of the holy One, whereby we know all things. All which places are to be understood of necessary truths, not accessory; of truths that are essential and fundamental, not circumstantial: and it proves fully to us that God will never give up his holy ones to undoing errors. That’s the second answer; that holiness is a sure note, that the opinions which they hold (though an error) yet it is not a damning and destroying error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error</cite>, ... (1646), p. 166</span></figcaption>

</figure><figure class="quote" id="q-d400a62bf4" data-kw="">
<blockquote><p>The first step towards what might be called the re-organisation of the [United] Societies appears to have been taken by Robert Hamilton, who had been on the Continent from 1679 to 1688, and who had constituted himself the leader in opposition to the movements proposed by the ‘ministers and majority of the people’ during the two years after the [Glorious] Revolution [of 1689]. All who did not approve his views were guilty of ‘gross defections.’ …when the first General Meeting was held after the issue of this paper [in 1691], it was found that there were tares among the wheat. “When gathered and searching into one another’s judgement as to the state of the testimony,” says the writer of the Informatory Vindication [of 1691(?)], ‘We found ourselves to be but a mix’d company,” and consequently, before anything was done, they had to ‘purge their meetings from all such as had sinfully joined with the courses of the times and were defending the same.’… How many were removed at the ‘purging’ is also unknown, but they must have formed a considerable proportion of the body… The Societies seem to have done very little without causing controversy in their own ranks.</p></blockquote>

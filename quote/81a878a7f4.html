<main class="wrap"><figure class="quote" id="q-81a878a7f4" data-kw="">
<blockquote><p>There are some who think that the only people who turn away from God are those who openly deny that he exists, like the Epicureans, or say that he does not govern human affairs. Others think that “turning away from God” applies only to those people who have given up Christianity for Islam or Judaism.

They are right up to a point, but in this verse Paul shows what turning away from God really means. He accuses the Galatians of having done just that. What exactly had they done? They had accepted the teaching of the false apostles who (as we know very well from the content of this epistle and from Acts 15) taught that unless you are circumcised according to the law of Moses you cannot be saved.

In other words, if you want to receive the forgiveness of sins and salvation, it is not enough merely to believe in Christ. The forgiveness of sins and salvation must also be earned by doing the works of the law. This was the teaching that the Galatians had accepted, and it was on account of that acceptance that Paul accused them of forsaking God and Christ his Son. Those who have turned away from God and been alienated from him are not just those who have abandoned Christianity for the crass idolatry of the pagans, the ungodliness of the Muslims or the superstitions of the Jews, but also those who have put their trust in human works and merits.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-56cb530525" data-kw="">
<blockquote><p>The Testament is no Testament, nor valid in Law, except the Testatator be dead. No man can sue by Law tested goods, if the Testator himself be living. Nor can we have right to a new heart, forgiveness, perseverance, eternal life, to grace and glory, except Christ our Testator had died. But because the Tested goods are more then goods left to us in Testament; they are left to us by such a Testament as is both a Testament and a death perfectly meritorious (this is superadded to the nature of a Testament, and beyond all Testaments) yea a death which is a price to ransom us from the wrath to come; Therefore Christ so dying in our stead, of justice meriteth that the friends should have these goods, though they belong by mere grace and free promise, to the friends. Now this is a most clear ground: Christ hath a well purchased right, by giving a condign price for the goods, and blessings promised in the Covenant of Grace to us: This right he hath by paying a price, laying down his life for us. This buying is not by necessity of nature, of justice but by a voluntary, free and uncompessed agreement and Covenant, John 10. 18. Isaiah 53. 6. No man can exact upon him Psal. 89. 22. (2.) If the Old Testament was confirmed by the blood of beasts, then must the New Testament be confirmed by the blood of Christ prefigured in these. But the Old Testament was so confirmed, Heb. 9. v. 18, 19 20 21, 22, [23.] Ergo now neither Testament nor Covenant was confirmed by blood simply, but by the blood of a living creature slain. 3. Hence the making of a Covenant was by cutting a calf or a beast in twain, and passing between the parts thereof, Jer. 34. 18. and so they entered into a curse, Nehem. 10. 29. devoted themselves to destruction, wishing they might be cut in twain (which is a strange kind of death, Mat. 24. 51. if they should break the Covenant. Hence the Phrase of striking a Covenant. So the Romans slew a Sow: So the Romans and Albani made a Covenant, as Livius. A Herald or Officer at Arms slew the beast, and prayed a curse on the people of Rome, that they might the same way be stricken, if they should break the Covenant. Its like they had it from the Jews. So Christ died to ratify and confirm the Covenant, Exod. 24. 6. This is the blood of the Covenant. Now the Covenant hath no blood, this blood of slain beasts (for it is a figurative speech) is a sign confirming the Covenant that believers shall have remission of sins in that blood of Christ which is shaddowed forth by the blood of these beasts. So Christ the great Shepherd of the flock Heb. 10. 13. is said to be brought from the dead, ἐν αἵματι by the blood of the everlasting Covenant. Junius the Article is understood: Or as the Hebrew Phrase, ב is put for ἐν, as Calvin and Piscator. The question may be, How did God bring Christ again from the death by the blood of the everlasting Covenant, had the blood of Christ any influence to bring himself back from the dead? Or did he, by dying, merit his own resurrection? Ans. Some read the word thus, and shun the Question, The God of peace who brought again from the dead the great sheepherd of the sheep: Understanding, ὀντα, being the great sheepherd or feeder, by the blood of the everlasting Covenant. So Beza, who makes these words ἐν ἅιματι, to be referred to ποιμένα: So as Christs right to be Pastor is in, and by his blood and suffering. And the words, ἐν ἅιματι, so is not to be constructed with the particle, ἀναγαγὼν: But Beza confesseth, that he changed the situation of the words. But if Christ be made a Pastor and feeder of the sheep by the blood of the eternal Covenant: then is he called to be a Pastor by Covenant. And what influence hath his death in his Pastoral Office? Is it by way of merit? Or did Christ merit to himself? Hardly, if not curiously can we say that, though I nothing doubt but Christ gave perfect obedience as man to the Covenant of Works, and he did merit as man, iure operum [by the law of works], life eternal, the way that Adam should have merited life eternal, so he had never fallen….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, (1654; republished 1655), 318–20.</span></figcaption>

rticle%2C+%E1%BC%80%CE%BD%CE%B1%CE%B3%CE%B1%CE%B3%E1%BD%BC%CE%BD%3A+But+Beza+confesseth%2C+that+he+changed+the+situation+of+the+words.+But+if+Christ+be+made+a+Pastor+and+feeder+of+the+sheep+by+the+blood+of+the+eternal+Covenant%3A+then+is+he+called+to+be+a+Pastor+by+Covenant.+And+what+influence+hath+his+death+in+his+Pastoral+Office%3F+Is+it+by+way+of+merit%3F+Or+did+Christ+merit+to+himself%3F+Hardly%2C+if+not+curiously+can+we+say+that%2C+though+I+nothing+doubt+but+Christ+gave+perfect+obedience+as+man+to+the+Covenant+of+Works%2C+and+he+did+merit+as+man%2C+iure+operum+%5Bby+the+law+of+works%5D%2C+life+eternal%2C+the+way+that+Adam+should+have+merited+life+eternal%2C+so+he+had+never+fallen%E2%80%A6.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Covenant+of+Life+Opened+or+A+Treatise+of+the+Covenant+of+Grace%2C+%281654%3B+republished+1655%29%2C+318%E2%80%9320.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F56cb530525.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/56cb530525.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/04/rutherford-meritorious-works-for-adam-and-christ-but-grace-for-us/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>We think, therefore, that congruous merit is founded rather in some dignity of the work than in a promise. For the promises by which God promises pardon to penitents are not such as those by which he promises a crown of glory to those who work well. For the latter contain a true pact, which God makes with man as with a laborer about wages to be paid; but the former do not properly contain a pact about wages to be paid, but an assertion of a thing certainly to come, so that a man may be made secure of obtaining pardon if he repents.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“We think, therefore, that congruous merit is founded rather in some dignity of the work than in a promise. For the promises by which God promises pardon to penitents are not such as those by which he promises a crown of glory to those who work well. For the latter contain a true pact, which God makes with man as with a laborer about wages to be paid; but the former do not properly contain a pact about wages to be paid, but an assertion of a thing certainly to come, so that a man may be made secure of obtaining pardon if he repents.”

— Robert Bellarmine, De Justificatione, bk. 1, ch. 21 (translated from the Latin)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe%20think%2C%20therefore%2C%20that%20congruous%20merit%20is%20founded%20rather%20in%20some%20dignity%20of%20the%20work%20than%20in%20a%20promise.%20For%20the%20promises%20by%20which%20God%20promises%20pardon%20to%20penitents%20are%20not%20such%20as%20those%20by%20which%20he%20promises%20a%20crown%20of%20glory%20to%20those%20who%20work%20well.%20For%20the%20latter%20contain%20a%20true%20pact%2C%20which%20God%20makes%20with%20man%20as%20with%20a%20laborer%20about%20wages%20to%20be%20paid%3B%20but%20the%20former%20do%20not%20properly%20contain%20a%20pact%20about%20wages%20to%20be%20paid%2C%20but%20an%20assertion%20of%20a%20thing%20certainly%20to%20come%2C%20so%20that%20a%20man%20may%20be%20made%20secure%20of%20obtaining%20pardon%20if%20he%20repents.%E2%80%9D%0A%0A%E2%80%94%20Robert%20Bellarmine%2C%20De%20Justificatione%2C%20bk.%201%2C%20ch.%2021%20%28translated%20from%20the%20Latin%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa483e5ffc8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a483e5ffc8.html">Permalink</a><a class="src" href="https://archive.org/details/operaomnia06bell" rel="noopener" target="_blank">Read it online · Internet Archive (Vivès 1873, Latin)</a></div>
</figure><figure class="quote" id="q-14ddf125f9" data-kw="">
<blockquote><p>As to the first question, all Catholics acknowledge that the good works of the just are meritorious of eternal life; but some think these terms de condigno and de congruo should not be used, but that one should say absolutely that the good works of the just are meritorious of eternal life by the grace of God. … Others hold that the good works of the just are meritorious de condigno in a broad sense, so that this condignity, compared with condignity properly taken, may be called congruity, and compared with congruity properly taken, may be called condignity. … But the common opinion of theologians admits condign merit simply. And this opinion is most true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.16 (translated from the Latin)</span></figcaption>

<blockquote><p>9.3 The Covenant Of Works The covenant of works is the pact of God initiated with the uncorrupted Adam, as head of the whole human race, in which He stipulated from man perfect obedience to the law, promised eternal, heavenly life for the same obedience, but threatened eternal death for transgression, and in turn man promised perfect obedience to God who stipulated, which having furnished, he could expect eternal, heavenly life. Scripture testifies that such a covenant existed with Adam. “They…(like Adam) transgressed the covenant” (Hos. 6:7). And God established the sacrament of the same covenant, “the tree of life” (Gen. 2:9). (VII). 9.4. God And Adam Covenanted They were covenanted, God as the Creator, Law-giver, and Rewarder, and Adam as the first man, uncorrupt, and head of the human race. For Adam was the “one blood” in which the whole posterity lay hidden (Acts 17:26), and he was “the first Adam,” equally representing those to be born from his blood, and “the second Adam” represents the faithful; indeed, he is a “type of” the one “to come” (Rom. 5:14). And since the remaining words concern the whole human race, the human race cannot be secluded from the covenant initiated with him. (VIII). 9.10. The Promise Of Heavenly And Eternal Life The promise of the covenant of works was eternal and heavenly life. This sacrament of it, “the tree of life,” by all means true and…(eternal) (Gen. 2:9), sanctioned not only for animals, and the earthly blessings that he already possessed, in which there was no διαθήκη (covenant), but there was προσθήκη (an accession) to the covenant. And when Christ, fulfilling the law in our place, merited eternal and heavenly life for us, He obtained the fulfillment of the same law by merit for us. Indeed, God promised something more in the covenant of works than that of whom could be a sharer outside of that. And it was not other than the translation into heavenly Paradise. (XXIII–XXVI). 10.4. The Stipulation Of God And The Promise Of The Son In this singular pact God the Father demanded from the Son, as Mediator, vicarious obedience to the law for man the sinner, and the Son promised it in turn. “Behold, I come. In the scroll of the book it has been written about me, that I shall do Your will” (Ps. 40:8–9). “Where He placed His soul as sacrifice, He will see a seed” (Isa. 53:10). “This commandment I have received from the Father, that I may place My soul” (John 10:17, 18). “He was born from a woman, gενόμενος ὑπὸ νόμον (born under the law) (Gal. 4:4). Therefore, everywhere Christ comes in the name br[ ἐγτύου and παρακλήτου (of advocate, guarantor), by guaranteeing and promising for another, of the one who receives Him in his faith (Job 33:23, Jer. 30:21, Isa. 38:14, Heb. 7:22). This Sponsor is at the same time is called “Mediator” (1 Tim. 2:5, Heb. 8:6), “Testator” (Heb. 9:15, 16), “High Priest” (Heb. 7:26), “Vindicator” (Job 19:25, Heb 2:16), etc. (VII–XIV). 10.5. The Demand Of The Son The demand of the same Son follows the promise. For as God the Father demanded payment from the Son and promised inheritance for paying, so the Son by promising and furnishing it, acquired the right to claim an inheritance, church, people of His own possession. “Demand from Me, and I will give you the nations as Your inheritance, and the ends of the earth as Your possession” (Ps. 2:8). “Surely My judgment is before the Lord, and…(My works) are a price before My God” (Isa. 49:4). For the promise and obedience of the Son had reason of true merit, even from condignity, for which nothing could be lacking (XIV).</p></blockquote>

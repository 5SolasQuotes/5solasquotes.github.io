<blockquote><p>It galls and torments the devil, to see the church of Christ possessing the pure truths of God. He himself abode not in the truth, and therefore cannot endure to see any abiding in it; and therefore studies by all means to sow the tares of error and corruption in doctrine, whereby the food of the church may be poisoned, and people perverted from the simplicity of the gospel. And, indeed, when once it has entered, it flies like a pestilential wind, corrupting the minds of men.

Manifold melancholy instances might be adduced, both in former ages, and in our own day; but I must not enlarge, that I may win forward to the application. I shall only add, that truth in its purity is such a valuable commodity, that every man is to contend for it as in an agony; for if but the least hoof of it be parted with, we are in danger of loosing the whole, because of the necessary connection of truth in the system of our holy religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The angel s seal set upon God’s faithful servants, when hurtful winds are blowing in the church militant. Being the substance of three sermons preached in the new church of Bristo, at Edinburgh, at, and after the celebration of the sacrament of the Lord’s Supper there, October 10, 11, and 17, 1742’ </cite></span></figcaption>

</figure><figure class="quote" id="q-518aae817d" data-kw="">
<blockquote><p>Therefore I exhorted all men equally in my doctrine, that they should leave the unsure way, and follow that way, which was taught us by our master Christ. He is our only Mediator and makes intercession for us to God his Father. He is the dore by the which we must enter in. He that enters not in by this door, but climbs another way is a thief and murder. He is the verity and life. He that goes out of this way, there is no doubt but he shal fall into the mire: yea verily he is fallen into it already. This is the fashion of my doctrine, the which I have ever followed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-wishart.html">George Wishart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Tragical Death of David Beaton, Bishop of St. Andrews in Scotland, whereunto is joined the martyrdom of master George Wishart</cite>, … (London, 1548) John Knox was a bodyguard to Wishart for a time.</span></figcaption>

</figure><figure class="quote" id="q-3f9311840d" data-kw="">
<blockquote><p>The Reverend Fathers of our Church [of England] call Mr [John] Calvin one of the best writers: A reverend Father, &amp; a worthy ornament of the church of God, not only defending the same doctrine, but also discharging him of slanderous reports wrongfully laid against him, knowing that by defaming the persons of christians, and especially of Ministers, the Devil of old time laboured to overthrow the Gospel of Christ. How greatly all Christian churches are to praise God for that man’s faithful labours, and how instantly therefore all sorts of papists have and do endeavour and strive to diminish his credit, all the Christian world most aboundly both by word and by writing, do testify.

Wherefore we wonder not a little. What moved you [Richard Hooker] to make choice of that worthy pillar of the church above all other, to traduce him and to make him a spectacle before all Christians. Wherefore we crave your favour that with truth and patience you would answer our doubts &amp; scruples which by the preface of your first book you have made in us concerning him. And first, what Master Calvin hath done against our Church, that you should single him out as an adversary: Which of our Reverend Fathers of this land hath wished you thereunto; or else tell us plainly whether our adversaries (in whose mouths you are a most invincible champion) have not provoked you against him?

And open unto us without deceit ingenuously, whether all the learned men of our country, who have written and disputed for discipline, be not too base and mean persons, that on them only so mighty a man should spend his sharp arrows and coals of Juniper? but you will pass over the Seas, and search the sepulchres of the strangers, and finding no man alive worthy your combat, you call Master Calvin out of his sweet bed of rest, and him that is entered into peace, you challenge again into the field. Will no man fit you but he that was (as you bravely affirm) incomparably the wisest man that ever the French church did enjoy, since the hour it did enjoy him, to whom thousands were debtors: and who for his exceeding pains in composing the institutions of Christian Religion, &amp; exposition of holy scripture, gained the advantage of prejudice against all gainsayers following him, and of glory above all that consented to him.

How unlike are you unto that great &amp; mighty Goliath, who defied the whole Host of God, and made challenge of a man out of them all: he was so proud that he demanded but chose not: he sought for one that was alive and vaunted not himself over one that was dead? And here we most instantly beseech you, whether your weapons be the words of righteousness and the faithful pen of truth. Where learned you, and how prove you that Mai. Calvin was the founder of discipline? And herein declare unto us, what moved that Reverend and learned man Mai. D. [John] Whitgift to spend so many leaves to shew that the parts of Discipline might be altered by the civil Magistrate, as serving more fitly for the Apostles time, and the time of persecution, then for us, having the Magistrate to friend, and living in peace and quietness.

If Master Calvin (as the true story reporteth) obtained the consent of the towns men of Geneva, not only by demonstration out of the holy scriptures, but also by shewing the mind of very learned men of his age, out of their writings, as of Oecolampadius, Swinglius, Suychius, Philip, Bucer, Capito and Miconius, who was the founder of the discipline? Where had these notable men their judgement? Did he teach them? or write before them? Was it not one founder even the Lord Christ, the author and builder of his Church, who raised up divers men in divers places, and taught them by the same spirit out of the same holy scripture, the same doctrine and commandment of truth and righteousness?

Shew us also we pray you before our God which searcheth the heart, whether we have not just cause to judge, that in penning this story, you make of Calvin, your purpose were not to deceive your reader by an artificial entwining of some part of the truth with the hollow &amp; glittering thread of your own witty conjectures and peremptory censures; as namely when you begin to tell of the repentance of the people of Geneva, irefully champing upon the bit: you suddenly fall into a discourse of the rising up of those reformed churches; you besprinkle them with likelihood of desire of glory of their own enterprises; you blame then that in that troublesome time they wanted common conference, and that afterwards least they should derogate from their credit, they became ever after resolute to maintained that which they had done, and so leaving the churches all bespotted with levity and self pride, and eased of all conscience and honesty; you closely thrust in Calvin with this word, therefore: that he and his associates (as partners of the same self weening) stiffly refusing to administer the holy Communion, were banished the town.

After speaking of his restoring and re-establishing of Discipline, you have in one place, Many things might lead them &amp;c. And in other place, He rightly considered, &amp;c. This devise I see not how the wisest, &amp;c. And again: This sort it may be, &amp;c. Therefore we pray you to teach us how such might lead &amp; may bees, such entering into his thought and cross commending that for his devise which he simply propounded as out of the Scriptures of God; may not drop into your readers heart such unheeded impressions, as may make him highly admire R. H. great gravity and judicious wisdom and J. Calvin’s carnal policy, fine hypocrisy and peremptory folly. …

We desire you therefore in the name of our Lord Jesus Christ, who shall judge all men at his coming and make manifest the intents &amp; thoughts of the heart, to shew unto us without all artificial glozing whether all this your treatise of Calvin, be not polished armour, and a sharper razor, prepared for the use and help of the enemies of the Gospel, and that it may not rather be called a prejudicial commentary; and a Popish paraphrase; then a story true plain and without partiality, and that men have not just cause to think the better of Maister Calvin and the cause of discipline, when they see so little plain and faithful dealing in your writing. Read therefore his preface before his comment on the Psalmes, and Beza his story of his life, and the French or any other stories or monuments of faithful honest Christians and then answer faithfully the truth and show your honest meaning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian letter of certain English protestants, unfained favourers of the present state of religion, authorised and professed in England: unto that reverend and learned man, Mr R. Hoo[ker] requiring resolution in certain matters of doctrine (which seem to overthrow the foundation of Christian rel</cite>, (Middelburg: Richard Schilders, 1599), pp 37-39, 42.</span></figcaption>

After speaking of his restoring and re-establishing of Discipline, you have in one place, Many things might lead them &amp;c. And in other place, He rightly considered, &amp;c. This devise I see not how the wisest, &amp;c. And again: This sort it may be, &amp;c. Therefore we pray you to teach us how such might lead &amp; may bees, such entering into his thought and cross commending that for his devise which he simply propounded as out of the Scriptures of God; may not drop into your readers heart such unheeded impressions, as may make him highly admire R. H. great gravity and judicious wisdom and J. Calvin’s carnal policy, fine hypocrisy and peremptory folly. …

We desire you therefore in the name of our Lord Jesus Christ, who shall judge all men at his coming and make manifest the intents &amp; thoughts of the heart, to shew unto us without all artificial glozing whether all this your treatise of Calvin, be not polished armour, and a sharper razor, prepared for the use and help of the enemies of the Gospel, and that it may not rather be called a prejudicial commentary; and a Popish paraphrase; then a story true plain and without partiality, and that men have not just cause to think the better of Maister Calvin and the cause of discipline, when they see so little plain and faithful dealing in your writing. Read therefore his preface before his comment on the Psalmes, and Beza his story of his life, and the French or any other stories or monuments of faithful honest Christians and then answer faithfully the truth and show your honest meaning.”

— Andrew Willet, A Christian letter of certain English protestants, unfained favourers of the present state of religion, authorised and professed in England: unto that reverend and learned man, Mr R. Hoo[ker] requiring resolution in certain matters of doctrine (which seem to overthrow the foundation of Christian rel, (Middelburg: Richard Schilders, 1599), pp 37-39, 42.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Reverend+Fathers+of+our+Church+%5Bof+England%5D+call+Mr+%5BJohn%5D+Calvin+one+of+the+best+writers%3A+A+reverend+Father%2C+%26+a+worthy+ornament+of+the+church+of+God%2C+not+only+defending+the+same+doctrine%2C+but+also+discharging+him+of+slanderous+reports+wrongfully+laid+against+him%2C+knowing+that+by+defaming+the+persons+of+christians%2C+and+especially+of+Ministers%2C+the+Devil+of+old+time+laboured+to+overthrow+the+Gospel+of+Christ.+How+greatly+all+Christian+churches+are+to+praise+God+for+that+man%E2%80%99s+faithful+labours%2C+and+how+instantly+therefore+all+sorts+of+papists+have+and+do+endeavour+and+strive+to+diminish+his+credit%2C+all+the+Christian+world+most+aboundly+both+by+word+and+by+writing%2C+do+testify.%0A%0AWherefore+we+wonder+not+a+little.+What+moved+you+%5BRichard+Hooker%5D+to+make+choice+of+that+worthy+pillar+of+the+church+above+all+other%2C+to+traduce+him+and+to+make+him+a+spectacle+before+all+Christians.+Wherefore+we+crave+your+favour+that+with+truth+and+patience+you+would+answer+our+doubts+%26+scruples+which+by+the+preface+of+your+first+book+you+have+made+in+us+concerning+him.+And+first%2C+what+Master+Calvin+hath+done+against+our+Church%2C+that+you+should+single+him+out+as+an+adversary%3A+Which+of+our+Reverend+Fathers+of+this+land+hath+wished+you+thereunto%3B+or+else+tell+us+plainly+whether+our+adversaries+%28in+whose+mouths+you+are+a+most+invincible+champion%29+have+not+provoked+you+against+him%3F%0A%0AAnd+open+unto+us+without+deceit+ingenuously%2C+whether+all+the+learned+men+of+our+country%2C+who+have+written+and+disputed+for+discipline%2C+be+not+too+base+and+mean+persons%2C+that+on+them+only+so+mighty+a+man+should+spend+his+sharp+arrows+and+coals+of+Juniper%3F+but+you+will+pass+over+the+Seas%2C+and+search+the+sepulchres+of+the+strangers%2C+and+finding+no+man+alive+worthy+your+combat%2C+you+call+Master+Calvin+out+of+his+sweet+bed+of+rest%2C+and+him+that+is+entered+into+peace%2C+you+challenge+again+into+the+field.+Will+no+man+fit+you+but+he+that+was+%28as+you+bravely+affirm%29+incomparably+the+wisest+man+that+ever+the+French+church+did+enjoy%2C+since+the+hour+it+did+enjoy+him%2C+to+whom+thousands+were+debtors%3A+and+who+for+his+exceeding+pains+in+composing+the+institutions+of+Christian+Religion%2C+%26+exposition+of+holy+scripture%2C+gained+the+advantage+of+prejudice+against+all+gainsayers+following+him%2C+and+of+glory+above+all+that+consented+to+him.%0A%0AHow+unlike+are+you+unto+that+great+%26+mighty+Goliath%2C+who+defied+the+whole+Host+of+God%2C+and+made+challenge+of+a+man+out+of+them+all%3A+he+was+so+proud+that+he+demanded+but+chose+not%3A+he+sought+for+one+that+was+alive+and+vaunted+not+himself+over+one+that+was+dead%3F+And+here+we+most+instantly+beseech+you%2C+whether+your+weapons+be+the+words+of+righteousness+and+the+faithful+pen+of+truth.+Where+learned+you%2C+and+how+prove+you+that+Mai.+Calvin+was+the+founder+of+discipline%3F+And+herein+declare+unto+us%2C+what+moved+that+Reverend+and+learned+man+Mai.+D.+%5BJohn%5D+Whitgift+to+spend+so+many+leaves+to+shew+that+the+parts+of+Discipline+might+be+altered+by+the+civil+Magistrate%2C+as+serving+more+fitly+for+the+Apostles+time%2C+and+the+time+of+persecution%2C+then+for+us%2C+having+the+Magistrate+to+friend%2C+and+living+in+peace+and+quietness.%0A%0AIf+Master+Calvin+%28as+the+true+story+reporteth%29+obtained+the+consent+of+the+towns+men+of+Geneva%2C+not+only+by+demonstration+out+of+the+holy+scriptures%2C+but+also+by+shewing+the+mind+of+very+learned+men+of+his+age%2C+out+of+their+writings%2C+as+of+Oecolampadius%2C+Swinglius%2C+Suychius%2C+Philip%2C+Bucer%2C+Capito+and+Miconius%2C+who+was+the+founder+of+the+discipline%3F+Where+had+these+notable+men+their+judgement%3F+Did+he+teach+them%3F+or+write+before+them%3F+Was+it+not+one+founder+even+the+Lord+Christ%2C+the+author+and+builder+of+his+Church%2C+who+raised+up+divers+men+in+divers+places%2C+and+taught+them+by+the+same+spirit+out+of+the+same+holy+scripture%2C+the+same+doctrine+and+commandment+of+truth+and+righteousness%3F%0A%0AShew+us+also+we+pray+you+before+our+God+which+searcheth+the+heart%2C+whether+we+have+not+just+cause+to+judge%2C+that+in+penning+this+story%2C+you+make+of+Calvin%2C+your+purpose+were+not+to+deceive+your+reader+by+an+artificial+entwining+of+some+part+of+the+truth+with+the+hollow+%26+glittering+thread+of+your+own+witty+conjectures+and+peremptory+censures%3B+as+namely+when+you+begin+to+tell+of+the+repentance+of+the+people+of+Geneva%2C+irefully+champing+upon+the+bit%3A+you+suddenly+fall+into+a+discourse+of+the+rising+up+of+those+reformed+churches%3B+you+besprinkle+them+with+likelihood+of+desire+of+glory+of+their+own+enterprises%3B+you+blame+then+that+in+that+troublesome+time+they+wanted+common+conference%2C+and+that+afterwards+least+they+should+derogate+from+their+credit%2C+they+became+ever+after+resolute+to+maintained+that+which+they+had+done%2C+and+so+leaving+the+churches+all+bespotted+with+levity+and+self+pride%2C+and+eased+of+all+conscience+and+honesty%3B+you+closely+thrust+in+Calvin+with+this+word%2C+therefore%3A+that+he+and+his+associates+%28as+partners+of+the+same+self+weening%29+stiffly+refusing+to+administer+the+holy+Communion%2C+were+banished+the+town.%0A%0AAfter+speaking+of+his+restoring+and+re-establishing+of+Discipline%2C+you+have+in+one+place%2C+Many+things+might+lead+them+%26c.+And+in+other+place%2C+He+rightly+considered%2C+%26c.+This+devise+I+see+not+how+the+wisest%2C+%26c.+And+again%3A+This+sort+it+may+be%2C+%26c.+Therefore+we+pray+you+to+teach+us+how+such+might+lead+%26+may+bees%2C+such+entering+into+his+thought+and+cross+commending+that+for+his+devise+which+he+simply+propounded+as+out+of+the+Scriptures+of+God%3B+may+not+drop+into+your+readers+heart+such+unheeded+impressions%2C+as+may+make+him+highly+admire+R.+H.+great+gravity+and+judicious+wisdom+and+J.+Calvin%E2%80%99s+carnal+policy%2C+fine+hypocrisy+and+peremptory+folly.+%E2%80%A6%0A%0AWe+desire+you+therefore+in+the+name+of+our+Lord+Jesus+Christ%2C+who+shall+judge+all+men+at+his+coming+and+make+manifest+the+intents+%26+thoughts+of+the+heart%2C+to+shew+unto+us+without+all+artificial+glozing+whether+all+this+your+treatise+of+Calvin%2C+be+not+polished+armour%2C+and+a+sharper+razor%2C+prepared+for+the+use+and+help+of+the+enemies+of+the+Gospel%2C+and+that+it+may+not+rather+be+called+a+prejudicial+commentary%3B+and+a+Popish+paraphrase%3B+then+a+story+true+plain+and+without+partiality%2C+and+that+men+have+not+just+cause+to+think+the+better+of+Maister+Calvin+and+the+cause+of+discipline%2C+when+they+see+so+little+plain+and+faithful+dealing+in+your+writing.+Read+therefore+his+preface+before+his+comment+on+the+Psalmes%2C+and+Beza+his+story+of+his+life%2C+and+the+French+or+any+other+stories+or+monuments+of+faithful+honest+Christians+and+then+answer+faithfully+the+truth+and+show+your+honest+meaning.%E2%80%9D%0A%0A%E2%80%94+Andrew+Willet%2C+A+Christian+letter+of+certain+English+protestants%2C+unfained+favourers+of+the+present+state+of+religion%2C+authorised+and+professed+in+England%3A+unto+that+reverend+and+learned+man%2C+Mr+R.+Hoo%5Bker%5D+requiring+resolution+in+certain+matters+of+doctrine+%28which+seem+to+overthrow+the+foundation+of+Christian+rel%2C+%28Middelburg%3A+Richard+Schilders%2C+1599%29%2C+pp+37-39%2C+42.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3f9311840d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3f9311840d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/03/12/andrew-willet-in-defence-of-john-calvin/"

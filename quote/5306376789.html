<main class="wrap"><figure class="quote" id="q-5306376789" data-kw="">
<blockquote><p>Come not into the company of a whorish woman ; avoid her house, as a seaman does a rock, Prov. 5:8, “Come not near the door of her house.” He who would not have the plague, must not come near houses infected; every whore-house has the plague in it. Not to beware of the occasion of sin, and yet pray, “Lead us not into temptation,” is, as if one should put his finger into the candle, and yet pray that it may not be burnt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Divinity, ‘Of Sanctification’</cite>, on the 7th Commandment</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>
<div class="actions"><button class="copy" data-copy="“Come not into the company of a whorish woman ; avoid her house, as a seaman does a rock, Prov. 5:8, “Come not near the door of her house.” He who would not have the plague, must not come near houses infected; every whore-house has the plague in it. Not to beware of the occasion of sin, and yet pray, “Lead us not into temptation,” is, as if one should put his finger into the candle, and yet pray that it may not be burnt.”

<blockquote><p>Certan it is, the first and principal cause may be called, and is a scourge and punischment of the most just God, without whose disposition in all things, other second causes work no thing. So the Heaven, which is the admirable instrument of God, blows that contagion upon the face of the Earth.</p></blockquote>

</figure><figure class="quote" id="q-9e80044434" data-kw="">
<blockquote><p>And here comes in the way that general bond wherewith man is especially bound unto man, and that without taking away of humanity itself, cannot be broken; There is also another bond binding every citizen unto his country and city. But both these bonds I affirm to be natural and universal, that everyone must have regard of his estate, and calling; for some serve in public offices, either civil, or the ministry; the rest are private persons… …yet, lest in this case [of flight], any man by flattering of himself, might sin against his neighbour [in neglecting his duty towards him], it is the duty of a Christian magistrate to provide that those things which either breed or nourish the plague, so far as they may, be taken away, and that regard may be had of those that be visited with this sickness, that all be not driven to be careful for all. … But if in such calamities the magistrate do not in time provide, as much as may be, both by such lawful means as are not repugnant unto Christian charity, that the infection may be prevented, and also that the sick of the plague want [lack] nothing…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned Treatise of the Plague</cite>, … (London, 1580; rep. 1665), p. 18</span></figcaption>

</figure><figure class="quote" id="q-902bad45c9" data-kw="">
<blockquote><p>During the period to which this volume relates, the magistrates and council seem to have usually met twice a-week, on Wednesdays and Fridays, at ten o’clock… On 19th May 1585, it was resolved, in consideration of the apparent increase of the plague, that the council should meet every day after prayers and sermon…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/city-of-edinburgh.html">City of Edinburgh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Preface’, in Extracts From the Records of the Burgh of Edinburgh</cite>, 1573-1589, ed. J D Marwick (Edinburgh, 1882), pp. lvii-lxxx. British History Online</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-76272074f7" data-kw="">
<blockquote><p>6. They [magistrates] must command such order to be observed or kept among the citizens that all public assemblies be avoided, as marriages, games, dancings, [public] baths, common fairs, pompous funerals or burials. Church assemblies may be used, if they be divided into diverse places, that they come not together in great heaps, and sit close one by another. Great schools are to be removed into a place and air more convenient: lesser schools, and for children, are so long to be shut up until the sickness cease raging.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection in the Time of the Plague or Pestilence, Two Books</cite>, (London, 1583), bk. 2, ch. 10, p. 168</span></figcaption>

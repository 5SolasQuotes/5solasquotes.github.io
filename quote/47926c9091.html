<main class="wrap"><figure class="quote" id="q-47926c9091" data-kw="">
<blockquote><p>And what further authority, or proceedings purely ecclesiastical, of one, or many sister Churches towards another whole Church, or Churches offending, either the Scriptures do hold forth, or can rationally be put in execution (without the magistrates interposing a power of another nature, unto which we upon his particular cognizance, and examination of such causes, profess ever to submit, and also to be most willing to have recourse unto) for our parts we saw not then, nor do yet see… And if the magistrate’s power (to which we give as much, and (as we think) more, than the principles of the presbyterial government will suffer them to yield) do but assist and back the sentence of other Churches denouncing this non-communion [of Independent churches] against Churches miscarrying, according to the nature of the crime, as they judge meet…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/goodwin-nye-simpson-burroughs-bridge.html">Goodwin, Nye, Simpson, Burroughs, Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apologetical Narration, Humbly Submitted to the Honourable Houses of Parliament</cite>, (London [1643]), pp. 17, 19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d3f66e3725" data-kw="">
<blockquote><p>III. …to be elected by virtue of this constitution, they shall jointly in the house of representatives choose… a governor and commander-in-chief, a lieutenant-governor… and a privy council, all of the Protestant religion… … XII. …and that no person shall be eligible to a seat in the said senate unless he be of the Protestant religion… XIII. …No person shall be eligible to sit in the house of representatives unless he be of the Protestant religion… XXXVIII. That all persons and religious societies who acknowledge that there is one God, and a future state of rewards and punishments, and that God is publicly to be worshipped, shall be freely tolerated. The Christian Protestant religion shall be deemed and is hereby constituted and declared to be, the established religion of this State. That all denominations of Christian Protestants in this State, demeaning themselves peaceably and faithfully, shall enjoy equal religious and civil privileges… …And that whenever fifteen or more male persons, not under twenty-one years of age, professing the Christian Protestant religion, and agreeing to unite themselves in a society for the purposes of religious worship, they shall (on complying with the terms hereinafter mentioned) be, and be constituted a church, and be esteemed and regarded in law as of the established religion of the State, and on a petition to the legislature shall be entitled to be incorporated and to enjoy equal privileges. …each society so petitioning shall have agreed to and subscribed in a book the following five articles, without which no agreement or union of men upon pretence of religion shall entitle them to be incorporated and esteemed as a church of the established religion of this State: 1st. That there is one eternal God, and a future state of rewards and punishments. 2nd. That God is publicly to be worshipped. 3rd. That the Christian religion is the true religion. 4th. That the holy scriptures of the Old and New Testaments are of divine inspiration, and are the rule of faith and practice. 5th. That it is lawful and the duty of every man being thereunto called by those that govern, to bear witness to the truth.</p></blockquote>

<blockquote><p>Drawing on principles of contract law developed by jurists and theologians from the School of Salamanca [Spain], the Jesuit controversialist Martinus Becanus (1563–1624) argues in favor of the duty to honor promises beyond confessional boundaries [contra the normal Roman position]… In particular circumstances the toleration of religious diversity may not only prevent greater evil, but also advance the greater good, especially by stimulating a kind of pious competition between confessional communities. This first English translation… [is] a major work of one of the most prominent advocates of a permission concept of tolerance in the early modern period.</p></blockquote>

<blockquote><p>4. We may add this consideration, that hitherto toleration of errors and diversity of corrupt opinions have ever been looked upon, and made use of, as a most subtle means for undermining and destroying of the Church. It is marked of that skillful enemy of the Kingdom of Jesus Christ, Julian [A.D. 331-363], that having improven his subtilty to the utmost to find out means to destroy the Church by craft, which his predecessors by violence could not obtain, amongst other means he concluded this: Not to raise open persecution but to give liberty to all the differing bishops and teachers (which then, after the Council of Nicea and Constantine’s death, were very many and bitter in their differences) to follow their own way, and to vent their own opinions without all fear of any restraint: and therefore did call them that he might make intimation thereof to them for their further encouragement therein; The words which he used to them, as they are marked by Ammianus and cited by Lodovicus Molineus (p. 560) are: Ut consopitis civilibus discordiis, suae quisque Religioni serviret intrepidus, that is, in sum, That everyone forbearing civil discords, should worship in his own religion without control or fear: And is it like, that this shall prove a mean useful for the good of the Church, which that expert child of the devil did make use of to destroy the same?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, ... (1659), pt. 3, ch. 13, p. 247</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

1b9790a3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/toleration/#:~:text=4.%20We%20may%20add%20this%20consideration,use%20of%20to%20destroy%20the%20same&amp;text=4.%20We%20may%20add%20this%20consideration%2C%20that%20hitherto&amp;text=did%20make%20use%20of%20to%20destroy%20the%20same" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>33. That, as it is the duty of every man to worship God in such a manner as he thinks most acceptable to Him; all persons, professing the Christian religion, are equally entitled to protection in their religions liberty… the Legislature may, in their discretion, lay a general and equal tax, for the support of the Christian religion… And all acts of Assembly, lately passed, for collecting monies for building or repairing particular churches or chapels of ease, shall continue in force, and be executed… …and every encumbent of the church of England, who has remained in his parish, and performed his duty, shall be entitled to receive the provision and support established by the act, entitled ‘An act for the support of the clergy of the church of England, in this Province,’… …

35. That no other test or qualification ought to be required on admission to any office of trust or profit, than such oath of support and fidelity to this State, and such such oath of office, as shall be directed by this Convention, or the Legislature of this State, and a declaration of a belief in the Christian religion.

36. That the manner of administering an oath to any person, ought to be such, as those of the religious persuasion, profession, or denomination, of which such person is one, generally esteem the most effectual confirmation, by the attestation of the Divine Being…</p></blockquote>

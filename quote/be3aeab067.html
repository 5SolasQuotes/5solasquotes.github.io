</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f074ea804b" data-kw="">
<blockquote><p>45. The second difference [between civil and church power] is in the object, or matter about which: The power politic or civil is occupied about the outward man and civil or earthly things, about war, peace, conservation of justice and good order in the commonwealth; also about the outward business or external things of the Church, which are indeed necessary to the Church, or profitable, as touching the outward man, yet not properly and purely spiritual, for they do not reach unto the soul, but only to the external state and condition of the ministers and members of the Church.

46. For the better understanding whereof, tis to be observed that so far as the ministers and members of the Church are citizens, subjects or members of the commonwealth, it is in the power of the Magistrate to judge, determine and give sentence concerning the disposing of their bodies or goods; As also concerning the maintenance of the poor, sick, the banished and of others in the Church which are afflicted; To regulate (so far as concerns the civil order) marriages, burials, and other circumstances which are common both to holy and also to honest civil societies; to afford places fit for holy assemblies and other external helps by which the sacred matters of the Lord may be more safely, commodiously and more easily in the Church performed: To remove the external impediments of divine worship or of ecclesiastical peace, and to repress those which exalt themselves against the true Church and her Ministers, and do raise up trouble against them. … 66. Fourthly, they [the Church and magistrate] differ in the[ir] end [design]: The immediate nearest end of civil power is that the good of the commonwealth may be provided for and procured, whether it be in time of peace, according to the rules of law and counsel of judges; or in time of war according to the rules of military prudence; and so the temporal safety of the subjects may be procured, and that external peace and civil liberty may be preserved, and being lost may be again restored.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 111 Propositions… (Edinburgh, 1647), #45-46</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-678f7064e9" data-kw="">
<blockquote><p>…hereafter we must see concerning the selling and buying of things necessary… it is a thing doubtless greatly material that not only things hurtful be not brought into the city, but also the things good and profitable should be brought, but with such a proviso that the things that are to be brought in be set abroad and sold with least danger. Here therefore laws are to be made [of] what kinds of meats [foods] may be lawful to be sold and what not… and a certain penalty by the Preservers [civil health officials appointed for the time of the plague] to be set upon the offenders. … Lastly, also as touching the place wherein all things pertaining unto meat and drink are to be sold, something must be added. For it seems not convenient that all things should be brought into one market. For so it must needs be that a mighty multitude of people should come together… the infection must with all diligence be shunned, as has been often said already. There must therefore be ordained many places in sundry parts of the city where those things must be set which pertain unto food and are needful for everyone. Let there also be a several [different] market for flesh and fish, for herbs and fruits, that all discommodities which may arise by the mingling together of a multitude of people and bringing of things sellable, may with all diligence be avoided.</p></blockquote>

</figure><figure class="quote" id="q-b422c05a73" data-kw="">
<blockquote><p>5. An appellation is one thing, and the complaint of an oppressed man is another thing; or a provocation to a competent judge is one thing, and the refugium, the refuge and fleeing of an oppressed man to a higher power is another thing; if the Church err and fail against the Law of Christ in the matter, and decree the man to be a heretic, who is none, and that to be heresy which is truth, the oppressed man in a constituted Church may have his refuge to the godly Magistrate and complain, but he cannot appeal, for an appellation is from an erring judge to an higher judge, in eadem serie, in the same nature and kind of judicatures… but a complaint may be made to the Magistrate; if the Church fail in their judging, the Magistrate is to command the Church to judge it over again, but the Magistrate cannot judge it himself; as there is a complaint made to the Magistrate that the printer has not drawn the image exactly, according to the samplar: the Magistrate judges not of the art of the painter, nor can the Magistrate as the Magistrate draw the image himself; But the Magistrate may judge of the painter’s breach of promise who did the action to draw it exactly according to the samplar, and has not kept faith to the man who pays him wages; and therefore the Magistrate may either punish his moral error, his breach of promise, not his error of art (the faculty or company of painters must judge of that) or then command the painter to paint the same image again, according as the painter convenanted. But it may be objected, ‘You then make the Magistrate to meddle no more with matters of faith and preaching truth or falsehood, and giving out Ecclesiastical rules in Church government, as Acts 15, then he meddles with painting according to the principles of art; now painting according to art belongs not at all to the conscience of the Magistrate, but sound preaching, right ruling in God’s house, belongs in a far nearer relation to the conscience of the godly Magistrate.’ I Answer: As touching the formal judging Ecclesiastically… it no more belongs to him as a Magistrate… But in another consideration, as [the] sound or unsound dispensing of Word and Sacraments, as right or unjust ruling in the house of God, may more or less hurt or benefit the souls of men, which he is to care for indirectly, in ordine ad penas vel premia civilia et corporalia [in the order of civil and corporal penalties or rewards], it belongs more to the Magistrate to take care of the Church, of religion, of preaching and governing God’s House, than any painting or arts in the earth. Again, the Church proceeding in these things that are against common justice in all judicatures, no less then in the Church, as to condemn the party never heard, or not convinced [convicted] either by confession, or under two sufficient witnesses, or to do manifest injustice in the manner of proceeding, leaves a clear place to the wronged party, by the Law of Nature, if not to appeal, yet to flee and have re-course to the Christian Magistrate, who is Parens Patrie, the father of the Commonwealth. … 7. …Or, 2. the godly Magistrate would command that the Church would impartially proceed to right an oppressed man, as Cabeljavius says [Pieter Cabeljauw, c.1608-1668, who was reformed] (De Lib. Eccles., ch. 9, pp. 134-35) . Or, 3. when there is no synods to be had, then as [Jacob] Triglandius says well from Beza, the Christian Magistrate may provide fit means of relieving the oppressed. (Trigland, De Civili &amp; Ecclesiastic. Potest., ch. 20, pp. 420-21)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), p. 580-82</span></figcaption>

+principles+of+art%3B+now+painting+according+to+art+belongs+not+at+all+to+the+conscience+of+the+Magistrate%2C+but+sound+preaching%2C+right+ruling+in+God%E2%80%99s+house%2C+belongs+in+a+far+nearer+relation+to+the+conscience+of+the+godly+Magistrate.%E2%80%99+I+Answer%3A+As+touching+the+formal+judging+Ecclesiastically%E2%80%A6+it+no+more+belongs+to+him+as+a+Magistrate%E2%80%A6+But+in+another+consideration%2C+as+%5Bthe%5D+sound+or+unsound+dispensing+of+Word+and+Sacraments%2C+as+right+or+unjust+ruling+in+the+house+of+God%2C+may+more+or+less+hurt+or+benefit+the+souls+of+men%2C+which+he+is+to+care+for+indirectly%2C+in+ordine+ad+penas+vel+premia+civilia+et+corporalia+%5Bin+the+order+of+civil+and+corporal+penalties+or+rewards%5D%2C+it+belongs+more+to+the+Magistrate+to+take+care+of+the+Church%2C+of+religion%2C+of+preaching+and+governing+God%E2%80%99s+House%2C+than+any+painting+or+arts+in+the+earth.+Again%2C+the+Church+proceeding+in+these+things+that+are+against+common+justice+in+all+judicatures%2C+no+less+then+in+the+Church%2C+as+to+condemn+the+party+never+heard%2C+or+not+convinced+%5Bconvicted%5D+either+by+confession%2C+or+under+two+sufficient+witnesses%2C+or+to+do+manifest+injustice+in+the+manner+of+proceeding%2C+leaves+a+clear+place+to+the+wronged+party%2C+by+the+Law+of+Nature%2C+if+not+to+appeal%2C+yet+to+flee+and+have+re-course+to+the+Christian+Magistrate%2C+who+is+Parens+Patrie%2C+the+father+of+the+Commonwealth.+%E2%80%A6+7.+%E2%80%A6Or%2C+2.+the+godly+Magistrate+would+command+that+the+Church+would+impartially+proceed+to+right+an+oppressed+man%2C+as+Cabeljavius+says+%5BPieter+Cabeljauw%2C+c.1608-1668%2C+who+was+reformed%5D+%28De+Lib.+Eccles.%2C+ch.+9%2C+pp.+134-35%29+.+Or%2C+3.+when+there+is+no+synods+to+be+had%2C+then+as+%5BJacob%5D+Triglandius+says+well+from+Beza%2C+the+Christian+Magistrate+may+provide+fit+means+of+relieving+the+oppressed.+%28Trigland%2C+De+Civili+%26+Ecclesiastic.+Potest.%2C+ch.+20%2C+pp.+420-21%29%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%E2%80%A6+%281646%29%2C+p.+580-82&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb422c05a73.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b422c05a73.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-civil-magistrates-just-authority-for-quarantining-and-restraining-the-congregating-of-citizens-even-the-church-with-sufficient-natural-warrant/#:~:text=5.%20An%20appellation%20is%20one%20thing,Ecclesiastic.%20Potest.%2C%20ch.%2020%2C%20pp.%20420%2D21&amp;text=5.%20An%20appellation%20is%20one%20thing%2C%20and%20the&amp;text=Civili%20%26%20Ecclesiastic.%20Potest.%2C%20ch.%2020%2C%20pp.%20420%2D21" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>In 1849, a cholera epidemic was raging throughout the United States. Not long after former President James K. Polk died of the disease in June, President Zachary Taylor declared a national day of fasting and prayer to be observed on August 3, 1849. E.D. McMaster, in his final days as President of Miami University in Ohio, preached a sermon that day titled Impending Judgments Averted by Repentance.” – Andrew Myers, ‘National Judgments Call for National Repentance: E.D. McMaster’; see here for more background info. Henry, Symmes C. – The Pestilence, a Divine Visitation: a Sermon preached August the Third, 1849, the Day of the National Fast Ref (1849) Symmes was a presbyterian minister in New Jersey. On the 1855 epidemic of Yellow Fever in America Armstrong, George D. – ‘The Lesson of the Pestilence’ (1855) on Heb. 12:10 About the yellow-fever epidemic in 1855 in Norfolk, Virginia, and in America generally. Armstrong was a presbyterian pastor. Cummins, George David – ‘The Pestilence: God’s Messenger and Teacher’ (1855) on Num. 16:46 About the yellow-fever epidemic in Norfolk, Virginia. Cummins (1822-1876) was an American Anglican Bishop and founder of the Reformed Episcopal Church. He was a staunch evangelical of reformed doctrine and he opposed the influences of ritualism and the Anglo-Catholic Oxford Movement. Storrs, Richard S. – ‘Terrors of the Pestilence’ (1855) on Eccl. 9:12 Storrs (1821-1900) was a conservative, congregational minister of the Church of the Pilgrims in Brooklyn, NY. Handy, Isaac W.K. – ‘The Terrible Doings of God’ (1855) Handy was a confederate, presbyterian pastor who was a graduate of Princeton Theological Seminary. He preached this sermon in a baptist church upon the occasion of 28 members of a Masonic Lodge dying in the recent epidemic in Virginia. A book of his, about his being imprisoned by the Union in the North, has been reprinted by Sprinkle Publications. . Breed, William P. – II. ‘The Great Plague’ in Under the Oak (Philadelphia: Presbyterian Board of Publication, 1866), pp. 19-85 ‘Under the oak’ refers to Rev. Breed (1816-1889) sitting and talking with children on Sabbath afternoons under an oak. This story is for children, but contains much spiritual help on the topic. “A good many years ago, in a town in India, a hundred miles north of Calcutta, a man suddenly fell sick…</p></blockquote>

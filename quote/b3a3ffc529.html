<main class="wrap"><figure class="quote" id="q-b3a3ffc529" data-kw="">
<blockquote><p>Youth could also perform comedies and tragedies, and by such means a useful form of entertainment, honorable and contributing toward an increase of piety, may be staged for the people; but it will be necessary that devout and wise men experienced in the Kingdom of Christ compose these comedies and tragedies, in which there may be presented on the stage the plans, actions and events of mankind, whether common and ordinary as it occurs in compedies or unique and eliciting admiration as it is characteristic of tragedies. All this will contribute toward a correction of morals and a pious orientation to life (Aristotle, Poetics II, 1448a). … It must be observed, however, that when in both kinds of poetic material, comic and tragic, the activities and sins of men are described and actively presented to be seen with the eyes, it should be done in such a way that although the crimes of reprobate men are related, yet a certain terror of divine judgment and horror of sin should appear in these things, and a shameless daring and an exultant delight in crimes should not be expressed. It is better here to take something away from poetic fitness rather than from the concern for edifying the piety of the spectators, which demands that in every representation of sin there be felt the condemnation of one’s conscience and the horrible fear of God’s judgment. But when pious and good actions are shown, they should express as clearly as possible a happy, secure and confident sense of the divine mercy, but moderate and diffident as regards the self, and a joyful trust in God and his promises, with holy and spiritual pleasure in doing good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 349-52 of ch. 54, ‘Honest Games’ in On the Reign of Christ, bk. 2 in Melanchthon &amp; Bucer, ed. Wilhelm Pauck (Philadelphia: Westminster Press, 1969)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-55ed48034e" data-kw="">
<blockquote><p>For I conceive my self, though by many degrees inferior to Timothy, yet in some measure to lie under St. Paul’s double charge to him (1 tim. 6:20), first [Greek], to keep the precious truth committed to my trust, and then what I have been sufficiently taught and assured of, to commit the same unto faithful men, who shall be able to teach others also (2 Tim. 2). Thus far I allow tradition of the faith once delivered to the saints, though it be not infallible, unchangeable and incorruptible, either by the course of nature or by the promise of grace to any particular race or succession of men, yet to be a duty required of ministers, and a means to propagate the truth; whether that delivery be transacted by word of mouth, which is transient, or by writing, which is permanent, as now I transmit, what I have received.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-gataker.html">Charles Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Preface in Thomas Gataker, An Antidote Against Error Concerning Justification… (d. 1654; London: Brome, 1670)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-4a2f105d7d" data-kw="">
<blockquote><p>Moreover, as we may not use any indifferent thing at our own pleasure; so neither may the Church at her will and pleasure command the use of it: but as our practice, so the Church’s injunction must be determined and squared according to the former [three] rules [of using indifferent things (1) to the glory of God, (2)according to the law of charity and (3) purity of conscience]. And if any man think, that in the use of things indifferent he may be led and ruled by the Church’s determination without examining any further, let him understand that the Church’s determination is but a subordinate rule, or a rule ruled by higher rules. … He [Dr. Forbes] has been speaking of the rules which God’s Word gives us concerning the use of things indifferent, and all of them he comprehends under this rule, that we should hear the Church and obey them who are set over us, as if God’s rules were subordinate to men’s rules and not theirs to his. We say not that every man may use things indifferent suo arbitratu [according to his judgment]: but we say withal that neither may the Church command the use of things indifferent, suo arbitratu. Both, she in commanding and we in obeying, must be guided by the rules of Scripture. They who are set over us in the Church have no power given them of Christ which is not for edifying, Eph. 4:12. The council of the apostles and elders at Jerusalem (which is a lively pattern of a lawful synod to the world’s end) professed they would lay no other burden upon the disciples except such things as the law of charity made necessary for shunning of scandal: and so that which they decreed had force and strength to bind, a Charitate propter Scandalum [from charity due to scandal], says Sanctius. But suo arbitratu [by their (mere) judgment] they enjoined nothing. It appears by this place (says [Thomas] Cartwright) that there may be no abridgment of liberty simply decreed, but in regard of circumstance, according to the rule of edification. And if the Church’s decrees and canons be not according to the rules of the Word, yet forasmuch as everyone of us shall give account of himself and his own deed, we must look that whatsoever the Church decree, yet our practice in the use or omission of a thing indifferent, be according to the foresaid rules. We may not for the commandment of men transgress the rule of piety by doing anything which is not for God’s glory and ordered according to his will; neither ought any of us to obey men, except for the Lord’s sake and as the servants of Christ, doing the will of God; which teaches us the manner how we ought to obey men, namely, propter Christum et sicut Christus praecipit [for Christ, as Christ commands]. For if we should know no more but the will of man for that which we do, then we should be the servants of men, not the servants of Christ. Neither yet may we for any human ordinance break the rule of charity: but whatsoever either would weaken or not edify our brother, be it never so lawful, never so profitable to ourselves, never so powerfully by earthly authority enjoined, Christians, who are not born unto themselves, but unto Christ, unto his Church and unto the fellow members, must not dare to meddle with it. Nor lastly may we obey men so as to break the Law of Purity, and perform any action with a doubtful conscience, that is, whereof either the Word has not, or we out of it have no warrant: in which case tender consciences must be tendered, rather than be racked by authority: for be the things in themselves never so lawful, etc., they are utterly unlawful to me without such information. Whereas therefore some say that in the use of matters indifferent, the laws of those who are set over us ought to rule us; we still answer that our practice may not be ruled by any law of man except it be according to the rules of the Word; whereof one is this: Tantum oportere esse obedientiae studium in Christianis, ut nihil agant, quod non existiment vel potius certi sint placere Deo (Calvin on Rom. 14:5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, ... ([Leiden] 1637), pt. 4, ch. 3, pp. 10-11</span></figcaption>

y+unlawful+to+me+without+such+information.+Whereas+therefore+some+say+that+in+the+use+of+matters+indifferent%2C+the+laws+of+those+who+are+set+over+us+ought+to+rule+us%3B+we+still+answer+that+our+practice+may+not+be+ruled+by+any+law+of+man+except+it+be+according+to+the+rules+of+the+Word%3B+whereof+one+is+this%3A+Tantum+oportere+esse+obedientiae+studium+in+Christianis%2C+ut+nihil+agant%2C+quod+non+existiment+vel+potius+certi+sint+placere+Deo+%28Calvin+on+Rom.+14%3A5%29.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+A+Dispute+Against+the+English-Popish+Ceremonies...+%28%5BLeiden%5D+1637%29%2C+pt.+4%2C+ch.+3%2C+pp.+10-11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4a2f105d7d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4a2f105d7d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-arbitrary-laws-commands/#:~:text=Moreover%2C%20as%20we%20may%20not%20use,placere%20Deo%20%28Calvin%20on%20Rom.%2014%3A5&amp;text=Moreover%2C%20as%20we%20may%20not%20use%20any%20indifferent&amp;text=certi%20sint%20placere%20Deo%20%28Calvin%20on%20Rom.%2014%3A5" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…the question is, Why the bread is called Christ’s body and the cup Christ’s blood: that is, why the things signified are attributed to the signs, and the signs called by their name. There are two causes alleged hereof:

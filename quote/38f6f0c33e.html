<main class="wrap"><figure class="quote" id="q-38f6f0c33e" data-kw="">
<blockquote><p>The third kind of plays are mixed, which stand partly of hazard, and partly of wit, and in which hazard begins the game, and skill gets the victory: and that which defective by reason of hazard, is corrected by wit. To this kind are referred some games at the cards and tables. Now the common opinion of learned Divines is, that as they are not to be commended, so they are not simply to be condemned, and if they be used, they must be used very sparingly. Yet there be others that hold these mixed games to be unlawful, and judge the very dealing of the cards to be a lot, because it is a mere casual action. But (as I take it) the bare dealing of the cards is no more a lot, than the dealing of an alms, when the Prince’s almner puts his hand into his pocket, and gives, for example, to one man six pence, to another twelve pence, to another two pence, what comes forth without any choice. Now this casual distribution is not a lot, but only a casual action. And in a lot there must be two things. The first is, a casual act: the second, the applying of the foresaid act, to the determination of some particular and uncertain event. Now the dealing of the cards is a casual act; but the determination of the uncertain victory is not from the dealing of the cards in mixed games, but from the wit and skill, at least from the will of the players. But in things that are of the nature of a lot, the wit and will and a man has no stroke at all. Nevertheless, though the dealing of the cards and mixed games be no lots; yet it is far safer and better to abstain from them, than to use them, and where they are abolished, they are not to be restored again, because in common experience, many abuses and inconveniences attend upon them: and things unnecessary, when they are much abused, because they are abused, they must not be used, but rather removed, as the brazen serpent was, 2 Kings 18:4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Treatise of the Cases of Conscience</cite>, … (Cambridge, 1606), bk. 3, ch. 4, section 4, Question 2, ‘What kinds of recreations and sports are lawful and convenient, and what be unlawful and inconvenient?’, pp. 591-92 Perkins (1558–1602) was a leading English puritan.</span></figcaption>

<blockquote><p>§8. Question 3. Is a man obliged by a contract which he made in ignorance or mistake of the matter? Answer: I have answered this before in the case of marriage, pt. 2, ch. 1. I add here, we must distinguish: 1. Between culpable and inculpable error; 2. Between an error about the principal matter and about some smaller accidents or circumstances; 3. Between a case where the law of the Land, or the common good interposes and where it does not. 1. If it be your own fault that you are mistaken, you are not wholly freed from the obligation: But if it was your gross fault, by negligence or vice, you are not at all freed. But if it were but such a frailty as almost all men are liable to, so that none but a person of extraordinary virtue or diligence could have avoided the mistake, then equity will proportionably make you an abatement or free you from the obligation. So far as you were obliged to understand the matter, so far you are obliged by the contract; especially when another is a loser by your error. 2. An inculpable error about the circumstances or smaller parts will not free you from an obligation in the principal matter: But an inculpable error in the essentials will. 3. Except when the law of the land or the common good, does otherwise overrule the case: For then you may be obliged by that accident. In diverse cases the rulers may judge it necessary, that the effect of the contract shall depend upon the bare words or writings, or actions; lest false pretenses of misunderstanding should exempt deceitful persons from their obligations and nothing should be a security to contractors. And then men’s private commodity must give place to the law and to the public good. 4. Natural infirmities must be numbered with faults, though they be not moral vices, as to the contracting of an obligation, if they be in a person capable of contracting. As if you have some special defect of memory, or ignorance of the matter which you are about! Another who is no way faulty by over-reaching you, must not be a loser by your weakness. For he that comes to the market, or contracts with another who knows not his infirmity, is to be supposed to understand what he does, unless the contrary be manifest: You should not meddle with matters which you understand not: Or if you do, you must be content to be a loser by your weakness. 5. Yet in such cases, another that has gained by the bargain, may be obliged by the laws of equity and charity, to remit the gain, and not to take advantage of your weakness: But he may so far hold you to it, as to secure himself from loss: except in cases where you become the object of his charity, and not of commutative justice only.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, ... (London, 1673) | pt. 4, ch. 19, title 2, p. 115</span></figcaption>

</figure><figure class="quote" id="q-3f1e671f45" data-kw="">
<blockquote><p>Insofar as the matter of an oath is lawful or unlawful, pleasing or displeasing to God, it may and ought to be kept or broken. When Herod beheaded John the Baptist for keeping of his oath, he added sin to sin. But David did well in sparing Nabal and his family, whom he had sworn to destroy: and he blessed God, for the good counsel of Abigail, whereby he was diverted from performing that oath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-forbes.html">John Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable Warning to the subjects in Scotland given in the year of God 1638</cite>, (Aberdeen: Raban, 1638), ch. 4, pp. 19-20</span></figcaption>

</figure><figure class="quote" id="q-7ca521123f" data-kw="">
<blockquote><p>Here is great affinity between an oath, and a lot. Both the one and other serve to end controversies and cause contentions to cease, not easily or conveniently otherwise to be decided. In both, men as it were, renounce themselves and all other creatures and appeal to God’s special providence. In an oath we appeal to God as a wise and righteous witness and judge, knowing what is truth and hating and punishing falsehood and lies. In a lot we appeal to God, as to an absolute Lord, for the disposing of persons and things by his more singular work of providence: unto which alone he that casts the lot referrs himself if he mock not both God and man, wholy renouncing his own wit and skill every way, for the furthering of this chance, event, or lot, rather than that. Some may be and are too scrupulous in both: But a thousand times more are too profanely prodigal of the one and other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-robinson.html">John Robinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Observations Divine &amp; Moral</cite>, … (Amsterdam, 1625), ch. 49, ‘Of Oaths &amp; Lots’, pp. 253-54</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Here is great affinity between an oath, and a lot. Both the one and other serve to end controversies and cause contentions to cease, not easily or conveniently otherwise to be decided. In both, men as it were, renounce themselves and all other creatures and appeal to God’s special providence. In an oath we appeal to God as a wise and righteous witness and judge, knowing what is truth and hating and punishing falsehood and lies. In a lot we appeal to God, as to an absolute Lord, for the disposing of persons and things by his more singular work of providence: unto which alone he that casts the lot referrs himself if he mock not both God and man, wholy renouncing his own wit and skill every way, for the furthering of this chance, event, or lot, rather than that. Some may be and are too scrupulous in both: But a thousand times more are too profanely prodigal of the one and other.”

— John Robinson, Observations Divine &amp; Moral… (Amsterdam, 1625), ch. 49, ‘Of Oaths &amp; Lots’, pp. 253-54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHere+is+great+affinity+between+an+oath%2C+and+a+lot.+Both+the+one+and+other+serve+to+end+controversies+and+cause+contentions+to+cease%2C+not+easily+or+conveniently+otherwise+to+be+decided.+In+both%2C+men+as+it+were%2C+renounce+themselves+and+all+other+creatures+and+appeal+to+God%E2%80%99s+special+providence.+In+an+oath+we+appeal+to+God+as+a+wise+and+righteous+witness+and+judge%2C+knowing+what+is+truth+and+hating+and+punishing+falsehood+and+lies.+In+a+lot+we+appeal+to+God%2C+as+to+an+absolute+Lord%2C+for+the+disposing+of+persons+and+things+by+his+more+singular+work+of+providence%3A+unto+which+alone+he+that+casts+the+lot+referrs+himself+if+he+mock+not+both+God+and+man%2C+wholy+renouncing+his+own+wit+and+skill+every+way%2C+for+the+furthering+of+this+chance%2C+event%2C+or+lot%2C+rather+than+that.+Some+may+be+and+are+too+scrupulous+in+both%3A+But+a+thousand+times+more+are+too+profanely+prodigal+of+the+one+and+other.%E2%80%9D%0A%0A%E2%80%94+John+Robinson%2C+Observations+Divine+%26+Moral%E2%80%A6+%28Amsterdam%2C+1625%29%2C+ch.+49%2C+%E2%80%98Of+Oaths+%26+Lots%E2%80%99%2C+pp.+253-54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7ca521123f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7ca521123f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-lots-dice-games-using-free-contingent-causes/#:~:text=Here%20is%20great%20affinity%20between%20an,prodigal%20of%20the%20one%20and%20other&amp;text=Here%20is%20great%20affinity%20between%20an%20oath%2C%20and&amp;text=too%20profanely%20prodigal%20of%20the%20one%20and%20other" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8218f4a904" data-kw="">
<blockquote><p>And if the judgment of Voetius, Amesius and other learned men against all lusory [gaming] lots be of no authority, at least it should move you that even Mr. Gataker, and other that write for the lawfulness of them in that respect (as lusory lots) do yet lay down the rest of the requisites to make them lawful, which utterly condemn our common use of cards and dice, much more our gamesters: So that all the sober divines that ever I read or heard, condemn all these? And are you wiser than all of them?</p></blockquote>

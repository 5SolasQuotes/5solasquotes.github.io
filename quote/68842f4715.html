<main class="wrap"><figure class="quote" id="q-68842f4715" data-kw="">
<blockquote><p>At a public meeting held at Edinburgh in February 1840 on the church’s spiritual independence, the Revd Alexander Moody Stuart argued that the non-intrusionists would continue to obey the magistrate in civil matters while refusing to countenance the state’s usurpation of the church’s spiritual jurisdiction:

However her own province might be interfered with – her rights disregarded or herself trampled upon – she would never therefore be provoked to interfere in the King’s secular court, or create any disturbance of any kind. How much soever we might suffer in the maintenance of our spiritual liberties, she would still not only obey the magistrate in all other things, but would obey cheerfully and without a grudge. She would rejoice in her suffering, and yet obeying. …

There was, indeed, a standard raised, bearing the inscription, – “the Lord Jesus Christ the Head of the Church,” and because we rallied around it, the world said that we were contending merely for our honour; but that standard for which we strove was planted in the very heart of the citadel of Zion, and if we lost the standard, we lost the citadel – the citadel of the living God – the city of the great King.

That for which we were now contending had from the first been the crown and glory of the Church of Scotland; for nearly three hundred years she had by grace been enabled to preserve it; and He who sits in the midst of the seven golden candlesticks, was now saying, “Behold! I come quickly; hold that fast which thou hast, that no man take thy crown.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-moody-stuart.html">A. Moody Stuart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Witness</cite>, 26 February 1840.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d118d349d4" data-kw="">
<blockquote><p>Thus human laws cannot bind the conscience: It is God only, 1 John 3:21, who, as He is greater than the conscience, so has power to bind or loose it: Isa. 31:22. It is He that is the only Lawgiver to the conscience: Jam. 4:12. Princes and Churches may make laws for the outward man, but they can no more bind the heart than they can make it; … The laws of men therefore do not, ought not, cannot bind your conscience, as of themselves; but, if they be just, they bind you in conscience to obedience: … As then we are wont to say in relation of our actions to the laws of God, that some things are forbidden because they are sinful, and some things are sinful because they are forbidden, so it holds also in the laws of men: some things are forbidden because they are justly offensive and some other things are only therefore offensive because they are forbidden; In the former of these we must yield our careful obedience out of respect even to the duty itself; in the latter, out of respect to the will of the lawgiver; yet so, as that if our own important occasions shall enforce us to transgress a penal law, without any affront of authority or scandal to others, our submission to the penalty frees us from a sinful disobedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men</cite>, 3rd Decade, Case 6, ‘Whether the Laws of Men do Bind the Conscience, &amp; How Far we are Tied to Their Obedience?’ in Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times (London, 1654), pp. 211-13, 218-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

ically+Resolved+Containing+a+Decision+of+the+Principal+Cases+of+Conscience+of+Daily+Concernment+%26+Continual+Use+Amongst+Men%2C+3rd+Decade%2C+Case+6%2C+%E2%80%98Whether+the+Laws+of+Men+do+Bind+the+Conscience%2C+%26+How+Far+we+are+Tied+to+Their+Obedience%3F%E2%80%99+in+Cases+of+Conscience+Practically+Resolved+Containing+a+Decision+of+the+Principal+Cases+of+Conscience+of+Daily+Concernment+%26+Continual+Use+Amongst+Men%3A+Very+Necessary+for+their+Information+%26+Direction+in+These+Evil+Times+%28London%2C+1654%29%2C+pp.+211-13%2C+218-9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd118d349d4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d118d349d4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-how-human-laws-bind-the-conscience-how-they-do-not/#:~:text=Thus%20human%20laws%20cannot%20bind%20the,frees%20us%20from%20a%20sinful%20disobedience&amp;text=Thus%20human%20laws%20cannot%20bind%20the%20conscience%3A%20It&amp;text=the%20penalty%20frees%20us%20from%20a%20sinful%20disobedience" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c7e64f34cc" data-kw="">
<blockquote><p>I would have preferred to pass over this matter in utter silence if I were not aware that here many dangerously go astray. For there are some who deny that a commonwealth is duly framed which neglects the political system of Moses, and is ruled by the common laws of nations. Let other men consider how perilous and seditious this notion is; it will be enough for me to have proved it false and foolish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.20.14.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-6bea7646f2" data-kw="">
<blockquote><p>When, recently, you jumped into a well in order to die there, you certainly did this of your own free will, but how cruel the servants of God would have been had they abandoned you to your evil will and had not delivered you from that death! Yet you threw yourself into the water deliberately in order to die there, and they pulled you out of the water against your will so that you might not die there; you acted according to your own evil will to your own destruction; they acted against your will to save you. If, then, that bodily welfare is to be so safeguarded that it is preserved even in those who do not want it by those who love them, how much more is that spiritual welfare to be preserved since by its loss eternal death is feared! Yet, you would have remained in that death which you wanted to inflict on yourself, not for time but for eternity, because even if you were being forced to some evil deed instead of to salvation, to the peace of the Church, to the unity of the body of Christ, to holy and indivisible charity, you had no right to try to kill yourself.

Examine the divine Scriptures and scrutinize them as closely as you can, and see whether this was ever done by any of the good and faithful souls, even though they suffered great trials at the hands of those who were trying to drive them to eternal destruction, not to eternal life, to which you are being forced. I have heard that you said the Apostle Paul meant that this was lawful when he said: ‘If I should deliver my body to be burned.’ Probably because he was listing all kinds of good things which are worth nothing without charity, such as tongues of men and angels, and all mysteries, and all knowledge, and all prophecy, and all faith so as to move mountains, and distribution of his goods to the poor, you thought he included among good things the taking of one’s own life.

But notice carefully and understand in what sense Scripture says that anyone should deliver his body to be burned: not, certainly, that he should jump into the fire when harassed by a pursuing enemy, but that, when a choice is offered him of either doing wrong or suffering wrong, he chooses not to do wrong rather than not to suffer wrong. In this case he delivers his body into the power of the slayer, as those three men did who were being forced to adore the golden statue, and who were threatened by the one who was forcing them with the furnace of burning fire if they did not do it. They refused to adore the idol, but they did not cast themselves into the fire, yet it is written of them: ‘They delivered up their bodies that they might not serve nor adore any god but their own God.’ This is what the Apostle means by ‘If I deliver my body to be burned.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Donatus, c. 416 (no. 173) in Saint Augustine Letters: Volume IV (c. 420-30), trans. Wilfred Parsons, The Fathers of the Church: A New Translation, vol. 30 (Washington D.C.: The Catholic University of America Press, 1955), pp 76-77.</cite></span></figcaption>

orth+nothing+without+charity%2C+such+as+tongues+of+men+and+angels%2C+and+all+mysteries%2C+and+all+knowledge%2C+and+all+prophecy%2C+and+all+faith+so+as+to+move+mountains%2C+and+distribution+of+his+goods+to+the+poor%2C+you+thought+he+included+among+good+things+the+taking+of+one%E2%80%99s+own+life.%0A%0ABut+notice+carefully+and+understand+in+what+sense+Scripture+says+that+anyone+should+deliver+his+body+to+be+burned%3A+not%2C+certainly%2C+that+he+should+jump+into+the+fire+when+harassed+by+a+pursuing+enemy%2C+but+that%2C+when+a+choice+is+offered+him+of+either+doing+wrong+or+suffering+wrong%2C+he+chooses+not+to+do+wrong+rather+than+not+to+suffer+wrong.+In+this+case+he+delivers+his+body+into+the+power+of+the+slayer%2C+as+those+three+men+did+who+were+being+forced+to+adore+the+golden+statue%2C+and+who+were+threatened+by+the+one+who+was+forcing+them+with+the+furnace+of+burning+fire+if+they+did+not+do+it.+They+refused+to+adore+the+idol%2C+but+they+did+not+cast+themselves+into+the+fire%2C+yet+it+is+written+of+them%3A+%E2%80%98They+delivered+up+their+bodies+that+they+might+not+serve+nor+adore+any+god+but+their+own+God.%E2%80%99+This+is+what+the+Apostle+means+by+%E2%80%98If+I+deliver+my+body+to+be+burned.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+Augustine+of+Hippo%2C+Letter+to+Donatus%2C+c.+416+%28no.+173%29+in+Saint+Augustine+Letters%3A+Volume+IV+%28c.+420-30%29%2C+trans.+Wilfred+Parsons%2C+The+Fathers+of+the+Church%3A+A+New+Translation%2C+vol.+30+%28Washington+D.C.%3A+The+Catholic+University+of+America+Press%2C+1955%29%2C+pp+76-77.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6bea7646f2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6bea7646f2.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/11/27/augustine-of-hippo-on-the-folly-of-suicide-examined-in-the-light-of-scripture/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Be sure to remember the interest of your Sovereign, the great Lord-protector of heaven and earth. And as ever you will make him a comfortable account of your power, abilities, and opportunities of serving him, see that you prefer his interest before your own, or any man’s on earth. If you go not thither as sent by Him, with a firm resolution to serve him first, you were better sit at home. Forget not that he hath laid claim to you, and to all that you have, and all that you can do.

I am bold with all possible earnestness to entreat you, yea, as Christ’s minister to require you, in his name, to study and remember his business and interest, and see that it have the chief place in all your consultations. Watch against the encroachments of your own carnal interests, consult not with flesh and blood, nor give it the hearing when it shall offer you its advice. How subtly will it insinuate! How importunately will it urge you! How certainly will it mar all, if you do not constantly and resolvedly watch! Oh how hard, but how happy is it to conquer this carnal self!

Remember still that you are not your own; that you have an unseen Master that must be pleased, whoever be displeased, and an unseen kingdom to be obtained, and an invisible soul that must be saved, though all the world be lost. Fix your eyes still on him that made and redeemed you, and upon the ultimate end of your christian race, and do nothing wilfully unworthy such a Master and such an end.

Often renew your self-resignation, and devote yourself to him; sit close at his work, and be sure that it be his, both in the matter, and in your intent. If conscience should at any time ask, Whose work are you now doing? or a man should pluck you by the sleeve, and say, Sir, whose cause are you now pleading? see that you have the answer of a christian at hand; delay not God’s work till you have done your own, or any one’s else.

You will best secure the commonwealth, and your own interest, by looking first to his. By neglecting this, and being carnally wise, we have wheeled about so long in the wilderness, and lost those advantages against the powers of darkness, which we know not whether we shall ever recover again. It is the great astonishment of sober men, and not the least reproach that ever was cast on our holy profession, to think with what a zeal for the work of Christ men seemed to be animated in the beginning of our disagreements, and how deeply they did engage themselves to him in solemn vows, protestations, and covenants, and what advantages carnal self hath since got, and turned the stream another way! So that the same men have since been the instruments of our calamity, in breaking in pieces and dishonouring the churches of Christ, yea, and gone so near to the taking down, as much as in them lay, the whole ministry that stand approved in the land.

O do not, by trifling, give advantage to the tempter to destroy your work and you together: Take warning by the sad experiences of what is past; bestir you speedily and vigorously for Christ, as knowing your opposition, and the shortness of your time. Blessed is that servant whom his Lord, when he cometh, shall find so doing. If you ask me wherein this interest of Christ doth consist, I shall tell you, but in a few unquestionable particulars.

1. In the main, that truth, godliness, and honesty be countenanced and encouraged, and their contraries by all fit means suppressed. 2. In order to this, that unworthy men be removed from magistracy and ministry, and the places supplied with the fittest that can be had. 3. That a competent maintenance may be procured where it is wanting, especially for cities and great towns, where more teachers are so necessary in some proportion to the number of souls, and on which the country doth so much depend. Shall an age of such high pretences to reformation and zeal for the churches, alienate so much, and then leave them destitute, and say it cannot be had? 4. That right means be used, with speed and diligence, for the healing of our divisions and the uniting of all the true churches of Christ at last, in these nations; and oh that your endeavours might be extended much further!

To which end I shall mention but these two means of most evident necessity. 1. That there be one Scripture creed, or confession of faith, agreed on by a general assembly of able ministers, duly and freely chosen hereunto, which shall contain nothing but matter of evident necessity and verity. This will serve, 1. For a test to the churches to discern the sound professors from the unsound, (as to their doctrine,) and to know them with whom they may close as brethren, and whom they must reject. 2. For a test to the magistrate of the orthodox to be encouraged, and of the intolerably heterodox, which it seems is intended in the 37th article of the late formed government, where all that will have liberty must profess faith in God by Jesus Christ, which, in a christian sense, must comprehend every true fundamental or article of our faith: and, no doubt, it is not the bare speaking of those words in an unchristian sense that is intended; as if a ranter should say, that himself is God and his mate is Jesus Christ.

2. That there be a public establishment of the necessary liberty of the churches, to meet by their officers and delegates on all just occasions, in assemblies smaller or greater, (even national, when it is necessary,) seeing, without such associations and communion in assemblies, the unity and concord of the churches is not like to be maintained. I exclude not the magistrates’ interest, or oversight, to see that they do not transgress their bounds. As you love Christ, and his church, and gospel, and men’s souls, neglect not these unquestionable points of his interest, and make them your first and chiefest business, and let none be preferred before him until you know them to be of more authority over you, and better friends to you, than Christ is.

Should there be any among you that cherish a secret root of infidelity, after such pretences to the purest christianity, and are zealous of Christ lest he should over-top them, and do set up an interest inconsistent with his sovereignty, and thereupon grow jealous of the liberties and power of his ministers, and of the unity and strength of his church, and think it their best policy to keep under his ministers, by hindering them from the exercise of their office, and to foment divisions, and hinder our union, that they may have parties ready to serve their ends; I would not be in the case of such men, when God ariseth to judge them, for all the crowns and kingdoms on earth!

If they stumble on this stone, it will break them in pieces, but if it fall upon them, it will grind them to powder. They may seem to prevail against him awhile, when their supposed success is but a prosperous self-destroying; but mark the end, when his wrath is kindled, yea, but a little; and when these, his enemies that would not he should reign over them, are brought forth and destroyed before him, then they will be convinced of the folly of their rebellion. In the mean time, let wisdom be justified of her children.</p></blockquote>

d+delegates+on+all+just+occasions%2C+in+assemblies+smaller+or+greater%2C+%28even+national%2C+when+it+is+necessary%2C%29+seeing%2C+without+such+associations+and+communion+in+assemblies%2C+the+unity+and+concord+of+the+churches+is+not+like+to+be+maintained.+I+exclude+not+the+magistrates%E2%80%99+interest%2C+or+oversight%2C+to+see+that+they+do+not+transgress+their+bounds.+As+you+love+Christ%2C+and+his+church%2C+and+gospel%2C+and+men%E2%80%99s+souls%2C+neglect+not+these+unquestionable+points+of+his+interest%2C+and+make+them+your+first+and+chiefest+business%2C+and+let+none+be+preferred+before+him+until+you+know+them+to+be+of+more+authority+over+you%2C+and+better+friends+to+you%2C+than+Christ+is.%0A%0AShould+there+be+any+among+you+that+cherish+a+secret+root+of+infidelity%2C+after+such+pretences+to+the+purest+christianity%2C+and+are+zealous+of+Christ+lest+he+should+over-top+them%2C+and+do+set+up+an+interest+inconsistent+with+his+sovereignty%2C+and+thereupon+grow+jealous+of+the+liberties+and+power+of+his+ministers%2C+and+of+the+unity+and+strength+of+his+church%2C+and+think+it+their+best+policy+to+keep+under+his+ministers%2C+by+hindering+them+from+the+exercise+of+their+office%2C+and+to+foment+divisions%2C+and+hinder+our+union%2C+that+they+may+have+parties+ready+to+serve+their+ends%3B+I+would+not+be+in+the+case+of+such+men%2C+when+God+ariseth+to+judge+them%2C+for+all+the+crowns+and+kingdoms+on+earth%21%0A%0AIf+they+stumble+on+this+stone%2C+it+will+break+them+in+pieces%2C+but+if+it+fall+upon+them%2C+it+will+grind+them+to+powder.+They+may+seem+to+prevail+against+him+awhile%2C+when+their+supposed+success+is+but+a+prosperous+self-destroying%3B+but+mark+the+end%2C+when+his+wrath+is+kindled%2C+yea%2C+but+a+little%3B+and+when+these%2C+his+enemies+that+would+not+he+should+reign+over+them%2C+are+brought+forth+and+destroyed+before+him%2C+then+they+will+be+convinced+of+the+folly+of+their+rebellion.+In+the+mean+time%2C+let+wisdom+be+justified+of+her+children.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+True+Christianity%3B+or%2C+Christ%E2%80%99s+Absolute+Dominion%2C+and+Man%E2%80%99s+Necessary+Self-Resignation+and+Subjection.+In+Two+Assize+Sermons%2C+Preached+before+the+Honourable+Judge+of+Assize%2C+at+Worcester%2C+August+2%2C+1654%2C+in+The+Practical+Works+of+Richard+Baxter+%284+vols%2C+London%3A+George+Virtue%2C+1838%29%2C+3%3A+782-83.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9cdd0e4f8a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9cdd0e4f8a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/05/02/richard-baxter-on-the-civil-magistrates-duty-to-promote-christs-interests/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

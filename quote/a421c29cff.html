<main class="wrap"><figure class="quote" id="q-a421c29cff" data-kw="">
<blockquote><p>VIII. Whether brute animals were given for food from the first creation of things? We affirm, against some rabbis who want this to have happened only after the flood of Noah [Gen. 9]; before that time, only vegetables were granted, Gen. 1:29-30. But this savors of that Pythagorean saying in Ovid: ‘What have oxen, an animal without fraud and deceit, deserved?&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 2, ‘On Creation’, pt. 7, ‘On the Work of the 5th Day’</cite>, p. 241</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9580d6b32c" data-kw="">
<blockquote><p>…note that while the behavior of non-human animals is not deterministic, neither is it random or arbitrary. It is perfectly intelligible given their causal powers together with the powers of the things they interact with. Yet non-human animals do not have wills, much less free will… Aquinas’s answer is that the will is a power of the kind of thing whose activity arises from within it in a certain way–specifically, by way of having knowledge of the kind of which a rational substance alone is capable (Summa theologiae I-II.6.1-2). To act voluntarily is to know what you are doing in the way that human beings do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature (Editiones Scholasticae, 2024), pt. 1</cite>, ch. 4, ‘The Will’; pp. 117-18</span></figcaption>

<blockquote><p>VII. Freedom from coercion is an essential quality of the will. Otherwise the will would not be performing acts of will.</p></blockquote>

</figure><figure class="quote" id="q-95e695dad7" data-kw="">
<blockquote><p>§II. In the State of Innocence, man was disposed to the good and to its practice, yet was indeterminate and indifferent to both, with Calvin as author, Institutes, bk. 1, ch. 15, §8, also bk. 2, ch. 3, §10; Spanheim, Syntagma Disputationum, pt. 1, p. 738, th. 7; Maresius, Systema Theologicum, locus 8, th. 50; Lud. Crocius, Syntagma Theologiae, bk. 3, ch. 37, §6; and therefore he was immune from the necessity and servitude of sin and misery; not however from the necessity of dependence [on God]; nor from the necessity of obligation to commit good and omit evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfuz.html">Barthold Holtzfuz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on the Free Will of Man’ trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), ch. 2</cite>, p. 20</span></figcaption>

</figure><figure class="quote" id="q-7cba05f842" data-kw="">
<blockquote><p>As has been expressed, this article’s considerations have been put forth with the intention of describing reality and ethical living, which we do everyday, more accurately and fully, not to open up a pandora’s box or skepticism. Indeed, very precise and somewhat complex principles and argumentation (perhaps dizzying) has been used, but that has only been to confirm common sense (or upright practical reason) from subtle, but very significant and potent, practical error, for people’s health. Flee all sophistry¹ (Isa. 5:20-21; Mt. 22:18; Col. 2:8) and simplistic ignorance (Ps. 19:7; Prov. 1:22; 8:5), both which are unworthy of your intelligence and hinder the fruit of God’s truth. † See ‘Which Philosophy Should be Used?’ at ‘Philosophy’ (RBO). ¹ See ‘On Sophistry’ at ‘On the Use of Reason in Theology’ (RBO). Be assured in all this in what is presented here there is no slippery slope. The weight of nature, and that which is above nature, in conjunction with it, will and ought to bear determinative ethical weight in situations according to the natures, context and proportions of that which is involved. God’s Law requires this (Lev. 19:15; Job 34:10-12; Ps. 28:4; 99:4; Prov. 2:9; Jer. 32:19; Mic. 6:8; Zech. 7:9; Mt. 16:27; 23:23; 26:60-61; Mk. 14:61-64; 15:31; Lk. 23:39; Jn. 7:24; 19:12, 17-22).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Using Contraceptives may be in Accord with Natural Law &amp; Scripture: a Response to [Edward] Feser’ (RBO, 2025) | Summary Conclusions, Philosophy Descriptive of Reality†</cite></span></figcaption>

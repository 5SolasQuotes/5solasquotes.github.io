<main class="wrap"><figure class="quote" id="q-b2ae6493e6" data-kw="">
<blockquote><p>But, good friend, if really Christ and Scripture be your guide, I desire no more; tell me, and lay by partiality: Did not Christ and his apostles use both in the synagogues, Church, meetings and writings a faulty translation of the Old Testament, and as bad as ours. Deny it if you can for shame. Though sometimes they varied, they mostly used the Septuagint, according to which our faulty translation of the Old Testament is made, as it differs from the Hebrew. Is this no confutation of you? [(1)] Yea, Christ and the apostles used it the rather because it was in common use… I would add a similitude [It was actually a real and common scenario in that era]: Supposing that we had just possession of the public church-places and tithes, and they are taken from us, and we can blame them that did it and say over and over, ‘We had possession;’ and therefore it is unlawful to meet in worse rooms, for God must have the best: will this hold when you cannot keep possession? Will you rather worship nowhere? This is no better than if you would tell all men they should die rather than eat brown bread, if force take all other [food] from them, because it is unjustly done and they had possession of better. Good friends, keep your possession for me, but I own not the famishing of all that are dispossessed. If you do, I do not… How much the Septuagint differs from the Hebrew, how many verses it leaves out, how many additions and alterations it makes, is commonly known. Christ’s and the apostles’ use of this was no approbation of its faults, much less their presence in the synagogues when others read Moses and the prophets in them. And the Psalms in the Septuagint translation were part of their liturgy. For man to speak faultily is no wonder: It has a more plausible pretence for separation to say that men corrupt the Word of God. And yet when it is but such an effect of human imperfection, it is no just pretence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, … (London: Parkhurst, 1684) | section 5, ‘A comparison of the use of a faulty translation of the Scripture and a faulty liturgy’ See also the whole of this article.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-01615fa0d0" data-kw="">
<blockquote><p>…it is a great consideration also: I know that Jesus Christ has given his people light in matters of this nature by degrees. Thousands of good souls that have been bred up and born in our assemblies, and enjoy the ordinances of God, and have done it comfortably, cannot suddenly take in other principles, you must wait upon Christ to do it. In this case, men are not to be wrought off by falsehoods [in exaggerations and extreme speaking and positions], God has no need of them. No, rather till men do take in light, you should give them all that is comfortable in the condition they are in; we should acknowledge every good thing in every man, in every church, in every thing, and that is a way to work upon men, and to prevail with them; as it is Philemon, verse 6: ‘That the communication of thy faith may become effectual by the acknowledgment of every good thing, which is in you in Christ Jesus.’ It is that which builds men up, by acknowledgment of every good thing that is in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, 12 vols. (d. 1680; Edinburgh: Nichol, 1861), vol. 1, Exposition of Eph. 1 (1681), sermon 36, on 1:22-23, pp. 558-59</span></figcaption>

· Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f85c9e6781" data-kw="">
<blockquote><p>But what is that good and honest heart which they are commended for? it is a heart that does fully purpose to do well, though it fail much in that which it performs: that resolves beforehand to avoid the evil that shall be reproved, and to do the good duties that shall be commanded, and to believe and rest upon the promises that shall be pronounced, as far as God shall give ability, etc. Now wheresoever there is such a ready inclination unto goodness, there will be a bringing forth of fruit; though not in all alike, yet every one will do somewhat: and God will acknowledge them for good ground, and honest-hearted Christians, that yield Him but a thirty-fold, as well as those that yield Him sixty-fold,or an hundred-fold: for a less measure of fruitfulness is an argument of truth, as well as a greater measure, and therefore shall be respected and rewarded.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper</cite>, (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20, p. 119</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<blockquote><p>‘Go and tell my servant David.’ The Lord speaks very honorably and respectfully of him, owns him to be his servant in other things though he did not choose to employ him in this; and though he was not the person, nor this the time, to build the house of the Lord, yet, as he showed a good will towards it, so far it was acceptable to God:</p></blockquote>

</figure><figure class="quote" id="q-4d5f7f00bd" data-kw="">
<blockquote><p>…it is too evident that many and great corruptions are to our sin and shame retained… but yet they are extrinsic and not of the substance of God’s worship, which for matter, and essential form, remains entire and properly his own (though not so acceptable) under, as well as without them; and will not therefore warrant my separation, or non-communion so far as to lie at home, or loiter in the churchyard, until the Common-Prayer (whereby God is truly, though not orderly, invocated and worshipped; wherein I, as a member of that Church, am interested, and unto which, as it is public, solemn prayer, though in an unsuitable method, my ‘Amen’ is an indispensable duty) being ended.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church</cite>, … in a Letter, written July 20, 1661… (1662), pp. 23-24 Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…it is too evident that many and great corruptions are to our sin and shame retained… but yet they are extrinsic and not of the substance of God’s worship, which for matter, and essential form, remains entire and properly his own (though not so acceptable) under, as well as without them; and will not therefore warrant my separation, or non-communion so far as to lie at home, or loiter in the churchyard, until the Common-Prayer (whereby God is truly, though not orderly, invocated and worshipped; wherein I, as a member of that Church, am interested, and unto which, as it is public, solemn prayer, though in an unsuitable method, my ‘Amen’ is an indispensable duty) being ended.”

— Zachary Crofton, Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church… in a Letter, written July 20, 1661… (1662), pp. 23-24 Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6it+is+too+evident+that+many+and+great+corruptions+are+to+our+sin+and+shame+retained%E2%80%A6+but+yet+they+are+extrinsic+and+not+of+the+substance+of+God%E2%80%99s+worship%2C+which+for+matter%2C+and+essential+form%2C+remains+entire+and+properly+his+own+%28though+not+so+acceptable%29+under%2C+as+well+as+without+them%3B+and+will+not+therefore+warrant+my+separation%2C+or+non-communion+so+far+as+to+lie+at+home%2C+or+loiter+in+the+churchyard%2C+until+the+Common-Prayer+%28whereby+God+is+truly%2C+though+not+orderly%2C+invocated+and+worshipped%3B+wherein+I%2C+as+a+member+of+that+Church%2C+am+interested%2C+and+unto+which%2C+as+it+is+public%2C+solemn+prayer%2C+though+in+an+unsuitable+method%2C+my+%E2%80%98Amen%E2%80%99+is+an+indispensable+duty%29+being+ended.%E2%80%9D%0A%0A%E2%80%94+Zachary+Crofton%2C+Reformation%2C+Not+Separation%2C+or%2C+Mr.+Crofton%E2%80%99s+Plea+for+Communion+with+the+Church%E2%80%A6+in+a+Letter%2C+written+July+20%2C+1661%E2%80%A6+%281662%29%2C+pp.+23-24+Crofton+%281626-1672%29+was+a+presbyterian+and+puritan+born+and+raised+in+Ireland.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4d5f7f00bd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4d5f7f00bd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=it%20is%20too%20evident%20that%20many,is%20an%20indispensable%20duty%29%20being%20ended&amp;text=it%20is%20too%20evident%20that%20many%20and%20great&amp;text=my%20%E2%80%98Amen%E2%80%99%20is%20an%20indispensable%20duty%29%20being%20ended" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

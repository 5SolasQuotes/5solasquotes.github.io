<main class="wrap"><figure class="quote" id="q-103d5b18c0" data-kw="">
<blockquote><p>2. For since man, by departing from God, reached such a pitch of fury as even to look upon his brother as his enemy, and engaged without fear in every kind of restless conduct, and murder, and avarice; God imposed upon mankind the fear of man, as they did not acknowledge the fear of God, in order that, being subjected to the authority of men, and kept under restraint by their laws, they might attain to some degree of justice, and exercise mutual forbearance through dread of the sword suspended full in their view, as the apostle says: “For he beareth not the sword in vain; for he is the minister of God, the avenger for wrath upon him who does evil.”

And for this reason too, magistrates themselves, having laws as a clothing of righteousness whenever they act in a just and legitimate manner, shall not be called in question for their conduct, nor be liable to punishment. But whatsoever they do to the subversion of justice, iniquitously, and impiously, and illegally, and tyrannically, in these things shall they also perish; for the just judgment of God comes equally upon all, and in no case is defective. Earthly rule, therefore, has been appointed by God for the benefit of nations, and not by the devil, who is never at rest at all, nay, who does not love to see even nations conducting themselves after a quiet manner, so that under the fear of human rule, men may not eat each other up like fishes; but that, by means of the establishment of laws, they may keep down an excess of wickedness among the nations. And considered from this point of view, those who exact tribute from us are “God’s ministers, serving for this very purpose.”

3. As, then, “the powers that be are ordained of God,” it is clear that the devil lied when he said, “These are delivered unto me; and to whomsoever I will, I give them.” For by the law of the same Being as calls men into existence are kings also appointed, adapted for those men who are at the time placed under their government. Some of these [rulers] are given for the correction and the benefit of their subjects, and for the preservation of justice; but others, for the purposes of fear and punishment and rebuke: others, as [the subjects] deserve it, are for deception, disgrace, and pride; while the just judgment of God, as I have observed already, passes equally upon all. The devil, however, as he is the apostate angel, can only go to this length, as he did at the beginning, [namely] to deceive and lead astray the mind of man into disobeying the commandments of God, and gradually to darken the hearts of those who would endeavour to serve him, to the forgetting of the true God, but to the adoration of himself as God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/irenaeus-of-lyons.html">Irenaeus of Lyons</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Heresies</cite>, (c. 175-85), 5.24.2-3 in Ante-Nicene Fathers, 1: 552-53.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dbc8f7e996" data-kw="">
<blockquote><p>When answering the objection that Christian magistrates were not bound to enforce the Old Testament’s laws against idolatry because they were not Jews, John Knox pointed out that the commandments given under Moses remained valid for civil rulers in the new covenant era:

For it is a thing more certain that whatsoever God required of the civil magistrate in Israel or Judah concerning the observation of true religion during the time of the Law, the same doth he require of lawful magistrates professing Christ Jesus in the time of the Gospel, as the Holy Ghost hath taught us by the mouth of David, saying (Psalm 2): ‘Be learned, you that judge the earth, kiss the Son, lest that the Lord wax angry and that ye perish from the way.’ This admonition did not extend to the judges under the Law only, but doth also include such as be promoted to honours in the time of the Gospel, when Christ Jesus doth reign and fight in His spiritual kingdom, whose enemies in that Psalm be most sharply taxed, their fury expressed and vanity mocked. And then are kings and judges, who think themselves free from all law and obedience, commanded to repent their former blind rage, and judges are charged to be learned. And last are all commanded to serve the Eternal in fear, to rejoice before Him in trembling, to kiss the Son, that is, to give unto Him most humble obedience. Whereof it is evident that the rulers, magistrates and judges now in Christ’s kingdom are no less bound to obedience unto God than were those under the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The appellation of John Knox from the cruel and most injust sentence pronounced against him by the false bishops and clergy of Scotland, with his supplication and exhortation to the nobility, estates and commonality of the same realm</cite>, (Geneva, 1558) in idem, On rebellion, ed. R. A. Mason (Cambridge, 1994), pp 91-2.</span></figcaption>

</figure><figure class="quote" id="q-4ef9d041db" data-kw="">
<blockquote><p>The human law is that which humans, proceeding by reason, produce from the preceding laws, accommodated first to common just, honest, useful, and necessary conclusions, then to particular determinations for the condition of persons for whose good it is produced, the things or matters concerning which it is produced, and for the circumstances which occur to them. … We call determinations that part of human law that circumscribes any of those natural conclusions with specific (as we call it) boundaries, not by the authority of nature, but rather by the judgment of the wisest persons, by the common law of nature specifically accommodated to the mode of individual things. .. The objects of just proportion exist in three kinds… for the sake of producing specific determinations. For either they are [1] primary objects whose good is seen by natural, divine, and human law; or [2] they are secondary objects that are ordered to the former ones as to their own end; or, [3] finally, they are accidents, by which the previous two objects are commonly clothed in a certain way and change.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The human law is that which humans, proceeding by reason, produce from the preceding laws, accommodated first to common just, honest, useful, and necessary conclusions, then to particular determinations for the condition of persons for whose good it is produced, the things or matters concerning which it is produced, and for the circumstances which occur to them. … We call determinations that part of human law that circumscribes any of those natural conclusions with specific (as we call it) boundaries, not by the authority of nature, but rather by the judgment of the wisest persons, by the common law of nature specifically accommodated to the mode of individual things. .. The objects of just proportion exist in three kinds… for the sake of producing specific determinations. For either they are [1] primary objects whose good is seen by natural, divine, and human law; or [2] they are secondary objects that are ordered to the former ones as to their own end; or, [3] finally, they are accidents, by which the previous two objects are commonly clothed in a certain way and change.”

— Francis Junius, The Mosaic Polity, ch. 4, ‘Of the Part in Human Laws which is Mutable, and the Causes of the Mutability’ in The Mosaic Polity (1st ed. 1592; 1602; CLP Academic, 2015), pp. 54 &amp; 56-57">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+human+law+is+that+which+humans%2C+proceeding+by+reason%2C+produce+from+the+preceding+laws%2C+accommodated+first+to+common+just%2C+honest%2C+useful%2C+and+necessary+conclusions%2C+then+to+particular+determinations+for+the+condition+of+persons+for+whose+good+it+is+produced%2C+the+things+or+matters+concerning+which+it+is+produced%2C+and+for+the+circumstances+which+occur+to+them.+%E2%80%A6+We+call+determinations+that+part+of+human+law+that+circumscribes+any+of+those+natural+conclusions+with+specific+%28as+we+call+it%29+boundaries%2C+not+by+the+authority+of+nature%2C+but+rather+by+the+judgment+of+the+wisest+persons%2C+by+the+common+law+of+nature+specifically+accommodated+to+the+mode+of+individual+things.+..+The+objects+of+just+proportion+exist+in+three+kinds%E2%80%A6+for+the+sake+of+producing+specific+determinations.+For+either+they+are+%5B1%5D+primary+objects+whose+good+is+seen+by+natural%2C+divine%2C+and+human+law%3B+or+%5B2%5D+they+are+secondary+objects+that+are+ordered+to+the+former+ones+as+to+their+own+end%3B+or%2C+%5B3%5D+finally%2C+they+are+accidents%2C+by+which+the+previous+two+objects+are+commonly+clothed+in+a+certain+way+and+change.%E2%80%9D%0A%0A%E2%80%94+Francis+Junius%2C+The+Mosaic+Polity%2C+ch.+4%2C+%E2%80%98Of+the+Part+in+Human+Laws+which+is+Mutable%2C+and+the+Causes+of+the+Mutability%E2%80%99+in+The+Mosaic+Polity+%281st+ed.+1592%3B+1602%3B+CLP+Academic%2C+2015%29%2C+pp.+54+%26+56-57&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4ef9d041db.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4ef9d041db.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-positive-laws-ordinances/#:~:text=The%20human%20law%20is%20that%20which,in%20a%20certain%20way%20and%20change&amp;text=The%20human%20law%20is%20that%20which%20humans%2C%20proceeding&amp;text=commonly%20clothed%20in%20a%20certain%20way%20and%20change" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>(4) The formation of the foetus in the Virgin’s womb had its stages and processes, as is usual in the formation of other foetuses and which are usually completed in the space of 9 months. It was right that Christ should be made like us in this too, namely in not being formed and born in a moment, but being completed in a matrix suited to the order and processes of nature, the operation of the H. Spirit thus accommodating its process of quickening. (5) The union of the divine nature with the human began the moment the formation of the human nature was completed, so that it would be said to have been composed of human matter and form.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-0b044c059b" data-kw="">
<blockquote><p>True believers may have the assurance of their salvation divers ways shaken, diminished, and intermitted; as by negligence in preserving of it, by falling into some special sin which woundeth the conscience and grieveth the Spirit; by some sudden or vehement temptation, by God&#x27;s withdrawing the light of his countenance, and suffering even such as fear him to walk in darkness and to have no light, yet are they never destitute of the seed of God and life of faith, that love of Christ and the brethren, that sincerity of heart and conscience of duty out of which, by the operation of the Spirit, this assurance may in due time be revived, and by the which, in the meantime, they are preserved from utter despair.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 18.4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/perseverance-of-the-saints/perseverance-and-assurance.html">Perseverance and Assurance</a> › <a href="../topics/perseverance-of-the-saints/perseverance-and-assurance/how-they-relate.html">How they relate</a></span><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e1ff0babb0" data-kw="Mortification">
<blockquote><p>The Apostle himself in Rom. 6 &amp; 7 shows quite openly that concupiscence is sin properly so called: for not only does he often call it sin, but not good, evil, to be held in hatred, fighting against the law of God, to be crucified, mortified, and destroyed, and rendering that man miserable in whom it resides.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bellarmine Disarmed</cite>, vol. 4, ch. 3 (Of Original Sin)</span></figcaption>

— William Ames, Bellarmine Disarmed, vol. 4, ch. 3 (Of Original Sin)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Apostle+himself+in+Rom.+6+%26+7+shows+quite+openly+that+concupiscence+is+sin+properly+so+called%3A+for+not+only+does+he+often+call+it+sin%2C+but+not+good%2C+evil%2C+to+be+held+in+hatred%2C+fighting+against+the+law+of+God%2C+to+be+crucified%2C+mortified%2C+and+destroyed%2C+and+rendering+that+man+miserable+in+whom+it+resides.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+Bellarmine+Disarmed%2C+vol.+4%2C+ch.+3+%28Of+Original+Sin%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe1ff0babb0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e1ff0babb0.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-97321aa156" data-kw="Original Sin Mortification Forgiveness">
<blockquote><p>This corruption of nature, during this life, doth remain in those that are regenerated (1 John 1:8, 10; Rom. 7:14, 17–18, 23; James 3:2; Prov. 20:9; Eccl. 7:20); and although it be, through Christ, pardoned and mortified; yet both itself, and all the motions thereof, are truly and properly sin (Rom. 7:5, 7–8, 25; Gal. 5:17).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 6.5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/sin-in-the-regenerate.html">Sin in the Regenerate</a> › <a href="../topics/sin/sin-in-the-regenerate/remaining-sin-in-believers.html">Remaining sin in believers</a></span><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a></span><span class="t"><a href="../topics/sanctification/remaining-corruption.html">Remaining Corruption</a> › <a href="../topics/sanctification/remaining-corruption/indwelling-sin.html">Indwelling sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“This corruption of nature, during this life, doth remain in those that are regenerated (1 John 1:8, 10; Rom. 7:14, 17–18, 23; James 3:2; Prov. 20:9; Eccl. 7:20); and although it be, through Christ, pardoned and mortified; yet both itself, and all the motions thereof, are truly and properly sin (Rom. 7:5, 7–8, 25; Gal. 5:17).”

</figure><figure class="quote" id="q-59df0fff9d" data-kw="">
<blockquote><p>Precisely because we are justified in Him – that is, in His justification – our justification is also final and irreversible. Indeed we can be so bold as to say that we are as fully justified before God as our Lord Jesus is. We are as finally justified as our Lord Jesus is. We are as irreversibly justified as our Lord Jesus is. The only justification we have – our only righteousness – is that of the Lord Jesus. We are justified with His justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sinclair-ferguson.html">Sinclair Ferguson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Assured by God</cite>, p. 91</span></figcaption>

</figure><figure class="quote" id="q-3c8a10652f" data-kw="Sanctification">
<blockquote><p>The end of Christ&#x27;s incarnation, death and resurrection was to prepare and form a holy nature and frame for us in Himself, to be communicated to us by union and fellowship with Him; and not to enable us to produce in ourselves the first original of such a holy nature by our own endeavours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-marshall.html">Walter Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gospel Mystery of Sanctification</cite>, Direction III (ch. 3), proof 3</span></figcaption>

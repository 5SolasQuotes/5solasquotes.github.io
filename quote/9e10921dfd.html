<blockquote><p>I. How God delights not in the death of a sinner… If God has more pleasure in the conversion of sinners than their destruction, why are there not more converted than we find to be? The greatest part of mankind are perishing in their unbelief and impenitency. Answer: (1) I might answer, that this text speaks not absolutely, but comparatively. God rejoices in the execution of his justice, as well as in all his other works; but if you compare things with things, He rejoices rather in acts of mercy than in acts of vengeance. His disposition inclines Him to mercy rather than to wrath: ‘Mercy pleases Him,’ Mic. 7:18; and mercy rejoices over judgment in the conflict. Justice is alienum opus, ‘his strange work,’ Isa. 28:21; Lam. 3:33, ‘He does not afflict willingly, nor grieve the children of men;’ not with his heart. Mercy, like live honey, drops of its own accord. He is forced to the other [judgment]; it [judgment] is wrested from Him. Though the properties are equally infinite in God, yet they do diversely exert themselves towards men as to the effects. Now the world is upon its trial. God’s primary end is the conversion of a sinner; his secondary end the honor of his vindictive justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 21, Two sermons on Eze. 18:23, pp. 463-79</span></figcaption>

<blockquote><p>I answer that, It is necessary to assign an appetitive power to the soul. To make this evident, we must observe that some inclination follows every form: for example, fire, by its form, is inclined to rise, and to generate its like. Now, the form is found to have a more perfect existence in those things which participate knowledge than in those which lack knowledge. For in those which lack knowledge, the form is found to determine each thing only to its own being—that is, to its nature. Therefore this natural form is followed by a natural inclination, which is called the natural appetite. But in those things which have knowledge, each one is determined to its own natural being by its natural form, in such a manner that it is nevertheless receptive of the species of other things: for example, sense receives the species of all things sensible, and the intellect, of all things intelligible, so that the soul of man is, in a way, all things by sense and intellect: and thereby, those things that have knowledge, in a way, approach to a likeness to God, in Whom all things pre-exist, as Dionysius says (Div. Nom. v). Therefore, as forms exist in those things that have knowledge in a higher manner and above the manner of natural forms; so must there be in them an inclination surpassing the natural inclination, which is called the natural appetite. And this superior inclination belongs to the appetitive power of the soul, through which the animal is able to desire what it apprehends, and not only that to which it is inclined by its natural form. And so it is necessary to assign an appetitive power to the soul. … Reply Obj. 2: What is apprehended and what is desired are the same in reality, but differ in aspect [ratione]: for a thing is apprehended as something sensible or intelligible, whereas it is desired as suitable or good. Now, it is diversity of aspect in the objects, and not material diversity, which demands a diversity of powers. Reply Obj. 3: Each power of the soul is a form or nature, and has a natural inclination to something. Wherefore each power desires by the natural appetite that object which is suitable to itself. Above which natural appetite is the animal appetite, which follows the apprehension, and by which something is desired not as suitable to this or that power, such as sight for seeing, or sound for hearing; but simply as suitable to the animal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1 | quest. 80, Appetitive Powers in General, art. 1, Whether the appetite is a special power of the soul?</span></figcaption>

</figure><figure class="quote" id="q-8ae6dd80bb" data-kw="">
<blockquote><p>But in this place and present argument, ‘grace’ is the favor and goodness of the eternal Godhead wherewith He according to his incomprehensible goodness does gratis, freely for Christ’s sake embrace, call, justify and save us mortal men. Now here me thinks before we go any further it is not amiss to examine and search out the cause of this God’s love to us exhibited. For we see that there is a certain relation between the favor of God and us men to whom his favour is so bent. It is a matter neither hard nor tedious to be found out. For in us there is nothing wherewith God can be in love, or wherewithal He may be moved or stirred up to embrace us: yea, in so much as we are all unpure sinners, and that God is holy, just and a revenger of iniquities, He has matter enough to find in us for which He may be angry at and with just revengement plague us. So then the cause of God’s love to us wards must of necessity be, not in us, nor in any other thing beside God (considering that nothing is more excellent than man) but even in God Himself. Moreover, the most true Scripture does teach us that God is of his own inclination naturally good, gentle, and as Paul calls Him, Philanthropon, a lover of us men, who has sent his own Son of his own nature into the world for our redemption: whereupon it does consequently follow, that God does freely of Himself, and for his Son’s sake love man, and not for any other cause. Whereby immediately all the preparaments, incitaments and merits of men being dissolved by the fire of God’s great love, do fade and pass away like smoke. For the grace of God is altogether free, and unless it be so, I cannot see how it can be called grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty Godly &amp; Learned Sermons divided into Five Decades</cite>, … (d. 1575; London: Ralph Newberry, 1577), 4th Decade, 1st Sermon, Of the Gospel of the Grace of God, p. 529</span></figcaption>

<blockquote><p>longanimitas: longsuffering; the patient bearing of an offense, particularly over a long period of time; thus, the willingness of God to endure the offense of sin rather than immediately annihilate the world in its wickedness. The longanimitas Dei is the affection of the divine will according to which God wills to await repentance and to allow millennia to elapse, for the sake of mankind, between the fall and the final judgment. Longanimitas is virtually synonymous with patientia, indicating the height of patience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st</cite>, ed. (Baker, 1985), p. 180</span></figcaption>

<div class="actions"><button class="copy" data-copy="“longanimitas: longsuffering; the patient bearing of an offense, particularly over a long period of time; thus, the willingness of God to endure the offense of sin rather than immediately annihilate the world in its wickedness. The longanimitas Dei is the affection of the divine will according to which God wills to await repentance and to allow millennia to elapse, for the sake of mankind, between the fall and the final judgment. Longanimitas is virtually synonymous with patientia, indicating the height of patience.”

<blockquote><p>Fifteenthly and lastly, It is clearly evident that the Lord Christ has a strong inclination to save sinners, by his giving out of Scripture in that way and manner as He has done; the Lord Christ has given out Scripture so as to answer the objections of men and women, to answer all the evils of their hearts, all the pleas of corruption, and of a guilty conscience, and of the Devil himself: The Lord has given out Scripture so as to answer all that might hinder their coming in unto Him… Is not here encouragement enough unto poor sinners: — So here in the next words, ‘Whosoever will let him come and drink of the water of life freely:’ It’s laid down so as to answer all your objections, and to take away all your pleas you have to stave you off from Christ. So then you see clear evidences that Christ is willing to save sinners.</p></blockquote>

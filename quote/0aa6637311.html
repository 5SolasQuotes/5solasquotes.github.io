<main class="wrap"><figure class="quote" id="q-0aa6637311" data-kw="">
<blockquote><p>The Scribes &amp; Pharisees that came from Jerusalem, picked a quarrel against him, because his disciples did eat with unwashed hands, whereby they transgressed the tradition of the Elders: our saviour Christ in defence of his disciples, chargeth the Scribes &amp; Pharisees which were so zealous to maintain their own ceremonies, then they were careless to break the commandment of God.

And so it cometh to pass always, that they which are most earnest in upholding &amp; defending traditions &amp; ceremonies invented by man, are most forgetful in keeping the commandments of God. But this is the just judgment of God against those that invent a new worship of their own brain: That first they lose their labour, that so seek to please God: &amp; secondly that they are deprived of all right understanding, because they have presumed to be wiser then God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fulke.html">William Fulke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A comfortable sermon of faith, in temptations and afflictions Preached at S. Botolph’s without Aldersgate in London, the .xv. of February. 1573.</cite>, (London: John Awdeley, 1574), unpaginated.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dc9d6f7f58" data-kw="">
<blockquote><p>St. Paul, the apostle of the gentiles, was eminent for occasional conformity. He exhorts the Christians to assert their freedom from the law of ceremonies (Gal. 5:1), lives himself after the manner of the gentiles (Gal. 2:14), and by consequence, in fellowship with them, yet occasionally purified himself in the Temple, according to the Law of Moses. (Acts 21:26) He was a dissenter from the ceremonies of the Law, and yet submits to them to avoid offense [Acts 16:3; 18:21]. He statedly communicated with the gentile Churches, but holds occasional communion with the national Jewish Church. He judged occasional communion lawful, but did not therefore conclude constant communion a duty, nay, it had been sinful to him and all other Christians; for then they must have separated from the fellowship of the Gospel [Acts 15:7-19; Gal. 2:9-21], and renounced Christianity…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-owen.html">James Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Moderation a Virtue</cite>, … (London: Baldwin, 1703), pp. 7-9 Owen (1654-1706) was an English, Independent puritan. By “occasional conformity,” Owen does not mean ever doing that which is sinful.</span></figcaption>

</figure><figure class="quote" id="q-2553d9b193" data-kw="">
<blockquote><p>I know how difficult it is to persuade the world that God disapproves of all modes of worship not expressly sanctioned by His Word. The opposite persuasion which cleaves to them, being seated, as it were, in their very bones and marrow, is, that whatever they do has in itself a sufficient sanction, provided it exhibits some kind of zeal for the honor of God. But since God not only regards as fruitless, but also plainly abominates, whatever we undertake from zeal to His worship, if at variance with His command, what do we gain by a contrary course? The words of God are clear and distinct: “Obedience is better than sacrifice.” (1 Samuel 15:22) “In vain do they worship me, teaching for doctrines the commandments of men,” (Matthew. 15:9.) Every addition to His word, especially in this matter, is a lie. Mere “will worship” (εθελοθρησκεια) is vanity. This is the decision, and when once the judge has decided, it is no longer time to debate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Necessity of Reforming the Church</cite>, Humble Exhortation—The Necessity of Reforming the Church (1543).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-9e7bfcd23f" data-kw="">
<blockquote><p>I. First then, as to the Praises of God. The Scriptures both of the Old and New Testaments require the use of the Psalms in offering up praises to God. We find in the Old Testament (2 Chron. 29:30) [that] Hezekiah the King and the princes commanded the Levites to sing praises to the Lord with the words of David, and of Asaph, and they sang with gladness. This Command of Hezekiah proceeded from God, and was approved by Him. The same way of praising God continued in the Jewish Church till our Saviour’s time: And after that, we have yet a more positive command for the use of them by the apostle, Eph. 5:19, ‘Speaking to your selves in psalms, and hymns, and spiritual songs.’ And Col. 3:16, ‘Let the words of Christ dwell in you richly in all wisdom, teaching and admonishing one another in psalms, and hymns, and spiritual songs; singing and making melody with grace in your hearts to the Lord.’ I think there is no room to doubt, but by the psalms, etc. in these places, is meant the Book of Psalms, which the Holy Ghost has left for this purpose to the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-king.html">William King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Inventions of men</cite>, (Dublin, 1694), Ch. 1, ‘Of Praises’, Section 1, ‘What the Holy Scriptures prescribe concerning them’, pp. 6-7. King (1650-1729) was an Anglican divine in the Church of Ireland and was the archbishop of Dublin.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>The mind of the person who does not seek the sight of her Creator is very hard because she persists in a frozen state on account of herself. But if in the present time she starts to burn with the desire to follow him whom she loves, ‘melted’ by the fire of love, she runs. She becomes eager with desire. She reviles all worldly things that used to bring her pleasure. Nothing except her Creator pleases her.

What first delighted her soul afterward becomes grievously burdensome. Nothing consoles her grief as long as she has still not looked upon him whom she desires. Her mind sorrows. Light itself is wearisome. Scorching fire burns away the rust of sin in her mind. The soul is enflamed like gold because gold loses its luster through use but regains its brightness through fire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-the-great.html">Gregory the Great</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Excerpts from the Works of Gregory the Great on the Song of Songs. Compiled by Paterius and Bede</cite>, (1705) in Gregory the Great on the Song of Songs, trans. Mark DelCogliano (Collegeville MN: Liturgical Press, 2012), p. 173.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

— Gregory the Great, Excerpts from the Works of Gregory the Great on the Song of Songs. Compiled by Paterius and Bede, (1705) in Gregory the Great on the Song of Songs, trans. Mark DelCogliano (Collegeville MN: Liturgical Press, 2012), p. 173.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+mind+of+the+person+who+does+not+seek+the+sight+of+her+Creator+is+very+hard+because+she+persists+in+a+frozen+state+on+account+of+herself.+But+if+in+the+present+time+she+starts+to+burn+with+the+desire+to+follow+him+whom+she+loves%2C+%E2%80%98melted%E2%80%99+by+the+fire+of+love%2C+she+runs.+She+becomes+eager+with+desire.+She+reviles+all+worldly+things+that+used+to+bring+her+pleasure.+Nothing+except+her+Creator+pleases+her.%0A%0AWhat+first+delighted+her+soul+afterward+becomes+grievously+burdensome.+Nothing+consoles+her+grief+as+long+as+she+has+still+not+looked+upon+him+whom+she+desires.+Her+mind+sorrows.+Light+itself+is+wearisome.+Scorching+fire+burns+away+the+rust+of+sin+in+her+mind.+The+soul+is+enflamed+like+gold+because+gold+loses+its+luster+through+use+but+regains+its+brightness+through+fire.%E2%80%9D%0A%0A%E2%80%94+Gregory+the+Great%2C+Excerpts+from+the+Works+of+Gregory+the+Great+on+the+Song+of+Songs.+Compiled+by+Paterius+and+Bede%2C+%281705%29+in+Gregory+the+Great+on+the+Song+of+Songs%2C+trans.+Mark+DelCogliano+%28Collegeville+MN%3A+Liturgical+Press%2C+2012%29%2C+p.+173.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1d9d6aed69.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1d9d6aed69.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/06/05/gregory-the-great-and-the-unfrozen-chosen/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

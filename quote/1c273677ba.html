<main class="wrap"><figure class="quote" id="q-1c273677ba" data-kw="">
<blockquote><p>…the Rejoinder [in opposition to Ames] answers that sopping of bread in wine is worse than the cross:

1. Because the cross makes no alteration, of what Christ did ordain, saying ‘Do this.’

2. It is not substituted in the place of baptism, as sops in wine were by those heretics in place of the [Lord’s] Supper.

3. It is not esteemed an instrumental sign of any grace given by the use of it, as they took their sops to be.

4. Their sopping destroyed the very sacrament. …But [Ames answers]: 1. Addition is as evil as alteration. For when Christ said, ‘Do this,’ He meant as well, do this only, as do this all. Fac hoc totum: fac hoc tantum: as [Jerome] Zanchi expounds it. Addition also is some alteration, if not of the things instituted, yet of the institution, as making it insufficient or incomplete by itself alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, pp. 36-37</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-752dfaf3c6" data-kw="">
<blockquote><p>Secondly, it was not of the substance of the institution [of the Lord’s Supper] to eat unleavened bread, no more than to eat it at night… we are not more bound to the one, than to the other. Again, Christ used unleavened bread because it was the usual bread at that time: so we do use that which is the usual bread in our time. And St. Paul speaketh of such bread as was usual among the gentiles, when he saith, ‘The bread which we break’, 1. Cor. 10:17. Ergo, ordinary bread and leavened [is] to be used, not unleavened.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Concerning the Elements, or the Material Part of the Sacrament, namely Bread and Wine’ in Synopsis Papismi</cite>, (London, 1592), Controversies Concerning the Church Triumphant, 13th Controversy, of the Sacrament of the Lord’s Supper, First Part: of the Sacrament of the Eucharist, 4th Question, p. 462</span></figcaption>

</figure><figure class="quote" id="q-faa49b0340" data-kw="">
<blockquote><p>By reason, therefore, of this laver of repentance and knowledge of God, which has been ordained on account of the transgression of God’s people, as Isaiah cries, we have believed, and testify that that very baptism which he announced is alone able to purify those who have repented; and this is the water of life. But the cisterns which you have dug for yourselves are broken and profitless to you. For what is the use of that baptism which cleanses the flesh and body alone? Baptize the soul from wrath and from covetousness, from envy, and from hatred; and, lo! the body is pure. For this is the symbolic significance of unleavened bread, that you do not commit the old deeds of wicked leaven. But you have understood all things in a carnal sense, and you suppose it to be piety if you do such things, while your souls are filled with deceit, and, in short, with every wickedness. Accordingly, also, after the seven days of eating unleavened bread, God commanded them to mingle new leaven, that is, the performance of other works, and not the imitation of the old and evil works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/justin-martyr.html">Justin Martyr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dialogue with Trypho the Jew</cite>, Ch. 14, Righteousness is Not Placed in Jewish Rites, but in the Conversion of the Heart Given in Baptism by Christ.</span></figcaption>

aver,of%20the%20old%20and%20evil%20works&amp;text=By%20reason%2C%20therefore%2C%20of%20this%20laver%20of%20repentance&amp;text=the%20imitation%20of%20the%20old%20and%20evil%20works" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The third breach of the institution [of the Lord’s Supper] made by kneeling is the taking away of that mystical rite representing Christ’s passion, to wit, the breaking of the bread. The apostle says not, the communion of one bread, but, the communion of one broken bread, hath in it a mystery of our unity. When the bread is carved in little morsels before it be presented to the table, it is not the sacramental and mystical breaking in the use of the sacrament which ought to be performed after the thanksgiving, according to Christ’s example. Augustine says, ‘When that which is blessed on the Lord’s table, sanctified, and broken in small pieces to be distributed,’ etc. This breaking was needful both for mystery and distribution. The breaking of the bread was thought so needful in the sacrament, that it was called ‘breaking of bread.’ The Syriac interpreter translates the breaking of bread ‘Eucharist’ (Acts 2:24, 20:7). [David] Pareus (on 1 Cor. 11) proves at length this rite not to be indifferent, but a thing commanded. Where kneeling is practiced, we read not in their service-books [of the Church of England, seeking to be imposed on the Church of Scotland] of this breaking of bread after thanksgiving, whereby the passion of Christ is not set forth to the communicants as it ought to be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Perth Assembly</cite>, … ([Leiden: Pilgrim Press, 1619]), p. 40</span></figcaption>

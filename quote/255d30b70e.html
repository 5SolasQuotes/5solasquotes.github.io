<main class="wrap"><figure class="quote" id="q-255d30b70e" data-kw="">
<blockquote><p>I cannot but have exceptions against some parts of the paper,” (the Queensferry Covenant) “particularly the prescribing a form of [civil] government stinted to the [Mosaic] Judicial Law. I do not love to be censorious, especially where the scope is to engage to faithfulness and zeal; but I cannot assent to the end of the sixth paragraph, which to me seems too near separation, declaring that any unsuitable deportment of ministers, or their not joining with their brethren in the public testimony, is a sufficient ground of withdrawing from them: This” (add he) “is not the principle nor practice of the Church of Scotland.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ae8fece6a" data-kw="">
<blockquote><p>And when Robert Hamilton came from abroad [from the Netherlands] among them, they got a brow of brass, calling him [i.e. Alexander Shields, one of the last three Cameronian ministers] a liar, and upbraided him to his face, saying, although he used these arguments [to join the 1690 Church of Scotland] to draw them out of the way of the Lord, yet you dare not publish them. I well remember he said, ‘Dare I not? dare I not? I promise before you all, I both dare and will, and avow it before the world.’ [which he did] But alas they still gave us a deaf ear, and now will not be spoken to nor plead with; however it stands for our mite of testimony… But, if the Lord spare, I resolve to give the world a more surprising account of the rude treatment and unheard-of ingratitude Mr. Shields, [Thomas] Linning [another of the last three Cameronian ministers, which joined the 1690 Church of Scotland], and others received at that time, and since, at their hands… …all know that it was the fewest number of the United Societies, that was led off with Robert Hamilton to the disowning of King William as King of Britain and his Government; the greater part [of the Cameronians] reckoned it their duty to take a legal unite way of witnessing, by humble pleadings, representations, and protestations, pleading for and with their mother to put away her whoredoms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-walker.html">Patrick Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Six Saints of the Covenant in 2 vols</cite>, ed. David H. Fleming (London: Hodder &amp; Stoughton, 1901), vol. 1, Alexander Peden’s Life, Postscript, pp. 146-47</span></figcaption>

</figure><figure class="quote" id="q-debfb648a2" data-kw="">
<blockquote><p>…no doubt it was this party headed by Mr. Hamilton, who, as they violently pushed forward the country people to a rising, so by their indiscretion and want of conduct, evidently ruined the west country army, and effectually hindered the fair prospect there once was, that they might have been a mean of delivering the church and nation from the burdens they were under; and the upshot of all was, divisions came in, joint measures were not taken. A great many left them when they saw whither matters were going, and far more never joined them; and such as continued together could never do any thing of consequence: and when they came to be attacked, the high-flyers withdrew first, and left the poor country men to the mercy of the king’s army.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution</cite>, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3, p. 65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-208206c415" data-kw="">
<blockquote><p>News of the ordination of Cameron [by Robert M’Ward and John Brown of Wamphray in the Netherlands in late-July or early-August 1679] and [Thomas] Hog was swiftly carried back to Scotland, where it caused a predictable outburst of indignation amon the older nonconforming ministers. John Carstairs, one of the most senior among them, wrote bitterly to M’Ward on 20 August: ‘I somewhat wonder you have there ordained those two young men–not so very acceptable, to say no more, to the Church of Scotland. I fear it offends many; nor do I see, especially at this time, how it can be so well justified. Do you think that there is no ministerial church amongst the nonconforming ministers in Scotland to ordain whom they think fit to be ordained? And is it suitable to that Christian correspondence and deference that the churches of Christ ought to have with and to one another that a few ministers of the church in Holland should ordain ministers for the Church of Scotland without their desire, consent , allowance or knowledge?’ Carstairs’ view was certainly typical of many of the older and more influential of the ministers, and his letter clearly reflected their resentment at what they saw as a usurpation of their ministerial functions by M’Ward and Brown. It also gave an indication of the sort of reception Cameron could expect on his return to Scotland [in late-1679]. A further hint of the welcome that awaited him was given in a letter from John Dickson to M’Ward on 16 July: ‘As for Mr Cameron, the prejudice against him is screwed up so high that no vindication will allay the feverish spirits of some persons who are maddened against him.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lion of the Covenant: the Story of Richard Cameron</cite>, (Durham: Evangelical Press, 1997), p. 163</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<main class="wrap"><figure class="quote" id="q-f8be272b62" data-kw="">
<blockquote><p>‘Put off thy shoes from thy feet,’ (said the Lord to Moses) ‘for the place whereon thou standest is holy ground.’ Now what made it holy ground? Was it not the Lord’s presence shadowed in the burning bush?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-burton.html">Henry Burton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Seven Vials or a Brief &amp; Plain Exposition upon the 15th &amp; 16th Chapters of the Revelation… (London: Jones, 1628), Second Vial</cite>, p. 38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-09ade8ee7b" data-kw="">
<blockquote><p>The Reformed, however openly they embrace the fact that it is lawul to have a concept of God, and even more, that it is most necessary–unless we want to be atheists!–nevertheless say that a concept of God under the form of a man, or of any corporeal entity at all, is altogether unlawful, because: (1) the Savior in John 4:24 commands us to have a concept of God that agrees with the nature of God, that defines God as a Spirit, and that therefore leads to the result that God is worshipped and adored in spirit, that is, spiritually, without any such forms, and in truth, meaning in thoughts that are true and that agree with the concept… Balduin [a Lutheran] objects: (1) that since whenever we have a concept of God, and we therefore conceive a certain image of God… I respond, Balduin presupposes that having a concept and conceiving an image are synonymous, when in fact they are worlds apart. For under what likeness or image will you conceive of a spirit as it exists in itself?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology trans. Rester &amp; Spangler (RHB, 2019), vol. 2, bk. 2, ch. 6, ‘The Spirituality &amp; Simplicity of God’ | section 12, ‘Is it permitted, while praying, to put God before us under the form of a man? [No]’</cite>, pp. 137-38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

reformedbooksonline.com/images-of-god-are-forbidden/#:~:text=The%20Reformed%2C%20however%20openly%20they%20embrace,spirit%20as%20it%20exists%20in%20itself%3F" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e4ce59d60d" data-kw="">
<blockquote><p>All confidence reposed in creatures … is evidently opposed to a correct knowledge of God, since he who places his trust in creatures makes for himself many gods. Hence God expressly condemns in his word all those who repose their confidence either in men, or in power and riches, or in any created object. Avarice, or covetousness, is included in this vice, and condemned.… Idolatry … There are two forms or species of idolatry. One is, when another beside the true God is professedly worshiped, or, when that is worshiped for God which is no God.… The other form of idolatry is when we do not professedly worship another God, but err in the kind of worship we render unto him.… Those who worship God otherwise than he will be worshipped, imagine another God, one differently affected from what the true God is; and in this way they do not worship God, but a figment of their own brain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, on the First Commandment (creature-trust and forms of idolatry)</span></figcaption>

</figure><figure class="quote" id="q-21f55b1030" data-kw="">
<blockquote><p>Beginning in the second half of the sixth century, a slow but steady diffusion of icons of saints, of Christ, and of the Virgin is evident in the Empire… These icons do not, however, indicate the prevalence of a form of icon worship during this period, for most of them were, in fact, ‘simple commemorative and ex voto images,’ with the exception of some that were considered relics and therefore endowed with miraculous or intercessory powers. The origin of the cult of icons apparently dates to a later time, probably toward the end of the seventh century.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/juan-s-codoner.html">Juan S. Codoñer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Melkites &amp; Icon Worship during the Iconoclastic Period’ in Dumbarton Oaks Papers, vol. 67 (2013), pp. 135-87</cite>, p. 135</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“Beginning in the second half of the sixth century, a slow but steady diffusion of icons of saints, of Christ, and of the Virgin is evident in the Empire… These icons do not, however, indicate the prevalence of a form of icon worship during this period, for most of them were, in fact, ‘simple commemorative and ex voto images,’ with the exception of some that were considered relics and therefore endowed with miraculous or intercessory powers. The origin of the cult of icons apparently dates to a later time, probably toward the end of the seventh century.”

</figure><figure class="quote" id="q-8757ce69f8" data-kw="">
<blockquote><p>…the office-power, no, not though it were from idolaters, for idolatrous purposes, does not make persons actually idolaters, till they do actually exhibit divine worship to a creature. Suppose a person be ordained a priest to offer sacrifice-propitiatory for the quick and dead in the mass; yet if he repent thereof, and never do adore the breaden-god, he is not an idolater: Yea, suppose he act in baptizing, preaching, marrying, burying according to the rituals of the Romanists, by virtue of his ordination as a priest, or, as this author speaks, his office-power, without exhibiting any divine worship to a creature (which in some of these may be), yet is he not thereby an idolater. The reason whereof is manifest, because he is not an idolater to whom the definition of idolatry agrees not. And this is the reason why, if Jeroboam’s priests, though consecrated for the worship of idols, did not worship them, they were not to be accounted idolaters: Nor are those that act by virtue of authority committed to them in matters civil, from rebels [such as Oliver Cromwell], equally guilty of rebellion as those from whom they derive that their authority, unless they act rebelliously; if they act for the restitution of their prince, the public peace, they are accounted good subjects [as many did under Cromwell], and not rebels, though at first they derived their authority from rebels. Nor does the worshipping of God by a form merely of humane composition make idolaters, though it have been abused to idolatry with the rites and modes of idolaters, unless there be idolatry in the form, and the rites and modes be idolatrous in their use: because, notwithstanding this, no divine worship may be given to a creature. So, though the form of baptism in the Roman Church were merely of human composition, used with crossings, cream, oil, spittle, if these rites were used, though by them abused to idolatry, not as they do, so as to give divine worship to a creature, the users in this manner, however guilty of will-worship or superstition, yet would not be justly chargeable with idolatry; no, not though they should in some sort symbolize with idolaters, that is, be assimilated to them or in some sort comply with them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theodulia, or a Just Defence of Hearing the Sermons &amp; other teaching of the present Ministers of England… (London: E. Cotes, 1667) | Sect. 11. Acting in the holy things of God, by an Office-power and modes of Idolaters, may be without Idolatry</cite>, Ch. 7; pp. 245-46</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

+idolaters%2C+unless+there+be+idolatry+in+the+form%2C+and+the+rites+and+modes+be+idolatrous+in+their+use%3A+because%2C+notwithstanding+this%2C+no+divine+worship+may+be+given+to+a+creature.+So%2C+though+the+form+of+baptism+in+the+Roman+Church+were+merely+of+human+composition%2C+used+with+crossings%2C+cream%2C+oil%2C+spittle%2C+if+these+rites+were+used%2C+though+by+them+abused+to+idolatry%2C+not+as+they+do%2C+so+as+to+give+divine+worship+to+a+creature%2C+the+users+in+this+manner%2C+however+guilty+of+will-worship+or+superstition%2C+yet+would+not+be+justly+chargeable+with+idolatry%3B+no%2C+not+though+they+should+in+some+sort+symbolize+with+idolaters%2C+that+is%2C+be+assimilated+to+them+or+in+some+sort+comply+with+them.%E2%80%9D%0A%0A%E2%80%94+John+Tombes%2C+Theodulia%2C+or+a+Just+Defence+of+Hearing+the+Sermons+%26+other+teaching+of+the+present+Ministers+of+England%E2%80%A6+%28London%3A+E.+Cotes%2C+1667%29+%7C+Sect.+11.+Acting+in+the+holy+things+of+God%2C+by+an+Office-power+and+modes+of+Idolaters%2C+may+be+without+Idolatry%2C+Ch.+7%3B+pp.+245-46&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8757ce69f8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8757ce69f8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-idolatry/#:~:text=%E2%80%A6the%20office%2Dpower%2C%20no%2C%20not%20though%20it,in%20some%20sort%20comply%20with%20them." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-1e4156c92d" data-kw="">
<blockquote><p>This one thing I add more; that it is the duty of a christian magistrate, or at leastwise of a good householder, to compel to amendment the breakers and contemners of God’s sabbath and worship. The peers of Israel, and all the people of God, did stone to death (as the Lord commanded them) the man that disobediently did gather sticks on the sabbath-day [Numbers 15:32-6]. Why then should it not be lawful for a christian magistrate to punish by bodily imprisonment, by loss of goods, or by death, the despisers of religion, of the true and lawful worship of the sabbath-day? […] For it is a heinous sin and a detestable schism, if the congregation be assembled, either in cities or villages, for thee then to seek out byways to hide thyself, and not to come from there, but to contemn the church of God and assembly of saints: as the Anabaptists have taken an use to do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 261-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8ce759dff3" data-kw="">
<blockquote><p>Here we come to the issue of psalms versus hymns. Our fathers ruled that, with a few exceptions, only the singing of psalms was permitted in the assembly of believers. When hymns were introduced in 1807 (by unlawful ecclesiastical might) many people objected to them and refused to sing them when announced from the pulpit. At the time of the restoration of the church in the Secession and Doleantie [Sorrowing], the position was reaffirmed that only psalms were to be sung.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/abraham-kuyper.html">Abraham Kuyper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Our Worship</cite>, trans. Harry Boonstra (Grand Rapids: William B. Eerdmans Publishing Co., 2009), 37</span></figcaption>

</figure><figure class="quote" id="q-267606c00b" data-kw="">
<blockquote><p>6. The Word is God’s mean to work supernatural effects, to convert the soul, Ps. 19:7, to work faith, Jn. 20:3, to edify, Acts 20:32, to save, Rom. 1:16. The obedience to God’s Word, brings peace, Ps. 119:165, comfort, v. 50; Gen. 49:18; Isa. 38:3. But ceremonies, being apt to stir up the dull mind, must be apt to remove natural dullness, which is a supernatural effect, and so to bring, peace, joy, comfort: Organs are now holden by the same right, that they were in Moses’ Law, then they must stir up supernatural joy: There must be peace and comfort in practicing them. Hear how this sounds: ‘This is my comfort, O Lord, in my affliction, that thy surplice, organs, and holy-days have quickened my dull heart.’ Now what comfort [is there], except comfort in the Scriptures? Rom. 15:4. Ceremonies be innocent of all Scriptures [have nothing of the Scriptures in them]. What joy (a proper fruit of the Kingdom of Heaven, Rom. 14:17) can be in sapless ceremonies? Yea, observe:

1. Who truly converted from Popery, who [is] inwardly humbled in soul, does not abhor ceremonies by the instinct of the new birth?

2. What slave of hell and profane person call not for ceremonies?

3. Who has peace in dying that ceremonies were their joy?

7. All lawful ordinances may by prayer be recommended to God for a blessed success as all the means of salvation, Ps. 119:18; Mt. 26:26; Acts 4:29-30.

2. We may thank God for a blessed success, which they have by the working of the spirit of Grace, 2 Cor. 2:24; 1 Cor. 1:4-5; 2 Thess. 1:2-3; Eph. 1:3.

3. We are to have heat of zeal against profaning of Word, sacraments, prayer, or other ordinances of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), Question 3, ‘Whether Ceremonies Have any Divinity in Them’, p. 132</span></figcaption>

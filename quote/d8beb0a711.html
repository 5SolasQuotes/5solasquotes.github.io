<main class="wrap"><figure class="quote" id="q-d8beb0a711" data-kw="">
<blockquote><p>[T]here be those that will not come to the Sacrament of the Lord’s Supper, (I speak what I know) because they say it is a sacred thing; and if they come there, they must enter into a solemn Covenant with God, which they know they cannot keep, and therefore they forbear to come:

I commend the reverent esteem which these people have of that sacred Institution; but I cannot but mourn for this, that they are afraid to tie themselves to God: Doth David desire and beg of God, To knit his heart unto him, Psal. 86.11. And doth Saint James say, Draw near unto God, and he will draw near unto you, and do these fear being tied too close to God? Again, I cannot but mourn to see the Devil transformed into an Angel of light in this matter; I confess a man that comes to God’s Table ought seriously to bethink himself what he goes about; but yet let me advise you, not to run into one sin, under a pretence of avoiding another: for what knowest thou, but if thou come prepared, that in thy receiving those sacred mysteries, God may give thee strength to do all that thou promisest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/josiah-shute.html">Josiah Shute</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Cordials: Delivered in ten sermons, upon part of the ninth and tenth chapters of Ezra, in a time of visitation. By that godly and faithful preacher of God’s Word, Josiah Shute, B.D. and late rector of Mary Woolnoth’s in Lumbard-Street London</cite>, (London: Robert Bostock, 1644), pp 149-50.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

I commend the reverent esteem which these people have of that sacred Institution; but I cannot but mourn for this, that they are afraid to tie themselves to God: Doth David desire and beg of God, To knit his heart unto him, Psal. 86.11. And doth Saint James say, Draw near unto God, and he will draw near unto you, and do these fear being tied too close to God? Again, I cannot but mourn to see the Devil transformed into an Angel of light in this matter; I confess a man that comes to God’s Table ought seriously to bethink himself what he goes about; but yet let me advise you, not to run into one sin, under a pretence of avoiding another: for what knowest thou, but if thou come prepared, that in thy receiving those sacred mysteries, God may give thee strength to do all that thou promisest.”

</figure><figure class="quote" id="q-98a8c10b1e" data-kw="">
<blockquote><p>That has been the uniform and constant order of this Church [of Scotland], since the reformation [in 1560]: that the communicants should receive the sacramental elements of bread and wine, sitting at the table. In the second head of the First Book of Discipline [of the Church of Scotland, 1560], are set down these words: ‘The table of the Lord is then rightly ministered when it approaches most near to Christ’s own action, but it is plain that at that supper Christ Jesus sat with his disciples, and therefore we do judge that sitting at a table is most convenient to that holy action.’ In the general Assembly held in December 1562 it was ordained, That one uniform order be observed in the ministration of the sacraments, according to the order of Geneva [Switzerland, where John Calvin was]… But so it is, that sitting at the table in the act of receiving has been established by laws, custom, long prescription of time and confirmed by oaths and subscriptions as is evident by the former deduction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Perth Assembly</cite>, (1619), pp. 33-34</span></figcaption>

</figure><figure class="quote" id="q-9438919582" data-kw="">
<blockquote><p>This toleration of drunkards and swearers in the Lord’s Church and at his Table infects and is apt to leaven all with their evil conversation, but does not leaven the worship to the fellow-worshippers, nor is the sin of private persons, yea nor of our ministers, who have not power to help it (but it is the fault of the Church), except you make no separation from a Church where a scandalous person is tolerated (for suffering more or fewer does not vary the species) to be a sin publicly to be repented, before any can be members of your Church, which is prodigious to us.</p></blockquote>

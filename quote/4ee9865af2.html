<main class="wrap"><figure class="quote" id="q-4ee9865af2" data-kw="">
<blockquote><p>With that in mind, I contend that the best commonwealth is the one that has as its chief end, the common or public good, especially in relation to spiritual matters, the glorifying and enjoying of God forever. If this is the chief end of man, it ought to be the chief end of every institution in the world, whether government, school, family, or religious assembly… If the chief end of government is the public good, as the [Westminster] Confession says and the American founders said, especially the spiritual welfare of its subjects, then he [the magistrate] must both decide what is true religion for himself and promote it. The most obvious means is the enforcement of God’s moral law, classically understood as both tables of the Decalogue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-lynch.html">Michael Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Almost Christian Nationalist”</cite>, (2025) at American Reformer</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c9001b2502" data-kw="">
<blockquote><p>[John Brown of] Wamphray argues, ‘2. If the Council’s act or grant… be sinful, then the giving of this bond [by the indulged]… must be much more sinful…’ Yet it is plain, though an authority sin in giving commands, it is not necessarily sinful for one to keep, or promise to keep, those commands (otherwise there would be no such thing as passive obedience, but there is). [Richard] Baxter had previously, rightly argued at length¹ against the view Wamphray puts forth; Baxter’s position was precisely the indulged ministers’ viewpoint.² ¹ Baxter, Five Disputations, 5th Disputation, ch. 12, ”It may be very sinful to command some ceremonies, when yet it may be the subjects’ duty to use them when they are commanded,” pp. 460–63. ² Bairdie: “your indulged ministers, looking upon these statuted rules, at least ways, as unjust upon their matter, have never embraced nor observed them, except it be in some civil points (inflicted on them as penal), and that only so far as they judged might be lawfully submitted unto, however unjustly imposed.” Balm from Gilead, p. 77. Saul unjustly required 100 Philistine foreskins for David to marry his daughter. David gave 200 (1 Sam. 18:17–27) and could have promised to do so in that broken and declining Church. The king of Babylon sinfully exacted from king Zedekiah of Israel an oath to serve him. Zedekiah broke this oath and would not serve him in that broken and declining Church-state. God condemned Zedekiah for it, seeing as he should have kept the sinfully exacted service (Eze. 17:11–19). The magistrates sinfully required Christ to pay an Erastian, tribute tax upon the Church (Mt. 17:24–27). Christ, speaking of his example as a precedent for all his disciples for all history, chose the lesser material evil (or rather fulfilled the highest good attainable), submitted to this bondage, here declined the exercise of his (and our) Christian liberty and publicly gave that bond while verbally testifying privately (not publicly) that He was not so subject (Mt. 17:24–27). Is this a protestatio contraria facto, “a protestation contrary to fact,” as the non-indulged censured the indulged with?³ Did Jesus compromise his authority or the exercise of his ministry? Pilate’s court sinfully determined Christ to be crucified (Jn. 19:15–16). Christ willingly took up his cross (Jn. 19:17); He had power to lay down his own life (Jn. 10:15), as we do (Jn. 15:13), for his sheep. Therefore the Father loves Him (Jn. 10:17). ³ Wodrow, History, 2.179 &amp; 492. Was the protest God told Samuel to make against the people’s desires having their own human king contrary to the fact when Samuel, per God’s direction, facilitated, anointed and enthroned king Saul for them? (1 Sam. 8:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), pp. 150-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

%982,Saul%20for%20them%3F%20%281%20Sam.%208%3A9&amp;text=John%20Brown%20of%5D%20Wamphray%20argues%2C%20%E2%80%982.%20If%20the&amp;text=enthroned%20king%20Saul%20for%20them%3F%20%281%20Sam.%208%3A9" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-89f7088cea" data-kw="">
<blockquote><p>Next to fidelity towards God, study to adorn your cause with loyalty to your king, in the Lord, Rom. 13:1, 5; Prov. 24:21; 1 Pet. 2:13. ‘Give unto God the things which are God’s, and unto Ceasar the things which are Cesar’s,” that hereby ye may stop the mouths of them that falsely speak evil of the presbyterian interest and party as inimical to king’s crowns, 1 Pet. 2:15. Did he not in the Usurper’s [Cromwell’s] time find you the most faithful party to him of any? And albeit ye be but ill requat, yet discourage not to follow your duty for the Lord’s sake. We are apt to believe, if any other party in the nation had been so crushed and harassed by his power as ye, none would have born it better. Let him still find that no discouragement will fret or tempt you from your duty and that for conscience-sake, without by-ends; yea, bear due allegiance to him so far as may stand with your allegiance to the King of kings and Lord of lords. And who knows what a conviction this may produce in end? 1 Sam. 24:17-18, testifying to him and all men your cause is of God, which leads you to be so conscientious toward man; and that you are the only fast and faithful friends to authority, who will cleave to it in a stormy day out of the fear of God when all its self-seeking friends will desert it when their interest parts with it; and that it is not humor, but conscience which keeps you off from complying with his will in the matters of your God wherein ye differ from him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland</cite>, (1674; London: Cockerill, 1681), pp. 171-72</span></figcaption>

</figure><figure class="quote" id="q-81e332f51c" data-kw="">
<blockquote><p>The paying of money to the clerks [related to the Scottish third Indulgence of 1679]… These clerks seek it not by the prelates’ authority, but upon the [civil] council’s appointment, backed with charges of horning [being declared a rebel and having civil protections taken away]; and whether it be rather eligible to [choose to] pay a little money, or to be put to the horn and taken with caption, let any sober person judge. The scruples that the author [John Brown of Wamphray] and some others have put in the people’s heads about paying of stipends to the conformists and sessors [tax assessors and collectors] have wasted some peoples’ estates and tends to waste their consciences; for when they are quartered on and eaten up and plundered, they are driven to do what they thought sinful [i.e. to pay the tax]; and this disposes them to do things that are truly sinful upon temptations; and when they are by necessity driven to pay, they who wait for their halting, allege they have no conscience; and if they were put to it in other things, they would do all that would be required of them.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The paying of money to the clerks [related to the Scottish third Indulgence of 1679]… These clerks seek it not by the prelates’ authority, but upon the [civil] council’s appointment, backed with charges of horning [being declared a rebel and having civil protections taken away]; and whether it be rather eligible to [choose to] pay a little money, or to be put to the horn and taken with caption, let any sober person judge. The scruples that the author [John Brown of Wamphray] and some others have put in the people’s heads about paying of stipends to the conformists and sessors [tax assessors and collectors] have wasted some peoples’ estates and tends to waste their consciences; for when they are quartered on and eaten up and plundered, they are driven to do what they thought sinful [i.e. to pay the tax]; and this disposes them to do things that are truly sinful upon temptations; and when they are by necessity driven to pay, they who wait for their halting, allege they have no conscience; and if they were put to it in other things, they would do all that would be required of them.”

<blockquote><p>…for the king and people are each of them above and below others in divers respects: the people, because they create the man king, they are so above the king, and have a virtual power to compel him to do his duty; and the king, as king, has an authoritative power above the people, because royalty is formally in him, and originally and virtually only in the people, therefore may he compel them to their duty, as we shall hear anon; and therefore there is no need of an earthly ruler higher than both, to compel both.</p></blockquote>

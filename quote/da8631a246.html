<main class="wrap"><figure class="quote" id="q-da8631a246" data-kw="">
<blockquote><p>The dress of the Ministers in the English Church at Geneva [under John Knox] is a matter which is perplexing, for there is no evidence available indicating precisely what was the custom. … [John] Paullain [1517–1565, an English reformer], in his ‘Ad lectorem candidum’ (Lit. sac., P, Q) [‘To the Bright Reader’, in Liturgia Sacra, seu Ritus Ministerii in Ecclesia Peregrinorum… 1551/4], on the other hand, states quite definitely that vestments are not worn in his congregation. He urges that the New Testament does not prescribe a Minister’s apparel, and that a shepherd is not known to his sheep by his garb but by his call to them, and he thinks it sufficient that a Minister should be dressed modestly and soberly, with an absence of all pomp and arrogance. Further, he regards vestments as an incitement to superstition because of the Roman custom of blessing the garments. Thus he thought that in this as in other matters the Reformed Church should be content with the utmost simplicity. In England the Puritan party objected strenuously to all vestments. As early as 1562 request was made to Convocation ‘that the use of copes and surplices… be taken away; so that all ministers in their ministry use a grave, comely, and side-garment, as commonly they do in preaching’ and ‘that the ministers of the word and sacraments be not compelled to wear such gowns and caps, as the enemies of Christ’s gospel have chosen to be the special array of their priesthood’ ([John] Strype, Annals, Oxford ed., 1824, vol. i., pt. ii. 501). And in the same period we find the bishops enforcing the cassock and gown and forbidding the Puritan custom of preaching in what Bishop Duppa called ‘a riding or ambulatory Cloake’ (Rit. Com. Rep. ii. 577). The objections in these passages are against all gowns… Certainly [Myles] Coverdale [1488–1569] objected to all gowns, as we see by his letter to Farel in 1556: ‘Our affairs are not altered for the better, but alas! are sadly deteriorated. For it is now settled and determines… that out of doors must be worn the square cap, bands, a long gown and tippet; while the white surplice and cope are to be retained in divine service’ (Parker Soc. Zurich Letters, p. 121, Let. 50). … This brief review of the early evidence in Strasburg, Frankfort [Germany], Geneva, England and Scotland, shows that there appears to have been no practice that was agreed upon by all who followed the Calvinistic Reformation, and as regards the English Church of Geneva no accurate conjecture can be made. It is probable that the Ministers there adopted Calvin’s practice and wore the black gown, with cassock, bands, and scarf; but there can be no certainty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-maxwell.html">William Maxwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Appendix G, ‘The Dress of the Ministers’ in John Knox’s Genevan Service Book</cite>, 1556; The Liturgical Portions of the Genevan Service Book Used by John Knox While a Minister of the English Congregation of Marian Exiles at Geneva, 1556-1559 (Edinburgh: Oliver &amp; Boyd, 1931), pp. 210-13</span></figcaption>

van-gowns/#:~:text=The%20dress%20of%20the%20Ministers%20in,but%20there%20can%20be%20no%20certainty&amp;text=The%20dress%20of%20the%20Ministers%20in%20the%20English&amp;text=and%20scarf%3B%20but%20there%20can%20be%20no%20certainty" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e0034c6279" data-kw="">
<blockquote><p>Other of the ceremonies that are not evil in their own nature, yet were devised to evil, for example, the surplice. The replier to Dr. Mourton’s Particular Defence, observes (ch. 1, section 3), that this superstition about apparel in divine worship began first among the French bishops, unto whom Caelestinus writes thus. Discernendi, etc. ‘We are to be distinguished from the common people and others by doctrine, not by garment, by conversation, not by habit, by the purity of mind, not by attire: for if we study to innovation, we tread underfoot the order which has been delivered unto us by our fathers, to make place to idle superstitions; wherefore we ought not lead the minds of the faithful into such things: for they are rather to be instructed than played withal: neither are we to blind and beguile their eyes, but to infuse instructions into their minds.’ In which words Caelestinus reprehends this apparel, as a novelty which tended to superstition, and made way to the mocking and deceiving of the faithful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 9, p. 47</span></figcaption>

<blockquote><p>That keen and bitter controversy which was carried on in England during the reign of Elizabeth regarding the wearing of vestments had to do with the renunciation of the doctrines of a priestly office in the Church. The strict Reformers were persuaded that not even the vestments suggesting priestliness should be worn by officiating ministers. It was not such an indifferent matter as some have thought. … Very probably in England, but for Elizabeth, the priestly vestments would have been discarded. She insisted on the wearing of them. In the Marprelate Tracts they are spoken of as ‘Queen Elizabeth’s livery.’ In other churches of the Reformation the priestly vestments for the ministry were not continued. The dress of officiating ministers became distinctive, but it was not priestly. A biographer of Zwingli, with reference to Zurich, says: ‘ministers wore their ordinary dress in the pulpit, but this dress characterized by a black cloak and white ruff, was worn by others only on gala occasions, and when it passed out of (general) fashion it became the distinctive ministerial dress.’ ([Samuel Macauley] Jackson, [Huldreich Zwingli: The Reformer of German Switzerland, 1584-1531 (NY &amp; London: Knickbocker Press, 1903)] pp. 290, 291) In a short biography of Bullinger, among other matters, his custom in dress is referred to:… ([G.R.] Zimmermann, [Die Zurcher Kirche (Zurich, 1878),] p. 43) “How far from all vain adornment and official glory he was can clearly be seen from the fact that he went up into the pulpit in his civilian style of dress.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-l-ainslie.html">J.L. Ainslie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 36-37 of Ch. 2, ‘The Ordinary Duties of the Reformed Ministerial Order’ in The Doctrines of Ministerial Order in the Reformed Churches of the 16th and 17th Centuries (Edinburgh: T. &amp; T. Clark, 1940)</span></figcaption>

<blockquote><p>Seeing that Christ Jesus is He whom God the Father hath commanded only to be heard and followed of his sheep, we judge it necessary that… all doctrine repugnant to the same, be utterly repressed, as damnable to man’s salvation. …By the contrary doctrine we understand whatsoever men by laws, counsels, or constitutions, have imposed upon the consciences of men, without the expressed commandment of God’s Word, such as be the vows to chastity, forswearing of marriage, binding of men and women to several and disguised apparels…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Seeing that Christ Jesus is He whom God the Father hath commanded only to be heard and followed of his sheep, we judge it necessary that… all doctrine repugnant to the same, be utterly repressed, as damnable to man’s salvation. …By the contrary doctrine we understand whatsoever men by laws, counsels, or constitutions, have imposed upon the consciences of men, without the expressed commandment of God’s Word, such as be the vows to chastity, forswearing of marriage, binding of men and women to several and disguised apparels…”

<blockquote><p>The church and its supreme governor demanded obedience in all things indifferent. Nonconformists (and it was in this context that the word ‘nonconformist’ first entered the English religious vocabulary) complained that to enforce the use of these things on reluctant consciences was to deprive them of their indifference. The doctrine of ‘Christian liberty’ which came to the fore in these circumstances, was arguably the taproot of that species of Christian conviction known ever since as Puritanism. It was not equivalent to individualistic license, but rather to a conviction that the edification of the church, composed of ‘lively stones’, required the emancipation of conscience from all human ordinances and its total subjection to the word of God… … In 1566 Archbishop Matthew Parker, in consultation with his suffragans and prompted by the queen, published some ‘Advertisements,’ a call to strict conformity… The resultant crisis rocked both the universities of Oxford and Cambridge and came to its head in London, toward Easter 1566. Thirty-seven ministers, much of the preaching ministry in London, at first refused to conform and were suspended; of these a few, the hardest of the hard core, were eventually deprived of their livings… …the Vestiarian Controversy introduced a lasting fault line into the Elizabethan church. The more drastic presbyterianism of the 1570’s might never have come about if it had not been for the episcopal ‘persecution’ of those who cast off the surplice in the 1560’s.</p></blockquote>

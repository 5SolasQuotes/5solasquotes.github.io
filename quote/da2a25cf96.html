<main class="wrap"><figure class="quote" id="q-da2a25cf96" data-kw="">
<blockquote><p>We should, in our own churches, keep to apostolic precedent, and follow the rule of Christ in all things. No venerable name is sufficient authority for going aside from Holy Scripture. &quot;To the law and to the testimony;&quot; if a doctrine or a ceremony is not there, it is nowhere for you and for me. Our sole authority is the Word of the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An All Around Ministry</cite>, ch. 12, The Minister in These Times, pp. 404–405</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c93bf87ff0" data-kw="">
<blockquote><p>As Christ is the only sovereign Ruler of the Church, His word is the only word that is law in the absolute sense. Consequently, all despotic power is contraband in the Church. There is no ruling power independent of Christ. The Pope of Rome stands condemned in that he, while professing to be Christ&#x27;s vicar on earth, virtually supplants Christ and supersedes His word by human innovations. He not only places tradition on an equal footing with Scripture, but also claims to be the infallible interpreter of both when speaking ex cathedra in matters of faith and morals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, Part Five, The Doctrine of the Church, ch. III (Government of the Church)</span></figcaption>

</figure><figure class="quote" id="q-b0bb8e9b19" data-kw="">
<blockquote><p>Paul subordinates himself, all preachers, all the angels of heaven, everybody to the Sacred Scriptures. We are not the masters, judges, or arbiters, but witnesses, disciples, and confessors of the Scriptures, whether we be pope, Luther, Augustine, Paul, or an angel from heaven.</p></blockquote>

</figure><figure class="quote" id="q-b48112252c" data-kw="Mary Queen of Heaven Mediator">
<blockquote><p>In brief, there is scarcely one title given to Jesus Christ, nor one which prophesies of Him, which they do not attribute to her, calling her Queen of Heaven, Porter of Paradise, their life, their sweetness, treasurer of grace, the refuge and advocate of sinners—thus dishonoring Him and also making the poor people understand that they honor her contrary to the whole Word of God and the writings of the most ancient teachers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, 1560, Point 7, §4: The Papists Abolish the True Intercession of Jesus Christ</span></figcaption>

</figure><figure class="quote" id="q-16910d1a50" data-kw="">
<blockquote><p>We hold that the Scriptures are most perfect, containing in them all doctrines needful to salvation, whether they concern faith or manners: and therefore we acknowledge no such traditions beside the written word, which shall be necessary to salvation; so as he which believe them not, cannot be saved.</p></blockquote>

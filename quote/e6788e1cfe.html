<main class="wrap"><figure class="quote" id="q-e6788e1cfe" data-kw="">
<blockquote><p>Circumstances are either such as follow actions as actions, or such as are arbitrarily superadded and adjoined by command unto actions, which do not of their own accord, nor naturally nor necessarily attend them. Now religious actions in the worship of God are actions still. Their religious relation does not destroy their natural being. Those circumstances then which do attend such actions as actions, not determined by divine institution may be ordered, disposed of, and regulated by the prudence of men. For instance, prayer is a part of God’s worship. Public prayer is so, as appointed by Him. This as it is an action to be performed by man cannot be done without the assignment of time, and place, and sundry other things, if order and conveniency be attended. These are circumstances that attend all actions of that nature to be performed by a community, whether they relate to the worship of God or no. These men may according as they see good regulate and change as there is occasion: I mean they may do so who are acknowledged to have power in such things. As the action cannot be without them, so their regulation is arbitrary if they come not under some divine disposition and order, as that of time in general does. There are also some things which some men call circumstances also, that no way belong of themselves to the actions whereof they are said to be the circumstances, nor do attend them, but are imposed on them, or annexed unto them, by the arbitrary authority of those who take upon them to give order and rules in such cases. Such is to pray before an image, or towards the East, or to use this or that form of prayer in such Gospel administrations and no other. These are not circumstances attending the nature of the thing itself, but are arbitrarily superadded to the things that they are appointed to accompany.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit</cite>, (London, 1662), ch. 7, p. 42</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-293341cf5f" data-kw="">

<blockquote><p>§27. Though all these things are left to human determination, and so are indifferent in themselves, before; yet may they become accidentally necessary or unlawful. And though man must determine of them, yet not as he list, without a rule: but by those sufficient general directions which God has given in Scripture, and the end and nature of the work. And to cross these directions is a sin in him that does determine.</p></blockquote>

</figure><figure class="quote" id="q-df81039e94" data-kw="">
<blockquote><p>Upon all these reasons I advise all that love their time, their souls, their God and happiness, to turn away from these nurseries of vice and to delight themselves in the Law and ordinances of their Savior, Ps. 1:2-3.</p></blockquote>

</figure><figure class="quote" id="q-e902daaad4" data-kw="">
<blockquote><p>Thirdly, to introduce significant sacred ceremonies into the New testament, other than the holy sacraments of God’s own institution, were to reduce Judaism and to impose upon us again the yoke of a ceremonial Law, which Christ has taken off. … Upon this ground also does Perkins condemn all human significant ceremonies. ‘Ceremonies,’ says he, ‘are either of figure and signification, or of order.’ (Com. On Gal. 3:24) The first are abrogated at the coming of Christ, etc. Upon the same ground does Chemnitius condemn them, Quod vero praetenditur, etc. ‘But whereas,’ says he, ‘it is pretended that by those rites of men’s addition, many things are profitably signified, admonished, and taught: Hereto it may be answered that figures do properly belong to the Old Testament: but those things which Christ would have to be taught in the New Testament, he would have them delivered and propounded, not by shadows, but by the light of the Word. And we have a promise of the efficacy of the Word, but not of figures invented by men. (Exam., part 2, de rit. in admin. sacram., p. 32)</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Thirdly, to introduce significant sacred ceremonies into the New testament, other than the holy sacraments of God’s own institution, were to reduce Judaism and to impose upon us again the yoke of a ceremonial Law, which Christ has taken off. … Upon this ground also does Perkins condemn all human significant ceremonies. ‘Ceremonies,’ says he, ‘are either of figure and signification, or of order.’ (Com. On Gal. 3:24) The first are abrogated at the coming of Christ, etc. Upon the same ground does Chemnitius condemn them, Quod vero praetenditur, etc. ‘But whereas,’ says he, ‘it is pretended that by those rites of men’s addition, many things are profitably signified, admonished, and taught: Hereto it may be answered that figures do properly belong to the Old Testament: but those things which Christ would have to be taught in the New Testament, he would have them delivered and propounded, not by shadows, but by the light of the Word. And we have a promise of the efficacy of the Word, but not of figures invented by men. (Exam., part 2, de rit. in admin. sacram., p. 32)”

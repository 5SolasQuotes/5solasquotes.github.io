<main class="wrap"><figure class="quote" id="q-fdb39db659" data-kw="">
<blockquote><p>Christianity they will tell us is a life and not a doctrine. Now that seems to be a devout and pious utterance, but it is radically false all the same, and to see that it is false you do not need even to be a Christian, you need have just common sense and common honesty. For when you say that Christianity is this or that, you are making an assertion in the sphere of history. You are not saying what you think ought to be true, but what you think actually is a fact. When people say that Christianity is this or that—some have ventured the absurd assertion that Christianity is democracy —when you say Christianity is this or that, you are making an assertion in the sphere of history. It is just like saying that the Roman Empire under Nero was a free democracy. It is possible that the Roman Empire under Nero might have been a great deal better if it had been a free democracy, but the question is whether as a matter of fact it was a free democracy or not. So when you say that Christianity is a life, not a doctrine, you are making an assertion in the sphere of history, because Christianity is an historical phenomenon exactly like the Roman Empire, like the kingdom of Prussia or the United States of America.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Christianity Vs. Modern Liberalism”</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d4d6caafe5" data-kw="">
<blockquote><p>Did the [Solemn League and] Covenant or our Profession [of Christianity] ever bind us to take the [Anglican] Liturgy, to be worse than it is, or the parish churches to be [considered] no churches, or their communion utterly unlawful? Or did it bind us to prefer a desertion of all public communion before it? No, it did not; but if it had, it had been sinful, and to be repented of. But, 1. We were bound by God’s word (and no covenant, or practices bind us to any more than Scripture binds us to) to avoid all that is sin. 2. And when we have our choice to prefer the best; he that does either turn to sin, or prefer a less good, when it is so, before a greater, goes back; but he that prefers no public worship before the parish worship goes back indeed and breaks the Covenant, by profaneness and schism. God’s Word is a clearer and surer test of our duty and controversies than any human covenants. When ministers were changed [in] 1647, many places got out [of the church] some tolerable weak ministers to get in abler men in [the churches in] great towns. When the bishops returned, their abler ministers being dead or ejected, they took the old ones again. Did these go back from Covenant Reformation or duty when they could have no better? Had not those been the revolters [to the Covenant] that would rather have had none?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (1683; London: Parkhurst, 1689)</cite>, ch. 58, p. 232</span></figcaption>

</figure><figure class="quote" id="q-238d431ef1" data-kw="">
<blockquote><p>It is known that this duty is frequently enjoined and prescribed unto us: Col. 3:5, “Mortify therefore your members which are upon the earth; fornication, uncleanness, inordinate affection, evil concupiscence, and covetousness, which is idolatry.” … The “members that are upon the earth” are our affections: for in the outward part of the body sin is not seated; in particular, not “covetousness,” which is there enumerated, to be mortified amongst our members that are on the earth. Yea, after grace hath taken possession of the soul, the affections do become the principal seat of the remainders of sin.… Hence the great duty of mortification is chiefly directed to take place upon the affections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Mortification of Sin in Believers</cite>, on Col. 3:5 (covetousness which is idolatry)</span></figcaption>

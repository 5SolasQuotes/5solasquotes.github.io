<main class="wrap"><figure class="quote" id="q-1c5719e6b4" data-kw="Private spirit">
<blockquote><p>I answer, first, that we do not send any one who is in doubt on any matter to his private spirit, neglecting all means of finding truth, as the Jesuit falsely objects to us; but to scripture itself, and the Holy Spirit speaking publicly in the scripture, who, we say, ought to be heard, and by whose authority we maintain that all controversies should be decided: which also was the very thing done in this council.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a7d656db67" data-kw="Augustine Authority of the church">
<blockquote><p>Augustine, therefore, does not here say that the faith of the godly is founded on the authority of the Church; nor does he mean that the certainty of the gospel depends upon it; … the obvious inference from them is, that this holy man had no intention to suspend our faith in Scripture on the nod or decision of the Church, but only to intimate (what we too admit to be true) that those who are not yet enlightened by the Spirit of God, become teachable by reverence for the Church, and thus submit to learn the faith of Christ from the gospel. In this way, though the authority of the Church leads us on, and prepares us to believe in the gospel, it is plain that Augustine would have the certainty of the godly to rest on a very different foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.7.3</span></figcaption>

</figure><figure class="quote" id="q-265ad77090" data-kw="">
<blockquote><p>Our opinion is, that the supreme decision and authority in the interpretation of scripture should not be ascribed to the church, but to the scripture itself, and to the Holy Spirit, as well speaking plainly in the scriptures as also secretly confirming the same in our hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question V, ch. 8</span></figcaption>

— William Whitaker, A Disputation on Holy Scripture, Question V, ch. 8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COur+opinion+is%2C+that+the+supreme+decision+and+authority+in+the+interpretation+of+scripture+should+not+be+ascribed+to+the+church%2C+but+to+the+scripture+itself%2C+and+to+the+Holy+Spirit%2C+as+well+speaking+plainly+in+the+scriptures+as+also+secretly+confirming+the+same+in+our+hearts.%E2%80%9D%0A%0A%E2%80%94+William+Whitaker%2C+A+Disputation+on+Holy+Scripture%2C+Question+V%2C+ch.+8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F265ad77090.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/265ad77090.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-5e87bb7bf1" data-kw="Supreme judge">
<blockquote><p>The supreme judge of controversies and legitimate interpreter of scripture should have these three properties: the first is, that we should certainly know that the sentence which he delivers is true, and that we can acquiesce in it; the second, that no appeal from that sentence shall be lawful; the third, that he be influenced by no partiality. Now the church or the pope possess none of these; whereas the scripture, and the Holy Spirit speaking in the scripture, have them all. Therefore the supreme decision is to be given to them, and not to the church or the pope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 8</span></figcaption>

</figure><figure class="quote" id="q-638e3a3824" data-kw="Interpretation">
<blockquote><p>The infallible rule of interpretation of Scripture is the Scripture itself; and therefore when there is a question about the true and full sense of any Scripture (which are not many, but one), it must be searched by other places that speak more clearly.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-41f772fa49" data-kw="">
<blockquote><p>In the third place, it will be helpful to consider in what way Christ gave himself up for us. It was according to the will of God our Father, that is to say, of the same God who is the Father of us all, who not only created us but who also gave us a new birth in Christ so that he might adopt us as his children and heirs. It was the Father’s will that the Son should empty himself and be made man, not someone full of earthly power and authority. Instead of that, he took on the form of a servant and became the most despised of all mortal creatures, suffering every hostile and sorry thing that can happen to us in the course of this mortal life.

He was so obedient to this decree of his Father’s that he chose to be born poor and indigent, to a very poor mother in a stable. From boyhood he was educated in the hard work of his hands, and after suffering everything imaginable he underwent the punishment of a cruel and ignoble death on a cross. Every time we hear these things or read about them we are reminded that none of this happened to him by chance or accidentally, but that it was all part of the eternal will of the Father to whom he knowingly and willingly subjected himself in order to pay the price of our transgression and the guilt of our rebellion by the merit of his obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 22.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-da0c28f09c" data-kw="">
<blockquote><p>THERE being nothing more certain to man then death, and nothing more uncertain than the hour thereof, and desiring to provide that Death surprise me not before I make my latter will, having as yet by the mercy of God the use of all my senses and of my reason, understanding and judgement, I have thought it necessary shortly to declare mine estate and latter will as follows. I do confess and protest that I live and die in that true and lively faith whereby the just man lives which is taught us in Holy Scripture.

And that I believe the remission of all my sins by the shedding of the most precious blood of mine only Saviour, Mediator and Advocate, Jesus Christ, in whose hands I do give over and commend my self, beseeching him that he would sanctify me thoroughly and keep my whole spirit, soul and body, without blemish unto his last coming. I leave my body to be buried in the ground in a Christian manner without all unnecessary pomp or shew, to be made partaker of the blessed resurrection at the latter day, which I do expect and believe with a steadfast faith. …</p></blockquote>

</figure><figure class="quote" id="q-42b48b0927" data-kw="">
<blockquote><p>It may be demanded, Had it not been sufficient for our good, and to the end he might redeem us, if he had only lived well and holily, and not also so to have suffered death for us? I answer, it had not sufficed: for all his most holy &amp; righteous works had not satisfied the justice and wrath of God for our sins, nor merited the mercy of God, reconciliation, righteousness &amp; life eternal for us: the reason is, for that the justice of God did require, for our breach of God’s covenant, that we should be punished with death eternal, according to the condition denounced and annexed to the promise of that covenant.

Therefore no good works of our own, or of any Mediator for us, after the breach of that covenant of works, could have satisfied the justice of God, which of necessity after a sort required the punishment and death of the offender, or certainly of some mediator in his steed. If then all the good &amp; holy works of the Mediator could not satisfy that wrath and justice of God for sin, it is clear they could not merit any new grace or mercy of God for us.

But you will say, that the good and holy works of Christ our Mediator have wrought some part at least of that satisfaction, whereby God’s justice was appeased for us: and some part of that merit whereby God’s favour was purchased for us? I answer, these works did serve properly for no part of satisfaction or merit for us: for that to speak properly, the death of Christ and his passion only did satisfy God’s justice, and merited his mercy for us.</p></blockquote>

</figure><figure class="quote" id="q-a7ad219589" data-kw="">
<blockquote><p>As for that collaterality which is objected, I answer, the civil and ecclesiastical power, if we speak properly, are not collateral.

1. They have no footing upon the same ground: there may be many subject to the magistrate, who are no church members, and so not under the spiritual power; and where the same persons are subject to both the powers, there is no more collaterality, in this case, nay, not so much, as is betwixt the power of a father in one man, and the power of a master in another man, when both powers are exercised upon the same man who is both a son and a servant.

2. Powers that are collateral, are of the same eminency and altitude, of the same kind and nature; but the civil power is a dominion and lordship; the ecclesiastical power is ministerial, not lordly.

3. Collateral powers do mutually and alike exercise authority over each other respectively. But, though the magistrate may exercise much authority in things ecclesiastical [circa sacra], church officers can exercise no authority in things civil. The magistrate’s authority is ecclesiastical objective, though not formaliter: but the church officer’s authority is not civil so much as objective, not being exercised about either civil, criminal, or capital cases.

4. Collateral powers are subordinate to, and derived from the supreme and original power, like two branches growing out of the same stock, two streams flowing from the same fountain, two lines drawn from the same center, two arms under the same head; but the power of the magistrate is subordinate unto, and depends upon the dominion of God the Creator of all: the power of church officers depends upon the dominion of Christ, the Mediator and King of the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, (1646) | Part 2, ch. 8, p. 120</span></figcaption>

3. Collateral powers do mutually and alike exercise authority over each other respectively. But, though the magistrate may exercise much authority in things ecclesiastical [circa sacra], church officers can exercise no authority in things civil. The magistrate’s authority is ecclesiastical objective, though not formaliter: but the church officer’s authority is not civil so much as objective, not being exercised about either civil, criminal, or capital cases.

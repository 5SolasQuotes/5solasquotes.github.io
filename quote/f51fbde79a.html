<main class="wrap"><figure class="quote" id="q-f51fbde79a" data-kw="">
<blockquote><p>13. If a pastor preach some unsound doctrines or faultily perform the public worship, or neglect just discipline and receive the unworthy to the communion of the church, or reject the worthy, the presence of the innocent members (who make not the fault their own by consent, or by neglecting their duties to reform it), makes none of this to be their sin, nor is to be taken for a sign of their consent: Nor will the presence of the unworthy deprive the godly of the blessing or comfort of God’s ordinance: Nor are they bound to separate from that church because of these corruptions, unless they are so great as to unchurch that church or make their worship and communion such as God Himself rejects and will not accept: or unless by imposing sin upon them, or some other way, the church expel them, or they have accidentally some other reason to remove.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Church Concord</cite>, … (London: Parkhurst, 1691), pt. 2, Question 2, p. 65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

ener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-97886eee8b" data-kw="">
<blockquote><p>The first prejudice then is, That those who dissent and separate from us are the strictest party. In answer to this… As for strictness of opinions, as to government and church communion, if we measure strictness according to the dictates of men’s own spirits, we will yield to them for strictness; and so would our Lord to the Pharisees, and the apostles to the false teachers. But if we measure strictness according to the Word of God, we deny they are strictest, but they are indeed widest from the rule. I will follow Christ to the synagogue of the Jews (I hope some of you at least may understand what I say [who had corruptions in their worship and government]) and in so doing I will be more strict than those that scruple to follow Christ’s example, for fear they be involved in the guilt of the corruptions among them; for the nearer I follow Christ, the more strict I am, if strictness be measured according to the Word of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Evil, Nature &amp; Danger of Schism: a Sermon’</cite>, (1708)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-c96b30e0f7" data-kw="">
<blockquote><p>The truth of history, however, requires that we should state here some of the steps taken by that party of the Presbyterians usually called Society People or Cameronians. [In 1680] One Henry Hall of Haughhead, in Teviotdale, a gentleman who was intimate with Mr. [Donald] Cargill, and had suffered great persecution, was apprehended at Queensferry with a paper in his possession disowning the government, and containing some very strong and exceptionable sentiments. This paper, it appears, was merely a scroll drawn up by Hall and Cargill, and more like a manifesto for a general rising of the people, than fitted for a suffering and subdued handful. It was never sanctioned by any meeting [of the Cameronians]; but having fallen into the hands of the governors, it was held as indicating the sentiments and designs of all the Presbyterians. The Queensferry Paper, as it was called, was thenceforth quoted and used against all suspected of Presbyterianism. Shortly after this Cameron and Cargill, with some others, having broken off from the rest of the Presbyterian ministers, published [in 1680] a declaration at Sanquhar, differing a little from, but in the same strain with, the Queensferry Paper. The Sanquhar Declaration openly declared war against Charles as a tyrant and usurper. This was followed up by one of the most singular scenes, perhaps, recorded in the history of the times — the Torwood excommunication. In a meeting held at Torwood, in Stirlingshire, in September, 1680, Mr. Cargill, after divine service, pronounced, with all solemnity and formality, the highest sentence of excommunication against King Charles, the Duke of York, the Dukes of Monmouth, Lauderdale, and Rothes, General Dalziel, and the advocate, Sir George Mackenzie; in the name of the Lord Jesus Christ casting them out of the church, and delivering them up unto Satan. These proceedings, we may well believe, irritated the ruling powers more than ever; and though unshared in and unapproved of by the rest of the Presbyterian ministers, they were eagerly laid hold of as pretexts for still greater severities against the whole of them. The furnace was “heated one seven times more than it was wont to be heated.” Into the history of the persecutions which followed we cannot minutely enter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-jr.html">Thomas M’Crie Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Story of the Scottish Church</cite>, (London: Blackie &amp; Son, 1875), p. 347</span></figcaption>

</figure><figure class="quote" id="q-666c16c43d" data-kw="">
<blockquote><p>They who truly fear the name of God are indeed scandalized by the Prelates, their depriving of ministers for refusing to conform: but by the ministers, their suffering of deprivation for this cause, they are not scandalized, but edified… Our refusal to conform to inconvenient ceremonies, being a necessary duty, if the magistrate be provoked therewith, we are blameless: neither can it any otherwise provoke him to disgrace those well deserving ministers than Moses his seeking of liberty for Israel to go and serve God according to his will, provoked Pharaoh the more to oppress them; or than Christ’s preaching of the truth, and his abstaining from the superstitious ceremonies of the Pharisees, provoked them to disgrace Him and plot his hurt. Howbeit we are not ignorant that the magistrate is not provoked by our refusing to conform, except as it is misreported, misdeemed and misconstructed to him by the false calumnies of our adversaries: which being so, he is not incited by our deed, but by theirs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 1, p. 7</span></figcaption>

</figure><figure class="quote" id="q-2f016b59e9" data-kw="">
<blockquote><p>But yet it’s an error to hold that if any unjustly condemn other churches, it is a renunciation of that condemned church-state to have communion with them that condemn. Who would have thought the two separating extremes had so agreed in their principles? This is just the very core of the evil of the book of the contrary party which I here answer. Alas! how few Churches on earth have not peevishly condemned one another: it may be for Easter-day, for the choice of a bishop, as the Donatists (striving whose bishop was the right one): The case of the [early Church groups, the] Novatians, Audians, Luciferians and even of most in East and West are sad instances: And will such censoriousness unChurch them and forbid us communion with them? This is plain revenge and to curse them that curse us and abuse them that abuse us. I like Calvin ‘s spirit better than this, who said, “Though Luther should call me a devil, I would call him the excellent servant of God.”* Too many Lutherans now renounce communion with the Calvinists, who yet renounce not communion with them. * John Calvin, Letters of John Calvin, ed. Jules Bonnet (Philadelphia: Presbyterian Board of Publication, 1900), letter 122, to Bullinger (1544), p. 433.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But yet it’s an error to hold that if any unjustly condemn other churches, it is a renunciation of that condemned church-state to have communion with them that condemn. Who would have thought the two separating extremes had so agreed in their principles? This is just the very core of the evil of the book of the contrary party which I here answer. Alas! how few Churches on earth have not peevishly condemned one another: it may be for Easter-day, for the choice of a bishop, as the Donatists (striving whose bishop was the right one): The case of the [early Church groups, the] Novatians, Audians, Luciferians and even of most in East and West are sad instances: And will such censoriousness unChurch them and forbid us communion with them? This is plain revenge and to curse them that curse us and abuse them that abuse us. I like Calvin ‘s spirit better than this, who said, “Though Luther should call me a devil, I would call him the excellent servant of God.”* Too many Lutherans now renounce communion with the Calvinists, who yet renounce not communion with them. * John Calvin, Letters of John Calvin, ed. Jules Bonnet (Philadelphia: Presbyterian Board of Publication, 1900), letter 122, to Bullinger (1544), p. 433.”

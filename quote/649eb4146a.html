<main class="wrap"><figure class="quote" id="q-649eb4146a" data-kw="">
<blockquote><p>The Sabbath being thus as old as the creation of man, it does not surprise us to find it recognised by Moses and by the Israelites in the wilderness, at the time of the giving of the manna, as a familiar institution, by their regard to which God would test their obedience — “whether they would walk in His law or no.”

It is evident from the whole passage now referred to (Exod. xvi.) that the Sabbath is not there spoken of as a new and hitherto unknown observance; and though, during their long servitude in Egypt, the discharge of its sacred duties, and the observance of its rest, must have been to a great extent prevented, it had not been altogether forgotten; and it is quite natural to find them, after they have been freed from the yoke of bondage, dutifully returning to the keeping of the Sabbath which the Lord their God had given them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-symington.html">William Symington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath; The Grounds of its Obligation, and its Proper Place in Relation to Christian Life and Duty in Patrick Fairbairn et al., Divine Revelation Explained and Vindicated: A Course of Lectures for the Times, Delivered in Glasgow in the Spring of 1866</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

It is evident from the whole passage now referred to (Exod. xvi.) that the Sabbath is not there spoken of as a new and hitherto unknown observance; and though, during their long servitude in Egypt, the discharge of its sacred duties, and the observance of its rest, must have been to a great extent prevented, it had not been altogether forgotten; and it is quite natural to find them, after they have been freed from the yoke of bondage, dutifully returning to the keeping of the Sabbath which the Lord their God had given them.”

<blockquote><p>We require not of necessity an artificial table of timber: a bull-hide or a plot of ground may serve in time of necessity, and answers analogically to a standing table, as the plot of ground did whereabout the multitude sat in rows by fifties and fifties, Mark 6. Neither do we stand upon the fashion, whether it be long or round; but we require that the communicants always sit table-ways [like at a table], so that they may observe the form of a feast or banquet: For in that this holy action is called a ‘supper’, it is imported that it was celebrated in the form of a feast or banquet, as [Johannes] Piscator observes in his observations upon Mt. 26. We do not require all the forms used at common feasts, but these which Christ the institutor, and Master of the feast thought sufficient.</p></blockquote>

n%20artificial%20table&amp;text=institutor%2C%20and%20Master%20of%20the%20feast%20thought%20sufficient" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-53e6cb8cf2" data-kw="">
<blockquote><p>The picture of a church much more concerned with carrying out its routine functions than with controversy is confirmed by W. R. Foster… Such studies, concentrating on the day to day life of the church and the extent of compromise, co-operation and continuity, undoubtedly provide a more accurate picture of the church as contemporaries saw it, and worked and worshipped in it, than sectarian histories which imply constant and bitter controversy at all levels. But it is worth suggesting that this tendency to concentrate on the positive elements of the church and on its routine functioning has gone too far; from too much emphasis on controversy the pendulum has swung so far that there is a tendency to ignore the controversy, that undoubtedly did exist. Foster’s “church before the covenants” seems so placid and united that the reader is left bewildered; the covenants evidently explode like a great storm suddenly appearing when the sky is clear and blue, and no attempt is made to explain the explosion. Controversial topics are played down or ignored; little is said about worship, almost nothing about theology. The new prayer book of 1637 which sparked off revolt is not mentioned in a book purporting to cover the period up to 1638; nor is the emergence of Arminianism in Scotland, undermining Calvinist orthodoxy and producing new tensions. Thus Foster’s book really only deals with some aspects of the church; what it does do, it does very well, but though it tells the truth it does not attempt to tell the whole truth.” – David Stevenson, “Scottish Church History, 1600-1660, a Select Critical Bibliography” (1982), p. 211 . On the Late-1600’s Articles Raffe, Alexander – pp. 180-188 of The Culture of Controversy: Religious Arguments in Scotland, 1660-1714 (Boydell Press, 2012) ToC McDougall: “Raffe outlined three tenets of partial conformity [for laymen]: avoidance of regular attendance at services given by conformist ministers; hearing sermons in parishes in other towns; and refusal to receive the sacraments from a conformist minister. This chapter will reveal a broader range of ways in which ministers and the laity could avoid conforming to Episcopacy without separating from the church entirely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/w-roland-foster.html">W. Roland Foster</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church before the Covenants. The Church of Scotland</cite>, 1596-1638, p. 142</span></figcaption>

</figure><figure class="quote" id="q-d7a60a1cd6" data-kw="">
<blockquote><p>And this leads me to observe, as the second thing of which the text [Isaiah 21:11], as now used, may remind and assure us, that however discouraging the aspect of things may, in many points, appear — “the morning cometh” — a day of unprecedented brilliancy and joy, when the kingdom and dominion, under the whole heaven, shall be given to the Son of Man; and when, emancipated from the strife and turmoil of incessant wars, and enjoying and exhibiting a foretaste and emblem of the heavenly state, the rest of Zion shall be glorious.

Yes, the Lord’s watchmen, not once or dubiously, but explicitly, and a thousand times, have proclaimed that such a “morning cometh”‘ — the morning of that millennial day when there shall be nothing to hurt nor to destroy in all God’s holy mountain, and when the earth shall be full of the knowledge of the glory of the Lord, as the waters cover the sea.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-buchanan.html">Robert Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of Examining the Signs of the Times (Preached at the Opening of the Synod of Glasgow and Ayr, October 1844.) in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><figure class="quote" id="q-9bc4766b5d" data-kw="">
<blockquote><p>Again, if God reward none but them that seek Him, here appears the reason why so many papists die in our religion and (with us) cleave to Christ’s merits alone when they come to die – because their conscience then tells them that by their pilgrimages, relics, will-worships, and many more of their courses (ordinary in popery) they did never seek God but themselves and their own honour, gain, and credit. And full well know they that there is no reward due for such service. And therefore by their practice they make it a true saying that “it is good living a papist but dying a Protestant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Cloud of Faithful Witnesses, Leading to the Heavenly Canaan: Or, A Commentary upon the 11th Chapter to the Hebrews</cite>, (1609) in The Works of William Perkins: Volume 3, eds Randall J. Pederson and Ryan M. Hurd (Grand Rapids: Reformation Heritage Books, 2017), p. 69.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Again, if God reward none but them that seek Him, here appears the reason why so many papists die in our religion and (with us) cleave to Christ’s merits alone when they come to die – because their conscience then tells them that by their pilgrimages, relics, will-worships, and many more of their courses (ordinary in popery) they did never seek God but themselves and their own honour, gain, and credit. And full well know they that there is no reward due for such service. And therefore by their practice they make it a true saying that “it is good living a papist but dying a Protestant.”

<main class="wrap"><figure class="quote" id="q-6bc2cb80c6" data-kw="">
<blockquote><p>Many good Christians knowing the Lord’s Day to be an instituted day of thanksgiving for the greatest mercies, do as an act of honor wear their best clothes, and feast themselves and the poor accordingly that day: This is lawful, by the general law, but [it is] not particularly instituted by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes… (London: 1684), pt. 2</cite>, p. 8</span></figcaption>

— Richard Baxter, Schism Detected in both Extremes… (London: 1684), pt. 2, p. 8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMany+good+Christians+knowing+the+Lord%E2%80%99s+Day+to+be+an+instituted+day+of+thanksgiving+for+the+greatest+mercies%2C+do+as+an+act+of+honor+wear+their+best+clothes%2C+and+feast+themselves+and+the+poor+accordingly+that+day%3A+This+is+lawful%2C+by+the+general+law%2C+but+%5Bit+is%5D+not+particularly+instituted+by+God.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Schism+Detected+in+both+Extremes%E2%80%A6+%28London%3A+1684%29%2C+pt.+2%2C+p.+8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6bc2cb80c6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6bc2cb80c6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-black-genevan-gowns/#:~:text=Many%20good%20Christians%20knowing%20the%20Lord%E2%80%99s,is%5D%20not%20particularly%20instituted%20by%20God&amp;text=Many%20good%20Christians%20knowing%20the%20Lord%E2%80%99s%20Day%20to&amp;text=but%20%5Bit%20is%5D%20not%20particularly%20instituted%20by%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3c688eecbb" data-kw="">
<blockquote><p>That keen and bitter controversy which was carried on in England during the reign of Elizabeth regarding the wearing of vestments had to do with the renunciation of the doctrines of a priestly office in the Church. The strict Reformers were persuaded that not even the vestments suggesting priestliness should be worn by officiating ministers. It was not such an indifferent matter as some have thought. … Very probably in England, but for Elizabeth, the priestly vestments would have been discarded. She insisted on the wearing of them. In the Marprelate Tracts they are spoken of as ‘Queen Elizabeth’s livery.’ In other churches of the Reformation the priestly vestments for the ministry were not continued. The dress of officiating ministers became distinctive, but it was not priestly. A biographer of Zwingli, with reference to Zurich, says: ‘ministers wore their ordinary dress in the pulpit, but this dress characterized by a black cloak and white ruff, was worn by others only on gala occasions, and when it passed out of (general) fashion it became the distinctive ministerial dress.’ ([Samuel Macauley] Jackson, [Huldreich Zwingli: The Reformer of German Switzerland, 1584-1531 (NY &amp; London: Knickbocker Press, 1903)] pp. 290, 291) In a short biography of Bullinger, among other matters, his custom in dress is referred to:… ([G.R.] Zimmermann, [Die Zurcher Kirche (Zurich, 1878),] p. 43) “How far from all vain adornment and official glory he was can clearly be seen from the fact that he went up into the pulpit in his civilian style of dress.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-l-ainslie.html">J.L. Ainslie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 36-37 of Ch. 2, ‘The Ordinary Duties of the Reformed Ministerial Order’ in The Doctrines of Ministerial Order in the Reformed Churches of the 16th and 17th Centuries (Edinburgh: T. &amp; T. Clark, 1940)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/vestments-and-dress.html">Vestments and Dress</a></span></div>

</figure><figure class="quote" id="q-12ad2ed2ac" data-kw="">
<blockquote><p>As touching that point whether the minister should wear it [the surplice], although it be inconvenient: the truth is that I dare not be author to any to forsake his pastoral charge for the inconvenience thereof: considering that this charge, being an absolute commandment of the Lord, ought not to be laid aside for a simple inconvenience or uncomeliness of a thing which in the own nature is indifferent. The offence in occasioning the weak to fall and the wicked to be confirmed in their wickedness is one of the foulest spots in the surplice, and which of all other can make it most detestable in the eyes of a godly minister… But when it is laid in the scales with the preaching of the Word of God, which is so necessary for him that is called thereunto, that a woe hangs on his head if he do not preach it: it is of less importance than for the refusal of it we should let go so necessary a duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rest of the Second Reply… ([Basel: Guarinus, 1577]), pt. 2, ch. 8</cite>, pp. 262-63</span></figcaption>

</figure><figure class="quote" id="q-d5c4fbf3c4" data-kw="">
<blockquote><p>As for those who allege some conveniency in the ceremonies, they say more than can abide the proof of reason, which the induction [enumeration] of some particulars shall demonstrate. Dr. [Thomas] Morton (Particular Defense, ch. 1, sect. 1 [1618]) alleges for the surplice that the difference of outward garments cannot but be held convenient for the distinguishing of ministers from laics [laity] in the discharge of their function. Answer: This conveniency is as well seen to without the surplice. If a man having a black gown upon him be seen exercising the function of a minister, it is very strange if any man think it not sufficiently distinguished from laics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (Naphtali Press, 1993) | Part 2, Ch. 2</cite>, p. 73</span></figcaption>

</figure><figure class="quote" id="q-2ec377fb86" data-kw="">
<blockquote><p>The Genevan practice of wearing black academic gowns, white preaching bands, and black caps deliberately indicated that ministers were teachers of the Word rather than sacerdotal mediators. There clothes were not considered clerical vestments but were standard attire for clergy to be worn during and outside public worship (Maetsch, Calvin’s Company of Pastors, 19; William D. Maxwell, John Knox’s Genevan Service Book, 1556 (Westminster: Faith Press, 1965), 210-213). Lavater’s Short Work on Rites and Regulations described a similar approach to clerical attire in Zurich; however, the clerical dress was more informal than Calvin’s: clergy were to ‘wear ordinary, yet respectable clothing (as other respectable citizens do), not theatrical clothing.’ John Knox held a similarly minimalist approach among the English exiles in Frankfurt, signaling his displeasure at Cranmer’s retention of the surplice. In a sermon on Noah’s drunkenness and the subject of what should or should not be covered up, he touched upon the sensitive matter of English cleric John Hooper’s refusal to wear clerical vestments (Jane Dawson, John Knox (New Haven, CT: Yale University Press, 2016), 101). Earlier in 1550, Hooper refused to be consecrated as bishop, partly on the grounds of what he perceived to be unreformed vestments (‘those Aaronic habits’). (John Hooper to Heinrich Bullinger, June 29, 1550. See Hastings Robinson, Original Letters Relative to the English Reformation, 2 vols. (Cambridge: Cambridge University Press, 1846-1847), 1:87) In reply, both Martin Bucer and Peter Martyr Vermigli refuted his position on the basis that vestments were adiaphorus [indifferent]. Vermigli made the slightly backhanded remark that ‘indifferent things cannot corrupt those that are of a pure mind and sincere conscience in their doings.’ (Correspondence between Bucer, Martyr and Hooper in George Cornelius Gorham, Gleanings of a Few Scattered Ears During the Period of the Reformation in England (London: Bell and Daldy, 1857). Bucer and Martyr’s replies to Hooper were also used by Archbishop Parker [who sought to universally enforce such clerical dress] in response to the Vestarian Controversy under Queen Elizabeth I. Quotes are in Matthew Parker, A Brief Examination for the Tyme…, (London: Richard Jugge, 1566), RSTC 10387, sig. C.2r.) Hooper–helped by a spell in prison–begrudingly took the advice on board and was consecrated Bishop of Gloucester later that year. Thus, when Knox and his colleagues left the English congregation at Frankfurt for Calvin’s Geneva, they found the clerical attire more congenial to their approach. However, when the Genevan exiles returned home after the death of Queen Mary, they had mixed success in implementing their desired clerical attire. Knox returned to Scotland where the Genevan gown became the norm, whereas Christopher Goodman and others returned to England were vestments were retained (indeed, to the 1549 standards). The controversy over vestments was reignited and contributed to the production of the Middelburg Liturgy (1586) by the English Puritans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-earngey.html">Mark Earngey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Soli Deo Gloria: The Reformation of Worship’ being ch. 2 of Reformation Worship: Liturgies from the Past for the Present (New Growth, 2017)</cite>, pp. 42-43</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/vestments-and-dress.html">Vestments and Dress</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Genevan practice of wearing black academic gowns, white preaching bands, and black caps deliberately indicated that ministers were teachers of the Word rather than sacerdotal mediators. There clothes were not considered clerical vestments but were standard attire for clergy to be worn during and outside public worship (Maetsch, Calvin’s Company of Pastors, 19; William D. Maxwell, John Knox’s Genevan Service Book, 1556 (Westminster: Faith Press, 1965), 210-213). Lavater’s Short Work on Rites and Regulations described a similar approach to clerical attire in Zurich; however, the clerical dress was more informal than Calvin’s: clergy were to ‘wear ordinary, yet respectable clothing (as other respectable citizens do), not theatrical clothing.’ John Knox held a similarly minimalist approach among the English exiles in Frankfurt, signaling his displeasure at Cranmer’s retention of the surplice. In a sermon on Noah’s drunkenness and the subject of what should or should not be covered up, he touched upon the sensitive matter of English cleric John Hooper’s refusal to wear clerical vestments (Jane Dawson, John Knox (New Haven, CT: Yale University Press, 2016), 101). Earlier in 1550, Hooper refused to be consecrated as bishop, partly on the grounds of what he perceived to be unreformed vestments (‘those Aaronic habits’). (John Hooper to Heinrich Bullinger, June 29, 1550. See Hastings Robinson, Original Letters Relative to the English Reformation, 2 vols. (Cambridge: Cambridge University Press, 1846-1847), 1:87) In reply, both Martin Bucer and Peter Martyr Vermigli refuted his position on the basis that vestments were adiaphorus [indifferent]. Vermigli made the slightly backhanded remark that ‘indifferent things cannot corrupt those that are of a pure mind and sincere conscience in their doings.’ (Correspondence between Bucer, Martyr and Hooper in George Cornelius Gorham, Gleanings of a Few Scattered Ears During the Period of the Reformation in England (London: Bell and Daldy, 1857). Bucer and Martyr’s replies to Hooper were also used by Archbishop Parker [who sought to universally enforce such clerical dress] in response to the Vestarian Controversy under Queen Elizabeth I. Quotes are in Matthew Parker, A Brief Examination for the Tyme…, (London: Richard Jugge, 1566), RSTC 10387, sig. C.2r.) Hooper–helped by a spell in prison–begrudingly took the advice on board and was consecrated Bishop of Gloucester later that year. Thus, when Knox and his colleagues left the English congregation at Frankfurt for Calvin’s Geneva, they found the clerical attire more congenial to their approach. However, when the Genevan exiles returned home after the death of Queen Mary, they had mixed success in implementing their desired clerical attire. Knox returned to Scotland where the Genevan gown became the norm, whereas Christopher Goodman and others returned to England were vestments were retained (indeed, to the 1549 standards). The controversy over vestments was reignited and contributed to the production of the Middelburg Liturgy (1586) by the English Puritans.”

— Mark Earngey, ‘Soli Deo Gloria: The Reformation of Worship’ being ch. 2 of Reformation Worship: Liturgies from the Past for the Present (New Growth, 2017), pp. 42-43">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Genevan+practice+of+wearing+black+academic+gowns%2C+white+preaching+bands%2C+and+black+caps+deliberately+indicated+that+ministers+were+teachers+of+the+Word+rather+than+sacerdotal+mediators.+There+clothes+were+not+considered+clerical+vestments+but+were+standard+attire+for+clergy+to+be+worn+during+and+outside+public+worship+%28Maetsch%2C+Calvin%E2%80%99s+Company+of+Pastors%2C+19%3B+William+D.+Maxwell%2C+John+Knox%E2%80%99s+Genevan+Service+Book%2C+1556+%28Westminster%3A+Faith+Press%2C+1965%29%2C+210-213%29.+Lavater%E2%80%99s+Short+Work+on+Rites+and+Regulations+described+a+similar+approach+to+clerical+attire+in+Zurich%3B+however%2C+the+clerical+dress+was+more+informal+than+Calvin%E2%80%99s%3A+clergy+were+to+%E2%80%98wear+ordinary%2C+yet+respectable+clothing+%28as+other+respectable+citizens+do%29%2C+not+theatrical+clothing.%E2%80%99+John+Knox+held+a+similarly+minimalist+approach+among+the+English+exiles+in+Frankfurt%2C+signaling+his+displeasure+at+Cranmer%E2%80%99s+retention+of+the+surplice.+In+a+sermon+on+Noah%E2%80%99s+drunkenness+and+the+subject+of+what+should+or+should+not+be+covered+up%2C+he+touched+upon+the+sensitive+matter+of+English+cleric+John+Hooper%E2%80%99s+refusal+to+wear+clerical+vestments+%28Jane+Dawson%2C+John+Knox+%28New+Haven%2C+CT%3A+Yale+University+Press%2C+2016%29%2C+101%29.+Earlier+in+1550%2C+Hooper+refused+to+be+consecrated+as+bishop%2C+partly+on+the+grounds+of+what+he+perceived+to+be+unreformed+vestments+%28%E2%80%98those+Aaronic+habits%E2%80%99%29.+%28John+Hooper+to+Heinrich+Bullinger%2C+June+29%2C+1550.+See+Hastings+Robinson%2C+Original+Letters+Relative+to+the+English+Reformation%2C+2+vols.+%28Cambridge%3A+Cambridge+University+Press%2C+1846-1847%29%2C+1%3A87%29+In+reply%2C+both+Martin+Bucer+and+Peter+

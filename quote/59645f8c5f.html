<main class="wrap"><figure class="quote" id="q-59645f8c5f" data-kw="">
<blockquote><p>One of the English delegates to the Synod of Dort, George Carleton, exhorted the Dutch to preserve the confession of the Reformed churches and to resist the innovations of the Arminians (he does not mention them by name in this extract, but these are the innovators to whom he was referring):

The reformed Churches throughout Europe, having recovered their liberty, and shaken off the heavy yoke of Rome, to shew themselves more thankful to Christ their Redeemer, have severally set forth confessions of their Faith, which though they were many, yet they so well agree in one consent and harmony of minds, that we may plainly discover, it was the voice of one only Spirit, which in so many Nations, so many Languages delivered it self.

In this general concord of other Nations, your consent did bear a part; your praises were in the Gospel, your authority in the Church much set by. But now the neighbour Churches round about enquire, question, and wonder, what it might be which in these confessions your Church alone quarrels with: Against which, none of the rest, since the reformation, have taken exception.

Give me leave to ask of you in the Apostle’s words, Proceeded the Word of God from you alone? or hath it come only unto you? Other Nations and Provinces preserve the doctrine of the Gospel which they have received, whole and sound, without any alteration and change, and resolve by God’s help, hereafter so to continue.

This is that which his Majesty [James I of England] commends unto you, even the unity and consent of Confession, the spring and original of reformation; he commends unto you the consent of the Churches, he requires you, that what form of Church you have received from your Fathers, you will deliver over to your posterity; that what Doctrine now these twenty or thirty years hath been publicly taught amongst you, you preserve in its former purity; that you shut up all gap and inlet, which may every day give way to innovation, that such treasures of Christ as are committed to your trust, you preserve safe, without suffering them to be embased by admixtion of false and counterfeit stuff.

Unto you are committed the Oracles of God; keep your Faith unspotted, and undefiled unto God and Christ the Church’s King: You are seriously to take heed, that your Doctors, leaving the simplicity of holy Scriptures, divert not upon abstruse and intricate quirks; that they set not before you smoke, in stead of solid meat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-carleton.html">George Carleton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An oration made at the Hague, before the Prince of Orange and the assembly of the high and mighty lords, the States General of the United Provinces: by the reverend father in God, the Lord Bishop of Llandaff, one of the commissioners sent by the Kings most excellent Majesty to the Synod of Dort</cite>, (London: Ralph Rounthwait, 1619), pp 6-8.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

<blockquote><p>V. They [the Remonstrants] distinguish therefore, between the obtaining of reconciliation and the application of it. They contend that reconciliation and remission of sins is obtained for all, which yet is applied only to them that believe, that all men are given to Christ in the right of salvation but not in the communication of salvation, that God has neither will nor nilled [willed the contrary] the application of reconciliation (that is, faith and salvation) to all men, but he has thus willed it if they believe, if they will receive grace.</p></blockquote>

<blockquote><p>IX. They comprehend the whole doctrine of Election in four decrees, which they so knit among themselves with a perpetual linking, that the latter depend on the former.

X. The I. decree of God, is of giving his son for the abolishing of sin, &amp; for the redemption of all mankind, in which redemption, they would have all mankind to be reconciled, and remission of sins to be obtained for all. The 2. decree, that whereby God decreed to save them that believe, and would persevere in faith: This is that general and conditional Election. The third decree, is that whereby God decreed to give to all men sufficient grace for faith and repentance: which power, they say, is given irresistibly, yea 3 and that God is bound to give all men this grace: But the very act of believing, they say is not given but resistably, lest force should be offered to man’s will. They deny therefore that God decreed to give to any one precisely and absolutely faith, and the act of believing. The 4. and last decree, they would have to be that whereby God hath precisely and absolutely decreed to save some certain men, for their faith for-seen.</p></blockquote>

9b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2bd6a4759b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/09/16/pierre-du-moulin-on-the-arminian-concept-of-the-decrees/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>I. This doctrine which doth place in an infidel and unregenerate man grace, which either mediately or immediately may suffice to the obtaining of faith or salvation, without any knowledge of the Gospel and faith in Christ, doth pull up Christian Religion by the roots, and is contrary to Scripture and experience.

II. First of all, it must needs be that all doctrine in matter of our salvation, which doth not rest it self on the testimony of the scripture, must fall to the ground: But the Scripture doth no where say, that God is bound to give increases of grace to them who have rightly used natural light and understanding. It doth no where say that a man without faith can rightly worship God. It doth no where say that God is bound to give to all men, mediately or immediately, power to believe and fulfil those things which are commanded in the Gospel: It doth no where say that supernatural grace is given to all men, by which they may rightly use natural light: It doth no where say, that the Gentiles who are ignorant of Christ, are led by the holy Ghost. These are the forgeries of idle men, whom an evil itching of wit, and a bad custom of disputing hath ceased on.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 39.1-2, p. 324.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

<blockquote><p>But what is required hereunto?

1. There is required a clear apprehension in ourselves of those doctrines and truths which we are so to defend. Truth may be lost by weakness as well as by wickedness: if we have not a full apprehension of the truth, and that upon its own proper grounds and principles, we shall never be able to defend it. This is to be attained by all ways and means,—by the use, especially, of diligent prayer and study,—so that we may be able to stop the mouth of gainsayers.

2. There is required love of the truth. We shall never contend earnestly for the truth, we shall never ” buy it and not sell it,” whatever we know of it, unless our love and value of it arise from a sense and experience of it in our own souls. I fear there is much loss of truth, not for want of light, knowledge, and ability, but for want of love.

I have the advantage of most here present in this, that I know the contest we had for the truths of the gospel before our troubles began, and was an early person engaged in them; and knew those godly ministers that did contend for them as for their lives and souls, and that all the opposition that was made against them was never able to discourage them. What were these doctrines? — the doctrines of eternal predestination, effectual conversion to God, and the obduration of wicked reprobates by the providence of God. These truths are not lost for want of skill, but for want of love. We scarce hear one word of them; we are almost ashamed to mention them in the church; and he that doth it will be sure to expose himself to public obloquy and scorn: but we must not be ashamed of truth.

Formerly we could not meet with a godly minister, but the error of Arminianism was looked upon by him as the ruin and poison of the souls of men: such did tremble at it, — wrote and disputed against it. But now it is not so; the doctrine of the gospel is owned still, though little taken notice of by some among ourselves, the love of it being greatly decayed, — the sense and the power of it almost lost. But we have got no ground by it; we are not more holy, more fruitful, than we were in the preaching those doctrines, and attending diligently unto them.</p></blockquote>

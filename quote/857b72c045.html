<blockquote><p>…the conceptual order outstrips the order of things conceptualized. And it is this outstripping that entails the possibility of willing otherwise. Because the intellect is not necessitated to conceptualizing things one way rather than another, the will is not necessitated to being moved to one end rather than another. But neither is choice random or arbitrary. For choice is always for a reason, even if the reason is not necessitated. And to act for a reason is precisely not to act randomly or arbitrarily.</p></blockquote>

<blockquote><p>…we can distinguish between natural passive potency and supernatural or obediential passive potency. A natural passive potency points to an outcome that can be realized given only a thing’s natural capacities, and can be actualized by some agent that is itself a mixture of active and passive potency. A supernatural or obediential potency points to an outcome that cannot be realized given only a thing’s natural capacities, and requires as an agent a purely actual divine cause. In human beings, potencies for eating, sleeping, walking, talking, thinking, willing, writing poems or doing science, and even coming to know the truths of natural theology and natural law are for the Scholastic all natural potencies; whereas the capacity to attain the Beatific Vision is an obediential potency.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Metaphysics</cite>, (Editiones Scholasticae, 2014), 1.1.3, ‘Divisions of act and potency’, p. 44</span></figcaption>

<blockquote><p>And the change which is absolutely necessary, is a change which God alone can effect. It is by his drawing men that they are induced to come to Christ. By the “drawing” of the Father we are to understand, as is evident form the following verse, the influence of the Holy Spirit, and the cogency of divine truth, understood and believed. It is by being made to hear and learn of the Father, that men are drawn to Christ. It is because men do not understand and believe the truth, that they cannot come to the Savior, and depraved men never will understand and believe that truth, till the Spirit so fix their minds on its meaning and evidence, that they cannot help understanding and believing it, and when men understand and believe the truth, coming to the Savior follows as a matter of course—they can no longer help coming to Him; and when any man, whomsoever he be, Jew or Gentile, however guilty and depraved, drawn by the Father, by his word and Spirit, comes to the Son, our Savior declares that the final salvation of that person is secure. He is one of those who are given to him of the Father, and he shall not be lost, nothing of him shall be lost. He shall be ‘raised up at the last day.’ It is plain from this passage [John 6:44], that the inability of coming to Christ, under which men labor, is not physical, but moral. It does not originate at all in a want [lack] of those intellectual and active faculties which are necessary to come to Christ, but entirely in an indisposition arising out of willful ignorance, and the love of sin, and of the world. It is like the inability of Joseph’s brethren to speak peaceably to him [Gen. 37:4]. If men cannot come to Christ, it is just because they will not come to Him. They who under the gospel dispensation ‘are untaught of God,’ are so, because they refuse to learn of Him. The appropriate means of removing this kind of inability, is the statement of the truth and its evidence. This is all men can do. Divine influence is necessary, absolutely necessary, to fix the mind on the truth and its evidence, so as to produce faith, and the native consequences of that faith; and that influence never was, never will be, refused to him who honestly desires it. What would men have more? Would they have men left to themselves? Then all must perish. Would they have God to compel men to salvation? This would be to do violence to man’s nature, God’s work! Would they have men saved as they are—in sin? This were to require an impossibility, and to do violence at once to the constitution of man, and the nature of God, to disgrace the Divine character, and overturn the Divine throne. The sum of the whole matter is, no man perishes under the gospel dispensation, but in consequence of his own willful obstinacy: no man is saved, but in consequence of a divine influence originating in free sovereign mercy. Man is his own destroyer, God is man’s only Savior. If we perish, our damnation is entirely of ourselves. If we are saved, our salvation is entirely of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-edinburgh.html">John Brown of Edinburgh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourses &amp; Sayings of our Lord</cite>, (1852; Banner of Truth, 1990), vol. 1, pp. 459-60</span></figcaption>

<blockquote><p>3. I easily acknowledge that grace gives such a power as is commonly called Moral, distinct from the natural faculties, as our corrupt estate contains an opposite impotency. But this is but an applying of the terms [‘can’] and [‘cannot’] [‘power’] and [‘impotency’] to dispositions and undisposedness, to habits and their privations. 4. A new heart and spirit, I easily confess necessary. But those words do commonly signify in Scripture, only new inclinations, dispositions, qualifications. It is a new heart, though only the old faculties and substance. I hope you will not follow Illyricus.¹ ¹ [Matthias Illyricus (1520–1575), a Lutheran reformer. Wiki says, “Affirming the natural inability of man, he adopted a position on sin as not being an accident of human nature, but involved in its substance, since The Fall of Man.”] 5. Where you say that [without faith a man can no more receive Christ, nor do ought towards it, than a dead man can walk or speak.], I Reply 1. That proves not faith to be equivalent to a potentia vel facultas [power or capacity], any otherwise than that it is of as absolute necessity, but not that it is of the same nature. If you show an illiterate man a Greek or Hebrew book, he can no more read in it then a dead man, that is, both are truly in sensu composito [in a combined sense] impossible: But yet it is but a habit that is wanting to one, and a power or faculty natural, to the other. And so it may truly be said that a sinner cannot do well that has accustomed to do evil, no more than a leopard can change his spots, or a blackmoore [a black person] his skin. Yet if you mean that such are equally distant from actual change as a dead man, it is but a dead comparison. A dead man wants both natural faculties, and an inclination or moral power. An unbeliever wants but one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reduction of a Digressor</cite>, (1654), p. 131</span></figcaption>

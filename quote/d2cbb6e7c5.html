<blockquote><p>However, all those things of which it cannot be said that God was not by necessity of nature bound to the other part of the contradiction (or in which we know that God can make or has actually made some change in the obligation) belong to positive right. Such were the symbolical law given to Adam and the ceremonial laws of the Old Testament (which depended on the free will of God). Here also the permission of sin is usually referred.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 11th Topic, 2nd Question, ‘The Nature of the Moral Law’, section 5, p. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dda84bdd5e" data-kw="">
<blockquote><p>4. Let it be remembered that those things we call morally good, [are those] which agree to right reason: those morally evill, which disagree from right reason: and those indifferent, which include nothing belonging to the order of reason, and so are neither consonant unto nor dissonant from the same. [The following shows that no rational action, and hence thing commanded, is simply indifferent, but must be good or bad to some degree, and hence to be done or not done; and if it is bad in any degree, it cannot be absolutely required.] 5. When we speak of the indifferency of an individual action, it may be conceived two ways, either absolute et sine respectu ad aliud [absolute and without respect to another], or, comparate et cum respectu ad aliud [comparatively and with respect to another]. In the free-will offrings, if so be a man offered according as God had blessed and prospered his estate, it was indifferent to offer either a bullock or a sheep, or a goat; but if he choosed to offer any of them, his action of offering could not be indifferent, but either good or evil. When we speak of the indifferency of an action comparate [comparatively], the sense is only this, that it is neither better not worse than another action, and that there is no reason to make us choose to do it more than another thing. But when we speak of the indifferency of an action, considered absolutely and by itself, the simple meaning is whether it be either good or evil, and whether the doing of the same must needs be either sin or evil doing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | pt. 4, ch. 3, p. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-d330f3a329" data-kw="">
<blockquote><p>§ 10, Direction 7. Meddle not with lawsuits till you have offered an equal arbitration of indifferent men, or used all possible means of love to prevent them. Lawsuits are not the first, but the last remedy. Try all others before you use them. § 11, Direction 8. When you must needs go to law, compose your minds to unfeigned love towards him that you must contend with, and watch over your hearts with suspicion and the strictest care, lest secret disaffection get advantage by it; And go to your neighbor and labor to possess his heart also with love, and to demulce [pacify] his mind, that you may not use the courts of justice as soldiers do their weapons, to do the worst they can against another, as an enemy: but as loving friends do use an amicable arbitration, resolving contentedly to stand to what the judge determines, without any alienation of mind or abatement of brotherly love. § 12, Direction 9. Be not too confident of the righteousness of your own cause, but ask counsel of some understanding, godly and impartial men; and hear all that can be said, and patiently consider of the case, and do as you would have others do by you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), pt. 4, ch. 22, ‘Cases &amp; Directions Against Injurious Law-Suits, Witnessing and Judgment’, p. 151</span></figcaption>

</figure><figure class="quote" id="q-9cdcbe8cb2" data-kw="">
<blockquote><p>Now all this being unquestionably true of the Jewish Sanhedrin: if we should suppose, that they had no supreme Sanhedrin but that which had the power of civil Magistracy, then I ask where is that Christian State, which was, or is, or ought to be molded according to this pattern. Must ministers have vote in parliament? Must they be civil lawyers? Must all criminal and capital judgments be according to the Judicial Law of Moses, and none otherwise? Must there be no civil punishment, without previous admonition of the offender? Must Parliaments sit, as it were in the Temple of God, and interpret Scripture, which sense is true, and which false, and determine controversies of faith and cases of conscience, and judge of all false doctrines? Yet all this must be if there be a parallel made with the Jewish Sanhedrin. I know some divines hold, that the Judicial Law of Moses, so far as concerns the punishments of sins against the moral Law, idolatry, blasphemy, Sabbath-breaking, adultery, theft, etc. ought to be a rule to the Christian Magistrate. and for my part, I wish more respect were had to it, and that it were more consulted with.</p></blockquote>

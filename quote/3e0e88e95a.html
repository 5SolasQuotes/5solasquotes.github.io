<main class="wrap"><figure class="quote" id="q-3e0e88e95a" data-kw="">
<blockquote><p>It is in this manner that divine truths are most convincingly established and successfully defended, — when placed, that is, in their due order and in their right relations of subordination to each other: and an illustrious instance of this, such as that which we have now given, ought not to be without its due weight with us. For instance: Let the objection to the Atonement about punishing the innocent and allowing the transgressors to escape, be referred back upon the Covenant of Grace, precisely as Dr [William] Cunningham refers back upon the covenant of works the asserted incompatibility between inability and responsibility; and how easily is it rebutted.

Bring in, that is to say, the Scriptural doctrine which teaches us to regard Christ and the Church collectively in their relation to God, as virtually one and indivisible, so far as regards their legal standing and responsibilities; and the objection is not merely seen at once to be false, but to be irrelevant and inept. It requires no answer, in the light of the covenant oneness of Christ and His members: it simply disappears. We have before us “virtually the history of one and the same man,”—the Second Man, the last Adam. The death of Christ is then seen to be the real infliction of the originally threatened curse. No one considered as innocent suffers, and no one continuing guilty escapes. Righteousness and Peace are seen to kiss each other, and Justice goes before Him to set us in the way of His steps.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Atonement: In its Relations to the Covenant, the Priesthood, the Intercession of our Lord</cite>, (London: James Nisbet &amp; Co., 1870), pp 6-7.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2ab7421dd5" data-kw="">
<blockquote><p>All natural and unregenerate men function entirely within the context of the covenant of works, and regardless of what their religious mindset may be, their singular objective is to be justified before God by their own merits and by the works of the law. Therefore, if they hear any mention made of a covenant that is purely and freely gracious in and through the crucified surety and mediator Christ Jesus, or if they are directed to anything other than this covenant of grace and to this mediator, being called upon to lay aside and fully to forsake all their own strength and righteousness, and admonished from the Holy Scriptures that they are to believe alone in Him who justifies the ungodly because they are unable to accomplish anything themselves—I say, the moment this occurs, these people are of the opinion that such a faith will render them careless, whereby sin will then necessarily have dominion over them. Natural men have always thus judged the doctrine of salvation by grace alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodorus-vandergroe.html">Theodorus VanderGroe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Only Comfort in Life &amp; Death</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (Grand Rapids: Reformation Heritage Books and Dutch Reformed Translation Society, 2016), Lord’s Day 32.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-94da56e813" data-kw="abrogation">
<blockquote><p>When God expelled man from paradise “lest man put forth his hand, and take also of the tree of life, and eat, and live for ever” (Gen. 3:22), these words denote the cause of his ejection from paradise on account of sin (by which, as by his own fault, he had cut himself off from that life, which was the thing signified). Thus he ought no longer to have any right to its sacrament. The covenant of works being broken by man’s disobedience, its promissory and sacramental seals no longer belonged to him as a way of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.5.5</span></figcaption>

</figure><figure class="quote" id="q-6201fcde4c" data-kw="">
<blockquote><p>It is therefore worthy of careful observation, that good works are required, as well of those who are under the legal contract, as of those who are living under the Gospel covenant; considering man however under different aspects, and in ways perfectly distinct. The Law, because it regards man as created by God in uprightness of nature, requires good works to be done in the strength of nature; but the Gospel, because it regards man as fallen, requires good works from the justified; but to be done, not by the strength of nature of free will, but from infused grace.

The Law, because it makes the desert of death and life depend upon the condition of works, inflicts death for any one sin, however light; and crowns with this reward of life him only who shall have rendered as obedience that is perfect in all its parts; but the Gospel, because it treats with the justified, who are delivered from death through faith in Christ, and graciously appointed to life, allows sinners an advocate, by whose intercession they obtain the constant remission of sins; and also promises a reward to the good works of the regenerate, although imperfect, because they are accepted of God the Father, in Christ the Mediator. In fine, the law rests the value and form of its covenant upon the condition of works, but the Gospel places the value and form of its covenant in the blood of the Mediator, apprehended by faith; but annexes the condition of works, as subserving this Evangelical covenant, not as comprising or constituting the covenant itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Justification, or The Disputatio De Justitia Habituali Et Actuali</cite>, trans. Josiah Allport (1631; 2 vols, London: Hamilton, Adams, and Co., 1844), 30.3, i, pp 288-89.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-692d2cf93d" data-kw="">
<blockquote><p>I. God made a double Covenant with man, the one of works, the other of Grace, that before, this after the fall.

II. The Covenant of works was confirmed by a double Sacrament, to wit, the Tree of Life, and the Tree of Knowledge of good and evil, both being planted in the midst of Paradise.

III. They had a double use. I. That man’s obedience might be tried, by using of the one, and abstaining from the other. 2. That the tree of life might ratify eternal happiness to those that should obey, but the Tree of knowledge should signifie to the disobedient the loss of the greatest happiness, and the possession of the greatest misery.

IV. Therefore the Tree of life was so called, not from any innate faculty it had to give life, but from a sacramental signification.

V. Likewise the Tree of Knowledge of good and evil, hath this denomination from signifying the chief good and evil, and from the event.

For in effect, and by experience, man found out how great that happiness and good was which he lost, and how great evil and misery he brought upon himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Abridgment of Christian Divinity</cite>, trans. Alexander Ross (3rd edn, London: Joseph Nevill, 1660), p. 68.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

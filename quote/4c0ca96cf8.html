<main class="wrap"><figure class="quote" id="q-4c0ca96cf8" data-kw="">
<blockquote><p>Whether, according to our manner of conceiving, we distinguish that decree into several [acts], or whether we say that it is one [act], it is not much to be concerned about. For it is certain among all, that God willed all things and each individual thing by one most simple act of His will. For His will, and the operation of His will, is the same as his simple and undivided essence. If someone were to contend that even according to our manner of understanding, there is one single most simple act of the will, I would not be concerned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gabriel-vasquez.html">Gabriel Vasquez</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Thomas, Summa, pt. 1, quest. 14, art. 13, disp. 65 as quoted in a margin note in Richard Baxter, Catholic Theology (London: White, 1675), pt. 2, 1st Day’s Conference, about Predestination, p. 14 Baxter comments: “and is not this a short end of many controversies?”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-252239b9c2" data-kw="">
<blockquote><p>While living in Geneva about 1558, Knox was asked by persons back in England to answer a book circulating there titled Careless by Necessity. This work, written by an Anabaptist, denied the doctrine of Predestination. Knox complied… This work is the longest of Knox’s writings… On Predestination is in the form of an ‘answer’, and is disputational in structure. Knox alternately [block] quotes an assertion from his ‘Adversarie’ [in the order of the adversary’s book] immediately following it with his ‘Answer’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brian-l-dole.html">Brian L. Dole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘John Knox on Predestination’</cite></span></figcaption>

</figure><figure class="quote" id="q-2693a5332b" data-kw="">
<blockquote><p>The doctrinal structure which stands out as most original in Bullinger’s Compendium is the definitive establishment of the gracious covenant of God as the ground for our understanding of Christology and soteriology. Bullinger accords to the covenant a position in relation to his doctrine of God much like the position of an infralapsarian doctrine of predestination.</p></blockquote>

</figure><figure class="quote" id="q-408011b53a" data-kw="">
<blockquote><p>But instead of attending to the true state of the controversy, and instead of referring the decision of it to the divine oracles, tradition and corruption has carried them into the way which this writer pursues, of representing our doctrine to be, that God decrees some men to misery in the same manner that he does others to happiness; yea this slanderer, in imitation of those who have gone before him, sets reprobation foremost, and would have people believe that we hold, God’s first design to be the damnation of multitudes, and then secondly, the irresistible salvation of a number!</p></blockquote>

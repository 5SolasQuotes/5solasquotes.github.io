<main class="wrap"><figure class="quote" id="q-073a33dfc6" data-kw="">
<blockquote><p>Many erroneously think that the continental Reformed permitted recreation on the Sabbath; this is not true. Although their view of holy days was less biblical than the English Puritans and Scottish Reformed, the following quote from Martin Bucer shows us that they did not tolerate the profanation of the Sabbath with recreation:

Decent recreation must indeed be conceded to the people at proper times, but since God has so severely prohibited useful corporal works on days sanctified to his name, how much more gravely is he offended when those days are profaned by sporting and works for the most part harmful?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Christi</cite>, (1550) in Wilhelm Pauck (ed.), The Library of Christian Classics: Melanchthon and Bucer (Philadelphia, 1969), pp 280-81.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-a2fcaf6134" data-kw="">
<blockquote><p>It would be tedious, dearly beloved, were I to recount every episode from the history of the Psalms, especially since it is necessary now to offer something from the New Testament and confirmation of the Old, lest one think the ministry of psalmody to be forbidden inasmuch as many of the usages of the Old Law have been abolished. For those things that are carnal have been rejected, circumcision for example, and the observance of the [Jewish] Sabbath, sacrifices, discrimination among foods, as well as trumpets, citharas, cymbals, and timpana (all of which are now understood to reside in the bodily members of man, and there better to sound).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/niceta-of-remesiana.html">Niceta of Remesiana</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On The Benefit of Psalmody in Oliver Strunk and Leo Treitler, ed. Source Readings in Music History (New York: W. W. Norton &amp; Company, 1950, repr. 1998), 130.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><figure class="quote" id="q-91a53fdb92" data-kw="">
<blockquote><p>…that such godly men as have been desirous of reformation, and most zealous against human inventions in the worship of God, they always intended such human inventions in the worship of God as had no warrant but the wit and will of man, not such as had warrant either from consequence of Scripture, or light of nature, or civil custom. For a woman to cover her head in time of public prayer, or prophesying, and for a man to uncover his head, the apostle warrants both from the light of nature and the custom of the churches, 1 Cor. 11:4 to 16. The kiss of love in holy assemblies was warranted, not by divine institution (for then it were a sin in us to neglect it now), but by occasion of civil custom in those nations; where, it being usual in their civil assemblies to greet one another with a kiss of love, the apostles do not disallow the use of it in holy assemblies, but only require the sincerity and holiness of the love expressed in such kisses, 1 Cor. 16:20; 1 Thess. 5:26; 1 Pet. 5:14. These apostles did not believe in this point, as you do, that God never betrusted corrupt nature, to frame anything in God’s worship to his praise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Singing of Psalms: a Gospel Ordinance</cite>, … (London, 1650), ch. 10, ‘Of the Manner of Singing’, pp. 58-59</span></figcaption>

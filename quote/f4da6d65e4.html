<main class="wrap"><figure class="quote" id="q-f4da6d65e4" data-kw="">
<blockquote><p>Assurance makes most for your comfort—but holiness makes most for God&#x27;s honor. Man&#x27;s holiness is now his greatest happiness, and in heaven man&#x27;s greatest happiness will be his perfect holiness. Assurance is the daughter of holiness; and he who shall more highly prize, and more earnestly press after the enjoyment of the daughter than the mother, it is not a wonder if God shuts the door upon him, and crosses him in the thing he most desires. The surest and the shortest way to assurance is to wrestle and contend with God for holiness. When the stream and cream of a man&#x27;s spirit runs after holiness, it will not be long night with that man; the Sun of righteousness will shine forth upon that man, and turn his winter into summer, and crown him with the diadem of assurance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heaven on Earth: A Treatise on Christian Assurance</cite>, p. 104</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e969d4333a" data-kw="">
<blockquote><p>This is, therefore, done because the promises of life offered to us in Him are then applied to our use and made effectual to us when we accept them, and in no wise doubt but that we will enjoy those things which the Lord by His own mouth has assured us of. So that the righteousness which we obtain by faith depends upon the free, gracious promises of God, by which God declares and testifies unto us that we are beloved of Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed-churches.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The French Confession</cite>, 1559, Art. 20</span></figcaption>

<div class="actions"><button class="copy" data-copy="“This is, therefore, done because the promises of life offered to us in Him are then applied to our use and made effectual to us when we accept them, and in no wise doubt but that we will enjoy those things which the Lord by His own mouth has assured us of. So that the righteousness which we obtain by faith depends upon the free, gracious promises of God, by which God declares and testifies unto us that we are beloved of Him.”

</figure><figure class="quote" id="q-625f719715" data-kw="">
<blockquote><p>Those in whom a living faith in Christ, an assured confidence of soul, peace of conscience, an earnest endeavor after filial obedience, a glorying in God through Christ, is not as yet strongly felt, and who nevertheless make use of the means which God has appointed for working these graces in us, ought not to be alarmed at the mention of reprobation, nor to rank themselves among the reprobate, but diligently to persevere in the use of means, and with ardent desires devoutly and humbly to wait for a season of richer grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 16</span></figcaption>

</figure><figure class="quote" id="q-af50f08eea" data-kw="">
<blockquote><p>Assurance, such as Paul expresses in the verses which head this paper, is not a mere fancy or feeling. It is not the result of high animal spirits, or a sanguine temperament of body. It is a positive gift of the Holy Ghost, bestowed without reference to men&#x27;s bodily frames or constitutions, and a gift which every believer in Christ ought to aim at and seek after.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Holiness</cite>, ch. “Assurance”, pp. 163–164</span></figcaption>

</figure><figure class="quote" id="q-9ea85d7a6b" data-kw="">
<blockquote><p>[Christians] look away from themselves to Christ. They believe that God has loved them from eternity past. They believe that the payment of Christ on the cross for sins was for them. They find Christ irresistible, and following Him the greatest privilege of all. They have faith in Christ and what He has done for them. They trust Christ, looking outside of themselves to Him alone.</p></blockquote>

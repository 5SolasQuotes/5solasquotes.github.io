<main class="wrap"><figure class="quote" id="q-9a1b4e5c93" data-kw="">
<blockquote><p>I believe the importance of this subject for the PCA is now matched by its urgency. If I may speak personally, one of the most alarming trends that I’ve seen among candidates for the ministry and among teaching and ruling elders in our denomination, is the growing opinion that the Standards are merely constitutional documents, on a par with the Book of Church Order (BCO) or Robert’s Rules of Order. It is an opinion that I suspect is held in equal numbers by those who take very few or no exceptions as much as by those who take several. To them, the Standards are necessary administrative instruments of good governance, and little more: “Certainly, we need to read them and know them and subscribe to them, but only in so far as doing so allows us to hold office in the denomination.” The idea that vibrant, useful, life-giving, God-exalting theology, piety, and practice can and should be mined from our Standards in any ongoing way, for the sake of the health of our own souls and the fruitfulness of our ministries, is quite foreign to their minds. The tragic result is that the proclamation heard from our pulpits, the Christian formation provided in our Sunday School classes, and the piety practiced in our churches is less and less fluent in the historic syntax and grammar of the Reformed faith. Too often, in our ministries, after having declared our adherence to them before our presbyteries (or, if we are ruling elders or deacons, before our Sessions), we simply assume theology of the Westminster Standards ever afterwards. Perhaps, in some cases, it might be more accurate to say that, after subscribing to them, we largely ignore and leave behind theology of the Standards, in favor of novel ways of framing the truth which appear in our own eyes to be far more exciting and helpful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-strain.html">David Strain</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Good Faith Subscription? Confessional Integrity in the PCA</cite>, Gospel Reformation Network, June 27, 2021</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-63ffae41b2" data-kw="">
<blockquote><p>Answer: To distribute in a civil and natural way requires not a man full of the Holy Ghost, but to distribute in simplicity and with the grace of heavenly cheerfulness, Rom. 12:8, and with the qualities of a complete deacon, 1 Tim. 3:[9,] 12-14, requires the Holy Ghost [Acts 6:3-5], though they may be good deacons who are not full of the Holy Ghost; but such [persons full of the Holy Ghost] were chosen:

1. Because this was to be a rule to all deacons to the world’s end, and the rule should be as straight and perfect as can be;

2. Because there were choice of such men as those in the apostolic Church, and [there is] reason that God be served with the best of his own;

3. The Holy Ghost is required for sanctification, as well as for gifts of preaching, Luke 1:15; Mt. 10:20.

4. Stephen [a deacon] did no more (Acts ch. 7) in his apology than any witnesses of Christ convened before rulers may do who are obliged to be ready always to give an answer to every one who asks them of the hope that is in them, with meekness and fear, 1 Pet. 3:15, yea though it were a woman, who yet may not preach, 1 Cor. 14:34.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 165</span></figcaption>

<blockquote><p>XXXVI… For as to the laying on of hands, it cannot be considered as a sign. (a) It is not an element, but an action. (b) It is common with confirmation and many other things and was practiced even under the Old Testament. (c) It was not instituted by Christ by any command, but is a free ceremony, which we read indeed of having been employed, but not of having been instituted; what has been employed, however, ought not at once to be said to have been instituted. Thus the washing of feet and breathing upon the apostles were employed by Christ (Jn. 13:5; Jn. 20:22); yet they were not on that account instituted. (d) Imposition of hands does not pertain to all the orders [of Church office], but only to some.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Institutes of Eclenctic Theology, vol. 3, Topic 19, Question 31, ‘The Five False Sacraments of the Romanists’, section 36, ‘Proof that the Orders [of Church Office] are not Sacraments’</span></figcaption>

<blockquote><p>But they differ, in that the pastor labors in the word of exhortation, that is, by the gift of wisdom applies the word to the manners of his flock, and that in season and out of season, as he knows their particular cases to require. The doctor labors in the word of doctrine, that is, without such applications as the pastor uses; by simple teaching he preserves the truth and sound interpretation of the Scriptures, against all heresy and error. The ruling elder doth neither of these, but labors in the government and policy of the church only. The Apostle has distinguished these three sorts of elders, 1 Tim. 5.17, “Let elders that rule well be counted worthy of double honor, especially they who labor in the word and doctrine.” Where, as [Theodore] Beza notes, he distinguished the word, which is the pastor’s part, from doctrine, which is the doctor’s part. Even as Rom. 12:7,8, he distinguishes teaching from exhortation; and 1 Cor. 12:8, puts “the word of wisdom,” and “the word of knowledge,” for two different things. Now, besides those elders which labor in the word, and those which labor in doctrine, Paul speaks to Timothy of a third sort of elders, which labor neither in the word nor doctrine, but in ruling well. Hence it appears how truly the Book of Policy, ch. 2, says, That there are four ordinary, perpetual, and necessary offices in the church, the office of the pastor, the doctor, the elder, and the deacon; and that no other office, which is not one of these four, ought to be received, or suffered in the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, ch. 2:</span></figcaption>

<blockquote><p>8. All prophets are either ordinary or extraordinary, as is clear in God’s Word; extraordinary now are not in the Church, and the ordinary prophets now are not gifted to preach the Word, except as Timothy, from their youth they have been trained up in the Scriptures and have learning, sciences, knowledge of the tongues, if he would be a man able to teach others, 2 Tim. 2:3; 1 Tim. 3, he must meditate, read, and give himself wholly to these things, 1 Tim. 3:15-16, and so must leave his calling contrary to the apostle his commandment, 1 Cor. 7:20-22; 1 Thess. 4:11; Eph. 4:28, but if he have a gift for public preaching, he is to separate himself for it, seeing a gift is a token of Gods separation.</p></blockquote>

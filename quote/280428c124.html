<main class="wrap"><figure class="quote" id="q-280428c124" data-kw="">
<blockquote><p>What is it that they betake themselves unto, what is it that they plead with God for the continuance of the pardon of their sins, and the acceptance of their persons before him? Is it any thing but sovereign grace and mercy, through the blood of Christ?</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e5b5a788f8" data-kw="">
<blockquote><p>The course in this case directed unto by the apostle is none other but the application of our souls by faith unto the Lord Christ, as our advocate with the Father, on the account of the propitiation that he has made for our sins. Under the consideration of this double act of his sacerdotal office, his oblation and intercession, he is the object of our faith in our absolute justification; and so he is as unto the continuation of it. So our whole progress in our justified estate, in all the degrees of it, is ascribed unto faith alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>

</figure><figure class="quote" id="q-e7011f9b00" data-kw="">
<blockquote><p>We are today accepted in the Beloved, today absolved from sin, today acquitted at the bar of God… We are now pardoned; even now are our sins put away; even now we stand in the sight of God accepted, as though we had never been guilty. “There is therefore now no condemnation to them which are in Christ Jesus.” There is not a sin in the Book of God, even now, against one of His people. Who dares to lay anything to their charge? There is neither speck, nor spot, nor wrinkle, nor any such thing remaining upon any one believer in the matter of justification in the sight of the Judge of all the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Morning and Evening</cite>, Morning, May 15</span></figcaption>

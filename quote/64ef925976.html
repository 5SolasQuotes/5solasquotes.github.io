<main class="wrap"><figure class="quote" id="q-64ef925976" data-kw="">
<blockquote><p>Man cannot be the infallible interpreter of the Scriptures and judge of controversies because he is liable to error. Our faith cannot be placed in him, but upon God alone from whom depends the sense and meaning of the Scriptures and who is the best interpreter of his own words. … If the rulers of the church are influenced by the Holy Spirit, they do not cease to be men and therefore fallible.</p></blockquote>
<figcaption>— <a href="../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, vol. 1, Second Topic, Q. 20, §XI</figcaption>
<div class="meta"><a class="tag" href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a><a class="tag" href="../topics/holy-scripture/sufficiency.html">Sufficiency</a><a class="tag" href="../topics/holy-scripture/interpretation.html">Interpretation</a><a class="tag" href="../topics/holy-scripture/inerrancy-and-infallibility.html">Inerrancy and Infallibility</a></div>

</figure><figure class="quote" id="q-6013b2a7fb" data-kw="">
<blockquote><p>Unless I am refuted and convicted by testimonies of the Scriptures or by clear arguments (since I believe neither the Pope nor the Councils alone; it being evident that they have often erred and contradicted themselves), I am conquered by the Holy Scriptures quoted by me, and my conscience is bound in the word of God: I can not and will not recant any thing, since it is unsafe and dangerous to do any thing against the conscience. … Here I stand. [I can not do otherwise.] God help me! Amen.</p></blockquote>
<figcaption>— <a href="../authors/martin-luther.html">Martin Luther</a>, <cite>Answer before the Diet of Worms</cite>, 18 April 1521</figcaption>

</figure><figure class="quote" id="q-4dfcdd8bf1" data-kw="">
<blockquote><p>Therefore Divine Faith cannot be reduced or resolved into the authority of the Church, or into other simple external arguments which are wont to be called Motives by persuading and inducing things preparing to Faith; but it is to be resolved into the Scripture it self, and that authority which it hath imprinted upon it from the author God, as into the first and proper cause which causeth the thing to be believed</p></blockquote>
<figcaption>— <a href="../authors/william-ames.html">William Ames</a>, <cite>The Marrow of Theology</cite>, Book II, ch. V (Of Faith), thesis 29</figcaption>

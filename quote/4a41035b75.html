<blockquote><p>First Prop. If we had fulfilled the conditions of the first covenant, we should, by what we did, have obtained eternal life and blessedness.

Man was not made naturally immortal or incapable of death. Every creature is capable of death, and therefore we are told that God only hath immortality (1 Timothy 6:16). Indeed, man when he was first created had no seeds of corruption and death in his nature, no principle of decay that tended gradually to bring him again to the dust, but yet he was not incapable of dying. He was capable of both temporal and eternal death.

This matter therefore must be as God should dispose, whether he should die or live forever. God was not pleased absolutely to promise this to man when he first created him, but he gave him a trial for it. He promised implicitly that if he would approve himself perfectly obedient to Him, after a due time he should have eternal life and blessedness made sure to him.

Though his living forever as yet was not certain to him, yet God gave him a fair opportunity to have it made sure to him afterwards. It depended only on his own fidelity to his Creator. He had a fair opportunity after a while of being called to the tree of life, and so having everlasting life sealed to him, and be put out of all possibility of ever dying either eternally or temporally and, withal, of receiving a great addition of happiness.

Man in the state wherein he was created was in a very happy condition in paradise, as we have already shown. But doubtless, if he had stood, he would have been advanced to a much greater happiness. ‘Tis most reasonable to suppose that the blessedness he enjoyed even while in a state of trial shouldn’t be so great as after he had done his work and come to receive his reward. He now enjoyed life, but if he had stood he would have been called to the tree of life to eat of that, and his life should not only have been ascertained to him forever, but he would have advanced to a higher degree of life.

Eternal life was then, as it is now, the great promise of God. It was the promise of the covenant of works as well as the covenant of grace. And as eternal life don’t now, so it did not then, only denote a continuance of man’s life forever so that he should never die, but it denotes a most glorious and blessed life.

If Adam had stood, the tree of life would have been a tree of life to him these two ways, viz. as upon the eating of it after his trial he was to have a living forever ascertained to him, and was also to be exalted to a more glorious and blessed life.

His time of trial would not have lasted always. After a due time, if man had stood, he was to be confirmed then, and man would have [been] put beyond all possibility of falling. Not beyond a natural possibility—no creature ever was or ever will be naturally impeccable or naturally incapable of sinning—but God would have become engaged for his never sinning or dying, as we have all reason now to conclude that it is with the angels. They had a time of probation as well as man, as is evident because some of ’em fell. But the angels of light are now past their probation and are in a state of confirmed holiness and blessedness.

We have no account how long man was to have been tried before he was to be confirmed, and ’tis not probable that God revealed that to man. But if he proved obedient, after a due time he was to have eat of the tree of life.

The tree of life was a tree that God planted with the rest of the garden, that man might be the more assured of his reward in case of his obedience, and that this consideration might engage his spirit the more earnestly to seek that he might come to taste of it. ‘Tis probable that God told Adam of this tree to encourage his obedience. He might tell him in earnest that man had an opportunity of obtaining the fruit of this tree, and that eternal life and blessedness of which it was a seal, by what he himself did; an obtaining of this blessed reward was in his power.

It was in man’s own power perfectly to obey the law of God, which is not in our power now since the fall, as it was more in man’s power perfectly to obey the law and persevere in it then, than it is for fallen man to perform one act of sincere obedience. And that, upon two accounts, viz.

1. As he had no sin then that he was under the power and dominion of. We can’t obey now because we are dead in trespasses; Ephesians 2:1, “and you hath he quickened, who were dead in trespasses and sins.” We are stones; our hands are pinioned by strong lusts. But our first parents, they were free, not under any such bondage.

2. Adam had a sufficient assistance of God always present with him to have enabled him to have obeyed if he had used his natural abilities in endeavouring it, as he might do, though the assistance was not such as it would have been after he was confirmed to render it impossible for him to sin. Man might be deceived so that he should not be disposed to use his endeavours to persevere, but if he did use his endeavours, there was a sufficient assistance always with him to enable him to persevere. So that man had a very fair opportunity of obtaining eternal life and blessedness under the first covenant, and it was in his power to obtain it by what he did himself.</p></blockquote>

<blockquote><p>Vers. 14. Blotting out the hand-writing of Ordinances that was against us, which was contrary to us, and took it out of the way, nailing it to his Cross.

Argum. 9. In which also he explains how Christ obtained remission of sins for us, viz. by taking away the hand-writing, in this sense. The Covenant of works is an hand-writing, established partly in threatnings, partly in appointed positive Ceremonials (excluding the Gentiles from the Church) was against us, and contrary to us. But Christ hath blotted out this hand-writing, taking it out of the way, and nailing it to his Cross: Therefore you must not look back to the legal Covenant or ceremonial appointments in them, to seek for any thing, neither must ye depart in the least from the death of Christ (by which ye are delivered from that hand-writing.)

He compares this Covenant of works, with its appurtenances, to an hand-writing, by which any one binds himself for the paying of a debt; for whosoever are convicted of sin by the light of nature, are also by the force of the Covenant of Works, obnoxious to wrath, and as often as we are convinced of sin, so often also by nature we confirm the punishment of sin, or the condition of the legal Covenant, by the judgement of our consciences against our selves, as by an hand-writing: The conscience of every one performs this much more, which hath received the written Law, and daily bears the punishment of the Law, for the breaking of it.

But chiefly all justiciaries are compelled to subscribe to this hand-writing, who acknowledge no righteousness besides inherent, or that which is by works: Of which number were those that Judaized, and observers of Ceremonies, who adhered to this Covenant, seeking Righteousness by works, and the appointed Ceremonies: For by how much they did endeavour by this means more manifestly to establish their own Righteousness, by so much the more openly they did derive the punishment of the Law broken, by the force of the Covenant, upon themselves: For no man enters a Covenant, but he also admits all the conditions of the Covenant.

The hand-writing is said to be in Ordinances, or rather subscribed to Ordinances, so far as they took upon them those commands, or Legal Ordinances, that they might be perfected in themselves, they did withal oblige themselves to bear the punishment of the breach of those commands.

He calls it the hand-writing against us, or contrary to us, partly because it separated the Jews from the Gentiles, and the Gentiles from the Jews; Partly because it was a yoke, which neither they nor their Fathers could bear; Partly because as often as they did any work of the Law, either moral or ceremonial to be justified thereby, so often by the imperfection of their work, and the profession of their imperfection in the use of the Levitical Ceremonies, they did argue themselves guilty, or rather did acknowledge themselves guilty of death.

As for example, when they offered Sacrifices, and did repeat them, they not only acknowledged themselves sinners against the Moral Law, but did also really confess that their frequent Sacrifices could not purge their consciences from sin, and so the hand-writing of the Covenant of works was always contrary to them: But Christ hath blotted out this hand-writing, and took it out of the way, nailing it to his Cross, insomuch as he for the sake of them that were his, hath paid for the redeemed the penalty due upon the hand-writing by the death of his Cross, and hath completed and abolished the positive Ordinances concerning those vanishing Ceremonies, by the real Sacrifice of his own body once offered.</p></blockquote>

— David Dickson, An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened, (London: Francis Eglesfield, 1659), pp 139-40.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVers.+14.+Blotting+out+the+hand-writing+of+Ordinances+that+was+against+us%2C+which+was+contrary+to+us%2C+and+took+it+out+of+the+way%2C+nailing+it+to+his+Cross.%0A%0AArgum.+9.+In+which+also+he+explains+how+Christ+obtained+remission+of+sins+for+us%2C+viz.+by+taking+away+the+hand-writing%2C+in+this+sense.+The+Covenant+of+works+is+an+hand-writing%2C+established+partly+in+threatnings%2C+partly+in+appointed+positive+Ceremonials+%28excluding+the+Gentiles+from+the+Church%29+was+against+us%2C+and+contrary+to+us.+But+Christ+hath+blotted+out+this+hand-writing%2C+taking+it+out+of+the+way%2C+and+nailing+it+to+his+Cross%3A+Therefore+you+must+not+look+back+to+the+legal+Covenant+or+ceremonial+appointments+in+them%2C+to+seek+for+any+thing%2C+neither+must+ye+depart+in+the+least+from+the+death+of+Christ+%28by+which+ye+are+delivered+from+that+hand-writing.%29%0A%0AHe+compares+this+Covenant+of+works%2C+with+its+appurtenances%2C+to+an+hand-writing%2C+by+which+any+one+binds+himself+for+the+paying+of+a+debt%3B+for+whosoever+are+convicted+of+sin+by+the+light+of+nature%2C+are+also+by+the+force+of+the+Covenant+of+Works%2C+obnoxious+to+wrath%2C+and+as+often+as+we+are+convinced+of+sin%2C+so+often+also+by+nature+we+confirm+the+punishment+of+sin%2C+or+the+condition+of+the+legal+Covenant%2C+by+the+judgement+of+our+consciences+against+our+selves%2C+as+by+an+hand-writing%3A+The+conscience+of+every+one+performs+this+much+more%2C+which+hath+received+the+written+Law%2C+and+daily+bears+the+punishment+of+the+Law%2C+for+the+breaking+of+it.%0A%0ABut+chiefly+all+justiciaries+are+compelled+to+subscribe+to+this+hand-writing%2C+who+acknowledge+no+righteousness+besides+inherent%2C+or+that+which+is+by+works%3A+Of+which+number+were+those+that+Judaized%2C+and+observers+of+Ceremonies%2C+who+adhered+to+this+Covenant%2C+seeking+Righteousness+by+works%2C+and+the+appointed+Ceremonies%3A+For+by+how+much+they+did+endeavour+by+this+means+more+manifestly+to+establish+their+own+Righteousness%2C+by+so+much+the+more+openly+they+did+derive+the+punishment+of+the+Law+broken%2C+by+the+force+of+the+Covenant%2C+upon+themselves%3A+For+no+man+enters+a+Covenant%2C+but+he+also+admits+all+the+conditions+of+the+Covenant.%0A%0AThe+hand-writing+is+said+to+be+in+Ordinances%2C+or+rather+subscribed+to+Ordinances%2C+so+far+as+they+took+upon+them+those+commands%2C+or+Legal+Ordinances%2C+that+they+might+be+perfected+in+themselves%2C+they+did+withal+oblige+themselves+to+bear+the+punishment+of+the+breach+of+those+commands.%0A%0AHe+calls+it+the+hand-writing+against+us%2C+or+contrary+to+us%2C+partly+because+it+separated+the+Jews+from+the+Gentiles%2C+and+the+Gentiles+from+the+Jews%3B+Partly+because+it+was+a+yoke%2C+which+neither+they+nor+their+Fathers+could+bear%3B+Partly+because+as+often+as+they+did+any+work+of+the+Law%2C+either+moral+or+ceremonial+to+be+justified+thereby%2C+so+often+by+the+imperfection+of+their+work%2C+and+the+profession+of+their+imperfection+in+the+use+of+the+Levitical+Ceremonies%2C+they+did+argue+themselves+guilty%2C+or+rather+did+acknowledge+themselves+guilty+of+death.%0A%0AAs+for+example%2C+when+they+offered+Sacrifices%2C+and+did+repeat+them%2C+they+not+only+acknowledged+themselves+sinners+against+the+Moral+Law%2C+but+did+also+really+confess+that+their+frequent+Sacrifices+could+not+purge+their+consciences+from+sin%2C+and+so+the+hand-writing+of+the+Covenant+of+works+was+always+contrary+to+them%3A+But+Christ+hath+blotted+out+this+hand-writing%2C+and+took+it+out+of+the+way%2C+nailing+it+to+his+Cross%2C+insomuch+as+he+for+the+sake+of+them+that+were+his%2C+hath+paid+for+the+redeemed+the+penalty+due+upon+the+hand-writing+by+the+death+of+his+Cross%2C+and+hath+completed+and+abolished+the+positive+Ordinances+concerning+those+vanishing+Ceremonies%2C+by+the+real+Sacrifice+of+his+own+body+once+offered.%E2%80%9D%0A%0A%E2%80%94+David+Dickson%2C+An+exposition+of+all+St.+Paul%E2%80%99s+epistles+together+with+an+explanation+of+those+other+epistles+of+the+apostles+St.+James%2C+Peter%2C+John+%26+Jude%3A+wherein+the+sense+of+every+chapter+and+verse+is+analytically+unfolded+and+the+text+enlightened%2C+%28London%3A+Francis+Eglesfield%2C+1659%29%2C+pp+139-40.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7879149db4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7879149db4.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/06/04/david-dickson-on-christ-blotting-out-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>7. Lastly, In his person. Being a sinful man under the covenant of works, he is a cursed man; For it is written, “Cursed is every one that continueth not in all things which are written in the book of the law to do them.” The curse fixeth not only on what is his, but on himself; and it is for his sake that it is laid on other things. The curse, as you have heard, is on his soul, and on his body; for wherever sin is found under this covenant, there the curse also is And, (1.) The man is under the power of Satan, Acts 26:18. Into the hand of this enemy man fell, when he broke the covenant of works. Satan having waged war against heaven, set on man, heaven’s confederate, and gained the unhappy victory, gained him by temptation to renounce his allegiance to his rightful Lord by breaking the covenant, and so he fell under his power, as his captive taken in war, Isa. 49:24, was brought under bondage to this worst of masters, 2 Pet. 2:19, and is ruled by him at his pleasure, 2 Tim. 2 ult. The curse of the covenant falling on the covenant-breaker, he is thereby laid under condemnation, and adjudged to death according to the threatening; and so he falls under the power of him that has the power of death, that is the devil, Heb. 2:14. Every natural man is shut up as in a prison, in his natural state; and there he lies in bonds, Isa. 61:1. There are God’s bands on him, the bands of the curse binding him over to death; and the devil’s bands are on him, viz, the bands of strong lusts and corruptions, with which they are laden, as a malefactor in prison is laden with irons. And Satan has the power of gaoler over them. He keeps the keys of the prison, and narrowly watches the prisoners that none of them escape. They are not all kept alike close; but none of them can move beyond the bounds of his jurisdiction, more than the prisoner can get out of the dungeon. Even when the king’s word comes to deliver the elect, he will not yield them up; but the prison doors must be broke open, and they forcibly taken out of his hand by a stronger than he. (3.) The natural man being under the curse is continually in hazard of utter destruction, of having the copestone put on his misery, and being set beyond all possibility of help. If his eyes were opened he would see himself every moment in danger of dropping down into the pit of hell; Psalm 7:12, “If he turn not, he will whet his sword; he hath bent his bow, and made it ready.” The man is constantly standing before God’s bent bow, and has nothing to secure him one moment from the drawing of it. The sentence of death is passed against him, John 3:18, but there is no day intimated for the execution, but every day the dead warrant may be signed against him, and he led forth to death. His name may be “Magor-missabib,” a terror round about, Jer. 20:3. Whither can he look where he will not see his enemies ready to ruin him, on a word of command from that God under whose curse he lies? And what can he do for himself amidst his armed enemies? He is quite naked, Rev. 3:17, and cannot fight them; he is without strength, Rom. 5:6, and cannot wield armour, though he had it; he is bound hand and foot, Isa. 61:1, and cannot flee; and if he could, whither could he flee for safety? Heaven’s gates are shut upon him; in the utmost parts of the earth, or the most remote rock in the sea, God’s hand would find him out. Justice is pursuing the criminals under the curse, crying for vengeance on the traitors, and their foot shall certainly slide in due time; the law is continually throwing the fire-balls of its curses on them, and will at length set them on fire round about; death is on the pursuit after them, and has gained much ground of them already, and the cloud of wrath hangs over their heads continually in the curse, and the small rain of God’s wrath is still falling on them; how soon death may overtake them, they know not; and then the cloud breaks, and the great rain of his strength falls down upon them, and sweeps them away without hope for ever and ever.</p></blockquote>

<blockquote><p>To say that God carryeth all things by an absolute and unconditional decree of providence, viz. opposing absolute to all conditions presupposed in the creature, in my judgment is neither agreeing to the Doctrine of Scripture, nor of our Divines; who do both teach that as God in the fulness of time doth administer and dispense the way of his providence, so he decreed to dispense them in the same manner from eternity.

Now in dispensing the performance of the Covenant of works, the Lord punisheth and rewardeth the creature according to the condition of obedience or disobedience performed by it, as it is at large described, Levit. 26; Deut. 28. and therefore surely he decreed to carry such works of his providence upon the same conditions.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“To say that God carryeth all things by an absolute and unconditional decree of providence, viz. opposing absolute to all conditions presupposed in the creature, in my judgment is neither agreeing to the Doctrine of Scripture, nor of our Divines; who do both teach that as God in the fulness of time doth administer and dispense the way of his providence, so he decreed to dispense them in the same manner from eternity.

Now in dispensing the performance of the Covenant of works, the Lord punisheth and rewardeth the creature according to the condition of obedience or disobedience performed by it, as it is at large described, Levit. 26; Deut. 28. and therefore surely he decreed to carry such works of his providence upon the same conditions.”

— William Twisse, A treatise of Mr. Cotton’s, Clearing certain doubts concerning predestination. Together with an examination thereof, (London: Andrew Crook, 1646), p. 245.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTo+say+that+God+carryeth+all+things+by+an+absolute+and+unconditional+decree+of+providence%2C+viz.+opposing+absolute+to+all+conditions+presupposed+in+the+creature%2C+in+my+judgment+is+neither+agreeing+to+the+Doctrine+of+Scripture%2C+nor+of+our+Divines%3B+who+do+both+teach+that+as+God+in+the+fulness+of+time+doth+administer+and+dispense+the+way+of+his+providence%2C+so+he+decreed+to+dispense+them+in+the+same+manner+from+eternity.%0A%0ANow+in+dispensing+the+performance+of+the+Covenant+of+works%2C+the+Lord+punisheth+and+rewardeth+the+creature+according+to+the+condition+of+obedience+or+disobedience+performed+by+it%2C+as+it+is+at+large+described%2C+Levit.+26%3B+Deut.+28.+and+therefore+surely+he+decreed+to+carry+such+works+of+his+providence+upon+the+same+conditions.%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+A+treatise+of+Mr.+Cotton%E2%80%99s%2C+Clearing+certain+doubts+concerning+predestination.+Together+with+an+examination+thereof%2C+%28London%3A+Andrew+Crook%2C+1646%29%2C+p.+245.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbf77a45789.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bf77a45789.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/09/07/william-twisse-on-leviticus-26-deuteronomy-28-and-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Howbeit, the preface to the ten commandments deserves a particular notice, in the matter, of the Sinai transaction, Exod. xx. 2, “I am the Lord thy God, which have brought thee out of the land of Egypt, out of the house of bondage.” Hence it is evident to me, that the covenant of grace was delivered to the Israelites on Mount Sinai. For the Son of God, the messenger of the covenant of grace, spoke these words to a select people, the natural seed of Abraham, typical of his whole spiritual seed. …

But that the covenant of works was also, for special ends, repeated and delivered to the Israelites on Mount Sinai, I cannot refuse, 1. Because of the apostle’s testimony, Gal. iv. 24, “These are the two covenants; the one from Mount Sinai, which gendereth to bondage.” For the children of this Sinai covenant the apostle here treats of, are excluded from the eternal inheritance, as Ishmael was from Canaan, the type of it, ver. 30, “Cast out the bond-woman and her son ; for the son of the bond-woman shall not be heir with the son of the free woman;” but this could never be said of the children of the covenant of grace under any dispensation, though both the law and covenant from Sinai itself, and its children, were even before the coming of Christ under a sentence of exclusion, to be execute on them respectively in due time.

2. The nature of the covenant of works is most expressly in the New Testament brought in, propounded, and explained, from the Mosaical dispensation. The commands of it from Exod. xx. by our blessed Saviour, Matth. xix. 17—19, “If thou wilt enter into life, keep the commandments. He saith unto him, Which? Jesus said, Thou shalt do no murder, thou shalt not commit adultery,” &amp;c. The promise of it, Rom. x. 5, “Moses describes the righteousness which is of the law, that the man which doth these things shall live by them.” The commands and promise of it together, see Luke x. 25—28. The terrible sanction of it, Gal. iii. 10, “For it is written, (viz. Deut. xxvii. 26,) Cursed is every one that continueth not in all things which are written in the book of the law to do them.”

3. To this may be added the opposition betwixt the law and grace so frequently inculcated in the New Testament, especially in Paul’s epistles. See one text for all, Gal. iii. 12, “And the law is not of faith, but the man that doeth them shall live in them.”

4. The law from Mount Sinai was a covenant, Gal. iv. 24, “These are the two covenants, the one from the Mount Sinai;” and such a covenant as had a semblance of disannuling the covenant of grace, Gal. iii. 17, “The covenant that was confirmed before of God in Christ, the law which was 430 years after, cannot disannul;” yea, such a one as did, in his own nature, bear a method of obtaining the inheritance, so far different from that of the promise, that it was inconsistent with it; “For if the inheritance be of the law, it is no more of promise,” Gal. iii. 18, wherefore the covenant of the law from Mount Sinai could not be the covenant of grace, unless one will make this last not only a covenant seeming to destroy itself, but really inconsistent; but it was the covenant of works, which indeed had such a semblance, and in its own nature did bear such a method as before noted; howbeit, as Ainsworth says, “The covenant of the law now given could not disannul the covenant of grace,” Gal. iii. 17. — Annot. on Exod. xix. I.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-9b75e248df" data-kw="">
<blockquote><p>Also though it be true, that one and the same man may both teach and exhort, and the comparison of the natural body doth not in all things hold, for one member cannot both be the eye to see, and the ear to hear, but both are here a sort of eye to the Church; yet hath Christ made the Pastor and the Doctor different. (It is needless to dispute, if they differ in nature, and if it be a confounding of Christ’s order, that one be both, when Christ hath given gifts for both to one man) for first, the Word of God doth difference them; secondly, we know that many have gifts to teach, who are but dull and weak to persuade and work upon the affection, as is observed amongst the Fathers. Augustine excelled in teaching and disputing, Chrysostom in exhorting. [Alfonso] Salmeron observeth, that there Thomas Aquinas was eminent in informing the understanding, and Bonaventura excellent for moving the affections. And many are fitted to work on the affections, as Pastors, who are not able to teach as Doctors in the Schools. So hath Chrysostom and Theodoret observed upon these words, Rom. 12. 7, 8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The due right of presbyteries, or, A peaceable plea for the government of the Church of Scotland</cite>, (London: Richard Whittaker and Andrew Crook, 1644), p. 158.</span></figcaption>

d it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6ac434a282" data-kw="">
<blockquote><p>III. Whether there can be regeneration of adults without antecedent or conjoined external calling through the Word externally set forth; and whether de facto there has been such? Response: The former is not to be denied. To the latter we say that ordinarily it does not happen, according to Rom. 10:15, 17; 1 Cor. 1 [1:21]; 2 [2:4-5], 21 [This should be different], compared with Ps. 147 [vv. 19-20]; Eph. 2:11–12. Nor do I see any example adduced after the new covenant was established. Concerning Abraham, it can be said that he had in his paternal family the external Word handed down from hand to hand through the patriarchs. Concerning Adam and Eve, it can be said that they were the first in whom God established the church after the fall, from whom thenceforth the church was propagated through the external Word. Nor is it certain that their first conversion was accomplished without some Word sounding externally (although in an extraordinary manner, because it was necessary first to establish the order and to begin from them).</p></blockquote>

<blockquote><p>…as David without immediate revelation from Heaven to direct him, by only the Law of nature, did eat showbread; So is the case here, so answer the casuists and the schoolmen, that a positive law may yield in case of necessity to the good of the Church; so Thomas, Molina, Suarez, Vasquez, Vigverius, Sotus, Scotus, Altisiodorensis, Durand, Gabriel; and consider what the learned Voetius says in this: What if in an extreme case of necessity, a private man, endued with gifts and zeal should teach publicly, after the example of the faithful at Samosaten.</p></blockquote>

<blockquote><p>1st Distinction. There is one power of public preaching in a Church not constitute[d], and another in a Church constitute[d]; gifted persons in extraordinary cases, where a Church is not planted, may publicly preach, but the case is otherwise in a Church constituted. … 4th Distinction. There is a call to an habitual and ordinary prophesying; here is required not only a calling by gifts, but also a collation of authority to the office, either immediately by God, or mediately by the Church, and there is a call to some particular or occasional acts of exhorting, as the martyrs and Stephen [Acts 7] are called to give confession of their faith, and a king in battle, to exhort his army, or a prince his subjects to piety, and to this latter there is no other call required but the place and profession of the exhorter, though he bee not by office a pastor. 5th Distinction. There is a formal calling of the Church, as the laying on of the hands of the elders, and a virtual and interpretative calling or tacit approbation of the Church, when learned men of eminent gifts, not in office, do write commentaries, sermons on canonic Scriptures, and tractates refuting heresies; to this the tacit approbation of the Church is required, but these have not ordinary pastoral care, nor are they the ordinary converters of souls to Christ, as the pretended prophets of [the] Separatists are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (London, 1644) | pt. 2, p. 272</span></figcaption>

</figure><figure class="quote" id="q-7ac968f88a" data-kw="">
<blockquote><p>But beside, suppose there were some petty defects or irregularities in their entry to the exercise of their ministry… yet ye should know it is not every lighter fault of that nature which will warrant Separation; but only such attrocious crimes as either destroys the essence of the ministry and makes it null and void (as your Reverend Mr. [Robert] Brown teaches in the Preface to his Book against Wolrogen, and excellent Mr. [Oliver] Bowels in his Pastor Evangelicus, bk. 1, ch. 4), for recte fieri is one thing, and ratum esse is another, and multa impediunt matrimonium contrahendum, quae non dirimunt contractum; or else does so vitiate their ministry as people cannot join therewith in its ministerial acts without real and native participating in the sin, in God’s account and in the construction of his holy Law: Otherwise if there be any pollution adherent to their ministry, which neither evacuates the essence thereof, nor so intrinsically leprosies it, but ye may communicate in its acts abstractly from and without touching the spot; the sin rests on the men themselves, and ye are not concerned therein farther than to lament it, but not to be scared and debarred by it from joining in their ministerial administrations, they being to you clean, whatever they be to the men themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead</cite>, (1674; London: Cockerill, 1681), p. 176</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But beside, suppose there were some petty defects or irregularities in their entry to the exercise of their ministry… yet ye should know it is not every lighter fault of that nature which will warrant Separation; but only such attrocious crimes as either destroys the essence of the ministry and makes it null and void (as your Reverend Mr. [Robert] Brown teaches in the Preface to his Book against Wolrogen, and excellent Mr. [Oliver] Bowels in his Pastor Evangelicus, bk. 1, ch. 4), for recte fieri is one thing, and ratum esse is another, and multa impediunt matrimonium contrahendum, quae non dirimunt contractum; or else does so vitiate their ministry as people cannot join therewith in its ministerial acts without real and native participating in the sin, in God’s account and in the construction of his holy Law: Otherwise if there be any pollution adherent to their ministry, which neither evacuates the essence thereof, nor so intrinsically leprosies it, but ye may communicate in its acts abstractly from and without touching the spot; the sin rests on the men themselves, and ye are not concerned therein farther than to lament it, but not to be scared and debarred by it from joining in their ministerial administrations, they being to you clean, whatever they be to the men themselves.”

— John Bairdie, Balm from Gilead, (1674; London: Cockerill, 1681), p. 176">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+beside%2C+suppose+there+were+some+petty+defects+or+irregularities+in+their+entry+to+the+exercise+of+their+ministry%E2%80%A6+yet+ye+should+know+it+is+not+every+lighter+fault+of+that+nature+which+will+warrant+Separation%3B+but+only+such+attrocious+crimes+as+either+destroys+the+essence+of+the+ministry+and+makes+it+null+and+void+%28as+your+Reverend+Mr.+%5BRobert%5D+Brown+teaches+in+the+Preface+to+his+Book+against+Wolrogen%2C+and+excellent+Mr.+%5BOliver%5D+Bowels+in+his+Pastor+Evangelicus%2C+bk.+1%2C+ch.+4%29%2C+for+recte+fieri+is+one+thing%2C+and+ratum+esse+is+another%2C+and+multa+impediunt+matrimonium+contrahendum%2C+quae+non+dirimunt+contractum%3B+or+else+does+so+vitiate+their+ministry+as+people+cannot+join+therewith+in+its+ministerial+acts+without+real+and+native+participating+in+the+sin%2C+in+God%E2%80%99s+account+and+in+the+construction+of+his+holy+Law%3A+Otherwise+if+there+be+any+pollution+adherent+to+their+ministry%2C+which+neither+evacuates+the+essence+thereof%2C+nor+so+intrinsically+leprosies+it%2C+but+ye+may+communicate+in+its+acts+abstractly+from+and+without+touching+the+spot%3B+the+sin+rests+on+the+men+themselves%2C+and+ye+are+not+concerned+therein+farther+than+to+lament+it%2C+but+not+to+be+scared+and+debarred+by+it+from+joining+in+their+ministerial+administrations%2C+they+being+to+you+clean%2C+whatever+they+be+to+the+men+themselves.%E2%80%9D%0A%0A%E2%80%94+John+Bairdie%2C+Balm+from+Gilead%2C+%281674%3B+London%3A+Cockerill%2C+1681%29%2C+p.+176&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7ac968f88a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7ac968f88a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-church-ministry/#:~:text=But%20beside%2C%20suppose%20there%20were%20some,they%20be%20to%20the%20men%20themselves&am

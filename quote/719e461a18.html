<main class="wrap"><figure class="quote" id="q-719e461a18" data-kw="">
<blockquote><p>Thus there are many others today who want to be counted as evangelical theologians and who, so far as their words are concerned, do teach that men are delivered from their sins by the death of Christ. Meanwhile, however, they insult Christ most grievously by distorting and overthrowing His Word in a villainous and wicked manner. In addition, they teach faith in a way that attributes more to love than to faith; for they imagine that God regards and accepts us on account of the love with which we love God and our neighbor after we have already been reconciled. If this is true, then we have no need whatever of Christ. In this way they serve, not the true God but an idol of their own heart—an idol which they have made up for themselves. For the true God does not regard or accept us on account of our love, virtue, or newness of life (Rom. 6:4); He does so on account of Christ. But they raise the objection: “Yet He commands that we love Him with all our heart.” All right, but it does not follow: “God has commanded; therefore we do so.” If we loved God with all our heart, etc., then, of course, we would be justified and would live on account of that obedience, according to the statement (Lev. 18:5): “By doing this a man shall live.” But the Gospel says: “You are not doing this; therefore you shall not live on account of it.” For the statement, “You shall love the Lord,” requires perfect obedience, perfect fear, trust, and love toward God. In the corruption of their nature men neither do nor can produce this. Therefore the Law, “You shall love the Lord,” does not justify but accuses and damns all men, in accordance with the statement (Rom. 4:15): “The Law brings wrath.” But “Christ is the end of the Law, that everyone who has faith may be justified” (Rom. 10:4).</p></blockquote>

<blockquote><p>VIII. Furthermore, the nature of this eternity [of God] will be made further known to us if we consider that there are, in total, three measures of duration. The first belongs to things that by their nature are mutable and that wear out. It possesses a beginning and an end, and it is called ‘time’. Its nature consists in a continuous succession of moments, such that properly speaking not but one moment exists at a time, and only when the preceding moments have ceased to exist and the following moments do not yet exist. In this measure of duration it is proper to observe periods: the past, the present, and the future. The second measure of duration belongs to things that by their essence are incorruptible or immaterial. It has a beginning but it is without end, and it is named ‘forever’ [aevum]. The third measure is simply immutable, and thus it lacks beginning, end and succession. And only this measure is that eternity which the Scholastics define as “interminable, indivisible, and independent duration”: “interminable,” meaning that it lacks both outer boundaries; “indivisible,” meaning that it also lacks succession; and finally, “independent,” meaning that it lacks all imperfection and change. Thus in this eternity, three things come together: the absence of a beginning, the absence of an end (which all admit), and the absence of succession. This last absence Vorstius [an Arminian] as well as the Socinians deny, and we will demonstrate and vindicate it in the elenctic part.</p></blockquote>

<blockquote><p>14. Since they are not mere thoughts but substantial beings they exist spatially, but in such wise that space is not for them an obstructive barrier. In the same way angels exist temporally as beings created for a definite time, but in such wise that for them time never ends. … Thomas is more correct in denying that they are in a place without operating, because they are everywhere and operate by knowledge and will, even ad extra [to themselves], by glorifying God, and serving Him among men and all other creatures. So that they may be said to be in a place not because they are bounded by a place but because they themselves rather bound the place by their operation, as Thomas rightly says, 22: Therefore angels whom no medium resists must move very swiftly; much more, assuredly, than a corporeal thunderbolt, which is borne from east to west in a most destructive moment. Nor does it follow from this that angels move in a moment or by deserting their localisation acquire a new one in a moment. Although the medium is not resistant, succession is and so is a fresh act succeeding a former one, as well as the distance between the termini, which involves some measure of delay. For it is impossible that in the same nuni and present it should have a locus and when it leaves it should acquire a new one. Nor may we accept outright without a grain of salt Tertullian’s words: ‘As spirit has wings, in a moment it is everywhere.’ Heidegger (VIII, 23): ‘The duration of angels is neither eternity, which befits God alone as existing necessarily and through his nature; nor time or a continuance consisting of material things measurable by movement; or something separate (discretum), which suits things that succeed each other without continuity, not permanent things; nor a permanent instant which is defectible. Therefore what is usually attributed to them is aion, aevum, as it were aei on, always (at least a posteriori) existing, because of their prolonged duration, the origin of which man does not attain to by living, and of which there shall be no end at all.&#x27;</p></blockquote>

<blockquote><p>mere hieroglyphics, to represent the constant tender love and watchfulness of God over the ark of his covenant and the people that kept it, and had nothing of the nature of images in them.” (Works 14.446) Durham seems even more uncomfortable over the problem posed by the cherubim. He would like to ban representations of angels altogether, but he hesitates to take too firm a stand: ‘From this ground also it would seem, that painting of angels might be condemned, as a thing impossible, they being spirits which no corporeal thing can represent, beside that the representing of them has some hazard with it: and for those cherubims that were made by God’s direction under the Old Testament, they were rather some emblem of the nature and service of angels, as being full of zeal, and always (as it were) upon wing read to obey God’s will, than any likeness of themselves.’ (Law Unsealed, pp. 68–69) The bronze serpent made by Moses is clearly a happier example. The worship of this “Nehushtan” by later generations demonstrates how easily even lawful images may be abused. (Cf. ibid., p. 69; Boston, Works 2.151; Watson, Body of Divinity, pp. 388-89)</p></blockquote>

<blockquote><p>Men understand by way of syllogistical discourse, viz. by reasoning; that is, by deducing and gathering conclusions from principles by several acts of their understanding: and by compounding and dividing: that is, by laying the subject and predicate together, or by taking them asunder: and thereby collecting what may be said, or not said truly concerning such a subject. Those truths which men, by reason of the weakness of their understanding, apprehend not without discourse and by compounding and dividing (Thomas, pt. 1, quest. 58, art. 3-4; Polanus, Syntagma, bk. 5, ch. 11), angels, by reason of the quickness and strength of their understanding, apprehend readily and as it were at first sight. Whence albeit they understand syllogistical discourse, composition and division, yet (at least compared with men) they may be said not to understand by discourse, nor by composition and division, but intuitively and as it were at first sight.</p></blockquote>

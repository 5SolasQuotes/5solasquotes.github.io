<main class="wrap"><figure class="quote" id="q-3a547140f2" data-kw="">
<blockquote><p>2. The person [candidate for being the pastor] is tried by Timothy and Titus, and so by the presbytery, his ability, that he be able to teach others (2 Tim. 2:3), that he be apt to teach (1 Tim. 3:2; Tit. 1:9), else the Timothies of the Church lay hands suddenly on him, contrary to 1 Tim. 5:22. So the presbytery tries according to these canons with us, his skill in the languages: Latin, Hebrew, and Greek; his ability of preaching popular sermons, and interpreting Scripture, in controversies, in chronology, and the history of the Church, and he must be proved and tried by the people, by preaching sundry sermons to them (1 Tim. 3:10), and let these first be proved, and let them use the office, whatever officers they shall be, Pastors, Doctors, Elders or Deacons. … 3. …and another day set for his ordination, at which day the edict is called, all who have anything to object against his life and doctrine are thrice publicly at the church door invited to come and object. And this we think is [in Greek] ‘episkepein andra,’ (Acts 6:3) and ‘dokimazein andra,’ (1 Tim. 3:10) ‘to find out’ and ‘to try the man’. The day of ordination… the pastor calls him up before the congregation, and demands if he be willing to accept the charge, and he must testify his consent as Isaiah (Isa. 6:8; Jer. 6:7,8; Acts 9:20). Then the pastor asks the peoples’ consent, which they testify by their [in Greek] ‘keiro onia’, ‘the lifting up of their hands’ (as Acts 14:23), and the man must please the whole multitude (as Acts 6:5; 1:26). This being done, the pastor… with the Presbytery lays their hands on his head, and prays that God would bless him, as the apostles did (Acts 6:6). The apostles prayed and laid their hands on them (Acts 13:3). They prayed and laid their hands on them (1 Tim. 4:14; 1 Tim. 5:22), all being done, the eldership of the congregation give him the right hand of fellowship (as Gal. 2:9)… And this order in substance is kept in ordaining doctors, elders, and deacons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable and Temperate Plea for Paul’s Presbytery in Scotland (1642), ch. 20, 3rd Article, ‘Calling of Officers, especially Pastors’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1b00e652a0" data-kw="">
<blockquote><p>The similarity [of the determination of the synod in the morning] to the Irish [Pacific] Act [1720] is apparent [which expressly allowed for exceptions], and in the context, especially given [Thomas] Craighead’s involvement, it is certain that it served as the source for the Committee’s proposal… in light of the actual overture by [John] Thomson, which stipulated the two needs [of subscription and adopting a confession], it makes more sense to see the morning session establishing the requirement and terms of subscription and the afternoon session as the formal adoption by the Synod [of the Westminster Confession]. In other words, the Synod’s adopting of the Confession is distinguished from the requirement for subscription and later debates in the American Church has been the result of not recognizing the distinction. The ‘preliminary’ or morning session is the only one to explicitly require subscription. Moreover, allowing presbyteries to judge scruples would be nonsense had the Synod intended to decide what scruples would be allowed in the afternoon session.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-scott-sealy.html">Charles Scott Sealy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Church Authority &amp; Non-Subscription Controversies in Early 18th Century Presbyterianism PhD thesis (Univ. of Glasgow, 2010), pp. 169-28 | ch. 5, ‘The Synod of Philadelphia &amp; the Adopting Act (1729)’</cite>, pp. 179-81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

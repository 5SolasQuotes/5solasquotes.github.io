<main class="wrap"><figure class="quote" id="q-cb9bb6fc0d" data-kw="">
<blockquote><p>Although a thing may have its origin in Scripture, if it is to be indifferent, it is nevertheless required that there be no positive precept by which it is ordered, nor any negative one by which it is prohibited, but that it be left to us as something free, to use or not to use, as shall seem useful… Indifferent things must have a manifest and open usefulness, known in the Church, lest they may seem to be received for no purpose, or to be forced into the Church by treachery and deceit… power is given to edification and not to destruction (1 Cor. 14)… …the writings of the apostles and evangelists, which place before us most clearly the annulment of the rituals of Aaron, his ceremonies, priesthood, images, and peculiar figures, and the institution of the new and perfect priesthood of Christ. They must demonstrate to us from these books the grounds and occasion when some peculiar and special vestments should be worn in the ministry, for the adornment of the ministry itself, or for the preferring of its decorum, or for some distinctive mark, by which the minister can be distinguished from the people, as once was ordained by the Lord in the ministry of Aaron’s priesthood. But the statutes, canons and decrees of the apostles and evangelists make no mention of this matter… …What is prohibited by God can in no way be indifferent, as we have given warning above. For this is the doctrine of Paul in Gal. 2, that whatever re-establishes things that have been annulled in Christ, transgresses the will of God… Neither is it without its mystery that our Saviour Jesus Christ hung naked from the Cross. For Aaron’s priests used vestments in their own ministry because the reality of their priesthood, Christ Himself, had not yet come. But when Christ Himself was to be sacrificed, stripped of all clothing, displaying in this way his own priesthood, which since He was Reality itself, now had no further need of veils or semblances…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-hooper.html">John Hooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Regulative Principle &amp; Things Indifferent’</cite>, (1550) in ed. Iain Murray, The Reformation of the Church: a Collection of Reformed &amp; Puritan Documents on Church Issues</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ea6928ec62" data-kw="">
<blockquote><p>…whereas your surplice is arbitrarily institute[d], and imposed to signify innocency, without either real foundation or sufficient warrant, wherein, whether you do more usurp against God’s prerogative to appoint sacred and mysterious signs, and that simplicity, in which he has set forth his Gospel, or be more grossly mistaken in the event and fruit of your application, is a great question? I grant that necessity or decency have introduced many things circumstantial that are rational, and consequently upon some real antecedent ground expressive of their use and end: as grave apparel in pastors, a becoming covering of pulpits, tables in sacred use, regulation of time, postures, gestures and the like, without which worship cannot be performed; But to ascribe a liberty to the Church of appointing ceremonies, having for reason of their signification, the will of the instituter, and their use only in the representation, is so manifest an impingement upon Divine authority and the sacraments thereby ordained, and has already produced such a mass of superstitious superfluity in the Romish-Church, that I much admire to find a serious person pleading for such fopperies…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … (1671), 3rd Dialogue, pp. 111-12</span></figcaption>

</figure><figure class="quote" id="q-cd99044f54" data-kw="">
<blockquote><p>…we think that some things are tolerated which should not at all be endured. We are not spending so much time on those linen vestments that we would want the progress of God’s Word to be disturbed because of them–even just a little. Yet we judge that they have acted correctly and wisely who have thrown out of their churches that whole form of dress, which is more suited to actors than to ministers of the Word, as well as other remnants of paganism. For surely they can do a great deal of harm, as experience itself has taught; and they cannot help at all. But we certainly do not count the restoring of what has been thrown out among things that are indifferent [adiaphora].</p></blockquote>

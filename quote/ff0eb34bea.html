<blockquote><p>2. The next thing in God is love, and that arises from goodness. The goodness that is in God inclines Him to love, and to be the most profuse lover. You read in 1 John 4:7-8, ‘God is love.’ The question is whether this speech does not import that He is love in Himself, as well as that He shows love. There are these reasons why it imports what He is in Himself, when He says, ‘God is love.’ Says He, verse 7, ‘Every one that loves is born of God, and knows God,’ that is the affirmative; and verse 8, ‘He that loves not knows not God, for God is love’; that is, he knows not God in what is most proper to Him, as to what does most abound in Him, for God is love. We ordinarily say of a man that is of such a disposition, I know him, he is so and so; so the believer knows God to be love… He speaks it of his love, which none sees but as manifest by effects; but God is love essentially. Says Aquinas, Whoever has a will, has a proneness to love. Says Musculus, As every one is in goodness, so in love. If God then has a will inclined to anything, it is to love; He has hatred in Him to sin, He has the opposite: He has a love also to something, only it is guided by his will towards creatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Object &amp; Acts of Justifying Faith, pt. 1</cite>, bk. 1, ch. 8, on Ex. 34:6-7 in The Works (d. 1680; Edinburgh: James Nichol, 1864), vol. 8, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5dc100afcf" data-kw="">
<blockquote><p>The words of the apostle, ‘God will have all men to be saved, etc.’ [1 Tim. 2:4] can be understood in three ways: Third, according to [John] Damascene (Of the Orthodox Faith, 2.29), they are understood of the antecedent will of God; not of the consequent will. This distinction must not be taken as applying to the divine will itself, in which there is nothing antecedent nor consequent, but to the things willed. To understand this we must consider that everything, in so far as it is good, is willed by God. A thing taken in its primary sense, and absolutely considered, may be good or evil, and yet when some additional circumstances are taken into account, by a consequent consideration may be changed into the contrary. Thus that a man should live is good; and that a man should be killed is evil, absolutely considered. But if in a particular case we add that a man is a murderer or dangerous to society, to kill him is a good; that he live is an evil. Hence it may be said of a just judge, that antecedently he wills all men to live; but consequently wills the murderer to be hanged. In the same way God antecedently wills all men to be saved, but consequently wills some to be damned, as His justice exacts. Nor do we will simply, what we will antecedently, but rather we will it in a qualified manner; for the will is directed to things as they are in themselves, and in themselves they exist under particular qualifications. Hence we will a thing simply inasmuch as we will it when all particular circumstances are considered; and this is what is meant by willing consequently. Thus it may be said that a just judge wills simply the hanging of a murderer, but in a qualified manner he would will him to live, to wit, inasmuch as he is a man. Such a qualified will may be called a willingness rather than an absolute will. Thus it is clear that whatever God simply wills takes place; although what He wills antecedently may not take place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, quest. 19, article 6, Whether the will of God is always fulfilled?, reply to objection 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>‘And it shall come to pass, that as the Lord rejoiced over you.’ The wonderful and inestimable love of God towards his people is here set forth, via, that He had rejoiced in heaping blessings upon them; wherefore their depravity was all the more base and intolerable, in that God, though voluntarily disposed to be bountiful, was obliged by it to lay aside His affection for them. But although it is only by a metaphor that God is said to rejoice in destroying the wicked, yet it is not without good reason that this expression is applied to Him; that we may know that He can no more fail to be the defender of His Law, and the Avenger of its contempt, than deny Himself. He complains, indeed, by Isaiah, (Isa. 10:24) that He is unwillingly forced to punish the Jews; but these two things are quite consistent, that He rejoices in His just judgment and at the same time is mindful of His clemency and indulgence, so that He would rather pardon, if the wickedness of men would allow Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Deuteronomy</cite>, 28, verse 63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>1. Because out of the amiable invitation, this only is concluded: the simple obligation of the creature to obedience, an earnest [seria] approbation and complacency which God has with respect to the obedience, inasmuch as the thing is holy, has been required of Him, is morally pleasing, and as it is unto the convenience and salvation of a man. On account of this disposition [affectus] in God, nothing is further added by the simple complacency of God around obedience except a certain quasi-intention and vehemency of divine obligation to the thing, which testifies to the obedience of all by an earnestness from the precept and from having obliged men to the thing; and thus it is to Him singularly and vehemently pleasing in his sight inasmuch as salvation is made glorious to men; but except He decree it, by the corruption of men, it will not come to be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. Johnson &amp; Fentiman (1639-1642; RBO, 2019), ch. 2, ‘On God’, Section 20, ‘Whether because God amiably invites and by supplications solicits, entreats and calls upon reprobates, and as He mourns over them, is grieved by them and laments on account of the disobedient, whether He, therefore, intends the obedience of them?’, pp. 57-58</span></figcaption>

<blockquote><p>As the term God is more distinctly expressive of majesty, so the term ‘Father’ conveys the idea of clemency and benevolent disposition. It becomes us to contemplate both as existing in God, that his majesty may inspire us with fear and reverence, and that his fatherly love may secure our full confidence. Hence it is not without good reason that Paul has conjoined these two things… At the same time there will be no inconsistency in saying, that he contents himself with the single term, ‘Father’. Farther, as it is necessary that his incomparable grace should be expressed by the term ‘Father’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Colossians</cite>, 1:12</span></figcaption>

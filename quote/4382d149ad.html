<blockquote><p>…the pastors of our reformed Churches, having (in common) had even an ordinary calling: and, therewith holding the true apostolic doctrine, we are the true successors of the apostles, and not our adversaries… …as says Gregory Nazianzen. His words are notable, and which alone are even enough to oppose to all our adversaries shameless brags of bare succession. They are to this sense: The succession of piety is properly to be holden succession: for who professes the same doctrine of faith, he is partner of the same chair: but who embraces a contrary faith, he ought to be accounted an adversary… … therefore, to approve themselves true successors to the apostles, they must also verify themselves to hold the same doctrine:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-forbes.html">Patrick Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defense of the Lawful calling of the Ministers of Reformed Churches Against the Cavillations of Romanists</cite>, (Middleburgh, 1614)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d090d11438" data-kw="">
<blockquote><p>§31. p. 356, etc. Rule 23. [The opponent said:] ‘Subscription to Articles and forms of Confession in any particular Church is wholly of political consideration.’ Subscription ought to be so intended that he who has subscribed may not perceive himself taken in a snare: but yet he that subscribes must do it to those purposes and in that sense and signification of things which the supreme power intends in commanding it; that is, at least that he that subscribes do actually approve the Articles overwritten: that he does at that time believe them to be such as it’s said they are; i.e. true, if they only say they are true; useful, if they pretend to usefulness; necessary, if it be affirmed that they are necessary. For if the subscriber believes not this, he by hypocrisy serves [only] the ends of public peace and his own preferment. When Articles are established without necessity [i.e. the establishment of non-necessary articles], subscription must be required without tyranny and imperiousness. That is, it must be left to the liberty of the subject to profess or not profess that doctrine. To bring evil on men that do not believe the Article and dare not profess to believe what they do not, is injustice and oppression; it is a law of iniquity, and therefore it is not obligatory to conscience, and no human authority is sufficient for the sanction and imposition. Question: Can it be lawful for any man to subscribe what he does not believe to be true, giving his hand to public peace and keeping his conscience for God? Answer: No, if subscription signify approbation; for in that case it is hypocrisy, etc. But if subscription were no more than the office of a clerk of the signet or council, who in form of law is to sign all the acts of the council, it were different. For it is not as an account of his own opinion, but as a formality of the court: all the world looks on it as none of his personal act. But in subscription to Articles of Confession every ecclesiastic that subscribes does it for himself, lubens et ex animo subscripsi [‘I have subscribed willingly and from the heart’], is our form in the Church of England. If the intention of our superior be to require our assent, he that subscribes does profess his assent; and whatever he thinks himself, it is the intention of the imposer that qualifies the subscription. No particular Church ought with rigor to require subscriptions to Articles not evidently true and necessary to be professed: because in the division of hearts that is in the world, it is certain that some good men may dissent, and then either they shall be afflicted or tempted to hypocrisy: of either of which if ecclesiastic laws be guilty, they are not for edification: they are neither just, nor pious, and therefore oblige not. §32. pp. 358-59, ‘At least let the Articles be made with as great latitude of sense as they can and so that subscriptions be made to the form of words; let the subscribers understand them in what sense they please which the truth of God will suffer and the words can be capable of.’ This is the last remedy; but it is the worst: It has in it something of craft, but very little of ingenuity; and if it can serve the ends of peace or of external charity, or of fantastic concord [a concord of the fantasy], yet it cannot serve the ends of truth and holiness, and Christian simplicity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Non-Conformists’ Plea for Peace, pt</cite>, 2</span></figcaption>

</figure><figure class="quote" id="q-44939741d7" data-kw="">
<blockquote><p>While it’s likely that Machen himself took no doctrinal exceptions to the Westminister Standards, it’s clear from his own words and leadership in the formation of the OPC that he believed officers should be granted exceptions to doctrines (not just wording) that do not strike at the fundamentals of the Presbyterian and Reformed system and that they should be allowed to teach these exceptions. We know this because of how he approached the question of premillennialism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/derek-radney.html">Derek Radney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘J. Gresham Machen on Confessional Subscription: Not a Fundamentalist in holding to the Westminster Standards’</cite>, (2023) Substack</span></figcaption>

</figure><figure class="quote" id="q-982373dad1" data-kw="">
<blockquote><p>The 1868 Old School Assembly declared that the New School pronouncement of ‘true doctrines’ in the 1837 Auburn Declaration ’embrace all the fundamentals of the Calvinistic creed.’ The New School version of Calvinism was vindicated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-donald-fortson-iii.html">S. Donald Fortson III</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘New School Calvinism &amp; the Presbyterian Creed’ in The Journal of Presbyterian History</cite>, (1997-), vol. 82, no. 4 (Winter 2004), pp. 221-43, p. 238</span></figcaption>

</figure><figure class="quote" id="q-0b1f617f85" data-kw="">
<blockquote><p>Up to this time [1573], the prevailing practice was that only ministers signed the Belgic Confession. In 1574, however, the provincial Synod of Dordrecht decided that ‘it would be useful that the elders and deacons also subscribe to the Netherlands Confession, and to the articles of the [Emden] Synod.’ For this purpose, it was considered advisable that a copy of the confession and of the articles of the Emden Synod be kept by all consistories [sessions] or at least by all classes [presbyteries]. For the first time, schoolteachers were also required to sign the confession and to submit to the ‘discipline’ or articles of the Emden Synod. The idea of elders’ and deacons’ subscribing was not immediately accepted in all the churches. For example, at Delft the elders and deacons refused to sign the confession, while at Middelburg they did. Gaspar van der Heyden, pastor at Middelburg and president of the recent Dordrecht Synod, on 16 November 1574 wrote to Delft pastor Arent Cornelisz: ‘Our elders and deacons have signed the Confession of Faith and the articles of the [Emden] synod; I certainly wish that yours had done the same. How would they who now refuse to sign the Confession with ink seal it with their own blood?&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/netherlands.html">Netherlands</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Donald Sinnema, “The Origin of the Form of Subscription in the Dutch Reformed Tradition” in Calvin Theological Journal</cite>, (July 2007), p. 259</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Up to this time [1573], the prevailing practice was that only ministers signed the Belgic Confession. In 1574, however, the provincial Synod of Dordrecht decided that ‘it would be useful that the elders and deacons also subscribe to the Netherlands Confession, and to the articles of the [Emden] Synod.’ For this purpose, it was considered advisable that a copy of the confession and of the articles of the Emden Synod be kept by all consistories [sessions] or at least by all classes [presbyteries]. For the first time, schoolteachers were also required to sign the confession and to submit to the ‘discipline’ or articles of the Emden Synod. The idea of elders’ and deacons’ subscribing was not immediately accepted in all the churches. For example, at Delft the elders and deacons refused to sign the confession, while at Middelburg they did. Gaspar van der Heyden, pastor at Middelburg and president of the recent Dordrecht Synod, on 16 November 1574 wrote to Delft pastor Arent Cornelisz: ‘Our elders and deacons have signed the Confession of Faith and the articles of the [Emden] synod; I certainly wish that yours had done the same. How would they who now refuse to sign the Confession with ink seal it with their own blood?&#x27;”

— Netherlands, Donald Sinnema, “The Origin of the Form of Subscription in the Dutch Reformed Tradition” in Calvin Theological Journal (July 2007), p. 259">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CUp+to+this+time+%5B1573%5D%2C+the+prevailing+practice+was+that+only+ministers+signed+the+Belgic+Confession.+In+1574%2C+however%2C+the+provincial+Synod+of+Dordrecht+decided+that+%E2%80%98it+would+be+useful+that+the+elders+and+deacons+also+subscribe+to+the+Netherlands+Confession%2C+and+to+the+articles+of+the+%5BEmden%5D+Synod.%E2%80%99+For+this+purpose%2C+it+was+considered+advisable+that+a+copy+of+the+confession+and+of+the+articles+of+the+Emden+Synod+be+kept+by+all+consistories+%5Bsessions%5D+or+at+least+by+all+classes+%5Bpresbyteries%5D.+For+the+first+time%2C+schoolteachers+were+also+required+to+sign+the+confession+and+to+submit+to+the+%E2%80%98discipline%E2%80%99+or+articles+of+the+Emden+Synod.+The+idea+of+elders%E2%80%99+and+deacons%E2%80%99+subscribing+was+not+immediately+accepted+in+all+the+churches.+For+example%2C+at+Delft+the+elders+and+deacons+refused+to+sign+the+confession%2C+while+at+Middelburg+they+did.+Gaspar+van+der+Heyden%2C+pastor+at+Middelburg+and+president+of+the+recent+Dordrecht+Synod%2C+on+16+November+1574+wrote+to+Delft+pastor+Arent+Cornelisz%3A+%E2%80%98Our+elders+and+deacons+have+signed+the+Confession+of+Faith+and+the+articles+of+the+%5BEmden%5D+synod%3B+I+certainly+wish+that+yours+had+done+the+same.+How+would+they+who+now+refuse+to+sign+the+Confession+with+ink+seal+it+with+their+own+blood%3F%27%E2%80%9D%0A%0A%E2%80%94+Netherlands%2C+Donald+Sinnema%2C+%E2%80%9CThe+Origin+of+the+Form+of+Subscription+in+the+Dutch+Reformed+Tradition%E2%80%9D+in+Calvin+Theological+Journal+%28July+2007%29%2C+p.+259&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0b1f617f85.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0b1f617f85.html">Permalink</a><a class="src" href="https://reforme

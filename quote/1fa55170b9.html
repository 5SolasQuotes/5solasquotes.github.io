<main class="wrap"><figure class="quote" id="q-1fa55170b9" data-kw="">
<blockquote><p>Conservation, as it is here understood, is defined as the action by which a being from-another remains in the existence it has received. It is double, namely: a) Negative, or the action by which what can destroy the existence of the thing is removed or impeded. Penicillin, for example, which destroys bacteria, conserves the health of the body; b) Positive is the act that consists in the positive inflow by which a thing is continually given existence. Hence it is a sort of continued creation. Conclusion 24: All created things are positively conserved in existence by God. Whatever does not have in itself a reason for its existence positively requires, if it remains in existence, a cause of its remaining in existence. But there cannot be an infinite regress in conserving causes, because such causes need to exist simultaneously; therefore the thing is conserved positively by God as first cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), p. 104</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-633c5168f2" data-kw="">
<blockquote><p>Change, as we saw in chapter 1, is the actualization of potential. We have also seen that God is pure actuality, devoid of potentiality. Now, if He has no potential that needs to be, or indeed could be, actualized, then He cannot change. He is therefore immutable or changeless. To be sure, it might seem that He changes insofar as He creates the world. For doesn’t this involve a transition from God’s not creating it to his creating it? But as I have just argued, God’s being Creator of the world is a Cambridge property rather than a real property, and his becoming the world’s Creator is thus a mere Cambridge change. Just as, in our example, Socrates’ becoming shorter than Plato [when Plato grew taller] involved a real change only in Plato and not in Socrates, so too does God’s becoming Creator of the world involve a real change only in the world’s status, not in God. To say that God is immutable is to say that there is no real change in Him, though there may of course be Cambridge changes. … It might be objected that in creating the world, God acts, and that acting always involves a change in the one acting and not merely in the thing He acts upon… However, while it is true that the things of our experience happen to undergo changes themselves in the course of acting upon other things, it simply does not follow that absolutely anything that acts must necessarily undergo change itself as it does so. To draw such an inference would be to commit what is called a fallacy of accident. Such a fallacy would be committed, for example, if one were to conclude from the premise that every college professor who has ever lived has been under nine feet tall to the conclusion that any possible college professor must be under nine feet tall… As Brian Davies points out in responding to this sort of objection, what is essential to acting is the bringing about of an effect in another thing, rather than undergoing change oneself as one does so. For example, what is essential to teaching is that one causes someone else to learn, and not that one does so by lecturing, specifically, or by writing books, or what have you. Similarly, what is essential to creating is simply that God causes the world to exist. There is nothing in this that requires that it be done by virtue of the Creator’s undergoing change Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Proofs of the Existence of God</cite>, (Ignatius Press, 2017), ‘The Divine Attributes’, ‘Immutability’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>In his comprehensive series of disputations on creation that were originally held in 1638-1639, Voetius does not omit a discussion on how creation took place. In this context not much attention is given to the issue of the six days as such (although the work of creation is explained in its six days order), but Voetius maintains that creation took place in six days. He therefore rejects the ancient theory that the world was created at once (in instanti).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-7ddb942aa9" data-kw="">
<blockquote><p>‘I stand at the door and knock, if any will open.’ What then? ‘I will come in to him and sup with him and He with me’ (Rev. 3:20), as if He should say: ‘If any will listen to these motions of the Spirit, he will have the sweet work and the sweet consolations of the Spirit in him; the Spirit shall come in, shall cheer and refresh him.’ He that will make much of these sparks shall have a comfortable fire kindled, at which he shall warm and comfortably refresh himself. See how the cherishing of the motions of the Spirit keeps it from quenching and causes it to enflame and burn. But on the contrary, when a man neglects the knocks of the Spirit and does not yield obedience to them, opens not the door, that causes a sad quenching of the Spirit. See an example in Song of Solomon 5:2, ‘It is the voice of my Beloved that knocks, saying, ‘Open to me, my sister.” There are the motions of the Spirit of Christ. And she takes notice of them, therein she did right. It is the voice of my Beloved that knocks. But she failed in the second thing, she does not arise presently and open, but she shucks and shuffles (verse 3) and has her put-offs, ‘I have put off my coat, etc.’ Well, what is the issue [result]? Verse 5, she arose to open to her beloved after her heart smote her for not opening before, but it was too late, for verse 6. See, how for lack of obedience to the motions of the Spirit, she quenched the comforts and joy of the Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-dyke.html">Jeremiah Dyke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of Quenching &amp; Not Quenching of the Spirit’</cite>, (d. 1620; 1640; RBO, 2018), p. 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d11313ad37" data-kw="">
<blockquote><p>1. That this offer is real. Christ does not deceive, or dissemble with sinners, but really He does desire they should have liberty. Men sometimes make offers of good things to one another, but they are not sincere in them. But it is not so with Christ; He is a real well-wisher to sinners’ souls. He has expressed it all the ways that can be desired. Would you believe his reality, if He does woo sinners? Why, so He does, Lk. 14:23, compel them to come in, viz. by importunate entreaty. Would you believe his reality, if He does wait for sinners? Why, so He does, Rev. 3:20, ‘Behold I stand at the door, and knock, etc.’ Would you believe his reality if He does weep for sinners? Why, so He does, He wept over Jerusalem, Lk. 19:41-42. Would you believe his reality if He does die for sinners? Why, so He did, Rom. 5:8. While we were yet sinners, Christ died for us. Nay, would you believe his reality if he should be damned for sinners? Why, so He was, though not in respect of the place, yet in respect of the pains of Hell: He was ;’made a curse for us,’ Gal. 3:13. What would you have Christ to say or do more than He has said and done, to convince you, that He would have sinners to be partakers of this freedom. Has He not said so in his Word? Has He not sealed it with his blood? Has He not accepted and embraced from time to time, whoever came unto Him? Does He not engage Himself by his faithful promise, to do so still to the end of the world, that He will in no wise cast out such as come to Him, Jn. 6:37. And yet what a wonder is it, that the world is so unbelieving still? and so hard to be persuaded, that Christ has any loving thoughts or purposes towards them? Oh this cursed unbelief, and hardness of heart, that is in men and women that makes them that they will not come to Christ that they might have life!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-ball.html">Nathanael Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Bondage &amp; Freedom, or a Treatise containing the Substance of Several Sermons</cite>, … from John 8:36 (London: Robinson, 1683), pp. 36–38 Ball (1623–1681) was an English, partial conformist presbyterian minister.</span></figcaption>

</figure><figure class="quote" id="q-acf626ff03" data-kw="">
<blockquote><p>3. The wooings of Christ to gain your hearts: Consider Him bowing the heavens and coming down, and laying aside his robes of majesty, and putting on your filthy garments: Consider Him going about from place to place, on no other errand, but to gain your hearts and win your souls: And, whoever spake such effectual words as Christ spake when He was upon the earth? Who ever gave such precious jewels to a bride, as Christ gave to his spouse? Who ever put on such apparel as Christ did, when He wooed his Church?… Ah! poor Sinners, see your Jesus hanging on the cross, dropping out his last blood, breathing out his last breath, stretching out his dying arms to encircle sinners; and come, Oh come and throw yourselves into his bleeding arms! Away with all prejudicate opinions! Who shall say Christ is not willing to save him, and not blaspheme eternal love? Speak truth: Corrupt hearts speak truth; say not Christ is unwilling, but you are unwilling; ‘I would, but ye would not.’ [Mt. 23:37]

4. The weepings of Christ if He cannot prevail. Thus we find Him in the Gospel expressing Himself, not only in words, but in tears. And when He was come near Jerusalem, He beheld the city, and wept over it, Lk. 19:41… What? Christ to weep for you, over you? Methinks, if you had hearts of stone, it should melt your hearts.</p></blockquote>

</figure><figure class="quote" id="q-cfed485a96" data-kw="">
<blockquote><p>Christ is said To knock at the door (the outward call here spoken of) and if any admit Him, He will come in and sup with him, Rev. 3:20. So then you see, to be called to the graces and duties of the Gospel, is matter of great joy and comfort;… Oh then how great is the madness and folly of all recusants to this gracious offer!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, (1652; Ames, Iowa, 1990), Section 12, Sermon 108</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Christ is said To knock at the door (the outward call here spoken of) and if any admit Him, He will come in and sup with him, Rev. 3:20. So then you see, to be called to the graces and duties of the Gospel, is matter of great joy and comfort;… Oh then how great is the madness and folly of all recusants to this gracious offer!”

<blockquote><p>Sixthly, by his not only offering acquaintance with us upon these terms, by his ambassadors, his ministers, but by his coming personally by his Spirit to our several hearts, inviting and soliciting us to this acquaintance. According to that of our Lord Jesus Christ, ‘Behold I stand at the door and knock; if any man hear my voice, and open to Me, I will come in to him, and will sup with him, and he with Me.’ The Greeks and Romans of old were wont always to have their feasts at supper; therefore when it is said here, ‘I will come in to him, and sup with him,’ it is as if He had said, ‘I will come in to him and feast with him.’ And feasting together was of old a symbol of perfect reconciliation, and intimate friendship and acquaintance. Now, behold here the wonderful goodness and condescension of God, and his gracious disposition and inclination towards peace and acquaintance with his poor creatures… Behold therefore, I say, and admire the gracious disposition of God towards sinful man, and the great desire He has towards peace and renewed acquaintance with Him.</p></blockquote>

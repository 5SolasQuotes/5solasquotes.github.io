<main class="wrap"><figure class="quote" id="q-b9b0846c0a" data-kw="">
<blockquote><p>11. Are there more visible Churches than one?

The term CHURCH is sometimes applied to a particular congregation; [Acts 9:31] sometimes to a particular ecclesiastical judicatory; [Matthew 18:17] to several congregations united under one judicatory; [Acts 8:1] and by reason of the folly of man, there are distinct associations of professed Christians, more or less differing from one another; [1 Cor. 3:3] and, with reference to these, it may be said there are more Churches than one.

12. Do the scripture approve of the erection of distinct churches?

The scriptures recommended, for the more convenient edification of the saints, the erection of distinct congregations, and of distinct judicatories; [Acts 20:41] but it is the sin and loss of professed Christians to establish distinctions which destroy the unity of the visible church; [James 3:16] since, according to the institution of Christ, the CHURCH IS ONE among all nations. [Ephesians 4:3-4]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-mcleod.html">Alexander McLeod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The ecclesiastical catechism, being a series of questions relative to the Christian church stated and answered with the scripture proofs</cite>, (3rd edn, New York, 1831), pp 13-14.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-68a7082485" data-kw="">
<blockquote><p>3. And if communicants will be at the charge of maintaining a pastor whom they can better trust their souls with, than him whom the patron chooses for them, the orthodox or tolerating magistrate must see that he be not an heretic, that does more hurt than good; and must keep them under the laws of loyalty and peace, and see that they sow not sedition, and revile not others under pretense of worshipping God.

4. And no men should, without necessity, lose the advantages of a public ministry which the most consent to, and which has the magistrates countenance and maintenance; because gathering singular churches within parish-bounds, seems some accusation of the parish-minister or Church; and such Churches are oft tempted to envy and censoriousness, and are usually envied and censured by others: And unity is much of our strength and beauty. But in case of necessity it may be done.</p></blockquote>

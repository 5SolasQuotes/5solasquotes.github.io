<blockquote><p>§63. As for the Common Prayer itself, I never rejected it because it was a form, nor thought it simply unlawful because it was such a form, but have made use of it and would do again in the like case. But I must needs say: 1. That the shredding it into such abundance of small parcels seems to me very inconvenient. It seems too light and ludicrous to toss sentences so formally between the priest and clerk, and to make such a multitude of prayers consisting but of a sentence, or two at most: And it seems to be tautology and vain repetition to repeat over the same word so oft: and a taking of God’s name in vain, or too unreverently, to begin with his titles and attributes, and end with his name again, and the merits or sake of Christ, and this at almost every sentence: as if we had done with Him and were taking our leave, and had forgot somewhat that called us to begin again: and thus we begin and end, and begin and end again, it may be twenty times together. 2. But the enforcing imposition of these prayers is most to be condemned, of which I have spoken in the former disputation. But for my part, I censure none that use them, nor take them to be therefore men of another religion or worship: It is but a modal difference in the same worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, pp. 421-22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>That this confounding both of the titles and offices of bishop and presbyter [as synonymous], will be found agreeable to the most pure primitive times. It is true, within some few ages, difference was made between bishops and presbyters in the Church; yet was never that distinction counted by them to be jure divino, or by the Law of God; but as a thing belonging to order in the Church, and brought in by custom: which was, that he who was of greatest age and respect, and did preside in the meetings, was particularly called bishop, which afterward was established by some Councils… not only Jerome was of that mind with Aerius (whose opinion was that the bishop and the presbyter were equal and the same) but also, that Ambrosius, Augustinus, Sedulius, Primasius, Chrysostomus, Theoderetus, Oecumenius and Theophilactus were of that same mind… If it be asked, How this distinction [between presbyter and bishop] did enter? He [Jerome] answers in that epistle [to Evagrius]… that when afterward one came to be elected and preferred to the rest, it was done for the remedy of schism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lecture 3, ‘Concerning the Identity of Angel, Bishop &amp; Presbyter’ in A Commentary upon the Book of the Revelation</cite>, (Edinburgh, 1658), pp. 223-33, p. 225</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

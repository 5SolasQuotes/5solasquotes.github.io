<blockquote><p>Archibald Bruce (1746-1816) was pastor of… the Secession church… he was elected… to be Professor of Divinity for the General Associate Synod. Among the young men who sat under Bruce’s instruction… were Thomas M’Crie (Bruce’s successor in the chair), George Stevenson, Robert Shaw (who followed Bruce as pastor in Whitburn, and wrote a standard Scottish exposition of the Westminster Confession), and ‘Rabbi’ John Duncan.</p></blockquote>

<blockquote><p>2. Public peace in all the commandments of superiors, in so far as can be without sin, obliges the conscience, as Heb. 12:14, ‘Follow peace with all men and godliness;’ Ps. 34:14, ‘Seek peace and follow after it;’ Rom. 12:18.

3. Subjection to the censures of rulers by suffering patiently is an obligation lying upon all private persons, 1 Pet. 2:20, ‘But if when ye do well and suffer for it, ye take it patiently, this is acceptable to God;’ Rom. 13:2, ‘Whosoever therefore resisteth the power, resisteth the ordinance of God.’

4. Nothing in non-obeying unwarrantable commandments must be done that redounds to the discredit of the ruler or the hurting of his majesty and honor, 1 Pet. 2:17, ‘Honor the king;’ Eccl. 10:20, ‘Curse not the king: for even when we deny subjection or obedience-objective to that which they command, yet owe we obedience official, and all due respect and reverence to the person and eminent place of the ruler, as Acts 7:2, Steven calls them, Men, brethren and fathers, Acts. 7:51, and yet ‘stiffnecked resisters of the Holy Ghost.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, Ch. 2, Question 2, ‘Whether Human Laws Bind the Conscience or Not?’ in The Divine Right of Church Government… (1646), pp. 201-219</span></figcaption>

.com/on-positive-laws-ordinances/#:~:text=2.%20Public%20peace%20in%20all%20the,stiffnecked%20resisters%20of%20the%20Holy%20Ghost&amp;text=2.%20Public%20peace%20in%20all%20the%20commandments%20of&amp;text=and%20yet%20%E2%80%98stiffnecked%20resisters%20of%20the%20Holy%20Ghost" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>All human laws are, properly speaking, only declaratory.” – Edmund Burke . 2000’s Oderberg, David – “The Metaphysical Foundations of Natural Law” in ed. H. Zaborowski, Natural Law &amp; Contemporary Society (Catholic University of America Press, 2010) Odeberg is an analytical Thomist. Feser, Edward Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015)

13. ‘Being, the Good, and the Guise of the Good’ 297 Feser is a Romanist professor of philosophy and is an Analytical Thomist. Here he shows how morals derive from what exists, a la natural law.

14. ‘Classical Natural Law Theory, Property Rights &amp; Taxation’ 321 15. ‘Self-Ownership, Libertarianism, and Impartiality’ 357 16. In Defense of the Perverted Faculty Argument 378 Feser here argues against contraception, but lays a lot of groundwork in natural law before hand. To see that Feser is wrong about contraception, see Fentiman, ‘Using Contraceptives may be in Accord with Natural Law &amp; Scripture: a Response to Feser’ (RBO, 2025). VanDrunen, David ‘Natural Law in Reformed Theology: Historical Reflections a&amp; Biblical Suggestions’ (2012) 24 paragraphs Note: While we do not agree with VanDrunen’s conclusions on the modern ‘Reformed Two Kingdom’ (R2K) position, his work on natural law is a good introduction to the topic, with which the Westminster divines and puritans agreed. For something faithfully, historically reformed on the topic of how Christ’s two kingdoms (one by divine, natural right, the other as Mediator over the Church) relate, see our section on the Establishment Principle. ‘Why Protestant Christianity Needs a Theology of Natural Law’ (2019) at The Davenant Institute Feser, Edward – ch. 16, ‘In Defense of the Perverted Faculty Argument’ in Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015), pp. 378-415 Feser in this chapter (whatever one thinks about his view against contraception, which this chapter is in defense of) has an excellent summary exposition of natural law and how ethics derives from existence and the teleological designs therein. Haines, David – ‘The Role of Natural Knowledge in Biblical Interpretation as Key to Solving the Protestant Problem’ (2018) This is the rough draft of the author’s presentation at the Davenant Convivium in 2018. Abstract: “This, then, is the protestant problem: How can we “infallibly” determine which doctrines are necessary for a person to be considered orthodox if the only authority for Protestant theology is the Bible, as interpreted by the individual reader? I will argue that natural knowledge of man, God, and the universe is necessary for biblical interpretation, and is a key element in a well-rounded solution to the protestant problem.</p></blockquote>

<blockquote><p>Moral obligation can be created only by some intimation of the will of God. God alone can bind the conscience. The will of God can be made known to us only in one of two ways: either by the ‘light of nature’ or by revelation. The light of nature becomes manifest either through the constitution and consciousness of the individual man, or through those of the human race expressed in the ‘consensus populorum.’ [popular consensus] That which has been believed always and everywhere and by all is very apt to be true: and that which has been felt to be binding upon the conscience, with the same universality of times, places and persons, may be concluded to be of moral obligation. The voice of the people in this sense may be regarded as the voice of God. The moral sense may be undeveloped, or it may be perverted in its judgments by ignorance, prejudice, passion, and habits of wickedness; but where it has a fair opportunity to be heard, and especially upon questions upon which its judgments are opposed to the desires and appetites of man, sinful and selfish, it would seem to speak with the authority of man’s Maker and Ruler. It is conscience, the ‘categorical imperative,’ against what is voluntary in man. It is an authority which man feels cannot be resisted with impunity.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1028b83b72" data-kw="">
<blockquote><p>Hence we define the creation of the world as an external action of the almighty God… whereby… He founded the heavens and the earth out of nothing, at the beginning of time. And in the space of six days He arranged in their proper order all the individual things which He willed to mold from that prime matter…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-polyander.html">Johannes Polyander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of Pure Theology</cite>, (Brill, 2015), vol. 1, disputation 10, ‘Concerning the Creation of the World’, pp. 248-49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d3a467a7ba" data-kw="">
<blockquote><p>‘And the evening’ That is, thus the first day ended with creating the light, and God forbare to create any more, until that evening was past, and the next morning came. By the ‘evening’, we must here understand the whole night, or space between the shutting in of the light and the dawning of the next day. Now Moses names the evening first, because the darkness was before the light. In the same manner runs the computation of times among the Hebrews to this day… God is here represented to us in the creation of the world proceeding by leisure, and taking the time of six days to perform that which He might have as easily dispatched in a moment of time, if He had so been pleased.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-white.html">John White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, (d. 1648; London: Streater, 1656) | on Gen. 1 | on verse 5</span></figcaption>

</figure><figure class="quote" id="q-a198ed1450" data-kw="">
<blockquote><p>The creation of the world is an external, temporal, and universal action of God, by which He alone made and perfected the whole universe, by the power of His omnipotent will, in the space of six days; for His own glory, and the utility of creatures, especially intelligent ones, and the eternal salvation of the elect in heaven. … The adjunct of time is that God created the world in the space of six natural days, Gen. 2:3, Ex. 20:11. For although God could have created it in a moment, yet He willed to use these intervals: that He might more openly declare that the creation of the world was not made from eternity, but in time; and that He might render men more attentive in the particular meditation of distinct works, as appears especially from Ps. 104 &amp; 136.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epitome of Theological Common Places</cite>, (d. 1641; Amsterdam: Jansson, 1653), Locus 6, ‘On the Creation of the World’, trans. AI at Confessionally Reformed Theology</span></figcaption>

</figure><figure class="quote" id="q-1d83a2433e" data-kw="">
<blockquote><p>The stability of the earth is very useful to plants, beasts, and men, that abide thereon. The damages and mischiefs that fall out upon earthquakes give further proof hereof. It is a gross error of Aristarchus, Samius, Copernicus, and other philosophers, who imagine that the earth continually moveth, and that the heaven and the host thereof do but seem to our sight to move, as the banks and trees thereon do to such as are in a boat rowed with oars, or in a ship under sail. This conceit cannot stand with the metaphor of a foundation, here and in other places applied to the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, ch. 1, verse 10, section 131</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-5ab5a74df0" data-kw="">
<blockquote><p>XI. At what time of the year the world began, whether in spring or in autumn, the learned disagree:

      1. Gerardus Mercator thinks the world was created in summer time.

      2. Many fathers and scholastics contend that it was founded in spring, with whom agree; from the Jews, R. Joshua, and from the Reformed, Alsted, Polanus, Keckermann, and Braun.

      3. But the rest of the Jews commonly, and very many of the Orthodox, for example Voet, Maresius, Cocceius, Burmann, Turretin, Rijssen, Mastricht, etc., state that the world was founded in autumn; whose opinion we approve:

      1. Because the civil year of the Israelites, which was also that of the patriarchs, was begun in the month of Tishri, Ex. 23:16, where the feast of the collection of all fruits from the fields is commanded to be celebrated at the end of the year.

      2. Because in Ex. 34:22, the Feast of Tabernacles is commanded to be celebrated in the seventh month, at the revolution of the year, i.e., in the month of Tishri.

      3. Because the sabbatical and jubilee year of the Jews was celebrated in the month of Tishri, which corresponds to our September or October, Lev. 25:9.

      4. Because the Jews to this day celebrate ראש השנה (Rosh Hashanah) in the month of Tishri, and with it they begin the year, and they explode the different opinion of R. Joshua as singular.

      5. Because in Gen. 7:11, the flood is said to have occurred in the second month; which, however, was most probably done at that time of year which is suitable for inundations, so that the second month should be computed from the autumnal equinox.

      6. Because in autumn the fruits of the trees are ripe and the plants are heavy with seeds, to sustain the first parents and the animals.

      7. The Egyptians, Persians, Greeks and all the Orientals begin the year from September, which it is not to be doubted they received from tradition.

      8. Because in the Gemara, Avodah Zarah, ch. 1, it is handed down that Adam, immediately after creation was made, noticed that the days were declining and becoming shorter; which could not have happened except in the month of September. See Menasseh ben Israel, Problems, 9, Of Creation, also The Conciliator, quest. 11 in Exodus, p. 118. For the rest, just as the Jews begin the civil year in the month of Tishri, so they begin the sacred year in the month of Nisan.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), ch. 2, On Creation, pp. 22-23 trans. AI Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

sustain+the+first+parents+and+the+animals.+7.+The+Egyptians%2C+Persians%2C+Greeks+and+all+the+Orientals+begin+the+year+from+September%2C+which+it+is+not+to+be+doubted+they+received+from+tradition.+8.+Because+in+the+Gemara%2C+Avodah+Zarah%2C+ch.+1%2C+it+is+handed+down+that+Adam%2C+immediately+after+creation+was+made%2C+noticed+that+the+days+were+declining+and+becoming+shorter%3B+which+could+not+have+happened+except+in+the+month+of+September.+See+Menasseh+ben+Israel%2C+Problems%2C+9%2C+Of+Creation%2C+also+The+Conciliator%2C+quest.+11+in+Exodus%2C+p.+118.+For+the+rest%2C+just+as+the+Jews+begin+the+civil+year+in+the+month+of+Tishri%2C+so+they+begin+the+sacred+year+in+the+month+of+Nisan.%E2%80%9D%0A%0A%E2%80%94+Barthold+Holtzfus%2C+%E2%80%98Theological+Dissertation+on+Creation%E2%80%99%2C+%28Frankfurt%3A+Steppinus%2C+1706%29%2C+ch.+2%2C+On+Creation%2C+pp.+22-23+trans.+AI+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5ab5a74df0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5ab5a74df0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-how-long-god-took-in-creating/#:~:text=XI.%20At%20what%20time%20of%20the,year%20in%20the%20month%20of%20Nisan&amp;text=XI.%20At%20what%20time%20of%20the%20year%20the&amp;text=the%20sacred%20year%20in%20the%20month%20of%20Nisan" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>XIX… I. The moral precepts are known by nature, and therefore eternal, and obligate all men: The rest are not so. II. The moral precepts are the principal worship of God; the ceremonial and forensic are subordinate, but serve the moral precepts, and therefore yield to them.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-56d954c30d" data-kw="">
<blockquote><p>Heaven-work and heart-work are the chiefest parts of Christian duty. Christ often gives us his summaries of the Law and inculcates his great Command; Jn. 13:35; Mt. 22:37-39; Lk. 10:27. And so does the apostle, Rom. 13:10; 1 Pet. 1:22; 1 Jn. 3:11, 14, 23 &amp; 4:7, 11-12, 20; 2 Jn. 5. And the fruits of the Spirit are manifest, Gal. 5:22-23. James says that pure religion and undefiled before God, even the Father, is this, to visit the fatherless and widows in adversity and to keep ourselves unspotted of the world, James 1:27. Paul says, 1 Tim. 1:5, ‘The end of the commandment is charity out of a pure heart, and of a good conscience and of faith unfeigned:’ And then adds, ‘From which some having swerved, have turned aside to vain janglings’— In a word: The effectual belief of pardon and eternal glory given through Christ, and the love of God and man, with the denial of ourselves, and fleshly desires, and contempt of all things in the world, which are competitors with God and our salvation, with a humble patient enduring of all which must be suffered for these ends, is the nature and sum of the Christian religion. Do nothing therefore as a duty which is a hinderance to any of this. Contentious preachings and factious sidings which weaken love are not of God. The servant of the Lord must not strive, but be gentle to all men, 2 Tim. 2:24… It is one of the most important things in the world for the resolving of a thousand cases of conscience and the directing of a Christian life to know which duties are the greater and which are the lesser, and so which is to be preferred in competition; For that which is a duty at another time is a sin when it is done instead of a greater! as Christ has resolved in the case of the Sabbath. If good must be loved as good, then the greatest good must be most loved and sought. Sacrifice instead of mercy is a sin: Our gift must be left at the altar while we go to be reconciled to our brother. Mt. 5. Never hearken to those men who would set up their controverted duties or any positives and lesser things against the duties of nature itself or the great substantial parts of godliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1, Direction 39, ‘Know which are the great duties of a Christian life, and wherein the nature of true Religion does consist; and then pretend not any lesser duty against those greater, though the least when it is indeed a duty, is not to be denied or neglected’</cite>, pp. 209-10</span></figcaption>

</figure><figure class="quote" id="q-dd57494962" data-kw="">

</figure><figure class="quote" id="q-d75588582f" data-kw="">
<blockquote><p>Worship is as large as the Commandment, nay as the whole Word of God. For so it is ordinarily defined, a work commanded, done in faith, and then it must needs extend itself as far as the Commandment. And if to obey God in conscience of his Commandment, in all actions, civil and sacred, of piety, justice or mercy, be to worship Him, then to believe whatsoever the Lord has taught, relying upon the truth and credit of the Revealer, is worship also. And hence it is, that the worship of God is usually divided into immediate and mediate worship: which comprehends all duties which we owe to God or Man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Two Treatises of Mr. John Can, the Leader of the English Brownists in Amsterdam… (London: R.B., 1642), ch. 1, section 4</cite>, p. 48</span></figcaption>

<blockquote><p>‘It’s not always easy to identify a cult,’ Jenkinson says, explaining that there isn’t one type of person that joins a cult, they don’t dress a certain way and they can operate from ‘ordinary’ houses. The Family Survival Trust… defines a cult as a system controlled by a charismatic and authoritarian leadership that is ‘rigidly bounded’ and supported by a fixed set of beliefs. It involves brainwashing designed to isolate, control and exploit followers. Cults do not have to be religious. Linguist Amanda Montell, author of Cultish: The Language of Fanaticism, explains people can ‘erect a cult around anything, as long as you can inject it with fear and an ‘us-versus-them’ mentality’. … While cults can be hard to spot, Jenkinson and Montell note some ‘red flags’ people can look for: – One possible indicator Jenkinson highlights is ‘love bombing,’ a manipulation tactic that sees abusers use affection and declarations of love as a way of gaining power and control. – Another common theme is promising ‘answers to life’s very complex problems’… – Montell says the combination of mantras, buzzwords and nicknames for insiders and outsiders of the group, as well as language that elicits a strong reaction while encouraging us not to ask further questions, can be indicators. – The linguist adds that certain texts being ‘off-limits’ in the group can also be a warning sign. – The most ‘extreme’ trait of a cult for Montell is a ‘high barrier to exit’, meaning group members being made to feel they might lose their identity or friendships, or fear retaliation, if they leave the group.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/shola-lee.html">Shola Lee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>”You’re sold a lie’: How do you spot a cult’ (2025) at BBC.com</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“‘It’s not always easy to identify a cult,’ Jenkinson says, explaining that there isn’t one type of person that joins a cult, they don’t dress a certain way and they can operate from ‘ordinary’ houses. The Family Survival Trust… defines a cult as a system controlled by a charismatic and authoritarian leadership that is ‘rigidly bounded’ and supported by a fixed set of beliefs. It involves brainwashing designed to isolate, control and exploit followers. Cults do not have to be religious. Linguist Amanda Montell, author of Cultish: The Language of Fanaticism, explains people can ‘erect a cult around anything, as long as you can inject it with fear and an ‘us-versus-them’ mentality’. … While cults can be hard to spot, Jenkinson and Montell note some ‘red flags’ people can look for: – One possible indicator Jenkinson highlights is ‘love bombing,’ a manipulation tactic that sees abusers use affection and declarations of love as a way of gaining power and control. – Another common theme is promising ‘answers to life’s very complex problems’… – Montell says the combination of mantras, buzzwords and nicknames for insiders and outsiders of the group, as well as language that elicits a strong reaction while encouraging us not to ask further questions, can be indicators. – The linguist adds that certain texts being ‘off-limits’ in the group can also be a warning sign. – The most ‘extreme’ trait of a cult for Montell is a ‘high barrier to exit’, meaning group members being made to feel they might lose their identity or friendships, or fear retaliation, if they leave the group.”

— Shola Lee, ”You’re sold a lie’: How do you spot a cult’ (2025) at BBC.com">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98It%E2%80%99s+not+always+easy+to+identify+a+cult%2C%E2%80%99+Jenkinson+says%2C+explaining+that+there+isn%E2%80%99t+one+type+of+person+that+joins+a+cult%2C+they+don%E2%80%99t+dress+a+certain+way+and+they+can+operate+from+%E2%80%98ordinary%E2%80%99+houses.+The+Family+Survival+Trust%E2%80%A6+defines+a+cult+as+a+system+controlled+by+a+charismatic+and+authoritarian+leadership+that+is+%E2%80%98rigidly+bounded%E2%80%99+and+supported+by+a+fixed+set+of+beliefs.+It+involves+brainwashing+designed+to+isolate%2C+control+and+exploit+followers.+Cults+do+not+have+to+be+religious.+Linguist+Amanda+Montell%2C+author+of+Cultish%3A+The+Language+of+Fanaticism%2C+explains+people+can+%E2%80%98erect+a+cult+around+anything%2C+as+long+as+you+can+inject+it+with+fear+and+an+%E2%80%98us-versus-them%E2%80%99+mentality%E2%80%99.+%E2%80%A6+While+cults+can+be+hard+to+spot%2C+Jenkinson+and+Montell+note+some+%E2%80%98red+flags%E2%80%99+people+can+look+for%3A+%E2%80%93+One+possible+indicator+Jenkinson+highlights+is+%E2%80%98love+bombing%2C%E2%80%99+a+manipulation+tactic+that+sees+abusers+use+affection+and+declarations+of+love+as+a+way+of+gaining+power+and+control.+%E2%80%93+Another+common+theme+is+promising+%E2%80%98answers+to+life%E2%80%99s+very+complex+problems%E2%80%99%E2%80%A6+%E2%80%93+Montell+says+the+combination+of+mantras%2C+buzzwords+and+nicknames+for+insiders+and+outsiders+of+the+group%2C+as+well+as+language+that+elicits+a+strong+reaction+while+encouraging+us+not+to+ask+further+questions%2C+can+be+indicators.+%E2%80%93+The+linguist+adds+that+certain+texts+being+%E2%80%98off-limits%E2%80%99+in+the+group+can+also+be+a+warning+sign.+%E2%80%93+The+most+%E2%80%98extreme%E2%80%99+trait+of+a+cult+for+Montell+is+a+%E2%80%98high+barrier+to+exit%E2%80%99%2C+meaning+group+members+being+made+to+feel+they+might+lose+their+identity+or+friendships%2

<main class="wrap"><figure class="quote" id="q-2e5f9deb53" data-kw="">
<blockquote><p>For if it be a great Crime, and almost an Impiety not to live under and suffer patiently the Humours and harsh Usage of our Natural Parents; ’tis sure a much greater, not to endure those of our Country, which wise Men have unanimously preferred to their Parents. …

But a Man may sometimes say, My Country is grown mad or foolish, (as Plato said of his) sometimes that it rages and cruelly tears out its own Bowels.—We are to take care in the first Place, that we do not ascribe other Folks Faults to our innocent Country. There have been may cruel Tyrants in Rome and in other Places; these not only tormented innocent good Men, but even the best deserving Citizens, with all manner of Severities: Does it therefore follow, that the Madness of these Tyrants must be imputed to their Country?

The Cruelty of the Emperor Macrinus is particularly memorable; who as Julius Capitolinus writes, was nicknamed Macellinus, because his House was stained with the Blood of Men, as a Shambles is with that of Beasts. Many such others are mentioned by Historians, who for the like Cruelty (as the same Capitolinus tells us) were styled, one Cyclops, another Busiris, a 3d Sciron, a 4th Tryphon, a 5th Gyges. These were firmly persuaded, that Kingdoms and Empires could not be secured without Cruelty: Would it be therefore reasonable, that good Patriots should lay aside all Care and Solicitude for their Country? Certainly they ought rather to succour her, when like a miserable oppressed Mother, she implores her Children’s Help, and to seek all proper Remedies for the Mischiefs that afflict her.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-hotman.html">Francis Hotman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Franco-Gallia: Or An Account of the Ancient Free State of France, and most other parts of Europe, before the loss of their Liberties</cite>, trans. Robert Molesworth (1574; 2nd edn, London: Edward Valentine, 1721), pp 9, 10.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8aa66f0cd8" data-kw="">
<blockquote><p>Among many evil, &amp; naughty affections which follow the nature of man, corrupted by sin (right honourable and beloved in Christ) few or none bring greater inconveniences with them, then doth the inordinate hope and expectation of long life. And this affection is so much the more hurtful and perilous, for that it is grounded so deeply, and sticketh so firmly in our nature, that it cannot easily be remedied or removed: which thing, beside common experience, hath of old time been noted, by divers and sundry proverbs, as this for one. Nemo est tam senex, qui non putet annum se posse viuere. There is no man so old, but that be thinketh he may live yet one year longer, and when that is done, yet an other, and an other yet after that, and so in infinitum, until all years &amp; days be clean past and expired.

The like hope of long life is expressed by this proverb, Aegroto anima dum est, spes est. The sick man, as long as he hath life &amp; breath, so long hath he hope: signifying that even in the greatest &amp; most dangerous diseases, the sick parties ever hope to live, and to escape, so that neither old age, which by natural course foresheweth death at hand, neither yet extremity of sickness, be it never so grievous, can remove from us this inordinate expectation, and vain hope of long life, so long as this body hath any breath abiding or life left in it.

Out of this evil root spring many branches of great inconveniences: For when men be in expectation of long life, and promise unto them selves continuance of many years: they fall by little and little into carnal security, they grow remiss in all godly exercises, delight altogether in pleasures of this world, little or nothing thinking of the world to come, or of any amendment or correction of life, but deferring it to a longer time, and so often times prevented with unlooked for death, &amp; found a sleep in their wicked security, they tumble headlong or they beware, into the pit of damnation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-grindal.html">Edmund Grindal</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon, at the funeral solemnity of the most high and mighty Prince Ferdinandus, the late Emperor of most famous memory holden in the Cathedral Church of saint Paul in London, the third of October, 1564</cite>, (London, 1564), unpaginated.</span></figcaption>

</figure><figure class="quote" id="q-57e3ee3491" data-kw="">
<blockquote><p>The laws then which the Church in proper speech is said to make, are decrees concerning outward order and comeliness in the administration of the Word and sacraments, in the meetings of the congregation, etc. and such laws made according to the general rules of God’s Word (which require that all things be done to edification, in comeliness, for the avoiding of offence) are necessary to be observed, and the Word of God binds all men to them so far forth as the keeping of them maintains decent order, and prevents open offence. Yet if a law concerning some external rite or thing indifferent, be at some time upon some occasion omitted no offence given, not contempt showed to ecclesiastical authority, there is no breach made in the conscience: and that appears by the example before handled. The apostles guided by the Holy Ghost made a decree for the avoiding of offence necessary to be observed, namely that the Gentiles should abstain from strangled [animals] and blood and idolythites, and yet Paul out of the case of scandal and contempt, permits the Corinthians to do otherwise, 1 Cor. 8 &amp; 9, which he would not have done, if to do otherwise out of the case of scandal and contempt had been sin</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Conscience</cite>, (1596), pp. 67-68</span></figcaption>

noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Christ the King engenders in his elect zeal for reconciling themselves to God: first of all by showing that all men are under sin, and in the kingdom darkness, especially because since all men have the knowledge of God naturally engrafted in them and the work of the law by nature written in their hearts, and by the things created are constrained to know God, but nevertheless do not glorify him, but do sin contrary to the law of nature (Rom. 1) The thing which they witness in their deeds, and their own conscience convinces their thoughts, either accusing or excusing them. Again by encountering all and every of their wickednesses, and in accusing them by the law written, and by the threatenings which are manifest everywhere throughout the whole prophets, many wickednesses also being heaped together as plainly may be seen in the Epistle to the Romans Chapter 3 v. 9-14. And also by showing that this is the unchangeable will of God, whereby he will not only that all men be conformed to the law of nature, but also to the law written, otherwise that he will so long account them for sinners and enemies till they be converted, and through faith be reconciled unto God.</p></blockquote>

— Caspar Olevianus, An Exposition of the Apostles’ Creed, (1576)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CChrist+the+King+engenders+in+his+elect+zeal+for+reconciling+themselves+to+God%3A+first+of+all+by+showing+that+all+men+are+under+sin%2C+and+in+the+kingdom+darkness%2C+especially+because+since+all+men+have+the+knowledge+of+God+naturally+engrafted+in+them+and+the+work+of+the+law+by+nature+written+in+their+hearts%2C+and+by+the+things+created+are+constrained+to+know+God%2C+but+nevertheless+do+not+glorify+him%2C+but+do+sin+contrary+to+the+law+of+nature+%28Rom.+1%29+The+thing+which+they+witness+in+their+deeds%2C+and+their+own+conscience+convinces+their+thoughts%2C+either+accusing+or+excusing+them.+Again+by+encountering+all+and+every+of+their+wickednesses%2C+and+in+accusing+them+by+the+law+written%2C+and+by+the+threatenings+which+are+manifest+everywhere+throughout+the+whole+prophets%2C+many+wickednesses+also+being+heaped+together+as+plainly+may+be+seen+in+the+Epistle+to+the+Romans+Chapter+3+v.+9-14.+And+also+by+showing+that+this+is+the+unchangeable+will+of+God%2C+whereby+he+will+not+only+that+all+men+be+conformed+to+the+law+of+nature%2C+but+also+to+the+law+written%2C+otherwise+that+he+will+so+long+account+them+for+sinners+and+enemies+till+they+be+converted%2C+and+through+faith+be+reconciled+unto+God.%E2%80%9D%0A%0A%E2%80%94+Caspar+Olevianus%2C+An+Exposition+of+the+Apostles%E2%80%99+Creed%2C+%281576%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F945f86a6e2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/945f86a6e2.html">Permalink</a><a class="src" href="https://heidelblog.net/2009/05/caspar-olevianus-on-the-law-of-nature/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>…about a law there are these affections (if I may call them so): There is an interpretation, a dispensation, or relaxation; and these differ from an abrogation. For the former do suppose the law still standing in force, though mitigated; but Abrogation is then properly, when a Law is totally taken away. And this abrogation arises sometimes from the express constitution at first, which did limit and prescribe the time of the law’s continuance: sometimes by an express revoking and repealing of it by that authority which made it, sometimes by adding to that repeal an express law commanding the contrary. Now it may be easily proved that the Ceremonial and Judicial laws, they are abrogated by express repeal. The Judicial Law: 1 Pet. 2:13, where they are commanded to be subject to every ordination of man: and this was long foretold Gen. 49:10. The Lawgiver shall be taken from Judah. The Ceremonial Law that is also expressly repealed Acts 15 and in other places… In the second place, if we would speak exactly and properly, we cannot say, in any good sense, that the Moral Law is abrogated at all.</p></blockquote>

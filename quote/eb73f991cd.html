<main class="wrap"><figure class="quote" id="q-eb73f991cd" data-kw="">
<blockquote><p>Finally, this rule prevails: in this hypostatic union, the natures themselves remain distinct, and each does distinctly what is proper to itself; accordingly the Word [o logos] is distinctly that which is Word [logos], and it does distinctly that which belongs to the Word [o logos]. Just so, flesh remains also distinctly that which is flesh, and accomplishes that which distinctly belongs to flesh. Hence to make a long story short: just as we can say there are two distinct essences [ousiai], not separate, but nevertheless distinct in number, so there are also two wills and operative functions [energiai], and two operations [energemata] but one end purpose [apotelesma], just as the person is one only.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: the Classic Debate at the Colloquy of Montbeliard</cite>, 1586, ed. Jeffrey Mallinson &amp; trans. Clinton J. Armstrong (Concordia Publishing House, 2017), ‘On the Person of Christ’, Dr. Beza’s Responses to the Theses, p. 248</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-37629f4e18" data-kw="">
<blockquote><p>Objection 2: Further, hypostasis is nothing more than a ‘particular substance,’ as Boethius says (De Duab. Nat.). But it is plain that in Christ there is another particular substance beyond the hypostasis of the Word, viz. the body and the soul and the resultant of these. Therefore there is another hypostasis in Him besides the hypostasis of the Word. … Reply to Objection 2: Hypostasis signifies a particular substance, not in every way, but as it is in its complement. Yet as it is in union with something more complete, it is not said to be a hypostasis, as a hand or a foot [is, as joined to a person’s body]. So likewise the human nature in Christ, although it is a particular substance, nevertheless cannot be called a hypostasis or suppositum, seeing that it is in union with a completed thing, viz. the whole Christ, as He is God and man. But the complete being with which it concurs is said to be a hypostasis or suppositum.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 3</cite>, question 2, ‘Of the Mode of Union of the Word Incarnate’ | article 3, ‘Whether the union of the Word Incarnate took place in the suppositum or hypostasis?’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

p;text=is%20said%20to%20be%20a%20hypostasis%20or%20suppositum" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e5278482a5" data-kw="Mediator">
<blockquote><p>That the saints are nearer unto Christ than angels are, as I told you before; he is so a head to men as he is not to them. Both their union and ours with God is by Christ; now, if we be more united to Christ than they are, then we are more nearly united to God too; more nearly united to Christ we are, for he is our brother, he hath our nature, he hath more of ours, he hath done more for us; we are sons by adoption in him, he is our husband. To which of all the angels was it said that Christ is their husband? Of which of all the angels is it said that Christ is their Saviour?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the First Chapter of Ephesians</cite>, Works, vol. 1, Sermon X (Eph. 1:10), Obs. 3</span></figcaption>

</figure><figure class="quote" id="q-9f4b7ef13b" data-kw="">
<blockquote><p>We therefore reject the deifications of the Enthusiasts, the spirit and eternal uncreated Word, etc. For by these they subvert the nature of God and of man, and the operations of both. Which abominations, arising from the confusion of God with His work, of substance with accident, of the Holy Spirit with the Word, of man sanctified by God with the Sanctifier Himself and His divine holiness, we detect elsewhere.</p></blockquote>

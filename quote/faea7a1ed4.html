<main class="wrap"><figure class="quote" id="q-faea7a1ed4" data-kw="">
<blockquote><p>Seeing we have affirmed that we attain a twofold righteousness by faith: [1] a righteousness inherent in us, as charity and that grace whereby we are made partakers of the divine nature, and [2] the justice of Christ given and imputed unto us, as being grafted into Christ and having put on Christ: it remains that we enquire upon which of these we must stay and rely, and by which we must think ourselves justified before God, that is, to be accepted as holy and just, having that justice which it beseems the sons of God to have. I truly think, that a man very piously and Christianly may say that we ought to stay, to stay I say, as upon a firm and stable thing, able undoubtedly to sustain us, upon the justice of Christ given and imputed to us, and not upon the holiness and grace that is inherent in us. For this our righteousness is but imperfect, and such as cannot defend us, seeing in many things we offend all, etc. But the justice of Christ which is given unto us, is true and perfect justice, which altogether pleases the eyes of God, and in which there is nothing that offends God. Upon this therefore as most certain and stable, we must stay ourselves, and believe that we are justified by it, as the cause of our acceptation with God: this is that precious treasure of Christians which whosoever finds, sells all that he has to buy it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gasparo-contarini.html">Gasparo Contarini</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as given in Richard Field, Of the Church</cite>, (Oxford, 1628), bk. 3, appendix, pp. 292-93</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4041cf2e7b" data-kw="">
<blockquote><p>4. We are justified by works, and not by faith only; by which are meant the fruits of sanctification: for true faith and true holiness will show itself by good works; faith gives us the first right, but works continue it, for otherwise a course of sin would put us into a state of damnation again: therefore at the Last Judgment these are considered, Rev. 20:12, ‘And the dead were judged out of those things which were written in the books, according to their works.’ Mt. 25:35-36: ‘For I was an hungry, and ye gave me meat; I was thirsty, and ye gave me drink; I was a stranger, and ye took me in; naked, and ye cloathed me; I was sick, and ye visited me; I was in prison, and ye came unto me.’ Faith is our consent, but obedience verifies it, or is our performance of what we consented unto; the one as covenant-making, the other as covenant-keeping; we are admitted by covenant-making, but continued in our privileges by covenant-keeping, Ps. 25:10, ‘All the paths of the Lord are mercy and truth unto such as keep his Covenant.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton</cite>, … (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33, p. 336</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-24b7213a9e" data-kw="">
<blockquote><p>Ye have heard, dearly beloved, that true faith is the justification of the church or faithful of God; that it is, I say, the forgiveness of all sins, a receiving into the grace of God, a taking by adoption into the number of the sons of God, an assured and blessed sanctification [beatificationem],¹ and finally, the well-spring of all good works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Decades</cite>, (Cambridge: Parker Society, 1849), vol. 1, 1st Decade, Sermon 6, p. 121</span></figcaption>

</figure><figure class="quote" id="q-ac48967e05" data-kw="">
<blockquote><p>‘Which believe in Him that raised up Jesus our Lord from the dead, who was delivered for our sins, and is risen again for our justification.’ …But here arises a doubt, by what means the apostle may seem to seioine and to put asunder these things one from the other: namely, the forgiveness of sin, and justification: and one the other side, the faith of the death, from the faith of the resurrection, when as it seems that by the faith of each part, of his death (I say) and of his resurrection is given not only remission of sins but also justification. … …wherefore there are yet behind two other very likely interpretations: Of which the first is, that in very deed, by the death of Christ was paid the price of our redemption. But, that it might be applied unto us, there needs the Holy Ghost, to move us to believe, and Christ to give unto us this Holy Ghost, rose again from death, sent abroad his apostles to preach into all parts of the world, and now also before the Father, executes the office of an intercessor and high priest: therefore is He said to have risen again to help us that we might obtain justification. Chrysostom seems to lean unto this sentence. The second exposition [as pertaining to inherent righteousness] is that the faith of the death and of the resurrection brings justification: but Paul seioyned them aptly to declare the analogy and proportion between them. Unto the death of Christ answers very well the forgiveness of sins, for by reason of them, death was due unto us. And as Christ, as touching this corruptible life, died, so also ought we, when we are justified to die unto sin. Again because justification seems herein to be declared in that we begin a new life, therefore is it referred unto the resurrection of Christ: for that he then seemed to have begun a celestial and happy life. Paul used in a maner the self-same form of words in this same epistle, when he says [Rom. 10]: ‘with the heart we believe unto righteousness: and with the mouth is confession made to salvation.’ For the faith of the heart both works righteousness and also brings salvation: but because salvation and instauration are chiefly declared in action, therefore he ascribed it to confession. But whither of these expositions is the truer, neither will I contend, nor also now declare. Of those things which have now been spoken, we gather a most sweet consolation: for thereby we do not only know the weight of sin, but also we understand that God bare a singular good love towards us: as one which gave his only begotten Son, and that unto the death to deliver us from sins. Farther, seeing Christ is said to have risen from the dead for our justification, we easily see that we are by Him called back to a new life: unto which yet we cannot aspire, except we be of Him elected.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Most Learned &amp; Fruitful Commentary upon the Epistle of St. Paul to the Romans</cite>, ... (d. 1562; London: 1568), on ch. 4, verse 25, p. 97</span></figcaption>

ms+herein+to+be+declared+in+that+we+begin+a+new+life%2C+therefore+is+it+referred+unto+the+resurrection+of+Christ%3A+for+that+he+then+seemed+to+have+begun+a+celestial+and+happy+life.+Paul+used+in+a+maner+the+self-same+form+of+words+in+this+same+epistle%2C+when+he+says+%5BRom.+10%5D%3A+%E2%80%98with+the+heart+we+believe+unto+righteousness%3A+and+with+the+mouth+is+confession+made+to+salvation.%E2%80%99+For+the+faith+of+the+heart+both+works+righteousness+and+also+brings+salvation%3A+but+because+salvation+and+instauration+are+chiefly+declared+in+action%2C+therefore+he+ascribed+it+to+confession.+But+whither+of+these+expositions+is+the+truer%2C+neither+will+I+contend%2C+nor+also+now+declare.+Of+those+things+which+have+now+been+spoken%2C+we+gather+a+most+sweet+consolation%3A+for+thereby+we+do+not+only+know+the+weight+of+sin%2C+but+also+we+understand+that+God+bare+a+singular+good+love+towards+us%3A+as+one+which+gave+his+only+begotten+Son%2C+and+that+unto+the+death+to+deliver+us+from+sins.+Farther%2C+seeing+Christ+is+said+to+have+risen+from+the+dead+for+our+justification%2C+we+easily+see+that+we+are+by+Him+called+back+to+a+new+life%3A+unto+which+yet+we+cannot+aspire%2C+except+we+be+of+Him+elected.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+A+Most+Learned+%26+Fruitful+Commentary+upon+the+Epistle+of+St.+Paul+to+the+Romans...+%28d.+1562%3B+London%3A+1568%29%2C+on+ch.+4%2C+verse+25%2C+p.+97&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fac48967e05.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ac48967e05.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=Which%20believe%20in%20Him%20that%20raised,except%20we%20be%20of%20Him%20elected&amp;text=Which%20believe%20in%20Him%20that%20raised%20up%20Jesus&amp;text=cannot%20aspire%2C%20except%20we%20be%20of%20Him%20elected" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But believers sin greatly after they are in a justified state, and so stand in need of renewed pardon, from time to time. That believers sin after they are in a justified state, sad experience, as well as God’s Word, does daily show; but the sins of those who are in a justified state come under another consideration, for their “persons are not under the law,” (or legal covenant) Rom. 6:14. They are in Christ, who is “the end of the law for righteousness, to every one that believeth,” Rom. 10:4. So that as believers have nothing to do with the law, so as to seek justification for their persons, by their obedience to the same; neither can the law, with its condemning power, reach them, so as to bring them into legal condemnation again: so that unless the covenant of grace be made void, the believer’s justified state remains, and he is no more under the law forever. … But if the saints are not under the law, or legal covenant, then it should seem from thence that they need no pardon of sin, and so ought not in their daily prayers to pray for the same: so where there is no law there is no transgression. Though believers are not under the law, or legal covenant, yet it does not from thence follow that they stand in no need of daily pardon. Indeed, they stand not in need of such pardon as unbelievers stand in need of, they are under a legal condemnation, obnoxious to the curse, and stand in need of a change of their state, God being to them a God of terror. But if at any time they are, through grace, brought savingly to believe in Christ, then God, as a God of all grace, freely justifies them, by remitting of their sins, and imputing of Christ’s righteousness for their justification, and properly this is Scripture justification, Rom. 4:6, 8. But believers standing in relation to God, as children to a tender-hearted Father, this alters the case quite, and shows a vast difference between the state of the one and of the other, the believer being “justified from all things,” Acts 13:39, and the unbeliever being “condemned already,” John 3:18. Now though God deal as a Judge with those that continue in their unbelief, yet He deals as a tender-hearted Father with all true believers. “Like as a father pitieth his children, so the Lord pitieth them that fear him: yea, he remembereth that we are dust,” Ps. 103:13-14. Now when the saints sin against a loving Father, then does God come forth with his fatherly corrections: “Then will I visit their transgressions with the rod, and their iniquity with stripes,” Ps. 89:32. And sometimes in a very sore manner; “Behold thou art wroth, for we have sinned,” Isa. 64:5. Indeed the sins of the saints shall not make void God’s covenant, therefore the prophet comes in the next words, saying, In those, that is, in thy mercies, is continuance, and we shall be saved; yet they highly provoke a tender-hearted Father by sinning against Him; and as often as the saints sin against their heavenly Father, in this their new covenant relation, so oft they stand in need of fatherly forgiveness. Thus with holy David, who had sinned in the matter of Uriah, yet when brought to confess the same, “Nathan said unto David, The Lord hath put away thy sin, thou shalt not die,” 2 Sam. 12:13; for by God’s law adulterers ought to be put to death, Lev. 20:10. Now God remitting this temporal chastisement to David, is said to pardon, or put away his sin: and the Church cried out, Lam. 3:42, “We have transgressed and rebelled, thou hast not pardoned;” that is, their afflictions were not removed. And in this sense God oft lets sin lie on his otherwise justified children for some time unpardoned, and as often as He is pleased to remit these chastisements, so often He may be said to pardon his children; and as long as the saints sin against their God and Father in their new covenant relation, so long shall we need renewed pardon, which will be whilst we are in this world. And this should keep the saints at the throne of grace, daily begging of pardon, confessing of sin, bewailing of corrupt nature, and entreating a farther discovery of their covenant state. Now in this respect, the saints daily need pardon of sin, and a more full discovery of their new covenant relation with God; so that it is not true in every respect, you see, to say all pardon is at once: but with respect to the justifying of our persons, in a proper sense, justification is but one constant, complete act of grace, admitting of no degrees, nor revocation, but remains firm for ever. But if God correct his justified children for their sins, does it not dishonour the cross of Christ? That God does correct his saints here for their sins, and not only from them, as some would have it, is most plain from the New, as well as from the Old Testament… So that though God does not, as a judge, take vengeance on his justified children for their sins, yet as a loving Father He assuredly corrects them when they go astray. And certainly there can be no good argument drawn from the perfection of Christ’s satisfaction, to exempt believers from fatherly corrections here for their going astray. Nay, holy David looks on God’s corrective dispensations, as his keeping of covenant with him: “I know, O Lord, thy judgments are right (that is, thy corrections) and that them in faithfulness hast afflicted me,” Ps. 119:75.</p></blockquote>

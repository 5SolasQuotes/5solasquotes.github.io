<main class="wrap"><figure class="quote" id="q-e72948fb97" data-kw="">
<blockquote><p>Lastly, justification by works causes trouble and disquietness to the conscience. No man’s conscience can be appeased before God’s wrath is appeased, and God’s wrath cannot be appeased by any works. For the best works the regenerate can do are imperfect, and are stained with some blemish of corruption, as may appear in the prophet Isaiah and in Paul, both of whom had a great disliking of that good which they did, because it was mingled with sin [Isa. 64:6; Rom. 7:14–16]. And again, every man is bound by duty to keep the whole law, so that if a man could keep it perfectly, he should do no more than he is by duty enjoined to do. And therefore he who looks to merit eternal life at God’s hand by keeping the law, trusts but to a broken staff, and is like the bankrupt who will pay one debt by another. For by his sin, every man is indebted to the Lord, and is bound to answer to the Lord the full punishment of all his sins. This debt (the papist says) we may discharge by obedience to the law, that is by a new debt, which we are as well bound to pay to our God as the former. To end this point, let a man look to be saved by works, and therefore let a man employ himself to do the best works he can, yet he shall never come to know when he has done sufficient to satisfy God’s wrath. And this uncertainty, all his life, but especially in the hour of death, must needs disquiet him. And truly, when a man shall have done many thousands of works, yet his heart can never be quiet, as it appears in the young man, who though he had labored all his life to fulfill the law thereby to be saved, yet distrusting all his doing, asks further of our Savior Christ what he might do to be saved [Mark 10:17]. Furthermore, it is the doctrine of the Church of Rome that there is nothing in the regenerate that God can hate, and that they are inwardly pure and without spot. A doctrine that will make any Christian conscience despair. For if a man shall fall to examine himself, he shall find that he is sold under sin [Rom. 7:14], [and] compassed about of sin [Heb. 12:1]. He shall see his particular sins to be as the hairs of his head [Ps. 40:12]. At the sight and feeling of these, he shall find that there is much matter in him worthy of hatred and damnation too. He being in this case, will begin to doubt whether he is the child of God or not. And persevering in this doubting, he shall be driven to despair of God’s love towards him, considering that he cannot find any such pureness in himself as the doctrine of the Church of Rome requires. Lastly, experience itself teaches that the Romish religion can bring no peace to the conscience; in that some for the maintaining of it have despaired. As Francis Spira, who against his own conscience, having abjured the truth and subscribed to the doctrine of the Romish Church, most fearfully despaired of his salvation. This could not have been if that doctrine had been agreeable to God’s Word, which is spirit and life to the receiver. For the same cause Latomus, a Doctor of Louane, despaired, crying that he was damned because he had opposed himself to the known truth. This also befell Gardner at his death, as the book of Acts and Monuments declares.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-237767f776" data-kw="">
<blockquote><p>Thesis 10. And it also follows from this that the word ‘to be justified’ in this argument in no way should be thus understood as if that righteousness of Christ were infused into us. Rather, it is thus declared that, having seized Christ Himself together with His righteousness by faith, we are absolved from all our sins and death, and through the one same Christ Himself we are declared worthy of eternal life in the one same Christ. But one also speaks of a wider meaning of the term ‘righteousness’, as about that most perfect, which is subjectively in Christ alone according to the flesh and which alone, imputed to us by faith, pacifies our consciences before the tribunal of God. This concerning holiness within us is applied and inchoate in another gift of God. Thus, if ‘justification’ is taken as the free application of the latter rather than the former benefit, Christ having been seized by faith, we do not deny that the term ‘justification’ is comprehended as much as that benefit of that imputed and most perfect righteousness as the benefit of sanctification inchoate in us is. Yet we say that careful and painstaking care must be applied in order that one may not be confounded with the other and that we may know that the part first in order pleases and is accepted by God on account of Christ and in Christ alone is seized by faith, and that second gift of regeneration follows later.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theses Written Out in Full with the Unanimous Consent of the Pastors of the Swiss Churches by the Authority of the Very Distinguished Senate of Bern</cite>, 1588’ in Justification by Faith Alone: Selected Writings from Theodore Beza (1519-1605), Amandus Polanus (1561-1610), Francis Turretin (1623-1687), trans. Casey Carmichael in Classic Reformed Theology (RHB, 2023), pp. 113-14</span></figcaption>

</figure><figure class="quote" id="q-f73420d41d" data-kw="">
<blockquote><p>We think that even the adversaries acknowledge that, in justification, the remission of sins is necessary first. For we all are under sin. Wherefore we reason thus: To attain the remission of sins is to be justified, according to Ps. 32:1, ‘Blessed is he whose transgression is forgiven.’ By faith alone in Christ, not through love, not because of love or works, do we acquire the remission of sins, although love follows faith. Therefore by faith alone we are justified, understanding justification as the making of a righteous man out of an unrighteous, or that he be regenerated.</p></blockquote>

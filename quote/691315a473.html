<blockquote><p>XV. The Fruits of the Obedience, Passion, Death and Resurrection of Christ And we believe that Christ by his perfect obedience deserved eternal life, not only for Himself but also for us: by his passion and death He satisfied for our sins in his flesh… and by his resurrection and ascension into heaven He obtained also for us both the resurrections, (as John speaketh, Rev. 20:5) the first and the latter: and that in our name He took unto Himself possession of the heavenly inheritance: and sitteth at the right hand of God (Eph. 1:20), that is, hath taken to Himself power over all things in heaven and in earth…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of Christian Religion</cite>, Ch. 11, Section 15, pp. 70-71 of Confession of Christian Religion (Cambridge, 1599) This may be found in the Latin in his Works, vol. 8, cols. 502-503. Voet and others say that Zanchi makes reference to this same teaching in the Preface to this work (on p. 477 in the Latin), though we have been unable to locate that reference.</span></figcaption>

blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d8aa891617" data-kw="">
<blockquote><p>Therefore the Papists err grievously when they confuse works taken generally with merits, and as soon as they hear of a pious work being commanded, immediately understand merit and a work spoken of in a legal sense. Likewise, when they hear that a reward is promised, they again understand it juridically and legally, as in some contract of hiring and payment; whereas reward is commonly called whatever we obtain after preceding labor and difficulties, whose fear might have deterred us from a good purpose, and which are compensated by the sweetness of the good that follows. Such are not only: (1) the rendering of a good to which a preceding work corresponds in equal worth (that is, merit of condignity)… … (3) Likewise, the execution of a promise made under a condition—not only of gratefully accepting and not despising the gift (for no donation is so free and pure as not to include this condition), but also of a certain work, besides acceptance and gratitude, required in addition—which therefore is in some sense meritorious, although there is perhaps no equality or commutation between the work and the promised reward; as if a father promises a jewel to his son who takes bitter medicine, or a prince promises a prize to a subject engaged in an exercise or contest beneficial to him. In this case, the donation is not purely free, since the thing does not begin to be owed as soon as the promise is accepted, but only when the condition is fulfilled; nor is it properly merit of condignity, since the worker benefits himself rather than giving something to another for which he ought to receive an equal price. Hence again it effects nothing properly by its own virtue or dignity, but only from the liberality, magnificence, and mercy of the giver, or of one interceding with him. Yet it is a certain merit improperly so called, which they call merit by covenant. Something of this kind, with respect to good works in the children of God, to whom God has promised rewards, is admitted by the Apology of the Augsburg Confession [written by Philip Melanchthon] in response to the argument—although others, on account of the ambiguity and great abuse of the term “merit,” not without reason reject it altogether. [4] Another [kind of merit] is what they call merit of congruity [or proportion], which either seems not to signify merit at all, or involves a contradiction, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/conrad-bergius.html">Conrad Bergius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Praexi Cathol. Divin. Canon., Dissertation 7</cite>, pp. 963-64 as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 364, trans. ChatGPT-5 Bergius (1544-1592) was a German reformed theologian.</span></figcaption>

</figure><figure class="quote" id="q-83223a61ea" data-kw="">
<blockquote><p>There is nothing in the term reward to justify the inference that our works are the cause of salvation. First, let it be a fixed principle in our hearts, that the kingdom of heaven is not the hire of servants, but the inheritance of sons (Eph. 1:18); an inheritance obtained by those only whom the Lord has adopted as sons, and obtained for no other cause than this adoption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/adoption/privileges-of-sons.html">Privileges of Sons</a> › <a href="../topics/adoption/privileges-of-sons/heirs.html">Heirs</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span></div>

— John Calvin, Institutes of the Christian Religion, 3.18.2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere%20is%20nothing%20in%20the%20term%20reward%20to%20justify%20the%20inference%20that%20our%20works%20are%20the%20cause%20of%20salvation.%20First%2C%20let%20it%20be%20a%20fixed%20principle%20in%20our%20hearts%2C%20that%20the%20kingdom%20of%20heaven%20is%20not%20the%20hire%20of%20servants%2C%20but%20the%20inheritance%20of%20sons%20%28Eph.%201%3A18%29%3B%20an%20inheritance%20obtained%20by%20those%20only%20whom%20the%20Lord%20has%20adopted%20as%20sons%2C%20and%20obtained%20for%20no%20other%20cause%20than%20this%20adoption.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%203.18.2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F83223a61ea.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/83223a61ea.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-6d2ec44acf" data-kw="">
<blockquote><p>If Christ were now speaking of the cause of our salvation, the Papists could not be blamed for inferring that we merit eternal life by good works; but as Christ had no other design than to exhort his people to holy and upright conduct, it is improper to conclude from his words what is the value of the merits of works. … But we have another reply to offer, which is still more clear; for we do not deny that a reward is promised to good works, but maintain that it is a reward of grace, because it depends on adoption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Matthew 25:35</span></figcaption>

</figure><figure class="quote" id="q-6aef140aee" data-kw="">
<blockquote><p>It may however be hence inferred with certainty, that our salvation is altogether through the grace and mere beneficence of God. He might indeed have used other words -- that the wages of righteousness is eternal life; and then the two clauses would correspond: but he knew that it is through God&#x27;s gift we obtain it, and not through our own merits.</p></blockquote>

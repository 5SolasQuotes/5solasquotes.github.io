<main class="wrap"><figure class="quote" id="q-b50da99f93" data-kw="">
<blockquote><p>To be precise, if we may consider frankly the actual system of virtue which Aristotle proposes, by which alone access to happiness is acquired, we will see that it is an arrogant supposition peddling the mere shadow of virtue, rather than that disposition of mind which comports with the human condition and its dependency on the most high God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theologoumena Pantodapa, tr. Dr. David C. Noe</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>
<div class="actions"><button class="copy" data-copy="“To be precise, if we may consider frankly the actual system of virtue which Aristotle proposes, by which alone access to happiness is acquired, we will see that it is an arrogant supposition peddling the mere shadow of virtue, rather than that disposition of mind which comports with the human condition and its dependency on the most high God.”

— John Owen, Theologoumena Pantodapa, tr. Dr. David C. Noe">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTo+be+precise%2C+if+we+may+consider+frankly+the+actual+system+of+virtue+which+Aristotle+proposes%2C+by+which+alone+access+to+happiness+is+acquired%2C+we+will+see+that+it+is+an+arrogant+supposition+peddling+the+mere+shadow+of+virtue%2C+rather+than+that+disposition+of+mind+which+comports+with+the+human+condition+and+its+dependency+on+the+most+high+God.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Theologoumena+Pantodapa%2C+tr.+Dr.+David+C.+Noe&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb50da99f93.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b50da99f93.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/ethics#:~:text=To%20be%20precise%2C%20if%20we%20may,dependency%20on%20the%20most%20high%20God." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5d867ad12d" data-kw="">
<blockquote><p>Fourthly, that when the authority of the magistrate or Church has determined concerning the use of things indifferent, we are not now left free, nor are bound to look at the scandal of particular persons, but must make conscience of it that we offend not the Church, by working a greater hurt or loss to the Church than the particular hurt of private persons can extend unto. In such cases as this, the apostle’s rule holds: ‘If any man seem to be contentious, we have no such custom, nor the Church of God,’ 1 Cor. 11:16. And we are bound, in this text of the apostle Peter [1 Pet. 2:13], to obey the human ordinances of men in authority; from which obligation other men’s offense cannot free us. And the apostle charges us to look to it that we offend not the Church in prescribed ordinances and that we be careful not to offend private men in free ceremonies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Three First Chapters of the First Epistle General of St. Peter... (London, 1637), on 1 Tim. 2:13</cite>, pp. 436–37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-58960996c7" data-kw="">
<blockquote><p>I have heard many pleading for ceremonies say that if the magistrate commanded them and would not otherwise permit them to preach the Gospel, they would preach in a fool’s coat and a fool’s cap with a feather rather than forbear. But I do not think that any of them would justify that ruler that would make such a law…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-78607ed934" data-kw="">
<blockquote><p>Yet if the miscarriage be so great in the [authorities’] ordering even of these circumstances or in the manner of duties, as shall overthrow the duty itself and be inconsistent with the ends, or bring greater evils upon the Church than our refusing to obey… then… we are not bound to follow… in such a case, but otherwise we are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship (London, 1659), 5th Disputation</cite>, ch. 12,; p. 461</span></figcaption>

</figure><figure class="quote" id="q-310581abac" data-kw="">
<blockquote><p>[George] Gillespie nowhere in his tome speaks of or argues the “greater good”. He does address personal, “greater duties,” but this allows him to confine the issues to immediate circumstances. Yet the relevance of a larger view of the greater good and its affecting our ethical obligations (especially with inconvenient actions, but also regarding scandal) cannot be denied.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-944ba2b61c" data-kw="">
<blockquote><p>It was God’s oath, and God tied Judah to absolute subjection, therefore, people may tie themselves, it follows not, except you could make good this inference: 1. God is absolute, therefore the king of Babylon may lawfully be absolute. This is a blasphemous consequence. 2. That Judah was to swear the oath of absolute subjection in the latitude of the absoluteness of the kings of Chaldea, I would see proved. Their absoluteness by the Chaldean laws was to command murder, idolatry, (Dan. 3:4-5) and to make wicked laws (Dan. 6:7-8). I believe Jeremiah commanded not absolute subjection in this sense, but the contrary (Jer. 10:11). They were to swear the oath in the point of suffering; but what if the king of Chaldea had commanded them all, the whole holy seed, men, women and children, out of his royal power, to give their necks all in one day to his sword; were they obliged by this oath to prayers and tears, and only to suffer? and was it against the oath of God to defend themselves by arms? I believe the oath did not oblige to such absolute subjection, and though they had taken arms in their own lawful defence, according to the law of nature, they had not broken the oath of God. The oath was not a tie to an absolute subjection of all and every one, either to worship idols, or then to fly or suffer death. Now, the Service Book commanded [in Scotland in 1637], in the king’s absolute authority [Charles I], all Scotland to commit grosser idolatry, in the intention of the work, if not in the intention of the commander, than was in Babylon. We read not that the king of Babylon pressed the consciences of God’s people to idolatry or that all should either fly the kingdom and leave their inheritances to papists and prelates or then come under the mercy of the sword of papists and atheists by sea or land. 3. God may command against the law of nature, and God’s commandment makes subjection lawful, so as men may not now, being under that law of God, defend themselves. What then? Therefore we owe subjection to absolute princes, and their power must be a lawful power, it nowise is consequent. God’s commandment by Jeremiah made the subjection of Judah lawful, and without that commandment they might have taken arms against the king of Babylon, as they did against the Philistines; and God’s commandment makes the oath lawful. As suppose Ireland would all rise in arms, and come and destroy Scotland, the king of Spain leading, then we were by this argument not to resist. 4. It is denied that the power (Rom. 13) as absolute, is God’s ordinance. And I deny utterly that Christ and his apostles did swear non-resistance absolute to the Roman emperor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 110</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-13e6b614f3" data-kw="">
<blockquote><p>Whether they are sure that these superstitions of theirs may not run the round as other superstitions have done before them?… What if the next age should turn them into a dead formality? And what if the next age after that should make laws to enforce them? And then godly people first scruple them, and then fly from them as discerned superstition? And then the worst men be glad of that advantage to persecute those that would not submit to them? By this circulation, if the same men who invented… new and needless Church covenants, etc. could but live two or 300 years, they might come to be among the number of those who cry out of them as superstitious, and suffer persecution because they will not use them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 58, p. 293</span></figcaption>

</figure><figure class="quote" id="q-7bdb2ab953" data-kw="">
<blockquote><p>What was then the sin of Peter in resuming the practice of the ceremonies there [in Galatians 2]? His sin was double. First, the abuse of his authority in the Church, for, that unawares by his example, he compelled the gentiles to the use of such ceremonies as himself saw liberty to forbear amongst them; and which having never been commanded by God to them, he had no power to impose on them. His other sin was the dissembling or concealing of his Christian Liberty which he should then have stood upon, when he saw the false teachers urge these ceremonies upon the gentiles as well as upon the Jews, to the prejudice of their Christian Liberty. When things that are indifferent are commanded to be done of necessity (as now all Popes, and prelates’ ceremonies are) then are not the same to be obeyed, because the same destroyes our freedom in Christ. The sum of all this will lead us by the hand one step farther, namely; if it be a sin in Church-governors to command (especially upon strict penalty) indifferent, decent things, it will be a sin also in ministers and in private Christians to subscribe ex animo [from the soul], and to yield obedience by conformity to such commands, although the ceremonies were as good (indeed) as they were pretended (which I believe they are not) indifferent-decent-things. For, does not such voluntary subscription and conforming to them build up our Church-governors, yea and with them (that which is most to be taken to heart of us, our soveraign civil governors also in the confidence) that such commandements are as well lawfully given by them, as received and obeyed, yea confirmed and allowed by us? Now to build up or edify a brother to sin, is properly to offend a brother; for the proper definition of an offence is that which edifies a brother unto sin, as the original word expresses it (1 Cor. 8:10), and so to sin against a brother, is to wound his conscience; yea, and as much as in us lies, to cause him to perish for whom Christ died; which is no better than spiritual murder of his soul. Now, if thus to edify any brother to sin be so heinous an offence, how much more heinous an offence is it to edify our governors to the giving and urging of such commandments, yea and to the sharp censuring of all others as refractory and factious persons, who choose rather to undergo the loss of the greatest comforts they enjoy in this world than to wound the consciences either of themselves or of their governours? It is true by forbearing obedience to those commandments we offend the spirits of our governors, and make them to be (though causelesly) offended with us; But by yielding obedience to these things we should offend their consciences in edifying them to sin, and provoke the Lord to be offended with them. Better they be offended with us, without fault, than through our fault God to be offended with them and us. It is not for Christians, much less for ministers, to redeem outward peace and liberty at so dear a price as the hazzard of the blood of so many precious souls, especially of our governors in highest place and authority. This was the author’s judgement with whom our martyr, Mr. William Tyndale concurs, in his Answer to Mr. Moore’s First Book, pp. 285-6. Our prelates ought to be our servants, as the apostles were, to teach us Christ’s doctrine, and not to Lord over us with their own, Peter called it tempting of the Holy Ghost, Acts 15[:10], to lade the heathen with ought but that which necessity and brotherly love requires, and Paul rebuking the Corinthians and Galatians for their over much obedience, warns all men to stand fast and not to suffer themselves to be brought into bondage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief, Pithy Discourse upon 1 Corinthians 14:40</cite>, … (London, 1661), pp. 13-14</span></figcaption>

nition+of+an+offence+is+that+which+edifies+a+brother+unto+sin%2C+as+the+original+word+expresses+it+%281+Cor.+8%3A10%29%2C+and+so+to+sin+against+a+brother%2C+is+to+wound+his+conscience%3B+yea%2C+and+as+much+as+in+us+lies%2C+to+cause+him+to+perish+for+whom+Christ+died%3B+which+is+no+better+than+spiritual+murder+of+his+soul.+Now%2C+if+thus+to+edify+any+brother+to+sin+be+so+heinous+an+offence%2C+how+much+more+heinous+an+offence+is+it+to+edify+our+governors+to+the+giving+and+urging+of+such+commandments%2C+yea+and+to+the+sharp+censuring+of+all+others+as+refractory+and+factious+persons%2C+who+choose+rather+to+undergo+the+loss+of+the+greatest+comforts+they+enjoy+in+this+world+than+to+wound+the+consciences+either+of+themselves+or+of+their+governours%3F+It+is+true+by+forbearing+obedience+to+those+commandments+we+offend+the+spirits+of+our+governors%2C+and+make+them+to+be+%28though+causelesly%29+offended+with+us%3B+But+by+yielding+obedience+to+these+things+we+should+offend+their+consciences+in+edifying+them+to+sin%2C+and+provoke+the+Lord+to+be+offended+with+them.+Better+they+be+offended+with+us%2C+without+fault%2C+than+through+our+fault+God+to+be+offended+with+them+and+us.+It+is+not+for+Christians%2C+much+less+for+ministers%2C+to+redeem+outward+peace+and+liberty+at+so+dear+a+price+as+the+hazzard+of+the+blood+of+so+many+precious+souls%2C+especially+of+our+governors+in+highest+place+and+authority.+This+was+the+author%E2%80%99s+judgement+with+whom+our+martyr%2C+Mr.+William+Tyndale+concurs%2C+in+his+Answer+to+Mr.+Moore%E2%80%99s+First+Book%2C+pp.+285-6.+Our+prelates+ought+to+be+our+servants%2C+as+the+apostles+were%2C+to+teach+us+Christ%E2%80%99s+doctrine%2C+and+not+to+Lord+over+us+with+their+own%2C+Peter+called+it+tempting+of+the+Holy+Ghost%2C+Acts+15%5B%3A10%5D%2C+to+lade+the+heathen+with+ought+but+that+which+necessity+and+brotherly+love+requires%2C+and+Paul+rebuking+the+Corinthians+and+Galatians+for+their+over+much+obedience%2C+warns+all+men+to+stand+fast+and+not+to+suffer+themse <blockquote><p>4. Passive obedience to wicked emperors can but be enjoined (Rom. 13) but only in the manner and upon [the] supposition that we must be subject to them and must suffer against our wills all the ill of punishment that they can inflict, we must suffer patiently, and because it is God’s permissive will that they punish us unjustly; For it is not God’s ruling and approving will (called voluntas signi [the will of sign, or his revealed will]) that they should, against the law of God and man kill us and persecute us; and therefore neither Rom. 13, nor 1 Pet. 2, nor any other place in God’s Word, any common divine, natural, national or any municipal law, commands formally obedience passive, or subjection passive, or non-resistance under the notion of passive obedience; Yea, to me, obedience-passive (if we speak of obedience, properly called, as relative essentially to a law) is a chimera, a dream, and repugnantia in adjecto; and therefore I utterly deny that resistance-passive, or subjection-passive, does formally fall under either commandment of God, affirmative or negative; Only the unlawful manner of resistance by way of revenge, or for defense of Popery and false religion, and out of impatient toleration of monarchy or any tyranny, is forbidden in God’s Word; And certainly all the words used [in] Rom. 13, as they fall under a formal commandment of God, are words of action, not of any chimerical passive obedience, as we are not to resist actively God’s ordinance, as his ordinance, (vv. 1-2), that is, to resist God actively. We are to do good works, not evil, if we would have the ruler no terror to us (v. 3). We must not do ill if we would be free of vengeance’s sword (v. 7); we are to pay tribute and to give fear and honor to the ruler, all which are evidently actions, not passive subjection; and if any passive subjection be commanded, it is not here, nor in the First Commandment commanded; but [rather it is] in the First Commandment under the hand of patience and submission under God’s hand in sufferings, or in the Third Commandment under the hand of rather dying for Christ than denying his truth before men. Hence I argue here (Rom. 13; 1 Pet. 2 ; Tit. 3) is nothing else but an exposition of the Fifth Commandment; but in the Fifth Commandment only active obedience is formally commanded, and the subordination of inferiors to superiors is ordained, and passive obedience is nowhere commanded, but only modus rei [the mode of the thing], the manner of suffering, and the occasion of the commandment; …Paul established magistracy and commands obedience in the Lord; and he is more to prove the office of the magistrate to be of God than any other thing (and to show what is his due) than to establish absoluteness in Nero to be of God; yea, to me, every word in the text speaks limitedness of princes, and cries down absoluteness: (1.) No power of God, (2.) no ordinance of God, who is a terror to evil, but a praise to good works, (3.) no minister of God for good, etc. can be a power to which we submit ourselves on earth as next unto God without controlment. That passive obedience falls formally under no commandment of God, I prove thus: All obedience liable to a divine commandment does commend morally the performer of obedience as having a will conformed to God’s moral law; and deformity betwixt the will of him who performs not obedience involves the non-obedient in wrath and guiltiness. But non-passive subjection to the sword of the judge does not morally commend him that suffers not punishment; for no man is formally a sinner against a moral law because he suffers not the ill of punishment, nor is he morally good, or to be commended, because he suffers ill of punishment, but because he does the ill of sin. And all [the] evil of punishment unjustly inflicted has God’s voluntas beneplaciti [the will of good-pleasure, or decree], the instrumental and hidden decree of God, which orders both good and ill (Eph. 1:11) for its rule and cause, and has not God’s will or approbation called, voluntas signi, for its rule: both are contrary to that will. I am sure Epiphanius (1. 1, torn. 3, heres. 40), Basil (in Ps. 32), Nazianzen Orat. (ad subd. et imperat.), Hilarary (li. ad Constant.) and Augustine all cite these words and say the same. If, then, passive subjection be not commanded, non-subjection-passive cannot be forbidden, and this text, Rom. 13 and 1 Pet. 2, cannot a whit help the bad cause of royalists. All then must be reduced to some action of resisting; arguments for passive subjection, though there were ship-fulls of them, they cannot help us.</p></blockquote>

t+non-passive+subjection+to+the+sword+of+the+judge+does+not+morally+commend+him+that+suffers+not+punishment%3B+for+no+man+is+formally+a+sinner+against+a+moral+law+because+he+suffers+not+the+ill+of+punishment%2C+nor+is+he+morally+good%2C+or+to+be+commended%2C+because+he+suffers+ill+of+punishment%2C+but+because+he+does+the+ill+of+sin.+And+all+%5Bthe%5D+evil+of+punishment+unjustly+inflicted+has+God%E2%80%99s+voluntas+beneplaciti+%5Bthe+will+of+good-pleasure%2C+or+decree%5D%2C+the+instrumental+and+hidden+decree+of+God%2C+which+orders+both+good+and+ill+%28Eph.+1%3A11%29+for+its+rule+and+cause%2C+and+has+not+God%E2%80%99s+will+or+approbation+called%2C+voluntas+signi%2C+for+its+rule%3A+both+are+contrary+to+that+will.+I+am+sure+Epiphanius+%281.+1%2C+torn.+3%2C+heres.+40%29%2C+Basil+%28in+Ps.+32%29%2C+Nazianzen+Orat.+%28ad+subd.+et+imperat.%29%2C+Hilarary+%28li.+ad+Constant.%29+and+Augustine+all+cite+these+words+and+say+the+same.+If%2C+then%2C+passive+subjection+be+not+commanded%2C+non-subjection-passive+cannot+be+forbidden%2C+and+this+text%2C+Rom.+13+and+1+Pet.+2%2C+cannot+a+whit+help+the+bad+cause+of+royalists.+All+then+must+be+reduced+to+some+action+of+resisting%3B+arguments+for+passive+subjection%2C+though+there+were+ship-fulls+of+them%2C+they+cannot+help+us.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Question+30%2C+%E2%80%98Whether+or+No%5Bt%5D+Passive+Obedience+be+a+Mean%5Bs%5D+to+which+we+are+Subjected+in+Conscience+by+Virtue+of+a+Divine+Commandment%E2%80%A6%E2%80%99+Summary+in+Lex+Rex+%281644%29%2C+pp.+155+rt.+col.+%E2%80%93+156&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9aa1a1740a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9aa1a1740a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-passive-obedience/#:~:text=4.%20Passive%20obedience%20to%20wicked%20emperors,of%20them%2C%20they%20cannot%20help%20us&amp;text=4.%20Passive%20obedience%20to%20wicked%20emperors%20can%20but&amp;t <blockquote><p>Usurpation is an intrusion into the seat of authority, a presuming to possess and manage the place and power thereof without a lawful calling, right, or title thereunto.</p></blockquote>

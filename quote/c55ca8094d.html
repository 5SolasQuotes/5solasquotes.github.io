<main class="wrap"><figure class="quote" id="q-c55ca8094d" data-kw="">
<blockquote><p>The last of God’s attributes which I shall now mention is his Dreadfulness or Terribleness, to those that are the objects of his wrath. This is the result of his other attributes, especially of his Holiness, and Governing Justice, and Truth in his comminations [threats].</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

<blockquote><p>Hence although love considered affectively and on the part of the internal act is equal in God (because it does not admit of increase and diminution), yet regarded effectively (or on the part of the good which He wills to anyone) it is unequal because some effects of love are greater than others.</p></blockquote>

</figure><figure class="quote" id="q-cd32789084" data-kw="">
<blockquote><p>[Attributes of God are classified] Into Absolute and Relative, which imply a Relation to the creatures with Himself, and are founded in Absolutes. Thus an Absolute Attribute of God is Goodness, but a Relative Attribute is Mercy, which pertains to the Goodness of God, but additionally involves a regard to a miserable creature. Immensity is an Absolute Attribute, but Omnipresence is Relative, because it indicates a relation to created things, in all which it asserts the presence of God. Vindictive Justice is a Relative Attribute, indicating a relation to a creature, sinful and worthy of punishment; but it is founded in an Absolute Attribute, divine Holiness. And so, although that relation did not obtain before the things were created, nevertheless the Relative Attributes are able truly to be said to be Essential to God, because they are always applicable to God with respect to their foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Continuous Commentary on Johannes a Marck</cite>, (1761-1772), IV:19, ‘Classification of God’s Attributes: Absolute &amp; Relative’</span></figcaption>

</figure><figure class="quote" id="q-4fcad14e0a" data-kw="">
<blockquote><p>Besides, creation is the only first discovery of his dominion. Before the world was framed there was nothing but God Himself, and, properly, nothing is said to have dominion over itself; this is a relative attribute, reflecting on the works of God; He had a right of dominion in his nature from eternity, but before creation He was actually Lord only of a nullity; where there is nothing it can have no relation; nothing is not the subject of possession nor of dominion. There could be no exercise of this dominion without creation: what exercise can a sovereign have without subjects? Sovereignty speaks a relation to subjects, and none is properly a sovereign without subjects. To conclude: from hence does result God’s universal dominion; for being Maker of all, He is the ruler of all, and his perpetual dominion; for as long as God continues in the relation of Creator, the right of his sovereignty as Creator cannot be abolished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourses upon the Existence &amp; Attributes of God 2 vols</cite>, (NY: 1853), vol. 2 | Discourse 13, ‘On God’s Dominion’, p. 370</span></figcaption>

s Online</a></div>
</figure><figure class="quote" id="q-baff700da8" data-kw="">
<blockquote><p>Now, since power is proper to God in relation to His effects, and since power, as was said, has the character of a principle, and since principle expresses relationship to that which proceeds from it, it is evident that something can be said of God relatively, with regard to His effects.</p></blockquote>

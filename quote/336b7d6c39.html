<main class="wrap"><figure class="quote" id="q-336b7d6c39" data-kw="true priest on earth against Socinians">
<blockquote><p>Was Christ a Priest of true name who began his priesthood on earth? Or was he so called only figuratively, who fulfilled his office in heaven after his ascension and not before? We affirm the former and deny the latter against the Socinians. The second part of the mediatorial office of Christ is his sacerdotal dignity, the basis of all the benefits which Christ purchased by his death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.8.1</span></figcaption>

</figure><figure class="quote" id="q-d9efed039d" data-kw="debt enmity crime satisfaction">
<blockquote><p>First, sin, which renders us guilty and hated of God and binds us over as debtors to punishment, may be viewed under a threefold relation either as a debt, which we are bound to pay to divine justice, in which sense the law is called “a handwriting”; or as enmity, inasmuch as it makes us enemies to God and God to us; or as a crime, on account of which we are exposed to condemnation and death. Corresponding to these, satisfaction ought to be a payment of debt, a reconciliation with God, and a propitiatory covering of the crime.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.10.6</span></figcaption>

</figure><figure class="quote" id="q-750d639e01" data-kw="">
<blockquote><p>You will remember the multitude He has redeemed; not me alone, nor you alone, but “a multitude that no man can number,” which shall as far exceed the stars of heaven for number, as they exceed all mortal reckoning. Christ hath bought for Himself, some out of every kingdom, and nation, and tongue, under heaven; He hath redeemed from among men some of every rank, from the highest to the lowest; some of every colour—black and white; some of every standing in society, the best and the worst. For some of all sorts hath Jesus Christ given Himself a ransom that they might be redeemed unto Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Justification by Grace”</cite>, sermon on Rom. 3:24</span></figcaption>

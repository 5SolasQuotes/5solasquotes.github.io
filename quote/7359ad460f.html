<main class="wrap"><figure class="quote" id="q-7359ad460f" data-kw="">
<blockquote><p>Since Thou hast commanded us to pray for kings and princes, and for all who are placed in authority, we pray, among others, for those governments whose theological professors are present in this solemn ecclesiastical assembly, as well as for those who are yet expected; and for his royal majesty of Great Britain, James I, who is a courageous and conscientious protector of the true faith. We pray for his son-in-law, the illustrious Prince Elector of the Roman Empire and Palatinate on the Rhine, and for the Chief Magistrate of the Empire. We pray for the illustrious Duke and Elector of Brandenburg, for the illustrious Count of Hesse, for the United Cantons in Switzerland, for the high-borne counts of Nassau and Wetteravia, and for the honourable and worthy Council, the Republics of Geneva, Bremen, and Emden.

Especially we pray for those whom Thou hast placed over us in the Reformed Netherlands: for the exalted lords the States General, and for their exalted deputies to this Synod; for the illustrious and warlike hero, the Prince of Orange, and for the entire house of Nassau; for the noble-minded lords states of Holland and West Friesland; for the most wise noble-minded lords, the Presidents and Counselors of both of the Courts of Justice; and for the respectable Council of this city, the Lord Sheriff, Mayor, Aldermen, and the eight judges.

Grant that each and every one of them might serve Thee with reverence and rejoice with trembling. Confirm their scepter and secure their throne in ever-increasing measure, that they might remain faithful, nurturing fathers of Thy church in these regions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/balthasar-lydius.html">Balthasar Lydius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Prayer of Balthasar Lydius’, trans. Douglas J. Kuiper and H. David Schuringa Protestant Reformed Theological Journal</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bc16259662" data-kw="">
<blockquote><p>It was made very clear, however, by other statutes on this subject, that when actual murder had been committed, no advantage was to accrue to the perpetrator from the cities of refuge; though he might have fled thither, he was, on the proof of his guilt, to be delivered up to the Goel for summary execution. Nor was the altar of God – a still more sacred place than the cities of refuge, and in ancient times almost universally regarded as an asylum for criminals – to be permitted in such cases to afford protection; from this also the murderer was to be dragged to his deserved doom. In short, deliberate murder was to admit of no compromise and no palliation: the original law, ‘whoso sheddest man’s blood by man shall his blood be shed,’ must be rigorously enforced; and, doubtless, mainly also on the original ground, ‘because in the image of God made He him.’

To disregard the sanctity of human life, and tread it vilely in the dust, was like aiming a thrust at God Himself, disparaging His noblest work in creation, and the one that stood in peculiar relationship to His own spiritual being. Therefore, the violation of the sixth command by deliberate murder involved also a kind of secondary violation of the first; and to suffer the blood of the innocent to lie unavenged, was, in the highest sense, to pollute the land; it was to render it unworthy of the name of God’s inheritance.

So great was the horror entertained of this unnatural crime, and so anxious was the Lawgiver to impress men with the feeling of its contrariety to the whole spirit and object of the law, that, even in the case of an uncertain murder, there was a cry of blood which could not be disregarded; and when every effort had failed to discover the author of the deed, the elders of the city which lay nearest to the corpse were to regard themselves as in a manner implicated; they had to come publicly forward, and not only protest their innocence of the crime, and their ignorance of the manner in which it had been committed, but also to go through a process of purification by blood and water, that the charge of blood-guiltiness might not rest upon them and their land.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-fairbairn.html">Patrick Fairbairn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Revelation of Law in Scripture: Considered with respect both to its own Nature, and to its Relative Place in Successive Dispensations. The Third Series of the ‘Cunningham Lectures’</cite>, (Edinburgh: T. &amp; T. Clark, 1869), pp 110-12.</span></figcaption>

</figure><figure class="quote" id="q-08ae58b6b6" data-kw="">
<blockquote><p>Those who search for other reasons [besides adultery for divorce] ought justly to be set at nought, because they choose to be wise above the heavenly Teacher. They† say that leprosy is a proper ground for divorce, because the contagion of the disease affects not only the husband, but likewise the children. For my own part, while I advise a religious man not to touch a woman afflicted with leprosy, I do not pronounce him to be at liberty to divorce her. If it be objected, that they who cannot live unmarried need a remedy, that they may not be burned, I answer, that what is sought in opposition to the Word of God is not a remedy. I add too, that if they give themselves up to be guided by the Lord, they will never want [lack] continence, for they follow what He has prescribed. One man shall contract such a dislike of his wife, that he cannot endure to keep company with her: will polygamy cure this evil? Another man’s wife shall fall into palsy or apoplexy, or be afflicted with some other incurable disease, shall the husband reject her under the pretense of incontinency? We know, on the contrary, that none of those who walk in their ways are ever left destitute of the assistance of the Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew</cite>, 19, v. 9</span></figcaption>

<blockquote><p>The presbyterian government is more limited and less arbitrary than the independent government of single congregations, which, exempting themselves from the presbyterial subordination, and from being accountable to, and censurable by, classes or synods, must needs be supposed to exercise a much more unlimited or arbitrary power than the presbyterial churches do […]</p></blockquote>

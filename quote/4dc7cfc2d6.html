<main class="wrap"><figure class="quote" id="q-4dc7cfc2d6" data-kw="">
<blockquote><p>With what God doth inwardly teach you, by that common light which shines in every man’s own bosom, that with a sincere mind, attends to it, and which is too little attended to. There are Truths too commonly held in unrighteousness, seated generally in the Minds and Consciences of men; by which, tho’ they have not another Law, they are a Law to themselves; and for the stifling and resisting whereof, the wrath of God is revealed from Heaven against them.

And from such Truths they might infer others, and where God affords external helps, come to discern a sure ground whereupon to understand that what is contained besides in the frame of Christian Doctrine is true; being enabled to judge of the evidences that prove the whole Revelation thereof to be from God; and nothing being in it self more evident than that what he hath revealed is true.

And withal God is graciously pleased to shine into Minds that with upright aims set themselves to enquire out and understand his Mind; and so farther light comes to be superadded to that which is common. Now take heed how you neglect what a man teaches you, agreeably to that inward light which is already (one way or other) in your own Minds and Consciences.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two sermons preached at Thurlow in Suffolk on those words, Rom. 6.13 “Yield your selves to God”</cite>, (London: Tho. Parkhurst, 1688), pp 26-27.</span></figcaption>

<blockquote><p>In chapter 1 we introduced the principle of proportionate causality (PPC), which states that whatever is in an effect must be in its cause, insofar as a cause cannot give what it does not first have. Let’s now examine this principle more carefully. Recall first that, stated more precisely, PPC holds that whatever is in an effect must be in its total cause in some way or other, whether formally, virtually, or eminently… PPC follows straightforwardly from the principle of causality (PC) and the principle of sufficient reason (PSR), both of which have been defended at length in earlier chapters. If there were some aspect of an effect that didn’t come from its total cause, then that would involve a potentiality that was actualized without anything doing the actualizing, which would violate PC. It would be an aspect of the effect that lacked any explanation, which would violate PSR.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Proofs of the Existence of God</cite>, (Ignatius, 2017) | ch. 6, The Nature of God and of His Relationship to the World, p. 170</span></figcaption>

</figure><figure class="quote" id="q-51aea02d86" data-kw="">
<blockquote><p>Theology is a discipline, partly theoretical and partly practical, teaching the manner of living well and blessedly for eternity. … We know God and Christ in such a way that this knowledge produces something in us. Thus, when I know that God is all‑knowing, I ascribe to him this praise: that he knows all my defects and the poverty of both my soul and body. From this, I turn to prayer, asking him to pardon the former and graciously supply the latter. Likewise, when I know him to be almighty, I turn to him so that he may bend my heart to his statutes. Therefore, the knowledge of God’s omnipotence, omniscience, and his other attributes is indeed theoretical, yet it produces practice within us. And so theology consists partly in contemplation and partly in action.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Loci Communes Theologici: Theological Commonplaces</cite>, (Amsterdam, 1658), p. 1. (Translated by Copilot.)</span></figcaption>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/simon-j-g-burton.html">Simon J.G. Burton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Hallowing of Logic</cite>, p. 2</span></figcaption>

</figure><figure class="quote" id="q-23cb3ef646" data-kw="">
<blockquote><p>A guiding presupposition [of Matthew Barrett’s The Reformation as Renewal] is that the intellectual life of the second half of the thirteenth century was ‘characterized by a Thomistic atmosphere’ and that the later medieval theologians progressively fell away from the classical positions affirmed by Aquinas. Indeed, according to Barrett it was this degeneration away from Thomism in the later middle ages that was a significant catalyst for the Reformation. As soon as this presupposition is outlined, however, it is possible to see that Barrett’s account has, at the very best, an outdated view of later medieval thought. This kind of ‘decline’ narrative has not been maintained by experts in the thought of the period for many years, despite its persistence among historians whose direct acquaintance with scholastic texts ends with the death of Aquinas. The reason is that, outside the Dominican order (and, for that matter, inside it too at least until the middle of the fifteenth century), there never was a ‘Thomistic atmosphere.’ Why it was ever believed that there was one is not clear to me. But it is true to say that we do not pervasively find the kind of narrative Barrett reproduces until after Leo XIII’s Aeterni patris of 1879, and it is hard to avoid the conclusion that this encyclical itself had something to do with bringing about the anachronistic centering of Aquinas in our medieval intellectual history. This was no doubt an unintended consequence of Leo’s action, since it is clear enough that Leo’s motivation had to do with an appraisal of Aquinas’s intellectual weight, not of his influence on later medieval theology and philosophy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cross.html">Richard Cross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘An Accidental Reformation?’ in Hanover Review</cite>, 3.1 (2024)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

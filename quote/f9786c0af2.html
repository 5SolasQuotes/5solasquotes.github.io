<main class="wrap"><figure class="quote" id="q-f9786c0af2" data-kw="">
<blockquote><p>The Orthodox: Good works do not precede one justified, but necessarily follow one justified and precede unto salvation. They are yet ordinarily necessary by adults out of the supposition or necessity: 1. Of presence, as signs and effects of true faith. 2. Of divine command. 3. of a means, so far as they are the way of salvation, a condition and cause sine qua non [without which there is nothing].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Controversy 10, ‘Whether Good Works are Necessary?’ in ‘Of Justification &amp; of Good Works in General’ in Part 4, Controversies with the Papists in Polemical Theology</cite>, … in Seven Parts (Hanau, Germany, 1620), p. 496</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Orthodox: Good works do not precede one justified, but necessarily follow one justified and precede unto salvation. They are yet ordinarily necessary by adults out of the supposition or necessity: 1. Of presence, as signs and effects of true faith. 2. Of divine command. 3. of a means, so far as they are the way of salvation, a condition and cause sine qua non [without which there is nothing].”

— Henry Alsted, Controversy 10, ‘Whether Good Works are Necessary?’ in ‘Of Justification &amp; of Good Works in General’ in Part 4, Controversies with the Papists in Polemical Theology… in Seven Parts (Hanau, Germany, 1620), p. 496">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Orthodox%3A+Good+works+do+not+precede+one+justified%2C+but+necessarily+follow+one+justified+and+precede+unto+salvation.+They+are+yet+ordinarily+necessary+by+adults+out+of+the+supposition+or+necessity%3A+1.+Of+presence%2C+as+signs+and+effects+of+true+faith.+2.+Of+divine+command.+3.+of+a+means%2C+so+far+as+they+are+the+way+of+salvation%2C+a+condition+and+cause+sine+qua+non+%5Bwithout+which+there+is+nothing%5D.%E2%80%9D%0A%0A%E2%80%94+Henry+Alsted%2C+Controversy+10%2C+%E2%80%98Whether+Good+Works+are+Necessary%3F%E2%80%99+in+%E2%80%98Of+Justification+%26+of+Good+Works+in+General%E2%80%99+in+Part+4%2C+Controversies+with+the+Papists+in+Polemical+Theology%E2%80%A6+in+Seven+Parts+%28Hanau%2C+Germany%2C+1620%29%2C+p.+496&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff9786c0af2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f9786c0af2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=The%20Orthodox%3A%20Good%20works%20do%20not,non%20%5Bwithout%20which%20there%20is%20nothing&amp;text=The%20Orthodox%3A%20Good%20works%20do%20not%20precede%20one&amp;text=sine%20qua%20non%20%5Bwithout%20which%20there%20is%20nothing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d21cecd958" data-kw="">
<blockquote><p>But of course good works are necessary as the God-appointed road, on which by grace we are to attain to the possession of eternal life. This naturally can hold not for those elect who die at an age of minority or at the beginning of their rebirth, but only for those who have time and opportunity for good works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics rev. Ernst Bizer</cite>, (Wipf &amp; Stock, 2007), ch. 22, ‘Sanctification’, section 27, p. 580</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-d163ded14a" data-kw="">
<blockquote><p>But if we attend to the four kinds of causes which philosophers bring under our view in regard to effects, we shall find that not one of them is applicable to works as a cause of salvation. The efficient cause of our eternal salvation the Scripture uniformly proclaims to be the mercy and free love of the heavenly Father towards us; the material cause to be Christ, with the obedience by which he purchased righteousness for us; and what can the formal or instrumental cause be but faith?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.14.17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-good-works.html">Justification and Good Works</a> › <a href="../topics/justification/justification-and-good-works/good-works-fruit-not-ground.html">Good works: fruit, not ground</a></span><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a> › <a href="../topics/good-works/necessity-of-good-works/not-for-justification.html">Not for justification</a></span></div>

— John Calvin, Institutes of the Christian Religion, 3.14.17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut%20if%20we%20attend%20to%20the%20four%20kinds%20of%20causes%20which%20philosophers%20bring%20under%20our%20view%20in%20regard%20to%20effects%2C%20we%20shall%20find%20that%20not%20one%20of%20them%20is%20applicable%20to%20works%20as%20a%20cause%20of%20salvation.%20The%20efficient%20cause%20of%20our%20eternal%20salvation%20the%20Scripture%20uniformly%20proclaims%20to%20be%20the%20mercy%20and%20free%20love%20of%20the%20heavenly%20Father%20towards%20us%3B%20the%20material%20cause%20to%20be%20Christ%2C%20with%20the%20obedience%20by%20which%20he%20purchased%20righteousness%20for%20us%3B%20and%20what%20can%20the%20formal%20or%20instrumental%20cause%20be%20but%20faith%3F%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%203.14.17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd163ded14a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d163ded14a.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-62db74b4f4" data-kw="">
<blockquote><p>We are created unto good works which God hath ordained, that we should walk in them as the elect vessels of God, not thereby to merit salvation, but to signify unto the world that we be the elect of God, who being possessed with faith, show forth the fruits of faith, which are our good works, to the example of others, that they may follow in well-doing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-dod.html">Henry Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly &amp; Fruitful Treatise of Faith &amp; Works. Wherein is confuted a certain opinion of merit by works</cite>, (London, 1583), pp. 89-90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“We are created unto good works which God hath ordained, that we should walk in them as the elect vessels of God, not thereby to merit salvation, but to signify unto the world that we be the elect of God, who being possessed with faith, show forth the fruits of faith, which are our good works, to the example of others, that they may follow in well-doing.”

</figure><figure class="quote" id="q-5757b1131c" data-kw="">
<blockquote><p>Wherefore good works are necessary to salvation, certainly not as an efficient or meritorious cause, by an efficient principle; yet they are necessary by a principle of being present, and so a testimony of our living faith, without which faith is dead; and they are required to salvation, not as a cause of ruling, but as a way to the kingdom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/festus-hommius.html">Festus Hommius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 67, ‘Of Good Works’, ‘Whether Good Works are Necessary to Salvation?’ in 70 Theological Disputations Against Papists</cite>, … in a Collection Against Bellarmine (Leiden, 1614), pp. 454-55</span></figcaption>

<main class="wrap"><figure class="quote" id="q-052348ed1c" data-kw="">
<blockquote><p>God’s knowledge doth infinitely differ from ours. We cannot see in the dark, nor can we see many things at once; but it is not so with him, … There is nothing so deep, but God will bring it above-board. Who will bring to light the hidden things of darkness. And he sees many things at once, nay, all are as if they were but one. … All things being represented to him in the pure Crystal, of his own Essence, are but as one individual thing.

Again [unto his eyes.] Eyes are ascribed to God not properly, but Metaphorically; Idols have eyes, yet they see not; God hath no eyes, yet he sees; the eye of God is put in Scripture for his Knowledge; all things are naked to his eye, that is, they are obvious to his Knowledge.</p></blockquote>

</figure><figure class="quote" id="q-3515a30cb9" data-kw="">
<blockquote><p>The Effectual Concurse of the first Cause with the second, is an external transient influence of God, upon the creature in time, exactly answering to the Decree of God before time: moving upon, co-working with, and assisting of the second cause to its operations. It is the clearer understood by considering on God’s part the Decree, which is an immanent and eternal act abiding in God; and his efficiency, which is an external and passing act put forth upon the creature in time.

For the better understanding of the Concurse, Co-operation, and Co-working of the first cause, so far as it concerneth man (which also is respectively applicable to other Subjects) there are considerable two acts in respect of God, viz. an immanent and transient act: and two acts in respect of the soul; viz. a first, and a second act. The immanent, and as it were indwelling Act in God, is his Decree: eternal, increated, and before time. The transient Act of God’s Efficiency, is a created, external, passing Act of the Spirit of God upon the soul in time touching man. The first act, is an active Principle, or inherent Habit in the soul. The operation is the second act, proceeding from that Habit.

The Concurse of the first cause, is unto the active principle in the second cause; as the first mover is unto the inferior Orbes: as an impulse, thrust, or put on, is unto a round body, of it self propense to rowl: as the Nurses lifting the child up the stairs, is unto the child inclined to go up; or as the leading power, put forth of him that goeth before, is to him that is inclined to follow after: as the Midwife is unto the deliverance of her that is in travail; as the wind is unto a vessel under sail, and ready upon the motion of the stream to launch forth: as light is to an open eye, yet in the dark.

The Necessity of the concurrence of the first cause with the second in the operations thereof, appears thus. All creatures depend upon God in respect of their Being, Conservation, and Operation: For in him we live, and move, and have our being, Acts 17.28. We have our being, there is our dependence in respect of our Creation; we live, there is our dependence in respect of our Conservation; we move, there is our dependence in respect of our Operation. Creatures depend no less upon God in respect of operations, then in respect of their beings; because the operations of things in both instants, viz. both of being and of operation, are equally beings of participation.

2. From the perfection of the first Cause; such is the nature of the first Cause being God, and the nature of the second cause being a creature, as that thence necessarily followeth the amplitude of Perfection in the first Cause, and a universal and subordinate dependence in the second cause in respect of its efficiency. In this regard Plato called the second causes the instruments of the first Cause; which though in some respect it holdeth not, because instruments (properly so called) have no proper efficiency; yet so far it is a truth, as that every creature universally dependeth more upon God, then any creature upon its fellow-creature.

3. It implieth a contradiction, that the creature should be able to act without dependency upon the Creator. 1. Because the agent being a creature is depending, therefore its power to act is depending; the power of acting holds proportion with the agent. 2. Because the action proceeding from this agent, is a being by participation: it is impossible for the creature to have other then a depending being.

4. As the conserving influence of God is unto the conservation of the creature, so is the assisting influence of God unto the operation of the creature: If God doth but merely cease his conserving influence, the creature ceaseth to be; if God ceaseth his assisting influence, the creature ceaseth to act. The insensible cessation of the influence of the first Cause, without any further violence, or hurt done, puts a period to the being, or stoppeth the operation of the second cause, respectively.</p></blockquote>

<blockquote><p>For they [Suarezians] place it [the will] in every state always in a certain citadel of integral power, constituted in an equilibrium with full capacity for either side, deflected by no inclination — altogether its own master and arbiter, as it were giving laws to causes and circumstances as they present themselves, commanding them to comply with its nod and to await its direction. Yet the matter is very different. For our will in this state of fallen nature, in which it exists, has greatly weakened and declined from that first state of integrity and innocence, as the Second Council of Orange and the Council of Trent teach us. Moreover, it depends greatly upon the knowledge and presentation of objects and follows the intellect leading it, accommodating itself to it rather than the intellect to it. In addition, it is disturbed by concupiscence — both irascible and concupiscible — by which it is often displaced from its position and dislodged from its right station. It is marvelously and variously affected by movements and perturbations of the soul; sometimes it is pressed and driven by appetite, and sometimes enticed and drawn by pleasure it serves lust. On another side, it is shaken from the movement of appetite and terror, and in its own station it wavers and scarcely maintains its integral liberty. And again — how often is it seized by ignorance and blindness of the mind, and deviates from the straight path of reason? How often, burning with the heat of lust and without a bridle, does it run headlong and is immersed in the mire of pleasures, from which not without sorrow and groaning does it drag itself out defiled? Not rarely do inveterate habits so incline it that it resists them with difficulty. Even the domestic familiarity of custom makes it live with custom as if at home, and causes it to neglect new things, however excellent, as though foreign. Indeed, I have seen nothing more volatile than the will when it is free from affection, nothing more constant when occupied with affection. Nor is it so powerful and mistress of itself as is imagined; since in its first primary acts it is desired and wholly occupied, and suffers involuntarily the assaults of those acts and their concomitant effects. It is bent by counsels, warnings, prayers, threats, loves, terrors, simulations, flatteries, titillations, jests, laughter, applause — by these it is led and drawn, so that it seems to do nothing other than what those authors call the mistress — namely, to serve everyone. And yet even then, when it is affected in so many ways, shaken, changed, drawn, and bent, it preserves its liberty… The will, inclined toward lust, can enjoy a woman and be led by that pleasure and remain free. Will it not be able to remain free when inclined and premoved by God?</p></blockquote>

<div class="actions"><button class="copy" data-copy="“For they [Suarezians] place it [the will] in every state always in a certain citadel of integral power, constituted in an equilibrium with full capacity for either side, deflected by no inclination — altogether its own master and arbiter, as it were giving laws to causes and circumstances as they present themselves, commanding them to comply with its nod and to await its direction. Yet the matter is very different. For our will in this state of fallen nature, in which it exists, has greatly weakened and declined from that first state of integrity and innocence, as the Second Council of Orange and the Council of Trent teach us. Moreover, it depends greatly upon the knowledge and presentation of objects and follows the intellect leading it, accommodating itself to it rather than the intellect to it. In addition, it is disturbed by concupiscence — both irascible and concupiscible — by which it is often displaced from its position and dislodged from its right station. It is marvelously and variously affected by movements and perturbations of the soul; sometimes it is pressed and driven by appetite, and sometimes enticed and drawn by pleasure it serves lust. On another side, it is shaken from the movement of appetite and terror, and in its own station it wavers and scarcely maintains its integral liberty. And again — how often is it seized by ignorance and blindness of the mind, and deviates from the straight path of reason? How often, burning with the heat of lust and without a bridle, does it run headlong and is immersed in the mire of pleasures, from which not without sorrow and groaning does it drag itself out defiled? Not rarely do inveterate habits so incline it that it resists them with difficulty. Even the domestic familiarity of custom makes it live with custom as if at home, and causes it to neglect new things, however excellent, as though foreign. Indeed, I have seen nothing more volatile than the will when it is free from affection, nothing more constant when occupied with affection. Nor is it so powerful and mistress of itself as is imagined; since in its first primary acts it is desired and wholly occupied, and suffers involuntarily the assaults of those acts and their concomitant effects. It is bent by counsels, warnings, prayers, threats, loves, terrors, simulations, flatteries, titillations, jests, laughter, applause — by these it is led and drawn, so that it seems to do nothing other than what those authors call the mistress — namely, to serve everyone. And yet even then, when it is affected in so many ways, shaken, changed, drawn, and bent, it preserves its liberty… The will, inclined toward lust, can enjoy a woman and be led by that pleasure and remain free. Will it not be able to remain free when inclined and premoved by God?”

— Francisco Macedo, Collations of the Teachings of St. Thomas &amp; Scotus, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Factors upon the Will, pp. 376-77">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+they+%5BSuarezians%5D+place+it+%5Bthe+will%5D+in+every+state+always+in+a+certain+citadel+of+integral+power%2C+constituted+in+an+equilibrium+with+full+capacity+for+either+side%2C+deflected+by+no+inclination+%E2%80%94+altogether+its+own+master+and+arbiter%2C+as+it+were+giving+laws+to+causes+and+circumstances+as+they+present+themselves%2C+commanding+them+to+comply+with+its+nod+and+to+await+its+direction.+Yet+the+matter+is+very+different.+For+our+will+in+this+state+of+fallen+nature%2C+in+which+it+exists%2C+has+greatly+weakened+and+declined+from+that+first+state+of+integrity+and+innocence%2C+as+the+Second+Council+of+Orange+and+the+Council+of+Trent+teach+us.+Moreover%2C+it+depends+greatly+upon+the+knowledge+and+presentation+of+objects+and+follows+the+intellect+leading+it%2C+accommodating+itself+to+it+rather+than+the+intellect+to+it.+In+addition%2C+it+is+disturbed+by+concupiscence+%E2%80%94+both+irascible+and+concupiscible+%E2%80%94+by+which+it+is+often+displaced+from+its+position+and+dislodged+from+its+right+station.+It+is+marvelously+and+variously+affected+by+movements+and+perturbations+of+the+soul%3B+sometimes+it+is+pressed+and+driven+by+appetite%2C+and+sometimes+enticed+and+drawn+by+pleasure+it+serves+lust.+On+another+side%2C+it+is+shaken+from+the+movement+of+appetite+and+terror%2C+and+in+its+own+station+it+wavers+and+scarcely+maintains+its+integral+liberty.+And+again+%E2%80%94+how+often+is+it+seized+by+ignorance+and+blindness+of+the+mind%2C+and+deviates+from+the+straight+path+of+reason%3F+How+often%2C+burning+with+the+heat+of+lust+and+without+a+bridle%2C+does+it+run+headlong+and+is+immersed+in+the+mire+of+pleasures%2C+from+which+not+without+sorrow+and+groaning+does+it+drag+itself+out+defiled%3F+Not+rarely+do+inveterate+habits+so+incline+it+that+it+resists+them+with+difficulty.+Even+the+domestic+familiarity+of+custom+makes+it+live+with+custom+as+if+at+home%2C+and+causes+it+to+neglect+new+things%2C+however+excellent%2C+as+though+foreign.+Indeed%2C+I+have+seen+nothing+more+volatile+than+the+will+when+it+is+free+from+affection%2C+nothing+more+constant+when+occupied+with+affection.+Nor+is+it+so+powerful+and+mistress+of+itself+as+is+imagined%3B+since+in+its+first+primary+acts+it+is+desired+and+wholly+occupied%2C+and+suffers+involuntarily+the+assaults+of+those+acts+and+their+concomitant+effects.+It+is+bent+by+counsels%2C+warnings%2C+prayers%2C+threats%2C+loves%2C+terrors%2C+simulations%2C+flatteries%2C+titillations%2C+jests%2C+laughter%2C+applause+%E2%80%94+by+these+it+is+led+and+drawn%2C+so+that+it+seems+to+do+nothing+other+than+what+those+authors+call+the+mistress+%E2%80%94+namely%2C+to+serve+everyone.+And+yet+even+then%2C+when+it+is+affected+in+so+many+ways%2C+shaken%2C+changed%2C+drawn%2C+and+bent%2C+it+preserves+its+liberty%E2%80%A6+The+will%2C+inclined+toward+lust%2C+can+enjoy+a+woman+and+be+led+by+that+pleasure+and+remain+free.+Will+it+not+be+able+to+remain+free+when+inclined+and+premoved+by+God%3F%E2%80%9D%0A%0A%E2%80%94+Francisco+Macedo%2C+Collations+of+the+Teachings+of+St.+Thomas+%26+Scotus%2C+%E2%80%A6+vol.+2+tr.+AI+by+Vertias+%28Padua%3A+Frambotti%2C+1671%29%2C+%2C+bk.+2%2C+Collation+9%2C+pp.+361-429+%7C+Factors+upon+the+Will%2C+pp.+376-77&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faac5bc0451.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/aac5bc0451.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=For%20they%20%5BSuarezians%5D%20place%20it%20%5Bthe,when%20inclined%20and%20premoved%20by%20God&amp;text=For%20they%20%5BSuarezians%5D%20place%20it%20%5Bthe%20will%5D%20in&amp;text=remain%20free%20when%20inclined%20and%20premoved%20by%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8d08e1330a" data-kw="Holiness Author of sin">
<blockquote><p>Though the natural virtue of doing a sinful action be from God, and supported by him, yet this doth not blemish the holiness of God. While God concurs with them in the act, he instills no evil into men. … The physical goodness of the action depends on God, the moral evil on the creature.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-e8e8486529" data-kw="">
<blockquote><p>The Dr. holds him upon kneeling in receiving the sacramental elements, and denies that it is scandalous or any way inductive to spiritual ruin. But (if he will) he may consider that the ruder sort who can not distinguish betwixt worshipping the bread and worshipping before the bread, nor discern how to make Christ the passive object of that worship and the bread the active, and how to worship Christ in the bread, and make the worship relative from the bread to Christ; are by his example induced to bread-worship, when they perceive bowing down before the consecrated bread in the very same form and fashion wherein Papists are seen to worship it, but can not conceive the nice distinctions which he and his companions use to purge their kneeling in that act from idolatry. As for others who have more knowledge, they are also induced to ruin, being animated by his example to do that which their consciences do condemn.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | pt. 2, ch. 9; p. 44</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-087cf1b950" data-kw="">
<blockquote><p>Words signify by general custom, and have the same sense out of the worship of God as in it; and therefore the arguing from their lawfulness as signs of worship unto the lawfulness of instituted signs seems liable to exception. Nevertheless it may be said that instituted signs soon become customary and as well understood as words… With acknowledgment of my own weakness, I express my apprehensions of this matter. God has allowed words for signs expressive of divine worship, but I find not that He has allowed words only and forbidden gestures and actions for such an end. The dumb [who can’t speak] must express their internal worship by gestures and actions or they cannot externally worship God at all. If signs of devotion that are of customary signification be lawful, I see not why such as are of instituted signification should be unlawful, and especially when they become as customary, as those that have been without institution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of the Reverend &amp; Learned Mr. John Corbet</cite>, Of Divine Worship, in Three Parts in The Remains of the Reverend &amp; Learned Mr. John Corbet… (London: Parkhurst, 1684), pt. 3, section 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a916fff20e" data-kw="">
<blockquote><p>What ought to be the gesture of him that prays? A diverse gesture is not prescribed, but yet is described in the Scriptures:

1. The Jews in time past did pray somtimes standing, but sometimes with bowed knees, as Solomon and Christ Himself kneeled down and prayed, as also Peter and Stephen; Paul also used bowing of the knees, Eph. 3:14, “For this cause (says he) I bow my knees unto the Father of our Lord Jesus Christ,” by which gesture a lowly subjection, and an emptying of ourselves before God is signified.

2. Moses lifts up his hands towards Heaven, and Paul wills, 1 Tim. 2:8, that pure hands should be lifted up unto God: which gesture belongs unto children who do reach their hand to the parents when they will obtain anything or are suppliant to them. But this ceremony of lifting up of hands does admonish us, that the heart and senses are to be lifted upon high, least they which desire to be heard of God should abide in their dregs, as David interprets Ps. 86:4; 25:1, “Unto Thee O Lord I lift up my soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, (1606), p. 416</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

 Books Online</a></div>
</figure><figure class="quote" id="q-60e895d05e" data-kw="">
<blockquote><p>Paybody [a Formalist] thinks kneeling in the act of receiving the communion to be expedient for the reverend using and handling of that holy sacrament, and that much reverence arises to the sacrament from it. Answer: I verily believe that more reverence arises to the sacrament from kneeling than is due to it; But I am sure there is no less true reverence of that holy sacrament among such as kneel not in the receiving of it than among such as do kneel. I hope it is not unknown how humbly and reverently many sincere Christians, with fear and trembling, do address themselves to that most holy sacrament, who yet for all the world, would not kneel in receiving it. Thus we see that these expediencies pretended for the ceremonies are attained unto as well and better without them, than by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | 2nd Part, ch. 2, ‘Against those of our Opposites, who plead for the Ceremonies as things expedient’, p. 14</span></figcaption>

</figure><figure class="quote" id="q-4a09b631be" data-kw="">
<blockquote><p>This gesture (says the Rejoinder [of the opponent]) may before, or by occasion of any of God’s ordinances, be performed lawfully to God. By occasion, I grant: but ‘before’ importes more: Might the Jews kneel before the cherubims of the vail, as they might before the ark? Might they kneel before the brazen-serpent? Might they before every ephod? May we before every pastor? When the Rejoinder has resolved these questions, we shall further consider.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Kneeling’ in ch. 4, ‘Concerning Idolatrous Ceremonies’ in A Fresh Suit Against Human Ceremonies in God’s Worship</cite>, … (Amsterdam, 1633), pp. 428-53, p. 428</span></figcaption>

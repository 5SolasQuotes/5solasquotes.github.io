<main class="wrap"><figure class="quote" id="q-9cc146db27" data-kw="">
<blockquote><p>We agree that good works are pleasing to God, that we may work with the thought of profit… that works have some relation of order and connection with eternal life, as between means and ends, the relation of way to goal, of competition to prize, of antecedent to consequent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As translated by Heppe, Reformed Dogmatics</cite>, (Wipf &amp; Stock, 2007), ch. 22, ‘Sanctification’, section 27, p. 580. Heppe gives as the reference in Rissen: XV, 8, 1, but we have not been able to find it there.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6f6fc665e9" data-kw="">
<blockquote><p>The passages in which it is said that God will reward every man according to his works are easily disposed of. For that mode of expression indicates not the cause but the order of sequence. … Hence it appears, that working is not at all opposed to grace, but refers to pursuit, and, therefore, it follows not that believers are the authors of their own salvation, or that it is the result of their works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-good-works.html">Justification and Good Works</a> › <a href="../topics/justification/justification-and-good-works/good-works-fruit-not-ground.html">Good works: fruit, not ground</a></span><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a> › <a href="../topics/good-works/necessity-of-good-works/not-for-justification.html">Not for justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“The passages in which it is said that God will reward every man according to his works are easily disposed of. For that mode of expression indicates not the cause but the order of sequence. … Hence it appears, that working is not at all opposed to grace, but refers to pursuit, and, therefore, it follows not that believers are the authors of their own salvation, or that it is the result of their works.”

</figure><figure class="quote" id="q-88e688816e" data-kw="">
<blockquote><p>…of order such as the middle has to the end, the antecedent to the consequent, the necessary condition to the effect, of which condition the presence indeed does not effect, but the absence can hinder, salvation;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, p. 1029 of Book 4, ch. 7, ‘Proofs of Bellarmine out of the Scripture for the Necessity of Works Acting Efficiently unto Salvation, Refuted’ in Of Robert Bellarmine’s of the Justification of the Ungodly, Explicated &amp; Castigated in Five Books (Heidelberg, 1615) as translated in William Forbes, Justification, p. 309</span></figcaption>

</figure><figure class="quote" id="q-3bd0cf9000" data-kw="">
<blockquote><p>The necessity of repentance, as a means, we here also acknowledge, seeing that to the impenitent there can be neither salvation nor remission of sin, etc. Remission of sin belongs to it, neither formally, nor meritoriously, nor satisfactorily, but at most:

1. Conditionally, as this is offered to us in the gospel, on the condition of repentance and faith.

2. Dispositively, etc.

3. Judicatively and ostensively, etc. Far be it from us therefore to make that remission with the Papists to be an effect properly so called of repentance; when that is due only to God’s grace by Christ, etc. But it’s partly a necessary consequent adjunct of it, in as much as under that condition, as also of new obedience (though not for it), remission of sins is propounded and offered to us, seeing it is inconvenient to remit sin to him that perseveres in sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-maresius.html">Samuel Maresius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collegium theologicum</cite>, ... (1649) trans. in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 3, pp. 407-8 | locus 13, p. 337</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-1ca5a91e18" data-kw="">
<blockquote><p>for as much as final infidelity and impenitency are the meritorious causes of damnation; but faith, repentance and good works are but the disposing causes of salvation. Yet like as God inflicts not damnation but by way of punishment, so he doth not bestow salvation, on any of ripe years, but by way of reward. Yet here also is a difference; for damnation is inflicted by way of punishment for the evil works’ sake which are committed: but salvation is not conferred by way of reward for the good works’ sake which are performed, but merely for Christ’s sake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Synod of Dort &amp; Arles Reduced to the Practice</cite>, (1631), p. 42</span></figcaption>

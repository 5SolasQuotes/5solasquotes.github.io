<main class="wrap"><figure class="quote" id="q-0dc4279b47" data-kw="">
<blockquote><p>Behold then the inordinate dealing and arrogant presumption of you Brownists… professing to set up discipline, and glorying that you suffer for it, do break and utterly abolish the rules thereof given by Christ, by your utter forsaking and abandoning all the assemblies in England: for let it be confessed that the errors, the sins, the imperfections, the spots, and deformities of our Church be many, so that she is not in her general estate so fair as the fairest of her sisters: yet has she heretofore had, and now has, many noble children, richly adorned with heavenly jewels, and precious gifts of learning knowledge, faith, and godliness. And howsoever the Papists one way, and the Brownists another way, do aggravate her crimes with pestilent slanders, yet shall they never prove that either in doctrine or manners she is guilty of any fundamental crime which separates from Christ and destroys the life and being of a true Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gifford.html">George Gifford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Treatise Against the Donatists of England, whom we call Brownists</cite>, … (London, 1590), p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d73f9ef76a" data-kw="">
<blockquote><p>For the work of peace, at the persuasion of some friends, he took a journey thitherward [to Lutheran Sweden], where he arrived in June, anno 1636… a resolution was taken to permit Master Dury to treat with the divines of that kingdom… to which he might address himself particularly, and lay open his intention… There he had conference both collegially and severally with the professors of divinity, who gave full assent unto his desires, and set down these conditions, upon which they were ready to agree, and join with the reformed side: 1. That a full agreement should be made in all the fundamental articles of Faith. 2. That all errors overthrowing the foundation, or tending to overthrow the same, should be condemned. 3. That in matters ceremonial and of indifferency, there should be a mutual toleration. 4. That betwixt the parties, united sincerity and uprightness should be maintained, lest ancient errors might be upheld under doubtful speeches. 5. That when peace is made, none should be suffered to maintain, excuse or spread any more the errors once condemned. 6. That ambitious and needless disputes and brabblings should be inhibited on all sides. 7. That former reproaches and injuries should be put to oblivion. 8. That the Church government should be settled according to apostolical rules. These demands the rest agreed unto, neither was any thing of moment added thereunto by any.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dury.html">John Dury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quote on Dury</cite>, Samuel Hartlib, A Brief Relation of that which has been Lately attempted to Procure Ecclesiastical Peace amongst Protestants (London: I.R., 1641), pp. 16-17</span></figcaption>

</figure><figure class="quote" id="q-8f0bc1b9f9" data-kw="">
<blockquote><p>He did not desire to nourish fights of one faction againt another; he knew that the truth is difficult to come by through polemics; and it was in the truth that he wanted consensus. If the fundamentals of the Christian faith could be agreed upon, then the controversies that were plaguing the Church could be accommodated ‘without ill will [Greek] [fairly, reasonably, equitably] and for the general restoration in every way of concord in the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brian-lugioyo.html">Brian Lugioyo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Martin Bucer’s Doctrine of Justification: Reformation Theology &amp; Early Modern Irenicism</cite>, (Oxford Univ. Press, 2010) 260 pp. ToC, p. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<main class="wrap"><figure class="quote" id="q-c07db99cb4" data-kw="">
<blockquote><p>…nothing which is evil in the use of it [though it be otherwise indifferent] may be done for any good whatsoever. 2. The difference betwixt that which is simply evil, and that which is evil in use and by accident [though it is otherwise indifferent], is in that the one may never be done, the other is unlawful only pro tempore [for the time]: but in this they agree, that both are unlawful; for that which is evil by accident, whiles it is such, is unlawful to be done, no less than that which is in nature evil. (Paraeus on 1 Cor. 10:23)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, ... ([Leiden] 1637), | pt. 2, ch. 1, pp. 9-10, p. 10</span></figcaption>

</figure><figure class="quote" id="q-548c34f841" data-kw="">
<blockquote><p>Gregory says in a homily (vi in Evang.): ‘An idle word is one that lacks either the usefulness of rectitude or the motive of just necessity or pious utility.’ But an idle word is an evil, because ‘men… shall render an account of it in the day of judgment’ (Mt. 12:36): while if it does not lack the motive of just necessity or pious utility, it is good. Therefore every word is either good or bad. For the same reason every other action is either good or bad. Therefore no individual action is indifferent. …It sometimes happens that an action is indifferent in its species, but considered in the individual it is good or evil. And the reason of this is because a moral action… derives its goodness not only from its object, whence it takes its species; but also from the circumstances, which are its accidents, as it were; just as something belongs to a man by reason of his individual accidents, which does not belong to him by reason of his species. And every individual action must needs have some circumstance that makes it good or bad, at least in respect of the intention of the end. For since it belongs to the reason to direct; if an action that proceeds from deliberate reason be not directed to the due end, it is, by that fact alone, repugnant to reason, and has the character of evil. But if it be directed to a due end, it is in accord with reason; wherefore it has the character of good. Now it must needs be either directed or not directed to a due end. Consequently every human action that proceeds from deliberate reason, if it be considered in the individual, must be good or bad.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pt. 2, pt. 1, question 18, ‘Of the Good &amp; Evil of Human Acts in General’ in Summa | 9. ‘Whether an individual action can be indifferent?’ [No]</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-26f04c7fb2" data-kw="">
<blockquote><p>Objection [of opponents]: In matters plainly determined by Scripture, rulers are to follow the Word of God; but in matters circumstantial or indifferent, where Scripture says neither for the one side, nor for the other, what rulers think good, is to be followed, there being no evil nor impiety in that which they command. Answer 1: This is to make rulers in matters of salvation liable to the Scriptures of God; but in matters which men call indifferent to make them Popes, and to hang our consciences upon their sleeve, which is most absurd:

1. Because Paul in matters most indifferent, of days and meats, would not have the Romans to hang upon his judgment, but will rule both their practice and his own by the Law of nature: ‘Murder not,’ ‘Scandalize not.’

2. What rulers think good is not a rule for constitutions and for people’s obedience in matters circumstantial; but the rule of rulers here in making laws, and of people in obeying laws, is goodness itself, order, decency, aptitude to edify, in things that they command; for it were strange if in matters that they call of salvation, not thoughts, but the Word of God should rule and square canon-makers, but in matters indifferent, their thoughts should be a law.

3. Scripture and the Law of nature, and right reason, which is a deduction from Scripture, is able sufficiently in all canons and constitutions to regulate both rulers and people, and to determine what is conventent in circumstances; and the Lord here is an infallible Judge, speaking in his Word, as He is in all matters, which they call fundamental; yea, the Scripture shall be imperfect in the duties of the Second Table, if it do not determine what is active scandal, or soul murder, as it does determine what is idolatry, what is lawful worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), Appendix, Intro, ‘Whether or no things indifferent can be commanded because indifferent?’, p. 656</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

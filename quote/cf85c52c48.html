<main class="wrap"><figure class="quote" id="q-cf85c52c48" data-kw="">
<blockquote><p>What is the “kingdom of God”? It is the dominion of God, his reign in the soul by his law written upon the heart; his reign in that community of souls which is called the church; his reign in the souls of all men in the end, except those in hell. The kingdom of God is opposed to the kingdom of the devil, and to the kingdom of man undertaking to reign without God, and to the kingdom of man, who, as a civil magistrate and swordbearer, can only restrain evil-doers and protect those who do well by force.

We see its beginning in Genesis iii. 15 in opposition to the kingdom of the devil and the beastly nature of fallen man (now become the image of the devil). Here it is the kingdom of God in man, or in the woman’s seed; the kingdom of man in God or God in man in opposition to the kingdom of man without God or against God. We see it again in the family of Abraham: in Israel after the flesh (theocracy), especially in the typical kingdoms of David and Solomon. Again in opposition to the kingdom of the beasts in Daniel, as the kingdom of the “Son of man.” Then again in Revelation in opposition to the kingdom of the beast, and finally prevailing and absorbing the kingdom of the world (the sovereignty of the world which had lasted for centuries becoming the sovereignty of our Lord and of his Christ) in Rev. xi. 15.

The kingdom of God, therefore, is the theocracy (the only kind of government which would have existed in the world if man had not apostatized from his Maker); sometimes the theocracy in its laws and principles of administration; sometimes, in its personnel, when it is equivalent to church (during the present militant condition of the kingdom); sometimes as to its internal growth; sometimes as to its external growth; sometimes in its militant, sometimes in its triumphant, state; but the fundamental idea always is that of a theocracy, of a government of God which is consented to (either in reality or pretence) by man; and always a government of God administered by man; and in the New Testament (when the incarnation has become plainly revealed) by the God-man, the “Son of man” (the special sense of which phrase is “the King” and “Head of the kingdom”); hence the association in the Gospels of the “kingdom of God” or “heaven” with the “Son of man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Notes on the Acts of the Apostles</cite>, in Miscellanies of Rev. Thomas E. Peck, D.D., LL.D., Professor of Theology in the Union Theological Seminary in Virginia, ed. T. C. Johnson (3 vols, Richmond VA: The Presbyterian Committee of Publication, 1895-97), 3: 44-45.</span></figcaption>

<blockquote><p>Q. So much of the breaches of this Commandment against the body alone: what are they that are against the soul?

A. When Ministers are either Idol Shepherds, and cannot; or idle, and will not feed the flock committed to their charge: or for the most part neglect their own, and busy themselves elsewhere, without any necessary and lawful calling. Secondly, when Magistrates, that procure not as much as in them lieth, that the people under their government, do frequent the hearing of the Word read and preached, and receiving of the Sacraments, in the appointed times.

Q. Are inferiors also guilty of this sin?

A. Yea verily: all those people that have no knowledge, especially having had the ordinary means appointed of God for obtaining the same, either of their own, or of others, which they might have been the partakers of.

Q. How do both Superiors and Inferiors kill the soul?

A. By evil example of life: contrary whereunto is, to provoke one another to love, to give no offence, neither to Jews nor Gentiles, nor to the Church of God. Also in not rebuking our neighbour when he is in fault, but suffering him to sin.</p></blockquote>

<blockquote><p>But let them arm themselves with the divine law which says: “What God has joined together, let no man put asunder” [Matt. 19:6]. For the joining together of a man and a woman is of divine law and is binding, however much it may conflict with the laws of men; the laws of men must give way before it without any hesitation. For if a man leaves father and mother and cleaves to his wife [Matt. 19:5], how much more will he tread underfoot the silly and wicked laws of men, in order to cleave to his wife! And if pope, bishop, or official should annul any marriage because it was contracted contrary to the laws of men, he is Antichrist, he does violence to nature, and is guilty of treason against the Divine Majesty, because this word stands: “What God has joined together, let no man put asunder” [Matt. 19:6].

Besides this, no man had the right to frame such laws, and Christ has granted to Christians a liberty which is above all the laws of men, especially where a law of God conflicts with them. … Moreover, such laws were condemned beforehand by Paul when he foretold that there would be men forbidding to marry [I Tim. 4:3]. Here, therefore, those inflexible impediments derived from affinity, by spiritual or legal relationship, and from blood relationship must give way, so far as the Scriptures permit, in which the second degree of consanguinity alone is prohibited.

Thus it is written in Lev. 18[:6-18], where there stepmother, full sister, half-sister by either parent, granddaughter, father’s or mother’s sister, half-sister by either parent, granddaughter, father’s or mother’s sister, daughter-in-law, brother’s wife, wife’s sister, stepdaughter, and his uncle’s wife. Here only the first degree of affinity and the second degree of consanguinity are forbidden; yet not without exception, as will appear on closer examination, for the brother’s or sister’s daughter – the niece – is not included in the prohibition, although she is in the second degree. Therefore, if a marriage has been contracted outside of these degrees, which are the only ones which have been prohibited by God’s appointment, it should by no means be annulled on account of the laws of men. For marriage itself, being a divine institution, is incomparably superior to any laws, so that marriage should not be annulled for the sake of the law, rather the laws should be broken for the sake of marriage.</p></blockquote>

— Martin Luther, The Babylonian Captivity of the Church, (1520) in Luther’s Works, trans. A. T. Steinhauser, ed. A. R. Wentz (55 vols, Philadelphia PA: Fortress Press, 1959), 36: 98-99.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+let+them+arm+themselves+with+the+divine+law+which+says%3A+%E2%80%9CWhat+God+has+joined+together%2C+let+no+man+put+asunder%E2%80%9D+%5BMatt.+19%3A6%5D.+For+the+joining+together+of+a+man+and+a+woman+is+of+divine+law+and+is+binding%2C+however+much+it+may+conflict+with+the+laws+of+men%3B+the+laws+of+men+must+give+way+before+it+without+any+hesitation.+For+if+a+man+leaves+father+and+mother+and+cleaves+to+his+wife+%5BMatt.+19%3A5%5D%2C+how+much+more+will+he+tread+underfoot+the+silly+and+wicked+laws+of+men%2C+in+order+to+cleave+to+his+wife%21+And+if+pope%2C+bishop%2C+or+official+should+annul+any+marriage+because+it+was+contracted+contrary+to+the+laws+of+men%2C+he+is+Antichrist%2C+he+does+violence+to+nature%2C+and+is+guilty+of+treason+against+the+Divine+Majesty%2C+because+this+word+stands%3A+%E2%80%9CWhat+God+has+joined+together%2C+let+no+man+put+asunder%E2%80%9D+%5BMatt.+19%3A6%5D.%0A%0ABesides+this%2C+no+man+had+the+right+to+frame+such+laws%2C+and+Christ+has+granted+to+Christians+a+liberty+which+is+above+all+the+laws+of+men%2C+especially+where+a+law+of+God+conflicts+with+them.+%E2%80%A6+Moreover%2C+such+laws+were+condemned+beforehand+by+Paul+when+he+foretold+that+there+would+be+men+forbidding+to+marry+%5BI+Tim.+4%3A3%5D.+Here%2C+therefore%2C+those+inflexible+impediments+derived+from+affinity%2C+by+spiritual+or+legal+relationship%2C+and+from+blood+relationship+must+give+way%2C+so+far+as+the+Scriptures+permit%2C+in+which+the+second+degree+of+consanguinity+alone+is+prohibited.%0A%0AThus+it+is+written+in+Lev.+18%5B%3A6-18%5D%2C+where+there+stepmother%2C+full+sister%2C+half-sister+by+either+parent%2C+granddaughter%2C+father%E2%80%99s+or+mother%E2%80%99s+sister%2C+half-sister+by+either+parent%2C+granddaughter%2C+father%E2%80%99s+or+mother%E2%80%99s+sister%2C+daughter-in-law%2C+brother%E2%80%99s+wife%2C+wife%E2%80%99s+sister%2C+stepdaughter%2C+and+his+uncle%E2%80%99s+wife.+Here+only+the+first+degree+of+affinity+and+the+second+degree+of+consanguinity+are+forbidden%3B+yet+not+without+exception%2C+as+will+appear+on+closer+examination%2C+for+the+brother%E2%80%99s+or+sister%E2%80%99s+daughter+%E2%80%93+the+niece+%E2%80%93+is+not+included+in+the+prohibition%2C+although+she+is+in+the+second+degree.+Therefore%2C+if+a+marriage+has+been+contracted+outside+of+these+degrees%2C+which+are+the+only+ones+which+have+been+prohibited+by+God%E2%80%99s+appointment%2C+it+should+by+no+means+be+annulled+on+account+of+the+laws+of+men.+For+marriage+itself%2C+being+a+divine+institution%2C+is+incomparably+superior+to+any+laws%2C+so+that+marriage+should+not+be+annulled+for+the+sake+of+the+law%2C+rather+the+laws+should+be+broken+for+the+sake+of+marriage.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+The+Babylonian+Captivity+of+the+Church%2C+%281520%29+in+Luther%E2%80%99s+Works%2C+trans.+A.+T.+Steinhauser%2C+ed.+A.+R.+Wentz+%2855+vols%2C+Philadelphia+PA%3A+Fortress+Press%2C+1959%29%2C+36%3A+98-99.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4b418b5d8a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4b418b5d8a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/12/09/martin-luther-on-the-evil-of-forbidding-marriage/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

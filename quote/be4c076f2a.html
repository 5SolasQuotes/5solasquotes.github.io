<main class="wrap"><figure class="quote" id="q-be4c076f2a" data-kw="">
<blockquote><p>When Paul says, “The law is not of faith,” he sets down the main difference between the law and the gospel. The law promises life to him that performs perfect obedience, and that for his works. The gospel promises life to him that does nothing in the cause of his salvation, but only believes in Christ. And it promises salvation to him that believes, yet not for his faith, or for any works else, but for the merit of Christ. The law then requires doing to salvation; and the gospel, believing, and nothing else.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e0985778de" data-kw="">
<blockquote><p>The difference between us here is not: (1) Whether both these [the Covenant of Works with Adam and the Mosaic Covenant] be called covenants in Scripture? Nor (2) Whether there was no grace at all in both, or either of them; for we are agreed , it is grace in God to enter into covenant with man, whatever that covenant be. Nor (3) Whether the Sinai law be not a covenant of works to some men, by their own fault and occasion? Nor (4) Whether the Scriptures do not many times speak of it in that very sense and notion wherein carnal justiciaries apprehend and take it; and by rejecting Christ, make it so to themselves? Nor (5) Whether the very matter of the law of nature be not revived and represented in the Sinai law? These are not the points we contend about. But the question is: Whether the Sinai law do in its own nature, and according to God’s purpose and design in the promulgation of it, revive the law of nature, to the same ends and uses it served to in Adam’s covenant; and so be properly and truly a covenant of works? Or whether God had not gracious and evangelical ends and purposes, viz. by such a dreadful representation of the severe and impracticable terms of the first covenant, instead of obliging them to the personal and punctual observance observance of them for righteousness and life, He did not rather design to convince them of the impossibility of legal righteousness, humble proud nature, and show them the necessity of betaking themselves to Christ, now exhibited in the new covenant, as the only refuge to fallen sinners?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis et Foederis [Vindications of the Law and Covenant]: or a Reply to Mr. Philip Cary’s Solemn Call in Works, vol. 6</cite>, p. 323</span></figcaption>

<blockquote><p>Ver. 24. Which things are a typical history; for these two women represent the two covenants, with the churches thereto adhering respectively; the one from Mount Sinai, to wit, the covenant of works, which was given there, and where the Jewish synagogue, under that covenant, had its beginning: this bringeth forth children indeed, but such children as are mere mercenary worshippers, and under the bondage of that covenant, its curses and commands; and this is that represented by Agar the bondwoman, and that very conveniently. Ver. 25. (Gr. To gar Agar, Sina oros estin en te Arabia, &amp;c.), For as to that allegorical Agar, the mountain Sinai is in Arabia, where lived Agar and her son; and the same Sinai answers well to the earthly Jerusalem, the now Jewish synagogue, nothing being heard from either of them, but Do and Live: but Sinai still but serves with the legalists her children, Sinai and her covenant, because it was never designed but to be subservient to the covenant of grace, as Hagar to Sarah; her children, the legalists, following the state of the venter i. e. the womb from whence they came, are but in the state of bond-servants; not in the state of sons and heirs, more than Ishmael had Isaac’s privilege. “26 But Jerusalem which is above, is free, which is the mother of us all. 27 For it is written, Rejoice thou barren, that bearest not; break forth and cry, thou that travailest not: for the desolate hath many more children than she which hath an husband.” Ver. 26. But the other covenant, the covenant of grace, with the church adhering thereto, to wit, the church of believers in Christ, which is the heavenly Jerusalem, enjoying the reality of all the typical external privileges which the earthly Jerusalem had, which covenant and church is the mother of us all, Jews or Gentiles, that believe in Christ, even she is free: the covenant is served, but serves not as Sarah; the church is mistress of the family, being Christ’s spouse; and her children sons and heirs, as Sarah and her Isaac. Ver. 27. I say, the Christian church is that free mother of us all; for Isaiah in his 54th chap. ver. 1. with an eye to that typical history of Hagar and Sarah, in Abraham’s family, after he had spoke of the sufferings of Christ, immediately addressseth himself to her, as she was in her very first days before the preaching of the gospel by the apostles, saying, Rejoice thou that, as Sarah, art yet barren, thy children making no figure in comparison of the synagogue, break forth over all thy discouragements, and cry for joy, though thou travailest not yet to bring forth children, as thou shalt do ere long by the preaching of the apostles, after the effusion of the Holy Ghost on them: for though thou seem desolate as a widow, thy husband being yet in his state of humiliation, and so very little known, thou shalt have many more children, even such as shall join themselves to thee as members, than the Jewish synagogue, which only seems to have God for her husband. This shall be as sure to thee as if thou hadst all these children about thy hand already. “28 Now we, brethren, as Isaac was, are the children of promise.” Ver. 28. Now, brethren, to apply the whole unto us, ye see, we who adhere to the covenant of grace are such children as Isaac, even children of promise; born unto God by virtue of the absolute promise; not by the strength of nature or by our own works. “29 But as then be that was born after the flesh persecuted him that was born after the Spirit, even so it is now. “30 Nevertheless, what saith the scripture? Cast out the bond-woman and her son: for the son of the bond-woman shall not be heir with the son of the free-woman.” Ver. 29. But as then Ishmael persecuted Isaac, so now the legalists, children of the covenant of works, persecute the children of the covenant of grace. Ver. 30. Nevertheless, what saith the scripture? even, Cast out Hagar and Ishmael, for he shall not be heir with Isaac. The same sentence is passed against the Jewish synagogue, and all that adhere to the covenant of works; they shall be rejected and cast out of the society of saints, for they shall never partake of the heavenly inheritance with those that believe in Christ. “31 So then, brethren, we are not children of the bond-woman, but of the free.” Ver. 31. Therefore, seeing we are children of promise, as Isaac, we are not under the legal covenant, but the covenant of grace, and so are free; and therefore have nothing to do with the law.</p></blockquote>

n+Christ%2C+which+is+the+heavenly+Jerusalem%2C+enjoying+the+reality+of+all+the+typical+external+privileges+which+the+earthly+Jerusalem+had%2C+which+covenant+and+church+is+the+mother+of+us+all%2C+Jews+or+Gentiles%2C+that+believe+in+Christ%2C+even+she+is+free%3A+the+covenant+is+served%2C+but+serves+not+as+Sarah%3B+the+church+is+mistress+of+the+family%2C+being+Christ%E2%80%99s+spouse%3B+and+her+children+sons+and+heirs%2C+as+Sarah+and+her+Isaac.+Ver.+27.+I+say%2C+the+Christian+church+is+that+free+mother+of+us+all%3B+for+Isaiah+in+his+54th+chap.+ver.+1.+with+an+eye+to+that+typical+history+of+Hagar+and+Sarah%2C+in+Abraham%E2%80%99s+family%2C+after+he+had+spoke+of+the+sufferings+of+Christ%2C+immediately+addressseth+himself+to+her%2C+as+she+was+in+her+very+first+days+before+the+preaching+of+the+gospel+by+the+apostles%2C+saying%2C+Rejoice+thou+that%2C+as+Sarah%2C+art+yet+barren%2C+thy+children+making+no+figure+in+comparison+of+the+synagogue%2C+break+forth+over+all+thy+discouragements%2C+and+cry+for+joy%2C+though+thou+travailest+not+yet+to+bring+forth+children%2C+as+thou+shalt+do+ere+long+by+the+preaching+of+the+apostles%2C+after+the+effusion+of+the+Holy+Ghost+on+them%3A+for+though+thou+seem+desolate+as+a+widow%2C+thy+husband+being+yet+in+his+state+of+humiliation%2C+and+so+very+little+known%2C+thou+shalt+have+many+more+children%2C+even+such+as+shall+join+themselves+to+thee+as+members%2C+than+the+Jewish+synagogue%2C+which+only+seems+to+have+God+for+her+husband.+This+shall+be+as+sure+to+thee+as+if+thou+hadst+all+these+children+about+thy+hand+already.+%E2%80%9C28+Now+we%2C+brethren%2C+as+Isaac+was%2C+are+the+children+of+promise.%E2%80%9D+Ver.+28.+Now%2C+brethren%2C+to+apply+the+whole+unto+us%2C+ye+see%2C+we+who+adhere+to+the+covenant+of+grace+are+such+children+as+Isaac%2C+even+children+of+promise%3B+born+unto+God+by+virtue+of+the+absolute+promise%3B+not+by+the+strength+of+nature+or+by+our+own+works.+%E2%80%9C29+But+as+then+be+that+was+born+after+the+flesh+persecuted+him+that+was+born+after+the+Spirit%2C+even+so+it+is+now.+%E2%80%9C30+Nevertheless%2C+what+saith+the+scripture%3F+Cast+out+the+bond-woman+and+her+son%3A+for+the+son+of+the+bond-woman+shall+not+be+heir+with+the+son+of+the+free-woman.%E2%80%9D+Ver.+29.+But+as+then+Ishmael+persecuted+Isaac%2C+so+now+the+legalists%2C+children+of+the+covenant+of+works%2C+persecute+the+children+of+the+covenant+of+grace.+Ver.+30.+Nevertheless%2C+what+saith+the+scripture%3F+even%2C+Cast+out+Hagar+and+Ishmael%2C+for+he+shall+not+be+heir+with+Isaac.+The+same+sentence+is+passed+against+the+Jewish+synagogue%2C+and+all+that+adhere+to+the+covenant+of+works%3B+they+shall+be+rejected+and+cast+out+of+the+society+of+saints%2C+for+they+shall+never+partake+of+the+heavenly+inheritance+with+those+that+believe+in+Christ.+%E2%80%9C31+So+then%2C+brethren%2C+we+are+not+children+of+the+bond-woman%2C+but+of+the+free.%E2%80%9D+Ver.+31.+Therefore%2C+seeing+we+are+children+of+promise%2C+as+Isaac%2C+we+are+not+under+the+legal+covenant%2C+but+the+covenant+of+grace%2C+and+so+are+free%3B+and+therefore+have+nothing+to+do+with+the+law.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+The+Whole+Works+of+Thomas+Boston%3A+Sermons+and+Discourses+on+Several+Important+Subjects+in+Divinity%2C+ed.+Samuel+M%E2%80%98Millan%2C+vol.+6+%28Aberdeen%3A+George+and+Robert+King%2C+1849%29%2C+266%E2%80%9368.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcdd7018578.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cdd7018578.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/02/boston-on-works-and-grace-in-galatians-4/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

</figure><figure class="quote" id="q-3a2e559560" data-kw="believer obedience not punishment">
<blockquote><p>In the state of grace, it binds the believer only to obedience, not to punishment because there is no condemnation to those who are in Christ (Rom. 8:1), whose transgressions are forgiven (Ps. 32:1). Rather the question concerns the state of sin—whether in it the sinner is bound to both (which we assert). First, from the twofold condition of sinful man, who is both a creature and a sinful creature. As a creature, he owes to God obedience forever and never can be discharged from it. As a sinner, he owes punishment.</p></blockquote>

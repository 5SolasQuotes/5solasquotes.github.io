<main class="wrap"><figure class="quote" id="q-23153d0d1f" data-kw="">
<blockquote><p>It is well known to those that have been conversant in the writings of the Fathers, and confessed by [Robert] Bellarmine himself [a Roman apologist] (De Rom. Pont., bk. 3, ch. 5) that the Primitive Church was taught to look for Antichrist upon the dissolution of the Roman Empire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-garrett.html">Walter Garrett</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pt. 1, Ch. 1, ‘Of the Time of Antichrist’s Coming according to the Doctrine of the Primitive Church. The same confirmed from the Angel’s Interpretation of the Vision [of the Great Whore], Rev. 17′ in A Discourse Concerning Antichrist, Grounded upon the Angel’s Interpretation of the Vision, Rev. 17:3 and from thence proceeding to a particular Explication of the 12th and 13th chapters. Showing that the Church of Rome is that woman mentioned, Rev. 17:3, and the bishops of Rome [are] that Eighth King spoken of, v. 11, who is usually known by the name of Antichrist (London, 1680)</cite>, p. 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is well known to those that have been conversant in the writings of the Fathers, and confessed by [Robert] Bellarmine himself [a Roman apologist] (De Rom. Pont., bk. 3, ch. 5) that the Primitive Church was taught to look for Antichrist upon the dissolution of the Roman Empire.”

— Walter Garrett, Pt. 1, Ch. 1, ‘Of the Time of Antichrist’s Coming according to the Doctrine of the Primitive Church. The same confirmed from the Angel’s Interpretation of the Vision [of the Great Whore], Rev. 17′ in A Discourse Concerning Antichrist, Grounded upon the Angel’s Interpretation of the Vision, Rev. 17:3 and from thence proceeding to a particular Explication of the 12th and 13th chapters. Showing that the Church of Rome is that woman mentioned, Rev. 17:3, and the bishops of Rome [are] that Eighth King spoken of, v. 11, who is usually known by the name of Antichrist (London, 1680), p. 17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+well+known+to+those+that+have+been+conversant+in+the+writings+of+the+Fathers%2C+and+confessed+by+%5BRobert%5D+Bellarmine+himself+%5Ba+Roman+apologist%5D+%28De+Rom.+Pont.%2C+bk.+3%2C+ch.+5%29+that+the+Primitive+Church+was+taught+to+look+for+Antichrist+upon+the+dissolution+of+the+Roman+Empire.%E2%80%9D%0A%0A%E2%80%94+Walter+Garrett%2C+Pt.+1%2C+Ch.+1%2C+%E2%80%98Of+the+Time+of+Antichrist%E2%80%99s+Coming+according+to+the+Doctrine+of+the+Primitive+Church.+The+same+confirmed+from+the+Angel%E2%80%99s+Interpretation+of+the+Vision+%5Bof+the+Great+Whore%5D%2C+Rev.+17%E2%80%B2+in+A+Discourse+Concerning+Antichrist%2C+Grounded+upon+the+Angel%E2%80%99s+Interpretation+of+the+Vision%2C+Rev.+17%3A3+and+from+thence+proceeding+to+a+particular+Explication+of+the+12th+and+13th+chapters.+Showing+that+the+Church+of+Rome+is+that+woman+mentioned%2C+Rev.+17%3A3%2C+and+the+bishops+of+Rome+%5Bare%5D+that+Eighth+King+spoken+of%2C+v.+11%2C+who+is+usually+known+by+the+name+of+Antichrist+%28London%2C+1680%29%2C+p.+17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F23153d0d1f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/23153d0d1f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/roman-catholicism/historic-quotes-on-the-papacy-being-the-antichrist/#:~:text=It%20is%20well%20known%20to%20those,the%20dissolution%20of%20the%20Roman%20Empire&amp;text=It%20is%20well%20known%20to%20those%20that%20have&amp;text=Antichrist%20upon%20the%20dissolution%20of%20the%20Roman%20Empire" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5dd7f1a21d" data-kw="Papacy Papal supremacy">
<blockquote><p>The question, then, may be thus stated, Is it necessary for the true order of the hierarchy (as they term it), or of ecclesiastical order, that one See should surpass the others in dignity and power, so as to be the head of the whole body? We subject the Church to unjust laws if we lay this necessity upon her without sanction from the word of God. … Every one knows that the high priest was a type of Christ; now, the priesthood being transferred, that right must also be transferred.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.6.2</span></figcaption>

</figure><figure class="quote" id="q-373f952ee3" data-kw="">
<blockquote><p>From all such persons, therefore, it behooves us to keep aloof, but to adhere to those who, as I have already observed, do hold the doctrine of the apostles, and who, together with the order of priesthood (presbyterii ordine), display sound speech and blameless conduct for the confirmation and correction of others.</p></blockquote>

</figure><figure class="quote" id="q-32676ebd7b" data-kw="">
<blockquote><p>Peter had confessed in his own name, and that of his brethren, that Christ was the Son of God, (Matth. 16: 16.) On this rock Christ builds his Church, because it is the only foundation; as Paul says, &quot;Other foundation than this can no man lay,&quot; (1 Cor. 3: 11.)</p></blockquote>

</figure><figure class="quote" id="q-b2dd3d4865" data-kw="">
<blockquote><p>Therefore, having been persuaded that the Pope is the Antichrist, and since truly it is clear from the words of Scripture that this be so, we must conclude that our secession from his communion is consummately necessary and that it is quite impossible that there be a reconciliation between us, if things so remain as they are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Whether It Can Be Proven the Pope Is the Antichrist</cite>, 7th Disputation, p. 60</span></figcaption>

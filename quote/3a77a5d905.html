<main class="wrap"><figure class="quote" id="q-3a77a5d905" data-kw="">
<blockquote><p>[Thomas:] ‘Secondary movers do not move except through the fact that they are moved by the first mover — just as a staff does not move except through the fact that it is moved by the hand.&#x27;</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7c4873cbdb" data-kw="Satan Justice">
<blockquote><p>We thus see that there is no inconsistency in attributing the same act to God, to Satan, and to man, while, from the difference in the end and mode of action, the spotless righteousness of God shines forth at the same time that the iniquity of Satan and of man is manifested in all its deformity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.4.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a> › <a href="../topics/providence/concurrence/concurrence-and-sin.html">Concurrence and sin</a></span><span class="t"><a href="../topics/the-decrees-of-god/decree-and-sin.html">Decree and Sin</a> › <a href="../topics/the-decrees-of-god/decree-and-sin/god-not-the-author-of-sin.html">God not the author of sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“We thus see that there is no inconsistency in attributing the same act to God, to Satan, and to man, while, from the difference in the end and mode of action, the spotless righteousness of God shines forth at the same time that the iniquity of Satan and of man is manifested in all its deformity.”

</figure><figure class="quote" id="q-397e0b69b0" data-kw="">
<blockquote><p>XXXIII. As for the Reformed theologians known as Remonstrants or Arminians in Belgium, they recognize no other divine concurrence with secondary causes than that general and indifferent one [such as described under Molinism above], which is determined by the concurrence of the secondary cause. This can be seen in Jacob Arminius, from whom all others derive their name. In his dispute against Perkins, he not only affirms that this divine concurrence is indifferent in itself but also that it contributes nothing to the will of the creature by which it might be inclined, helped, or strengthened to act. He asserts that the created will has God’s concurrence in its power, ready and available, before it acts (in Anti-Perkins, p. 733). Similar teachings are found in Grevinchovius against Amesius (sect. 32, p. 368) and Corvinus against Tilenus (ch. 9, p. 354).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘How Divine Concurrence can be Reconciled with Free Will’, p. 344 Latin Le Blanc (1614-1675) was a French reformed professor of theology at Sedan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>
<div class="actions"><button class="copy" data-copy="“XXXIII. As for the Reformed theologians known as Remonstrants or Arminians in Belgium, they recognize no other divine concurrence with secondary causes than that general and indifferent one [such as described under Molinism above], which is determined by the concurrence of the secondary cause. This can be seen in Jacob Arminius, from whom all others derive their name. In his dispute against Perkins, he not only affirms that this divine concurrence is indifferent in itself but also that it contributes nothing to the will of the creature by which it might be inclined, helped, or strengthened to act. He asserts that the created will has God’s concurrence in its power, ready and available, before it acts (in Anti-Perkins, p. 733). Similar teachings are found in Grevinchovius against Amesius (sect. 32, p. 368) and Corvinus against Tilenus (ch. 9, p. 354).”

</figure><figure class="quote" id="q-17af4522c6" data-kw="">
<blockquote><p>[We say no:] 3. Because God denied this effectual influence to Adam not willing to have it; and therefore there was here a virtual and interpretative demerit of Adam, although not formal–because in the same instant of time in which God denied this actual influence, Adam freely willed to lack it, and by this very fact, that he sinned the first sin, he interpretatively willed to lack that predetermining grace, which if he had had, he would have devoutly avoided the first sin. Nor do we deem it absurd for the lack of predetermining grace, and the culpable demerit of that lack, to coexist at the same time, although the lack is prior in the order of nature to the demerit–which I acknowledge to be a mystery of our theology not to be scrutinized.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. by AI by Onku (1639-1642; 1668) | “Is not God made the author of the first sin, if man sinned for this reason, because God denied him, apart from his own fault, the grace necessary for avoiding the first sin?”, pp. 199-200, ch. 5, State of the First Man.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

0this&amp;text=mystery%20of%20our%20theology%20not%20to%20be%20scrutinized" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7b8d5182a4" data-kw="">
<blockquote><p>It becomes us, as Christ’s example goes before us, to submit in the hardest and most bloody providences, to the straight and holy will of God:

1. Christ presses He has no will divided from God’s will; He lays down his glory, his heaven, his life, his fruition of the sweet influence of an highest vision, love, presence, feeling of God in a personal union at the feet of God, that the Lord may carve and cut and dispose of Him and his blood as He thought good.

2. All the difficulty in us, in whom dwells a body of sin is to answer the objections that flesh and blood has against a sad providence, which I will labor to do, and then give some rules for direction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, pp. 141-58 of Christ Dying &amp; Drawing Sinners to Himself (London: 1647) Including answering 9 objections and giving 13 rules, p. 141</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

<main class="wrap"><figure class="quote" id="q-b3b4dd1194" data-kw="">
<blockquote><p>…that no person cleaned enter within the town with[out] license of the baillie, and be convoyed with an officer to the place appointed for them, under the pain of death; and that they come not forth of their houses for the space of 20 days after their entry within the town, under the said pain; and in the meantime that [they] keep company with no clean persons nor they with them, under the said pain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edinburgh.html">Edinburgh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Oct. 15, 1568, ‘Pestilence Statues’ in ‘Extracts from the Records: 1568, July-December’, in Extracts From the Records of the Burgh of Edinburgh, 1557-1571, ed. J D Marwick (Edinburgh, 1875), pp. 250-259. British History Online</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-76a8711059" data-kw="">
<blockquote><p>So when God layeth sin to the charge of the sinner, in punishing it, He is said to lay a burden on the sinner, 2 Kings 9:25. And to remove this burden, is to pardon the sin. 2 Chron. 7:14, “If my people humble themselves, then will I hear from heaven, and will forgive their sin, and will heal their land;” by removing the locusts and the pestilence. See, the pardoning of their sin is exponed [expounded] to be the removing of the locusts and pestilence [2 Chron. 7:13].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying and Drawing Sinners to Himself... (London, 1647)</cite>, p. 37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-dcb6304b89" data-kw="">
<blockquote><p>Instead then of listening to infidel counsel, and shutting up our churches at any of the wonted [accustomed] times of worship, let their doors be invitingly opened, and with frequency let sincere supplication, with humiliation and fasting, be presented to our merciful God. This is a duty which ought not to be perfunctorily performed; but one to which individuals, and families, and fellowships, and all other religious associations, are bound to attend, and in which they ought to abound, praying that a spirit of grace and of supplication may be poured out upon all; and that, by repentance and reliance on the efficacious atonement of our blessed Redeemer, God may be graciously pleased to hear and to heal. Jesus has given every encouragement to believing social prayer in his name: “ If two of you shall agree on earth as touching any thing that they shall ask. it shall be done for them of my Father which is in heaven.” Mat. xviii. 19. Let united, fervent, and believing supplication be sent up then to the throne of God, and we shall have reason to rejoice in the issue. Let it not be said of us as it is written against Asa, King of Judah, after all the Lord had done for him, who “ was diseased in Iris feel, until his disease was exceeding great; Yet in his disease lie sought to the Lord, but to the physicians.” 2 Chron. xvi. 12. But in the midst of abounding sin and alarming indifference, it is matter of the greatest consolation to each individual believer, that whatever becomes of the nation, his own faith and repentance will not pass unrewarded, if he truly put his trust and dependence on the living God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Cause of the Prevalence of Pestilence, and other judgments of God; with the Divinely Appointed Means of Deliverance and Safety (Paisley, 1832)</cite>, p. 34. Begg (1808–1883)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

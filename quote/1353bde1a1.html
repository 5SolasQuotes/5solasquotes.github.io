<blockquote><p>2. If they [Churches] decree things good, lawful and necessary, the prince has a power given him of God to ratify, confirm, and approve these by his civil sanction, but he has no power-ordinary to infringe, or evert what they have decreed. 3. And if the Church be altogether incorrigible and apostate, then we say as follows…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0f3186eb5d" data-kw="">
<blockquote><p>If any man before the time prescribed shall go out of his house without license and thrust himself into the company of others, he shall be bound to begin afresh the time of shutting in and be punished beside[s] with an arbitrary [appointed] punishment. But if the same part being infected before and yet scarce well recovered, or but meetly recovered, shall adventure to do the like, he is to be accused of great unthankfulness and to be deprived of all benefits usual to be done unto him, and besides [this] to be restrained with [a] longer keeping in. But if being now in very deed infected with the plague, he shall be found to have committed this heinous offence upon notorious and wicked boldness, as a murderer after the loss of his goods [being set to die and having nothing further to lose], if he be without children, let him be delivered over unto the hangman.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection in the Time of the Plague or Pestilence, Two Books (London, 1583)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-cee0d0c6a9" data-kw="">
<blockquote><p>In the siege of Leyden we have a thrilling example of their sufferings and heroism. Three months after the commencement of the siege the food-supply was exhausted. A fearful famine began to rage. For seven weeks the inhabitants had no bread to eat and multitudes perished of hunger. On the heels of the famine came the plague or black death, which carried off a third part of the citizens. The apparently doomed survivors subsisted on dogs and cats. To the summons to surrender, they replied: ” As long as you hear the mew of a cat or the bark of a dog you may know that the city holds out. And when all have perished but ourselves, we will devour our left arms, retaining our right to defend our women, our liberty, and our religion against the foreign tyrant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/netherlands-leiden.html">Netherlands Leiden</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Egbert Watson Smith, The Creed of the Presbyterians (New York, 1901)</cite>, pp. 76-78</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

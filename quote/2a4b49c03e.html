<blockquote><p>There was a tumultuous company of women this day to the Parliament Houses, and cried for peace, and they would have peace, whatsoever came on it. But they parted without any hurt. …

This day the tumult of women grew outrageous; and many men, and they Papists, were mingled amongst; so that the Parliament guards were forced to violent resistance, and they slew two men and one woman.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9adb5fcbc0" data-kw="">
<blockquote><p>What politic laws are to be allowed? Those which are agreeable to the law of nature (whereof the Decalogue is an abridgment) and composed for the safety of the people: or those which do not swerve from the eternal rule of the honoring of God and loving our neighbor, and are made by a lawful magistrate. Those that are made after any other manner, they are no better then tyrannical bonds, Isa. 10:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Theology</cite>, p. 892</span></figcaption>

<blockquote><p>PEOPLE had need be careful that they don’t provoke God to give them such a Ministry as will be like unsavoury Salt. Sometimes God doth leave a People to such a Ministry. Isai. 56.10. His watchmen are blind, they are all ignorant, they are all dumb dogs, that cannot bark; sleeping; lying down, loving to slumber. Jer. 2.8. The Priests said not where is the Lord, and they that handle the law knew me not, and the Pastors have transgressed against me. Zech. 11.15, 16. The Lord said to me, take unto thee the instruments of a foolish shepherd, for I will raise a shepherd in the land, that shall not visit that which is cut off, &amp;c.

When God doth so it is in a way of punishment. It is a sign that such a People have greatly offended God, this is one way whereby God pours out his displeasure upon a provoking People, and when he doth so, they are like to grow more and more corrupt. The Scribes and Pharisees were such Ministers, they were blind guides, and the guide and the people both fell into the ditch; therefore you should avoid such sins as may bring this judgment. There is often a suitableness between the sin &amp; the punishment. You may do it;

1. BY barrenness under a Faithful Ministry. It is sometimes so that Faithful Ministers have very little success, they take a great deal of pains, and there is very little effect of it: Men dote upon the World, despise the Gospel, don’t regard rules, make their hearts like an adamant, make a derision of the awful threatnings of the Word of God. God in this case sometimes takes away their opportunities. When the People of Judah brought forth only wild grapes, God threatens this judgment, Isai 5.6. I will lay it waste, and it shall not be pruned nor digged, but there shall come up briars and thorns, and I will command the clouds that they rain no rain upon it.

When Men don’t profit by means, it is just with God to take away suitable means. God in anger gives them up to strong delusions, sends them such teachers as shall mis-lead them, and be a snare to them, and so they grow into corrupt principles, they did not like sound doctrine, and they are fitted with such teachers as shall nourish a spirit of security in them. 2 Thes. 2.10, 11, 12. Because they received not the love of the truth, God shall send them strong delusion, that they should believe a lie, &amp;c.

2. BY abusing a Faithful Ministry. Sometimes People cannot endure sound doctrine, and mis-use God’s Prophets. 2. Chron. 36.16. They mocked the messengers of God, and despised his word, and mis-used his Prophets. They give them a great deal of trouble and molestation, they oppose them, contradict them, and are weakening their hands in their work. Sometimes they talk against them, Ezek. 33.30. Sometimes they persecute them.

This is a great provocation to God, and he many times punishes them, by leaving them to a corrupt and carnal Ministry, that will do them little good, and to such as will do them a great deal of hurt. Thus God dealt with the People of Israel, they abused the Prophets that God had sent unto them; and God took vengeance on them by leaving them to false Prophets that deluded them, and were occasion of their ruin. Lam. 2.14. Thy Prophets have seen vain and foolish things for thee.

3. BY counting their Ministry a burden. Sometimes a sordid spirit prevails among a People, and they count their Ministers Bills of charge. They can lavish away a great deal in a Year, for the gratification of their pride and voluptuousness, and spend freely upon many frivolous occasions, but the support of the Worship of God is counted a great burden: God may justly remove faithful teachers in a way of anger for this, and leave them to such teachers as shall not profit them. God is angry when they think much to maintain his Worship, God gives them wherewith to do it, and he doth so, that they may do it, and they provoke him, when they think that ill spent that is laid out that way. If Ministers sow unto them spiritual things, it is not a great thing if they reap their carnal things. 1 Cor. 9.11.</p></blockquote>

<blockquote><p>2. Refreshments helpful to nature, so far as to refresh it, that it may have a supply of spirits to go on cheerfully in the duties of holy worship are lawful and useful. Τo macerate the body with abstinences on this day is required of none; and to turn it into a fast or to fast upon it is generally condemned by the ancients. Wherefore, to forbear provision of necessary food for families on this day is Mosaic; and the enforcement of the particular precepts about not kindling fire in our houses on this day, baking and preparing the food of it the day before, cannot be insisted on without a reintroduction of the seventh day precisely, to whose observance they were annexed, and thereby of the law and spirit of the old covenant. Provided always that these refreshments be:

1. Seasonable for the time of them, and not when public duties require our attendance on them. 2nd. Accompanied with a singular regard to the rules of temperance; as:

1. That there be no appearance of evil.

2. That nature be not charged with any kind of excess, so far as [to make one] to be hindered rather than assisted in the duties of the day.

3. That they be accompanied with gravity, and sobriety, and purity of conversation. Now, whereas these things are in the substance of them required of us in the whole course of our lives, as we intend to please God, and to come to the enjoyment of him, none ought to think an especial regard unto them on this day to be a bondage, or troublesome unto them.</p></blockquote>

— John Owen, Commentary on Hebrews, (d. 1683), vol. 1 (of 4), p. 749">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+Refreshments+helpful+to+nature%2C+so+far+as+to+refresh+it%2C+that+it+may+have+a+supply+of+spirits+to+go+on+cheerfully+in+the+duties+of+holy+worship+are+lawful+and+useful.+%CE%A4o+macerate+the+body+with+abstinences+on+this+day+is+required+of+none%3B+and+to+turn+it+into+a+fast+or+to+fast+upon+it+is+generally+condemned+by+the+ancients.+Wherefore%2C+to+forbear+provision+of+necessary+food+for+families+on+this+day+is+Mosaic%3B+and+the+enforcement+of+the+particular+precepts+about+not+kindling+fire+in+our+houses+on+this+day%2C+baking+and+preparing+the+food+of+it+the+day+before%2C+cannot+be+insisted+on+without+a+reintroduction+of+the+seventh+day+precisely%2C+to+whose+observance+they+were+annexed%2C+and+thereby+of+the+law+and+spirit+of+the+old+covenant.+Provided+always+that+these+refreshments+be%3A+1.+Seasonable+for+the+time+of+them%2C+and+not+when+public+duties+require+our+attendance+on+them.+2nd.+Accompanied+with+a+singular+regard+to+the+rules+of+temperance%3B+as%3A+1.+That+there+be+no+appearance+of+evil.+2.+That+nature+be+not+charged+with+any+kind+of+excess%2C+so+far+as+%5Bto+make+one%5D+to+be+hindered+rather+than+assisted+in+the+duties+of+the+day.+3.+That+they+be+accompanied+with+gravity%2C+and+sobriety%2C+and+purity+of+conversation.+Now%2C+whereas+these+things+are+in+the+substance+of+them+required+of+us+in+the+whole+course+of+our+lives%2C+as+we+intend+to+please+God%2C+and+to+come+to+the+enjoyment+of+him%2C+none+ought+to+think+an+especial+regard+unto+them+on+this+day+to+be+a+bondage%2C+or+troublesome+unto+them.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Commentary+on+Hebrews%2C+%28d.+1683%29%2C+vol.+1+%28of+4%29%2C+p.+749&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa6b86471b0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a6b86471b0.html">Permalink</a><a class="src" href <blockquote><p>In 1643, White was chosen to serve among the Westminster Assembly of Divines. When the Assembly swore to uphold the Solemn League and Covenant on September 25, 1643, John Lightfoot recorded in his Journal that “Mr. White prayed near upon an hour.” White attended faithfully and contributed diligently to the work of the Assembly, and was in fact married to the sister of Cornelius Burgess, his co-assessor at the Assembly. While the Assembly was engaged in a battle over whose metrical Psalter would be chosen to serve as the instrument of uniformity and “get the civil sanction,” the leading candidates being Francis Rous and William Barton. White, who had prepared his own version of the metrical Psalms, preferred not to publish it while the debate was going on, in the interests of harmony. It was published posthumously with the permission of his son under the title David’s Psalms in Metre, agreeable to the Hebrew. To be sung in usual Tunes To the benefit of the Churches of Christ (1655) and shows his poetic skills.</p></blockquote>

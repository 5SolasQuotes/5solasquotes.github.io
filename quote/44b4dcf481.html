<main class="wrap"><figure class="quote" id="q-44b4dcf481" data-kw="">
<blockquote><p>If the consequence is truly able to be proved according to natural light, then it may yet be proved from the Word of God because the light of reason is contained in the Word of God as a part is in the whole, and so to this extent the Word of God will prove the consequence. If truly the consequence is proved through natural reason which is not in the Word of God, we desire to hear such an invincible demonstration!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rutherford’s Examination of Arminianism: the Tables of Contents with Excerpts from Every Chapter tr. Charles Johnson &amp; Travis Fentiman (1639-1642; 1668; RBO, 2019), ch. 1, section 17</cite>, p. 47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a></span></div>
<div class="actions"><button class="copy" data-copy="“If the consequence is truly able to be proved according to natural light, then it may yet be proved from the Word of God because the light of reason is contained in the Word of God as a part is in the whole, and so to this extent the Word of God will prove the consequence. If truly the consequence is proved through natural reason which is not in the Word of God, we desire to hear such an invincible demonstration!”

</figure><figure class="quote" id="q-738aac8891" data-kw="">
<blockquote><p>As we believe and confess the Scriptures of God sufficient to instruct and make the man of God perfect; 2 Tim. iii. 16, 17. so do we affirm and avow the authority of the same to be of God, and neither to depend on men nor angels. We affirm, therefore, that such as allege the Scripture to have no other authority but that which it hath received from the Church, are blasphemous against God, and injurious to the true church; which always heareth and obeyeth the voice of her own Spouse and pastor (John 10), but takes not upon her to be mistress over the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scottish-reformers.html">Scottish Reformers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scots Confession</cite>, 1560, Art. 19</span></figcaption>

</figure><figure class="quote" id="q-f4b69291f9" data-kw="">
<blockquote><p>To ascertain the true sense of the Scriptures, interpretation is needed. … It is not to be sought by each man&#x27;s private judgment (which is the idia epilysis condemned by Peter), but is to be gathered from the Scriptures themselves as their own best and surest interpreter (Neh. 8:8; Acts 17:11). But for this, after fervent prayer to God, there is need of an inspection of the sources, the knowledge of languages, … collation of passages, … and conformity of the interpretation to the analogy of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.19.18</span></figcaption>

</figure><figure class="quote" id="q-39cdcf3c15" data-kw="">
<blockquote><p>We believe that the word, contained in these books, came from one God; of whom alone, and not of men, the authority thereof dependeth. … it is not lawful to oppose either antiquity, custom, multitude, man&#x27;s wisdom and judgment, or edicts, or any decrees, or councils, or visions, or miracles, unto this holy Scripture; but rather that all things ought to be examined and tried by the rule and square thereof.</p></blockquote>

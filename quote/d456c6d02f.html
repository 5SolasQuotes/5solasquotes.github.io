<blockquote><p>Michael Sudduth examines three prominent objections to natural theology that have emerged in the Reformed streams of the Protestant theological tradition: objections from the immediacy of our knowledge of God, the noetic effects of sin, and the logic of theistic arguments. Distinguishing between the project of natural theology and particular models of natural theology, Sudduth argues that none of the main Reformed objections is successful as an objection to the project of natural theology itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-sudduth.html">Michael Sudduth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed Objection to Natural Theology Pre</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5ce1756f65" data-kw="">
<blockquote><p>Warfield, following the Scottish Reformation, made the case that all humans can use reason to know God. This isn’t a statement about the noetic effects of the fall but a statement about reason. Reason makes God known. Reason is that by which we understand anything at all. It is not simply a first principle because we use reason even to form first principles. Reason is transcendental, meaning it cannot be questioned because it makes questioning possible. We use reason to form beliefs about nature, and we use reason to form beliefs about scripture. Humans are fallen having a darkened mind meaning they have rejected reason and for that they are without excuse. Reason and argument are still there to reveal their condition in unbelief and its consequences. Warfield is speaking of reason as the laws of thought (right reason), Kuyper of man’s reasoning process. Warfield’s definition is more basic. It is the failure to correctly define reason that allowed the challenges of Hume and Kant to the knowledge of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/owen-anderson.html">Owen Anderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Natural Theology &amp; the Clarity of General Revelation’ (2022)</cite></span></figcaption>

<blockquote><p>[1.] A twofold revelation of God is given to wayfarers [persons in this life], one in the sphere of nature, another in the sphere of grace. 2. Revelation in the sphere of nature is either Objective in the works of creation, or Subjective in the consciences of men. 3. The revelation alone exhibited in the sphere of nature cannot be salutary, nor has any mortal through it alone either been led to salvation or been able to be led. 4. To those therefore to whom the grace of superior revelation in the sphere of grace after sin introduced into the world has not been made, salvation was never destined by God: for the wise one does not will the end for him to whom he by no means grants the necessary means, without which it cannot come to pass that he should attain the end, when those can be had only by his giving. 5. And since the sphere of nature exhibits only τὸ γνωστὸν τοῦ θεοῦ [the knowledge of God], by no means indeed σοφίαν τοῦ θεοῦ ἐν μυστηρίῳ [the wisdom of God in mystery], that is, the Gospel and doctrine concerning Christ the Savior and faith in Him, who, without knowledge of Him who alone is the way, can come to life? 6. Therefore the revelation alone exhibited to sinners in the sphere of grace through God’s word can be salutary, which reveals both the actual expiation of sin, and the mode of it, and him through whom it is expiated, and the means of applying that expiation to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/disputationum-theologicarum-miscellaneorum-pars-prima.html">Disputationum Theologicarum Miscellaneorum Pars Prima</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’</cite></span></figcaption>

<blockquote><p>13th Problem: Whether in this method the proof or consequence from effect to cause, or from works to the maker, which they commonly call the way of causality with the saying of Dionysius the Areopagite, and the proof from the book of nature, makes a part and indeed the principal one. I respond in the affirmative, and it is proven: 1. By the authority and example of the Holy Spirit: Rom. 1:19-20; Acts 14:15-17, 17:27-28; Ps. 8:2-4 &amp; 19:1-3, etc., Job 38-39, Isa. 40:21-22, 26; Jer. 10:10-11. These passages should be carefully considered, in which you will hear God himself, the prophets and the apostles disputing by this method. Secondly, this method is defended against all objections, as can be seen among the scholastics on [Thomas’s Summa,] pt. 1, quest. 2, articles 2-3. Thirdly, it has been felicitously employed and applied thus far by all the wise men of all ages. Those who object to this method today are one or another inept petty philosopher, or certain idle Athenians eager for novelty (Acts 17), or men who are scarcely semi-literate, especially in metaphysics and natural theology, to the point that they have never even learned the terms or heard of them in conversation. But there are those who have already exposed, and will further expose, the ineptitudes and vertigos of those men. Meanwhile, on this occasion, let the following be considered and compared: 1. From the Fathers: Lactantius, bk. 1, ch. 2; Eusebius, bk. 1 of Preparation for the Gospel; Theodoret’s Discourses on Providence, and On the Cure of Greek Affections, oration 3; the aforementioned Dionysius the Areopagite, On the Divine Names, ch. 17; John of Damascus, bk. 1, On the Orthodox Faith, ch. 3. 2. From the Scholastics: Thomas Aquinas, Opusculum 6 and bk 1, Against the Gentiles, chs. 12-13, and Summa, pt 1, quest. 2, articles 2-3, with Cajetan and other commentators. [Peter Lombard] The Master of the Sentences, bk. 1, distinct. 3, and all his commentators there. 3. From the natural theologians and antagonists of the atheists, Epicureans, gentiles, etc.: Savonarola in The Triumph of the Cross, bk. 1, ch. 6; Raymond of Sabunde in his Natural Theology (which was translated into French by Michel de Montaigne), ch. 1; Steuchus in The Perennial Philosophy, bk. 7, ch. 22; Luis Vives, On the Truth of the Christian Religion, bk. 1, ch. 9; Mutius Pansa in The Kiss of Christian &amp; Pagan Philosophy; Mornay, On the Truth of the Christian Religion, chs. 1, 11-12; Thomas à Jesu, On Procuring the Salvation of the Gentiles, bk. 11, chs. 6 &amp; 8; Possevinus, bk. 10 of the Select Library, ch. 2, sect. 414; Charron, bk. 1 of Truth, chs. 6-7; Pierre Du Moulin in his little book On the Knowledge of God; Alsted in his Natural Theology; Grotius in his book On the Truth of the Faith; Guillaume de Rebreviettes in his Atheomastix. Add also the French tracts against the atheists: Alexandre Cappe’s in duodecimo; Baruch Canephe’s Atheomachus in octavo; the three tracts of Infanticus, Hotman, where in the first On Providence, ch. 2; And the English ones: Smith’s The Quiver Against the Atheists, which was published together with his sermons; John Weemes of Lathokar in his tract, On the Four Degenerate Sons; Meredith Hanmer in his Atheomastix, Tract 1. 4. From the writers of common places, at least those who are intimately known to me or currently at hand: Philip Melanchthon, Wolfgang Musculus, John Calvin, Peter Martyr Vermigli, Andreas Hyperius, Stephen Szegedinus, Lambert Daneau, Daniel Tilenus, Amandus Polanus, in the common place on God. Compare also the same authors in the common place on Providence, and other writers who have defended providence ex professo, such as Leonard Lessius, Against the Atheists; Andreas Gorrutius, On Providence; Ulrich Zwingli, On Providence. 5. From the commentators on the aforementioned passages of Scripture: Juan de Pineda, Cornelius a Lapide, Juan de Lorinus, Andrew Willet, André Rivet, David Pareus, etc. 6. From preachers, practical and ascetic writers: Bonaventure in The Mind’s Journey to God; Robert Bellarmine, On the Ascent of the Mind to God, etc.; Jean Taffin, On the Amendment of Life; John Preston in his sermon on 1 Thess. 1. 7. From the metaphysicians: Francisco Suárez and others commonly. 8. From learned jurists, politicians, physicians, philologists: Innocent Gentillet in his Anti-Machiavel, pt. 2, axiom 1; Justus Lipsius in his letter to Berchemius; Hugo Grotius, On the Truth of the Christian Religion; Christoph Besold in his Specimen of Common Places, pt. 2, pp. 19 &amp; 363 in the 16mo edition; François Vallès, ch. 58, Philosophical Sacred 9. 9. From the heterodox or suspect, the above-mentioned Arminius and Vorstius, especially Volckelius the Socinian in Institutions, bk. 1, chs. 2-5; John Trithemius in the book, Eight Questions, question 8 which is about providence. 10. From the Gentiles, such as Aristotle bk. 8 of Physics, Sextus Empiricus, Maximus of Tyre, dissertation 1. See many others cited by Plessis, ch. 2; 12 Against the Mathematicians, pp. 317, 319. Cicero, bk. 2, On the Nature of the Gods. Seneca, On Providence. Galen, bk. 3, On the Usefulness of Parts, which illustrious passage Beza described in the notes to Rom. 1:19. 11. From the Jews, Maimonides in The Constitution on the Fundamentals of Law, ch. 1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1 Latin</cite>, pp. 172-74</span></figcaption>

<div class="actions"><button class="copy" data-copy="“13th Problem: Whether in this method the proof or consequence from effect to cause, or from works to the maker, which they commonly call the way of causality with the saying of Dionysius the Areopagite, and the proof from the book of nature, makes a part and indeed the principal one. I respond in the affirmative, and it is proven: 1. By the authority and example of the Holy Spirit: Rom. 1:19-20; Acts 14:15-17, 17:27-28; Ps. 8:2-4 &amp; 19:1-3, etc., Job 38-39, Isa. 40:21-22, 26; Jer. 10:10-11. These passages should be carefully considered, in which you will hear God himself, the prophets and the apostles disputing by this method. Secondly, this method is defended against all objections, as can be seen among the scholastics on [Thomas’s Summa,] pt. 1, quest. 2, articles 2-3. Thirdly, it has been felicitously employed and applied thus far by all the wise men of all ages. Those who object to this method today are one or another inept petty philosopher, or certain idle Athenians eager for novelty (Acts 17), or men who are scarcely semi-literate, especially in metaphysics and natural theology, to the point that they have never even learned the terms or heard of them in conversation. But there are those who have already exposed, and will further expose, the ineptitudes and vertigos of those men. Meanwhile, on this occasion, let the following be considered and compared: 1. From the Fathers: Lactantius, bk. 1, ch. 2; Eusebius, bk. 1 of Preparation for the Gospel; Theodoret’s Discourses on Providence, and On the Cure of Greek Affections, oration 3; the aforementioned Dionysius the Areopagite, On the Divine Names, ch. 17; John of Damascus, bk. 1, On the Orthodox Faith, ch. 3. 2. From the Scholastics: Thomas Aquinas, Opusculum 6 and bk 1, Against the Gentiles, chs. 12-13, and Summa, pt 1, quest. 2, articles 2-3, with Cajetan and other commentators. [Peter Lombard] The Master of the Sentences, bk. 1, distinct. 3, and all his commentators there. 3. From the natural theologians and antagonists of the atheists, Epicureans, gentiles, etc.: Savonarola in The Triumph of the Cross, bk. 1, ch. 6; Raymond of Sabunde in his Natural Theology (which was translated into French by Michel de Montaigne), ch. 1; Steuchus in The Perennial Philosophy, bk. 7, ch. 22; Luis Vives, On the Truth of the Christian Religion, bk. 1, ch. 9; Mutius Pansa in The Kiss of Christian &amp; Pagan Philosophy; Mornay, On the Truth of the Christian Religion, chs. 1, 11-12; Thomas à Jesu, On Procuring the Salvation of the Gentiles, bk. 11, chs. 6 &amp; 8; Possevinus, bk. 10 of the Select Library, ch. 2, sect. 414; Charron, bk. 1 of Truth, chs. 6-7; Pierre Du Moulin in his little book On the Knowledge of God; Alsted in his Natural Theology; Grotius in his book On the Truth of the Faith; Guillaume de Rebreviettes in his Atheomastix. Add also the French tracts against the atheists: Alexandre Cappe’s in duodecimo; Baruch Canephe’s Atheomachus in octavo; the three tracts of Infanticus, Hotman, where in the first On Providence, ch. 2; And the English ones: Smith’s The Quiver Against the Atheists, which was published together with his sermons; John Weemes of Lathokar in his tract, On the Four Degenerate Sons; Meredith Hanmer in his Atheomastix, Tract 1. 4. From the writers of common places, at least those who are intimately known to me or currently at hand: Philip Melanchthon, Wolfgang Musculus, John Calvin, Peter Martyr Vermigli, Andreas Hyperius, Stephen Szegedinus, Lambert Daneau, Daniel Tilenus, Amandus Polanus, in the common place on God. Compare also the same authors in the common place on Providence, and other writers who have defended providence ex professo, such as Leonard Lessius, Against the Atheists; Andreas Gorrutius, On Providence; Ulrich Zwingli, On Providence. 5. From the commentators on the aforementioned passages of Scripture: Juan de Pineda, Cornelius a Lapide, Juan de Lorinus, Andrew Willet, André Rivet, David Pareus, etc. 6. From preachers, practical and ascetic writers: Bonaventure in The Mind’s Journey to God; Robert Bellarmine, On the Ascent of the Mind to God, etc.; Jean Taffin, On the Amendment of Life; John Preston in his sermon on 1 Thess. 1. 7. From the metaphysicians: Francisco Suárez and others commonly. 8. From learned jurists, politicians, physicians, philologists: Innocent Gentillet in his Anti-Machiavel, pt. 2, axiom 1; Justus Lipsius in his letter to Berchemius; Hugo Grotius, On the Truth of the Christian Religion; Christoph Besold in his Specimen of Common Places, pt. 2, pp. 19 &amp; 363 in the 16mo edition; François Vallès, ch. 58, Philosophical Sacred 9. 9. From the heterodox or suspect, the above-mentioned Arminius and Vorstius, especially Volckelius the Socinian in Institutions, bk. 1, chs. 2-5; John Trithemius in the book, Eight Questions, question 8 which is about providence. 10. From the Gentiles, such as Aristotle bk. 8 of Physics, Sextus Empiricus, Maximus of Tyre, dissertation 1. See many others cited by Plessis, ch. 2; 12 Against the Mathematicians, pp. 317, 319. Cicero, bk. 2, On the Nature of the Gods. Seneca, On Providence. Galen, bk. 3, On the Usefulness of Parts, which illustrious passage Beza described in the notes to Rom. 1:19. 11. From the Jews, Maimonides in The Constitution on the Fundamentals of Law, ch. 1.”

— Gisbertus Voetius, Select Theological Disputations, vol. 1 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1 Latin, pp. 172-74">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C13th+Problem%3A+Whether+in+this+method+the+proof+or+consequence+from+effect+to+cause%2C+or+from+works+to+the+maker%2C+which+they+commonly+call+the+way+of+causality+with+the+saying+of+Dionysius+the+Areopagite%2C+and+the+proof+from+the+book+of+nature%2C+makes+a+part+and+indeed+the+principal+one.+I+respond+in+the+affirmative%2C+and+it+is+proven%3A+1.+By+the+authority+and+example+of+the+Holy+Spirit%3A+Rom.+1%3A19-20%3B+Acts+14%3A15-17%2C+17%3A27-28%3B+Ps.+8%3A2-4+%26+19%3A1-3%2C+etc.%2C+Job+38-39%2C+Isa.+40%3A21-22%2C+26%3B+Jer.+10%3A10-11.+These+passages+should+be+carefully+considered%2C+in+which+you+will+hear+God+himself%2C+the+prophets+and+the+apostles+disputing+by+this+method.+Secondly%2C+this+method+is+defended+against+all+objections%2C+as+can+be+seen+among+the+scholastics+on+%5BThomas%E2%80%99s+Summa%2C%5D+pt.+1%2C+quest.+2%2C+articles+2-3.+Thirdly%2C+it+has+been+felicitously+employed+and+applied+thus+far+by+all+the+wise+men+of+all+ages.+Those+who+object+to+this+method+today+are+one+or+another+inept+petty+philosopher%2C+or+certain+idle+Athenians+eager+for+novelty+%28Acts+17%29%2C+or+men+who+are+scarcely+semi-literate%2C+especially+in+metaphysics+and+natural+theology%2C+to+the+point+that+they+have+never+even+learned+the+terms+or+heard+of+them+in+conversation.+But+there+are+those+who+have+already+exposed%2C+and+will+further+expose%2C+the+ineptitudes+and+vertigos+of+those+men.+Meanwhile%2C+on+this+occasion%2C+let+the+following+be+considered+and+compared%3A+1.+From+the+Fathers%3A+Lactantius%2C+bk.+1%2C+ch.+2%3B+Eusebius%2C+bk.+1+of+Preparation+for+the+Gospel%3B+Theodoret%E2%80%99s+Discourses+on+Providence%2C+and+On+the+Cure+of+Greek+Affections%2C+oration+3%3B+the+aforementioned+Dionysius+the+Areopagite%2C+On+the+Divine+Names%2C+ch.+17%3B+John+of+Damascus%2C+bk.+1%2C+On+the+Orthodox+Faith%2C+ch.+3.+2.+From+the+Scholastics%3A+Thomas+Aquinas%2C+Opusculum+6+and+bk+1%2C+Against+the+Gentiles%2C+chs.+12-13%2C+and+Summa%2C+pt+1%2C+quest.+2%2C+articles+2-3%2C+with+Cajetan+and+other+commentators.+%5BPeter+Lombard%5D+The+Master+of+the+Sentences%2C+bk.+1%2C+distinct.+3%2C+and+all+his+commentators+there.+3.+From+the+natural+theologians+and+antagonists+of+the+atheists%2C+Epicureans%2C+gentiles%2C+etc.%3A+Savonarola+in+The+Triumph+of+the+Cross%2C+bk.+1%2C+ch.+6%3B+Raymond+of+Sabunde+in+his+Natural+Theology+%28which+was+translated+into+French+by+Michel+de+Montaigne%29%2C+ch.+1%3B+Steuchus+in+The+Perennial+Philosophy%2C+bk.+7%2C+ch.+22%3B+Luis+Vives%2C+On+the+Truth+of+the+Christian+Religion%2C+bk.+1%2C+ch.+9%3B+Mutius+Pansa+in+The+Kiss+of+Christian+%26+Pagan+Philosophy%3B+Mornay%2C+On+the+Truth+of+the+Christian+Religion%2C+chs.+1%2C+11-12%3B+Thomas+%C3%A0+Jesu%2C+On+Procuring+the+Salvation+of+the+Gentiles%2C+bk.+11%2C+chs.+6+%26+8%3B+Possevinus%2C+bk.+10+of+the+Select+Library%2C+ch.+2%2C+sect.+414%3B+Charron%2C+bk.+1+of+Truth%2C+chs.+6-7%3B+Pierre+Du+Moulin+in+his+little+book+On+the+Knowledge+of+God%3B+Alsted+in+his+Natural+Theology%3B+Grotius+in+his+book+On+the+Truth+of+the+Faith%3B+Guillaume+de+Rebreviettes+in+his+Atheomastix.+Add+also+the+French+tracts+against+the+atheists%3A+Alexandre+Cappe%E2%80%99s+in+duodecimo%3B+Baruch+Canephe%E2%80%99s+Atheomachus+in+octavo%3B+the+three+tracts+of+Infanticus%2C+Hotman%2C+where+in+the+first+On+Providence%2C+ch.+2%3B+And+the+English+ones%3A+Smith%E2%80%99s+The+Quiver+Against+the+Atheists%2C+which+was+published+together+with+his+sermons%3B+John+Weemes+of+Lathokar+in+his+tract%2C+On+the+Four+Degenerate+Sons%3B+Meredith+Hanmer+in+his+Atheomastix%2C+Tract+1.+4.+From+the+writers+of+common+places%2C+at+least+those+who+are+intimately+known+to+me+or+currently+at+hand%3A+Philip+Melanchthon%2C+Wolfgang+Musculus%2C+John+Calvin%2C+Peter+Martyr+Vermigli%2C+Andreas+Hyperius%2C+Stephen+Szegedinus%2C+Lambert

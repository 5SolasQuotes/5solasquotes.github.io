<blockquote><p>Question 20. Did God leave all mankind to perish in the estate of sin and misery; A. God having out of his mere good pleasure, from all eternity, elected some to everlasting life… to deliver them out of an estate of sin and misery; and to bring them into an estate of salvation by a Redeemer. Q. 1. Are same persons chosen to salvation, and others left? A. Yes: God has chosen some to salvation, and passed by others; as the Scriptures speak; See Rom. 8:30… … Q. 7. What learn you from God’s election? What cause we have to admire free-grace in our choice, who were no better than others; Eph. 2:3. And were by nature children of wrath even as others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of the Salvation of God’s Elect &amp; of the Covenant of Grace’ on Question 20 in An Exposition of the Assembly’s Catechism in Works</cite>, (London: Baynes, 1820), vol. 6, pp. 174-75</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

<blockquote><p>…on the matter of election (which he [Vermigli] identifies with predestination), God’s will in eternity is seen to be the exclusive cause. The effect of this election assumes Augustine’s anthropology by viewing all humanity as a massa perditionis [a ruined mass], doomed to eternal condemnation unless God intercedes. Divine election is portrayed positively as the rescue of the doomed sinner, who can do nothing to secure his own deliverance. After being elected from the mass of fallen sinners in eternity past… the elect embrace Christ in time and thus inherit eternal life. … Vermigli’s doctrine is an unequivocal double predestination, but he differs from other Reformers, such as Ulrich Zwingli. The latter advocates a strict symmetrical double predestination, but Vermigli constructs an asymmetrical version of this doctrine. According to Vermigli, God does not deal with the elect in precisely the same way he deals with the non-elect…</p></blockquote>

<blockquote><p>Lordship is God’s having absolute right and power to, and over all his creatures, and disposing thereof according to his will, 1 Sam. 3:18; 1 Tim. 6:13; Mt. 20:15; Dan. 4:25. Absolute Soveraignty is due unto God by four titles: Of Creation, Rom. 9:20; Of Conservation, Heb. 1:3; To give the creature to continue in being is more than merely to give it being: as the shadow depends upon the body, so the creature depends upon the Creator. Of Redemption, 1 Cor. 6:20; this exceeds both the former. Of the Last End, Prov. 16:4. The end of the creature is the manifestation of the glory of the Creator. Lordship is in God after the most eminent manner: He has subjects of Himself, authority of Himself, Legislative Power of Himself. He appoints the rule with recompence to the obedient, and punishment to the disobedient according to his mere good pleasure. He is his own rule, his will is the most absolute reason. He gives no account of his matters, Job 33:13. Every creature depends essentially and universally upon the Creator: that is, the creature cannot be, but it must be at the disposing of God. We do not acknowledge ourselves to be creatures, nor God to be Lord, if his pleasure be not acknowledged to be a sufficient and satisfactory reason, of whatsoever He does. The Lordship of God is of Himself, not by occupation, as a title of property arising from a thing found without an owner; nor by donation, succession, purchase or conquest, as created lordships are. All created jurisdiction descends from this absolute Lordship of God. The jurisdiction that Christ as man received from God is universal over all the creatures respectively, Mt. 28:18. The jurisdiction of other men is limited according to the several objects thereof: whether ecclesiastical, where their authority and office is immediately received from Christ though the designation of such persons to such offices be by the call of men. Or civil, whether natural, as parent, and child: Or voluntary, as magistrate and subject.</p></blockquote>

</figure><figure class="quote" id="q-89e695a2a9" data-kw="">
<blockquote><p>Either you will distinguish God’s decrees by the objects, or not. If not, you must not distinguish between election and rejection, willing and nilling, loving Peter and hating Judas, etc. If yea, then you must not take up with the unexplained words, ‘reprobation’ and ‘election’.

1. By reprobation is meant either God’s will to punish men.

2. Or his will to give them no special saving grace.

3. Or his not-willing to give it them. For the first, I told you before that the object of God’s will to punish men in Hell is a sinner foreseen finally rejecting mercy.

2. The object of his will to punish men with positive temporal punishments is the sinner foreseen in his immediate capacity for them.

3. Whether punishment by not giving that Spirit for faith, repentance and holiness, be decreed (being nothing but a not-giving) is before discussed. But if it could be proved, yet the object of God’s denying further mercy and help, is evermore one that has abused former mercy, or refuses that as offered to him. (idem, d. 95, 1 Ferrariensis plane indicat Deum neminem damnare, aut rejicere a regno suo voluisse, quod ipse appellat deserere, nisi pravisa culpa [Ferrariensis plainly indicates that God willed to damn no one or to reject anyone from his kingdom, which he calls ‘to desert,’ except on account of foreseen sin.].)

4. But God’s non-volition to give grace is no act and has no object. But we judge that all mankind are now from under the mere Covenant of Innocency, and that none perish but for the abuse of mercy, which had a tendency to their recovery (the case of infants must be spoke to in its place once for all). But all this belongs to the case of grace and free-will. And 2. As for election, we say that: (How Augustine distinguished election to justification and [election] to glory, see him, bk. 1, to Simplicius, quest. 2 and that which about this Vasquez has on Thomas, pt. 1, disp. 89, ch. 6)

1. The object of God’s will to glorify men, is man sanctifying and persevering in an immediate capacity for glory in esse cognito [known being].

2. The object of God’s will to give the grace of perseverance, is a foreseen sanctified person in the next capacity.

3. The object of God’s will to justify, sanctify and adopt, is a foreseen believer.

4. The object of God’s will to give special grace, which shall effectually cause men to repent and believe, is ordinarily a foreseen disposed sinner prepared by his common grace, but sometimes an unprepared sinner, whom, of his free will, he will suddenly convert, as it pleases him freely to distribute his benefits (all being unworthy).

5. The object of God’s will, to give the highest degrees of common grace, external (in the purest preaching of the Gospel, and other mercies) and internal (in greater helps of the Spirit) is sometimes a sinner in esse cognito, who has not grossly rejected lower helps, and sometimes freely the worser sort of sinners who have abused former mercies.

6. The object of God’s will to give the first common mercy which has a tendency in its use to men’s recovery and salvation, is all mankind fallen in Adam: For all are under the New Covenant of Grace made with Adam, Gen. 3:15, in some degree (and with Noah) and all have much mercy tending to repentance; and none are left as the devils in despair, without any offered remedy or help.

7. The object of God’s will to give man the Covenant of Innocency, was Adam foreseen as mere man.

8. The object of God’s will to create man was nothing, in the sense that we now take an object in, that is, for the materia circa quam [matter around which]. But if you will call the intended effect the object, then the object of God’s will here (and in the rest) is the thing willed. But if you will needs presume to seek one higher in the mind of God (man knows by reception and so has ideas, but God can be no recipient), you must say that it was man as conceived fit to be, as well as possible. For we can think no otherwise of the divine conceptions and volitions but as we are led by the analogy of human acts. And so we must say that:

1. God’s power makes it possible for all things to be.

2. Next God knows them possible.

3. He knows what is convenient or fit to be made to his unsearchable ends.

4. He wills that they shall be, and man among the rest, and so on. If you will needs have the order of decrees, this is all that we can say of them. Arminian: All this pleases us well: but it will not please your own [moderate] party or the Calvinists that you make so many acts of election, which they tell you is but one entire thing, as mentioned in Scripture: Nor yet that you lay every decree or will upon foresight. Baxter: You are mistaken. No moderate, considerate man of them will deny anything that I have said, for:

1. As to the Scripture use of the word ‘election’, it is not the mere name that we are now opening, but the matter in question. Nor is it the expounding of particular texts that I am upon; and if I were, no man will deny but that the word ‘election’ is variously used in the Scripture: sometime for God’s eternal will to make us Christians of infidels, and to save us by Christ; and sometime for actual choosing us by converting grace in time; and sometime for actual choosing men in time by vocation to some office or special work, etc. And as to the distinguishing of all these volitions of God, no man will deny the effects to be distinct. Undoubtedly these are various effects of God:

1. To make man.

2. To give him the Covenant of Innocency.

3. To give him the Covenant of Grace, with all the common mercies of it.

4. To give some persons and nations the gospel and other mercies above the greatest part of the world, with answerable helps of the Spirit.

5. To give men special grace, effectual for faith and repentance.

6. To give men pardon, adoption and sanctification.

7. To give men perseverance.

8. To give them glory. And if these are various works, either you will distinguish of God’s will by his various works, or not. (Sive secundum nostram rationem distinguamus illud decretum in plura, sive dicamus esse unicum, non est multum curandum: Certum enim est apud omnes, Deum omnia et singula voluisse unico simplicissimo acta suae voluntatis: Est enim ipsius voluntas, et voluntatis operatio idem quod sua essentia simplex et individua si aliquis contenderet esse etiam nostro modo intelligendi esse unicum actum simplicissimum voluntatis, ego non curabo. [Whether, according to our manner of conceiving, we distinguish that decree into several [acts], or whether we say that it is one [act], it is not much to be concerned about. For it is certain among all, that God willed all things and each individual thing by one most simple act of His will. For His will, and the operation of His will, is the same as his simple and undivided essence. If someone were to contend that even according to our manner of understanding, there is one single most simple act of the will, I would not be concerned.] Vasquez on Thomas, pt. 1, quest. 14, art. 13, disp. 65; and is not this a short end of many controversies?) If you do not, our whole controversy about the order of the decrees is quickly at an end (and I am content with the abbreviation): For where there is no distinction, there is no order. And when I distinguish them never so much, I say, as well as any, that they are all one in regard of the one will or essence of God that wills them. In God there is no real diversity; but his will is thus variously denominated extrinsically from its respect to the various objects to which it does trans[p]ire, and of the various effects which it produces. And thus do all men talk of God. Else they could not distinguish his saving will from his damning will; nor election from rejection, in his decree. So that no man can tell how to differ here. And as to foresight, you as much mistake. For:

1. I say not that God foresees any good in any man, but what He gives him and wills to give him. But we speak of the order of those volitions in the way of execution. (Alexander Alesius is noted by Vasquez and others as singular for holding that predestination to the first grace was upon foresight of the future good use of that grace as the cause: But he denies that the first grace is actually given on the same cause: Therefore Vasquez thinks he changed his mind.)

2. And all men that ascribe intentions, volitions or purposes to God, do and must make the object of them as such to be quid cognitum [what is known], or something which some call an idea in the mind of God; It is not a prius volitum qua tale [first volition as such] that is the object of a volition, but bonum intellectum [the intellectual good]. And therefore nothing but foresight or apprehension of the thing needs to be put in the description of the object. Nor do I deny but that we must in our ordinary discourse speak comprehensively, and denominate ‘election’ eminently from the noblest parts: For as our full salvation includes all, or almost all, so our conversion and glorification presupposes all that antecedes. And therefore as we may and must talk of salvation in general, and not always stand to mention all the parts of it, so must we eminently talk of election to salvation as comprehending the rest, and not always stand to distinguish of the parts. But when you will make a controversy of the order and the object of these acts or parts, we must distinguish.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Either you will distinguish God’s decrees by the objects, or not. If not, you must not distinguish between election and rejection, willing and nilling, loving Peter and hating Judas, etc. If yea, then you must not take up with the unexplained words, ‘reprobation’ and ‘election’.

1. By reprobation is meant either God’s will to punish men.

2. Or his will to give them no special saving grace.

3. Or his not-willing to give it them. For the first, I told you before that the object of God’s will to punish men in Hell is a sinner foreseen finally rejecting mercy.

2. The object of his will to punish men with positive temporal punishments is the sinner foreseen in his immediate capacity for them.

3. Whether punishment by not giving that Spirit for faith, repentance and holiness, be decreed (being nothing but a not-giving) is before discussed. But if it could be proved, yet the object of God’s denying further mercy and help, is evermore one that has abused former mercy, or refuses that as offered to him. (idem, d. 95, 1 Ferrariensis plane indicat Deum neminem damnare, aut rejicere a regno suo voluisse, quod ipse appellat deserere, nisi pravisa culpa [Ferrariensis plainly indicates that God willed to damn no one or to reject anyone from his kingdom, which he calls ‘to desert,’ except on account of foreseen sin.].)

4. But God’s non-volition to give grace is no act and has no object. But we judge that all mankind are now from under the mere Covenant of Innocency, and that none perish but for the abuse of mercy, which had a tendency to their recovery (the case of infants must be spoke to in its place once for all). But all this belongs to the case of grace and free-will. And 2. As for election, we say that: (How Augustine distinguished election to justification and [election] to glory, see him, bk. 1, to Simplicius, quest. 2 and that which about this Vasquez has on Thomas, pt. 1, disp. 89, ch. 6)

1. The object of God’s will to glorify men, is man sanctifying and persevering in an immediate capacity for glory in esse cognito [known being].

2. The object of God’s will to give the grace of perseverance, is a foreseen sanctified person in the next capacity.

3. The object of God’s will to justify, sanctify and adopt, is a foreseen believer.

4. The object of God’s will to give special grace, which shall effectually cause men to repent and believe, is ordinarily a foreseen disposed sinner prepared by his common grace, but sometimes an unprepared sinner, whom, of his free will, he will suddenly convert, as it pleases him freely to distribute his benefits (all being unworthy).

5. The object of God’s will, to give the highest degrees of common grace, external (in the purest preaching of the Gospel, and other mercies) and internal (in greater helps of the Spirit) is sometimes a sinner in esse cognito, who has not grossly rejected lower helps, and sometimes freely the worser sort of sinners who have abused former mercies.

6. The object of God’s will to give the first common mercy which has a tendency in its use to men’s recovery and salvation, is all mankind fallen in Adam: For all are under the New Covenant of Grace made with Adam, Gen. 3:15, in some degree (and with Noah) and all have much mercy tending to repentance; and none are left as the devils in despair, without any offered remedy or help.

7. The object of God’s will to give man the Covenant of Innocency, was Adam foreseen as mere man.

8. The object of God’s will to create man was nothing, in the sense that we now take an object in, that is, for the materia circa quam [matter around which]. But if you will call the intended effect the object, then the object of God’s will here (and in the rest) is the thing willed. But if you will needs presume to seek one higher in the mind of God (man knows by reception and so has ideas, but God can be no recipient), you must say that it was man as conceived fit to be, as well as possible. For we can think no otherwise of the divine conceptions and volitions but as we are led by the analogy of human acts. And so we must say that:

1. God’s power makes it possible for all things to be.

2. Next God knows them possible.

3. He knows what is convenient or fit to be made to his unsearchable ends.

4. He wills that they shall be, and man among the rest, and so on. If you will needs have the order of decrees, this is all that we can say of them. Arminian: All this pleases us well: but it will not please your own [moderate] party or the Calvinists that you make so many acts of election, which they tell you is but one entire thing, as mentioned in Scripture: Nor yet that you lay every decree or will upon foresight. Baxter: You are mistaken. No moderate, considerate man of them will deny anything that I have said, for:

1. As to the Scripture use of the word ‘election’, it is not the mere name that we are now opening, but the matter in question. Nor is it the expounding of particular texts that I am upon; and if I were, no man will deny but that the word ‘election’ is variously used in the Scripture: sometime for God’s eternal will to make us Christians of infidels, and to save us by Christ; and sometime for actual choosing us by converting grace in time; and sometime for actual choosing men in time by vocation to some office or special work, etc. And as to the distinguishing of all these volitions of God, no man will deny the effects to be distinct. Undoubtedly these are various effects of God:

1. To make man.

2. To give him the Covenant of Innocency.

3. To give him the Covenant of Grace, with all the common mercies of it.

4. To give some persons and nations the gospel and other mercies above the greatest part of the world, with answerable helps of the Spirit.

5. To give men special grace, effectual for faith and repentance.

6. To give men pardon, adoption and sanctification.

7. To give men perseverance.

8. To give them glory. And if these are various works, either you will distinguish of God’s will by his various works, or not. (Sive secundum nostram rationem distinguamus illud decretum in plura, sive dicamus esse unicum, non est multum curandum: Certum enim est apud omnes, Deum omnia et singula voluisse unico simplicissimo acta suae voluntatis: Est enim ipsius voluntas, et voluntatis operatio idem quod sua essentia simplex et individua si aliquis contenderet esse etiam nostro modo intelligendi esse unicum actum simplicissimum voluntatis, ego non curabo. [Whether, according to our manner of conceiving, we distinguish that decree into several [acts], or whether we say that it is one [act], it is not much to be concerned about. For it is certain among all, that God willed all things and each individual thing by one most simple act of His will. For His will, and the operation of His will, is the same as his simple and undivided essence. If someone were to contend that even according to our manner of understanding, there is one single most simple act of the will, I would not be concerned.] Vasquez on Thomas, pt. 1, quest. 14, art. 13, disp. 65; and is not this a short end of many controversies?) If you do not, our whole controversy about the order of the decrees is quickly at an end (and I am content with the abbreviation): For where there is no distinction, there is no order. And when I distinguish them never so much, I say, as well as any, that they are all one in regard of the one will or essence of God that wills them. In God there is no real diversity; but his will is thus variously denominated extrinsically from its respect to the various objects to which it does trans[p]ire, and of the various effects which it produces. And thus do all men talk of God. Else they could not distinguish his saving will from his damning will; nor election from rejection, in his decree. So that no man can tell how to differ here. And as to foresight, you as much mistake. For:

1. I say not that God foresees any good in any man, but what He gives him and wills to give him. But we speak of the order of those volitions in the way of execution. (Alexander Alesius is noted by Vasquez and others as singular for holding that predestination to the first grace was upon foresight of the future good use of that grace as the cause: But he denies that the first grace is actually given on the same cause: Therefore Vasquez thinks he changed his mind.)

2. And all men that ascribe intentions, volitions or purposes to God, do and must make the object of them as such to be quid cognitum [what is known], or something which some call an idea in the mind of God; It is not a prius volitum qua tale [first volition as such] that is the object of a volition, but bonum intellectum [the intellectual good]. And therefore nothing but foresight or apprehension of the thing needs to be put in the description of the object. Nor do I deny but that we must in our ordinary discourse speak comprehensively, and denominate ‘election’ eminently from the noblest parts: For as our full salvation includes all, or almost all, so our conversion and glorification presupposes all that antecedes. And therefore as we may and must talk of salvation in general, and not always stand to mention all the parts of it, so must we eminently talk of election to salvation as comprehending the rest, and not always stand to distinguish of the parts. But when you will make a controversy of the order and the object of these acts or parts, we must distinguish.”

— Richard Baxter, Catholic Theology Plain, Pure, Peaceable, for pacification of the dogmatical Word-Warriors who, (London: White, 1675), pt. 2, 1st Day’s Conference, about Predestination, pp. 12-14">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CEither+you+will+distinguish+God%E2%80%99s+decrees+by+the+objects%2C+or+not.+If+not%2C+you+must+not+distinguish+between+election+and+rejection%2C+willing+and+nilling%2C+loving+Peter+and+hating+Judas%2C+etc.+If+yea%2C+then+you+must+not+take+up+with+the+unexplained+words%2C+%E2%80%98reprobation%E2%80%99+and+%E2%80%98election%E2%80%99.+1.+By+reprobation+is+meant+either+God%E2%80%99s+will+to+punish+men.+2.+Or+his+will+to+give+them+no+special+saving+grace.+3.+Or+his+not-willing+to+give+it+them.+For+the+first%2C+I+told+you+before+that+the+object+of+God%E2%80%99s+will+to+punish+men+in+Hell+is+a+sinner+foreseen+finally+rejecting+mercy.+2.+The+object+of+his+will+to+punish+men+with+positive+temporal+punishments+is+the+sinner+foreseen+in+his+immediate+capacity+for+them.+3.+Whether+punishment+by+not+giving+that+Spirit+for+faith%2C+repentance+and+holiness%2C+be+decreed+%28being+nothing+but+a+not-giving%29+is+before+discussed.+But+if+it+could+be+proved%2C+yet+the+object+of+God%E2%80%99s+denying+further+mercy+and+help%2C+is+evermore+one+that+has+abused+former+mercy%2C+or+refuses+that+as+offered+to+him.+%28idem%2C+d.+95%2C+1+Ferrariensis+plane+indicat+Deum+neminem+damnare%2C+aut+rejicere+a+regno+suo+voluisse%2C+quod+ipse+appellat+deserere%2C+nisi+pravisa+culpa+%5BFerrariensis+plainly+indicates+that+God+willed+to+damn+no+one+or+to+reject+anyone+from+his+kingdom%2C+which+he+calls+%E2%80%98to+desert%2C%E2%80%99+except+on+account+of+foreseen+sin.%5D.%29+4.+But+God%E2%80%99s+non-volition+to+give+grace+is+no+act+and+has+no+object.+But+we+judge+that+all+mankind+are+now+from+under+the+mere+Covenant+of+Innocency%2C+and+that+none+perish+but+for+the+abuse+of+mercy%2C+which+had+a+tendency+to+their+recovery+%28the+case+of+infants+must+be+spoke+to+in+its+place+once+for+all%29.+But+all+this+belongs+to+the+case+of+grace+and+free-will.+And+2.+As+for+election%2C+we+say+that%3A+%28How+Augustine+distinguished+election+to+justification+and+%5Belection%5D+to+glory%2C+see+him%2C+bk.+1%2C+to+Simplicius%2C+quest.+2+and+that+which+about+this+Vasquez+has+on+Thomas%2C+pt.+1%2C+disp.+89%2C+ch.+6%29+1.+The+object+of+God%E2%80%99s+will+to+glorify+men%2C+is+man+sanctifying+and+persevering+in+an+immediate+capacity+for+glory+in+esse+cognito+%5Bknown+being%5D.+2.+The+object+of+God%E2%80%99s+will+to+give+the+grace+of+perseverance%2C+is+a+foreseen+sanctified+person+in+the+next+capacity.+3.+The+object+of+God%E2%80%99s+will+to+justify%2C+sanctify+and+adopt%2C+is+a+foreseen+believer.+4.+The+object+of+God%E2%80%99s+will+to+give+special+grace%2C+which+shall+effectually+cause+men+to+repent+and+believe%2C+is+ordinarily+a+foreseen+disposed+sinner+prepared+by+his+common+grace%2C+but+sometimes+an+unprepared+sinner%2C+whom%2C+of+his+free+will%2C+he+will+suddenly+convert%2C+as+it+pleases+him+freely+to+distribute+his+benefits+%28all+being+unworthy%29.+5.+The+object+of+God%E2%80%99s+will%2C+to+give+the+highest+degrees+of+common+grace%2C+external+%28in+the+purest+preaching+of+the+Gospel%2C+and+other+mercies%29+and+internal+%28in+greater+helps+of+the+Spirit%29+is+sometimes+a+sinner+in+esse+cognito%2C+who+has+not+grossly+rejected+lower+helps%2C+and+sometimes+freely+the+worser+sort+of+sinners+who+have+abused+former+mercies.+6.+The+object+of+God%E2%80%99s+will+to+give+the+first+common+mercy+which+has+a+tendency+in+its+use+to+men%E2%80%99s+recovery+and+salvation%2C+is+all+mankind+fallen+in+Adam%3A+For+all+are+under+the+New+Covenant+of+Grace+made+with+Adam%2C+Gen.+3%3A15%2C+in+some+degree+%28and+with+Noah%29+and+all+have+much+mercy+tending+to+repentance%3B+and+none+are+left+as+the+devils+in+despair%2C+without+any+offered+remedy+or+help.+7.+The+object+of+God%E2%80%99s+will+to+give+man+the+Covenant+of+Innocency%2C+was+Adam+foreseen+as+mere+man.+8.+The+object+of+God%E2%80%99s+will+to+create+man+was+nothing%2C+in+the+sense+that+we+now+take+an+object+in%2C+that+is%2C+for+the+materia+circa+quam+%5Bmatter+around+which%5D.+But+if+you+will+call+the+intended+effect+the+object%2C+then+the+object+of+God%E2%80%99s+will+here+%28and+in+the+rest%29+is+the+thing+willed.+But+if+you+will+needs+presume+to+seek+one+higher+in+the+mind+of+God+%28man+knows+by+reception+and+so+has+ideas%2C+but+God+can+be+no+recipient%29%2C+you+must+say+that+it+was+man+as+conceived+fit+to+be%2C+as+well+as+possible.+For+we+can+think+no+otherwise+of+the+divine+conceptions+and+volitions+but+as+we+are+led+by+the+analogy+of+human+acts.+And+so+we+must+say+that%3A+1.+God%E2%80%99s+power+makes+it+possible+for+all+things+to+be.+2.+Next+God+knows+them+possible.+3.+He+knows+what+is+convenient+or+fit+to+be+made+to+his+unsearchable+ends.+4.+He+wills+that+they+shall+be%2C+and+man+among+the+rest%2C+and+so+on.+If+you+will+needs+have+the+order+of+decrees%2C+this+is+all+that+we+can+say+of+them.+Arminian%3A+All+this+pleases+us+well%3A+but+it+will+not+please+your+own+%5Bmoderate%5D+party+or+the+Calvinists+that+you+make+so+many+acts+of+election%2C+which+they+tell+you+is+but+one+entire+thing%2C+as+mentioned+in+Scripture%3A+Nor+yet+that+you+lay+every+decree+or+will+upon+foresight.+Baxter%3A+You+are+mistaken.+No+moderate%2C+considerate+man+of+them+will+deny+anything+that+I+have+said%2C+for%3A+1.+As+to+the+Scripture+use+of+the+word+%E2%80%98election%E2%80%99%2C+it+is+not+the+mere+name+that+we+are+now+opening%2C+but+the+matter+in+question.+Nor+is+it+the+expounding+of+particular+texts+that+I+am+upon%3B+and+if+I+were%2C+no+man+will+deny+but+that+the+word+%E2%80%98election%E2%80%99+is+variously+used+in+the+Scripture%3A+sometime+for+God%E2%80%99s+eternal+will+to+make+us+Christians+of+infidels%2C+and+to+save+us+by+Christ%3B+and+sometime+for+actual+choosing+us+by+converting+grace+in+time%3B+and+sometime+for+actual+choosing+men+in+time+by+vocation+to+some+office+or+special+work%2C+etc.+And+as+to+the+distinguishing+of+all+these+volitions+of+God%2C+no+man+will+deny+the+effects+to+be+distinct.+Undoubtedly+these+are+various+effects+of+God%3A+1.+To+make+man.+2.+To+give+him+the+Covenant+of+Innocency.+3.+To+give+him+the+Covenant+of+Grace%2C+with+all+the+common+mercies+of+it.+4.+To+give+some+persons+and+nations+the+gospel+and+other+mercies+above+the+greatest+part+of+the+world%2C+with+answerable+helps+of+the+Spirit.+5.+To+give+men+special+grace%2C+effectual+for+faith+and+repentance.+6.+To+give+men+pardon%2C+adoption+and+sanctification.+7.+To+give+men+perseverance.+8.+To+give+them+glory.+And+if+these+are+various+works%2C+either+you+will+distinguish+of+God%E2%80%99s+will+by+his+various+works%2C+or+not.+%28Sive+secundum+nostram+rationem+distinguamus+illud+decretum+in+plura%2C+sive+dicamus+esse+unicum%2C+non+est+multum+curandum%3A+Certum+enim+est+apud+omnes%2C+Deum+omnia+et+singula+voluisse+unico+simplicissimo+acta+suae+voluntatis%3A+Est+enim+ipsius+voluntas%2C+et+voluntatis+operatio+idem+quod+sua+essentia+simplex+et+individua+si+aliquis+contenderet+esse+etiam+nostro+modo+intelligendi+esse+unicum+actum+simplicissimum+voluntatis%2C+ego+non+curabo.+%5BWhether%2C+according+to+our+manner+of+conceiving%2C+we+distinguish+that+decree+into+several+%5Bacts%5D%2C+or+whether+we+say+that+it+is+one+%5Bact%5D%2C+it+is+not+much+to+be+concerned+about.+For+it+is+certain+among+all%2C+that+God+willed+all+things+and+each+individual+thing+by+one+most+simple+act+of+His+will.+For+His+will%2C+and+the+operation+of+His+will%2C+is+the+same+as+his+simple+and+undivided+essence.+If+someone+were+to+contend+that+even+according+to+our+manner+of+understanding%2C+there+is+one+single+most+simple+act+of+the+will%2C+I+would+not+be+concerned.%5D+Vasquez+on+Thomas%2C+pt.+1%2C+quest.+14%2C+art.+13%2C+disp.+65%3B+and+is+not+this+a+short+end+of+many+controversies%3F%29+If+you+do+not%2C+our+whole+controversy+about+the+order+of+the+decrees+is+quickly+at+an+end+%28and+I+am+content+with+the+abbreviation%29%3A+For+where+there+is+no+distinction%2C+there+is+no+order.+And+when+I+distinguish+them+never+so+much%2C+I+say%2C+as+well+as+any%2C+that+they+are+all+one+in+regard+of+the+one+will+or+essence+of+God+that+wills+them.+In+God+there+is+no+real+diversity%3B+but+his+will+is+thus+variously+denominated+extrinsically+from+its+respect+to+the+various+objects+to+which+it+does+trans%5Bp%5Dire%2C+and+of+the+various+effects+which+it+produces.+And+thus+do+all+men+talk+of+God.+Else+they+could+not+distinguish+his+saving+will+from+his+damning+will%3B+nor+election+from+rejection%2C+in+his+decree.+So+that+no+man+can+tell+how+to+differ+here.+And+as+to+foresight%2C+you+as+much+mistake.+For%3A+1.+I+say+not+that+God+foresees+any+good+in+any+man%2C+but+what+He+gives+him+and+wills+to+give+him.+But+we+speak+of+the+order+of+those+volitions+in+the+way+of+execution.+%28Alexander+Alesius+is+noted+by+Vasquez+and+others+as+singular+for+holding+that+predestination+to+the+first+grace+was+upon+foresight+of+the+future+good+use+of+that+grace+as+the+cause%3A+But+he+denies+that+the+first+grace+is+actually+given+on+the+same+cause%3A+Therefore+Vasquez+thinks+he+changed+his+mind.%29+2.+And+all+men+that+ascribe+intentions%2C+volitions+or+purposes+to+God%2C+do+and+must+make+the+object+of+them+as+such+to+be+quid+cognitum+%5Bwhat+is+known%5D%2C+or+something+which+some+call+an+idea+in+the+mind+of+God%3B+It+is+not+a+prius+volitum+qua+tale+%5Bfirst+volition+as+such%5D+that+is+the+object+of+a+volition%2C+but+bonum+intellectum+%5Bthe+intellectual+good%5D.+And+therefore+nothing+but+foresight+or+apprehension+of+the+thing+needs+to+be+put+in+the+description+of+the+object.+Nor+do+I+deny+but+that+we+must+in+our+ordinary+discourse+speak+comprehensively%2C+and+denominate+%E2%80%98election%E2%80%99+eminently+from+the+noblest+parts%3A+For+as+our+full+salvation+includes+all%2C+or+almost+all%2C+so+our+conversion+and+glorification+presupposes+all+that+antecedes.+And+therefore+as+we+may+and+must+talk+of+salvation+in+general%2C+and+not+always+stand+to+mention+all+the+parts+of+it%2C+so+must+we+eminently+talk+of+election+to+salvation+as+comprehending+the+rest%2C+and+not+always+stand+to+distinguish+of+the+parts.+But+when+you+will+make+a+controversy+of+the+order+and+the+object+of+these+acts+or+parts%2C+we+must+distinguish.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Catholic+Theology+Plain%2C+Pure%2C+Peaceable%2C+for+pacification+of+the+dogmatical+Word-Warriors+who%2C+%28London%3A+White%2C+1675%29%2C+pt.+2%2C+1st+Day%E2%80%99s+Conference%2C+about+Predestination%2C+pp.+12-14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F89e695a2a9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/89e695a2a9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infralapsarianism-supralapsarianism/#:~:text=Either%20you%20will%20distinguish%20God%E2%80%99s%20decrees,acts%20or%20parts%2C%20we%20must%20distinguish&amp;text=Either%20you%20will%20distinguish%20God%E2%80%99s%20decrees%20by%20the&amp;text=of%20these%20acts%20or%20parts%2C%20we%20must%20distinguish" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Those of mankind that are predestinated unto life, God, before the foundation of the world was laid, according to his eternal and immutable purpose, and the secret counsel and good pleasure of his will, hath chosen, in Christ, unto everlasting glory, out of his mere free grace and love, without any foresight of faith, or good works, or perseverance in either of them, or any other thing in the creature, as conditions, or causes moving him thereunto; and all to the praise of his glorious grace.</p></blockquote>

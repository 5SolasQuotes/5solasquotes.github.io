<main class="wrap"><figure class="quote" id="q-b066cda5ea" data-kw="">
<blockquote><p>But since before baptism was instituted God’s people had circumcision instead, let us examine how these two signs differ from each other, and in what respects they are alike. From this will appear the anagogic relationship of the one to the other. When the Lord commands Abraham to observe circumcision, he previously states that he will be God to him and his descendants [Gen. 17:7, 10], adding that he possesses the abundance and sufficiency of all things [Gen. 17:1, 6, 8]. This he does in order that Abraham may regard His hand as the source of every good. The promise of eternal life is contained in these words as Christ interprets them, drawing an argument from them for the immortality and resurrection of believers. For Christ says, “He is not the God of the dead but of the living” [Luke 20:38; Matt. 22:32]. Paul also, therefore, when he shows to the Ephesians out of what destruction the Lord has delivered them, from the fact that they had not been admitted into the covenant of circumcision infers that they were without Christ, without God, without hope, strangers to the testaments of promise [Eph. 2:12]—all of which the covenant itself contained. But the first access to God, the first entry into immortal life, is the forgiveness of sins. Accordingly, this corresponds to the promise of baptism that we shall be cleansed. Afterward, the Lord covenants with Abraham that he should walk before him in uprightness and innocence of heart [Gen. 17:1]. This applies to mortification, or regeneration.1 And lest anyone be in doubt, Moses more clearly explains elsewhere, when exhorting the Israelite people to circumcise the foreskin of their heart for the Lord [Deut. 10:16], that circumcision is the sign of mortification; on this account Israel has been chosen as the people of God out of all the nations of the earth [Deut. 10:15]. As God, when he adopts the posterity of Abraham as his people, commands them to be circumcised, so Moses declares that they ought to be circumcised in heart, explaining the true meaning of this carnal circumcision [Deut. 30:6]. Again, that no man should strive after it by his own strength, Moses teaches that it is a work of God’s grace. All these things are so often reiterated by the prophets that there is no need to heap up here the many texts, as they occur repeatedly [Jer. 4:4; Ezek. 16:30]. We have, therefore, a spiritual promise given to the patriarchs in circumcision such as is given us in baptism, since it represented for them forgiveness of sins and mortification of flesh. Moreover, as we have taught that Christ is the foundation of baptism, in whom both of these reside, so it is also evident that he is the foundation of circumcision. For he is promised to Abraham, and in him the blessing of all nations [Gen. 12:2–3]. To seal this grace, the sign of circumcision is added.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (Battles edition), 4.16.3</span></figcaption>

<blockquote><p>Q. What warrant is there, Act. 2. 39. for Infant Baptism? Ans. I shall not contend for the actual baptizing of them at that instant. But every one of you be baptized ἕκαστος father and sons. Why? the promise is to you and to your children, break the Text into an hundred pieces, and blood it as men please, the Genuine Thesis which cannot be neglected, is, These to whom the promise of the Covenant does belong, these should be baptized, ἐπαγγελία. But the promise of the Covenant is to you and to your children. Ergo, you and your children should be baptized. The assumption is the express words of Peter and the Proposition is Peters. Every one of you be baptized, ὑμῖν γὰρ ἐστιν for to you is the promise of the Covenant. Calvin, Bullinger, Brentius, Gualther clear it.

2. Who they are, who are in the nearest capacity to be baptized, he explains, when he showeth, that the Covenant promise is made to those who are far off, to the Gentiles, who the Lord shall call, then all that are under the call and offer of Christ in the preached Gospel, as Prov. 9. 1, 2, 3, 4. Matth. 22. bid them come to the wedding, Luke 14. 16, 17, 18. &amp;c. are externally in Covenant, and such to whom the Covenant is made, and should be baptized, its presumed they give some professed consent to the call and do not right down deny to come, else they should be baptized against their will.

3. Calvin shows Acts 2. 39. that the Anabaptists in his time, said, the promise was made to Believers only, but the Text saith, it is made to you and to your children, to infants, to the children of the Prophets and of the Covenant made with the fathers, Acts 3. 25. Now what ground do Anabaptists give that all infants believe, or that some believe, since to them, their children were as Pagans without Christ, without the Covenant? if to the children when they come to age and shall believe? but what need to add, and to your believing Children? for these are not children but men of age, their fathers and they both being believers. Now Peter sets down two ranks, the aged who heard the word with gladness, and were pricked in heart, v. 37. 41. and the children, and to both the promise is made, and what ground is there to exclude sucking children? for the word, Acts 2. 39. is Matth. 2. 18. 1 Cor. 7. 14. where sure the word is taken for sucking children of whose actual faith the Scripture speaks not. 2. The promise is to you and to your children, can have no other sense then, the promise and word of the Covenant is preached to you and to your children in you, and this is to be externally in Covenant, both under the Old and New Testament. If it have another sense it must be this, the Lord hath internally Covenanted with you the 3000. who have heard the word and with your children, and you are the spiritual seed, and sons of promise, predestinate to life eternal: as Rom. 9. they expone the seed in Covenant: But 1. Were all the 3000. Ananias and Sapphira and their children the spiritual and chosen seed? for he commands all, whom he exhorts to repent, to be baptized: And 2. Now to Simon Magus and Demas, and numbers of such, Peter could not have said, the promise is made to you and to your children, if it be only made to real and actual believers, as they say, Peter therefore must own them all whom he exhorts to repent, as the chosen seed. But if the former sense be intended (as how can it be denied?) to wit, the word of the Covenant is preached to you, an offer of Christ is made in the preached Gospel to you. Then it cannot be denied, but the promises to all the Reprobate in the Visible Church whether they believe or not, for Christ is preached; and promises of the Covenant are Preached to Simon Magus, to Judas and all the Hypocrites who stumble at the word, to all the Pharisees, as is clear, Math. 13. 20, 21, 22, 23. Acts 13. 44, 45. Acts 18. 5, 6. Math. 21. 43. 1 Pet. 2. 7, 8. (3.) The promise, I will be your God, and ye shall be my people, must be one way expounded in the Old Testament, to wit, you are externally only in Covenant with God. But in the New Testament, it must have this meaning, I will be your God, 2. Cor. 6. 16. that is, you are all predestinate to life, and the sons, by promise, and the spiritual seed, to whom I say, I will be your God: But so it may well be said, there were no internal Covenanters in the Old Testament, and there be none but only internal Covenanters in the New Testament, so that when the Lord sayeth, Rev. 11. 15. The Kingdoms of the earth are mine, and my sons. He must say, the Kingdoms, Egypt, Assyria, Tyrus, Ethiopia, &amp;c. are chosen and the spiritual seed, and these Covenanted Nations and the Kingdoms of the Gentiles are all internally and effectually called, and there are no Visible Churches in the New Test. but only all invisible and saved.

4. If these words, The promise is to you, and to your Children, be limited, to as many as the Lord shall effectually call, either fathers or children: But Mr. Stev. Marshall judiciously observes; there is no more a Covenant-favour holden forth to their children, then to the children of Pagans; for the children of Pagans, if God effectually call them, have the promises made to them.

5. Its clear that external Covenant-holiness, is to these men ceremonial holiness now out of date; and then external calling the only means of internal and effectual calling, Math. 22. 14. 1 Cor. 1. 18. 23. 24. Luke 15. 1, 2. and the fixed Church-hearing of the Preached Gospel is a ceremony. 2. That God should be the God of Infants of the seed of the Jews, a mercy to fathers and sons coming from free love, Deut. 10. 15. Gen. 17. 7. Deut. 7. 6, 7, 8. and Prophesied as a mercy to the Gentiles by all the Prophets was a ceremony removed now in Christ. Yea 3. External covenanting and adopting, and choosing of Israel is no mercy, except that a Pedagogue of the Law is a mercy for a time.

4. The promise is to you and to your Children, must be in a contradictory way expounded, to wit, the promise is no more made to your Children so long as they are Infants, then to Devils. Yea Fathers and Children not believing, though chosen to life, are excommunicated from visible Adoption, calling, hearing the Gospel-promises, for there is no covenanting now under the New Testament, but only internal covenanting of the Elect.

5. Young Timothy and children of believing Parents, and all the aged within the visible Church, have no right to hear the preached Gospel, before they believe and be the holy seed, more then Pagans. Yea 6. They can have no command of God, to hear the Gospel, nor any covenant or Gospel warrant, until they be believers, for if there were no promise made to hearing and considering the word, if they shall believe, while as yet they believe not, and until they be effectually called, there can be no command, and no Law, to hear the Gospel and the covenant offer made in Christ. It shall then be no more sin for unconverted persons to turn away their ears from the Law, and not to hear the Gospel. 7. It were non-sense to say to men under the externally proposed covenant, repent, hear the Gospel, use the means, receive the seals, and yet you have no right to hear, nor have we any warrant to baptize you, until ye believe; for there is no promise made to you, nor to your seed and Children, until first you believe. And it must say there was no threatening to Adam. Gen. 2. 17. before he sinned, and no promise to Adam nor to any now, do this and live, until Adam first sinned, and first obeyed the covenant; and so, if John covenant to labour in Peters Vineyard, and Peter promise to him four pence, so he work twelve hours, otherwise he shall not pay him 4. pence, though John accept of the covenant, and work but one hour, whereas his covenant is to work for twelve hours, then no man can say to John (work, for there is a promise made of four pence to you) the other might deny; no such promise was made to me, except I work twelve hours. It were, sure, unfaithful dealing to John to say so. For the four pence ought not, by this Covenant, to be given to him except he work twelve hours: but he cannot without palpable falshood, say, I have broken no Covenant, in not working twelve hours: For though I consented to the covenant, and began to work an hour, yet the promise was not to me simply, but to me as working twelve hours; but there is neither face nor faith in this Answer: For the fulfilling of the covenant is only to give four pence to John, if he work 12. hours; but the promise and covenant was made to him and he hath foully broken. Yea a conditional covenant agreed unto and accepted, is a covenant, if we shall (as in reason we ought) distinguish between a covenant, in its essence and nature, and a covenant broken or fulfilled, a covenant or threatening, is a covenant and threatening obliging Adam, fit shall be agreed unto by silence, as Adam accepted the threatening, Gen. 2. 17. by silence, and Professors within the visible Church, by their professing of the Doctrine of the Gospel or covenant of grace, their receiving of the Seals and professed hearing of the Word, are under the covenant of Grace, and engage themselves to obey commands, promises, threatenings, and therefore promises are as properly made to them, Act. 2. 39. As commands, and threatenings, exhortations, invitations, and Gospel-requests are made to them. But though the Anabaptists ignorantly confound the promise, and the thing promised; the covenant, and benefits covenanted. The promise is to you, and so are the commands, and threatenings, whether ye believe or not, the command is to you, and lays an obligation on you, whether ye obey, or obey not, and the threatenings are to you, whether ye transgress or transgress not. It is true indeed, the promise, that is, the blessing promised, righteousness and eternal life is not given to you until you first believe. Object. Is not the promise made the same way to the aged as to the children; and the same thing required of both: The promise is to you and to your Children. But the promise is made to the aged only, if they actually believe. Ergo, the promise is made to the Children only, if they actually believe, and so not to Infants. Answ. Neither proposition nor assumption can bear weight. For the proposition when God saith, I will be thy God O Abraham, and the God of thy seed. Is it needful that God require the same conditions, that is actual believing that he may save Father Abraham, &amp; also actual believing from hearing the word of the covenant preached from all Infants born of Abraham and dying in Infancy, or then all these Infants so dying must be eternally damned? nay, we believe many Infants (we reserve to the holy and glorious Lord his liberty of election &amp; reprobation, Rom. 9. 11. 12) among the Jews were saved by the covenant of grace, though they died Infants. And this we condemn in Anabaptists, that they show no revealed way of God of saving Infants of believing Parents dying in Infancy, more then of saving Pagans and their Infants, for to them both are alike without the covenant of grace and without Christ; and therefore believing Parents have no word of faith, or of the Gospel to pray for the salvation of their children dying in Infancy, for such prayers have neither warrant in the covenant of Works, nor in the covenant of grace by their way. And yet that we are to pray, is to be gathered from Gen. 19. 18. 2 Sam. 12. 16. Job. 1. 5. Mark 10. 16. Psal. 28. 9, and if we pray for their salvation, they must be saved by either Law or Gospel Its not enough, to say that we may pray for savages that never heard of the Gospel, nor of the covenant of grace, that they may be saved. For seeing there is no name under Heaven by which men may be saved, but by the name of Jesus, Acts 4. 12. John 14. 6. There is no other warrant of praying for such, then that God would send them the Gospel, and since Christ prayed for Infants and blessed them, which is a praying for them, Gen. 48. 15, 16 Deut. 33. 1. 6, 7, 8. &amp;c. Eph. 1.

2. Gal. 1. 3. 1 Cor. 1. 3. 1 Tim. 1. 2. 2 Tim. 1.

3. See Mar. 10. 16. he must own them as blessed in Christ, in whom all the Nations of the earth are blessed, and so covenanted with God in Christ. 2. It is false that the promise is made only to the aged, upon condition of actual believing. 1. It is made to their children expressly in the Text, and for the way of their believing, we leave it to the Lord. Nor is it true, that the promise is made to the aged, upon condition of believing. The promise is made to them absolutely, whether they believe or not. But the blessing of the promise and covenant of grace is given and bestowed only conditionally, if they believe. The promise is absolutely made: its called conditional from the thing conditionally given. Obj. But is not this an approven distinction, that persons are within the Covenant, either externally, professedly, visibly, or internally, really, or according to the intention of God? Ergo, such as are externally within the Covenant, are not really and indeed within the covenant of grace. Ans. The Adverb (really) relates to the real fruit of the fulfilled covenant, and so such as are only externally within the covenant, are not really within the covenant, for God never directed, nor intended to bestow the blessing covenanted, nor grace to perform the condition of the covenant upon them? but they are really covenanted and engaged by their consented profession to fulfill the covenant. And as the commands and threatenings of the covenant of grace lay on a real obligation, upon such as are only externally in covenant, either to obey or suffer, so the promise of the covenant imposes an engagement &amp; obligation upon such to believe the promise, but sometimes, we say the promises of the covenant of grace are not really made to the Reprobate within the visible Church, because God intends and decrees to, and for them, neither the blessing promised, nor the saving grace to fulfill the condition or to believe. And therefore these words are figurative, Heb. 8. 10. This is the Covenant that I will make with the house of Israel, I will write my Law in their minds, &amp;c. that is, this is the special and principal covenanted blessing, I will give them a new heart: which must not be called a simple prediction, though a prediction it is, but it is also a real promise made absolutely to the Elect, which the Lord fulfills in them: And this is called the Covenant. Because 1. They are no better then nonCovenanters upon whom the Lord bestows not this part and blessing of the covenant. 2. The truth is, the promise of a new heart is not made to the visible Church, which is only visible: but to the Elect &amp; invisible Church. And if Anabaptists shall expone these words, Acts 2. 39. The promise of a new heart is made to you and to your Children, upon condition that you and your Children believe, which they cannot do until first they have a new heart, its as good as Peter had said, God promiseth to you and to your Children grace to believe, and a new heart to obey him, upon condition that you first believe. And that is, Gods promise to you to believe upon condition that ye believe, which is ridiculous, and therefore we cannot say that this promise of a new heart is made to all that are commanded to believe and repent and be baptized. For Elect and Reprobate, and all are under these commands, if they be members of the visible Church. But the promise of a new heart is not made to all within the visible Church.</p></blockquote>

2. Who they are, who are in the nearest capacity to be baptized, he explains, when he showeth, that the Covenant promise is made to those who are far off, to the Gentiles, who the Lord shall call, then all that are under the call and offer of Christ in the preached Gospel, as Prov. 9. 1, 2, 3, 4. Matth. 22. bid them come to the wedding, Luke 14. 16, 17, 18. &amp;c. are externally in Covenant, and such to whom the Covenant is made, and should be baptized, its presumed they give some professed consent to the call and do not right down deny to come, else they should be baptized against their will.

3. Calvin shows Acts 2. 39. that the Anabaptists in his time, said, the promise was made to Believers only, but the Text saith, it is made to you and to your children, to infants, to the children of the Prophets and of the Covenant made with the fathers, Acts 3. 25. Now what ground do Anabaptists give that all infants believe, or that some believe, since to them, their children were as Pagans without Christ, without the Covenant? if to the children when they come to age and shall believe? but what need to add, and to your believing Children? for these are not children but men of age, their fathers and they both being believers. Now Peter sets down two ranks, the aged who heard the word with gladness, and were pricked in heart, v. 37. 41. and the children, and to both the promise is made, and what ground is there to exclude sucking children? for the word, Acts 2. 39. is Matth. 2. 18. 1 Cor. 7. 14. where sure the word is taken for sucking children of whose actual faith the Scripture speaks not. 2. The promise is to you and to your children, can have no other sense then, the promise and word of the Covenant is preached to you and to your children in you, and this is to be externally in Covenant, both under the Old and New Testament. If it have another sense it must be this, the Lord hath internally Covenanted with you the 3000. who have heard the word and with your children, and you are the spiritual seed, and sons of promise, predestinate to life eternal: as Rom. 9. they expone the seed in Covenant: But 1. Were all the 3000. Ananias and Sapphira and their children the spiritual and chosen seed? for he commands all, whom he exhorts to repent, to be baptized: And 2. Now to Simon Magus and Demas, and numbers of such, Peter could not have said, the promise is made to you and to your children, if it be only made to real and actual believers, as they say, Peter therefore must own them all whom he exhorts to repent, as the chosen seed. But if the former sense be intended (as how can it be denied?) to wit, the word of the Covenant is preached to you, an offer of Christ is made in the preached Gospel to you. Then it cannot be denied, but the promises to all the Reprobate in the Visible Church whether they believe or not, for Christ is preached; and promises of the Covenant are Preached to Simon Magus, to Judas and all the Hypocrites who stumble at the word, to all the Pharisees, as is clear, Math. 13. 20, 21, 22, 23. Acts 13. 44, 45. Acts 18. 5, 6. Math. 21. 43. 1 Pet. 2. 7, 8. (3.) The promise, I will be your God, and ye shall be my people, must be one way expounded in the Old Testament, to wit, you are externally only in Covenant with God. But in the New Testament, it must have this meaning, I will be your God, 2. Cor. 6. 16. that is, you are all predestinate to life, and the sons, by promise, and the spiritual seed, to whom I say, I will be your God: But so it may well be said, there were no internal Covenanters in the Old Testament, and there be none but only internal Covenanters in the New Testament, so that when the Lord sayeth, Rev. 11. 15. The Kingdoms of the earth are mine, and my sons. He must say, the Kingdoms, Egypt, Assyria, Tyrus, Ethiopia, &amp;c. are chosen and the spiritual seed, and these Covenanted Nations and the Kingdoms of the Gentiles are all internally and effectually called, and there are no Visible Churches in the New Test. but only all invisible and saved.

4. If these words, The promise is to you, and to your Children, be limited, to as many as the Lord shall effectually call, either fathers or children: But Mr. Stev. Marshall judiciously observes; there is no more a Covenant-favour holden forth to their children, then to the children of Pagans; for the children of Pagans, if God effectually call them, have the promises made to them.

5. Its clear that external Covenant-holiness, is to these men ceremonial holiness now out of date; and then external calling the only means of internal and effectual calling, Math. 22. 14. 1 Cor. 1. 18. 23. 24. Luke 15. 1, 2. and the fixed Church-hearing of the Preached Gospel is a ceremony. 2. That God should be the God of Infants of the seed of the Jews, a mercy to fathers and sons coming from free love, Deut. 10. 15. Gen. 17. 7. Deut. 7. 6, 7, 8. and Prophesied as a mercy to the Gentiles by all the Prophets was a ceremony removed now in Christ. Yea 3. External covenanting and adopting, and choosing of Israel is no mercy, except that a Pedagogue of the Law is a mercy for a time.

of+the+Prophets+and+of+the+Covenant+made+with+the+fathers%2C+Acts+3.+25.+Now+what+ground+do+Anabaptists+give+that+all+infants+believe%2C+or+that+some+believe%2C+since+to+them%2C+their+children+were+as+Pagans+without+Christ%2C+without+the+Covenant%3F+if+to+the+children+when+they+come+to+age+and+shall+believe%3F+but+what+need+to+add%2C+and+to+your+believing+Children%3F+for+these+are+not+children+but+men+of+age%2C+their+fathers+and+they+both+being+believers.+Now+Peter+sets+down+two+ranks%2C+the+aged+who+heard+the+word+with+gladness%2C+and+were+pricked+in+heart%2C+v.+37.+41.+and+the+children%2C+and+to+both+the+promise+is+made%2C+and+what+ground+is+there+to+exclude+sucking+children%3F+for+the+word%2C+Acts+2.+39.+is+Matth.+2.+18.+1+Cor.+7.+14.+where+sure+the+word+is+taken+for+sucking+children+of+whose+actual+faith+the+Scripture+speaks+not.+2.+The+promise+is+to+you+and+to+your+children%2C+can+have+no+other+sense+then%2C+the+promise+and+word+of+the+Covenant+is+preached+to+you+and+to+your+children+in+you%2C+and+this+is+to+be+externally+in+Covenant%2C+both+under+the+Old+and+New+Testament.+If+it+have+another+sense+it+must+be+this%2C+the+Lord+hath+internally+Covenanted+with+you+the+3000.+who+have+heard+the+word+and+with+your+children%2C+and+you+are+the+spiritual+seed%2C+and+sons+of+promise%2C+predestinate+to+life+eternal%3A+as+Rom.+9.+they+expone+the+seed+in+Covenant%3A+But+1.+Were+all+the+3000.+Ananias+and+Sapphira+and+their+children+the+spiritual+and+chosen+seed%3F+for+he+commands+all%2C+whom+he+exhorts+to+repent%2C+to+be+baptized%3A+And+2.+Now+to+Simon+Magus+and+Demas%2C+and+numbers+of+such%2C+Peter+could+not+have+said%2C+the+promise+is+made+to+you+and+to+your+children%2C+if+it+be+only+made+to+real+and+actual+believers%2C+as+they+say%2C+Peter+therefore+must+own+them+all+whom+he+exhorts+to+repent%2C+as+the+chosen+seed.+But+if+the+former+sense+be+intended+%28as+how+can+it+be+denied%3F%29+to+wit%2C+the+word+of+the+Covenant+is+preached+to+you%2C+an+offer+of+Christ+is+made+in+the+preached+Gospel+to+you.+Then+it+cannot+be+denied%2C+but+the+promises+to+all+the+Reprobate+in+the+Visible+Church+whether+they+believe+or+not%2C+for+Christ+is+preached%3B+and+promises+of+the+Covenant+are+Preached+to+Simon+Magus%2C+to+Judas+and+all+the+Hypocrites+who+stumble+at+the+word%2C+to+all+the+Pharisees%2C+as+is+clear%2C+Math.+13.+20%2C+21%2C+22%2C+23.+Acts+13.+44%2C+45.+Acts+18.+5%2C+6.+Math.+21.+43.+1+Pet.+2.+7%2C+8.+%283.%29+The+promise%2C+I+will+be+your+God%2C+and+ye+shall+be+my+people%2C+must+be+one+way+expounded+in+the+Old+Testament%2C+to+wit%2C+you+are+externally+only+in+Covenant+with+God.+But+in+the+New+Testament%2C+it+must+have+this+meaning%2C+I+will+be+your+God%2C+2.+Cor.+6.+16.+that+is%2C+you+are+all+predestinate+to+life%2C+and+the+sons%2C+by+promise%2C+and+the+spiritual+seed%2C+to+whom+I+say%2C+I+will+be+your+God%3A+But+so+it+may+well+be+said%2C+there+were+no+internal+Covenanters+in+the+Old+Testament%2C+and+there+be+none+but+only+internal+Covenanters+in+the+New+Testament%2C+so+that+when+the+Lord+sayeth%2C+Rev.+11.+15.+The+Kingdoms+of+the+earth+are+mine%2C+and+my+sons.+He+must+say%2C+the+Kingdoms%2C+Egypt%2C+Assyria%2C+Tyrus%2C+Ethiopia%2C+%26c.+are+chosen+and+the+spiritual+seed%2C+and+these+Covenanted+Nations+and+the+Kingdoms+of+the+Gentiles+are+all+internally+and+effectually+called%2C+and+there+are+no+Visible+Churches+in+the+New+Test.+but+only+all+invisible+and+saved.+4.+If+these+words%2C+The+promise+is+to+you%2C+and+to+your+Children%2C+be+limited%2C+to+as+many+as+the+Lord+shall+effectually+call%2C+either+fathers+or+children%3A+But+Mr.+Stev.+Marshall+judiciously+observes%3B+there+is+no+more+a+Covenant-favour+holden+forth+to+their+children%2C+then+to+the+children+of+Pagans%3B+for+the+children+of+Pagans%2C+if+God+effectually+call+them%2C+have+the+promises+made+to+them.+5.+Its+clear+that+external+Covenant-holiness%2C+is+to+these+men+ceremonial+holiness+now+out+of+date%3B+and+then+external+calling+the+only+means+of+internal+and+effectual+calling%2C+Math.+22.+14.+1+Cor.+1.+18.+23.+24.+Luke+15.+1%2C+2.+and+the+fixed+Church-hearing+of+the+Preached+Gospel+is+a+ceremony.+2.+That+God+should+be+the+God+of+Infants+of+the+seed+of+the+Jews%2C+a+mercy+to+fathers+and+sons+coming+from+free+love%2C+Deut.+10.+15.+Gen.+17.+7.+Deut.+7.+6%2C+7%2C+8.+and+Prophesied+as+a+mercy+to+the+Gentiles+by+all+the+Prophets+was+a+ceremony+removed+now+in+Christ.+Yea+3.+External+covenanting+and+adopting%2C+and+choosing+of+Israel+is+no+mercy%2C+except+that+a+Pedagogue+of+the+Law+is+a+mercy+for+a+time.+4.+The+promise+is+to+you+and+to+your+Children%2C+must+be+in+a+contradictory+way+expounded%2C+to+wit%2C+the+promise+is+no+more+made+to+your+Children+so+long+as+they+are+Infants%2C+then+to+Devils.+Yea+Fathers+and+Children+not+believing%2C+though+chosen+to+life%2C+are+excommunicated+from+visible+Adoption%2C+calling%2C+hearing+the+Gospel-promises%2C+for+there+is+no+covenanting+now+under+the+New+Testament%2C+but+only+internal+covenanting+of+the+Elect.+5.+Young+Timothy+and+children+of+believing+Parents%2C+and+all+the+aged+within+the+visible+Church%2C+have+no+right+to+hear+the+preached+Gospel%2C+before+they+believe+and+be+the+holy+seed%2C+more+then+Pagans.+Yea+6.+They+can+have+no+command+of+God%2C+to+hear+the+Gospel%2C+nor+any+covenant+or+Gospel+warrant%2C+until+they+be+believers%2C+for+if+there+were+no+promise+made+to+hearing+and+considering+the+word%2C+if+they+shall+believe%2C+while+as+yet+they+believe+not%2C+and+until+they+be+effectually+called%2C+there+can+be+no+command%2C+and+no+Law%2C+to+hear+the+Gospel+and+the+covenant+offer+made+in+Christ.+It+shall+then+be+no+more+sin+for+unconverted+persons+to+turn+away+their+ears+from+the+Law%2C+and+not+to+hear+the+Gospel.+7.+It+were+non-sense+to+say+to+men+under+the+externally+proposed+covenant%2C+repent%2C+hear+the+Gospel%2C+use+the+means%2C+receive+the+seals%2C+and+yet+you+have+no+right+to+hear%2C+nor+have+we+any+warrant+to+baptize+you%2C+until+ye+believe%3B+for+there+is+no+promise+made+to+you%2C+nor+to+your+seed+and+Children%2C+until+first+you+believe.+And+it+must+say+there+was+no+threatening+to+Adam.+Gen.+2.+17.+before+he+sinned%2C+and+no+promise+to+Adam+nor+to+any+now%2C+do+this+and+live%2C+until+Adam+first+sinned%2C+and+first+obeyed+the+covenant%3B+and+so%2C+if+John+covenant+to+labour+in+Peters+Vineyard%2C+and+Peter+promise+to+him+four+pence%2C+so+he+work+twelve+hours%2C+otherwise+he+shall+not+pay+him+4.+pence%2C+though+John+accept+of+the+covenant%2C+and+work+but+one+hour%2C+whereas+his+covenant+is+to+work+for+twelve+hours%2C+then+no+man+can+say+to+John+%28work%2C+for+there+is+a+promise+made+of+four+pence+to+you%29+the+other+might+deny%3B+no+such+promise+was+made+to+me%2C+except+I+work+twelve+hours.+It+were%2C+sure%2C+unfaithful+dealing+to+John+to+say+so.+For+the+four+pence+ought+not%2C+by+this+Covenant%2C+to+be+given+to+him+except+he+work+twelve+hours%3A+but+he+cannot+without+palpable+falshood%2C+say%2C+I+have+broken+no+Covenant%2C+in+not+working+twelve+hours%3A+For+though+I+consented+to+the+covenant%2C+and+began+to+work+an+hour%2C+yet+the+promise+was+not+to+me+simply%2C+but+to+me+as+working+twelve+hours%3B+but+there+is+neither+face+nor+faith+in+this+Answer%3A+For+the+fulfilling+of+the+covenant+is+only+to+give+four+pence+to+John%2C+if+he+work+12.+hours%3B+but+the+promise+and+covenant+was+made+to+him+and+he+hath+foully+broken.+Yea+a+conditional+covenant+agreed+unto+and+accepted%2C+is+a+covenant%2C+if+we+shall+%28as+in+reason+we+ought%29+distinguish+between+a+covenant%2C+in+its+essence+and+nature%2C+and+a+covenant+broken+or+fulfilled%2C+a+covenant+or+threatening%2C+is+a+covenant+and+threatening+obliging+Adam%2C+fit+shall+be+agreed+unto+by+silence%2C+as+Adam+accepted+the+threatening%2C+Gen.+2.+17.+by+silence%2C+and+Professors+within+the+visible+Church%2C+by+their+professing+of+the+Doctrine+of+the+Gospel+or+covenant+of+grace%2C+their+receiving+of+the+Seals+and+professed+hearing+of+the+Word%2C+are+under+the+covenant+of+Grace%2C+and+engage+themselves+to+obey+commands%2C+promises%2C+threatenings%2C+and+therefore+promises+are+as+properly+made+to+them%2C+Act.+2.+39.+As+commands%2C+and+threatenings%2C+exhortations%2C+invitations%2C+and+Gospel-requests+are+made+to+them.+But+though+the+Anabaptists+ignorantly+confound+the+promise%2C+and+the+thing+promised%3B+the+covenant%2C+and+benefits+covenanted.+The+promise+is+to+you%2C+and+so+are+the+commands%2C+and+threatenings%2C+whether+ye+believe+or+not%2C+the+command+is+to+you%2C+and+lays+an+obligation+on+you%2C+whether+ye+obey%2C+or+obey+not%2C+and+the+threatenings+are+to+you%2C+whether+ye+transgress+or+transgress+not.+It+is+true+indeed%2C+the+promise%2C+that+is%2C+the+blessing+promised%2C+righteousness+and+eternal+life+is+not+given+to+you+until+you+first+believe.+Object.+Is+not+the+promise+made+the+same+way+to+the+aged+as+to+the+children%3B+and+the+same+thing+required+of+both%3A+The+promise+is+to+you+and+to+your+Children.+But+the+promise+is+made+to+the+aged+only%2C+if+they+actually+believe.+Ergo%2C+the+promise+is+made+to+the+Children+only%2C+if+they+actually+believe%2C+and+so+not+to+Infants.+Answ.+Neither+proposition+nor+assumption+can+bear+weight.+For+the+proposition+when+God+saith%2C+I+will+be+thy+God+O+Abraham%2C+and+the+God+of+thy+seed.+Is+it+needful+that+God+require+the+same+conditions%2C+that+is+actual+believing+that+he+may+save+Father+Abraham%2C+%26+also+actual+believing+from+hearing+the+word+of+the+covenant+preached+from+all+Infants+born+of+Abraham+and+dying+in+Infancy%2C+or+then+all+these+Infants+so+dying+must+be+eternally+damned%3F+nay%2C+we+believe+many+Infants+%28we+reserve+to+the+holy+and+glorious+Lord+his+liberty+of+election+%26+reprobation%2C+Rom.+9.+11.+12%29+among+the+Jews+were+saved+by+the+covenant+of+grace%2C+though+they+died+Infants.+And+this+we+condemn+in+Anabaptists%2C+that+they+show+no+revealed+way+of+God+of+saving+Infants+of+believing+Parents+dying+in+Infancy%2C+more+then+of+saving+Pagans+and+their+Infants%2C+for+to+them+both+are+alike+without+the+covenant+of+grace+and+without+Christ%3B+and+therefore+believing+Parents+have+no+word+of+faith%2C+or+of+the+Gospel+to+pray+for+the+salvation+of+their+children+dying+in+Infancy%2C+for+such+prayers+have+neither+warrant+in+the+covenant+of+Works%2C+nor+in+the+covenant+of+grace+by+their+way.+And+yet+that+we+are+to+pray%2C+is+to+be+gathered+from+Gen.+19.+18.+2+Sam.+12.+16.+Job.+1.+5.+Mark+10.+16.+Psal.+28.+9%2C+and+if+we+pray+for+their+salvation%2C+they+must+be+saved+by+either+Law+or+Gospel+Its+not+enough%2C+to+say+that+we+may+pray+for+savages+that+never+heard+of+the+Gospel%2C+nor+of+the+covenant+of+grace%2C+that+they+may+be+saved.+For+seeing+there+is+no+name+under+Heaven+by+which+men+may+be+saved%2C+but+by+the+name+of+Jesus%2C+Acts+4.+12.+John+14.+6.+There+is+no+other+warrant+of+praying+for+such%2C+then+that+God+would+send+them+the+Gospel%2C+and+since+Christ+prayed+for+Infants+and+blessed+them%2C+which+is+a+praying+for+them%2C+Gen.+48.+15%2C+16+Deut.+33.+1.+6%2C+7%2C+8.+%26c.+Eph.+1.+2.+Gal.+1.+3.+1+Cor.+1.+3.+1+Tim.+1.+2.+2+Tim.+1.+3.+See+Mar.+10.+16.+he+must+own+them+as+blessed+in+Christ%2C+in+whom+all+the+Nations+of+the+earth+are+blessed%2C+and+so+covenanted+with+God+in+Christ.+2.+It+is+false+that+the+promise+is+made+only+to+the+aged%2C+upon+condition+of+actual+believing.+1.+It+is+made+to+their+children+expressly+in+the+Text%2C+and+for+the+way+of+their+believing%2C+we+leave+it+to+the+Lord.+Nor+is+it+true%2C+that+the+promise+is+made+to+the+aged%2C+upon+condition+of+believing.+The+promise+is+made+to+them+absolutely%2C+whether+they+believe+or+not.+But+the+blessing+of+the+promise+and+covenant+of+grace+is+given+and+bestowed+only+conditionally%2C+if+they+believe.+The+promise+is+absolutely+made%3A+its+called+conditional+from+the+thing+conditionally+given.+Obj.+But+is+not+this+an+approven+distinction%2C+that+persons+are+within+the+Covenant%2C+either+externally%2C+professedly%2C+visibly%2C+or+internally%2C+really%2C+or+according+to+the+intention+of+God%3F+Ergo%2C+such+as+are+externally+within+the+Covenant%2C+are+not+really+and+indeed+within+the+covenant+of+grace.+Ans.+The+Adverb+%28really%29+relates+to+the+real+fruit+of+the+fulfilled+covenant%2C+and+so+such+as+are+only+externally+within+the+covenant%2C+are+not+really+within+the+covenant%2C+for+God+never+directed%2C+nor+intended+to+bestow+the+blessing+covenanted%2C+nor+grace+to+perform+the+condition+of+the+covenant+upon+them%3F+but+they+are+really+covenanted+and+engaged+by+their+consented+profession+to+fulfill+the+covenant.+And+as+the+commands+and+threatenings+of+the+covenant+of+grace+lay+on+a+real+obligation%2C+upon+such+as+are+only+externally+in+covenant%2C+either+to+obey+or+suffer%2C+so+the+promise+of+the+covenant+imposes+an+engagement+%26+obligation+upon+such+to+believe+the+promise%2C+but+sometimes%2C+we+say+the+promises+of+the+covenant+of+grace+are+not+really+made+to+the+Reprobate+within+the+visible+Church%2C+because+God+intends+and+decrees+to%2C+and+for+them%2C+neither+the+blessing+promised%2C+nor+the+saving+grace+to+fulfill+the+condition+or+to+believe.+And+therefore+these+words+are+figurative%2C+Heb.+8.+10.+This+is+the+Covenant+that+I+will+make+with+the+house+of+Israel%2C+I+will+write+my+Law+in+their+minds%2C+%26c.+that+is%2C+this+is+the+special+and+principal+covenanted+blessing%2C+I+will+give+them+a+new+heart%3A+which+must+not+be+called+a+simple+prediction%2C+though+a+prediction+it+is%2C+but+it+is+also+a+real+promise+made+absolutely+to+the+Elect%2C+which+the+Lord+fulfills+in+them%3A+And+this+is+called+the+Covenant.+Because+1.+They+are+no+better+then+nonCovenanters+upon+whom+the+Lord+bestows+not+this+part+and+blessing+of+the+covenant.+2.+The+truth+is%2C+the+promise+of+a+new+heart+is+not+made+to+the+visible+Church%2C+which+is+only+visible%3A+but+to+the+Elect+%26+invisible+Church.+And+if+Anabaptists+shall+expone+these+words%2C+Acts+2.+39.+The+promise+of+a+new+heart+is+made+to+you+and+to+your+Children%2C+upon+condition+that+you+and+your+Children+believe%2C+which+they+cannot+do+until+first+they+have+a+new+heart%2C+its+as+good+as+Peter+had+said%2C+God+promiseth+to+you+and+to+your+Children+grace+to+believe%2C+and+a+new+heart+to+obey+him%2C+upon+condition+that+you+first+believe.+And+that+is%2C+Gods+promise+to+you+to+believe+upon+condition+that+ye+believe%2C+which+is+ridiculous%2C+and+therefore+we+cannot+say+that+this+promise+of+a+new+heart+is+made+to+all+that+are+commanded+to+believe+and+repent+and+be+baptized.+For+Elect+and+Reprobate%2C+and+all+are+under+these+commands%2C+if+they+be+members+of+the+visible+Church.+But+the+promise+of+a+new+heart+is+not+made+to+all+within+the+visible+Church.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Covenant+of+Life+Opened+or+A+Treatise+of+the+Covenant+of+Grace%2C+%28Edinburgh%2C+1655%29%2C+86%E2%80%9393.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F78fe44a197.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/78fe44a197.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/04/samuel-rutherford-on-acts-239-in-defense-of-infant-baptism/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Nor yet do [they, the apostles] make their being of a household simply the ground of their being baptized; for I confess there may be diverse in and of a houshold, that in some case, that is, of positive refusing to stoop to the Gospel, may not be baptized; as an unbelieving wife, servant, or child grown, they are by persuasion to be won in, or else let alone, this springing from the foresaid ground of not forcing ordinances upon men: But I make the grounds of their baptism: the tenor of the commission that bids them [ministers to] disciple all the gentiles, and of the gospel holding forth grace to all, one and other, no man being common or unclean in that respect in God’s account, but as they render themselves so by their willing rejections of the grace tendered to them, with their being under the tuition of those that profess faith, and subjection to the doctrine of Christ, and the non-resistance found in them, and the duty lying upon parents to bring them up in the nurture and admonition of the Lord. Whence it is to be noted, that it’s said of the jailor, he and all his, not all his ‘houshold’, but all ‘his’ were baptized; possibly some in the house might not be in his [to] dispose, but so many as were his were baptized. If any man say, its an act of force to disciple an infant; I say no, of no more force to baptize them to Christ, than to lay them in their cradles or carry them in their arms; they have no will nor reluctancy against it, ye may do with them what ye will: whence they are a pattern of right entring the Kingdom: ‘He that receives not the Kingdom of God as a little child,’ etc. They receive it as God and his people order them into it, and in it. And for their discipling by instruction, they usually, if well educated, drink it in, and submit to it better than others, as to the outward profession at least, as was before said. And I find not that baptism was ever denied to any that would submit themselves to learn the Christian profession… …who yet when they [infants] came to years of understanding, owning what was in infancy done to them, were never therefore reputed members of the Church or proselytes by compulsion.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-d22d3196dc" data-kw="">
<blockquote><p>When error is admitted into the Church, it will be found that the stages of its progress are always three. It begins by asking toleration. Its friends say to the majority: You need not be afraid of us; we are few, and weak; only let us alone; we shall not disturb the faith of the others. The Church has her standards of doctrine; of course we shall never interfere with them; we only ask for ourselves to be spared interference with our private opinions. Indulged in this for a time, error goes on to assert equal rights. Truth and error are two balancing forces. The Church shall do nothing which looks like deciding between them; that would be partiality. It is bigotry to assert any superior right for the truth. We are to agree to differ, and any favoring of the truth, because it is truth, is partisanship. What the friends of truth and error hold in common is fundamental. Anything on which they differ is ipso facto non-essential. Anybody who makes account of such a thing is a disturber of the peace of the church. Truth and error are two co-ordinate powers, and the great secret of church-statesmanship is to preserve the balance between them. From this point error soon goes on to its natural end, which is to assert supremacy. Truth started with tolerating; it comes to be merely tolerated, and then only for a time. Error claims a preference for its judgments on all disputed points. It puts men into positions, not as at first in spite of their departure from the Church’s faith, but in consequence of it. Their recommendation is that they repudiate the faith, and position is given them to teach others to repudiate it, and to make them skillful in combating it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-porterfield-krauth.html">Charles Porterfield Krauth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Conservative Reformation and Its Theology As Represented in the Augsburg Confession and In the History and Literature of the Evangelical Lutheran Church</cite>, (Philadelphia: J. B. Lippincott, 1871), 195–96..</span></figcaption>

</figure><figure class="quote" id="q-02de796914" data-kw="">
<blockquote><p>The apostle, 1 Tim. 6:3-5, saying, separate from such, has a two-fold sense: Either such as teach otherwise than the truth fundamentally, and then separate wholly: Or not fundamentally, but erring only in points less than the foundation. And these diversely also: Either presumptuously obstinately, and of a desparate conscience: and then if that apear, separate from such wholly: Or else, erring in simplicity and of oversight, and former preiudice, from such, separate not wholly, but only from the very error or errors, in no wise from their Christian communion and society, seeing these are true Christians. Seing therefore our corruptions of the prelacy and ceremonies be of these latter sort: which thing hitherto you haue not, nor cannot overthrow (and withal you must utterly overthrow Master [Thomas] Cranmer and the rest of the martyrs’ Christianity likewise): Therefore we in England, by the grace of God, are still true Christians: and you ought so to acknowledge us, as you will answer unto God: All which you may do, and yet touch no part of our ecclesiastical corruptions at all, to give allowance unto them: And in all this, there is no contradiction with myself, it is but your distempered conceit, that seems contrary. Neither is our absolute departure from the Papists hereby any whit impeached…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jacob.html">Henry Jacob</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defence of the Churches &amp; Ministry of England, written in Two Treatises, against the reasons and objections of Master Francis Johnson, and others of the Separation commonly called Brownists</cite>, (Middleburg, 1599), ‘Jacob’s 2nd Reply to the 9th Reason’, pp. 79-80</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>The Reformed orthodox generally also note… three kinds of doctrinal error: 1. errors against a fundamental article… 2. errors around a fundamental or in indirect contradiction to it… 3. errors beyond a fundamental article (praeter fundamentum)… The third category of error does not address fundamental articles directly or indirectly but rather involves faith in problematic and curious questions… that do not arise out of the revealed Word–hay and stubble!–and that, because of their curiosity and vanity, constitute diversions from and impediments to salvation. (Rijssen, Summa, I.xiii; cf. Turretin, Inst. theol., I.xiv.9)” – Muller, PRRD (2003) 1.422-23 Hottinger, Johann Heinrich – The 8th Theological Disputation of the Gymnasium: Of the Use &amp; Abuse of the Distinction of [Theological] Places into Fundamental &amp; Non-Fundamental (Zurich, 1664) Cocceius, Johannes – ch. 7. ‘Of that which is Fundamental’ in A Sum of Theology Rehearsed out of the Scriptures (Geneva, 1665), pp. 90-97 Velthuysen, Lambert – 3. ‘Of Principles from the First Rising, or Fundamental Articles &amp; Errors’ in Theology (Fribourg, 1666), pp. 8-11 Velthuysen (1623-1685) Burman, Francis – Ch. 3. ‘Of the Foundation &amp; Fundamental Articles’ in A Synopsis of Theology… (Utrecht, 1671), vol. 2, Locus 41, ‘Of Revelation &amp; the Word under the Economy of the New Covenant’, pp. 308-317 Burman (1628-79) Pauli, Reinhold – A Compendium of Theological Disputations… Ch. 1, On the Fundamental of the Faith (Marburg 1672) Pauli (1638-1682) was a German reformed professor of theology at Marburg. Heidegger, Johann Heinrich – A Dissertation on the Foundation of Salvation, whereby the Whole Subject of Fundamental &amp; Non-Fundamental Articles &amp; Errors is Struck (Zurich, 1676) Rissen, Leonard – Locus 1, ‘Of Theology’, Controversy 3, sections 12-13, pp. 13-14 in A Sum of Didactic &amp; Elenctic Theology, out of Our Theologians, especially out of Francis Turretin’s Institutes of Theology... (Bern, 1676; 1690) Here is an introduction to the life of Rissen (1636-1700). Amongst other things, Rissen notes that Socinians and Arminians err in fundamentals by defect, and Papists and Lutherans err in excess. “We maintain the middle.</p></blockquote>

ed Books Online</a></div>

<blockquote><p>The divisions among Protestant Churches are to be deplored so much the more because the points they differ in are inconsiderable and might easily be composed if men had but peaceable tempers and were resolved to lay aside interest and carnal respects, and punctilios of honor and credit, etc. for they all agree in fundamentals, all are satisfied that the Church of Rome has notoriously deviated from the simplicity of the Gospel; and the matters in difference, are things in which salvation is not concerned. And upon that account their labours deserve great commendations, who heretofore and very lately have endeavored to reconcile the Protestant Churches into a perfect union: A blessed work. Blessed are the peacemakers, that endeavor to make peace among the jarring members of Christ’s Body; and though they may fail of success, yet they shall not lose their reward. In the meanwhile those who widen or heighten these differences, and incite the respective parties to hatred, and wrath, and animosities one against another, to be sure are no children of the God of peace, and had need at least before they die make public satisfaction for the dreadful effects their heats and passions do produce.</p></blockquote>

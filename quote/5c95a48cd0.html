<main class="wrap"><figure class="quote" id="q-5c95a48cd0" data-kw="">
<blockquote><p>To be a God unto thee. In this single word we are plainly taught, that this was a spiritual covenant, not confirmed in reference to the present life only; but one from which Abraham might conceive the hope of eternal salvation, so that being raised even to heaven, he might lay hold of solid and perfect bliss. For those whom God adopts to himself, from among a people—seeing that he makes them partakers of his righteousness and of all good things—he also constitutes heirs of celestial life. Let us then mark this as the principal part of the covenant, that He who is the God of the living, not of the dead, promises to be a God to the children of Abraham. It follows afterwards, in the way of augmentation of the grant, that he promises to give them the land. I confess, indeed, that something greater and more excellent than itself was shadowed forth by the land of Canaan; yet this is not at variance with the statement, that the promise now made was an accession to that primary one, ‘I will be thy God.’ Now, although God again affirms, as before, that He will give the land to Abraham himself, we nevertheless know, that Abraham never possessed dominion over it; but the holy man was contented with his title to it alone, although the possession of it was not granted him; and, therefore, he calmly passed from his earthly pilgrimage into heaven. God again repeats that He will be a God to the posterity of Abraham, in order that they may not settle upon earth, but may regard themselves as trained for higher things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 1.450.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9250e3080a" data-kw="">
<blockquote><p>We are told, then, that because the kingdom of God is near we must be converted and believe the gospel. We have already explained, though rather briefly, what is meant by ‘the kingdom of God.’ It means that God has chosen to reveal Himself to men from whom He was formerly estranged, and who were more or less cut off from Him. We have all been banished from the heavenly life by Adam’s sin and fall. God therefore sends his only Son and, as it were, with outstretched arms asks us to turn back to Him, for He is willing to receive us. Although we have strayed and are lost because of our demerits, He still wills to show us mercy. Because the kingdom of God is near, our Lord Jesus Christ urges men to repentance and faith. Notice first of all that nothing should move or inflame us to yield to God more than his offer of infinite grace and goodness. When Paul, for example, seeks to pierce men’s stony hearts and to soften their hardness and obduracy, he appeals to ‘the bowels of God’s mercy’ (Phil. 2:1). In speaking thus, he is really saying: ‘Will you now continue in our madness? Must you be worse than the devils? And when God comes to you, displaying his mercy and opening his heart to welcome you as his own children—when he gives you his own Son, will you be so unfeeling as not to be softened or inflamed by love for his grace? Will you not allow Him to lead you, and will you not delight in the goodness He shows you?’ It is in just this way that Jesus Christ urges men to repentance and faith. But on what does he base his appeal? On the fact that God wishes to draw near to those from whom He was once estranged. God, therefore, in receiving us in mercy, sets his goodness before us without waiting for us to seek Him out; he forestalls us with such exceptional grace that we cannot grasp even a hundredth part of it. Since He is so kindly disposed toward us, we should be rightly and deeply touched, to the very core of thought and feeling.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Gospel of God</cite>, (Mt. 4:12, 17; Mk. 1:14–15; Lk. 3:19–20; 4:14–15)” in In the Power of the Spirit: Sermons on Matthew, Mark &amp; Luke, tr. Robert White (Banner of Truth, 2024), pp. 154–55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>appetitus: appetite, desire; specifically, the appetitive faculty or capacity of a being, which seeks out or inclines toward a good. In all spiritual beings, including God, the exercise of will implies appetite. By extension, the propensities of inanimate objects, and even of matter, can be described as appetite… Scholastic theology and philosophy focus in particular upon the appetites of finite spiritual beings, which by nature seek out their own good. Since the fall has caused a deprivation and distortion of desire, a distinction must be made between appetitus rectus, right desire, and appetitus perversus or inordinatus, perverse or inordinate desire. It is characteristic of the desire of sinful beings that it misidentifies the good, particularly ultimate good, and perversely, or inordinately, desires finite things as ends in themselves (see frui). Thus appetitus perversus and appetitus inordinatus (q.v.) are synonyms for sin (peccatum, q.v.). Appetite can be distinguished further into natural appetite (appetitus naturalis), rational or voluntary appetite (appetitus rationalis sive voluntarius), and animal or sensual or sensitive appetite (appetitus animalis sive sensualis; appetitus sensitivus). Natural appetite is simply the nature of any existent thing to be what it is and to perform its proper acts or operations; e.g., human beings have a natural appetite for breathing! The rational or voluntary appetite, also called appetitus intellectualis, intellectual appetite, is the will (voluntas, q.v.). Whereas it is the intellect (intellectus, q.v.) that perceives and knows objects, it is the will that chooses. Since choice belongs to the will, the will must be exercised in the choice of even purely intellectual objects—thus appetitus intellectualis. In addition, since the will and the intellect are not really distinct, but only formally or rationally distinct (see distinctio), the appetitive function of will is also rational (rationalis). Thus the will desires the goodness, truth, and justice known by the intellect… The appetitus animalis sive sensualis or appetitus sensitivus is thus emotion or passion (affectus, passio), and it may be described in terms of the six concupiscible (concupiscibilis, q.v.) passions: love and hate, joy and sadness, desire and aversion; and of the five irascible (irascibilis, q.v.) passions: courage and fear, hope, despair, and anger. This appetite, because of its relation to the body, is usually described as being situated “below” the will in the hierarchy of human faculties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st</cite>, ed. (Baker Academic, 2017), pp. 41-42</span></figcaption>

<blockquote><p>We must observe that there is a certain Gospel righteousness in God; and that is God’s truth in keeping promises of the Gospel, when the condition of the promises is performed.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-4a766fb798" data-kw="">
<blockquote><p>Can you imagine that the omniscient and righteous Judge of all the earth will take no notice of you or that He who is “of purer eyes than to behold evil, and canst not look on iniquity” (Hab. 1:13) but with infinite abhorrence will suffer you to sin against Him with impunity? Oh, how inexpressibly dreadful will your condition be if you remain asleep in your sinfulness and misery till everlasting fire, prepared for the devil and his angels, awakens you! Alarmed by the terrors of the fiery law, let your heart be won to the compassionate Savior by the mild accents of the blessed gospel. In the glorious gospel, Jesus, with His meritorious righteousness and His great salvation, is freely and wholly and particularly offered to you as a lost sinner of mankind; and the unlimited and authentic offer affords you a right to receive and trust in Him for complete salvation. Oh, do not any longer despise this unspeakable, this inestimably precious gift! Come to the Lord Jesus, and He will in no wise cast you out. Believe in the dear Redeemer, and you shall never perish but have eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 126.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a2a62bb899" data-kw="">
<blockquote><p>Mastricht offers as a brief definition the statement that the divine will is God’s ‘propensity toward the good,’ (Theoretico-practica theol., II.xvii.4) and the somewhat longer definition that ‘will in God is nothing other than his most wise propensity toward himself as the highest goal and toward creatures as means, for the sake of himself,’ inasmuch as creatures attain the fulfilment of the good not in themselves but in God.’ (Theoretico-practica theol., II.xv.7; cf. Cocceius, Summa theol. III.x.23-24 and Van Asselt, Federal Theology, p. 166.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, p. 445</span></figcaption>

</figure><figure class="quote" id="q-d06d978e9d" data-kw="">
<blockquote><p>It revived the promise of that covenant, —that of eternal life upon perfect obedience. So the apostle tells us that Moses thus describeth the righteousness of the law, “That the man which doeth those things shall live by them,” Romans 10:5; as he doth, Leviticus 18:5. Now this is no other but the covenant of works revived. Nor had this covenant of Sinai any promise of eternal life annexed unto it, as such, but only the promise inseparable from the covenant of works which it revived, saying, “Do this, and live.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 94</span></figcaption>

— John Owen, An Exposition of the Epistle to the Hebrews, 8:6; Works, vol. 22, p. 94">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt%20revived%20the%20promise%20of%20that%20covenant%2C%20%E2%80%94that%20of%20eternal%20life%20upon%20perfect%20obedience.%20So%20the%20apostle%20tells%20us%20that%20Moses%20thus%20describeth%20the%20righteousness%20of%20the%20law%2C%20%E2%80%9CThat%20the%20man%20which%20doeth%20those%20things%20shall%20live%20by%20them%2C%E2%80%9D%20Romans%2010%3A5%3B%20as%20he%20doth%2C%20Leviticus%2018%3A5.%20Now%20this%20is%20no%20other%20but%20the%20covenant%20of%20works%20revived.%20Nor%20had%20this%20covenant%20of%20Sinai%20any%20promise%20of%20eternal%20life%20annexed%20unto%20it%2C%20as%20such%2C%20but%20only%20the%20promise%20inseparable%20from%20the%20covenant%20of%20works%20which%20it%20revived%2C%20saying%2C%20%E2%80%9CDo%20this%2C%20and%20live.%E2%80%9D%E2%80%9D%0A%0A%E2%80%94%20John%20Owen%2C%20An%20Exposition%20of%20the%20Epistle%20to%20the%20Hebrews%2C%208%3A6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd06d978e9d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d06d978e9d.html">Permalink</a><a class="src" href="https://archive.org/details/worksofjohnowend0023owen" rel="noopener" target="_blank">Read it online · Internet Archive (Goold)</a></div>
</figure><figure class="quote" id="q-f6d7762388" data-kw="">
<blockquote><p>That God wills the good of men in bestowing any good gifts or graces upon them, needed no proof at all: We have always willingly granted this proposition. Yet for the true understanding thereof it must be observed that when we say, ‘This is God’s will; this is God’s aim or intent,’ these words have not always the same signification. This author [Samuel Hoard, an Arminian], by confounding the diverse meaning of these and the like words, does strangely entangle himself through his whole discourse. First therefore: Anything is said to be according to God’s will which, considered in itself, is according to the goodness and pureness of the Divine nature. This is a perpetual and necessary volition in God, qua Deo placet omne bonum [by which God is pleased by every good thing]. (See [Diego] Ruiz [d. 1632], Of the Will of God, disp. 6, §2, p. 38) And this simplex complacentia [simple complacency] towards all good actions of men, or events unto men, is possible circa creaturas omnes etiam nunquam futuras [about all creatures, even which will never be]. For there is no goodness imaginable which has not an agreement with the good will of God which we call amorem simplicis complacentiae [a love of simple complacency]. Satis constat hujusmodi complacentiam Dei versari circa poenitentiam, gratiam et gloriam possibilem Judae aut cujus libet damnati [It is sufficiently clear that this kind of complacency in God has reference to the possible repentance, grace, and glory of Judas, or of any damned person whatsoever]. (Ruiz, disp. 19, p. 214) But this is not it which we now speak of. 2. Secondly, God is said to will, desire or aim-at that good, for the obtaining whereof He affords fitting means, though withal He wills that it shall be in the liberty of the creature to hinder and frustrate those means, and though He have absolutely decreed to permit the creature to abuse them unto his own destruction. This is that which usually is termed by divines voluntas antecedens, voluntas conditionata, voluntas simplicis complacentiae [the will preceding, will-conditioned, will of simple complacency]. And thus God is said to aim-at or to will and desire the conversion, justification and salvation of those who never shall be converted, justified or saved. Neither must we think that by these men God’s omnipotent will is crossed, because his voluntas simplicis complacentiae [will of simple complacency] is not fulfilled. For the absolute will of God was that in such persons their own free-will might hinder the good effect of his gifts and graces, which He was absolutely resolved to permit for some greater good. Lastly, there is a will in God which strictly and most properly is called voluntas beneplaciti [will of good-pleasure] or his absolute will, which is not only a liking of the good willed unto the creature, and an ordering of fit means whereby the creature (if his own free-will hinder not) may attain it, but a merciful decree of so ordering the means and the very will of the creature, that it shall infallibly and infrustrately obtain the good end whereunto such means were accommodated. And of this will Ruiz truly affirms: Sola haec voluntas absoluta simpliciter amplectitur objectum, et ideo sola simpliciter et absolute meretur nomen voluntatis Beneplaciti [Only this absolute will simply embraces its object, and therefore only it, simply and absolutely, deserves the name of the will of good pleasure.]. (disp. 18, §4, p. 185) We grant, therefore, that in the second acception of the word ‘will,’ God truly wills, likes, desires the repentance, faith, perseverance and salvation of all to whom the Gospel is preached and Christ offered. But in the last and most proper acception, God wills the perseverance and salvation only of his elect, in whom He never ceases working till the happy effect be produced. Our divines at [the Synod of] Dort [1618-1619] granted a true and serious will in God according to the second acception of the word ‘will,’ but not according to the last. Which will simplicis complacentiae [of simple complacency] may stand with absolute reprobation. If this author can be content to acknowledge that for a true, serious and no delusory will, which affords the creature means of repenting, believing and being saved, though under an eternal absolute decree of permitting the final disobedience and perdition of the creature, we will free him from the trouble of answering the places of Scripture, and with him embrace the interpretation of Damascene, who tells us (Of the Orthodox Faith, bk. 4, ch. 20) that albeit the Scriptures do in such places seem to make God’s benefits causes of man’s sin and ruin, yet they must be understood [Greek], not [Greek]. A physician does give his patient physick with an absolute will to cure so far as his skill and ability will stretch: But God does not always give the means of salvation unto all men out of his absolute will, for then all should be cured and saved. Ps. 135, Omnia quaecunque voluit Deus, fecit in coelo et in terra [All which God wills is done in heaven and in earth]. Fulgentius gives the reason (1 ad Mon., ch. 12), Quia cui semper subest cum volet posse, non aliud est in illo velle quam posse [For to whom there is always present the ability whenever he wills, in him to will is nothing other than to be able.]. The will of God inviting or moving men to perform such good acts as tend to their salvation is God’s true and serious will, though He have not decreed by such means to produce their salvation. (See [Michael] Bajus, Institutes, bk. 1, ch. 104, etc. etc. 115, 116) This will is often despised by men to their own damnation. But there is a will not only ordaining means to the end, but of causing men to use the means unto the consecution of the end. And thus by giving them special grace, God wills the kingdom of glory only unto the elect. The former will is not to be baffled with the name of dissimulation, because this latter is only it which brings men unto glorification. And we further add that the reprobates in resisting the former will, which is vera voluntas simplicis complacentiae [the true will of simple complacency], do always fulfill the latter, which is God’s absolute will of permitting this resistance and of gathering out of it a greater illustration of his own glory. The blessings and means which God out of his goodness afforded to the angels, to Adam and which He continually affords unto wicked men, by the ill frame of their hearts may be and have been turned to their own hurt; and yet we cannot but acknowledge in them an antecedent and gracious will to do them good. But we do acknowledge, over and above this will of complacency, an absolute will of efficiency, by which God has mercifully decreed to work in some persons the will and the deed, and by the means of grace, de facto, to bring them unto glory. These two different manners of willing and working the salvation of men do demonstrate an absolute will in God of saving some, which we call the absolute decree of their election, and an absolute will of permitting others to draw upon themselves damnation by voluntary abusing the means of grace, which we call absolute reprobation. Chrysostom (who is no depressor of man’s free-will) was not ignorant of this absolute will of God turning and bending man’s which way He pleases: Si Deus voluerit, nullus impediet [If God wills, none impedes]. (See many times in homily 2 on Ps. 50) And of this will St. Augustine speaks (Enchiridion, ch. 97): In coelo et in terra non quaedam voluit et fecit, quaedam vero voluit et non fecit, sed omnia quaecun{que} voluit fecit. [In heaven and on earth, He did not will some things and accomplish them and will other things but not accomplish them; rather, He accomplished all things whatsoever He willed.] And St. Jerome, speaking of the Samaritans, says (apud Petr. Diac.): Si voluisset, ex indevotis devotos fecisset [If He had willed, He had made the impious pious]. And that prayer of Basil is famous (On the Incarnation, ch. 8): Malos, quaesumus, bonos facito; bonos in bonitate conserva. Omnia enim potes: quem enim volueris, salvas: et non est qui resistat tibi. [Make the wicked good, we beseech You; preserve the good in goodness. For You can do all things: whomsoever You will, You save; and there is none who may resist You.] Since therefore the Scriptures and the Fathers, and all orthodox divines, who confess that to be a true will which by affording ordinary means aims at the sanctification (1 Tim. 4:3) and salvation of all men (1 Tim. 2:4), do notwithstanding, intimate unto us an absolute will eternally predestinating and in time infallibly working the salvation only of some men; it is but a weak kind of reasoning from the affirmation of the one to conclude a negation of the other. The doctrine of absolute election and reprobation infers that God had not an absolute will by those means of grace which He bestowed upon the non-elect angels or men to bring them unto glory; and that He had an absolute will to permit themselves to abuse them to the procuring of their own eternal misery: And yet he that should say that God by giving the non-elect angels such excellent endowments, or by giving Cain and Judas such fatherly admonitions, did in those means aim at their destruction, speaks both ignorantly and profanely. For the aim of God and the end of any good gift which He vouchsafes unto men, is to be measured by the nature of the gift itself and not by the perverse use which God suffers the receivers to make of it. Calvin usually speaks in the Scripture-phrase, even in those points which seem harsh to the ears of the Remonstrants. But this author having before truly explained how such phrases are to be understood, namely of the end whereunto reprobates always finally abuse them, and not of the end whereunto God has ordained them, he had done much better to have afforded Calvin’s words this charitable construction. And as for Beza, he denies not a proper and true ordination of the divine grace unto the effecting of salvation in all to whom it is afforded, nor a true will of complacency in God, that by them it should be used to that good end: but he denies an absolute will in God of saving them by that grace; and he shows the end which the wicked always come to by abusing it, which is, ut gravius puniantur [that they are more severely punished]. That Calvin had no other meaning, appears by these words of his which shut-up the section out of which the former are taken: Quid sibi vult Dominus eos docendo a quibus ne intelligatur curat? Considera unde vitium, et desines interrogare. In verbo enim qualiscunque sit obscuritas, satis tamen semper est lucis ad convincendam impiorum conscientiam. [What does the Lord intend by teaching those whom He takes no care should understand? Consider from where the fault proceeds, and you will cease to inquire. For in the Word, whatever its obscurity may be, there is nevertheless always enough light to convict the consciences of the wicked.] The drift of Calvin is not to affirm that God works either by any positive action, or by proper ordination of his Word unto any such end that deafness, blindness, senselesseness whereunto the reprobate grow only by their own default. But because God, who could soften their hearts and would if they were in the number of his elect, has ordained not to do it, this ordination is intimated by the event which perpetually follows upon it, namely deafness, blindness, etc. So that all which Calvin intends is this (see §14-15, where is mind is explained), that where God has not comprised men within his merciful decree of predestination, there He has decreed to hold-off his hand from effectually opening their ears and eyes; and they suo vitio obsurdescunt [become deaf through their own fault], etc. And Beza had no other intent, but to show that the Word preached unto the reprobate (Opuscula, p. 30 and Of Predestination, p. 434): non eo usque conjunctum cum Spiritus ministerio, ut illos vera fide, qua propria nota electi a reprobis dignoscuntur, Christo ut palmites frugiferos inserat. [is not so joined with the ministry of the Spirit as to insert them into Christ by true faith, by which, as the distinctive mark, the elect are distinguished from the reprobate as fruitful branches.] Whence follows that woeful event, ut justo exitio devoti magis ac magìs reddantur [Greek] [that they may be rendered more and more devoted to just destruction]. For [Johannes] Maccovius, if his speeches [see pp. 372-73 in the previous section] tend to show the intentional end of the gospel preached, and not the eventual success, we utterly disclaim his opinion. For God properly intends no end of his volitions or actions but Himself, unto whose glory all things have naturam mediorum [the nature of means], not intenti finis [the intention of an end]. The intention therefore of means by God unto any lower or inferior end is nothing else but the fitness of such means considered in themselves (and not abused) for the producing of that end: And this intention is not altered by the decree of reprobation; for that decree as it is immanent and eternal in voluntate divina, nihil ponit in reprobato [in the divine will, puts nothing in the reprobate]: And when the temporal execution comes, it puts no malice into his will; it puts no necessitation unto wicked actions upon his will; it only puts in God an absolute will of not-giving effectual grace, and of not-working in him salutiferous actions, whereupon follows perditio tua exte [your destruction is out of yourself, Hos. 13:9].</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“That God wills the good of men in bestowing any good gifts or graces upon them, needed no proof at all: We have always willingly granted this proposition. Yet for the true understanding thereof it must be observed that when we say, ‘This is God’s will; this is God’s aim or intent,’ these words have not always the same signification. This author [Samuel Hoard, an Arminian], by confounding the diverse meaning of these and the like words, does strangely entangle himself through his whole discourse. First therefore: Anything is said to be according to God’s will which, considered in itself, is according to the goodness and pureness of the Divine nature. This is a perpetual and necessary volition in God, qua Deo placet omne bonum [by which God is pleased by every good thing]. (See [Diego] Ruiz [d. 1632], Of the Will of God, disp. 6, §2, p. 38) And this simplex complacentia [simple complacency] towards all good actions of men, or events unto men, is possible circa creaturas omnes etiam nunquam futuras [about all creatures, even which will never be]. For there is no goodness imaginable which has not an agreement with the good will of God which we call amorem simplicis complacentiae [a love of simple complacency]. Satis constat hujusmodi complacentiam Dei versari circa poenitentiam, gratiam et gloriam possibilem Judae aut cujus libet damnati [It is sufficiently clear that this kind of complacency in God has reference to the possible repentance, grace, and glory of Judas, or of any damned person whatsoever]. (Ruiz, disp. 19, p. 214) But this is not it which we now speak of. 2. Secondly, God is said to will, desire or aim-at that good, for the obtaining whereof He affords fitting means, though withal He wills that it shall be in the liberty of the creature to hinder and frustrate those means, and though He have absolutely decreed to permit the creature to abuse them unto his own destruction. This is that which usually is termed by divines voluntas antecedens, voluntas conditionata, voluntas simplicis complacentiae [the will preceding, will-conditioned, will of simple complacency]. And thus God is said to aim-at or to will and desire the conversion, justification and salvation of those who never shall be converted, justified or saved. Neither must we think that by these men God’s omnipotent will is crossed, because his voluntas simplicis complacentiae [will of simple complacency] is not fulfilled. For the absolute will of God was that in such persons their own free-will might hinder the good effect of his gifts and graces, which He was absolutely resolved to permit for some greater good. Lastly, there is a will in God which strictly and most properly is called voluntas beneplaciti [will of good-pleasure] or his absolute will, which is not only a liking of the good willed unto the creature, and an ordering of fit means whereby the creature (if his own free-will hinder not) may attain it, but a merciful decree of so ordering the means and the very will of the creature, that it shall infallibly and infrustrately obtain the good end whereunto such means were accommodated. And of this will Ruiz truly affirms: Sola haec voluntas absoluta simpliciter amplectitur objectum, et ideo sola simpliciter et absolute meretur nomen voluntatis Beneplaciti [Only this absolute will simply embraces its object, and therefore only it, simply and absolutely, deserves the name of the will of good pleasure.]. (disp. 18, §4, p. 185) We grant, therefore, that in the second acception of the word ‘will,’ God truly wills, likes, desires the repentance, faith, perseverance and salvation of all to whom the Gospel is preached and Christ offered. But in the last and most proper acception, God wills the perseverance and salvation only of his elect, in whom He never ceases working till the happy effect be produced. Our divines at [the Synod of] Dort [1618-1619] granted a true and serious will in God according to the second acception of the word ‘will,’ but not according to the last. Which will simplicis complacentiae [of simple complacency] may stand with absolute reprobation. If this author can be content to acknowledge that for a true, serious and no delusory will, which affords the creature means of repenting, believing and being saved, though under an eternal absolute decree of permitting the final disobedience and perdition of the creature, we will free him from the trouble of answering the places of Scripture, and with him embrace the interpretation of Damascene, who tells us (Of the Orthodox Faith, bk. 4, ch. 20) that albeit the Scriptures do in such places seem to make God’s benefits causes of man’s sin and ruin, yet they must be understood [Greek], not [Greek]. A physician does give his patient physick with an absolute will to cure so far as his skill and ability will stretch: But God does not always give the means of salvation unto all men out of his absolute will, for then all should be cured and saved. Ps. 135, Omnia quaecunque voluit Deus, fecit in coelo et in terra [All which God wills is done in heaven and in earth]. Fulgentius gives the reason (1 ad Mon., ch. 12), Quia cui semper subest cum volet posse, non aliud est in illo velle quam posse [For to whom there is always present the ability whenever he wills, in him to will is nothing other than to be able.]. The will of God inviting or moving men to perform such good acts as tend to their salvation is God’s true and serious will, though He have not decreed by such means to produce their salvation. (See [Michael] Bajus, Institutes, bk. 1, ch. 104, etc. etc. 115, 116) This will is often despised by men to their own damnation. But there is a will not only ordaining means to the end, but of causing men to use the means unto the consecution of the end. And thus by giving them special grace, God wills the kingdom of glory only unto the elect. The former will is not to be baffled with the name of dissimulation, because this latter is only it which brings men unto glorification. And we further add that the reprobates in resisting the former will, which is vera voluntas simplicis complacentiae [the true will of simple complacency], do always fulfill the latter, which is God’s absolute will of permitting this resistance and of gathering out of it a greater illustration of his own glory. The blessings and means which God out of his goodness afforded to the angels, to Adam and which He continually affords unto wicked men, by the ill frame of their hearts may be and have been turned to their own hurt; and yet we cannot but acknowledge in them an antecedent and gracious will to do them good. But we do acknowledge, over and above this will of complacency, an absolute will of efficiency, by which God has mercifully decreed to work in some persons the will and the deed, and by the means of grace, de facto, to bring them unto glory. These two different manners of willing and working the salvation of men do demonstrate an absolute will in God of saving some, which we call the absolute decree of their election, and an absolute will of permitting others to draw upon themselves damnation by voluntary abusing the means of grace, which we call absolute reprobation. Chrysostom (who is no depressor of man’s free-will) was not ignorant of this absolute will of God turning and bending man’s which way He pleases: Si Deus voluerit, nullus impediet [If God wills, none impedes]. (See many times in homily 2 on Ps. 50) And of this will St. Augustine speaks (Enchiridion, ch. 97): In coelo et in terra non quaedam voluit et fecit, quaedam vero voluit et non fecit, sed omnia quaecun{que} voluit fecit. [In heaven and on earth, He did not will some things and accomplish them and will other things but not accomplish them; rather, He accomplished all things whatsoever He willed.] And St. Jerome, speaking of the Samaritans, says (apud Petr. Diac.): Si voluisset, ex indevotis devotos fecisset [If He had willed, He had made the impious pious]. And that prayer of Basil is famous (On the Incarnation, ch. 8): Malos, quaesumus, bonos facito; bonos in bonitate conserva. Omnia enim potes: quem enim volueris, salvas: et non est qui resistat tibi. [Make the wicked good, we beseech You; preserve the good in goodness. For You can do all things: whomsoever You will, You save; and there is none who may resist You.] Since therefore the Scriptures and the Fathers, and all orthodox divines, who confess that to be a true will which by affording ordinary means aims at the sanctification (1 Tim. 4:3) and salvation of all men (1 Tim. 2:4), do notwithstanding, intimate unto us an absolute will eternally predestinating and in time infallibly working the salvation only of some men; it is but a weak kind of reasoning from the affirmation of the one to conclude a negation of the other. The doctrine of absolute election and reprobation infers that God had not an absolute will by those means of grace which He bestowed upon the non-elect angels or men to bring them unto glory; and that He had an absolute will to permit themselves to abuse them to the procuring of their own eternal misery: And yet he that should say that God by giving the non-elect angels such excellent endowments, or by giving Cain and Judas such fatherly admonitions, did in those means aim at their destruction, speaks both ignorantly and profanely. For the aim of God and the end of any good gift which He vouchsafes unto men, is to be measured by the nature of the gift itself and not by the perverse use which God suffers the receivers to make of it. Calvin usually speaks in the Scripture-phrase, even in those points which seem harsh to the ears of the Remonstrants. But this author having before truly explained how such phrases are to be understood, namely of the end whereunto reprobates always finally abuse them, and not of the end whereunto God has ordained them, he had done much better to have afforded Calvin’s words this charitable construction. And as for Beza, he denies not a proper and true ordination of the divine grace unto the effecting of salvation in all to whom it is afforded, nor a true will of complacency in God, that by them it should be used to that good end: but he denies an absolute will in God of saving them by that grace; and he shows the end which the wicked always come to by abusing it, which is, ut gravius puniantur [that they are more severely punished]. That Calvin had no other meaning, appears by these words of his which shut-up the section out of which the former are taken: Quid sibi vult Dominus eos docendo a quibus ne intelligatur curat? Considera unde vitium, et desines interrogare. In verbo enim qualiscunque sit obscuritas, satis tamen semper est lucis ad convincendam impiorum conscientiam. [What does the Lord intend by teaching those whom He takes no care should understand? Consider from where the fault proceeds, and you will cease to inquire. For in the Word, whatever its obscurity may be, there is nevertheless always enough light to convict the consciences of the wicked.] The drift of Calvin is not to affirm that God works either by any positive action, or by proper ordination of his Word unto any such end that deafness, blindness, senselesseness whereunto the reprobate grow only by their own default. But because God, who could soften their hearts and would if they were in the number of his elect, has ordained not to do it, this ordination is intimated by the event which perpetually follows upon it, namely deafness, blindness, etc. So that all which Calvin intends is this (see §14-15, where is mind is explained), that where God has not comprised men within his merciful decree of predestination, there He has decreed to hold-off his hand from effectually opening their ears and eyes; and they suo vitio obsurdescunt [become deaf through their own fault], etc. And Beza had no other intent, but to show that the Word preached unto the reprobate (Opuscula, p. 30 and Of Predestination, p. 434): non eo usque conjunctum cum Spiritus ministerio, ut illos vera fide, qua propria nota electi a reprobis dignoscuntur, Christo ut palmites frugiferos inserat. [is not so joined with the ministry of the Spirit as to insert them into Christ by true faith, by which, as the distinctive mark, the elect are distinguished from the reprobate as fruitful branches.] Whence follows that woeful event, ut justo exitio devoti magis ac magìs reddantur [Greek] [that they may be rendered more and more devoted to just destruction]. For [Johannes] Maccovius, if his speeches [see pp. 372-73 in the previous section] tend to show the intentional end of the gospel preached, and not the eventual success, we utterly disclaim his opinion. For God properly intends no end of his volitions or actions but Himself, unto whose glory all things have naturam mediorum [the nature of means], not intenti finis [the intention of an end]. The intention therefore of means by God unto any lower or inferior end is nothing else but the fitness of such means considered in themselves (and not abused) for the producing of that end: And this intention is not altered by the decree of reprobation; for that decree as it is immanent and eternal in voluntate divina, nihil ponit in reprobato [in the divine will, puts nothing in the reprobate]: And when the temporal execution comes, it puts no malice into his will; it puts no necessitation unto wicked actions upon his will; it only puts in God an absolute will of not-giving effectual grace, and of not-working in him salutiferous actions, whereupon follows perditio tua exte [your destruction is out of yourself, Hos. 13:9].”

— John Davenant, Animadversions upon a Treatise entitled, God’s Love to Mankind... (Cambridge: Daniel, 1641), ‘Answer: Whether the decree of absolute Reprobation is contrary unto the use and end of God’s gifts bestowed upon men,’, pp. 390-93">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+God+wills+the+good+of+men+in+bestowing+any+good+gifts+or+graces+upon+them%2C+needed+no+proof+at+all%3A+We+have+always+willingly+granted+this+proposition.+Yet+for+the+true+understanding+thereof+it+must+be+observed+that+when+we+say%2C+%E2%80%98This+is+God%E2%80%99s+will%3B+this+is+God%E2%80%99s+aim+or+intent%2C%E2%80%99+these+words+have+not+always+the+same+signification.+This+author+%5BSamuel+Hoard%2C+an+Arminian%5D%2C+by+confounding+the+diverse+meaning+of+these+and+the+like+words%2C+does+strangely+entangle+himself+through+his+whole+discourse.+First+therefore%3A+Anything+is+said+to+be+according+to+God%E2%80%99s+will+which%2C+considered+in+itself%2C+is+according+to+the+goodness+and+pureness+of+the+Divine+nature.+This+is+a+perpetual+and+necessary+volition+in+God%2C+qua+Deo+placet+omne+bonum+%5Bby+which+God+is+pleased+by+every+good+thing%5D.+%28See+%5BDiego%5D+Ruiz+%5Bd.+1632%5D%2C+Of+the+Will+of+God%2C+disp.+6%2C+%C2%A72%2C+p.+38%29+And+this+simplex+complacentia+%5Bsimple+complacency%5D+towards+all+good+actions+of+men%2C+or+events+unto+men%2C+is+possible+circa+creaturas+omnes+etiam+nunquam+futuras+%5Babout+all+creatures%2C+even+which+will+never+be%5D.+For+there+is+no+goodness+imaginable+which+has+not+an+agreement+with+the+good+will+of+God+which+we+call+amorem+simplicis+complacentiae+%5Ba+love+of+simple+complacency%5D.+Satis+constat+hujusmodi+complacentiam+Dei+versari+circa+poenitentiam%2C+gratiam+et+gloriam+possibilem+Judae+aut+cujus+libet+damnati+%5BIt+is+sufficiently+clear+that+this+kind+of+complacency+in+God+has+reference+to+the+possible+repentance%2C+grace%2C+and+glory+of+Judas%2C+or+of+any+damned+person+whatsoever%5D.+%28Ruiz%2C+disp.+19%2C+p.+214%29+But+this+is+not+it+which+we+now+speak+of.+2.+Secondly%2C+God+is+said+to+will%2C+desire+or+aim-at+that+good%2C+for+the+obtaining+whereof+He+affords+fitting+means%2C+though+withal+He+wills+that+it+shall+be+in+the+liberty+of+the+creature+to+hinder+and+frustrate+those+means%2C+and+though+He+have+absolutely+decreed+to+permit+the+creature+to+abuse+them+unto+his+own+destruction.+This+is+that+which+usually+is+termed+by+divines+voluntas+antecedens%2C+voluntas+conditionata%2C+voluntas+simplicis+complacentiae+%5Bthe+will+preceding%2C+will-conditioned%2C+will+of+simple+complacency%5D.+And+thus+God+is+said+to+aim-at+or+to+will+and+desire+the+conversion%2C+justification+and+salvation+of+those+who+never+shall+be+converted%2C+justified+or+saved.+Neither+must+we+think+that+by+these+men+God%E2%80%99s+omnipotent+will+is+crossed%2C+because+his+voluntas+simplicis+complacentiae+%5Bwill+of+simple+complacency%5D+is+not+fulfilled.+For+the+absolute+will+of+God+was+that+in+such+persons+their+own+free-will+might+hinder+the+good+effect+of+his+gifts+and+graces%2C+which+He+was+absolutely+resolved+to+permit+for+some+greater+good.+Lastly%2C+there+is+a+will+in+God+which+strictly+and+most+properly+is+called+voluntas+beneplaciti+%5Bwill+of+good-pleasure%5D+or+his+absolute+will%2C+which+is+not+only+a+liking+of+the+good+willed+unto+the+creature%2C+and+an+ordering+of+fit+means+whereby+the+creature+%28if+his+own+free-will+hinder+not%29+may+attain+it%2C+but+a+merciful+decree+of+so+ordering+the+means+and+the+very+will+of+the+creature%2C+that+it+shall+infallibly+and+infrustrately+obtain+the+good+end+whereunto+such+means+were+accommodated.+And+of+this+will+Ruiz+truly+affirms%3A+Sola+haec+voluntas+absoluta+simpliciter+amplectitur+objectum%2C+et+ideo+sola+simpliciter+et+absolute+meretur+nomen+voluntatis+Beneplaciti+%5BOnly+this+absolute+will+simply+embraces+its+object%2C+and+therefore+only+it%2C+simply+and+absolutely%2C+deserves+the+name+of+the+will+of+good+pleasure.%5D.+%28disp.+18%2C+%C2%A74%2C+p.+185%29+We+grant%2C+therefore%2C+that+in+the+second+acception+of+the+word+%E2%80%98will%2C%E2%80%99+God+truly+wills%2C+likes%2C+desires+the+repentance%2C+faith%2C+perseverance+and+salvation+of+all+to+whom+the+Gospel+is+preached+and+Christ+offered.+But+in+the+last+and+most+proper+acception%2C+God+wills+the+perseverance+and+salvation+only+of+his+elect%2C+in+whom+He+never+ceases+working+till+the+happy+effect+be+produced.+Our+divines+at+%5Bthe+Synod+of%5D+Dort+%5B1618-1619%5D+granted+a+true+and+serious+will+in+God+according+to+the+second+acception+of+the+word+%E2%80%98will%2C%E2%80%99+but+not+according+to+the+last.+Which+will+simplicis+complacentiae+%5Bof+simple+complacency%5D+may+stand+with+absolute+reprobation.+If+this+author+can+be+content+to+acknowledge+that+for+a+true%2C+serious+and+no+delusory+will%2C+which+affords+the+creature+means+of+repenting%2C+believing+and+being+saved%2C+though+under+an+eternal+absolute+decree+of+permitting+the+final+disobedience+and+perdition+of+the+creature%2C+we+will+free+him+from+the+trouble+of+answering+the+places+of+Scripture%2C+and+with+him+embrace+the+interpretation+of+Damascene%2C+who+tells+us+%28Of+the+Orthodox+Faith%2C+bk.+4%2C+ch.+20%29+that+albeit+the+Scriptures+do+in+such+places+seem+to+make+God%E2%80%99s+benefits+causes+of+man%E2%80%99s+sin+and+ruin%2C+yet+they+must+be+understood+%5BGreek%5D%2C+not+%5BGreek%5D.+A+physician+does+give+his+patient+physick+with+an+absolute+will+to+cure+so+far+as+his+skill+and+ability+will+stretch%3A+But+God+does+not+always+give+the+means+of+salvation+unto+all+men+out+of+his+absolute+will%2C+for+then+all+should+be+cured+and+saved.+Ps.+135%2C+Omnia+quaecunque+voluit+Deus%2C+fecit+in+coelo+et+in+terra+%5BAll+which+God+wills+is+done+in+heaven+and+in+earth%5D.+Fulgentius+gives+the+reason+%281+ad+Mon.%2C+ch.+12%29%2C+Quia+cui+semper+subest+cum+volet+posse%2C+non+aliud+est+in+illo+velle+quam+posse+%5BFor+to+whom+there+is+always+present+the+ability+whenever+he+wills%2C+in+him+to+will+is+nothing+other+than+to+be+able.%5D.+The+will+of+God+inviting+or+moving+men+to+perform+such+good+acts+as+tend+to+their+salvation+is+God%E2%80%99s+true+and+serious+will%2C+though+He+have+not+decreed+by+such+means+to+produce+their+salvation.+%28See+%5BMichael%5D+Bajus%2C+Institutes%2C+bk.+1%2C+ch.+104%2C+etc.+etc.+115%2C+116%29+This+will+is+often+despised+by+men+to+their+own+damnation.+But+there+is+a+will+not+only+ordaining+means+to+the+end%2C+but+of+causing+men+to+use+the+means+unto+the+consecution+of+the+end.+And+thus+by+giving+them+special+grace%2C+God+wills+the+kingdom+of+glory+only+unto+the+elect.+The+former+will+is+not+to+be+baffled+with+the+name+of+dissimulation%2C+because+this+latter+is+only+it+which+brings+men+unto+glorification.+And+we+further+add+that+the+reprobates+in+resisting+the+former+will%2C+which+is+vera+voluntas+simplicis+complacentiae+%5Bthe+true+will+of+simple+complacency%5D%2C+do+always+fulfill+the+latter%2C+which+is+God%E2%80%99s+absolute+will+of+permitting+this+resistance+and+of+gathering+out+of+it+a+greater+illustration+of+his+own+glory.+The+blessings+and+means+which+God+out+of+his+goodness+afforded+to+the+angels%2C+to+Adam+and+which+He+continually+affords+unto+wicked+men%2C+by+the+ill+frame+of+their+hearts+may+be+and+have+been+turned+to+their+own+hurt%3B+and+yet+we+cannot+but+acknowledge+in+them+an+antecedent+and+gracious+will+to+do+them+good.+But+we+do+acknowledge%2C+over+and+above+this+will+of+complacency%2C+an+absolute+will+of+efficiency%2C+by+which+God+has+mercifully+decreed+to+work+in+some+persons+the+will+and+the+deed%2C+and+by+the+means+of+grace%2C+de+facto%2C+to+bring+them+unto+glory.+These+two+different+manners+of+willing+and+working+the+salvation+of+men+do+demonstrate+an+absolute+will+in+God+of+saving+some%2C+which+we+call+the+absolute+decree+of+their+election%2C+and+an+absolute+will+of+permitting+others+to+draw+upon+themselves+damnation+by+voluntary+abusing+the+means+of+grace%2C+which+we+call+absolute+reprobation.+Chrysostom+%28who+is+no+depressor+of+man%E2%80%99s+free-will%29+was+not+ignorant+of+this+absolute+will+of+God+turning+and+bending+man%E2%80%99s+which+way+He+pleases%3A+Si+Deus+voluerit%2C+nullus+impediet+%5BIf+God+wills%2C+none+impedes%5D.+%28See+many+times+in+homily+2+on+Ps.+50%29+And+of+this+will+St.+Augustine+speaks+%28Enchiridion%2C+ch.+97%29%3A+In+coelo+et+in+terra+non+quaedam+voluit+et+fecit%2C+quaedam+vero+voluit+et+non+fecit%2C+sed+omnia+quaecun%7Bque%7D+voluit+fecit.+%5BIn+heaven+and+on+earth%2C+He+did+not+will+some+things+and+accomplish+them+and+will+other+things+but+not+accomplish+them%3B+rather%2C+He+accomplished+all+things+whatsoever+He+willed.%5D+And+St.+Jerome%2C+speaking+of+the+Samaritans%2C+says+%28apud+Petr.+Diac.%29%3A+Si+voluisset%2C+ex+indevotis+devotos+fecisset+%5BIf+He+had+willed%2C+He+had+made+the+impious+pious%5D.+And+that+prayer+of+Basil+is+famous+%28On+the+Incarnation%2C+ch.+8%29%3A+Malos%2C+quaesumus%2C+bonos+facito%3B+bonos+in+bonitate+conserva.+Omnia+enim+potes%3A+quem+enim+volueris%2C+salvas%3A+et+non+est+qui+resistat+tibi.+%5BMake+the+wicked+good%2C+we+beseech+You%3B+preserve+the+good+in+goodness.+For+You+can+do+all+things%3A+whomsoever+You+will%2C+You+save%3B+and+there+is+none+who+may+resist+You.%5D+Since+therefore+the+Scriptures+and+the+Fathers%2C+and+all+orthodox+divines%2C+who+confess+that+to+be+a+true+will+which+by+affording+ordinary+means+aims+at+the+sanctification+%281+Tim.+4%3A3%29+and+salvation+of+all+men+%281+Tim.+2%3A4%29%2C+do+notwithstanding%2C+intimate+unto+us+an+absolute+will+eternally+predestinating+and+in+time+infallibly+working+the+salvation+only+of+some+men%3B+it+is+but+a+weak+kind+of+reasoning+from+the+affirmation+of+the+one+to+conclude+a+negation+of+the+other.+The+doctrine+of+absolute+election+and+reprobation+infers+that+God+had+not+an+absolute+will+by+those+means+of+grace+which+He+bestowed+upon+the+non-elect+angels+or+men+to+bring+them+unto+glory%3B+and+that+He+had+an+absolute+will+to+permit+themselves+to+abuse+them+to+the+procuring+of+their+own+eternal+misery%3A+And+yet+he+that+should+say+that+God+by+giving+the+non-elect+angels+such+excellent+endowments%2C+or+by+giving+Cain+and+Judas+such+fatherly+admonitions%2C+did+in+those+means+aim+at+their+destruction%2C+speaks+both+ignorantly+and+profanely.+For+the+aim+of+God+and+the+end+of+any+good+gift+which+He+vouchsafes+unto+men%2C+is+to+be+measured+by+the+nature+of+the+gift+itself+and+not+by+the+perverse+use+which+God+suffers+the+receivers+to+make+of+it.+Calvin+usually+speaks+in+the+Scripture-phrase%2C+even+in+those+points+which+seem+harsh+to+the+ears+of+the+Remonstrants.+But+this+author+having+before+truly+explained+how+such+phrases+are+to+be+understood%2C+namely+of+the+end+whereunto+reprobates+always+finally+abuse+them%2C+and+not+of+the+end+whereunto+God+has+ordained+them%2C+he+had+done+much+better+to+have+afforded+Calvin%E2%80%99s+words+this+charitable+construction.+And+as+for+Beza%2C+he+denies+not+a+proper+and+true+ordination+of+the+divine+grace+unto+the+effecting+of+salvation+in+all+to+whom+it+is+afforded%2C+nor+a+true+will+of+complacency+in+God%2C+that+by+them+it+should+be+used+to+that+good+end%3A+but+he+denies+an+absolute+will+in+God+of+saving+them+by+that+grace%3B+and+he+shows+the+end+which+the+wicked+always+come+to+by+abusing+it%2C+which+is%2C+ut+gravius+puniantur+%5Bthat+they+are+more+severely+punished%5D.+That+Calvin+had+no+other+meaning%2C+appears+by+these+words+of+his+which+shut-up+the+section+out+of+which+the+former+are+taken%3A+Quid+sibi+vult+Dominus+eos+docendo+a+quibus+ne+intelligatur+curat%3F+Considera+unde+vitium%2C+et+desines+interrogare.+In+verbo+enim+qualiscunque+sit+obscuritas%2C+satis+tamen+semper+est+lucis+ad+convincendam+impiorum+conscientiam.+%5BWhat+does+the+Lord+intend+by+teaching+those+whom+He+takes+no+care+should+understand%3F+Consider+from+where+the+fault+proceeds%2C+and+you+will+cease+to+inquire.+For+in+the+Word%2C+whatever+its+obscurity+may+be%2C+there+is+nevertheless+always+enough+light+to+convict+the+consciences+of+the+wicked.%5D+The+drift+of+Calvin+is+not+to+affirm+that+God+works+either+by+any+positive+action%2C+or+by+proper+ordination+of+his+Word+unto+any+such+end+that+deafness%2C+blindness%2C+senselesseness+whereunto+the+reprobate+grow+only+by+their+own+default.+But+because+God%2C+who+could+soften+their+hearts+and+would+if+they+were+in+the+number+of+his+elect%2C+has+ordained+not+to+do+it%2C+this+ordination+is+intimated+by+the+event+which+perpetually+follows+upon+it%2C+namely+deafness%2C+blindness%2C+etc.+So+that+all+which+Calvin+intends+is+this+%28see+%C2%A714-15%2C+where+is+mind+is+explained%29%2C+that+where+God+has+not+comprised+men+within+his+merciful+decree+of+predestination%2C+there+He+has+decreed+to+hold-off+his+hand+from+effectually+opening+their+ears+and+eyes%3B+and+they+suo+vitio+obsurdescunt+%5Bbecome+deaf+through+their+own+fault%5D%2C+etc.+And+Beza+had+no+other+intent%2C+but+to+show+that+the+Word+preached+unto+the+reprobate+%28Opuscula%2C+p.+30+and+Of+Predestination%2C+p.+434%29%3A+non+eo+usque+conjunctum+cum+Spiritus+ministerio%2C+ut+illos+vera+fide%2C+qua+propria+nota+electi+a+reprobis+dignoscuntur%2C+Christo+ut+palmites+frugiferos+inserat.+%5Bis+not+so+joined+with+the+ministry+of+the+Spirit+as+to+insert+them+into+Christ+by+true+faith%2C+by+which%2C+as+the+distinctive+mark%2C+the+elect+are+distinguished+from+the+reprobate+as+fruitful+branches.%5D+Whence+follows+that+woeful+event%2C+ut+justo+exitio+devoti+magis+ac+mag%C3%ACs+reddantur+%5BGreek%5D+%5Bthat+they+may+be+rendered+more+and+more+devoted+to+just+destruction%5D.+For+%5BJohannes%5D+Maccovius%2C+if+his+speeches+%5Bsee+pp.+372-73+in+the+previous+section%5D+tend+to+show+the+intentional+end+of+the+gospel+preached%2C+and+not+the+eventual+success%2C+we+utterly+disclaim+his+opinion.+For+God+properly+intends+no+end+of+his+volitions+or+actions+but+Himself%2C+unto+whose+glory+all+things+have+naturam+mediorum+%5Bthe+nature+of+means%5D%2C+not+intenti+finis+%5Bthe+intention+of+an+end%5D.+The+intention+therefore+of+means+by+God+unto+any+lower+or+inferior+end+is+nothing+else+but+the+fitness+of+such+means+considered+in+themselves+%28and+not+abused%29+for+the+producing+of+that+end%3A+And+this+intention+is+not+altered+by+the+decree+of+reprobation%3B+for+that+decree+as+it+is+immanent+and+eternal+in+voluntate+divina%2C+nihil+ponit+in+reprobato+%5Bin+the+divine+will%2C+puts+nothing+in+the+reprobate%5D%3A+And+when+the+temporal+execution+comes%2C+it+puts+no+malice+into+his+will%3B+it+puts+no+necessitation+unto+wicked+actions+upon+his+will%3B+it+only+puts+in+God+an+absolute+will+of+not-giving+effectual+grace%2C+and+of+not-working+in+him+salutiferous+actions%2C+whereupon+follows+perditio+tua+exte+%5Byour+destruction+is+out+of+yourself%2C+Hos.+13%3A9%5D.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+Animadversions+upon+a+Treatise+entitled%2C+God%E2%80%99s+Love+to+Mankind...+%28Cambridge%3A+Daniel%2C+1641%29%2C+%E2%80%98Answer%3A+Whether+the+decree+of+absolute+Reprobation+is+contrary+unto+the+use+and+end+of+God%E2%80%99s+gifts+bestowed+upon+men%2C%E2%80%99%2C+pp.+390-93&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff6d7762388.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f6d7762388.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=That%20God%20wills%20the%20good%20of,is%20out%20of%20yourself%2C%20Hos.%2013%3A9&amp;text=That%20God%20wills%20the%20good%20of%20men%20in&amp;text=your%20destruction%20is%20out%20of%20yourself%2C%20Hos.%2013%3A9" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>I. It is a matter of the greatest moment, that we learn distinctly to consider the covenant of grace, either as it is in its substance or essence, as they call it, or as it is in diverse ways proposed by God, with respect to circumstantials, under different economies. If we view the substance of the covenant, it is but only one, nor is it possible it should be otherwise. There is no other way worthy of God, in which salvation can be bestowed on sinners, but that discovered in the Gospel. Whence the apostle, Gal. 1:7, has beautifully said, “which is not another.” And that testament which was consecrated by the blood of Christ, he calls “everlasting,” Heb. 13:20, because it was settled from eternity, published immediately upon the fall of the first man, constantly handed down by the ancients, more fully explained by Christ himself and his apostles, and is to continue throughout all ages, and, in virtue of which, believers shall inherit eternal happiness. But if we attend to the circumstances of the covenant, it was dispensed “at sundry times and in divers manners,” under various economies for the manifestation of the manifold wisdom of God. In considering this, we are first to discourse on those general things which appertain to the substance of the covenant, and have continued in every age; and then explain the different economies or dispensations, and the new accessions made to each; which we will, first, do in a general and concise manner, in this and the following chapter; then gradually descend to the more special considerations. II. We therefore maintain, agreeable to the sacred writings, that to all the Elect, living in any period of time: 1st, One and the same eternal life was promised. 2dly, That Jesus Christ was held forth as the one and the same author and bestower of salvation. 3dly, That they could not become partakers of it any other way, but by a true and lively faith in him. If we demonstrate these three things, none can any longer doubt, but that the covenant of grace must be, as to its substance, only one from the beginning. For, if the salvation be the same, and the author of it the same, the manner of communion with him the same, it is certain, the covenant itself cannot be more than one. II. The Scriptures so plainly declare, that eternal life was promised to the Elect from the beginning, that if is astonishing any Christians could venture to deny it; who, indeed, are much blinder than the Jews themselves; of whom our Lord testifies, John 5:39. “Ye do search the Scriptures, for in them ye think ye have eternal life:” and that they were neither rash nor erroneous in thinking that the promises of eternal life, and the manner of enjoying them, were contained in the Scriptures they had, we prove by the most cogent arguments. 1st, Because, not only the Lord Jesus does not charge them, in this respect, with the least error, but makes use of that as a reason to recommend to them the search of the Scriptures. But it is very inconsistent with the great sincerity of the Lord Jesus, and the divine dignity of the Scriptures, to recommend them by arguments not genuine, or to recommend their value and usefulness from Jewish forgeries. Nay, had the Jews falsely persuaded themselves, that the promises of eternal life were contained in the Old Testament records, our Lord ought not, by any concession, to have cherished that mistake, which would have hindered them from acknowledging the excellence of his doctrine, and consequently the divinity of his person; but rather to have exclaimed against them: “In vain do you search the Scriptures, in hopes of finding eternal life in them; attend rather to me and my doctrine, who am the first who came into the world as a preacher of eternal life.” But every one may see how inconsistent this was from the design of the Lord Jesus. 2ndly, To this we add, that Paul’s hope was founded on the Law and the Prophets, as well as the expectation of the Jews, Acts 24:14, 15, “Believing all things, which are written in the Law and the Prophets; and have hope towards God, which they themselves also allow, that there shall be a resurrection of the dead, both of the just and unjust.” He testifies, that the Jews expected a resurrection of the dead; he professes the same belief and hope with them; and that he did not do so out of a vain presumption, but from a faith resting on the Law and the Prophets, which they also, in their manner, carefully read, and from which they had derived the same expectation with him. 3dly, The Jews were so far from judging amiss in this respect, that, on the contrary, the Lord Jesus reproved the Sadducees, as ignorant of the Scriptures, because from them they had not learned life eternal and the resurrection, Matt. 22:29. IV. But let us argue from the very books of the Old Testament: and first, after the example of our Lord, who, Matt. 22:31, 32, speaks to this purpose: “But, as touching the resurrection of the dead, have ye not read that which was spoken unto you by God, saying, I am the God of Abraham, and the God of Isaac, and the God of Jacob; God is not the God of the dead, but of the living.” This inference appeared so evident to the multitude, that they were astonished at his doctrine, and the Sadducees were put to silence, ver. 33, 34. And, indeed, if the words of Moses, quoted by Christ, be accurately weighed, the evidence of this argument will easily appear to the attentive reader. V. For, 1st, That expression, to be God to any, in its full import, includes life eternal, For, when God becomes the sinner’s God, he then becomes to him what he is to himself. But, what is he to himself? Doubtless, the fountain of eternal and complete blessedness. When God, out of his grace, gives himself to man, he gives him all things; for himself is all things. Such a man finds in God “a shield” against every evil, and an “exceeding great reward,” Gen. 15:1. And what can he desire more in order to his perfect happiness? Accordingly, the apostle joins these two, Heb. 11:16, God to be the God of any one, and to have prepared for them a city. And seeing the “gifts” of God’s grace, especially when he gives himself, “are without repentance”, Rom. 11:29; hereby also the eternity of this happiness is established. …XVII. But lest they should cavil, that we borrow our arguments only from the New Testament (though none can better instruct us in the contents of the Old Testament than Christ and his apostles), we shall consider some passages of the Old Testament, and free them from the misconstructions of our adversaries. And, first, we have that swanlike song of Jacob, Gen. 49:18. לישועתך קויתי יהוה “I wait for thy salvation, O Lord.” The aged Prophet was now at the point of death; and, being full of the Spirit of God, he, in the midst of his prophecies, in which he foretels what was to befall his children and latest posterity, breaks out into these words; which were not spoken without the Spirit of God, so as, with Smalcius, to be referred to a vain persuasion, nor possibly to be wrested to any other but this spiritual and eternal salvation. XVIII. Here, again, let a certain Jew put the followers of Socinus, if possible, to the blush: in opposition to whom we produce this paraphrase of the Jerusalem Targumist. “Our father Jacob said, My soul does not expect the redemption of Gideon, the son of Joaz, that being only momentary; nor the redemption of Samson, because a transient redemption; but the redemption thou hast mentioned in thy word, or by thy word, which is to come to thy people, the children of Israel; my soul, I say, expects this thy redemption.” Is not this a very clear testimony of the most certain persuasion and the fullest assurance of their salvation? …XXXIII. When the same apostle affirms that our “salvation at the first began to be spoken by the Lord,” Heb. 2:3, it is clear he speaks of the Gospel completed, and of the Messiah, the author of salvation, already exhibited; which Gospel the Lord first published, with respect to the apostles, evangelists, and the other ordinary preachers that followed them. For otherwise who can deny that Zacharias, the father of John the Baptist, and Mary the mother of our Lord, and the angels who proclaimed his nativity, and the aged Simeon, and John the Baptist, were preachers of salvation before the Lord? Of the Fathers the apostle himself affirms, that they were ευαγγελισμενοι, gospelized, or that “the Gospel was preached unto them as well as unto us,” Heb. 4:2. XXXIV. When it is written, Heb. 9:8. “That the way unto the holiest of all was not yet made manifest, while as the first tabernacle was yet standing;” the apostle indeed intimates, that the manner of obtaining salvation was, in some measure hid, in comparison of the brighter lustre of the Gospel. For then, doubtless, the way to life was clouded with much pomp of ceremonies and figures; which being now dispelled, we behold with open face, and ardently desire, heavenly and spiritual things. But from this it no ways follows, that those under the Old Testament had no knowledge of salvation; any more than it can be concluded, we know nothing of our glorious state, because John says, “It doth not yet appear what we shall be,” John 3:2. We may almost, in the same manner, answer the other objections advanced by our adversaries. But it is no part of our design to examine each in particular. XXXV. Now let us proceed to the second thing, which we undertook to prove; that in Christ, and in virtue of his suretiship, the fathers of the Old Testament also obtained salvation even as we. Which Peter declares almost in so many words, Acts 15:11: “But we believe that, through the grace of the Lord Jesus Christ, we shall be saved even as they.” Where the pronoun they is to be referred to the fathers, on whose neck an insupportable yoke of ceremonies was put, as appears both from the grammatical consideration of the gender, from the connexion and the force of the apostles argument. For, since κᾀκεῖνοι is masculine and τα ἔθνα, the Gentiles, mentioned ver. 7, is neuter, it is not so properly referred to the Gentiles as to the fathers. And we are not here, without necessity, to have recourse to an enallage of gender. And then, too, what method of commenting is it, to imagine so wide an hyperbaton or transposition, and to bring from verse 7 a noun, to which, after the interposition of so many other things, a pronoun shall at length answer in eleventh verse, and which yet does not answer; because, in the words immediately preceding, you may find a noun, with which the pronoun in question may be very well joined? In fine, it will either be nonsense, or, very insipid, if the words be so construed. For, what manner of reasoning is it, if we suppose the apostle to have said: “The yoke of ceremonies ought not to be put on the necks of the Gentiles, because, we Jews and apostles believe, that we shall be saved in the same manner as they, by the alone grace of the Lord Jesus Christ?” For besides this, it was improper to propose the Gentiles, to the Jews and apostles, as a pattern of salvation, because it appears, that the contrary should be done; and we could only conclude from that position, that the apostles and Jews were not bound to circumcision, and the other ceremonies, any more than the Gentiles. But that was not the thing in dispute. But according to our interpretation, the apostle argues in the strongest manner: “You ought not to put the yoke of ceremonies on the necks of the disciples, who are converted from among the Gentiles, because the fathers themselves, who were under that yoke, really felt the uneasiness of it, but did not find salvation in it, and yet they were saved, not in consequence of these ceremonies, but by the grace of our Lord Jesus Christ. Neither are we, nor any of the human race, to take any other way to attain salvation. They therefore are under a mistake, who tell the disciples, if you will be saved, you must be circumcised, and keep the law of Moses.” To sum up the whole, then, in short, the apostle here declares three things. 1st, That the fathers were saved. 2dly, By the very same covenant that we are. 3dly, Through the grace of our Lord Jesus Christ: intimating likewise by all this reasoning, that there can possibly be but ONE way of salvation. XXXVI. This is likewise confirmed by that famous passage, Heb. 13:8, “Jesus Christ the same yesterday, and to-day and for ever.” In the foregoing verse the apostle admonished them to keep fresh in their memory “the word,” which their guides had spoken unto them, whose faith they should follow. Now, he gives this for the reason of that admonition, because “Jesus Christ is the same yesterday, and to-day, and for ever;” constantly preached by all the teachers of the truth, believed on by all, and to be believed on by those that come after, if they will imitate the faith of their predecessors. The same doctrine therefore is always to be retained, because Christ, who was always both proposed, and believed, as the author of salvation, changeth not. But the particles, yesterday, to-day, and for ever, denote all the differences of times. Nor does yesterday here signify something of a late date, as we usually say, yesterday or lately; but all the time past: as the phrase to-day denotes the time of grace under the New Testament. For, this is compared to some one present day, as chap. 3:13. “While it is called to-day:” and chap. 4:7. “Again, he limiteth a certain day, saying in David, To-day,” &amp;c.; of which 2 Cor. 6:2, “Behold! now is the accepted time, behold! now is the day of salvation.” As, therefore, Christ is to-day, under the New Testament, acknowledged the alone author of salvation, and will be acknowledged as such for ever; so, in like manner, yesterday, under the Old Testament, which day is now past, he was the same, and as such was declared and acknowledged. XXXVII. Let us also add what we have in Heb. 9:15, “And for this cause he is the mediator of the New Testament, that, by means of death, for the redemption of the transgressions that were under the first testament, they which are called might receive the promise of eternal inheritance.” Where we have an open declaration, that the death of Jesus Christ was effectual for the redemption of transgressions committed under the Old Testament. For thus the apostle proceeds. He supposes that the fathers of the Old Testament were saved, notwithstanding their sins; which Socinus, with his followers, dare not deny. He says further, that the blood of bullocks and of goats, and consequently of all sacrifices whatever, could not really, and before the tribunal of God, expiate sin, and purify the conscience. Yet since, as he declares, without shedding of blood there can be no remission, verse 22, he concludes, it was necessary that the death of Christ should indeed be undergone, in order not only to the establishment of the New Testament, but by virtue of which the redemption of former sins might also be obtained. This is the genuine meaning of the sacred writer. XXXVIII. And, indeed, Grotius shamefully shuffles, when, to favour the Socinians, he thus writes on this place: “His death intervened for this end, that men might be delivered from those sins, which generally prevailed, before Christ, among those called God’s people.” Is it really so? Would thus “the redemption of the transgressions that were under the first testament,” denote such an action of Christ, whereby succeeding ages would abstain from the like sins, as were formerly committed? God forbid we should ever pervert Scripture thus. Redemption is כפד an expiation of sin, upon paying a ransom. Christ paid this for all the sins of his elect, at whatever time they lived. And upon the credit of that payment, to be made at the appointed time, believers, even under the Old Testament, obtained redemption. XXXIX. Moreover, since it is evident that Old Testament saints were saved, it must likewise be evident that they were saved through Christ. For our Saviour himself says, John 14:6: “No man cometh unto the Father but by me.” And Peter, Acts 4:12: “Neither is there salvation in any other; for there is none other name under heaven given among men, whereby we must be saved.” Nothing can be plainer than these words, which seem to be written as with a sun-beam. Yet the itch of contradiction has found something to say, but that something is less than nothing. XL. Our adversaries except, that these passages should be understood of those who live under the New Testament, and therefore that both Christ and Peter speak in the present, and not in the past time; of us, and not of the Old Testament saints; of the times when Christ was exhibited, and not of the Old Testament times. We answer: 1st, As both texts are expressed in universal terms, they are not to be limited without cause and necessity, as there is none in this case. For if salvation could be obtained formerly without Christ, equally as now through Christ, what need had we of Christ’s coming? Or, what so very great matter do we obtain Christ? 2dly, There are very solid reasons, why they neither ought nor can be thus restricted. Because they who were “without Christ, were strangers from the covenants of promise, having no hope, and without God in the world.” Eph. 2:12. 3dly, The quibbling about the verbs being of the present time is idle, because verbs of that time or tense may equally refer to all times. And whatever expression had been used, whether denoting the future or past time, there might always be room left for such cavils. Besides, no reason can be assigned, why the past time should be excluded any more than the future, if that verb of the present tense is thus to be racked. If this is not false reasoning against the Supreme Being, and a childish abuse of one’s genius and parts, what can be called so? …XLIII. The apostle writes nothing in opposition to this truth, when he says, Gal. 3:23. “But before faith came, we were kept under the law.” For it is far from the apostle’s intention to deny, that faith in Christ prevailed before his coming in the flesh, because, in the same chapter, he had highly commended the faith of Abraham, and proposed it as a pattern to us all, ver. 6, 7, 9. But by faith we here understand either the object of faith, the doctrine of the Gospel, as chap. 1:23, and the Lord Jesus himself, believed on in the world, 1 Tim. 3:16, or, the faith of the redemption already actually wrought out, as contradistinguished from the hope of the Old Testament saints, who, with earnest longing, as it were, expected the coming of the Lord, “waiting for the consolation of Israel,” Luke 2:25. And thus we have now shown, that the Old Testament saints had the same promises of eternal life with us, to be obtained by the same Christ, and the same faith in him, and consequently also had the same covenant of grace with us.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I. It is a matter of the greatest moment, that we learn distinctly to consider the covenant of grace, either as it is in its substance or essence, as they call it, or as it is in diverse ways proposed by God, with respect to circumstantials, under different economies. If we view the substance of the covenant, it is but only one, nor is it possible it should be otherwise. There is no other way worthy of God, in which salvation can be bestowed on sinners, but that discovered in the Gospel. Whence the apostle, Gal. 1:7, has beautifully said, “which is not another.” And that testament which was consecrated by the blood of Christ, he calls “everlasting,” Heb. 13:20, because it was settled from eternity, published immediately upon the fall of the first man, constantly handed down by the ancients, more fully explained by Christ himself and his apostles, and is to continue throughout all ages, and, in virtue of which, believers shall inherit eternal happiness. But if we attend to the circumstances of the covenant, it was dispensed “at sundry times and in divers manners,” under various economies for the manifestation of the manifold wisdom of God. In considering this, we are first to discourse on those general things which appertain to the substance of the covenant, and have continued in every age; and then explain the different economies or dispensations, and the new accessions made to each; which we will, first, do in a general and concise manner, in this and the following chapter; then gradually descend to the more special considerations. II. We therefore maintain, agreeable to the sacred writings, that to all the Elect, living in any period of time: 1st, One and the same eternal life was promised. 2dly, That Jesus Christ was held forth as the one and the same author and bestower of salvation. 3dly, That they could not become partakers of it any other way, but by a true and lively faith in him. If we demonstrate these n of the Jews, Acts 24:14, 15, “Believing all things, which are written in the Law and the Prophets; and have hope towards God, which they themselves also allow, that there shall be a resurrection of the dead, both of the just and unjust.” He testifies, that the Jews expected a resurrection of the dead; he professes the same belief and hope with them; and that he did not do so out of a vain presumption, but from a faith resting on the Law and the Prophets, which they also, in their manner, carefully read, and from which they had derived the same expectation with him. 3dly, The Jews were so far from judging amiss in this respect, that, on the contrary, the Lord Jesus reproved the Sadducees, as ignorant of the Scriptures, because from them they had not learned life eternal and the resurrection, Matt. 22:29. IV. But let us argue from the very books of the Old Testament: and first, after the example of our Lord, who, Matt. 22:31, 32, speaks to this purpose: “But, as touching the resurrection of the dead, have ye not read that which was spoken unto you by God, saying, I am the God of Abraham, and the God of Isaac, and the God of Jacob; God is not the God of the dead, but of the living.” This inference appeared so evident to the multitude, that they were astonished at his doctrine, and the Sadducees were put to silence, ver. 33, 34. And, indeed, if the words of Moses, quoted by Christ, be accurately weighed, the evidence of this argument will easily appear to the attentive reader. V. For, 1st, That expression, to be God to any, in its full import, includes life eternal, For, when God becomes the sinner’s God, he then becomes to him what he is to himself. But, what is he to himself? Doubtless, the fountain of eternal and complete blessedness. When God, out of his grace, gives himself to man, he gives him all things; for himself is all things. Such a man finds in God “a shield” against every evil, and an “exceeding great reward,” Gen. 15:1. And what can he desire more in order to his perfect happiness? Accordingly, the apostle joins these two, Heb. 11:16, God to be the God of any one, and to have prepared for them a city. And seeing the “gifts” of God’s grace, especially when he gives himself, “are without repentance”, Rom. 11:29; hereby also the eternity of this happiness is established. …XVII. But lest they should cavil, that we borrow our arguments only from the New Testament (though none can better instruct us in the contents of the Old Testament than Christ and his apostles), we shall consider some passages of the Old Testament, and free them from the misconstructions of our adversaries. And, first, we have that swanlike song of Jacob, Gen. 49:18. לישועתך קויתי יהוה “I wait for thy salvation, O Lord.” The aged Prophet was now at the point of death; and, being full of the Spirit of God, he, in the midst of his prophecies, in which he foretels what was to befall his children and latest posterity, breaks out into these words; which were not spoken without the Spirit of God, so as, with Smalcius, to be referred to a vain persuasion, nor possibly to be wrested to any other but this spiritual and eternal salvation. XVIII. Here, again, let a certain Jew put the followers of Socinus, if possible, to the blush: in opposition to whom we produce this paraphrase of the Jerusalem Targumist. “Our father Jacob said, My soul does not expect the redemption of Gideon, the son of Joaz, that being only momentary; nor the redemption of Samson, because a transient redemption; but the redemption thou hast mentioned in thy word, or by thy word, which is to come to thy people, the children of Israel; my soul, I say, expects this thy redemption.” Is not this a very clear testimony of the most certain persuasion and the fullest assurance of their salvation? …XXXIII. When the same apostle affirms that our “salvation at the first began to be spoken by the Lord,” Heb. 2:3, it is clear he speaks of the Gospel completed, and of the Messiah, the author of salvation, already exhibited; which Gospel the Lord first published, with respect to the apostles, evangelists, and the other ordinary preachers that followed them. For otherwise who can deny that Zacharias, the father of John the Baptist, and Mary the mother of our Lord, and the angels who proclaimed his nativity, and the aged Simeon, and John the Baptist, were preachers of salvation before the Lord? Of the Fathers the apostle himself affirms, that they were ευαγγελισμενοι, gospelized, or that “the Gospel was preached unto them as well as unto us,” Heb. 4:2. XXXIV. When it is written, Heb. 9:8. “That the way unto the holiest of all was not yet made manifest, while as the first tabernacle was yet standing;” the apostle indeed intimates, that the manner of obtaining salvation was, in some measure hid, in comparison of the brighter lustre of the Gospel. For then, doubtless, the way to life was clouded with much pomp of ceremonies and figures; which being now dispelled, we behold with open face, and ardently desire, heavenly and spiritual things. But from this it no ways follows, that those under the Old Testament had no knowledge of salvation; any more than it can be concluded, we know nothing of our glorious state, because John says, “It doth not yet appear what we shall be,” John 3:2. We may almost, in the same manner, answer the other objections advanced by our adversaries. But it is no part of our design to examine each in particular. XXXV. Now let us proceed to the second thing, which we undertook to prove; that in Christ, and in virtue of his suretiship, the fathers of the Old Testament also obtained salvation even as we. Which Peter declares almost in so many words, Acts 15:11: “But we believe that, through the grace of the Lord Jesus Christ, we shall be saved even as they.” Where the pronoun they is to be referred to the fathers, on whose neck an insupportable yoke of ceremonies was put, as appears both from the grammatical consideration of the gender, from the connexion and the force of the apostles argument. For, since κᾀκεῖνοι is masculine and τα ἔθνα, the Gentiles, mentioned ver. 7, is neuter, it is not so properly referred to the Gentiles as to the fathers. And we are not here, without necessity, to have recourse to an enallage of gender. And then, too, what method of commenting is it, to imagine so wide an hyperbaton or transposition, and to bring from verse 7 a noun, to which, after the interposition of so many other things, a pronoun shall at length answer in eleventh verse, and which yet does not answer; because, in the words immediately preceding, you may find a noun, with which the pronoun in question may be very well joined? In fine, it will either be nonsense, or, very insipid, if the words be so construed. For, what manner of reasoning is it, if we suppose the apostle to have said: “The yoke of ceremonies ought not to be put on the necks of the Gentiles, because, we Jews and apostles believe, that we shall be saved in the same manner as they, by the alone grace of the Lord Jesus Christ?” For besides this, it was improper to propose the Gentiles, to the Jews and apostles, as a pattern of salvation, because it appears, that the contrary should be done; and we could only conclude from that position, that the apostles and Jews were not bound to circumcision, and the other ceremonies, any more than the Gentiles. But that was not the thing in dispute. But according to our interpretation, the apostle argues in the strongest manner: “You ought not to put the yoke of ceremonies on the necks of the disciples, who are converted from among the Gentiles, because the fathers themselves, who were under that yoke, really felt the uneasiness of it, but did not find salvation in it, and yet they were saved, not in consequence of these ceremonies, but by the grace of our Lord Jesus Christ. Neither are we, nor any of the human race, to take any other way to attain salvation. They therefore are under a mistake, who tell the disciples

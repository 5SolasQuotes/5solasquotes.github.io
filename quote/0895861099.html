<main class="wrap"><figure class="quote" id="q-0895861099" data-kw="">
<blockquote><p>In order that a work may be truly good, (2.) It must spring from a principle of faith and love in the heart. All men recognize that the moral character of an act always is determined by the moral character of the principle or affection which prompts to it.

Unregenerate men perform many actions, good so far as their external relations to their fellow-men are concerned. But love to God is the foundation-principle upon which all moral duties rest, just as our relation to God is the fundamental relation upon which all our other relations rest. If a man is alienated from God, if he is not in the present exercise of trust in him and love for him, any action he can perform will lack the essential element which makes it a true obedience.

Good works, according to the Scriptures, are the fruits of sanctification, having their root in regeneration: “For we are his workmanship, created in Christ Jesus unto good works, which God hath before ordained that we should walk in them.” Eph. ii. 10. James says that faith is shown by works; which of course implies that the kind of works of which he speaks springs only from a believing heart. James ii. 18, 22.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander-hodge.html">Archibald Alexander Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, ed. William H. Goold (British edn, London: T. Nelson and Sons, 1870), pp 221-22.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4bfd89dcb1" data-kw="">
<blockquote><p>2. Good works are the way in which God hath appointed us to walk in order to our obtaining eternal life.–They are via ad regnum [the way to the kingdom], the path of life, ‘the way to God’s kingdom,’ the work we are to do ere we receive our reward, the race we are to run ere we be crowned [following Voet &amp; Rutherford, 1 Cor. 9:24-25; Heb. 12:1]. Though God save us not for them as meritorious causes of his saving us, yet those that are capable of doing them he doth not ordinarily save without them: [quotes Eph. 2:10 &amp; Heb. 12:14] Though eternal glory be not, as hath been proved, properly a reward, nor God’s giving it an act of strict justice; yet God hath, we acknowledge, determined to give it, per modum praemii, ‘after the manner of a reward;’ in that he will not give men the glory he intends them till they have done him some service; not treat them as conquerers who never fought his battle; not respect them as faithful servants who have been sluggards or loiterers. The ‘sanctification of the Spirit,’ as well as the ‘belief of the truth,’ must go before salvation, ‘because God hath from the beginning chosen us to salvation’ by the one as well as the other. (2 Thess. 2:13)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-veal.html">Edward Veal</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether the Good Works of Believers be Meritorious of Salvation</cite>, [It is Denied]’, pp. 213-214 in Puritan Sermons, 1659-1689, vol. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-db98b8b530" data-kw="">
<blockquote><p>We say with the Scripture, that the Relation of the works to the Reward doth herein consist, that by the liberal promise of God there is the same respect between them, as between Antecedents and Consequents by Covenant, &amp;c. because it pleased God so to appoint it: who yet in that appointment would shew that he is delighted in the good works of his own, and animateth them to the exercise thereof.</p></blockquote>

</figure><figure class="quote" id="q-220dca2496" data-kw="">
<blockquote><p>See how it is that we do not justify men before God by works, but say, that all who are of God are regenerated and made new creatures, so that they pass from the kingdom of sin into the kingdom of righteousness. In this way they make their calling sure, and, like trees, are judged by their fruits.</p></blockquote>

</figure><figure class="quote" id="q-da08aaf6da" data-kw="">
<blockquote><p>Many things are necessary to us either as causes, or as conditions, or as means, as instruments, as helps, as props, by which we may be brought to eternal life: by which either the bars and impediments may be taken away, which block up to us the way and passage to eternal life, or the necessary stairs are laid under, for our ascending to the height of that sublimity; or else necessary strength is afforded us to go that hard journey, and bear that hard conflict; or that the strength and force of our enemies may be broken and foiled. We have need of knowledge, constancy, charity, sanctity, prayers, good works, etc. But above all these we must seek faith as a certain epitome and compendium of them all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-boyd.html">Robert Boyd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, ch. 4, vv. 12-13, p. 521 trans. Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 410</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

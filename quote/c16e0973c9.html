<main class="wrap"><figure class="quote" id="q-c16e0973c9" data-kw="">
<blockquote><p>It seems to be solidly argued from 1 Tim. v. 17. that there were in the primitive church some elders, who did not use to preach: nothing very express is said concerning them: only it seems to be intimated James v. 14. that they prayed with the flock. It may be very expedient, even on the principles of human prudence, to appoint some of the more grave and honourable members of the society to join with the pastor in the over-sight of it, who may constitute a kind of council with him, to deliberate of affairs in which the society is concerned, and prepare them for being brought before the church for its decision, to pray with the sick, to reconcile differences, &amp;c.

[B]ut there does not seem any sufficient warrant for making them a kind of judicatory, to whose decisions the rest of the society is to submit; and those rules relating to presbyteries, classes, provincials, and general assemblies, which are determined by the constitution of the church of Scotland, most evidently appear to be at best merely matters of human discretion, and to have no express foundation in the word of God; nor can we trace the existence of such ruling elders higher than Constantine’s time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-doddridge.html">Philip Doddridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Course of Lectures on the Principal Subjects in Pneumatology, Ethics, and Divinity</cite>, (London: J. Buckland, 1763), Proposition CL, Scholium 5, pp 522-23.</span></figcaption>

<blockquote><p>Augustine says with us, we are in mercy ‘to rebuke what we cannot amend, and to bear it patiently.&#x27;</p></blockquote>

— Samuel Rutherford, A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland, … (London, 1642), ch. 10, p. 149">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAugustine+says+with+us%2C+we+are+in+mercy+%E2%80%98to+rebuke+what+we+cannot+amend%2C+and+to+bear+it+patiently.%27%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Peaceable+%26+Temperate+Plea+for+Paul%E2%80%99s+Presbytery+in+Scotland%2C+%E2%80%A6+%28London%2C+1642%29%2C+ch.+10%2C+p.+149&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F649cda56e7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/649cda56e7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/ruling-elders#:~:text=Augustine%20says%20with%20us%2C%20we%20are,amend%2C%20and%20to%20bear%20it%20patiently&amp;text=Augustine%20says%20with%20us%2C%20we%20are%20in%20mercy&amp;text=we%20cannot%20amend%2C%20and%20to%20bear%20it%20patiently" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1b8f76400d" data-kw="">
<blockquote><p>And we begin with tile Ruling Elders’ place, for that carries a kind of simplicity with it: there be more ingredients required to make up the Office of Pastor and Doctor, and therefore we shall take leave to trade in the first. …

That there is such an Office and Officer appointed by Christ, as the Scriptures are plain to him, whose spirit and apprehension is not possessed and forestalled with prejudice: So this cause hath been maintained by mand of Christ’s Worthies of former, and now of latter times; and now at last, by those two famous and eminent Champions, Mr. Rutterfort [Samuel Rutherford], and Mr. Gilespy [George Gillespie].

So that we have no controversy here but with Hierarchical Persons, the force and power of whose Arguments, lies especially in a Pursuvant and a Prison, armed with Authority of an High-Commission. And therefore we shall content our selves to settle the Scriptures shortly upon their basis and bottom, according to the sense of the Spirit of God, in the several places, and dispute briefly, there-from, and so finish this Head of Discipline.

The first Argument we have from Rom. 12.7. which gives in witness to this truth, where all these officers are numbered and named expressly; if the meaning of the words be once manifested, which will be made clear in the particulars following. …

The second Argument is taken from 1 Cor. 12.28. God hath set some in his Church; as first, Apostles; then Prophets; thirdly, Teachers; after that Powers, then gifts of healing, helps, Governments. The scope of the place, and the Apostle his intendment is, to lay open the several Offices and Officers that the Lord hath set in his Church, and so many chief members, out of which the Church is constituted as an entire body. …

From which premises, the dispute issues thus: As Apostles, Prophets, and Teachers are distinct, so are Helps and Governments distinct; for the Spirit puts them in the same rank, as having a parity of reason, which appertains to them all. But they were distinct Offices, and found in persons as distinct Officers, as vers. 30. Are all Apostles? Are all Teachers? Therefore, the same is true of Governors. …

A third argument is taken from the famous place, 1 Tim. 5.17. which is full to our purpose in hand, and intended by the Holy Spirit of the Lord, to make evident the station and office of Ruling Elders, unto the end of the world; and it is admirable to observe, how the factors and followers of the Pope and Prelates, who labour to prop up their place and pre-eminency, have used all the wiliness of their wits, and unwearable wrestlings of their carnal reason, to darken the evidence of the truth, and to defeat the power of the proof in this place, as fearing, it should seem, lest by this means their way to promote and maintain the pride of Prelacy, would be utterly prejudiced and overthrown; whereas, do but suffer the Deacon to lay aside the care of the poor, make him but half a Priest, give him the allowance that he may baptize, and not give the Sacrament of the Supper; raise the Ruling-Elder one stair higher, that he may be a Teaching-Presbyter:

By this time, the Bishop is beyond the bound of an ordinary Elder, and with a little help, he will be handed up into a Diocesan Palace, and one lift more will make him a Primate; and if the Kings of the earth favour him, he will make himself a Pope presently; for they differ but in degrees, not in kind. So that you must not wonder to see the contention grow so hot touching a Ruling Elder, because if he be confined with his compass, the wings of Pope and Prelate will be exceedingly clipped, and their power impeached.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hooker.html">Thomas Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the sum of church-discipline. Wherein the way of the churches of New-England is warranted out of the word, and all exceptions of weight, which are made against it, answered</cite>, (London: John Bellamy, 1648), Part 2.1, pp 8, 10, 11-12.</span></figcaption>

ind.+So+that+you+must+not+wonder+to+see+the+contention+grow+so+hot+touching+a+Ruling+Elder%2C+because+if+he+be+confined+with+his+compass%2C+the+wings+of+Pope+and+Prelate+will+be+exceedingly+clipped%2C+and+their+power+impeached.%E2%80%9D%0A%0A%E2%80%94+Thomas+Hooker%2C+A+survey+of+the+sum+of+church-discipline.+Wherein+the+way+of+the+churches+of+New-England+is+warranted+out+of+the+word%2C+and+all+exceptions+of+weight%2C+which+are+made+against+it%2C+answered%2C+%28London%3A+John+Bellamy%2C+1648%29%2C+Part+2.1%2C+pp+8%2C+10%2C+11-12.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1b8f76400d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1b8f76400d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/05/17/thomas-hooker-on-ruling-elders-clipping-the-wings-of-prelacy/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The second defect which he [an opponent] wishes supplied is that the temporary ruling elders may be made perpetual and for life… This I assent unto providing he admit a distinction betwixt the office itself, and the exercise of the same. The office of a ruling elder ought to be for his life no less than the pastors; yet must we not condemn those Churches which dispense with the intermission of their actual attendance for a certain space, and permit them to exercise their office by course, as the Levites did of old, whose example himself here takes for a pattern.</p></blockquote>

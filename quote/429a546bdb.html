<main class="wrap"><figure class="quote" id="q-429a546bdb" data-kw="Original Sin|Mortification|Forgiveness" data-pol="">
<blockquote><p>The corruption of nature, during this life, does remain in those that are regenerated (Rom. 7:18, 23; Eccl. 7:20; 1 John 1:8); and although it be through Christ pardoned and mortified, yet both itself, and the first motions thereof, are truly and properly sin (Rom. 7:23–25; Gal. 5:17).</p></blockquote>
<figcaption>— <a href="../authors/particular-baptists.html">Particular Baptists</a>, <cite>Second London Baptist Confession of Faith (1689)</cite>, 6.5</figcaption>

</figure><figure class="quote" id="q-e2292fd89c" data-kw="Mortification" data-pol="">
<blockquote><p>Every spark of fire is fire, and will burn; so is every thing of the law of sin, the last, the least of it, -- it is enmity, it will poison, it will burn. … Mortification abates of its force, but doth not change its nature. Grace changeth the nature of man, but nothing can change the nature of sin. Whatever effect be wrought upon it, there is no effect wrought in it, but that it is enmity still, sin still.</p></blockquote>
<figcaption>— <a href="../authors/john-owen.html">John Owen</a>, <cite>Indwelling Sin in Believers</cite>, ch. 4</figcaption>

</figure><figure class="quote" id="q-d141cab0f1" data-kw="Original Sin|Regeneration|Imputation" data-pol="">
<blockquote><p>Now although by regeneration we hold that the guilt and pollution of original sin is taken away as to dominion (because it is neither imputed to them anymore for condemnation, nor does it reign in them), yet we deny that it is absolutely taken away as to existence and whatever holds the relation of sin in it.</p></blockquote>
<figcaption>— <a href="../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 9.11.21</figcaption>

</figure><figure class="quote" id="q-19ea18ba90" data-kw="Original Sin|The Fall|Depravity" data-pol="">
<blockquote><p>We believe that through the disobedience of Adam original sin is extended to all mankind; which is a corruption of the whole nature and a hereditary disease, … and which produces in man all sorts of sin, being in him as a root thereof, and, therefore, is so vile and abominable in the sight of God that it is sufficient to condemn all mankind. … Not that they should rest securely in sin, but that a sense of this corruption should make believers often to sigh, desiring to be delivered from this body of death.</p></blockquote>
<figcaption>— <a href="../authors/guido-de-bres.html">Guido de Brès</a>, <cite>Belgic Confession</cite>, Art. 15</figcaption>

<blockquote><p>It is impossible to tolerate the impiety which, under the pretence of a twofold righteousness, undermines our assurance of salvation, and hurrying us into the clouds, tries to prevent us from embracing the gift of expiation in faith, and invoking God with quiet minds.</p></blockquote>

</figure><figure class="quote" id="q-2292c0d676" data-kw="">
<blockquote><p>In the confusion of a twofold grace, which Osiander obtrudes upon us, there is a similar absurdity. Because those whom God freely regards as righteous, he in fact renews to the cultivation of righteousness, Osiander confounds that free acceptance with this gift of regeneration, and contends that they are one and the same. But Scriptures while combining both, classes them separately, that it may the better display the manifold grace of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.6</span></figcaption>

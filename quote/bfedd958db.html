<blockquote><p>But it is impossible to tolerate the impiety which, under the pretence of a twofold righteousness, undermines our assurance of salvation, and hurrying us into the clouds, tries to prevent us from embracing the gift of expiation in faith, and invoking God with quiet minds.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-fd8814c746" data-kw="">
<blockquote><p>It is very certain that kneeling at the Lord’s table was unknown in the Christian Church for a number of centuries after the apostolic age. Indeed, in the second, third, and following centuries, it was accounted unlawful even to kneel on the Lord’s day; this posture being reserved for days of fasting and humiliation. This is asserted by Tertullian; and the Council of Nice passed a solemn decree to the same amount, because on that day is celebrated the joyful remembrance of our Lord’s resurrection. This posture, both of public prayer on the Lord’s day, and of receiving the communion, was invariably standing. The proof of this is so complete as to preclude the possibility of doubt.

The most ardent friends of kneeling do not pretend, so far as is now recollected, to find any example of this posture, in the whole history of the Church, prior to the thirteenth century. That is, not until the Papacy had reached the summit of its system of corruption. And, accordingly, in the Greek Church, which separated from the Latin, before the doctrine of Transubstantiation arose, kneeling at the communion is unknown. In short, kneeling at the Lord’s table was not introduced until Transubstantiation arose; and with Transubstantiation it ought, by Protestants, to have been laid aside. When men began to believe that the sacramental elements were really transmuted into the body and blood of the Redeemer, there was some colour of apology for kneeling and adoring them. But when this error was abandoned, that which had grown out of it ought to have been abandoned also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Presbyterianism: The Truly Primitive and Apostolic Constitution of the Church of Christ</cite>, (Philadelphia PA: Presbyterian Tract and Sunday School Society, 1836), pp 86-87.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f4f0adf507" data-kw="">
<blockquote><p>II. …This latter opinion [of Martin Luther] is followed by the Lutherans of our day. They maintain that to break means nothing else than to distribute the bread and give it to another; although they do not deny that Christ properly broke the bread. But this ceremony [of breaking the bread] is merely free and indifferent, lacking a command, which the church can at pleasure observe or omit… III. The [reformed] orthodox retain the breaking which was employed by the Lord… They think it is not an accidental and indifferent ceremony, but according to the institution of Christ, no less necessary than taking it in the hand, delivering and communing. Nor yet do they wish to contend so rigidly about it that no fellowship can be retained with those who omit it. they think this want [lack] of a thing not unimportant should neither be left unnoticed, nor tolerated if it can be corrected. Thus they are to be rebuked who hold this opinion, although they are not to be absolutely condemned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 3, 19th Topic, ‘The Sacraments’, section 3, p. 443</span></figcaption>

<blockquote><p>Must those who feel spiritually weak abstain from participation in the Lord’s Supper, from listening to the divine Word and from the prayers, because they think they have no faith or question whether they have any?

Answer: By no means, for God must be sought with constant yearning, also when the feeling of his nearness is not experienced. In addition, it is by these means that the life of the Spirit is maintained, just as we eat food to preserve life, even though we have neither desire nor appetite for it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius-and-johannes-hoornbeeck.html">Gisbertus Voetius and Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Desertion</cite>, trans. John Vriend and Harry Boonstra, ed. M. Eugene Osterhaven (1659; Grand Rapids MI: Reformation Heritage Books, 2003), p. 51.</span></figcaption>

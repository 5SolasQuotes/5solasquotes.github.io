<main class="wrap"><figure class="quote" id="q-d8fcc4f03a" data-kw="">
<blockquote><p>This book explores the emergence and development of the extra Calvinisticum in the Reformed tradition by tracing its first exposition from Ulrich Zwingli to early Reformed orthodoxy. Rather than being an ancillary issue, the questions surrounding the extra Calvinisticum were a determinative factor in the differentiation of Magisterial Protestantism into rival confessions. …Over time, Reformed theologians, such as Peter Martyr Vermigli and Antione de Chandieu, articulated the extra Calvinisticum with increasing rigor by incorporating conciliar christology, the church fathers, and scholastic methodology to address the polemical needs of engagement with Lutheranism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/k-j-drake.html">K.J. Drake</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Etiam extra carnem</cite>, (Oxford Univ. Press, 2021)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>
<div class="actions"><button class="copy" data-copy="“This book explores the emergence and development of the extra Calvinisticum in the Reformed tradition by tracing its first exposition from Ulrich Zwingli to early Reformed orthodoxy. Rather than being an ancillary issue, the questions surrounding the extra Calvinisticum were a determinative factor in the differentiation of Magisterial Protestantism into rival confessions. …Over time, Reformed theologians, such as Peter Martyr Vermigli and Antione de Chandieu, articulated the extra Calvinisticum with increasing rigor by incorporating conciliar christology, the church fathers, and scholastic methodology to address the polemical needs of engagement with Lutheranism.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8aae17ae7c" data-kw="">
<blockquote><p>The ceremonies associated with these signs are of express significance, and therefore are to be implemented as Christ has exemplified in the institution of it. Christ broke the bread, thereby signifying the breaking of his body, that is, his death. The apostle passes on to the congregation the ceremony of breaking; he refers to it as ‘the breaking of bread,’ and ‘the bread which we break’ (1 Cor. 10:16). The apostolic church did likewise, ‘…breaking bread’ (Acts 2:46); ‘…when the disciples came together to break bread’ (Acts 20:7). Therefore today the minister also must break the bread and give it as such to the communicants. The Papists and the Lutherans do this in an entirely different manner by giving a wafer to everyone without breaking it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, (RHB), vol. 2, pp. 474, 529 &amp; 532</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-8eb3be1fc7" data-kw="">
<blockquote><p>This sacrament, therefore, consists in the rite and the promise annexed to it, or in the signs and the things signified. The rite, or signs are the bread which is broken and eaten, and the wine which is poured out, and drunk. The things signified are the broken body, and shed blood of Christ, which are eaten and drunk, or our union with Christ by faith, by which we are made partakers of Christ and all his benefits, so that we derive from him everlasting life, as the branches draw their life from the vine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, (P&amp;R), pp. 378 &amp; 385</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-62e72839c5" data-kw="">
<blockquote><p>…I shall desire you to consider the ground why such affirmative precepts, as command duties relating to others, do not bind to always. The duties that they command are principally to this end, that they do good to men for the curing of their evils, for the farthering of virtue in them. Wherefore when prudence shows that such actions will be fruitless in respect of the end, or contrariwise harmful, they are to be forborne.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want</cite>, [Lack] of Church-Government [is] No Warrant for a Total Omission of the Lord’s Supper. Or a Brief &amp; Scholastical Debate of that Question which has so Wonderfully Perplexed Many, Both Ministers &amp; People: Whether or No the Sacrament of the Lord’s Supper may (according to Presbyterial Principles) be Lawfully Administered [by a Minister] in an un-presbyterated church, that is, a church destitute of ruling elders. Wherein the affirmative is confirmed… (London, 1650) Jeanes was an English presbyterian., p. 17</span></figcaption>

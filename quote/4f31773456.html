<blockquote><p>6. We have seen that Abraham, on the account of his faith, and not of his separation according to the flesh, was the father of all that believe, and heir of the world. And in the covenant made with him, as to that which concerns, not the bringing forth of the promised Seed according to the flesh, but as unto faith therein, and in the work of redemption to be performed thereby, lies the foundation of the church in all ages. Wheresoever this covenant is, and with whomsoever it is established, with them is the church; unto whom all the promises and privileges of the church do belong. Hence it was, that at the coming of the Messiah there was not one church taken away, and another set up in the room thereof; but the church continued the same, in those that were the children of Abraham according to the faith. The Christian church is not another church, but the very same that was before the coming of Christ, having the same faith with it, and interested in the same covenant. It is true, the former carnal privilege of Abraham and his posterity expiring, on the grounds before mentioned, the ordinances of worship which were suited thereunto did necessarily cease also. And this cast the Jews into great perplexities, and proved the last trial that God made of them; for whereas both these,—namely, the carnal and spiritual privileges of Abraham’s covenant,—had been carried on together in a mixed way for many generations, coming now to be separated, and a trial to be made (Mal. 3) who of the Jews had interest in both, who in one only, those who had only the carnal privilege, of being children of Abraham according to the flesh, contended for a share on that single account in the other also,—that is, in all the promises annexed unto the covenant. But the foundation of their plea was taken away, and the church, unto which the promises belong, remained with them that were heirs of Abraham’s faith only.

7. It remains, then, that the church founded in the covenant, and unto which all the promises did and do belong, abode at the coming of Christ, and doth abide ever since, in and among those who are the children of Abraham by faith. The old church was not taken away, and a new one set up, but the same church was continued, only in those who by faith inherited the promises. Great alterations, indeed, were then made in the outward state and condition of the church; as,— (1.) The carnal privilege of the Jews, in their separation to bring forth the Messiah, then failed; and therewith their claim on that account to be the children of Abraham. (2.) The ordinances of worship suited unto that privilege expired and came to an end. (3.) New ordinances of worship were appointed, suited unto the new light and grace then granted unto the church. (4.) The Gentiles came in to the faith of Abraham together with the Jews, to be fellow-heirs with them in his blessing. But none of these, nor all of them together, made any such alteration in the church but that it was still one and the same. The olive-tree was the same, only some branches were broken off, and others planted in; the Jews fell, and the Gentiles came in their room. And this doth and must determine the difference between the Jews and Christians about the promises of the Old Testament. They are all made unto the church. No individual person hath any interest in them but by virtue of his membership therewith. This church is, and always was, one and the same. With whomsoever it remains, the promises are theirs; and that not by implication or analogy, but directly and properly. They belong as immediately, at this day, either to the Jews or Christians, as they did of old to any. The question is, With whom is this church, founded on the promised Seed in the covenant? This is Zion, Jerusalem, Israel, Jacob, the temple of God. The Jews plead that it is with them, because they are the children of Abraham according to the flesh. Christians tell them that their privilege on this account was of another nature, and ended with the coming of the Messiah; that the church unto whom all the promises belong are only those who are heirs of Abraham’s faith, believing as he did, and thereby interested in his covenant. Not as though the promise made to Abraham were of none effect; for as it was made good unto his carnal seed in the exhibition of the Messiah, so the spiritual privileges of it belonged only unto those of the Jews and Gentiles in whom God had graciously purposed to effect the faith of Abraham. Thus was and is the church, whereunto all the promises belong, still one and the same, namely, Abraham’s children according to the faith: and among those promises this is one, that God will be a God unto them and their seed for ever.</p></blockquote>

<blockquote><p>For hence we may reason thus: I am indeed a member of the catholic Church of God, and therefore though my own prayers be weak, yet my comfort is this, I know that I am partaker of all the good prayers of all the people of God dispersed over the face of the whole earth, my fellow members, and of all the blessings which God bestows on them. This will make us in all our troubles to say with Elisha, ‘Fear not, for they that be with us are more than they that be with them.’… And surely though there were no other reason, yet this were sufficient to move a man to embrace Christian religion, considering that being a member of the Church he has part in all the prayers of the saints through the world, and of the blessings of God that come thereby… The communion of the living with the dead stands in two things: the one is, that the saints departed in the Church Triumphant do in general pray for the Church Militant upon earth, desiring the final deliverance of all their fellow members from all their miseries. And therefore in the Apocalypse they cry on this manner, ‘How long Lord holy and true! doest not Thou judge and avenge our blood on them that dwell on the earth. (Rev. 6:10) I say in general, because they pray not for the particular conditions and persons of men upon earth, considering they neither know, nor see, nor hear us: neither can they tell what things are done upon earth.</p></blockquote>

<blockquote><p>If he [the opponent] judge the terms of our communion lawful [in the Church of Scotland], then he must either join and keep communion with us, or maintain that a Church, the terms of whose communion are lawful, or, to keep to our these [thesis], in which there are no sinful terms of communion imposed, is yet to be separated from. This is a new tenet, never known before among men that called themselves presbyterians. I think they had reason, who, when these [separatist] men began to call themselves ‘the true presbyterians of the Chuch of Scotland’ [after the Glorious Revolution of 1689], they called them ‘the new presbyterians’.</p></blockquote>

</figure><figure class="quote" id="q-d4defa13d0" data-kw="">
<blockquote><p>Profession of Christianity is every man’s Church-title. No man is to prove the sincerity of his own profession; nor may the Church require such proof at his hands; For how can a man prove to another the sincerity of his own heart? But the fuller testimony he gives of it, the better it is: And therefore none should refuse to make his own profession, as fully credible to the church as he is able; nor is the church to be blamed for enquiring after the fullest credibility, so be it they do it but ad melius esse [to the better existence], and not ad esse [to the existence of it]; not laying his title upon it, nor refusing him for want [lack] of it. But every profession as such is credible in some degree, which is not disproved. Because men are, under God, the only competent judges of their own hearts: and the belief of one another is the ground of human converse: And it is an injury to any man to account him a liar, without sufficient proof. He that will disprove a man’s profession must prove first that he does not tolerably understand what he says; secondly, or that he speaks not seriously, but in jest; or not voluntarily, but in hypocrisy by constraint, or for some by end: Thirdly, or that he contradicts his own words by some more credible words or deeds. And if you never yet thus disproved men’s profession of Christianity before the pastors of the church and yet cry out against the pastors for admitting them, you are not true reformers, but disorderly mutineers and peevish censurers in the Church of Christ. Christ’s orders and men’s right, and all church-justice, must not be trodden down and sacrificed to your humor and arbitrary way.</p></blockquote>

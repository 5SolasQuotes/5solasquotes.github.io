<main class="wrap"><figure class="quote" id="q-86d39f2348" data-kw="">
<blockquote><p>1. That righteouseness whereby we are justified before God is the fulfilling of God’s law.

2. Legal justice is the fulfilling of the law, performed by him which is named just.

3. Evangelical justice is the punnishment of our sins, which Christ endured for us, freely imputed by God to them that believe.

4. Since the fall of man no man besides Christ alone in this life is justified before God by the righteouseness of the law.

5. We are justified only by faith in Christ.

6. And yet the righteousness of the law must in this life be begun in all that will be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rules &amp; Axions of Certain Chief Points of Christianity in A Collection of Certain Learned Discourses</cite>, … (d. 1587; Oxford, 1600), 22. ‘Of Man’s Justification before God’, pp. 271-72</span></figcaption>

</figure><figure class="quote" id="q-668dd45d16" data-kw="">
<blockquote><p>Q. What place has Christ’s righteousness here? Answer: [David] Pareus with some others distinguish between [1] the righteousness of Christ’s Person, which contains his essential righteousness as God, [2] the habitual and actual conformity of the man-Christ, and the perfect holiness of the man-Christ. Such a High Priest became us, as is holy, harmless, etc. Heb. 7:26. And [3] the righteousness of his merit, in the satisfaction of his suffering: the satisfaction is the formal cause of our justification, which is counted ours: this latter righteousness is acquired, the former is essential.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, (1655), pt. 2, ch. 1; p. 226</span></figcaption>

<blockquote><p>It is a question, the threatening standing, Gen. 2:17, how the active righteousness of Christ can be a cause meriting to us life and satisfying the Law when there is no suffering for the breach of the Law, which expressly required death in the sinner: Not to say that it seems too near to make Christ’s dying needless if his active holiness do the business; Nay we cannot so teach.</p></blockquote>

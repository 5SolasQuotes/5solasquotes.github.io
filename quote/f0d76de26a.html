<main class="wrap"><figure class="quote" id="q-f0d76de26a" data-kw="">
<blockquote><p>A fourth reason for obeying the injunction of the text [Jeremiah 45:5] is found in the fact, that great sorrow springs from great aspirations, when those aspirations are unattained. There is only one species of aspiration that does not weary and wear the soul, and that is, the craving and cry of the soul after God. “As the hart panteth after the water brooks, so panteth my soul after thee O God.” The desire expressed in these words of the Psalmist can never satiate, or disgust the human spirit, for the reason that God is the real and true portion, the substantial, eternal good of the creature. But all other aspirations dispirit and discourage in the end. “He that increaseth knowledge increaseth sorrow.”

The sadness and melancholy of the man of letters is well known. One of the most equable minds in literary history, singularly calm and balanced by nature, and remarkably free from passionate and stormy impulses, confessed at the close of a long life of eighty years that he had never experienced a moment of genuine repose. Humboldt, who had surveyed the cosmos, and who had devoted a long existence to placid contemplation of the processes of nature, and had kept aloof from the exciting and passionate provinces of human literature, said in his eightieth year: “I live without hope, because so little of what I have undertaken yields a satisfactory result.”

This is the penalty which ambitious minds pay for seeking “great things.” There is an infinite aspiration, and an infinitesimal performance. The hour of death, and the falling shadows of an everlasting existence, and an everlasting destiny, bring the aspiration and the performance into terrible contrast. Most impressively do such facts and experiences in the history of marked men reiterate the prophet’s injunction: “Seekest thou great things for thyself? seek them not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Spiritual Man (New York: Charles Scribner’s Sons, 1884), pp 380-81.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>Seventhly, are any of the Reformed Churches or any Churches or persons of the whole world so injurious to magistrates as their principles [that of the New England Independents, such as John Cotton] force them to be, who spoil Christian kings and parliaments of their whole legislative power? They will have us to believe, as good divinity, that it is not only unlawful for Church-assemblies to make ecclesiastic canons, but that it is alike unlawful for any prince or State to make a civil law, that the placing of a legislative power in kings or parliaments, is to usurp the property and prerogative of God. These principles cannot be very favorable to the State, which at one stroke annihilate all the acts of Parliament that now are in force, either in this or any other kingdom, and make it impossible (if they were believed) to have any more in any place of the earth, to the world’s end. Look back upon what I have cited from the chief of the Brownists’ writings. I grant the New English polishers of Brownism do not express their tenets in terms so hugely gross; yet see how near they come to them in substance, when they tell us that no magistrate may make any Laws about the bodies, lands, goods, liberties of the subject, which are not according to the laws and rules of Scripture, Scripture being given to men for a perfect rule, as well in matters of civil justice, as of devotion and holiness; and if so, then they must make it as unlawful and contrary to the Scripture’s perfection, for any man to make laws in matters of righteousness and of the State, as in matters of holiness and of the Church. That beside things in themselves good or evil, which Scripture determines by its laws expressly, things of an indifferent nature, whereupon the most of civil laws are made, must be regulated according to the Scripture rules of piety, charity, and conscience, so far that the expediency and reason of the law must ever carry and convince the conscience of the subject: that no man is obliged to the obedience of a civil Law in a thing never so indifferent by the authority of the lawgiver, but every man whose conscience is not convinced of the piety and charity of that Law, is free from all obedience and subjection thereto: Thus far Mr. Cotton.¹ ¹ Cotton’s Model of Power in The Bloody Tenet, p. 140. “The magistrate in making laws about civil and indifferent things in the commonwealth; First, he has no power given him of God to make what laws he pleases, either in restraining from or constraining to the use of indifferent things; because that which is indifferent in its nature, may sometimes be inexpedient in its use, and consequently unlawful: it is a prerogative proper to God to require obedience of the sons of men, because of his authority and will. It is an evil speech in some, that in some things the will of the law, not the reason of it, must be the rule of conscience to walk by: and that princes may forbid men to seek any other reason but their authority, yea when they command men frivola &amp; dura; and therefore it is the duty of the magistrate in all laws about indifferent things, to show the reasons, not only the will; to show the expediency as well as the indifferency of things of that nature; and because the judgement of expedient and inexpedient things, is often difficult and diverse, it is meet that such laws should not proceed without due consideration of the rules of expediency set down in the Word, which are these three: First, the rule of piety, that they may make for the glory of God, 1 Cor. 10:31. Secondly, the rule of charity, that no scandal come thereby to any weak brother, 1 Cor. 8:13. Thirdly, the rule of charity, that no man be forced to submit against his conscience, Rom. 14:14,23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (London: 1645), pp. 127-28</span></figcaption>

<blockquote><p>Now for the good election of magistrates, the Lord himself declareth whom and what kind of men he will have to be chosen, in these very words: “Look over all the people, consider them diligently, and choose from among them men of courage, such as fear God, speakers of truth, and haters of covetousness, and make them rulers over thousands, rulers of hundreds, rulers of fifties, and rulers of tens, to judge the people at all seasons.” [Exodus 18:21] Four things the Lord requireth in a good governor. First, that he be a man of courage, of strength or force, that is, which hath ability to do the thing whereunto he is appointed. That ability consisteth in mind rather than in body. For it is required, that he be not a fool, but wise and skilful in that which he hath to do […]

In the second place that is set down, which indeed is the first; let him fear God, let him be religious, and not superstitious. No idolater preserveth the commonweal, but rather destroyeth it; and a wicked man defendeth not truth and true religion, but persecuteth and driveth them out of his jurisdiction. Let this magistrate of ours therefore be of the right religion, sound in faith, believing the word of God, and knowing that God is present among men and doth repay to whom he list according to their deserts. And for that cause Justinian, the emperor, in Novellis Constitutionib. 109, doth freely confess that all his help is of God; and that therefore it is convenient, that the making of all laws should depend upon him alone. […] And where the princes are God’s friends, and have often conference with God, there is hope that those commonwealths shall prosper and flourish. But, on the other side, there must needs be feared an unhappy end of that commonweal, where the enemies of God have the pre-eminence. Thirdly, there is required of him, which must be chosen and called to be magistrate, that he be true in word and deed, so that he be not found to be an hypocrite, a liar, a deceiver, a turncoat, nor one which out of one mouth doth blow both hot and cold; but faithful, simple, a plain dealer, and blameless. […]

Covetousness and greedy desire of bribes are the very plagues that choke good magistrates. By covetous men and takers of bribes law, judgment, liberty, justice, and the country itself, is set to sale and sold to the devil for money. And now, though in this place the Lord hath named only the most pestilent mischief of all other, yet there is no doubt but that he doth inclusively debar all other vices and evils of that sort, commanding them to be strange and far off from the good magistrate and godly governor. Those vices are pride, envy, anger, dicing, surfeiting, drunkenness, whoredom, adultery, and whatsoever else is like to these.

This place is made more manifest by conferring it with other places in the law of God. Moses, in Deuteronomy, saith to the people: “Bring men of wisdom, of understanding, and of an honest life, according to your tribes.” [Deuteronomy 1:13] Three things here again doth the wise man, Moses, require in them that are to be appointed magistrates in his commonweal. First, saith he, let them be wise. But the beginning of wisdom is the fear of the Lord. Let them therefore be ordained as magistrates, that are friends to God and true religion; let them be wise, and not foolish idiots. Secondarily, they must be men of understanding; that is, men of experience, who by long and continual exercise in handling of matters are able at the first brunt to deal in all cases according to the law. Lastly, they must be men of honest report, whose life and sound conversation are by their deeds perfectly tried and sufficiently witnessed of unto the people: and finally, they must be such as bear authority, and not be despised as rascal and vile knaves.</p></blockquote>

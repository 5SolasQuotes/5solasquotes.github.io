<main class="wrap"><figure class="quote" id="q-3f7c64d641" data-kw="">
<blockquote><p>He bore the sins of many, and prayed for the transgressors, that they might not perish. But they cannot perish for whom the Son prays, and for whom the Father delivers His own Son to procure them life. From both, therefore, equally may we hope for pardon, because in both are equal mercy and compassion, equal power, one will, one substance in Godhead, wherein with them the Holy Ghost liveth and reigneth one God for ever and ever. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-of-clairvaux.html">Bernard of Clairvaux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons of St. Bernard on Advent &amp; Christmas including the Famous Treatise on the Incarnation called “Missus Est”</cite>, ed. J. C. Hedley (1508; London: Paternoster, 1909), p. 60.</span></figcaption>

<blockquote><p>III. The same controversy was afterwards renewed among the Romanists, some of whom defended the universality of redemption (with the Semipelagians), others its particularity (with Augustine and his genuine disciples). This controversy lay principally between the Jesuits and Jansenists, of whom the former (an offshoot of the Pelagians) warmly contend for the universality of Christ’s death, while the latter with great firmness defend its particularity, following their founder, Jansen, who has argued this subject very largely and with great solidity in his Augustinus (‘De Gratia Christi Salvatoris,’ 3.20 [1640/1964]. pp. 369-80), his Apologia Jansenii published in 1644, Art. 17,19,20+ and in Catechismo de Gratia, c. 7, de Predesti. q. 65+.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, Question 14, p. 456</span></figcaption>

</figure><figure class="quote" id="q-1992b163a2" data-kw="">
<blockquote><p>For do we not believe that Christ had indeed Man’s bones; and therefore such as of their own nature might at any time have been broken; and yet indeed they could not be broken, for that it was otherwise decreed by God: There­fore by hap and chance, concerning their own nature they were not bro­ken; when as notwithstanding they were such as might have been broken, and yet by God’s Decree they remained of necessity unbroken. Again, that Christ from the very time that he took upon him our Human nature was endued with a Mortal body, all Christians do confess; therefore of his own nature he might have been slain by Herod, with the other little Children; but by God’s Decree he could not:

Therefore that he was not then slain, fell out by hap and chance, if you consider the nature of his Body, when as it might have chanced otherwise: But, by God’s Decree, he could no more be slain by Herod, than the will of God could be chan­ged. Christ when he was carried to be crucified, was then undoubtedly of such health, that he needed not at that time to have died; he died there­fore by chance, if you do consider the cause of his Natural death; and yet be died of necessity, if you look to the unchangeable appointment of his Father, because his hour was come: and withal he died willingly, be­cause he laid down his Life for us. Thus far therefore is neither chance nor will repugnant unto the most certain Decree of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A learned treatise of the plague wherein the two questions, whether the plague be infectious or no, and, whether and how far it may be shunned of Christians by going aside, are resolved. Written in Latin</cite>, (London: Thomas Ratcliffe, 1665), pp 10-11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

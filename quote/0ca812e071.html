<main class="wrap"><figure class="quote" id="q-0ca812e071" data-kw="">
<blockquote><p>To these may be added dances (but the dances of pious girls must be separate from the dances of young boys) which may be danced to pure and holy songs (Plato, Laws II, 654 ff.), with chaste and modest motion befitting those who profess piety, as Miriam, the sister of Moses, danced and the matrons of Israel when they had crossed the Red Sea and sang the praises of God for such a wonderful delivery of their nation from the slavery of Egypt (Ex. 15:20-21). Such was the dance of the holy girls who celebrated David and Saul in a song of victory when they returned from the slaughter of the Philistines (1 Sam. 18:6), the kind of dance the Holy Spirit requires in Ps. 149:3 and 150:4 when he says, ‘Praise the Lord with timbrel and dance.’ … In pious singing, therefore, we are reminded of these gifts from such an immense goodness of God. And should the spirit not rightly leap with joy and gladness and excite the body to bear witness to this joy and impel it to express this gladness, by action, however, becoming to every age and nation? Certainly a deeper recollection of divine blessings strongly moved David, although he was a king, when he was bringing in the Ark of the Lord, so that he danced before it (II Sam. 6:12-15). He was a Palestinian, I admit, of a nation far more emotional and uninhibited than our European people. But since our young people delight in dancing, why are such dances not introduced among us too, who have become citizens of heaven through the blood of Christ, so that they spring forth from a pious and holy exultation of the mind over the goodness of God and strengthen and increase that exultation and inflame the spirit with a desire for all piety? … For this reason, no singing nor any kind of dancing should be allowed, either privately or publicly, which has not been approved by wise and religious men to whom this responsibility will be referred by Your Majesty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Reign of Christ, bk. 2, ch. 54, ‘Honest Games’ in Melanchthon &amp; Bucer, ed. Wilhelm Pauck (Philadelphia: Westminster Press, 1969), pp. 347-48</span></figcaption>

<blockquote><p>But those [leading presbyterian and congregationalist ministers] that were called by the king, and one another, 1660 and 1661, to treat of concord, and that assembled at Sion College, and elsewhere about it, did openly make known their minds: And I think they meddled not against any of these things following, by any accusation of them as sinful: … XIX. We never thought that things indifferent do become unlawful to us because the magistrate commands them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689), pp. 11-13</span></figcaption>

</figure><figure class="quote" id="q-75f12122c0" data-kw="">
<blockquote><p>…I will set down a catalogue of inventions of men used for religious ends and uses without any commandment of God, and that both before the Law and under the Law, and under the Gospel. First, before the Law we read of these things: The laying of the hand under the thigh in swearing, Gen. 24, etc. [Gen. 24:26, “And the man bowed down his head, and worshipped the Lord.”] Jacob’s pillar erected, as a religious monument, Gen. 28:18. Secondly, under the Law we read of these instances: [Josh. 7:6, “And Joshua rent his clothes, and fell to the earth upon his face before the ark of the Lord until the eventide, he and the elders of Israel, and put dust upon their heads.”] The altar of the two tribes and a half, Josh. 22:10 &amp; 27:30. [Josh. 24:25-27, “So Joshua made a covenant with the people that day, and set them a statute and an ordinance in Shechem. And Joshua wrote these words in the book of the law of God, and took a great stone, and set it up there under an oak, that was by the sanctuary of the Lord. And Joshua said unto all the people, Behold, this stone shall be a witness unto us; for it hath heard all the words of the Lord which he spake unto us: it shall be therefore a witness unto you, lest ye deny your God.] [1 Sam. 7:5-6, “Samuel said, Gather all Israel to Mizpeh, and I will pray for you unto the Lord. And they gathered together to Mizpeh, and drew water, and poured it out before the Lord, and fasted on that day, and said there, ‘We have sinned against the Lord.&#x27;”] David’s dancing and playing on all sorts of instruments and songs before the ark, 1 Chron. 13:8 and 15:16 and 2 Sam. 6:14. David’s wearing of a linen ephod, the garment of the Levites, 1 Chron. 15:27. David’s appointing of the offices of the Levites and his bringing in of the new order of singing men into the Temple, 1 Chron. 24 &amp; 25. The use of sackcloth and ashes in fasting. Solomon built another altar besides the altar of the Lord, 2 Chron. 7:7. Hezekiah kept the Passeover at a time not appointed by the Law, and the people kept it seven days longer, 2 Chron. 30:2-3, 23. About the celebration of the Passover, it is manifest that the godly Jews brought in of their own heads:

1. The gesture of sitting, which Christ Himself also used.

2. The solemn use of the cup, of which mention is made also that Christ used it, Lk. 22:17. The Rechabites abstinence not only from wine (according to the Law of the Nazarites), but from husbandry and houses, Jer. 35. The Jews had everywhere synagogues, which were not commanded by the Law, Lk. 7:5. [Jer. 34:18-19, “And I will give the men that have transgressed my covenant, which have not performed the words of the covenant which they had made before me, when they cut the calf in twain, and passed between the parts thereof, The princes of Judah, and the princes of Jerusalem, the eunuchs, and the priests, and all the people of the land, which passed between the parts of the calf;”] Mordecai appointed the feasts of Pur, or ‘lots’. Judas Maccabeus appointed the feast of Tabernacles, which our Saviour graced with his presence [Jn. 7:2]. Thirdly, under the Gospel: Our Savior Christ approved the gesture of sitting and the cup at the Passover, the Jewish synagogues, and the feast of Tabernacles. The apostle Paul used the Jewish ceremonies when they were no more the ordinances of God, as circumcision, shaving the head, purifying, vowing, contributing, yea sacrificing, Acts 21. Abstaining from meat sacrificed to idols. The observation of the Jewish Sabbath. The women’s coverings, 1 Cor. 11. The love-feasts. The holy kiss.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“…I will set down a catalogue of inventions of men used for religious ends and uses without any commandment of God, and that both before the Law and under the Law, and under the Gospel. First, before the Law we read of these things: The laying of the hand under the thigh in swearing, Gen. 24, etc. [Gen. 24:26, “And the man bowed down his head, and worshipped the Lord.”] Jacob’s pillar erected, as a religious monument, Gen. 28:18. Secondly, under the Law we read of these instances: [Josh. 7:6, “And Joshua rent his clothes, and fell to the earth upon his face before the ark of the Lord until the eventide, he and the elders of Israel, and put dust upon their heads.”] The altar of the two tribes and a half, Josh. 22:10 &amp; 27:30. [Josh. 24:25-27, “So Joshua made a covenant with the people that day, and set them a statute and an ordinance in Shechem. And Joshua wrote these words in the book of the law of God, and took a great stone, and set it up there under an oak, that was by the sanctuary of the Lord. And Joshua said unto all the people, Behold, this stone shall be a witness unto us; for it hath heard all the words of the Lord which he spake unto us: it shall be therefore a witness unto you, lest ye deny your God.] [1 Sam. 7:5-6, “Samuel said, Gather all Israel to Mizpeh, and I will pray for you unto the Lord. And they gathered together to Mizpeh, and drew water, and poured it out before the Lord, and fasted on that day, and said there, ‘We have sinned against the Lord.&#x27;”] David’s dancing and playing on all sorts of instruments and songs before the ark, 1 Chron. 13:8 and 15:16 and 2 Sam. 6:14. David’s wearing of a linen ephod, the garment of the Levites, 1 Chron. 15:27. David’s appointing of the offices of the Levites and his bringing in of the new order of singing men into the Temple, 1 Chron. 24 &amp; 25. The use of sackcloth and ashes in fasting. Solomon built another altar besides the altar of the Lord, 2 Chron. 7:7. Hezekiah kept the Passeover at a time not appointed by the Law, and the people kept it seven days longer, 2 Chron. 30:2-3, 23. About the celebration of the Passover, it is manifest that the godly Jews brought in of their own heads:

1. The gesture of sitting, which Christ Himself also used.

2. The solemn use of the cup, of which mention is made also that Christ used it, Lk. 22:17. The Rechabites abstinence not only from wine (according to the Law of the Nazarites), but from husbandry and houses, Jer. 35. The Jews had everywhere synagogues, which were not commanded by the Law, Lk. 7:5. [Jer. 34:18-19, “And I will give the men that have transgressed my covenant, which have not performed the words of the covenant which they had made before me, when they cut the calf in twain, and passed between the parts thereof, The princes of Judah, and the princes of Jerusalem, the eunuchs, and the priests, and all the people of the land, which passed between the parts of the calf;”] Mordecai appointed the feasts of Pur, or ‘lots’. Judas Maccabeus appointed the feast of Tabernacles, which our Saviour graced with his presence [Jn. 7:2]. Thirdly, under the Gospel: Our Savior Christ approved the gesture of sitting and the cup at the Passover, the Jewish synagogues, and the feast of Tabernacles. The apostle Paul used the Jewish ceremonies when they were no more the ordinances of God, as circumcision, shaving the head, purifying, vowing, contributing, yea sacrificing, Acts 21. Abstaining from meat sacrificed to idols. The observation of the Jewish Sabbath. The women’s coverings, 1 Cor. 11. The love-feasts. The holy kiss.”

— Nicholas Byfield, A Commentary: or Sermons upon the Second Chapter of the First Epistle of Saint Peter, ... (London, 1623), on 1 Pet. 2:13, pp. 588-90">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6I+will+set+down+a+catalogue+of+inventions+of+men+used+for+religious+ends+and+uses+without+any+commandment+of+God%2C+and+that+both+before+the+Law+and+under+the+Law%2C+and+under+the+Gospel.+First%2C+before+the+Law+we+read+of+these+things%3A+The+laying+of+the+hand+under+the+thigh+in+swearing%2C+Gen.+24%2C+etc.+%5BGen.+24%3A26%2C+%E2%80%9CAnd+the+man+bowed+down+his+head%2C+and+worshipped+the+Lord.%E2%80%9D%5D+Jacob%E2%80%99s+pillar+erected%2C+as+a+religious+monument%2C+Gen.+28%3A18.+Secondly%2C+under+the+Law+we+read+of+these+instances%3A+%5BJosh.+7%3A6%2C+%E2%80%9CAnd+Joshua+rent+his+clothes%2C+and+fell+to+the+earth+upon+his+face+before+the+ark+of+the+Lord+until+the+eventide%2C+he+and+the+elders+of+Israel%2C+and+put+dust+upon+their+heads.%E2%80%9D%5D+The+altar+of+the+two+tribes+and+a+half%2C+Josh.+22%3A10+%26+27%3A30.+%5BJosh.+24%3A25-27%2C+%E2%80%9CSo+Joshua+made+a+covenant+with+the+people+that+day%2C+and+set+them+a+statute+and+an+ordinance+in+Shechem.+And+Joshua+wrote+these+words+in+the+book+of+the+law+of+God%2C+and+took+a+great+stone%2C+and+set+it+up+there+under+an+oak%2C+that+was+by+the+sanctuary+of+the+Lord.+And+Joshua+said+unto+all+the+people%2C+Behold%2C+this+stone+shall+be+a+witness+unto+us%3B+for+it+hath+heard+all+the+words+of+the+Lord+which+he+spake+unto+us%3A+it+shall+be+therefore+a+witness+unto+you%2C+lest+ye+deny+your+God.%5D+%5B1+Sam.+7%3A5-6%2C+%E2%80%9CSamuel+said%2C+Gather+all+Israel+to+Mizpeh%2C+and+I+will+pray+for+you+unto+the+Lord.+And+they+gathered+together+to+Mizpeh%2C+and+drew+water%2C+and+poured+it+out+before+the+Lord%2C+and+fasted+on+that+day%2C+and+said+there%2C+%E2%80%98We+have+sinned+against+the+Lord.%27%E2%80%9D%5D+David%E2%80%99s+dancing+and+playing+on+all+sorts+of+instruments+and+songs+before+the+ark%2C+1+Chron.+13%3A8+and+15%3A16+and+2+Sam.+6%3A14.+David%E2%80%99s+wearing+of+a+linen+ephod%2C+the+garment+of+the+Levites%2C+1+Chron.+15%3A27.+David%E2%80%99s+appointing+of+the+offices+of+the+Levites+and+his+bringing+in+of+the+new+order+of+singing+men+into+the+Temple%2C+1+Chron.+24+%26+25.+The+use+of+sackcloth+and+ashes+in+fasting.+Solomon+built+another+altar+besides+the+altar+of+the+Lord%2C+2+Chron.+7%3A7.+Hezekiah+kept+the+Passeover+at+a+time+not+appointed+by+the+Law%2C+and+the+people+kept+it+seven+days+longer%2C+2+Chron.+30%3A2-3%2C+23.+About+the+celebration+of+the+Passover%2C+it+is+manifest+that+the+godly+Jews+brought+in+of+their+own+heads%3A+1.+The+gesture+of+sitting%2C+which+Christ+Himself+also+used.+2.+The+solemn+use+of+the+cup%2C+of+which+mention+is+made+also+that+Christ+used+it%2C+Lk.+22%3A17.+The+Rechabites+abstinence+not+only+from+wine+%28according+to+the+Law+of+the+Nazarites%29%2C+but+from+husbandry+and+houses%2C+Jer.+35.+The+Jews+had+everywhere+synagogues%2C+which+were+not+commanded+by+the+Law%2C+Lk.+7%3A5.+%5BJer.+34%3A18-19%2C+%E2%80%9CAnd+I+will+give+the+men+that+have+transgressed+my+covenant%2C+which+have+not+performed+the+words+of+the+covenant+which+they+had+made+before+me%2C+when+they+cut+the+calf+in+twain%2C+and+passed+between+the+parts+thereof%2C+The+princes+of+Judah%2C+and+the+princes+of+Jerusalem%2C+the+eunuchs%2C+and+the+priests%2C+and+all+the+people+of+the+land%2C+which+passed+between+the+parts+of+the+calf%3B%E2%80%9D%5D+Mordecai+appointed+the+feasts+of+Pur%2C+or+%E2%80%98lots%E2%80%99.+Judas+Maccabeus+appointed+the+feast+of+Tabernacles%2C+which+our+Saviour+graced+with+his+presence+%5BJn.+7%3A2%5D.+Thirdly%2C+under+the+Gospel%3A+Our+Savior+Christ+approved+the+gesture+of+sitting+and+the+cup+at+the+Passover%2C+the+Jewish+synagogues%2C+and+the+feast+of+Tabernacles.+The+apostle+Paul+used+the+Jewish+ceremonies+when+they+were+no+more+the+ordinances+of+God%2C+as+circumcision%2C+shaving+the+head%2C+purifying%2C+vowing%2C+contributing%2C+yea+sacrificing%2C+Acts+21.+Abstaining+from+meat+sacrificed+to+idols.+The+observation+of+the+Jewish+Sabbath.+The+women%E2%80%99s+coverings%2C+1+Cor.+11.+The+love-feasts.+The+holy+kiss.%E2%80%9D%0A%0A%E2%80%94+Nicholas+Byfield%2C+A+Commentary%3A+or+Sermons+upon+the+Second+Chapter+of+the+First+Epistle+of+Saint+Peter%2C+...+%28London%2C+1623%29%2C+on+1+Pet.+2%3A13%2C+pp.+588-90&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F75f12122c0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/75f12122c0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=I%20will%20set%20down%20a%20catalogue,11.%20The%20love%2Dfeasts.%20The%20holy%20kiss&amp;text=I%20will%20set%20down%20a%20catalogue%20of%20inventions&amp;text=1%20Cor.%2011.%20The%20love%2Dfeasts.%20The%20holy%20kiss" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

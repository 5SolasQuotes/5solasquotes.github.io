<blockquote><p>11. What is the view of this subject entertained by the French Protestant theologians, Camero, Amyraut, and others? These theological professors at Saumur, during the second quarter of the seventeenth century, taught that God, 1st. Decreed to create man. 2d. To permit man to fall. 3d.To provide, in the mediation of Christ, salvation for all men. 4th. But, foreseeing that if men were left to themselves none would repent and believe, therefore he sovereignly elected some to whom he decreed to give the necessary graces of repentance and faith. The new school theology of America, as far as it relates to the decrees of God, is only a revival of this system. It differs from the Calvinistic view in making the decree of redemption precede the decree of election. It differs from the Arminian view in regarding the sovereign good pleasure of God, and not foreseen faith, the ground of election. The objection to this view is, that it is an essential element in that radically false view of the atonement called the governmental theory.—See Chapter XXII., questions 6, 7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology</cite>, (New York: Robert Carter &amp; Brothers, 1863), 178–79.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-90d8795383" data-kw="">
<blockquote><p>John Cameron [the teacher of Amyraut] set the tendency in motion which in different lands has tried to mediate between the consistent scheme of the Reformed Faith and the Arminianism which was set aside by the findings of the Synod of Dordt… The issues of his mongrel compromising teaching were far reaching. The church of his adoption felt the effects of his teaching to such an extent as that the Theology of the later Huguenots was to a large extent revolutionised. Their influence in turn told on Richard Baxter and on all the varieties of teaching that can be traced back to his type of doctrine. It affected the thinking of New England; and as a return tide on its way back over the Atlantic it determined the teaching of the English Edwardians, both Independent and Baptist. The force of the current that was thus changing the older Calvinism beat at last on the Reformed teaching of Scotland in circles other than those of the Neonomians. It found more channels than one in which to flow. New England Revivalism did its share of the work; and the influence of modern Calvinism in English Nonconformity also contributed its quota. Along with the disintegrating work of the New Light movement, which was of home [i.e., Scottish] growth and which spoke of an uneasy spirit of dissatisfaction with long accepted truth and of a restlessness that was in quest of something new, the various streams of influence that derived remotely from Cameron are responsible for the collapse of the Confessional orthodoxy which had for ages found a home in his native country.</p></blockquote>

<blockquote><p>Secondly I answer that we do acknowledge with glad minds that Christ died for all (the scripture averring so much): but we utterly deny that He died for all and everyone alike in respect of God, or, as well for the damned as elect, and that effectually on God’s part. For first lets weigh well the words of Christ: ‘I never knew you: depart from Me ye workers of iniquity.’ (Mt. 7:25) Now to know with God is to acknowledge; and therefore, whom Christ never knew, He never acknowledged for his. And those whom He has not sometime acknowledged, He never bought or redeemed with the price of his blood. And therefore well says Gregory: ‘Not to know with God is to reject.’ Again, if all and every one be effectually redeemed, all and every one are reconciled unto God, because that the forgiveness of sins and the satisfaction for the same are inseparably joined together. Yea and Paul places redemption in the remission of sins where he says: ‘By whom we have redemption through his blood, even the forgiveness of sins.’ (Eph. 1:7 &amp; Col. 1:14) Very well therefore says Prosper (bk. 1, Response for Augustine, Objection 9): ‘As it is not sufficient for the renewing of men, that Christ Jesus was born man, unless they be renewed also in the same spirit, whereof He was born: so it is not sufficient for man’s redemption that Christ Jesus was crucified, unless we die together and be buried with Him in baptism.’ Of these premises therefore I frame this assumption: But all are not reconciled unto God, neither do all receive remission of sins: for then all men were blessed (Ps. 32:1); and it were not possible for them to perish: which thing to affirm of all and every one, is very gross. Thirdly, Christ gave Himself that He might sanctify unto Himself a people peculiar (Tit. 2:14), that is, as a precious treasure and his own gotten good selected and chosen from among other: therefore it was not Christ’s purpose to give Himself for a ransom for all and every one alike. Fourthly, for whom redemption it [was] ordained, to them all is given on God’s part the making of them sons by Christ: but the making of sons, or adoption is not granted to all and every one, even on God’s part… Fifthly: None are truly redeemed on God’s part, but they who are freed from sin, both according to the power that it has to cause damnation, and also according to the power that it has to reign in them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian &amp; Plain Treatise of the Manner &amp; Order of Predestination &amp; of the Largeness of God’s Grace</cite>, (d. 1602: London: Welby &amp; Clarke, 1606) | 4th Crimination, pp. 82-83</span></figcaption>

<blockquote><p>VIII. We do very much differ from this opinion [of Arminians]: We acknowledge that Christ died for all; but we deny that by his death salvation and forgiveness of sin is obtained for all men: or that reconciliation is made for Cain, Pharaoh, Saul, Judas, etc. Neither do we think that remission of sins is obtained for anyone whose sins are not remitted, or that salvation was purchased for him, whom God from eternity has decreed to condem: For this were a vaine purchase. We deny that election is after the death of Christ, as for many other causes, so also because Christ in the very agony of death gave a notable proof of election in the thief, whose heart He affected, and enlightned his mind after an unutterable manner; the other thief being left and neglected. And seeing Christ does everywhere say that He died for his sheep, and for those whom his Father gave Him, He does sufficiently declare that He died for the elect.

IX. And when we say that Christ died for all, we take it thus, to wit, that the death of Christ is sufficient to save whosoever do believe, yea, and that it is sufficient to save all men, if all men in the whole world did believe in Him: And that the cause why all men are not saved, is not in the insufficiency of the death of Christ, but in the wickedness and incredulity of man. Finally Christ may be said to reconcile all men to God by his death after the same manner that we say that the sun does enlighten the eyes of all men, although many are blind, many sleep, and many are hid in darkeness: Because if all and several men had their eyes and were awake, and were in the midst of the light, the light of the sun were sufficient to enlighten them. Neither is it any doubt but that it may be said, not only that Christ died for all men, but also that all men are saved by Christ, because among men, there is none saved but by Christ: After the same manner that the apostle says, 1 Cor. 15:20, that all men are made alive by Christ, because no man is made alive but by Him.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“VIII. We do very much differ from this opinion [of Arminians]: We acknowledge that Christ died for all; but we deny that by his death salvation and forgiveness of sin is obtained for all men: or that reconciliation is made for Cain, Pharaoh, Saul, Judas, etc. Neither do we think that remission of sins is obtained for anyone whose sins are not remitted, or that salvation was purchased for him, whom God from eternity has decreed to condem: For this were a vaine purchase. We deny that election is after the death of Christ, as for many other causes, so also because Christ in the very agony of death gave a notable proof of election in the thief, whose heart He affected, and enlightned his mind after an unutterable manner; the other thief being left and neglected. And seeing Christ does everywhere say that He died for his sheep, and for those whom his Father gave Him, He does sufficiently declare that He died for the elect.

IX. And when we say that Christ died for all, we take it thus, to wit, that the death of Christ is sufficient to save whosoever do believe, yea, and that it is sufficient to save all men, if all men in the whole world did believe in Him: And that the cause why all men are not saved, is not in the insufficiency of the death of Christ, but in the wickedness and incredulity of man. Finally Christ may be said to reconcile all men to God by his death after the same manner that we say that the sun does enlighten the eyes of all men, although many are blind, many sleep, and many are hid in darkeness: Because if all and several men had their eyes and were awake, and were in the midst of the light, the light of the sun were sufficient to enlighten them. Neither is it any doubt but that it may be said, not only that Christ died for all men, but also that all men are saved by Christ, because among men, there is none saved but by Christ: After the same manner that the apostle says, 1 Cor. 15:20, that all men are made alive by Christ, because no man is made alive but by Him.”

— Pierre Du Moulin, The Anatomy of Arminianism, … (1619; London, 1635), ch. 27, ‘How far, and in what sense Christ died for all’, pp. 226-28">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVIII.+We+do+very+much+differ+from+this+opinion+%5Bof+Arminians%5D%3A+We+acknowledge+that+Christ+died+for+all%3B+but+we+deny+that+by+his+death+salvation+and+forgiveness+of+sin+is+obtained+for+all+men%3A+or+that+reconciliation+is+made+for+Cain%2C+Pharaoh%2C+Saul%2C+Judas%2C+etc.+Neither+do+we+think+that+remission+of+sins+is+obtained+for+anyone+whose+sins+are+not+remitted%2C+or+that+salvation+was+purchased+for+him%2C+whom+God+from+eternity+has+decreed+to+condem%3A+For+this+were+a+vaine+purchase.+We+deny+that+election+is+after+the+death+of+Christ%2C+as+for+many+other+causes%2C+so+also+because+Christ+in+the+very+agony+of+death+gave+a+notable+proof+of+election+in+the+thief%2C+whose+heart+He+affected%2C+and+enlightned+his+mind+after+an+unutterable+manner%3B+the+other+thief+being+left+and+neglected.+And+seeing+Christ+does+everywhere+say+that+He+died+for+his+sheep%2C+and+for+those+whom+his+Father+gave+Him%2C+He+does+sufficiently+declare+that+He+died+for+the+elect.+IX.+And+when+we+say+that+Christ+died+for+all%2C+we+take+it+thus%2C+to+wit%2C+that+the+death+of+Christ+is+sufficient+to+save+whosoever+do+believe%2C+yea%2C+and+that+it+is+sufficient+to+save+all+men%2C+if+all+men+in+the+whole+world+did+believe+in+Him%3A+And+that+the+cause+why+all+men+are+not+saved%2C+is+not+in+the+insufficiency+of+the+death+of+Christ%2C+but+in+the+wickedness+and+incredulity+of+man.+Finally+Christ+may+be+said+to+reconcile+all+men+to+God+by+his+death+after+the+same+manner+that+we+say+that+the+sun+does+enlighten+the+eyes+of+all+men%2C+although+many+are+blind%2C+many+sleep%2C+and+many+are+hid+in+darkeness%3A+Because+if+all+and+several+men+had+their+eyes+and+were+awake%2C+and+were+in+the+midst+of+the+light%2C+the+light+of+the+sun+were+sufficient+to+enlighten+them.+Neither+is+it+any+doubt+but <blockquote><p>The truth is, we deny that Christ died for all, in as much as he died not to procure the grace of faith and regeneration for all, but only for Gods elect; and consequently neither shall any but God’s elect have any such interest in Christ’s death, as to obtain thereby pardon of sin and salvation, for Arminians themselves confess that this is the portion only of believers. But seeing pardon of sin and salvation are benefits merited by Christ, not to be conferred absolutely but conditionally, to wit, upon condition of faith; we may be bold to say that Christ in some sense died for all and every one, that is, he died to procure remission of sins and salvation unto all and every one in case they believe; and as this is true, so may we well say, and the Council of Dort might well say, that every one who hears the Gospel is bound to believe that Christ died for him in this sense, namely, to obtain salvation for him in case he believe. But what think Arminians; are we bound to believe that Christ died for us in such a sense, as to purchase faith and regeneration for us?</p></blockquote>

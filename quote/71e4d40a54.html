<blockquote><p>For unto us a Child is born, unto us a Son is given; and the government will be upon His shoulder. And His name will be called Wonderful, Counselor, Mighty God, Everlasting Father, Prince of Peace.” (Isaiah 9:6)

Now, to apply this for our own instruction, whenever any distrust arises, and all means of escape are taken away from us, whenever, in short, it appears to us that everything is in a ruinous condition, let us recall to our remembrance that Christ is called Wonderful, because he has inconceivable methods of assisting us, and because his power is far beyond what we are able to conceive.

When we need counsel, let us remember that he is the Counsellor. When we need strength, let us remember that he is Mighty and Strong. When new terrors spring up suddenly every instant, and when many deaths threaten us from various quarters, let us rely on that eternity of which he is with good reason called the Father, and by the same comfort let us learn to soothe all temporal distresses.

When we are inwardly tossed by various tempests, and when Satan attempts to disturb our consciences, let us remember that Christ is The Prince of Peace, and that it is easy for him quickly to allay all our uneasy feelings. Thus will these titles confirm us more and more in the faith of Christ, and fortify us against Satan and against hell itself.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-80ae4e92ec" data-kw="">
<blockquote><p>In the dispute which resulted in the schism of 1840 over the civil magistrate’s power circa sacra, it was alleged that Thomas Houston was arguing for the entire judicial law to be upheld by the Christian ruler. This was a complete straw-man, yet, in modern debates over Theonomy, we hear this very same straw-man repeated again and again. No matter how many times you tell people that this is not the case, they persist in spreading such misrepresentation. Instead, our position is that the judicial laws which are part of the moral law continue to oblige all nations; as Dr Houston puts it:

Again, the authors of the Declinature obviously represent Mr. Houston, as teaching that the whole Judicial Code is still obligatory on Christian civil rulers, whereas, even in the passages which they have quoted, the writer limits the laws, as do the eminent Divines, to those which guard the Decalogue, which are moral in their nature, and which are susceptible of application, to nations in different ages, and under every dispensation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenanter’s narrative and plea: exhibiting the error, schism, radicalism, and slander of Dr. Paul, and other separatists from the Reformed Presbyterian Church</cite>, (Belfast, 1841), pp 102-03.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>I grant and confess, that faith is God’s gift in the heart of man, which God alone doth search and know. But men are judged by their words and deeds. Admit, therefore, that the erroneous opinion of the mind may not be punished; yet notwithstanding, wicked and infective profession and doctrine must in no wise be suffered. Verily, no man doth in this world punish profane and wicked thoughts of the mind: but if those thoughts break forth into blasphemous words, then are those blaspheming tongues to be punished of good princes.

And yet by this I say not, that godliness lieth in the magistrate to give and bestow. Justice is the very gift of God, which none but God doth give to men: but who is so foolish as to gather thereupon, that unjust men, robbers, murderers, and witches are not to be punished, because the magistrate by punishment cannot bestow righteousness upon unrighteous people?

We must therefore make a difference betwixt faith, as it is the gift of God in the heart of man, and as it is the outward profession uttered and declared before the face of men. For while false faith doth lurk and lie hid within the heart, and infecteth none but the unbeliever, so long the unbelieving infidel cannot be punished: but if this false and forged faith, that so lay hid, do once break forth to blaspheme, to the open tearing of God and the infecting of his neighbours, then must that blasphemer be by and by plucked under, and kept from creeping to further annoyance. Not to suppress such a fellow as this, is to put a sword in a madman’s hand to kill unwise and weakly men.

Faith is the gift of God; but, where he bestoweth faith, he useth means to give it by: those means he will not have us to neglect. An householder knoweth that faith is the gift of God; and yet notwithstanding, he instructeth his children in the word of truth, he chargeth them to go to church, to pray for faith, and to learn it at the preacher’s mouth. A good father would think much, yea, he would not think well of it, if his son should say: Father, I pray you, teach me not, send me not so much to church, and beat me not if I be not there; for faith is the gift of God, which whipping cannot bring me to. Then what man can quietly abide to hear that faith is the gift of God, and that therefore no man ought for faith, that is, for the corruption of faith and open blasphemy, to suffer any punishment?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids MI: Reformation Heritage Books, 2004), 1: 363-64.</span></figcaption>

</figure><figure class="quote" id="q-c0b1b369f1" data-kw="">
<blockquote><p>This external inspection and administration of the magistrate, in reference to religion, is twofold.

1. Corrective, by external punishments.

2. Auxiliary, by external benefits and adminicles. The magistrate may and ought to be both custos et vindex utrisuque tabulae, he ought to preserve both the first and second table of the holy and good law of God, from being despised and violated, and punish by corporal or other temporal punishments, such (whether church officers or church members) as openly dishonour God by gross offences, either against the first or against the second table; and this he doth as God’s deputy and vicegerent, subordinate and subservient to that universal dominion which God Almighty exerciseth over the children of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming; or, the Divine Ordinance of Church Government Vindicated</cite>, (1646; Edinburgh, 1844), p. 122.</span></figcaption>

<blockquote><p>Thus of the producing of the body of Christ: His soul was produced as the souls of other men are, that is, it was immediately created by the Holy Ghost and infused into his body: only there is difference amongst divines about the time of the infusing of the soul of Christ: for in the ordinary course, nature proceeds in this manner: First, there is the mass of blood or seed received in the womb, but there is no parts of a body framed at the first: after a certain number of weeks, nature forms that substance into the parts of the body distinctly, but yet it is without life: then is the soul infused, when the body is organical, and so it is quickened and a true man; it is not before a man, but embryo as they call it: Now the question is how Christ could receive that imperfect embryo or the flesh at the first conception, seeing it was not a perfect human nature? To this some answer that our Savior did not follow the ordinary course of taking flesh, as other men do, but in the very instant of the conception, his body was made organical, and had perfect members, and the soul infused at that instant also: and their reason is this: Because the Son of God did not become a person to any thing but the manhood of Christ: Now the manhood must needs have a reasonable soul and body formed, and organical: else we must say that something did subsist in the Person of his divine nature that was not man, as embryo or the lump unformed, and not animated was. Besides, when God made a man by the power of the Holy Ghost, without the seed of man, He made him perfect at one instant, and every way formed in all parts: as when He made Adam and Eve, they were in an instant made perfect in soul and body. Other divines conceive that this opinion cannot be true, because Christ was made in all things like unto us, sin only excepted. Now there could be no sin in that ordinary course of nature, if original sin be removed as it was in Christ. Now in the course of nature: first, that which is material is formed, as it were the house of the soul, and then the soul is infused, not only as the guest of it, but as the form and life of it: and so it must be in Christ. Now for the first reason they answer that the hypostatical union in the person of Christ was so made above nature, as withal, Christ assumed that which belonged to the nature of man according to the course of nature: and so first the seed, and then the body formed, and the soul infused according to nature into that body so as that flesh before the coming in of the soul did subsist in the Word, as it did after the soul was infused: for the Word took our nature, which is not hindered by the absence or presence of the soul: as when Christ was dead, his soul was in his Father’s hands, and his flesh was shut up in the grave, and was not quickened then by the soul, yet the flesh of Christ without the soul and life did subsist in the Word, as well as it did before or after: The other reason is of no force, for God did not make our first parents so out of necessity, but out of the good pleasure of his will, not binding himself to that frame of working for all times afterwards.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-5381489010" data-kw="">
<blockquote><p>Before I come to the consideration of these words, a doubt must be resolved. For some men may say that this is epistle is corrupted because these words are wanting in sundry translations and editions of the Bible. And Jerome says that they were not found in the copies of the Bible in his days. Answer. In the editions and translations of the Bible, there are sundry differences and diversities of readings. And these differences are not the fault of the Scripture, but of the men which used to write out the Bible. For the Bible heretofore was spread abroad, not by printing, but by writing. Again, though in the books of the Bible there be sundry varieties of reading, yet the providence of God has so watched over the Bible that the sense thereof remains entire, sound, and incorrupt, specially in the grounds of religion. And not the words principally, but the sense is the Scripture. For whether these words be left in, or put out, the sense of the verse is one and the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley (Grand Rapids: Reformation Heritage Books, 2015), 146.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5a492649a0" data-kw="">
<blockquote><p>The authority of the Word is derived from the Word itself. The church cannot be the foundation upon which one believes that the Scriptures are the Word of God, for: First, the church derives all its authority from the Word. … Thus, we do not believe the Word to be the Word of God because the church affirms it, but on the contrary, we believe the church to be the true church because the Word validates her as such.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, vol. 1, ch. 2, p. 29</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/divine-authority.html">Divine Authority</a> › <a href="../topics/holy-scripture/divine-authority/self-authentication.html">Self-authentication</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span></div>

</figure><figure class="quote" id="q-8292d341b5" data-kw="">
<blockquote><p>I do not doubt that the most ancient fathers, to whom the coming night was the end of one day and the beginning of another, followed this mode of reckoning. Although Moses did not intend here to prescribe a rule which it would be criminal to violate; yet (as we have now said) he accommodated his discourse to the received custom. Wherefore, as the Jews foolishly condemn all the reckonings of other people, as if God had sanctioned this alone; so again are they equally foolish who contend that this modest reckoning, which Moses approves, is preposterous. The first day: Here the error of those is manifestly refuted, who maintain that the world was made in a moment. For it is too violent a cavil to contend that Moses distributes the work which God perfected at once into six days, for the mere purpose of conveying instruction. Let us rather conclude that God himself took the space of six days, for the purpose of accommodating his works to the capacity of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 1:5</span></figcaption>

</figure><figure class="quote" id="q-47ac56c75b" data-kw="perspicuity">
<blockquote><p>The question is not whether things essential to salvation are everywhere in the Scriptures perspicuously revealed. We acknowledge that there are some things hard to be understood (dysnoēta) and intended by God to exercise our attention and mental powers. The question is whether things essential to salvation are anywhere revealed, at least so that the believer can by close meditation ascertain their truth (because nothing can be drawn out of the more obscure passages which may not be found elsewhere in the plainest terms). As Augustine remarks: “Admirable and healthily the Spirit has so arranged the Scriptures that by the plainer passages he might meet our desires and by the obscurer remove our contempt” (CI 2.6 [FC 2:66; PL 34.39]); and, “We feed in the open places, we are exercised by the obscure; there hunger is driven away, here contempt” (Sermon 71, “De Verbis Domini,” 7.11 [PL 38.450]).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.17.5</span></figcaption>

</figure><figure class="quote" id="q-615059786d" data-kw="">
<blockquote><p>There is, brethren, one God, the knowledge of whom we gain from the Holy Scriptures, and from no other source. For just as a man if he wishes to be skilled in the wisdom of this world will find himself unable to get at it in any other way than by mastering the dogmas of philosophers, so all of us who wish to practice piety will be unable to learn its practice from any quarter than the oracles of God. Whatever things then the Holy Scriptures declare, at these let us look; and whatsoever things they teach these let us learn.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hippolytus.html">Hippolytus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Heresies</cite>, 9</span></figcaption>

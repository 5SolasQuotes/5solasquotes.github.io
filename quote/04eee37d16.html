<main class="wrap"><figure class="quote" id="q-04eee37d16" data-kw="">
<blockquote><p>Zaccheus desired only to see Christ, but now Christ calleth him by name, and offereth his own self unto him. This was more then Zaccheus expected, and yet no more than Christ vouchsafeth, namely, to give more than is desired. The sick of the palsy that asked health, obtained also forgiveness of sins (Lk. 5). Solomon desired wisdom, and the Lord gave him wisdom and abundance of wealth beside (1 Kings 3:12-13).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Sinner’s Conversion’ (London, 1594) on Lk.</cite>, 19:1-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<blockquote><p>§. 44. Direction 5. Make haste away from the occasions of thy sin, and the company which ensnares thee in it. If thou knewest that they were robbers that intended to murder thee, thou wouldst be gone: If thou knewest that they had plague sores running on them thou wouldst be gone: And wilt thou not be gone when thou knowest that they are the servants of the Devil, that would infect thee with sin, and cheat thee of thy salvation? Say not, Is not this company lawful, and that pleasure lawful? etc. If it be like to entice thy heart to sin, it is unlawful to thee, whatever it is to others: It is not lawful to undo thy soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology… (London, 1673)</cite>, p. 623</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-f02898842e" data-kw="">
<blockquote><p>Sept, 17, 1585 Lyttis of the deacons [servants] elected. Henry Nesbet and William Nesbet, bailies, Nicoll Uddert, Dean of Guild, James Ros, Thesaurer [Treasurer], William Littill, Androw Sclater, George Smyth, Tailor [Jailor?], of the Council, and Jhonn Stevinsoun, deykin [deacon/servant?] of the weavers, remembering that since the beginning of this present pestilence they have remained within this burgh constantly, sustained the burdening of the offices laid upon them unto this hour, with the loss and death for the most part of diverse of their children, servants, and family, and not without the extreme danger of their own lives, most eminently known unto all men, the rest of their brethren of the council and deykins [deacons/servants], which were no less astricted, oblist [obliged], and sworn to assist and take care of this commonwealth, having deserted their places and forsaken their offices, contrary to their oaths and allegiance made and given, and yet continuing has not repaired to this burgh at this most necessary time, approached and appointed to convene and surrogate others in their room, whereby the whole estate of this burgh is appearing to fall in confusion; Therefore…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/city-of-edinburgh.html">City of Edinburgh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Extracts from the Records: 1585, Jul-Sept’, in Extracts From the Records of the Burgh of Edinburgh, 1573-1589, ed. J D Marwick (Edinburgh, 1882), pp. 430-437. British History Online</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-097d771964" data-kw="">
<blockquote><p>Believe if ye will [as it is claimed by Romanists] that [Emperor] Constantine gave to the Popes of Rome freedom and immunity from the imperial laws… we teach no such kingly power given to Church-men, and judge this Donation [of Constantine] to be a forged lie, invented by Papists… 6. We do not teach that Church-men are loosed from the positive laws of emperors and kings. [The Romanist, Robert] Bellarmine says that the Magistrate can neither punish Church-men, nor convene them before the tribunal… And as he says, by divine law the Pope is eximed [exempt] from all laws of princes… And what they allege for Peter’s exemption from paying tribute, will exime all the disciples, and so all Church-men by divine right from the laws of princes. Yea all Clergy-men (say they) by a divine positive law are eximed from the laws of Magistrates… Paul will have every soul subject to superior powers, and except the Roman clergy want [lack] souls, they must also be subject. Solomon punished [the priest] Abiathar, Josiah burnt the bones of the priests upon the altar, Christ subjected Himself to his parents, payed tribute to Caesar, and commanded scribes and pharisees to do the like, Mt. 22, willing that they should give to Ceasar those things which are Caesar’s. Paul appealed to Caesar’s tribunal, and Rom. 13, as many as may do evil, as many as are in danger of resisting the power, are to be subject, Rom. 13:4. 2. but Church-men are such, therefore they are subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644), pt. 2, Appendix</cite>, p. 454</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-2cab605abf" data-kw="">
<blockquote><p>All the epistles written by the apostles are a breathing out of love to their flock, not caring to be spent upon them for their good, that they might get them brought forward and present them as chaste virgins to their bridegroom. Therefore, they style their people ‘dearly beloved,’ not using words of office or flattery, but of truth and affection. The hireling will flee, but the true shepherd will lay down his life for the sheep [John 10:11,15]. And if the pest [plague] were in the congregation, he would not leave them, but would go as near them as the Lord’s law, or preservation of his own life, would permit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon 10 of Sermons on Jeremiah’s Lamentations (RHB &amp; Naphtali Press) Probably from 1628, around the siege and final fall of La Rochelle, France.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

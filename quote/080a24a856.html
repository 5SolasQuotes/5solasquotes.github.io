<main class="wrap"><figure class="quote" id="q-080a24a856" data-kw="">
<blockquote><p>The righteousness by which we are justified and stand righteous before God, is not our own righteousness, but the righteousness of Christ, Phil. 3:8-9; 2 Cor. 5:21, not the righteousness of Christ as God the Second Person in Trinity, but as Mediator, God-man. In which there are two things:

1. The perfect holiness of his humane nature, Heb. 7:26.

2. The perfect righteousness which He performed in doing and suffering according to the Law, this is imputed to us. Christ’s active obedience, his good works and holy life could never have been meritorious for us, nor brought us to Heaven, if he had not died for us, therefore our justification and obtaining of heaven is ascribed to his blood, as if that alone had done both, Rom. 5:9; Heb. 10:19; Rev. 5:6, 9, 11; his intercession and prayers had not been meritorious for us, if he had not died for us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, A.M., 1654), bk. 7, ch. 6, ‘Of Justification’, pp. 513-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-87fde816b6" data-kw="">
<blockquote><p>Behold what can be desired more to make commutations of parties in public contracts authentic in courts of justice than consent of all parties, the allowance of the judge and public record? And if this self-same commutation of pennance must be allowed of by those who are for justification by way of satisfaction only,¹ why should it seem incongruous in this other branch of justification, sc. by imputed righteousness? Surely, God would have the active as well as the passive obedience, as near the same, required by the Law, as might be, that He might dispense with as little of the Law as was possible. ¹ Bellarmine, Of Justification, bk. 2, ch. 7, sect. 4; Stapleton, etc. Their own argument will serve to prove the necessity of imputation of Christ’s active obedience to the Law for justification, because, ‘Nothing,’ say they, ‘can satisfy for sin (which is an infinite wrong to God) but that only which is infinite in value.’ By the same reason nothing can give us right and title to eternal life (which is an infinite reward) but that which is of infinite worth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-case.html">Thomas Case</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Mount Pisgah</cite>, ... (London: Milbourn, 1670), pt. 2, 2nd Use, p. 152 with margin note</span></figcaption>

<blockquote><p>2. That which is exhibited whither by doing or suffering, or both in way of satisfaction and so accepted, being such as makes a plenary compensation for an offence formerly committed; because it utterly extinguishes and abolishes the wrong, so takes it away, as if it never had been; it justly procures a guiltlessness, a blamelessness unto the delinqent, in whose behalf it is performed; and makes him therefore to be reputed in the eye of law and justice, as now no delinqent, but as guiltless, faultless and just: there being no medium between these two just and unjust, nor between guiltless and just. See Dt. 25:1. This guiltlessness therefore is justly termed justice; and the party conseqently by plea thereof upon any emergent occasion may be truly justified, and such guiltlessness achieved by Christ’s satisfaction made to God’s Law and his justice, makes the party unto whom the same is imputed, and who has interest therein, truly named and justly deemed just, and to be in the state of justification, or in a justifiable condition, 2 Cor. 5:21; and this is that, not the satisfaction itself, but the guiltlessness thereby procured, that is so oft in his argument termed ‘justice’ or ‘righteousness’, called the ‘Justice of God’, Rom. 1:17, and 3:21-22, and 2 Cor. 5:21, not, as some, for that the satisfaction was made by Christ, who is God, but because contrived, prepared, propounded and appointed us by God, for God as the party wronged, and Christ as the party satisfying, for the wrong, are in this argument distinguished, Rom. 3:24-25 and 2 Cor. 5:19, 21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Antidote Against Error Concerning Justification</cite>, … (d. 1654; London: Brome, 1670), p. 34</span></figcaption>

</figure><figure class="quote" id="q-a906397c9a" data-kw="">
<blockquote><p>1. We begin with the most ancient father, Justin [Martyr]. He, in the book inscribed… an Exposition of the Faith, has these words: ‘The Son of God, as man, passed a life removed from all crime, and underwent a voluntary death; [Greek] that is, obliterating sin by a perfect and sinless conversation [conduct], and abolishing our debt by a debt that he owed not. Justin Martyr here plainly teaches, not only that the death and satisfaction of Christ are imputed to us for the blotting out of our punishment, but that his conversation itself, or active obedience, is imputed to us, for the obliteration of our sin.

2. Irenaeus, Against Heresies, bk. 5… in ch. 18: ‘The Lord has restored us to friendship by his incarnation, being made the Mediator between God and man; both propitiating the Father for us, against whom we had sinned, and making amends for our disobedience; bestowing moreover upon us that conversation [conduct] and obedience which is due to our Maker.’ …What else is this than the obedience of Christ both active and passive, made ours by imputation and bestowal?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Justification</cite>, …, vol. 1 trans. Josiah Allport (d. 1641; London: Hamilton, 1844/1846), ch. 29, p. 254</span></figcaption>

ith%20the%20most,made%20ours%20by%20imputation%20and%20bestowal&amp;text=1.%20We%20begin%20with%20the%20most%20ancient%20father&amp;text=and%20passive%2C%20made%20ours%20by%20imputation%20and%20bestowal" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-766b45942f" data-kw="">
<blockquote><p>From the imputation of righteousness, a meritorious claim upon life and the reward of life itself equally follow. For just as the sentence of sin’s remission has regard to three things—sin, liability to punishment, and punishment itself—so the sentence of justification has regard to three things—Christ’s righteousness or satisfaction, that merit which belongs to Christ’s righteousness or satisfaction (for his satisfaction is meritorious of eternal life), and life itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’</cite>, tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.4.2. ‘The Imputation of Righteousness’, pp. 107-8 Rollock (c. 1555-1599) was a Scottish minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“From the imputation of righteousness, a meritorious claim upon life and the reward of life itself equally follow. For just as the sentence of sin’s remission has regard to three things—sin, liability to punishment, and punishment itself—so the sentence of justification has regard to three things—Christ’s righteousness or satisfaction, that merit which belongs to Christ’s righteousness or satisfaction (for his satisfaction is meritorious of eternal life), and life itself.”

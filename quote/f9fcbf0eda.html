<blockquote><p>13. But the doers of the Law will be justified. This passage is interpreted in a twofold way by blessed Augustine in chapter 26 of On the Spirit and the Letter. First in this way:The doers of the Law will be justified means that through justification they will become, will be made, what they were not before, doers. Second, and in a better way, will be justified means that they will be looked upon and thought of as righteous, as stated in the gloss. It is sufficiently clear from the preceding (the period 13), “for not the hearers of the Law are righteous before God,” that, if you should ask who else is righteous before God except the hearers, the answer would be: “The doers will be righteous, that is, they will be justified and looked upon as righteous.” Thus Ps. 143:2 says, “for no man living is righteous before Thee,” that is, he is not looked upon as righteous. And below, in Rom. 3:20, we read: “No human being will be justified in his sight by works of the law.” And again Luke 10:29: “And he, desiring to justify himself” (that is, he wanted to declare or to state that he was righteous, and he wanted to absolve himself of sin, as though he did not know who was his neighbor whom he was commanded to love), and similarly in many other places.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works, 25.184–85.</cite></span></figcaption>

<blockquote><p>15. Did Christ redeem us only by his passive righteousness? The difference of opinions XXXVII. Fifteenth, it is asked whether Christ redeemed us only by his passive righteousness, or in addition also his active righteousness. Johannes Piscator, otherwise an outstanding theologian, together with several others, because they thought that the necessity of passive righteousness and death would be abolished if it were stated that in our place he most exactly kept the divine law, because one who kept the law exactly could not be punished with death, chose the prior. Protestants commonly prefer the latter, and certainly correctly, but not all in one way. Some divide the passive and active righteousness of Christ in such a way that only by his passive righteousness did he satisfy in our place for the law that was not observed, and by it delivered us only from the guilt of punishment, and likewise, only by his active righteousness did he keep the law perfectly in our place, and by keeping it, acquire for us the right of eternal life. Others, with that more subtle division laid aside, prefer to state that Christ devoted both these kinds of righteousness to us, to the end that he might satisfy for the divine law that was not observed by us, and by satisfying, also merit for us the right of life, in such a way that by this satisfaction he at the same time delivered us from every evil and gained the right of every good. The difficulties raised by Piscator are removed We have adduced the reasons for this view in §XX: with them presupposed, it is not so difficult to respond to the difficulties raised by Piscator. For if (1) it should be alleged that the law demands nothing but one or the other, either obedience or punishment, we will respond that the law, first from man in his integrity, demands only obedience under threat of punishment, but from the sinner, it demands punishment for past sin and obedience in the future, because punishment cannot deliver from the obedience owed to God. Wherefore the Redeemer had to supply both. If (2) it should be alleged that the necessity and use of the death and passive righteousness are removed when he has most fully kept the law on our behalf, we will respond that it is by no means removed, because both kinds of righteousness were necessary for him to satisfy for the injury we inflicted upon the divine majesty and his law, and in satisfying, to merit for us the right of eternal life. If (3) it should be alleged that Scripture refers the consummation of our salvation to his one and only sacrifice accomplished on the cross, we will respond that by that sacrifice is understood by synecdoche his entire satisfaction, the outstanding part of which his death on the cross supplied, just as by the same synecdoche, the blood of Christ designates the same satisfacation (1 John 1:7; Acts 20:28). If one should proceed (4) to allege that obedience was necessary for his own self as a man, and thus could not be expended for us, we will respond that (a) the obedience, insofar as it resulted from the God-man, was not necessary for him, because the law obligates not the God-man to obedience, but a mere man; (b) that obedience of the God-man is of infinite value, whereby it was able to suffice both for himself and for us, because an obedience greater than infinite could not be demanded or supplied for him, or at the same time for us.</p></blockquote>

<blockquote><p>And the man, out of Christ and under the Law, is still compelled in both active and passive obedience… And for the believer in Christ, the rigor of the Law is abated, not that the Law, as the Law, requires less of him than absolutely perfect obedience, but because in what he comes short in performing of new obedience, from a new principle, to wit, a Gospel-spirit in him, he is pardoned in Christ, and the rest is accepted for Christ’s sake, as if it were obedience. Now in this new obedience, the Spirit so oils the wheels of free-will as obedience, in its kind, is as free, connatural, delightful, being sweetened with the love of God, as if there were not an awing Law, but a sweetly alluring and heart-drawing free love, so that the believer obeys…</p></blockquote>

<blockquote><p>The observation is that a complete and full absolution from all sin is not enjoyed till the day of judgement. The believers have not a full discharge till then: we are in this life continually subject to new sins, and so to new guilt, whereby arise new fears, so that the soul has not a full rest from all, till that final absolution be pronounced at the Day of Judgment. Before we show the grounds whereby it may appear that the remission of our sins is not fully completed till then: we must lay down some propositions by way of a grand work. First, The Scripture not only in this privilege of remission of our sin, but in others also, makes the complement and fullness of them to be at the Day of Judgment. Redemption is the total sum, as it were, of all our mercies, and we are partakers of it in this life, Col. 1:14; Rom. 3:24. Yet the Scripture calls the Day of Judgment, when we shall rise out of our graves in a peculiar and eminent manner, the day of redemption, Eph. 1:7; 4:30, because at that day will be the utmost and last effects of our redemption. Adoption, that also is a privilege we receive in this life; yea a learned man (Forbes in his book where he handles the order of God’s graces) makes adoption (as I take it) to be the first, and to go before justification; yet the apostle, Rom. 8:23, calls the last day, the day of adoption. Hence 1 Jn. 3.2, the apostle, though he says, ‘We are now the sons of God,’ yet he says ‘it doth not appear what we shall be,’ because the glory God at the Last Day will put upon us is so far transcendent and superlative to what now we are. Thus Mt. 19.28, the last day is also called the day of regeneration unto the people of God; yet in this life they partake of that grace, but because then is the full perfection and manifestation of it, therefore the Scripture calls it the day of regeneration. Even as the apostle, Acts 13:33, applies that passage of the psalm to Christ’s resurrection, ‘This day have I begotten thee,’ because then was such a solemn and public declaration that he was the Son of God. No marvel then, if the Scripture do also call the day of judgment a time when sins shall be blotted out, because then is the public absolution of the godly; and according to philosophy motions receive their names from the term to which they tend. Secondly, howsoever justification be said to consist in pardon of sin, yet there is a great difference between the one and the other; for justification, besides the pardon of sin, does connote a state that the subject is put into, viz. a state of favour, being reconciled with God. Hence it is, that this state cannot be reiterated often, no more than a wife after that first entrance into the relation is frequently made a wife. In this sense, the Scripture always speaks of it, as connoting a state or condition the subject is put into, as well as a peculiar privilege vouchsafed to such. It is true, there are indeed learned men, who think justification may be reiterated, as you heard, Peter Martyr and [Martin] Bucer. Others call it a continued action, as conservation. But although there is a continuance of justification, and the godly are preserved in that estate, yet we cannot say God does renew justification daily, as He does pardon of sin. There are some that think the Scripture gives a ground for a second justification, or the continuing and increasing of it, and bring those places, Tit. 3:5-7; Rev. 22:11. The learned and excellent interpreter Ludovicus de Dieu, in ch. 8 of the Romans, verse 4, largely pleads for a twofold justification; the first he makes to be the imputing of Christ’s righteousness to us, received by faith, which is altogether perfect, and is the cause of pardon of sins: the second he makes an effect of the former, whereby through the grace of God regenerating, we are conformable unto that law in part, and are day by day more and more justified, and shall be fully so when perfection comes: of which justification he says these texts speak, Jm. 2:21, 24; Rev. 22:11; Mt. 11:37; 1 Kn. 8:32. This twofold justification he makes to differ toto coelo [by a whole heaven] from the Papists, whose first is founded upon the merit of congruity, the second upon the merit of condignity. But the discussing of this will be more proper in the other part, viz. of imputed righteousness. Augustine seems to hold justification [to be] a frequent and continued act, bk. 2, Contra Julian, ch. 8. When we are heard in that prayer (‘Forgive us our sins’) we need (says he) such a remission daily, what progress soever we have made in our second justification. He speaks also of a justification hujus vitae [of this life], which he calls the lesser; and another plenam and perfect, full and perfect, which belongs to the state of glory, Tract 4 on John, Book on the Spirit &amp; the Letter, last chapter. But the more exact handling of this will be in the place above-mentioned. It seems more consonant to Scripture if we say that justification is a state we were once put into which is not repeated over and over as often as sin is forgiven; neither can it admit of increase or decrease, so that a man should be more or less justified; for even David while he was in that state of suspension, was not less justified, though the effects of justification were less upon him. It is true, in some sense learned men say justification may increase, viz. extensive, not intensive, as they express it, by way of extension, when more sins are pardoned, not intensively in its own nature. Even as the soul of a man in its information of the body admits of no increase intensively, but it does extensively, the more the parts of the body grow, the further does its information extend. But of these things more in their proper place. Thirdly, howsoever an absolution shall be completed at the Day of Judgment, yet our justification shall not abide in such a way as it is in this life. Now our justification is by pardon of sin, and a righteousness without us imputed to us, which is instrumentally applied by faith; but this way shall then cease, for having perfect righteousness inherent in ourselves, we shall need no covering. It is true, the glory and honour of all this will redound upon Christ, and He shall not be the less glorified because He has then brought us to the full end of all his sufferings. I know some may doubt whether any righteousness but that which is infinite can please God, and therefore, as some think, the angels were accepted of God through Christ, though perfect; so it may be of the saints in heaven. But I see no ground for this. This seems to be undoubted, that the way of justification by faith in Christ arises because of our imperfection and sinfulness remaining in us, and therefore is justificatio viae, not patriae—’a justification’ of us ‘in our way,’ not when we come to ‘our home’. Fourthly, although pardon of sin be completed at that great day, yet this is not to be understood as if God’s pardon of any sin were imperfect, and something of sin did still remain to be done away. No, those expressions of forgiveness of sin in the Scripture denote such a full and plenary pardon that a sin cannot be more remitted than it is. But because we commit new sins daily, and so need pardon daily, therefore it is that we are not completely pardoned till then. As also because the perfect pardon we have here shall then solemnly and publicly be declared to all the world. These things thus premised, I come to show the grounds or particulars wherein our pardon of sin is thus completed. And first, in our sense and feeling: for howsoever God pardon a sin perfectly, yet our faith which receives it is weak. This jewel is taken with a trembling and shaking hand. Hence it is that we have not full faith and confidence in our spirits. We may see this in David; though Nathan told him his sins were forgiven him, yet his faith was not so vigorous and powerful as wholly to apply this to his own soul, and therefore he had much anguish and trouble of heart afterwards. But now, at the last day, all these fears, diffidence and darkness will be quite removed out of our hearts. There shall be no more disturbance in our souls than there can be corruption in the highest heavens; we shall then have such a gourd as no worm can devour. Our souls shall not then know the meaning of sitting in darkness, and wanting God’s favour. There will then be no complaints, ‘Why has the Lord forsaken me?’ Well may God’s children be called upon to lift up their heads, when such a redemption draws nigh; and well may that day be called the times of refreshment, seeing the people of God are so often scorched with the fiery darts of Satan. Secondly, pardon of sin will at that day be perfected. Because all the effects of pardon will then be accomplished and not so much as any scars remain, the wound will be so fully healed. Although God does fully pardon sin, yet the effects of this are delayed; many chastisements and sad afflictions are to be undergone: howsoever, death itself, and the corruption in the grave must seize upon justified persons; now these are the fruit of sin, and howsoever the sting of these be taken away, yet they are not wholly conquered till that Last Day. Then therefore may we justly say, sin is pardoned, when there shall be no more grave, no more death, no more corruption, but all shall be swallowed up in immortality and glory. Thirdly, then, and not till then may we say remission of sins will be completed, because then shall no more iteration of pardon be. Here in this life, because the root of corruption abides in us, there are daily pullulant [sprouting] branches of sins, and so frequent guilt is contracted; whereby as we have daily sores, so we need daily plasters. It is with original corruption in us, as in that tree in Dan. 4:14-15; although the branches be cut off, yet the stump is still in the earth, and that sprouts out too fast by the temptations that are always by it. Hence it is that we always pray, ‘Forgive us our sins;’ and because of these failings the apostle, 2 Cor. 5:20, writes to, and exhorts the godly Corinthians, who were already reconciled to God, to be further reconciled to Him. But then this petition shall wholly cease; then there will be no serpent to sting us, nor will the eye of justifying faith to look upon the brazen serpent exalted be necessary any more. The Lord will not only wipe away the tear of worldly grief, but also of godly sorrow at that time. Then, and not till then, will it be true, that God sees no sin in his children. Then will the Church be without wrinkles, or any spot within her. In this respect it is, the Church of God prays so earnestly for the Bridegroom’s coming. For this it is they look for and hasten in their prayers that day. Fourthly, at that day will pardon of sin only be completed, if you consider the nature of justification. For what is that, but an overcoming the accusing adversary, and clearing of us against every charge? Now this is most eminently and fully done in those last assizes. The Syriac word to justify is also to conquer and overcome, because when a man is justified, he overcomes all those bills and indictments which were brought in against him; now this is manifestly done in the Day of Judgment, when God shall before men and angels acquit and absolve his people: and if the apostle say in this life, Rom. 6:7, of a godly man dead in Christ, he is justified from his sins, in respect of sanctification, that sin does not conquer him, but he sin, how much more will this be true at that day, when all the guilt and filth of sin shall be totally removed? Oh what a glorious conquest will that be over sin, hell, and the devil, when the Judge of the whole world shall pronounce them free from all sin, and command them to enter into his glorious rest!</p></blockquote>

— Anthony Burgess, The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures (London: Miller, 1651), pt. 1, Lecture 29, on Acts 3:19, pp. 256-58">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+observation+is+that+a+complete+and+full+absolution+from+all+sin+is+not+enjoyed+till+the+day+of+judgement.+The+believers+have+not+a+full+discharge+till+then%3A+we+are+in+this+life+continually+subject+to+new+sins%2C+and+so+to+new+guilt%2C+whereby+arise+new+fears%2C+so+that+the+soul+has+not+a+full+rest+from+all%2C+till+that+final+absolution+be+pronounced+at+the+Day+of+Judgment.+Before+we+show+the+grounds+whereby+it+may+appear+that+the+remission+of+our+sins+is+not+fully+completed+till+then%3A+we+must+lay+down+some+propositions+by+way+of+a+grand+work.+First%2C+The+Scripture+not+only+in+this+privilege+of+remission+of+our+sin%2C+but+in+others+also%2C+makes+the+complement+and+fullness+of+them+to+be+at+the+Day+of+Judgment.+Redemption+is+the+total+sum%2C+as+it+were%2C+of+all+our+mercies%2C+and+we+are+partakers+of+it+in+this+life%2C+Col.+1%3A14%3B+Rom.+3%3A24.+Yet+the+Scripture+calls+the+Day+of+Judgment%2C+when+we+shall+rise+out+of+our+graves+in+a+peculiar+and+eminent+manner%2C+the+day+of+redemption%2C+Eph.+1%3A7%3B+4%3A30%2C+because+at+that+day+will+be+the+utmost+and+last+effects+of+our+redemption.+Adoption%2C+that+also+is+a+privilege+we+receive+in+this+life%3B+yea+a+learned+man+%28Forbes+in+his+book+where+he+handles+the+order+of+God%E2%80%99s+graces%29+makes+adoption+%28as+I+take+it%29+to+be+the+first%2C+and+to+go+before+justification%3B+yet+the+apostle%2C+Rom.+8%3A23%2C+calls+the+last+day%2C+the+day+of+adoption.+Hence+1+Jn.+3.2%2C+the+apostle%2C+though+he+says%2C+%E2%80%98We+are+now+the+sons+of+God%2C%E2%80%99+yet+he+says+%E2%80%98it+doth+not+appear+what+we+shall+be%2C%E2%80%99+because+the+glory+God+at+the+Last+Day+will+put+upon+us+is+so+far+transcendent+and+superlative+to+what+now+we+are.+Thus+Mt.+19.28%2C+the+last+day+is+also+called+the+day+of+regeneration+unto+the+people+of+God%3B+yet+in+this+life+they+partake+of+that+grace%2C+but+because+then+is+the+full+perfection+and+manifestation+of+it%2C+therefore+the+Scripture+calls+it+the+day+of+regeneration.+Even+as+the+apostle%2C+Acts+13%3A33%2C+applies+that+passage+of+the+psalm+to+Christ%E2%80%99s+resurrection%2C+%E2%80%98This+day+have+I+begotten+thee%2C%E2%80%99+because+then+was+such+a+solemn+and+public+declaration+that+he+was+the+Son+of+God.+No+marvel+then%2C+if+the+Scripture+do+also+call+the+day+of+judgment+a+time+when+sins+shall+be+blotted+out%2C+because+then+is+the+public+absolution+of+the+godly%3B+and+according+to+philosophy+motions+receive+their+names+from+the+term+to+which+they+tend.+Secondly%2C+howsoever+justification+be+said+to+consist+in+pardon+of+sin%2C+yet+there+is+a+great+difference+between+the+one+and+the+other%3B+for+justification%2C+besides+the+pardon+of+sin%2C+does+connote+a+state+that+the+subject+is+put+into%2C+viz.+a+state+of+favour%2C+being+reconciled+with+God.+Hence+it+is%2C+that+this+state+cannot+be+reiterated+often%2C+no+more+than+a+wife+after+that+first+entrance+into+the+relation+is+frequently+made+a+wife.+In+this+sense%2C+the+Scripture+always+speaks+of+it%2C+as+connoting+a+state+or+condition+the+subject+is+put+into%2C+as+well+as+a+peculiar+privilege+vouchsafed+to+such.+It+is+true%2C+there+are+indeed+learned+men%2C+who+think+justification+may+be+reiterated%2C+as+you+heard%2C+Peter+Martyr+and+%5BMartin%5D+Bucer.+Others+call+it+a+continued+action%2C+as+conservation.+But+although+there+is+a+continuance+of+justification%2C+and+the+godly+are+preserved+in+that+estate%2C+yet+we+cannot+say+God+does+renew+justification+daily%2C+as+He+does+pardon+of+sin.+There+are+some+that+think+the+Scripture+gives+a+ground+for+a+second+justification%2C+or+the+continuing+and+increasing+of+it%2C+and+bring+those+places%2C+Tit.+3%3A5-7%3B+Rev.+22%3A11.+The+learned+and+excellent+interpreter+Ludovicus+de+Dieu%2C+in+ch.+8+of+the+Romans%2C+verse+4%2C+largely+pleads+for+a+twofold+justification%3B+the+first+he+makes+to+be+the+imputing+of+Christ%E2%80%99s+righteousness+to+us%2C+received+by+faith%2C+which+is+altogether+perfect%2C+and+is+the+cause+of+pardon+of+sins%3A+the+second+he+makes+an+effect+of+the+former%2C+whereby+through+the+grace+of+God+regenerating%2C+we+are+conformable+unto+that+law+in+part%2C+and+are+day+by+day+more+and+more+justified%2C+and+shall+be+fully+so+when+perfection+comes%3A+of+which+justification+he+says+these+texts+speak%2C+Jm.+2%3A21%2C+24%3B+Rev.+22%3A11%3B+Mt.+11%3A37%3B+1+Kn.+8%3A32.+This+twofold+justification+he+makes+to+differ+toto+coelo+%5Bby+a+whole+heaven%5D+from+the+Papists%2C+whose+first+is+founded+upon+the+merit+of+congruity%2C+the+second+upon+the+merit+of+condignity.+But+the+discussing+of+this+will+be+more+proper+in+the+other+part%2C+viz.+of+imputed+righteousness.+Augustine+seems+to+hold+justification+%5Bto+be%5D+a+frequent+and+continued+act%2C+bk.+2%2C+Contra+Julian%2C+ch.+8.+When+we+are+heard+in+that+prayer+%28%E2%80%98Forgive+us+our+sins%E2%80%99%29+we+need+%28says+he%29+such+a+remission+daily%2C+what+progress+soever+we+have+made+in+our+second+justification.+He+speaks+also+of+a+justification+hujus+vitae+%5Bof+this+life%5D%2C+which+he+calls+the+lesser%3B+and+another+plenam+and+perfect%2C+full+and+perfect%2C+which+belongs+to+the+state+of+glory%2C+Tract+4+on+John%2C+Book+on+the+Spirit+%26+the+Letter%2C+last+chapter.+But+the+more+exact+handling+of+this+will+be+in+the+place+above-mentioned.+It+seems+more+consonant+to+Scripture+if+we+say+that+justification+is+a+state+we+were+once+put+into+which+is+not+repeated+over+and+over+as+often+as+sin+is+forgiven%3B+neither+can+it+admit+of+increase+or+decrease%2C+so+that+a+man+should+be+more+or+less+justified%3B+for+even+David+while+he+was+in+that+state+of+suspension%2C+was+not+less+justified%2C+though+the+effects+of+justification+were+less+upon+him.+It+is+true%2C+in+some+sense+learned+men+say+justification+may+increase%2C+viz.+extensive%2C+not+intensive%2C+as+they+express+it%2C+by+way+of+extension%2C+when+more+sins+are+pardoned%2C+not+intensively+in+its+own+nature.+Even+as+the+soul+of+a+man+in+its+information+of+the+body+admits+of+no+increase+intensively%2C+but+it+does+extensively%2C+the+more+the+parts+of+the+body+grow%2C+the+further+does+its+information+extend.+But+of+these+things+more+in+their+proper+place.+Thirdly%2C+howsoever+an+absolution+shall+be+completed+at+the+Day+of+Judgment%2C+yet+our+justification+shall+not+abide+in+such+a+way+as+it+is+in+this+life.+Now+our+justification+is+by+pardon+of+sin%2C+and+a+righteousness+without+us+imputed+to+us%2C+which+is+instrumentally+applied+by+faith%3B+but+this+way+shall+then+cease%2C+for+having+perfect+righteousness+inherent+in+ourselves%2C+we+shall+need+no+covering.+It+is+true%2C+the+glory+and+honour+of+all+this+will+redound+upon+Christ%2C+and+He+shall+not+be+the+less+glorified+because+He+has+then+brought+us+to+the+full+end+of+all+his+sufferings.+I+know+some+may+doubt+whether+any+righteousness+but+that+which+is+infinite+can+please+God%2C+and+therefore%2C+as+some+think%2C+the+angels+were+accepted+of+God+through+Christ%2C+though+perfect%3B+so+it+may+be+of+the+saints+in+heaven.+But+I+see+no+ground+for+this.+This+seems+to+be+undoubted%2C+that+the+way+of+justification+by+faith+in+Christ+arises+because+of+our+imperfection+and+sinfulness+remaining+in+us%2C+and+therefore+is+justificatio+viae%2C+not+patriae%E2%80%94%E2%80%99a+justification%E2%80%99+of+us+%E2%80%98in+our+way%2C%E2%80%99+not+when+we+come+to+%E2%80%98our+home%E2%80%99.+Fourthly%2C+although+pardon+of+sin+be+completed+at+that+great+day%2C+yet+this+is+not+to+be+understood+as+if+God%E2%80%99s+pardon+of+any+sin+were+imperfect%2C+and+something+of+sin+did+still+remain+to+be+done+away.+No%2C+those+expressions+of+forgiveness+of+sin+in+the+Scripture+denote+such+a+full+and+plenary+pardon+that+a+sin+cannot+be+more+remitted+than+it+is.+But+because+we+commit+new+sins+daily%2C+and+so+need+pardon+daily%2C+therefore+it+is+that+we+are+not+completely+pardoned+till+then.+As+also+because+the+perfect+pardon+we+have+here+shall+then+solemnly+and+publicly+be+declared+to+all+the+world.+These+things+thus+premised%2C+I+come+to+show+the+grounds+or+particulars+wherein+our+pardon+of+sin+is+thus+completed.+And+first%2C+in+our+sense+and+feeling%3A+for+howsoever+God+pardon+a+sin+perfectly%2C+yet+our+faith+which+receives+it+is+weak.+This+jewel+is+taken+with+a+trembling+and+shaking+hand.+Hence+it+is+that+we+have+not+full+faith+and+confidence+in+our+spirits.+We+may+see+this+in+David%3B+though+Nathan+told+him+his+sins+were+forgiven+him%2C+yet+his+faith+was+not+so+vigorous+and+powerful+as+wholly+to+apply+this+to+his+own+soul%2C+and+therefore+he+had+much+anguish+and+trouble+of+heart+afterwards.+But+now%2C+at+the+last+day%2C+all+these+fears%2C+diffidence+and+darkness+will+be+quite+removed+out+of+our+hearts.+There+shall+be+no+more+disturbance+in+our+souls+than+there+can+be+corruption+in+the+highest+heavens%3B+we+shall+then+have+such+a+gourd+as+no+worm+can+devour.+Our+souls+shall+not+then+know+the+meaning+of+sitting+in+darkness%2C+and+wanting+God%E2%80%99s+favour.+There+will+then+be+no+complaints%2C+%E2%80%98Why+has+the+Lord+forsaken+me%3F%E2%80%99+Well+may+God%E2%80%99s+children+be+called+upon+to+lift+up+their+heads%2C+when+such+a+redemption+draws+nigh%3B+and+well+may+that+day+be+called+the+times+of+refreshment%2C+seeing+the+people+of+God+are+so+often+scorched+with+the+fiery+darts+of+Satan.+Secondly%2C+pardon+of+sin+will+at+that+day+be+perfected.+Because+all+the+effects+of+pardon+will+then+be+accomplished+and+not+so+much+as+any+scars+remain%2C+the+wound+will+be+so+fully+healed.+Although+God+does+fully+pardon+sin%2C+yet+the+effects+of+this+are+delayed%3B+many+chastisements+and+sad+afflictions+are+to+be+undergone%3A+howsoever%2C+death+itself%2C+and+the+corruption+in+the+grave+must+seize+upon+justified+persons%3B+now+these+are+the+fruit+of+sin%2C+and+howsoever+the+sting+of+these+be+taken+away%2C+yet+they+are+not+wholly+conquered+till+that+Last+Day.+Then+therefore+may+we+justly+say%2C+sin+is+pardoned%2C+when+there+shall+be+no+more+grave%2C+no+more+death%2C+no+more+corruption%2C+but+all+shall+be+swallowed+up+in+immortality+and+glory.+Thirdly%2C+then%2C+and+not+till+then+may+we+say+remission+of+sins+will+be+completed%2C+because+then+shall+no+more+iteration+of+pardon+be.+Here+in+this+life%2C+because+the+root+of+corruption+abides+in+us%2C+there+are+daily+pullulant+%5Bsprouting%5D+branches+of+sins%2C+and+so+frequent+guilt+is+contracted%3B+whereby+as+we+have+daily+sores%2C+so+we+need+daily+plasters.+It+is+with+original+corruption+in+us%2C+as+in+that+tree+in+Dan.+4%3A14-15%3B+although+the+branches+be+cut+off%2C+yet+the+stump+is+still+in+the+earth%2C+and+that+sprouts+out+too+fast+by+the+temptations+that+are+always+by+it.+Hence+it+is+that+we+always+pray%2C+%E2%80%98Forgive+us+our+sins%3B%E2%80%99+and+because+of+these+failings+the+apostle%2C+2+Cor.+5%3A20%2C+writes+to%2C+and+exhorts+the+godly+Corinthians%2C+who+were+already+reconciled+to+God%2C+to+be+further+reconciled+to+Him.+But+then+this+petition+shall+wholly+cease%3B+then+there+will+be+no+serpent+to+sting+us%2C+nor+will+the+eye+of+justifying+faith+to+look+upon+the+brazen+serpent+exalted+be+necessary+any+more.+The+Lord+will+not+only+wipe+away+the+tear+of+worldly+grief%2C+but+also+of+godly+sorrow+at+that+time.+Then%2C+and+not+till+then%2C+will+it+be+true%2C+that+God+sees+no+sin+in+his+children.+Then+will+the+Church+be+without+wrinkles%2C+or+any+spot+within+her.+In+this+respect+it+is%2C+the+Church+of+God+prays+so+earnestly+for+the+Bridegroom%E2%80%99s+coming.+For+this+it+is+they+look+for+and+hasten+in+their+prayers+that+day.+Fourthly%2C+at+that+day+will+pardon+of+sin+only+be+completed%2C+if+you+consider+the+nature+of+justification.+For+what+is+that%2C+but+an+overcoming+the+accusing+adversary%2C+and+clearing+of+us+against+every+charge%3F+Now+this+is+most+eminently+and+fully+done+in+those+last+assizes.+The+Syriac+word+to+justify+is+also+to+conquer+and+overcome%2C+because+when+a+man+is+justified%2C+he+overcomes+all+those+bills+and+indictments+which+were+brought+in+against+him%3B+now+this+is+manifestly+done+in+the+Day+of+Judgment%2C+when+God+shall+before+men+and+angels+acquit+and+absolve+his+people%3A+and+if+the+apostle+say+in+this+life%2C+Rom.+6%3A7%2C+of+a+godly+man+dead+in+Christ%2C+he+is+justified+from+his+sins%2C+in+respect+of+sanctification%2C+that+sin+does+not+conquer+him%2C+but+he+sin%2C+how+much+more+will+this+be+true+at+that+day%2C+when+all+the+guilt+and+filth+of+sin+shall+be+totally+removed%3F+Oh+what+a+glorious+conquest+will+that+be+over+sin%2C+hell%2C+and+the+devil%2C+when+the+Judge+of+the+whole+world+shall+pronounce+them+free+from+all+sin%2C+and+command+them+to+enter+into+his+glorious+rest%21%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+The+True+Doctrine+of+Justification+Asserted+%26+Vindicated%2C+from+the+Errours+of+Papists%2C+Arminians%2C+Socinians+%26+more+especially+Antinomians+in+30+Lectures+%28London%3A+Miller%2C+1651%29%2C+pt.+1%2C+Lecture+29%2C+on+Acts+3%3A19%2C+pp.+256-58&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2afbcaad5c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2afbcaad5c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=The%20observation%20is%20that%20a%20complete,to%20enter%20into%20his%20glorious%20rest&amp;text=The%20observation%20is%20that%20a%20complete%20and%20full&amp;text=command%20them%20to%20enter%20into%20his%20glorious%20rest" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-eb344b1639" data-kw="">
<blockquote><p>36. ‘And kneeling down’. The inward affection is indeed the chiefest thing in prayer; yet the external signs, as kneeling, uncovering of the head, lifting up of the hands, have a double use; the first is, that we exercise all our members to the glory and worship of God; secondly, that by this exercise our sluggishness may be awakened, as it were. There is also a third use in solemn and public prayer, because the children of God do by this means make profession of their godliness, and one of them does provoke another unto the reverence of God. And, as the lifting up of the hands is a token of boldness (fiducia, confidence) and of an earnest desire, so, to testify our humility, we fall down upon our knees.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts 20, verse 36</cite></span></figcaption>

<blockquote><p>XIV. God has by Nature and Scripture obliged men themselves to choose and determine diverse subordinate expressions, significations, modes, circumstances, or accidents of this universal religion, which are not themselves meet for an universal, and unchangeable, obligation, but local, temporary, and mutable: Some of which every man may choose for himself, some the present pastor must choose, some the associated pastors may choose, and some the magistrate may choose. These must be added to the universal duties, so far is such addition from being sin: I have often named many particulars, as: the translation of the Scripture, which to choose: the version of the psalms in rhythm, or metre, the common use of new made hymns, the dividing the Scripture into chapter and verse; the words of sermons; their method; the particular text to be chosen; what chapters to read; at what hour to begin; how long to preach; in what words to pray, whether the same oft, or changed; whether fore-studied, or not, whether written, or unwritten: whether studied, and written by ourselves, or by others; where the place shall be, where the pulpit, [baptismal] font, table, etc. shall stand; what ornaments they shall have, linen, silk, silver vessels or otherwise? Whether we be bare-headed, or covered at prayer, sacrament, etc. Whether we shall kneel, stand, sit, or be prostrate at prayer, etc. what distinctive garments pastors shall use. By what signs of consent and obligation men vow, and swear, whether by putting the hand under the thigh, lifting it up, subscribing, laying it on the Book [Bible], kissing the Book, etc. what catechisms to use, with many more such. God has commanded men to choose such things as these by the rules of edification, love, peace, concord, order, decency, winning those without, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by [Against] Dr. Owen’s Vindicator… (London: Parkhurst, 1684), section 2</cite>, p. 11</span></figcaption>

+such.+God+has+commanded+men+to+choose+such+things+as+these+by+the+rules+of+edification%2C+love%2C+peace%2C+concord%2C+order%2C+decency%2C+winning+those+without%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Catholic+Communion+Doubly+Defended+by+%5BAgainst%5D+Dr.+Owen%E2%80%99s+Vindicator%E2%80%A6+%28London%3A+Parkhurst%2C+1684%29%2C+section+2%2C+p.+11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc270919e61.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c270919e61.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-circumstances/#:~:text=XIV.%20God%20has%20by%20Nature%20and,order%2C%20decency%2C%20winning%20those%20without%2C%20etc." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1e3e039a49" data-kw="">
<blockquote><p>You [the episcopalian adversary] fall next to censure ‘the posture of sitting in time of public prayer, as very irreverent.’ Sir, not to detain you, I am not far from your opinion: For my own part, and I have many of our way assenting, I dislike sitting in prayer (if infirmity and other great inconveniences do not hinder it)… so I cannot but disagree from you in your overprizing and exacting the postures that you plead for: for though I am convinced that there is an indecency, and other inconveniences in sitting, for which I wish that wherever it may be, it were wholly disused, yet I am far from offending at, let be imposing upon these who of no intended irreverence, but for the most part from a just disgust of the too great weight has been laid upon such circumstances, do innocently practice it… So there are also upon record, such clear instances of an undetermined liberty in these matters, apparent enough in our Lord, his disciples and company, their ordinary sitting down to meat, and blessing and giving thanks in that posture, that I cannot but strange at your bringing any of these practices under an obligation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 70-71 of ‘The Second Dialogue’ in The True Non-Conformist (1671)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

<main class="wrap"><figure class="quote" id="q-6220ca2321" data-kw="">
<blockquote><p>There is no hierarchy in the church of Christ (Luke 22:25–26; 2 Cor. 1:24; 1 Pet. 5:3). There is no such thing as a diocesan, cathedral, patriarchal, or metropolitan church, for in the New Testament all churches are equal and all have their own ἐπισκοποι; and believers are nowhere instructed to inquire into the legitimate succession of their ministers, but rather to examine the Scriptures and to remain in the teaching [handed down to them] (John 5:39; Acts 17:11; 1 Tim. 4:13–16; 2 Tim. 1:13–14; 3:14–17). Neither does legitimate succession guarantee purity of doctrine (John 8:39; Rom. 2:28; 9:6). [Such succession] would sooner make salvation dependent on certain specific persons and on impracticable, fallible, and often even impossible historical research.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 4</cite>, §502</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/papal-supremacy.html">Papal supremacy</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/the-popes-claims.html">The Pope&#x27;s claims</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-584b7f205d" data-kw="See of Peter Vicar of Christ">
<blockquote><p>To fix down Christ and the Holy Spirit and the Church to a particular spot, so that every one who presides in it, should he be a devil, must still be deemed vicegerent of Christ, and the head of the Church, because that spot was formerly the See of Peter, is not only impious and insulting to Christ, but absurd and contrary to common sense. … The see which they occupy, therefore, no more makes them the vicars of Christ, than it makes an idol to become God, when it is placed in the temple of God (2 Thess. 2:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.7.29</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/the-popes-claims.html">The Pope&#x27;s claims</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/apostolic-succession.html">Apostolic succession</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/papal-supremacy.html">Papal supremacy</a></span></div>

</figure><figure class="quote" id="q-32676ebd7b" data-kw="">
<blockquote><p>Peter had confessed in his own name, and that of his brethren, that Christ was the Son of God, (Matth. 16: 16.) On this rock Christ builds his Church, because it is the only foundation; as Paul says, &quot;Other foundation than this can no man lay,&quot; (1 Cor. 3: 11.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.6.6</span></figcaption>

— John Calvin, Institutes of the Christian Religion, 4.6.6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CPeter%20had%20confessed%20in%20his%20own%20name%2C%20and%20that%20of%20his%20brethren%2C%20that%20Christ%20was%20the%20Son%20of%20God%2C%20%28Matth.%2016%3A%2016.%29%20On%20this%20rock%20Christ%20builds%20his%20Church%2C%20because%20it%20is%20the%20only%20foundation%3B%20as%20Paul%20says%2C%20%22Other%20foundation%20than%20this%20can%20no%20man%20lay%2C%22%20%281%20Cor.%203%3A%2011.%29%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%204.6.6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F32676ebd7b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/32676ebd7b.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-75fb9ddff4" data-kw="">
<blockquote><p>The Apostle&#x27;s attack upon the false apostles was not unjustified. Neither are our attacks upon the papacy. When we call the Pope the Antichrist and his minions an evil brood, we do not slander them. We merely judge them by the touchstone of God&#x27;s Word recorded in the first chapter of this Epistle: &quot;Though we, or an angel from heaven, preach any other gospel unto you than that which we have preached unto you, let him be accursed.&quot;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, p. 214</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/antichrist.html">Antichrist</a> › <a href="../topics/the-return-of-christ-antichrist-and-the-millennium/antichrist/the-papacy-as-antichrist.html">The papacy as Antichrist</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/the-pope-as-antichrist.html">The pope as Antichrist</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Apostle&#x27;s attack upon the false apostles was not unjustified. Neither are our attacks upon the papacy. When we call the Pope the Antichrist and his minions an evil brood, we do not slander them. We merely judge them by the touchstone of God&#x27;s Word recorded in the first chapter of this Epistle: &quot;Though we, or an angel from heaven, preach any other gospel unto you than that which we have preached unto you, let him be accursed.&quot;”

— Martin Luther, Commentary on Galatians, p. 214">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Apostle%27s+attack+upon+the+false+apostles+was+not+unjustified.+Neither+are+our+attacks+upon+the+papacy.+When+we+call+the+Pope+the+Antichrist+and+his+minions+an+evil+brood%2C+we+do+not+slander+them.+We+merely+judge+them+by+the+touchstone+of+God%27s+Word+recorded+in+the+first+chapter+of+this+Epistle%3A+%22Though+we%2C+or+an+angel+from+heaven%2C+preach+any+other+gospel+unto+you+than+that+which+we+have+preached+unto+you%2C+let+him+be+accursed.%22%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Commentary+on+Galatians%2C+p.+214&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F75fb9ddff4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/75fb9ddff4.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-8e7f2dc0ca" data-kw="temporal power">
<blockquote><p>Only one thing may be gathered—that princes as to spiritual matters are subjected to the spiritual power; not in like manner that they lose their political authority over ministers in temporal matters. (b) No better “are Christians distinguished here from priests, so that these things are addressed to them as Christians and not as priests.” Things to be joined together are absurdly separated; for if a priest is a Christian he ought always to be subject (although in the exercise of his office and as to spiritual matters he is free). Also, if the mark of baptism and of gospel liberty in Christ does not release from obedience to the king, much less does clerical character. For the liberty of the church is stated concerning faith and the soul before temporal matters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite></span></figcaption>

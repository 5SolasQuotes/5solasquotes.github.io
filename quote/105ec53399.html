<main class="wrap"><figure class="quote" id="q-105ec53399" data-kw="">
<blockquote><p>Every faithful Christian who has been baptized may have this benefit from baptism as long as he lives: that as by his engrafting into Christ he is one with Him and therefore sees that while Christ lives he must and will live also, so thus having perpetual union and fellowship with Christ, the believer draws strength from the vine, so that he may live the Christian life.

If Christ then has the power of renewing him – which is signified and sealed by baptism (namely, the power of Christ’s death mortifying sin and the virtue of His resurrection in raising him up to a new life) – is not baptism throughout his life, as often as he seriously considers it, a powerful means to help him forward in a Christian life?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-rogers.html">Richard Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Holy Helps for a Godly Life</cite>, ed. Brian G. Hedges (1603; Grand Rapids, MI: Reformation Heritage Books, 2018), p. 17.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b427a2928c" data-kw="">
<blockquote><p>They of the south [of Scotland, such as William Cunningham and others] maintain, that both the sacraments, being seals of the same covenant, and imposing the self-same obligations, ought to be administered on the same footing, the same kind and measure of profession and of qualification being required, on the part of applicants for either; that no adult should be admitted to the one, without being admitted also to the other; and that the Christian profession required of a parent, in order to the baptism of his child, cannot be complete, without his being a communicant. The result of these views being carried into practice in the Lowlands, or rather the result of their mode of reducing them to practice, is, that with rare exceptions, all the members of a congregation, above a certain age, go to the table of the Lord, and that any parent, who is a communicant, receives, as a matter of course, baptism for his child. The Ross-shire fathers [in the highlands of Northern Scotland] held, that though in general, the two sacraments were equally seals of the covenant of grace, they do in some respects differ, even as sealing ordinances; that baptism, being the door of admission into the visible Church, a larger exercise of charity is required in dealing with applicants for that sacrament, than is called for in administering the other, which implies a confirmation of those who were members before; that the lessons of baptism are more elementary than those of the sacrament of the Supper; that the connection of the child, and of both the parents, with an ordinary case of infant baptism, calls for peculiar tenderness on the part of church rulers; and that the rule of Scripture requires baptism to be given, on an uncontradicted profession of faith, while an accredited profession is required to justify the church, in granting admission to the table of the Lord. The result of carrying these views into practice is well known; the number of members in full communion is comparatively small, and parents who have never communicated, receive baptism for their children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-kennedy-of-dingwall.html">John Kennedy of Dingwall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Days of the Fathers in Ross-shire</cite>, ch. 4, pp. 132-33</span></figcaption>

<blockquote><p>I confess when the fault is ceremonial, though the punishment be real, as the cutting off of an infant not circumcised [Gen. 17:14], and some punishments inflicted on the leper, it is not reason the law should oblige us in the New Testament, either as touching the punishment or the degree. Because these punishments for typical faults are ordained to teach rather than to be punishments, and the magistrate by no light of nature could make laws against unbaptized infants.</p></blockquote>

</figure><figure class="quote" id="q-5c0ff4ccae" data-kw="">
<blockquote><p>The subject of baptism is the faithful people of God, without any distinction of nation, sex, or age. Indeed, infants of the covenanted must be baptized as equally as the infants of the covenanted were once circumcised because the promise made to Abraham and His seed, Christ having been revealed, was not diminished but enlarged through the mouth of Peter: “The promise is yours and your children’s” (Acts 2:39). In this argument St. Peter commanded each one (ἕκαστον) to be baptized (Acts 2:38). Indeed, the Israelites, who once were “near,” and the faithful from the Gentiles, who once were “far off” (Acts 2:39), are held with no distinction under the New Testament (Gal. 3:28). For the children of the faithful Gentile, notwithstanding infidelity of the other parent, are “holy” (1 Cor. 7:14). Therefore, since baptism as equally as circumcision seals that covenant for those who believe, into which their children have been received as holy, in the same right baptism is administered to these as circumcision once was to those. For Christ commanded “to make disciples and to baptize the nations,” with no distinction of age (Matt. 28:19). Therefore, those who are born in the lap of the church are fit at the age of infant to begin the institution and must be baptized as equally as their parents. Therefore, the apostles baptized whole “households” (1 Cor. 1:16). (XXII–XXVI).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Christian Theology</cite>, 24.9, trans. Casey Carmichael, Classic Reformed Theology (Reformation Heritage Books, 2019), 179.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-8511263fc1" data-kw="">
<blockquote><p>Objection [from a baptist]: The sanctification of the wife is but a civil sanctification in that place, i.e. she is sanctified to his use, that he ought not to put her away. Again, the holiness there spoken of is a fruit of that sanctification of the wife, whereof it will follow, that seeing [as] the effect cannot be greater then the cause, the cause cannot produce a greater effect than itself, the cause being only a civil sanctification, the holiness of the children must be the same; thus argues Thomas Collier. Answer 1: The question [in the text] was, Whether the believer were polluted by his unbelieving wife? The apostle says, ‘No’, quia pluris est pietas unius ad sanctificandum conjugium,quàm alterius impietas ad inquinandum, i.e. the faith of the believer is of greater force to sanctify their present cohabitation, than the unbelief of the other to pollute it. This he proves from a greater effect and fruit of the husband’s faith, viz. the holiness of the children born of such a husband by such a woman. The children are holy, not only civilly, as being born of lawful wedlock, but federally as being severed from all children of unbelievers by special prerogative, holy to the Lord, consecrated unto Him, whereas by nature they were aliens and unclean; according to that of Paul, Rom. 11:16, ‘if the root be holy, so are the branches.’ The faith of the believing party sanctifies the unbelieving wife to bear not only a lawful, but a holy seed; yea, it sanctifies the children and severs them from the common condition of other children, which are profane and unclean without the Church, without God in the world.

2. Note that the holiness of the child received from one of the parents believing is more than the sanctification of the wife by her believing husband, because such a wife is not taken into Covenant with her husband, but the child is; and therefore the apostle says not that such as is the sanctification of the wife, such is the holiness of the child: But thus, Such as is the holiness of the believing party, such is the child’s holiness in respect of Church-membership; and so the faith of the believing husband is the cause of both these effects, viz. That his coupling with his wife is not impure, and also that his children are holy: And this latter [is] an evidence of the former. And thus the holiness of the child is a sign of the mother’s sanctification to holy cohabitation, and an effect of the father’s faith by virtue of God’s Covenant. To have said, ‘That their children were lawful’, was no more than to have said, ‘That their marriage was lawful’, which was not the question; But to say, that the children of their lawful marriage were holy, this did infer not only the lawfulness of their marriage but the sanctified use: As Mr Baily has well observed, Of Anabaptism, p. 138.

3. Lastly, If by holy, be only meant a civil holiness, then on the contray, by ‘unclean’, must be meant a civil uncleanness. But when Paul says (else were your children unclean) his intent is not to make them all as an unclean birth and impure offspring, which were born at Corinth of unbelieving parents, but to show that they are not comprehended within God’s Covenant: And so when he says ‘but now are they holy’, he notes some preeminence of the children of Christians above the heathens’ children: Though in civil respects, in respect of a lawful birth, both sorts of children were equal, yet that civil holiness being common to both, there is a preeminence of the Christian’s child above the heathen’s. The child of an infidel at Corinth is today unclean and the next day holy in case his parents turn Christians; And what’s the reason of this so sudden alteration? It must needs be in regard of the Covenant into which the party now believing is taken with his children, his unbelieving neighbor with his children still remaining unclean: Hence I conclude with Calvin, in location, Seeing our children are exempted from the common condition of lost mankind, and admitted into God’s Church and family, Cur eos a signo arceamus? upon what reason can we drive them from the sign of their admittance?</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Objection [from a baptist]: The sanctification of the wife is but a civil sanctification in that place, i.e. she is sanctified to his use, that he ought not to put her away. Again, the holiness there spoken of is a fruit of that sanctification of the wife, whereof it will follow, that seeing [as] the effect cannot be greater then the cause, the cause cannot produce a greater effect than itself, the cause being only a civil sanctification, the holiness of the children must be the same; thus argues Thomas Collier. Answer 1: The question [in the text] was, Whether the believer were polluted by his unbelieving wife? The apostle says, ‘No’, quia pluris est pietas unius ad sanctificandum conjugium,quàm alterius impietas ad inquinandum, i.e. the faith of the believer is of greater force to sanctify their present cohabitation, than the unbelief of the other to pollute it. This he proves from a greater effect and fruit of the husband’s faith, viz. the holiness of the children born of such a husband by such a woman. The children are holy, not only civilly, as being born of lawful wedlock, but federally as being severed from all children of unbelievers by special prerogative, holy to the Lord, consecrated unto Him, whereas by nature they were aliens and unclean; according to that of Paul, Rom. 11:16, ‘if the root be holy, so are the branches.’ The faith of the believing party sanctifies the unbelieving wife to bear not only a lawful, but a holy seed; yea, it sanctifies the children and severs them from the common condition of other children, which are profane and unclean without the Church, without God in the world.

3. Lastly, If by holy, be only meant a civil holiness, then on the contray, by ‘unclean’, must be meant a civil uncleanness. But when Paul says (else were your children unclean) his intent is not to make them all as an unclean birth and impure offspring, which were born at Corinth of unbelieving parents, but to show that they are not comprehended within God’s Covenant: And so when he says ‘but now are they holy’, he notes some preeminence of the children of Christians above the heathens’ children: Though in civil respects, in respect of a lawful birth, both sorts of children were equal, yet that civil holiness being common to both, there is a preeminence of the Christian’s child above the heathen’s. The child of an infidel at Corinth is today unclean and the next day holy in case his parents turn Christians; And what’s the reason of this so sudden alteration? It must needs be in regard of the Covenant into which the party now believing is taken with his children, his unbelieving neighbor with his children still remaining unclean: Hence I conclude with Calvin, in location, Seeing our children are exempted from the common condition of lost mankind, and admitted into God’s Church and family, Cur eos a signo arceamus? upon what reason can we drive them from the sign of their admittance?”

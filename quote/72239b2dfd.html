<main class="wrap"><figure class="quote" id="q-72239b2dfd" data-kw="">
<blockquote><p>Superstition is an offering somewhat as pleasing to God, which is not pleasing to Him. All Christians have some degree of this in matter or manner; for we know but in part, and prophesy in part, etc. And so [it is the logical consequence of separatistic principles that] no Christians must join with others. But must they not give over all religious duty themselves, seeing their own defects more defile them than other men’s [defects]?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes</cite>, … (London: 1684), pt. 2, p. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f034a947f8" data-kw="">
<blockquote><p>V. 11. Where it is told David that in respect he intended to build a house to God, the Lord likewise should make him a house. We see that the Lord will not suffer the good and laudable intentions of the godly to be unrewarded: much more their pious and commendable actions, no, not a cup of cold water given to one of his, which shall want its reward. Which should be a great encouragement to pious and good works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-guild.html">William Guild</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Throne of David</cite>, (d. 1657; Oxford, 1659), on ch. 7:1-18, p. 131</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“V. 11. Where it is told David that in respect he intended to build a house to God, the Lord likewise should make him a house. We see that the Lord will not suffer the good and laudable intentions of the godly to be unrewarded: much more their pious and commendable actions, no, not a cup of cold water given to one of his, which shall want its reward. Which should be a great encouragement to pious and good works.”

</figure><figure class="quote" id="q-97c5d66a90" data-kw="">
<blockquote><p>[Gen. 22] Verse 12: ‘Seeing for my sake thou hast not spared thine only son.’ God accepts the resolute purpose and will of Abraham for the done deed. An obedient will then is accepted before God as the work itself: as the Apostle says, ‘If first there be a willing mind, God accepts it according to that a man has, not according to that he has not, 2 Cor. 8:12. [So Wolfgang] Musculus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla in Genesin &amp; Exodum: that is, A Sixfold Commentary</cite>, … (d. 1621; London: 1633) | on Gen. 22, 4. Places of Doctrine, 3rd doctrine, p. 206</span></figcaption>

</figure><figure class="quote" id="q-b4b7c5b1a8" data-kw="">
<blockquote><p>Even after Joseph had died, they observed circumcision (as seems must be gathered from Ex. 4:25), and were also intent upon prayers (Ex. 2:23); they certainly desired sacrifices, but did not sacrifice, being deterred by fear of the Egyptians (Ex. 8:26), yet at the same time when about to flee they sacrificed the Passover in Egypt (Ex. 12). Besides those points, hardly anything is mentioned about their divine worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), bk. 8, ch. 2, sect. 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-b63b9a35a4" data-kw="">
<blockquote><p>…although there is not the least part of Christ’s ordinances that can be neglected without grievous sin, yet the want [lack] or neglect of some of these ordinances of Christ, which concern the discipline of his Church and the outward calling of the ministers is no such sin as can make either the ministers and governors of our Church Antichrists or our Church an Antichristian and false Church [as the separatists claimed].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Ministry of the Church of England</cite>, [for joining] written for it [by Hildersham], the other against it [by Francis Johnson] (Low Countries, 1595), section 3, p. 17</span></figcaption>

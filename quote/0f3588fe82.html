<blockquote><p>To make him just who is just is no work for God—that were a labor for a fool; but to make him just who is unjust—that is work for infinite love and mercy. To justify the ungodly—this is a miracle worthy of a God.</p></blockquote>
<figcaption>— <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a>, <cite>All of Grace</cite>, &quot;God Justifieth the Ungodly,&quot; p. 11</figcaption>

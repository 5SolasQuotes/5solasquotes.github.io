<main class="wrap"><figure class="quote" id="q-019380f2df" data-kw="">
<blockquote><p>Those who seek to be justified through the works of the Law not only fail to crucify their flesh but even increase its lusts—so far are they from being able to be justified. For the Law is the strength of sin (1 Corinthians 15:56) in that it stimulates lust and its contrary inclination even while forbidding it. But since faith in Christ loves the Law, which forbids lust, it now does the very thing the Law commands; it attacks and crucifies lust.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Day by Day: 365 Devotional Readings with Martin Luther. Concordia Publishing House. Kindle Edition</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b7b3b35434" data-kw="">
<blockquote><p>By ‘works’ here [Rev. 20:12-13] are we judged and justified, and not by faith only, as also James 2:24 testifies, meaning hereby that of lively faith and of the good works that follow thereupon man is justified, and not of that dead faith that is by itself alone, without any good works: otherwise were the words of Paul (Rom. 3:28) express contrary to this text, and to James; for, says Paul, ‘We are justified by faith, without the works of the Law,’ that is to say, not without good works whatsoever, but meaning that we are justified by lively faith with such small good works as our weak nature will suffer that faith to produce, although it be without the precise works that the Law requires: and for confirmation of this interpretation, and union of these texts, ye shall find both James and Paul agree in diverse places, that faith without works is a dead faith, and serves nothing to justification. And again, they agree both that all works (how good soever they seem) that proceed not from faith, are evil. And so it is all one to say with Saint Paul, We are justified by fruitful faith, or faith that produces good works, although not the works that the Law requires, or to say with James, and here with Saint John, we are justified by faithful works, seeing a working faith and faithful works are inseparable, and none can have the one without the other. So for conclusion, these works, by the which here we are judged, are to be esteemed good or evil, not in themselves, or insofar as they satisfy the Law (for so were all works evil and imperfect), but insofar forth as they have or want faith adjoined with them, they are accounted good or evil only.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-napier.html">John Napier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain Discovery of the Whole Revelation of St. John</cite>, … (Edinburgh: Waldegrave, 1593), ch. 20, pp. 242-43 Napier (1550-1617) was a Scottish mathematician (who discovered logariths), physicist and astronomer in the reformed tradition.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><figure class="quote" id="q-86d39f2348" data-kw="">
<blockquote><p>1. That righteouseness whereby we are justified before God is the fulfilling of God’s law.

2. Legal justice is the fulfilling of the law, performed by him which is named just.

3. Evangelical justice is the punnishment of our sins, which Christ endured for us, freely imputed by God to them that believe.

4. Since the fall of man no man besides Christ alone in this life is justified before God by the righteouseness of the law.

5. We are justified only by faith in Christ.

6. And yet the righteousness of the law must in this life be begun in all that will be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rules &amp; Axions of Certain Chief Points of Christianity in A Collection of Certain Learned Discourses</cite>, … (d. 1587; Oxford, 1600), 22. ‘Of Man’s Justification before God’, pp. 271-72</span></figcaption>

</figure><figure class="quote" id="q-b321398473" data-kw="">
<blockquote><p>Therefore, we explain justification simply as the acceptance with which God receives us into his favor as righteous men. And we say that it consists in the remission of sins and the imputation of Christ’s righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.12.</span></figcaption>

— John Calvin, Institutes of the Christian Religion, 3.11.12.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTherefore%2C+we+explain+justification+simply+as+the+acceptance+with+which+God+receives+us+into+his+favor+as+righteous+men.+And+we+say+that+it+consists+in+the+remission+of+sins+and+the+imputation+of+Christ%E2%80%99s+righteousness.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.11.12.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb321398473.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b321398473.html">Permalink</a><a class="src" href="https://heidelblog.net/2024/11/calvin-taught-both-remission-and-imputation/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-a06625619a" data-kw="">
<blockquote><p>Is the law of the Lord perfect, and does it require that our obedience be perfect in its principles, parts, degrees, and continuance? It is impossible, then, that sincere obedience can entitle a sinner to eternal life. A man’s faith may be sincere, but if it is not perfect it cannot be a proper condition of life; it cannot procure for him a right to eternal life. His repentance also may be deep and sincere, but if it is not absolutely perfect, it cannot afford him the smallest title either to the progress or the consummation of life eternal.3 His obedience, in general, may be sincere, yet if it is not absolutely perfect, it cannot give him the smallest degree of title to eternal salvation. These cannot entitle him in the smallest degree to life, either according to the law as a covenant of works or as a rule of life. They are necessary as parts of salvation and as means of attaining complete salvation, but they cannot be the grounds of a man’s title to salvation. Nothing can be the ground of a believer’s title to salvation but the perfect righteousness of Jesus Christ, received by faith and imputed to him for justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 76.</span></figcaption>

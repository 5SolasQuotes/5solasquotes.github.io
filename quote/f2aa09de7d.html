<blockquote><p>His [Knewstubs’s] objection against the cross consisted of three interrogatories: 1. Whether the Church had power to institute an external significant sign? To which was replied: First, that he did mistake the use of the cross with us, which was not used in baptism any otherwise than only as a ceremony. Secondly, by their own example, who make imposition of hands in their ordination of pastors to be a sign significant. Thirdly, in prayer, says the Bishop of Winton, the kneeling on the ground, the lifting up of our hands, the knocking of our breasts are ceremonies significant: the first, of our humility coming before the mighty God, the second, of our confidence and hope, the other of our sorrow and detestation of our sins, and these are, and may lawfully be used. Lastly, M. Deane of the chapel, remembered the practice of the Jews, who unto the institution of the Passeover, prescribed unto them by Moses, had as the rabbins witness added both signs and words, eating sour herbs and drinking wine, with these words to both, ‘Take, and eat these in remembrance, etc. Drink this in remembrance, etc.’ Upon which addition and tradition of theirs, our Sauiour instituted the sacrament of his Last Supper, in celebrating it with the same words and after the same manner; thereby approving that fact of theirs in particular; and generally, that a Church may institute and retain a sign significant: which satisfied his Maiesty exceeding well. And here the king desired, to have himself made acquainted about the antiquity of the use of the cross. Which Doctor [John] Reynolds confessed to have been ever since the apostles times, but this was the difficulty, to prove it of that ancient use in baptism… it fell from one, I think it was my Lord of Winchester, obiter, to say, that, in Constantine’s time it was used in baptism. What, quoth the King, and is it now come to that pass that we shall appeach Constantine of Popery and superstition; if then it were used, says his Majesty, I see no reason but that still we may continue it. Mr. Knewstubs’s second question was that, put [the] case [that] the Church had such power to add significant signs, whether it might there add them where Christ had already ordained one; which he said, was no less derogatory to Christ’s institution, as he thought, than if any potentate of this land should presume to add his seal unto the great seal of England. To which his Majesty answered that the case was not alike, for that no sign or thing was added to the sacrament, which was fully and perfectly finished, before any mention of the cross is made; for confirmation whereof, he willed the place to be read [in the Book of Common Prayer]. Lastly, if the Church had that power also, yet the greatest scruple to their conscience was, how far such an ordinance of the Church was to bind them, without impeaching their Christian liberty? Whereat the king, as it seemed, was much moved, and tolde him he would not argue that point with him, but answer therein as kings are wont to speak in Parliament, Le Roy J’auisera: adding withall, that it smelled very rankly of Anabaptism: comparing it unto the usage of a beardless boy (one Mr. John Black) who the last Conference his Majesty had with the ministers in Scotland (in December, 1602) told him that he would hold conformity with his Majesty’s ordinances for matters of doctrine: but for matters of ceremony, they were to be left in Christian liberty unto every man as he received more and more light from the illumination of God’s Spirit; even till they go mad, quoth the king, with their own light: but I will none of that, I will have one doctrine and one discipline, one religion in substance, and in ceremony: and therefore I charge you, never speak more to that point (how far you are bound to obey?) when the Church has ordained it. And so asked them again, if they had anything else to say? Dr. Reynolds objected the example of the brasen serpent, demolished and stamped to powder by Ezekiel, because the people abused it to idolatry: wishing, that, in like sort, the cross should be abandoned, because in the time of Popery it had been superstitiously abused. Whereunto the King’s Majesty answered diverse ways. First, quoth he, though I be sufficiently persuaded of the cross in baptism, and the commendable use thereof in the Church so long: yet, if there were nothing else to move me, this very argument were an inducement to me for the retaining of it, as it is now by order established: For, inasmuch, as it was abused, so you say, to superstition in time of popery, it does plainly imply, that it was well used before Popery. I will tell you, I haue lived among this [dissenting] sort of men (speaking to the lords and bishops) ever since I was ten years old, but I may say of myself as Christ did of Himself: Though I lived amongst them, yet since I had ability to judge, I was never of them; neither did anything make me more to condemn and detest their courses than that they did so peremptorily disallow of all things which at all had been used in Popery. For my part, I know not how to answer the objection of the Papists, when they charge us with novelties: but truly to tell them that their abuses are new, but the things which they abused we retain in their primitive use, and forsake only the novel corruption. By this argument we might renounce the Trinity and all that is holy, because it was abused in Popery (and speaking to Doctor Reynolds merely) they used to wear hose and shoes in Popery, therefore, you shall, now, go barefoot. Secondly, quoth his Majesty, what resemblance is there between the brazen serpent, a material visible thing, and the sign of the cross made in the air? Thirdly, I am given to understand by the bishops, and I find it true, that the Papists themselves did never ascribe any power or spiritual grace to the sign of the cross in baptism. Fourthly, you see, that the material crosses, which in time of Popery were made, for men to fall down before them, as they passed by them, to worship them (as the idolatrous Jews did the brazen serpent) are demolished, as you desire.</p></blockquote>

<blockquote><p>If the Church prescribe anything lawfully, so that she prescribe no more than she has power given her to prescribe, her ordinance must be accompanied with some good reason and warrant given for the satisfaction of tender consciences… It becomes not the spouse of Christ, endued with the spirit of meekness, to command anything imperiously, and without a reason given… Tertullian’s testimony is known (in Apologet.): Nulla lex, etc. ‘No law (says he) owes to itself alone the conscience of its equity, but to those from whom it expects obedience. Moreover, it is a suspected law which will not have itself to be proved, but a wicked law, which not being proved, yet bears rule.’… Neither can the Church prescribe anything lawfully which she shows not to have been convenient, even before her determination. … If the ceremonies be lawful to us because the law and ordinance of the Church prescribes them, then either the bare and naked prescription of the Church, having no other warrant than the Church’s own authority, make them to be thus lawful; or else the law of the Church, as grounded upon and warranted by the law of God and nature… If they take them (as needs they must) to the latter part, then let them either say that the ceremonies are lawful unto us, because the Church judges them to be agreeable to the law of God and nature, or because the Church proves unto us, by evident reasons, that they are indeed agreeable unto these laws. If they yield us the latter, then it is not the Church’s law, but the Church’s reasons given for her law, which can warrant the lawfulness of them unto us; which does elude and elide all that which they allege for the lawfulness of them from the power and authority of the Church. And further, if any such reasons be to be give forth for the ceremonies, why are they so long kept up from us?… It will be answered (I know), that if they Church command anything repugnant to God’s Word we are not bound to do it, nor to receive it as lawful, though the Church judge so of it; but otherwise, if that which the Church judges to be agreeable to the law of God and nature (and in that respect prescribes) be not repugnant to the Word of God, but in itself indifferent, then are we to embrace it as convenient, and consonant to the law of God and nature, neither ought we to call in question the lawfulness of it. But I reply, that [in this case] either we must judge a thing to be repugnant or not repugnant to the Word, to be indifferent or not indifferent in itself, [merely] because the Church judges so of it [which is insufficient to conscience], or else because the Church proves unto us by an evident reason that it is so… the argument is still set afoot [incomplete]; then we must receive everything (be it ever so bad) as indifferent, if only the Church happen so to judge of it; for quod competit alicui qua tale, etc. So that if we receive anything as indifferent, for this respect, because the Church judges it to be so, then shall we receive everything for indifferent which the Church shall so judge of [which is absurd].</p></blockquote>

<div class="actions"><button class="copy" data-copy="“If the Church prescribe anything lawfully, so that she prescribe no more than she has power given her to prescribe, her ordinance must be accompanied with some good reason and warrant given for the satisfaction of tender consciences… It becomes not the spouse of Christ, endued with the spirit of meekness, to command anything imperiously, and without a reason given… Tertullian’s testimony is known (in Apologet.): Nulla lex, etc. ‘No law (says he) owes to itself alone the conscience of its equity, but to those from whom it expects obedience. Moreover, it is a suspected law which will not have itself to be proved, but a wicked law, which not being proved, yet bears rule.’… Neither can the Church prescribe anything lawfully which she shows not to have been convenient, even before her determination. … If the ceremonies be lawful to us because the law and ordinance of the Church prescribes them, then either the bare and naked prescription of the Church, having no other warrant than the Church’s own authority, make them to be thus lawful; or else the law of the Church, as grounded upon and warranted by the law of God and nature… If they take them (as needs they must) to the latter part, then let them either say that the ceremonies are lawful unto us, because the Church judges them to be agreeable to the law of God and nature, or because the Church proves unto us, by evident reasons, that they are indeed agreeable unto these laws. If they yield us the latter, then it is not the Church’s law, but the Church’s reasons given for her law, which can warrant the lawfulness of them unto us; which does elude and elide all that which they allege for the lawfulness of them from the power and authority of the Church. And further, if any such reasons be to be give forth for the ceremonies, why are they so long kept up from us?… It will be answered (I know), that if they Church command anything repugnant to God’s Word we are not bound to do it, nor to receive it as lawful, though the Church judge so of it; but otherwise, if that which the Church judges to be agreeable to the law of God and nature (and in that respect prescribes) be not repugnant to the Word of God, but in itself indifferent, then are we to embrace it as convenient, and consonant to the law of God and nature, neither ought we to call in question the lawfulness of it. But I reply, that [in this case] either we must judge a thing to be repugnant or not repugnant to the Word, to be indifferent or not indifferent in itself, [merely] because the Church judges so of it [which is insufficient to conscience], or else because the Church proves unto us by an evident reason that it is so… the argument is still set afoot [incomplete]; then we must receive everything (be it ever so bad) as indifferent, if only the Church happen so to judge of it; for quod competit alicui qua tale, etc. So that if we receive anything as indifferent, for this respect, because the Church judges it to be so, then shall we receive everything for indifferent which the Church shall so judge of [which is absurd].”

— George Gillespie, English-Popish Ceremonies (1637), Pt. 3, Ch. 7, Sections 7, pp. 131-3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+the+Church+prescribe+anything+lawfully%2C+so+that+she+prescribe+no+more+than+she+has+power+given+her+to+prescribe%2C+her+ordinance+must+be+accompanied+with+some+good+reason+and+warrant+given+for+the+satisfaction+of+tender+consciences%E2%80%A6+It+becomes+not+the+spouse+of+Christ%2C+endued+with+the+spirit+of+meekness%2C+to+command+anything+imperiously%2C+and+without+a+reason+given%E2%80%A6+Tertullian%E2%80%99s+testimony+is+known+%28in+Apologet.%29%3A+Nulla+lex%2C+etc.+%E2%80%98No+law+%28says+he%29+owes+to+itself+alone+the+conscience+of+its+equity%2C+but+to+those+from+whom+it+expects+obedience.+Moreover%2C+it+is+a+suspected+law+which+will+not+have+itself+to+be+proved%2C+but+a+wicked+law%2C+which+not+being+proved%2C+yet+bears+rule.%E2%80%99%E2%80%A6+Neither+can+the+Church+prescribe+anything+lawfully+which+she+shows+not+to+have+been+convenient%2C+even+before+her+determination.+%E2%80%A6+If+the+ceremonies+be+lawful+to+us+because+the+law+and+ordinance+of+the+Church+prescribes+them%2C+then+either+the+bare+and+naked+prescription+of+the+Church%2C+having+no+other+warrant+than+the+Church%E2%80%99s+own+authority%2C+make+them+to+be+thus+lawful%3B+or+else+the+law+of+the+Church%2C+as+grounded+upon+and+warranted+by+the+law+of+God+and+nature%E2%80%A6+If+they+take+them+%28as+needs+they+must%29+to+the+latter+part%2C+then+let+them+either+say+that+the+ceremonies+are+lawful+unto+us%2C+because+the+Church+judges+them+to+be+agreeable+to+the+law+of+God+and+nature%2C+or+because+the+Church+proves+unto+us%2C+by+evident+reasons%2C+that+they+are+indeed+agreeable+unto+these+laws.+If+they+yield+us+the+latter%2C+then+it+is+not+the+Church%E2%80%99s+law%2C+but+the+Church%E2%80%99s+reasons+given+for+her+law%2C+which+can+warrant+the+lawfulness+of+them+unto+us%3B+which+does+elude+and+elide+all+that+which+they+allege+for+the+lawfulness+of+them+from+the+power+and+authority+of+the+Church.+And+further%2C+if+any+such+reasons+be+to+be+give+forth+for+the+ceremonies%2C+why+are+they+so+long+kept+up+from+us%3F%E2%80%A6+It+will+be+answered+%28I+know%29%2C+that+if+they+Church+command+anything+repugnant+to+God%E2%80%99s+Word+we+are+not+bound+to+do+it%2C+nor+to+receive+it+as+lawful%2C+though+the+Church+judge+so+of+it%3B+but+otherwise%2C+if+that+which+the+Church+judges+to+be+agreeable+to+the+law+of+God+and+nature+%28and+in+that+respect+prescribes%29+be+not+repugnant+to+the+Word+of+God%2C+but+in+itself+indifferent%2C+then+are+we+to+embrace+it+as+convenient%2C+and+consonant+to+the+law+of+God+and+nature%2C+neither+ought+we+to+call+in+question+the+lawfulness+of+it.+But+I+reply%2C+that+%5Bin+this+case%5D+either+we+must+judge+a+thing+to+be+repugnant+or+not+repugnant+to+the+Word%2C+to+be+indifferent+or+not+indifferent+in+itself%2C+%5Bmerely%5D+because+the+Church+judges+so+of+it+%5Bwhich+is+insufficient+to+conscience%5D%2C+or+else+because+the+Church+proves+unto+us+by+an+evident+reason+that+it+is+so%E2%80%A6+the+argument+is+still+set+afoot+%5Bincomplete%5D%3B+then+we+must+receive+everything+%28be+it+ever+so+bad%29+as+indifferent%2C+if+only+the+Church+happen+so+to+judge+of+it%3B+for+quod+competit+alicui+qua+tale%2C+etc.+So+that+if+we+receive+anything+as+indifferent%2C+for+this+respect%2C+because+the+Church+judges+it+to+be+so%2C+then+shall+we+receive+everything+for+indifferent+which+the+Church+shall+so+judge+of+%5Bwhich+is+absurd%5D.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English-Popish+Ceremonies+%281637%29%2C+Pt.+3%2C+Ch.+7%2C+Sections+7%2C+pp.+131-3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8b4283b22d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8b4283b22d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-arbitrary-laws-commands/#:~:text=If%20the%20Church%20prescribe%20anything%20lawfully,so%20judge%20of%20%5Bwhich%20is%20absurd&amp;text=If%20the%20Church%20prescribe%20anything%20lawfully%2C%20so%20that&amp;text=Church%20shall%20so%20judge%20of%20%5Bwhich%20is%20absurd" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-33555008ae" data-kw="">
<blockquote><p>Question. After the ministry of the Word and the seals, how is the freewill-offering, or collection for the saints, to be administered? Answer:

1. For the time, it is to be made every Lord’s Day, which is the first day of the week.

2. For the measure, as God hath prospered every man. 3 For the manner; not of constraint, but freely, and to be presented, as an offering to the Lord, and laid down, as at first before the apostles, so afterward, by their appointment, before the deacons of church, as into a common treasury.</p></blockquote>

<blockquote><p>…still I deny that they have been set over believers as legislators to prescribe a rule of life at their own hands, or bind the people committed to them to their decrees. When I say this, I mean that they are not at all entitled to insist that whatever they devise without authority from the Word of God shall be observed by the Church as matter of necessity. Since such power was unknown to the apostles, and was so often denied to the ministers of the Church by our Lord himself, I wonder how any have dared to usurp, and dare in the present day to defend it, without any precedent from the apostles, and against the manifest prohibition of God.</p></blockquote>

</figure><figure class="quote" id="q-75f5ec9c12" data-kw="">
<blockquote><p>That which no law of God or valid law of man forbids, is not unlawful: but the use of the things forementioned, no law of God or valid law of man forbids: Therefore the use of the things forementioned, is not unlawful. He that will say that there is any such law must show that law and prove his affirmative: But let him take heed of adding to God’s law: A false prophet that fathered a false message from God was an heinous sinner. Is it not worse falsely to father a law on Him?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes</cite>, … (London: 1684), pt. 2, p. 10</span></figcaption>

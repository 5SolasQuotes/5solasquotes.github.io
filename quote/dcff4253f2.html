<blockquote><p>Not to lay undue stress on the first word, “Remember,” although that word does seem to imply that this is not the first time that the Sabbath has been spoken of, and to refer us back to the original appointment at the creation, — it is well worthy of notice that what is enjoined at the beginning, and what is said to be blessed at the end of the precept, is not the seventh-day, but the Sabbath-day.

What this commandment fixes, is, not the relation of the day of holy rest to the other days of the week — that was determined by the original institution — but the proportion of time to be devoted to sacred purposes, as compared with that to be employed in secular pursuits. So that there is no necessity for supposing that the commandment was altered or repealed at the time when the change was made from the seventh to the first day of the week.

The first-day Sabbath, observed by us now, is as strictly and properly the seventh day, following as it does six days of labour, as the Sabbath which was kept by the Patriarchs and Jews. If this be the correct view — if this commandment specifies merely the proportion of time, and not the particular day — not the seventh, but a seventh-day — six days of labour and one day of rest — every seventh day a Sabbath, — and we can see nothing deserving the name of “quirk” or “quibble” in such an interpretation, — then there is no need to suppose that any part of it was positive, or that any part of it has been abrogated by Christ.

The whole precept, in all its integrity, stands there among the rest, as a portion of the moral law, unrepealed, immutable — as binding upon man now, as on the day when it was first revealed. It is no merely positive enactment that has strangely found its way into a place — and that place most conspicuous and honourable — among a number of others that are moral. And if it be our duty still, in obedience to the other commandments with which it is associated, to worship Jehovah only, to revere His holy name, to honour our father and mother, to abstain from murder, adultery, theft, falsehood, and covetousness, — it is equally our duty still, under the same authority, and by the sanction of the same law, to “remember the Sabbath-day to keep it holy.”

Mark too, in confirmation of this, how, while the Passover, to which the Sabbath has frequently been compared, was rigidly restricted to the Jews — “There shall no stranger eat thereof,” — the keeping of the Sabbath is expressly enjoined, not only upon the Hebrew and his family, but on “the stranger within his gate.” And the same conclusion follows from the reason assigned for the observance, in which there is. nothing national or local, nothing peculiarly interesting to the Jews more than to any other people:— “For in six days the Lord made heaven and earth.</p></blockquote>

<blockquote><p>Obj. 8. The law is the letter which killeth, and is the ministration of death and condemnation. (2 Cor. 3:6, 7.) But there is no condemnation to Christians. Therefore, the law does not have respect to Christians who are in Christ Jesus. Ans. There is here a fallacy of accident; for the law is not in itself the letter which killeth; since this comes to pass by the fault of men, who, the more clearly they perceive the difference between themselves and the law, the more fully do they give themselves over to despair in reference to their salvation, and are therefore slain by the law. Again, the law alone, without the gospel, is the letter, that is, it is the doctrine which merely teaches, demands obedience, denounces the wrath of God and death to such as are disobedient, without producing the spiritual obedience which it requires. But when it is joined with the gospel, which is the Spirit, it also commences to become the Spirit, which is effectual in the godly, inasmuch as those who are regenerated commence willingly and cheerfully to yield obedience to the law. The law, therefore, is the letter, 1. By itself and without the gospel. 2. In respect to those who are unregenerated. On the other hand, the gospel is the Spirit; that is, it is the ministration and means through which the Holy Ghost, which works spiritual obedience in us, is given; not indeed as though all who hear, would receive the Holy Ghost and be regenerated, but because faith, by which our hearts are quickened, so that they begin to yield obedience to the law, is received by it. It does not follow, therefore, that the law is no longer to be taught in the church; for Christ himself says: “I am not come to destroy the law, but to fulfill it.” (Matt. 5:17.) And Paul also says, that we establish the law through faith. (Rom. 3:31.) Christ fulfilled the law in two respects: by obedience and suffering. He was just and holy in himself and did not violate the law in a single instance, but partly performed in our behalf those things which he was not bound to do, and partly sustained the punishment of the law. He also fulfills the law in us in two ways, by teaching it and granting unto us his Spirit, that so we may commence obedience to it, as we proved when speaking of the abrogation of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Commentary of Dr. Zacharias Ursinus on the Heidelberg Catechism</cite>, trans. George W. Williard (Cincinnati: Elm Street Printing Company, 1888), 616–18.</span></figcaption>

<blockquote><p>The law as a rule of life is also of great use to believers. … Now in this point of view, it serves in the following ways, under the illuminating influences of the Holy Spirit: …To show them how far they are from perfection of holiness. In order to render them humbler and more contrite; to cause them to renounce, in a higher degree, all confidence in their own wisdom, righteousness, and strength; and to trust constantly and only in the Lord Jesus for all their salvation, the law discovers to them the sin that dwells in them and that cleaves to all their thoughts, words, and actions. It is of great use to teach them the need that they have to be more humble, penitent, and holy. And so it serves, in a high degree, to promote their sanctification and their desire to attain perfection of holiness (Rom. 7:22–24; Phil. 3:10–14). As it requires them to be holy in a perfect degree (Matt. 5:48), it shows them that their want of perfect conformity to it is, every moment, their sin and that they ought continually to press on toward perfection and long for heaven, where their holiness and happiness will be perfect (2 Cor. 5:2–4; Phil. 1:23).</p></blockquote>

— John Colquhoun, A Treatise on the Law and Gospel, (Grand Rapids: Reformation Heritage Books), 117-18.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+law+as+a+rule+of+life+is+also+of+great+use+to+believers.+%E2%80%A6+Now+in+this+point+of+view%2C+it+serves+in+the+following+ways%2C+under+the+illuminating+influences+of+the+Holy+Spirit%3A+%E2%80%A6To+show+them+how+far+they+are+from+perfection+of+holiness.+In+order+to+render+them+humbler+and+more+contrite%3B+to+cause+them+to+renounce%2C+in+a+higher+degree%2C+all+confidence+in+their+own+wisdom%2C+righteousness%2C+and+strength%3B+and+to+trust+constantly+and+only+in+the+Lord+Jesus+for+all+their+salvation%2C+the+law+discovers+to+them+the+sin+that+dwells+in+them+and+that+cleaves+to+all+their+thoughts%2C+words%2C+and+actions.+It+is+of+great+use+to+teach+them+the+need+that+they+have+to+be+more+humble%2C+penitent%2C+and+holy.+And+so+it+serves%2C+in+a+high+degree%2C+to+promote+their+sanctification+and+their+desire+to+attain+perfection+of+holiness+%28Rom.+7%3A22%E2%80%9324%3B+Phil.+3%3A10%E2%80%9314%29.+As+it+requires+them+to+be+holy+in+a+perfect+degree+%28Matt.+5%3A48%29%2C+it+shows+them+that+their+want+of+perfect+conformity+to+it+is%2C+every+moment%2C+their+sin+and+that+they+ought+continually+to+press+on+toward+perfection+and+long+for+heaven%2C+where+their+holiness+and+happiness+will+be+perfect+%282+Cor.+5%3A2%E2%80%934%3B+Phil.+1%3A23%29.%E2%80%9D%0A%0A%E2%80%94+John+Colquhoun%2C+A+Treatise+on+the+Law+and+Gospel%2C+%28Grand+Rapids%3A+Reformation+Heritage+Books%29%2C+117-18.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F80dd888a05.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/80dd888a05.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/02/colquhoun-the-moral-law-is-the-rule-of-life-for-believers/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-69f9bb44a4" data-kw="">
<blockquote><p>Touching the time of God’s worship, it was the seventh day from the beginning of the creation, the Sabbath day. And here we must note, that the keeping of the Sabbath is moral. Some indeed do plead that it is but a ceremony; yet falsely: for it was ordained before the fall of man, at which time Ceremonies signifying sanctification had no place. Nay mark further: Adam in his innocency was not clogged with sin as we are; and yet then he had a set Sabbath to worship God his creator: and therefore much more need hath every one of us a Sabbath day, wherein we may sever our selves from the works of our callings, and the works of sin, to the worship of God in the exercise of religion, and godly meditation of our creation.

This point must be learned of us, for when no occasion is offered of business, then men will formally seem to keep the Sabbath: but if there come occasion of breaking the Sabbath, as traffic, gaming, and vain shows, then Sabbath farewell, men will have their pleasures, let them worship God that will. But let us remember in the fear of God, that whosoever continueth in the breach of this law being moral, God will no less pour forth his punishments upon them, then for the breach of any other commandment: the consideration whereof, must move every man to a reverent sanctifying of the Lord’s day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles, According to the Tenor of Scripture</cite>, in The Work of William Perkins (Cambridge: John Legat, 1600), p. 238.</span></figcaption>

<blockquote><p>The phrase that follows, “before my face,” makes the offense more heinous because God is provoked to jealousy as often as we substitute our own inventions in place of him. This is like a shameless woman who brings in an adulterer before her husband’s very eyes only to vex his mind the more.… Therefore, when God by his present power and grace testified that he kept watch over the people whom he had chosen, he warned them—to keep them even more from the crime of rebellion—that they could introduce no new gods without his witnessing and observing their sacrilege.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.8.16</span></figcaption>

<main class="wrap"><figure class="quote" id="q-5100f6088f" data-kw="">
<blockquote><p>Thirdly get assurance of glory with Christ, be sure of reigning with him, and thou shalt be joyful in suffering and laying all down for him were the soldier sure of the conquest and the crown, he would never fear to enter the battle, assurance of the crown of life exceedingly sweetens man’s passage through the valley of death.

Get clear and invincible evidence of God’s love, and of interest in the first resurrection, and then as Joseph willingly put of his prison garment, so shall you this garment of your flesh, and as Israel went joyfully through the sea to Canaan, so shall you through the deep waters of all sorrows, troubles, changes yea death it self, unto heaven. You shall have a desire to depart and be with Christ which is far better.</p></blockquote>

<blockquote><p>3. The Holy Spirit specially seals each particular believer, and makes him sure of his adoption, by a certain wonderful and secret testimony: for he is given to every believer as a pledge of divine love; and he, finally, pronounces in the hearts of the godly, that they are in favour with God: which testimony they both may and ought to believe. Therefore they do believe in particular that they are in the grace of God, and that their sins are remitted them.

The authorities from which all this is proved are well known: Rom. viii. 16, The Spirit beareth witness with our spirits that we are the children of God; Gal. iv. 6, Because ye are sons, God hath sent forth the Spirit of his Sort into your hearts, crying, Abba, Father; and Ephes. i. 13, 14, Ye were sealed with that Holy Spirit, after that ye believed, which is the earnest of your inheritance. Nor is this testimony fallacious or conjectural, but certain and infallible in all in whom it is found.

For the word is the ministration of the Spirit, 2 Cor. iii.; and faith conceived by the ministration of the word, is always joined with the witness of the Spirit itself. Therefore the impression of faith by the Holy Spirit, in the heart of a particular man, is, as it were, a particular testimony that he is in grace, and that he is a child of God. So Bernard, Serm. 5, De dedicat. ecclesise. Who can tell whether he is worthy of love or hatred? Who hath known the mind of the Lord? Here it is necessary that faith should come to our aid; that what is concealed concerning us in the heart of the Father, may be revealed to us by his Spirit; and his Spirit bearing witness may persuade our spirits that we are the children of God. But he persuades by calling and justifying us freely through faith.

[Cardinal Robert] Bellarmin[e] replies, that the Holy Spirit witnesses to our spirits only by some experience of an internal suavity and peace which produces nothing better than a conjectural certainty. De justif. lib. iii. cap. 9.

But Bernard rejects this Jesuitical comment: for he says this testimony is received by the act of faith; and that the Holy Spirit persuades our spirit that we are the children of God, by faith, not by fallible conjectures. So Chrysostom in viii. ad Rom. When the Spirit testifies can any doubt remain?</p></blockquote>

</figure><figure class="quote" id="q-389fd2ec20" data-kw="">
<blockquote><p>Controversy VI: Can man be certain of his present justice or the divine grace received in Christ? Thesis: The certainty of justice or justification in Christ is not a human conjecture but an infallible confidence that excludes final and total doubt and is based both on the promise of grace, which is universal for all believers, and on the special application and infallible testimony of the Holy Spirit. [Romanist] Antithesis: No one in this life can affirm with certainty and infallibility that their sins have been forgiven without a special revelation. This is a vain confidence and a presumptuous heresy. Thesis:

1. Scripture teaches that the justified have peace (Romans 5) and are persuaded of God’s grace (Romans 8; 2 Timothy 3 and 4).

2. The testimony of the Holy Spirit in our hearts is infallible (John 16; Romans 8; Galatians 4), being the seal and guarantee with which believers are confirmed and sealed (2 Corinthians 1; Ephesians 1 and 4).

3. True faith confidently trusts and expels doubt or unease from the heart (Romans 4; James 1; Ephesians 2; Hebrews 10 and 11).

4. Through the study of external piety, as an infallible argument, we know that we have true faith (2 Peter 1; 1 John 3 and 4).

5. The promises of grace are universal for believers (John 3; Romans 10) and are conditioned on faith and repentance. Therefore, these promises apply to all who find that condition in themselves.

6. The Church Fathers teach the same. Augustine: “It is not arrogance but faith to proclaim what you have received.” Bernard: “Believe that your sins are forgiven. This is the testimony the Holy Spirit gives in our hearts, saying: ‘Your sins are forgiven.&#x27;</p></blockquote>

<blockquote><p>Before we proceed to the more particular consideration of the words, it is very much worthy of our notice, to observe the apostle’s order and method of doctrine, and how he knits the believer’s privilege and duty together. He would have the privilege first believed, and then the duty performed: he would have us first believe, that the door of the holiest is opened by the blood of Jesus, that there is a new and living way consecrated for us, that we have a High Priest over the house of God, ready to introduce us into his presence; and upon these grounds of faith, he presses and inculcates the duty, Let us draw near, &amp; c. It is pleasant hence to observe, how the method and order of the covenant of works is just inverted in the covenant of grace. In the covenant of works, duty was the foundation of our privilege; man was first to perform duty, and upon his doing of that, might expect the privilege in a way of pactional debt. But now, I say, the very reverse of this is God’s order and method in the covenant of grace; for here we are first to believe the privilege, or to receive it as a grant of sovereign grace, and upon that ground we are to go on to duty. This is a thing that needs to be adverted to with the utmost attention, in regard the very bensil of nature runs in the way of the covenant of works, namely, to expect the privilege on the force of duty, and to fancy that God is a debtor to us, when we have done this and the other duty required in the law: whereas the stream of nature runs quite cross to the order and method laid in the covenant of grace, namely, first to receive the privilege in a way of grace, like beggars receiving God’s alms; and then to perform duty, as a testimony of gratitude for the privilege received, without expecting any thing from the Lord upon the account of duty done by us. This is what proud nature spurns against with the utmost reluctancy. What? To take all freely, without money, and without price, and to reckon ourselves unprofitable servants when we have done all, is what depraved nature cannot yield to, till the heart be new moulded by sovereign and efficacious grace. Will the Lord be pleased with thousands of rams, or with ten thousands of rivers of oil? ‘ &amp; c. Wherefore have we fasted, and prayed, and thou takest no knowledge? is expressive of our natural way of thinking. But though this way be cross unto nature, yet this is the way in which God will have sinners saved, or else they shall never share of his salvation: he will have them to receive eternal life begun here, and consummate here- after, as the gift of God through Jesus Christ our Lord, ‘ without regard to any of our doings as a foundation of our claim or title thereunto. Boasting must be for ever excluded, that the glory of our salvation may redound allenarly unto grace, which reigns through imputed righteousness unto eternal life, by Jesus Christ our Lord. And therefore, I say, study to rivet upon your minds the order and method laid by God in the covenant of grace, where privilege received by faith is made the foundation of duty, and not duty the foundation of our claim to the privilege. This is the scheme or order laid in our Lesser Catechism, by the Westminster Assembly; where, in answer to the 3d question, we are told, that the scriptures principally teach, first, what man is to believe concerning God, and then, what duty God requires of man. And, according to this order, we have, first, the objects of faith, and privileges of believers explained; and then, the duties of the moral law inculcate upon that ground. And if this order of doctrine be inverted, we destroy the covenant of grace, and return to a covenant of works.</p></blockquote>

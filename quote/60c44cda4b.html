<main class="wrap"><figure class="quote" id="q-60c44cda4b" data-kw="">
<blockquote><p>3. The Holy Spirit specially seals each particular believer, and makes him sure of his adoption, by a certain wonderful and secret testimony: for he is given to every believer as a pledge of divine love; and he, finally, pronounces in the hearts of the godly, that they are in favour with God: which testimony they both may and ought to believe. Therefore they do believe in particular that they are in the grace of God, and that their sins are remitted them.

The authorities from which all this is proved are well known: Rom. viii. 16, The Spirit beareth witness with our spirits that we are the children of God; Gal. iv. 6, Because ye are sons, God hath sent forth the Spirit of his Sort into your hearts, crying, Abba, Father; and Ephes. i. 13, 14, Ye were sealed with that Holy Spirit, after that ye believed, which is the earnest of your inheritance. Nor is this testimony fallacious or conjectural, but certain and infallible in all in whom it is found.

For the word is the ministration of the Spirit, 2 Cor. iii.; and faith conceived by the ministration of the word, is always joined with the witness of the Spirit itself. Therefore the impression of faith by the Holy Spirit, in the heart of a particular man, is, as it were, a particular testimony that he is in grace, and that he is a child of God. So Bernard, Serm. 5, De dedicat. ecclesise. Who can tell whether he is worthy of love or hatred? Who hath known the mind of the Lord? Here it is necessary that faith should come to our aid; that what is concealed concerning us in the heart of the Father, may be revealed to us by his Spirit; and his Spirit bearing witness may persuade our spirits that we are the children of God. But he persuades by calling and justifying us freely through faith.

[Cardinal Robert] Bellarmin[e] replies, that the Holy Spirit witnesses to our spirits only by some experience of an internal suavity and peace which produces nothing better than a conjectural certainty. De justif. lib. iii. cap. 9.

But Bernard rejects this Jesuitical comment: for he says this testimony is received by the act of faith; and that the Holy Spirit persuades our spirit that we are the children of God, by faith, not by fallible conjectures. So Chrysostom in viii. ad Rom. When the Spirit testifies can any doubt remain?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), i, 39-40.</span></figcaption>

<blockquote><p>Those in whom a living faith in Christ, an assured confidence of soul, peace of conscience, an earnest endeavor after filial obedience, a glorying in God through Christ, is not as yet strongly felt, and who nevertheless make use of the means which God has appointed for working these graces in us, ought not to be alarmed at the mention of reprobation, nor to rank themselves among the reprobate, but diligently to persevere in the use of means, and with ardent desires devoutly and humbly to wait for a season of richer grace.</p></blockquote>

<blockquote><p>Himself he may doubt, — he may doubt his ability to save himself, — he may doubt his power to better his condition, to make himself more worthy and acceptable, but never let him doubt that Christ is all that a poor, lost, convinced sinner wants. Let him not doubt that Jesus is the Friend of sinners, the Savior of sinners, and that he was never known to cast out one who in lowliness and brokenness of heart, sought his compassionate grace.</p></blockquote>

<blockquote><p>Remedy (1). The first remedy against this device of Satan is, solemnly to consider, That there may be true faith, yea, great measures of faith, where there is no assurance. The Canaanite woman in the Gospel had strong faith, yet no assurance that we read of. ‘These things have I written unto you,’ saith John, ‘that believe on the name of the Son of God, that ye may know that ye have eternal life, and that ye may believe on the name of the Son of God,’ 1 John v. 13.

In these words you see that they did believe, and had eternal life, in respect of the purpose and promise of God, and in respect of the seeds and beginnings of it in their souls, and in respect of Christ their head, who sits in heaven as a public person, representing all his chosen ones, ‘Who hath raised us up together, and made us sit together in heavenly places in Christ Jesus,’ Eph. ii. 6; and yet they did not know that they had eternal life. It is one thing to have a right to heaven, and another thing to know it; it is one thing to be beloved, and another thing for a man to know that he is beloved.

It is one thing for God to write a man’s name in the book of life, and another thing for God to tell a man that his name is written in the book of life; and to say to him, Luke x. 20, ‘Rejoice, because thy name is written in heaven.’ So Paul, ‘In whom ye also trusted, after ye heard the word of truth, the gospel of your salvation: in whom also, after ye believed, ye were sealed with that Holy Spirit of promise,’ Eph. i. 1 3. So Micah: ‘Rejoice not against me, O my enemy: for when I shall fall, I shall rise; when I shall sit in darkness, the Lord shall be a light unto me. I will bear the indignation of the Lord, because I have sinned,’ &amp;c., or, ‘the sad countenance of God,’ as the Hebrew hath it, Micah vii. 8, 9. This soul had no assurance, for he sits in darkness, and was under the sad countenance of God; and yet had strong faith, as appears in those words, ‘ When I fall, I shall rise; when I sit in darkness, the Lord shall be a light unto me.’ He will bring me forth to the Light, and I shall behold his righteousness. And let this suffice for the first answer.

Remedy (2). The second remedy against this device of Satan is, solemnly to consider, That God in the Scripture doth define faith otherwise. God defines faith to be a receiving of Christ—’As many as received him, to them he gave this privilege, to be the sons of God,’ John i. 12. ‘To as many as believed on his name,’ Acts xi. 23 — to be a cleaving of the soul unto God, though no joy, but afflictions, attend the soul. Yea, the Lord defines faith to be a coming to God in Christ, and often to a resting and staying, rolling of the soul upon Christ. It is safest and sweetest to define as God defines, both vices and graces. This is the only way to settle the soul, and to secure it against the wiles of men and devils, who labour, by false definitions of grace, to keep precious souls in a doubting, staggering, and languishing condition, and so make their lives a burden, a hell, unto, them.

Remedy (3). The third remedy against this device of Satan is, seriously to consider this, That there may be true faith where there is much doublings. Witness those frequent sayings of Christ to his disciples, ‘Why are ye afraid, O ye of little faith?’ Persons may be truly believing who nevertheless are sometimes doubting. In the same persons that the fore-mentioned scriptures speak of, you may see their faith commended and their doubts condemned, which doth necessarily suppose a presence of both.

Remedy (4). The fourth remedy against this device of Satan is, solemnly to consider, That assurance is an effect of faith; therefore it cannot be faith. The cause cannot be the effect, nor the root the fruit. As the effect flows from the cause, the fruit from the root, the stream from the fountain, so doth assurance flow from faith. This truth I shall make good thus: The assurance of our salvation and pardon of sin doth primarily arise from the witness of the Spirit of God that we are the children of God, Eph. i. 13; and the Spirit never witnesseth this till we are believers: ‘For we are sons by faith in Christ Jesus,’ Gal. iv. 6. Therefore assurance is not faith, but follows it, as the effect follows the cause. Again, no man can be assured and persuaded of his salvation till he be united to Christ, till he be ingrafted into Christ; and a man cannot be ingrafted into Christ till he hath faith. He must first be ingrafted into Christ by faith before he can have assurance of his salvation; which doth clearly evidence, that assurance is not faith, but an effect and fruit of faith, &amp;c.

Again, faith cannot be lost, but assurance may; therefore assurance is not faith. 1 Though assurance be a precious flower in the garden of a saint, and is more infinitely sweet and delightful to the soul than all outward comforts and contents; yet it is but a flower that is subject to fade, and to lose its freshness and beauty, as saints by sad experience find, &amp;c.

Again, a man must first have faith before he can have assurance, therefore assurance is not faith. And that a man must first have faith before he can have assurance, is clear by this, a man must first be saved before he can be assured of his salvation; for he cannot be assured of that which is not. And a man must first have a saving faith before he can be saved by faith, for he cannot be saved by that which he hath not; therefore a man must first have faith before he can have assurance, and so it roundly follows that assurance is not faith, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Precious Remedies Against Satan’s Devices</cite>, (1676) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 1: 95-97.</span></figcaption>

evertheless+are+sometimes+doubting.+In+the+same+persons+that+the+fore-mentioned+scriptures+speak+of%2C+you+may+see+their+faith+commended+and+their+doubts+condemned%2C+which+doth+necessarily+suppose+a+presence+of+both.%0A%0ARemedy+%284%29.+The+fourth+remedy+against+this+device+of+Satan+is%2C+solemnly+to+consider%2C+That+assurance+is+an+effect+of+faith%3B+therefore+it+cannot+be+faith.+The+cause+cannot+be+the+effect%2C+nor+the+root+the+fruit.+As+the+effect+flows+from+the+cause%2C+the+fruit+from+the+root%2C+the+stream+from+the+fountain%2C+so+doth+assurance+flow+from+faith.+This+truth+I+shall+make+good+thus%3A+The+assurance+of+our+salvation+and+pardon+of+sin+doth+primarily+arise+from+the+witness+of+the+Spirit+of+God+that+we+are+the+children+of+God%2C+Eph.+i.+13%3B+and+the+Spirit+never+witnesseth+this+till+we+are+believers%3A+%E2%80%98For+we+are+sons+by+faith+in+Christ+Jesus%2C%E2%80%99+Gal.+iv.+6.+Therefore+assurance+is+not+faith%2C+but+follows+it%2C+as+the+effect+follows+the+cause.+Again%2C+no+man+can+be+assured+and+persuaded+of+his+salvation+till+he+be+united+to+Christ%2C+till+he+be+ingrafted+into+Christ%3B+and+a+man+cannot+be+ingrafted+into+Christ+till+he+hath+faith.+He+must+first+be+ingrafted+into+Christ+by+faith+before+he+can+have+assurance+of+his+salvation%3B+which+doth+clearly+evidence%2C+that+assurance+is+not+faith%2C+but+an+effect+and+fruit+of+faith%2C+%26c.%0A%0AAgain%2C+faith+cannot+be+lost%2C+but+assurance+may%3B+therefore+assurance+is+not+faith.+1+Though+assurance+be+a+precious+flower+in+the+garden+of+a+saint%2C+and+is+more+infinitely+sweet+and+delightful+to+the+soul+than+all+outward+comforts+and+contents%3B+yet+it+is+but+a+flower+that+is+subject+to+fade%2C+and+to+lose+its+freshness+and+beauty%2C+as+saints+by+sad+experience+find%2C+%26c.%0A%0AAgain%2C+a+man+must+first+have+faith+before+he+can+have+assurance%2C+therefore+assurance+is+not+faith.+And+that+a+man+must+first+have+faith+before+he+can+have+assurance%2C+is+clear+by+this%2C+a+man+must+first+be+saved+b <blockquote><p>‘Who hath anointed us, and sealed us.’ Anointing and sealing go together. The same God anoints us doth also seal us. Both are to secure us of our happy condition. Now Christ is the first sealed: John 6:27, ‘Him hath the father sealed.’ God hath set Christ apart from others, hath distinguished him, and set a stamp upon him to be the Messiah by the graces of the Spirit, whereof he was richly beautified, and by many miracles, whereby he shewed that he was the Son of God; by his resurrection from the dead, by his calling of the Gentiles, and many other things. Christ being sealed himself, he sealed all that he did for our redemption with his blood, and hath added for the strengthening of our faith outward seals, the sacraments, to secure his love more firmly to us. But in this place another manner of sealing is to be understood. For here is not meant the sealing of Christ, but the sealing of us that have communion with him. The same Spirit that seals the Redeemer seals the redeemed. Quest. What is the manner of our sealing by the Spirit? Ans. (1.) Sealing we know hath divers uses. First of all, it doth imprint a likeness of him that doth seal. When the king’s image is stamped upon the wax, everything in the wax answers to that in the seal, face to face, eye to eye, body to body. So we are said to be sealed when we carry in our souls the image of the Lord Jesus; for the Spirit sets the stamp of Christ upon every true convert. There is the likeness of Christ in all things to be found in him. As the child answers the father, foot for foot, finger for finger in proportion, but not in quantity, so it is in the sealing of a believer. There is a likeness in the soul that is sealed by the Spirit to the Lord Jesus. There is understanding of the same heavenly supernatural truths; there is a judging of things as Christ judgeth, a loving of that which he loves, and a hating of that which he hates; a rejoicing to do that which he delights in, and a grief to commit anything that displeaseth his majesty. Every affection of the soul is carried that way that the affections of our blessed Saviour are carried, in proportion; everything in the soul is answerable to him in its degree. There is no grace in Christ, but there is the like in every Christian in some measure. The obedience of Christ to his Father, even to the death, is to be found in every true Christian. The humility whereby Christ abased himself, it is in every renewed heart. Christ works in the soul that receives him a conformity to himself. The soul that believes that Christ hath loved him, and done such great things for him, is ambitious to express Christ in all his ways. Being once in Christ, we shall delight to be transformed more and more unto him. To bear the image of the ‘second Adam’ upon our breasts, to make it appear that Jesus Christ lives in us, and that we ‘live not to ourselves, but to him that died for us,’ 2 Cor. 5:15; to be meek and heavenly-minded as he was, talking and discoursing of spiritual things, going about doing good everywhere; active for God, fruitful in holiness, doing and receiving all the good we are able, drawing others from this world to meditate of a better estate, labouring for the advancement of God’s kingdom, and approving ourselves to him. This is one use of sealing, to imprint a likeness. (2.) A second use of the seal is distinction. Sealing is a stamp upon one thing among many. It distinguisheth Christians from others, as we shall see after. (3.) Again, it serves for appropriation. Men seal those things that are their own. Merchants, we see, set their stamp on those wares which they have or mean to have a right unto. It pleaseth God thus to condescend unto us, by applying himself to human contracts. He appropriates his own to shew that he hath chosen and singled them out for himself to delight in. (4.) Sealing further serves to make things authentical, to give authority and excellency. The seal of the prince is the authority of the prince. This gives validity to things, answerable to the dignity and esteem of him that seals. These are the four principal uses of sealing; and God by his Spirit doth all these to his. He stamps his own image upon us; he distinguisheth us from others, even from the great refuse of the world. God by his Spirit appropriates us to himself; he makes us to be his, and shews that we are his. He likewise authoriseth us, and puts an excellency upon us, to secure us against all temptations. When we have God’s seal on us, we stand firm in the greatest trial. ‘Who shall separate us from the love of God?’ Rom. 8:35. We dare defy all objections of Satan, and accusations of conscience whatsoever. A man that hath God’s seal stands impregnable in the most tempestuous season; for it is given for our assurance, and not for God’s. The Lord knows who are his. He seals not because he is ignorant, but for our comfort and establishment.</p></blockquote>

+of+a+believer.+There+is+a+likeness+in+the+soul+that+is+sealed+by+the+Spirit+to+the+Lord+Jesus.+There+is+understanding+of+the+same+heavenly+supernatural+truths%3B+there+is+a+judging+of+things+as+Christ+judgeth%2C+a+loving+of+that+which+he+loves%2C+and+a+hating+of+that+which+he+hates%3B+a+rejoicing+to+do+that+which+he+delights+in%2C+and+a+grief+to+commit+anything+that+displeaseth+his+majesty.+Every+affection+of+the+soul+is+carried+that+way+that+the+affections+of+our+blessed+Saviour+are+carried%2C+in+proportion%3B+everything+in+the+soul+is+answerable+to+him+in+its+degree.+There+is+no+grace+in+Christ%2C+but+there+is+the+like+in+every+Christian+in+some+measure.+The+obedience+of+Christ+to+his+Father%2C+even+to+the+death%2C+is+to+be+found+in+every+true+Christian.+The+humility+whereby+Christ+abased+himself%2C+it+is+in+every+renewed+heart.+Christ+works+in+the+soul+that+receives+him+a+conformity+to+himself.+The+soul+that+believes+that+Christ+hath+loved+him%2C+and+done+such+great+things+for+him%2C+is+ambitious+to+express+Christ+in+all+his+ways.+Being+once+in+Christ%2C+we+shall+delight+to+be+transformed+more+and+more+unto+him.+To+bear+the+image+of+the+%E2%80%98second+Adam%E2%80%99+upon+our+breasts%2C+to+make+it+appear+that+Jesus+Christ+lives+in+us%2C+and+that+we+%E2%80%98live+not+to+ourselves%2C+but+to+him+that+died+for+us%2C%E2%80%99+2+Cor.+5%3A15%3B+to+be+meek+and+heavenly-minded+as+he+was%2C+talking+and+discoursing+of+spiritual+things%2C+going+about+doing+good+everywhere%3B+active+for+God%2C+fruitful+in+holiness%2C+doing+and+receiving+all+the+good+we+are+able%2C+drawing+others+from+this+world+to+meditate+of+a+better+estate%2C+labouring+for+the+advancement+of+God%E2%80%99s+kingdom%2C+and+approving+ourselves+to+him.+This+is+one+use+of+sealing%2C+to+imprint+a+likeness.+%282.%29+A+second+use+of+the+seal+is+distinction.+Sealing+is+a+stamp+upon+one+thing+among+many.+It+distinguisheth+Christians+from+others%2C+as+we+shall+see+after.+%283.%29+Again%2C+it+serves+for+appropriation.+Men+seal+those+things+that+are+their+own.+Merchants%2C+we+see%2C+set+their+stamp+on+those+wares+which+they+have+or+mean+to+have+a+right+unto.+It+pleaseth+God+thus+to+condescend+unto+us%2C+by+applying+himself+to+human+contracts.+He+appropriates+his+own+to+shew+that+he+hath+chosen+and+singled+them+out+for+himself+to+delight+in.+%284.%29+Sealing+further+serves+to+make+things+authentical%2C+to+give+authority+and+excellency.+The+seal+of+the+prince+is+the+authority+of+the+prince.+This+gives+validity+to+things%2C+answerable+to+the+dignity+and+esteem+of+him+that+seals.+These+are+the+four+principal+uses+of+sealing%3B+and+God+by+his+Spirit+doth+all+these+to+his.+He+stamps+his+own+image+upon+us%3B+he+distinguisheth+us+from+others%2C+even+from+the+great+refuse+of+the+world.+God+by+his+Spirit+appropriates+us+to+himself%3B+he+makes+us+to+be+his%2C+and+shews+that+we+are+his.+He+likewise+authoriseth+us%2C+and+puts+an+excellency+upon+us%2C+to+secure+us+against+all+temptations.+When+we+have+God%E2%80%99s+seal+on+us%2C+we+stand+firm+in+the+greatest+trial.+%E2%80%98Who+shall+separate+us+from+the+love+of+God%3F%E2%80%99+Rom.+8%3A35.+We+dare+defy+all+objections+of+Satan%2C+and+accusations+of+conscience+whatsoever.+A+man+that+hath+God%E2%80%99s+seal+stands+impregnable+in+the+most+tempestuous+season%3B+for+it+is+given+for+our+assurance%2C+and+not+for+God%E2%80%99s.+The+Lord+knows+who+are+his.+He+seals+not+because+he+is+ignorant%2C+but+for+our+comfort+and+establishment.%E2%80%9D%0A%0A%E2%80%94+Richard+Sibbes%2C+The+Complete+Works+of+Richard+Sibbes%2C+ed.+Alexander+Balloch+Grosart%2C+vol.+4+%28Edinburgh%3B+London%3B+Dublin%3A+James+Nichol%3B+James+Nisbet+and+Co.%3B+W.+Robertson%2C+1863%29%2C+132%E2%80%9333.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb7ac9282b1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b7ac9282b1.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/12/sibbes-on-the-sealing-of-the-spirit/" rel="n

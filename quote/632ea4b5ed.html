<main class="wrap"><figure class="quote" id="q-632ea4b5ed" data-kw="">
<blockquote><p>There may be a partial separation when one ordinance is so corrupted that we cannot join in it and yet can join with the Church in all other acts of communion: and a total separation when either the Church will not suffer us to join with her in any part of her service unless we join in all; or she is so corrupt that we can join with her in nothing that is religious. The former by most wise and sober men is not reckoned such a schism as that any are to be blamed as schismatics on that account;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended… (Edinburgh: 1697), sect. 10 Rule was a Scottish, divine-right presbyterian.</cite>, p. 247</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7c936f493c" data-kw="">
<blockquote><p>38. There is no history that I have seen or heard that tells us of any Churches on earth that for many hundred years together did worship God without a liturgy as faulty as ours: To make them all idolaters and such whose worship God cursed and accepted not, is to make them no true Churches; and if Christ had no Church, He was no Head and King of it, and so no Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Detailed | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2, pp. 9-14 | Much Impure Worship is much Better than what other Churches do</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-a778d5dc48" data-kw="">
<blockquote><p>…the minister who is to preach is to… to call upon the Lord to this effect: ‘To acknowledge our great sinfulness, First, by reason of original sin, which… doth defile our best actions… And, with confidence of his mercy to his whole church, and the acceptance of our persons, through the merits and mediation of our High Priest, the Lord Jesus, to profess that it is the desire of our souls to have fellowship with God in the reverend and conscionable use of his holy ordinances; and, to that purpose, to pray earnestly for his grace and effectual assistance to the sanctification of his holy sabbath, the Lord’s day, in all the duties thereof, publick and private, both to ourselves, and to all other congregations of his people, according to the riches and excellency of the gospel, this day celebrated and enjoyed. And because we have been unprofitable hearers in times past, and now cannot of ourselves receive, as we should, the deep things of God, the mysteries of Jesus Christ, which require a spiritual discerning; to pray, that the Lord, who teacheth to profit, would graciously please to pour out the Spirit of grace, together with the outward means thereof, causing us to attain such a measure of the excellency of the knowledge of Christ Jesus our Lord…&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Directory for Public Worship | Of Public Prayer before the Sermon</cite></span></figcaption>

wledge%20of%20Christ%20Jesus%20our%20Lord%E2%80%A6%27" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3a1e1b611b" data-kw="">
<blockquote><p>I would add a similitude [It was actually a real and common scenario in that era]: Supposing that we had just possession of the public church-places and tithes, and they are taken from us, and we can blame them that did it and say over and over, ‘We had possession;’ and therefore it is unlawful to meet in worse rooms, for God must have the best: will this hold when you cannot keep possession? Will you rather worship nowhere? This is no better than if you would tell all men they should die rather than eat brown bread, if force take all other [food] from them, because it is unjustly done and they had possession of better. Good friends, keep your possession for me, but I own not the famishing of all that are dispossessed. If you do, I do not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation &amp; Conformity | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 5, ‘A comparison of the use of a faulty translation of the Scripture and a faulty liturgy’ | Plain or Bad Bread is Better than None</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-5fb708eab9" data-kw="">
<blockquote><p>The secession of those good people from the idolatry erected by Jeroboam to worship at Jerusalem is allowed, 2 Chron. 11:16. The negative separation, or the not communicating in the worship of Baal, not so much as by knees or lips of those seven thousand in Israel, is liked of by the Lord, 1 Kings 19:18… The flying of God’s people out of Babylon [Rev. 18:4], where idolatry is maintained by force of tyranny is called for and required.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Institution, Right Administration &amp; Receiving of the Sacrament of the Lord’s Supper (London: 1657)</cite>, ch. 20, p. 246</span></figcaption>

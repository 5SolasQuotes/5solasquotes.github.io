<blockquote><p>In the Sufferings of Christ. Here is a Glass, O Criminals, wherein you may fee your own Face. You think it a little Thing that you have sinned; nay, it may be, you roll Sin at a sweet Morsel under your Tongues. But come here, and see what a Thing it is which you thus dreadfully mistake! Come see it holding the Sword; O strange! Nay more, thrusting it into Christ’s Side! Here, Sinners, is a Sight that made the Earth to tremble, and the Sun to hide his Face, as we see Matth. xxvii. ix. Luke xxiii. 45.

In this Glass you may see, (1.) What GOD’s Thoughts of Sin are. So highly opposite to his Nature is it, that the Bowels of Affection he had to the Son of his Love, whom he so highly honoured, when the Voice came from the excellent Glory, saying, This is my beloved Son in whom I am well pleased, were not able to hold up the Hand of inexorable Justice from striking at him, nay, striking him dead for the Sin of the elect World. Would hot that be a great Proof, think ye, of the Aversion of a Parent to any Thing, if he would rather choose to slay his Son, nay, his only Son, his Son whom he loved most tenderly, than it should escape a Mark of his Displeasure?

(2.) Here you may see more of the Pollution of Sin than any where else. Never was there anything that gave so just Apprehensions of the Stain of Sin, as the Death of Christ. An ingrained Pollution it must indeed be, if no less will wash it out than the Blood of GOD. (3.) Here is a dreadful Evidence of the Power of Sin. Never did this more appear, than when it blinded the Eyes of the degenerate Sons of Men so far, that they could not discern the Glory of the only begotten of the Father, who was so full of Grace and of Truth, whose divine Nature daily beamed, as it were, through that of his human, in miraculous Operations, Works, and Words, which none but GOD could do, none but GOD could speak. And no less was the Power of Sin seen, when it hurried Men headlong into that Heaven-daring Pitch of Impiety, to imbrue their Hands in the Blood of GOD. O Sinners, would you fee what Sin is? look at it with its Hands reeking in the Gore and Blood of GOD, and tell what you think of it.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f6e19a7a29" data-kw="">
<blockquote><p>But we see that the godly are visited with sore anguish and very heavy afflictions beyond others; for in this manner God wishes to try their faith, that, after having laid aside their desires and forsaken the world, they may serve him. Since, therefore, the Lord has a peculiar care of them, he must chastise them, while he permits wicked men to indulge in unbounded licentiousness.

Here we are also reminded that we must endure not merely one or another calamity, and must not imagine that, when we have endured some afflictions, there are none in reserve for us; for we ought always to be prepared to endure new ones. When God begins to chastise his people, he does not immediately cease. We shall “bring forth wind” when we think that the birth is at hand; other calamities will break out, and we shall be continually attacked by additional sorrows. We must therefore maintain this warfare so long as it shall please God to employ us in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Second</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 7: 235.</span></figcaption>

<blockquote><p>That the afflictions that do befall the saints are such as proceed from God’s dearest love. ‘As many as I love, I rebuke and chasten,’ Rev. iii. 19. Saints, saith God, think not that I hate you, because I thus chide you. He that escapes reprehension may suspect his adoption. God had one Son without corruption, but no son without correction. A gracious soul may look through the darkest cloud, and see a God smiling on him. We must look through the anger of his correction to the sweetness of his countenance; and as by the rainbow we see the beautiful image of the sun’s light in the midst of a dark and waterish cloud.

When Munster lay sick, and his friends asked him how he did and how he felt himself, he pointed to his sores and ulcers, whereof he was full, and said, ‘These are God’s gems and jewels, wherewith he decketh his best friends, and to me they are more precious than all the gold and silver in the world.’ A soul at first conversion is but cast; but God by afflictions doth square and fit, and fashion it for that glory above, which doth speak them out to flow from precious love; therefore the afflictions that do attend the people of God should be no bar to holiness, nor no motive to draw the soul to ways of wickedness.</p></blockquote>

<blockquote><p>To suffer without Christ is to risk being totally and completely crushed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-c-sproul.html">R. C. Sproul</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Surprised by Suffering</cite>, (as posted by @Ligonier)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>
<div class="actions"><button class="copy" data-copy="“To suffer without Christ is to risk being totally and completely crushed.”

— R. C. Sproul, Surprised by Suffering, (as posted by @Ligonier)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTo+suffer+without+Christ+is+to+risk+being+totally+and+completely+crushed.%E2%80%9D%0A%0A%E2%80%94+R.+C.+Sproul%2C+Surprised+by+Suffering%2C+%28as+posted+by+%40Ligonier%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9def396400.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9def396400.html">Permalink</a><a class="src" href="https://x.com/Ligonier/status/1982039528962510894" rel="noopener" target="_blank">Read it online · X</a></div>
</figure><figure class="quote" id="q-0aae216358" data-kw="">
<blockquote><p>Suffering especially tests and strengthens hope. Paul teaches that discovering God’s help increases our hope (Rom. 5:5). Because God enables us to experience his goodness, power, and faithfulness when we are in need, because he strengthens us against every temptation and safeguards us against every attack, and because he delivers us from all our fears, he in all these ways so establishes and guarantees in us the truth of his promises that whoever calls on him will be saved and whoever trusts in him will never be put to shame. …

By means of trials God puts our obedience to the test. When all goes well according to the flesh, it is not difficult for us to yield to his will and to recognize his goodness and love towards us. But when he visits us with sickness, poverty, reproach, or some other misery, it is then true obedience to feel that he loves us, to embrace his divine guidance, and to submit to his will. …

How shabbily we treat this one, true, and heavenly Father when in days of oppression we fail to hallow his name, to conform our will to his, and to confess that all things proceed from his goodness and love – all of which serves his praise as well as our salvation.

So we see how in the school of we learn what it actually means to be obedient to God. We need this education. For as Jesus Christ, even though he was God’s Son, nevertheless “learned obedience from what he suffered” (Heb. 5:8), how much more necessary it is for us in days of persecution to learn to submit our heads and our hearts to God’s leading.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-taffin.html">Jean Taffin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marks of God’s Children</cite>, trans. Peter Y. De Jong, ed. James A. De Jong (1588; Grand Rapids MI: Baker Books, 2003), pp 106-07, 108.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

How shabbily we treat this one, true, and heavenly Father when in days of oppression we fail to hallow his name, to conform our will to his, and to confess that all things proceed from his goodness and love – all of which serves his praise as well as our salvation.

So we see how in the school of we learn what it actually means to be obedient to God. We need this education. For as Jesus Christ, even though he was God’s Son, nevertheless “learned obedience from what he suffered” (Heb. 5:8), how much more necessary it is for us in days of persecution to learn to submit our heads and our hearts to God’s leading.”

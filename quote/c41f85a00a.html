</figure><figure class="quote" id="q-e320c2c7f1" data-kw="">
<blockquote><p>Hence in vain is alleged [by Socinians]: 1. The innocence of Christ, as if it impeded his right of bearing our punishments (Socinus, part 3, ch. 9). For Christ himself professes that he has the right of laying down his life and that he lays it down for his sheep (John 10:15,18). But it rests on this, that God made him, our sponsor (Heb 7:22), to be sin for us, imputatively, that he might be pressed by the exactions of our debts (as the word אָשָׁם indicates), that is, that he might pay our penalties (Isa 53:7), which same thing is most clearly suggested when Christ is said to have suffered ὑπὲρ ἡμῶν, that is, in our place and stead. When therefore he is said to have been made a curse for us in order to remove the curse from us (Gal 3:13), why should we doubt his most rigid and strict satisfaction in our place? I admit indeed that the word ὑπὲρ sometimes has a wider sense and is joined with such a verb by which some benefit is said to be procured for another, as Paul says that he suffered for (ὑπὲρ) the church of God (Eph 3:1,13, Col 1:24), which Volkelius objects to (ibid.). But I say that when Scripture speaks of the sufferings of Christ, it indicates by it such a substitution by which Christ took upon himself the punishments to be borne by us, concerning which Paul, discussing them, denies that he [Paul] was crucified for the Corinthians (1 Cor 1:13). And certainly Socinus himself (ibid.) says that God manifested true justice concerning the innocent Christ, and Scripture says that peace and salvation flow to us from his sufferings (Isa 53:5). Let the good man explain to us here punishment without respect to sin, and free God from cruelty according to his view, [God] who burdened his most beloved and innocent Son with such great and dire torments, and indeed with justice administering it, if to punish the innocent for the guilty is a sign of utmost cruelty, as the Socinian axiom has it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’</cite>, tr. by AI by Onku (Utrecht, 1650) Latin</span></figcaption>

</figure><figure class="quote" id="q-d8e09614c0" data-kw="">
<blockquote><p>Whether Christ died for us, that is vicariously and in our place, and further that salvation was brought forth for us? It is affirmed against the Socinians. … Whether He is our mediator only so far as a messenger is? It is denied. Whether Christ truly reconciled us to the Father, or whether our redemption done through that indeed was only metaphorical? The former is affirmed, the latter is denied. … Whether Christ’s death is meritorious to us, or it was in truth a preparation only unto his priesthood? The former is affirmed. Whether the dogma of satisfaction and merit in the sacred pages is founded, or repugnant to right reason? The former is affirmed, the latter is denied. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems</cite>, (Utrecht, 1643), pt. 1, section 2 Abbr. | tract 3 | 1. Of the Obedience, Satisfaction &amp; Merit of Christ</span></figcaption>

</figure><figure class="quote" id="q-49b66891f4" data-kw="">
<blockquote><p>This deed of gift and grant, or authentic gospel-offer is expressed in so many words, ‘For God so loved the world, that he gave his only begotten Son, that whosoever believes in Him should not perish, but have everlasting life’ (John 3:16). Where the gospel comes, this grant is published, and the ministerial offer made, and there is no exception of any of all mankind in the grant. If there was, no ministerial offer of Christ could be warrantably made to the party excepted, more than to the fallen angels; and without question, the publishing and proclaiming of heaven’s grant unto any, by way of ministerial offer, presupposes the grant, in the first place, to be made to them: otherwise, it would be of no more value than a crier’s offering of the king’s pardon to one who is not comprehended in it. This is the good old way of discovering to sinners their warrant to believe in Christ; and it does indeed bear the sufficiency of the sacrifice of Christ for all, and that Christ crucified is the ordinance of God for salvation unto all mankind, in the use-making of which only they can be saved; but not an universal atonement or redemption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, … with Notes by the Rev. Thomas Boston (London: Tegg, 1837), p. 106, Notes of Boston</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“This deed of gift and grant, or authentic gospel-offer is expressed in so many words, ‘For God so loved the world, that he gave his only begotten Son, that whosoever believes in Him should not perish, but have everlasting life’ (John 3:16). Where the gospel comes, this grant is published, and the ministerial offer made, and there is no exception of any of all mankind in the grant. If there was, no ministerial offer of Christ could be warrantably made to the party excepted, more than to the fallen angels; and without question, the publishing and proclaiming of heaven’s grant unto any, by way of ministerial offer, presupposes the grant, in the first place, to be made to them: otherwise, it would be of no more value than a crier’s offering of the king’s pardon to one who is not comprehended in it. This is the good old way of discovering to sinners their warrant to believe in Christ; and it does indeed bear the sufficiency of the sacrifice of Christ for all, and that Christ crucified is the ordinance of God for salvation unto all mankind, in the use-making of which only they can be saved; but not an universal atonement or redemption.”

— Thomas Boston, The Marrow of Modern Divinity… with Notes by the Rev. Thomas Boston (London: Tegg, 1837), p. 106, Notes of Boston">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+deed+of+gift+and+grant%2C+or+authentic+gospel-offer+is+expressed+in+so+many+words%2C+%E2%80%98For+God+so+loved+the+world%2C+that+he+gave+his+only+begotten+Son%2C+that+whosoever+believes+in+Him+should+not+perish%2C+but+have+everlasting+life%E2%80%99+%28John+3%3A16%29.+Where+the+gospel+comes%2C+this+grant+is+published%2C+and+the+ministerial+offer+made%2C+and+there+is+no+exception+of+any+of+all+mankind+in+the+grant.+If+there+was%2C+no+ministerial+offer+of+Christ+could+be+warrantably+made+to+the+party+excepted%2C+more+than+to+the+fallen+angels%3B+and+without+question%2C+the+publishing+and+proclaiming+of+heaven%E2%80%99s+grant+unto+any%2C+by+way+of+ministerial+offer%2C+presupposes+the+grant%2C+in+the+first+place%2C+to+be+made+to+them%3A+otherwise%2C+it+would+be+of+no+more+value+than+a+crier%E2%80%99s+offering+of+the+king%E2%80%99s+pardon+to+one+who+is+not+comprehended+in+it.+This+is+the+good+old+way+of+discovering+to+sinners+their+warrant+to+believe+in+Christ%3B+and+it+does+indeed+bear+the+sufficiency+of+the+sacrifice+of+Christ+for+all%2C+and+that+Christ+crucified+is+the+ordinance+of+God+for+salvation+unto+all+mankind%2C+in+the+use-making+of+which+only+they+can+be+saved%3B+but+not+an+universal+atonement+or+redemption.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+The+Marrow+of+Modern+Divinity%E2%80%A6+with+Notes+by+the+Rev.+Thomas+Boston+%28London%3A+Tegg%2C+1837%29%2C+p.+106%2C+Notes+of+Boston&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F49b66891f4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/49b66891f4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=This%20deed%20of%20gift%20and%20grant,not%20an%20universal%20atonement%20or%20redemptio

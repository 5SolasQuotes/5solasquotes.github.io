<blockquote><p>Almighty God and heavenly Father, You have promised to hear and answer our requests which we make to you in the name of Your beloved Son, Jesus Christ our Lord. We are further taught by Him and His apostles to gather together in His name, with the promise that He will be among us and will intercede for us before You, that we may receive and obtain all things on which we are agreed on earth. You bid us pray, first, for those whom you have set up over us, our leaders and governors. Next, for the needs of all Your people, and of all men everywhere. Therefore, trusting in Your holy truth and in Your promise, and being assembled here before You in Jesus’ name, we lovingly beseech You, our God and Father, in Your infinite mercy, freely to pardon our transgressions, and so to lift our thoughts and desires to You that we may heartily call upon You according to Your good will and pleasure. We therefore pray, heavenly Father, for all princes and lords, Your servants to whom you have committed the rule of justice. Most particularly do we pray for the rulers of this city, that you will endue them with Your Spirit, who alone is gracious and sovereign, and daily increase His gifts in them, that they, acknowledging Your Son Jesus Christ to be King of kings and Lord of lords, with full power in heaven and on earth, may seek to serve Him and exalt His reign in all their dominions, and may according to Your will, guide and govern their subjects, who are the work of Your hands and the sheep of Your pasture. And may we, Your people, here and everywhere, being kept in peace and tranquility, serve You in holiness and righteousness. And, free from the fear of our enemies, may be give You praise all our days. We pray also, true Father and Saviour, for all whom You have ordained as pastors to Your people, who have the care of souls and the administration of Your holy gospel. May You lead and direct them by Your Holy Spirit, that they may be found faithful and true ministers of Your glory, always striving to gather and bring home the erring and wayward sheep to the Lord Jesus Christ, our chief Shepherd and principal Bishop, that they might daily prosper and grow in Him in all righteousness and holiness. Grant, moreover, that all churches may be delivered from the mouths or ravening wolves and hirelings, who follow their own purposes and ambitions, and have no care fore the honour of Your holy name and the welfare of Your flock. Next we pray, most gracious God and merciful Father, for all men generally. Since you desire all men to acknowledge You as Saviour of the world, through the redemption won by our Lord Jesus Christ, may those who do not know Him, being in darkness and captive to ignorance and error– may they by the light of Your Holy Spirit and the preaching of Your gospel, be led into the way of salvation, which is to know You, the only true God, and Jesus Christ whom you have sent. May those whom You have already visited with Your grace, and enlightened by the knowledge of Your Word, grow in all goodness, enriched by Your spiritual blessing, so that together we may all worship You with heart and voice, giving honour and homage to Christ, our Master, King and Lawgiver. Likewise, O God of all comfort, we commend to You all whom You visit and chastise with cross and tribulation, whether it be through poverty or prison, sickness or exile, or affliction of body or mind. May You make known to them Your fatherly love, and assure them that their chastisement is for amendment of life. And may they with willing heart turn to You and, being converted, receive Your comfort, being delivered from every distress. Finally, O God and Father, grant also that we, who are gathered here in Jesus’ name to hear His Word, may, without dissembling or hypocrisy, acknowledge that by nature we are lost, that we deserve Your punishment, and daily heap up condemnation to ourselves by our wretched and unruly lives. Help us to see that in us there is nothing good, and that flesh and blood can never inherit Your kingdom. May be gladly and with steadfast trust submit to your Lord Jesus Christ, our only Saviour and Redeemer. And may He so live in us that, our old Adam being put to death, we may rise to a new and better life, to the praise and glory of Your name.</p></blockquote>

<blockquote><p>Will, whether it be in God or Man, belongs to the essence or nature of both. The nature therefore of God being one, there are not in God diverse wills, although the Godhead be in diverse Persons, because the power of willing is a natural, not a personal propriety. Contrariwise, the Person of our Savior Christ being but one, there are in Him two wills, because two natures, the nature of God and the nature of man, which both do imply this faculty and power. So that in Christ there is a divine and there is a human will, otherwise He were not both God and Man. Hereupon the Church has of old condemned Monothelites as hereticks for holding that Christ had but one will. The works and operations of our Savior’s human will were all subject to the will of God and framed according to his Law, ‘I desire to do thy will, O God, and thy Law is within mine heart.’ [Ps. 40] Now as man’s will, so the will of Christ has two several kinds of operation: the one natural or necessary, whereby it desires simply whatsoever is good in itself and shuns as generally all things which hurt; the other deliberate, when we therefore embrace things as good because the eye of understanding judges them good to that end which we simply desire. Thus in itself we desire health, physic, only for health’s sake. And in this sort, special reason oftentimes causes the will by choice to prefer one good thing before another, to leave one for another’s sake, to forgo meaner for the attainment of higher desires, which our Savior likewise did. These different inclinations of the will considered, the reason is easy how in Christ there might grow desires seeming, but being not indeed opposite, either the one of them unto the other, or either of them to the will of God. For let the manner of his speech be weighed: ‘My soul is now troubled, and what should I say? Father, save Me out of this hour? But yet for this very cause I am come into this hour.’ His purpose herein was most effectually to propose to the view of the whole world two contrary objects, the like whereunto in force and efficacy were never presented in that manner to any but only to the soul of Christ. There was presented before his eyes in that fearful hour on the one side God’s heavy indignation and wrath towards mankind as yet unappeased, death as yet in full strength, Hell as yet never mastered by any that came within the confines and bounds thereof, somewhat also peradventure more than is either possible or needful for the wit of man to find out; finally, Himself flesh and blood left alone to enter into conflict with all these. On the other side: a world to be saved by One, a pacification of wrath through the dignity of that sacrifice which should be offered, a conquest over death through the power of that Deity which would not suffer the tabernacle thereof to see corruption, and an utter disappointment of all the forces of infernal powers through the purity of that soul which they should have in their hands and not be able to touch. Let no man marvel that in this case the soul of Christ was much troubled. For what could such apprehensions breed, but (as their nature is) inexplicable passions of mind, desires abhorring what they embrace and embracing what they abhor? In which agony, how should the tongue go about to express what the soul endured? When the griefs of Job were exceeding great, his words accordingly to open them were many; howbeit, still unto his seeming they were undiscovered: ‘Though my talk’ (says Job) ‘be this day in bitterness, yet my plague is greater than my groaning.’ But here to what purpose should words serve, when nature has more to declare than groans and strong cries, more than streams of bloody sweats, more than his doubled and tripled prayers can express, who thrice putting forth his hand to receive that cup, besides which, there was no other cause of his coming into the world, He thrice pulls it back again and as often even with tears of blood craves, ‘If it be possible, O Father, or if not, even what thine own good pleasure is;’ for whose sake the passion that has in it a bitter and a bloody conflict, even with wrath and death, and Hell, is most welcome. Whereas therefore we find in God a will resolved that Christ shall suffer; and in the human will of Christ two actual desires, the one avoiding and the other accepting death: Is that desire which first declares itself by prayer against that wherewith He concludes prayer, or either of them, against his mind to whom prayer in this case seeks? We may judge of these diversities in the will by the like in the understanding. For as the intellectual part does not cross itself by conceiving man to be just and unjust, when it means not the same man, nor by imagining the same man learned and unlearned, if learned in one skill and in another kind of learning unskilful, because the parts of every true opposition do always both concern the same subject and have reference to the same thing, since otherwise they are but in show opposite and not in truth: So the will about one and the same thing may in contrary respects have contrary inclinations and that without contrariety. The minister of justice may, for public example to others, virtuously will the execution of that party whose pardon another for consanguinity’s sake as virtuously may desire. Consider death in itself and nature teaches Christ to shun it. Consider death as a mean to procure the salvation of the world and mercy works in Christ all willingness of mind towards it. Therefore in these two desires there can be no repugnant opposition. Again, compare them with the will of God, and if any opposition be, it must be only between his appointment of Christ’s death and the former desire which wishes deliverance from death. But neither is this desire opposite to the will of God. The will of God was that Christ should suffer the pains of death. Not so his will, as if the torment of innocency did in itself please and delight God; but such was his will in regard of the end whereunto it was necessary that Christ should suffer. The death of Christ in itself therefore, God wills not, which to the end we might thereby obtain life, He both allows and appoints. In like manner, the Son of Man endures willingly to that purpose those grievous pains which simply not to have shunned had been against nature, and by consequent against God. I take it therefore to be an error that Christ either knew not what Himself was to suffer, or else had forgotten the things He knew. The root of which error was an over-restrained consideration of prayer, as though it had no other lawful use but only to serve for a chosen mean whereby the will resolves to seek that which the understanding certainly knows it shall obtain: Whereas prayers, in truth, both unto are, and his were, as well sometime a presentation of mere desires as a mean of procuring desired effects at the hands of God. We are therefore taught by his example that the presence of dolorous and dreadful objects, even in minds most perfect, may as clouds overcast all sensible joy; that no assurance touching future victories can make present conflicts so sweet and easy, but nature will shun and shrink from them; nature will desire ease and deliverance from oppressive burdens that the contrary determination of God is oftentimes against the effect of this desire, yet not against the affection itself, because it is naturally in us; that in such case our prayers cannot serve us as means to obtain the thing we desire; that notwithstanding, they are unto God most acceptable sacrifices because they testify we desire nothing but at his hands, and our desires we submit with contentment to be overruled by his will; and in general they are not repugnant unto the natural will of God which wishes to the works of his own hands, in that they are his own handiwork, all happiness, although perhaps for some special cause in our own particular, a contrary determination have seemed more convenient. Finally, that thus to propose our desires which cannot take such effects as we specify shall notwithstanding otherwise procure us his heavenly grace, even as this very prayer of Christ obtained angels to be sent Him as comforters in his agony. And according to this example, we are not afraid to present unto God our prayers for those things, which that He will perform unto us, we have no sure, nor certain knowledge… Such prayers of the Church to be delivered from all adversity are no more repugnant to any reasonable disposition of men’s minds towards death, much less to that blessed patience and meek contentment which saints by heavenly inspiration have to endure (what cross or calamity soever it pleases God to lay upon them) than our Lord and Savior’s own prayer before his passion was repugnant unto his most gracious resolution to die for the sins of the whole world. 49. In praying for deliverance from all adversity we seek that which nature does wish to itself; but by entreating for mercy towards all we declare that affection wherewith Christian charity thirsts after the good of the whole world: we discharge that duty which the apostle himself does impose on the Church of Christ as a commendable office, a sacrifice acceptable in God’s sight, a service according to his heart whose desire is to have all men saved: a work most suitable with his purpose who gave Himself to be the price of redemption for all and a forcible mean to procure the conversion of all such as are not yet acquainted with the mysteries of that truth which must save their souls. Against it there is but the bare show of this one impediment: that all men’s salvation and many men’s eternal condemnation or death are things the one repugnant to the other: that both cannot be brought to pass: that we know there are vessels of wrath to whom God will never extend mercy and therefore that wittingly we ask an impossible thing to be had. The truth is, that as life and death, mercy and wrath are matters of mere understanding or knowledge, all men’s salvation and some men’s endless perdition are things so opposite that whosoever does affirm the one must necessarily deny the other. God Himself cannot effect both or determine that both shall be. There is in the knowledge both of God and man this certainty, that life and death have divided between them the whole body of mankind. What portion either of the two has, God Himself knows; for us He has left no sufficient means to comprehend, and for that cause neither given any leave to search in particular who are infallibly the heirs of the Kingdom of God, who cast-aways. Howbeit, concerning the state of all men with whom we live (for only of them our prayers are meant), we may till the world’s end, for the present, always presume that as far as in us there is power to discern what others are, and as far as any duty of ours depends upon the notice of their condition in respect of God, the safest axioms for charity to rest itself upon are these: He which believes already is, and he which believes not as yet, may be the child of God. It becomes not us during life altogether to condemn any man, seeing that (for anything we know) there is hope of every man’s forgiveness, the possibility of whose repentance is not yet cut off by death. And therefore charity which hopes all things, prays also for all men. Wherefore to let go personal knowledge touching vessels of wrath and mercy, what they are inwardly in the sight of God, it skills not; for us there is cause sufficient in all men whereupon to ground our prayers unto God in their behalf. For whatsoever the mind of man apprehends as good, the will of charity and love is to have it enlarged in the very uttermost extent, that all may enjoy it to whom it can any way add perfection. Because therefore the farther a good thing does reach, the nobler and worthier we reckon it, our prayers for all men’s good, no less than for our own, the apostle with very fit terms commends as being [Greek], a work commendable for the largeness of the affection from whence it springs, even as theirs which have requested at God’s hands the salvation of many, with the loss of their own souls drowning as it were and overwhelming themselves in the abundance of their love towards others, is proposed as being in regard of the rareness of such affections [Greek], more than excellent. But this extraordinary height of desire after other men’s salvation is no common mark. The other is a duty which belongs unto all and prevails with God daily. For as it is in itself good, so God accepts and takes it in very good part at the hands of faithful men. Our prayers for all men do include both them that shall find mercy and them also that shall find none. For them that shall, no man will doubt but our prayers are both accepted and granted. Touching them for whom we crave that mercy which is not to be obtained, let us not think that our Savior did mis-instruct his disciples, willing them to pray for the peace even of such as should be incapable of so great a blessing, or that the prayers of the prophet Jeremiah offended God because the answer of God was a resolute denial of favor to them for whom supplication was made. And if any man doubt how God should accept such prayers in case they be opposite to his will, or not grant them, if they be according unto that which Himself wills, our answer is that such suits God accepts in that they are conformable unto his general inclination, which is that all men might be saved; yet always He grants them not for as much as there is in God sometimes a more private occasioned will which determines the contrary. So that the other being the rule of our actions, and not this, our requests for things opposite to this will of God are not therefore the less gracious in his sight. There is no doubt but we ought in all things to frame our wills to the will of God and that otherwise in whatsoever we do, we sin. For of ourselves, being so apt to err, the only way which we have to straighten our paths is by following the rule of his will whose footsteps naturally are right. If the eye, the hand or the foot do that which the will commands, though they serve as instruments to sin, yet is sin the commander’s fault and not theirs, because nature has absolutely and without exception made them subjects to the will of man, which is lord over them. As the body is subject to the will of man, so man’s will to the will of God; for so it behoves that the better should guide and command the worse. But because the subjection of the body to the will is by natural necessity, the subjection of the will unto God voluntary, we therefore stand in need of direction, after what sort our wills and desires may be rightly conformed to his. Which is not done by willing always the self-same thing that God intends. For it may chance that his purpose is sometime the speedy death of them whose long continuance in life, if we should not wish, we were unnatural. When the object or matter therefore of our desires is (as in this case) a thing both good of it self and not forbidden of God, when the end for which we desire it is virtuous and apparently most holy, when the root from which our affection towards it proceeds is charity, piety, that which we do in declaring our desire by prayer, yea, over and besides all this, since we know that to pray for all men living is but to show the same affection which towards every of them our Lord Jesus Christ has borne, who knowing only as God who are his, did as man taste death for the good of all men: surely to that will of God which ought to be and is the known rule of all our actions, we do not herein oppose ourselves, although his secret determination haply be against us; which if we did understand, as we do not, yet to rest contented with that which God will have done is as much as He requires at the hands of men. And concerning ourselves, what we earnestly crave in this case, the same, as all things else that are of like condition, we meekly submit unto his most gracious will and pleasure. Finally, as we have cause sufficient why to think the practice of our [Anglican] Church [in the Book of Common Prayer] allowable in this behalf, so neither is ours the first which has been of that mind. For to end with the words of Prosper [d. c. 455]: ‘This law of supplication for all men’ (says he): ‘the devout zeal of all priests and of all faithful men does hold with such full agreement that there is not any part of all the world where Christian people do not use to pray in the same manner. The Church everywhere makes prayers unto God, not only for saints, and such as already in Christ are regenerate, but for all infidels and enemies of the cross of Jesus Christ, for all idolaters, for all that persecute Christ in his followers, for Jews to whose blindness the light of the Gospel does not yet shine, for heretics and schismatics, who from the unity of Faith and charity are estranged. And for such, what does the Church ask of God but this, that leaving their errors they may be converted unto Him, that faith and charity may be given them and that out of the darkness of ignorance they may come to the knowledge of his truth? Which because they cannot themselves do in their own behalf, as long as the sway of evil custom ever-bears them and the chains of Satan detain them bound, neither are they able to break through those errors wherein they are so determinately settled that they pay unto falsity, the whole sum of whatsoever love is owing unto God’s truth. Our Lord merciful and just requires to have all men prayed for; that when we behold innumerable multitudes drawn up from the depth of so bottomless evils, we may not doubt but (in part) God has done the thing we requested, nor despair, but that being thankful for them, towards whom already He has showed mercy, the rest which are not as yet enlightened shall before they pass out of life be made partakers of the like grace. Or if the grace of Him which saves [for so we set is falls out] overpass some, so that the prayer of the Church for them be not received, this we may leave to the hidden judgments of God’s righteousness and acknowledge that in this secret there is a gulf, which, while we live we shall never sound.’ (Of the Calling of the Gentiles, bk. 1, ch. 4, amongst Ambrose’s Works)</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Will, whether it be in God or Man, belongs to the essence or nature of both. The nature therefore of God being one, there are not in God diverse wills, although the Godhead be in diverse Persons, because the power of willing is a natural, not a personal propriety. Contrariwise, the Person of our Savior Christ being but one, there are in Him two wills, because two natures, the nature of God and the nature of man, which both do imply this faculty and power. So that in Christ there is a divine and there is a human will, otherwise He were not both God and Man. Hereupon the Church has of old condemned Monothelites as hereticks for holding that Christ had but one will. The works and operations of our Savior’s human will were all subject to the will of God and framed according to his Law, ‘I desire to do thy will, O God, and thy Law is within mine heart.’ [Ps. 40] Now as man’s will, so the will of Christ has two several kinds of operation: the one natural or necessary, whereby it desires simply whatsoever is good in itself and shuns as generally all things which hurt; the other deliberate, when we therefore embrace things as good because the eye of understanding judges them good to that end which we simply desire. Thus in itself we desire health, physic, only for health’s sake. And in this sort, special reason oftentimes causes the will by choice to prefer one good thing before another, to leave one for another’s sake, to forgo meaner for the attainment of higher desires, which our Savior likewise did. These different inclinations of the will considered, the reason is easy how in Christ there might grow desires seeming, but being not indeed opposite, either the one of them unto the other, or either of them to the will of God. For let the manner of his speech be weighed: ‘My soul is now troubled, and what should I say? Father, save Me out of this hour? But yet for this very cause I am come into this hour.’ His purpose herein was most effectually to propose to the view of the whole world two contrary objects, the like whereunto in force and efficacy were never presented in that manner to any but only to the soul of Christ. There was presented before his eyes in that fearful hour on the one side God’s heavy indignation and wrath towards mankind as yet unappeased, death as yet in full strength, Hell as yet never mastered by any that came within the confines and bounds thereof, somewhat also peradventure more than is either possible or needful for the wit of man to find out; finally, Himself flesh and blood left alone to enter into conflict with all these. On the other side: a world to be saved by One, a pacification of wrath through the dignity of that sacrifice which should be offered, a conquest over death through the power of that Deity which would not suffer the tabernacle thereof to see corruption, and an utter disappointment of all the forces of infernal powers through the purity of that soul which they should have in their hands and not be able to touch. Let no man marvel that in this case the soul of Christ was much troubled. For what could such apprehensions breed, but (as their nature is) inexplicable passions of mind, desires abhorring what they embrace and embracing what they abhor? In which agony, how should the tongue go about to express what the soul endured? When the griefs of Job were exceeding great, his words accordingly to open them were many; howbeit, still unto his seeming they were undiscovered: ‘Though my talk’ (says Job) ‘be this day in bitterness, yet my plague is greater than my groaning.’ But here to what purpose should words serve, when nature has more to declare than groans and strong cries, more than streams of bloody sweats, more than his doubled and tripled prayers can express, who thrice putting forth his hand to receive that cup, besides which, there was no other cause of his coming into the world, He thrice pulls it back again and as often even with tears of blood craves, ‘If it be possible, O Father, or if not, even what thine own good pleasure is;’ for whose sake the passion that has in it a bitter and a bloody conflict, even with wrath and death, and Hell, is most welcome. Whereas therefore we find in God a will resolved that Christ shall suffer; and in the human will of Christ two actual desires, the one avoiding and the other accepting death: Is that desire which first declares itself by prayer against that wherewith He concludes prayer, or either of them, against his mind to whom prayer in this case seeks? We may judge of these diversities in the will by the like in the understanding. For as the intellectual part does not cross itself by conceiving man to be just and unjust, when it means not the same man, nor by imagining the same man learned and unlearned, if learned in one skill and in another kind of learning unskilful, because the parts of every true opposition do always both concern the same subject and have reference to the same thing, since otherwise they are but in show opposite and not in truth: So the will about one and the same thing may in contrary respects have contrary inclinations and that without contrariety. The minister of justice may, for public example to others, virtuously will the execution of that party whose pardon another for consanguinity’s sake as virtuously may desire. Consider death in itself and nature teaches Christ to shun it. Consider death as a mean to procure the salvation of the world and mercy works in Christ all willingness of mind towards it. Therefore in these two desires there can be no repugnant opposition. Again, compare them with the will of God, and if any opposition be, it must be only between his appointment of Christ’s death and the former desire which wishes deliverance from death. But neither is this desire opposite to the will of God. The will of God was that Christ should suffer the pains of death. Not so his will, as if the torment of innocency did in itself please and delight God; but such was his will in regard of the end whereunto it was necessary that Christ should suffer. The death of Christ in itself therefore, God wills not, which to the end we might thereby obtain life, He both allows and appoints. In like manner, the Son of Man endures willingly to that purpose those grievous pains which simply not to have shunned had been against nature, and by consequent against God. I take it therefore to be an error that Christ either knew not what Himself was to suffer, or else had forgotten the things He knew. The root of which error was an over-restrained consideration of prayer, as though it had no other lawful use but only to serve for a chosen mean whereby the will resolves to seek that which the understanding certainly knows it shall obtain: Whereas prayers, in truth, both unto are, and his were, as well sometime a presentation of mere desires as a mean of procuring desired effects at the hands of God. We are therefore taught by his example that the presence of dolorous and dreadful objects, even in minds most perfect, may as clouds overcast all sensible joy; that no assurance touching future victories can make present conflicts so sweet and easy, but nature will shun and shrink from them; nature will desire ease and deliverance from oppressive burdens that the contrary determination of God is oftentimes against the effect of this desire, yet not against the affection itself, because it is naturally in us; that in such case our prayers cannot serve us as means to obtain the thing we desire; that notwithstanding, they are unto God most acceptable sacrifices because they testify we desire nothing but at his hands, and our desires we submit with contentment to be overruled by his will; and in general they are not repugnant unto the natural will of God which wishes to the works of his own hands, in that they are his own handiwork, all happiness, although perhaps for some special cause in our own particular, a contrary determination have seemed more convenient. Finally, that thus to propose our desires which cannot take such effects as we specify shall notwithstanding otherwise procure us his heavenly grace, even as this very prayer of Christ obtained angels to be sent Him as comforters in his agony. And according to this example, we are not afraid to present unto God our prayers for those things, which that He will perform unto us, we have no sure, nor certain knowledge… Such prayers of the Church to be delivered from all adversity are no more repugnant to any reasonable disposition of men’s minds towards death, much less to that blessed patience and meek contentment which saints by heavenly inspiration have to endure (what cross or calamity soever it pleases God to lay upon them) than our Lord and Savior’s own prayer before his passion was repugnant unto his most gracious resolution to die for the sins of the whole world. 49. In praying for deliverance from all adversity we seek that which nature does wish to itself; but by entreating for mercy towards all we declare that affection wherewith Christian charity thirsts after the good of the whole world: we discharge that duty which the apostle himself does impose on the Church of Christ as a commendable office, a sacrifice acceptable in God’s sight, a service according to his heart whose desire is to have all men saved: a work most suitable with his purpose who gave Himself to be the price of redemption for all and a forcible mean to procure the conversion of all such as are not yet acquainted with the mysteries of that truth which must save their souls. Against it there is but the bare show of this one impediment: that all men’s salvation and many men’s eternal condemnation or death are things the one repugnant to the other: that both cannot be brought to pass: that we know there are vessels of wrath to whom God will never extend mercy and therefore that wittingly we ask an impossible thing to be had. The truth is, that as the+one+of+them+unto+the+other%2C+or+either+of+them+to+the+will+of+God.+For+let+the+manner+of+his+speech+be+weighed%3A+%E2%80%98My+soul+is+now+troubled%2C+and+what+should+I+say%3F+Father%2C+save+Me+out+of+this+hour%3F+But+yet+for+this+very+cause+I+am+come+into+this+hour.%E2%80%99+His+purpose+herein+was+most+effectually+to+propose+to+the+view+of+the+whole+world+two+contrary+objects%2C+the+like+whereunto+in+force+and+efficacy+were+never+presented+in+that+manner+to+any+but+only+to+the+soul+of+Christ.+There+was+presented+before+his+eyes+in+that+fearful+hour+on+the+one+side+God%E2%80%99s+heavy+indignation+and+wrath+towards+mankind+as+yet+unappeased%2C+death+as+yet+in+full+strength%2C+Hell+as+yet+never+mastered+by+any+that+came+within+the+confines+and+bounds+thereof%2C+somewhat+also+peradventure+more+than+is+either+possible+or+needful+for+the+wit+of+man+to+find+out%3B+finally%2C+Himself+flesh+and+blood+left+alone+to+enter+into+conflict+with+all+these.+On+the+other+side%3A+a+world+to+be+saved+by+One%2C+a+pacification+of+wrath+through+the+dignity+of+that+sacrifice+which+should+be+offered%2C+a+conquest+over+death+through+the+power+of+that+Deity+which+would+not+suffer+the+tabernacle+thereof+to+see+corruption%2C+and+an+utter+disappointment+of+all+the+forces+of+infernal+powers+through+the+purity+of+that+soul+which+they+should+have+in+their+hands+and+not+be+able+to+touch.+Let+no+man+marvel+that+in+this+case+the+soul+of+Christ+was+much+troubled.+For+what+could+such+apprehensions+breed%2C+but+%28as+their+nature+is%29+inexplicable+passions+of+mind%2C+desires+abhorring+what+they+embrace+and+embracing+what+they+abhor%3F+In+which+agony%2C+how+should+the+tongue+go+about+to+express+what+the+soul+endured%3F+When+the+griefs+of+Job+were+exceeding+great%2C+his+words+accordingly+to+open+them+were+many%3B+howbeit%2C+still+unto+his+seeming+they+were+undiscovered%3A+%E2%80%98Though+my+talk%E2%80%99+%28says+Job%29+%E2%80%98be+this+day+in+bitterness%2C+yet+my+plague+is+greater+than+my+groaning.%E2%80%99+But+here+to+what+purpose+should+words+serve%2C+when+nature+has+more+to+declare+than+groans+and+strong+cries%2C+more+than+streams+of+bloody+sweats%2C+more+than+his+doubled+and+tripled+prayers+can+express%2C+who+thrice+putting+forth+his+hand+to+receive+that+cup%2C+besides+which%2C+there+was+no+other+cause+of+his+coming+into+the+world%2C+He+thrice+pulls+it+back+again+and+as+often+even+with+tears+of+blood+craves%2C+%E2%80%98If+it+be+possible%2C+O+Father%2C+or+if+not%2C+even+what+thine+own+good+pleasure+is%3B%E2%80%99+for+whose+sake+the+passion+that+has+in+it+a+bitter+and+a+bloody+conflict%2C+even+with+wrath+and+death%2C+and+Hell%2C+is+most+welcome.+Whereas+therefore+we+find+in+God+a+will+resolved+that+Christ+shall+suffer%3B+and+in+the+human+will+of+Christ+two+actual+desires%2C+the+one+avoiding+and+the+other+accepting+death%3A+Is+that+desire+which+first+declares+itself+by+prayer+against+that+wherewith+He+concludes+prayer%2C+or+either+of+them%2C+against+his+mind+to+whom+prayer+in+this+case+seeks%3F+We+may+judge+of+these+diversities+in+the+will+by+the+like+in+the+understanding.+For+as+the+intellectual+part+does+not+cross+itself+by+conceiving+man+to+be+just+and+unjust%2C+when+it+means+not+the+same+man%2C+nor+by+imagining+the+same+man+learned+and+unlearned%2C+if+learned+in+one+skill+and+in+another+kind+of+learning+unskilful%2C+because+the+parts+of+every+true+opposition+do+always+both+concern+the+same+subject+and+have+reference+to+the+same+thing%2C+since+otherwise+they+are+but+in+show+opposite+and+not+in+truth%3A+So+the+will+about+one+and+the+same+thing+may+in+contrary+respects+have+contrary+inclinations+and+that+without+contrariety.+The+minister+of+justice+may%2C+for+public+example+to+others%2C+virtuously+will+the+execution+of+that+party+whose+pardon+another+for+consanguinity%E2%80%99s+sake+as+virtuously+may+desire.+Consider+death+in+itself+and+nature+teaches+Christ+to+shun+it.+Consider+death+as+a+mean+to+procure+the+salvation+of+the+world+and+mercy+works+in+Christ+all+willingness+of+mind+towards+it.+Therefore+in+these+two+desires+there+can+be+no+repugnant+opposition.+Again%2C+compare+them+with+the+will+of+God%2C+and+if+any+opposition+be%2C+it+must+be+only+between+his+appointment+of+Christ%E2%80%99s+death+and+the+former+desire+which+wishes+deliverance+from+death.+But+neither+is+this+desire+opposite+to+the+will+of+God.+The+will+of+God+was+that+Christ+should+suffer+the+pains+of+death.+Not+so+his+will%2C+as+if+the+torment+of+innocency+did+in+itself+please+and+delight+God%3B+but+such+was+his+will+in+regard+of+the+end+whereunto+it+was+necessary+that+Christ+should+suffer.+The+death+of+Christ+in+itself+therefore%2C+God+wills+not%2C+which+to+the+end+we+might+thereby+obtain+life%2C+He+both+allows+and+appoints.+In+like+manner%2C+the+Son+of+Man+endures+willingly+to+that+purpose+those+grievous+pains+which+simply+not+to+have+shunned+had+been+against+nature%2C+and+by+consequent+against+God.+I+take+it+therefore+to+be+an+error+that+Christ+either+knew+not+what+Himself+was+to+suffer%2C+or+else+had+forgotten+the+things+He+knew.+The+root+of+which+error+was+an+over-restrained+consideration+of+prayer%2C+as+though+it+had+no+other+lawful+use+but+only+to+serve+for+a+chosen+mean+whereby+the+will+resolves+to+seek+that+which+the+understanding+certainly+knows+it+shall+obtain%3A+Whereas+prayers%2C+in+truth%2C+both+unto+are%2C+and+his+were%2C+as+well+sometime+a+presentation+of+mere+desires+as+a+mean+of+procuring+desired+effects+at+the+hands+of+God.+We+are+therefore+taught+by+his+example+that+the+presence+of+dolorous+and+dreadful+objects%2C+even+in+minds+most+perfect%2C+may+as+clouds+overcast+all+sensible+joy%3B+that+no+assurance+touching+future+victories+can+make+present+conflicts+so+sweet+and+easy%2C+but+nature+will+shun+and+shrink+from+them%3B+nature+will+desire+ease+and+deliverance+from+oppressive+burdens+that+the+contrary+determination+of+God+is+oftentimes+against+the+effect+of+this+desire%2C+yet+not+against+the+affection+itself%2C+because+it+is+naturally+in+us%3B+that+in+such+case+our+prayers+cannot+serve+us+as+means+to+obtain+the+thing+we+desire%3B+that+notwithstanding%2C+they+are+unto+God+most+acceptable+sacrifices+because+they+testify+we+desire+nothing+but+at+his+hands%2C+and+our+desires+we+submit+with+contentment+to+be+overruled+by+his+will%3B+and+in+general+they+are+not+repugnant+unto+the+natural+will+of+God+which+wishes+to+the+works+of+his+own+hands%2C+in+that+they+are+his+own+handiwork%2C+all+happiness%2C+although+perhaps+for+some+special+cause+in+our+own+particular%2C+a+contrary+determination+have+seemed+more+convenient.+Finally%2C+that+thus+to+propose+our+desires+which+cannot+take+such+effects+as+we+specify+shall+notwithstanding+otherwise+procure+us+his+heavenly+grace%2C+even+as+this+very+prayer+of+Christ+obtained+angels+to+be+sent+Him+as+comforters+in+his+agony.+And+according+to+this+example%2C+we+are+not+afraid+to+present+unto+God+our+prayers+for+those+things%2C+which+that+He+will+perform+unto+us%2C+we+have+no+sure%2C+nor+certain+knowledge%E2%80%A6+Such+prayers+of+the+Church+to+be+delivered+from+all+adversity+are+no+more+repugnant+to+any+reasonable+disposition+of+men%E2%80%99s+minds+towards+death%2C+much+less+to+that+blessed+patience+and+meek+contentment+which+saints+by+heavenly+inspiration+have+to+endure+%28what+cross+or+calamity+soever+it+pleases+God+to+lay+upon+them%29+than+our+Lord+and+Savior%E2%80%99s+own+prayer+before+his+passion+was+repugnant+unto+his+most+gracious+resolution+to+die+for+the+sins+of+the+whole+world.+49.+In+praying+for+deliverance+from+all+adversity+we+seek+that+which+nature+does+wish+to+itself%3B+but+by+entreating+for+mercy+towards+all+we+declare+that+affection+wherewith+Christian+charity+thirsts+after+the+good+of+the+whole+world%3A+we+discharge+that+duty+which+the+apostle+himself+does+impose+on+the+Church+of+Christ+as+a+commendable+office%2C+a+sacrifice+acceptable+in+God%E2%80%99s+sight%2C+a+service+according+to+his+heart+whose+desire+is+to+have+all+men+saved%3A+a+work+most+suitable+with+his+purpose+who+gave+Himself+to+be+the+price+of+redemption+for+all+and+a+forcible+mean+to+procure+the+conversion+of+all+such+as+are+not+yet+acquainted+with+the+mysteries+of+that+truth+which+must+save+their+souls.+Against+it+there+is+but+the+bare+show+of+this+one+impediment%3A+that+all+men%E2%80%99s+salvation+and+many+men%E2%80%99s+eternal+condemnation+or+death+are+things+the+one+repugnant+to+the+other%3A+that+both+cannot+be+brought+to+pass%3A+that+we+know+there+are+vessels+of+wrath+to+whom+God+will+never+extend+mercy+and+therefore+that+wittingly+we+ask+an+impossible+thing+to+be+had.+The+truth+is%2C+that+as+life+and+death%2C+mercy+and+wrath+are+matters+of+mere+understanding+or+knowledge%2C+all+men%E2%80%99s+salvation+and+some+men%E2%80%99s+endless+perdition+are+things+so+opposite+that+whosoever+does+affirm+the+one+must+necessarily+deny+the+other.+God+Himself+cannot+effect+both+or+determine+that+both+shall+be.+There+is+in+the+knowledge+both+of+God+and+man+this+certainty%2C+that+life+and+death+have+divided+between+them+the+whole+body+of+mankind.+What+portion+either+of+the+two+has%2C+God+Himself+knows%3B+for+us+He+has+left+no+sufficient+means+to+comprehend%2C+and+for+that+cause+neither+given+any+leave+to+search+in+particular+who+are+infallibly+the+heirs+of+the+Kingdom+of+God%2C+who+cast-aways.+Howbeit%2C+concerning+the+state+of+all+men+with+whom+we+live+%28for+only+of+them+our+prayers+are+meant%29%2C+we+may+till+the+world%E2%80%99s+end%2C+for+the+present%2C+always+presume+that+as+far+as+in+us+there+is+power+to+discern+what+others+are%2C+and+as+far+as+any+duty+of+ours+depends+upon+the+notice+of+their+condition+in+respect+of+God%2C+the+safest+axioms+for+charity+to+rest+itself+upon+are+these%3A+He+which+believes+already+is%2C+and+he+which+believes+not+as+yet%2C+may+be+the+child+of+God.+It+becomes+not+us+during+life+altogether+to+condemn+any+man%2C+seeing+that+%28for+anything+we+know%29+there+is+hope+of+every+man%E2%80%99s+forgiveness%2C+the+possibility+of+whose+repentance+is+not+yet+cut+off+by+death.+And+therefore+charity+which+hopes+all+things%2C+prays+also+for+all+men.+Wherefore+to+let+go+personal+knowledge+touching+vessels+of+wrath+and+mercy%2C+what+they+are+inwardly+in+the+sight+of+God%2C+it+skills+not%3B+for+us+there+is+cause+sufficient+in+all+men+whereupon+to+ground+our+prayers+unto+God+in+their+behalf.+For+whatsoever+the+mind+of+man+apprehends+as+good%2C+the+will+of+charity+and+love+is+to+have+it+enlarged+in+the+very+uttermost+extent%2C+that+all+may+enjoy+it+to+whom+it+can+any+way+add+perfection.+Because+therefore+the+farther+a+good+thing+does+reach%2C+the+nobler+and+worthier+we+reckon+it%2C+our+prayers+for+all+men%E2%80%99s+good%2C+no+less+than+for+our+own%2C+the+apostle+with+very+fit+terms+commends+as+being+%5BGreek%5D%2C+a+work+commendable+for+the+largeness+of+the+affection+from+whence+it+springs%2C+even+as+theirs+which+have+requested+at+God%E2%80%99s+hands+the+salvation+of+many%2C+with+the+loss+of+their+own+souls+drowning+as+it+were+and+overwhelming+themselves+in+the+abundance+of+their+love+towards+others%2C+is+proposed+as+being+in+regard+of+the+rareness+of+such+affections+%5BGreek%5D%2C+more+than+excellent.+But+this+extraordinary+height+of+desire+after+other+men%E2%80%99s+salvation+is+no+common+mark.+The+other+is+a+duty+which+belongs+unto+all+and+prevails+with+God+daily.+For+as+it+is+in+itself+good%2C+so+God+accepts+and+takes+it+in+very+good+part+at+the+hands+of+faithful+men.+Our+prayers+for+all+men+do+include+both+them+that+shall+find+mercy+and+them+also+that+shall+find+none.+For+them+that+shall%2C+no+man+will+doubt+but+our+prayers+are+both+accepted+and+granted.+Touching+them+for+whom+we+crave+that+mercy+which+is+not+to+be+obtained%2C+let+us+not+think+that+our+Savior+did+mis-instruct+his+disciples%2C+willing+them+to+pray+for+the+peace+even+of+such+as+should+be+incapable+of+so+great+a+blessing%2C+or+that+the+prayers+of+the+prophet+Jeremiah+offended+God+because+the+answer+of+God+was+a+resolute+denial+of+favor+to+them+for+whom+supplication+was+made.+And+if+any+man+doubt+how+God+should+accept+such+prayers+in+case+they+be+opposite+to+his+will%2C+or+not+grant+them%2C+if+they+be+according+unto+that+which+Himself+wills%2C+our+answer+is+that+such+suits+God+accepts+in+that+they+are+conformable+unto+his+general+inclination%2C+which+is+that+all+men+might+be+saved%3B+yet+always+He+grants+them+not+for+as+much+as+there+is+in+God+sometimes+a+more+private+occasioned+will+which+determines+the+contrary.+So+that+the+other+being+the+rule+of+our+actions%2C+and+not+this%2C+our+requests+for+things+opposite+to+this+will+of+God+are+not+therefore+the+less+gracious+in+his+sight.+There+is+no+doubt+but+we+ought+in+all+things+to+frame+our+wills+to+the+will+of+God+and+that+otherwise+in+whatsoever+we+do%2C+we+sin.+For+of+ourselves%2C+being+so+apt+to+err%2C+the+only+way+which+we+have+to+straighten+our+paths+is+by+following+the+rule+of+his+will+whose+footsteps+naturally+are+right.+If+the+eye%2C+the+hand+or+the+foot+do+that+which+the+will+commands%2C+though+they+serve+as+instruments+to+sin%2C+yet+is+sin+the+commander%E2%80%99s+fault+and+not+theirs%2C+because+nature+has+absolutely+and+without+exception+made+them+subjects+to+the+will+of+man%2C+which+is+lord+over+them.+As+the+body+is+subject+to+the+will+of+man%2C+so+man%E2%80%99s+will+to+the+will+of+God%3B+for+so+it+behoves+that+the+better+should+guide+and+command+the+worse.+But+because+the+subjection+of+the+body+to+the+will+is+by+natural+necessity%2C+the+subjection+of+the+will+unto+God+voluntary%2C+we+therefore+stand+in+need+of+direction%2C+after+what+sort+our+wills+and+desires+may+be+rightly+conformed+to+his.+Which+is+not+done+by+willing+always+the+self-same+thing+that+God+intends.+For+it+may+chance+that+his+purpose+is+sometime+the+speedy+death+of+them+whose+long+continuance+in+life%2C+if+we+should+not+wish%2C+we+were+unnatural.+When+the+object+or+matter+therefore+of+our+desires+is+%28as+in+this+case%29+a+thing+both+good+of+it+self+and+not+forbidden+of+God%2C+when+the+end+for+which+we+desire+it+is+virtuous+and+apparently+most+holy%2C+when+the+root+from+which+our+affection+towards+it+proceeds+is+charity%2C+piety%2C+that+which+we+do+in+declaring+our+desire+by+prayer%2C+yea%2C+over+and+besides+all+this%2C+since+we+know+that+to+pray+for+all+men+living+is+but+to+show+the+same+affection+which+towards+every+of+them+our+Lord+Jesus+Christ+has+borne%2C+who+knowing+only+as+God+who+are+his%2C+did+as+man+taste+death+for+the+good+of+all+men%3A+surely+to+that+will+of+God+which+ought+to+be+and+is+the+known+rule+of+all+our+actions%2C+we+do+not+herein+oppose+ourselves%2C+although+his+secret+determination+haply+be+against+us%3B+which+if+we+did+understand%2C+as+we+do+not%2C+yet+to+rest+contented+with+that+which+God+will+have+done+is+as+much+as+He+requires+at+the+hands+of+men.+And+concerning+ourselves%2C+what+we+earnestly+crave+in+this+case%2C+the+same%2C+as+all+things+else+that+are+of+like+condition%2C+we+meekly+submit+unto+his+most+gracious+will+and+pleasure.+Finally%2C+as+we+have+cause+sufficient+why+to+think+the+practice+of+our+%5BAnglican%5D+Church+%5Bin+the+Book+of+Common+Prayer%5D+allowable+in+this+behalf%2C+so+neither+is+ours+the+first+which+has+been+of+that+mind.+For+to+end+with+the+words+of+Prosper+%5Bd.+c.+455%5D%3A+%E2%80%98This+law+of+supplication+for+all+men%E2%80%99+%28says+he%29%3A+%E2%80%98the+devout+zeal+of+all+priests+and+of+all+faithful+men+does+hold+with+such+full+agreement+that+there+is+not+any+part+of+all+the+world+where+Christian+people+do+not+use+to+pray+in+the+same+manner.+The+Church+everywhere+makes+prayers+unto+God%2C+not+only+for+saints%2C+and+such+as+already+in+Christ+are+regenerate%2C+but+for+all+infidels+and+enemies+of+the+cross+of+Jesus+Christ%2C+for+all+idolaters%2C+for+all+that+persecute+Christ+in+his+followers%2C+for+Jews+to+whose+blindness+the+light+of+the+Gospel+does+not+yet+shine%2C+for+heretics+and+schismatics%2C+who+from+the+unity+of+Faith+and+charity+are+estranged.+And+for+such%2C+what+does+the+Church+ask+of+God+but+this%2C+that+leaving+their+errors+they+may+be+converted+unto+Him%2C+that+faith+and+charity+may+be+given+them+and+that+out+of+the+darkness+of+ignorance+they+may+come+to+the+knowledge+of+his+truth%3F+Which+because+they+cannot+themselves+do+in+their+own+behalf%2C+as+long+as+the+sway+of+evil+custom+ever-bears+them+and+the+chains+of+Satan+detain+them+bound%2C+neither+are+they+able+to+break+through+those+errors+wherein+they+are+so+determinately+settled+that+they+pay+unto+falsity%2C+the+whole+sum+of+whatsoever+love+is+owing+unto+God%E2%80%99s+truth.+Our+Lord+merciful+and+just+requires+to+have+all+men+prayed+for%3B+that+when+we+behold+innumerable+multitudes+drawn+up+from+the+depth+of+so+bottomless+evils%2C+we+may+not+doubt+but+%28in+part%29+God+has+done+the+thing+we+requested%2C+nor+despair%2C+but+that+being+thankful+for+them%2C+towards+whom+already+He+has+showed+mercy%2C+the+rest+which+are+not+as+yet+enlightened+shall+before+they+pass+out+of+life+be+made+partakers+of+the+like+grace.+Or+if+the+grace+of+Him+which+saves+%5Bfor+so+we+set+is+falls+out%5D+overpass+some%2C+so+that+the+prayer+of+the+Church+for+them+be+not+received%2C+this+we+may+leave+to+the+hidden+judgments+of+God%E2%80%99s+righteousness+and+acknowledge+that+in+this+secret+there+is+a+gulf%2C+which%2C+while+we+live+we+shall+never+sound.%E2%80%99+%28Of+the+Calling+of+the+Gentiles%2C+bk.+1%2C+ch.+4%2C+amongst+Ambrose%E2%80%99s+Works%29%E2%80%9D%0A%0A%E2%80%94+Richard+Hooker%2C+The+Works+of+Mr.+Richard+Hooker%E2%80%A6+in+Eight+Books+of+Ecclesiastical+Polity%E2%80%A6+%28London%3A+Newcomb%2C+1666%29%2C+bk.+5%2C+pp.+202-6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F121d5720ad.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/121d5720ad.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/prayer#:~:text=Will%2C%20whether%20it%20be%20in%20God,1%2C%20ch.%204%2C%20amongst%20Ambrose%E2%80%99s%20Works&amp;text=Will%2C%20whether%20it%20be%20in%20God%20or%20Man&amp;text=Gentiles%2C%20bk.%201%2C%20ch.%204%2C%20amongst%20Ambrose%E2%80%99s%20Works" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7ccd6764ee" data-kw="">
<blockquote><p>We do not reject the commemoration or honorable mention of the dead saints, nor an annual thanksgiving for those who have departed in the faith of Christ: besides we have acknowledged that we may pray for a blessed resurrection, for a public absolution in the day of judgment and the perfect happiness of deceased believers, without any superstition. Hence that solemn prayer in our English [Anglican] Church, when the dead are conveyed to the tomb: ‘Almighty God… beseeching Thee, that it may please Thee of thy gracious goodness shortly to accomplish… that we, with all those who are departed in the true faith of thy holy name, may have our perfect consummation and bliss, both in body and soul, in they eternal and everlasting glory, etc.&#x27;</p></blockquote>

<blockquote><p>Rather the question is whether they are to be reverenced with religious worship properly so called. This our opponents wish; we deny. At the outset, we oppose the calumnies of the papists who slander us as despisers and enemies of the saints because we repudiate the worship of them (as if disgrace were thrown upon the saints when what belongs to God and Christ alone is not attributed to them). Now although their memory is very sacred to us, still we think that care should be diligently taken that they be not worshipped to the injury of God.</p></blockquote>

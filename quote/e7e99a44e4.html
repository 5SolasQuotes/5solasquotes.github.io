<main class="wrap"><figure class="quote" id="q-e7e99a44e4" data-kw="">
<blockquote><p>It might be very expedient, upon the principles of Christian prudence, that, where it can be accomplished, every pastor of a large congregation should still have assistant ministers; and some presidents among the pastors of different congregations, when they are meeting about any public business, is what common sense dictates in such circumstances: and if instead of a chair-man chosen for that particular time and occasion, some person, of experienced, approved fidelity and ability, should be appointed to exercise some stated over-fight over a few of the neighbouring congregations, it might perhaps be attended with such consequences, as would render such a sort of discipline not only tolerable, but eligible.

Something of this kind was projected in archbishop Usher’s plan for the reduction of episcopacy, by which he would have moderated it in such a manner, as to have brought it very near the presbyterian government of the Scotch church; the weekly parochial vestry answering to their church-session; the monthly synod, to be held by the Chorepiscopi, answering to their presbyteries; the diocesan synod to their provincial, and the national to their general assembly. The meeting of the dean and chapter, practised in the church of England, is but a faint shadow of the second, the ecclesiastical court of the third, and the convocation of the fourth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-doddridge.html">Philip Doddridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Course of Lectures on the Principal Subjects in Pneumatology, Ethics, and Divinity</cite>, (London: J. Buckland, 1763), Proposition CL, Scholium 3, p. 522.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ac4ae9b101" data-kw="">
<blockquote><p>God’s increasing goodness may give some satisfaction to such as make question of Church Governors, proper and peculiar to the Church.

Of such I demand, whether it be a good, useful, and needful thing, for the Church to have Governors of its own; and secondly, whether the Church of the Jews had such Governors, or no. Surely, me thinks neither of these should be denied.

Have not families, schools of learning, Colleges, Universities, Cities, Towns, all manner of Corporations, Companies and Societies, Governors proper and peculiar to themselves: besides the public Magistrates, who are also over them? Is it not by experience found, that such proper and peculiar Governors are needful and useful, and so good in their several spheres? And shall the best Society on earth, the militant Church, be without Ecclesiastical Governors, proper and peculiar to it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The progress of divine providence, set out in a sermon preached in the Abbey Church of Westminster before the House of Peers, on the 24th of September, 1645. being the day of their monthly fast</cite>, (London: Joshua Kirton, 1645), p. 24.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-636237e129" data-kw="">
<blockquote><p>If &quot;elders&quot; and &quot;bishops&quot; be not the same persons, having the same office, the same function, and the same duties, and the same names, it is impossible, So far as I understand, how it should be expressed: for these elders are they whom the Holy Ghost made bishops, they were many of them in the same church, their duty it was to attend unto the flock and to feed the church, which comprise all the duties, the whole function of elders and bishops; which must therefore be the same.</p></blockquote>

<blockquote><p>…there may be somethings truly errors that may and should be forborne [tolerated] in themselves, yet their consequents ought not to be forborne, and this also may be at one time, and in one Church more necessary to be adverted to than in another, because consequents of schism, faction, division, etc. may sometimes follow on the meanest [the least] errors. And seeing these are always enemies to edification, even when they arise from the least ground, they are never absolutely to be foreborne; for to say, I am of Paul, and I am of Apollos, and for one to think such a man a better preacher than another, seems to be no great matter; yet when it begins to rent [tear] them, and to make factions in Corinth, it is not to be forborne, but to be reproved: And in the former difference of meats, the apostle condemns always the offence and schism that followed on it, although he did not peremptorily decide anything as to men’s practices, or censure for the opinion itself… Thus the differences and errors concerning Church-government by bishops, and in the Congregational way, may, we conceive, in themselves be forborne in persons where they are not vented to the shaking and drawing away of others; but if pressed in practice, to the renting of a Church, and preferred or equalled to the true government that is established by the Word, in that case they are not to be foreborn, because then truth is to be vindicated, and obstructions to edification in the renting or distracting of a Church to be removed, and at one time more than at another, as such an offence does waken a schism, and disturb order and union in one Church or at one time more than another: hence we see, Acts 15, some things are put in that decree in reference to that time, only for preventing of schism and scandal…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on Scandal</cite>, (1659), ch. 8, When Some Errors are to be Foreborne, p. 205-206:</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d3bbb51ec1" data-kw="">
<blockquote><p>…For like every other natural phenomenon, practical reason has a natural end or goal toward which it is ordered, and that end or goal is just whatever it is the intellect perceives to be good or worth pursuing. Now given what has already been said, human beings, like everything else in nature, have various capacities and ends the fulfillment of which is good for them and the frustrating of which is bad, as a matter of objective fact. A rational intellect apprised of the facts will therefore perceive that it is good to realize these ends and bad to frustrate them. It follows, then, that a rational person will pursue the realization of these ends and avoid their frustration. In short, practical reason is directed by nature toward the pursuit of what the intellect perceives to be good; what is in fact good is the realization of the various ends inherent in human nature; and thus a rational and correctly informed person will perceive this and, accordingly, direct his actions towards the realization or fulfillment of those ends. In this sense, good action is just that which is “in accord with reason” (Summa Theologiae I-II.21.1; cf. Summa Theologiae I-II.90.1), and the moral skeptic’s question “Why should I do what is good?” has an obvious answer: Because to be rational just is (in part) to do what is good, to fulfill the ends set for us by nature. Natural law ethics as a body of substantive moral theory is the formulation of general moral principles on the basis of an analysis of the various human capacities and ends and the systematic working out of their implications. So, to take just one example, when we consider that human beings have intellects and that the natural end or function of the intellect is to grasp the truth about things, it follows that it is good for us—it fulfills our nature—to pursue truth and avoid error…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, (South End, IN: St. Augustine’s Press, 2015), ch. 16, ‘In Defense of the Perverted Faculty Argument’, pp. 385-86</span></figcaption>

<blockquote><p>1. Whether every instituted worship and its parts and circumstances are prescribed by the Word of God? It is affirmed. 2. Whether any through pretended opinions, the authority of the Church or the power of the magistrate are able to impose these in part on consciences? It is denied. 3. Whether instituted worship is mutable? It is affirmed with a distinction.</p></blockquote>

</figure><figure class="quote" id="q-4ae08d984d" data-kw="">
<blockquote><p>A perfect being’s love seems to be a pure perfection; therefore it belongs to God and indeed in supreme degree. The proof of the antecedent is: a) if love of this sort were not a pure perfection formally, it could be reduced to one or other pure perfections that were not formally love. But I do not see how such love could be reduced to something that was formally love. b) To love seems to be better than not to love; therefore love seems to be a pure perfection, because it is better than what is incompatible with it (namely not to love). The proof of the antecedent here is: a distinction must be drawn between love of friendship (benevolence) and love of concupiscence. The former is love of an object for its own sake, that is, because of the object’s intrinsic perfection, and this love does not seem to involve imperfection in the lover. Love of concupiscence is love of an object and not for the object’s sake finally but because the object perfects the lover or is a good for the lover. But this love does involve imperfection because the object is wanted precisely because it perfects a lover that is in itself capable of perfection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), pt. 3, pp. 100-101 Wolter was a Scotus scholar.</span></figcaption>

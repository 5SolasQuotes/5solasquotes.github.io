<blockquote><p>The admission of ministers to their offices must consist in consent of the people and kirk whereto they shall be appointed, and in approbation of the learned ministers appointed for their examination. … Other ceremony than the public approbation of the people, and declaration of the chief minister, that the person there presented is appointed to serve that kirk, we cannot approve; for albeit the apostles used the imposition of hands, yet seeing the miracle is ceased, the using of the ceremony we judge is not necessary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/first-scottish-book-of-discipline.html">First Scottish Book of Discipline</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fourth Head, Concerning Ministers and Their Lawful Election</cite></span></figcaption>

</figure><figure class="quote" id="q-dfd68668bf" data-kw="">
<blockquote><p>That to the worthy we may witness freely any truth. To the unworthy, which seek extremity of law against us, we will witness that truth which the law will afford us, and urge it no further, but to stop their own mouths and to leave them without excuse. Yea and no preacher has furhter message to such, when they thoroughly know them to be such, and when they know that the further truth may better be taught in another place and to more meet persons.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

— Thomas Cartwright, eds. Peel &amp; Carlson, Cartwrightiana (London: Halley Stewart, 1951), 3. ‘A Reproof of Certain Schismatical Persons,’, p. 227">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+to+the+worthy+we+may+witness+freely+any+truth.+To+the+unworthy%2C+which+seek+extremity+of+law+against+us%2C+we+will+witness+that+truth+which+the+law+will+afford+us%2C+and+urge+it+no+further%2C+but+to+stop+their+own+mouths+and+to+leave+them+without+excuse.+Yea+and+no+preacher+has+furhter+message+to+such%2C+when+they+thoroughly+know+them+to+be+such%2C+and+when+they+know+that+the+further+truth+may+better+be+taught+in+another+place+and+to+more+meet+persons.%E2%80%9D%0A%0A%E2%80%94+Thomas+Cartwright%2C+eds.+Peel+%26+Carlson%2C+Cartwrightiana+%28London%3A+Halley+Stewart%2C+1951%29%2C+3.+%E2%80%98A+Reproof+of+Certain+Schismatical+Persons%2C%E2%80%99%2C+p.+227&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdfd68668bf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dfd68668bf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/pastors#:~:text=That%20to%20the%20worthy%20we%20may,place%20and%20to%20more%20meet%20persons&amp;text=That%20to%20the%20worthy%20we%20may%20witness%20freely&amp;text=in%20another%20place%20and%20to%20more%20meet%20persons" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f1ba55c5d5" data-kw="">
<blockquote><p>Hence our Fifth Conclusion: when there is an equal rupture in the body, nothing extraordinary would be attempted if ordinary ways can be had: if Saul the ordinary magistrate had at God’s commandment killed Hagag, Samuel the prophet should not have drawn his sword; And therefore in this case [of a major and irresolvable rupture in the Church] the magistrate would first seek help from other Churches, as that learned Apollonius says. But if that cannot be conveniently had, as in a national Church it may fall out, then the magistrate, as a preserver of peace and truth, may command the sincerer part [of the ministry] to convene in a synod, and do their duty, as the good kings of the people of God did: 2 Chron. 15. Asa gathered together a people who entered in Covenant to seek the Lord God with all their heart, and laid an obligation of punishment to death on the rest, vv. 12-13, and Jehoshaphat, 2 Chron. 23:4, he laid charge on Hilkiah the High Priest, and the priests of the second order, whom he knew to be better affected to the work, to bring out the vessels made for Baal; which proves that the king should put the sincerest to do that, which in common belongs to the whole; In which case of the erring of the most part of the Church, the prince indirectly condemns the erring part of the synod, because it is his place to forbid and to punish with the sword, the transgressors of God’s Law. But because his power is accumulative, not privative, under that pretense he has not power to hinder the sincerer part to meet and determine according to the Word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Pt. 2, p. 411</span></figcaption>

ba55c5d5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-an-extraordinary-calling/#:~:text=Hence%20our%20Fifth%20Conclusion%3A%20when%20there,according%20to%20the%20Word%20of%20God&amp;text=Hence%20our%20Fifth%20Conclusion%3A%20when%20there%20is%20an&amp;text=and%20determine%20according%20to%20the%20Word%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5ace3f38cc" data-kw="">
<blockquote><p>O that our Lord would be pleased to reveal his mind to our dear [congregationalist] Brethren in this point of truth. For what be extraordinary and temporary in the conjoined authority and pastoral care of the apostles for all the Churches of the world, I see not, neither is it in reason imaginable, which does not in conscience oblige pastors, doctors and elders in the Church of Scotland, to conjoin their authority in one synodical power for all the churches of Scotland…</p></blockquote>

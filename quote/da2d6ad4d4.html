<main class="wrap"><figure class="quote" id="q-da2d6ad4d4" data-kw="">
<blockquote><p>Let every man who would lay claim to patriotism and be thought a good member of civil society, keep back his foot from polluting the Sabbath. It is manifest, from the preceding remarks, that the Sabbath-breaker strikes at the root of all that is peaceful and orderly, and opens the way for the spread of irreligion, infidelity, and moral death. The man who by his example weakens the pervading sense of obligation to God, and overthrows the authority of a Divine institution, does so much toward the ruin of his country, and is one of its worst enemies. He may not feel himself to be so, but he is so in reality.

We can little regard a man’s boasts of patriotism, his fourth of July orations, his flaming toasts, his shouldering of his musket on public days, when we see him regardless of the laws of God, and by an immoral example sapping the foundations of republican government. He is no patriot at heart. For the real friend of his country will avoid every course which is manifestly ruinous to its interests, and will uphold every institution which is promotive of its welfare. And what more so than the Sabbath? …

I repeat it, it is vanity for that man to lay claim of the tribute of patriotism, who by his example and influence in reference to the Sabbath, is subverting religion and morality, those great pillars of human happiness. He may have much of the milk of human kindness, may possess the sweet charities of life, may be amiable, and admired for his talents and usefulness in other respects, yet if he break the fourth commandment, and teach men so, he shall not only be of no esteem in the kingdom of heaven, but is certainly laying the axe at the root of his country’s brightest hopes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-holmes-agnew.html">John Holmes Agnew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Manual on the Christian Sabbath</cite>, (Philadelphia PA: Presbyterian Board of Publication, 1852), pp 134-36.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f486f665f6" data-kw="">
<blockquote><p>The misconduct of their women (some of whom seem to have been inspired) in the public assembly, who laid by their veils, the common token of subjection to their husbands in that part of the world… … it must be observed that it was a signification either of shame or subjection for persons to be veiled, or covered, in the eastern countries, contrary to the custom of ours, where the being bare-headed betokens subjection, and being covered superiority and dominion… Now, believe evil angels will be sure to mix in all Christian assemblies, therefore should women wear the token of their shamefacedness and subjection, which in that age and country, was a veil… He [Paul] sums up all by referring those who were contentious to the usages and customs of the churches, v. 16. Custom is in a great measure the rule of decency. And the common practice of the churches is what would have them govern themselves by. He does not silence the contentious by mere authority, but lets them know that they would appear to the world as very odd and singular in their humor if they would quarrel for a custom to which all the churches of Christ were at that time utter strangers, or against a custom in which they all concurred, and that upon the ground of natural decency. It was the common usage of the churches for women to appear in public assemblies, and join in public worship, veiled; and it was manifestly decent that they should do so. Those must be very contentious indeed who would quarrel with this, or lay it aside.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 11</span></figcaption>

<blockquote><p>Carnal sports and pleasures are as great a profanation of the sabbath, as the most servile labour and drudgery in the world. Dicing and card-playing do as much violate the law of the sabbath, as digging and carting; playing, as much as ploughing; dancing and morrice-games, as much as working in the smith’s forge; bowling and shooting, as well as hewing of wood and drawing of water.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-case.html">Thomas Case</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon VI. Of Sabbath Sanctification in Puritan Sermons 1659-1689: Being the Morning Exercises at Cripplegate, St. Giles in the Fields and in Southwark</cite></span></figcaption>

</figure><figure class="quote" id="q-00ebb07e1e" data-kw="">
<blockquote><p>How happy will that state be, when neither divine nor human learning shall be confined and imprisoned within only two or three nations of Europe, but shall be diffused all over the world, and this lower world shall be all over covered with light, the various parts of it mutually enlightening each other; when the most barbarous nations shall become as bright and polite as England; when ignorant heathen lands shall be stocked with most profound divines and most learned philosophers; when we shall from time to time have the most excellent books and wonderful performances brought from one end of the earth and another to surprise us—sometimes new and wondrous discoveries from Terra Australis Incognita, admirable books of devotion, the most divine and angelic strains from among the Hottentots, and the press shall groan in wild Tartary—when we shall have the great advantage of the sentiments of men of the most distant nations, different circumstances, customs and tempers; [when] learning shall not be restrained [by] the particular humour of a nation or their singular way of treating of things; when the distant extremes of the world shall shake hands together and all nations shall be acquainted and they shall all join the forces of their minds in exploring the glories of the Creator, their hearts in loving and adoring him, their hands in serving him, and their voices in making the world to ring with his praise.

What infinite advantages will they have for discovering the truth of every kind, to what they have now! There will continually be something new and surprising discovered in one part of the world and another [because of] the vast number of explorers, their different circumstances, their different paths to come at the truth. How many instructive and enlightening remains of antiquity will be discovered, here and there now buried amongst ignorant nations!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jonathan Edwards</cite>, 26. Millennium in The “Miscellanies”: (Entry Nos. a-z, aa-zz, 1-500)</span></figcaption>

</figure><figure class="quote" id="q-4b40a66eb5" data-kw="">
<blockquote><p>It reproves them that are seldom with God. They are sometimes with God but not still with God. The shell fish (as naturalists observe) hath so little life in it, &amp; moves so slow that it is hard to determine whether it lives a vegetative or a sensitive life: so it may be said of many Christians, their motion heavenward is so slow, and unconstant; that we can hardly know whether the life of grace be in them or no, They are seldom with God. Revel. 2.4. Thou hast left thy first love.

Many professors have almost lost their acquaintance with God. Time was when they could weep at a sermon, but now these wells are stopped. Time was when they were tender of sin; the least hair makes the eye weep, the least sin would make conscience smite: now they can digest this poison; Time was when they trembled at the threatenings of the word, now with the Leviathan they can laugh at the shaking of a spear; Job. 41.29. Time was when they called the sabbath a delight, the queen of days, how did they wait with joy for the rising of the sun of righteousness on that day! what anhelations and pantings of soul after God! what mounting up of affections! but now the case is altered, what a weariness is it to serve the Lord? Mal. 1.13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian on earth still in heaven , appendix to, A Christian on the mount: or, A treatise concerning meditation. Wherein the necessity, usefulness, excellency of Meditation is at large discussed</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“It reproves them that are seldom with God. They are sometimes with God but not still with God. The shell fish (as naturalists observe) hath so little life in it, &amp; moves so slow that it is hard to determine whether it lives a vegetative or a sensitive life: so it may be said of many Christians, their motion heavenward is so slow, and unconstant; that we can hardly know whether the life of grace be in them or no, They are seldom with God. Revel. 2.4. Thou hast left thy first love.

Many professors have almost lost their acquaintance with God. Time was when they could weep at a sermon, but now these wells are stopped. Time was when they were tender of sin; the least hair makes the eye weep, the least sin would make conscience smite: now they can digest this poison; Time was when they trembled at the threatenings of the word, now with the Leviathan they can laugh at the shaking of a spear; Job. 41.29. Time was when they called the sabbath a delight, the queen of days, how did they wait with joy for the rising of the sun of righteousness on that day! what anhelations and pantings of soul after God! what mounting up of affections! but now the case is altered, what a weariness is it to serve the Lord? Mal. 1.13.”

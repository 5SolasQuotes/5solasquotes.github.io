<main class="wrap"><figure class="quote" id="q-f2d5d7b1c4" data-kw="">
<blockquote><p>All the question is concerning the imperated [commanded] acts and these external, that is not touching opinions and acts of the mind, but that which is visible and audible in these opinions, to wit, the speaking, professed holding of them, publishing, teaching, printing, and known external persuading of others to be of our mind. So that the question will come to this, whether the Magistrate’s sword be to regulate our words that concerns our neighbor, as that we lie not, we forswear not, to the hurt of the life and credit of our neighbor, that we slander not, rail upon no man, far less against the prince and ruler of the people, but whether the words we utter or publish of God though never such blasphemies, and lies, because they come from the conscience (as is truths or words we speak for or against our neighbor did not flow from a conscience either good or ill) be above or beyond all swords or coercive power of men. It is clear the question must be thus stated, for all the laws of the Old Testament (which we hold in their moral equity to be perpetual) that are touching blasphemies, heresies, solicitation to worship false gods and the breach of which the godly magistrate was to punish, command or forbid only such things as may be proved by two or three witnesses, and which husband and wife are not to conceal, and from which all Israel must abstain for fear of the like punishment, Dt. 13:8-11; 17:5-6; Lev. 20:1-5. But opinions in the mind, acts of the understanding, can never be proved by witnesses and such as neither Magistrate nor Church can censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, (1649), ch. 4, pp. 46-47</span></figcaption>

</figure><figure class="quote" id="q-11ff15aa1d" data-kw="">
<blockquote><p>Question 2. What are those things which make an action to become not voluntary. 4th Answer. Nothing at all but either absolute violence of constraint, or chance which could not be foreseen or prevented. And for such things as are done through absolute violence or mere chance, they have neither the nature of obedience or sin. As if one should be forced to offer incense or bow the knee before an idol, or should merely by chance kill another, Deut. 19:5-10. Question 3. What are we to think of those actions which are done through ignorance? 5th Answer. First, that ignorance which is in some sort a cause of the action (so that if a man knew what he did, he would not do it), if it be involuntary, both in itself and in its cause, that is, not affected nor procured, nor tolerated, does make the action merely casual and involuntary, and so excuses from sin. 6. Secondly, ignorance of the Law does never wholly excuse, because all men are bound to know the Will of God: but yet it does somewhat lessen the fault if it be not affected, 1 Tim. 1:13; John 4:41; Acts 3:17. But if it be affected, it is of itself a sin and so does not diminish, but rather increase the guilt of other sins, 2 Pet. 3:5. 7. Thirdly, an ignorance of the fact, if a man has used such diligence as he ought, does excuse him, because by such an ignorance the fact is made casual. So Jacob being deceived lay with Leah, whom he took to be Rachel, Gen. 29. But if due diligence have not been used, ignorance of the fact does not altogether excuse, although it do somewhat lessen the fault. And this seems to have been the case of Abimelech, Gen. 20:5. Question 4. What are we to judge of those actions which are done through fear? 8th Answer. First, fear does not simply make an action involuntary: but does, considering the circumstances of time and place, etc., impel a man to will this or that. As appears in that known instance of the merchant, who is induced through fear of death to throw away his merchandise into the sea. Fear therefore does never wholly excuse from sin: yea more, fear itself is oft a sin forbidden, and a cause too of most grievous sins, Mt. 10:26; Phil. 1:28; 1 Pet. 3:14; Apoc. 21:8. Although therefore, a great fear or terror, such as is wont sometimes to trouble even a man of good courage before men, be accounted for a good excuse, and is of force to make contracts done through fear void, yet before God such an excuse will not be taken. 9. Secondly, yet that sin which is committed through some strong terror, is not so grievous (if other things be alike) as that which is committed of the voluntary inclination of the will without any such fear of danger, because in fear the temptation is stronger: and such a fall, if repentance follow, does proceed not so much from malice, as from infirmity and perturbation. And this was Peter’s case when he denied Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conscience with the Power &amp; Cases Thereof</cite>, (1639), bk. 3, ch. 19, ‘Of a Voluntary Act’, p. 92-4</span></figcaption>

<blockquote><p>If it be asked whether ignorance can excuse a man, and how far it excuses. Answer 1. There is no ignorance (properly so called) that excuses wholly, pro toto, it being of itself sinful, and men being obliged to know what is sin, and what not; neither can ever men do that out of faith which they do in ignorance, and know not if it be in itself sinful or lawful: this is to be understood in respect of ignorantia Juris, non facti, of ‘the ignorance of the Law, and not of the ignorance of the fact’ (as they call it); for men may sometimes be ignorant of this, and yet be innocent, as when one is cutting with an axe, and it falls off the helve, etc. but in respect of the Law, there is no invincible ignorance that can excuse any for their not knowing God’s mind, because they are obliged to know it.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>
<div class="actions"><button class="copy" data-copy="“If it be asked whether ignorance can excuse a man, and how far it excuses. Answer 1. There is no ignorance (properly so called) that excuses wholly, pro toto, it being of itself sinful, and men being obliged to know what is sin, and what not; neither can ever men do that out of faith which they do in ignorance, and know not if it be in itself sinful or lawful: this is to be understood in respect of ignorantia Juris, non facti, of ‘the ignorance of the Law, and not of the ignorance of the fact’ (as they call it); for men may sometimes be ignorant of this, and yet be innocent, as when one is cutting with an axe, and it falls off the helve, etc. but in respect of the Law, there is no invincible ignorance that can excuse any for their not knowing God’s mind, because they are obliged to know it.”

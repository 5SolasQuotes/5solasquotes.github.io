<main class="wrap"><figure class="quote" id="q-7f41ca17ec" data-kw="">
<blockquote><p>It will now be asked, what manner of covenant was that at Mount Sinai, which is called the worst covenant? What kind of covenant was it? Sol. In general, it was a covenant of works, as to be fulfilled by Jesus Christ, but not so to Israel. Or, it was the covenant of grace as to its legal condition to be performed by Jesus Christ, represented under a conditional administration of it to Israel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-petto.html">Samuel Petto</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Mystery of the Covenant of Grace or the Difference Between Old and New Covenant Stated and Explained (Stoke-on-Trent, UK, 2007), 113.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1b332b9bae" data-kw="">
<blockquote><p>Canon VII: As all his works were known unto God from eternity, (Acts 15:18), so in time, according to his infinite power, wisdom, and goodness, he made man, the glory and end of his works, in his own image, and, therefore, upright, wise, and just. Having created man in this manner, he put him under the Covenant of Works, and in this Covenant freely promised him communion with God, favor and life, if indeed he acted in obedience to his will. Canon VIII: Moreover that promise connected to the Covenant of Works was not a continuation only of earthly life and happiness but the possession especially of eternal and celestial life, a life namely, of both body and soul in heaven, if indeed man ran the’ course of perfect obedience, with unspeakable joy in communion with God. For not only did the Tree of Life prefigure this very thing unto Adam, but the power of the law, which, being fulfilled by Christ, who went under it in our place, awards to us nothing other than celestial life in Christ who kept the same righteousness of the law. The power of the law also threatens man with both temporal and eternal death. Canon IX: Wherefore we can not agree with the opinion of those who deny that a reward of heavenly bliss was offered to Adam on condition of obedience to God. We also do not admit that the promise of the Covenant of Works was any thing more than a promise of perpetual life abounding in every kind of good that can be suited to the body and soul of man in a state of perfect nature, and the enjoyment thereof in an earthly Paradise. For this also is contrary to the sound sense of the Divine Word, and weakens the power of the law considered in itself. Canon X: God entered into the Covenant of Works not only with Adam for himself, but also, in him as the head and root with thc whole human race. Man would, by virtue of the blessing of the nature derived from Adam, inherit also the same perfection, provided he continued in it. So Adam by his sorrowful fall sinned and lost the benefits promised in the Covenant not only for himself, but also for the whole human race that would be born by the flesh. We hold, therefore, that the sin of Adam is imputed by the mysterious and just judgment of God to all his posterity. For the Apostle testifies that “in Adam all sinned, by one man’s disobedience many were made sinners” (Rom 5:12,19) and “in Adam all die” (I Cor 15:21–22). But there appears no way in which hereditary corruption could fall, as a spiritual death, upon the whole human race by the just judgment of God, unless some sin of that race preceded, incurring the penalty of that death. For God, the most supreme Judge of all the earth, punishes none but the guilty.</p></blockquote>

</figure><figure class="quote" id="q-86a6f25ed5" data-kw="covenant reward">
<blockquote><p>By his own right, God could indeed have prescribed obedience to man (created by him) without any promise of reward. But in order to temper that supreme dominion with his goodness, he added a covenant consisting in the promise of a reward and the stipulation of obedience. As he wished to assert more strongly his own right over man, so he demonstrated the highest benignity in this—that he (himself in need of nothing) willed to invite to a nearer communion with him the creature already subject to him by right of creation.</p></blockquote>

</figure><figure class="quote" id="q-ef5dce598c" data-kw="">
<blockquote><p>At present there is gneral agreement that the doctrine of the covenants is a peculiarly Reformed doctrine. It emerged in Reformed theology where it was assured of a permanent place and in a way that has also remained confined within these bounds. It is true that towards the end fo the seventeenth century this doctrine was taken over by several Lutheran theologians,¹ but this apparently took place by way of imitation, the doctrine being unknown within the genuine Lutheran framework. ¹ Diestel (Jahrbucher fur Deutsche Theologie, 10, 266) lists those Lutheran theologians who gave a place to the covenant in their system, viz., Calixtus, Wolfgang Jager of Tubingen, Caspar, Exner, Reuter, and others. Cocceius enjoyed a good reputation in Germany, especially as an exegete, even among the Lutherans. The covenant of works was emphasized. This is strange since there is no place for it in a consistent Lutheran system. Federal and natural unity were placed side by side in the covenant of works without subordinating the one to the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of the Covenant in Reformed Theology’ in Redemptive History &amp; Biblical Interpretation: the Shorter Writings of Geerhardus Vos ed. Richard Gaffin (d. 1949; Presbyterian &amp; Reformed, 1980), p.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works/nature-of-the-covenant.html">Nature of the Covenant</a></span></div>

<blockquote><p>2. THE PROMISE OF THE COVENANT. The great promise of the covenant of works was the promise of eternal life. They who deny the covenant of works generally base their denial in part on the fact that there is no record of such a promise in the Bible. And it is perfectly true that Scripture contains no explicit promise of eternal life to Adam. But the threatened penalty clearly implies such a promise. When the Lord says, “for in the day that thou eatest thereof thou shalt surely die,” his statement clearly implies that, if Adam refrains from eating, he will not die, but will be raised above the possibility of death. The implied promise certainly cannot mean that, in the case of obedience, Adam would be permitted to live on in the usual way, that is, to continue the ordinary natural life, for that life was his already in virtue of his creation, and therefore could not be held out as a reward for obedience. The implied promise evidently was that of life raised to its highest development of perennial bliss and glory. Adam was indeed created in a state of positive holiness, and was also immortal in the sense that he was not subject to the law of death. But he was only at the beginning of his course and did not yet possess the highest privileges that were in store for man. He was not yet raised above the possibility of erring, sinning, and dying. He was not yet in possession of the highest degree of holiness, nor did he enjoy life in all its fulness. The image of God in man was still limited by the possibility of man’s sinning against God, changing from good to evil, and becoming subject to the power of death. The promise of life in the covenant of works was a promise of the removal of all the limitations of life to which Adam was still subject, and of the raising of his life to the highest degree of perfection. When Paul says in Rom. 7:10 that the commandment was unto life, he means life in the fullest sense of the word. The principle of the covenant of works was: the man that does these things shall live thereby; and this principle is reiterated time and again Scripture, Lev. 18:5; Ezek. 20:11, 13, 20; Luke 10:28; Rom. 10:5; Gal. 3:12.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“2. THE PROMISE OF THE COVENANT. The great promise of the covenant of works was the promise of eternal life. They who deny the covenant of works generally base their denial in part on the fact that there is no record of such a promise in the Bible. And it is perfectly true that Scripture contains no explicit promise of eternal life to Adam. But the threatened penalty clearly implies such a promise. When the Lord says, “for in the day that thou eatest thereof thou shalt surely die,” his statement clearly implies that, if Adam refrains from eating, he will not die, but will be raised above the possibility of death. The implied promise certainly cannot mean that, in the case of obedience, Adam would be permitted to live on in the usual way, that is, to continue the ordinary natural life, for that life was his already in virtue of his creation, and therefore could not be held out as a reward for obedience. The implied promise evidently was that of life raised to its highest development of perennial bliss and glory. Adam was indeed created in a state of positive holiness, and was also immortal in the sense that he was not subject to the law of death. But he was only at the beginning of his course and did not yet possess the highest privileges that were in store for man. He was not yet raised above the possibility of erring, sinning, and dying. He was not yet in possession of the highest degree of holiness, nor did he enjoy life in all its fulness. The image of God in man was still limited by the possibility of man’s sinning against God, changing from good to evil, and becoming subject to the power of death. The promise of life in the covenant of works was a promise of the removal of all the limitations of life to which Adam was still subject, and of the raising of his life to the highest degree of perfection. When Paul says in Rom. 7:10 that the commandment was unto life, he means life in the fullest sense of the word. The principle of the covenant of works was: the man that does these things shall live thereby; and this principle is reiterated time and again Scripture, Lev. 18:5; Ezek. 20:11, 13, 20; Luke 10:28; Rom. 10:5; Gal. 3:12.”

— Louis Berkhof, Systematic Theology (Grand Rapids, MI: Wm. B. Eerdmans publishing co., 1938), 216.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+THE+PROMISE+OF+THE+COVENANT.+The+great+promise+of+the+covenant+of+works+was+the+promise+of+eternal+life.+They+who+deny+the+covenant+of+works+generally+base+their+denial+in+part+on+the+fact+that+there+is+no+record+of+such+a+promise+in+the+Bible.+And+it+is+perfectly+true+that+Scripture+contains+no+explicit+promise+of+eternal+life+to+Adam.+But+the+threatened+penalty+clearly+implies+such+a+promise.+When+the+Lord+says%2C+%E2%80%9Cfor+in+the+day+that+thou+eatest+thereof+thou+shalt+surely+die%2C%E2%80%9D+his+statement+clearly+implies+that%2C+if+Adam+refrains+from+eating%2C+he+will+not+die%2C+but+will+be+raised+above+the+possibility+of+death.+The+implied+promise+certainly+cannot+mean+that%2C+in+the+case+of+obedience%2C+Adam+would+be+permitted+to+live+on+in+the+usual+way%2C+that+is%2C+to+continue+the+ordinary+natural+life%2C+for+that+life+was+his+already+in+virtue+of+his+creation%2C+and+therefore+could+not+be+held+out+as+a+reward+for+obedience.+The+implied+promise+evidently+was+that+of+life+raised+to+its+highest+development+of+perennial+bliss+and+glory.+Adam+was+indeed+created+in+a+state+of+positive+holiness%2C+and+was+also+immortal+in+the+sense+that+he+was+not+subject+to+the+law+of+death.+But+he+was+only+at+the+beginning+of+his+course+and+did+not+yet+possess+the+highest+privileges+that+were+in+store+for+man.+He+was+not+yet+raised+above+the+possibility+of+erring%2C+sinning%2C+and+dying.+He+was+not+yet+in+possession+of+the+highest+degree+of+holiness%2C+nor+did+he+enjoy+life+in+all+its+fulness.+The+image+of+God+in+man+was+still+limited+by+the+possibility+of+man%E2%80%99s+sinning+against+God%2C+changing+from+good+to+evil%2C+and+becoming+subject+to+the+power+of+death.+The+promise+of+life+in+the+covenant+of+works+was+a+promise+of+the+removal+of+all+the+limitations+of+life+to+which+Adam+was+still+subject%2C+and+of+the+raising+of+his+life+to+the+highest+degree+of+perfection.+When+Paul+says+in+Rom.+7%3A10+that+the+commandment+was+unto+life%2C+he+means+life+in+the+fullest+sense+of+the+word.+The+principle+of+the+covenant+of+works+was%3A+the+man+that+does+these+things+shall+live+thereby%3B+and+this+principle+is+reiterated+time+and+again+Scripture%2C+Lev.+18%3A5%3B+Ezek.+20%3A11%2C+13%2C+20%3B+Luke+10%3A28%3B+Rom.+10%3A5%3B+Gal.+3%3A12.%E2%80%9D%0A%0A%E2%80%94+Louis+Berkhof%2C+Systematic+Theology+%28Grand+Rapids%2C+MI%3A+Wm.+B.+Eerdmans+publishing+co.%2C+1938%29%2C+216.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb59a15eb59.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b59a15eb59.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/04/berkhof-do-this-and-live-is-a-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

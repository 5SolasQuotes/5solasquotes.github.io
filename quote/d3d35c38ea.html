<main class="wrap"><figure class="quote" id="q-d3d35c38ea" data-kw="">
<blockquote><p>I acknowledge that war is one of the scourges of mankind and may be of all others the most horrible: And those which have authority to make war are bound to seek out all ways for agreement before they enterprise war to employ the mediation of their allies, and to bring down their demands to an indifferent equallity. But when one is forced to enter into war, all lamentable events which accompany war are to be imputed to that party that has compelled the other to such a necessity; especially, if the war is defensive, for he that fights only to defend himself is not guilty of the miseries which may follow. For offensive war, oftentimes it is not necessary: a prince or estate from whom a duty is detained, have right to regaine by this way. In the first war that was in the world [that Scripture speaks of], the patriarch Abraham armed all his house to set at liberty his friends and kindred: War then is made warrantable by the law of necessity. Now this necessity proceeds (as we have before specified) here-hence, because sovereign powers are exempt from justifying their actions before any [earthly] tribunal.</p></blockquote>

</figure><figure class="quote" id="q-c4154c0d8a" data-kw="">
<blockquote><p>Even now, at this very moment, we are not selves having and using bodies. We are bodies—we are rational, sentient, organic bodies. Modern thought has rejected this truth. But the fact remains that the human person is a certain, special kind of body… Human biological processes are not possessions and instruments of the person; they are parts of the life of the person… The human soul, which is the person’s intellectual principle, is united to the body as form. As form of the body, the soul is not merely a moving principle of the body. Nor is the soul an agent of which the body is instrument. Rather, the soul is an intrinsic principle of the human person. The soul makes the person be the body he or she is. Nor is there any other form which makes the body be body than the soul by which the person has the capacities of intellect and free choice. Each person has his or her own soul; substantial unity excludes many individuals having the same soul. Since the soul and the body are not distinct entities, no link is needed to unite soul and body. The human soul, as formal part of the body, makes the entire human body be a person; the entire soul is present in every part of the body. All of these points are explained by St. Thomas in a compact, synthetic treatise (S. t., I, qu. 78)… Classical modern philosophy substitued a radical dualism for the substantial unity of man. In Descartes, man is a thinking subject—cogito ergo sum—and the body is consigned to the objective world. In Hume, man is a momentarily unified consciousness—personal identity is continuity by memory over time—and the body is merely one set for phenomena among others… If the person really is not his body, then the destruction of the life of the body is not directly and in itself an attack on a value intrinsic to the human person… If the person really is not his or her own body, then the use of the sexual organs in a manner which does not respect their proper biological teleology is not directly and in itself the perversion of a good of the human person… A manufactured individual will be a person; he or she will deserve our respect as one sharing in personal dignity… But such an individual also will be a product. The producer is on a different level, inescapably superior, from the level of the product. The producer always can say to his product: “I produced you, I can destroy you; I am lord of your life, I am lord of your death”. If human beings are to share in the same personal dignity, they must be begotten, not made. Only in being begotten does an offspring share the same nature and the same personal dignity as his or her parents.</p></blockquote>

</figure><figure class="quote" id="q-6030fd28ab" data-kw="">
<blockquote><p>Learned politicians, as Bartholomeus Romulus, (Defens. part 1, n. 153, and Joannes de Anania (in c. fin. de his qui fil. occid.) teach that “the father is not obliged to reveal the conspiracy of his son against his prince; nor is he more to accuse his son, than to accuse himself, because the father loves the son better than himself,” (D. Listi quidem. Sect. Fin. quod, met. caus, et D. L. fin. c. de cura furiosi) and certainly a father had rather die in his own person, as choose to die in his son’s, in whom he affects a sort of immortality, in specie, quando non potest in individuo [in kind when not able in the individual]; but a king does not love his subjects with a natural or fatherly love thus; and if the affections differ, the power which seconds the affection, for the conservation either of being, or well-being, must also differ proportionally.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 63</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Learned politicians, as Bartholomeus Romulus, (Defens. part 1, n. 153, and Joannes de Anania (in c. fin. de his qui fil. occid.) teach that “the father is not obliged to reveal the conspiracy of his son against his prince; nor is he more to accuse his son, than to accuse himself, because the father loves the son better than himself,” (D. Listi quidem. Sect. Fin. quod, met. caus, et D. L. fin. c. de cura furiosi) and certainly a father had rather die in his own person, as choose to die in his son’s, in whom he affects a sort of immortality, in specie, quando non potest in individuo [in kind when not able in the individual]; but a king does not love his subjects with a natural or fatherly love thus; and if the affections differ, the power which seconds the affection, for the conservation either of being, or well-being, must also differ proportionally.”

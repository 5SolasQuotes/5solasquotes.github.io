<main class="wrap"><figure class="quote" id="q-bcf1d08e49" data-kw="">
<blockquote><p>…Good works are necessary to salvation, not as a cause to an effect, or as if they merited a reward, but as a part of salvation itself, or as an antecedent to a consequent, or as a means without which we cannot obtain the end. In the same way we may also say, that good works are necessary to righteousness or justification, or in them that are to be justified, viz.: as a consequence of justification, with which regeneration is inseparably connected…. We may more safely and correctly say, That good works are necessary in them that are justified, and that are to be saved…. Augustine has correctly said: Good works do not precede them that are to be justified, but follow them that are justified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Why Good Works are to be Done, or why they are Necessary?’ being section 5 of Question 91 of the Heidelberg Catechism in The Commentary of Zacharias Ursinus on the Heidelberg Catechism</cite>, p. 485 in section 5 of Question 91 of the Heidelberg Catechism in The Commentary of Zacharias Ursinus on the Heidelberg Catechism (Cincinnati, 1851)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ce0902a683" data-kw="">
<blockquote><p>Finally, if in all adults (works) have the character of a way, a means, a condition, a cause without which not [sine qua non], or a necessary antecedent to blessedness, how shall they not be necessary to salvation?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludovicus-crocius.html">Ludovicus Crocius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syntagma</cite>, bk. 4, ch. 18, pp. 1133, as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, pp. 369-70, trans. ChatGPT-5 Crocius (1586 – 1653 or 1655) was a German reformed minister, a delegate at the Synod of Dort and a professor of theology and philosophy in Bremen.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-e2c8bb289e" data-kw="">
<blockquote><p>Lastly I answer that the ground of the former objection is erroneous, namely that the promise of salvation depends on the condition of our works: because the Scripture says it is made and accomplished on man’s part freely. I grant indeed that to the promise there is annexed a condition of faith: yet faith must not here be considered as a work, but as an instrument apprehending Christ with his benefits: and withal, repentance with the fruits thereof are on our part required, yet no otherwise but as they are necessary consequents of faith and the signs and documents thereof.</p></blockquote>

</figure><figure class="quote" id="q-86e5c042d6" data-kw="">
<blockquote><p>These good works, done in obedience to God’s commandments, are the fruits and evidences of a true and lively faith: and by them believers manifest their thankfulness, strengthen their assurance, edify their brethren, adorn the profession of the gospel, stop the mouths of the adversaries, and glorify God, whose workmanship they are, created in Christ Jesus thereunto, that, having their fruit unto holiness, they may have the end, eternal life.</p></blockquote>

<blockquote><p>‘Blessed are they that do his commandments, that they may have right to the tree of life, and may enter in through the gates into the city.’ And lest we should think the commands are all but one only precept of believing, he addeth “for without are dogs and sorcerers, and whoremongers, and murderers, etc.” “He that hath my commandments, and keepeth them, he it is that loveth me, and he that loveth me shall be loved of my Father, and I will love him and manifest myself to him.</p></blockquote>

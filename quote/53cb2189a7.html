<main class="wrap"><figure class="quote" id="q-53cb2189a7" data-kw="">
<blockquote><p>Q. 11. Is all use of images unlawful? A. God did so much hate idolatry and the neighborhood of the idolaters made it so dangerous to the Israelites that He did not only forbid the worshipping of images, but all such making or using of them as might become a snare or temptation to any. So that though it be lawful to make images for civil uses, and when they are made, to fetch holy thoughts or meditation from them, as from all other creatures or things in the world, yet in any case when they become a snare or danger (being not necessary things, they become a sin to those that so use them as [a] snare to others or themselves. Ex. 34:13-15; Num. 33:52; Dt. 7:2; Kn. 11:18 &amp; 23; 14:24. Q. 12. Is it lawful to make any picture of God? A. No: for pictures are the signs of corporeal things, and it is blasphemy to think God like a bodily substance: But it is lawful to make such pictures (as of a glorious light) from which occasion may be taken of good thoughts concerning God. Ex. 25:18, 1•… 20; 1 Sam. 4:4; Ps. 18:1; Eze. 10:2. Q. 13. Is it lawful to make the picture of Christ as man, or as crucified? A. The doing it as such is not forbidden, nor the right use of it when done: But the abuse, i.e. the worshipping of it or of Christ by it, is forbidden and the making or using such when it tends to such abuse and has more of snare than profit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catechizing of Families, a Teacher of Householders how to Teach their Households (London: Parkhurst, 1683), ch. 35, ‘Of the Second Commandment’</cite>, pp. 256-57</span></figcaption>

7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/53cb2189a7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/images-of-christ/#:~:text=Q.%2011.%20Is%20all%20use%20of,has%20more%20of%20snare%20than%20profit&amp;text=Q.%2011.%20Is%20all%20use%20of%20images%20unlawful&amp;text=abuse%20and%20has%20more%20of%20snare%20than%20profit" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f61059cb55" data-kw="">
<blockquote><p>If we had the true portrait and very resemblance of our Saviour Christ, taken from his own body, what account ought we to make of it? Had I such a picture, I would keep it as most precious, not only above all other painting, but as one of the most worthy objects of man’s sight: But I would ever make more account of the least Christian than of such a picture: For a Christian represents Christ a great deal better then any paint. A true human body animated not only with a reasonable soul, but also with the spirit of Christ, does it not more resemble Christ than a dead crucifix, or a shape that expresses nothing but some superficial lineaments? I say more: That if one would abuse this picture and idolatrize it, I would do by it as Hezekiah did by the brazen serpent, 2 Kings 18:14. . A notable difference betwixt one of the figures which represented Christ and those that represented the angels, and a consideration upon the matter. In the Old Testament Christ was figured by the image of a serpent set upon a pole, without the Tabernacle, in an open place: But the angels were figured by the faces of men, having wings, placed over the ark itself, in the most holy of Holies. If we consider these figures and their placing, that of Christ’s was greatly inferior unto that of the angels: and if the true image of Christ did consist in outward lineaments, a human shape had been fitter there than that of a serpent. . Whence is it that in the Apocalypse, Jesus Christ (being man) is deciphered only in parabolical figures rather than in the natural form of his own body? We see him appear with seven stars in his right hand, and a two-edged sword going forth of his mouth: We see him clad with a robe dipped in blood, and mounted upon a white horse: We see him in the shape of a lamb slain, having seven eyes and seven horns. But we never see him there, or in any other place of the holy history, in the figure of his own natural visage: To teach us that we ought rather to seek Him in the description of his graces than in the idea of the feature of his visage.</p></blockquote>

<blockquote><p>Representations of God, Angels, and Saints.; Copes, Surplisses, Roods, etc.; Organs. The Lords and Commons assembled in Parliament, the better to accomplish the blessed Reformation so happily begun, and to remove all offences and things illegal in the worship of God, do Ordain, That all Representations of any of the Persons of the Trinity, or of any Angel or Saint, in or about any Cathedral, Collegiate or Parish Church, or Chapel, or in any open place within this Kingdom, shall be taken away, defaced, and utterly demolished; And that no such shall hereafter be set up, And that the Chancel-ground of every such Church or Chapel, raised for any altar, or Communion Table to stand upon, shall be laid down and leveled; And that no copes, surplisses, superstitious vestments, roods, or roodlons, holy-water fonts, shall be, or be any more used in any Church or Chapel within this realm; And that no cross, crucifix, picture, or representation of any of the Persons of the Trinity, or of any angel or saint shall be, or continue upon any plate, or other thing used, or to be used in or about the worship of God; And that all organs, and the frames or cases wherein they stand in all Churches or Chapels aforesaid, shall be taken away, and utterly defaced, and none other hereafter set up in their places; and that all copes, surplisses, superstitious vestments, roods, and fonts aforesaid, be likewise utterly defaced; whereunto all persons within this Kingdom, whom it may concern, are hereby required at their peril to yield due obedience.</p></blockquote>

— English Parliament, ‘An Ordinance for the Further Demolishing of Monuments of Idolatry &amp; Superstition’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CRepresentations+of+God%2C+Angels%2C+and+Saints.%3B+Copes%2C+Surplisses%2C+Roods%2C+etc.%3B+Organs.+The+Lords+and+Commons+assembled+in+Parliament%2C+the+better+to+accomplish+the+blessed+Reformation+so+happily+begun%2C+and+to+remove+all+offences+and+things+illegal+in+the+worship+of+God%2C+do+Ordain%2C+That+all+Representations+of+any+of+the+Persons+of+the+Trinity%2C+or+of+any+Angel+or+Saint%2C+in+or+about+any+Cathedral%2C+Collegiate+or+Parish+Church%2C+or+Chapel%2C+or+in+any+open+place+within+this+Kingdom%2C+shall+be+taken+away%2C+defaced%2C+and+utterly+demolished%3B+And+that+no+such+shall+hereafter+be+set+up%2C+And+that+the+Chancel-ground+of+every+such+Church+or+Chapel%2C+raised+for+any+altar%2C+or+Communion+Table+to+stand+upon%2C+shall+be+laid+down+and+leveled%3B+And+that+no+copes%2C+surplisses%2C+superstitious+vestments%2C+roods%2C+or+roodlons%2C+holy-water+fonts%2C+shall+be%2C+or+be+any+more+used+in+any+Church+or+Chapel+within+this+realm%3B+And+that+no+cross%2C+crucifix%2C+picture%2C+or+representation+of+any+of+the+Persons+of+the+Trinity%2C+or+of+any+angel+or+saint+shall+be%2C+or+continue+upon+any+plate%2C+or+other+thing+used%2C+or+to+be+used+in+or+about+the+worship+of+God%3B+And+that+all+organs%2C+and+the+frames+or+cases+wherein+they+stand+in+all+Churches+or+Chapels+aforesaid%2C+shall+be+taken+away%2C+and+utterly+defaced%2C+and+none+other+hereafter+set+up+in+their+places%3B+and+that+all+copes%2C+surplisses%2C+superstitious+vestments%2C+roods%2C+and+fonts+aforesaid%2C+be+likewise+utterly+defaced%3B+whereunto+all+persons+within+this+Kingdom%2C+whom+it+may+concern%2C+are+hereby+required+at+their+peril+to+yield+due+obedience.%E2%80%9D%0A%0A%E2%80%94+English+Parliament%2C+%E2%80%98An+Ordinance+for+the+Further+Demolishing+of+Monuments+of+Idolatry+%26+Superstition%E2%80%99&amp;url=https%3

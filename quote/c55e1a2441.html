<blockquote><p>The Lord dwelt in the cloud, in the pillar of fire, in the rock, and in the bush, Dt. 33:16, ‘for the good will of Him who dwelt in the bush.&#x27;</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ebe86ae8b9" data-kw="">
<blockquote><p>That making of pictures of creatures, which are visible or may be comprehended, or historical fancies (to speak so) such as the senses and elements use to be holden forth by (which are rather hieroglyphics than real pictures) these I say, are not simply unlawful, but are so when they are abused (so Solomon made images of lions for his use, and thus the gift of engraving and painting as well as others which God has given to men, may be made use of, when (as has been said) it is not abused)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments… (London, 1675), 1st Commandment</cite>, p. 54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-e1a8e069d5" data-kw="">
<blockquote><p>…it seems meet to be determined that all creatures may be represented by images: yea the very angels themselves, I mean not in respect of their spiritual nature, but in such sort as they have exhibited themselves to be seen of men. Wherefore the godly men, which either be dead or yet living, kings, stars, plants, stones, earth, sea, and such like may be represented by pictures. Also we make a distinction of images, that some of them be true, and some of them false. Among the true, those be reckoned, which doo represent those things, which either be, or haue béene, or hereafter shall be. But those are called false, which represent those things that neither be, have been, nor yet ever shall be: as are the chymaeras and centaurs. There be also some images filthy and some honest, according as those things be which are expressed by them. Also they may be distinguished according to the circumstance of the place, because some be set in a holy place and some in places prophane. Again, others there be which are appointed in respect of worship and religion: but others are erected as ornaments, and only for the remembrance of a thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Places… (London: Henrie Denham et al., 1583), pt. 2, ch. 5. ‘The Second Precept, which concerns Images, their Beginning, Antiquity &amp; Cause’</cite>, p. 335</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-cd3a190048" data-kw="">
<blockquote><p>Universus locus demonstrat deum esse, qui apparuit. Dicitur Angelus, ut cognoscamus, quod is, qui visus est, non est Deus Pater (cuius enim Angelus esset Pater) sed unigenitus Filius, qui magni consilij est angelus, qui sacris discipulis dixit; Omnia quaecun{que} audiui apatre meo, nota fecivobis. Quemadmodum autem angeli nomen posuit, non quidem volens ministrorum quempiam innuere, sed personam unigeniti demonstrare: sic iterum ipsius tum naturam, tum potentiam praedicat, inquiens ipsum dixisse: Ego sum qui sum, et Ego Deus Abraham, Deus Isaack, Deus Iacob, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodoret.html">Theodoret</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted in Gervase Babington, Comfortable Notes upon the books of Exodus &amp; Leviticus... (London: Chard, 1604), ch. 3</cite>, p. 32 Theodoret (c. 393–c. 458/466)</span></figcaption>

</figure><figure class="quote" id="q-d779bccb41" data-kw="">
<blockquote><p>And indeed it [the Exodus] was the greatest typ of Christ’s redemption of any providential event whatsoever. This was by Jesus Christ, for it was wrought by Him who appeared to Moses to redeem that people. But that was Christ, as is evident, because He is called ‘the angel of the Lord,’ Ed. 3:2-3. The bush represented the human nature of Christ, who is called the ‘branch.’ This bush grew on mount Sinai or Horeb, a word that signifies a dry place, as the human nature of Christ was a root out of dry ground. The bush burning with fire, represented the sufferings of Christ, in the fire of God’s wrath. It burned, and was not consumed; so Christ, though He suffered extremely, yet perished not; but overcame at last, and rose from his sufferings. Because this great mystery of the incarnation and sufferings of Christ was here represented, therefore Moses says, ‘I will turn aside, and behold this great sight.’ A great sight he might well call it, when there was represented, ‘God manifest in the flesh,’ suffering a dreadful death, and rising from the dead.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a516deab45" data-kw="">
<blockquote><p>The General Court of Election… 1. It was ordered and agreed… that an engagement by oath should be taken of all the officers of this Body now to be elected, as likewise for the time to come… ‘To the execution of this office, I judge myself bound before God to walk faithfully and this I profess in ye presence of God.&#x27;</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3b0779f7e3" data-kw="">
<blockquote><p>6. As morality and piety, rightly grounded on evangelical principles, will give the best and greatest security to government, and will lay in the hearts of men the strongest obligations to due subjection: and as the knowledge of these, is most likely to be propagated through a society by the institution of the public worship of the Deity, and of public instruction in morality and religion: therefore, to promote those important purposes, the people of this state have a right to impower, and do hereby fully impower the legislature to authorize form time to time, the several towns, parishes, bodies-corporate, or religious societies within this state, to make adequate provision at their own expense, for the support and maintenance of public protestant teachers of piety, religion and morality:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/new-hampshire.html">New Hampshire</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Constitution of New Hampshire</cite>, 1784 (Thorpe, 4.2454, 2460)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-85add7577a" data-kw="">
<blockquote><p>They have their ministerial calling, or which is all one, authority to exercise the acts of their ministerial office, from Jesus Christ, as the fountain of their spiritual power… But they have the peaceable, public exercise of their ministry in these places by the magistrate, under God. It’s the magistrate’s civil authority by which the penal statutes which rendered their preaching hazardous are removed or relaxed; by the protection of civil authority they have the peaceable exercise of their ministry, or they have freedom from molestation or disturbance while they are exercising their ministry in these places. Before the act of indulgence they had their ministerial authority and did preach upon hazard before they were indulged; but by the indulgence they had this benefit, that whereas before it they were exposed to hazard wherever they preached, whether in private or public; after it, they might preach publicly and exercise the other parts of the ministerial office, in some places, without molestation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-vilant.html">William Vilant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Review &amp; Examination</cite>, (London, 1681), pp. 12–13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

>
</figure><figure class="quote" id="q-c3e0589a64" data-kw="">
<blockquote><p>Then the true state of the question is not whether the sword be a means of conversion of men to the true faith, nor 2. whether heathen by fire and sword are to be compelled to embrace the truth [which is denied], nor 3. whether violence without instruction and arguing from light of scriptures, should be used against false teachers, nor 4. whether the Magistrate can punish the opinions of the mind, and strain internal liberty. But whether or no ought the godly and Christian prince restrain and punish with the sword false teachers, publishers of heretical and pernicious doctrines, which may be proved by witness, and tends to the injuring of the souls of the people of God, in a Christian society, and are dishonorable to God, and contrary to sound doctrine; and so coerce men for external misdemeanors flowing from a practical conscience sinning against the second table, as well as from a speculative conscience (to borrow these terms here) when they profess and are ready to swear they perform these externals merely from and for conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, (1649), Ch. 4, ‘The state of the question of compulsion of conscience and toleration’, p. 57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

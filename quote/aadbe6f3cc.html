<blockquote><p>Then Christianity, its chief residence, its royal-sent, is in the spirit of a man, and so He is one after the spirit. ‘Be ye renewed in the spirit of your minds,’ Eph. 4:23. As it is of a high descent, so it must have the highest and most honorable lodging in all the creation, that is, the spirit of a man, without this there is no room else fit for it, and suitable to it, in this lower world; ‘My son give me thine heart,’ says wisdom, Prov. 23:26. It cares for nothing besides, if it get not the heart, the inmost cabinet of the imperial city of this isle of man, for ‘out of it are the issues of life,’ that flow into all the members. Do not think that grace will lodge one night in your outward man, that you can put on Christianity upon your countenance or conversation without; except you admit it into your souls, it can have no suitable entertainment there alone, it’s of a spiritual nature, and it must have a spirit to abide in. Everything is best preserved and entertained by things suitable to its nature; such do incorporate together, and inbosom one with another, whereas things keep a greater distance with things different in nature; a flame will die out among cold stones, without oily matter. This heavenly fire that is descended into the world can have nothing earthly to feed upon; it must die out except it get into the immortal spirit, and then furnish (to speak so) perpetual nourishment to it, till at length all the spirit be set on flame and changed, as it were, into that heavenly substance, to mount up above from whence it came. Do not think, my beloved, to superinduce true religion upon your outside, and within to be as rotten sepulchers: You must either open your hearts to Christ or else He will not abide with you; such a noble guest will not stay in the suburbs of the city if you take Him not into the palace; and truly the palace of our hearts is too unworthy for such a worthy guest, it has been so defiled by sin; how vile is it? but if you would let him enter, He would wash it and cleanse it for Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sinner’s Sanctuary</cite>, … (d. 1653; Edinburgh: Swintown, 1670) | sermon 16, on Rom. 8:4-5, p. 124</span></figcaption>

<blockquote><p>And he says, though He be a king, yea, the King of Kings, yet He stands at the door and knocks, that is, calls them to repentance and promises if they will let Him in, that is, turn from their sin and yield to his will, He will come unto them and sup with them, signifying what exceeding joy and comfort they should receive by Him; yea, they should be made partakers of the joys of Heaven: where he alludes to the comfort that friends have one of another when they meet together at their dinners, suppers and feasts, which thing, if it be comfortable to men, much more comfort shall it minister unto us, to be partakers of the company of Christ Jesus Himself in his heavenly banquet. A second benefit he notes in that those that do thus receive Him and overcome shall not only receive comfort, but glory also and honor in his Kingdom…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain Explanation of the Whole Revelation of St. John</cite>, … (d. 1603; London: 1622), ch. 3, p. 22</span></figcaption>

<blockquote><p>It will be seen, then, that the doctrine of the irresistibility, or insuperability, of divine grace in conversion is a necessary consequence of scriptural views of man’s entire depravity, and his inability by nature to will anything spiritually good; and that all that Calvinists intend to set forth in maintaining this doctrine, is declared when they assert that it is necessary that men’s will be renewed, and that, in the commencement of the process by which this renovation is effected, they are wholly passive,—incapable of co-operating with divine grace, or with the Holy Spirit operating upon them, until He has, by His own almighty power, effected an important change upon them. This change is sometimes called regeneration, when that word is taken in its most limited sense, as distinguished from conversion [the exercise of faith in Christ and repentance]; and, in that case, regeneration means the first implantation of spiritual life,—the process of vivification, or making alive,—while conversion describes the process by which men, now quickened and renewed,—no longer passive, but active,—do willingly turn to God, and embrace Jesus Christ as all their salvation and all their desire; and the whole is comprehended under the designation of effectual calling, which includes the whole work of the Spirit, in applying to men the blessings which Christ purchased, and in effecting that important change in their condition and character which is, in every instance, indispensable to salvation. An essential part of this process is the renovation of the will, or the giving it a new capacity or tendency,—a power of willing what is spiritually good,—whereas before it could will only what was spiritually evil. And it is important to have our attention directed to this feature in the process, as it is that right views of which most directly oppose and exclude Arminian errors upon this subject. In the description of effectual calling, given in the [Westminster] Shorter Catechism, it is said to be “a work of God’s Spirit, whereby, convincing us of sin and misery, enlightening our minds in the knowledge of Christ, and renewing our wills, He does persuade and enable us to embrace Jesus Christ freely offered to us in the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, vol. 2, 1862, reprinted Banner of Truth, 1994, Ch. 25, The Arminian Controversy, Section 6, Efficacious &amp; Irresistible Grace, pp. 411-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>
<div class="actions"><button class="copy" data-copy="“It will be seen, then, that the doctrine of the irresistibility, or insuperability, of divine grace in conversion is a necessary consequence of scriptural views of man’s entire depravity, and his inability by nature to will anything spiritually good; and that all that Calvinists intend to set forth in maintaining this doctrine, is declared when they assert that it is necessary that men’s will be renewed, and that, in the commencement of the process by which this renovation is effected, they are wholly passive,—incapable of co-operating with divine grace, or with the Holy Spirit operating upon them, until He has, by His own almighty power, effected an important change upon them. This change is sometimes called regeneration, when that word is taken in its most limited sense, as distinguished from conversion [the exercise of faith in Christ and repentance]; and, in that case, regeneration means the first implantation of spiritual life,—the process of vivification, or making alive,—while conversion describes the process by which men, now quickened and renewed,—no longer passive, but active,—do willingly turn to God, and embrace Jesus Christ as all their salvation and all their desire; and the whole is comprehended under the designation of effectual calling, which includes the whole work of the Spirit, in applying to men the blessings which Christ purchased, and in effecting that important change in their condition and character which is, in every instance, indispensable to salvation. An essential part of this process is the renovation of the will, or the giving it a new capacity or tendency,—a power of willing what is spiritually good,—whereas before it could will only what was spiritually evil. And it is important to have our attention directed to this feature in the process, as it is that right views of which most directly oppose and exclude Arminian errors upon this subject. In the description of effectual calling, given in the [Westminster] Shorter Catechism, it is said to be “a work of God’s Spirit, whereby, convincing us of sin and misery, enlightening our minds in the knowledge of Christ, and renewing our wills, He does persuade and enable us to embrace Jesus Christ freely offered to us in the gospel.”

— William Cunningham, Historical Theology, vol. 2, 1862, reprinted Banner of Truth, 1994, Ch. 25, The Arminian Controversy, Section 6, Efficacious &amp; Irresistible Grace, pp. 411-12">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+will+be+seen%2C+then%2C+that+the+doctrine+of+the+irresistibility%2C+or+insuperability%2C+of+divine+grace+in+conversion+is+a+necessary+consequence+of+scriptural+views+of+man%E2%80%99s+entire+depravity%2C+and+his+inability+by+nature+to+will+anything+spiritually+good%3B+and+that+all+that+Calvinists+intend+to+set+forth+in+maintaining+this+doctrine%2C+is+declared+when+they+assert+that+it+is+necessary+that+men%E2%80%99s+will+be+renewed%2C+and+that%2C+in+the+commencement+of+the+process+by+which+this+renovation+is+effected%2C+they+are+wholly+passive%2C%E2%80%94incapable+of+co-operating+with+divine+grace%2C+or+with+the+Holy+Spirit+operating+upon+them%2C+until+He+has%2C+by+His+own+almighty+power%2C+effected+an+important+change+upon+them.+This+change+is+sometimes+called+regeneration%2C+when+that+word+is+taken+in+its+most+limited+sense%2C+as+distinguished+from+conversion+%5Bthe+exercise+of+faith+in+Christ+and+repentance%5D%3B+and%2C+in+that+case%2C+regeneration+means+the+first+implantation+of+spiritual+life%2C%E2%80%94the+process+of+vivification%2C+or+making+alive%2C%E2%80%94while+conversion+describes+the+process+by+which+men%2C+now+quickened+and+renewed%2C%E2%80%94no+longer+passive%2C+but+active%2C%E2%80%94do+willingly+turn+to+God%2C+and+embrace+Jesus+Christ+as+all+their+salvation+and+all+their+desire%3B+and+the+whole+is+comprehended+under+the+designation+of+effectual+calling%2C+which+includes+the+whole+work+of+the+Spirit%2C+in+applying+to+men+the+blessings+which+Christ+purchased%2C+and+in+effecting+that+important+change+in+their+condition+and+character+which+is%2C+in+every+instance%2C+indispensable+to+salvation.+An+essential+part+of+this+process+is+the+renovation+of+the+will%2C+or+the+giving+it+a+new+capacity+or+tend

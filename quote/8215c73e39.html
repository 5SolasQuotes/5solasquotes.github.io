<blockquote><p>…yea I teach that the profession of Demas, Magus, doth not notify that they are true believers: And though visible profession should notify true faith, it is not necessary that it must offer to judicious charity such overweighing evidences as the Church cannot lawfully admit Magus a member, but they must first positively judge him a real convert; and the like John must judge of all Jewry whom he baptized.</p></blockquote>

<blockquote><p>2. Whatever defects do not make union with a church and her ordinances sinful do not warrant separation…

3. Union with a church is lawful for those (i) whose callings lead them to a particular church and (ii) they can fulfill the duty of their callings without impediment, even if others fail to fulfill their duty…

4. Union must be maintained even if principles generally acknowledged in a church are not applied in practice…

5. Union must be maintained when the inconveniences following from separation are more harmful to the church than the inconveniences following union, provided that nothing makes union with a church and her ordinances sinful…

6. Union must be maintained when union with a church and her ordinances doesn’t require (i) personal sin or (ii) complicity in others’ sin.</p></blockquote>

</figure><figure class="quote" id="q-a29675f5a3" data-kw="">
<blockquote><p>I confess, when persons are entered into a visible Church-society by baptism, if they will own that profession they were baptized into, and are not guilty either of plain ignorance of it, or manifest scandal, and demand as their right the other ordinances of the Gospel, I see not by what power they may be excluded. If we fix not in a serious visible profession as the ground of giving right, but require positive evidences of grace in every one to be admitted to ordinances as the only thing giving right, for my part, setting aside the many inconveniences besides which attend that in reference to the persons to be admitted, I see not how with a safe and good conscience ordinances can be administered by any. My reason is this: Every one, especially a minister, in that case ought to proceed upon certain grounds that the person admitted has right to the ordinance to be administered; but if positive signs of grace be required, a man’s conscience cannot proceed upon any certainty, without infallible knowledge of another’s spiritual state, which I suppose none will pretend to. My meaning is, that which gives right, must be something evident to the person admitting into it, if it be his duty to enquire after it; but if only positive signs of grace be looked on as giving right, the ground of right can never be so evident to another person, as to proceed with a good conscience, i.e. with a full persuasion of another’s right to the administration of any ordinance to him. If it be said that these are required only as tokens of a true visible profession, and it is that which gives the right, I reply, Our knowledge of, and assent to the conclusion can be no stronger, nor more certain than to the premises from whence it is inferred; if therefore true profession gives right, and our knowledge of that proceeds upon our knowledge of the work of grace, we are left at the same uncertainty we were at before. But if we say, that an outward profession of the Gospel (where there is nothing rendering men uncapable of owning it, which is ignorance, nor declaring they do not own it, which is scandal) is that which gives a visible right to the ordinances of the Church as visible, we have something to fix ourselves upon, and to bottom a persuasion of the right of persons to ordinances. Christ when He instituted Churches, did institute them as visible societies, that is, to have marks whereby to be known and distinguished, as other societies in the world are; now that which puts a difference between this and other societies, is an open profession of Christianity, which profession is looked upon as the outward expression of the internal consent of the soul to the doctrine and laws of the Gospel. Which outward evidence of consent, where there is nothing evidently and directly oppugning it, is that which the Church of God in admission of visible members is to proceed upon. I nowhere find that ever Christ or his apostles in making disciples, or admitting to Church-membership, did exact anymore than a professed willingness to adhere to the doctrine which they preached; nor that they refused any who did declare their desire to join with them. An owning Christianity is all we read of antecedent to admission of Church-members. And if anything else be further required as necessary, we must either say the Word of God is defective in institutions of necessity to the Church, which I suppose the assertors of it will not be so inconsistent to their own principles as to do; or else must produce where anything further is required by the Word of God. … 3. The reality of consent may be sufficiently manifested without an explicit [man-composed Church-] covenant, as in the joining with those who are under the same profession in the common acts of the society and acceptance of, and submission to the rulers of that society, which implicitly is that covenant which they would have expressed; and actions in this case, are as declarative and significative as words.</p></blockquote>

C+and+assent+to+the+conclusion+can+be+no+stronger%2C+nor+more+certain+than+to+the+premises+from+whence+it+is+inferred%3B+if+therefore+true+profession+gives+right%2C+and+our+knowledge+of+that+proceeds+upon+our+knowledge+of+the+work+of+grace%2C+we+are+left+at+the+same+uncertainty+we+were+at+before.+But+if+we+say%2C+that+an+outward+profession+of+the+Gospel+%28where+there+is+nothing+rendering+men+uncapable+of+owning+it%2C+which+is+ignorance%2C+nor+declaring+they+do+not+own+it%2C+which+is+scandal%29+is+that+which+gives+a+visible+right+to+the+ordinances+of+the+Church+as+visible%2C+we+have+something+to+fix+ourselves+upon%2C+and+to+bottom+a+persuasion+of+the+right+of+persons+to+ordinances.+Christ+when+He+instituted+Churches%2C+did+institute+them+as+visible+societies%2C+that+is%2C+to+have+marks+whereby+to+be+known+and+distinguished%2C+as+other+societies+in+the+world+are%3B+now+that+which+puts+a+difference+between+this+and+other+societies%2C+is+an+open+profession+of+Christianity%2C+which+profession+is+looked+upon+as+the+outward+expression+of+the+internal+consent+of+the+soul+to+the+doctrine+and+laws+of+the+Gospel.+Which+outward+evidence+of+consent%2C+where+there+is+nothing+evidently+and+directly+oppugning+it%2C+is+that+which+the+Church+of+God+in+admission+of+visible+members+is+to+proceed+upon.+I+nowhere+find+that+ever+Christ+or+his+apostles+in+making+disciples%2C+or+admitting+to+Church-membership%2C+did+exact+anymore+than+a+professed+willingness+to+adhere+to+the+doctrine+which+they+preached%3B+nor+that+they+refused+any+who+did+declare+their+desire+to+join+with+them.+An+owning+Christianity+is+all+we+read+of+antecedent+to+admission+of+Church-members.+And+if+anything+else+be+further+required+as+necessary%2C+we+must+either+say+the+Word+of+God+is+defective+in+institutions+of+necessity+to+the+Church%2C+which+I+suppose+the+assertors+of+it+will+not+be+so+inconsistent+to+their+own+principles+as+to+do%3B+or+else+must+produce+where+anything+further+is+required+by+the+Word+of+God.+%E2%80% </figure><figure class="quote" id="q-d9e28f8389" data-kw="">
<blockquote><p>Negative precepts oblige to every point of time. Affirmative do not so. He that is always under obligation to pray solemnly, is not obliged to be always solemnly at prayer. The worship of God is better than most actions of our lives; yet the saving of a town or house from fire, yea, plucking of a sheep or an ox out of a ditch, is sometimes to be preferred. The most sacred, external act of duty becomes sin, when it excludes that which is more a duty at that time. How fatal, how totally destructive an error might it have proved, before, to the Jewish nation, always to have thought it unlawful to defend themselves on the Sabbath-Day! (as it was once said to have been; Plutarch, de Superst.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Howe</cite>, vol. 5, Containing the Treatises: On Divine Prescience and the Trinity… (d. 1705; Religious Tract Society, 1863), ‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’, pp. 278-79</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Negative precepts oblige to every point of time. Affirmative do not so. He that is always under obligation to pray solemnly, is not obliged to be always solemnly at prayer. The worship of God is better than most actions of our lives; yet the saving of a town or house from fire, yea, plucking of a sheep or an ox out of a ditch, is sometimes to be preferred. The most sacred, external act of duty becomes sin, when it excludes that which is more a duty at that time. How fatal, how totally destructive an error might it have proved, before, to the Jewish nation, always to have thought it unlawful to defend themselves on the Sabbath-Day! (as it was once said to have been; Plutarch, de Superst.)”

— John Howe, The Works of John Howe, vol. 5, Containing the Treatises: On Divine Prescience and the Trinity… (d. 1705; Religious Tract Society, 1863), ‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’, pp. 278-79">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNegative+precepts+oblige+to+every+point+of+time.+Affirmative+do+not+so.+He+that+is+always+under+obligation+to+pray+solemnly%2C+is+not+obliged+to+be+always+solemnly+at+prayer.+The+worship+of+God+is+better+than+most+actions+of+our+lives%3B+yet+the+saving+of+a+town+or+house+from+fire%2C+yea%2C+plucking+of+a+sheep+or+an+ox+out+of+a+ditch%2C+is+sometimes+to+be+preferred.+The+most+sacred%2C+external+act+of+duty+becomes+sin%2C+when+it+excludes+that+which+is+more+a+duty+at+that+time.+How+fatal%2C+how+totally+destructive+an+error+might+it+have+proved%2C+before%2C+to+the+Jewish+nation%2C+always+to+have+thought+it+unlawful+to+defend+themselves+on+the+Sabbath-Day%21+%28as+it+was+once+said+to+have+been%3B+Plutarch%2C+de+Superst.%29%E2%80%9D%0A%0A%E2%80%94+John+Howe%2C+The+Works+of+John+Howe%2C+vol.+5%2C+Containing+the+Treatises%3A+On+Divine+Prescience+and+the+Trinity%E2%80%A6+%28d.+1705%3B+Religious+Tract+Society%2C+1863%29%2C+%E2%80%98Some+Consideration+of+a+Preface+to+an+Inquiry+Concerning+the+Occasional+Conformity+of+Dissenters%2C+etc.%E2%80%99%2C+pp.+278-79&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd9e28f8389.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d9e28f8389.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-leaving-a-congregation/#:~:text=Negative%20precepts%20oblige%20to%20every%20point,to%20have%20been%3B%20Plutarch%2C%20de%20Superst&amp;text=Negative%20precepts%20oblige%20to%20every%20point%20of%20time&amp;text=once%20said%20to%20have%20been%3B%20Plutarch%2C%20de%20Superst" rel="noopener" target="_blank">Read it online · Reformed Books On <blockquote><p>Concerning the matter of the Church, the Independents have learned all their unjust scrupulosity from the other; as the Brownists [separatists] require every church member to be a saint, really regenerate and justified, who at their admission have publicly satisfied the whole congregation by convincing signs of their true holiness: the other requires the same. Whatever indulgence here the Independents profess to give, either to weak ones in whom they find the least of Christ, or to women whom they remit from the congregation to speak more privately in the eldership (yet this is no other than the present practice of the Brownists at Amsterdam.</p></blockquote>

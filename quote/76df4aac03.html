<main class="wrap"><figure class="quote" id="q-76df4aac03" data-kw="">
<blockquote><p>…not only was original righteousness taken away on account of the fall, but by the same stroke the entire nature of man was so morally corrupted as regards the intellect, the will, the affections, that by nature he is blind in respect to all spiritual truth, likewise incompetent for any spiritual good, and prone to all evil in respect to his will. These are the chief reasons of the Reformed: (1) Scripture declares that man is dead in sin (Eph. 2:1, 5; Matt. 8:22; 1 Tim. 5:6; Rom. 5:12), yet death pertains to nature. (2) All of man’s faculties are said to be corrupted: a blind intellect (Eph. 4:18), which does not perceive the things that are of the Spirit, and considers them as foolishness (1 Cor. 2:14–15), a will averse to spiritual good, enmity toward God, which does not subject itself to the divine law, neither indeed can it (Rom. 8:7), an impure conscience (Titus 1:15), distorted affections (Gal. 5:24; Rom. 7:5), members (Rom. 6:19), the whole man entirely corrupted (Isa. 1:4, 6), the flesh, the fleshly man, the old man. (3) We are said to be alienated from the life of God, that is, from the divine, spiritual, and heavenly life (Eph. 4:18), and destitute of the glory of God (Rom. 3:23). (4) We are all said to be under sin (Rom. 3:9ff.). (5) There is made known in us a total powerlessness toward spiritual good (Jer. 13:23; 2 Cor. 3:5; Rom. 7:14–25).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 4, ch. 2 | section 26, p. 463</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-773f6e2763" data-kw="">
<blockquote><p>God is said to have ceased from creating new creatures on the seventh day in that nothing has later been made that did not previously precede in some likeness in genus or species, or at least in seedlike principle or even as in obediential potency. Therefore I say that the world’s future renewal did pre-exist in the works of the six days in a kind of remote likeness, namely, in the glory or grace of the angels. It also preceded in obediential potency, which was then implanted in creation for the reception of such a renewal by God as agent.</p></blockquote>

<blockquote><p>So that God’s decree is the cause of their necessity, contingency, spontaneity, and freedom. All these different qualities which are in second causes or effects, are derived from the will of God, who appointed them to be of that nature. It is He that fits necessary causes to necessary effects, and contingent ones to those that are contingent, and so on. Whatever comes to pass necessarily, so comes to pass by virtue of the divine decrees; and whatever happens contingently, and etc. so happens because of the same decree. The second causes do always retain their own particular nature and property, and their effects accordingly are necessary or causal, or proceed from mere sense or spontaneous motion, or from reason and will: but the first cause is immutable, and with respect to his foreknowledge and decree all effects and events are immutable, necessary, fix’d and stable, and cannot be otherwise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Veritas Redux: Evangelical Truths Restored: Namely, Those Concerning God’s Eternal Decrees, The Liberty of Man’s Will, Grace &amp; Conversion, The Extent &amp; Efficacy of Christ’s Redemption, &amp; Perseverance in Grace</cite>, pp. 265-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<blockquote><p>(2) To evince to you the greatness and horridness of that sin [of not delighting in God]. Suffer yourselves therefore to be reasoned with to this purpose; and consider, first, that you have somewhat of delectation in your natures, that is, you have the power naturally inherent in you of taking delight in one thing or other… Therefore herein an act is not enjoined you which is incompetent to your natures, or simply impossible to you… …Yea, when you look into your disaffected hearts and find that you not only do not delight in God, but you cannot, and not for the want of the natural power, but a right inclination, should you not with astonishment bethink yourselves, every one for himself, ‘What is this that has befallen me? I am convinced this is the best good, every way most worthy of my highest delight and love, and yet my heart savors it not!&#x27;</p></blockquote>

<blockquote><p>Answer. It is granted, that no sinner will truly and sincerely repent and believe in Christ, without the powerful and effectual Influences of converting grace; and therefore they are called ‘blind’ and ‘dead’ in sin, because God knows the final event will be the same as if they were under a natural impossibility, or utter natural impotence. And for this reason the conversion of a sinner is called, ‘a new creation’; ‘being born again’; ‘giving sight to the blind’; or, a ‘resurrection from the dead’: And the necessity of divine power to effect this change, is held forth in many places of scripture. Yet we must say still, that sinners are not under such a real natural impossibility of repenting and believing, as though they were naturally blind or dead. ‘Tis true, the blind and the dead have lost their natural powers of seeing and moving; but when Scripture represents the inability of sinners to repent, or believe in Christ, by such figures and metaphors as death or blindness, it must be remembered these are but metaphors and figures, such as the holy writers and all the Eastern nations frequently use; and they must not be understood in their literal sense, as if men had lost their natural powers or faculties of understanding, will, and affections, which are the only natural powers necessary to believe and repent. Now ’tis plain that these natural faculties, powers, or capacities, are not lost by the Fall; for if they were, there would be no manner of need or use of any moral means or motives, such as commands, threatenings, promises, exhortations; these would all be impertinent and absurd, for they could have no more influence on sinners, than if we command or exhort a blind person to see, or a dead body to rise or move; which commands and exhortations would appear ridiculous and useless. And since the blessed God, in his Word, uses these moral means and motives to call sinners to repentance and faith, it is certain that they have natural powers and faculties sufficient to understand and practice these duties; and therefore they are not under a necessity of sinning, and of being destroyed, since there is nothing more wanted [lacking] in a way of sufficient natural powers, faculties, or abilities, than what they have. All the other impotence and inability therefore in sinners to repent and believe, properly speaking, is but moral, or seated chiefly in their wills. ‘Tis a great disinclination or aversion in these natural faculties, to attend to, learn, or practice the things of God and religion*; and this holds them fast in their sinful state in a similar way, as if they were blind and dead, and I said the final event will be the same, i.e. they will never repent without almighty grace. * I grant this inability to repent has been sometimes called by our divines a natural impotence, because it arises from the original corruption of our nature since the Fall of Adam; and in this sense I fully believe it. But this spring of it is much better signified and expressed by the name of native impotence, to show that it comes from our birth; and the quality of this impotence is best called moral, being seated chiefly in the will and affections, and not in any want of natural powers or faculties to perform what God requires: And the reason is plain, (viz.) That no new natural powers are given by converting grace, but only a change of the moral bent or inclination of the soul, a happier turn given to our natural faculties by the sovereign grace of God and his Spirit. And upon this account that strong and settled inclination to sin, and aversion to God, which is in the will or affections, is represented in our own language, as well as in the Eastern countries, by impotence or inability to forsake or subdue sin: As when a drunkard shall say, I had such a strong desire to the liquor, that I could not but drink to excess, I could not withhold the cup from my mouth: Or when a murderer shall say, I hated my neighbor so much, that having a fair opportunity, I could not help killing him: Or when we say to a man of fury in his passion, You are so warm at present, that you cannot see things in a true light, you cannot hearken to reason, you cannot judge aright, you are not capable of acting regularly. And that this is the manner of speaking in the Eastern countries, is evident from the Bible, Gen. 37:4. Joseph’s brethren hated him, and could not speak peaceably to him: Yet you will grant all this is but moral impotence, i.e. a very strong inclination to excess of drink, or murder, or passion, or a strong aversion to the contrary virtues. Even in the things of common life the ‘cannot’ sometimes signifies nothing but the ‘will not’, Luke 11:7. ‘Trouble me not, my door is shut, my children are with me in bed, I cannot rise to give thee’; i.e. I will not. And with regard to faith or believing in Christ, our Savior explains his own Language in this manner. In one place He says, ‘No man can come unto Me except my Father draw him,’ John 6:44. And in another place He charges the Jews with this as their fault: ‘Ye will not come unto Me, that ye may have life,’ John 5:40. So in the parable one excuse is, Luke 14:20, ‘I have married a wife, and I cannot come.’ All these citations intend the same thing: their cannot is their will not, i.e. ’tis the strength of their aversion to Christ, which is a moral impotence or inability to believe in Him, and the fault lies in the will. St. Paul speaks to the same purpose, Rom. 8:7, where he shows, that ’tis the aversion or enmity of the carnal mind to God, which hinders it from obeying the Law of God, and at last he says, ‘it cannot be subject to it.’ The carnal mind is enmity against God, for it is not subject to the Law of God, neither indeed can be: ‘So then they who are in the flesh cannot please God.’ The fault still lies in the will of sinful man; and ’tis this makes it criminal, while it is not naturally impossible to be avoided or overcome. And upon this account God is pleased to use moral means and motives, (viz.) promises, threatenings, commands, etc. toward all men, such as are suited to awaken their hearts, and excite and persuade their will to use all their natural abilities, to set their natural powers or faculties to work, to attend to, and learn, and practice faith and repentance; and ’tis by these very means God persuades his elect powerfully to repent and believe. But when persons will not hear, nor be influenced by these motives, because of their strong and willful aversion to God and godliness, their crime is entirely their own, and their condemnation is just. They have natural powers or faculties in them, which, if well tried, might overcome their native propensity to vice, though they never will do it. If the great God, in a way of sovereign mercy, gives some persons superior aids of grace to overcome this moral impotence, and conquer this aversion to God and goodness‡; if He effectually leads, inclines, or persuades them by his Spirit to repent and believe in Christ, this does not at all hinder the others from exercising their natural powers of understanding, and will in believing and repenting. ‡ Whether the Spirit of God effectually persuade the will to repent and believe in Christ, by immediate Influence upon the will itself, or by setting the things of the Gospel before the mind in so strong a light, and persuading the soul so to attend to them, as shall effectually influence the will, this shall not be any matter of my present debate or determination; for in both the event and consequences are much the same: There is no new natural power or faculty given to the soul in order to faith and repentance, but a divine influence upon the old natural powers, giving them a new and better turn. Nor can anything of their guilt and willful impenitence be imputed to the blessed God, who is Lord of his own favors, and gives or withholds where He pleases, and who shall say to Him, what dost thou? Why should mine eye be evil toward my neighbor, because the eye of God is good? Or what pretense have I to charge God with injustice, when He does more for me than He is bound to do, though He does more for my neighbor than He has done for me? Let this then be constantly maintained, there is a natural, inward sufficiency of powers and faculties given to every sinner to hearken to the calls and offers of grace and the gospel, though they lie under a moral impotence; and there is an outward sufficiency of provision of pardon in the death of Christ, for everyone who repents and accepts the gospel, though pardon is not actually procured for all men, nor secured to them. And thus much is sufficient to maintain the sincerity of God in his universal offers of grace through Jesus Christ, and his present commands to all men to repent and trust in his mercy; as well as to vindicate his equity in the last great Day, when the impenitent and unbelievers shall be condemned. Their death lies at their own doors, for since there was both an outward and inward sufficiency for their recovery, the fault must lie in their own free-will, in their willful aversion to God and Christ, and his salvation. I think this distinction of natural and moral power and impotence, will reconcile all the various expressions of Scripture on this subject, both to one another, and well as to the reason of things, which can hardly be reconciled any other way.</p></blockquote>

in%2C+and+aversion+to+God%2C+which+is+in+the+will+or+affections%2C+is+represented+in+our+own+language%2C+as+well+as+in+the+Eastern+countries%2C+by+impotence+or+inability+to+forsake+or+subdue+sin%3A+As+when+a+drunkard+shall+say%2C+I+had+such+a+strong+desire+to+the+liquor%2C+that+I+could+not+but+drink+to+excess%2C+I+could+not+withhold+the+cup+from+my+mouth%3A+Or+when+a+murderer+shall+say%2C+I+hated+my+neighbor+so+much%2C+that+having+a+fair+opportunity%2C+I+could+not+help+killing+him%3A+Or+when+we+say+to+a+man+of+fury+in+his+passion%2C+You+are+so+warm+at+present%2C+that+you+cannot+see+things+in+a+true+light%2C+you+cannot+hearken+to+reason%2C+you+cannot+judge+aright%2C+you+are+not+capable+of+acting+regularly.+And+that+this+is+the+manner+of+speaking+in+the+Eastern+countries%2C+is+evident+from+the+Bible%2C+Gen.+37%3A4.+Joseph%E2%80%99s+brethren+hated+him%2C+and+could+not+speak+peaceably+to+him%3A+Yet+you+will+grant+all+this+is+but+moral+impotence%2C+i.e.+a+very+strong+inclination+to+excess+of+drink%2C+or+murder%2C+or+passion%2C+or+a+strong+aversion+to+the+contrary+virtues.+Even+in+the+things+of+common+life+the+%E2%80%98cannot%E2%80%99+sometimes+signifies+nothing+but+the+%E2%80%98will+not%E2%80%99%2C+Luke+11%3A7.+%E2%80%98Trouble+me+not%2C+my+door+is+shut%2C+my+children+are+with+me+in+bed%2C+I+cannot+rise+to+give+thee%E2%80%99%3B+i.e.+I+will+not.+And+with+regard+to+faith+or+believing+in+Christ%2C+our+Savior+explains+his+own+Language+in+this+manner.+In+one+place+He+says%2C+%E2%80%98No+man+can+come+unto+Me+except+my+Father+draw+him%2C%E2%80%99+John+6%3A44.+And+in+another+place+He+charges+the+Jews+with+this+as+their+fault%3A+%E2%80%98Ye+will+not+come+unto+Me%2C+that+ye+may+have+life%2C%E2%80%99+John+5%3A40.+So+in+the+parable+one+excuse+is%2C+Luke+14%3A20%2C+%E2%80%98I+have+married+a+wife%2C+and+I+cannot+come.%E2%80%99+All+these+citations+intend+the+same+thing%3A+their+cannot+is+their+will+not%2C+i.e.+%E2%80%99tis+the+strength+of+their+aversion+to+Christ%2C+which+is+a+moral+im l+to+repent+and+believe+in+Christ%2C+by+immediate+Influence+upon+the+will+itself%2C+or+by+setting+the+things+of+the+Gospel+before+the+mind+in+so+strong+a+light%2C+and+persuading+the+soul+so+to+attend+to+them%2C+as+shall+effectually+influence+the+will%2C+this+shall+not+be+any+matter+of+my+present+debate+or+determination%3B+for+in+both+the+event+and+consequences+are+much+the+same%3A+There+is+no+new+natural+power+or+faculty+given+to+the+soul+in+order+to+faith+and+repentance%2C+but+a+divine+influence+upon+the+old+natural+powers%2C+giving+them+a+new+and+better+turn.+Nor+can+anything+of+their+guilt+and+willful+impenitence+be+imputed+to+the+blessed+God%2C+who+is+Lord+of+his+own+favors%2C+and+gives+or+withholds+where+He+pleases%2C+and+who+shall+say+to+Him%2C+what+dost+thou%3F+Why+should+mine+eye+be+evil+toward+my+neighbor%2C+because+the+eye+of+God+is+good%3F+Or+what+pretense+have+I+to+charge+God+with+injustice%2C+when+He+does+more+for+me+than+He+is+bound+to+do%2C+though+He+does+more+for+my+neighbor+than+He+has+done+for+me%3F+Let+this+then+be+constantly+maintained%2C+there+is+a+natural%2C+inward+sufficiency+of+powers+and+faculties+given+to+every+sinner+to+hearken+to+the+calls+and+offers+of+grace+and+the+gospel%2C+though+they+lie+under+a+moral+impotence%3B+and+there+is+an+outward+sufficiency+of+provision+of+pardon+in+the+death+of+Christ%2C+for+everyone+who+repents+and+accepts+the+gospel%2C+though+pardon+is+not+actually+procured+for+all+men%2C+nor+secured+to+them.+And+thus+much+is+sufficient+to+maintain+the+sincerity+of+God+in+his+universal+offers+of+grace+through+Jesus+Christ%2C+and+his+present+commands+to+all+men+to+repent+and+trust+in+his+mercy%3B+as+well+as+to+vindicate+his+equity+in+the+last+great+Day%2C+when+the+impenitent+and+unbelievers+shall+be+condemned.+Their+death+lies+at+their+own+doors%2C+for+since+there+was+both+an+outward+and+inward+sufficiency+for+their+recovery%2C+the+fault+must+lie+in+their+own+free-will%2C+in+their+willful+aversion+to+God+and+Christ%2C+and+his+salvation.+I+think+this+distinction+of+natural+and+moral+power+and+impotence%2C+will+reconcile+all+the+various+expressions+of+Scripture+on+this+subject%2C+both+to+one+another%2C+and+well+as+to+the+reason+of+things%2C+which+can+hardly+be+reconciled+any+other+way.%E2%80%9D%0A%0A%E2%80%94+Isaac+Watts%2C+The+Ruin+%26+Recovery+of+Mankind+%28London%2C+1740%2C+pp.+247-54.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6e2dfb79f6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6e2dfb79f6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/calvinism/total-depravity/natural-vs-moral-inability/#:~:text=Answer.%20It%20is%20granted%2C%20that%20no,hardly%20be%20reconciled%20any%20other%20way&amp;text=Answer.%20It%20is%20granted%2C%20that%20no%20sinner%20will&amp;text=which%20can%20hardly%20be%20reconciled%20any%20other%20way" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

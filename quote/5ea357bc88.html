<main class="wrap"><figure class="quote" id="q-5ea357bc88" data-kw="">
<blockquote><p>The silence of scripture about the observance of Sabbath in antediluvian and patriarchal times, conjoined with the expressions God gave Israel His Sabbath, and such like, are not sufficient to set aside a plain assertion of inspired history, although unsupported by other evidence. But in conjoining the institution of Sabbath with the finishing of creation, the inspired penman is borne out by other facts and arguments.

The reason why Sabbath was instituted, is one of these: the inspired penman tells us, that God blessed the seventh day and sanctified it, because that on it God had rested from all His work which He had created and made. The reason why the Sabbath was appointed, thus existed in full force from the beginning.

Now, is it not most improbable, that an institution should be first appointed to commemorate a fact two thousand years after it had taken place? Is it not more reasonable to suppose, that the fact, and the institution founded upon the fact, were coeval in time, and are conjoined in this narrative, because they were so? This conclusion seems to be established beyond all controversy, by the fact, that time was measured from the beginning, by weeks of seven days, which could only arise from the Sabbath being instituted at the period we have asserted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-white.html">William White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Three Sermons on the Sabbath, Preached in September 1838</cite>, (Haddington: Neill &amp; Sons, 1838), p. 7.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bcfb44bddb" data-kw="">
<blockquote><p>A habit is a mere accident of worship; the person, John or Thomas, is also an accident; but if God command such an ephod as Aaron and the priests were to wear, this is not a mere circumstance… And therefore these circumstances, taken in common and their universal nature, are merely physical circumstances; but taken in their particular and determinate restrictions, as such circumstances, they may be merely moral circumstances, such as are the common adjunct of the time of worship, the place, and the Sabbath time and the temple for Jewish worship. The former are circumstances merely physical, the latter merely moral; I mean, as they are restricted other ways… … I did say that Christ Jesus has set down in the Word a perfect platform of Church-government in all morals; I say in all morals because the Word does not teach us anything of circumstances, physical as physical. Scriptura talia non ponit, sed supponit [Scripture does not put forth such things, but supposes them]: The Scripture says not that the worship of God must have a time, a place, when, and where its to be performed, a person, who is to perform it, a habit, or garments on the person that worships; the Scripture teaches none of these, but supposes that they are and must be; because nature teaches that without time, place, person, habit, gesture, its unpossible that these or any human actions can be; And therefore prelatical formalists do without all sense or reason require that we should prove by Scripture, the lawfulness of time, place, person, habit, gesture in God’s worship; for these are presupposed in all actions, natural, civil, religious, private, public, lawful, unlawful, in acts of arts, sciences, of moral conversing and all; yea, there is as good reason that they demand Scripture to prove he must be a living man, who has a reasonable soul and senses, and is born of a woman, who preaches and administrates sacraments, which is presupposed by nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646) | Introduction, pp. 4-5</span></figcaption>

</figure><figure class="quote" id="q-e902daaad4" data-kw="">
<blockquote><p>Thirdly, to introduce significant sacred ceremonies into the New testament, other than the holy sacraments of God’s own institution, were to reduce Judaism and to impose upon us again the yoke of a ceremonial Law, which Christ has taken off. … Upon this ground also does Perkins condemn all human significant ceremonies. ‘Ceremonies,’ says he, ‘are either of figure and signification, or of order.’ (Com. On Gal. 3:24) The first are abrogated at the coming of Christ, etc. Upon the same ground does Chemnitius condemn them, Quod vero praetenditur, etc. ‘But whereas,’ says he, ‘it is pretended that by those rites of men’s addition, many things are profitably signified, admonished, and taught: Hereto it may be answered that figures do properly belong to the Old Testament: but those things which Christ would have to be taught in the New Testament, he would have them delivered and propounded, not by shadows, but by the light of the Word. And we have a promise of the efficacy of the Word, but not of figures invented by men. (Exam., part 2, de rit. in admin. sacram., p. 32)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 5, p. 83</span></figcaption>

2032" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-90f0823318" data-kw="">
<blockquote><p>Relationships and behaviors are manipulated by very powerful unspoken rules. These rules are seldom, if ever, said out loud. In fact, when spoken out loud many of them sound ridiculous. No one says out loud, ‘What people think about us is more important than what is really happening.’ Yet the unspoken rules communicate these and other shaming messages. The ‘can’t-talk’ rule keeps people quiet by labeling them as the problem if they notice and confront a problem. Because people feel they cannot talk about an unspoken rule, they learn to talk in ‘code’ to convey what they mean. Coding is an example of verbal manipulation… Messages are sent through a verbal code that others are supposed to decode… ‘Don’t you think it would be better this way?’ means, ‘I want you to do it this way.’ People also code non-verbally with body language–by giving dirty looks, becoming loud or quiet, or leaving the room in a sullen or disconnected attitude. Triangling is another way to act manipulative in relationships. This simply means to send a message to someone through another person instead of delivering it directly. The effects [are]: Great ‘radar’–the ability to pick up tensions in situations and relationships; ability to decode the crooked messages of others; saying things in code instead of saying them straight; talking about people instead of to them; message-carrying for people; expecting others to know your code; difficulty trusting people; reading other meanings into what people say.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/unwritten-rules.html">David Johnson &amp; Jeff VanVonderen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Subtle Power of Spiritual Abuse</cite>, pp. 56-57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>But because prayers are after two manner of sorts, that is, either in words only, or else with song joined thereunto; and this latter part… is called by many into doubt, whether it may be used in a reformed church; it is expedient that we note briefly a few things pertaining thereunto. S[t]. Paul giving a rule how men should sing… in another place, showing what songs should be sung, exhorteth the Ephesians to “edify one another with psalms, songs of praise, and such as are spiritual…”… … and confirmed by all Antiquity. As, besides other places, is most manifest by the words of Pliny, called the younger, who, when he was depute in Asia unto the Emperor Trajan, and had received charge to inquire out the Christians to put them to death, writ among other things, touching the Christians, “That their manners were to sing verses or psalms early in the morning to Christ their God.”… And there are no songs more appropriate than the Psalms of the Prophet David, which the Holy Ghost hath framed to the same use, and commended to the Church, as containing the effect of the whole Scriptures, that hereby our hearts might be more lively touched, as appeareth by Moses, Hezekiah, Judith, Debora, Mary, Zechariah, and others, who by songs and metre, rather than in their commune speech and prose, gave thanks to God for such comfort as he sent them. Here it were to[o] long to entreat of the metre; but for as much as the learned doubt not thereof, and it is plainly proven that the Psalms are not only metre, and contain just caesuras [rhythmical pauses], but also have grace and majesty in the verse more than any other places of the Scriptures, we need not to enter into any probation. For they that are skillful in the Hebrew tongue, [Read Moses Chabib, in his books called, מרפא לשון דרכי נרעם] by comparing the Psalms with the rest of the Scriptures, easily may perceive the metre. And to whom is it not known, how the Holy Ghost by all means sought to help our memory, when he factioned [fashioned] many Psalms according to the letters of the alphabet; so that every verse beginneth with the letters thereof in order. Sometimes A. beginneth the half verse, and B. the other half; and in another place, three verses, yea and eight verses with one letter, even the Psalm throughout; as if all men should be inflamed with the love thereof, both for variety of matter, and also briefness, easiness, and delectation.</p></blockquote>

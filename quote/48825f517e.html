<main class="wrap"><figure class="quote" id="q-48825f517e" data-kw="">
<blockquote><p>In New England at the erection of a new [congregationalist] Church, they are content with the presence both of the magistrate and ministers of the neighbor churches, but they declare that neither is necessary, and that the presence of either gives no authority to the action, and the absence of both detracts no authority from it. That the whole power to gather a congregation and to erect a church is alone in the covenanting persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map</cite>, (1645), ch. 6, p. 107 Baillie objects to the below.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

<blockquote><p>2. Whatever defects do not make union with a church and her ordinances sinful do not warrant separation… 3. Union with a church is lawful for those (i) whose callings lead them to a particular church and (ii) they can fulfill the duty of their callings without impediment, even if others fail to fulfill their duty… 4. Union must be maintained even if principles generally acknowledged in a church are not applied in practice… 5. Union must be maintained when the inconveniences following from separation are more harmful to the church than the inconveniences following union, provided that nothing makes union with a church and her ordinances sinful… 6. Union must be maintained when union with a church and her ordinances doesn’t require (i) personal sin or (ii) complicity in others’ sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, … (Edinburgh, 1659), pt. 4, ch. 7, ‘General Grounds leading to Unity’, pp. 320-24</span></figcaption>

</figure><figure class="quote" id="q-f3f8d866d3" data-kw="">
<blockquote><p>Doctrine: We must if occasion require commend good Christians to others. So does Paul Phoebe here, and many others in his epistles. So did the brethren at Lystra and Iconium commend Timothy to Paul, Acts 16:2. So did the Brethren commend Gaius to John, 3 Jn. v. 3, and John, Demetrius, 3 Jn. 12. And in the primative Church it was so ordinary to give Christians letters of commendations, that he which acknowledged them not, was taxed as if he had denyed the faith. And there is great reason for it: For first it concerns them which are requested to commend, that they may show their charity: Secondly, the commended, that they may bee holpen. Thirdly, them to whom, that they may do good to the worthy, and not be deceived by the unworthy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/elnathan-parr.html">Elnathan Parr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain Exposition upon the Whole Thirteenth, Fourteenth, Fifteenth &amp; Sixteenth Chapters of the Epistle of Saint Paul to the Romans</cite>, … (London: Eld, 1622), on Rom. 16:1-2, p. 314 Parr makes letters of commendation a duty of common Christian charity.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

nline · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-23cf5809bd" data-kw="">
<blockquote><p>The Emperor Constantine… was wont to write prayers and orations or sermons of his own making (Eusebius, On the Life of Constantine, bk. 4, ch. 55 &amp; 32 &amp; 29) and reads some common prayers himself to the congregation in his house, ch. 17. (For he made his house a church and preached in it ordinarily himself, though he was both a layman and unbaptized; His sermon about Christianity to the clergy is published by Eusebius: and he preached a funeral oration about the immortality of the soul in his ordinary preaching place, a little before his death: Eusebius, ibid. ch. 55, etc. 29. etc. 17)</p></blockquote>

</figure><figure class="quote" id="q-484a5b2321" data-kw="">
<blockquote><p>We distinguish of admission: It is either negative or positive; negative, is nothing else but a non-hinderance; and though there be no eldership, the minister may not hinder those whom he has no power, I mean no lawful authority to hinder. Now the minister singly by himself has no authority to hinder, keep back, or cast out scandalous persons: for so the power of jurisdiction would be seated in him alone. But now secondly, there is an admission that is positive, judicial, and implies a previous forensical examination by the eldership, as of the parties admitted, so sometimes of witnesses, and authoritative declaration of fitness: And this is to be only in collegio presbyteriali, in the college of presbyters, and properly as they are in court, but not seperatim [separated], and out of court. Now I conceive that this juridical and authoritative admission is not of absolute necessity unto administration of the Lord’s Supper. By baptism the baptized are admitted or entered into the Church-visible, 1 Cor. 12:13, ‘By one Spirit we are all baptized into one body.’ See Rutherford in his Due Right of Presbyteries, [pt. 1, ch. 9, section 9, point 7] p. 254[-55]. Now in some cases the Lord’s Supper may be administered unto those of years that are baptized without any new authoritative judicial admission of the eldership. First, this may be gathered from Acts 2:41-42. Those three thousand souls whose baptism is mentioned, verse 41, have their receiving of the Lord’s Supper recorded, verse 42, and there is not a word of any juridical admission of them by the eldership coming between their baptism and their receiving of the Lord’s Supper.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want of Church-Government</cite>, … (London, 1650), p. 28 Jeanes was an English presbyterian.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

<main class="wrap"><figure class="quote" id="q-3caee1b681" data-kw="">
<blockquote><p>And do further statute and ordain, that no person be admitted, or continued for hereafter, to be a minister or preacher within this Church, unless that he… do also subscribe the Confession of faith, ratified in the foresaid 5th Act of the second Session of this Parliament, declaring the same to be the confession of his faith, and that he owns the doctrine therein contained to be the true doctrine which he will constantly adhere to: As likewise, that he owns and acknowledges Presbyterian Church government, as settled by the foresaid fifth act of the second session of this parliament, to be the only government of this Church, and that he will submit thereto, and concur therewith, and never endeavour, directly or indirectly, the prejudice or subversion thereof…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/parliament.html">Parliament</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Act for Settling the Quiet and Peace of the Church in Cooper</cite>, pp. 53-54</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ce5619f376" data-kw="">
<blockquote><p>Thirdly, true matter [of the Church] are all such [persons] as are baptized, and openly profess that Jesus the son of Mary is the Son of God, made Christ the Lord, by whom only and alone is salvation… … Thirdly, because it is the sum of the whole Gospel, and Covenant in the New Testament, in respect whereof, there is no other point of religion necessary, but as it tends either to bring men unto, or to confirm them in this main truth. Hence it is, that St. John concludes his Gospel with this scope… And therefore since such as do profess this truth do summarily and in general profess all the evangelical doctrines in God’s book, such must needs be fit matter of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Plain Evidences the Church of England is Apostolical, the Separation Schismatical</cite>, ... (London: 1610), 8th Error, p. 271</span></figcaption>

</figure><figure class="quote" id="q-4236cba081" data-kw="">
<blockquote><p>2. Even if that assembly were to verbally profess all fundamental articles and acknowledge the Word of God as the rule of faith, it would not thereby be proven that the Roman Curia is metaphysically a Church or the bride of Christ that adheres to Christ the bridegroom with true faith. For there is no impure Christian sect that does not subscribe to the Apostles’ Creed, the Decalogue, and the Lord’s Prayer. Would such a subscription overturn formal fundamental errors? And even if the most impure sect were to believe as much of the Word of God as could suffice for the salvation of a person (as the Jews today profess to believe in the Old Testament), it would not thereby be established as a Church truly and physically. For there is a difference between salvation existing in the Word, which some assembly acknowledges as the Word of God, and that assembly being truly a congregation of believers. For true faith requires attention not only to the material object but also to the formal object of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. by AI (1639-1642; 1668; Monergism, 2024), ch. 1, ‘Of the Holy Scripture’; pp. 92-93</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

t online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1e615a3ebe" data-kw="">
<blockquote><p>And all students in divinity are most expressly enjoined, upon pain of being declared unworthy of ever serving in the sacred ministry, to raise any stirs or debates about unnecessary questions, as concerning the order of God’s decrees, of universal grace by the preaching of nature, which may lead and bring men unto salvation, points only propounded and advanced by pure curiosity, and for the exercise of men’s wits. And all examiners of our proposans in order to the ministry, shall proceed in that business with very much charity, exacting from them nothing but what is demanded by the canons of our discipline; and provided they give that satisfaction which is requisite, by signing the Confession of Faith, the Liturgy of our Churches, and the Canons of Alez, Charenton, and Alenson, and this present act, they shall be approved and admitted.</p></blockquote>

<blockquote><p>Fourthly, (saith Mr. T[ombes].) Circumcision did sign Canaan; Baptism eternal life. This we have answered to afore, That Circumcision did sign Canaan as it was a type of heaven, Heb. 4. As baptism and the holy Supper under material elements signify and give us things spiritual and eternal. All this while I cannot see such a material difference between Circumcision and Baptism in the least to deface the analogy and semblance between the administration of the one and the other, to believers and their Infants, or to interrupt that consequence from the one to the other. What ever may be urged against the incapacity of children to be Baptized, may as well be argued against Circumcision.

By this that hath been answered candid men may see what reason Mr. T. hath to deny major, or consequence, or minor. If this argument be not restrainedly understood an egg is laid, out of which manifest Judaism may be hatched.

No fear, if we argue as the Apostle argues; who Colossians 2, 11. 12. (as we have cleared we hope) puts Baptism in the room of Circumcision. If we do not put those things in the place one of another, which God puts in (though but by practice and example) without looking for a new institution or command, there being a difference only of circumstances, I am bold to say, an egg is laid out of which may be hatched Antisabbatarianism a nulling of the Lords day, (as is frequent upon this very consequence, among the Anabaptists) and Exemption of women from the holy Supper with many the like inconveniencies, which we stay not now to name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-holmes.html">Nathanael Holmes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A vindication of baptizing believers infants: In some animadversions upon Mr. Tombes his Exercitations about infant baptism; as also upon his Examen, as touching the antiquities and authors by him alleged or contradicted that concern the same. Humbly submitted to the judgement of all candid Christia</cite>, (London: M. Simmons, 1646), pp 33-34.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-189774c05f" data-kw="">
<blockquote><p>3d. Plea. I am come of Religious Parents, that improved, pleaded the Covenant for me, trained me up in the Fear of God.

Answ. John Baptist anticipates this Plea, Mat. 3.9. Think not to say in your Hearts, We have Abraham to our Father, Matth. 8.12. The Children of the Kingdom may be cast into utter Darkness. Alas Parental Privileges without Parents Principles, signify nothing: Let our Lord Christ, who will be Judge, answer this vain Plea, John 8.33-44. This may aggravate your Sin, never save your Souls, without Personal Piety.

4th. Plea. I have made a credible Profession of my Faith, am Baptized, am admitted to the Lord’s Supper, join with God’s People.

Answ. So did Simon Magus believe, professed his Faith, was Baptized, Acts 8.13.20-23, deceived the purest Church on Earth, for he proved a rotten Hypocrite; so did Judas, so did he that wanted the Wedding Garment, Matth. 22.12. And how easy it is to cast a Mist before the Eyes of fallible men, daily experience testifies: See an Instance of some that partake of extraordinary Privileges, Ordinances, yet rejected, 1 Cor. 10.5.</p></blockquote>

</figure><figure class="quote" id="q-1b25bff966" data-kw="">
<blockquote><p>Here someone will ask whether the apostle was right to say that because you have been baptized you have put on Christ, when it is clear that there are all kinds of people who have been baptized but who are strangers to the grace and Spirit of Christ, like Simon Magus for example, whom nobody would claim had ever really put on Christ.

Those who are baptized put on Christ in a sacramental way, but only those who go beyond the sacrament and put him on in actual fact are real Christians. Undoubtedly there were many Galatians who had not really put him on but had only made a profession of Christianity and been sacramentally baptized. Paul was right to say that whoever has been baptized has put on Christ, as long as you understand this in a sacramental sense. This sacramental way of speaking is common in Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolas Apostoli Pauli ad Galatas et Ephesios Commentarii</cite>, (Basel, 1561). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 128.</span></figcaption>

<blockquote><p>III. The question is not whether all infants are to be baptized or not; for, according to the will of God, some are not to be baptized, even such whose parents are strangers from the covenant. But hence it will follow that some are to be baptized, seeing an exception confirms both rule and right.

IV. The question is only concerning the children or infant seed of professing believers who are themselves baptized. And,— First, They by whom this is denied can produce no testimony of Scripture wherein their negation is formally or in terms included, nor any one asserting what is inconsistent with the affirmative; for it is weak beneath consideration to suppose that the requiring of the baptism of believers is inconsistent with that of their seed. But this is to be required of them who oppose infant baptism, that they produce such a testimony. Secondly, No instance can be given from the Old or New Testament since the days of Abraham, none from the approved practice of the primitive church, of any person or persons born of professing, believing parents, who were themselves made partakers of the initial seal of the covenant, being then infancy and designed to be brought up in the knowledge of God, who were not made partakers with them of the same sign and seal of the covenant. Thirdly, A spiritual privilege once granted by God unto any cannot be changed, disannulled, or abrogated, without an especial divine revocation of it, or the substitution of a greater privilege and mercy in the room of it; for,— 1. Who shall disannul what God hath granted? What he hath put together who shall put asunder? To abolish or take away any grant of privilege made by him to the church, without his own express revocation of it, is to deny his sovereign authority.

      2. To say a privilege so granted may be revoked, even by God himself, without the substitution of a greater privilege and mercy in the room of it, is contrary to the goodness of God, his love and care unto his church, [and] contrary to his constant course of proceeding with it from the foundation of the world, wherein he went on in the enlargement and increase of its privileges until the coming of Christ. And to suppose it under the gospel is contrary to all his promises, the honour of Christ, and a multitude of express testimonies of Scripture. Thus was it with the privileges of the temple and the worship of it granted to the Jews; they were not, they could not be, taken away without an express revocation, and the substitution of a more glorious spiritual temple and worship in their room. But now the spiritual privilege of a right unto and a participation of the initial seal of the covenant was granted by God unto the infant seed of Abraham, Gen. 17:10, 12. This grant, therefore, must stand firm for ever, unless men can prove or produce,— 1. An express revocation of it by God himself; which none can do either directly or indirectly, in terms or any pretence of consequence.

      2. An instance of a greater privilege or mercy granted unto them in the room of it; which they do not once pretend unto, but leave the seed of believers, whilst in their infant state, in the same condition with those of pagans and infidels; expressly contrary to God’s covenant. All this contest, therefore, is to deprive the children of believers of a privilege once granted to them by God, never revoked, as to the substance of it, assigning nothing in its room; which is contrary to the goodness, love, and covenant of God, especially derogatory to the honour of Jesus Christ and the gospel. Fourthly, They that have the thing signified have right unto the sign of it, or those who are partakers of the grace of baptism have a right to the administration of it: so Acts 10:47. But the children of believers are all of them capable of the grace signified in baptism, and some of them are certainly partakers of it, namely, such as die in their infancy (which is all that can be said of professors): therefore they may and ought to be baptized. For,— 1. Infants are made for and are capable of eternal glory or misery, and must fall, dying infants, into one of these estates for ever.

      2. All infants are born in a state of sin, wherein they are spiritually dead and under the curse.

      3. Unless they are regenerated or born again, they must all perish inevitably, John 3:3. Their regeneration is the grace whereof baptism is a sign or token. Wherever this is, there baptism ought to be administered. Fifthly, God having appointed baptism as the sign and seal of regeneration, unto whom he denies it, he denies the grace signified by it. Why is it the will of God that unbelievers and impenitent sinners should not be baptized? It is because, not granting them the grace, he will not grant them the sign. If, therefore, God denies the sign unto the infant seed of believers, it must be because he denies them the grace of it; and then all the children of believing parents dying in their infancy must, without hope, be eternally damned. I do not say that all must be so who are not baptized, but all must be so whom God would have not baptized. But this is contrary to the goodness and law [love?] of God, the nature and promises of the covenant, the testimony of Christ reckoning them to the kingdom of God, the faith of godly parents, and the belief of the church in all ages. It follows hence unavoidably that infants who die in their infancy have the grace of regeneration, and consequently as good a right unto baptism as believers themselves. Sixthly, All children in their infancy are reckoned unto the covenant of their parents, by virtue of the law of their creation. For they are all made capable of eternal rewards and punishments, as hath been declared.</p></blockquote>

IV. The question is only concerning the children or infant seed of professing believers who are themselves baptized. And,— First, They by whom this is denied can produce no testimony of Scripture wherein their negation is formally or in terms included, nor any one asserting what is inconsistent with the affirmative; for it is weak beneath consideration to suppose that the requiring of the baptism of believers is inconsistent with that of their seed. But this is to be required of them who oppose infant baptism, that they produce such a testimony. Secondly, No instance can be given from the Old or New Testament since the days of Abraham, none from the approved practice of the primitive church, of any person or persons born of professing, believing parents, who were themselves made partakers of the initial seal of the covenant, being then infancy and designed to be brought up in the knowledge of God, who were not made partakers with them of the same sign and seal of the covenant. Thirdly, A spiritual privilege once granted by God unto any cannot be changed, disannulled, or abrogated, without an especial divine revocation of it, or the substitution of a greater privilege and mercy in the room of it; for,— 1. Who shall disannul what God hath granted? What he hath put together who shall put asunder? To abolish or take away any grant of privilege made by him to the church, without his own express revocation of it, is to deny his sovereign authority.

      2. To say a privilege so granted may be revoked, even by God himself, without the substitution of a greater privilege and mercy in the room of it, is contrary to the goodness of God, his love and care unto his church, [and] contrary to his constant course of proceeding with it from the foundation of the world, wherein he went on in the enlargement and increase of its privileges until the coming of Christ. And to suppose it under the gospel is contrary to all his promises, the honour of Christ, and a multitude of express testimonies of Scripture. Thus was it with the privileges of the temple and the worship of it granted to the Jews; they were not, they could not be, taken away without an express revocation, and the substitution of a more glorious spiritual temple and worship in their room. But now the spiritual privilege of a right unto and a participation of the initial seal of the covenant was granted by God unto the infant seed of Abraham, Gen. 17:10, 12. This grant, therefore, must stand firm for ever, unless men can prove or produce,— 1. An express revocation of it by God himself; which none can do either directly or indirectly, in terms or any pretence of consequence.

      2. An instance of a greater privilege or mercy granted unto them in the room of it; which they do not once pretend unto, but leave the seed of believers, whilst in their infant state, in the same condition with those of pagans and infidels; expressly contrary to God’s covenant. All this contest, therefore, is to deprive the children of believers of a privilege once granted to them by God, never revoked, as to the substance of it, assigning nothing in its room; which is contrary to the goodness, love, and covenant of God, especially derogatory to the honour of Jesus Christ and the gospel. Fourthly, They that have the thing signified have right unto the sign of it, or those who are partakers of the grace of baptism have a right to the administration of it: so Acts 10:47. But the children of believers are all of them capable of the grace signified in baptism, and some of them are certainly partakers of it, namely, such as die in their infancy (which is all that can be said of professors): therefore they may and ought to be baptized. For,— 1. Infants are made for and are capable of eternal glory or misery, and must fall, dying infants, into one of these estates for ever.

      2. All infants are born in a state of sin, wherein they are spiritually dead and under the curse.

      3. Unless they are regenerated or born again, they must all perish inevitably, John 3:3. Their regeneration is the grace whereof baptism is a sign or token. Wherever this is, there baptism ought to be administered. Fifthly, God having appointed baptism as the sign and seal of regeneration, unto whom he denies it, he denies the grace signified by it. Why is it the will of God that unbelievers and impenitent sinners should not be baptized? It is because, not granting them the grace, he will not grant them the sign. If, therefore, God denies the sign unto the infant seed of believers, it must be because he denies them the grace of it; and then all the children of believing parents dying in their infancy must, without hope, be eternally damned. I do not say that all must be so who are not baptized, but all must be so whom God would have not baptized. But this is contrary to the goodness and law [love?] of God, the nature and promises of the covenant, the testimony of Christ reckoning them to the kingdom of God, the faith of godly parents, and the belief of the church in all ages. It follows hence unavoidably that infants who die in their infancy have the grace of regeneration, and consequently as good a right unto baptism as believers themselves. Sixthly, All children in their infancy are reckoned unto the covenant of their parents, by virtue of the law of their creation. For they are all made capable of eternal rewards and punishments, as hath been declared.”

— John Owen, The Works of John Owen, Of Infant Baptism and Dipping in The Works of John Owen, ed. William H. Goold, vol. 16 (Edinburgh: T&amp;T Clark, n.d.), 258–60 (HT: Reformed Reader)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIII.+The+question+is+not+whether+all+infants+are+to+be+baptized+or+not%3B+for%2C+according+to+the+will+of+God%2C+some+are+not+to+be+baptized%2C+even+such+whose+parents+are+strangers+from+the+covenant.+But+hence+it+will+follow+that+some+are+to+be+baptized%2C+seeing+an+exception+confirms+both+rule+and+right.+IV.+The+question+is+only+concerning+the+children+or+infant+seed+of+professing+believers+who+are+themselves+baptized.+And%2C%E2%80%94+First%2C+They+by+whom+this+is+denied+can+produce+no+testimony+of+Scripture+wherein+their+negation+is+formally+or+in+terms+included%2C+nor+any+one+asserting+what+is+inconsistent+with+the+affirmative%3B+for+it+is+weak+beneath+consideration+to+suppose+that+the+requiring+of+the+baptism+of+believers+is+inconsistent+with+that+of+their+seed.+But+this+is+to+be+required+of+them+who+oppose+infant+baptism%2C+that+they+produce+such+a+testimony.+Secondly%2C+No+instance+can+be+given+from+the+Old+or+New+Testament+since+the+days+of+Abraham%2C+none+from+the+approved+practice+of+the+primitive+church%2C+of+any+person+or+persons+born+of+professing%2C+believing+parents%2C+who+were+themselves+made+partakers+of+the+initial+seal+of+the+covenant%2C+being+then+infancy+and+designed+to+be+brought+up+in+the+knowledge+of+God%2C+who+were+not+made+partakers+with+them+of+the+same+sign+and+seal+of+the+covenant.+Thirdly%2C+A+spiritual+privilege+once+granted+by+God+unto+any+cannot+be+changed%2C+disannulled%2C+or+abrogated%2C+without+an+especial+divine+revocation+of+it%2C+or+the+substitution+of+a+greater+privilege+and+mercy+in+the+room+of+it%3B+for%2C%E2%80%94+1.+Who+shall+disannul+what+God+hath+granted%3F+What+he+hath+put+together+who+shall+put+asunder%3F+To+abolish+or+take+away+any+grant+of+privilege+made+by+him+to+the+church%2C+without+his+own+express+revocation+of+it%2C+is+to+deny+his+sovereign+authority.+2.+To+say+a+privilege+so+granted+may+be+revoked%2C+even+by+God+himself%2C+without+the+substitution+of+a+greater+privilege+and+mercy+in+the+room+of+it%2C+is+contrary+to+the+goodness+of+God%2C+his+love+and+care+unto+his+church%2C+%5Band%5D+contrary+to+his+constant+course+of+proceeding+with+it+from+the+foundation+of+the+world%2C+wherein+he+went+on+in+the+enlargement+and+increase+of+its+privileges+until+the+coming+of+Christ.+And+to+suppose+it+under+the+gospel+is+contrary+to+all+his+promises%2C+the+honour+of+Christ%2C+and+a+multitude+of+express+testimonies+of+Scripture.+Thus+was+it+with+the+privileges+of+the+temple+and+the+worship+of+it+granted+to+the+Jews%3B+they+were+not%2C+they+could+not+be%2C+taken+away+without+an+express+revocation%2C+and+the+substitution+of+a+more+glorious+spiritual+temple+and+worship+in+their+room.+But+now+the+spiritual+privilege+of+a+right+unto+and+a+participation+of+the+initial+seal+of+the+covenant+was+granted+by+God+unto+the+infant+seed+of+Abraham%2C+Gen.+17%3A10%2C+12.+This+grant%2C+therefore%2C+must+stand+firm+for+ever%2C+unless+men+can+prove+or+produce%2C%E2%80%94+1.+An+express+revocation+of+it+by+God+himself%3B+which+none+can+do+either+directly+or+indirectly%2C+in+terms+or+any+pretence+of+consequence.+2.+An+instance+of+a+greater+privilege+or+mercy+granted+unto+them+in+the+room+of+it%3B+which+they+do+not+once+pretend+unto%2C+but+leave+the+seed+of+believers%2C+whilst+in+their+infant+state%2C+in+the+same+condition+with+those+of+pagans+and+infidels%3B+expressly+contrary+to+God%E2%80%99s+covenant.+All+this+contest%2C+therefore%2C+is+to+deprive+the+children+of+believers+of+a+privilege+once+granted+to+them+by+God%2C+never+revoked%2C+as+to+the+substance+of+it%2C+assigning+nothing+in+its+room%3B+which+is+contrary+to+the+goodness%2C+love%2C+and+covenant+of+God%2C+especially+derogatory+to+the+honour+of+Jesus+Christ+and+the+gospel.+Fourthly%2C+They+that+have+the+thing+signified+have+right+unto+the+sign+of+it%2C+or+those+who+are+partakers+of+the+grace+of+baptism+have+a+right+to+the+administration+of+it%3A+so+Acts+10%3A47.+But+the+children+of+believers+are+all+of+them+capable+of+the+grace+signified+in+baptism%2C+and+some+of+them+are+certainly+partakers+of+it%2C+namely%2C+such+as+die+in+their+infancy+%28which+is+all+that+can+be+said+of+professors%29%3A+therefore+they+may+and+ought+to+be+baptized.+For%2C%E2%80%94+1.+Infants+are+made+for+and+are+capable+of+eternal+glory+or+misery%2C+and+must+fall%2C+dying+infants%2C+into+one+of+these+estates+for+ever.+2.+All+infants+are+born+in+a+state+of+sin%2C+wherein+they+are+spiritually+dead+and+under+the+curse.+3.+Unless+they+are+regenerated+or+born+again%2C+they+must+all+perish+inevitably%2C+John+3%3A3.+Their+regeneration+is+the+grace+whereof+baptism+is+a+sign+or+token.+Wherever+this+is%2C+there+baptism+ought+to+be+administered.+Fifthly%2C+God+having+appointed+baptism+as+the+sign+and+seal+of+regeneration%2C+unto+whom+he+denies+it%2C+he+denies+the+grace+signified+by+it.+Why+is+it+the+will+of+God+that+unbelievers+and+impenitent+sinners+should+not+be+baptized%3F+It+is+because%2C+not+granting+them+the+grace%2C+he+will+not+grant+them+the+sign.+If%2C+therefore%2C+God+denies+the+sign+unto+the+infant+seed+of+believers%2C+it+must+be+because+he+denies+them+the+grace+of+it%3B+and+then+all+the+children+of+believing+parents+dying+in+their+infancy+must%2C+without+hope%2C+be+eternally+damned.+I+do+not+say+that+all+must+be+so+who+are+not+baptized%2C+but+all+must+be+so+whom+God+would+have+not+baptized.+But+this+is+contrary+to+the+goodness+and+law+%5Blove%3F%5D+of+God%2C+the+nature+and+promises+of+the+covenant%2C+the+testimony+of+Christ+reckoning+them+to+the+kingdom+of+God%2C+the+faith+of+godly+parents%2C+and+the+belief+of+the+church+in+all+ages.+It+follows+hence+unavoidably+that+infants+who+die+in+their+infancy+have+the+grace+of+regeneration%2C+and+consequently+as+good+a+right+unto+baptism+as+believers+themselves.+Sixthly%2C+All+children+in+their+infancy+are+reckoned+unto+the+covenant+of+their+parents%2C+by+virtue+of+the+law+of+their+creation.+For+they+are+all+made+capable+of+eternal+rewards+and+punishments%2C+as+hath+been+declared.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+The+Works+of+John+Owen%2C+Of+Infant+Baptism+and+Dipping+in+The+Works+of+John+Owen%2C+ed.+William+H.+Goold%2C+vol.+16+%28Edinburgh%3A+T%26T+Clark%2C+n.d.%29%2C+258%E2%80%9360+%28HT%3A+Reformed+Reader%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc1a25b9972.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c1a25b9972.html">Permalink</a><a class="src" href="https://heidelblog.net/2021/10/john-owen-defended-infant-baptism/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>The matter is often spoken of as if the Church of England must of necessity have laid down, and had in fact laid down, a certain definite precise view upon this subject, and peremptorily enjoined it upon all her ministers for their acceptance and belief. In my humble apprehension such a notion is entirely opposed to fact… …all which our Church has done upon this question is, to lay down certain limits on both sides, within which the views of her ministers are to be confined.</p></blockquote>

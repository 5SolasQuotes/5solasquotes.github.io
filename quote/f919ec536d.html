<blockquote><p>Evidence and declare the truth and reality of your holiness, by a resolute standing up for purity of religion, and for purity of worship and ordinances, in opposition to all mixtures and corruptions whatsoever. O sirs, the great God stands upon nothing more in all the world than upon purity in his worship, James i. 27. There is nothing that does so provoke and exasperate God against a people as mixtures in his worship and service. Mat. xxi. 12, 13; John ii. 15-17. Pollutions in worship do sadly reflect upon the name of God, the honour of God, the truth of Clod, and the wisdom of God; and therefore his heart rises against them.

The very spirit, life, and soul of the second commandment lies in these words, ‘Thou shalt not make to thyself any graven image,’ &amp;c. In matters of divine worship God abhors that men should mix their water with his wine, their dross with his gold, their chaff with his wheat, &amp;c. when once men come to be so bold as to defile his worship with their mixtures, then God is resolved to be a swift and a terrible witness against them, as you may clearly see by comparing those notable places of Scripture together in the margin. There is no sin that does so incense and provoke God to jealousy and wrath against a people, as mixtures in worship. God can bear with defilements anywhere rather than in his worship and service: and that,

First, Because mixtures in worship are cross to God’s express commands; and who art thou, man! that darest run cross to his commands, who can command thee into the dust, yea, into hell, at pleasure? &amp;c.

Secondly, Because this is to accuse the blessed Scripture of insufficiency; for if the Scripture be a sufficient rule to order, guide, and direct us in all matters of worship, then how dost thou, man! detract from the sufficiency of the Scripture, who minglest thine own or other men’s inventions with divine institutions, and settest up thy posts by God’s posts? sirs, the Scriptures are sufficient to direct us fully in everything that belongs to the worship and service of God; so as that we need not depend upon the wisdom, prudence, care, or authority of any men under heaven to direct us in matters of worship: 2 Tim. iii. 16, 17, ‘All scripture is given by inspiration of God, and is profitable for doctrine, for reproof, for correction, for instruction in righteousness: that the man of God may be perfect, thoroughly furnished unto all good works.’

The Scriptures are sufficient to inform the ignorant, to confute the erroneous, to reform the vicious, and to guide and direct, support and comfort those that are gracious. Here a lamb may wade, and an elephant may swim; here is milk for babes, and meat for strong men; here is comfort for the afflicted, and succour for the tempted, and ease for the troubled, and light for the clouded, and enlargement for the straitened, &amp;c. Oh, how full of light, how full of life, how full of love, how full of sweetness, how full of goodness, how full of righteousness and holiness, &amp;c., is every chapter, and every verse in every chapter, yea, and every line in every verse!

The Rabbins say that a mountain of matter hangs upon every word of Scripture, yea, upon every tittle of Scripture. God never sends his people to the shop of men’s traditions and inventions, but he still sends them to the Scripture: Isa. viii. 20, ‘To the law and to the testimony; if they speak not according to this word, it is because there is no light, or no morning, in them.’ Chap, xxxiv. 16, ‘Seek ye out of the book of the Lord, and read; no one of these shall fail, none shall want her mate; for my mouth it hath commanded, and his Spirit it hath gathered them.’

And in the New Testament Christ sends his hearers to the Scriptures: John v. 39, ‘Search the Scriptures, for in them ye think ye have eternal life, and they are they which testify of me.’ The Greek word εραυνᾶτε that is here rendered search, signifies a strict, narrow, curious, diligent search. We must search the Scripture as we would search for gold, or for some precious stones which we would fain find; we must search the Scriptures as hunters seek and search out their game. And so the apostle sends his hearers to the Scriptures, 2 Pet. i. 19-22, as to a surer word than that of revelation. All which speaks out the sufficiency of the Scripture to direct us in all matters that concern our internal or eternal welfare. Oh that you would for ever remember these two things:

(1.) First, That that which bred the Popish religion, superstition, idolatry, and pompous worship, was men’s departing from the word, and not cleaving to the word as a sufficient rule to direct them in all matters of worship. And,

(2.) Secondly, That that which hath occasioned all those discords, divisions, heats, heart-burnings, animosities, and contentions, &amp;c., about ceremonies, liturgy, forms, gestures, &amp;c., has been men’s not keeping close to the blessed word of God. When men forsake this perfect rule, whither won’t they run? and what won’t they do? Ah, who art thou, vain man! that accuseth the holy Scriptures of insufficiency? and how wilt thou blush, and be ashamed and confounded, when in the great day the Lord shall plead the excellency, and vindicate the sufficiency and authority of his blessed book, in opposition to all the mixtures of men’s traditions with divine institutions?

Thirdly, God won’t nor can’t bear with mixtures in his worship and service, because to bring them in is to accuse and charge God with weakness and folly, as if God were not careful enough, nor faithful enough, Heb. iii. 4-6, nor mindful enough, nor wise enough, nor prudent nor understanding enough, to order, direct, and guide his people in the matters of his worship, hut must be beholding to the wisdom, prudence, and care of man, John iv. 23, 24, of vain man, of sinful man, of vile and unworthy man, of weak and foolish man, to complete, perfect, and make up something that was wanting in his worship and service, Ps. xxxix. 5, &amp;c.

Fourthly, God won’t bear with mixtures in his worship and service, because all mixtures debases the worship and service of God, and makes the worship a vain worship, Isa. xxix. 13, 14; Mat. xv. 3, 6, 8, 9. As the mixing of water with wine is the debasing of the wine, and the mixing of tin with silver, or brass with gold, is the debasing of the silver and gold; so for men to mix and mingle their traditions and inventions with God’s institutions, is to debase the worship and service of God, and to detract from the excellency and glory of it.</p></blockquote>

<blockquote><p>Q. 21. Why doth God mention not only servants but beasts?

A. As he would not have servants enslaved and abused by such labour as should unfit them for sabbath work and comfort, so he would have man exercise the clemency of his nature, even towards the brutes; and beasts cannot labour, but man will be put to some labour or diversion by it: and God would have the whole place where we dwell, and all that we have to do with, to bear an open signification of our obedience to his command, and our reverence to his sanctified day and worship.</p></blockquote>

<blockquote><p>XII. Indeed in the I Tim. 4. 10. God is called σωτηρ, the Saviour of all men. But the Apostle there speaketh of the preservation in this present life, and of the providence of God, which is extended to the preservation of all men: which care, David, Psal. 36 doth extend even to the beasts, for there God is called the preserver of men and beasts. The precedent words of the Apostle doth declare this: We hope in the living God; for he speaketh of God, as he doth give life to things created by him. A like place you have, Acts. 17.25.</p></blockquote>

</figure><figure class="quote" id="q-4978fea938" data-kw="">
<blockquote><p>All times are naturally equal, as being distinguished by the same constant and uniform motion of the heavens: yet notwithstanding, when God shall, by any notable and extraordinary work of his, honour and sanctify some certain days, as he did the Jewish sabbath with respect to the creation, and our Lord’s day, by raising up Christ from the dead; as they are, by this wonderful work of his, severed from the rank of common times;–so are we, ever when we come unto them, not to pass them over without the memory of that work which had so advanced them: otherwise to solemnize a day, without reference unto the cause of its solemnization, is but a blind observance. And for this cause, when God commands reverence to places, and sanctification of days, he annexeth the ground of both, and leads us to a sight of those works, from which they receive both their dignity and institution.

So likewise in Sacraments, to eat bread and drink wine are naked, common, simple actions, and in themselves always alike: but when Christ shall, by that great work of his death, set them apart unto a holy use, and make them representations of his own sacred body, as they are by this divine relation hallowed, so to partake of them, without commemorating that great work which hath so sanctified them, is not only impious, in that it perverteth the divine institution, but absurd likewise; it being all one, as if a man should, with much ceremony and solemnity, receive parchment and wax, never so much as thinking on the land it conveys; or look on a picture, without any reflection on the pattern and original which it resembleth, – which is indeed to look on the wood, and not on the picture; it being naturally impossible to separate things in notion, whose being do consist in relation to each other.

So then, the Sacrament being a typical service, is not, nor can be, celebrated without a remembrance of the substance which it resembleth: which thing, according as the preciousness, value, and importance of it doth proportionably impose on us a greater necessity of this duty; which is then rightly performed, when there is a deep impression of Christ crucified made on the soul, by these seals of his death; than which there is not any thing in the world more fit to fasten a stamp of itself in the minds of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations on the Holy Sacrament of the Lord’s Last Supper</cite>, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), 3: 88-89.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

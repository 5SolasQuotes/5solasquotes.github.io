<blockquote><p>Mr. Hooker [a congregationalist]: ”The Apostles’ (says Mr. Rutherford) ‘stand in the room of the whole catholic ministerial guides when they revealed the keys.’ [Hooker’s] Answer [to Rutherford]: The apostles in that commission were extraordinary persons sent to all the world to lay the foundation of the Gospel, by an apostolic power; and in this sense they have no successors, nor stand in the room of any.’ [Rutherford’s] Answer: [1.] If the apostles represent none in this sense, Mt. 28:19; Mk. 16:15; Jn. 20:21, ‘Go and teach, etc.’, ‘Whose sins ye remit, etc.’, then none succeed the apostles to teach, baptize, remit and retain sins; pastors then must do these without a commission from Christ, or these ordinances must cease. 2. Mt. 28; Jn. 20, He sends the apostles and says, ‘Behold, I am with you to the end of the world,’ in preaching and baptizing. The apostles, Mt. 28:19-20; Jn. 20:21-22, when they received power to preach and baptize, did represent all ordinary teachers to the end of the world, or then ordinary teachers want [lack] all calling. But the apostles do not live to preach and baptize to the end of the world; therefore that ministerial presence of Christ must be promised to some represented by the apostles. So the English Divines, Calvin, Beza, Diodati [held], as apostles gifted with power of working miracles, etc., they represented none, nor had they any successors. So [in] Mt. 28, the pastors have the power of the keys and of office given them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, ... (London, 1658), bk. 4, ch. 2, pp. 353-4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d4b5970fc2" data-kw="">
<blockquote><p>3. Those duties which are required of all those who publicly preach the Word of God in the Name of Christ are not required of all those Christians that are gifted: as that there lies on them the pastoral charge of souls, of which they are to give an account to God, Heb. 13:17, that they ought to give themselves wholly to the reading and studying of the Scriptures, 2 Tim. 4:15-16, that they may not apply themselves to the things of this world, 2 Tim. 2:4, that in the Name of Christ as his Ambassadors they entreat men to be reconciled to God, 2 Cor. 5. 20, that they are to distribute to all and every one in the house of God their portion of food in due season, Mt. 24:46, that they are authoritatively in the Name of Christ to remit and retain sins, Jn. 20:21. Now all these things are not enjoined on all Christians who have received the gifts of the Spirit.

4. Hence also the privileges and promises which are made to pastors, who preach the Word in the Name of God, are not given to all believers who are endued with the gifts of the Spirit; as, that they are worthy of double honor, 1 Tim. 5:17, that God will by a peculiar and singular assistance of his Spirit be present with them, Mt. 28:20; Lk. 21:14-15. And so a prophet’s recompence and reward is distinguished from the reward of a righteous man, Mt. 10:42. Therefore that labor, duty, and burden, to which these promises are made, is not imposed on all the righteous that are endued with gifts of the Holy Ghost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England concerning the Government of the Church of God</cite>, (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’, pp. 79-80</span></figcaption>

d+in+the+Kingdom+of+England+concerning+the+Government+of+the+Church+of+God%2C+%28London%3A+G.M.%2C+1645%29%2C+ch.+5%2C+%E2%80%98Of+the+Ecclesiastical+Ministry%2C+and+the+Exercise+thereof%E2%80%99%2C+pp.+79-80&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd4b5970fc2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d4b5970fc2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/evangelism#:~:text=3.%20Those%20duties%20which%20are%20required,with%20gifts%20of%20the%20Holy%20Ghost&amp;text=3.%20Those%20duties%20which%20are%20required%20of%20all&amp;text=are%20endued%20with%20gifts%20of%20the%20Holy%20Ghost" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-26f1ea2082" data-kw="">
<blockquote><p>It is true, they [the Independents] object that the apostles, Mt. 18, were commanded to preach to all nations, but pastors are not so now, but are commanded to feed the flock over which God has appointed them, Acts 20:28; but it is as true [that] the apostles were commanded to preach to all nations, in opposition to the charge that the prophets of old were to speak to the people of Israel only, and the apostles, Mt. 10, [were] forbidden to preach to the Samaritans and gentiles; and it is as true that God’s Spirit limited the apostles to preach to Macedonia, not to Bithynia; Now because this particular direction for places is wanting in the Church, it is certain that a man is yet a pastor in office in relation to as many as God’s hand of providence shall send him unto, though he be chosen by a people to feed ordinarily one determinate flock, and though he be not an extraordinary and immediately inspired planter of Churches, or the first planter, as were the apostles, yet is he a pastor in relation to all. And if this be not said: 1. It were simply unlawful for pastors now to plant churches and spread the Gospel to those nations who have not heard it, because all pastors now are ordinary [according to congregationalists], and none are immediately inspired apostles: but it is certain what the apostles did by an extraordinary gift, as such immediately called pastors, it is unlawful for ordinary pastors to attempt to do, as to attempt to speak with tongues, and to plant Churches by speaking with tongues and confirming it with miracles is unlawful. Papists, as Bellarmine, Suarez, Acosta, ascribe this to the Pope and his apostles. Our divines answer that the apostles that way have no successors; But what the apostles did by an ordinary pastoral gift, as to preach the Word, administrate the Sacraments, to erect and plant Churches by ordinary gifts, where the pastors can speak to the Churches by an ordinary gift in their own language, they are obliged both within and without the congregation, to preach as pastors, because where God gives gifts pastoral to pastors, he commands them to exercise these gifts, else they dig their Lord’s talent in the earth: but God gives to pastors pastoral gifts to preach to others than their own congregation, and to administrate the seals to them also, and to plant churches. Therefore, it is presumed that the Church does give authority and an external ministerial calling to the exercise of these gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 2, pp. 207-8</span></figcaption>

<blockquote><p>Add unto these a distinction betwixt a congregation lying alone in an island, province or nation, and a congregation bordering with sister churches. If either there be but one congregation in a kingdom or province, or if there be many far distant one from another, so that their pastors and elders cannot ordinarily meet together, then may a particular congregation do many things by itself alone, which it ought not to do where there are adjacent neighbouring congregations, together with which it may and should have a common presbytery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, (1641), p. 43</span></figcaption>

<blockquote><p>But what can be the reason, may some man say, why the Scripture has not itself determined these kinds of assemblies [synods, general assemblies, etc.] particularly? I answer, three reasons may begiven for it:

1. Because it was not necessary, the general rules of the word, together with nature’s light, which directeth commonwealths in things of the same kind, being sufficient to direct the church therein.

2. As seasons and times for the meeting of assemblies , so the just bounds thereof in so many different places of the world are things of that kind which were not determinable in Scripture, unless the world had been filled with volumes thereof; for, individua sunt infinita.

3. Because this constitution of synods, provincial and national, is not universal for all times and places; for example, there may bein a remote island ten or twelve Christian congregations, which, beside their particular elderships, have a common presbytery, but are not capable of synods, either provincial or national. Again, let there be an island containing forty or fifty Christian congregations, there shall be therein, beside presbyteries, one kind of a synod, but not two kinds. Besides, the reformed congregations within a great nation may haply [by chance] be either so few, or so dispersed and distant, or so persecuted, that they can neither have provincial nor national assemblies.</p></blockquote>

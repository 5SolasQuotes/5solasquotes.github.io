<main class="wrap"><figure class="quote" id="q-47e4cec11c" data-kw="">
<blockquote><p>On Purgatory more than on any other subject the evidence of revelations deserves to be listened to, for the whole faith of the Church of Rome on this subject has been built upon revelations, or, as we should call it in plain English, on ghost stories. For hundreds of years the Church seems to have known little or nothing on the subject.</p></blockquote>

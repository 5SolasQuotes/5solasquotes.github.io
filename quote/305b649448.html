<blockquote><p>I conclude with one word: Although the Church may enjoin it on its children, not to maintain free intercourse with any private person who has been cast out of the Church, yet it cannot command subjects to revolt from their Sovereigns when excommunicated; because they are bound to continue rendering the obedience due to them by law natural, civil and divine.</p></blockquote>

<blockquote><p>Section 10. …the house of representatives… each member, before he takes his seat, shall make and subscribe the following declaration, viz: ‘I do believe in one God, the creator and governor of the universe, the rewarder of the good and the punisher of the wicked. And I do acknowledge the Scriptures of the Old and New Testament to be given by Divine inspiration.’ … Section 45. …And all religious societies or bodies of men heretofore united or incorporated for the advancement of religion or learning, or for other pious and charitable purposes, shall be encouraged and protected in the enjoyment of the privileges, immunities and estates which they were accustomed to enjoy, or could of right have enjoyed, under the laws and former constitution of this state.</p></blockquote>

<blockquote><p>There is no part of religion which Satan does not endeavor to destroy under pretense of promoting it: And his way is to overgo Christ and his apostles, and to seem more zealous than ever they were, and to mend their work by doing it better or doing more… Even so when Satan finds that he cannot directly destroy the unity of the Church and bring division into credit, he will be more zealous for unity than Christ Himself: He will then endure no disagreement among Christians, no not in an opinion, nor a form or ceremony; not in meats or drinks or keeping of days, or in judging of things lawful or unlawful, which are not of necessity to the Church’s concord. He is either for tolerating all propagation of heresy and practice of wickedness, or else he is so much for unity, that no difference almost is to be tolerated. For he well knows that while men are imperfect such differences will still be: And then if he can but persuade the world that for concord sake they must not be endured, what follows but that the dissenters must be fined, imprisoned or banished to bring them (or the rest) to unity. And so he will set all the world together by the ears in cruelties and bloodshed and in hating one another, and all under pretense of making them one. You may think that till mankind be all turned bedlams [mental patients], they can never be so cheated by such a gross deceit, nor ever guilty of so mad a work. But what will you say if this be the common case of the far greatest part of the Christian world? And what will you say further, if after above a thousand years’ universal experience of the unhappy success, they continue it still as the only way to unity and peace? Look but about you with opened eyes and see whether it be not so. Were not he a gracious promoter of unity in the world that would say, ‘Unity is so excellent a thing that it is meet we should be all of one complexion, or at least that the world should speak but one language; and therefore no other but one should be tolerated.’ And here how easy is it to dilate of the great inconveniences of many languages: I could write a volume in folio of it myself; and all true and evident. Methinks I see hereupon how these books are scattered and read, and how those called learned men and politicians applaud them, and shake their heads and gnash their teeth at those that would have so great a mischief tolerated: And hereupon they set about the business and desire a law that upon pain of imprisonment and banishment (I know not whither) no one in the world shall speak any other language but one. And now I hope unity will be promoted indeed, when all the world is thus engaged in a war to perfect nature and make men one. But methinks I hear one man that is awake thus bespeak the promoters of this concord: ‘Unity and concord in those points where God has made them necessary, cannot be over-valued’: But yet it is visible that there is a marvelous diversity which nature is delighted in: when of all faces and of all voices, and of all the sorts of animals and plants, there is so discernable a difference: yea of all the millions of stones in the field, no two is perfectly like each other. And where greater unity is most desirable, it must first be considered how much of it is possible or to be hoped for, and next, what are the proper means to attain it. For first, the medicining of all incurable disease, especially with violent physic, is not the way to make it better, but to exasperate it and hasten death, when a palliate and patience might do better. It is very desirable that all the king’s subjects were strong and beautiful and ingenuous and learned, but it is not to be hoped: But that they may be all loyal and honest in their dealing with others may be well endeavored. And secondly, a wrong kind of medicine will much more hasten and ascertain death than to let the disease alone to nature: It is desirable that all the kings subjects be as is said, both wise and learned, yea and perfect in honesty and piety without fault: But if you make a law that for the honor of unity, all that are not learned and perfect in virtue shall be fined, imprisoned or banished, the king nor his subjects will be but little beholden to you for their unity. So one language is very desirable to the world: But first it is not attainable and secondly a law to punish all that speak another language is not the way to procure it; but to set them together by the ears: you must appoint parents and school-masters to teach them all one language by degrees, and keep them to their duties and remove impediments, and thus stay the time; and what cannot this way be attained must not be expected in this world.’ The speech being ended, the hearers derided it and made a law for unity to destroy it, and set every man on hating and fighting against his neighbor, to make all one. It is very desirable that all Christians were perfect in knowledge, gifts and graces, and consequently that there were no different opinions, nor no different forms or modes of worship, but that all were equal to the wisest and to the most sober, pious, zealous and sincere. But if a law be made that none shall be endured in any kingdom that are not of this temperament and stature, the subjects of all princes may soon be numbered. Set parents, school-masters and ministers at work, to make men wiser, and drive them on to diligence in their duty and restrain men from hindering them, and from intolerable wickedness and sin, and patiently expect the success of this: And what this will not do, expect not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 57, ‘Yet let not any here cheat you by overdoing, nor mere names and titles of unity deceive you instead of the thing itself…’, pp. 270-73</span></figcaption>

ontinue+it+still+as+the+only+way+to+unity+and+peace%3F+Look+but+about+you+with+opened+eyes+and+see+whether+it+be+not+so.+Were+not+he+a+gracious+promoter+of+unity+in+the+world+that+would+say%2C+%E2%80%98Unity+is+so+excellent+a+thing+that+it+is+meet+we+should+be+all+of+one+complexion%2C+or+at+least+that+the+world+should+speak+but+one+language%3B+and+therefore+no+other+but+one+should+be+tolerated.%E2%80%99+And+here+how+easy+is+it+to+dilate+of+the+great+inconveniences+of+many+languages%3A+I+could+write+a+volume+in+folio+of+it+myself%3B+and+all+true+and+evident.+Methinks+I+see+hereupon+how+these+books+are+scattered+and+read%2C+and+how+those+called+learned+men+and+politicians+applaud+them%2C+and+shake+their+heads+and+gnash+their+teeth+at+those+that+would+have+so+great+a+mischief+tolerated%3A+And+hereupon+they+set+about+the+business+and+desire+a+law+that+upon+pain+of+imprisonment+and+banishment+%28I+know+not+whither%29+no+one+in+the+world+shall+speak+any+other+language+but+one.+And+now+I+hope+unity+will+be+promoted+indeed%2C+when+all+the+world+is+thus+engaged+in+a+war+to+perfect+nature+and+make+men+one.+But+methinks+I+hear+one+man+that+is+awake+thus+bespeak+the+promoters+of+this+concord%3A+%E2%80%98Unity+and+concord+in+those+points+where+God+has+made+them+necessary%2C+cannot+be+over-valued%E2%80%99%3A+But+yet+it+is+visible+that+there+is+a+marvelous+diversity+which+nature+is+delighted+in%3A+when+of+all+faces+and+of+all+voices%2C+and+of+all+the+sorts+of+animals+and+plants%2C+there+is+so+discernable+a+difference%3A+yea+of+all+the+millions+of+stones+in+the+field%2C+no+two+is+perfectly+like+each+other.+And+where+greater+unity+is+most+desirable%2C+it+must+first+be+considered+how+much+of+it+is+possible+or+to+be+hoped+for%2C+and+next%2C+what+are+the+proper+means+to+attain+it.+For+first%2C+the+medicining+of+all+incurable+disease%2C+especially+with+violent+physic%2C+is+not+the+way+to+make+it+better%2C+but+to+exasperate+it+and+hasten+death%2C+when+a+palliate+and+patience+might+do+better.+It+is+very+desirable+that+all+the+king%E2%80%99s+subjects+were+strong+and+beautiful+and+ingenuous+and+learned%2C+but+it+is+not+to+be+hoped%3A+But+that+they+may+be+all+loyal+and+honest+in+their+dealing+with+others+may+be+well+endeavored.+And+secondly%2C+a+wrong+kind+of+medicine+will+much+more+hasten+and+ascertain+death+than+to+let+the+disease+alone+to+nature%3A+It+is+desirable+that+all+the+kings+subjects+be+as+is+said%2C+both+wise+and+learned%2C+yea+and+perfect+in+honesty+and+piety+without+fault%3A+But+if+you+make+a+law+that+for+the+honor+of+unity%2C+all+that+are+not+learned+and+perfect+in+virtue+shall+be+fined%2C+imprisoned+or+banished%2C+the+king+nor+his+subjects+will+be+but+little+beholden+to+you+for+their+unity.+So+one+language+is+very+desirable+to+the+world%3A+But+first+it+is+not+attainable+and+secondly+a+law+to+punish+all+that+speak+another+language+is+not+the+way+to+procure+it%3B+but+to+set+them+together+by+the+ears%3A+you+must+appoint+parents+and+school-masters+to+teach+them+all+one+language+by+degrees%2C+and+keep+them+to+their+duties+and+remove+impediments%2C+and+thus+stay+the+time%3B+and+what+cannot+this+way+be+attained+must+not+be+expected+in+this+world.%E2%80%99+The+speech+being+ended%2C+the+hearers+derided+it+and+made+a+law+for+unity+to+destroy+it%2C+and+set+every+man+on+hating+and+fighting+against+his+neighbor%2C+to+make+all+one.+It+is+very+desirable+that+all+Christians+were+perfect+in+knowledge%2C+gifts+and+graces%2C+and+consequently+that+there+were+no+different+opinions%2C+nor+no+different+forms+or+modes+of+worship%2C+but+that+all+were+equal+to+the+wisest+and+to+the+most+sober%2C+pious%2C+zealous+and+sincere.+But+if+a+law+be+made+that+none+shall+be+endured+in+any+kingdom+that+are+not+of+this+temperament+and+stature%2C+the+subjects+of+all+princes+may+soon+be+numbered.+Set+parents%2C+school-masters+and+ministers+at+work%2C+to+make+men+wiser%2C+and+drive+them+on+to+diligence+in+their+duty+and+restrain+men+from+hindering+them%2C+and+from+intolerable+wickedness+and+sin%2C+and+patiently+expect+the+success+of+this%3A+And+what+this+will+not+do%2C+expect+not.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Cure+of+Church+Divisions%E2%80%A6+%28London%2C+1670%29%2C+pt.+1%2C+Direction+57%2C+%E2%80%98Yet+let+not+any+here+cheat+you+by+overdoing%2C+nor+mere+names+and+titles+of+unity+deceive+you+instead+of+the+thing+itself%E2%80%A6%E2%80%99%2C+pp.+270-73&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fda5bda3de4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/da5bda3de4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/toleration/#:~:text=There%20is%20no%20part%20of%20religion,this%20will%20not%20do%2C%20expect%20not&amp;text=There%20is%20no%20part%20of%20religion%20which%20Satan&amp;text=And%20what%20this%20will%20not%20do%2C%20expect%20not" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>XII. The [House of] representatives… shall each of them… before he takes his seat, shall make and subscribe the following declaration, viz. You do believe in one God, the Creator and Governor of the Universe, the rewarder of the good, and punisher of the wicked. And you do acknowledge the scriptures of the Old and New Testament to be given by divine inspiration; and own and profess the Protestant religion. … XXXVIII. …And all religious societies, or bodies of men, that may be hereafter united or incorporated, for the advancement of religion and learning, or for other pious and charitable purposes, shall be encouraged and protected in the enjoyment of the privileges, immunities and estates, which they in justice ought to enjoy, under such regulations as the General Assembly of this State shall direct.</p></blockquote>

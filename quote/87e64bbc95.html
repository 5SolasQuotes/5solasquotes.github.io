<main class="wrap"><figure class="quote" id="q-87e64bbc95" data-kw="">
<blockquote><p>An intention or a conscious goal is that which an agent aims to accomplish and the means are that which is used for attaining the intention. When the agent acts according to its nature, then the end of the action and the end of the agent is one and the same. But when the means are not fitted for the intentional end, then a distinction must be inferred between the end of the action and the end of the agent; between the intention and the intender. Now, the doctrine of divine simplicity implies that in God intention and Intender—act and Agent—cannot be other than one and the same. In humans intention and intender—acts and agents—may not be one and the same. In God the means for attaining the salvation of the elect are not, indeed cannot, be disproportionate to that end. There cannot be conditions—conditional redemption—to God. For according to the doctrine of divine simplicity, each thing is related to God, but God is not (reciprocally) related to anything. Yet, universalism anthropomorphically pictures God as using means that are not proportionate to the end and assumes that there is one intention in some salvific act and another intention in some other salvific act. Particularism upholds the doctrine of simplicity and consistently maintains the otherness of God in intending to save humans in Christ. Every salvific action of God is particular in intention, since in God intention and Intender cannot be other than one and the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sebastian-rehnman.html">Sebastian Rehnman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Particular Defence of Particularism’ Ref in Journal of Reformed Theology, vol. 6, issue 1 (2012)</cite>, pp. 24–34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-52c14a01f6" data-kw="">
<blockquote><p>Whether Christ actually expiated and satisfied for our sins? It is affirmed contra the Socinians. Whether such an expiation was necessary? It is affirmed contra the Socinians. Whether it was a full and total expiation? It is affirmed. Whether it is able to be said Christ according to each nature was a sacrifice and victim? It is denied. Whether his oblation of Himself was properly a victim? It is affirmed. Whether therefore passions ought not to be referred to the sacrifice and victim? It is affirmed. Whether the whole passive obedience of Christ is able to be called a victim and sacrifice? It is denied with a distinction. Whether that dignity, by which the death of Christ redounds dignity and efficacy, so it is a ransom (lutron), is able to be called part of the victim? It is distinguished. Whether the divine nature was the altar, or indeed the sign of the cross was? The former is affirmed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems (Utrecht, 1643), pt. 1, section 2 Abbr. | tract 2 | Of the First Part, or of the Act: The Sacrifice of the Priestly Office, even the Full Satisfaction &amp; Expiation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“Whether Christ actually expiated and satisfied for our sins? It is affirmed contra the Socinians. Whether such an expiation was necessary? It is affirmed contra the Socinians. Whether it was a full and total expiation? It is affirmed. Whether it is able to be said Christ according to each nature was a sacrifice and victim? It is denied. Whether his oblation of Himself was properly a victim? It is affirmed. Whether therefore passions ought not to be referred to the sacrifice and victim? It is affirmed. Whether the whole passive obedience of Christ is able to be called a victim and sacrifice? It is denied with a distinction. Whether that dignity, by which the death of Christ redounds dignity and efficacy, so it is a ransom (lutron), is able to be called part of the victim? It is distinguished. Whether the divine nature was the altar, or indeed the sign of the cross was? The former is affirmed.”

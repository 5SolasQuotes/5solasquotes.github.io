<main class="wrap"><figure class="quote" id="q-6ef1659461" data-kw="" data-pol="">
<blockquote><p>Grace is unmerited favor; and the grace or favor of God is the source of all good. Peace, according to the usage of the corresponding Hebrew word, means well-being in general. It comprehends all blessings flowing from the goodness of God. The apostle prays to Christ, and seeks from him blessings which God only can bestow. Christ therefore was to him the object of habitual worship. He lived in communion with Christ as a divine person, the ground of his confidence and the source of all good.</p></blockquote>
<figcaption>— <a href="../authors/charles-hodge.html">Charles Hodge</a>, <cite>A Commentary on the Epistle to the Ephesians</cite>, on 1:2</figcaption>
<div class="meta"><a class="tag" href="../topics/god/mercy-and-grace.html">Mercy &amp; Grace</a></div>

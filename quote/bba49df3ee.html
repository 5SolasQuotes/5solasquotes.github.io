<main class="wrap"><figure class="quote" id="q-bba49df3ee" data-kw="">
<blockquote><p>For I confess to your Charity that I have learned to yield this respect and honour only to the canonical books of Scripture: of these alone do I most firmly believe that the authors were completely free from error. And if in these writings I am perplexed by anything which appears to me opposed to truth, I do not hesitate to suppose that either the manuscript is faulty, or the translator has not caught the meaning of what was said, or I myself have failed to understand it. As to all other writings, in reading them, however great the superiority of the authors to myself in sanctity and learning, I do not accept their teaching as true on the mere ground of the opinion being held by them; but only because they have succeeded in convincing my judgment of its truth either by means of these canonical writings themselves, or by arguments addressed to my reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 82 (to Jerome)</cite>, §3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3f70548235" data-kw="">
<blockquote><p>In other words, if faith depends upon the word of God alone, if it regards and reclines on it alone, what place is left for any word of man? … God deprives man of the power of producing any new doctrine, in order that he alone may be our master in spiritual teaching, as he alone is true, and can neither lie nor deceive.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.8.9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span><span class="t"><a href="../topics/holy-scripture/divine-authority.html">Divine Authority</a></span></div>

</figure><figure class="quote" id="q-57765b3c9f" data-kw="">
<blockquote><p>The sufficiency of the Bible means its sole sufficiency. It is sufficient to achieve the purposes of redemptive revelation without supplementation by new revelations (claimed by some Anabaptists and others) or traditions of men (like those extra-biblical traditions claimed by the Roman Catholic church). It is this and no other view of the sufficiency of the Scriptures which must now be demonstrated.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The sufficiency of the Bible means its sole sufficiency. It is sufficient to achieve the purposes of redemptive revelation without supplementation by new revelations (claimed by some Anabaptists and others) or traditions of men (like those extra-biblical traditions claimed by the Roman Catholic church). It is this and no other view of the sufficiency of the Scriptures which must now be demonstrated.”

— Samuel E. Waldron, A Modern Exposition of the 1689 Baptist Confession of Faith, ch. 1, p. 53">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+sufficiency+of+the+Bible+means+its+sole+sufficiency.+It+is+sufficient+to+achieve+the+purposes+of+redemptive+revelation+without+supplementation+by+new+revelations+%28claimed+by+some+Anabaptists+and+others%29+or+traditions+of+men+%28like+those+extra-biblical+traditions+claimed+by+the+Roman+Catholic+church%29.+It+is+this+and+no+other+view+of+the+sufficiency+of+the+Scriptures+which+must+now+be+demonstrated.%E2%80%9D%0A%0A%E2%80%94+Samuel+E.+Waldron%2C+A+Modern+Exposition+of+the+1689+Baptist+Confession+of+Faith%2C+ch.+1%2C+p.+53&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F57765b3c9f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/57765b3c9f.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-da71c1ee94" data-kw="">
<blockquote><p>That the Scriptures are the supreme &quot;judge&quot; in all controversies concerning religion. The authority of the Scriptures as the ultimate rule of faith rests alone in the fact that they are the Word of God. Since all these writings are one revelation, and the only revelation of his will concerning religion given by God to men, it follows: … That they are complete as a revelation in themselves, and are not to be supplemented or explained by light drawn from any other source.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, ch. 1, §§ 9–10</span></figcaption>

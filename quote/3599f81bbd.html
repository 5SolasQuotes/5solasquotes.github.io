<blockquote><p>The sum of the gospel, or covenant of grace and reconciliation, is this: “If thou flee from deserved wrath to the true Redeemer Jesus Christ, (who is able to save to the uttermost all that come to God through him,) thou shalt not perish, but have eternal life.” Rom 10:8,9,11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson-james-durham.html">David Dickson &amp; James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Saving Knowledge</cite>, (Edinburgh, 1650; repr. Crown &amp; Covenant Publications, 2022), 14.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d8fb1313fc" data-kw="">
<blockquote><p>And O how He ‘travails in the greatness of his strength, mighty to save! able to save to the uttermost them that come unto God by Him.’ O His infinite willingness to save us! how deeply marked in words, in oaths, in cries, in tears, in sighs, in groans, in blood, in death of an expiring God! He ‘comes in the name of the Lord to save us–to seek and to save that which was lost; and him that comes unto Him, He will in no wise cast out;’ all day long He stretches out his hands to invite and receive a disobedient and gainsaying people. Now the Master comes! knocks at the door of thy heart, and calls for you:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Appendix, “An Address to the Rising Generation” in Two Short Catechisms Mutually Connected</cite>, (Edinburgh: 1769), as in Addresses to Children Concerning Salvation (Torwood Press, 2013), pp. 9-15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-fbbed27789" data-kw="">
<blockquote><p>And this doth and must determine the difference between the Jews and Christians about the promises of the Old Testament. They are all made unto the church. No individual person hath any interest in them but by virtue of his membership therewith. This church is, and always was, one and the same. With whomsoever it remains, the promises are theirs; and that not by implication or analogy, but directly and properly. They belong as immediately, at this day, either to the Jews or Christians, as they did of old to any. The question is, With whom is this church, founded on the promised Seed in the covenant? This is Zion, Jerusalem, Israel, Jacob, the temple of God. The Jews plead that it is with them, because they are the children of Abraham according to the flesh. Christians tell them that their privilege on this account was of another nature, and ended with the coming of the Messiah; that the church unto whom all the promises belong are only those who are heirs of Abraham’s faith, believing as he did, and thereby interested in his covenant. Not as though the promise made to Abraham were of none effect; for as it was made good unto his carnal seed in the exhibition of the Messiah, so the spiritual privileges of it belonged only unto those of the Jews and Gentiles in whom God had graciously purposed to effect the faith of Abraham. Thus was and is the church, whereunto all the promises belong, still one and the same, namely, Abraham’s children according to the faith: and among those promises this is one, that God will be a God unto them and their seed for ever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 1.124.</span></figcaption>

<blockquote><p>If God’s love is known by what it hates, it is also known by what it loves or inclines toward. First, in a sense, it extends to all creatures. All creatures have some good from God.136 Even the wicked share in this benevolence. “God is kind to the unthankful and evil.”137 Man is now naturally contrary to God and positively evil, but the Luke 6:35 sermon shows that God still loves him in some ways. Indeed, Edwards goes on to say in another sermon: “even in damnation.”138 Yet, fundamentally, “holy persons love holy things for their holiness.”139 136. Unpublished MS sermon on Ps. 145:15–21, “All creatures in heaven and earth have their good things from God,” p. 1, St. Ind., Nov. 1, 1753.

137. Unpublished MS sermon on Lk. 6:35.

138. Unpublished MS sermon on Eph. 4:15–16, “In a company of Christians among whom Christianity has its genuine effect, love is the beginning and love is the middle and love is the end of all their affairs,” p. 2, May 1743.

139. Unpublished MS sermons on Ps. 119:[1]40.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rational Biblical Theology of Jonathan Edwards</cite>, 3 vols. (Powhatan, VA: Berea Publications; Orlando, FL: Ligonier Ministries, 1993), vol. 2, p. 38</span></figcaption>

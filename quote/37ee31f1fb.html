<blockquote><p>The Revd Robert Craig of Rothesay was one of the Disruption Worthies who formed the Free Church of Scotland in 1843. Unlike others in the Free Church at that time, Craig had a very high view of the Old Testament judicials (as subsequent posts will demonstrate). However, early on in his discussion of the judicial law he reminds us that the penalties which men implement against crime must conform to those which God has prescribed:

The expressions of the will of human power are to be found in laws to which penalties for transgression are annexed. These laws and penalties ought, unquestionably, to be derived from, and in harmony with, the laws and penalties which God has promulgated, and carries into execution in his own government of the world. By human governments, those ought to be held, as well-doers or evil-doers, who are so reckoned by him. Rulers among men are, therefore, to be “a terror to evil-doers, and a praise to them that do well;” otherwise there is tyranny, or anarchy, abhorrent both to God and man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-craig.html">Robert Craig</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theocracy or the principles of the Jewish religion and polity adapted to all nations and times</cite>, (Edinburgh, 1848), p. 279.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-53e6cb8cf2" data-kw="">
<blockquote><p>The picture of a church much more concerned with carrying out its routine functions than with controversy is confirmed by W. R. Foster… Such studies, concentrating on the day to day life of the church and the extent of compromise, co-operation and continuity, undoubtedly provide a more accurate picture of the church as contemporaries saw it, and worked and worshipped in it, than sectarian histories which imply constant and bitter controversy at all levels. But it is worth suggesting that this tendency to concentrate on the positive elements of the church and on its routine functioning has gone too far; from too much emphasis on controversy the pendulum has swung so far that there is a tendency to ignore the controversy, that undoubtedly did exist. Foster’s “church before the covenants” seems so placid and united that the reader is left bewildered; the covenants evidently explode like a great storm suddenly appearing when the sky is clear and blue, and no attempt is made to explain the explosion. Controversial topics are played down or ignored; little is said about worship, almost nothing about theology. The new prayer book of 1637 which sparked off revolt is not mentioned in a book purporting to cover the period up to 1638; nor is the emergence of Arminianism in Scotland, undermining Calvinist orthodoxy and producing new tensions. Thus Foster’s book really only deals with some aspects of the church; what it does do, it does very well, but though it tells the truth it does not attempt to tell the whole truth.” – David Stevenson, “Scottish Church History, 1600-1660, a Select Critical Bibliography” (1982), p. 211 . On the Late-1600’s Articles Raffe, Alexander – pp. 180-188 of The Culture of Controversy: Religious Arguments in Scotland, 1660-1714 (Boydell Press, 2012) ToC McDougall: “Raffe outlined three tenets of partial conformity [for laymen]: avoidance of regular attendance at services given by conformist ministers; hearing sermons in parishes in other towns; and refusal to receive the sacraments from a conformist minister. This chapter will reveal a broader range of ways in which ministers and the laity could avoid conforming to Episcopacy without separating from the church entirely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/w-roland-foster.html">W. Roland Foster</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church before the Covenants. The Church of Scotland</cite>, 1596-1638, p. 142</span></figcaption>

<blockquote><p>Yea further, times and places which are applied to the worship of God as circumstances only for outward order and policy may be by a private Christian applied to a civil use, for in so doing he breaks not the ordinance of the Church: For example, material churches are appointed to be the receptacles of Christian assemblies, and that only for such common commodity and decency, which has place as well in civil as in holy meetings, and not for any holiness conceived to be in them more than in other houses. Now if I be standing in a churchyard when it rains, may not I go into the church that I may be defended from the injury of the weather? If I must meet with certain men for putting order to some of my worldly affairs, and it fall out that we cannot conveniently meet in any part but in the church, may we not there keep our tryst? A material church then may serve for a civil use, the same way that it serves to a holy use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 1, ‘That the Ceremonies are Unlawful, because superstitious…’, pp. 11-12</span></figcaption>

<blockquote><p>His [Knewstubs’s] objection against the cross consisted of three interrogatories: 1. Whether the Church had power to institute an external significant sign? To which was replied: First, that he did mistake the use of the cross with us, which was not used in baptism any otherwise than only as a ceremony. Secondly, by their own example, who make imposition of hands in their ordination of pastors to be a sign significant. Thirdly, in prayer, says the Bishop of Winton, the kneeling on the ground, the lifting up of our hands, the knocking of our breasts are ceremonies significant: the first, of our humility coming before the mighty God, the second, of our confidence and hope, the other of our sorrow and detestation of our sins, and these are, and may lawfully be used. Lastly, M. Deane of the chapel, remembered the practice of the Jews, who unto the institution of the Passeover, prescribed unto them by Moses, had as the rabbins witness added both signs and words, eating sour herbs and drinking wine, with these words to both, ‘Take, and eat these in remembrance, etc. Drink this in remembrance, etc.’ Upon which addition and tradition of theirs, our Sauiour instituted the sacrament of his Last Supper, in celebrating it with the same words and after the same manner; thereby approving that fact of theirs in particular; and generally, that a Church may institute and retain a sign significant: which satisfied his Maiesty exceeding well. And here the king desired, to have himself made acquainted about the antiquity of the use of the cross. Which Doctor [John] Reynolds confessed to have been ever since the apostles times, but this was the difficulty, to prove it of that ancient use in baptism… it fell from one, I think it was my Lord of Winchester, obiter, to say, that, in Constantine’s time it was used in baptism. What, quoth the King, and is it now come to that pass that we shall appeach Constantine of Popery and superstition; if then it were used, says his Majesty, I see no reason but that still we may continue it. Mr. Knewstubs’s second question was that, put [the] case [that] the Church had such power to add significant signs, whether it might there add them where Christ had already ordained one; which he said, was no less derogatory to Christ’s institution, as he thought, than if any potentate of this land should presume to add his seal unto the great seal of England. To which his Majesty answered that the case was not alike, for that no sign or thing was added to the sacrament, which was fully and perfectly finished, before any mention of the cross is made; for confirmation whereof, he willed the place to be read [in the Book of Common Prayer]. Lastly, if the Church had that power also, yet the greatest scruple to their conscience was, how far such an ordinance of the Church was to bind them, without impeaching their Christian liberty? Whereat the king, as it seemed, was much moved, and tolde him he would not argue that point with him, but answer therein as kings are wont to speak in Parliament, Le Roy J’auisera: adding withall, that it smelled very rankly of Anabaptism: comparing it unto the usage of a beardless boy (one Mr. John Black) who the last Conference his Majesty had with the ministers in Scotland (in December, 1602) told him that he would hold conformity with his Majesty’s ordinances for matters of doctrine: but for matters of ceremony, they were to be left in Christian liberty unto every man as he received more and more light from the illumination of God’s Spirit; even till they go mad, quoth the king, with their own light: but I will none of that, I will have one doctrine and one discipline, one religion in substance, and in ceremony: and therefore I charge you, never speak more to that point (how far you are bound to obey?) when the Church has ordained it. And so asked them again, if they had anything else to say? Dr. Reynolds objected the example of the brasen serpent, demolished and stamped to powder by Ezekiel, because the people abused it to idolatry: wishing, that, in like sort, the cross should be abandoned, because in the time of Popery it had been superstitiously abused. Whereunto the King’s Majesty answered diverse ways. First, quoth he, though I be sufficiently persuaded of the cross in baptism, and the commendable use thereof in the Church so long: yet, if there were nothing else to move me, this very argument were an inducement to me for the retaining of it, as it is now by order established: For, inasmuch, as it was abused, so you say, to superstition in time of popery, it does plainly imply, that it was well used before Popery. I will tell you, I haue lived among this [dissenting] sort of men (speaking to the lords and bishops) ever since I was ten years old, but I may say of myself as Christ did of Himself: Though I lived amongst them, yet since I had ability to judge, I was never of them; neither did anything make me more to condemn and detest their courses than that they did so peremptorily disallow of all things which at all had been used in Popery. For my part, I know not how to answer the objection of the Papists, when they charge us with novelties: but truly to tell them that their abuses are new, but the things which they abused we retain in their primitive use, and forsake only the novel corruption. By this argument we might renounce the Trinity and all that is holy, because it was abused in Popery (and speaking to Doctor Reynolds merely) they used to wear hose and shoes in Popery, therefore, you shall, now, go barefoot. Secondly, quoth his Majesty, what resemblance is there between the brazen serpent, a material visible thing, and the sign of the cross made in the air? Thirdly, I am given to understand by the bishops, and I find it true, that the Papists themselves did never ascribe any power or spiritual grace to the sign of the cross in baptism. Fourthly, you see, that the material crosses, which in time of Popery were made, for men to fall down before them, as they passed by them, to worship them (as the idolatrous Jews did the brazen serpent) are demolished, as you desire.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“His [Knewstubs’s] objection against the cross consisted of three interrogatories: 1. Whether the Church had power to institute an external significant sign? To which was replied: First, that he did mistake the use of the cross with us, which was not used in baptism any otherwise than only as a ceremony. Secondly, by their own example, who make imposition of hands in their ordination of pastors to be a sign significant. Thirdly, in prayer, says the Bishop of Winton, the kneeling on the ground, the lifting up of our hands, the knocking of our breasts are ceremonies significant: the first, of our humility coming before the mighty God, the second, of our confidence and hope, the other of our sorrow and detestation of our sins, and these are, and may lawfully be used. Lastly, M. Deane of the chapel, remembered the practice of the Jews, who unto the institution of the Passeover, prescribed unto them by Moses, had as the rabbins witness added both signs and words, eating sour herbs and drinking wine, with these words to both, ‘Take, and eat these in remembrance, etc. Drink this in remembrance, etc.’ Upon which addition and tradition of theirs, our Sauiour instituted the sacrament of his Last Supper, in celebrating it with the same words and after the same manner; thereby approving that fact of theirs in particular; and generally, that a Church may institute and retain a sign significant: which satisfied his Maiesty exceeding well. And here the king desired, to have himself made acquainted about the antiquity of the use of the cross. Which Doctor [John] Reynolds confessed to have been ever since the apostles times, but this was the difficulty, to prove it of that ancient use in baptism… it fell from one, I think it was my Lord of Winchester, obiter, to say, that, in Constantine’s time it was used in baptism. What, quoth the King, and is it now come to that pass that we shall appeach Constantine of Popery and superstition; if then it were used, says his Majesty, I see no reason but that still we may continue it. Mr. Knewstubs’s second question was that, put [the] case [that] the Church had such power to add significant signs, whether it might there add them where Christ had already ordained one; which he said, was no less derogatory to Christ’s institution, as he thought, than if any potentate of this land should presume to add his seal unto the great seal of England. To which his Majesty answered that the case was not alike, for that no sign or thing was added to the sacrament, which was fully and perfectly finished, before any mention of the cross is made; for confirmation whereof, he willed the place to be read [in the Book of Common Prayer]. Lastly, if the Church had that power also, yet the greatest scruple to their conscience was, how far such an ordinance of the Church was to bind them, without impeaching their Christian liberty? Whereat the king, as it seemed, was much moved, and tolde him he would not argue that point with him, but answer therein as kings are wont to speak in Parliament, Le Roy J’auisera: adding withall, that it smelled very rankly of Anabaptism: comparing it unto the usage of a beardless boy (one Mr. John Black) who the last Conference his Majesty had with the ministers in Scotland (in December, 1602) told him that he would hold conformity with his Majesty’s ordinances for matters of doctrine: but for matters of ceremony, they were to be left in Christian liberty unto every man as he received more and more light from the illumination of God’s Spirit; even till they go mad, quoth the king, with their own light: but I will none of that, I will have one doctrine and one discipline, one religion in substance, and in ceremony: and therefore I charge you, never speak more to that point (how far you are bound to obey?) when the Church has ordained it. And so asked them again, if they had anything else to say? Dr. Reynolds objected the example of the brasen serpent, demolished and stamped to powder by Ezekiel, because the people abused it to idolatry: wishing, that, in like sort, the cross should be abandoned, because in the time of Popery it had been superstitiously abused. Whereunto the King’s Majesty answered diverse ways. First, quoth he, though I be sufficiently persuaded of the cross in baptism, and the commendable use thereof in the Church so long: yet, if there were nothing else to move me, this very argument were an inducement to me for the retaining of it, as it is now by order established: For, inasmuch, as it was abused, so you say, to superstition in time of popery, it does plainly imply, that it was well used before Popery. I will tell you, I haue lived among this [dissenting] sort of men (speaking to the lords and bishops) ever since I was ten years old, but I may say of myself as Christ did of Himself: Though I lived amongst them, yet since I had ability to judge, I was never of them; neither did anything make me more to condemn and detest their courses than that they did so peremptorily disallow of all things which at all had been used in Popery. For my part, I know not how to answer the objection of the Papists, when they charge us with novelties: but truly to tell them that their abuses are new, but the things which they abused we retain in their primitive use, and forsake only the novel corruption. By this argument we might renounce the Trinity and all that is holy, because it was abused in Popery (and speaking to Doctor Reynolds merely) they used to wear hose and shoes in Popery, therefore, you shall, now, go barefoot. Secondly, quoth his Majesty, what resemblance is there between the brazen serpent, a material visible thing, and the sign of the cross made in the air? Thirdly, I am given to understand by the bishops, and I find it true, that the Papists themselves did never ascribe any power or spiritual grace to the sign of the cross in baptism. Fourthly, you see, that the material crosses, which in time of Popery were made, for men to fall down before them, as they passed by them, to worship them (as the idolatrous Jews did the brazen serpent) are demolished, as you desire.”

— King James I, Other citations (work not named), ed. William Barlow, The Sum &amp; Substance of the Conference which it pleased his excellent Majesty to have with the Lords, Bishops &amp; other of his Clergy… at Hampton Court, January 14, 1603 (London: Windet, 1604), 2nd Day, pp. 67-74">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHis+%5BKnewstubs%E2%80%99s%5D+objection+against+the+cross+consisted+of+three+interrogatories%3A+1.+Whether+the+Church+had+power+to+institute+an+external+significant+sign%3F+To+which+was+replied%3A+First%2C+that+he+did+mistake+the+use+of+the+cross+with+us%2C+which+was+not+used+in+baptism+any+otherwise+than+only+as+a+ceremony.+Secondly%2C+by+their+own+example%2C+who+make+imposition+of+hands+in+their+ordination+of+pastors+to+be+a+sign+significant.+Thirdly%2C+in+prayer%2C+says+the+Bishop+of+Winton%2C+the+kneeling+on+the+ground%2C+the+lifting+up+of+our+hands%2C+the+knocking+of+our+breasts+are+ceremonies+significant%3A+the+first%2C+of+our+humility+coming+before+the+mighty+God%2C+the+second%2C+of+our+confidence+and+hope%2C+the+other+of+our+sorrow+and+detestation+of+our+sins%2C+and+these+are%2C+and+may+lawfully+be+used.+Lastly%2C+M.+Deane+of+the+chapel%2C+remembered+the+practice+of+the+Jews%2C+who+unto+the+institution+of+the+Passeover%2C+prescribed+unto+them+by+Moses%2C+had+as+the+rabbins+witness+added+both+signs+and+words%2C+eating+sour+herbs+and+drinking+wine%2C+with+these+words+to+both%2C+%E2%80%98Take%2C+and+eat+these+in+remembrance%2C+etc.+Drink+this+in+remembrance%2C+etc.%E2%80%99+Upon+which+addition+and+tradition+of+theirs%2C+our+Sauiour+instituted+the+sacrament+of+his+Last+Supper%2C+in+celebrating+it+with+the+same+words+and+after+the+same+manner%3B+thereby+approving+that+fact+of+theirs+in+particular%3B+and+generally%2C+that+a+Church+may+institute+and+retain+a+sign+significant%3A+which+satisfied+his+Maiesty+exceeding+well.+And+here+the+king+desired%2C+to+have+himself+made+acquainted+about+the+antiquity+of+the+use+of+the+cross.+Which+Doctor+%5BJohn%5D+Reynolds+confessed+to+have+been+ever+since+the+apostles+times%2C+but+this+was+the+difficulty%2C+to+prove+it+of+that+ancient+use+in+baptism%E2%80%A6+it+fell+from+one%2C+I+think+it+was+my+Lord+of+Winchester%2C+obiter%2C+to+say%2C+that%2C+in+Constantine%E2%80%99s+time+it+was+used+in+baptism.+What%2C+quoth+the+King%2C+and+is+it+now+come+to+that+pass+that+we+shall+appeach+Constantine+of+Popery+and+superstition%3B+if+then+it+were+used%2C+says+his+Majesty%2C+I+see+no+reason+but+that+still+we+may+continue+it.+Mr.+Knewstubs%E2%80%99s+second+question+was+that%2C+put+%5Bthe%5D+case+%5Bthat%5D+the+Church+had+such+power+to+add+significant+signs%2C+whether+it+might+there+add+them+where+Christ+had+already+ordained+one%3B+which+he+said%2C+was+no+less+derogatory+to+Christ%E2%80%99s+institution%2C+as+he+thought%2C+than+if+any+potentate+of+this+land+should+presume+to+add+his+seal+unto+the+great+seal+of+England.+To+which+his+Majesty+answered+that+the+case+was+not+alike%2C+for+that+no+sign+or+thing+was+added+to+the+sacrament%2C+which+was+fully+and+perfectly+finished%2C+before+any+mention+of+the+cross+is+made%3B+for+confirmation+whereof%2C+he+willed+the+place+to+be+read+%5Bin+the+Book+of+Common+Prayer%5D.+Lastly%2C+if+the+Church+had+that+power+also%2C+yet+the+greatest+scruple+to+their+conscience+was%2C+how+far+such+an+ordinance+of+the+Church+was+to+bind+them%2C+without+impeaching+their+Christian+liberty%3F+Whereat+the+king%2C+as+it+seemed%2C+was+much+moved%2C+and+tolde+him+he+would+not+argue+that+point+with+him%2C+but+answer+therein+as+kings+are+wont+to+speak+in+Parliament%2C+Le+Roy+J%E2%80%99auisera%3A+adding+withall%2C+that+it+smelled+very+rankly+of+Anabaptism%3A+comparing+it+unto+the+usage+of+a+beardless+boy+%28one+Mr.+John+Black%29+who+the+last+Conference+his+Majesty+had+with+the+ministers+in+Scotland+%28in+December%2C+1602%29+told+him+that+he+would+hold+conformity+with+his+Majesty%E2%80%99s+ordinances+for+matters+of+doctrine%3A+but+for+matters+of+ceremony%2C+they+were+to+be+left+in+Christian+liberty+unto+every+man+as+he+received+more+and+more+light+from+the+illumination+of+God%E2%80%99s+Spirit%3B+even+till+they+go+mad%2C+quoth+the+king%2C+with+their+own+light%3A+but+I+will+none+of+that%2C+I+will+have+one+doctrine+and+one+discipline%2C+one+religion+in+substance%2C+and+in+ceremony%3A+and+therefore+I+charge+you%2C+never+speak+more+to+that+point+%28how+far+you+are+bound+to+obey%3F%29+when+the+Church+has+ordained+it.+And+so+asked+them+again%2C+if+they+had+anything+else+to+say%3F+Dr.+Reynolds+objected+the+example+of+the+brasen+serpent%2C+demolished+and+stamped+to+powder+by+Ezekiel%2C+because+the+people+abused+it+to+idolatry%3A+wishing%2C+that%2C+in+like+sort%2C+the+cross+should+be+abandoned%2C+because+in+the+time+of+Popery+it+had+been+superstitiously+abused.+Whereunto+the+King%E2%80%99s+Majesty+answered+diverse+ways.+First%2C+quoth+he%2C+though+I+be+sufficiently+persuaded+of+the+cross+in+baptism%2C+and+the+commendable+use+thereof+in+the+Church+so+long%3A+yet%2C+if+there+were+nothing+else+to+move+me%2C+this+very+argument+were+an+inducement+to+me+for+the+retaining+of+it%2C+as+it+is+now+by+order+established%3A+For%2C+inasmuch%2C+as+it+was+abused%2C+so+you+say%2C+to+superstition+in+time+of+popery%2C+it+does+plainly+imply%2C+that+it+was+well+used+before+Popery.+I+will+tell+you%2C+I+haue+lived+among+this+%5Bdissenting%5D+sort+of+men+%28speaking+to+the+lords+and+bishops%29+ever+since+I+was+ten+years+old%2C+but+I+may+say+of+myself+as+Christ+did+of+Himself%3A+Though+I+lived+amongst+them%2C+yet+since+I+had+ability+to+judge%2C+I+was+never+of+them%3B+neither+did+anything+make+me+more+to+condemn+and+detest+their+courses+than+that+they+did+so+peremptorily+disallow+of+all+things+which+at+all+had+been+used+in+Popery.+For+my+part%2C+I+know+not+how+to+answer+the+objection+of+the+Papists%2C+when+they+charge+us+with+novelties%3A+but+truly+to+tell+them+that+their+abuses+are+new%2C+but+the+things+which+they+abused+we+retain+in+their+primitive+use%2C+and+forsake+only+the+novel+corruption.+By+this+argument+we+might+renounce+the+Trinity+and+all+that+is+holy%2C+because+it+was+abused+in+Popery+%28and+speaking+to+Doctor+Reynolds+merely%29+they+used+to+wear+hose+and+shoes+in+Popery%2C+therefore%2C+you+shall%2C+now%2C+go+barefoot.+Secondly%2C+quoth+his+Majesty%2C+what+resemblance+is+there+between+the+brazen+serpent%2C+a+material+visible+thing%2C+and+the+sign+of+the+cross+made+in+the+air%3F+Thirdly%2C+I+am+given+to+understand+by+the+bishops%2C+and+I+find+it+true%2C+that+the+Papists+themselves+did+never+ascribe+any+power+or+spiritual+grace+to+the+sign+of+the+cross+in+baptism.+Fourthly%2C+you+see%2C+that+the+material+crosses%2C+which+in+time+of+Popery+were+made%2C+for+men+to+fall+down+before+them%2C+as+they+passed+by+them%2C+to+worship+them+%28as+the+idolatrous+Jews+did+the+brazen+serpent%29+are+demolished%2C+as+you+desire.%E2%80%9D%0A%0A%E2%80%94+King+James+I%2C+Other+citations+%28work+not+named%29%2C+ed.+William+Barlow%2C+The+Sum+%26+Substance+of+the+Conference+which+it+pleased+his+excellent+Majesty+to+have+with+the+Lords%2C+Bishops+%26+other+of+his+Clergy%E2%80%A6+at+Hampton+Court%2C+January+14%2C+1603+%28London%3A+Windet%2C+1604%29%2C+2nd+Day%2C+pp.+67-74&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff2aa09de7d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f2aa09de7d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=His%20%5BKnewstubs%E2%80%99s%5D%20objection%20against%20the%20cross,serpent%29%20are%20demolished%2C%20as%20you%20desire&amp;text=His%20%5BKnewstubs%E2%80%99s%5D%20objection%20against%20the%20cross%20consisted%20of&amp;text=the%20brazen%20serpent%29%20are%20demolished%2C%20as%20you%20desire" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Question. After the ministry of the Word and the seals, how is the freewill-offering, or collection for the saints, to be administered? Answer:

1. For the time, it is to be made every Lord’s Day, which is the first day of the week.

2. For the measure, as God hath prospered every man. 3 For the manner; not of constraint, but freely, and to be presented, as an offering to the Lord, and laid down, as at first before the apostles, so afterward, by their appointment, before the deacons of church, as into a common treasury.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7810b67d81" data-kw="">
<blockquote><p>But far be it from me to argue with Bellarmme (de poenit. bk. 3, ch. 2) from Uzziah’s bodily leprosy to infer that any prince who is spiritually leprous and turned heretical, is presently to be dethroned. Nothing can dethrone a king but such tyranny as is inconsistent with his royal office. Nor durst I infer that kings, now a-days, may be removed from actual government for one single transgression. It is true, eighty priests, and the whole kingdom, so serving king Uzziah (their motives, I know, were divine) proves well that the subjects may punish the transgression of God’s express law in the king, in some cases even to remove him from the throne;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843) | Question 44</cite>, pp. 231-32</span></figcaption>

</figure><figure class="quote" id="q-87f1be735e" data-kw="">
<blockquote><p>This is clear in all the governments and commonwealths that the Lord did immediately model Himself, magistrates had this for a special part of their task, to keep His ordinances pure, and to restrain the corrupters of them: This is expressed in the Moral Law, where Masters are no less to oversee their servants, that they work not on the Sabbath, from respect to the Lord, than to direct their work all the week from respect to themselves [Ex. 20:8-11]; and by the rules of interpreting of these commands, what belongs to a master to be done by him as a master, in reference to these over whom he has power according to his station, that does belong to all magistrates in reference to these under their charge, according to their stations. Also, where one instance is named, all of that kind are comprehended. And therefore as this ordinance of sanctifying the Sabbath is to be overseen by superiors, so also are all others: yea, it is acknowledged also, that what is expressed in one command, in respect of the extent thereof, is to be understood in all. And therefore this obligation lies on superiors, to make inferiors observant of God’s ordinances in reference to all the commands; this is not doubted of the duties in the Second Table: yet there is no expression in it inferring the same so express as is in the First; and this is a common assertion, magistrates have both Tables of the Law committed to their keeping. This is fully made out by many godly and learned men, and we need not to insist upon it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On how Circa Sacra flows out of the 4th Commandment: | The Dying Man’s Testament to the Church of Scotland, or, A Treatise Concerning Scandal… (1659), pt. 3, ch. 13</cite>, pp. 241-2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-32aa7ad0f8" data-kw="">
<blockquote><p>Princes therefore may not suffer bishops to usurp the power of suspending and depriving at their pleasure [as that belongs to presbyteries], and whensoever they commit any such tyranny in smiting of their fellow servants, it is the part of princes to cause these things to be redressed, and for this end graciously to receive the grievances of oppressed ministers. The Arians of old beeing assembled in a Council at Antioch [A.D. 341] (Canon 11), decreed that if any ecclesiastical person should, without the advice and the letters of the bishops of the province, and chiefly of the Metropolitan, go to the emperour to put up any grievance unto him, he should be cast out, not only from the holy communion, but from his proper dignity which he had in the Church. Whereupon Osiander has this observation (Hist. Eccl., Century 4, bk. 2, ch. 48, p. 242): ‘This canon also was composed against holy Athanasius: for Athanasius being expelled by the Arians, had fled to the Emperour Constantine the younger, and had from him obtained a return to his own Church. Now this canon is very unjust, which forbids that a bishop or any other minister of the Church, being unjustly oppressed, flee to his godly civil magistrate: since it was lawful to the apostle paul to appeal to the Roman Emperor, wicked Nero, as the acts of the apostles witness. But it may be seen in this place, that bishops were very soon seeking dominion, yea tyranny over the Church and over their colleges [ecclesiastical assemblies].&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), pt. 3, bk. 8, Digression 4</cite>, pp. 194-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-4a1d55b285" data-kw="">
<blockquote><p>Papists exempt their clergy from the judgment of the civil power (though they be delinquents against it) and their [e]states, both civil and spiritual, from civil taxes, tributes, and penalties, both which [papal positions] we deny to ours, for: (1) This is repugnant to the law of nature, that church officers and members, as parts and members of the commonwealth, should not be subject to the government of that commonwealth whereof they are parts. (2) [This is] repugnant to the laws and practices of the Old Testament, under which we read of no such exemptions. Yea, we have instance of Abiathar the highpriest, who, for his partnership with Adonijah in his rebellion, was exiled by king Solomon, and so consequently deprived of the exercise of his office (1 Kings 2:26-27). (3) [This is] inconsistent with our Savior’s example, who, as subject to the law, held himself obliged to pay tribute to avoid offence (Mt. 17:26), which was an active scandal; and He confesses Pilate’s power to condemn or release Him was given Him from above (John 19:11). (4) And finally, [this is] contrary to the apostolical precepts, enjoining all to be subject to superior powers (Rom. 13:1-4; 1 Pet. 2:13-15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/london-presbyterians.html">London Presbyterians</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jus Divinum, the Divine Right of Church Government… (1646, 1647, 1654; NY: Robert Martin &amp; Co., 1844), pt. 2, ch. 9, section 1, ‘Of the Proper Receptacle &amp; Distinct Subject of All this Power &amp; Authority of Church Government… That the Political Magistrate is Not the Proper Subject of this Power’</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Papists exempt their clergy from the judgment of the civil power (though they be delinquents against it) and their [e]states, both civil and spiritual, from civil taxes, tributes, and penalties, both which [papal positions] we deny to ours, for: (1) This is repugnant to the law of nature, that church officers and members, as parts and members of the commonwealth, should not be subject to the government of that commonwealth whereof they are parts. (2) [This is] repugnant to the laws and practices of the Old Testament, under which we read of no such exemptions. Yea, we have instance of Abiathar the highpriest, who, for his partnership with Adonijah in his rebellion, was exiled by king Solomon, and so consequently deprived of the exercise of his office (1 Kings 2:26-27). (3) [This is] inconsistent with our Savior’s example, who, as subject to the law, held himself obliged to pay tribute to avoid offence (Mt. 17:26), which was an active scandal; and He confesses Pilate’s power to condemn or release Him was given Him from above (John 19:11). (4) And finally, [this is] contrary to the apostolical precepts, enjoining all to be subject to superior powers (Rom. 13:1-4; 1 Pet. 2:13-15).”

— London Presbyterians, Jus Divinum, the Divine Right of Church Government… (1646, 1647, 1654; NY: Robert Martin &amp; Co., 1844), pt. 2, ch. 9, section 1, ‘Of the Proper Receptacle &amp; Distinct Subject of All this Power &amp; Authority of Church Government… That the Political Magistrate is Not the Proper Subject of this Power’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CPapists+exempt+their+clergy+from+the+judgment+of+the+civil+power+%28though+they+be+delinquents+against+it%29+and+their+%5Be%5Dstates%2C+both+civil+and+spiritual%2C+from+civil+taxes%2C+tributes%2C+and+penalties%2C+both+which+%5Bpapal+positions%5D+we+deny+to+ours%2C+for%3A+%281%29+This+is+repugnant+to+the+law+of+nature%2C+that+church+officers+and+members%2C+as+parts+and+members+of+the+commonwealth%2C+should+not+be+subject+to+the+government+of+that+commonwealth+whereof+they+are+parts.+%282%29+%5BThis+is%5D+repugnant+to+the+laws+and+practices+of+the+Old+Testament%2C+under+which+we+read+of+no+such+exemptions.+Yea%2C+we+have+instance+of+Abiathar+the+highpriest%2C+who%2C+for+his+partnership+with+Adonijah+in+his+rebellion%2C+was+exiled+by+king+Solomon%2C+and+so+consequently+deprived+of+the+exercise+of+his+office+%281+Kings+2%3A26-27%29.+%283%29+%5BThis+is%5D+inconsistent+with+our+Savior%E2%80%99s+example%2C+who%2C+as+subject+to+the+law%2C+held+himself+obliged+to+pay+tribute+to+avoid+offence+%28Mt.+17%3A26%29%2C+which+was+an+active+scandal%3B+and+He+confesses+Pilate%E2%80%99s+power+to+condemn+or+release+Him+was+given+Him+from+above+%28John+19%3A11%29.+%284%29+And+finally%2C+%5Bthis+is%5D+contrary+to+the+apostolical+precepts%2C+enjoining+all+to+be+subject+to+superior+powers+%28Rom.+13%3A1-4%3B+1+Pet.+2%3A13-15%29.%E2%80%9D%0A%0A%E2%80%94+London+Presbyterians%2C+Jus+Divinum%2C+the+Divine+Right+of+Church+Government%E2%80%A6+%281646%2C+1647%2C+1654%3B+NY%3A+Robert+Martin+%26+Co.%2C+1844%29%2C+pt.+2%2C+ch.+9%2C+section+1%2C+%E2%80%98Of+the+Proper+Receptacle+%26+Distinct+Subject+

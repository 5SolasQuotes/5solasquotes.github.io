<blockquote><p>f. It is both conditional and unconditional. The question is repeatedly asked, whether the covenant is conditional or unconditional. This is a question that cannot be answered without careful discrimination, for the answer will depend on the point of view from which the covenant is considered. On the one hand the covenant is unconditional. There is in the covenant of grace no condition that can be considered as meritorious. The sinner is exhorted to repent and believe, but his faith and repentance do not in any way merit the blessings of the covenant. This must be maintained in opposition to both the Roman Catholic and the Arminian position. Neither is it conditional in the sense that man is expected to perform in his own strength what the covenant requires of him. In placing him before the demands of the covenant, we must always remind him of the fact that he can obtain the necessary strength for the performance of his duty only from God. In a sense it may be said that God Himself fulfills the condition in the elect. That which may be regarded as a condition in the covenant, is for those who are chosen unto everlasting life also a promise, and therefore a gift of God. Finally, the covenant is not conditional in the sense that the reception of every separate blessing of the covenant is dependent on a condition. We may say that faith is the conditio sine qua non of justification, but the reception of faith itself in regeneration is not dependent on any condition, but only on the operation of the grace of God in Christ. On the other hand the covenant may be called conditional. There is a sense in which the covenant is conditional. If we consider the basis of the covenant, it is clearly conditional on the suretyship of Jesus Christ. In order to introduce the covenant of grace, Christ had to, and actually did, meet the conditions originally laid down in the covenant of works, by His active and passive obedience. Again, it may be said that the covenant is conditional as far as the first conscious entrance into the covenant as a real communion of life is concerned. This entrance is contingent on faith, a faith, however, which is itself a gift of God. When we speak of faith as a condition here, we naturally refer to faith as a spiritual activity of the mind. It is only through faith that we can obtain a conscious enjoyment of the blessings of the covenant. Our experimental knowledge of the covenant life is entirely dependent on the exercise of faith. He who does not live a life of faith is, as far as his consciousness is concerned, practically outside of the covenant. If in our purview we include not only the beginning, but also the gradual unfolding and completion of the covenant life, we may regard sanctification as a condition in addition to faith. Both are conditions, however, within the covenant. Reformed Churches have often objected to the use of the word “condition” in connection with the covenant of grace. This was largely due to a reaction against Arminianism, which employed the word “condition” in an un-Scriptural sense, and therefore to a failure to discriminate properly [Cf. Dick, Theol. Lect. XLVIII]. Bearing in mind what was said in the preceding, it would seem to be perfectly proper to speak of a condition in connection with the covenant of grace, for (1) the Bible clearly indicates that the entrance upon the covenant life is conditioned on faith, John 3:16, 36; Acts 8:37 (not found in some MSS.); Rom. 10:9; (2) Scripture often threatens covenant children, but these threatenings apply exactly to those who ignore the condition, that is, who refuse to walk in the way of the covenant; and (3) if there were no condition, God only would be bound by the covenant, and there would be no “bond of the covenant” for man (but cf. Ezek. 20:37); and thus the covenant of grace would lose its character as a covenant, for there are two parts in all covenants.</p></blockquote>

<blockquote><p>VIII. Divines explain themselves differently as to the conditions of the covenant of grace. We, for our part, agree with those who think that the covenant of grace, to speak accurately, with respect to us has no conditions, properly so called; which sentiment we shall explain and establish in the following manner. IX. A condition of a covenant, properly so called, is that action which, being performed, gives a man a right to the reward. But that such a condition cannot be required of us in the covenant of grace, is self-evident: because a right to life neither is nor indeed can be founded on any action of ours, but on the righteousness of our Lord alone; who having perfectly fulfilled the righteousness of the law for us, nothing can, in justice, be required of us to perform, in order to acquire a right already fully purchased for us. And, indeed, in this all the orthodox readily agree. X. Further, the apostle more than once sets forth the covenant of grace under the appellation of a testament, which is God’s immutable purpose, not suspended on any one condition: and as it is founded on the unchangeable counsel of God, and ratified by the death of the testator, so it is not possible it should be made void by any unbelief of the elect, nor acquire its stability from any faith of man; for in this very testament God has immutably determined concerning faith, as salvation. Thus, Gal. 3:15, we see the covenant of God with Abraham is called a testament; the ratification of which must also be the same with that of a testament. And the covenant to be made with Israel, Jer. 31 has the same appellation, Heb. 8:10; as also that covenant with Israel mentioned by Moses, Exod. 24 and the declaration of the manner of enjoying the love of God through faith in Christ, Heb. 9:15, 20. And likewise, the compact of the Father with the Son, Luke 22:39, “In which passage, first, the will of God is published, by which he decreed, that the Son should, by the divine power of the Father, obtain the inheritance of the world, and a kingdom: secondly, the will of Christ, that the apostles and others given him should, through faith, become heirs of righteousness, and of the heavenly kingdom and of that of the world.” Compare Gal. 3:8. “But why should the apostle call the covenant of Abraham, and that mentioned, Heb. 8:10, a testament, and whether it ought not to be so taken, Matt. 26:18, and in other places, shall be considered in its place.”—Cocceius de Fœder. §. 4. And, in a word, I know not whether Paul, when speaking of the covenant of grace, did at any time or in any passage give it any other name than that of a testament. “But at that time,” at least if we give in to Cocceius’s opinion, “that word signified, neither to Greeks, nor Hellenist Jews, nor to the Hebrews, any other thing but a testament.” Cocceius ad Gal. 3 §. 134. I do not assert these things, as if I wanted to confound the notions of a covenant and a testament; but to show that the covenant of grace is testamentary, and to be distinguished from a covenant founded on a compact agreement, or law. Nor do I conceal that I found this in Cocceius de Fœd. §. 87; which made me wonder that a certain learned person, who is a great admirer of Cocceius, should find fault with these things. XI. The famous Cloppenburg, formerly the ornament of the university of Friesland, has accurately observed the same thing, whose words I shall subjoin from Disputat. 3, de Fœderibus, Thes. 29: “The other disposition of the covenant [which regards us] is testamentary, whereby the grace by which we are saved comes to us from the most perfect merit of Christ the surety. For we are reckoned to be in covenant with God by the new covenant of grace, without having superadded to the covenant confirmed with Christ, the surety, by the renewal of the old agreement, any condition by which God should transact with us, but giving a gratuitous call to the inheritance of the promises whose testament Christ ratified by his death, and whose mediator he now is in heaven; namely, of full reconciliation with God and of eternal life.” Junius, in like manner, in his Theses, Disputat. 25, §. 29, “The conditions being fulfilled by the Angel of the Covenant, the catholic church was, through and for him, constituted heir of eternal life, without any condition.</p></blockquote>

e+the+same+with+that+of+a+testament.+And+the+covenant+to+be+made+with+Israel%2C+Jer.+31+has+the+same+appellation%2C+Heb.+8%3A10%3B+as+also+that+covenant+with+Israel+mentioned+by+Moses%2C+Exod.+24+and+the+declaration+of+the+manner+of+enjoying+the+love+of+God+through+faith+in+Christ%2C+Heb.+9%3A15%2C+20.+And+likewise%2C+the+compact+of+the+Father+with+the+Son%2C+Luke+22%3A39%2C+%E2%80%9CIn+which+passage%2C+first%2C+the+will+of+God+is+published%2C+by+which+he+decreed%2C+that+the+Son+should%2C+by+the+divine+power+of+the+Father%2C+obtain+the+inheritance+of+the+world%2C+and+a+kingdom%3A+secondly%2C+the+will+of+Christ%2C+that+the+apostles+and+others+given+him+should%2C+through+faith%2C+become+heirs+of+righteousness%2C+and+of+the+heavenly+kingdom+and+of+that+of+the+world.%E2%80%9D+Compare+Gal.+3%3A8.+%E2%80%9CBut+why+should+the+apostle+call+the+covenant+of+Abraham%2C+and+that+mentioned%2C+Heb.+8%3A10%2C+a+testament%2C+and+whether+it+ought+not+to+be+so+taken%2C+Matt.+26%3A18%2C+and+in+other+places%2C+shall+be+considered+in+its+place.%E2%80%9D%E2%80%94Cocceius+de+F%C5%93der.+%C2%A7.+4.+And%2C+in+a+word%2C+I+know+not+whether+Paul%2C+when+speaking+of+the+covenant+of+grace%2C+did+at+any+time+or+in+any+passage+give+it+any+other+name+than+that+of+a+testament.+%E2%80%9CBut+at+that+time%2C%E2%80%9D+at+least+if+we+give+in+to+Cocceius%E2%80%99s+opinion%2C+%E2%80%9Cthat+word+signified%2C+neither+to+Greeks%2C+nor+Hellenist+Jews%2C+nor+to+the+Hebrews%2C+any+other+thing+but+a+testament.%E2%80%9D+Cocceius+ad+Gal.+3+%C2%A7.+134.+I+do+not+assert+these+things%2C+as+if+I+wanted+to+confound+the+notions+of+a+covenant+and+a+testament%3B+but+to+show+that+the+covenant+of+grace+is+testamentary%2C+and+to+be+distinguished+from+a+covenant+founded+on+a+compact+agreement%2C+or+law.+Nor+do+I+conceal+that+I+found+this+in+Cocceius+de+F%C5%93d.+%C2%A7.+87%3B+which+made+me+wonder+that+a+certain+learned+person%2C+who+is+a+great+admirer+of+Cocceius%2C+should+find+fault+with+these+things.+XI.+The+famous+Cloppenburg%2C+formerly+the+ornament+of+the+university+of+Friesland%2C+has+accurately+observed+the+same+thing%2C+whose+words+I+shall+subjoin+from+Disputat.+3%2C+de+F%C5%93deribus%2C+Thes.+29%3A+%E2%80%9CThe+other+disposition+of+the+covenant+%5Bwhich+regards+us%5D+is+testamentary%2C+whereby+the+grace+by+which+we+are+saved+comes+to+us+from+the+most+perfect+merit+of+Christ+the+surety.+For+we+are+reckoned+to+be+in+covenant+with+God+by+the+new+covenant+of+grace%2C+without+having+superadded+to+the+covenant+confirmed+with+Christ%2C+the+surety%2C+by+the+renewal+of+the+old+agreement%2C+any+condition+by+which+God+should+transact+with+us%2C+but+giving+a+gratuitous+call+to+the+inheritance+of+the+promises+whose+testament+Christ+ratified+by+his+death%2C+and+whose+mediator+he+now+is+in+heaven%3B+namely%2C+of+full+reconciliation+with+God+and+of+eternal+life.%E2%80%9D+Junius%2C+in+like+manner%2C+in+his+Theses%2C+Disputat.+25%2C+%C2%A7.+29%2C+%E2%80%9CThe+conditions+being+fulfilled+by+the+Angel+of+the+Covenant%2C+the+catholic+church+was%2C+through+and+for+him%2C+constituted+heir+of+eternal+life%2C+without+any+condition.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+The+Economy+of+the+Covenants+between+God+%26+Man%3A+Comprehending+a+Complete+Body+of+Divinity%2C+trans.+William+Crookshank%2C+2+vols.+%28London%3A+Tegg+%26+Son%2C+1837%29%2C+vol.+1%2C+pp.+252%E2%80%9358%3B+italics+original.+See+also+Herman+Witsius%2C+The+Economy+of+the+Covenants+Between+God+%26+Man%2C+2+vols.+%281822%3B+RHB%2C+2017%29%2C+vol.+1%2C+pp.+284%E2%80%9391&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F070d9b7b03.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/070d9b7b03.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/in-what-respects-the-covenant-of-grace-is-condition/#:~:text=VIII.%20Divines%20explain%20themselves%20differently%20as,of%20eternal%20life%2C%20without%20any%20condition." rel="noopener" target="_blank">Read it online · Reformed Bo <blockquote><p>Particularly noteworthy are his treatments of the Noahic and Mosaic covenants as integral to the overarching covenant of grace.” – Ryan McGraw . . The History of the Development of the Doctrine of the Covenant of Grace Whole of Church History eds. Waters, Reid &amp; Muether – pt. 2, chs. 14-20 in Covenant Theology: Biblical, Theological &amp; Historical Perspectives Pre (Crossway, 2020) ToC . In the Early Church Duncan, J. Ligon – The Covenant Idea in Ante-Nicene Theology PhD diss. (Edinburgh, 1995) Abstract: “This thesis argues that the covenant idea was more significant in the writings of particular ante-Nicene theologians than has generally been admitted in patristic research or general surveys of the history of the covenant idea in the Christian tradition… This investigation reveals that the covenant idea functions in several arenas of early Christian thought. It is employed (1) to stress moral obligations incumbent upon Christians; (2) to show God’s grace in including the Gentiles in the Abrahamic blessings; (3) to deny the reception of these promises to the Israel of the flesh, that is, Israel considered merely as an ethnic entity; (4) to demonstrate continuity in the divine economy; and (5) to explain discontinuity in the divine economy. In reviewing the role of early Christian covenant thought in these areas, this thesis argues that (1) the pre-Nicene theologians usually take OT covenant passages (not NT passages) as the starting point in their applications of the covenant concept to Christian living; (2) the early Christian use of the covenant idea evidences that they understood the covenant to be both unilateral and bilateral, promissory and obligatory, to bring divine blessings and entail human obedience; (3) these writings also show that, from the very earliest times, Christian authors (following OT and NT examples) have employed the covenant concept as a key structural idea in their presentations of redemptive history; (4) contrary to the suggestions of previous studies, there is no evidence of a gap in the usage of the covenant idea after the era of the NT writings; (5) the covenant idea was closely linked to the early Christian self-understanding as the people of God; (6) the covenant idea is not monolithic in the thought of the authors surveyed. It is employed with differing emphases and takes on varying shades of meaning in their respective writings… This study is significant for at least these following reasons: (1) It confirms current research on the Jewish matrix of early Christianity, from a vantage-point not yet exploited. (2) It reviews in greater detail the early Christian covenant thought which is now being acknowledged to have been influential on the sixteenth-century Reformers (such as Bullinger and Calvin). (3) As the first extensive patristic survey of the covenant idea, it fills a significant lacuna in the history of ideas…</p></blockquote>

<blockquote><p>From all this it follows: First, that all the faithful are of the same faith with Abraham. The father and the sons-spiritual are of the same belief: as they do partake of the same spiritual privileges. It is one God that justifies the circumcision and the uncircumcision, and it is the same faith whereby the promises of mercy are embraced. Zaccheus is called the son of Abraham, and he believed in Christ as did Abraham. 2. Not only promises of temporal good things, but of spiritual and eternal were made to the patriarchs in the Covenant of Grace, and sought and obtained by them. They looked for a city whose builder and maker the Lord is. (Heb. 11:11-12) Remission of sins and life everlasting was preached in the Covenant, sealed in the sacrament, and typified by the land of Canaan. To conceive the fathers to be an assembly of brute beasts, which looked to be fed with earthly blessings alone, is highly to dishonor them, and lessen the grace and mercy of God towards them. 3. Sacramental phrases, wherein the name of the thing signified is given to the sign, are ancient and familiar; as circumcision is called the Covenant, and the rock Christ. Why then should our adversaries stumble at this, that in the sacrament of the Supper the bread is called the body of Christ? 4. In this expression of the Covenant, the spiritual good things promised therein are limited to Abraham and to his seed. But all infants whatsoever are not comprehended under the seed of Abraham. To say many thousands are excluded from the seals and outward administration of the Covenant, when yet everyone is partaker of the good promised in the Covenant, is to speak of ourselves, and not according to the Word of God. We will not tie the grace of God to outward means: but ordinarily we cannot affirm they pertain to the Covenant of Grace, and obtain the highest blessings promised therein, whom God does not vouchsafe so much as outwardly to receive into Covenant.</p></blockquote>

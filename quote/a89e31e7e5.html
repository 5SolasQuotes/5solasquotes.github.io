<main class="wrap"><figure class="quote" id="q-a89e31e7e5" data-kw="">
<blockquote><p>There is one thing, I cannot help observing, has contributed very much to discourage ordinary people from this useful study: It is that mysterious air of learning, and profound science, which speculative and scholastic writers scatter over their performances on these subjects, as if they scorned to say the most common and familiar things in a way that any but philosophers should understand. Certain it is, that there is not any one thing in the subject itself, but what falls as directly under the observation of a man of the plainest understanding, as of the profoundest philosopher, abating perhaps some refinements, which no man living can ever comprehend.

We propose, therefore, as much as possible, to avoid every thing that lies out of the common road; and endeavour to point out what every man may, by a little reflexion on himself, bring to the only test of truth, observation and experience; and from these attempt to gather up such an account of the human constitution, as may satisfy any plain man where he is to look for his happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-riccaltoun.html">Robert Riccaltoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Essays on Human Nature</cite>, in The Works of the Late Reverend Mr Robert Riccaltoun, Minister of the Gospel at Hobkirk (3 vols, Edinburgh: A. Murray &amp; J. Cochran, 1771-72), 1: 33-34.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

ter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6ac70eebd0" data-kw="">
<blockquote><p>Should anyone attempt to weaken the truth of natural theology by this argument, that nothing of certainty can be discovered in human affairs, or that what is certain cannot possibly be distinguished from that which is doubtful, a confutation of the first of these puerilities does not belong to this part of the subject; for it is not our business here to demonstrate the principles of human knowledge, but to take them for granted–Let these who are so thoroughly possessed of such skeptical opinions in order to be cured of their folly apply to the metaphysicians, I had almost said to the physicians–all that our subject requires of us is to show that there is as great certainty to be found in matters of a divine nature as can possibly be met with in human affairs. For to add only this one remark, what end can it serve to confute those by argument who attempt to destroy all reasoning, nay the very foundations of it, and who, on their own principles, are equally refuted, whether they prove their own opinion to be true, or do not prove it, whether they overcome in their disputations, or are defeated? But that certainty is often confounded with doubt, and truth with falsehood, in every subject of our enquiry, more particularly such enquiries as have divine things for their object, cannot be denied. For this reason in particular, the candid enquirer after truth should determine nothing without caution, nothing precipitately, nothing from prejudice, from anger, from hatred, or any improper disposition. But to assert that nothing, in any of our enquiries, can be known with certainty, even when the utmost caution, sincereity and attention guide our researches, is perfectly absurd and quite inconsistent with the first principles of reason.</p></blockquote>

</figure><figure class="quote" id="q-bd83c980d6" data-kw="necessity amp">
<blockquote><p>Although all the truths revealed in Scripture are necessary to be believed as divine and infallible, yet they are not all equally necessary and the amplitude and extension of faith must be accurately distinguished here from its necessity. Not everything which belongs to the amplitude of faith must therefore belong to its necessity. All truths are not of the same weight. Some have a greater, others a lesser degree of necessity. For example, some are necessary by the necessity of means; others only by the necessity of precept. Some relate to doctrines strictly so called, others only to rites and ceremonies. One relates to some article or doctrine as to substance (for instance that Christ suffered and died); another to the same considered only with reference to circumstances (for instance, that Christ suffered under Pontius Pilate and was crucified between two thieves). For we might be ignorant of the latter without peril to our salvation. Proof of this from Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.14.5</span></figcaption>

</figure><figure class="quote" id="q-ed958aa302" data-kw="">
<blockquote><p>In chapter 1 we introduced the principle of proportionate causality (PPC), which states that whatever is in an effect must be in its cause, insofar as a cause cannot give what it does not first have. Let’s now examine this principle more carefully. Recall first that, stated more precisely, PPC holds that whatever is in an effect must be in its total cause in some way or other, whether formally, virtually, or eminently… PPC follows straightforwardly from the principle of causality (PC) and the principle of sufficient reason (PSR), both of which have been defended at length in earlier chapters. If there were some aspect of an effect that didn’t come from its total cause, then that would involve a potentiality that was actualized without anything doing the actualizing, which would violate PC. It would be an aspect of the effect that lacked any explanation, which would violate PSR.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Proofs of the Existence of God</cite>, (Ignatius, 2017) | ch. 6, The Nature of God and of His Relationship to the World, p. 170</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-be8b63b848" data-kw="">
<blockquote><p>Asking whether you should listen to God or to reason is like asking whether you should listen to Beethoven’s Fifth Symphony or to the recording you have of it. It’s like asking whether the earth is lit up by the sun or by sunlight. It’s like asking whether you should obey your commanding officer or his commands. The natural law of reason is a participation in the eternal law of God ([Thomas, Summa] I-I,91,2).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-kreeft.html">Peter Kreeft</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Practical Theology</cite>, … (Ignatius Press, 2014), ch. 82, ‘Listening to Reason is Listening to God’</span></figcaption>

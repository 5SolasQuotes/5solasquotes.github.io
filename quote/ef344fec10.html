<blockquote><p>VI. It is asked, must theology be taught according to a certain method? As an example of excess, the [medieval] Scholastics, according to their philosophical theology, loved the philosophical method of Aristotle – whether it was his analytic or synthetic method – to the point of distraction.

As an example of deficiency, the Anabaptists, enthusiasts, and fanactics, due to ignorance and hatred of philosophy, reckon that all method should be eliminated from theological matters. One after another of our Reformed theologians, in proving their own points, opposed such persons.

The Reformed, against the Anabaptists and enthusiasts, demand a method, but not, precisely speaking, a philosophical one. They demand a natural method, that is, a method that is suitable for theological matters, and for assisting the judgment and strengthening the memory – however much that method might otherwise depend on the discretion of the writer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology Volume 1: Prolegomena</cite>, trans. Todd M. Rester, ed. Joel R. Beeke (1699; Grand Rapids MI: Reformation Heritage Books, 2018), 1.1.1.VI, p. 70.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b7c21b431b" data-kw="">
<blockquote><p>But this place hath need of a sound exposition, because of fantastical [fanatical] spirits, which do feign a commonalty or participation together of goods, whereby all policy or civil government is taken away; as in this age the Anabaptists have raged, because they thought there was no Church unless all men’s goods were put and gathered together, as it were, in one heap, that they might all one with another take thereof.

Wherefore, we must in this point beware of two extremes. For many, under colour of policy, do keep close and conceal whatsoever they have; they defraud the poor, and they think that they are twice righteous, so they take away no other men’s goods. Other some are carried into the contrary error, because they would have all things confused. But what doth Luke? Surely he noteth another order, when he saith that there was choice made in the distribution. If any man object that no man had anything which was his own, seeing all things were common, we may easily answer.

For this community or participation together must be restrained unto the circumstance which ensueth immediately; to wit, that the poor might be relieved as every man had need. We know the old proverb, “All things are common amongst friends.” When as the scholars of Pythagoras said thus, they did not deny but that every man might govern his own house privately, neither did they intend to make their own wives common; so this having of things common, whereof Luke speaketh, and which he commendeth, doth not take away household government; which thing shall better appear by the fourth chapter, whereas he nameth two alone which sold their possessions of so many thousands. Whence we gather that which I said even now, that they brought forth and made common their goods in no other respect, save only that they might relieve the present necessity.

And the impudency of the monks was ridiculous, who did profess that they did observe the apostles’ rule, because they call nothing their own; and yet, nevertheless, they neither sell anything, neither yet do they pass for any man’s poverty; but they stuff their idle bellies with the blood of the poor, neither do they regard any other thing in their having of things common, save only that they may be well filled and daintily, although all the whole world be hungry. Wherein, then, are they like to the first disciples, with whom they will be thought to be able to compare?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Acts of the Apostles</cite>, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 18a: 130-31.</span></figcaption>

</figure><figure class="quote" id="q-a0c4324357" data-kw="">
<blockquote><p>Hence I believe that there is one Church of those who have the same Spirit, through whom they are made certain that they are the true children of the family of God; and this is the first fruits of the Church. I believe that this Church does not err in regard to truth, namely in those fundamental matters of faith upon which everything depends. I believe also that the universal, visible Church is one, while it maintains that true confession, of which we have already spoken. I believe also that all belong to this Church who give their adherence to it according to the rule and promise of God’s Word. I believe that to this Church belong Isaac, Jacob, Judah and all who were of the seed of Abraham, and also those infants whose parents in the first beginnings of the Christian Church, through the preaching of the apostles, were won to the cause of Christ. For if Isaac and the rest of the ancients had not belonged to the Church, they would not have received the Church’s token, circumcision. Since these, then, were members of the Church, infants and children belonged to the primitive Church. Therefore I believe and know that they were sealed by the sacrament of baptism. For children also make a confession, when they are offered by their parents to the Church, especially since the promise offers them to God, which is made to our infants no less, but even far more amply and abundantly, than formerly to the children of the Hebrews. These are the grounds for baptizing and commending infants to the Church, against which all the weapons and war engines of the Anabaptists avail nothing. For not only are they to be baptized who believe, but they who confess, and they who, according to the promise of God’s Word, belong to the Church. For otherwise even the apostles would not have baptized anyone, since no apostle had absolute evidence regarding the faith of one confessing and calling himself a Christian. For Simon the impostor, Ananias, Judas, and no one knows who, were baptized when they declared their adherence to Christ, even though they did not have faith. On the other hand, Isaac was circumcised as an infant without declaring his adherence or believing, but the promise acted in his behalf. But since our infants are in the same position as those of the Hebrews, the promise also declares their adherence to our Church and makes confession. Hence, in reality baptism, like circumcision (I am speaking of the sacrament of baptism) pre-supposes nothing but one of two things, either confession, i.e., a declaration of allegiance or a covenant, i.e., a promise. All of which will become somewhat clearer from what follows.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/huldrych-zwingli.html">Huldrych Zwingli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fidei Ratio</cite>, (1530) in James T. Dennison Jr. ed., Reformed Confessions of the 16th and 17th Centuries in English Translation: 1523–1693, vol. 1 (Grand Rapids: Reformation Heritage Books, 2008–14), 122–23.</span></figcaption>

</figure><figure class="quote" id="q-faff7e21b8" data-kw="">
<blockquote><p>Wherefore John Baptist declaring the office of Christ, when he shewed him with his finger, said: Behold the lamb of God, which taketh away the sins of the world. These things make against the Anabaptists, which make the Gospel to be nothing but good works, and a most absolute conversation.

These men know not the chief and principal benefit of Christ, neither make they any difference between the law and the Gospel. The law in deed commandeth: but the Gospel ministreth strengths to accomplish those things which are commanded. The law accused the: The Gospel absolveth: The law maketh a sound outwardly: The Gospel is graven in the bowels: The law worketh anger: The Gospel maketh God pacified, and reconciled unto us: The law by making afeard, dejecteth the mind: The Gospel by comforting, erecteth it: The law is the ministry of death: The gospel, of life: The law, is a, schoolmaster: The gospel, is a perfect instruction: The whole law consisteth in this, that we should work:

The Gospel herein chiefly consisteth, that we should believe: The law bringeth a curse unto them which live under it: The Gospel bringeth blessing: The law bringeth bondage: The Gospel, spiritual liberty: The law, is the letter: The Gospel, is the spirit: The law hath promises, but with this condition, if ye shall do all those things: The promises of the Gospel, are free, and therefore firm. There might be rehearsed also other differences, whereby these two differ very much, asunder. But at this time we think these to be sufficient.</p></blockquote>

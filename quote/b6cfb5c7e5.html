<blockquote><p>Assurance of the love of God never produces self-complacency or pride; but always humility, self-abasement, wonder, gratitude, and praise. The believer sees that the mysterious fountain of this love is in the divine mind; it is not in himself, who is ungodly and a sinner…</p></blockquote>
<figcaption>— <a href="../authors/charles-hodge.html">Charles Hodge</a>, <cite>Commentary on the Epistle to the Romans</cite>, rev. ed., 1886, ch. 5, Remarks</figcaption>

<figcaption>— <a href="../authors/westminster-assembly.html">Westminster Assembly</a>, <cite>Westminster Larger Catechism</cite>, Q. 80</figcaption>

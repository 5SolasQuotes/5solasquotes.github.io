<main class="wrap"><figure class="quote" id="q-90ef894f52" data-kw="">
<blockquote><p>Why then does He punish with perdition? No otherwise than as some just judge, that would have all men live regularly, and free from disorders; but having transgressed the laws, justice compels him, and that by a good and rectified will, to punish them. Some would have this will of God to be velleitatem [willingness] rather than voluntatem [will]; not so much an absolute will and resolution, as a willingness and desire: not unlike a merchant’s casting his freight overboard in a dangerous tempest. He would willingly save them, and yet he is willingly content to lose them, says one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-adams.html">Thomas Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the Second Epistle General of St. Peter</cite>, (1633; Soli Deo Gloria, 1990), on 2 Pet. 3:9, “Not willing that any should perish,”, pp. 693-95</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d8fb1313fc" data-kw="">
<blockquote><p>And O how He ‘travails in the greatness of his strength, mighty to save! able to save to the uttermost them that come unto God by Him.’ O His infinite willingness to save us! how deeply marked in words, in oaths, in cries, in tears, in sighs, in groans, in blood, in death of an expiring God! He ‘comes in the name of the Lord to save us–to seek and to save that which was lost; and him that comes unto Him, He will in no wise cast out;’ all day long He stretches out his hands to invite and receive a disobedient and gainsaying people. Now the Master comes! knocks at the door of thy heart, and calls for you:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Appendix, “An Address to the Rising Generation” in Two Short Catechisms Mutually Connected</cite>, (Edinburgh: 1769), as in Addresses to Children Concerning Salvation (Torwood Press, 2013), pp. 9-15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-bf0de92f98" data-kw="">
<blockquote><p>…and if it be asked, what may be imported by this speech properly? We answer, ‘O that my people had hearkened unto Me, etc.’ [Ps. 81:13] shows these six things: … 4. Fourthly, that God delights not in the death or destruction of his people, but that they should repent and live. … 6. Sixthly, that God requires a suitable meeting of his people to his dispensations, that is, that they may be so willing to hearken to his voice, and so loath to offend Him, as He does manifest by Word and works his willingness to save them and his loathness to destroy them. From the Lord’s lamenting, learn further: … 3. He who hears God uttering his wishes for the conversion of His people and lamenting that His Word is not believed, and that his offer of grace is not received, does give God an evil meeting and neither believes God’s goodness, nor cares for his own salvation, except he join with God lamenting his own misbelief in time past, and do with heartily the same with God for his own conversion for time to come;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Explication of the Last Fifty Psalms from Ps. 100 to the End</cite>, (London: T.R. &amp; E.M., 1653), on Ps. 81:13, pp. 254-55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

ion%20for%20time%20to%20come" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0496fb5986" data-kw="">
<blockquote><p>The Reformed, although they do not at all deny that words that express affections, just as words that express body parts, are employed to speak of God in the Scriptures, and although likewise they acknowledge that when every imperfection is removed from the affections, the substance of those words is in God, even so do not dare to allow in God these disturbances, in which almost the whole nature of affections consists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB) | section 32, ‘5. Do affections properly belong to God?’, vol. 2, bk. 2, ch. 15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-a93eb6fc23" data-kw="">
<blockquote><p>Secondly, another excellent disposition in Christ is his love, not only his philanthropy, or good will He bears to all men, and the desire He has of their salvation, Eze. 33:11, but his αγαπη, his special love, from αγαν valde et παυομας acquiesco, such an ardent affection has the heart of Christ for a person adhering to Him, that it greatly acquiesces in, and is fully contented with him, Eph. 2:4. Such is the sweetness of Christ’s nature, that it is full of love; ‘God is love,’ 1 Jn. 4:16. And as the Father has loved Me, so have I loved you, Jn. 15:9. Now this love of Christ to his people, is: First, a supreme love, the chiefest love. He has a love of benevolence to all, Mk. 10:21, ‘He beheld the young man and loved him;’ but the love He bears his own, is transcedent and exceeds the love of men and angels, Jn. 15:13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bartholomew-ashwood.html">Bartholomew Ashwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Best Treasure, or the Way to be Truly Rich</cite>, (London: Marshal, 1681), p. 139</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

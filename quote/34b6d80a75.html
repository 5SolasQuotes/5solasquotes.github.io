<main class="wrap"><figure class="quote" id="q-34b6d80a75" data-kw="">
<blockquote><p>X. If I say that God, pitying mankind, who through their own crime and the devil’s deceit have fallen into sin and destruction, sent His only-begotten Son. He became man for the sake of men, suffered and died, rose again, and ascended into heaven, obtaining remission of sins and eternal life for them. This great benefit of His Son, God makes known and proclaims to men through the preaching of the Gospel. Those who acknowledge and grieve over their sins, assent to the Gospel, believe in the Son, and trust in His merit and death, are reconciled to God, obtain remission of sins, and are transferred from a state of wrath and damnation to a state of glory and salvation, in which they will remain and surely become partakers of eternal glory, if, since they have believed and been reconciled to God, they strive to observe the divine commandments, do not live according to the flesh, and, with the help of divine grace, avoid committing sins against conscience. Thus, a man will be justified in this life and glorified in the future. If, I say, we use such words, taken from common usage and easily understood by anyone, there can be no disagreement among pious and gentle Christians about the doctrine. No one of them, unless afflicted by a vile and malicious urge to contend and quibble, will question this. But if I say, this is the principal efficient cause; this is the proximate principal cause; this is instrumental on the part of God, this on the part of man; this is merely a disposition; this is the formal cause itself; this is material, this necessary per se, this according to the hypothesis, if I start speaking this way, then it may easily happen that some will misunderstand or plainly not understand me, or interpret me differently than I intend; and thus, a controversy will arise over the use and application of such terms, which is purely scholastic and should not be given such importance that it disrupts the bond of Christian love and concord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-calixt.html">George Calixt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Judgment on Theological Controversies agitated between the Lutherans &amp; Reformed, and on the mutual brotherhood and tolerance of parties because of consensus in the fundamentals</cite>, tr. by AI by WesternCatholike (1650; Leiden, 1652), pp. 5-6</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6df0440a6b" data-kw="">
<blockquote><p>And where greater unity is most desirable, it must first be considered how much of it is possible, or to be hoped for, and next, what are the proper means to attain it. For first, the medicining of all incurable disease, especially with violent physic, is not the way to make it better, but to exasperate it and hasten death, when a palliate and patience might do better. It is very desirable that all the king’s subjects were strong and beautiful and ingenuous and learned, but it is not to be hoped: But that they may be all loyal and honest in their dealing with others may be well endeavored. And secondly, a wrong kind of medicine will much more hasten and ascertain death than to let the disease alone to nature: It is desirable that all the kings subjects be as is said, both wise and learned, yea and perfect in honesty and piety without fault: But if you make a law that for the honor of unity, all that are not learned and perfect in virtue shall be fined, imprisoned or banished, the king nor his subjects will be but little beholden to you for their unity. So one language is very desirable to the world: But first it is not attainable and secondly a law to punish all that speak another language is not the way to procure it; but to set them together by the ears: you must appoint parents and school-masters to teach them all one language by degrees, and keep them to their duties and remove impediments, and thus stay the time; and what cannot this way be attained must not be expected in this world. … It is very desirable that all Christians were perfect in knowledge, gifts and graces, and consequently that there were no different opinions, nor no different forms or modes of worship, but that all were equal to the wisest and to the most sober, pious, zealous and sincere. But if a law be made that none shall be endured in any kingdom that are not of this temperament and stature, the subjects of all princes may soon be numbered. Set parents, school-masters and ministers at work, to make men wiser, and drive them on to diligence in their duty and restrain men from hindering them, and from intolerable wickedness and sin, and patiently expect the success of this: And what this will not do, expect not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 57, ‘Yet let not any here cheat you by overdoing, nor mere names and titles of unity deceive you instead of the thing itself…’, pp. 273</span></figcaption>

<blockquote><p>Hold out the practice, but not the ground: It will gather more, nay all, that hold it not unlawful; men differently principled may meet in one practice.</p></blockquote>

</figure><figure class="quote" id="q-74d20fc2b2" data-kw="">
<blockquote><p>I find her Majesty’s [Queen Elizabeth I’s] proceedings to have been grounded upon two principles. The one, that consciences are not to be forced, but to be won and reduced by force of truth, with the aid of time, and use of all good means of instruction and persuasion. The other, that causes of consciences when they exceed their bounds, and grow to be matter of faction, loose their nature, and that soveriegn princes ought distinctly to punish their practices and contempt, though colored with the pretence of conscience and religion. According to these principles, her majesty at her coming to the crown, utterly disliking the tyranny of Rome, which had used by terror and rigor to settle commandments of men’s faiths and consciences. Though as a princess of great wisdom and magnanimity, she suffered but the exercise of one religion; yet her proceedings towards the Papists, was with great lenity: expecting the good effects which time might work in them… her Majesty not liking to make windows into men’s hearts and secret thoughts, except the abundance of them did overflow into overt and express acts or affirmations, tempered her law so… and that… the humors of most Papists were altered, and that they were no more Papists in conscience, and of softness, but Papists in faction: Then were there new laws made for the punishment of such as should submit themselves to such reconcilements, or renunciation of obedience… For the other party, which have been offensive to the State, though in another degree, which named themselves Reformers, and we commonly call ‘Puritans,’ this has been the proceeding towards them: A great while, when they inveighed against such abuses in the Church as pluralities [of benefices], non-residence [of ministers] and the like, their zeal was not condemned, only their violence was sometime censured. When they refused the use of some ceremonies and rites, as superstitious, they were tolerated with much connivancy and gentleness; yea, when they called in question the superiority of bishops, and pretended to a democracy into the Church [many were congregationalists]; yet their propositions were here considered, and by contrary writings debated and discussed. Yet all this while, it was perceived that their course was dangerous and very popular: as because Papistry was odious, therefore it was ever in their mouths that they sought to purge the Church from the relics of Papistry; a thing acceptable to the people, who love ever to run from one extreme to another. Because multitude of rogues and poverty was an eye-sore, and a dislike to every man; therefore they put into the people’s head that if discipline were planted, there should be no vagabonds nor beggars, a thing very plausible: and in like manner they promised the people many of the impossible wonders of their discipline; besides, they opened to the people a way to government by their consistory and presbytery [through ruling elders]; a thing, though in consequence no less prejudicial to the liberties of private men, than to the sovereignty of princes; yet in first show very popular. Nevertheless this, except it were in some few that entered into extreme contempt, was born with, because they pretended in dutiful manner to make propositions, and to leave it to the providence of God, and the authority of the magistrate. But now of later years, when there issued from them that affirmed the consent of the magistrate was not to be attended; when under pretense of a confession, to avoid slander and imputations, they combined themselves by classes and subscriptions, when they descended into that vile and base means of defacing the government of the Church, by ridiculous pasquils [works of satire], when they begun to make many subjects in doubt to take oaths, which is one of the fundamental parts of justice in this land, and in all places; when they began both to vaunt of their strength and number of their partisans and followers, and to use cominations [threatenings] that their cause would prevail, through uproar and violence, then it appeared to be no more zeal, no more conscience, but mere faction and division: and therefore though the State were compelled to hold somewhat a harder hand to retrain them than before, yet was it with as great moderation, as the peace of the State or Church could permit. And therefore, sir, to conclude, consider uprightly of these matters, and you shall see her Majesty is no more a temporizer in religion: It is not the success abroad, nor the change of servants here at home, can alter her; only as the things themselves alter, she applied her religious wisdom to methods correspondent unto them; still retaining the two rules before mentioned, in dealing tenderly with consciences, and yet in discovering faction from conscience, and softness from singularity.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I find her Majesty’s [Queen Elizabeth I’s] proceedings to have been grounded upon two principles. The one, that consciences are not to be forced, but to be won and reduced by force of truth, with the aid of time, and use of all good means of instruction and persuasion. The other, that causes of consciences when they exceed their bounds, and grow to be matter of faction, loose their nature, and that soveriegn princes ought distinctly to punish their practices and contempt, though colored with the pretence of conscience and religion. According to these principles, her majesty at her coming to the crown, utterly disliking the tyranny of Rome, which had used by terror and rigor to settle commandments of men’s faiths and consciences. Though as a princess of great wisdom and magnanimity, she suffered but the exercise of one religion; yet her proceedings towards the Papists, was with great lenity: expecting the good effects which time might work in them… her Majesty not liking to make windows into men’s hearts and secret thoughts, except the abundance of them did overflow into overt and express acts or affirmations, tempered her law so… and that… the humors of most Papists were altered, and that they were no more Papists in conscience, and of softness, but Papists in faction: Then were there new laws made for the punishment of such as should submit themselves to such reconcilements, or renunciation of obedience… For the other party, which have been offensive to the State, though in another degree, which named themselves Reformers, and we commonly call ‘Puritans,’ this has been the proceeding towards them: A great while, when they inveighed against such abuses in the Church as pluralities [of benefices], non-residence [of ministers] and the like, their zeal was not condemned, only their violence was sometime censured. When they refused the use of some ceremonies and rites, as superstitious, they were tolerated with much connivancy and gentleness; yea, when they called in question the superiority of bishops, and pretended to a democracy into the Church [many were congregationalists]; yet their propositions were here considered, and by contrary writings debated and discussed. Yet all this while, it was perceived that their course was dangerous and very popular: as because Papistry was odious, therefore it was ever in their mouths that they sought to purge the Church from the relics of Papistry; a thing acceptable to the people, who love ever to run from one extreme to another. Because multitude of rogues and poverty was an eye-sore, and a dislike to every man; therefore they put into the people’s head that if discipline were planted, there should be no vagabonds nor beggars, a thing very plausible: and in like manner they promised the people many of the impossible wonders of their discipline; besides, they opened to the people a way to government by their consistory and presbytery [through ruling elders]; a thing, though in consequence no less prejudicial to the liberties of private men, than to the sovereignty of princes; yet in first show very popular. Nevertheless this, except it were in some few that entered into extreme contempt, was born with, because they pretended in dutiful manner to make propositions, and to leave it to the providence of God, and the authority of the magistrate. But now of later years, when there issued from them that affirmed the consent of the magistrate was not to be attended; when under pretense of a confession, to avoid slander and imputations, they combined themselves by classes and subscriptions, when they descended into that vile and base means of defacing the government of the Church, by ridiculous pasquils [works of satire], when they begun to make many subjects in doubt to take oaths, which is one of the fundamental parts of justice in this land, and in all places; when they began both to vaunt of their strength and number of their partisans and followers, and to use cominations [threatenings] that their cause would prevail, through uproar and violence, then it appeared to be no more zeal, no more conscience, but mere faction and division: and therefore though the State were compelled to hold somewhat a harder hand to retrain them than before, yet was it with as great moderation, as the peace of the State or Church could permit. And therefore, sir, to conclude, consider uprightly of these matters, and you shall see her Majesty is no more a temporizer in religion: It is not the success abroad, nor the change of servants here at home, can alter her; only as the things themselves alter, she applied her religious wisdom to methods correspondent unto them; still retaining the two rules before mentioned, in dealing tenderly with consciences, and yet in discovering faction from conscience, and softness from singularity.”

— Francis Walsingham, Letter to Monsier Critoy, in Gilbert Burnet, The History of the Reformation of the Church of England 2nd ed. (London: T.H., 1683), vol. 2, pt. 2, bk. 3, pp. 418-20 Walsingham (c. 1532 – 1590) was principal secretary to Queen Elizabeth I of England from 1573 till his death.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+find+her+Majesty%E2%80%99s+%5BQueen+Elizabeth+I%E2%80%99s%5D+proceedings+to+have+been+grounded+upon+two+principles.+The+one%2C+that+consciences+are+not+to+be+forced%2C+but+to+be+won+and+reduced+by+force+of+truth%2C+with+the+aid+of+time%2C+and+use+of+all+good+means+of+instruction+and+persuasion.+The+other%2C+that+causes+of+consciences+when+they+exceed+their+bounds%2C+and+grow+to+be+matter+of+faction%2C+loose+their+nature%2C+and+that+soveriegn+princes+ought+distinctly+to+punish+their+practices+and+contempt%2C+though+colored+with+the+pretence+of+conscience+and+religion.+According+to+these+principles%2C+her+majesty+at+her+coming+to+the+crown%2C+utterly+disliking+the+tyranny+of+Rome%2C+which+had+used+by+terror+and+rigor+to+settle+commandments+of+men%E2%80%99s+faiths+and+consciences.+Though+as+a+princess+of+great+wisdom+and+magnanimity%2C+she+suffered+but+the+exercise+of+one+religion%3B+yet+her+proceedings+towards+the+Papists%2C+was+with+great+lenity%3A+expecting+the+good+effects+which+time+might+work+in+them%E2%80%A6+her+Majesty+not+liking+to+make+windows+into+men%E2%80%99s+hearts+and+secret+thoughts%2C+except+the+abundance+of+them+did+overflow+into+overt+and+express+acts+or+affirmations%2C+tempered+her+law+so%E2%80%A6+and+that%E2%80%A6+the+humors+of+most+Papists+were+altered%2C+and+that+they+were+no+more+Papists+in+conscience%2C+and+of+softness%2C+but+Papists+in+faction%3A+Then+were+there+new+laws+made+for+the+punishment+of+such+as+should+submit+themselves+to+such+reconcilements%2C+or+renunciation+of+obedience%E2%80%A6+For+the+other+party%2C+which+have+been+offensive+to+the+State%2C+though+in+another+degree%2C+which+named+themselves+Reformers%2C+and+we+commonly+call+%E2%80%98Puritans%2C%E2%80%99+this+has+been+the+proceeding+towards+them%3A+A+great+while%2C+when+they+inveighed+against+such+abuses+in+the+Church+as+pluralities+%5Bof+benefices%5D%2C+non-residence+%5Bof+ministers%5D+and+the+like%2C+their+zeal+was+not+condemned%2C+only+their+violence+was+sometime+censured.+When+they+refused+the+use+of+some+ceremonies+and+rites%2C+as+superstitious%2C+they+were+tolerated+with+much+connivancy+and+gentleness%3B+yea%2C+when+they+called+in+question+the+superiority+of+bishops%2C+and+pretended+to+a+democracy+into+the+Church+%5Bmany+were+congregationalists%5D%3B+yet+their+propositions+were+here+considered%2C+and+by+contrary+writings+debated+and+discussed.+Yet+all+this+while%2C+it+was+perceived+that+their+course+was+dangerous+and+very+popular%3A+as+because+Papistry+was+odious%2C+therefore+it+was+ever+in+their+mouths+that+they+sought+to+purge+the+Church+from+the+relics+of+Papistry%3B+a+thing+acceptable+to+the+people%2C+who+love+ever+to+run+from+one+extreme+to+another.+Because+multitude+of+rogues+and+poverty+was+an+eye-sore%2C+and+a+dislike+to+every+man%3B+therefore+they+put+into+the+people%E2%80%99s+head+that+if+discipline+were+planted%2C+there+should+be+no+vagabonds+nor+beggars%2C+a+thing+very+plausible%3A+and+in+like+manner+they+promised+the+people+many+of+the+impossible+wonders+of+their+discipline%3B+besides%2C+they+opened+to+the+people+a+way+to+government+by+their+consistory+and+presbytery+%5Bthrough+ruling+elders%5D%3B+a+thing%2C+though+in+consequence+no+less+prejudicial+to+the+liberties+of+private+men%2C+than+to+the+sovereignty+of+princes%3B+yet+in+first+show+very+popular.+Nevertheless+this%2C+except+it+were+in+some+few+that+entered+into+extreme+contempt%2C+was+born+with%2C+because+they+pretended+in+dutiful+manner+to+make+propositions%2C+and+to+leave+it+to+the+providence+of+God%2C+and+the+authority+of+the+magistrate.+But+now+of+later+years%2C+when+there+issued+from+them+that+affirmed+the+consent+of+the+magistrate+was+not+to+be+attended%3B+when+under+pretense+of+a+confession%2C+to+avoid+slander+and+imputations%2C+they+combined+themselves+by+classes+and+subscriptions%2C+when+they+descended+into+that+vile+and+base+means+of+defacing+the+government+of+the+Church%2C+by+ridiculous+pasquils+%5Bworks+of+satire%5D%2C+when+they+begun+to+make+many+subjects+in+doubt+to+take+oaths%2C+which+is+one+of+the+fundamental+parts+of+justice+in+this+land%2C+and+in+all+places%3B+when+they+began+both+to+vaunt+of+their+strength+and+number+of+their+partisans+and+followers%2C+and+to+use+cominations+%5Bthreatenings%5D+that+their+cause+would+prevail%2C+through+uproar+and+violence%2C+then+it+appeared+to+be+no+more+zeal%2C+no+more+conscience%2C+but+mere+faction+and+division%3A+and+therefore+though+the+State+were+compelled+to+hold+somewhat+a+harder+hand+to+retrain+them+than+before%2C+yet+was+it+with+as+great+moderation%2C+as+the+peace+of+the+State+or+Church+could+permit.+And+therefore%2C+sir%2C+to+conclude%2C+consider+uprightly+of+these+matters%2C+and+you+shall+see+her+Majesty+is+no+more+a+temporizer+in+religion%3A+It+is+not+the+success+abroad%2C+nor+the+change+of+servants+here+at+home%2C+can+alter+her%3B+only+as+the+things+themselves+alter%2C+she+applied+her+religious+wisdom+to+methods+correspondent+unto+them%3B+still+retaining+the+two+rules+before+mentioned%2C+in+dealing+tenderly+with+consciences%2C+and+yet+in+discovering+faction+from+conscience%2C+and+softness+from+singularity.%E2%80%9D%0A%0A%E2%80%94+Francis+Walsingham%2C+Letter+to+Monsier+Critoy%2C+in+Gilbert+Burnet%2C+The+History+of+the+Reformation+of+the+Church+of+England+2nd+ed.+%28London%3A+T.H.%2C+1683%29%2C+vol.+2%2C+pt.+2%2C+bk.+3%2C+pp.+418-20+Walsingham+%28c.+1532+%E2%80%93+1590%29+was+principal+secretary+to+Queen+Elizabeth+I+of+England+from+1573+till+his+death.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F74d20fc2b2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="pe <blockquote><p>There is a great difference between inimical segregation, like sedition in a commonwealth; and a going severally upon weighty reasons and without breach of charity. And among other weighty reasons [for this,] this may be one: That all Christians of sound faith and good life, that are dissatisfied about some human injunctions and orders in a Church, may not for lack of tender regard towards them be utterly abandoned and exposed to be led aside into the errors of the wicked, as to heresy, apostasy or a course of irreligion. It is in the power of rulers to grant this indulgence to such dissenters, when it is not in the power of dissenters to change their judgments. And this is not to set up Church against Church, or according to an ancient manner of speaking, altar against altar, but only either occasional and temporary assemblies, or at the most but diverse churches distinguished by their several places of assembling, as one parish-church from another; and by diversity of external order, as the allowed congregations of foreigners in London from the parish churches. The same true religion for the substance thereof, is exercised; and the same holy ends are pursued in the one and the other. And there will be no opposition between them but what an unchristian enmity, proceeding from worldly lusts and interests, will produce. … After such [a] Comprehension [be] setled, the toleration of all tolerable dissenters within such limits as will secure public peace and safety, is more agreeable to the wisdom and clemency of rulers, and the charity of Christians, than the rigorous constraining of the said dissenters to what they cannot bear and the restraining of them from the liberty of serving God according to their consciences.</p></blockquote>

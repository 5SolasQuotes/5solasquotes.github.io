<main class="wrap"><figure class="quote" id="q-6ea0e47cc2" data-kw="">
<blockquote><p>Without enlarging on this great subject of punishment, we shall only further remark, that a careful study of all the particular statutes of the Mosaic law in this department, together with a knowledge of those forms and circumstances of society in the Jewish nation, and among the people around it, which gave occasion to the development and application of the great principles of eternal justice, will not fail to satisfy the mind of a true inquirer as to their unchangeable rectitude, and their power of universal adaptation. It will also show it to be the will of God, that these principles should be recognised and applied by all nations who would, at the same time, willingly subserve the perfection and glory of his supreme government.

For what purpose, will any one tell, does the record of these things stand fixed in his statute-book – if not thus to teach and bind the nations of the world? Or otherwise how should men be able, either to interpret aright his moral government, or avoid the guilt of viewing his laws as essentially arbitrary, temporary, and changing? How could they escape one of the sorest evils to every government, namely, the opinion so apt to prevail, either that there is no fixed, eternal rule of justice existing; or, which amounts to the same thing, that such a rule is nowhere to be found, and cannot be certainly known?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-craig.html">Robert Craig</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theocracy or the principles of the Jewish religion and polity adapted to all nations and times</cite>, (Edinburgh, 1848), pp 292-3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-a9b3ec02df" data-kw="">
<blockquote><p>4. Distinguish between the Moral, and Ceremonial, and Judicial Law: [1.] The first concerns manners, and the right ordering of a godly conversation; and because these things are of perpetual equity and rectitude, the obligation of this Law as to that is perpetual; and therefore in the expounding of it, these two terms, Moral, and of Perpetual Authority, are all one, and to be taken so.

2. The Judical Law is for regulating outward society, and for government, and does generally (excepting what was peculiar to the people of Israel) agree with the Moral Law; this as given to them is not perpetual, their policy being at an end.

3. The Ceremonial Law is in ceremonies, types, and shadows, pointing at a Savior to come; this is also abrogate[d], the substance being come; but there is this difference, that the Judicial Law is but mortua, ‘dead’; and may, where ’tis thought fit, with the foregoing caution, be used under the New Testament; but the Ceremonial Law is mortifera, ‘deadly’, and cannot without falling from grace, Gal. 5:2,4, be revived.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law Unsealed</cite>, (1676), Preface, pp. 4-5</span></figcaption>

</figure><figure class="quote" id="q-0f3186eb5d" data-kw="">
<blockquote><p>If any man before the time prescribed shall go out of his house without license and thrust himself into the company of others, he shall be bound to begin afresh the time of shutting in and be punished beside[s] with an arbitrary [appointed] punishment. But if the same part being infected before and yet scarce well recovered, or but meetly recovered, shall adventure to do the like, he is to be accused of great unthankfulness and to be deprived of all benefits usual to be done unto him, and besides [this] to be restrained with [a] longer keeping in. But if being now in very deed infected with the plague, he shall be found to have committed this heinous offence upon notorious and wicked boldness, as a murderer after the loss of his goods [being set to die and having nothing further to lose], if he be without children, let him be delivered over unto the hangman.</p></blockquote>

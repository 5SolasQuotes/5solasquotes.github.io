<main class="wrap"><figure class="quote" id="q-2feedc2893" data-kw="">
<blockquote><p>Mr. Flavel after this, returned to Dartmouth, where with his family and dear people he blessed God for his mercies towards him. He was in a little time after confined close prisoner to his house, where many of his dear flock stole in over night, or betimes on the Lord’s Day in the morning, to enjoy the benefit of his labors, and spend the sabbath in hearing, praying, singing of psalms, and holy discourses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Flavel on the Content of Singing Public Praise to God</cite>, Life of Flavel, p. ix, vol. 1</span></figcaption>

</figure><figure class="quote" id="q-653b7211b4" data-kw="">
<blockquote><p>It is storied of Caius Marius Victorius, who lived about three hundred years after Christ, and to his old age continued a Pagan; but at last being convinced of the Christian verity, he came to Simplicianus, and told him he would be a Christian; but neither he nor the church could believe it, it being so rare an example for any to be converted at his age; but at last seeing it was real, there was a shouting and gladness, and singing of psalms in all churches; the people crying, Caius Marius Victorius. is become a Christian!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Flavel on the Content of Singing Public Praise to God</cite>, vol. 1; vol. 5, ‘Husbandry Spiritualized’, p. 120</span></figcaption>

</figure><figure class="quote" id="q-fe91d3a304" data-kw="">
<blockquote><p>Next you say, ‘Why may not the Christian Church compose new Hymnes, as they of Corinth did?’ And this you judge to be the more necessary because that David‘s Psalms have not such full and clear Hymns upon the great mysteries of the Christian belief: And you think the liberty which we plead for in prayer should much persuade it. ‘Tis answered, if you consider that Scripture, 1 Cor. 14, and particularly the 26th verse, you may understand that as the apostle’s business in the place is to set an order to the use of extraordinary gifts, wherein that Church abounded; so, the Psalms, doctrine, tongue, revelation, and interpretation there spoken of, appear to be inspired and afflatitious motions, which will not found you any argument: And you yourself do so plainly observe that these Psalms of the Corinthians were framed by private persons, that I marvel that your remembering of the thing to be extraordinary did not stop your translation of it by way of privilege to the Churches in our days. 2. Seeing the Lord hath provided us with a plentiful variety of Psalms and Hymns; and beside, hath allowed us as full a liberty of praising in prose, as of prayer, I think it doth fully remove all that is here by you objected, and abundantly warrant us both to abide content with God’s institutions, and refuse a superfluous mixture of humane odes with these divine Psalms, which He hath appointed, for the matter of our more solemn praises.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Next you say, ‘Why may not the Christian Church compose new Hymnes, as they of Corinth did?’ And this you judge to be the more necessary because that David‘s Psalms have not such full and clear Hymns upon the great mysteries of the Christian belief: And you think the liberty which we plead for in prayer should much persuade it. ‘Tis answered, if you consider that Scripture, 1 Cor. 14, and particularly the 26th verse, you may understand that as the apostle’s business in the place is to set an order to the use of extraordinary gifts, wherein that Church abounded; so, the Psalms, doctrine, tongue, revelation, and interpretation there spoken of, appear to be inspired and afflatitious motions, which will not found you any argument: And you yourself do so plainly observe that these Psalms of the Corinthians were framed by private persons, that I marvel that your remembering of the thing to be extraordinary did not stop your translation of it by way of privilege to the Churches in our days. 2. Seeing the Lord hath provided us with a plentiful variety of Psalms and Hymns; and beside, hath allowed us as full a liberty of praising in prose, as of prayer, I think it doth fully remove all that is here by you objected, and abundantly warrant us both to abide content with God’s institutions, and refuse a superfluous mixture of humane odes with these divine Psalms, which He hath appointed, for the matter of our more solemn praises.”

— Robert MacWard, The True Non-Conformist… ([Amsterdam], 1671), The Fifth Dialogue Answered. MacWard was the protege of Samuel Rutherford. He does not explicitly cite Eph. 5:19 &amp; Col. 3:16 below, but the allusions to those passages are obvious. He appears to allow for singing Scripture songs in some respect., p. 278">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNext+you+say%2C+%E2%80%98Why+may+not+the+Christian+Church+compose+new+Hymnes%2C+as+they+of+Corinth+did%3F%E2%80%99+And+this+you+judge+to+be+the+more+necessary+because+that+David%E2%80%98s+Psalms+have+not+such+full+and+clear+Hymns+upon+the+great+mysteries+of+the+Christian+belief%3A+And+you+think+the+liberty+which+we+plead+for+in+prayer+should+much+persuade+it.+%E2%80%98Tis+answered%2C+if+you+consider+that+Scripture%2C+1+Cor.+14%2C+and+particularly+the+26th+verse%2C+you+may+understand+that+as+the+apostle%E2%80%99s+business+in+the+place+is+to+set+an+order+to+the+use+of+extraordinary+gifts%2C+wherein+that+Church+abounded%3B+so%2C+the+Psalms%2C+doctrine%2C+tongue%2C+revelation%2C+and+interpretation+there+spoken+of%2C+appear+to+be+inspired+and+afflatitious+motions%2C+which+will+not+found+you+any+argument%3A+And+you+yourself+do+so+plainly+observe+that+these+Psalms+of+the+Corinthians+were+framed+by+private+persons%2C+that+I+marvel+that+your+remembering+of+the+thing+to+be+extraordinary+did+not+stop+your+translation+of+it+by+way+of+privilege+to+the+Churches+in+our+days.+2.+Seeing+the+Lord+hath+provided+us+with+a+plentiful+variety+of+Psalms+and+Hymns%3B+and+beside%2C+hath+allowed+us+as+full+a+liberty+of+praising+in+prose%2C+as+of+prayer%2C+I+think+it+doth+fully+remove+all+that+is+here+by+you+objected%2C+and+abundantly+warrant+us+both+to+abide+content+with+God%E2%80%99s+institutions%2C+and+refuse+a+superfluous+mixture+of+humane+odes+with+these+divine+Psalms%2C+which+He+hath+appointed%2C+for+the+matter+of+our+more+solemn+praises.%E2%80%9D%0A%0A%E2%80%94+Robert+MacWard%2C+The+True+Non-Conformist%E2%80%A6+%28%5BAmsterdam%5D%2C+1671%29%2C+The+Fifth+Dialogue+Answered.+MacWard+was+the+protege+of+Samuel+Rutherford.+He+does+not+explicitly+cite+Eph.+5%3A19+%26+Col.+3%3A16+below%2C+but+the+allusions+to+those+passages+are+obvious.+He+appears+to+allow+for+singing+Scripture+songs+in+some+respect.%2C+p.+278&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffe91d3a304.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fe91d3a304.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=Next%20you%20say%2C%20%E2%80%98Why%20may%20not,matter%20of%20our%20more%20solemn%20praises&amp;text=Next%20you%20say%2C%20%E2%80%98Why%20may%20not%20the%20Christian&amp;text=for%20the%20matter%20of%20our%20more%20solemn%20praises" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

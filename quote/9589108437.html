<main class="wrap"><figure class="quote" id="q-9589108437" data-kw="">
<blockquote><p>Yet this is not the whole truth of the matter. We do assert that God, that is, the whole Godhead, is one person…. In other words, we are bound to maintain the identity of the attributes of God with the being of God in order to avoid the specter of brute fact.” …Over against all other beings, that is over against created beings, we must therefore hold that God’s being presents an absolute numerical identity. And even within the ontological Trinity we must maintain that God is numerically one. He is one person. We say that we believe in a personal God we do not merely mean that we believe in a God to whom the adjective “personality” may be attached. God is not an essence that has personality; He is absolute personality. Yet, within the being of the one person we are permitted and compelled by Scripture to make the distinction between a specific or generic type of being, and three personal subsistences.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cornelius-van-til.html">Cornelius Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Introduction to Systematic Theology</cite>, (1971).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-f6dd477e42" data-kw="">
<blockquote><p>1. Whether all rites which adhere in the exercise of religion or in divine worship, whether public or private, are sacred? It is denied.

2. Whether ceremonies or rites in public worship are to be multiplied, to excite greater devotion, attention or reverence in men? It is denied.

3. Whether some ceremonies, which are called indifferent, are to be imposed on unwilling churches and ministers, indeed, under the penalty of a most grave censure, even deposition? It is denied.

4. Whether ceremonies are rightly distinguished into divine and human? It is affirmed.

5. Whether divine things are necessary for observation, at least by a necessity of divine precept? It is affirmed. For remaining questions on ceremonies, see Ecclesiastical Politics, bk. 2, tract 2.</p></blockquote>

<blockquote><p>1. Whether every instituted worship and its parts and circumstances are prescribed by the Word of God? It is affirmed.

3. Whether instituted worship is mutable? It is affirmed with a distinction.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-00823314c2" data-kw="">
<blockquote><p>Such as the worship is in Popery, where they teach and do many things contrary to the principles of faith, placing holiness and the worship of God in their own inventions, and seeking remission of sins, and the merit of eternal life in every beggarly superstitious observation and ceremony. But if by false manner of worship you understand every error, fault and corruption in matters of religion, which though they be evil and to be condemned, yet overthrow not the faith, nor the very essence of God’s true worship, but be in circumstances, or in parts that may be maimed, and yet the life remain: then I deny the proposition as most erroneous, false and heretical…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gifford.html">George Gifford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Treatise Against the Donatists of England, whom we call Brownists</cite>, ... (London, 1590) Gifford (c. 1548–1600 or 1620?) was a non-conformist, English, puritan preacher. | ‘Brownist Position’, p. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<blockquote><p>V. 11. Where it is told David that in respect he intended to build a house to God, the Lord likewise should make him a house. We see that the Lord will not suffer the good and laudable intentions of the godly to be unrewarded: much more their pious and commendable actions, no, not a cup of cold water given to one of his, which shall want its reward. Which should be a great encouragement to pious and good works.</p></blockquote>

</figure><figure class="quote" id="q-2c5554f76e" data-kw="">
<blockquote><p>We find no separation but in case of idolatry… We shall not deny but that whatsoever is practiced in the worship of God, or set up as an ordinance without God’s warrant in his Word, may be comprehended under idolatry, taking idolatry in a large sense, but that everything set up or practiced in the worship of God or in ordinances is such idolatry as is ground sufficient to separate from a Church wherein it is practiced as no true Church, is a conceit in itself without warrant of the Word, nay directly contrary to the allowed practice of God’s people in the Word, both in Old and New Testament. This conceit of Mr. Lockyer’s is very Brownism and rigid Separatism engrained.</p></blockquote>

</figure><figure class="quote" id="q-60d84d2a26" data-kw="">
<blockquote><p>But, lest any honest Christian should by his frequent distractions be discouraged from his duties, or in his holy duties, I shall… prevent such a temptation by laying down some encouragements: … The fifth encouragement is that our God can gather some sense out of a distracted duty, and do us some good by it. Rom. 8:27, ‘He that searcheth the hearts, knoweth what is the mind of the Spirit;’ ’tis true of our spirit as well as of God’s. The great searcher of hearts knows what you came pregnant with, what you meant, though you missed it in the delivery. He can tell what was written in the letter, though it did miscarry, and will answer your godly meaning, and overlook your unwilling failing, Ps. 103:13, ‘As a father pitieth his children, so the Lord…’ Why, the child comes sometimes full of a suit to the Father, and he is quite out in his tale, has forgotten what he would have, but the Father knows what he wants and what he would have said, and grants the whole. And so, provided thou be a child, and art heartily sensible of thy wants, and comest panting to the Throne of Grace; thy heavenly Father will accept thy meaning, and grant thy petition…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-steele.html">Richard Steele</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Antidote against Distractions, or an Endeavor to Serve the Church in the Daily Case of Wanderings in the Worship of God</cite>, (London: 1667), ch. 9, pp. 204, 213-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-b0723d8425" data-kw="">
<blockquote><p>V. 3… this being the first violation of the law newly given, and committed by those who should have been the strictest observers and assertors of it, did deserve a very severe punishment.” … V. 12… Moses repeats and reinforces the former command… partly to encourage them to go on in their holy services and not to be dejected for the late severity, as if God would no more accept them or their sacrifices. … V. 16. ‘The goat of the sin-offering,’… which he [Moses] inquired into more than into the other sacrifices, because a mistake there was easy and probable, because that matter might seem something doubtful, by reason of two laws concerning it seemingly contrary, the one Lev. 4:21, where it is to be burned, the other Lev. 6:26, where it was to be eaten. But they are thus reconciled: It was to be burnt when the blood of this sacrifice was brought into the holy place, Lev. 4:16, 17; and when that was not done, which Aaron this first time could not do, for the reason expressed in Lev. 10:18, it was to be eaten, and here lay their mistake… he spares Aaron at this time, as overwhelmed with sorrow, and because the rebuking of him before his sons might have exposed him to some contempt. … V.

19. ‘This day have they offered;’ they have done the substance of the thing though they have mistaken this one circumstance. ‘Such things have befallen me;’ whereby, having been oppressed with grief, and almost bereft of my reason, it is not strange nor unpardonable if I have mistaken. ‘Should it have been accepted?’ because it was not to be eaten with sorrow, but with rejoicing and thanksgiving, as appears from Dt. 12:7; Dt. 26:14; Hos. 9:4; and I thought it fitter to burn it, as I did other sacred relics, than to profane it by eating it unworthily. V.

20. He [Moses] rested satisfied with his answer, either because he thought it reasonable, seeing the letter of the law ofttimes yields to necessities or great accidents, 2 Chron. 30:18; Mt. 12:3,Mt. 12:4; or at least because the things alleged were mitigations of his fault, and he would not add affliction to the afflicted, but rather defer the debate of it to a fitter opportunity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations, on Lev</cite>, 10</span></figcaption>

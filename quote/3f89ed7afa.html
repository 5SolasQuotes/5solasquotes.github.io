<main class="wrap"><figure class="quote" id="q-3f89ed7afa" data-kw="">
<blockquote><p>Everything passes from the condition of what has been towards the condition of becoming, only through the point of being. It is this being that has potentiality. But God has not “been” (in this creaturely sense); therefore He Is from all eternity, and because He will not “become”, He Is to all eternity (Exodus 3:14). Because of this reality, God is the Existence that is uncreated, unlimited, and unchangeable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-of-clairvaux.html">Bernard of Clairvaux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love of God and Spiritual Friendship</cite>, ed. James M. Houston (Basingstoke: Pickering &amp; Inglis, 1983), p. 188.</span></figcaption>

<blockquote><p>22. II. And the formal conceptus ‘Vita’ must itself be conceived of in this threefold inadequate conception: 1. Potentia-Actus [power-act], 2. Intellectus [understanding], 3. Voluntas [will]. I call the first Potentia-Actus to avoid concretes, and to signify that as God has no potentia passiva [passive power], so his potentia activa [active power] is not an idle, ceasing power, but in perpetual perfect act; and that act is a most powerful act: so that neither potentia alone, nor actus alone, but both together, are our best conception of this first principle in the Deity. And I take it for granted that even in man’s soul, the potentia vitalis activa [vital active power], the intellect, and the will, are not, as Thomas thought, accidents, but the formal essence of the soul, as the Scotists and Nominalists better say. And I have largely elsewhere proved this, and therefore stand not here upon it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable</cite>, (London: White, 1675), sect. 3, ‘The several inadequate conceptions which in order make up our knowledge of God’, p. 4</span></figcaption>

<blockquote><p>Simplicity is God, one mere and perfect act without all composition. God calls his name, ‘I am,’ Ex. 3:14, that is, mere essence, wherein is nothing past, nor to come. Because spirits are immixed in respect of bodies, to show that He is not compounded, He says He is a Spirit, Jn. 4:24. When we say that God is a mere and perfect act, the meaning is that God is a cause without any cause, a being that is not from any being; not compounded of an act, by which He is, and possibility, by which He might not have been or may not be: of whom it never could, nor can be said that anything was to be in Him, which was not; or cannot be, that is. That God is a pure and simple act without all composition is evident, because of his perfection; all composition supposes imperfection, because He is the first Being. Were there any composition in God, it would follow there were first and second in God: Something in God that were not first, or that there were more first Beings. Because God is a Being of absolute necessity (Deus est ens necesse esse [God is necessary being]. Smising, Of the One God, tract 2, disp. 2, n. 49): Composition implies either that there must be more beings of absolute necessity, or that there is something in God that may not be. Composition supposes succession, i.e. something past or to come in God; contrary to his name, ‘I am’. Nay it supposes that not-being is not repugnant to the nature of God: Where there is composition, there may be dissolution; dissolution is the way to not-being. It much helps us in the contemplation of the simplicity of God to look upon it as opposed to composition, all the ways whereof the learned have referred to these seven heads. Composition is either of 1. Parts, which are bounded by quantity; as a body having one part upon another.

2. Matter and form; as a man of body and soul: these two compositions are only found in corporeal things.

3. General and special nature: as every species, whose common nature is to be found in some other thing, where the special nature is not; as a living creature and a man. 4.A subject and an accident; as every created substance: There are no accidents in God: He is wise, holy, just, essentially: there is not a substance and a quality in Him. When God is said only to have immortality, 1 Tim. 6:16, it is to be understood by way of eminency; He so has it as none has besides Him: He has it originally, not derivatively and by participation.

5. An act and a possibility-objective that is to be, if the thing looked at as yet is not in being; or [a possibility-]passive that is not to be (though that not-being never shall be), if the thing be looked at as in actual being: this composition holds concerning angels.

6. A person and nature; as Christ, compounded of the divine Person and human nature; which yet is not properly composition of parts, but of number.

7. Being and individuation; that is, that by which we have such a particular being, as humanity and Peter. Objection: Where there is a plurality, there is not simplicity: But in the divine nature there is a plurality: therefore. Answer: The objection holds where there is a plurality of essences, beings or things, but not where there is only a plurality of subsistences. In the divine nature, though there be a Trinity, therefore a plurality of subsistences or Persons, yet there is but one essence: In the Trinity there is distinction, but not composition. Objection 2. The attribute of simplicity concludes that all the attributes are God Himself, and consequently that there is no inequality amongst them: yet we read that his tender mercies are over all his works; so, as it may seem, mercy exceeds the other attributes. Answer: The meaning is that his mercy is over, that is, upon all his works, not that God’s mercy exceeds all his other attributes, as if one attribute were greater than another: for all the attributes of God are equal, not one higher or greater than another, because they are all God Himself. From the simplicity of God it follows:

1. That whatsoever is in God, is God.

2. Whatsoever God wills He willed from eternity and always wills.

3. Whatsoever God wills, He wills simply, absolutely and independently.

4. God is justice, wisdom, love, etc. essentially: although He be said to have them eminently, yet He has them not derivatively.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 5-7</span></figcaption>

position+is+either+of+1.+Parts%2C+which+are+bounded+by+quantity%3B+as+a+body+having+one+part+upon+another.+2.+Matter+and+form%3B+as+a+man+of+body+and+soul%3A+these+two+compositions+are+only+found+in+corporeal+things.+3.+General+and+special+nature%3A+as+every+species%2C+whose+common+nature+is+to+be+found+in+some+other+thing%2C+where+the+special+nature+is+not%3B+as+a+living+creature+and+a+man.+4.A+subject+and+an+accident%3B+as+every+created+substance%3A+There+are+no+accidents+in+God%3A+He+is+wise%2C+holy%2C+just%2C+essentially%3A+there+is+not+a+substance+and+a+quality+in+Him.+When+God+is+said+only+to+have+immortality%2C+1+Tim.+6%3A16%2C+it+is+to+be+understood+by+way+of+eminency%3B+He+so+has+it+as+none+has+besides+Him%3A+He+has+it+originally%2C+not+derivatively+and+by+participation.+5.+An+act+and+a+possibility-objective+that+is+to+be%2C+if+the+thing+looked+at+as+yet+is+not+in+being%3B+or+%5Ba+possibility-%5Dpassive+that+is+not+to+be+%28though+that+not-being+never+shall+be%29%2C+if+the+thing+be+looked+at+as+in+actual+being%3A+this+composition+holds+concerning+angels.+6.+A+person+and+nature%3B+as+Christ%2C+compounded+of+the+divine+Person+and+human+nature%3B+which+yet+is+not+properly+composition+of+parts%2C+but+of+number.+7.+Being+and+individuation%3B+that+is%2C+that+by+which+we+have+such+a+particular+being%2C+as+humanity+and+Peter.+Objection%3A+Where+there+is+a+plurality%2C+there+is+not+simplicity%3A+But+in+the+divine+nature+there+is+a+plurality%3A+therefore.+Answer%3A+The+objection+holds+where+there+is+a+plurality+of+essences%2C+beings+or+things%2C+but+not+where+there+is+only+a+plurality+of+subsistences.+In+the+divine+nature%2C+though+there+be+a+Trinity%2C+therefore+a+plurality+of+subsistences+or+Persons%2C+yet+there+is+but+one+essence%3A+In+the+Trinity+there+is+distinction%2C+but+not+composition.+Objection+2.+The+attribute+of+simplicity+concludes+that+all+the+attributes+are+God+Himself%2C+and+consequently+that+there+is+no+inequality+amongst+them%3A+yet+we+read+that+his+tender+mercies+are+over+all+his+works%3B+so%2C+as+it+may+seem%2C+mercy+exceeds+the+other+attributes.+Answer%3A+The+meaning+is+that+his+mercy+is+over%2C+that+is%2C+upon+all+his+works%2C+not+that+God%E2%80%99s+mercy+exceeds+all+his+other+attributes%2C+as+if+one+attribute+were+greater+than+another%3A+for+all+the+attributes+of+God+are+equal%2C+not+one+higher+or+greater+than+another%2C+because+they+are+all+God+Himself.+From+the+simplicity+of+God+it+follows%3A+1.+That+whatsoever+is+in+God%2C+is+God.+2.+Whatsoever+God+wills+He+willed+from+eternity+and+always+wills.+3.+Whatsoever+God+wills%2C+He+wills+simply%2C+absolutely+and+independently.+4.+God+is+justice%2C+wisdom%2C+love%2C+etc.+essentially%3A+although+He+be+said+to+have+them+eminently%2C+yet+He+has+them+not+derivatively.%E2%80%9D%0A%0A%E2%80%94+John+Norton%2C+The+Orthodox+Evangelist%2C+%E2%80%A6+%28London%3A+Macock%2C+1654%29%2C+ch.+1%2C+%E2%80%98Of+the+Divine+Essence%E2%80%99%2C+pp.+5-7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F711b1f206b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/711b1f206b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-divine-simplicity/#:~:text=Simplicity%20is%20God%2C%20one%20mere%20and,yet%20He%20has%20them%20not%20derivatively&amp;text=Simplicity%20is%20God%2C%20one%20mere%20and%20perfect%20act&amp;text=them%20eminently%2C%20yet%20He%20has%20them%20not%20derivatively" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

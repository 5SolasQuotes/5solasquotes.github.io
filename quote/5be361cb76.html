<blockquote><p>For my own Part, my Lord, notwithstanding a Folio that has been published (I presume under your Lordship’s Direction) about three Years ago, I am as much at a Loss as ever to know what were the Principles and Usages of the ancient Moravian Church; but if she was originally attired in the same Garb in which she has appeared of late amongst many true-hearted though deluded Protestants, she is not that simple, apostolical Church the English Brethren were made to believe she was about twelve Years ago. Sure I am that we can find no Traces of many of her present Practices in the yet more ancient, I mean the primitive Churches, and which, we all know, were really under an immediate and truly apostolical Inspection.

Will your Lordship be pleased to give me Leave to descend to a few Particulars? Pray, my Lord, what Instances have we of the first Christians walking round the Graves of their deceased Friends on Easter-day, attended with Hautboys, Trumpets, French horns, Violins, and other Kinds of musical Instruments? Or where have we the least Mention made of Pictures of particular Persons being brought into the first Christian Assemblies, and of Candles being placed behind them, in order to give a transparent View of these Figures?

Where was it ever known that the Picture of the Apostle Paul, representing him handing a Gentleman and Lady up to the Side of JESUS CHRIST, was ever introduced into the primitive Love-feasts? Or do we ever hear, my Lord, of Incense, or something like it, being burnt for him, in order to perfume the Room before he made his Entrance among the Brethren? Or can it be supposed that he, who, together with Barnabas, so eagerly repelled the Lyaonians, when they brought Oxen and Garlands, in order to sacrifice unto them, would ever have suffered such Things to be done for him, without expressing his Abhorrence and Detestation of them? And yet your Lordship knows both these have been done for you, and suffered by you, without your having shewn, as far as I can hear, the least Dislike of them at all.

Again, my Lord, I beg Leave to enquire whether we hear any thing in Scripture of Eldresses or Deaconnesses of the apostolical Churches seating themselves before a Table covered with artificial Flowers, against that a little Altar surrounded with Wax-tapers, on which stood a Cross composed either of mock or real Diamonds, or other glittering Stones? And yet your Lordship must be sensible this was done in Fetter-lane Chapel for Mrs. Hannah Nitschman, the present General Eldress of your Congregation, with this Addition, that all the Sisters were seated in German Caps, and cloathed in White, and the Organ also illuminated with three Pyramids of Wax-tapers, each of which was tied with a red Ribbon, and over the Head of the General Eldress was placed her own Picture, and over that (horresco referens) the Picture of the SON of GOD. — A goodly Sight this, my Lord, for a Company of English Protestants to behold! Alas! to what a long Series of childish and superstitious Devotions, and unscriptural Impositions must they have been habituated, before they could sit as silent and tame Spectators of such an antichristian Scene.</p></blockquote>

<blockquote><p>But, although these things were in principle present in Mary’s heart, she did not at that moment perceive the pledge of hope contained in them. Her grief was too profound to leave room for introspection. It even hid from her vision the objective evidence of the resurrection that lay around her. Worse than this, she turned what was intended to help her into an additional reason for unbelief. But who of us shall blame her? Have not we ourselves under as favorable circumstances made the mistake of nourishing our unbelief on what was meant to be food for our faith? Do we not all remember occasions when we stood outside the grave of our hopes weeping, and did not perceive the hand stretched out to prepare us by the very thing we interpreted as sorrow for a higher joy? From Mary’s experience let us learn to do better. What the Lord expects from us at such seasons is not to abandon ourselves to unreasoning sorrow, but trustingly to look sorrow in the face, to scan its features, to search for the help and hope, which, as surely as God is our Father, must be there. In such trials there can be no comfort for us so long as we stand outside weeping. If only we will take the courage to fix our gaze deliberately upon the stern countenance of grief, and enter unafraid into the darkest recesses of our trouble, we shall find the terror gone, because the Lord has been there before us, and, coming out again, has left the place transfigured, making out of it by the grace of his resurrection a house of life, the very gate of heaven. This was just what happened to Mary. Not forever could she stand weeping, forgetful of what went on around her. “As she wept she looked into the tomb, and she beholdeth two angels in white sitting one at the head and one at the feet, where the body of Jesus had lain.” It was a step in the right direction that she roused herself from her inaction. Still, what strikes us as most characteristic in this statement is its implying that even the vision of angels did not sufficiently impress her to raise the question, to what the appearance of these celestial messengers might be due. Probably this was the first time she had come in direct contact with the supernatural in that particular form. The place was doubtless charged with the atmosphere of mystery and wonder angels bring with themselves when entering into our world of sense. And yet no tremor seems to have run through her, no feeling of awe to have made her draw back. A greater blindness to fact is here than that which made her miss the sign of the empty grave. What more convincing evidence of the truth of the resurrection could have been offered than the presence of these two angels, silently, reverently, majestically sitting where the body of Jesus had lain? Placed like the Cherubim on the mercy-seat, they covered between themselves the spot where the Lord had reposed, and flooded it with celestial glory. It needed no voice of theirs to proclaim that here death had been swallowed up in victory. Ever since the angels descended into this tomb the symbolism of burial has been radically changed. From this moment onward every last resting-place where the bodies of believers are laid is a furrow in that great harvest field of Christ whence heaven draws upward into light each seed sunk into it, whence Christ himself was raised, the first fruits of them that sleep. Let us not overlook, however, that Mary’s disregard of the angels revealed in a most striking form something good also, to-wit: her intense preoccupation with the one thought of finding the Lord. For Him she had been looking into the tomb. He not being there, it was empty to her view, though filled with angelic glory. She would have turned aside without speaking, had not the angels of their own accord spoken to her: “Woman, why weepest thou?” These words were meant as an expression of sympathy quite natural in beings wont to rejoice over repenting sinners. But in this question there is at the same time a note of wonder at the fact that she should be weeping at all. To the mind of the angels the resurrection was so real, so self-evident, that they could scarcely understand how to her it could be otherwise. They felt, as it were, the discord between the songs of joy with which their own world was jubilant, and this sound of weeping coming out of a world of darkness and despair. “Woman, why weepest thou?” Tears would be called for indeed, hadst thou found Him in the tomb, but not at a time like this, when heaven and earth unite in announcing: He is risen in glory, the King of life! Mary’s answer to the angels shows that neither their sympathy nor their wonder had succeeded in piercing her sorrow. “She saith unto them, Because they have taken away my Lord, and I know not where they have laid Him.” These are almost the identical words in which she had informed Peter and John of her discovery of the empty tomb. Still a slight change appears. To the Apostles she had said “the Lord” and “we know not.” To the angels it is: “my Lord” and “I know not.” In this is revealed once more her intense sense of proprietorship in Jesus. In that sense the angels could not have appropriated Him for themselves. They might hail Him as their matchless King, but to Mary He was even more than this, her Lord, her Savior, the One who had sought and saved and owned her in her sins.</p></blockquote>

</figure><figure class="quote" id="q-9d3aa48cd2" data-kw="">
<blockquote><p>IN the blessed Life of our Saviour we read once and again of his going into the Synagogues, to attend the public Worship of God on the Sabbath days. Luke 4.6. As his Custom was he went into the Synagogue on the Sabbath day. This he did to teach and require us to keep the Sabbath as he did. He has given us this Example that we should follow his steps. So he served and worshiped God, fulfilling all Righteousness, and so must we. He came not to destroy the Law and the Prophets, but to fulfil them. Had he put an end to the Sacred weekly Sabbath, it had destroyed the Law and the Prophets with a witness.

But Christ fulfilled this Law, and kept many a Sabbath to the glory of God in a perfect manner, so as no mere man, nor all the Holy men of God together, ever did or can do. He has taught us how to Sabbatise; how to spend our Sabbaths in the solemn Assemblies, and in works of piety and mercy. Many a high Exercise of devotion, and many a good work of charity, did he upon the Sabbath-day. He fill’d up the Holy time with work, and the work with Spirit. For these very works of God like goodness he was sometimes reproached as a breaker of the Sabbath; but it turned to the confusion of his ignorant and superstitious, if not hypocritical and malicious Accusers. As in Mark 3. Init. He sanctified and honoured the Sabbath by his divine Sermons, and by his miracles of mercy on that blessed day. He made it a Day of his Blessing to men, both on temporal and spiritual accounts. Luk. 13.10, 17.

He kept that blessed Law for his Elect, which Believers themselves keep so poorly and imperfectly.—He also taught his Disciples and followers to observe and keep the Sabbath-day, Indeed some of the superstitious Pharisees did sometimes tax the Disciples with taking undue liberties on the Holy Sabbath. But what was it? they plucked an ear of corn and eat of it as they passed thro’ a field. They were hungry and it was but a proper and needed taste, and an ordinary hasty bit, for their support and refreshment in the services of the day.

The Women also that followed our Lord Jesus, and ministered unto him, were strict Sabbatizers: Luk. 23. ult. They rested on the Sabbath day according to the Commandment. Tho’ they were preparing spices for the dead body of their dear Saviour, yet they laid by the holy care and labour of love till the Sabbath was over. Verily God’s Sabbaths did they keep; even as if the words of my Text were then in their remembrance, and they considered that as the holy work of the Tabernacle was to give place to the holy Rest of God’s day, so their pious ministering to that sacred Temple of the Deity, our Lord’s Body.—And that was the last Seventh day Sabbath which the Disciples kept.

For early in the morning of the next day, being the first day of the week these Women came unto the Sepulchre, bringing the Spices which they had prepared; and they found not the Body of Jesus, but had a vision of Angels who told them of his resurrection from the dead.— And that same day the Lord himself appeared several times to one and another of his Followers; to Mary Magdalene, to the two disciples on their way to Emmaus, to Simon, and to the ten together in the Evening: when he blessed them, breathed on ’em, and gave them their Commission.

That day seven night, being again the first day of the week, the Lord appeared again unto them, Thomas being then present, and shewed them his hands and his feet.— Now by the Resurrection of Christ on the first day of the week, and by his repeated visits to them on this day, the Inspired Apostles (under the infallible Conduct of the Holy Ghost) from thenceforth held their solemn Meetings, their holy Convocations, on this day of the seven, and called it the Lord’s-Day.— On this first day of the week, the Disciples were all with one accord in one place, assembled as on their holy Sabbath, when suddenly there appeared the cloven Tongues of fire and sat upon them, and they were all filled with the Holy Ghost; and spake in every language the wonderful works of God; the proper service of the Sabbath day.

That this day of Pentecost was the first day of the week is easily computed and proved. The day after the Passover was the first day of the feast of unleavened bread; (see Lev. 23.5, 6.) which was as a Sabbath to the Jews; They were to have an holy Convocation on it, and to do no servile work thereon. On the next day was the Offering of the first-fruits unto the Lord: And from this day, (the next but one after the Passover) they were ordered to count fifty days, or seven weeks complete; and then was the feast of Pentecost, so called from the fiftieth day.

Now see how these things were all fulfilled in the Dying and Resurrection of our Lord Jesus, and in the pouring out of the Spirit on the day of Pentecost.— Our blessed Lord Jesus was slain at the Passover, which fell that year on a fryday: Then was the Lamb of God offered, Christ our Passover sacrificed for us.— That Evening therefore was the preparation, as it is called John 19.31. scil. the preparation both for the weekly Sabbath, and also for the Feast of unleavened bread; which made that Sabbath a high day. The Jews therefore were earnest with Pilate to have the Bodies taken down early from the Cross. This whole Sabbath our Lord’s Body lay in the grave.

And the next morning early, being the first day of the week, the next day but one after the Passover, the day of the offering of the first-fruits unto the Lord, he rose from the dead, and became the first-fruits of them that sleep. Now compute just seven weeks from this day of our Lord’s Resurrection, and the first day of the eighth week, even the fiftieth day, was the day of Pentecost; when the Spirit, (the promise of the Father) was poured out from the ascended Jesus upon his Apostles, as they were assembled together for his solemn Worship.</p></blockquote>

y.%E2%80%94He+also+taught+his+Disciples+and+followers+to+observe+and+keep+the+Sabbath-day%2C+Indeed+some+of+the+superstitious+Pharisees+did+sometimes+tax+the+Disciples+with+taking+undue+liberties+on+the+Holy+Sabbath.+But+what+was+it%3F+they+plucked+an+ear+of+corn+and+eat+of+it+as+they+passed+thro%E2%80%99+a+field.+They+were+hungry+and+it+was+but+a+proper+and+needed+taste%2C+and+an+ordinary+hasty+bit%2C+for+their+support+and+refreshment+in+the+services+of+the+day.%0A%0AThe+Women+also+that+followed+our+Lord+Jesus%2C+and+ministered+unto+him%2C+were+strict+Sabbatizers%3A+Luk.+23.+ult.+They+rested+on+the+Sabbath+day+according+to+the+Commandment.+Tho%E2%80%99+they+were+preparing+spices+for+the+dead+body+of+their+dear+Saviour%2C+yet+they+laid+by+the+holy+care+and+labour+of+love+till+the+Sabbath+was+over.+Verily+God%E2%80%99s+Sabbaths+did+they+keep%3B+even+as+if+the+words+of+my+Text+were+then+in+their+remembrance%2C+and+they+considered+that+as+the+holy+work+of+the+Tabernacle+was+to+give+place+to+the+holy+Rest+of+God%E2%80%99s+day%2C+so+their+pious+ministering+to+that+sacred+Temple+of+the+Deity%2C+our+Lord%E2%80%99s+Body.%E2%80%94And+that+was+the+last+Seventh+day+Sabbath+which+the+Disciples+kept.%0A%0AFor+early+in+the+morning+of+the+next+day%2C+being+the+first+day+of+the+week+these+Women+came+unto+the+Sepulchre%2C+bringing+the+Spices+which+they+had+prepared%3B+and+they+found+not+the+Body+of+Jesus%2C+but+had+a+vision+of+Angels+who+told+them+of+his+resurrection+from+the+dead.%E2%80%94+And+that+same+day+the+Lord+himself+appeared+several+times+to+one+and+another+of+his+Followers%3B+to+Mary+Magdalene%2C+to+the+two+disciples+on+their+way+to+Emmaus%2C+to+Simon%2C+and+to+the+ten+together+in+the+Evening%3A+when+he+blessed+them%2C+breathed+on+%E2%80%99em%2C+and+gave+them+their+Commission.%0A%0AThat+day+seven+night%2C+being+again+the+first+day+of+the+week%2C+the+Lord+appeared+again+unto+them%2C+Thomas+being+then+present%2C+and+shewed+them+his+hands+and+his+feet.%E2%80%94+Now+by+the+Resurrection+of+Christ+on+the+first+day+of+the+week%2C+and+by+his+repeated+visits+to+them+on+this+day%2C+the+Inspired+Apostles+%28under+the+infallible+Conduct+of+the+Holy+Ghost%29+from+thenceforth+held+their+solemn+Meetings%2C+their+holy+Convocations%2C+on+this+day+of+the+seven%2C+and+called+it+the+Lord%E2%80%99s-Day.%E2%80%94+On+this+first+day+of+the+week%2C+the+Disciples+were+all+with+one+accord+in+one+place%2C+assembled+as+on+their+holy+Sabbath%2C+when+suddenly+there+appeared+the+cloven+Tongues+of+fire+and+sat+upon+them%2C+and+they+were+all+filled+with+the+Holy+Ghost%3B+and+spake+in+every+language+the+wonderful+works+of+God%3B+the+proper+service+of+the+Sabbath+day.%0A%0AThat+this+day+of+Pentecost+was+the+first+day+of+the+week+is+easily+computed+and+proved.+The+day+after+the+Passover+was+the+first+day+of+the+feast+of+unleavened+bread%3B+%28see+Lev.+23.5%2C+6.%29+which+was+as+a+Sabbath+to+the+Jews%3B+They+were+to+have+an+holy+Convocation+on+it%2C+and+to+do+no+servile+work+thereon.+On+the+next+day+was+the+Offering+of+the+first-fruits+unto+the+Lord%3A+And+from+this+day%2C+%28the+next+but+one+after+the+Passover%29+they+were+ordered+to+count+fifty+days%2C+or+seven+weeks+complete%3B+and+then+was+the+feast+of+Pentecost%2C+so+called+from+the+fiftieth+day.%0A%0ANow+see+how+these+things+were+all+fulfilled+in+the+Dying+and+Resurrection+of+our+Lord+Jesus%2C+and+in+the+pouring+out+of+the+Spirit+on+the+day+of+Pentecost.%E2%80%94+Our+blessed+Lord+Jesus+was+slain+at+the+Passover%2C+which+fell+that+year+on+a+fryday%3A+Then+was+the+Lamb+of+God+offered%2C+Christ+our+Passover+sacrificed+for+us.%E2%80%94+That+Evening+therefore+was+the+preparation%2C+as+it+is+called+John+19.31.+scil.+the+preparation+both+for+the+weekly+Sabbath%2C+and+also+for+the+Feast+of+unleavened+bread%3B+which+made+that+Sabbath+a+high+day.+The+Jews+therefore+were+earnest+with+Pilate+to+have+the+Bodies+taken+down+early+from+the+Cross.+This+whole+Sabbath+our+Lord%E2%80%99s+Body+lay+in+the+grave.%0A%0AAnd+the+next+morning+early%2C+being+the+first+day+of+the+week%2C+the+next+day+but+one+after+the+Passover%2C+the+day+of+the+offering+of+the+first-fruits+unto+the+Lord%2C+he+rose+from+the+dead%2C+and+became+the+first-fruits+of+them+that+sleep.+Now+compute+just+seven+weeks+from+this+day+of+our+Lord%E2%80%99s+Resurrection%2C+and+the+first+day+of+the+eighth+week%2C+even+the+fiftieth+day%2C+was+the+day+of+Pentecost%3B+when+the+Spirit%2C+%28the+promise+of+the+Father%29+was+poured+out+from+the+ascended+Jesus+upon+his+Apostles%2C+as+they+were+assembled+together+for+his+solemn+Worship.%E2%80%9D%0A%0A%E2%80%94+Benjamin+Colman%2C+The+doctrine+and+law+of+the+Holy+Sabbath%3A+in+the+order+wherein+it+lies+through+the+Scriptures+of+the+Old+and+New+Testament.+In+two+sermons%2C+preached+at+the+lecture+in+Boston%2C+October+15.+and+December+10.+1724%2C+%28Boston%3A+Thomas+Hancock%2C+1725%29%2C+pp+24-27.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9d3aa48cd2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9d3aa48cd2.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/01/02/benjamin-colman-on-christs-example-for-sabbath-observance/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>In all religious commands there must appear to the person that obeys some reason from a divine command; either particularly or generally requiring the thing. The mere will and authority of an another in these things is not reason enough to justify our obedience. In matters of that nature we must be very wary of idle and superfluous actions. To be of no use and insignificant is enough in worship to make a gesture or action sinful, yea, and an appropriated habit [garment] too. There lies no necessity upon the superior to command any such things, nay, to do it will be a sin unto him, as Gideon’s ephod was a snare to his house, Judg. 8:27.</p></blockquote>

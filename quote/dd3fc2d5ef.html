<main class="wrap"><figure class="quote" id="q-dd3fc2d5ef" data-kw="">
<blockquote><p>XIX… I. The moral precepts are known by nature, and therefore eternal, and obligate all men: The rest are not so. II. The moral precepts are the principal worship of God; the ceremonial and forensic are subordinate, but serve the moral precepts, and therefore yield to them. III. The moral precepts obligate all rational creatures; the others obligate the Jews only. IV. The ceremonial and forensic are typical; the moral are antitypical. V. The moral are general; the ceremonial and forensic are special and determinate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomar.html">Francis Gomar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>’15th of the Theological Disputations, on the Law of God’ (Leiden: Patius, 1603), trans. AI at Confessionally Reformed Theology Latin</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-17c8f5d1fa" data-kw="">
<blockquote><p>If truly the consequence is made good only by the will of governors, then this consequence will be valid: All such things are orderly and decent; therefore, let the calf of Aaron be made and openly worshiped, for worship in such a visible way is by [the will of] the governors. A good consequence is one which stands indivisible: then it is a good consequence or not a good consequence. This consequence, however, where the truth has been mixed, depending partly on reason and partly on the will of men, is nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rutherford’s Examination of Arminianism: the Tables of Contents with Excerpts from Every Chapter tr. Charles Johnson &amp; Travis Fentiman (1638-1642; 1668; RBO, 2019), ch. 1, section 17</cite>, p. 48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-1873affc2a" data-kw="">
<blockquote><p>Application 1: This may first let us see that notwithstanding the reformation of religion, Christ may be pleased rather to live abroad in the fields than at home, where the people would willingly assemble: The house of God was now repaired, and the bed green: and the Church invites Christ to come in unto her, in it, yet He disposes Himself so, as more willing to call her abroad. So we may see that notwithstanding the purity and simplicity of Christ’s worship, yet Christ is not bound to any place; if things were never so reformed, yet He might leave us, and go into the wild field. Rome has long doted on Peter’s Chair, and Jerusalem might as well have bragged of her privileges as any other place, but Christ leaves them: Never rest we then in any outward estate, for Christ may leave us. The Palatinate [Germany] has been as reformed as any Church for doctrine, and though they might say, their bed was green, and their beams were of cedar, and their rafters of fir, yet God has left them: for do we think that if God had been there, these things had befallen them that now are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canticles, or Song of Songs, Opened &amp; Explained… (London, 1642)</cite>, ch. 2, pp. 60-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-e284ea526b" data-kw="">
<blockquote><p>Therefore, a true and worthy esteem of God and other acts manifesting esteem constitute, as it were, the first matter of religion. Every honest, human act making for the honor and glory of God may be the matter or material object of religion. It is one and the same act which as submission to commandment is called obedience and as honor to God is called religion and worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology, ed. John Eusden (1639; Grand Rapids: Baker, 1997), bk. 2, ch. 4, ‘Religion’, section 24</cite>, p. 239.</span></figcaption>

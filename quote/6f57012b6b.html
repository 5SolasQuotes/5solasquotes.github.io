<main class="wrap"><figure class="quote" id="q-6f57012b6b" data-kw="">
<blockquote><p>There is also the interaction with the elements by the minister who sprinkles the water, breaks the bread, pours the wine, and passes around the poured wine and the broken bread; and likewise by the communicant, who receives, takes, eats, and drinks them. These actions themselves also have their meaning and application.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, (RHB), vol. 2, pp. 474, 529 &amp; 532</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-29576b744b" data-kw="">
<blockquote><p>Paul says [in 1 Cor. 11:20] that in this way it is not the Lord’s supper that is partaken of — not that a single abuse altogether set aside the sacred institution of Christ, and reduced it to nothing, but that they polluted the sacrament by observing it in a wrong way. For we are accustomed to say, in common conversation, that a thing is not done at all, if it is not done aright. Now this was no trivial abuse, as we shall afterwards see. If you understand the words is not as meaning, is not allowable, the meaning will amount to the same thing… he condemns that profane admixture, which had nothing in it akin to the Lord’s Supper.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 11, verse 20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-9799096ce7" data-kw="">
<blockquote><p>In administering the Supper I have sometimes made use of the words of Paul; but since they could not be repeated for each individual without causing too long a delay (and if, during the reading, several persons went forward, scarcely one in ten could apprehend what I intended, and no one perceived the sentence as a whole), I preferred to desist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Question of some Ecclesiastical Rites’</cite>, (1561) in Opera, vol. 10, pt. 1, Consilia, col. 213</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-bd3e2f5fb8" data-kw="">
<blockquote><p>Provided always, That the clause in the Directory, of the administration of the Lord’s Supper, which metions the communicants sitting about the table, or at it, be not interpreted as if, in the judgment of this kirk, it were indifferent, and free for any of the communicants not to come to, and receive at the table; or as if we did approve the distributing of the elements by the minister to each communicant, and not by the communicants among themselves…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Directory for Public Worship</cite>, The Adopting Act of 1645</span></figcaption>

</figure><figure class="quote" id="q-f4f0adf507" data-kw="">
<blockquote><p>II. …This latter opinion [of Martin Luther] is followed by the Lutherans of our day. They maintain that to break means nothing else than to distribute the bread and give it to another; although they do not deny that Christ properly broke the bread. But this ceremony [of breaking the bread] is merely free and indifferent, lacking a command, which the church can at pleasure observe or omit… III. The [reformed] orthodox retain the breaking which was employed by the Lord… They think it is not an accidental and indifferent ceremony, but according to the institution of Christ, no less necessary than taking it in the hand, delivering and communing. Nor yet do they wish to contend so rigidly about it that no fellowship can be retained with those who omit it. they think this want [lack] of a thing not unimportant should neither be left unnoticed, nor tolerated if it can be corrected. Thus they are to be rebuked who hold this opinion, although they are not to be absolutely condemned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 3, 19th Topic, ‘The Sacraments’, section 3, p. 443</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

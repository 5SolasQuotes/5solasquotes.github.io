<blockquote><p>49… When a rebel rose up against his prince and got but the stronger party and possession, how quickly did they [degenerate bishops] flatter him and own him. I find but one bishop besides St. Martin in all France and that part of Germany, that disowned Maximus that murdered Gratian: The rest applauded him for their own ends: Nor in that part of Italy I find not any besides Ambrose and one Hyginus that disowned him. (Not that I think it my part to condemn all the holy bishops who professed subjection to usurpers in possession: Even holy Ambrose could write to the odious tyrant Eugenius (Clementissimo Imperatori Eugenio) concluding, nam cum privato detulerim corde intimo, quomodo non deferrem Imperatori, ‘When I honored thee a private man from the bottom of my heart, how can I but honor thee being emperor?’ And how far have the Roman bishops gone in this, even to Phocas and such as he?)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Episcopacy… (London: Simmons, 1681) | pt. 1, ch. 3</cite>, pp. 23-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>For the chief convenience of a State is that people might be kept from inconvenience or incommoding one another and that they may be conserved in a liberty to do other good things according to piety and honesty: So that he who does things in themselves good, though under an unlawful civil magistrate, does not by those acts assert any magistrate’s right, but his only who originally gave law and rules for those internal acts, and that is God’s right alone.</p></blockquote>

<blockquote><p>§13. Question 8: May I give money to a judge or justice or court-officer to hire him to do me justice or to keep him from doing me wrong or to avoid persecution? Answer: You may not, in case your cause be bad, give anything to procure injustice against another; no nor speak a word for it nor desire it: This I take as presupposed. You may not give money to procure justice when the law of the land forbids it and when it will do more hurt accidentally to others than good to you: when it will harden men in the sin of bribery and cause them to expect the like from others. But except it be when some such accidental greater hurt does make it evil, it is as lawful as to hire a thief not to kill me; when you cannot have your right by other means, you may part with a smaller matter for a greater. §14. Question 9. But if I make such a contract, may the other lawfully take it of me? Answer: No: for it is now supposed that it is unlawful on his part. §15. Question 10. But if under necessity or force I promise money to a robber or a judge or officer, am I bound to perform it when necessity is over? Answer: You have lost your own propriety by your covenant and therefore must not retain it. But he can acquire no right by his sin; and therefore some say that in point of justice you are not bound to give it him, but to give it to the magistrate for the poor. But yet prudence may tell you of other reasons a fine to give it the man himself, though justice bind you not to it: as in case that else he may be revenged and do you some greater hurt, or some greater hurt is any other way likely to be the consequent, which it is lawful by money to prevent. But many think that you are bound to deliver the money to the thief or officer himself, because it is a lawful thing to do it, though he have no just title to it; and because it was your meaning, or the signification of your words in your covenant with him. And if it were not lawful to do it, it could not be lawful to promise to do it: otherwise your promise is a lie. To this, those of the other opinion say that as a man who is discharged of his promise by him that it was made to is not to be accounted false if he perform it not, so is it as to the thief or officer in question, because he having no right, is to you as the other that has quit his right. And this answer indeed will prove that it is not strict injustice not to pay the money promised: but it will not prove that it is not a lie to make such a promise with an intent of not-performing it, or that it is not a lie to make it with an intent of performing it, and not to do it when you may. Though here a Jesuit will tell you that you may say the words of a promise with an equivocation or mental reservation, to a thief or persecuting magistrate (of which see more in the chapters of lying, vows and perjury). I am therefore of opinion that your promise must be sincerely made and according to the true intent of it, you must offer the money to the thief or officer; except in case the magistrate forbid you, or some greater reason lie against it, which you foresaw not when you made the promise. But the offender is undoubtedly obliged not to take the money. §16. The same determination holds as to all contracts and promises made to such persons who by injurious force constrained us to make them. There is on us an obligation to veracity, though none to them in point of justice, because they have no proper right; nor may they lawfully take our payment or service promised them. And in case that the public good unexpectedly cross our performance, we must not perform it: Such like is the case of conquerors, and those that upon conquest become their vassals or subjects upon unrighteous terms. But still remember, that if it be not only a covenant with man, but a vow to God, which makes him a party, the case is altered, and we remain obliged. §17. Question 11. But may I promise the thief or bribe-taker to conceal his fault? and am I obliged to the performance of such a promise? Answer: This is a promise of omitting that which else would be a duty. It is ordinarily a duty to reveal a thief and bribe-taker that he may be punished. But affirmatives bind not ad semper [to all times]: no act (especially external) is a duty at all times: therefore not this of revealing an offender’s fault. And if it be not always a duty, then it must be none when it is inconsistent with some greater benefit or duty: For when two goods come together, the greater is to be preferred. Therefore in case that you see in just probability that the concealment of the sinner will do more hurt to the commonwealth or the souls of men than the saving of your life is like to do good, you may not promise to conceal him: or if you sinfully promise it, you may not perform it. But in case that your life is likely to be a greater good than the not promising to conceal him, then such a promise is no fault; because the disclosing him is no duty. But to judge rightly of this is a matter of great difficulty. If it be less than life which you save by such a promise, it oft falls out that it is a lesser good than the detecting of the offence. §18. But it will here be said, ‘If I promise not to conceal a robber, I must conceal him nevertheless; for when he has killed me, I cannot reveal him; and I must conceal the bribe-taker, for till I have promised secrecy, I cannot prove him guilty. And he that promises to forbear a particular good action whilst he lives, does yet reserve his life for all other good works: whereas if he die, he will neither do that nor any other.’ But this case is not so easily determined: If Daniel die, he can neither pray nor do any other good on earth. And if he live, he may do much other good though he never pray: and yet he might not promise to give over praying to save his life. I conceive that we must distinguish of duties essential to the outward part of Christianity, or of constant indispensable necessity, and duties which are alterable and belong only to some persons, times and places: Also between the various consequents of omissions. And I conceive that ordinarily a man may promise for the saving of his life that he will forbear a particular alterable duty or relation: as to read such a commentary, to speak with such a minister, to be a magistrate or a minister, etc. in case we have not before bound ourselves never to give over our calling till death: and in case that the good which will follow our forbearance is likely (to a judicious person) to be greater than the evil. But no man may promise to omit such a duty as God has made necessary during life: as not to love God or fear or trust Him: not to worship Him and call upon Him and praise Him: nor to do good to men’s souls or bodies in the general: or not to preach or pray while I am a minister of Christ, or not at all to govern while you are a governor. For all these contradict some former and greater promises or duties. Nor may you omit the smallest duty to save your life at such a time when your death is likely to do more good than your life would do without that one duty. Apply this to the present case.</p></blockquote>

ing+to+do+it%2C+though+he+have+no+just+title+to+it%3B+and+because+it+was+your+meaning%2C+or+the+signification+of+your+words+in+your+covenant+with+him.+And+if+it+were+not+lawful+to+do+it%2C+it+could+not+be+lawful+to+promise+to+do+it%3A+otherwise+your+promise+is+a+lie.+To+this%2C+those+of+the+other+opinion+say+that+as+a+man+who+is+discharged+of+his+promise+by+him+that+it+was+made+to+is+not+to+be+accounted+false+if+he+perform+it+not%2C+so+is+it+as+to+the+thief+or+officer+in+question%2C+because+he+having+no+right%2C+is+to+you+as+the+other+that+has+quit+his+right.+And+this+answer+indeed+will+prove+that+it+is+not+strict+injustice+not+to+pay+the+money+promised%3A+but+it+will+not+prove+that+it+is+not+a+lie+to+make+such+a+promise+with+an+intent+of+not-performing+it%2C+or+that+it+is+not+a+lie+to+make+it+with+an+intent+of+performing+it%2C+and+not+to+do+it+when+you+may.+Though+here+a+Jesuit+will+tell+you+that+you+may+say+the+words+of+a+promise+with+an+equivocation+or+mental+reservation%2C+to+a+thief+or+persecuting+magistrate+%28of+which+see+more+in+the+chapters+of+lying%2C+vows+and+perjury%29.+I+am+therefore+of+opinion+that+your+promise+must+be+sincerely+made+and+according+to+the+true+intent+of+it%2C+you+must+offer+the+money+to+the+thief+or+officer%3B+except+in+case+the+magistrate+forbid+you%2C+or+some+greater+reason+lie+against+it%2C+which+you+foresaw+not+when+you+made+the+promise.+But+the+offender+is+undoubtedly+obliged+not+to+take+the+money.+%C2%A716.+The+same+determination+holds+as+to+all+contracts+and+promises+made+to+such+persons+who+by+injurious+force+constrained+us+to+make+them.+There+is+on+us+an+obligation+to+veracity%2C+though+none+to+them+in+point+of+justice%2C+because+they+have+no+proper+right%3B+nor+may+they+lawfully+take+our+payment+or+service+promised+them.+And+in+case+that+the+public+good+unexpectedly+cross+our+performance%2C+we+must+not+perform+it%3A+Such+like+is+the+case+of+conquerors%2C+and+those+that+upon+conquest+become+their+vassals+or+subjects+upon+unrighteous+terms.+But+still+remember%2C+that+if+it+be+not+only+a+covenant+with+man%2C+but+a+vow+to+God%2C+which+makes+him+a+party%2C+the+case+is+altered%2C+and+we+remain+obliged.+%C2%A717.+Question+11.+But+may+I+promise+the+thief+or+bribe-taker+to+conceal+his+fault%3F+and+am+I+obliged+to+the+performance+of+such+a+promise%3F+Answer%3A+This+is+a+promise+of+omitting+that+which+else+would+be+a+duty.+It+is+ordinarily+a+duty+to+reveal+a+thief+and+bribe-taker+that+he+may+be+punished.+But+affirmatives+bind+not+ad+semper+%5Bto+all+times%5D%3A+no+act+%28especially+external%29+is+a+duty+at+all+times%3A+therefore+not+this+of+revealing+an+offender%E2%80%99s+fault.+And+if+it+be+not+always+a+duty%2C+then+it+must+be+none+when+it+is+inconsistent+with+some+greater+benefit+or+duty%3A+For+when+two+goods+come+together%2C+the+greater+is+to+be+preferred.+Therefore+in+case+that+you+see+in+just+probability+that+the+concealment+of+the+sinner+will+do+more+hurt+to+the+commonwealth+or+the+souls+of+men+than+the+saving+of+your+life+is+like+to+do+good%2C+you+may+not+promise+to+conceal+him%3A+or+if+you+sinfully+promise+it%2C+you+may+not+perform+it.+But+in+case+that+your+life+is+likely+to+be+a+greater+good+than+the+not+promising+to+conceal+him%2C+then+such+a+promise+is+no+fault%3B+because+the+disclosing+him+is+no+duty.+But+to+judge+rightly+of+this+is+a+matter+of+great+difficulty.+If+it+be+less+than+life+which+you+save+by+such+a+promise%2C+it+oft+falls+out+that+it+is+a+lesser+good+than+the+detecting+of+the+offence.+%C2%A718.+But+it+will+here+be+said%2C+%E2%80%98If+I+promise+not+to+conceal+a+robber%2C+I+must+conceal+him+nevertheless%3B+for+when+he+has+killed+me%2C+I+cannot+reveal+him%3B+and+I+must+conceal+the+bribe-taker%2C+for+till+I+have+promised+secrecy%2C+I+cannot+prove+him+guilty.+And+he+that+promises+to+forbear+a+particular+good+action+whilst+he+lives%2C+does+yet+reserve+his+life+for+all+other+good+works%3A+whereas+if+he+die%2C+he+will+neither+do+that+nor+any+other.%E2%80%99+But+this+case+is+not+so+easily+determined%3A+If+Daniel+die%2C+he+can+neither+pray+nor+do+any+other+good+on+earth.+And+if+he+live%2C+he+may+do+much+other+good+though+he+never+pray%3A+and+yet+he+might+not+promise+to+give+over+praying+to+save+his+life.+I+conceive+that+we+must+distinguish+of+duties+essential+to+the+outward+part+of+Christianity%2C+or+of+constant+indispensable+necessity%2C+and+duties+which+are+alterable+and+belong+only+to+some+persons%2C+times+and+places%3A+Also+between+the+various+consequents+of+omissions.+And+I+conceive+that+ordinarily+a+man+may+promise+for+the+saving+of+his+life+that+he+will+forbear+a+particular+alterable+duty+or+relation%3A+as+to+read+such+a+commentary%2C+to+speak+with+such+a+minister%2C+to+be+a+magistrate+or+a+minister%2C+etc.+in+case+we+have+not+before+bound+ourselves+never+to+give+over+our+calling+till+death%3A+and+in+case+that+the+good+which+will+follow+our+forbearance+is+likely+%28to+a+judicious+person%29+to+be+greater+than+the+evil.+But+no+man+may+promise+to+omit+such+a+duty+as+God+has+made+necessary+during+life%3A+as+not+to+love+God+or+fear+or+trust+Him%3A+not+to+worship+Him+and+call+upon+Him+and+praise+Him%3A+nor+to+do+good+to+men%E2%80%99s+souls+or+bodies+in+the+general%3A+or+not+to+preach+or+pray+while+I+am+a+minister+of+Christ%2C+or+not+at+all+to+govern+while+you+are+a+governor.+For+all+these+contradict+some+former+and+greater+promises+or+duties.+Nor+may+you+omit+the+smallest+duty+to+save+your+life+at+such+a+time+when+your+death+is+likely+to+do+more+good+than+your+life+would+do+without+that+one+duty.+Apply+this+to+the+present+case.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Christian+Directory+%28London%2C+1673%29%2C+pt.+4%2C+ch.+19%2C+title+2%2C+p.+116-17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fca12e1cddd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ca12e1cddd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=13.%20Question%208%3A%20May%20I%20give,Apply%20this%20to%20the%20present%20case&amp;text=13.%20Question%208%3A%20May%20I%20give%20money%20to&amp;text=one%20duty.%20Apply%20this%20to%20the%20present%20case" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>This work is important as it was the first commentary on the Westminster Confession, and from its same generation. When it was printed is significant. Dickson died in 1662, when the anti-presbyterian Charles II was king. The work was first printed (in a pirated form) in 1684, in the midst of the Killing Times. While not seeking to draw too much from this, yet it does give support that the generation of Westminster divines did not understand their Confession’s teaching on upholding the validity of the rule of non-Christians, or those of different religions, as only applicable to non-Christian, non-covenanted nations, but rather that it applied to their own Christian and covenanted nations of their time (England and Scotland).</p></blockquote>

<blockquote><p>It is possible that I shall not be an eyewitness to it in the flesh, but I believe He cometh quickly who will remove our darkness, and shine gloriously in the Isle of Britain, as a crowned King, either in a formally sworn covenant, or in His own glorious way, which I leave to the determination of His infinite wisdom and goodness. And this is the hope and confidence of a dying man, who is longing and fainting for the salvation of God.</p></blockquote>

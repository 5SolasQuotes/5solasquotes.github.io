<main class="wrap"><figure class="quote" id="q-0dcd3772ee" data-kw="">
<blockquote><p>The last and worst report of all the rest [of the New England churches] is in Article 12, where he [William Rathband] reports that if any amongst us do not seek and desire church fellowship in our way, [we] account them despisers of it, yea wicked and graceless persons. To which I answer with detestation: God forbid. We speak as knowing God hears all our words; we hope we are far from such a spirit: for we know well that many gracious and precious saints there amongst us may, and sometimes do, for a good time abstain from seeking and desiring church fellowship for other grounds than despite, wickedness and gracelessness: Sometimes because they are not settled in a place: sometimes because they desire more experience of the ministers and people where they should join: some for want of clear light and full conviction of the church-ways we walk in: and some others out of many fears about their own spiritual estate before God, judging themselves (through temptation) out of a state of grace and dare not venture upon the seals, etc. whom we yet esteem precious souls and have labored by all arguments we were able to encourage to come into church fellowship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-weld.html">Thomas Weld</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to W.R.’s</cite>, [William Rathband’s] Narration of the Opinions &amp; Practices of the Churches lately Erected in New England: Vindicating those Godly &amp; Orthodoxal Churches [in New England]… (London, 1644), Answer to ch. 3, pp. 19-20 Weld (1590?–1662) was a New England congregationalist. Rathband was a moderate English puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c548ce00e1" data-kw="">
<blockquote><p>2. A second way of your communion of [congregationalist] churches, is, ‘By way of recommendation, as Paul in the behalf of Phoebe, etc.’ But this is so far from being any part of the power of the keys that it is a duty which a church or party owe to any Christian that is godly, not by virtue of any particular church-membership, but by the common interest of Christianity, yea, by the common right of humanity, even to an honest heathen, according to the Ninth Commandment, which requires us to bear true witness to our brother if we be thereto required. The letters are only declarative, of the good behaviour of the party, occasioned to remove to such a place. Was this (think you) a part of the power of the keys delivered to Peter and the rest of the apostles? Besides, if there be any virtue in these letters, to admit a member into communion, is there not a like virtue in them to excommunicate one ungodly? And if these letters dimissory have power to admit a member of one church to be a member of another, without any new covenanting, have they not the like power to admit the pastor of one church, to be a pastor of another Church, without any new ordination? which yet, I believe, you do not practice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Clavium: or, A Vindication of the Keys of the Kingdom of Heaven, into the Hands of the Right Owners. Being some Animadversions upon a Tract of Mr. John Cotton’s Called, ‘The Keys of the Kingdom of Heaven’. As also upon Another Tract of his Called, ‘The Way of the Churches of New England’. Manifesting: 1. The Weakness of his Proofs. 2. The Contradictions to Himself &amp; Others. 3. The Middle-Way</cite>, … (1645), ch. 4, ‘Of the Subject of Church-Liberty’, p. 41 Cawdrey (1588–1664) was a presbyterian Westminster divine.</span></figcaption>

<blockquote><p>3. The matter that Paul recommend Phebe for to the Roman Christians was a duty of common Christian love, to entertain her kindly as a Christian, to assist her as they could in her affairs at Rome, a duty jure naturali [by natural law] incumbent to all Christians both conjunctly and severally. And so the recommendation for that on her behalf might well be directed to all, elders and people. But interest of concurring in actings of Church government, being not juris naturalis but juris positivi [by positive law], persons must be sure of special warrant and vocation for concurring in them. So that ’tis but a very sick consequence, if letters of recommendation for such purpose, as these for Phebe, may be (or if ye will, ought to be) directed to the whole Church, then ought the whole Church also to concur in actings of Church government and jurisdiction [as in congregationalism]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-wood.html">James Wood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Little Stone Pretended to be out of the Mountain, Tried &amp; found to be a Counterfeit</cite>, … (Edinburgh, 1654), pt. 2, section 3, p. 250</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-a29675f5a3" data-kw="">
<blockquote><p>I confess, when persons are entered into a visible Church-society by baptism, if they will own that profession they were baptized into, and are not guilty either of plain ignorance of it, or manifest scandal, and demand as their right the other ordinances of the Gospel, I see not by what power they may be excluded. If we fix not in a serious visible profession as the ground of giving right, but require positive evidences of grace in every one to be admitted to ordinances as the only thing giving right, for my part, setting aside the many inconveniences besides which attend that in reference to the persons to be admitted, I see not how with a safe and good conscience ordinances can be administered by any. My reason is this: Every one, especially a minister, in that case ought to proceed upon certain grounds that the person admitted has right to the ordinance to be administered; but if positive signs of grace be required, a man’s conscience cannot proceed upon any certainty, without infallible knowledge of another’s spiritual state, which I suppose none will pretend to. My meaning is, that which gives right, must be something evident to the person admitting into it, if it be his duty to enquire after it; but if only positive signs of grace be looked on as giving right, the ground of right can never be so evident to another person, as to proceed with a good conscience, i.e. with a full persuasion of another’s right to the administration of any ordinance to him. If it be said that these are required only as tokens of a true visible profession, and it is that which gives the right, I reply, Our knowledge of, and assent to the conclusion can be no stronger, nor more certain than to the premises from whence it is inferred; if therefore true profession gives right, and our knowledge of that proceeds upon our knowledge of the work of grace, we are left at the same uncertainty we were at before. But if we say, that an outward profession of the Gospel (where there is nothing rendering men uncapable of owning it, which is ignorance, nor declaring they do not own it, which is scandal) is that which gives a visible right to the ordinances of the Church as visible, we have something to fix ourselves upon, and to bottom a persuasion of the right of persons to ordinances. Christ when He instituted Churches, did institute them as visible societies, that is, to have marks whereby to be known and distinguished, as other societies in the world are; now that which puts a difference between this and other societies, is an open profession of Christianity, which profession is looked upon as the outward expression of the internal consent of the soul to the doctrine and laws of the Gospel. Which outward evidence of consent, where there is nothing evidently and directly oppugning it, is that which the Church of God in admission of visible members is to proceed upon. I nowhere find that ever Christ or his apostles in making disciples, or admitting to Church-membership, did exact anymore than a professed willingness to adhere to the doctrine which they preached; nor that they refused any who did declare their desire to join with them. An owning Christianity is all we read of antecedent to admission of Church-members. And if anything else be further required as necessary, we must either say the Word of God is defective in institutions of necessity to the Church, which I suppose the assertors of it will not be so inconsistent to their own principles as to do; or else must produce where anything further is required by the Word of God. … 3. The reality of consent may be sufficiently manifested without an explicit [man-composed Church-] covenant, as in the joining with those who are under the same profession in the common acts of the society and acceptance of, and submission to the rulers of that society, which implicitly is that covenant which they would have expressed; and actions in this case, are as declarative and significative as words.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-stillingfleet.html">Edward Stillingfleet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum, a Weapon-Salve for the Church’s Wounds, or the Divine Right of Particular Forms of Church-Government Discussed &amp; Examined</cite>, ... (London: Mortlock, 1662), pt. 1, ch. 7, pp. 137-39</span></figcaption>

— Edward Stillingfleet, Irenicum, a Weapon-Salve for the Church’s Wounds, or the Divine Right of Particular Forms of Church-Government Discussed &amp; Examined... (London: Mortlock, 1662), pt. 1, ch. 7, pp. 137-39">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+confess%2C+when+persons+are+entered+into+a+visible+Church-society+by+baptism%2C+if+they+will+own+that+profession+they+were+baptized+into%2C+and+are+not+guilty+either+of+plain+ignorance+of+it%2C+or+manifest+scandal%2C+and+demand+as+their+right+the+other+ordinances+of+the+Gospel%2C+I+see+not+by+what+power+they+may+be+excluded.+If+we+fix+not+in+a+serious+visible+profession+as+the+ground+of+giving+right%2C+but+require+positive+evidences+of+grace+in+every+one+to+be+admitted+to+ordinances+as+the+only+thing+giving+right%2C+for+my+part%2C+setting+aside+the+many+inconveniences+besides+which+attend+that+in+reference+to+the+persons+to+be+admitted%2C+I+see+not+how+with+a+safe+and+good+conscience+ordinances+can+be+administered+by+any.+My+reason+is+this%3A+Every+one%2C+especially+a+minister%2C+in+that+case+ought+to+proceed+upon+certain+grounds+that+the+person+admitted+has+right+to+the+ordinance+to+be+administered%3B+but+if+positive+signs+of+grace+be+required%2C+a+man%E2%80%99s+conscience+cannot+proceed+upon+any+certainty%2C+without+infallible+knowledge+of+another%E2%80%99s+spiritual+state%2C+which+I+suppose+none+will+pretend+to.+My+meaning+is%2C+that+which+gives+right%2C+must+be+something+evident+to+the+person+admitting+into+it%2C+if+it+be+his+duty+to+enquire+after+it%3B+but+if+only+positive+signs+of+grace+be+looked+on+as+giving+right%2C+the+ground+of+right+can+never+be+so+evident+to+another+person%2C+as+to+proceed+with+a+good+conscience%2C+i.e.+with+a+full+persuasion+of+another%E2%80%99s+right+to+the+administration+of+any+ordinance+to+him.+If+it+be+said+that+these+are+required+only+as+tokens+of+a+true+visible+profession%2C+and+it+is+that+which+gives+the+right%2C+I+reply%2C+Our+knowledge+of%2C+and+assent+to+the+conclusion+can+be+no+stronger%2C+nor+more+certain+than+to+the+premises+from+whence+it+is+inferred%3B+if+therefore+true+profession+gives+right%2C+and+our+knowledge+of+that+proceeds+upon+our+knowledge+of+the+work+of+grace%2C+we+are+left+at+the+same+uncertainty+we+were+at+before.+But+if+we+say%2C+that+an+outward+profession+of+the+Gospel+%28where+there+is+nothing+rendering+men+uncapable+of+owning+it%2C+which+is+ignorance%2C+nor+declaring+they+do+not+own+it%2C+which+is+scandal%29+is+that+which+gives+a+visible+right+to+the+ordinances+of+the+Church+as+visible%2C+we+have+something+to+fix+ourselves+upon%2C+and+to+bottom+a+persuasion+of+the+right+of+persons+to+ordinances.+Christ+when+He+instituted+Churches%2C+did+institute+them+as+visible+societies%2C+that+is%2C+to+have+marks+whereby+to+be+known+and+distinguished%2C+as+other+societies+in+the+world+are%3B+now+that+which+puts+a+difference+between+this+and+other+societies%2C+is+an+open+profession+of+Christianity%2C+which+profession+is+looked+upon+as+the+outward+expression+of+the+internal+consent+of+the+soul+to+the+doctrine+and+laws+of+the+Gospel.+Which+outward+evidence+of+consent%2C+where+there+is+nothing+evidently+and+directly+oppugning+it%2C+is+that+which+the+Church+of+God+in+admission+of+visible+members+is+to+proceed+upon.+I+nowhere+find+that+ever+Christ+or+his+apostles+in+making+disciples%2C+or+admitting+to+Church-membership%2C+did+exact+anymore+than+a+professed+willingness+to+adhere+to+the+doctrine+which+they+preached%3B+nor+that+they+refused+any+who+did+declare+their+desire+to+join+with+them.+An+owning+Christianity+is+all+we+read+of+antecedent+to+admission+of+Church-members.+And+if+anything+else+be+further+required+as+necessary%2C+we+must+either+say+the+Word+of+God+is+defective+in+institutions+of+necessity+to+the+Church%2C+which+I+suppose+the+assertors+of+it+will+not+be+so+inconsistent+to+their+own+principles+as+to+do%3B+or+else+must+produce+where+anything+further+is+required+by+the+Word+of+God.+%E2%80%A6+3.+The+reality+of+consent+may+be+sufficiently+manifested+without+an+explicit+%5Bman-composed+Church-%5D+covenant%2C+as+in+the+joining+with+those+who+are+under+the+same+profession+in+the+common+acts+of+the+society+and+acceptance+of%2C+and+submission+to+the+rulers+of+that+society%2C+which+implicitly+is+that+covenant+which+they+would+have+expressed%3B+and+actions+in+this+case%2C+are+as+declarative+and+significative+as+words.%E2%80%9D%0A%0A%E2%80%94+Edward+Stillingfleet%2C+Irenicum%2C+a+Weapon-Salve+for+the+Church%E2%80%99s+Wounds%2C+or+the+Divine+Right+of+Particular+Forms+of+Church-Government+Discussed+%26+Examined...+%28London%3A+Mortlock%2C+1662%29%2C+pt.+1%2C+ch.+7%2C+pp.+137-39&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa29675f5a3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a29675f5a3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-church/church-membership#:~:text=I%20confess%2C%20when%20persons%20are%20entered,as%20declarative%20and%20significative%20as%20words&amp;text=I%20confess%2C%20when%20persons%20are%20entered%20into%20a&amp;text=case%2C%20are%20as%20declarative%20and%20significative%20as%20words" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

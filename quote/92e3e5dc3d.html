<main class="wrap"><figure class="quote" id="q-92e3e5dc3d" data-kw="">
<blockquote><p>Mr Alexander McLeod was ordained in the meeting house at Coldenham on the 6th July 1801 to take Charge of the united congregation of New York and Walkill as their fixed Pastor. The scattered state of the Church and other circumstances required his immediate absence, and it was not until the 25 September that he delivered his Introductory Discourse to the Church on each side of Walkill.

Again the organization of the Church session was detained by providential occurrences. There were but two elders and the absence of one on Mr McLeod’s return from New York rendered it impossible to constitute a Session until the 14th day of November, on the evening of that the elders and the minister met and agreed to Constitute the session.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/minutes-of-coldenham-reformed-presbyterian-church-session.html">Minutes of Coldenham Reformed Presbyterian Church Session</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Minutes of Coldenham Reformed Presbyterian Church Session</cite>, 6 July 1801 (Reformed Presbyterian Theological Seminary Library, Pittsburgh).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<blockquote><p>Objection 4 [by an Erastian]: When its required that the magistrates be men fearing God, hating coveteousness, etc. (Ex. 18:21; Dt. 1:16-17; 17:19-20), is not this an essential ingredient of a king as a king, that he read in the book of the Law, that he may fear God, Deut. 17? [Rutherford’s] Answer: There is a twofold goodness here to be considered: one of the magistrate as a magistrate, another as a good and Christian magistrate. The former is an official goodness, or a magistratical prudence, justice, and goodness; this is required of all magistrates, as such, to judge the people: so the acts of a heathen magistrate done according to common natural equity, by Nebuchadnezzar, Pilate, Caesar, Felix, Festus, are to be acknowledged as acts of a lawful magistrate, valid and no less essentially magistratical than if performed by King David; and of this goodness the Scriptures speak not as essential to a magistrate as a magistrate. But there is another goodness required of magistrates as they are members of the Jewish Church, and as they are Christians, and of these the Scripture speaks; and so magistrates not as magistrates, but as good and Christian, are to be such as fear God, hate covetousness, respect not the face and favor of men; so its denied that the fear of God, hating of covteousness, are essential ingredients of kings as kings. For kings as kings intend justice, peace, godliness, materially considered, both ex conditione operis [out of the nature of the work], and operantium [of those working]. But for justice and righteous judgment in a spiritual and an evangelic way, that belongs not to the essence of a magistrate, nec ex conditione seu ex intentione operis, nec ex conditione operantis [neither out of the nature or the intention of the work, nor out of the nature of the one working]: The Holy Ghost requires it of judges, as they would approve themselves as truly holy and religious, and would be accepted of God; And in this sense kings as kings do not serve God, nor the mediator Christ, nor yet as men; only they serve God and the mediator Christ as Christian Kings, or as Christian men rather.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646), ch. 24, Question 20, pp. 547-48</span></figcaption>

<blockquote><p>4. In this expression of ‘the Covenant,’ the spiritual good things promised therein are limited to Abraham and to his seed. But all infants whatsoever are not comprehended under the seed of Abraham. To say many thousands are excluded from the seals and outward administration of the Covenant, when yet everyone is partaker of the good promised in the Covenant, is to speak of ourselves, and not according to the Word of God. We will not tie the grace of God to outward means: but ordinarily we cannot affirm they pertain to the Covenant of Grace, and obtain the highest blessings promised therein, whom God does not vouchsafe so much as outwardly to receive into Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645), ch. 6, ‘Of the Covenant of Grace as it was made and manifested to Abraham’, p. 92</span></figcaption>

<blockquote><p>Then he [Satan] begins his strongest batteries, or main temptations, when we are first entering into a renewed state: Now this is most usual in the days of our youth. Thus many of our worthies observe, Mr. [Thomas] Ford, speaking of young people, faith, Amongst the usually the stream of converting grace most runs. It may be in some grace is wrought very early, even in childhood, but ordinarily ’tis after they come under catechising, and are more adult. And Mr. Burges thus, Conversion does not only belong to the old, but to the young; yea, commonly conversion is sooner wrought upon the younger sort of people; for they have not resisted the grace of God so much, they have not provoked God to give them up to their own heart’s lusts, and desires, as many ages persons have; so then let young ones hearken to sermons, let them attend to what the ministers of God exhort. Remember thy Creator in the days of thy youth; and it is good to bear the yoke in they youth; it is good to feel the bitterness of sin betimes, Eccl. 12:1; Lam. 3:27. And Vortier thus, The Lord can convert and bring home to himself at all times, in middle age, in old age, at the very last, as the thief upon the cross; yet the time of effectual calling is more ordinary in the time of youth. Some have observed the time of effectual calling to be between the years of eighteen and thirty, most commonly. And I believe that most saints experience, that the Lord wrought upon them in their younger days. Marriages are most in younger times, so are spiritual contracts in Jesus Christ. David was good when young, Daniel a young prophet; Timothy a young preacher, Samuel began with God betimes, Abijah good when a child, so was Josiah. Hammers thus, Those who in their infancy were considered as parts of their parents, and so by virtue of their parents’ membership enjoyed the ordinance of baptism; when once grown up to maturity and ripeness of years, they are to be looked upon and considered in themselves, and no longer as in their parents, and therefore as being in a capacity so to do, they ought now to take hold of the covenant for themselves, and to render a personal account of their faith. It pleases God, that many do so even very early; which agrees with the former opinion, that some are regenerated after they come under catechizing. It was the use of the Jews, as Mr. Buxtorf reports, that so soon as their circumcised children were able to speak, they taught them some select places of Scripture, and so proceeding on by degrees at thirteen years of age, they were called filii praecepti, sons of the precept; and then they were to receive the passover, as says Mr. Weem, and to observe the 613 precepts, which comprehended in them the sum of the Mosaical law, and Jewish religion, and then they themselves were accounted guilty and liable to punishment, both divine and human, if they did transgress the law, whereas before their faults were imputed to their fathers, of whom the punishment was exacted… I hope, I may say of Gentiles as well as Jews, that conversion is sometimes very early, even as early as at thirteen years of age, though it be not ordinary. And oh! how good is it for a man to bear the yoke in his youth, seeing it must be born at one time or other? The burden of sin at that age will be the lighter, the flowing of heavenly affections will be the sweeter, the removal of sin, in all likehood will be sooner, at least the surer; God having engaged Himself that ‘they that seek Him early shall find Him,’ Prov. 8:17. Satan knows all this very well, and therefore he sets a stricter watch on youth…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>War with Devils</cite>, … (d. 1663), pp. 52-54</span></figcaption>

— Isaac Ambrose, War with Devils, … (d. 1663), pp. 52-54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThen+he+%5BSatan%5D+begins+his+strongest+batteries%2C+or+main+temptations%2C+when+we+are+first+entering+into+a+renewed+state%3A+Now+this+is+most+usual+in+the+days+of+our+youth.+Thus+many+of+our+worthies+observe%2C+Mr.+%5BThomas%5D+Ford%2C+speaking+of+young+people%2C+faith%2C+Amongst+the+usually+the+stream+of+converting+grace+most+runs.+It+may+be+in+some+grace+is+wrought+very+early%2C+even+in+childhood%2C+but+ordinarily+%E2%80%99tis+after+they+come+under+catechising%2C+and+are+more+adult.+And+Mr.+Burges+thus%2C+Conversion+does+not+only+belong+to+the+old%2C+but+to+the+young%3B+yea%2C+commonly+conversion+is+sooner+wrought+upon+the+younger+sort+of+people%3B+for+they+have+not+resisted+the+grace+of+God+so+much%2C+they+have+not+provoked+God+to+give+them+up+to+their+own+heart%E2%80%99s+lusts%2C+and+desires%2C+as+many+ages+persons+have%3B+so+then+let+young+ones+hearken+to+sermons%2C+let+them+attend+to+what+the+ministers+of+God+exhort.+Remember+thy+Creator+in+the+days+of+thy+youth%3B+and+it+is+good+to+bear+the+yoke+in+they+youth%3B+it+is+good+to+feel+the+bitterness+of+sin+betimes%2C+Eccl.+12%3A1%3B+Lam.+3%3A27.+And+Vortier+thus%2C+The+Lord+can+convert+and+bring+home+to+himself+at+all+times%2C+in+middle+age%2C+in+old+age%2C+at+the+very+last%2C+as+the+thief+upon+the+cross%3B+yet+the+time+of+effectual+calling+is+more+ordinary+in+the+time+of+youth.+Some+have+observed+the+time+of+effectual+calling+to+be+between+the+years+of+eighteen+and+thirty%2C+most+commonly.+And+I+believe+that+most+saints+experience%2C+that+the+Lord+wrought+upon+them+in+their+younger+days.+Marriages+are+most+in+younger+times%2C+so+are+spiritual+contracts+in+Jesus+Christ.+David+was+good+when+young%2C+Daniel+a+young+prophet%3B+Timothy+a+young+preacher%2C+Samuel+began+with+God+betimes%2C+Abijah+good+when+a+child%2C+so+was+Josiah.+Hammers+thus%2C+Those+who+in+their+infancy+were+considered+as+parts+of+their+parents%2C+and+so+by+virtue+of+their+parents%E2%80%99+membership+enjoyed+the+ordinance+of+baptism%3B+when+once+grown+up+to+maturity+and+ripeness+of+years%2C+they+are+to+be+looked+upon+and+considered+in+themselves%2C+and+no+longer+as+in+their+parents%2C+and+therefore+as+being+in+a+capacity+so+to+do%2C+they+ought+now+to+take+hold+of+the+covenant+for+themselves%2C+and+to+render+a+personal+account+of+their+faith.+It+pleases+God%2C+that+many+do+so+even+very+early%3B+which+agrees+with+the+former+opinion%2C+that+some+are+regenerated+after+they+come+under+catechizing.+It+was+the+use+of+the+Jews%2C+as+Mr.+Buxtorf+reports%2C+that+so+soon+as+their+circumcised+children+were+able+to+speak%2C+they+taught+them+some+select+places+of+Scripture%2C+and+so+proceeding+on+by+degrees+at+thirteen+years+of+age%2C+they+were+called+filii+praecepti%2C+sons+of+the+precept%3B+and+then+they+were+to+receive+the+passover%2C+as+says+Mr.+Weem%2C+and+to+observe+the+613+precepts%2C+which+comprehended+in+them+the+sum+of+the+Mosaical+law%2C+and+Jewish+religion%2C+and+then+they+themselves+were+accounted+guilty+and+liable+to+punishment%2C+both+divine+and+human%2C+if+they+did+transgress+the+law%2C+whereas+before+their+faults+were+imputed+to+their+fathers%2C+of+whom+the+punishment+was+exacted%E2%80%A6+I+hope%2C+I+may+say+of+Gentiles+as+well+as+Jews%2C+that+conversion+is+sometimes+very+early%2C+even+as+early+as+at+thirteen+years+of+age%2C+though+it+be+not+ordinary.+And+oh%21+how+good+is+it+for+a+man+to+bear+the+yoke+in+his+youth%2C+seeing+it+must+be+born+at+one+time+or+other%3F+The+burden+of+sin+at+that+age+will+be+the+lighter%2C+the+flowing+of+heavenly+affections+will+be+the+sweeter%2C+the+removal+of+sin%2C+in+all+likehood+will+be+sooner%2C+at+least+the+surer%3B+God+having+engaged+Himself+that+%E2%80%98they+that+seek+Him+early+shall+find+Him%2C%E2%80%99+Prov.+8%3A17.+Satan+knows+all+this+very+well%2C+and+therefore+he+sets+a+stricter+watch+on+youth%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Isaa <blockquote><p>And as for the other sort of elders, together with deacons, we judge the ancient order of this Church [of Scotland], to have been most convenient for providing of well-qualified men for those functions and offices. For the eighth head of the First Book of Discipline, touching the election of elders and deacons, ordains that men of best knowledge and cleanest life, be nominat[ed] to be in election, and that their names be publicly read to the whole church by the minister, giving them advertisement, that from among them must be chosen elders and deacons: that if any of these nominat[ed] be noted with public infamy, he ought to be repelled: and that if any man know others of better qualities within the Church than these that be nominat[ed], they should be put in election, that the Church may have the choice.</p></blockquote>

<blockquote><p>The settlement of ministers was appointed with the call and consent of the congregation concerned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f93f5805cc" data-kw="">
<blockquote><p>Sixteen of these [field] ministers while they condemned the Erastianism of the indulgence, and deplored the conduct of their brethren who had accepted it, were not prepared to exclude them from their ranks, or refuse aid from them in the common cause. Though they themselves could not conscientiously submit to the restrictions, or the acknowledgments implied in that insidious measure, they were disposed to make allowances for such of their brethren as had yielded under strong temptation or plausible arguments; and they argued, that whatever ecclesiastical censure their conduct might afterwards be found to deserve, to deny them in the meantime the opportunity of vindicating their rights and liberties, civil and religious, by excluding them from the army, would be no less presumptuous and unjust in principle, than it was preposterous in the present circumstances of the country. This liberal view of the subject was opposed by only two of the ministers, namely, Mr. [Donald] Cargill and Mr. [Thomas] Douglas; but these were supported by a considerable number of the lay leaders of the army, at the head of whom was Sir Robert Hamilton. Hamilton appears to have been a pious man, and of good intentions; but of narrow views, severe in his temper, and altogether unqualified by want of military talents and experience, for the command which he assumed. He is charged, and apparently not without reason, with having been active in pushing Cargill, Cameron, and some other ministers, to those extremes which produced a breach between them and their brethren, with whom they had until of late acted in concert.³ ³ M’Crie’s Mem. of Veitch, &amp;c., Notices of James Ure, p. 452. I am sorry I cannot retract the judgment here pronounced on the character of Hamilton, the correctness of which has been challenged by some, but which is borne out by the whole of his history, and refers entirely to his public management, without any reflection either on his piety, his integrity, or his courage. This party now began to maintain that the king [Charles II], by assuming an Erastian power over the Church, had forfeited all right to the civil obedience of his subjects; a principle which had never been known in the Church of Scotland before, and which was afterwards carried to a great extent by Richard Cameron and his followers, who from him were termed Cameronians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-jr.html">Thomas M’Crie Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Story of the Scottish Church: from the Reformation to the Disruption (London: Blackie &amp; Son, 1875)</cite>, pp. 328-331</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-072478828f" data-kw="">

</figure><figure class="quote" id="q-978bf93c61" data-kw="">
<blockquote><p>Fourthly, it is objected, that what concerns all, ought to be done with the consent of all. Answer: We hold the same, but the consent of all is one thing, the exercise of jurisdiction by all, another thing. Ainsworth, in one of his epistles to Paget, condemns the elderships sitting and judging matters apart from the congregation. Paget answers, that though the eldership sit apart to judge, yet before any sentence be given for the cutting off of any offender, or for any other thing which concerneth all, matters are first propounded to the whole church, and their prayers and consent required. And surely this form of proceeding shines forth to us in that apostolical synod at Jerusalem…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Assertion of the Government of the Church of Scotland (Edinburgh, 1846), Part 2, Concerning the Assemblies of the Church of Scotland, and the Authority Thereof</cite>, Ch. 1, ‘Of Popular Government in the Church’; p. 41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<main class="wrap"><figure class="quote" id="q-c1bf58cf8d" data-kw="">
<blockquote><p>You have no right, and still less are you under any obligation, to take upon trust the views of any man or body of men, without having satisfied yourself of their accordance with the only standard of truth. It is with God you have to do, it is to him you are responsible, and him alone you are to follow. “God alone is Lord of the conscience, and hath left it free from the doctrines and commandments of men, which are in anything contrary to his word, or beside it, in matters of faith or worship” (Con. c. xx. s. 2).

You are then to exert your own faculties, and to exert them on your own responsibility to God, that under the guidance of his Spirit you may attain to the knowledge of his truth, and that this be done, and done intelligently, you must yourselves carefully investigate all the subjects to which your attention may be directed, and bring them, in the exercise of your own faculties, to be tried by the standard of God’s word.

You might be led by the authority of others and the influence of circumstances to adopt and profess a system of views that is really in accordance with the sacred Scriptures, while you had never fairly and impartially exercised your faculties upon the subject, and could give no satisfactory proof from the word of God of the views which you professed to entertain. But such a result would neither be satisfactory to yourselves nor to the church of which you might become ministers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, (New York: Robert Carter and Brothers, 1878), Lecture VI, p. 76.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9b1e48f8bd" data-kw="">
<blockquote><p>This imposing [of Church courts] takes not away judicious believing [by individuals]… If imposing were a commanding that we receive absolutely what they say, be it good, or ill, without examining [whether] the argument were concludent, as God himself requires Abraham to kill his son, Abraham was without examination to give absolute obedience, and this proves God to be Lord of the conscience, for knowing his Word to be his Word, we are not to examine it by the Scripture or Law of Nature, because if we know who speaks, we are not to examine what is spoken. But though we know who speaks among creatures, be it a prophet, an apostle, an angel, yet must we examine both who speaks and what is spoken.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), ch. 2, p. 42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/implicit-faith.html">Implicit Faith</a></span></div>

</figure><figure class="quote" id="q-540fca7fa1" data-kw="">
<blockquote><p>…nor was it ever in our heart to teach that the Christian magistrate is with blind obedience to execute the decrees of the Church; for this poor argument, if it have any nerves, as it would cast upon us the doctrine of Papists and Jesuits to make the ways of Christ odious, it has as great strength against the preaching of the Gospel; for if Paul or any faithful pastor preach to the magistrates of Berea that Christ, whom the Jews crucified, is the only Redeemer and Saviour of the world, and that therefore they are, as nurse-fathers, to give liberty to the servants of God, to preach this doctrine and to hinder any to persecute such as shall preach this doctrine, yet by their civil authority, and ex officio [out of their office], they are not for that, with blind obedience to receive it and not to search the Scriptures to try whether that which is preached be agreeable to the Scriptures, nor to take it upon the bare authority of the preacher, but they are to search the Scriptures and obliged to believe the preached Gospel. But not as magistrates [are they] either to preach themselves, or to judge authoritatively by virtue of their office, whether the preacher’s doctrine be the Gospel of Christ or no[t]: so if a synod, by the Holy Ghost and the light of Scriptures, determine anything for discipline or censure, the magistrate, as he may as a Christian, try the word preached, so may he the same way try the decrees and determinations of the Church, and not take them upon blind trust and accordingly punish the contraveners [to the Church’s decrees] as a magistrate, and as he is the minister of God that bears his sword; but yet he can no more as a magistrate, and by his office, prescribe such ecclesiastic laws (as wee have [in] Acts 15:28; 16:4) unto the Churches of God, or as a magistrate and by his office judge them unlawful and forbid them, than he can preach the word, or say it seemed good to the Holy Ghost [Acts 15:28] and to me who bears the sword, to command that the Churches observe such and such laws.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c93bf87ff0" data-kw="">
<blockquote><p>As Christ is the only sovereign Ruler of the Church, His word is the only word that is law in the absolute sense. Consequently, all despotic power is contraband in the Church. There is no ruling power independent of Christ. The Pope of Rome stands condemned in that he, while professing to be Christ&#x27;s vicar on earth, virtually supplants Christ and supersedes His word by human innovations. He not only places tradition on an equal footing with Scripture, but also claims to be the infallible interpreter of both when speaking ex cathedra in matters of faith and morals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, Part Five, The Doctrine of the Church, ch. III (Government of the Church)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/churchs-authority-and-power.html">Church&#x27;s Authority and Power</a> › <a href="../topics/the-church/churchs-authority-and-power/ministerial-power.html">Ministerial power</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dd5daca24a" data-kw="">
<blockquote><p>Shall we recognise the Apostolic See where we see nothing but horrible apostasy? Shall he be the vicar of Christ who, by his furious efforts in persecuting the Gospel, plainly declares himself to be Antichrist? Shall he be the successor of Peter who goes about with fire and sword demolishing everything that Peter built? Shall he be the Head of the Church who, after dissevering the Church from Christ, her only true Head, tears and lacerates her members? Rome, indeed, was once the mother of all the churches, but since she began to be the seat of Antichrist she ceased to be what she was.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.7.24</span></figcaption>

</figure><figure class="quote" id="q-3d3581611a" data-kw="">

</figure><figure class="quote" id="q-dc860b657c" data-kw="">
<blockquote><p>If the Pope would concede that God alone by His grace through Christ justifies sinners, we would carry him in our arms, we would kiss his feet. But since we cannot obtain this concession, we will give in to nobody, not to all the angels in heaven, not to Peter, not to Paul, not to a hundred emperors, not to a thousand popes</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, on Gal. 2, p. 43</span></figcaption>

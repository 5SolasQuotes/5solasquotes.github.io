<main class="wrap"><figure class="quote" id="q-bb2401ee82" data-kw="">
<blockquote><p>But as far as images are concerned, whether painted or sculpted, though we do not reject their use when sacred material or histories are represented, nevertheless we do not admit them in holy places without hesitation. Nor do we do we judge it prudent especially that sculpted images be set up in Temples, not because it is impious in and of itself, or because we think it not allowed, but rather because of the sad appearance of the Churches we see in Temples of the Papists, which took its origin from the use of Images and pictures… For this reason, though I completely concede that the use of images in which sacred things and histories are represented in temples is a matter of indifference (adiaphoron), nevertheless since people easily abuse thme when they are seen in sacred places, I think they do wisely who eliminate all these things from temples.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586</cite>, (Concordia Publishing House, 2017), ch. 4, pp. 469-70</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e1a8e069d5" data-kw="">
<blockquote><p>…it seems meet to be determined that all creatures may be represented by images: yea the very angels themselves, I mean not in respect of their spiritual nature, but in such sort as they have exhibited themselves to be seen of men. Wherefore the godly men, which either be dead or yet living, kings, stars, plants, stones, earth, sea, and such like may be represented by pictures. Also we make a distinction of images, that some of them be true, and some of them false. Among the true, those be reckoned, which doo represent those things, which either be, or haue béene, or hereafter shall be. But those are called false, which represent those things that neither be, have been, nor yet ever shall be: as are the chymaeras and centaurs. There be also some images filthy and some honest, according as those things be which are expressed by them. Also they may be distinguished according to the circumstance of the place, because some be set in a holy place and some in places prophane. Again, others there be which are appointed in respect of worship and religion: but others are erected as ornaments, and only for the remembrance of a thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places, II.2.26</cite>, … (London: Henrie Denham et al., 1583), pt. 2, ch. 5. ‘The Second Precept, which concerns Images, their Beginning, Antiquity &amp; Cause’, p. 335</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-144d96d337" data-kw="">
<blockquote><p>The whole place shows it was God: but He is called an angel, that we might know that He which was seen, was not God the Father (for whose angel should the Father be) but the only begotten Son of God, which is the Angel of the great Counsel, which said to his holy apostles, ‘All things which I have heard of my Father, I have declared unto you.’ And even as He gave Him the name of an angel, not meaning thereby to note any other minister or messenger, but to show the Person of the only begotten Son: so again he sets forth both his nature and power, saying He said: ‘I AM THAT I AM,’ and ‘I the God of Abraham, the God of Isaac, the God of Jacob’…</p></blockquote>

</figure><figure class="quote" id="q-90b837260d" data-kw="">
<blockquote><p>1st Conclusion. Monuments or instruments of idolatry are of two sorts, either: [1.] Such things as have no other use at all but to contribute sorne subservient influence in or unto idolatrous worship, and because these have all their warrant from a mere commandment of man, they are simply not necessary, as the graven image, the idols themselves, all positive observances in God’s worship destitute of any command of God; and the use of these in any case must be scandalous and so unlawful because… [2.] But there be other things that are instruments of idolatry and subservient thereunto, in a common and physical influence, as a temple builded to the honor of a saint and for the adoring of images, and for the reading and opening the Word of God in the New and Old Testament, though in a corrupt way; these are not properly monuments of idolatry. Now the house or Church, as such is no monument, nor useless instrument in worship, such as is a surplice, a human holy day, for it has, as such, being a thing of walls and timber, no other than that very same physical influence in worshipping either the true God or a saint, that it has in civil use, in our ordinary dwelling, to wit, to fence our bodies in religious, in natural, in civil actions from injuries of heaven, clouds, and sin. The adjuncts of the Church, as crucifixes, images, altars, ravels, mass-clothes and the like, are properly monuments and instruments of idolaty, because these are not necessary, as is the material house, nor have they any common and physical influence in the worship, as the temple has, yea all the necessity or influence that they have in the worship is only religious and human flowing from the will of men, without either necessity from our natural constitution of body, or any word of Scripture, and therefore they are to be removed upon this ground, because they are unnecessary snares to idolatry… …An house for the worship of God is amongst the things that are necessary by way of disjunction in specie, not in individuo; that is, a house is necessary, in its physical use, to fence off our bodies, the injuries of sun, air and heaven, but not this house, for another house may serve the turn as conveniently.</p></blockquote>

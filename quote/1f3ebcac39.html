<main class="wrap"><figure class="quote" id="q-1f3ebcac39" data-kw="">
<blockquote><p>The holy scripture therefore, designing by revealed religion to maintain and improve natural religion, to repair the decays of it and supply the defects of it, since the fall, for the reviving of the precepts of the law of nature, lays down, at first, this principle of the unclouded light of nature, That this world was, in the beginning of time, created by a Being of infinite wisdom and power, who was himself before all time and all worlds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matthew Henry’s Commentary on the Whole Bible: Complete &amp; Unabridged in One Volume</cite>, (Hendrickson, 1994), p. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-77bb6179c1" data-kw="">
<blockquote><p>Whereupon Tertullian said: ‘First God sent Nature to be our school-dame, purposing afterward to send the Word; that so having learned in the school of Nature, we might the more easily believe the Word of God.’ So then as when I see an house, I say there has been a carpenter, though I see him not: so when I look upon the frame of this world, I must say, it had a builder, though I behold him not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, ... (London: Snowdon, 1606), 1. ‘Of God’, How do you prove that there is a God?, p. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><figure class="quote" id="q-2886544a8b" data-kw="">
<blockquote><p>1. The consideration of the world, the mass, the skillful production, the form, the continuous sustaining, the very wise governance, the innumerable variety, the order of bodies, the diverse movement, and the admirable virtues of which teach that there is some intelligent nature from which all of these things come. Ps. 8, 19; Rom. 1:19-20. “Seeing as τὸ γνωστὸν τοῦ θεοῦ, that which can be known of God, is manifest in them, for God has shown it to them. For the invisible things of him are clearly seen from the creation of the world, being understood by the things that are made, even his eternal power and Godhead, so that they are without excuse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syntagma</cite>, bk. 2, ch. 4, Arguments for the Existence of God trans. Charles Johnson</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><figure class="quote" id="q-052496234b" data-kw="">
<blockquote><p>1. Revelation of God in the destitute state is one thing, subjective, which can be called impressed on conscience; objective another, and that either inscribed in Nature or inserted in Scripture. 2. Subjective revelation impressed on conscience is convictive, but not converting. 3. Objective revelation inscribed in nature proposes God the Creator, but by no means God the Redeemer. 4. Of this revelation there is neither other efficacy nor other outcome except ἀπολογησία [inexcusability]. 5. Revelation inserted in Scripture is both the only adequate one and the only one that can be salutary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/start-here.html">Reformed Books Online</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Miscellaneous Theological Disputations (Disputationum Theologicarum Miscellaneorum Pars Prima)</cite>, ‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’</span></figcaption>

</figure><figure class="quote" id="q-d456c6d02f" data-kw="">
<blockquote><p>Michael Sudduth examines three prominent objections to natural theology that have emerged in the Reformed streams of the Protestant theological tradition: objections from the immediacy of our knowledge of God, the noetic effects of sin, and the logic of theistic arguments. Distinguishing between the project of natural theology and particular models of natural theology, Sudduth argues that none of the main Reformed objections is successful as an objection to the project of natural theology itself.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-0fde6beadf" data-kw="">
<blockquote><p>Concerning restoration after a fall, and perseverance to the end, the opinion of theologians is agreed that these do not fall under merit de condigno. … This argument does indeed prove that restoration cannot be a reward to be rendered out of justice. For he who has lost all his merits, how can he demand a reward out of justice? But it does not prove that it is not fitting that God, of his clemency, should look upon the preceding good works, and in view of them have mercy on him who has fallen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.22 (translated from the Latin)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d1b630de69" data-kw="Grace and merit">
<blockquote><p>These are incompatible: to give a thing from grace and to give it from merit. For merit makes a thing due, while grace supposes it undue. Therefore whatever is given from grace cannot be given from merit, otherwise grace would not be grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 17.5.17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/merit-of-congruity-and-condignity.html">Merit of Congruity and Condignity</a> › <a href="../topics/justification/merit-of-congruity-and-condignity/merit-of-condignity.html">Merit of condignity (de condigno)</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>
<div class="actions"><button class="copy" data-copy="“These are incompatible: to give a thing from grace and to give it from merit. For merit makes a thing due, while grace supposes it undue. Therefore whatever is given from grace cannot be given from merit, otherwise grace would not be grace.”

— Francis Turretin, Institutes of Elenctic Theology, 17.5.17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThese+are+incompatible%3A+to+give+a+thing+from+grace+and+to+give+it+from+merit.+For+merit+makes+a+thing+due%2C+while+grace+supposes+it+undue.+Therefore+whatever+is+given+from+grace+cannot+be+given+from+merit%2C+otherwise+grace+would+not+be+grace.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+17.5.17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd1b630de69.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d1b630de69.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-d2a7d4c853" data-kw="">
<blockquote><p>For, whereas Jesus Christ Himself continually infuses his virtue into the said justified,-as the head into the members, and the vine into the branches,-and this virtue always precedes and accompanies and follows their good works, which without it could not in any wise be pleasing and meritorious before God,-we must believe that nothing further is wanting to the justified, to prevent their being accounted to have, by those very works which have been done in God, fully satisfied the divine law according to the state of this life, and to have truly merited eternal life, to be obtained also in its (due) time, if so be, however, that they depart in grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/council-of-trent.html">Council of Trent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Decree on Justification</cite>, sess. 6, ch. 16</span></figcaption>

</figure><figure class="quote" id="q-14a3722262" data-kw="">
<blockquote><p>Filial adoption, in making us partakers by grace in the divine nature, can bestow true merit on us as a result of God&#x27;s gratuitous justice. This is our right by grace, the full right of love, making us &quot;co-heirs&quot; with Christ and worthy of obtaining &quot;the promised inheritance of eternal life.&quot; The merits of our good works are gifts of the divine goodness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/catholic-church.html">Catholic Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechism of the Catholic Church</cite>, §2009</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/merit-of-congruity-and-condignity.html">Merit of Congruity and Condignity</a> › <a href="../topics/justification/merit-of-congruity-and-condignity/merit-of-condignity.html">Merit of condignity (de condigno)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>
<div class="actions"><button class="copy" data-copy="“Filial adoption, in making us partakers by grace in the divine nature, can bestow true merit on us as a result of God&#x27;s gratuitous justice. This is our right by grace, the full right of love, making us &quot;co-heirs&quot; with Christ and worthy of obtaining &quot;the promised inheritance of eternal life.&quot; The merits of our good works are gifts of the divine goodness.”

— Catholic Church, Catechism of the Catholic Church, §2009">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFilial%20adoption%2C%20in%20making%20us%20partakers%20by%20grace%20in%20the%20divine%20nature%2C%20can%20bestow%20true%20merit%20on%20us%20as%20a%20result%20of%20God%27s%20gratuitous%20justice.%20This%20is%20our%20right%20by%20grace%2C%20the%20full%20right%20of%20love%2C%20making%20us%20%22co-heirs%22%20with%20Christ%20and%20worthy%20of%20obtaining%20%22the%20promised%20inheritance%20of%20eternal%20life.%22%20The%20merits%20of%20our%20good%20works%20are%20gifts%20of%20the%20divine%20goodness.%E2%80%9D%0A%0A%E2%80%94%20Catholic%20Church%2C%20Catechism%20of%20the%20Catholic%20Church%2C%20%C2%A72009&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F14a3722262.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/14a3722262.html">Permalink</a><a class="src" href="https://www.vatican.va/archive/ENG0015/__P70.HTM" rel="noopener" target="_blank">Read it online · Vatican</a></div>
</figure><figure class="quote" id="q-1be46483e7" data-kw="">
<blockquote><p>From an ethical point of view the difference practically amounts to this that, if the reward due to condign merit be withheld, there is a violation of right and justice and the consequent obligation in conscience to make restitution, while, in the case of congruous merit, to withhold the reward involves no violation of right and no obligation to restore, it being merely an offence against what is fitting or a matter of personal discrimination (acceptio personarum). Hence the reward of congruous merit always depends in great measure on the kindness and liberality of the giver, though not purely and simply on his good will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-pohle.html">Joseph Pohle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Encyclopedia</cite>, s.v. “Merit” (1911)</span></figcaption>

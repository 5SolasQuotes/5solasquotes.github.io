<blockquote><p>That old Serpent, which is the Devil and Satan, as he is likewise so stiled, ch. 12:9. and bound him a thousand years, which binding up or restraining was from such open rage of persecution as was used by the heathen emperors, but especially for that end which is spoken of in the next verse, to wit, that he should deceive the nations no more, which is to be understood, not absolutely from all sort of deceiving, but from that sort which he used before the preaching of the Gospel amongst the gentiles, by the responses of his hellish oracles, and such gross idolatry whereinto he drew them, and which by the preaching of the Gospel and conversion of the gentiles was silenced and abolished, and he (as it were) bound up therefrom. …During the time then wherein he was bound up from that sort of gross and paganish deceiving, he was never busier, by the vicar of his power, to whom he resigned his throne, as ch. 13:2, to deceive in a more subtil way, changing himself into an angel of light, and under presence and profession of the Christian name, to suppress and overthrow the truth of Christ Jesus, which thing to be true, may be seen, 1. By the great success of this manner of deception these thousand years, which he had, as we may see, ch. 13:16, so that all the world followed the beast, whose names were not written in the book of life. 2. By this, that v. 4. John saw the souls of these that were beheaded for the witness of Jesus, and had not worshipped the beast nor his image, living and reigning with Christ these thousand years, 〈 in non-Latin alphabet 〉, which v. 1. are called, 〈 in non-Latin alphabet 〉, without any article, to shew that he means these thousand years that Satan is bound up himself from the first sort of deceiving, yet is let loose as it were, in the vicar of his power to deceive after another manner and to kill the faithful witnesses spoken of, ch. 11:3. Verse. 3… Now for accommodation of history, to know the time when the Dragon was thus bound up, and the thousand years spoken of began, and thereafter ended and had their accomplishment. 1. The dragon was fully then bound up, when by Constantine’s conversion, heathenish and open persecution of the Gospel ceased, and the Christian religion by laws was every where established, for from that time the dragon had no loose chain for open rage as before, or paganish seduction; and this was about the three hundreth year of Christ, which leads us also to the point of his losing, which falls out about the one thousand three hundreth year of God, in the time of Boniface VIII, that monster of men, of whom their stories records, that he entred like a fox, lived like a lion and died like a dog, (Fascic. temp in vita Bonif. 8)… In whose time also, to evidence yet more Satan’s loosing, there was (as the same Platina reports) a sudden, general, and so huge an earthquake throughout all Italy, which lasted many days, as the like was never seen before, and which every where overthrew many houses. There appeared likewise (says he) a huge great comet portending some great calamity thereafter to fall out, so that heaven and earth gave signs and witnesses of the loosing of this dragon. And from the times of which Boniface many bloody persecutions against the professors of the truth were raised, who were called, Waldenses, Lollards, Hussites, and of late Lutherans, Calvinists, Huguenots and the like, many cruel plots hatched, and many bloody massacres acted and practiced. At this time also began that Ottoman race, and so Satan was let loose.</p></blockquote>

<blockquote><p>I know that the opinions of the expositors touching these thousand years be diverse. I know how the heresy of the Chiliasts or Millenaries by Papias, authour hereof, as Eusebius recites in the 3rd book [ch. 39.12] of the Ecclesiastical History, was taken hereof. I will not here stand about to confute the opinion of others, which also would be overlong and tedious, and not of so great profit. I wil only utter my own to be weighed of the godly readers, then will I leave it free for every man to follow that thing which he shall think most agreable to the truth and profitable for the godly. And I understand plainly and simply that St. John speaks of a thousand years which ran on by continual course from the time of Christ until the last corrupting of the evangelical preaching and church of Christ. Neither am I very scrupulous in searching out the term of the supputation of these thousand years. Simply I appoint the beginning of the reckoning in the open preaching of the Gospel and what time the Word began now to be received, and was now received of the gentiles. I suppose therefore that there may be three terms or times appointed, which nevertheless shall come all to one reckoning, differing little or nothing amongst themselves or having small diversity, not passing half a year more or less. Ye may therefore, if you please, begin the supputation of the thousand years from the 33rd year of Christ’s birth, wherein Christ also ascended into heaven and Paul being called to the ministry and drawing the gentiles into the felloweship of God’s people by the preaching of God’s Word, began to restrain Satan. And you shall come to the year of our Lord, 1034, and to the bishopric of Pope Benedict IX, which after he come by unlawful means into the chair of St. Peter, as they call it, practiced art-magic and was joined in league with the Devil: of whom he was carried away also, what time he had sold his bishopric before the Pope Gregory VI… Thou wilt say then, that about that time the Devil brake loose again and seduced the people, especially by Popes. Or begin the supputation of the thousand years from that time wherein Paul, being bound for the gospel at Rome, testified that the gospel was preached throughout the world. That was about the year of our Lord, 60; from thence accompting a thousand years, you shall come to the year of our Lord, 1060, when Nicholas II was Pope, under whom it is written that the verity was diversely tempted and corrupted and that Gregory VII did then also by his crafts and enterprises trouble the whole world. Or begin the supputation from the destruction of Jerusalem, what time the Jews [were] cast off, the gentiles in great number entered and were received into the place of the Jews rejected, which was the year of our Lord 73, and thou shalt attain to the year of our Lord 1073, even to Pope Gregory VII: in the which time not a few historiographers write that the Devil himself reigned. Doubtless never man hurt godliness or more stoutly advanced impiety than did this Gregory, otherwise called Hildebrand. Of him I have spoken before in the 13th chapter. Where also I admonished you that Cardinal Benon did accompt those thousand years from the birth of the Lord and concluded [the same] in Sylvester II. It is evident therefore that the gospel has had a notable place in the world, neither has [it] been quenched for the space of a thousand years: that is to say, from the time of the apostles until the year of our Lord was reckoned 1073 or there about… … St. John assigned to Antichrist a certain number of years, to wit 666. Whereof we might understand the name of Antichrist. But therefore it follows not that the Devil was then quite loosed or the light of the Gospel utterly extinguished. For the apostle in his time, speaking of him: ‘The mystery,’ says he, ‘of iniquity now works.’ Antichrist therefore has his seeds, he has his beginning, he has his rising up, his growing and increases. But after a thousand years, he went to work most impudently and most boldly which before also had uttered his maliciousness: but now most venomously of all he spews out his poison, oppressing kings and all that speak never so little against him. We know moreover that in these thousand years past the Devil has reigned in many by murder, perjury and innumerable and unspeakeable evils. But if you consider what has been done since those thousand years, and what is done at this day: you will say those ages of the thousand years to have been golden and silver worlds and ours now for these five hundred years to be of brass, iron, lead and clay. Lactantius in the seventh book of Institutes, the 15th chapter, towards the last end of the world, says he, the state of worldly matters must needs be altered and iniquity prevailing to incline to the worse: so that these our times, in the which iniquity and mischief is grown to the highest degree, yet in comparison of that uncurable evil may be accompted fortunate and in manner golden ages. For justice shall than wear so thin, ungodliness, covetousness, wilfulness and lust shall be so common, that if there shall be then haply any good men, they shall be a pray to the wicked, and everywhere vexed of the unrighteous… By all the which our days now seem to be painted lively. But what is that, which is annexed, that the Devil must be loosed for a little season? seems this a little season which continues now five hundred years? And this place we expound so as that same in the gospel: unless those days were shortened, no flesh should be saved. For it is evidently by stories that neither the Devil, nor Antichrist has enjoyed that his kingdom long quiet. For evermore and in all ages have sprung up some holy and learned men, which being illumined and comforted of God, like Enoch and Helie [Elijah?], haue resisted the ungodly and ungodliness, and have maintained the true religion… Therefore both Satan and the Pope could enjoy these matters but a small season. For immediately after the thousand years sprang up the Waldenses which constantly impugned the Pope and his ungodliness. The Lord has raised up certain kings amongst whom be the Fridericks, German Emperors, Lewis of the house of Bauier, and many others. The Popes also have been at dissension amongst themselves whilst many have been chosen, and every one of them wil be the vicar of Christ, and so tear all that ecclesiastical body of theirs with schisms. There rise up against these preachers earnest and vehement, Wyclif, Huss, Jerome of Prague and diverse others. What is done at this day and has been now these 30 years and more against superstitions and idolatry, against the Pope, and all his clergy, the Papists themselves cry out and all parts of the world can testify. Therefore is the Devil loosed a little season. The Lord Jesus tread him under our feat shortly.</p></blockquote>

 and increases. But after a thousand years, he went to work most impudently and most boldly which before also had uttered his maliciousness: but now most venomously of all he spews out his poison, oppressing kings and all that speak never so little against him. We know moreover that in these thousand years past the Devil has reigned in many by murder, perjury and innumerable and unspeakeable evils. But if you consider what has been done since those thousand years, and what is done at this day: you will say those ages of the thousand years to have been golden and silver worlds and ours now for these five hundred years to be of brass, iron, lead and clay. Lactantius in the seventh book of Institutes, the 15th chapter, towards the last end of the world, says he, the state of worldly matters must needs be altered and iniquity prevailing to incline to the worse: so that these our times, in the which iniquity and mischief is grown to the highest degree, yet in comparison of that uncurable evil may be accompted fortunate and in manner golden ages. For justice shall than wear so thin, ungodliness, covetousness, wilfulness and lust shall be so common, that if there shall be then haply any good men, they shall be a pray to the wicked, and everywhere vexed of the unrighteous… By all the which our days now seem to be painted lively. But what is that, which is annexed, that the Devil must be loosed for a little season? seems this a little season which continues now five hundred years? And this place we expound so as that same in the gospel: unless those days were shortened, no flesh should be saved. For it is evidently by stories that neither the Devil, nor Antichrist has enjoyed that his kingdom long quiet. For evermore and in all ages have sprung up some holy and learned men, which being illumined and comforted of God, like Enoch and Helie [Elijah?], haue resisted the ungodly and ungodliness, and have maintained the true religion… Therefore both Satan and the Pope could enjoy these matters but a small season. For immediately after the thousand years sprang up the Waldenses which constantly impugned the Pope and his ungodliness. The Lord has raised up certain kings amongst whom be the Fridericks, German Emperors, Lewis of the house of Bauier, and many others. The Popes also have been at dissension amongst themselves whilst many have been chosen, and every one of them wil be the vicar of Christ, and so tear all that ecclesiastical body of theirs with schisms. There rise up against these preachers earnest and vehement, Wyclif, Huss, Jerome of Prague and diverse others. What is done at this day and has been now these 30 years and more against superstitions and idolatry, against the Pope, and all his clergy, the Papists themselves cry out and all parts of the world can testify. Therefore is the Devil loosed a little season. The Lord Jesus tread him under our feat shortly.”

— Heinrich Bullinger, A Hundred Sermons upon the Apocalypse of Jesus Christ... (London: John Day, 1561), 87th sermon, p. 593-94 &amp; 598-600">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+know+that+the+opinions+of+the+expositors+touching+these+thousand+years+be+diverse.+I+know+how+the+heresy+of+the+Chiliasts+or+Millenaries+by+Papias%2C+authour+hereof%2C+as+Eusebius+recites+in+the+3rd+book+%5Bch.+39.12%5D+of+the+Ecclesiastical+History%2C+was+taken+hereof.+I+will+not+here+stand+about+to+confute+the+opinion+of+others%2C+which+also+would+be+overlong+and+tedious%2C+and+not+of+so+great+profit.+I+wil+only+utter+my+own+to+be+weighed+of+the+godly+readers%2C+then+will+I+leave+it+free+for+every+man+to+follow+that+thing+which+he+shall+think+most+agreable+to+the+truth+and+profitable+for+the+godly.+And+I+understand+plainly+and+simply+that+St.+John+speaks+of+a+thousand+years+which+ran+on+by+continual+course+from+the+time+of+Christ+until+the+last+corrupting+of+the+evangelical+preaching+and+church+of+Christ.+Neither+am+I+very+scrupulous+in+searching+out+the+term+of+the+supputation+of+these+thousand+years.+Simply+I+appoint+the+beginning+of+the+reckoning+in+the+open+preaching+of+the+Gospel+and+what+time+the+Word+began+now+to+be+received%2C+and+was+now+received+of+the+gentiles.+I+suppose+therefore+that+there+may+be+three+terms+or+times+appointed%2C+which+nevertheless+shall+come+all+to+one+reckoning%2C+differing+little+or+nothing+amongst+themselves+or+having+small+diversity%2C+not+passing+half+a+year+more+or+less.+Ye+may+therefore%2C+if+you+please%2C+begin+the+supputation+of+the+thousand+years+from+the+33rd+year+of+Christ%E2%80%99s+birth%2C+wherein+Christ+also+ascended+into+heaven+and+Paul+being+called+to+the+ministry+and+drawing+the+gentiles+into+the+felloweship+of+God%E2%80%99s+people+by+the+preaching+of+God%E2%80%99s+Word%2C+began+to+restrain+Satan.+And+you+shall+come+to+the+year+of+our+Lord%2C+1034%2C+and+to+the+bishopric+of+Pope+Benedict+IX%2C+which+after+he+come+by+unlawful+means+into+the+chair+of+St.+Peter%2C+as+they+call+it%2C+practiced+art-magic+and+was+joined+in+league+with+the+Devil%3A+of+whom+he+was+carried+away+also%2C+what+time+he+had+sold+his+bishopric+before+the+Pope+Gregory+VI%E2%80%A6+Thou+wilt+say+then%2C+that+about+that+time+the+Devil+brake+loose+again+and+seduced+the+people%2C+especially+by+Popes.+Or+begin+the+supputation+of+the+thousand+years+from+that+time+wherein+Paul%2C+being+bound+for+the+gospel+at+Rome%2C+testified+that+the+gospel+was+preached+throughout+the+world.+That+was+about+the+year+of+our+Lord%2C+60%3B+from+thence+accompting+a+thousand+years%2C+you+shall+come+to+the+year+of+our+Lord%2C+1060%2C+when+Nicholas+II+was+Pope%2C+under+whom+it+is+written+that+the+verity+was+diversely+tempted+and+corrupted+and+that+Gregory+VII+did+then+also+by+his+crafts+and+enterprises+trouble+the+whole+world.+Or+begin+the+supputation+from+the+destruction+of+Jerusalem%2C+what+time+the+Jews+%5Bwere%5D+cast+off%2C+the+gentiles+in+great+number+entered+and+were+received+into+the+place+of+the+Jews+rejected%2C+which+was+the+year+of+our+Lord+73%2C+and+thou+shalt+attain+to+the+year+of+our+Lord+1073%2C+even+to+Pope+Gregory+VII%3A+in+the+which+time+not+a+few+historiographers+write+that+the+Devil+himself+reigned.+Doubtless+never+man+hurt+godliness+or+more+stoutly+advanced+impiety+than+did+this+Gregory%2C+otherwise+called+Hildebrand.+Of+him+I+have+spoken+before+in+the+13th+chapter.+Where+also+I+admonished+you+that+Cardinal+Benon+did+accompt+those+thousand+years+from+the+birth+of+the+Lord+and+concluded+%5Bthe+same%5D+in+Sylvester+II.+It+is+evident+therefore+that+the+gospel+has+had+a+notable+place+in+the+world%2C+neither+has+%5Bit%5D+been+quenched+for+the+space+of+a+thousand+years%3A+that+is+to+say%2C+from+the+time+of+the+apostles+until+the+year+of+our+Lord+was+reckoned+1073+or+there+about%E2%80%A6+%E2%80%A6+St.+John+assigned+to+Antichrist+a+certain+number+of+years%2C+to+wit+666.+Whereof+we+might+understand+the+name+of+Antichrist.+But+therefore+it+follows+not+that+the+Devil+was+then+quite+loosed+or+the+light+of+the+Gospel+utterly+extinguished.+For+the+apostle+in+his+time%2C+speaking+of+him%3A+%E2%80%98The+mystery%2C%E2%80%99+says+he%2C+%E2%80%98of+iniquity+now+works.%E2%80%99+Antichrist+therefore+has+his+seeds%2C+he+has+his+beginning%2C+he+has+his+rising+up%2C+his+growing+and+increases.+But+after+a+thousand+years%2C+he+went+to+work+most+impudently+and+most+boldly+which+before+also+had+uttered+his+maliciousness%3A+but+now+most+venomously+of+all+he+spews+out+his+poison%2C+oppressing+kings+and+all+that+speak+never+so+little+against+him.+We+know+moreover+that+in+these+thousand+years+past+the+Devil+has+reigned+in+many+by+murder%2C+perjury+and+innumerable+and+unspeakeable+evils.+But+if+you+consider+what+has+been+done+since+those+thousand+years%2C+and+what+is+done+at+this+day%3A+you+will+say+those+ages+of+the+thousand+years+to+have+been+golden+and+silver+worlds+and+ours+now+for+these+five+hundred+years+to+be+of+brass%2C+iron%2C+lead+and+clay.+Lactantius+in+the+seventh+book+of+Institutes%2C+the+15th+chapter%2C+towards+the+last+end+of+the+world%2C+says+he%2C+the+state+of+worldly+matters+must+needs+be+altered+and+iniquity+prevailing+to+incline+to+the+worse%3A+so+that+these+our+times%2C+in+the+which+iniquity+and+mischief+is+grown+to+the+highest+degree%2C+yet+in+comparison+of+that+uncurable+evil+may+be+accompted+fortunate+and+in+manner+golden+ages.+For+justice+shall+than+wear+so+thin%2C+ungodliness%2C+covetousness%2C+wilfulness+and+lust+shall+be+so+common%2C+that+if+there+shall+be+then+haply+any+good+men%2C+they+shall+be+a+pray+to+the+wicked%2C+and+everywhere+vexed+of+the+unrighteous%E2%80%A6+By+all+the+which+our+days+now+seem+to+be+painted+lively.+But+what+is+that%2C+which+is+annexed%2C+that+the+Devil+must+be+loosed+for+a+little+season%3F+seems+this+a+little+season+which+continues+now+five+hundred+years%3F+And+this+place+we+expound+so+as+that+same+in+the+gospel%3A+unless+those+days+were+shortened%2C+no+flesh+should+be+saved.+For+it+is+evidently+by+stories+that+neither+the+Devil%2C+nor+Antichrist+has+enjoyed+that+his+kingdom+long+quiet.+For+evermore+and+in+all+ages+have+sprung+up+some+holy+and+learned+men%2C+which+being+illumined+and+comforted+of+God%2C+like+Enoch+and+Helie+%5BElijah%3F%5D%2C+haue+resisted+the+ungodly+and+ungodliness%2C+and+have+maintained+the+true+religion%E2%80%A6+Therefore+both+Satan+and+the+Pope+could+enjoy+these+matters+but+a+small+season.+For+immediately+after+the+thousand+years+sprang+up+the+Waldenses+which+constantly+impugned+the+Pope+and+his+ungodliness.+The+Lord+has+raised+up+certain+kings+amongst+whom+be+the+Fridericks%2C+German+Emperors%2C+Lewis+of+the+house+of+Bauier%2C+and+many+others.+The+Popes+also+have+been+at+dissension+amongst+themselves+whilst+many+have+been+chosen%2C+and+every+one+of+them+wil+be+the+vicar+of+Christ%2C+and+so+tear+all+that+ecclesiastical+body+of+theirs+with+schisms.+There+rise+up+against+these+preachers+earnest+and+vehement%2C+Wyclif%2C+Huss%2C+Jerome+of+Prague+and+diverse+others.+What+is+done+at+this+day+and+has+been+now+these+30+years+and+more+against+superstitions+and+idolatry%2C+against+the+Pope%2C+and+all+his+clergy%2C+the+Papists+themselves+cry+out+and+all+parts+of+the+world+can+testify.+Therefore+is+the+Devil+loosed+a+little+season.+The+Lord+Jesus+tread+him+under+our+feat+shortly.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+A+Hundred+Sermons+upon+the+Apocalypse+of+Jesus+Christ...+%28London%3A+John+Day%2C+1561%29%2C+87th+sermon%2C+p.+593-94+%26+598-600&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff7c6784545.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f7c6784545.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/eschatology/#:~:text=I%20know%20that%20the%20opinions%20of,tread%20him%20under%20our%20feat%20shortly&amp;text=I%20know%20that%20the%20opinions%20of%20the%20expositors&amp;text=Lord%20Jesus%20tread%20him%20under%20our%20feat%20shortly" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>On the positive side, contrary to the criticism of our detractors, the phrase VICARIUS FILLI DEI has been used historically as a major papal title, and possibly it was also inscribed in some papal tiaras or mitres. On the negative side, the identification of the number 666 with VICARIUS FILII DEI, cannot be exegetically supported by Revelation 13:18, because the text does not say that the meaning of 666 is to be found in the added numerical value of the letters of a name. We noted that such numerical method of interpretation is unknown in the Bible.</p></blockquote>

<blockquote><p>II. Where these thousand yeers have their beginning and ending. Such as understand the thousand yeers definitely are diversly minded about their beginning, as by and by I will show. I suppose it best to take their beginning from the angel’s descension: because otherwise the determination of the thousand yeers, so often repeated, should be uncertain and vain: I say, in case they should have an indeterminated beginning elsewhere: Now the descension of the angel was in the incarnation of the Son of God, as before we showed. Notwithstanding Satan was not bound presently upon his nativity: because the Son of God did not immediatly exercise his power in his childhood. But the true beginning is understood from the cause why the dragon should be bound: which was that he should deceive the nations no more: to wit, by keeping them in paganism and turning them from the Gospel of Christ. Therefore when the Dragon began to desist from deceiving the nations, then he was bound. Now he desisted from seducing the nations any longer, not presently, at the beginning of the ministry, or resurrection of Christ, or of the preaching of the apostles (although the angel did then begin to cast the great chain upon the dragon) but especially after the dispersion of the Jews and the destruction of the Jewish temple, and worship by the Romans: for before that time, the beginnings of the gentiles’ conversion to Christ were but small: because the dragon never ceased to hinder the gentiles from the Gospel of Christ by means of the turbulent Jews, as the history of the Acts of the Apostles testifies. But afterward, Jerusalem being destroyed, the Jews were rejected and dissipated, and in their room the Gentiles were called and added to the Church, as Paul teaches, Acts 13:46; Rom. 11:11, etc. Then at length it appeared that Satan was bound, because he was not able to seduce the nations any longer or uphold paganism. But that was in the year of our Lord 73. This year therefore we make the beginning of the thousand years of Satan’s binding. From hence unto the year of our Lord 1073 are a thousand years, at which time Pope Gregory VII, a Celtiberian monk, and diabolical juggler, poisoning Alexander II, invaded the Papacy by most wicked arts: who sitting on the papal chair, the devill began again to be loosed and to rage tumultuously, filling the Christian world in a horrible manner with wars and slaughters by the means of this his cursed instrument…. … Thus I have laid down my judgement, agreeing with other most learned interpreters before me, as Bullinger, Junius, etc. not that I do tie any man unto it, but leave it to consideration: but they who begin the thousand years from Christ’s nativity, as Aretius, or from his resurrection, as Chytraeus [a Lutheran]: or from the time of universal Christianism under Constantine the Great, as Brightman, Napier, etc. although they differ a little in the terms, yet all have this common with us, that the first thousand years from Christ’s birth is to be ascribed to Satan’s imprisonment and that the dragon is now long ago loosed out of prison.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“II. Where these thousand yeers have their beginning and ending. Such as understand the thousand yeers definitely are diversly minded about their beginning, as by and by I will show. I suppose it best to take their beginning from the angel’s descension: because otherwise the determination of the thousand yeers, so often repeated, should be uncertain and vain: I say, in case they should have an indeterminated beginning elsewhere: Now the descension of the angel was in the incarnation of the Son of God, as before we showed. Notwithstanding Satan was not bound presently upon his nativity: because the Son of God did not immediatly exercise his power in his childhood. But the true beginning is understood from the cause why the dragon should be bound: which was that he should deceive the nations no more: to wit, by keeping them in paganism and turning them from the Gospel of Christ. Therefore when the Dragon began to desist from deceiving the nations, then he was bound. Now he desisted from seducing the nations any longer, not presently, at the beginning of the ministry, or resurrection of Christ, or of the preaching of the apostles (although the angel did then begin to cast the great chain upon the dragon) but especially after the dispersion of the Jews and the destruction of the Jewish temple, and worship by the Romans: for before that time, the beginnings of the gentiles’ conversion to Christ were but small: because the dragon never ceased to hinder the gentiles from the Gospel of Christ by means of the turbulent Jews, as the history of the Acts of the Apostles testifies. But afterward, Jerusalem being destroyed, the Jews were rejected and dissipated, and in their room the Gentiles were called and added to the Church, as Paul teaches, Acts 13:46; Rom. 11:11, etc. Then at length it appeared that Satan was bound, because he was not able to seduce the nations any longer or uphold paganism. But that was in the year of our Lord 73. This year therefore we make the beginning of the thousand years of Satan’s binding. From hence unto the year of our Lord 1073 are a thousand years, at which time Pope Gregory VII, a Celtiberian monk, and diabolical juggler, poisoning Alexander II, invaded the Papacy by most wicked arts: who sitting on the papal chair, the devill began again to be loosed and to rage tumultuously, filling the Christian world in a horrible manner with wars and slaughters by the means of this his cursed instrument…. … Thus I have laid down my judgement, agreeing with other most learned interpreters before me, as Bullinger, Junius, etc. not that I do tie any man unto it, but leave it to consideration: but they who begin the thousand years from Christ’s nativity, as Aretius, or from his resurrection, as Chytraeus [a Lutheran]: or from the time of universal Christianism under Constantine the Great, as Brightman, Napier, etc. although they differ a little in the terms, yet all have this common with us, that the first thousand years from Christ’s birth is to be ascribed to Satan’s imprisonment and that the dragon is now long ago loosed out of prison.”

— David Pareus, A Commentary upon the Divine Revelation of the Apostle &amp; Evangelist John… tr. Elias Arnold (d. 1622; Amsterdam: C.P., 1644), ch. 20, pp. 508 &amp; 510">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CII.+Where+these+thousand+yeers+have+their+beginning+and+ending.+Such+as+understand+the+thousand+yeers+definitely+are+diversly+minded+about+their+beginning%2C+as+by+and+by+I+will+show.+I+suppose+it+best+to+take+their+beginning+from+the+angel%E2%80%99s+descension%3A+because+otherwise+the+determination+of+the+thousand+yeers%2C+so+often+repeated%2C+should+be+uncertain+and+vain%3A+I+say%2C+in+case+they+should+have+an+indeterminated+beginning+elsewhere%3A+Now+the+descension+of+the+angel+was+in+the+incarnation+of+the+Son+of+God%2C+as+before+we+showed.+Notwithstanding+Satan+was+not+bound+presently+upon+his+nativity%3A+because+the+Son+of+God+did+not+immediatly+exercise+his+power+in+his+childhood.+But+the+true+beginning+is+understood+from+the+cause+why+the+dragon+should+be+bound%3A+which+was+that+he+should+deceive+the+nations+no+more%3A+to+wit%2C+by+keeping+them+in+paganism+and+turning+them+from+the+Gospel+of+Christ.+Therefore+when+the+Dragon+began+to+desist+from+deceiving+the+nations%2C+then+he+was+bound.+Now+he+desisted+from+seducing+the+nations+any+longer%2C+not+presently%2C+at+the+beginning+of+the+ministry%2C+or+resurrection+of+Christ%2C+or+of+the+preaching+of+the+apostles+%28although+the+angel+did+then+begin+to+cast+the+great+chain+upon+the+dragon%29+but+especially+after+the+dispersion+of+the+Jews+and+the+destruction+of+the+Jewish+temple%2C+and+worship+by+the+Romans%3A+for+before+that+time%2C+the+beginnings+of+the+gentiles%E2%80%99+conversion+to+Christ+were+but+small%3A+because+the+dragon+never+ceased+to+hinder+the+gentiles+from+the+Gospel+of+Christ+by+means+of+the+turbulent+Jews%2C+as+the+history+of+the+Acts+of+the+Apostles+testifies.+But+afterward%2C+Jerusalem+being+destroyed%2C+the+Jews+were+rejected+and+dissipated%2C+and+in+their+room+the+Gentiles+were+called+and+added+to+the+Church%2C+as+Paul+teaches%2C+Acts+13%3A46%3B+Rom.+11%3A11%2C+etc.+Then+at+length+it+appeared+that+Satan+was+bound%2C+because+he+was+not+able+to+seduce+the+nations+any+longer+or+uphold+paganism.+But+that+was+in+the+year+of+our+Lord+73.+This+year+therefore+we+make+the+beginning+of+the+thousand+years+of+Satan%E2%80%99s+binding.+From+hence+unto+the+year+of+our+Lord+1073+are+a+thousand+years%2C+at+which+time+Pope+Gregory+VII%2C+a+Celtiberian+monk%2C+and+diabolical+juggler%2C+poisoning+Alexander+II%2C+invaded+the+Papacy+by+most+wicked+arts%3A+who+sitting+on+the+papal+chair%2C+the+devill+began+again+to+be+loosed+and+to+rage+tumultuously%2C+filling+the+Christian+world+in+a+horrible+manner+with+wars+and+slaughters+by+the+means+of+this+his+cursed+instrument%E2%80%A6.+%E2%80%A6+Thus+I+have+laid+down+my+judgement%2C+agreeing+with+other+most+learned+interpreters+before+me%2C+as+Bullinger%2C+Junius%2C+etc.+not+that+I+do+tie+any+man+unto+it%2C+but+leave+it+to+consideration%3A+but+they+who+begin+the+thousand+years+from+Christ%E2%80%99s+nativity%2C+as+Aretius%2C+or+from+his+resurrection%2C+as+Chytraeus+%5Ba+Lutheran%5D%3A+or+from+the+time+of+universal+Christianism+under+Constantine+the+Great%2C+as+Brightman%2C+Napier%2C+etc.+although+they+differ+a+little+in+the+terms%2C+yet+all+have+this+common+with+us%2C+that+the+first+thousand+years+from+Christ%E2%80%99s+birth+is+to+be+ascribed+to+Satan%E2%80%99s+imprisonment+and+that+the+dragon+is+now+long+ago+loosed+out+of+prison.%E2%80%9D%0A%0A%E2%80%94+David+Pareus%2C+A+Commentary+upon+the+Divine+Revelation+of+the+Apostle+%26+Evangelist+John%E2%80%A6+tr.+Elias+Arnold+%28d.+1622%3B+Amsterdam%3A+C.P.%2C+1644%29%2C+ch.+20%2C+pp.+508+%26+510&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf4aa8dc1b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af4aa8dc1b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/esc

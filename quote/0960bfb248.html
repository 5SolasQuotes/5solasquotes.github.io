<main class="wrap"><figure class="quote" id="q-0960bfb248" data-kw="">
<blockquote><p>Certainly, the Ministers of the Gospel may and must Preach the Law; It is made the note of false prophets to see vain and foolish things, and not to discover iniquity; O how many are there yet unacquainted with their heart and their life vileness, because this glass is not set open to them, and pressed upon them? O how many unbroken and unhumbled hearts are there among us, and all because the Law is not Preached; men are yet strongly wedded to their sins, scorn all tenders of mercy; cannot be drawn to think of, much less to welcome Jesus Christ, and all for want of the Preaching of the Law: Was it ever known, that until the soul was broken and brought low, and John Baptist had done his part (which is the work of the Law) that any man was prepared for Jesus Christ?

Go out therefore O you Ministers of God, gird your sword upon your thighs, and make your arrows keen in the hearts of all obstinate and rebellious sinners; Preach down all those who cry down the Preaching of the Law; and Preach you the Law to discover men unto themselves, to drive them to Christ, and to keep them on duty: Know thus much, when you Preach the Law rightly, you Preach salvation to them that fear it; as when you Preach the Gospel, you Preach damnation to them that neglect or contemn it: I would have every Minister wary in Preaching the Law; It’s possible that there may be an ill dispensation of the Law; The surgeon that launceth, may do as much hurt as he that doth not use the Instrument at all; Such as Preach not the Law at all may make dead and loose hearers, and such as Preach the Law too far may make desperate hearers.

The golden mean is to be observed: The thing I would is this. 1. I would not have the Law to be Preached alone by it self, without a mixture of some of the Promises of the Gospel; The fire hath its heat and light, and a Minister should have both Law and Gospel in his mouth. 2. I would have the Law to be Preached, as it was published, for Evangelical and merciful intentions and purposes; not for destruction and desparation, but for edification: I find that it was published in the hand of a Mediator, I would have it to be Preached in the same hand; he preacheth the Law best who preacheth it with reference to Jesus Christ; as I would in Preaching the Law shew men hell, so I would seek thereby to save them from hell; the wound should neither be made wider or deeper than the Plaster, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sedgwick.html">John Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antinomianism Anatomized. Or, A Glass for the Lawless: Who deny the Ruling use of the Moral Law unto Christians under the Gospel</cite>, (London: Samuel Gellibrand, 1643), pp 27-28.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e0097125d6" data-kw="">
<blockquote><p>For if the inheritance be of the law, it is no more of promise: but God gave it to Abraham by promise.’ If it was ‘by Promise,’ then it was ‘by faith,’ for faith only receives the Promise; if it was by the Law, then it was by works, for works only fulfil the Law. True, the Law was afterwards added to the Promise, but not to disannul or to supersede it; on the contrary, it was itself a dispensation of the covenant of grace, for it was proclaimed in the name of the ‘God of Abraham, and Isaac, and Jacob;’ and if it republished in all their rigour the original terms of the covenant of works, it was only ‘because of transgressions, till the seed should come to whom the Promise was made.’ It was for conviction of sin, for ‘the Law worketh wrath,’ and is a ‘ministration of death;’ but, as such, it was ‘our schoolmaster to bring us unto Christ, that we might be justified by faith.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-buchanan.html">James Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification</cite>, (Edinburgh: T&amp;T Clark, 1867), 52–53.</span></figcaption>

</figure><figure class="quote" id="q-60ccae10cc" data-kw="">
<blockquote><p>It may be remarked that the law of the ten commandments was promulgated to Israel from Sinai in the form of a covenant of works. Not that it was the design of God to renew a covenant of works with Israel or to put them upon seeking life by their own obedience to the law but the law was published to them as a covenant of works to show them that without a perfect righteousness answering to all the demands of the law they could not be justified before God and that finding themselves wholly destitute of that righteousness they might be excited to take hold of the covenant of grace in which a perfect righteousness for their justification is graciously provided. The Sinai transaction was a mixed dispensation. In it the covenant of grace was published as appears from these words in the preface standing before the commandments “I am the Lord thy God which have brought thee out of the land of Egypt out of the house of bondage” and from the promulgation of the ceremonial law at the sametime But the moral law as a covenant of works was also displayed to convince the Israelites of their sinfulness and misery to teach them the necessity of an atonement and lead them to embrace by faith the blessed Mediator the Seed promised to Abraham in whom all the families of the earth were to be blessed. The law therefore was published at Sinai as a covenant of works in subservience to the covenant of grace And the law is still published in subservience to the gospel as a schoolmaster to bring sinners to Christ that they may be justified by faith Gal iii 24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-shaw.html">Robert Shaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed Faith</cite>, (1845) on WCF chapter 19</span></figcaption>

<blockquote><p>It revived the promise of that covenant, —that of eternal life upon perfect obedience. So the apostle tells us that Moses thus describeth the righteousness of the law, “That the man which doeth those things shall live by them,” Romans 10:5; as he doth, Leviticus 18:5. Now this is no other but the covenant of works revived. Nor had this covenant of Sinai any promise of eternal life annexed unto it, as such, but only the promise inseparable from the covenant of works which it revived, saying, “Do this, and live.”</p></blockquote>

</figure><figure class="quote" id="q-91a5d408e3" data-kw="">
<blockquote><p>The Word is differentiated into law and gospel. The law finds its end in Christ, who sets believers free from the curse of the law so that they may walk according to the Spirit and delight in God’s law in their inner selves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, vol. 1 (Grand Rapids, MI: Baker Academic, 2003), 441.</span></figcaption>

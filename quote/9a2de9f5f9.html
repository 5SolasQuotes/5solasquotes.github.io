<main class="wrap"><figure class="quote" id="q-9a2de9f5f9" data-kw="">
<blockquote><p>The word ‘recreation’ is equivocal. Indeed there is a recreation which is mercy, (viz.) the necessary refreshment of the body, as eating, drinking, resting itself, especially to those who have wearied themselves with labor; yea, to some sickly bodies, some ordinary, moderate and inoffensive recreations may be allowed, as a learned man observes. But there is a recreation which we call sports and pastimes, when there is no necessity; and to allow this is no work of mercy; and if it be a mercy to the body, it is severity to the soul…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-wells.html">John Wells</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practical Sabbatarian… (London, 1668) Wells was an English puritan. | ch. 4, ‘That Needless Recreations are Unlawful on the Sabbath’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-71341c3740" data-kw="">
<blockquote><p>Lastly, if it were granted that Ambrose did entreat Count Arbogastes at a feast, whether will any believe it, who considers the austere life of Ambrose, chastising his body with that discipline (as Paulinus, ibidem) that he observed a daily fast, that he would distain himself with feasts on the Lord’s day which hindred the exercises of religion, either public or private? Nay, truly, He might perhaps dine on the Lord’s day, as the custom of the Church required: but we must not believe that the grave father did fare so daintily on that day as that he could not attend the duties of piety: concerning which nature of feasts we are here speaking: in which number that is to [be] reckoned, which Baronius mentions out of Gregor. Turonens, who tells us of a certain presbyter, invading the Bishopric of Avergue, after the death of Sidonius Apollinaris, who, when the Lord’s day came, having prepared a banquet, commanded that all the citizens should be invited into the Church: a wickedness indeed beseeming the author, that he who had ambitiously invaded the Bishops’ See, against the Canons of the Church, should violate the Lord’s solemnity by his feast, that hindered the duties of divine worship: which unlawful example, I hope nobody that relishes anything of Christ will follow. And now I will conclude with St. Austin [Augustine] (Epistle 86), that none can rightly deny that a Christian may on the Lord’s day be refreshed with a moderate and sober dinner, and also will affirm with that grave father, that those who fear God must not riot on the Lord’s Day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-young.html">Thomas Young</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lord’s-Day, or a Succinct Narration compiled out of the Testimonies of Holy Scripture &amp; the Reverend Ancient Fathers… (London: Leach, 1672), bk. 1, ch. 13, pp. 227-28 Young was a Westminster divine.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-80c55310f7" data-kw="">
<blockquote><p>Privately the Sabbath is sanctified by our preparation to God’s public service, which chiefly consists in meditation and prayer, and after the public service, by meditating on the Word heard, and applying it to our own use, and by holy conferences with others. Unto which duties respecting the public worship we are to add and use these other means of sanctifying the remainder of the Lord’s Day: Reading of the Scriptures or other religious and holy writings, meditation on God’s Word and works, especially of creation, preservation and redemption, invocation by prayer, thanksgiving and singing of psalms, and finally godly conferences upon some fit subiect, which best sorts to the present occasion and tends to the use of edification: Unto which means we must add the private works of sanctification, which are the works of mercy, and appertain chiefly either to the body, as the giving of alms, visiting the sick and prisoners, curing diseases, etc. or else to the soul, as, teaching the ignorant, reclaiming those who are seduced by error, admonishing those who fail of their duty by frailty and infirmity, rebuking the scandalous and wilfull offender, exhorting the backward and sluggish, comforting the distressed, counseling them for the good of their souls that need counsel, and reconciling those whom we know to be at variance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Godliness or a Treatise of a Christian Life… (London: Kingstone, 1622), bk. 2, ch. 8, section 5, ‘Of the Spiritual Sanctification, &amp; the Outward Rest’</cite>, pp. 132-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

quote%2F80c55310f7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/80c55310f7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/what-does-keeping-the-lords-day-entail/#:~:text=Privately%20the%20Sabbath%20is%20sanctified%20by,we%20know%20to%20be%20at%20variance&amp;text=Privately%20the%20Sabbath%20is%20sanctified%20by%20our%20preparation&amp;text=those%20whom%20we%20know%20to%20be%20at%20variance" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-51ba2af284" data-kw="">
<blockquote><p>Surely that which is most sweet to the soul of God should be most sweet to our souls: You would wonder to hear a man say that he takes as much delight and he can recreate himself as much in reading, in praying, in hearing sermons, in holy conference as you can do in all your good cheer, in playing and drinking of wine in bowls: You think that men are made to say that they have as much pleasure in those things, as playing at cards, and merriment, and music, and good cheer: you call upon them to play at cards with you, or be merry, you say to them, why should you be dumpish and never be merry? They tell you again that they can be as merry and as cheerful in hearing the Word, and praying, and reading, as you in all your playing, and all that you account delightful. You say to them that they have no recreation. They tell you that those things that are your burdens, are their recreation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Eighth, Ninth and Tenth Chapters of the Prophesy of Hosea... (London: Cole, 1650), pp. 164-65. The context of this does not regard the Sabbath specifically. Burroughs was a Westminster divine.</cite></span></figcaption>

<blockquote><p>…in the Ten Commandments, in which one of seven is a Sabbath to the Lord, it will be found that many positives Moral are in the Covenant of Works… But man being considered as endued with the Image of God, so the Holy God made with him a Covenant of life, with Commandments, though positive and moral, yet not deduced from the Law of Nature, in the strictest sense, as to observe such a Sabbath, the seventh from the Creation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened… (Edinburgh, 1655)</cite>, p. 19</span></figcaption>

<main class="wrap"><figure class="quote" id="q-9bc1280e57" data-kw="">
<blockquote><p>For if the doctrine of Paul is true, that &quot;Christ dwells in our hearts by faith,&quot; (Ephesians 3:17) they can no more separate faith from charity than Christ from his Spirit. If &quot;our hearts are purified by faith,&quot; as Peter affirms, (Acts 15:9,) if &quot;whosoever believeth hath eternal life,&quot; as our Savior so often declares, (John 3:16; 5:24; 6:40; 20:31,) if the inheritance of eternal life is obtained by faith, (Romans 5:14,) faith is something very different from all forms of dead persuasion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Session 6, p. 89</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7581bd9f56" data-kw="">
<blockquote><p>This is why the Bible teaches that faith alone in Christ alone is the only way to salvation from sin. Faith is the anti-work. It’s the realization that there is nothing you can do but trust in what has been done for you in the life, death, and resurrection of Jesus. Faith is the realization that God’s pleasure in you will never be based upon your performance for Him. Instead, God’s pleasure in you will always be based upon Christ’s performance for you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-platt.html">David Platt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Follow Me</cite>, p. 60</span></figcaption>

<blockquote><p>Fiftly, that man is iustified by faith only, that is, for the onely satisfaction of Christ apprehended by faith: and not partly by faith, that is, for Christs satisfaction imputed; and partly by works, that is, for inherent iustice: may be gathered by the sayings following, which teach that a man is iustified without workes.</p></blockquote>

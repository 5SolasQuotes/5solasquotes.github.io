<main class="wrap"><figure class="quote" id="q-747d987750" data-kw="">
<blockquote><p>Peter also says that “baptism also doth now save us” (1 Peter 3:21). For he did not mean to intimate that our ablution and salvation are perfected by water, or that water possesses in itself the virtue of purifying, regenerating, and renewing; nor does he mean that it is the cause of salvation, but only that the knowledge and certainty of such gifts are perceived in this sacrament. This the words themselves evidently show. For Paul connects together the word of life and baptism of water, as if he had said, by the gospel the message of our ablution and sanctification is announced; by baptism this message is sealed. And Peter immediately subjoins, that that baptism is “not the putting away of the filth of the flesh, but the answer of a good conscience toward God, which is of faith.” Nay, the only purification which baptism promises is by means of the sprinkling of the blood of Christ, who is figured by water from the resemblance to cleansing and washing. Who, then, can say that we are cleansed by that water which certainly attests that the blood of Christ is our true and only laver?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.15.2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ac29eba9a3" data-kw="">
<blockquote><p>The folly and falsehood of baptismal regeneration have been already pointed out in the former lecture. All the arguments there aimed against the opus operatum apply here. The error most probably grew as superstition increased in the primitive Church, out of the unguarded use of the sacramental language by the early fathers, whose doctrine on this point was sounder. We know that baptism, in supposed imitation of Titus 3:5, was currently called regeneration as early as Justin Martyr and Irenaeus. It is easy to see how, as men’s ideas of sacred subjects became more gross, this figurative use of the word introduced the real error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-l-dabney.html">R. L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, Meaning of Baptism</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/efficacy.html">Baptism: Efficacy</a> › <a href="../topics/baptism/efficacy/baptismal-regeneration-vs-baptism-as-sign-and-seal.html">Baptismal regeneration vs baptism as sign and seal</a></span></div>

</figure><figure class="quote" id="q-b62827812f" data-kw="">
<blockquote><p>The Apostle Peter declares that baptism “saves us by the resurrection of Jesus Christ” (1 Pet. 3:21). Not by its own efficacy, therefore, but as the emblem of what has been done by Christ’s redemption, whose “resurrection” is one of the constituent factors in it. And in order to preclude the notion that the mere application of water has any spiritual effect like that of regenerating the soul, the apostle explains that baptism does not “save by the putting away of the filth of the flesh,” but by “the answer of a good conscience toward God.” The “answer of a good conscience” is its pacification through the atonement of Christ for sin, to which baptism has reference.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/w-g-t-shedd.html">W. G. T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dogmatic Theology</cite>, on 1 Pet. 3:21</span></figcaption>

</figure><figure class="quote" id="q-ecdfc48c21" data-kw="">
<blockquote><p>We do not hesitate to pronounce the doctrine of “baptismal regeneration” to be the paramount lie of Satan; the most subtle and fatal weapon which this arch foe of our race ever forged for the destruction of men’s souls in eternal perdition! Do not build your hope of glory upon your baptism. You are lost to all eternity if you do. You must be born again if ever you enter the kingdom of heaven. If you plunge into eternity clutching the airy fiction, the fatal notion, that you passed from spiritual death into spiritual life in your baptism; that in baptism you were regenerated, adopted, justified, made holy and saved; you have staked your eternal happiness upon the most fatal lie! In many instances, the unhappy victim of this delusion passes away, undeceived until the deception is too late to rectify!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/octavius-winslow.html">Octavius Winslow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>From Grace to Glory</cite></span></figcaption>

— Octavius Winslow, From Grace to Glory">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+do+not+hesitate+to+pronounce+the+doctrine+of+%E2%80%9Cbaptismal+regeneration%E2%80%9D+to+be+the+paramount+lie+of+Satan%3B+the+most+subtle+and+fatal+weapon+which+this+arch+foe+of+our+race+ever+forged+for+the+destruction+of+men%E2%80%99s+souls+in+eternal+perdition%21+Do+not+build+your+hope+of+glory+upon+your+baptism.+You+are+lost+to+all+eternity+if+you+do.+You+must+be+born+again+if+ever+you+enter+the+kingdom+of+heaven.+If+you+plunge+into+eternity+clutching+the+airy+fiction%2C+the+fatal+notion%2C+that+you+passed+from+spiritual+death+into+spiritual+life+in+your+baptism%3B+that+in+baptism+you+were+regenerated%2C+adopted%2C+justified%2C+made+holy+and+saved%3B+you+have+staked+your+eternal+happiness+upon+the+most+fatal+lie%21+In+many+instances%2C+the+unhappy+victim+of+this+delusion+passes+away%2C+undeceived+until+the+deception+is+too+late+to+rectify%21%E2%80%9D%0A%0A%E2%80%94+Octavius+Winslow%2C+From+Grace+to+Glory&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fecdfc48c21.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ecdfc48c21.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-3aa24a2f4e" data-kw="">
<blockquote><p>Baptism is a profession of faith in the Father, and the Son, and the Holy Spirit; not of a faith to be obtained through the ordinance, but of a faith already entertained. When the Eunuch applied to Philip for baptism, he said: “If thou believest with all thine heart thou mayest.” Of those who heard Peter’s sermon on the day of Pentecost it is said, “they that gladly received his word were baptized.” (Acts 2:41.) On this point, however, there can be no dispute. The only way in which Romanists and Romanizers evade this argument, is by denying that faith and repentance are the fruits of the Spirit, or of regeneration. They are in their view not gracious, but natural works, works done before regeneration; works which leave the soul in a state of perdition. But in this they contradict the express words of Christ, who says, whosoever believes shall be saved. And, in contradicting Christ, they contradict the whole Bible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, “Efficacy of Baptism”</span></figcaption>

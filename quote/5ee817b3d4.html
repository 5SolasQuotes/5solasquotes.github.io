<main class="wrap"><figure class="quote" id="q-5ee817b3d4" data-kw="">
<blockquote><p>But, says, somebody, how are these people, who attribute to the sky the shape of a sphere or globe, not contradicted by what is written in our literature: ‘who stretched out the sky like a skin’ (Psalm 104:2)? Certainly let it be contradicted by that, if what they say is false; this after all, is true which has divine authority behind it, rather than that which is the guesswork of human weakness. But if it should happen that they can prove their case with evidence and arguments beyond any possibility of doubt, then it has to be demonstrated that what is said here among us about a skin is not contrary to those explanations of theirs. Otherwise, in any case (if you are going to be crassly literal-minded) it will also be contrary to another place in these very scriptures of ours where the sky is said to be like a suspended dome. What, I ask you, could be so different and opposed to each other as a skin stretched out flat, and the hollow curve of a dome? But if we are obliged, as indeed we are, to understand these two expressions in such a way that they are found to agree with each other and not to be in the least contradictory, then we are also and equally obliged to demonstrate that neither of them is opposed to those explanations, should they happen to be shown by rational arguments to be true, which inform us that the sky has the shape of a hollow globe all round us—provided, once again, it can be proved. And even if that comparison on our side with a dome is taken literally, it will make no difficulty for those who say the sky is a globe; it is reasonable to assume that Scripture wished to talk about the shape of the sky with reference to that part of it which is above us. So if the sky is not a globe, it is in one part—the part which covers the Earth—a dome, while if it is a globe, then it is a dome all round. But as for the text about a skin, that is rather more serious, because it may seem to be opposed, not to the globe, which may just be a human fabrication, but to our own dome. My treatment of this in terms of allegory may be found in the thirteenth book of my Confessions. So whether the sky being stretched out like a skin is to be understood allegorically in the way I suggested there, or in some other way, still to satisfy the tiresome people who persist in demanding a literal explanation I will say what in my opinion should be obvious to anyone of sense. Each term, no doubt, that is both ‘skin’ and ‘dome’ can be understood figuratively; but what we have to see is how each can be explained literally. Well, if is it not only curved but also a flat ceiling that can be called a dome, then assuredly a skin for its part can be stretched out round a curve as well as on a flat plane, After all, both wine containers and footballs are skins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Literal Meaning of Genesis’, pp. 202-203 in ed. Hill &amp; Rotelle, On Genesis: On Genesis: a Refuation of the Manichees, Unfinished Literal Commentary on Genesis, The Literal Meaning of Genesis in The Works of St. Augustine : a Translation for the 21st Century (NY: New City Press, 2002)</cite></span></figcaption>

<blockquote><p>When Moses writes that God created Heaven and Earth and whatever is in them in six days, then let this period continue to have been six days, and do not venture to devise any comment according to which six days were one day. But, if you cannot understand how this could have been done in six days, then grant the Holy Spirit the honor of being more learned than you are. For you are to deal with Scripture in such a way that you bear in mind that God Himself says what is written. But since God is speaking, it is not fitting for you wantonly to turn His word in the direction you wish to go.</p></blockquote>

<blockquote><p>Third, it is shown by the relation of effects to their cause. For effects proceed from the agent that causes them, in so far as they pre-exist in the agent; since every agent produces its like. Now effects pre-exist in their cause after the mode of the cause. Wherefore since the Divine Being is His own intellect, effects pre-exist in Him after the mode of intellect, and therefore proceed from Him after the same mode. Consequently, they proceed from Him after the mode of will, for His inclination to put in act what His intellect has conceived appertains to the will. Therefore the will of God is the cause of things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1 | quest. 19 | art. 4, I answer that</cite></span></figcaption>

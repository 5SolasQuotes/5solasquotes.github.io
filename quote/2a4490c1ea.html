<blockquote><p>It follows from this view that, as the atonement of Christ was, in itself, sufficient, had God so pleased, to ground the salvation of all men, it is sufficient to ground the universal offer of salvation. Men are invited to stand on a platform which is broad enough to hold them all, to rest upon a foundation which is strong enough to support them all, to partake of provisions which are abundant enough to supply them all. When, therefore, God invites all men to seek salvation in Christ, He is not insincere in offering them a platform too narrow to hold them, a foundation too weak to sustain them, provisions too meagre to supply them. Were they all to accept the invitation, they would all be saved. So much for the intrinsic sufficiency of the remedy for human sin and misery. So far the Calvinist is not chargeable with representing God as insincere in the matter of the gospel offer. It will be urged, however, that notwithstanding his admission of the absence of limitation, as to the intrinsic sufficiency of the atonement, the difficulty remains in view of his doctrine that there is limitation, as to its extrinsic design and application. It was not rendered for all, it is not intended to be effectually applied to all…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism &amp; Evangelical Arminianism, pt. 1, Section 3, Objections [to Election and Reprobation] from the Moral Attributes of God Answered; 4. Objection from Divine Veracity</cite>, pp. 359-93</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2382ecf531" data-kw="">
<blockquote><p>For the transgression of my people was he stricken” (lsa. 53:8). “Thou shalt call his name JESUS: for he shall save his people from their sins” (Matt. 1:21). “The Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many” (Matt. 20:28). “The good Shepherd giveth his life for the sheep” (John’ 10:11). “Christ also loved the church and gave himself for it” (Eph. 5: 25). “Who gave himself for us, that he might redeem us from all iniquity, and purify unto himself a peculiar people” (Titus 2: 14). “To make propitiation for the sins of the people” (Heb. 2: 17). Here are seven passages which gave a clear and simple answer to our question, and their testimony, both singly and collectively, declare plainly that the death of Christ was not an atonement for sin abstractedly, nor a mere expression of Divine displeasure against iniquity, nor an indefinite satisfaction of Divine justice, but instead, a ransom-price paid for the eternal redemption of a certain number of sinners, and a plenary satisfaction for their particular sins. It is the glory of redemption that it does not merely render God placable and man pardonable, but that it has reconciled sinners to God, put away their sins, and forever perfected His set-apart ones.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-w-pink.html">A.W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Gospel of John (Zondervan, 1962), 2.219-22 This is early Pink, at his worst. HT: David Ponter | Whenever the Holy Scriptures speak of the sufficiency of redemption, they always place it in the certain efficacy of redemption. The atonement of Christ is sufficient because it is absolutely efficacious, and because it effects the salvation of all for whom it was made. Its sufficiency lies not in affording man a possibility of salvation, but in accomplishing their salvation with invincible power. Hence the Word of God never represents the sufficiency of the atonement as wider than the design of the atonement. How different is the salvation of God from the ideas now popularly entertained of it! “As for thee also, by the blood of thy covenant I have sent forth thy prisoners out of the pit wherein is no water” (Zech. 9:11). Christ, by his death paid the ransom, and made sin’s captives his own. He has a legal right to all of the persons for whom He paid that ransom price, and therefore with God’s own right arm they are brought forth. For whom did Christ die?</cite></span></figcaption>

</figure><figure class="quote" id="q-95fd72c726" data-kw="">
<blockquote><p>It is not able to be said that Christ does not in any way pertain to reprobates. Christ pertains to them even (1) by right [jure] in the offer of the Gospel, (2) by the sufficiency of the death of Christ, (3) by the right of sharing in a common nature, (4) by right of the common, first transgression being expiated by Christ, (5) by right of the New Covenant being preached to the reprobate out of the grace of Christ, (6) by right of the charge of God inciting so that reprobates receive Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rutherford’s Examination of Arminianism: the Tables of Contents with Excerpts from Every Chapter tr. Charles Johnson &amp; Travis Fentiman (1639-1642; 1668; 2019), ch. 9, ‘Of Universal Redemption’, ‘Whether Reprobates are required to believe in Christ, He not having died for them?’</cite>, pp. 94-95</span></figcaption>

<blockquote><p>IX. Hence the state of the question is easily elicited. (1) It is not asked with respect to the value and sufficiency of the death of Christ–whether it was in itself sufficient for the salvation of all men. For it is confessed by all that since its value is infinite, it would have been entirely sufficient for the redemption of each and every one, if God had seen fit to extend it to the whole world. And here belongs the distinction used by the fathers and retained by many divines–that Christ ‘died sufficiently for all, but efficiently for the elect only.’ For this being understood of the dignity of Christ’s death is perfectly true (although the phrase would be less accurate if referred to the will and purpose of Christ). But the question properly concerns the purpose of the Father in delivering up his own Son and the intention of Christ in dying. Did the Father appoint his Son for each and every one and, did the Son deliver himself up to death with the design and intention of substituting himself in the place of each and every one to make satisfaction and acquire salvation for the same? Or did he resolve to deliver himself up for the elect only, who were given him by the Father to be redeemed and whose head he was to be?… Hence it is sufficiently evident that it is not here treated of the revealed will (eurestias) of God only, but of his secret will (eudokias) under which the death and mission of Christ fall (as all must agree). X. (2) The question does not concern the fruits and efficacy of Christ’s death–whether each and all will be actually made partakes of these [and hence be saved]… Our opponents acknowledge that these are to be extended to believers only. Rather the question refers to the design of God in sending his Son into the world and the purpose of Christ in his death. Were these such that Christ by substituting himself in the place of each and every one, made satisfaction and obtained the remission of sin and salvation for them all or for the elect only? They affirm the former; we affirm the latter. XI. (3) We do not inquire whether the death of Christ gives occasion to the imparting of many blessings even to reprobates. For it is due to the death of Christ that the gospel is preached to every creature, that the gross idolatry of the heathen has been abolished from many parts of the world , that the daring impiety of men is greatly restrained by God’s word and that some often obtain many and excellent (though not saving) gifts of the Holy Spirit. All these unquestionable flow from the death of Christ, since no place would have been given for them in the church unless Christ had died. Rather the question is whether the suretyship and satisfaction of Christ were (by the counsel of God and the will of Christ himself) intended for each and every one (as they hold); or for the elect only (as we assert).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, vol. 2, 14th Topic, ‘The Mediatorial Office of Christ’, Question 14, sections 9-11</cite>, pp. 458-59</span></figcaption>

<div class="actions"><button class="copy" data-copy="“IX. Hence the state of the question is easily elicited. (1) It is not asked with respect to the value and sufficiency of the death of Christ–whether it was in itself sufficient for the salvation of all men. For it is confessed by all that since its value is infinite, it would have been entirely sufficient for the redemption of each and every one, if God had seen fit to extend it to the whole world. And here belongs the distinction used by the fathers and retained by many divines–that Christ ‘died sufficiently for all, but efficiently for the elect only.’ For this being understood of the dignity of Christ’s death is perfectly true (although the phrase would be less accurate if referred to the will and purpose of Christ). But the question properly concerns the purpose of the Father in delivering up his own Son and the intention of Christ in dying. Did the Father appoint his Son for each and every one and, did the Son deliver himself up to death with the design and intention of substituting himself in the place of each and every one to make satisfaction and acquire salvation for the same? Or did he resolve to deliver himself up for the elect only, who were given him by the Father to be redeemed and whose head he was to be?… Hence it is sufficiently evident that it is not here treated of the revealed will (eurestias) of God only, but of his secret will (eudokias) under which the death and mission of Christ fall (as all must agree). X. (2) The question does not concern the fruits and efficacy of Christ’s death–whether each and all will be actually made partakes of these [and hence be saved]… Our opponents acknowledge that these are to be extended to believers only. Rather the question refers to the design of God in sending his Son into the world and the purpose of Christ in his death. Were these such that Christ by substituting himself in the place of each and every one, made satisfaction and obtained the remission of sin and salvation for them all or for the elect only? They affirm the former; we affirm the latter. XI. (3) We do not inquire whether the death of Christ gives occasion to the imparting of many blessings even to reprobates. For it is due to the death of Christ that the gospel is preached to every creature, that the gross idolatry of the heathen has been abolished from many parts of the world , that the daring impiety of men is greatly restrained by God’s word and that some often obtain many and excellent (though not saving) gifts of the Holy Spirit. All these unquestionable flow from the death of Christ, since no place would have been given for them in the church unless Christ had died. Rather the question is whether the suretyship and satisfaction of Christ were (by the counsel of God and the will of Christ himself) intended for each and every one (as they hold); or for the elect only (as we assert).”

— Francis Turretin, Institutes, vol. 2, 14th Topic, ‘The Mediatorial Office of Christ’, Question 14, sections 9-11, pp. 458-59">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIX.+Hence+the+state+of+the+question+is+easily+elicited.+%281%29+It+is+not+asked+with+respect+to+the+value+and+sufficiency+of+the+death+of+Christ%E2%80%93whether+it+was+in+itself+sufficient+for+the+salvation+of+all+men.+For+it+is+confessed+by+all+that+since+its+value+is+infinite%2C+it+would+have+been+entirely+sufficient+for+the+redemption+of+each+and+every+one%2C+if+God+had+seen+fit+to+extend+it+to+the+whole+world.+And+here+belongs+the+distinction+used+by+the+fathers+and+retained+by+many+divines%E2%80%93that+Christ+%E2%80%98died+sufficiently+for+all%2C+but+efficiently+for+the+elect+only.%E2%80%99+For+this+being+understood+of+the+dignity+of+Christ%E2%80%99s+death+is+perfectly+true+%28although+the+phrase+would+be+less+accurate+if+referred+to+the+will+and+purpose+of+Christ%29.+But+the+question+properly+concerns+the+purpose+of+the+Father+in+delivering+up+his+own+Son+and+the+intention+of+Christ+in+dying.+Did+the+Father+appoint+his+Son+for+each+and+every+one+and%2C+did+the+Son+deliver+himself+up+to+death+with+the+design+and+intention+of+substituting+himself+in+the+place+of+each+and+every+one+to+make+satisfaction+and+acquire+salvation+for+the+same%3F+Or+did+he+resolve+to+deliver+himself+up+for+the+elect+only%2C+who+were+given+him+by+the+Father+to+be+redeemed+and+whose+head+he+was+to+be%3F%E2%80%A6+Hence+it+is+sufficiently+evident+that+it+is+not+here+treated+of+the+revealed+will+%28eurestias%29+of+God+only%2C+but+of+his+secret+will+%28eudokias%29+under+which+the+death+and+mission+of+Christ+fall+%28as+all+must+agree%29.+X.+%282%29+The+question+does+not+concern+the+fruits+and+efficacy+of+Christ%E2%80%99s+death%E2%80%93whether+each+and+all+will+be+actually+made+partakes+of+these+%5Band+hence+be+saved%5D%E2%80%A6+Our+opponents+acknowledge+that+these+are+to+be+extended+to+believers+only.+Rather+the+question+refers+to+the+design+of+God+in+sending+his+Son+into+the+world+and+the+purpose+of+Christ+in+his+death.+Were+these+such+that+Christ+by+substituting+himself+in+the+place+of+each+and+every+one%2C+made+satisfaction+and+obtained+the+remission+of+sin+and+salvation+for+them+all+or+for+the+elect+only%3F+They+affirm+the+former%3B+we+affirm+the+latter.+XI.+%283%29+We+do+not+inquire+whether+the+death+of+Christ+gives+occasion+to+the+imparting+of+many+blessings+even+to+reprobates.+For+it+is+due+to+the+death+of+Christ+that+the+gospel+is+preached+to+every+creature%2C+that+the+gross+idolatry+of+the+heathen+has+been+abolished+from+many+parts+of+the+world+%2C+that+the+daring+impiety+of+men+is+greatly+restrained+by+God%E2%80%99s+word+and+that+some+often+obtain+many+and+excellent+%28though+not+saving%29+gifts+of+the+Holy+Spirit.+All+these+unquestionable+flow+from+the+death+of+Christ%2C+since+no+place+would+have+been+given+for+them+in+the+church+unless+Christ+had+died.+Rather+the+question+is+whether+the+suretyship+and+satisfaction+of+Christ+were+%28by+the+counsel+of+God+and+the+will+of+Christ+himself%29+intended+for+each+and+every+one+%28as+they+hold%29%3B+or+for+the+elect+only+%28as+we+assert%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes%2C+vol.+2%2C+14th+Topic%2C+%E2%80%98The+Mediatorial+Office+of+Christ%E2%80%99%2C+Question+14%2C+sections+9-11%2C+pp.+458-59&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa50d3e7563.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a50d3e7563.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/limited-atonement/#:~:text=IX.%20Hence%20the%20state%20of%20the,the%20elect%20only%20%28as%20we%20assert&amp;text=IX.%20Hence%20the%20state%20of%20the%20question%20is&amp;text=or%20for%20the%20elect%20only%20%28as%20we%20assert" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>This deed of gift and grant, or authentic gospel-offer is expressed in so many words, ‘For God so loved the world, that he gave his only begotten Son, that whosoever believes in Him should not perish, but have everlasting life’ (John 3:16). Where the gospel comes, this grant is published, and the ministerial offer made, and there is no exception of any of all mankind in the grant. If there was, no ministerial offer of Christ could be warrantably made to the party excepted, more than to the fallen angels; and without question, the publishing and proclaiming of heaven’s grant unto any, by way of ministerial offer, presupposes the grant, in the first place, to be made to them: otherwise, it would be of no more value than a crier’s offering of the king’s pardon to one who is not comprehended in it. This is the good old way of discovering to sinners their warrant to believe in Christ; and it does indeed bear the sufficiency of the sacrifice of Christ for all, and that Christ crucified is the ordinance of God for salvation unto all mankind, in the use-making of which only they can be saved; but not an universal atonement or redemption.</p></blockquote>

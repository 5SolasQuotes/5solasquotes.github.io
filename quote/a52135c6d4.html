<main class="wrap"><figure class="quote" id="q-a52135c6d4" data-kw="">
<blockquote><p>9. Though we must not by profession, word or subscription own the sin of any Church, we must [in some circumstances] join in their communion in the worship of God, with those whose worship is mixed with sin in matter and manner, so it be not sin that is by its evil predominant against the good of the duty, to make the work rejected of God (like poison in our food, which makes the hurt greater than the good), because else we must neither worship God ourselves [because of our own impurities], nor join with any in the world: all the works of sinful men being mixed with sin. To deny this, is virtually to separate from all the Christian world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, Detailed | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2, pp. 9-14 | Must not own Sin, Yet must Join with Others with Mixed Worship</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-688bda96f3" data-kw="">
<blockquote><p>Q. 138, ‘How may we know the Fundamentals, Essentials, or what parts are necessary to Salvation? And is the Papists way allowable that (some of them) deny that distinction, and make the difference to be only in the degrees of men’s opportunities of knowledge?’ …And whereas they [Papists] would make all the parts of Christian faith and practice equally necessary, where men have a capacity and ability to know, believe and practice them, it is a gross deceit… And thereby they make all sins and errors as equal as all duties and truths (James 3:2; 1 John 1, end). Whereas:

1. There is no man that has not some error and some sin.

2. There is no man that does all that ever he was able to do to understand all the truth.

3. Therefore there is no man whose errors themselves are not (many of them at least) culpable or sinful.

4. And they that distinguish between mortal and venial sins, and yet will not distinguish between mortal and venial errors, are either blind or would keep others blind. As it is not so damning a sin for a man to think a vain thought, or to speak a vain word, as not to love God or holiness (no though he was more able to have forborne that idle word than to have loved God), so it is not so mortal a sin (that is, inconsistent with a justified state) to mistake in a small matter (as who was the Father of Arphaxad, or what year the world was drowned in, etc.) as to blaspheme the Holy Ghost or deny Jesus Christ to be the Savior of the world, or to deny that there is a God or everlasting life, or a difference between good and evil. All sins are not equal in magnitude or danger. Therefore all errors are not equal in magnitude sinfulness or danger.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), pt. 3, Christian Ecclesiastics, p. 895</span></figcaption>

</figure><figure class="quote" id="q-b0ac55f2ac" data-kw="">
<blockquote><p>As the goodness of outward acts consists not in the acts themselves, so the acceptableness of them results not from the acts themselves but from the inward frame animating and quickning those acts, as blood and spirits running through the veins of a duty to make it a living service in the sight of God. Imperfections in worship hinder not God’s acceptation of it, if the heart spirited by grace be there to make it a sweet savour. The stench of burning flesh and fat in the legal sacrifices might render them noisome to the outward senses; but God smelt a sweet savour in them, as they respected Christ. When the heart and spirit are offered up to God, it may be a savory duty, though attended with unsavory imperfections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God</cite>, (London, 1682) | ‘Of Spiritual Worship’, p. 169</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<blockquote><p>They [older non-conformists] argue that there is no necessity for [total] Separation for the sake of such corruptions, because a person may communicate in the worship without partaking in those corruptions… 1. This separation of the good from the bad in divine worship they grant possible. So Mr. [John] Ball: ‘If some things human be mixed with divine, a sound Christian must separate the one from the other, and not cast away what is of God as a nullity, fruitless, unprofitable, defiled, because somewhat of men is annexed unto them. In the body we can distinguish betwixt the substance and the sickness which cleaves unto it; betwixt the substance of a part or member, and some bunch or swelling, which is a deformity, but destroys not the nature of that part or member, etc.’ (Trial of the Grounds, etc., [ch. 13,] p. 308) … 2. They grant that what is faulty and a sin in worship, is no sin to us when we do not consent to it. So Mr. [John] Corbet: ‘My partaking in any divine worship, which is holy and good for the matter and allowable or passable in the mode for the main, does not involve me in the blame of some sinful defects therein, to which I consent not and which I cannot redress.’ (Non-Conformists Plea, etc., p. 6) So another [John Barret], in his Farewell Sermon: ‘While all necessary fundamental truth is publicly professed and maintained in a Church, is taught and held forth in public assemblies and the corruptions there (though great, yet) are not such as make the worship cease to be God’s worship, nor of necessity to be swallowed down if one would communicate in that worship, while any Christian (that is watchful over his own heart and carriage, as all ought ever to be) may partake in the one, without being active in, or approving the other; there God is yet present, there he may be spiritually worshipped, served acceptably, and really enjoyed.’ (England‘s Remembrancer, sermon 4, p. 94)</p></blockquote>

<blockquote><p>§4. So if a pastor call the assembly at an inconvenient hour, or to an inconvenient place, though it be his sin to do so, yet is it their duty to obey. If in the manner of prayer he (tolerably) miscarry, they may not therefore refuse to join with him. If of two translations of Scripture, or two versions of the Psalms, he use the worser (so it be tolerable), they must obey. §5. Yet if the miscarriage be so great in the ordering even of these circumstances, or in the manner of duties, as shall overthrow the duty itself, and be inconsistent with the ends, or bring greater evils upon the Church than our refusing to obey the pastors (in those cases) can do; then (as I have before showed) we are not bound to follow him in such a case: But otherwise we are. §6… If none shall obey a magistrate or pastor in the works of their own office, as long as they think he did them not the best way, all government then would be presently overthrown, and obedience denied… §7. And the things in which the pastor is now supposed to err, are not of themselves unlawful, but only by such an accident, as being overweighed by another accident, shall cease to make them unlawful. For instance: If the pastor appoint a more imperfect version of the Psalms to be sung in the Church (as is commonly done in England), the obeying of him in the use of this will not bring so much hurt to the Church as the disobeying on that account would do: For besides the sin of disobedience itself, the Church would be in a confusion if they forsake his conduct that preserves the union; and some will be for this and some for that, and so the worship itself will be overthrown. But if the pastor would command a version so corrupt as would overthrow the duty itself, or be as bad as non-performance, the Church is then to seek redress and not obey him. So if he command a time inconvenient, but tolerable (as to meet at sun rising or sun setting) it were better [to] obey than dissolve the Church (if we cannot be otherwise relieved). But if he appoint a time that’s intolerably unfit (as at midnight), I would not obey (except in such necessity as leaves [public worship] to that time or none)… §9. If I be bound to obey a governor if he set me to pick straws, or to hunt a feather, it follows not that he may lawfully command it. I have heard many pleading for ceremonies say that if the magistrate commanded them, and would not otherwise permit them to preach the Gospel, they would preach in a fool’s coat and a fool’s cap with a feather rather than forbear. But I do not think that any of them would justify that ruler that would make such a law that no man should preach or celebrate the sacraments but in a fool’s coat and cap: such might expect to be judged by Christ, as the scorners of Him and his ordinances.</p></blockquote>

<blockquote><p>Those who exaggeratingly refer to other Christian ministers sound in the fundamentals, albeit erring in other respects, as the sons of Belial or priests of Baal worshipping in the high places (where literal idolatry was used and other gods sacrificed to, a matter of fundamentals or tending to overturn them),¹ as the Separatists did,² are not harmless, but slanderous; cure yourself of that warped intoxication and protect others from it. ¹ Lev. 26:30; Dt. 12:2; 1 Kn. 11:7; 14:23; 2 Kn. 18:4; 21:3, 5; 23:20; 2 Chron. 11:15; 14:3–5; 28:25; 2 Chron. 31:1; 33:3, 17–19; 34:3; Ps. 78:58; Jer. 32:35; 48:35; Eze. 6:6, 13. ² Robert Browne, An Answer to Master Cartwright… (London: 1585), p. 48; Henry Barrow, A Collection of Certain Letters &amp; Conferences… ([Dordrecht] 1590), p. 27; idem, A Plain Refutation of Mr. G. Giffard’s Reproachful Book (Dordrecht, 1591), pp. 2, 7, 63, 189, 216, 223.</p></blockquote>

ristian%20ministers&amp;text=1591%29%2C%20pp.%202%2C%207%2C%2063%2C%20189%2C%20216%2C%20223" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7cc0ca3135" data-kw="">
<blockquote><p>What assemblies of Christians we behold visibly worshiping God in Christ, we take for granted to be true visible churches. And when we judge of our own communion with them, it is not upon this question, whether they are true churches or no, as though the determination of our practice did depend solely thereon: For as we are not called to judge of the being of their constitution, as to the substance of it, unless they are openly judged in the Scripture, as in the case of idolatry and persecution persisted in, so a determination of the truth of their constitution, or that they are true churches, will not presently resolve us in our duty as to communion with them, for the reasons before given. But in such a case, two things are by us principally to be considered: 1. That nothing sinful in it self, or unto us, be required of us as the condition of communion. 2. That we may in such churches obtain the immediate end of their institution, and our conjunction with them, which is our edification in faith, love and obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Evangelical Love, Church-Peace &amp; Unity, with the Occasions &amp; Reasons present Differences &amp; Divisions about Things Sacred &amp; Religious (1672), ch. 3</cite>, pp. 82-83</span></figcaption>

<blockquote><p>God is not only a spirit or spiritual substance, but He is every way infinite and has sufficiency of all perfection in Himself. And therfore He takes no delight in any good thing that the creature can communicate to Him: but his delight is in the communication of his own goodness to us, and in all such duties whereby we conform ourselves to Him and magnify his goodness. Thus Paul, Acts 17:25, that ‘God needs nothing,’ and therefore He is not worshipped with anything made by the hands of man. And the Lord says by the Psalmist (Ps. 50; 8; 14) that He does not principally respect our gifts and our sacrifices, because all things are his, but He respects praise and thanksgiving.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-fb0e36da0c" data-kw="">
<blockquote><p>The Scriptures of truth give no uncertain sound; there is nothing indefinite or ambiguous in them, no collision between the statements and descriptions of one inspired writer and another. The goodness of which they speak is a goodness which they describe in all its parts, and all its principles, and all its manifestations, with the most perfect harmony and mutual agreement—a goodness which is the same in every age and under every dispensation, in every rank of life and every state of society.

When they speak of Joseph of Arimathea, and Barnabas, and others, and say of them that they were “good” men, they use the epithet in a sense which they themselves have unfolded with the utmost clearness and precision; they speak of the goodness of these men of God according to that standard of truth and righteousness which is immutable as the throne of the Almighty, eternal as the character and attributes of Jehovah—of goodness manifested, not in one or a few particulars of life and conduct, but in all the dispositions, and graces, and conduct of the children of God. They speak of it, not as existing perfect and immaculately pure in this lower world, but as the goodness of the saints, the excellent ones of the earth, the sons of God and the followers of Christ, in contradistinction from those specious appearances which attract the notice and admiration of men, but are “abomination in the sight of God.”

In common conversation we are accustomed to use the epithet “bad,” as applicable only to men of the most abandoned character, but we ought never to forget that before God the whole world is divided into two classes, the good and the bad, the righteous and the wicked; the former comprehending in it the children of God in all the degrees of moral excellence to which they have attained, and the latter, the children of the wicked one, from the mere moralist on the one hand, to the most profligate and abandoned criminal on the other.

Goodness, in the Scripture sense of the word, is holiness; it is the goodness which God enjoins, and of which he himself presents the most perfect pattern—the goodness which, begun on earth in the regeneration of the true Christian, is accepted and approved through Christ Jesus, and which, increasing with the increase of God, is perfected at last in his presence in heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-macfarlan.html">Patrick MacFarlan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Goodness in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4e53e27cae" data-kw="">
<blockquote><p>In God it [‘mercy’] notes his readiness to do good to the miserable, notwithstanding sin. The motion comes from within, from his own breast and bowels. For our God is pitiful and of tender mercy, James 5:11, and the act of it is extended and reached out unto the creature in seasonable relief. For the throne of grace was erected for this purpose, Heb. 4:11. Two things there are in mercy: First, a propension and inclination to commiserate the afflicted. Secondly, a ready relief and succour of them according to our power, affectus and effectus. First, there is a compassion or a being affected with the misery of others. This properly cannot be in God, in whom as there is no passion, so strictly speaking there is no compassion; yet something analagous there is, a taking notice of our misery. Something like a pity arising in his heart upon the sight of it; which the Scripture frequently ascribes to God, and we can best understand as we consider the divine perfections shining forth in the human nature of Christ. Ex. 2:24, ‘He heard their groaning;’ and Isa. 63:4, ‘In all their afflictions He was afflicted.’ Judges 10:16, ‘His soul was grieved for the misery of Israel.’ Forms of speech taken from the manner of men, who use to be thus affected when they see a miserable object. God in his simple and perfect nature cannot be said either to joy or grieve: but He carries Himself as one thus affected. Or these expressions were laid in aforehand to suit with the divine perfections as manifested in Christ, who is touched with a feeling of our infirmities. Secondly, mercy notes the actual exhibition of help and relief to the miserable…</p></blockquote>

<blockquote><p>From these things the state of the question can clearly be gathered. The question is not: (1) whether the covenant of grace was various as to accidentals and the different modes and degrees of dispensation and manifestation (for we confess that under this relation [schesei] there is a multiple difference between the Old and New Testament or the old and new economy, as will be proved in its proper place). Rather the question is whether it was the same as to substance and the essential parts of the covenant, i.e., both as to the covenanted themselves and as to the federal pact consisting in the mutual obligation of the parties. Whether the same Mediator (Christ) in both; the same faith in Christ; promises of the same spiritual and heavenly blessings; the same way of reconciliation and salvation—the economy and administration only of the covenant varying. This our opponents deny; we affirm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.5.5</span></figcaption>

</figure><figure class="quote" id="q-ce0d0714fd" data-kw="">
<blockquote><p>God having thus entered into covenant with our Surety Christ Jesus, was pleased also to enter into covenant with us in him. Now this covenant we define to be, a free and gratuitous agreement between an offended God and offending man, in which God promises to man pardon and salvation through the merits and satisfaction of Christ, and man on his part promises faith and obedience. The only author of this covenant is God, who alone could raise fallen man, and make a new covenant in the place of the old. God is here considered as offended, but at the same time as a merciful Father, capable of being propitiated, and willing to be reconciled to offending man. Man, with whom the covenant is entered into, is considered as a sinful creature, but conscious of his guilt and misery. The Mediator of the covenant is Christ. In this covenant God promises that he will be our God, which promise includes both our reconciliation and communion with him, and also the communication of those good things which are necessary for us, particularly holiness, life, and immortality Again, God requires from us that we should be his people, namely, he requires of us faith, repentance, worship, and obedience, all which he produces in us by his Spirit. The seals of this covenant are the sacraments. It is called the new covenant, because the old is abolished and the covenant of grace, because man in no way whatever could merit it, but God of his mere mercy entered into it with man; and also to distinguish it from the first covenant, which is called the covenant of works, which was entered into with Adam, and renewed on Mount Sinai. These two covenants indeed agree with each other in various particulars:—of both, God is the author; in both there are the same contracting parties; in both is promised eternal life and happiness: but they differ also in many respects; in the covenant of works God is considered as Creator and Lord, in the covenant of grace as Redeemer and Father; in the first there were was no mediator, in the second Christ is the Mediator; in the one God dealt with man as upright, in the other he deals with man as a sinner; the former depended on man’s own obedience, the latter depends on the obedience of Christ; in the former was promised life, namely, a state consisting of all good things; in the latter is promised salvation, which, along with life, includes also deliverance from sin and death; in the first God required works, saying, Do this and live; in the second he requires faith, saying, Believe, and thou shall be saved. The covenant of grace does indeed require works of righteousness, but not that we may merit eternal life by them; nor does the imperfection of Christian obedience, provided it be sincere, stand in the way of our salvation.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“God having thus entered into covenant with our Surety Christ Jesus, was pleased also to enter into covenant with us in him. Now this covenant we define to be, a free and gratuitous agreement between an offended God and offending man, in which God promises to man pardon and salvation through the merits and satisfaction of Christ, and man on his part promises faith and obedience. The only author of this covenant is God, who alone could raise fallen man, and make a new covenant in the place of the old. God is here considered as offended, but at the same time as a merciful Father, capable of being propitiated, and willing to be reconciled to offending man. Man, with whom the covenant is entered into, is considered as a sinful creature, but conscious of his guilt and misery. The Mediator of the covenant is Christ. In this covenant God promises that he will be our God, which promise includes both our reconciliation and communion with him, and also the communication of those good things which are necessary for us, particularly holiness, life, and immortality Again, God requires from us that we should be his people, namely, he requires of us faith, repentance, worship, and obedience, all which he produces in us by his Spirit. The seals of this covenant are the sacraments. It is called the new covenant, because the old is abolished and the covenant of grace, because man in no way whatever could merit it, but God of his mere mercy entered into it with man; and also to distinguish it from the first covenant, which is called the covenant of works, which was entered into with Adam, and renewed on Mount Sinai. These two covenants indeed agree with each other in various particulars:—of both, God is the author; in both there are the same contracting parties; in both is promised eternal life and happiness: but they differ also in many respects; in the covenant of works God is considered as Creator and Lord, in the covenant of grace as Redeemer and Father; in the first there were was no mediator, in the second Christ is the Mediator; in the one God dealt with man as upright, in the other he deals with man as a sinner; the former depended on man’s own obedience, the latter depends on the obedience of Christ; in the former was promised life, namely, a state consisting of all good things; in the latter is promised salvation, which, along with life, includes also deliverance from sin and death; in the first God required works, saying, Do this and live; in the second he requires faith, saying, Believe, and thou shall be saved. The covenant of grace does indeed require works of righteousness, but not that we may merit eternal life by them; nor does the imperfection of Christian obedience, provided it be sincere, stand in the way of our salvation.”

— Benedict Pictet, Christian Theology, trans. Frederick Reyroux (Philadelphia: Presbyterian Board of Publication, n.d.), 281–82.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+having+thus+entered+into+covenant+with+our+Surety+Christ+Jesus%2C+was+pleased+also+to+enter+into+covenant+with+us+in+him.+Now+this+covenant+we+define+to+be%2C+a+free+and+gratuitous+agreement+between+an+offended+God+and+offending+man%2C+in+which+God+promises+to+man+pardon+and+salvation+through+the+merits+and+satisfaction+of+Christ%2C+and+man+on+his+part+promises+faith+and+obedience.+The+only+author+of+this+covenant+is+God%2C+who+alone+could+raise+fallen+man%2C+and+make+a+new+covenant+in+the+place+of+the+old.+God+is+here+considered+as+offended%2C+but+at+the+same+time+as+a+merciful+Father%2C+capable+of+being+propitiated%2C+and+willing+to+be+reconciled+to+offending+man.+Man%2C+with+whom+the+covenant+is+entered+into%2C+is+considered+as+a+sinful+creature%2C+but+conscious+of+his+guilt+and+misery.+The+Mediator+of+the+covenant+is+Christ.+In+this+covenant+God+promises+that+he+will+be+our+God%2C+which+promise+includes+both+our+reconciliation+and+communion+with+him%2C+and+also+the+communication+of+those+good+things+which+are+necessary+for+us%2C+particularly+holiness%2C+life%2C+and+immortality+Again%2C+God+requires+from+us+that+we+should+be+his+people%2C+namely%2C+he+requires+of+us+faith%2C+repentance%2C+worship%2C+and+obedience%2C+all+which+he+produces+in+us+by+his+Spirit.+The+seals+of+this+covenant+are+the+sacraments.+It+is+called+the+new+covenant%2C+because+the+old+is+abolished+and+the+covenant+of+grace%2C+because+man+in+no+way+whatever+could+merit+it%2C+but+God+of+his+mere+mercy+entered+into+it+with+man%3B+and+also+to+distinguish+it+from+the+first+covenant%2C+which+is+called+the+covenant+of+works%2C+which+was+entered+into+with+Adam%2C+and+renewed+on+Mount+Sinai.+These+two+covenants+indeed+agree+with+each+other+in+various+particulars%3A%E2%80%94of+both%2C+God+is+the+author%3B+in+both+there+are+the+same+contracting+parties%3B+in+both+is+promised+eternal+life+and+happiness%3A+but+they+differ+also+in+many+respects%3B+in+the+covenant+of+works+God+is+considered+as+Creator+and+Lord%2C+in+the+covenant+of+grace+as+Redeemer+and+Father%3B+in+the+first+there+were+was+no+mediator%2C+in+the+second+Christ+is+the+Mediator%3B+in+the+one+God+dealt+with+man+as+upright%2C+in+the+other+he+deals+with+man+as+a+sinner%3B+the+former+depended+on+man%E2%80%99s+own+obedience%2C+the+latter+depends+on+the+obedience+of+Christ%3B+in+the+former+was+promised+life%2C+namely%2C+a+state+consisting+of+all+good+things%3B+in+the+latter+is+promised+salvation%2C+which%2C+along+with+life%2C+includes+also+deliverance+from+sin+and+death%3B+in+the+first+God+required+works%2C+saying%2C+Do+this+and+live%3B+in+the+second+he+requires+faith%2C+saying%2C+Believe%2C+and+thou+shall+be+saved.+The+covenant+of+grace+does+indeed+require+works+of+righteousness%2C+but+not+that+we+may+merit+eternal+life+by+them%3B+nor+does+the+imperfection+of+Christian+obedience%2C+provided+it+be+sincere%2C+stand+in+the+way+of+our+salvation.%E2%80%9D%0A%0A%E2%80%94+Benedict+Pictet%2C+Christian+Theology%2C+trans.+Frederick+Reyroux+%28Philadelphia%3A+Presbyterian+Board+of+Publication%2C+n.d.%29%2C+281%E2%80%9382.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fce0d0714fd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ce0d0714fd.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/04/pictet-on-the-similarities-and-differences-between-the-covenants-of-grace-and-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>3. This Covenant hath the promise of a circumcised heart, Deuteronomy 30:6, and of the word of faith that is near in the mouth, and of the righteousness of faith clearly differenced from the righteousness of the Law by doing. For so Paul, Romans 10:5-7, etc., expounds, Moses, Deuteronomy 30:11-14.

4. The Covenant of Works taught nothing of the way of expiation of sin by blood typifying the ransom of blood that Christ was to pay for our sins, as this covenant, all along had sacrifices and blood to confirm it. Exodus 24:8. And Moses took the blood and sprinkled it on the people, and said, behold this is the Blood of the Covenant which the Lord hath made with you, concerning all these words. Now the words were the Ten Commandments. See Hebrews 9:18-24.

(5.) This Covenant is made with Israel only, Exodus 20; Deuteronomy 5:6; Deuteronomy 6:5-7, 12. The Covenant of Works is made with all mankind. 6. No people under the Law can be justified and saved thereby, nor have their sins pardoned, Romans 3:9-11, 19-20; Romans 4:1-4; Romans 9; Romans 10; Psalms 130:3; Psalms 143:2; Galatians 3:1-3, 10-13. But in this Covenant, Abraham, David, Genesis 15; Psalm 32; Romans 4:1-9. And the Jews by faith, have remission of sins and salvation, as also the Gentiles have, Acts 10:43; Acts 15:11. […]

8. The Passover and Circumcision, Genesis 17:7, all along were seals of the Covenant, as Baptism on with circumcision in substance, Colossians 2:11, is the seal of the same Covenant, Acts 2:39-41. Now the Law required no Circumcision, no shedding of blood, no repentance, no new heart, but eternal condemnation followed the least breach thereof. Paul saith, Galatians 5:3, If ye be Circumcised (as the false Apostles would have, that thereby you may be justified and saved) you are debtors to keep the whole Law perfectly, as the only way to life, and by no other Covenant can you be justified and saved, now Abraham was not circumcised that way, circumcision did bind Abraham to keep the Law, as a Ceremony and Seal of the Covenant of Works doth command no ceremony, no sacrifice, no type of Christ Mediator at all.</p></blockquote>

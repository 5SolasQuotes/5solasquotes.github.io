<main class="wrap"><figure class="quote" id="q-e5341f29d7" data-kw="">
<blockquote><p>The worshipping of God is the direct acknowledging of his Being and perfections to his honor. Indirectly or consequentially He is acknowledged in every obediential act by those that truly obey and serve Him: And this is indirectly and participatively to worship Him: And therefore all things are holy to the holy, because they are holy in the use of all… But this is not the worship which we are here to speak of: but that which is primarily and directly done to glorify Him by the acknowledgement of his excellencies. Thus God is worshipped either inwardly by the soul alone, or also outwardly by the body expressing the worship of the soul. For that which is done by the body alone without the concurrence of the heart, is not true worship, but an hypocritical image or show of it (equivocally called ‘worship’). The inward worship of the heart alone, I have spoken of in the former tome [of A Christian Directory]. The outward or expressive worship is simple or mixed: Simple when we only intend God’s worship immediately in the action: And this is found chiefly in praises and thanksgiving, which therefore are the most pure and simple sort of expressive worship. Mixed worship is that in which we join some other intention, for our own benefit in the action: As in prayer where we worship God by seeking to Him for mercy: And in reverent hearing or reading his Word, where we worship Him by a holy attendance upon his instructions and commands: And in his sacraments where we worship Him by receiving and acknowledging his benefits to our souls: And in oblations where we have respect also to the use of the thing offered: And in holy vows and oaths, in which we acknowledge Him our Lord and Judge. All these are acts of divine worship, though mixed with other uses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London: White, 1673), pt. 3, Ch. 1, ‘Of the Worship of God in General’, pp. 673-74</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d61a5d9892" data-kw="">

</figure><figure class="quote" id="q-33a10a09f9" data-kw="">
<blockquote><p>Civil worship is the honor done to men set above us by God Himself, either in respect of their excellent gifts, or in respect of their offices and authority whereby they govern others. The right end of this worship is to testify and declare that we reverence the gifts of God, and that power which He has placed in those that be his instruments. And this kind of worship is commanded only in the Second Table and in the First Commandment thereof, ‘Honor thy father and mother.’ Upon this distinction we may judge what honor is due to everyone. Honor is to be given to God, and to whom He commands. He commands that inferiors should honor or worship their betters… Good angels, because they excel men both in nature and gifts, when they appeared were lawfully honored: yet so, as when the least signification of honor was given that was proper to God, they refused it. And because they appear not now as in former times, not so much as civil adoration in any bodily gesture is to be done unto them. Lastly, governors and magistrates have civil adoration as their due: and it cannot be omitted without offense. Thus Abraham worshipped the Hittites, Gen. 23, and Joseph his brethren, Gen. 50. To come to the very point: upon the former distinction, we deny against the Papists that any civil worship in the bending of the knee or prostrating of the body is to be given to the saints, they being absent from us; much less any religious worship, as namely invocation signified by any bodily adoration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, ... (Cambridge, Legat, 1598), 14th Point, ‘Worshipping of Saints’, ‘The Dissent’, pp. 248-50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

asquotes.github.io%2Fquote%2F33a10a09f9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/33a10a09f9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-definition-of-worship/#:~:text=Civil%20worship%20is%20the%20honor%20done,invocation%20signified%20by%20any%20bodily%20adoration&amp;text=Civil%20worship%20is%20the%20honor%20done%20to%20men&amp;text=as%20namely%20invocation%20signified%20by%20any%20bodily%20adoration" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9527c70aca" data-kw="">
<blockquote><p>…the Rejoinder [of an apponent] brings abundance of instances [for human ceremonies idolatrously abused] out of his old store: 1. Kneeling, bowing, prostrating, lifting up of the eyes, and of the hands, shouting, and dancing for joy. But these we absolutely deny to be human inventions. The Rejoinder knew this and therefore by prevention replies: to say these are not human inventions because they partly spring out of natural light is as much as to say they are not because they are human inventions: for what are human inventions, but such as spring out of natural light? What? the cross and surplice; the cornered-cap and tippet; the bishop’s rochet and cope, with a thousand such like; which whoesoever will equal, or (in regard of naturalness and willfull invention) liken unto lifting up of eyes and hands, etc. in prayer, must for that time lay aside right natural invention and judgment… I think it would trouble all the graduates in England to find out that natural light from whence bachelors of art, maisters of art, bachelors and doctors of divinity received their several kinds of hoods, even as much as to find out light of nature for all the several habits of monks. But (says the Rejoynder) all came from natural light, better or worse, more or less agitated, just as men’s long hair and women’s short, which nature itself teaches to be uncomely (according to the apostle’s light [1 Cor. 11:14]) came from the light of nature. It is natural to a child, for to suck the dug and after to put the hand to the mouth; and after to creep or go: Is it like natural to sound a certain distinct sound upon a trumpet? to dance a certain round, or galliard after every fiddle? It is natural for a child to signify his discerning of those that it is used to by some such sound as dad and mam, but not to make verses in a certain number.</p></blockquote>

— William Ames, A Fresh Suit Against Human Ceremonies in God’s Worship… (1633), pp. 495-96">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+Rejoinder+%5Bof+an+apponent%5D+brings+abundance+of+instances+%5Bfor+human+ceremonies+idolatrously+abused%5D+out+of+his+old+store%3A+1.+Kneeling%2C+bowing%2C+prostrating%2C+lifting+up+of+the+eyes%2C+and+of+the+hands%2C+shouting%2C+and+dancing+for+joy.+But+these+we+absolutely+deny+to+be+human+inventions.+The+Rejoinder+knew+this+and+therefore+by+prevention+replies%3A+to+say+these+are+not+human+inventions+because+they+partly+spring+out+of+natural+light+is+as+much+as+to+say+they+are+not+because+they+are+human+inventions%3A+for+what+are+human+inventions%2C+but+such+as+spring+out+of+natural+light%3F+What%3F+the+cross+and+surplice%3B+the+cornered-cap+and+tippet%3B+the+bishop%E2%80%99s+rochet+and+cope%2C+with+a+thousand+such+like%3B+which+whoesoever+will+equal%2C+or+%28in+regard+of+naturalness+and+willfull+invention%29+liken+unto+lifting+up+of+eyes+and+hands%2C+etc.+in+prayer%2C+must+for+that+time+lay+aside+right+natural+invention+and+judgment%E2%80%A6+I+think+it+would+trouble+all+the+graduates+in+England+to+find+out+that+natural+light+from+whence+bachelors+of+art%2C+maisters+of+art%2C+bachelors+and+doctors+of+divinity+received+their+several+kinds+of+hoods%2C+even+as+much+as+to+find+out+light+of+nature+for+all+the+several+habits+of+monks.+But+%28says+the+Rejoynder%29+all+came+from+natural+light%2C+better+or+worse%2C+more+or+less+agitated%2C+just+as+men%E2%80%99s+long+hair+and+women%E2%80%99s+short%2C+which+nature+itself+teaches+to+be+uncomely+%28according+to+the+apostle%E2%80%99s+light+%5B1+Cor.+11%3A14%5D%29+came+from+the+light+of+nature.+It+is+natural+to+a+child%2C+for+to+suck+the+dug+and+after+to+put+the+hand+to+the+mouth%3B+and+after+to+creep+or+go%3A+Is+it+like+natural+to+sound+a+certain+distinct+sound+upon+a+trumpet%3F+to+dance+a+certain+round%2C+or+galliard+after+every+fiddle%3F+It+is+natural+for+a+child+to+signify+his+discerning+of+those+that+it+is+used+to+by+some+such+sound+as+dad+and+mam%2C+but+not+to+make+verses+in+a+certain+number.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+A+Fresh+Suit+Against+Human+Ceremonies+in+God%E2%80%99s+Worship%E2%80%A6+%281633%29%2C+pp.+495-96&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9527c70aca.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9527c70aca.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/natural-vs-instituted-worship/#:~:text=the%20Rejoinder%20%5Bof%20an%20apponent%5D%20brings,make%20verses%20in%20a%20certain%20number&amp;text=the%20Rejoinder%20%5Bof%20an%20apponent%5D%20brings%20abundance%20of&amp;text=not%20to%20make%20verses%20in%20a%20certain%20number" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

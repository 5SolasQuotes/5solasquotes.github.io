<main class="wrap"><figure class="quote" id="q-08ee15b796" data-kw="">
<blockquote><p>…let our rest and confidence be only in Christ, and to such as take Him for their rest, his work is but recreation, and so indeed we should esteem it in a spiritual sense; not looking upon it as a sour task, or a rigid exaction, but calling the Sabbath a delight, we should keep it accordingly, even the whole day, with the whole man, as a day of delights to the Lord, being transported beyond flesh and the world, and having our conversation in heaven, as much as is possible for creatures clothed with flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-warren.html">Edmund Warren</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Jews’ Sabbath Antiquated, &amp; the Lord’s Day Instituted by Divine Authority (London: Maxwel, 1659), Position 7, ‘The Lord’s Day must be kept holy to the Lord,’</cite>, p. 257</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4fe4757ed0" data-kw="">
<blockquote><p>…all kinds of recreations which are not necessary for the preserving of health and life, and tend not to the better fitting and enabling of us for religious duties, but to sensual and carnal delight. Of which [lawful] sort are walking abroad that we may take the air, or that we may confer one with another, or meditate on the creatures, some bodily exercise in course of physick to refresh the body, and in some cases music, not only vocal by singing of Psalms, which is a duty of the Sabbath, but also on instruments, when as it is used, not for carnal and sensual delight, but to refresh our spirits, and quicken our dull and drowzy hearts and minds, that they may with more cheerfulness return vnto the performance of religious and holy duties; in which cases there may at some times be the same use of these recreations (so they be in moderation, in an holy manner, and to these ends) which is of physick, meats and drinks. But from all other recreations which tend only to carnal and sensual delight, we must wholly abstain… because these worldly recreations do more dangerously and cunningly wind into our hearts…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Godliness or a Treatise of a Christian Life… (London: Kingstone, 1622), ch. 39, sections 2 &amp; 3</cite>, pp. 383-84</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

s%20which%20are%20not%20necessary&amp;text=more%20dangerously%20and%20cunningly%20wind%20into%20our%20hearts" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-182cbf89de" data-kw="">
<blockquote><p>And here also we consider things circumstantial, as time, place, etc. And circumstances are either merely physical, or 2. merely moral, or 3. mixed, partly moral, partly physical; [1.] Circumstances merely physical are such adjuncts of divine worship as are common and inseparable concomitants of both civil, natural, and religious or sacred actions performed by men, and as they are such, contribute no moral goodness or badness to the action or agent in the performance thereof… All these are common concomitants of civil, natural, and religious actions, for all actions performed by man of what kind soever, as natural, to eat, sleep; or civil, to declaim an oration before the people; or religious, to preach or pray, must be done… in some time, in some place… for because he preaches in time, or in place simply, the preaching is neither morally good, nor ill, better or worse… 2. Some circumstances are merely moral, for as divines distinguish time and place; in time as time, and as such a religious time, the Lord’s Sabbath, Tempus, &amp; tempus ut sic [time, and a time so thus], and place as place, or such a religious place, Locus, &amp; locus ut sic. [a place, and a place so thus]. So we may distinguish here between circumstances in common or in gross, and such and such circumstances; As time is a common adjunct of divine worship: But such a time, to wit, the Lord’s Day is both the time of worship, and worship itself [in observing it]. So there is place of worship, and there is such a religious place, [in the Old Testament,] the holy of holiest, the Temple. A habit [garment] is a mere accident of worship; the person, John or Thomas, is also an accident; but if God command such an ephod as Aaron and the priests were to wear, this is not a mere [physical] circumstance [rather it is a moral circumstance because of its religious appointment]… And therefore these circumstances, taken in common and their universal nature, are merely physical circumstances; but taken in their particular and determinate restrictions, as such circumstances, they may be merely moral circumstances, such as are the common adjunct of the time of worship, the place, and the Sabbath time and the Temple for Jewish Worship. The former [two] are circumstances merely physical, the latter [two are] merely moral;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Right of Church Government… (1646), p.</cite></span></figcaption>

<blockquote><p>[Rutherford’s] Answer: [William] Whittaker says indeed universal synods are not simply necessary ([On Scripture] Controversy 1, question 1, pp. 22-23); and [Matthew] Parker [an Anglican] says no more: they are not absolutely necessary, necessitate medii [by a necessity of means], but they are necessary, necessitate praecepti [by a necessity of precept], and conditionally, if some politic-union were amongst all national churches; But hence it follows not that they are not Christ’s ordinances, because they are not this way necessary, necessitate medii; for then baptism and the Lord’s Supper, public preaching of the Word, perfect discipline were not Christ’s ordinances, because in time of persecution, or universal apostasy, many, yea even whole Churches may be saved without these.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea... (1642)</cite>, pp. 214-215</span></figcaption>

<blockquote><p>Moreover, on the first day, God created heaven and earth, Gen. 1:1, and when the first night had ended, light, verses 3-5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-gomarus.html">Francis Gomarus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epitome of Theological Common Places (d. 1641; Amsterdam: Jansson, 1653), Locus 6, ‘On the Creation of the World’, trans. AI at Confessionally Reformed Theology</cite></span></figcaption>

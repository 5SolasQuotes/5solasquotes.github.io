</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-531ab0edd0" data-kw="">
<blockquote><p>To proceed yet further, we are here to consider the particular remedies which they of the popish church have prescribed against the hurts that have come by witchcraft. And they are principally five. The first is the name of Jesus. We must grant that any Christian may lawfully call upon the name of Jesus in prayer, for the help and deliverance of those who are possessed and bewitched, but yet with the caveat and condition before specified, if it is the will of God, and if their recovery may make for His glory, the benefit of the church, and the good of the diseased parties. But the papist, by the use of this name, intends a further matter, to wit, that the very name uttered in so many letters and syllables is powerful to cast out devils and to help those who are bewitched. For when it is uttered, then (they say) the authority of Christ is present, that the work may be done. [This is] a flat untruth and a practice full of danger. For let this be well considered, whatsoever any man does in this case, he must do it by virtue of his calling, and have also his warrant for the doing thereof out of the Word. If he lacks this, and yet undertakes such a work, he may justly fear the like event that befell the vagabond Jews who were exorcists (Acts 19:13). Now the church of Christ has no warrant in the Word to use this name of Christ for any such purpose. Neither has any ordinary Christian a special calling from God so to do. Therefore, he may not do it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the Damned Art of Witchcraft</cite>, … (Cambridge, 1610), ch. 7, ‘The application of the doctrine of witchcraft to our times’, section 3, question 3, ‘Whether a man may prevent the danger of witchcraft, and if he may, then what remedies he may lawfully and effectually use against it?’, pp. 239-40</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/evil-angels.html">Evil Angels</a></span></div>

</figure><figure class="quote" id="q-e977de2a40" data-kw="">
<blockquote><p>In MPD [or Dissociative Identity Disorder], we have a phenomenon that was traditionally categorized as demonic possession. Accordingly, people exhibiting the behavior now associated with MPD described it, not as a fragmentation of a single mind into multiple ones, but as the entrance from without of a distinct and alien mind… Many well-known cases of alleged MPD–such as that of ‘Sybil,’ made famous in the film of that title–have been shown to have been exaggerations or even hoaxes. ‘Sybil’ herself has admitted that her ‘disorder’ was more or less her own invention, that she was coxed into believing that she had multiple personalities by therapists eager to prove that MPD was real, and that under their encouragement and in an emotionally fragile state she had manufactured and acted out various ‘personalities’ to confirm their diagnosis. Many other MPD patients, emotionally disturbed people to start with, acknowledge that they see themselves less as literally ‘fragmenting’ into different personalities than as fantasizing and acting out different roles–again, often under the influence of overzealous therapists. The behavior of ‘split-brain’ patients is no less subject to interpretation, interpretation that can reflect the enthusiastic theorizing of the researcher as much as the objective facts. To begin with, the two hemispheres of the brains of such patients are not completely disconnected–there are other connections between the halves that remain undisturbed, and thus there are no grounds for insisting that the halves must be associated with different ‘minds’. Furthermore, under ordinary conditions, such patients behave more or less normally, or at least no in any way that suggests that more than a single mind occupies their bodies. It is only in contrived experimental contexts that they can be made to exhibit remarkable behavior, and even then that behavior is by no means obviously best interpreted as involving a ‘division’ of the mind. Many researchers hold instead that such behavior, when examined carefully, amounts to little more than a variation on the awkwardness, failure of co-ordination, or general cognitive malfunctioning that can result from any serious injury to brain…</p></blockquote>

</figure><figure class="quote" id="q-c328fa613d" data-kw="">
<blockquote><p>Sixthly, escaping of worldly pollutions is not always an argument of a renewed nature, because sin may drive out sin, even as divines say about popish exorcisms, when the priest calls out devils from men possessed, it is by collusion: the devil recedes not because those exorcismes are of divine efficacy, but because hereby he would confirm people more in believing a lie.</p></blockquote>

</figure><figure class="quote" id="q-fd871d8b27" data-kw="">
<blockquote><p>2nd Use. If we pray God to deliver us from evil, then we must beware of all satanical practises as means of help in any distress; this is gross hypocrisy to pray against the evils of Satan and to give ourselves to the practise of them. Herein many offend, for the Papists say this prayer, but yet their religion in many things is a gross practice of magic and sorcery; for first: the consecration of their host in the mass is plain conjuration: and so are their exorcisms in halowing salt, bread, and water, their casting out of devils by certain words, by the sign of the cross, the application of relics and such like: nay, come to ourselues, what is more common among us than to use charmes and amuletts, to seek to witches and sorcerers when any strange affliction does befall us? And the setting of a figure, though it be not gross magic, yet therein is a close and privy work of the devil, his hand is deep therein: and the Church in former times has condemned it for witchcraft: for charms, characters and amulets be but the devil’s watchword and sacraments to set him a working: what though the words used be good, yet therein is Satan’s deeper policy, who turns himself into an angel of light, under fair shows working the greater mischeif. But what horrible impiety is this, that when God gives us occasion to come unto Him, we leave Him and run for help to his professed enemies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly &amp; Learned Exposition of Christ’s Sermon in the Mount</cite>, on Mt. 6:13 in A Godly &amp; Learned Exposition of Christ’s Sermon in the Mount... (Cambridge, 1608), p. 315</span></figcaption>

<div class="actions"><button class="copy" data-copy="“2nd Use. If we pray God to deliver us from evil, then we must beware of all satanical practises as means of help in any distress; this is gross hypocrisy to pray against the evils of Satan and to give ourselves to the practise of them. Herein many offend, for the Papists say this prayer, but yet their religion in many things is a gross practice of magic and sorcery; for first: the consecration of their host in the mass is plain conjuration: and so are their exorcisms in halowing salt, bread, and water, their casting out of devils by certain words, by the sign of the cross, the application of relics and such like: nay, come to ourselues, what is more common among us than to use charmes and amuletts, to seek to witches and sorcerers when any strange affliction does befall us? And the setting of a figure, though it be not gross magic, yet therein is a close and privy work of the devil, his hand is deep therein: and the Church in former times has condemned it for witchcraft: for charms, characters and amulets be but the devil’s watchword and sacraments to set him a working: what though the words used be good, yet therein is Satan’s deeper policy, who turns himself into an angel of light, under fair shows working the greater mischeif. But what horrible impiety is this, that when God gives us occasion to come unto Him, we leave Him and run for help to his professed enemies.”

— William Perkins, on Mt. 6:13 in A Godly &amp; Learned Exposition of Christ’s Sermon in the Mount... (Cambridge, 1608), p. 315">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2nd+Use.+If+we+pray+God+to+deliver+us+from+evil%2C+then+we+must+beware+of+all+satanical+practises+as+means+of+help+in+any+distress%3B+this+is+gross+hypocrisy+to+pray+against+the+evils+of+Satan+and+to+give+ourselves+to+the+practise+of+them.+Herein+many+offend%2C+for+the+Papists+say+this+prayer%2C+but+yet+their+religion+in+many+things+is+a+gross+practice+of+magic+and+sorcery%3B+for+first%3A+the+consecration+of+their+host+in+the+mass+is+plain+conjuration%3A+and+so+are+their+exorcisms+in+halowing+salt%2C+bread%2C+and+water%2C+their+casting+out+of+devils+by+certain+words%2C+by+the+sign+of+the+cross%2C+the+application+of+relics+and+such+like%3A+nay%2C+come+to+ourselues%2C+what+is+more+common+among+us+than+to+use+charmes+and+amuletts%2C+to+seek+to+witches+and+sorcerers+when+any+strange+affliction+does+befall+us%3F+And+the+setting+of+a+figure%2C+though+it+be+not+gross+magic%2C+yet+therein+is+a+close+and+privy+work+of+the+devil%2C+his+hand+is+deep+therein%3A+and+the+Church+in+former+times+has+condemned+it+for+witchcraft%3A+for+charms%2C+characters+and+amulets+be+but+the+devil%E2%80%99s+watchword+and+sacraments+to+set+him+a+working%3A+what+though+the+words+used+be+good%2C+yet+therein+is+Satan%E2%80%99s+deeper+policy%2C+who+turns+himself+into+an+angel+of+light%2C+under+fair+shows+working+the+greater+mischeif.+But+what+horrible+impiety+is+this%2C+that+when+God+gives+us+occasion+to+come+unto+Him%2C+we+leave+Him+and+run+for+help+to+his+professed+enemies.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+on+Mt.+6%3A13+in+A+Godly+%26+Learned+Exposition+of+Christ%E2%80%99s+Sermon+in+the+Mount...+%28Cambridge%2C+1608%29%2C+p.+315&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffd871d8b27.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quot

<main class="wrap"><figure class="quote" id="q-ea7e53c83e" data-kw="">
<blockquote><p>Balthasar Lydius (1577-1629) was a minister in Dordrecht, who, as the local minister, opened the first session of the famous Synod of Dort (which examined the teachings of the Remonstrant Arminians) in prayer on 13 November 1618. Here is an extract from this prayer, which has recently been fully translated into English:

We are unworthy of all Thy mercies which Thou hast bountifully bestowed upon the work and workmanship of Thy hands. Not only hast Thou created us according to Thy image, but also, when we through sin had become by nature the children of wrath, Thou didst recreate us according to Thy image. Since we already are indebted to Thee because Thou hast created us, how much more do we owe because Thou hast also freely redeemed us?

It is great and marvelous that man was made in Thy image. How much greater it is that He who thought it not robbery to be equal with God made Himself of no reputation, took upon Him the form of a servant, and was made in our likeness, who of God was made unto us wisdom, and righteousness, and sanctification, and redemption!

Also with these benefits Thou wast not satisfied. We were a people dwelling in the darkness and shadow of death, without hope of salvation, cast off in the unworthiness of our souls, for whom an unknown treasure would be of no use. But Thou hast enlightened us by the revelation of the Sun of righteousness and truth! Without this, we would have perished everlastingly in these errors, not knowing what way we must walk.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/balthasar-lydius.html">Balthasar Lydius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Prayer of Balthasar Lydius’, trans. Douglas J. Kuiper and H. David Schuringa Protestant Reformed Theological Journal</cite></span></figcaption>

<blockquote><p>The Church has the Sabbath from Christ, the Son over his own house – even the Son of man, who is Lord also of the Sabbath. And by divine right she can demand all civil liberty which the nature of the case requires, to secure for her the actual enjoyment of this boon, to prevent this gift from her Lord being either nullified or impaired.</p></blockquote>

</figure><figure class="quote" id="q-97557a90c5" data-kw="">
<blockquote><p>…we would not only fall down upon our faces and give him thanks, but with loud voices would we praise Him, and in the midst of the congregation would we extol his name, as David and Asaph do almost in every psalm. For doubtless whoso believeth that God loveth him, and feeleth by his faith, that he hath forgiven him all his sins, and careth for him… shall be compelled by the Spirit of God to break out into praise and thanksgiving therefore… but shall cry and call upon them, as David doth, saying: “Praise the Lord with me, and let us magnify his name together. I sought the Lord, and He heard me, yea, He delivered me out of all my fear.”… Yea, would God that our minstrels had none other thing to play upon, neither our carters and ploughmen other thing to whistle upon, save psalms, hymns, and such godly songs as David is occupied withal! And if women, sitting at their rocks [instruments used in spinning], or spinning at the wheels, had none other songs to pass their time withal, than such as Moses’ sister, Glehana’s [Elkanah’s] wife, Debora, and Mary the mother of Christ, have sung before them, they should be better occupied than with ‘hey nony nony, hey troly loly,’ and such like fantasies. If young men also that have the gift of singing, took their pleasure in such wholesome ballads as the [apocryphal] three children sing in the fire, and as Jesus the Son of Sirac doth in his last chapter, it were a token, both that they felt some spark of God’s love in their hearts, and that they also had some love unto Him; for truly, as we love, so sing we… Seeing then that, as the prophet David saith, it is so good and pleasant a thing to praise the Lord, and so expedient for us to be thankful (Ps. 147); therefore, to give our youth of England some occasion to change their foul and corrupt ballads into sweet songs and spiritual hymns of God s honor, and for their own consolation in him, I have here, good reader, set out certain comfortable songs grounded on God’s Word, and taken some out of the holy scripture, specially out of the Psalms of David, all whom would God that our musicians would learn to make their songs! and if they which are disposed to be merry, would in their mirth follow the counsel of St. Paul and St. James (Col. 3; James 5), and not to pass their time in naughty songs of fleshly love and wantonness, but with singing of psalms, and such songs as edify, and corrupt not men’s conversation. … The children of Israel in the old time, when God had delivered them from their enemies, gave thanks unto Him, and made their song of Him, as thou seest by Moses, Barak, David, and other more. Why should not we then make our songs and mirth of God, as well as they? Hath He not done as much for us as for them? Hath He not delivered us from as great troubles as them? Yes, doubtless. Why should He not then be our pastime, as well as theirs? As for such psalms as the scripture describeth (beside the great consolation that they bring into the heart of the spiritual singer) they do not only cause him to spend his time well by exercising himself in the sweet Word of God; but through such ensamples they provoke other men also unto the praise of God and virtuous living. And this is the very right use wherefore psalms should be sung; namely, to comfort a man’s heart in God, to make him thankful, and to exercise him in his Word, to encourage him in the way of godliness, and to provoke other men unto the same. By this thou mayest perceive, what spiritual edifying cometh of godly psalms and songs of God s Word; and what inconvenience foloweth the corrupt ballads of this vain world. …</p></blockquote>

er+men+unto+the+same.+By+this+thou+mayest+perceive%2C+what+spiritual+edifying+cometh+of+godly+psalms+and+songs+of+God+s+Word%3B+and+what+inconvenience+foloweth+the+corrupt+ballads+of+this+vain+world.+%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Miles+Coverdale%2C+Ghostly%2C+%5BSpiritual%5D+Psalms+and+Spiritual+Songs+%281539%29%2C+%E2%80%98Unto+the+Christian+Reader%E2%80%99+in+Remains+of+Myles+Coverdale+%28Cambridge%3A+Parker+Society%2C+1846%29%2C+pp.+536-540&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F97557a90c5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/97557a90c5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=we%20would%20not%20only%20fall%20down,corrupt%20ballads%20of%20this%20vain%20world&amp;text=we%20would%20not%20only%20fall%20down%20upon%20our&amp;text=foloweth%20the%20corrupt%20ballads%20of%20this%20vain%20world" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9be10c6f93" data-kw="">
<blockquote><p>In matter of hearing, it is not so hard to discern who are to be accounted to speak without God’s commission: because ordinarily, such have either no warrantable call at all (no not in the outward form; and so cannot be accounted but to run unsent) or, by palpable defection from the truth, and commission given them in that call, they have forfeited their commission, and so no more are to be accounted ambassadors to Christ, or watchmen of His flock, than a watchman of the city, is to be accounted an observer thereof, when he has publicly made defection to the enemy, and taken on with him. For we are here to rest in the external call, and not to dispute that which is inward: because it passes our reach; and Christ has furnished his House with external ordinances, for the warranting of his people’s peace in reference to these things: there is therefore great difference to be placed here between one that is called, and one whom we think not worthy to be called: it’s the first that warrants hearing…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-f5fd75eefd" data-kw="">
<blockquote><p>An extreme opinion on this subject has been held by some Christians, to the effect that no true and certain knowledge of God can be derived by man, in his present condition, from the light of nature in the entire absence of a supernatural revelation; that we are altogether dependent upon such a revelation for any certain knowledge that God exists, as well as for all knowledge of his nature and his purposes. This opinion is disproved: (a.) By the direct testimony of Scripture. Rom. 1:20–24; 2:14, 15. (b.) By the fact that many conclusive arguments for the existence of a great first Cause, who is at the same time an intelligent personal Spirit and righteous moral Governor, have been drawn by a strict induction from the facts of nature alone, as they lie open to the natural understanding. The fact that this argument remains unanswerable shows that the process by which the conclusions are drawn from purely natural sources is legitimate. (c.) All nations, however destitute of a supernatural revelation they may have been, have yet possessed some knowledge of a God. And in the case of the most enlightened of the heathen, natural religion has given birth to a considerable natural theology. We must, however, distinguish between that knowledge of the divine character which may be obtained by men from the works of nature and providence in the exercise of their natural powers alone, without any suggestions or assistance derived from a supernatural revelation—as is illustrated in theological writings of some most eminent of the heathen who lived before Christ—and that knowledge which men in this age, under the clear light of a supernatural revelation, are competent to deduce from a study of nature. The natural theology of the modern rationalists demonstrably owes all its special excellences to that Christian revelation it is intended to supersede.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Confession of Faith (Philadelphia: Presbyterian Board of Publications, 1920), 45–46.</cite></span></figcaption>

<blockquote><p>What! is not natural theology the very basis and foundation of revealed? nor without the former can the latter be at all supported. For the instructions we receive from nature want [lack] no further proof, they are in themselves perfectly evident, we are born with them, they are deeply wrought into our frame as rational beings, nor can they be rejected by any, but such as are quite destitute of an intelligent principle; bit revelation, being contained in particular books, must be confirmed by the test of truth, before we can receive it, and it cannot be proved by any principles except such as are derived from the light of nature. For how can I be certain that what God has revealed is credible, unless I have first learned from the light of nature that He is a being of veracity, and therefore cannot possibly deceive me? How can I be sure that this or that revelation derives its origin from the Deity, unless the light of nature has first taught me to know what is worthy and what unworthy of God, and consequently what are the proper characters of a divine revelation? How can I be prevailed with to pay any tribute of adoration to the deity, to discharge certain duties to Him, to cultivate a sense of piety and virtue, unless I have previously learned my duty from the light of nature what I am to understand by an obligation, and the original from which it is derived, and been instructed in the difference betwixt justice and injustice, betwixt piety and impiety? For if justice and injustice are nothing, if virtue is nothing but a word, as it is expressed by the poet, and there is no such thing as a natural obligation, then no revelation can compel me either to avoid or pursue any particular course of action. Wherefore our natural sentiments of things are to be laid down as the principles of all our other knowledge. It is a very just thought of Tertullian that: ‘the Deity has sent nature before as our guide, and afterwards favored us with prophesy, that it might obtain the more easy belief from the person qualified to receive it by the instructions of nature.’ (Of the Resurrection of the Body, ch. 12) But as in recognizing the authority of revelation, so in investigating the sense of it, and settling controversies, we must perpetually have recourse to natural theology. Nor can we possibly give our assent to any thing, as a divine revelation which contradicts the light of nature. Wherefore if any doctrine is attempted to be imposed on us as a revealed truth, which is inconsistent with natural theology, we are on that very account to be absolutely certain that it is an imposture, or at least to try if the passages which seem to contain such a doctrine will bear a construction which will remove the inconsistence, for it is impossible that God can contradict Himself. Thus when the Anthropomorphite asserts that the Deity is possessed of a human form, because the Scripture speaks of his face, his eyes, his ears and arms; natural theology at once convinces us of the delusion, teaching us that God is a being absolutely perfect, and therefore must of consequence be immaterial. … The Scripture itself appeals to these natural perceptions wwe have of the attributes of the supreme Being, and points out to us their great importance and excellence. Thus in the place quoted above from the nineteenth psalm, and in many others of the psalms and prophets, the greatness, wisdom, power and goodness of the Deity are demonstrated from his works. Agreeable to this, Job 12:7-9: ‘But ask now the beasts, and they shall teach thee, and the fowls of the air, and they shall tell thee; or speak to the earth, etc. who knows not that in all these, the hand of the Lord has wrought this?’ In like manner when God complains of the ingratitude and corrupt morals of the people of Israel, as in Isa. 1, 5; Mic. 6 and in a variety of passage of Scripture, He condemns them by appealing to no other principles than the natural perceptions they had of the duties they owed to Him–And when Christ or his apostles endeavor either to prove the truth of their doctrine, or to refute those who had fallen into mistakes with respect to it; when they either blame their disciples, or exhort them to the discharge of any duty, they continually have recourse to the light of reason, or to natural principles–‘Judge not according to the outward appearance, but judge right judgment,’ Jn. 7:24. I speak to those who have understanding, judge ye what I say,’ 1 Cor. 10:15. And on such occasions the Scripture not only appeals to our natural sentiments, but points out the particular ends for which they were implanted in us, and in what manner we are to make the best use of them. The Scripture declares that the works of nature are an immediate declaration made by God Himself of his parental regard and gracious intentions towards all nations, ‘sending fruitful seasons, and filling their hearts with food and gladness.’ (Acts 14:17) It asserts that the whole of God’s providential care, more especially in those dispensations which respect mankind, is expressed with an immediate view, ‘that men may seek the Lord, if haply they might feel after Him, and find Him’ (Acts 17:25-27) It declares that what may and ought to be known of God is made manifest to all nations; and likewise that ‘the invisible things of God, may be seen from his works, and are placed as it were before our eyes, even his eternal power and godhead;’ and that so great is the brightness of the light of nature, that they who do not give proper attention to it, and glorify God, and praise Him for his goodness, are altogether without excuse; Rom. 1:19-21. It says that these are the riches of his goodness, and forbearance and long suffering, by which God leads us to repentance, Rom. 11:4. It says that our natural sentiments, with respect to the several duties of life, supply the place of a revealed law, ‘that they who have not the law are a law unto themselves, having the work of the law written in their hearts.’ (Rom. 11:14-15) Nor does Christ hesitate to affirm that in the rule which right reason has prescribed to every people, which is, that ‘we should do unto another, what we wish should be done unto ourselves, is contained in the law and the prophets;’ (Mt. 7:12). the strength and excellence of these [Biblical] encomiums on natural revelation cannot be exceeded by anything that can be said on the subject.</p></blockquote>

ves, having the work of the law written in their hearts.’ (Rom. 11:14-15) Nor does Christ hesitate to affirm that in the rule which right reason has prescribed to every people, which is, that ‘we should do unto another, what we wish should be done unto ourselves, is contained in the law and the prophets;’ (Mt. 7:12). the strength and excellence of these [Biblical] encomiums on natural revelation cannot be exceeded by anything that can be said on the subject.”

pursue+any+particular+course+of+action.+Wherefore+our+natural+sentiments+of+things+are+to+be+laid+down+as+the+principles+of+all+our+other+knowledge.+It+is+a+very+just+thought+of+Tertullian+that%3A+%E2%80%98the+Deity+has+sent+nature+before+as+our+guide%2C+and+afterwards+favored+us+with+prophesy%2C+that+it+might+obtain+the+more+easy+belief+from+the+person+qualified+to+receive+it+by+the+instructions+of+nature.%E2%80%99+%28Of+the+Resurrection+of+the+Body%2C+ch.+12%29+But+as+in+recognizing+the+authority+of+revelation%2C+so+in+investigating+the+sense+of+it%2C+and+settling+controversies%2C+we+must+perpetually+have+recourse+to+natural+theology.+Nor+can+we+possibly+give+our+assent+to+any+thing%2C+as+a+divine+revelation+which+contradicts+the+light+of+nature.+Wherefore+if+any+doctrine+is+attempted+to+be+imposed+on+us+as+a+revealed+truth%2C+which+is+inconsistent+with+natural+theology%2C+we+are+on+that+very+account+to+be+absolutely+certain+that+it+is+an+imposture%2C+or+at+least+to+try+if+the+passages+which+seem+to+contain+such+a+doctrine+will+bear+a+construction+which+will+remove+the+inconsistence%2C+for+it+is+impossible+that+God+can+contradict+Himself.+Thus+when+the+Anthropomorphite+asserts+that+the+Deity+is+possessed+of+a+human+form%2C+because+the+Scripture+speaks+of+his+face%2C+his+eyes%2C+his+ears+and+arms%3B+natural+theology+at+once+convinces+us+of+the+delusion%2C+teaching+us+that+God+is+a+being+absolutely+perfect%2C+and+therefore+must+of+consequence+be+immaterial.+%E2%80%A6+The+Scripture+itself+appeals+to+these+natural+perceptions+wwe+have+of+the+attributes+of+the+supreme+Being%2C+and+points+out+to+us+their+great+importance+and+excellence.+Thus+in+the+place+quoted+above+from+the+nineteenth+psalm%2C+and+in+many+others+of+the+psalms+and+prophets%2C+the+greatness%2C+wisdom%2C+power+and+goodness+of+the+Deity+are+demonstrated+from+his+works.+Agreeable+to+this%2C+Job+12%3A7-9%3A+%E2%80%98But+ask+now+the+beasts%2C+and+they+shall+teach+thee%2C+and+the+fowls+of+the+air%2C+and+they+shall+tell+thee%3B+or+speak+to+the+earth%2C+etc.+who+knows+not+that+in+all+these%2C+the+hand+of+the+Lord+has+wrought+this%3F%E2%80%99+In+like+manner+when+God+complains+of+the+ingratitude+and+corrupt+morals+of+the+people+of+Israel%2C+as+in+Isa.+1%2C+5%3B+Mic.+6+and+in+a+variety+of+passage+of+Scripture%2C+He+condemns+them+by+appealing+to+no+other+principles+than+the+natural+perceptions+they+had+of+the+duties+they+owed+to+Him%E2%80%93And+when+Christ+or+his+apostles+endeavor+either+to+prove+the+truth+of+their+doctrine%2C+or+to+refute+those+who+had+fallen+into+mistakes+with+respect+to+it%3B+when+they+either+blame+their+disciples%2C+or+exhort+them+to+the+discharge+of+any+duty%2C+they+continually+have+recourse+to+the+light+of+reason%2C+or+to+natural+principles%E2%80%93%E2%80%98Judge+not+according+to+the+outward+appearance%2C+but+judge+right+judgment%2C%E2%80%99+Jn.+7%3A24.+I+speak+to+those+who+have+understanding%2C+judge+ye+what+I+say%2C%E2%80%99+1+Cor.+10%3A15.+And+on+such+occasions+the+Scripture+not+only+appeals+to+our+natural+sentiments%2C+but+points+out+the+particular+ends+for+which+they+were+implanted+in+us%2C+and+in+what+manner+we+are+to+make+the+best+use+of+them.+The+Scripture+declares+that+the+works+of+nature+are+an+immediate+declaration+made+by+God+Himself+of+his+parental+regard+and+gracious+intentions+towards+all+nations%2C+%E2%80%98sending+fruitful+seasons%2C+and+filling+their+hearts+with+food+and+gladness.%E2%80%99+%28Acts+14%3A17%29+It+asserts+that+the+whole+of+God%E2%80%99s+providential+care%2C+more+especially+in+those+dispensations+which+respect+mankind%2C+is+expressed+with+an+immediate+view%2C+%E2%80%98that+men+may+seek+the+Lord%2C+if+haply+they+might+feel+after+Him%2C+and+find+Him%E2%80%99+%28Acts+17%3A25-27%29+It+declares+that+what+may+and+ought+to+be+known+of+God+is+made+manifest+to+all+nations%3B+and+likewise+that+%E2%80%98the+invisible+things+of+God%2C+may+be+seen+from+his+works%2C+and+are+placed+as+it+were+before+our+eyes%2C+even+his+eternal+power+and+godhead%3B%E2%80%99+and+that+so+great+is+the+brightness+of+the+light+of+nature%2C+that+they+who+do+not+give+proper+attention+to+it%2C+and+glorify+God%2C+and+praise+Him+for+his+goodness%2C+are+altogether+without+excuse%3B+Rom.+1%3A19-21.+It+says+that+these+are+the+riches+of+his+goodness%2C+and+forbearance+and+long+suffering%2C+by+which+God+leads+us+to+repentance%2C+Rom.+11%3A4.+It+says+that+our+natural+sentiments%2C+with+respect+to+the+several+duties+of+life%2C+supply+the+place+of+a+revealed+law%2C+%E2%80%98that+they+who+have+not+the+law+are+a+law+unto+themselves%2C+having+the+work+of+the+law+written+in+their+hearts.%E2%80%99+%28Rom.+11%3A14-15%29+Nor+does+Christ+hesitate+to+affirm+that+in+the+rule+which+right+reason+has+prescribed+to+every+people%2C+which+is%2C+that+%E2%80%98we+should+do+unto+another%2C+what+we+wish+should+be+done+unto+ourselves%2C+is+contained+in+the+law+and+the+prophets%3B%E2%80%99+%28Mt.+7%3A12%29.+the+strength+and+excellence+of+these+%5BBiblical%5D+encomiums+on+natural+revelation+cannot+be+exceeded+by+anything+that+can+be+said+on+the+subject.%E2%80%9D%0A%0A%E2%80%94+Jean-Alphonse+Turretin%2C+Dissertations+on+Natural+Theology+tr.+William+Crawford+%28d.+1737%3B+Belfast%3A+Magee%2C+1777%29%2C+Theses+concerning+Natural+Theology+in+General%2C+pp.+12-18&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F89807cb19b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/89807cb19b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-light-of-nature/#:~:text=What%21%20is%20not%20natural%20theology%20the,can%20be%20said%20on%20the%20subject&amp;text=What%21%20is%20not%20natural%20theology%20the%20very%20basis&amp;text=anything%20that%20can%20be%20said%20on%20the%20subject" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Fourth, when I say that we cannot get from the world to God except via premises derived from philosophy of nature, I have a quite specific conception of God in mind. I do not deny that conclusions of a sort that might in some sense of the term be called “theological” might be derived from natural science. But I do deny that arguments grounded in natural science alone can get you to classical theism—the conception of God defended by Athanasius and Augustine, Avicenna and Maimonides, Anselm and Aquinas… If anything, they have a tendency to lead you away from the God of classical theism. You might get to a demiurge, to a being of superhuman intelligence and power, with arguments grounded in physics, chemistry, or biology. What you cannot get to is that which is ipsum esse subsistens [subsisting existence itself] rather than merely a being among other beings; to a sustaining cause on whom the very being of the world depends at every instant; or to that which is absolutely simple or in no way composed of parts, whether physical or metaphysical. One implication of this is that “design arguments” of the sort associated with William Paley [early-1700’s] and contemporary “Intelligent Design” theory are at best irrelevant to natural theology (as that discipline is understood in the classical theist tradition), and at worst threaten seriously to distort our understanding of God and His relationship to the world (again, at least from the point of view of classical theism).</p></blockquote>

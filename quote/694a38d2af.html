<main class="wrap"><figure class="quote" id="q-694a38d2af" data-kw="">
<blockquote><p>And concerning particulars, their [the Jews] Sabbath the Church hath changed into our Lord’s day, that is, as the one did continually bring to mind the former World finished by Creation; so the other might keep us in perpetual remembrance of a far better World, begun by him which came to restore all things, to make both Heaven and Earth new. For which cause they honored the last day, we the first, in every seven, throughout the year, …

The Moral Law requiring therefore a seventh part throughout the age of the whole World, to be that way employed, although with us the day be changed, in regard of a new Revolution begun by our Saviour Christ; yet the same proportion of time continueth which was before, because in reference to the benefit of Creation, and now much more of Renovation thereunto added by him which was Prince of the World to come; we are bound to accompt [account] the Sanctification of one day in seven, a duty which God’s Immutable Law doth exact for ever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>the Laws of Ecclesiastical Polity</cite>, Book 5.70 in The Works of Mr. Richard Hooker (that learned and judicious divine), in eight books of ecclesiastical polity completed out of his own manuscripts, never before published. With an account of his life and death (London: Andrew Crook, 1666), pp 273, 274.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-440f771606" data-kw="">
<blockquote><p>There is no end of books, and yet we seem to need more every day. There was such a darkness brought in by the fall, as will not thoroughly be dispelled till we come to heaven; where the sun shineth without either cloud or night. For the present, all should contribute their help according to the rate and measure of their abilities. Some can only hold up a candle, others a torch; but all are useful.

The press is an excellent means to scatter knowledge, were it not so often abused. All complain there is enough written, and think that now there should be a stop. Indeed, it were well if in this scribbling age there were some restraint. Useless pamphlets are grown almost as great a mischief as the erroneous and profane. Yet ’tis not good to shut the door upon industry and diligence. There is yet room left to discover more, above all that hath been said, of the wisdom of God and the riches of his grace in the gospel; yea, more of the stratagems of Satan and the deceitfulness of man’s heart.

Means need to be increased every day to weaken sin and strengthen trust, and quicken us to holiness. Fundamentals are the same in all ages, but the constant necessities of the church and private Christians, will continually enforce a further explication. As the arts and slights of besieging and battering increase, so doth skill in the foundation. If we have no other benefit by the multitude of books that are written, we shall have this benefit: an opportunity to observe the various workings of the same Spirit about the same truths, and indeed the speculation is neither idle nor unfruitful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Reader in Richard Sibbes, A Learned Commentary or Exposition upon the First Chapter of the Second Epistle of S. Paul to the Corinthians</cite></span></figcaption>

</figure><figure class="quote" id="q-a86c64f6b3" data-kw="">
<blockquote><p>When preaching on John 20:28, the elder Thomas McCrie digressed to explain how the resurrection of Christ bestowed peculiar honour upon the first day of the week:

The text in its connexion leads me to observe, that our Lord Jesus put peculiar honour on the first day of the week. On that day he rose from the dead; and by that very act it was distinguished from all the other days. As God rested from all his works in creation on the seventh, so did Christ rest from his works in redemption, and declare them complete, by rising from the grave on the first day.

On this day he appeared to the women, to Peter, to the two disciples travelling to Emmaus, and to the ten apostles. The evangelist is very particular in naming the day; for though it had been mentioned before, he does not satisfy himself with saying, “Now the same day in the evening,” but adds, “being the first day of the week.” On the ensuing first day he renewed his visit. And it was on the same day of the week, that the Spirit descended on the apostles.

These acts were sufficient to dedicate that portion of time to a sacred use; for divine authority having already set apart one day in seven, there was no necessity for such an express appointment in transferring the Sabbath from one day of the week to another. The analogy between the works of creation and redemption, as recognised in Scripture, — the reason of the thing, — the example of Christ and his apostles, — and the name given to that day by the Spirit of God, constitute an ample warrant for our faith in keeping it holy to the Lord, as the Christian Sabbath, and for our expecting his spiritual presence on it.

There is no superstition in looking for a special blessing on the first day of the week. There is a hallowing influence in the thought, “This is the LORD’S DAY;” — “This is the day which the Lord hath made; we will rejoice and be glad in it. Save now, I beseech thee, O Lord! I beseech thee, send now prosperity.” The highest attainment on this side heaven, is to be “in the Spirit on the Lord’s day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Confession of Thomas in Sermons</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Dr. [Henry] Cooke is the greatest man who has sprung as yet from the Scoto-Irish race. Forty years ago he was the most conspicuous figure in Ulster; no other man in the province had rendered such eminent service to the community; no other whose pulpit and platform oratory had produced so powerful an effect; no other who, by name and character, was so well known to every class of Ulsterman.

But time makes havoc of the fame even of the greatest and the best. Twenty years are not yet complete since he was laid to rest in the quiet cemetery of Malone; and already a generation has grown up to manhood who never heard and never saw him, while the middle aged only knew him in his decline. It is only the oldest of us who saw and heard him in the maturity of his splendid powers.

It has been thought wise to take advantage of the centenary of his birth to recall the main events of his history, to recount the services that he rendered to the Church and country, and to remind you of the principles associated with his name. You do not believe in canonization or in saints’ days; neither do I. But we cannot be “followers of them who by faith and patience are now inheriting the promises” except we know what they did that was worthy of being followed; and one day in a hundred years, and only two hours of that day, are not too much to devote to the subject.

The centenary of a man’s birth is more suitable for observance than the centenary of his death. Entrance on life is more pleasant to think of than departure from it; the generation who knew him are not yet altogether gone; and it is not impossible that before all impression of him has faded from the memory of the living some aspect of his character which has escaped the notice of his biographer may be caught up and preserved.</p></blockquote>

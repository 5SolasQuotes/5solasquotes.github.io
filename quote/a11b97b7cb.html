<main class="wrap"><figure class="quote" id="q-a11b97b7cb" data-kw="">
<blockquote><p>Many are the mistakes at present about religious matters; but none are more destructive than those which concern the law and the gospel. The generality of our people confound them, and put one in the place of the other. Some suppose they are to be accepted of God for their works, and that they can be justified by the law in the sight of God. Others make their keeping of the law the condition of their receiving the blessings of the gospel, as if these were to be the purchase and reward of their partial obedience. Some are persuaded they must do all they can, and keep the law with all their might, and wherein they come short of the perfect demands of the law, Christ will, out his his merits, atone for their failings. And others again think that Christ has abated the rigor of the law, and that the gospel is nothing more than a new law dispensation, in which the Lord has been pleased to declare that he will accept of sincere obedience instead of perfect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-romaine.html">William Romaine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Twelve Discourses on the Law and the Gospel” in The Whole Works of the Late Rev. William Romaine</cite>, (London, 1837).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2699ea0f28" data-kw="">
<blockquote><p>Under this [Mosaic] Covenant, the natural seed of Abraham bore the face of the Church and state, and God had promised abundance of temporals, and of spiritual, a scantling; But all under the outward administration of the Covenant were not in like manner partakers of the blessings promised in Covenant. For some had their part in temporal blessings only, and the outward ordinances; others were partakers of the spiritual blessings promised. But whatever good thing any of them enjoyed either temporal or spiritual, it was conferred upon them freely according to the Covenant of Grace, and not for the dignity of their works. It is true, the promise is conditional, if they obey, they shall reap the good things of the Land: but obedience was not a causal condition, why they should inherit the Land… So that herein there appears no intexture of the Covenant of works with the Covenant of Grace, nor any moderation of the Law to the strength and power of nature for the obtaining of outward blessings. But rather that God out of his abundant goodness is pleased freely to confer outward blessings promised in the Covenant upon some that did not cleave to him unfeignedly [purely], that he might make good his promise unto the spiritual seed, which by word and oath he had confirmed unto the Fathers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/start-here.html">Reformed Books Online</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Was the Israelites’ Inheriting the Land by Grace, or a Graciously Accommodated Merit?</cite>, John Ball, A Treatise of the Covenant of Grace (London: Miller, 1645), p.142 This work was very influential upon the Westminster Assembly.</span></figcaption>

</figure><figure class="quote" id="q-b5e3099fd5" data-kw="Original Sin">

</figure><figure class="quote" id="q-5481a13ede" data-kw="fifth commandment parents">
<blockquote><p>Among others in relation to the fifth precept, this question concerning the honoring of parents is agitated between us and the papists. In many ways, the latter weaken this precept, maintaining that children, against the consent of their parents, may not only contract marriage, but even adopt a monastic life. May children withdraw themselves from the power of their parents and marry without their consent? We deny against the papists.</p></blockquote>

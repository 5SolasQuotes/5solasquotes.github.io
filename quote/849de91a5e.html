<main class="wrap"><figure class="quote" id="q-849de91a5e" data-kw="">
<blockquote><p>But for whose sins is Christ the propitiation? “He is,” says the Apostle, “the propitiation for our sins, and not for ours only, but also for the sins of the whole world.” When he says, “for our sins,” he may mean, either for the sins of us — Jewish believers, or for the sins of us — believers whether Jews or Gentiles. If he means the former, then the meaning of the second clause is, and not for ours only, but also for the sins of believers of all nations.

He is the propitiation for the sins of us Jewish believers, and not for ours only, but also for the sins of believers throughout the whole world. In this view, the language would agree with that of Caiaphas, which he spoke not of himself, but, being High Priest that year, by Divine inspiration, when he prophesied that Jesus should die for that nation, and not for that nation only, but that he should gather together in one the children of God who are scattered abroad.

But it may be said, that there is no evidence that the Apostle John in his Epistle addressed Jewish believers merely. It may be said, that he addressed believers generally, and this may be true; and so his meaning here will be, — He is the propitiation for our sins, who have already taken him as such; and not for ours only, but also for the sins of any and all, who will take him, throughout the whole world. This Is the view which we would be disposed to adopt; and in this view the words correspond with those of our Lord in his intercessory prayer, — “Neither pray I for these alone, but for them also which shall believe on me through their word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-ross-taylor.html">Walter Ross Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Propitiation for the Sins of the Whole World in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><figure class="quote" id="q-a7ad219589" data-kw="">
<blockquote><p>As for that collaterality which is objected, I answer, the civil and ecclesiastical power, if we speak properly, are not collateral.

1. They have no footing upon the same ground: there may be many subject to the magistrate, who are no church members, and so not under the spiritual power; and where the same persons are subject to both the powers, there is no more collaterality, in this case, nay, not so much, as is betwixt the power of a father in one man, and the power of a master in another man, when both powers are exercised upon the same man who is both a son and a servant.

2. Powers that are collateral, are of the same eminency and altitude, of the same kind and nature; but the civil power is a dominion and lordship; the ecclesiastical power is ministerial, not lordly.

3. Collateral powers do mutually and alike exercise authority over each other respectively. But, though the magistrate may exercise much authority in things ecclesiastical [circa sacra], church officers can exercise no authority in things civil. The magistrate’s authority is ecclesiastical objective, though not formaliter: but the church officer’s authority is not civil so much as objective, not being exercised about either civil, criminal, or capital cases.

4. Collateral powers are subordinate to, and derived from the supreme and original power, like two branches growing out of the same stock, two streams flowing from the same fountain, two lines drawn from the same center, two arms under the same head; but the power of the magistrate is subordinate unto, and depends upon the dominion of God the Creator of all: the power of church officers depends upon the dominion of Christ, the Mediator and King of the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, (1646) | Part 2, ch. 8, p. 120</span></figcaption>

</figure><figure class="quote" id="q-5f83191034" data-kw="definite atonement elect">
<blockquote><p>The common opinion of the Reformed is that Christ (from the mere good-pleasure of the Father) was appointed and given as a Redeemer and head, not to all men, but to a certain number of men. By the election of God, these compose his mystical body. For these alone, Christ (perfectly acquainted with his call) in order to fulfill the decree of election and the counsel of the Father, was willing and determined to die; also to add to the infinite price of his death a most efficacious and special intention to substitute himself in their place and to acquire faith and salvation for them.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-e4664936ff" data-kw="">
<blockquote><p>both in Plato and in Aristotle infinity is associated with the realm of the ‘more-or-Iess,’ with indefiniteness and consequently with imperfection. The First Unmoved Mover is infinite only as to his power insofar as it is the cause of an endless circular motion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-l-balas.html">David L. Balas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Thomist View on Divine Infinity’ in Proceedings of the American Catholic Philosophical Association, vol. 55 (1981), pp. 91-98</cite>, p. 91</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/infinity-and-immensity.html">Infinity and Immensity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6a79d93e3f" data-kw="">
<blockquote><p>Whether all being is rightly divided into finite and infinite, or created and uncreated, or whether indeed a third thing is given that is neither created nor yet God, so it may be ideas or the sephirot of the Jews, or a light that some construct, inaccessible, or an empyrean heaven? The prior is affirmed, the latter denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>I. ‘Of God’ in Syllabus of Theological Problems (Utrecht, 1643), pt. 1, section 1, tract 2, 1. Whether there may be a God?, Controversies of the 2nd Kind</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/infinity-and-immensity.html">Infinity and Immensity</a></span></div>
<div class="actions"><button class="copy" data-copy="“Whether all being is rightly divided into finite and infinite, or created and uncreated, or whether indeed a third thing is given that is neither created nor yet God, so it may be ideas or the sephirot of the Jews, or a light that some construct, inaccessible, or an empyrean heaven? The prior is affirmed, the latter denied.”

</figure><figure class="quote" id="q-1d645518a7" data-kw="">
<blockquote><p>Infiniteness is God of universal, unlimited and incomprehensible perfection, Job 11:8-9; 1 Tim. 6:16. His understanding is infinite, Ps. 147:5. What is there said of one attribute, is true of all. God receives not his being of any, but has it of himself: yea, He is his own being, therefore illimited; for there is none to limit Him. God wills Himself freely, yet necessarily; that which acts necessarily, acts with all its might. God therefore having all perfection in his own power, cannot deny any to Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, Of the Divine Essence</cite>, pp. 9-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/infinity-and-immensity.html">Infinity and Immensity</a></span></div>

</figure><figure class="quote" id="q-63da9bcc6a" data-kw="">
<blockquote><p>A second reason to believe humans cannot grasp infinity is that the concept must contain an infinite number of sub-concepts, which is too many for our finite minds. A counter to this reason is to defend the psychological claim that if a person succeeds in thinking about infinity, it does not follow that the person needs to have an actually infinite number of ideas in mind at one time… Here is a simple argument that we can: If we understand negation and have the concept of finite, then the concept of infinite is merely the concept of not-finite.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/internet-encyclopedia-of-philosophy.html">Internet Encyclopedia of Philosophy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Infinite’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/infinity-and-immensity.html">Infinity and Immensity</a></span></div>

</figure><figure class="quote" id="q-8729211e46" data-kw="">
<blockquote><p>And thus of the first attribute of God, even the absolute necessity of existing. Another surely follows: infinity, which is thus: the sum perfection of the divine essence, without any end or limit…. God is said even to be free from an end of his perfection in two ways, i.e. extensively and intensively.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludwig-crocius.html">Ludwig Crocius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>9. ‘Of the Infinity of God’ in A System of Sacred Theology (Bremen, 1636), bk 3, pp. 472-80</cite>, pp. 472-73</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/infinity-and-immensity.html">Infinity and Immensity</a></span></div>

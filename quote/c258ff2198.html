<blockquote><p>Sufficiently therefore the threefold way is explained in which we concede Christ as He is man, reigns everywhere with the Father: and in the first place [in primis], in his elect. First, indeed, by the virture, power and wisdom of his deity and divine nature. Next, by his Spirit and the gifts and effects of his Spirit. Lastly, by the fellowship even of his body and blood produced through the Holy Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>6. ‘Of the Immensity &amp; Infinity of God’ in Of the Nature of God, or of the Divine Attributes (Heidelberg, 1577), bk. 2, pp. 108-68 | Q. 4, Whether it is of God alone to be everywhere, or whether such may be competent even to some creature 127 | That it is proper to God that his essence be everywhere and in all things be present; thus this is able to be competent to no creature 128 1 Cor. 12:12; Jer. 33:1 | IV. In which things Christ reigns everywhere; it is able to be said He is everywhere even in those things 156 Heb. 1:3; Ps. 33:9; 2 Pet. 1:3; Rom. 8:9; Jn. 16:7; Acts 1:8; Ps. 2:9; Rev. 2:12; 1 Pet. 1:3; 1 Cor. 12:13; Jn. 16:14 Epilogue: in what ways He reigns everywhere 158</cite></span></figcaption>

</figure><figure class="quote" id="q-e983214fe0" data-kw="infinity greatness">
<blockquote><p>The infinity of God follows his simplicity and is equally diffused through the other attributes of God, and by it the divine nature is conceived as free from all limit in imperfection: as to essence (by incomprehensibility) and as to duration (by eternity) and as to circumscription, in reference to place (by immensity).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.8.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/infinity-and-immensity.html">Infinity and Immensity</a> › <a href="../topics/attributes-of-god/infinity-and-immensity/greatness.html">Greatness</a></span></div>
<div class="actions"><button class="copy" data-copy="“The infinity of God follows his simplicity and is equally diffused through the other attributes of God, and by it the divine nature is conceived as free from all limit in imperfection: as to essence (by incomprehensibility) and as to duration (by eternity) and as to circumscription, in reference to place (by immensity).”

— Francis Turretin, Institutes of Elenctic Theology, 3.8.1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20infinity%20of%20God%20follows%20his%20simplicity%20and%20is%20equally%20diffused%20through%20the%20other%20attributes%20of%20God%2C%20and%20by%20it%20the%20divine%20nature%20is%20conceived%20as%20free%20from%20all%20limit%20in%20imperfection%3A%20as%20to%20essence%20%28by%20incomprehensibility%29%20and%20as%20to%20duration%20%28by%20eternity%29%20and%20as%20to%20circumscription%2C%20in%20reference%20to%20place%20%28by%20immensity%29.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%203.8.1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe983214fe0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e983214fe0.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-8729211e46" data-kw="">
<blockquote><p>And thus of the first attribute of God, even the absolute necessity of existing. Another surely follows: infinity, which is thus: the sum perfection of the divine essence, without any end or limit…. God is said even to be free from an end of his perfection in two ways, i.e. extensively and intensively.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludwig-crocius.html">Ludwig Crocius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>9. ‘Of the Infinity of God’ in A System of Sacred Theology (Bremen, 1636), bk 3, pp. 472-80</cite>, pp. 472-73</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/infinity-and-immensity.html">Infinity and Immensity</a></span></div>

— Ludwig Crocius, 9. ‘Of the Infinity of God’ in A System of Sacred Theology (Bremen, 1636), bk 3, pp. 472-80, pp. 472-73">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+thus+of+the+first+attribute+of+God%2C+even+the+absolute+necessity+of+existing.+Another+surely+follows%3A+infinity%2C+which+is+thus%3A+the+sum+perfection+of+the+divine+essence%2C+without+any+end+or+limit%E2%80%A6.+God+is+said+even+to+be+free+from+an+end+of+his+perfection+in+two+ways%2C+i.e.+extensively+and+intensively.%E2%80%9D%0A%0A%E2%80%94+Ludwig+Crocius%2C+9.+%E2%80%98Of+the+Infinity+of+God%E2%80%99+in+A+System+of+Sacred+Theology+%28Bremen%2C+1636%29%2C+bk+3%2C+pp.+472-80%2C+pp.+472-73&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8729211e46.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8729211e46.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infinity-of-god/#:~:text=And%20thus%20of%20the%20first%20attribute,two%20ways%2C%20i.e.%20extensively%20and%20intensively&amp;text=And%20thus%20of%20the%20first%20attribute%20of%20God&amp;text=perfection%20in%20two%20ways%2C%20i.e.%20extensively%20and%20intensively" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-249daec26d" data-kw="">
<blockquote><p>Immensity is God present everywhere, neither included in, nor excluded from any place or thing (Deus est sphaera, cujus centrum est ubique, circumferentia nusquam. Enter proesenter Deus hic et ubi{que} potenter), Ps. 139:7; Isa. 60:1. God is a sphere whose center is everywhere, the circumference nowhere. God is nowhere and God is everywhere: He is nowhere in that He is not contained anywhere; He is everywhere in that He contains all. Hence God in respect of his omnipresence is compared to an infinite point. God is in every place by his essence as the universal cause of the being and operation of all things, by his presence, beholding all things; and by his power upholding all things. Besides that omnipresence of God whereby He is always present with all creatures, there are certain peculiar ways of his presence with diverse creatures. In Christ He dwells bodily, that is, personally, Col. 2:9, and fills the manhood with the Spirit out of measure, Jn. 3:34. In the saints He dwells as in his temple by the presence of his indwelling Spirit, the effect of his special grace, 1 Cor. 3:16. He is said to dwell in Heaven because it is the place wherein He is pleased to manifest his glory immediately and in most excellent manner unto the blessed. God is said to come to us and depart from us, not in respect of his universal presence or change of place, but in respect of the degrees of his indwelling Spirit, assisting grace and other special effects of his favor towards his people. The same also holds true in respect of the common effects of the Spirit in regard of others. Bodies are in places circumscriptively bounded by their dimensions without penetration. Angels are in places definitively, that is, though they are not bounded by dimensions of height, breadth and depth, as bodies, yet they are not in two places at once; whilst they are in this place, they are not in another. God is in every place always.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, Of the Divine Essence</cite>, p. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/infinity-and-immensity.html">Infinity and Immensity</a></span></div>

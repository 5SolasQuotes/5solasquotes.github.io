<blockquote><p>Though the king have power in case of the Church aberration (which is somewhat extraordinary) it follows not therefore, in ordinary, he has a nomothetic [law-making] power to make Church-Laws.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), p. 417</span></figcaption>

— Samuel Rutherford, Due Right of Presbyteries (1644), p. 417">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThough+the+king+have+power+in+case+of+the+Church+aberration+%28which+is+somewhat+extraordinary%29+it+follows+not+therefore%2C+in+ordinary%2C+he+has+a+nomothetic+%5Blaw-making%5D+power+to+make+Church-Laws.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Due+Right+of+Presbyteries+%281644%29%2C+p.+417&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F119f1300fe.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/119f1300fe.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-civil-magistrates-just-authority-for-quarantining-and-restraining-the-congregating-of-citizens-even-the-church-with-sufficient-natural-warrant/#:~:text=Though%20the%20king%20have%20power%20in,nomothetic%20%5Blaw%2Dmaking%5D%20power%20to%20make%20Church%2DLaws&amp;text=Though%20the%20king%20have%20power%20in%20case%20of&amp;text=has%20a%20nomothetic%20%5Blaw%2Dmaking%5D%20power%20to%20make%20Church%2DLaws" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d279c3545e" data-kw="">
<blockquote><p>There must also an order be set down [by the magistrates] among the citizens, to avoid public assemblies, games, feasts, drinkings, marriages, dancings, fairs, schools, churches, and public baths; for besides that in many of these there is great offence committed, not only against the body, but also against the soul, there is also no small danger of getting and scattering the infection. Wherefore, wise men give counsel that at such times we should very seldom come into great companies of men. For there is no man so unskillful but he knows that where as all things are done without consideration, as it were in a mingle mangle, that there the infection is spread farthest and infects many. As when the taverns and typling houses whither they go to drink are open unto all daily, the market also, the shambles, public places also in which linen is washed, and diverse sorts of people are wont [accustomed] to be mixed together, are haunted [frequented by the plague]. In this case, therefore, laws must be made by the Preservers [civil health officials appointed specifically for the plague] whereby such meetings may be forbidden, or else severed into diverse places and times. … If marriages are to be made (albeit whom can these contracts like in such an estate of things, in which if at any time else, the counsel of the apostle ought to prevail, that for the present necessity it were better to remain single) let them be kept with a very small number of persons and without all pomp. As for drunkenness and gormandize, dancings and other not necessary or rather dangerous and hurtful ceremonies and fashions, which for the most part are wont to be used: let them be sent packing far away, lest (as it is in the proverb) this sweet meat have sour sauce (Tob. 2; Amos 8; 1. Mach. 1; Prov. 14), and lest they bewail the next day the oversight committed the day before. … Now concerning houses of learning and schools in which children come together, what shall I say? Else than that it seems very convenient and in manner necessary, if we will avoid the spreading of the infection, that those which cannot be brought unto a place more commodious, be for a time shut up and that the youth be rather taught at home, albeit with never so small profit, and give themselves to private readings than with so great danger by heaps to come together. For the age of children and lads, as being given to feeding, intemperate, tender, thin, unwary, is wont to be more subject unto this sickness [bubonic plague] than those that are elder and of more years. Wherefore, Rhases, the chief of the Arabian physicians, and after him Franciscus Valleriola, physician of Arles, give counsel that infants and children be with speed removed from infectious places into another country where they need fear no danger of infection, The like may be judged of common and yearly fairs, also of funerals or burials… Unto this chapter, let the Preservers [civil health officials appointed for the plague] add this, and earnestly advise upon it with all the magistrates, namely, whether it were better for certain poor people, which get their living by begging from door to door, and by reason of their needy life feeding on everything, are more in danger of this disease than others, go unto and run about all streets, and chiefly such houses where dead corpses are, and seek unto all men (for cruel necessity drives them out of their own poor cottages); let them I say consider whether it were better to send them some whither else, or to maintain them by the common charge at their own houses so long until the sickness slack, that by this means occasion may be taken from them of running up and down, of receiving and scattering the infection. For it can scarce be said how great and present danger does hereby grow unto the whole city. … For this way it shall come to pass that the less multitude of people there is, so much the less infection there shall be: and the less infection there is, so much less dying and more speedy deliverance is to be hoped for. For like as when the rot is gotten into an heap of apples, the more lie gathered together, the more it increases and the longer the rotting endures: so also here it comes to pass that if once the plague be crept into a city that is populous, we see the sickness daily to be increased and cherished a great while, which thing is not wont in such sort to happen in a place less peopled…</p></blockquote>

<blockquote><p>2. And you will hinder the great benefit which the world may get, by their vain attire: For (though it be no thanks to them that intend it not) yet it is a very great commodity that comes to mankind by these people’s sin: that fools should go about in fools-coats, and that empty brains, and proud and wanton hearts should be so openly detected in the streets and churches: that sober people may avoid them; and that wise, and chaste, and civil people may not be deceived by such in marriage to their undoing: As the different clothing of the different sexes is necessary to chastity and order; so it is a matter of great convenience in a commonwealth, that sots, and swaggerers, and phrenetics, and Idiots, and proud, and wanton lustful persons should be openly distinguished from others: As in a plague-time the doors of infected houses are marked with a ‘Lord have mercy on us’: And the wisest magistrate knew not how to have accomplished this himself by a law, as the wretches themselves do by their voluntary choice: For if it were not voluntary, it would be no distinguishing badge of their profession. Now for any honest civil people to join with them and take up their livery, and the habit of their Order, is to profess themselves such as they, and so to encourage and approve them, or else to confound the proud and humble, the vain and the sober, the wanton and the chaste, and destroy the benefit of distinction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), p. 467</span></figcaption>

<blockquote><p>…so the physicians hinder that diseases rage amongst the subjects, and the magistrates do also hinder that they should rage: But the physicians hinder them by curing diseases, and the magistrate hinders them not by curing diseases; for then he should as a magistrate also be a physician, but by procuring that there should be physicians in the commonwealth.</p></blockquote>

</figure><figure class="quote" id="q-e67c526b51" data-kw="">
<blockquote><p>A number of proclamations issued in the relation of the visitation [of the plague in 1665] pertained to the concourse of the people. Under most circumstances the concourse of people was vehemently prohibited in political plague texts, upholding an understanding of material protection against the threat of contagion. However, the persistent belief in the moral dimension of illness manifested in proclamations that gestured to instances when gatherings could be justified, in the interest of providential salvation. On 6 July [1665], measures for designated fast days and the severity of the growing outbreak were proclaimed in a text entitled ‘By the King. A Proclamation for a Generall Fast Throughout the Realm of England’. Fast days during plague had been enacted first during an outbreak in 1563 under Elizabeth I, who, alongside her council and the church, scheduled prayer and fasting, with fasting on Wednesdays… The proclamation [in 1665] requested that citizens not only maintain the request, ‘And that the solemnization of these days may be with such Order and Decency as is requisite’… Meetings in churches continued through the outbreak, though the circumstances changed once many pulpits were left abandoned by their Anglican ministers. The flight of ministers meant nonconformist ministers took up the task of preaching at some of the vacant pulpits. Writing of the height of the epidemic, nonconformist Thomas Vincent described the scene at a church in God’s Terrible Voice in the City: ‘Now there is such a vast concourse of people in the Churches, where these ministers are to be found, that they cannot many times come near the Pulpit doors [in order to enter the pulpit to preach] for the press [of the people]’.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-6781601465" data-kw="">
<blockquote><p>Those of mankind that are predestinated unto life, God, before the foundation of the world was laid, according to his eternal and immutable purpose, and the secret counsel and good pleasure of his will, hath chosen, in Christ, unto everlasting glory, out of his mere free grace and love, without any foresight of faith, or good works, or perseverance in either of them, or any other thing in the creature, as conditions, or causes moving him thereunto; and all to the praise of his glorious grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 3.5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-95ccf7a3d7" data-kw="fixed number election WCF">
<blockquote><p>By the decree of God, for the manifestation of his glory, some men and angels are predestined unto everlasting life and others foreordained to everlasting death. These angels and men, thus predestinated and foreordained, are particularly and unchangeably designed; and their number is so certain and definite that it cannot be either increased or diminished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-l-dabney.html">R. L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Five Points of Calvinism</cite>, ch. on Election (citing WCF 3.3–4)</span></figcaption>

</figure><figure class="quote" id="q-40ad41a1eb" data-kw="">
<blockquote><p>This election is not of many kinds, but one and the same for all who were to be saved in the Old and the New Testament. For Scripture declares that there is a single good pleasure, purpose, and plan of God’s will, by which he chose us from eternity both to grace and to glory, both to salvation and to the way of salvation, which God prepared in advance for us to walk in.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 8</span></figcaption>

</figure><figure class="quote" id="q-a8ae778da8" data-kw="">
<blockquote><p>Before the foundation of the world, by sheer grace, according to the free good pleasure of his will, God chose in Christ to salvation a definite number of particular people out of the entire human race, which had fallen by its own fault from its original innocence into sin and ruin. Those chosen were neither better nor more deserving than the others, but lay with them in the common misery. God did this in Christ, whom he also appointed from eternity to be the mediator, the head of all those chosen, and the foundation of their salvation. And so God decreed to give to Christ those chosen for salvation, and to call and draw them effectively into Christ’s fellowship through the Word and Spirit. In other words, God decreed to grant them true faith in Christ, to justify them, to sanctify them, and finally, after powerfully preserving them in the fellowship of the Son, to glorify them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 7</span></figcaption>

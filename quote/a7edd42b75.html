<main class="wrap"><figure class="quote" id="q-a7edd42b75" data-kw="">
<blockquote><p>At the Reformed Presbyterian Synod of Ireland in 1834, a number of resolutions relative to the observance of the Lord’s Day were passed. Some of them relate specifically to the duty of the state to stop Sabbath-profanation:

3. That nations favoured with the Word of God are under solemn and indispensable obligation to honour this sacred appointment of heaven; and it is the duty of their rulers to enact laws, for protecting the Sabbath from open desecration, and to carry them into vigorous execution.

4. That the testimony of profane history concurs with Divine Revelation in declaring, that manifold blessings have been bestowed upon communities in connexion with the due observance of the Lord’s Day; while, on the other hand, its profanation has never failed to produce an increase of irreligion immorality and crime, and to draw down upon a people national judgments.

5. That it is a matter of much lamentation, that the lands of our nativity are chargeable with the violation of God’s holy day to a tremendous extent; – inasmuch as, throughout the country, it is profaned by idleness, assemblies of the young, &amp;c., while in our villages, cities, and large towns, the keeping open of public houses and newsrooms, travelling of coaches, unnecessary selling of vessels, publishing and vending newspapers, selling goods, working in distilleries, breweries, and baking establishments, driving cattle, &amp;c., tend manifestly to set aside this Divine institution; that many of the poor profane it by habitual neglect of religious ordinances, and by recreations, and irregular indulgences, while the rich encourage them in the sin by attending to business on finding their pleasure on God’s holy day; and the public functionaries of the nation, instead of taking adequate measures to have Sabbath-profanation restrained, permit the laws respecting it to lie a dead letter, and in many instances, by luxurious living, Cabinet councils, Ministerial dinners, and Sabbath-travelling set a demoralizing example to the community, of disregard to the authority of the Lord of the Sabbath.

6. That while we deeply deplore the existence and increase of these evils, under a solemn sense of our responsibility, as watchmen upon the walls of Zion, we are constrained to warn the rulers of the land of their fearful criminality, in permitting them to spread unrestrained, and to declare our entire persuasion that no Legislative enactment is calculated effectually to prevent the abuses of the Sabbath day to keep it holy, and avert threatened judgments, which does not require equally the higher and lower classes to remember the Sabbath day to keep it holy, and which will not bring the rulers themselves to abstain from its desecration; and, in like manner, we declare to the community at large, that unless they speedily repent of this glaring wickedness, seek forgiveness through the blood of the Divine Redeemer, and walk in the paths of new obedience, the peace, order, morality, and temporal welfare of the nation will soon be destroyed, and fearful judicial inflictions from the hand of the Almighty will overtake it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guardian-and-constitutional-advocate.html">Guardian and Constitutional Advocate</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Guardian and Constitutional Advocate</cite>, 22 July 1834.</span></figcaption>

<blockquote><p>The Scriptures Divine are the most ancient Records in the World; but it follows not, that because the Scriptures do not Record how the Patriarchs did observe the Sabbath, therefore they observed it not; but much rather, because, the Scriptures Record, that The Lord blessed the seventh Day, and sanctified it, therefore the Patriarchs did observe it.</p></blockquote>

</figure><figure class="quote" id="q-a68477d09c" data-kw="">
<blockquote><p>Finally, you may see the growing danger of indifference which I speak of in the painful increase of Sabbath-breaking in the land. In town and in country, in Belgravia and Bethnal Green, the state of things is the same. Full Churches are the exception on Sunday, and half-empty Churches are the rule. A religious census of any large population tells the same story. The Fourth Commandment of the Decalogue seems to be left out in the cold and ready to die.

Partly from the spread of infidelity, that old enemy of the Lord’s Day; partly from the morbid love of liberty, and letting everyone do as he likes; partly from the exaggerated love of pleasure which marks this age; partly from the facilities afforded by railways for Sabbath travelling, of which our fathers knew nothing, and got on well enough without them; partly from one cause and partly from another, the devil is just now getting more help in his favourite campaign against the Lord’s Day than he has done since the Reformation. You may see what I mean, in the persistent attempts now made to throw open places of amusement, aquariums, museums, picture galleries, and such-like places, under the plausible pretence of ‘affording recreation to the working classes.’

I have no hesitation in saying that this unmistakable increase of Sabbath neglect is one of the worst symptoms of the increase of indifference to vital religion in our days. There is an inseparable connection between the observance of the Lord’s Day and the prosperity of to true religion. Voltaire was quite right when he said he could never succeed in destroying Christianity unless he destroyed Sunday. Whether Englishmen know it or not, their Sabbath has been one of their richest possessions, and the grand secret of their position in the world. Of it the famous words may be truly used, that ‘it is the cheap defence of a nation.’ [Edmund Burke] It is a simple fact that wherever spiritual religion in a Church is strong and vigorous, the honour of Sunday goes up, and wherever it decays, Sunday ceases to be well observed. In a word, Sunday is the barometer of every so-called Christian nation. Tell me how Sunday is kept in a land, and I will tell you what the Church of the land is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts for Thinkers: An Address given to the Sixteenth Liverpool Diocesan Conference, in St George s Hall, November 2, 1897’ in Charges and Addresses</cite></span></figcaption>

</figure><figure class="quote" id="q-d085134a35" data-kw="">
<blockquote><p>I know there are some, that lay it unto our charge, as the false apostles did unto Paul, that we use the word of God deceitfully; they find fault with our translations of the Scriptures; they spare not to say there be a thousand faults in the New Testament; yet would they never set down five hundred, or one hundred, or fifty, or twenty-five, or five.

If there be errors in the translation, I know they were men which translated it, and they might err like men. May no translation be allowed that is not altogether perfect? as if the Greek translation were without fault, or as if many faults were not in the common vulgar translation in Latin, or in the translation of Jerome. What then? Must the Greek translation be forbidden? must Jerome’s translation, or the vulgar translation, be forbidden? As for the old Latin common translation, though many learned men have shewed the gross errors thereof; yet have they well provided for it in the council of Trent.

”Let no man dare or presume (say they) by any manner of colour to refuse the old common translation of the Bible.” Yet is no translation of ours so corrupt, as that which they have thus privileged. But if it were true, which they falsely report, reason would they did correct the errors, and so set it abroad. But thus they bear you in hand, that they may bring you in hatred of it, and pull you from the reading of the Scriptures. I will not say in what sort they abuse the word of God. What speak I of abusing? Nay, they do manifestly against and contrary to the word.</p></blockquote>

<blockquote><p>A. 3: And God’s prohibition, Deut. 12, of adding or diminishing, is not washed away so easily as your words would make men believe. You say, It reaches to the whole duty of man, and government of the Church, etc. Answer: There be some things in the duty of man and church-matters that God has left to man: To do those is no addition to God’s laws: But to do the like work that God by his Law has done, which He never left to man, seems to me the addition there forbidden: e.g. If men had made another Tabernacle, another ark of the Covenant, another holy vestment for Aaron, another sacrament like circumcision or the Passover, He that so reproved their worshiping in the high places would have reproved these.</p></blockquote>

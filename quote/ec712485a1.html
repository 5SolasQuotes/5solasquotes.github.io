<main class="wrap"><figure class="quote" id="q-ec712485a1" data-kw="">
<blockquote><p>[I]t ought to be the first concern of everyone who seeks the Kingdom of Christ that each one should serve Christ our King in this according to his own portion, so that suitable shepherds may be placed in charge of individual churches, to feed them in good faith, i.e., with deep concern to preserve them in the faith and obedience of Christ the King, and to live up to all the functions and roles of the sacred ministry, namely, by a sincere dispensation of the doctrine and sacraments of Christ and by a faithful administration of his discipline.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Regno Christi</cite>, (1550) in Wilhelm Pauck (ed.), The library of Christian classics: Melanchthon and Bucer (Philadelphia, 1969), p. 214.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><figure class="quote" id="q-9c0fdfa1ba" data-kw="">
<blockquote><p>It is well known, indeed, that the blinded and superstitious followers of the Bishop of Rome claim the title of Catholic, as exclusively applicable to themselves. In their own estimation, they are the Church, the only true Church, the Catholic, or universal Church; and all the other classes of nominal Christians, throughout the world, are heretics, out of the way of salvation. This claim, however, in the estimation of all enlightened Christians, is as presumptuous as it is vain. That department of nominal Christendom, instead of being the only true Church, is considered by many as too far gone in corruption to be comprehended under the Christian name at all; and instead of there being no salvation out of her communion, the danger of eternal perdition is rather to those who are found within her pale.

It is not doubted, indeed, that there are many pious individuals within that pale; but it is believed that they are placed in circumstances deplorably unfavourable to their growth in grace; and that the multitudes around them, in the same communion, are immersed in darkness, superstition, and dreadful error, which place them in the utmost jeopardy of eternal perdition. This is that “Antichrist,” that “Man of sin,” and “Son of Perdition,” who exalteth himself above all that is called God, and who is yet to be “destroyed with the breath of Jehovah’s mouth, and with the brightness of his coming.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Presbyterianism: The Truly Primitive and Apostolic Constitution of the Church of Christ</cite>, (Philadelphia PA: Presbyterian Tract and Sunday School Society, 1836), p. 6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

iety%2C+1836%29%2C+p.+6.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9c0fdfa1ba.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9c0fdfa1ba.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/05/22/samuel-miller-is-rome-the-catholic-church/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-66cd10c262" data-kw="">
<blockquote><p>Then there may and ought to be uniting [in church union] when the evils that follow division or schism, are greater and more hurtful to the Church, than the evils that may be supposed to follow on union. I speak not of ills of sin (for the least of these are never to be chosen), but of evils and inconveniences that may indeed be hurtful to the Church in themselves, and sinful in respect of some persons, yet are not so to all: Now, in such evils the lesser is to be chosen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise Concerning Scandal</cite>, pp. 321–22</span></figcaption>

</figure><figure class="quote" id="q-38b795f294" data-kw="">
<blockquote><p>…the Church ministerially does judge, so as the obligatory power is from the things themselves, not from the will of human superiors. No necessity of peace which is posterior to truth, no necessity of obedience to authority, no necessity of uniformity in these externals, simply, and as they are such, are necessities obliging us to obedience: For things must first in themselves be necessary, before they can oblige to obedience. I must obey superiors in these things of convenient necessity, because they are convenient, and most convenient in themselves, and so intrinsically most necessary, but they are not necessarily to be done in themselves, because I must obey superiors, and because I must keep uniformity with the Church. The will of superiors do find in things necessity, and good of uniformity, but they do not make necessity, nor the good of uniformity: We should be servants of men if our obedience were ultimately resolved in the mere will of superiors in any the least circumstance of worship: and what I say of actions, holds in matters of mere custom also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646) | Question 5, p. 59</span></figcaption>

<blockquote><p>6. If matters in their expediency be questionable and probable on both sides, the Church’s determination should end the controversy (say the Doctors), this is the doctrine of the Jesuits, Suarez, Thomas Sanches, and Gregory de Valentia, as I show[ed] before (supra, Question 6 of this treatise), when a thing is probable and I be resolved in conscience against neither of the sides, and fear the one side be [a] murdering him for whom Christ died, which is against God’s commandment, and know that human authority commands the contrary and am persuaded it is indifferent and a positive commandment of men: if the Church’s determination be here to sway my conscience to practice, is to me blind obedience for human authority, as it is such, gives no light. Ergo, it [the Church’s judgment] cannot remove my doubting and beget faith; and also the conscience is so much the bolder to venture on a sin against God for fear of eschewing a sin against men, which is questionable, and [that] in a matter indifferent; this is also the stout conscience of Bonaventura (2 Sentences, dist. 39), plus est standum praecepto Praelati quam conscientiae. 7. Our [Prelatist] Doctors say [that] our way is against the peace of the Church: But I answer [that] their way is Popish and against the truth of God in commanding our consciences to rest upon the wicked will of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646) | Appendix, ‘An Introduction to the Doctrine of Scandal’, Question 4, p. 43</span></figcaption>

</figure><figure class="quote" id="q-ef0d9d52f8" data-kw="">
<blockquote><p>We acknowledge not what Navarrus and Gregory say, that excommunication, whether just or unjust, is to be feared, for the curse causlessly does not fall. The sentence is either given out: [1.] a jure, vel ab homine, by the Law, or the persons. Secondly, it is either just or unjust. Thirdly, and that three ways: exanimo, [out of] good or ill zeal; secondly, ex causa, [out of] a just or unjust cause; thirdly, ex ordine [out of order], when order of law is kept. An unjust sentence is either valid or null. That which is invalid is either invalid through defect of the good mind of the excommunicators, and this is not essential to the excommunication’s validity. That which is invalid this way only, ligat, ‘it binds’ in foro exteriore [in the external court]. But that which is unjust through want [lack] of a just cause, it only binds from external communion; but because God’s ordinances are to be measured from their own nature, and the general intention of the catholic Church, and not from abuses and particular intentions of such excommunicators: therefore they do not exclude from the general Church-desires. The fourth Council of Carthage, as also Gerson says, an unjust sentence neminem gravare debet, ‘should affright no man’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, ‘Of the Addition of Members to the Church’, pp. 279-80</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><figure class="quote" id="q-525562fed7" data-kw="">
<blockquote><p>Question 2. Is A Magistrate Held Responsible To Render Account Of All His Laws To His Subjects? And How Far Are They To Presume Such Laws To Be Just? After this foundation has been laid we would also inquire into certain other questions which would appear to be germane to this discourse that the consciences of many may be satisfied. First the question is raised whether the magistrate is held to render account of all his laws to any man soever so as to offer proof that they be fair and in accordance with the precepts of religion. I answer that he is not so held; nay more, that it is fair that all virtuous subjects should regard their lords in the light of virtue and should not presume of suspect anything unjust concerning them; nay, that it is not becoming that men in private station should inquire over curiously even concerning doubtful matters beyond their comprehension or station in life. If, however, the conscience of some be at a loss, they can and are even under an obligation to examine (albeit discreetly and in a peaceful manner) what elements of reason and justice are to be found in the command by which they are bidden or forbidden to do something; for the word of the apostle abides: “whatsoever is not of faith (that is while the conscience is in doubt whether that is being done justly or not) is sin”. But if what is commanded is openly sinful or unjust, then indeed that which has been said above applies.</p></blockquote>

<blockquote><p>…it were much more tolerable if men would plead for the necessity of the things which it seems good unto them to command, and on that ground to command their observance, than granting them [to be] not necessary in themselves, to make them necessary to be observed merely by virtue of their commands, for reasons which they say satisfy themselves but come short of giving satisfaction to them from whom obedience is required. For whereas the will of man can be no way influenced unto obedience, but by mere acknowledged sovereignty, or conviction of reason in and from the things themselves, commands in about things wherein they own not that the commanders have an absolute sovereignty (as God has in all things, the civil, supreme magistrate in things civil that are good and lawful), nor can they find the reasons of the things, themselves cogent, are a yoke which God has not designed the sons of men to bear.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit</cite>, (London: 1662), ch. 7, p. 41 in Works 15:34-35</span></figcaption>

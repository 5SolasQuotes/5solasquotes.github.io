<main class="wrap"><figure class="quote" id="q-94813ced0a" data-kw="">
<blockquote><p>It would be to be wished that this contestation had not gone out of the schools of the Roman Communion, where it [the teaching of divine premotion] took birth. But by a misfortune that one could not deplore enough, it has passed even into ours, although with some difference. In effect in the Roman Church there is no one who has not taken sides on this, while in ours few writers have paid attention to this dispute, of which the matter is in effect quite metaphysical. When one reads the works of most of our theologians one has much difficulty perceiving that they have even heard speaking of it. The others [of the Reformed], to whom this contestation has not been unknown, have divided themselves on this. Most have declared themselves for premotion. This is what have done among the supralapsarians Piscator, Maccovius, Voet, Twisse, Rutherford and others, and among the infralapsarians Rivet, Maresius, Turrettin, etc. Several have said things quite opposed to this sentiment, like Junius, Pareus, the theologians of England deputies to the Synod of Dort, H. Alting, P. Ferri, M. Amyraut, M. Morus, etc. Some have explained themselves more clearly, and have positively rejected this dogma, like four of our philosophers, Gockenius, Rutgersius, Jacchæus and Burgersdijk. Some even have refuted it amply and solidly, like Robert Baron, Strangius, Baxter, Heidegger and M. Holsius. That alone makes it clear that it is more or less the same with the Roman Church as with ours, at least in this regard, that in one and in the other premotion has adversaries and partisans, from which one can conclude what is the injustice of the reproaches that the missionaries make to us on this in such an insulting manner. For finally if it is wrong for us to suffer the Predeterminants in our communion, by what right do the Pope and his councils suffer them in theirs?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-la-placette.html">Jean La Placette</a></span><span class="wk"><span class="lbl">Work:</span> <cite>La Placette vs. Naude on Premotion, Concurrence &amp; Decrees</cite>, trans. from French by AI (Amsterdam: 1707 ff.), pp. 265-66 La Placette (1639-1718) was a French reformed minister who was against divine premotion.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d361f92310" data-kw="">
<blockquote><p>Having examined the mind of Scotus, whom I expound and follow, I establish this: the principle determining the free and contingent secondary cause toward its free and contingent act is the first cause, concurring with it antecedently by a certain priority of nature toward the action and effect, in such a way that the divine action is prior in nature — not only by dignity and perfection, but also by causality. This I affirm to be wholly the mind of Scotus, and fitted to remove all the difficulties we have mentioned above… And since he fully knows its nature and mode of operating, he adapts and accommodates to it the concurrence which, although antecedent and leading, will move and lead the will freely and contingently.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo &amp; Scotus’s View, pp. 407-8</span></figcaption>

</figure><figure class="quote" id="q-ee4a4b51ea" data-kw="">
<blockquote><p>Regarding the nature of free will; it suffices that from the previous judgment of the practical intellect, it chooses one of the opposites, while still being able to choose the other from a different judgment of the same intellect; because, namely, the root and foundation of free will lie in the intellect, insofar as it can consider various aspects of good in opposites and propose them to the will. But the nature of free will does not include that while the free agent chooses from previous judgment, it is not moved by a superior cause to judge and choose so. Therefore, since the divine motion predetermining the will does not hinder a person from having full and perfect judgment of reason and judging that one means is contingent and the other is necessarily connected to the end, and could also choose otherwise from a different judgment, it follows that such a motion does not harm the freedom of our will. For it is proper to the uncreated will to have its choice from no prior cause.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan</cite>, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘How Divine Concurrence can be Reconciled with Free Will’, pp. 339-42 Latin Le Blanc (1614-1675) was a French reformed professor of theology at Sedan. | XXIII. To this, he responds:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><figure class="quote" id="q-963508f7c6" data-kw="">
<blockquote><p>…the opposite case of the right and meritorious act, toward which God concurs by producing everything in the act — both the moral and the physical — because He decreed both from eternity and foresaw them by intending, predefining, and indeed commanding them. And so He concurs in time by placing the cause in the first act through the auxiliaries of grace, so that it would be in the proximate power toward right acting in the second act; then by determining it through the concurrence of assisting grace toward eliciting the right and meritorious act. This is the proper and connate concurrence owed by the first cause to the secondary cause that is going to operate — just as the determination as to the individual is also connected inseparably with exercise…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…the opposite case of the right and meritorious act, toward which God concurs by producing everything in the act — both the moral and the physical — because He decreed both from eternity and foresaw them by intending, predefining, and indeed commanding them. And so He concurs in time by placing the cause in the first act through the auxiliaries of grace, so that it would be in the proximate power toward right acting in the second act; then by determining it through the concurrence of assisting grace toward eliciting the right and meritorious act. This is the proper and connate concurrence owed by the first cause to the secondary cause that is going to operate — just as the determination as to the individual is also connected inseparably with exercise…”

— Francisco Macedo, Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Concurrence with Evil Actions | Good Acts">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+opposite+case+of+the+right+and+meritorious+act%2C+toward+which+God+concurs+by+producing+everything+in+the+act+%E2%80%94+both+the+moral+and+the+physical+%E2%80%94+because+He+decreed+both+from+eternity+and+foresaw+them+by+intending%2C+predefining%2C+and+indeed+commanding+them.+And+so+He+concurs+in+time+by+placing+the+cause+in+the+first+act+through+the+auxiliaries+of+grace%2C+so+that+it+would+be+in+the+proximate+power+toward+right+acting+in+the+second+act%3B+then+by+determining+it+through+the+concurrence+of+assisting+grace+toward+eliciting+the+right+and+meritorious+act.+This+is+the+proper+and+connate+concurrence+owed+by+the+first+cause+to+the+secondary+cause+that+is+going+to+operate+%E2%80%94+just+as+the+determination+as+to+the+individual+is+also+connected+inseparably+with+exercise%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Francisco+Macedo%2C+Collations+of+the+Teachings+of+St.+Thomas+%26+Scotus%2C+with+the+Differences+between+the+Two%3A+with+the+Texts+of+Both+Faithfully+Presented%2C+and+the+Sentences+Subtly+Examined%2C+with+the+Commentaries+of+the+Interpreters%E2%80%A6+vol.+2+tr.+AI+by+Vertias+%28Padua%3A+Frambotti%2C+1671%29%2C+%2C+bk.+2%2C+Collation+9%2C+pp.+361-429+%7C+Concurrence+with+Evil+Actions+%7C+Good+Acts&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F963508f7c6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/963508f7c6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=the%20opposite%2

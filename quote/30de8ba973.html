<main class="wrap"><figure class="quote" id="q-30de8ba973" data-kw="">
<blockquote><p>Although the law in its covenant form requires of all who are under it since the fall perfect obedience as the condition of life and full satisfaction for sin their own persons, and at the same time, upon the revelation and offer of Christ in the gospel as Jehovah Our Righteousness, commands them to believe in Him as such; yet as is the case in various other instances of duty, it requires the one of these only on supposition that the other is not performed. The law as a covenant of works requires that all who are under it do present to it as the conditions of eternal life perfect obedience and complete satisfaction for sin, either in their own persons or in that of a responsible surety. So long, then, as a sinner, unwilling to be convinced of his sin and his want of righteousness, cleaves to the law as a covenant and refuses to accept and present in the hand of faith the spotless righteousness of the adorable Surety, that sinner continues “a debtor to do the whole law” (Gal. 5:3). He keeps himself under an obligation to do, in his own person, all that the law in that form requires and also to suffer all that it threatens. The righteous law, accordingly, goes on to use him as he deserves. It continues to proceed against him without the smallest abatement of its high demands, requiring of him the complete payment of his debt both of perfect obedience and of infinite satisfaction for his disobedience. As it accepts no obedience but that which is absolutely perfect or fully answerable to all its demands (Gal. 3:10–11), so the acceptance of a man’s person as righteous according to it will depend on the acceptance of [Christ’s] obedience (Matt. 5:18; Rom. 10:5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel (Grand Rapids: Reformation Heritage Books), 19.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2a9fc46282" data-kw="">
<blockquote><p>Before Adam’s fall it was not necessary for him to have Christ, because he was righteous and without sin, just as the angels have no need of Christ. If Adam had not fallen, it would not have been necessary for Christ to become our Redeemer. …The argument is true that eternal life is in the given to him who keeps the law without Christ, because whoever keeps the law is righteous. Adam would have entered into the kingdom of heaven without Christ, if he had not fallen. …The conclusion is that Adam alone kept the commandments of God before the Fall, but after the Fall and no one has truly been found who has fulfilled the law</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputatio de iustificatione, (1536) in Luther’s Works, 26.185, 187</cite></span></figcaption>

</figure><figure class="quote" id="q-b72020f7f1" data-kw="eternal life">
<blockquote><p>However, the received opinion among the orthodox is that the promise given to Adam was not only of a happy life to be continued in paradise, but of a heavenly and eternal life (to which he was to be carried after the course of perfect obedience and perseverance had been run). The law of works had the promise of heavenly and eternal life; therefore also the law prescribed to Adam. In each instance, it is the same law as to substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.6.3-4</span></figcaption>

<blockquote><p>V. The covenant of nature is that which God the Creator made with innocent man as his creature, concerning the giving of eternal happiness and life under the conditions of perfect and personal obedience. It is called “natural,” not from natural obligation (which God does not have towards man it is also called “legal” because the condition on man’s part was the observation of the law of nature engraved within him; and of works because it depended upon works or his proper obedience. XIV. Although man was already bound to this obedience by a natural obligation as a rational creature, necessarily subject to the dominion of God and his law, yet he was more strongly bound by a federal obligation which God so stipulated that man–by the powers received in creation–could perform it, although in order that he might actually perform it, he still needed the help of God both to actuate these faculties and powers and to preserve them from change. This help did not tend to the infusion of any new power but only to exercising the efficacy of that power which he had received. Now this did not belong properly to the covenant of nature, but always depended on the most free good pleasure (eudokia) of God; Otherwise the covenant of nature has been immutable, And man had never sinned. XV. The sanction of the covenant attended the exaction of duty. It consisted both in the promise of reward and gain and in the threatening of punishment. The promise was of the highest happiness (of eternal life) to be passed not on earth but in heaven. The threatening was of death and whatever in scripture comes under the name of death to express punishment of all kinds (into which man by his own sin deservedly fell). XVI. However, from this pact arises the mutual obligation of the parties, differing according to their condition. With respect to man, not only was it from the pact, but absolute and simple from the nature of the thing (and on account of God, to whom man as a creature to the Creator, the beneficiary to the Benefactor, owed himself wholly and whatever he had to God and was bound to love him with his whole heart). But with respect to God, it was gratuitous, as depending upon a pact or gratuitous promise (by which God was bound not to man, but to himself and to his own goodness, fidelity and truth, Rom. 3:3; 2 Tim 2:13). Therefore there was no debt (properly so called) from which man could derive a right, but only a debt of fidelity, arising out of the promise by which God demonstrated his infallible and immutable constancy in truth. If the apostle seems to acknowledge this right or debt (Rom. 4:4), it must be understood in no other than a respective sense; not as to the proportion and condignity of the duty rendered to God by man (Rom. 8:18; Lk. 17:10), but to the pact of God and justice (i.e., the fidelity of him making it). XVII. If therefore upright man in that state had obtained this merit, it must not be understood properly and rigorously. Since man has all things from and owes all to God, he can seek from him nothing as his own by right, nor can God be a debtor to him–not by condignity of work and from its intrinsic value (because what ever that may be, it can bear no proportion to the infinite reward of life), but from the pact and the liberal promise of God (according to which man had the right of demanding the reward to which God had of his own accord bound himself) and in comparison with the covenant of grace (which rests upon the sole merit of Christ, by which he acquired for us the right to life). However, this demanded antecedently a proper and personal obedience by which he obtained both his own justification before God and life, as the stipulated reward of his labors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology, trans. George Musgrave Giger (Phillipsburg: P&amp;R Publishing, 1992), Eighth topic, Q. 3, §§5, 14-17 . (vol. 1.575, 577–78).</cite></span></figcaption>

— Francis Turretin, Institutes of Elenctic Theology, trans. George Musgrave Giger (Phillipsburg: P&amp;R Publishing, 1992), Eighth topic, Q. 3, §§5, 14-17 . (vol. 1.575, 577–78).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CV.+The+covenant+of+nature+is+that+which+God+the+Creator+made+with+innocent+man+as+his+creature%2C+concerning+the+giving+of+eternal+happiness+and+life+under+the+conditions+of+perfect+and+personal+obedience.+It+is+called+%E2%80%9Cnatural%2C%E2%80%9D+not+from+natural+obligation+%28which+God+does+not+have+towards+man+it+is+also+called+%E2%80%9Clegal%E2%80%9D+because+the+condition+on+man%E2%80%99s+part+was+the+observation+of+the+law+of+nature+engraved+within+him%3B+and+of+works+because+it+depended+upon+works+or+his+proper+obedience.+XIV.+Although+man+was+already+bound+to+this+obedience+by+a+natural+obligation+as+a+rational+creature%2C+necessarily+subject+to+the+dominion+of+God+and+his+law%2C+yet+he+was+more+strongly+bound+by+a+federal+obligation+which+God+so+stipulated+that+man%E2%80%93by+the+powers+received+in+creation%E2%80%93could+perform+it%2C+although+in+order+that+he+might+actually+perform+it%2C+he+still+needed+the+help+of+God+both+to+actuate+these+faculties+and+powers+and+to+preserve+them+from+change.+This+help+did+not+tend+to+the+infusion+of+any+new+power+but+only+to+exercising+the+efficacy+of+that+power+which+he+had+received.+Now+this+did+not+belong+properly+to+the+covenant+of+nature%2C+but+always+depended+on+the+most+free+good+pleasure+%28eudokia%29+of+God%3B+Otherwise+the+covenant+of+nature+has+been+immutable%2C+And+man+had+never+sinned.+XV.+The+sanction+of+the+covenant+attended+the+exaction+of+duty.+It+consisted+both+in+the+promise+of+reward+and+gain+and+in+the+threatening+of+punishment.+The+promise+was+of+the+highest+happiness+%28of+eternal+life%29+to+be+passed+not+on+earth+but+in+heaven.+The+threatening+was+of+death+and+whatever+in+scripture+comes+under+the+name+of+death+to+express+punishment+of+all+kinds+%28into+which+man+by+his+own+sin+deservedly+fell%29.+XVI.+However%2C+from+this+pact+arises+the+mutual+obligation+of+the+parties%2C+differing+according+to+their+condition.+With+respect+to+man%2C+not+only+was+it+from+the+pact%2C+but+absolute+and+simple+from+the+nature+of+the+thing+%28and+on+account+of+God%2C+to+whom+man+as+a+creature+to+the+Creator%2C+the+beneficiary+to+the+Benefactor%2C+owed+himself+wholly+and+whatever+he+had+to+God+and+was+bound+to+love+him+with+his+whole+heart%29.+But+with+respect+to+God%2C+it+was+gratuitous%2C+as+depending+upon+a+pact+or+gratuitous+promise+%28by+which+God+was+bound+not+to+man%2C+but+to+himself+and+to+his+own+goodness%2C+fidelity+and+truth%2C+Rom.+3%3A3%3B+2+Tim+2%3A13%29.+Therefore+there+was+no+debt+%28properly+so+called%29+from+which+man+could+derive+a+right%2C+but+only+a+debt+of+fidelity%2C+arising+out+of+the+promise+by+which+God+demonstrated+his+infallible+and+immutable+constancy+in+truth.+If+the+apostle+seems+to+acknowledge+this+right+or+debt+%28Rom.+4%3A4%29%2C+it+must+be+understood+in+no+other+than+a+respective+sense%3B+not+as+to+the+proportion+and+condignity+of+the+duty+rendered+to+God+by+man+%28Rom.+8%3A18%3B+Lk.+17%3A10%29%2C+but+to+the+pact+of+God+and+justice+%28i.e.%2C+the+fidelity+of+him+making+it%29.+XVII.+If+therefore+upright+man+in+that+state+had+obtained+this+merit%2C+it+must+not+be+understood+properly+and+rigorously.+Since+man+has+all+things+from+and+owes+all+to+God%2C+he+can+seek+from+him+nothing+as+his+own+by+right%2C+nor+can+God+be+a+debtor+to+him%E2%80%93not+by+condignity+of+work+and+from+its+intrinsic+value+%28because+what+ever+that+may+be%2C+it+can+bear+no+proportion+to+the+infinite+reward+of+life%29%2C+but+from+the+pact+and+the+liberal+promise+of+God+%28according+to+which+man+had+the+right+of+demanding+the+reward+to+which+God+had+of+his+own+accord+bound+himself%29+and+in+comparison+with+the+covenant+of+grace+%28which+rests+upon+the+sole+merit+of+Christ%2C+by+which+he+acquired+for+us+the+right+to+life%29.+However%2C+this+demanded+antecedently+a+proper+and+personal+obedience+by+which+he+obtained+both+his+own+justification+before+God+and+life%2C+as+the+stipulated+reward+of+his+labors.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+trans.+George+Musgrave+Giger+%28Phillipsburg%3A+P%26R+Publishing%2C+1992%29%2C+Eighth+topic%2C+Q.+3%2C+%C2%A7%C2%A75%2C+14-17+.+%28vol.+1.575%2C+577%E2%80%9378%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F84de65cf2d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/84de65cf2d.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/04/turretin-on-merit-in-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-d30289b10e" data-kw="">
<blockquote><p>The Covenant of Works, wherein God covenanted with man to give him eternal life upon condition of perfect obedience in his own person. The Covenant of Grace, which God made with man promising eternal life upon condition of believing…This Covenant [of works] God made with man without a Mediator for there needed no no middle person to bring man into favor and friendship with God, because man did bear the image of God, and had not offended: nor to procure acceptance to man’s service because it was pure and spotless. God did love man being made after his Image and promised to accept of his obedience performed freely, willingly, entirely, according to his Commandment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace (London, 1645), 8, 9.</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-2d5028ba59" data-kw="">
<blockquote><p>Objection: The use of instruments was by the light of nature before the ceremonial Law, and therefore could not expire with it. Answer: 1. The dictates of Nature can make no man know that the sound of any innanimate creature can be acceptable service to God, if you abstract from his positive institutions; yea, without institution it were presumption to offer such manner of service unto God; Nature, I grant will dictate that our voice and tongues, which God has given us as a glory to glorify Himself, should be made use of in his praises: Nature also may prompt a man to use instruments for his own recreation, and may prove sometimes an useful diversion in time of disquiet of mind, but it’s beyond the reach of nature to know that such noise and sounds shall be pleasing to God, except when God reveals and appoints it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-craghead.html">Robert Craghead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to a Late Book entitled, A Discourse concerning the Inventions of Men in the Worship of God, by William, Lord Bishop of Derry... (Edinburgh: Anderson, 1694), ch. 1</cite>, pp. 17-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-926b5fe04f" data-kw="">
<blockquote><p>First, that God offers to the men of this world, helps and means, either of the knowledge of God in Nature, or of grace in Christ: and that to this end, to lead them to repentance and salvation… Thus God offered to the carnal Israelites means of grace to purge them, to turn them, Prov. 1:13, to gather them, Mt. 23:37, to convince them, Jn. 16:8-9, to draw them with cords of man and bands of love, Hos. 11:4, to dress them to bring forth good fruit, Isa. 5:4. Secondly, that the means God uses for these good ends are in some measure sufficient (if they be not hindered by men) to bring them to the attainment of these ends: for when God says Himself, He uses these means for these ends; for us to say, these means are not sufficient for these ends, seems to me to derogate from the wisdom and sufficiency of God, whose works are all of them perfect, Deut. 32:4, and so sufficient for the ends for which He wrought them. Yet God forbid I should doubt of that which our Savior tells the Jews, ‘No man can come to Christ, except the Father draw him,’ Jn. 6:44, by the same almighty power and authority whereby He sent Christ into the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. Cotton’s Clearing Certain Doubts Concerning Predestination... (London, 1646), 5th Doubt, Question 5</cite>, pp. 207-8</span></figcaption>

</figure><figure class="quote" id="q-e33623c0ab" data-kw="">

<blockquote><p>For although the light of nature teach that God is to be worshipped, yet in substantial things reason teaches not how this worship of God is to be administred, nor the house of God to be governed, but in all this we must depend upon the mind and pleasure of Christ, the King of his Church, and Saviour of his body.</p></blockquote>

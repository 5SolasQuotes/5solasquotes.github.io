<main class="wrap"><figure class="quote" id="q-550d356515" data-kw="">
<blockquote><p>Q. Is the blessing [in the 2nd Commandment for keeping God’s commandments] only proper to the godly? A. No, for God rewards the posterity of the wicked with outward benefits according to their outward services as appears by the succession of some [or the same].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>eds. Peel &amp; Carlson, Cartwrightiana (London: Halley Stewart, 1951) | V. A Short Catechism</cite>, p. 162</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ea26cac1d4" data-kw="">
<blockquote><p>Neither does the renewed confidence of perseverance produce immorality or lack of concern for godliness in those put back on their feet after a fall, but it produces a much greater concern to observe carefully the ways which the Lord prepared in advance. They observe these ways in order that by walking in them they may maintain the assurance of their perseverance, lest, by their abuse of God’s fatherly goodness, the face of the gracious God (for the godly, looking upon that face is sweeter than life, but its withdrawal is bitterer than death) turn away from them again, with the result that they fall into greater anguish of spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 5, Art. 13</span></figcaption>

— Synod of Dort, The Canons of Dort, Head 5, Art. 13">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNeither%20does%20the%20renewed%20confidence%20of%20perseverance%20produce%20immorality%20or%20lack%20of%20concern%20for%20godliness%20in%20those%20put%20back%20on%20their%20feet%20after%20a%20fall%2C%20but%20it%20produces%20a%20much%20greater%20concern%20to%20observe%20carefully%20the%20ways%20which%20the%20Lord%20prepared%20in%20advance.%20They%20observe%20these%20ways%20in%20order%20that%20by%20walking%20in%20them%20they%20may%20maintain%20the%20assurance%20of%20their%20perseverance%2C%20lest%2C%20by%20their%20abuse%20of%20God%E2%80%99s%20fatherly%20goodness%2C%20the%20face%20of%20the%20gracious%20God%20%28for%20the%20godly%2C%20looking%20upon%20that%20face%20is%20sweeter%20than%20life%2C%20but%20its%20withdrawal%20is%20bitterer%20than%20death%29%20turn%20away%20from%20them%20again%2C%20with%20the%20result%20that%20they%20fall%20into%20greater%20anguish%20of%20spirit.%E2%80%9D%0A%0A%E2%80%94%20Synod%20of%20Dort%2C%20The%20Canons%20of%20Dort%2C%20Head%205%2C%20Art.%2013&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fea26cac1d4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ea26cac1d4.html">Permalink</a><a class="src" href="https://www.crcna.org/welcome/beliefs/confessions/canons-dort" rel="noopener" target="_blank">Read it online · CRCNA</a></div>
</figure><figure class="quote" id="q-6806e030aa" data-kw="">
<blockquote><p>On the one hand, it was stated that grace only serves to restore human willpower for good and to put humans themselves to work. Good works, in that case, were definitely necessary for salvation, whether by a necessity of merit (Rome) or by a necessity of causality and effectiveness (Remonstrants). And from the antinomian side it was said objectively that the righteousness and holiness of Christ remained completely external to a person, not only in justification but also in sanctification, so that repentance, conversion, prayer for forgiveness, and good works were totally unnecessary, bore a legalistic character, and failed to do justice to the perfect sacrifice of Christ. Lutherans tried to avoid both extremes and conducted a long-lasting and vehement debate on the appropriateness or inappropriateness of the proposition ‘Good works are necessary to salvation.’… The Reformed were more moderate in their judgment, regarded the Lutheran debate as a dispute over words, and could not see the big difference between the rejected formula ‘Good works are necessary to salvation’ and another that some Lutherans (like Quenstedt and Buddeus) had approved: ‘It is impossible to be saved without good works.’ They had no objection to calling good works necessary to salvation provided this did not imply a ‘necessity of causality or merit or effectiveness’ but implied a necessity of presence of the means and ways to obtain eternal salvation. Voetius even believed that in a sense good works can be called ‘the cause of eternal life,’ that is, not a ‘meritorious’ but a ‘preparatory’ and ‘dispositional’ cause. (G. Voetius, Select Disputations, vol 5, 675 ff.) Speaking along these lines, they undoubtedly had Scripture on their side… . Good Works Sanctification manifests itself in good works, which according to the Heidelberg Catechism arise from the principle of a true faith, conform to the law of God, and are done for his glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics (Baker, 2008), vol. 4, Part 1, ch. 4, ‘Passive and Active Sanctification’, pp. 254-256 Some footnotes have been omitted.</cite></span></figcaption>

</figure><figure class="quote" id="q-a63c435ec8" data-kw="">
<blockquote><p>We, indeed, allow that good works are required for righteousness; we only take away from them the power of conferring righteousness, because they cannot stand before the tribunal of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, James 2:25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a> › <a href="../topics/good-works/necessity-of-good-works/not-for-justification.html">Not for justification</a></span><span class="t"><a href="../topics/justification/paul-and-james.html">Paul and James</a> › <a href="../topics/justification/paul-and-james/romans-and-james-reconciled.html">Romans and James reconciled</a></span></div>
<div class="actions"><button class="copy" data-copy="“We, indeed, allow that good works are required for righteousness; we only take away from them the power of conferring righteousness, because they cannot stand before the tribunal of God.”

— John Calvin, Commentaries on the Catholic Epistles, James 2:25">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe%2C%20indeed%2C%20allow%20that%20good%20works%20are%20required%20for%20righteousness%3B%20we%20only%20take%20away%20from%20them%20the%20power%20of%20conferring%20righteousness%2C%20because%20they%20cannot%20stand%20before%20the%20tribunal%20of%20God.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Commentaries%20on%20the%20Catholic%20Epistles%2C%20James%202%3A25&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa63c435ec8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a63c435ec8.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom45" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-7f5dd95c2e" data-kw="">
<blockquote><p>Bellarmine: Good works are necessary not only by a necessity of presence, but also by efficiency, so Scripture, the Fathers and sane reason teaches. The Orthodox: Good works do not precede one justified, but necessarily follow one justified and precede unto salvation. They are yet ordinarily necessary by adults out of the supposition or necessity: 1. Of presence, as signs and effects of true faith. 2. Of divine command. 3. of a means, so far as they are the way of salvation, a condition and cause sine qua non [without which there is nothing]. If therefore by the term ‘efficiency’ Bellarmine does not mean some form of merit, or properly the virtue and worth of them in comparison to salvation, that saying is able to be admitted. Good works certainly work unto eternal life following, but not by meriting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-alsted.html">Henry Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Controversy 10, ‘Whether Good Works are Necessary?’ in ‘Of Justification &amp; of Good Works in General’ in pt. 4, Controversies with the Papists in Polemical Theology… in Seven Parts (Hanau, Germany, 1620)</cite>, p. 496</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“Bellarmine: Good works are necessary not only by a necessity of presence, but also by efficiency, so Scripture, the Fathers and sane reason teaches. The Orthodox: Good works do not precede one justified, but necessarily follow one justified and precede unto salvation. They are yet ordinarily necessary by adults out of the supposition or necessity: 1. Of presence, as signs and effects of true faith. 2. Of divine command. 3. of a means, so far as they are the way of salvation, a condition and cause sine qua non [without which there is nothing]. If therefore by the term ‘efficiency’ Bellarmine does not mean some form of merit, or properly the virtue and worth of them in comparison to salvation, that saying is able to be admitted. Good works certainly work unto eternal life following, but not by meriting.”

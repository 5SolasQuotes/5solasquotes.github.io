<blockquote><p>That this is also your principal care, most watchful fathers of your country, your zeal and piety do not suffer us to doubt. For indeed you have remembered that dominion is strengthened by piety and righteousness according to the oracle of the wisest of kings; and that your rule never could be happy and well ordered unless you took care that by the word of God, his authority should always avail with you and that Christ himself should reign through you. You have remembered that here might be not so much an aristocracy as a theocracy, having God always for its president and ruler; and that the safety of the republic, which should always be the supreme law, could not be better consulted than by defending those two impregnable ramparts – the culture of pure religion and the pious care of nurturing the church, which God has committed to the protection of your wings […] as long as you will take care that among your citizens piety and justice, the love of religion and country, love and the holy concord of souls shall flourish, and vices (too many in this most corrupt age even in the growing church) be severely repressed; as long as by our zeal this city shall truly correspond to her name “Reformed,” as much with respect to integrity of morals as to purity of doctrine […]</p></blockquote>

<blockquote><p>1. There be some preparations which go before faith: Faith is a seed of heaven… so does the Lord set up a new world of faith in a soul void of faith by degrees: There’s a time when there’s neither perfect night, nor perfect day: but the twilight of the morning… There’s a half summer, and a half spring in the close of the spring which God made. The embryo, or birth not yet animated, is neither seed only, nor a man-child only… … 3. Its true, the new creation and life of God is virtually seminaliter [seminally] in these preparations, as the seed is a tree in hope, the blossom an apple, the foundation a palace in its beginning; so half a desire in the non-converted is love sickness for Christ in the seed, legal humiliation is in hope evangelic repentance and mortification: But as the seed and the growing tree differ not gradually only, but in nature and specifically, as a thing without life is not of that same nature and essence with a creature that has a vegetative life and growth, so the preparatory good affections of desire, hunger sorrow, humiliation going before conversion, differ specifically from those renewed affections which follow after…</p></blockquote>

<blockquote><p>XVII. OF THE USE AND ABROGATING OF GOD’S LAW.

1 The ceremonial and judicial laws of Moses in respect of obedience due to them, are abrogated by the coming of the Messiah.

2 The moral law is abrogated in respect of the curse, not in respect of obedience due to it.

3 Uses of the ceremonial and judicial laws of Moses, partly were, &amp; partly are these. First a schooling or leading us unto Christ, that is, a signifying, or shadowing of spiritual and heavenly things in the kingdom of Christ.

4 Secondly, a distinction of God’s people from other nations.

5 Thirdly, an execution or putting in practise the law moral, which requireth a limitation of many circumstances, both in church &amp; commonweal.

6 Fourthly, testifying of our obedience toward God.

7 Fiftly, the sealing of God’s covenant by ceremonies, which were sacramental signs.

8 Sixtly, a preservation of the Mosaical policy, till Christ’s coming, by judicial laws, which were the sinews and form of the common weal.

9 Lastly, a confirmation of the new testament, by comparing the fulfilling of all things with the types.

10 The moral law, in time of our innocency, had other uses, then now it hath, as, a perfect conforming of the life of man to GOD’S will, a good conscience, and sure confidence in God’s love &amp; favour.

11 In this our corrupt nature these uses it hath first a maintaining of discipline within and without the church.

12 Secondly, an acknowledgement of our sins, which two uses pertain unto all men, and are that pedagogue or schooling of the law, whereby we are led unto Christ.

13 Thirdly, an information to the true worship of God, which use is peculiar to the renewed or regetate [sic].

14 And these are the principal uses; besides which there are also some others as namely, a testimony that there is a God, &amp; what manner of God he is.

15 A note of the church, which is distinguished by integrity &amp; purity of the law from all other sects.

16 A testimony of that excellency of man’s nature which was before the fall, &amp; which is restored unto us by Christ.

17 A testimony of eternal life, wherein the law shall be fulfilled, seeing in this life it is not fulfilled, and God made it not that it should never attain its proper and principal end.</p></blockquote>

<blockquote><p>Object. 1. It will be said, We are prohibited by the Magistrate.

Sol. 1. Was not this the Apostles case again and again? were not they commanded, yea strictly charged, not to preach any more? But did they give over? Why should not we answer with them, It is better to obey God than man? Doth God charge us so deeply, so dreadfully, and shall we think our selves discharged if man contradict it?

If the Magistrate should be thought indeed to have such a power of Dispensations, will not here be a fine easy way for idle Drones to shift the Yoke, and leave the Plow? for ‘twil but be to get an Order from above for not Preaching; and then when the Chief Shepherd shall appear, to pluck out his Indulgence, and no more can be said. But we fear God will not be so put off. Are not God’s forbidden Messengers, yet charged by Him to speak without fear, and that under a dreadful penalty, and shall we fear man’s wrath for preaching, more than God’s WO if we preach not?</p></blockquote>

Sol. 1. Was not this the Apostles case again and again? were not they commanded, yea strictly charged, not to preach any more? But did they give over? Why should not we answer with them, It is better to obey God than man? Doth God charge us so deeply, so dreadfully, and shall we think our selves discharged if man contradict it?

If the Magistrate should be thought indeed to have such a power of Dispensations, will not here be a fine easy way for idle Drones to shift the Yoke, and leave the Plow? for ‘twil but be to get an Order from above for not Preaching; and then when the Chief Shepherd shall appear, to pluck out his Indulgence, and no more can be said. But we fear God will not be so put off. Are not God’s forbidden Messengers, yet charged by Him to speak without fear, and that under a dreadful penalty, and shall we fear man’s wrath for preaching, more than God’s WO if we preach not?”

— Joseph Alleine, A call to Archippus, or, An humble and earnest motion to some ejected ministers (by way of letter). To take heed to their ministry, that they fulfil it, ([London], 1664), p. 20.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObject.+1.+It+will+be+said%2C+We+are+prohibited+by+the+Magistrate.%0A%0ASol.+1.+Was+not+this+the+Apostles+case+again+and+again%3F+were+not+they+commanded%2C+yea+strictly+charged%2C+not+to+preach+any+more%3F+But+did+they+give+over%3F+Why+should+not+we+answer+with+them%2C+It+is+better+to+obey+God+than+man%3F+Doth+God+charge+us+so+deeply%2C+so+dreadfully%2C+and+shall+we+think+our+selves+discharged+if+man+contradict+it%3F%0A%0AIf+the+Magistrate+should+be+thought+indeed+to+have+such+a+power+of+Dispensations%2C+will+not+here+be+a+fine+easy+way+for+idle+Drones+to+shift+the+Yoke%2C+and+leave+the+Plow%3F+for+%E2%80%98twil+but+be+to+get+an+Order+from+above+for+not+Preaching%3B+and+then+when+the+Chief+Shepherd+shall+appear%2C+to+pluck+out+his+Indulgence%2C+and+no+more+can+be+said.+But+we+fear+God+will+not+be+so+put+off.+Are+not+God%E2%80%99s+forbidden+Messengers%2C+yet+charged+by+Him+to+speak+without+fear%2C+and+that+under+a+dreadful+penalty%2C+and+shall+we+fear+man%E2%80%99s+wrath+for+preaching%2C+more+than+God%E2%80%99s+WO+if+we+preach+not%3F%E2%80%9D%0A%0A%E2%80%94+Joseph+Alleine%2C+A+call+to+Archippus%2C+or%2C+An+humble+and+earnest+motion+to+some+ejected+ministers+%28by+way+of+letter%29.+To+take+heed+to+their+ministry%2C+that+they+fulfil+it%2C+%28%5BLondon%5D%2C+1664%29%2C+p.+20.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2fee315c65.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2fee315c65.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/03/30/joseph-alleine-on-preaching-when-forbidden-to-by-the-magistrate/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

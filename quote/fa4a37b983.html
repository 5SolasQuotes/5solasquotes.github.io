<main class="wrap"><figure class="quote" id="q-fa4a37b983" data-kw="">
<blockquote><p>But kingdoms willingly engaging themselves for His kingdom, His Christ, His saints, the purity of religion, His worship and government, in all particulars, and in all humility sitting down at His feet to receive the law, and the rule from His mouth: what a price doth he set upon such?

Especially, when (as we this day) sensible of our infirmity, and of an unfaithful heart not steady with our God, but apt to start from the cause, if we feel the knife or the fire; who bind ourselves with cords, as a sacrifice to the horns of the altar; we invocate the name of the great God, that His vows, yea, His curse may be upon us, if we do not this; yea, though we suffer for so doing, that is, if we endeavour not so far as the Lord shall assist us by His grace, to advance the kingdom of the Lord Jesus Christ here upon earth, and make Jerusalem once more the praise of the whole world, notwithstanding all the contradictions of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Solemn League and Covenant. Exhortation at Westminster (1643) in James Kerr (ed.), The Covenants and the Covenanters: Covenants, Sermons, and Documents of the Covenanted Reformation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1428a64d40" data-kw="">
<blockquote><p>Surely it is the voice of the glorious Trinity that calls it “my holy day;” God the Father by creation, God the Son by redemption, and God the Holy Ghost by sanctification, sending down a rich and plentiful effusion of gifts and graces upon the apostles, for the enabling them to go forth and convert the Gentiles, by the preaching of the gospel. To deny God his own right is sacrilege and atheism.</p></blockquote>

</figure><figure class="quote" id="q-59d7b78d34" data-kw="">
<blockquote><p>Indeed, nothing like the example of a ceremony has been exhibited thus far. On the laying on of hands and of the holy kiss, we speak below.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, (Amsterdam, 1663-1676) | vol. 1, pt 1, bk. 2, ‘Of Ecclesiastical Things, or Acts &amp; Exercises’, Tract 1, ‘Of Formularies, or Liturgies &amp; Rituals’ | ch. 7. ‘Questions Further Explained on the Nature, Causes &amp; Properties of the Ceremonies’, pp. 422-460 “On the public controversies [previously] explicated, we respond to various problems and questions on the ceremonies, by which the nature and properties of them may be the better laid open. I divide them into problems on ceremonies in general and on ceremonies in particular. The first classes [on ceremonies in general] pertain to what it is, or the definition, or the causes or properties.” | On the definition of a ceremony: | 11th Problem, ‘Whether in the time of the N.T. there were instiuted, or observed by the apostles ceremonies properly called sacred and mystical, whether in their signifying or working, which however were not parts of divine worship, nor instituted by divine law, nor consequently necessary by the necessity of a precept? I respond: No.’, p. 425</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-389d830e47" data-kw="">
<blockquote><p>They who write on this subject with judgment and understanding, use to distinguish three sorts of modes of men’s actions that are found in religion, viz. circumstances, rites and ceremonies. Circumstances are modifications of actions, as time, place, person; or, a circumstance is any thing that accompanies an action which is not of its essence, but is used with it, relates to it, and is an accident, or adjunct of it: and it may be such, either with respect to the pysical or moral being of the action: Circumstances use to be sorted in these memorial verses: ‘Quis, quid, ubi, quibus auxiliis, cur, quomodo, quando.’ And ‘forma, figura, locus, tempus, stirps, patria, nomen.’ Circumstance is a word of larger extent than rite, and that than ceremony; a rite is the manner of going about any action (chiefly that which is public or solemn) confirmed by law or custom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), section 12, p. 276</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>[R]eligious joy is greatly promoted by deep meditation, joined with active usefulness. These are united, because either is incomplete without the other, and together they produce a happy consummation. In secret the truth of God should be deeply and carefully contemplated; and as the heart is melted and inflamed by study, corresponding labours should be undertaken.

Mere study, without labour, is apt to induce a contemplative habit—agreeable, indeed, to the subject of it, but not useful to others; while activity, unaccompanied with deep meditation, is apt to degenerate into mere formality or vain-glory. When united, the principle and practice go together, and they mutually confirm and strengthen one another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-morgan.html">James Morgan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fruit of the Spirit – Joy in Christian Miscellany</cite></span></figcaption>

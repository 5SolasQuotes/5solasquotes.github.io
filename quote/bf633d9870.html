<blockquote><p>It must first be reiterated that with extraordinary few exceptions no educated person in the history of Western Civilization from the third century B.C. onward believed that the earth was flat. A round earth appears at least as early as the sixth century BC with Pythagoras, who was followed by Aristotle, Euclid, and Aristarchus, among others in observing that the earth was a sphere. Although there were a few dissenters–Leukippos and Demokritos for example–by the time of Eratosthenes (3 c. BC), followed by Crates(2 c. BC), Strabo (3 c. BC), and Ptolemy (first c. AD), the sphericity of the earth was accepted by all educated Greeks and Romans. Nor did this situation change with the advent of Christianity. A fewóat least two and at most five–early Christian fathers denied the spherically of earth by mistakenly taking passages such as Ps. 104:2-3 as geographical rather than metaphorical statements. On the other side tens of thousands of Christian theologians, poets, artists, and scientists took the spherical view throughout the early, medieval, and modern church… No one before the 1830s believed that medieval people thought that the earth was flat… But now, why did the false accounts of Letronne and Irving become melded and then, as early as the 1860s, begin to be served up in schools and in schoolbooks as the solemn truth? The answer is that the falsehood about the spherical earth became a colorful and unforgettable part of a larger falsehood: the falsehood of the eternal war between science (good) and religion (bad) throughout Western history… The reason for promoting both the specific lie about the sphericity of the earth and the general lie that religion and science are in natural and eternal conflict in Western society, is to defend Darwinism. The answer is really only slightly more complicated than that bald statement. The flat-earth lie was ammunition against the creationists. The argument was simple and powerful, if not elegant: “Look how stupid these Christians are. They are always getting in the way of science and progress.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-b-russell.html">J.B. Russell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Myth of the Flat Earth’ (1997) at The American Scientific Affiliation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d76a7c7f0e" data-kw="">
<blockquote><p>Aquinas tells us that, just as God sustains and moves a creature to act through the contingency of its nature, so too does he move the creature again in grace, analogically elevating the creature to attain an end beyond the scope of its original nature. (ST i- ii q. 109, aa. 1, 6, 9) By invoking the language of movement, Aquinas chooses to describe grace not only within the linguistic but also the causal categories that mark the analogical relationship between God and the world, where creation as really related to God participates in God in a way proportioned to its nature. (ST i q. 13, a. 7) And yet the participation indicated by grace is qualitatively different and much deeper than that of nature. Unlike a natural end, the end of those infused virtues that characterize the life of the baptized is not a natural similitude of divine goodness, but is in fact God himself. (ST i- ii q. 1) All natural creaturely perfections are said of both the creature and of God, analogically: that which is “good” or “true” in a given creature is necessarily said of God as well. God is goodness, and created “good things” are a kind of participated similitude of the divine goodness. (ST i qq. 6, 13) Grace represents a furthered participation, this time in Divine nature itself. Aquinas himself says clearly that “grace is nothing except a participated similitude of divine nature.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-m-lynch.html">Reginald M. Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), pp. 231-32 Lynch is a Dominican and writes in the Thomist tradition.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-af6b4efbb6" data-kw="">
<blockquote><p>There is talk of a new astrologer who wants to prove that the earth moves and goes around instead of the sky, the sun, the moon, just as if somebody were moving in a carriage or ship might hold that he was sitting still and at rest while the earth and the trees walked and moved. But that is how things are nowadays: when a man wishes to be clever he must needs invent something special, and the way he does it must needs be the best! The fool wants to turn the whole art of astronomy upside-down. However, as Holy Scripture tells us, so did Joshua bid the sun to stand still and not the earth.</p></blockquote>

<blockquote><p>(1) Before the Westminster Assembly there were a variety of interpretations of Genesis 1 and its days. If the text of Genesis is so clear-cut why did the church down the centuries not see it that way? Does that not say something not only about the interpreters but also the text? Claims that a literal reading of the days of Genesis 1 is obvious fall down when the history of interpretation is taken into consideration. (2) We will be wise to heed the warnings Augustine and Calvin give on the difficulty of interpreting this chapter, and so beware of dogmatic claims they themselves did not advance. Jerome pointed to the Jewish rabbis’ refusal to let anyone under thirty interpret it. Creation transcends our knowledge and experience. A heavy dose of medicine from Job 38:1ff is in order. As with any other passage, Genesis 1 must not be interpreted in isolation but in the context of the whole of Scripture. (3) Until the mid-sixteenth century the interpreters we cited were all abreast of the philosophy and science of their day, and often made use of it in biblical interpretation. That we reject many of their scientific beliefs is because of our own scientific knowledge. That we place implicit faith in the laws of gravity is due to what we know scientifically, rather than from the Bible. So far I, for one, have found this reliable! Calvin allows and supports scientific work. He indicates Genesis is of a different literary genre than a science text book. (4) The Reformed tradition of the sixteenth century interpreted creation theologically. The classic Reformed creeds consider it in the context of the doctrine of God, as an ex nihilo work of the Trinity. In so doing, they affirm their continuity with the historic teaching of the church. The question of the days of creation was not even a matter of discussion… Its absence is striking. It was never a matter of confessional significance…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-letham.html">Robert Letham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“‘In the Space of Six Days’: the Days Of Creation From Origen to the Westminster Assembly’ in Westminster Theological Journal 61:2 (Fall, 1999), pp. 149-74 | Summary Conclusions:</cite>, p. 174</span></figcaption>

<blockquote><p>We know that God created the world in time; but why He did not create the world millions of years before, we are ignorant of, and our reasons would be bewildred in their too much curiosity. If we ask why He did not create it before, we may as well ask why He did create it then? And may not the same question be asked, if the world had been created millions of years before it was? That He created in it six days, and not in an instant, is revealed; but why He did not do it in a moment, since we are sure He was able to do it, is not revealed.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-e4a400e150" data-kw="">
<blockquote><p>Ever since God revealed himself Father to us, we must prove our ungratefulness to him if we did not in turn show ourselves his sons. Ever since Christ cleansed us with the washing of his blood, and imparted this cleansing through baptism, it would be unfitting to befoul ourselves with new pollutions. Ever since he engrafted us into his body, we must take especial care not to disfigure ourselves, who are his members, with any spot or blemish. Ever since Christ himself, who is our Head, ascended into heaven, it behooves us, having laid aside love of earthly things, wholeheartedly to aspire heavenward. Ever since the Holy Spirit dedicated us as temples to God, we must take care that God’s glory shine through us, and must not commit anything to defile ourselves with the filthiness of sin. Ever since both our souls and bodies were destined for heavenly incorruption and an unfading crown, we ought to strive manfully to keep them pure and uncorrupted until the Day of the Lord. These, I say, are the most auspicious foundations upon which to establish one’s life. One would look in vain for the like of these among the philosophers, who, in their commendation of virtue, never rise above the natural dignity of man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, [Battles Edition], III.vi.3.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8e7f2dc0ca" data-kw="temporal power">
<blockquote><p>Only one thing may be gathered—that princes as to spiritual matters are subjected to the spiritual power; not in like manner that they lose their political authority over ministers in temporal matters. (b) No better “are Christians distinguished here from priests, so that these things are addressed to them as Christians and not as priests.” Things to be joined together are absurdly separated; for if a priest is a Christian he ought always to be subject (although in the exercise of his office and as to spiritual matters he is free). Also, if the mark of baptism and of gospel liberty in Christ does not release from obedience to the king, much less does clerical character. For the liberty of the church is stated concerning faith and the soul before temporal matters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite></span></figcaption>

</figure><figure class="quote" id="q-66e59fb3f6" data-kw="">
<blockquote><p>Merit of Condignity removed, they clamor and vociferate until they are hoarse that all the glory of good works is obscured, the necessity of doing good is taken away, and a license for perpetrating every kind of wickedness is indulged to men. But what (in heaven&#x27;s name!) does this itch for lying mean? For we have so proved this to be a notable and transparent lie from the candid confessions of the Papists themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-morton.html">Thomas Morton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antidote against Merit of Condignity</cite>, p. 5</span></figcaption>

</figure><figure class="quote" id="q-53e918709b" data-kw="">

</figure><figure class="quote" id="q-8f475c5af3" data-kw="">
<blockquote><p>Moreover, sure reason persuades that no one (Christ excepted), however just and holy, can merit grace de condigno for others. For there exists no pact, no promise concerning the merit of another&#x27;s salvation; and Christ alone, as head of the whole Church, had that grace by which he might merit grace and glory for all the members. … But just as it is certain that one cannot merit grace for another ex condigno, so there is no doubt that this can be done ex congruo.</p></blockquote>

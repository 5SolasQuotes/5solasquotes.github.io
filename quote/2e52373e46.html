<main class="wrap"><figure class="quote" id="q-2e52373e46" data-kw="">
<blockquote><p>Come not into the company of idolatrous papists; dare not to live under the same roof with them, else you run into the devil&#x27;s mouth. John the divine would not be in the bath where Cerinthus the heretic was. 2. Go not into their chapels to see their crucifixes, or hear mass; as the looking on an harlot draws to adultery, so the looking on the popish gilded picture may draw to idolatry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, p. 100</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bf384d238d" data-kw="">
<blockquote><p>There, instead of the ministry of the word, prevails a perverted government, compounded of lies, a government which partly extinguishes, partly suppresses, the pure light. In place of the Lord&#x27;s Supper, the foulest sacrilege has entered, the worship of God is deformed by a varied mass of intolerable superstitions; doctrine (without which Christianity exists not) is wholly buried and exploded, the public assemblies are schools of idolatry and impiety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.2.2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“There, instead of the ministry of the word, prevails a perverted government, compounded of lies, a government which partly extinguishes, partly suppresses, the pure light. In place of the Lord&#x27;s Supper, the foulest sacrilege has entered, the worship of God is deformed by a varied mass of intolerable superstitions; doctrine (without which Christianity exists not) is wholly buried and exploded, the public assemblies are schools of idolatry and impiety.”

</figure><figure class="quote" id="q-70fbe0dd05" data-kw="">
<blockquote><p>The schools of the Sophists have taught with remarkable agreement that the sacraments of the new law (those now used in the Christian church) justify and confer grace, provided we do not set up a barrier of mortal sin. How deadly and pestilential this notion is cannot be expressed — and the more so because for many centuries it has been a current claim in a good part of the world, to the great loss of the church. Of a certainty it is diabolical. For in promising a righteousness apart from faith, it hurls souls headlong to destruction… Hence, any man is deceived who thinks anything more is conferred upon him through the sacraments than what is offered by God’s Word and received by him in true faith. From this something else follows: assurance of salvation does not depend upon participation in the sacrament, as if justification consisted in it. For we know that justification is lodged in Christ alone, and that it is communicated to us no less by the preaching of the gospel than by the seal of the sacrament, and without the latter can stand unimpaired.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.14.14</span></figcaption>

</figure><figure class="quote" id="q-d47c0917fd" data-kw="">
<blockquote><p>In the first place I say that the deity which the Papists worship, under that highest and most glorious name of God, is imaginary and fictitious. For it is agreed among all that the true God is supremely and perfectly just and merciful. But neither is that justice perfect which rests in human satisfactions, nor is that mercy perfect which only supplies what is lacking to the merits of men. Let the Papists go, then, and boast that they worship the true God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, ch. 7, art. 1</span></figcaption>

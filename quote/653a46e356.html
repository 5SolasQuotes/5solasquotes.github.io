<main class="wrap"><figure class="quote" id="q-653a46e356" data-kw="">
<blockquote><p>In their awareness and assurance of this election, God’s children daily find greater cause to humble themselves before God, to adore the fathomless depth of God’s mercies, to cleanse themselves, and to give fervent love in return to the One who first so greatly loved them. This is far from saying that this teaching concerning election, and reflection upon it, make God’s children lax in observing his commandments or carnally self-assured. By God’s just judgment this does usually happen to those who casually take for granted the grace of election or engage in idle and brazen talk about it but are unwilling to walk in the ways of the chosen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 13</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b096402687" data-kw="">
<blockquote><p>Let Christ, therefore, be our looking glass, in whom we may behold our predestination. We shall have a most evident and sure testimony that we are written in the book of life, if we communicate with Christ; and He is ours and we His by a true faith. Let this comfort us in the temptation touching predestination, than which there is none more dangerous: that the promises of God are general to the faithful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, 1566, ch. 10</span></figcaption>

</figure><figure class="quote" id="q-625f719715" data-kw="">
<blockquote><p>Those in whom a living faith in Christ, an assured confidence of soul, peace of conscience, an earnest endeavor after filial obedience, a glorying in God through Christ, is not as yet strongly felt, and who nevertheless make use of the means which God has appointed for working these graces in us, ought not to be alarmed at the mention of reprobation, nor to rank themselves among the reprobate, but diligently to persevere in the use of means, and with ardent desires devoutly and humbly to wait for a season of richer grace.</p></blockquote>

</figure><figure class="quote" id="q-462c6aef4c" data-kw="">
<blockquote><p>The doctrine of this high mystery of predestination is to be handled with special prudence and care, that men, attending the will of God revealed in his Word, and yielding obedience thereunto, may, from the certainty of their effectual vocation, be assured of their eternal election. So shall this doctrine afford matter of praise, reverence, and admiration of God; and of humility, diligence, and abundant consolation to all that sincerely obey the gospel.</p></blockquote>

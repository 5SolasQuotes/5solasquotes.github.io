<main class="wrap"><figure class="quote" id="q-1487086a61" data-kw="">
<blockquote><p>If the righteousness of Christ were truly imputed to us, so that through Him we should be accounted and reckoned just, just as if it were properly our own intrinsic and formal righteousness–we ought to be reckoned equally just as Christ Himself; and we ought to be called redeemers and saviors of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. by AI by Onku (1639-1642; 1668) | But we teach that Christ from the dignity of the suffering Person, merited far more by His death, than we could merit, even supposing, per impossible, that we had suffered all in so short a space which He suffered. Whence Bellarmine, bk. 2, On Justification, ch. 2, arg. 5:, ch. 9, On Universal Redemption, on 1 Pet. 2:24, pp. 259-60</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a906397c9a" data-kw="">
<blockquote><p>1. We begin with the most ancient father, Justin [Martyr]. He, in the book inscribed… an Exposition of the Faith, has these words: ‘The Son of God, as man, passed a life removed from all crime, and underwent a voluntary death; [Greek] that is, obliterating sin by a perfect and sinless conversation [conduct], and abolishing our debt by a debt that he owed not. Justin Martyr here plainly teaches, not only that the death and satisfaction of Christ are imputed to us for the blotting out of our punishment, but that his conversation itself, or active obedience, is imputed to us, for the obliteration of our sin.

2. Irenaeus, Against Heresies, bk. 5… in ch. 18: ‘The Lord has restored us to friendship by his incarnation, being made the Mediator between God and man; both propitiating the Father for us, against whom we had sinned, and making amends for our disobedience; bestowing moreover upon us that conversation [conduct] and obedience which is due to our Maker.’ …What else is this than the obedience of Christ both active and passive, made ours by imputation and bestowal?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Justification</cite>, …, vol. 1 trans. Josiah Allport (d. 1641; London: Hamilton, 1844/1846), ch. 29, p. 254</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-668dd45d16" data-kw="">
<blockquote><p>Q. What place has Christ’s righteousness here? Answer: [David] Pareus with some others distinguish between [1] the righteousness of Christ’s Person, which contains his essential righteousness as God, [2] the habitual and actual conformity of the man-Christ, and the perfect holiness of the man-Christ. Such a High Priest became us, as is holy, harmless, etc. Heb. 7:26. And [3] the righteousness of his merit, in the satisfaction of his suffering: the satisfaction is the formal cause of our justification, which is counted ours: this latter righteousness is acquired, the former is essential.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, (1655), pt. 2, ch. 1; p. 226</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-5a609e0188" data-kw="">
<blockquote><p>I have therefore found in your [Beza’s] published letters two, namely Epistles 35 and 45, in the former of which you touch briefly upon this controversy, but in the latter you discuss it more fully and at greater length. In Epistle 35, then, you say: ‘What is more absurd than to reckon that man just who has not fulfilled the Law?’ But I reply: the righteousness of the Gospel must be carefully distinguished from the righteousness of the Law. That righteousness by which we are accounted righteous by God, and therefore justified or absolved by Him, is not the righteousness of the Law; for God does not justify us on the ground that either we ourselves have fulfilled the Law, or that Christ has fulfilled it for us. Rather, it is the righteousness of the Gospel, that is, that which God bestows upon us through the Gospel—namely, the remission of sins obtained by the blood of Christ. Therefore we seek life from God not by the right of a fulfilled Law or of obedience rendered to the Law, but by the right of adoption, which Christ has procured for us by his death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Examen sententiae Domini Theodori Bezae, De justificatione Hominis coram Deo, quae habetur in annotatione ad Rom. 8</cite>, v. 2’ in Correspondance de Théodore de Bèze (1586), eds. Dufour, Genton &amp; Nicollier-de Weck, vol. 27, Travaux d’humanisme et Renaissance 401 (Geneva: Librairie Droz, 2005), p. 59, trans. ChatGPT-5 For a discussion of the import of the below, see Brink, The Transfer of Sin (Brill, 2024), pp. 219-20 ff.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“I have therefore found in your [Beza’s] published letters two, namely Epistles 35 and 45, in the former of which you touch briefly upon this controversy, but in the latter you discuss it more fully and at greater length. In Epistle 35, then, you say: ‘What is more absurd than to reckon that man just who has not fulfilled the Law?’ But I reply: the righteousness of the Gospel must be carefully distinguished from the righteousness of the Law. That righteousness by which we are accounted righteous by God, and therefore justified or absolved by Him, is not the righteousness of the Law; for God does not justify us on the ground that either we ourselves have fulfilled the Law, or that Christ has fulfilled it for us. Rather, it is the righteousness of the Gospel, that is, that which God bestows upon us through the Gospel—namely, the remission of sins obtained by the blood of Christ. Therefore we seek life from God not by the right of a fulfilled Law or of obedience rendered to the Law, but by the right of adoption, which Christ has procured for us by his death.”

</figure><figure class="quote" id="q-a56619ff23" data-kw="">
<blockquote><p>For 2. I add, it is by the satisfaction of Christ the Redeemer, wherein are contained both the matter and form of the justification of a sinner. The matter is Christ’s satisfaction, his obedience in his life, in his death; in fulfilling the law, and in suffering for our not fulfilling it; and the merit of all manifested in his resurrection and glorious ascension. The form is the imputing of that obedience whereby the righteousness of Christ does now become the believer’s as truly and really by imputation as it was Christ’s own in action.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-taylor.html">Thomas Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Titus</cite>, (Cambridge: Greene, 1612), on chapter 3, v. 7, p. 666 Taylor (1576-1632) was partially conforming English puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

<main class="wrap"><figure class="quote" id="q-88a1117ed6" data-kw="">
<blockquote><p>1. The distance between God and the creature is so great, that although reasonable creatures do owe obedience unto him as their Creator, yet they could never have any fruition of him as their blessedness and reward, but by some voluntary condescension on God’s part, which he hath been pleased to express by way of covenant.

2. The first covenant made with man was a covenant of works, wherein life was promised to Adam; and in him to his posterity, upon condition of perfect and personal obedience.

3. Man, by his fall, having made himself incapable of life by that covenant [of works], the Lord was pleased to make a second, commonly called the covenant of grace; wherein he freely offereth unto sinners life and salvation by Jesus Christ; requiring of them faith in him, that they may be saved, and promising to give unto all those that are ordained unto eternal life his Holy Spirit, to make them willing, and able to believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-confession-of-faith.html">Westminster Confession of Faith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 7.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1d4fed99d8" data-kw="">
<blockquote><p>Because what God so severely punished must have been no light sin but a detestable crime, we must consider what kind of sin there was in Adam’s desertion that enkindled God’s fearful vengeance against the whole of mankind. To regard Adam’s sin as gluttonous intemperance (a common notion) is childish. As if the sum and head of all virtues lay in abstaining solely from one fruit, when all sorts of desirable delights abounded everywhere; and not only abundance but also magnificent variety was at hand in that blessed fruitfulness of earth! We must, therefore, look deeper than sensual intemperance. The prohibition to touch the Tree of Knowledge of good and evil was a trial of obedience (obedientiae examen), that Adam, by observing it, might prove his willing submission to the command of God. …The promise, which gave him hope of eternal life as long as he should eat of the tree of life (arbore vitae), and, on the other hand, the fearful denunciation of death the moment he should taste of the Tree of Knowledge of good and evil, were meant to test and exercise his faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (1559), 2.1.4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

<blockquote><p>7. Lastly, In his person. Being a sinful man under the covenant of works, he is a cursed man; For it is written, “Cursed is every one that continueth not in all things which are written in the book of the law to do them.” The curse fixeth not only on what is his, but on himself; and it is for his sake that it is laid on other things. The curse, as you have heard, is on his soul, and on his body; for wherever sin is found under this covenant, there the curse also is And, (1.) The man is under the power of Satan, Acts 26:18. Into the hand of this enemy man fell, when he broke the covenant of works. Satan having waged war against heaven, set on man, heaven’s confederate, and gained the unhappy victory, gained him by temptation to renounce his allegiance to his rightful Lord by breaking the covenant, and so he fell under his power, as his captive taken in war, Isa. 49:24, was brought under bondage to this worst of masters, 2 Pet. 2:19, and is ruled by him at his pleasure, 2 Tim. 2 ult. The curse of the covenant falling on the covenant-breaker, he is thereby laid under condemnation, and adjudged to death according to the threatening; and so he falls under the power of him that has the power of death, that is the devil, Heb. 2:14. Every natural man is shut up as in a prison, in his natural state; and there he lies in bonds, Isa. 61:1. There are God’s bands on him, the bands of the curse binding him over to death; and the devil’s bands are on him, viz, the bands of strong lusts and corruptions, with which they are laden, as a malefactor in prison is laden with irons. And Satan has the power of gaoler over them. He keeps the keys of the prison, and narrowly watches the prisoners that none of them escape. They are not all kept alike close; but none of them can move beyond the bounds of his jurisdiction, more than the prisoner can get out of the dungeon. Even when the king’s word comes to deliver the elect, he will not yield them up; but the prison doors must be broke open, and they forcibly taken out of his hand by a stronger than he. (3.) The natural man being under the curse is continually in hazard of utter destruction, of having the copestone put on his misery, and being set beyond all possibility of help. If his eyes were opened he would see himself every moment in danger of dropping down into the pit of hell; Psalm 7:12, “If he turn not, he will whet his sword; he hath bent his bow, and made it ready.” The man is constantly standing before God’s bent bow, and has nothing to secure him one moment from the drawing of it. The sentence of death is passed against him, John 3:18, but there is no day intimated for the execution, but every day the dead warrant may be signed against him, and he led forth to death. His name may be “Magor-missabib,” a terror round about, Jer. 20:3. Whither can he look where he will not see his enemies ready to ruin him, on a word of command from that God under whose curse he lies? And what can he do for himself amidst his armed enemies? He is quite naked, Rev. 3:17, and cannot fight them; he is without strength, Rom. 5:6, and cannot wield armour, though he had it; he is bound hand and foot, Isa. 61:1, and cannot flee; and if he could, whither could he flee for safety? Heaven’s gates are shut upon him; in the utmost parts of the earth, or the most remote rock in the sea, God’s hand would find him out. Justice is pursuing the criminals under the curse, crying for vengeance on the traitors, and their foot shall certainly slide in due time; the law is continually throwing the fire-balls of its curses on them, and will at length set them on fire round about; death is on the pursuit after them, and has gained much ground of them already, and the cloud of wrath hangs over their heads continually in the curse, and the small rain of God’s wrath is still falling on them; how soon death may overtake them, they know not; and then the cloud breaks, and the great rain of his strength falls down upon them, and sweeps them away without hope for ever and ever.</p></blockquote>

<blockquote><p>In Adam’s sin there was the breach of the whole law in every commandment, either directly or by consequence, for he showed evident want of love to God in believing Satan more than God. Therein he chose Satan for his god; he worshipped Satan and took God’s name in vain; he showed also evident want of brotherly love, for hereby he became a murderer not only of himself, but of all his posterity. And thus do sins concur in every wicked action, in which regard it may be said with James that “he which faileth in one commandment is guilty of all” [2:10], which must admonish us to make conscience of every sin, for we cannot live in any one but we must needs run into many other.</p></blockquote>

<blockquote><p>1. I shall confirm this great truth, and evince the being of such a covenant. It is altogether denied by the Arminians that there was any such covenant, and amongst ourselves by Professor Simson, that it was a proper covenant. The weight of this matter lies here, that if the covenant made with Adam was not a proper covenant, he could not be a proper representing head; and if he was not, then there cannot be a proper imputation of Adam’s sin unto his posterity. None could ever dream, but there must be a manifest difference betwixt covenants between God and man, and those between men and men. There is no manner of equality betwixt God and man; God could require all duty of men without any covenant; yea, they have nothing but what is from him, and so owe it to him. But those things do not hinder, that, upon God’s condescending to enter into a covenant with man, there may be a proper covenant betwixt them. Though all similitudes here must halt; yet let us suppose a father to propose to his son, that if he will obey his orders, and especially in one point give him punctual obedience, for instance, labour his vineyard, he will give him a certain sum of money; and the son having nothing to labour it with, the father furnishes him with all things necessary thereto; the son accepts of this proposal. Can any man say that there is not a proper bargain, or covenant, in this case betwixt the father and his son, although the son was tied by the bond of nature to obey his father’s commands in all this antecedently to the bargain, and though he has nothing to labour it with, but what he has from the father? Let him perform his father’s orders now according to the covenant, and he can challenge the sum as a debt, which he could not do before. For proof this, consider, 1. Here is a concurrence of all that is necessary to constitute a true and proper covenant of works. The parties contracting, God and man; God requiring obedience as the condition of life; a penalty fixed in case of breaking; and man acquiescing in the proposal. The force of this cannot be evaded, by comparing it with the consent of subjects to the laws of an absolute prince. For such a law proposed by a prince, promising a reward upon obedience to it, is indeed the proposing of a covenant, the which the subject consenting to for himself and his, and taking on him to obey, does indeed enter into a covenant with the prince, and having obeyed the law may claim the reward by virtue of paction. And so the covenant of works is ordinarily in scripture called “the law,” being in its own nature a pactional law.

2. It is expressly called a covenant in scripture, Gal. 4:2, “For these are the two covenants, the one from the Mount Sinai,” &amp;c. This covenant from Mount Sinai was the covenant of works as being opposed to the covenant of grace, namely, the law of the ten commandments, with promise and sanction, as before expressed. At Sinai it was renewed indeed, but that was not its first appearance in the world. For there being but two ways of life to be found in scripture, one by works, the other by grace; the latter hath no place, but where the first is rendered ineffectual; therefore the covenant of works was before the covenant of grace in the world; yet the covenant of grace was promulgated quickly after Adam’s fall; therefore the covenant of works behoved to have been made with him before. And how can one imagine a covenant of works set before poor impotent sinners, if there had not been such a covenant with man in his state of integrity? Hos. 6:7, “But as for them; like Adam, they have transgressed the covenant.” Our translators set the word Adam on the margin. But in Job 31:33, they translate the very same word, “as Adam.” This word occurs but three times in scripture, and still in the same sense. Job 31:33, “If I covered my transgressions, as Adam,” Psalm 82:7, “But ye shall die like Adam.” Compare ver. 6, “I have said, Ye are gods; and all of you are children of the Most High;” compared with Luke 3:38, “Adam, which was the son of God.” And also here, Hos. 6:7. While Adam’s hiding his sin, and his death are made an example, how natural is it that his transgression, that led the way to all, be made so too? This is the proper and literal sense of the words; it is so read by several, and is certainly the meaning of it.

3. We find a law of works opposed to the law of faith, Rom. 3:27. “Where is boasting then? It is excluded. By what law? of works? Nay; but by the law of faith.” This law of works is the covenant of works, requiring works, or obedience, as the condition pleadable for life; for otherwise the law as a rule of life requires works too. Again, it is a law that does not exclude boasting, which is the very nature of the covenant of works, that makes the reward to be of debt. And further, the law of faith is the covenant of grace; therefore the law of works is the covenant of works. So Rom. 6:14, “Ye are not under the law, but under grace.” And this was the way of life without question, which was given to Adam at first.</p></blockquote>

<blockquote><p>Those who are strangers to prayer, their mercies are not mercies indeed to them. That threatening is fulfilled upon them, Malachi 2:2, “I will send a curse upon you, and I will curse your blessings.” Prayer will turn curses into blessing. Afflictions are part of the curse inflicted because of sin, but prayer alters the nature of them. For the sanctification of them being begged and granted, they work together for the good of them that feel them. Affliction yields “the peaceable fruits of righteousness to them that are exercised thereby,” says the Apostle.

On the other side, where prayer is not, blessings are a snare, and the good things which are received work together for the harm and ruin of those that do enjoy them. There is a spirit of slumber that has seized on them in the midst of their enjoyments. Their table, their plenty, their abundance becomes a snare “and a trap, and a stumbling block, and a recompense to them,” Romans 11:8, 9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-vincent.html">Nathanael Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spirit of Prayer</cite>, (1677) in Don Kistler (ed.), The Puritans on Prayer (Morgan PA: Soli Deo Gloria, 1995), pp 155-56.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

</figure><figure class="quote" id="q-d3d4d7bee7" data-kw="">
<blockquote><p>This is the first in a two-part series on Henry Bullinger and the issue of the conclusion to the Lord’s Prayer. Some have argued that denying the originality of the conclusion as is found in the Received Text/Majority Text or in the Authorised Version/New King James Version is tantamount to denying biblical inerrancy or the preservation of scripture. As we saw recently, Henry Bullinger clearly believed in the providential preservation of the biblical text. Nevertheless, he did not believe that the conclusion to the Lord’s Prayer was originally part of Matthew’s gospel. Ergo, one does not have to be a Received Text-ultraist to believe that God has preserved his word.

My own opinion is that the evidence seems to favour the view that the words ‘for thine is the kingdom, and the power, and the glory for ever’ (Matthew 6:13 Geneva Bible) belonged to the original text. However, it is important that people hear both sides of the argument and so I am allowing Bullinger’s position to be presented, even though I am not currently persuaded it is correct. In this post, we are simply highlighting what his position was. In the next post on this subject, we will give his reasons for holding this viewpoint. For now, we see that Bullinger did not believe that the conclusion was part of Matthew’s inspired account:

And because I have said, which all godly men also throughout the whole world confess, that a most perfect platform of praying is delivered unto us in the Lord’s Prayer by our Lord Jesus Christ himself; it remaineth, that we cite word for word that most holy form of praying, orderly made with most divine words even by the mouth of the Lord, as Matthew the apostle hath left it recorded unto us; and then to expound the same as briefly and plainly as may be, to the intent that every one may the better understand what he prayeth, and feel a more effectual working inwardly. Of that most heavenly prayer this is the form:

O our Father, which art in heaven; hallowed be thy name. Thy kingdom come. Thy will be done, as well in earth, as it is in heaven. Give us this day our daily bread. And forgive us our trespasses, as we forgive them that trespass against us. And lead us not into temptation but deliver us from evil. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), iv, 205-06.</span></figcaption>

</figure><figure class="quote" id="q-211659e0ea" data-kw="">
<blockquote><p>But what matters of deep moment are contained in the Lord’s prayer! How many and how great, briefly collected in the words, but spiritually abundant in virtue! so that there is absolutely nothing passed over that is not comprehended in these our prayers and petitions, as in a compendium of heavenly doctrine. “After this manner,” says He, “pray ye: Our Father, which art in heaven.” The new man, born again and restored to his God by His grace, says “Father,” in the first place because he has now begun to be a son. “He came,” He says, “to His own, and His own received Him not. But as many as received Him, to them gave He power to become the sons of God, even to them that believe in His name.”

The man, therefore, who has believed in His name, and has become God’s son, ought from this point to begin both to give thanks and to profess himself God’s son, by declaring that God is his Father in heaven; and also to bear witness, among the very first words of his new birth, that he has renounced an earthly and carnal father, and that he has begun to know as well as to have as a father Him only who is in heaven, as it is written: “They who say unto their father and their mother, I have not known thee, and who have not acknowledged their own children; these have observed Thy precepts and have kept Thy covenant.” Also the Lord in His Gospel has bidden us to call “no man our father upon earth, because there is to us one Father, who is in heaven.” And to the disciple who had made mention of his dead father, He replied, “Let the dead bury their dead;” for he had said that his father was dead, while the Father of believers is living.

… Nor ought we, beloved brethren, only to observe and understand that we should call Him Father who is in heaven; but we add to it, and say our Father, that is, the Father of those who believe—of those who, being sanctified by Him, and restored by the nativity of spiritual grace, have begun to be sons of God. A word this, moreover, which rebukes and condemns the Jews, who not only unbelievingly despised Christ, who had been announced to them by the prophets, and sent first to them, but also cruelly put Him to death; and these cannot now call God their Father, since the Lord confounds and confutes them, saying, “Ye are born of your father the devil, and the lusts of your father ye will do. For he was a murderer from the beginning, and abode not in the truth, because there is no truth in him.”

And by Isaiah the prophet God cries in wrath, “I have begotten and brought up children; but they have despised me. The ox knoweth his owner, and the ass his master’s crib; but Israel hath not known me, and my people hath not understood me. Ah sinful nation, a people laden with sins, a wicked seed, corrupt children! Ye have forsaken the Lord; ye have provoked the Holy One of Israel to anger.”

In repudiation of these, we Christians, when we pray, say Our Father; because He has begun to be ours, and has ceased to be the Father of the Jews, who have forsaken Him. Nor can a sinful people be a son; but the name of sons is attributed to those to whom remission of sins is granted, and to them immortality is promised anew, in the words of our Lord Himself: “Whosoever committeth sin is the servant of sin. And the servant abideth not in the house for ever, but the son abideth ever.”

… But how great is the Lord’s indulgence! how great His condescension and plenteousness of goodness towards us, seeing that He has wished us to pray in the sight of God in such a way as to call God Father, and to call ourselves sons of God, even as Christ is the Son of God,—a name which none of us would dare to venture on in prayer, unless He Himself had allowed us thus to pray! We ought then, beloved brethren, to remember and to know, that when we call God Father, we ought to act as God’s children; so that in the measure in which we find pleasure in considering God as a Father, He might also be able to find pleasure in us. Let us converse as temples of God, that it may be plain that God dwells in us.

Let not our doings be degenerate from the Spirit; so that we who have begun to be heavenly and spiritual, may consider and do nothing but spiritual and heavenly things; since the Lord God Himself has said, “Them that honour me I will honour; and he that despiseth me shall be despised.” The blessed apostle also has laid down in his epistle: “Ye are not your own; for ye are bought with a great price. Glorify and bear about God in your body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cyprian-of-carthage.html">Cyprian of Carthage</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on the Lord’s Prayer</cite>, (c. 252), 9-11 in Ante-Nicene Fathers, 5: 449-50.</span></figcaption>

… But how great is the Lord’s indulgence! how great His condescension and plenteousness of goodness towards us, seeing that He has wished us to pray in the sight of God in such a way as to call God Father, and to call ourselves sons of God, even as Christ is the Son of God,—a name which none of us would dare to venture on in prayer, unless He Himself had allowed us thus to pray! We ought then, beloved brethren, to remember and to know, that when we call God Father, we ought to act as God’s children; so that in the measure in which we find pleasure in considering God as a Father, He might also be able to find pleasure in us. Let us converse as temples of God, that it may be plain that God dwells in us.

Let not our doings be degenerate from the Spirit; so that we who have begun to be heavenly and spiritual, may consider and do nothing but spiritual and heavenly things; since the Lord God Himself has said, “Them that honour me I will honour; and he that despiseth me shall be despised.” The blessed apostle also has laid down in his epistle: “Ye are not your own; for ye are bought with a great price. Glorify and bear about God in your body.”

— Cyprian of Carthage, Treatise on the Lord’s Prayer, (c. 252), 9-11 in Ante-Nicene Fathers, 5: 449-50.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+what+matters+of+deep+moment+are+contained+in+the+Lord%E2%80%99s+prayer%21+How+many+and+how+great%2C+briefly+collected+in+the+words%2C+but+spiritually+abundant+in+virtue%21+so+that+there+is+absolutely+nothing+passed+over+that+is+not+comprehended+in+these+our+prayers+and+petitions%2C+as+in+a+compendium+of+heavenly+doctrine.+%E2%80%9CAfter+this+manner%2C%E2%80%9D+says+He%2C+%E2%80%9Cpray+ye%3A+Our+Father%2C+which+art+in+heaven.%E2%80%9D+The+new+man%2C+born+again+and+restored+to+his+God+by+His+grace%2C+says+%E2%80%9CFather%2C%E2%80%9D+in+the+first+place+because+he+has+now+begun+to+be+a+son.+%E2%80%9CHe+came%2C%E2%80%9D+He+says%2C+%E2%80%9Cto+His+own%2C+and+His+own+received+Him+not.+But+as+many+as+received+Him%2C+to+them+gave+He+power+to+become+the+sons+of+God%2C+even+to+them+that+believe+in+His+name.%E2%80%9D%0A%0AThe+man%2C+therefore%2C+who+has+believed+in+His+name%2C+and+has+become+God%E2%80%99s+son%2C+ought+from+this+point+to+begin+both+to+give+thanks+and+to+profess+himself+God%E2%80%99s+son%2C+by+declaring+that+God+is+his+Father+in+heaven%3B+and+also+to+bear+witness%2C+among+the+very+first+words+of+his+new+birth%2C+that+he+has+renounced+an+earthly+and+carnal+father%2C+and+that+he+has+begun+to+know+as+well+as+to+have+as+a+father+Him+only+who+is+in+heaven%2C+as+it+is+written%3A+%E2%80%9CThey+who+say+unto+their+father+and+their+mother%2C+I+have+not+known+thee%2C+and+who+have+not+acknowledged+their+own+children%3B+these+have+observed+Thy+precepts+and+have+kept+Thy+covenant.%E2%80%9D+Also+the+Lord+in+His+Gospel+has+bidden+us+to+call+%E2%80%9Cno+man+our+father+upon+earth%2C+because+there+is+to+us+one+Father%2C+who+is+in+heaven.%E2%80%9D+And+to+the+disciple+who+had+made+mention+of+his+dead+father%2C+He+replied%2C+%E2%80%9CLet+the+dead+bury+their+dead%3B%E2%80%9D+for+he+had+said+that+his+father+was+dead%2C+while+the+Father+of+believers+is+living.%0A%0A%E2%80%A6+Nor+ought+we%2C+beloved+brethren%2C+only+to+observe+and+understand+that+we+should+call+Him+Father+who+is+in+heaven%3B+but+we+add+to+it%2C+and+say+our+Father%2C+that+is%2C+the+Father+of+those+who+believe%E2%80%94of+those+who%2C+being+sanctified+by+Him%2C+and+restored+by+the+nativity+of+spiritual+grace%2C+have+begun+to+be+sons+of+God.+A+word+this%2C+moreover%2C+which+rebukes+and+condemns+the+Jews%2C+who+not+only+unbelievingly+despised+Christ%2C+who+had+been+announced+to+them+by+the+prophets%2C+and+sent+first+to+them%2C+but+also+cruelly+put+Him+to+death%3B+and+these+cannot+now+call+God+their+Father%2C+since+the+Lord+confounds+and+confutes+them%2C+saying%2C+%E2%80%9CYe+are+born+of+your+father+the+devil%2C+and+the+lusts+of+your+father+ye+will+do.+For+he+was+a+murderer+from+the+beginning%2C+and+abode+not+in+the+truth%2C+because+there+is+no+truth+in+him.%E2%80%9D%0A%0AAnd+by+Isaiah+the+prophet+God+cries+in+wrath%2C+%E2%80%9CI+have+begotten+and+brought+up+children%3B+but+they+have+despised+me.+The+ox+knoweth+his+owner%2C+and+the+ass+his+master%E2%80%99s+crib%3B+but+Israel+hath+not+known+me%2C+and+my+people+hath+not+understood+me.+Ah+sinful+nation%2C+a+people+laden+with+sins%2C+a+wicked+seed%2C+corrupt+children%21+Ye+have+forsaken+the+Lord%3B+ye+have+provoked+the+Holy+One+of+Israel+to+anger.%E2%80%9D%0A%0AIn+repudiation+of+these%2C+we+Christians%2C+when+we+pray%2C+say+Our+Father%3B+because+He+has+begun+to+be+ours%2C+and+has+ceased+to+be+the+Father+of+the+Jews%2C+who+have+forsaken+Him.+Nor+can+a+sinful+people+be+a+son%3B+but+the+name+of+sons+is+attributed+to+those+to+whom+remission+of+sins+is+granted%2C+and+to+them+immortality+is+promised+anew%2C+in+the+words+of+our+Lord+Himself%3A+%E2%80%9CWhosoever+committeth+sin+is+the+servant+of+sin.+And+the+servant+abideth+not+in+the+house+for+ever%2C+but+the+son+abideth+ever.%E2%80%9D%0A%0A%E2%80%A6+But+how+great+is+the+Lord%E2%80%99s+indulgence%21+how+great+His+condescension+and+plenteousness+of+goodness+towards+us%2C+seeing+that+He+has+wished+us+to+pray+in+the+sight+of+God+in+such+a+way+as+to+call+God+Father%2C+and+to+call+ourselves+sons+of+God%2C+even+as+Christ+is+the+Son+of+God%2C%E2%80%94a+name+which+none+of+us+would+dare+to+venture+on+in+prayer%2C+unless+He+Himself+had+allowed+us+thus+to+pray%21+We+ought+then%2C+beloved+brethren%2C+to+remember+and+to+know%2C+that+when+we+call+God+Father%2C+we+ought+to+act+as+God%E2%80%99s+children%3B+so+that+in+the+measure+in+which+we+find+pleasure+in+considering+God+as+a+Father%2C+He+might+also+be+able+to+find+pleasure+in+us.+Let+us+converse+as+temples+of+God%2C+that+it+may+be+plain+that+God+dwells+in+us.%0A%0ALet+not+our+doings+be+degenerate+from+the+Spirit%3B+so+that+we+who+have+begun+to+be+heavenly+and+spiritual%2C+may+consider+and+do+nothing+but+spiritual+and+heavenly+things%3B+since+the+Lord+God+Himself+has+said%2C+%E2%80%9CThem+that+honour+me+I+will+honour%3B+and+he+that+despiseth+me+shall+be+despised.%E2%80%9D+The+blessed+apostle+also+has+laid+down+in+his+epistle%3A+%E2%80%9CYe+are+not+your+own%3B+for+ye+are+bought+with+a+great+price.+Glorify+and+bear+about+God+in+your+body.%E2%80%9D%0A%0A%E2%80%94+Cyprian+of+Carthage%2C+Treatise+on+the+Lord%E2%80%99s+Prayer%2C+%28c.+252%29%2C+9-11+in+Ante-Nicene+Fathers%2C+5%3A+449-50.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F211659e0ea.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/211659e0ea.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/07/28/cyprian-of-carthage-on-calling-god-father-in-the-lords-prayer/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

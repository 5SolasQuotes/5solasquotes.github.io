<blockquote><p>6. They [civil magistrates] may, and ought to interpose their authority, for inhibiting the receiving and hearing, or conversing with known and manifest seducers: for, this is but to discharge, and thereby to preserve the people from running to their own hazard, even as men ought to be commanded to keep at distance with a place or person suspected to be infectious because of the pestilence; Neither could such a restraint be accounted any diminution of their just liberty, yea this were but a putting to of their sanction to the clear direction which the Lord lays upon His people, and therefore there could be no hazard to miscarry in it, especially where the application to such and such persons, might be as clearly discernable from the Word as the duty is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, ... (1659), Part 3, ch. 14, p. 252</span></figcaption>

<blockquote><p>…for they teach, that a man may publish that which by consequence destroys the faith of fundamentals, and so subvert the faith of others, which to do is a sin; but because the man follows the indictment [conviction] of his erroneous conscience, it is no sin to the man that so teaches; yea, he may innocently suffer persecution for his conscience, thus erroneous; yea, and die a martyr for it. Therefore, if the following of an erroneous conscience shall make a less sin to be no sin but innocency, it shall make a greater sin, to wit, killing of his son to his heavenly father [as an erroneous sacrifice, modeled off of Gen. 22], no sin, and so he may lawfully do it [though this is murder]. Nor will it suffice to say, to offer a man to God and kill him, is against the light of nature, and [in]vincibly a sin; what then? if the man believe he is commanded to kill him, his erroneous conscience must bind, as the offering of whole burnt offerings to God, to us is a sin, against the light of nature, in regard the law of nature can no more warrant it, than it can warrant Christ to offer up himself to God [Christ needed the positive command from his Father]. But upon the supposition of Libertines, its no murder; nor is it punishable at all, because the father may, yea, and lawfully, ought to worship God according to the indictment of his conscience, whither the conscience be right or bloody and erroneous, and yet he is not punishable for blood-shed, by their way for merely, and simply, without any malignancy or hatred to the child; he believes, he ought to prefer his Maker to his dearest child’s life as well as Abraham, and the conscience does naturally, and as under no Law, simply believe it is the like service, and worship that Abraham would have gratefully performed unto God, if God in reward of that love, had not forbidden him again to kill his Son. And this answer presupposes also, that it is impossible for a father to have such a conscience, as may stimulate, and command to kill his son, and that in the authority, and name of God, as he erroneously, yea, and as he invincibly holds, as Socinians, Familists, Papists, believe purgatory, merits, justification by works, who yet are not to be punished for their conscience, according to Libertines. Again, there is no intrinsic malignancy [in intention] in the act of naticide, or son-sacrificing, but what it has from the Lord’s Law forbidding to kill, now those that killed their sons to Molech, yea, to God, as they thought, strongly, yea, invincibly believed God commanded them, to do Him such bodily service, as is clear from Jer. 7:31; 15:5. And that this is invincible ignorance (I take the word invincible in the Libertines’ sense) Libertines grant, for in our condemning son-sacrificing, they will say we are not infallible. Yea, the understanding, being spiritual, cannot be restrained, says Dr. [Jeremy] Taylor, sect. 13, n. 6, and no man can change his opinion when he will, says he, ibid., n. 7, and so should not be punished for it, and n. 13, there is nothing under God Almighty that has power over the soul of man, so as to command a persuasion. If he be then persuaded, that he ought to kill his son, he ought unpunishably so to do.</p></blockquote>

<blockquote><p>53. The object of ecclesiastical power is not the same with the object of the civil power, but much differing from it; for the ecclesiastical power does determine and appoint nothing concerning men’s bodies, goods, dignities, civil rights, but is employed only about the inward man, or the soul, not that it can search the hearts, or judge of the secrets of the conscience, which is in the Power of God alone: Yet notwithstanding it has for its proper object those externals which are purely spiritual, and do belong properly and most nearly to the spiritual good of the soul; Which also are termed [in Greek] the inward things of the Church.

54. Those things then wherein the ecclesiastical power is exercised, are the Preaching of the Word, the Administration of Sacraments, public Prayer and Thanksgiving, the Catechising and instructing of children and ignorant persons, the examination of those who are to come to the holy Communion, the Ecclesiastical Discipline, the Ordination of Ministers, and the abdication, deposing, and degrading of them (if they become like unsavory salt), the deciding and determining of controversies of Faith and cases of Conscience, Canonical constitutions concerning the treasury of the Church and collections of the faithful, as also concerning ecclesiastical rites, or indifferent things, which pertain to the keeping of decency and order in the Church, according to the general rules of Christian love and prudence contained in the Word of God. … 79. Seeing then there are so many and so great differences of both offices [of the Church and the magistrate], and seeing also that the function of ministers and elders of the Church is not at all contained in the office of the magistrate; neither on the other part, this is comprehended within that; magistrates shall no less sin in usurping ecclesiastical power, ministering holy things, ordaining ministers, or exercising discipline ecclesiastical, than ministers should sin in rushing into the borders of the magistrate, and in thrusting themselves into his calling. 81. So then the Word of God and the Law of Christ which by so evident difference separates and distinguishes ecclesiastical government from the civil, forbids the Christian magistrate to enter upon or usurp the ministry of the Word and sacraments,, or the juridical dispensing of the keys of the Kingdom of Heaven, to invade the Church-Government, or to challenge to himself the right of both swords, spiritual and corporal; But if any magistrate (which God forbid) should dare to arrogate to himself so much, and to enlarge his skirts so far, the Church shall then straightway be constrained to complain justly, and cry out, that though the Pope is changed, yet Popedom remains still.</p></blockquote>

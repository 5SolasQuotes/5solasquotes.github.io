<blockquote><p>…1. As to doctrinal legalists, we might bewail and refute the legal schemes that take place in the world. I name these two:

1. The Popish Scheme, denying the imputation of Christ’s righteousness. The imputed righteousness of Christ is blasphemed by the church of Rome. They call it an affectitious, imaginary air, a putative righteousness contrary to the very strain of our Apostle in his epistles. They talk of a twofold justification: Their first justification is that whereby an unjustified man becomes justified, or a wicked man becomes godly; where they confound justification and sanctification. The second is that, whereby a man already righteous, becomes more and more righteous, more and more holy. We know no justification, but one justification by faith, in the day of closing with Christ, laying hold upon the blood of Christ whom God has set forth to be the propitiation, etc. It is a complete righteousness, we have it all at once; and it is not within us, but without us: it is in Christ inherently and in us imputatively. They tell us, that we are not justified by the works of the ceremonial law, but by the works of the moral law. They tell us that we are not justified by perfect obedience, but by imperfect; and by an acceptation. It is looked on by God as perfect and in a word, they tell us that we are justified not meritoriously and simply, by works done in our own strength, but by works acted and done by the strength and assistance of the Spirit of God. There is the Popish Scheme.

2. The Baxterian Scheme is also opposite to this gospel doctrine. They tell us that God has made a new law with mankind and obedience to that new law and to its commands is our righteousness. And this obedience gives us title to heaven and gives us a title to Christ’s blood, and to pardon and the act of faith is our righteousness, not as it accepts of Christ righteousness, but as it is an obedience to that new Law. The very act and work of faith is, according to them, the righteousness itself. And this faith takes in all kinds of works, namely repentance, love, obedience, and ten or twelve duties of that sort. And all these together are our righteousness for justification. Really (as one lays upon this very head) if the apostle Paul were alive, he would excommunicate such ministers.</p></blockquote>

<blockquote><p>This is why the Bible teaches that faith alone in Christ alone is the only way to salvation from sin. Faith is the anti-work. It’s the realization that there is nothing you can do but trust in what has been done for you in the life, death, and resurrection of Jesus. Faith is the realization that God’s pleasure in you will never be based upon your performance for Him. Instead, God’s pleasure in you will always be based upon Christ’s performance for you.</p></blockquote>

<blockquote><p>Thesis 10. And it also follows from this that the word ‘to be justified’ in this argument in no way should be thus understood as if that righteousness of Christ were infused into us. Rather, it is thus declared that, having seized Christ Himself together with His righteousness by faith, we are absolved from all our sins and death, and through the one same Christ Himself we are declared worthy of eternal life in the one same Christ. But one also speaks of a wider meaning of the term ‘righteousness’, as about that most perfect, which is subjectively in Christ alone according to the flesh and which alone, imputed to us by faith, pacifies our consciences before the tribunal of God. This concerning holiness within us is applied and inchoate in another gift of God. Thus, if ‘justification’ is taken as the free application of the latter rather than the former benefit, Christ having been seized by faith, we do not deny that the term ‘justification’ is comprehended as much as that benefit of that imputed and most perfect righteousness as the benefit of sanctification inchoate in us is. Yet we say that careful and painstaking care must be applied in order that one may not be confounded with the other and that we may know that the part first in order pleases and is accepted by God on account of Christ and in Christ alone is seized by faith, and that second gift of regeneration follows later.</p></blockquote>

<blockquote><p>1. That intrinsic or passive justification is viewed in a twofold manner: either as without sense, or as with sense. In the latter manner it is viewed in adults already actually and in the second act converted. In the former manner, both in regenerate infants departing in the state of grace and in adults constituted in the first moment of conversion—where, with the habit of faith impressed, immediately a relative change of state and with it passive or intrinsic justification must be thought to be present: Not otherwise than dominion over creatures was present to the image of God in the first moment of creation, or rather flowed from it by natural resultance or necessary connection, and followed upon it. Or as a firstborn son of a king has and receives in his person such and such a principality, although in the first moment of birth he does not sense this nor actually rejoice in it.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“1. That intrinsic or passive justification is viewed in a twofold manner: either as without sense, or as with sense. In the latter manner it is viewed in adults already actually and in the second act converted. In the former manner, both in regenerate infants departing in the state of grace and in adults constituted in the first moment of conversion—where, with the habit of faith impressed, immediately a relative change of state and with it passive or intrinsic justification must be thought to be present: Not otherwise than dominion over creatures was present to the image of God in the first moment of creation, or rather flowed from it by natural resultance or necessary connection, and followed upon it. Or as a firstborn son of a king has and receives in his person such and such a principality, although in the first moment of birth he does not sense this nor actually rejoice in it.”

— Gisbertus Voetius, Disputation 30, ‘On Regeneration’, pt. 2 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 447 ff. Latin at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+That+intrinsic+or+passive+justification+is+viewed+in+a+twofold+manner%3A+either+as+without+sense%2C+or+as+with+sense.+In+the+latter+manner+it+is+viewed+in+adults+already+actually+and+in+the+second+act+converted.+In+the+former+manner%2C+both+in+regenerate+infants+departing+in+the+state+of+grace+and+in+adults+constituted+in+the+first+moment+of+conversion%E2%80%94where%2C+with+the+habit+of+faith+impressed%2C+immediately+a+relative+change+of+state+and+with+it+passive+or+intrinsic+justification+must+be+thought+to+be+present%3A+Not+otherwise+than+dominion+over+creatures+was+present+to+the+image+of+God+in+the+first+moment+of+creation%2C+or+rather+flowed+from+it+by+natural+resultance+or+necessary+connection%2C+and+followed+upon+it.+Or+as+a+firstborn+son+of+a+king+has+and+receives+in+his+person+such+and+such+a+principality%2C+although+in+the+first+moment+of+birth+he+does+not+sense+this+nor+actually+rejoice+in+it.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Disputation+30%2C+%E2%80%98On+Regeneration%E2%80%99%2C+pt.+2+%281639%29+tr.+AI+by+Roman+Prestarri+in+Select+Theological+Disputations+%281655%29%2C+vol.+2%2C+p.+447+ff.+Latin+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F24e9ebff42.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/24e9ebff42.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/faith-as-a-condition-instrument-of-justification/#:~:text=1.%20That%20intrinsic%20or%20passive%20justification,this%20nor%20actually%20rejoice%20in%20it&amp;text=1.%20That%20intrinsic%20or%20passive%20justification%20is%20viewed&amp;text=not%20sense%20this%20nor%20actually%20rejoice%20in%20it" rel="n

<main class="wrap"><figure class="quote" id="q-55ccea1306" data-kw="">
<blockquote><p>They [the ministers of the established Church of Scotland] are not free by the conditions, as now fixed, of their Establishment, to declare the whole counsel of God. The Scripture doctrine of the Headship of Christ, and his Kingly relation to his Church, they are not at liberty to maintain and act upon.

I say the Scripture doctrine on these points. The Scripture view of Christ’s Headship embraces the principle that every Church of Christ should be governed, not by civil but by spiritual rulers—and not according to Acts of Parliament, but according to Christ’s own laws, as ascertained from the Bible. No man holds the doctrine of Christ’s Headship in its truth and fulness, who does not hold this principle; and it is a betrayal of the Headship, when the principle is not carried into practical operation. …

The Bible is Christ’s code of laws, by which every Church is bouned exclusively to walk. To a certain extent, at least, they [the Intrustionists] lay aside the Bible, and put in its place the enactments of the Magistrate. In so far as they so do, they take the crown of Christ, and put it on Caesar’s brow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-gray.html">Andrew Gray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Persecution. The Lairds, the Lawyers, and the Moderate Clergy, against the Free Church of Scotland: Being the Substance of a Speech Delivered before the Free Presbytery of Perth, on Wednesday, 30th August, 1843</cite>, (Perth: W. Belford, 1843), pp 2, 3.</span></figcaption>

<blockquote><p>And shall we now set up a Church-tyranny, the mere will and abitriment, yea, the unjust sentences of Church-judicatories for laws, and require absolute submission thereunto, not only of private and single persons, but of all inferior judicatories, not allowing the congregational-eldership once to whisper against what is resolved by the presbytery, or the presbytery against what is resolved by the synod, or the synod against what is resolved by the General Assembly. If then the superior judicatories will tyrannize, what remedy is there? or if they become corrupt, how shall the ruin of religion, or the persecution and oppression of these who desire to keep faith and a good conscience, be avoided? Have the Ministers and saints and courts of Jesus Christ received religion and His ordinances upon these terms, that if a superior Court will have it so, they shall all crouch down as asses under the burden, and let them, without gainsaying (they being now cudgeled into silence by a sentence of suspension from the sacrament, or deposition or excommunication) ruin Church, and Ministers, and ordinances, and professors, and all the precious interests of Jesus Christ; And shall we say that such a submission is required in this case, as though they ought to do nothing but weep and pray in secret? How great tyranny is this, and how remedy-less a way to ruin?</p></blockquote>

<blockquote><p>Question: How is an ecclesiastical covenant necessary? Answer: Conclusion 1. It is not necessary as a means to eternal salvation, since explicit communion with a particular visible Church is not necessary. Conclusion 2. It is necessary as a means to external communion with the visible Church, some covenant partly implicit and tacit, partly explicit and vocal. Conclusion 3. It is necessary for well-being, that is, it facilitates legitimate ecclesiastical communion and mutual edification, so that at least such explicit profession and covenant is maintained, which we have mentioned above is well or at least moderately maintained in properly ordered Churches. Conclusion 4. Yet we do not consider our own form, let alone the more exact and laborious one which is urged today by some (into whose requirements we inquired a little earlier), to be so absolutely necessary that without it Churches which are thus far without it would not in any way be Churches to us; nor would there be members, nor consequently would all those Churches be destroyed, as to their matter or body, as to their species and form; or if this is not done, then from outside (if not against them), from some withdrawing members, and others from other places joining their number, new and separate Churches should be erected in the same city or village. The reasons are:

1. Because that external form of profession of faith, promise, and admission into Church communion is fundamentally divine; but in its final formality and perfection it is ecclesiastical, for it is an application to particular circumstances of persons, places, times, and that through intervening free deliberations and ecclesiastical constitutions, which can be changed or remitted in cases of necessity.

2. Because with such canonical formalities, though lawful, indeed excellently conducted, the essence of the Church should not be so strictly alleged, and in it and through it the essence of the communion of saints;

3. Because with the canonical formalities of the Papacy rejected, indeed of the ancient Church itself (as prescribed by the Code of Canons of the Universal Church) in great part and even largely restored by established freedom and apostolic simplicity, we should not contend through ambiguities for the same or similar precipitations, and impose the yoke of new ecclesiastical authority and ecclesiastical constitutions so rigidly that we seem to leave nothing to the judgment and freedom of other Churches, not even in matters of detail.

4. For what appears to follow from this is absurd and inconvenient, namely, that it should be necessary to immediately withdraw from those Churches to which the external form of this covenant and its most integral integrity are not present. I do not see how this would not amount to rejecting Donationism and dividing Churches into the smallest parts, indeed into dust, after the manner of the Anabaptists (although today much has been lacking and improved among them). Conclusion 5. Nevertheless, whoever is in conscience bound by the necessity of divine precept to seek and promote the most perfect and exact things in this matter, according to Phil. 3:15, Heb. 6:1, and 2 Cor. 11:2-3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, tr. by AI (Amsterdam: Joannes à Waesberge, 1663–1676), vol. 1, ‘The Nature of the Instituted Church’, pp. 64-68 (PDF p. 70)</span></figcaption>

— Gisbertus Voetius, Ecclesiastical Politics, tr. by AI (Amsterdam: Joannes à Waesberge, 1663–1676), vol. 1, ‘The Nature of the Instituted Church’, pp. 64-68 (PDF p. 70)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQuestion%3A+How+is+an+ecclesiastical+covenant+necessary%3F+Answer%3A+Conclusion+1.+It+is+not+necessary+as+a+means+to+eternal+salvation%2C+since+explicit+communion+with+a+particular+visible+Church+is+not+necessary.+Conclusion+2.+It+is+necessary+as+a+means+to+external+communion+with+the+visible+Church%2C+some+covenant+partly+implicit+and+tacit%2C+partly+explicit+and+vocal.+Conclusion+3.+It+is+necessary+for+well-being%2C+that+is%2C+it+facilitates+legitimate+ecclesiastical+communion+and+mutual+edification%2C+so+that+at+least+such+explicit+profession+and+covenant+is+maintained%2C+which+we+have+mentioned+above+is+well+or+at+least+moderately+maintained+in+properly+ordered+Churches.+Conclusion+4.+Yet+we+do+not+consider+our+own+form%2C+let+alone+the+more+exact+and+laborious+one+which+is+urged+today+by+some+%28into+whose+requirements+we+inquired+a+little+earlier%29%2C+to+be+so+absolutely+necessary+that+without+it+Churches+which+are+thus+far+without+it+would+not+in+any+way+be+Churches+to+us%3B+nor+would+there+be+members%2C+nor+consequently+would+all+those+Churches+be+destroyed%2C+as+to+their+matter+or+body%2C+as+to+their+species+and+form%3B+or+if+this+is+not+done%2C+then+from+outside+%28if+not+against+them%29%2C+from+some+withdrawing+members%2C+and+others+from+other+places+joining+their+number%2C+new+and+separate+Churches+should+be+erected+in+the+same+city+or+village.+The+reasons+are%3A+1.+Because+that+external+form+of+profession+of+faith%2C+promise%2C+and+admission+into+Church+communion+is+fundamentally+divine%3B+but+in+its+final+formality+and+perfection+it+is+ecclesiastical%2C+for+it+is+an+application+to+particular+circumstances+of+persons%2C+places%2C+times%2C+and+that+through+intervening+free+deliberations+and+ecclesiastical+constitutions%2C+which+can+be+changed+or+remitted+in+cases+of+necessity.+2.+Because+with+such+canonical+formalities%2C+though+lawful%2C+indeed+excellently+conducted%2C+the+essence+of+the+Church+should+not+be+so+strictly+alleged%2C+and+in+it+and+through+it+the+essence+of+the+communion+of+saints%3B+3.+Because+with+the+canonical+formalities+of+the+Papacy+rejected%2C+indeed+of+the+ancient+Church+itself+%28as+prescribed+by+the+Code+of+Canons+of+the+Universal+Church%29+in+great+part+and+even+largely+restored+by+established+freedom+and+apostolic+simplicity%2C+we+should+not+contend+through+ambiguities+for+the+same+or+similar+precipitations%2C+and+impose+the+yoke+of+new+ecclesiastical+authority+and+ecclesiastical+constitutions+so+rigidly+that+we+seem+to+leave+nothing+to+the+judgment+and+freedom+of+other+Churches%2C+not+even+in+matters+of+detail.+4.+For+what+appears+to+follow+from+this+is+absurd+and+inconvenient%2C+namely%2C+that+it+should+be+necessary+to+immediately+withdraw+from+those+Churches+to+which+the+external+form+of+this+covenant+and+its+most+integral+integrity+are+not+present.+I+do+not+see+how+this+would+not+amount+to+rejecting+Donationism+and+dividing+Churches+into+the+smallest+parts%2C+indeed+into+dust%2C+after+the+manner+of+the+Anabaptists+%28although+today+much+has+been+lacking+and+improved+among+them%29.+Conclusion+5.+Nevertheless%2C+whoever+is+in+conscience+bound+by+the+necessity+of+divine+precept+to+seek+and+promote+the+most+perfect+and+exact+things+in+this+matter%2C+according+to+Phil.+3%3A15%2C+Heb.+6%3A1%2C+and+2+Cor.+11%3A2-3.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Ecclesiastical+Politics%2C+tr.+by+AI+%28Amsterdam%3A+Joannes+%C3%A0+Waesberge%2C+1663%E2%80%931676%29%2C+vol.+1%2C+%E2%80%98The+Nature+of+the+Instituted+Church%E2%80%99%2C+pp.+64-68+%28PDF+p.+70%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fadde82de61.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/adde82de61.html">Permalink</a><a cl

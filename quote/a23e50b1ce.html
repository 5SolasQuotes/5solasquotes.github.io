<main class="wrap"><figure class="quote" id="q-a23e50b1ce" data-kw="">
<blockquote><p>As a Divine, he [Thomas Hill] was sound in the Faith, Orthodox in his Judgment, firmly adhering to the good old doctrine of the Church of England; that which in this our University our famous Whitaker, Perkins, Davenant, Ward, and others maintained in their times: and in the other University among other great Names there, he was a very great Admirer of the right Reverend and Judicious Dr. Robert Abbot, Bishop of Salisbury, and I wish he had here many more such Admirers.

The Doctrines of God’s Sovereignty in his decrees, of his inconditionate [unconditional] most free electing love, of his free grace against free will and the power of nature in spirituals; of justification by the imputed righteousness of Christ, against the perfection of inherent righteousness now attainable by us in his life; of perseverance in grace against the Apostacy of the Saints, and the like.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-tuckney.html">Anthony Tuckney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thanatoktasia. Or,</cite>, Death Disarmed: And the Grave Swallowed up in Victory. A Sermon Preached at St Mary’s in Cambridge, Decem. 22. 1652. At the Publick Funerals of Dr. Hill, Late Master of Trinity Colledge in that University (London: J. Rothwell, 1654), pp 56-57.</span></figcaption>

ad it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-faea7a1ed4" data-kw="">
<blockquote><p>Seeing we have affirmed that we attain a twofold righteousness by faith: [1] a righteousness inherent in us, as charity and that grace whereby we are made partakers of the divine nature, and [2] the justice of Christ given and imputed unto us, as being grafted into Christ and having put on Christ: it remains that we enquire upon which of these we must stay and rely, and by which we must think ourselves justified before God, that is, to be accepted as holy and just, having that justice which it beseems the sons of God to have. I truly think, that a man very piously and Christianly may say that we ought to stay, to stay I say, as upon a firm and stable thing, able undoubtedly to sustain us, upon the justice of Christ given and imputed to us, and not upon the holiness and grace that is inherent in us. For this our righteousness is but imperfect, and such as cannot defend us, seeing in many things we offend all, etc. But the justice of Christ which is given unto us, is true and perfect justice, which altogether pleases the eyes of God, and in which there is nothing that offends God. Upon this therefore as most certain and stable, we must stay ourselves, and believe that we are justified by it, as the cause of our acceptation with God: this is that precious treasure of Christians which whosoever finds, sells all that he has to buy it.</p></blockquote>

</figure><figure class="quote" id="q-e4fedbc9a0" data-kw="">
<blockquote><p>It will be said by such a believer that my change of view was too rationalistic, too cerebral, too bloodless, too focused on a theoretical knowledge of the God of the philosophers rather than a personal response to the God of Abraham, Isaac, and Jacob. But the dichotomy is a false one, and the implied conception of the relationship between faith and reason not only foolish but heterodox. As to the heterodoxy and foolishness of fideism, and the correct understanding of the relationship of faith and reason, I have addressed that set of issues elsewhere. As to the ‘heart versus head’ stuff, it seems to me to rest on an erroneous bifurcation of human nature. Man is a unity, his rationality and animality, intellect and passions, theoretical and moral lives all ultimately oriented toward the same end… …that does not mean that the will does not have a role to play. But that is true wherever reason leads us to a conclusion we might not like, not merely in matters of religion. And once you have allowed yourself to see the truth that reason leads you to, what reason apprehends is (given the convertibility of the transcendentals) as good and beautiful as it is real. If you find yourself intellectually convinced that there is a divine Uncaused Cause who sustains the world and you in being at every instant, and don’t find this conclusion extremely strange and moving, something that leads you to a kind of reverence, then I dare say you haven’t understood it. Of course, there are those whose heads and hearts are so out of sync that they cannot follow both at the same time. But we shouldn’t mistake this pathology for an insight into human nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, (South Bend, IN: St. Augustine’s Press, 2015), ch. 9, ‘The Road from Atheism’, pp. 213-14</span></figcaption>

<blockquote><p>The whole dispute is as to The Cause of Justification. The Fathers of Trent pretend that it is twofold, as if we were justified partly by forgiveness of sins and partly by spiritual regeneration; or, to express their view in other words, as if our righteousness were composed partly of imputation, partly of quality. I maintain that it is one, and simple, and is wholly included in the gratuitous acceptance of God. I besides hold that it is without us, because we are righteous in Christ only.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to the Sixth Session, on the decree (ch. 7, the causes of justification)</span></figcaption>

</figure><figure class="quote" id="q-4ecba57287" data-kw="">
<blockquote><p>What are the different opinions as to the relation between faith and love? 1st. The Romanists, in order to maintain their doctrine that faith alone is not saving, distinguish between a formed, or perfect, and an unformed faith. They acknowledge that faith is distinct from love, but maintain that love is essential to render faith meritorious and effectual as the instrument of our salvation. 2d. Some have regarded love as the root out of which faith springs. 3d. The true view is that love is the immediate and necessary effect of faith. Faith includes the spiritual apprehension of the beauty and excellence of the truth, and an act of the will embracing it and relying upon it. Yet these graces can not be analytically separated, since they mutually involve one another. There can be no love without faith, nor any faith without love. Faith apprehends the loveliness of the object, the heart spontaneously loves it. Thus “faith works by love,” since these affections are the source of those motives that control the will. The Romish doctrine is inconsistent with the essential principles of the gospel. Faith is not a work, nor can it have, when formed or unformed, any merit, it is essentially a self-emptying act, which saves by laying hold of the merits of Christ. It leads to works, and proves itself by its fruits, but in its relation to justification it is in its very nature a strong protest against the merits of all human works, Gal. 3:10, 11; Eph. 2:8, 9. The Protestant doctrine that love is the fruit of faith is established by what the Scriptures declare concerning faith, that it “sanctifies,” “works by love,” “overcomes the world,” Gal. 5:6; Acts 26:18; 1 John 5:4. This is accomplished thus—by faith we are united to Christ, Eph. 3:17, and so become partakers of his Spirit, 1 John 3:24, one of the fruits of the Spirit is love, Gal. 5:22, and love is the principle of all obedience, Rom. 13:10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology</cite>, (New York: Robert Carter &amp; Brothers, 1863), 362–63 (emphasis added)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“What are the different opinions as to the relation between faith and love? 1st. The Romanists, in order to maintain their doctrine that faith alone is not saving, distinguish between a formed, or perfect, and an unformed faith. They acknowledge that faith is distinct from love, but maintain that love is essential to render faith meritorious and effectual as the instrument of our salvation. 2d. Some have regarded love as the root out of which faith springs. 3d. The true view is that love is the immediate and necessary effect of faith. Faith includes the spiritual apprehension of the beauty and excellence of the truth, and an act of the will embracing it and relying upon it. Yet these graces can not be analytically separated, since they mutually involve one another. There can be no love without faith, nor any faith without love. Faith apprehends the loveliness of the object, the heart spontaneously loves it. Thus “faith works by love,” since these affections are the source of those motives that control the will. The Romish doctrine is inconsistent with the essential principles of the gospel. Faith is not a work, nor can it have, when formed or unformed, any merit, it is essentially a self-emptying act, which saves by laying hold of the merits of Christ. It leads to works, and proves itself by its fruits, but in its relation to justification it is in its very nature a strong protest against the merits of all human works, Gal. 3:10, 11; Eph. 2:8, 9. The Protestant doctrine that love is the fruit of faith is established by what the Scriptures declare concerning faith, that it “sanctifies,” “works by love,” “overcomes the world,” Gal. 5:6; Acts 26:18; 1 John 5:4. This is accomplished thus—by faith we are united to Christ, Eph. 3:17, and so become partakers of his Spirit, 1 John 3:24, one of the fruits of the Spirit is love, Gal. 5:22, and love is the principle of all obedience, Rom. 13:10.”

— A. A. Hodge, Outlines of Theology, (New York: Robert Carter &amp; Brothers, 1863), 362–63 (emphasis added)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+are+the+different+opinions+as+to+the+relation+between+faith+and+love%3F+1st.+The+Romanists%2C+in+order+to+maintain+their+doctrine+that+faith+alone+is+not+saving%2C+distinguish+between+a+formed%2C+or+perfect%2C+and+an+unformed+faith.+They+acknowledge+that+faith+is+distinct+from+love%2C+but+maintain+that+love+is+essential+to+render+faith+meritorious+and+effectual+as+the+instrument+of+our+salvation.+2d.+Some+have+regarded+love+as+the+root+out+of+which+faith+springs.+3d.+The+true+view+is+that+love+is+the+immediate+and+necessary+effect+of+faith.+Faith+includes+the+spiritual+apprehension+of+the+beauty+and+excellence+of+the+truth%2C+and+an+act+of+the+will+embracing+it+and+relying+upon+it.+Yet+these+graces+can+not+be+analytically+separated%2C+since+they+mutually+involve+one+another.+There+can+be+no+love+without+faith%2C+nor+any+faith+without+love.+Faith+apprehends+the+loveliness+of+the+object%2C+the+heart+spontaneously+loves+it.+Thus+%E2%80%9Cfaith+works+by+love%2C%E2%80%9D+since+these+affections+are+the+source+of+those+motives+that+control+the+will.+The+Romish+doctrine+is+inconsistent+with+the+essential+principles+of+the+gospel.+Faith+is+not+a+work%2C+nor+can+it+have%2C+when+formed+or+unformed%2C+any+merit%2C+it+is+essentially+a+self-emptying+act%2C+which+saves+by+laying+hold+of+the+merits+of+Christ.+It+leads+to+works%2C+and+proves+itself+by+its+fruits%2C+but+in+its+relation+to+justification+it+is+in+its+very+nature+a+strong+protest+against+the+merits+of+all+human+works%2C+Gal.+3%3A10%2C+11%3B+Eph.+2%3A8%2C+9.+The+Protestant+doctrine+that+love+is+the+fruit+of+faith+is+established+by+what+the+Scriptures+declare+concerning+faith%2C+that+it+%E2%80%9Csanctifies%2C%E2%80%9D+%E2%80%9Cworks+by+love%2C%E2%80%9D+%E2%80%9Covercomes+the+world%2C%E2%80%9D+Gal.+5%3A6%3B+Acts+26%3A18%3B+1+John+5%3A4.+This+is+accomplished+thus%E2%80%94by+faith+we+are+united+to+Christ%2C+Eph.+3%3A17%2C+and+so+become+partakers+of+his+Spirit%2C+1+John+3%3A24%2C+one+of+the+fruits+of+the+Spirit+is+love%2C+Gal.+5%3A22%2C+and+love+is+the+principle+of+all+obedience%2C+Rom.+13%3A10.%E2%80%9D%0A%0A%E2%80%94+A.+A.+Hodge%2C+Outlines+of+Theology%2C+%28New+York%3A+Robert+Carter+%26+Brothers%2C+1863%29%2C+362%E2%80%9363+%28emphasis+added%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4ecba57287.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4ecba57287.html">Permalink</a><a class="src" href="https://heidelblog.net/2022/05/a-a-hodge-contra-rome-the-protestants-say-that-love-is-the-fruit-of-faith/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

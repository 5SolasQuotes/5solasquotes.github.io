<main class="wrap"><figure class="quote" id="q-b2bb203925" data-kw="">
<blockquote><p>[H]uman laws do not bind to obedience, but only in the case, when the things which they prescribe do agree and serve to those things which God’s law prescribeth; so that, as human laws, they bind not, neither have they any force to bind, but only by participation with God’s law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dispute against the English Popish ceremonies obtruded on the Church of Scotland</cite>, (1637; Edinburgh, 1844), p. 90.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7a9d848621" data-kw="">
<blockquote><p>Assertion 1. As a man comes into the world a member of a politic society, he is, by consequence, born subject to the laws of that society… Assertion 2. Slavery of servants to lords or masters, such as were of old amongst the Jews, is not natural, but against nature:

1. Because slavery is malum naturae, a penal evil and contrary to nature, and a punishment of sin.

2. Slavery should not have been in the world if man had never sinned, no more than there could have been buying and selling of men, which is a miserable consequent of sin and a sort of death, when men are put to the toiling pains of the hireling, who longs for the shadow, and [are] under iron harrows and saws, and to hew wood, and draw water continually.

3. The original of servitude was when men were taken in war, to eschew a greater evil, even death, the captives were willing to undergo a less evil, slavery, (S. Servitus, 1 de jure. Pers.)

4. A man being created according to God’s image, he is res sacra, ‘a sacred thing,’ and can no more, by nature’s law, be sold and bought than a religious and sacred thing dedicated to God. Servitus, 1. Instit. de inutil. scrupl. I. inter Stipulantem. S. Sacram. F. de verber. Obligat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘…and How it is True, ‘Every Man is Born Free’ &amp; how Servitude is Contrary to Nature’ in Lex Rex (1644), Question 13, Assertion 2, ff., pp. 51-53</cite>, p. 51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

<blockquote><p>There must also an order be set down [by the magistrates] among the citizens, to avoid public assemblies, games, feasts, drinkings, marriages, dancings, fairs, schools, churches, and public baths; for… there is also no small danger of getting and scattering the infection. Wherefore, wise men give counsel that at such times we should very seldom come into great companies of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection</cite>, … (London, 1583), bk. 1, ch. 6, ‘Of Order to be Appointed among the Citizens, and of Leaving of Public Meetings and Assemblies,’ p. 27. Ewich was a German reformer and civil health official.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-470d3b2b82" data-kw="">
<blockquote><p>Think not that you shall enjoy the pleasures of this world, if you be the faithful servants of Christ. Christ shed his blood for thee, that thou shouldest not refuse to give thy blood for him. Drink the cup of bitter gall, whereof Christ began to thee, and carry thy cross, that thou mayest follow him. If thou be ashamed of the cross, thou art ashamed of Christ; if thou be ashamed of Christ, he will be ashamed of thee before his Father in heaven. The cross cannot hurt thee, for Christ hath sanctified it in his blood.

Behold not the sword which striketh thee, but think on the crown of glory, which thou shalt receive. Gold is clearer after it hath been put into the fire: be thou gold, and the fiery persecution shall not hurt thee. Let not the fear of death put out thy faith. Trust in the Lord: be strong, and he shall establish thy heart. Be rooted and built in Christ, and stablished in the faith. Then shall thy heart rejoice, and no man shall take thy joy from thee.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the Two Epistles of the Apostle St. Paul to the Thessalonians</cite>, (1584; London: John Hatchard, 1811), pp 67-68.</span></figcaption>

</figure><figure class="quote" id="q-515bc6a4a5" data-kw="">
<blockquote><p>We see this in marriage, published in the face of the Church, solemnized by consent of parties and parents, ratified by the action of the minister, and celebrated in the presence of many friends; the knot cannot be untied, no not by agreement of the parents, of the parties, of the minister, of the friends, and of the whole congregation, because marriage is not of the nature of a civil contract, but God is a party and hath a special hand in it, and whom God hath joined together let no man put asunder, or separate again without his consent. (Mt. 19:6)</p></blockquote>

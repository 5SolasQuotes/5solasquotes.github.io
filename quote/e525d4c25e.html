<main class="wrap"><figure class="quote" id="q-e525d4c25e" data-kw="">
<blockquote><p>If the thing be indifferent, I confess no man is to be compelled to it against his conscience, for this hath been the tyranny of Papists and Prelates, to compel men against their conscience to certain rites which themselves acknowledged to be merely indifferent, setting aside obedience to authority in such things, which (say they) is not indifferent. But if the word of God either directly or by necessary consequence, make the thing necessary, and such as we cannot leave undone without sin and breach of duty; if there be such an obligation from the word, then may a man be compelled to it, though against his conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wholesome severity reconciled with Christian liberty, or, The true resolution of a present controversy concerning liberty of conscience here you have the question stated, the middle way betwixt popish tyranny and schismatizing liberty approved and also confirmed from Scripture and the testimonies of</cite>, (London: Christopher Meredith, 1645), p. 24.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>…nothing which is evil in the use of it [though it be otherwise indifferent] may be done for any good whatsoever. 2. The difference betwixt that which is simply evil, and that which is evil in use and by accident [though it is otherwise indifferent], is in that the one may never be done, the other is unlawful only pro tempore [for the time]: but in this they agree, that both are unlawful; for that which is evil by accident, whiles it is such, is unlawful to be done, no less than that which is in nature evil. (Paraeus on 1 Cor. 10:23)</p></blockquote>

<main class="wrap"><figure class="quote" id="q-44a62f7a8d" data-kw="">
<blockquote><p>Howsoever every sin, even the least, doth thus deserve eternal damnation, yet there is a great difference between some sins and others. And therefore sin is not a mere negation, but a privation, as diseases are, and so as one disease may be more desperate then another, so may one sin be more heinous then another. The Stoics thought all sins alike. And Cyprian among the Ancients, is reported by the Learned to have been of that mind. But Scripture doth evidently confute this, He that delivered me unto thee hath the greater sin, John 16.11. So you have the phrase, no be worse then an Infidel, 1 Tim. 5.8. Thus Ezek. 16.47. Israel is said to be more corrupted, and to do more abomination then Sodom. For although to sin be to miss the mark, yet some may shoot far wider from it, then others, one sin therefore may be more heinous then another, divers ways, as Divines shew: As

1. From the Person offending; if he know the will of God, or if he be in public place or office.

2. From the Object; If it be sin against God immediately, or man only, as Eli said, 1 Sam. 2.25. If one man sin against another, the Judge shall judge him, but if a man sin against the Lord, who shall intreat for him?

3. From the Matter about which; If it be in the life of a man, and not in his goods, that thou wrongest him. Some also may be aggravated from the disposition of the man, the means he enjoys to overcome sin from the frequency of it, or defending of it, and the like. Hence some sins are compared to Camels, others to Gnats, some to Beams, other to Moats, some to Talents, other to Farthings. This then being clear, let us consider, what difference a true believer should make between these in matter of pardon, and what difference he should not make.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true doctrine of justification asserted and vindicated, from the errors of Papists, Arminians, Socinians, and more especially Antinomians in XXX lectures preached at Lawrence-Jury, London</cite>, (2nd edn, London: Tho. Underhill, 1651), pp 206-07.</span></figcaption>

</figure><figure class="quote" id="q-4a3de6de98" data-kw="">
<blockquote><p>It is good for us to mind what Christ says of great sinners, Mt. 12:31-32, ‘I say unto you, all manner of sin and blasphemy shall be forgiven unto men.’ When Christ says, ‘all manner of sin and blasphemy shall be forgiven unto men,’ and excepts none but the blasphemy against the Holy Ghost, no, not a word spoken against the Son of Man Himself, we may well think a word spoken or a deed done against ourselves may be pardoned; and that it may be so, [we] should pray for it; and we may hope for a good effect of it. Stephen’s prayer, when he was stoned (Acts 7:60), probably had an influence on Paul’s conversion. St. John tells us, 1 John 5:16, ‘If any man see his brother sin a sin which is not unto death, he shall ask, and he shall give him life for them that sin not unto death.’ So that unless a man could be assured that another has sinned that sin which is unto death, he may, nay, he ought to pray for him: ‘He shall ask, etc.’ In any case where there is but an ‘if so be,’ or a ‘who can tell,’ or a ‘perhaps,’ there is room left for prayer. In that mighty tempest that arose in the sea to arrest Jonah as he was going to Tarshish, which was like to have broken the ship, he is called on to arise and call upon his God, Jon. 1:6, ‘If so be that God will think upon us, that we perish not.’ Their case was very doubtful, yet they pray. So when Jonah had delivered his message to the Ninevites, ‘Yet forty days and Nineveh shall be overthrown,’ they cry mightily unto God, saying, ‘Who can tell if God will turn and repent?’ Jon. 3.9. Simon Magus was in a very bad state, in the gall of bitterness and the bond of iniquity, and Peter perceived it; yet he bids him repent and pray, if perhaps the thoughts of his heart might be forgiven him; and can we think, that he who put him upon praying for himself, would not pray for him too, especially considering Simon requested it of him? Acts 8:21, 24. Calvin in location: Si fieri possit, ab ipsis inferis extrahendi nobis sunt homines. [“If it were possible, men ought to be drawn by us even from the very depths of hell.”]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-millward.html">John Millward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Continuation of Morning-Exercise Questions &amp; Cases of Conscience Practicaly Resolved</cite>, ... (London: Dunton, 1683), Sermon 19, ‘How ought we to do our Duty towards others, though they do not theirs towards us?’, p. 564 Millward (d. 1684) was an English puritan put out at the Great Ejection.</span></figcaption>

<blockquote><p>it’s a sin in an Indian prince, and he sins against his magistratical office in that he punishes not an Indian false-teacher who teacheth against the Law of nature [which is universally known], because an Indian should not worship the Devil; but the Indian ruler invincibly ignorant of the Gospel sins not against his office as a magistrate because he punishes not a Gospel-heretic, for he is not obliged to every magistratical act as a magistrate, not to those of which he is invincibly and faultlessly ignorant, as an Indian husband and master invincibly ignorant of the Gospel sins not against the duty of a husband and head of a family, though he teach not wife, children and servants, the principles of the Gospel, which a Christian husband and head of a family is obliged to do, not as a husband and head of a family simply, but as such a husband and head as hears the Gospel, and so either hears and knows, or may hear these Gospel principles if he were not thereof ignorant through his own sinful neglect.</p></blockquote>

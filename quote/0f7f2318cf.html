<main class="wrap"><figure class="quote" id="q-0f7f2318cf" data-kw="">
<blockquote><p>Since drawing to oneself, and thereby supplying subsistence to that which is drawn, necessitates neither divestment nor augmentation, the Word does not subtract or add anything to himself in his assumption of a human nature and so requires no privation of being or passive potency in order to become flesh. Such are the fundamental claims of terminative assumption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dolezal.html">James Dolezal</a></span><span class="wk"><span class="lbl">Work:</span> <cite>’Neither Subtraction, Nor Addition</cite>, vol. 20, no. 1 (Winter, 2022) 23 pp. | He follows Aquinas in particular in arguing for another option, that of a terminative assumption:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>
<div class="actions"><button class="copy" data-copy="“Since drawing to oneself, and thereby supplying subsistence to that which is drawn, necessitates neither divestment nor augmentation, the Word does not subtract or add anything to himself in his assumption of a human nature and so requires no privation of being or passive potency in order to become flesh. Such are the fundamental claims of terminative assumption.”

— James Dolezal, ’Neither Subtraction, Nor Addition: The Word’s Terminative Assumption of a Human Nature’ Nova et Vetera, vol. 20, no. 1 (Winter, 2022) 23 pp. | He follows Aquinas in particular in arguing for another option, that of a terminative assumption:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSince+drawing+to+oneself%2C+and+thereby+supplying+subsistence+to+that+which+is+drawn%2C+necessitates+neither+divestment+nor+augmentation%2C+the+Word+does+not+subtract+or+add+anything+to+himself+in+his+assumption+of+a+human+nature+and+so+requires+no+privation+of+being+or+passive+potency+in+order+to+become+flesh.+Such+are+the+fundamental+claims+of+terminative+assumption.%E2%80%9D%0A%0A%E2%80%94+James+Dolezal%2C+%E2%80%99Neither+Subtraction%2C+Nor+Addition%3A+The+Word%E2%80%99s+Terminative+Assumption+of+a+Human+Nature%E2%80%99+Nova+et+Vetera%2C+vol.+20%2C+no.+1+%28Winter%2C+2022%29+23+pp.+%7C+He+follows+Aquinas+in+particular+in+arguing+for+another+option%2C+that+of+a+terminative+assumption%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0f7f2318cf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0f7f2318cf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-grace-of-union-the-logos-assuming-flesh/#:~:text=Since%20drawing%20to%20oneself%2C%20and%20thereby,the%20fundamental%20claims%20of%20terminative%20assumption&amp;text=Since%20drawing%20to%20oneself%2C%20and%20thereby%20supplying%20subsistence&amp;text=Such%20are%20the%20fundamental%20claims%20of%20terminative%20assumption" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-58c1fdd9d1" data-kw="">
<blockquote><p>Whether Christ is one or two? The prior is affirmed. … Whether Christ is able to be called a composite? It is denied. Whether a whole? It is distinguished. … Whether there are two beings [esse] in Christ, or a twofold existence and individualness? It is affirmed with a distinction. Whether a twofold life? It is affirmed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Subtitle II, ‘Of the Consequences &amp; Effects of the Union’, ‘Of Christ the Theanthropos’ in Tract 2, ‘Of the Person, Offices &amp; States of Christ the Mediator’ in A Syllabus of Theological Problems</cite>, … (Utrecht, 1643) n.p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>
<div class="actions"><button class="copy" data-copy="“Whether Christ is one or two? The prior is affirmed. … Whether Christ is able to be called a composite? It is denied. Whether a whole? It is distinguished. … Whether there are two beings [esse] in Christ, or a twofold existence and individualness? It is affirmed with a distinction. Whether a twofold life? It is affirmed.”

— Gisbertus Voetius, Subtitle II, ‘Of the Consequences &amp; Effects of the Union’, ‘Of Christ the Theanthropos’ in Tract 2, ‘Of the Person, Offices &amp; States of Christ the Mediator’ in A Syllabus of Theological Problems… (Utrecht, 1643) n.p.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhether+Christ+is+one+or+two%3F+The+prior+is+affirmed.+%E2%80%A6+Whether+Christ+is+able+to+be+called+a+composite%3F+It+is+denied.+Whether+a+whole%3F+It+is+distinguished.+%E2%80%A6+Whether+there+are+two+beings+%5Besse%5D+in+Christ%2C+or+a+twofold+existence+and+individualness%3F+It+is+affirmed+with+a+distinction.+Whether+a+twofold+life%3F+It+is+affirmed.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Subtitle+II%2C+%E2%80%98Of+the+Consequences+%26+Effects+of+the+Union%E2%80%99%2C+%E2%80%98Of+Christ+the+Theanthropos%E2%80%99+in+Tract+2%2C+%E2%80%98Of+the+Person%2C+Offices+%26+States+of+Christ+the+Mediator%E2%80%99+in+A+Syllabus+of+Theological+Problems%E2%80%A6+%28Utrecht%2C+1643%29+n.p.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F58c1fdd9d1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/58c1fdd9d1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-grace-of-union-the-logos-assuming-flesh/#:~:text=Whether%20Christ%20is%20one%20or%20two,a%20twofold%20life%3F%20It%20is%20affirmed&amp;text=Whether%20Christ%20is%20one%20or%20two%3F%20The%20prior&amp;text=distinction.%20Whether%20a%20twofold%20life%3F%20It%20is%20affirmed" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ec7ec52a0c" data-kw="">
<blockquote><p>A part coming to a whole does not give esse [existence] to the whole, but receives it, because it is perfected by the form of the whole. For if it remained distinct, as before, it would not receive the esse of the whole, but would either have proper esse or none. But the human nature united to the Word is not informed by the Word, but remains simply distinct. Therefore it either has no esse [denied], or [a] proper [esse of its own, affirmed].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-duns-scotus.html">John Duns Scotus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as trans. Richard Cross, Union &amp; Communion | p. 14, from Ord. III, d. 6, q. 1, n. 26</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>
<div class="actions"><button class="copy" data-copy="“A part coming to a whole does not give esse [existence] to the whole, but receives it, because it is perfected by the form of the whole. For if it remained distinct, as before, it would not receive the esse of the whole, but would either have proper esse or none. But the human nature united to the Word is not informed by the Word, but remains simply distinct. Therefore it either has no esse [denied], or [a] proper [esse of its own, affirmed].”

</figure><figure class="quote" id="q-37629f4e18" data-kw="">
<blockquote><p>Objection 2: Further, hypostasis is nothing more than a ‘particular substance,’ as Boethius says (De Duab. Nat.). But it is plain that in Christ there is another particular substance beyond the hypostasis of the Word, viz. the body and the soul and the resultant of these. Therefore there is another hypostasis in Him besides the hypostasis of the Word. … Reply to Objection 2: Hypostasis signifies a particular substance, not in every way, but as it is in its complement. Yet as it is in union with something more complete, it is not said to be a hypostasis, as a hand or a foot [is, as joined to a person’s body]. So likewise the human nature in Christ, although it is a particular substance, nevertheless cannot be called a hypostasis or suppositum, seeing that it is in union with a completed thing, viz. the whole Christ, as He is God and man. But the complete being with which it concurs is said to be a hypostasis or suppositum.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 3</cite>, question 2, ‘Of the Mode of Union of the Word Incarnate’ | article 3, ‘Whether the union of the Word Incarnate took place in the suppositum or hypostasis?’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

p;text=is%20said%20to%20be%20a%20hypostasis%20or%20suppositum" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7eebdca10b" data-kw="Perseverance">

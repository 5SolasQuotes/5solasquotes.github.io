<main class="wrap"><figure class="quote" id="q-f10d1f2232" data-kw="">
<blockquote><p>Moreover this Assembly entreats and exhortsall for God’s sake, and the glory of his great name, and their own salvation,and for the peace and welfare of the nation; yea, it adjures by all that is desirable or commendable, the whole body of our communion in general, and every faitful soul in particular, to divest themselves of all animosities whatsoever, and to lop off immediately all dissolutions and dissensions, lest they should be the causes of the dissipation of the Churches of God in this kingdom. And all pastors and elders of Churches are enjoined diligently to procure the reunion of the respective members of their flocks, and to lend one another their helping hand to effect so good a work, and mightily to insist upon it in their public sermons, and private exhortations and remonstrances; And in case they should meet with contempt, scorn and reproach in the discharge of this their duty, and that any one, through an obdurate perverseness, should show himself implacable and irreconcilable, this Assembly, according to that authority which the great God gives unto the ministers of his holy Word, denounces to them the dreadful judgments of God, and wishes they may be had in execration” (that is, detestation) “among and by all the faithful; yea, all the censures of the Churchshall be exerted against such refractory persons, and the utmost rigor of our discipline shall be inflicted and executed upon them, lest the good name of God should be blasphemed through our sins, and that we may not contract upon ourselves the guilt of the Church’s desolation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

squotes.github.io%2Fquote%2Ff10d1f2232.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f10d1f2232.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/john-currie-essay-on-separation-or-a-vindication-of-the-church-of-scotland-contra-the-seceders/#:~:text=Moreover%20this%20Assembly%20entreats%20and%20exhortsall,the%20guilt%20of%20the%20Church%E2%80%99s%20desolation." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-e23c74dd4c" data-kw="">
<blockquote><p>3. Every man (especially experienced Christians) have more sense and knowledge of what is profitable and congruous to them than standers-by have, how learned soever: As ignorance makes a few, short, plain, oft repeated words in a familiar style more profitable to low-bred persons than an accurate learned discourse would be, so men’s several tempers and vices makes that matter and manner of preaching profitable to them which to others seems otherwise; And as a nice lady must not tie her family of laboring persons to the matter and measure of her diet, nor revile them as gluttons or fools if they like it not. No more must learned men confine plain people to wordy orations (whether learned or pedantic) and say, ‘This is best for them’. Much less must they silence causlessly such teachers as truly profit them, or tie them to homilies or liturgies only and say, ‘Here is as much as is necessary to salvation.’ Nor is it any schism in the people if they refuse to be so confined by them and denied such helps to their salvation as God has sent them and made their due.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood… (London, 1679), sect. 6</cite>, pp. 57-58</span></figcaption>

="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a3500b3359" data-kw="">
<blockquote><p>We offer and we perform all obedience which God has commanded, and we deny neither toll, tribute nor fear to her nor officers: We only bridle her blind rage, in which she would erect and maintain idolatry, and would murder our brethren who refuse the same. Neither yet fear we in this present day, that against us she makes a malicious lie, where that she says that it is not religion we go about, but a plain usurpation of authority: God forbid that such impiety should enter into our hearts, that we should make his holy religion a cloak and cover of our iniquity. From the beginning of this controversy ’tis evidently known what have been our requests, which, if the rest of the nobility and commonality of Scotland will cause to be performed unto us, if then in us appear any sign of rebellion, let us be reputed and punished as traitors, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-bcc51754c5" data-kw="">
<blockquote><p>It is evident that there may be union and communion with a Church where there are several corruptions neither confessed nor reformed. As for example, there may be difference of judgment about many things, and doctrinal determinations of disputable points exacted by synods, contrary to our sentiments; and yet there may be forbearance with protestations, if we be not constrained to subscribe or homologate the same. In worship there may be many defects and disorders. In discipline and government there may be many dissatisfactions with Church officers, unjust censures, unfit ordinations, erroneous decisions, wrong constitutions of judicatories, dissatisfactions with persons that have the main stroke in the administrations, occasioning jealousies and fears of misgovernment for the time to come, and the like.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

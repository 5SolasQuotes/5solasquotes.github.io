<main class="wrap"><figure class="quote" id="q-db1c19f040" data-kw="">
<blockquote><p>A clear apprehension of this truth, that Jesus Christ is a King—Founder and Head of the Kingdom of Heaven upon earth, is fundamental to any proper understanding, either of the spirit and language of the Scriptures, or of the nature and relations of the Christian life. Through the whole revealed scheme of Redemption, this truth runs parallel with the truth of the Priesthood of Christ.

Nay, it is rather the essential form of that truth, and therefore the essential form of the Gospel itself. For “Christ crucified,” according to the apostle, is not merely a doctrine contained in the Gospel; it is the Gospel itself; the one idea of all the revelation which God has made of himself. As in the physical structure of man, the blood, driven by the heart to every extremity of his system, imparts to every atom the vitality without which it would be only so much dead clay: so in the structure of God’s revealed truth.

The Cross of Jesus is the grand heart of the system, and the atoning blood flowing from the cross is that which imparts to every syllable its divine life as the truth of God. Every other idea in the book has its life from this idea; without this the other truths of Scripture may be fashioned, as men who love not the doctrine of atonement have fashioned them, into a beautiful system of Ethical Theology. But when their highest skill has been exhausted upon the work, it is no living gospel.

It stands forth merely as the marble smitten by the wand of the genius of sculpture, beautiful indeed in form and structure, but a cold and lifeless thing—powerless to extend an arm to save, or speak a word of compassion to the fallen soul. So, on the other hand, conversely—as the life-bearing blood in the physical system must needs have, as one of its conditions, the bodily structure and form—at once a condition and a result of the outworking of the life that is in it; in like manner, in the system of Redemption, the doctrine of atonement by blood must ever develop its life-giving power in the formation of a body of Christ—his Church—the Kingdom of Heaven.

With this general view corresponds the successive developments of the story of Redemption. It is ever the story of an atoning Redeemer, embodied in the story of a King of Glory. The very first shadowy glimpse of Messiah at the opening of Genesis, as the seed of the woman, in the prophetic promise to the two trembling sinners in Eden, is of a wounded but victorious king, crushing the head of the mighty arch-enemy of humanity. In the amazing history of the actual fulfilment of the prophecy, even as we behold him hanging on the cross; there, over his head is still the inscription, “This is the King of the Jews.” In the last glimpse we catch of him through the door which John’s prophecy opens in heaven, He is still “the King of kings, and Lord of lords;” “the Lamb in the midst of the throne,” reigning in triumph over the myriads of his redeemed.

And so in every stage of the revelation of God’s purposes of mercy to the race. In the theology of Paul, the central truth is Christ risen and reigning, “till he hath put all enemies under his feet.” The story of the evangelist is of him concerning whom the wise men and Herod inquired, “Where is he that is born King of the Jews?” at his birth; and concerning whom Pilate inquired, “Art thou a King, then?” on the day of his death. Going back to the revelations of Him through the prophets, He appears in every vision that was vouchsafed to encourage the faith of the saints, as at once the atoning Limb that shall be led to the slaughter, but also as the Lion of the tribe of Judah. As the wailing sufferer “stricken of God,” but also as the Holy King in Zion, who “shall divide the spoil with the strong.</p></blockquote>

<blockquote><p>The method of our salvation; it was not sufficient to obtain salvation once, unless it could be perpetually preserved and applied. Christ obtained the former by his satisfaction, but the ladder he should procure by his intercession. By the former, he obtained salvation; by the latter he preserves it. By the former, he purchased the right to life and reconciled us to God; by the latter, he actually admits us to a participation of life and continually keeps us when once established in the grace of God.</p></blockquote>

<blockquote><p>Q. Did Christ always abide under the power and dominion of death?

A. No, for the power of death being subdued, the third day he rose again, ascended into heaven, and sitteth at the right hand of the Father.

Expos. 14. The resurrection of Christ is the first degree of his exaltation, wherein his soul being joined to the same flesh that died, he was raised up to life, 1. Cor. 15. 4. It was necessary that he should rise again, in regard of the excellency of his person, Act. 2. 24. the covenant which he had made with the Father, Psa. 2. 6, 7. Es. 53. 10. the dignity of his high office of eternal mediation, Psal. 110. 6, 7. Rom. 4. 25. and that the truth of those things which were foretold concerning the glory of the Messias, might be fulfilled.

Christ by his divine power rose again from the dead, Rom. 1. 4. 1. Pet. 3. 18. 1. Tim. 3. 16. Jo. 5. 21. and 10. 17, 18. Act. 2. 24. and 3. 15. Eph. 1. 17. 20. Rom. 8. 11. not as a private but as a public person, Rom. 5. 14. 19. 1. Cor. 15. 45. Heb. 10. 14. 1. Pet. 2. 20, 21. thereby shewing that his satisfaction is fully absolute, Rom 4. 25. and 6. 9, 10. The end of his resurrection was, that he might prepare himself to the performance of the glorious functions of a Mediator, and shew himself to be the conqueror of death, and the Lord of quick and dead, Rom. 14. 9. Act. 17. 31.

15. To sit at the right hand, is a manner of speech borrowed from earthly Princes, who use to set at their right hand such as they substitute to rule under them in their names, 1. King. 2. 19. And hereby is clearly noted that excellent glory, power, and dominion of Christ, received of the Father, whereby he doth execute his Kingly, Priestly, and Prophetical office in glory, Matth. 28. 18. Io. 17. 2. Phi. 2. 9, 10. Psa. 110. 1.</p></blockquote>

<blockquote><p>Some men strangely imagine that the death of Christ procured for us the love of God, but it was the effect and not the cause of that love. Christ did not die that God might love us; He died because God loved us.</p></blockquote>

</figure><figure class="quote" id="q-84f9a8681e" data-kw="">
<blockquote><p>No sacrifice could be accepted by God, but on such an altar, as could sanctify the gift to its designed effect; and who could supply that, but the last Adam himself? Accordingly, his Divine nature, that eternal Spirit, was the altar, whence the sacrifice of his human nature, derived all its infinite value and efficacy.

“We,” says the apostle Paul, “have an altar, whereof they have no right to eat who serve the tabernacle,” and in another place, “How much more shall the blood of Christ, who through the eternal Spirit, offered himself without spot to God, purge your conscience from dead works, to serve the living God.” His blessed body, suffering and bleeding to death on the cross, and his holy soul, melted within him, by the fire of Divine wrath, both being, at the same time, united to his Divine nature, were the sacrifice burning on the altar, from which, God smelled a sweet smelling savour.

By this infinitely perfect sacrifice, the justice of Jehovah was fully satisfied, and his wrath completely appeased.—Not that Christ was a sacrifice only, whilst he was on the cross. His offering of himself a sacrifice, which he began, at his incarnation, to do, (the sacrifice having been laid on the altar, the first moment thereof,) and which he continued, for more than thirty-three years, to do, he finished on the cross and in the tomb.

Hence are these consoling declarations: “He hath made him to be sin for us “When we shall see him, there is no beauty that we should desire him. He is — a man of sorrows, and acquainted with grief:- Surely he hath borne our griefs, and carried our sorrows.” His Divine nature, then, was the altar, which so sanctified the sacrifice of his human nature, as to render it valuable, in an infinite degree. … Now as Christ himself, was both the sacrifice, and the altar; so, none but himself could be the Priest: and as in his human nature, he was the sacrifice, and in his Divine nature, the altar; so, it behoved him in his person, to be the Priest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), pp 105-06.</span></figcaption>

<blockquote><p>And this doth and must determine the difference between the Jews and Christians about the promises of the Old Testament. They are all made unto the church. No individual person hath any interest in them but by virtue of his membership therewith. This church is, and always was, one and the same. With whomsoever it remains, the promises are theirs; and that not by implication or analogy, but directly and properly. They belong as immediately, at this day, either to the Jews or Christians, as they did of old to any. The question is, With whom is this church, founded on the promised Seed in the covenant? This is Zion, Jerusalem, Israel, Jacob, the temple of God. The Jews plead that it is with them, because they are the children of Abraham according to the flesh. Christians tell them that their privilege on this account was of another nature, and ended with the coming of the Messiah; that the church unto whom all the promises belong are only those who are heirs of Abraham’s faith, believing as he did, and thereby interested in his covenant. Not as though the promise made to Abraham were of none effect; for as it was made good unto his carnal seed in the exhibition of the Messiah, so the spiritual privileges of it belonged only unto those of the Jews and Gentiles in whom God had graciously purposed to effect the faith of Abraham. Thus was and is the church, whereunto all the promises belong, still one and the same, namely, Abraham’s children according to the faith: and among those promises this is one, that God will be a God unto them and their seed for ever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 1.124.</span></figcaption>

<blockquote><p>…just as in human beings, the term ‘virtues’ is reserved for ‘excellent and confirmed habits’ or dispositions that conduce to the proper use of the faculties, so also in God is the word ‘virtues’ applied to the workings of the divine essence, with specific reference to the disposition and use of the ‘faculties’ of intellect and will. This approach is analogical, given that the divine virtues are not separable from the divine essence as human virtues are separable from humanity. In short, the virtues of God are the divine moral perfections, specifically the goodness and righteousness of the divine willing. These virtues are also the source of all finite or creaturely goodness and righteousness. (Leigh, Treatise, II.x (pp. 78-79).)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, p. 560</span></figcaption>

<blockquote><p>The goodness of God, on the contrary, is the loveliness, benign character, sweetness, friendliness, kindness, and generosity of God. Goodness is the very essence of God’s being, even if there were no creature to whom this could be manifested. “The good LORD pardon every one” (2 Chr.30:18); “Good and upright is the LORD: therefore will He teach sinners in the way” (Psa. 25:B); “There is none good but one, that is, God” (Mat. 19:17). From this goodness issues forth lovingkindness and an inclination to bless His creatures. This is to the astonishment of all who take note of this, which explains why David exclaims twenty-six times in Ps. 136, “For His Mercy endureth for ever.” In the following texts we read likewise. “Also unto Thee, O Lord, belongeth mercy” (Psa. 62:12); “All the paths of the LORD are mercy” (Psa. 25:10). From goodness and benevolence issues forth the doing of that which is good. “Thou art good, and doest good” (Psa. 119:68); “Rejoice the soul of Thy servant: and attend unto the voice of my supplications. For Thou Lord, art good, and ready to forgive; and plenteous in mercy unto all them that call upon Thee” (Psa. 86:4, 6, 5). This goodness is of a general nature in reference to all God’s creatures, since they are His creatures. “The LORD is good to all: and His tender mercies are over all is works” (Psa. 145:9); “The earth is full of the goodness of the LORD” (Psa. 33:5); “For He maketh His sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust” (Mat. 5:45). The goodness which is of a special or particular nature as it relates to God’s children is thus expressed: ‘Truly God is good to Israel, even to such as arc of a clean heart” (Psa. 73:1); “The LORD is good unto them that wait for Him, to the soul that seeketh Him” (Lam. 3:25). This goodness of God is the reason why a believer, even after many backslidings, is motivated by renewal to return unto the Lord. “The children of Israel shall return… and shall fear the LORD and His goodness” (Hosea 3:5); “But I have trusted in Thy mercy” (Psa. 13:5). This is why they call the Lord “the God of my mercy” (Psa. 59:10, 17). In this goodness they rejoice and this goodness they magnify. “I will sing of the mercies of the LORD for ever” (Psa. 89:1); “Praise ye the LORD. O give thanks unto the LORD; for He is good: for His mercy endureth for ever” (Psa. 106:1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout (Soli Deo Gloria, 1992), 1:122-23</span></figcaption>

<blockquote><p>For manner of administration this covenant [of grace] is diverse, as it pleased God in sundry ways to dispense it; but for substance it is one—the last, unchangeable, and everlasting. One, for Jesus Christ is the same yesterday, and today, and forever. The last, for it succeeded the covenant of works, but none shall succeed it. (Heb. 13:8) In it God has revealed his whole pleasure concerning the salvation of man, and has manifested his principal properties, the riches of his grace, wherein he delights to be magnified. He who is not saved by the covenant of grace must and shall perish everlastingly. Unchangeable and everlasting, for therein God has revealed Himself, with respect to the things He wills concerning man’s salvation, to be one and the same forever. There is no other relation or respect that might give occasion to another covenant. It was the pleasure of God to show mercy to miserable man; but he will not extend compassion to him who obstinately and willfully contemns the riches of his grace. The covenant made with Adam in the state of innocence is altered for our great good and comfort; but this covenant is like the covenant of the day and of the night—it stands fast forever and ever. (Isa. 24:5; Ps. 111:9) Though men are unfaithful, God continues faithful; he waits for the conversion of those who go astray, and if they return, he will receive them into favor. (1 Sam. 7:3; Dt. 4:31; Jer. 3:1-2; Rom. •:6 &amp; 11:1, •9) The Lord will not utterly cast off that people whom he has once chosen and received unto mercy. And with respect to the life to come, the covenant is eternal; for after this life the people effectually in covenant shall live with the Lord forever. (Hos. 13:14; Mt. 22:32)</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>
<div class="actions"><button class="copy" data-copy="“For manner of administration this covenant [of grace] is diverse, as it pleased God in sundry ways to dispense it; but for substance it is one—the last, unchangeable, and everlasting. One, for Jesus Christ is the same yesterday, and today, and forever. The last, for it succeeded the covenant of works, but none shall succeed it. (Heb. 13:8) In it God has revealed his whole pleasure concerning the salvation of man, and has manifested his principal properties, the riches of his grace, wherein he delights to be magnified. He who is not saved by the covenant of grace must and shall perish everlastingly. Unchangeable and everlasting, for therein God has revealed Himself, with respect to the things He wills concerning man’s salvation, to be one and the same forever. There is no other relation or respect that might give occasion to another covenant. It was the pleasure of God to show mercy to miserable man; but he will not extend compassion to him who obstinately and willfully contemns the riches of his grace. The covenant made with Adam in the state of innocence is altered for our great good and comfort; but this covenant is like the covenant of the day and of the night—it stands fast forever and ever. (Isa. 24:5; Ps. 111:9) Though men are unfaithful, God continues faithful; he waits for the conversion of those who go astray, and if they return, he will receive them into favor. (1 Sam. 7:3; Dt. 4:31; Jer. 3:1-2; Rom. •:6 &amp; 11:1, •9) The Lord will not utterly cast off that people whom he has once chosen and received unto mercy. And with respect to the life to come, the covenant is eternal; for after this life the people effectually in covenant shall live with the Lord forever. (Hos. 13:14; Mt. 22:32)”

<blockquote><p>…but after showing us that we have degenerated from our true origin, viz., the law of our Creator, adds, that Christ, through whom we have returned to favor with God, is set before us as a model, the image of which our lives should express. What do you require more effectual than this? Nay, what do you require beyond this? If the Lord adopts us for his sons on the condition that our life be a representation of Christ, the bond of our adoption—then, unless we dedicate and devote ourselves to righteousness, we not only, with the utmost perfidy, revolt from our Creator, but also abjure the Savior Himself.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-0d04a8f604" data-kw="">
<blockquote><p>My next work is to show you how it justifieth. There being mistakes in this matter, I shall endeavour to lay the truth before you.

1. Faith does not justify as a mutual cause together with works, as if they did cooperate together; but we must distinguish. There is a first and second justification, the one ascribed to faith, the other to works. This opinion maketh as if we were beholden to grace only for some courtesies, where we cannot engage God of ourselves. It is true James saith, ‘Not by faith, but by works;’ but that is only to justify faith. It is a false faith that doth not end in works; but works have nothing to do in justification. God abhorreth such a profane medley; he would have it wholly of grace. The papists exact an imaginary faith, and so are put upon a necessity of eking it out with works.

2. Not as an act and grace in us. Faith justifieth relativè, not effectivè et formaliter: not as if the act of believing were instead of perfect obedience to the law, and as if it were grace in us, and not an apprehending of Christ’s righteousness. But it is in reference to the object that it is said to justify, only because of its necessary concurrence as an instrument. Christ’s righteousness maketh us righteous, only because it cannot apprehend this righteousness but by faith, therefore it is said faith doth it. The hand may be said to feed and nourish the body, but the nutritive virtue is not in the hand, but the meat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition upon the Fifty-Third Chapter of Isaiah</cite>, (1703) in The Complete Works of Thomas Manton, D.D. (22 vols, London: James Nisbet &amp; Co., 1871), 3: 440.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-502fe444b3" data-kw="">
<blockquote><p>If at this day we should take a survey of the several professions of Christianity that have any large spread in any part of the world (as of the religion of the Roman and the Reformed Churches in our quarters, of the Egyptians and Ethiopians in the South, of the Grecians and other Christians in the Eastern parts) and should put-by the points wherein they differ one from another, and gather into one body the rest of the articles wherein they do all generally agree, we should find that in those propositions which without all controversy are universally received in the whole Christian world, so much truth is contained, as being joined with holy obedience, may be sufficient to bring a man unto everlasting salvation. Neither have we cause to doubt, but that as many as do walk according to this rule (neither overthrowing that which they have builded by superinducing any damnable heresies thereupon, nor otherwise vitiating their holy faith with a lewd and wicked conversation), peace shall be upon them and mercy, and upon the Israel of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Opinions of Certain Reverend &amp; Learned Divines concerning the Fundamental Points of the True Protestant Religion, &amp; the Right Government of Reformed Churches</cite>, ([Oxford] Downes, 1643), ‘The Judgment of… Lord Archbishop of Armagh, delivered in a Sermon of his preached before King James at Wansted, June 20th, 1624’, pp. 6-7</span></figcaption>

<blockquote><p>He who believes has eternal life. In justification not only the merit of Christ’s passive obedience is imputed but also that of his active obedience. In that benefaction believers receive forgiveness, exemption from punishment, and are not returned to the prefall state of Adam, who with the power granted to him had to keep the law and earn eternal life. On the contrary: on the basis of Christ’s perfect obedience, they are immediately entitled to eternal life; the holy works accomplished by Christ are credited to them; they do not, by keeping the law, have to earn eternal life, but do good works based on the principle of eternal life already granted to them in faith.</p></blockquote>

<blockquote><p>3. But the word [‘to justify’] is used with that specialized meaning when it concerns the judgment of God as He absolves the sinner who stands before his judgment seat (Ps. 143:2; Rom. 5:16 and 8:33-34). And so this entire act of justification is depicted as a forensic process. Yet we still grant that justification sometimes appears also to include sanctification as its consequence because of the very strong, close connection between the two (Rom. 8:30; Titus 3:7, etc.).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-fde2d15b26" data-kw="">
<blockquote><p>After He had washed their feet, and had taken his garments, and was set down again, He said unto them, ‘Know ye what I have done to ye, ye call me Master and Lord, and ye say well, for so I am; if I then your Lord and Master have washed your feet, ye also ought to wash one another’s feet, for I have given you an example that ye should do as I have done to you.’ ‘Tis evident that it is the moral duty of brotherly love, in condescension, and mutual helpfulness to be expressed in all necessary offices as occasion doth require, that is the thing which Jesus Christ here enjoins his disciples, and leads them to by his own example in an office of love then in use in those parts. The same is to be said of the holy kiss, Rom. 16:16 which was a temporary occasional token of entire love; which may in answer thereunto, be expressed by any sober usage of salutation amongst men to the same purpose. But the things themselves were not instituted for any continuance, nor do represent any special grace of the New Covenant, which is inseparable from every institution of Gospel worship properly so called. Common usages or practises therefore, directed to be used in a due manner, and unto a proper end, where they are used, make them not institutions of worship. Neither have they in them as so commanded or directed, any one thing that concurs to the constitution of a Gospel-Ordinance: for neither had they their rise in the authority of Christ, nor is any continuance of them enjoined, nor any promise annexed unto them, nor any grace of the New Covenant represented or exhibited in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/explication.html">Explication</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Mention is made in the Scriptures of sundry things practiced by the Lord Christ and his Apostles, which being then in common use amongst men, were occasionally made by them symbolical instructions in moral duties. Such were washing of feet by one another, the holy kiss, and the like; but there being no more in them, but a sanctified use directed unto the present civil customs and usages, the commands given concerning them, respect not the outward action, nor appointed any continuance of them, being peculiarly suited unto the state of things and persons in those countries; as John 13:12-15</cite>, Mention is made in the Scriptures of sundry things practiced by the Lord Christ and his Apostles, which being then in common use amongst men, were occasionally made by them symbolical instructions in moral duties. Such were washing of feet by one another, the holy kiss, and the like; but there being no more in them, but a sanctified use directed unto the present civil customs and usages, the commands given concerning them, respect not the outward action, nor appointed any continuance of them, being peculiarly suited unto the state of things and persons in those countries; as John 13:12-15</span></figcaption>

<blockquote><p>3. That the ordinance of superiors cannot make the ceremonies [which were claimed to be indifferent, to be] necessary, I have proven in the first part of this Dispute. This is given for one of the chief marks of the man of sin [in 1 Tim. 4:1-5], ‘That which is indifferent, he by his laws and prohibitions maketh to be sin;’ (Morney, Mister. of Iniq., in the Conclusion) and shall they who profess to take part with Christ against Antichrist [such as the prelates] do no less than this? It will be replyed that the ceremonies are not thought necessary in themselves, nor non-conformity unlawful in itself, but only in respect of the Church’s ordinance. Just so the Papists profess that the omission of their rites and observances is not a sin in itself, but only in respect of contemning the Church’s customs and commandments. How comes it then that they [the prelates] are not ashamed to pretend such a necessity for the stumbling blocks of those offending ceremonies among us, as Papists pretend for the like among them?</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-8ff51caef2" data-kw="">
<blockquote><p>As touching that point whether the minister should wear it [the surplice, a white garment], although it be inconvenient: the truth is that I dare not be author to any to forsake his pastoral charge for the inconvenience thereof: considering that this charge, being an absolute commandment of the Lord, ought not to be laid aside for a simple inconvenience or uncomeliness of a thing which in the own nature is indifferent. The offence in occasioning the weak to fall and the wicked to be confirmed in their wickedness is one of the foulest spots in the surplice, and which of all other can make it most detestable in the eyes of a godly minister… But when it is laid in the scales with the preaching of the Word of God, which is so necessary for him that is called thereunto, that a woe hangs on his head if he do not preach it: it is of less importance than for the refusal of it we should let go so necessary a duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second Reply, pt. 2</cite>, ch. 8, pp. 262–63</span></figcaption>

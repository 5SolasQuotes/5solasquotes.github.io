<main class="wrap"><figure class="quote" id="q-63ffae41b2" data-kw="">
<blockquote><p>Answer: To distribute in a civil and natural way requires not a man full of the Holy Ghost, but to distribute in simplicity and with the grace of heavenly cheerfulness, Rom. 12:8, and with the qualities of a complete deacon, 1 Tim. 3:[9,] 12-14, requires the Holy Ghost [Acts 6:3-5], though they may be good deacons who are not full of the Holy Ghost; but such [persons full of the Holy Ghost] were chosen: 1. Because this was to be a rule to all deacons to the world’s end, and the rule should be as straight and perfect as can be; 2. Because there were choice of such men as those in the apostolic Church, and [there is] reason that God be served with the best of his own; 3. The Holy Ghost is required for sanctification, as well as for gifts of preaching, Luke 1:15; Mt. 10:20. 4. Stephen [a deacon] did no more (Acts ch. 7) in his apology than any witnesses of Christ convened before rulers may do who are obliged to be ready always to give an answer to every one who asks them of the hope that is in them, with meekness and fear, 1 Pet. 3:15, yea though it were a woman, who yet may not preach, 1 Cor. 14:34.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644), pt. 1</cite>, p. 165</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<blockquote><p>3. And He has described the persons that he will have to be the officers by their requisite qualifications [e.g. 1 Tim. 3]. All this is done in his laws already. 4. There is nothing therefore left to be done but to determine which are the individual persons that are fittest according to God’s description. This God Himself also will do, but has not tied himself to one way in doing it: In general, some sign of God’s will that this is the man must be had; At first in calling the apostles his own immediate nomination was the sign. Now the most notable sign is the most eminent unquestionable qualification of the person, which when God confers so notably or discernably, that man must be taken as chosen by God, and they that reject him do sin: These qualifications lie both in abilities, willingness, conveniency of habitation or other externals and interest in the people; and if God bow their minds to consent, there is the fuller signification of his will; yet lest any by intrusion should abuse the Church, God has made the pastors and overseers judges of men’s fitness, or the ordinary discerners of it, for the guidance of the Church in their consent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘Objections Answered’</cite>, pp. 82-83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-32882f1932" data-kw="">
<blockquote><p>The reason why it is believed, that regeneration does not usually accompany baptism, is simply because no evidences of spiritual life appear in baptized children more than in those which remain unbaptized. The education of children should proceed on the principle that they are in an unregenerate state, until evidences of piety clearly appear, in which case, they should be sedulously cherished and nurtured. These are Christ’s lambs — ” little ones, who believe in Him” whom none should offend or mislead upon the peril of a terrible punishment. But though the religious education of children should proceed on the ground that they are destitute of grace, it ought ever to be used as a means of grace. Every lesson, therefore, should be accompanied with the lifting up of the heart of the instructer to God for a blessing on the means. “Sanctify them through thy truth; thy word is truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-alexander.html">A.A. Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts on Religious Experience (Philadelphia: Presbyterian Board of Publication, 1841)</cite>, pp. 26-27</span></figcaption>

</figure><figure class="quote" id="q-6a847a1e60" data-kw="">
<blockquote><p>…as David without immediate revelation from Heaven to direct him, by only the Law of nature, did eat showbread; So is the case here, so answer the casuists and the schoolmen, that a positive law may yield in case of necessity to the good of the Church; so Thomas, Molina, Suarez, Vasquez, Vigverius, Sotus, Scotus, Altisiodorensis, Durand, Gabriel; and consider what the learned Voetius says in this: What if in an extreme case of necessity, a private man, endued with gifts and zeal should teach publicly, after the example of the faithful at Samosaten.</p></blockquote>

</figure><figure class="quote" id="q-3194fd8ecb" data-kw="">
<blockquote><p>14. Nor do we take ourselves bound by Christ to one place or one time, or manner of teaching, or to speak always to a great assembly. But all these are circumstances which we must fit to the end and success of our work, and must take that course, and with that variation which tends to the Church’s good. Christ, that bid his apostles when they were persecuted in one city, fly to another, allows us to be where we may serve Him best. If forbearing all preaching for some days or weeks would tend to the Church’s good (as by procuring us liberty afterward, etc.) it is lawful to forbear. If preaching often to a few be more for the Church’s good than to preach but once or twice to many, we may then lawfully choose the smaller number. So that in such circumstances, that may be one man’s duty which is anothers sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Nonconformists’ Ministry… (1668-1669; 1675; London: 1681)</cite>, p. 16</span></figcaption>

<main class="wrap"><figure class="quote" id="q-41d7db1dae" data-kw="Author of sin" data-pol="">
<blockquote><p>God does not infuse malice into the wills of evil men, as He infuses goodness into the hearts of the godly.—In one and the same work of the godly what is a good and just action proper to God is to be distinguished from the defect and vice of the ungodly. The sin of the wicked is their own; their doing this or that by sinning is of God’s power,—and so in the same work God is ascertained to be righteous, man to be guilty.</p></blockquote>
<figcaption>— <a href="../authors/william-bucanus.html">William Bucanus</a>, <cite>Institutions of the Christian Religion</cite>, 19.11 (as quoted in Heinrich Heppe, Reformed Dogmatics)</figcaption>
<div class="meta"><a class="tag" href="../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../topics/decrees-and-providence/concurrence.html">Concurrence</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c71e2bebb7" data-kw="Author of sin|Hardening|Justice|Depravity" data-pol="">
<blockquote><p>Yes, there is even in ourselves sin and corruption enough, so that there is no need that God should infuse into us either a new or greater measure of wickedness. Therefore, when God is said in the Scripture to harden (Ex. 7:13), to blind (John 12:40) and to deliver us up into a reprobate sense (Rom. 1:28), it is to be understood that God does it by just judgment, as a just judge and avenger.</p></blockquote>
<figcaption>— <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a>, <cite>The Second Helvetic Confession (1566)</cite>, ch. 8</figcaption>
<div class="meta"><a class="tag" href="../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../topics/church/confessions.html">Confessions &amp; Creeds</a><a class="tag" href="../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../topics/god/nature-and-attributes.html">Nature &amp; Attributes</a><a class="tag" href="../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../topics/god/justice.html">Justice</a></div>

</figure><figure class="quote" id="q-e710bbc718" data-kw="Author of sin" data-pol="">
<blockquote><p>Although all the power of the creature to act is from the Creator, and there is a providence of God always extended to every creature, and to every action of the creature; yet we judge that the final corruption of the creature, and the sinfulness of the creature’s action, is from the creature, and not from God; and that it is a great sin to say that God is the author of sin (Eccl. 7:29; Hab. 1:13; James 1:13–15: 1 Cor. 14:33; 1 John 2:16).</p></blockquote>
<figcaption>— <a href="../authors/benjamin-cox.html">Benjamin Cox</a>, <cite>An Appendix to a Confession of Faith (Baptist, 1646)</cite>, art. 3</figcaption>

</figure><figure class="quote" id="q-4b8c25085e" data-kw="Author of sin" data-pol="">
<blockquote><p>But although God by his providence governs even sins, yet he is not the cause or author of sin: because he takes no delight in sin, but rather abhors it; nor does he himself sin, or can he sin; likewise because he neither commands nor persuades sin; nor does he pour malice into those who sin, nor compel them to sin; and moreover he directs all things to a good end.</p></blockquote>
<figcaption>— <a href="../authors/johannes-piscator.html">Johannes Piscator</a>, <cite>Aphorisms of Christian Doctrine</cite>, Locus 6, aph. 3</figcaption>
<div class="meta"><a class="tag" href="../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../topics/decrees-and-providence/providence.html">Providence &amp; Government</a></div>

</figure><figure class="quote" id="q-215040d6fd" data-kw="Author of sin|Justice|Satan|The Fall" data-pol="">
<blockquote><p>And just as he that wishes to punish someone by fumigating with a foul smell, sulfur and dung, does not put a foul smell into the sulfur and dung (it already is there), so God, when He punishes sins through the devil and the vessels of wrath with sins, does not put any sin into them, but it is there naturally since the fall in the devil and in men (Eph. 4; Rom. 1).</p></blockquote>
<figcaption>— <a href="../authors/synod-of-debrecen.html">Synod of Debrecen</a>, <cite>Documents of the Synod of Debrecen (1567)</cite></figcaption>

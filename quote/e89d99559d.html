<blockquote><p>The determining influence of the federal theology is also obvious upon the doctrine of Vocation. The elect seed of Christ who were represented by him in the impetration of redemption must in time be called into spiritual and living union with him as their head, or his obedience unto death would prove an utter failure. But they are in themselves spiritually dead, in consequence of the breach of the covenant of works by their first representative. The vocation must, therefore, of necessity, be accomplished by almighty and creative power. Such power is efficacious and irresistible.

Nothing, before it is created, can resist the power which calls it into existence. The dead cannot resist the power that raises them. This power which calls the elect from spiritual death into vital union with their federal head is Grace. The doctrine of efficacious, irresistible grace is thus briefly but conclusively established by the requirements of the federal system.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Federal Theology: Its Import and its Regulative Influence in Memorial Volume of the Semi-Centennial of the Theological Seminary at Columbia, South Carolina</cite></span></figcaption>

<blockquote><p>[19] Q. What is the outward theological calling? An. It is medium ad salitem [a means to salt], as the word and sacraments and the members of the visible church belong unto it. [20] Q. What is that inward theological calling? An. It is when God’s word brings [God’s word’s ring?] does not rest in our outward ears but comes into the heart and works somewhat there. [21] Q. How many ways [is] this taken? An. It is either effectual or ineffectual. [22] Q. What is the inward ineffectual calling? An. When it comes into the heart and falls as on stony ground. [23] Q. How far may this inward ineffectual calling bring us? An. To these four degrees of grace principally. 1. It may bring a man to see his own sin &amp; misery. 2ly. It may so work upon him, as it may bring him to have a desire after the thing persuaded [for?] 3ly It may bring him to some kind of degree of possession of the thing called for. 4ly It may bring him to some outward correspondence, as to reform many sins. [24] Q. Why then is it called an ineffectual calling? An. Because it does not fully persuade [the] heart to come in. … [30] Q. By what wording in scripture is our vocation expressed? An. By many expressions: as first by alluring and persuading. Hos. 2:14. 2ly by inviting and compelling. Math 22:4. 3ly by stretching out of the hand. Rom. 10:21. 4ly by beseeching, 2 Cor. 5:20. 5ly by drawing us. John 6.44. Lastly by apprehending. [31] Q. Do all these properly belong to effectual calling? An. No, the four first may be applied to ineffectual calling. … [38] Q. Whither do effectual and ineffectual calling differ in this respect or no, do not both come from God? An. They agree in this that both proceed from God, yet they differ in regard of the manner of work, for God does the work not secundum propositum [according to the purpose], but secundum obviam [according to the thing encountered]. … [55] Q. What and how many are the instrumental causes of our vocation? An. They are of two sorts either primary or secondary? [56] Q. What were the primary? An. The word. [57] Q. In what propositions was that expressed? An. James 5:11 [1:21?] suggests the word is the ordinary means whereby He calls and so by consequence the ministry of it. 2d. That it was but an instrumental cause under God and so it’s called the [sassed?] of God, the arm of god and sometime the power of God. 3ly. That as it’s but an instrumental cause so it did only belong to those which are adults, for infants may be said to be sanctified but not called. 4. That it was but a separable instrument. [58] Q. How can we say if the converting word is a separable means? An. For two reasons: Because the word may be without the Spirit. 2. Because the Spirit may be and may call some without the word. … [86] Q. Now you have spoken of the primary instruments of salvation as the word and sacraments. What are the secondary instruments? An. They are many as: 1. The mercies and favors of God common to all. Rom. 10:21 [“But to Israel he saith, All day long I have stretched forth my hands unto a disobedient and gainsaying people.”]. Bounty is one thing that may cause love so that one main instrument or means God uses to call us home which is to draw us with the thick cords of love [Hos. 11:4]. … [95] Q. Whether do effectual and ineffectual calling differ in this [Q: 94: ‘who are they whom God is thus pleased to call’]? An. Yes, for the ineffectual calling, many are called but few are chosen.</p></blockquote>

<blockquote><p>For God in his mercy has permitted the powers of the intellect to remain, though differing greatly from what was in man before the fall. God commands us to cultivate our natural talents, and meanwhile adds both gifts and success. And it is obvious that we make no progress in all the arts without God’s blessing. In any case, Scripture refers all the arts to God; and, indeed, the heathen trace the origin of the arts to the gods who invented them.</p></blockquote>

</figure><figure class="quote" id="q-5a9ff143d4" data-kw="">
<blockquote><p>Again, when Christ speaks of being lifted up, that he might draw all men unto him, it implies that there was a fitness in this for compassing the design, or that his crucifixion was the most apt, powerful, and effective means for producing such a result, as the drawing of men to him. Wonderful as the goodness was which distinguished his course on earth, and bright as were the rays of glory which shone around his whole career, he still made little progress in winning the hearts of men. Knowing, as he well did, the hardness and obstinacy of these hearts, he knew it was not enough—that something must yet be done much more fitted to attract and move; but it shall be done, says he, when I am lifted up. When I have been bruised to death on the accursed tree, then other effects shall begin to flow, the glory of the Lord shall be seen to shine from me with surpassing brightness, and even the hardest hearts shall be melted and subdued.

This entirely accords with all Christ’s dealings towards men, whom he ever treats as rational and thinking creatures; not as machines that are simply to be impelled by the strong hand of power, but as possessed of wills that are to be consulted, influenced, persuaded; and so requiring to be addressed by arguments or motives fitted to produce the desired result. And such means, whatever the result may be toward which they are directed, being chosen by infinite wisdom, are always the very best that could be selected or devised. If this be the case generally, especially must it be so here, where his grandest work lies, and his highest glory is concerned.

The end here is, to have sinners drawn to him with the cords of love, and united in an everlasting fellowship of peace and blessing; and the chosen means for attaining it is, the exhibition of a crucified Redeemer, lifted up and dying for sinners on a malefactor’s cross. Where, we may well exclaim, could any thing be found so well adapted for such a purpose? What could even be conceived more admirably fitted to reach the inmost feelings of the heart, and move it out of all the thoughts and devices which naturally tend to keep it in alienation from the life of God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-fairbairn.html">Patrick Fairbairn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ on the Cross Drawing all Men to Him in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

This entirely accords with all Christ’s dealings towards men, whom he ever treats as rational and thinking creatures; not as machines that are simply to be impelled by the strong hand of power, but as possessed of wills that are to be consulted, influenced, persuaded; and so requiring to be addressed by arguments or motives fitted to produce the desired result. And such means, whatever the result may be toward which they are directed, being chosen by infinite wisdom, are always the very best that could be selected or devised. If this be the case generally, especially must it be so here, where his grandest work lies, and his highest glory is concerned.

The end here is, to have sinners drawn to him with the cords of love, and united in an everlasting fellowship of peace and blessing; and the chosen means for attaining it is, the exhibition of a crucified Redeemer, lifted up and dying for sinners on a malefactor’s cross. Where, we may well exclaim, could any thing be found so well adapted for such a purpose? What could even be conceived more admirably fitted to reach the inmost feelings of the heart, and move it out of all the thoughts and devices which naturally tend to keep it in alienation from the life of God?”

— Patrick Fairbairn, Christ on the Cross Drawing all Men to Him in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAgain%2C+when+Christ+speaks+of+being+lifted+up%2C+that+he+might+draw+all+men+unto+him%2C+it+implies+that+there+was+a+fitness+in+this+for+compassing+the+design%2C+or+that+his+crucifixion+was+the+most+apt%2C+powerful%2C+and+effective+means+for+producing+such+a+result%2C+as+the+drawing+of+men+to+him.+Wonderful+as+the+goodness+was+which+distinguished+his+course+on+earth%2C+and+bright+as+were+the+rays+of+glory+which+shone+around+his+whole+career%2C+he+still+made+little+progress+in+winning+the+hearts+of+men.+Knowing%2C+as+he+well+did%2C+the+hardness+and+obstinacy+of+these+hearts%2C+he+knew+it+was+not+enough%E2%80%94that+something+must+yet+be+done+much+more+fitted+to+attract+and+move%3B+but+it+shall+be+done%2C+says+he%2C+when+I+am+lifted+up.+When+I+have+been+bruised+to+death+on+the+accursed+tree%2C+then+other+effects+shall+begin+to+flow%2C+the+glory+of+the+Lord+shall+be+seen+to+shine+from+me+with+surpassing+brightness%2C+and+even+the+hardest+hearts+shall+be+melted+and+subdued.%0A%0AThis+entirely+accords+with+all+Christ%E2%80%99s+dealings+towards+men%2C+whom+he+ever+treats+as+rational+and+thinking+creatures%3B+not+as+machines+that+are+simply+to+be+impelled+by+the+strong+hand+of+power%2C+but+as+possessed+of+wills+that+are+to+be+consulted%2C+influenced%2C+persuaded%3B+and+so+requiring+to+be+addressed+by+arguments+or+motives+fitted+to+produce+the+desired+result.+And+such+means%2C+whatever+the+result+may+be+toward+which+they+are+directed%2C+being+chosen+by+infinite+wisdom%2C+are+always+the+very+best+that+could+be+selected+or+devised.+If+this+be+the+case+generally%2C+especially+must+it+be+so+here%2C+where+his+grandest+work+lies%2C+and+his+highest+glory+is+concerned.%0A%0AThe+end+here+is%2C+to+have+sinners+drawn+to+him+with+the+cords+of+love%2C+and+united+in+an+everlasting+fellowship+of+peace+and+blessing%3B+and+the+chosen+means+for+attaining+it+is%2C+the+exhibition+of+a+crucified+Redeemer%2C+lifted+up+and+dying+for+sinners+on+a+malefactor%E2%80%99s+cross.+Where%2C+we+may+well+exclaim%2C+could+any+thing+be+found+so+well+adapted+for+such+a+purpose%3F+What+could+even+be+conceived+more+admirably+fitted+to+reach+the+inmost+feelings+of+the+heart%2C+and+move+it+out+of+all+the+thoughts+and+devices+which+naturally+tend+to+keep+it+in+alienation+from+the+life+of+God%3F%E2%80%9D%0A%0A%E2%80%94+Patrick+Fairbairn%2C+Christ+on+the+Cross+Drawing+all+Men+to+Him+in+The+Free+Church+Pulpit%3B+Consisting+of+Discourses+by+the+Most+Eminent+divines+of+the+Free+Church+of+Scotland.+Vol.+I.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5a9ff143d4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5a9ff143d4.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/12/18/patrick-fairbairn-on-christ-dying-and-drawing/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>3… But more especially the Holy Ghost is compared to a wind in respect of its irresistable workings; as nothing can resist the wind, it goes and blows which way soever it will; so nothing can resist the Spirit of God, wheresoever it has a purpose to work efficaciously; I will not say, but the heart of a man may resist and reject the work of the Spirit in some measure, and in some degrees; Stephen told the Jews, they had always resisted the Holy Ghost (Act. 7:51); and the apostle tells of strong holds, and of every high thing that exalts itself against God (2 Cor. 10:5); so there is a natural contrariety, a constant enmity and active resisting of God’s Spirit by our spirits; we must therefore distinguish between a prevalent and a gradual resisting; the Spirit in conversion so works that He takes away the prevalent, but not the gradual resisting; A man before he be converted is froward, and full of cavils and prejudices; he is unwilling to be saved; he cannot abide the truth; he does what he can to stifle all good motions: yet if he belong to the election of grace, God will at last over-master his heart and make him of unwilling, willing; He will omnipotently bow and change the will and work on his soul by his mighty power efficaciously, insuperably and irresistably.</p></blockquote>

<blockquote><p>Nothing but the Divine Essence can make us happy in the life to come… Not a perfect enjoying of Christ the Mediator, because He as Mediator, has his happiness in another, Ps. 16, end, it is spoken of Christ. The highest object of faith must be to the soul the highest ground of joy; the essence of God is the ultimate object of faith, 1 Pet. 1:21.</p></blockquote>

<blockquote><p>The most studied source for Gerald Odonis’ doctrine of the beatiﬁc vision is the text of his Advent 1333 disputed question known as his Quodlibet. The polemic nature of the question and its structural idiosyncrasies have led to diﬃculties in interpreting Odonis’ theory of the ‘middle vision’ of the divine essence that the separate souls of the blessed have, as well as in understanding his defense of Pope John XXII’s controversial opinion [that saints do not enjoy the complete Beatific Vision till after the Final Judgment] (which excludes such a middle vision). By relating Odonis’ 1333 disputation to his earlier commentary on the Sentences… this paper shows how Odonis tried to ﬁt his doctrine of the ‘middle vision’ with his previous discussion…</p></blockquote>

<blockquote><p>Shall men know one another in this eternal life? Yea verily, for they shall be full of the Holy Spirit, and of wisdom, as Adam before his Fall, keeping as then the integrity of God’s image, acknowledged Eve, whom he had never seen, and whence she was, being told of no man, Gen. 2:23. As Peter on the mountain, receiving only a certain taste of life-eternal in his mortal body, knew by inward revelation Moses and Elias, whom he never saw, Mt. 17:3-4, yet this shall not be a carnal, but a spiritual knowledge.</p></blockquote>

</figure><figure class="quote" id="q-b0cd5d6e63" data-kw="">
<blockquote><p>For affections or passions in man, they are of two sorts:

1. Sensual belonging to the sensitive appetite and directed by the fantasy: these are common to brute beasts with us, and arise from one like temper and constitution in both. The object of these is all natural good or evil.

2. Rational, appertaining to the reasonable appetite or will, and guided by the understanding. These are proper to man, and they have their original from the substance of the reasonable soul, in which they always remain, not only when it is in the body, but even when tis severed from it. For fear, hope, love, hatred, joy, grief, etc. are in the damned and blessed spirits as well as living men. The object of these properly human passions is all moral and spiritual good or evil. I need not among so many learned, artists stand curiously upon the distinction of these two sorts of passions in man: the identity of names in both sorts has caused some confusion, but in reason the diversity of their nature is evident. Wherefore I go on to see what is meant by excitation or stirring up of the affections: whereby we can understand nothing else but their right and orderly motions about their proper objects. As in the particulars, sensual passions are then duly excited when they are moved about any natural good or evil, according to the instinct of nature in brute beasts and according to the same instinct of nature in man, but guided and moderated by right reason. Reasonable affections are then duly stirred up when their motions about all spiritual and moral good or evil are conformable to the quality of the object affected and to the rules of a rightly informed understanding.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith</cite>, … (London: 1627), pp. 125-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

<blockquote><p>A conclusion certain enough: God loves himself.” p. 100 Proof: 1) A perfect being’s love seems to be a pure perfection; therefore it belongs to God and indeed in supreme degree. The proof of the antecedent is: a) If love of this sort were not a pure perfection formally, it could be reduced to one or other pure perfections that were not formally love. But I do not see how such love could be reduced to something that was [not] formally love. b) To love seems to be better than not to love; therefore love seems to be a pure perfection, because it is better than what is incompatible with it (namely not to love). The proof of the antecedent here is: a distinction must be drawn between love of friendship (benevolence) and love of concupiscence. The former is love of an object for its own sake, that is, because of the object’s intrinsic perfection, and this love does not seem to involve imperfection in the lover. Love of concupiscence is love of an object and not for the object’s sake finally but because the object perfects the lover or is a good for the lover. But this love does involve imperfection because the object is wanted precisely because it perfects a lover that is in itself capable of perfection. 2) Blessedness seems to be a pure perfection, and therefore it belongs to God in supreme degree. But love seems to be either the principal element in blessedness, or at any rate intimately connected with the blessedness of an intellectual being. That blessedness is a pure perfection is clear from the notion of it; for blessedness is nothing other than an intellectual being pleased, that follows upon possession of one’s proper perfection. But God knows himself as infinitely perfect; he seems, therefore, to be blessed; therefore blessedness seems to be a pure perfection. That this blessedness is not simply intellection, but includes an act of will or love, seems to follow from the fact that there is in God some operation besides what is formally called intellection, for God is formally willing, at least in respect of creatures. (See the next chapter [Part 3] about the proof of free volition in God.) For if God freely creates things outside himself and so has volition, it seems that he also has some act of volition, namely love, toward himself. 3) God is the first cause of all love in us. Hence he has this perfection either formally or virtually. If you concede that the love is better than not to love, God cannot have love only virtually, because the more imperfect does not include the more perfect virtually. Therefore God has love formally. As was said above about divine intellection, this divine love is not something really distinct from God’s essence. It extends, therefore, to everything that is really identified with the same essence. Hence it can be said that God loves his essence, his decrees, his knowledge, etc. This love is also eternal, unchangeable, non-contingent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Allan Wolter’s Conclusions respecting Reality, Proving God’</cite>, (1958), ‘Proof of God’</span></figcaption>

— Allan Wolter, ‘Allan Wolter’s Conclusions respecting Reality, Proving God’ (1958), ‘Proof of God’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+conclusion+certain+enough%3A+God+loves+himself.%E2%80%9D+p.+100+Proof%3A+1%29+A+perfect+being%E2%80%99s+love+seems+to+be+a+pure+perfection%3B+therefore+it+belongs+to+God+and+indeed+in+supreme+degree.+The+proof+of+the+antecedent+is%3A+a%29+If+love+of+this+sort+were+not+a+pure+perfection+formally%2C+it+could+be+reduced+to+one+or+other+pure+perfections+that+were+not+formally+love.+But+I+do+not+see+how+such+love+could+be+reduced+to+something+that+was+%5Bnot%5D+formally+love.+b%29+To+love+seems+to+be+better+than+not+to+love%3B+therefore+love+seems+to+be+a+pure+perfection%2C+because+it+is+better+than+what+is+incompatible+with+it+%28namely+not+to+love%29.+The+proof+of+the+antecedent+here+is%3A+a+distinction+must+be+drawn+between+love+of+friendship+%28benevolence%29+and+love+of+concupiscence.+The+former+is+love+of+an+object+for+its+own+sake%2C+that+is%2C+because+of+the+object%E2%80%99s+intrinsic+perfection%2C+and+this+love+does+not+seem+to+involve+imperfection+in+the+lover.+Love+of+concupiscence+is+love+of+an+object+and+not+for+the+object%E2%80%99s+sake+finally+but+because+the+object+perfects+the+lover+or+is+a+good+for+the+lover.+But+this+love+does+involve+imperfection+because+the+object+is+wanted+precisely+because+it+perfects+a+lover+that+is+in+itself+capable+of+perfection.+2%29+Blessedness+seems+to+be+a+pure+perfection%2C+and+therefore+it+belongs+to+God+in+supreme+degree.+But+love+seems+to+be+either+the+principal+element+in+blessedness%2C+or+at+any+rate+intimately+connected+with+the+blessedness+of+an+intellectual+being.+That+blessedness+is+a+pure+perfection+is+clear+from+the+notion+of+it%3B+for+blessedness+is+nothing+other+than+an+intellectual+being+pleased%2C+that+follows+upon+possession+of+one%E2%80%99s+proper+perfection.+But+God+knows+himself+as+infinitely+perfect%3B+he+seems%2C+therefore%2C+to+be+blessed%3B+therefore+blessedness+seems+to+be+a+pure+perfection.+That+this+blessedness+is+not+simply+intellection%2C+but+includes+an+act+of+will+or+love%2C+seems+to+follow+from+the+fact+that+there+is+in+God+some+operation+besides+what+is+formally+called+intellection%2C+for+God+is+formally+willing%2C+at+least+in+respect+of+creatures.+%28See+the+next+chapter+%5BPart+3%5D+about+the+proof+of+free+volition+in+God.%29+For+if+God+freely+creates+things+outside+himself+and+so+has+volition%2C+it+seems+that+he+also+has+some+act+of+volition%2C+namely+love%2C+toward+himself.+3%29+God+is+the+first+cause+of+all+love+in+us.+Hence+he+has+this+perfection+either+formally+or+virtually.+If+you+concede+that+the+love+is+better+than+not+to+love%2C+God+cannot+have+love+only+virtually%2C+because+the+more+imperfect+does+not+include+the+more+perfect+virtually.+Therefore+God+has+love+formally.+As+was+said+above+about+divine+intellection%2C+this+divine+love+is+not+something+really+distinct+from+God%E2%80%99s+essence.+It+extends%2C+therefore%2C+to+everything+that+is+really+identified+with+the+same+essence.+Hence+it+can+be+said+that+God+loves+his+essence%2C+his+decrees%2C+his+knowledge%2C+etc.+This+love+is+also+eternal%2C+unchangeable%2C+non-contingent.%E2%80%9D%0A%0A%E2%80%94+Allan+Wolter%2C+%E2%80%98Allan+Wolter%E2%80%99s+Conclusions+respecting+Reality%2C+Proving+God%E2%80%99+%281958%29%2C+%E2%80%98Proof+of+God%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff5e879f068.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f5e879f068.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/of-blessedness/#:~:text=A%20conclusion%20certain%20enough%3A%20God%20loves,love%20is%20also%20eternal%2C%20unchangeable%2C%20non%2Dcontingent&amp;text=A%20conclusion%20certain%20enough%3A%20God%20loves%20himself.%E2%80%9D%20p&amp;text=etc.%20This%20love%20is%20also%20eternal%2C%20unchangeable%2C%20non%2Dcontingent" rel="noopener" tar

<main class="wrap"><figure class="quote" id="q-f4347ee5eb" data-kw="">
<blockquote><p>The most that these [particular] arguments of our [separatist] Brethren do prove, is but that it is lawful to go, and dwell in a congregation where Christ is worshiped in all his ordinances, rather than to remain in that congregation where He is not worshipped in all his ordinances and where the Church censures are neglected, which to us is no separation from the visible Church, but [only] a removal from one part of the visible Church to another, as he separates not out of the house, who removes from the gallery, to remain and lie and eat in the chamber of the same house, because the gallery is cold and smokey, and the chamber not so, for he has not made a vow never to set his foot in the gallery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Due Right of Presbyteries... (London, 1644), pt. 1, ch. 4, section 4, question 5</cite>, p. 73</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0ebff07e49" data-kw="">
<blockquote><p>And is it likely, where the order formerly laid down is observed, that there can be habitual admission of notoriously or grievously scandalous persons, though, it may be, there be lesser fallings of several sorts: Yet, supposing that any out of infirmity or affection, not having such knowledge, or otherwise, should stick to join in the ordinances at some times, or in some places, upon such an account, who yet do not love separation, or the erecting of a different Church, we say further: 1. That, in such a case, such persons may remove from one congregation to another, where such grossness cannot be pretended to be; and the persons being otherwise without scandal, can neither be pressed to continue (they being so burdened) nor yet refused to be admitted where orderly they shall desire to join, seeing this could not be denied to any. And, we suppose few will be so uncharitable as to think there is no congregation whereunto they can join, or yet so addicted to outward respects, as to choose separation with offence to others, disturbance to the Church, and, it may be, with little quietness to themselves, whenas they have a remedy so inoffensive allowed unto them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or, A Treatise Concerning Scandal (1659), pt. 2, ch. 15</cite>, p. 152</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-e4304c57e2" data-kw="">
<blockquote><p>I know what dreadful consequences would attend a needless separation from the established Church, however I am treated by the corrupt members and ministers of it; for I judge of the state of a Church, not from the practice of its members, but its primitive and public constitution; and so long as I think the articles of the Church of England are agreeable to Scripture, I’m resolved to preach them up, without either bigotry or party-zeal; for I love all that love the Lord Jesus.</p></blockquote>

</figure><figure class="quote" id="q-0c70f018ea" data-kw="">
<blockquote><p>Beware of division yourselves, and give your help to recover, in all tenderness, these that have withdrawn, and encourage them not in their way. I’m persuaded that if they were not so much countenanced and encouraged by these that are hearers, the number of such would not be so great as it is. Let not that itching ear get place with you, so as to run away to their meetings whenever you have opportunity, and so to cast yourselves into a snare, and to do what in you lies to strengthen the division.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders, 1740</cite></span></figcaption>

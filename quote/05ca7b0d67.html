<main class="wrap"><figure class="quote" id="q-05ca7b0d67" data-kw="">
<blockquote><p>…relying and resting upon the obedience of Christ crucified alone, which becomes ours when we believe in Him. This is sufficient to cover all our iniquities, and to give us confidence in approaching to God; freeing the conscience of fear, terror, and dread, without following the example of our first father, Adam, who, trembling, attempted to cover himself with fig leaves.</p></blockquote>
<figcaption>— <a href="../authors/guido-de-bres.html">Guido de Brès</a>, <cite>Belgic Confession</cite>, Art. 23</figcaption>
<div class="meta"><a class="tag" href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a><a class="tag" href="../topics/assurance-peace-and-joy/doubts-and-fears.html">Doubts and Fears</a></div>

<figcaption>— <a href="../authors/charles-hodge.html">Charles Hodge</a>, <cite>Justification, the Law, and the Righteousness of Christ</cite>, I.A, “Introduction”</figcaption>

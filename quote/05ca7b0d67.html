<main class="wrap"><figure class="quote" id="q-05ca7b0d67" data-kw="">
<blockquote><p>Therefore, we always hold fast this foundation, ascribing all the glory to God, humbling ourselves before Him, and acknowledging ourselves to be such as we really are, without presuming to trust in any thing in ourselves, or in any merit of ours, relying and resting upon the obedience of Christ crucified alone, which becomes ours when we believe in Him. This is sufficient to cover all our iniquities, and to give us confidence in approaching to God; freeing the conscience of fear, terror, and dread, without following the example of our first father, Adam, who, trembling, attempted to cover himself with fig leaves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belgic Confession</cite>, Art. 23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span><span class="t"><a href="../topics/assurance-peace-and-joy/doubts-and-fears.html">Doubts and Fears</a></span></div>

</figure><figure class="quote" id="q-86ce0050dd" data-kw="">
<blockquote><p>Christ, by his obedience and death, did fully discharge the debt of all those who are justified; and did, by the sacrifice of himself in the blood of his cross, undergoing in their stead the penalty due to them, make a proper, real, and full satisfaction to God’s justice in their behalf; yet, in as much as he was given by the Father for them, and his obedience and satisfaction accepted in their stead, and both freely, not for anything in them, their justification is only of free grace, that both the exact justice and rich grace of God might be glorified in the justification of sinners (Heb. 10:14; 1 Pet. 1:18–19; Isa. 53:5–6; Rom. 8:32; 2 Cor. 5:21; Rom. 3:26; Eph. 1:6–7; 2:7).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 11.3</span></figcaption>

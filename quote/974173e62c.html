<main class="wrap"><figure class="quote" id="q-974173e62c" data-kw="infallibility of the church">
<blockquote><p>(4) Man cannot be the infallible interpreter of the Scriptures and judge of controversies because he is liable to error. Our faith cannot be placed in him, but upon God alone from whom depends the sense and meaning of the Scriptures and who is the best interpreter of his own words. As the only teacher, he can best explain the meaning of the law (Mt. 23:8, 10); our lawgiver who is able to save and to destroy (Jam. 4:12). If the rulers of the church are influenced by the Holy Spirit, they do not cease to be men and therefore fallible. For their inspiration is only ordinary and common, not extraordinary and special (conferring the gift of infallibility which the apostles and prophets had). Because the Scriptures recognize none except God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cb317aa3f1" data-kw="">
<blockquote><p>For that the doctrine there is most impure, we have demonstrated through its several parts. But if it is asked about morals, come, let the very histories of the Roman pontiffs (which the parasites of the pontiffs wrote) be compared with whatever monsters of men ever existed from the founding of the world, and it will be found that in this one seat more was permitted to Satan than in any tyranny that ever oppressed the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, ch. 7</span></figcaption>

</figure><figure class="quote" id="q-eb26639659" data-kw="">
<blockquote><p>As to one thing there was no doubt, viz., that whoever should be allowed to sit and give their opinion, all of them, some ensnared by ambition, others blinded by avarice, others inflamed with rage, would be mortal enemies to sound doctrine, and being bound together in secret conspiracy to establish the tyranny of the Pope, would exert themselves to destroy the kingdom of Christ.</p></blockquote>

</figure><figure class="quote" id="q-b971b9c2fa" data-kw="">
<blockquote><p>But, in reality, this reconciliation will prove a total defection from the protestant religion; for the church of Rome neither will nor can part with any thing that shall change its antichristian state and idolatrous worship. The whole of their pretension is but a decoy to get us into their power; where we shall be made to understand both where we are and where we have been also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief and Impartial Account of the Nature of the Protestant Religion</cite></span></figcaption>

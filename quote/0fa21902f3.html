<blockquote><p>1041. But it should be noted that although he says that taxes are owed to rulers as a wage for their labours, rulers can sin in two ways by accepting taxes.

First, if they do not procure the people’s welfare but are intent only on seizing their goods. Hence it says in Ezekiel: you eat the fat, you clothe yourselves with the wool, you slaughter the fatlings, but you do not feed the sheep (Ezek 34:3).

Second, if they violently take more than the law permits and more than the people can bear. Hence it says in Micah: hear, you heads of Jacob and rulers of the house of Israel! Is it not you who tear the skin from my people, and their flesh from their bones? (Mic 3:1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super Epistolam B. Pauli ad Romanos lectura</cite>, (c. 1259-65), C. 13, L. 1, 1041.</span></figcaption>

<blockquote><p>Abstract reasoning is in many cases eminently serviceable in showing the thorough consistency of theological truth with philosophy and science truly so called. And the wise defenders of the faith will be forward to show that there is no incongruity, and indeed no want of mutual support, between theology, the Queen of Sciences, and her many handmaids in every department of solid thought and legitimate investigation.

And when a great ultimate scriptural truth is set forth in its own magnificent proportions, and on its own appropriate evidence, it is one of the worthiest exercises of the human intellect to show that it conflicts with nothing that the intellect of man has discovered or trustworthily accepted. This is to assign to theology its own proper sphere, and to leave theology in its own unaided majesty.</p></blockquote>

</figure><figure class="quote" id="q-ea8d5d723b" data-kw="">
<blockquote><p>And to the same purpose is that which Bonaventure has: Since non-being is a privation of being, it does not fall within the intellect except through being. But being does not fall (within the intellect) through something else; because everything that is understood is understood either as non-being, or as being in potency, or as being in act. If, therefore, non-being cannot be understood except through being, and being in potency cannot be understood except through being in act, and since being names the pure act of that which is, therefore being is that which first falls within the intellect. And that being is the pure act; but this is not particular being, which is being narrowed (or restricted), because that is mixed with potency; nor analogical being, because that has the least degree of act, inasmuch as it is the least actual. It remains, therefore, that that being is the divine being. Therefore remarkable is the blindness of the intellect, which does not consider that which it sees first, and without which it can know nothing. For just as the eye, intent upon the various differences of colors, does not see the light by which it sees the rest—and if it sees it, nevertheless does not notice it—so the eye of our mind, intent upon these particular and universal beings, does not take notice of being itself, which is outside of every genus, although it first presents itself to the mind and through it the others. Whence it very truly appears that, just as the eye of a bat is related to the light, so is the eye of our mind related to the most manifest things of nature. For being accustomed to the darkness of beings and the phantasms of sensible things, when it gazes upon the very light of the highest Being, it seems to itself to see nothing—failing to understand that this very darkness is the supreme illumination of our mind; just as when the eye sees pure light, it seems to itself to see nothing.</p></blockquote>

</figure><figure class="quote" id="q-eee29e7453" data-kw="">
<blockquote><p>I say that although things other than God are in fact contingent in respect of actual being, they are not so in respect of potential being. So things that are contingent with respect to actual existence are necessary with respect to possible existence, as that although it is contingent that man exists yet that his existence is possible is necessary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), Intro, p. 9 | This very evident proposition, although it is in itself a necessary one (as will be shown later), is yet a proposition that for us is purely contingent. Hence, in order to preserve the condition of Aristotelian science that the principles be necessary, we can infer something necessary from the contingent proposition ‘something is’, namely the proposition that ‘the existence of something is possible’ or that ‘there is no repugnance between something and existence’. For as Scotus well observes (Lectura 1)</span></figcaption>

<blockquote><p>We should not immediately reject a doctrine, or even doubt it, just for the sake of mental exercise… Problem 1. In order to do theology freely and skillfully, should we clear our minds of all preconceptions to the point that we doubt everything we have learned through diligent study, meditation, and the teaching of our instructors, and treat it all as false (even if it is not), until the truth is inscribed anew on our minds like a blank slate, after proper and methodical inquiry and demonstration based on certain principles? Answer: No. The Remonstrants wanted the National Synod to revise the Confession and Catechism, and they wanted the Synod members to be released from affirming the Belgic Catechism and Confession in the meantime, supposedly so they would not be hindered by any preconceptions in perceiving and judging the truth. Therefore, should we have temporarily suspended our agreement with, belief in, and profession of the truths attested by our affirmation (e.g., in articles 1 and 2 of the Confession)? Therefore, should the Reformed Synod have re-examined and investigated the article or thesis ‘That there is a God?’ I ask the same about the truths and theses of natural theology or philosophy concerning God, his attributes and works, providence, the distinction between moral good and evil, the honorable and the base, etc. I ask the same about the basic catechetical elements instilled and proven from God’s word in infancy, childhood, and adolescence, before someone devoted himself to theological studies in an academic program.</p></blockquote>

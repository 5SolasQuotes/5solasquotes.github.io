<blockquote><p>3. That the Fraternity only, and no women, gave their tacit [understood or implied without being stated] consent to the choosing of Matthias (Acts 1), of the deacons (Acts 6), of the elders (Acts 14:23), since their consciences were concerned and they are parts of the fed and redeemed Church as well as men, can never be proved; and who can deny women to be of the plebs, people and fraternity, as Cyprian speaks? and of the brethren that Paul, James and the apostles wrote unto?</p></blockquote>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea... (London, 1642), ch. 19</cite>, p. 287</span></figcaption>

</figure><figure class="quote" id="q-8bc9b3d8f1" data-kw="">
<blockquote><p>8. Concerning the 17th Proposition (which many will stumble at), I desire you to observe these things: 1. That as we avoid the titles of lay-elders and preaching-elders, so we do purposely avoid the determination of that controversy: Whether Christ has appointed ecclesiastical elders, distinct in office from teaching-elders, having no authority to preach, baptize or administer the Lord’s Supper, though they have gifts? I confess my own private opinion is that neither Scripture nor antiquity did know any such church-officers: But as I so much reverence and value the contrary minded, as not to expect that my judgment should stand in any competition with theirs, or in the least to sway any man to my opinion from theirs (though upon the concurrent judgment of so many learned men that are of the same opinion with me, I might reasonably expect that other men’s reputation should create no prejudice), so it is nothing to my brethren, nor the sense of our Agreement, what my private opinion is. We are not so unconscionably self-conceited or divisive as to think we must or may reject all those from our communion that differ in this point from us: or that it is a matter of so great moment that may hinder our fraternal and peaceable Association. 2. We have therefore agreed of the work of assisting-elders, and leave the discussion of their further authority and distinction of their office from teaching-elders, to others. 3. And that each party may well agree to this Proposition, without forsaking their principles, is beyond doubt. For the presbyterians and the congregational party, they both are for such elders as shall rule and not administer sacraments; and though some of one sort [congregationalists], say they may preach: 1. They say not that they must preach where the teaching-elders are well and present; 2. And perhaps it is because they would allow another gifted member to do the like. And for the episcopal divines, their practice and their writings prove what I say: For they have ever since the Reformation allowed great numbers of readers in England, of far lower abilities than we express in our Propositions; such as never preached, and some that were fain to labour for their livings in secular employments, as this country knows. And though they allowed them to baptise and administer the Lord’s Supper [by delegation], yet they never affirmed that they must do it when there was an abler minister of the same church to do it. And in their writings they do maintain the lawfulness of placing such reading ministers in chapels or parish churches under able pastors. So that it’s past doubt that we are all agreed that there may be such officers, or elders chosen to do the work that is here expressed. And if any think it a matter of so great necessity that we agree in our belief of these elders’ further power, as that we must not associate with those that agree not, I would intreat him to tell me why it is not in our Creed? or why it never was in the Creed of any Church? or whether no Church had ever a sufficient Creed so large as to contain all points of absolute necessity to salvation, or without which, we must avoid men’s society? or whether he dare yet put it in his Creed among fundamentals, or points of such necessity ‘I believe that lay or mere-ruling elders are, or are not Jure divino?’ Or whether he accuse not the Scripture itself of insufficiency for speaking so darkly of fundamentals themselves as that the most godly and learned are not able to understand it? And whether he lay not a ground of separation from multitudes of eminent learning and piety, yea from whole Churches which Christ Himself owns and will not allow us to separate from? 4. And observe further that the elders that we here speak of are only assistants to able preachers: we do not say that such may be allowed of alone where there is no other to preach (though what might be done in case of necessity, I will not determine). But if a great Church have one or two able men to preach publicly, and will moreover appoint some sober, godly, orthodox men to help them in private oversight, instruction, admonition and reproof; and if one call these ‘lay-elders’ or ‘ruling-elders,’ and another take them to be inferior ministers, as some sober chapel readers were, I would not quarrel about the notions or titles while we agree about the work to be done. Nor would I dare to reproach them with the name of dumb dogs on one side, or lay-elders (as dumb) on the other. 5. I thought meet also to tell you thus much of my own opinion; that it seems to me the best way (at our first ordering of our churches according to these Propositions) to take in none but school-masters, physicians, or other learned men to be elders (where such are to be had that are meet), and for those of our abler hearers that are unlearned, that it will be fittest first to try them in the office of deacons: both because the office of deacons is most unquestionable to all sorts and parties; and so it will avoid the reproaches of dissenters: and because the apostles made deacons before they ordained any fixed elders of particular churches; and they made abler men deacons than any of us are; and therefore none may think the office to be below him; and because it is orderly to ascend by degrees: and the apostles’ words, 1 Tim. 4:8-13, together with the constant expressions and practice of antiquity, do show that this is a degree to the eldership… And the danger of misguiding and dividing our congregations by men of weak judgments is so great that I think it much fitter to try them first in an office of known inferiority (for all confess that deacons should be guided by the elders) wherein they may be as serviceable to the Church than to begin them in an office of mere power, wherein they will think their votes to be of equal authority with the most judicious teachers [Baxter did not hold them to be equal], and so may breed contentions or foment errors or factions in the church; and yet be less capable of doing service than the deacons are (See Mr. Noyes, Temple Measured, of the Office of Deacons and Elders). This course therefore I have propounded to my brethren of this Association; and they think as I do… If any shall refuse the office of deacons as too mean for them, they shall thereby discover that pride that will prove them unfit to be either elders or deacons; and you will have cause to thank God that thereby a mischief to the Church is prevented, which might have followed if such unhumbled men had crept into authority. 6. But the great objection against this Proposition will be (by some) that we allow none to be elders but those that are ordained, and so overthrow mere-ruling elders. To which I answer: 1. These brethren must consider that we are forced for unity to speak indistinctly of all that are mere assisting elders and do not actually preach and administer sacraments, whether they take themselves to have authority to do more (as other ministers) or not: Now they will confess that such inferior or assisting ministers must be ordained: and we cannot now [formally] distinguish [them]. 2. I never could learn that it is the judgment of presbyterians or congregational men that it is unlawful to ordain mere-ruling elders. And if they may do it, why should they not yield to it for peace, though they think not that they must do it? 3. I confess I know of no elders mentioned in Scripture without ordination and do despair of ever seeing it proved that the apostles did appoint two sorts of elders, one ordained and the other not ordained. The contrary I doubt not to prove by sufficient induction. 4. Deacons must be ordained that are inferior to elders; why then should not elders be ordained? 5. Let our brethren take heed lest they loose all their hold of that show they have in Scripture for mere-ruling elders (I mean quoad potestatem [as to the power], not quoad exercitium ordinarium [as to the ordinary exercise]), if they once disclaim all those as no such ruling elders who were ordained. It seems then that when the apostles ordained elders in every Church, and when Titus was left to ordain elders in every city, it was no mere-ruling elders that they ordained or were appointed to ordain! 6. I confess I am loath (without more reasons than I yet know) to give the intruders of the ministry so much encouragement as to tell them men may ordinarily be ruling elders without ordination? For doubtless a man may much more preach up and down in public occasionally without ordination: I mean, more may be said for it. Even some of the most learned episcopal divines think that by the bishop’s allowance private men may preach, and that it belongs more to the pastor to take care what doctrine is taught his people than that himself be the teacher. And most allow the preaching of probationers. And if you add to this that there is no need of ordination to the office of church-governing, I know partly what will follow. 7. Yet a greater doubt is behind, and that is: How we would have these men ordained? I answer: 1. We have not determined of that: We purposely avoid the point of ordination because the distance between the episcopal divines and others is well known in that point: and we resolve not to put such controverted points into our Agreement, lest thereby we necessarily exclude the dissenters. Our business is not now (as is said) to reconcile differences in judgment: much less to divide from those that differ from us: but to practice unanimously so much as we are agreed in. 2. We leave therefore every man in this to his own judgment. Those that are for bishops may be ordained by them with a presbytery, if they can obtain it. Those that are against them, may be ordained by the Associated pastors of that Association, the president performing the action. Those that fear danger from the law of the land if they ordain without authority, may send men to some neighbor county that has authority. Those that will not use the name of ordination may yet use the thing: which is nothing but the solemn designation or appointment of a fit person to the office, by competent men: which is most fitly accompanied with prayer and imposition of hands, where they may be had. 3. To avoid some of these contests, if deacons only be first ordained, as I before mentioned, it will prevent the quarrels that some may else be drawn to by difference of judgment. For many moderate episcopal men will allow presbyters to ordain deacons that will not allow them to ordain presbyters. As for those that will say, These are no true officers, nor to be acknowledged (whether deacons or presbyters) who were not ordained by a bishop, and thereupon will take occasion for a schism in our congregations, I shall speak more fully to their satisfaction anon.</p></blockquote>

congregational+party%2C+they+both+are+for+such+elders+as+shall+rule+and+not+administer+sacraments%3B+and+though+some+of+one+sort+%5Bcongregationalists%5D%2C+say+they+may+preach%3A+1.+They+say+not+that+they+must+preach+where+the+teaching-elders+are+well+and+present%3B+2.+And+perhaps+it+is+because+they+would+allow+another+gifted+member+to+do+the+like.+And+for+the+episcopal+divines%2C+their+practice+and+their+writings+prove+what+I+say%3A+For+they+have+ever+since+the+Reformation+allowed+great+numbers+of+readers+in+England%2C+of+far+lower+abilities+than+we+express+in+our+Propositions%3B+such+as+never+preached%2C+and+some+that+were+fain+to+labour+for+their+livings+in+secular+employments%2C+as+this+country+knows.+And+though+they+allowed+them+to+baptise+and+administer+the+Lord%E2%80%99s+Supper+%5Bby+delegation%5D%2C+yet+they+never+affirmed+that+they+must+do+it+when+there+was+an+abler+minister+of+the+same+church+to+do+it.+And+in+their+writings+they+do+maintain+the+lawfulness+of+placing+such+reading+ministers+in+chapels+or+parish+churches+under+able+pastors.+So+that+it%E2%80%99s+past+doubt+that+we+are+all+agreed+that+there+may+be+such+officers%2C+or+elders+chosen+to+do+the+work+that+is+here+expressed.+And+if+any+think+it+a+matter+of+so+great+necessity+that+we+agree+in+our+belief+of+these+elders%E2%80%99+further+power%2C+as+that+we+must+not+associate+with+those+that+agree+not%2C+I+would+intreat+him+to+tell+me+why+it+is+not+in+our+Creed%3F+or+why+it+never+was+in+the+Creed+of+any+Church%3F+or+whether+no+Church+had+ever+a+sufficient+Creed+so+large+as+to+contain+all+points+of+absolute+necessity+to+salvation%2C+or+without+which%2C+we+must+avoid+men%E2%80%99s+society%3F+or+whether+he+dare+yet+put+it+in+his+Creed+among+fundamentals%2C+or+points+of+such+necessity+%E2%80%98I+believe+that+lay+or+mere-ruling+elders+are%2C+or+are+not+Jure+divino%3F%E2%80%99+Or+whether+he+accuse+not+the+Scripture+itself+of+insufficiency+for+speaking+so+darkly+of+fundamentals+themselves+as+that+the+most+godly+and+learned+are+not+able+to+understand+it%3F+And+whether+he+lay+not+a+ground+of+separation+from+multitudes+of+eminent+learning+and+piety%2C+yea+from+whole+Churches+which+Christ+Himself+owns+and+will+not+allow+us+to+separate+from%3F+4.+And+observe+further+that+the+elders+that+we+here+speak+of+are+only+assistants+to+able+preachers%3A+we+do+not+say+that+such+may+be+allowed+of+alone+where+there+is+no+other+to+preach+%28though+what+might+be+done+in+case+of+necessity%2C+I+will+not+determine%29.+But+if+a+great+Church+have+one+or+two+able+men+to+preach+publicly%2C+and+will+moreover+appoint+some+sober%2C+godly%2C+orthodox+men+to+help+them+in+private+oversight%2C+instruction%2C+admonition+and+reproof%3B+and+if+one+call+these+%E2%80%98lay-elders%E2%80%99+or+%E2%80%98ruling-elders%2C%E2%80%99+and+another+take+them+to+be+inferior+ministers%2C+as+some+sober+chapel+readers+were%2C+I+would+not+quarrel+about+the+notions+or+titles+while+we+agree+about+the+work+to+be+done.+Nor+would+I+dare+to+reproach+them+with+the+name+of+dumb+dogs+on+one+side%2C+or+lay-elders+%28as+dumb%29+on+the+other.+5.+I+thought+meet+also+to+tell+you+thus+much+of+my+own+opinion%3B+that+it+seems+to+me+the+best+way+%28at+our+first+ordering+of+our+churches+according+to+these+Propositions%29+to+take+in+none+but+school-masters%2C+physicians%2C+or+other+learned+men+to+be+elders+%28where+such+are+to+be+had+that+are+meet%29%2C+and+for+those+of+our+abler+hearers+that+are+unlearned%2C+that+it+will+be+fittest+first+to+try+them+in+the+office+of+deacons%3A+both+because+the+office+of+deacons+is+most+unquestionable+to+all+sorts+and+parties%3B+and+so+it+will+avoid+the+reproaches+of+dissenters%3A+and+because+the+apostles+made+deacons+before+they+ordained+any+fixed+elders+of+particular+churches%3B+and+they+made+abler+men+deacons+than+any+of+us+are%3B+and+therefore+none+may+think+the+office+to+be+below+him%3B+and+because+it+is+orderly+to+ascend+by+degrees%3A+and+the+apostles%E2%80%99+words%2C+1+Tim.+4%3A8-13%2C+together+with+the+constant+expressions+and+practice+of+antiquity%2C+do+show+that+this+is+a+degree+to+the+eldership%E2%80%A6+And+the+danger+of+misguiding+and+dividing+our+congregations+by+men+of+weak+judgments+is+so+great+that+I+think+it+much+fitter+to+try+them+first+in+an+office+of+known+inferiority+%28for+all+confess+that+deacons+should+be+guided+by+the+elders%29+wherein+they+may+be+as+serviceable+to+the+Church+than+to+begin+them+in+an+office+of+mere+power%2C+wherein+they+will+think+their+votes+to+be+of+equal+authority+with+the+most+judicious+teachers+%5BBaxter+did+not+hold+them+to+be+equal%5D%2C+and+so+may+breed+contentions+or+foment+errors+or+factions+in+the+church%3B+and+yet+be+less+capable+of+doing+service+than+the+deacons+are+%28See+Mr.+Noyes%2C+Temple+Measured%2C+of+the+Office+of+Deacons+and+Elders%29.+This+course+therefore+I+have+propounded+to+my+brethren+of+this+Association%3B+and+they+think+as+I+do%E2%80%A6+If+any+shall+refuse+the+office+of+deacons+as+too+mean+for+them%2C+they+shall+thereby+discover+that+pride+that+will+prove+them+unfit+to+be+either+elders+or+deacons%3B+and+you+will+have+cause+to+thank+God+that+thereby+a+mischief+to+the+Church+is+prevented%2C+which+might+have+followed+if+such+unhumbled+men+had+crept+into+authority.+6.+But+the+great+objection+against+this+Proposition+will+be+%28by+some%29+that+we+allow+none+to+be+elders+but+those+that+are+ordained%2C+and+so+overthrow+mere-ruling+elders.+To+which+I+answer%3A+1.+These+brethren+must+consider+that+we+are+forced+for+unity+to+speak+indistinctly+of+all+that+are+mere+assisting+elders+and+do+not+actually+preach+and+administer+sacraments%2C+whether+they+take+themselves+to+have+authority+to+do+more+%28as+other+ministers%29+or+not%3A+Now+they+will+confess+that+such+inferior+or+assisting+ministers+must+be+ordained%3A+and+we+cannot+now+%5Bformally%5D+distinguish+%5Bthem%5D.+2.+I+never+could+learn+that+it+is+the+judgment+of+presbyterians+or+congregational+men+that+it+is+unlawful+to+ordain+mere-ruling+elders.+And+if+they+may+do+it%2C+why+should+they+not+yield+to+it+for+peace%2C+though+they+think+not+that+they+must+do+it%3F+3.+I+confess+I+know+of+no+elders+mentioned+in+Scripture+without+ordination+and+do+despair+of+ever+seeing+it+proved+that+the+apostles+did+appoint+two+sorts+of+elders%2C+one+ordained+and+the+other+not+ordained.+The+contrary+I+doubt+not+to+prove+by+sufficient+induction.+4.+Deacons+must+be+ordained+that+are+inferior+to+elders%3B+why+then+should+not+elders+be+ordained%3F+5.+Let+our+brethren+take+heed+lest+they+loose+all+their+hold+of+that+show+they+have+in+Scripture+for+mere-ruling+elders+%28I+mean+quoad+potestatem+%5Bas+to+the+power%5D%2C+not+quoad+exercitium+ordinarium+%5Bas+to+the+ordinary+exercise%5D%29%2C+if+they+once+disclaim+all+those+as+no+such+ruling+elders+who+were+ordained.+It+seems+then+that+when+the+apostles+ordained+elders+in+every+Church%2C+and+when+Titus+was+left+to+ordain+elders+in+every+city%2C+it+was+no+mere-ruling+elders+that+they+ordained+or+were+appointed+to+ordain%21+6.+I+confess+I+am+loath+%28without+more+reasons+than+I+yet+know%29+to+give+the+intruders+of+the+ministry+so+much+encouragement+as+to+tell+them+men+may+ordinarily+be+ruling+elders+without+ordination%3F+For+doubtless+a+man+may+much+more+preach+up+and+down+in+public+occasionally+without+ordination%3A+I+mean%2C+more+may+be+said+for+it.+Even+some+of+the+most+learned+episcopal+divines+think+that+by+the+bishop%E2%80%99s+allowance+private+men+may+preach%2C+and+that+it+belongs+more+to+the+pastor+to+take+care+what+doctrine+is+taught+his+people+than+that+himself+be+the+teacher.+And+most+allow+the+preaching+of+probationers.+And+if+you+add+to+this+that+there+is+no+need+of+ordination+to+the+office+of+church-governing%2C+I+know+partly+what+will+follow.+7.+Yet+a+greater+doubt+is+behind%2C+and+that+is%3A+How+we+would+have+these+men+ordained%3F+I+answer%3A+1.+We+have+not+determined+of+that%3A+We+purposely+avoid+the+point+of+ordination+because+the+distance+between+the+episcopal+divines+and+others+is+well+known+in+that+point%3A+and+we+resolve+not+to+put+such+controverted+points+into+our+Agreement%2C+lest+thereby+we+necessarily+exclude+the+dissenters.+Our+business+is+not+now+%28as+is+said%29+to+reconcile+differences+in+judgment%3A+much+less+to+divide+from+those+that+differ+from+us%3A+but+to+practice+unanimously+so+much+as+we+are+agreed+in.+2.+We+leave+therefore+every+man+in+this+to+his+own+judgment.+Those+that+are+for+bishops+may+be+ordained+by+them+with+a+presbytery%2C+if+they+can+obtain+it.+Those+that+are+against+them%2C+may+be+ordained+by+the+Associated+pastors+of+that+Association%2C+the+president+performing+the+action.+Those+that+fear+danger+from+the+law+of+the+land+if+they+ordain+without+authority%2C+may+send+men+to+some+neighbor+county+that+has+authority.+Those+that+will+not+use+the+name+of+ordination+may+yet+use+the+thing%3A+which+is+nothing+but+the+solemn+designation+or+appointment+of+a+fit+person+to+the+office%2C+by+competent+men%3A+which+is+most+fitly+accompanied+with+prayer+and+imposition+of+hands%2C+where+they+may+be+had.+3.+To+avoid+some+of+these+contests%2C+if+deacons+only+be+first+ordained%2C+as+I+before+mentioned%2C+it+will+prevent+the+quarrels+that+some+may+else+be+drawn+to+by+difference+of+judgment.+For+many+moderate+episcopal+men+will+allow+presbyters+to+ordain+deacons+that+will+not+allow+them+to+ordain+presbyters.+As+for+those+that+will+say%2C+These+are+no+true+officers%2C+nor+to+be+acknowledged+%28whether+deacons+or+presbyters%29+who+were+not+ordained+by+a+bishop%2C+and+thereupon+will+take+occasion+for+a+schism+in+our+congregations%2C+I+shall+speak+more+fully+to+their+satisfaction+anon.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Christian+Concord%2C+or+the+Agreement+of+the+Associated+Pastors+%26+Churches+of+Worcestershire%2C+with+Richard+Baxter%E2%80%99s+Explication+%26+Defence+of+it%2C+%26+his+Exhortation+to+Unity+%28London%3A+A.M.%2C+1653%29+%7C+An+Explication+of+Some+Passages+in+the+Propositions%2C+pp.+5-9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8bc9b3d8f1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8bc9b3d8f1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/ruling-elders#:~:text=8.%20Concerning%20the%2017th%20Proposition%20%28which,more%20fully%20to%20their%20satisfaction%20anon&amp;text=8.%20Concerning%20the%2017th%20Proposition%20%28which%20many%20will&amp;text=shall%20speak%20more%20fully%20to%20their%20satisfaction%20anon" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The Order for the election of elders in use at Edinburgh at the Reformation gave the Session the duty of selecting a number of names from which the congregation chose half to be elders. This Order was generally confirmed by the Assembly of 1582. According to the Second Book of Discipline the Session nominates and the people approve. The names of those proposed were always brought before the congregation in order that any objection might be brought forward. [John G.] Lorimer, quoting the Presbyterian Review, 1834, makes a vain attempt to insist that there was real popular election in the seventeenth century… Everybody, however, was satisfied that the people’s rights were amply preserved when the Session elected. In 1642 the Assembly stated the rule that the old Session should elect the new [elders] both in town and country, always of course with the consent of the people [contra patronage]… The same custom was followed in the churches of Strassburg, France and Holland… …On these occasions [in 1654, 1656, 1658, 1669, which were enumerated by Henderson, though not quoted here] the congregation apparently was not present, though the regular edicts with regard to objections had been submitted; but clearly it was more usual to admit elders publicly before the congregation, as for example at Yester in 1683. Nevertheless, at the end of the eighteenth century and beginning of the nineteenth elders at Oldmachar were regularly admitted simply at a Session meeting. … But the idea of popular election really came in with the Secessions [1733 ff.]. Currie, of Kinglassie, a Church of Scotland minister, had attempted something approaching popular election before 1740. In 1761 Aberdeen Associate Church minutes that ‘this congregation knows that the right of election belongs to such as are in full communion with us.’ In the Church of Scotland some of the Evangelicals favored popular election, and Lorimer devotes a chapter [ch. 10] in his Eldership of the Church of Scotland to advocating the method. It had been definitely rejected by Assembly a few years previously, but in 1842 it was carried, and it became the rule in the Free Church. At Urquhart Free Church in 1845 elders were elected at a meeting of male communicants and male heads of families…</p></blockquote>

E2%80%98this+congregation+knows+that+the+right+of+election+belongs+to+such+as+are+in+full+communion+with+us.%E2%80%99+In+the+Church+of+Scotland+some+of+the+Evangelicals+favored+popular+election%2C+and+Lorimer+devotes+a+chapter+%5Bch.+10%5D+in+his+Eldership+of+the+Church+of+Scotland+to+advocating+the+method.+It+had+been+definitely+rejected+by+Assembly+a+few+years+previously%2C+but+in+1842+it+was+carried%2C+and+it+became+the+rule+in+the+Free+Church.+At+Urquhart+Free+Church+in+1845+elders+were+elected+at+a+meeting+of+male+communicants+and+male+heads+of+families%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+G.D.+Henderson%2C+pp.+216-25+of+ch.+6%2C+%E2%80%98Controversy%E2%80%99+in+The+Scottish+Ruling+Elder+%281935%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F205010c68a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/205010c68a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/whether-ladies-have-the-right-to-vote-for-church-officers/#:~:text=The%20Order%20for%20the%20election%20of,communicants%20and%20male%20heads%20of%20families&amp;text=The%20Order%20for%20the%20election%20of%20elders%20in&amp;text=of%20male%20communicants%20and%20male%20heads%20of%20families" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-83f590c74d" data-kw="">
<blockquote><p>Thine, O Lord is the greatness, and the power, and the glory, and the victory, and the majesty: for all that is in the heaven and in the earth is thine; thine is the kingdom, O Lord, and thou art exalted as head above all. Both riches and honour come of thee, and thou reignest over all; and in thine hand is power and might; and in thine hand it is to make great, and to give strength unto all… But who am I, and what is my people, that we should be able to offer so willingly after this sort? for all things come of thee, and of thine own have we given thee… O Lord our God, all this store that we have prepared to build thee an house for thine holy name cometh of thine hand, and is all thine own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>1 Chron. 29:11-12, 14, 16</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d1758a69a1" data-kw="intuitive knowledge">
<blockquote><p>God knows all things by one intuitive act. As there is no succession in his being, so there is no succession in his knowledge. He knows things that are successive, before their existence and succession, by one single act of intuition. By one cast of his eye, all things future are present to him in regard of his eternity and omnipresence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Knowledge of God</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a> › <a href="../topics/attributes-of-god/knowledge-and-wisdom/foreknowledge.html">Foreknowledge</a></span><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a> › <a href="../topics/attributes-of-god/knowledge-and-wisdom/knowledge-of-future-contingents.html">Knowledge of future contingents</a></span></div>
<div class="actions"><button class="copy" data-copy="“God knows all things by one intuitive act. As there is no succession in his being, so there is no succession in his knowledge. He knows things that are successive, before their existence and succession, by one single act of intuition. By one cast of his eye, all things future are present to him in regard of his eternity and omnipresence.”

— Stephen Charnock, The Existence and Attributes of God, Discourse on the Knowledge of God">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod%20knows%20all%20things%20by%20one%20intuitive%20act.%20As%20there%20is%20no%20succession%20in%20his%20being%2C%20so%20there%20is%20no%20succession%20in%20his%20knowledge.%20He%20knows%20things%20that%20are%20successive%2C%20before%20their%20existence%20and%20succession%2C%20by%20one%20single%20act%20of%20intuition.%20By%20one%20cast%20of%20his%20eye%2C%20all%20things%20future%20are%20present%20to%20him%20in%20regard%20of%20his%20eternity%20and%20omnipresence.%E2%80%9D%0A%0A%E2%80%94%20Stephen%20Charnock%2C%20The%20Existence%20and%20Attributes%20of%20God%2C%20Discourse%20on%20the%20Knowledge%20of%20God&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd1758a69a1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d1758a69a1.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-75b8794a35" data-kw="">
<blockquote><p>§CCCXXII. God, in knowing Himself, also knows whatever involves no contradiction, that is, what is possible in itself; for that is called possible which involves no contradiction. §CCCXXIII. Things are therefore possible because God represents to Himself in His intellect that they involve no contradiction; consequently, something is possible because God represents it to Himself in His intellect as such. §CCCXXIV. Hence it is evident that all possibility of things is from God, and that His intellect is the fountain or root of all possibility.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-f-stapfer.html">Johann F. Stapfer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Attributes Dependent upon the Divine Intellect</cite>, [on God as the Source of Possibility]’ in Universal Institutes of Polemical Theology, vol. 1 4th ed. (1757), section 3, propositions 321-70, pp. 78-90 trans. AI at Reformed Sources Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>
<div class="actions"><button class="copy" data-copy="“§CCCXXII. God, in knowing Himself, also knows whatever involves no contradiction, that is, what is possible in itself; for that is called possible which involves no contradiction. §CCCXXIII. Things are therefore possible because God represents to Himself in His intellect that they involve no contradiction; consequently, something is possible because God represents it to Himself in His intellect as such. §CCCXXIV. Hence it is evident that all possibility of things is from God, and that His intellect is the fountain or root of all possibility.”

— Johann F. Stapfer, ‘On the Attributes Dependent upon the Divine Intellect [on God as the Source of Possibility]’ in Universal Institutes of Polemical Theology, vol. 1 4th ed. (1757), section 3, propositions 321-70, pp. 78-90 trans. AI at Reformed Sources Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A7CCCXXII.+God%2C+in+knowing+Himself%2C+also+knows+whatever+involves+no+contradiction%2C+that+is%2C+what+is+possible+in+itself%3B+for+that+is+called+possible+which+involves+no+contradiction.+%C2%A7CCCXXIII.+Things+are+therefore+possible+because+God+represents+to+Himself+in+His+intellect+that+they+involve+no+contradiction%3B+consequently%2C+something+is+possible+because+God+represents+it+to+Himself+in+His+intellect+as+such.+%C2%A7CCCXXIV.+Hence+it+is+evident+that+all+possibility+of+things+is+from+God%2C+and+that+His+intellect+is+the+fountain+or+root+of+all+possibility.%E2%80%9D%0A%0A%E2%80%94+Johann+F.+Stapfer%2C+%E2%80%98On+the+Attributes+Dependent+upon+the+Divine+Intellect+%5Bon+God+as+the+Source+of+Possibility%5D%E2%80%99+in+Universal+Institutes+of+Polemical+Theology%2C+vol.+1+4th+ed.+%281757%29%2C+section+3%2C+propositions+321-70%2C+pp.+78-90+trans.+AI+at+Reformed+Sources+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F75b8794a35.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/75b8794a35.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-possibilities-hypotheticals/#:~:text=CCCXXII.%20God%2C%20in%20knowing%20Himself%2C%20also,fountain%20or%20root%20of%20all%20possibility&amp;text=CCCXXII.%20God%2C%20in%20knowing%20Himself%2C%20also%20knows%20whatever&amp;text=is%20the%20fountain%20or%20root%20of%20all%20possibility" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ba6bacd2b4" data-kw="">
<blockquote><p>I suppose, we are agreed: 1. That God’s will is nothing but his essence denominated with respect to some good as its object. 2. And there was no object really existent from eternity but God Himself. 3. That understanding and will are not univocal terms spoken of God and of man, nor of the same formal conception. And 4. That our formal conception of understanding and will is only of them as they are in man, and not as in God; and so this to us is the prius significatum [the first signification]. 5. And therefore that God does not understand or will in our sense formaliter [formally], but only eminenter [eminently]. 6. And lastly, that mortals know not just how God’s eminent intellection and volition differ from the formal in man. All this you must grant me, or be singular and ignorant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable, for pacification of the dogmatical Word-Warriors who</cite>, (London: White, 1675), pt. 2, 1st Day’s Conference, about Predestination, p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

</figure><figure class="quote" id="q-50619c436b" data-kw="">
<blockquote><p>Then said David, O Lord God of Israel, thy servant hath certainly heard that Saul seeketh to come to Keilah, to destroy the city for my sake. Will the men of Keilah deliver me up into his hand? will Saul come down, as thy servant hath heard?… And the Lord said, He will come down. Then said David, Will the men of Keilah deliver me and my men into the hand of Saul? And the Lord said, They will deliver thee up. Then David and his men, which were about six hundred, arose and departed out of Keilah, and went whithersoever they could go. And it was told Saul that David was escaped from Keilah; and he forbare to go forth. And David abode in the wilderness in strong holds, and remained in a mountain in the wilderness of Ziph. And Saul sought him every day, but God delivered him not into his hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>1 Sam., 23:10-14</cite></span></figcaption>

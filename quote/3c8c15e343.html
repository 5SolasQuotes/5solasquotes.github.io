<main class="wrap"><figure class="quote" id="q-3c8c15e343" data-kw="wages curse">
<blockquote><p>The reasons are: (1) “The wages of sin is death” (Rom. 6:23) and “the soul that sinneth, it shall die” (Ezk. 18:20). These deal not with any sin in particular, but with sin in general. Thus either venial sin is not sin or it deserves death and so is not venial. Second, the terrible formula of the law proves this: “Cursed be he that confirmeth not all the words of this law to do them” (Dt. 27:26; Gal. 3:10). If every deviation from the law deserves a curse and every sin is illegality, no sin can be granted (even the smallest) which does not bring upon it the curse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.4.7-8</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1aaeedfdf5" data-kw="infants original sin">
<blockquote><p>From Ps. 51:5—“Behold, I was shapen in iniquity, and in sin did my mother conceive me.” David, by ascending from the consideration of actual sin committed by him to the first taint of evil, confesses before God that he was corrupt even from the womb and inclined to sin. Hence an invincible argument flows for original sin. One conceived in iniquity and nourished in sin cannot be without original sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.10.10</span></figcaption>

</figure><figure class="quote" id="q-a4595f704a" data-kw="Original Sin Author of sin">

</figure><figure class="quote" id="q-e399ae0de2" data-kw="Imputation Forgiveness">
<blockquote><p>Sin, however, though it ceases to reign, ceases not to dwell in them. … We admit that these remains, just as if they had no existence, are not imputed, but we, at the same time, contend that it is owing to the mercy of God that the saints are not charged with the guilt which would otherwise make them sinners before God.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8ddfaddc4a" data-kw="">
<blockquote><p>He that being in health or [is] sick, shall contemn physic, let him be condemned of stubbornness and counted as an heretic: unto whom also afterwards, less benefit and duty is due from others; nay, he shall be counted unworthy [of] the fellowship of citizens. For he has tempted God and with the rebellious Jews required miracles, when as without miracles he might have had experience of the grace of God. Whosoever shall affirm that it is lawful for Christians in the time of the plague, without a lawful cause and consent of the rulers, to leave his city and church, he is worthy [of] the name of a schismatic… And he that shall hold every plague to be as an immediate punishment from God, is to be condemned of ignorance and to be despised as an evil speaker: as one that lays upon God his own rashness and blame of his own reckless negligence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection in the Time of the Plague or Pestilence, Two Books (London, 1583), bk. 2, ch. 9</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5a4fe470af" data-kw="">
<blockquote><p>1. Thou shalt not hurt thy own body. One may be guilty of self-murder… (1.) Indirectly and occasionally, as: First, When a man thrusts himself into danger which he might prevent; as if a company of archers were shooting, and one should go and stand in the place where the arrows fly, if the arrow did kill him, he is accessory to his own death. In the law, God would have the leper shut up, to keep others from being infected. Lev. 23:4. Now, if any would be so presumptuous as to go in to the leper, and get the plague of leprosy, he might thank himself; he occasioned his own death. Secondly, A person may be in some sense guilty of his own death, by neglecting the use of means. If sick, and use no physic, if he has received a wound and will not apply balsam, he hastens his own death. God appointed Hezekiah to lay a ” lump of figs upon the boil,” Isa. 38:21. If he had not used the lump of figs, he had been the cause of his own death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Divinity | on the 6th Commandment</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<blockquote><p>But, to our discontent, we also had Our due allowances the shorter made Ev’n by command. For, some (I know not why) Had falsely misinform’d Authority, That our promiscuous meetings, at the Fast, Increased the plague: which was believ’d in haste. And being urg’d, perhaps, with such fane show Of reason, as conjecture could imbue; (The matter being aggravated too, With such untruths, as travel to and fro) The public preaching on the Fasting day, Was, in an evil season, took away. For, when the flesh was fed, and soul deprived Of two repasts, which weekly we received, Profaneness, and hard-heartedness began To get new rooting in the mind of man. We missed those good helps, and those examples Which had been preached to us in our temples. The poor did want full quickly, to their grief, Those alms the Fast brought out for their relief. And, when with prayers, preaching did not go, Our cold devotions, did far colder grow. What instrument of mischief might he be Who caused that? And, what a fool was he! If Wednesday-sermons holp infect[ion]; I pray What kept us safer on the Sabbath day? Since most fast then till noon without re[in]fection? Or, what at funerals, did stop infection? Good God! in thy affairs, how vain (to me) Doth carnal policy appear to be? How apt is flesh and blood to run a course, Which makes the soul’s condition, worse and worse? To venture on eternal death how toward! And in a temporal danger what a coward! Sure, had not such a project, had a scope Beyond the reaching of the Devil’s hope, And been too damnable for any one To be his procurator thereupon; Some would have made the motion that we might Have liv’d excluded from our churches quite: And, that till God his hand should please to stay, None should in public, either preach, or pray. ‘Twas well the weekly number of the dead, By God’s mere mercy, was diminished, Before the prohibition of the Fast: The Fiend had else, for evermore, di•g•ac’t That discipline: and carnal policy Had so insulted o’re Divinity, That, in succeeding ages, men unholy, Would thence have proved, such devotion, folly. But, God prevented it, that we should take Good notice of it; and good uses make: And I have mention’d it, that here I may God’s wisdom and man’s foolishness display. Oh let us to our fasts again return; Let us, for our omissions truly mourn; And not capitulate with God, as though He, first his rod out of his hand should throw, Here we would come unto Him: for, if thus A son of ours should bear himself to us, It would our fire exasperate the more; And make the fault seem greater than before. Why should we in an action that is just The mercy of our gracious God distrust? Or, unto any place be loath to go, Where God is to be heard, or spoken to, Through fear of that which may be caught at home And in a thousand places where we come? Our sins and plagues were public: so should we In pray’rs, and tears, and alms, and fastings be. For, that strong Devil which hath tortur’d thus Our general body, is not cast from us By single exorcisms: neither shall Our privacies advantage us at all, Except in what conduces to the health Of private men, or of their private wealth. If we in close retirements (by our fear) At markets, or where worse assemblies are, Infected grow: the Devil, by and by With us persuadeth, either to belie The Church, our constant fasting, or some one Good work, or pious action we have done. (As visiting the sick, in time of need, Or any other such like Christian deed) For, he those practices doth greatly spite, And, to disparage them hath much delight: Because he sees, that such as are inclined To pious means, will soon by trial find, Good hopes to thrive beyond their expectations; Their knowledge, fool his cunning machinations; Their faiths grow strong; temptations weak appear; Their joy most perfect, where most sorrows are; And know, that when the Lord of Hosts is armed, With all his judgments, that, he least is harmed, Who, bold through love, self-trust quite from him throws And, runs with confidence to meet his blows. Let no man then be fearful to repair Unto the house of preaching, or of pray’r; Or, any whither else, those works to do, Which he by conscience is obliged to: No, though the Devil in the passage lay, Or strow’d most fearful dangers in the way. For, if in such a case, our death we take, Our death, shall for our best advantage make. Yet, let none think I this opinion carry, That ev’ry Church, will be a sanctuary, To all that come for, sure, if any dare Without devotion in God’s house appear, To them, that place, more peril threatens, than, A chamber thronged with infected men. Some fainted in the Church, as others did Within their houses (where themselves they hid) Yet not so often. For though some did please To blame the Church for spreading this disease, No places were more harmless. None did we Behold more healthy, or to scape more free From this infection, than those persons, whom We saw most often, to God’s worship come. Nor were there any houses more infected Then theirs, who most the house of God neglected. I speak not this by rumor: For, ev’n thither Resorted I, where thronged were together The greatest multitudes: And day by day I sat where all the crowd I could survey. Yet, I nor man, nor child, nor woman saw, To sink, look pale, or from their place withdraw And, doubtless, if such faintings there had been, As many prated of; I some had seen. Which, since I did not see, I wish again, None would at such a time, God’s house refrain, Except in congregations not their own, And were infection feared is, or known: Or in their own assembly, where disorder Committed willfully, the pest may further. Or, when their body’s weakened, or the air Their safety’s may some other ways impair. Excepting to (in times of visitation, When they are marked with marks of separation, As rising, blues, or sores. O, newly from The company of such like persons, come. Or, whensoever they or do•, or may Suppose themselves infectious anyway. These (as the lepers did, by Mose’ Law) From public congregations should withdraw, For, sure, if any such themselves intrude To mix among a healthy multitude, (Though prayers or devotions they pretend, Or whatsoever other pious end) Their foolish practice is unwarrantable; Yea, their condition so uncharitable, That I abhor it: and believe that for So doing, God their prayers doth abhor:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-wither.html">George Wither</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Britain’s Remembrancer, Containing a Narration of the Plague Lately Past… ([London, 1628])</cite>, p. 131-3</span></figcaption>

ve+liv%E2%80%99d+excluded+from+our+churches+quite%3A+And%2C+that+till+God+his+hand+should+please+to+stay%2C+None+should+in+public%2C+either+preach%2C+or+pray.+%E2%80%98Twas+well+the+weekly+number+of+the+dead%2C+By+God%E2%80%99s+mere+mercy%2C+was+diminished%2C+Before+the+prohibition+of+the+Fast%3A+The+Fiend+had+else%2C+for+evermore%2C+di%E2%80%A2g%E2%80%A2ac%E2%80%99t+That+discipline%3A+and+carnal+policy+Had+so+insulted+o%E2%80%99re+Divinity%2C+That%2C+in+succeeding+ages%2C+men+unholy%2C+Would+thence+have+proved%2C+such+devotion%2C+folly.+But%2C+God+prevented+it%2C+that+we+should+take+Good+notice+of+it%3B+and+good+uses+make%3A+And+I+have+mention%E2%80%99d+it%2C+that+here+I+may+God%E2%80%99s+wisdom+and+man%E2%80%99s+foolishness+display.+Oh+let+us+to+our+fasts+again+return%3B+Let+us%2C+for+our+omissions+truly+mourn%3B+And+not+capitulate+with+God%2C+as+though+He%2C+first+his+rod+out+of+his+hand+should+throw%2C+Here+we+would+come+unto+Him%3A+for%2C+if+thus+A+son+of+ours+should+bear+himself+to+us%2C+It+would+our+fire+exasperate+the+more%3B+And+make+the+fault+seem+greater+than+before.+Why+should+we+in+an+action+that+is+just+The+mercy+of+our+gracious+God+distrust%3F+Or%2C+unto+any+place+be+loath+to+go%2C+Where+God+is+to+be+heard%2C+or+spoken+to%2C+Through+fear+of+that+which+may+be+caught+at+home+And+in+a+thousand+places+where+we+come%3F+Our+sins+and+plagues+were+public%3A+so+should+we+In+pray%E2%80%99rs%2C+and+tears%2C+and+alms%2C+and+fastings+be.+For%2C+that+strong+Devil+which+hath+tortur%E2%80%99d+thus+Our+general+body%2C+is+not+cast+from+us+By+single+exorcisms%3A+neither+shall+Our+privacies+advantage+us+at+all%2C+Except+in+what+conduces+to+the+health+Of+private+men%2C+or+of+their+private+wealth.+If+we+in+close+retirements+%28by+our+fear%29+At+markets%2C+or+where+worse+assemblies+are%2C+Infected+grow%3A+the+Devil%2C+by+and+by+With+us+persuadeth%2C+either+to+belie+The+Church%2C+our+constant+fasting%2C+or+some+one+Good+work%2C+or+pious+action+we+have+done.+%28As+visiting+the+sick%2C+in+time+of+need%2C+Or+any+other+such+like+Christian+deed%29+For%2C+he+those+practices+doth+greatly+spite%2C+And%2C+to+disparage+them+hath+much+delight%3A+Because+he+sees%2C+that+such+as+are+inclined+To+pious+means%2C+will+soon+by+trial+find%2C+Good+hopes+to+thrive+beyond+their+expectations%3B+Their+knowledge%2C+fool+his+cunning+machinations%3B+Their+faiths+grow+strong%3B+temptations+weak+appear%3B+Their+joy+most+perfect%2C+where+most+sorrows+are%3B+And+know%2C+that+when+the+Lord+of+Hosts+is+armed%2C+With+all+his+judgments%2C+that%2C+he+least+is+harmed%2C+Who%2C+bold+through+love%2C+self-trust+quite+from+him+throws+And%2C+runs+with+confidence+to+meet+his+blows.+Let+no+man+then+be+fearful+to+repair+Unto+the+house+of+preaching%2C+or+of+pray%E2%80%99r%3B+Or%2C+any+whither+else%2C+those+works+to+do%2C+Which+he+by+conscience+is+obliged+to%3A+No%2C+though+the+Devil+in+the+passage+lay%2C+Or+strow%E2%80%99d+most+fearful+dangers+in+the+way.+For%2C+if+in+such+a+case%2C+our+death+we+take%2C+Our+death%2C+shall+for+our+best+advantage+make.+Yet%2C+let+none+think+I+this+opinion+carry%2C+That+ev%E2%80%99ry+Church%2C+will+be+a+sanctuary%2C+To+all+that+come+for%2C+sure%2C+if+any+dare+Without+devotion+in+God%E2%80%99s+house+appear%2C+To+them%2C+that+place%2C+more+peril+threatens%2C+than%2C+A+chamber+thronged+with+infected+men.+Some+fainted+in+the+Church%2C+as+others+did+Within+their+houses+%28where+themselves+they+hid%29+Yet+not+so+often.+For+though+some+did+please+To+blame+the+Church+for+spreading+this+disease%2C+No+places+were+more+harmless.+None+did+we+Behold+more+healthy%2C+or+to+scape+more+free+From+this+infection%2C+than+those+persons%2C+whom+We+saw+most+often%2C+to+God%E2%80%99s+worship+come.+Nor+were+there+any+houses+more+infected+Then+theirs%2C+who+most+the+house+of+God+neglected.+I+speak+not+this+by+rumor%3A+For%2C+ev%E2%80%99n+thither+Resorted+I%2C+where+thronged+were+together+The+greatest+multitudes%3A+And+day+by+day+I+sat+where+all+the+crowd+I+could+survey.+Yet%2C+I+nor+man%2C+nor+child%2C+nor+woman+saw%2C+To+sink%2C+look+pale%2C+or+from+their+place+withdraw+And%2C+doubtless%2C+if+such+faintings+there+had+been%2C+As+many+prated+of%3B+I+some+had+seen.+Which%2C+since+I+did+not+see%2C+I+wish+again%2C+None+would+at+such+a+time%2C+God%E2%80%99s+house+refrain%2C+Except+in+congregations+not+their+own%2C+And+were+infection+feared+is%2C+or+known%3A+Or+in+their+own+assembly%2C+where+disorder+Committed+willfully%2C+the+pest+may+further.+Or%2C+when+their+body%E2%80%99s+weakened%2C+or+the+air+Their+safety%E2%80%99s+may+some+other+ways+impair.+Excepting+to+%28in+times+of+visitation%2C+When+they+are+marked+with+marks+of+separation%2C+As+rising%2C+blues%2C+or+sores.+O%2C+newly+from+The+company+of+such+like+persons%2C+come.+Or%2C+whensoever+they+or+do%E2%80%A2%2C+or+may+Suppose+themselves+infectious+anyway.+These+%28as+the+lepers+did%2C+by+Mose%E2%80%99+Law%29+From+public+congregations+should+withdraw%2C+For%2C+sure%2C+if+any+such+themselves+intrude+To+mix+among+a+healthy+multitude%2C+%28Though+prayers+or+devotions+they+pretend%2C+Or+whatsoever+other+pious+end%29+Their+foolish+practice+is+unwarrantable%3B+Yea%2C+their+condition+so+uncharitable%2C+That+I+abhor+it%3A+and+believe+that+for+So+doing%2C+God+their+prayers+doth+abhor%3A%E2%80%9D%0A%0A%E2%80%94+George+Wither%2C+Britain%E2%80%99s+Remembrancer%2C+Containing+a+Narration+of+the+Plague+Lately+Past%E2%80%A6+%28%5BLondon%2C+1628%5D%29%2C+p.+131-3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F19e1fb631a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/19e1fb631a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-civil-magistrates-just-authority-for-quarantining-and-restraining-the-congregating-of-citizens-even-the-church-with-sufficient-natural-warrant/#:~:text=But%2C%20to%20our%20discontent%2C%20we%20also,doing%2C%20God%20their%20prayers%20doth%20abhor&amp;text=But%2C%20to%20our%20discontent%2C%20we%20als <blockquote><p>Some Citizens at Church prepar’d to pray; But (as they had been excommunicate) The good Church-wardens [lay grounds-keepers, regulated by Church and State] thrust them out the gate. Another country virtue I’ll repeat, The people’s charity was grown so great That whatsoever Londoner did die, In Church or Church-yard should not buried lie. Thus were they scorn’d, despised, banished, Excluded from the Church, alive, and dead, Alive, their bodies could no harbor have, And dead, not be allow’d a Christian grave: Thus was the Country’s kindness cold, and small, No house, no Church, no Christian burial. Oh Thou that on the winged winds dost sit And seest our misery, remedy it, Although we have deserv’d thy vengeance hot, Yet in thy jury (Lord) consume us not. But in thy mercies sheath thy slaying sword, Deliver us, according to thy word, Shut up thy quiver, stay thy angry rod That all the world may know Thou art our God, Oh open wide the gate of thy compassion Assure our souls that thou art our salvation. Then all our thoughts and words, and works, we’ll frame To magnify thy great and glorious Name, The ways of God, are intricate, no doubt Unsearchable, and pass man’s finding out, He at his pleasure worketh wond’rous things And in his hand doth hold the hearts of kings, And for the love, which to our king he bears, By sickness He our sinful Country clears, That he may be a Patron, and a guide Unto a people purg’d and purified.</p></blockquote>

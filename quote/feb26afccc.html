<main class="wrap"><figure class="quote" id="q-feb26afccc" data-kw="">
<blockquote><p>XVI. They are deceived then who make parallel distinctions of the Old and New Testament; of the Covenant of Works, and of Grace; of the Law, and Gospel: for in both, the Testament of Covenant is the Covenant of Grace; in both, the Law and Gospel are urged.

XVII. But the administration of the Old and New Testament differ first in time; because the Old Testament was exhibited before Christ; but the New is administered, Christ being now exhibition; that was to continue only till Christ, this forever. 2. In the place or amplitude, for that was proffered to the people of Israel only, this extends it self through all the world. 3. In clearness; because the free promises of Christ are more clearly preached in the New Testament, and confirmed, the shadows of Types and Ceremonies being abolished. 4. In facility; because the administration in the Old Testament, was more laborious than in the New. 5. In sweetness; for in the Old Testament, the perfect obedience of the Law is oftener urged, yet not excluding the promises of the Gospel; yet to that end, that they might be compelled to seek Christ by that rigorous exaction of obedience, as it were by a School-master: but in the new Testament, the promises of the Gospel are more frequent, yet not excluding the Law, which drives us to new obedience, to be performed by the grace of Regeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The abridgment of Christian divinity</cite>, trans. Alexander Ross (3rd edn, London, 1660), pp 173-4.</span></figcaption>

</figure><figure class="quote" id="q-7fbf23b427" data-kw="">
<blockquote><p>It is true, that CHRIST his death is a sufficient price of ransom for the sins of the whole world: Yea of more worlds, if there were more then one, for his blood and his sufferings, whereby he redeemed us, were the blood and sufferings of him that was and is God but yet they are effectual only to those that do believe.

For if CHRIST had redeemed all men, then all should be saved. For all that are redeemed are also justified, &amp; all that are justified shall be glorified For, for whom CHRIST died, for them he hath satisfied the justice of his father, so that there is no condemnation to them, whom CHRIST hath redeemed.

For whom CHRIST died, them by his death he reconciled to God, now they, who when they were enemies were reconciled to God by the death of his Son; much more being reconciled shall be saved by his life: Neither may we think, that CHRIST would die for them, for whom he would not pray. But for the world saith he, that is for the company of the wicked and reprobates I pray not but for them whom thou hast given me out of the world.

But if the Oath of an honest man, ought to be the end of controversy, much more ought the Oath of God in this place end this controversy concerning universal redemption. For God hath sworn, that to so many as he redeemeth, he will give them to worship him in holiness and righteousness. But the greater part of mankind have never the grace to worship God in holiness and righteousness, and therefore to them the benefit of redemption doth not belong.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Grace or An Exposition upon Luke 1. 73.74.75</cite>, (Dublin, 1631), pp 40-41.</span></figcaption>

</figure><figure class="quote" id="q-1683d68172" data-kw="">
<blockquote><p>Use of Instruction, That there may be an happy reconciliation and accord between God’s grace in forgiving, and man’s duty in repenting, one need not be preached to justly out the other. All error is an extremity of some truth, and therefore it is hard to discover truth, because its difficult to find out where the bounds are, that truth parts from error. Let not therefore a Christian so rely upon his repentance, as if there were no Covenant of grace, no blood of Christ to procure an atonement: so neither let him extoll these causes to the extinguishing of his duties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted and Vindicated, from the Errors of Papists, Arminians, Socinians, and more especially Antinomians. In XXX Lectures Preached at Lawrence-Jury, London</cite>, (London: Robert White, 1648), p. 155.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-0892c62019" data-kw="">
<blockquote><p>This can be no other in general but that which we call “the covenant of grace.” And it is so called in opposition unto that of “works,” which was made with us in Adam; for these two, grace and works, do divide the ways of our relation unto God, being diametrically opposite, and every way inconsistent, Romans 11:6. Of this covenant the Lord Christ was the mediator from the foundation of the world, namely, from the giving of the first promise, Revelation 13:8; for it was given on his interposition, and all the benefits of it depended on his future actual mediation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 77</span></figcaption>

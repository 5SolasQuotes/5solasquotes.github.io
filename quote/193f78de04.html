<main class="wrap"><figure class="quote" id="q-193f78de04" data-kw="">
<blockquote><p>They spoil kings and parliaments of their legislative power. But their great tenet about the magistracy is this, that no prince nor state on the earth has any legislative power; that neither king nor parliament can make any law in anything that concerns either church or state; that God alone is the Lawgiver; that the greatest magistrate has no other power, but to execute the Laws of God set down in Scripture; that the judicial Law of Moses binds at this day all the nations of the world as well as ever it did the Jews: They tell us that whatever God in Scripture has left free, it may not be bound by any human law, whether civil or ecclesiastic; and what God has bound by any law in Scripture, they will not have it loosed by the hand of any man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (1645), p. 31</span></figcaption>

<blockquote><p>It is an agreed principle of theological and sociological teaching that Catholic citizens should not vote for leaders who are inimical to Christianity… It is, however, held to be lawful to vote for an unworthy candidate in certain circumstances—for instance, if this is necessary to exclude an even more unsuitable one, or if failure to vote for a particular candidate would involve disproportionate personal loss, or if there is good hope, all things considered, that the election of this candidate may ultimately conduce to the common good… To sum up then: we agree that normally Catholics should not vote for non-Christian candidates. But if it is clear, when account is taken of the circumstances of person and place, that a particular non-Christian candidate is willing to act in accordance with Christian principles, we think that it is not unlawful to vote for him…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-canon-mccarthy.html">John Canon McCarthy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems in Theology II: the Commandments</cite>, (Dublin, 1959), sect. 2, 1st &amp; 2nd Commandments, ‘The Morality of Voting for Non-Christians’, pp. 86-88 McCarthy was a Romanist professor of moral theology.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c1a1f211d5" data-kw="">
<blockquote><p>But Magistrates as Magistrates hold forth in their Law-abstinence from those same sins of adultery, incest, murder; But:

1. Not to the consciences of their subjects, but to the outer man as members of the commonwealth.

2. Not under the pain of eternal wrath and condemnation, before the judge of quick and dead: Magistrates as Magistrates have neither calling, office, place nor power to threaten or inflict eternal punishment; if Magistrates do persuade the equity of abstinence from adultery, incest, murder, in their statutes, or acts of parliament, from the Word of God, from the sixth and seventh command of the Decalogue, from the judgement and eternal punishment that follows these sins, they so persuade not as magistrates, but as divines, and as godly and Christian men…

3. Magistrates as Magistrates hold forth in their Law, abstinence from these sins, not as the ambassadors of Christ, craving subjection of conscience and divine-faith to those charges, but only external obedience: for though ministers as ministers crave faith and subjection of conscience to all commandments and inhibitions, as in Christ’s stead, 2 Cor. 5:19-20, yet the magistrate as the magistrate does not crave either faith or subjection of conscience; nor is he in Christ’s stead to lay divine bands on the conscience, to submit the soul and conscience to believe and abstain; he is the deputy of God as the God of Order, and as the Creator, and Founder, and another of human societies and of Peace, to exact external obedience, and to lay bands on your hands not to shed innocent blood, and on your body not to defile it with adultery, or incest, nor to violate the chastity of your brother… when the magistrate punishes spiritual sins, heresy, idolatry, he punishes them only with temporary punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), pp. 550-51</span></figcaption>

</figure><figure class="quote" id="q-70ba221700" data-kw="">
<blockquote><p>If any say [such as the Erastians], ‘Who can deny but the magistrate as the magistrate may command that which is obedience to Christ, and reward it, and forbid sin and punish it?’ Answer: But the magistrate as such forbids not sin as sin, for then as a magistrate he should forbid sin under the punishment of eternal wrath, which he cannot do as a magistrate, he only can forbid sin under the pain of his temporary punishment, which he can inflict, and as it disturbs societies and incorporations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), p. 600</span></figcaption>

<blockquote><p>2. The civil corporation may: [1.] limit the major [an official] in regard of time, for a year and no longer; 2. they may make him half a tyrant, a dictator and absolute, or give him less power, that he shall rule none but with the consent of 12 assessors; but the people may not make him a pastor for a year and then lay him aside for no fault as a major is unofficed; nor may they limit him so as he shall not preach in season and out of season but by the consent of 12 men.

3. The corporation may erect itself in a kingdom or commonwealth and may create consuls, dictators, praetors, tribunos plebis, etc. as may most serve for the safety and peace of this State; but the Church may bring in no new officers but those appointed by Christ; nor may they alter the government, and metamorphose it into another than that which is according to the pattern showed in the mount.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, p. 278</span></figcaption>

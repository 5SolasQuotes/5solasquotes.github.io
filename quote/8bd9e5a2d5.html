<main class="wrap"><figure class="quote" id="q-8bd9e5a2d5" data-kw="">
<blockquote><p>And then yet further, know, That through the righteousness of Christ, thou art lookt upon thy self, in the point of Justification, without spot too. The Saints have their spots that is, they have their weaknesses, and some sins, their Sanctification is imperfect; I, but in regard of Justification, so, they are altogether without spot: So you have it in Cant. 4. 7. Where Christ speaks of his Spouse, Thou art all fair, my Love, there is no spot in thee — You will say, This seems to be against this text: No, not at all; for we may be without any spot, in regard of our Justification, and yet we may be spotted and defiled, and God may see that we are defiled with spots in our sanctification. It’s true, the Lord will not charge these spots upon thy soul that art in Christ; yet he doth expect that thou shouldst be humbled for them.</p></blockquote>

<blockquote><p>22. This new obedience of ours, by which, so far as lies in us, we henceforth conduct ourselves in conformity to the divine law—since it is required by God himself and performed by us—according to its degree and measure is also called our righteousness; by which also, formally, inherently, habitually, or from works, we (according to our measure) are even truly said to be righteous before God, inasmuch as on its account we are regarded by God himself as righteous in part. And with respect to it, in the divine forum, we may in some way be justified (if there were need of it). (Lk. 1:6; Isa. 38:3; 1 Thess. 5:23)</p></blockquote>

</figure><figure class="quote" id="q-b4fd6cf121" data-kw="">
<blockquote><p>May faith be properly called a condition The question has been keenly agitated between Calvinists, whether faith itself should be spoken of as a condition of the covenant. One party has denied it, because they supposed that the language which represented man as performing a condition of his own salvation would make an inlet for human merit. But it is most manifest that there is a sense in which faith is the condition, in all such passages as Jn. 3:16; Acts 8:37; Jn. 11:26; Mk. 16:16. No human wit can evade the fact, that here God proposes to man a something for him to do, which, if done, will secure redemption; if neglected, will ensure damnation—and that something is in one sense a condition. But of what kind? Paul everywhere contrasts the condition of works, and the condition of faith. This contrast will be sufficiently established, and all danger of human merits being intruded will be obviated, if it be observed that faith is only the appointed instrument for receiving free grace purchased by our Surety. It owes its organic virtue as such, to God’s mere appointment, not to the virtue of its own nature. In the Covenant of Works, the fulfilment of the condition on man’s part earned the result, justification by its proper moral merit. In the Covenant of Grace, the condition has no moral merit to earn the promised grace, being merely an act of receptivity. In the Covenant of Works, man was required to fulfil the condition in his own strength. In the Covenant of Grace, strength is given to him to believe, from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus &amp; Notes of the Course of Systematic &amp; Polemic Theology</cite>, 2nd ed. (St. Louis: Presbyterian Publishing Company, 1878), pp. 438–39</span></figcaption>

<blockquote><p>XXIII. This Orthodox doctrine of the justification of sinful man before God having been asserted from the Word of God, the following errors are overthrown: …

III. Of the Socinians:

      1. Who overthrow justification through and on account of Christ the Mediator and His λύτρον [lutron, ransom]; who admit no redemption and satisfaction of Christ except a metaphorical one.

      2. Who contend that Christ is our Saviour only on account of His prophetic and kingly office — inasmuch as He vindicated this title to Himself only by announcing salvation, confirming it, and communicating it, but not by meriting it. These and other portentous errors of this sort are both contrary to sacred Scripture and to the salutary doctrine of justification drawn and derived therefrom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</span></figcaption>

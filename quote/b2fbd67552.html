<main class="wrap"><figure class="quote" id="q-b2fbd67552" data-kw="">
<blockquote><p>…if those justly called Separatists, and who think parish communion under honest ministers [in the Anglican churches] to be idolatry, or unlawful, will but without prejudice read what is written to prove it lawful by the old, godly, judicious nonconformists, especially John Ball‘s Trial of Separation [1640], Mr. [Arthur] Hildersham [A Treatise of the Ministry of the Church of England, 1595], Mr. [William] Bradshaw [The Unreasonableness of the Separation, 1640, with William Ames], Dr. [William] Ames, Mr. [Thomas] Cartwright [A Letter of T.C. to Richard Harrison concerning Separation; note that EEBO has misidentified the author’s dates], Mr. [George] Gifford [whose three books are above], Mr. John Paget [An Arrow Against the Separation of the Brownists, 1618], Mr. [Thomas] Brightman [on Rev. 3, pp. 131-32], Mr. [William] Rathband [his three works above], etc. they will need no more to save them from this scandalous Schism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684), pt. 2, pp. 17-18</span></figcaption>

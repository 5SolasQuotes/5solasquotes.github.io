</figure><figure class="quote" id="q-81a0827718" data-kw="">
<blockquote><p>In the beginning of the blessed Reformation, our wise and pious ancestors took care to set forth an order for redress of many things, which they then, by the Word, discovered to be vain erroneous, superstitious, and idolatrous, in the public worship of God. This occasioned many godly and learned men to rejoice much in the Book of Common Prayer, at that time set forth… Howbeit, long and sad experience hath made it manifest, that the Liturgy used in the Church of England, (notwithstanding all the pains and religious intentions of the compilers of it) hath proved an offence, not only to many of the godly at home, but also to the reformed Churches abroad. For, not to speak of urging the reading of all the prayers, which very greatly increased the burden of it, the many unprofitable and burdensome ceremonies contained in it have occasioned much mischief, as well by disquieting the consciences of many godly ministers and people, who could not yield unto them… …the [Anglican] Liturgy hath been a great means, as on the one hand to make and increase an idle and unedifying ministry… so, on the other side, it hath been (and ever would be, if continued) a matter of endless strife and contention in the Church… especially in these latter times, wherein God vouchsafeth to his people more and better means for the discovery of error and superstition…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Directory for Public Worship | Preface</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

the%20blessed,the%20discovery%20of%20error%20and%20superstition&amp;text=In%20the%20beginning%20of%20the%20blessed%20Reformation%2C%20our&amp;text=means%20for%20the%20discovery%20of%20error%20and%20superstition" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ea0bc6aae3" data-kw="">
<blockquote><p>To acknowledge and confess, that, as we are convinced of our guilt, so, out of a deep sense thereof, we judge ourselves unworthy of the smallest benefits, most worthy of God’s fiercest wrath, and of all the curses of the law, and heaviest judgments inflicted upon the most rebellious sinners… Notwithstanding all which, to draw near to the throne of grace, encouraging ourselves with hope of a gracious answer of our prayers, in the riches and all-sufficiency of that only one oblation, the satisfaction and intercession of the Lord Jesus Christ… and humbly and earnestly to supplicate for mercy… And, with confidence of his mercy to his whole church, and the acceptance of our persons, through the merits and mediation of our High Priest, the Lord Jesus, to profess that it is the desire of our souls to have fellowship with God in the reverend and conscionable use of his holy ordinances; and, to that purpose, to pray earnestly for his grace and effectual assistance to the sanctification of his holy sabbath, the Lord’s day, in all the duties thereof, publick and private, both to ourselves, and to all other congregations of his people, according to the riches and excellency of the gospel, this day celebrated and enjoyed… And because we have been unprofitable hearers in times past, and now cannot of ourselves receive, as we should, the deep things of God, the mysteries of Jesus Christ, which require a spiritual discerning; to pray, that the Lord, who teacheth to profit, would graciously please to pour out the Spirit of grace, together with the outward means thereof, causing us to attain such a measure of the excellency of the knowledge of Christ Jesus our Lord, and, in him, of the things which belong to our peace…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Directory for the Public Worship of God | Of Public Prayer before the Sermon</cite></span></figcaption>

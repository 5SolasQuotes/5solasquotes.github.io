<main class="wrap"><figure class="quote" id="q-683473dd22" data-kw="">
<blockquote><p>Beloved! the salvation of souls is that which should be first and most in a minister’s eye, and that which should always lie closest and warmest upon a minister’s heart. O sirs! our dear Lord Jesus was infinitely tender of the souls of men.

He left his Father’s bosom for souls he trode the wine-press of his Father’s wrath for souls; he prayed for souls; he paid for souls; he sweated for souls; he bled out his heart’s blood for souls; and he made himself an offering for souls: and oh, what an encouragement should this be to all his faithful messengers to woo for souls, to mourn for souls, to pray for souls, to study for souls, and in preaching to spend and to be spent for the salvation of souls! Ah, friends, there is no work nor wisdom on earth to that of winning souls, Prov, xi. 30, and ‘he that winneth souls is wise.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crown and Glory of Christianity; or Holiness, the only way to Happiness. Discovered in LVIII Sermons from Heb. 12. 14</cite>, (1662) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 4: 35.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-8d44529ae1" data-kw="">
<blockquote><p>Some laws expire by limitation. Such are many of the laws of every country. Such were many of the laws given by Moses. They were in force until Christ, who was their end, came; and then they bound no longer. Thus the whole ceremonial law ceased to bind after the death of Christ, to which it was limited. But no limit was fixed to the observance of the fourth commandment, either when first given or afterwards.

A competent authority may repeal a law, and thus its obliging power may cease. Every free government affords numerous instances of the repeal of laws once useful, but no longer so. In a regular government, the repeal must be passed by the power which enacts the law. The great Lawgiver of the world is God. He ordained the law of the Sabbath, and he has never repealed it. Is any evidence of such repeal found in Scripture? If so, where is the book, the chapter, the verse containing it? All admit that the law was in force until Christ. Christ did not repeal it, for he says so. Matt. 5:17; nor did the apostles anywhere declare that it was repealed. If this law, therefore, has ceased to bind, it must be in some way utterly unknown to us. It is still practicable; it has not expired by limitation; it has not been repealed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-swan-plumer.html">William Swan Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law of the Sabbath Still Binding, and What it Forbids in Tracts of American Tract Society. General Series</cite>, vol. VI, no. 187 (New York, n.d.), pp 2-3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-cbe38a60ce" data-kw="">
<blockquote><p>I gave account of their express words [that of the Quakers], ‘We are against all your David’s praises and prophecies in meter’, contrary to Eph. 5:19; Col. 3:16 and other Scriptures. R.F. makes me this return, ‘Singing of psalms, and hymns and spiritual songs, we are not against, but own; but your poetry we deny.’ Response: He might as well say, your translation of them into English meter we deny: but if psalms, hymns and spiritual songs be owned, they are either David’s, and other of saints’ penning, and the Spirit’s inditing [composing] in the Scripture, or of their [the Quakers’] own composing. If they own none but of their own composing, they reject David’s, and what was left for our use in Scripture… And what better poetry than that in the Scripture? which is translated and ordered as suiteth best to our own mother tongue, for singing, and teaching others to sing David’s words and praises, with David’s spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-stalham.html">John Stalham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reviler Rebuked</cite>, (London, 1657), 15th Head, ‘Concerning Singing’, Section 42, p. 205. Stalham (d. 1677) was a reformed puritan.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-d141cab0f1" data-kw="Original Sin|Regeneration|Imputation" data-pol="">
<blockquote><p>Now although by regeneration we hold that the guilt and pollution of original sin is taken away as to dominion (because it is neither imputed to them anymore for condemnation, nor does it reign in them), yet we deny that it is absolutely taken away as to existence and whatever holds the relation of sin in it.</p></blockquote>
<figcaption>— <a href="../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 9.11.21</figcaption>

<blockquote><p>Sin, however, though it ceases to reign, ceases not to dwell in them. … We admit that these remains, just as if they had no existence, are not imputed, but we, at the same time, contend that it is owing to the mercy of God that the saints are not charged with the guilt which would otherwise make them sinners before God.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 3.3.11</figcaption>

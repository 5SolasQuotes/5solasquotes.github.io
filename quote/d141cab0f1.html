<main class="wrap"><figure class="quote" id="q-d141cab0f1" data-kw="Original Sin Regeneration Imputation">
<blockquote><p>Although by regeneration we hold that the guilt and pollution of original sin is taken away as to dominion (because it is neither imputed to them anymore for condemnation, nor does it reign in them), yet we deny that it is absolutely taken away as to existence and whatever holds the relation of sin in it.</p></blockquote>

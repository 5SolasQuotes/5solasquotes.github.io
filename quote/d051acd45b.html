<main class="wrap"><figure class="quote" id="q-d051acd45b" data-kw="">
<blockquote><p>As for your [Gilbert Burnet’s] demand, why in your worship [that of the Scottish non-cponformists] do you not kiss one another with a holy kiss? Seing it is nowhere commanded in worship, as you seem boldly and ignorantly to suppose, and the Christian manner of the thing, in customary civility, is only recommended by the apostle, as an allay of chastity and kindnesse in civil rencounters, the question is but a petulant extravagancy of your vain imagination.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … (1671), 3rd Dialogue, pp. 117</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9b54f2e462" data-kw="">
<blockquote><p>In every comparison there must be some dissimilitude. …‘Proportions are alike, but not the same.’ Christ’s body is not divided in parts as the bread; therefore there is no analogy betwixt Christ crucified and the bread? It follows not, for similitudes disagree in some things. Similitudes are not to be taken from things altogether different: as an ancient writer makes a comparison betwixt the ten plagues of Egypt and the Ten Commandments: so those who make the comparison betwixt the 70 disciples and the 70 palm trees; the 12 fountains and the 12 apostles: here the comparison is far sought. The comparison must agree in the main point, else it is not a comparison;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Synagogue</cite>, … (London, 1623), 3rd bk., ch. 2, ‘Of the Illustration of Doctrine by Comparisons’, p. 281</span></figcaption>

</figure><figure class="quote" id="q-a41ac9b02a" data-kw="">
<blockquote><p>As for Josh. 22:10, etc. [about the altar of Ed], it makes for the Common-Prayer-Book, not against it: since that altar was allowed of, though it were for religious signification, and yet not by Divine institution; and therefore proves, that all inventions of men, whereby our worship of God is signified, are not unlawful, if they be not made necessary, nor the worship of God placed in the things so invented, or their use.</p></blockquote>

</figure><figure class="quote" id="q-481419e3f6" data-kw="">
<blockquote><p>7. That Word of God was first ἄγραφον [unwritten], afterward ἔγγραφον [enscripturated], materially the same in both cases, even if not formally; [it was the same] intensively, even if not extensively.

8. It alone today is the rule of things to be believed and done, and therefore adequate to its regulated object.

9. As it has its authority comparatively from itself, so also it has it in itself, and although it can be persuaded to us through other means, yet it cannot be persuaded except through that very light which it has in itself, just as also the sun can be seen only by its own light.

10. The authority of the Church, whatever it may be, can be here εἰσαγωγική [introductory] and διηγητική [expository], but cannot be αὐθεντική [self-authorizing] or αὐτοπιστική [self-credentialing]; for although the Holy Spirit uses both the intrinsic light of Scripture and the extrinsic light of the Church in impressing faith concerning Scripture upon us, yet the former is the primary medium and motive, the latter only secondary.

11. The Church can use unwritten traditions whether public of councils or private of fathers, but ought not to rely upon them. And traditions subalternate to Scripture must always be distinguished from those opposed to it; the former to be admitted, the latter to be rejected.

12. All dogmatic traditions of the Roman Church fabricated outside God’s word are opposed to God’s word, ritual ones for the greatest part of them.

13. Neither the constitution of the [Biblical] canon nor the interpretation of the constituted canon ultimately rests on the authority of the Church.

14. The αὐτοκρατορικός [absolute ruler], judge of controversies, is the one Spirit of God, the κανονικός [normative] judge is sacred Scripture, the ὀργανικός [instrumental] or λειτουργικός [ministerial] judge is the Church, but the one which is true, not the one which merely professes itself to be true.

15. But Scripture is a real Judge, not personal, whence vain are the argumentations which are drawn against the real judge from the characteristics of a personal judge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sr-friedrich-spanheim.html">Friedrich Spanheim the Elder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</span></figcaption>

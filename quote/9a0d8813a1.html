<main class="wrap"><figure class="quote" id="q-9a0d8813a1" data-kw="">
<blockquote><p>This we are taught by the rites of the old Testament, where, by God’s commandment, Aaron and his children were openly chosen into the holy ministry, all the people looking on. Neither let it trouble us, that Paul seemeth to give authority to Titus and Timothy to choose Bishops. For he would not have them of their private authority to do anything, but according to the duty of Superintendents, to take heed that such as were worthy and meet, might be chosen for Ministers. And it is not likely, that they had more granted to them, than the Apostles had, which without the Church’s counsel, would never do anything in this matter. For not long after they chose Deacons openly before the congregation, and Paul and Barnabas by election ordained Elders in every congregation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An hundred, threescore and fifteen Homilies or Sermons, upon the Acts of the Apostles, written by Saint Luke</cite>, trans. John Bridges (London: Henry Denham, 1572), p. 67.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fc7e78958b" data-kw="">
<blockquote><p>Diverse resolve that text [Rom. 12:6-7] thus, that first the apostle makes a general division of ecclesiastical offices, ‘prophesy’, comprehending these that labour in the Word and doctrine; ‘ministry’ comprehending those that labor not in the Word and doctrine… Ministry, he subdivides into the office of the ruling elder, deacon, and the other of showing mercy, which was committed sometimes to old men, sometimes to widows.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, … (Edinburgh, 1649), ch. 5, p. 83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-e56a7aed84" data-kw="">
<blockquote><p>Bavinck… says, the church ‘cannot do without women in this work.’ This includes things like Sunday school, care for the poor and the sick, care for the elderly, the support of pregnant women, and more. He doesn’t think these activities need to be directly under the oversight of the church as an institution, but the church does have the calling to promote this kind of work where women use their gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wes-bredenhof.html">Wes Bredenhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Herman Bavinck on Women in the Church’</cite>, (2021)</span></figcaption>

</figure><figure class="quote" id="q-aacb89e623" data-kw="">

</figure><figure class="quote" id="q-636237e129" data-kw="">
<blockquote><p>If &quot;elders&quot; and &quot;bishops&quot; be not the same persons, having the same office, the same function, and the same duties, and the same names, it is impossible, So far as I understand, how it should be expressed: for these elders are they whom the Holy Ghost made bishops, they were many of them in the same church, their duty it was to attend unto the flock and to feed the church, which comprise all the duties, the whole function of elders and bishops; which must therefore be the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Nature of a Gospel Church and Its Government</cite>, ch. 4 (Works 16)</span></figcaption>

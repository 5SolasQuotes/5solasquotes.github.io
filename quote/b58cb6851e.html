<main class="wrap"><figure class="quote" id="q-b58cb6851e" data-kw="">
<blockquote><p>It is a deeply humbling truth – would that it were more present to the mind! — that there is enough of pollution in the character, motive, and aim of the most spiritual performance which the most holy believer can present, to awaken the severest expressions of God’s spotless purity and utter hatred of sin.

But Jesus is the true Aaron: he is the great High Priest; and by his ‘one offering,’ and continual presence before the throne in ceaseless and prevalent intercession, our poor, defective, polluted services are an ‘odour of a sweet smell, a sacrifice acceptable, well-pleasing to God.’</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-04a6736d4c" data-kw="">
<blockquote><p>It is not in the adorer’s power that kneeling should be a sign of lesse worship, as referred to the image, and of greater, as referred to God; for the same material kissing and religious rostration which would immediatly be conveyed to Christ if He were in person present in the image and elements, is done to the image and elements; and religious kissing and religious kneeling signifies internal divine submission of heart to God, as the First Author of all and the last end, not by man’s will, but by divine institution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), Ch. 1; p. 166</span></figcaption>

</figure><figure class="quote" id="q-40a2bfac5d" data-kw="">
<blockquote><p>Some years ago there was a sizeable movement among the Lutherans in Germany toward religiosity. Of some we believe that it was in truth, but with the majority it was but an illusion. This counterfeit religiosity has in some places also affected those of Reformed persuasion. People of the world, due to observing that many of them turned to a godly lifestyle, called them Pietists, thinking to offend them in this way. Instead, they, being ungodly, actually condemned themselves in doing so, and placed a crown upon the head of the truly godly whom they intended to offend—for to be a Pietist means to be a godly person. In desiring to warn everyone against the Pietists and to give some direction in this respect, we do not have the truly godly in mind at all. Far, far be this from me! May the Lord bless them and give them more light to see the Lutheran error and to turn away from it. Rather, I have in view those who stimulate various fictitious notions and errors, such as mystics, Quietists, heretics, fanatics, David-Jorists, Boehmists, Quakers, and all such individuals who in our day are known as Pietists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, 4 vols. transl. Bartel Elshout (Ligonier, PA: Soli Deo Gloria Publications, 1993), 2.642‐43.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-8b4ec1842b" data-kw="">
<blockquote><p>The Anatomie of Abuses probably carried additional weight with a certain class, because in its attitude toward the drama it took in the first edition a liberal position. The preface of that edition was careful to explain that its author did not condemn all plays. ‘Who seeth not,’ it read, ‘that some kind of playes, tragedies and enterluds, in their own nature are not onely of great ancientie, but also very honest and very commendable exercyses,’ containing matter ‘both of doctrine, erudition, good example, and wholsome instruction; And may be vsed, in tyme and place conuenient, as conducible to example of life and reformation of maners.’ In thus commending ‘honest &amp; chast playes’ as a Godly recreation of the min,’ and as a ‘good example of life,’ Stubbes advanced close to Lodge’s position. Yet, strange to say, in all subsequent editions this explanatory preface was left out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-stubbes.html">Philip Stubbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Stubbes’ Outlook | Elbert N.S. Thompson, XX. The Controversy Between the Puritans &amp; the Stage in Yale Studies in English PhD diss. (NY: Henry Holt &amp; Co., 1903), pp. 81-82</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

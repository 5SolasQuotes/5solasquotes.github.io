<main class="wrap"><figure class="quote" id="q-f0157dad23" data-kw="">
<blockquote><p>In addition to all that I have said, the true Christian by his ordinary hearing is taught to give some of his time to reading the Scriptures (and other good writers, as is said in another place), and this with good fruit, understanding, and comfort. Without the public ministry of the word, the Christian is likely to neglect and become weary of the labour of private reading and instead give himself to idleness or vain activities. Even if he should use the private means, without the public ministry of the word he will do so with less knowledge, comfort, or any other profit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-rogers.html">Richard Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Holy Helps for a Godly Life</cite>, ed. Brian G. Hedges (1603; Grand Rapids, MI: Reformation Heritage Books, 2018), p. 10.</span></figcaption>

<blockquote><p>3. Labour or pains for the enjoyment of the benefit and advantage of the solemn assemblies of the church, and in them of the appointed worship of God, is so far from entrenching on the rest of this day that it belongs unto its due observance. A mere bodily rest is no part of religious worship in itself; nor does it belong unto the sanctification of this day any farther than as it is a means for the due performance of the other duties belonging to it. We have no bounds under the gospel for a Sabbath-day’s journey, provided it be for Sabbath ends. In brief, all pains or labour that our station and condition in this world, that our troubles which may befall us, or any thing else, make necessary, as that without which we cannot enjoy the solemn ends and uses of this holy day of rest, are no way inconsistent with the due observance of it. It may be the lot of one man to take so much pains and to travel so far for, and in the due celebration of the Lord’s day, as if another should do the like without his occasions and circumstances, it would be a profanation of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, (d. 1683), vol. 1 (of 4), p. 749</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-8adbc56fff" data-kw="">
<blockquote><p>So it is with the whole of the discourse. The new law of the Sermon on the Mount, in itself, can only produce despair. Strange indeed is the complacency with which modern men can say that the Golden Rule and the high ethical principles of Jesus are all that they need. In reality, if the requirements for entrance into the Kingdom of God are what Jesus declares them to be, we are all undone; we have not even attained to the external righteousness of the scribes and Pharisees, and how shall we attain to that righteousness of the heart which Jesus demands ? The Sermon on the Mount, rightly interpreted, then, makes man a seeker after some divine means of salvation by which entrance into the Kingdom can be obtained. Even Moses was too high for us; but before this higher law of Jesus who shall stand without being condemned? The Sermon on the Mount, like all the rest of the New Testament, really leads a man straight to the foot of the Cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christianity and Liberalism</cite>, (1923)</span></figcaption>

<blockquote><p>We tell you prayers and praises are natural worship, considered merely as such: likewise there are indifferent occasional acts attending natural worship; as suppose, lifting up the hands or eyes to God in prayer, or in an usual ejaculation, or holy meditation.</p></blockquote>

</figure><figure class="quote" id="q-12ad2ed2ac" data-kw="">
<blockquote><p>As touching that point whether the minister should wear it [the surplice], although it be inconvenient: the truth is that I dare not be author to any to forsake his pastoral charge for the inconvenience thereof: considering that this charge, being an absolute commandment of the Lord, ought not to be laid aside for a simple inconvenience or uncomeliness of a thing which in the own nature is indifferent. The offence in occasioning the weak to fall and the wicked to be confirmed in their wickedness is one of the foulest spots in the surplice, and which of all other can make it most detestable in the eyes of a godly minister… But when it is laid in the scales with the preaching of the Word of God, which is so necessary for him that is called thereunto, that a woe hangs on his head if he do not preach it: it is of less importance than for the refusal of it we should let go so necessary a duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Rest of the Second Reply of Thomas Cartwright Against Master Doctor Whitgift’s Second Answer Touching the Church Discipline</cite>, … ([Basel: Guarinus, 1577]), pt. 2, ch. 8, pp. 262-63</span></figcaption>

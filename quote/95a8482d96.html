<main class="wrap"><figure class="quote" id="q-95a8482d96" data-kw="">
<blockquote><p>Times of persecution press severely on the weak and timid; but experience has decisively proved, that so far from these being the circumstances from which true religion has the most to apprehend, the very contrary is undeniable. The constancy with which the victims of bigotry bore their bodily sufferings, though heightened by all the ingenious devices which the most devilish malignity could invent, and the divine support which they manifestly experienced under the severest tortures, operated more powerfully in favour of Christianity, than all the terrors of a cruel death against it; so that it even passed into an axiom, “The blood of the martyrs was the seed of the church.” In seasons of persecution men are naturally driven to fundamentals. They are necessarily prompted to examine their own hearts, and to endeavour to ascertain their title to the blessed hopes and privileges of true Christians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-wilberforce.html">William Wilberforce</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introductory Essay (1823) to John Witherspoon, Treatises on Justification and Regeneration</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>And hereupon the question is wont to be demanded: Whether an evil, that is, a tyrannical magistrate be of God or no? To this I answer, that God is the author of good and not of evil. For God by nature is good, and all his purposes are good, being directed to the health and preservation, not to the destruction, of us men. Therefore the good and healthful ordaining of the magistrate, without all doubt, is of God Himself, who is the author of all goodness. But here it is requisite, that we make a difference between the office which is the good ordinance of God, and the evil person that does not rightly execute that good office. If therefore in the magistrate evil be found, and not the good for which he was ordained, that comes of other causes, and the fault thereof is in the men and persons, which neglect God and corrupt the ordinance of God, and not in God, nor in his ordinance: for either the evil prince, seduced by the devil, corrupts the ways of God, and by his own fault and naughtiness transgresses God’s ordinance, so far, that he does worthily deserve the name of devilish power, and not divine authority;-(we have an example hereof in the magistrate of Jerusalem: for although he were able to refer the beginning of his power by degrees unto Moses, and so unto God Himself who did ordain it; yet, for because he takes the Savior in the garden and binds Him, to his servants it is said, ‘Ye are come out as it were to a thief with swords and staves; when I was daily with you in the temple, ye stretched not forth your hands against me; but this is even your hour, and the power of darkness.’ Lo, here he calls the ordinary magistrate the power of the devil, when he abuses his power. What could be more evidently spoken? But here ye must mark, that the reproach was in the person, and not in the office. Likewise also the Roman empire was ordained by God, as by the visions of Daniel it is clearly evident: and yet, when Nero, not without God’s ordinance, bare the sway in the empire, whatsoever he did as king and emperor, contrary to the office of a good king, that did he not of God, but of the devil…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Decades</cite>, 1570’s-1580’s, as quoted in, ed. Edmund Morgan, Puritan Political Ideas, 1558-1794, pp. 18-19</span></figcaption>

<main class="wrap"><figure class="quote" id="q-b5413bcc5f" data-kw="">
<blockquote><p>Questions about babies who have died in their mother’s womb, about miscarried fetuses, the malformed and similarly abnormal babies can be duly resolved once the hypothesis is laid concerning the infusion of the soul (anima). For either the bodies truly were animate with a human soul, or they were not animate. If the former, then the resurrection applies to them, too, If not, then conequently excluded from the resurrection are such bodies to which the definition of human being does not apply.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, … ed. Harm Goris (Brill, 2020), vol. 3, Disputation 51, sect. 36, p. 557</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

<blockquote><p>(4) The formation of the foetus in the Virgin’s womb had its stages and processes, as is usual in the formation of other foetuses and which are usually completed in the space of 9 months. It was right that Christ should be made like us in this too, namely in not being formed and born in a moment, but being completed in a matrix suited to the order and processes of nature, the operation of the H. Spirit thus accommodating its process of quickening. (5) The union of the divine nature with the human began the moment the formation of the human nature was completed, so that it would be said to have been composed of human matter and form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bartholomaus-keckermann.html">Bartholomaus Keckermann</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, Person of Christ</cite>, As quoted in Heinrich Heppe, section 12, p. 425</span></figcaption>

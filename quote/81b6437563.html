<main class="wrap"><figure class="quote" id="q-81b6437563" data-kw="">
<blockquote><p>In establishing the Covenant of Redemption, unlike in predestination, the elect are viewed as fallen sinners, from whom God’s justice requires perfect satisfaction. Since they cannot render this, it is required, in the Covenant of Redemption, of their representative Head, Christ Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/g-h-kersten.html">G.H. Kersten</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, ch. 8, ‘Predestination’ in Reformed Dogmatics, p. 145</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

— G.H. Kersten, ch. 8, ‘Predestination’ in Reformed Dogmatics, p. 145">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+establishing+the+Covenant+of+Redemption%2C+unlike+in+predestination%2C+the+elect+are+viewed+as+fallen+sinners%2C+from+whom+God%E2%80%99s+justice+requires+perfect+satisfaction.+Since+they+cannot+render+this%2C+it+is+required%2C+in+the+Covenant+of+Redemption%2C+of+their+representative+Head%2C+Christ+Jesus.%E2%80%9D%0A%0A%E2%80%94+G.H.+Kersten%2C+ch.+8%2C+%E2%80%98Predestination%E2%80%99+in+Reformed+Dogmatics%2C+p.+145&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F81b6437563.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/81b6437563.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infralapsarianism-supralapsarianism/#:~:text=In%20establishing%20the%20Covenant%20of%20Redemption,of%20their%20representative%20Head%2C%20Christ%20Jesus&amp;text=In%20establishing%20the%20Covenant%20of%20Redemption%2C%20unlike%20in&amp;text=of%20Redemption%2C%20of%20their%20representative%20Head%2C%20Christ%20Jesus" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-26b513cea7" data-kw="">
<blockquote><p>Paul … alludes to the creation of Adam, and rises up to the eternal purpose of God, who, before he created mankind, decreed of his own mere will and pleasure, to manifest his glory, both in saving of some whom he knew, in a way of mercy, and in destroying others, whom he also knew, in righteous judgment. And verily, unless we judge this to be the case, God will be greatly injured; because he will not be sufficiently wise, who first creates men, and looks upon them corrupt, and then appoints to what purpose he has created them: nor sufficiently powerful, if when he has taken up a purpose concerning them, he is hindered by another, so that he obtains not what he willed; nor sufficiently constant, if willingly and freely he takes up a new purpose, after his workmanship is corrupted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Most Complete Tract on the Doctrine &amp; True Use of Predestination, out of the Lectures of Theodore Beza on Chapter 9 of the Epistle to the Romans</cite>, … adjoined are some places taken out of the book of Dr. Luther on the Bound Will Against Erasmus, from which appears that his judgment on Predestination was in everyway consonant with ours 2nd ed. ed. Raphael Eglin (Eustathius Vignon, 1583) 182, pp. no ToC Table</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>
<div class="actions"><button class="copy" data-copy="“Paul … alludes to the creation of Adam, and rises up to the eternal purpose of God, who, before he created mankind, decreed of his own mere will and pleasure, to manifest his glory, both in saving of some whom he knew, in a way of mercy, and in destroying others, whom he also knew, in righteous judgment. And verily, unless we judge this to be the case, God will be greatly injured; because he will not be sufficiently wise, who first creates men, and looks upon them corrupt, and then appoints to what purpose he has created them: nor sufficiently powerful, if when he has taken up a purpose concerning them, he is hindered by another, so that he obtains not what he willed; nor sufficiently constant, if willingly and freely he takes up a new purpose, after his workmanship is corrupted.”

tml">Permalink</a><a class="src" href="https://reformedbooksonline.com/infralapsarianism-supralapsarianism/#:~:text=alludes%20to%20the%20creation%20of%20Adam,purpose%2C%20after%20his%20workmanship%20is%20corrupted&amp;text=alludes%20to%20the%20creation%20of%20Adam%2C%20and%20rises&amp;text=a%20new%20purpose%2C%20after%20his%20workmanship%20is%20corrupted" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6400ffae23" data-kw="">
<blockquote><p>Remember (sirs) Jerusalem might have been gathered, even as a hen gathers her chickens under her wings, but she would not; if you will not, Christ has washed his hands of your blood: your damnation is of yourselves. And ah! think, (poor creatures) think what bad terms these are to be damned upon: what a gnawing upon your conscience in Hell another day will it be to think, ‘If I would I might have been saved; Heaven and glory might have been mine if I would, but now I am tormented, and shall be so forever, because I would not have the Lord Jesus Christ;’ this makes damnation the heavier, to think, there is no more required but only to open the door to receive the Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Collings</cite>, vol. 1 (London: Tomlins, 1655), Sermon 9, “A Cordial for a Fainting Soul”, pp. 153–54</span></figcaption>

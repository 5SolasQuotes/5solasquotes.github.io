<main class="wrap"><figure class="quote" id="q-deaecfe56e" data-kw="">
<blockquote><p>What God seeth once by his simple and absolute knowledge, he ever seeth, by one external and simple act, which is not capable of change, or forgetfulness; not now seeing, and now not seeing; he never seeth any new thing, but seeth and knoweth all things at once with one and the same sight; for the knowledge of God is the essence of God: according to that ancient and approved saying, Nothing is in God but God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-taylor.html">Thomas Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Regula Vitæ, the rule of the law under the Gospel. Containing a discovery of the pestiferous sect of Libertines, Antinomians, and sons of Belial, lately sprung up both to destroy the law, and disturb the faith of the Gospel: wherein is manifestly proved, that God seeth sin in justified persons</cite>, (London: Robert Dawlman, 1631), p. 92.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god.html">Attributes of God</a></span></div>

<blockquote><p>Sufficiently therefore the threefold way is explained in which we concede Christ as He is man, reigns everywhere with the Father: and in the first place [in primis], in his elect. First, indeed, by the virture, power and wisdom of his deity and divine nature. Next, by his Spirit and the gifts and effects of his Spirit. Lastly, by the fellowship even of his body and blood produced through the Holy Spirit.</p></blockquote>

</figure><figure class="quote" id="q-eee053512b" data-kw="">
<blockquote><p>Nothing does more to encourage true godliness than constant and deep meditation on the goodness and free mercy of God. Those who make good use of the benefits they receive from other people are motivated by sincere gratitude, whereas neglect of such benefits is a sure sign of ingratitude. Likewise, those who remember all the care and trouble their parents went to on their behalf cannot be anything but devoted and attentive to them. So those for whom God has done so much ought to meditate constantly on the goodness he has given them so far and realize what a great debt they owe him.

But we shall never recognize the magnitude of God’s benefits unless we compare the dignity of being children of God, into which Christ Jesus has raised us and which he has given us in the freedom of the Spirit so that we can call on God with the sweetest name of Father, with that unhappy and deplorable state in which we were born. If everyone devoted as much time to thinking about this as they should, they would soon develop a wonderfully intense desire to live in a godly way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), pp 186-87.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/goodness-love-and-mercy.html">Goodness, Love and Mercy</a></span></div>

</figure><figure class="quote" id="q-7f9e890881" data-kw="omnipresence purity">
<blockquote><p>What place can defile a spirit? Is light polluted by shining upon a dunghill, or a sunbeam tainted by darting upon a quagmire? What can steam from the most noisome body, to pollute the spiritual nature of God? As he is of purer eyes than to behold iniquity, so he is of a more spiritual substance than to contract any physical pollution from the places where he doth diffuse himself.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-e85297b56b" data-kw="">
<blockquote><p>Dr. Twisse maintained, as several eminently orthodox divines have done, ‘That God, by his absolute power, setting aside his decree or free constitution, can forgive sin without any satisfaction.’ He has a whole digression against Piscator and Lubbertus, on this subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Gratiae</cite>, bk. 1, Of Election, digression 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/necessity-of-satisfaction.html">Necessity of Satisfaction</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-06ffb72494" data-kw="">
<blockquote><p>…Socinus in the very entrance into his Treatise of Christ the Saviour affirms that God might if He had pleased, without breach of his justice, have pardoned man’s sin freely, without any satisfaction required: and the same he after again presses and prosecutes in his ensuing discourses. Whether this be an error or no, I stand not now to discuss. Vorstius herein concurred with Socinus; and is for the same reproved by Tossanus; Grotius likewise for affirming the same is taxed by Ravenspergerus; defended by Vossius, who cites divines not a few, both old and new, saying the same: And it is maintained to pass by all others, by Calvin, Musculus, Zanchi, Grinaeus, Faius, Casman, Tilenus, Franzius, Smiglesius and our reverend Dr. Twisse; yet I am persuaded that no wise or discreet man at least will hence conclude any of these to be therefore Socinian heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in Anthony Wotton, Mr. Anthony Wotton’s Defence against Mr. George Walker’s Charge... (Cambridge: Daniel, 1641), ‘The Issue’ (1641), pp. 59-60 See the original for the exact references.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/necessity-of-satisfaction.html">Necessity of Satisfaction</a></span></div>

eretics" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d9efed039d" data-kw="debt enmity crime satisfaction">
<blockquote><p>First, sin, which renders us guilty and hated of God and binds us over as debtors to punishment, may be viewed under a threefold relation either as a debt, which we are bound to pay to divine justice, in which sense the law is called “a handwriting”; or as enmity, inasmuch as it makes us enemies to God and God to us; or as a crime, on account of which we are exposed to condemnation and death. Corresponding to these, satisfaction ought to be a payment of debt, a reconciliation with God, and a propitiatory covering of the crime.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.10.6</span></figcaption>

</figure><figure class="quote" id="q-fa885123cb" data-kw="">
<blockquote><p>God might have redeemed us by a single word, or by a mere act of his will, if he had not thought it better to do otherwise for our own benefit, that, by not sparing his own well-beloved Son, He might testify in his person how much He cares for our salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/calvin.html">Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on John</cite>, 15:13</span></figcaption>

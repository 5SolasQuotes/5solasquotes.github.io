<main class="wrap"><figure class="quote" id="q-1a37cb9941" data-kw="">
<blockquote><p>In conclusion, the five membership vows used by the PCA were added to the Directory for Worship of the Book of Church Order by the PCUS in response to the growth of parachurch-interdenominational ministries in the late nineteenth and early twentieth centuries. This has been shown in particular with the addition of vow four that requires a member to support the church. The case was not developed in this brief article, but it is believed that the four vows adopted in 1894 were intended to distinguish church membership in the PCUS as a shepherded, historic, confessional, and evangelistic church from the parachurch, revivalism, and interdenominational churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barry-waugh.html">Barry Waugh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘History of Membership Vows, Presbyterian Church in America’</cite></span></figcaption>

</figure><figure class="quote" id="q-07a2916b3b" data-kw="">
<blockquote><p>In the sacrament of baptism the Independents lay a pathway to Anabaptism, for first they come close up to the most rigid Brownists, denying baptism to the most part of Christian infants; yea they will grant it to a very few: to these alone whose immediate parents are members of their congregation, who are a wonderful poor handful: all other infants they will have unbaptized till they come to the years of understanding and declare not only their actual faith and holiness, but their subjection to the Kingdom of Christ, that is to their Independency: they will have no stipulation made for the infants’ education… … Secondly, they esteem not baptized infants to be members of their church before they have entered into their [church] covenant; till then they hold them from the Lord’s Table and all the acts of discipline, as people without the Church and not members of it: If it be so, their baptism was of so small use that well they might have wanted it to the time of their admission to be members.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map (1645), ch. 6</cite>, pp. 119-20</span></figcaption>

acrament%20of%20baptism%20the%20Independents%20lay&amp;text=the%20time%20of%20their%20admission%20to%20be%20members" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-42dc7236d2" data-kw="">
<blockquote><p>Fourthly, the signs that difference a true Church from a false, do not primarily belong to a particular congregation, but to the Church-catholic-visible, viz. profession of the true faith, the administration of the true ordinances of God, the Word and sacraments; for therein all the whole Church agree, and is thereby distinguished from those that are without, not from those that are within. This is no note to know this or that particular church by, from another, for it is common to the universal Church, it distinguishes not among themselves, but from the general common opposite: the heathen, or the gross heretic. A man being lead into a vault where were the skulls of many dead men, and understanding that Alexander’s skull was there, desired his guide to show him that; his guide told him it was that skull with the hollow eye holes and with the gristly nose, and with futures crossing the brain pan, and when the man replied that they had all so, yea says his guide, there is no difference between kings and other men’s skulls when they are dead. So if any man should ask you or me which is the church of Ipswich, Dedham or Colchester, it were a folly to say it is the Church where the word of God is preached and sacraments administered, and that profess Jesus Christ to be crucified, dead and buried, risen again, and ascended into Heaven, for so do all the Church catholic, but I must give some other notes to distinguish any of them, for these are not distinctive, because common. Therefore the signs of the true Church belong primarily to the whole, secondarily to particular parts thereof, and are therefore not distinctive to the parts. That which is primary to any thing is distinctive to that thing, but that which is secondary and common is not distinctive from other particulars of the like kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Essence &amp; Unity of the Church, catholic, visible: and the Priority thereof in regard of Particular Churches Discussed (London, 1645)</cite>, p. 29</span></figcaption>

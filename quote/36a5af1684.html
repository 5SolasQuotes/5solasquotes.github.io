<main class="wrap"><figure class="quote" id="q-36a5af1684" data-kw="">
<blockquote><p>And here we must consider, that the Divine Nature did not assume an human Person, but the divine Person did assume an human Nature: and that of the three Divine Persons, it was neither the first nor the third that did assume this Nature; but it was the middle Person, who was to be the middle one, that must undertake this mediation betwixt God and us. which was otherwise also most requisite, as well for the better preservation of the integrity of the blessed Trinity in the Godhead, as for the higher advancement of Man-kind by means of that relation which the second Person the Mediator did bear unto his Father.

For if the fullness of the Godhead should have thus dwelt in any human person, there should then a fourth Person necessarily have been added unto the Godhead. And if any of the three Persons, beside the second, had been borne of a Woman; there should have been two Sons in the Trinity: whereas now the Son of God and the Son of the blessed Virgin, being but one Person, is consequently but one Son; and so no alteration at all made in the relations of the Persons of the Trinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immanuel, or, The Mystery of the Incarnation of the Son of God Unfolded</cite>, (Oxford: Leonard Lichfield, 1643), pp 8-9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-56ca4a6008" data-kw="">
<blockquote><p>Although he took on him those infirmities which belong unto our human nature as such, and are inseparable from it until it be glorified, yet he took none of our particular infirmities which cleave unto our persons, occasioned either by the vice of our constitutions or irregularity in the use of our bodies. Those natural passions of our minds which are capable of being the moans of affliction and trouble, as grief, sorrow, and the like, he took upon him; as also those infirmities of nature which are troublesome to the body, as hunger, thirst, weariness, and pain,—yea, the purity of his holy constitution made him more highly sensible of these things than any of the children of men;—but as to our bodily diseases and distempers, which personally adhere unto us, upon the disorder and vice of our constitutions, he was absolutely free from them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 3, Pneumatologia, or a Discourse Concerning the Holy Spirit, bk. 2, ch. 3, p. 167</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-27582475a9" data-kw="">
<blockquote><p>Add to all these ends, this in the last place, That Christ by his nativity hath raised our human nature, the dignity of which was another end of it. Oh! how might I shew the love of Christ to transcend in this end of his nativity! Certainly believers Christ by uniting your nature to his own, did mightily dignify it. How doth the human nature shine in the luster of the divine?

How doth the pebble (man’s nature) glister in the golden (I should say the glorious) ring of the divine nature? O the transcendency of Christ love, that he would stoop so low, as to be born for this end, that thereby he might raise high the nature of his beloved ones, i.e. believers!

So that thus you see how the birth of Christ (thoroughly viewed) giveth a bright discovery of the transcendency of his love. Certainly, if you spiritually contemplate all that love which shines in the birth of the Lord Jesus, you will easily conclude, that his love to believers passeth knowledge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-durant.html">John Durant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A discovery of glorious love, or, The love of Christ to believers opened, in the truth, transcendency, and sweetness thereof together with the necessity that lies upon every believer, to strive after the spiritual and experimental knowledge of it: being the sum of VI sermons preached upon Ephesians </cite>, (London: W. Gilbertson, 1655), pp 99-100.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a></span></div>

</figure><figure class="quote" id="q-33be85adb9" data-kw="">
<blockquote><p>His profound feeling of dependence on God, for example, is illustrated in every conceivable way, not least strikingly in the constant habit of prayer which the Evangelists ascribe to him. But we are never directly told that he felt this dependence on God or “feared God”, or felt the emotions “of reverence and awe in the divine presence…¹ The narrative brings Jesus before us as acting under the impulse of all the religious emotions; but it does not stop to comment upon the emotions themselves. ¹ Cf. Heb. v. 7: “having been heard for his godly fear ([Greek] Eulabeia)”, i.e. for his reverent and submissive awe,” that religious fear of God and anxiety not to offend Him which manifests itself in voluntary and humble submission to his will” (Delitzsch in loc.). Davidson in loc: “The clause throws emphasis on the Son’s reverent submission.” Humanitarian writers debate whether “fear” of God is to be attributed to Jesus. Wellhausen (Israel, und jud. Geschichte, p. 383, expanded in Skizzen und Vorarbeiten, i. 1884, p. 98) represents him as passing his life in fear of the judge of all: “He feels the reality of God dominating life, he breathes in the fear of the Judge who demands account of every idle word and has power to destroy body and soul in hell.” Similarly Bousset (Jesus, 1904, pp. 54, 99, E. T. pp. 112, 203) speaks of him as learning by his own experience” that God is terrible (furchtbar) and that an awful darkness and dread encircles him even for those who stand nearest to him,” and as “sharing to the bottom of his soul” “the fear of that almighty God who has power to damn body and soul together,” which he “has stamped upon the hearts of his disciples with such marvellous energy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Emotional Life of our Lord’</cite>, (1912), pp. 80-81</span></figcaption>

<main class="wrap"><figure class="quote" id="q-3889c8ecc7" data-kw="">
<blockquote><p>In respect of God, our election standeth certain from all eternity… But in respect of ourselves it is uncertain, and therefore we must ‘strive to make the same sure’ by good works, 2 Peter 1:10. These are the ways to come to heaven, though they be not the cause why we should come to heaven; therefore we must keep the way, if ever we mean to come to heaven; for as we are ordained to the end, so are we ordained to the means which bring us to that end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In ‘Good Works are the Way to Heaven’ in The Lawyer’s Question: In Three Sermons (1595) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866)</cite>, 2:108</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“In respect of God, our election standeth certain from all eternity… But in respect of ourselves it is uncertain, and therefore we must ‘strive to make the same sure’ by good works, 2 Peter 1:10. These are the ways to come to heaven, though they be not the cause why we should come to heaven; therefore we must keep the way, if ever we mean to come to heaven; for as we are ordained to the end, so are we ordained to the means which bring us to that end.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-475892f890" data-kw="">
<blockquote><p>We are not enemies to good works (as our adversaries falsely charge us), nay we preach good works, we exhort to good works, we establish good works, teaching the right use of them out of the Word of God: which is not to concur, or be joined with faith in our justification, but to follow necessarily and issue out of faith, as lively testimonies thereof, to the glory of God, the example of others, and our comfort…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis Papismi (London, 1592), The Five Other Popish Sacraments, The Benefits of our Redemption, Third Part: of Justification, 4th Question</cite>, p. 595</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-e2c8bb289e" data-kw="">
<blockquote><p>Lastly I answer that the ground of the former objection is erroneous, namely that the promise of salvation depends on the condition of our works: because the Scripture says it is made and accomplished on man’s part freely. I grant indeed that to the promise there is annexed a condition of faith: yet faith must not here be considered as a work, but as an instrument apprehending Christ with his benefits: and withal, repentance with the fruits thereof are on our part required, yet no otherwise but as they are necessary consequents of faith and the signs and documents thereof.</p></blockquote>

</figure><figure class="quote" id="q-286f8950c6" data-kw="">
<blockquote><p>Hence it is plain, that a certain sure way is laid down to the kingdom of heaven by God himself, and that the same is a narrow way, namely, that of virtue and holiness: not the broad way of iniquity and lust. As therefore, if there is a certain, only, and prescribed way, which leads to any city, it is necessary to all who wish to enter that city, to take this way; so, since by the Divine appointment the way of good works leads to the goal of eternal glory, he must inevitably enter upon and hold this way, who desires to arrive thither,</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Justification, 1:302-3, on Mt.</cite>, 7:14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-62db74b4f4" data-kw="">
<blockquote><p>We are created unto good works which God hath ordained, that we should walk in them as the elect vessels of God, not thereby to merit salvation, but to signify unto the world that we be the elect of God, who being possessed with faith, show forth the fruits of faith, which are our good works, to the example of others, that they may follow in well-doing.</p></blockquote>

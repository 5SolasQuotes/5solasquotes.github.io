<main class="wrap"><figure class="quote" id="q-8fc5fc63ab" data-kw="">
<blockquote><p>But, on account of the impossibility of a fully adequate comprehension of God, nevertheless all conception of God is not to be denied to man, as if finite man is in no way able to form a concept of the infinite, as [Thomas] Hobbes [d. 1679] maintains, against whom Cocquius¹ disputes concerning this matter, in his Anatome Hobbesianismi, locus VI, chapter XII, pages 114-118… ¹ Gisbertus Cocquius (1630-1708) of Utrecht was a Reformed thinker and doctor of philosophy; he opposed Hobbes. Compare also Heidanus² in his Consideratien, etc., pages 134-138, upon occasion of this thesis, proscribed by the curators of the Academy of Leiden, that ‘Men have an adequate idea of God.’ ² Abraham Heidanus (1597-1678) was a Dutch Reformed minister and Cocceian theologian. He served as professor of theology at Leiden from 1648 to 1676, but he was ultimately dismissed for his Cartesianism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernard De Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>11. ‘Incomprehensibility of God’ in Continuous Commentary, ch. 4, ‘On God’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eae69fdcb9" data-kw="">
<blockquote><p>On page 174, I also address the issue of the senses—whether and how they can be considered the source (as they are commonly called by philosophers and theologians, specifically by Alting as cited above) of our natural knowledge of God. The role of sense knowledge needs to be clarified, both against the skeptics on one side, and against Vorstius and the anthropomorphites who make God an object of physical vision on the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation on the Ways of Knowing God, pt. 1 tr. Michael Lynch (1665)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

</figure><figure class="quote" id="q-7eb132bfe3" data-kw="attributes essence">

</figure><figure class="quote" id="q-2625f706ef" data-kw="">
<blockquote><p>A fallacy of accident is also committed by those who claim that if God were immutable, then He could not be said to have life. For while the living things of our experience do indeed change in various ways (by growing, taking in nutrients, moving about, learning, and so forth), it doesn’t follow that any possible living thing must undergo change. What is essential to a thing’s being alive, at least on the traditional Aristotelian account of life, is that the thing operate in the basis of an internal principle, as opposed to being entirely dependent on external forces. Hence, an animal can be said to be alive insofar as at least much of what it does flows from its own nature, whereas a stone is not alive because it is entirely passive, and can do things (such as breaking a window) only insofar as other things act upon it… Now, as the uncaused cause of all things, God certainly acts in a way which does not require his being acted upon by anything else. Hence, He can certainly be said to have life. Indeed, unlike other living things (all of which to some extent, even if not entirely, require being acted upon by other things, insofar as they need to eat, breathe, and so forth), God acts in a way which is completely independent of anything else. Hence, He can be said to have life in the fullest way possible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Proofs of the Existence of God (Ignatius Press, 2017), ‘The Divine Attributes’, ‘Immutability’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

</figure><figure class="quote" id="q-70474a5499" data-kw="">
<blockquote><p>When we speak of a concept that is predicated univocally, we say, with Scotus, that that concept is univocal “which is one in such a way that its unity suffices for contradiction, by affirming and denying it of the same thing. It suffices too for a middle term in syllogisms, so that extremes united in a middle term that is thus one are shown, without the fallacy of equivocation, to be united with each other” (Oxon. 1 d.3 q.2 n.5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-wolter.html">Allan Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958)</cite>, p. 89</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

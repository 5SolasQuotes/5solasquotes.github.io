<blockquote><p>First. So accordingly he [Joel] invites to a general and national humiliation, it was to be proclaimed by the sound of the Trumpet, vers. 15. not by a knock at a private man’s door, the trumpet was to call together the whole congregation, Num. 10.2. And if ye look to the first verse of this 2 Chap. of Joel, then the judgement comes with a trumpet, it sounds an alarm, it threatens all the inhabitants of the Land; if God threatens with a trumpet, we must call to repentance with a trumpet; with as loud and shrill a sound, that the whole nation may be warned; it must be Zephanies humiliation, Zeph. 2.1, 2. Gather your selves together, O Nation not to be desired, it must be like the fast of expiation, which was the yearly fast in Israel, all must humble themselves, it is a day of atonement, Levit. 23.28, 29. For to make an atonement for you before the Lord your God whatsoever soul it shall be that shall not be afflicted, in the same day he shall be cut off from among his people; personal, and private humiliation, is not of that prevailing efficacy in general danger; God tells the Jews that the prayers of two or three, though never so righteous men, Ezek. 14.14. As Noah, Daniel, and Job, should not divert a judgement from a whole Nation, they might escape themselves; but if the Nation repented not, the whole Land should perish; there is more must go to the removing of a general judgement; we may spit out a spark, or one man’s diligence may quench a small fire, but when a whole Town is on fire, every man must bring his Bucket.

One man’s prayer to remove a National Judgement, is as if we go about to quench a raging fire by sprinkling a little water out of a casting bottle; see this practised by the Jews, 1 Sam. 7.2. all the house of Israel lamented before the Lord, and see how they expressed and testified it, verse the 6. they gathered together to Mispah, and draw water, and poured it out before the Lord, and fasted on that day, and said there, we have sinned against the Lord, their eyes were as buckets, their heads fountains of tears.

And is not a fire kindled amongst us, how many smoking fire-brands are scattered through the Land, we may say of our present sad condition as our Prophet Joel speaks, Joel. 1.2. Hear this you old men and give ear all the Inhabitants of the Land, hath this been in your days, or in the days of your fathers, who can remember such distractions in our kingdom, when did this kingdom shake and totter as now it doth; first troubles in the North, when that’s quenched, the flame breaks out in Ireland, sparks scattered amongst our selves, as Ezekiel prophesies, mischief shall come upon mischief, and rumour shall come upon rumour, Ezek. 7.26. Thus out humiliation should be general, and as it must be general humiliation, so secondly it must be solemn by the help of a fast not to eat the bread of men.

First to testify our inward sorrow, the body must be afflicted.

Secondly, by this solemn fast to protest our unworthiness of the least support of life or refreshing, not worthy of the portion (of Whelps) of the crumbs that fall from the table.

Thirdly, to express our earnestness and importunity of prayer, and calling upon God, that we will lye prostrate before God, take no denial, not eat bread till he granted our petitions, as Saul vowed, not once to eat till he had obtained his victory; as David vowed, not to sleep or slumber till he had effected his desire, now this duty of repentance and humiliation, it is pressed upon them by a double motive; the first is the denouncing of judgement, and that not barely foretold, but exactly described in a dreadful manner the more to affect them; God musters up his force and sets them in battle aray, from the 2. verse to the 12. the Chariots of God are 20. thousand, even thousand of judgements, and the Lord is among them to turn the battle to the gate, ah, this will work fear, and fear is a good ingredient to repentance; thus he urges his people to repentance by the presenting of terrors; Amos 4.12. Therefore thus will I do unto thee O Israel, and because I will do this unto thee prepare to meet thy God O Israel; thus Habakkuk was afflicted with the threatnings of judgement ch. 3.16. when I heard my belly trembled, my lips quivered at the voice, rottenness entered into my bones, and I trembled in my self; God looks for this submission, that we should be startled at his judgements, the Lion hath roared who will not fear, Amos the 3.8. moved with fear, that’s one motive, and that drives us to repentance.</p></blockquote>

<blockquote><p>…any one who is willing… will easily perceive how… Mark has inserted this notice of the third hour, so that every one may there be led to bethink himself of an hour at which the Jews really crucified the Lord, although they sought to transfer the burden of the crime to the Romans… Thus, lest any one should leave the Jews out of account, and make the conception of so great a crime lie against those soldiers, Mark gives us here the statement, ‘And it was the third hour, and they crucified Him,’ his object being to have those Jews rather discovered to be the real crucifiers, who will be found by the careful investigator in a position making it quite possible for them to have cried out for the Lord’s crucifixion [before Pilate, Mk. 15:13-14] at the third hour, while he [the investigator] observes [via the Gospel of John] that what was done by the soldiers took place at the sixth hour.</p></blockquote>

<blockquote><p>On this account, he is said to have been made under the law by an economical subjection that he might redeem us from the bondage of the law and confer upon us the adoption or the right of sons (Gal. 4:4, 5). On this, the right to life depends because “if children, then heirs” (Rom. 8:17).</p></blockquote>

<blockquote><p>This is commonly held to be twofold: the one of emptying and humiliation; the other of exaltation and majesty; of suffering and of glory; of battle and of triumph; of the way and of the goal; of death and of life. The following demonstrate the verity of both. (1) The oracles of the Old Testament in which he is foretold. In Ps. 8 mention is made of his being made a little lower than the angels (which is the emptying) and of his being crowned with glory and honor (which is the exaltation). In Ps. 110:7, it is said of the Messiah, “He shall drink of the brook in the way; therefore shall he lift up the head.”</p></blockquote>

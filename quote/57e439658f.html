<blockquote><p>That to be thoroughly assured of the truth of a Religion, it is necessary to examine the nature of the reasons, upon which it is grounded.

Seeing that such is the inclination of our nature, it concerned him who desireth to be thoroughly settled in the assurance of the truth of his Religion, narrowly to consider, whether they are bare prejudices, plausible pretences, respects merely carnal which make it pleasing unto him, or whither the truth of it be so clear, and evident, that the conscience remains convinced with it, the soul satisfied, the mind resolved and content.

This disquisition, this meditation will be of excellent use in making way for the discerning in matter of Religion, of truth from error, superstition from piety, of the abuse from that which is legitimate, custom from law. For it will furnish us with proofs, not drawn from the circumstances of the accessory, and that which is merely accidental: but such as are grounded upon the principal, and which result from the nature, &amp; essence of the thing itself. Proofs infallible, and enforcing a necessary conclusion, whereas the other either conclude not at all, or if they do, the most the conclusion can do, is to make the cause for which the proofs were produced plausible, and gracious, the contrary suspected, and odious, being nothing else (if we esteem of them as they are) but likely-hoods of truth, pretty conjectures.

Now is it not well known that the most plausible, and gracious causes, are not always of their rank, which being not commended but by their own proper right, have that for the only ground, &amp; reason not of the favour, but of the justice they demand? And those which by reason either of the ignorance, or partiality of men are suspected, and hated, have they not oft-times the laws, and equity on their side? Certes the most pure, and (as I may say) the most innocent innocency would be punishable, were it enough to make one guilty, to be thought so.

But we may proceed farther, and affirm that the suspicion of falsity, is a calamity ordinary to truth. Under an uncomely mask, their may be hid an admirable beauty. Should the diamond lose it’s invincible solidity, or the inward fountain of its bright, and sparkling luster if sometimes it be found so outwardly discoloured, that at the first view, it can hardly be known for a diamond?

In the Courts of Justice it’s ordained that accusers should bring in their inditement of the largest, that the court may be fully informed concerning the accused parties: yet this is not called condemnation, but it only presupposeth a suspicion. Let then prejudices, exceptions, and pretences be employed to the uttermost, to make a religion suspected, so that upon them without more ado the accusers ground not its condemnation, so that they tarry upon terms of suspicion until they proceed orderly to a larger enquiry, and a stricter examination, so that the question be not a whit spared, nor if it be possible, the most vigorous proof.

If a rich diamond suspected of bastardy had sense, it would call for the touchstone, and desire to be admitted to a trial. Truth also being suspected, rejoiceth and presuming upon victory, triumpheth already, if she be put to a serious examination, and her last trial. The decree which imposeth this upon her, is not against her, but for her, this disgraceth her not but helpeth her to the only means by which she may redeem her credit. This is that she most earnestly desireth as being a passage, and introduction to her glory.

It is her affliction to be suspected, but she maketh not that her complaint, this is not the subject of her grievances, custom hath sweetened this unto her, and made it tolerable. Her complaint and grief which she cannot so easily digest is that she seeth her self condemned upon surmises, her cause not being sifted to the bottom, where lieth the main point of her defence, and where she hath reserved all her strength. For otherwise by reason of by matters in the form of proceeding, circumstances, appearances, conjectures, she would be quite lost, &amp; ofttimes borne down by a lie. Is it not too well known that by such means the better causes are lost? That by such tricks bad causes almost commonly in corrupt times seek and obtain the victory?</p></blockquote>

<blockquote><p>The riches of the unsearchable favours of my spouse towards me have been so great, he hath made his glory to dwell so sensibly in this land, that I may boldly say, Mercy and truth righteousness and peace had never since Christ’s coming in the flesh a more glorious meeting, &amp; amiable embracing on earth, then ye have seen amongst your selves in the rough end of this northern Land: which therefore hath justly obtained (to my no small comfort) a great name among the chief Kirks and Kingdoms in the World.

A people that sat in darkness hath seen a great light, and to them who sat in the region of death light is sprung up. To what nation under heaven (when now the sun of righteousness hath shined upon the most part of the world) hath the Lord communicated the Gospel for so large a time, with such purity, fullness, prosperity, power, liberty and peace. The hottest persecutions had never greater purity, and power; the most halcyon heretical times had never more prosperity and peace; the best reformed Kirks in other places can hardly parallel your fullness and liberty.

And all these with such continuance, that not only hath he made the truth to stay with you, as he did the sun in the days of Joshua; but when the cloud of your iniquities did hasten it to go down, in his mercy hath he brought back the glorious sun by many degrees as in the times of Hezekiah. Oh that ye had known the long pleasant day of your visitation, and in this your day the things belonging unto your peace.

Christ hath not only been one, &amp; his name one, in respect of his prophetical office for your information, of his priesthood for the expiation of your sins, and intercession for you: but also hath displayed his banners; and hath shewed himself (few can say the like) a sovereign King in our Land, to govern you with his own sceptre erected in his Word, to cut off with his sword all monuments of Idolatry, and superfluity of pompous ceremonies; &amp; to restore all the means of his worship in Word, Sacraments and discipline to the holy simplicity and integrity of the first pattern shewed in the mount; from the which, by that wisdom of man which is ever foolishness with God, they had fearfully and shamefully swerved.

The sincerer sort of the bordering nations about you, have been so ravished with that beauty of the Lord upon your Sion, with that crown of glory and rich diadem by the hand of our God set upon your heads, that they have made you the meath [sic] of their religious wishes: they have with vehement desires longed to see the things that ye have seen. And have not spared to profess, that in your case, they would rather suffer themselves to be dissolved, then that one pin of that holy Tabernacle so divinely compacted should be loosed.

Within and amongst your selves that purity of profession received universally with so full consent, that Prince and Peers, Pastors and people were all for Christ, one heart &amp; one soul of those who believed, with such evidences of God’s favour that the windows &amp; gates of heaven seemed to be opened, to rain down upon this Land spiritual gifts to save you, as sometime they had been ready to pour down rain to destroy the world, every hand almost received some gift, and every head crowned with some grace, with such success that it brought a rare unity, prosperity, &amp; peace upon Kirk &amp; common wealth.

With such power and presence of the spirit of God in converting, comforting &amp; confirming his people that Satan was seen fall like lightning from heaven, the infidel and unbeliever casting himself down on his face, and confessing that undoubtedly God was amongst you, and in the middest of your meetings, as the soules of his own secret ones can best bear witnesse, who have been most submitted to that holy and happy simplicity, the effects whereof yet remaining in the hearts of many, all worldly power be it never so violent shall not be able to remove it.</p></blockquote>

est+of+your+meetings%2C+as+the+soules+of+his+own+secret+ones+can+best+bear+witnesse%2C+who+have+been+most+submitted+to+that+holy+and+happy+simplicity%2C+the+effects+whereof+yet+remaining+in+the+hearts+of+many%2C+all+worldly+power+be+it+never+so+violent+shall+not+be+able+to+remove+it.%E2%80%9D%0A%0A%E2%80%94+David+Calderwood%2C+The+speech+of+the+Kirk+of+Scotland+to+her+beloved+children%2C+%28Amsterdam%2C+1620%29%2C+pp+5-9.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff6f09774b0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f6f09774b0.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/06/21/david-calderwood-on-the-glory-of-the-reformed-church-of-scotland/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The voluntary and unnecessary dividing and separation from a true Church is schismatical. When we put bounds and partitions between it and ourselves, we sin (say some) as did these seducers here taxed by Jude. If the Church be not heretical or idolatrous, or do not by excommunication, persecution, etc. thrust us out of its communion; if it be such an one as Christ the head has communion with, we the members ought not by separation to rend and divide the body. To separate from congregations where the word of truth and Gospel of salvation are held forth in an ordinary way (1 Tim. 3:15), as the proclamations of princes are held forth upon pillars to which they are affixed; where the light of the truth is set up as upon a candlestick to guide passengers to heaven. (Rev. 1:13) To separate from them to whom belong the covenants, and where the sacraments, the seals of the Covenant, and for substance rightly dispensed, where Christ walks in the midst of his golden candlesticks, and discovers his presence in his ordinances, whereby they are made effectual to the conversion and edification of souls, in an ordinary way; where the members are saints by a professed subjection to Christ and his Gospel, and haply have promised this explicitly and openly; where there are sundry who in the judgment of charity may be conceived to have the work of grace really wrought in their hearts by walking in some measure answerable to their profession: I say to separate from these, as those with whom Church communion is not to be held and maintaind, is unwarrantable and schismatical.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkyn.html">William Jenkyn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Jude</cite>, (London: Maxey, 1654), on vv. 17-19, pp. 589-90</span></figcaption>

<blockquote><p>Upon the Sabbath, [the 15th] when we were convened in the muir to hear sermon, they called a council of war and called the whole ministers, and told them, if they did not preach, name and sir-name, against the indulgence, they should preach none. They [the ministers] thought it very hard to be kept within guard, and to be commanded what to preach. They told them, they were to receive their commission from Jesus Christ what to preach, and not from them. When we heard of it, we came [to the council meeting] — for they never called us if we came not of ourselves. We told them that it was the height of supremacy to give instructions to ministers what to preach; we would hear no such doctrine. With this confusion this day was well spent, and when they saw us own them (the ministers) and that they could not prevail, they slipped their way; and so they went and preached, and every man went to hear him whom they liked best. At this debate there was one minister left us, and never returned again [to the camp], but was a-coming upon the Monday when we were broken; for he declared to me, when he was let out without the guard, that he thought they were set to take their lives.</p></blockquote>

<blockquote><p>V. Particular churches how they may be known, whether they be true churches or not.

And hereby we believe every particular church may be discerned, whether it be a true church gathered in the Lord, even by those things whereupon the Lord hath willed them to be built, namely upon the preaching of the gospel, the administration of the sacraments instituted of Christ and the keeping of his commandments. Therefore those churches we acknowledge for the true churches of Christ, in which first the pure doctrine of the gospel is preached, heard and allowed of, and that so allowed of, that there is no place nor hearing for the contrary.

For these both are properties of the flock or sheep of Christ, namely to hear the voice of their shepherd and to reject the strangers voice. In those also, where the sacraments instituted of Christ (as much as in them lieth) are lawfully, that is according to Christ’s own institution administered and received, and so where other sacraments devised by men are not allowed of.

In those lastly, where the discipline of Christ taketh place, that is, where a care is taken through love, that both privately and publicly, by admonitions, corrections and, when need requireth, by excommunications the commandments of Christ may be observed. And so that men may live soberly, justly, and godly to the glory of God and edification of their neighbours.

For, wheresoever ungodliness and all looseness of life is in public practise and open offences are not reproved according to the discipline of Christ, there we believe that it is possible that many good and godly men may be, but we believe this is not a godly and christian congregation; the Lord himself saying: ‘In this men shall know that ye are my disciples, if ye have love one to another’. But what love can there be, where no care is taken that according to Christ’s doctrine brethren, which offend, may be corrected, may repent, may be gained unto the Lord and saved?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), XXIV.V, 1: 395-97.</span></figcaption>

— Jerome Zanchi, De religione christiana fides – Confession of Christian Religion, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), XXIV.V, 1: 395-97.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CV.+Particular+churches+how+they+may+be+known%2C+whether+they+be+true+churches+or+not.%0A%0AAnd+hereby+we+believe+every+particular+church+may+be+discerned%2C+whether+it+be+a+true+church+gathered+in+the+Lord%2C+even+by+those+things+whereupon+the+Lord+hath+willed+them+to+be+built%2C+namely+upon+the+preaching+of+the+gospel%2C+the+administration+of+the+sacraments+instituted+of+Christ+and+the+keeping+of+his+commandments.+Therefore+those+churches+we+acknowledge+for+the+true+churches+of+Christ%2C+in+which+first+the+pure+doctrine+of+the+gospel+is+preached%2C+heard+and+allowed+of%2C+and+that+so+allowed+of%2C+that+there+is+no+place+nor+hearing+for+the+contrary.%0A%0AFor+these+both+are+properties+of+the+flock+or+sheep+of+Christ%2C+namely+to+hear+the+voice+of+their+shepherd+and+to+reject+the+strangers+voice.+In+those+also%2C+where+the+sacraments+instituted+of+Christ+%28as+much+as+in+them+lieth%29+are+lawfully%2C+that+is+according+to+Christ%E2%80%99s+own+institution+administered+and+received%2C+and+so+where+other+sacraments+devised+by+men+are+not+allowed+of.%0A%0AIn+those+lastly%2C+where+the+discipline+of+Christ+taketh+place%2C+that+is%2C+where+a+care+is+taken+through+love%2C+that+both+privately+and+publicly%2C+by+admonitions%2C+corrections+and%2C+when+need+requireth%2C+by+excommunications+the+commandments+of+Christ+may+be+observed.+And+so+that+men+may+live+soberly%2C+justly%2C+and+godly+to+the+glory+of+God+and+edification+of+their+neighbours.%0A%0AFor%2C+wheresoever+ungodliness+and+all+looseness+of+life+is+in+public+practise+and+open+offences+are+not+reproved+according+to+the+discipline+of+Christ%2C+there+we+believe+that+it+is+possible+that+many+good+and+godly+men+may+be%2

<main class="wrap"><figure class="quote" id="q-05426fba33" data-kw="both kinds">
<blockquote><p>From this the opinion of the Romanists is evident without any further investigation. Ours is wholly contrary. In fact, we think that the communion under both kinds instituted by Christ should necessarily be retained; so that it is not only free to each one to use it, but from the command of Christ they are individually bound to it, unless they are prevented by some insuperable hindrance. Not without the highest sacrilege can the cup be taken away from the people against the express law of God. The state of the question therefore (1) is not Was communion under both kinds instituted by Christ? (which our opponents do not dispute); but Ought it to be instituted in like manner by believers, so that it is not only a thing indifferent and accidental, but necessary and essential to the perfection of the sacrament? (2) The question is not Is the believer so bound to communion under both kinds that he cannot in any case without sin commune under one kind only? For we confess if any unavoidable impediment interposes, either internal (arising from the disposition of the receiver) or external fr</p></blockquote>

<blockquote><p>It were a greater work to illustrate these great mysteries as they deserve, and I am unwilling to meddle with their obscene impurities, which are daily before the eyes and faces of all, that it may be understood that the mass, taken in the most choice form in which it can be exhibited, without any appendages, teems from head to foot with all kinds of impiety, blasphemy, idolatry, and sacrilege.</p></blockquote>

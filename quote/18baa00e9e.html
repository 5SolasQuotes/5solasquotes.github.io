<blockquote><p>2. The wilderness of sorrow, contrition, repentance, call it what you please, though I know the latter term ‘repentance’ be controverted by some new opinionists. Yet I know not why we may not say that a man may repent without saving grace. And for that repentance which they say must be the effect of faith, if I were a schoolman, I should rather call it godly sorrow, but I desire not to play upon terms: and for their defining repentance to be a sorrow for sin out of the sense of the love of God revealed in Jesus Christ, it is a definition they have devised for their own purpose; and give them their premises according as they please, they would be poor logicians if they made the conclusion to displease them: for from hence they argue, if the love of God be the ground and cause of repentance (viz. the love of God manifested and sensible to us, we having apprehended it by faith), the special love of God, then faith must go before repentance, viz. an apprehension of God’s saving love and reliance upon it. But I answer: the definition which they give us of repentance is deceitful; it is a definition of a species instead of a genus (as we say in logic). As some unwary divines define faith, to be an assurance of God’s love in Jesus Christ: this is true, but this is a faith of the highest stamp, and many a precious soul is without this faith to his dying day. Faith of adherence is another thing; as if I should go to define a man to be a reasonable creature, skilled in all sorts of learning. Any man would understand me, that I did not go about to describe a man in general, but this or that particular man. And I say once again, if I were a schoolman, I should rather call this a godly sorrow, and define repentance in general to be a sorrow for sin, there is the genus and differentia: or if there be required a fuller definition with the ground, though I conceive such a definition would be more proper to give of repentance in its several kinds than of repentance in general; yet we may give it thus, it is a sorrow for sin, arising out of the fear of God’s wrath or apprehensions of God’s love. And I know not why we may not say that a man may repent without saving grace. Bishop [John] Davenant says, a man by exciting the grace of God, may peccata propria considerare, ad sensum eorundem expavescere et liberationem ab hoc metu exoptare, tremble for his sins and mourn for them, and desire deliverance out of them (Mk. 1:15; Lk. 17:3-4; Eze. 14:6); and if this be not repentance, I know not what is (not taking repentance for the whole work of conversion, as sometimes it is taken in Scripture), but taking repentance for a weariness of sin and sorrow for it. But those of our brethren here (that are so afraid of Babylon that they will run quite beyond Jerusalem, so afraid of being Arminians or Papists, to ascribe any desert to duties, or tie that God has to concur with our duties, that they are resolved they will not be sober Protestants: so afraid of being heterodox, that to avoid it, they will not be orthodox) tell us that this is a legal, not a saving repentance; it sounds ill to distinguish between a legal and saving repentance. I will digress a little to rend this fig-leaf, being all they have to cover the nakedness of their opinion: I would fain understand that term ‘saving repentance’ in what sense they take it; the Scripture warrants no such distinction.

1. If they mean by ‘saving repentance’, such a repentance as merits salvation, or such a repentance as God is tied necessarily to concur with, with his saving grace, I say, no repentance can be saving repentance. No repentance (says learned Davenant) can so dispose the heart, ut ex merito congrui teneatur Deus gratiam cuiquam infundere.

2. If they mean by ‘saving repentance’, such a repentance as of itself, without any more ado, shall be sufficient to salvation: I say again, no repentance can be called a saving repentance. For without faith it is impossible to please God.

3. If they mean by ‘saving repentance’, a repentance that conduces to salvation; I say, this kind of repentance (let them call it legal or what they please) is a saving repentance.

4. If they mean by ‘saving repentance’, such a repentance as is wrought ordinarily in such as shall be saved, I say, in that sense this repentance is a saving repentance. Now, whether it ought not to be preached, as well from law as gospel motives, is a question that lies not in my way to determine, only I hear my Savior (though He were Gospel itself) preaching it from a law-motive, Lk. 13:2, “Except ye repent, ye shall all likewise perish.” Let the unprejudiced reader judge if damnation be not there preached as a terrible motive to repentance: surely I then may learn to preach from the best of preachers and preach, ‘Repent, or you will go to hell; repent, or you will be damned,’ as well as ‘Repent, because God has loved you:’ yea, and John too preached repentance as well, because the axe was laid to the root of the tree and whatsoever tree brought not forth good fruit should be hewn down and cast into the fire, as because the kingdom of heaven was at hand. I dare not learn contrary to Christ and the Baptist’s copy; I will preach mercy and judgment: the law and the gospel go well together; I will not be accursed for separating what God has joined. But 5. Lastly, I conceive, we cannot call any repentance saving repentance till the work of conversion be fully wrought in our souls. Nay, I make a question whether any man (without the grace of assurance) can properly call his repentance ‘saving repentance’, till he comes into Heaven. And for my own part, I am full in the negative. But I have digressed too far, to convince some (who I fear are not so willing to suffer the word of conviction, as I to speak it.) We left the spouse in the second wilderness, the wilderness of sorrow; it is time we now return to her, and comfort her, and show you how she comes out of that, leaning upon her Beloved.</p></blockquote>

<blockquote><p>2nd Problem: Whether faith precedes regeneration, at least repentance? Response: The former is denied; the latter is affirmed concerning faith in the first act, which in the order of nature precedes repentance considered both in the first act and in the second act. But it is denied concerning faith in the second act, at least the complete or formed second act. For such faith is necessarily preceded in the order of nature and of time by certain acts of repentance. This distinction observed will contribute not a little to reconciling the dogmatic and practical theologians.</p></blockquote>

<blockquote><p>III. What is the cause that among the dogmatic and practical writers so many ἐναντιοφανῆ [enantiophane, apparent contradictions] occur concerning the consequent dependence, order, and succession of acts and effects of regeneration? Response: Partly that the mode of regeneration is so hidden, and many things escape us, according to that passage John 3:8; partly that the following distinctions are either not expressly observed by all, or are not applied by the reader. They are:

      1. The question concerning the order, succession, and consequent dependence of habits or first acts among themselves is one thing; and the question concerning their order and dependence compared with second acts is another. So in turn the question concerning the dependence, succession, and order of second acts among themselves is one thing; and the question concerning their order compared with first acts is another.

      2. Again, the question concerning the succession, priority, and posteriority of second acts in themselves is one thing; and the question concerning the succession of the same καθ’ ἡμᾶς [kath’ hēmas, according to us], or in our sense, is another. So, for example, the second act of faith, which really precedes the second acts of true grief according to God, of desire for grace, and other such motions of repentance, is in our sense and καθ’ ἡμᾶς regarded as posterior, and thus is mostly placed by the Practical writers. The reason is that those initial acts of faith (which may be called first and primary, unformed, incomplete motions) are so obscure and insensible that they are not perceived or regarded as acts of faith in that haste, in those ὠδῖνες [ōdines, birth pangs] of spiritual birth—although those now completely converted in the second act, and more and more often by the renewed practice of repentance and faith, reading back through the traces and recalling to memory that whole change of the right hand of the Most High, seem to themselves with some mental and as it were twilight evidence and diminished perspicacity to see and observe in that disturbance and commotion the mode, order, leading, and discordant concord of those affections and acts (of hope and despair, joy and grief, fear and confidence, accusation and apology, credulity and doubt, etc., 2 Corinthians 7:11; Romans 7:8–9), and their mutual dependence, promotion, impulse, and excitation—which, however, then when those things were happening they could not distinctly see or judge with certain and resolved knowledge. Not otherwise than a man, thinking back after a disease or its paroxysm, better judges concerning the state of the disease and its various affections and concomitants. But that Practical writers do not count or scarcely count those unformed, incomplete, and insensible motions of faith (which precede, accompany, and follow the acts of grief, desire, etc., and ἀχωρίστως [achōristōs, inseparably] intermingle themselves with them) among the acts of faith is not surprising. For it happens to them nearly as to physicists, who do not reckon insensible motion or impulse among motions. In the same way astronomers call the solstice the progress of the sun insensible to us. Finally, the question concerning the order of first or second acts in nature, or as to essence, is one thing; and the question concerning their order in time, or as to existence, is another. We think these distinctions have their use for explaining and reconciling many things in this matter.</p></blockquote>

</figure><figure class="quote" id="q-96791e2ec9" data-kw="">
<blockquote><p>Justification and Sanctification agree in their foundation, which is at least inchoate, and initial holiness. For, though no man’s inherent holiness arises so high as to denominate him truly just, or holy, for its own sake; yet both to Sanctification and Justification, is necessarily required some preparatory and imperfect holiness, consisting principally in the conversion of the mind to God, from sin… But on the other side, they are distinct in some formalities, such as these may be, for first, the immediate cause of our sanctification is in holy Scripture imputed to the operation and influence of the Holy Spirit, as our Justification is more properly attributed to Christ the mediator between God and man: As appears from St. Paul’s words to the Thessalonians, ‘But we are bound to give thanks always for you brethren beloved of the Lord, because God has from the beginning chosen you to salvation, through sanctification of the Spirit, and belief of the truth.’ (2 Thess. 2:13) And St. Peter, ‘Elect according to the foreknowledge of God the Father and Sanctification of the Spirit unto obedience.’ (1 Pet. 1:2) … Lastly, to search no farther into this point, before justification there must of necessity go some degree of sanctification, even in the opinion of such as contend most rigorously for freeness of justification:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-scrivener.html">Matthew Scrivener</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Course of Divinity</cite>, ... (London: Roycroft, 1674), pt. 1, bk. 1 | ch. 17, ‘…In what manner Sanctification goes before Justification, and how it follows it’, pp. 62-63</span></figcaption>

<blockquote><p>Note: Though it be not without the grace of Christ that we open to him when He knocks, and receive his offered special grace, yet, in this, He lays so much on man as to make our opening, that is, our accepting-faith, the condition of his entering for a fixed habitation by habitual love and holiness. On which account divines used to say that faith and repentance, wrought first in conversion, are the conditions or qualifications for consequent justification and sanctification.</p></blockquote>

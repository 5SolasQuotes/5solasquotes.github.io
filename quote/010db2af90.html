<main class="wrap"><figure class="quote" id="q-010db2af90" data-kw="">
<blockquote><p>It never entered into the heart of man to think of Salvation by the Cross; of an imputed Righteousness by a Mediator, of God manifest in the Flesh, made under the Law, &amp;c. and many other such like points of the Gospel: none of these things ever entered into the heart of man to conceive; the knowledge and belief of these things comes only by hearing, and by the Revelation of Jesus Christ in the Gospel:

All that ever studied Righteousness, I mean the best and wisest of Heathen Philosophers, never sought it in a way of Faith, but in a way of Works, of moral correctives of Vice, and rules of common Justice, and human Prudence. But did ever any one of them so much as dream of a Mediator? or of Justification by Faith. …

The reason hereof is, because true Faith, whereby man is justified, is purely supernatural, it is above Nature to teach it, or to work it. It is purely supernatural, first, in respect of the Object, which is Christ crucified for our Sins; The things to be believed are above the reach of man’s natural reason; Flesh and blood hath not revealed this unto thee, but my Father which is in heaven: This our Saviour spake of Peter’s Faith, Mat. 16:17.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-lyford.html">William Lyford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The plain man’s senses exercised to discern both good and evil, or, A discovery of the errors, heresies, and blasphemies of these times and the toleration of them, as they are collected and testified against by the ministers of London, in their testimony to the truth of Jesus Christ</cite>, (London: Richard Royston, 1655), pp 310, 311.</span></figcaption>

</figure><figure class="quote" id="q-9696a1ee04" data-kw="">
<blockquote><p>Our works are meritorious from two causes: first, by virtue of the Divine motion; and thus we merit condignly; secondly, according as they proceed from free-will in so far as we do them willingly, and thus they have congruous merit, since it is congruous that when a man makes good use of his power God should by His super-excellent power work still higher things. And therefore it is clear that no one can merit condignly for another his first grace, save Christ alone. … But one may merit the first grace for another congruously; because a man in grace fulfils God&#x27;s will, and it is congruous and in harmony with friendship that God should fulfil man&#x27;s desire for the salvation of another.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-7b1a61d9dc" data-kw="">
<blockquote><p>1st Conclusion. The members of the visible-Church are not mere lictors [those who execute judicial decisions] and executioners of the sentences of the eldership:

1. Because they are to observe, warn, watch over the manners of their fellow members and to teach, exhort and admonish one another; and are guilty if they be deficient in that;

2. Because by the law of charity, as they are brethren under one head Christ, they are to warn and admonish their rulers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (1644), Ch. 3, Section 3, Question 4, ‘Whether or no is there a necessity of the personal presence of the whole Church in all the acts of Church-censures?’, pp. 41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>15. Though the people have not miniterial or governing power [in church government], yet they are to have a judgment of discretion, and thereby to try and discern, whether they that do cast out, or absolve by ministerial authoritative declaration, do proceed according to God’s Word or not, and are not to obey any sentence or injunction that is contrary to that Word; yet must they not on that pretence disobey or refuse to execute such injunctions and censures without manifesting their proofs of its error.</p></blockquote>

<blockquote><p>XXXII… 2. The Gospel differs from the Law because the Law is known to us by nature since it is engraved in the minds of humans through creation, even if no other revelation is added. Romans 2:14-15 states, “For when Gentiles, who do not have the law, by nature do what the law requires, they are a law to themselves, even though they do not have the law. They show that the work of the law is written on their hearts.</p></blockquote>

</figure><figure class="quote" id="q-258c414b3b" data-kw="">
<blockquote><p>But this right [of the civil government], as far as [it] pertains to its exercise in respect of the infliction of punishment, either tends to the good of the whole republic, as in ordinary cases, or, as in some extraordinary cases, gives place to its hurt; for it is possible that even the exaction of punishment, in a certain condition of a state, may be hurtful. In such a situation of things, the ruler or magistrate has a power not to use his right of government in respect of particular crimes; or rather, he ought to use it in such a manner as is the most likely to attain the end; for he is bound to regard principally the good of the whole and the safety of the people ought to be his supreme law. But he who affirms that in ordinary cases, a magistrate may renounce his right, when that renunciation cannot but turn out to the hurt of the public good, is a stranger to all right.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertation on Divine Justice</cite>, pp. 567-8 of A Dissertation on Divine Justice... ch. 9 in Works, vol. 10</span></figcaption>

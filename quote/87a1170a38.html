<blockquote><p>While the non-elect may belong to the external administration of the covenant of grace, only the elect are, properly speaking, in the covenant of grace (cf. Galatians 3:16, Romans 5:15-21, Isaiah 53:10, 11). This view is not a “Reformed Baptist” notion but is the official position of the Westminster Standards (see Larger Catechism 31). Moreover, we find the Westminster divine, Edmund Calamy, arguing for this position:

[A]ll men enter into Adam’s covenant by nature, but the Elect only enter into Christ’s covenant by grace …</p></blockquote>

<blockquote><p>Secondly, he [Peter] calleth to their remembrance the vocation of the Jews, and promise of God, alleging the covenant or testament of God, made in the time past with Abraham. You (sayeth he) are the children of the covenant, which God made with your fathers, saying to Abraham: Euen in thy seed shall all the kindreds of the earth be blessed. He seemeth by an Hebrew phrase to call them the children of the Testament, to whom the Testament belonged, and which were Heirs written in the Testament of God. For so we read they are called the children of wrath, or death, whom God in his wrath appointeth to death.

Peter seemeth to make two arguments. The first is of a thing before denounced or shewed, saying: God in the Testament which he made with your fathers hath written you for heirs also. Ergo, the salvation contained in the Testament of God, belongeth as well to you as to the fathers. The Antecedent needed no great proof, with those who knew the promise of God well enough: I will be thy God, and the God of thy seed after thee. Then alleging the sum and effect of the Testament, he proveth by an argument a comparatis, that is, of things compared or laid together, that they cannot be excluded from the promises.

For thus God testified to their father Abraham, that in his seed all the Nations of the earth should be blessed. And if the Testament of God extended to foreign Nations, who I pray you will deny that it appertaineth to them that be born of the stock of Abraham? Yet let us always remember that Peter speaketh these things conditionally, and that salvation is promised to them which (by the faith that was in Abraham) take hold of Christ, lest we attribute unto carnal generation, that which dependeth upon the mere grace of God, and his free election, as Paule at large proveth to the Romans, the ix. Chapter.

By this place may the madness of the Anabaptists be confuted, which will not admit the children born of the faithful into the society and fellowship of Christ’s Church, yet none of us deny but that salvation standeth in God’s election, and not in carnally generation. In the meane while where as God in his Testament hath long since included the children of the faithful: it may seem great rashness to deny them the communion of the Testament and Church of God.

Shall we think the conditions of the new Testament more hard and grievous for our children, than the old were, when by Circumcision the eighth day they were taken into the fellowship of the people of God? Or shall the authority of Christ be of no force with us, which attributeth faith to little children, and affirmeth that the kingdom of heaven pertaineth to them? Or what shall we say to Paule, which speaking of unlike marriages, feareth not to call those children holy, which have but one parent only, be it father or mother that is a Christian? Let us therefore avoid the heady audacity of our judgement, and constantly keep the articles of God’s covenant, where it is manifest, that salvation is promised even to very children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An hundred, threescore and fifteen Homilies or Sermons, upon the Acts of the Apostles, written by Saint Luke</cite>, trans. John Bridges (London: Henry Denham, 1572), pp 185-86.</span></figcaption>

<blockquote><p>Here’s an answer to all the objections of unbelief and diffidence, the chief whereof lies here; O, says unbelief, may I, sinful guilty I, lay hold on the promise of mercy and peace in the gospel, when I see the great ordnance of the divine threatening hard charged with the truth and righteousness of God, and ready to be discharged against me with thunder and lightning, saying, no mercy, no peace; He that made thee will not have mercy upon thee; and there is no peace, says my God, to the wicked?

Mercy and peace in the promise then, says unbelief, cannot take place with respect to me; for truth and righteousness in the threatening stand in the way, like a flaming sword, to keep the way of the tree of life. Nay, but, says faith, here the promise and the threatening have met together, and kissed each other in Christ; mercy in the promise, and justice in the threatening, have met and agreed in him, in whom all the promises are Yea and Amen, and in whom all the threatenings are fully executed, by drawing out his heart-blood. Thus then, we have boldness to enter into the holiest by the blood of Jesus, Heb. 10.19. By a new and living way, which he hath consecrated for us through the vail of his flesh: Therefore let us draw near with a true heart, in full assurance of saith.

O what ground for the boldness and assured confidence of faith, with particular application, notwithstanding the threatening! The threatening hath nothing to say to me, saith faith, for Christ hath spoken with it already, and spoken it out of breath; he hath left it speechless and breathless; not a breathing of wrath in it towards me. The believer may have a million of doubts, while his unbelief keeps the chair; but let gallant faith come in, and take the room, it will dispel them all. Let once unbelief break the harmony of this meeting of divine attributes in Christ, and then nothing but doubts of God’s favour and mercy must ensue; but let faith view the harmony, and see them meeting and kissing each other, and then, according to the measure of faith, such will be the measure of holy boldness, confidence and persuasion of the favour, mercy and good-will of God in Christ, with particular application to the person himself.

Take away unbelief from faith, and then not a single doubt will remain behind: Unbelief creates all the doubts that are in the believer, his faith hath no part in them. The general doubtful faith of the Papists is not faith, but unbelief; and therefore no wonder that our forefathers abjured it in our national covenant. Behold the sure ground and firm bottom that faith stands upon, even the mutual meeting and embracement among the divine perfections in Christ. If you break and separate the meeting by unbelief, then your confidence is broken, and your peace with God marred; but, if you keep them together in your view by faith in Christ, then you have boldness confidence and affiance on this ground: yea, then God in Christ and you meet together, and kiss each other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The harmony of the divine attributes displayed; in the redemption &amp; salvation of sinners by Jesus Christ. Being a sermon preached at Dunfermline on the 20th of September 1723; immediately after the celebration of the Lord’s Supper</cite>, (1723; Boston: S. Kneeland and T. Green, 1748), pp 48-49.</span></figcaption>

nd+spoken+it+out+of+breath%3B+he+hath+left+it+speechless+and+breathless%3B+not+a+breathing+of+wrath+in+it+towards+me.+The+believer+may+have+a+million+of+doubts%2C+while+his+unbelief+keeps+the+chair%3B+but+let+gallant+faith+come+in%2C+and+take+the+room%2C+it+will+dispel+them+all.+Let+once+unbelief+break+the+harmony+of+this+meeting+of+divine+attributes+in+Christ%2C+and+then+nothing+but+doubts+of+God%E2%80%99s+favour+and+mercy+must+ensue%3B+but+let+faith+view+the+harmony%2C+and+see+them+meeting+and+kissing+each+other%2C+and+then%2C+according+to+the+measure+of+faith%2C+such+will+be+the+measure+of+holy+boldness%2C+confidence+and+persuasion+of+the+favour%2C+mercy+and+good-will+of+God+in+Christ%2C+with+particular+application+to+the+person+himself.%0A%0ATake+away+unbelief+from+faith%2C+and+then+not+a+single+doubt+will+remain+behind%3A+Unbelief+creates+all+the+doubts+that+are+in+the+believer%2C+his+faith+hath+no+part+in+them.+The+general+doubtful+faith+of+the+Papists+is+not+faith%2C+but+unbelief%3B+and+therefore+no+wonder+that+our+forefathers+abjured+it+in+our+national+covenant.+Behold+the+sure+ground+and+firm+bottom+that+faith+stands+upon%2C+even+the+mutual+meeting+and+embracement+among+the+divine+perfections+in+Christ.+If+you+break+and+separate+the+meeting+by+unbelief%2C+then+your+confidence+is+broken%2C+and+your+peace+with+God+marred%3B+but%2C+if+you+keep+them+together+in+your+view+by+faith+in+Christ%2C+then+you+have+boldness+confidence+and+affiance+on+this+ground%3A+yea%2C+then+God+in+Christ+and+you+meet+together%2C+and+kiss+each+other.%E2%80%9D%0A%0A%E2%80%94+Ralph+Erskine%2C+The+harmony+of+the+divine+attributes+displayed%3B+in+the+redemption+%26+salvation+of+sinners+by+Jesus+Christ.+Being+a+sermon+preached+at+Dunfermline+on+the+20th+of+September+1723%3B+immediately+after+the+celebration+of+the+Lord%E2%80%99s+Supper%2C+%281723%3B+Boston%3A+S.+Kneeland+and+T.+Green%2C+1748%29%2C+pp+48-49.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9abb3f2784.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9abb3f2784.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/04/14/ralph-erskine-on-the-answer-to-unbelief-and-the-national-covenants-rejection-of-poperys-doubtsome-faith/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>13. …There is all in God that is good, and perfect, and excellent in our desires and wishes for the conversion and salvation of wicked men. As, for instance, there is a love to holiness, absolutely considered, or an agreeableness of holiness to his nature and will; or, in other words, to his natural inclination. The holiness and happiness of the creature, absolutely considered, are things that he loves. These things are infinitely more agreeable to his nature than to ours. There is all in God that belongs to our desire of the holiness and happiness of unconverted men and reprobates, excepting what implies imperfection. All that is consistent with infinite knowledge, wisdom, power, self-sufficience, infinite happiness, and immutability. Therefore, there is no reason that his absolute prescience, or his wise determination and ordering what is future, should hinder his expressing this disposition of his nature, in like manner as we are wont to express such a disposition in ourselves, viz. by calls and invitations, and the like.</p></blockquote>

<blockquote><p>Thesis XII: The impulsive efficient [cause], that is, that because of which we have been chosen, is the benevolent disposition of the will of God, or the εὐδοκία, or good pleasure, of the divine will. Explanation: I. It is a question among us, the Lutherans, and the Papists: What moved or impelled God (it is permitted to us to make use of these words, which rather agree with the decrees of men, and are accommodated to our capacity: for properly speaking no impulsive cause of the divine will is granted, as we saw above) to decree to grant eternal life to certain men? We respond: That God was moved by no other thing to determine eternal life for certain ones, than by the benevolent disposition of His will, or His own good pleasure. There are principally two foundations of our opinion: (1.) Because the Scripture names this alone as the cause of election. Ephesians 1:5, He predestinated us, whom He would adopt as Sons through Jesus Christ unto Himself, according to the benevolent disposition of His own will…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-722b31153c" data-kw="">
<blockquote><p>The sorts of this worship are twofold:

1. Solemn.

2. Common. The solemn worship is that whereto men do wholly give themselves, setting themselves apart from all other things to attend it wholly. The common is that which is to be performed to God jointly in and with our other affairs, so far forth as in them we have anything to do with Him or any thing of his.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London: Lee, 1654), bk. 9, ch. 4, ‘3rd Commandment’, p. 789</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-bb50f85b0d" data-kw="">
<blockquote><p>Doctrine 9. Godliness is the chief and most necessary of all virtues. By godliness we mean true religion towards God, and a mind wholly given to the true worship of God. Reason 1. Because it has the noblest object, that is, God Himself. 2. Because it does most of all perfect all other virtues, while it refers them and all their acts to a divine beginning and a divine end. For godliness subjects the mind to God in all things, so that it acknowledges God to be the author of all good, from whom every good and perfect gift comes, and makes Him the chiefest good and the last end to whom all our actions are to be directed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Analytical Exposition of both the Epistles of the Apostle Peter</cite>, … (London: Rothwell), on 2 Pet. 1:5-7, p. 151</span></figcaption>

</figure><figure class="quote" id="q-ac7f231ad0" data-kw="">
<blockquote><p>…the worship of God is twofold, inward or outward… The outward is that worship whereby the inward is testified outwardly in the speach and actions… Indeed all the worship of God is spiritual, even that which we call outward; yet not of itself, but by virtue of the inward, from which it proceeds. The heads of inward worship are two: adoration of God and cleaving to God… Now in adoration there are four virtues: feare, obedience, patience, thankfulness. … The second virtue of adoration is inward obedience of the hidden man of the heart. The Lord prefers this obedience before all sacrifice, 1 Sam. 15:22. This stands in two things. First, in yielding subjection of the conscience to the commandments, threatnings and promises of God, so as we are willing that it should become bound unto them. Secondly, when the rest of the powers of the soul, in their place and time, perform obedience unto God. … …touching inward worship, we must remember that it alone is properly, simply, and of itself, the worship of God; and the outward is not simply the worship of God, but only so far forth as it is quickened by the inward, and grounded upon it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Treatise of the Cases of Conscience</cite>, ch. 5, question 2, “How God is to be Worshipped &amp; Served?” in The Whole Treatise of the Cases of Conscience… (Cambridge: Legat, 1606), bk. 2, pp. 256-62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-ba2904b67e" data-kw="">
<blockquote><p>It is first established that God neither is nor can be the author of sin… With this truth asserted, the question is: whether and how God concurs with the free cause toward the act of sin?… the common sense of all is that God does not concur with the formal element of sin, whatever that is, but only with the material and the substrate of the formal… For even the heretics do not say that God formally determines toward formal malice; indeed, Calvin explicitly says at (bk. 1, Institutes, ch. 18) that God does not will the treachery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Concurrence with Evil Actions | Intro</cite>, pp. 415-16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

ner" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b23442f769" data-kw="">
<blockquote><p>…in the opinion of Scotus… For since God, as we have said, concurs toward the substrate of the evil act without causing its defect or intending it, He concurs only with the material of the act, with formal malice entirely removed. This is clear. God does not concur with that act in time except insofar as He decreed and foresaw from eternity that he would concur. But He decreed and foresaw from an antecedent permission, which is not a positive intention concerning that sinful act. Therefore, also when He concurs in time, He does not exhibit concurrence toward the sinful act; but only, given that there is a positive entity in it, did He decree from eternity to concur and does He actually concur in time with it. And this pertains to the first cause in the physical genus, not the moral. Hence, since malice is something moral and wholly proper to the secondary cause, it falls back upon that cause as upon its moral cause — which God cannot be with respect to that evil act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Concurrence with Evil Actions | Detailed Answer</cite>, pp. 423-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

69.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b23442f769.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=in%20the%20opinion%20of%20Scotus,with%20respect%20to%20that%20evil%20act&amp;text=in%20the%20opinion%20of%20Scotus&amp;text=cannot%20be%20with%20respect%20to%20that%20evil%20act" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-466404936c" data-kw="">
<blockquote><p>It appears, therefore, what the mode is by which the first cause moves and determines the secondary cause, without necessity and with the freedom of the secondary cause entirely unimpaired — through that priority of nature of the concurrence as it is from God as first cause, subordinating to itself in the very operation the secondary cause, and retaining by priority of nature its dignity in causing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo &amp; Scotus’s View</cite>, p. 410</span></figcaption>

— Francisco Macedo, Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Macedo &amp; Scotus’s View, p. 410">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+appears%2C+therefore%2C+what+the+mode+is+by+which+the+first+cause+moves+and+determines+the+secondary+cause%2C+without+necessity+and+with+the+freedom+of+the+secondary+cause+entirely+unimpaired+%E2%80%94+through+that+priority+of+nature+of+the+concurrence+as+it+is+from+God+as+first+cause%2C+subordinating+to+itself+in+the+very+operation+the+secondary+cause%2C+and+retaining+by+priority+of+nature+its+dignity+in+causing.%E2%80%9D%0A%0A%E2%80%94+Francisco+Macedo%2C+Collations+of+the+Teachings+of+St.+Thomas+%26+Scotus%2C+with+the+Differences+between+the+Two%3A+with+the+Texts+of+Both+Faithfully+Presented%2C+and+the+Sentences+Subtly+Examined%2C+with+the+Commentaries+of+the+Interpreters%E2%80%A6+vol.+2+tr.+AI+by+Vertias+%28Padua%3A+Frambotti%2C+1671%29%2C+%2C+bk.+2%2C+Collation+9%2C+pp.+361-429+%7C+Macedo+%26+Scotus%E2%80%99s+View%2C+p.+410&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F466404936c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/466404936c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=It%20appears%2C%20therefore%2C%20what%20the%20mode,of%20nature%20its%20dignity%20in%20causing&amp;text=It%20appears%2C%20therefore%2C%20what%20the%20mode%20is%20by&amp;text=by%20priority%20of%20nature%20its%20dignity%20in%20causing" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-77eaa862ef" data-kw="">
<blockquote><p>[Scotus:] ‘That the effect is not right is caused now not because of the prior cause, which on its own part would cause rightly if the second cause were to cause; but because of the defect of the secondary cause, which in its power has the option of co-causing with the first cause or not cocausing. And if it does not co-cause with the first cause as it is bound to, there is no rectitude in the common effect of both.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-42ea69f38c" data-kw="">
<blockquote><p>From that position it follows that the human will can do more than the divine, and can draw and temper it according to its own nod and pleasure. This is clear because whatever it wills, God fulfills: if it wills, the concurrence is present; if it does not will, it is absent. And God waits to see what it wills and does not act before its nod, nor operates contrary to its will… It elicits the act when it pleases and determines the divine concurrence according to its own judgment. Therefore the will does what the human will wills, not what the divine will wills. From which it follows that the will is mistress of the divine concurrences, which are ready — as those authors say — indifferently for the pleasure of the will… What is this but to drive God around in circles, as it were, and lead him about? Yet this is in no way permitted to God with respect to the creature, through which God is not allowed to act freely and to operate according to his own judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Contra Molinists</cite>, p. 378</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

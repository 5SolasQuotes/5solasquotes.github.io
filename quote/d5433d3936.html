<main class="wrap"><figure class="quote" id="q-d5433d3936" data-kw="">
<blockquote><p>Yea, we doubt not to prove the kingdom of the pope to be the kingdom and power of Antichrist. And therefore, my Lords, I cannot cease in the name of Christ Jesus to require of you that the matter may come in examination, and that ye, the estates of the realm, by your authority compel such as will be called bishops not only to desist from their cruel murdering of such as do study to promote God’s glory in detecting and disclosing the damnable impiety of that man of sin, the Roman Antichrist, but also that ye compel them to answer to such crimes as shall be laid to their charge for not righteously instructing the flock committed to their cares.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The appellation of John Knox from the cruel and most injust sentence pronounced against him by the false bishops and clergy of Scotland, with his supplication and exhortation to the nobility, estates and commonality of the same realm</cite>, (Geneva, 1558) in idem, On rebellion, ed. R. A. Mason (Cambridge, 1994), p. 75.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>
<div class="actions"><button class="copy" data-copy="“Yea, we doubt not to prove the kingdom of the pope to be the kingdom and power of Antichrist. And therefore, my Lords, I cannot cease in the name of Christ Jesus to require of you that the matter may come in examination, and that ye, the estates of the realm, by your authority compel such as will be called bishops not only to desist from their cruel murdering of such as do study to promote God’s glory in detecting and disclosing the damnable impiety of that man of sin, the Roman Antichrist, but also that ye compel them to answer to such crimes as shall be laid to their charge for not righteously instructing the flock committed to their cares.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-584b7f205d" data-kw="See of Peter Vicar of Christ">
<blockquote><p>To fix down Christ and the Holy Spirit and the Church to a particular spot, so that every one who presides in it, should he be a devil, must still be deemed vicegerent of Christ, and the head of the Church, because that spot was formerly the See of Peter, is not only impious and insulting to Christ, but absurd and contrary to common sense. … The see which they occupy, therefore, no more makes them the vicars of Christ, than it makes an idol to become God, when it is placed in the temple of God (2 Thess. 2:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.7.29</span></figcaption>

</figure><figure class="quote" id="q-23153d0d1f" data-kw="">
<blockquote><p>It is well known to those that have been conversant in the writings of the Fathers, and confessed by [Robert] Bellarmine himself [a Roman apologist] (De Rom. Pont., bk. 3, ch. 5) that the Primitive Church was taught to look for Antichrist upon the dissolution of the Roman Empire.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is well known to those that have been conversant in the writings of the Fathers, and confessed by [Robert] Bellarmine himself [a Roman apologist] (De Rom. Pont., bk. 3, ch. 5) that the Primitive Church was taught to look for Antichrist upon the dissolution of the Roman Empire.”

ksonline.com/topics/topics-by-subject/roman-catholicism/historic-quotes-on-the-papacy-being-the-antichrist/#:~:text=It%20is%20well%20known%20to%20those,the%20dissolution%20of%20the%20Roman%20Empire&amp;text=It%20is%20well%20known%20to%20those%20that%20have&amp;text=Antichrist%20upon%20the%20dissolution%20of%20the%20Roman%20Empire" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-be1bfa0f0d" data-kw="">
<blockquote><p>For their very doctrine, after comparison with that of the apostles, will declare, by its own diversity and contrariety, that it had for its author neither an apostle nor an apostolic man; because, as the apostles would never have taught things which were self-contradictory, so the apostolic men would not have inculcated teaching different from the apostles, unless they who received their instruction from the apostles went and preached in a contrary manner. To this test, therefore will they be submitted for proof by those churches, who, although they derive not their founder from apostles or apostolic men (as being of much later date, for they are in fact being founded daily), yet, since they agree in the same faith, they are accounted as not less apostolic because they are akin in doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/tertullian.html">Tertullian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Prescription against Heretics</cite>, ch. 32</span></figcaption>

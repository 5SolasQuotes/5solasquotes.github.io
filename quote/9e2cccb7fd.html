<blockquote><p>Such evils as you have heard, the Church is subject unto, not because Christ doth not love her, but that you may see he doth, for he comes in to their defence: A Ship that is tost at Sea in a storm, is set so much nearer heaven, that is all that troubles shall do to you; if you have more storms, God will have more care, if the wind rise, you shall be sure it shall be either fair for you, or else it shall not hurt you; for upon all the glory there shall be a Defence. Its better to be in trouble that God may shew himself for us more then ordinarily, then to be without trouble, with ordinary comforts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sidrach-simpson.html">Sidrach Simpson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation’s preservation opened in a sermon preached at Westminster before the honourable House of Commons, at the late solemn fast, July 26, 1643</cite>, (London: Benjamin Allen, 1643), p. 9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9b3d39ed78" data-kw="">
<blockquote><p>Undoubtedly ζητήσεις μωραὶ καὶ ἀπαίδευτοι, foolish questions as well as those that are ignorant or unlearned, greatly block the path to piety. The former concern matters that accomplish nothing for piety. The latter arise from ignorance of the doctrine of righteousness, arguments against the faith, or even το‹ς ἅ μὴ ἑωράκασιν ἐμβατεύουσιν (from those who take their stand) on what they have not seen, who have neither seen nor heard anything in the Word of God, but who habitually appear and rear up with profane feet. Therefore, κενοφωνίαι and λογομαχίαι, foolish talk and quarrels about words, greatly hinder edification. Indeed, into what sordid conditions men will fall, who understand neither Scripture nor its substance! With all their might they furnish obscure, new, erratic, and suspect ideas as ends for religion, reduce the faith to tragedy, or transform the words of God into dross as amid a fire, thereby weakening and emptying them.

Contrarily, those things necessary for piety include the thorough examination of the Word of God, comparison of spiritual matters with spiritual matters, demonstration of the truth that accords with piety, conscience, the foundation of religion and the ἀναλογίας τῆς πίστεως (analogy of faith)—the harmony and conformity of all that must be believed from the uniform witness of God through σύνεσιν (conscience) and ἐπίστασιν (care). Also necessary for piety is the serious examination and proper consideration of the weight of God’s Word, as well as the disciplined and careful comparison of the product of all these practices. The end of all this is to subject the mind to the divine witness and the ἀποδείξιν τοῦ Πνεύματος, demonstration of the Spirit.

The devil very much hates this greatest means of increasing and strengthening true religion and destroying wickedness. Therefore, he corrupts the minds of men, so that they do not give heed to sound doctrine and the force of Scripture. Although these men have the μόρφωσιν (form) and precise outline of piety, they deny it, with both παραδιατριβὰς (idle occupation) and leisure spent for gain. Instead, they pursue ἀντιθέσεις ψευδωνύμου γνώσεως, contradictions falsely called knowledge, preferring this account to the opinion of the πολυμαθείας (very learned), experience, and common sense. Full of zeal, these men multiply their wickedness in numerous schools and seminaries.

In contrast, when Scripture is taken as the standard, there is nothing that is a greater threat, is more insidious, opposes, and tears down ἐπισυναγωγα‹ς, congregations, more than τῶν σχολαζόντων τῇ μαθήσιν, those who lack devotion to the sacred truth. After that danger is the one in which students, in the face of the trials of this life, only have knowledge of the truth as it suits them to listen to or talk about it. These follies, which are inappropriate to those who are and are called brothers, must cause harm.

For this reason, those who have been appointed to the sacred ministry to shepherd the flocks by the consensus and recommendation of the church and called by the authority of the elders must devote themselves with more anxious care so that they are found diligent and active not only in the explanation and presentation of the main points of doctrine but also in discussions about the mystery of piety according to its revelation in the Scriptures, together with the refutation of errors and restraint of corruptions, fruitless questions, and unhelpful assertions about the Word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-cocceius.html">Johannes Cocceius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Doctrinæ de Fœdere et Testamento Dei: The Doctrine of the Covenant and Testament of God</cite>, trans. Casey Carmichael (1660; Grand Rapids MI: Reformation Heritage Books, 2016), preface to the reader, pp 1-2.</span></figcaption>

<blockquote><p>…[After Bothwell in 1679] [Donald] Cargill received an urgent invitation from [Robert] M’Ward and Brown [of Wamphray] in Holland to go over and join them… he determined at once to accept. Apparently, however, there were others included in the invitation and time was pressing, for on receiving the letter Cargill wrote at once to Robert Hamilton, who was now in hiding in Galloway, to come to Edinburgh in all haste to meet him. Hamilton duly arrived, heavily disguised for fear of capture, and Cargill put the proposition to him. Hamilton, who was in daily danger of his life so long as he remained in the country, readily assented; and some time in mid-August he and Cargill appear to have left for Holland together.</p></blockquote>

<blockquote><p>Sir Henry [Martin] asked me what I thought of the King’s Supremacy. I replied, that if I should be put Legally to it; my answer should give Caesar that which was Caesar’s. I told him further, that being a Scholar, and a great Civilian, he could not choose but know; what both Divines and Lawyers, (Popish and Orthodox) had delivered concerning that: he replied, it was true: neither was he so gross, as to think any King or other Man to be Head of the Church; only he did hold the King to be Sovereign and Supreme Governor under Christ. Then (said I) Sir Henry you have answered your self; but of this further in mine Examination by Sir Robert Heath, then Attorney General.

From that he fell to ask me, what was the reason that I did oppose the Hierarchy so vehemently. I replied, true it is, I have ever opposed them, since the Lord called me; but I protested, and that truly, it was not out of hatred to their persons, though I and mine had suffered by them: nor out of envy to their places, whence their wealth, honour, and case might accrue: but first, because their Places and Authority are not of God. Secondly, because in executing of their Places, they take more upon them, then either the Law of God, or Man, alloweth them: to the prejudice and abusing of the King’s grants, the heavy detriment of the Subject, and the highly endangering of themselves: and this I offered to make good: and as for their persons, I told them, I wished them as well as my self.

What? said Sir Henry Martin, if it be so, we are all mistaken; doe you not think that they are of God; Nothing less (said I) neither think I that they think themselves so, if they will impartially examine their own hearts: for they know those thoughts to be contrary to the Word of God, the current of Human Writers, and to their own Peremptory Assertions in their own Works, written by them for their defence. Yea, said Sir Henry Martin, but I will prove it thus, is there not superiority in a Civil state; and was there not superiority in the State Ecclesiastical, under the Jews: Witness Aaron’s superiority over the Priests, so that he reasoned thus in effect, Aaron was over all the Levitical Priests.

Ergo, Bishops by Divine Right should be over Ministers.

For all my pressures, I smiled to hear their Champion for the time; beat the brains out of their cause, with a beam of their own making, or of the Popes; withal I told Sir Henry, that his Antecedent and Consequent were of so deep distance, that all the Learning in the World, could never make them meet. Yet he set a face to prove it, by a connex Proposition;

If Aaron were over the Priests,

Then Bishops should be over Ministers, &amp;c.

I denied the Connexion, and told him that all the learning amongst them could not advance that Argument one foot; nor no more they did; but being at a stand, I told Sir Henry Martin that he could not of all the Quiver, have chosen a deadlier shaft against themselves; as should appear by the retorting of the Argument thus.

The Major I cleared both from proof and reason, as Collos. 2. vers. 17. Yea the Author to the Hebrews speaks particularly to the point, as in Hebr. 7.11, 12. The Minor as it is undeniable, so he had granted it by way of query: yea, the Papists themselves grant both in express terms, in the fore-quoted place to the Hebrews, That the Levitical office in Aaron, and other things were figures of Christ’s death, and to be ended and accomplished in the same.

I shewed how I could make good the Argument from the testimonies of the Fathers; as Cyprian speaks punctually to it, citing the words of the Apostle, Let a man so account of us, as of the Ministers of Christ, and Stewards of the Mysteries of God, 1 Cor. 4.1. Paulus Apostolus (saith the Father) aequales habere voluit Sacerdotes, cum dicit, sic nos existimet, &amp;c. The Apostle Paul will have all Ministers to be equal; when he saith, Let a man esteem of us, &amp;c. Doctor [Andrew] Willet useth the like Argument, by way of retortion against the Papists, bringing Aaron and his ornaments, for a warrant of their Mass, Church-Musique, Vestments, and the like; because (saith he) these were in God’s worship then, therefore they should not be now.</p></blockquote>

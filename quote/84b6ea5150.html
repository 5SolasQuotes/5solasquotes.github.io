</figure><figure class="quote" id="q-9a6c66249f" data-kw="">
<blockquote><p>This we showed was the order of love in respect of nearness of conjunction with us. But now in respect of excellency and the honor which is therefore due to any, it is otherwise: for in some cases the person of greater excellency must be preferred before such as be of near relation to us. St. Paul honored Nero, an infidel, appealing to him. Thus a stranger may be honored rather than one of our own country, as Daniel was honored by Darius above all the princes of Babylon: and Joseph, though a stranger, by Pharaoh above all the rulers of Egypt. Thus one that is not allied may be honored before one of our own kindred, as Moses appointed Aaron and not any of his own sons to succeed him in the government of Israel. Now such persons as are to be honored in respect of their excellent gifts and of their nearness to God, which we ought to esteem and honor above all nearness to ourselves by any relations to us, and that not only for itself, but also our honor and respect being the reward which God has appointed to such gifts; although in respect of ourselves also we are to regard them, they being of great use and profit to us by their gifts. The heathen man said that every one made more account of 〈Greek〉, than of 〈Greek〉, ‘of his own things’, than ‘of God’s’, and the apostle complains of such as sought 〈 in non-Latin alphabet 〉, ‘their own things, and not the things of Christ’. But if we look at the 〈◊〉 of any, we must not chiefly look at ourselves, but to honor God in his gifts, for we must consider them in a double respect:

1. As they are useful and beneficial to us, and so the duty is diliges, thou shalt love them.

2. As they are near to God, by that excellency which he has given them: and so we must do more than love them, we must honor them. If it be here demanded: Why did not God make all men excellent alike and fit to be superiors? Answer: God made men of finite natures and therefore of such condition that one should need the help of another: for which end the woman also was made to be an helper to the man. Besides, seeing men grow in wisdom and abilities for several 〈◊〉 according to their finite capacities, industry and education, necessarily it follows that as the stars differ each from other in glory, so one man does excel another. In this regard the elder brother, having as dignity of primogeniture, so more maturity of years and reason was appointed by God to rule over the rest of the family. Yet God the King of kings and Lord of lords, the fountain and original of all rule, made Moses the younger brother ruler and as a God to Aaron, the elder brother, and preferred David before his elder brethren, and Solomon before Adonijah and Absalom when He first framed and composed a national government in his own people. But having settled the platform of that rule He intended by the practice of David and Solomon in a monarchical course (the best of all kinds of governments and approved by God, because He rested in it), He left the managing of that kingdom and rule to the true and lawful heirs of David in all after-times, because they by education under their parents, and aptness of children to walk in the steps of their fathers and to fit their spirits and carriage to what they are born to, would probably best perform the royal and weighty charge of ruling as kings, and make election of the most able, active and faithful instruments to assist them in 〈◊〉 their great affairs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-andrewes.html">Lancelot Andrewes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Pattern of Catechistical Doctrine at Large</cite>, (d. 1626; 1675) 5th Commandment, ch. 2, p. 321</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>To our reverend brethren Mr. Alexander Henderson and Mr. David Dickson. That your answers, reverend and dear brethren, have not in any degree satisfied us, we impute it not to your weakness, whom we know to be able men, and much exercised in the matters debated betwixt us: but we impute it to the weakness of your cause, and to that inability which is in all men, as well as in you, to bear out against the truth.</p></blockquote>

</figure><figure class="quote" id="q-024bd578e7" data-kw="">
<blockquote><p>What is meant by our forgiving them [Mt. 6:12]? It is our hearty forgiving them the injury done to us (to forgive the injury against God is not in our power), entertaining no hatred or malice against them, but loving them with a love of goodwill, heartily wishing their good, and being ready to do them good, Mt. 5:44-45: ‘But I say unto you, Love your enemies, bless them that curse you, do good to them that hate you, pray for them that despitefully use you, and persecute you; that ye may be the children of your Father which is in heaven, for he maketh his sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust.’ But it does not extend to a love of complacency or delight in them in whom there appears no ground for that, either as men or as Christians. Ps. 26:4, ‘I have not sat with vain persons,’ says David, ‘neither will I go in with dissemblers.’</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>
<div class="actions"><button class="copy" data-copy="“What is meant by our forgiving them [Mt. 6:12]? It is our hearty forgiving them the injury done to us (to forgive the injury against God is not in our power), entertaining no hatred or malice against them, but loving them with a love of goodwill, heartily wishing their good, and being ready to do them good, Mt. 5:44-45: ‘But I say unto you, Love your enemies, bless them that curse you, do good to them that hate you, pray for them that despitefully use you, and persecute you; that ye may be the children of your Father which is in heaven, for he maketh his sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust.’ But it does not extend to a love of complacency or delight in them in whom there appears no ground for that, either as men or as Christians. Ps. 26:4, ‘I have not sat with vain persons,’ says David, ‘neither will I go in with dissemblers.’”

— Thomas Boston, Body of Divinity in Works, vol. 2, pp. 617-18">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+is+meant+by+our+forgiving+them+%5BMt.+6%3A12%5D%3F+It+is+our+hearty+forgiving+them+the+injury+done+to+us+%28to+forgive+the+injury+against+God+is+not+in+our+power%29%2C+entertaining+no+hatred+or+malice+against+them%2C+but+loving+them+with+a+love+of+goodwill%2C+heartily+wishing+their+good%2C+and+being+ready+to+do+them+good%2C+Mt.+5%3A44-45%3A+%E2%80%98But+I+say+unto+you%2C+Love+your+enemies%2C+bless+them+that+curse+you%2C+do+good+to+them+that+hate+you%2C+pray+for+them+that+despitefully+use+you%2C+and+persecute+you%3B+that+ye+may+be+the+children+of+your+Father+which+is+in+heaven%2C+for+he+maketh+his+sun+to+rise+on+the+evil+and+on+the+good%2C+and+sendeth+rain+on+the+just+and+on+the+unjust.%E2%80%99+But+it+does+not+extend+to+a+love+of+complacency+or+delight+in+them+in+whom+there+appears+no+ground+for+that%2C+either+as+men+or+as+Christians.+Ps.+26%3A4%2C+%E2%80%98I+have+not+sat+with+vain+persons%2C%E2%80%99+says+David%2C+%E2%80%98neither+will+I+go+in+with+dissemblers.%E2%80%99%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+Body+of+Divinity+in+Works%2C+vol.+2%2C+pp.+617-18&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F024bd578e7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/024bd578e7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-forgiveness/#:~:text=What%20is%20meant%20by%20our%20forgiving,will%20I%20go%20in%20with%20dissemblers&amp;text=What%20is%20meant%20by%20our%20forgiving%20them%20%5BMt&amp;text=David%2C%20%E2%80%98neither%20will%20I%20go%20in%20with%20dissemblers" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

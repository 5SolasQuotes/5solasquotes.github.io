<blockquote><p>When we measure the goodness or the badness of a human action, we must not only measure it by the object and the end, but by all the circumstances which accompany it. Fed. Morellus upon those words of Seneca, Refert quid, cui, quando, quare, ubi, etc. says that without those circumstances of things, persons, times, places, facti ratio non constat [it does not consist with reason of fact]. Circumstances sometimes constituunt rerum earum quae aguntur speciem [establish those things which direct the species], say our divines, meaning that circumstances do make an action good or bad. Humani actus [a human action] say the Schoolmen, non solum ex objectis, verum ex circumstantiis boni vel mali esse dicuntur. It is not every mans part, (says one of our opposites) to judge de circumstantia, quae reddit actionem vel bonam vel malam. Some circumstances says another of them, are intrinsical and essential to actions, and specially making up their nature. The principal circumstances which here we speak of, are comprehended in this versicle: ‘Quis, Quid, Ubi, Quibus auxiliis, Cur, Quomodo, Quando.’ [‘Who, what, where, by what means, why, what way, when.’]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies ([1637]), pt. 4, ch. 3</cite>, pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>Answer… It is blasphemy to seek this distinction of person and office in the King of kings, because by person in a mortal king, we understand a man that can sin. 1. I am not obliged to obey his [the king’s] personal commandment, except I were his domestic [servant], nor his unlawful personal commandments, because they are sinful. 2. It is false that you obey the king’s law because you obey the king; for then you say but this: ‘I obey the king because I obey the king.’ The truth is, obedience is not formally terminated on the person of the king. Obedience is relative to a precept, and it is men-service to obey a law, not because it is good and just, but upon this formal motive, because it is the will of a mortal man to command it. And reverence, love, fear, being acts of the affection, are not terminated on a law, but properly on the person of the judge; and they are modifications, or laudable qualifications of acts of obedience, not motives, not the formal reason why I obey, but the manner how I obey. And the apostle makes expressly fear of punishment a motive of obedience (Rom. 13:4), while he says, “He beareth not the sword in vain,” therefore be subject to the king; and this hinders not personal resistance to unjust commandments. … Answer. 1. To obey the king’s personal will when it is sinful (as we now suppose), against his legal will, is a sin and a disobedience to God and the king also, seeing the law is the king’s will as king; but to obey his legal will against his sinful personal will (as it must be sinful if contrary to a just law) is obedience to the king as king, and so obedience to God. 2. You take the king’s person to be himself, but you take quid pro quo [this for that]; for his ‘person’ here, you must not take physically for his suppost [agent] of soul and body, but morally: it is the king as a sinful man, doing his worst will against the law, which is his just and best will and the rule of the subjects. And the king’s personal will is so far just and to regulate the subjects insofar as it agrees with his legal will or his law, and this [personal] will can sin, and therefore may be crossed without breach of the Fifth Commandment; but his legal will cannot be crossed without disobedience both to God and the king. … Answer… We are to obey the king’s personal will when the thing commanded is not sin; but his subjects, as subjects, have little to do with his personal will in that notion. It concerns his domestic servant, and is the king’s will as he is the master of servants, not as he is king in relation to subjects; But we speak of the king’s personal will as repugnant to law and contrary to the king’s will as king, and so contrary to the Fifth Commandment; and this [personal will] is attended often not only with passion, but also with prejudice; and we owe no subjection to prejudice and passions, or to actions commanded by these disordered powers, because they are not from God, nor his ordinances, but from men and the flesh, and we owe no subjection to the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex… (1644; Edinburgh: Ogle, 1843), p. 150. Rutherford is responding to the royalist, Symmons.</cite></span></figcaption>

<blockquote><p>Dr. [John] Rainolds objected the example of the brazen serpent, demolished and stamped to powder by Ezekiel, because the people abused it to idolatry: wishing, that, in like sort, the cross should be abandoned, because in the time of Popery it had been superstitiously abused. Whereunto the King’s Majesty answered diverse ways: First, quoth he, though I be sufficiently persuaded of the cross in baptism, and the commendable use thereof in the Church so long: yet, if there were nothing else to move me, this very argument were an inducement to me for the retaining of it, as it is now by order established: For, inasmuch, as it was abused, so you say, to superstition in time of popery, it does plainly imply, that it was well used before Popery. I will tell you, I haue lived among this [dissenting] sort of men (speaking to the lords and bishops) ever since I was ten years old, but I may say of myself as Christ did of Himself: Though I lived amongst them, yet since I had ability to judge, I was never of them; neither did anything make me more to condemn and detest their courses than that they did so peremptorily disallow of all things which at all had been used in Popery. For my part, I know not how to answer the objection of the Papists, when they charge us with novelties: but truly to tell them that their abuses are new, but the things which they abused we retain in their primitive use, and forsake only the novel corruption. By this argument we might renounce the Trinity and all that is holy, because it was abused in Popery (and speaking to Doctor Rainolds merely) they used to wear hose and shoes in Popery, therefore, you shall, now, go barefoot. Secondly, quoth his Majesty, what resemblance is there between the brazen serpent, a material visible thing, and the sign of the cross made in the air? Thirdly, I am given to understand by the bishops, and I find it true, that the Papists themselves did never ascribe any power or spiritual grace to the sign of the cross in baptism. Fourthly, you see, that the material crosses, which in time of Popery were made, for men to fall down before them, as they passed by them, to worship them (as the idolatrous Jews did the brazen serpent) are demolished, as you desire.</p></blockquote>

<blockquote><p>…in making orders and ceremonies of the Church it is not lawful to do what men list, but they are bound to follow the general rules of the Scripture that are given to be the square whereby those should be squared out. Which rules I will here set down as those which I would have as well all orders and ceremonies of the church framed by as by the which I wil be content that all those orders and ceremonies which are now in question whether they be good and convenient or no should be tried and examined by. And they are those rules which Paul gave in such cases as are not particularly mentioned of in scripture. The first, that they offend not any, especially the Church of God. (1 Cor. 10:32) The second is (that which you cite also out of Paul) that all be done in order and comliness. (1 Cor. 14:40) The third, that all be done to edifying. (1 Cor. 14:26) The last, that they be done to the glory of God. Rom. 6:7)</p></blockquote>

<blockquote><p>‘Yea, but’ (say they) ‘our ceremonies are typical and Jewish ceremonies, which hurt our worship.’ They mean (as I conceive) they are teaching ceremonies, not ceremonies of mere order, but significant, to put us in mind of duty. I am sorry that this should be accounted a fault. If they did not signify, how could they edify? (1 Cor. 14:26) Were they types and shadows of the mysteries of the Gospel invented by men, indeed Christ were ill-advised not to ordain them. But being only moral documents and monitors of some duties, I wonder where their guilt lies. If I had an hundred boxes in my house for my uses, and some few of them had a mark upon them to direct me where my money lay, that I might be careful of that, does this savor of want of natural wisdom? So neither does it taste of want of spiritual wisdom to set a mark upon some few ceremonies, to put me in mind of my duty to Christ. ‘What are these’ (say they) ‘but images set up to ourselves for religious use?’ What? to worship? to adore God in or by? No, but to remind us of what we ought to do. And this was the practice of the Church in all ages: Abraham put his servant’s hand under his thigh in swearing, surely to signify his subjection to him in that business about the promised seed (Gen. 24:2). Moses set up an altar when Amalek was overthrown and called it Jehovah-Nissi, to signify that the Lord was their banner (Ex. 17:15). The two tribes and a half built an altar, not to distinguish their borders, but to signify that they were God’s people and that they had all one God, to whom they and their posterity must sacrifice upon his own altar (Josh. 22:24–35). Samuel set up a stone when the Philistines were discomfited and called it Eben-Ezer, to signify that the Lord helped them (1 Sam. 7:12). When Christ the truth was come, he used human significant ceremonies, as the feast of dedication (John 10:22), sitting at the Passover—a sign of rest (Matt. 26:20)—the water pots of the Jewish purifications (John 2:6), the custom of embalming (John 19:39–40), besides other formalities of the synagogue. (Lk. 4:17-20) The Corinthians had the women’s veil in the congregation, to signify subjection (1 Cor. 11:5–6), and the kiss of peace to signify love (Rom. 16:20; 2 Pet. 2:11). Other Christians had agapae [love-feasts] at the sacrament (Jude), in the room whereof the Christians’ offertory was brought in for pious uses, to signify that love they should have one to another. So we have standing at the Belief [Apostles’ Creed], to signify that it is not a prayer and that we are ready to confess our faith; kneeling at the commandments, to signify the honor we have to that God that gave it, and that we must be ready to dart up prayer for our obedience; and kneeling at the sacrament, to signify an humble acknowledgment of God’s love for so great a benefit. And do we and all these saints before us set up images to ourselves in these ceremonies for religious use? God forbid. The practice of these saints, when the laws of God were purely taught and kept, teaches us that though we may not set up an image to worship God by or in, yet may we set up some edifying signs to put us in mind of those duties we owe to God (1 Cor. 14): The patriarchs may build altars, give their children proper names to be admonishing signs of their duties to God; and we may set all our senses on work that way. We may set up a post in a dark and dangerous passage, that when I go that way and touch it, it may signify my danger, and I may avoid it. I may set a watchman in a tower to give a sound when the enemy comes, that he may signify my enemy’s approach, and I may avoid him. I may set up a sea mark to signify a rock near, that I split not upon it. And may not we be as wise for our souls as for our bodies? God forbid. I am sure He has nowhere forbidden it. Therefore it is not against Christ. If it be not against Him, it is for Him, says our Savior (Mk. 9:40).</p></blockquote>

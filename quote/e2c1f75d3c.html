<main class="wrap"><figure class="quote" id="q-e2c1f75d3c" data-kw="">
<blockquote><p>I plant a tree in a sunny spot, and such a tree as might in the course of time strike deep its roots, and bear fruit for many a year, if I choose to shelter it with hedges from the violence of winds, or to restrain the assault of the tempests. Well, though I am well aware of this, yet it seems good to me not to encircle it with the sheltering hedge, or to keep off the fierce storm-blast; and the result is, that the tree is straightway uprooted.

I am not the cause of the overthrow, merely because I could have prevented it, but the winds themselves are. I am not to be regarded as the cause of the catastrophe, though I foresaw it, and willed it to the extent of permitting it to come about, by not preventing when prevention was in my power; and both because I was not bound to do it, as under no obligation, and because for good reasons I had made up my mind to allow this particular upshot of affairs.

In like manner did God with Adam, letting temptation try him, and making it abundantly manifest what the creature is capable of when without the assistance and regimen of the Creator. Yet is God in no sense to be called the cause of Adam’s lapse, since, instead of bringing him into it, He plied his fears, He warned and threatened him; and since He neither inclined him to evil, nor put into him any sinful longing, nay, not so much as took from him any gift conferred in his creation; but only, as it seemed good to Him, denied or did not bestow the confirming grace which Adam had no right to claim.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-walker.html">James Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted, The Theology and Theologians of Scotland, Chiefly of the Seventeenth and Eighteenth Centuries</cite></span></figcaption>

<blockquote><p>This is clear in all the governments and commonwealths that the Lord did immediately model Himself, magistrates had this for a special part of their task, to keep His ordinances pure, and to restrain the corrupters of them: This is expressed in the Moral Law, where Masters are no less to oversee their servants, that they work not on the Sabbath, from respect to the Lord, than to direct their work all the week from respect to themselves [Ex. 20:8-11]; and by the rules of interpreting of these commands, what belongs to a master to be done by him as a master, in reference to these over whom he has power according to his station, that does belong to all magistrates in reference to these under their charge, according to their stations. Also, where one instance is named, all of that kind are comprehended. And therefore as this ordinance of sanctifying the Sabbath is to be overseen by superiors, so also are all others: yea, it is acknowledged also, that what is expressed in one command, in respect of the extent thereof, is to be understood in all. And therefore this obligation lies on superiors, to make inferiors observant of God’s ordinances in reference to all the commands; this is not doubted of the duties in the Second Table: yet there is no expression in it inferring the same so express as is in the First; and this is a common assertion, magistrates have both Tables of the Law committed to their keeping. This is fully made out by many godly and learned men, and we need not to insist upon it…</p></blockquote>

<blockquote><p>Back in the early days of this blog, I was deeply committed to Libertarian Theology (a Christianized form of small government political ideology), which restricts the state largely to crime and defence. This position is the one held by most theonomists today, hence they write against the civil magistrate funding the church, welfare, healthcare, and education. Those of you who read the first edition of my book, A Conquered Kingdom, will know that this was the position that I defended and that I argued that this was compatible with the establishment principle as enshrined in the original Westminster Confession of Faith.

Over time, however, I began to increasingly see that this position was totally untenable. This post will reveal that Libertarian Theology is incongruous with the Scottish theory of the establishment principle, and, consequently, with the Westminster Confession of Faith that enshrines this principle as part of our subordinate standards. Whether or not Libertarian Theology is biblical is a debate for another day; our present objective is only to highlight the reality that it is contra-confessional and in opposition to the Covenanted Reformation. The sources used here are all available on the internet, so the readers can examine the documents for themselves.

Although the Scottish Reformers and Covenanters were theonomists, in the sense that they believed in the abiding validity of the majority of the penal sanctions, they did not preach a gospel of small government. First, the Second Book of Discipline of the Church of Scotland, which was approved by the General Assembly in 1578 (when Andrew Melville was moderator), makes it clear that the civil magistrate is to fund the church and the provision of social services: ‘To see that sufficient provision be made for the ministerie, the schooles, and the poore: and if they have not sufficient to awaite upon their charges, to supply their indigence even with their own rents, if need require.’ [1]

This teaching was upheld in the National Covenant of Scotland (1580, later reaffirmed in 1638), in which the Covenanters swore to ‘join ourselves willingly, in doctrine, faith, religion, discipline, and use of the holy sacraments, as lively members of the same in Christ our head: promising and swearing, by the great name of the LORD our GOD, that we shall continue in the obedience of the doctrine and discipline of this kirk’. [2] It was also upheld in the Solemn League and Covenant of England, Scotland, and Ireland in 1643; in the first article of this covenant they swore to labour for ‘the preservation of the reformed religion in the Church of Scotland, in doctrine, worship, discipline, and government, against our common enemies’. [3]

Obviously, common sense should tell us that when the Covenanters’ swore to uphold the discipline of the kirk, they meant the system enshrined in the Second Book of Discipline. Since this document stipulates that the civil magistrate is to fund the church, education, and works of mercy then we are forced to conclude that Libertarian Theology, which denies that the Christian magistrate is commanded or even permitted to do such things, is contrary to the Covenanted Reformation. Ergo, it is inconsistent for a Covenanter to be a Libertarian.

For further confirmation of the claim that the National Covenant is upholding the Second Book of Discipline, we find Thomas Houston arguing that the Church of Scotland’s First and Second Books of Discipline ‘have always been regarded with approbation in the Covenanting Church, and the latter of which, as Dr [Thomas] McCrie testifies, was sworn to in the National Covenant, and is to be considered of standing authority in the church’.[3] Modern Reformed Presbyterians need to take note of this, because if we are going to continue to claim to be the Church of the covenants, then we better make sure we know what precisely it is that the covenants teach. For my part, I only found out that the covenants upheld the Second Book of Discipline a few weeks ago. This is despite the fact that I have been reading Covenanter history and literature for nine years.

However, this raises another question, namely, ‘can one subscribe to the original Westminster Confession and believe in small government?’ Without presently going into too much detail, the answer to this should be pretty obvious to those familiar with the theoretical framework within which the Westminster Confession was written. It must be pointed out that the Westminster Confession is a direct product of the covenants, National and Solemn League. The first article of the latter covenant binds the Covenanters to compile a uniform confession of faith. Are we seriously to believe that the Confession which was subsequently produced by the Westminster Assembly and adopted by the General Assembly of the Church of Scotland was designed to accommodate views which the Covenanters had rejected in the covenants? To affirm this makes no sense at all. Conversely, we find that when the Scottish General Assembly adopted the Westminster Assembly’s Form of presbyterial church government, they continued to profess their adherence to the ‘books of Discipline’ of their church. [5] Instead, the reality must be faced: Libertarianism is unconfessional error and to embrace it is a violation of the covenants. In light of this, we must conclude that the Scottish Covenants and the Westminster Standards are Social Theocratic documents, which advocate a more interventionist state than the small government views of many conservatives and Libertarians. We could make other arguments to further substantiate this point, but these are sufficient for the time being. [6]

[1] The Second Book of Discipline of the Church of Scotland (1578), From the True Covenanter website (http://www.truecovenanter.com/kirkgovt/scotland_kirk_books_of_discipline_1621.phtml?scotland_kirk_books_of_discipline_1621=book2) (accessed 10 Dec. 2011).

[2] National Covenant of Scotland (1580; 1638), From the Covenanter website (http://www.covenanter.org/Westminster/nationalcovenant.htm) (accessed 10 Dec. 2011).

[3] Solemn League and Covenant (1643), From the Covenanter website (http://www.covenanter.org/Westminster/solemnleague.htm) (accessed 10 Dec. 2011).</p></blockquote>

derator%29%2C+makes+it+clear+that+the+civil+magistrate+is+to+fund+the+church+and+the+provision+of+social+services%3A+%E2%80%98To+see+that+sufficient+provision+be+made+for+the+ministerie%2C+the+schooles%2C+and+the+poore%3A+and+if+they+have+not+sufficient+to+awaite+upon+their+charges%2C+to+supply+their+indigence+even+with+their+own+rents%2C+if+need+require.%E2%80%99+%5B1%5D%0A%0AThis+teaching+was+upheld+in+the+National+Covenant+of+Scotland+%281580%2C+later+reaffirmed+in+1638%29%2C+in+which+the+Covenanters+swore+to+%E2%80%98join+ourselves+willingly%2C+in+doctrine%2C+faith%2C+religion%2C+discipline%2C+and+use+of+the+holy+sacraments%2C+as+lively+members+of+the+same+in+Christ+our+head%3A+promising+and+swearing%2C+by+the+great+name+of+the+LORD+our+GOD%2C+that+we+shall+continue+in+the+obedience+of+the+doctrine+and+discipline+of+this+kirk%E2%80%99.+%5B2%5D+It+was+also+upheld+in+the+Solemn+League+and+Covenant+of+England%2C+Scotland%2C+and+Ireland+in+1643%3B+in+the+first+article+of+this+covenant+they+swore+to+labour+for+%E2%80%98the+preservation+of+the+reformed+religion+in+the+Church+of+Scotland%2C+in+doctrine%2C+worship%2C+discipline%2C+and+government%2C+against+our+common+enemies%E2%80%99.+%5B3%5D%0A%0AObviously%2C+common+sense+should+tell+us+that+when+the+Covenanters%E2%80%99+swore+to+uphold+the+discipline+of+the+kirk%2C+they+meant+the+system+enshrined+in+the+Second+Book+of+Discipline.+Since+this+document+stipulates+that+the+civil+magistrate+is+to+fund+the+church%2C+education%2C+and+works+of+mercy+then+we+are+forced+to+conclude+that+Libertarian+Theology%2C+which+denies+that+the+Christian+magistrate+is+commanded+or+even+permitted+to+do+such+things%2C+is+contrary+to+the+Covenanted+Reformation.+Ergo%2C+it+is+inconsistent+for+a+Covenanter+to+be+a+Libertarian.%0A%0AFor+further+confirmation+of+the+claim+that+the+National+Covenant+is+upholding+the+Second+Book+of+Discipline%2C+we+find+Thomas+Houston+arguing+that+the+Church+of+Scotland%E2%80%99s+First+and+Second+Books+of+Discipline+ ude+that+the+Scottish+Covenants+and+the+Westminster+Standards+are+Social+Theocratic+documents%2C+which+advocate+a+more+interventionist+state+than+the+small+government+views+of+many+conservatives+and+Libertarians.+We+could+make+other+arguments+to+further+substantiate+this+point%2C+but+these+are+sufficient+for+the+time+being.+%5B6%5D%0A%0A%5B1%5D+The+Second+Book+of+Discipline+of+the+Church+of+Scotland+%281578%29%2C+From+the+True+Covenanter+website+%28http%3A%2F%2Fwww.truecovenanter.com%2Fkirkgovt%2Fscotland_kirk_books_of_discipline_1621.phtml%3Fscotland_kirk_books_of_discipline_1621%3Dbook2%29+%28accessed+10+Dec.+2011%29.%0A%0A%5B2%5D+National+Covenant+of+Scotland+%281580%3B+1638%29%2C+From+the+Covenanter+website+%28http%3A%2F%2Fwww.covenanter.org%2FWestminster%2Fnationalcovenant.htm%29+%28accessed+10+Dec.+2011%29.%0A%0A%5B3%5D+Solemn+League+and+Covenant+%281643%29%2C+From+the+Covenanter+website+%28http%3A%2F%2Fwww.covenanter.org%2FWestminster%2Fsolemnleague.htm%29+%28accessed+10+Dec.+2011%29.%E2%80%9D%0A%0A%E2%80%94+Thomas+Houston%2C+The+Covenanter%E2%80%99s+narrative+and+plea%3A+exhibiting+the+error%2C+schism%2C+radicalism%2C+and+slander+of+Dr.+Paul%2C+and+other+separatists+from+the+Reformed+Presbyterian+Church%2C+%28Belfast%2C+1841%29%2C+p.+116.+Available+here.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa822931d22.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a822931d22.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2011/12/10/libertarian-theology-and-the-covenanted-reformation-towards-a-reformed-political-theology/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Therefore seeing no king or governor is exempted from the laws, hand, and power of God, but that he ought to fear and tremble at it, we may proceed to the other part of the question: that is, whether kings, princes, and other governors ought to be obedient and subject to the positive laws of their country. To discuss this question, the right way and mean is as in all other things, to resort to the fountains and roots, and not to depend on the rulers and branches. For as if men should admit, that the church of Rome were the catholic church, and the pope the head of it, and God’s only vicar in earth, and not seek further how he cometh by that authority: than could no man say, but that all his doings (were they never so wicked) should seem just: so if men should build upon the authority that kings and princes usurp over their subjects, and not seek from whens they have their authority, nor whether that which they use, be just, there could be nothing produced to let their cruel tyranny. But forasmuch as we see from whence all politic power and authority cometh, that is, from God: and why it was ordained, that is, to maintain justice: we ought (if we will judge rightly) by God’s word examine to try this mater.

Saint Paul treating who should do obedience, and to whom obedience should be done, saith: Let every soul be subject to the powers that rule, for there is no power but of God. There are that would have this word, Soul, taken for man, not as he consisteth of soul and body both together, but only of the flesh: and that so by the word … should be understanding only a worldly man, that is, a lay man or temporal man (as we term it) and not a spiritual man and a minister of the church. Where upon Antichrist, the bishop of Rome seeking for subjects to be under his kingdom, hath taken for his subjects the clergy with tag and rag that to them belongeth: and hath made laws, that they should be his subjects, obedient to him and not to the political power and authority, where unto he leaveth for subjects only the temporality.

But in scripture this word (Soul) is taken for every kind of man, as may appear when it saith, that all the souls (that is, man and woman) that were in the ark with Noe, were eight. And that all the souls of the house of Jacob, which came in to Egypt were lxx. In which numbers it cannot be denied, but that there were as holy and as spiritual persons, as any are or were in the kingdom of the bishop of Rome. And Chrysostom (a priest) expounding this text (Let every soul be subject to the higher powers) sayeth: yea if thou be an apostle, an evangelist, a prophet, or what so ever thou art: for this subjection destroyeth not religion. So that it can not be denied, but by this word (Soul) is comprehended, every person, and none excepted.

Now touching this word (Power) some would have it interpreted for all those persons that execute justice, be he Kaiser, king, mayor, Sheriff, constable, horseholder, or never so low: and some would have it to be interpreted only of kings and chiefest officers. But it is here to be taken for the ministry and authority, that all officers of justice do execute: and so it may appear by Christ’s own words, where he saith: The kings of the nations rule over them, and those that exercise the authority or power, be called gracious Benefactors, or well doers. For as all men and women that seem to live together in the holy ordinance of Matrimony, be not man and wife, for it may be, that the man hath an other wife living or the wife other an husband, or that they came not together for the love of God only, and to avoid sin, but for sensuality, and to get riches, and so the ordinance it self is one thing, and the persons, that is, the man and woman an other: even so is the politic power or authority being the ordinance and good gift of God, one thing, and the person that executeth the same (be he king or Kaiser) an other thing. The ordinance being godly, the man may be equal and not of God, nor come thereto by God, as the Prophet Osee saith: They have made them a king, and not through me: a prince, and not through my counsel and will,

Neither is that power and authority which kings, princes, and other ministers of justice exercise, only called a power: but also the authority that parents have over their children, and masters over their servants, is also called a power: and neither be the parents nor masters the power it self, but they be ministers and executors of the power, being given unto them by God: Which also S. Paul in an other place plainly sheweth, saying to Titus: Warn them to be subject to the principalities and powers. Which some interpret, princes and powers, to make a distinction between the minister and the Ministry. And it followeth: to obey the officers, so that always the difference may be perceived. So than if by this word (Soul) is meant every person spiritual and temporal, man and woman: and by this word (power) the authority that kings and princes execute, than can not kings and princes, but be contained under this general word (Soul) as well as others.

And they being but executors of God’s laws, and men’s just ordinances, be also not exempted from them, but be bounden to be subject and obedient unto them. For good and just laws of man be God’s power and ordinances, and they are but ministers of the laws, and not the laws self. And if they were exempt from the laws, and so it were lawful for them to do what them lusteth, their authority being of God, it might be said, that God allowed their tyranny robbery of their subjects, killing them without law, and so God the author of evil: which were a great blasphemy. Justiniā the emperor well considered, when he made this saying to be put into the body of the Laws.

It is a worthy saying (saith he) for the Majesty of him that is in authority, to confess that the prince is subject to the laws, the authority of the prince do the so much depend on the authority of the laws. And certainly it is more honour than the honour of the empire, to submit the principality unto the laws. For in deed laws be made, that the wilful self will of men should not rule, but that they should have a line to lead them, as they might not go out of the way of justice: and that (if any would say, they did them wrong) they might allege the law for their warrant and authority.

It is also a principle of all laws grounded on the law of nature, that every man should use himself and be obedient to that law, that he will others be bounden unto. For otherwise he taketh away that equality (for there is no difference between the head and foot, concerning the use and benefit of the laws) whereby common wealths be maintained and kept up. What equality (I beseech you) should there be, where the subject should do to his ruler all the ruler would: and the ruler to the subject, that the ruler lusted?</p></blockquote>

nderstanding+only+a+worldly+man%2C+that+is%2C+a+lay+man+or+temporal+man+%28as+we+term+it%29+and+not+a+spiritual+man+and+a+minister+of+the+church.+Where+upon+Antichrist%2C+the+bishop+of+Rome+seeking+for+subjects+to+be+under+his+kingdom%2C+hath+taken+for+his+subjects+the+clergy+with+tag+and+rag+that+to+them+belongeth%3A+and+hath+made+laws%2C+that+they+should+be+his+subjects%2C+obedient+to+him+and+not+to+the+political+power+and+authority%2C+where+unto+he+leaveth+for+subjects+only+the+temporality.%0A%0ABut+in+scripture+this+word+%28Soul%29+is+taken+for+every+kind+of+man%2C+as+may+appear+when+it+saith%2C+that+all+the+souls+%28that+is%2C+man+and+woman%29+that+were+in+the+ark+with+Noe%2C+were+eight.+And+that+all+the+souls+of+the+house+of+Jacob%2C+which+came+in+to+Egypt+were+lxx.+In+which+numbers+it+cannot+be+denied%2C+but+that+there+were+as+holy+and+as+spiritual+persons%2C+as+any+are+or+were+in+the+kingdom+of+the+bishop+of+Rome.+And+Chrysostom+%28a+priest%29+expounding+this+text+%28Let+every+soul+be+subject+to+the+higher+powers%29+sayeth%3A+yea+if+thou+be+an+apostle%2C+an+evangelist%2C+a+prophet%2C+or+what+so+ever+thou+art%3A+for+this+subjection+destroyeth+not+religion.+So+that+it+can+not+be+denied%2C+but+by+this+word+%28Soul%29+is+comprehended%2C+every+person%2C+and+none+excepted.%0A%0ANow+touching+this+word+%28Power%29+some+would+have+it+interpreted+for+all+those+persons+that+execute+justice%2C+be+he+Kaiser%2C+king%2C+mayor%2C+Sheriff%2C+constable%2C+horseholder%2C+or+never+so+low%3A+and+some+would+have+it+to+be+interpreted+only+of+kings+and+chiefest+officers.+But+it+is+here+to+be+taken+for+the+ministry+and+authority%2C+that+all+officers+of+justice+do+execute%3A+and+so+it+may+appear+by+Christ%E2%80%99s+own+words%2C+where+he+saith%3A+The+kings+of+the+nations+rule+over+them%2C+and+those+that+exercise+the+authority+or+power%2C+be+called+gracious+Benefactors%2C+or+well+doers.+For+as+all+men+and+women+that+seem+to+live+together+in+the+holy+ordinance+of+Matrimony%2C+be+not+man+and+wife%2C+for+it+may+be%2C+that+the+man+hath+an+other+wife+living+or+the+wife+other+an+husband%2C+or+that+they+came+not+together+for+the+love+of+God+only%2C+and+to+avoid+sin%2C+but+for+sensuality%2C+and+to+get+riches%2C+and+so+the+ordinance+it+self+is+one+thing%2C+and+the+persons%2C+that+is%2C+the+man+and+woman+an+other%3A+even+so+is+the+politic+power+or+authority+being+the+ordinance+and+good+gift+of+God%2C+one+thing%2C+and+the+person+that+executeth+the+same+%28be+he+king+or+Kaiser%29+an+other+thing.+The+ordinance+being+godly%2C+the+man+may+be+equal+and+not+of+God%2C+nor+come+thereto+by+God%2C+as+the+Prophet+Osee+saith%3A+They+have+made+them+a+king%2C+and+not+through+me%3A+a+prince%2C+and+not+through+my+counsel+and+will%2C%0A%0ANeither+is+that+power+and+authority+which+kings%2C+princes%2C+and+other+ministers+of+justice+exercise%2C+only+called+a+power%3A+but+also+the+authority+that+parents+have+over+their+children%2C+and+masters+over+their+servants%2C+is+also+called+a+power%3A+and+neither+be+the+parents+nor+masters+the+power+it+self%2C+but+they+be+ministers+and+executors+of+the+power%2C+being+given+unto+them+by+God%3A+Which+also+S.+Paul+in+an+other+place+plainly+sheweth%2C+saying+to+Titus%3A+Warn+them+to+be+subject+to+the+principalities+and+powers.+Which+some+interpret%2C+princes+and+powers%2C+to+make+a+distinction+between+the+minister+and+the+Ministry.+And+it+followeth%3A+to+obey+the+officers%2C+so+that+always+the+difference+may+be+perceived.+So+than+if+by+this+word+%28Soul%29+is+meant+every+person+spiritual+and+temporal%2C+man+and+woman%3A+and+by+this+word+%28power%29+the+authority+that+kings+and+princes+execute%2C+than+can+not+kings+and+princes%2C+but+be+contained+under+this+general+word+%28Soul%29+as+well+as+others.%0A%0AAnd+they+being+but+executors+of+God%E2%80%99s+laws%2C+and+men%E2%80%99s+just+ordinances%2C+be+also+not+exempted+from+them%2C+but+be+bounden+to+be+subject+and+obedient+unto+them.+For+good+and+just+laws+of+man+be+God%E2%80%99s+power+and+ordinances%2C+and+they+are+but+ministers+of+the+laws%2C+and+not+the+laws+self.+And+if+they+were+exempt+from+the+laws%2C+and+so+it+were+lawful+for+them+to+do+what+them+lusteth%2C+their+authority+being+of+God%2C+it+might+be+said%2C+that+God+allowed+their+tyranny+robbery+of+their+subjects%2C+killing+them+without+law%2C+and+so+God+the+author+of+evil%3A+which+were+a+great+blasphemy.+Justinia%CC%84+the+emperor+well+considered%2C+when+he+made+this+saying+to+be+put+into+the+body+of+the+Laws.%0A%0AIt+is+a+worthy+saying+%28saith+he%29+for+the+Majesty+of+him+that+is+in+authority%2C+to+confess+that+the+prince+is+subject+to+the+laws%2C+the+authority+of+the+prince+do+the+so+much+depend+on+the+authority+of+the+laws.+And+certainly+it+is+more+honour+than+the+honour+of+the+empire%2C+to+submit+the+principality+unto+the+laws.+For+in+deed+laws+be+made%2C+that+the+wilful+self+will+of+men+should+not+rule%2C+but+that+they+should+have+a+line+to+lead+them%2C+as+they+might+not+go+out+of+the+way+of+justice%3A+and+that+%28if+any+would+say%2C+they+did+them+wrong%29+they+might+allege+the+law+for+their+warrant+and+authority.%0A%0AIt+is+also+a+principle+of+all+laws+grounded+on+the+law+of+nature%2C+that+every+man+should+use+himself+and+be+obedient+to+that+law%2C+that+he+will+others+be+bounden+unto.+For+otherwise+he+taketh+away+that+equality+%28for+there+is+no+difference+between+the+head+and+foot%2C+concerning+the+use+and+benefit+of+the+laws%29+whereby+common+wealths+be+maintained+and+kept+up.+What+equality+%28I+beseech+you%29+should+there+be%2C+where+the+subject+should+do+to+his+ruler+all+the+ruler+would%3A+and+the+ruler+to+the+subject%2C+that+the+ruler+lusted%3F%E2%80%9D%0A%0A%E2%80%94+John+Ponet%2C+A+short+treatise+of+politick+power+and+of+the+true+obedience+which+subjects+owe+to+kings+and+other+civil+governors%2C+with+an+exhortation+to+all+true+natural+English+men%2C+%28Strasbourg%3A+The+heirs+of+W.+Ko%CC%88pfel%2C+1556%29%2C+unpaginated.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F879df695cb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/879df695cb.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/05/22/john-ponet-the-magistrate-is-subject-to-the-positive-laws-of-the-country/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-6603cbb376" data-kw="">
<blockquote><p>In fact, there is nothing that brings those who are put in authority over others into greater disrepute than if they order them to do something that they are not prepared to do themselves. There is a saying that does the rounds in the schools, which warns, “Shame on the teacher, if his guilt condemns him.” This is true not only of teachers in the church but also of the leading people who govern the state. No decree will seem harsh or intolerable to the people if they see that it is observed by the magistrates themselves. But if they are dishonest and transgress with impunity the laws that they impose on others, it will not be easy to find anyone willing to submit to their rule.</p></blockquote>

<blockquote><p>XXV. As every escape, error, or act of unfaithfulness (even known and continued in) whether in a minister’s entry to the ministry, or in his doctrine or deportment, does not non-minister him, nor give sufficient ground to withdraw from, or reject him as a minister of Christ: So neither does every enormity, mis-demeanure or act of tyranny, injustice, perfidy or profanity etc. in the civil magistrate, whether as to his way of entry to that office or in the execution of it, or in his private and personal behavior, denominate him a tyrant or an usurper, or give sufficient ground to divest him of his magistratical power, and reject him as the lawful magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-mcward.html">Robert McWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Banders Disbanded (1681), p. 47 McWard was a protege of Rutherford and leader of the Scottish covenanters.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-031e75f6c4" data-kw="">
<blockquote><p>I conceive kings are conceived to have a threefold supreme power: 1. Strictly absolute to do what they please, their will being simply a law. This is tyrannical. Some kings have it, de facto, ex consuetudine [by custom], but by a divine law none have it… 2. There is another power limited to God’s law, the due proper right of kings. (Dt. 17:18-20) 3. There is, a potestas intermedia, a middle power, not so vast as that which is absolute and tyrannical, which yet is some way human. This I take what jurists call jus regium, lex regia, jura regalia regis; Cicero, jura majestatis; Livius, jura imperii, and these royal privileges are such common and high dignities as no one particular magistrate can have [inherently, or to himself alone], seeing they are common to all the kingdom… so the magazine and armory for the safety of the kingdom is in the king’s hand. The king has the like of these privileges, because he is the common, supreme, public officer and minister of God for the good of all the kingdom; and, amongst these royal privileges, I reckon that power that is given to the king, when he is made king, to do many things without warrant of the letter of the law, without the express consent of his council, which he cannot always carry about with him, as the law says. The king shall not raise armies without consent of the parliament; but if an army of Irish, or Danes, or Spaniards, should suddenly land in Scotland, he has a power, without a formally-convened parliament, to command them all to rise in arms against these invaders and defend themselves — this power no inferior magistrate has as he is, but [only] such a magistrate [as the king]. And in many such exigencies, when the necessity of justice or grace requires an ex-temporal [out of the moment] exposition of laws, pro re nata, ‘for present necessary execution’, some say only the emperor, — others, all kings have these pleasures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843), Question 39, ‘Whether or No any Prerogative at All Above the Law be Due to the King, or if Jura Magestatis [the Rights of Majesty] be any Such Prerogative Royal?’</cite>, p. 193</span></figcaption>

</figure><figure class="quote" id="q-8e381f417c" data-kw="">
<blockquote><p>But a king, by a sort of contingency, succeeds to kings; for nature does not ascertain us there must be kings to the world’s end, because the essence of governors is kept safe in aristocracy and democracy, though there were no kings; and that kings should necessarily have been in the world, if man had never fallen in sin, I am not, by any cogent argument, induced to believe. I conceive there should have been no government but those of fathers and children, husband and wife, and (which is improperly government) some more gifted with supervenient additions to nature, as gifts and excellencies of engines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 79 lt col top</span></figcaption>

<blockquote><p>To these appertains the doing and execution of civil and temporal affairs, so as their subiects may live in peace. By reason whereof the taxes and subsidies are due unto them and to them appertain to use the sword which God has given them, for the preservation as well of the countries which be committed to them, as also for the defence and maintenance of good laws, and punishment of the evil and wicked doers. Secondly, the duty and office of the magistrates is not to regard simply the peace and concord of subiects, but principally for this end, that the peace and concord may tend to the honor and glory of God, that all men may live not only in a certain civil honesty, but also with piety and true worship of God, as witnesses saint Paul. For this cause especially it appertains to the magistrate that the laws which he uses and executes may be conformable to the will of God: and principally to give order that the religion be perfect and holy, and that all the Church be ordered according to the Word of God, forbidding and punishing, as the case requires, all those which trouble the Church or concerning the discipline thereof [Beza’s larger context makes clear he is speaking in the context of a Christian nation].</p></blockquote>

<blockquote><p>1 Cor. 6:12, ‘All things (indifferent) are lawful in themselves, but they are not expedient,’ if we be brought under the power or band of them by law. Therefore, in the means of worship, not only must we see what is lawful, but also what is profitable and conducing to the end… 1 Cor. 7:6, ‘But this I speak by permission, not of commandment.’ Therefore in things in which God has granted us liberty, to do or not to do, permission has place, not obliging necessity or penal laws. 13th Proposition. There cannot be commanding laws in things that are politicly good or evil according to the individual complexion, temperature, or gifts of singular men: [for example] to marry or not to marry, cannot be commanded, for where God looses, no power on earth can bind, v. 33. 1 Cor. 8:7, Paul condemns them in the use of their Christian liberty, ‘Howbeit there be not in every man this knowledge;’ then that rulers may make laws in things indifferent, without scandal, they must remove ignorance. 2. If there be but one person weak in knowledge (there is not in every man that knowledge), a law obliging all in things indifferent cannot be made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (London, 1646), Appendix, Question 1</cite>, pp. 6-7</span></figcaption>

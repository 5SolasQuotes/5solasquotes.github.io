<main class="wrap"><figure class="quote" id="q-66bdb9a034" data-kw="">
<blockquote><p>[I] This is called his [Greek] (Acts 2:23), Determined purpose, [Greek] (Acts 4:28), The hand and counsel of God; [Greek] (Eph. 1:9), The good pleasure of God and Gods eternal providence. (Now this is called his eternal providence, that it may be distinguished from actual providence, which is nothing else but the execution of God’s decrees.) II. This is called, the Will of God, or The will of his good pleasure. Indeed the decree is the very will of God; yet for our better understanding, the will is considered as the cause efficient, the decree is the effect. Now whereas this word ‘will’ is taken diversely, it is diverse ways distinguished by divines, to wit, into the will of his good pleasure and the will of the sign; into an antecedent and consequent; into absolute, and conditional; into secret and revealed. But these are not real distributions of the divine will, but distinctions only of the name: For to speak properly, there is in God but one only will, which is called the will of his good pleasure, because out of his most free good pleasure He has decreed what shall be done: It is called also his antecedent will because it had existence before any creature and from eternity with God it was established: It is named also absolute, because it depends upon God’s good pleasure and not from the things which are done in time. Lastly it is called secret, because in respect of priority it is known neither to men nor angels. But these things are improperly styled by the name of divine will which are comprehended in that ordinary verse: Praecipit, et prohibet, promittit, consulit, implet: “Commands, forbids, promises, consults, fulfills.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, ... (d. 1629; London: Mabb, 1660), bk. 1, ch. 3, Concerning the Works of God &amp; the Decrees of God in General, The Rules, pp. 33-37</span></figcaption>

<blockquote><p>§24. Question 24: May we pray for the destruction of the enemies of Christ, or of the Gospel, or of the king? Answer: Not with respect to that which is called God’s antecedent will; for so we ought first to pray for their conversion (and restraint till then). But with respect to that called his consequent will, we may: that is, we must first pray that they may be restrained and converted, and secondly that, if not, they may be destroyed.</p></blockquote>

<blockquote><p>XXIII. There is in man a twofold judgment, to wit, an antecedent, which is that of the affections and senses; and a consequent, which is that of reason: so there is a twofold volition: the one follows the judgment of sense, and it is rather an imperfect desire than a perfect volition; the other follows the judgment of reason: both these volitions were in Christ more eminently than in us, because in Him were two wills, and these, by reason of his two natures, were distinct in Him, though his person was but one; therefore He desired the cup might pass from Him, but willed it not; or, He willed it by his antecedent, not by his consequent will. O Thou that madest in Thyself the judgement of affection stoop to the judgment of reason and madest thy desire subservient to thy will, and causedst thy antecedent will to give place to thy consequent: produce in me the same effect, that these sinful delights which my affections so earnestly run after, and thy gentle corrections, which they so earnestly run from, may be so ordered that the one by me may be courageously subdued, the other patiently endured, that my affections may submit to my will, my will to reason and reason to thy Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Century of Divine Meditations upon Predestination</cite>, … (London: Young, 1646), pp. 15-16, 19, 21-23, 89-92 Ross (c. 1590–1654) was a Scottish minister and chaplain-in-ordinary to King Charles I. He was not the Aberdeen doctor of the same name.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

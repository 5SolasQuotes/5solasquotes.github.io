<main class="wrap"><figure class="quote" id="q-561d6a751d" data-kw="">
<blockquote><p>In the sixth petition (which is, ‘And lead us not into temptation, but deliver us from evil’) acknowledging, that… we… are not only subject to be tempted, and forward to expose ourselves unto temptations,[l] but also of ourselves unable and unwilling to resist them, to recover out of them, and to improve them;[m] and worthy to be left under the power of them:[n] we pray, that God would so over-rule the world and all in it,[o] subdue the flesh,[p] and restrain Satan,[q] order all things,[r] bestow and bless all means of grace,[s] and quicken us to watchfulness in the use of them, that we and all his people may by his providence be kept from being tempted to sin;[t] or, if tempted, that by his Spirit we may be powerfully supported and enabled to stand in the hour of temptation;[v] or when fallen, raised again and recovered out of it,[w] and have a sanctified use and improvement thereof:[x] that our sanctification and salvation may be perfected,[y] Satan trodden under our feet,[z] and we fully freed from sin, temptation, and all evil, for ever.[a] [l] Matt. 26:69-72. Gal. 2:11-14. 2 Chron. 18:3 compared with 2 Chron. 19:2. [m] Rom. 7:23,24. 1 Chron. 21:1-4. 2 Chron. 16:7-10. [n] Ps. 81:11,12. [o] John 17:15. [p] Ps. 51:10. Ps. 119:133. [q] 2 Cor. 12:7,8. [r] 1 Cor. 10:12,13. [s] Heb. 13:20,21. [t] Matt. 26:41. Ps. 19:13. [v] Eph. 3:14-17. 1 Thess. 3:13. Jude 24. [w] Ps. 51:12. [x] 1 Pet. 5:8-10. [y] 2 Cor. 13:7,9. [z] Rom. 16:20. Zech. 3:2. Luke 22:31,32. [a] John 17:15. 1 Thess. 5:23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Larger Catechism</cite>, #195</span></figcaption>

</figure><figure class="quote" id="q-2c52200069" data-kw="">
<blockquote><p>People who find themselves at odds with a spiritually abusive pastor, will often feel isolated, shamed, ostracized, silenced, and made to feel like they are unsubmissive, insubordinate, and one who undermines the church’s God-given leadership. … Spiritual Abuse Is Often Used to Achieve Godly, Biblical Goals… abuse usually happens because a pastor is desperately trying to control his situation. He wants to control his staff, control the vision, control the direction of the church. Loyalty must be maintained at all costs. Nothing can be allowed to derail the ministry. And when people fall out of line (which tends to happen with human beings) then he cracks the whip… …when the abuse is uncovered, people often refuse to believe it. To allow such a possibility will wreck the tidy world they have built around that spiritual leader. So, the abusive pastor can often provide what seems to be credible ‘explanations’ for everything, while he is backed up by supporters who don’t want to see a successful ministry come to an end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-j-kruger.html">Michael J. Kruger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘What is Spiritual Abuse?’</cite>, (2021) 14 paragraphs</span></figcaption>

<main class="wrap"><figure class="quote" id="q-e0313fd875" data-kw="">
<blockquote><p>This discussion about University education leads up to another view of the transition from philosophy to theology. The Scottish Churches have made statutory the transition, formal and express, as a vital part of the training of young men for the ministry. They will have no one licensed to preach who has not previously undergone a theological curriculum of studies in the Halls; and they will allow no one to enter the Hall as a regular student who has not passed through an arts curriculum distinctively philosophical.

There, then, is the transition from philosophy to theology prescribed by law. It is true that in some cases the law may be obeyed only in form. One student may leave the University without anything perceptible of philosophical culture or attainment. Another may leave the Hall with little or nothing of real theological culture or attainment. Thus the transition may not be a reality in this or that case: either because the student has not philosophy to begin with; or because he does not come to have theology to end with; or both. But what we now look to is the ideal in the mind of the churches as represented by their law. And looking to this we see that the transition from philosophy to theology ought in their judgment to have place in the formative process of preparation for the Christian ministry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-macgregor.html">James MacGregor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Transition from Philosophy to Theology in British and Foreign Evangelical Review</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3f47cc2a9a" data-kw="">
<blockquote><p>There were others who, although they believed that the Word was not changed into flesh but assumed it, nevertheless said that he assumed flesh without a soul; for if he had assumed flesh with a soul, the Evangelist would have said, the Word was made flesh with a soul. This was the error of Arius, who said that there was no soul in Christ, but that the Word of God was there in place of a soul.

The falsity of this opinion is obvious, both because it is in conflict with Sacred Scripture, which often mentions the soul of Christ, as: my soul is sad, even to the point of death (Matt 26:38), and because certain affections of the soul are observed in Christ which can not possibly exist in the Word of God or in flesh alone: he began to be sorrowful and troubled (Matt 26:37). Also, God cannot be the form of a body. Nor can an angel be united to a body as its form, since an angel, according to its very nature, is separated from body, whereas a soul is united to a body as its form. Consequently, the Word of God cannot be the form of a body.

Furthermore, it is plain that flesh does not acquire the specific nature of flesh except through its soul. This is shown by the fact that when the soul has withdrawn from the body of a man or a cow, the flesh of the man or the cow is called flesh only in an equivocal sense. So if the Word did not assume flesh with a soul, it is obvious that he did not assume flesh. But the Word was made flesh; therefore, he assumed flesh with a soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super Evangelium S. Ioannis Lectura</cite>, (1270-72), C.1.L7.n167, 167.2-3.</span></figcaption>

</figure><figure class="quote" id="q-e59b32ddfd" data-kw="">
<blockquote><p>Metaphysics is defined as the science of being qua [as] being… Metaphysics can, therefore, be described as the first real speculative science. It is a science because it is a body of demonstrated truths about a single formal object… Insofar as it is a science, metaphysics differs from sacred theology because the latter is not a science in the strict Aristotelian sense for its principles are not evident but revealed. Metaphysics is a real science, as is plain from its definition. For being signifies the same as thing or what actually exists or is at least capable of such existence. Therefore metaphysical notions are first intentions, or concepts that are predicated immediately of things themselves. So metaphysics differs from the logical sciences which deal with second intentions, that is, with concepts that are predicated immediately of other concepts or of beings of reason. Metaphysics indeed is the first or supreme real science, and so differs from other less universal real things, as physics, cosmology, psychology; for it does not just consider one or other part of reality, as these sciences do, but with the totality of things. Therefore, by reason of its material object, metaphysics is equivalent to all the real sciences taken together. Further, it is first by reason of its formal object; for the other sciences consider real things in some narrower respect, as physics considers things as changeable, cosmology things as bodily, etc. But metaphysics considers them precisely as they are real. Hence other real sciences, as cosmology, philosophy of man, presuppose metaphysics and use its conclusions as their principles. But metaphysics does not use the conclusions of any other real science, physics or natural philosophy, as principles. Metaphysics is a speculative and not practical science, because it does not tend toward any other operation but speculation. Hence it differs from ethics, which is practical.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), Intro, pp. 7-8</span></figcaption>

</figure><figure class="quote" id="q-6c602e8f74" data-kw="">
<blockquote><p>Our intellect understands nothing except in virtue of the first light and truth, so every act of the intellect involved in thinking that something does not exist obtains in virtue of the first light. But it is impossible to think in virtue of the first light, that the first light or truth does not exist. Therefore, it is in no way possible to think that the first truth does not exist.</p></blockquote>

<blockquote><p>In chapter 1 we introduced the principle of proportionate causality (PPC), which states that whatever is in an effect must be in its cause, insofar as a cause cannot give what it does not first have. Let’s now examine this principle more carefully. Recall first that, stated more precisely, PPC holds that whatever is in an effect must be in its total cause in some way or other, whether formally, virtually, or eminently… PPC follows straightforwardly from the principle of causality (PC) and the principle of sufficient reason (PSR), both of which have been defended at length in earlier chapters. If there were some aspect of an effect that didn’t come from its total cause, then that would involve a potentiality that was actualized without anything doing the actualizing, which would violate PC. It would be an aspect of the effect that lacked any explanation, which would violate PSR.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Proofs of the Existence of God</cite>, (Ignatius, 2017) | ch. 6, The Nature of God and of His Relationship to the World, p. 170</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In chapter 1 we introduced the principle of proportionate causality (PPC), which states that whatever is in an effect must be in its cause, insofar as a cause cannot give what it does not first have. Let’s now examine this principle more carefully. Recall first that, stated more precisely, PPC holds that whatever is in an effect must be in its total cause in some way or other, whether formally, virtually, or eminently… PPC follows straightforwardly from the principle of causality (PC) and the principle of sufficient reason (PSR), both of which have been defended at length in earlier chapters. If there were some aspect of an effect that didn’t come from its total cause, then that would involve a potentiality that was actualized without anything doing the actualizing, which would violate PC. It would be an aspect of the effect that lacked any explanation, which would violate PSR.”

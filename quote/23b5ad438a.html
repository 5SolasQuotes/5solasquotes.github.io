<main class="wrap"><figure class="quote" id="q-23b5ad438a" data-kw="">
<blockquote><p>If Owen be admitted to be, as by common consent he seems to be regarded, the ‘David’ of the Puritan host, and Howe, and Baxter, and Thomas Goodwin to be the ‘first three’ of its worthies, we believe that the second trio must include the name of David Clarkson, associated probably with those of Charnock and Sibbes, or perhaps Flavel. It is manifest, however, that such a statement is to be taken only in a very general sense. In some respects, Sibbes is as much superior to Goodwin, as in others Goodwin is superior to Sibbes; while in some most important particulars, and especially in respect of clearness and liveliness, Owen himself is unquestionably below all the seven others who have been named, and many others who might have been mentioned.

From the very nature of the case, the question of precedence amongst writers cannot be determined but in a vague and general way. No man would ever think of asking the question whether Shakespeare or Bacon were the greater genius, the better writer; or even the more limited question, whether Hume or Gibbon were the better historian, Addison or Johnson the more accomplished essayist. And in the domain of Christian and theological literature, the qualities of different writers are manifestly incommensurable.

There are diversities of gifts; and it may not be determined whether the possession of a larger measure of one gift, and a smaller measure of another, be more or less valuable than that of a greater degree of the latter, and a less measure of the former. The clear eye of one may be as precious as the fine ear of another; the delicate touch of one as the firm standing of another; and the eye may not say to the ear, I have no need of thee, nor yet the hand to the foot, I have no need of thee.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-smith.html">Thomas Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prefatory Note in The Practical Works of David Clarkson, B.D., Fellow and Tutor of Clare Hall, Cambridge</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e49b8ddd5f" data-kw="">
<blockquote><p>It has sometimes been argued that those who disagree with variant readings found in the Textus Receptus or the Majority Text have either rejected the preservation of scripture or else they are closet higher critics. John Calvin, however, helps us to discern the foolishness of such reasoning in his comments on John 8:59.

In the New King James Version, which is based on the Textus Receptus, we find the following reading: “Then they took up stones to throw at Him; but Jesus hid Himself and went out of the temple, going through the midst of them, and so passed by.”

In the English Standard Version, which is based on the so-called Critical Text (which is really a misnomer, as all texts are critical texts), we find a different reading: “So they picked up stones to throw at him, but Jesus hid himself and went out of the temple.”

You will observe that the ESV omits the words “going through the midst of them”, even though these words are in the majority of Greek manuscripts. Did Calvin assume that one must agree with the reading found in the Majority Text or else one was a higher critic? Calvin answers with a resounding “no”:

Some copies have the words, And so Jesus passed through the midst of them; which Erasmus justly considers to have been borrowed from the Gospel by Luke, (vi. 30.)[1]

When you read through Calvin’s New Testament commentaries, you often find him defending Byzantine readings in cases where there are textual variants. Occasionally, however, he supports the reading that is found in the modern critical texts – the case of John 8:59 being one example. How do we explain this? As with most early Reformed divines that I have read, there is a tendency to defend the Byzantine readings. But the important thing to keep in mind is that they do so on a rational-common sense basis, not because of an ideological assumption that any divergence from the Majority Text equated with a denial of the preservation of scripture or the inerrancy of the Bible. Another useful example of this approach is that of Herman Witsius’s defence of the Byzantine conclusion to the Lord’s Prayer (Matthew 6:13).[2] Therefore, those who wish to cite the early Reformed in favour of Byzantine priority (the view that the Byzantine texts should primarily be used to determine the original reading) have a very strong historical case – and it should be given more respect than it currently is. The fact that arguments made in defence of this position are usually of a low quality, being based on poor scholarship and which often attack straw-men, should not put one off. It should be recognised that it has been defended at the highest scholarly levels, even if one is not convinced that all arguments which have been employed in its favour are ultimately persuasive.

On the other hand, those who defend the Textus Receptus or the Majority Text on a fideistic basis cannot appeal to the early Reformed in order to justify their methodology.[3] As Calvin was prepared to defend the originality of a non-Textus Receptus variant reading, Calvin was not a Received Text ultraist. Instead, he considered the variants on a case-by-case basis, which is the rational approach to the subject. Calvin did not just assume the Textus Receptus is right because it is right (indeed, in this case he basically said that it was wrong), but used reason and common sense to come to the right conclusion concerning the original reading in cases of textual variation. This is not a defence of “autonomous human reason”, it is rather a recognition that God has given us reason and common sense which we are supposed to use in the pursuit of truth.[4]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the gospel according to John</cite>, trans. William Pringle (Geneva, 1553) in Calvin’s commentaries (22 vols, Grand Rapids, 1993), xvii, 363.</span></figcaption>

<blockquote><p>Now though He be the Lord of Heaven and Earth, yet he condescends to come and stand at your door and knock. He becomes importunate suitor; He stands and calls and graciously invites day after day while you reject and despise. But if you continue rejecting his calls after death, God will do no more; you shall have no more invitations, no more means of grace, no more strivings of the Spirit and instead of God’s calling on you, you shall call and arg[ue?] to Him and He will not answer, but He will laugh at your calamity and mock…</p></blockquote>

<blockquote><p>§8. Question 3. Is a man obliged by a contract which he made in ignorance or mistake of the matter? Answer: I have answered this before in the case of marriage, pt. 2, ch.

1. I add here, we must distinguish:

1. Between culpable and inculpable error;

2. Between an error about the principal matter and about some smaller accidents or circumstances;

3. Between a case where the law of the Land, or the common good interposes and where it does not.

1. If it be your own fault that you are mistaken, you are not wholly freed from the obligation: But if it was your gross fault, by negligence or vice, you are not at all freed. But if it were but such a frailty as almost all men are liable to, so that none but a person of extraordinary virtue or diligence could have avoided the mistake, then equity will proportionably make you an abatement or free you from the obligation. So far as you were obliged to understand the matter, so far you are obliged by the contract; especially when another is a loser by your error.

2. An inculpable error about the circumstances or smaller parts will not free you from an obligation in the principal matter: But an inculpable error in the essentials will.

3. Except when the law of the land or the common good, does otherwise overrule the case: For then you may be obliged by that accident. In diverse cases the rulers may judge it necessary, that the effect of the contract shall depend upon the bare words or writings, or actions; lest false pretenses of misunderstanding should exempt deceitful persons from their obligations and nothing should be a security to contractors. And then men’s private commodity must give place to the law and to the public good.

4. Natural infirmities must be numbered with faults, though they be not moral vices, as to the contracting of an obligation, if they be in a person capable of contracting. As if you have some special defect of memory, or ignorance of the matter which you are about! Another who is no way faulty by over-reaching you, must not be a loser by your weakness. For he that comes to the market, or contracts with another who knows not his infirmity, is to be supposed to understand what he does, unless the contrary be manifest: You should not meddle with matters which you understand not: Or if you do, you must be content to be a loser by your weakness.

5. Yet in such cases, another that has gained by the bargain, may be obliged by the laws of equity and charity, to remit the gain, and not to take advantage of your weakness: But he may so far hold you to it, as to secure himself from loss: except in cases where you become the object of his charity, and not of commutative justice only.</p></blockquote>

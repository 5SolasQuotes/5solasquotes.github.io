<main class="wrap"><figure class="quote" id="q-ad91405455" data-kw="">
<blockquote><p>Now, as medieval thinkers like Thomas Aquinas argued, anything with an intellect must also possess a will. For a substance with an intellect acts by virtue of being inclined toward what its intellect takes to be good, and the will just is (on this analysis) an inclination of that sort.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, (Editiones Scholasticae, 2024), pt. 1, ch. 1, p. 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

<blockquote><p>209… We have no power… to will things not apprehended to be good… 210. The three conjunct powers of the soul [vital-active, intellective and volitive] suppose each other, though they are not formally the same: We have no power to will objects not understood, nor to understand, will or execute without vital-activity; nor to understand most things without the will’s determination ad exercitium [to the exercise].</p></blockquote>

<blockquote><p>It is not truth but goodness which is the ultimate object of the soul. And God who is infinite goodness itself, has revealed his truths to the world to do men good and not to hurt them.</p></blockquote>

</figure><figure class="quote" id="q-ffafce369f" data-kw="">
<blockquote><p>It ought to be well understood in approaching this topic that the delineated distinctions, and further ones that will be made, are not magic solutions to ethical predicaments. Rather they are (very useful) tools that will go a long way towards working to what is righteous and pleasing before God. As with all tools, they may be used well, or irresponsibly. If through the multiplying of distinctions and terms (or the opposite, the lack of using such), a conclusion is reached that seems off or suspect, sophistry is likely being committed. Ethical conclusions reached should go with, and support an informed common sense in line with Scripture, not go against it. The purpose is to clearly understand and ground the reasons for right action, and to clear away all the mist, leaps and gymnastics of those who advocate error and manipulate truth as a wax-nose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Ethics of Material Cooperation with, &amp; Associations with Evil’, ‘Extended Intro’, ‘The Beginnings of Answers: Distinctions’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><figure class="quote" id="q-bf53d697a1" data-kw="">
<blockquote><p>But when I say that God can without respect of sin, inflict any torment upon his creature, this is delivered of power absolute. This power the Lord did execute upon his own Son: for what was his sin? Was He not the spotless lamb of God? Yet what agonies did He suffer in the garden, what torments and terrors upon the cross, when He cried out ‘My God, my God, Why hast thou forsaken Me?’ But the like power He does not execute on us, only He gives us authority to exercise the like power over other creatures: If the powder of an hare [rabbit] burnt alive in an oven, be found to be wholesome for us, He gives us leave thus to deal with him, and the like: yet have not these creatures sinned either against God, or against us. Of this absolute power of God I have discoursed more sparingly in the place cited by him, bk. 1, pt. 2, De Electione, digression 3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his Absolute Hatred or Reprobation of the Vessels of Wrath</cite>, … (Oxford: L.L., 1653), pt. 2, 2nd Sort of Arguments, sect. 3, pp. 150-51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

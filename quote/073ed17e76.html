<blockquote><p>mer and deny the latter against the papists the worship of relics VIII. Should the bodies of saints and relics be adored with religious worship? We deny against the papists the second commandment—the worship of images IX. Is it lawful to religiously worship images of God, the holy Trinity, Christ, the virgin and other saints? We deny against the papists X. Whether not only the worship but also the formation and use of religious images in sacred places is prohibited by the second commandment. We affirm against the Lutherans the third commandment XI. Whether every oath so obliges the conscience that we are bound to keep it by an inevitable necessity. We distinguish XII. Whether it is lawful to use ambiguous equivocations and mental reservations in oaths. We deny against the papists and especially the Jesuits the fourth commandment XIII. Whether the first institution of the Sabbat</p></blockquote>

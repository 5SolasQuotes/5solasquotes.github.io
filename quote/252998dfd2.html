<main class="wrap"><figure class="quote" id="q-252998dfd2" data-kw="">
<blockquote><p>I note in passing that he [a Jesuit] everywhere mentions mortal sin, from the prejudice [meaning] of the Papal distinction, so that he may odiously propose our [Reformed] things as if the sense were that we reckon all, even the lightest movements of concupiscence, among those sins which the Papists call ‘mortal’, and it would make no difference whether someone is tickled by some lust without consent or commits adultery: of which calumny it suffices to remember once, and to admonish, that we indeed acknowledge no sin that is not mortal by its nature: but we distinguish degrees among sins, as we have said in its place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Catholic Opposite the Papist Catholic (1630), Question 14, ‘On Concupiscence, or the remnants of original sin in the regenerated man’</cite>, p. 10 trans. AI</span></figcaption>

</figure><figure class="quote" id="q-dfac016fde" data-kw="">
<blockquote><p>That a man should duly, and as he ought, believe, and receive the decision of a synod, it must be both true and he must believe and know that it is true; but [on the other hand,] that it may oblige him and does oblige him, whether his conscience be erroneous, or no[t], is as true, for then this Commandment, ‘Thou shalt not kill’, ‘Honor thy father and thy mother’, should lay no obligation on a man that believes it is service to God to kill the apostles, as, John 16, some do. For no man is exempted from an obligation to obey God’s Law because of his own sinful and culpable ignorance, for we speak not now of invincible ignorance of these things which we are not obliged to know or believe. But if our sinful and erroneous conscience free us from actual obligation to be tied by a law, then our erroneous conscience frees us from sinning against a law, and so from punishment; for whatever frees a man from actual obligation frees him also from actual sinning: for all sin is a doing against a Law-obligation; and if so, then are none to be led by any rule but their own conscience: the written Law and Gospel is not henceforth our rule any more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience… (1649)</cite>, ch. 2, p. 34</span></figcaption>

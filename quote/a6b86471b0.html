<main class="wrap"><figure class="quote" id="q-a6b86471b0" data-kw="">
<blockquote><p>2. Refreshments helpful to nature, so far as to refresh it, that it may have a supply of spirits to go on cheerfully in the duties of holy worship are lawful and useful. Τo macerate the body with abstinences on this day is required of none; and to turn it into a fast or to fast upon it is generally condemned by the ancients. Wherefore, to forbear provision of necessary food for families on this day is Mosaic; and the enforcement of the particular precepts about not kindling fire in our houses on this day, baking and preparing the food of it the day before, cannot be insisted on without a reintroduction of the seventh day precisely, to whose observance they were annexed, and thereby of the law and spirit of the old covenant. Provided always that these refreshments be:

1. Seasonable for the time of them, and not when public duties require our attendance on them. 2nd. Accompanied with a singular regard to the rules of temperance; as:

1. That there be no appearance of evil.

2. That nature be not charged with any kind of excess, so far as [to make one] to be hindered rather than assisted in the duties of the day.

3. That they be accompanied with gravity, and sobriety, and purity of conversation. Now, whereas these things are in the substance of them required of us in the whole course of our lives, as we intend to please God, and to come to the enjoyment of him, none ought to think an especial regard unto them on this day to be a bondage, or troublesome unto them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, (d. 1683), vol. 1 (of 4), p. 749</span></figcaption>

</figure><figure class="quote" id="q-bfce4da00c" data-kw="">
<blockquote><p>Wherein the wickedness of this exceeds, in that men commonly no day in the week follow so much their own ways, and delights of their own heart, as on that day, which is appointed to learn them how to cease from their owne ways, works, and delights. For a great number (and those not the worst of all) take that day to be ordeind only for ease of their body and to be a day of recreation after their travels and labors that hae been the six days before, and use it accordingly: whereas, the Lord has appointed it to the exercise of Word and prayer, that being unburdened of their worldly affairs, they might with free hearts and minds attend upon the Word, prayer, and meditation…. Thus the right use and end of the Sabbath is clean altered, and not that only, but changed into a practice most contrary to the institution thereof. For being appointed to be… the market day of the soul, to make provision for the days following…</p></blockquote>

<blockquote><p>…that we remember especially to put all things in practice which we have learned out of the Word, and that we begin upon that very day to do all duties of love unto men, and that we show mercy vnto them then especially. Whereunto that we might be made the more fit, the whole worship of God, and the Sabbath itself is ordained, in so much that the Lord would have every whit of it to cease even upon the Sabbath, rather than mercy should not be showed to the full, or any duty of it neglected to our brethren, when both of them cannot be done together, as we have seen it before more at large.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2d93779576" data-kw="">
<blockquote><p>Indeed no one can sufficiently deplore the lot of the Christian church in those ages, when such barbarous words were used for the explanation of Christian doctrines, and every thing was so wrapped up in obscure questions, that a period of nine years was not enough for the proper understanding of the single preface of Scotus to Lombard, and when the most futile and even impious questions were discussed, to the neglect of scripture.

This was the reason why the wisest Reformers of the church have entirely banished the Scholastic Theology from its territories; together with its curious, vain, and often impious questions, and devoted themselves entirely to the exposition of God’s word. Nevertheless, after the example of the schoolmen, or following rather the method of those who teach the arts and sciences, they were willing to reduce Theology to certain rules, and that with the greatest propriety; but then the divinity which they taught, was not derived from Aristotle and Plato, but from those purer sources – the sacred writings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), vii-viii.</span></figcaption>

<blockquote><p>God is incomprehensible, because it is said in Jeremiah: if the heavens above can be measured, and the foundations of the earth below can be explored, then I will cast off all the descendants of Israel (Jer 31:37).

I answer that in one sense, to comprehend means to enclose, as a house comprehends us; in another sense, it means to attain and hold.

In the first sense he is incomprehensible, because he cannot be enclosed in a created intellect, since he is most simple and because you do not know or love him to the degree that he is knowable and loveable, as a person who does not know a truth by demonstration but by opinion does not know it as perfectly as it can be known. But God knows himself, as far as he is knowable. The reason for this is that a thing is known according to the mode of its own being and truth. God, however, is infinite light and truth, whereas our light is finite.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super ad Philipenses</cite>, C. 3, L. 2, 127.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-5d4f703ef3" data-kw="">
<blockquote><p>Why have any religion at all? Is it not enough to have a good, sensible philosophy?” No. If this had been enough, clericalism would have been driven to the wall long ago. The experiment has been thoroughly tried in France for eighty years, and has failed. The power of the priesthood tends to increase, and the superstitions of the Roman church grow worse and worse.

No doubt atheism in its various forms — materialism, pantheism, positivism has advanced and spread; but the bourgeoisie — the bulk of the well-to-do citizens — have a horror and dread of atheism, and by this very fact are impelled to support the only church they know of; and so superstition is made fashionable. “Man cannot live by bread alone.” All his higher cravings are famished when he attempts to subsist only on what he can find in atheism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-woolsey-bacon.html">Leonard Woolsey Bacon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s Wonderful Work in France: An Introduction of the Deputation from the Protestants of France to the American Churches</cite>, (New York: American Tract Society, 1880), pp 17-18.</span></figcaption>

<blockquote><p>A further point to make about cause and effect is that whatever is in some effect must in some way or other be in the cause, even if not always in the same way. For a cause cannot give what it does not have to give. This is sometimes called the principle of proportionate causality. Suppose, for example, that I give you $20. The effect in this case is your having the $20, and I am the cause of this effect. But the only way I can cause that effect is if I have the $20 to give you in the first place. Now there are several ways in which I might have it. I might have a $20 bill in my wallet, or two $10 bills, or four $5 bills. Or I may have no money in my wallet, but do have $20 in my bank account and write you a check. Or I may not even have that, but I am able to borrow the $20 from someone else, or work for it, so that I can go on to give it to you. Or perhaps I have a friend who has a key to the U.S. Treasury printing press and I get him to run off an official $20 bill for me to give to you. Or to take an even more farfetched scenario, suppose that in order to guarantee that you get that $20 I somehow convince Congress to pass a law which permits me personally to manufacture my own $20 bills. These are all various ways in which I might in theory give you $20. But if none of these ways are available to me, then I can’t do it. Again, these are different ways in which the cause may have what is in the effect. When I myself have a $20 bill ready to hand and I cause you to have it, what is in the effect was in the cause formally, to use some traditional jargon. That is to say, I myself was an instance of the form or pattern of having a $20 bill, and I caused you to become another instance of that form or pattern. When I don’t have the $20 bill ready to hand but I do have at least $20 credit in my bank account, you might say that what was in the effect was in that case in the cause virtually. For though I didn’t actually have the $20 on hand, I did have the power to get hold of it. And when I get Congress to grant me the power to manufacture $20 bills, you might say (once again to use some traditional jargon) that I had the $20 eminently. Because in that case, I not only have the power to acquire already existing $20 bills, but the more “eminent” power of causing them to exist in the first place. When it is said, then, that what is in an effect must in some way be in its cause, what is meant is that it must be in the cause at least “virtually” or “eminently” even if not “formally”. … These things [namely all things] thereby exist in that purely actual cause eminently and virtually even if not formally. For the cause of things is not itself a cat or a tree (and cannot be, given that it is immaterial), but it can cause a cat or a tree, or anything else that might exist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Proofs of the Existence of God</cite>, (Ignatius, 2017), ch. 1, The Aristotelian Proof, pp. 32-34</span></figcaption>

+I+don%E2%80%99t+have+the+%2420+bill+ready+to+hand+but+I+do+have+at+least+%2420+credit+in+my+bank+account%2C+you+might+say+that+what+was+in+the+effect+was+in+that+case+in+the+cause+virtually.+For+though+I+didn%E2%80%99t+actually+have+the+%2420+on+hand%2C+I+did+have+the+power+to+get+hold+of+it.+And+when+I+get+Congress+to+grant+me+the+power+to+manufacture+%2420+bills%2C+you+might+say+%28once+again+to+use+some+traditional+jargon%29+that+I+had+the+%2420+eminently.+Because+in+that+case%2C+I+not+only+have+the+power+to+acquire+already+existing+%2420+bills%2C+but+the+more+%E2%80%9Ceminent%E2%80%9D+power+of+causing+them+to+exist+in+the+first+place.+When+it+is+said%2C+then%2C+that+what+is+in+an+effect+must+in+some+way+be+in+its+cause%2C+what+is+meant+is+that+it+must+be+in+the+cause+at+least+%E2%80%9Cvirtually%E2%80%9D+or+%E2%80%9Ceminently%E2%80%9D+even+if+not+%E2%80%9Cformally%E2%80%9D.+%E2%80%A6+These+things+%5Bnamely+all+things%5D+thereby+exist+in+that+purely+actual+cause+eminently+and+virtually+even+if+not+formally.+For+the+cause+of+things+is+not+itself+a+cat+or+a+tree+%28and+cannot+be%2C+given+that+it+is+immaterial%29%2C+but+it+can+cause+a+cat+or+a+tree%2C+or+anything+else+that+might+exist.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+Five+Proofs+of+the+Existence+of+God%2C+%28Ignatius%2C+2017%29%2C+ch.+1%2C+The+Aristotelian+Proof%2C+pp.+32-34&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F79ad5176e7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/79ad5176e7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-particular-metaphysical-issues/#:~:text=A%20further%20point%20to%20make%20about,or%20anything%20else%20that%20might%20exist&amp;text=A%20further%20point%20to%20make%20about%20cause%20and&amp;text=a%20tree%2C%20or%20anything%20else%20that%20might%20exist" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

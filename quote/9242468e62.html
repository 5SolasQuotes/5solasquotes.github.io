<main class="wrap"><figure class="quote" id="q-9242468e62" data-kw="">
<blockquote><p>Lordship is God’s having absolute right and power to, and over all his creatures, and disposing thereof according to his will, 1 Sam. 3:18; 1 Tim. 6:13; Mt. 20:15; Dan. 4:25. Absolute Soveraignty is due unto God by four titles: Of Creation, Rom. 9:20; Of Conservation, Heb. 1:3; To give the creature to continue in being is more than merely to give it being: as the shadow depends upon the body, so the creature depends upon the Creator. Of Redemption, 1 Cor. 6:20; this exceeds both the former. Of the Last End, Prov. 16:4. The end of the creature is the manifestation of the glory of the Creator. Lordship is in God after the most eminent manner: He has subjects of Himself, authority of Himself, Legislative Power of Himself. He appoints the rule with recompence to the obedient, and punishment to the disobedient according to his mere good pleasure. He is his own rule, his will is the most absolute reason. He gives no account of his matters, Job 33:13. Every creature depends essentially and universally upon the Creator: that is, the creature cannot be, but it must be at the disposing of God. We do not acknowledge ourselves to be creatures, nor God to be Lord, if his pleasure be not acknowledged to be a sufficient and satisfactory reason, of whatsoever He does. The Lordship of God is of Himself, not by occupation, as a title of property arising from a thing found without an owner; nor by donation, succession, purchase or conquest, as created lordships are. All created jurisdiction descends from this absolute Lordship of God. The jurisdiction that Christ as man received from God is universal over all the creatures respectively, Mt. 28:18. The jurisdiction of other men is limited according to the several objects thereof: whether ecclesiastical, where their authority and office is immediately received from Christ though the designation of such persons to such offices be by the call of men. Or civil, whether natural, as parent, and child: Or voluntary, as magistrate and subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, ... (London: Macock, 1654), ch. 1, Of the Divine Essence, pp. 11-12</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a8ae778da8" data-kw="">
<blockquote><p>Before the foundation of the world, by sheer grace, according to the free good pleasure of his will, God chose in Christ to salvation a definite number of particular people out of the entire human race, which had fallen by its own fault from its original innocence into sin and ruin. Those chosen were neither better nor more deserving than the others, but lay with them in the common misery. God did this in Christ, whom he also appointed from eternity to be the mediator, the head of all those chosen, and the foundation of their salvation. And so God decreed to give to Christ those chosen for salvation, and to call and draw them effectively into Christ’s fellowship through the Word and Spirit. In other words, God decreed to grant them true faith in Christ, to justify them, to sanctify them, and finally, after powerfully preserving them in the fellowship of the Son, to glorify them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 7</span></figcaption>

</figure><figure class="quote" id="q-a88fa34175" data-kw="">
<blockquote><p>William Alexander of Duntocher [a congregationalist professor], to whom he wrote about [William] White’s [of Haddington] unfavorable judgment [of Candlish’s work on the Atonement], decidedly approved of his positions, told the lecturer [Candlish] so, and won his gratitude. It may have been the case that the leaning in the direction of Supralapsarianism which readers have detected in the Fatherhood [of God, by Candlish] may account for the welcome that Alexander gave the book. For he was a very definite Supralapsarian at the same time as he was a very militant Calvinist. These two of Candlish’s friends were divines of good standing.</p></blockquote>

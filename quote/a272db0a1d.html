</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0fa862c215" data-kw="">
<blockquote><p>As for the Sanquhar declaration [1680], in so far as it denies the king’s authority and declares a war against him, it is a mere madness… it is no Christian duty to debate about these and the like things, and for such causes to raise a schism. Oh how sad is it that so many do place godliness in maintaining the Sanquhar declaration, and in separating from them who in their judgment are not so zealous in these or other circumstances. I admonish them to cease from these and such like courses, if they be lovers of Christ and his cause and love not their own bodily and spiritual ruin. I pray therefore, do not make such feckless things grounds of schism; do not I pray stain piety with such a blot. Why do you sport with God, religion and the church? Leave things of the state to statesmen. Leave off such debates; God’s anger is kindled against Scotland; do not kindle it more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Maurice Grant, Preacher to the Remnant</cite>, (Blue Banner Productions, 2009), pp. 140-41</span></figcaption>

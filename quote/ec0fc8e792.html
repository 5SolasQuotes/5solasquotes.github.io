<blockquote><p>He [Paul] calls Epaphroditus his ‘fellow labourer,’ in regard of the pains he endured; and ‘fellow soldier,’ in regard of the perils and dangers he jointly did undergo with the apostle. The doctrine that hence arises is, that ministers are fellow-labourers. They are not, or should not be, fellow-loiterers, as many are. No. The Scriptures compares them to the most painful and laborious professions; to husbandmen, whose labour is circular, every year renewing as the year doth renew. Such is the ministers’ labour, converting and strengthening others.

It is a great labour to break the shell of the word; to lay open the right interpretation thereof; to divide it aright; to convert a soul; to preserve it from the devil. It is as the peril of women in travail; ‘My little children, of whom I travail in birth till Christ be formed in you,’ saith Paul our apostle in Gal. iv. 19. Idle people are therefore unjust esteemers and judgers of the pains of ministers, they knowing it is out of their proper element.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Providence of God</cite>, (1639) in Alexander B. Grossart (ed.), The Works of Richard Sibbes (1862-64; 7 vols, Edinburgh: Banner of Truth, 1977), 5: 37.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cac2629ee6" data-kw="">
<blockquote><p>…and came with his family to Broad Oak… and did not preach for a great while… expecting that God would yet open a door of return to former public liberty, which he much desired and prayed for; and in hopes of that, was backward to fall into the stated exercise of his ministry otherwise, as were all the sober nonconformists generally in those parts, but it was his grief and burden that he had not an opportunity of doing more for God. He has scarce one talent of opportunity, but that one he was very diligent and faithful in the improvement of… ‘I own myself a minister of Christ, yet do nothing as a minister. What will excuse me? Is it enough for me to say, ‘Behold I stand in the market-place, and no man has hired me?’ And he comforts himself with this appeal; ‘Lord, Thou knowest what will I have to thy work, public or private, if I had a call and opportunity. And shall this willing mind be accepted?’… In these circumstances of silence and restraint… It is obvious, he writes, to observe at four several times, and upon four several occasions, ministers have been silenced and turned out of their places; and yet still, after a time, more or less restored again.

1. In Queen Mary’s days, because they would not close with Popery at the return of it. But that interdict lasted under five years, being taken off upon Queen Elizabeth’s coming to the throne.

2. In Queen Elizabeth’s, King James’s and King Charles’s days, because they could not conform to the hierarchy and ceremonies; and this interdict lasted long, even till the long Parliament, A.D. 1640; but it was then taken off.

3. Under the long Parliament many ministers were sequestered and silenced for malignancy and not covenanting [under the Solemn League and Covenant, 1643; Philip Henry did not hold to the SL&amp;C].

4. Many others, after the King’s death [1649], for not engaging to be true to the Commonwealth [under Oliver Cromwell, 1649-1658], as then established; both which restraints, though much remitted before, yet quite ceased at the coming in of the King [Charles II], A.D. 1660. And now more ministers are silenced, and with more severity than ever, by the Act of August 24 [1662]. And who among us can tell for how long? This only I know, ‘He who hath delivered, doth deliver.’ Script. March 31, 1663.</p></blockquote>

</figure><figure class="quote" id="q-2634f09faa" data-kw="">
<blockquote><p>But we may observe that the principles laid down in the criminal law are founded upon so much wisdom, that it is a question whether the departure from them in punishing crimes has ever been attended with advantage. As for example, in regard to violence—the law of retaliation—an eye for an eye, a tooth for a tooth—in theft and fraud—restitution—and the punishment of adultery with death.</p></blockquote>

</figure><figure class="quote" id="q-334fed19c1" data-kw="">
<blockquote><p>From which memorable history there are these considerable observations naturally deducible. First, that Apostates from God’s true Worship to Idolatry and false Worship, are to be executed, slain, and put to death by the Judges and Civil Magistrate, by God’s own special Command. Secondly, that the Apostacy of God’s own people to Idolatry, and the Magistrates connivance thereat, is an immediate cause of provoking God’s wrath, and bringing down public plagues and other judgements upon that whole Nation or Kingdom wherein they are not punished.

Thirdly, that God’s own immediate punishing and cutting off Idolaters with a plague, is no argument nor excuse at all for the temporal Magistrates sparing or not punishing such with death (whose execution is here said to be &amp; styled God’s own act, since they are but his Ministers herein) but rather an argument to excite them to the more speedy exemplary punishing of them even with death itself: which answers and repels one grand objection against punishing Heretics, and Blasphemers with death, because God himself will punish them if they repent not, and we must wholly leave them to his judgement.

Fourthly, that the best and speediest course to remove God’s judgements brought upon a Nation for Idolatry, Apostacy, Heresy, or Blasphemy, is for the temporal Magistrates to execute speedy and exemplary capital punishments on those who are notoriously guilty of them; and that fasting and prayer without such exemplary executions upon the most eminent Malefactors in this kind, will never pacify God’s wrath, nor remove his judgements inflicted for these sins.

Fifthly, that the executing of capital punishments upon such, is an argument of true zeal to GOD: And therefore it seems strange to me, that those in this age, who pretend themselves the only Saints, Zealots, faithful ones, paramount all others by head and shoulders in grace and piety, should be so void of Christian zeal for God, as to plead, preach, write, and print against the corporal and capital Punishment or Apostates, Idolaters, Heretics, and Blasphemers by temporal Magistrates, and for a free Toleration of all Sects, Heresies, and Religions whatsoever, under the pretence of Liberty of Conscience:

Certainly this extreme want of holy zeal for God against Apostates, Idolaters, Heretics; Blasphemers, and pleading for their impunity, at least with capital Censures, argues them to be no real Saints, because they have no true love to, nor zeal for God, which would make them as forward to thrust their Javelins, or the sword of Justice through the Bowels of such transcendent offenders, as Phineas was to thrust his Javelin through Zimri and Cozbi, without any question or dispute.

Sixthly, that the exemplary capital punishing of such, is so far from being a persecution of the Saints, or against the Clemency of God under the Law or Gospel, that it is a most acceptable service to God, and procures a special Blessing upon the persons and posterities of those who are most zealous and active in this service, as appears by this example of Phineas, registered for his eternal honour and our future imitation and encouragement in this kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The sword of Christian magistracy supported, or, A vindication of the Christian magistrate’s authority under the Gospel, to punish idolatry, apostacy, heresy, blasphemy, and obstinate schism, with corporal, and in some cases with capital punishments</cite>, (London: John Bellamy, 1653), pp 8-9.</span></figcaption>

Thirdly, that God’s own immediate punishing and cutting off Idolaters with a plague, is no argument nor excuse at all for the temporal Magistrates sparing or not punishing such with death (whose execution is here said to be &amp; styled God’s own act, since they are but his Ministers herein) but rather an argument to excite them to the more speedy exemplary punishing of them even with death itself: which answers and repels one grand objection against punishing Heretics, and Blasphemers with death, because God himself will punish them if they repent not, and we must wholly leave them to his judgement.

Fourthly, that the best and speediest course to remove God’s judgements brought upon a Nation for Idolatry, Apostacy, Heresy, or Blasphemy, is for the temporal Magistrates to execute speedy and exemplary capital punishments on those who are notoriously guilty of them; and that fasting and prayer without such exemplary executions upon the most eminent Malefactors in this kind, will never pacify God’s wrath, nor remove his judgements inflicted for these sins.

Fifthly, that the executing of capital punishments upon such, is an argument of true zeal to GOD: And therefore it seems strange to me, that those in this age, who pretend themselves the only Saints, Zealots, faithful ones, paramount all others by head and shoulders in grace and piety, should be so void of Christian zeal for God, as to plead, preach, write, and print against the corporal and capital Punishment or Apostates, Idolaters, Heretics, and Blasphemers by temporal Magistrates, and for a free Toleration of all Sects, Heresies, and Religions whatsoever, under the pretence of Liberty of Conscience:

Certainly this extreme want of holy zeal for God against Apostates, Idolaters, Heretics; Blasphemers, and pleading for their impunity, at least with capital Censures, argues them to be no real Saints, because they have no true love to, nor zeal for God, which would make them as forward to thrust their Javelins, or the sword of Justice through the Bowels of such transcendent offenders, as Phineas was to thrust his Javelin through Zimri and Cozbi, without any question or dispute.

Sixthly, that the exemplary capital punishing of such, is so far from being a persecution of the Saints, or against the Clemency of God under the Law or Gospel, that it is a most acceptable service to God, and procures a special Blessing upon the persons and posterities of those who are most zealous and active in this service, as appears by this example of Phineas, registered for his eternal honour and our future imitation and encouragement in this kind.”

— William Prynne, The sword of Christian magistracy supported, or, A vindication of the Christian magistrate’s authority under the Gospel, to punish idolatry, apostacy, heresy, blasphemy, and obstinate schism, with corporal, and in some cases with capital punishments, (London: John Bellamy, 1653), pp 8-9.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFrom+which+memorable+history+there+are+these+considerable+observations+naturally+deducible.+First%2C+that+Apostates+from+God%E2%80%99s+true+Worship+to+Idolatry+and+false+Worship%2C+are+to+be+executed%2C+slain%2C+and+put+to+death+by+the+Judges+and+Civil+Magistrate%2C+by+God%E2%80%99s+own+special+Command.+Secondly%2C+that+the+Apostacy+of+God%E2%80%99s+own+people+to+Idolatry%2C+and+the+Magistrates+connivance+thereat%2C+is+an+immediate+cause+of+provoking+God%E2%80%99s+wrath%2C+and+bringing+down+public+plagues+and+other+judgements+upon+that+whole+Nation+or+Kingdom+wherein+they+are+not+punished.%0A%0AThirdly%2C+that+God%E2%80%99s+own+immediate+punishing+and+cutting+off+Idolaters+with+a+plague%2C+is+no+argument+nor+excuse+at+all+for+the+temporal+Magistrates+sparing+or+not+punishing+such+with+death+%28whose+execution+is+here+said+to+be+%26+styled+God%E2%80%99s+own+act%2C+since+they+are+but+his+Ministers+herein%29+but+rather+an+argument+to+excite+them+to+the+more+speedy+exemplary+punishing+of+them+even+with+death+itself%3A+which+answers+and+repels+one+grand+objection+against+punishing+Heretics%2C+and+Blasphemers+with+death%2C+because+God+himself+will+punish+them+if+they+repent+not%2C+and+we+must+wholly+leave+them+to+his+judgement.%0A%0AFourthly%2C+that+the+best+and+speediest+course+to+remove+God%E2%80%99s+judgements+brought+upon+a+Nation+for+Idolatry%2C+Apostacy%2C+Heresy%2C+or+Blasphemy%2C+is+for+the+temporal+Magistrates+to+execute+speedy+and+exemplary+capital+punishments+on+those+who+are+notoriously+guilty+of+them%3B+and+that+fasting+and+prayer+without+such+exemplary+executions+upon+the+most+eminent+Malefactors+in+this+kind%2C+will+never+pacify+God%E2%80%99s+wrath%2C+nor+remove+his+judgements+inflicted+for+these+sins.%0A%0AFifthly%2C+that+the+executing+of+capital+punishments+upon+such%2C+is+an+argument+of+true+zeal+to+GOD%3A+And+therefore+it+seems+strange+to+me%2C+that+those+in+this+age%2C+who+pretend+themselves+the+only+Saints%2C+Zealots%2C+faithful+ones%2C+paramount+all+others+by+head+and+shoulders+in+grace+and+piety%2C+should+be+so+void+of+Christian+zeal+for+God%2C+as+to+plead%2C+preach%2C+write%2C+and+print+against+the+corporal+and+capital+Punishment+or+Apostates%2C+Idolaters%2C+Heretics%2C+and+Blasphemers+by+temporal+Magistrates%2C+and+for+a+free+Toleration+of+all+Sects%2C+Heresies%2C+and+Religions+whatsoever%2C+under+the+pretence+of+Liberty+of+Conscience%3A%0A%0ACertainly+this+extreme+want+of+holy+zeal+for+God+against+Apostates%2C+Idolaters%2C+Heretics%3B+Blasphemers%2C+and+pleading+for+their+impunity%2C+at+least+with+capital+Censures%2C+argues+them+to+be+no+real+Saints%2C+because+they+have+no+true+love+to%2C+nor+zeal+for+God%2C+which+would+make+them+as+forward+to+thrust+their+Javelins%2C+or+the+sword+of+Justice+through+the+Bowels+of+such+transcendent+offenders%2C+as+Phineas+was+to+thrust+his+Javelin+through+Zimri+and+Cozbi%2C+without+any+question+or+dispute.%0A%0ASixthly%2C+that+the+exemplary+capital+punishing+of+such%2C+is+so+far+from+being+a+persecution+of+the+Saints%2C+or+against+the+Clemency+of+God+under+the+Law+or+Gospel%2C+that+it+is+a+most+acceptable+service+to+God%2C+and+procures+a+special+Blessing+upon+the+persons+and+posterities+of+those+who+are+most+zealous+and+active+in+this+service%2C+as+appears+by+this+example+of+Phineas%2C+registered+for+his+eternal+honour+and+our+future+imitation+and+encouragement+in+this+kind.%E2%80%9D%0A%0A%E2%80%94+William+Prynne%2C+The+sword+of+Christian+magistracy+supported%2C+or%2C+A+vindication+of+the+Christian+magistrate%E2%80%99s+authority+under+the+Gospel%2C+to+punish+idolatry%2C+apostacy%2C+heresy%2C+blasphemy%2C+and+obstinate+schism%2C+with+corporal%2C+and+in+some+cases+with+capital+punishments%2C+%28London%3A+John+Bellamy%2C+1653%29%2C+pp+8-9.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F334fed19c1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/334fed19c1.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/11/05/william-prynne-on-the-civil-magistrates-duty-to-punish-offenders-against-the-first-table/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

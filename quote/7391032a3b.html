<main class="wrap"><figure class="quote" id="q-7391032a3b" data-kw="">
<blockquote><p>IT is a great, as well as a true Observation, which I have read in a Learned Man; namely, That all the many various Attributes of God mentioned in the Scripture, are no other than his very Essence, and are ascribed to him to help us in our Conceptions and Understandings of Him, who are not able to apprehend what may be known of God, under any one Name or Notion, or by any one Act of the Intellect.

We read (you know) of his Power, his Wisdom, his Holiness, his Justice, his Goodness, his Faithfulness, his All-sufficiency, and the like, all which are not distinguished in him, either from himself, or from one another, but are all one and the same God revealed and manifested to us, under various notions, and that to help us the better to conceive and apprehend him, as also to perform our homage and worship to him; accordingly we may say, the Holiness of God, is God; the Wisdom of God, is God; the Power of God, is God; the Goodness of God, is God:

And to come to my Text, the Unchangeableness of God, is God; and indeed the unchangeableness of God, is God manifested and revealed under a sweet and blessed, as well as a glorious Notion to us, under such a Notion as conduces-much to the quickening and encouraging of our Faith and Love, our Comfort and Obedience in him, and to him; and so indeed the Text represents it, I am the Lord, I change not, therefore ye Sons of Jacob are not consumed: …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-pearse.html">Edward Pearse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A beam of divine glory, or, The unchangeableness of God opened, vindicated, and improved: whereunto is added, The soul’s rest in God. By Edward Pearse. To which is prefixed the author’s last letter, written in the time of his sickness to some peculiar friends</cite>, (London: Jonathan Robinson, 1674), pp 1-3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god.html">Attributes of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3bc4224d2d" data-kw="">
<blockquote><p>I hope I need not caution some in this assembly that they beware of imagining these various perfections of God, under the names of mercy, truth, righteousness and peace, as if they were really distinct and different things in God; or, as if they were really different parties, making a formal consultation, in order, to their agreement; For God is one, and cannot be divided; he is one infinite, eternal and unchangeable Being; there are not distinct and different things in his nature and essence, however his perfections be thus represented to our weak, finite capacities, which cannot understand the perfections of God but in several parts, as it were.

By mercy then, here, we are to understand God himself, as he is a merciful and a gracious God: By truth we are to understand the same God, as he is a true and faithful God: By righteousness we may understand his justice, or God himself, as he is a just and righteous God; and, by peace, the same God, as he is the God of peace, and a God reconciling the world to himself. So that the whole comes to this; it is the great and eternal God himself, consulting with himself, in a manner becoming his infinite and adorable perfections, how to glorify himself in all his glorious attributes in the way of saving sinners in and by Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The harmony of the divine attributes displayed; in the redemption &amp; salvation of sinners by Jesus Christ. Being a sermon preached at Dunfermline on the 20th of September 1723; immediately after the celebration of the Lord’s Supper</cite>, (1723; Boston: S. Kneeland and T. Green, 1748), p. 6.</span></figcaption>

</figure><figure class="quote" id="q-cdf2b964bf" data-kw="decretive preceptive">
<blockquote><p>Although the will in God is only one and most simple, yet because it is occupied differently about various objects, it may be apprehended as manifold. The first and principal distinction is that of the decretive and preceptive will. The former means that which God wills to do or permit himself; the latter what he wills that we should do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.15.1–2</span></figcaption>

</figure><figure class="quote" id="q-821a5bc8f0" data-kw="">
<blockquote><p>38. Hence the will of God is the first cause of things. Rev. 4:11, ‘By thy will they are, and were created.’ But the will of God, as it wills to work outwardly, does not presuppose the goodness of the object, but by willing does make the object. James 1:18, ‘Because He would, He begat us.’ Rom. 9:18, ‘He hath mercy on whom He will.’

39. Therefore there is no cause properly so called to be given of God’s will.

40. Hence it is rightly said that God does will one thing to exist for another: but not that that one thing is a proper cause whereby the will of God is inwardly moved to appoint that other thing. So God would that the sun and stars should exist, for the generation, conservation and corruption of things below: yet the sun and stars are not a cause why God would that those things should be generated, conserved and corrupted. And so it is in all things out of God, which indeed among themselves are causes and effects, even as they depend upon the divine will, but there is no cause of God’s will out of itself.

41. Also the willing of one thing in God is not properly a cause effecting that He will another thing in Himself, because the efficiency of a cause upon an effect, and dependance of the effect upon a cause, cannot be in the will of God, which is God Himself, truly and simply willing all things together and at once, with one only act; yet it is true that the Schoolmen say that a passive attingency of the divine will in respect of one thing is a cause of a passive attingency in respect of another: and so in this sense it is truly and piously said that God wills some one thing because He wills another.

42. Therefore although He wills many things which will not follow but upon some antecedent act of the creature, yet the very act of willing in God does not properly depend as a consequent thing upon the act of the creature. Neither is it lawful under the appellation of an ‘antecedent will’ to give unto God that imperfect will which is called velleitas, a ‘woulding’ in the schools. For it does not agree to an omniscient, omnipotent and infinitely, blessed Nature.

43. Wherefore that opinion which determines that God does will something antecedently to the act of the creature, which same thing afterwards He wills not towards them, but wills another thing, is not to be admitted: because it makes the will of God mutable and depending upon the act of the creature, so that as often as the act of the creature is changed, so often also it is changed.

44. By that opinion also, that form of speech prescribed in the Word of God wherein we commit ourselves and all ours to God, as ‘I will do this or that if God will,’ [Jm. 4:15] should not be used in all things, but [rather, it is by that opinion] turned contrarily, ‘God will do this or that, if man will.’

45. This will determines of all things, greatest, least, contingent, necessary, free, without exception…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Sacred Divinity Drawn out of the Holy Scriptures, and the Interpreters thereof, and brought into Method</cite>, ... (d. 1633; London: Griffin, 1642), bk. 1, ch. 7, Of the Decree &amp; Counsel of God, pp. 32-33</span></figcaption>

+said+that+God+wills+some+one+thing+because+He+wills+another.+42.+Therefore+although+He+wills+many+things+which+will+not+follow+but+upon+some+antecedent+act+of+the+creature%2C+yet+the+very+act+of+willing+in+God+does+not+properly+depend+as+a+consequent+thing+upon+the+act+of+the+creature.+Neither+is+it+lawful+under+the+appellation+of+an+%E2%80%98antecedent+will%E2%80%99+to+give+unto+God+that+imperfect+will+which+is+called+velleitas%2C+a+%E2%80%98woulding%E2%80%99+in+the+schools.+For+it+does+not+agree+to+an+omniscient%2C+omnipotent+and+infinitely%2C+blessed+Nature.+43.+Wherefore+that+opinion+which+determines+that+God+does+will+something+antecedently+to+the+act+of+the+creature%2C+which+same+thing+afterwards+He+wills+not+towards+them%2C+but+wills+another+thing%2C+is+not+to+be+admitted%3A+because+it+makes+the+will+of+God+mutable+and+depending+upon+the+act+of+the+creature%2C+so+that+as+often+as+the+act+of+the+creature+is+changed%2C+so+often+also+it+is+changed.+44.+By+that+opinion+also%2C+that+form+of+speech+prescribed+in+the+Word+of+God+wherein+we+commit+ourselves+and+all+ours+to+God%2C+as+%E2%80%98I+will+do+this+or+that+if+God+will%2C%E2%80%99+%5BJm.+4%3A15%5D+should+not+be+used+in+all+things%2C+but+%5Brather%2C+it+is+by+that+opinion%5D+turned+contrarily%2C+%E2%80%98God+will+do+this+or+that%2C+if+man+will.%E2%80%99+45.+This+will+determines+of+all+things%2C+greatest%2C+least%2C+contingent%2C+necessary%2C+free%2C+without+exception%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+The+Marrow+of+Sacred+Divinity+Drawn+out+of+the+Holy+Scriptures%2C+and+the+Interpreters+thereof%2C+and+brought+into+Method%2C+...+%28d.+1633%3B+London%3A+Griffin%2C+1642%29%2C+bk.+1%2C+ch.+7%2C+Of+the+Decree+%26+Counsel+of+God%2C+pp.+32-33&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F821a5bc8f0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/821a5bc8f0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=38.%20Hence%20the%20will%20of%20God,least%2C%20contingent%2C%20necessary%2C%20free%2C%20without%20exception&amp;text=38.%20Hence%20the%20will%20of%20God%20is%20the&amp;text=things%2C%20greatest%2C%20least%2C%20contingent%2C%20necessary%2C%20free%2C%20without%20exception" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6e87035f18" data-kw="">
<blockquote><p>The power of God in its second meaning, δύναμις (dunamis) in Greek, and potentia in Latin, refers to the power and strength of God whereby He is able to execute and accomplish everything which is in agreement with His character and His truth—also to create whatever is conceivable and to do whatever He wishes to do. From stones He is able to raise up children unto Abraham (Matthew 3:9), that is, to create human beings from a lump of clay as He did in the beginning, and make such human beings partakers of both the faith and life of Abraham. God could even create thousands of worlds. In a word, God’s power is unlimited.

One could imagine the creation of many things which would be contrary to the nature and truth of God. One could speculate about imaginary things which bear no resemblance to a creature. To relate this to the omnipotence of God and to ask whether God would be able to perform such things, is to entertain thoughts about God which are void of reverence and godly fear. Whatever is contradictory to the nature and truth of God, as well as contrary to the essential nature of a creature, is no reflection upon the power of God. Far be it from us to attribute this to the omnipotent and holy God. “Far be it from God, that He should do wickedness; and from the Almighty, that He should commit iniquity” (Job 34:10).

God can neither deny Himself (2 Timothy 2:13), nor can He lie or deceive (Titus 1:2). “It was impossible for God to lie” (Hebrews 6:18). Even though God has eternally been capable of creating a world, it does not follow that the world could have existed eternally. “Yes” and “no” are at all times opposites and cannot be simultaneous realities. One and the same body, one and the same man, cannot be simultaneously present at many places which are far removed from each other. These and a thousand-fold more things do not appertain to omnipotence.

Nevertheless, we maintain that God by His omnipotence is able to accomplish whatever He will even beyond what He has willed, as well as whatever He would will. His arm is not shortened and therefore He is called the Almighty. “I am the Almighty God” (Genesis 17:1); “When the Almighty was yet with me” (Job 29:5); “… saith the Lord Almighty” (2 Corinthians 6:18).</p></blockquote>

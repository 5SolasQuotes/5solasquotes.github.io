<main class="wrap"><figure class="quote" id="q-da6a422848" data-kw="sabbath partly moral ceremonial">
<blockquote><p>Whether the first institution of the Sabbath was in the fourth commandment; and whether the commandment is partly moral, partly ceremonial. The former we deny; the latter we affirm. The true derivation of the word is from the verb shbhth (i.e., “to cease” or “to rest”), which relates either to the existence of a thing, when it ceases to be and fails, or to the operation of an agent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.13.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/first-table-commandments-1-4.html">First Table (Commandments 1-4)</a> › <a href="../topics/the-law-of-god/first-table-commandments-1-4/fourth-commandment-sabbath.html">Fourth commandment (Sabbath)</a></span><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a> › <a href="../topics/worship/the-lords-day/sabbath.html">Sabbath</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-99848ae32d" data-kw="">
<blockquote><p>The phrase that follows, “before my face,” makes the offense more heinous because God is provoked to jealousy as often as we substitute our own inventions in place of him. This is like a shameless woman who brings in an adulterer before her husband’s very eyes only to vex his mind the more.… Therefore, when God by his present power and grace testified that he kept watch over the people whom he had chosen, he warned them—to keep them even more from the crime of rebellion—that they could introduce no new gods without his witnessing and observing their sacrilege.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.8.16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/first-table-commandments-1-4.html">First Table (Commandments 1-4)</a> › <a href="../topics/the-law-of-god/first-table-commandments-1-4/first-commandment.html">First commandment</a></span><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-e635632681" data-kw="">
<blockquote><p>Q. What does the LORD require in the first commandment? A. That for the sake of my very salvation I avoid and flee all idolatry, witchcraft, superstition, and prayer to saints or to other creatures. Further, that I rightly come to know the only true God, trust in him alone, submit to him with all humility and patience, expect all good from him only, and love, fear, and honour him with all my heart. In short, that I forsake all creatures rather than do the least thing against his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Catechism</cite>, Q. 94</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/first-table-commandments-1-4.html">First Table (Commandments 1-4)</a> › <a href="../topics/the-law-of-god/first-table-commandments-1-4/first-commandment.html">First commandment</a></span><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-db215012fe" data-kw="Lord&#x27;s day apostolic institution">
<blockquote><p>Others ascend to a divine ordination, so that either Christ himself may be said to have immediately and expressly instituted that day, which Junius holds and some others with him; or mediately only inasmuch as the apostles inspired of God sanctioned it in the Christian church by precept, example and their own practice. This is the more common opinion of the orthodox and to this we adhere.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.14.3</span></figcaption>

</figure><figure class="quote" id="q-aff4a3ff44" data-kw="">
<blockquote><p>Not only the covetous, but the unclean, are idolaters; for the apostle, who here makes covetousness to be idolatry, counts voluptuous persons idolaters also, where he speaks of some who make their belly their God, Philip. 3. Indeed, every reigning lust is an idol, and every person in whom it reigns is an idolater. ‘The lust of the flesh, the lust of the eye, and the pride of life,’ i.e. pleasures, and riches, and honours, are the carnal man’s trinity, the three great idols of worldly men, to which they prostrate their souls; and giving that to them which is due only to God, they hereby become guilty of idolatry.… Idolatry is … to give that honour and worship to the creature which is due only to God.… Now this worship due to God only is not only given by heathens to their false gods, and by papists to angels, saints, images, &amp;c., but also by carnal men to their lusts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Soul Idolatry Excludes Men Out of Heaven</cite>, on Eph. 5:5 (Practical Works)</span></figcaption>

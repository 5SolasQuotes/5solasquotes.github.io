<main class="wrap"><figure class="quote" id="q-b62827812f" data-kw="">
<blockquote><p>The Apostle Peter declares that baptism “saves us by the resurrection of Jesus Christ” (1 Pet. 3:21). Not by its own efficacy, therefore, but as the emblem of what has been done by Christ’s redemption, whose “resurrection” is one of the constituent factors in it. And in order to preclude the notion that the mere application of water has any spiritual effect like that of regenerating the soul, the apostle explains that baptism does not “save by the putting away of the filth of the flesh,” but by “the answer of a good conscience toward God.” The “answer of a good conscience” is its pacification through the atonement of Christ for sin, to which baptism has reference.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/w-g-t-shedd.html">W. G. T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dogmatic Theology</cite>, on 1 Pet. 3:21</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3aa24a2f4e" data-kw="">
<blockquote><p>Baptism is a profession of faith in the Father, and the Son, and the Holy Spirit; not of a faith to be obtained through the ordinance, but of a faith already entertained. When the Eunuch applied to Philip for baptism, he said: “If thou believest with all thine heart thou mayest.” Of those who heard Peter’s sermon on the day of Pentecost it is said, “they that gladly received his word were baptized.” (Acts 2:41.) On this point, however, there can be no dispute. The only way in which Romanists and Romanizers evade this argument, is by denying that faith and repentance are the fruits of the Spirit, or of regeneration. They are in their view not gracious, but natural works, works done before regeneration; works which leave the soul in a state of perdition. But in this they contradict the express words of Christ, who says, whosoever believes shall be saved. And, in contradicting Christ, they contradict the whole Bible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, “Efficacy of Baptism”</span></figcaption>

</figure><figure class="quote" id="q-ff93b48a27" data-kw="">
<blockquote><p>Hence Romanists and Ritualists have inferred that the sign is inseparable from the grace signified, and that these spiritual effects are due to the outward ordinance. Hence the doctrine of baptismal regeneration. But it must be observed that the Scriptures do not assert these spiritual attributes of water baptism in itself considered, but of water baptism as the sign or emblem of baptism by the holy Ghost. These spiritual attributes belong only to baptism by the Spirit, and they accompany the sign only when the sign is accompanied by that which it signifies. It does not follow, however, that the sign is inseparable from the grace. The grace is sovereign; and experience teaches us that it is often absent from the sign, and that the sign is least frequently honoured by the presence of the grace when it is itself most implicitly relied upon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, chs. 27–28 (on baptismal regeneration)</span></figcaption>

</figure><figure class="quote" id="q-b945658aed" data-kw="">
<blockquote><p>The first, the most obvious, and the most decisive argument against this doctrine is, that, so far as any work or act of the sinner is concerned, the Bible everywhere teaches that the only indispensable condition of salvation is faith in Jesus Christ.… Whosoever believes on the Son hath everlasting life. This stands firm. It matters not to what Church he may belong; it matters not whether he be Jew or Gentile, bond or free, learned or unlearned, good or bad, baptized or unbaptized, whosoever believes shall be saved.… Neither does the Bible anywhere teach that Christian baptism effects either pardon or regeneration in those still out of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, “Direct Arguments against the Doctrine of Baptismal Regeneration”</span></figcaption>

</figure><figure class="quote" id="q-305c2b20cb" data-kw="">
<blockquote><p>Christ does not retain both members of the first proposition in that which stands in opposition to the promise; he merely says: “He that believeth not, shall be damned.” Christ makes this distinction, because there is not the same necessity for faith and baptism to salvation. Faith is absolutely necessary to salvation, so that no one can be saved without it: for “without faith it is impossible to please God.” (Heb. 11:6.) But the sacraments are necessary when they may be observed according to divine appointment. Contempt of the sacraments under such circumstances, is inconsistent with faith. This is the reason why Christ promises salvation to those that believe and are baptized, keeping in view the distinction which is here made. Yet he does not deny salvation to those who are deprived of this sacrament. … The word extends to all; the sacraments only to such as believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, on Mark 16:16 (the necessity of baptism)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-306e0b1b7b" data-kw="">
<blockquote><p>My Lords and Gentlemen, — You know that the wisest prince that ever sat upon a throne hath told us that ‘righteousness exalts a nation,’ Prov. xiv. 34. It is not valour in war, but righteousness; it is not policy in government, but righteousness; it is not wittiness of invention, but righteousness; it is not civility in behaviour, but righteousness; it is not antiquity of forms, but righteousness; it is not largeness of dominion, but righteousness; nor it is not greatness of command, but righteousness, that is the honour and the safety, that is the renown and the security of a nation. That nation that exalts righteousness, that nation shall be certainly exalted by righteousness, Amos v. 24.

It is not Ahithophel’s policy, it is not Jeroboam’s calves in Dan and Bethel, it is not Jehu’s pompous zeal, it is not Goliath’s sword, it is not rich mines of gold and silver, nor magazines, nor armies, nor councils, nor fleets, nor forts, but justice and righteousness that exalts a nation, and that will make a mean people to become a great, a glorious, and a famous people in the world. The world is a ring, and righteousness is the diamond in that ring: the world is a body, and righteousness and justice is the soul of that body.

Ah! England, England! so long as judgment runs down as waters in the midst of thee, and righteousness as a mighty stream, thou shalt not die, but live and bear up bravely against all gainsayers and opposers; but if injustice shall grow rampant, and thou shalt brandish the sword of justice in the behalf of the friends of Baal, Balaam, and Bacchus, and turn the wheel upon the righteous; if the sword of justice shall be a sword of protection to the desperate swearer, and to the cruel oppressor, and to the roaring drunkard, and to the cursing monster, and to the gospel despiser, and to the Christ contemner, &amp;c., and shall be a devouring sword to the upright and peaceable in the land, divine vengeance will dig thy grave, and divine justice will tumble thee into it, though all the nations of the earth should labour to prevent it.

It is a base and ignoble spirit, to pity Cataline more than to pity Rome; to pity any particular sort of men, more than to pity the whole. It is cruelty to the good, to justify the bad: it is wrong to the sheep, to animate the wolves: it is danger if not death to the lambs, not to restrain or chain up the lions. But from all these vanities the Lord deliver all your souls!

And oh that you would for ever remember this, that as the constitution of a man’s body is best known by his pulse: if it stir not at all, then we know he is dead; if it stir violently, then we know him to be in a fever; if it keep an equal stroke, then we know he is sound, well, and whole: so the estate and constitution of a kingdom or commonweal is best known by the manner of executing justice therein; for justice is the pulse of a kingdom.

If justice be violent, then the kingdom is in a fever, in a very bad estate; if it stir not at all, then the kingdom is dead; but if it have an equal stroke, if it be justly and duly administered, then the kingdom is in a good, a safe, and sound condition. When Vespasian asked Apollonius what was the cause of Nero’s ruin, he answered, that Nero could tune the harps well, but in government: he did always wind up the strings too high, or let them down too low.</p></blockquote>

<blockquote><p>He that smiteth his Father or Mother, shall die the death. This is an other law in this Chap. which maketh for the exposition of that Commandment of honouring them, &amp; is to be referred to it. We may note in it, how God doth not say, he that killeth Father or Mother shall be killed for it; but he that smiteth, so that not so much as a tip is to be given to parents upon pain of death, no not with the tong may we smite them, that is, by any evil and unfit words abuse them, as you may at large read in the exposition of that Commandment. So great is the honour of Parents before God, and so sharp a Judge is God against all abusers of them: Little thought of by too many in our days, &amp; the rather because continually in the Church there is not a beating of these points of Catechism into Children’s heads, and hearts, by careful Ministers.

O, that they would be once drawn to do this duty in their several Churches: Soon, soon should they find the Fruit of it, and the greatness of their Sin in so long neglecting it. In Plato an heathen we read the like law, wherein is decreed that all beating and contumelies of Parents should be punished with perpetual banishment and death. By the Roman laws the slayer of his parents was not to be slain either with sword or fire, or other ordinary punishment, sed in sutus culeo, &amp;c. sowed in a sack with a Dog, a Cock, a Viper, and an Ape, he should be thrown into the Sea or River, that the ayre whilst he lived, and the earth when he was dead might be denied him, who so had wronged them that gave him a life and being in the air and upon the earth. A good Writer testifieth he saw one put to death at Tigurine who had cursed and reviled his Mother.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Comfortable notes upon the books of Exodus and Leviticus, as before upon Genesis Gathered and laid down still in this plain manner, for the good of them that cannot use better helps, and yet are careful to read the Scriptures, and very desirous to find the comfort in them. … With a table of the prin</cite>, (London: Thomas Chard, 1604), pp 333-34.</span></figcaption>

<blockquote><p>…but this apostle earnestly invites us to judge and examine ourselves, and showeth to the Corinthians that if we judged ourselves, we should not be judged of the Lord with his temporal plagues; as infirmities, sickness, and temporal death (1 Cor. 11:30,38), by which the Lord did chastise the Corinthians, for not judging and examining themselves before they did eat of the Lord’s body.</p></blockquote>

</figure><figure class="quote" id="q-8afa0a0b0e" data-kw="">
<blockquote><p>In this detestation of Christ towards Satan, for uttering blasphemy against his father, in his challenge to have power to dispose of all the kingdoms of the world as being his own; we are taught, not only to grieve at such blasphemies as we shall hear uttered against God, but to testified our detestation and indignation towards them. The world is full of black mouthed Rabshekas, who will not spare to blaspheme the glorious name of our God, &amp; to scoff &amp; deride his sacred word: now when we meet with such, we must not be like Stoics without affection, but in Christian wisdom from bleeding hearts for the reproach of God, shew forth godly zeal and indignation for the rescue of his glory.

The Hypocritical practise of wicked Jezabel in proclaiming a fast upon the false accusation of Naboth’s blasphemy against God and the king, may teach God’s Church to be zealous indeed against all blasphemers. When Rabsheka railed on the God of Israel, good king Hezekiah rent his clothes, and humbled himself in great measure for that reproach against his God. Tears were David’s meat day and night, while the heathen among whom he was constrained to live, said unto him where is thy God? And just Lot vexed his righteous soul from day to day with the unlawful deeds of the filthy Sodomites, living among them.

The practise of these godly men must be a president [precedent] for us to follow, that we hear no blasphemy against God without detestation. And as all God’s children must practise this duty, so especially Masters of families: David would not suffer a liar or a slanderer to come in his sight, or to abide in his house; much less would he have endured a blasphemer of God, or a slanderer of his word. The law commanded that the blasphemer should be stoned to death, who wittingly and willingly spake a word against God; and no doubt this law is perpetual.

Let a man but speak a word of disgrace against an earthly prince, and it costs him his life, and that justly: how much more then should he die the death though he had a thousand lives, that shall blaspheme the king of kings? Shall one that hath been baptized into the name of Christ, say there is no God, and that the Scriptures are but a device of man, and yet live? God forbid, for this hellish sin defiles a kingdom. And therefore the Magistrate with the sword of justice must cry out against such wretches, Away from us blasphemers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The combat between Christ and the Devil displayed: or A commentary upon the temptations of Christ</cite>, (London: Melchizedek Bradwood, 1606), pp 42-43.</span></figcaption>

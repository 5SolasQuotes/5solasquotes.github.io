<blockquote><p>In matters fundamental, as the profession of faith must be entire in all points of simple belief, so must the doctrine of the Church in all things concerning practice: but errors of inferior alloy, wherein godly men dissent pardonably one from another, both concerning faith and practice, may be found and maintained in the true Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Friendly Trial of the Grounds tending to Separation</cite>, … ([Cambridge:] Daniel, 1640), ch. 11, p. 228</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-2ac0a9a91f" data-kw="">
<blockquote><p>…whatsoever a man holds, though his conscience be never so much taken with it, yet if it cannot stand with the power of godliness, but destroys it, if this man be in a Christian society after all means used to reduce him, if he still perseveres in it, he is, notwithstanding his conscience, to be cast out of the society of the saints; This is not a little matter, if a man has any conscience in him, it cannot but be a dreadful thing to him: If poison be got into a glass, and you cannot wash it out, the poison and glass too is to be thrown into the sink: Such a man as this is, with the conscience that he has, is to be thrown upon the dunghill. If a man by his wickedness cuts himself off from the mystical body of Christ, the Church may cut him off from his visible, he has forfeited his Church-priviledge.</p></blockquote>

<blockquote><p>§5. But we find the ancient Fathers with a holy zeal, charging such as apostates from the Church and breakers of her peace, who held opinions contrary to the essential and fundamental, or any of the great articles of the Christian Faith, so that they placed the unity of the catholic Church in a harmonious consent to these great truths. Irenaeus ([Against Heresies] bk. 1, ch. 3, p. 53, edition Cologne, 1625), having given a short account of the chief articles of the true religion, has these words: hanc igitur praedicationem, et hanc ••dem adepta Ecclesia, quamvis dispersa in universo mundo, diligenter conservat, a• si in una eademque domo habitaret, ac similiter iis fidem habet, ac si unam animam unumque et idem cor haberet; atque un• consensu hoc praedicat, docet ac tradit, ac si uno ore praedita esset. Quamvis enim dissimilia sunt in mundo genera linguarum, una tamen et eadem est vis traditionis; nec quae constitutae sunt in Germania Ecclesiae aliter credunt; nec quae in Hispania, neque in Galliis; neque in Oriente, neque in Aegypto, neque in Lybia, aut in medio Orbis terrarum fundatae sunt, sed quemadmodum Sol Creatura Dei unus et idem est in universo Mundo; ita &amp; praedicatio veritatis ubiquae lucet, &amp; illuminat eos qui ad notionem veritatis venire volunt. Eusebius (Ecclesiastical History, bk. 4, ch. 27) cites Irenaeus condemning Tatianus, the author of the sect of the Encratitae, and saying of him, [Greek], he reckoned his opinions a falling from the Church, or a breaking her unity. The same Historian, bk. 4, ch. 24, gives account of Egesippus narrating, how long the Church remained a virgin, teaching and believing nothing but the Law and the prophets, and what the Lord Himself taught, and he mentions particularly the Churches of Corinth, Rome and Jerusalem; and then shows how heresies arose, whose authors he calls false Christs, false prophets and false apostles, and of them he says, [Greek],they divided the unity of the Church by their corrupt doctrines against God, and against his Christ. Several other citations might be brought to this purpose, but these may be sufficient. I do not question but that there might be other things which might be called schism, even with respect to the universal Church, as if any should bring in idolatrous, or superstitious worship, contrary to the rules of the Gospel, or should violate any of the necessary and laudable canons of General Councils, and should set up societies in opposition, not only to one or few, but to all the societies of Christians, or all the soundest of them… §6. There is another sort of unity much regarded among the ancients, which though the breach of it had as bad influence on all, or most Churches, and so on the catholic Church: yet it properly respected neighbor Churches, either which were united by the bond of one government, a provincial, or lesser synod, being made up of them: or only living in the vicinity of one another, or having frequent occasion of correspondence; they who were not under any uniting bonds, but these commune to all the parts of the catholic Church, yet had an unity of kind correspondence, mutual assistance, as occasion offered, acquainting one another with their affairs so far as it was of any advantage: admitting the members of other Churches to communion with them on occasion, refusing communion with such members of other Churches as were by them excommunicated: and this unity was then broken when these acts of friendship were shunned or refused, especially when they who were cast out by one were received to another: or when occasional communion was either shuned by them who so joined in another Church or denied to such sojourners if they desired it: or when one Church showed rage, fury and bitterness against another because of what they differed about.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, (Edinburgh: Anderson, 1697), sect. 10, ‘Of Schism’ Rule was a Scottish, divine-right presbyterian minister., pp. 250-52</span></figcaption>

n%2C+teaching+and+believing+nothing+but+the+Law+and+the+prophets%2C+and+what+the+Lord+Himself+taught%2C+and+he+mentions+particularly+the+Churches+of+Corinth%2C+Rome+and+Jerusalem%3B+and+then+shows+how+heresies+arose%2C+whose+authors+he+calls+false+Christs%2C+false+prophets+and+false+apostles%2C+and+of+them+he+says%2C+%5BGreek%5D%2Cthey+divided+the+unity+of+the+Church+by+their+corrupt+doctrines+against+God%2C+and+against+his+Christ.+Several+other+citations+might+be+brought+to+this+purpose%2C+but+these+may+be+sufficient.+I+do+not+question+but+that+there+might+be+other+things+which+might+be+called+schism%2C+even+with+respect+to+the+universal+Church%2C+as+if+any+should+bring+in+idolatrous%2C+or+superstitious+worship%2C+contrary+to+the+rules+of+the+Gospel%2C+or+should+violate+any+of+the+necessary+and+laudable+canons+of+General+Councils%2C+and+should+set+up+societies+in+opposition%2C+not+only+to+one+or+few%2C+but+to+all+the+societies+of+Christians%2C+or+all+the+soundest+of+them%E2%80%A6+%C2%A76.+There+is+another+sort+of+unity+much+regarded+among+the+ancients%2C+which+though+the+breach+of+it+had+as+bad+influence+on+all%2C+or+most+Churches%2C+and+so+on+the+catholic+Church%3A+yet+it+properly+respected+neighbor+Churches%2C+either+which+were+united+by+the+bond+of+one+government%2C+a+provincial%2C+or+lesser+synod%2C+being+made+up+of+them%3A+or+only+living+in+the+vicinity+of+one+another%2C+or+having+frequent+occasion+of+correspondence%3B+they+who+were+not+under+any+uniting+bonds%2C+but+these+commune+to+all+the+parts+of+the+catholic+Church%2C+yet+had+an+unity+of+kind+correspondence%2C+mutual+assistance%2C+as+occasion+offered%2C+acquainting+one+another+with+their+affairs+so+far+as+it+was+of+any+advantage%3A+admitting+the+members+of+other+Churches+to+communion+with+them+on+occasion%2C+refusing+communion+with+such+members+of+other+Churches+as+were+by+them+excommunicated%3A+and+this+unity+was+then+broken+when+these+acts+of+friendship+were+shunned+or+refused%2C+especially+when+they+who+were+cast+out+by+one+were+received+to+another%3A+or+when+occasional+communion+was+either+shuned+by+them+who+so+joined+in+another+Church+or+denied+to+such+sojourners+if+they+desired+it%3A+or+when+one+Church+showed+rage%2C+fury+and+bitterness+against+another+because+of+what+they+differed+about.%E2%80%9D%0A%0A%E2%80%94+Gilbert+Rule%2C+The+Good+Old+Way+Defended+%28Edinburgh%3A+Anderson%2C+1697%29%2C+sect.+10%2C+%E2%80%98Of+Schism%E2%80%99+Rule+was+a+Scottish%2C+divine-right+presbyterian+minister.%2C+pp.+250-52&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffb1b6b0eac.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fb1b6b0eac.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=5.%20But%20we%20find%20the%20ancient,because%20of%20what%20they%20differed%20about&amp;text=5.%20But%20we%20find%20the%20ancient%20Fathers%20with&amp;text=against%20another%20because%20of%20what%20they%20differed%20about" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

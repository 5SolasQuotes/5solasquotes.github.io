</figure><figure class="quote" id="q-f6d80689e0" data-kw="">
<blockquote><p>Uncovering of the head: Though this last be not adoration, but a national sign of reverence, and is not every where adoration; yet Abulensis says, the Jews did pray and sacrifice with covered heads: So says Virgil, and Lod. Vives: Therefore the Corinthians had this from the Grecians as a civil sign of gravity, which should not be banished from God’s worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646)</cite>, ch. 1, p. 144</span></figcaption>

</figure><figure class="quote" id="q-af173113bb" data-kw="">
<blockquote><p>1. The text [1 Cor. 11:16] gives him [Anglican bishop Andrewes] no ground for this doctrine… that the custom of the Church should be enough to us in matters of ceremony… for the custom of the Church there spoken of is not concerning a point of circumstance, but concerning a very substantial and necessary point, namely, not to be contentious: neither does the apostle urge those orders of the men’s praying uncovered and the women’s praying veiled from this ground, because so was the Church’s custom (as the bishop would have it), but only he is warning the Corinthians not to be contentious about those matters, because the churches have no such custom as to be contentious. So is the place expounded by Chrysostom, Ambrose, Calvin, Martyr, Bullinger, Marlorat, Beza, Fulke, Cartwright, Pareus… And for this exposition it makes that the apostle in the preceding part of the chapter has given sufficient reasons for that order of covering or veiling the women: wherefore if any would contend about the matter, he tells them they must contend with themselves, for they (nor the churches of God) would not contend with them: they had no such custom. … 2. The custom of the Church is not enough to pitch on, and it is found oftentimes expedient to change a custom of the Church. Basil the Great does flatly refuse to admit the authority of custom: Consuetudo sine veritate [Custom without truth], says Cyprian, vetustas erroris est [is an old thing erring]. Frustra enim qui ratione vincuntur, says Augustine, consuetudinem nobis objiciunt, quasi consuetudo major sit veritate, etc. Nullus pudor est ad meliora transire, says Ambrose to the Emperour Valentinian: Quaelibet consuetudo [Any custom], says Gratian, veritati est postponenda [ought to be put after the truth]. And again: Corrigendum est quod illicite admittitur, aut a praedecessoribus admissum invenitur. A politic writer admonishes, retinere antiqua [retain that which is ancient], only with this caution: Si proba [if it is proved]. Calvin (speaking against human ceremonies) says: Si objiciatur, etc. ‘If’, says he, ‘antiquity be objected (albeit they who are too much addicted to custom and to received fashions, do boldly use this buckler to defend all their corruptions), the refutation is easy: For the ancients also themselves with heavy complaints have abundantly testified that they did not approve of anything which was devised by the will of men.’ In the end of the epistle he alleges this testimony of Cyprian: ‘If Christ alone be to be heard, then we ought not to give heed what any man before us has thought fit to be done, but what Christ (who is before all) has done, for we must not follow the custom of man, but the truth of God.’ What can be more plain than that antiquity cannot be a confirmation to error, nor custom a prejudice to truth?… 3. …If then it be enough to pitch upon custom, why ought not those customs to have been commended and continued? But if they were commendably changed, then ought we not to follow blindly the bare custom of the Church, but examine the equity of the same, and demand grounds of reason for it. St. Paul (says Dr. Fulke) does give reasons for that order of covering women’s heads: By whose example the preachers are likewise to endeavor to satisfy by reason both men and women, that humbly desire their resolution for quiet of their conscience, and not to beat them down with the club of custom only. 4. Whereas the custom of some churches is alleged for the ceremonies, we have objected the custom of other churches against them: Neither shall ever our opposites prove them to be the customs of the Church universal. … 6. If it were so that we ought to pitch upon the Churches custom, yet (that I may speak with Mr. [Richard] Hooker) the law of common indulgence permits us to think of our own customs as half a thought better than the customs of others. But why was there such a change made in the discipline, policy and orders of the Church of Scotland, which were agreeable to the Word of God, confirmed and ratified by general assemblies and parliaments, used and enjoyed with so great peace and purity? Our custom should have holden the ceremonies out of Scotland, hold them in elsewhere as it may.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637) | 3rd Part, ‘Against the Lawfulness of the Ceremonies’</cite>, ch. 6, pp. 104-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

— George Gillespie, English Popish Ceremonies (1637) | 3rd Part, ‘Against the Lawfulness of the Ceremonies’, ch. 6, pp. 104-6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+The+text+%5B1+Cor.+11%3A16%5D+gives+him+%5BAnglican+bishop+Andrewes%5D+no+ground+for+this+doctrine%E2%80%A6+that+the+custom+of+the+Church+should+be+enough+to+us+in+matters+of+ceremony%E2%80%A6+for+the+custom+of+the+Church+there+spoken+of+is+not+concerning+a+point+of+circumstance%2C+but+concerning+a+very+substantial+and+necessary+point%2C+namely%2C+not+to+be+contentious%3A+neither+does+the+apostle+urge+those+orders+of+the+men%E2%80%99s+praying+uncovered+and+the+women%E2%80%99s+praying+veiled+from+this+ground%2C+because+so+was+the+Church%E2%80%99s+custom+%28as+the+bishop+would+have+it%29%2C+but+only+he+is+warning+the+Corinthians+not+to+be+contentious+about+those+matters%2C+because+the+churches+have+no+such+custom+as+to+be+contentious.+So+is+the+place+expounded+by+Chrysostom%2C+Ambrose%2C+Calvin%2C+Martyr%2C+Bullinger%2C+Marlorat%2C+Beza%2C+Fulke%2C+Cartwright%2C+Pareus%E2%80%A6+And+for+this+exposition+it+makes+that+the+apostle+in+the+preceding+part+of+the+chapter+has+given+sufficient+reasons+for+that+order+of+covering+or+veiling+the+women%3A+wherefore+if+any+would+contend+about+the+matter%2C+he+tells+them+they+must+contend+with+themselves%2C+for+they+%28nor+the+churches+of+God%29+would+not+contend+with+them%3A+they+had+no+such+custom.+%E2%80%A6+2.+The+custom+of+the+Church+is+not+enough+to+pitch+on%2C+and+it+is+found+oftentimes+expedient+to+change+a+custom+of+the+Church.+Basil+the+Great+does+flatly+refuse+to+admit+the+authority+of+custom%3A+Consuetudo+sine+veritate+%5BCustom+without+truth%5D%2C+says+Cyprian%2C+vetustas+erroris+est+%5Bis+an+old+thing+erring%5D.+Frustra+enim+qui+ratione+vincuntur%2C+says+Augustine%2C+consuetudinem+nobis+objiciunt%2C+quasi+consuetudo+major+sit+veritate%2C+etc.+Nullus+pudor+est+ad+meliora+transire%2C+says+Ambrose+to+the+Emperour+Valentinian%3A+Quaelibet+consuetudo+%5BAny+custom%5D%2C+says+Gratian%2C+veritati+est+postponenda+%5Bought+to+be+put+after+the+truth%5D.+And+again%3A+Corrigendum+est+quod+illicite+admittitur%2C+aut+a+praedecessoribus+admissum+invenitur.+A+politic+writer+admonishes%2C+retinere+antiqua+%5Bretain+that+which+is+ancient%5D%2C+only+with+this+caution%3A+Si+proba+%5Bif+it+is+proved%5D.+Calvin+%28speaking+against+human+ceremonies%29+says%3A+Si+objiciatur%2C+etc.+%E2%80%98If%E2%80%99%2C+says+he%2C+%E2%80%98antiquity+be+objected+%28albeit+they+who+are+too+much+addicted+to+custom+and+to+received+fashions%2C+do+boldly+use+this+buckler+to+defend+all+their+corruptions%29%2C+the+refutation+is+easy%3A+For+the+ancients+also+themselves+with+heavy+complaints+have+abundantly+testified+that+they+did+not+approve+of+anything+which+was+devised+by+the+will+of+men.%E2%80%99+In+the+end+of+the+epistle+he+alleges+this+testimony+of+Cyprian%3A+%E2%80%98If+Christ+alone+be+to+be+heard%2C+then+we+ought+not+to+give+heed+what+any+man+before+us+has+thought+fit+to+be+done%2C+but+what+Christ+%28who+is+before+all%29+has+done%2C+for+we+must+not+follow+the+custom+of+man%2C+but+the+truth+of+God.%E2%80%99+What+can+be+more+plain+than+that+antiquity+cannot+be+a+confirmation+to+error%2C+nor+custom+a+prejudice+to+truth%3F%E2%80%A6+3.+%E2%80%A6If+then+it+be+enough+to+pitch+upon+custom%2C+why+ought+not+those+customs+to+have+been+commended+and+continued%3F+But+if+they+were+commendably+changed%2C+then+ought+we+not+to+follow+blindly+the+bare+custom+of+the+Church%2C+but+examine+the+equity+of+the+same%2C+and+demand+grounds+of+reason+for+it.+St.+Paul+%28says+Dr.+Fulke%29+does+give+reasons+for+that+order+of+covering+women%E2%80%99s+heads%3A+By+whose+example+the+preachers+are+likewise+to+endeavor+to+satisfy+by+reason+both+men+and+women%2C+that+humbly+desire+their+resolution+for+quiet+of+their+conscience%2C+and+not+to+beat+them+down+with+the+club+of+custom+only.+4.+Whereas+the+custom+of+some+churches+is+alleged+for+the+ceremonies%2C+we+have+objected+the+custom+of+other+churches+against+them%3A+Neither+shall+ever+our+opposites+prove+them+to+be+the+customs+of+the+Church+universal.+%E2%80%A6+6.+If+it+were+so+that+we+ought+to+pitch+upon+the+Churches+custom%2C+yet+%28that+I+may+speak+with+Mr.+%5BRichard%5D+Hooker%29+the+law+of+common+indulgence+permits+us+to+think+of+our+own+customs+as+half+a+thought+better+than+the+customs+of+others.+But+why+was+there+such+a+change+made+in+the+discipline%2C+policy+and+orders+of+the+Church+of+Scotland%2C+which+were+agreeable+to+the+Word+of+God%2C+confirmed+and+ratified+by+general+assemblies+and+parliaments%2C+used+and+enjoyed+with+so+great+peace+and+purity%3F+Our+custom+should+have+holden+the+ceremonies+out+of+Scotland%2C+hold+them+in+elsewhere+as+it+may.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29+%7C+3rd+Part%2C+%E2%80%98Against+the+Lawfulness+of+the+Ceremonies%E2%80%99%2C+ch.+6%2C+pp.+104-6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf173113bb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af173113bb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/head-coverings-in-public-worship/gillespie-rutherford-on-headcoverings-in-public-worship/#:~:text=1.%20The%20text%20%5B1%20Cor.%2011%3A16%5D,them%20in%20elsewhere%20as%20it%20may." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

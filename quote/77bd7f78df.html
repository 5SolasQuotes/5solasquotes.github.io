<main class="wrap"><figure class="quote" id="q-77bd7f78df" data-kw="">
<blockquote><p>It is assumed that this is not a mere party work for the purposes of mere partyism. Few deny, that, throughout all the Departments of the Church, a reform is needed in her Psalmody. The subject now advocated is a solemn institution of the Church of God, authorized by her standards, and the main points of which, now advocated, are sustained by many, if not by all, of the ablest men of her several denominations.

The argument is not a little sectional one, but a plea upon the broad ground of Christian institution, for Christian consistency, truth, and influence, in a deeply interesting part of the solemnities of Zion. In the sustentation of the plea, the voice of some of the most distinguished men of the Presbyterian, Episcopal, and Baptist, families of the great Christian commonwealth, is distinctly heard.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-mcmaster.html">Gilbert McMaster</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Book of Psalms, in Five Letters; Addressed to the Friends of Union in the Church of God</cite>, (1818; 4th edn, Philadelphia: Daniels &amp; Smith, 1852), v-vi.</span></figcaption>

</figure><figure class="quote" id="q-e7b83c6949" data-kw="">
<blockquote><p>Prayer of any sort is either mental or vocal… The latter goes outside the mind… Song is added to this. “Be full of the Spirit, speaking to one another with Psalms (also through musical instruments, which psallontai are mentioned), hymns (songs of whatever sort), and spiritual songs (constant in singing), singing the Psalms in your heart to the Lord” (Eph. 5:19; Col. 3:16). Some prayer is sudden, while some is premeditated and composed, and those either conceived or prescribed. Some are private, solitary or domestic, others are public, ordinary or extraordinary.</p></blockquote>

</figure><figure class="quote" id="q-b63324ff26" data-kw="">
<blockquote><p>Had the Psalms been scattered throughout the books of the Old Testament, instead of being collected into one Book, then it might have been fairly inferred that the people of God were left to sing all the songs contained in the sacred writings— the songs of Moses, Deborah, Hannah, &amp;c., as well as those composed by David, Asaph, and others, and now found in the Psalter.

But infinite Wisdom in preparing a Psalm Book for His Church, thought proper to leave out the song of Moses at the Red Sea, of Deborah, of Hannah, and other songs, and who will say that it was a fault, and that God ought to have incorporated these songs with the “Sepher Tehillim,” or Book of Praises?

How can Mr. C. [Thomas Smyth] say, as he often does in substance, that the Church is as much hound to sing those Divine songs which have been left out of the Psalter, as those contained in it? If so, why were they left out? Their omission was surely not an oversight in the Deity. It was His will that they should be omitted, and no man can say with propriety that they should not, and that the Church was, and is still bound to employ them in Divine worship, notwithstanding their exclusion from that standard of praise which God himself has provided.

It may be the songs of Moses, Deborah, and others, not found in the Book of Psalms, were sung in the stated worship of God previous to the compilation of that Book, but after the compilation was made, and they were omitted, it was no longer proper to employ them in the regular instituted service of the Temple-—else where was the propriety of God’s “taking order” in selecting a system of Psalmody, if, after the selection was made, every one had a right to add to it what ever he thought proper, and even those very songs which Infinite Wisdom thought wise to omit?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ramsey-hemphill.html">William Ramsey Hemphill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter IV. Psalmody – Divine Authority in Evangelical Guardian</cite></span></figcaption>

</figure><figure class="quote" id="q-541151c9b8" data-kw="">
<blockquote><p>Another thing God did towards this work at that time was His inspiring David to show forth Christ and His redemption in Divine songs, which should be for the use of the Church in public worship throughout all ages. … This was also a glorious advancement of the office of redemption, as God hereby gave His Church a book of divine songs for their use in that part of their public worship–viz., singing His praises throughout all ages to the end of the world. It is manifest the Book of Psalms was given of God for this end. … David is called the “sweet Psalmist of Israel” (II Sam. 23:1), because he penned Psalms for the use of the Church of Israel;… and we find the same are appointed in the New Testament to be made use of in their worship: ‘Speaking to yourselves in psalms and hymns and spiritual songs’ (Eph. 5:19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Jonathan Edwards</cite>, ed. Hickman in 2 vols. (London, 1834), vol. 1, History of Redemption, Period 1, Part 5, section IV, p. 554</span></figcaption>

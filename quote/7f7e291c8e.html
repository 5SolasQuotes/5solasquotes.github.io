<main class="wrap"><figure class="quote" id="q-7f7e291c8e" data-kw="">
<blockquote><p>To come nearer to the point in hand, we must know also that the heathen idolatrous holy days were turned into Christian, as Christ‘s Nativity was appointed to be kept, and hath long been generally observed on the very time and day, when Saturn’s idolatrous, riotous feast was solemnized, and in the room and imitation thereof, and therefore that time was anciently called Yule … as the heathens called it, and the mad, riotous, profane plays, and sports in Christmas time, Yule-games and Christmas Carols, sung in praise of Christ, as the heathens did the hymn … in honour of the idol Keres, that is Ceres, goddess of corn.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-mocket.html">Thomas Mocket</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christmas, The Christian’s grand feast: Its original, growth, and observation, also of Easter, Whitsontide, and other holy days modestly discussed and determined. Also the beginning of the year, and other things observable</cite>, (London: Richard Wodenoth, 1650), p. 5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2aa17737f1" data-kw="">
<blockquote><p>And it came to pass, as He went into the house of one of the chief Pharisees to eat bread on the sabbath day, that they watched Him… 7 And he put forth a parable to those which were bidden, when he marked how they chose out the chief rooms; saying unto them. 8 When thou art bidden of any man to a wedding, sit not down in the highest room; lest a more honourable man than thou be bidden of him… 12 Then said he also to him that bade him, When thou makest a dinner or a supper, call not thy friends, nor thy brethren, neither thy kinsmen, nor thy rich neighbours; lest they also bid thee again, and a recompence be made thee. 13 But when thou makest a feast, call the poor, the maimed, the lame, the blind… 15 And when one of them that sat at meat with him heard these things, he said unto him, Blessed is he that shall eat bread in the kingdom of God. 16 Then said he unto him, A certain man made a great supper, and bade many: 17 And sent his servant at supper time to say to them that were bidden, Come; for all things are now ready… 23 And the lord said unto the servant, Go out into the highways and hedges, and compel them to come in, that my house may be filled. 24 For I say unto you, That none of those men which were bidden shall taste of my supper.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lk. 14:1 7-8, 12-13, 15-17, 23-24</cite></span></figcaption>

</figure><figure class="quote" id="q-d473f1181c" data-kw="">
<blockquote><p>But if one avoid more ordinary communion with a church, as judging it, though not essentially defective, yet to want [lack] or err in some circumstances so considerable as that he counts [that] another church comes nearer the common Christian rule, the Holy Scriptures, and finds its administrations more conducing to his spiritual advantage; he may be led, by the judgment of his conscience, both, sometimes upon weighty and important reasons to communicate with the former [defective Church], and continue therein, according as those reasons shall continue urgent upon him; and yet, sometimes, as the cessant or diminished weight of such reasons shall allow, to communicate with the other [more spiritually advantageous church].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe</cite>, vol. 5, Containing the Treatises: On Divine Prescience &amp; the Trinity… (Religious Tract Society, 1863) Howe (1630-1705) was an English puritan and presbyterian theologian., pp. 275-76</span></figcaption>

<blockquote><p>…because there is no moral goodness imaginable, but it must have its essential form and being from a law or word of God; therefore all the former circumstances, as they are clothed with either moral conveniency and expediency, or with some religious positive goodness, must be warranted by the Word of God, or the rules of sinless and spiritual prudence, which cannot deviate from the Word of God: For circumstances clothed with religious positive goodness, such as are the Sabbath day, the Holy of Holiest, the Temple; these are not mere circumstances, but worship itself: So a religious habit, as an ephod or a surplice, is not a mere circumstance, or a mere habit, but a worship, or such a part or limb of worship as must be warranted by the Word of truth, else it is nothing but a will-device and a forgery, and so to be rejected.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646) | Introduction, p. 6</span></figcaption>

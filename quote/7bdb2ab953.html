<main class="wrap"><figure class="quote" id="q-7bdb2ab953" data-kw="">
<blockquote><p>What was then the sin of Peter in resuming the practice of the ceremonies there [in Galatians 2]? His sin was double. First, the abuse of his authority in the Church, for, that unawares by his example, he compelled the gentiles to the use of such ceremonies as himself saw liberty to forbear amongst them; and which having never been commanded by God to them, he had no power to impose on them. His other sin was the dissembling or concealing of his Christian Liberty which he should then have stood upon, when he saw the false teachers urge these ceremonies upon the gentiles as well as upon the Jews, to the prejudice of their Christian Liberty. When things that are indifferent are commanded to be done of necessity (as now all Popes, and prelates’ ceremonies are) then are not the same to be obeyed, because the same destroyes our freedom in Christ. The sum of all this will lead us by the hand one step farther, namely; if it be a sin in Church-governors to command (especially upon strict penalty) indifferent, decent things, it will be a sin also in ministers and in private Christians to subscribe ex animo [from the soul], and to yield obedience by conformity to such commands, although the ceremonies were as good (indeed) as they were pretended (which I believe they are not) indifferent-decent-things. For, does not such voluntary subscription and conforming to them build up our Church-governors, yea and with them (that which is most to be taken to heart of us, our soveraign civil governors also in the confidence) that such commandements are as well lawfully given by them, as received and obeyed, yea confirmed and allowed by us? Now to build up or edify a brother to sin, is properly to offend a brother; for the proper definition of an offence is that which edifies a brother unto sin, as the original word expresses it (1 Cor. 8:10), and so to sin against a brother, is to wound his conscience; yea, and as much as in us lies, to cause him to perish for whom Christ died; which is no better than spiritual murder of his soul. Now, if thus to edify any brother to sin be so heinous an offence, how much more heinous an offence is it to edify our governors to the giving and urging of such commandments, yea and to the sharp censuring of all others as refractory and factious persons, who choose rather to undergo the loss of the greatest comforts they enjoy in this world than to wound the consciences either of themselves or of their governours? It is true by forbearing obedience to those commandments we offend the spirits of our governors, and make them to be (though causelesly) offended with us; But by yielding obedience to these things we should offend their consciences in edifying them to sin, and provoke the Lord to be offended with them. Better they be offended with us, without fault, than through our fault God to be offended with them and us. It is not for Christians, much less for ministers, to redeem outward peace and liberty at so dear a price as the hazzard of the blood of so many precious souls, especially of our governors in highest place and authority. This was the author’s judgement with whom our martyr, Mr. William Tyndale concurs, in his Answer to Mr. Moore’s First Book, pp. 285-6. Our prelates ought to be our servants, as the apostles were, to teach us Christ’s doctrine, and not to Lord over us with their own, Peter called it tempting of the Holy Ghost, Acts 15[:10], to lade the heathen with ought but that which necessity and brotherly love requires, and Paul rebuking the Corinthians and Galatians for their over much obedience, warns all men to stand fast and not to suffer themselves to be brought into bondage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief, Pithy Discourse upon 1 Corinthians 14:40… (London, 1661)</cite>, pp. 13-14</span></figcaption>

<blockquote><p>VIII Rule. We must give place to the sway of the times wherein we live, so far forth as may stand with keeping faith and a good conscience. We may not be temporizers and change our religion with the times: but yet we may and must give place to times as we give place to the stream, so that it be done with keeping of true religion and good conscience. This rule was practiced by Paul… he was three years in Ephesus, an idolatrous place, where the great goddess Diana was worshipped; yet in all that time he contained himself and spake nothing in particular against Diana, but ony in general against false gods, saying that ‘they be no gods that are made with hands,’ v. 26. Nay, Alexander could not charge him with this, that he had in all that while blasphemed their goddess Diana. Paul therefore was feign to yield to the sway of those times that so he might do some good in Ephesus by his ministry. Whereas, if he had spoken against Diana directly, it had not been possible for him to have done that good by preaching which otherwise he did.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience (Cambridge. 1606), bk. 3, ch. 2</cite>, pp. 481-84</span></figcaption>

</figure><figure class="quote" id="q-83f4d58b1c" data-kw="">
<blockquote><p>And surely whatsoever ill consequences may appear upon obeying, they appear at more distance, but confusion and destruction come in presently upon disobeying. The commonwealth is presently put unto ungovernment and confusion by inobedience, or into sedition, civil war, yea destruction, by striving against a prevalent power. Therefore as that which has the less ill consequences, not ours only, but generally all nations have given obedience to power; and both sought and received laws and government from those that have overpowered them… And whereas some speak of a time for settlement, they indeed do rather speak for a time of unsettlement; for they will have an unsettlement first, and a settlement after. And whereas like does produce its like, yet they would have an unsettlement to beget a settlement. They would have confusion, distraction, destruction to bring forth order and safety.</p></blockquote>

<blockquote><p>Assertion 1 — Patient suffering of wicked men and violent resisting are not incompatible, but they may well stand together; so this [following] consequence is the basis of the [opponent’s] argument, and it is just nothing: to wit, servants are to suffer unjustly wounds and buffeting of their wicked masters, and they are to bear it patiently; therefore, servants are in conscience obliged to non-resistance. Now, Scripture makes this clear: 1. The Church of God is to bear with all patience the indignation of the Lord, because she has sinned, and to suffer of wicked enemies which were to be trodden as mire in the streets (Mic. 7:9-12); but withal, they were not obliged to non-resistance and not to fight against these enemies, yea, they were obliged to fight against them also. If these were Babylon, Judah might have resisted and fought if God had not given a special commandment of a positive law, that they should not fight; if these were the Assyrians and other enemies, or rather both, the people were to resist by fighting, and yet to endure patiently the indignation of the Lord. David did bear most patiently the wrong that his own son Absalom, and Ahitophel, and the people inflicted on him, in pursuing him to take his life and the kingdom from him, as is clear by his gracious expressions (2 Sam. 15:25-26; 16:10-12; Ps. 3:1-3); yea, he prays for a blessing on the people that conspired against him (Ps. 3:8); yet did he lawfully resist Absalom and the conspirators, and sent out Joab and a huge army in open battle against them (2 Sam. 18:1-4, etc.) and fought against them. And were not the people of God patient to endure the violence done to them in the wilderness by Og, king of Bashan; Sihon, king of Heshbon; by the Amorites, Moabites, etc.? I think God’s law ties all men, especially his people, to as patient a suffering in wars (Dt. 8:16). God then trying and humbling his people, as the servant is to endure patiently unjustly inflicted buffets (1 Pet. 2:18); and yet God’s people at God’s command did resist these kings and people, and did fight and kill them, and possess their land, as the history is clear. See the like Josh. 11:18-19.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Assertion 1 — Patient suffering of wicked men and violent resisting are not incompatible, but they may well stand together; so this [following] consequence is the basis of the [opponent’s] argument, and it is just nothing: to wit, servants are to suffer unjustly wounds and buffeting of their wicked masters, and they are to bear it patiently; therefore, servants are in conscience obliged to non-resistance. Now, Scripture makes this clear: 1. The Church of God is to bear with all patience the indignation of the Lord, because she has sinned, and to suffer of wicked enemies which were to be trodden as mire in the streets (Mic. 7:9-12); but withal, they were not obliged to non-resistance and not to fight against these enemies, yea, they were obliged to fight against them also. If these were Babylon, Judah might have resisted and fought if God had not given a special commandment of a positive law, that they should not fight; if these were the Assyrians and other enemies, or rather both, the people were to resist by fighting, and yet to endure patiently the indignation of the Lord. David did bear most patiently the wrong that his own son Absalom, and Ahitophel, and the people inflicted on him, in pursuing him to take his life and the kingdom from him, as is clear by his gracious expressions (2 Sam. 15:25-26; 16:10-12; Ps. 3:1-3); yea, he prays for a blessing on the people that conspired against him (Ps. 3:8); yet did he lawfully resist Absalom and the conspirators, and sent out Joab and a huge army in open battle against them (2 Sam. 18:1-4, etc.) and fought against them. And were not the people of God patient to endure the violence done to them in the wilderness by Og, king of Bashan; Sihon, king of Heshbon; by the Amorites, Moabites, etc.? I think God’s law ties all men, especially his people, to as patient a suffering in wars (Dt. 8:16). God then trying and humbling his people, as the servant is to endure patiently unjustly inflicted buffets (1 Pet. 2:18); and yet God’s people at God’s command did resist these kings and people, and did fight and kill them, and possess their land, as the history is clear. See the like Josh. 11:18-19.”

<blockquote><p>Mr. Ashcam… lays down four cases wherein he says subjects are freed from their sworn allegiance. His three first (viz: 1. If a prince abandon. 2. If he alienate. 3. If Nero-like through mad fury or folly, he seek in an hostile way the destruction of his whole kingdom) will I presume be taken not to concern our case in hand; the fourth possibly may be judged applicable to it… Fourthly, (says he) if the prince have part of the supreme right, and the people the other part, then notwithstanding an oath of allegiance to him, he may be opposed if he invade the other part of supreme right… And in the next section he says of all those four cases, and therefore of this, that they show how we are absolved in our own consciences from all oath and contract when one party forfeits his conditions first. The defensive opposing of a prince, invading his compeers’ part by the party invaded where the supreme right is so shared (supposing the oath of allegiance to be cautioned according to that sharing), I shall not dispute…</p></blockquote>

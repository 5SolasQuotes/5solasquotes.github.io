<main class="wrap"><figure class="quote" id="q-ca0fc6eac3" data-kw="">
<blockquote><p>The posture of kneeling in the receiving of this sacrament is a peculiar act of religious adoration, which hath no divine institution or warranty; and is therefore at best an act of will-worship, not to be complied withal.

It is said that “kneeling is required not as an act of worship or religious adoration; but only as a posture decent and comely, because the sacrament is delivered with a prayer unto every one.” But,—

(1.) That delivery of it with a prayer unto every one is uninstituted, without primitive example, contrary to the practice at the first institution of the ordinance, unsuited to the nature of the communion required, and a disturbance of it.

(2.) He that prays stands, and he that doth not pray kneels, which must be another consideration; for,—

(3.) Prayer is not the proper exercise of faith in the instant of receiving of this sacrament, as is evident from the nature and use of it.

(4.) The known original of this rite doth render it not only justly to be suspected, but to be avoided.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer unto Two Questions: with Twelve Arguments against any Conformity to Worship not of Divine Institution</cite>, (1720) in William H. Goold (ed.), The Works of John Owen, D.D. (24 vols, Edinburgh: T. &amp; T. Clark, 1850-53), 16: 247.</span></figcaption>

<blockquote><p>Common “wine” is instituted, of indifferent color, undiluted with water because it is called simply the “fruit of the vine” (Mt. 26:29; Mk. 14:25). Thus the Romanists here without reason urge the mixture of water with the wine, which although according to them is not of the integrity of the sacrament, still is of its congruity, nor can it be omitted without mortal sin (as Bellarmine holds). For although it may seem to be indifferent (which may be equally omitted or retained, provided the order of the church is not disturbed; and it is clear that by the ancients water was mixed with the wine because the use of pure wine is rare among the orientals); still they are deservedly to be censured because (without authority from the word) they invent mortal sins and condemn the liberty of others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.22.6 ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–1997), 431.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

<blockquote><p>Andrew Willet criticised Richard Hooker for what he perceived as the latter’s undermining of the seriousness of the error of transubstantiation:

The Church of England pronounceth, that The Transubstantiation of the bread and wine in the Eucharist, can not be proved by the sacred Scripture, but is against plain words of Scripture, overturneth the nature of the sacrament, &amp; hath give occasion of many superstitions.

And for this cause our Reverend Fathers call it: A monstrous &amp; blasphemous doctrine: bringing in doubt the truth of Christ’s body. Contrary to Christ’s words, saying: It is expedient that I go away, Joh. 16. 7. and to that of Peter: Whom the heavens must contain until the time that all things be restored, Act. 3. 21. disagreeing from the articles of faith, He ascended into heaven, sitteth at the right hand of God the Father, &amp;c. making void the institution of Christ, which is to continue till he come, &amp;c. casting holy things to profane, as whoremongers, murderers, &amp;c. mise and dogs to receive the true real body of Christ. causing most cruel eating of man’s flesh, and many monstrous miracles: accidents without subjects: the body of Christ without his qualities and true manner of a body: nourishing the Marcionist to believe the phantastical body of Christ, and Eutychians confounding the two natures of Christ, and therefore they which affirm transubstantiation are indeed right Sacramentaries and Capernaites.

In regard whereof we intreat you Mai. Hoo[ker]. to make a fit construction of your words, were you say: Sith we all agree that by the sacrament, Christ doth really and truly in us perform his promise: why do we vainly trouble our selves with so fierce contentions. whether by consubstantiation or else by transubstantiation the sacrament it self be first possessed with Christ or no: a thing which no way can either further or hinder us howsoever it stand, because our participation of Christ in the Sacrament, dependeth on the cooperation of his omnipotent power, which maketh it his body and blood unto us, whether with change or without alteration of the element, such as they imagine, we need not greatly to care nor inquire after. In all which words you seem to make light of the doctrine of transubstantiation, as a matter not to be stood upon or to be contended for, cared for or enquired into:

Which maketh us to marvel how our Church and Reverend Fathers have all this time passed, been deceived. What should cause them to affirm it to be a thing contrary to the plain words of scripture, overturning the nature of the Sacrament, to call it monstrous doctrine: why so many reverend Fathers, as Crammer, Ridley, Hooper, Latimer, Rogers, Bradford, &amp;c. have given their lives in witness against it, if it bee a thing that neither furthereth nor hindreth, a thing not to be cared for, nor enquired after? And here we pray you ingeniously to shew whether your meaning be to bring that side into credit by softening the odiousness of their heresy, and our side into suspicion of peevishness, for standing upon trifles; which the rather we desire to be resolved in, because else where you call the enemies to Transubstantiation Sacramentaries, and labour to shew a certain ubiquity of Christ’s manhood and of his body, and of his soul, which seemeth to us that you would give a gentle construction of Popish opinions, and privily rob the truth of our English creed of her due estimation.

If you call our Reverend Fathers Sacramentaries for oppugning transubst. and they again call the maintainers of it right Sacramentaries and Capernaites (if you have given as good testimony of faithfulness as they) whom shall wee believe? are you not contradictory: and may we think you can favour that side; your words do beat down; shew us then we pray you how such great favours do not prejudice the doctrine of the church of England, or not condemn those millions of learned divines and blessed Martyrs of extreme folly, who have died for the same; and that God should reveal to you only that it was for that which neither furthered nor hurteth?

Lastly instruct us whether the institution of the Sacrament by Christ, saying: this is my body: do this in remembrance of me, be not the true and right making of it Christ’s body and blood unto us: and upon what ground of Scripture it may be proved, that the cooperation of his omnipotent power doeth make it his body and blood unto us, and in what sense: And whether such phrases do not help the Popish argument of God’s power which they commonly use to approve their transubstantiation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian letter of certain English protestants, unfained favourers of the present state of religion, authorised and professed in England: unto that reverend and learned man, Mr R. Hoo[ker] requiring resolution in certain matters of doctrine (which seem to overthrow the foundation of Christian rel</cite>, (Middelburg: Richard Schilders, 1599), pp 33-35.</span></figcaption>

ons%2C+and+privily+rob+the+truth+of+our+English+creed+of+her+due+estimation.%0A%0AIf+you+call+our+Reverend+Fathers+Sacramentaries+for+oppugning+transubst.+and+they+again+call+the+maintainers+of+it+right+Sacramentaries+and+Capernaites+%28if+you+have+given+as+good+testimony+of+faithfulness+as+they%29+whom+shall+wee+believe%3F+are+you+not+contradictory%3A+and+may+we+think+you+can+favour+that+side%3B+your+words+do+beat+down%3B+shew+us+then+we+pray+you+how+such+great+favours+do+not+prejudice+the+doctrine+of+the+church+of+England%2C+or+not+condemn+those+millions+of+learned+divines+and+blessed+Martyrs+of+extreme+folly%2C+who+have+died+for+the+same%3B+and+that+God+should+reveal+to+you+only+that+it+was+for+that+which+neither+furthered+nor+hurteth%3F%0A%0ALastly+instruct+us+whether+the+institution+of+the+Sacrament+by+Christ%2C+saying%3A+this+is+my+body%3A+do+this+in+remembrance+of+me%2C+be+not+the+true+and+right+making+of+it+Christ%E2%80%99s+body+and+blood+unto+us%3A+and+upon+what+ground+of+Scripture+it+may+be+proved%2C+that+the+cooperation+of+his+omnipotent+power+doeth+make+it+his+body+and+blood+unto+us%2C+and+in+what+sense%3A+And+whether+such+phrases+do+not+help+the+Popish+argument+of+God%E2%80%99s+power+which+they+commonly+use+to+approve+their+transubstantiation.%E2%80%9D%0A%0A%E2%80%94+Andrew+Willet%2C+A+Christian+letter+of+certain+English+protestants%2C+unfained+favourers+of+the+present+state+of+religion%2C+authorised+and+professed+in+England%3A+unto+that+reverend+and+learned+man%2C+Mr+R.+Hoo%5Bker%5D+requiring+resolution+in+certain+matters+of+doctrine+%28which+seem+to+overthrow+the+foundation+of+Christian+rel%2C+%28Middelburg%3A+Richard+Schilders%2C+1599%29%2C+pp+33-35.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F00e5058364.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/00e5058364.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/08/26/andrew-willet-on-richard-hooker-and-transubstantiation/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Q. Why is faith required [to rightly receive communion]?

A. Because well we may eat the Bread, and drink the wine without faith; but we cannot eat Christ’s body, and drink his Blood without faith.

True; for the eating of his Body is a spiritual eating, and the drinking of his Blood is a spiritual drinking, consisting in meditation of the wonderful love of GOD the Father, who to save our souls, spared not his own Son: The wonderful love of God the Son, who to save our souls, spared not his own self but gave himself to suffer a shameful death, a bitter death, and an accursed death for our sins: He is the love of Christ that passeth knowledge: such is the breadth and the length and depth, and height of it, that we are not able sufficiently to comprehend it.

And like as the body by feeding and drinking, doth gather strength to the better performance of all actions of nature: so the soul of a Christian by meditation on this love of Christ in giving his body to be crucified, and his blood to be shed for our sins, doth gather more and more strength continually for the better performance of all actions of grace; whether they be actions of dependence, to depend upon him, and put our trust in him in all states, in all conditions, even in the time of affliction, and persecution, and at the very house of death; Or whether they be actions of conformity to his will, in obeying him, and walking in the ways of his commandments unto the end?</p></blockquote>

<blockquote><p>It is not as the Stoics have imagined, a thing unseemly for a wise man to be touched with grief of mind, but to be sorrowful when we least should, and where we should lament there to laugh, this argueth our small wisdom.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-21265053be" data-kw="">
<blockquote><p>The observance of the day rests upon the divine command and the divine example (Ex. xx. 11; Gn. ii. 2, 3). The principle underlying it is that man must copy God in his course of life. In the creation there was the sequence of six days of creative activity and a day of rest. Rest, of course, with God does not mean mere cessation from labour. It has a deeper and richer significance – it speaks of satisfaction and delight in the works of His hands. It is interesting to note that the seventh day was man’s first upon earth – he began his career by keeping sabbath with his God.

Christians often look on the Lord’s day as primarily for the sake of advancing religion. There is a danger in placing the emphasis too much in this direction. Its main significance is in the things of which it speaks. It witnesses to creation by God’s power at the beginning of history; and it reminds us of redemption accomplished through the crucified and risen Saviour. But these great truths do not exhaust its significance. It speaks also of eternity – of the sabbath rest that remains for the people of God. Its witness to these great truths as it recurs every week is every whit as necessary under the New Testament as under the Old.

Dr. Geerhardus Vos points out the danger of the modern Church becoming so ·busy with religious propaganda on this holy day as to leave too little place for the quiet ‘ God-ward occupation with piety’. The day is ‘set apart’ from mere secular employments and worldly pursuits and enjoyments, and ‘set apart’ to God and His worship. It is no doubt possible for Christian workers to be so much taken up with religious propaganda on this holy day as to empty it too much of the opportunities for the ‘rest’ and reflection which lie at the heart of its significance. As we ponder upon the great truths of which the Christian sabbath speaks, it becomes like a Pisgah-height from which we view the promised land. We cannot afford to be without what Dr. Vos has called its ‘eternity-typifying values’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/w-j-grier.html">W. J. Grier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Development of the Lord s Day from the Jewish Sabbath’, The Christian Graduate</cite></span></figcaption>

</figure><figure class="quote" id="q-38f6b9ca32" data-kw="">
<blockquote><p>Divine revelation takes the dictates of sound reason for granted, and refers to them in such terms of approbation as impose it upon us as a duty to be guided by them in those cases as to which the scriptures are silent, or have merely laid down general rules.

The rites of Christian worship are of divine institution, but there are various external circumstances connected with their observance which are left to the regulation of human prudence exercised with a proper regard to decency and edification; such as the times of assembling, the order in which the several parts of worship shall be celebrated, and the length of the services.

The range of this class of objects is still more extensive in relation to the government and discipline of the church, as to which Divine wisdom saw it fit to be less minute and precise in its prescriptions. Every society, and consequently the church of Christ, the most perfect of societies, must have external bonds of union, rules of management, and, in short, all those means which are necessary to her preservation, or conducive to the ends of her erection.

The essential principles of jurisprudence, which are founded on natural laws, are common to civil and ecclesiastical society; and they dictate the observance of certain forms of process as safeguards to justice, and means of eliciting truth in dubious or controverted cases.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spirit of Judgment. Delivered at the opening of the Synod of Original Seceders, Edinburgh, September, 1829 in Sermons</cite></span></figcaption>

9ca32.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/08/31/thomas-mccrie-on-sound-reason-the-circumstances-of-worship-church-government-and-jurisprudence/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-f41fd4eaa1" data-kw="">
<blockquote><p>That is to say, that among the people of Israel there was, as it were, a twofold holiness of persons: the one common, according to which that whole nation was separated from all other nations so that they might be covenanted and consecrated to God—and for that reason they were called “a holy nation,” while the rest of the nations were “profane”; the other more special, and proper to those who, for the service of God in the tabernacle, were exempted from other employments—on which account they were with peculiar propriety called “holy,” as also, in the same manner, were all vessels made use of in the sacred service.

In fact, then, the apostle refers to the one or the other of these two kinds of holiness, with a view to show either that the children of believers are set apart by God, to the end that they may resemble certain vessels that under the old economy were specially dedicated to his own service, or that they are separated from the common condition of other infants so that they may participate in the covenanted people of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/moses-amyraut.html">Moses Amyraut</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputatio de Paedobaptismi</cite>, §XIV. Quoted in Herman Witsius, On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), pp 128-29.</span></figcaption>

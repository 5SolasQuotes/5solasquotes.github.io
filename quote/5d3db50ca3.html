<main class="wrap"><figure class="quote" id="q-5d3db50ca3" data-kw="">
<blockquote><p>Enthusiasts go upon a false principle that learning, arts, tongues, are in their nature and kind, heathenish, whereas of themselves and in their kind and nature, they are neither heathenish nor Christian, but natural and well polished habits and acquired qualities indifferent and extrinsical to either the state of Ethnicism or Christianity, and good or ill, as they are well used, or abused, in either states, they argue vainly then who thus reason: if Christ and his Apostles carried on a ministry without learning, arts, and tongues, then so may we:

[B]ut the former is true, therefore so is the latter, the major is false, because sectaries want the immediate inspiring Spirit that Christ and his Apostles had to supply defects of education and industry, and the assumption is palpably false also: who ever therefore now will take on them, to be public ministers of the New Testament, and go from weaving, sowing, Carpentry, Shoe-making to the pulpit to the representation of God, and being his mouth to his people, being void of all learning, tongues, logic, arts, sciences, and the literal knowledge of the scripture, and yet cannot shew that either the Holy Ghost hath given to them the Gift of tongues, and the knowledge of the mystery of the Gospel by revelation without the teaching of flesh or blood as he did to the Apostles, or without some more then ordinary competent measure of knowledge and supernatural dexterity to cut the word of truth aright: and yet allege that fisher-men never brought up at schools and universities may be preachers of the Gospel, and why not Weavers, Taylors, Button makers, Shoe-makers, &amp;c. they are but intruders, and run, and the Lord sent them not, how then can, M. Beacon in his Chatechism, pag. 153, 154. Prove that the ministry of the Spirit can be carried on without that which we commonly call Human Learning from Act. 4.13. Because Christ and his Apostles carried it on so?

For Christ and his Apostles wanted not that which we commonly call human learning, yea and most properly call so, they wanted learning acquited at schools and universities, but that is not the question: whether men may be preachers though they never were educated and trained up in universities? Human learning is not called so from the way and manner of acquiring of it, but from its own nature, And Christ and his Apostles made use of human arts and tongues, for the understanding and opening of Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 1.8, p. 49.</span></figcaption>

<blockquote><p>3. It is strange divinity, ‘That that which is no sin, of itself, cannot be omitted without sin for the sole will and pleasure of men.’ [As the prelates argued] Human authority then may make it sin not to rub our beards, not to claw our heads, when we come to the Church to hear God’s Word. If human authority can make an indifferent act lawful, and the omission of it, sinful, [then] they may make all the indifferent acts in the world lawful acts; they might then make piping, leaping, laughing, acts of divine worship, and might make a Decalogue of their own: And if they may make an indifferent act to be sin, if it be omitted, they may by as good reason make sinful acts, as adultery, incest, murder, robbery, to be lawful acts; For if man’s inhibiting will be the formal reason of sin, then his commanding will must be the formal reason of obedience: And so rulers might command murder, robbery, incest, blasphemy.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“3. It is strange divinity, ‘That that which is no sin, of itself, cannot be omitted without sin for the sole will and pleasure of men.’ [As the prelates argued] Human authority then may make it sin not to rub our beards, not to claw our heads, when we come to the Church to hear God’s Word. If human authority can make an indifferent act lawful, and the omission of it, sinful, [then] they may make all the indifferent acts in the world lawful acts; they might then make piping, leaping, laughing, acts of divine worship, and might make a Decalogue of their own: And if they may make an indifferent act to be sin, if it be omitted, they may by as good reason make sinful acts, as adultery, incest, murder, robbery, to be lawful acts; For if man’s inhibiting will be the formal reason of sin, then his commanding will must be the formal reason of obedience: And so rulers might command murder, robbery, incest, blasphemy.”

— Samuel Rutherford, The Divine Right of Church Government, … (1646), p. 652">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+It+is+strange+divinity%2C+%E2%80%98That+that+which+is+no+sin%2C+of+itself%2C+cannot+be+omitted+without+sin+for+the+sole+will+and+pleasure+of+men.%E2%80%99+%5BAs+the+prelates+argued%5D+Human+authority+then+may+make+it+sin+not+to+rub+our+beards%2C+not+to+claw+our+heads%2C+when+we+come+to+the+Church+to+hear+God%E2%80%99s+Word.+If+human+authority+can+make+an+indifferent+act+lawful%2C+and+the+omission+of+it%2C+sinful%2C+%5Bthen%5D+they+may+make+all+the+indifferent+acts+in+the+world+lawful+acts%3B+they+might+then+make+piping%2C+leaping%2C+laughing%2C+acts+of+divine+worship%2C+and+might+make+a+Decalogue+of+their+own%3A+And+if+they+may+make+an+indifferent+act+to+be+sin%2C+if+it+be+omitted%2C+they+may+by+as+good+reason+make+sinful+acts%2C+as+adultery%2C+incest%2C+murder%2C+robbery%2C+to+be+lawful+acts%3B+For+if+man%E2%80%99s+inhibiting+will+be+the+formal+reason+of+sin%2C+then+his+commanding+will+must+be+the+formal+reason+of+obedience%3A+And+so+rulers+might+command+murder%2C+robbery%2C+incest%2C+blasphemy.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%2C+%E2%80%A6+%281646%29%2C+p.+652&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F64968dc87b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/64968dc87b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-arbitrary-laws-commands/#:~:text=3.%20It%20is%20strange%20divinity%2C%20%E2%80%98That,might%20command%20murder%2C%20robbery%2C%20incest%2C%20blasphemy&amp;text=3.%20It%20is%20strange%20divinity%2C%20%E2%80%98That%20that%20which&amp;text=so%20rulers%20might%20command%20murder%2C%20robbery%2C%20incest%2C%20blasphemy" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

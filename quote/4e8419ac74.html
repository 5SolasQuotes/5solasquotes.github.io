<main class="wrap"><figure class="quote" id="q-4e8419ac74" data-kw="">
<blockquote><p>And it is most false that we join with Jesuits. 1. We teach no more against tyrants, in exercitio [in the exercise], than Grotius, Barclay, and Winzetus, in the matter of deposing kings; and in this, royalists conspire with Jesuits. 2. We deny that the Pope may loose subjects from the oath of fidelity when a king turns heretical. 3. That people, at the Pope’s commandment, are to dethrone kings for heresy; so do the prelates and their fellows, the papists, teach; so Gregory VII practised; so Aquinas taught, (2 of 2 q. 12, art. 2), Antonin. [sum. part 3, t. 22, ch. 3, sect. 7), “Thou hast put all things under the Pope’s feet,” oves, id est, Christianos; boves. Judceos et hereticos ; pecora, Paganos; so Navar. (bk. 1, ch. 13); Pagans have no jurisdiction. Jaco. Symanca, (de Catho. Instit., tit. 45, n. 25). “Catholica uxor heretico viro debitum reddere non tenetur.” Item, Constat, haereticum privatum esse omnidominio, naturali, civili, politico, naturali quod habet in filios, nam propter hceresin patris ejjiciuntur jilii sui juris, civili, quod habct in servos, ab eo enim scrvi liberantur, politico, quod rerum domini habcnt in sxtbditos, ita Bannes, (22. q. 12, art. 10); Gregor. de valent., 2 of 2, dis. 1, q. 12, p. 2, lod. Mol. to. 1, de just, et jur. tract. 2, dis. 29, v. 3).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843) | Question 41</cite>, p. 207</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-af834b5bd2" data-kw="">
<blockquote><p>Hence it ought to be observed that something remarkable is here demanded from princes, besides an ordinary profession of faith; for the Lord has bestowed on them authority and power to defend the Church and to promote the glory of God. This is indeed the duty of all; but kings, in proportion as their power is greater, ought to devote themselves to it more earnestly, and to labor in it more diligently.</p></blockquote>

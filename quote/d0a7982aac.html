<main class="wrap"><figure class="quote" id="q-d0a7982aac" data-kw="">
<blockquote><p>In the substantials of worship, Unity is necessary; there all are bound to go by the same rule, and to do to the uttermost they are able, the same thing.

But the circumstantials of worship have a two-fold consideration: They are either such, as though but circumstances to some other worship, yet have also in themselves some divine worship, some spiritual efficacy, something in them to commend our service unto God, or to cause some presence of God with us, or to work us nearer to God, by an efficacy beyond what they have in them of their own natures.

As for instance, Time is a circumstance, but the Lords day hath a worship in it commending our service to God, and an efficacy to bring God to us, and raise us to God: this not from any natural efficacy of the time, but from God’s institution. Now in such circumstances as these, there ought to be uniformity; for these have institutions for their rule, and are not at man’s liberty to be altered as he thinks best in prudence; But there are other circumstances which are only natural or civil, subservient to worship in a natural or civil way; They are conversant about worship, but have nothing of worship in them, but are merely natural or civil helps to it. When we worship God, we do something as men as well as worshippers; hence we have need of some natural or civil helps. As for instance, when we meet to worship God, we being men as well as Christians, must have a convenience of place, to keep us from the weather, to know whether to resort; and of time to know when.

There must be order: Many cannot speak at once to edification; modest and grave carriage is required of us, as a society of men, meeting about matters of weight. In these circumstances, and other of the like nature, there is no worship at all, there is no spiritual efficacy, there are only natural or civil helps to us, while we are worshipping; therefore for these circumstances, human prudence is sufficient to order them.

The right understanding of this takes away a great prejudice that many have against such as desire to keep to Divine Institutions, not only in Substantials, but in the Circumstantials of worship; they think it an unreasonable thing, that divine Institution should be required for every circumstance in worship; this hath bred a great quarrel in the church: and well may it be thought unreasonable, if we required Institutions for circumstances in worship, which are but natural or civil helps, and have no worship at all in them, for that indeed were endless, and a mere vanity. Certainly, Institutions are to be required only in things that are raised beyond what is in them naturally, in tendring my respects to God by them, or expecting to draw my heart nearer to God, or God nearer to me in the use of them. The contention about Uniformity is much increased for want of a right understanding of this difference in the circumstantials of worship; did we understand one another in this, we might soon have Peace as concerning this thing.

In these latter sorts of circumstances, we must also distinguish. There are some that must of necessity be determined, as time and place; it is therefore necessary, there should be an uniformity in these, in all the members of every society respectively, that they agree to meet in the same place, at the same time, natural necessity requires this: but natural necessity requires not the binding of several Churches to Uniformity in things of this kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the lovers of truth and peace heart-divisions opened in the causes and evils of them: with cautions that we may not be hurt by them, and endeavours to heal them (London: Robert Dawlman, 1653), pp 14-15.</cite></span></figcaption>

<blockquote><p>The use of instruments in worship was admittedly part of the Temple service. It had no place in the Tabernacle before David’s day, beyond the use of two silver trumpets made by Moses, in the hands of the priests. There is not a particle of evidence to show that it entered into the ordinary worship of the family or the synagogue. We are now prepared to take a step further, and note that, in the Temple service, it was uniformly and most closely associated with sacrifice and the burning of incense. …[T]he playing on instruments was confined to those bands of Levites whom David was training in anticipation of the building of the temple—these acting in this for and as representing the whole people. …1 Chron xxiii.26–32. It is very plain from this passage that the service of praise as conducted by the Levitical choirs with musical accompaniment, was associated with the regular morning and evening sacrifice, and with other sacrifices.</p></blockquote>

<blockquote><p>Obj. 2. The covenant was occasional and temporary, being made upon the occasion of the prevalency and growing power of the enemy (as is mentioned in the narrative), which foundation being taken away the superstructure cannot stand.

Ans. 1. … Shall we therefore be no longer bound to obey and maintain good laws, because the evils which gave occasion to their making have ceased?

2. The covenant doth, in express words, oblige us constantly, and all the days of our lives, to pursue the ends therein expressed; so that to hold it but a temporary obligation is a breach of covenant.

3. There is not any one of the ends of the covenant which is yet fully attained. The very Directory of Worship is not observed in most places of the kingdom; neither is the abolition of prelacy, and of the Book of Common Prayer, yet established by act of parliament.

4. If we had attained the ends of the covenant (which we have not), yet non minor est virtus quam quorere parta tueri, and the recidivation may prove worse than the first disease.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, (1649; Edinburgh, 1844), pp 87-88.</span></figcaption>

<blockquote><p>God’s moral government of the universe of intelligent beings, is his chief glory. But Jesus Christ, and he crucified, or, Jesus Christ in the accomplishment of the work of redemption, is the bright sun, which throws light, and warmth, and beauty, over this whole moral system. In this work, angels are ministering spirits; and every high archangel, and seraphim, and cherubim, will sing a louder song, and shout with more transporting joy, when all its grand purposes are fulfilled, than when they heard the potent word of God bidding creation into beautiful existence. This is the golden chain which will for ever bind in happy union to one another, and in higher and holier adoration to God, all the pure and immortal spirits of his great kingdom.

Oh! what a work is this! Ye angels! swell your notes, and let the universe hear of its glory—let heaven re-echo His praise. It is the new creation, and in comparison with it, the former shall be remembered no more, nor come into mind. By it is made known to the principalities and powers in heavenly places, the manifold wisdom of God. And while the material system is continually wasting away, and the heavens and the earth which God brought into being and form, shall be rolled together as a scroll, shall wax old like a garment, and be changed as a vesture, the new heavens and new earth will be growing in beauty and glory, be permanent as the throne of God, and to its years there shall be no end.

Inasmuch, then, as the work of redemption is recognized in the Bible as the chief work of heaven, is represented as intended to display to the hosts of seraphim and cherubim the manifold wisdom of God, and containing in it exhibitions of the perfections of Jehovah, which awaken the earnest investigation, and profound adoration of angels, who desire to look into it; and inasmuch as it is the great purpose of the Sabbath that man shall commemorate the attributes of God as unfolded in his works, the strong presumption is, that now, since a greater work is accomplished than when God rested from all which he had created and made, and his perfections are more gloriously displayed in it, the completion of this work will be the object of commemoration, and the day on which Christ entered into his rest, having ceased from his work as God did from his own, will be the day on which the righteous will enter into the courts of the Lord’s house; and in private also feel that this is the day which the Lord hath made and set apart for the duties of devotion. That day was the first day of the week, when the Redeemer burst the bars of death and arose triumphant over the grave.</p></blockquote>

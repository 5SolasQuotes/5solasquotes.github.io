<main class="wrap"><figure class="quote" id="q-8eb3be1fc7" data-kw="">
<blockquote><p>This sacrament, therefore, consists in the rite and the promise annexed to it, or in the signs and the things signified. The rite, or signs are the bread which is broken and eaten, and the wine which is poured out, and drunk. The things signified are the broken body, and shed blood of Christ, which are eaten and drunk, or our union with Christ by faith, by which we are made partakers of Christ and all his benefits, so that we derive from him everlasting life, as the branches draw their life from the vine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism (P&amp;R), pp. 378 &amp; 385</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-d59228e329" data-kw="">
<blockquote><p>…in hearing the Gospel? for therein we receive spiritually the body and blood of Christ, and that as truly and really as in the sacrament. Whereupon the Archbishop of Armagh [James Ussher] shows that the spiritual and inward feeding upon the body and blood of Christ is to be found out of the Sacrament, and that diverse of the Fathers do apply the sixth [chapter] of John to the hearing of the Word also, as Clemens Alexandrinus, Origen, Eusebius Caesariensis and others. Basilius Magnus likewise teaches plainly that we eat the flesh of Christ in his Word and Doctrine. This I am sure no man dare deny.</p></blockquote>

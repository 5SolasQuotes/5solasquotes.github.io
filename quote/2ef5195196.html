<blockquote><p>VI. Preservation in that state, by which God preserves the regenerate until the end of life, 1 Pet. 1:5, 9, and hence their perseverance: for they themselves, acted upon by God, act, and preserved, preserve themselves, 1 Jn. 5:4, 18.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8541de0ac1" data-kw="perseverance against Remonstrants">
<blockquote><p>The question concerning perseverance is agitated by us with the old and new Pelagians and Semipelagians, who agree in opposing and denying it. Such are the Romanists, Socinians, Anabaptists and Remonstrants, who, on this point (as in the others concerning grace), depart from the orthodox doctrine and were condemned by the Synod of Dort in Article 5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.16.2</span></figcaption>

</figure><figure class="quote" id="q-9078428041" data-kw="">
<blockquote><p>While one may find a confession like the Irish Articles (1615) explicitly stating perseverance of all those who are regenerate and have true faith (Art. 38), many Reformed confessions, like the First Helvetic Confession (1536), simply don’t address the topic. Similarly, doctrinal standards like the Belgic Confession (1561) and the Heidelberg Catechism (1563), which many people find conducive to the perseverance of the saints, never clearly state it. And while the tenth chapter of the Second Helvetic Confession (1566) may be suggestive of perseverance of the saints when it identifies those engrafted in Christ by faith with the elect, it does not come out and say that those with true faith cannot lose it. Other confessions, like the Thirty-Nine Articles (1563), speak of the elect attaining everlasting felicity (Art. 17) without ever specifying that everyone with saving faith is elect. This path was even followed by the French Confession (1559) and the Confession of La Rochelle (1571), which were highly influenced by Calvin and the Reformers in Geneva. But the fact that so many Reformed confessions did not require adherence to the perseverance of the saints does not mean that the doctrine was not prominent. To the contrary, the fact that the confessions did not deny it allowed the doctrine to flourish among the Reformed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jay-t-collier.html">Jay T. Collier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Debating Perseverance</cite>, (Oxford, 2018) 207 pp. ToC, pp. 11-12</span></figcaption>

</figure><figure class="quote" id="q-1a5d939ac1" data-kw="">
<blockquote><p>XLIII. Perseverance in true faith is a gift that is supremely necessary, so that, strengthened with all power according to the glorious might of God, we may overcome all afflictions, persecutions, and even temptations of the flesh, the world, and Satan, with all patience and gentleness, and with joy. XLIV. And this perseverance is not from us, but is graciously communicated to us by the power of God; therefore, Paul asks for it from God [in Col. 1:3-5]. No one can remain steadfast in the faith of Christ unless they are graciously strengthened by God, with the power of God aiding our weakness and granting patience. XLV. However, patience should by no means be forcibly extracted from those who are unwilling, but rather it should arise from a joyful and cheerful spirit, so that in trials the joy of the spirit may surpass the pain of the flesh. XLVI. From this, we conclude:

1. No faithful person can stand by their own virtue alone.

2. The steadfastness of faith amidst various temptations is a special gift from God, to be obtained through constant prayers.

3. Since the steadfastness of faith is strengthened by the glorious might of God, truly faithful and reborn individuals can never completely lose their faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians</cite>, (on Col. 1:1-11) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</span></figcaption>

</figure><figure class="quote" id="q-bc5b6209af" data-kw="">
<blockquote><p>This article will address the claim that Thomas Aquinas held to an Augustinian doctrine of predestination essentially compatible with that of the Reformed Churches, showing in what ways Thomas’s doctrine is compatible with the doctrine of the Reformed Churches and important ways in which it differs… Thomas did teach the perseverance of the elect, but not perseverance of the saints. What we mean by this is that he taught that all the elect will persevere, but that not only the elect, but many besides, are called to faith and given real conversion and grace, and eventually fall away. Their state in this life differs nothing from the elect. In keeping with this, one may not know in this life whether they are elect or reprobate.</p></blockquote>

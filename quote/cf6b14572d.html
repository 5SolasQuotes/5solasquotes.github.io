<main class="wrap"><figure class="quote" id="q-cf6b14572d" data-kw="">
<blockquote><p>…for neither magistrate nor people can be bound to follow the judgement of the Churches or ministry farther than they follow the rule of the Word; they follow their judgement conditionally, not absolutely and simply; and it is a great calumny of Mr. [Henry] Burton and our [Independent] Brethren, that we lay bands on the consciences of prince and people to follow the acts and determinations of the Church, be they true or false: and that there is no place left to appeal to the next, or a better informed synod, and to the consciences of the collective Church of the godly judicious professors, and to protest and deny obedience to erring assemblies.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bbb1578b3d" data-kw="">
<blockquote><p>93. Next it may be granted that the [Church] matter may be put under a further examination [by the Church, at the request of the Magistrate], yet upon condition, that when it is come to the revision of the former [Church] sentence, regard may be had of the weaker which are found willing to be taught, though they doubt; but that unto the wicked and contentious tempters, which do mainly strive to oppress our liberty which we have in Christ, and to bring us into bondage, we do not for a moment give place by subjecting ourselves; for what else seek they or wait for, than that under the pretense of a revising and of new debate, they cast in lets and impediments ever and anone, and that by cunning lyings in wait they may betray the liberty of the Church, and in process of time may by open violence more forceably break in upon it, or at least constrain the ministers of the Church to weave Penelope’s web, which they can never bring to an end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>111 Propositions</cite></span></figcaption>

</figure><figure class="quote" id="q-7db125d72f" data-kw="">
<blockquote><p>Not that our Lord by this intended to confirm all sentences of excommunication, or to patronize any cheat or hypocrisy in any, to gain an absolution, or restoration to the church. But only, as to the first, to assure stubborn and impenitent sinners that he would ratify what his church did, according to the rule He had given them to act by… If therefore any be cast out of any church for professing or standing to any truth of the gospel, or because he will not do what is sinful, we must not understand them bound in heaven, though they be bound on earth, nor have any such excommunications any terror in them. How forcible are right words! But these arguings, what do they reprove? The church is not by this text made infallible, nor is the holy God by it engaged to defend their errors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Mt. 18, verse 18</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><figure class="quote" id="q-cbecbbb5dc" data-kw="">
<blockquote><p>Fourth, there is yet another concession which it is necessary to make in regard to this matter, and which it is of some importance to note; and it is this, that the mere resistance to authority as authority alone, ought not to be made a ground for Church censure or punishment, when there is no moral or spiritual offence connected with the resistance. Of course resistance to authority, even when that authority is put forth, as it sometimes may and must be, in enforcing a thing indifferent, may yet be associated with moral guilt on the part of those who indulge in it. Such resistance may arise out of feelings of hatred to all restraint, or opposition of a malignant kind to all authority; it may become contumacy, and as such involve moral blame. But until resistance to authority becomes in one way or other morally wrong, when the consent of the members to the act or deed of the rulers is withheld from no cause in itself sinful, such want of consent or concurrence ought to be dealt with on the principle of forbearance in things indifferent, and not be visited with censure or penalty of an ecclesiastical kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ, vol. 1, Edinburgh, 1868</cite>, p. 243</span></figcaption>

lank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-84003b4470" data-kw="">
<blockquote><p>Besides, do not our divines require that the Church’s canons, even in matters of rite, be ‘profitable to the edification of the Church’ (Polanus, Syntagma, bk. 7, ch. 17); and that the observation of the same, must carry before it a manifest utility (Calvin, Institutes, bk. 4, ch. 10, §32); that in rites and ceremonies the Church has no power to destruction, but only to edification? (Chemnitz, Examination, part 2, p. 121)… Do they not teach that no idle ceremony, which serves not unto edifying, is to be suffered in the Church (Paraeus, on 1 Cor. 14:26; John Calvin, Epistolarum &amp; Responsorum, col. 478); and that godly bretheren are not holden to subject themselves unto such things as they perceive neither to be right nor profitable? (Calvin, on 1 Cor. 10:23; Taylor on Titus 1:15, p. 295) That whatsoever either would scandalize our brother, or not be profitable to him for his edification, Christians for no respect must dare to meddle with it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (Edinburgh, 1637) | pt. 2</cite>, ch. 1, p. 8</span></figcaption>

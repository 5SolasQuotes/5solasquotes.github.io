<blockquote><p>[w]hile most Protestants concurred with Calvin’s condemnation of the extreme chiliasm of some of the church fathers and Anabaptists, they were nevertheless optimistic about the course of history in the sixteenth century.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1c7351c444" data-kw="">
<blockquote><p>Yet I will speak what I think, and which, after advised consideration had of all things, touching that place, I suppose is to be determined thereof, namely, that those thousand years (as is evident, most manifestly, even by the event) do not a whit concern or set out the time of the coming of Antichrist: but rather that they are to be reckoned and accompted, after that the said number of years of 666 were once expired… For before the said thousand years were to take place, those things should be accomplished which were spoken of ch. 16:12, namely, that Euphrates should be dried up, and a way opened for the kings of the East to come and make invasion upon those territories and countries, which were before subject to the Romish jurisdiction. Which surely is come to pass: For undoubtedly those kings of the East, which passed through Euphrates, being dried up, (that is, which gave them easy passage through the midst of her channel) and surprised the segniories that belonged to the Romane Empire, were the Turks. Therefore it must needs be that the Turks’ empire should first be raised before those thousand years could be fulfilled. But if we begin to compt those years from the time of Christ’s suffring: then assuredly before the original of the Turks (which is reckoned to be about the year after Christ one thousand two hundred) those thousand years will be fully expired, and so the Apocalypse, that is, the prophecy of the Spirit of God, shall seem false… Wherefore, I am still of the mind I was of, and begin to reckon those 1000 years from the year six hundred sixty-six: which two numbers being put together amount unto one thousand six hundred sixty-six. After which term of time, those things are then to come to pass and be fulfilled: which the Spirit of God in the 19th of the Reuelation, and the chapters following has laid open:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lambert-daneau.html">Lambert Daneau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise Touching Antichrist</cite>, … (1589), ch. 21, pp. 89-90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/second-coming.html">Second Coming</a></span></div>

nd+be+fulfilled%3A+which+the+Spirit+of+God+in+the+19th+of+the+Reuelation%2C+and+the+chapters+following+has+laid+open%3A%E2%80%9D%0A%0A%E2%80%94+Lambert+Daneau%2C+A+Treatise+Touching+Antichrist%E2%80%A6+%281589%29%2C+ch.+21%2C+pp.+89-90&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1c7351c444.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1c7351c444.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/eschatology/#:~:text=Yet%20I%20will%20speak%20what%20I,the%20chapters%20following%20has%20laid%20open&amp;text=Yet%20I%20will%20speak%20what%20I%20think%2C%20and&amp;text=Reuelation%2C%20and%20the%20chapters%20following%20has%20laid%20open" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3f50691a76" data-kw="">
<blockquote><p>Now, here that exousia / power / authority is here to be understood as liberty, concerning which it was treated in Rev. 13:2, of exercising his rage against Christians through Roman idolatry, or through idolatrous princes; and therefore the beginning of those thousand years ought to be taken from the Edict of Constantine, which is in Eusebius, in which mention is made of the bound dragon. Now, the kings followed the example of the Roman Emperor, some quickly, some slowly, just as previously they had imitated the rage of the emperors against the Christians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of the Critics in The Exegetical Labors of</cite>, … Poole, vol. 82, on Rev. 15-22 ed. R. Andrew Myers (VA: Master Poole Publishing, 2010), p. 214, on Rev. 20:2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/second-coming.html">Second Coming</a></span></div>

</figure><figure class="quote" id="q-314dc0655d" data-kw="">
<blockquote><p>That old Serpent, which is the Devil and Satan, as he is likewise so stiled, ch. 12:9. and bound him a thousand years, which binding up or restraining was from such open rage of persecution as was used by the heathen emperors, but especially for that end which is spoken of in the next verse, to wit, that he should deceive the nations no more, which is to be understood, not absolutely from all sort of deceiving, but from that sort which he used before the preaching of the Gospel amongst the gentiles, by the responses of his hellish oracles, and such gross idolatry whereinto he drew them, and which by the preaching of the Gospel and conversion of the gentiles was silenced and abolished, and he (as it were) bound up therefrom. …During the time then wherein he was bound up from that sort of gross and paganish deceiving, he was never busier, by the vicar of his power, to whom he resigned his throne, as ch. 13:2, to deceive in a more subtil way, changing himself into an angel of light, and under presence and profession of the Christian name, to suppress and overthrow the truth of Christ Jesus, which thing to be true, may be seen, 1. By the great success of this manner of deception these thousand years, which he had, as we may see, ch. 13:16, so that all the world followed the beast, whose names were not written in the book of life. 2. By this, that v. 4. John saw the souls of these that were beheaded for the witness of Jesus, and had not worshipped the beast nor his image, living and reigning with Christ these thousand years, 〈 in non-Latin alphabet 〉, which v. 1. are called, 〈 in non-Latin alphabet 〉, without any article, to shew that he means these thousand years that Satan is bound up himself from the first sort of deceiving, yet is let loose as it were, in the vicar of his power to deceive after another manner and to kill the faithful witnesses spoken of, ch. 11:3. Verse. 3… Now for accommodation of history, to know the time when the Dragon was thus bound up, and the thousand years spoken of began, and thereafter ended and had their accomplishment. 1. The dragon was fully then bound up, when by Constantine’s conversion, heathenish and open persecution of the Gospel ceased, and the Christian religion by laws was every where established, for from that time the dragon had no loose chain for open rage as before, or paganish seduction; and this was about the three hundreth year of Christ, which leads us also to the point of his losing, which falls out about the one thousand three hundreth year of God, in the time of Boniface VIII, that monster of men, of whom their stories records, that he entred like a fox, lived like a lion and died like a dog, (Fascic. temp in vita Bonif. 8)… In whose time also, to evidence yet more Satan’s loosing, there was (as the same Platina reports) a sudden, general, and so huge an earthquake throughout all Italy, which lasted many days, as the like was never seen before, and which every where overthrew many houses. There appeared likewise (says he) a huge great comet portending some great calamity thereafter to fall out, so that heaven and earth gave signs and witnesses of the loosing of this dragon. And from the times of which Boniface many bloody persecutions against the professors of the truth were raised, who were called, Waldenses, Lollards, Hussites, and of late Lutherans, Calvinists, Huguenots and the like, many cruel plots hatched, and many bloody massacres acted and practiced. At this time also began that Ottoman race, and so Satan was let loose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-guild.html">William Guild</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sealed Book Opened</cite>, ... (1656), on Rev. 20, pp. 305-7 Guild was a Scottish divine.</span></figcaption>

article%2C+to+shew+that+he+means+these+thousand+years+that+Satan+is+bound+up+himself+from+the+first+sort+of+deceiving%2C+yet+is+let+loose+as+it+were%2C+in+the+vicar+of+his+power+to+deceive+after+another+manner+and+to+kill+the+faithful+witnesses+spoken+of%2C+ch.+11%3A3.+Verse.+3%E2%80%A6+Now+for+accommodation+of+history%2C+to+know+the+time+when+the+Dragon+was+thus+bound+up%2C+and+the+thousand+years+spoken+of+began%2C+and+thereafter+ended+and+had+their+accomplishment.+1.+The+dragon+was+fully+then+bound+up%2C+when+by+Constantine%E2%80%99s+conversion%2C+heathenish+and+open+persecution+of+the+Gospel+ceased%2C+and+the+Christian+religion+by+laws+was+every+where+established%2C+for+from+that+time+the+dragon+had+no+loose+chain+for+open+rage+as+before%2C+or+paganish+seduction%3B+and+this+was+about+the+three+hundreth+year+of+Christ%2C+which+leads+us+also+to+the+point+of+his+losing%2C+which+falls+out+about+the+one+thousand+three+hundreth+year+of+God%2C+in+the+time+of+Boniface+VIII%2C+that+monster+of+men%2C+of+whom+their+stories+records%2C+that+he+entred+like+a+fox%2C+lived+like+a+lion+and+died+like+a+dog%2C+%28Fascic.+temp+in+vita+Bonif.+8%29%E2%80%A6+In+whose+time+also%2C+to+evidence+yet+more+Satan%E2%80%99s+loosing%2C+there+was+%28as+the+same+Platina+reports%29+a+sudden%2C+general%2C+and+so+huge+an+earthquake+throughout+all+Italy%2C+which+lasted+many+days%2C+as+the+like+was+never+seen+before%2C+and+which+every+where+overthrew+many+houses.+There+appeared+likewise+%28says+he%29+a+huge+great+comet+portending+some+great+calamity+thereafter+to+fall+out%2C+so+that+heaven+and+earth+gave+signs+and+witnesses+of+the+loosing+of+this+dragon.+And+from+the+times+of+which+Boniface+many+bloody+persecutions+against+the+professors+of+the+truth+were+raised%2C+who+were+called%2C+Waldenses%2C+Lollards%2C+Hussites%2C+and+of+late+Lutherans%2C+Calvinists%2C+Huguenots+and+the+like%2C+many+cruel+plots+hatched%2C+and+many+bloody+massacres+acted+and+practiced.+At+this+time+also+began+that+Ottoman+race%2C+and+so+Satan+was+let+loose.%E2%80%9D%0A%0A%E2%80%94+William+Guild%2C+The+Sealed+Book+Opened%3A+or%2C+a+Clear+Explication+of+the+Prophecies+of+the+Revelation...+%281656%29%2C+on+Rev.+20%2C+pp.+305-7+Guild+was+a+Scottish+divine.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F314dc0655d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/314dc0655d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/eschatology/#:~:text=That%20old%20Serpent%2C%20which%20is%20the,and%20so%20Satan%20was%20let%20loose&amp;text=That%20old%20Serpent%2C%20which%20is%20the%20Devil%20and&amp;text=Ottoman%20race%2C%20and%20so%20Satan%20was%20let%20loose" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The first of which (continuing this history with the end of the second chapter) in the 36 years from the passion of Christ, when the Church of the Jews being overthrown, Satan attempted to invade the Christian church gathered from the Gentiles, and to destroy part of her seed, Rev. 12:17. The thousandth year falls precisely on the times of that wicked Hildebrand, who was called Gregory the seventh, a most damnable necromancer and sorcerer, whom Satan used as an instrument when he was loosed out of bonds from then on to annoy the saints of God with most cruel persecutions and the whole world with dissentions, and most bloody wars: as Benno the Cardinal reports at large. This is the first victory gained over the dragon in the earth.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-d25d2c5fd9" data-kw="">
<blockquote><p>But, whether that covenant [of works] was also entered into with the second Adam is more difficult to determine. Certainly from one perspective, as a creature and as man, it seems that He cannot be exempted from the moral government of God, nor otherwise could He as a man have merited anything for Himself. From another perspective, if He were in Adam under the covenant of nature, then it would seem that in and with Adam who sinned, He violated that same covenant, which is beyond absurd. Therefore it seems most safe to state: although as a rational creature He cannot be exempted from moral government with respect to his natural duties, yet He could have been withdrawn by God from the same moral governance in the positive duties, such as the commandment not to eat of the forbidden fruit (upon the transgression of which the sin of the human race hangs). Thus that this moral government was brought upon Him just as upon the rest of Adam’s posterity, according to the intention of God, we do not believe, because: (1) He had been designated by the eternal decree to be the second Adam (1 Peter 1:20; Rom. 5:12ff.), and it is unfitting that the second Adam should have been included with the first Adam in the same covenant, indeed included in him. I need not add that: (2) none were included except those that were to exist from the order of second causes; but the Savior, before sin, was not to exist from the order of second causes. Nor also: (3) can one for whom it is absolutely repugnant to sin be considered to have sinned in another, since it is entirely impossible for the God-man to become a sinner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 3, ch. 12, section 9, ‘Was it [the CoW] also entered into with the second Adam?’</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-956ef8743f" data-kw="">
<blockquote><p>Controversy – Did man before the Fall have the promises of a blessed life and the glory of heaven? We affirm against the Socinians and Anabaptists. Arguments:

1. The covenant of God, “Do this and live,” only had a place before the Fall and in the case of Christ, but it means, “you will live forever” (Gal. 3:12, 21).

2. The death denounced to man includes eternal death under the dominion of the devil, as we may conclude from Gen. 3:13 and 1 Cor. 15:22; therefore, the promised life was eternal life.

3. The law has only been weakened through sin so that it cannot save (salvare) (Rom. 8:3); therefore, before sin it was able to save (salvare).

4. He had the tree of life, and the thing that it signified was eternal life (Rev. 2:7).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary</cite>, trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), Ch. 9, ‘The Law, the Fall &amp; Sin’, pp. 82-99</span></figcaption>

Online</a></div>
</figure><figure class="quote" id="q-bf93ad94bf" data-kw="">
<blockquote><p>If Adam by his great sin condemned all the human race in common, can an infant be born otherwise than condemned? And through whom except Christ is he freed from this condemnation? And if even in Lazarus he says that mortality, cast out from eternity, loved the world of the dead, who of mortals is not touched by this fault and mischance by which the first man fell from everlasting life, which he would have received if he had not sinned? If the Devil made mortal all who could have been immortal, why do even infants die if they are not subject to the sin of the first man? And even infants be saved from the power of death except through Him in whom all shall be made to live?</p></blockquote>

<blockquote><p>…the problem of the promises given under the covenant of works and the meaning of the “life” promised to Adam in return for obedience – perpetual, yes, but would it be heavenly or earthly? The[re was a] fairly radical disagreement on the issue between such eminent thinkers as Thomas Goodwin, John Cameron, Moise Amyraut, John Ball, and Johannes Marckius on the side of an earthly reward, and Francis Turretin, J.H. Heidegger, the Formula Consensus Helvetica, Thomas Boston and Thomas Ridgley on the side of a heavenly reward.</p></blockquote>

</figure><figure class="quote" id="q-d2b2d7251f" data-kw="covenant of nature works">
<blockquote><p>The covenant of nature is that which God the Creator made with innocent man as his creature, concerning the giving of eternal happiness and life under the condition of perfect and personal obedience. It is called “natural,” not from natural obligation (which God does not have towards man), but because it is founded on the nature of man (as it was at first created by God) and on his integrity or powers. It is also called “legal” because the condition on man’s part was the observation of the law of nature engraved within him; and of “works” because it depended upon works or his proper obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.3.5</span></figcaption>

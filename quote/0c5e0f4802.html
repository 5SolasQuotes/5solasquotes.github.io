<main class="wrap"><figure class="quote" id="q-0c5e0f4802" data-kw="">
<blockquote><p>I also adduced another passage in which Isaiah exclaims: “‘Hear My words, and your soul shall live; and I will make an everlasting covenant with you, even the sure mercies of David. Behold, I have given Him for a witness to the people: nations which know not Thee shall call on Thee; peoples who know not Thee shall escape to Thee, because of thy God, the Holy One of Israel; for He has glorified Thee.’ This same law you have despised, and His new holy covenant you have slighted; and now you neither receive it, nor repent of your evil deeds. ‘For your ears are closed, your eyes are blinded, and the heart is hardened,’ Jeremiah has cried; yet not even then do you listen. The Lawgiver is present, yet you do not see Him; to the poor the Gospel is preached, the blind see, yet you do not understand. You have now need of a second circumcision, though you glory greatly in the flesh. The new law requires you to keep perpetual sabbath, and you, because you are idle for one day, suppose you are pious, not discerning why this has been commanded you: and if you eat unleavened bread, you say the will of God has been fulfilled. The Lord our God does not take pleasure in such observances: if there is any perjured person or a thief among you, let him cease to be so; if any adulterer, let him repent; then he has kept the sweet and true sabbaths of God. If any one has impure hands, let him wash and be pure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/justin-martyr.html">Justin Martyr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dialogue with Trypho the Jew</cite>, ch. 12.</span></figcaption>

</figure><figure class="quote" id="q-4a766fb798" data-kw="">
<blockquote><p>Can you imagine that the omniscient and righteous Judge of all the earth will take no notice of you or that He who is “of purer eyes than to behold evil, and canst not look on iniquity” (Hab. 1:13) but with infinite abhorrence will suffer you to sin against Him with impunity? Oh, how inexpressibly dreadful will your condition be if you remain asleep in your sinfulness and misery till everlasting fire, prepared for the devil and his angels, awakens you! Alarmed by the terrors of the fiery law, let your heart be won to the compassionate Savior by the mild accents of the blessed gospel. In the glorious gospel, Jesus, with His meritorious righteousness and His great salvation, is freely and wholly and particularly offered to you as a lost sinner of mankind; and the unlimited and authentic offer affords you a right to receive and trust in Him for complete salvation. Oh, do not any longer despise this unspeakable, this inestimably precious gift! Come to the Lord Jesus, and He will in no wise cast you out. Believe in the dear Redeemer, and you shall never perish but have eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 126.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-8aca6d5ca8" data-kw="">
<blockquote><p>The form of this Covenant stands in gracious and free promises of all good to be repaired, restored, augmented, and a restipulation of such duties as will stand with free grace and mercy. For the Covenant of Grace does not exclude all conditions, but such as will not stand with grace. The Covenant which was made of free love, when we lay wallowing in our blood, and which calls for nothing at our hands but what comes from, and shall be rewarded of mere grace, is a Covenant of grace, though it be conditional. So the pardon of sin is given of grace, and not for works, though pardon be granted only to the penitent, and faith on our part, a lively, unfained and working faith be required to receive the promise. …The obligation of man to God is of double right and debt: but it is of rich grace and abundant love, that God does bind himself unto man. God does promise in this Covenant to be God and Father by right of redemption, and Christ to be Savior of them that believe in God by Him, and in faith do yield sincere, uniform, willing, upright and constant obedience unto his Commandments. Jer. 31:31-33; Dt. 31:6; Eze. 36:25-26; Gen. 15:1, 4-5; Jer. 32:40 &amp; 33:9; Heb. 8:10-12; Isa. 54:7; Hos. 2:19. The stipulation required is that we take God to be our God, that is, that we repent of our iniquities, believe the promises of mercy and embrace them with the whole heart, and yield love, fear, reverence, worship, and obedience unto Him, according to the prescript rule of his Word. Repentance is called for in this Covenant, as it sets forth the subject capable of salvation by faith, but is itself only an acknowledgement of sin, no healing of our wound, or cause of our acquittance. The feeling of pain and sickness causes a man to desire and seek remedy, but it is no remedy itself. (Lk. 13:5; Acts 11:18; 2 Cor. 7, 10; Eze. 18:27) Hunger and thirst make a man to desire and seek for food, but a man is not fed by being hungry. By repentance we know ourselves, we feel our sickness, we hunger and thirst after grace, but the hand which we stretch forth to receive it, is faith alone, without which repentance is nothing but darkness and despair. Repentance is the condition of faith and the qualification of a person capable of salvation: but faith alone is the cause of justification and salvation, on our part required. It is a penitent and petitioning faith, whereby we receive the promises of mercy, but we are not justified partly by prayer, partly by repentance, and partly by faith, but by that faith which stirs up godly sorrow for sin, and enforces us to pray for pardon and salvation. Faith is a necessary and lively instrument of justification, which is amongst the number of true causes, not being a cause without which the thing is not done, but a cause whereby it is done. The cause without which a thing is not done, is only present in the action, and does nothing therein: But as the eye is an active instrument for seeing, and the care for hearing, so is faith also for justifying. If it be demanded whose instrument it is? It is the instrument of the soul, wrought therein by the Holy Ghost, and is the free gift of God. In the Covenant of works, works were required as the cause of life and happiness: but in the Covenant of grace, though repentance be necessary and must accompany faith, yet not repentance, but faith only is the cause of life. The cause not efficient, as works should have been, if man had stood in the former Covenant, but instrumental only: for it is impossible that Christ, the death and blood of Christ, and our faith should be together the efficient or procuring causes of justification or salvation. Obedience to all God’s commandments is covenanted (Dt. 7:1• &amp; 10, 12; Jer. 7:23; Lev. 19:17-18; Lk. 10:27; Mk. 12:30), not as the cause of life, but as the qualification and effect of faith, and as the way to life. Faith that embraces life is obedient and fruitful in all good works; but in one sort faith is the cause of obedience and good works, and in another of justification and eternal life. These it seeks in the promises of the covenant; those it works and produces, as the cause does the effect. Faith was the efficient cause of that precious oblation in Abel (Heb. 11:4, 7, etc.), of reverence and preparing the ark in Noah, of obedience in Abraham; but it was the instrument only of their justification. For it does not justify as it produces good works, but as it receives Christ, though it cannot receive Christ unless it brings forth good works. A disposition to good works is necessary to justification, being the qualification of an active and lively faith. Good works of all sorts are necessary to our continuance in the state of justification, and so to our final absolution, if God give opportunity; but they are not the cause of, but only a preceding qualification or condition to final forgiveness and eternal bliss. If then, when we speak of the conditions of the covenant of grace, by “condition” we understand whatsoever is required on our part, as precedent, concomitant, or subsequent to justification, repentance, faith, and obedience are all conditions; but if by “condition” we understand what is required on our part as the cause of the good promised, though only instrumental, faith or belief in the promises of free mercy is the only condition. Faith and works are opposed in the matter of justification and salvation in the covenant, not that they cannot stand together in the same subject—for they are inseparably united—but because they cannot concur or meet together in one and the same court to the justification or absolution of man. For in the court of justice, according to the first covenant, either being just he is acquitted, or unjust he is condemned; but in the court of mercy, if you receive the promise of pardon, which is done by a lively faith, you are acquitted and set free, and accepted as just and righteous; but if you do not believe, you are sent over to the court of justice. Obedience is twofold: [1] Perfect in measure and degree—this is so far required that, if it be not performed, we must acknowledge our sin in coming short. And this God is pleased to exact at our hands, that we might walk in humility before him, strive after perfection, and freely acknowledge his rich grace and mercy in accepting and rewarding the best service we can render to his Highness, when in the court of justice it deserves to be rejected. [2] Sincere, uniform, and constant, though imperfect in measure and degree; and this is so necessary that without it there is no salvation to be expected. The covenant of grace calls for perfection, yet accepts sincerity, God in mercy pardoning the imperfections of our best performances. If perfection were rigidly exacted, no flesh could be saved; if it were not at all commanded, imperfection would not be sin, nor would perfection be something to be labored after. The faith that is lively to embrace mercy is ever joined with an unfeigned purpose to walk in all well-pleasing, and the sincere performance of all holy obedience, as opportunity is offered, ever attends that faith by which we continually lay hold upon the promises once embraced. Actual good works of all sorts (though not perfect in degree) are necessary to the continuance of actual justification, because faith can no longer lay faithful claim to the promises of life than it does virtually or actually lead us forward in the way to heaven. For if we say we have fellowship with God and walk in darkness, we lie and do not the truth; but if we walk in the light, as he is in the light, we have fellowship one with another (1 John 1:6–7). This walking in the light, as He is in the light, is that qualification whereby we become immediately capable of Christ’s righteousness, or actual participants of his propitiation, which is the sole immediate cause of our justification, taken for remission of sins or actual approbation with God. The truth of this doctrine St. John likewise ratifies in terms equivalent in the words immediately following: “And the blood of Christ cleanses us (walking in the light as God is in the light) from all sin.” (1 Jn. 1:7) But of these things more fully in their several degrees, as this covenant has been revealed. In this covenant man promises to repent of his sins, and, repenting, to cleave to the promise of mercy made in Jesus Christ, and in faith to yield willing, cheerful, and continual obedience. In contracts among men, one may ask more and another bid less, and yet they may come to agreement; but it is altogether fruitless for men to think of entering into covenant with God if they are not resolved to obey in all things. The practice of all God’s people who have ever made covenant with Him expressly declares as much when they solemnly entered into or renewed their covenant. For thus they promise: “Whatever the Lord says, that we will do” (Exod. 24:3, 7). The people said to Joshua, “The Lord our God we will serve, and his voice we will obey” (Josh. 24:23). And they entered into a covenant to seek the Lord God of their fathers with all their heart and with all their soul, so that whoever would not seek the Lord God of Israel should be put to death, whether small or great, whether man or woman (2 Chron. 15:12–13). And the king stood by the pillar and made a covenant before the Lord to walk after the Lord, and to keep his commandments, his testimonies, and his statutes with all his heart and all his soul, to perform the words of this covenant that were written in this book; and all the people stood to the covenant (2 Chron. 34:31; 2 Kings 23:3). They entered into a curse and into an oath to walk in God’s law, which was given by Moses the servant of God, and to observe and do all the commandments of the Lord our God, and his judgments and his statutes (Neh. 10:29). And thus runs the exhortation of Joshua to the two tribes and a half when he sent them home: “Take diligent heed to do the commandments of the law, which Moses the servant of the Lord charged you, to love the Lord your God, and to walk in all his ways, and to keep his commandments, and to cleave to him, and to serve him with all your heart and with all your soul” (Josh. 22:5). This must not be understood as if one who, through frailty and infirmity, offends in any one jot or tittle should be counted a covenant-breaker; for then no man would be innocent. Rather, the promise must be interpreted according to the rule of obedience given, which calls for perfection but accepts sincerity. In the covenant of mercy we bind ourselves to believe and rest upon God with the whole heart, so that doubting or distrust arising from weakness and infirmity must indeed be acknowledged as sin, yet every such frailty does not prove the person to be a transgressor of the covenant. The same holds true of obedience. But of this more fully when treating the particular manner in which God has been pleased to administer this covenant. Man, then, promises to serve the Lord and to cleave to him alone, which is both a duty owed and a special prerogative; and he also restipulates, or humbly entreats, that God would be mindful of his holy covenant or testimony—that he would be his God, his portion, his protector, and his rich reward. These things are so linked together in the covenant that we must conceive the promise of God, in order of nature, to go before the promise and obedience of man, and to be the ground of faith by which the promised mercy is received. The offer of mercy is made to man as an unbeliever, that he might return; and the promise must be conceived before we can believe, otherwise we would believe we know not what, and faith would hang in the air without any foundation. But the mercy offered is embraced by faith and granted to him who believes. Moreover, the duty which God requires and man promises is indeed man’s duty, yet given by God. By grace man is enabled and effectually drawn to do what God commands. The covenant could not be of grace, nor the good things covenanted, if man by his own strength did or could perform what God requires. This Covenant was first published and made known by lively voice: afterwards it was committed to writing, the tables thereof being the holy Scripture. It was made both by word and oath (Ps. 85:4, 35; Dt. 29:12, 14; Isa. 54:9; Heb. 6:17-18; Gen. 22:16; Lk. 1:72), to demonstrate the certainty and constancy thereof: and sealed by the sacraments, which on God’s part do confirm the promise made by Him: and on man’s part are bills obligatory or hand-writings, whereby they testify and bind themselves to the performance of their duty. … Externally this covenant is made with every member of the Church, even with the parents and their children, so many as hear and embrace the promises of salvation, and give and dedicate their children unto God according to his direction; for the sacraments—what are they but seals of the covenant? But savingly, effectually, and in a special manner it is made only with them who are partakers of the benefits promised. And as the covenant is made outwardly or effectually, so some are the people of God externally, others internally and in truth. For they are the people of God with whom God has contracted a covenant, and who in like manner have sworn to the words of the covenant, God stipulating and the people receiving the condition; which is done two ways: [1] for either the covenant is made extrinsically, God by some sensible token gathering the people, and the people embracing the condition in the same manner, and so an external consociation of God and the people is made; [2] or the covenant is entered after an invisible manner, by the intervention of the Spirit, and that with so great efficacy that the condition of the covenant is received after an invisible manner, and so an internal consociation of God and the people is made up.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’, pp. 17-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>
<div class="actions"><button class="copy" data-copy="“The form of this Covenant stands in gracious and free promises of all good to be repaired, restored, augmented, and a restipulation of such duties as will stand with free grace and mercy. For the Covenant of Grace does not exclude all conditions, but such as will not stand with grace. The Covenant which was made of free love, when we lay wallowing in our blood, and which calls for nothing at our hands but what comes from, and shall be rewarded of mere grace, is a Covenant of grace, though it be conditional. So the pardon of sin is given of grace, and not for works, though pardon be granted only to the penitent, and faith on our part, a lively, unfained and working faith be required to receive the promise. …The obligation of man to God is of double right and debt: but it is of rich grace and abundant love, that God does bind himself unto man. God does promise in this Covenant to be God and Father by right of redemption, and Christ to be Savior of them that believe in God by Him, and in faith do yield sincere, uniform, willing, upright and constant obedience unto his Commandments. Jer. 31:31-33; Dt. 31:6; Eze. 36:25-26; Gen. 15:1, 4-5; Jer. 32:40 &amp; 33:9; Heb. 8:10-12; Isa. 54:7; Hos. 2:19. The stipulation required is that we take God to be our God, that is, that we repent of our iniquities, believe the promises of mercy and embrace them with the whole heart, and yield love, fear, reverence, worship, and obedience unto Him, according to the prescript rule of his Word. Repentance is called for in this Covenant, as it sets forth the subject capable of salvation by faith, but is itself only an acknowledgement of sin, no healing of our wound, or cause of our acquittance. The feeling of pain and sickness causes a man to desire and seek remedy, but it is no remedy itself. (Lk. 13:5; Acts 11:18; 2 Cor. 7, 10; Eze. 18:27) Hunger and thirst make a man to desire and seek for food, but a man is not fed by being hungry. By repentance we know ourselves, we feel our sickness, we hunger and thirst after grace, but the hand which we stretch forth to receive it, is faith alone, without which repentance is nothing but darkness and despair. Repentance is the condition of faith and the qualification of a person capable of salvation: but faith alone is the cause of justification and salvation, on our part required. It is a penitent and petitioning faith, whereby we receive the promises of mercy, but we are not justified partly by prayer, partly by repentance, and partly by faith, but by that faith which stirs up godly sorrow for sin, and enforces us to pray for pardon and salvation. Faith is a necessary and lively instrument of justification, which is amongst the number of true causes, not being a cause without which the thing is not done, but a cause whereby it is done. The cause without which a thing is not done, is only present in the action, and does nothing therein: But as the eye is an active instrument for seeing, and the care for hearing, so is faith also for justifying. If it be demanded whose instrument it is? It is the instrument of the soul, wrought therein by the Holy Ghost, and is the free gift of God. In the Covenant of works, works were required as the cause of life and happiness: but in the Covenant of grace, though repentance be necessary and must accompany faith, yet not repentance, but faith only is the cause of life. The cause not efficient, as works should have been, if man had stood in the former Covenant, but instrumental only: for it is impossible that Christ, the death and blood of Christ, and our faith should be together the efficient or procuring causes of justification or salvation. Obedience to all God’s commandments is covenanted (Dt. 7:1• &amp; 10, 12; Jer. 7:23; Lev. 19:17-18; Lk. 10:27; Mk. 12:30), not as the cause of life, but as the qualification and effect of faith, and as the way to life. Faith that embraces life is obedient and fruitful in all good works; but in one sort faith is the cause of obedience and good works, and in another of justification and eternal life. These it seeks in the promises of the covenant; those it works and produces, as the cause does the effect. Faith was the efficient cause of that precious oblation in Abel (Heb. 11:4, 7, etc.), of reverence and preparing the ark in Noah, of obedience in Abraham; but it was the instrument only of their justification. For it does not justify as it produces good works, but as it receives Christ, though it cannot receive Christ unless it brings forth good works. A disposition to good works is necessary to justification, being the qualification of an active and lively faith. Good works of all sorts are necessary to our continuance in the state of justification, and so to our final absolution, if God give opportunity; but they are not the cause of, but only a preceding qualification or condition to final forgiveness and eternal bliss. If then, when we speak of the conditions of the covenant of grace, by “condition” we understand whatsoever is required on our part, as precedent, concomitant, or subsequent to justification, repentance, faith, and obedience are all conditions; but if by “condition” we understand what is required on our part as the cause of the good promised, though only instrumental, faith or belief in the promises of free mercy is the only condition. Faith and works are opposed in the matter of justification and salvation in the covenant, not that they cannot stand together in the same subject—for they are inseparably united—but because they cannot concur or meet together in one and the same court to the justification or absolution of man. For in the court of justice, according to the first covenant, either being just he is acquitted, or unjust he is condemned; but in the court of mercy, if you receive the promise of pardon, which is done by a lively faith, you are acquitted and set free, and accepted as just and righteous; but if you do not believe, you are sent over to the court of justice. Obedience is twofold: [1] Perfect in measure and degree—this is so far required that, if it be not performed, we must acknowledge our sin in coming short. And this God is pleased to exact at our hands, that we might walk in humility before him, strive after perfection, and freely acknowledge his rich grace and mercy in accepting and rewarding the best service we can render to his Highness, when in the court of justice it deserves to be rejected. [2] Sincere, uniform, and constant, though imperfect in measure and degree; and this is so necessary that without it there is no salvation to be expected. The covenant of grace calls for perfection, yet accepts sincerity, God in mercy pardoning the imperfections of our best performances. If perfection were rigidly exacted, no flesh could be saved; if it were not at all commanded, imperfection would not be sin, nor would perfection be something to be labored after. The faith that is lively to embrace mercy is ever joined with an unfeigned purpose to walk in all well-pleasing, and the sincere performance of all holy obedience, as opportunity is offered, ever attends that faith by which we continually lay hold upon the promises once embraced. Actual good works of all sorts (though not perfect in degree) are necessary to the continuance of actual justification, because faith can no longer lay faithful claim to the promises of life than it does virtually or actually lead us forward in the way to heaven. For if we say we have fellowship with God and walk in darkness, we lie and do not the truth; but if we walk in the light, as he is in the light, we have fellowship one with another (1 John 1:6–7). This walking in the light, as He is in the light, is that qualification whereby we become immediately capable of Christ’s righteousness, or actual participants of his propitiation, which is the sole immediate cause of our justification, taken for remission of sins or actual approbation with God. The truth of this doctrine St. John likewise ratifies in terms equivalent in the words immediately following: “And the blood of Christ cleanses us (walking in the light as God is in the light) from all sin.” (1 Jn. 1:7) But of these things more fully in their several degrees, as this covenant has been revealed. In this covenant man promises to repent of his sins, and, repenting, to cleave to the promise of mercy made in Jesus Christ, and in faith to yield willing, cheerful, and continual obedience. In contracts among men, one may ask more and another bid less, and yet they may come to agreement; but it is altogether fruitless for men to think of entering into covenant with God if they are not resolved to obey in all things. The practice of all God’s people who have ever made covenant with Him expressly declares as much when they solemnly entered into or renewed their covenant. For thus they promise: “Whatever the Lord says, that we will do” (Exod. 24:3, 7). The people said to Joshua, “The Lord our God we will serve, and his voice we will obey” (Josh. 24:23). And they entered into a covenant to seek the Lord God of their fathers with all their heart and with all their soul, so that whoever would not seek the Lord God of Israel should be put to death, whether small or great, whether man or woman (2 Chron. 15:12–13). And the king stood by the pillar and made a covenant before the Lord to walk after the Lord, and to keep his commandments, his testimonies, and his statutes with all his heart and all his soul, to perform the words of this covenant that were written in this book; and all the people stood to the covenant (2 Chron. 34:31; 2 Kings 23:3). They entered into a curse and into an oath to walk in God’s law, which was given by Moses the servant of God, and to observe and do all the commandments of the Lord our God, and his judgments and his statutes (Neh. 10:29). And thus runs the exhortation of Joshua to the two tribes and a half when he sent them home: “Take diligent heed to do the commandments of the law, which Moses the servant of the Lord charged you, to love the Lord your God, and to walk in all his ways, and to keep his commandments, and to cleave to him, and to serve him with all your heart and with all your soul” (Josh. 22:5). This must not be understood as if one who, through frailty and infirmity, offends in any one jot or tittle should be counted a covenant-breaker; for then no man would be innocent. Rather, the promise must be interpreted according to the rule of obedience given, which calls for perfection but accepts sincerity. In the covenant of mercy we bind ourselves to believe and rest upon God with the whole heart, so that doubting or distrust arising from weakness and infirmity must indeed be acknowledged as sin, yet every such frailty does not prove the person to be a transgressor of the covenant. The same holds true of obedience. But of this more fully when treating the particular manner in which God has been pleased to administer this covenant. Man, then, promises to serve the Lord and to cleave to him alone, which is both a duty owed and a special prerogative; and he also restipulates, or humbly entreats, that God would be mindful of his holy covenant or testimony—that he would be his God, his portion, his protector, and his rich reward. These things are so linked together in the covenant that we must conceive the promise of God, in order of nature, to go before the promise and obedience of man, and to be the ground of faith by which the promised mercy is received. The offer of mercy is made to man as an unbeliever, that he might return; and the promise must be conceived before we can believe, otherwise we would believe we know not what, and faith would hang in the air without any foundation. But the mercy offered is embraced by faith and granted to him who believes. Moreover, the duty which God requires and man promises is indeed man’s duty, yet given by God. By grace man is enabled and effectually drawn to do what God commands. The covenant could not be of grace, nor the good things covenanted, if man by his own strength did or could perform what God requires. This Covenant was first published and made known by lively voice: afterwards it was committed to writing, the tables thereof being the holy Scripture. It was made both by word and oath (Ps. 85:4, 35; Dt. 29:12, 14; Isa. 54:9; Heb. 6:17-18; Gen. 22:16; Lk. 1:72), to demonstrate the certainty and constancy thereof: and sealed by the sacraments, which on God’s part do confirm the promise made by Him: and on man’s part are bills obligatory or hand-writings, whereby they testify and bind themselves to the performance of their duty. … Externally this covenant is made with every member of the Church, even with the parents and their children, so many as hear and embrace the promises of salvation, and give and dedicate their children unto God according to his direction; for the sacraments—what are they but seals of the covenant? But savingly, effectually, and in a special manner it is made only with them who are partakers of the benefits promised. And as the covenant is made outwardly or effectually, so some are the people of God externally, others internally and in truth. For they are the people of God with whom God has contracted a covenant, and who in like manner have sworn to the words of the covenant, God stipulating and the people receiving the condition; which is done two ways: [1] for either the covenant is made extrinsically, God by some sensible token gathering the people, and the people embracing the condition in the same manner, and so an external consociation of God and the people is made; [2] or the covenant is entered after an invisible manner, by the intervention of the Spirit, and that with so great efficacy that the condition of the covenant is received after an invisible manner, and so an internal consociation of God and the people is made up.”

— John Ball, A Treatise of the Covenant of Grace… (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’, pp. 17-24">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+form+of+this+Covenant+stands+in+gracious+and+free+promises+of+all+good+to+be+repaired%2C+restored%2C+augmented%2C+and+a+restipulation+of+such+duties+as+will+stand+with+free+grace+and+mercy.+For+the+Covenant+of+Grace+does+not+exclude+all+conditions%2C+but+such+as+will+not+stand+with+grace.+The+Covenant+which+was+made+of+free+love%2C+when+we+lay+wallowing+in+our+blood%2C+and+which+calls+for+nothing+at+our+hands+but+what+comes+from%2C+and+shall+be+rewarded+of+mere+grace%2C+is+a+Covenant+of+grace%2C+though+it+be+conditional.+So+the+pardon+of+sin+is+given+of+grace%2C+and+not+for+works%2C+though+pardon+be+granted+only+to+the+penitent%2C+and+faith+on+our+part%2C+a+lively%2C+unfained+and+working+faith+be+required+to+receive+the+promise.+%E2%80%A6The+obligation+of+man+to+God+is+of+double+right+and+debt%3A+but+it+is+of+rich+grace+and+abundant+love%2C+that+God+does+bind+himself+unto+man.+God+does+promise+in+this+Covenant+to+be+God+and+Father+by+right+of+redemption%2C+and+Christ+to+be+Savior+of+them+that+believe+in+God+by+Him%2C+and+in+faith+do+yield+sincere%2C+uniform%2C+willing%2C+upright+and+constant+obedience+unto+his+Commandments.+Jer.+31%3A31-33%3B+Dt.+31%3A6%3B+Eze.+36%3A25-26%3B+Gen.+15%3A1%2C+4-5%3B+Jer.+32%3A40+%26+33%3A9%3B+Heb.+8%3A10-12%3B+Isa.+54%3A7%3B+Hos.+2%3A19.+The+stipulation+required+is+that+we+take+God+to+be+our+God%2C+that+is%2C+that+we+repent+of+our+iniquities%2C+believe+the+promises+of+mercy+and+embrace+them+with+the+whole+heart%2C+and+yield+love%2C+fear%2C+reverence%2C+worship%2C+and+obedience+unto+Him%2C+according+to+the+prescript+rule+of+his+Word.+Repentance+is+called+for+in+this+Covenant%2C+as+it+sets+forth+the+subject+capable+of+salvation+by+faith%2C+but+is+itself+only+an+acknowledgement+of+sin%2C+no+healing+of+our+wound%2C+or+cause+of+our+acquittance.+The+feeling+of+pain+and+sickness+causes+a+man+to+desire+and+seek+remedy%2C+but+it+is+no+remedy+itself.+%28Lk.+13%3A5%3B+Acts+11%3A18%3B+2+Cor.+7%2C+10%3B+Eze.+18%3A27%29+Hunger+and+thirst+make+a+man+to+desire+and+seek+for+food%2C+but+a+man+is+not+fed+by+being+hungry.+By+repentance+we+know+ourselves%2C+we+feel+our+sickness%2C+we+hunger+and+thirst+after+grace%2C+but+the+hand+which+we+stretch+forth+to+receive+it%2C+is+faith+alone%2C+without+which+repentance+is+nothing+but+darkness+and+despair.+Repentance+is+the+condition+of+faith+and+the+qualification+of+a+person+capable+of+salvation%3A+but+faith+alone+is+the+cause+of+justification+and+salvation%2C+on+our+part+required.+It+is+a+penitent+and+petitioning+faith%2C+whereby+we+receive+the+promises+of+mercy%2C+but+we+are+not+justified+partly+by+prayer%2C+partly+by+repentance%2C+and+partly+by+faith%2C+but+by+that+faith+which+stirs+up+godly+sorrow+for+sin%2C+and+enforces+us+to+pray+for+pardon+and+salvation.+Faith+is+a+necessary+and+lively+instrument+of+justification%2C+which+is+amongst+the+number+of+true+causes%2C+not+being+a+cause+without+which+the+thing+is+not+done%2C+but+a+cause+whereby+it+is+done.+The+cause+without+which+a+thing+is+not+done%2C+is+only+present+in+the+action%2C+and+does+nothing+therein%3A+But+as+the+eye+is+an+active+instrument+for+seeing%2C+and+the+care+for+hearing%2C+so+is+faith+also+for+justifying.+If+it+be+demanded+whose+instrument+it+is%3F+It+is+the+instrument+of+the+soul%2C+wrought+therein+by+the+Holy+Ghost%2C+and+is+the+free+gift+of+God.+In+the+Covenant+of+works%2C+works+were+required+as+the+cause+of+life+and+happiness%3A+but+in+the+Covenant+of+grace%2C+though+repentance+be+necessary+and+must+accompany+faith%2C+yet+not+repentance%2C+but+faith+only+is+the+cause+of+life.+The+cause+not+efficient%2C+as+works+should+have+been%2C+if+man+had+stood+in+the+former+Covenant%2C+but+instrumental+only%3A+for+it+is+impossible+that+Christ%2C+the+death+and+blood+of+Christ%2C+and+our+faith+should+be+together+the+efficient+or+procuring+causes+of+justification+or+salvation.+Obedience+to+all+God%E2%80%99s+commandments+is+covenanted+%28Dt.+7%3A1%E2%80%A2+%26+10%2C+12%3B+Jer.+7%3A23%3B+Lev.+19%3A17-18%3B+Lk.+10%3A27%3B+Mk.+12%3A30%29%2C+not+as+the+cause+of+life%2C+but+as+the+qualification+and+effect+of+faith%2C+and+as+the+way+to+life.+Faith+that+embraces+life+is+obedient+and+fruitful+in+all+good+works%3B+but+in+one+sort+faith+is+the+cause+of+obedience+and+good+works%2C+and+in+another+of+justification+and+eternal+life.+These+it+seeks+in+the+promises+of+the+covenant%3B+those+it+works+and+produces%2C+as+the+cause+does+the+effect.+Faith+was+the+efficient+cause+of+that+precious+oblation+in+Abel+%28Heb.+11%3A4%2C+7%2C+etc.%29%2C+of+reverence+and+preparing+the+ark+in+Noah%2C+of+obedience+in+Abraham%3B+but+it+was+the+instrument+only+of+their+justification.+For+it+does+not+justify+as+it+produces+good+works%2C+but+as+it+receives+Christ%2C+though+it+cannot+receive+Christ+unless+it+brings+forth+good+works.+A+disposition+to+good+works+is+necessary+to+justification%2C+being+the+qualification+of+an+active+and+lively+faith.+Good+works+of+all+sorts+are+necessary+to+our+continuance+in+the+state+of+justification%2C+and+so+to+our+final+absolution%2C+if+God+give+opportunity%3B+but+they+are+not+the+cause+of%2C+but+only+a+preceding+qualification+or+condition+to+final+forgiveness+and+eternal+bliss.+If+then%2C+when+we+speak+of+the+conditions+of+the+covenant+of+grace%2C+by+%E2%80%9Ccondition%E2%80%9D+we+understand+whatsoever+is+required+on+our+part%2C+as+precedent%2C+concomitant%2C+or+subsequent+to+justification%2C+repentance%2C+faith%2C+and+obedience+are+all+conditions%3B+but+if+by+%E2%80%9Ccondition%E2%80%9D+we+understand+what+is+required+on+our+part+as+the+cause+of+the+good+promised%2C+though+only+instrumental%2C+faith+or+belief+in+the+promises+of+free+mercy+is+the+only+condition.+Faith+and+works+are+opposed+in+the+matter+of+justification+and+salvation+in+the+covenant%2C+not+that+they+cannot+stand+together+in+the+same+subject%E2%80%94for+they+are+inseparably+united%E2%80%94but+because+they+cannot+concur+or+meet+together+in+one+and+the+same+court+to+the+justification+or+absolution+of+man.+For+in+the+court+of+justice%2C+according+to+the+first+covenant%2C+either+being+just+he+is+acquitted%2C+or+unjust+he+is+condemned%3B+but+in+the+court+of+mercy%2C+if+you+receive+the+promise+of+pardon%2C+which+is+done+by+a+lively+faith%2C+you+are+acquitted+and+set+free%2C+and+accepted+as+just+and+righteous%3B+but+if+you+do+not+believe%2C+you+are+sent+over+to+the+court+of+justice.+Obedience+is+twofold%3A+%5B1%5D+Perfect+in+measure+and+degree%E2%80%94this+is+so+far+required+that%2C+if+it+be+not+performed%2C+we+must+acknowledge+our+sin+in+coming+short.+And+this+God+is+pleased+to+exact+at+our+hands%2C+that+we+might+walk+in+humility+before+him%2C+strive+after+perfection%2C+and+freely+acknowledge+his+rich+grace+and+mercy+in+accepting+and+rewarding+the+best+service+we+can+render+to+his+Highness%2C+when+in+the+court+of+justice+it+deserves+to+be+rejected.+%5B2%5D+Sincere%2C+uniform%2C+and+constant%2C+though+imperfect+in+measure+and+degree%3B+and+this+is+so+necessary+that+without+it+there+is+no+salvation+to+be+expected.+The+covenant+of+grace+calls+for+perfection%2C+yet+accepts+sincerity%2C+God+in+mercy+pardoning+the+imperfections+of+our+best+performances.+If+perfection+were+rigidly+exacted%2C+no+flesh+could+be+saved%3B+if+it+were+not+at+all+commanded%2C+imperfection+would+not+be+sin%2C+nor+would+perfection+be+something+to+be+labored+after.+The+faith+that+is+lively+to+embrace+mercy+is+ever+joined+with+an+unfeigned+purpose+to+walk+in+all+well-pleasing%2C+and+the+sincere+performance+of+all+holy+obedience%2C+as+opportunity+is+offered%2C+ever+attends+that+faith+by+which+we+continually+lay+hold+upon+the+promises+once+embraced.+Actual+good+works+of+all+sorts+%28though+not+perfect+in+degree%29+are+necessary+to+the+continuance+of+actual+justification%2C+because+faith+can+no+longer+lay+faithful+claim+to+the+promises+of+life+than+it+does+virtually+or+actually+lead+us+forward+in+the+way+to+heaven.+For+if+we+say+we+have+fellowship+with+God+and+walk+in+darkness%2C+we+lie+and+do+not+the+truth%3B+but+if+we+walk+in+the+light%2C+as+he+is+in+the+light%2C+we+have+fellowship+one+with+another+%281+John+1%3A6%E2%80%937%29.+This+walking+in+the+light%2C+as+He+is+in+the+light%2C+is+that+qualification+whereby+we+become+immediately+capable+of+Christ%E2%80%99s+righteousness%2C+or+actual+participants+of+his+propitiation%2C+which+is+the+sole+immediate+cause+of+our+justification%2C+taken+for+remission+of+sins+or+actual+approbation+with+God.+The+truth+of+this+doctrine+St.+John+likewise+ratifies+in+terms+equivalent+in+the+words+immediately+following%3A+%E2%80%9CAnd+the+blood+of+Christ+cleanses+us+%28walking+in+the+light+as+God+is+in+the+light%29+from+all+sin.%E2%80%9D+%281+Jn.+1%3A7%29+But+of+these+things+more+fully+in+their+several+degrees%2C+as+this+covenant+has+been+revealed.+In+this+covenant+man+promises+to+repent+of+his+sins%2C+and%2C+repenting%2C+to+cleave+to+the+promise+of+mercy+made+in+Jesus+Christ%2C+and+in+faith+to+yield+willing%2C+cheerful%2C+and+continual+obedience.+In+contracts+among+men%2C+one+may+ask+more+and+another+bid+less%2C+and+yet+they+may+come+to+agreement%3B+but+it+is+altogether+fruitless+for+men+to+think+of+entering+into+covenant+with+God+if+they+are+not+resolved+to+obey+in+all+things.+The+practice+of+all+God%E2%80%99s+people+who+have+ever+made+covenant+with+Him+expressly+declares+as+much+when+they+solemnly+entered+into+or+renewed+their+covenant.+For+thus+they+promise%3A+%E2%80%9CWhatever+the+Lord+says%2C+that+we+will+do%E2%80%9D+%28Exod.+24%3A3%2C+7%29.+The+people+said+to+Joshua%2C+%E2%80%9CThe+Lord+our+God+we+will+serve%2C+and+his+voice+we+will+obey%E2%80%9D+%28Josh.+24%3A23%29.+And+they+entered+into+a+covenant+to+seek+the+Lord+God+of+their+fathers+with+all+their+heart+and+with+all+their+soul%2C+so+that+whoever+would+not+seek+the+Lord+God+of+Israel+should+be+put+to+death%2C+whether+small+or+great%2C+whether+man+or+woman+%282+Chron.+15%3A12%E2%80%9313%29.+And+the+king+stood+by+the+pillar+and+made+a+covenant+before+the+Lord+to+walk+after+the+Lord%2C+and+to+keep+his+commandments%2C+his+testimonies%2C+and+his+statutes+with+all+his+heart+and+all+his+soul%2C+to+perform+the+words+of+this+covenant+that+were+written+in+this+book%3B+and+all+the+people+stood+to+the+covenant+%282+Chron.+34%3A31%3B+2+Kings+23%3A3%29.+They+entered+into+a+curse+and+into+an+oath+to+walk+in+God%E2%80%99s+law%2C+which+was+given+by+Moses+the+servant+of+God%2C+and+to+observe+and+do+all+the+commandments+of+the+Lord+our+God%2C+and+his+judgments+and+his+statutes+%28Neh.+10%3A29%29.+And+thus+runs+the+exhortation+of+Joshua+to+the+two+tribes+and+a+half+when+he+sent+them+home%3A+%E2%80%9CTake+diligent+heed+to+do+the+commandments+of+the+law%2C+which+Moses+the+servant+of+the+Lord+charged+you%2C+to+love+the+Lord+your+God%2C+and+to+walk+in+all+his+ways%2C+and+to+keep+his+commandments%2C+and+to+cleave+to+him%2C+and+to+serve+him+with+all+your+heart+and+with+all+your+soul%E2%80%9D+%28Josh.+22%3A5%29.+This+must+not+be+understood+as+if+one+who%2C+through+frailty+and+infirmity%2C+offends+in+any+one+jot+or+tittle+should+be+counted+a+covenant-breaker%3B+for+then+no+man+would+be+innocent.+Rather%2C+the+promise+must+be+interpreted+according+to+the+rule+of+obedience+given%2C+which+calls+for+perfection+but+accepts+sincerity.+In+the+covenant+of+mercy+we+bind+ourselves+to+believe+and+rest+upon+God+with+the+whole+heart%2C+so+that+doubting+or+distrust+arising+from+weakness+and+infirmity+must+indeed+be+acknowledged+as+sin%2C+yet+every+such+frailty+does+not+prove+the+person+to+be+a+transgressor+of+the+covenant.+The+same+holds+true+of+obedience.+But+of+this+more+fully+when+treating+the+particular+manner+in+which+God+has+been+pleased+to+administer+this+covenant.+Man%2C+then%2C+promises+to+serve+the+Lord+and+to+cleave+to+him+alone%2C+which+is+both+a+duty+owed+and+a+special+prerogative%3B+and+he+also+restipulates%2C+or+humbly+entreats%2C+that+God+would+be+mindful+of+his+holy+covenant+or+testimony%E2%80%94that+he+would+be+his+God%2C+his+portion%2C+his+protector%2C+and+his+rich+reward.+These+things+are+so+linked+together+in+the+covenant+that+we+must+conceive+the+promise+of+God%2C+in+order+of+nature%2C+to+go+before+the+promise+and+obedience+of+man%2C+and+to+be+the+ground+of+faith+by+which+the+promised+mercy+is+received.+The+offer+of+mercy+is+made+to+man+as+an+unbeliever%2C+that+he+might+return%3B+and+the+promise+must+be+conceived+before+we+can+believe%2C+otherwise+we+would+believe+we+know+not+what%2C+and+faith+would+hang+in+the+air+without+any+foundation.+But+the+mercy+offered+is+embraced+by+faith+and+granted+to+him+who+believes.+Moreover%2C+the+duty+which+God+requires+and+man+promises+is+indeed+man%E2%80%99s+duty%2C+yet+given+by+God.+By+grace+man+is+enabled+and+effectually+drawn+to+do+what+God+commands.+The+covenant+could+not+be+of+grace%2C+nor+the+good+things+covenanted%2C+if+man+by+his+own+strength+did+or+could+perform+what+God+requires.+This+Covenant+was+first+published+and+made+known+by+lively+voice%3A+afterwards+it+was+committed+to+writing%2C+the+tables+thereof+being+the+holy+Scripture.+It+was+made+both+by+word+and+oath+%28Ps.+85%3A4%2C+35%3B+Dt.+29%3A12%2C+14%3B+Isa.+54%3A9%3B+Heb.+6%3A17-18%3B+Gen.+22%3A16%3B+Lk.+1%3A72%29%2C+to+demonstrate+the+certainty+and+constancy+thereof%3A+and+sealed+by+the+sacraments%2C+which+on+God%E2%80%99s+part+do+confirm+the+promise+made+by+Him%3A+and+on+man%E2%80%99s+part+are+bills+obligatory+or+hand-writings%2C+whereby+they+testify+and+bind+themselves+to+the+performance+of+their+duty.+%E2%80%A6+Externally+this+covenant+is+made+with+every+member+of+the+Church%2C+even+with+the+parents+and+their+children%2C+so+many+as+hear+and+embrace+the+promises+of+salvation%2C+and+give+and+dedicate+their+children+unto+God+according+to+his+direction%3B+for+the+sacraments%E2%80%94what+are+they+but+seals+of+the+covenant%3F+But+savingly%2C+effectually%2C+and+in+a+special+manner+it+is+made+only+with+them+who+are+partakers+of+the+benefits+promised.+And+as+the+covenant+is+made+outwardly+or+effectually%2C+so+some+are+the+people+of+God+externally%2C+others+internally+and+in+truth.+For+they+are+the+people+of+God+with+whom+God+has+contracted+a+covenant%2C+and+who+in+like+manner+have+sworn+to+the+words+of+the+covenant%2C+God+stipulating+and+the+people+receiving+the+condition%3B+which+is+done+two+ways%3A+%5B1%5D+for+either+the+covenant+is+made+extrinsically%2C+God+by+some+sensible+token+gathering+the+people%2C+and+the+people+embracing+the+condition+in+the+same+manner%2C+and+so+an+external+consociation+of+God+and+the+people+is+made%3B+%5B2%5D+or+the+covenant+is+entered+after+an+invisible+manner%2C+by+the+intervention+of+the+Spirit%2C+and+that+with+so+great+efficacy+that+the+condition+of+the+covenant+is+received+after+an+invisible+manner%2C+and+so+an+internal+consociation+of+God+and+the+people+is+made+up.%E2%80%9D%0A%0A%E2%80%94+John+Ball%2C+A+Treatise+of+the+Covenant+of+Grace%E2%80%A6+%28London%3A+1645%29%2C+ch.+3%2C+%E2%80%98Of+the+Covenant+of+Grace+in+General%E2%80%99%2C+pp.+17-24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8aca6d5ca8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8aca6d5ca8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/in-what-respects-the-covenant-of-grace-is-condition/#:~:text=The%20form%20of%20this%20Covenant%20stands,and%20the%20people%20is%20made%20up&amp;text=The%20form%20of%20this%20Covenant%20stands%20in%20gracious&amp;text=of%20God%20and%20the%20people%20is%20made%20up" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Obs. XXIX. The new covenant is made with them alone who effectually and eventually are made partakers of the grace of it. — “This is the covenant that I will make with them,..... I will be merciful unto their unrighteousness,” etc. Those with whom the old covenant was made were all of them actual partakers of the benefits of it; and if they are not so with whom the new is made, it comes short of the old in efficacy, and may be utterly frustrated. Neither doth the indefinite proposal of the terms of the covenant prove that the covenant is made with them, or any of them, who enjoy not the benefits of it. Indeed this is the excellency of this covenant, and so it is here declared, that it doth effectually communicate all the grace and mercy contained in it unto all and every one with whom it is made; whomsoever it is made withal, his sins are pardoned.</p></blockquote>

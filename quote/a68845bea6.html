<blockquote><p>This chapter shall, therefore, be concluded by a few directions for the observance of the Lord’s day.

1. Let the whole day be consecrated to the service of God, especially in acts of worship, public and private. This weekly recess from worldly cares and avocations, affords a precious opportunity for the study of God’s word, and for the examination of our own hearts. Rise early, and let your first thoughts and aspirations be directed to heaven. Meditate much and profoundly on divine things, and endeavour to acquire a degree of spirituality on this day which will abide with you through the whole week.

2. Consider the Lord’s day an honour and delight. Let your heart be elevated in holy joy, and your lips be employed in the high praises of God. This day more resembles heaven, than any other portion of our time; and we should endeavour to imitate the worship of heaven, according to that petition of the Lord’s prayer—”Thy will be done on earth as it is in heaven.” Never permit the idea to enter your mind, that the sabbath is a burden. It is a sad case, when professing Christians are weary of this sacred rest, and say, like some of old, “When will the sabbath be gone, that we may sell corn, and set forth wheat?” As you improve this day, so probably will you be prospered all the week.

3. Avoid undue rigour, and Pharisaic scrupulosity, for nothing renders the Lord’s day more odious. Still keep in view the great end of its institution; and remember that the sabbath was instituted for the benefit of man, and not to be a galling yoke. The cessation from worldly business and labour is not for its own sake, as if there was any thing morally good in inaction, but we are called off from secular pursuits on this day, that we may have a portion of our time to devote uninterruptedly to the worship of God.

Let every thing then be so arranged in your household, beforehand, that there may be no interruption to religious duties, and to attendance on the means of grace. There was undoubtedly a rigour in the law of the sabbath, as given to the Jews, which did not exist before; and which does not apply to Christians. They were forbidden to kindle a fire, or to go out of their place on the sabbath; and for gathering a few sticks, a presumptuous transgresssor was stoned to death. These regulations are not now in force.

As divine knowledge is the richest acquisition within our reach, and as this knowledge is to be found in the word of God, let us value this day, as affording all persons an opportunity of hearing and reading the word. And as the fourth commandment requires the heads of families to cause the sabbath to be observed by all under their control, or within their gates, it is very important that domestic and culinary arrangements should be so ordered, that servants and domestics should not be deprived of the opportunity of attending on the word and worship of God which this day affords, by being employed in preparing superfluous feasts, as is often the case.

The sabbath is more valuable to the poor and unlearned than to others, because it is almost the only leisure which they have, and because means of public instruction are on that, day afforded them by the preaching of the gospel. If we possess any measure of the true spirit of devotion, this sacred day will be most welcome to our hearts; and we will rejoice when they say, “Let us go unto the house of the Lord.” To such a soul, the opportunity of enjoying spiritual communion with God will be valued above all price, and be esteemed as the richest privilege which creatures can enjoy upon earth.

4. Whilst you conscientiously follow your own sense of duty in the observance of the rest of the sabbath, be not ready to censure all who may differ from you in regard to minute particulars, which are not prescribed or commanded in the word of God. The Jews accused our Lord as a sabbath-breaker, on many occasions, and would have put him to death for a supposed violation of this law, had he not escaped out of their hands. Beware of indulging yourself in any practice which may have the effect of leading others to disregard the rest and sanctity of the sabbath. Let not your liberty in regard to what you think may be done, be a stumbling-block to cause weaker brethren to offend, or unnecessarily to give them pain, or to lead them to entertain an unfavourable opinion of your piety.

5. As, undoubtedly, the celebration of public worship and gaining divine instruction from the divine oracles, is the main object of the institution of the Christian sabbath, let all be careful to attend on the services of the sanctuary on this day. And let the heart be prepared by previous prayer and meditation for a participation in public worship, and while in the more immediate presence of the Divine Majesty, let all the people fear before him, and with reverence adore and praise his holy name.

Let all vanity, and curious gazing, and slothfulness, be banished from the house of God. Let every heart be lifted up on entering the sanctuary, and let the thoughts be carefully restrained from wandering on foolish or worldly objects, and resolutely recalled when they have begun to go astray. Let brotherly love be cherished, when joining with others in the worship of God. The hearts of all the church should be united in worship, as the heart of one man. Thus, will the worship of the sanctuary below, be a preparation for the purer, sublimer worship in the temple above.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander.html">Archibald Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Compend of Bible Truth</cite>, (Philadelphia: Presbyterian Board of Publication, 1846), pp 191-94.</span></figcaption>

<blockquote><p>This is a wonderful story to tell about very great men and pillars of the churches. Paul is the only one who has his eyes open and sees the sin of Peter, Barnabas, and the other Jews, who were acting insincerely along with Peter. At the same time they do not see their own sin; in fact, they think they are doing well and are charitably deferring to the Jews who were weak in faith. And Paul does not cover up their sin; but he accuses Peter, Barnabas, and the others in no uncertain terms of failing to walk the proper way according to the truth of the Gospel, that is, of having swerved from the truth of the Gospel. It was a serious matter for Peter to be accused by Paul of falling and of swerving from the truth of the Gospel; there could be no graver reproach. Yet he bears it patiently and undoubtedly accepted it with real gratitude. I warned earlier that many have the Gospel but not the truth of the Gospel. Thus Paul says here that Peter, Barnabas, and the rest of the Jews did not walk properly according to the truth of the Gospel; that is, they had had the Gospel but had not walked in it properly. For although they were preaching the Gospel, still by their pretense, which could not stand with the truth of the Gospel, they were establishing the Law. But the establishment of the Law is the abrogation and overthrow of the Gospel. Therefore whoever knows well how to distinguish the Gospel from the Law should give thanks to God and know that he is a real theologian. I admit that in the time of temptation I myself do not know how to do this as I should. The way to distinguish the one from the other is to locate the Gospel in heaven and the Law on earth, to call the righteousness of the Gospel heavenly and divine and the righteousness of the Law earthly and human, and to distinguish as sharply between the righteousness of the Gospel and that of the Law as God distinguishes between heaven and earth or between light and darkness or between day and night. Let the one be like the light and the day, and the other like the darkness and the night. If we could only put an even greater distance between them! Therefore if the issue is faith, heavenly righteousness, or conscience, let us leave the Law out of consideration altogether and let it remain on the earth. But if the issue is works, then let us light the lamp of works and of the righteousness of the Law in the night. So let the sun and the immense light of the Gospel and of grace shine in the day, and let the lamp of the Law shine in the night. These two must be distinguished in your mind in such a way that when your conscience is completely terrified by a sense of sin, you will think of yourself. “At the moment you are busy on earth. Here let the ass work, let him serve and carry the burden that has been laid upon him; that is, let the body and its members be subject to the Law.34 But when you ascend into heaven, leave the ass with his burdens on earth; for the conscience has no relation to the Law or to works or to earthly righteousness. Thus the ass remains in the valley; but the conscience ascends the mountain with Isaac, knowing absolutely nothing about the Law or its works but looking only to the forgiveness of sins and the pure righteousness offered and given in Christ.” …Peter had confused this distinction between the Law and the Gospel, and thus he had persuaded the believers that they had to be justified by the Gospel and the Law together. This Paul refused to tolerate. Therefore he rebuked Peter. He did not want to put him to shame, but he wanted to separate these two very sharply again, namely, that the Law justifies on earth and the Gospel in heaven. But the pope has not only confused the Law with the Gospel; but he has changed the Gospel into mere laws, and ceremonial laws at that. He has also confused secular matters and church matters, which is really a satanic and infernal confusion.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“This is a wonderful story to tell about very great men and pillars of the churches. Paul is the only one who has his eyes open and sees the sin of Peter, Barnabas, and the other Jews, who were acting insincerely along with Peter. At the same time they do not see their own sin; in fact, they think they are doing well and are charitably deferring to the Jews who were weak in faith. And Paul does not cover up their sin; but he accuses Peter, Barnabas, and the others in no uncertain terms of failing to walk the proper way according to the truth of the Gospel, that is, of having swerved from the truth of the Gospel. It was a serious matter for Peter to be accused by Paul of falling and of swerving from the truth of the Gospel; there could be no graver reproach. Yet he bears it patiently and undoubtedly accepted it with real gratitude. I warned earlier that many have the Gospel but not the truth of the Gospel. Thus Paul says here that Peter, Barnabas, and the rest of the Jews did not walk properly according to the truth of the Gospel; that is, they had had the Gospel but had not walked in it properly. For although they were preaching the Gospel, still by their pretense, which could not stand with the truth of the Gospel, they were establishing the Law. But the establishment of the Law is the abrogation and overthrow of the Gospel. Therefore whoever knows well how to distinguish the Gospel from the Law should give thanks to God and know that he is a real theologian. I admit that in the time of temptation I myself do not know how to do this as I should. The way to distinguish the one from the other is to locate the Gospel in heaven and the Law on earth, to call the righteousness of the Gospel heavenly and divine and the righteousness of the Law earthly and human, and to distinguish as sharply between the righteousness of the Gospel and that of the Law as God distinguishes between heaven and earth or between light and darkness or between day and night. Let the one be like the light and the day, and the other like the darkness and the night. If we could only put an even greater distance between them! Therefore if the issue is faith, heavenly righteousness, or conscience, let us leave the Law out of consideration altogether and let it remain on the earth. But if the issue is works, then let us light the lamp of works and of the righteousness of the Law in the night. So let the sun and the immense light of the Gospel and of grace shine in the day, and let the lamp of the Law shine in the night. These two must be distinguished in your mind in such a way that when your conscience is completely terrified by a sense of sin, you will think of yourself. “At the moment you are busy on earth. Here let the ass work, let him serve and carry the burden that has been laid upon him; that is, let the body and its members be subject to the Law.34 But when you ascend into heaven, leave the ass with his burdens on earth; for the conscience has no relation to the Law or to works or to earthly righteousness. Thus the ass remains in the valley; but the conscience ascends the mountain with Isaac, knowing absolutely nothing about the Law or its works but looking only to the forgiveness of sins and the pure righteousness offered and given in Christ.” …Peter had confused this distinction between the Law and the Gospel, and thus he had persuaded the believers that they had to be justified by the Gospel and the Law together. This Paul refused to tolerate. Therefore he rebuked Peter. He did not want to put him to shame, but he wanted to separate these two very sharply again, namely, that the Law justifies on earth and the Gospel in heaven. But the pope has not only confused the Law with the Gospel; but he has changed the Gospel into mere laws, and ceremonial laws at that. He has also confused secular matters and church matters, which is really a satanic and infernal confusion.”

— Martin Luther, Luther’s Works, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 115–17.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+is+a+wonderful+story+to+tell+about+very+great+men+and+pillars+of+the+churches.+Paul+is+the+only+one+who+has+his+eyes+open+and+sees+the+sin+of+Peter%2C+Barnabas%2C+and+the+other+Jews%2C+who+were+acting+insincerely+along+with+Peter.+At+the+same+time+they+do+not+see+their+own+sin%3B+in+fact%2C+they+think+they+are+doing+well+and+are+charitably+deferring+to+the+Jews+who+were+weak+in+faith.+And+Paul+does+not+cover+up+their+sin%3B+but+he+accuses+Peter%2C+Barnabas%2C+and+the+others+in+no+uncertain+terms+of+failing+to+walk+the+proper+way+according+to+the+truth+of+the+Gospel%2C+that+is%2C+of+having+swerved+from+the+truth+of+the+Gospel.+It+was+a+serious+matter+for+Peter+to+be+accused+by+Paul+of+falling+and+of+swerving+from+the+truth+of+the+Gospel%3B+there+could+be+no+graver+reproach.+Yet+he+bears+it+patiently+and+undoubtedly+accepted+it+with+real+gratitude.+I+warned+earlier+that+many+have+the+Gospel+but+not+the+truth+of+the+Gospel.+Thus+Paul+says+here+that+Peter%2C+Barnabas%2C+and+the+rest+of+the+Jews+did+not+walk+properly+according+to+the+truth+of+the+Gospel%3B+that+is%2C+they+had+had+the+Gospel+but+had+not+walked+in+it+properly.+For+although+they+were+preaching+the+Gospel%2C+still+by+their+pretense%2C+which+could+not+stand+with+the+truth+of+the+Gospel%2C+they+were+establishing+the+Law.+But+the+establishment+of+the+Law+is+the+abrogation+and+overthrow+of+the+Gospel.+Therefore+whoever+knows+well+how+to+distinguish+the+Gospel+from+the+Law+should+give+thanks+to+God+and+know+that+he+is+a+real+theologian.+I+admit+that+in+the+time+of+temptation+I+myself+do+not+know+how+to+do+this+as+I+should.+The+way+to+distinguish+the+one+from+the+other+is+to+locate+the+Gospel+in+heaven+and+the+Law+on+earth%2C+to+call+the+righteousness+of+the+Gospel+heavenly+and+divine+and+the+righteousness+of+the+Law+earthly+and+human%2C+and+to+distinguish+as+sharply+between+the+righteousness+of+the+Gospel+and+that+of+the+Law+as+God+distinguishes+between+heaven+and+earth+or+between+light+and+darkness+or+between+day+and+night.+Let+the+one+be+like+the+light+and+the+day%2C+and+the+other+like+the+darkness+and+the+night.+If+we+could+only+put+an+even+greater+distance+between+them%21+Therefore+if+the+issue+is+faith%2C+heavenly+righteousness%2C+or+conscience%2C+let+us+leave+the+Law+out+of+consideration+altogether+and+let+it+remain+on+the+earth.+But+if+the+issue+is+works%2C+then+let+us+light+the+lamp+of+works+and+of+the+righteousness+of+the+Law+in+the+night.+So+let+the+sun+and+the+immense+light+of+the+Gospel+and+of+grace+shine+in+the+day%2C+and+let+the+lamp+of+the+Law+shine+in+the+night.+These+two+must+be+distinguished+in+your+mind+in+such+a+way+that+when+your+conscience+is+completely+terrified+by+a+sense+of+sin%2C+you+will+think+of+yourself.+%E2%80%9CAt+the+moment+you+are+busy+on+earth.+Here+let+the+ass+work%2C+let+him+serve+and+carry+the+burden+that+has+been+laid+upon+him%3B+that+is%2C+let+the+body+and+its+members+be+subject+to+the+Law.34+But+when+you+ascend+into+heaven%2C+leave+the+ass+with+his+burdens+on+earth%3B+for+the+conscience+has+no+relation+to+the+Law+or+to+works+or+to+earthly+righteousness.+Thus+the+ass+remains+in+the+valley%3B+but+the+conscience+ascends+the+mountain+with+Isaac%2C+knowing+absolutely+nothing+about+the+Law+or+its+works+but+looking+only+to+the+forgiveness+of+sins+and+the+pure+righteousness+offered+and+given+in+Christ.%E2%80%9D+%E2%80%A6Peter+had+confused+this+distinction+between+the+Law+and+the+Gospel%2C+and+thus+he+had+persuaded+the+believers+that+they+had+to+be+justified+by+the+Gospel+and+the+Law+together.+This+Paul+refused+to+tolerate.+Therefore+he+rebuked+Peter.+He+did+not+want+to+put+him+to+shame%2C+but+he+wanted+to+separate+these+two+very+sharply+again%2C+namely%2C+that+the+Law+justifies+on+earth+and+the+Gospel+in+heaven.+But+the+pope+has+not+only+confused+the+Law+with+the+Gospel%3B+but+he+has+changed+the+Gospel+into+mere+laws%2C+and+ceremonial+laws+at+that.+He+has+also+confused+secular+matters+and+church+matters%2C+which+is+really+a+satanic+and+infernal+confusion.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Luther%E2%80%99s+Works%2C+Vol.+26%3A+Lectures+on+Galatians%2C+1535%2C+Chapters+1-4%2C+ed.+Jaroslav+Jan+Pelikan%2C+Hilton+C.+Oswald%2C+and+Helmut+T.+Lehmann%2C+vol.+26+%28Saint+Louis%3A+Concordia+Publishing+House%2C+1999%29%2C+115%E2%80%9317.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2b6922ca79.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2b6922ca79.html">Permalink</a><a class="src" href="https://heidelblog.net/2021/12/merry-christmas-from-martin-luther/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Therefore we shall learn out of this Scripture what things may lawfully be done of us without the breach of the commandment of rest. First of all such bodily labors are permitted, as do immediately and directly concern the worship of God, and without the which He cannot be served of us according to his Word: For this cause it was permitted unto the priests, nay they were commanded to slay beasts, and to prepare them for sacrifices, and offer them up according to the law, about the which they took so much the more pains upon that day than upon any other [day] of the week by how much the sacrifices were increased: for besides the daily sacrifices, morning and evening, there was a special sacrifice for the Sabbath, and all this being commanded in the law, our Savior Christ says [that] they in doing of it were blameless; therefore, whereas He says that the priests in the Temple break the Sabbath, He does not mean that they did so indeed: (For He affirms that they are blameless), but speaking according to the meaning of the Pharisees, who would condemn the fact of his disciples in gathering the ears of corn to satisfy their hunger, says, if every bodily labor be a breach of the Sabbath, then the priests in the temple brake it, but they are blameless in so doing; therefore they brake it not. Thus we do grant that men may travail [put forth work] to the places of Gods worship, where the public assemblies and meetings of the Church be, because otherwise they cannot join with them in the communion of the Word, sacraments and prayer, and though they be far distant in situation of dwelling from the common place of meeting, yet it is permitted unto them to travail by land, or by water, on horseback, or on foot thereunto; nay they are commanded to do it, and they may not under the color of a long journey tarry at home idly taking their ease. For even as the slaying of beasts is merely in its own nature a worldly and bodily labor, yet the temple which was sanctified did change the nature of it, and made it holy: so to travail and to ride, or go to and fro upon the Sabbath is altogether painful, and laborsome to the body, but to take this pains, to preach or to hear the word, makes it an holy work, and is warranted by the Scripture: as in this very place [Mt. 12:1-9], we see how our Savior Christ and his disciples travail from town to town to preach the Gospel, and take such pains that they are hungry and faint in the way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-bownd.html">Nicholas Bownd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath Plainly Laid forth</cite>, … (London, 1595), pt. 1, pp. 104-5</span></figcaption>

<blockquote><p>YOU have arrived at an important era in your history, an occasion when you are specially called upon to search and try your ways, to realise your responsibility to God, your entire dependence upon the Author of every good and perfect gift, to look steadily and deliberately both behind you and before you, and to adopt resolutions suited to your present circumstances, and fitted to bear extensively and permanently upon your future studies and labours. Your studies have hitherto been directed principally to the improvement of your intellectual powers, and the acquisition of secular knowledge.

They are now to be directed to the acquisition of the knowledge of God and of his revealed will. Hitherto, probably, your leading and immediate motives in the prosecution of your studies have been the mere pleasure of intellectual exertion and of the acquisition of knowledge, or, perhaps, the desire of distinction, or a wish to make a creditable preparation for what you had chosen as your future profession in life.

Now it may be expected that you have taken a closer and fuller view of the office of the Christian ministry to which you have professedly devoted yourselves, and of the purposes it was designed to serve, and that you feel that it is with God you have to do in this matter, that it is with him you are to Hold communion, and to him you are to have respect in all your studies and preparations connected with entering upon his more immediate service.

You have ere this time, I trust, been led to some serious reflection upon the end for which you were created, and the objects to which your powers and faculties ought to be devoted. You have been already giving some measure of serious and humble attention to the study of the word of God, and have been enabled to discern and apprehend the views unfolded there of your relation to God as his creatures, his subjects, and the transgressors of his law, and of the scheme of mercy which God devised and executed by sending his Son into the world to suffer and die for us. Through the knowledge and belief of these truths, you have been led, I trust, to flee for refuge to the hope set before you, to embrace Christ as all your salvation and all your desire.

Under the influence of these views, and under the guidance of the Holy Ghost, you have not only received Christ as the Way, the Truth, and the Life, for your own personal salvation, but you have resolved to devote your lives to the service of God in the gospel of his Son, to the great object of making God and Christ and salvation known to your fellow-men. Animated by this desire, and determined by God’s grace to carry this resolution into effect, you have come to this place in order that you may acquire the necessary knowledge, and make other necessary preparations for entering upon this important work.

This is the position you now occupy; these, I trust, are the motives by which you are animated, and the objects on which your desires are set; and if so, it may be reasonably expected that you will engage in the studies that now lie before you with an activity and a zeal, a seriousness and sense of responsibility, and at the same time with a cheerfulness and alacrity, which you have never known before.</p></blockquote>

ou+have+been+already+giving+some+measure+of+serious+and+humble+attention+to+the+study+of+the+word+of+God%2C+and+have+been+enabled+to+discern+and+apprehend+the+views+unfolded+there+of+your+relation+to+God+as+his+creatures%2C+his+subjects%2C+and+the+transgressors+of+his+law%2C+and+of+the+scheme+of+mercy+which+God+devised+and+executed+by+sending+his+Son+into+the+world+to+suffer+and+die+for+us.+Through+the+knowledge+and+belief+of+these+truths%2C+you+have+been+led%2C+I+trust%2C+to+flee+for+refuge+to+the+hope+set+before+you%2C+to+embrace+Christ+as+all+your+salvation+and+all+your+desire.%0A%0AUnder+the+influence+of+these+views%2C+and+under+the+guidance+of+the+Holy+Ghost%2C+you+have+not+only+received+Christ+as+the+Way%2C+the+Truth%2C+and+the+Life%2C+for+your+own+personal+salvation%2C+but+you+have+resolved+to+devote+your+lives+to+the+service+of+God+in+the+gospel+of+his+Son%2C+to+the+great+object+of+making+God+and+Christ+and+salvation+known+to+your+fellow-men.+Animated+by+this+desire%2C+and+determined+by+God%E2%80%99s+grace+to+carry+this+resolution+into+effect%2C+you+have+come+to+this+place+in+order+that+you+may+acquire+the+necessary+knowledge%2C+and+make+other+necessary+preparations+for+entering+upon+this+important+work.%0A%0AThis+is+the+position+you+now+occupy%3B+these%2C+I+trust%2C+are+the+motives+by+which+you+are+animated%2C+and+the+objects+on+which+your+desires+are+set%3B+and+if+so%2C+it+may+be+reasonably+expected+that+you+will+engage+in+the+studies+that+now+lie+before+you+with+an+activity+and+a+zeal%2C+a+seriousness+and+sense+of+responsibility%2C+and+at+the+same+time+with+a+cheerfulness+and+alacrity%2C+which+you+have+never+known+before.%E2%80%9D%0A%0A%E2%80%94+William+Cunningham%2C+Theological+Lectures+on+Subjects+Connected+with+Natural+Theology%2C+Evidences+of+Christianity%2C+the+Canon+and+Inspiration+of+Scripture%2C+%28New+York%3A+Robert+Carter+and+Brothers%2C+1878%29%2C+Lecture+I%2C+pp+1-2.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd26ddcee72.html&amp;vi

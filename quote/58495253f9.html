<main class="wrap"><figure class="quote" id="q-58495253f9" data-kw="">
<blockquote><p>Neither are Kings and Princes blameless in this case of Famine, who though their charge be to provide for the good of the people, yet they utterly neglect them, rather impoverishing their subjects, yea, even in the dearest years, burthening them with taxes and subsidies: the Court is costly, and will be gallant: horses, hounds, hawks, harlots, jesters, must be maintained, who wrings for it? the poor subject, who must rather be undone, then the Court should want: from whence followeth this inconvenience, that the people being thus exhausted, and drunk up by these sucking subsidies and exactions, many of them become desperate, and utterly neglect their family at home, and setting the Hare’s head to the Goose gibbets, and all that they have at a mumme [sic] chance, will rather loosely misspend it themselves, then thus to be made sponges, and that which they have to be squeezed from them by crushing Courtiers.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-14e7e73d96" data-kw="">
<blockquote><p>To give a larger view, in short, of some of the differences between Feser and myself (and many others), the following comparisons respect specifically the voluntary exercise of one’s own faculty in regard to the necessity (or not) of the realization of an essential end of that faculty:

1. An essential natural end fixes moral possibility vs. An essential natural end entails ethical weight and a general orientation.

2. Acting against the given teleological end is morally, metaphysically impossible vs. Acting against the teleological end admits of proportional exceptions (i.e. the greater good).

3. Teleological, moral and metaphysical necessity in such a context are bound up together vs. these three things can function separately.

4. Properly functioning biology determines an action’s moral-kind vs. Rational, moral ordering and reasoning determines moral-kind and ought to (and does) weigh competing goods, proportionality, context and intention.</p></blockquote>

</figure><figure class="quote" id="q-53eb46797f" data-kw="">
<blockquote><p>I take for granted that every Reformed Presbyterian will cheerfully admit the obligation to receive the Bible as the universal rule of action in things civil as well as religious. “Be wise now, therefore, O ye kings, be instructed, ye judges of the earth; serve the Lord with fear.”

Kings and judges are here addressed in their official capacity; and in this capacity they are commanded to “serve the Lord.” The nation as a moral person acts by its rulers; the doings of the latter become the responsibilities of the former, and the obligations due by the nation are to be fulfilled by its rulers.

There is nothing in Scripture that warrants the limitation of the obligation to “serve God” to one part of the divine law, to the exclusion of another. Yet it has been assumed, that rulers in the administration of government have nothing to do with the first table of the moral law. And on this unwarranted limitation of the magistrate’s authority, is opposition made to a public provision for the religious instruction of the community.

On the other hand, we hold that the civil magistrate is “custos et vindex utriusque tabulae,” the [keeper] and avenger of both tables of the law.[1] This was adopted as a maxim on the subject, by the Protestant writers of the Reformation, and finds a place in the testimony of the Reformed Presbyterian Church, as it had also been recognized by the Covenanted Church of Scotland in her purest times!

David Scott, ‘The Public Support of Religion’, Reformed Presbyterian and Covenanter, 8, no. 9 (September 1870), pp 271-72.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“reaper and avenger”, however, this was modified by an editorial note on page 299 of the same volume.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-2d6a3c152a" data-kw="">
<blockquote><p>Note, the rules of a strict discipline must not be made too strict, but so as to admit of a dispensation when the necessity of a case calls for it, which therefore, in making vows of that nature, it is wisdom to provide expressly for, that the way may be made the more clear, and we may not afterwards be forced to say, ‘It was an error,’ Eccl. 5:6. Commands of that nature are to be understood with such limitations. These Rechabites would have tempted God, and not trusted Him, if they had not used proper means for their own safety in a time of common calamity [which they did, Jer. 35:11], notwithstanding the law and custom of their family [Jer. 35:7-10].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jeremiah</cite>, 35, vv. 1-11</span></figcaption>

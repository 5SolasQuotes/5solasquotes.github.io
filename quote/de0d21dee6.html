<main class="wrap"><figure class="quote" id="q-de0d21dee6" data-kw="">
<blockquote><p>1st, An invitation to all persons in all places, to come and receive Jesus Christ, the King of kings, Lord of lords, and Prince of peace, who is even among our hands in the gospel, wherein He manifests Himself. Now that He offers Himself, take Him, and you are welcome to Him. Any person who hath anything ado with Him, come; for He is now seeking employment to be given Him. He hath balms for all wounds, salves for all sores, and cures for all sorts of diseases. And,

2ndly, There are some objections against this coming, and these He solves, and uses various motives and invitations to encourage souls to come unto Him and buy. Such are the following:—

1. The market is free. He is seeking nothing from you, but hath all glorious things to give you. Therefore, ye are fools if ye will not come and take when ye have nothing to give.

2. If ye will not come, your well-doing is over. Your doom is, “Depart for ever;” and do what ye can, ye shall not prosper, nor get any soul-satisfaction any other way. And,

3. If ye will come, ye need not be afraid of wrath and justice. Ye shall not have that to say that ye dare not come for fear He execute justice upon you. The Father took Christ Jesus to be your Cautioner or Surety. Christ shall stand for you and manage in your room or stead. He will manage all that concerns you, both with regard to the guilt and the pollution of sin; for the punishment of sin, if ye will but accept of Him to be your Cautioner or Surety, He shall answer for all your wrongs, as if they had been done in His own person, and He shall stand for them, and ye shall go free. And,

4. Ye may think it a great honour and prerogative that ever the like of you is allowed to come near Christ, instead of saying ye will not come unto Him. For God hath a mind to make Him unspeakably honourable in His kingdom, think ye of Him what ye will. For many shall come out of all kindreds, kingdoms, and nations, like flocks of sheep, and shall cast down their crowns at His footstool, even those that have never yet heard of Him; and what a shame will it be for you to be the last of all in paying your respects to Him?

5. If ye will not come and close with Him now in the offers of the gospel, wherein He is offered unto you, take care that ye sit not your time of the market; for there is but a set time of His offers, wherein He will be found of you.</p></blockquote>

<blockquote><p>I am afraid of a controversy on this subject [instrumental music], or of its issue, so far as the merits of the question are concerned. I believe that it is a question which touches some of the highest and deepest points of Christian theology. Is the Temple destroyed? Is the Temple worship wholly superseded? Have we, or have we not, priests and sacrifices among us now? Is the Temple or the Synagogue the model on which the Church of the New Testament is formed?

Does the Old Testament itself point to anything but “the fruit of the lips” as the peace-offering or thank-offering of Gospel times? Is there a trace in the New Testament of any other mode of praise? For my part, I am persuaded that if the Organ be admitted, there is no barrier, in principle, against the sacerdotal system in all its fulness,—against the substitution again, in our whole religion, of the formal for the spiritual, the symbolical for the real.

I do not judge others. The case is very different with those who never reached our measure of reformation from what it is with us. A Church which, stopping short in the process of its emancipation from a false system, retains certain of the usages of that false system, is in a very different position from a Church which, having advanced farther in the direction of purity and simplicity, voluntarily retrogrades and returns to these usages.

To the one they may be comparatively harmless, while to the other they may prove deeply hazardous. In the former instance, the continuance of them indicates no new leaning towards ritualism, no decline from what is more pure and spiritual. In the latter instance, the adoption of them may have a significancy, and may exert an influence, of a very serious character indeed. A landing-place which is tolerable for those who are going forward, may be the reverse of tolerable for those who are retreating.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introductory Notice in The Organ Question: Statements by Dr Ritchie, and Dr Porteous, for and against the use of the organ in public worship, in the proceedings of the Presbytery of Glasgow, 1807-8. With an introductory notice, by Robert S. Candlish, D.D., Edinburgh</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-01b488a996" data-kw="">
<blockquote><p>Of the premises ye may gather some definition of faith, as namely that ‘love is a holy endeavor for the preservation of that which is beloved, whether God or man, with an earnest desire to be united unto it.’ For love is that bond, as the apostle speaks, whereby the members of the body are knit together. And it serves also in some sort and place to unite us unto God and Christ, notwithstanding that the communion of Christ, the head of his body the Church, be principally to be ascribed unto faith.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-e6b9a9fb6c" data-kw="">
<blockquote><p>The mockery which worships God with nought but external gestures and absurd human fictions, how could we, without sin, allow to pass unrebuked? We know how much He hates hypocrisy, and yet in that fictitious worship, which was everywhere in use, hypocrisy reigned. We hear how bitter the terms in which the Prophets inveigh against all worship fabricated by human rashness. But a good intention, i.e. an insane licence of daring whatever man pleased, was deemed the perfection of worship. For it is certain that in the whole body of worship which had been estabhshed, there was scarcely a single observance which had an authoritative sanction from the Word of God. We are not in this matter to stand either by our own or by other men’s judgments. We must listen to the voice of God, and hear in what estimation He holds that profanation of worship which is displayed when men, overleaping the boundaries of His Word, run riot in their own inventions. The reasons which he assigns for punishing the Israelites with blindness, after they had lost the pious and holy discipline of the Church, are two, viz., the prevalence of hypocrisy, and will-worship (ethelothreskeian), meaning thereby a form of worship contrived by man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Necessity of Reforming the Church, Presented to the Imperial Diet at Spires, A.D. 1544, in the name of all who want Christ to Reign (1544) in Tracts &amp; Letters relating to the Reformation, tr. &amp; ed. Henry Beveridge, 7 vols. (Edinburgh: Calvin Translation Society, 1844), 1.189</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dc9d6f7f58" data-kw="">
<blockquote><p>St. Paul, the apostle of the gentiles, was eminent for occasional conformity. He exhorts the Christians to assert their freedom from the law of ceremonies (Gal. 5:1), lives himself after the manner of the gentiles (Gal. 2:14), and by consequence, in fellowship with them, yet occasionally purified himself in the Temple, according to the Law of Moses. (Acts 21:26) He was a dissenter from the ceremonies of the Law, and yet submits to them to avoid offense [Acts 16:3; 18:21]. He statedly communicated with the gentile Churches, but holds occasional communion with the national Jewish Church. He judged occasional communion lawful, but did not therefore conclude constant communion a duty, nay, it had been sinful to him and all other Christians; for then they must have separated from the fellowship of the Gospel [Acts 15:7-19; Gal. 2:9-21], and renounced Christianity…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jame-owen.html">Jame Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Moderation a Virtue, or, The Occasional Conformist Justified from the Imputation of Hypocrisy… (London: Baldwin, 1703), pp. 7-9 Owen (1654-1706) was an English, Independent puritan. By “occasional conformity,” Owen does not mean ever doing that which is sinful.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-4e00f766c2" data-kw="">
<blockquote><p>Calvin: In the English Liturgy as you [the English exiles at Frankfurt] do describe unto me, I spy out many tolerabiles ineptias, ‘tolerable unfit things:’ By which two words I express thus much, that there was not that purity which were to be wished, which errors could not immediately the first day be corrected (Cum nulla subesset manifesta impietas ferenda ad tempus fuisse). Seeing there was therein contained no manifest impiety, these things† should have been born withal for a time; Epistle 200, fol. 336.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1623) | ‘Reformed Practices’</cite>, p. 188</span></figcaption>

</figure><figure class="quote" id="q-9db19e5262" data-kw="">
<blockquote><p>As to [John Brown of Wamphray’s charge of the partially conforming Scottish ministers] being robbed of the key of discipline, Wamphray, exaggerating, means partially so, so far as the presbyteries were restricted in certain ways by the bishops, and that externally, whereas much of the spiritual discipline of Christ could still be fulfilled through the pastors’ ministries (as our [English puritan] authors below will profoundly show) and presbyteries. All Church order and discipline, be reminded, as to being performed in specific circumstances, is a matter of decency, order and edification, and is limited thereto (1 Cor. 14:26, 40).¹ ¹ See ‘How All Church Governing May be Practically Done unto Edification’ and ‘On How Church Discipline is Limited to Edification in its Time &amp; Place, etc.’ at ‘On the Ordinances, Order &amp; Policy of the Church’ (RBO) In a passage the puritans often commented on to our purpose, Dt. 12:8–11, God’s people were to put off their enjoined, stated worship ordinances while they were in the wilderness (in that broken and declining Church-state) till they came “to the rest and to the inheritance,” when God would give “you rest from all your enemies round about, so that ye dwell in safety. Then… shall ye bring all that I command you, your burnt offering, and your sacrifices…” One key factor, the passage says, for legitimately omitting whole swaths of public discipline and worship is ‘that ye dwell in safety.’… … Heb. 3:2 says, in a comparison with Christ, “Moses was faithful in all his house.” Yet Moses and the Israelites in Ex. 8:25–26 (in that broken and declining Church-state) were not sacrificing to God in Egypt so as not to scandalize the Egyptians and for their physical safety, for “will they not stone us?” Thus Moses (the prophetic mouthpiece here before Pharoah) reasoned regarding sacrificing animals before their enemies: “It is not meet so to do.” Yet God heard the Israelites’ prayers and accepted their moral obedience unto Him (Ex. 1:21; 2:24; 3:7; 4:31; 6:5; 9:20; 14:13, 31), which they did not transgress even when in danger of their lives (Ex. 1:17), in contrast to omitting public worship ordinances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, pp. 155-56</span></figcaption>

<blockquote><p>Another argument there is taken from them, that ‘they sought the Lord, etc.’ Which seeking of theirs is set out by the manner of it, that they prepared their whole heart to seek Him: Not as if their hearts were so free from sin, or so full of grace as they should have been; but that they were true and plain, and sincere: Not such as had no sin, for it is said, ‘they were not cleansed according to the purification of the sanctuary,’ but that did love no sin: Not such hearts as wanted no grace, or preparation for God’s ordinance: But such as were humbled for the want of grace and of that preparation that they should have made… For it is said, ‘He healed the people,’ that is, gave them that which God does offer unto his people in the sacrament: They received the seal of the Covenant, and He made good the Covenant unto them…</p></blockquote>

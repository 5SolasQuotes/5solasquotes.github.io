<main class="wrap"><figure class="quote" id="q-2f10b64d60" data-kw="">
<blockquote><p>Because thou hast rejected the Lord tendering Himself to thee, therefore now He stands at a distance from thee: many proffers did He make to thee, but thou slightest them; many calls thou hast from Him, and wouldst not hear them; many knocks has He given at the door of thy heart, and begged for entrance, but thou keptst thy heart shut still against Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gearing.html">William Gearing</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Love-Sick Spouse, or the Substance of Four Sermons</cite>, (London: Simmons, 1665), ch. 7, pp. 15–16 Gearing (c. 1625 – c. 1690) was an English puritan minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ffa773a8f2" data-kw="">
<blockquote><p>But alas, how should Christ come in power to help us, whom we have rejected comming in power to convert us! Does He come now, and we will not know Him; and can we hope He will come then when we call Him? Open your hearts, all ye that fear the Lord, and let Him in… and has the Gospel of Christ lost the powerfulness? No, if it have not power to convert us, it will have power to confound us. If Christ be not suffered to come unto us, He will not be hindered from coming against us. Oh let us come unto Him, that He may come unto us: subject we our hearts and lives to the obedience of his Gospel… Let us now honor Him when He comes in grace, that He may honor us when He comes in glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-adams.html">Thomas Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary or Exposition upon the divine Second Epistle General, written by the blessed Apostle St. Peter</cite>, (London: Badger, 1633), on 2 Pet. 1:16, p. 298</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-cbb697c9ed" data-kw="">
<blockquote><p>I answer briefly that God does always begin to us, and is beforehand with us in all dealings with ourselves. He gives us many motions, and never withdraws Himself from us but when He is despised and slighted first: therefore let us take heed that we labor to answer Christ’s call when He does call. If we slight it, then in a judicious course, He ceases to speak further to us, if we slight his beginnings of revelations… We would not yield to all the passages of salvation; but when He was beforehand with us, and offered many sweet motions, yet we loved our sins better then our souls, and so repelled all. Therefore I beseech you do not refuse the sweet messages from Heaven, the gracious and sweet motions of the spirit of Christ, make much of them. God has begun to you, be sure to answer. Learn it of Mary, when Christ began [after his resurrection], she set not her heart and infidelity against it, but she opened her heart, and said, ‘Rabboni’ [Jn. 20:16]; learn therefore the duty of spiritual obedience, when God speaks, ‘Speak Lord, for thy servant hears.’ Do not shut your ears to the motions of God’s blessed Spirit, do not harden your hearts against his voice, but open your hearts as she did, ‘Rabboni’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Heavenly Conference between Christ &amp; Mary after his Resurrection</cite>, … (d. 1635; London: 1654), pp. 21-22</span></figcaption>

text=I%20answer%20briefly%20that%20God%20does,your%20hearts%20as%20she%20did%2C%20%E2%80%98Rabboni&amp;text=I%20answer%20briefly%20that%20God%20does%20always%20begin&amp;text=but%20open%20your%20hearts%20as%20she%20did%2C%20%E2%80%98Rabboni" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0c54be44c6" data-kw="">
<blockquote><p>2… Look yonder on the amiable Jesus Christ (for a marriage between whom and thy precious soul I am now wooing). Do but observe his condescending willingness to be united to thee: That great Ahasuerus courts his own captive Esther. The Potter makes suit to his own clay, woos thee, though He wants [needs] thee not; is infinitely happy without thee, yet is not, cannot be satisfied but with thee. Heark how He commands, entreats, begs thee to be reconciled, 2 Cor. 5:20; Swears and pawns his life upon it, that He desires not thy death, Eze. 33:11; seals his oath with his blood; and if after all this thou art fond of thine own damnation and hadst rather be at an agreement with Hell, than with Him; see how the brinish tears trickle down his cheeks, Lk. 19:41-42. He weeps for thee, that dost not, wilt not weep for thyself: Nay, after all this obdurate obstinacy, is resolved still to wait, that He may be gracious, Isa. 30:18. Stands yet and knocks, though his head be wet with rain, and his locks with the dew of the night; fain He would have thee open the door, that He may be come in and sup with thee, and thou with Him, Rev. 3:20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-lye.html">Thomas Lye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Morning Exercise Methodized</cite>, (London: E.M., 1660), Sermon 18, p. 397</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

<main class="wrap"><figure class="quote" id="q-a9b5a185f1" data-kw="">
<blockquote><p>I willingly grant that the determination of the end does necessarily involve the means, that not only precede but procure the end. But I will utterly deny that sin is the means of damnation; we say rather that permission of sin is the means, whence notwithstanding it follows not that sin shall come to pass unavoidably, but rather avoidably, whether we consider the free will of man or the decree of God; for every particular sinful act is a natural thing, and undoubtedly man has free will as to do, so to abstain from doing, any particular act. And albeit God has determined that these particular sinful acts (instance the particular outrages committed against the holy Son of God by Herod, Pontius Pilate, together with the Gentiles and people of Israel) shall come to pass by his permission; yet seeing withal He has ordained them to come to pass contingently, that follows that they shall come to pass in such a manner as joined with a possibility of not coming to pass; otherwise they should come to pass not contingently but necessarily.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his Absolute Hatred or Reprobation of the Vessels of Wrath</cite>, (Oxford, 1653), bk. 1, p. 69</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-278e690c48" data-kw="">
<blockquote><p>7. Is original corruption seated only in the lower part of our soul?… The papists, especially the Jesuits, so that they might hold that the higher part of the soul, as they say, in which is the free choice, was unwounded by corruption, and also so that they might obtain that concupiscence is not sin, and accordingly, that notwithstanding concupiscence, a person can be perfect in this life, state that original corruption is only in the lower part of the soul, that is, in sensuality, in concupiscence, in the rebellion of the lower forces. And of the Reformed with their reasons The Reformed on the contrary refer original corruption not only to the lower faculties of the soul, but also to the higher faculties, and indeed more so to the higher than to the lower. … (1) the apostle expressly refers corruption to the mind in 1 Timothy 6:5, “the mind of corrupt men,” and in Colossians 2:18, “puffed up by the mind of his flesh.</p></blockquote>

</figure><figure class="quote" id="q-d3fe61928f" data-kw="">
<blockquote><p>He [Jesus] plainly states that mankind, unchanged by divine influence, labor under such an indisposition to embrace his Gospel, and the blessings which it at once reveals and conveys, as amounts to a moral incapacity,—an indisposition which nothing short of divine influence can remove: ‘No man can come to Me, except the Father, which has sent Me, draw him;’ and with equal plainness He states that this influence, while absolutely necessary, is also fully competent to produce the desired effect,—‘All that the Father has given Me shall come to Me.’</p></blockquote>

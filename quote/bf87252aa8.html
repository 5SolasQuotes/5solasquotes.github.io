<main class="wrap"><figure class="quote" id="q-bf87252aa8" data-kw="">
<blockquote><p>…we might find much matter, both of rejoicing and mourning, in the wonderful commencement and advancement of this work of reformation [in 1689-1690]. As at the Jews’ return from Babylon to Jerusalem, the priests and Levites, and all the people shouted with a great shout when they praised the Lord because the foundation of the House of the Lord was laid; Yet some of them that had seen the first House wept with a loud voice so that the people could not discern the noise of the shout of joy from the noise of weeping. So at this time we are called to rejoice with thanksgiving for, and we should indeed be very ungrate and unworthy if we did not acknowledge with praise and admiration, the mercy of God which endures forever, manifested and magnified in the progress of this work hitherto… But though for these things we be called to rejoice, yet we are no less obliged to mourn when we observe this House of the Lord, so unlike the former, wanting many things the former had, and pestered with many things the former wanted [lacked]. As at the building of the second House, after the captivity of Babylon, they that had seen the first House wept with a loud voice when they observed its constitution and structure, so far short of the former, for order and beauty, and wanting some glorious prerogatives the other had, as the Urim and Thummim, the fire from Heaven, the ark of the testimony, etc. So, they that have seen our former reformation in its integrity [in 1638-1650], before the late deformation, can hardly refrain from weeping at the sight of the sad disproportion between this and the former. In the former, as the constitution was calculated in the nearest conformity to the divine pattern;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/degrees-of-better-worship.html">Alexander Shields, Thomas Lining &amp; William Boyd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Account of the Methods &amp; Motives of the Late Union &amp; Submission to the General Assembly of the Church of Scotland</cite>, (London: 1691), pp. 21-22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-82c45dad55" data-kw="">
<blockquote><p>Discipline and all branches of it are compared to a spiritual rod, 1 Cor. 4:21. The Lord’s Supper is compared to spiritual food or bread; Now it is unlikely that a rod should be a necessary antecedent to food or bread, that is, that children be kept without bread until a rod be provided to whip the dogs and swine… So the commandment for the celebration of the Lord’s Supper is more clear, express, and evident than that for the exercise of discipline.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want</cite>, [Lack] of Church-Government [is] No Warrant for a Total Omission of the Lord’s Supper… (London, 1650) Jeanes (1611–1662) was a presbyterian minister in London., pp. 32-35</span></figcaption>

</figure><figure class="quote" id="q-ea0bc6aae3" data-kw="">
<blockquote><p>To acknowledge and confess, that, as we are convinced of our guilt, so, out of a deep sense thereof, we judge ourselves unworthy of the smallest benefits, most worthy of God’s fiercest wrath, and of all the curses of the law, and heaviest judgments inflicted upon the most rebellious sinners… Notwithstanding all which, to draw near to the throne of grace, encouraging ourselves with hope of a gracious answer of our prayers, in the riches and all-sufficiency of that only one oblation, the satisfaction and intercession of the Lord Jesus Christ… and humbly and earnestly to supplicate for mercy… And, with confidence of his mercy to his whole church, and the acceptance of our persons, through the merits and mediation of our High Priest, the Lord Jesus, to profess that it is the desire of our souls to have fellowship with God in the reverend and conscionable use of his holy ordinances; and, to that purpose, to pray earnestly for his grace and effectual assistance to the sanctification of his holy sabbath, the Lord’s day, in all the duties thereof, publick and private, both to ourselves, and to all other congregations of his people, according to the riches and excellency of the gospel, this day celebrated and enjoyed… And because we have been unprofitable hearers in times past, and now cannot of ourselves receive, as we should, the deep things of God, the mysteries of Jesus Christ, which require a spiritual discerning; to pray, that the Lord, who teacheth to profit, would graciously please to pour out the Spirit of grace, together with the outward means thereof, causing us to attain such a measure of the excellency of the knowledge of Christ Jesus our Lord, and, in him, of the things which belong to our peace…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Directory for the Public Worship of God</cite>, Of Public Prayer before the Sermon</span></figcaption>

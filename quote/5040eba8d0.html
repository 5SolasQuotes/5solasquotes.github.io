<blockquote><p>III. God tells us, that sinners will their death, ‘Why will ye die,’ saith God, — The way which sinners take is the way of death, and it is their voluntary choice, they are not force’t to it by God, and neither are they drag’d to by the Devil — but it is their free will &amp; act— Adam acted voluntarily in what he did — IV. God expressly tells us in our text and context, that He has no pleasure in the death of a sinner, but yt [that] he turn and live — God wills the life and eternal salvation of poor sinners turn ye turn ye for why will ye die — God is sincere, hearty, and earnest in his will, it is plainly to be seen and understood by word, which is his revealed will to the children,— in particular his amazing will to save sinners is to be discovered in his sending his dearly beloved and only begotten Son into this world in amazing manner as He did.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samson-occom.html">Samson Occom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Sermon on Ezekiel 33:11’ (1765)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-921c757d4a" data-kw="">

<blockquote><p>Hence it is commonly called a will of sign and opposed to the will of good pleasure, which is always fulfilled — as several weighty Thomists here expound: Cajetan, Bañez, Zumel, cited by González (disp. 56, sect.1)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>2. ‘General will of God concerning the salvation of all men, 1 Tim. 2:4’ in Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two… vol. 1 tr. AI by Vertias (Padua: Frambotti, 1671), bk. 1, Collation 12, pp. 841-73 A more detailed ToC is given at the beginning of the volume. | Thomas, while allowing for other interpretations, preferred taking 1 Tim. 2:4, about God willing all men to be saved, to refer to an antecedent will of God, in contrast to a consequent will of God. He also speaks of it as a conditional and imperfect will, and a velleity (disposition or willingness) in contrast to the absolute will of God. (Summa, pt. 1, q. 19, art. 6, ‘Whether the will of God is always fulfilled’ [Aquinas distinguishes]) Macedo adds:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>Thesis XII: The impulsive efficient [cause], that is, that because of which we have been chosen, is the benevolent disposition of the will of God, or the εὐδοκία, or good pleasure, of the divine will. Explanation: I. It is a question among us, the Lutherans, and the Papists: What moved or impelled God (it is permitted to us to make use of these words, which rather agree with the decrees of men, and are accommodated to our capacity: for properly speaking no impulsive cause of the divine will is granted, as we saw above) to decree to grant eternal life to certain men? We respond: That God was moved by no other thing to determine eternal life for certain ones, than by the benevolent disposition of His will, or His own good pleasure. There are principally two foundations of our opinion: (1.) Because the Scripture names this alone as the cause of election. Ephesians 1:5, He predestinated us, whom He would adopt as Sons through Jesus Christ unto Himself, according to the benevolent disposition of His own will…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-f-wendelin.html">Marcus F. Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd ed. (1634), ‘Doctrine of Election’, pt. 1 Wendelin (1584-1652)</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“Thesis XII: The impulsive efficient [cause], that is, that because of which we have been chosen, is the benevolent disposition of the will of God, or the εὐδοκία, or good pleasure, of the divine will. Explanation: I. It is a question among us, the Lutherans, and the Papists: What moved or impelled God (it is permitted to us to make use of these words, which rather agree with the decrees of men, and are accommodated to our capacity: for properly speaking no impulsive cause of the divine will is granted, as we saw above) to decree to grant eternal life to certain men? We respond: That God was moved by no other thing to determine eternal life for certain ones, than by the benevolent disposition of His will, or His own good pleasure. There are principally two foundations of our opinion: (1.) Because the Scripture names this alone as the cause of election. Ephesians 1:5, He predestinated us, whom He would adopt as Sons through Jesus Christ unto Himself, according to the benevolent disposition of His own will…”

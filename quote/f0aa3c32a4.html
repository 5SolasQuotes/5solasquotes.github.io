<main class="wrap"><figure class="quote" id="q-f0aa3c32a4" data-kw="">
<blockquote><p>The Jews in their time provoked justly the vengeance of God, for that partly they abused his holy temple with the detestable idolatry of the heathen, and superstitious vanities of their own inventions, contrary to God’s commandment; partly they resorted unto it as hypocrites, spotted, imbrued, and foully defiled with all kind of wickedness and sinful life; partly many of them passed little upon the holy temple, and forced not whether they came thither or no.

And have not the Christians of late days, and even in our days also, in like manner provoked the displeasure and indignation of Almighty God, partly, because they have profaned and defiled their churches with heathenish and Jewish abuses, with images and idols, with numbers of altars too superstitiously and intolerably abused, with gross abusing and filthy corrupting of the Lord’s holy Supper, the blessed Sacrament of his Body and Blood, with an infinite number of toys and trifles of their own devices, to make a goodly outward shew, and to deface the homely, simple, and sincere religion of Christ Jesus? Partly, they resort to the church like hypocrites, full of all iniquity and sinful life, having a vain and a dangerous fancy and persuasion, that if they come to the church, besprinkle them with holy water, hear a mass, and be blessed with the chalice, though they understand not one word of the whole service, nor feel one motion of repentance in their hearts, all is well, all is sure.

Fie upon such mocking and blaspheming of God’s holy ordinance. Churches were made for another purpose, that is, to resort thither and to serve God truly, there to learn his blessed will, there to call upon his mighty Name, there to use the holy Sacraments, there to travail how to be in charity with thy neighbour, there to have thy poor and needy neighbour in remembrance, from thence to depart better and more godly than thou earnest thither.

Finally, God’s vengeance hath been and is daily provoked, because much wicked people pass nothing to resort to the church, either for that they are so sore blinded, that they understand nothing of God and godliness, and care not with devilish example to offend their neighbours; or else for that they see the church altogether scoured of such gay gazing sights as their gross fantasy was greatly delighted with, because they see the false religion abandoned and the true restored, which seemeth an unsavoury thing to their unsavoury taste; as may appear by this, that a woman said to her neighbour, Alas, gossip, what shall we now do at church, since all the saints are taken away, since all the goodly sights we were wont to have are gone, since we cannot hear the like piping, singing, chanting, and playing upon the organs, that we could before?

But, dearly beloved, we ought greatly to rejoice and give God thanks, that our churches are delivered of all those things which displeased God so sore, and filthily defiled his holy house and his place of prayer; for the which he hath justly destroyed many nations; according to the saying of St. Paul, If any man defile the temple of God, God will him destroy. And this ought we greatly to praise God for, that such superstitious and idolatrous manners as were utterly naught and defaced God’s glory are utterly abolished, as they most justly deserved, and yet those things that either God was honoured with or his people edified are decently retained, and in our churches comely practised.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-523fa3b4da" data-kw="">
<blockquote><p>And after all this, if it should please God [that] any person of the blessed and most holy Trinity should appear in any visible shape, that shape might be depicted; of that shape an image might be made; I mean, it might naturally; it might if it were done for lawful ends, and unless a commandment were to the contrary; and therefore so long as God keeps himself within the secret recesses of his sanctuary, and the majesty of his invisibility, so long it is plain he intends the very first sense and words of his [Second] Commandement: but if he should cancel the great reason [Dt. 4, end] of his Commandement, and make that by an act of his own to become possible which in the nature of things is impossible, that is, that an image can be made of God; I should believe that God did intend to dispense in that part of the Commandement, and declare that he intended it only for a temporary band: For if the reason of the commandement were taken away; either the commandement also ceases to oblige; or must be bound upon us by another reason, or a new sanction, or at lest a new declaration; or else it would follow that then his visible appearance would become a snare to mankind. But because yet he has not yet appeared visibly and has by no figure or idea represented the Godhead; and that it is a truth which must last as long as Christian religion lasts, that no man can see God, therefore it follows that it is at no hand lawful to make an image of God or relating to the divinity. If a dove be made it must not be intended to represent the Holy Ghost, for besides that no dove did appear, nor shape of a dove, yet if it did, it related not to the person of the Holy Ghost, but to the impression made upon the person on whom the light descended: and if the figure of the crucifix be made, or of Jesus in the flesh, it is wholly relative to the creature, not to him as God; for that is impious, and unreasonable and impossible to be done in any natural proportion.</p></blockquote>

<blockquote><p>XI. But whatever may be said about this diversity of opinions in the Roman school, all its doctors agree on this, as has often been stated:

<blockquote><p>Till divine worship be given to a creature, it is not idolatry, although in the kind or means of worship there may be will-worship; and in the opinion of those that count their act or the object to be holy, when it is not, there may be superstition of the mind; and in the use of such things, or forbearing their use, superstition in the members…</p></blockquote>

</figure><figure class="quote" id="q-f156f200bc" data-kw="">
<blockquote><p>I think all will-worship is not idolatry: Our Lord, who accused the Pharisees of will-worship, did not accuse them of idolatry… his accusing ministers of idolatry, for using a Service-book in the main right in respect of the worship, and a gesture [kneeling in receiving the Supper] avowed to be only to the true God, in a Church, holding in the main, the right Faith, under a prince that professes the same Faith and worship, and to be a defender of it. As for such relics of pagan customs, or Popish, as yet remain, though it were to be wished they were quite left [off], since they are not used in any honor to the pagan idols, but the original and reason of them at first [such as honor and decency], being almost if not quite forgotten by those that use them, and are become but as civil customs that have no state in [or condition of being] religious worship, experience shows that they are more easily reformed by neglect than by earnest declamations against them. Nor do I think the course this author takes, of seeking reformation by invectives and separations, likely to promote it, but to exasperate rulers and make opposites more violent in their way.</p></blockquote>

<blockquote><p>Secondly, There is no salvation out of the Church, but there may be salvation out of the visible Church. As multitudes that are in the visible Church are not saved, so some out of it may be saved. I speak not this to encourage any to neglect being of the visible Church… Is not the greatest company in any visible Church either such open profane, or careless Christians, or downright hypocrites? Are there not ten, an hundred of such for one that truly fears God? Well, when we speak of the Holy Catholic Church, can we only think of that which is visible, as to an outward profession, in which millions perish and go to Hell forever? No, we are to think of the Church invisible; the number known to God of his faithful ones.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Some Genuine Remains of</cite>, … John Lightfoot... (d. 1675; London: R.J., 1700), Tract 3, ‘An Exposition of Two Select Articles of the Apostles’ Creed’, I. ‘I believe the Holy Catholick Church’, pp. 241-42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/necessity-of-the-church.html">Necessity of the Church</a></span></div>

<blockquote><p>This book explores the Westminster Confession of Faith’s claim that ‘there is no ordinary possibility of salvation’ outside of the Church by asking what it means, whether it is biblical, and why it is important. The author concludes that the Westminster Confession rightly stresses the role of the Church in bringing people to salvation without making this claim absolute.</p></blockquote>

</figure><figure class="quote" id="q-0d0240d760" data-kw="">
<blockquote><p>Secondly, the Church being but one, this point and principle is to be holden, that there is no salvation out of the Church, as there is no condemnation to them that are of the Church, and consequently every one that looks to be saved by Christ, must necessarily range himself in that number, that so he may become a member and citizen of this one catholic Church. For as out of the sheepfold are goats, dogs, swine, wolves, and such like, so out of the Church are sorcerers, and whoremongers, and murderers, and idolaters, and whosoever loves and makes lies, Rev. 22. Such albeit they may be in the Church for a season, yet are not of the Church, for they remain not in it. They that were not in the ark of Noah, perished in the waters: so out of the Church, and out of this flock and sheepfold all are condemned. Hence it is that Luke teaches, ‘The Lord added to the Church from day to day such as should be saved.’ [Acts 2] So Solomon, Cant. 4, ‘A garden enclosed is my Sister, my Spouse, a Spring shut up, a Fountain sealed.’ This is plain in these four respects. First, because Christ Jesus is the only head of the Church, by whom all parts as by certain joints and sinews are knit and coupled together: but out of the militant Church there is no Christ, for He always walks in the midst of the seven golden candlesticks… Thirdly, out of the Church there are no ordinary means to come to salvation. Now what are the means to attain salvation? They are these, hearing, faith, prayer, the sacraments, and such like. But out of the bosom of the Church there is no sound preaching of the Word, no true believing in Christ, no devout calling upon God, no right partaking of the sacraments, no sincere holinesse of life, no brotherly communion of saints, no pure worshipping of God according to his Word. These are the privileges of the Church, and the marks whereby it is known, Acts 2, ‘They continued stedfastly in the apostles’ doctrine, and fellowship, and in breaking of bread, and in prayers.’ Where these are not, there can be no Church, nor salvation. Fourthly, the Church and the world are quite contrary the one to the other. Christ prays not for the world, as he does for the Church, and for all the parts and members of it, Jn. 17:9, 14, ‘the whole world lyeth in wickedness,’ only the Church is an holy company which follows the ways and practices the works of godliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Three Treatises</cite>, … (London: Cotes, 1632), Physic Against Famine, pp. 42-44</span></figcaption>

</figure><figure class="quote" id="q-9d29908452" data-kw="">
<blockquote><p>Either you [a Romanist] mean that ‘there is no salvation to be had out of that universal Church, whose part (a minor corrupt part) acknowledges the Pope’s sovereignty’ or else ‘that there is no salvation to be had out of that universal Church which wholly acknowledges it’ or else ‘that there is no salvation to be had out of that part of the universal Church which acknowledges it’. In the first sense I grant your conclusion (if really you [Romanists] are part of the Church), There is no salvation to be had out of Christ’s universal Church, of which you are [a] small corrupted part.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Successive Visibility of the Church of which the Protestants are the Soundest Members Defended</cite>, ... (London: 1660), ‘The Answer to the First Paper’, p. 11</span></figcaption>

</figure><figure class="quote" id="q-e807e79f8e" data-kw="">
<blockquote><p>Thirdly, there is no light of truth to be found anywhere else able to guide unto faith and salvation, than in the true Church of God… As no light was to be found in all Egypt, but in the land of Goshen and among the Israelites only: so no saving doctrine that gives light to the eyes of the mind is to be found out of the Church; they that are [not] in this state, live in palpable darkeness… as John teaches, ‘We know that we are of God, and the whole world lyeth in wickedness.’… Therefore to be out of the Church, is to be in the state of damnation, yea to be in the very dungeon of Hell, and the kingdom of darkeness, and to be under the power of Satan, the prince of darkness; as there was no salvation out of the Church. Let every man therefore seek and endeavor with all care to join himself to the true Church of God, and to be a member of the body of Christ, that so we may attain to the light of knowledge, and the light of the eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Numbers</cite>, (London: Iaggard, 1618), ch. 8, p. 465</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Thirdly, there is no light of truth to be found anywhere else able to guide unto faith and salvation, than in the true Church of God… As no light was to be found in all Egypt, but in the land of Goshen and among the Israelites only: so no saving doctrine that gives light to the eyes of the mind is to be found out of the Church; they that are [not] in this state, live in palpable darkeness… as John teaches, ‘We know that we are of God, and the whole world lyeth in wickedness.’… Therefore to be out of the Church, is to be in the state of damnation, yea to be in the very dungeon of Hell, and the kingdom of darkeness, and to be under the power of Satan, the prince of darkness; as there was no salvation out of the Church. Let every man therefore seek and endeavor with all care to join himself to the true Church of God, and to be a member of the body of Christ, that so we may attain to the light of knowledge, and the light of the eternal life.”

<main class="wrap"><figure class="quote" id="q-f85c9e6781" data-kw="">
<blockquote><p>But what is that good and honest heart which they are commended for? it is a heart that does fully purpose to do well, though it fail much in that which it performs: that resolves beforehand to avoid the evil that shall be reproved, and to do the good duties that shall be commanded, and to believe and rest upon the promises that shall be pronounced, as far as God shall give ability, etc. Now wheresoever there is such a ready inclination unto goodness, there will be a bringing forth of fruit; though not in all alike, yet every one will do somewhat: and God will acknowledge them for good ground, and honest-hearted Christians, that yield Him but a thirty-fold, as well as those that yield Him sixty-fold,or an hundred-fold: for a less measure of fruitfulness is an argument of truth, as well as a greater measure, and therefore shall be respected and rewarded.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dod.html">John Dod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ten Sermons, Tending Chiefly to the Fitting of Men for the Worthy Receiving of the Lord’s Supper (1634), The Fourth Sermon of the Lord’s Supper, on 2 Chron. 30:18-20</cite>, p. 119</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ea0bc6aae3" data-kw="">
<blockquote><p>To acknowledge and confess, that, as we are convinced of our guilt, so, out of a deep sense thereof, we judge ourselves unworthy of the smallest benefits, most worthy of God’s fiercest wrath, and of all the curses of the law, and heaviest judgments inflicted upon the most rebellious sinners… Notwithstanding all which, to draw near to the throne of grace, encouraging ourselves with hope of a gracious answer of our prayers, in the riches and all-sufficiency of that only one oblation, the satisfaction and intercession of the Lord Jesus Christ… and humbly and earnestly to supplicate for mercy… And, with confidence of his mercy to his whole church, and the acceptance of our persons, through the merits and mediation of our High Priest, the Lord Jesus, to profess that it is the desire of our souls to have fellowship with God in the reverend and conscionable use of his holy ordinances; and, to that purpose, to pray earnestly for his grace and effectual assistance to the sanctification of his holy sabbath, the Lord’s day, in all the duties thereof, publick and private, both to ourselves, and to all other congregations of his people, according to the riches and excellency of the gospel, this day celebrated and enjoyed… And because we have been unprofitable hearers in times past, and now cannot of ourselves receive, as we should, the deep things of God, the mysteries of Jesus Christ, which require a spiritual discerning; to pray, that the Lord, who teacheth to profit, would graciously please to pour out the Spirit of grace, together with the outward means thereof, causing us to attain such a measure of the excellency of the knowledge of Christ Jesus our Lord, and, in him, of the things which belong to our peace…</p></blockquote>

</figure><figure class="quote" id="q-b63b9a35a4" data-kw="">
<blockquote><p>…although there is not the least part of Christ’s ordinances that can be neglected without grievous sin, yet the want [lack] or neglect of some of these ordinances of Christ, which concern the discipline of his Church and the outward calling of the ministers is no such sin as can make either the ministers and governors of our Church Antichrists or our Church an Antichristian and false Church [as the separatists claimed].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Ministry of the Church of England, wherein is handled this Question: Whether it be to be separated from, or joined unto. Which is discussed in Two Letters, the one [for joining] written for it [by Hildersham], the other against it [by Francis Johnson] (Low Countries, 1595), section 3</cite>, p. 17</span></figcaption>

</figure><figure class="quote" id="q-b4b7c5b1a8" data-kw="">
<blockquote><p>Even after Joseph had died, they observed circumcision (as seems must be gathered from Ex. 4:25), and were also intent upon prayers (Ex. 2:23); they certainly desired sacrifices, but did not sacrifice, being deterred by fear of the Egyptians (Ex. 8:26), yet at the same time when about to flee they sacrificed the Passover in Egypt (Ex. 12). Besides those points, hardly anything is mentioned about their divine worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology (RHB), bk. 8, ch. 2, sect. 25</cite></span></figcaption>

</figure><figure class="quote" id="q-1c585422d6" data-kw="">
<blockquote><p>Some are so proceeded against for not observing of holy days, some for not kneeling at the sacrament of the Lord’s Supper, some for not using the sign of the cross in baptism; and what would become of ministers that should neglect or omit to wear the surplice in sacred administrations is easy to conjecture. But these things are all of them unwritten and unscriptural. Great and many indeed have been the disputes of learned men to prove that although they have no divine institution, nor yet example of apostolical or primitive practise, yet that they may be lawfully used for decency and order in the worship of God. Whether they have evinced what they aimed at is as yet undetermined… they are all granted to be arbitrary inventions of men… For what men think meet to do themselves in the matters of the house of God and his worship, it may be measured and accepted with Him according to their light and design. But for what they impose on others… they ought to have his warrant and authority for.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Evangelical Love, Church-Peace &amp; Unity, with the Occasions &amp; Reasons present Differences &amp; Divisions about Things Sacred &amp; Religious (1672)</cite>, ch. 5, pp. 212-13</span></figcaption>

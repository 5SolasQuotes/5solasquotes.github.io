<main class="wrap"><figure class="quote" id="q-69ed473696" data-kw="">
<blockquote><p>Last of all, seeing we cannot by any means shew forth worthy repentance, and pacify God his anger justly conceived against us (yea with the sway of sin prevailing in us, we rather exasperate his further wrath) it remaineth for us therefore, to take this sure course, even to lift up the eyes of our mind unto our Mediator Jesus Christ, and to beseech the Father to respect the righteousness and obedience of him alone; &amp; not to call into accompt [account] the unrighteousness and disobedience either of our first parent, or of us our selves, but to impute the righteousness of Christ unto us, as though it were our own. And hereunto let the words of the Apostle by all means move and stir thee: As by the offence of one, the fault came on all men to condemnation, so by the [obedience] of one, the benefit abounded toward all men to the justification of life, &amp;c.</p></blockquote>

</figure><figure class="quote" id="q-6bec436415" data-kw="">
<blockquote><p>At this point it may be asked whether justification is perfectly completed in this life? Let me say in response to this, first of all, that God’s benefits to us in Christ fall into two categories. One category includes benefits that are not inherent in man, such as his eternal predestination, his justification, and his adoption. The other includes benefits that are inherent in man, such as his effectual calling and his glorification. The benefits included in these two categories have this in common, that none of them—not predestination, not justification, not adoption, not effectual calling, not glorification—will be fully manifested and revealed until Christ’s own manifestation is full and perfect. Indeed, the revelation of these things in man has a beginning in the first manifestation of Christ Himself. Thus the apostle writes in Rom. 3:21, “but now the righteousness of God is revealed, etc.” But the revelation of them in believers is not yet full. Thus 1 Jn. 3:2: “We are already sons of God, but it has not yet appeared what we will be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’</cite>, tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.4.2. ‘The Imputation of Righteousness’, pp. 108-9 Rollock (c. 1555-1599) was a Scottish minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-21ed39e65e" data-kw="">
<blockquote><p>I have indicated in a variety of ways that the Christian man must believe for a certainty that he is in a state of divine grace, and that he has the cry of the Holy Spirit in his heart, especially when he is performing his proper function, which is to confess or to suffer for confessing. I did this in order that you might utterly repudiate the wicked idea of the entire kingdom of the pope, the teaching that a Christian man must be uncertain about the grace of God toward him. If this opinion stands, then Christ is completely useless. For whoever doubts the grace of God toward him this way must necessarily doubt the promises of God and therefore the will of God, as well as the birth, suffering, death, and resurrection of Christ. There is no greater blasphemy against God than to deny the promises of God and God Himself, Christ, etc. Therefore it was the height not only of insanity but of wickedness when the monks were so zealous in enlisting the youth of both sexes in the monasteries for their religious and, as they called them, “holy” orders, as a sure state of salvation; and then, once they were enlisted, they commanded them to doubt the grace of God. Thus the pope also summoned the whole human race to the obedience of the holy Roman Church as a holy estate in which they would be sure to obtain salvation, and then he commanded those who obeyed his laws to have doubts. In this way the kingdom of Antichrist first boasts and exaggerates the sacredness of its laws, orders, and rules, and it promises the certainty of eternal life to those who observe them; but then, when the miserable beings have been punishing their bodies for a long time in accordance with human traditions by keeping vigils, fasting, etc., their reward for all this is not to know whether or not this obedience of theirs is pleasing to God. Satan took a horrible delight in the killing of souls by the papists. Therefore the papacy is a veritable torture chamber of consciences and the very kingdom of the devil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 385–386.</span></figcaption>

</figure><figure class="quote" id="q-b4fd6cf121" data-kw="">
<blockquote><p>May faith be properly called a condition The question has been keenly agitated between Calvinists, whether faith itself should be spoken of as a condition of the covenant. One party has denied it, because they supposed that the language which represented man as performing a condition of his own salvation would make an inlet for human merit. But it is most manifest that there is a sense in which faith is the condition, in all such passages as Jn. 3:16; Acts 8:37; Jn. 11:26; Mk. 16:16. No human wit can evade the fact, that here God proposes to man a something for him to do, which, if done, will secure redemption; if neglected, will ensure damnation—and that something is in one sense a condition. But of what kind? Paul everywhere contrasts the condition of works, and the condition of faith. This contrast will be sufficiently established, and all danger of human merits being intruded will be obviated, if it be observed that faith is only the appointed instrument for receiving free grace purchased by our Surety. It owes its organic virtue as such, to God’s mere appointment, not to the virtue of its own nature. In the Covenant of Works, the fulfilment of the condition on man’s part earned the result, justification by its proper moral merit. In the Covenant of Grace, the condition has no moral merit to earn the promised grace, being merely an act of receptivity. In the Covenant of Works, man was required to fulfil the condition in his own strength. In the Covenant of Grace, strength is given to him to believe, from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus &amp; Notes of the Course of Systematic &amp; Polemic Theology</cite>, 2nd ed. (St. Louis: Presbyterian Publishing Company, 1878), pp. 438–39</span></figcaption>

<div class="actions"><button class="copy" data-copy="“May faith be properly called a condition The question has been keenly agitated between Calvinists, whether faith itself should be spoken of as a condition of the covenant. One party has denied it, because they supposed that the language which represented man as performing a condition of his own salvation would make an inlet for human merit. But it is most manifest that there is a sense in which faith is the condition, in all such passages as Jn. 3:16; Acts 8:37; Jn. 11:26; Mk. 16:16. No human wit can evade the fact, that here God proposes to man a something for him to do, which, if done, will secure redemption; if neglected, will ensure damnation—and that something is in one sense a condition. But of what kind? Paul everywhere contrasts the condition of works, and the condition of faith. This contrast will be sufficiently established, and all danger of human merits being intruded will be obviated, if it be observed that faith is only the appointed instrument for receiving free grace purchased by our Surety. It owes its organic virtue as such, to God’s mere appointment, not to the virtue of its own nature. In the Covenant of Works, the fulfilment of the condition on man’s part earned the result, justification by its proper moral merit. In the Covenant of Grace, the condition has no moral merit to earn the promised grace, being merely an act of receptivity. In the Covenant of Works, man was required to fulfil the condition in his own strength. In the Covenant of Grace, strength is given to him to believe, from God.”

— Robert L. Dabney, Syllabus &amp; Notes of the Course of Systematic &amp; Polemic Theology, 2nd ed. (St. Louis: Presbyterian Publishing Company, 1878), pp. 438–39">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMay+faith+be+properly+called+a+condition+The+question+has+been+keenly+agitated+between+Calvinists%2C+whether+faith+itself+should+be+spoken+of+as+a+condition+of+the+covenant.+One+party+has+denied+it%2C+because+they+supposed+that+the+language+which+represented+man+as+performing+a+condition+of+his+own+salvation+would+make+an+inlet+for+human+merit.+But+it+is+most+manifest+that+there+is+a+sense+in+which+faith+is+the+condition%2C+in+all+such+passages+as+Jn.+3%3A16%3B+Acts+8%3A37%3B+Jn.+11%3A26%3B+Mk.+16%3A16.+No+human+wit+can+evade+the+fact%2C+that+here+God+proposes+to+man+a+something+for+him+to+do%2C+which%2C+if+done%2C+will+secure+redemption%3B+if+neglected%2C+will+ensure+damnation%E2%80%94and+that+something+is+in+one+sense+a+condition.+But+of+what+kind%3F+Paul+everywhere+contrasts+the+condition+of+works%2C+and+the+condition+of+faith.+This+contrast+will+be+sufficiently+established%2C+and+all+danger+of+human+merits+being+intruded+will+be+obviated%2C+if+it+be+observed+that+faith+is+only+the+appointed+instrument+for+receiving+free+grace+purchased+by+our+Surety.+It+owes+its+organic+virtue+as+such%2C+to+God%E2%80%99s+mere+appointment%2C+not+to+the+virtue+of+its+own+nature.+In+the+Covenant+of+Works%2C+the+fulfilment+of+the+condition+on+man%E2%80%99s+part+earned+the+result%2C+justification+by+its+proper+moral+merit.+In+the+Covenant+of+Grace%2C+the+condition+has+no+moral+merit+to+earn+the+promised+grace%2C+being+merely+an+act+of+receptivity.+In+the+Covenant+of+Works%2C+man+was+required+to+fulfil+the+condition+in+his+own+strength.+In+the+Covenant+of+Grace%2C+strength+is+given+to+him+to+believe%2C+from+God.%E2%80%9D%0A%0A%E2%80%94+Robert+L.+Dabney%2C+Syllabus+%26+Notes+of+the+Course+of+Systematic+%26+Polemic+Theology%2C+2nd+ed.+%28St.+Louis%3A

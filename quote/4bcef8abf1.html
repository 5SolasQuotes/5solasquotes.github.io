<main class="wrap"><figure class="quote" id="q-4bcef8abf1" data-kw="">
<blockquote><p>Whenever someone has a serious problem and they look to other people for help, they often get told that “everything is going to be fine.” The Church of Ireland theologian, George Salmon (1819-1904) notes that to do so is to heal the wounds of others lightly:

Such comforting assurances are often easily given because they cost so little. They relieve him who makes them from the burden of a painful demand on him for sympathy. One is not always in the mood to mourn with those who mourn, or even to seem to mourn, and so it is pleasant to be able to persuade oneself that the need for such an effort has not arisen and may never arise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cathedral and University Sermons</cite>, (2nd edn, London: John Murray, 1901), p. 137.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Fifthly, walk humbly and dependently; rejoice, but be not secure. Trust to God in Covenant, not to your Covenant. Make not your Covenant, your Christ; no, not for this Temporal Salvation. As a Horse trusted to, is a vain thing to save a man, Psal. 32. so likewise is a Covenant trusted to; neither can it deliver a Nation by its great strength: though indeed the strength of it bee greater, then the strength of many Horses. In vain is salvation hoped for from this Hill, or from a multitude of Mountains heaped up and joined in one by the bond of this Covenant. Surely in the Lord our God, our God, in Covenant, is the Salvation of ENGLAND.

We cannot trust too much in GOD, nor too little in the Creature; There is nothing breaks the staff of our help but our leaning upon it. If we trust in our Covenant, we have not made it with God, but we have made it a God; And every God of man’s making, is an Idol, and so nothing in the World: you see, pride in, or trust to this Covenant will, make it an Idol, and then in doing all this, we have done nothing, For an Idol is nothing in the World. 1 Cor. 8. 4.) And of nothing comes nothing. By over-looking to the means, we lose all; And by all our travail shall bring forth nothing but wind It will not work any deliverance in the Land. Wherefore, rest not in the thing Done, but yet, up and be doing which is the last point, and my last motion about your walking in Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The nature, solemnity, grounds, property, and benefits, of a sacred covenant. Together with the duties of those who enter into such a covenant. Delivered in a sermon at Westminster, at the publique convention, (ordered by the Honourable House of Commons) for the taking of the Covenant, by all such, </cite>, (London: John Rothwell, 1643), p. 40.</span></figcaption>

</figure><figure class="quote" id="q-ad2710556d" data-kw="">
<blockquote><p>This may move us to embrace integrity and sincerity, because the Lord so highly esteems it, that He accepts of our obedience as perfect which springs from it, though it be stained with much corruption, and joined with many imperfections. …those are said to have been perfect before God who in simplicity and uprightness of heart laboured after perfection, and served God in sincerity and truth, as Noah, Abraham, Job, David, Asa, Zachary and Elizabeth, though they had many corruptions and imperfections which in the Scriptures are recorded of them… And therefore David uses his sincerity in praying, as an argument to persuade the Lord to give him audience: ‘Give ear’ (says he) ‘unto my prayers, which go not out of feigned lips.’ (Ps. 17:1) And Hezekiah’s integrity of life, as a reason to move Him for the repealing of the sentence of death and prolonging of his days. ‘Remember now, O Lord,’ (says he) ‘I beseech thee, how I have walked before thee in truth, and with a perfect heart, etc.’ (Isa. 29:13)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Godliness or a Treatise of a Christian Life</cite>, (London: 1622), bk. 4, ch. 1, §4 ‘That our imperfect obedience is accepted of God, if it be done in sincerity and integrity’, pp. 405-6</span></figcaption>

<blockquote><p>This thesis is an examination of the eucharistic doctrine of ten Scottish theological writers in the tradition of Scottish Episcopacy… The argument of this thesis is that all of the writers, rejecting the Tridentine, Lutheran, Bezan-Calvinist, and Zwinglian definitions of the Eucharist, maintained a material sacrifice in the Eucharist, which is an offering to God the Father of bread and wine as the propitiatory memorial of Christ’s death on the Cross, commanded by Christ Himself at the Last Supper. The sacrifice is propitiatory because it is the means of representing the one sacrifice of Christ on the cross to God the Father, thereby pleading the benefits of the cross for the communicants. The bread and wine do not change substance, but become effectively the body and blood of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wallace-d-kornahrens.html">Wallace D. Kornahrens</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eucharistic Doctrine in Scottish Episcopacy</cite>, 1620-1875 Download (2008) PhD thesis 300 pp. | Abstract:</span></figcaption>

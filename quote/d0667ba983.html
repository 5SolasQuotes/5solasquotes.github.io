<main class="wrap"><figure class="quote" id="q-d0667ba983" data-kw="">
<blockquote><p>I. Whether regeneration of the intellect through illumination, both in the first and in the second act, whose terminus or formal effect is knowledge and assent to truth, theological wisdom, ecclesiastical prudence, etc., differs in species and form from that more common aid of illumination which also befalls certain reprobate, or the elect before actual conversion? Response: Affirmatively, from 1 Jn. 5:19–20; Phil. 1:9–10; Col. 1:9; Eph. 1:17–18; Jm. 3:13, 15, 17, where distinctly ἡ ἄνωθεν σοφία [hē anōthen sophia, the wisdom from above]; and Lk. 1:17, φρόνησις δικαίων [phronēsis dikaiōn, the prudence of the righteous]. Concerning which [see] in the Disputation on Simplicity and Hypocrisy. By equal reasoning we think a distinction should be made here, as concerning faith of miracles and other charisms in the regenerate, which are materially common, formally peculiar and proper in the regenerate and truly faithful, Mk. 16:16–17; Jn. 7:28[?]; Acts 19:4–6. Compare the Disputations on Miracles and on Charisms. But whether the habit of theological wisdom or ecclesiastical prudence in the unregenerate ought properly and specifically to be called infused, or indeed acquired, could be inquired. We incline to the latter affirmative, so that we regard such habits in the same estimation as their philosophical, medical, historical, poetic habits, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e2b79a5551" data-kw="">
<blockquote><p>In former times those who accepted the divine preaching and who were baptized for their salvation were given visible signs of the grace of the Holy Spirit at work in them. Some spoke in tongues which they did not know and which nobody had taught them, while others performed miracles or prophesied. These Corinthians also did these things, but they did not use the gifts as they should have done. They were more interested in showing off than in using them for the edification of the church… Even in our time grace is given to those who are deemed worthy of holy baptism, but it may not take the same form as it did in those days.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodoret.html">Theodoret of Cyrus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>c. 458/466)</cite>, Commentary on the First Epistle to the Corinthians, 240.43, on 1 Cor. 12:1, 7. Cited in ed. Gerald Bray, I-II Corinthians in Ancient Christian Commentary on Scripture: New Testament VII (IVP, 2006), p. 117</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><figure class="quote" id="q-75bb75dfa8" data-kw="">
<blockquote><p>7. Yet we say, that as God by gifts may furnish some in a more than ordinary way; so may He, and uses He to thrust them out in a mixed way to the exercise of these for the edification of His Church, and make the seal of his call extraordinarily ratify his sending of them, that is, as He may furnish men partly by means, and especially by his blessing extraordinarily accompanying them, so may He send them out partly in a mediate way by men’s opening of the door, partly by his more than ordinary thrusting of them out, making up so what was defective in the mediate call by some extraordinary concurrences of impulse and gifts within, of circumstances of providence without, and of efficacy upon, and acception of it amongst others, whereby it cometh to be ratified. This the Lord fulfilled at the entry of the Reformation, raising up men comparatively extraordinarily furnished and commissionated for his work, yet still ministers of the same Gospel, and walking according to the common rule with others in their ministerial charge. This is not ordinarily to be imitated, but where the like cases, call, and circumstances concur…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 10, ‘Concerning Prophesying’ in A Commentary upon the Book of the Revelation… (Edinburgh, 1658), pp. 469-72</span></figcaption>

</figure><figure class="quote" id="q-8c5009acc0" data-kw="">
<blockquote><p>They spoke with strange tongues, and not those of their native land; and the wonder was great, a language spoken by those who had not learnt it. And the sign is to them I that believe not [1 Cor. 14:22], and not to them that believe, that it may be an accusation of the unbelievers, as it is written, ‘With other tongues and other lips will I speak unto this people, and not even so will they listen to Me saith the Lord. [Isa. 28:11]&#x27;</p></blockquote>

<blockquote><p>4. Yet if we take prophesy for the understanding of God’s mind, and for attaining to be well acquainted with the mysteries of God, by a mediate way; yea, and that beyond the applied means, or to have a gift and capacity for discerning of these things with little pains, and that beyond what some others can attain unto by any labor, we conceive that in this sense prophesy and prophets may be said to be continued in the Church; and such God raised up in the time of Reformation, men singularily gifted with a prophetical spirit in this sense…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b2e91bf75f" data-kw="">
<blockquote><p>The Covenanters in the United States realised that chattel slavery was a sin that would provoke the wrath of God. Hence, they made it a cause for fasting that such evil existed in their nation:

That abominable species of murder, even enslaving thousands of fellow creatures for life and their posterity without end, and degrading them below the brutes, is now reduced to a regular system, and seems, by a long prescription to a brave remedy. There is, for the present, power on the side of the oppressors, but no power on the side of the oppressed.

What humane man but will mingle his tears with those of his fellow mortals, when he sees them shut out from every source of rational happiness, far banished from their native homes, torn from their dear relations, and wallowing in the most abominable uncleanness, while every means of ameliorating their condition is artfully kept from their view by their insolent and murderous masters. Oh! America, what hast thou to account for, but to God and man, on the head of slavery alone? Alas! when shall God arise for the cries of the oppressed?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-mckinney.html">James McKinney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Act of the Reformed Presbytery in North America for a Day of Public Fasting, with the Causes thereof (5 Aug. 1795) in Reformed Presbyterian and Covenanter</cite></span></figcaption>

ovenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-53c3b57eba" data-kw="">
<blockquote><p>If I rightly apprehend our condition, we are in a way of declining. We were, within these few years, more in the conscionable use of means, and the Lord did shine upon us in some measure; and now we are fallen from that which we were. It is judged fit by some (and many of our solidest professors) that if we cannot have them in congregations, yet families and private persons may have days of humiliation, at least the last Wednesday of every month or thereabout, according to the best conveniency of providence. And if this were gone about in your country, and in Stirlingshire, Fife, in Merse, Teviotdale, the West, in Nithsdale and Galloway and other places, it would prove our strength and help; for we are few and very low. Our adversaries are not idle; and there is a faintness and heartless discouragement on the spirits of many. These are to entreat that you would combine with Mr. Robert Campbell, Mr. John Cruickshanks, and other of our brethren in your bounds, to stir up one another that we may wrestle with the Lord for the remnant. I am confident the Lord will yet be inquired of us for this. Though the same particular day be not observed, yet, where many are on work, some salvation from the Lord’s arm is to be expected. I am decaying most sensibly and I should look on it as a mercy if the Lord would send a wakening among His own. And blessed shall he be who shall blow the trumpet to cause other sleeping ones awake and shall help to build the wastes and the fallen tabernacle of David. I shall earnestly desire you do bestir yourself herein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters of Samuel Rutherford</cite>, (Edinburgh: Anderson &amp; Ferrier, 1894), Letter 365, to John Murray, Minister at Methven, p. 708</span></figcaption>

<blockquote><p>The truth is that fasting is such a help to extraordinary humiliation, as moderate feasting is to extraordinary thanksgiving, and therefore [fasting] is no more worship than Christian feasting: And to this purpose do our divines answer, concerning this place, which is ordinarily objected by every Papist, as here by the Rejoinder [of Ames’s opponent]. See Chemnitius upon these words. See Polanus, Syntagma, bk. 9, ch. 8, ‘Fasting is a help to prayer, a sign of humility and repentance, but is not a worship of God.’ 5. Fasting such as Hannah’s was, is not a human institution, as our ceremonies are, but partly natural, when the whole man is taken up with greater and more instant imployment, exclusive of all ordinary refreshments: and partly of divine application, in extraordinary humiliation, so that it has ground and example both in the Old &amp; New Testament, which our ceremonies are destitute of.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, … (Amsterdam: Thorp, 1633), Manuduction, ch. 12, section 2, pp. 145-46</span></figcaption>

</figure><figure class="quote" id="q-57a4c48970" data-kw="">
<blockquote><p>Note that the Irish Reformed Presbyterian Synod considered the spread of Arminianism and the sectarian errors that resulted from the 1859 Revival in Ulster to be a cause for fasting:

THE Synod of the Reformed Presbyterian Church in Ireland, at its last Annual meeting, appointed Thursday, the 31st January, to be observed as a day of Public Fasting and Humiliation, by the congregations under their care. The following summary of Causes of Fasting were adopted by the Synod:-

The continued opposition of the kingdoms of this world to the high and righteous claims of the Divine Mediator – Slavery among the nations of the earth and more especially in the United States of North America – The continued existence of the power of Popery, and the efforts which are being put forth, in almost all Popish countries, to restore the Man of Sin to his former civil authority and power – The timid and sinful policy of British rulers, with respect to Popery, as is seen in the endowment of the Popish College of Maynooth, of Popish chaplains in the army and navy, jails, poorhouses, and penitentiaries; in printing Popish books for the Roman Catholic soldiers, and in filling up so many of the vacancies in the Irish Bar and Bench with Papists –

The general disregard manifested, by British Statesmen in their legislative acts to the Word of God, and the interests of true religion – A sinful expediency, hedges round from assault the degrading idolatry of India, retains on the statute-book the monstrous dogma of the Erastian and Popish teachers of soul-destroying heresies, and others who are induced to remain neutral and quiescent with respect to the honours of the Redeemer’s Crown – The continued divisions among the churches of the Reformation, and a general refusal on the part of these churches to return to ancient covenanted attainments – The prevalence of lax and erroneous views with respect to the doctrine, worship, discipline, and government of the church – The recent extensive spread of Arminian errors, and the tendency to sectarianism and extravagancy, on the part of many who profess to have experienced Divine illumination.

As regards our own church, we have to lament the want to unity among the several branches of the Reformed Presbyterian Church. Lukewarmness, illiberality, and a low state of spirituality, on the part of some, and spiritual pride on the part of others. A tendency, in some quarters, to recede from a faithful Scriptural testimony; and a scarcity of gospel labourers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reformed-presbyterian-synod-of-ireland.html">Reformed Presbyterian Synod of Ireland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Causes of fasting’ Covenanter</cite></span></figcaption>

formation%2C+and+a+general+refusal+on+the+part+of+these+churches+to+return+to+ancient+covenanted+attainments+%E2%80%93+The+prevalence+of+lax+and+erroneous+views+with+respect+to+the+doctrine%2C+worship%2C+discipline%2C+and+government+of+the+church+%E2%80%93+The+recent+extensive+spread+of+Arminian+errors%2C+and+the+tendency+to+sectarianism+and+extravagancy%2C+on+the+part+of+many+who+profess+to+have+experienced+Divine+illumination.%0A%0AAs+regards+our+own+church%2C+we+have+to+lament+the+want+to+unity+among+the+several+branches+of+the+Reformed+Presbyterian+Church.+Lukewarmness%2C+illiberality%2C+and+a+low+state+of+spirituality%2C+on+the+part+of+some%2C+and+spiritual+pride+on+the+part+of+others.+A+tendency%2C+in+some+quarters%2C+to+recede+from+a+faithful+Scriptural+testimony%3B+and+a+scarcity+of+gospel+labourers.%E2%80%9D%0A%0A%E2%80%94+Reformed+Presbyterian+Synod+of+Ireland%2C+%E2%80%98Causes+of+fasting%E2%80%99+Covenanter&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F57a4c48970.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/57a4c48970.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/09/20/reformed-presbyterian-synod-of-ireland-causes-for-fasting-1861/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>The fast is indicted [called and set] eight days before, and the causes laid open for preparing of the people for humiliation (as Joel 2:1-3; Isa. 22:12,13). We have no anniversary [annual] and set fasts or feasts either, because God Himself by his judgment imminent, or already inflicted, or by permitting his people to follow their own ways, calls to fasting and mourning (Isa. 22:13, Joel 2:1-6, etc.), and so by his mercies and wonderful deliverances calls to extraordinary joy of thanksgiving (Ps. 118:24). The doctrine of the Law is preached (as Joel 2 and Isa 58), and the fast observed with abstinence from meat and drink, and carnal and ordinary pleasures (Joel 2:16).</p></blockquote>

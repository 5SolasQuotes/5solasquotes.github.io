<main class="wrap"><figure class="quote" id="q-dd7252cd57" data-kw="">
<blockquote><p>XVI. Second, the necessity of the case makes many things lawful which otherwise would not be lawful, in domestic affairs as well as in politics. If the doorkeeper of a house is overcome by a lethargy or by apoplexy, he cannot prevent the entrance of thieves, even though it is lawful for any servant to take the keys and to close the gates against them. If he to whom the care of supporting a family is committed denies bread to his children, who would say that it is not lawful for anyone of the domestics to supply them with bread if he can so that they may not perish with hunger? If the father himself rages for the destruction of his children, should not his arms be wrested from him, his children removed and entrusted to a guardian, not waiting for the judgment of a magistrate? Nay, a friend and neighbor can take this upon himself until the public authority has made some provision for them. When a fire is raging, who doubts that it is the duty of all to bring water to extinguish it, especially when they cease to whom this care pertained? Thus in a republic, if the rulers and prefects snore while the enemy approaches; if the gatekeepers open the gates to him; will it not be lawful for any citizen to snatch the keys from the hand of the betrayer in order to shut the gates against the enemy and to call to arms?… When the thing itself calls, what need is there to seek an external call? Nay, if they should cease form a regard to obedience, unmindful of the oath given to their prince, they would be deservedly convicted of perfidy and treachery because here the consciousness of wickedness alone pollutes, from which no one purges himself, unless according to his ability he resists the inrushing evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. Dennison, Jr. (P&amp;R), vol. 3, 18th Topic, Question 23, p. 220</span></figcaption>

<blockquote><p>Again, in the next place, take also this general observation, That although the Judicial and Ceremonial Laws were given at the same time with the Moral Law, yet there is a difference between them. And this is to be taken notice of, lest any should think, what will this discourse make for the honor of the Moral Law, more than the other laws? It’s true, these three kinds of laws agree in the common efficient cause, which was God; and in the minister, or mediator, which was Moses; in the subject, which was the people of Israel; and all and every one of them; as also in the common effects, of binding and obliging them to obedience, and to punish the bold offenders against them. But herein the Moral Law is preeminent:

1. In that it is a foundation of the other laws, and they are reducible to it.

2. This was to abide always, not the other.

3. This was immediately written by God, and commanded to be kept in the Ark, which the other were not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Moral Law &amp; the Covenants</cite>, (London: Young, 1647), p. 155</span></figcaption>

</figure><figure class="quote" id="q-c4481efc4d" data-kw="">
<blockquote><p>Inferior Kirk-judicatories, being ordinances of Jesus Christ, have the promise made to them when they meet in His Name and do adhere to His Truth, Mt. 18:18-19. And if so, shall the sentence of the superior Judicatory, when wrong upon the matter, oblige them to submission? If a Presbytery, or a Synod with the consent of the Presbytery, do in an orderly way of procedure, cast out an heterodox and scandalous minister, must they, because the Synod or General Assembly does sustain his unjust appeal, be obliged in conscience again to receive him as a member of the Presbytery or Synod, and acknowledge him for a lawful minister of the Gospel; or, if they have in an orderly way of procedure, admitted an able orthodox godly man to the Ministry: Must they, because the superior Judicatory commands them so to do, cease to acknowledge him or own him for one of their number, or as a Minister of the Gospel? If so, it seems to be an ill-grounded truth that is commonly delivered by some divines writing of synods, that the power of synods is not corruptive, privative, or destructive to the power of classical presbyteries or single congregations, but perfective, acumulative, and conservative thereunto. 8. What is denied jure to ecumenic councils, and so lawfully called prophets and ministers of the Gospel, to Nathan, to David, to Paul, to an angel from heaven, Gal. 1:8, cannot warrantably be given to General Assemblies. If ecumenic councils, lawfully called ministers, if Nathan, if Samuel, if Paul, if an angel teach or decree but according to the Word of the Lord, we are to counteract, and to contradict, Gal. 1:8. “But though we or an angel from heaven, preach to you, beside what we have preached, let him be accursed,” Gal. 1:8. Therefore, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them</cite>, … 1658, pp. 107-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-44e86104a3" data-kw="">
<blockquote><p>But to make it yet more and plentifully appear how miserably our opposites would enthrall our consciences, I will here show: 1. What the binding of the conscience is, 2. How the laws of the Church may be said to bind [and how not]. 3. What is the judgment of Formalists touching the binding power of ecclesiastical laws.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, ... (Edinburgh, 1637) | 1st Part, ch. 4, ‘That the Ceremonies take away our Christian Liberty, proved by a second reason, namely, because Conscience itself is bound and adstricted’. Pages 8-11 are the most important. The last third of the section refutes the formalist view that such ordinances bind the outward man, though not the conscience., p. 7</span></figcaption>

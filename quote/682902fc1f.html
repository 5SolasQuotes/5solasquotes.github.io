<main class="wrap"><figure class="quote" id="q-682902fc1f" data-kw="">
<blockquote><p>We find, that in the ministry of the New Testament there is a comely, beautiful and divine order: one kind of ministers, both ordinary and extraordinary, being placed in degree and dignity before another, as the apostles before all other ministers, the pastor before the elder, and deacon: But we do not find in ministers of the same kind that one has majority of power over others, or priority of degree and dignity before others, except upon the moral respect of age, zeal, gifts, etc. No apostle is in degree above other apostles, no evangelist above other evangelists, nor elder above other elders, no deacon above other deacons: Upon what ground then from Scripture can we believe or conceive that one pastor is in degree superior to other pastors, or that, in all other sorts of ministers, ordinary and extraordinary, there’s all [to] be a parity in their own kind and only in the office of pastors an inequality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unlawfulness and danger of Limited Prelacy, or Perpetual Presidency in the Church, Briefly Discovered</cite>, (1641), p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-8a99c437fa" data-kw="">
<blockquote><p>Now beside the apostles, prophets and evangelists, which were not ordained to be ordinary and perpetual offices in the Church, there are but two ecclesiastical orders or degrees instituted by Christ in the New Testament, viz. elders and deacons. Excellenter Canones d•…os tantum sacros ordines appellari censent, Diaconatus scilicet &amp; Presbyterat•…, quia hos solos primitiva Ecclesia legitur habuisse, &amp; de hi•… sol•… praeceptum Apostli habe•…, says the Master of Sentences (bk. 4, distinction [??])… Moreover, 1 Tim. 3, he gives order only for bishops and deacons, but says nothing of a third order. Wherefore it is manifest that beside those two orders of elders and deacons, there is no other ecclesiastical order which has any divine institution, or necessary use in the Church. And princes should do well to apply their power and authority to the extirpation and rooting out of Popes, Cardinals, Patriarches, Primates, Archbishops, Bishops, Suffragans, Abbots, Deanes, Vice-Deans, Priors, Archdeacons, Subdeacons, Chancellours, Chantours, Subchantours, Exorcists, Monks, Hermits, Acoluths, and all the whole rabble of Popish orders, which undo the Church, and work more mischief in the earth than can be either soon seene or shortly told. But contrary wise, princes ought to establish and mantain in the Church, elders and deacons, according to the apostolical institution. Now elders are either such as labor in the Word and doctrine, or else such as are appointed for discipline only…. And many more of our divines, who teach that the apostle 1 Tim. 5:17, directly implies that there were some elders who ruled well, and yet labored not in the Word and doctrine, and those elders he means by them that rule, Rom. 12:8 and by governments, 1 Cor. 12:28, where the apostle says not ‘helps in governements,’ as our new English translation corruptly reads, but ‘helps, governements,’ etc. plainly putting ‘governements’ for a different order from ‘helps’ or deacons… Deacons were instituted by the apostles for collecting, receiving, keeping, and distributing of ecclesiastical goods, which were given and dedicated for the maintenance of ministers, churches, schools, and for the help and relief of the poor, the stranger, the sick and the weak, also for furnishing of such things as are necessary to the ministration of the sacraments. Beside which employments, the Scripture has assigned neither preaching, nor baptizing, nor any other ecclesiastical function to ordinary deacons… And as for the other sort of elders, together with deacons, we judge the ancient order of this Church [of Scotland], to have been most convenient for providing of well qualified men for those functions and offices. For the eighth head of the first book of discipline, touching the election of elders and deacons, ordains that men of best knowledge and cleanest life, be nominated to be in election, and that their names be publicly read to the whole Church by the minister, giving them advertisement, that from among them must be chosen elders and deacons: that if any of these nominated be noted with public infamy, he ought to be repelled: And that if any man know others of better qualities within the Church, then these that be nominated, they should be put in election, that the Church may have the choice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), ch. 8, Digression 1, ‘Of the Vocation of Men of Ecclesiastical Order’, pp. 160-63</span></figcaption>

e+were+some+elders+who+ruled+well%2C+and+yet+labored+not+in+the+Word+and+doctrine%2C+and+those+elders+he+means+by+them+that+rule%2C+Rom.+12%3A8+and+by+governments%2C+1+Cor.+12%3A28%2C+where+the+apostle+says+not+%E2%80%98helps+in+governements%2C%E2%80%99+as+our+new+English+translation+corruptly+reads%2C+but+%E2%80%98helps%2C+governements%2C%E2%80%99+etc.+plainly+putting+%E2%80%98governements%E2%80%99+for+a+different+order+from+%E2%80%98helps%E2%80%99+or+deacons%E2%80%A6+Deacons+were+instituted+by+the+apostles+for+collecting%2C+receiving%2C+keeping%2C+and+distributing+of+ecclesiastical+goods%2C+which+were+given+and+dedicated+for+the+maintenance+of+ministers%2C+churches%2C+schools%2C+and+for+the+help+and+relief+of+the+poor%2C+the+stranger%2C+the+sick+and+the+weak%2C+also+for+furnishing+of+such+things+as+are+necessary+to+the+ministration+of+the+sacraments.+Beside+which+employments%2C+the+Scripture+has+assigned+neither+preaching%2C+nor+baptizing%2C+nor+any+other+ecclesiastical+function+to+ordinary+deacons%E2%80%A6+And+as+for+the+other+sort+of+elders%2C+together+with+deacons%2C+we+judge+the+ancient+order+of+this+Church+%5Bof+Scotland%5D%2C+to+have+been+most+convenient+for+providing+of+well+qualified+men+for+those+functions+and+offices.+For+the+eighth+head+of+the+first+book+of+discipline%2C+touching+the+election+of+elders+and+deacons%2C+ordains+that+men+of+best+knowledge+and+cleanest+life%2C+be+nominated+to+be+in+election%2C+and+that+their+names+be+publicly+read+to+the+whole+Church+by+the+minister%2C+giving+them+advertisement%2C+that+from+among+them+must+be+chosen+elders+and+deacons%3A+that+if+any+of+these+nominated+be+noted+with+public+infamy%2C+he+ought+to+be+repelled%3A+And+that+if+any+man+know+others+of+better+qualities+within+the+Church%2C+then+these+that+be+nominated%2C+they+should+be+put+in+election%2C+that+the+Church+may+have+the+choice.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29%2C+ch.+8%2C+Digression+1%2C+%E2%80%98Of+the+Voca <blockquote><p>2. The extent; unlimited, ‘In everything;’ that is, in everything that is lawful and belonging to her duty. Certainly those things which hinder our due subjection to God and Christ are excepted; as the apostle in another case, 1 Cor. 15:29, ‘When He hath put all things under Him, it is manifest that He is excepted that hath put all things under Him.’ There are cases excepted by a superior law. In Luke 14:26, it is said, ‘If a man hate not father and mother, wife and children, he cannot be my disciple.&#x27;</p></blockquote>

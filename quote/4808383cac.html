<main class="wrap"><figure class="quote" id="q-4808383cac" data-kw="">
<blockquote><p>The proofs which are alleged [for Christ’s physical presence in communion] from the omnipotency of God, do infer no corporal presence of Christ in the Supper. Not the First; because the omnipotency of God excludeth, both things contrary to his nature, and things contradictory; and not to be able to do those things, is not a point of weakness, but of infinite power, and constancy. Not the Second; because his first apparition was heavenly, which nothing furthereth the presence of Christ on earth: The second, was in the night, which appeared not to the eyes, but to the mind.

Not the Third; because the Fathers treated, either of the presence of Christ, as touching his person, as Chrysostom; or of the Sacramental presence of his body in the Supper, as Ambrose; or of the effect of the eating of his body, as Cyril, and Theophilact: or lastly, they spake Hyperbolically, as Augustine.

Not the Fourth; because, to reason from the divine nature, to the human, and from the one part of man, which is spiritual, to the other, which is corporal, is even proportionally inconsequent. Not the Fifth; because it is one thing to treat of the mysteries, which go beyond Nature; but another thing of the miracles which overthrow nature. Not the Sixt; because of those things, which are equally united, the one cannot be any where else, where the other is not, or may not be; and to attribute to Christ two bodies equally united, were a monstrous thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius-jr.html">Lucas Trelcatius Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief institution of the common places of sacred divinity. Wherein, the truth of every place is proved, and the sophisms of Bellarmine are reproved</cite>, trans. John Gawen (London: Francis Burton, 1610), 2.13, pp 430-31.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

<blockquote><p>The personal union also occurred ‘without division (adiairetos) and without separation (achoristos)’, in such a way that the one nature is not actually divided or segregated from the other (for at no time or place, not even in death, does He lose what once He had taken up and joined to Himself). But both natures forever remain so united in the person…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-thysius.html">Antonius Thysius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 25, ‘On the Incarnation of the Son of God &amp; the Personal Union of the Two Natures in Christ’ in Synopsis Puris Theologiae, Synopsis of Pure Theology</cite>, ed. Henk van den Belt, trans. Riemer A. Faber (1625; Leiden: Brill, 2016), vol. 2, pp. 81-83</span></figcaption>

</figure><figure class="quote" id="q-df314f7157" data-kw="">
<blockquote><p>That we ought not to take from the laity the wine of the supper. Gelasius Pope of Rome, of consecration in that the second distinction, chapter Comperimus etc. “We have understood that some men receiving only the body of the Lord, do abstain themselves from the cup, who for as much as they sin by superstition, ought to be contravened and compelled to receive the sacrament wholly or else to reject it altogether. For the division of this mystery cannot be without great sacrilege. Jesus Christ commanded in his Supper and said: drink all of this, for this is my blood of the new testament.” The Council of Basle has ordained that the laity should communicate the supper in two kinds. St. Cyprian in his sermon on penitent sinners: “How shall we exhort the people to shed their blood for the confession of Christ, if we deny to them the blood of him when they ought to fight or how can we make ourselves capable to drink the cup of martyrdom, except that we suffer ourselves first to drink the cup of the Lord?</p></blockquote>

<blockquote><p>2. The anger, then, which in the Scripture is assigned to God, we say denotes two things:—

(1.) His vindictive justice, or constant and immutable will of rendering vengeance for sin. So God’s purpose of the demonstration of his justice is called his being “willing to show his wrath” or anger, Rom. ix. 22; so God’s anger and his judgments are placed together, Ps. vii. 6; and in that anger he judgeth, verse 8. And in this sense is the “wrath of God” said to be “revealed from heaven,” Rom. i. 18; that is, the vindictive justice of God against sin to be manifested in the effects of it, or the judgments sent and punishments inflicted on and throughout the world.

(2.) By anger, wrath, zeal, fury, the effects of anger are denoted: Rom. iii. 5, “Is God unrighteous who taketh vengeance?” … We say, then, anger is not properly ascribed to God, but metaphorically, denoting partly his vindictive justice, whence all punishments flow, partly the effects of it in the punishments themselves, either threatened or inflicted, in their terror and bitterness, upon the account of what is analogous therein to our proceeding under the power of that passion …

3. Properly, in the sense by him pointed to, anger, wrath, etc., are not in God. Anger is defined by the philosopher to be … “desire joined with grief of that which appears to be revenge, for an appearing neglect or contempt.” To this grief, he tells you, there is a kind of pleasure annexed, arising from the vehement fancy which an angry person hath of the revenge he apprehends as future, — which, saith he, “is like the fancy of them that dream,” — and he ascribes this passion mostly to weak, impotent persons. Ascribe this to God, and you leave him nothing else. There is not one property of his nature wherewith it is consistent. If he be properly and literally angry, and furious, and wrathful, he is moved, troubled, perplexed, desires revenge, and is neither blessed nor perfect. …

(2.) The apostle tells us that God is “blessed for ever,” Rom. ix. 5; “He is the blessed and only Potentate” 1 Tim. vi. 15; “God all-sufficient,” Gen. xvii. 1. That which is inconsistent with absolute blessedness and all-sufficiency is not to be ascribed to God; to do so casts him down from his excellency. But can he be blessed, is he all-sufficient, who is tossed up and down with hope, joy, fear, sorrow, repentance, anger, and the like? …

When we speak of the anger of God, his wrath, and his being appeased towards us, we speak after the manner of men; but yet by the allowance of God himself. Not that God is properly angry, and properly altered from that state and appeased, whereby he should properly be mutable and be actually changed; — but by the anger of God, which sometimes in Scripture signifieth his justice, from whence punishment proceeds, sometimes the effects of anger, or punishment itself, the obstacles before mentioned on the part of God, from his nature, justice, law, and truth, are intended; and by his being appeased towards us, his being satisfied as to all the bars so laid in the way of receiving us to favour, without the least alteration in him, his nature, will, or justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Evangelicæ; or, The Mystery of the Gospel Vindicated and Socinianism Examined</cite>, (Oxford, 1655) in William H. Goold (ed.), The Works of John Owen (1850-53; 16 vols, Edinburgh: Banner of Truth, 1966), xii, 111-12, 114-15, 533.</span></figcaption>

<blockquote><p>[A]nd so it is generally, that when the false Prophet doth arise among the People of God, it is because of God’s people that are the cause of it: and it is they that do set them up, and maintain them, and would have pillows laid under their elbows: and why is it so? why (my Brethren) even since it was that Eve did hearken to the voice of the Serpent: And also the children of God are much given to novelties; these are things that they never heard of before: and if they may have these and those things spoken which they never heard of before, this is all many care for, though they are such things as came not out of the mouth of God: yet because they are new things, and that please their humours, therefore they affect them: thus the Apostle Paul, one would think an Apostle good enough; yet there were many that were unsatisfied with him, as in the Epistle to the Galatians we read, &amp; bewitched with the false Teachers; these give us (say they) the Gospel in this and that way, &amp;c. however they did once look at the Apostle Paul as an Angel of God, even as Christ Jesus: but now the case was altered: and now Paul was no body: and come of him what would, he might starve for all them: they were carried away after those that vented their new things.</p></blockquote>

<blockquote><p>And yet (which is our great reproach) we are often in a deep sleep in the midst of our greatest Dangers, and are hardly well awake when God has wrought out our Deliverance: we sleep when our Enemies are awake to contrive our destruction; and are but in a Dream, when watchful Providence has brought Salvation; so was the Church Ps. 126.1. When the Lord turned again the Captivity of Zion, then were we like them that dream; and that because we are slow to believe there should be so much malice in men to plot the ruin of them that are innocent; or so much mercy in God to save them that are so guilty: And therefore our God awakens our dull and drowsy souls, to consider how faithfully he that keeps Israel doth neither slumber nor sleep.</p></blockquote>

<blockquote><p>Thankfulness for grace received is one of the principal duties that is incumbent on believers in this world. Now, how can a man in faith bless God for that which he is utterly uncertain whether he have received it from him or no? I know some men run on in a rote in this matter. They will bless God in a formal way for regeneration, sanctification, justification, and the like; but if you ask them whether themselves are regenerate or no, they will be ready to scoff at it, or at least to profess that they know no such thing. What is this but to mock God, and in a presumptuous manner to take his name in vain? But if we will praise God as we ought for his grace, as we are guided and directed in the Scripture, as the nature of the matter requires, with such a frame of heart as may influence our whole obedience, surely it cannot but be our duty to know the grace that we have received.</p></blockquote>

</figure><figure class="quote" id="q-9b963fadac" data-kw="">
<blockquote><p>In the first place, it will be said, are we not failing to do justice to the true humanity of Jesus, which is affirmed by the creeds of the Church as well as by the modern theologians? When we say that Jesus could not illustrate Christian faith any more than God can be religious, are we not denying to Jesus that religious experience which is a necessary element in true humanity? Must not Jesus, if He be true man, have been more than the object of religious faith; must He not have had a religion of His own? The answer is not far to seek. Certainly Jesus had a religion of His own; His prayer was real prayer, His faith was real religious faith. His relation to His heavenly Father was not merely that of a child to a father; it was that of a man to his God. Certainly Jesus had a religion; without it His humanity would indeed have been but incomplete. Without doubt Jesus had a religion; the fact is of the utmost importance. But it is equally important to observe that religion which Jesus had was not Christianity. Christianity is a way of getting rid of sin, and Jesus was without sin. His religion was a religion of Paradise, not a religion of sinful humanity. It was a religion to which we may perhaps in some sort attain heaven, when the process of our purification is complete (though even then the memory of redemption will never leave us); but certainly it is not a religion with which we can begin. The religion of Jesus was a religion of untroubled sonship; Christianity is a religion of the attainment of sonship by the redeeming work of Christ.</p></blockquote>

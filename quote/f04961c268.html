<main class="wrap"><figure class="quote" id="q-f04961c268" data-kw="">
<blockquote><p>But above all else, I beg the sincere reader, and I beg for the sake of our Lord Jesus Christ himself, to read those things judiciously, yes, with great commiseration. May he be mindful of the fact that I was once a monk and a most enthusiastic papist when I began that cause. I was so drunk, yes, submerged in the pope’s dogmas, that I would have been ready to murder all, if I could have, or to co-operate willingly with the murderers of all who would take but a syllable from obedience to the pope. So great a Saul was I, as are many to this day. I was not such a lump of frigid ice in defending the papacy as Eck and his like were, who appeared to me actually to defend the pope more for their own belly’s sake than to pursue the matter seriously. To me, indeed, they seem to laugh at the pope to this day, like Epicureans! I pursued the matter with all seriousness, as one, who in dread of the last day, nevertheless from the depth of my heart wanted to be saved. So you will find how much and what important matters I humbly conceded to the pope in my earlier writings, which I later and now hold and execrate as the worst blasphemies and abomination. You will, therefore, sincere reader, ascribe this error, or, as they slander, contradiction to the time and my inexperience. At first I was all alone and certainly very inept and unskilled in conducting such great affairs. For I got into these turmoils by accident and not by will or intention. I call upon God himself as witness. Hence, when in the year 1517 indulgences were sold (I wanted to say promoted) in these regions for most shameful gain—I was then a preacher, a young doctor of theology, so to speak—and I began to dissuade the people and to urge them not to listen to the clamors of the indulgence hawkers; they had better things to do. I certainly thought that in this case I should have a protector in the pope, on whose trustworthiness I then leaned strongly, for in his decrees9 he most clearly damned the immoderation of the quaestors [revenue officials], as he called the indulgence preachers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 34: Career of the Reformer IV, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 34 (Philadelphia: Fortress Press, 1999), 328–29.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1d5a0c0a0c" data-kw="">
<blockquote><p>Paul… his traditions were the Gospel of Christ and honest manners and living, and such a good order as becomes the doctrine of Christ. As that a woman obey her husband, have her head covered, keep silence, and go womanly and christianly apparelled: that children and servants be in subjection: and that the young obey their elders, that no man eat but he that labours and works, and that men make an earnest thing of God’s Word, and of his holy Sacraments: and to watch, fast, and pray, and such like, as the Scripture commands. Which things he that would break were no christian man… There were also certain customs alway which were not commanded in pain of hell or everlasting damnation, as to watch all night, and to kiss one another: which as soon as the people abused, then they brake them. For which cause the bishops might break many things now in like manner. Paul also in many things which God had made free, gave pure and faithful counsel without tangling of any man’s conscience, and without all manner commanding under pain of cursing, pain of excommunication, pain of heresy, pain of burning, pain of deadly sin, pain of hell, and pain of damnation. As thou mayst see. 1 Cor. 7.</p></blockquote>

</figure><figure class="quote" id="q-144d96d337" data-kw="">
<blockquote><p>The whole place shows it was God: but He is called an angel, that we might know that He which was seen, was not God the Father (for whose angel should the Father be) but the only begotten Son of God, which is the Angel of the great Counsel, which said to his holy apostles, ‘All things which I have heard of my Father, I have declared unto you.’ And even as He gave Him the name of an angel, not meaning thereby to note any other minister or messenger, but to show the Person of the only begotten Son: so again he sets forth both his nature and power, saying He said: ‘I AM THAT I AM,’ and ‘I the God of Abraham, the God of Isaac, the God of Jacob’…</p></blockquote>

</figure><figure class="quote" id="q-daea4ecbc0" data-kw="">
<blockquote><p>[Col. 2] verse. 17, What should we do with the shadow, when we have the body? another, verse 20, Why should we be subject to human ordinances, since through Christ we are dead to them, and have nothing ado with them? Now, by the same reasons are our holy-days to be condemned as taking away Christian liberty; and so that which the apostle says, does militate as well against them as against any other holy-days: for whereas it might be thought that the apostle does not condemn all holy-days, because both he permits others to observe days, Rom. 14:5, and he himself also did observe one of the Jewish feasts, Acts 18:21. It is easily answered that our holy-days have no warrant from these places except our opposites will say that they esteem their festival days holier than other days, and that they observe the Jewish festivities, neither of which they do aknowledge; and if they did, yet they must consider that which the apostle either said or did hereanent, is to be expounded and understood of bearing with the weak Jews, whom he permitted to esteeme one day above another, and for whose cause he did in his own practice, thus far apply himself to their infirmity at [???] time, when they could not possibly be as yet fully and throughly instructed concerning Christian liberty and the abrogation of the Ceremonial Law, because the Gospel was as yet not fully propagated: and when the Mosaical rites were like a dead man not yet buried, as Augustine’s simile runs. So that all this can make nothing for holy-days after the full promulgation of the Gospel, and after that the Jewish ceremonies are not only dead, but also buried, and so deadly to be used by us. Hence it is, that the apostle will not bear with the observation days in Christian Churches, who have known God as he speaks. … The apostle comports with the observation of days in the weak Jews, who understood not the fullness of the Christian liberty, especially, since those days having had the honor to be once appointed by God Himself, were to be honorably buried: but the same apostle reproves the Galatians who had attained to this liberty, and had once left off the observation of days. … Now for confutation of this forged exposition of those places of the apostle… The [Romanist] Rhemists affirm that the apostle condemns only Jewish days [in Col. 2 &amp; Gal. 4], but not Christian days, and that we do falsely interpret his words against their holy-days. [Thomas] Cartwright answers them that if Paul condemned the observing of feasts which God Himself instituted, then much more does He condemn the observation of feasts of man’s devising… for he [Paul] condemnes that observation of days which had crept into the Church of Galatia, which was not Jewish nor typical, seeing the Galatians, believing that Christ was already come, could not keep them as figures of his coming, as the Jews did, but rather as memorials that He was already come, says Cartwright.</p></blockquote>

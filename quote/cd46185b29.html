<main class="wrap"><figure class="quote" id="q-cd46185b29" data-kw="necessity freedom">
<blockquote><p>Whether every necessity is repugnant to freedom of will. We deny against the papists and Remonstrants. The question is not about the essential freedom from coaction and physical necessity, which is always the same in every state of man, but about the accidental freedom from the slavery of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 10.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a> › <a href="../topics/free-will-and-inability/liberty-and-necessity/freedom-from-compulsion.html">Freedom from compulsion</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0814d7d572" data-kw="four states will">
<blockquote><p>Free will can be viewed either absolutely as belonging to a rational being in every state, or in relation to various states—in innocence, in the fall, in grace, and in glory. In every state the will remains free from compulsion, yet its moral powers differ: able to good in innocence; only to evil as to spiritual good in the fall; freed by grace; confirmed in glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 10.3.1; 10.4</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Free will can be viewed either absolutely as belonging to a rational being in every state, or in relation to various states—in innocence, in the fall, in grace, and in glory. In every state the will remains free from compulsion, yet its moral powers differ: able to good in innocence; only to evil as to spiritual good in the fall; freed by grace; confirmed in glory.”

</figure><figure class="quote" id="q-53bb28032f" data-kw="will Spirit grace">
<blockquote><p>The will cannot change itself, nor give itself another bent; but rather the more it is resisted, the more it is irritated to crave. This would not be the case if it were free, or had a “Free-will.” But when God works in us, the will, being changed and sweetly breathed on by the Spirit of God, desires and acts, not from compulsion, but responsively, from pure willingness, inclination, and accord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bondage of the Will</cite>, On the power of the will</span></figcaption>

</figure><figure class="quote" id="q-85072453aa" data-kw="civil vs spiritual inability">
<blockquote><p>The question is not about civil and externally moral good. We do not deny that some strength still remains in man after the fall as to those external and civil good works; but the question is about spiritual and supernatural good: whether man in the state of sin is so corrupt that the powers of his free will as to the latter good are not only weakened, but wholly lost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 10.4.2–3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/bondage-of-the-will.html">Bondage of the Will</a> › <a href="../topics/free-will-and-inability/bondage-of-the-will/natural-ability-and-moral-inability.html">Natural ability and moral inability</a></span><span class="t"><a href="../topics/free-will-and-inability/natural-mans-powers.html">Natural Man&#x27;s Powers</a> › <a href="../topics/free-will-and-inability/natural-mans-powers/free-choice-in-natural-civil-and-religious-matters.html">Free choice in natural, civil and religious matters</a></span><span class="t"><a href="../topics/free-will-and-inability/natural-mans-powers.html">Natural Man&#x27;s Powers</a> › <a href="../topics/free-will-and-inability/natural-mans-powers/moral-works-of-the-unregenerate.html">Moral works of the unregenerate</a></span></div>

</figure><figure class="quote" id="q-51711cd6b0" data-kw="">
<blockquote><p>You alone in pre-eminent distinction from all others, have entered upon the thing itself; that is, the grand turning point of the cause; and, have not wearied me with those irrelevant points about popery, purgatory, indulgences, and other like baubles, rather than causes, with which all have hitherto tried to hunt me down,—though in vain! You, and you alone saw, what was the grand hinge upon which the whole turned, and therefore you attacked the vital part at once; for which, from my heart, I thank you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bondage of the Will</cite>, Sect. 168, p. 165</span></figcaption>

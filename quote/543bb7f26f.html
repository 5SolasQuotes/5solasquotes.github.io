<main class="wrap"><figure class="quote" id="q-543bb7f26f" data-kw="">
<blockquote><p>The Lord has measured to every one his own part: and he who is afflicted should look over his shoulder and see who has been afflicted before him, and scarcely shall he see a godly man but with his burden on his back, all is not laid on him alone. But above all let the person that is afflicted first set his eye on the Lord Jesus.

Let him look over to Golgotha where Christ is hanging on the Cross, and in Christ let him look to two things: first to the glory &amp; worthiness of that personage who suffers: next, to the extremity and ignominy of that passion: look to these two things in him, and then look down to thy self, and look what thou art first, not a Lord, if thou were a King, but a servant (all the Kings on the earth are but servants in respect of him:) then go to the affliction thou suffers, and thou shalt find thou suffers not the thousand part of the affliction he suffered for thee, there is great inequality between thee and him, and then begin to reason. The servant is not greater nor his Lord, the disciple is not greater nor his Master.

The Lord Jesus is my Lord I am not but a servant: yet the Lord Jesus my Lord suffers and in such great extremity; then may I not be content to suffer the thousand part of his suffering? Of this comes contentment of heart, and patience to suffer for the Lord. For except thy eye be set upon that personage of Jesus Christ, it is not possible for thee to suffer with joy the simplest cross that is for the Lord’s sake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures upon the first and second Epistles of Paul to the Thessalonians</cite>, (Edinburgh: Robert Charteris, 1606), p. 91.</span></figcaption>

<blockquote><p>If it be asked whether ignorance can excuse a man, and how far it excuses. Answer 1. There is no ignorance (properly so called) that excuses wholly, pro toto, it being of itself sinful, and men being obliged to know what is sin, and what not; neither can ever men do that out of faith which they do in ignorance, and know not if it be in itself sinful or lawful: this is to be understood in respect of ignorantia Juris, non facti, of ‘the ignorance of the Law, and not of the ignorance of the fact’ (as they call it); for men may sometimes be ignorant of this, and yet be innocent, as when one is cutting with an axe, and it falls off the helve, etc. but in respect of the Law, there is no invincible ignorance that can excuse any for their not knowing God’s mind, because they are obliged to know it.</p></blockquote>

</figure><figure class="quote" id="q-8ab1d59268" data-kw="">
<blockquote><p>OUR Lord and King JESUS CHRIST, when he was now about to go unto his Father, and desirous to leave unto those whom he loved, some excellent benefit, (a benefit then which the earth cannot yield a greater,) he left them Peace: Peace at his death as a Legacy, he bequeathed them: My Peace (saith he) I leave unto you, my Peace I give unto you; for neither could men wish from heaven a greater blessing, neither could the Angels declare unto men from heaven a more welcome message, then Glory in heaven, and Peace in earth.

This Bond, by which heaven unto earth, and earth unto heaven reciprocally is united, hath so straitly bound the heart of the King’s Majesty of great Britain [James I], that according to the exceeding care which he hath evermore had of the safe-guard and defence of true Religion, of settling Peace and Concord amongst Christian Princes throughout the world; but especially, Most Illustrious, Noble, and Magnificent Lords, of procuring the good and tranquillity of this your State, to which he acknowledges his Kingdom to be linked by the Tie of an ancienter and straiter League: He hath sent us hither with this especial charge, that as much as in us lies, we procure your prosperity, and your Churches Peace.

Certainly, an exceeding desire of Peace &amp; the public good, possest his Princely heart, when he commended unto your Lordships the care of Religion.

This his Majesty’s provident care can never be unwelcome, if it may please your Lordships, according to your Wisdom and Piety, to recount the benefit of the reformed Religion, and the blessings of God’s favour, which like showers from heaven, have watered your Provinces far &amp; near. I suppose, it cannot be unknown unto your Lordships, what &amp; how much you owe to true Religion.

Religion it was, which from blood and tempest reduced your State to these flourishing days of quietness and Sun-shine. Religion it was, which first begat, then enlarged, and finally established your prosperity. Let your Lordships now consider with your selves, what you will repay unto Christ for all these blessings. Of your Lordships, Christ, who is King of Kings, and Lord of Lords, requires this, that for and above all his other benefits, you preserve the Peace which he bequeathed you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-carleton.html">George Carleton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An oration made at the Hauge, before the Prince of Orange and the assembly of the high and mighty lords, the States General of the United Provinces: by the reverend father in God, the Lord Bishop of Llandaff, one of the commissioners sent by the King’s most excellent Majesty to the Synod of Dort</cite>, (London: Ralph Rounthwait, 1619), pp 1-3.</span></figcaption>

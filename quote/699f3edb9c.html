<main class="wrap"><figure class="quote" id="q-699f3edb9c" data-kw="">
<blockquote><p>To be taken without consent from my home and friends; to lose my liberty; to undergo all those assaults on my personality which modern psychotherapy knows how to deliver; to be re-made after some pattern of “normality” hatched in a Viennese laboratory to which I never professed allegiance; to know that this process will never end until either my captors have succeeded or I grown wise enough to cheat them with apparent success – who cares whether this is called Punishment or not? That it includes most of the elements for which any punishment is feared – shame, exile, bondage, and years eaten by the locust – is obvious. …

Of all tyrannies a tyranny sincerely exercised for the good of its victims may be the most oppressive. It may be better to live under robber barons than under omnipotent moral busybodies. The robber baron’s cruelty may sometimes sleep, his cupidity may at some point be satiated; but those who torment us for our own good will torment us without end for they do so with the approval of their own conscience. They may be more likely to go to Heaven yet at the same time likelier to make a Hell of earth.

Their very kindness stings with intolerable insult. To be “cured” against one’s will and cured of states which we may not regard as disease is to be put on a level with those who have not yet reached the age of reason or those who never will; to be classed with infants, imbeciles, and domestic animals. But to be punished, however severely, because we have deserved it, because we “ought to have known better”, is to be treated as a human person made in God’s image.

In reality, however, we must face the possibility of bad rulers armed with a Humanitarian theory of punishment. … And when they are wicked· the Humanitarian theory of punishment will put in their hands a finer instrument of tyranny than wickedness ever had before. For if crime and disease are to be regarded as the same thing, it follows that any state of mind which our masters choose to call “disease” can be treated as crime; and compulsorily cured. It will be vain to plead that states of mind which displease government need not always involve moral turpitude and do not therefore always deserve forfeiture of liberty.

For our masters will not be using the concepts of Desert and Punishment but those of disease and cure. We know that one school of psychology already regards religion as a neurosis. When this particular neurosis becomes inconvenient to government, what is to hinder government from proceeding to “cure” it? Such “cure” will, of course, be compulsory; but under the Humanitarian theory it will not be called by the shocking name of Persecution. No one will blame us for being Christian, no one will hate us, no one will revile us.

The new Nero will approach us with the silky manners of a doctor, and though all will be in fact as compulsory as the tunica molesta or Smithfield or Tyburn, all will go on within the unemotional therapeutic sphere where words like “right” and “wrong” or “freedom” and “slavery” are never heard. And thus when the command is given, every prominent Christian in the land may vanish overnight into Institutions for the Treatment of the Ideologically Unsound, and it will rest with the expert gaolers to say when (if ever) they are to re-emerge. But it will not be persecution. Even if the treatment is painful, even if it is life-long, even if it is fatal, that will be only a regrettable accident; the intention was purely therapeutic.</p></blockquote>

</figure><figure class="quote" id="q-c06009f30e" data-kw="">
<blockquote><p>Assuredly, [it is clear] that peoples did not in the first instance originate from rulers, but whatever peoples desired to be ruled by a single monarch or by chief men elected by them were anterior to their rulers. Hence it follows that peoples were not created for the sake of rulers, but on the contrary the rulers for the sake of the people, even as the guardian is appointed for the ward, not the ward for the guardian, and the shepherd on account of the flock, not the flock on account of the shepherd.

This proposition is not merely obvious in itself but may be corroborated by the history of nearly all nations, So much so that God Himself, although he had elected Saul to substitute him for Samuel in accordance with the desires of the people, yet willed that he should be chosen and accepted as King by the suffrages of the people. Thus David, although he had first been chosen as king by God Himself, yet would not undertake the administration of the Kingdom except he had first been confirmed by the suffrages and unfettered concord of the tribes of Israel.

On similar grounds it happened even afterwards that though the kingship had by the will of God been granted to the family of David, yet in the last resort that one from the descendants of David should rule whom the people had approved and none other (unless perchance something irregular befell to prevent it as when now the Egyptian and then the Syrian kings ruled as tyrants over the people of God).

So much so that this kingship was hereditary as far as the family was concerned, but elective as regards the individual incumbent, i.e. dependent upon the election of the people. This may be seen from the histories of Solomon, Rehoboam, Joas, Ocias and Jehoahaz. For this reason also Absalom grasped the occasion of usurping his father’s throne. For thus Hushai the friend of David answered him: “Nay, but whom the LORD, and this people, and all the men of Israel have chosen, his will I be, and with him will I abide.”

… [T]he people existed before there was any magistrate and that the magistrates were made for the sake of the people and not vice versa, the people for the sake of the magistrate.</p></blockquote>

<blockquote><p>…and came with his family to Broad Oak… and did not preach for a great while… expecting that God would yet open a door of return to former public liberty, which he much desired and prayed for; and in hopes of that, was backward to fall into the stated exercise of his ministry otherwise, as were all the sober nonconformists generally in those parts, but it was his grief and burden that he had not an opportunity of doing more for God. He has scarce one talent of opportunity, but that one he was very diligent and faithful in the improvement of… ‘I own myself a minister of Christ, yet do nothing as a minister. What will excuse me? Is it enough for me to say, ‘Behold I stand in the market-place, and no man has hired me?’ And he comforts himself with this appeal; ‘Lord, Thou knowest what will I have to thy work, public or private, if I had a call and opportunity. And shall this willing mind be accepted?’… In these circumstances of silence and restraint… It is obvious, he writes, to observe at four several times, and upon four several occasions, ministers have been silenced and turned out of their places; and yet still, after a time, more or less restored again.

1. In Queen Mary’s days, because they would not close with Popery at the return of it. But that interdict lasted under five years, being taken off upon Queen Elizabeth’s coming to the throne.

2. In Queen Elizabeth’s, King James’s and King Charles’s days, because they could not conform to the hierarchy and ceremonies; and this interdict lasted long, even till the long Parliament, A.D. 1640; but it was then taken off.

3. Under the long Parliament many ministers were sequestered and silenced for malignancy and not covenanting [under the Solemn League and Covenant, 1643; Philip Henry did not hold to the SL&amp;C].

4. Many others, after the King’s death [1649], for not engaging to be true to the Commonwealth [under Oliver Cromwell, 1649-1658], as then established; both which restraints, though much remitted before, yet quite ceased at the coming in of the King [Charles II], A.D. 1660. And now more ministers are silenced, and with more severity than ever, by the Act of August 24 [1662]. And who among us can tell for how long? This only I know, ‘He who hath delivered, doth deliver.’ Script. March 31, 1663.</p></blockquote>

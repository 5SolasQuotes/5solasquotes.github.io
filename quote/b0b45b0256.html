<blockquote><p>Nor is it yet a small matter when he adds, that God had formed the spirit of man; for we know that we live; the body of itself would be without any strength or motion, were it not endued with life; and the soul which animates the body is invisible… By saying “in the midst of him”, he means, that the spirit dwells within; for the body, we allow, is as it were its tabernacle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Zechariah</cite>, 12:1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-50f44e86d0" data-kw="">
<blockquote><p>But for what reason, then, is eternal punishment due to it? You respond, by the condition of man, who is found without grace; and that this is the doctrine of St. Thomas (Stapleton, Of Original Sin, bk. 1, ch. 1, disp. 1, q. 5). Whatever this may be, it is surely most absurd: that man is punished not because he is stained by original sin, but because he lacks the grace which ought to have been present. Is it thus graver and more repugnant to original justice to lack grace than to be stained with a fault? But this very lack of justice, if it could be separated from stains, would be much lighter than to be stained with sins; for it could happen that someone is held to be unjust, as Pighius thought, on account of a plainly alien offense, of which he himself was never an associate. Then, a stain brings a deformity worthy of hatred and punishment; to lack justice indeed removes a habit, but does not posit the contrary. But Scripture, on the contrary, teaches that nothing but uncleanness and abomination delays entry into heaven (Apoc. 21:27). But from these things it is now sufficiently clear how this error about the punishment of original sin is not undeservedly or falsely imposed upon you. For first you teach that no punishment of sense, neither exterior nor interior, is due to this sin (Thomas, in 2, dist. 33, q. 2, art. 2). For there is a certain eternal punishment, if we believe you, without the sense of pain, and with this original sin, if it is alone, is punished: a mild punishment, I believe, which inflicts no pain either without or within. What is this other than to take away all punishment?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Original Sin</cite>, … against the three first books of Thomas Stapleton on the Whole Doctrine of Justification presently controverted (d. 1595; Legat, 1600), bk. 1, ch. 1 trans. AI Latin, p. 8</span></figcaption>

</figure><figure class="quote" id="q-cf8c8a1fda" data-kw="">
<blockquote><p>Being is what is called in A[ristotelian]-T[homistic] metaphysics a transcendental, something above every genus, common to all beings and thus not restricted to any category or individual. The other transcendentals are thing, one, something, true, and good, and each is ‘convertible’ with being in the sense that each designates one and the same thing—namely being—under a different aspect. (To put the point in terms made familiar by Frege, the transcendentals differ in sense but not in reference, referring to the same thing under different names just as ‘Superman’ and ‘Clark Kent’ do.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>III. ‘The Transcendentals’ in Neo-Scholastic Essays</cite>, (South Bend, IN: St. Augustine’s Press, 2015), pp. 303-7, pp. 304-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-e7fea6ed50" data-kw="">
<blockquote><p>The mode of giving supernatural grace to nature is, Junius stated, infusion, a term that is strikingly redolent of Aquinas’s conception of the mode of communicating grace.” (Seung J. Lee, Orders of Nature &amp; Grace, p. 60) Gale: “That supernatural good and virtue comes from God by divine infusion is generally asserted and demonstrated by the sectators of Augustin and Aquinas.” (4.496) . No Proper Habitual vs. Actual Grace Distinction On Maresius and Thomas: “Supernatural habits, by contrast [with natural habits], are stirred into action by the Holy Spirit, who dwells in the recipients of habitual grace (Maresius 1646-48, 2:143). Maresius disagrees with some Roman Catholic theologians, who suggest that people imbued with habitual grace require an additional gift of ‘actual grace’ before habitual grace bears fruit. For Maresius, the Spirit’s powerful presence is quite sufficient. As a result, Maresius is suspicious of the distinction between habitual and actual grace—a distinction, he notes, which is not found in Aquinas. That said, if by ‘actual grace’ is meant simply the Spirit’s activity in exciting supernatural habits into action, Maresius does not object, although he prefers the term ‘moving grace’ (Maresius 1646-48, 2:144). And since the Holy Spirit dwells with believers permanently, he argues that moving grace is also permanently present as to the principle of its motion, even if it is not permanently active.” (Stephen Hampton in Oxford Handbook of Early Modern Theology, p. 236) . Deification Thomas: “Now the gift of grace surpasses every capability of created nature, since it is nothing short of a partaking of the Divine Nature, which exceeds every other nature. And thus it is impossible that any creature should cause grace. For it is as necessary that God alone should deify [deificet], bestowing a partaking of the Divine Nature by a participated likeness, as it is impossible that anything save fire should enkindle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/agreements.html">Agreements</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Supernatural Grace: by Infusion</cite></span></figcaption>

<blockquote><p>5th Distinction: The substance and essence of ordination (as we shall after hear) consists in the appointing of such for the holy ministery by persons in office. All the corrupt rites added to this by Papists take not away the essence and nature of ordination… See that variations may be in a sacrament, and yet such as make not the sacrament invalid, in Sotus, Suarez (in 3rd part, disp. 2, sect 5), Vasquez, Joannes de Lugo, Scotus.</p></blockquote>

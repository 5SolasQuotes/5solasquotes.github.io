<main class="wrap"><figure class="quote" id="q-e7983f8bfd" data-kw="">
<blockquote><p>Besides, there were in the first churches continued for a while certain extraordinary gifts, that had their effects visibly on the outward senses of men, and tended not immediately unto the edification of the church in their faith, but unto the conviction of others, and vindication of the authority of them by whom the gospel was preached and propagated. Such was that gift of healing the sick, which being an especial effect of the Holy-Ghost for the advantage of the Church in those days, in some places it was accompanied by anointing with oil; but this being no universal practice, and used only in the exercise of a gift extraordinary, whose use and being are long since ceased, it never was appointed nor intended to be of continuance in the Church, which is not tied by the Lord Christ to the empty signs and shadows of things whose substance is not enjoyed: besides, no spiritual grace of the Covenant was ever intimated, sealed, or exhibited by that usage of anointing with oil. The first mention of it is, Mark 6:13 where its practice is reckoned among the effects of that extraordinary power which the Lord Christ committed unto his twelve disciples on their first sending out, and is referred unto the same series of miracles which they wrought in pursuit, and by virtue thereof, they cast out many devils, and anointed with oil many that were sick, and healed them. And by what is there recorded, the subsequent mention of it, James 5:14 is to be regulated, but now unto a real evangelical institution of worship, it is required: (1.) That it be a command of Christ manifested by his Word, or example proposed unto our imitation, Mt. 28:20. (2.) That it be given and enjoined unto the whole Church with the limitation of its administration expressed in the Word, 1 Cor. 11:25. (3.) That unto the due performance of it, Gospel grace be required in them that attend unto it. (4.) That it teach, or represent, or seal, or improve some grace of the Covenant, and have a promise of acceptation annexed unto it, and whatever is thus appointed, the Church is indispensably to continue in the observation of, unto the end of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Short Catechism on Worship</cite>, Question #13 1667 For the fuller context, see Owen above on the holy kiss, which section immediately precedes this section.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-293341cf5f" data-kw="">
<blockquote><p>Those who exaggeratingly refer to other Christian ministers sound in the fundamentals, albeit erring in other respects, as the sons of Belial or priests of Baal worshipping in the high places (where literal idolatry was used and other gods sacrificed to, a matter of fundamentals or tending to overturn them),¹ as the Separatists did,² are not harmless, but slanderous; cure yourself of that warped intoxication and protect others from it. ¹ Lev. 26:30; Dt. 12:2; 1 Kn. 11:7; 14:23; 2 Kn. 18:4; 21:3, 5; 23:20; 2 Chron. 11:15; 14:3–5; 28:25; 2 Chron. 31:1; 33:3, 17–19; 34:3; Ps. 78:58; Jer. 32:35; 48:35; Eze. 6:6, 13. ² Robert Browne, An Answer to Master Cartwright… (London: 1585), p. 48; Henry Barrow, A Collection of Certain Letters &amp; Conferences… ([Dordrecht] 1590), p. 27; idem, A Plain Refutation of Mr. G. Giffard’s Reproachful Book (Dordrecht, 1591), pp. 2, 7, 63, 189, 216, 223.</p></blockquote>

</figure><figure class="quote" id="q-88d03ef341" data-kw="">
<blockquote><p>The Prelatical conformity… Their way was destructive to true Christian liberty both of conscience and practice, compelling the practice, and conscience itself, by the mere will and authority of the law-makers. Obedite praepositis [obey in those things having been put forth] was the great argument with them to satisfy consciences: Sic volo, sit jubeo, sic pro ratione voluntas [Thus I will; I may so command; thus the will for the reason]. We say that no canons nor constitutions of the church can bind the conscience nisi per et propter verbum Dei, i.e. except insofar as they are grounded upon and warrantable by the Word of God, at least by consequence, and by the general rules thereof…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, p. 83 of Ch. 15, ‘Of Uniformity in Religion, Worship of God and Church Government’ in Miscellaneous Questions (no date)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-acac4f9207" data-kw="">
<blockquote><p>I. I was born and bred of parents piously affected, but of no such knowledge or acquaintance as might engage them in any controversies, or disaffect them to the present government of the Church, or cause them to scruple conformity to its doctrine, worship or discipline: In this way I was bred myself, but taught by my parents and God Himself to make conscience of sin and to fear God, and to discern between the godly and the notoriously wicked: For which my parents and I were commonly derided as puritans, the spirit of the vulgar being commonly then fired with hatred and scorn of serious godliness, and using that name as their instrument of reproach, which was first forged against the nonconformists only; And the clergy where I lived, being mostly only readers of the liturgy, and some others that rather countenanced than reproved this course, I soon confined my reverence to a very few among them that were learned and godly (but conformists), and for going out of my parish to hear them, my reproach increased: About eighteen or nineteen years of age I fell acquainted with some persons, half conformists and half nonconformists, who for fear of severities against private meetings, met with great secresy only to repeat the public sermons, and pray, and by pious conference edify each other. Their spirits and practice was so savoury to me, that it kindled in me a distaste of the prelates as persecutors, who troubled and ruined such persons, while ignorant drunkards and worldlings were tolerated in so many churches, yea, and countenanced for crying down such persons, and crying up bishops, liturgie and conformity: Before I was aware, my affections began to solicit my understanding to judge of the things and causes by the persons (where the difference was very great). But yet my first teachers kept my judgement for conformity as lawful, though not desirable had we liberty, till I was ordained. But soon after a new acquaintance provoked me to a deeper study of the whole controversy than I had undertaken before; which left me persuaded that the use of liturgy and ceremonies was lawful in that case of necessity, except the baptismal use of the cross, and the subscription to all things, etc. But in 1640, the oath called ‘Et Caetera’ being offered the ministry, forced me to a yet more searching study of the case of our diocesan prelacie (which else I had never been like to have gainsaid). At a meeting of ministers to debate the case, it fell to Mr. Christopher Cartwright’s lot and mine to be the disputers; and the issue of all (that and my studies) was that I settled in the approbation of the episcopacy asserted by Ignatius, yea, and Cyprian, but such a dissent from the English frame, as I have given account of in my Disputations of Church Government. My genius was inquisitive, and earnestly desirous to know the truth: my helps for piety were greater than my helps for learning, of which I had not much besides books: sickness helped my seriousness, keeping me still in expectation of death. All my reverenced acquaintances (save one) cried down Arminianism as the Pelagian heresy, and the enemy of grace: I quickly plunged myself into the study of Dr. [William] Twisse and [William] Amesius, and [John] Camero, and [William] Pemble, and others on that subject: By which my mind was settled in prejudice against Arminianism, without a clear understanding of the case: whereupon I felt presently in my mind a judgment of those that were for Arminianism, as bad or dangerous adversaries to the Church; and specially of the then ruling bishops: which yet I think I had not-entertained, had I not taken them withal for the great persecutors of godly able ministers, and serious Christians, not only for ceremonies, but for holy practices of life. Being under these apprehensions, when the wars began [early-1640’s], though the cause itself lay in civil controversies between king and parliament, yet the thoughts that the Church and godliness itself was deeply in danger by persecution and Arminianism did much more to bias me to the parliament’s side than the civil interest (which at the heart I little regarded)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable</cite>, ... (London: White, 1675), Preface</span></figcaption>

nce provoked me to a deeper study of the whole controversy than I had undertaken before; which left me persuaded that the use of liturgy and ceremonies was lawful in that case of necessity, except the baptismal use of the cross, and the subscription to all things, etc. But in 1640, the oath called ‘Et Caetera’ being offered the ministry, forced me to a yet more searching study of the case of our diocesan prelacie (which else I had never been like to have gainsaid). At a meeting of ministers to debate the case, it fell to Mr. Christopher Cartwright’s lot and mine to be the disputers; and the issue of all (that and my studies) was that I settled in the approbation of the episcopacy asserted by Ignatius, yea, and Cyprian, but such a dissent from the English frame, as I have given account of in my Disputations of Church Government. My genius was inquisitive, and earnestly desirous to know the truth: my helps for piety were greater than my helps for learning, of which I had not much besides books: sickness helped my seriousness, keeping me still in expectation of death. All my reverenced acquaintances (save one) cried down Arminianism as the Pelagian heresy, and the enemy of grace: I quickly plunged myself into the study of Dr. [William] Twisse and [William] Amesius, and [John] Camero, and [William] Pemble, and others on that subject: By which my mind was settled in prejudice against Arminianism, without a clear understanding of the case: whereupon I felt presently in my mind a judgment of those that were for Arminianism, as bad or dangerous adversaries to the Church; and specially of the then ruling bishops: which yet I think I had not-entertained, had I not taken them withal for the great persecutors of godly able ministers, and serious Christians, not only for ceremonies, but for holy practices of life. Being under these apprehensions, when the wars began [early-1640’s], though the cause itself lay in civil controversies between king and parliament, yet the thoughts that the Church and godliness itself was deeply in danger by persecution and Arminianism did much more to bias me to the parliament’s side than the civil interest (which at the heart I little regarded)…”

— Richard Baxter, Catholic Theology, Plain, Pure, Peaceable... (London: White, 1675), Preface">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+I+was+born+and+bred+of+parents+piously+affected%2C+but+of+no+such+knowledge+or+acquaintance+as+might+engage+them+in+any+controversies%2C+or+disaffect+them+to+the+present+government+of+the+Church%2C+or+cause+them+to+scruple+conformity+to+its+doctrine%2C+worship+or+discipline%3A+In+this+way+I+was+bred+myself%2C+but+taught+by+my+parents+and+God+Himself+to+make+conscience+of+sin+and+to+fear+God%2C+and+to+discern+between+the+godly+and+the+notoriously+wicked%3A+For+which+my+parents+and+I+were+commonly+derided+as+puritans%2C+the+spirit+of+the+vulgar+being+commonly+then+fired+with+hatred+and+scorn+of+serious+godliness%2C+and+using+that+name+as+their+instrument+of+reproach%2C+which+was+first+forged+against+the+nonconformists+only%3B+And+the+clergy+where+I+lived%2C+being+mostly+only+readers+of+the+liturgy%2C+and+some+others+that+rather+countenanced+than+reproved+this+course%2C+I+soon+confined+my+reverence+to+a+very+few+among+them+that+were+learned+and+godly+%28but+conformists%29%2C+and+for+going+out+of+my+parish+to+hear+them%2C+my+reproach+increased%3A+About+eighteen+or+nineteen+years+of+age+I+fell+acquainted+with+some+persons%2C+half+conformists+and+half+nonconformists%2C+who+for+fear+of+severities+against+private+meetings%2C+met+with+great+secresy+only+to+repeat+the+public+sermons%2C+and+pray%2C+and+by+pious+conference+edify+each+other.+Their+spirits+and+practice+was+so+savoury+to+me%2C+that+it+kindled+in+me+a+distaste+of+the+prelates+as+persecutors%2C+who+troubled+and+ruined+such+persons%2C+while+ignorant+drunkards+and+worldlings+were+tolerated+in+so+many+churches%2C+yea%2C+and+countenanced+for+crying+down+such+persons%2C+and+crying+up+bishops%2C+liturgie+and+conformity%3A+Before+I+was+aware%2C+my+affections+began+to+solicit+my+understanding+to+judge+of+the+things+and+causes+by+the+persons+%28where+the+difference+was+very+great%29.+But+yet+my+first+teachers+kept+my+judgement+for+conformity+as+lawful%2C+though+not+desirable+had+we+liberty%2C+till+I+was+ordained.+But+soon+after+a+new+acquaintance+provoked+me+to+a+deeper+study+of+the+whole+controversy+than+I+had+undertaken+before%3B+which+left+me+persuaded+that+the+use+of+liturgy+and+ceremonies+was+lawful+in+that+case+of+necessity%2C+except+the+baptismal+use+of+the+cross%2C+and+the+subscription+to+all+things%2C+etc.+But+in+1640%2C+the+oath+called+%E2%80%98Et+Caetera%E2%80%99+being+offered+the+ministry%2C+forced+me+to+a+yet+more+searching+study+of+the+case+of+our+diocesan+prelacie+%28which+else+I+had+never+been+like+to+have+gainsaid%29.+At+a+meeting+of+ministers+to+debate+the+case%2C+it+fell+to+Mr.+Christopher+Cartwright%E2%80%99s+lot+and+mine+to+be+the+disputers%3B+and+the+issue+of+all+%28that+and+my+studies%29+was+that+I+settled+in+the+approbation+of+the+episcopacy+asserted+by+Ignatius%2C+yea%2C+and+Cyprian%2C+but+such+a+dissent+from+the+English+frame%2C+as+I+have+given+account+of+in+my+Disputations+of+Church+Government.+My+genius+was+inquisitive%2C+and+earnestly+desirous+to+know+the+truth%3A+my+helps+for+piety+were+greater+than+my+helps+for+learning%2C+of+which+I+had+not+much+besides+books%3A+sickness+helped+my+seriousness%2C+keeping+me+still+in+expectation+of+death.+All+my+reverenced+acquaintances+%28save+one%29+cried+down+Arminianism+as+the+Pelagian+heresy%2C+and+the+enemy+of+grace%3A+I+quickly+plunged+myself+into+the+study+of+Dr.+%5BWilliam%5D+Twisse+and+%5BWilliam%5D+Amesius%2C+and+%5BJohn%5D+Camero%2C+and+%5BWilliam%5D+Pemble%2C+and+others+on+that+subject%3A+By+which+my+mind+was+settled+in+prejudice+against+Arminianism%2C+without+a+clear+understanding+of+the+case%3A+whereupon+I+felt+presently+in+my+mind+a+judgment+of+those+that+were+for+Arminianism%2C+as+bad+or+dangerous+adversaries+to+the+Church%3B+and+specially+of+the+then+ruling+bishops%3A+which+yet+I+think+I+had+not-entertained%2C+had+I+not+taken+them+withal+for+the+great+persecutors+of+godly+able+ministers%2C+and+serious+Christians%2C+not+only+for+ceremonies%2C+but+for+holy+practices+of+life.+Being+under+these+apprehensions%2C+when+the+wars+began+%5Bearly-1640%E2%80%99s%5D%2C+though+the+cause+itself+lay+in+civil+controversies+between+king+and+parliament%2C+yet+the+thoughts+that+the+Church+and+godliness+itself+was+deeply+in+danger+by+persecution+and+Arminianism+did+much+more+to+bias+me+to+the+parliament%E2%80%99s+side+than+the+civil+interest+%28which+at+the+heart+I+little+regarded%29%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Catholic+Theology%2C+Plain%2C+Pure%2C+Peaceable...+%28London%3A+White%2C+1675%29%2C+Preface&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Facac4f9207.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/acac4f9207.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-occasional-partial-conformity-or-moderate-puritanism/#:~:text=I.%20I%20was%20born%20and%20bred,at%20the%20heart%20I%20little%20regarded&amp;text=I.%20I%20was%20born%20and%20bred%20of%20parents&amp;text=interest%20%28which%20at%20the%20heart%20I%20little%20regarded" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Section 7. Third part of liberty, viz., the free rise of things indifferent. The knowledge of this part necessary to remove despair and superstition. Superstition described… The third part of this liberty is that we are not bound before God to any observance of external things which are in themselves indifferent, (“adiafora”) but that we are now at full liberty either to use or omit them. The knowledge of this liberty is very necessary to us; where it is wanting our consciences will have no rest, there will be no end of superstition. In the present day many think us absurd in raising a question as to the free eating of flesh, the free use of dress and holidays, and similar frivolous trifles, as they think them; but they are of more importance than is commonly supposed. For when once the conscience is entangled in the net, it enters a long and inextricable labyrinth, from which it is afterwards most difficult to escape. When a man begins to doubt whether it is lawful for him to use linen for sheets, shirts, napkins, and handkerchiefs, he will not long be secure as to hemp, and will at last have doubts as to tow; for he will revolve in his mind whether he cannot sup without napkins, or dispense with handkerchiefs. Should he deem a daintier food unlawful, he will afterwards feel uneasy for using loafbread and common eatables, because he will think that his body might possibly be supported on a still meaner food. If he hesitates as to a more genial wine, he will scarcely drink the worst with a good conscience; at last he will not dare to touch water if more than usually sweet and pure. In fine, he will come to this, that he will deem it criminal to trample on a straw lying in his way. For it is no trivial dispute that is here commenced, the point in debate being, whether the use of this thing or that is in accordance with the divine will, which ought to take precedence of all our acts and counsels. Here some must by despair be hurried into an abyss, while others, despising God and casting off his fear, will not be able to make a way for themselves without ruin. When men are involved in such doubts whatever be the direction in which they turn, every thing they see must offend their conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.10.7</span></figcaption>

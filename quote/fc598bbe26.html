<blockquote><p>One of the best known and most esteemed of John Owen’s works. It is unnecessary to say that he is the prince of divines. to master his works is to be a profound theologian. Owen is said to be prolix, but it would be truer to say that he is condensed. His style is heavy because he gives notes of what he might have said, and passes on without fully developing the great thoughts of his capacious mind. He requires hard study, and none of us ought to grudge it.” – Spurgeon Allen, James – Serious Advice to delivered ones from sickness or any other dangers threatening death, how they ought to carry it that their mercies may be continued, and other misery prevented, or, The healed ones prophulacticon, or healthful diet, delivered in several sermons on John 5:14 (Boston, 1679) Allen (1632-1710) appears to have been a faithful, New England minister. Here are about 15 or so other works of his. Sibbes, Richard – ‘A Rescue from Death, with a Return of Praise’ Works, 6.133-57 on Ps. 107:17 ff. Mather, Cotton – ‘Mens Sana in Corpore Sano. A Discourse upon Recovery from Sickness. Directing how Natural Health, may be Improved into Spiritual: especially by them that have Lately Recovered it’ (Boston, 1698) . 1700’s Wadsworth, Benjamin – ‘Christian Advice to the Sick and Well. In Answer to these Questions:

I. What should Christians do, when under bodily sickness?

II. How should Christians in health, improve the sickness of others; and how should they carry it towards the sick?

III. How should Christians behave themselves, when recovered from sickness? And, None but the Righteous Saved: a Sermon on 1 Cor. 6:9’ Ref (Boston, 1714) Newton, John – Letter 36, ‘To a Gay [Merry] Friend, on his Recovery from Illness’ Works (London, 1808), vol. 1 (of 6), pp. 353-7 . . On Visiting the Sick, especially Church Officers Articles 1500’s Calvin, John – ‘Visitation of the Sick’ in Calvin’s Tracts: containing Treatises on the Sacraments… vol. 2, trans. Beveridge (Edinburgh, 1849), pp. 127-8 . 1600’s Westminster Assembly pp. 84-95 of Journal of the Proceedings of the Assembly of Divines… in The Whole Works of the Rev. John Lightfoot, vol. 13 This is on whether it is a function of the pastoral office to visit the sick. Taylor, Jeremy – ch. 5, ‘Of Visitation of the Sick’ in The Rules &amp; Exercises of Holy Dying: together with prayers &amp; acts of virtue to be used by sick and dying persons, or by others standing in their attendance; to which are added rules for the visitation of the sick &amp; offices proper for that ministry new ed. (Oxford: 1857), pp. 73-229 Taylor (1613-1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He is sometimes known as the “Shakespeare of Divines” for his poetic style of expression, and he is frequently cited as one of the greatest prose writers in the English language. Swinnock, George – ‘A Good Wish about the Visitation of the Sick’ in Works, 3:24-37 (d. 1673) This is a prayer that we, pastors specifically, may be more dutiful in visiting the sick, etc. Poole, Matthew – ‘How Ministers or Christian Friends may and ought to apply themselves to Sick Persons, for their Good, and the Discharge of their Own Conscience’ in Puritan Sermons, vol. 1 on Job 23:23-24 Stearne, John – The Curate’s Manual, with Reference to the Sick &amp; Dying, from the Latin of John Stearne, Vicar of Trim in the 17th Century, with Additions, Original &amp; Selected by the Rev. Kirby Trimmer… (1697; London, 1840) ToC Stearne (1660-1745) was an Anglican bishop. His original work was Tractatus de Visitatione Infirmorum (Dublin, 1697; London, 1700, several editions). . 1800’s Ely, Ezra Stiles – Visits of Mercy, being the Journal of the Stated Preacher to the Hospital and Alms House in the City of New York, 1811, vols. 1, 2 (New York, 1813) Ely (1786-1861) was an American presbyterian minister during the Second Great Awakening. Wells, John D. – The Pastor in the Sick-Room, Three Lectures delivered at Princeton Theological Seminary, March, 1892 (Philadelphia: Pres. Board of Publication, 1893) 130 pp. Wells (1815-1903) was a graduate of Old Princeton in 1844 and learned “at the feet of Dr. Archibald Alexander, Dr. Samuel Miller, Dr. Charles Hodge and Dr. Joseph Addison Alexander, all of blessed memory.</p></blockquote>

<blockquote><p>By the diatactic [Teaching] power a Synod may institute, restore, or change, according to the condition and exigence of the Church, the external circumstances in the worship of God, and ecclesiastical discipline: I mean those circumstances which are common both to civil and sacred societies, the conveniency whereof is determinable by the light of Nature, always observing the general rules of the Word, which commands that all be done to the glory of God, that all be done to edifying, that all be done in order and decency, that we give none offence, that we support the weak, that we give no place to the enemies of the truth, nor symbolize with idolaters, etc. Now for avoiding disorder and disconformity in a nation professing one religion, it is fit that National Synods give certain directions and rules even concerning these rites and circumstances, not having therein an arbitrary or autocratorke power, but being always tied to follow the rules foresaid.</p></blockquote>

<blockquote><p>72. Fifthly, they [the Church and magistrate] are distinguished by the effect. The effect of civil power is either proper or by way of redundance; The proper effect is the safety-temporal of the commonwealth, external tranquility, the fruition of civil liberty, and of all things which are necessary to the civil society of men: The effect by way of redundance is the good of the Church, to wit, insofar as by execution of justice and good laws, some impediments that usually hinder and disturb the course of the Gospel, are avoided or taken away.

73. For by how much the more faithfully the Magistrate executes his office in punishing the wicked, and cherishing and encouraging good men, taking away those things which withstand the Gospel, and punishing or driving away the troublers and subverters of the Church; so much the more the orthodox faith and godliness are reverenced and had in estimation, sins are hated and feared: Finally, all the subjects contained (as much as concerns the outward man) within the lists of God’s Law; whence also by consequence it happens by God’s blessing, that the Church is defiled with fewer scandals and does obtain the more freedom and peace.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“72. Fifthly, they [the Church and magistrate] are distinguished by the effect. The effect of civil power is either proper or by way of redundance; The proper effect is the safety-temporal of the commonwealth, external tranquility, the fruition of civil liberty, and of all things which are necessary to the civil society of men: The effect by way of redundance is the good of the Church, to wit, insofar as by execution of justice and good laws, some impediments that usually hinder and disturb the course of the Gospel, are avoided or taken away.

— George Gillespie, Other citations (work not named), 111 Propositions… (1647), #72-73">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C72.+Fifthly%2C+they+%5Bthe+Church+and+magistrate%5D+are+distinguished+by+the+effect.+The+effect+of+civil+power+is+either+proper+or+by+way+of+redundance%3B+The+proper+effect+is+the+safety-temporal+of+the+commonwealth%2C+external+tranquility%2C+the+fruition+of+civil+liberty%2C+and+of+all+things+which+are+necessary+to+the+civil+society+of+men%3A+The+effect+by+way+of+redundance+is+the+good+of+the+Church%2C+to+wit%2C+insofar+as+by+execution+of+justice+and+good+laws%2C+some+impediments+that+usually+hinder+and+disturb+the+course+of+the+Gospel%2C+are+avoided+or+taken+away.+73.+For+by+how+much+the+more+faithfully+the+Magistrate+executes+his+office+in+punishing+the+wicked%2C+and+cherishing+and+encouraging+good+men%2C+taking+away+those+things+which+withstand+the+Gospel%2C+and+punishing+or+driving+away+the+troublers+and+subverters+of+the+Church%3B+so+much+the+more+the+orthodox+faith+and+godliness+are+reverenced+and+had+in+estimation%2C+sins+are+hated+and+feared%3A+Finally%2C+all+the+subjects+contained+%28as+much+as+concerns+the+outward+man%29+within+the+lists+of+God%E2%80%99s+Law%3B+whence+also+by+consequence+it+happens+by+God%E2%80%99s+blessing%2C+that+the+Church+is+defiled+with+fewer+scandals+and+does+obtain+the+more+freedom+and+peace.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+Other+citations+%28work+not+named%29%2C+111+Propositions%E2%80%A6+%281647%29%2C+%2372-73&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc905038a76.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c905038a76.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-civil-magistrates-just-authority-for-quarantining-and-restraining-the-congregating-of-citizens-even-the-church-with-sufficient-natural-warrant/#:~:text=72.%20Fifthly%2C%20they%20%5Bthe%20Church%20and,obtain%20the%20more%20freedom%20and%20peace&amp;text=72.%20Fifthly%2C%20they%20%5Bthe%20Church%20and%20magistrate%5D%20are&amp;text=and%20does%20obtain%20the%20more%20freedom%20and%20peace" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-86f1b7b339" data-kw="">
<blockquote><p>Yea and the Christian king rules over men as men, and also as Christian-men; he rules over them as men, with a dominion over their bodies, lives and goods by his civil laws, he has also dominion as king over men, as Christians and members of Christ’s kingdom and Church, not over their consciences (for that is proper only to the Father of spirits), but he has a coactive [coercive] power over all men, even pastors, as to cause them do their Christian duties, he has power to compel Church-men in assemblies to determine truth, and to use the keys right, and to preach and use the sacraments according as Christ has commanded in his Word, and to punish them when they do otherwise. … I answer, the infallible rule of judging for both [Church and State] is the Word of God, which speaks home impartially to both, if they will hear, but certainly the king’s civil, kingly coactive power to compel men to do their duty remains the highest and most supreme power on earth, in genere potestatis politicae, in ‘the kind of politic-power’, and pastors and all men may by this power be compelled to do right; as for the abuse of the power, it is no part of the power; and in this kind the king has a negative-politic and kingly suffrage [vote] and voice in all Church assemblies, no ecclesiastical constitution has the force of a [civil] law without the politic suffrage of the civil judge.</p></blockquote>

<blockquote><p>XVII. As extraordinary evils require extraordinary helps, so the Magistrate may do many things in a time of the Church’s gathering, backsliding or corruption which he cannot do so long as the Church is in a well constitut[ed] &amp; reformed condition: But from this to infer that he may demolish the established order and fabric of a right[ly] constitut[ed] and reformed Church, on purpose to give a proof of his extraordinary power, by reducing the same into order again; Or that he may make use of this extraordinary power, when the ordinary and appointed means are to be had, and also in case to effectuate the cure; to infer this (I say) were both impious and incongruous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Banders Disbanded</cite>, … (1681), p. 45</span></figcaption>
